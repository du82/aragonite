["https://www.rogerebert.com/category/far-flung-correspondents"]
title = "Far Flungers | Roger Ebert"
description = "Our Far-Flung Correspondents are cinephiles from all over the world, hand-picked by Roger Ebert to write about movies from their unique international perspectives. They include contributors from (alphabetically) Brazil, Canada, Egypt, Great Britain, India, Mexico, the Philippines, South Korea, Turkey and the U.S. They converge every year at Ebertfest."
full_description = "The Puppet Master Was Right: “Ghost in the Shell” at 30 Wael Khairy A look at the masterful anime three decades after it changed the form. 2 days ago The Timeless Echoes of “The Spirit of the Beehive” Seongyong Cho A Far Flung Correspondent looks at Victor Erice’s 1973 masterpiece, one of Roger Ebert’s Great Movies. 4 days ago On the Hidden Power of “The Hill of Secrets” Seongyong Cho An international correspondent looks at an acclaimed Korean drama. October 2, 2024 Transcending Hell on Earth in Larisa Shepitko’s “The Ascent” Wael Khairy A look at an underrated Russian film, now on the Criterion Channel. September 26, 2024 A Moment in the Spotlight: On The King of Comedy Seongyong Cho A far-flung correspondent checks in on Martin Scorsese’s 1983 masterpiece. August 5, 2024 No Easy Answers: On the Power of The Teachers’ Lounge Seongyong Cho A Far-Flung Correspondent looks at the recent Oscar nominee and Ebertfest film. April 30, 2024 How Do You Live: On the Power of Edson Oda’s Nine Days Seongyong Cho A Far Flunger looks at a great film from 2020 that played Ebertfest last year. April 16, 2024 Ape Shall Not Kill Ape: A Look at the Entire Apes Franchise Gerardo Valero With the imminent arrival of Kingdom of the Planet of the Apes, a Far-Flung Correspondent rewatched every Apes film to date from Charlton Heston to Mark Wahlberg, and beyond. April 8, 2024 Becoming Other: Another Look at Under the Skin Wael Khairy An FFC looks at a Jonathan Glazer masterpiece on its tenth anniversary. March 18, 2024 On the Sustained Emotional Strength of Akira Kurosawa’s Ikiru Seongyong Cho An FFC looks at a masterpiece. January 8, 2024 The Joy of Watching Voy! Voy! Voy! Wael Khairy A look at Voy! Voy! Voy!, Egypt’s submission for the Academy Award. December 31, 2023 A Tough but Terrific Family Drama: Kim Se-in’s The Apartment with Two Women Seongyong Cho A look at Kim Se-in’s 2022 directorial debut. October 12, 2023 Revisiting Sidney Lumet’s The Verdict Gerardo Valero A look back at Sidney Lumet’s The Verdict. August 14, 2023"
