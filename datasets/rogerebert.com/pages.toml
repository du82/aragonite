title = "Interviews | Roger Ebert"
description = "Since he started as film critic for the Chicago Sun-Times in 1967, and began covering movies locally and at international film festivals, Roger Ebert has met and interviewed countless movie idols, artists and unknowns -- some of them even before they became famous. There's hardly a major figure in the history of movies, from the last part of the 20th century into the 21st, that he hasn't encountered."
full_description = "Chicago’s Own Filmspotting Podcast Celebrates 20 Years With Inaugural Festival Zachary Lee The acclaimed podcast kicks off three days of films from throughout the show’s storied history. 1 day ago Talkin’ About His Generation: New Book Chronicles the Making of Millennial Touchstone “Superbad” Donald Liebenson An interview with the writer of a new book about “Superbad.” February 18, 2025 Scott Derrickson Dives Deep into “The Gorge” Zachary Lee An interview with the director of “The Gorge,” now on Apple TV+. February 14, 2025 In the Name of Friendship: Matthew Rankin on “Universal Language” Isaac Feldberg One of Canada’s most idiosyncratic fantasists discusses the links between Iranian cinema, architecture, and cultural exchange. February 11, 2025 Female Filmmakers In Focus: Zeinabu irene Davis on “Compensation” Marya E. Gates An interview with the filmmaker behind the Chicago-set indie landmark. February 5, 2025 This is Just the Beginning: Pamela Anderson on “The Last Showgirl” Marya E. Gates An interview with the star of Gia Coppola’s latest about embracing her actress era and more. January 14, 2025 The Trauma of Inevitability: Brady Corbet and Mona Fastvold on “The Brutalist” Isaac Feldberg An interview with the director and co-writer of our pick for the Best Picture of 2024. January 13, 2025 Dream of Death: Robert Eggers on “Nosferatu” Isaac Feldberg An interview with the writer-director of Nosferatu about immersion, influence, and intimation. January 10, 2025 Cinema Is Freedom: Mohammad Rasoulof on “The Seed of the Sacred Fig” Isaac Feldberg An interview with the director of the award-winning “The Seed of the Sacred Fig”. January 9, 2025 Female Filmmakers in Focus: Maura Delpero on “Vermiglio” Marya E. Gates Maura Delpero on her award-winning film. January 1, 2025 Process the Environment: Rachel Morrison on “The Fire Inside” Robert Daniels An interview with the acclaimed cinematographer about the long road to her directorial debut. December 23, 2024"
