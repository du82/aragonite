full_description = "Christy Lemire Christy Lemire Christy Lemire is a longtime film critic who has written for RogerEbert.com since 2013. Before that, she was the film critic for The Associated Press for nearly 15 years and co-hosted the public television series “Ebert Presents At the Movies” opposite Ignatiy Vishnevetsky, with Roger Ebert serving as managing editor. Christy co-hosts the film review podcast and YouTube show “Breakfast All Day.” She also appears regularly on the Southern California radio shows KPCC FilmWeek and KCRW Press Play. A third-generation Los Angeles native, Christy is a member of the LA Film Critics Association. She lives in Palos Verdes Estates with her husband and son. You can find her on Twitter @christylemire. Latest from Christy Lemire My Dead Friend Zoe Christy Lemire Invader Christy Lemire Kinda Pregnant Christy Lemire Like Father Like Son Christy Lemire Eternal You Christy Lemire Back in Action Christy Lemire Every Little Thing Christy Lemire Sonic the Hedgehog 3 Christy Lemire Dirty Angels Christy Lemire Nightbitch Christy Lemire Wicked Christy Lemire Weekend in Taipei Christy Lemire Juror #2 Christy Lemire Venom: The Last Dance Christy Lemire Gracie & Pedro: Pets to the Rescue Christy Lemire Blink (2024) Christy Lemire A Different Man Christy Lemire My Old Ass Christy Lemire Here After Christy Lemire The Deliverance Christy Lemire"
