full_description = "True/False 2025: WTO/99, Family Album, Land With No Rider Robert Daniels Our second dispatch of the documentary film festival tackles public protest, trans stories, and life on the frontier. Less than an hour ago True/False 2025: Seeds, River of Grass, How Deep Is Your Love Robert Daniels On three docs from the year’s prestigious non-fiction film festival. 1 day ago Chicago’s Own Filmspotting Podcast Celebrates 20 Years With Inaugural Festival Zachary Lee The acclaimed podcast kicks off three days of films from throughout the show’s storied history. 1 day ago A Preview of the 2025 Rendez-Vous with French Cinema Peter Sobczynski A preview of the year’s best U.S. event for Francophiles. 1 day ago A Mathematical Explanation of What is Going to Win Best Picture This Year Daniel Joyaux Our awards expert tries to predict what is going to win the big award through a breakdown of the preferential ballot system. 2 days ago New York International Children’s Film Festival Highlights Original Work From Around the World Brian Tallerico A preview of the great NYICFF, which starts tomorrow. 2 days ago A Salute to the Movies That Got Overlooked During Oscar Season Tim Grierson Academy voters didn’t show these great films any love. We’re not going to make the same mistake. 3 days ago If We Picked the Winners: The 97th Academy Awards Brian Tallerico Our picks for who will win, should win, and should have been nominated for this year’s Oscars. 4 days ago A Look at Every Oscar-Nominated Short This Year Collin Souter Our short film expert analyzes all 15 Oscar-nominated shorts. February 17, 2025 “Anora,” “Shōgun” Win Big with Critics Choice Awards Sarah Knight Adamson A report from this year’s CCA and a list of winners. February 10, 2025 Navigating Sundance as a First Timer Jewel Ifeguni A personal report from the Sundance Film Festival with advice for anyone thinking of attending Park City next year. February 6, 2025 “El Norte” Screening Commemorates Sundance Instit