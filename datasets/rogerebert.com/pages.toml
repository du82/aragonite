["https://www.rogerebert.com/contributors/peter-sobczynski"]
title = "Peter Sobczynski biography & movie reviews | Roger Ebert"
description = "Peter Sobczynski biography & movie reviews | Roger Ebert"
full_description = "Interviews Breakfast Is Served—Again: Alan Rudolph on the reissue of “Breakfast of Champions” October 30, 2024 Peter Sobczynski Peter Sobczynski A moderately insightful critic, full-on Swiftie and all-around bon vivant, Peter Sobczynski, in addition to his work at this site, is also a contributor to The Spool and can be heard weekly discussing new Blu-Ray releases on the Movie Madness podcast on the Now Playing network. He also has his own Substack, Auteurist Class, where he regularly publishes additional reviews. He saw his first movie (“Dumbo”) at the age of three and hasn’t stopped talking about them since. His favorite film is “Buckaroo Banzai,” his favorite filmmaker is Brian De Palma and his favorite actors are Dick Miller and Nastassja Kinski. Dinesh D’Souza once called him a disgruntled leftist and he seriously considered having that printed on business cards. Latest from Peter Sobczynski Festivals & Awards A Preview of the 2025 Rendez-Vous with French Cinema 15 hours ago Inheritance (2025) Peter Sobczynski Alarum Peter Sobczynski Porcelain War Peter Sobczynski It’s Not Me Peter Sobczynski Absolution Peter Sobczynski Freedom (2024) Peter Sobczynski Interviews Breakfast Is Served—Again: Alan Rudolph on the reissue of “Breakfast of Champions” October 30, 2024 Here (2024) Peter Sobczynski My Name Is Alfred Hitchcock Peter Sobczynski Festivals & Awards CIFF 2024: Cloud, Grafted, Parvulos October 23, 2024 Festivals & Awards CIFF 2024: Rita, Listen to the Voices, Peacock October 20, 2024 Bagman Peter Sobczynski The Killer’s Game Peter Sobczynski Dead Money Peter Sobczynski AfrAId Peter Sobczynski Tributes Conversation Piece: Phil Donahue (1935-2024) August 20, 2024 Caligula: The Ultimate Cut Peter Sobczynski Harold and the Purple Crayon Peter Sobczynski Features I’ve Got A Way With Young People: 25 Years of Dick August 1, 2024"
