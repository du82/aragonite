description = "Accessibility Commitment Rolling Stone is committed to ensuring digital accessibility to the widest possible audience, regardless of ability. We are continually improving the user experience for everyone, and aim to comply with relevant accessibility standards, including WCAG 2.1 accessibility standards up to level AA. We are devoting resources and implementing technological improvements to continue enhancing […]"
full_description = '''Accessibility Statement Accessibility Commitment Rolling Stone is committed to ensuring digital accessibility to the widest possible audience, regardless of ability. We are continually improving the user experience for everyone, and aim to comply with relevant accessibility standards, including WCAG 2.1 accessibility standards up to level AA. We are devoting resources and implementing technological improvements to continue enhancing the accessibility of our website and mobile apps. Feedback We welcome your feedback on the accessibility of Rolling Stone to improve your site experience. Please let us know if you encounter accessibility barriers on Rolling Stone, including any video that is not already captioned: E-mail: accessibility@pmc.com Postal address: Rolling Stone Media, LLC, Attn: Accessibility, 11175 Santa Monica Blvd, Los Angeles, CA 90025 We will work with you to provide the information you seek through alternative communication methods, if possible. Our accessibility efforts are ongoing to ensure that our website and mobile site are accessible to everyone. Limitations and alternatives Despite our best efforts to ensure accessibility, there may be some limitations. Below is a description of known limitations, and potential solutions. Please contact us if you observe an issue not listed below. Known limitations: User generated content, such as comments or forum posts: Since this content is created by users it may not include accessibility considerations. Site navigation: Our site navigation has not been fully tested with assistive technologies. We are in the process of fully evaluating and testing the ability to navigate our site using assistive technologies, to remediate any issues we find. Please send us an email at accessibility@pmc.com to report any issues you encounter. Older content: Content created over a year ago may not work well with assistive technologies. This content may have been created before we had processes in place to ensure best practices such as meaningful alternative descriptions for images. Please send us an email at accessibility@pmc.com to report any issues you encounter. blogherads.adq.push(function () { blogherads .defineSlot( 'flexrec', 'gpt-dsk-tab-misc-rail1-uid1' ) .setTargeting( 'pos', ["top","atf","rail1","rail-top"] ) .setSubAdUnitPath("misc\/rail1") .addSize([[300,250],[300,600],[300,251]]) ; }); Flashback: David Johansen Appears as the Ghost of Christmas Past in 'Scrooged' Flashback 1:44 PM Watch the New York Dolls Play 'Jet Boy' and 'Pills' at Their Final Show in 2011 Flashback 12:51 PM Sean Combs Sued by Bad Boy Co-Founder for 'Forced Compliance' With Sex Acts Crimes and Court 10:17 AM 2025 Razzies: 'Madame Web' and 'Megalopolis' Among Big 'Winners' of Hollywood's Worst razzies 9:17 AM blogherads.adq.push(function () { blogherads .defineSlot( 'flexrec', 'gpt-dsk-tab-misc-rail2-uid2' ) .setTargeting( 'pos', ["mid","btf","rail2","rail-mid"] ) .setSubAdUnitPath("misc\/rail2") .addSize([[300,250],[300,600],[300,251]]) ; }); Top stories newsletter A Cultural Force That Transcends Generations Enter your Email By providing your information, you agree to our Terms of Use and our Privacy Policy. We use vendors that may also process your information to help provide our services.'''
