["https://www.rorytravelsanywhere.com/40-lieux-incontournables-a-voir-en-france-escale-culturelle-au-vieux-port-de-marseille"]
title = "40 lieux incontournables a voir en France : Escale culturelle au Vieux-Port de Marseille"
description = "Le Vieux-Port de Marseille, fleuron de l'histoire maritime française, symbolise le cœur battant de la cité phocéenne depuis sa fondation. Ce lieu emblématique témoigne de 2600 ans d'histoire et représente l'âme méditerranéenne de la ville. L'histoire fascinante du Vieux-Port marseillais Carrefour des civilisations et point d'ancrage historique, le Vieux-Port s'est transformé au fil des siècles. […]"
full_description = "Les meilleures ressources pour une fille au pair en Australie : De la préparation à l’intégration Le Vieux-Port de Marseille, fleuron de l'histoire maritime française, symbolise le cœur battant de la cité phocéenne depuis sa fondation. Ce lieu emblématique témoigne de 2600 ans d'histoire et représente l'âme méditerranéenne de la ville. Carrefour des civilisations et point d'ancrage historique, le Vieux-Port s'est transformé au fil des siècles. Aujourd'hui bordé de restaurants et de cafés, il maintient son caractère authentique tout en s'adaptant à la modernité. Fondée en 600 avant J.-C. sous le nom de Massalia par les Grecs venus de Phocée, Marseille s'est construite autour de son port naturel. Cette implantation stratégique a permis à la ville de devenir un centre commercial majeur en Méditerranée, façonnant son identité maritime. Le Vieux-Port reste fidèle à ses traditions maritimes ancestrales. Les pêcheurs vendent leur poisson frais chaque matin, perpétuant une tradition séculaire. Cette activité quotidienne fait du port un lieu vivant où se mêlent habitants, marchands et visiteurs dans une ambiance typiquement méditerranéenne. Le Vieux-Port de Marseille représente le cœur historique et architectural de la cité phocéenne. Cette zone portuaire, fondée il y a plus de 2600 ans, offre un panorama remarquable entre tradition maritime et modernité urbaine. Les bâtiments qui l'entourent racontent l'histoire riche de cette ville méditerranéenne. La Basilique Notre-Dame-de-la-Garde surplombe majestueusement la ville depuis son promontoire. Cette église romano-byzantine, avec sa statue dorée de la Vierge Marie, veille sur Marseille et ses habitants. Les marins la surnomment affectueusement « LaBonneMère ». L'édifice présente une architecture unique, mêlant marbre blanc de Carrare et pierres vertes de Florence. Les visiteurs apprécient sa décoration intérieure somptueuse et la vue panoramique sur la ville. Le Fort Saint-Jean, structure militaire historique, s'unit harmonieusement au MuCEM, créé en 2013. Cette alliance architecturale symbolise la rencontre entre l'histoire marseillaise et sa vision contemporaine. Le MuCEM, avec sa dentelle de béton caractéristique, abrite des collections dédiées aux civilisations méditerranéennes. Une passerelle relie ces deux monuments, permettant aux visiteurs d'admirer la mer et le panorama urbain. Cette zone culturelle témoigne du renouveau architectural de Marseille tout en préservant son identité maritime."
