title = "Registration for Summer RosettaCon 2024 is open – Rosetta Commons"
description = "We are pleased to announce that Summer RosettaCon will be held at Suncadia Resort in Washington from August 5 - 9, 2024. The conference will start on the late afternoon (4-5 pm) of Monday, and will finish on Friday morning after breakfast with the usual hike / activity day. Pre-RosettaCon will not take place as…"
full_description = "Registration for Summer RosettaCon 2024 is open May 24, 2024 We are pleased to announce that Summer RosettaCon will be held at Suncadia Resort in Washington from August 5 – 9, 2024. The conference will start on the late afternoon (4-5 pm) of Monday, and will finish on Friday morning after breakfast with the usual hike / activity day. Pre-RosettaCon will not take place as a separate meeting as the technical talks, discussions and tutorials will be incorporated into the program. REGISTRATION Registration fees support conference sustainability; this fee is non-refundable and is one mechanism to reduce last minute cancellations and preserve our community resources. Note that the early registration deadline is June 15, 2024. Registrations after this date will incur a higher registration fee. Please register at www.rosettacon.org. For the first time, all registrations will go through the same interface. If you need a letter of invitation to apply for a U.S. visa, complete this form. AIRFARE Each attendee is responsible for booking and paying for their own airfare. Inquire about reimbursements with your PI and your home institution. We suggest you book your airfare as soon as possible to avoid price hikes. TRANSPORTATION TO AND FROM SUNCADIA Transportation will be provided via a third-party Shuttle service for which you can get your ticket here. Shuttles will run on a schedule on Aug 5th and 9th. The deadline for signing up for your shuttle is July 22. Since Butler is a third-party provider that requires planning of vehicles, they won’t be able to accommodate late or same-day registrations, so please plan ahead. You can also drive your own car or rent a car to drive up to Suncadia. Rosetta Commons will not reimburse for these expenses. ACCOMMODATIONS Rosetta Commons is covering the cost of accommodations for Rosetta Commons member labs. Please indicate on the registration form if you need accommodation and for which days. CONFERENCE SUPPORT FUND Rosetta Commons has increased the number of travel grants to 30 (more than ever before) to provide needs-based travel support. Personnel from recently established labs, international labs outside of the US, labs experiencing limited funding, and individuals without access to external grant-supported travel through their labs are highly encouraged to apply here. The deadline to apply for conference support is June 10 but we encourage you to apply early. The first round of awards will be announced by May 15 and the second round by June 15 to allow awardees to book their flights in time. Awardees will be invited to book their travel through Navan, so if you are applying for the award, please wait to book your travel arrangements until awardees have been announced. CONFERENCE UPDATES To allow external attendees to see all information that Rosetta Commons members have access to, we’re moving away from the Wiki for announcements. When you register for Rosetta Con, you will be asked to create an account on the website, where all information will be available to you. This link is provided in your registration confirmation email. You can find further information here. If you have any questions, you can email info@rosettacon.org. Sincerely, the organizers Gabe Rocklin – Northwestern University Gaurav Bhardwaj – University of Washington Julia Koehler Leman – Open Molecular Software Foundation Camille Mathis – Johns Hopkins University David Nannemann – Rosetta Design Group All Posts Posted in Events"
