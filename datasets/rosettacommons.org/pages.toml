title = "Getting Started – Rosetta Commons"
description = "Getting Started Servers - No computational experience necessary Collapse The simplest way to try out Rosetta for your problem is to use one of the many web-interface servers ROSIE, which usually allow small academic jobs for free. For commercial use, Bench and Engine provide secure, cloud-based access to automated Rosetta and AI-driven protocols, with robust support for protein modeling…"
full_description = '''Getting Started Servers - No computational experience necessary Collapse The simplest way to try out Rosetta for your problem is to use one of the many web-interface servers ROSIE, which usually allow small academic jobs for free. For commercial use, Bench and Engine provide secure, cloud-based access to automated Rosetta and AI-driven protocols, with robust support for protein modeling and design. GUIs - No computational experience necessary Expand Rosetta does not have a classical graphical user interface. However, many of our developers have simplified the process of using Rosetta somewhat more interactively. For instance, the FoldIt software, which runs atop Rosetta, has a non-game "professional mode" which allows direct, freeform manipulation of protein structures with live scoring and access to simple protocols like rotamer packing and minimization. Command Line Interface - Requires basic command syntax and scripting skills Expand The Command Line Interface is Rosetta's original form, and still the most common way to use Rosetta. Due to the complexity and expense of macromolecular modeling, Rosetta is most often run via a simple command-line interface on distributed-cluster supercomputers. Rosetta offers many different executables, each for addressing a different macromolecular modeling problem. Our documentation explains how to compile and run Rosetta in environments like these, and most demos are built using the command-line tools. RosettaScripts - For the beginning to intermediate user and developer Expand If you want to tailor your molecular modeling workflows by combining elements from various Rosetta protocols, we recommend RosettaScripts. As an integral part of the Rosetta Software Suite, this XML script interface not only simplifies the creation of customized protocols for complex design tasks but also ensures seamless operation across supercomputers and distributed computing environments. Its flexibility and power enable the efficient prototyping and execution of sophisticated computational experiments. PyRosetta - For the intermediate to advanced user and developer Expand PyRosetta is the Python interface to Rosetta through bindings that allow you to access, modify, and extend Rosetta C++ objects. PyRosetta is ideal for creating new protocols by combining existing routines or writing new Movers and score terms. It can also be used for rapid prototyping of new ideas and protocols and to teach biomolecular modeling concepts in Rosetta. C++ interface - advanced user and developer Expand Writing Rosetta code in C++ allows you the most flexibility to add new features, create novel modeling frameworks, and develop your own custom protocols by combining objects and functions. Required skills include proficiency in C++ (with a strong grasp of object-oriented programming), familiarity with the Rosetta software's architecture, and the ability to write clean, efficient, and well-documented code following the project's coding standards and guidelines. Our C++ Bootcamp teaches these concepts to the intermediate user and developer.'''
