description = "Diversity, Equity and Inclusion in the Rosetta Commons The Rosetta Commons exists to enable shared developments and discoveries. We believe in the power of community to accelerate science. We strive to make our community inclusive and equitable for people of all backgrounds, regardless of race, ethnicity, nationality, gender identity, sexual orientation, disability status, age, belief…"
