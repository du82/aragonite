["https://rosettacommons.org/education"]
title = "Education – Rosetta Commons"
description = "Education Hub REU RAMP Graduate Program Upcoming Workshops European Bootcamp Expand November 2024 C++ Bootcamp Expand Date: January 2025 Course Description This week-long course is designed to equip you with the foundational knowledge and skills for  C++ Rosetta code development to effectively use and contribute to the Common's code base. WRC Bootcamp Expand February 2025…"
full_description = "Education Hub REU RAMP Graduate Program Upcoming Workshops European Bootcamp Expand November 2024 C++ Bootcamp Expand Date: January 2025 Course Description This week-long course is designed to equip you with the foundational knowledge and skills for C++ Rosetta code development to effectively use and contribute to the Common’s code base. WRC Bootcamp Expand February 2025 Bootcamp Pro Expand April 2025 REU Bootcamp Expand June 2025 RaMP Bootcamp Expand July 2025 PyRosetta Bootcamp Expand September 2025 This week-long bootcamp is targeted to new protein designers just getting started in the field and aiming to develop foundational knowledge and skills to use well-established tools. The learning progression of this bootcamp is broken into two sections. Section I includes: (1) Rosetta protein biophysics basics/conceptual fundamentals; (2) PyRosetta structure and syntax (Pose, Score Function, Movers); (3) modeling protocols in PyRosetta (Minimization, Packing and Relaxing); (4) Introduction to Rosetta Community and coding conventions. Section II includes: (1) ML Protein modeling algorithm architecture, training/testing basics, (2) survey of ML-based modeling options; (3) review of ML-based protein design and protein generation algorithms (e.g ProteinMPNN and RFDiffusion). By the end of this workshop, participants will be able to select and apply appropriate PyRosetta and/or ML-based methods for their projects and troubleshoot common errors. Additionally participants will learn about the Rosetta Commons and the resources and opportunities the community provides, and make new connections with Commons members from outside their own research group. ML-Bootcamp Expand Recent machine learning-based technologies for protein modeling and design are largely independent of traditional C++ Rosetta codebase but highly relevant to our community’s professional development. The focus of this bootcamp is to survey a practical selection of ML-based modeling and design tools. You will explore them in a hands-on manner and gain a high level understanding of how they work by considering the inputs/outputs, strengths/weaknesses, and appropriate use-cases for each tool. This is a relatively novice-level course. You will not learn how to build or train models. Rather, the curriculum will be focused on understanding and using existing tools. Prerequisite skills include proficiency with Python, PyMol, and the command line. You must also have cluster access and be committed to completing all homework assignments prior to arriving at the bootcamp (in other words, have all required software installed and working on your cluster). By the end of this workshop, participants will be able to apply their learnings to their own protein modeling and design projects by being able to identify appropriate ML-based methods for the project, adapt and run the tools, and troubleshoot common errors. In other words, you will be able to apply existing tools to address your protein design research problem. Makerere Workshop Expand TBD"
