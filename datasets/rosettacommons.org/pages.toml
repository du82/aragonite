full_description = "Service Awards On this page you can find all the Service Awards given by Rosetta Commons for contributing to the community. 2023 Deniz Akpinaroglu Expand For teaching the REU and Postbac bootcamps, working tirelessly on revamping the curriculum, and being incredibly committed to helping the next generation of Rosetta scholars. Justyna Krys Expand For co-organizing European RosettaCon in May 2022, taking great care of every single participant, and helping organize the first in-person meeting after the COVID pandemic. 2022 Sergey Lyskov, Rocco Moretti Expand For their invaluable, consistent support of the Rosetta framework and outreach Beth Kolbaba-Kartchner, Joanna Macnar, Rob Alberstein, Parisah Hosseinzadeh, Matt O’Meara, Ashley Vater, Joey Lubin Expand To the JEDI team Julia Koehler Leman, Ashley Vater, Andy Watkins, Brian Weitzner Expand To the FoR Task Force, for their commitment to the community and their incredible amount of work put into envisioning the future of Rosetta Tina Nguyen Expand For her crucial help in reorganizing RosettaCon 2021 Josh Miller Expand For promoting Foldit via a weekly newsletter, a Discord channel, and much much more. This increases visibility for Rosetta tremendously, especially during times of COVID. Ashley Vater Expand For her leadership and support of the JEDI committee Camille Mathis Expand For her tremendous help in organizing the REU and postbac programs. Liz Schneider Expand For her excellent support in organizing RCON, RWC and much much more. 2020 Brian Koepnick, Ian Haydon Expand For their Foldit video series. This award recognizes their efforts to generate regular excellent, engaging videos with FoldIt updates, in particular during the present corona virus pandemic. The video series increases visibility for Rosetta tremendously. Morgan Nance, Una Natterman, Joey Lubin Expand For their JEDI contributions. Morgan: Strengthen the conversation within the Rosetta developer community about respectful collaboration on a shared software project - inclusion of new developers, use of inclusive (coding) language. Una: Continued leadership and dedicated role in the JEDI committee (initiative and realization of for the Rosetta BLM statement & implementation of matching donation scheme, and much more). Joey: Coordination of the diversity conference contingencies for active increase of diversity in our community. 2019 Jack Maguire Expand For his significant contributions to the Rosetta code that benefit the whole Rosetta community, including many bug fixes in core layers, constant support of others on Slack, review of pull requests and much more. Parisa Hosseinzadeh Expand For her outstanding efforts to making the Rosetta community more inclusive and accessible, by establishing and co-organizing a wide variety of different events with significant impact (career panels at RosettaCon 2018 & 2019, “Science at the market”, efforts to promote inclusion in STEM and many more). Ian Hayden, Shane Caldwell, Indigo King, Brian Weitzner Expand Career panel organizers 2018 Julia Koehler Leman Expand For taking on a wide variety of organizational responsibilities, including the organization of Winter RosettaCon, teaching at bootcamp, the organization of several rosetta papers that involve the whole community, pushing the implementation of proper scientific testing, and many more. 2017 Jared Adolf-Bryfogle Expand Prototyped Git/GitHub, Frequent contributor on the Rosetta Forums, Added many documentation pages to the Wiki, Helped organize a documentation XRW, Created the code template framework within Rosetta Sergey Lyskov Expand Created and maintains Rosetta testing servers, Created and maintains PyRosetta, Created and maintains the Rosie server. Andrew Leaver-Fay Expand A primary developer of Rosetta3, Regularly helps developers in the community with their projects, Created the beautifier, Implemented XML schema for Rosetta so that all Rosetta Script tags are documented, Teaches 2-3 Rosetta bootcamps a year to undergraduates, graduate students and PIs, Frequent organizer of Rosetta developer meetings, Has run and participated in several XRW, Developed the Residue Selector system in Rosetta Scripts 2016 Rebecca Alford, Una Natterman Expand Strengthening the community of women in the Rosetta Commons. Vikram Mulligan Expand Constant efforts to improve Rosetta and willingness to help other developers and users Andy Watkins Expand Leading the effort to help Rosetta recognize a greater repertoire of biological and bioengineered molecules. 2015 Jason Labonte Expand Fixing compiler warnings in Rosetta. Rocco Moretti, Steven Lewis, Sharon Guffy, Jeliazko Jeliazkov, Kale Kundert, Elizabeth Lagesse, Andy Watkins Expand Documentation XRW team. 2013 Sam DeLuca, Brian Weitzner Expand The Git transition team Tim Jacobs, Sam DeLuca, Brian Weitzner, Matt O'Meara Expand Rosetta Bootcamp Teaching Assistants 2012 Evan Baugh Expand PyRosetta documentation and tutorials 2011 Meiler Lab Expand Rosetta tutorials, classes and documentation 2010 Steven Lewis Expand User support, postings to the forum Quick links Team FAQs Documentation Contact Us"
