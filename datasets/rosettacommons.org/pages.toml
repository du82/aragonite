full_description = "Machine Learning Methods for Protein Modeling and Design - A Rosetta Bootcamp Want to learn the leading Machine Learning-based computation biomolecular structure prediction and design methods? These videos capture the 2024 Rosetta-sponsored Machine Learning Bootcamp. This series is instructed by Nick Randolph (UNC Chapel Hill) and was supported by the Rosetta Commons, the National Science Foundation, and UC Davis. Watch the videos WRC Bootcamp Elevate your skills in protein-protein interaction design and gain insights into the Nobel Prize-winning AI & Biophysics-based tools shaping the future of protein engineering. February 24-26, 2025 Cambridge, Boston Industry Introductory & Intermediate Course Description Registration Rosetta Workshop The workshop aims to educate and train academic and industry users on the Rosetta software suite. Rosetta is freely distributed to the academic community by RosettaCommons. Industry usage includes licensing fees that support research and development of Rosetta software. March 3-5, 2025 Nashville Industry & Academics Introductory Course Description Registration (closed) C++ Bootcamp This week-long course is designed to equip you with the foundational knowledge and skills for C++ Rosetta code development to effectively use and contribute to the Common’s code base. Date: TBD Nashville Academics Advanced Course Description Registration (coming soon) REU Bootcamp The REU program starts with one week of Rosetta Code School (June 2 through June 6), where you will learn the inner workings of the PyRosetta code and community coding environment, so you are fully prepared for the summer! June 2-6, 2025 Application deadline: 2/3/2025 Undergraduate Introductory Learn more Apply here RaMP Bootcamp Trainees will learn the inner workings of the Rosetta Python code and community coding environment, so you are fully prepared to do research using the software throughout the year-long program Date: TBD Application deadline: 3/1/2025 Postbaccalaureate Introductory Learn more Apply here PyRosetta & ML Bootcamp This week-long bootcamp is targeted to new protein designers just getting started in the field and aiming to develop foundational knowledge and skills to use well-established biomolecular modeling and design tools. January 6-10, 2025 Davis Academics, Developers & Users Intermediate Course Description Registration (closed)"
