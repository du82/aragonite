full_description = "Announcing the Winners of our Science Image Contest May 2, 2024 Dear Rosetta Community, We are thrilled to announce the winners of our recent Science Image Contest! The response we received was great, with an array of breathtaking images showcasing the beauty and complexity of our communities’ scientific research. After much deliberation, we have selected the top three submissions that stood out for their creativity and visual impact. Without further ado, let’s congratulate our winners: 1st Place: Tom Schlegel – $500 Tom’s image captivated us with its stunning detail and artistic composition. Congratulations, Tom, on your well-deserved first-place win! Colorful blender rendering of the lumazine synthase from the hyperthermophile Aquifex aeolicus. 2nd Place: Ian Haydon – $300 Ian’s submission impressed us with its striking visuals and unique perspective. His image effortlessly combines artistry with science. Congratulations, Ian, on securing second place! Analogous to perfectly straight, twist-free pieces of lumber, this new class of de novo designed proteins can be attached together or made longer to create a wide range of intricate nanoscale objects. 3rd Place: Jorge Gonzalez – $200 Jorge’s image caught our attention with its mesmerising beauty and thought-provoking content. Congratulations, Jorge, on achieving third place! In the loom of evolution, positive design interweaves stability, while negative design unravels the trappings of the woven and unraveled landscape, like silk threads in a metamorphosis, following the principle of minimal frustration of protein folding. We will be reaching out to the winners shortly to arrange prize distribution. By participating in the contest, all entrants have agreed to share the copyright with the Rosetta Commons, allowing us to feature their images on our website and related communications. We would like to extend our heartfelt thanks to everyone who participated in the contest. Best regards, The Rosetta Commons Website Team All Posts Posted in Blog post, Events"
