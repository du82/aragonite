full_description = "Conda Channel Installation October 29, 2024 Team, I am happy to announce that classic Rosetta is now available as a package in RosettaCommons Conda channel. To install it simply add RC channel address (instructions below) and run conda install rosetta. – Hope this helps! All binaries are built using serialization and cxx11thread extras. Currently RosettaCommons has two mirrors of this channel. To use them please edit ~/.condarc and add snippets for either East or West mirrors: Example ~/.condarc for US WEST coast (if unsure use this mirror): Channels: – https://conda.rosettacommons.org– defaults Example ~/.condarc for US EAST coast: Channels: – https://conda.graylab.jhu.edu– defaults – Sergey Lyskov All Posts Posted in Getting Started"
