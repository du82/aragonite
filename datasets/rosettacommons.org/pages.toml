lleagues, scientists, past lab members, and PIs —… Read More Conda Channel Installation Team, I am happy to announce that classic Rosetta is now available as a package in RosettaCommons Conda channel. To install it simply add RC channel address (instructions below) and… Read More The Future of Rosetta is Now. For a long time, the core of the Rosetta Commons value and impact has been found in the people as much as the software. While Rosetta’s technical development and contributions… Read More Latest News Search A global commitment to the responsible development of AI tools Mar 15, 2024 Dear Rosetta community, Scientists in our community led an effort to develop a framework for the responsible development of AI tools for the life sciences.… Read More Announcing Rosetta’s Transition to a Public Repository (including Licensing Changes) Mar 8, 2024 Dear Rosetta Community and users of Rosetta, We’re excited to announce that we have moved the Rosetta code repository to a public repository! We have… Read More Exploring new grounds: Introducing Suncadia Resort for Summer RosettaCon 2024 Feb 15, 2024 Hello friends of Rosetta, We’re thrilled to announce an exciting new chapter in our community’s journey! After 20 years of wonderful memories at the Sleeping… Read More Future of Rosetta Task Force Update Feb 2, 2023 The FoR Task Force would like to share this update with the Rosetta Commons community. One year ago, at the start of 2022, the Rosetta… Read More De novo proteins and where to find them – RosettaCon 2022 Jan 5, 2023 There has been a lot happening recently in protein design, and it is easy to get lost in the daily flood of new papers and… Read More October update from Future-of-Rosetta task force Oct 19, 2022 Hello Rosetta community and friends of Rosetta, We wanted to give you a brief monthly update about the things that are going on in the… Read More Proposal for the Future of Rosetta Jun 17, 2022 Dear friends, colleagues, and supporters of Rosetta: I’m sure you are all aware of the rapid changes in our field of biomolecular structure prediction and… Read More Repacking the Community Nov 18, 2021 Summer RosettaCon JEDI Session: Repacking the community At Summer RosettaCon 2021, we did not host an invited talk on Justice, Equity, Diversity, and Inclusion as… Read More Streamlining the RosettaScripts Interface: RosettaScripts Type-hinting in VS Code Sep 15, 2021 RosettaScripts Type-hinting in VS Code By Dr. Vikram Mulligan, Research Scientist, Flatiron Institute The RosettaScripts scripting language began as a loose XML-like language with informal… Read More « Previous 1 2 3 4 Next » Load More"
