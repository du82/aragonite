title = "Labs – Rosetta Commons"
description = "Ingemar AndreLund University Modeling and design of large, symmetric protein complexes.  Large protein complexes carry out some of the most complex functions in biology. Such structures are often assembled spontaneously from individual components through the process of self-assembly. A fundamental challenge in biology is to understand how protein subunits have evolved the remarkable ability to…"
full_description = "Search Ingemar AndreLund University Modeling and design of large, symmetric protein complexes. Large protein complexes carry out some of the most complex functions in biology. Such structures are often assembled spontaneously from individual components through the process of self-assembly. A fundamental challenge in biology is to understand how protein subunits have evolved the remarkable ability to spontaneously self-assembly into complex structures and to characterize the interactions, assembly pathway and three-dimensional structures of such protein assemblies. The concept of self-assembly is relevant not only in the study of naturally occurring systems, but as a design principle in the engineering of novel protein assemblies. We develop computational methods to predict the 3D structure of protein assemblies at high resolution, and to rationally design novel protein assemblies. These are then characterized using experimental methods Chris BahlAI Proteins De novo protein and peptide design, design of protein interactions, design of protein properties Protein-based medicine is transforming healthcare, and we are working to accelerate this transformation. To do this, we design biologic drugs, as well as create tools to facilitate drug discovery. We design novel proteins and peptides de novo, and we engineer existing proteins to improve or modify their properties. We place a major emphasis on high-throughput science and leverage extensive laboratory automation David BakerUniversity of Washington The Baker Lab demonstrated proof-of-concept for de novo protein design with the design of TOP7, a novel protein with a fold not found in nature, and later developed general principles for designing hyperstable proteins with a wide diversity of folds. With the capability of designing stable protein structures in hand, we are developing methods for stabilizing both linear and complex epitopes from pathogen proteins and have shown that these can elicit neutralizing antibodies in animals, opening up computational design approaches to developing improved vaccines. More recently, we have developed a guided diffusion model for protein design called RFdiffusion and are using it to create even more complex structures and functions. We are also developing general methods for designing new catalysts and have used this approach to generate enzymes for a number of reactions not catalyzed in nature. We have developed an approach to computationally designing self-assembling nanomaterials and are now developing these materials for targeted drug delivery and vaccine applications. We’re always looking for new people to join our efforts. Our philosophy is that the more closely interacting a research group is, the better the science and the more fun overall. Patrick BarthEPFL Lausanne Modeling and design of transmembrane proteins. Our long-term goal is to understand how ligand/ membrane receptor/ downstream effector systems transmit specific signals across biological membranes and to exploit this knowledge to reengineer signaling pathways. We address these objectives using a combination of computational and experimental approaches to model, design and reprogram ligand/ receptor/ effector interaction networks. Our long-term goal is to deconstruct the complex function and quantitatively describe the basic principles underlying these signaling networks. Gaurav BhardwajUniversity of Washington Peptides offer attractive opportunities for drug design as they combine the stability of traditional small-molecule therapeutics with the specificity and potency of larger antibody-based drugs. However, peptide drug discovery so far has mostly relied on a limited number of natural peptide scaffolds or screening of random combinatorial peptide libraries. Our lab focuses on developing computational and experimental methods for precisely designing peptides for targeting therapeutic proteins. Areas of focus in the lab include the design of new antibiotics, antivirals, and anti-cancer peptides. In parallel, we have also focused on developing design principles for peptides with enhanced cellular permeability, oral bioavailability, and blood-brain barrier traversal. More recently, we have focused on developing machine learning-based methods for generating peptides with diverse structures and functions Sinisa BjelicLinnaeus University The laboratory is highly interdisciplinary combining techniques across molecular modeling and experiments. The main goal of our research is to build proteins and small-molecules with therapeutic properties. Generally, we use a combination of computational molecular modeling methods (ROSETTA, MD, docking, computer scripting, etc) to theoretically predict interactions between a designed molecule and a drug target. To validate our modeling efforts, in the next step, our designs are functionally assessed by experimental techniques. Here we employ a range of basic biochemistry techniques for protein expression/purification, molecular biology, determination of molecular interactions, etc Richard BonneauPrescient Design, Genentech Ab initio protein structure prediction, modeling and design of peptide-based ligands. My lab is focused on a number of computational biology problems that, if solved, would remove key bottlenecks in biology and systems biology. We focus on two main categories of computational biology: learning networks from functional genomics data and predicting and modeling protein structure. In both areas I have played key roles in solving unsolved problems and achieving critical field-wide milestones. In the area of structure prediction we were early contributors to the Rosetta code; a platform for structure prediction, design and docking. In the area of network inference we worked on two computational methods that were used to demonstrate the first predictive genome-wide model of regulatory dynamics (i.e. the first case where a genome-wide model could predict the whole transcriptional state of cells at future time points not part of the training set). Both network inference and protein structure prediction remain grand challenges and in spite of our progress much exciting work remains to be done in the coming years as we continue to improve, scale and apply these methods Phil BradleyFred Hutchinson Cancer Center My group's research is focused on developing predictive models of molecular recognition using high-resolution structural modeling. We are currently working to predict the specificity of protein-DNA and protein-peptide interactions. We develop and apply new algorithms for molecular modeling within the framework of the Rosetta software package, a set of tools for the prediction and design of protein structures and interactions. Ben BrownVanderbilt University Protein dynamics are intimately tied to biological function and can enable processes such as signal transduction, enzyme catalysis, and molecular recognition. Whether in the setting of disease or when responding to different pharmacological agents, changes in protein dynamics frequently lead to biological consequences. My lab develops and applies a combination of physics and AI methods in computer-aided drug design and protein dynamics to design small molecules targeting flexible proteins. We are particularly interested in modeling largescale induced-fit changes at a scale that can be applied to high-throughput virtual screening of ultra-large chemical libraries. Further, we model the effects of disease-causing mutations on protein configurational dynamics to guide therapeutic decision-making in collaboration with physicians and physician-scientists Christopher BystroffRensselaer Polytechnic Institute My lab studies protein folding and design. Understanding the pathway of protein folding may be the key to better algorithms for protein design. We are focusing our protein design work on green fluorescent protein (GFP), with the goal of understanding its folding and its dynamics, and to harness its intrinsic reporting ability to create programmable fluorescent biosensors, capable of specifically detecting peptides and proteins. We develop software that runs on massively parallel clusters such as CCNI. We synthesize and screen computationally designed molecules in the lab using molecular biological techniques, and then subject the proteins to biophysical analysis and X-ray crystallography Zibo ChenWestlake University The focus of our lab is to program biological behaviors by designing de novo proteins that encode information and collectively carry out user-defined computations in test tubes and mammalian cells. Research projects in the lab span from fundamental questions to real-world applications, and can be roughly categorized into two directions: 1) Molecular Computing with Protein Circuits. We design protein circuits that can programmably and robustly carry out computations both inside and outside of cells. Such circuits allow one to predictably control cell functions. Circuit components are proteins designed from scratch using Rosetta, which enables full customization of their functionalities at the single molecule level. 2) Programmable Self-assembly of Proteins. Proteins in nature self-assemble into cages, fibers, sheets, and crystals that are critical to cellular functions. In most cases, the algorithms governing such assemblies are embedded in local interactions between adjacent proteins, allowing complex structures to autonomously arise from simple building blocks. We use Rosetta to design information-bearing proteins that programmably assemble into desired shapes, which can provide versatile supramolecular structure motifs to study and alter cellular functions Seth CooperNortheastern University Foldit, citizen science, and crowdsourcing. Foldit is a video game that allows players to contribute to protein structure prediction and design. We are exploring how humans and computers working together can lead to solutions to challenging problems Jacob CornETH Zurich The Corn Lab develops and uses next-generation genome editing and regulation technologies. We work on both fundamental biological discovery and potential therapies for human genetic diseases. Our focus is the mechanisms by which cells repair their DNA, maintain and differentiate hematopoietic stem cells, and use ubiquitin signaling to propagate cellular signals. Through technology development, mechanistic cellular biochemistry, and translational projects, we are working to unravel complex cellular phenotypes to further biological understanding and improve human health Bruno CorreiaEPFL Lausanne The Correia Group is driven by a passion for expanding nature’s repertoire by designing novel functional proteins for practical purposes such as therapeutics, vaccines, biosensors, and others. Rhiju DasStanford University Modeling and Design of RNA. Our lab seeks an agile and predictive understanding of how nucleic acids and proteins code for the activities of living systems. We are creating new computational and chemical tools to tackle structure prediction of protein and RNA puzzles, the biophysics of functional and random RNAs, and the design of new RNA shapes and switches. William DeGradoUCSF Our lab focuses on the structural characterization of membrane proteins and the de novo design of proteins to understand biological processes related to human disease and to develop novel therapeutics. Our research spans protein design, membrane protein design, metalloprotein design, chemical biology and medicinal chemistry, structural and chemical biology approaches to neurodegenerative diseases, and bacterial sensing. We leverage advances in machine learning, structural biology, and biochemistry to create proteins with new functionalities, understand protein folding and interactions, and develop drugs targeting diseases like COVID-19 and organ fibrosis Frank DiMaioUniversity of Washington Structure-determination from sparse and noisy experimental data; crystal structure refinement. Methods for conformational sampling and protein forcefield development Kevin DrewUniversity of Illinois Chicago The Drew Lab studies macromolecular assemblies in cells. These assemblies, made up of mostly proteins and nucleic acids, are responsible for most biological functions. We are specifically interested in learning how these assemblies function mechanistically and how they relate to human disease. We do this using biochemical, computational, and proteomic approaches. We aim to uncover the identities of assembly components, determine their 3D structure, and modulate their activity Roland DunbrackFox Chase Cancer Center Areas of focus include: modern statistical analysis of important structural features in X-ray and cryo- EM structures; structural bioinformatics and high-throughput deep-learning-based structure prediction of GTPases, kinases, and antibodies and other proteins involved in cancer biology and therapeutics; and increasing the impact of structural biology in the applications of precision medicine in cancer research. Eric FischerDana Farber Cancer Institute The Ubiquitin Proteasome System is involved in virtually any cellular process and frequently implicated in human diseases. The Fischer lab combines structural biology, cell biology, and high throughput biology approaches to understand the mechanistic principles that govern signaling through the ubiquitin proteasome system. We leverage these insights to propose and test new avenues of therapeutic intervention, such as targeted protein degradation or SPLiNTs. Our work has contributed to the now widespread application of targeted protein degradation in drug development and as a powerful tool to study biology Sarel FleishmanWeizmann Institute of Science Computational design and experimental characterization of novel protein function Design principles of molecular recognition in antibodies and enzymes Molecular recognition and design of interactions in biological membranes. Ora FurmanHebrew University Modeling and design of peptide-protein interactions. Our laboratory consists of interacting scientists that are interested in improving our basic understanding and manipulation of interactions between proteins. This embraces different levels of resolution and scale: starting from the basic atom - level details of interactions; continuing to prediction and characterization of specific interactions; and finally addressing the ultimate question of their role within the context of a cell and a whole organism. We use computational tools, including structure-based computational prediction and manipulation of specific interactions, analysis of evolutionary signals hidden in sequences, and large-scale integration of this data by machine-learning approaches. Jeffrey J. GrayJohns Hopkins University Protein docking, antibody engineering, glycoproteins, membrane proteins. My lab’s research focuses on computational protein structure prediction and design, particularly protein- protein docking,"
