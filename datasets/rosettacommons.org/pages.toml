["https://rosettacommons.org/software/licensing-faq"]
title = "Licensing FAQ – Rosetta Commons"
description = "FAQ - Frequently Asked Questions This document is intended to help Rosetta Users, Developers, and Licensees understand the organizational structure of the Rosetta Commons and its approach to licensing Rosetta. It clarifies the roles, obligations, and benefits of a Developer within a Rosetta Commons lab and how people can interact with the Rosetta community and…"
full_description = "FAQ - Frequently Asked Questions This document is intended to help Rosetta Users, Developers, and Licensees understand the organizational structure of the Rosetta Commons and its approach to licensing Rosetta. It clarifies the roles, obligations, and benefits of a Developer within a Rosetta Commons lab and how people can interact with the Rosetta community and code base while employed outside of academia. This is not a legally binding document. Introduction Rosetta is a massive, integrated toolset made of many software modules that together form an expressive programming language for modeling biomolecules. Rosetta has been used to achieve many key “firsts” in protein modeling and design, including the first accurate solutions to the de novo structure prediction problem and the first novel protein fold designed by humans, and it continues to break new ground every year. Rosetta has already led to the creation of new drug candidates and products, and its application in this space is only accelerating. There is concomitant growth in the number of companies licensing Rosetta and the demand for scientists skilled in its use. Many examples of molecules discovered with help from Rosetta are described in the literature or public media, and at public presentations by companies like PvP Biologics, Genentech, and Pfizer. There are likely many more Rosetta-designed molecules currently in development at biopharma firms than have been publicly disclosed. Given the seemingly limitless functional capabilities of proteins, it is likely that in the future Rosetta-designed molecules will be useful and valuable in fields beyond medicine. It is important for Rosetta Developers to understand how the code they write is being managed and licensed, and the benefits that this brings to the Rosetta community as a whole. The Rosetta software package has been collaboratively developed over the years by hundreds of contributors from dozens of Universities and other organizations, unified under a single structure: the Rosetta Commons. The Rosetta Commons is both a legal and organizational structure that ensures that we can all work together to contribute to and benefit from Rosetta. One of the main reasons Rosetta has become best-in-class in numerous applications is that the Rosetta Commons structure encourages openness, collaboration, and collective extension of the core code base in many different scientific directions. Most other tools in protein modeling are much more specialized and fragmented, resulting in limited flexibility, slower innovation, and difficulty attracting and inspiring new innovators. FAQ Licensing Expand Is Rosetta open source? No. The Rosetta source code is made freely available for academic and not-for-profit research, but commercial entities must pay an annual licensing fee for access. There are two main reasons the Rosetta community manages the Rosetta source code in this way. First, this model brings valuable revenue to the community that is reinvested to support further scientific and technical development of Rosetta. Second, this model facilitates community cohesion through a social contract of sorts: members of the community enjoy concrete benefits, but they also have an obligation to be productive and contributing members of the community rather than acting entirely in their own self-interest. If Rosetta were made entirely open source, this community cohesion would partially or entirely dissipate, and Rosetta development would become more fragmented and lose potency. What is the current Rosetta licensing model? The Rosetta Commons approach to licensing Rosetta is based on two premises. First, making the software freely available to not-for-profit users encourages wider usage and adoption of Rosetta, amplifying its role in the march of science. Second, if for-profit entities use Rosetta in their commercial endeavors, some financial benefit (in the form of a software licensing fee) should flow back to and be reinvested in the Rosetta community. UW exclusively manages Rosetta licensing on behalf of the Rosetta Commons. The Rosetta License is free-of-charge for academic/non-profit/government entities, while commercial entities pay a licensing fee on an annual basis. This funding benefits the community as a whole by supporting, for example, RosettaCon and other conferences and workshops, key developers that play an important community-focused role by maintaining and improving the quality of the code base, and community-oriented research projects in Rosetta Commons member labs. How does the Rosetta license affect me as a developer? As an entrepreneur? Academic/non-profit/government entities and commercial entities are able to make contributions to the Rosetta code base after signing a Contributor License Agreement. Rosetta cannot be redistributed by licensees (unlike the Linux kernel, the Git version control system, or other free and open source tools you may be familiar with). In order to execute all of the rights, privileges, and financial obligations of the License, all academic and commercial developers agree to non-exclusively license the copyright of their software contributions to the Rosetta codebase to the UW, acting as the lead institution of the Rosetta Commons. This license is a precondition for joining the Rosetta community and contributing to its goals, and applies to any contribution, comment, or idea made to the Rosetta code base, whether rejected or accepted. It should be noted that you do not sign over your rights to patentable products (e.g., novel and useful proteins) generated with the help of Rosetta. There are numerous examples of people using Rosetta to generate new IP that resulted in patents and/or served as the basis for forming new companies. How is Rosetta distributed and how is the license verified? Rosetta is currently distributed to licensees as an archive of the complete source code for each release, or through access to the Github repository. There are no runtime authentication mechanisms in place, which serves to facilitate modifying and running Rosetta in any environment. What types of commercial licenses does the Rosetta Commons offer? Commercial Research License: Allows the licensee to use the software for research purposes and/or to develop derivative products. It explicitly forbids the repackaging, redistribution, or relicensing of the product in any way. Numerous large pharma companies have Commercial Research Licenses to Rosetta. It should be noted that the IP associated with products derived from use of Rosetta (e.g., molecules of therapeutic value) belongs to the entity that creates these products; the Rosetta Commons has no reach-through into such IP. Company Contributor License Agreement: This agreement allows specific, named employees of an organization with a Commercial Research License to contribute software changes to the Rosetta code base. The agreement is based on the widely used Apache Corporate CLA and is available from UW CoMotion upon request. Industry developers have the same obligations as all other Rosetta Commons members (e.g., non-exclusive license of the copyright of their contributions to the Rosetta Commons), except that they do not have access to direct financial support from the Rosetta Commons and may not serve on the Rosetta Commons Board of Directors. This model accomplishes several goals of the Rosetta Commons. First, it widens the pool of Rosetta users and contributors by retaining highly skilled Rosetta developers who have gone on to careers in industry as valuable members of the broader Rosetta community. Second, it increases the diversity of scientific problems to which Rosetta is being applied, as industry researchers often have different scientific goals than academic researchers. Cyrus-Rosetta License: Cyrus is a private company that offers an easy-to-use, cloud-based version of Rosetta to customers with active Rosetta licenses from UW (either commercial or academic/non-profit). Cyrus has a symbiotic relationship with the Rosetta Commons that includes the latter’s partial ownership of Cyrus, royalties paid to UW for the benefit of the Rosetta Commons, large amounts of code committed to the Rosetta code base on a regular basis, and increased licensing revenue for the Rosetta community since Cyrus recruits new Rosetta customers on a regular basis and helps convince existing customers to reactivate their licenses. Like organizations that have signed the Company Contributor License Agreement (see above), Cyrus has access to Rosetta’s GitHub repository. Note: Rosetta Commons PIs David Baker and Jeffrey Gray have a financial interest in Cyrus. Academic Fee-for-service License: Academic labs that utilize Rosetta to generate IP that is directly owned by a commercial entity must obtain a Rosetta license for commercial use. This license is discounted; reach out to CoMotion to discuss the situation. Community Expand What is the Rosetta Commons? The Rosetta Commons organizes Rosetta and the people working on it, along with the intellectual property embodied in the software itself. Formally, it is a legal agreement between a member institution and the University of Washington (UW) to non-exclusively license copyright of the voluntarily submitted Rosetta source code to UW, which in turn has agreed to manage the licensing efforts and associated revenue from Rosetta for the benefit of the participating laboratories and groups. The Rosetta Commons is composed of >70 academic and industry organizations. What are the other benefits of being part of the Rosetta Commons? Due to the organizational structure of the Rosetta Commons and the reinvestment of licensing revenue in the community, Rosetta Commons members are well-positioned to rapidly try new ideas, add new innovations, and form fruitful collaborations. Benefits include: Automated testing infrastructure that ensures code integrity and stability over time Support in new code development from a collaborative global community of developers and scientists Developers email list (“devel”), developers live chat (Slack), and other community communications such as the Rosetta jobs email list Conferences and workshops (e.g., RosettaCon and Rosetta Bootcamps) at no cost for academics Code schools for Rosetta development Outreach conferences and community building like GHC and SACNAS What are the benefits of the Rosetta Commons enabling contributions from a wider community? Much like Linux, Git, or other collaboratively-developed open source projects, Rosetta has become a powerful, widely-adopted tool because it enables us to mutually benefit from each other’s work and coordinate our efforts to solve big problems. Expanding the pool of Rosetta contributors has led to the development of a rich ecosystem, accelerated innovation, and created a vibrant community of researchers. As people continue to build upon Rosetta, they become more invested in its overall success. As more people build upon Rosetta, the number of use cases for Rosetta will expand, resulting in Rosetta having a more mature and higher quality code base. Today, the Rosetta community is the dominant molecular design community. This is creating demand for Rosetta-skilled modelers at many companies, and the success of Rosetta-focused companies like Cyrus and Arzeda is spreading awareness of that type of skill set. As we continue to develop the tool, Rosetta and our collective skillsets become ever more valuable over time: the rising tide lifts all boats. You can learn more about the larger topic of open source structures here. Can I decline to contribute my Rosetta code to the Commons? The Rosetta Commons developer license is a precondition for joining the Rosetta community and contributing to its goals, and applies to any contribution, comment, or idea made to the Rosetta code base, whether rejected or accepted. All such contributions are non-exclusive in nature, and made at the discretion of the developer. Of course, any academic can freely download Rosetta and then develop their own code, subject to the conditions of distribution and reuse. In this scenario, the developer would forgo participation in the open exchange of software, code, training, and scientific ideas and all other benefits of active membership in the Commons. Code not contributed to the Commons would not benefit from sustained testing, integration with other Rosetta modules, deployment on the public Rosetta servers, or needed updates for future compatibility. Students in Rosetta Commons labs interested in working outside of the Commons should feel free to discuss with their research advisors. Any code ‘outside’ of Rosetta can be shared as you like. Some examples are the Dunbrack lab’s PyIgClassify server, which uses some Rosetta code but stands alone as a separate service; Sergey Lyskov’s Binder package to wrap C++ objects for Python, which is open-source (MIT license); the Meiler lab’s BCL, which is compatible with Rosetta and also open source, or new deep learning codes that are shared publicly such as DeepH3 (Gray lab) or trRosetta (Baker/Ovchinnikov labs). Other ‘outside’ codes may be included in the Rosetta distribution and licensing models. Some examples are the antibody database and manipulation scripts, PDB analysis scripts, etc. How does the Rosetta Commons maintain control and management over the Rosetta Commons code repository? The Rosetta Commons is governed by a Board of Directors, the members of which are elected on a semiannual basis. The members of the board are academic and industry Rosetta Commons members. All major decisions regarding how Rosetta is licensed and how the Rosetta Commons operates are made by a majority vote of the board members. Current board members can be found here: https://rosettacommons.org/about/team/ What is the relationship between Rosetta Design Group and the Rosetta Commons? The Rosetta Design Group is an organization founded in 2007 as part of the Rosetta Commons to promote, assist, and enable adoption of the Rosetta Software Suite in industry and facilitate networking and collaboration between industry and the Rosetta Commons. In line with this mission, RDG performs in-house and contract R&D and offers tailored on-site training in computational macromolecular modeling with a focus on the Rosetta Software Suite. RDG is the official liaison of the Rosetta Commons and industry participants at RosettaCon. David Nannemann, Managing Member of RDF, currently serves as the Industry Chair on the Rosetta Commons board. Do Rosetta Commons PIs have conflicts of interest? Many Rosetta labs have spun off companies or accepted research funding from companies, two situations in which potential conflicts of interest can arise. Trainees are encouraged to ask their PI or their division leaders or conflict management officials for additional information. We urge each PI to follow the accepted practice of actively managing conflicts in close collaboration with t"
