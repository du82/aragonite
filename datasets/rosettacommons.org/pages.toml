["https://rosettacommons.org/2024/12/01/registration-for-winter-rosettacon-2025-is-now-open"]
title = "Registration for Winter RosettaCon 2025 is now open! – Rosetta Commons"
description = "We are pleased to announce that Winter RosettaCon will be held at the Boston Marriott Cambridge Hotel in Cambridge, Massachusetts, from February 26 to 28, 2025. The conference will start around 4 p.m. on Wednesday, Feb. 26, and finish around 3 p.m. on Friday, Feb. 28.    REGISTRATION Registration is now open at winterrosettacon.org. Discounted pricing…"
full_description = "Registration for Winter RosettaCon 2025 is now open! December 1, 2024 We are pleased to announce that Winter RosettaCon will be held at the Boston Marriott Cambridge Hotel in Cambridge, Massachusetts, from February 26 to 28, 2025. The conference will start around 4 p.m. on Wednesday, Feb. 26, and finish around 3 p.m. on Friday, Feb. 28. REGISTRATION Registration is now open at winterrosettacon.org. Discounted pricing is available for early registration until December 31, 2024. The final deadline to register for in-person attendance is January 29, 2025. If you are applying for a travel grant, please wait to register until AFTER you have received a decision about your travel grant application. VISA LETTER If you need a letter of invitation to apply for a U.S. travel visa, find instructions HERE. AIRFARE Each attendee is responsible for booking and paying for their airfare. Airfare reimbursements will be handled by your home institution, following their policies. If you are applying for a travel grant, please only make travel arrangements AFTER you get a decision, as we cannot reimburse for tickets that fall outside of the travel policy. LODGING & HOTEL The Rosetta Commons will organize lodging at the Boston Marriott Cambridge Hotel for attendees from Rosetta Commons member labs and non-member academic attendees that register for lodging. Please indicate on the registration form which nights you’ll need accommodation for. For all other attendees, a discount booking code is available on the Venue page of the website. We recommend booking as soon as possible to ensure room availability at the conference rate. Attendees preferring their own room can purchase an upgrade through the registration portal. TRAVEL GRANTS Rosetta Commons will issue limited travel grants to provide needs-based travel support. Personnel from recently established labs, international labs outside of the US, labs experiencing limited funding, and individuals without access to supported travel through their labs are highly encouraged to apply for a travel grant. Wait until AFTER you have received a decision on your travel grant application to register for the conference and make travel arrangements! Announcements for travel grants will be made on a rolling basis. The final deadline to apply for a travel grant is Dec 31, 2024, but we encourage you to apply early. Awardees will make travel arrangements through our travel agent, so if you are applying for the award, please wait with your travel arrangements until you have heard from us! APPLY HERE for a travel grant. DEPENDENT CARE APPLICATION If you need financial help to care for your family while you’re away at the conference, complete the form HERE. UPDATES AND COMMUNICATIONS Registration for WRC will run through the Nunify conference app, which will also be used for regular conference communication. Download the app on your phone and create an account on Nunify. All information will be available on the website as well, with a slight delay. You can find Nunify in the Apple Store or Google Play Store. WRC BOOTCAMP Similar to WRC 2024, we will hold a Bootcamp from Monday, Feb. 24, to Wednesday, Feb. 26. Ashley Vater is in charge of organizing it, and more information will follow. MORE INFORMATION You can find more information on the Information tab on the website. If you have any questions, please fill out the form on the contact page to get directed to the person who can answer your question the best. Sincerely, the organizers Anum Glasgow – Columbia University Sergey Ovchinnikov – Massachusetts Institute of Technology Julia Koehler Leman – Open Molecular Software Foundation Camille Mathis – Johns Hopkins University David Nannemann – Rosetta Design Group Alisha Singh – Open Molecular Software Foundation All Posts Posted in Events"
