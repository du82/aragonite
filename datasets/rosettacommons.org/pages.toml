title = "Join us for the Rosetta user workshop in July 2024 in Nashville, TN – Rosetta Commons"
description = "We are pleased to announce registration has opened for our 2024 Rosetta Workshop to be held July 22-24 in person at Vanderbilt University in Nashville, TN. The Vanderbilt Rosetta Workshop is designed to be an introduction to the Rosetta macromolecular modeling suite, focusing on a practical introduction to common Rosetta protocols. Registration for the workshop is on a first-come-first-served basis and is limited to…"
full_description = "Join us for the Rosetta user workshop in July 2024 in Nashville, TN May 10, 2024 We are pleased to announce registration has opened for our 2024 Rosetta Workshop to be held July 22-24 in person at Vanderbilt University in Nashville, TN. The Vanderbilt Rosetta Workshop is designed to be an introduction to the Rosetta macromolecular modeling suite, focusing on a practical introduction to common Rosetta protocols. Registration for the workshop is on a first-come-first-served basis and is limited to 15 participants. Please register as soon as possible since spots fill quickly. Participants are responsible for their own travel and accommodation arrangements. We have a block of rooms reserved at a discounted rate, and this information will be shared once registration is completed. For more information, and to register for the workshop, please visit https://meilerlab.org/rosetta-workshop-summer-2024/ Questions can be directed at Rocco Moretti. All Posts Posted in Blog post, Events"
