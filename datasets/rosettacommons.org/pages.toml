["https://www.rosettacommons.org/about/post-baccalaureate-program"]
title = "Postbaccalaureate – Rosetta Commons"
description = "RaMP: Research and Mentoring for Postbacs: Training Program in Biomolecular Structure Prediction and Design Apply Here! Application Guide The Rosetta Commons Research and Mentoring for Postbaccalureates (RaMP) is a one-year fellowship program intended for students to gain research experience to succeed in PhD programs. Trainees in this geographically distributed RaMP program participate in research using the…"
full_description = '''RaMP: Research and Mentoring for Postbacs: Training Program in Biomolecular Structure Prediction and Design Apply Here! Application Guide The Rosetta Commons Research and Mentoring for Postbaccalureates (RaMP) is a one-year fellowship program intended for students to gain research experience to succeed in PhD programs. Trainees in this geographically distributed RaMP program participate in research using the Rosetta Commons software. The Rosetta Commons software library includes physics-based and deep learning algorithms for biomolecular modeling and design. It has enabled notable scientific advances in computational biology, including de novo protein design, enzyme design, ligand docking, and structure prediction of biological macromolecules and macromolecular complexes. The Program Eligibility Apply The Program The RaMP Provides: Rosetta Code School: where trainees will learn the inner details of the Rosetta Python code and community coding environment, so you are fully prepared to research using the software. Research experience: Trainees conduct hypothesis-driven research in their Mentor’s lab, with day-to-day guidance by an experienced PhD student or postdoc. Scholars participate fully in weekly lab meetings, attend weekly research seminars in their department, attend a vibrant PhD program retreat and a national conference of their choice. Participation: in the Winter Rosetta Conference, where you will connect with Rosetta developers from around the world. Compensation: Salary, health benefits, and funding for conference travel are included. Preparation: for graduate school applications and interviews. Community: Trainees come together each month for ‘Journal Club’ events to present and discuss their research with peers and faculty mentors. These meetings include professional development mini-lessons on topics like the NSF-GRFP, graduate school applications, research posters, and more. Project meetings: Trainees gain confidence by organizing, preparing for, and convening monthly project meetings with the program’s PI, Dr. Jeff Gray and Co-PI Dr. Matthew O’Meara. Scholars benefit both scientifically and professionally by building strong working relationships with multiple faculty members who are experts in their field of interest. Specialized mentoring: Mentors will participate in a four-part Mentoring Workshop series that will guide them in being an effective, self-aware, and understanding mentor. This series will be facilitated by Steven Thomas. The mentor, co-mentor, and participant will form a “mentorship triad,” a tight interpersonal structure functioning to enhance a student’s potential. Each participant will be supported by a stipend of at least $32,500 per year. Program dates are August 18, 2025 - August 17, 2026. This program is funded by NSF, award: 2216011 Eligibility Required eligibility criteria: Available during program dates: August 18, 2025 - August 17, 2026. U.S. citizens, U.S. nationals, or permanent residents of the United States are eligible. Participants must have a baccalaureate college degree before participating in the program (applicants must apply to the program before or within four years of graduation, with extensions allowed for family, medical leave, or military service). Individuals currently enrolled or accepted into a graduate program are not eligible. Undergraduate major in computer science, engineering, mathematics, chemistry, biology, and/or biophysics. While not required, we seek candidates with some combination of experiences in scientific or academic research, C++/Python/*nix/databases, software engineering, object-oriented programming, and/or collaborative development. This program is funded by NSF award Apply Submit the following in the application Resume Unofficial transcript Personal statement that summarizes why you are an appropriate candidate (up to 5000 characters) including: Why this program interests you Brief summary of research and computing experience Research career goals Two letters of recommendation (complete the reference forms in the application with contact information) Select top three labs and projects of interest from the list below. Program dates: August 18, 2025 - August 17, 2026 Application deadline: March 1, 2025 The deadline for receipt of recommendation letters is March 3, 2025. Program contact: Camille Mathis, cmathis@jhu.edu. Labs Gray Lab @ Johns Hopkins University in Baltimore, MD Collapse “Harnessing deep learning to Engineer Next-Gen Antibodies” Antibodies make ideal pharmaceutical candidates because of their strong binding affinity, high selectivity and ability to neutralize. However, there is an enormous combinatorial space of plausible antibody sequences. Our lab has borrowed deep learning techniques from Natural Language Processing (NLP) field to learn the semantics of protein sequences to better guide design. In this RaMP project, the participant will apply language models to help design and optimize therapeutic efficacy. The participant will learn biophysics, NLP, machine learning and protein modeling. Hosseinzadeh Lab @ University of Oregon in Eugene, OR Expand "A combination of computational and experimental techniques to design binders against P53" The intrinsic region of p53 binds to various proteins, each with distinct functions. Our goal is to design inhibitors for three of these interactions by targeting the protein partners instead of p53 itself. The best designs, selected from 96 wells, will then be analyzed using multiple methods Huang lab @ Stanford University in Stanford, CA Expand "Predictive modeling for pMHC targets by TRACeRs" We developed a novel platform, called TRACeR, to target the peptide antigen in Major Histocompatibility Complexes (MHCs) using only a small number of active site residues to define the specificity. Highly specific MHC binders are currently discovered through high throughput library selection, but we hope to annotate the binder-to-target sequence space to be able to create MHC binders for any given peptide sequence without wet-lab selection. To this end, this project will involve (1) experimental data collection on binder:target pairings, (2) building a computational model to generate designs, (3) followed by testing of designs on unseen targets. Khare Lab @Rutgers University in New Brunswick, NJ Expand "Mapping and designing protein-peptide interaction specificity landscapes using AI, biophysics and deep sequencing" The C-terminal floppy segments of proteins in the human proteome provide a sequence-unique Achilles heel to selectively target any protein inside cells. Naturally occuring proteins like PDZ domains are known to bind to C-terminal segments but with weak affinity and selectivity. We are developing CODACs - Computationally Designed Affinity Clamps - that can bind target C-terminal peptides with high affinity and specificity, using both AI-based (RFDiffusion, MPNN) and biophysical simulation-based design tools. Experimental characterization of designs involves measuring binding and specificity landscapes using high-throughput display experiments and deep sequencing. Kortemme Lab @ University of California, San Francisco in San Francisco, CA Expand " Computational design of de novo proteins to control biological signaling" We are working towards engineering synthetic signaling systems built from de novo designed protein components that can recognize inputs, transduce signals, and control programmable outputs. We have a range of projects to create proteins with custom-designed shapes to recognize specific signals and to engineer switchable protein structures. We integrate computational design, including recent advances from deep learning, and experimental characterization in vitro and in cellular systems. Lindert Lab@ University of California, Los Angeles in Los Angeles, CA Expand "AI methods for protein structure prediction" Knowledge of protein structure is paramount to our understanding of biological function and for developing new therapeutics. Deep-learning structure modeling techniques such as AlphaFold have shown great success but still exhibit notable limitations for numerous types of proteins, such as dynamic proteins with multiple conformations, orphan proteins that have no close homologs, or intrinsically disordered proteins. One of the most promising avenues to overcoming these remaining limitations is integrating experimental data directly into AlphaFold2. We are developing integrative deep-learning based modeling techniques, that enable prediction of protein structure from sparse experimental data. We are particularly interested in using mass spectrometry and deep mutational scanning data for predictions. O'Meara Lab @ University of Michigan, Ann Arbor in Ann Arbor, MI Expand "Generative AI for drug selectivity" A broad challenge in drug discovery is finding compounds that selectively target certain receptors or conformational states. State of the art molecular simulations dock ultra-large chemical libraries at multiple sites and pick compounds based on predicted differential binding. Recently, generative AI docking methods have shown promise at conditional ligand and pose generation tasks. In this project, you will leverage experimental data capturing relative activity to guide and fine-tune generative AI methods to make them better at predicting selective compounds and then benchmark against state-of-the art molecular simulation approaches. As a case study you will prospectively predict compounds to activate KCNQ ion channels to treat epilepsy, tinnitus, and other diseases of neuronal hyperexcitability. Rocklin Lab @ Northwestern University in Chicago, IL Expand "Applying high-throughput experimental data to guide computational protein design" Today, most computational protein design tools like Rosetta use the features of natural protein structures (which amino acids like to be near each other, what types of structures are very common, etc.) to guide the design of new proteins. However, for many applications, we want to design proteins with properties far beyond what already exists in nature. To achieve this, we need new sources of data - not just natural protein structures - that can guide design into new territory. Our lab develops new experimental methods to measure properties like folding stability, aggregation, and dynamics for tens to hundreds of thousands of designed or natural proteins at the same time. We then use these new large datasets to guide protein design proteins. We have a range of different projects focused on basic science, therapeutic development, and tools for synthetic biology. Each person's project is described on our website (www.rocklinlab.org). We will work with an intern or post-bac to find which project in our lab is best for their interests. Smith Lab @ Wesleyan University in Middletown, CT Expand "Reshaping protein energy landscapes to optimize dynamics/function" The Smith lab is currently developing and applying methods for combining Rosetta design calculations with molecular dynamics simulations to reshape the energy landscapes of proteins. We are applying these techniques to several unique systems: 1) mini Flurorescence Activating Proteins (mFAPs) are beta barrels de novo designed in Rosetta to bind and activate the fluorescence of small molecule chromophores. Our lab developed an algorithm that can for the first time predict how mutations to the protein affect chromophore dynamics and thus brightness. We are reshaping the energy landscape of these proteins to favor macrostates with high protein function. 2) Rosetta-designed miniprotein binders potentailly represent a new class of protein drugs that can be readily created using the structure of the target protein alone. However, we have found that model miniproteins exhibit unexpected and undesired conformational heterogeneity and spontaneous postranslational modifications. We are redesigning these proteins to avoid such deleterious outcomes. You will learn to use Rosetta with free energy data analysis techniques, optimize algorithm parameters with existing datasets, and apply these techniques to improve protein function. Whitehead Lab@ University of Colorado, Boulder in Boulder, CO Expand "Protein design for new protein click chemistries" Scalable routes for site-specific, defined immobilization of proteins on supports is important for biotechnology. For regenerative medicine and drug delivery, tethering proteins to hydrogels is essential for controlled release and delivery in vivo. Conjugating drugs to antibodies allows for precise targeting of chemotherapies in cancer. For sustainable processes involving enzymes or affinity reagents, proteins are often attached to supports in packed columns. Wbile there has been >60 years of development of chemistries that link proteins to supports, there are gaps in scalable manufacturing routes for site specific immobilization. Mutations to cysteine or non canonical amino acids suffer from yield and downstream purification liabilities. This project seeks to use protein design to learn new short peptide sequences which allow for site-specific conjugations with epoxy or other suitable electrophilic functional groups. We will use generative AI to design structures and sequences, and test conjugation in vivo using prokaryotic and eukaryotic expression systems. The ideal trainee would be someone with interest in kinetics, protein design, applied biotechnology, and with some chemistry background. Apply Now!'''
