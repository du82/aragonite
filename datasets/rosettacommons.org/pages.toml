title = "User Support – Rosetta Commons"
description = "User Support We have a dedicated forum for users to engage in discussions related to various aspects of Rosetta, including general usage, installation issues, and applications across its different versions like Rosetta 3, ROSIE, and PyRosetta. This platform is actively monitored by our developers, providing a space for users to seek advice, share insights, and…"
full_description = "User Support We have a dedicated forum for users to engage in discussions related to various aspects of Rosetta, including general usage, installation issues, and applications across its different versions like Rosetta 3, ROSIE, and PyRosetta. This platform is actively monitored by our developers, providing a space for users to seek advice, share insights, and troubleshoot, with a priority response system in place for commercial users. For more details and to join the discussions, visit the Rosetta Discussions page at Github. Prior to mid-2024 we ran a separate forum on the rosettacommons.org website. The questions and answers posted there are still available for browsing. Alternatively, they should also be indexed in the internet search engine of your choice. Commons members also get access to the Rosetta Commons Slack for better support from the community. If you're not on the Slack channel yet, please get in touch with us for an invite."
