["https://rosettacommons.org/education/reu"]
title = "Undergraduates – Rosetta Commons"
description = "Rosetta Commons Research Experience for Undergraduates (REU) A Cyberlinked Program in Computational Biomolecular Structure & Design Interns in this geographically-distributed REU program participate in research using the Rosetta Commons software. The Rosetta Commons software library includes algorithms for computational modeling and analysis of protein structures. It has enabled notable scientific advances in computational biology, including…"
full_description = '''Rosetta Commons Research Experience for Undergraduates (REU) A Cyberlinked Program in Computational Biomolecular Structure & Design Interns in this geographically-distributed REU program participate in research using the Rosetta Commons software. The Rosetta Commons software library includes algorithms for computational modeling and analysis of protein structures. It has enabled notable scientific advances in computational biology, including de novo protein design, enzyme design, ligand docking, and structure prediction of biological macromolecules and macromolecular complexes. Apply Here! Application Guide The Program Eligibilty Application The Program Program Dates: June 2, 2025 - August 8, 2025 The program starts with one week of Rosetta Code School (June 2 through June 6), where you will learn the inner details of the PyRosetta code and community coding environment, so you are fully prepared for the summer! 8 weeks of hands-on research in a molecular modeling and design laboratory, developing new algorithms and discovering new science. The summer will finish with a trip to the Rosetta Conference in the gorgeous Cascade Mountains of Washington State, where you will present your research in a poster and connect with Rosetta developers from around the world. The conference will be held from August 5 through August 8. This program is supported by NSF (Award 2244288). Interns will receive housing, paid travel expenses, a sustenance allowance and a $6,000 stipend. Eligibilty U.S. citizens, permanent residents, and U.S. nationals, are eligible to apply. International students, who are actively pursuing a bachelor’s degree in the United States, are eligible to apply. International students studying outside of the US are not eligible to apply. College Sophomores or Juniors are preferred. Major in computer science, engineering, mathematics, chemistry, biology, and/or biophysics Available during the program dates: June 2, 2025 - August 8, 2025. If accepted, students on the quarter system can request to take their final exams early or request have final exams proctored at Johns Hopkins. Interest in graduate school. While not required, we seek candidates with some combination of experiences in scientific or academic research, C++/Python/*nix/databases, software engineering, object-oriented programming, and/or collaborative development (git) **Students graduating before the start of the program are not eligible for the REU and are encouraged to apply to our RaMP Program. Application Include the following in the application: Resume Transcript Personal statement—why this internship interests you—brief summary of research and computing experience—why you are an appropriate candidate for the internship. Two references (complete the reference forms in the application with contact information) Select top five labs and projects of interest from the list below. Deadline for receipt of applications is February 3, 2025. Deadline for receipt of recommendation letters is February 5, 2025 Click here for Creating a Competitive REU Application for help with preparing your application. Program contact: cmathis@jhu.edu Interns hiking after RosettaCon RosettaCon Presentations Interns at bootcamp in 2022 Available Projects and Locations Baker Lab @ University of Washington in Seattle, WA Collapse Institute for Protein Design Students will learn cutting-edge deep learning protein design methods (e.g. RFdiffusion, ProteinMPNN) and apply them to current design challenges in our lab at the Institute for Protein Design. Areas of focus will include the de novo design of small proteins that bind to specific DNA sequences or protein targets. Join us during Seattle's best season (summer) as we explore how to use protein design to solve a broad range of challenges in medicine, technology, and sustainability. Brown Lab @ Vanderbilt University in Nashville, TN Expand "Sampling conformational thermodynamics of biomolecules at scale" Our lab is interested in developing methods at the intersection of artificial intelligence, kinematics, and statistical mechanics to increase the scale at which we can perform simulations of biomolecular dynamics to obtain detailed mechanistic insight into conformational thermodynamics. Cheng Lab @ Merck Computational and Structural Chemistry in San Francisco, CA Expand “Predictive modeling and design of cyclic peptides” In antibody drug discovery, two important goals are to improve antigen binding while reducing antibody self-interactions, and modeling is useful in prioritizing engineering efforts. We have generated large datasets along with homology models and conformational ensembles for each antibody in the dataset. The successful student will leverage Rosetta to generate structure-based descriptors and use them in building predictive machine learning models. The student will work with Merck & Co. scientists to assess the advantages of derived predictions alone and in combination with state-of-the-art predictive approaches. Cooper Lab@ Northeastern University in Boston, MA Expand "Citizen Science and Games for Biochemistry" We are exploring how citizen science and crowdsourcing through video games can help biochemists with their work. To do this, we have developed the game Foldit, a multiplayer online game that allows players without previous experience in biochemistry to work on protein folding and design problems. This project will focus on development of game-related aspects to understand and improve the player experience. Potential projects include virtual reality and dynamic difficulty adjustment. Drew Lab @ University of Illinois at Chicago in Chicago, IL Expand "Design of peptide inhibitors" The Drew Lab studies macromolecular assemblies in cells. These assemblies, made up of mostly proteins and nucleic acids, are responsible for most biological functions. We are specifically interested in learning how these assemblies function mechanistically and how they relate to human disease. We investigate assemblies using high throughput proteomics approaches to determine their components, biophysical/biochemical characteristics, and understand their structure. We also design tools to disrupt assemblies to understand their role in disease and develop pathways to therapeutics. Glasgow Lab @ Columbia University in New York, NY Expand “Redesigning cell receptors as small molecule sensors for therapeutic applications” Most cancer cell therapies target proteins that are enriched on tumor cells. However, this strategy fails for solid tumors, which are difficult to penetrate, brutally immunosuppressive, and have heterogenous and poorly-expressed tumor cell surface markers. In this project, we will redesign G-protein coupled receptors (GPCRs) to respond to small molecules that are upregulated in the solid tumor microenvironment for improved targeting in cell therapies as well as future applications in biomedical imaging and tissue engineering. Gray Lab @ Johns Hopkins University in Baltimore, MD Expand “Antibody Engineering with Deep Learning” Antibodies are critical molecules in the immune system and as pharmaceuticals. But many deep learning methods perform weakly on them because of their great diversity and reliance on loop structures, which have fewer data available. In this project you will create or apply new approaches such as language models, diffusion or flow models, toward predicting and designing better antibodies. Hosseinzadeh Lab @ University of Oregon in Eugene, OR Expand "Designing metalloenzymes with new substrates" Designing novel metalloproteins, especially those incorporating organometallic ligands like N-heterocyclic carbenes (NHCs), is challenging. NHCs, which are similar to histidine, may bind more effectively through carbon rather than nitrogen. Our goal is to create metalloproteins that promote this novel coordination and combine organometallic catalysts with enzymes to enhance specificity in chemical transformations. Leveraging advanced deep learning models, we aim to design protein scaffolds for precise reactions like olefin metathesis, advancing metalloprotein design and catalyst engineering. Kellogg Lab @ St Jude Children's Research Hospital in Memphis, TN Expand "Designing novel programmable transposons using computational protein design" The discovery of RNA-guided nucleases, particularly CRISPR-Cas9, has revolutionized gene editing and therapeutic strategies due to their precision in targeting specific genomic sites. However, the limitations of CRISPR nucleases highlight the need for therapeutics that, instead of cutting DNA, seek to modify genomic DNA through integrating large DNA cargo, thereby bypassing the generation of double-stranded DNA breaks. We aim to engineer novel RNA-guided transposons that integrate DNA sequences into the genome in a site-specific manner. Importantly, we seek to generate additional candidates for therapeutic translation that do not currently exist in nature. We aim to achieve this using a combination of machine-learning based protein design and high-throughput screening. By generating novel candidates for testing in human cells, we aim to enhance the activity and specificity of RNA-guided transposons in human cells. Our research aims to pave the way for safe, effective, and transformative gene-editing tools, setting a precedent for the future development of a generalizable strategy for designing novel RNA-guided transposons in synthetic biology and medicine. Khare Lab @ Rutgers University in New Brunswick, NJ Expand "Designing Protein Editors" Our goal is to develop technology that will permit precisely targeting and enzymatically modifying any chosen protein inside cells (what we call "CRISPR for proteins"). Intrinsically Disordered Proteins (IDPs) and Regions (IDRs), which constitute about 40% of eukaryotic proteins, play key roles in cellular physiology and disease. IDP/IDRs function by forming low affinity, transient, and conditional interactions with folded protein domains and other IDP/IDRs. A significant portion IDP/IDR interactions is likely mediated by short linear motifs (SLiMs) in these IDPs/IDRs. Naturally occurring SLiM-binding protein domains interact with low affinity and/or limited selectivity for a chosen target. We are developing a novel IDP/IDR targeting framework using ML-designed proteins that selectively and tightly bind chosen IDP/IDRs (e.g., synuclein involved in Parkinson's Disease) and site-specifically cleave the protein using designed protease enzymes. You will learn building and utilizing ML models for binding and catalytic specificity based on high-throughput experimental data that we are generating. Khmelinskaia Lab @ Ludwig Maximilian University of Munich in Munich, Germany Expand "Expanding the functional space of de novo designed protein assemblies" Computational methods have been recently developed for designing novel protein assemblies with atomic-level accuracy, yet several aspects of current methods limit the structural and functional space that can be explored. We aim to expand the plethora of available protein assemblies for application by introducing and controlling new structural properties (e.g. flexibility, assembly stability, structural switches) and functional moiteties (e.g. catalysis, recognition elements, surface binding). Students will have the chance to learn computational protein modelling and design methods, from Rosetta to the latest AI-based algorithms, in the beautiful LMU campus in the south of Munich. Kuhlman Lab at University of North Carolina, Chapel Hill in Chapel Hill, NC Expand “Design of protein switches and complexes” Enzymes can dramatically increase the rate of chemical reactions because they bind with high affinity to the reaction transition state. The goal of this project is to develop new machine learning methods for designing small molecule binding sites in proteins. These methods will be useful for creating novel enzymes and biosensors. Lindert Lab @ University of California, Los Angeles in Los Angeles, CA Expand "Machine-learning based structure modeling using mass spec data" Knowledge of protein structure is paramount to our understanding of biological function and for developing new therapeutics. Mass spectrometry experiments which provide some structural information, but not enough to unambiguously assign atomic positions have been developed recently. These methods offer sparse experimental data, which can also be noisy and inaccurate in some instances. We are developing integrative deep-learning based modeling techniques, that enable prediction of protein complex structure from the mass spec data. Ljubetic Lab @Kemijski Inštitut - National Institute of Chemistry in Ljubljana, Slovenia Expand " How many feet does a de novo designed protein walker need?" Designed proteins hold the potential to address a range of critical challenges, including the development of novel therapeutic agents, nanomaterials, and biosensors. In particular, designed protein machines offer immense promise, both for advancing our understanding of fundamental biological principles and as potential delivery systems for therapeutic applications. Our research aims to design and develop protein-based nanorobots capable of "walking" along a synthetic fiber. The motion of these robots arises from thermal fluctuations, resulting in random walking behavior. We will investigate how variations in the number and flexibility of the robot’s "feet" influence their movement along the fiber. The REU student will gain hands-on experience in protein design using cutting-edge tools such as Rosetta, ProteinMPNN, RFDiffusion, and AlphaFold2/3. They will also produce the designed proteins in bacterial systems and characterize them using a variety of biophysical techniques, including circular dichroism (CD), size-exclusion chromatography with multi-angle light scattering (SEC-MALS), mass photometry (MP), and single-molecule total internal reflection fluorescence (TIRF) microscopy. Lubin Lab @ Tandem AI in New York, NY Expand "Tandem methods development" This intern will gain industry experience in drug discovery, using and building computational tools to predict various features of protein-protein interfaces and interactions, and developing public-facing workflows. The intern will work with a close-knit, cross-functional team including specialists in Rosetta, molecular dynamics/free energy calculations, AI/ML, and software engineering. Applications may include the design of site-specific antibodies, orally available peptide therapeutics, and PROTACs. Merck Chemical Biotechnologies in Rahway, NJ Expand “Elucidation of esterase mechanisms” The intern will use various modeling tools to design esterases with improved stability to process-like conditions, then express and characterize their activity (mechanism, kinetics, selectivity). Merck Discovery Biologics in Boston, MA Expand “Design and engineering of Therapeutic miniproteins” Miniproteins repres'''
