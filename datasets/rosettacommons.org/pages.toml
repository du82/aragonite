["https://rosettacommons.org/2021/03/30/standing-up-against-hate-and-acts-of-violence"]
title = "Standing up against hate and acts of violence – Rosetta Commons"
description = "Dear all, Along with all members of our community, we are heartbroken by the recent murders, acts of violence, and discrimination against people of Asian and Asian-American descent. We condemn the increased racism and xenophobia directed at people of Asian and Asian American descent. We stand in solidarity and support with the Asian, Desi, Pacific…"
full_description = "Standing up against hate and acts of violence March 30, 2021 Dear all, Along with all members of our community, we are heartbroken by the recent murders, acts of violence, and discrimination against people of Asian and Asian-American descent. We condemn the increased racism and xenophobia directed at people of Asian and Asian American descent. We stand in solidarity and support with the Asian, Desi, Pacific Islander, and Asian-American members of our community, condemn these acts, and mourn those lost. The recent attacks are the latest forms of bias rooted in hate against people based on their race, religion, ethnicity, socio-economic status, gender identity or expression, and sexual orientation. We call on the entire Rosetta Commons community to stand up against all forms of hate, bias, and bigotry and to eliminate xenophobic rhetoric when it arises. For anyone in the RC community who may feel unease or anxiety as a result of these and other incidents, we hope you will seek support through your university (here is a list of resources provided by Rosetta Institutes) or by taking personal well being measures (please check this document for a list of resources) . We must stand up against hate and fight together for justice. Below you may find a list of learning resources, as well as links to support the fight against anti-Asian racism. Rosetta Justice, Equity, Diversity, and Inclusion committee Resources to learn more: History of anti-Asian racism in the United States Chinese exclusion act of 1882 Japanese American relocation The story of Filipino farm workers Model minority myth and here America’s history of scapegoating its Asian citizens Recent news End hate crimes against Asian-Americans “We are crying out for help” (MSNBC interview) Asian-Americans calling on allies in response to a wave of violence #AsianAmCovidStories: YouTube series More reading The Chinese in America: A narrative history PBS Documentary “Asian Americans“ Los Angeles Times “Asian Enough” podcast NBC Asian American “The racism virus“ NBC Asian American “Deported“ Minor Feelings: An Asian American Reckoning Yellow: Race in America Beyond Black and White Podcast: Self-evident:Asian American stories How to support: These articles have a list of organizations and communities you can support. Below we have compiled a shorter version as well. Support the fight against Asian hate How you can help AAPI community 61 ways to donate in support of Asian communities Organizations Stop AAPI Hate – aggregates and responds to incidents of hate and harassment against Asian American/Pacific Islanders. Stop AAPI Hate received 1,843 reports of anti-Asian discrimination due to COVID-19 in its first eight weeks of reporting (March 19 to May 13). Hate is a virus – started as a grassroots movement to combat racism and xenophobia against Asian Americans and Pacific Islanders (AAPI) fueled by COVID-19, Hate is a virus has evolved into a sustainable organization that addresses xenophobia and hate in the AAPI and BIPOC communities. Act To Change – a national nonprofit organization working to address bullying, including in the AAPI community. They published “The Racism is a Virus Toolkit” to support the community in combating racism. Asian Americans Advancing Justice – a national nonprofit organization that focuses on housing rights, immigration, civil rights, labor rights, and others for Asian Americans National Council of Asian Pacific Americans – a nonprofit organization that serves to represent the interests of the greater Asian American (AA) and Native Hawaiian Pacific Islander (NHPI) communities through a coalition of 37 national Asian Pacific American organizations around the country. Individual fundraisers Aggregate GoFundMe to support organizations that help keep our Asian communities in the Bay Area safe GoFundMe for Vicha Ratanapakdee Gofundme to Help Rebuild the Vietnamese American Community Center in Oakland, CA AAPI community fund Other ways to support Call your representatives Learn about how to respond to coronavirus racism Learn what makes a hate crime Learn about code language All Posts Posted in Uncategorized"
