description = "Registration has opened for the 2025 Rosetta Workshop to be held March 3-5, 2025, in person at Vanderbilt University in Nashville, TN. The Vanderbilt Rosetta Workshop is designed to be an introduction to the Rosetta macromolecular modeling suite, focusing on a practical introduction to common Rosetta protocols & related ML packages (such as RFdiffusion &…"
full_description = "Registration for the RosettaWorkshop is now open! December 19, 2024 Registration has opened for the 2025 Rosetta Workshop to be held March 3-5, 2025, in person at Vanderbilt University in Nashville, TN. The Vanderbilt Rosetta Workshop is designed to be an introduction to the Rosetta macromolecular modeling suite, focusing on a practical introduction to common Rosetta protocols & related ML packages (such as RFdiffusion & ProteinMPNN). For more information, and to register for the workshop, please visit https://meilerlab.org/rosetta-workshop-spring-2025/rosetta-workshop-registration/ (Registration is on a first-come-first-served basis.) Workshop Goals The goal of the workshop is to educate and train academic and industry users on the Rosetta software suite. Rosetta is freely distributed to the academic community by RosettaCommons. Industry usage includes licensing fees that support research and development of Rosetta software. This is an IN-PERSON workshop. The registration fee is $300 for academic/nonprofit participants and $600 for industry participants. This includes lunch and refreshments, use of computers equipped with Rosetta software and related analysis scripts/tools, and hands on assistance with the tutorials and participants’ own research projects. Transportation and hotel reservation are not covered. All Posts Posted in Events"
