This Cookies Policy sets out what Cookies are and how we use them. Please read this policy to understand what type of cookies are used on lyricfind.com and rotorvideos.com, the information collected using cookies and how that information is used.
Cookies do not typically contain any information that personally identify a user and if such information is obtained it is deleted as soon as reasonably possible thereafter. We do not store or collect sensitive personal information, such as mailing addresses, account passwords, etc. in the Cookies.Definitions
For the purposes of this Cookies Policy:
Company (referred to as either "the Company", "We", "Us" or "Our") refers to LyricFind Inc., lyricfind.com and rotorvideos.com.
Cookies means small files that are placed on a computer, mobile device, or any other device by a website, containing details that may include the browsing history on that website.
Websites refer to lyricfind.com, accessible from www.lyricfind.com, and rotorvideos.com, accessible from www.rotorvideos.com
You means the individual accessing or using lyricfind.com or rotorvideos.com, or a company, or any legal entity on behalf of which such individual is accessing or using the websites, as applicable.

The Use of the Cookies

  Types of Cookies We Use
Cookies can be "Persistent" or "Session" Cookies. Persistent Cookies remain on a personal computer or mobile device after the user goes offline. Session Cookies are deleted as soon as your web browser is closed.
We use Persistent Cookies for the purposes set out below:
Cookies Policy / Notice Acceptance Cookies
Administered by: LyricFind. Inc.
Purpose: To identify if users have accepted the use of cookies on lyricfind.com and rotorvideos.com
Tracking and Performance Cookies
Administered by: Third-Parties
Purpose: These Cookies are used to track information about traffic to the websites and how users use the websites. The information gathered via these Cookies may directly or indirectly identify an individual visitor. The information collected is typically linked to a pseudonymous identifier associated with the device used to access the websites. We may also use these Cookies to test new advertisements, pages, features, or new functionality of the websites to see how our users react to them.

  Your Choices Regarding Cookies
To avoid the use of Cookies on the websites, a user must:

Disable the use of Cookies in their browser
Delete the Cookies saved in their browser associated with these websites

Please note: Users may opt to prevent the use of Cookies at any time.
To delete Cookies or instruct your web browser to delete or refuse Cookies, please visit the help pages of your web browser.
For the Chrome web browser, please visit this page from Google.
For the Internet Explorer web browser, please visit this page from Microsoft.
For the Firefox web browser, please visit this page from Mozilla.
For the Safari web browser, please visit this page from Apple.
For any other web browser, please visit your web browser's official web pages.Contact Us
If you have any questions about this Cookies Policy, contact us.
  
  
  


  


      
                                
  
  
  
  
  
  


  
  



    
  
                    

