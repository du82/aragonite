Where it all began...
Darryl Ballantyne (CEO), Mohamed Moutadayne (CTO), and Chris Book (Board of Directors) founded LyricFind in 2004 while attending the University of Waterloo. They started by aggregating all of the rights and content for the use of lyrics online, and sublicensing those rights to music services, websites and mobile apps.
Their vision was to ensure that songwriters and lyrics' rightsholders were properly remunerated for the use of their creations.
In 2005, with the help of Ted Cohen (Board of Directors), LyricFind signed the first ever mass lyric licensing deal with EMI Music Publishing (now a part of Sony/ATV), which at the time was the world’s largest music publisher. The Harry Fox Agency, representing publishers, and all the major publishers soon followed.
Today, LyricFind continues to expand their licensing worldwide. With a growing and impressive clientele list and a diversified portfolio of solutions, LyricFind remains committed to empowering the music industry ecosystem while creating innovative lyric and data products.










































  

              
            
                                                                                            
                                                                
