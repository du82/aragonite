ries! The acting is fantastic. Can't wait for another episode Rated 5/5 Stars • Rated 5 out of 5 stars 03/02/25 Full Review Teresa K The cinematography is outstanding. It’s like Rings of Power or Game of Thrones but the Biblical version. I’m looking forward to the rest of the series! Rated 4.5/5 Stars • Rated 4.5 out of 5 stars 03/02/25 Full Review Riddik u Absolutely loving this show! It's great to finally have Christian content that is of good quality but also follows the Bible. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review J B I’ve always loved Bible stories, whether you view them as history or fiction, the stories are interesting and captivating. House of David actually did what every other Bible adaptation was too afraid to do — lean into the magic and mysticism within the stories. You won’t get a low tide in place of an actual parted sea here!! The story is great, character development is there, action, adventure, you have it. Also, the acting is absolutely phenomenal! It seems like a cross between Vikings (History Channel) and Game of Thrones. I was hooked after the first episode but Amazon gave us three to whet our whistles. Can’t wait to see more. Hopefully more sequels, prequels and spinoffs come from it. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review אמיר ס Cool series about a greatest king. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Read all reviews {"audienceScore":{"reviewCount":23,"score":"89","sentiment":"POSITIVE","certified":false,"scorePercent":"89%"},"criticsScore":{"certified":false,"score":"60","sentiment":"POSITIVE","scorePercent":"60%"},"emptyMessage":"There are no Audience reviews for House of David &mdash; Season 1 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"e725b23f-2c40-335c-9336-87c7fed4f8f4","isPreRelease":false},"reviews":[{"displayDate":"03/02/25","displayName":"Robert S","isVerified":false,"ratingId":"fab3ca68-9413-4546-933e-3