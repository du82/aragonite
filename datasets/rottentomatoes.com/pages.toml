ted News Videos Photos Media Info Where to Watch Severance — Season 2 {"affiliates":[{"icon":"apple-tv-plus-us","url":"https://tv.apple.com/us/episode/hello-ms-cobel/umc.cmc.1xkk4g9qkusfdsjezvqznch8b?action=playSmartEpisode&cmp=rt_where_to_watch&itsct=RT&itscg=30200&at=10l9IP","isSponsoredLink":true,"text":"Apple TV+"}],"affiliatesText":"Watch Severance &mdash; Season 2 with a subscription on Apple TV+.","justWatchMediaType":"show","seasonNumber":"2","showtimesUrl":"","releaseYear":"2022","tarsSlug":"rt-affiliates-sort-order","title":"Severance &mdash; Season 2"} Apple TV+ Watch Severance — Season 2 with a subscription on Apple TV+. Severance — Season 2 What to Know Critics Consensus Masterfully managing its two halves of adroit character study and surreal nightmare, Severance's long-awaited sophomore season makes cognitive dissonance a mind-melting pleasure. Read Critics Reviews Critics Reviews View All (166) Critics Reviews Phillip Maciak The New Republic While the show giddily draws on the histories of Mormonism and Scientology in crafting this founder’s narrative, there’s originality in the writing, including a particularly memorable new story about the harms of self-pleasure in the great outdoors. Jan 31, 2025 Full Review Ben Dowell Times (UK) The vibe — and vibes are key to this show — continues to be as queasy and airless as the worst office experience. You feel submerged, as if you can almost smell the nylon and morning breath. Rated: 5/5 Jan 27, 2025 Full Review Noah Berlatsky Chicago Reader The second season is excellent television. Season one, though, was more than that—at least half the time. Jan 23, 2025 Full Review Brett McCracken The Gospel Coalition Perhaps for a generation growing accustomed to blurred lines between work and home, the “severance” pitch sounds like heaven. But quickly in the series, and throughout its two seasons, the reality of being severed turns out to be much more like hell. Feb 24, 2025 Full Review Tara Ariano Cracked My problem with Severance is how its dangling plot threads mostly seem designed to inspire fan theories online, and that being on AppleTV+ will neuter any political commentary it may attempt to inject. Rated: C- Feb 20, 2025 Full Review Ana Yorke PopMatters It is to be expected that the sci-fi genre, if not television itself, will be measured against Severance for years to come. Feb 20, 2025 Full Review Read all reviews Audience Reviews View All (175) audience reviews Olivia M My first review! Sevreance is about the roles we play and how hard it is to blend them. Season 1 was way more about the context, whereto, who's in control etc this series uses the divided self concept to explore love and connection. The scene where Dylan's wife loves his meek innie and finds tenderness there. I've just watched episode 6 where Mark is being forcefully unified and the experience makes me think of an amanita trip with the twitching and breakthroughs. I marvel at how much work must go into everything. Interesting to follow the milchik story too where the hight level and criticism transmutes into bullying. T It is about how to look after the soft souls. Rated 5/5 Stars • Rated 5 out of 5 stars 03/02/25 Full Review Audience Member Season 2 is a let down. The actors are good and the cinematography is good, but the writing is just poor. If you don't watch season 2 you will not have missed anything. It is just "meh". Rated 2/5 Stars • Rated 2 out of 5 stars 03/01/25 Full Review Justin H Severance is intelligent and well-written. The cinematography is great, it is visually appealing, and the directing and the acting is very good. While season 1 was a bit faster-paced, season 2 avoids the pitfalls of many shows in their sophomore season. As some have said, at times Severance feels confusing and in many ways that is part of the charm. It leaves you to consider until the next episode all that you have seen before, like a puzzle that is slowly coming together. Many shows lose the plot in their second season. Severance on the other hand, seems to be steadily guiding viewers towards the final destination. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Larry D Season 2 is unwatchable. Painfully struggled to get through each episode. Giving up. Like many series they don’t know when to leave well enough alone and move on. Great concept for the first season, but that should have been it. Instead they milk it. Rated 1/5 Stars • Rated 1 out of 5 stars 03/01/25 Full Review Tyler B This second season is not good. They went way off course. They lost me. Rated 0.5/5 Stars • Rated 0.5 out of 5 stars 03/01/25 Full Review Michael S When your lead actor is in his late 40s, you don't wait three years between seasons. The most surreal, horrifying image of the entire season is a close-up of 51 year-old Adam Scott's rapidly aging face. I can't imagine how much Apple is paying for viewers to rate this highly, or how much they'll pay for awards, but it doesn't deserve a single one. Not only did they wait three years between seasons, they also reduced the episodes by two - something shows that are thriving don't do. It's clear they don't know where to go with anything and don't actually have any grand message to make, so they just try to distract the audience with trick camera angles and blaring pretentious music as loud as they can. Rated 1.5/5 Stars • Rated 1.5 out of 5 stars 03/01/25 Full Review Read all reviews {"audienceScore":{"reviewCount":175,"score":"73","sentiment":"POSITIVE","certified":false,"scorePercent":"73%"},"criticsScore":{"certified":true,"score":"97","sentiment":"POSITIVE","scorePercent":"97%"},"emptyMessage":"There are no Audience reviews for Severance &mdash; Season 2 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"4245c5d5-085e-3014-bd58-29aaa3a36df6","isPreRelease":false},"reviews":[{"displayDate":"03/02/25","displayName":"Olivia M","isVerified":false,"ratingId":"e1cbbf31-e11a-4254-9025-87cb