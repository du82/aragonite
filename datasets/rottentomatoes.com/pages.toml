wn and cautiously turns to Dr. Gabriela Torabi; Billy and Jane feel the pressure from Robinson's investigation. Details Episode 4 Aired Feb 4, 2025 Agent Billy Pace The citizens of Paradise celebrate at the annual carnival; Xavier and Billy delve deeper into their investigation. Details Episode 5 Aired Feb 11, 2025 In the Palaces of Crowned Kings Xavier faces the consequences of his investigation, forcing him to consider how to proceed. Details Episode 6 Aired Feb 18, 2025 You Asked for Miracles Xavier and Robinson set their plans in motion while Sinatra works to preserve the status quo in Paradise. Details Episode 7 Aired Feb 25, 2025 The Day Sinatra and Xavier confront the past, returning to the harrowing day that brought them to Paradise. Details Episode 8 Airs Tue Mar 4 The Man Who Kept the Secrets Xavier and Robinson race to find President Bradford's murderer before it's too late. Details More Like This View All Popular TV on Streaming Pam & Tommy 78% 67% Pam & Tommy Watchlist TRAILER for Pam & Tommy T'''
