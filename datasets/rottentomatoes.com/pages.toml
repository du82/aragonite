 with each fresh turn. Feb 21, 2025 Full Review Miles MacClure Chicago Reader Like a lotus in muddy water, Mike White gives his characters room to breathe, cleanse, blossom, and discover parts of themselves they never knew were there. Feb 20, 2025 Full Review Bruce R. Miller Sioux City Journal “The White Lotus,” season three, is a bit more lush than the previous two and stuffed with phrases you’ll be hearing for months to come. Don't be surprised if, like Saxon, you say, "This place is clutch." Rated: 3.5/4 Feb 28, 2025 Full Review Andrew Murray The Upcoming The third season of The White Lotus continues to do what the anthology does best. The latest outing may not break any new ground for the show, but the all-star performances and meticulous writing ensure that viewers won’t be disappointed. Rated: 4/5 Feb 26, 2025 Full Review Barbara Ellen Observer (UK) There are times when this outing feels like a slower, more laboured ride. But it’s still a treat. Rated: 4/5 Feb 24, 2025 Full Review Read all reviews Audience Reviews View All (144) audience reviews Bostjan P Good, but not great. liked S1 and S2 much more. We all know now that rich people are totally f**ked up, so now we need something more interesting. Rated 3/5 Stars • Rated 3 out of 5 stars 03/02/25 Full Review Larry D Unwatchable. Painfully struggled to get through second episode. No magic, no likable charters. Giving up. Like many series they don’t know when to leave well enough alone and move on. Maybe one of the characters will rent waterskis and find a shark to jump over. Rated 0.5/5 Stars • Rated 0.5 out of 5 stars 03/01/25 Full Review 卡 泥 Mike White is back, and The White Lotus Season 3 wastes no time immersing us in yet another luxurious vacation filled with tension, mystery, and biting satire. Set in the breathtaking landscapes of Thailand, the first two episodes introduce a fresh batch of wealthy, deeply flawed guests whose secrets are already bubbling to the surface. Rated 5/5 Stars • Rated 5 out of 5 stars 02/28/25 Full Review Jose F Maybe I’m not possessing the prereq knowledge needed to immerse myself into this season this goaround, but I’m finding it a snoozefest so far. The characters are weak, sorely superficial. At this point if the two brothers aren’t in bed together soon (not into incest), this will just be a complete dud. I’m finding myself laughing purely out of oh-this-is-supposed-to-be-funny-haha. I hope it gets better otherwise I will be canceling my Max subscription. This show is the only reason why I turned it back on. Rated 1.5/5 Stars • Rated 1.5 out of 5 stars 02/28/25 Full Review Lev R I thought the first season was deep and hilarious. This season feels super slow, but most importantly, none of the new characters have the same spark of the cast from the debut season. It's slow, dull, and derivative. No wonder people are freaking out about the two brothers--that's about the only aspect that stands out. Rated 1/5 Stars • Rated 1 out of 5 stars 02/27/25 Full Review Jaye M I kept yawning so much while waiting for something to actually happen that I went through several tissues wiping my eyes. Boring rich family, catty three women "friends", nothing set up that tells me there's going to be anything happening. Waiting, waiting, waiting.... Without Jennifer Connelly, there's a big hole in the cast. Decided to re-watch The Sopranos when even when nothing's happening, *something's* happening. Rated 1/5 Stars • Rated 1 out of 5 stars 02/27/25 Full Review Read all reviews {"audienceScore":{"reviewCount":144,"score":"91","sentiment":"POSITIVE","certified":false,"scorePercent":"91%"},"criticsScore":{"certified":true,"score":"96","sentiment":"POSITIVE","scorePercent":"96%"},"emptyMessage":"There are no Audience reviews for The White Lotus &mdash; Season 3 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"8aa8bf43-4e07-3c96-8dd5-8f3dbf07790b","isPreRelease":false},"reviews":[{"displayDate":"03/02/25","di