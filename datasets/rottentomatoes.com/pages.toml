des Videos Photos Media Info Where to Watch Running Point — Season 1 {"affiliates":[{"icon":"netflix","url":"https://www.netflix.com/title/81483318?cmp=rt_where_to_watch","isSponsoredLink":true,"text":"Netflix"}],"affiliatesText":"Watch Running Point &mdash; Season 1 with a subscription on Netflix.","justWatchMediaType":"show","seasonNumber":"1","showtimesUrl":"","releaseYear":"2025","tarsSlug":"rt-affiliates-sort-order","title":"Running Point &mdash; Season 1"} Netflix Watch Running Point — Season 1 with a subscription on Netflix. Running Point — Season 1 What to Know Critics Consensus Kate Hudson continuously makes three-pointer shots with her dynamite charisma in Running Point, carrying this amusing series while it straightens out its game strategy. Read Critics Reviews Critics Reviews View All (31) Critics Reviews Judy Berman TIME Magazine Running Point, like most successful comedies, gives us characters that draw on recognizable archetypes but come across as layered people. Mar 1, 2025 Full Review Wenlei Ma The Nightly (AU) The more you get into Running Point, the more it’s clear it’s not Ted Lasso. The similarities are only skin deep and the show very much leans into its own sense of humour and heart. Mar 1, 2025 Full Review Robert Levin Newsday Hudson packages all of this by balancing moments of broad comedy with the real sense of a person working hard to be taken seriously. Rated: 2.5/4 Mar 1, 2025 Full Review Kristen Maldonado Pop Culture Planet Ambitiously blends family dynamics, workplace shenanigans & sports grit in this charming comedy. With clever writing, high energy & standout performances, you’ll fall in love with this world that is equal parts Ted Lasso & Succession—with a Kaling twist. Mar 2, 2025 Full Review Belen Edwards Mashable Running Point's endlessly watchable cast carries the show through some bumpier pacing moments since, like with many streaming comedies, Running Point feels like it would benefit from a longer season. Feb 28, 2025 Full Review Joel Keller Decider Kate Hudson is the best part of Running Point, but Kaling, Ko, Barinholtz and Stassen have built a winning ensemble around her, with a story that’s not only a workplace comedy, but one about family, as well. Feb 28, 2025 Full Review Read all reviews Audience Reviews View All (15) audience reviews Karrie H A really good watch and a pleasant change from seemingly endless cop/thrillers right now. Comedy, romance, good plot, great characterisation yet pleasantly light-hearted. Bring on Season 2 please! Rated 5/5 Stars • Rated 5 out of 5 stars 03/02/25 Full Review Alex D If you love the Lakers its a must see Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Lauren M Damn this is so good from the brilliant creators Mindy, Ike and Dave!!! Hilarious, a much watch! Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Ken W Turn of 3/4 of your brain and think, this is the new 1st and 10. Rated 3/5 Stars • Rated 3 out of 5 stars 03/01/25 Full Review Susanne K Kate Hudson Shines, and the Whole Cast Delivers! What a fun and feel good show! I absolutely loved Running Point! Kate Hudson is effortlessly charismatic, and her portrayal of Isla Gordon is both hilarious and heartfelt. She brings the perfect mix of ambition, wit, and vulnerability to the role, making Isla someone you can’t help but root for. But she’s not the only standout—this entire cast is stacked with talent! Drew Tarver is hilarious as Sandy, Isla’s socially awkward but oddly brilliant younger half-brother. Brenda Song brings her signature charm and sass as Isla’s best friend and chief of staff, Ali, and their on-screen friendship feels so real. Scott MacArthur as the chaotic older brother and GM of the team is both frustrating and funny in the best way. Then there’s Chet Hanks, who plays the overconfident, social-media-obsessed point guard way too well (I was laughing every time he was on screen). Toby Sandeman as Marcus Winfield, the team’s star player, adds depth beyond just being the athletic heartthrob. Jay Ellis nails the role of the team’s head coach, bringing authority and humor, while Max Greenfield as Isla’s fiancé adds another layer of chaos and comedy. And let’s not forget Justin Theroux, who plays her power-hungry older brother so well—it’s impossible not to love hating him. The writing is sharp, the humor lands perfectly, and the behind-the-scenes look at professional basketball adds a fresh, exciting layer. Whether you’re a sports fan or just love a great character-driven comedy, this show delivers. Hoping for a second season already—Netflix, please make it happen! Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Ric O It's been some time since I left a review but this show totally deserves it. Kate Hudson is INCREDIBLE and so is the rest of the cast. Thank you, Netflix. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Read all reviews {"audienceScore":{"reviewCount":15,"score":"96","sentiment":"POSITIVE","certified":false,"scorePercent":"96%"},"criticsScore":{"certified":true,"score":"81","sentiment":"POSITIVE","scorePercent":"81%"},"emptyMessage":"There are no Audience reviews for Running Point &mdash; Season 1 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"0ec79b37-64e9-3852-9742-10108931e0c4","isPreRelease":false},"reviews":[{"displayDate":"03/02/25","displayName":"Karrie H","isVerified":false,"ratingId":"60be0ba6-29ae-4728-9f76-8929a8aedc14","ratingRange":"Rated 5/5 Stars &bull;&nbsp;","ratingRangeA11y":"Rated 5 out of 5 stars","review":"A really good watch and a pleasant change from seemingly endless cop/thrillers right now. Comedy, romance, good plot, great characterisation yet pleasantly light-hearted. Bring on Season 2 please! ","userAccountLink":"/profiles/M4kFo6tzQc1LHPacryuOBIxkcXXCNJIGDikAuA1SLLCVJiDWU6asXKhQQCGWF2mtjDTRnhZZCV4tKJFOJCw0FabiBlCZoslBhWdTzQHNOIOe"},{"displayDate":"03/01/25","displayName":"Alex D","isVerified