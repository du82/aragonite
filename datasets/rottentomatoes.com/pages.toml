Y THEY CALL A SPINOFF OFF A LEGENDARY SHOW. Rated 0.5/5 Stars • Rated 0.5 out of 5 stars 03/01/25 Full Review Brandon S I was so excited for this new spinoff, however, it did not meet the excitement of the original show. Definitely missing the OG cast! Rated 1/5 Stars • Rated 1 out of 5 stars 03/01/25 Full Review Pamela C I agree with the reviews trending about Suits LA. The original Suits had actors with charisma, panache, good looks and witty dialogue. You instantly had a crush on Harvey and Michael, and all the other characters had charm like the popular kids in school. It didn't really matter what the story line was; you just wanted to tune in to be part of their addicting personalities. The new Suits has none of this. I think the creators took the title "Suits" a little too seriously because the tailored suits are about the only good thing in the show, except the music by Bradley Denniston--that is awesome. The dialogue, while clippish and painfully trying too hard to move at a fast pace, is actually boring. I couldn't even finish the first episode. It's like the old saying: "you can dress them up, but you can't take them out." Rated 2/5 Stars • Rated 2 out of 5 stars 02/28/25 Full Review Read all reviews {"audienceScore":{"reviewCount":43,"score":"36","sentiment":"NEGATIVE","certified":false,"scorePercent":"36%"},"criticsScore":{"certified":false,"score":"37","sentiment":"NEGATIVE","scorePercent":"37%"},"emptyMessage":"There are no Audience reviews for Suits LA &mdash; Season 1 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"24be9241-c1fa-3e43-9f92-796769fe8c88","isPreRelease":false},"reviews":[{"displayDate":"03/02/25","displayName":"Pet Midgets 4","isVerified":false,"ratingId":"49ac971b-a29b-4d10-a5e5-b1bbebefad2d","ratingRange":"Rated 0.5/5 Stars &bull;&nbsp;","ratingRangeA11y":"Rated 0.5 out of 5 stars","review":"Hard to say which is worse, the script or the acting. The original was a masterpiece, the 