ass. Rated: 2/4 Feb 24, 2025 Full Review Lucy Mangan Guardian There is a lot going on -- narratively, thematically and cartilage crunchingly -- in Knight’s historically based (but freely tweaked) saga. The man knows what he is doing, though, and the experience is one of energetic abundance rather than chaos. Rated: 5/5 Feb 22, 2025 Full Review Barbara Ellen Observer (UK) When it comes into focus, A Thousand Blows is a full-blooded show, crackling with incident and fine performances. Rated: 3/5 Feb 24, 2025 Full Review Adam Sweeting The Arts Desk Everybody’s too outsized and brightly coloured to have much of a plausible inner life, and all the swearing, fighting, cheating and boozing leaves you feeling numb after a while. Rated: 3/5 Feb 24, 2025 Full Review Kate Sánchez But Why Tho? A Geek Community To call this series simply a boxing drama undersells how powerful its characters have been brought to the screen. A Thousand Blows is a “based on a true story” series that captures its audience by highlighting the depth of each life lived. Rated: 9/10 Feb 22, 2025 Full Review Read all reviews Audience Reviews View All (22) audience reviews Bonjour C I binge-watched the entire series and will likely watch it again. I enjoyed every minute—an absolute feast of a show with outstanding performances from the entire cast. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Audience Member Stephen Graham, Malachi Kirby, and Erin Doherty all deliver the goods. It’s definitely not akin to Peaky Blinders, as it has that Disney safety net applied to it - but it’s still riveting, and you do invest in all the characters. Definitely worth a watch. Rated 4/5 Stars • Rated 4 out of 5 stars 03/01/25 Full Review Audience Member Stephen Graham gives one of his most impressive performances to date in A Thousand Blows. Whilst the cast is exceptional across the board Graham's portrayal of Sugar Goodson is a performance the quality of which is rarely seen. From the writing and music to the costumes and sets this show lands hit after hit after hit. Rated 4.5/5 Stars • Rated 4.5 out of 5 stars 03/01/25 Full Review A S A thousand blows are not enough ! I can't wait for season 2. Highly recommend if you enjoyed Peaky Blinders. Well done ! Rated 4.5/5 Stars • Rated 4.5 out of 5 stars 02/28/25 Full Review Sky R A Thousand Blows is one of the best TV shows currently airing—gritty, realistic, and absolutely brilliant. I appreciate that they preserved much of the dialect, adding to its authenticity. Rated 5/5 Stars • Rated 5 out of 5 stars 02/27/25 Full Review Michael F All though the somewhat decent depiction of 19th century London looks visually impressive I personally think it's a far cry from the reality of the time. cheesiness and cliche come to mind while watching, one would expect a certain grit and darkness to portrait the poverty stricked brutal aspects of this time in history but this is not the case. series one of peaky blinders done a great job of portraying this how ever this show does not it gives a more colourful lighthearted portrayal of the times which leaves me disappointed and wanting a more honest and true vision of the times. Rated 2/5 Stars • Rated 2 out of 5 stars 02/25/25 Full Review Read all reviews {"audienceScore":{"reviewCount":22,"score":"77","sentiment":"POSITIVE","certified":false,"scorePercent":"77%"},"criticsScore":{"certified":true,"score":"91","sentiment":"POSITIVE","scorePercent":"91%"},"emptyMessage":"There are no Audience reviews for A Thousand Blows &mdash; Season 1 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"f9b14f7a-4960-38c1-8049-d39b19df902c","isPreRelease":false},"reviews":[{"displayDate":"03/01/25","displayName":"Bonjour C","isVerified":false,"ratingId":"18cb6b81-01cc-4bee-8e9a-0b3bd69ec362","ratingRange":"Rated 5/5 Stars &bull;&nbsp;","ratingRangeA11y":"Rated 5 out of 5 stars","review":"I binge-watched the entire series and will likely watch it again. 