es What Demon City lacks in terms of emotional depth or narrative complexity, it more than makes up for with its balls-to-the-walls, no-holds-barred, fabulously gory, and insanely entertaining action sequences. Rated: 4/5 Feb 27, 2025 Full Review Read all reviews Audience Reviews View All (8) audience reviews Darren D' E If you like this kind of genre revenge action movie. This one i guarantee you love this movie. Simply and satisfy, i hope there will make another demon city movie. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Jacquelin M I don't normally write movie reviews but after watching most of this movie, I thought I was going to commit Hara-Kiri. Pun intended. Worst movie I have seen in quite a while. So over the top, excessive gore and downright stupid dialog. The so called Demon turns out to be the Hero of the movie. So ridiculous. I have a feeling that those who liked this terrible movie, were most likely adolescent boys. Rated 0.5/5 Stars • Rated 0.5 out of 5 stars 03/01/25 Full Review mai p Best Japanese action movie I have ever watched! Rated 5/5 Stars • Rated 5 out of 5 stars 02/28/25 Full Review Alex T Decent film, you can see the western influences with Miami vice style scenic shots / scoring and the similarities with John Wick (including the car). The fight scenes are abit to quick and chaotic so you can't see everything but a decent watch if you don't take it too seriously. Rated 4/5 Stars • Rated 4 out of 5 stars 02/28/25 Full Review Richard F It was a fun movie with some nice twists. I enjoyed the main character and the inventive fighting sequences. It reminded me of some of the 90’s hit man/martial arts flicks. The villains progressively became more deadly like what you’d encounter in a video game. Overall I’d watch it again. Rated 4.5/5 Stars • Rated 4.5 out of 5 stars 02/28/25 Full Review Ash P A simple revenge story as well as being straightforward from start to finish. Toma Ikuta playing as a Yakuza hitman looking to do one last job before settling in with his wife and daughter until a group of men in demon masks kills them. However, Sakata, Toma Ikuta's character, is now back without most of his motor skills until one of the men who killed his family comes in his sights and starts a killing spree against the ones who took his life. Ironically, Sakata is the demon possessed man that they call him, metaphorically speaking. So the story is as straightforward as I've said before, with little emotion that was put into. Neither much on character development, as well. But I digress. There are a couple of emotional moments that does get you emotional, without spoiling too much of it. What carries the movie is the action that is as bloody and gory as a TV-MA rated movie gets when it's on Netflix. You're free to watch it in either English or Japanese. The thing about the times when we get a break from the action is not as much emotional as the moments I'd mentioned. Yet the final act was an improvement, and the ending was satisfying. I also read that this is an adaptation of the manga, which I wouldn't be surprised if it's more detailed than what hasn't shown much within the movie. Because we get some details of the villains, yet not too much impact aside being a group that does your usual human trafficking, drug dealing, economical manipulation, and political manipulation. That could go the same for the main lead. Again, not too much with character development that I'd mentioned a moment ago. I wouldn't sleep on this if you're into action-packed films and looking for some emotional moments that connect with the main character himself. Simple, yet satisfying from start to finish. I give this film on Netflix six Sakata giving his enemies a cleaver to the face out of ten. 6/10. Rated 3/5 Stars • Rated 3 out of 5 stars 02/28/25 Full Review Read all reviews {"audienceScore":{"certifiedFresh":"none","reviewCount":8,"certified":false},"emptyMessage":"There are no Verified Audience reviews for Demon 