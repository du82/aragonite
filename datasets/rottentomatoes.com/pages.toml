 4/5 Feb 25, 2025 Full Review Brian Tallerico RogerEbert.com The consistently shallow and clichéd writing often fades away under the production value of “1923” and the sheer scope of what Sheridan and his team are attempting. Feb 21, 2025 Full Review Alci Rengifo Entertainment Voice You can be entertained by “1923” without ever having thrown a punch or stared down a mountain lion. Feb 25, 2025 Full Review Andrew Murray The Upcoming There are moments of brilliance found throughout the show’s lovingly realised depiction of 1920s America. However, the show tends to indulge in the melodramatic, turning the period drama into something more akin to a soap opera. Rated: 3/5 Feb 24, 2025 Full Review Alan French Sunshine State Cineplex With violence and anger bubbling in the Yellowstone, 1923 allows the period drama to shine. Sheridan’s cast gets to showcase their talent, and the story feels far more focused out of the gate. Rated: 8/10 Feb 24, 2025 Full Review Lacy Baugher Paste Magazine While some of its swings don’t always connect, it’s still captivating television. In its second outing, the various threads of its story finally begin to (slowwwwwwly) tie together, and it’s all the better for it. Rated: 8.3/10 Feb 22, 2025 Full Review Read all reviews Audience Reviews View All (17) audience reviews Jody M Love this series—cannot wait to see how they bring this full circle. The live story is one of the most romantic stories in television and on scene since The Notebook, Love Story, the classics. Rated 4.5/5 Stars • Rated 4.5 out of 5 stars 03/01/25 Full Review Lisa G Great story, acting, cinematography what more can you ask for?!! You can watch 1883 first- or not - doesn't matter. Epic love story along with the story of survival of the Dutton family in beautiful Montana. The story also includes the mistreatment of Indian female children by the catholic church that is not for the faint of heart. All in all, the best show of the year so far! Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Miles G Amazing show. Don’t listen to the critics talking about it not being “family friendly”. What Sheridan show is?????? It’s not meant for kids at all so don’t rate it based on the warned about adult content. Yeah it’s a little twisted at points, but the show is awesome!!! Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review David B Took a series we thoroughly enjoyed in season 1 and dumbed it down with shock and awe via gratuitous nudity and sexual violence. We never made it past the first 15 minutes and shut it off. Disappointing. Rated 0.5/5 Stars • Rated 0.5 out of 5 stars 03/01/25 Full Review Audience Member Overall, the second season of “1923” offers high-quality production and strong acting performances, especially from Ford and Mirren. However, the difference in opinions between critics and audiences suggests that the viewing experience may vary depending on individual preferences. Rated 5/5 Stars • Rated 5 out of 5 stars 03/01/25 Full Review Scott H I'm not a prude. The first episode was a 50/50 split between moving the plot forward vs bondage and sexual violence. I could be interested in what happens to the ranch or whether the younger Dutton couple find their way back together again. It looks like that's going to move very slowly with lots of filler. Rated 1.5/5 Stars • Rated 1.5 out of 5 stars 02/28/25 Full Review Read all reviews {"audienceScore":{"reviewCount":17,"score":"52","sentiment":"NEGATIVE","certified":false,"scorePercent":"52%"},"criticsScore":{"certified":false,"score":"100","sentiment":"POSITIVE","scorePercent":"100%"},"emptyMessage":"There are no Audience reviews for 1923 &mdash; Season 2 yet.","linkCss":"","partial":"pages/_shared/mediaAudienceReviewsCarousel.html","ratingsData":{"emsId":"c5bc8eb6-dcec-3bd6-81a9-f0518551351d","isPreRelease":false},"reviews":[{"displayDate":"03/01/25","displayName":"Jody M","isVerified":false,"ratingId":"4e1940c0-4f3c-4f56-880e-5c70c66df38a","ratingRange":"Rated 4.5/