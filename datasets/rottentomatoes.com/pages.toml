description = "Inspired by the true life stories of a group of characters battling for survival in the brutal East End of London in the 1880s. Hezekiah Moscow and Alec Munroe, best friends on the run from Jamaica, find themselves thrust into the criminal underbelly of London’s thriving bare-knuckle boxing scene. As Hezekiah finds fortune and fame through the art of pugilism, he attracts the attention of the infamous Queen of the Forty Elephants, Mary Carr, who sets about exploiting his talents to further her criminal enterprise. Meanwhile the menacing and self-declared emperor of the East End boxing world, Sugar Goodson, determines to destroy Hezekiah whose ambitions to fight in the West End threatens everything he has built. What ensues is a battle of the old world against the new."
