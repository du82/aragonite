title = "DIG! XX | Rotten Tomatoes"
description = "20 years ago, Sundance was rocked by DIG!, Ondi Timoner's genre-topping rockumentary about two Gen-X bands and their journey to alt-rock glory. Shot over nearly a decade, DIG! explores the collision of art and commerce through the star-crossed friendship and bitter rivalry of dueling 90s bands The Dandy Warhols and The Brian Jonestown Massacre. Through their loves and obsessions, gigs, arrests and death threats, uppers and downers, and ultimately to their shot at mainstream success, they stage a self-proclaimed revolution in the music industry. DIG! XX -- a bigger, better, crazier expanded reimagining of the original cut -- reminds us why the original is canon and why sometimes, more is better."
