["https://roundcube.net/news/page14"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News New nightly build released for testing05 March 2010 For the upcoming version 0.4 of Roundcube Webmail we have done some refactoring of the backend code which improves both performance and reliability of the application. These changes now need to be well tested before we continue to implement new features like threaded message listing planned for the 0.4 release. Continue reading Update to 0.3.1 released31 October 2009 This update release fixes lots of bugs and improves the file upload when composing a mail message. Also some of the plugins have been improved and translated into more languages. Continue reading Version 0.3-stable released 04 September 2009 We’re proud to announce the stable release of version 0.3 with the long-awaited plugin API. Now the doors are open to extend Roundcube’s functionality and the integration in other web-based systems got much easier. The package includes a default set of useful plugins and some sample code. An introduction to plugin development can be found on our wiki at trac.roundcube.net/wiki/Doc_Plugins . Continue reading Release Candidate for 0.327 July 2009 After getting plenty of feedback for the plugin API which was published in version 0.3-beta we now released an almost-ready version of RoundCube. The reason why this not yet a stable release are some pervasive changes on the IMAP backend in order to improve performance. We’d like our dear users to extensively test this release candidate and submit errors to our bug tracker. The 0.3-stable release will follow soon… Continue reading Update 0.2.2 released18 May 2009 A little service release was just released. It contains some minor bug fixes and a newly added support for STARTTLS in IMAP connections. We recommended to update all installations of RoundCube Webmail to this version. Continue reading Update 0.2.1 released10 March 2009 This service release includes more than 40 bug fixes, security improvements and completes some missing translations. We also added TNEF support to decode proprietary MS Outlook attachments (winmail.dat) and tuned the performance when displaying a message. Continue reading Version 0.2-stable released 30 December 2008 The second stable version of the RoundCube Webmail package completes unfinished work from the 0.2-beta release and comes up with about 80 bugfixes as well as some performance improvements. The upgrading process now became very easy with the integrated update script. It’s runnable from the shell or from within the web-based installer. Read the UPGRADING instructions for details. Continue reading Security update for 0.2-beta16 December 2008 There were two security issues reported which are now fixed. The first was as possible code injection using the html2text conversion script. The other exploit used the unchecked size parameters of the quota image to let PHP create huge images eating up all the server memory. Continue reading Version 0.2-beta released21 September 2008 This new version comes with many fixed bugs and some new features like Continue reading We now accept donations!13 June 2008 After getting several requests about donations for our project we decided to open a PayPal account for this purpose. But donations to RoundCube Webmail will be passed to charity projects, mainly the KANTHA BOPHA Children’s Hospital in Cambodia. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
