["https://roundcube.net/news/page4"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News Security update 1.4.1108 February 2021 We just published a service and security update to the stable version 1.4 of Roundcube Webmail. It provides a fix for a recently reported stored XSS vulnerability as well a some general improvements from our issue tracker. Continue reading Security updates 1.4.10, 1.3.16 and 1.2.13 released27 December 2020 We just published security updates to the stable version 1.4 and the LTS versions 1.3 and 1.2 of Roundcube Webmail. They all contain fixes to a recently reported stored XSS vulnerability. The 1.4.10 release also contains a few general improvements from our issue tracker. Continue reading Installer Update for Composer 2.004 November 2020 Roundcube’s plugin installer is built with Composer and implemented as a custom component to handle packages of type roundcube-plugin. Now Composer has released a new major version 2.0 which brings a few breaking changes. Continue reading Update 1.4.9 released27 September 2020 We proudly announce the next service release to update the stable version 1.4. Continue reading Security updates 1.4.8, 1.3.15 and 1.2.12 released10 August 2020 We just published security updates to the stable version 1.4 and the LTS versions 1.3 and 1.2 of Roundcube Webmail. They all contain two recently reported cross-site scripting (XSS) vulnerabilities. The 1.4.8 release also contains a number of general improvements from our issue tracker. Continue reading Security updates 1.4.7, 1.3.14 and 1.2.11 released05 July 2020 We just published security updates to the stable version 1.4 and the LTS versions 1.3 and 1.2 of Roundcube Webmail. They all contain a recently reported cross-site scripting (XSS) vulnerability. The 1.4.7 release also contains a number of general improvements from our issue tracker. Continue reading Updates 1.4.6 and 1.3.13 released07 June 2020 We just published two follow-up releases to the recently published versions 1.4.5 and 1.3.12 of Roundcube Webmail. Continue reading Security updates 1.4.5 and 1.3.12 released02 June 2020 We just published service and security updates to the stable version 1.4 and the LTS version 1.3 of Roundcube Webmail. They contain four fixes for recently reported security vulnerabilities as well a number of general improvements from our issue tracker. Continue reading Security updates 1.4.4, 1.3.11 and 1.2.10 released29 April 2020 We just published service and security updates to the stable version 1.4 and the LTS versions 1.3 and 1.2 of Roundcube Webmail. They contain four fixes for recently reported security vulnerabilities as well a number of general improvements from our issue tracker. Continue reading Changes in Roundcube's Plugin Repository11 April 2020 Roundcube’s plugin repository is built around Composer which is used to install plugins and their dependencies. For many years we’ve been running our own plugin repository from a fork of the most popular packagist.org service. Over time source code repositories like Github, Gitlab or Bitbucket as well as the Packagist codebase changed significantly which made it hard for us to maintain our fork. We therefore decided to give it up in favor of the well maintained packagist.org service. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
