["https://roundcube.net/news/2024/08/08/introducing-enterprise-support-for-roundcube"]
title = "Official enterprise support now available"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Official enterprise support now available Published: 08 August 2024 Tags: announcement Today, we are excited to introduce the first official offering of enterprise support for Roundcube! It is tailored specifically for mail providers running large instances with thousands to millions of end users. We also offer our services to help businesses, universities and the public sector, but our offering makes the most sense for larger installations. Our goal is to help organisations that want to deploy Roundcube – lowering the barrier to entry and helping Roundcube grow. And, of course, the improvements, bug fixes and funds that come out of this will go back into Roundcube, making it a better product for everybody! The offering optionally includes mail server options Dovecot Pro or Stalwart, as well as encrypted emails thanks to the privacy experts at Mailvelope. Read the full story in Nextcloud’s announcement and the get in contact with Nextcloud through the Roundcube enterprise support page. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released Update 1.6.6 released"
