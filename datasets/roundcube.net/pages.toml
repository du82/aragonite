["https://roundcube.net/news/2023/11/30/nextcloud-the-new-home-for-roundcube"]
title = "Nextcloud – the new home for Roundcube"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Nextcloud – the new home for Roundcube Published: 30 November 2023 Tags: announcement We’re happy to announce that the Roundcube project has found a new home with Nextcloud. After Thomas, our founder and project lead, decided to step back, the Nextcloud project project has now assumed ownership of the project organization and taken over the strategic, operational and administrative responsibilities for Roundcube. With its unwavering dedication to software freedom and data self-sovereignty, Nextcloud will empower Roundcube, thereby enhancing development, fostering the growth of the contributing community and in the longer term, exploring further possibilities for collaboration. Read the full story in Nextcloud’s announcement and more background information in the intervew with Frank Karlitschek and Thomas Bruederli. I‘m proud and thankful for the many years with Roundcube and I’m now very happy to see our project in good hands to remain a vital contributor for IT decentralization. – Thomas Bruederli Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
