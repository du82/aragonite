["https://roundcube.net/news/2015/05/03/roundcube-next-is-coming"]
title = "Roundcube Next is coming and we need your help"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Roundcube Next is coming and we need your help Published: 03 May 2015 Tags: announcement Roundcube prouldy announces the crowd funding campaign to bring our vision of a better email experience to reality. The web has evolved a lot in the last decade, and we want Roundcube to take full advantage of the best web technologies available today. Therefore it’s time for a dramatic change to the Roundcube architecture and to also to rethink email in general, how it’s used today and how we could use the new technologies to give the best user experience to everyday communication. Applying what we’ve learned from our first 10 years of experience developing Roundcube, we have been working on a development plan for how to achieve our new goals. And in order to finally make this happen, we also need your support to drive the professional software development process behind this plan. Please join the fun at roundcu.be/next and support our crowd funding campaign either directly or by simply spreading the word about it. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
