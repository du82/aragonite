["https://roundcube.net/contribute"]
title = "Roundcube Webmail Contributions"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = '''How to Contribute Want to help make Roundcube the best webmail solution ever? Roundcube is an open source project and all volunteers are welcome, we're always looking for new additions and resources. The Roundcube development mailing list is the place where ongoing development is discussed. This mailing list is not a support forum, and requests for help with non-development related problems will not be answered there. Thanks for keeping the list on-topic and productive! Reporting bugs Be sure that we test the code before we release it. However, you might find something that isn't right. To report bugs please use the GitHub issues section but read these instructions before opening a new ticket. And remember: the more information we get the easier we can reproduce and fix it. Coding Roundcube webmail is written in PHP and JavaScript (and of course HTML and CSS). If you have experience in any of these languages and you want to contribute, start right now! Get the source from our github repository or fork it right away and read the How to get involved guide to find out what to do next. Translation We have moved our translations to Transifex where you can all contribute and help to keep the translations up-to-date. Go to transifex.com and register yourself as a Transifex user. In order to start translating, you have to become a member of the translation team for your language. To do so, choose your language from the list and then click "Join team" on the upper right part of the overview page. Your request will be proceeded as fast as possible. Documentation Did you want to know how to do something and find that the documentation didn't explain it or didn't explain it well? We're happy to accept additions to the documentation; simply create an issue with the text and either a link to the existing page or a request for a new page.'''
