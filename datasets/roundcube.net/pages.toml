title = "Security updates 0.8.6 and 0.7.3"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Security updates 0.8.6 and 0.7.3 Published: 27 March 2013 Tags: updates security We just published new releases which fix a recently reported vulnerability that allows an attacker to access files on the server. Please update your installations with the new versions or patch them with the fix which is also published in the downloads section or our sourceforge.net page. Download the latest version from roundcube.net/download Patch for 0.9.x: ow.ly/jtQD0 Patch for 0.8.x: ow.ly/jtQHM Patch for 0.7.x: ow.ly/jtQK0 Patch for 0.6: ow.ly/jtQNd In order to find out whether one of your users has vulnerable preferences, you can run the following query on the Roundcube user database: SELECT * FROM users WHERE preferences LIKE ‘%generic_message_footer%’ If this returns any results, you should block that user because he or she most likely tried to exploit your system. And here’s some background about the vulnerability from the mailing list archive. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
