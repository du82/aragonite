full_description = "Security updates 1.4.5 and 1.3.12 released Published: 02 June 2020 Tags: releases updates security We just published service and security updates to the stable version 1.4 and the LTS version 1.3 of Roundcube Webmail. They contain four fixes for recently reported security vulnerabilities as well a number of general improvements from our issue tracker. Security fixes Fix XSS issue in template object username ** Fix cross-site scripting (XSS) via malicious XML attachment * Fix a couple of XSS issues in Installer ** Better fix for CVE-2020-12641 The latter two vulnerabilities again are related to public access to the Roundcube installer and are therefore classified minor. See the full changelogs in the release notes on the Github download pages for the updated versions 1.4.5 and 1.3.12. We strongly recommend to update all productive installations of Roundcube with this new versions. * Credits to the security researcher Matei “Mal” Badanoiu ** Credits to the security researcher LoRexxar@knownsec 404Team Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
