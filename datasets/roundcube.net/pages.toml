title = "Roundcube Webmail Downloads"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Download your version of Roundcube Stable version - 1.6.10 Package Size SHA-256 checksum Dependent1 Download 3.8 MB 63f47ded363063c59a47031c1e3aca7e1df89254e7ce9dced699cdbfadd9d39f Complete Download 5.6 MB 03cfac2f494dd99c25c35efb0ad4d333f248e32f25f4204fbc8f2731bfbaf0e4 Framework Download 1.1 MB 2cbdcc955ef0d47f9551d373ddce38401f70861b62beaff05720f56e1fde6575 LTS versions Long Term Support with low maintenance mode. This means only security updates and rare fixes of serious issues will go into these release branches. Package Size SHA-256 checksum 1.5.9 - Complete Download 7.4 MB f0af30b8b3491c2d349344c4fdfb4fbbf0c16eefa73496c424f737e232ed13dc 1. Dependent packages only contain sources which are licensed under the GPL but they require some third-party packages to be installed along with Roundcube. All requirements are listed in the INSTALL instructions within the package file. Other sources and downloads GitHub All recent versions are listed on our GitHub releases page - complete with release notes and signatures. To get the bleeding edge development version check out the files directly from our GitHub repository. Archives of older releases can be found on sourceforge.net. Docker The Roundcube Docker image is available on Docker Hub as PHP-FPM service or complete webserver with Apache. More information on Docker and a quick start guide is available in the Docker documentation. We provide examples to run Roundcube with docker-compose or in Kubernetes. Install one of the Roundcube Helm charts from artifacthub.io Other Roundcube can also be installed through auto installers like softaculous.com or cPanel. The BitNami Roundcube Stack provides a one-click installer for various platforms and cloud services. Via the Cloudron app store. Each Cloudron is a fully equipped mail server and has sieve integration. Various Unix/Linux distributions provide Roundcube via their package managers. Check your local package repository. PGP signatures for package verification Release tarballs listed above are signed with PGP to allow you to verify the authencity. We sign them with the identity Roundcube Developers <[email protected]> alias 41C4F7D5 and the public key can be downloaded from the pgp.mit.edu keyserver or from our website. The signatures can be found with the according release item on the GitHub releases page. After downloading the pubkey and the signature file, verify packages with gpg --verify roundcubemail-<version>.tar.gz{.asc,} Installation and upgrading Instructions on how to download and install Roundcube for the first time can be found in our Wiki. Continue reading how to configure Roundcube and your webserver. See our upgrading guide for information about updating an existing Roundcube installation. Plugins and skins Roundcube uses Composer to manage add-ons and dependencies. Our Plugins Repository contains a list of plugins and instructions on how to install them and keep them up-to-date. As well as plugins you'll also find additional skins available on Packagist. Complete email server packages with Roundcube Kolab Groupware The Kolab Groupware Solution provides a complete email and groupware server pre-packaged for various linux distributions with Roundcube sitting on top as its web client. It offers easy configurable LDAP address books, calendars, tasks, mobile synchronization and more. An enterprise version with professional support is available from Apheleia IT. iRedMail iRedMail is another fully open source email server solution that lets you install a full-featured email server in a few minutes. It installs and configures the popular open source email components like Postfix, Dovecot, Amavisd and - of course Roundcube - on major Linux and BSD distrubutions. Mail-in-a-Box Mail-in-a-Box turns a fresh cloud computer into a fully equipped, working mail server. The setup provides Roundcube webmail and an IMAP/SMTP server for use with mobile devices and desktop mail software. It also includes contacts and calendar synchronization. mailcow mailcow is an open source mail server suite for groupware/email purposes that can be installed in a fresh Debian/Ubuntu instance. It is powered by various open source mail server components (Dovecot, Postfix, ...) that can be administered in its modern web UI. It also comes with IMAP, POP3 and SMTP support as an alternative to Roundcube webmail."
