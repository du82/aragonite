["https://roundcube.net/news/2014/11/10/roundcube-webmail-1.1-beta-available"]
title = "Roundcube Webmail 1.1-beta available"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Roundcube Webmail 1.1-beta available Published: 10 November 2014 Tags: releases We’re proud to announce that the beta release of the next major version 1.1 of Roundcube webmail is now available for download and testing. With this milestone we introduce a bunch of new features and some clean-up with the 3rd party libraries Roundcube uses: Allow searching across multiple folders Improved support for screen readers and assistive technology using WCAG 2.0 and WAI ARIA standards Support images in HTML signatures (copy & paste) Added namespace filter and folder searching in folder manager New config option to disable UI elements/actions Stronger password encryption using OpenSSL Support for the IMAP SPECIAL-USE extension Support for Oracle databases Moved 3rd party libs to vendor directory, managed by Composer And of course plenty of small improvements and bug fixes. IMPORTANT: with this version, we dropped support for PHP < 5.3.7 and Internet Explorer < 9. IE7/IE8 support can be restored by enabling the legacy_browser plugin. See the complete Changelog at trac.roundcube.net/wiki/Changelog and download the new packages from roundcube.net/download. Please note that this is a beta release and we recommend to test it on a separate environment. And don’t forget to backup your data before installing it. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
