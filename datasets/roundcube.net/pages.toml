["https://roundcube.net/news/page9"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News New stable version 1.1.0 released08 February 2015 We’re proud to announce the arrival of the next major version 1.1.0 of Roundcube webmail which is now available for download. With this milestone we introduce new features since version 1.0 as well as some clean-up with the 3rd party libraries: Continue reading Security update 1.0.5 released24 January 2015 We just published a security update to the stable version 1.0. Beside a recently reported Cross-Site-Scripting vulnerability, this release also contains some bug fixes and improvements we found important for the long term support branch of Roundcube. Continue reading Update 1.0.4 released18 December 2014 We’re proud to announce the next service release to the stable version 1.0. It contains a security fix along with some bug fixes and improvements for the long term support branch of Roundcube. The most important ones are: Continue reading Roundcube Webmail 1.1-beta available10 November 2014 We’re proud to announce that the beta release of the next major version 1.1 of Roundcube webmail is now available for download and testing. With this milestone we introduce a bunch of new features and some clean-up with the 3rd party libraries Roundcube uses: Continue reading Update 1.0.3 released29 September 2014 We’re proud to announce the next service release to the stable version 1.0. It contains some bug fixes and improvements we considered important for the long term support branch of Roundcube. Continue reading Update 1.0.2 released20 July 2014 This is the second service release to update the stable version 1.0. It contains some bug fixes and improvements we considered important for the long term support branch of Roundcube. Continue reading Update 1.0.1 released11 May 2014 This is the first service release to update the stable version 1.0. It contains some important bug fixes and improvements, mainly a fix for the unintentional redirect from the compose page in Google Chrome which started to happen after a recent Chrome update. Continue reading Roundcube Webmail 1.0.0 released07 April 2014 We’re very proud to announce the stable version 1.0 of Roundcube Webmail. After more than 8 years since the project was published, we feel confident to name it one-dot-oh. From the last stable version we added to following new features: Continue reading Release Candidate for version 1.030 January 2014 We just published the feature-complete release candidate for the upcoming version 1.0. After adding some new features in 1.0-beta we further cleaned up the code, fixed some more bugs and prepared everything for the long awaited major release. Continue reading Release 1.0-beta available for download30 November 2013 We’re proud to announce that the long awaited version 1.0 of Roundcube webmail is now available as beta release for download and testing. With this milestone we introduce some important changes to the configuration as well as some nice new features: Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
