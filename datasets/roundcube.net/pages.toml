["https://roundcube.net/news/2022/07/28/roundcube-1.6.0-released"]
title = "Roundcube 1.6.0 released"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Roundcube 1.6.0 released Published: 28 July 2022 Tags: releases stable We proudly announce the release of the next major version 1.6 of Roundcube webmail. With this milestone we cleaned up the codebase and bring full support for PHP 8.1. The most noteworthy changes, as already announced with the beta release, are: PHP 8.1 support Dropped support for PHP < 7.3 Support responses (snippets) in HTML format Option to purge deleted mails older than 30, 60 or 90 days Unified and simplified services connection config options Removed the Classic and Larry skins from the release packages SQLite: Use foreign keys, require SQLite >= 3.6.19 See the full changelog in the release notes on the Github download page. Breaking Changes to 1.5 and prior versions The following config options have either been removed or renamed: IMAP: renamed default_host to imap_host removed default_port option (non-standard port can be set via imap_host) set “localhost:143” as a default for imap_host SMTP: renamed smtp_server to smtp_host removed smtp_port option (non-standard port can be set via smtp_host) set “localhost:587” as a default for smtp_host LDAP: removed port option from ldap_public array (non-standard port can be set via host) removed use_tls option from ldap_public array (use tls:// prefix in host) Managesieve: removed managesieve_port option (non-standard port can be set via managesieve_host) removed managesieve_usetls option (set tls:// prefix to managesieve_host) The skins Larry and Classic are no longer part of the release packages. If you used them in your deployment, you need to install them manually. That can easily be done via Composer: $ composer require roundcube/larry This release is considered stable and we encourage you to update your productive installations after carefully testing the upgrade scenario. Download it from roundcube.net. With the release of Roundcube 1.6.0, the previous stable release branches 1.5.x and 1.4.x will change into LTS low maintenance mode which means they will only receive important security updates. The 1.3.x series is no longer supported and maintained. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
