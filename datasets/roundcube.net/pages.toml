["https://roundcube.net/news/page11"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News Moving from launchpad to Transifex02 January 2013 I’d like to inform you that we now decided to switch from launchpad to Transifex to maintain the translations for Roundcube. You can find Roundcube on Transifex.com at https://www.transifex.com/projects/p/roundcube-webmail. Continue reading Update 0.8.4 released14 November 2012 We just published new packages for Roundcube webmail. This service update mainly fixes a nasty bug which sneaked into the last 0.8.3 release. In addition to that, we also packed some more fixes into this release, one of them a recently reported XSS vulnerability. Continue reading Update 0.8.3 released10 November 2012 Today we can announce another service release of the Roundcube webmail package. This update adds small bug fixes and improvements to the 0.8 stable series. It also fixes a possible, although unintended, DoS to the webserver running Roundcube. See the included CHANGELOG file for details. Continue reading Update 0.8.2 is out05 October 2012 Today we can announce another release of the Roundcube webmail package. This service update adds some bug fixes and small improvements to the 0.8 stable series. See the CHANGELOG file for details. Continue reading Updates 0.8.1 and 0.7.3 released17 August 2012 As usual when a new stable release arrives, there are a few things that didn’t make it into that. Therefore we just published an update release adding bug fixes, some minor feature improvements and, most important, two fixes for a recently reported XSS vulnerability in Roundcube’s HTML message handling. Continue reading Roundcube, the new web client for Kolab08 August 2012 Our recent partnership with the Kolab Groupware project is finally showing some results. The Kolab team yesterday published a preview release of their all-new Kolab 3.0 groupware suite including Roundcube as the new web client to access all the relevant groupware functions. Nice work guys! Continue reading Release 0.8 (stable) with new skin is out07 August 2012 We’re proud to finally release version 0.8 with the brand new skin, codename “Larry”, becoming the new default UI for Roundcube. After two preview releases and a lot of fine-tuning, the new design by bueroflint.com has now grown up. But to all nostalgics out there: don’t worry, the old skin still remains part of the package and will be maintained for at least one more major release. Continue reading Release candidate version 0.820 May 2012 The stable release with the new skin is getting closer! We just published the release candidate version 0.8 which fixes some more bugs and completes the work on the new skin Larry. It’s now feature complete and everybody is kindly invited to do some more tests with this release and report bugs to our tracker. Continue reading Goodbye Subversion, hello github09 May 2012 Upon several requests from our community we now moved the Roundcube Webmail source code repository from our privately hosted Subversion server to github. With this step we hope to make it easier for anybody to get the source and to contribute patches and improvements. Continue reading Update 0.7.2 released11 March 2012 Today we can announce another release of the Roundcube webmail package. This service update adds some bug fixes and stability improvements to the 0.7 stable series. It also includes new settings to change how contacts are listed in the address book section. See the CHANGELOG file for details. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
