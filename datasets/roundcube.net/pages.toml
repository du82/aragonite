["https://roundcube.net/news/page10"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News Security updates 0.9.5 and 0.8.721 October 2013 We just published new releases which fix a recently reported vulnerability that allows an attacker to overrwrite configuration settings using user preferences. This can result in random file access, manipulated SQL queries and even code execution. The latter one only affects versions 0.8.6 and older. Continue reading Update 0.9.4 released06 September 2013 It wouldn’t be Roundcube if there wasn’t a minor glitch in our stable releases every now and then. It so happened again in the recent 0.9.3 release where an include_path check triggered some regex warnings on Windows systems. We apologize for this! But we’re trying hard to keep up and here’s a new release which fixes that nasty bug together with some other reported issues that we considered worth being ported to the 0.9 release series. Continue reading Update 0.9.3 released21 August 2013 We proudly announce the third service release for the stable 0.9 series of Roundcube webmail. It fixes 25 more bugs including two recently reposted XSS vulnerabilities with HTML messages and signatures. Along with that, we also optimized the UI behavior for touch devices to make Roundcube work nice and smoothly on tablets running iOS or Android. Continue reading Update 0.9.2 is out16 June 2013 We’re proud to announce the second service release for the 0.9 series of Roundcube. It contains 25 bug fixes and improvements as well as some translation updates. Continue reading Update 0.9.1 released17 May 2013 We proudly announce the first service release for the 0.9 series of Roundcube. As usual, it contains Continue reading Stable version 0.9.0 released15 April 2013 We proudly announce the next stable release of Roundcube. This version enhances the webmail experience with these new features: Continue reading Security updates 0.8.6 and 0.7.327 March 2013 We just published new releases which fix a recently reported vulnerability that allows an attacker to access files on the server. Please update your installations with the new versions or patch them with the fix which is also published in the downloads section or our sourceforge.net page. Continue reading Release candidate for version 0.902 March 2013 We just published the feature-complete release candidate for the upcoming version 0.9. After adding some neat new features in 0.9-beta we now stabilized the code for the final release. Continue reading Update 0.8.5 released25 January 2013 Today we can announce another release of the Roundcube webmail package. This is a service update to the stable 0.8 version. It contains small bug fixes and improvements as well as fixes for a recently reported XSS vulnerability. See the CHANGELOG file for details. Continue reading Release 0.9-beta ready for download07 January 2013 We’re proud to announce this beta release of the next major version 0.9. With this milestone we introduce some important changes under the hood as well as some nice and long-awaited features: Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
