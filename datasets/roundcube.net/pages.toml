["https://roundcube.net/news/2017/04/25/release-candidate-for-version-1.3"]
title = "Release Candidate for version 1.3"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Release Candidate for version 1.3 Published: 25 April 2017 Tags: releases We just published the feature-complete version for the next major version 1.3 of Roundcube webmail for final testing. After dropping support for older browsers and PHP versions and adding some new features like the widescreen layout, the release candidate finalizes that work and also fixes two security issues plus adds improvements to the Managesieve and Enigma plugins. We also slightly polished the Larry theme to make it look a little less 2010. Still, the default theme doesn’t work on mobile devices but a fully responsive skin is currently being worked on. As a reminder: if you’re installing the dependent package or run Roundcube directly from source, you now need to install the removed 3rd party javascript modules by executing the following install script: $ bin/install-jsdeps.sh With the upcoming stable release of 1.3.0 the old 1.x series will only receive important security fixes. See the complete Changelog and download the new packages from roundcube.net/download. Please note that this is a release candidate and we recommend to test it on a separate environment. And don’t forget to backup your data before installing it. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
