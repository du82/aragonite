full_description = "Security updates 1.4.8, 1.3.15 and 1.2.12 released Published: 10 August 2020 Tags: releases updates security We just published security updates to the stable version 1.4 and the LTS versions 1.3 and 1.2 of Roundcube Webmail. They all contain two recently reported cross-site scripting (XSS) vulnerabilities. The 1.4.8 release also contains a number of general improvements from our issue tracker. Security fixes Fix cross-site scripting (XSS) via HTML messages with malicious svg content (CVE-2020-16145) Fix cross-site scripting (XSS) via HTML messages with malicious math content Credits for these two findings go to Łukasz Pilorz from Pentesters. See the full changelogs in the release notes on the Github download pages for the updated versions 1.4.8, 1.3.15 and 1.2.12. We strongly recommend to update all productive installations of Roundcube with this new versions. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
