full_description = "Update 1.6.1 released Published: 23 January 2023 Tags: releases updates stable This is the first service release to update the new stable version 1.6. It provides a bunch of small fixes and improvements after getting your feedback from the 1.6.0 release. See the full changelog in the release notes on the Github download page. This release is considered stable and we recommend to update all productive installations of Roundcube with this version. Download it from roundcube.net. Please do backup your data before updating! Upgrading the Complete Package Attention when upgrading Roundcube using the complete package! The installto.sh script does not update the vendor folder of the installation target. If you’re not using Composer to install plugins or other dependencies, please remove the composer.json file of your Roundcube installation before running the installto.sh script. If you have Composer installed, run composer update --no-dev to complete the upgrade. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
