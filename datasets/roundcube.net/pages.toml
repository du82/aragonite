["https://roundcube.net/news/2021/11/28/update-1.5.1-released"]
title = "Update 1.5.1 released"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Update 1.5.1 released Published: 28 November 2021 Tags: releases updates stable This is the first service release to update the new stable version 1.5. It provides a bunch of small fixes and improvements after getting your feedback from the 1.5.0 release. See the full changelog in the release notes on the Github download page. Important note for MySQL and MariaDB database backends The change to full UTF-8 support in MySQL/MariaDB didn’t work for everybody migrating an existing DB. Hence here’s an important notice from the UPGRADING instructions: If you use MySQL < 5.7.7 or MariaDB < 10.2.2 make sure to configure it with: innodb_large_prefix=1 innodb_file_per_table=1 innodb_file_format=Barracuda This release is considered stable and we recommend to update all productive installations of Roundcube with this version. Download it from roundcube.net. Please do backup your data before updating! Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
