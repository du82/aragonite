["https://roundcube.net/news/2017/01/05/roundcube-webmail-1.3-beta-out-now"]
title = "Roundcube Webmail 1.3-beta out now"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Roundcube Webmail 1.3-beta out now Published: 05 January 2017 Tags: releases We’re proud to announce the beta release of the next major version 1.3 of Roundcube webmail. With this milestone we introduce some new features: Widescreen layout aka Three Column View Possibility to display QR code for contacts data New identicon plugin Attach contact vCards to composed message Support WEBP images and MathML preview Preview, download and rename attachments when composing a message message/rfc822 attachment preview Various Enigma (PGP) and Managesieve plugin improvements Plus security and deployment improvements: Improve randomness of password salts and random hashes Fixed redundancy in sql caching system and compatibility with Galera Cluster And finally some code-cleanup: Dropped support for legacy browsers (IE < 10; removed legacy_browser plugin) Require PHP >= 5.4 Removed PHP mail() support Removed 3rd party javascript libraries from repo IMPORTANT: The code-cleanup part brings major changes and possibly incompatibilities to your existing Roundcube installations. So please read the changelog carefully and thoroughly test your upgrade scenario. Please note that Roundcube 1.3 no longer runs on PHP 5.3 no longer supports IE < 10 and old versions of Firefox, Chrome and Safari requires an SMTP server connection to send mails That last item means you need to review your SMTP server settings as described in our wiki if you have set the smtp_server option to an empty value and are thus using PHP’s mail() function. In case you’re running Roundcube directly from source, you now need to install the removed 3rd party javascript modules by executing the following install script: $ bin/install-jsdeps.sh See the complete Changelog and download the new packages from roundcube.net/download. Please note that this is a beta release and we recommend to test it on a separate environment. And don’t forget to backup your data before installing it. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
