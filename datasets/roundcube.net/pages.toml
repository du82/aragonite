full_description = "Security updates 1.4.12 and 1.3.17 released Published: 12 November 2021 Tags: releases updates security We just published security updates to the LTS versions 1.4 and 1.3 of Roundcube Webmail. They both contain fixes to two recently discovered SQL injection and XSS vulnerabilities. The 1.4.12 release also contains a few general improvements from our issue tracker. Security fixes Fix XSS issue in handling attachment filename extension in mimetype mismatch warning Fix possible SQL injection via some session variables See the full changelogs in the release notes on the Github download pages for the updated versions 1.4.12 and 1.3.17. We strongly recommend to update all productive installations of Roundcube with these new versions. PLEASE NOTE The above mentioned security fixes are already included in the recently released version 1.5.0 of Roundcube Webmail. See the 1.5.0 release notes (CANGELOG) for reference. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
