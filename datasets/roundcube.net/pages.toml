full_description = "The Roundcube Project News Roundcube 1.4 beta released25 August 2018 We proudly announce the beta release of the next major version 1.4 of Roundcube webmail. With this milestone we introduce some new features: Continue reading Update 1.3.7 released27 July 2018 We proudly announce the next service release to update the stable version 1.3. It contains fixes to several bugs backported from the master branch including a security fix mitigating the EFAIL issue recently discovered in OpenPGP. Continue reading Updates 1.2.9 and 1.1.12 released29 April 2018 As a follow-up to the recent security update for the stable versions 1.2. and 1.1, this new release fixes a regression that sneaked in with the IMAP command injection protection which unintentionally disabled actions that operate on all selected messages (e.g. mark all as junk). Continue reading Security updates 1.2.8 and 1.1.11 released17 April 2018 Following the recent security update for 1.3, here now come the promised updates for the LTS versions 1.2 and 1.1. They both fix the recently reported vulnerability allowing IMAP command injection via a GET parameters. More details about this are published under CVE-2018-9846. Continue reading Security update 1.3.6 released11 April 2018 We just published a security update to the stable version 1.3. It primarily fixes a recently discovered IMAP command injection vulnerability caused by insufficient input validation within the archive plugin. Details about the vulnerability are published under CVE-2018-9846. Continue reading Update 1.3.5 released15 March 2018 We proudly announce a new service release to update the stable version 1.3. It contains fixes to several bugs backported from the master branch. One can be called a minor security fix as it fixes blocking of remote content on specially crafted style tags. Continue reading Update 1.3.4 released14 January 2018 We proudly announce the next service release to update the stable version 1.3. It contains fixes to several bugs reported by our dear community members and makes Roundcube fully compatible with PHP 7.2. Continue reading Security updates 1.3.3, 1.2.7 and 1.1.10 released08 November 2017 We just published updates to all stable versions from 1.1.x onwards delivering fixes for a recently discovered file disclosure vulnerability in Roundcube Webmail. Continue reading Update 1.3.2 released31 October 2017 We proudly announce the second service release to update the stable version 1.3. It contains fixes to several bugs reported by our dear community members as well as translation updates synchronized from Transifex. Continue reading Update 1.2.6 released10 September 2017 This is a service and security update to the stable version 1.2. It contains some important bug fixes and improvements which we picked from the upstream branch. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
