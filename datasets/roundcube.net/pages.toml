full_description = "Be aware of scam emails appearing to be sent from Roundcube Webmail! Read how to protect you and your users. Roundcube webmail... ...is a browser-based multilingual IMAP client with an application-like user interface. It provides full functionality you expect from an email client, including MIME support, address book, folder manipulation, message searching and spell checking. More information Features Drag-&-drop message management Full support for MIME and HTML messages Multiple sender identities Full featured address book with groups and LDAP connectors Find-as-you-type address book integration Threaded message listing IDNA and SMTPUTF8 support Spell checking Responsive skin (multi-device support) Shared/global IMAP folders Support for access control lists (ACL) Built-in caching for fast mailbox access Unlimited users and messages Import/export functions Plug-in API for flexible extensions XSS attack protection Support for PGP encryption Complete list of features Latest News Update 1.6.10 released 08 February 2025 Updates 1.6.9 and 1.5.9 released 01 September 2024 Official enterprise support now available 08 August 2024 Security updates 1.6.8 and 1.5.8 released 04 August 2024 Security updates 1.6.7 and 1.5.7 released 19 May 2024"
