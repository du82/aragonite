["https://roundcube.net/news/page16"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News Patch for incorrect HTML message display15 January 2007 With the latest security update for 0.1-beta2 we unfortunately introduced a bug when parsing HTML messages. Some users reported weird replacements. There’s a patch available to fix this issue and we’ve updated the release file as well. Check the patches section at our SourceForge page or find the updated package at the download page. Continue reading Security Update for 0.1-beta222 December 2006 We have just updated the 0.1-beta2 release of RoundCube. The new version includes several security fixes and we recommend to replace any existing installation with it. Check the download section for roundcubemail-0.1beta2.1.tar.gz Continue reading No more e-mails, please!23 August 2006 Still amazed by the enormous interest in this project, I’m no longer able to process support requests, bug reports and questions about release dates sent to me by e-mail. I’m really sorry about that but it’s simply impossible to answer them all! Please refer to the forum or to the users mailing list for support. We also have a tracking system for bugs and feature requests. The direct e-mail (roundcube at gmail) is reserved for project management and development issues. Continue reading New patch for cPanel installations14 August 2006 There’s a new patch available to install RoundCube 0.1-beta2 on a cPanel host. The installation guide can be found here: www.hostgeekz.com/guides/cPanel/64/Install_RoundCube_on_cPanel.htm Continue reading RoundCube Webmail 0.1-Beta2 released06 August 2006 After a long period of development and some major changes in the project organization, we finally released version 0.1-beta2. New features like message search, spellchecking, saving messages as draft and folder renaming are introduced with this release. Continue reading New development platform30 May 2006 The big change was carried out successfully and we’re back in business :-) The CVS repository and the tracker at SourceForge are finally closed. If you’d like to report a bug, please use our new Tracker at trac.roundcube.net. Also the annoying delays of the public CVS are past times. Anonymous checkouts from the new SVN repository can be done at any time and you’ll surely get the freshest data. Last but not least, we also have a Wiki available for all sorts of information about RoundCube. Check it out! Continue reading Tracker temporarily unavailable18 May 2006 Due to system changes we removed the tracker for Bugs and Feature Requests from the site. The data will be moved to a new system hosted outside of SourceForge. Please revisit our website in a couple of days. Continue reading RoundCube forum is online23 March 2006 According to many requests we finally managed to set up a web-based forum for the RoundCube webmail project. Many thanks to Brett Patterson for managing this. The forum board can be found at roundcubeforum.net Continue reading RoundCube on cPanel and Mac OS X05 March 2006 Two more installation guides for RoundCube have been submitted. The first describes how to integrate RC on a cPanel system with a patch for taking over a current session. The second guide is useful for all who want to install or upgrade RC on Mac OS X. Continue reading Patches for 0.1-beta22 February 2006 The recently published beta-release came up with two ugly bugs. One prevented from saving the language selection in the user preferences and the other completely omitted mail headers when having no smtp server configured. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
