full_description = "Update 1.3.2 released Published: 31 October 2017 Tags: releases updates We proudly announce the second service release to update the stable version 1.3. It contains fixes to several bugs reported by our dear community members as well as translation updates synchronized from Transifex. We also changed the wording for the setting that controls the time after which an opened message is marked as read. This was previously only affecting messages being viewed in the preview panel but now applies to all means of opening a message. That change came with 1.3.0 an apparently confused many users. Some translation work is still needed here. See the full changelog in the release notes on the Github download page. This release is considered stable and we recommend to update all productive installations of Roundcube with this version. Download it from roundcube.net. Please do backup your data before updating! Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
