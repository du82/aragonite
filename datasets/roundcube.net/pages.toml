["https://roundcube.net/news/page8"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News Update 1.2.1 released26 July 2016 We just published the first service release to update the stable version 1.2. It contains some important bug fixes and improvements in the recently introduced Enigma plugin for PGP encryption. See the detailed changelog in here. Continue reading Roundcube Webmail 1.2.0 released22 May 2016 We proudly announce the stable version 1.2.0 of Roundcube Webmail which is now available for download. It introduces new features since version 1.1 covering security and PGP encryption topics: Continue reading Updates 1.1.5 and 1.0.9 published20 April 2016 We just published updates to both stable versions 1.0 and 1.1 delivering important bug fixes and helps protecting Roundcube against more XSS and CSRF attacks. Version 1.1.5 also has two new plugin hooks integrated and version 1.0.9 comes with cherry-picked fixes from the more recent version to ensure proper long term support. Continue reading Trac platform migrated to GitHub20 March 2016 After many ups and downs with our Trac platform which hosted our wiki and the ticket system for years now, we finally migrated the data over to GitHub where we already host the git repositories. As of March 25th the trac.roundcube.net site will be shut down. Starting today, the site is in read-only mode meaning that user logins and ticket reporting have been disabled already. Continue reading Updates 1.1.4 and 1.0.8 released26 December 2015 We just published updates to both stable versions 1.0 and 1.1 delivering important bug fixes one of which seals a potential path traversal vulnerability reported by High-Tech Bridge Security Research Lab. Continue reading Roundcube Webmail 1.2-beta out now23 November 2015 We’re proud to announce that the beta release of the next major version 1.2 of Roundcube webmail is out now for download and testing. With this milestone we introduce new features primarily focusing on security and PGP encryption: Continue reading Updates 1.1.3 and 1.0.7 released14 September 2015 We just published updates to both stable versions 1.0 and 1.1 after fixing many minor bugs and ensuring compatibility with upstream versions of 3rd party libraries used in Roundcube. Version 1.0.7 comes with cherry-picked fixes from the more recent version to ensure proper long term support. Continue reading Updates 1.1.2 and 1.0.6 released05 June 2015 We just published updates to both stable versions 1.0 and 1.1 after fixing many minor bugs and adding some security improvements to the 1.1 release branch. Version 1.0.6 comes with cherry-picked fixes from the more recent version to ensure proper long term support especially in regards of security and compatibility. Continue reading Roundcube Next is coming and we need your help03 May 2015 Roundcube prouldy announces the crowd funding campaign to bring our vision of a better email experience to reality. Continue reading Update 1.1.1 released18 March 2015 This is the first service release to update the stable version 1.1. It contains some important bug fixes and improvements in error handling as well as a few new features and configuration options. See the full changelog here. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
