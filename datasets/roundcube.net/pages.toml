["https://roundcube.net/news/page15"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = 'The Roundcube Project News Version 0.2-alpha released09 June 2008 This pre-release of version 0.2 comes up with a DOM-based HTML sanitization which removes malicious JavaScript code from HTML messages and fixes all known XSS vulnerabilities. And we also fixed more than 100 bugs. Continue reading Update v0.1.1 released05 April 2008 The first service update for RoundCube Webmail 0.1-stable is now available. It contains important bug fixes and updates of some incomplete localization files. We recommend to update all installations of 0.1-stable. Read the UPGRADING instructions to find out how to do this. Continue reading RoundCube Webmail 0.1-stable released04 March 2008 After more than two years of development we finally released the first stable version of RoundCube Webmail. It’s not as feature rich as we’d like it to be but the released version is considered to run stable for a productive environment. Thanks to our users we fixed many bugs and added some nice new features. So go ahead and upgrade your installations now. Continue reading RoundCube Webmail 0.1-RC2 released 20 October 2007 The second release candidate has just been released. This new version comes up with a lot of improvements and fixed bugs. An HTML message composition is also included but disabled by default because it’s still experimental. Continue reading RoundCube is going PHP 514 September 2007 In order to force hosters to upgrade to PHP 5 we also support the the GoPHP5 initiative. This means that new versions released after February 5, 2008 will drop support for PHP 4. See our support statement for more details: trac.roundcube.net/trac.cgi/wiki/GoingPHP5 Continue reading o3 magazine: OOS Enterprise Email Systems10 September 2007 The free OOS magazine "o3" comes up with a complete guide on how to set up an enterprise email server using open source components - including RoundCube. Continue reading RoundCube 0.1-rc1 pure GPL03 July 2007 We have now released the 0.1-rc1 package without any third party libraries. The package only contains the core source files which are all licensed under the Gnu GPL. This release is intended to be included in package repositories and server distributions that can handle dependencies. The complete list of dependencies can be found in the INSTALL file within the package. Continue reading RoundCube Webmail 0.1-RC1 released 18 May 2007 The Release Candidate number one has just been released. It includes a better and less memory consuming message parser and a neat integration of LDAP address directories. Also session authentication has changed to get rid of the annoying session-timeouts. Continue reading Call for translation14 May 2007 The next release (0.1-rc1) is scheduled for 18/05/2007. To complete the new features and improvements, all translators are requested to update the localization files. Please use the online translator at translator.roundcube.net and submit the updated files to the dev-mailing list. Continue reading Install RoundCube with IIS6 and hMailServer22 February 2007 Just found this tutorial on installing RoundCube on a Windows Server 2003 using hMailServer (IMAP/POP3) with IIS 6 via MySQL: www.hmailserver.com/forum/viewtopic.php?t=5591 Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker'
