["https://roundcube.net/news/2016/03/20/trac-platform-migrated-to-github"]
title = "Trac platform migrated to GitHub"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Trac platform migrated to GitHub Published: 20 March 2016 After many ups and downs with our Trac platform which hosted our wiki and the ticket system for years now, we finally migrated the data over to GitHub where we already host the git repositories. As of March 25th the trac.roundcube.net site will be shut down. Starting today, the site is in read-only mode meaning that user logins and ticket reporting have been disabled already. This means that submitting new tickets now goes through GitHub and so does the roadmap planning and overview. The entry point for that is our GitHub project page. Tickets became Issues Today we just migrated 4.8K tickets from the Trac database to GitHub issues, leaving the invalid and duplicate ones behind. Unfortunately the ticket numbers could not be kept and have all been re-assigned. The original trac ticket numbers are mentioned in the migrated issue body and can be used for searching. We’ll also install a redirect service which will translate old Trac urls to the corresponding issue pages. Wiki migration in process The wiki will also be translated into GitHub markdown pages. There’s some manual reviewing involved in order to update or remove outdated information during this process. Please give us some more days to complete that task. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
