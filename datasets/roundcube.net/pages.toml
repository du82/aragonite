["https://roundcube.net/news/page17"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News RoundCube Webmail 0.1 Beta released19 February 2006 After a long period of development, we’re proud to announce the first official Beta release of our webmail client. Many bugfixes and some new features have found their way into this version. For a detailed list of improvements, please refer to the Changelog. Have fun! Continue reading Demo site is back again23 December 2005 After detecting excessive sending of mails on the demo site, we shut it down because it has been used to spread spam mails. Now it’s updated to the latest CVS version and sending mails is deactivated. You can compose and submit messages but they won’t be delivered to the recipients but copied to the Sent folder as usually. Continue reading New mailing lists23 December 2005 Because our development mailing list was filled up with support requests and configuration questions, we decided to add a separate list for RoundCube USERS and keep the dev-list for discussions about ongoing development. If you have questions about the installation, configuration and use of RoundCube Webmail, please subscribe and post to [email protected] Continue reading RoundCube Webmail 0.1-20051021 released21 October 2005 This latest nightly release comes up with improved support for the Courier IMAP server and fixes problems with SSL connections. It also includes minor bug fixes and some visual enhancements. Continue reading RoundCube Webmail 0.1-20051007 released07 October 2005 This new release comes up with support for SQLite and PostgreSQL as well as translations in French, Italian, Spanish, Danish and Dutch. Thanks to all the translators for their work! Continue reading Mailing lists available30 September 2005 For those who worried that the project was given up: relax! I was travelling for one month and that’s why there were no releases and no answers. But now the development team is growing and we set up two mailing lists. Get more details at roundcube.net/?p=mailinglists Continue reading RoundCube Webmail 0.1-20050820 released21 August 2005 The latest nightly build with minor bugfixes and improvements of configuration and performance. Continue reading RoundCube Webmail 0.1-20050811 released11 August 2005 This nightly build comes up with a few new features such as folder management and selection/navigation functions. Continue reading RoundCube Webmail 0.1-alpha released21 July 2005 The initial release is out now. It’s just a development version and probably pretty buggy. Please report bugs to the bugtracking system at sourceforge.net. Continue reading Screenshots added17 June 2005 Just added some screenshots showing the first alpha version in action. The webmail comes up with full featured multipart-message support as well as image blocking and an integrated address book. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
