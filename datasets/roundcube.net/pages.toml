full_description = "Impressions of Roundcube's User Interface Below are some screenshots of Roundcube in use. Additional skins are available on Packagist. You can also create your own skin or extend an existing skin to make Roundcube look just right for you. Elastic Author: Aleksander Machniak Released with Roundcube version 1.4.0, Elastic is Roundcube's first official responsive skin. It has support for desktops, tablets and phones. desktop tablet phone Larry Author: FLINT / Büro für Gestaltung, Switzerland Released with Roundcube version 0.8.0, Larry provides visual impact thanks to its use of color and specially designed graphics.Support deprecated as of Roundcube 1.6.0. Available via Composer. Classic Author: The Roundcube Dev Team Formally known as Default, renamed to Classic as of Roundcube version 0.8.0, this is Roundcube's original skin.Support deprecated as of Roundcube 1.4.0. Available via Composer. Note: The following plugins, distributed with Roundcube, were active when the screenshots where taken: acl, archive, enigma, help, managesieve, markasjunk, password, and vcard_attachments. var viewer = document.getElementById('viewer'); viewer.addEventListener('show.bs.modal', function(e) { var source = e.relatedTarget; var img = source.querySelector('img'); var screen = this.querySelector('.modal-body > img'); screen.src = img.getAttribute('src').replace('/thumbs/', '/screens/'); screen.alt = img.getAttribute('alt'); this.querySelector('.modal-footer > p').textContent = img.getAttribute('alt'); this.setAttribute('data-rc-cur-index', source.id.replace(/^screenshots-[a-z]+-[a-z]+-/, '')); this.setAttribute('data-rc-cur-source', source.id.replace(/-[0-9]+$/, '')); // update button status var prev_button = this.querySelector('.modal-footer > .nav > .nav-link.previous').classList; var next_button = this.querySelector('.modal-footer > .nav > .nav-link.next').classList; prev_button.remove('disabled'); next_button.remove('disabled'); prev_button.add(get_next_screen_id(true) == 0 ? 'disabled' : null); next_button.add(get_next_screen_id() == 0 ? 'disabled' : null); }); viewer.addEventListener('hidden.bs.modal', function() { var screen = this.querySelector('.modal-body > img'); screen.src = 'data:,'; screen.alt = ''; screen.style.removeProperty('height'); if (viewer.getAttribute('data-rc-no-resize') != 'true') { this.querySelector('.modal-dialog').style.removeProperty('width'); } this.querySelector('.modal-footer > p').textContent = ''; this.setAttribute('data-rc-cur-index', ''); this.setAttribute('data-rc-cur-source', ''); this.querySelector('.modal-body').classList.add('loading'); }); // keyboard navigation document.addEventListener('keyup', function(e) { // Is the modal viewer open? if (viewer.classList.contains('show')) { if (e.which === 37) { // left move_screen(true); } else if (e.which === 39) { // right move_screen(); } } }); // swipe navigation var touchstartX = 0; var touchstartY = 0; viewer.querySelector('.modal-body').addEventListener('touchstart', function(event) { touchstartX = event.changedTouches[0].screenX; touchstartY = event.changedTouches[0].screenY; }); viewer.querySelector('.modal-body').addEventListener('touchend', function(event) { var touchendX = event.changedTouches[0].screenX; var touchendY = event.changedTouches[0].screenY; if ((touchendY - touchstartY) > 100 || (touchendY - touchstartY) < -100) { return; } else if (viewer.classList.contains('show')) { if (touchendX - touchstartX > 200) { // left move_screen(true); } else if (touchendX - touchstartX < -200) { // right move_screen(); } } }); function screen_loaded(img) { viewer.querySelector('.modal-dialog').style.removeProperty('width'); var max_width = viewer.querySelector('.modal-body').offsetWidth, max_height = window.innerHeight * 0.75, img_height; img_height = Math.min((img.height / img.width) * max_width, img.height); if (img_height > max_height) { img_height = max_height; } img_width = (img.width / img.height) * img_height; img.style.height = img_height + 'px'; viewer.querySelector('.modal-dialog').style.width = img_width + 'px'; viewer.querySelector('.modal-body').classList.remove('loading'); } function move_screen(reverse) { var source = viewer.getAttribute('data-rc-cur-source'); var target = get_next_screen_id(reverse); if (target > 0) { viewer.setAttribute('data-rc-no-resize', true); bootstrap.Modal.getInstance(viewer).hide(); document.getElementById(source + '-' + target).click(); viewer.setAttribute('data-rc-no-resize', false); } } function get_next_screen_id(reverse) { var source = viewer.getAttribute('data-rc-cur-source'); var current = parseInt(viewer.getAttribute('data-rc-cur-index')); var total = document.getElementById(source).getElementsByTagName('li').length; var target = 0; if (reverse) { target = (current === 1) ? 0 : (current - 1); // change 0 to total for loop } else { target = (current === total) ? 0 : (current + 1); // change 0 to 1 for loop } return target; }"
