full_description = "Roundcube 1.5 RC released Published: 03 July 2021 Tags: releases beta We proudly announce the release candidate for the next major version 1.5 of Roundcube webmail. Based on the feedback we received from the beta release and some new features from the backlog, we have now finalized the development branch to prepare the final version. See the changelog below for details. Some noteworthy additions since 1.5-beta are Support of XOAUTH2 in Managesieve plugin Support of IMAP LITERAL- extension [RFC 7888] Support of RFC 2231 encoded names Plugin hooks for OAuth events See the full changelog in the release notes on the Github download page. We believe it is production ready, but we recommend to test it on a separate environment. And don’t forget to backup your data before installing it. Download it from roundcube.net. We also have some Docker images available for quick testing and evaluation. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
