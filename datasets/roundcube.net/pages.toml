["https://roundcube.net/news/2019/11/09/roundcube-1.4.0-released"]
title = "Roundcube 1.4.0 released"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Roundcube 1.4.0 released Published: 09 November 2019 Tags: releases stable We proudly announce the final release of the long awaited major version 1.4 of Roundcube webmail. After more than two years of hard work by Alec and other volunteer contributors, Roundcube finally gets the responsive skin with full mobile device support - the Elastic. In addition to the new UI we introduce these new features: Email Resent (Bounce) feature Improved Mailvelope integration Support for Redis and Memcached cache Support for SMTPUTF8 and GSSAPI Plus numerous improvements and bug fixes collected from your precious feedback as well as updates to recent versions of 3rd party libraries like jQuery and TinyMCE. See the full changelog in the release notes on the Github download page. The new Elastic theme, which is the new default skin, is built with LESS and of course the sources are included. They allow a certain degree of customization by adjusting some colors and variables using the _styles.less and _variables.less files. Please consider customizing your Roundcube installation in order to make phishing harder. You’ll find guidance in the README.md file inside the skin folder. This release is considered stable and we encourage you to update your productive installations after carefully testing the upgrade scenario and preparing your users to the significant changes in their webmail UI. Download it from roundcube.net. With the release of Roundcube 1.4.0, the previous stable release branches 1.3.x and 1.2.x will change into LTS low maintenance mode which means they will only receive important security updates but no longer any regular improvement updates. The 1.1.x series is no longer supported and maintained. Update See the list of breaking changes in the 1.4.1 release notes. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
