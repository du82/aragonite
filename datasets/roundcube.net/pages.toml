["https://roundcube.net/news/2021/09/14/spell-roundcube-net-service-down"]
title = "spell.roundcube.net service down"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "spell.roundcube.net service down Published: 14 September 2021 Tags: announcement UPDATE - 28 September 2021 We’re happy to announce that we found a new sponsor and that the spell checking service is back online. For years the Roundcube project has run a public spell checking service spell.roundcube.net as a privacy-safe alternative to the former Spell Check service by Google. This has been the default backend for Roundcube’s spell checking function and has now gone offline forever. We ran this service on a dedicated server sponsored by xs4all.nl using a PHP port of google-spell. Now this sponsoring has come to an end and unfortunately there’s no replacement in sight. New releases of Roundcube will therefore have the spell checking function disabled by default. The best replacement is of course to use PHP’s pspell or enchant API with a locally installed aspell library and to configure Roundcube accordingly. We’ll add this feature to future releases of our Docker images but for now, you need to re-configure your Roundcube installations. Apologies for the inconvenience and for the bad news! Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
