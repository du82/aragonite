full_description = "RoundCube Webmail 0.1-stable released Published: 04 March 2008 After more than two years of development we finally released the first stable version of RoundCube Webmail. It’s not as feature rich as we’d like it to be but the released version is considered to run stable for a productive environment. Thanks to our users we fixed many bugs and added some nice new features. So go ahead and upgrade your installations now. The TinyMCE-based HTML message composition is now included but should still be considered as experimental. Please also note that this is the last release that runs on PHP 4. As suggested by the GoPHP5 project RoundCube will be PHP 5 only in future versions. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
