full_description = "The Roundcube Project News Update 1.3.1 released04 September 2017 We just published the first service release to update the stable version 1.3 which is the result of some touching-up on the new features introduced with the 1.3.0 release. For example it brings back the double-click behavior to open messages which was reduced to the list-only view. Or because the switch to change the mail view layout was a bit hidden, we also added it to the preferences section. Continue reading Roundcube Webmail 1.3.0 released26 June 2017 We proudly announce the stable version 1.3.0 of Roundcube Webmail which is now available for download. With this milestone we introduce new features since the 1.2 version: Continue reading Security updates 1.2.5, 1.1.9 and 1.0.11 released28 April 2017 We just published updates to all stable versions 1.x delivering important bug fixes and improvements which we picked from the upstream branch. Continue reading Release Candidate for version 1.325 April 2017 We just published the feature-complete version for the next major version 1.3 of Roundcube webmail for final testing. After dropping support for older browsers and PHP versions and adding some new features like the widescreen layout, the release candidate finalizes that work and also fixes two security issues plus adds improvements to the Managesieve and Enigma plugins. Continue reading Update 1.0.10 released06 April 2017 We just published a security update to the LTS version 1.0. It contains some important bug fixes and security improvements backported from the master version. Continue reading Updates 1.2.4 and 1.1.8 released10 March 2017 We just published another update to the both stable versions 1.2 and 1.1 delivering important bug fixes and improvements which we picked from the upstream branch. Continue reading Roundcube Webmail 1.3-beta out now05 January 2017 We’re proud to announce the beta release of the next major version 1.3 of Roundcube webmail. With this milestone we introduce some new features: Continue reading Updates 1.2.3 and 1.1.7 released28 November 2016 We just published another update to the both stable versions 1.2 and 1.1 delivering important bug fixes and improvements which we picked from the upstream branch. Continue reading Updates 1.2.2 and 1.1.6 published28 September 2016 We just published updates to both stable versions 1.2 and 1.1 delivering important bug fixes and and again more improvements of the Enigma plugin introduced in version 1.2. Version 1.1.6 comes with cherry-picked fixes from the more recent version and improvements in contacts searching as well as a few localization fixes. Continue reading Plugin repository pimped up05 August 2016 The Roundcube Plugin Repository which currently hosts over 100 plugins for Roundcube Webmail as recently been freshen up with new versions of Composer, Packagist and Solr and is now running with PHP7 on a brand new server kindly sponsored by XS4All. The new site also has Grade A SSL support to guarantee authenticity. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
