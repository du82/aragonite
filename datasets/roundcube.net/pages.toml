["https://roundcube.net/news/2021/09/28/spell-checking-service-back-online"]
title = "Spell checking service is back online"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Spell checking service is back online Published: 28 September 2021 Tags: announcement After the recent announcement we received a number of offers from internet service providers around the globe who offered their support to continue the free spell checking service for Roundcube. Now we’re happy to announce that we could establish a new sponsoring with HostingU2 from the Netherlands and that spell.roundcube.net is back online. Although we can again support existing Roundcube installations with their default settings for spell checking, we still encourage you to re-configure Roundcube to use PHP’s pspell or enchant API with a locally installed aspell library. We have also created a Docker image allowing you to run your own instance of the former Google Spell Check service as we do. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
