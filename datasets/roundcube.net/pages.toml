full_description = "Multi-arch Docker Images for Roundcube Published: 13 April 2023 Tags: releases docker With the latest release of Roundcube webmail we proudly announce that the Docker images published under roundcube/roundcubemail are now multi-platform and can be run on the following architectures: linux/386 linux/amd64 linux/arm/v6 linux/arm/v7 linux/arm64 linux/ppc64le linux/s390x The multi-arch builds have been a feature request for a long time and finally became possible with the power of Github actions and the much appreciated contribution by William Desportes and Montgomery Auber Starting with version 1.6.0 all Docker images will now be released multi-arch enabling Roundcube to run on Raspberry Pi, M1 Macs, AWS EC2 Graviton and many other environments without custom builds. The list of architectures we support is limited to the archs available for php and composer. Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
