title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News Bugfix update 0.5.3 released02 June 2011 This bugfix release fixes two important bugs in the IMAP communication which prevented sent messages from being saved in version 0.5.2. Continue reading Update 0.5.2 is here20 April 2011 This service update brings some more bug fixes and stability improvements and it includes an updated version of the TinyMCE editor which is now supposed to work correctly in IE9. Continue reading Bugfix update 0.5.1 is out09 February 2011 This update release fixes some bugs discovered with the 0.5 stable version and also improves security by preventing some possible CSRF attacks. IDNA support has now been improved and some visual glitches in IE and Safari have been resolved. Continue reading Version 0.5 (stable) released12 January 2011 The next major release has now reached stable state and is available for download. The important new features in 0.5 are: full support for shared folders and namespaces, Internationalized Domain Names (IDNA) as well as SMTP Delivery Status Notifications. The UI for managing IMAP folders has changed a bit and provides new space for further extensions and plugins. Continue reading Release candidate for 0.517 December 2010 Our Christmas gift for 2010 is now available for download. We just published the release candidate package for the upcoming version 0.5 of Roundcube. It’s now feature-complete with a new UI for the IMAP folder management and improved handling for mailing list headers. Continue reading New version 0.5-beta released27 November 2010 We’re happy to announce that a new major release of Roundcube is now available for testing. As usual it contains many bugfixes (thanks to all the reporters and contributers) and brings more stability and speedup as well as some new features such as Internationalized Domain Name (IDNA) support, support for shared/global IMAP folders and support for SMTP Delivery Status Notifications. Plus some minor changes to the message list UI and many improvements under the hood. Continue reading Bugfix release 0.4.2 out now06 October 2010 As you might have heard, also the developers of Roundcube are just human beings and thus not always creating perfect and 100% bug free work. The last 0.4.1 release fixed many bugs but also introduced a quite annoying new one. That’s why the next release follows just one week later. It fixes a few important bugs, especially the “Server Error” message when expanding/collapsing folders and it also updates some previously incomplete localization files. Continue reading Update to 0.4.1 released29 September 2010 This update release fixes the most important bugs of the 0.4 stable release such as the disappearing upload box or buggy SQL scripts. Further more support for format=flowed has been improved and some localization files have been completed. Continue reading Version 0.4 (stable) released07 August 2010 After the big new features in 0.4-beta this release now completes the unfinished work and fixes bugs related to the new threaded message listing and address groups features. We also cleaned up the user interface and tried to make all UI elements more consistent. Continue reading New version 0.4-beta released23 April 2010 A new major release is now available for deep testing. With this version we fixed over 50 bugs and added new features like threaded message listing and contact groups support as well as many little improvements that make e-mail reading with Roundcube an even better experience. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
