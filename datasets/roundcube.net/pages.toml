["https://roundcube.net/support"]
title = "Roundcube Webmail Support"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Need help? IMPORTANT! If you have problems with your email account (e.g. cannot log in, emails got lost, etc.) or if you have questions how to configure your Outlook or mobile phone to get email, this isn't the right place to ask. Roundcube is not a service but free software which somebody installed for you. Please contact your internet hosting provider or IT responsible instead. If you don't know who this might be, please review your bills and find out who you're paying for email and webhosting services. For issues concerning the software itself, there are several ways to get help on questions about Roundcube, its installation, configuration and ongoing development. Please choose from the following: Documentation Wiki To get additional information on how to set up Roundcube and to find out what all those config parameters are good for, our Wiki will help. Official enterprise support Official support for Roundcube is available from the steward of the Roundcube project, Nextcloud GmbH. The support is tailored specifically for mail providers running large instances with thousands to millions of end users. Optional email server solutions as well as PGP encrypted email are available with this offering. Learn more. Community forum Get help at our web-based message board. Different topics like Issues and Bugs, Feature Requests as well as general discussions about the project can be found here: roundcubeforum.net Please also check our bug tracker for already reported and discussed bugs and feature requests. Mailing lists If you have general questions, comments, or suggestions please send them to our mailing lists. The following mailing lists are available for this project: users All topics related to the installation, use and administration of Roundcube Webmail. announce Read-only list with announcements like new versions, security bugs and more. Moderated by the project administrator. dev Discussion of the ongoing development and next steps. Please don't post bug reports here but file an issue at our bug tracker instead. In order to post to the lists you need to subscribe first. Archives All messages can be found in the archive at lists.roundcube.net. IRC chat Join #roundcube on libera.chat to ask a question or to just hang out with other Roundcube users. Links to Roundcube Support Sites Bug tracker Wiki pages Online forum Mailing lists Other support options Find freelance developers Upwork is the world's largest online workplace, enabling businesses and freelancers to work together on-demand via the Internet.Visit Upwork today to find development talent for your Roundcube projects! Apheleia consulting Apheleia IT employs several Roundcube developers for their E-Mail and Groupware solutions that integrates Roundcube into their web client (Kolab Now as a hosted solution, and Kolab in general). In some special cases they offer professional support and services for Roundcube, too. You can contact them with your request by sending an e-mail to [email protected]."
