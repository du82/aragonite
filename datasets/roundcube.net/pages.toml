full_description = "The Roundcube Project News Update 1.6.10 released08 February 2025 This is the next service release to update the new stable version 1.6. It provides a bunch of fixes after getting your feedback from the previous releases. See the full changelog in the release notes on the Github download page. Continue reading Updates 1.6.9 and 1.5.9 released01 September 2024 These are immediate service releases to fix regressions introduced in the most recent security updates. Both releases contain two following fixes: Continue reading Official enterprise support now available08 August 2024 Today, we are excited to introduce the first official offering of enterprise support for Roundcube! It is tailored specifically for mail providers running large instances with thousands to millions of end users. We also offer our services to help businesses, universities and the public sector, but our offering makes the most sense for larger installations. Continue reading Security updates 1.6.8 and 1.5.8 released04 August 2024 We just published security updates to the 1.6 and 1.5 LTS versions of Roundcube Webmail. They both contain fixes for recently reported security vulnerabilities. Continue reading Security updates 1.6.7 and 1.5.7 released19 May 2024 We just published security updates to the 1.6 and 1.5 LTS versions of Roundcube Webmail. They both contain fixes for recently reported security vulnerabilities. Continue reading Update 1.6.6 released20 January 2024 This is the next service release to update the new stable version 1.6. It provides a bunch of small fixes after getting your feedback from the previous releases. See the full changelog in the release notes on the Github download page. Continue reading Nextcloud – the new home for Roundcube30 November 2023 We’re happy to announce that the Roundcube project has found a new home with Nextcloud. Continue reading Security updates 1.6.5 and 1.5.6 released05 November 2023 We just published security updates to the 1.6 and 1.5 LTS versions of Roundcube Webmail. They all contain a fix for recently reported security vulnerability. Continue reading Security updates 1.5.5 and 1.4.15 released16 October 2023 We just published security updates to the LTS versions 1.4 and 1.5 of Roundcube Webmail. They all contain a fix for recently reported security vulnerability. Continue reading Security update 1.6.4 released16 October 2023 We just published a security update to the version 1.6 of Roundcube Webmail. It provides a fix to a recently reported XSS vulnerability: Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
