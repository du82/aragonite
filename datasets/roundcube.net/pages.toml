["https://roundcube.net/news/page12"]
title = "Roundcube Webmail News"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "The Roundcube Project News The new skin is now ready for testing02 March 2012 The just released version 0.8-beta introduces the all new user interface design of Roundcube. The new skin codename “Larry” isn’t enabled by default but you can easily enable and test the new look by setting $rcmail_config['skin'] = 'larry'; in your local config/main.inc.php file. Continue reading Roundcube License Change to GPLv322 February 2012 Starting with the upcoming version 0.8, Roundcube will be licensed under the GNU General Public License (GPL) Version 3 or later (with exceptions for skins & plugins) while it was licensed under GPL (v2) before that change. Continue reading Update 0.7.1 is out09 January 2012 We’re happy to announce another release of the Roundcube webmail suite. This service update brings some bug fixes and translation updates to the 0.7 stable release. See the CHANGELOG file for details. Continue reading Version 0.7 (stable) released14 December 2011 After another round of bugfixing we’re happy to announce the stable release of Roundcube webmail version 0.7. Beside fixing bugs we added some security improvements which will protect the Roundcube users from XSS and clickjacking attacks. Continue reading Version 0.7-beta ready for download23 November 2011 The development team is proud to announce the next beta release with new features, fixes and improvements under the hood. We re-implemented the entire message caching to make mail reading even faster than before. The message list now supports priority headers and the integrated spell checker has gained some options and personal dictionaries. Last but not least one can now save searches in the address book. And of course lots of bug fixes and small improvements are included to increase the fun working with Roundcube. Continue reading Version 0.6 (stable) released28 September 2011 The next major release has finally reached stable state and is now available for download. The most important improvement since the 0.5 line is certainly the full-featured address book which now provides a smart interface to manage rich contact information including photos. A brief description of all new features was posted on the announcements mailing list. Continue reading Release candidate 0.605 September 2011 The stable release 0.6 is getting close! We just published the release candidate version 0.6 which fixes some bugs and unfinished work from the last beta release and which is now feature complete. Everybody is kindly invited to do some more tests with this release and report bugs to our tracker. Continue reading Version 0.6-beta released20 August 2011 We’re proud to announce the next major release of the Roundcube webmail package: 0.6 is out now as beta. And it’s packed with new features, some of them have been awaited for long time. Continue reading Security update 0.5.4 is out12 August 2011 We just published a new release which fixes a recently reported XSS vulnerability as an update to the stable 0.5 branch. Please update your installations with this new version or patch them with the fix which is also published in the downloads section or our sourceforge.net page. Continue reading Security update 0.5.4 is out12 August 2011 We just published a new release which fixes a recently reported XSS vulnerability as an update to the stable 0.5 branch. Please update your installations with this new version or patch them with the fix which is also published in the downloads section or our sourceforge.net page. Continue reading Newer posts Older posts Subscribe to the news RSS Feed Latest blog posts A few small improvements I’ll describe a few new features that will be included in the next main Roundcube version... 07 November 2021 Canned responses in HTML format A new feature just landed in Roundcube 1.6-git. It is a support for HTML formatting... 29 August 2021 Collected Recipients and Trusted Senders Roundcube has some features that make use of contacts users collected in their addressbook(s)... 26 September 2020 Elastic: Dark mode Nowadays, when every major web browser supports dark mode and most people use mobile devices... 07 July 2020 How we update Docker images when base images change Using Google Cloud Functions to check for Docker image updates and trigger new builds 04 January 2020 Tags releases stable updates security announcement beta docker"
