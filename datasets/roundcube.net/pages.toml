["https://roundcube.net/news/announcement"]
title = "Roundcube Project News - Latest Announcements"
description = "Free and open source webmail software for the masses, written in PHP"
full_description = "Roundcube Project News - Latest Announcements Official enterprise support now available08 August 2024 Today, we are excited to introduce the first official offering of enterprise support for Roundcube! It is tailored specifically for mail providers running large instances with thousands to millions of end users. We also offer our services to help businesses, universities and the public sector, but our offering makes the most sense for larger installations. Continue reading Nextcloud – the new home for Roundcube30 November 2023 We’re happy to announce that the Roundcube project has found a new home with Nextcloud. Continue reading Spell checking service is back online28 September 2021 After the recent announcement we received a number of offers from internet service providers around the globe who offered their support to continue the free spell checking service for Roundcube. Continue reading spell.roundcube.net service down14 September 2021 UPDATE - 28 September 2021 We’re happy to announce that we found a new sponsor and that the spell checking service is back online. Continue reading Installer Update for Composer 2.004 November 2020 Roundcube’s plugin installer is built with Composer and implemented as a custom component to handle packages of type roundcube-plugin. Now Composer has released a new major version 2.0 which brings a few breaking changes. Continue reading Changes in Roundcube's Plugin Repository11 April 2020 Roundcube’s plugin repository is built around Composer which is used to install plugins and their dependencies. For many years we’ve been running our own plugin repository from a fork of the most popular packagist.org service. Over time source code repositories like Github, Gitlab or Bitbucket as well as the Packagist codebase changed significantly which made it hard for us to maintain our fork. We therefore decided to give it up in favor of the well maintained packagist.org service. Continue reading Roundcube Next is coming and we need your help03 May 2015 Roundcube prouldy announces the crowd funding campaign to bring our vision of a better email experience to reality. Continue reading Return to News overview"
