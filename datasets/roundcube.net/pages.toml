full_description = "Updates 1.1.4 and 1.0.8 released Published: 26 December 2015 Tags: releases updates security We just published updates to both stable versions 1.0 and 1.1 delivering important bug fixes one of which seals a potential path traversal vulnerability reported by High-Tech Bridge Security Research Lab. A second security improvement adds some measures against brute-force attacks. See the full changelog here. Both versions are considered stable and we recommend to update all productive installations of Roundcube with either of these versions. Download them from roundcube.net/download. If you prefer to patch your installation for the path traversal vulnerability only, you can find patches on our download mirrors for versions 1.0, and 1.1. As usual, don’t forget to backup your data before updating! Return to News overview Related Posts Update 1.6.10 released Updates 1.6.9 and 1.5.9 released Official enterprise support now available Security updates 1.6.8 and 1.5.8 released Security updates 1.6.7 and 1.5.7 released"
