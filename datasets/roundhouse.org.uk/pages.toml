["https://www.roundhouse.org.uk/awards-gala-dinners"]
title = "Awards & Gala Dinners - Roundhouse"
description = "Hire Roundhouse for your Awards ceremony or Gala dinner. Find out more here! Venue hire London."
full_description = "Awards & Gala Dinners Whether a guest, nominee or attendee, everyone leaves feeling like a rockstar Our unique venue offers impressive architecture and an iconic legacy that will make your award ceremony feel like a part of rock history. Our versatile space can accommodate 850 guests seated for a fine dining experience, or if you’re looking for a bespoke food festival with street food vendors, you can work with our range of superb caterers to create something really special. We can also offer multiple spaces for VIPs to relax, rooms for recording extra content with your award-winners and, of course, space for the after party. Our Circle Balcony offers a fantastic vantage point overlooking the breathtaking space below, perfect for standing drinks receptions or post dinner drinks. You can use our gig seating as part of your package if you’d like your guests to be seated on high or remove them completely for them to enjoy the show, standing, with a drink in hand. Our state of the art sound package, also included in your hire, ensures that no one will miss a thing, so your winners can stand on our legendary stage to be heard by everybody. Previous slide Next slide Get in touch View our Awards & Galas Brochure"
