["https://www.roundhouse.org.uk/christmas-and-summer-parties"]
title = "Christmas & Summer Parties - Roundhouse"
description = "Christmas parties London - hire Roundhouse for your party and treat your staff like rock stars! Find out more this way."
full_description = "Christmas & Summer Parties It’s time to say goodbye to the overdone office party, and say hello to our legendary building Have your staff party like rockstars. Since playing host to some of the most incredible artists of the last 100 years, from Prince to Blondie, what better stage for your party than one where legends have performed? Our incredible Main Space has so much character, with the benefit of being a truly flexible space which means your company can really make your mark and create your own unique atmosphere. Guests can gather on our spacious balcony for a drinks reception overlooking the Main Space before descending for dinner, or you can conceal the party below for a big reveal. Whatever you choose to do in our beautiful space, it’s large enough for 850 people seated for dinner or 1,800 people standing, so it is sure to make a big impact. Whether you’re looking to transform the venue into a winter wonderland, highlight our ‘big top’ roof with a circus theme, or just want to roll with our rock star reputation, the Roundhouse has everything you need for the ultimate celebration. Previous slide Next slide Get in touch"
