full_description = "Roundhouse Three Sixty 1-30 April 2025. Roundhouse Three Sixty is about pushing boundaries and creating unforgettable moments across the entire Roundhouse site. For one epic month, we serve up a mix of music, spoken word, theatre, visual arts, podcasts, and club nights—with each event amplifying the voices of today’s most vital and unapologetic artists. Roundhouse Three Sixty Featured Gigs Coming up Almost Gone English Teacher 26 Nov 2025 The Stranglers + Buzzcocks 31 Oct–01 Nov 2025 Roundhouse Three Sixty Munya Chawawa & Friends 18 Apr 2025 Roundhouse Three Sixty Corinne Bailey Rae presents Black Rainbows with Guildhall Session Orchestra 27 Apr 2025 Steel Pulse + The Selecter 11 Mar 2025 London Soundtrack Festival Great Movie Songs Featuring Neil Tennant, Jake Shears, Omar, Monica Mancini 25 Mar 2025 All gigs & Events Creative Opportunities For 11 - 30s Musicians, artists, poets, filmmakers, performers. The list goes on! Discover your craft, or shape your skills with our workshops, events and courses. Or become a member of our studios for £25 a year. Explore Coming Up see all Saturday Sounds Drop In 08 Mar–22 Mar 2025 Ages 11-14 Theatre Drop In 05 Mar–26 Mar 2025 Ages 18-25 Saturday Sounds Drop In 08 Mar–22 Mar 2025 Ages 11-14 Self Made Online: How to manage your money as a creative 24 Mar 2025 Ages 18-30 Introduction to Storytelling in Film 12 Mar 2025 Ages 18-25 Previous slide Next slide Roundhouse works Roundhouse Works An affordable co-working space Are you a creative entrepreneur or freelancer aged 18-30? Do you often work from home or in coffee shops? The Roundhouse is opening its doors for you to become a member of our shared workspace. Learn more What's included Desk in an open plan workspace Fast and reliable WiFi Social events to build your network Free coffee, tea and refreshments Dedicated on-site support team"
