description = "The Royal Society is a Fellowship of many of the world's most eminent scientists and is the oldest scientific academy in continuous existence. Discover more about our work, our mission or information such as the history of the Royal Society and international work."
full_description = '''About the Royal Society The Royal Society is a Fellowship of many of the world's most eminent scientists and is the oldest scientific academy in continuous existence. Who we are Find out more What we do Find out more How we are governed Find out more Work for us Find out more Email updates We promote excellence in science so that, together, we can benefit humanity and tackle the biggest challenges of our time. Email updates Subscribe to our newsletters to be updated with the latest news on innovation, events, articles and reports. First name * Last name * Email * Next Name What subscription are you interested in receiving? (Choose at least one subject) What subscription are you interested in receiving? Public Newsletter - Summer Science, events, videos and news Scientists newsletter - Grants, scientific meetings, and journals Librarians newsletter - News and features for librarians I am happy to receive the selected communications by email from the Royal Society, as set out in our privacy policy. I understand I can unsubscribe at any time. Review privacy policy * Submit Back function sendData() { const url = '/api/sitecore/EmailSubscription/EmailSubscription'; let formData = { firstName: document.querySelector('input[name="firstName"]').value, lastName: document.querySelector('input[name="lastName"]').value, email: document.querySelector('input[name="email"]').value, PublicNewsletter: document.querySelector('input[name="PublicNewsletter"]').checked, ScientistsNewsletter: document.querySelector('input[name="ScientistsNewsletter"]').checked, LibrariansNewsletter: document.querySelector('input[name="LibrariansNewsletter"]').checked, } let xhr = new XMLHttpRequest() xhr.open('POST', url) xhr.setRequestHeader('Content-type', 'application/json; charset=UTF-8') xhr.send(JSON.stringify(formData)); xhr.onload = function () { const emailResponse = document.querySelector(".email-subscription.email-subscription__overlay"); emailResponse.innerHTML = xhr.responseText; } } let formButton = document.querySelector(".button.button--black.js-emailSubscriptionSubmitButton"); formButton.addEventListener('click', function () { formButton.innerHTML = "Submitting..." formButton.disabled = true; sendData(); });'''
