ersonal data you provide will be subject to our Privacy Policy. We will not be responsible, or liable to any third party, for the content or accuracy of any materials posted by you or any other user of our site. We have the right to remove any material or posting you make on our site if, in our opinion, such material does not comply with the standards set out in our acceptable use policy. Viruses, hacking and other offences You must not misuse our site by knowingly introducing viruses, trojans, worms, logic bombs or other material which is malicious or technologically harmful. You must not attempt to gain unauthorised access to our site, the server on which our site is stored or any server, computer or database connected to our site. You must not attack nor participate in an attack on our site. By breaching this provision, you may commit a criminal offence and we may report any such breach to the police or law enforcement authorities and co-operate with those authorities by disclosing your identity to them. You should take reasonable safety precautions to protect your own computer or device you use to access our sites against viruses and other external threats and we will not be liable for any loss or damage caused to your computer or device or for a loss of data due to reasons beyond our reasonable control. Linking to our site You may link to our site, provided you do so in a way that is fair and legal and does not damage our reputation or take advantage of it, but you must not establish a link in such a way as to suggest any form of association with us or that any approval or endorsement has been given by us where none exists. Our site must not be framed on any other site without our prior written permission. We reserve the right to withdraw the above linking or framing permission at any time. The website from which you are linking must comply in all respects with the content standards set out in our acceptable use policy. If you wish to make any use of the Royal Society name (or that of any affiliate) or any Content on our site other than that set out above, please contact us for our prior permission. Links from our site Where our sites contain links to other sites and resources provided by third parties, these links are provided for your information only. We have no control over the contents of those sites or resources, and accept no responsibility for them or for any loss or damage that may arise from your use of them. Jurisdiction and applicable law The English courts will have jurisdiction over any claim arising from, or related to, your use of our sites or arising in connection with application of these terms of use although we retain the right to bring proceedings against you for breach of these terms in your country of residence or any other relevant country. We also submit to the jurisdiction of the courts in your country of residence to the extent that applicable law in such country mandates that relevant proceedings must be brought in those courts. To the maximum extent legally permitted, these terms of use and any dispute or claim arising out of or in connection with them or their subject matter or formation (including non-contractual disputes or claims) shall be governed by and construed in accordance with the law of England and Wales. Trademarks THE ROYAL SOCIETY is a trade mark of The Royal Society and cannot be used for any commercial purpose without our prior written permission. Variations We may revise these terms of use at any time by amending this page. You are expected to check this page from time to time to take notice of any changes we made, as they are binding on you. Some of the provisions contained in these terms of use may also be modified or superseded by provisions of other specific terms and conditions or notices published elsewhere on our site. Your concerns If you have any concerns about material which appears on our site, please contact us – see royalsociety.org/contact-us. Thank you for visi