["https://royalsociety.org/about-us/how-we-are-governed/trustees-report-and-financial-statements"]
title = "Trustees' Report and financial statements 2023 | Royal Society"
description = "To comply with charity legislation, the Society produces an annual Trustees' Report every year which you can access here."
full_description = "The Royal Society is a self-governing Fellowship of distinguished scientists and its fundamental purpose is to recognise, promote and support excellence in science, and to encourage the development and use of science for the benefit of humanity. As a registered charity, fellowship and National Academy, the Royal Society undertakes a range of activities that provide public benefit either directly or indirectly. These include providing financial support and funding programmes for scientists at various stages of their careers, organising scientific conferences to foster discussion, publishing scientific journals, electing outstanding scientists from around the world as Fellows and Foreign Members, and representing the UK to advocate for science and its benefits, including informing public policy.The Society is a registered charity and the Council is the Trustee body under charity law. The Council members are responsible for preparing the Trustees’ annual report and financial statements in accordance with applicable law and regulations. The report includes an update on the Society’s activities against its objectives and aims for the future, information about where the Society’s income comes from and how it is spent, and a summary of the principal risks and uncertainties. Past annual Trustees' Reports"
