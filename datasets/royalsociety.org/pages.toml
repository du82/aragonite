full_description = "/ About the Royal Society / How we are governed Funding and finances To ensure our independence, the Royal Society is funded from a variety of sources. Support from foundations, corporations and donors Gifts from foundations, corporations and individual donors, as well as legacies in the form of bequests and contributions received in the memory of others, help us maintain our independence, influence and lead scientific discovery and create a future for scientific excellence. To find out more, please contact the Development team at development@royalsociety.org or on +44 207 451 2211. Grants from government We receive a grant from the Department of Science, Innovation and Technology (DSIT) to support our work on scientific excellence and innovation, science and mathematics education, international activities and science communication activities. Financial statements The Trustees’ Report and Financial statements are available here. Making a complaint Legacies Support from foundations, corporations and donors"
