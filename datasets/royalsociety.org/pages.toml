full_description = "/ About the Royal Society / Terms, conditions and policies Cookies Read our privacy policy for more information about how we process personal data. On our sites, we sometimes place small data files on your computer. These small files are known as 'cookies'. They improve the performance of our sites by: remembering information about you, so you don’t have to keep re-entering it whenever you visit a new page recognising that you may already have given a username and password so you don't need to do it for every web page requested remembering IP addresses relating to your computer or device to improve navigation of our sites and to control access to particular content or materials reserved to subscribers measuring how you use the site so we can make sure it meets your needs Our cookies aren’t used to identify you personally. To learn more about cookies and how to manage them, visit AboutCookies.org. You can choose to disable cookies on the Society’s main website, royalsociety.org, by selecting your preferences from the Cookie Control menu, selectable from the bottom-right corner of the website window. This page provides particular information about cookies on the following websites: https://royalsociety.org https://royalsocietypublishing.org https://pictures.royalsociety.org https://prints.royalsociety.org https://makingscience.royalsociety.org/ Royalsociety.org Strictly necessary cookies These cookies are necessary for the website to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in or filling in forms. You can set your browser to block or alert you about these cookies, but some parts of the site will not then work. These cookies do not store any personally identifiable information. First-party Name Description Expiration OptanonConsent This cookie is set by the cookie compliance solution from OneTrust. It stores information about the categories of cookies the site uses and whether visitors have given or withdrawn consent for the use of each category. This enables site owners to prevent cookies in each category from being set in the users browser, when consent is not given 1 year shell#lang Storage of language choice Session _RequestVerificationToken Helps prevent Cross-Site Request Forgery (CSRF) attacks. It holds no information about the user and is deleted on closing the browser Session OptanonAlertBoxClosed This cookie is set after visitors have seen a cookie information notice. It enables the website not to show the message more than once to a user 1 year ASP.NET_SessionId General purpose platform session cookie, used by sites written with Microsoft .NET based technologies. Used to maintain an anonymised user session by the server Session Performance cookies These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our site. They help us to know which pages are the most and least popular and see how visitors move around the site. All information these cookies collect is aggregated and therefore anonymous. If you do not allow these cookies we will not know when you have visited our site, and will not be able to monitor its performance. First-party Name Description Expiration _ga Registers a unique ID that is used to generate statistical data on how the visitor uses the website 1 year _hjSession_xxxxxxx A cookie that holds the current session data. This ensures that subsequent requests within the session window will be attributed to the same Hotjar session Session _ga_xxxxxxxxxx Used by Google Analytics to collect data on the number of times a user has visited the website as well as dates for the first and most recent visit 1 year _gid Used by Google Analytics to register a unique ID that is used to generate statistical data on how the visitor uses the website A few seconds _hjSessionUser_xxxxxxx Hotjar cookie that is set when a user first lands on a page with the Hotjar script. It ensures that behavior in subsequent visits to the same site will be attributed to the same user ID 1 year mp_*_mixpanel Used to identify individual users. This tool is used to measure site performance and usage patterns 1 year _gat Used by Google Universal Analytics to throttle the request rate - limiting the collection of data on high traffic sites A few seconds Third-party Name Description Expiration _ga Hosted by knightlab.com, this is used by Google Analytics to collect data on the number of times a user has visited the website as well as dates for the first and most recent visit 1 year JSESSIONID This domain is controlled by New Relic (nr-data.net), which provides a platform for monitoring the performance of web and mobile applications Session _ga_xxxxxxxxxx Hosted by knightlab.com, this is used by Google Analytics to collect data on the number of times a user has visited the website as well as dates for the first and most recent visit 1 year _persistenceTest Hosted by app.sli.do for online polls 1 year _ _ga_xxxxxxxxxx Hosted by carto.com. Google Analytics cookie 1 year Functional cookies These cookies enable the website to provide enhanced functionality and personalisation. They may be set by us or by third party providers whose services we have added to our pages. If you do not allow these cookies then some or all of these services may not function properly. Third-party Name Description Expiration vuid This is a vimeo.com hosted cookie. The main business activity is: Video Hosting/Sharing 9 years __cf_bm This is a CloudFoundry cookie A few seconds Targeting cookies These cookies may be set through our site by our advertising partners. They may be used by those companies to build a profile of your interests and show you relevant adverts on other sites. They do not store directly personal information but are based on uniquely identifying your browser and internet device. If you do not allow these cookies, you will experience less targeted advertising. First-party Name Description Expiration _fbp Used by Facebook to deliver a series of advertisement products such as real time bidding from third party advertisers 2 months Third-party Name Description Expiration TESTCOOKIEISENABLED YouTube collects user data through videos embedded in websites, which is aggregated with profile data from other Google services in order to display targeted advertising to web visitors across a broad range of their own and other websites A few seconds NID Google advertising. Data is used profile the interests of web users and sell advertising space to organisations based on such interest profiles as well as aligning adverts to the content on the pages where its customer's adverts appear 6 months YSC YouTube collects user data through videos embedded in websites, which is aggregated with profile data from other Google services in order to display targeted advertising to web visitors across a broad range of their own and other websites Session VISITOR_INFO1_LIVE Hosted by youtube.com This cookie is used as a unique identifier to track viewing of videos. 5 months VISITOR_PRIVACY_ METADATA YouTube collects user data through videos embedded in websites, aggregated with profile data from other Google services in order to display targeted advertising to web visitors across range of their own and other websites 5 months Royalsocietypublishing.org https://royalsocietypublishing.org uses cookies to provide enhanced functionality and improve the end users' experience. The following types of cookies are used: Session cookies that are set when the end user enters the website and deleted when the user closes the browser. Persistent cookies that are set when the end user enters the website and last for up to one year. Necessary cookies Name Description Expiration OptanonAlertBoxClosed Cookie set by OneTrust. It is set after visitors have actively interacted with the cookie information notice. It enables the website not to show the message more than once to a user. Persistent OptanonConsent Cookie set by OneTrust. It stores information about the categories of cookies the site uses and whether visitors have given or withdrawn consent for the use of each category. Persistent JSESSIONID General purpose platform session cookie, used by sites written in JSP. Used to maintain an anonymous user session by the server. Session MACHINE_LAST_SEEN Used to store the last login date of the end user or the specific machine. Persistent I2KBRCK Used to check if the end user's browser supports cookies. Persistent SERVER Used to optimize the website’s performance for the end user. They are also used to collect information about how end users use the website. Session __cf_bm Cookie set by Cloudflare to support Cloudflare Bot Management. This cookie helps manage incoming traffic that matches criteria associated with bots. Persistent cf_use_ob Cookie set by CloudFlare to improve page load times and to override any security restrictions based on the visitor's IP address. It does not contain any user identification information. Persistent cf_chl_3 Cookie set by CloudFlare to check whether the CloudFlare Edge server supports cookies. Persistent cf_clearance Cookie set by CloudFlare to to detect if a connection is from a bot. When a visitor solves a challenge presented due to a WAF custom rule or an IP Access rule a cookie is set in the visitor's browser. 30 minutes ASP.NET_SessionId Preserves the user’s session state across page requests. Session Performance cookies Name Description Expiration _ga Cookie set by Google Analytics. Registers a unique ID that is used to generate statistical data on how the visitor uses the website. Persistent _gat_UA- Cookie set by Google Analytics. The pattern element on the name contains the unique identity number of the account or website it relates to. Persistent _gid Cookie set by Google Analytics. Registers a unique ID that is used to generate statistical data on how the visitor uses the website. Persistent _hjAbsoluteSessionInProgress Cookie set by HotJar. This cookie is used to count how many times a website has been visited by different visitors - this is done by assigning the visitor an ID, so the visitor does not get registered twice. Persistent _hjFirstSeen Cookie set by HotJar. Identifies a new user's first session, indicating whether or not Hotjar is seeing this user for the first time. Persistent _hjid Cookie set by Hotjar. Sets a unique ID for the session. This allows the website to obtain data on visitor behaviour for statistical purposes. Persistent _hjIncludedInPageviewSample Cookie set by HotjJar. Determines if the user's navigation should be registered in a certain statistical place holder. Persistent _hjIncludedInSessionSample Cookie set by HotJar. Registers data on visitors' website behaviour. This is used for internal analysis and website optimization. Persistent _hjSessionRejected Cookie set by Hotjar to provide load balancing functionality. Session PU_LAST_LOGIN Used to store the last login date of the end user or the specific machine for analytics. Persistent __utmz Cookie set by Google to monitor where a visitor arrived from. It also registers, what keyword generated the visit plus geolocation data. Persistent __utma Cookie set by Google. Stores the traffic source or campaign that explains how the user reached your site. The cookie is created when the javascript library executes and is updated every time data is sent to Google Analytics. Persistent Functional cookies Name Description Expiration __atuvc Cookie set by AddThis to store an updated page share count. Persistent __atuvs Cookie set by the AddThis social sharing widget which is commonly embedded in websites to enable visitors to share content with a range of networking and sharing platforms. Persistent __atssc Cookie set by the AddThis social sharing widget which is commonly embedded in websites to enable visitors to share content with a range of networking and sharing platforms. Persistent SSO_IDP Used to store the end user's preferred Shibboleth identity provider. Persistent MobileUI Used to record the visitor’s preference for using the mobile-optimized version of the website. Session SFFID Cookie to store encrypted device UUID. Persistent AUTO_SIGNIN Cookie set when the end user explicitly selects the 'Remember me' option in the sign in page of the website. Persistent timezone It is used to store the end user's device time zone information. Persistent cf_ob_info Cookie set by CloudFlare to improve page load times and to override any security restrictions based on the visitor's IP address. Persistent fig_tracker_client Cookie set by figshare. Persistent vglnk.PartnerRfsh.p Cookie set by Disqus. Persistent vglnk.Agent.p Cookie set by Disqus. Used to collect visitor behaviour in order to present more relevant advertisements. Persistent Targeting cookies Name Description Expiration MAID Used to target more relevant content and services to the end user. Persistent PLUID Used to target more relevant content and services to the end user. Persistent MAID_SYNC Enables server to sync the device ID to a previously-stored device ID. Persistent MAID_DISC Stores the device ID for flash widget for more relevant content and services to the end user. Persistent tid Cookie set by royalsocietypublishing.org and TrendMD. Persistent G_ENABLED_IDPS This cookie is used to securely log in to the website with a Google account. Persistent disqus_unique Cookie set by Disqus so that users can comment on the website/platform. Persistent __jid Cookie set by the third-party commenting platform Disqus. Persistent s_xxxx Cookie set by the third-party commenting platform Disqus. Persistent NID Cookie set by Google. Registers a unique ID that identifies a returning user's device. The ID is used for targeted ads. Persistent __atrfs Cookie set by the AddThis social sharing widget. Enables visitors to create and share links to the content across social networks. Persistent uvc Cookie set by the AddThis social sharing widget and tracks how often a user interacts with AddThis. Persistent xtc Cookie set by the AddThis social sharing widget. Enables visitors to create and share links to the content across social networks. Persistent trendmd-disable-gdpr-ga-popup Cookie set by the TrendMD widget. Persistent trendmd-nongdpr Cookie set by the TrendMD widget. Used to target more relevant content to the end user. Persistent s-DMDSESSID Cookie set by the TrendMD widget. Session t4 Cookie set by the TrendMD widget. Used to target more relevant content to the end user. Persistent f3 Cookie set by the TrendMD widget. Used to target more relevant content to the end user. Persistent VISITOR_INFO1_LIVE Cookie set by Youtube. To keep track of user preferences for Youtube videos embedded in sites. It can also determine whether the website visitor is using the new or old version of the Youtube interface. Persistent YSC Cookie s"
