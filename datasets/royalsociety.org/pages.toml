["https://royalsociety.org/about-us/contact-us/carlton-house-terrace-london"]
title = "Plan your visit to the Royal Society | Royal Society"
description = "Information on access and accessibility at the Royal Society, London - home of the Society's main offices and the venue for many of our events"
full_description = "/ About the Royal Society / Contact us Plan your visit to the Royal Society The Society's main offices and the venue for many of our events. Address 6-9 Carlton House Terrace London SW1Y 5AG Tel: +44 207 451 2500 Email: reception@royalsociety.org Please see our Contact us page for team contact details. Maps Google | Bing | OpenStreetMap Getting here Public transport links Underground stations: Charing Cross and Piccadilly Circus Bus routes: 12, 13, 15 and 453. Coach station: Connections from Victoria coach station Car and coach parking We are located within the congestion charge zone. On-street parking on Carlton House Terrace and Waterloo Place is available for up to four hours, priced at £11.38 per 2 hours. The Cavendish Carpark is also close by. Chartered coaches are able to drop off and pick up in front of the building but are unable to park. There are several coach parks nearby. Disabled parking permit holders Subject to availability, there are a limited number of parking spaces immediately outside the front door which can be booked in advance for Blue Badge holders. Please contact the reception team if you would like to reserve one of these spaces. Bicycle parking There are cycle racks along Carlton House Terrace on either side of the Duke of York monument. Arriving at 6-9 Carlton House Terrace The main entrance to the building has five steps, with a handrail, which lead up to the ground floor of the building. To the right of the main entrance is an external platform lift (max. weight 1350kg) which is operable by reception staff. There is a call button to the right of the entrance steps which will allow visitors to call a member of staff to operate the lift. Entrance doors to the building are transparent glass with transparent handles. Bikes can be locked securely to the left of the entrance steps. Access to all floors Lifts are available for access to the basement level or first floor. Toilets The main toilets are in the basement and can be reached via the lift or stairs in reception. There is an accessible toilet on the ground floor behind the reception area and an ambulant toilet in the basement. There are baby changing facilities in all the toilets in the basement and in the accessible toilet behind reception. We would ask that the baby change facilities in the accessible toilets are only used by parents/careers that specifically require the use of an accessible toilet, as baby changes facilities are available elsewhere. Induction loops/Hearing loops Floor Room Infra-red loop Induction loop Basement Dining room ✔ x Mercer 1 x x Ground floor City of London rooms x x Kohn Centre x ✔ Welcome Trust Lecture Hall x ✔ Level 1 Conference room ✔ x Council room x ✔ Wolfson Rooms ✔ x For additional information on induction and hearing loops, please speak to our reception team. Around the building We have a quiet room on the ground floor next to the marble hall. Please ask the reception desk if you need access to this space. Light levels around the building, particularly in corridors can be low. The reception area has a section of thick carpet leading to the lift, stairs and other rooms on the ground floor. Attending events Most of our public events are run on a first-come, first-served basis. Doors do not open until a specified time before the event is scheduled to start - if you arrive earlier than this then you may have to queue outside the building. If you would like a wheelchair space at an event, please contact us in advance so that we can ensure it is reserved for you, and arrive at least 20 minutes before the start of the event. For our public events that operate on a first-come, first-served basis, we have a limited number of bookable seats for people with impaired mobility who would be unable to queue. Please contact us to book in advance so that we can ensure a seat is available, and arrive at least twenty minutes before the start of the event. Admittance to scientific meetings is only for attendees who have registered online in advance. Please note the Society reserves the right to exclude anyone at its discretion. Recording and photography We ask that you do not take photographs or make recordings in our building. We usually make audio or video recordings of our events and by attending an event you consent to this recording and subsequent broadcast or reproduction."
year_published = 2025
