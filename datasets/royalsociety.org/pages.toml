["https://royalsociety.org/about-us/what-we-do/collections"]
title = "Collections | Royal Society"
description = "Explore the history of science through our rare and intriguing collection of books, archives, paintings, images and artefacts."
full_description = "The Royal Society collections began with the foundation of the Society in 1660 and cover all branches of science. The library holds over 78,000 volumes, including rare printed books, scientific periodicals and an extensive collection of scholarship on the history of science available for browsing in our Reading Room. The archives include the works of Fellows of the Royal Society, personal papers of eminent scientists, letters and manuscripts sent to the Society or presented at meetings, and administrative records documenting the Society’s activities since 1660. Our collections also include nearly 6,000 photographs and 1,300 engravings, 265 medals, 215 paintings, 80 sculptures and 57 original scientific instruments and timepieces. Use our catalogues to search our printed and archival collections, our Science in the Making platform where over 40,000 manuscripts are accessible, our picture library to browse digital images of our paintings, drawings and prints. Learn more about how we support research in the history of science. Please check our opening hours before planning your visit. Ainsley Vinall In History of science 18 February 2025 5 min read The nearly man Ainsley Vinall tells the story of the astronomer Alexander Aubert FRS, the subject of an oil… Blog Kathryn Maxson Jones In History of science 11 February 2025 6 min read Squid game 2: neuroscience in wartime context In the second half of a two-part article, Kathryn Maxson Jones highlights further resources on the… Blog Kathryn Maxson Jones In History of science 04 February 2025 6 min read Squid game 1: excitation in the archive In the first half of a two-part article, Royal Society Lisa Jardine Grant recipient Kathryn Maxson… Blog Louisiane Ferlier In History of science 23 January 2025 5 min read Book dust Louisiane Ferlier looks at the three books donated to the Royal Society Library by mathematician… Blog Keith Moore In History of science 20 December 2024 5 min read Ghostbusters! A new collection in the archives of the Royal Society shows how the electrical engineer Alan… Blog"
