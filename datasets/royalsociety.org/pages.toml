["https://royalsociety.org/about-us/terms-conditions-policies/modern-slavery-statement"]
title = "Modern slavery statement | Royal Society"
description = "The Royal Society is committed to taking the appropriate measures to reduce the risk of slavery and human trafficking taking place in our organisation or our supply chains."
full_description = "/ About the Royal Society / Terms, conditions and policies Modern slavery statement for the year ending 31 March 2024 Introduction The Royal Society (‘the Society’) is committed to taking the appropriate measures to reduce the risk of slavery and human trafficking taking place in our organisation or our supply chains. This statement is made pursuant to section 54 of the Modern Slavery Act 2015 and constitutes the Society’s slavery and human trafficking statement for the financial year ended 31 March 2024. Our organisation The Royal Society of London for Improving Natural Knowledge, commonly known as the Royal Society, was founded in 1660 and incorporated by Royal Charter, and is a registered charity in England and Wales. The Society has two wholly owned subsidiaries, Royal Society Trading Limited and Royal Society (London) Ltd. Royal Society Trading Limited was dormant throughout the year ended 31 March 2024. The Society is an independent Fellowship of many of the world’s most distinguished scientists drawn from all areas of science, engineering, and medicine. Fellows and Foreign Members from across the globe are elected based on the excellence of their science. The Society’s fundamental purpose, as it has been since its foundation, is to recognise, promote, and support excellence in science and to encourage the development and use of science for the benefit of humanity. The Society’s strategic priorities emphasise its commitment to the highest quality science, to curiosity-driven research, and to the development and use of science for the benefit of society. As a national academy, the Society represents the UK and collaborates with international partners to advocate for science and its benefits. It provides authoritative and independent advice on matters of science that support the public good, including policies that promote excellent science and scientific issues that inform public policy. It also organises scientific conferences and publishes scientific journals. The Society’s supply chain The Society engages suppliers to provide services to support in operational activities. The key areas in which we engage suppliers are: Facilities management; Information technology; Catering and events management; Finance; and Legal and investments. Policies In 2019, the Society reviewed its policies and added measures to minimise the risk of modern slavery and human trafficking in our organisation and our supply chain. Our key policies and procedures include: Procurement policy which sets out requirements for ethical procurement and the standards required of the suppliers we work with; Whistleblowing policy which encourages staff to report concerns including any related to modern slavery and human trafficking; and HR procedures which cover procedures to ensure that our staff have the appropriate right to work documents and ensures they are paid fairly. The Society’s investment policy specifies that investments are expected to have a high ESG rating, this is monitored by the Investment Committee as is engagement by the Society's investment managers on ESG matters. All of the Society’s policies have a relevant policy owner assigned and are formally reviewed at least every three years. Changes in the landscape are continually monitored and policies are continually reviewed in this regard to ensure they remain effective and appropriate. Due diligence processes The Society undertakes checks as part of the vetting process for new suppliers which are considered to be operating in a high risk context and has methods of monitoring the due diligence assessment undertaken, including a schedule for routinely checking that high risk suppliers continue to comply. These checks include ensuring suppliers have appropriate policies in place, their compliance with applicable law and whether they adopt certain best practice recommendations. This process is carried out by the Society’s procurement team and are reviewed on an ongoing basis for efficiencies and improvements. Our grant activities Grant recipients’ host institutions are required to have relevant policies and procedures as part of the Society’s conditions of award. As part of the grants audit programme, each year the Society checks for the relevant policies and procedures in a selection of recipient institutions. Training The procurement team attends regular training sessions which include updates on regulatory requirements and provides examples of best practice. All new joiners attend an induction session which includes information and training on relevant policies, which include measures to minimise the risk of modern slavery and human trafficking where appropriate. Approval This statement has been formally approved by the Council members of the Society and signed on their behalf by Sir Adrian Smith, President of the Royal Society, on 29 July 2024."
year_published = 2025
clearnet = "https://royalsociety.org/about-us/terms-conditions-policies/modern-slavery-statement"
