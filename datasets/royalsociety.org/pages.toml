description = "In 2016 the Royal Society and the Tata Group announced the Royal Society Tata University Research…"
full_description = "/ About the Royal Society / How we are governed / Funding and finances Support from foundations, corporations and donors As the world's oldest scientific academy, we aim to promote a spirit of enquiry, excitement and engagement with science throughout the scientific community and wider public. Scientific progress has been at the cornerstone of human advancement throughout history, the joy and wonder of scientific discovery is as important now as ever before. Support allows the Society to continue to influence and lead scientific discovery and help to create a future for scientific excellence. Throughout our long history donations have been essential in enabling the Royal Society to support outstanding scientists, promote science and its benefits and recognise excellence in science. The Society is a registered charity and we rely on voluntary contributions to fund many aspects of our work. Find out more about just a few of the grants, awards and research made possible by our generous donors. For information about how the data of donors, Fellows and friends is used, please see the Royal Society’s privacy policy. If you decide to give to the Society you will join a distinguished group of Fellows and friends in supporting the future of science. You will help to sustain scientific excellence on an ongoing basis and participate in a rich community of ideas and scientific leaders. You can donate online. If you would rather donate via post, please complete the gift form (PDF) and send it to Development Office, The Royal Society, 6-9 Carlton House Terrace, London SW1Y 5AG. If you wish to discuss making your donation tax-efficient, or to give stocks or shares please contact us at development@royalsociety.org or 020 7451 2211. Donate online Your browser does not support Iframes Royal Society Gift acceptance policy and process Our donors American Friends of the Royal Society (AFRS) Tata Group In 2016 the Royal Society and the Tata Group announced the Royal Society Tata University Research… The Wolfson Foundation Learn more information on donations to the Royal Society from The Wolfson Foundation."
