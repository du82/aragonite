["https://royalsociety.org/about-us/terms-conditions-policies/privacy-policy"]
title = "Privacy policy | Royal Society"
description = "Access information on privacy and personal data on Royal Society websites."
full_description = "/ About the Royal Society / Terms, conditions and policies Privacy policy The Royal Society is committed to protecting and respecting your privacy. This Policy sets out how and why we (the Royal Society including the UK Young Academy (UKYA)) use your personal data, and how we protect your privacy when doing so. Please read the following carefully to understand how we will use your 'personal data'. 'Personal data' means any information relating to you, through which you can be identified either directly or indirectly such as name and contact details, biographical information or information about your interests/qualifications. There are types of personal data that are more sensitive in nature and therefore require a higher level of protection; this type of data is classified as ‘special categories of personal data’. (Examples of special categories of personal data include race; ethnic origin; political opinions; religious or philosophical beliefs; trade union membership; genetic data; biometric data used for identification purposes; health data; sex life; or sexual orientation.) The UKYA is a joint initiative between the Royal Society and six partner National Academies (Academy of Medical Sciences, British Academy, Learned Society of Wales, Royal Academy of Engineering, Royal Irish Academy and the Royal Society of Edinburgh) operating across the UK and Ireland. Personal data relevant to the UKYA and its activities may be shared with the partner academies in order to facilitate the initiation and planning of the UKYA . Further details on how your personal data is used can be found below. Changes to this privacy policy We keep this Policy under regular review and it may be modified from time to time. Please check back here for further updates. This policy was last updated on 31 October 2024. Jump to: Fellows and Foreign Members Grant applicants and holders Medals and awards nominees and winners Panel members and independent reviewers Working group and committee members Event invitees and attendees Photography and filming Donors and prospective donors Visitors to our website and blog users Social media contacts Surveys and competitions Email subscribers Authors and journal contacts Journalists Library users Job applicants, current and former employees Diversity monitoring Data retention The legal basis of processing Your rights Access to personal data Complaints or queries UK Young Academy Applicants UK Young Academy Members Fellows and Foreign Members When you are elected as a Fellow or Foreign Member of the Royal Society, your personal data is stored on our central database using information from your nomination forms and from your completed New Fellows forms. This information is periodically updated at your request, and from surveys that we conduct which you participate in. As your Fellowship or Foreign Membership is for life, we retain this information in perpetuity (without prejudice to your data protection rights, as outlined below). As part of your relationship with us, you may be asked to support or get involved in some of the Society’s activities, such as joining a committee, becoming a referee, speaking at events, or attending meetings or events. You will also receive Fellowship communications from the President and Executive Director which you are welcome to unsubscribe from at any time. Factual information, such as your name, the year you were elected, any Medals or Awards you have received, reports for which you were on the Working or Advisory Group, and any Committees you have served on may be made available in the public domain through our website, and in reports where relevant. Records of conferences or major workshops we hold (alone or jointly) may also be published, including the names of those attending. Information we hold about you is stored on our CRM, Microsoft Dynamics 365, which is hosted by Microsoft Corporation. To find out about how Microsoft handles your data, please see their privacy policy. Further privacy information is also available in Microsoft's Privacy Trust Centre. If you are entitled to claim expenses under the Royal Society’s travel and expenses policy, we will collect personal data from you to enable us to process the payment. This will include your name, email address and bank account details. This information will be stored on the Royal Society’s systems, including its cloud-based finance system, Xledger. Further information about Xledger can be found on its website. Candidates for Fellowship and Foreign Membership Candidates being elected for Fellowship or Foreign Membership are requested to acknowledge their nomination and will be informed of our intention to keep their personal details on file. Personal data that is provided to us for the purposes of the election process will be kept securely at the Society for seven years (from the initial year of nomination) in the case of a first nomination, and three years (from the initial year of nomination) in the case of any subsequent nominations. As part of the election process, your personal data will be supplied to third parties in a selected peer group chosen from the same scientific field or knowledge sector for the purposes of refereeing. These third parties will be mainly Fellows and Foreign Members of the Royal Society, however some non-Fellows within and outside of the UK and the EEA may also be approached. References that we receive about you will be retained in electronic format on our nomination system for two years after each election while you are a nominee. A complete set of references in hard copy will be transferred to our historical archives at the conclusion of every election. On election, or in the event of your nomination lapsing, your references will also be removed from the nominations system to our historical archives. Personal data stored in our archives will be held for the purpose of historical public and research interest and, in the case of nominations to the Fellowship, will not be made accessible until the death of all individuals involved. If you are successfully elected to the Fellowship, the information that was submitted about you will be used as the basis for your Fellowship record and Royal Society website profile. If you are unsuccessful, your nomination and identifying data such as name, date of birth and contact details will be retained by us should a further nomination be made at a later date, but all other personal data about you will be deleted. back to top of page Grant applicants and holders The Royal Society Grants Programme includes all grants listed here. The Royal Society uses personal data submitted by users of our grants management and awards system, Flexi-Grant®, for the following purposes: Processing applications, making and administering grants and awards, monitoring, evaluation, and reporting, including statistical analysis in relation to the evaluation of research and the study of trends; Evaluating and assessing activities, research outputs and impact arising from grants and awards by selected third parties, such as independent evaluators, consultancy groups, and career development organisations (some of whom may be based outside of the UK and the EEA); In connection with any independent internal and external audit of the Royal Society; Processing award finances and payments to your employing host organisation; Contacting you about our activities and events - or to help inform or evaluate these events, our application processes, strategy and policy work - in the form of newsletters, social media, surveys, and questionnaires. Where required by law, we only send direct marketing communications by email (or other electronic means) to an individual's private address when we have their prior consent; Maintaining your details as part of our alumni programme once your grant comes to an end. In assessing your application, we share details of your application with panel members and independent reviewers that are not employees of the Society. Please see the section on ‘Panel members and independent reviewers’ below for further information. We may publish details of successful grants and awards, and their outputs, including your name, employing host organisation, project title, summary of the award, scientific abstracts, lay summaries, and the value of your award on our public website, or via publicly available databases or other publications, some of which may be accessible from outside of the UK and the EEA. We may contact you for your consent to use information relating to you or your grant in the promotion of the Royal Society’s programmes for example in the form of case studies, blog post and other similar activities. Any information you elect to provide during the application processes relating to gender, age, disability, ethnic origin, or nationality will be used only for the purposes of monitoring diversity and equality and stored confidentially in accordance with applicable legal obligations. Diversity data is reported on anonymously. Personal data may be provided by third parties as part of the application process, and this data may be processed for the purposes of verifying relevant details related to grant applications. Information we hold about you is stored on our CRM, Microsoft Dynamics 365, which is hosted by Microsoft Corporation. To find out about how Microsoft handles your data, please see their privacy policy. Further privacy information is also available in Microsoft's Privacy Trust Centre. If you are entitled to claim expenses under the Royal Society’s travel and expenses policy, we will collect personal data from you to enable us to process the payment. This will include your name, email address and bank account details. This information will be stored on the Royal Society’s systems, including its cloud-based finance system, Xledger. Further information about Xledger can be found on its website. Mentoring programme The Royal Society mentoring programme uses personal data submitted via SmartSurvey for registered mentees and mentors for the following purposes: To facilitate the mentoring matching process, which is informed by general research field, geographical location and organisation, and interests expressed by both parties; Contacting you about activities relating to the programme, to check whether additional support may be provided for pairs or to help inform evaluation of processes including registration, strategy or operation procedures. Contact may be in the form of surveys, questionnaires or direct communication by email – communication by telephone will only be done when we have your prior consent; Statistical analysis in relation to the evaluation of the programme; Maintaining your details as record of your interest in participating and to monitor records of pairs. In the matching process we share the name and organisation of either party of a potential pair and seek consent of both parties prior to confirmation of the match. Should you not wish to be paired you may inform us, and another match will be suggested. Once pairs are matched it is the responsibility of the mentee to drive forward the relationship in a communication framework agreed by both parties. We may contact you for your consent to use information relating to you or your experience in the promotion of the Royal Society’s mentoring programme for example in the form of case studies, blog posts and similar activities. Your personal registration data will be retained for at least two years from the date of your registration, after which time you will be invited to re-register as a mentor should you wish to continue. The names of matched pairs will be transferred to our historical archives at the conclusion of this period. Personal data stored in our archives will be held for the purpose of historical public and research interest and will not be made accessible in line with our archiving closure period for administrative records. If at any point you would no longer like to participate in the programme you can let us know by emailing mentoring@royalsociety.org. Please ensure you tell us if you would like to opt-out from all mentoring programme opportunities or just for a set period. Alumni If you have previously been a recipient of a Royal Society grant or award, we may wish to contact you from time to time for the following purposes: Evaluating and assessing activities, research outputs and impact arising throughout the course of your career, to help us monitor and track the effectiveness of our grants and awards by selected third parties, such as independent evaluators, consultancy groups, and career development organisations (some of whom may be based outside of the UK and the EEA); Publishing details of previous recipients of funding, this may include your name and title, employing organisation and career summary on our public website, or via publicly available databases or other publications, some of which may be accessible from outside of the UK and the EEA; Contacting you about our activities and events - or to help inform or evaluate these events, our application processes, strategy and policy work - in the form of newsletters, social media, surveys, and questionnaires; Contacting you about the Royal Society’s mentoring programme. This may include communication via email inviting you to register your interest in participating via SmartSurvey or to propose a potential registered mentee. Where contact is made prior to your registration we will seek your consent to proceed and invite you to register fully to the programme via SmartSurvey. You are under no obligation to remain in contact with the Society following the end of your grant or award. In accordance with your data protection rights, we will respect any request from you as an alumnus to remove the data we hold on you from our alumni database after the end of your award, and to refrain from contacting you thereafter for the above purposes. Partners and Funders The Royal Society receives funding from government departments, including the Department for Science, Innovation and Technology (DSIT) and the Foreign, Commonwealth and Development Office (FCDO), philanthropic organisations and private donors. We work in close partnership with our funders and partners including other Academies and learned Societies, to process applications and administer grants and awards. As part of our agreement with our funders and partners (or their representatives), the personal data you provide in your application, subsequent reports, and financial statements will be used for the purposes of: Reporting activities, research outputs and impacts arising from grants and awards; Monitoring and evaluation, including statistical analysis in relation to the evaluation of research and the study of trends; Contacting you about our activities and events or those of the partner/funder - or to help inform or evaluate these events, our application processes, strate"
