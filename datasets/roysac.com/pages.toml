title = "Cracktro Text Edit Tool"
description = "Cracktro Text Edit Tool - Tool that allows the creation and edit of cracktro text for page-texts or scollers. Flexible config options for easy re-use with existing pre-compiled release intro templates"
full_description = '''If you have a pre-compiled intro/cracktro with page text that must be updated and then compiled by somebody of your group who isn't a coder then you probably already know that they often make errors during the text edit, which is often some pre-formated code include file for "C" or "Assembler". They enter more characters in a line than they are supposed to or too much or too little lines per page or use characters that are not supported by the font set used by the intro and either cause the final intro to crash or in most cases just show messed up text with missing or wrong characters. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. This tool is a mini-editor for page texts which can be easily configured via command line options and included with your pre-compiled cracktro where you can simply call it via a batch script where you pass along the desired settings. The resulting text file output file will write each line separated by CR+LF (chr(13)+chr(10)). There will always be NUM characters per line. Not used space is automatically replaced by space characters, which includes not utilized lines to fill up the specified size of the page. A two pages "page text" with 20 characters per line and 10 lines per page would look like this for example (the double quotes were added for illustration purposes and not part of the actual output):'''
