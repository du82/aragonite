title = "The Early Days - ASCII Text Art Collection by Roy of SAC"
description = "The Early Days - ASCII Text Art Gallery, Home of Roy/SAC (retired) - Superior Art Creations. Famous Ascii and Ansi Text Art. All SAC Artpacks available for download. The three Styles of the Underground ASCII Art Scene"
full_description = '''Page Information Here are old ASCIIs of mine from a time when the Roy was still without the suffix "/SAC" and ASCII art which I did during my time at SAC, but which never got released with any of the SAC art packages for any reason. Show Gallery The stuff has not the same quality than my main ASCII art gallery, but some of the stuff is actually not that bad. Everybody had to get started and learn the skills necessary to produce some decent ASCII art. It's like with creating sculptures. Even if you are a genius and gifted artist, is it necessary to learn how to work with chisels and hammer. You also have to get to know the characteristics of the material you are using and how you can use specific "good" or "bad" properties to your advantage. This requires experience and time. Same concept. Also see the Early Days Gallery of my ANSI Art. ROY_EARLYASCII.ZIP - Download ALL ASCII files in this gallery in a single zip-file. Other Roy/SAC Art Galleries Roy/SAC ASCII Art Gallery Roy/SAC ANSI Art Gallery Roy/SAC Best-Of ANSI/ASCII Art Gallery Roy/SAC Pixel Art Gallery Roy/SAC Early ANSI Art Gallery Gallery Here are old ASCIIs of mine from a time when the Roy was still without the suffix "/SAC" and ASCII art which I did during my time at SAC, but which never got released with any of the SAC art packages for any reason. Show Gallery The stuff has not the same quality than my main ASCII art gallery, but some of the stuff is actually not that bad. Everybody had to get started and learn the skills necessary to produce some decent ASCII art. It's like with creating sculptures. Even if you are a genius and gifted artist, is it necessary to learn how to work with chisels and hammer. You also have to get to know the characteristics of the material you are using and how you can use specific "good" or "bad" properties to your advantage. This requires experience and time. Same concept. Also see the Early Days Gallery of my ANSI Art. ROY_EARLYASCII.ZIP - Download ALL ASCII files in this gallery in a single zip-file.'''
