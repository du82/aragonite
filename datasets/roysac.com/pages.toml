title = "Process Scene Releases"
description = "A Batch Script to Package a Release for the Scene the correct way, meaning pre-packing with RAR (split if necessary) to then ZIP these while adding file_id, nfo and opt. Intro to the archive."
full_description = '''Over the decades the "scene" (Warez and to some degree the demoscene as well) developed semi-standards about how a proper release should like. At time these standards were even acknowledged by the major release groups and strongly enforced, resulting in possible "NUKES" for any release that did not follow the agreed upon release format standards. Some details changed over time, like the archiver ARJ was replaced by ACE and RAR and the size of individual files a release had to be broken down into, just to name a few. But the general format pretty much endured. Unfortunately is the process of creating one a pain in the neck and folks cut down on the quality in order to save time, for instance by not numbering the files properly in the file_id.diz file for each zip archive. They were simply showing [XX/99] where 99 was simply replaced with the actual number of archives and then used without changing the XX in each of the archives. This script of mine intends to make the process as simple as possible yet providing some flexibility as well. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. I posted in the past multiple times about this script. I included the links to them below, because you might be able to find additional useful information there that supplement the content you can find on this page. You require the tools WinZIP and WinRAR to be able to use this script. Both are not part of this download. In the case of WinZIP do you require to have the separate command line version of the tool (WZZIP.EXE). In case of WinRAR, the command line version RAR.EXE is usually included in the general release version of the tool.'''
author = "Roy/SAC"
year_published = 2025
