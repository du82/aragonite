full_description = "Page Information I am fortunate that I kept most of my text art to be able to present an almost complete collection of my ASCII art. This includes most ASCIIs of my early time when I just started out doing it (which is not as pretty). Even though I am not that proud of my early creations, are they a valuable example to demonstrate the progression and improvement I did undergo as artist. ASCII and ANSI art and art in general might require talent, but the technical aspects of it, be it using brushes and paint or hammer and chisel require time and training. Show Gallery As a reminder. I did release all my ASCIIs and ANSIs into the public domain, which means that you are free to download any piece you like, change it and use it for your own purposes. I would appreciate the mentioning of my name and may be a link to my site (if you use it online) as a way of saying thank you. ROY_ASCII.ZIP - Download ALL ASCII files in this gallery in a single zip-file. Also have a look at the ASCII artwork by various other artists, which I made available here on my site. Other Roy/SAC Art Galleries Roy/SAC ANSI Art Gallery Roy/SAC Best-Of ANSI/ASCII Art Gallery Roy/SAC Pixel Art Gallery Roy/SAC Early ASCII Art Gallery Roy/SAC Early ANSI Art Gallery Gallery I am fortunate that I kept most of my text art to be able to present an almost complete collection of my ASCII art. This includes most ASCIIs of my early time when I just started out doing it (which is not as pretty). Even though I am not that proud of my early creations, are they a valuable example to demonstrate the progression and improvement I did undergo as artist. ASCII and ANSI art and art in general might require talent, but the technical aspects of it, be it using brushes and paint or hammer and chisel require time and training. Show Gallery As a reminder. I did release all my ASCIIs and ANSIs into the public domain, which means that you are free to download any piece you like, change it and use it for your own purposes. I would appreciate the mentioning of my name and may be a link to my site (if you use it online) as a way of saying thank you. ROY_ASCII.ZIP - Download ALL ASCII files in this gallery in a single zip-file. Also have a look at the ASCII artwork by various other artists, which I made available here on my site."
