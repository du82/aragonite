["https://roysac.com/asciiarthistory.html"]
title = "The History of ASCII (Text) Art by Joan G. Stark"
description = "The history of text art from the ancient times over typewriter art and radio-teletype to modern times ASCII art on the computer. An article written by Joan G. Stark."
full_description = '''Development of (ASCII) Text Art (c)1999-2000 Joan G. Stark aka JGS or Spunk unless noted otherwise. You can reach Joan at her new homepage at ASCII-ART.com. Text pictures are created by hand Concrete poetry is created with aide of typesetting and the early typewriter (also called "typography"). Typewriter art is first documented in 1898; becomes an art form. Radio teletype (RTTY) art is created using the Baudot 5-bit code. Paper-tape art and punch card art are created as early forms of 'computer' art. The ASCII code is created in the early 1960s and is standardized in 1968. Early ASCII art - the first years of the Internet, BBS, and underground ASCII /ANSI art "groups". Cousins of ASCII art -- ANSI art, America Online's "MACRO art", and mIRC pop-ups ASCII art today and in the future... Pictures as "Text" ASCII art and other "keyboard" art uses basic text characters to create a picture. Long ago, the written word did not consist of "text". Ironically, the first written documents consisted of pictures which represented ideas and objects-- not letters or text characters. Note the hieroglyphics on a tomb in the Valley of the Kings in Luxor, Egypt. Text as Pictures - Hand Drawn Over time, the written word developed into symbols which looked more like present-day text. The very first text art pictures were drawn by hand. Creative people used ornamental penmanship to create wondrously beautiful documents and pictures. The monastic monks created breath-taking manuscripts which incorporated letters of text into their art. However, there were few other pieces of art that were made from text characters. Illuminated Manuscript, Canterbury Cathedral Canterbury, England, UK ca. 1971-1996 An illuminated letter R legenda sanctorium at the beginning of an illuminated story of Saint Ipolitus from a manuscript at Canterbury Cathedral. Individuals continued creating text art images by hand. During the Korean War (circa 1950), a very talented Korean named 'Gwang Hyuk Lee' made a hand drawn text picture depicting Jesus. He used the entire text in the Bible's "Book of John" to create this multi-colored image. Rumor has it that he was killed by the North Korean communists for creating this 16" x 20" picture. This work of art is beautiful and created entirely by hand! It must've taken an incredibly long time to complete. (click image to enlarge) Gwang Hyuk Lee's hand drawn - "Book of John" - black & white image (click image to enlarge) Gwank Hyuk Lee's hand drawn "Book of John" - color image I don't have any further information about this example of hand drawn text art-- I've been told that a poster of this artwork used to be available but I don't know where it can be found. ( thank you Ennis Trimble for sending the images ) Shaped texts became popular as part of the concrete and visual poetry movement. French poet and surrealist, Guillaume Apollinaire (1880-1918), used the shaped text in his handwritten visual word poems. These visual word poems were given the term "calligrams" (1917). According to the Ruth and Marvin Sackner Archive of Concrete and Visual Poetry: "The calligrams of Apollinaire represent an important and original landmark in the history of visual and shaped poetry. These calligraphic poems may be considered as one of the precursors of modern concrete poetry." I will post an example of Apollinaire's calligram soon (when I find one). In the meantime, enjoy two hand-written visual poems created by my 8 year old son. They are entitled "Rainbow" and "Dimind" (Diamond). Text As Pictures - Typography People were relieved from writer's cramp once mechanical methods to create text were created. The Chinese are generally recognized as the first group of people to develop the stamp/ink printing process (2nd Century AD) and the movable-type printing process (11th Century AD). "It _is_ a long tail, certainly," said Alice, looking down with wonder at the Mouse's tail; "but why do you call it sad?" And she kept on puzzling about it while the Mouse was speaking, so that her idea of the tale was something like this:----"Fury said to a mouse, That he met in the house, `Let us both go to law: _I_ will prose- cute _you_.-- Come, I'll take no de- nial: We must have the trial; For really this morn- ing I've nothing to do.' Said the mouse to the cur, `Such a trial, dear sir. With no jury or judge, would be wast- ing our breath.' `I'll be judge, I'll be jury,' said cun- ning old Fury: `I'll try the whole cause, and con- demn you to death'." It wasn't until the year 1450 that Johannes Gutenberg (along with businessman, Johann Fust and calligrapher, Peter Schoeffer) invented the printing press in Germany. It was based on a wine-press design and could print about 300 pages a day. As a result, books were produced more quickly and for lower cost. The art of typography could begin! A nice example of typography is from the 1865 book, Alice in Wonderland, by Lewis Carroll (Charles Lutwidge Dodgson). The following tail of a mouse is from Chapter III, "A Caucus Race and a Long Tale": Alice in Wonderland was published a few years before the typewriter was invented. Therefore, it can be considered as one of the first printed text art creations. The Dolphins' Way, In Me Aspirations of the living sea The dolphins do move within me The aura of their soul, I feel deep down To be in the water and not on ground Sifting through the ocean, an expressing show Communi- cation of a song and a blow Pro- tecting even those not of their kind They ask nothing in return, they do not mind The most gracious and unselfish of all that wander I wish to swim with them, nothing could be fonder The dolphins mean so much to me, you see I need to thank them, for showing us how to be (Donovan 1997) Concrete poetry and typography continues today as evidenced by this modern 1997 example created by 'Donovan' (Xdragontail at sbcglobal dot net, ICQ#: 812836): Source: http://www.misslink.net/donovan/ Text As Pictures -- Typewriter To many people, Christopher Latham Sholes is considered to be the inventor of the modern typewriter. His first machine was completed in September of 1867. E. Remington & Sons manufactured the typewriter in 1874. The keyboard has changed many times but the basic characters remains. There is an extensive history to the evolution of the typewriter. Visit a very informative web site which identifies the history of the typewriter: http://home.earthlink.net/~dcrehr/. Typewriter-Related Links -history, keyboard, fonts, and more: http://xavier.xu.edu:8000/~polt/tw-links.html Since 1867, people have used the typewriter not only for printing manuscripts but creating works of art. In the 1890s, typewriter manufacturers and secretarial agencies organized public speed typing competitions. They also organized competitions for typewriter drawings. The earliest preserved example of typewriter art was made in 1898 by a woman named Flora Stacey. Not much is known about Flora Stacey except that she was probably a secretary. Her framed picture of a butterfly was published in the October 15th, 1898, edition of Pitman's Phonetic Journal. The entire rendering of this picture was created with the typewriter -- yes, even the butterfly! The butterfly is composed of brackets, hyphens, points, oblique strokes, a single asterisk, and several "o"s. The journal commented: "We think it will be generally admitted that the illustration is in the highest degree creditable to the artistic ability, skill and patience of the lady, and to the unique capabilities of the Bar-lock for this class of work. It may be noted that in competitions for typewriter drawings Miss Stacey has been extremely successful.... An outsider, or one unaccustomed to the use of the typewriter, can scarcely realise what an expenditure of time and patience is necessary in order to successfully execute one of these curious drawings. The paper has, of course, to be turned and re-turned, and twisted in a thousand different directions, and each character and letter must strike precisely in the right spot. Often, just as some particular sketch is on the point of completion, a trifling miscalculation, or the accidental depression of the wrong key, will totally ruin it, and the whole thing has to be done over again." This brief synopsis describes some of the negative and positive aspects of typewriter art. First of all, once a mistake is made, it generally cannot be corrected. There are no delete or overwrite keys on a typewriter. Secondly, the positioning of paper can be crucial. One slip and the typewritten picture may be ruined. There are a number of techniques available to the typewriter artist that are not available to the ASCII keyboard artist. A typewriter artist can manipulate the sheet of paper in various directions and angles. The characters can be spaced in any way -- often overstriking another character or "half-spacing" to achieve a special effect. Typewriter art offers more flexibility and variation than the computer ASCII art. However, ASCII art is much more forgiving. Typewriter art was a popular art medium in the 1950s to the 1970s. There are many wonderful examples of typewriter art found in Alan Riddell's book, Typewriter Art (London, 1975). Some of the images are colorized by using tinted ink ribbon. Several of the images are abstract. A few of the images are portraits (Queen Elizabeth, the Duke of Edinburgh, Gandhi, Winston Churchill, and Henri Chopin). All of the pictures are superb. There is a listing of over 60 typewriter artists who have contributed to this 100+ image collection, one of whom is Vaclav Havel, President of the Czech Republic. I found the Henri Chopin portrait most clever as the image was created using only the letters of his name "henri chopin". The background of this 1974 image repeatedly spells out "audiopoems". The text artist is Robert Morgan. He created the image as a design for the sleeve of Henri Chopin's record entitled "Audiopoems" -- Tangent Records. (anyone else remember records and record sleeves?) ( View the picture -- notice the overstriking technique that results in shading of the image -- Robert Morgan's "Henri Chopin" ) Another fine example of typewriter art was posted on USENET a few years back. A reader found an article in an unnamed magazine (1960) about a man named Guillermo Mendana Olivera. The article states that Mr. Olivera was a stenographer by day in Leon, Spain, and a keyboard artist by night. He used small o's and x's and periods, dashes, and commas to create his typewriter art masterpieces. And each picture took about 70 hours to complete! Incredible! .oOo. .oOo. .oOo. .oOo. .oOo. .oOo. .oOo. There are very few books about ASCII art. Most computer art text books deal with modern graphics and programming. Eventually I'd love to put together a publication of my ASCII art creations, information on the history of text art, and the "how-to create" guidelines for ASCII art. (Are there any publishers out there interested in such a project?) In the meantime, you're stuck reading my cyberspace meanderings. At right, you'll find a listing of typewriter art books that I've been able to identify. "Typewriter Art" by Dan Carlinsky (1978, Price Sloan Publishers),ISBN 0843104333 "Typewriter Art" edited by Alan Riddell (1975, London Magazine Editions),ISBN 0-900626-99-2(Thank you Andrew Belsey for finding this book and forwarding it to me!) "Art Typing" by Nathan Krevolin (1962, Fearon Pittman/MacMillan Publishers),ISBN 0028306104 "Book of Typewriter Art" by Bob Neill (1982, The Weavers Press),ISBN 0946017018 "Second Book of Typewriter Art" by Bob Neill (1984, The Weavers Press),ISBN 0946017026 XXXXXXXXXXXXXX XXXXX XXXXXXXXXXXXXXXX XXXXXXXXX XXXXXXXXXXXXXX XX XXXXXXXXXXX XXXXXXXXXXXXXX XX XXXXXXXXXXX XXXXXXXXXXXXXX XX XXXXXXXXX X X X XXXXX X XX XX X XXX X X X XX XX X XXX X X X X XXX X X XXXXXXXXXXXXXXXXXXXX X The book, "Art Typing", written by Nathan Krevolin, describes creating images-- mostly text and borders-- with typewriter characters. Many of the pictures are made entirely out of "X"s... For example: This is a house and a tree as illustrated in the 1962 book, "Art Typing" There is a section on how to make type-written reports, price lists, and menus, as well as how to make a card. (Perhaps a precursor to 'Print Shop'?) Some mention is made of half-spaces and tilting type paper to get a unique look-- neither of which apply to ASCII art. One page identifies 'cartooning' with keyboard characters-- this is the page which reminded me most of today's ASCII art... Here are two of the ten items pictured... * / HH SSSSSS SSSSSSSS S )))) S SS - - SS SSS o o SSS SSSS 6 SSSS SSS __ SSS SSS SSS W W WW WWW WWWW WWWW WWWWWWWWWW XXXXXXXXX XXXXXXXXXXXXX XXXXXXXXXXXXXXXX (__________)XXXXXX ( ___ ___ XXXXXX o/ o XXXXX ( / XXXXX /___) XXXXX ( XXXX ( ____ ) XXX ( XX ( ) X ( ) * ( ) *** * Two cartoon characters from the 1962 book, "Art Typing" Text as Pictures -- Teletype (RTTY) Similar text images were broadcast via Radio Teletype (RTTY). RTTY is a machine-to-machine method of communication which takes place over radio or telephone lines. Its purpose is not for text art transmissions, but for text communication between operators. The teletypewriter (or teleprinter) was invented in the early 1900s. The largest manufacturer of the teleprinter in the United States was the Teletype Corporation. The term "teletype" is used to refer to the teleprinter. However the word "teletype" is actually a trademark of the AT&T Teletype Corporation (much like how the word "xerox" took over the copying machine industry). The radio teleprinter became popular with the public after World War II when surplus teletype machines became available at a reasonable cost. These large machines provided a keyboard for input and a paper roll for printed output. Video monitors didn't become feasible until the mid-1970s. Even today, there are many active RTTY operators and clubs. RTTY operators (ham operators) have used various codes to transmit messages. These codes include BCD, EBCDIC, Morgan code, and Baudot code. However RTTY transmissions typically used the five-bit, 32 character Baudot code. Initially, RTTY did not use seven-bit ASCII (American Standard Code for Information Interchange). ASCII was not standardized until 1968. There are differences between Baudot and ASCII. Differences include bit-size and number of characters allowed. The Baudot code uses numbers, upper case letters, and some punctuation characters. It does not allow for lower case letters. The ASCII code uses upper and lower case letters, numbers, and more of the "standard" punctuation characters. There are, of course, other differences between the two codes. For a more technical explanation, visit George W. Henry Jr.'s web site. George Henry (K9GWT) has put together a paper which describes the differences between the two codes. It provides some definitions for RTTY terms and examines the various interfacing standards used with ASCII and Baudot terminals: E'''
