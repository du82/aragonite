title = "ANSI.SYS Documentation and Reference"
description = "ANSI.SYS Documentation and Reference, Escape Sequences, Control Characters and HTML Entity Reference. Written by Carsten Cumbrowski aka Roy/SAC in March 2014."
full_description = '''Back to ASCII Art Academy This reference documentation was written and published by Carsten Cumbrowski aka Roy/SAC in March 2014. Table of Contents ANSI Color Codes ANSI Escape Sequences (Brief) Set Display Attributes ANSI Escape Sequences Programming (Detailed) Cursor Commands Erase Commands Display Attribute and Mode Commands Keyboard Commands Notes Entering the {ESC} Character Enabling ANSI.SYS Using ANSI.SYS Escape Sequences ANSI.SYS Examples Batch File Command Prompt Text File Example ANSI.SYS Key and Extended Key Codes ANSI Colors mapped to HTML color codes etc. ASCII Standard Character Set ASCII Extended Character Sets Character Entities in HTML 4 Latin-1 Characters Mathematical, Greek and Symbolic Characters Special Characters ANSI Color Codes Pueblo/UE supports a wide range of ANSI color codes. This is a list of those codes currently supported by Pueblo/UE, together with which client version they were introduced in. If the version is shown as "--", then it was introduced in version 2.01 or earlier (exact information is not available). An ANSI code is sent by the world by sending an escape character (ESC, ASCII value 27) followed by the appropriate code sequence: Code: Client: Meaning: [0m -- reset; clears all colors and styles (to white on black) [1m -- bold on (see below) [3m -- italics on [4m -- underline on [7m 2.50 inverse on; reverses foreground & background colors [9m 2.50 strikethrough on [22m 2.50 bold off (see below) [23m 2.50 italics off [24m 2.50 underline off [27m 2.50 inverse off [29m 2.50 strikethrough off [30m -- set foreground color to black [31m -- set foreground color to red [32m -- set foreground color to green [33m -- set foreground color to yellow [34m -- set foreground color to blue [35m -- set foreground color to magenta (purple) [36m -- set foreground color to cyan [37m -- set foreground color to white [39m 2.53 set foreground color to default (white) [40m -- set background color to black [41m -- set background color to red [42m -- set background color to green [43m -- set background color to yellow [44m -- set background color to blue [45m -- set background color to magenta (purple) [46m -- set background color to cyan [47m -- set background color to white [49m 2.53 set background color to default (black) The bold codes have been given two different interpretations: In client version 2.01 and earlier, bold was interpreted as the physical bold style - equivalent to the HTML <b> tag. In addition, the code [2m was mistakenly interpreted as bold off and the correct code was not handled. In version 2.50 and later, bold is interpreted as 'high-intensity', which was the original ANSI definition. (High-intensity colors are brighter than low-intensity ones, which are the default.) If you want the bold font style, you will have to use the <b> tag instead. The incorrect [2m code for bold off is supported for backwards compatibility, along with the correct [22m code. In addition, the ASCII BEL character (value 7) is internally translated to the HTML sequence <img xch_alert>. This will cause an audible alert sound, if configured to do so in the Preferences. While this is not actually an ANSI code sequence, worlds usually group this with them. ANSI Escape Sequences (Brief) Wherever you see '#', that should be replaced by the appropriate number. ESC code sequence Function Cursor Controls: {ESC}[#;#H or{ESC}[#;#fMoves cusor to line #, column # {ESC}[#AMoves cursor up # lines {ESC}[#BMoves cursor down # lines {ESC}[#CMoves cursor forward # spaces {ESC}[#DMoves cursor back # spaces {ESC}[#;#RReports current cursor line & column {ESC}[sSaves cursor position for recall later {ESC}[uReturn to saved cursor position Erase Functions: {ESC}[0J or {ESC}[Jclear from cursor to end of screen {ESC}[1Jclear from cursor to beginning of the screen {ESC}[2JClear screen and home cursor (moves cursor to upper left) {ESC}[0K or {ESC}[KClear to end of line {ESC}[1Kclear from cursor to beginning of the line {ESC}[2Kclear entire line. Cursor position does not change Set Graphics Rendition: {ESC}[#;#;....;#m Set display attributes where # is 00 for normal display (or just 0) 01 for bold on (or just 1) 02 faint (or just 2) 03 standout (or just 3) 04 underline (or just 4) 05 blink on (or just 5) 07 reverse video on (or just 7) 08 nondisplayed (invisible) (or just 8) 22 normal 23 no-standout 24 no-underline 25 no-blink 27 no-reverse 30 black foreground 31 red foreground 32 green foreground 33 yellow foreground 34 blue foreground 35 magenta foreground 36 cyan foreground 37 white foreground 39 default foreground 40 black background 41 red background 42 green background 43 yellow background 44 blue background 45 magenta background 46 cyan background 47 white background 49 default background {ESC}[=#;7h or {ESC}[=h or {ESC}[=0h or {ESC}[?7h Put screen in indicated mode where # is 0 for 40 x 25 black & white 1 for 40 x 25 color 2 for 80 x 25 b&w 3 for 80 x 25 color 4 for 320 x 200 color graphics 5 for 320 x 200 b & w graphics 6 for 640 x 200 b & w graphics 7 to wrap at end of line {ESC}[=#;7l or {ESC}[=l or {ESC}[=0l or {ESC}[?7l Resets mode # set with above command Keyboard Reassignments: {ESC}[<row>A or {ESC}[#;#;...p or {ESC}["string"p or {ESC}[#;"string";#;#;"string";#p Keyboard reassignment. The first ASCII code defines which code is to be changed. The remaining codes define what it is to be changed to. E.g. Reassign the Q and q keys to the A and a keys (and vice versa). {ESC}[65;81pA becomes Q {ESC}[97;113pa becomes q {ESC}[81;65pQ becomes A {ESC}[113;97pq becomes a E.g. Reassign the F10 key to a DIR command. {ESC}[0;68;"dir";13p The 0;68 is the extended ASCII code for the F10 key and 13 is the ASCII code for a carriage return. Other function key codes: F1=59,F2=60,F3=61,F4=62,F5=63,F6=64,F7=65,F8=66,F9=67,F10=68 Set Display Attributes {ESC}[{attr1};...;{attrn}m Sets multiple display attribute settings. The following lists standard attributes: General Atributes ValueDescription 0Reset all attributes 1Bright 2Dim 4Underscore 5Blink 7Reverse 8Hidden Foreground Colours ValueDescription 30Black 31Red 32Green 33Yellow 34Blue 35Magenta 36Cyan 37White Background Colours ValueDescription 40Black 41Red 42Green 43Yellow 44Blue 45Magenta 46Cyan 47White ANSI Escape Sequences Programming (Detailed) Cursor Commands Cursor Up {ESC}[<row>A Moves the cursor up the specified number of rows without changing the column. <row> is a number from 1 through 24 that specifies how many rows the cursor is to be moved up. If you omit <row>, DOS moves the cursor up one row. Examples {ESC}[13A Move the cursor up 13 rows {ESC}[A Move the cursor up 1 row Cursor Down {ESC}[<row>B Moves the cursor down the specified number of rows without changing the column. <row> is a number from 1 through 24 that specifies how many rows the cursor is to be moved down. If you omit <row>, DOS moves the cursor down one row. Examples {ESC}[8B Move the cursor down eight rows. {ESC}[B Move the cursor down one row. Cursor Right {ESC}[<col>C Moves the cursor right the specified number of columns without changing the row. <col> is a number from 1 through 79 that specifies how many columns that cursor is to be moved right. If you omit <col>, DOS moves the cursor right one column. Examples {ESC}[40C Move the cursor right 40 columns. {ESC}[C Move the cursor right one column. Cursor Left {ESC}[<col>D Moves the cursor left the specified number of columns without changing the row. <col> is a number from 1 through 79 that specifies how many columns the cursor is to be moved left. If you omit <col>, DOS moves the cursor left one column. Examples {ESC}10[D Move the cursor left ten columns. {ESC}[D Move the cursor left one column. Move Cursor {ESC}[<row>;<col>H or {ESC}<row>;<col>f Moves the cursor to the specified row and column. <row> is a number from 1 through 25 that specifies the row to which the cursor is to be moved. If you omit <row>, DOS moves the cursor to row 1. To omit <row> but specify <col>, enter the semicolon to show the <row> is omitted. <col> is a number from 1 through 80 that specifies the column to which the cursor is to be moved. If you omit <col>, DOS moves the cursor to column 1. If you omit both <row> and <col>, DOS moves the cursor to the home position (row 1, column 1--the upper left corner of the screen). Examples {ESC}[;10H Move the cursor to column 10, row 1. {ESC}[H Move the cursor to row 1, column 1. Save Cursor Position {ESC}[s Stores the current row and column position of the cursor. You can move the cursor to this location with a Restore Cursor Position command. Examples {ESC}[s Save the current cursor position. Report Cursor Position {ESC}[6n Returns the current row and column position of the cursor in the form {ESC}[<row>;<col>R. <row> is a number from 1 through 25 that specifies the row where the cursor is located. <col> is a number from 1 through 80 that specifies the column where the cursor is located. Examples {ESC}[6n Report the current cursor position. Restore Cursor Position {ESC}[u Moves the cursor to the row and column position most recently saved with a Save Cursor Position command. Examples {ESC}[u Move the cursor the row and column last saved with a Save Cursor Position command. Erase Commands Erase Display {ESC}[0J or {ESC}[J Clear from Current Cursor Position to End-of-Screen {ESC}[1J Clear from Current Cursor Position to Beginning of the Screen. {ESC}[2J Erases the entire display (equivalent to the DOS Clear Screen or cls command). Examples {ESC}[2J Erase the screen. Erase Line {ESC}[0K or {ESC}[K Erases from the current cursor position through the end of the line that contains the cursor. {ESC}[1K Clear from Current Cursor Position to Beginning of the Current Line. {ESC}[2K Clear Entire Current Line. Current Cursor Position remains unchanged. Examples {ESC}[K Erase from the cursor to the end of the line. Display Attribute and Mode Commands Set Attribute {ESC}[<attr>m Turns on a characteristic or attribute of the display, such as high intensity, blink, or foreground and background color. <attr> specifies the display attribute to be turned on. More than one attribute can be specified by using a semicolon to separate the attribute numbers. <attr> can be any of the following: Text Attribute Value None 0 High Intensity (bold) 1 Underline (monochrome display only) 4 Blink 5 Reverse 7 Invisible 8 Color Attr. Foregr.Val. Backgr.Val. Black 30 40 Red 31 41 Green 32 42 Yellow 33 43 Blue 34 44 Magenta 35 45 Cyan 36 46 White 37 47 If you omit <attr>, all attributes are turned off (equivalent to specifying <attr> as 0). Examples {ESC}[1m High intensity. {ESC}[1;5m High intensity and blink. {ESC}[30;46m Black foreground, cyan background. {ESC}[m Turn off all attributes. {ESC}[0m Turn off all attributes. {ESC}[0;1;36m Turn off all attributes, then turn on high-intensity cyan foreground. Set Display Mode {ESC}[=<mode>h Sets the width and color capability of the display (generally equivalent to the DOS MODE command). This command can also be used to cause lines longer than 80 characters to be broken at the 80th character and continued on the next line, rather than truncated at the 80th column; this is called line wrap. It can be turned off with the Turn Off Line Wrap command. Note the equal sign (=) that precedes <mode>. <mode> specifies the display mode. It can be one of the following: Display ModeValue 40 columns by 25 rows, black and white 0 40 columns by 25 rows, color on 1 80 columns by 25 rows, black and white 2 80 columns by 25 rows, color on 3 320 by 200 graphics, color on 4 320 by 200 graphics, black and white 5 640 by 200 graphics, black and white 6 Turn on line wrap 7 Examples {ESC}[=1h Set the display to 40 by 25 color on. {ESC}[=7h Continued lines longer than 80 characters, don't truncate them. Turn Off Line Wrap {ESC}[=7lCauses lines longer than 80 characters to be truncated at the 80th character, rather than continued to the next line. Examples {ESC}[=7l Truncate lines longer than 80 characters. Keyboard Commands Define Key {ESC}[<key code>;<result>p Assigns one or more characters to be produced when you press a key. <key code> specifies the key to be defined. If the key is one of the standard ASCII characters, <key code> is a number from 1 through 127. If the key is a function key, keypad key, or a combination of the <Shift>, <Ctrl>, or <Alt> key and another key, <key code> is two numbers separated by a semicolon and can be found in the ANSI.SYS key code table. <result> is the character or characters to be produced when a key is pressed. It can be specified as an ASCII code, an ANSI.SYS key code, a string enclosed in quotation marks, or any combination of codes and strings separated by semicolons. To restore a key to its original meaning, enter a Define Key command that sets <result> equal to <key code>. Examples {ESC}[126;92p Redefine the tilde <~> key as a backslash <\>. {ESC}[126;126p Restore the tilde <~> key to its original meaning. {ESC}[0;112;"dir|sort";13p Redefine <Alt><F9> as a Directory command piped to a Sort command, followed by a Carriage Return. {ESC}[0;112;0;112p Restore <Alt><F9> to its original meaning. Notes Entering the {ESC} Character In DOS: Press and hold the <Alt> key, then type 27 on the keypad. In Windows: Press and hold the <Alt> key, then type 0027 on the keypad. Exceptions: Sometimes the above keystrokes do not work. Try one of the following methods: In MS-DOS EDITOR and QBASIC, type any one of these: <Ctrl>P, <Alt>027 <Ctrl>P, <Ctrl>[ <Ctrl>P, <Esc> In Microsoft WORD, use a macro: Sub AsciiEscChar() 'Insert ASCII Esc character. Selection.TypeText Chr(027) End Sub Save the file as "Text Only" or "MS-DOS Text". In Microsoft NOTEPAD and WORDPAD: Copy the {ESC} character from another text file and paste it into the document. Enabling ANSI.SYS Before using escape seqences, ANSI.SYS must be named as a device driver in the CONFIG system file. For Windows 95, Windows 98 and DOS: Create or edit the CONFIG.SYS file. (Found in the root directory.) Add the following line to the file: DEVICE=<path>\ANSI.SYS where <path> is the full path of the ANSI.SYS file. (Usually found in the WINDOWS directory.) Save CONFIG.SYS with the new line. Check that a copy of ANSI.SYS exists in the specified path location. Restart the computer to complete the change. For Windows NT, Windows 2000 and Windows XP: Create or edit the CONFIG.NT file. (Usually found in the WINNT\SYSTEM32 directory.) Add the following line to the file: DEVICE=%systemroot%\system32\ANSI.SYS Save CONFIG.NT with the new line. Check that a copy of ANSI.SYS exists in the specified path location. Restart the computer to complete the change. Restrictions: Windows NT does not support ANSI.SYS escape sequences in Win32 Console applications. The Windows 2000/NT Command Interpreter, CMD.EXE, does not support ANSI.SYS. Use COMMAND.COM instead. Using ANSI.SYS Escape Sequences Because ANSI.SYS commands control the console device, they must be typed at the keyboard or sent to the '''
