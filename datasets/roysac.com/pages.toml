["https://roysac.com/roy-tools/dedupe-files.html"]
title = "DeDupe Files Tool for Win32/64"
description = "DeDupe Files. Deal with duplicate files across sub-folders using hashes instead of just file name and/or change date etc. Tool has an interface version and a command line version as well."
full_description = '''I am collecting a lot of stuff, from scene graphics to old 8bit computer games. When I come across someones bulk unsorted collection for download somewhere, I download first and sort out stuff later. The first processing step is usually the determination: "Do I have it already?". Especially when it comes to images, if they were kept in the original format (typically .IFF/.LBM if created on the Commodore Amiga, or .LBM/.GIF/.PCX when created on old MS DOS PC's) deduping really works wonders here, if you not just want to find duplicates based on file name, but actual file content. I checked some other free tools that flew around, but most had either no command line option or did not provide the options that I wanted. So I started out to write my own. The first version was multi-tool combination of BATCH files, VBScript scripts and some command line tools for stuff like HASH calculations of files. This worked, but required some pre-configuring (in the batch files) and ran not very fast. It got the job done though, but something easier to use, on the fly, preferably executed via right click from the Windows Explorer context menu, was more desirable. The second installment was just a single VBSScript file, with interface option using HTML and Internet Explorer, bringing along a MD5 Hashtool with it, encoded in the script itself and created as file on the hard disk in the temp folder, every time the script was executed. This was much better and allowed already integration into the context menu of Windows Explorer. It was still not as fast as I would like, which had in part to do with the fact, that I always hashed every file in the directory (Primarily because the MD5 hash tool was only able to hash either a single file or a single directory with all files in it (no filters). This let to the third and current installment of the tool, re-written in VB.NET with build-in hash generation and the option to choose which algorithm to use (for speed or for accuracy), multi-threading and several other improvements, such as smart logic to determine which of two identical files should be flagged as the dupe and which one kept as the original. Include and Exclude filter options, processing of sub-directories and build-in mechanism to revert the result of a de-dupe process afterwards, if the results were undesirable and much more.'''
author = "Roy/SAC"
year_published = 2025
clearnet = "https://roysac.com/roy-tools/dedupe-files.html"
