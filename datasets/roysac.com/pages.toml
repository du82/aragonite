full_description = 'Page Information After I put up the galleries with some of the SAC Art did I say to myself "Why not put some great ANSI art by other artists up on the site as well?". So here I am, presenting to you some fine examples of ANSI text art created by artists from other art groups, such as ACiD, iCE, Black Maiden, Fuel, CIA and more. Included are a great number of extra large ANSI pieces that have more than 100 lines. None of the ANSI art was created by cheating, using the help of an image to ANSI/ASCII converter tool or anything like that. Each of them is authentic and was created by hand using tools like TheDraw, ACiDDraw or PabloDraw (all available at my download page). Show Gallery The ANSIs are rendered as PNG image. I used my Ansi Converter Tool for that and the result is as close as you can get it to how the ANSIs looked in MS DOS. A link to the original .ANS file is available for every ANSI in the detail overlay as well. But I switched the default view for the detail overlay to "Text Version". The Unicode HTML/CSS text versions were also created via my Ansi Converter Tool. Keep in mind that the pieces published in this gallery were not released into the public domain. The purpose of ASCII and ANSI art was the distribution, so it is not a problem to copy it and show it around, but you can not use it, change it for your own purposes without the permission of the individual artist. See also: ASCII Art Gallery - Various Artists or ANSI Animation Art Gallery and of course Roy/SAC ASCII Art Collection and Roy/SAC ANSI Art Collection Gallery After I put up the galleries with some of the SAC Art did I say to myself "Why not put some great ANSI art by other artists up on the site as well?". So here I am, presenting to you some fine examples of ANSI text art created by artists from other art groups, such as ACiD, iCE, Black Maiden, Fuel, CIA and more. Included are a great number of extra large ANSI pieces that have more than 100 lines. None of the ANSI art was created by cheating, using the help of an image to ANSI/ASCII converter tool or anything like that. Each of them is authentic and was created by hand using tools like TheDraw, ACiDDraw or PabloDraw (all available at my download page). Show Gallery The ANSIs are rendered as PNG image. I used my Ansi Converter Tool for that and the result is as close as you can get it to how the ANSIs looked in MS DOS. A link to the original .ANS file is available for every ANSI in the detail overlay as well. But I switched the default view for the detail overlay to "Text Version". The Unicode HTML/CSS text versions were also created via my Ansi Converter Tool. Keep in mind that the pieces published in this gallery were not released into the public domain. The purpose of ASCII and ANSI art was the distribution, so it is not a problem to copy it and show it around, but you can not use it, change it for your own purposes without the permission of the individual artist. See also: ASCII Art Gallery - Various Artists or ANSI Animation Art Gallery and of course Roy/SAC ASCII Art Collection and Roy/SAC ANSI Art Collection'
