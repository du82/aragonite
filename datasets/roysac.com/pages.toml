["https://roysac.com/learn/figfont-standard.html"]
title = "FIGFont Standard"
description = "FIGFont Standard"
full_description = '''Back to ASCII Art Academy Draft 2.0 Copyright 1996, 1997 by John Cowan and Paul Burton Portions Copyright 1991, 1993, 1994 by Glenn Chappell and Ian Chai May be freely copied and distributed. This is a copy of the FIGFont Standard Document. Source _____ ___ ____ __ _ | ___||_ _|/ ___| / _| ___ _ __ | |_ ___ _ | |_ | || | _ | |_ / _ \ | '_ \ | __|/ __|(_) | _| | || |_| || _|| (_) || | | || |_ \__ \ _ |_| |___|\____||_| \___/ |_| |_| \__||___/(_) _____ __ __ / ___/__ ___ / /____ ___ / /____ / /__/ _ \/ _ \/ __/ -_) _ \/ __(_-< \___/\___/_//_/\__/\__/_//_/\__/___/ Introduction Basic Definitions and Concepts "FIGfont" "FIGcharacters" and "Sub-characters" "FIGdriver" "FIGure" "FIG" "Layout Modes" "Smushing Rules" "Hardblanks" "Character Sets" and "Character Codes" Creating FIGfonts The Header Line Interpretation of Layout Parameters Setting Layout Parameters Step-by-Step FIGfont Comments FIGcharacter Data Basic Data Structure Required FIGcharacters Code Tagged FIGcharacters Notes - Avoiding Errors and General Advice Control Files Standard Format Extended Commands Standardized Capabilities of current and future FIGdrivers Chart of Capabilities of FIGlet 2.2 and FIGWin 1.0 Introduction This document specifies the format of font files, and the associated control files, used by the FIGlet and FIGWin programs (FIGdrivers). It is written for designers who wish to build fonts (FIGfonts) usable by either program, and also serves as a standard for development of future versions or similar FIGdrivers. Some features explained here are not supported by both programs. See separate documentation to learn how to use FIGlet or FIGWin. NOTE: FIGWin 1.0 is packaged with a program called FIGfont Editor for Windows 1.0, which is just that. It does not require a complete understanding of this document to create FIGfonts. However it is a good idea to become familiar with the "BASIC DEFINITIONS AND CONCEPTS" information before using it. If you design a FIGfont, please send an e-mail announcement to <figletfonts@onelist.com>, the FIGlet fonts mailing list, and email a copy to <ianchai@usa.net> for him to put it at the ftp site. Basic Definitions and Concepts "FIGfont" A FIGfont is a file which represents the graphical arrangement of characters representing larger characters. Since a FIGfont file is a text file, it can be created with any text editing program on any platform. The filename of a FIGfont file must end with ".flf", which stands for "FIGLettering Font". "FIGcharacters" and "Sub-characters" Because FIGfonts describe large characters which consist of smaller characters, confusion can result when descussing one or the other. Therefore, the terms "FIGcharacter" and "sub-character" are used, respectively. "FIGdriver" The term FIGdriver is used in this document to encompass FIGlet, FIGWin, and any future programs which use FIGfonts. "FIGure" A FIGure (thusly capitalized) is an image created by a FIGdriver. "FIG" A bit of history: In Spring 1991, inspired by the Email signature of a friend named Frank, and goaded on by Ian Chai, Glenn Chappell wrote a nifty little 170-line "C" program called "newban", which would create large letters out of ordinary text characters. At the time, it was only compiled for UNIX. In hindsight, we now call it "FIGlet 1.0". FIGlet stands for Frank, Ian, and Glenn's letters. In various incarnations, newban circulated around the net for a couple of years. It had one font, which included only lowercase letters. In early 1993, Ian decided newban was due for a few changes, so together Ian and Glenn added the full ASCII character set, to start with. First, though, Ian had to find a copy of the source, since Glenn had tossed it away as not worth the disk space. Ian and Glenn discussed what could be done with it, decided on a general re-write, and, 7 months later, ended up with 888 lines of code, 13 FIGfonts and documentation. This was FIGlet 2.0, the first real release. To their great surprise, FIGlet took the net by storm. They received floods of "FIGlet is great!" messages and a new contributed FIGfont about once a week. To handle all the traffic, Ian quickly set up a mailing list, Daniel Simmons kindly offered space for an FTP site, several people volunteered to port FIGlet to non-Unix operating systems, ...and bug reports poured in. Because of these, and the need to make FIGlet more "international", Ian and Glenn released a new version of FIGlet which could handle non-ASCII character sets and right-to-left printing. This was FIGlet 2.1, which, in a couple of weeks, became figlet 2.1.1. This weighed in at 1314 lines, and there were over 60 FIGfonts. By late 1996, FIGlet had quite a following of fans subscribing to its mailing list. It had been ported to MS-DOS, Macintosh, Amiga, Apple II GS, Atari ST, Acorn and OS/2. FIGlet had been further updated, and there were nearly 200 FIGfonts. John Cowan and Paul Burton are two FIGlet fans who decided to create new versions. While John wrote FIGlet version 2.2 using C, Paul wrote FIGWin 1.0, the first true GUI (Windows) implementation of FIGlet, using Visual Basic. John and Paul worked together to add new features to FIGfont files which could be read by both programs, and together wrote this document, which we hope helps to establish consistency in FIGfonts and help with the creation of future FIGdrivers. FIGlet 2.2 has about 4800 lines of code, of which over half is a support library for reading compressed files. FIGlet 2.2 and FIGWin 1.0 both allow greater flexibility by use of new information which can be contained in FIGfont files without interfering with the function of older FIGdrivers. NOTE: The Macintosh version of FIGlet is still command-line driven as of this writing, and a GUI version is very much in demand. The FIGlet C code is written to be easily plugged in to a GUI shell, so it will be a relatively easy task for a Macintosh developer. "Layout Modes" A FIGdriver may arrange FIGcharacters using one of three "layout modes", which define the spacing between FIGcharacters. The layout mode for the horizontal axis may differ from the layout mode for the vertical axis. A default choice is defined for each axis by every FIGfont. The three layout modes are: Full Size (Separately called "Full Width" or "Full Height".) Represents each FIGcharacter occupying the full width or height of its arrangement of sub-characters as designed. Fitting Only (Separately called "Kerning or "Vertical Fitting".) Moves FIGcharacters closer together until they touch. Typographers use the term "kerning" for this phenomenon when applied to the horizontal axis, but fitting also includes this as a vertical behavior, for which there is apparently no established typographical term. Smushing (Same term for both axes.) Moves FIGcharacters one step closer after they touch, so that they partially occupy the same space. A FIGdriver must decide what sub-character to display at each junction. There are two ways of making these decisions: by controlled smushing or by universal smushing. Controlled smushing uses a set of "smushing rules" selected by the designer of a FIGfont. (See "Smushing Rules" below.) Each rule is a comparison of the two sub-characters which must be joined to yield what to display at the junction. Controlled smushing will not always allow smushing to occur, because the compared sub-characters may not correspond to any active rule. Wherever smushing cannot occur, fitting occurs instead. Universal smushing simply overrides the sub-character from the earlier FIGcharacter with the sub-character from the later FIGcharacter. This produces an "overlapping" effect with some FIGfonts, wherin the latter FIGcharacter may appear to be "in front". A FIGfont which does not specify any smushing rules for a particular axis indicates that universal smushing is to occur when smushing is requested. Therefore, it is not possible for a FIGfont designer to "forbid" smushing. However there are ways to ensure that smushing does not cause a FIGfont to be illegible when smushed. This is especially important for smaller FIGfonts. (See "Hardblanks" for details.) For vertical fitting or smushing, entire lines of output FIGcharacters are "moved" as a unit. Not all FIGdrivers do vertical fitting or smushing. At present, FIGWin 1.0 does, but FIGlet 2.2 does not. Further, while FIGlet 2.2 allows the user to override the FIGfont designer's set of smushing rules, FIGWin 1.0 does not. NOTE: In the documentation of FIGlet versions prior to 2.2, the term "smushmode" was used to mean the layout mode, and this term further included the smushing rules (if any) to be applied. However, since the layout mode may or may not involve smushing, we are straying from the use of this somewhat misleading term. "Smushing Rules" Again, smushing rules are for controlled smushing. If none are defined to be active in a FIGfont, universal smushing occurs instead. Generally, if a FIGfont is "drawn at the borders" using sub-characters "-_|/\[]{}()<>", you will want to use controlled smushing by selecting from the rules below. Otherwise, if your FIGfont uses a lot of other sub-characters, do not select any rules and universal smushing will occur instead. (See "Hardblanks" below if your FIGfont is very small and would become illegible if smushed.) Experimentation is the best way to make these decisions. There are six possible horizontal smushing rules and five possible vertical smushing rules. Below is a description of all of the rules. NOTE: Ignore the "code values" for now. They are explained later. The Six Horizontal Smushing Rules Rule Name code value Description 1 EQUAL CHARACTER SMUSHING 1 Two sub-characters are smushed into a single sub-character if they are the same. This rule does not smush hardblanks. (See "Hardblanks" below.) 2 UNDERSCORE SMUSHING 2 An underscore ("_") will be replaced by any of: "|", "/", "\", "[", "]", "{", "}", "(", ")", "<" or ">". 3 HIERARCHY SMUSHING 4 A hierarchy of six classes is used: "|", "/\", "[]", "{}", "()", and "<>". When two smushing sub-characters are from different classes, the one from the latter class will be used. 4 OPPOSITE PAIR SMUSHING 8 Smushes opposing brackets ("[]" or "]["), braces ("{}" or "}{") and parentheses ("()" or ")(") together, replacing any such pair with a vertical bar ("|"). 5 BIG X SMUSHING 16 Smushes "/\" into "|", "\/" into "Y", and "><" into "X". Note that "<>" is not smushed in any way by this rule. The name "BIG X" is historical; originally all three pairs were smushed into "X". 6 HARDBLANK SMUSHING 32 Smushes two hardblanks together, replacing them with a single hardblank. (See "Hardblanks" below.) The Five Vertical Smushing Rules Rule Name code value Description 1 EQUAL CHARACTER SMUSHING 256 Same as horizontal smushing rule 1. 2 UNDERSCORE SMUSHING 512 Same as horizontal smushing rule 2. 3 HIERARCHY SMUSHING 1024 Same as horizontal smushing rule 3. 4 HORIZONTAL LINE SMUSHING 2048 Smushes stacked pairs of "-" and "_", replacing them with a single "=" sub-character. It does not matter which is found above the other. Note that vertical smushing rule 1 will smush IDENTICAL pairs of horizontal lines, while this rule smushes horizontal lines consisting of DIFFERENT sub-characters. 5 VERTICAL LINE SUPERSMUSHING 4096 This one rule is different from all others, in that it "supersmushes" vertical lines consisting of several vertical bars ("|"). This creates the illusion that FIGcharacters have slid vertically against each other. Supersmushing continues until any sub-characters other than "|" would have to be smushed. Supersmushing can produce impressive results, but it is seldom possible, since other sub-characters would usually have to be considered for smushing as soon as any such stacked vertical lines are encountered. "Hardblanks" A hardblank is a special sub-character which is displayed as a blank (space) in rendered FIGures, but is treated more like a "visible" sub-character when fitting or smushing horizontally. Therefore, hardblanks keep adjacent FIGcharacters a certain distance apart. NOTE: Hardblanks act the same as blanks for vertical operations. Hardblanks have three purposes: Hardblanks are used to create the blank (space) FIGcharacter. Usually the space FIGcharacter is simply one or two vertical columns of hardblanks. Some slanted FIGfonts as shown below have a diagonal arrangement of hardblanks instead. Hardblanks can prevent "unreasonable" fitting or smushing. Normally when fitting or smushing, the blank (space) sub-character is considered "vacant space". In the following example, a capital "C" FIGcharacter is smushed with a "minus" FIGcharacter. ______ ______ / ____/ / ____/ / / ____ >>-Becomes-> / / ____ / /___ /___/ / /__/___/ \____/ \____/ The FIGure above looks like a capital G. To prevent this, a FIGfont designer might place a hardblank in the center of the capital C. In the following example, the hardblank is represented as a "$": ______ ______ / ____/ / ____/ / / $ ____ >>-Becomes-> / / ____ / /___ /___/ / /___/___/ \____/ \____/ Using hardblanks in this manner ensures that FIGcharacters with a lot of empty space will not be unreasonably "invaded" by adjacent FIGcharacters. Generally, FIGcharacters such as capital C, L or T, or small punctuation marks such as commas, may contain hardblanks, since they may contain a lot of vacant space which is "accessible" from either side. Hardblanks can prevent smushing from making FIGfonts illegible. This legitimate purpose of hardblanks is often overused. If a FIGfont designer is absolutely sure that smushing "visible" sub-characters would make their FIGfont illegible, hardblanks may be positioned at the end of each row of sub-characters, against the visible sub-characters, creating a barrier. With older FIGdrivers, using hardblanks for this purpose meant that FIGcharacters would have to be separated by at least one blank in output FIGures, since only a hardblank could smush with another hardblank. However with the advent of universal smushing, this is no longer necessary. Hardblanks ARE overriden by any visible sub-character when performing universal smushing. Hardblanks still represent a "stopping point", but only AFTER their locations are occupied. NOTE: Earlier it was stated that universal smushing overrides the sub-character from the former FIGcharacter with the sub-character from the latter FIGcharacter. Hardblanks (and blanks or spaces) are the exception to this rule; they will always be overriden by visible sub-characters, regardless of which FIGcharacter contains the hardblank. This ensures that no visible sub-characters "disappear". Therefore, one can design a FIGfont with a default behavior of universal smushing, while the output FIGure would LOOK like the effect of fitting, or even full size if additional hardblanks are used. If a user "scales down" the layout mode to fitting, the result would look like "extra spacing" between FIGcharacters. Taking this concept further, a FIGcharacter may also include ex'''
