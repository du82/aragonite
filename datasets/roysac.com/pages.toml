["https://roysac.com/learn/pcasciiscenehistory.html"]
title = "History of the PC Ascii Scene"
description = "History of the PC Ascii Scene - As viewed by the eyes of one that lived it. Written by Necromancer on March 6, 1998"
full_description = '''Ascii Art as an idea coalesced into existence bceause people wanted more. They wanted more than just your standard Hercules display Atari or your Monochrome Commodore 64. To meet this demand, one singular artist, whose name is lost to the annals of history decided to take the plunge. Instead of text, he (or she) had the ingenuity to use the characters /, \, |, -, _ and whatever else came to mind to create words. An amazing idea. And a perfect one. People latched onto this. Anyone that could display text could display ascii art. It was fast, compact, independant of platform type, and one group in particular set their sights on it the most, the then-thriving Amiga scene. It was perfect for Bulletin Board Systems, text-based adventures, for anything they could think of. Perfect then, and to this day for file descriptions. While ascii dominated the Amiga scene, the PC scene was giving birth to an art medium of their own, ANSI. Colored blocks. Oh, the wonders. But there were people that weren't satisfied with ANSI, they had seen ascii art, and it had captivated their imaginations. Some people believe that demand creates supply, and because of this, ascii was tentatively introduced to the PC scene as an art form. Tinyz, a member of the Amiga scene warez group Katharsis, recognized the demand, and started in on the supply. A one-man art group was created by Tinyz, and this introduced what had long been Amiga-only art (and previously Commodore 64, but not to the extent of the Amiga scene) into the PC art scene. Katharsis!Ascii was implemented in March of 1994. Tinyz soon found kindred spirits, and more artists joined Katharsis!Ascii, now known as plain Katharsis, or KTS. Others tried to duplicate Tinyz and the way he brought ascii art to the scene, but to no avail. Tinyz was the first to establish a true ascii-only art group in the PC art scene. Previous to Tinyz, there were only a few ascii artists that were as known as Tinyz, one of those being Piromaniak of TRiBE.But no one had the grip on the proverbial ascii testicles in the PC scene that KTS!Ascii did. That is, until Remorse rose out of the dirt and mooned Katharsis with it's hairy collective buttocks.'''
author = "Roy/SAC"
