title = "FileType Detector"
description = "FileType Detector Tool by Roy/SAC - Tool that tries to determine the type of binary file based on defined binary signatures."
full_description = '''A free experimental tool that tries to determine the type of binary file based on defined binary signatures. Over 150 file types already defined out of the box and it's easy to extend it for additional file-types, if you want to. This little tool was Written in VBScript and source code is included for reuse or expansion. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. A tool that finds out what type of file it is, based on binary signatures. Adding the proper file extension to recognized files. The reason for writing such a tool was the lack of correct file extensions (or the lack of them alltogether) when the files came originally from a Commodore Amiga system. Any kind of image could be called ".image" or ".pic" without providing real clues about the actual format, like IFF or TIF etc. Definitions must be put into the "DEFS" sub folder and a text file with the extension .INI. The Definitions files have following structure.'''
