title = "Dynasty (DNS) - German PC Warez Release Group in the 1990s"
description = "A brief history of the creation of the PC release group Dynasty, crack intros, ASCII and Pixel art work and more."
full_description = '''Introduction Intros Design Votes ASCIIs ANSIs Pixel Art Media The Foundation of Dynasty In April 1996, the PC section of the release group Dytec (Dynamic Technologies) merged with two of its competing German release groups Vortex and Empire of Darkness (EOD) to form the new "mega" warez release group called "Dynasty". Here is the background story: At the end of 1995 and early 1996 dupe releases became a major issue in the German warez scene, due to the high phone costs that caused the shift of when most trading across boards in Germany occurred to the ungodly hours between 2:00 am and 5:00 am, when phone fees were at its lowest. The major players in the German games release scene were shattered all over Germany, with Dytec in Berlin, Vortex in the Ruhr area around Essen; Backlash around Hannover and Empire of Darkness in the southern part of Germany near Stuttgart. That two or more groups released the same game during the day or evening was not realized before 2:00 am when the cross country trading started. The leader of Vortex, Menion Leah (then calling himself "Maverick") contacted me (Roy) in early 1996 to discuss the issue. We talked about each groups strengths and weaknesses. Vortex had slightly faster suppliers, but no good crackers. Dytec had some of the best in whole Germany. We teamed up for some trials, where Vortex supplied an original for Dytec to release and Dytec cracked a game for Vortex to release. Those tests worked very well and talks about a possible merger started. Then we thought about an even larger merger. Menion and Vortex had good contact with EOD, to whom Dytec had no contact at all. However, Dytec, specifically me and a long time board and sysop of a Dytec HQ had very good contact to Backlash. My Board was a Backlash site, even while it was Dytec PC WHQ and I knew several of the BLH guys personally and even partied with them (hard). A mega-merger was on the horizon: Backlash-Dytec-EOD-Vortex, but Backlash backed out, because they refused to merge together with the EOD folks for several reasons. The decision was made to move ahead with the merger at the end of March 1996, even with Backlash dropped out of it. Dynasty was born. The leaders of each founding group became the senior staff of the new found Dynasty (Main: Menion Leah/Vortex, The Syndicate/EOD, Roy/Dytec; also Snoop-Maverick/EOD, Fatman/Dytec, Maxiline/Vortex.) The WHQ problem was solved intelligently by not making any board to the WHQ, but the three former WHQ's of the individual groups to HQ's and former HQ's to basic Distro. Sites. The HQs were CLOSED SOCIETY (my BBS), CODE RED by Snoop-Maverick and CRYPTIC SLAUGHTER by Maverick (later Menion Leah). Backlash was the only serious competition for Dynasty. The relationship between the two rivals were mixed. While my BBS remained a Backlash site and I continued to consider several of the Backlash senior staff to be my friends, some ugly flaming occurred, especially between Backlash and former members of EOD on the Dynasty side. Dytec Amiga and C64 continued to exist. One the First Releases was the German game "Siedler 2" by Bluebyte on April 19, 1996. There were releases before that, for example the tool "PV V2.60, GERMAN AND ENGLISH" on April 16, 1996. EOD used to release crap like that before under their name too but Maverick and I quickly talked to the EOD folks and convinced them that releasing such stuff under the new label will only hurt the reputation of the group and won't help it to win any prizes. I am not sure if there was a release before that or not. I am still looking and trying to find out. Dynasty PC Crack Intros & Installers Dynasty NFO & FILE_ID.DIZ ASCII Art Why a Vote For a NFO Design? Voting Results Dynasty NFO & FILE_ID.DIZ ASCII Art Here are some examples of Dynasty ASCII art for the PC which was actually used for releases. There exist of course more FILE_ID.DIZ and NFO file designs than the ones shown here. In April 1996 were 18 different FILE_ID.diz ASCII designs by Me and Dark Star/SAC and 4 NFO File logo designs also by me and The Syndicate (from EOD) made available in the members only sections on the Head Quarters of the newly formed mega-group for German games warez releases that members who wanted to could cast their vote, which of the designs they preferred. On April 28, 1996 the time was up and the votes were counted. It is funny that of all things, I still have the voting details down to the individual votes. It must have been on the second PC of mine, which was not used for the BBS and the only machine (and hard drive) that I got back from the cops a couple weeks after I was busted and all Computer equipment at my place was seized. That PC was next to the original packaged software (like the OS and BBS software my pirate BBS was running on) the only stuff that I did get back. The text files with the voting details must have been on my hard drive. :). Why a Vote For a NFO Design? Also curious is the fact itself that such a vote occurred in the first place. I had never done that before or after. The reason for this was very simple. Several members of the new group were ASCII artists, including 2 of the founding leaders. I was one of the two. The other one was The Syndicate from EOD. But there were 2 more arists, "DA CONSPIRACY", also known as "Dark Star" or "Puschel" and the SAC co-founder "Hetero". It happened to be the case that The Syndicate and I had already created ASCII art for the new group and what started to happen was that different NFO file designs for the DYNASTY.NFO file were used depending on who packaged the release. If a release came from the former EOD part in Southern Germany, an NFO design with a logo created by The Syndicate was often used, while folks from the former Vortex and my group Dytec used either an NFO file design that I created or the one from The Syndicate. The Installer for one of the earliest Dynasty releases from April 19, 1996 for example features an NFO file with one of my logo designs. Other releases from the same month used the NFO file design NO.4 by The Syndicate. That was not good, especially for a young group that was just recently put together by three previously independent and actively competing release groups. If we would continue to put out releases where everybody could make an educated guess, from which of the former groups the original software came from or was packaged by just looking at the NFO file design, the unity of the group would be most likely very short lived. It was realized that a decision had to be made and a unified design used for everything officially released by Dynasty to act as one entity and not a lose band of a bunch of barbarian German tribes. A decision from the top down could not be made, without potentially hurt some feelings and/or egos. In construct of THREE, a decision could have been forced the hard way, by having the third group (in this instance the former Vortex posse) make a decision and take sides. This also had the potential for disaster in the future, so it was decided to go about the problem in an untypical manner and have any member, sysop or leader of the group, regardless, if he came from Dytec, Vortex or Empire of Darkness cast his personal vote about which NFO file as well as FILE_ID.diz he was favoring. Less than 50% of everybody who could have made a vote actually did so, but it was kept open for everybody who wanted to. 15 of about 35 eligble members did so and the result had to be accepted by everybody without the ability to blame somebody or to start developing a grudge or mistrust. Interesting is the fact that my second NFO file design got the most votes, although my first one was actually the only one that was used so far and the file_id.diz design by Dark Star aka Da Conspiracy was the one with the most favorable votes. The results are shown at the end of the gallery, the final NFO file and FILE_ID design that was used for every Dynasty release from that day on forward. Regarding the publising of the actual votes further down below. I am sure that non of the former Dynasty members mind that I post their individual votes publicly here. Those votes were not made in a "private" voting setting anyway and sent out to all group members as information and for double checking/verification, if wanted. I thought it to be an interesting little fact from history where I happen to have all parts and pieces to it. Voting Results Here are the results: 4/28/1996 Vote results for the final NFO and DIZ designs ----------------------- # of votes: 15 results total: FILE_ID.DIZ ----------------------- 01: 8 09: 1 11: 1 14: 1 17: 3 18: 1 NFO FILE LOGO ----------------------- 02: 2 03: 7 04: 6 Individual Votes ----------------------- USER: ROY NFO : 3 DIZ : 11 USER: MAVERICK NFO : 3 DIZ : 1 USER: MOZART! NFO : 4 DIZ : 17 USER: THE SYNDICATE NFO : 4 DIZ : 1 USER: SNOOP NFO : 4 DIZ : 17 USER: MAVERICK(EOD) NFO : 4 DIZ : 1 USER: DA CONSPIRACY NFO : 3 DIZ : 1 USER: THUNDER! NFO : 4 DIZ : 14 USER: SPOON NFO : 3 DIZ : 9 USER: FAZER NFO : 3 DIZ : 1 USER: ULTIMATE NFO : 4 DIZ : 17 USER: JOHNNY CYBERPUNK NFO : 2 DIZ : 1 USER: BACCHUS NFO : 2 DIZ : 1 USER: JORUUS C'BAOTH NFO : 3 DIZ : 18 USER: MAXILINE NFO : 3 DIZ : 1 FILE_ID.DIZ Designs NFO-File LOGO Designs Final Designs FILE_ID.DIZ Designs The German text above the collection of designs is the original text that I included with the voting sheet and basically states that everybody of the group who wants to can send me (ROY) an email in the format "I like file_ID design no. X the best" and that I will collect all the votes and publish later that month. –––––––––––––––––––––––––––––––––––––––––––––––––––––– DYNASTY file_id's .... schreibt ne mail an Roy in der Form: "Hey Roy , finde von den file_ids No.X am besten" hehe naja so ungefähr... Die Votes werden dann gesammelt und das Ergebnis am Ende bekannt gegeben... ––––––––––––––––––––––––––––––––––––––––––––––––––––– FILE_ID.DIZ ASCII Design no.1 ▀▀ ▀▀▀█▄