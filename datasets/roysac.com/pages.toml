full_description = "This font tool allows easy and quick conversion of bitmap representations of those fonts to a re-usable and generally compatible format to be used by programmers. It also has a preview feature to look at already converted .FNT files that you might get or download somewhere else. With Version 1.1 is also included a new .FNT file editor to create new or modify existing fonts as needed. With Version 1.2 font files without a header that contains the character width/height and count information are supported for previewing and editing. With Version 1.3 the Font Editor was enhanced. The Control sizing for smaller screen resolutions in particular. When you load a font into the editor, font properties like character size are now displayed. As real new feature was introduced the ability to copy the layout of a character and paste it into a new one. The content of the current clipboard is shown as mini preview also that you always know, what you are going to paste. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. The .FNT file format allows for space efficient and relatively simple storrage of monochrome (black/white) bitmap font information for the use in any kind of tool that need to emulate a specifc and non-standard character set, such as the display of ANSI and ASCII text art from old MS DOS PC's or Commodore Amiga systems or PETSCII and ATASCII art from the Commodore 64 and Atari 800 8 Bit home computers."
