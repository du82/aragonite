["https://roysac.com/demo-or-die.html"]
title = "Demo or Die! by Dave Green"
description = "You're a teen hacker, you want to impress, you demo code."
full_description = '''Jonny looks around, confused, his train of thought disrupted. He collects himself and stares at the teacher with a steady eye. "I want to code demos," he says, his words becoming stronger and more confident as he speaks. "I want to write something that will change people's perception of reality. I want them to walk away from the computer dazed, unsure of their footing and eyesight. I want to write something that will reach out of the screen and grab them, make their heartbeats and breathing slow to almost a halt. I want to write something they are reluctant to leave, knowing that nothing they experience that day will be quite as real, as insightful, as good. I want to write demos." Silence. The class and the teacher stare at Jonny, stunned. It is the teacher's turn to be confused. Jonny blushes, feeling that something more is required. "Either that or I want to be a fireman." - from PC Demos Explained, on the Web at http://www.mcs.net/~trixter/html/demos.html . It's not a true story, but it sums up the demo coding ethos just fine. If you're young, like computers, and have plenty of free time, there are three main ways to impress your peers. You can hack into other people's systems, you can crack the copy protection on games software, or you can code demos. Years ago, young people used the term demo as shorthand for a political march or rally. Now, to thousands of computer-obsessed kids across Europe (and a growing number in the US), it's more likely to mean a short, self-contained graphics-and-sound demonstration program. But it isn't a demonstration of a game or business application, and it hasn't been commissioned for any ulterior commercial purpose. The only thing it demonstrates are the skills of its programmer - or, more often, the skills of a group of coders, graphic artists, and musicians who've grouped together. And the only reason it has been written is to show off. Demos are the last bastion of passionate, crazed, enthusiast-only programming, crafted purely for the hell of it by inspired teenagers working entirely in their spare time. The teens create jaw-dropping audiovisual effects beyond the dreams of most multimedia designers. Constantly striving to better their rivals, devotees of the demo scene cram spectacular three- or four-minute presentations onto a single 800-Kbyte floppy disk, fitting them into tiny amounts of memory. Freely spread by disk-swapping over bulletin boards and other sites on the Internet, then replayed on home computers all over the planet, each demo becomes a piece of digital graffiti, proclaiming the superiority of the gang that created it. Demos are made by the rock-and-roll groups of code.'''
author = "Dave Green"
year_published = 2025
clearnet = "https://roysac.com/demo-or-die.html"
