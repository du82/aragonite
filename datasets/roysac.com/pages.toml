["https://roysac.com/dtc-intros.html"]
title = "Dytec - Dynamic Technologies History, Memberlist and Cracktros"
description = "A brief history of the warez release group Dynamic Technologies (Dytec), which was active on the Commodore 64, Amiga and PC. Also included is a collection of crack intros from all three platforms."
full_description = '''Introduction History Members ASCIIs C64-Intros AMIGA-Intros PC-Intros Media This page is still being updated, so bear with me. It shows all Dytec - Dynamic Technologies Intros, Cracktros, BBStros, Dentros and Demos for the Commodore 64, Commodore Amiga and MS DOS PC that I could find. The productions are shown as video capture that you can view them right from the web site without the need to fire up an emulator or the real deal. However, if you would like to have the original executables for the C64, Amiga and MS DOS PC, check out the Dytec Media Collection pack further down below. You can also find a brief history of the group, a somewhat complete alltime member list (all platforms) and ASCII artwork used mainly by Dytec PC for its releases, such as NFO files and File_ID.DIZ text files. This page might be the closest thing to a "home page" for the group, since nobody (including myself) bothered to register a domain for the group, while it was still available. However, I won't claim the status official home page of Dytec, unless I hear from Fatman that he is okay with it (if he comes out of the hole where he seems to be hiding currently ;) ). Somebody recently started a Dytec Facebook group in an attempt to reunite as many former Dytec Members as possible. Enjoy!Carsten Cumbrowski aka Roy/SACFormer Dytec PC Senior Member This page is based on my 2 previous blog posts Dynamic Technologies - Dytec - The Cracktros & Dynamic Technologies - Dytec - Introduction Continued. A Brief Introduction to the World of Dytec Cracktros (Video) Backup Link to Video at Vimeo.com Video Note: This is a nice little introduction to the world of Dynamic Technologies, although it came a bit of age already itself. I found a bunch more Commodore Amiga intros, cracktros and additional Dytec logos since I created this video. You can find the intros featured in this video plus the ones that are missing further down below and in full length. I also created in April 2010 a little tribute demo with Oldskool Demomaker for Windows 32bit. I called it appropriately "Dynamic Technologies" hehe. Dytec Media Collection Pack The NEW - DTC - Dytec, Dynamic Technologies Group Media Collection. Included in this collection are: 37 Dytec Commodore 64 Intros 18 Dytec Commodore Amiga Intros 7 Dytec PC MS DOS PC Intros 21 Tracker Music files from DTC Amiga and PC Prods. 59 Images, Pixel Artwork, like Logos 6 files of Text Art Work, like NFOs and FILE_ID.DIZ Designs. All of it produced and used by the warez release group DTC - Dytec from Germany since 1990 across 3 computer platforms. Also part of the package release is a Win32 remake of an old Dytec PC MS DOS Cracktro that I created using Oldskool Demomaker (RoySAC.EXE) Roy-DTCMediaColV1.ZIP release package is available for download at my Mediafire.com file share account. Roy_DTCMediaColV1.ZIP - Download the Dytec Media Collection V1.0 (4.75 MB ZIP) Dytec History From my point of view. 1989 Dytec is founded in East Berlin on the Commodore 64 as the consequence of a merge of the existing C64 groups Hotware, The HHMC and previously independent sceners. Founding members were SSC, Sgt. Pepper, Blade (at that time known as "Blackbert"), R2D2 (known as "A.C.E." in 1989), Syntax Terror, Zaphod and "Tom". 1990 Fatman joins the group and eventually takes over as defacto leader (but not official) and organizer of all sections of Dytec. He was basically holding things together and his place used to be the meeting place once a week on mondays before the so-called and (in)famous "Montagstreffen" (Monday Meet-up), which is being held Mondays in Berlin/Germany to this date* (*with the last 20 years of it or so at the same Chinese restaurant("Ming Dynasty"), which changed locations once and the location of the "Montagstreffen" with it, located today at the southern end of the "Jannowitzbruecke" (Jannowitz-Bridge)). So, if you happen to be in Berlin on a Monday evening around 7-10 PM, you might want to stop by and say hi. 1992 Amiga Section was started 1992/1993 Dytec PC Section Started, then merged into TRSI/DRG, which then became TRSI/Faith 1995 TRSI PC dissolves; several TRSI members join Genesis (formerly known as Pentagram). Assault becomes the Utility/Apps division of GNS, Dytec re-emerges as German games division; TDU-Jam is the English CD-Rip division (a German Games CD-Rip division also emerged, but I forgot the name of it). Genesis dies out naturally, since less and less games are being released on floppy disks anymore. Long distance calling across the Atlantic becomes a bigger issue, at the same time ISDN starts to dominate communication at least in Germany. All this causes a natural separation of the TDU-Jam and Dytec divisions, which eventually operate virtually entirely independent from each other. The friendship remained, but you could not speak of "one and unified" entity or group anymore. 1996 TRSI got revived, which is also rooted in Germany. Dytec became for a brief period of time what DRG and then Faith used to be, the German games release division of TRSI. (PC TRSI/DTC (Feb)) This period was only very short lived though and Dytec was once more on its own. April 1996 Dytec PC Merge with Vortex and Empire of Darkness to form the new Group Dynasty. The Background Story: Dupes became a major issue, due to the high phone costs that caused the shift of when most trading across boards in Germany occurred to the ungodly hours between 2:00 am and 5:00 am, when phone fees were at its lowest. The major players in the German games release scenes were shattered all over Germany, with Dytec in Berlin, Vortex in the Ruhr area around Essen; Backlash around Hannover and Empire of Darkness in the southern part of Germany. That two or more groups released the same game during the day or evening was not realized before 2:00 am when the cross country trading started. The leader of Vortex, Menion Leah (then calling himself "Maverick") contacted me to discuss the issue. We talked about each groups strengths and weaknesses. Vortex had slightly faster suppliers, but no good crackers. Dytec had some of the best in whole Germany. We teamed up for some trials, where Vortex supplied an original for Dytec to release and Dytec cracked a game for Vortex to release. Those tests worked very well and talks about a possible merger started. Then we thought about an even larger merger. Menion and Vortex had good contact with EOD, to whom Dytec had no contact at all. However, Dytec, specifically me and a long time board and sysop of a Dytec HQ had very good contact to Backlash. My Board was a Backlash site, even while it was Dytec PC WHQ and I knew several of the BLH guys personally and even partied with them (hard). A mega-merger was on the horizon: Backlash-Dytec-EOD-Vortex, but Backlash backed out, because they refused to merge together with the EOD folks for several reasons. The decision was made to move ahead with the merger at the end of March 1996, even with Backlash dropped out of it. Dynasty was born. The leaders of each founding group became the senior staff of the new found Dynasty (Main: Menion Leah/Vortex, The Syndicate/EOD, Roy/Dytec; also Snoop-Maverick/EOD, Fatman/Dytec, Maxiline/Vortex.) The WHQ problem was solved intelligently by not making any board to the WHQ, but the three former WHQ's of the individual groups to HQ's and former HQ's to basic Distro. Sites. The HQs were CLOSED SOCIETY (my BBS), CODE RED by Snoop-Maverick and CRYPTIC SLAUGHTER by Maverick (later Menion Leah). Backlash was the only serious competition for Dynasty. The relationship between the two rivals were mixed. While my BBS remained a Backlash site and I continued to consider several of the Backlash senior staff to be my friends, some ugly flaming occurred, especially between Backlash and former members of EOD on the Dynasty side. Dytec Amiga and C64 continued to exist. 1999 Dytec PC re-emerged (separated from Dynasty), initiated by The Driver & Shanon. I was retired from the Warez-Scene (I was busted in 1997), but disapproved of this separation/re-launch, but the original founder and highest instance in this matter, Fatman, who was by then also retired, gave his blessings. This revival attempt was short lived though. Why, I don't know, because I was leaving Germany at that time and moved first to Switzerland (in 1999) and then to the United States in May 2000. Dytec Revival Controversy (1999) The Driver revived the group in 1999 when I was retired. I did not approve of this and stated this to folks who contacted me regarding this. As a response, The Driver contacted me as well and released the following statement (in German language). Notes: Ich denke es an der Zeit einige Dinge klar zu stellen, da die letzten Releases von Dytec doch einige Verwirrung gestiftet haben, vor allem seitens Dynasty. Dytec'1999 wurde neu eroeffnet von THE DRIVER und SHANON, zwei oldskool Dytec Membern (Dytec C64, Dytec AMIGA und Dytec PC). Da Dytec PC im Jahre 1997 zusammen mit VORTEX und EOD zu Dynasty gemerged sind, wunderte sich natuerlich vor allem der Dynasty Staff, wie so etwas ueberhaupt moeglich ist. Die Sache ist ganz einfach. Vom ehemaligem DYTEC ist praktisch kein einziger Member mehr in Dynasty. Fatman ist komplett retired und Roy hat seine Warez Aktivitaeten eingestellt, um seinen Ambiitionen in Sachen ART Rechnung zu tragen (Stichwort SAC). Aus diesem Grunde habe ich beschlossen Dytec PC wieder aufleben zu lassen. Mit Dynasty hatte ich nichts am Hut und ich bin auch nicht bereit, meine Energie und Kraft fuer eine Group zu verschwenden, mit der ich mich nicht identifizieren kann. Solch eine Neugruendung kann natuerlich nicht von statten gehen, ohne mit dem alten Leading Staff Ruecksprache zu halten. Leading Staff von Dytec (C64, AMIGA und PC) war und ist (und wird wohl auch fuer immer bleiben) Fatman. Er gab mir sein OKAY die Group wieder aufzumachen und somit offiziell von Dynasty zu loesen. Roy ist ueberhaupt nicht einverstanden damit und rief mich deshalb auch voice an. Roy war zwar zum Zeitpunkt des Merges zu Dynasty, zusammen mit Fatman, der Leader von Dytec PC, aber er kann keine Einsprueche auf die Group geltend machen, da er hinsichtlich der Geschichte von Dytec ehrer eine unter- geordnete Rolle spielte (verglichen mit Fatman). Dytec wird versuchen an den alten Ruhm anzuknuepfen, auch um wieder ein wenig Schwung in die Scene zu bekommen. Wir werden wohl Fehler machen, aber wer hat das nicht. Eine gute Group entsteht nicht von heut auf morgen und Dytec hat praktisch wieder von NULL an begonnen. Ich hoffe, dass nun alle Missverstaendnisse beseitigt sind. Bei Rueckfragen weise ich auf die unten stehende EMail Adresse hin. - THE DRIVER - The issue was eventually resolved. The Driver acknowledged that the revival of Dytec at that point in time conflicted with the fact that Dytec was still officially merged with Vortex and EOD to Dynasty, which was still active and operating. In order to legitimize it, it would have been necessary that Dytec resolved officially this union to operate on its own and independently. Nobody would have had a gain if that happened, so The Driver decided to start up an entirely new group with the name "Notorious" (NTS), where I created the new ASCII art to be used in the release NFOs and file_id's and that was the end of this story. Dynamic Technologies All Time Member List Platforms HandleFunctionNotesC64AmigaPC A.C.E.cracker1990-92 Acromancercoder Amblingraphics Bacchussysop Beakerswapper Blade (Blackbert)cracker BOcracker Brainbox Brockhaus Cavemanswapper Christosysop/courier Cruxgraphics Chrysagoncrackersince 1995 Codaswapper Crebsupplier/swapper1994-96 Datacoder Datacrime Deathwalkersysop Directcoder Dodgercracker/coder/graphics Donsupplier Dr.Crimesysop of whqdied in 2000 Dragnetsysop Ecsicgraphics/swapper Elvinsysop Faithhealer FanFansysop Fatmanleader/swapper FCCcracker Fuzzigraphics Graincoder Grizzly Hardsequencergraphics Heterocoder/graphics Hitmanswapper Hosotcoder Iceman Jancourier Jivecoder Johnny Cyperpunkcracker LBM (Little Big Man)coder/cracker/graphics MACcracker Madmax Magnumgraphics Mainman Mavericksysop/courier/supplier Monkgraphics Oliver Stoned One Dollarswapper Onyxcracker Oriongraphics Palladinsysop Pasocoder/music Peppercracker Pittymusic Protoncoder/cracker/graphics R2-D2 (A.C.E.)cracker/music Ramirez Roachcourier Roostergraphics Royleader/sysop/graphics Sanitysupport Sgt. Peppercoder/cracker Shamenswapper Shanonswapper Sharp Slashsysop Spoonmusic SSCcoder/cracker Stereosupport Stonesupplier/swapper Syntax Terrorcoder/cracker The Clan The DriverSupplier The Ignorancesupplier/cracker The Outlawscourier T.E.A.cracker Ticcoder/cracker TLT Tom Tridigrapics Tubecracker Tunercoder Turner Twin!coder/cracker VFast Vincemusic Vipergraphics Wine Xelacracker Xerxescourier Zaphodcracker/coder/musician Zappcoder Total: 93 Dytec Amiga Intros Dytec C64 Intros Dytec PC Intros Dytec NFO & FILE_ID.DIZ ASCII Art Here are some examples of Dynamic Technologies ASCII art for the PC mainly, but also some for the Commodore Amiga, which was actually used for releases. There exist of course more FILE_ID.DIZ and NFO file designs than the ones shown here. File_IDs for Dytec Amiga created by Skin! __ /\___ ___/\____/\ /\_____ /\_____ /_// _ \/ / ___ \/ ____// / / / /\_ /SK/ / _/__/ /__/ / / / / / / / / / /__ \___/\/\ __/ \__/\ __/\/\______//_/ –=========\/===========\/=PRESENTS:===– _______ ________________/\_______ ______ \_____ \/\/ / / _____// \____/\/_____/\ |/ / /___ // /\__/ ___// /____\/ /_____ //_____ /_ // /:/_____ /_____ /\:| \_____\/\_____\/\_\/ /::\_____\/\_____\/ /:| |Sk!n::\/::::::\/::\/::::::::::\/::::::\/::| |::::::::::::!BringS:To:YoU!:::::::::::::::| _____/\__/\ _____ _______ ____ __________ \ \/ / / __/ \ / _\__\ .\__ \ _/\\ \/ __)___\ \__/_ \ \ \\\. \ \. \. \. \ \ \_____ / \\ ___\ \_____\\ _______\_______\ \/ \/..PrEsEnts:.\/ [Sk!n] File_IDs for Dytec Amiga created by Amblin _________ ___ ___ .______________ ______