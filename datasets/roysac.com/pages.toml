["https://roysac.com/roy-tools/vbs-asp-syntaxcheck.html"]
title = "VBScript & Classic ASP Syntax Checker"
description = "A command line syntax checker tool for VBScript and Classic ASP files based on the Syntax Check of the Windows Script Host (Wscript.exe)"
full_description = '''If you write VBScript script tools or classic ASP web code then you probably know about the problem that you cannot really do a syntax check before you actually execute the code. I have not found an editor who helps you with this problem. Even MS Visual Studio isnt' helping you in this, they even discontinued the support of VBScript since Visual Studio 2008 altogether. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. This is an experimental tool to perform a basic syntax check on VBScripts or classic ASP (Active Server Pages) source code files. It even recognizes to some extend ASP include files and VBScript includes, if you use a "function" or "sub" titled "include" and call it via Include "path\filename.vbs" to read and globally execute the other VBScript file. The tool is a command line tool only and it has only two possible input paramter. The first is the path and file name of the script to check (required) and the second (optional) is the keyword pause, which will trigger the request for pressing a key at the end, preventing the command line window to close automatically, if you called the tool from Explorer for example and not an already open command prompt. You might want to check out my VBScript & HTA to Win32 EXEcutable tool to convert VBScript to a Win32 executable.'''
