full_description = '''If you don't know what ANSI or ASCII is then you are probably at the wrong place. However, if you'd like to learn more about this subject in general, I'd like to warm your heart for the ASCII Art Academy section on my web site, where you can learn a great deal about all this stuff. On the other hand, if you are an oldskool scener who knows, remembers and used pre-Internet Bulletin Board Systems (BBS) like PCBoard by Clark Development or other platforms and the thoughts about art group legends like ACiD, iCE, Mirage (and of course SAC) brings tears to your eyes, you probably want to spend a little bit extended time here, especially if you also happen to have a web site and like to put up some of the old text art on your web site, as TEXT ART and not just as "lame-ass" image screen-shot. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. Convert DOS ASCII, ANSI, PCBoard, Wildcat V2.X, Wildcat V3.X, Avatar or BIN Files to HTML Encoded Unicode Text Format. The results are real text files, not Image snapshots of the original text art. Special HTML and CSS encoding is used to produce results as closely matching the original as possible. You can also convert files to real Unicode Text files for the use in other Windows applications where fonts like "Terminal" to render the orginal ASCII characters is not available. You also can convert stuff any other way around, like BIN files to PCB or ANSI or Unicode Text Files back to DOS ASCII etc.'''
