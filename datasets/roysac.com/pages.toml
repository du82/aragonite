full_description = '''My attempt to write my own ANSI Art Editing Tool. I already wrote converters (link 2) and latest a Font Tool for the old MS-DOS ANSI Editor TheDraw, so it was only a natural progression to write something like this editor. If you have no clue what I am talking about here, I'd suggest to pay a visit to my ASCII Art Academy and also to check out my various art galleries :). Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. The latest Instable Beta Version of a new ANSI Editing tool like PabloDraw, ACiDDraw, TheDraw, TundraDraw or TetraDraw or AnsiDraw for Windows 32/64 Bit Systems. ATE has a full font system very similar to the one of TheDraw (except for the "outline" font type) coming already with over 3.500!!! ready to use ANSI and ASCII fonts. Import and Export of TheDraw ANSI fonts is supported as well as import and export of the native .ATEF format (file type specifications are included). For backwards compatibility the import of the .AFNT files from the first beta of this editor is also supported (no export though). You will recognize many features from the mentioned editors. This tool has some unique features of its own though, such as: Supported Text Formats (Load and Save): .ANS, .ASC, .PCB (PC Board), .WC2 (Wildcat 2.X), .WC3 (Wildcat 3.X), .AVT (Avatar), .BIN, .TXT (Unicode), .PNG (Bitmap)*, .XB (XBin), .TND (TundraDraw), .ADF (Artworx), .IDF (iCEDraw)'''
