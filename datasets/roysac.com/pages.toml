["https://roysac.com/roy-tools/vbs2executable.html"]
title = "VBScript & HTA to Win32 EXEcutable"
description = "Tool to create a Windows 32bit Executable from VBS or HTA Script files. Supports Cscript batch or Wscript dialog execution, HTA Interfaces and custom ICON integration in output EXE File."
full_description = '''VBScript files are handy and easy to create and use for anybody who is familar with the "BASIC" programming language. Languages like "Visual Basic", Classic "Active Server Pages" (ASP) or "Visual Basic for Applications" (VBA) are similar to almost identical to VBScript. While you can compile programs in Visual Basic to an Executable, .VBS files cannot. The code remains plain text and must be executed as such via the script hosts "WSCRIPT.EXE" (for interactive scripts) or "CSCRIPT.EXE" (for command line or non-interactive batch scripts) in windows. Windows Explorer typically recognizes VBScript files, if they use the proper extension e.G. .VBS and runs them via either WSCRIPT or CSCRIPT, depending on which is set as the default (typically WSCRIPT), if you double-click to open them. Please Note! ... that all of my tools posted on my web site are using the Free Art License (FAL) 1.3 (Copy left Attitude), which means its free to use, share and even modify and redistribute, as long as your modified version is still free and not commercially distributed. If you want to exploit the software commercially, you would have to contact me and negotiate terms. Needless to say, but better safe than sorry.... using my tools does not make me liable for any direct or indirect caused damages or losses, because of the use of them. You use them at your own risk. If you are paranoid, don't use them, if you are not understanding what I am saying here, don't use them either. This tool lets you create an Win32 Executable out of your .VBS or .HTA script and even lets you include a customized ICON file for it as well. Behind the scene, for the novice user invisible your original script code is exported to the temp directory and there executed by either WSCRIPT or CSCRIPT, with the difference that you specify which one is used regardless of the default setting in the users system or even if .VBS scripts are recognized at all or not. Once the script finished, it will be removed automatically, leaving no trace that it has ever been there.'''
