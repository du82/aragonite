title = "RPA | Our Region"
description = "The New York-New Jersey-Connecticut metropolitan area is an interconnected region linked by a common housing and labor market, defined by shared coastlines, water bodies and mountain ranges, and connected by networks of railroads, roadways, power lines and communications infrastructure."
full_description = 'The Region The Region Transportation Housing & Neighborhood Planning Energy & Environment Governance 3 States 31 Counties 782 Municipalities 23 million Residents 13 thousand Square Miles <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/RPA-4RP-11-Banner-Shutterstock_686858950-Bay-Ridge-Brooklyn-NY-by-Felix-Mizioznikov.jpg?bossToken=786204346d1163a0a5ef99dfa43e68a26c27a9ae38e63a5deb8a18bc20b2644e" /> The people who live and work in the region depend on a common environment and economy extending from Trenton, NJ to New Haven, CT, and from the Catskill Mountains to the east end of Long Island. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-COVID-RPA-Hudson-History-1RP-vol2-P555-town-centersIMG_5870-2.jpeg?bossToken=7b5459360d81a6d271928df4bd754766a62b300d04a8e7929df1b28a5a4995c7" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-Allison-Shelley-for-EDUimages.jpg?bossToken=7e247904f8697790d86c223fd5f1d59a72ddfa26b2231a86466cb17ce8a51dcf" /> The severity of the COVID-19 outbreak in the tri-state region continues to reinforce how connected our states and communities are. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-COVID-RPA-Hudson-History-1RP-vol2-P555-town-centersBicanski_kid-in-mask.jpeg?bossToken=711b2faf8197e5a1a7c4ff42228bb0e30bc02d7a61b1b4a6c11254de182a0a5c" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-Bike-Delivery.jpg?bossToken=daf9b76797266857610ed50553ccd62aecd835e88f35e273c02901d72655a78d" /> Tragically, the pandemic is also reinforcing inequity. At the height of the pandemic, COVID-19 mortality was higher among non-white and non-English-speaking people, and among those living in overcrowded housing and group quarters. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/People-of-the-Region.jpg?bossToken=508490e9975de4bc96d9f6cdda6aa03f2b1d8bbd0672a68c84397abdae170144" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_BASTAMRNY_200429_184534.jpg?bossToken=2bffa631dbf93de7421a9315d302ddd0bbe8092bffa32d7984bd5ef71407d24d" /> One of the world’s leading metropolitan economies, the region now accounts for approximately 10% of the United States GDP. Too few share in this prosperity, however, and the pandemic only deepened the divide between those with means and those without. Transportation <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Our-Region/anthony-fomin-I2j3Ny8adow-unsplash.jpg?bossToken=6314c557c79d6c3a8532d0504a9c7bd7147d57edcad4bc52c92dae3e3bbc5128" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/RPA-our-region-transportation.png?bossToken=7d76b2eaee2382511e4c33805e82ca1f042f08c05f510354ed007d288fc55a5d" /> 390+ rail stations 2,000+ track miles Our region is served by one of the most extensive transit systems in the world. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_MTABus.jpg?bossToken=f937843ad75712959cbf7ead28baa2778ecb6ec9577c8ff09ae033b723ca761e" /> 4.2 Billion Annual Transit Rides Transportation is the backbone of the region’s economy, providing access to jobs and education and enabling intra-city and inter-state travel. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/RPA-4RP-26-Banner-Shutterstock-274276538-Editorial-by-BarbsImages_resized.jpg?bossToken=989f2ad5c9fd925443f26e8ee77a436f95e61ac5c38ba75701ca5b5c4facdd7a" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/The-Pitt.jpg?bossToken=a0758c38b9fe321fa541d8eec1779f88024f02cd3917d21762e890b4536470a4" /> 79-minute average flight delay at JFK, LGA, EWR Prior to 2020, we were outgrowing this aging system, which was increasingly unable to meet the region’s changing needs. Now, as a result of the changes to work and social life brought on by the pandemic, new mobility patterns are creating new challenges. What is RPA’s plan for transportation? The Plan Support New Mobility Patterns join the campaign Increase Trans-Hudson Rail Capacity join the campaign Design Streets for Equity join the campaign Implement Congestion Pricing and Fix the Subways read the report Bring Better Transit to the Boroughs read the report We must expand and modernize mass transit, accommodate the growth of e-commerce, and reimagine our streetscapes — at a pace that meets demands and keeps up with innovation. Housing & Neighborhood Planning <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Our-Region/karla-alexander-WS5fl41r0_I-unsplash.jpg?bossToken=f8f452e0d3402afed154771716a1aeb815c40b4a2e75824d08867d79e1193089" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-Hopscotch-kid2.jpg?bossToken=e678c75e9a54e0c78da385b25c28c6d14d28dcd8d42d3ea35aea1a6b7ee10c28" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_PublicHousing.jpg?bossToken=1f05c3dd820d2cf9ce4da7832fc81e7bea32448905aa8a9b84fd165ffabee8f7" /> 238,876 public housing units Wherever they choose to live in the region, people seek many of the same things: an affordable home, a good job within commuting distance, safe streets, a healthy environment, and good schools. Areas at Risk of Displacement <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_BrooklynAerial.jpg?bossToken=0c3212aa23184cf8c24da11ca6afb3f00aee30f1117b64b94f4a1c124e592112" /> Yet our region is one of the least affordable and most segregated metropolitan areas in the US, and our housing growth has not kept pace with our economy. What is RPA’s plan for housing & neighborhood planning? The Plan Invest in Communities & Reduce Segregation join the campaign Restore the Promise of Public Housing join the campaign Legalize & Promote Accessory Dwelling Units read the report Embrace Inclusive Growth read the report Our towns and cities should be welcoming, healthy, and affordable for people at all income levels and all stages of life. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-Duplex.jpg?bossToken=a3f800e179de59d04984cca03f30d13b096050de7bf2731414c453c4012d5eaf" /> How Do Towns Treat Multi-Family Housing? We need to invest in communities and update land use laws and regulations to reduce segregation and ensure all residents have access to opportunity. Energy & Environment <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.7,fp-y:0.5,quality:80/general/Our-Region/priscilla-du-preez-tJ1uvdf68e0-unsplash.jpg?bossToken=528c9a4737d6905a93b52b453252226f0c00c475eeabc336c007444fd445c6fb" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_DelawareWaterGap.jpg?bossToken=a8198764c9222b25634b0f7a54ace05d88f585f5934e1ef6c81b8808d4349c18" /> 2,000,000 acres of protected open space <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/RPA-our-region-openspace.png?bossToken=82a1529a573b5ec5c06c618305fd9d7d2b9df099a832bee4643c76f44d9a3d8e" /> Our environment plays an essential role in ensuring the health and well-being of the region. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-Meadowlands_KariNousianen.jpg?bossToken=e66681f57d3b8bc8be785e7366d2e6cb0a69a1ca61d2f72730a52b2d45e98bb2" /> 78% of historic wetlands have been lost to development For most of RPA’s history, threats to our region’s environment came from the encroachment of development upon open space. Now it’s climate change that is threatening — and already transforming — the region. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-Flood-NYC-Adam-Kuban.jpg?bossToken=aa62a6990c4f943085d0a3960eb230152bfc8bc4397707cbfa8c0122c97ced03" /> 3,700 miles of coastline <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_Coastline.jpg?bossToken=a2ca982a1b0c4c2ca9be65730ac8707a74899b2813787a19ce0c577ac4588019" /> 2,000,000 people in 2050 flood zone Across the tri-state region, pollution is compromising quality of life while increasingly severe storms are taking lives. Most often, immigrant communities and communities of color are paying the greatest price. What is RPA’s plan for energy & environment? The Plan Reduce Emissions join the campaign Prepare for Flooding read the report Plan With & Protect Vulnerable Communities join the campaign Conserve Wetlands & Open Space read the report We must reduce emissions by decarbonizing the region’s buildings, transportation, and energy systems, and ensure these systems can withstand severe weather and rising seas. Governance <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Our-Region/13930500294_a66d2ea93f_o.jpg?bossToken=114c5a97ff10aadcbf75448f07910dd6729fc1637a7a5f81f2d909e3d2f06516" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Our-Region-45-East-along-Golden-Hill-at-CIty-Hall-Park.jpg?bossToken=7799a6ef55adbd01fc42d3d6b4897d0272299358fe60fef882f0c9fb8f343b6a" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/RPA-our-region-municipalities.png?bossToken=6f8f54fe3b1e6cf8648f86518993cc47283def1cf352bfe552aefbd8a3c4a0d8" /> More than 800 state, county, and municipal governments make decisions that impact our entire region. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/Public-Input.jpg?bossToken=267e91b1136caed7b12a5153a45dcb549981e049db4c3ba5bf53a204fcffb90b" /> Each municipality is responsible for its own decisions about land use, property taxes, and schools. This increases costs, creates sprawl, and exacerbates inequality. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Our-Region/OurRegion_FEMABeach.jpg?bossToken=5f5aae359c9811a6492430fd94187ef6b3a4b515f6ccab8f31fc3f7e7a0a0f14" /> $22+ billion of unmet disaster recovery after Superstorm Sandy Faced with new challenges such as climate change, the COVID-19 pandemic, and increasing inequality, most of our public institutions are slow to act, and do so piecemeal and without adequate funding. What is RPA’s plan for governance? The Plan Center Health & Equity Within Planning join the campaign Reform Land Use Practices read the report Develop Institutions Capable of Responding to Climate Change read the report Reduce the Cost of Building Public Transit read the report We must reform public bodies for the 21st century, increase participation in government, and make planning more inclusive to create a region that works for all of us. RPA is an independent civic voice across the tri-state region. Help us maintain our independence. support rpa'
