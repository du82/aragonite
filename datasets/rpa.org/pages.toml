title = "RPA | Interborough Express"
description = "Running 24 miles on existing track from Co-op City in the Bronx to Bay Ridge in Brooklyn, the Triboro would be an above-ground rail line connecting 17 subway lines and 4 commuter lines."
full_description = '''Running 24 miles on existing track from Co-op City in the Bronx to Bay Ridge in Brooklyn, the Triboro would be an above-ground rail line connecting 17 subway lines and 4 commuter lines. RPA continues building support for the Triboro among key stakeholders, including outer borough residents and businesses, the MTA, and City and State legislators. The MTA has begun a feasibility study of the line, a crucial first step in making Triboro a reality. Related News Crain's New York Business Op-ed: A road map for making inroads into climate change in New York Jun 7 2022 in Media StreetsBlog USA Talking Headways Podcast: Thinking Regionally About New York Jun 2 2022 in Media Untapped Cities See the Freight Tracks That Could Become the Interborough Express May 31 2022 in Media New York Daily News Waste no more time; build the QueensWay May 27 2022 in Media AM New York MTA to hold virtual town hall on Interborough Express in May Apr 25 2022 in Media Commercial Observer Hochul and Adams Usher in New Era for CRE in New York Government Apr 3 2022 in Media The B1M The Secret Subway That Could Save New York Feb 23 2022 in Media City Limits Opinion: Transit Equity for New York City Starts in The Bronx Jan 27 2022 in Media Queens Chronicle Push is on for the Interborough Express Jan 27 2022 in Media The City Interborough Express Plows Through Past Opposition to Rail Line Reactivation Jan 23 2022 in Media 6 Sq Ft 14-mile ​‘Interborough Express’ route between Brooklyn and Queens moves forward Jan 21 2022 in Media Astoria-Long Island City Patch First Step Complete In Queens To Brooklyn Train, Hochul Says Jan 21 2022 in Media The New York Times Transit Line Connecting Brooklyn and Queens Moves Step Closer to Reality Jan 20 2022 in Media Queens Chronicle Chamber rail line talk Friday Jan 20 2022 in Media Fox 5 Bronx feeling excluded from Interborough Express Plan Jan 20 2022 in Media AM New York Hochul unveils more details about Interborough Express in new study Jan 20 2022 in Media Gothamist Brooklyn-Queens Interborough Express Rail Project Quickly Moves To Next Phase Jan 20 2022 in Media New York Post Gov. Hochul announces ​‘next phase’ of Brooklyn-Queens transit link Jan 20 2022 in Media ABC Eyewitness News Proposed Interborough Express would serve 88,000 daily riders, Hochul says Jan 20 2022 in Media Commercial Observer Hochul, MTA Say Interborough Express Between Brooklyn and Queens Is Feasible Jan 20 2022 in Media What is the Triboro Line? Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2019-Reports/The-Triboro/Triboro-Right-of-Way.jpg?bossToken=fce7270857c12aeb7825e50cb52b1f070ec2ab56f62d266989e873fd3f8ffeb3" /> The Triboro Transit for the Boroughs The New York City boroughs of Brooklyn, Queens, Staten Island and the Bronx are home to 6.6 million people. Many of them are poorly served by the city’s century-old, Manhattan-centric transit system. read more Action Inter-Borough Express New York Governor Kathy Hochul directed the MTA to begin an environmental impact statement for Inter-Borough Express which encompasses most of the Brooklyn and Queens portions of the Triboro proposal. read our statement MTA Feasibility Study In a letter co-signed by more than 20 city legislators, RPA wrote to the MTA asking the agency to conduct a feasibility study on the Triboro line. read more City Council Supporting Triboro RPA rallied support for Triboro among members of the City Council, who wrote to the MTA to call for a feasibility study of the project. read more Events <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/events/Event_OuterBoroughTransit_Maulin.jpg?bossToken=8b2314bdb141a29828fe664e4faefecddd200d4e2f52a3184793fa3f71552384" /> Outer Borough Transit In October 2019, RPA brought together experts and elected officials at the Brooklyn Historical Society for Outer Borough Transit, a conversation around the challenges and opportunities to improve public transit in The Bronx, Brooklyn, Queens and Staten Island. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/VanessaBarrios2_TriboroBrooklynBP_January2020.jpg?bossToken=efa2cc40cd90aa23cad68dec76b57d5c6c21dc44668be0476c0aef3f08216b1c" /> Borough Hall Briefing RPA’s Advocacy team updated the Brooklyn Borough President’s office and Brooklyn Community Board chairs on the Triboro project in January 2020 Help us advocate for the Triboro and bring better transit to the boroughs. make a contribution share Research Areas Transportation Location New York'''
