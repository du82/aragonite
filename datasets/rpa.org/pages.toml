title = "RPA | RPA Statement on Trump Administration Plan to Revoke Congestion…"
description = "Regional Plan Association works toward a better future for the tri-state region"
full_description = 'share The following statement is attributable to Kate Slevin, Executive Vice President of Regional Plan Association: Congestion pricing is a meticulously studied, globally-proven program that is enshrined in New York State law. It is already delivering real-time benefits to New Yorkers. In just the first month since the program’s implementation, the primary benefit of the program is traffic reduction. New Yorkers are already seeing faster commutes, less traffic, and increased safety on streets, with a 51 percent drop in crash-related injuries. With nearly 8 percent fewer cars on the road, commute times have reduced dramatically, having decreased by upwards of 48 percent during peak commute hours. These improved conditions support local businesses and create a thriving environment for local community members, commuters, and visitors alike. Congestion pricing reduction of traffic congestion supports local businesses, not the other way around. A fully-invested-in MTA system will also mean increased efficiency, reliability, cleanliness and safety for millions. This hasty obstruction through the rescinding of the federal approval of the VPPP for the congestion pricing program threatens the long-term vitality of the tri-state region’s $2 trillion economy – and undercuts the shared benefits tri-state residents and commuters deserve. We remain committed to safeguarding this policy so it can continue to improve quality of life for both commuters and residents alike. Written by <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.51,fp-y:0.41,quality:80/headshots/Slevin_Kate.jpg?bossToken=4ef64dc431ad6c63b2d6efc7fe2bc1ac5b96702e8da774915a353fb7ee753429" /> Kate Slevin Executive Vice President Related News-Release Posts Feb 2025 in Transportation Congestion Pricing Now Coalition Statement on Trump Administration Plan to Revoke Congestion Pricing Jan 2025 in Transportation Statement from the Congestion Pricing Now Coalition on a Historic and Promising First Week Jan 2025 in Transportation Statement on Congestion Pricing Going into Effect in NYC Dec 2024 in Transportation RPA Response to the Congestion Pricing Challenge Decision Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
