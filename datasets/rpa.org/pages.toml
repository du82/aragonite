full_description = '''<img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/Iconic-images/NJ-PatternArtboard-7-copy-3.png?bossToken=70f0d01ffd4a7956d7c2e80f3704021eb12022b6d9bdd3cc4489985664178d99" /> The 2025 RPA New Jersey Reception Honoring Former Senate Majority Leader Loretta Weinberg & Kevin O’Toole, Chair of the Port Authority of New York New Jersey Join us on February 26, 2025, for our Annual New Jersey Reception! read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/housing-opportunity-header.jpg?bossToken=81727d968de7cbb9a526b713e58097d353caf626bae058ae732160e73b19cb1e" /> Statement on Congestion Pricing Going into Effect in NYC read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Narrow-Port-Illo.png?bossToken=187dc64d50f91f92a8319c4f09a40c395c2050b1675c06de717162525343fc36" /> Ports of Opportunity Advancing Offshore Wind Ports in the Tri-State Region The implementation of offshore wind as a clean energy source is vital to meeting our region’s clean energy targets and avoiding the very worst outcomes of a changing climate. This report explores the role ports play. read more Our Region RPA operates in the interconnected 31-county New York-New Jersey-Connecticut metropolitan region. Region at a Glance 3 States 31 Counties 782 Municipalities 23 million Residents 13 thousand Square Miles read about our region Our Areas of Expertise Energy & Environment RPA’s Energy & Environment program helps the region to rise to the challenge of climate change through proactive regional planning, smart policy development, and advocacy for sustainable land use practices. learn more Housing & Neighborhood Planning RPA’s Housing & Neighborhood Planning program explores how to make the region affordable for everyone and builds collaborative local plans focused on healthy, inclusive, and well-designed communities. learn more Transportation RPA’s Transportation program helps shape and strengthen the network of railways, roads, airports and ports that binds the region together and connect us to the rest of the world. learn more Stay up to date with us. Join our mailing list for updates, invitations, news, and more. sign up Ongoing Campaigns Transportation in the Region RPA is researching and advocating for the infrastructure improvements we need to support sustainable and accessible transportation in the region. learn more Reducing Emissions & Adapting to Climate Change RPA is researching and advocating for policies that ensure our region is both mitigating and adapting to the impacts of climate change. learn more Building an Affordable Region RPA is working to transform the tri-state area from one of the most segregated and least affordable regions to one of the least segregated and most affordable in order to serve our diverse and growing population. learn more Interborough Express Running 24 miles on existing track from Co-op City in the Bronx to Bay Ridge in Brooklyn, the Triboro would be an above-ground rail line connecting 17 subway lines and 4 commuter lines. learn more The Gateway Program Build Gateway Now is a coalition of civic, labor and business leaders building support for the construction of a new rail tunnel to connect New York, New Jersey, and the entire Northeast Corridor. learn more Penn Station Public for Penn Station is a commuter advocacy campaign combining transit and planning expertise with grassroots energy to increase the pressure on local, state and federal leaders to address the Penn Station nightmare. learn more Recent Reports Feb 2025 in Energy & Environment Roadblocks and Solutions to Permitting for Residential Solar and Energy Storage Challenges and incentives in New York and New Jersey Feb 2025 in Housing & Neighborhood Planning Low-Income Housing Tax Credit: Impacts on Rural Housing Development in New York State Dec 2024 in Housing & Neighborhood Planning Housing Jersey City: Assessing Current and Future Gaps Oct 2024 in Transportation The High Costs of Exempting Municipal Workers from the NYC Congestion Pricing Program A Joint Report of RPA and the Permanent Citizens Advisory Committee to the MTA (PCAC) <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/shutterstock_2246940487.jpg?bossToken=5ac1c202c8ea6e5114342700efa95aa924e867d095ee67eb3b39a34c58020d94" /> Congestion Has Never Been Worse; The Need for Congestion Pricing, Never Greater. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/shutterstock_2444556073.jpg?bossToken=6c200ae6625104c815a63416c1ca7423e44bc4dda76a72ff853cedfafb6e0d93" /> RPA Lab World Cup, Local Issues While it’s tempting to think the 2026 FIFA World Cup will come off without a hitch, this event will be unlike any other we’ve had. Below we consider the logistical implications of the forthcoming mega-event. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.54,fp-y:0.64,quality:80/work/Region-IV.jpg?bossToken=f56afa6cb0a0b0286d6914814be70d8b09c175657cbf3a7f8620e1224c47b95f" /> RPA Lab The Affordability Squeeze Impact of Housing Undersupply on the Tri-state Region As state legislatures and local governments throughout the tri-state region continue to debate various policy proposals to address housing costs and shortages, a recent analysis conducted by McKinsey & Company for Regional Plan Association shows that the region may face a housing gap of 920,000 units by 2035. The analysis also highlights a current shortage of 540,000 housing units in the region. To address this housing shortage, building… read more The Latest Feb 2025 in Testimony Testimony on Behalf of the New York Neighbors Coalition to the Joint Legislative Budget Hearing – Topic: Housing Feb 2025 in Testimony Testimony to NY’s Public Service Commission in Support of Offshore Wind Transmission Project Feb 2025 in News Release Congestion Pricing Now Coalition Statement on Trump Administration Plan to Revoke Congestion Pricing Feb 2025 in News Release RPA Statement on Trump Administration Plan to Revoke Congestion Pricing If planners are not careful and intentional, equity could become a buzzword instead of an outcome people experience as a result of our work.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.44,fp-y:0.15,quality:80/headshots/Barrios_Vanessa.jpg?bossToken=67b1236c98b778bb9412a9fec9c14dbe17c13c50ce98f86231baeb71304fb341" /> Vanessa Barrios Director, Diversity, Equity, and Inclusion Initiatives learn about the Healthy Regions Planning Exchange view full bio For 100 years, RPA has guided the growth of the tri-state region with independent research and advocacy. Help support our work. support rpa How it started / How it's going visit the rpa timeline <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/fourth-regional-plan-cover.jpg?bossToken=f26ae01918f1dbe7842ca350bb3a95f6deb0a3f26af91e081fce17d6a9411425" /> The Fourth Plan seeks to address issues including housing affordability, overburdened transportation infrastructure, and vulnerability to climate change—by addressing the underlying shortcomings in the region’s governance structures. find out more Total Reports 534 Search Our Reports Search Filters Research Areas Housing & Neighborhood Planning Transportation Energy & Environment Location All Locations Connecticut New Jersey New York International National Author All Authors Christine Garner Christopher Jones Dave Zackin Ellis Calvin Jeff Zupan Kate Slevin Kyle Mason Lacey Cotter Marcel Negret Maulin Mehta Moses Gates Rachel Weinberger Ravena Pernanand Robert Freudenberg Robert Lane Sam Bowden Akbari Tiffany-Ann Taylor Tom Wright Vanessa Barrios Zoe Baldwin Date Search the entire site'''
