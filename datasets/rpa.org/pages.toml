["https://rpa.org/work/campaigns/build-gateway"]
title = "RPA | The Gateway Program"
description = "Build Gateway Now is a coalition of civic, labor and business leaders building support for the construction of a new rail tunnel to connect New York, New Jersey, and the entire Northeast Corridor."
full_description = 'The Gateway project will modernize failing 112-year old infrastructure that nearly 200,000 daily riders depend on every weekday. It will double the capacity of the Northeast Corridor train line between Newark and New York City — an investment that will improve rail and freight mobility from Washington, D.C. to Boston and beyond. Build Gateway Now is a coalition of civic, labor and business leaders building support for this critical project. Follow Build Gateway Now or Join the Coalition! <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/logos/Build-Gateway-Avatar-v1-08.jpg?bossToken=e7884939c7e649249faa45d55ed3e52208a81eea718e5c91ca6f1d2e10e55f69" /> Keep up with the coalition on Twitter and Facebook. Gateway Interactive Map Learn more about the 11 projects that make up the Gateway Program and how they will repair, modernize and expand the 10 mile stretch of rail between Newark and New York City. Related News RPA Testimony to the Gateway Development Commission Feb 3 2025 in Testimony RPA Testimony to the Gateway Development Commission Regarding New Leadership and Continued Progress Jan 16 2025 in Testimony RPA Statement on the Selection of Thomas Prendergast as CEO of the Gateway Development Commission Jan 16 2025 in News Release NJ.com 117-year-old bridges used by hundreds of trains on track for retirement, Amtrak says Dec 23 2024 in Media RPA Testimony to the GDC Board of Commissioners Regarding Construction Progress Dec 12 2024 in Testimony Expanding Capacity and Improving Penn Station Sep 17 2024 in RPA Lab NJ.com First Gateway contract awarded to drill new Hudson River rail tunnels through the Palisades Jul 31 2024 in Media Newsweek 114-Year-Old Railway Tunnel Set To Get $11 Billion Makeover Jul 19 2024 in Media RPA Statement on the Resignation of Kris Kolluri as CEO of the Gateway Development Corporation Jul 18 2024 in News Release Statement Regarding the Massive Outages on the Northeast Corridor Amid a Record-Breaking Heat Wave Jun 20 2024 in News Release Build Gateway Now Statement on the Hudson Tunnel Project Full Funding Grant Agreement Jun 12 2024 in News Release The New York Times $16 Billion Hudson River Tunnel Project Gets Final Green Light Jun 11 2024 in Media The New York Times Why Amtrak Is to Blame for a Hellish Night for New Jersey Commuters May 23 2024 in Media Construction Dive Builders Embrace the Megaproject Boom May 21 2024 in Media NJ.com How do you deliver N.J.’s 21st Century transit? With a 21st Century workforce May 8 2024 in Media NJ.com Gateway Tunnel project could create 20K more jobs than we thought Apr 30 2024 in Media POLITICO Gateway tunnel project bigger job boost than expected Apr 29 2024 in Media Federal Funding Share for the Gateway Program Mar 25 2024 in RPA Lab Testimony to the Gateway Development Commission, 2.28.2024 Feb 28 2024 in Testimony Testimony at the Gateway Development Commission Board Meeting, 2.16.24 Feb 16 2024 in Testimony The Gateway Program, Explained This short video explains the basics of the Gateway Program and highlights the enormous benefits that its 11 core projects will bring. Operations at Penn Station This short video explains the operational techniques train operators use to direct trains in and out of Penn Station Research and Latest News <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Screen-Shot-2024-04-25-at-11.44.57-AM.png?bossToken=95ec8779e440640f262b7d3b18038d1697ee2f71f291622b7413e527db5cb2a0" /> Early Work, Early Benefits Significant economic activity already generated by Hudson Tunnel Project New research estimates construction of the Hudson Tunnel Project will generate 95,000 jobs – 20,000 more than previously projected. read more Federal Funding Share for the Gateway Program read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2023-reports/Commuters/commuter-patternArtboard-3@2x.png?bossToken=569fd140257f34afb44b5e2577765a7e425531e5dc64a811f9f1dfb41ecea7d5" /> Commuter Dividend The Economic Value of Commuters for City and Suburbs in the New York-New Jersey-Connecticut Region Whether going into the office or working from home, commuters are a vital source of jobs and income throughout the metro area. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/GatewayTour.jpg?bossToken=22b92f9f20d90a7ecb7560a086e70451a0127f9d36884b9c73e616f870be7917" /> The Long Ride to a Full Funding Grant Agreement for the Hudson Tunnel Project In order for construction to commence on the Hudson Tunnel Project, the Gateway Development Commission and other project partners must complete a series of steps to obtain a Full Funding Grant Agreement as outlined here: read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Scenario-Planning-Gateway/Gateway-Scenario-ArrowArtboard-1@3x-100.jpg?bossToken=9e396be70dddd644e1ac651e5a038573c40bd211c1c66a2c3c0ad67484d743fc" /> Gateway and the Post-COVID Economy Scenarios for Future Growth and Trans-Hudson Travel Transit trips across the Hudson River will continue to grow beyond the region’s current capacity. Without the infrastructure to meet this demand, the region’s economic growth and sustainability are in jeopardy. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/GatewayTour.jpg?bossToken=5e936a1c4549574ea0cfc434e305f972cca25bee880895787d2ae19c87566674" /> Touring an 111-Year-Old Tunnel and the Gateway Program Touring the North River Tunnel illustrates the urgent need for the Gateway program and the improvements to rail service it will provide to the region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2019-Reports/Preventable-Crisis/PreventableCrisisGatewayGomez-NRT3-2.jpg?bossToken=235a65f965a457fa44423fffdd1ba661ac081388879eaceacc8ad4570cafd7d7" /> A Preventable Crisis The Economic and Human Costs of a Hudson River Rail Tunnel Shutdown This report looks at the impacts of a potential partial shutdown of the Hudson River rail tunnel. While a shutdown is not planned right now, the possibility is becoming increasingly likely. read more Action <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Campaigns/Chris-Jones-RPA-Penn-Station-Gateway.png?bossToken=2a7f71a91c43df3f27610e41554a0c765fdfa87804557ae1716744bbb59b5c30" /> At New York Penn Station in June 2022, RPA announced new research - Gateway and the Post COVID-Economy - which demonstrates that trans-Hudson transit ridership will surpass 2019 levels in the future under virtually any circumstances. Gateway Begins to Move Forward The Build Gateway Now coalition applauded the Biden Administration for beginning to advance the Hudson Tunnel project. read more New Funding Sources The Build Gateway Now Coalition urged the US Department of Transportation to identify a new funding source for Gateway, as current sources are too limited in their scope. read the letter <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/BrianFritsch_BuildGatewayNowPresser_September2019.jpg?bossToken=bf0c7e35c377444c7db0c4037fb477570044b9311db9e1814a41eaa4a8d6b853" /> When the Federal Railroad Administration missed their self-imposed deadline to approve the Hudson Tunnel environmental impact statement by more than two years, the Build Gateway Now Coalition rallied at Penn Station to demand action. Events <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2019-Reports/Preventable-Crisis/PreventableCrisisGatewayGomez-NRT3-2.jpg?bossToken=235a65f965a457fa44423fffdd1ba661ac081388879eaceacc8ad4570cafd7d7" /> Gateway Program Town Hall Featuring FTA Administrator Nuria Fernandez and FRA Administrator Amit Bose The Gateway Program is our nation’s most urgent infrastructure project. Join Federal Transit Administration Administrator Nuria Fernandez and Federal Railroad Administration Administrator Amit Bose for a virtual town hall on plans for the program and its advancement. read more The Coalition Regional Plan AssociationALM Consulting GroupAmalgamated Transit Union (ATU)Association for a Better New York (ABNY)Brookfield PropertiesCentral Jersey Transportation ForumCommerce and Industry Association of New JerseyDuane Morris LLPELEC825Environmental Defense Fund (EDF)Environment NJGeneral Contractors Association (GCA)Housing Community Development Network of NJHNTBJPC Group, INCLotus Equity GroupMenlo Realty VenturesMP Engineers and ArchitectsNAIOP New JerseyNatural Resources Defense Council (NRDC)New Jersey Chamber of CommerceNew Jersey FutureNew Jersey Laborers UnionNew Jersey League of Conservation Voters (NJLCV)New Jersey Policy PerspectiveNew York Building Congress New York City Central Labor CouncilNew York League of Conservation Voters (NYLCV)Newark AllianceNEWARK Community Economic Development CorporationNewark Regional Business PartnershipPACO Technologies, Inc.Partnership for NYCPermanent Citizens Advisory Committee to the MTA (PCAC)Princeton UniversityRaritan Valley Line Mayors AllianceRaritan Valley Rail CoalitionReal Estate Board of New YorkRiders AllianceRight Track for Long Island CoalitionSiemensSomerset County Business PartnershipStraphangers CampaignTantum Real EstateThe Durst OrganizationThe Related CompaniesTri-State Transportation CampaignTwo TreesUtility & Transportation Contractors Association NJ (UTCA of NJ)Vornado Realty TrustYale UniversityWSP From the Archive <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Lab_CrossingtheHudson_CoverPhoto.jpg?bossToken=47904de4e65f3de76ee7efcbec0f83d6d18489f2413be4824e1e8ac71c3c2ea5" /> Crossing the Hudson How to Increase Transit Capacity and Improve Commutes The links between New York and New Jersey face a growing crisis of capacity, connectivity, and potential collapse. Derailments, delays, or emergency repairs at Penn Station are mild compared to what will happen if one of the tunnels under the Hudson River fails before new tunnels can be built. read more Join the Build Gateway Now coalition. get in touch share Research Areas Transportation Location ConnecticutNew JerseyNew York'
