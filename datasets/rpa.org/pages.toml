["https://rpa.org/about/research-areas/transportation"]
title = "RPA | Transportation"
description = "RPA’s Transportation program helps shape and strengthen the network of railways, roads, airports and ports that binds the region together and connect us to the rest of the world."
full_description = '''Transportation is the backbone of the region’s economy and essential to the quality of life for all residents. The region has outgrown an aging transportation system that is increasingly unreliable and unable to respond to changing needs, technology, and travel patterns. Years of underinvestment during a time of rapid economic and population growth have led to congestion, delays, and deteriorating infrastructure. RPA’s research and planning advances both immediate and long-term actions that support a healthier and more equitable transportation network, creating the capacity for sustainable economic growth. We advance innovative solutions to immediate challenges, such as designing a fair and effective congestion pricing program for Manhattan’s central business district and demonstrating how shrinking urban highways like the Brooklyn-Queens Expressway can improve traffic flows while reconnecting neighborhoods. We develop and promote long-range visions to guide investments in transportation infrastructure. Our regional rail plan would transform the fragmented commuter rail network into a comprehensive system that would greatly expand capacity and reduce travel times throughout the region. Our plan for New York City’s subways would make them reliable, comfortable, fast, and accessible to underserved neighborhoods. Our proposals for an integrated network of buses, light rail, and affordable on-demand car service would leverage new technologies while transforming above-ground transit. Our vision for modernized airports, seaports, and high-speed rail would improve global connections and intercity travel.Because transportation is not an end to itself, we integrate our transportation work with plans for housing, neighborhood development, economic opportunity, climate resilience and a healthier environment. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Kyle-Gradinger_NJ-Transit-Train.jpg?bossToken=c84fb49a6166bd903bcba76c1e530efa6c484f67e55a86aa633f3e2e2e5892c4" /> Transportation in the Region RPA is researching and advocating for the infrastructure improvements we need to support sustainable and accessible transportation in the region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.18,fp-y:0.18,quality:80/work/Campaigns/Campaign_FeaturedImage_Build-Gateway-Now.png?bossToken=2fe1a1a4243d628a61e64944be23ee03076a7398c4e0eb41b067092a722515da" /> Featured Campaign The Nation's Most Urgent Infrastructure Project Build Gateway Now is a coalition of civic, labor, and business leaders building support for the construction of a new rail tunnel to connect New York, New Jersey, and the entire Northeast Corridor. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaign_TriboroMapNoLegend.png?bossToken=29490983d1188dadf745340f3c48da67d9514d919c94f614c9a44a9f25181a80" /> Interborough Express Running 24 miles on existing track from Co-op City in the Bronx to Bay Ridge in Brooklyn, the Triboro would be an above-ground rail line connecting 17 subway lines and 4 commuter lines. read more Latest Transportation News Feb 2025 in Transportation Congestion Pricing Now Coalition Statement on Trump Administration Plan to Revoke Congestion Pricing Feb 2025 in Transportation RPA Statement on Trump Administration Plan to Revoke Congestion Pricing Feb 2025 in Transportation RPA Testimony on MTA’s 2025-2029 Capital Plan Feb 2025 in Transportation RPA Testimony to the Gateway Development Commission Latest Transportation Reports Oct 2024 in Transportation Methodology: The High Costs of Exempting Municipal Workers from the NYC Congestion Pricing Program Oct 2024 in Transportation The High Costs of Exempting Municipal Workers from the NYC Congestion Pricing Program A Joint Report of RPA and the Permanent Citizens Advisory Committee to the MTA (PCAC) Oct 2024 in Transportation Brooklyn Waterfront Greenway User Study Apr 2024 in Transportation Early Work, Early Benefits Significant economic activity already generated by Hudson Tunnel Project Our Areas of Expertise Energy & Environment RPA’s Energy & Environment program helps the region to rise to the challenge of climate change through proactive regional planning, smart policy development, and advocacy for sustainable land use practices. learn more Housing & Neighborhood Planning RPA’s Housing & Neighborhood Planning program explores how to make the region affordable for everyone and builds collaborative local plans focused on healthy, inclusive, and well-designed communities. learn more Transportation RPA’s Transportation program helps shape and strengthen the network of railways, roads, airports and ports that binds the region together and connect us to the rest of the world. learn more Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'''
