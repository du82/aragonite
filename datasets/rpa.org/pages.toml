["https://rpa.org/join/transportation-associate"]
title = "RPA | Transportation Associate"
description = "Regional Plan Association is seeking a motivated and enthusiastic Transportation Associate to join our team. The Associate will conduct research and analyze data to help inform urban planning policy recommendations for passenger and freight mobility issues spanning the New York metropolitan region, which includes New…"
full_description = "The Associate should have a general interest in regional mobility infrastructure and transportation policy and exploring how each mode intersects with RPA’s core values of health, sustainability, equity, and prosperity. The Associate will have the opportunity to organize and participate in community engagement with stakeholders through external meetings and events. This position will report to the Vice President for Transportation and offer support on research efforts and advocacy campaigns. We are looking for someone who shares our passion for fostering prosperous, equitable, healthy and sustainable communities. We encourage a challenging, collaborative, and fun work environment. We also believe in work-life balance. Primary Responsibilities Provide technical support to the Vice President for Transportation and staff throughout the organization on passenger and freight transportation projects and advocacy campaignsSupport the analysis of plans, programs, data and reports on demographic and economic trends, regional land use, transportation, development, environmental and climate policyConduct research on relevant transportation and infrastructure policy at local, state and federal levelsProvide support in grant writing and project brainstorming for original researchAssist in developing and executing public engagement efforts around regional planning issuesWork with both RPA staff and project partners to organize meetings, forums, and eventsMaintain databases, mailing lists, website, and project management softwareDraft memos, meeting minutes, and reports Qualifications Candidates should have a master’s degree in urban planning, geography, public policy or equivalent with demonstrated research experience. A bachelor’s degree and three or more years of professional experience will be considered in lieu of a master’s degree. Excellent organizational, analytical, writing and presentation skills, as well as experience working in teams, are essential. Proficiency with Microsoft Office and Google platforms is required. Advanced proficiency in Geographic Information Systems (GIS) and at least one statistical programming package (Python, R, etc.) is essential. Candidates must demonstrate a basic understanding of political and civic stakeholders in the regional transportation network. Candidates should be able to take initiative and balance multiple projects and responsibilities. Familiarity with Adobe Creative Suite, design software, project management software or website design is a plus. While this position is based in New York City, RPA offers a hybrid work schedule. All staff are expected to work from the office, at a minimum, of twice per week. Salary range is $60,000-$64,000, commensurate with experience. This is a full-time position. RPA provides a comprehensive and competitive benefits package. ABOUT RPA RPA is an independent, non-profit civic organization based in New York City, with additional offices in Newark, NJ; Princeton, NJ; and Stamford, CT. We develop and promote ideas to improve the economic health, environmental resilience, equity, and quality of life of the New York metropolitan area. RPA conducts research on the environment, transportation, land use, and good governance, and advises cities, communities, and public agencies. Our work is focused on the tri-state region, and we have local, regional, national and international partners. The organization encourages a challenging, collaborative, and fun work environment. We believe in work-life balance and value diversity and equity. Employment and promotional opportunities are equal opportunity without regard to race, color, gender, age, sexual orientation, disability, or any other protected class as established by law. Stay up to date with us. Join our mailing list for updates, invitations, news, and more. sign up"
year_published = 2025
clearnet = "https://rpa.org/join/transportation-associate"
