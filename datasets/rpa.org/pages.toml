full_description = 'share Governor Florio was our friend, mentor, esteemed RPA Board Member, and Co-Chair of our New Jersey Committee for more than 20 years. The Governor James J. Florio Leadership Award and companion internship program recognizes and celebrates outstanding New Jersey leaders who embody the Governor’s legacy through their work toward better mobility, stronger and more inclusive communities, and a more resilient region. The award will be jointly presented to Loretta Weinberg, retired Senate Majority Leader, and Kevin O’Toole, Chairman of the Port Authority of New York and New Jersey, for their leadership and collaboration on the re-imagined Port Authority Bus Terminal, <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/NJ-Reception-Honorees-2025-1.png?bossToken=ac9e5b25949389303065173265a6a746b25907ba104d94d923ad454bc3dbec84" /> Event Program 5:45 PM – Doors Open6:00 PM – Event Begins 6:35 PM – ProgramWelcoming RemarksTom Wright, President & CEO, Regional Plan Association (RPA)Zoe Baldwin, VP of State Programs, RPAIntroduction of AwardeesKris Kolluri, President & CEO, NJ TransitPresentation of the James J. Florio Leadership AwardHonoring:Senate Majority Leader (Ret.) Loretta WeinbergKevin O’Toole, Chairman, Port Authority of New York & New JerseyAdditional RemarksKay LiCausi & Paul Josephson, Co-Chairs, RPA NJ CommitteeClosing RemarksLinda Harrison, Director & CEO, The Newark Museum of Art7:00 PM – Program Concludes9:00 PM – Event Ends Thank you for joining us at the Museum! Complimentary parking will be available at the Edison Parking Lot (42 Central Avenue). Please validate your parking before leaving. Kindly refrain from parking in the Newark Museum lot, as it is under construction. The Museum is easily accessible by rail to Newark Broad Street and by light rail. For more details, please visit the Museum’s website. Event Tickets and Donations Thank you for supporting RPA! Sponsors Champion Advocate Supporter Barbara and Richard Bagger Family Fund Friend Carbro Gensler MAD Global Strategy Charles Maikish Mercer Planning Associates Mercury Public Affairs New Jersey Alliance for Action NorthStar Strategies Rockefeller Group Tonio Burgos and Associates Topology Via <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/logos/NJ-RPA-Logo-Wide.png?bossToken=d34d54b4c5d60f3a58f41d2fb681732a43c6a6c29a37da7feabe03c33e706667" /> Past Events The 2024 RPA New Jersey Reception The First Annual RPA New Jersey Reception Looking for an event? Take a look at summaries and photo galleries from past events see our event archive Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
