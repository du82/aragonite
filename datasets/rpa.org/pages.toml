["https://rpa.org/events/assembly/2025-assembly"]
title = "RPA | 2025 Assembly"
description = "Join us for the 2025 RPA Assembly April 28-May 2, 2025 — Monday-Thursday, lunchtime Virtual Sessions; Friday, 11am-4pm: In person at Pier 60 in Manhattan"
full_description = 'Join us April 28-May 1 online and May 2nd in person at Pier 60 in Manhattan Each year, Regional Plan Association convenes 1,000 policy experts, public officials, and business leaders at the RPA Assembly to debate bold solutions for the tri-state metropolitan region’s most pressing challenges: Addressing climate changePromoting inclusive growthDeveloping transportation systems that work for all of us. <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/Iconic-images/Iconic-RPA-map-on-blue_2021-03-15-194020.png?bossToken=5d6edbe4d239504bbd27cfedc02836972340cb050b83aa45bf17c3ff03c4fa26" /> 2025 Assembly Tickets & Sponsorship Opportunities learn more Zuccotti Award 2025 John Zuccotti Award RPA’s highest award for leadership in the region is named after John E. Zuccotti, a long-serving member of the RPA Board of Directors and Execu­tive Committee. Presented each year at RPA’s annual Assembly, the award recognizes a leader who has made extraordinary contributions to the built environment of the tri-state metropolitan region. Learn more about this year’s honoree <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/headshots/Kathryn_Wylde_Headshot_light-background-1.JPG?bossToken=e3054831aa6bdf2df7d1b9086b8a3497b355f32e20cf807f06755a4a1ccb4816" /> Presented by Regional Plan Association Presented to Kathryn Wylde Kathryn Wylde, President and CEO of Partnership for New York City, has dedicated her career to advancing economic opportunity, innovation, and the global standing of New York City. Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
