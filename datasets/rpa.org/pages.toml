title = "RPA | Housing & Neighborhood Planning"
description = "RPA’s Housing & Neighborhood Planning program explores how to make the region affordable for everyone and builds collaborative local plans focused on healthy, inclusive, and well-designed communities."
full_description = 'Wherever they choose to live in the region, people seek many of the same things: an affordable home, a good job within commuting distance, safe streets, a healthy environment, and quality schools, libraries, parks and other neighborhood institutions. Yet rising housing costs and stagnant incomes are making these things increasingly hard to find in one place. More and more, residents must make difficult decisions between an affordable home or a good school; a better job or a safe environment; a community they value or one where there is less worry about eventually being displaced. We need complete communities that are healthy, welcoming, and enjoyable places to live -- as well as affordable. Constructing more new homes, especially near transit stations, is only the first step to make the housing market more stable and affordable. We should also make sure all neighborhoods include homes that are affordable for households of all incomes and makeups, that tenants have protections from unjust evictions, and that fair housing regulations are expanded and enforced. We must also encourage diversified job growth in cities and downtowns throughout the region, while maintaining New York City’s position as a leading global city and economic powerhouse that offers opportunities for all. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Planning-for-Affordability-in-CT/Pugalenthi-Iniabarathi_ManchesterConnecticut.jpg?bossToken=79dca1445facaa80c6b7fc04ce56e0829f7cfc8bd15884b1b6efef80bf37cc08" /> Building an Affordable Region RPA is working to transform the tri-state area from one of the most segregated and least affordable regions to one of the least segregated and most affordable in order to serve our diverse and growing population. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/NYCHA-Time-to-Act/RPA_NYCHA-84.jpg?bossToken=c8c507289cc4f3fba48e82aaa831acffc92bd4a512e6ca3b3c13d8709fe678ad" /> Featured Campaign Restore the Promise of Public Housing RPA is proposing strategies to increase funding and improve management for NYCHA, and we’re building the political and civic will necessary to implement them. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_FeaturedImage_EquitableAdaptation.png?bossToken=635cd86cad1472468eeaa02925eb5ebb0b55f50102440a67ac67c64435729b91" /> Climate Resilience in Queens Through a community-driven process with Make the Road New York, we’ve been learning what climate justice looks like for Queens residents by co-powering communities to turn their resilience goals into reality. read more Since its inception, RPA has helped communities build their own plans by providing best practice design principles. Latest Housing & Neighborhood Planning News Feb 2025 in Housing & Neighborhood Planning Testimony on Behalf of the New York Neighbors Coalition to the Joint Legislative Budget Hearing – Topic: Housing Feb 2025 in Housing & Neighborhood Planning Testimony Before the Connecticut General Assembly in support of H.B. 6831 An Act Concerning Transit-Oriented Communities Dec 2024 in Housing & Neighborhood Planning RPA Celebrates New York City Council Passing City of Yes for Housing Opportunity Nov 2024 in Housing & Neighborhood Planning RPA Celebrates Subcommittee Approval of the City of Yes for Housing Opportunity Latest Housing & Neighborhood Planning Reports Feb 2025 in Housing & Neighborhood Planning Low-Income Housing Tax Credit: Impacts on Rural Housing Development in New York State Dec 2024 in Housing & Neighborhood Planning Housing Jersey City: Assessing Current and Future Gaps Oct 2024 in Housing & Neighborhood Planning Eastern Connecticut Housing Needs Assessment Oct 2024 in Housing & Neighborhood Planning Windham County Housing Profile Our Areas of Expertise Energy & Environment RPA’s Energy & Environment program helps the region to rise to the challenge of climate change through proactive regional planning, smart policy development, and advocacy for sustainable land use practices. learn more Housing & Neighborhood Planning RPA’s Housing & Neighborhood Planning program explores how to make the region affordable for everyone and builds collaborative local plans focused on healthy, inclusive, and well-designed communities. learn more Transportation RPA’s Transportation program helps shape and strengthen the network of railways, roads, airports and ports that binds the region together and connect us to the rest of the world. learn more Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
