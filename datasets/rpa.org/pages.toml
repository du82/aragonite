description = "RPA partners with communities, businesses, government and civic leaders to implement our proposals. We focus on a set of critical campaigns each year while advancing dozens of other projects. Learn more about our campaigns here."
full_description = '<img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Kyle-Gradinger_NJ-Transit-Train.jpg?bossToken=c84fb49a6166bd903bcba76c1e530efa6c484f67e55a86aa633f3e2e2e5892c4" /> TransportationConnecticutNew JerseyNew YorkNew York City Transportation in the Region RPA is researching and advocating for the infrastructure improvements we need to support sustainable and accessible transportation in the region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Right-of-Way/ROW-Rendering_5.jpeg?bossToken=725f10acdcc4ee453f2cb8c45bbb852f762d85319f0791fef442cb18690da70f" /> Energy & EnvironmentConnecticutNew JerseyNew York Reducing Emissions & Adapting to Climate Change RPA is researching and advocating for policies that ensure our region is both mitigating and adapting to the impacts of climate change. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Planning-for-Affordability-in-CT/Pugalenthi-Iniabarathi_ManchesterConnecticut.jpg?bossToken=79dca1445facaa80c6b7fc04ce56e0829f7cfc8bd15884b1b6efef80bf37cc08" /> Housing & Neighborhood PlanningConnecticutNew JerseyNew York Building an Affordable Region RPA is working to transform the tri-state area from one of the most segregated and least affordable regions to one of the least segregated and most affordable in order to serve our diverse and growing population. read more Interborough Express Running 24 miles on existing track from Co-op City in the Bronx to Bay Ridge in Brooklyn, the Triboro would be an above-ground rail line connecting 17 subway lines and 4 commuter lines. read more The Gateway Program Build Gateway Now is a coalition of civic, labor and business leaders building support for the construction of a new rail tunnel to connect New York, New Jersey, and the entire Northeast Corridor. read more Penn Station Public for Penn Station is a commuter advocacy campaign combining transit and planning expertise with grassroots energy to increase the pressure on local, state and federal leaders to address the Penn Station nightmare. read more Congestion Pricing New Yorkers deserve a reliable and accessible transportation system. Congestion Pricing will not only reduce traffic, but provide a multi-billion dollar investment to fix buses and trains. view website Desegregate CT A pro-homes coalition of neighbors and nonprofits fighting for better land use laws to make Connecticut more prosperous, equitable, and sustainable. view website New York Neighbors New York Neighbors is a statewide, pro-homes coalition supporting a menu of options to increase housing supply and create more affordable homes to tackle the state’s debilitating housing shortage and support our economy. view website Fund NJ Transit A coalition supporting the transformation of NJ Transit into a modern, effective transit agency for the state’s one million and growing daily transit riders. view website Restoring the Promise of Public Housing RPA is proposing strategies to increase funding and improve management for NYCHA, and we’re building the political and civic will necessary to implement them. read more Streets as Public Space RPA has long advocated for prioritizing people over cars. We are now building momentum for large-scale, permanent changes to promote transit, biking, cycling, and walking on streets. read more Healthy Regions The Healthy Regions Planning Exchange brings together practitioners, advocates, and community-based representatives from across the US to address structural issues that influence health and equity in regional planning. read more Climate Resilience in Queens Through a community-driven process with Make the Road New York, we’ve been learning what climate justice looks like for Queens residents by co-powering communities to turn their resilience goals into reality. read more A New Green Vision for Rikers Island Building on the work of community, criminal justice reform, and environmental organizations, RPA supports transforming the island from one for incarceration to one for green infrastructure to benefit all New Yorkers. read more Resilience in the New Jersey Meadowlands For the New Jersey Meadowlands to have a sustainable future, we must balance climate adaptation with economic development and make resilience part of every decision we make moving forward. read more Ensuring an Equitable COVID-19 Recovery The New York-New Jersey-Connecticut metropolitan region was the epicenter of the first wave of the COVID-19 pandemic, and RPA is working to ensure it becomes the epicenter of recovery. read more Archived Campaigns New City Parks RPA Partnerships Alfresco NYC Build Better CT CEQR Reform Coalition Coalition for the East Harlem Waterfront East River Esplanade Coalition for the Northeast Corridor CT Urban Centers Coalition Center for Housing Opportunity Fix Our Transit Coalition Friends of the BQX Inclusive Growth Initiative New York Region Climate Adaptation Network New York Workforce Recovery Strategy Group Racial Impact Study Coalition Rise to Resilience Coalition Thriving Communities Coalition United For Housing For 100 years, RPA has guided the growth of the tri-state region with independent research and advocacy. Help support our work. support rpa'
