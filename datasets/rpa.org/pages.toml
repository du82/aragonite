["https://rpa.org/about/staff/vanessa-barrios"]
title = "RPA | Vanessa Barrios"
description = "She has a bachelor’s in sociology from the University ofCalifornia, Riverside, and a master’s in urban planning from the Robert F.Wagner Graduate School of Public Service at New York University where shefocused on international development planning."
full_description = "Vanessa Barrios facilitates research, engagement, and advocacy for work related to affordable homes, accessible transit, public health, climate justice, and equitable economic development for RPA. Prior to joining the organization in 2016, she worked as a case manager, housing navigator, and outreach worker at People Assisting the Homeless, a homeless service organization which serves unhoused families, veterans, and individuals in the Greater Los Angeles area. In April 2022, Vanessa earned a spot on City & State New York’s Non-Profit 40 Under 40 list for her leadership both at RPA and the Healthy Regions Planning Exchange, an RPA-led initiative that convenes a network of planners, practitioners, and advocates from 10 regions across the country to address health and equity in planning. She has a bachelor’s in sociology from the University of California, Riverside, and a master’s in urban planning from the Robert F. Wagner Graduate School of Public Service at New York University where she focused on international development planning. This specialization culminated in an analysis of local economic growth in the 30 regions of Tanzania and provided recommendations for industry potential and quality of life improvements. Vanessa’s ancestors are from the Philippines. She is originally from Los Angeles, CA and is currently based in Brooklyn, NY where enjoys tending to her small but mighty windowsill garden and planning her friends’ next birthday parties. Vanessa’s Recent Work Aug 2024 in Reports Reclaiming Public Space for Health Equity May 2024 in Reports Housing as a Framework for Health Equity As the third in a series of investigations on pathways to health equity, this report is intended to provide insights and a framework for understanding and advancing health equity through the lens of housing. Nov 2023 in RPA Lab Fostering Cross-Cultural Collaboration and Change: Reflecting on the Lakota Media Summit Sep 2023 in RPA Lab Demystifying Federal Funding for Healthy Communities May 2023 in Reports State of the Region’s Health 2023 Update Apr 2023 in RPA Lab Federal Dollars for Local Infrastructure: Tracking IIJA Funding in Our Region Jul 2022 in Reports Preventing Another Ida Stormwater Management and Basement Apartments in Central Queens Mar 2022 in Reports Investing in Infrastructure for Healthy Communities Jan 2022 in RPA Lab RPA Highlights Housing Insecurity, Accessory Dwelling Units with New Videos Nov 2021 in Reports Pathways to Health Equity Mar 2021 in News Release Statement Against Anti-Asian Hate Crimes Oct 2020 in RPA Lab RPA Recognizes Indigenous Peoples’ Day Jun 2020 in RPA Lab Inequality a Common Thread During Assembly COVID-19 Conversations Apr 2020 in RPA Lab Big Ideas in the Big Easy on Racial and Health Equity Feb 2020 in Reports Climate Action Manual Policies for a more sustainable and resilient New York all of vanessa’s work"
