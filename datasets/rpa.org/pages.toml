["https://rpa.org/work/campaigns/streets-as-public-space"]
title = "RPA | Streets as Public Space"
description = "RPA has long advocated for prioritizing people over cars. We are now building momentum for large-scale, permanent changes to promote transit, biking, cycling, and walking on streets."
full_description = '''As cities continue to repurpose street space amidst the pandemic, RPA is building momentum for large-scale, permanent improvements to prioritize transit, biking, cycling, and walking and make streets safer for everyone. Building on decades of research and advocacy in support of pedestrians, we’re encouraging communities to expand on successful open streets and open dining initiatives, plan for more bus lanes and bike lanes, and empower local businesses. Related News StreetsBlog NYC Brooklyn’s Waterfront Greenways Are For Transportation, Too: Report Oct 23 2024 in Media StreetsBlog NYC City of Yes: Council Hears Rezoning Plan as Jumaane Thumbs the Scale Oct 22 2024 in Media The New York Times Can a $350 Million Plan Transform 5th Avenue Into a Grand Boulevard? Oct 17 2024 in Media Times Union Editorial: Don’t widen Route 17 Feb 7 2024 in Media Comments on NYCDOT’s permanent outdoor dining rules Nov 20 2023 in Testimony Letter of Support for the City of Yes for Economic Opportunity Nov 2 2023 in Testimony The New York Times Parking in New York City Really Is Worse Than Ever Oct 9 2023 in Media FOX 5 NY Program to improve NYC street deliveries Sep 5 2023 in Media amNY Op-ed | New York has a problem at the curb. Here’s how we fix it. Aug 23 2023 in Media Associated Press NYC outdoor dining sheds were a celebrated pandemic-era innovation. Now, there’s a new set of rules Aug 15 2023 in Media Statement on the passage of permanent outdoor dining legislation Aug 3 2023 in News Release The New York Times New York City Is Poised to Make Outdoor Dining Permanent, With Caveats Aug 3 2023 in Media Statement on NYC City Council Open Dining Legislation May 19 2023 in News Release Brooklyn Greenway Initiative Launches Innovative User Study of Brooklyn Waterfront Greenway Mar 9 2023 in News Release Crain's New York Business Op-ed: MTA needs a new revenue model to achieve fiscal sustainability Mar 8 2023 in Media AM New York Op-Ed | It’s time for the City Council to make the Open Restaurant program permanent Jan 25 2023 in Media StreetsBlogNYC GREEN CURBS: Open Restaurant Supporters Want Some ​‘Parking’ Spots for Parklets Nov 25 2022 in Media StreetsBlog NYC How Electronic ​‘Eyes’ Will Patrol the Curb of the Future Oct 26 2022 in Media StreetsBlog NYC Massive Show of Support from Restaurant and Design Pros for a DOT-Led Open Restaurant Program Oct 25 2022 in Media Open Letter re NYC DOT Oversight of Open Restaurants Program Oct 25 2022 in Testimony Building Better Streets: Improving Capital Street Infrastructure Delivery for a Re-envisioned Right-of-Way Doing construction work in New York City’s streets is complicated and costly. This report examines obstacles and offers solutions for delivering a more modern, multidimensional right-of-way. building better streets As COVID changes transportation, let’s make sure it changes for the better.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.46,fp-y:0.37,quality:80/headshots/Weinberger_Rachel.jpg?bossToken=1627e820ece34adfa858ea7cf563aa526a2736cfaeb1d18d4176ea842beb829b" /> Rachel Weinberger Director, Research Strategy & Peter W. Herman Chair for Transportation read the op-ed view full bio Action DOT Oversight of Open Restaurants The Alfresco NYC coalition and 200 other signatories asked the New York City Council to leave oversight of the city’s Open Restaurants program with the Department of Transportation. read the letter Public Realm Improvements RPA testified in support of three bills that would add public restrooms and more green space to the New York City’s public realm while developing a Greenway Master Plan. read the testimony Congestion Pricing Public Hearings RPA continued to support the region’s historic effort to toll vehicles entering New York City’s central business district by testifying at the project’s several public hearings. read our testimony <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/latest/Alfresco-NYC-Awards-Press-Conference-Kate-Slevin.jpg?bossToken=5aa8102480395afe56af5f9689fb88ff7a540250490864941469cd2f76cd11b2" /> Alfresco NYC RPA and partners launched a new coalition to recognize and reward the best open restaurants and open streets in New York City and publish best practice design guidelines for outdoor dining spaces. see the alfresco award winners <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Bikeway/PoliceInBikeLane.jpg?bossToken=6e84263af3dcd2738caed6c62287d2eefb332899e8644d8994113505efe71674" /> Transportation-Led Recovery Agenda RPA and fellow NYC transportation advocates published an equity-centered policy agenda for candidates that highlights the relationship between public space and social equity. read the agenda Mayor de Blasio's Surface Transportation Advisory Council Members of Mayor de Blasio’s Surface Transportation Advisory Council including RPA President Tom Wright wrote an open letter urging the Mayor to implement a transportation plan for NYC. read the letter Streets Master Plan RPA supported the passage of New York City’s Streets Master Plan and we continue to monitor its implementation. read more Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Alfresco-2022/Intro_Chinatown.jpg?bossToken=8ce10ba627b5d0edc9f552ead8e26cd8486417699ebce3c58c0964f10e4ba118" /> The Future of Outdoor Dining in New York City The Alfresco NYC coalition collaborated with designers, advocates, and public realm stakeholders across the City to develop policy recommendations and design guidelines for the city’s permanent Open Restaurants program. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Right-of-Way/ROW-Rendering_5.jpeg?bossToken=725f10acdcc4ee453f2cb8c45bbb852f762d85319f0791fef442cb18690da70f" /> Re-Envisioning the Right-of-Way New York City can use our 32,000 acres of roadway to prevent flooding and adapt to climate change, support transportation alternatives and better goods movement, and expand access to economic opportunity. Here’s how. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Better-Service/29Newark-Bus-Better-Service-Report-copy.jpg?bossToken=ece0d51f741434400e1d91af8c4f3ac744bedc120579394dd5db7cddfd56498a" /> Better Service Improving the Bus Network in New Jersey NJ Transit has plans to make bus travel easier and more equitable for riders. More funding and better traffic policies can help achieve this. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.49,fp-y:0.62,quality:80/work/Reports/2020-reports/Bikeway/Bicycle-Bike-NYC_17_v1.jpeg?bossToken=0293f81e82eaa5ea62cb7b96d910245498adeadca0f4b0f71a7d9e0c6a736c11" /> The Five Borough Bikeway Critical infrastructure connecting New York City We need an evolution in how we manage and use city streets. We need to develop a network of priority, high-capacity, protected bike lanes that serve as the heart of a comprehensive and cohesive bicycle network. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Unsorted-Report-Images/ReimaginingBQE_FeaturedImage.jpg?bossToken=ff9558c3d473d2b1e0a7c66be18e74c37ec80110fab237cee72d27eeef3161a1" /> Reimagining the BQE Policy Options to Reduce Traffic on the Brooklyn-Queens Expressway This report seeks to expand the list of realistic alternatives for restoring the Brooklyn-Queens Expressway (BQE) as a safe, efficient corridor for moving people and goods. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Unsorted-Report-Images/Parking-Lot-Shutterstock.jpg?bossToken=3217a98200d2ad5f8fda34a685be8606663a666afedc1a0d354ceae74837ed22" /> Smart Parking Solutions Alongside Pace Land Use Law Center and Tri-State Parking Initiative, RPA called for progressive parking strategies in this 2018 report such as lowering minimum parking requirements, pricing parking smartly, and establishing vehicle permit programs. read more Events E-Commerce and Land Use Regional Plan Association hosted a two-day symposium exploring the future of e-commerce in the region. This panel - one of four - focused on land use and how to optimize public spaces for e-commerce in a way that is sustainable, healthy, and economically sound. What’s Next for Open Streets? Open space and open streets have experienced somewhat of a watershed moment in the United States as an indirect result of the CODI-19 pandemic. RPA staff discuss how to build on this momentum to create lasting positive change for our public spaces. RPA Lab <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.22,fp-y:0.21,quality:80/latest/Eric-Adams-Priorities-Wikimedia-Commons.jpg?bossToken=ec8da16a5e260515fbdce42f1a8b828509cbd66f40ad49ebb751794f9d98b19d" /> Three Key Priorities For Mayor-Elect Eric Adams Adams must expand access to housing, get New Yorkers back on transit, and restore faith in government. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Flooded-Subways.jpg?bossToken=96b9b07fa9cacf61993ef6f5661d0d3535502016d0918ceb836074a3a85e91cb" /> Improving Stormwater Management in the New York City Subway How many subway entrances will flood during New York City’s next severe rain storm? We counted. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.65,fp-y:0.35,quality:80/work/Reports/2020-reports/Bikeway/BikewaysDetailedSmall_DZ_v1.png?bossToken=597971d41deb66ca5bbf75a3858e2b209c1f57e65f4402244c60c93d9afd97c8" /> Tracking Progress Towards a Five Borough Bikeway RPA updated maps from our Five Borough Bikeway report to track the city’s progress against our 425-mile vision. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Commuters-to-CBD-01.png?bossToken=e517e5e94dd0c05f734baa2aa81b5d1d3f90b2604137f38b6ef0d028ad679817" /> Can the Transportation System Handle New York’s Return to Work? How will we get people in and out of the Manhattan Central Business District post-COVID? We modeled and compared two plausible scenarios for the next six-to-nine months. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/HealthyRegionsPlanningExchange_OaklandTransitEquity.png?bossToken=5dc6a9b56ef4c7b2696e8768a4b0cb863f906956c95ca5ebcfedaf81a6cfd137" /> Oakland Offers Example of Transit Equity in Action As part of RPA’s Healthy Regions Planning Exchange, Oakland DOT Chief Ryan Russo described his agency’s efforts to make equity a central component of its work, especially its street redesigns. read more From the Fourth Plan <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/general/RPA-4RP-23-Street-Design-Priority.png?bossToken=50349eb8ee4352e313a2a646167a25b1f5068e46d76652b73ab7a58d1a880ba8" /> On City Streets, Prioritize People Over Cars RPA’s Fourth Regional Plan called for New York City to dedicate 80 percent of street space to sustainable modes of transportation by 2040. read more From the Archive <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Timeline/1975_PedestriansonSidewalk.jpg?bossToken=839a3323ec6412f8cc9252dcc58faf95275c39e19831197762130b410d225097" /> 1975 Urban Space for Pedestrians How do people walk in a city? This essentially is the subject of this report by Boris Pushkarev with Jeff Zupan. It examines how people navigate on a sidewalk or plaza, how much space they take up, and how much space they need. This was noteworthy in 1975 because so much analysis to-date focused on examining the habits of cars. read more Do you want to make the tri-state region a better place? Join the community that’s working toward that goal. become a member share Research Areas Transportation Location ConnecticutNew JerseyNew York'''
