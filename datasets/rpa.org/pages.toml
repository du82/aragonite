title = "RPA | Climate Resilience in Queens"
description = "Through a community-driven process with Make the Road New York, we’ve been learning what climate justice looks like for Queens residents by co-powering communities to turn their resilience goals into reality."
full_description = 'Climate change is impacting all of us, but working class, low-income, and immigrant neighborhoods and communities of color feel the impact more than others. Through a community-driven process with Make the Road New York, we’ve been learning what climate justice looks like for Queens residents by co-powering communities to turn their resilience goals into reality. The process and many of the resulting recommendations can be replicated in underrepresented communities across the region and the country. This campaign is conducted in partnership with Make the Road New York <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/logos/MakeTheRoadNewYorkLogo.png?bossToken=52e76a14539355b383b844e7bebcd8b7a40484e9226e4bb4764d41c9cd443cbe" /> Hurricane Ida and Housing Insecurity In 2021, Regional Plan Association and Make the Road New York collaborated to help Queens residents and Make the Road New York members tell their stories about housing insecurity. Watch the videos in English or Spanish. Produced by Evan Carter Related News New RPA Report Analyzes More than 50 Climate Adaptation Plans from Across the U.S. Apr 22 2024 in News Release RPA Comments on the New York-New Jersey Harbor and Tributaries Study Draft Integrated Feasibility and Tier 1 Environmental Impact Statement Mar 29 2023 in RPA Lab Queens Gazette Adams: Weathering the NYC Hurricane Season Is a New Game Jul 28 2022 in Media The City City Eyes New Push to Buy Out Flood-Prone Houses as Climate Change Hits Home Oct 26 2021 in Media Queens Daily Eagle Make the Road unveils plan to fight climate crisis Feb 24 2020 in Media QNS Jackson Heights immigrant advocates set their sights on climate change with new policy guide Feb 20 2020 in Media City Limits Report IDs the Social Justice Impacts of Climate Change in New York May 14 2019 in Media New York Daily News Dump the diesel buses for climate’s sake, transit experts tell MTA May 14 2019 in Media Queens Courier Heatwaves, floods and higher rents: ​‘Climate gentrification’ could hit western and central Queens, study finds May 14 2019 in Media <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_EquitableAdaptation_HealthyHomes_EnglishCover.pdf.png?bossToken=8b0c3201027015231ba50d1a3ba1df6054907365f75cc5a74221ea37d8998d52" /> Make Your Home Climate Resilient Published in English and Spanish, this guide offers simple steps any household can take regardless of income, race, or immigration status to become more resilient to climate change. view the guide Both organizations brought together technical know-how and on the ground outreach to build capacity for underrepresented communities in Queens who are typically left out of the planning process.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.44,fp-y:0.15,quality:80/headshots/Barrios_Vanessa.jpg?bossToken=67b1236c98b778bb9412a9fec9c14dbe17c13c50ce98f86231baeb71304fb341" /> Vanessa Barrios Director, Diversity, Equity, and Inclusion Initiatives read the article view full bio Reports <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Preventing-another-IDA/Image-from-Ida-Flooding-Housing-video.png?bossToken=4c1963aac6c6c87c5ff3d6ea85ceabdef1e9ce81b6e5b60874f40764540c7e1a" /> Preventing Another Ida Stormwater Management and Basement Apartments in Central Queens During Hurricane Ida, extreme rain, unlicensed apartments, and underlying socioeconomic conditions resulted in death and disaster in central Queens. These strategies can help prevent that from happening again. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.55,fp-y:0.17,quality:80/work/Reports/2020-reports/Climate-Action-Manual/ClimateActionManual_FeaturedImage_200421_011039.jpg?bossToken=6e0c67d4ffa716124110e4e9efa41d6ddf2f539bd0cd520513cebb450a879c28" /> Climate Action Manual Policies for a more sustainable and resilient New York The effects of climate change are already here and will become increasingly evident in the lives of all New Yorkers. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Unsorted-Report-Images/EquitableAdaptationProcess8_200421_153654.JPG?bossToken=9c18af707c2890e88d4377faab3485ea24cd338380aa30be7bf50f0e4f7c2539" /> Equitable Adaptation Building climate change adaptation capacity for Make the Road NY and Central Queens The effects of climate change will be felt by everyone, but some communities will face greater challenges than others, due to extreme impacts, or a lack of resources to address the challenges, or both. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Unsorted-Report-Images/EquitableAdaptationProcess5_200421_153720.jpg?bossToken=7d9d5d6c3bcdb565e3446701152e5d662cbc1a160814f33c842b58fdd2f51b58" /> The Road to Equitable Adaptation Highlights of the community process Understanding the social, economic, and political dimensions of a community, as well as geographic and physical factors, are critical to understanding how to build climate change adaptation capacity. read more <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Unsorted-Report-Images/EquitableAdaptationProcess2_200421_153723.jpg?bossToken=bbc803d43293745c2de776716e5b8154e347f4686f678fdfe2c0f5a7fafba583" /> A special thanks to every member of BASTA! and the Youth Power Project who contributed their time, energy, and power to this work, and to Cooperativa de Lenguaje Caracol (Caracol Language Cooperative) for translation services. share Research Areas Energy & Environment Location New York'
