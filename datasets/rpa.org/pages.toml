title = "RPA | Past Assemblies"
description = "Every year, we convene nearly 1,000 policy experts, public officials, and business leaders at the RPA Assembly to debate bold solutions for the tri-state metropolitan region’s most pressing challenges: addressing climate change, promoting inclusive growth, and developing transportation systems that work for all of us."
