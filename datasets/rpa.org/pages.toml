["https://rpa.org/work/campaigns/adapting-to-climate-change"]
title = "RPA | Reducing Emissions & Adapting to Climate Change"
description = "RPA is researching and advocating for policies that ensure our region is both mitigating and adapting to the impacts of climate change."
full_description = '''Our region has committed to hit ambitious climate targets that approach or achieve carbon neutrality by mid-century. This requires an aggressive shift away from the status quo, and we must ensure that we address the climate crisis in ways that don’t trigger other crises of equity, affordability, or economic decline. Yet, even if we achieve these goals, we still must take steps to adapt. RPA is researching and advocating for policies that ensure our region’s communities and infrastructure are resilient to the impacts of climate change while reducing the severity of future impacts by decarbonizing the region’s buildings, transportation, and energy systems. Related News Testimony to NY’s Public Service Commission in Support of Offshore Wind Transmission Project Feb 26 2025 in Testimony CT Mirror CT plan centers climate change in conservation, development Feb 7 2025 in Media History of the Grid and Major Projects Feb 5 2025 in RPA Lab RPA Statement on New Jersey’s Decision to Not Advance Offshore Wind Projects in Fourth Solicitation Feb 4 2025 in News Release NPR Here’s how Trump’s pause on wind projects could threaten jobs and climate goals Jan 24 2025 in Media New York Focus Trump Throws Wrench Into Offshore Wind, Putting New York’s Clean Energy Plans In Doubt Jan 23 2025 in Media RPA Statement on Executive Order to Halt Offshore Wind Leasing Jan 21 2025 in News Release RPA Celebrates the Advancement of the Congestion Pricing Program Nov 13 2024 in News Release RPA Public Comment on New Jersey’s Protecting Against Climate Threats (NJPACT) Resilient Environments and Landscape (REAL) Rules Nov 7 2024 in Testimony Staten Island Advance Activist organization demands ​‘full approval and funding’ for this Staten Island construction project Sep 29 2024 in Media Joint Statement on LL97 GreenHOUSE Fund Sep 26 2024 in News Release POLITICO Election concerns loom Sep 23 2024 in Media RPA and Karp Strategies’s New Report Highlights the Critical Role Ports in Clean Energy’s Infrastructure and Highlights Advancements Needed to Reach Climate Goals Sep 23 2024 in News Release POLITICO Major state agencies fail to comply with climate law, report finds Aug 8 2024 in Media Crain's New York New York is barricading itself against floods Aug 7 2024 in Media CNBC U.S. Cities are Sinking. Here’s What that Means for Homeowners Jul 11 2024 in Media Expanding NYC’s Urban Forest Jun 6 2024 in RPA Lab Smart Cities Dive What 54 climate adaptation plans say about how communities are preparing Apr 24 2024 in Media New RPA Report Analyzes More than 50 Climate Adaptation Plans from Across the U.S. Apr 22 2024 in News Release Statement on MTA board vote in favor of congestion pricing Mar 27 2024 in News Release Climate change is here. The longer we put off addressing its root causes and preparing for its impacts, the more often we’ll be left to reckon with its aftermath.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.44,fp-y:0.32,quality:80/headshots/Freudenberg_Rob.jpg?bossToken=50c8f54ce05a687238b6a699d49aab6f1c2c3d65dd77183b35f0d781b8777a06" /> Robert Freudenberg Vice President, Energy & Environment view full bio Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2023-reports/Offshore-Wind/Offshore-Wind-Cover2.png?bossToken=fb66131acc9f77cef3761995e0cfd9202ea2c0febbc599058e179008c3aea81a" /> Making Offshore Wind Transmission Work for Communities By 2030, NY and NJ’s first offshore wind farms could be operating, helping to achieve clean energy goals. But getting there will require collaboration, engagement, and wise investments for beneficial community outcomes. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Resilience-Map/Resilience-Map-background-image.png?bossToken=8c639a8786649e708169f484d910da988f022a119cc67a968cf2017a2fef8778" /> Sandy10 Community Resilience Plans Map Recognizing all the incredible work that has happened since SuperstormSandy, we have developed an interactive mapping tool to showcase the planning and visioning efforts that have occurred. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Renewable-Rikers/Renewable-Rikers2.png?bossToken=9f81ca65d29de3ec4cf27e0510c34ff85d2e810c38609523cf058c7d45f12df7" /> A Plan for Renewable Rikers As part of its 2022 Richard Kaplan Chair for Urban Design Fellowship, Regional Plan Association commissioned a vision for how the design of a Renewable Rikers could look and function. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/green-building-renewable-energy.jpg?bossToken=232d8a8dc57bd6f3bcc4730fdaa020655a7b1c655a0de4e9a6d9efaf61a092b3" /> The Beginning of the End of Gas in New York The transition away from natural gas may take 30 years, but it has started in earnest in New York State and New York City. Both are banning gas in new buildings. signaling a major transformation towards electrification. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Flooded-Subways.jpg?bossToken=96b9b07fa9cacf61993ef6f5661d0d3535502016d0918ceb836074a3a85e91cb" /> Improving Stormwater Management in the New York City Subway Up to 20% of all subway station entrances — more than 400 in total — could be affected by an extreme rain scenario, also known as a​“once-a-century” flood. To prepare, city agencies have to begin collaborating much more closely. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Right-of-Way/ROW-Rendering_5.jpeg?bossToken=725f10acdcc4ee453f2cb8c45bbb852f762d85319f0791fef442cb18690da70f" /> Re-Envisioning the Right-of-Way New York City can use our 32,000 acres of roadway to prevent flooding and adapt to climate change, support transportation alternatives and better goods movement, and expand access to economic opportunity. Here’s how. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.65,fp-y:0.35,quality:80/work/Reports/2020-reports/Bikeway/BikewaysDetailedSmall_DZ_v1.png?bossToken=597971d41deb66ca5bbf75a3858e2b209c1f57e65f4402244c60c93d9afd97c8" /> The Five Borough Bikeway Critical infrastructure connecting New York City Securing a carbon-free future requires that we change our infrastructure so that biking can become as accessible and common tomorrow as driving is today. read more Action Hurricane Sandy 10 Year Anniversary RPA organized and delivered testimony at an NJ Assembly hearing about the future of resilience in the Garden State 10 ears after Hurricane Sandy. read the testimony Electric Buildings RPA testified in support of the New York Assembly’s efforts to advance building electrification. The sooner New York advances these policies the cheaper the clean energy transition will be. read the testimony Flooding in New York City RPA voiced our support for amending the Zoning Resolution of the City of New York to modify its provisions for what can and cannot be constructed in current and future flood zones. read the testimony Statement on Hurricane Ida What wildfires are to the western United States, water is to the tri-state region. As a region and nation, we must work together to solve the challenges posed by increasingly severe storms. read our statement <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Governors-Island-Climate-Park.jpg?bossToken=6ea700503014dcec983e797d059dac125fabbd98eca8df87cc319f061f3e80bd" /> Climate Change Center on Governors Island RPA supported the Governors Island rezoning and offered recommendations to the Department of City Planning to ensure a climate research center materializes on the island a result of the rezoning. read more The Nation's First Purpose-Built Wind Port RPA praised Governor Phil Murphy’s administration for announcing that New Jersey would become home to the nation’s first port for the construction of offshore wind infrastructure. learn more RPA Lab <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/IMG_8743-IMG-file.jpg?bossToken=6c10bf9e5415fdc5e4ea5c59268dccf9b31627629108866b34b5d07f63a86d1c" /> Celebrating the History of NJ's Parks and Open Spaces As part of its Centennial and with support from the New Jersey Council for the Humanities, RPA organized three park and open space events in the Meadowlands, at Nat Turner Park in Newark, and at the Paterson Great Falls. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Tier-4-Renewable-Energy-Rally-4.6.JPG?bossToken=0e80993451e2a144bb180332112d945f00cbfe3c55343a49b733b2e6ef8a3bb3" /> "Tier 4" Policy Necessary for New York's Renewable Energy Revolution The ​“Tier 4” transmission policy is key to unlocking the full benefits of renewable energy in New York State. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/Iconic-images/Iconic-RPA-map-on-blue_2021-03-15-194020.png?bossToken=33b5720224f3de214105e09b61d406fcf83b0f3b9408ee47b7215f49e5ee2a4f" /> Federal Infrastructure Packages Will Deliver for Tri-State Region We break down how the Bipartisan Infrastructure Framework will impact the tri-state region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Flushing-Queens-Flooding-Stock-Photo-Wikimedia-Commons-3.jpg?bossToken=ca66ae19b0fec319f2defa2ed0875945acca12b7300538a4854ea11c7dfc4150" /> Measuring Flood Risk in New York City Housing and Basements Approximately 180,000 small residential buildings in New York City remain vulnerable to high-intensity rainfall flooding. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Metro-Survey/SurveyPattern-01_2021-03-24-204408.png?bossToken=7cf408d59d2c884068b09b615e8305c889e9901b8562a1b9dfb9878ff81e05f8" /> Metro Area Residents Support Dramatic Action to Address Climate Change Residents are deeply concerned about climate change and support dramatic measures to do something about it. read more From the Fourth Plan <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/Archive-Featured-Reports/Fourth-Plan/Color-4RP-Logo-SML.png?bossToken=aae83c9dd7c3e35e9873f1f8ec70812ac04045a59a48ef0f9d261ef7b4ff1bb4" /> All of RPA's research and advocacy is guided by the Fourth Regional Plan. Published in 2017, the plan offers 15 recommendations to help the region rise to the challenge of climate change. visit fourthplan.org From the Archive <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Timeline/1973_OilCrisis_WikimediaCommons.jpg?bossToken=a9cd32d627c1f335825b7720d29e15c5ca21f610e4c339aab3664398959bb14a" /> 1973 Regional Energy Consumption Amidst the national oil crisis in 1973, RPA evalu­ated energy consumption trends and energy conservation oppor­tunities in the New York metropolitan region. read more For 100 years, RPA has guided the growth of the tri-state region with independent research and advocacy. Help support our work. support rpa share Research Areas Energy & Environment Location ConnecticutNew JerseyNew York'''
