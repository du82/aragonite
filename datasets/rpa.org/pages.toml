["https://rpa.org/about/timeline"]
title = "RPA | Timeline"
description = "In 1922, some of the region’s most prominent urban planning experts and civic leaders joined forces to survey, analyze, and develop a comprehensive plan to make the region a better place to work and live. Nearly 100 years later, Regional Plan Association has developed and promoted ideas to improve the economic health,…"
full_description = '''1920 s 1920 1930 1940 1950 1960 1970 1980 1990 2000 2010 2020 1920 s 1922 First Meeting of the Committee on the Plan of New York and its Environs Regional Plan Association’s origins can be traced back to the early 1920s, when the Russell Sage Foundation appointed the Committee on the Plan of New York and its Environs. The Committee’s goal was to plan the development of the region and enhance the quality of life of residents, without regard to political boundaries. The first Committee meeting was held on May 10, 1922 and included attendees such as Herbert Hoover, Charles Dyer Norton, Elihu Root, Lillian Wald, Charles Dana Gibson, and Mrs. August Belmont. read the meeting minutes <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1922_MeetingTicket.jpg?bossToken=041e98aeb6ffd1f71230e2acd9f61a45aa6224680793824ff35262265972a808" /> Invitation to Committee Meeting 1923 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1923_New-York-Times-on-the-Regional-Plan_scan.jpg?bossToken=16ecc7026389d5c22d621864a53042274c6294960b097f758e9fc22f79e28ba0" /> Plan Announced to Develop City and Environs <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1923_RPA-Parks-No-16-Suggested-Rearrangement-of-Gramercy-Park-M600.jpg?bossToken=442c0f40251454cf534dea15120d265ca6220b99ed8b0b804add718081e85d09" /> Suggested Rearrangement of Gramercy Park <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1922-Railroad-Commuting-Time-96.jpeg?bossToken=2f59bb1ef6d9be04ebcc425dad4e3021ed2c46023df0b42f7c75bee0f8c60d07" /> Railroad Commuting Time To and From New York City Terminals <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1914-1923-Land-Values-Manhattan-096.png?bossToken=66601b080b50187f5e79bf85e5373a1128bddaaffcd7b40c77e819401fe16281" /> 1914-1923 Land Values Manhattan 1927 Regional Survey of New York and its Environs, Volumes I-VIII From 1927 to 1929, a series of ten technical volumes on manufacturing, transportation, and community planning were published as precursors to the first Regional Plan. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1927_Publications-of-RPA.jpg?bossToken=25d715a74bcfd95eec62569e3e8edb16ccbccd18d805cf6241d7d13178df0e6f" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1927_altImage1.jpg?bossToken=d424d83c83eea13d4dead25232619008c20cca6a27b8aa632c272e38fd2350da" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1927_RPA-Plan1-v1-New-York-Region-Painted-by-Jules-Guerin-150_resized.jpg?bossToken=aa98869d2a7ada77a1bb7f5a9c916384c54a50d3080c417e2d83e943cf09c283" /> 1929 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1929_RPA-Certificate-of-Incorporation-S600.jpg?bossToken=6d9283f210e166a3d0060a885d12c16d7e6300a404b02fb7379d065b8d641f7b" /> RPA’s Incorporation Regional Plan Association formally incorporated in 1929 to foster county, city, town, and village planning, and to help make the First Regional Plan a reality. view the certificate of incorporation <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/1929_RPA-Plan1-Cover.jpg?bossToken=da0830b956ff4de2dc9915b38002b2edfcecde98a3395ad2751d507803938cbc" /> Regional Plan of New York and Its Environs The First Regional Plan was a major advancement in the field of urban planning. Previous efforts had generally focused on individual cities, rather than on large areas encompassing many urban centers and stretching across state boundaries. The First Volume proposed an elaborate network of highways, railroads, and parks, along with residential and industrial centers, for the region. learn more video by Nate Dorr 1930 s 1930 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1930_george-mcaneny.jpg?bossToken=14c19d0c22349c6061e8a0f7cddce1cbdea6d566d974ce6bd8b7206d2a7a6416" /> New York Preservation Archive Project George McAneny, RPA's First President As RPA’s President for its first decade, George McAneny worked to turn the ideas of the First Regional Plan into reality. George McAneny also served as Manhattan Borough President, Comptroller of the City, and coordinated the 1939 World’s Fair. learn more about George McAneny How Swamp Lands May Be Reclaimed The Meadowlands are wetlands located in Northern New Jersey that serve as a sanctuary for wildlife and a critical convergence of infrastructure. At the turn of the century, several planners in Newark and New York wanted to develop rather than preserve the Meadowlands as open space. In 1930, RPA released a report which recommended filling in the Meadowlands to create a city large enough to accommodate five million people. The cost of filling in the ​“swamp lands” was estimated to be $125 million in 1930. In later years, RPA would come to recognize the importance of preserving wetlands. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1930_NYTimes_Meadowlands2.png?bossToken=a9ad80797fd3e8e9ccbae9a0069b354e3e600dad5431264e6d688777839d1449" /> New York Times 1931 RPA’s First Bulletin “The housing problem is essentially social, but it cannot be solved without taking into consideration the economic factors with which it is inseparably associated.” read the full bulletin <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1931_Housing-Conditions-in-the-New-York-Region_Page_1v2_200329_221737.jpg?bossToken=0cc9e503a4915cceba36b45cc0f68a851f286beb1f63a162b5bf416eb3517e91" /> The First Regional Plan, Volume II The Second Volume of the First Regional Plan focused on urban design, including the relationship of development to open space, fitting buildings to streets, and pedestrian ways separated from vehicle traffic. learn more <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1931_1stPlan_Vol2_TitlePage.jpg?bossToken=ddbee5a861ed40af1b4a5109d658135e5a2812373090091ca474661382935266" /> 1933 The Rebuilding of Blighted Areas “The Rebuilding of Blighted Areas” is a Depression-era book that defined blight and suggested policy solutions, such as public housing projects and slum clearance through eminent domain. It specifically highlighted Manhattan’s Lower East Side. In earlier publications, RPA recommended the construction of a riverfront park of 50 to 100 acres and the acquisition of a number of playgrounds to improve living conditions in the Lower East Side. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1933_Tenement-Backyard.jpg?bossToken=569f5d0aa4b147cf6a24c54f4b47bea7fb512e368f150beadf1edb3fa5355173" /> Illustration from the first Regional Plan <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1933_HousingModelsDiagram.jpg?bossToken=238975f61b8b5cface02b1572b6540e0605649536608c177a185bde8d9d6bccc" /> 1936 Expansion of Public Parks The First Regional Plan identified natural areas that could be acquired for public use. The First Plan was an important factor in increasing the region’s park space, as well as the establishment and expansion of key sites like Garret Mountain Reservation in Paterson, NJ, Great Kills Park on Staten Island, and the Palisades Interstate Park System. In 1933, John D. Rockefeller Jr. offered to transfer 265 key acres on top of the Palisades to the Palisades Interstate Park Commission along the general lines recommended by the Regional Plan. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1928-General-Plan-of-the-Park-System-150.jpg?bossToken=342977b995bfefcdb9ce95de6e1d3b6b4fc3ff61eb25dbb0652ba562d2a40717" /> Increase in Planning Boards and Creation of the NYC Planning Commission From 1929 to 1939, the number of planning boards in the region increased from 61 to 204. In 1936, the planning commission for New York City was formed. RPA’s chief administrative officer at the time, Lawrence Orton, was one of the first commissioners, and he served in that role for 31 years. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1940_CountyPlanningChart.png?bossToken=03bfc3fba1f3889e32f0863104c9594da86a9174c3d9a6f4c5cf181673cc9be9" /> 1937 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1937_Drive-is-Pressed-to-End-Pollution_NYTimes-page-001_200409_001023.jpg?bossToken=5ca36a9146dbfc5de7e260e767ad44940a1f9e297d7688aadc4293a008e1b56f" /> New York Times <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1936_Steady-Growth-Seen-for-Fairfield-County-page-001_200409_001054.jpg?bossToken=7834d130db58e638b361bf5135f07e1c2e9ede76aa0485fd0d2429b8f9ac7882" /> New York Times 1939 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1939_BrooklynBatteryTunnelRPARendering.jpg?bossToken=99c7954180104224e0f651f566e0902903c34d2e153b07aa17cdb07571e17c69" /> Opposition to Battery Park Bridge RPA opposed Robert Moses’s proposal to build a bridge from Manhattan’s Battery Park to Brooklyn. Instead, it recommended a tunnel between Brooklyn and the Battery. The tunnel was completed in 1951. see more images 1940 s 1940 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1944_UrbanExpansion.jpg?bossToken=430a7047d72b9fb2931997ae8c428d283bd035224b6eeba4e45732b405a79db5" /> Where People Crowd Together 1941 Region’s Highway and Parkway Networks The region’s highway and parkway network followed RPA’s proposals very closely, beginning in the 1920s when the planned location of the George Washington Bridge was moved from 57th Street to 178th Street. Construction happened quickly and between 1928 and 1940, more than a third of RPA’s 2,548-mile highway program was completed or in progress. By the time of RPA’s 25th anniversary, more than 400 miles of the arterial parkway system was developed, including the Belt Parkway, Henry Hudson, and East River Drive. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1941_GWB_RPA-Plan1-v2-174-Architects-Drawing-Hudson-River-Bridge-600.jpg?bossToken=0dd38470b65f3a390ad78c62acb230885681e397c2037f7af3d0e04153765a27" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1941_Highways.png?bossToken=10959c355b76d6fdab1c22f63299be6426592bc9e7f5e756b42d6a83d0cf1e6f" /> 1942 Traffic and Parking Study: A Plan for Improvement in the Central Business Areas of New York City RPA’s campaign for congestion pricing in Manhattan is decades-old, with the roots going back to a 1942 study of parking and traffic issues. RPA analyzed the number of vehicles entering Manhattan south of 61st Street, and found that approximately 75 percent of vehicles stopped to park or unload goods in the central business district. In order to cut down on congestion, parking facilities were recommended by transit stations in other neighborhoods, such as Flushing, Queens. Read the full report <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Reports/Archive-Featured-Reports/Traffic-and-Parking-1942/1942-Parking-Study6.JPG?bossToken=dad208df541b5195b5ac8b671afdcff8ad2f6845d33e91a2784ec2c35b5a8ac1" /> 1943 RPA’s Office in the 1940s See full video Prelinger Archives collection via SehgalTV. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1943_RPA-office-01.jpg?bossToken=0da3169371af5994b9ca27b79d890301073282df2d2234f437e53cabd8c31ba5" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1943_RPA-office-02.jpg?bossToken=27ce7ced1f261cc2a32db5170f545968f3a6f841250d84b8fe3d789d8075028c" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1943_RPA-office-03.jpg?bossToken=0897a4dcea3e04ec86f9c8b6cd24cb4b77106bb5afc3a24d6678b441d430567f" /> <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1943_RPA-office-04.jpg?bossToken=f48b8e76b581fe306905fee2e4c5b175f10b290466b673880b05ba7bf8a8026b" /> What the People Think of Their City: An Appraisal of Public Opinion “The Regional Plan Association presents the results for New York City of a National Public Opinion Survey on city life and problems.” read the full report <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1943_RPABulletin61__Page_01.jpg?bossToken=4e4bd78b16941f5bc9d2aade58ce4d32edf2d9a21a028de5885114d35e829d27" /> 1944 National Defense in the New York Region, and Meeting Wartime Demands for Passenger Transportation During WWII, RPA directed its efforts toward bridging political boundaries and facilitating the cooperation of governmental agencies in the region to address housing, transportation, and civilian protection efforts. RPA estimated that $1.5 billion out of the $12.5 billion defense con­tracts allocated through January 1941 would be spent in northern New Jersey, southern New York and Fairfield County, Connecticut. It was also noted that the region would be facing housing and transportation issues due to the convergence of workers on defense industry centers. In a follow-up bulletin published in 1942, RPA highlighted wartime demands for passenger transportation and called for the establishment of a regional office of war transportation for the New York-New Jersey-Connecticut metro­politan area. read one of the reports <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1944_WWII_DomesticLogistics.jpg?bossToken=af1fd8a42714b51fdfd8553116ba9b7773a4dce115c146e813d6905e2daad31b" /> 1945 <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1946_HousingForYourTown_Cover.jpg?bossToken=f334a8f28bf0248636c5384aabe4b6460fb17ac9a3d7f4cc031d84e68028dc91" /> The Postwar Explosion The New York-New Jersey-Connecticut metropolitan region changed dramatically after WWII. In the 1930s, 55 percent of the Region’s population growth was in New York City. After the war, there was a massive move to the suburbs. In just 15 years, the suburban population doubled, and the new road network encouraged sprawl. RPA identified land that should not be built on - steep slopes, marshes, and soils of high agricultural value - and land best suited for development, based on proximity to public transportation and to Manhattan. RPA also advocated for comprehensive comm'''
