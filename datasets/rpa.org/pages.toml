title = "RPA | Statement on Congestion Pricing Going into Effect in NYC"
description = "Regional Plan Association works toward a better future for the tri-state region"
full_description = 'share Statement attributable to Tom Wright, President and CEO, and Kate Slevin, Executive Vice President of Regional Plan Association: We celebrate a historic moment for the future of our public transit systems, health and our economy in New York and the entire tri-state region. New Yorkers can be proud to set an example as the nation’s first city to implement a congestion pricing program: a proven, globally-adopted policy that will fund our public transit systems, improve our air quality, and improve commutes for millions of transit riders while reducing traffic for drivers. Congestion pricing will generate vital funds for the critically-needed maintenance and improvement of regional transit, making possible the development of the MTA Capital Plan, advancing economic growth, and driving sustainability for the NY/NJ/CT region’s $2 trillion tri-state economy. RPA has been an advocate of congestion pricing for decades, and today we are proud of the research, advocacy and collaboration of all our colleagues and many allies who helped implement this transformative policy. Written by <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.49,fp-y:0.34,quality:80/headshots/Tom-5-1.jpg?bossToken=82c1f5a06aa5dc1acecbbca2ef17eb70f844b47f3d40b828dc922cd1e8d67a3d" /> Tom Wright President & CEO <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.51,fp-y:0.41,quality:80/headshots/Slevin_Kate.jpg?bossToken=4ef64dc431ad6c63b2d6efc7fe2bc1ac5b96702e8da774915a353fb7ee753429" /> Kate Slevin Executive Vice President Related News-Release Posts Feb 2025 in Transportation Congestion Pricing Now Coalition Statement on Trump Administration Plan to Revoke Congestion Pricing Feb 2025 in Transportation RPA Statement on Trump Administration Plan to Revoke Congestion Pricing Jan 2025 in Transportation Statement from the Congestion Pricing Now Coalition on a Historic and Promising First Week Dec 2024 in Transportation RPA Response to the Congestion Pricing Challenge Decision Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
