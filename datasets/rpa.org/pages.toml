title = "RPA | Penn Station"
description = "Public for Penn Station is a commuter advocacy campaign combining transit and planning expertise with grassroots energy to increase the pressure on local, state and federal leaders to address the Penn Station nightmare."
full_description = '''Public for Penn Station, a commuter advocacy campaign launched in 2018, brings together transit and planning expertise and grassroots energy to increase the pressure on our local, state and federal leaders to finally address the Penn Station nightmare before it’s too late. Our campaign pushes our elected leaders to put forward a comprehensive and feasible plan that addresses the capacity and safety issues that plague commuters. Follow Public for Penn Keep up with the coalition on Twitter, Facebook, and Instagram. Related News RPA Statement on the Selection of Thomas Prendergast as CEO of the Gateway Development Commission Jan 16 2025 in News Release NJ Spotlight News High stakes for NJ amid Penn Station controversy Oct 8 2024 in Media The New York Times Penn Station Must Expand to Improve Service, Railroads Say. But How? Oct 2 2024 in Media Expanding Capacity and Improving Penn Station Sep 17 2024 in RPA Lab Spectrum NY1 Penn Station Changes Outlined in Proposal Aug 5 2024 in Media RPA Testimony for NYC City Council Zoning Subcommittee Meeting on MSG Special Permit Renewal Jul 19 2023 in Testimony RPA Testimony on Madison Square Garden Special Permit for the City Planning Commission Jun 7 2023 in Testimony Testimony to the New York State Senate Joint Public Hearing on the MTA’s finances, ridership, and future plans for Penn Station Mar 3 2023 in Testimony Statement on MSG Operating Permit Renewal with NYC Feb 14 2023 in News Release The New York Times Penn Station Plan Makes a High-Stakes Bet on the Future of Office Work Aug 29 2022 in Media Statement on NY Penn Station General Project Plan Jul 21 2022 in News Release New York Post Gov. Kathy Hochul commits state money to cover $5B Penn Station rehab tax grab Jul 18 2022 in Media Politico Hochul, Adams strike cost-splitting deal for controversial Penn Station project Jul 18 2022 in Media Joint Statement on Congestion Pricing Environmental Review Jun 29 2022 in News Release Statement on MTA’s Progress on Congestion Pricing Environmental Review Jun 29 2022 in News Release NJ.com These 4 options for NY Penn Station addition could make your commute less hellish Jun 24 2022 in Media Crain's New York Business Op-ed: To fund transit projects, we have a mechanism that works Jun 23 2022 in Media NorthJersey.com Amtrak taps firm to lead design of new Penn Station tracks. And a new report has some ideas Jun 23 2022 in Media NJ.com Designs for reimagined N.Y. Penn Station due in July, but obstacles, objections remain Jun 9 2022 in Media RPA Statement on Design Process for Penn Station Renovation Jun 9 2022 in News Release Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Scenario-Planning-Gateway/Gateway-Scenario-ArrowArtboard-1@3x-100.jpg?bossToken=9e396be70dddd644e1ac651e5a038573c40bd211c1c66a2c3c0ad67484d743fc" /> Gateway and the Post-COVID Economy Scenarios for Future Growth and Trans-Hudson Travel Transit trips across the Hudson River will continue to grow beyond the region’s current capacity. Without the infrastructure to meet this demand, the region’s economic growth and sustainability are in jeopardy. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.36,fp-y:0.67,quality:80/work/Reports/2019-Reports/Case-for-Penn-South/Report-PennSouth-Crowd-shutterstock_654218764.jpg?bossToken=261400715fc06de7041c6793ff8c3de8ca034eb733891164327175dbc2ef9c03" /> The Case for Penn South The capacity that would be added by Penn Station South is desperately needed, both to relieve overcrowding at Penn Station and to accommodate the future demand for rail transportation in the region. read more Action Penn Station General Project Plan RPA President Tom Wright testified in support of the plan to renovate and expand Penn Station during a crucial state hearing on the project. read the testimony <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Campaigns/Hochul_TKW__2_11.3.2021.jpg?bossToken=a32c184f95b4c0cd9663cd5f6c34ad3650f58c0d1876234215915ec7861c06aa" /> New Penn Station Renovation Plan RPA President Tom Wright joined New York Governor Kathy Hochul as the Governor announced updated plans to renovate Penn Station in November, 2021 (watch the press conference). New York Governor Kathy Hochul Empire Station Complex in 2021 NYS Budget RPA and several civic groups urged New York State lawmakers to make funding for the Empire Station Complex conditional on the adoption of a comprehensive approach and master plan for the area. read the statement Empire Station Complex Project At the public scoping hearing for the Empire State Complex project, RPA commented on aspects of the project and called for the plan to include a greater level of detail overall. read more Responding to Penn South Announcement RPA responded to Governor Andrew Cuomo’s announcement of the expansion of Penn Station to the south to create an Empire Station Complex. read the statement Doing nothing on Penn Station cannot be an option. Ridership has the potential to increase by as much as 150,000 people by the year 2040. We want these commuters on trains, and not adding to the congestion on city streets.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.49,fp-y:0.34,quality:80/headshots/Tom-5-1.jpg?bossToken=82c1f5a06aa5dc1acecbbca2ef17eb70f844b47f3d40b828dc922cd1e8d67a3d" /> Tom Wright President & CEO view full bio Principles for a Better Penn Station Capacity A plan must address the current and future capacity needs of Penn Station; built to accommodate 200,000 passengers per day, the station now operates at more than three times intended capacity with double-digit growth projected over the next twenty years (RPA estimates that ridership through Penn Station will increase by 40% as more commuters travel from New Jersey to New York City)Safety In the event of a fire or terror-related emergency, commuters must be able to quickly, easily and safely exit the station regardless of where they are insidePassengers must have comfortable areas to wait for trains within Penn Station so they are not forced to congregate around track display monitors or outside platform doorsCommuters must be able to exit platforms immediately upon stepping off trains, without having to wait in line for escalators or stairsDignity No matter the season, temperature inside the station must be comfortable for commuters, without extreme heat or cold, including on the platform levelPenn Station must be fully ADA accessible, allowing all passengers, including those with limited mobility to be able to easily go from level to level within the station at all hours, including rush hourNew Yorkers must have a world-class gateway worthy of the busiest transportation hub in the Western HemisphereEquity Regardless of whether passengers are coming from the NYC Subway, Long Island Rail Road, Metro North, New Jersey Transit or interstate travel via Amtrak, they must have access to adequate waiting areas, restrooms and reasonable amenities within the stationCommunity The station must seamlessly blend with surrounding buildings and the streetscape to create a welcoming, safe environment that complements the neighborhoodAs a modern, 21st-century transit hub, Penn Station must be designed with pedestrians and cyclists top of mind, offering ample bike parking, bike share docking stations and easily accessible restrooms and water fountainsSustainability Any new major infrastructure endeavor on this scale must consider its environmental footprint; best practices may include repurposing existing elements of the station and leveraging energy efficient design, such as passive heating and coolingFeasibility New York’s leaders must take advantage of the once in a generation opportunity to fix Penn Station while there are temporarily fewer passengers using the space as the result of the opening of East Side Access and Moynihan Train HallWith MSG’s operating permit set to expire in 2023, there must be a clear plan to move Madison Square Garden so that safety and capacity can be drastically improvedThe priority use and functionality of the future station must be to serve commuters Supporters For far too long, the greatest city in the world has been saddled with one of its worst major transit complexes in the form of Penn Station. It’s time to chart real, concrete solutions to provide midtown Manhattan with the new hub we need.” Manhattan Borough President Gale A. Brewer More people enter Penn Station on a daily basis than the entire population of Portland, Oregon, and Las Vegas. While it’s the nation’s busiest train hall, it’s also crucial that we get a plan for Penn Station that takes into consideration the local neighborhoods and businesses which I represent.” New York State Senator Brad Hoylman, District 27 From the Fourth Plan RPA’s Fourth Regional Plan outlined a comprehensive plan to expand, overhaul and unify the Penn Station complex. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_PublicforPenn_PennStationComplexMap.png?bossToken=a3592750baa44dea794c67de6691f65e4ff2ff0dae800245b8c9ba0f851fdd5c" /> Related Reports Unlocking Penn’s Potential, Municipal Art Society 2013 Penn 2023: Envisioning a New Penn Station, the Next Madison Square Garden, and the Future of West Midtown, the Alliance for a New Penn Station Madison Square Garden: Shaping the Future of West Midtown, the Alliance for a New Penn Station “Rebirth of a Gateway” Moynihan Station, Regional Plan Association Re-imagining Penn Station, Penn Design share Research Areas Transportation Location New York'''
