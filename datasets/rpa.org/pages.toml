title = "RPA | Congestion Pricing Now Coalition Statement on Trump…"
description = "Regional Plan Association works toward a better future for the tri-state region"
full_description = 'share The following is attributable to the Congestion Pricing Now Coalition: Congestion pricing works, and the data proves it. Commute times are shorter for everyone – both drivers and mass transit riders – and our streets are safer and more lively than before. More than that, it’s the law. Any attempt to kill this program, which was authorized by the federal government, is an unwarranted intrusion into state and local governance. Interference from the federal government will waste taxpayer dollars on lawsuits, upend critical congestion relief and the cleaner air that goes along with it, derail vital transit upgrades that are already underway and the roughly 100,000 jobs they support, and hurt millions of daily transit riders across the tri-state region. We call on all of New York’s leaders to defend New York’s congestion pricing plan and protect a program that’s delivering real results for our region Written by <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.45,fp-y:0.35,quality:80/headshots/Sam-1a-Copy.jpg?bossToken=d58b58771af88e84750022950f75663a4ef37934c6276be378e0b9afb7d9c9e3" /> Sam Bowden Akbari Director of Communications Related News-Release Posts Feb 2025 in Transportation RPA Statement on Trump Administration Plan to Revoke Congestion Pricing Jan 2025 in Transportation Statement from the Congestion Pricing Now Coalition on a Historic and Promising First Week Jan 2025 in Transportation Statement on Congestion Pricing Going into Effect in NYC Dec 2024 in Transportation RPA Response to the Congestion Pricing Challenge Decision Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
