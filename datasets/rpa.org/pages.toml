title = "RPA | Transportation in the Region"
description = "RPA is researching and advocating for the infrastructure improvements we need to support sustainable and accessible transportation in the region."
full_description = '''Post-COVID travel patterns have placed new demands on all of our region’s transportation systems. RPA is tackling the challenges of aging and deteriorating systems, lack of sufficient funding, outdated and inefficient delivery methods, and obsolete street designs that prioritize private vehicles over more community needs. We celebrate the upcoming implementation of congestion pricing in New York City, and federal funding for Gateway, while advocation for permanent open streets and open dining programs, and more sustainable freight movement and micro mobility. Related News StreetsBlog NYC Memo to the President: Manhattan Economy Improving, Thanks to Congestion Pricing Feb 27 2025 in Media News12 New York Congestion pricing brings in $48.6M in first month, as officials wait on decision for toll’s fate Feb 24 2025 in Media amNY Congestion pricing: What major NYC subway and transit projects are at stake if Trump kills Manhattan toll plan? Feb 23 2025 in Media PIX 11 Congestion pricing remains in effect in NYC during legal battle Feb 20 2025 in Media Slate Revenge of the Bridge-and-Tunnel President Feb 20 2025 in Media Congestion Pricing Now Coalition Statement on Trump Administration Plan to Revoke Congestion Pricing Feb 19 2025 in News Release RPA Statement on Trump Administration Plan to Revoke Congestion Pricing Feb 19 2025 in News Release BBC BBC World Business Report, 2/19 Feb 19 2025 in Media Gothamist Vehicle Traffic is Down in Manhattan, but Pedestrian Traffic is Up, Data Says Feb 13 2025 in Media StreetsBlog NYC Earth to Albany: Don’t Pander to Every Driver in the City with Toll Exemptions Feb 5 2025 in Media RPA Testimony on MTA’s 2025-2029 Capital Plan Feb 5 2025 in Testimony RPA Testimony to the Gateway Development Commission Feb 3 2025 in Testimony NorthJersey.com Could Trump executive order hold up money for NJ Transit projects, Gateway tunnel? Jan 27 2025 in Media Spectrum NY1 Large transit projects will continue under Trump administration Jan 17 2025 in Media RPA Testimony to the Gateway Development Commission Regarding New Leadership and Continued Progress Jan 16 2025 in Testimony RPA Statement on the Selection of Thomas Prendergast as CEO of the Gateway Development Commission Jan 16 2025 in News Release StreetsBlog NYC Watchdog Group: No Congestion Pricing Toll Exemptions for Cops! Jan 16 2025 in Media The New York Times What Happens When There Are Fewer Spaces to Park? Jan 12 2025 in Media Statement from the Congestion Pricing Now Coalition on a Historic and Promising First Week Jan 10 2025 in News Release NJ Spotlight News NYC launches congestion pricing, NJ vows to fight on Jan 6 2025 in Media Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.18,fp-y:0.18,quality:80/work/Campaigns/Campaign_FeaturedImage_Build-Gateway-Now.png?bossToken=2fe1a1a4243d628a61e64944be23ee03076a7398c4e0eb41b067092a722515da" /> The Gateway Program Build Gateway Now is a coalition of civic, labor and business leaders building support for the construction of a new rail tunnel to connect New York, New Jersey, and the entire Northeast Corridor. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2023-reports/Commuters/commuter-patternArtboard-3@2x.png?bossToken=569fd140257f34afb44b5e2577765a7e425531e5dc64a811f9f1dfb41ecea7d5" /> Commuter Dividend The Economic Value of Commuters for City and Suburbs in the New York-New Jersey-Connecticut Region Whether going into the office or working from home, commuters are a vital source of jobs and income throughout the metro area. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/events/E-Commerce-Web-ImageCarpool_Insta.png?bossToken=a336ca5c909883b3bc051336100dfec5d254e7f71633cca658391ca89fc17d78" /> E-Commerce at a Crossroads Analyzing the Industry’s Impacts and Planning for Responsible Growth The rapid growth of e-commerce is having a profound impact on land use, transportation, the environment, and more. Citizens and policymakers now face a choice between two different paths for the industry. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2023-reports/Transform-NYCs-Streets/Water-street-spaghetti-pipes-2.png?bossToken=079715609a0062267313eaa5b8bc2a14ac276aeb931dd8a671008021c99c4261" /> Building Better Streets Improving Capital Street Infrastructure Delivery for a Re-envisioned Right-of-Way Doing construction work in New York City’s streets is complicated and costly. This report examines obstacles and offers solutions for delivering a more modern, multidimensional right-of-way. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Parking-Policy-is-Housing-Policy/Parkng-Policy-Is-Housing-Policy-Ilo.png?bossToken=3896b74d7e758e13f20e0bd9f11d086f0bff479f84cee09d2baf138cd62309f4" /> Parking Policy Is Housing Policy How Reducing Parking Requirements Stimulates Affordable Housing Production In New York City, waiving parking requirements for new buildings has yielded more new affordable homes, especially on smaller parcels of land. read more Streets can be a revolutionary resource for our region if we continue to explore these spaces instead of prioritizing them as routes for cars alone.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.5,fp-y:0.5,quality:80/headshots/Taylor_Tiffany-Ann_cropped.jpg?bossToken=8e6cc37ae48d9f9148e15b6a22c20b0b9715b9d563b8779d3db09bbf7aaaba80" /> Tiffany-Ann Taylor Vice President, Transportation view full bio <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/events/E-Commerce-Web-ImageCarpool_Insta.png?bossToken=a336ca5c909883b3bc051336100dfec5d254e7f71633cca658391ca89fc17d78" /> E-Commerce at a Crossroads Analyzing the Industry’s Impacts and Planning for Responsible Growth The rapid growth of e-commerce is having a profound impact on land use, transportation, the environment, and more. Citizens and policymakers now face a choice between two different paths for the industry. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Scenario-Planning-Gateway/Gateway-Scenario-ArrowArtboard-1@3x-100.jpg?bossToken=9e396be70dddd644e1ac651e5a038573c40bd211c1c66a2c3c0ad67484d743fc" /> Gateway and the Post-COVID Economy Scenarios for Future Growth and Trans-Hudson Travel Transit trips across the Hudson River will continue to grow beyond the region’s current capacity. Without the infrastructure to meet this demand, the region’s economic growth and sustainability are in jeopardy. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/PABT-Memo/ajay_suresh_Flickr_PABT.jpg?bossToken=05e632882ce713c75c7a57b542ce255481386c48f60ae8752b4b06ef2e511eb5" /> 10 Recommendations for the New Port Authority Bus Terminal Design Considerations For a New Civic Destination The Port Authority Bus Terminal Replacement Project offers a once-in-a-lifetime opportunity to improve the entire west side of Manhattan. Here’s how we can make the most of it. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Right-of-Way/ROW-Rendering_5.jpeg?bossToken=725f10acdcc4ee453f2cb8c45bbb852f762d85319f0791fef442cb18690da70f" /> Re-Envisioning the Right-of-Way New York City can use our 32,000 acres of roadway to prevent flooding and adapt to climate change, support transportation alternatives and better goods movement, and expand access to economic opportunity. Here’s how. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/rpa-governance_lightBlue-01.png?bossToken=72634934148b9e2b1ee4fd70e97ad168faacb3d7b2363a341bcc9db2f08d6d90" /> Infrastructure for Recovery and Renewal How a Federal Infrastructure Program Can Lift the New York-New Jersey-Connecticut Metropolitan Region The nation’s recovery demands an infrastructure program that creates jobs, reduces inequality, and prepares the U.S. for climate change and public health emergencies. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Better-Service/29Newark-Bus-Better-Service-Report-copy.jpg?bossToken=ece0d51f741434400e1d91af8c4f3ac744bedc120579394dd5db7cddfd56498a" /> Better Service Improving the Bus Network in New Jersey NJ Transit has plans to make bus travel easier and more equitable for riders. More funding and better traffic policies can help achieve this. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.65,fp-y:0.35,quality:80/work/Reports/2020-reports/Bikeway/BikewaysDetailedSmall_DZ_v1.png?bossToken=597971d41deb66ca5bbf75a3858e2b209c1f57e65f4402244c60c93d9afd97c8" /> The Five Borough Bikeway Critical infrastructure connecting New York City We need an evolution in how we manage and use city streets. We need to develop a network of priority, high-capacity, protected bike lanes that serve as the heart of a comprehensive and cohesive bicycle network. read more Action <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.4,fp-y:0.48,quality:80/work/Reports/2019-Reports/Congestion-Pricing-in-NYC/Congestion-Pricingcongestion-zone-map-01.png?bossToken=b86199d71b12b65c9e79b071bd4baeee3590e13c435a3e50824975cf9017518c" /> Congestion Pricing Now Coalition Letter to the MTA Traffic Review Mobility Board read more Testimony to the MTA Board for March 2023 on Operating Funding Testimony from Tiffany-Ann Taylor, RPA’s Vice President for Transportation on the need for dedicated, predictable funds for the MTA and current proposals for operating funds pending in Albany. learn more Testimony to Joint Legislative Budget Committee on New York Housing Compact Testimony about A1484, New Jersey’s Bus Rider’s Bill of Rights, and the need for recurring operating funds for NJ Transit. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/alfresconyc001.jpg?bossToken=b1baf24ebd8af864e57cf9eb62a177bcf2e16bc2a5917b193ce72c06f457108a" /> Alfresco NYC RPA and partners launched a new coalition to recognize and reward the best open restaurants and open streets in New York City and publish best practice design guidelines for outdoor dining spaces. learn about alfresco nyc RPA Lab Federal Funding Share for the Gateway Program read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Congestion-Pricing-Benefits-Maps-012420243_2024-03-21-192913_behm.png?bossToken=c80ca32fe6d306494013d61228b46e7b5156405cda0aaedda70a5900caa13b76" /> Mapping How Congestion Pricing Will Benefit Your Borough read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/Reusable-patterns/MTA-logo-pattern.png?bossToken=9884c14b12b5a8fd4f872b7839d7d0459d83f2e3b24cd924c5544225226b45c4" /> Navigating the MTA's Fiscal Cliff The drop in ridership as a result of the COVID pandemic has created a looming budget crisis for the MTA. Who will be impacted by revenue raisers from Governor Hochul and the State Legislature to close the gap? read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Micromobility-Bronx-Scooter-Pilot-NYC-DOT.png?bossToken=536b0f7bc94157e7ba5835a9de3871577dff14548ae0bd15187ecee3bfe181b6" /> Assessing the Regional Landscape of Micromobility and Autonomous Vehicles How are micromobility options and autonomous vehicles emerging in the New York City region compared to the rest of the US? read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/GatewayTour.jpg?bossToken=5e936a1c4549574ea0cfc434e305f972cca25bee880895787d2ae19c87566674" /> Touring an 111-Year-Old Tunnel and the Gateway Program Touring the North River Tunnel illustrates the urgent need for the Gateway program and the improvements to rail service it will provide to the region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/Iconic-images/Iconic-RPA-map-on-blue_2021-03-15-194020.png?bossToken=33b5720224f3de214105e09b61d406fcf83b0f3b9408ee47b7215f49e5ee2a4f" /> Federal Infrastructure Packages Will Deliver for Tri-State Region We break down how the Bipartisan Infrastructure Framework will impact the tri-state region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2019-Reports/Congestion-Pricing-in-NYC/Congestion-Pricingshutterstock_138864413.jpg?bossToken=17b3ad8e16e324a54558a9fe707d4ee7c85251dd85b9ec4e94dcbbceec2b7eec" /> Transit is Key to Strong Post-COVID Recovery Vehicle traffic has surpassed pre-COVID levels while transit ridership remains low. Our region cannot sustain this. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Flooded-Subways.jpg?bossToken=96b9b07fa9cacf61993ef6f5661d0d3535502016d0918ceb836074a3a85e91cb" /> Improving Stormwater Management in the New York City Subway How many subway entrances will flood during New York City’s next severe rain storm? We counted. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Metro-Survey/SurveyPattern-01_2021-03-24-204408.png?bossToken=7cf408d59d2c884068b09b615e8305c889e9901b8562a1b9dfb9878ff81e05f8" /> Metro Area Residents Support Public Transportation Investments More than 80% of residents in the NY-NJ-CT metro area would like to see more investment in public transportation. read more From the Fourth Plan <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/Archive-Featured-Reports/Fourth-Plan/Color-4RP-Logo-SML.png?bossToken=aae83c9dd7c3e35e9873f1f8ec70812ac04045a59a48ef0f9d261ef7b4ff1bb4" /> All of RPA's research and advocacy is guided by the Fourth Regional Plan. Published in 2017, the plan offers 15 recommendations to help the region create a dynamic, customer-oriented transportation network. visit fourthplan.org From the Archive <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/Archive-Featured-Reports/Traffic-and-Parking-1942/1942-Parking-Study14.JPG?bossToken=a499ab66d5cae3d331269bea40164dc4763b90242ad4b1bbfb5fd6a710c6'''
