["https://rpa.org/work/campaigns/health-equity"]
title = "RPA | Healthy Regions"
description = "The Healthy Regions Planning Exchange brings together practitioners, advocates, and community-based representatives from across the US to address structural issues that influence health and equity in regional planning."
full_description = '''The Exchange consists of more than 30 organizations representing 11 regions of the US and involves a number of events and discussions throughout the year focusing on the role of race and racism in transportation, housing, and the environment. For two years, the participants — from Portland, Oregon to Pine Ridge, South Dakota, New Orleans, Louisiana to Buffalo, New York — have explored how race and racism influences the built environment by way of urban planning. During the second phase of the Planning Exchange, announced in February 2021, the cohorts from each region are advancing strategies to change the built environments in their communities in ways that create better health and financial outcomes for residents. Related News StreetsBlog USA How Cities Are Getting Creative To Reclaim Public Space for People Sep 3 2024 in Media Fostering Cross-Cultural Collaboration and Change: Reflecting on the Lakota Media Summit Nov 6 2023 in RPA Lab Crain's New York Business Antonio Reynoso has big plans for Brooklyn’s future Oct 4 2023 in Media Demystifying Federal Funding for Healthy Communities Sep 22 2023 in RPA Lab Smart Cities Dive NYC region faces significant health inequities: report May 24 2023 in Media Commercial Observer Hochul’s Housing Plan Draws Praise, Skepticism Jan 17 2023 in Media Non-Profit Quarterly To Bridge Health Equity and Infrastructure, We Must Harness Grassroots Power and Creativity Jul 18 2022 in Media City & State NY The 2022 Nonprofit 40 Under 40 Apr 4 2022 in Media New RPA Report Offers Recommendations for Centering Health Equity in Infrastructure Projects Nationwide Mar 29 2022 in News Release Climate Check: Stories and Solutions The Power of a Just Transportation System Dec 22 2021 in Media Fast Company The housing crisis that is hitting Black women the hardest Mar 11 2021 in Media Regional Plan Association Announces Second Phase of Healthy Regions Planning Exchange Addressing Health Equity in Metropolitan Areas Across the United States Feb 18 2021 in News Release Participants <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Campaigns/PlanningExchangeMap2021.png?bossToken=6d022f24669a8c4596617fa6a5af649691e80d81346d56b8a4fd5201a87927af" /> Bay Area, CA: SPUR, Urban HabitatBuffalo, NY: Greater Buffalo Niagara Regional Transport & Co., PUSH BuffaloChicago, IL: Chicago Department of Public Health, Illinois Public Health Institute, Metropolitan Planning CouncilLos Angeles, CA: Alliance for Community Transit – LA, County of Los Angeles Department of Public Health, Colectivo Poder Comunitario/Community Power CollectiveNew Orleans, LA: Greater New Orleans Fair Housing Action Center, Louisiana Fair Housing Action Center (LaFHAC), Operation RestorationNew York, NY: Make the Road New York, Regional Plan AssociationPine Ridge Reservation, SD: Thunder Valley CDCPittsburgh, PA: Hill District Consensus Group, Pittsburghers for Public TransitPortland, OR: Multnomah County Health DepartmentTwin Cities, MN: Alliance for Metropolitan Stability, Frogtown Neighborhood Association, New American Development Center Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Healthy-Regions-Way-Forward/West-End-StationSoccer.jpg?bossToken=536c92b0a747ad70944ad5859cacded29e660f5234e4d0c7e7d61c708e2b2e20" /> Investing in Infrastructure for Healthy Communities By putting community needs first, we can ensure that federal funding is used to build and restore health equity as well as the nation’s infrastructure. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/Healthy-Regions/Trenton-Makes-Glen-Beltz.jpg?bossToken=19185a5befefd0f5ffb8bad29bbc4076a720b03efe57e7ede3931b4947f372a2" /> Pathways to Health Equity Although it will take years to break down barriers to health equity, real progress is taking place across the United States. These are some of the regions showing the way. read more Events & Symposiums <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Healthy-Regions-Way-Forward/launch.jpg?bossToken=b637a291b31c193fa1cc086957f33e2f37217fd99c6fc303a802a4c28a29d30e" /> Event Highlight Infrastructure Equity in Action In June, 2022 as federal funding for infrastructure begins coming down the pipeline, participants from the Planning Exchange described the steps they’re taking to ensure that infrastructure projects achieve more equitable results than many have in the past. Speakers Laura Chu-Wiens Executive Director, Pittsburghers for Public Transit Lynn Cuny Deputy Director, Thunder Valley Community Development Corporation Odetta Macleish-White Director, Georgia Initiatives, Center for Community Progress Charlene McGee Program Manager, Multnomah County Department of Health Joo Hee Pomplun Executive Director, The Alliance for Metropolitan Stability watch the conversation <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_HealthyRegionsPlanningExchange_Symposium2ProgramCover.png?bossToken=499ef7fd77e986b0075328e0b403124337f909b0efc340fdbe8f957741d3d742" /> Closing Symposium In March, 2020, the group convened in New Orleans at the Ashe Power House Theater. Cohorts from each region shared their progress from the past year of work and described new challenges ahead. view the program <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Campaign_HealthyRegionsSecondSymposium.jpg?bossToken=0ffc38d7a0ceaeb1d574c5fd077c5db379d34d43247bcfe13be4886dc65cab14" /> Big Ideas in the Big Easy In New Orleans, participants discussed new tools for systems thinking and planned next steps to influence change towards greater health and racial equity. Gathering in one space for face-to-face interactions created a tangible feeling of collective power which is important in movement building. Read a recap of the Closing Symposium. <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_HealthyRegionsPlanningExchange_Symposium1ProgramCover.png?bossToken=cf8663199b620db1934d012fd165d6ac116e4281420a4bc9d187b2df971ce6cb" /> Opening Symposium In April 2019, the group convened at our offices in Manhattan for three days of discussions centered around how community partnerships inform better planning and how race and racism shape planning. view the program <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Campaign_HealthyRegionsPlanningExchange_Symposium1-Cropped.jpg?bossToken=d8b51b00563df388b639c3e3a5111b2fea5a8f89428a0ecf698231a09b36bff3" /> Webinars <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/HealthyRegionsPlanningExchange_OaklandTransitEquity.png?bossToken=5dc6a9b56ef4c7b2696e8768a4b0cb863f906956c95ca5ebcfedaf81a6cfd137" /> Oakland Offers Example of Transit Equity in Action read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Lab_TransportationEquityWebinar_CoverPhoto_Cropped_200424_175638.jpg?bossToken=9fb9fb558bc01d50ab9d87f1554a255d358fc2e62daedbfc0f20971baadaea97" /> Tamika Butler Calls for “Ethics, Equity and Empathy” in Transportation Planning read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Lab_AddressingRacialInequality_CoverPhoto_NationalArchivesRecordsAdministrationMappingInequality_Cropped.jpg?bossToken=e6a91117a813f4eacebd7f20148c4ad2ca54b54e1cff7142faf0bfcda7ca080e" /> Addressing Racial Inequality in Planning read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Lab_DevelopmentWithoutDisplacementWebinar_CoverPhoto.jpg?bossToken=00ba436f95a81a281a2a0d44d092c83ee1267bf8d5a86af27f7151661681a8e3" /> Exploring Health and Equity with a Nationwide Planning Network read more Do you want to make the tri-state region a better place? Join the community that’s working toward that goal. become a member share Location National'''
