["https://rpa.org/about/research-areas/energy-environment"]
title = "RPA | Energy & Environment"
description = "RPA’s Energy & Environment program helps the region to rise to the challenge of climate change through proactive regional planning, smart policy development, and advocacy for sustainable land use practices."
full_description = 'Our environment plays an essential role in ensuring the health and well-being of the region, but climate change has already begun to transform the region in ways that threaten its health, sustainability, equity and prosperity. The coastline is shifting inward. Homes, businesses, critical infrastructure and ecosystems are more prone to flooding. By 2050, more than two million people and 60 percent of the region’s power-generating capacity, as well as dozens of miles of critical roads and rail lines, will face a high risk of flooding—some of it permanently under water. The number of days of extreme heat, which are far more threatening to human life than any other impact of climate change, will multiply by five. We must accelerate efforts to both adapt to climate change and address its root cause by dramatically reducing the region’s greenhouse gas emissions. That means investing in critical infrastructure, making communities more livable and less vulnerable, and enhancing natural systems like wetlands and forests. Doing so will not only mitigate the impact of storms and heat, but also create a new relationship with nature that will improve the health and well-being of residents, now and in the future. In order to adapt fairly, we must have stable streams of funding and community-informed plans that do not repeat the injustices of past policies. We must focus on policies, investments and regional land use decisions that address the climate crisis without triggering other crises of equity, affordability or economic decline.And even as we adapt, we must aggressively reduce our greenhouse gas emissions to avoid the most catastrophic impacts of climate change. This means shifting away from fossil fuels for electric power, transportation and heating and cooling, including the eventual phase-out and transformation of infrastructure that supports this now-predominant source of fuel. This represents an opportunity to build a new, thriving, fair, and sustainable economy that serves as a model for metropolitan regions worldwide. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_FeaturedImage_Decarbonizing-the-Region.jpg?bossToken=8639c8cf8f93563234dbe995dd47028e1d7045678dbe87fd2b990e6c34ef7028" /> Featured Campaign Transition to a Decarbonized Region RPA advocates for policies and investments that can help our region hit ambitious climate targets without triggering other crises of equity, affordability, or economic decline. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaign_HealthyRegionsPlanningExchange_FeaturedImage2.jpg?bossToken=7dc4ef52e896ce9a4f839e34c14027972d0ee280427ee6b73f5c09a74280da81" /> Healthy Regions The Healthy Regions Planning Exchange brings together practitioners, advocates, and community-based representatives from across the US to address structural issues that influence health and equity in regional planning. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Campaigns/Campaign_FeaturedImage_RenewableRikers.png?bossToken=50e9ac17cdf466a011b07f8385f4ae695cfffb358afea10f1290428ed00c1aed" /> A New Green Vision for Rikers Island Building on the work of community, criminal justice reform, and environmental organizations, RPA supports transforming the island from one for incarceration to one for green infrastructure to benefit all New Yorkers. read more Latest Energy & Environment News Feb 2025 in Energy & Environment Testimony to NY’s Public Service Commission in Support of Offshore Wind Transmission Project Feb 2025 in Energy & Environment History of the Grid and Major Projects Feb 2025 in Energy & Environment RPA Statement on New Jersey’s Decision to Not Advance Offshore Wind Projects in Fourth Solicitation Jan 2025 in Energy & Environment RPA Statement on Executive Order to Halt Offshore Wind Leasing Latest Energy & Environment Reports Feb 2025 in Energy & Environment Roadblocks and Solutions to Permitting for Residential Solar and Energy Storage Challenges and incentives in New York and New Jersey Oct 2024 in Energy & Environment Brooklyn Waterfront Greenway User Study Sep 2024 in Energy & Environment Ports of Opportunity Advancing Offshore Wind Ports in the Tri-State Region Aug 2024 in Energy & Environment Reclaiming Public Space for Health Equity Our Areas of Expertise Energy & Environment RPA’s Energy & Environment program helps the region to rise to the challenge of climate change through proactive regional planning, smart policy development, and advocacy for sustainable land use practices. learn more Housing & Neighborhood Planning RPA’s Housing & Neighborhood Planning program explores how to make the region affordable for everyone and builds collaborative local plans focused on healthy, inclusive, and well-designed communities. learn more Transportation RPA’s Transportation program helps shape and strengthen the network of railways, roads, airports and ports that binds the region together and connect us to the rest of the world. learn more Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
