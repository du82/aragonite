["https://rpa.org/work/reports/coastal-adaptation"]
title = "RPA | Coastal Adaptation"
description = "To prioritize climate adaptation and implement solutions at different geographic scales, New York, New Jersey and Connecticut should create a Regional Coastal Commission (RCC)."
full_description = 'Over the next 30 years, the number of people living in places at risk of flooding from an extreme storm in the New York-New Jersey-Connecticut region is likely to double from 1 million to 2 million. Sea levels are projected to rise by two feet, putting 10,000 homes permanently under water and greatly expanding the coastal floodplain. With over 3,700 miles of tidal coastline, much of it densely populated with old and decaying infrastructure, the region’s states and local communities face the daunting challenge of making the physical and regulatory changes necessary to adapt to this new coastline. Restoring wetlands, building sea walls, raising buildings, retrofitting infrastructure and buying out vulnerable homeowners are among the actions that 167 coastal cities, towns, villages and counties will need to consider and find the resources to implement. While there has been substantial progress in planning for climate change, adaptation is slow, sporadic, underfunded and uncoordinated. Attention and resources rise in the wake of storms like Superstorm Sandy, but soon dissipate when the immediate crisis has passed. In many ways, the needs are so great and the timeframes for implementation are so long that it is easier to focus on more immediate needs. While Superstorm Sandy provided an infusion of funding for recovery and adaptation, there remains $28 billion worth of identified needs that has not been funded. <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/pdfs/RPA-Coastal-Adaptation.pdf?bossToken=6197a601651043077d96526d7848283ec4737cf5e40fb33e7941d74309740a9e" /> view the pdf To get ahead of the growing crisis, the region will need to overcome several impediments: Planning and investments are reactive rather than proactive. There is neither a plan nor a budget for adaptation projects that can prioritize investments and prepare for future contingencies. Instead, current funding sources and policies depend on unreliable federal funding that promotes short-term recovery over long-term investments.Most of the region’s smaller cities, towns and villages have limited capacity. The vast majority of the region’s municipalities are governed by part-time or volunteer mayors and councils, and even the larger municipalities lack the staff capacity and resources to address and plan for long-term climate changes. Coastal flooding is a regional problem, but most planning happens locally. Each state and municipality has different rules, policies and guidelines, and limited incentives to collaborate.Coastlines and infrastructure transverse government boundaries, and since water is fluid, management practices in one state or municipality can have an inadvertent impact on others.State coastal management programs leave several problems unaddressed. The coastal management programs of the three states vary widely in approach, and inconsistent policies can prevent important adaptation strategies from being implemented across state lines. At the same time, adaptation is not a singular focus of any program, nor are issues of regional significance, such as infrastructure.To give climate adaptation the priority it needs and to be able to implement solutions at different geographic scales, New York, New Jersey and Connecticut should create a Regional Coastal Commission (RCC). The commission would be empowered to maintain a dedicated focus on the region’s climate adaptation needs, help mobilize the region’s resources to address them, coordinate strategies and develop common standards. It would also prioritize funding that can be used for region-wide resilience projects. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/RPA-Coastal-Counties-in-the-NY-NJ-CT-Region-Vulnerable-SLR.png?bossToken=cc1471aa2d86ba7971633b2b82e46727bbf50c12a52b90d939cbb0e66202c354" /> share Research Areas Energy & Environment Location ConnecticutNew JerseyNew York Topics Climate ChangeSea Level RiseBuy OutsRetreat Acknowledgements Authored by Lucrecia Montemayor Former Senior Planner Emily Korman Former Research Analyst <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.44,fp-y:0.32,quality:80/headshots/Freudenberg_Rob.jpg?bossToken=50c8f54ce05a687238b6a699d49aab6f1c2c3d65dd77183b35f0d781b8777a06" /> Robert Freudenberg Vice President, Energy & Environment <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.41,fp-y:0.36,quality:80/headshots/Ellis-1-edit.jpg?bossToken=cb66a5887d6825922006a966ae6372d2f9c298744a08e576d1a7cfd0eccfa61a" /> Ellis Calvin Data Research Manager Sarabrent McCoy Former Research Analyst <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.58,fp-y:0.34,quality:80/headshots/Jones_Chris.jpg?bossToken=13f8501c89471dfbc813583b84b107b4180f9be5c93e529d3cdd930478d68438" /> Christopher Jones Senior Research Fellow Dani Simons Former Vice President, Communications Emily Thenhaus Former Communications Associate Jesse Keenan Harvard University, Graduate School of Design, Ben Oldenburg Former Senior Graphic Designer Related Reports Sep 2024 in Energy & Environment Ports of Opportunity Advancing Offshore Wind Ports in the Tri-State Region May 2023 in Housing & Neighborhood Planning State of the Region’s Health 2023 Update Oct 2022 in Housing & Neighborhood Planning The Constant Future A Century of the Regional Plan Sep 2022 in Transportation E-Commerce at a Crossroads Analyzing the Industry’s Impacts and Planning for Responsible Growth Total Reports 534 Search Our Reports Search Filters Research Areas Housing & Neighborhood Planning Transportation Energy & Environment Location All Locations Connecticut New Jersey New York International National Author All Authors Christine Garner Christopher Jones Dave Zackin Ellis Calvin Jeff Zupan Kate Slevin Kyle Mason Lacey Cotter Marcel Negret Maulin Mehta Moses Gates Rachel Weinberger Ravena Pernanand 