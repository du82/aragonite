["https://rpa.org/history/centennial"]
title = "RPA | Celebrating a Century of Research, Planning, and Advocacy"
description = "The Committee on the Plan of New York and its Environs formed in 1922 and released the First Regional Plan in 1929. For 100 years, RPA has worked to create a more equitable, healthy, prosperous, and sustainable region."
full_description = '''<img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/logos/extra-space_RPA100_Logo.png?bossToken=593e25b5057c7802ed4babec8f81edc0b5bfa8311d05f72ebcd771fee6b6f348" /> For 100 years, Regional Plan Association has guided the growth of the New York-New Jersey-Connecticut metropolitan region with long-range planning and insights. From the location and construction of the George Washington Bridge, the creation of Gateway National Recreation Area, the rebuilding of lower Manhattan after 9/11 and more, RPA is inextricably woven into the history of the tri-state area. Central to our work is the belief that communities can improve their efficiency and standard of living if they plan ahead for growth. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/general/Timeline/1923_New-York-Times-on-the-Regional-Plan_scan.jpg?bossToken=16ecc7026389d5c22d621864a53042274c6294960b097f758e9fc22f79e28ba0" /> The first Committee on the Plan of New York and its Environs met in 1922. Seven years later in 1929, the first ever Regional Plan — ​“Regional Plan of New York and its Environs” — was published, and RPA was formally incorporated to implement the plan. Since then, some of RPA’s work has included independent research, planning, advocacy, vigorous public engagement, and a total of four regional plans. 100 years later, RPA is celebrating our centennial — ​‘RPA 100’ — from 2022 to 2029 by reflecting on the history of planning in the region while envisioning its future. We will unpack our storied history through events, papers, and engagement with the region’s residents - and outline how our story mirrors the history of the planning profession overall. As we reflect on RPA’s past, we look forward to ensuring our work contributes to a more equitable, healthy, prosperous, and sustainable region for the next 100 years. Related News London of Economics & Political Science The Constant Future: exploring 100 years of New York regional planning at Grand Central Nov 22 2022 in Media Monocle All the Right Moves Nov 5 2022 in Media Metropolis Magazine Surveying 100 Years of the Regional Plan Association Oct 24 2022 in Media Architect's Newspaper Regional Plan Association looks back at 100 years of planning with archival exhibition inside Grand Central Oct 14 2022 in Media The New York Times Plan on It: Celebrating New York City’s Regional Plan Oct 12 2022 in Media WNYC Looking Back at How New York City was Planned Oct 10 2022 in Media Gothamist New exhibit in Grand Central Terminal tells NYC’s history through urban planning Oct 9 2022 in Media Observer The Quietly Influential Regional Plan Association Celebrates a Century of Shaping New York City Oct 8 2022 in Media City & State NY Regional Plan Association chief on 100 years of shaping NY’s urban planning Oct 8 2022 in Media 6 Sq Ft New exhibition at Grand Central traces 100 years of urban planning and design in NYC | 6sqft Oct 7 2022 in Media Curbed On the Vision — and Limits — of a Century of Grand Urban Plans Oct 5 2022 in Media RPA Recognizes Former and Current Staff During Hispanic Heritage Month Sep 29 2022 in RPA Lab Long Island ADU Debate Began Decades Ago Aug 15 2022 in RPA Lab Planetizen The Century-Old Call for Open Streets Aug 9 2022 in Media Open Streets Are an Old Idea Whose Time Has Come Jul 27 2022 in RPA Lab Patch Celebrate the Meadowlands Jul 18 2022 in Media Patch Honoring the Spirit of Rebellion: A Celebration of Nat Turner Park Jul 18 2022 in Media Transit Unplugged Transit Unplugged Podcast with Tom Wright Jun 15 2022 in Media StreetsBlog USA Talking Headways Podcast: Thinking Regionally About New York Jun 2 2022 in Media RPA Recognizes Former Staff and Board During Asian American & Pacific Islanders Heritage Month May 24 2022 in RPA Lab Bring history to life by contributing to the RPA Centennial Fund support rpa From 1922 to 2022 <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Centennial-images/RPA-Centennial-1C-Alexander-Severin.jpg?bossToken=bc6fc045cf23eb05db4bb31ebb78026e036a6ce842f75c024ce50e809e387f10" /> The Constant Future A Century of the Regional Plan This exhibition brought a new way of seeing the New York metro region - and understanding its rise to greatness - to the majestic halls of Grand Central Terminal for three weeks in October, 2022. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.21,quality:80/general/Timeline/1949_RPA-Comic_cropped.png?bossToken=c167b4ada54225c267f62083d4da6951f529e665525668e3db035a012b18686f" /> Timeline Since 1922, Regional Plan Association has developed and promoted ideas to improve the economic health, environmental resiliency, and quality of life in the tri-state region. learn more Regional Plans <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Centennial-images/RPA-Regional-Plan-of-New-York-and-Environs-Cover.jpg?bossToken=c6a283043d26c5aeb27e95b7ed9cdf1bae8ab37e1a91237da0a0836e18eafa53" /> Regional Plans Since 1929, Regional Plan Association has released four long-range plans to guide the growth and development of the region. learn more Nate Dorr The First Regional Plan The purpose of the first Regional Plan was to guide the development of the New York metropolitan area and enhance the quality of life of residents, without regard to political boundaries. Nate Dorr The Second Regional Plan At a time when wealthier white residents were leaving cities for the suburbs, RPA’s Second Regional Plan focused on the need to invest in urban centers and transit, and to reign in sprawl. Nate Dorr The Third Regional Plan The Third Plan warned that, without major investments in the economy, equity, and the environment, the region would be at risk of a slow and painful recovery from the economic downturn of the early 1990s. Nate Dorr The Fourth Regional Plan The Fourth Regional Plan provided specific recommendations to promote inclusive growth that would bring shared prosperity, equity, improved health, and sustainability for the region. RPA Across the Region Regional Plan Association has been active in the tri-state metropolitan region for nearly a century. As we celebrate our centennial, we are excited to highlight RPA’s contributions across the region. Below are some reflections on our contributions to the region’s built and natural environments. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/Archive-Featured-Reports/First-Plan/RPA-Plan1-v2-324-View-of-Manhattan-600_2022-04-10-215616_bwco.jpg?bossToken=7e49095f35be5a386db91656d0f2b33551d847750dbf03674a22bb29d6b69f72" /> New York City RPA helped build the foundation for urban planning in New York City in the 1930s and played a key role in some of the city’s most contentious planning proposals. RPA has consistently called for concentrating growth in centers like midtown Manhattan, downtown Brooklyn, and Jamaica, Queens, and consistently put forward solutions for tackling congestion. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/1987_Fairfield-2000-01-cropped.jpg?bossToken=32e969eddf765afee77dfddd2da74ec58192d6feb01a3e9cc97ad64bd48813a6" /> Connecticut RPA supported the creation of the Merritt Parkway and the expansion of Sherwood Island State Park, undertook a massive community-centered project about housing and zoning in the 1980s called Fairfield 2000, and has remained a champion of the city Bridgeport, CT for decades. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/RPA100_brownfield_nj.png?bossToken=d10213e8131b5e5c7059f7b5788633677151702acb56a074c5f2fed149f34f66" /> New Jersey RPA has long advocated for investments in regional centers like Newark and Paterson, supported the acquisition of land to create and expand parks and open space, like Garret Mountain, Sandy Hook, and Sterling Forest, and sought to better connect New Jersey to the rest of the region. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Centennial-images/Hudson-History-Header-Image.jpg?bossToken=8e57b97756bfaba0eb38863eadd2213ebb8e07cd8b6b3794e0c00047a648b886" /> The Hudson Valley RPA supported the expansion of parkland and protected open space like Bear Mountain and the Shawangunks, led a community-centered urban planning initiative in the 1980s called Westchester 2000, and continues to advocate for balancing open space preservation with community development. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Centennial-images/LI-open-space-crop.png?bossToken=aa8c597e48e6b4030209e7c7459cddc99e1954efa7bcb1eaa150df8dea1b603b" /> Long Island RPA tried to discourage sprawl on Long Island in the late 1940s through reports and advocacy efforts, battled with Robert Moses over Fire Island and the Long Island Sound, and helped create Gateway National Recreation Area, the first US national park in an urban area. read more For 100 years, RPA has guided the growth of the tri-state region with independent research and advocacy. Help support our work. support rpa'''
year_published = 2022
