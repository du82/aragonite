description = "Your contribution is an investment in a more equitable, healthy, sustainable, prosperous future for the tri-state region and will help RPA maintain our independence and effectiveness as a civic voice."
full_description = 'Make a Donation Today Other Ways to Give Planned Giving By including Regional Plan Association in your estate plans, you can ensure that RPA’s work to protect and improve the region continues for years to come. learn more Donate Stock Donating shares of appreciated stock to RPA can make you eligible for a tax deduction, and can help you grow your donation, tax-free. learn more Gifts in Honor or in Memory A gift made ​“in honor” or ​“in memory” is a unique way to celebrate someone special, while also investing in the health and prosperity of the region. A personalized card will be sent to the honoree or the honoree’s family acknowledging the gift and its impact. learn more Donor Advised Funds A donor-advised fund (DAF) is a convenient way to support Regional Plan Association. You can use your DAF to make a one-time or a recurring grant. learn more Additional Information Donate By Check Please complete this form and include it with your check. Checks should be made payable to Regional Plan Association. Please mail to: Regional Plan Association Attn: DevelopmentOne Whitehall St, 16th Floor New York, NY 10004 Matching Gifts If you are affiliated with a corporate or foundation matching gift program, you may be able to increase your gift to RPA. Contact [email protected] or 212-253-2727 for more information Financial Information RPA is a 501(c)(3) non-profit organization and is publicly supported as described in 509(a)(1) of the Internal Revenue Code. Access our Annual Reports and 990s here. Contact For any questions or additional information on how to get involved, please contact [email protected] or 212-253-2727. Board Member Spotlight Even though RPA has a regional scope the organization also reaches out to positively impact communities. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/headshots/Maxine-Griffith-Headshot.jpg?bossToken=52e1e2c45e492aebff2ecb1c1366b99692724f8d3d953a3ee266ed3a115f6ac4" /> Receive RPA insider updates, priority invitation to RPA lectures and member events, and a complimentary ticket to annual member party. support index Maxine Griffith Board member since 2006 Learn more about the region and our efforts to shape its future. see our work'
