title = "RPA | Building an Affordable Region"
description = "RPA is working to transform the tri-state area from one of the most segregated and least affordable regions to one of the least segregated and most affordable in order to serve our diverse and growing population."
full_description = '''The gap between the need for affordable housing and the limited supply continues to grow rapidly across the region. This not only drives ever-increasing housing costs, but also entrenches historical patterns of segregation and inequality. RPA works to elevate housing quality, affordability, and choice and transform the tri-state metropolitan area from one of the most segregated and least affordable regions into one of the least segregated and most affordable. We aim to restore public housing, advance accessory dwelling units (ADU) and other means of infill development, and promote walkable, mixed-use development connected to employment opportunities and mass transit. Related News CT Mirror CT plan centers climate change in conservation, development Feb 7 2025 in Media CT Mirror CT Democrats cite ​‘misinformation campaign’ on ​‘Work Live Ride’ bill Feb 3 2025 in Media Business Insider One of the solutions to NYC’s housing shortage is already running into regulatory hurdles Feb 1 2025 in Media Brick Underground Hochul takes aim at institutional housing investors and rent-fixing software in State of the State Jan 16 2025 in Media CT Mirror Zoning, homelessness, eviction reform on 2025 CT legislative agenda Jan 9 2025 in Media CT Mirror New Haven to host national YIMBYtown conference in September Jan 3 2025 in Media Forbes ‘Yes’ In My Backyard: NYC’s Rezoning Ushers In New Era Of Housing Development Dec 17 2024 in Media Crain's New York 2 years since Adams and Hochul’s recovery plan, how has New York fared? Dec 16 2024 in Media Jersey City Times Jersey City Faces Housing Shortage of Up to 36,500 Units by 2032, Report Finds Dec 10 2024 in Media RPA Celebrates New York City Council Passing City of Yes for Housing Opportunity Dec 5 2024 in News Release Harlem World Mayor Adams, Governor Hochul, Speaker Adams Celebrate Historic Pro-Housing Proposal Passage Dec 5 2024 in Media Business Insider New York City is on the verge of allowing thousands of homeowners to build extra dwellings in their backyard, garage, or basement Dec 2 2024 in Media Forbes “City Of Yes”: Promising, But Won’t Solve New York Housing Crisis Nov 30 2024 in Media RPA Celebrates Subcommittee Approval of the City of Yes for Housing Opportunity Nov 21 2024 in News Release The City How Parking Will Drive the Coming Adams-Council Housing Development Deal Nov 20 2024 in Media StreetsBlog NYC Council Likely To Weaken Mayor’s ​‘City Of Yes’ Pro-Housing Zoning Plan Nov 19 2024 in Media RPA Urges the NY City Council to Pass City of Yes in Full to Adequately Address the Housing Crisis Nov 18 2024 in News Release Vital City Why New Yorkers in Poverty Need City of Yes Nov 14 2024 in Media Daily News Housing Yes, Parking No: Do not Prioritize Cars over People Nov 10 2024 in Media StreetsBlog NYC Want Parking? Kiss Goodbye Half of the Projected Housing in ​‘City Of Yes’ Nov 7 2024 in Media Homes that meet the needs of all people at all income levels and all stages of life are critical for healthy, thriving communities.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.5,fp-y:0.5,quality:80/headshots/Gates_Moses.jpg?bossToken=1b1c508909c182b83d48dec5ea5c9e801e636851fcddc488a637c8d1ba604dfc" /> Moses Gates Vice President, Housing & Neighborhood Planning view full bio Partnerships RPA provides technical assistance and other forms of support to coalitions across the region that work to reduce segregation and create more affordable housing, including New York Neighbors in New York State, and Desegregate CT and the Center for Housing Opportunity in Connecticut. <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/NY-Neighbors-Pattern-Big.png?bossToken=60492862fb56f9e7279bec6a4eeed147af4997327fd097127b6e4240ad5d72d0" /> New York Neighbors New York Neighbors is a statewide, pro-homes coalition supporting a menu of options to increase housing supply and create more affordable homes to tackle the state’s debilitating housing shortage and support our economy. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Desegregate-CT-People-Pattern.png?bossToken=77f632cf26247d0e4a3805b88e8d6026de3e7730d55453a0ed413d62c2d58e5d" /> Desegregate CT A pro-homes coalition of neighbors and nonprofits fighting for better land use laws to make Connecticut more prosperous, equitable, and sustainable. learn more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/CHO-pattern-old.png?bossToken=e24273141a26847fdf6795f9d9ab289e1ed80dd710ae10653e5b709d6e633205" /> Center for Housing Opportunity Together with community foundations and regional partners in Connecticut, we work collaboratively across sectors to deliver safe, equitable, affordable housing solutions for families and individuals. learn more Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.49,fp-y:0.02,quality:80/work/IMG_9387_pngcropped.png?bossToken=99fedb906b675b019c03524b132f5de52e17986229217e7aae2fb432fce497d7" /> Housing Jersey City: Assessing Current and Future Gaps Jersey City has experienced a recent surge in development, but certain gaps remain in the housing stock and affordability is still a concern. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/housing-opportunity-header.jpg?bossToken=81727d968de7cbb9a526b713e58097d353caf626bae058ae732160e73b19cb1e" /> City of Yes — More Than Just Housing Passing the full scope of City of Yes would mean 15,000-30,000 new jobs generating between $1.1 and $2.1 billion in earnings each year, and an overall economic impact of between $41 and $83 billion. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2024-reports/Homes-On-Track/FINAL_CoverPerspective-01.png?bossToken=03fc0bea0ddcbeccf6a67e76acb7b8de943f521d055ce93b12ff5847a152d872" /> Homes on Track Building Thriving Communities Around Transit Access to abundant homes can lower expenses and improve affordability, especially when strategically coupled with public transportation. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/castile.JPG?bossToken=8f6855385e84afcc3c19876928b1c696f30dce8c890c5b1fbb47d8c676951e50" /> Rural New Yorkers At Risk Saving Affordable Rental Housing Created Through USDA’s Section 515 Program read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Be-my-Neighbor/BeNeighborPattern.png?bossToken=680dde9c8e9e5f2ddb1119bfa4b9a9ea70f6b4519980dc1856a67109ba5acd42" /> Be my Neighbor Untapped Housing Solutions: ADUs and Conversions We can create hundreds of thousands of new homes in the region just by allowing accessory dwelling units (ADUs) and conversions of large single-family homes to two- or three-family homes. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Healthy-Regions-Way-Forward/4Healthy-Regions-Way-ForwardArtboard-2@2x.png?bossToken=f04be22005955594f1f90456033c807c5aba875e1322c924f7d1b27a902fd922" /> Investing in Infrastructure for Healthy Communities By putting community needs first, we can ensure that federal funding is used to build and restore health equity as well as the nation’s infrastructure. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2022-reports/Preventing-another-IDA/Image-from-Ida-Flooding-Housing-video.png?bossToken=4c1963aac6c6c87c5ff3d6ea85ceabdef1e9ce81b6e5b60874f40764540c7e1a" /> Preventing Another Ida Stormwater Management and Basement Apartments in Central Queens During Hurricane Ida, extreme rain, unlicensed apartments, and underlying socioeconomic conditions resulted in death and disaster in central Queens. These strategies can help prevent that from happening again. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Fairfield-County-CT.jpg?bossToken=b14d0726757a1bb760dbce51462a1c8cdf379fa159ba4f0b824542bb61a8b89e" /> Fairfield County Housing Needs Assessment To help communities in Fairfield County, CT understand and address challenges related to housing, RPA offers data and analysis on demographics and housing characteristics for all of the county’s 23 towns and cities. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Planning-for-Affordability-in-CT/Pugalenthi-Iniabarathi_ManchesterConnecticut.jpg?bossToken=79dca1445facaa80c6b7fc04ce56e0829f7cfc8bd15884b1b6efef80bf37cc08" /> Planning for Affordability in Connecticut Affordable Housing Plan and Process Guidebook RPA joined the Connecticut Department of Housing and partners across the state to create this guidebook to help towns create strong affordable housing plans. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Aileen-Devlin_LongIsland.jpg?bossToken=fc1d452a334d1ad2079ff08098e445b05e3d86008d19e4defc41801be25d5d35" /> Long Island Housing Data Profiles A visual guide to better understand Long Island’s housing challenges and opportunities RPA offers updated profiles on the demographics and housing characteristics of every Long Island city, town, and village in an easily accessible format. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/NJ-RENT-James-Andrews.jpg?bossToken=4c27b24977132de50d8bc5c8538e54d9b789ac1bd8b0b218845f312f6dc9e0cb" /> Renter Empowerment and Neighborhood Tools (RENT) for Health Equity Housing Profiles for Anchor Communities in New Jersey Housing profiles to support healthy homes and well-being for vulnerable low-income renters in New Jersey. read more Action "City of 'Yes'" RPA led 80+ groups to call on New York City leaders to implement citywide zoning text amendments and support affordable housing projects in the pipeline right now. read the letter Promoting Transit-Oriented Development RPA testified in support of a bill that would make easier for communities across Connecticut to build more homes near transit stations. read the testimony <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/logos/desgregatect-logo.png?bossToken=d4633774d3206684676a423b1f80a165ac823ee7978ac333827dd790b5a43210" /> Desegregating Connecticut DesegregateCT has become as official program of Regional Plan Association. RPA has been the coalition’s fiscal sponsor since its inception. read more Zoning Reform in Connecticut Along with many partners, RPA successfully pushed for historic zoning reforms including statewide legalization of accessory dwelling units. read more ADUs in New York State Amidst a public health crisis and renewed calls for racial justice, the New York State Accessory Homes Enabling Act is exactly the type of creative legislation we need. read our testimony Comprehensive Planning in New York City RPA testified to the New York City Council supporting legislation that would require the city to implement comprehensive planning and make the land use process more responsive to community needs. read more RPA Lab Legislative Update for New Jersey Housing Policy New Jersey recently passed a slate of housing bills. These laws will help ensure that we tackle our housing gap by creating one of the strongest affordable housing frameworks in the country. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/illustrations/rpa-housing.svg?bossToken=cb5d36c8a592574d87149a2e134169c168a5a1207ed180d737bf104b96969f28" /> RPA Statement in Response to NYC Housing & Vacancy Survey read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Housing-Ilo.png?bossToken=cd85ed43deb102aec8fdc4e79b3c8143d6af06438813c9a7d046d9f92b6ca66b" /> Meeting Housing Need and the Pace of Growth in New York State 817,600 units of housing are needed to relieve current overcrowding and meet expected population growth by 2032. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/latest/Hillcrest-NJ-Ewing-Trenton-Wikimedia-Commons.jpg?bossToken=1721dad191e07b125b1b70613c8357e8f40afef95612ddff0a00954faeb62b3d" /> New Jersey Lawmakers Weigh Solutions for Housing Affordability Housing affordability has been a growing concern in NJ. State leadership has begun to act, albeit slowly. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Aileen-Devlin_LongIsland.jpg?bossToken=fc1d452a334d1ad2079ff08098e445b05e3d86008d19e4defc41801be25d5d35" /> State Zoning Reforms are Key to Housing Opportunity The region is seeing high rents and low inventory thanks to years of under-building. Progress, however, could be at hand. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2021-reports/CT-Be-My-Neighbor/Be-My-Neighbor-CT-ADU-examples.jpg?bossToken=697602ff55861d095a753a8646e93a7c11722dbc163a277c7296ed2d2fa3a82b" /> New York State Accessory Dwelling Unit (ADU) Legislation Fact Sheets From Sullivan to Suffolk, we break down how the New York State Accessory Homes Act could benefit your county. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Segregation-Opportunty-in-Housing-1967-Regional-Plan-Association.jpg?bossToken=c23dd16791f9e0aa18aa670d352f0a96ddec9152ebbb59b786a096ada5de9127" /> Housing Segregation is a Choice Housing segregation in our region did not happen by chance. It is the result of accumulated policy decisions over multiple generations. read more From the Fourth Plan <img class="noscript" src="https://img.imageboss.me/general/cover/4250x5500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/Archive-Featured-Reports/Fourth-Plan/Color-4RP-Logo-SML.png?bossToken=aae83c9dd7c3e35e9873f1f8ec70812ac04045a59a48ef0f9d261ef7b4ff1bb4" /> All of RPA's research and advocacy is guided by the Fourth Regional Plan. Published in 2017, the plan offers 16 recommendations to help make the region affordable for everyone. visit fourthplan.org From the Archive <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.48,fp-y:0.18,quality:80/work/Unsorted-Report-Images/Plan2-Public-Services-in-Older-Cities.jpg?bossToken=34b96657d467c3c7c1f81981a7357c7ac2912e60fb2ddc37b51cd126ba716b8b" /> 1968 Public Services in Older Cities A Report of the Secon'''
