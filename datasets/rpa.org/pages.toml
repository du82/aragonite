["https://rpa.org/work/campaigns/fix-nycha"]
title = "RPA | Restoring the Promise of Public Housing"
description = "RPA is proposing strategies to increase funding and improve management for NYCHA, and we’re building the political and civic will necessary to implement them."
full_description = '''Decades of neglect and underinvestment by all levels of government have left the New York City Housing Authority (NYCHA) - home to more than 400,000 residents - in a state of crisis. Buildings continue to deteriorate, residents continue to put up with deplorable conditions, and parts of the system will soon face demolition by neglect. RPA is proposing strategies to dramatically increase funding and improve management for NYCHA, and we’re working across sectors to build the political and civic will necessary to implement them. Related News Letter to City Planning Commission on Expanded Transferability of New York Housing Development Air Rights Jan 12 2024 in Testimony Statement on NYCHA Public Housing Preservation Trust Legislation, A7805D/S9409A Jun 2 2022 in News Release Crain's New York Business How Biden’s Build Back Better bill will affect New York Nov 19 2021 in Media New York Daily News It’s long past time to rezone Gowanus Oct 12 2021 in Media The New York Times A Rebirth in the Bronx: Is This How to Save Public Housing? Aug 5 2021 in Media Crain's New York Business Strong recovery must include federal investments in transportation, housing and climate change Jun 8 2021 in Media Gotham Gazette What is Kathryn Garcia’s Mayoral Campaign Platform? Jun 2 2021 in Media Bloomberg CityLab The $40 Billion Housing Headache Facing New York’s Next Mayor May 27 2021 in Media The Hill Housing is critical infrastructure — federal spending must prioritize it May 10 2021 in Media Gotham Gazette Schumer Says Big Infrastructure Package is on Deck; What’s on New York City’s List? Mar 13 2021 in Media Next City NYCHA Strikes Deal With Private Developers to Manage and Repair Units Dec 11 2020 in Media Curbed Can Balconies, Bigger Lobbies, and Package Rooms Help Save Public Housing? Oct 5 2020 in Media New York YIMBY Peterson Rich Office, Regional Plan Association Reveal Comprehensive Design Strategy For NYCHA Properties Sep 23 2020 in Media New York Daily News The Rebirth NYCHA Needs Now Sep 17 2020 in Media The Architect's Newspaper Peterson Rich Office and Regional Plan Association return with design recommendations for improving NYCHA properties Sep 15 2020 in Media BronxNet Regional Plan Association Hosts a Webinar about Affordable Housing Aug 28 2020 in Media Politico NY New York has a plan to fix its broken public housing — it just needs to convince Congress Aug 14 2020 in Media Spectrum NY 1 Study: NYCHA Living Conditions Affects Residents’ Mental & Physical Health Jul 8 2020 in Media Next City Making Housing Plans About More Than Just Counting Units Feb 25 2020 in Media Gotham Gazette NYCHA Open Space: The Next City Park Frontier Dec 18 2019 in Media We’re very much at the point where the deferred maintenance of NYCHA properties is starting to compound and really spiral. If you don’t renovate buildings and keep them in a state of good repair, they eventually fall down.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.5,fp-y:0.5,quality:80/headshots/Gates_Moses.jpg?bossToken=1b1c508909c182b83d48dec5ea5c9e801e636851fcddc488a637c8d1ba604dfc" /> Moses Gates Vice President, Housing & Neighborhood Planning read the article view full bio Research <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/NYCHA-Scalable-Design-Solutions/8_Integrated-Extension-Rendering-2.png?bossToken=ee485b6ee11481a66cd6fbb51c344e1b1a6c1114f4699b3a20d480df07bc23ad" /> Scalable Design Solutions for NYCHA Creating better living conditions for residents while ensuring NYCHA’s future The architects at Peterson Rich Office produced a report of scalable solutions and design strategies to modernize NYCHA buildings and campuses and improve living conditions for residents as part RPA’s Kaplan Chairs for Urban Design fellowship. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/NYCHA-Time-to-Act/RockawayNYCHA.jpg?bossToken=bc6c3c481559dc905bb9ef2880e653d1caa639a1a87d73d49d4a074c8142020c" /> The Impacts of Living in NYCHA Needs for resident health in the Rockaways and beyond This report is meant to highlight the urgency with which we need to bring better conditions to NYCHA, because not doing so has a direct effect on the health of hundreds of thousands of residents. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/NYCHA-Time-to-Act/RPA_NYCHA-84.jpg?bossToken=c8c507289cc4f3fba48e82aaa831acffc92bd4a512e6ca3b3c13d8709fe678ad" /> Time to Act Restoring the Promise of NYC’s Public Housing That we have let more than 400,000 of our neighbors fall into terrible living conditions is a source of shame for us all. Government and the greater civic world of New York City need to engage on this issue. read more <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Copy-of-IMG_9786.jpg?bossToken=5bc821f41d5cd88a50456bc38d7f51ee47dee325357a92b59c2065909df205f1" /> NYCHA’S Crisis A Matter For All New Yorkers Decades of neglect and underinvestment by all levels of government—federal, state and city—have led to the current crisis facing the New York City Housing Authority (NYCHA). read more Action NYCHA Preservation Trust RPA celebrated passage of the NYCHA Preservation Trust Bill, which creates a new, more effective mechanism for raising and spending money on repairs and improvements within public housing. read statement NYCHA's "Blueprint for Change" RPA support NYCHA’s Blueprint for Change proposal but is calling for improvements, including giving NYCHA residents a greater role administering and overseeing the program. read more Testimony to New York State Assembly Standing Committee on Housing on Affordable Housing Development read the testimony RPA Lab <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/general/Tunnel-Construction.png?bossToken=774a68ef05f122b3d5af1e4ecd5b5051a872cea68c94a5d65417f4e840a0b175" /> Infrastructure Priorities for Biden's First 100 Days RPA compiled a list of projects and regulatory actions we recommend the Biden administration prioritize immediately. read more From the Archive <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/1931_HousingConditionsNYRegion.jpg?bossToken=b9ad33fc88c5e35416b59943befb34e9a1c8de72070ec7ee54795b3821f08660" /> 1931 Housing Conditions in the New York Region The housing problem is essentially social, but it cannot be solved without taking into considera­tion the economic factors with which it is inseparably associated. read more share Research Areas Housing & Neighborhood Planning Location New York'''
