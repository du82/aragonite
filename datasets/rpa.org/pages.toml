title = "RPA | About"
description = "For more than 100 years, Regional Plan Association has developed and promoted ideas to improve the economic health, environmental resiliency, and quality of life of the New York-New Jersey-Connecticut metropolitan area."
full_description = "Who We Are About RPA RPA is an independent non-profit civic organization that develops and promotes ideas to improve the economic health, environmental resiliency, equity, and quality of life of the New York metropolitan area. RPA conducts research on the environment, land use, and good governance, and advises cities, communities, and public agencies. Our Staff A dedicated group of planners, policy experts, urbanists, and advocates collaborate at RPA. Our staff combines decades of experience in transportation, housing, climate change, and advocacy from the public, private, and non-profit sectors to research and implement ideas that improve quality of life in the New York metropolitan area. Board of Directors RPA’s Board of Directors sets the strategic direction for the organization. Board members are prominent business, civic, academic, and philanthropic leaders who want to make their mark on the region and help elevate RPA’s profile and impact. Five committees govern the Board, and Board members may also participate in RPA’s state committees. Committees As a tri-state organization, RPA convenes three state committees - New York, New Jersey and Connecticut - that ensure RPA’s on-the-ground presence. Committee members advance each state’s strategic priorities by providing local context to policy issues, shaping political strategies, and expanding our network of influence. Join Our Team RPA is based in New York City, with offices in Newark, NJ, Princeton, NJ, and Stamford, CT. We encourage a challenging, collaborative, and fun work environment. We believe in work-life balance and value diversity. Employment and promotional opportunities are equal opportunity without regard to race, color, gender, age, sexual orientation,… Financials RPA is a 501(c)(3) non-profit organization and is publicly supported as described in 509(a)(1) of the Internal Revenue Code. History Regional Plans Since 1929, Regional Plan Association has released four long-range plans to guide the growth and development of the New York-New Jersey-Connecticut metropolitan area. These efforts have shaped and improved the region’s economic health, environmental sustainability, and quality of life. Ideas and recommendations put forth in these plans have led to… Timeline In 1922, some of the region’s most prominent urban planning experts and civic leaders joined forces to survey, analyze, and develop a comprehensive plan to make the region a better place to work and live. Nearly 100 years later, Regional Plan Association has developed and promoted ideas to improve the economic health, environmental resiliency, and… Celebrating a Century of Research, Planning, and Advocacy The Committee on the Plan of New York and its Environs formed in 1922 and released the First Regional Plan in 1929. For 100 years, RPA has worked to create a more equitable, healthy, prosperous, and sustainable region. Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today"
