["https://rpa.org/news/testimony/testimony-to-nys-public-service-commission-in-support-of-offshore-wind-transmission-project"]
title = "RPA | Testimony to NY's Public Service Commission in Support of…"
description = "Regional Plan Association works toward a better future for the tri-state region"
full_description = 'share RPA’s Vice President for Energy and Environment Robert Freudenberg recently posted Public Comments encouraging the Public Service Commission to continue its efforts to review projects like the Queensboro Renewable Express that would enable the state to be fully offshore-wind ready, in the face of recent federal actions to hamper offshore wind development. Dear Members of the Public Service Commission: Regional Plan Association strongly commends and supports the ongoing work of the Public Service Commission to secure a renewable energy future for New York and posts these comments with appreciation for the measures taken by the Commission and its staff in achieving this goal to date. Successful power generation from offshore wind is essential for New York to meet its commitment to 100% zero-emission electricity by 2040, detailed in the state’s Climate Leadership and Community Protection Act, signed into law in 2019. Despite recent executive action taken by the federal government to pause new offshore wind projects and review the economic and environmental impacts of current projects, RPA - through our research, planning, and advocacy - remains committed to advancing implementation of offshore wind energy in our region; a commitment we hope that the Commission shares. While the federal uncertainty may put into question the near-term progress of projects requiring federal leases and permits, the long-term necessity and opportunity for offshore wind in New York remains strong and we encourage the state and the Commission to do everything within their control to advance offshore wind in the ways that it can. This means moving forward on projects that make the State ​“offshore wind-ready” so that when the uncertainty lifts and projects move forward, New York will be ready to receive them and put them to work in short order. One such project that will position New York State to be offshore wind-ready is the Queensboro Renewable Express which would develop 18.5 miles of transmission lines between New York State waters and an interconnection point at the site of the Ravenswood Generating Station in Long Island City. Building this project will ensure that renewable energy can connect directly into the grid where demand is highest and will help Ravenswood Generating Station transition to a clean future with benefits for the surrounding community and beyond. New York State has long been a renewable energy leader, regardless of the political climate beyond its borders. At a time when goals around climate mitigation and support for environmental justice are under threat, the time to reinforce the State’s leadership is essential. We urge the Commission to continue its crucial work reviewing projects like this one and – when the merits of the project justify it - issue permits so that they can proceed. Any delay could signal an erosion of the State’s support for renewable energy, indicate an abandonment of its leadership role, and threaten its ability to meet climate targets. Written by <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.44,fp-y:0.32,quality:80/headshots/Freudenberg_Rob.jpg?bossToken=50c8f54ce05a687238b6a699d49aab6f1c2c3d65dd77183b35f0d781b8777a06" /> Robert Freudenberg Vice President, Energy & Environment Related Testimony Posts Feb 2025 in Energy & Environment History of the Grid and Major Projects Nov 2024 in Transportation Celebrating RPA’s 3rd and 4th Regional Plan Recommendation, Congestion Pricing, Coming to Fruition Nov 2024 in Transportation Letter to Gov. Kathy Hochul from the Congestion Pricing Now Coalition and Elected Officials Nov 2024 in Transportation RPA and the Congestion Pricing Now Coalition call on Governor Hochul to Implement the Program Immediately Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today'
year_published = 2025
year_updated = 2025
