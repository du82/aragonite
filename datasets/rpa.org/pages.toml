title = "RPA | 2025 Summer Internships"
description = "Regional Plan Association is seeking motivated and dynamic individuals to join our summer internship program. Interns will have an opportunity to undertake policy research, collect and analyze data, coordinate public meetings and workshops, publicize RPA work, and collaborate with an interdisciplinary staff of urban…"
full_description = "We are looking for individuals who share our passion for fostering equitable, healthy, sustainable cities and communities. We encourage a challenging, collaborative, and fun work environment. We also believe in work-life balance. Summer internships are a minimum of 10 weeks between May and August, though start and end dates are flexible. We are currently seeking candidates for several summer internships: Development Internship RPA is seeking a part-time intern to assist the Development team with funder prospecting and research, membership program strategy, and event planning. This is a great opportunity for an individual interested in learning more about individual and institutional giving as well as donor base building. Qualified candidates should have an interest in non-profit fundraising and RPA’s work. Transportation Planning Internship RPA is seeking a graduate-level intern to assist with our ongoing transportation research and advocacy on topics including Congestion Pricing, the Cross-Bronx Expressway, and regional freight policy. The internship will involve data analysis and mapping, as well as qualitative research. Candidates should have an interest and some working knowledge of transportation planning and policy, and a good foundation in data analysis and GIS skills. Governor James J. Florio Internship The Governor James J. Florio intern will have the opportunity to support the RPA New Jersey team on several initiatives, including researching growth trends in New Jersey municipalities, housing development in relation to the State’s fair share system, analyzing impacts of transit, and supporting stakeholder engagement regarding accessory dwelling units and other housing priorities. This internship may be located at RPA’s New York or New Jersey offices, depending on intern residence and project needs. Knowledge of New Jersey policies is a plus. Housing and Advocacy Internship The Housing and Advocacy Intern will support the New York Director and Housing team on various projects and campaigns, including housing, arts district planning, and workforce development. Responsibilities will include attending meetings, soliciting and completing research needs for sub-regional coalitions, developing educational material, providing policy and program analysis, and coordinating events and meetings as necessary. Qualified candidates should be a graduate student. Additional Intern responsibilities may include: Assisting with the development of policy reports and presentations on issues ranging from environmental sustainability, transportation, zoning, and land use.Supporting external communications, coalition building initiatives, and recording meeting minutes.Organizing public meetings, events, and outreach in partnership with governments and civic partners.Conducting in-depth data and systems analysis.Generating geospatial maps and other explanatory graphics for internal research and publication. Qualifications Recent graduate or current student in a Bachelor’s or Master’s program (see listings above) in a relevant field, such as urban planning, public policy, public health, economics, geography, political science, or environmental science.Strong writing and presentation skills.Ability to work well under deadlines.Demonstrated interest in urban planning and civics.Familiarity with Microsoft Excel, Adobe Creative Suite, GIS, or R is a plus.Experience with public outreach and engagement is a plus. Compensation This is a paid summer internship. Depending on education level, interns are offered between $18-$22.50/hr. RPA also offers the opportunity for interns to participate in a wide variety of events with thought leaders from around the city and the globe. Unless otherwise specified, these positions are based at RPA’s New York Office at 1 Whitehall St, and a minimum of two days per week in the office is expected. How to Apply Please submit your cover letter, resume, and work sample as a single attachment and clearly indicate which internship you are applying for. Please use the following file naming convention: ​“LastName_NameOfInternship_2025.pdf” Candidates are encouraged to attach a work sample that best reflects the internship they are applying for. We encourage people from backgrounds and life experiences often underrepresented in the urban planning field to apply, including but not limited to individuals from working class communities, BIPOC communities, and the LGBTQIA+ community. Applications will be reviewed on an ongoing basis until positions are filled. Because of the high volume of applications we receive, we regret that we are unable to reply to every applicant. We kindly request no phone calls or emails. Receive our monthly newsletter, insider updates and exclusive invitations to RPA events. become a member today"
year_published = 2025
