title = "RPA | RPA Annual Report, FY2020"
description = "Reflecting on the past year and planning for the region’s recovery and renewal, we can be proud of RPA’s contributions at this critical moment towards a more equitable, healthy, and sustainable society."
full_description = '''A Letter from the Chairman and President To our Supporters and Friends: When RPA’s staff and Board of Directors gathered nearly 12 months ago to set goals for the year ahead, the region and the world could not have looked more different than it does today. In 2020, we have been challenged like never before. As of this writing, a global pandemic has killed nearly 50,000 of our family, friends, co-workers, and neighbors in the New York metropolitan region. This has led to an economic crisis resulting in millions of lost jobs and shuttered businesses, with the burden falling hardest on service and retail workers and people of color, many of whom do not have citizen status, access to federal relief, or sufficient assistance. At the same time, the tragic murders of George Floyd, Breonna Taylor, and Ahmaud Arbery unlocked a fire that had been raging just below the surface of our society in the form of mass protests throughout the country against long-standing systemic racism and structural inequality. As the year gradually comes to a close, and with new leadership in Washington on the horizon, it is time for us to take stock of what we’ve come through and how we can continue to create a better future. The New York metropolitan region can and should lead the nation in this recovery. And there is no better organization to provide the kind of thoughtful and comprehensive solutions to help the region navigate what will be a difficult recovery than RPA. Our Board is comprised of a diverse array of leaders from regional, national, and international industries, academia, and the non-profit sector who not only provide critical insights into issues affecting our region, but, more importantly, consider it their fiduciary responsibility to promote the long-term sustainability of the region. Our talented and dedicated staff provide the independent research and critical analysis to better understand what is happening and provide realistic solutions to the challenges facing us. At a time when our political discourse is too often focused on spin and slogans, RPA’s work is more important than ever. Our region’s challenges are great, but by no means are they insurmountable. And while we are confident that the tri-state region will rise again, our recovery is not inevitable, nor will it happen overnight. 2020 has been marked by humanitarian and economic catastrophes of mammoth proportions. There will not be a return to what once was, nor should there be. Instead, in order to attain a recovery that positions our region to be more prosperous and more equitable than before, we need innovative and comprehensive solutions that create a path forward and champion what will be difficult decisions ahead. No other organization is better suited to provide these solutions than RPA. Whether we are entering an era of decline or come back stronger, fairer, and more resilient will depend on the choices we make now. As the trusted voice in matters related to planning for the region’s future, RPA is proud to once again lead the way. Thank you once again for your support and dedication to RPA’s mission. We look forward to working with all of you as we plan for a better and brighter future. Scott RechlerChairman Thomas K. WrightPresident and CEO When you support RPA, you are supporting the region's recovery and renewal. support rpa 1 Health I’m with RPA: Vanessa Barrios, Senior Associate, State Programs and Advocacy During the development of the Fourth Regional Plan, RPA committed to incorporating health as a core value of our work. In 2020, we advanced strategies to better link planning and health in our region and beyond. Through project work, reports, and social media posts, RPA used our platform to amplify the importance of addressing urban planning’s role in health disparities in our region and the need for our field to acknowledge and address those past wrongs. Related Report Nov 2017 The Fourth Regional Plan Making the Region Work for All of Us <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.96,fp-y:0.48,quality:80/work/LibraryLion2_2020-10-15-132219.jpg?bossToken=293378d05bda9f3e7dadf6934fd262e7d17742fc44a4a5a4d0fb30cff467ea55" /> Ensuring an Equitable COVID-19 Recovery The New York-New Jersey-Connecticut metropolitan region was the epicenter of the first wave of the COVID-19 pandemic, and RPA is working to ensure it becomes the epicenter of recovery. read more As the COVID-19 pandemic continues to take its toll on our region, we acknowledge that low-income communities have been disproportionately harmed. The pandemic has exposed deep disparities in health according to race, class, and geography. As we know from our research on the connections between planning and health outcomes, the recommendations made by planners have significant consequences in the face of a virus like COVID-19. The virus is most likely to affect people with pre-existing conditions, which can often be connected to the environments in which they live. For our nation to return to full physical and economic health, we must treat the underlying conditions that made us so susceptible to the COVID-19 pandemic.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.58,fp-y:0.34,quality:80/headshots/Jones_Chris.jpg?bossToken=13f8501c89471dfbc813583b84b107b4180f9be5c93e529d3cdd930478d68438" /> Christopher Jones Senior Research Fellow view full bio The RPA team is set to kick off the second phase of the Healthy Regions Planning Exchange program in 2021, consolidating the network of planners, practitioners, advocates, and community-based representatives who have convened in the past two years to address the structural issues that influence health and equity through regional planning across the United States. With support from Bloomberg Philanthropies and the Robert Wood Johnson Foundation, RPA will focus on knowledge sharing and network development, supporting regional partners to enable more effective responses to COVID-19, and addressing the structural roots of racial inequities affecting community health. Related Report Apr 2020 Healthy Regions 2 Housing I’m with RPA: Marcel Negret, Senior Planner The events of 2020 have driven home the need for safe, healthy, and affordable housing for all. Be My Neighbor RPA’s Be my Neighbor report outlines how we can use existing homes to expand the region’s housing options and help address racial and economic segregation. learn more This year we focused on the potential value of accessory dwelling units (ADUs) and conversions throughout the region, and found that we could create more than 500,000 new homes without any major new construction. These lower-cost, lower-impact housing solutions are particularly valuable for seniors who want to age in place, people who cannot afford a single-family home, and families who’d like to earn extra income. Our next step is implementation, and we’re working with coalitions to draft statewide language for ADU policies in New York, New Jersey, and Connecticut. <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Reports/2020-reports/NYCHA-Scalable-Design-Solutions/8_Integrated-Extension-Rendering-2.png?bossToken=745b2f9e304b08d92cdadfc1b878f7aa0d89c39b82ef17f7bb1c02f7480c9b0d" /> Rendering from RPA/Peterson Rich Office report: Scalable Design Solutions for NYCHA Restoring the Promise of Public Housing RPA published reports outlining the health impacts of NYCHA conditions and offering strategies to repair and upgrade buildings. learn more RPA also continued our work to restore New York City Housing Authority (NYCHA) facilities to a state of good repair to improve health and quality of life for the 400,000 New Yorkers who live in NYCHA housing. By partnering with Community Voices Heard, we conducted the farthest-reaching assessment to date on the relationship of housing conditions to resident health at NYCHA. We learned that approximately four out of five NYCHA residents need apartment repairs, and that living conditions affect the mental health of one in three residents. Our inaugural Kaplan Fellows for Urban Design also developed a new resident-first approach to upgrading NYCHA buildings and campuses. In New York, RPA’s testimony for New York City’s Fair Housing Plan, ​“Where We Live,” helped support a major policy shift toward prioritizing affordable housing in wealthier areas which have been able to prevent needed development. This fall, RPA published detailed data on demographics and housing characteristics for every city, town, and village on Long Island. By presenting over 30,000 data points in a visual, accessible way, our Long Island Housing Data Profiles are helping communities address the gap between rising housing costs and stagnant incomes as well as the legacy of housing discrimination which persists in some areas. In New Jersey, RPA has collaborated with the NJ Chapter of the American Planning Association and the County Planners Association to build awareness around policies that advance ADUs through a survey of planning and housing professionals, strategy planning sessions with State officials, and a panel discussion with elected officials. The discussion – ​“Two Homes, One Roof: Making New Jersey More Welcoming with ADUs,” – made clear the depth of interest in ADUs in New Jersey and hit on effective ways to pitch their benefits to the public. Related Report Oct 2020 Long Island Housing Data Profiles A visual guide to better understand Long Island's housing challenges and opportunities Investing in a diverse mix of housing options for people of all incomes is essential for economic recovery in Connecticut.” <img class="noscript" src="https://img.imageboss.me/general/cover/200x250/fp-x:0.5,fp-y:0.5,quality:80/headshots/Kaplan-Macey-Melissa_Headshot2.jpg?bossToken=47ce2414dfe35e93382a87241ce6ecae70bc529182696f1f0a85a35ec4fdde41" /> Melissa Kaplan-Macey Former Vice President, State Programs & Connecticut Director view full bio In Connecticut, RPA has focused on bringing economic opportunity and greater diversity to Fairfield County, which has the highest income disparity of any metro region in the United States and some of the worst residential segregation. Through our partnership with Fairfield County’s Center for Housing Opportunity (FCCHO), we are advancing new narratives to change how residents think about affordable housing and deconstruct the psychology of NIMBYism. Statewide, RPA delivered to Connecticut’s Department of Housing a comprehensive guidebook that every municipality can use to develop better affordable housing plans. We are also partnering with Desegregate CT, a coalition of neighbors and nonprofits working to change exclusionary land use regulations and create more diverse communities. Now is the time for Connecticut communities to change the planning and zoning codes that stand in the way of a more equitable and prosperous future. 3 Transportation I’m with RPA: Kate Slevin, Senior Vice President, State Programs and Advocacy As a result of the pandemic, public transit has been facing an existential crisis in 2020. Essential Service At a time when the region faces a deep recession and the future viability of the transit system is at risk, there are no good options for cutting costs. Here’s what we recommend. read the report <img class="noscript" src="https://img.imageboss.me/general/cover/500x500/fp-x:0.5,fp-y:0.5,quality:80/work/Reports/2020-reports/Essential-Service/MTA-sign-Covid-corona.jpeg?bossToken=0634c8cf2a000b055530ad991c7787e382d27a1a17e8b30f9ab5cd3919ec646e" /> The pandemic has taken a devastating toll on subway, bus, and commuter rail ridership and revenue throughout the region. Recognizing the dire situation facing our region’s transit agencies -- especially the MTA -- RPA immediately joined with advocates to push the federal government for more emergency aid and we haven’t let up. Since agencies received a first round of funding from the initial CARES Act in March, a broad coalition of advocates has been fighting to ensure future relief bills include funding for transit agencies. In addition, as RPA recommended, the MTA and Port Authority have been given access to the Federal Reserve’s Municipal Liquidity Facility. Looking Forward We are hopeful that the Biden Administration will help fund transit agencies and remove bureaucratic hurdles that are holding up key transportation projects. learn more <img class="noscript" src="https://img.imageboss.me/general/width/500/quality:80/work/Reports/2020-reports/Bikeway/RPA_BikewaysReport_SimpleMapArtboard-1.png?bossToken=f80d999661ead62d76c72b4d702dc8942fe4b5dcf2d918b3c1faf512e37ce3ea" /> As people across the region and country have grown more reliant on alternative modes of transportation during the pandemic, we’ve seen a dramatic increase in bike use. Services like CitiBike have set new daily ridership records month after month. Speaking directly to this biking boom, RPA released The Five Borough Bikeway in June calling for a 425-mile comprehensive, citywide network of protected, high-capacity bike lanes throughout New York City. The report illustrates the need and the opportunity for increased, safe cycling to address issues of climate change, congestion, health, and mobility equity, and we are working with partners across the city on its implementation. Building Gateway After more than a decade of advocacy from RPA, the region is closer than ever before to breaking ground on the Hudson River Tunnel project. learn more RPA continues to make the case for Gateway and a better Penn Station. The Gateway Program got some good news this summer when the Portal Bridge, a key piece of the project, finally received a green light and federal funding. A survey conducted by the Build Gateway Now coalition this fall demonstrated that residents believe commuters will return to mass transit, transit agencies should get more emergency aid, and that Gateway deserves public investment. Now under a new federal administration, the Hudson River Tunnel may be closer to construction than ever before, with a Record of Decision for the long-stalled environmental impact statement and billions in federal funds close to being unlocked. During this pandemic, three quarters of NJ’s bus riders have been essential frontline workers going to work to keep our state running. We must invest at the federal level in order to make bus service more reliable and efficient.https://t.co/1m027t9wEb— Sen. Cory Booker (@SenBooker) November 20, 2020 RPA continues to urge state and federal leadership to fund NJ Transit, especially the bus network. Our report Better Service: Improving the Bus Network in New Jersey pointed out that essential frontline workers, people of color, and women disproportionately depend on local buses, and that buses must be prioritized in state budgets and on city streets. 4 Energy, Climate, and Open Space I’m with RPA: Rob Freudenberg, Vice President, Energ'''
