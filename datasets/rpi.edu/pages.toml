full_description = "Come Change the World With Us! Make a world-changing difference at the nation’s oldest and one of the world’s most renowned technological research universities, Rensselaer Polytechnic Institute, where students, faculty, and alumni have been defining the scientific and technological advances of our world for 200 years. Join a legacy of changemakers confronting the most pressing problems facing humanity and our planet. Get Started 51st University in the Nation 110k Living Alumni #46 Most Innovative School Research Our researchers transcend disciplines and work together to address a range of global challenges, focusing on five key areas of research: Biotechnology and the Life Sciences Computational Science and Engineering Energy, Environment, and Smart Systems Media, Arts, Science, and Technology Nanotechnology and Advanced Materials Academics We offer more than 140 undergraduate, graduate, and doctoral programs across five schools as well as programs and certificates for working professionals: School of Architecture School of Engineering School of Humanities, Arts, and Social Sciences Lally School of Management School of Science Rensselaer at Work — Education for Working Professionals Life at Rensselaer We develop technological leaders who are global citizens prepared to change the world: Student Experience CLASS The Arch Diversity, Equity, and Inclusion First Year Experience Student Union Campus Map 200+ Student-Led Clubs 23 NCAA Athletic Teams 50+ Club Sports Make a world-changing difference at the nation’s oldest and one of the world’s most renowned technological research universities, Rensselaer Polytechnic Institute, where students, faculty, and alumni have been defining the scientific and technological advances of our world for 200 years. Join a legacy of changemakers confronting the most pressing problems facing humanity and our planet."
