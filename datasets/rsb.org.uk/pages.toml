["https://rsb.org.uk/component/banners/click/82"]
title = "Journal of Biological Education"
description = "Journal of Biological Education is an international journal that covers policy and curriculum developments"
full_description = "Journal of Biological Education The Journal of Biological Education is an international journal that publishes the latest research into the teaching, learning and assessment of biology. It is owned by the Royal Society of Biology and published by Taylor and Francis. The journal aims to bridge the gap between research and practice, providing information, ideas and opinion, in addition to critical examinations of advances in biology research and teaching. Through the coverage of policy and curriculum developments, the latest results of research into the teaching, learning and assessment of biology are brought to the fore. Special emphasis is placed on research relevant to educational practice, guided by educational realities in systems, schools, colleges and universities. Papers that are theoretically informed and methodologically rigorous are welcomed. Subscription Fees We offer a special print-only subscription rate for Royal Society of Biology members for an annual fee of £40 (complete the subscription form or contact the RSB membership team for more details). Under the RSB's Schools and Colleges Affiliation Scheme (SCAS) UK-based schools and colleges can subscribe to the journal for just £60. Non-member subscription rates for the journal can be found on the Taylor and Francis website. Please contact the Taylor and Francis customer services team if you have any queries or would like to take out a subscription. Archive The archive of the journal and the current issue can be accessed at Taylor and Francis online. Details of the editorial board, instructions for authors and the journal scope are also available. Read a sample issue. Research Guidelines All articles that appear in the JBE must adhere to the ARRIVE guidelines for the reporting of in vivo experiments. The guidelines have been developed by the NC3Rs to improve standards of reporting of animal experiments, and ensure research featured in the JBE is based on sound and ethical experiments."
