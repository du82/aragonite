["https://rsb.org.uk/events/antibody-drug-conjugates-revisited"]
title = "Antibody Drug Conjugates Revisited"
description = "The leading professional body representing many of the learned societies and other organisations making up the diverse landscape of the biological sciences, as well as thousands of individuals"
full_description = "Plant Health Series: The importance of plant health in One Health Date05.03.25Start time14:00End time15:00WhereOnline (Zoom) Log in or register to make a booking Plant Health Series: The importance of plant health in One Health A talk as part of the RSB Plant Health Series This keynote address will be delivered by Sarah Brunel, Implementation and Facilitation Unit (IFU) lead at the International Plant Protection Convention (IPPC). The emergence and subsequent spread of pests and diseases can have a devastating economic, environmental, and public health impact across populations, affecting biodiversity, food security, and commercial trading. As new plant health threats continue to emerge, it is important to consider plant health in the context of One Health, and integrate this into appropriate practice and principles. Effective statutory protections and standards in this area, alongside controls to stop the spread of pests, play a critical role in mitigating future plant pandemics. The IPPC aims to help implement these practices, developing international standards and procedures in this sector. This talk will be followed by an opportunity for an audience Q&A and discussion, chaired by Professor Jeremy Pritchard FRSB, University of Birmingham. The speaker Sarah Brunel leads the Implementation and Facilitation Unit (IFU), which coordinates implementation, facilitation and capacity development activities such as the production of IPPC guides and training materials, phytosanitary capacity evaluations and capacity strengthening activities to address emerging pests. Sarah's focus is on the coordination of implementation projects and management of the IFU's workplan, including staffing, budgeting, resource mobilisation and strategies. She is the IPPC Secretariat's lead on One Health. Sarah is also the secretariat's liaison with organisations such as the Standards and Trade Development Facility (STDF), Centre for Agriculture and Bioscience International (CABI), Comité de Liaison Entreprenariat - Agriculture - Dévelopement (COLEAD), the European Union and the Europead Feed Safety Authority (EFSA). Sarah is an agricultural engineer from the Institut Supérieurr d'Agriculture Rhône-Alpes (ISARA). She has a master's degree in international affairs and another in anthropology from the Sorbonne University and the French Museum of Natural History, respectively. She has more than 20 years of national, regional and international experience in plant protection, pest and disease control policies and legistaltion, implementation of standards for phytosanitary measures, environmental protection and capacity development. She is a French national and speakers English, French, Italian and Spanish. Audience This event is open to all, but will be particularly relevant to scientists including those working in areas related to plant health. Continuing Professional Development (CPD) This event is approved by the Royal Society of Biology for purposes of CPD and can be counted as 3 CPD points. If you are a member of the Plant Health professional register, this CPD contributes to maintaining your registration. Special requirements If you have any accessibility requirements, please let us know during your booking, and we will do what we can to accommodate your needs. Cost and booking Bookings for this event will open in due course. If you have any questions, please email Ellie Barrand at events@rsb.org.uk Contact For booking, website or events queries, please contact Ellie Barrand at events@rsb.org.uk or on 020 3925 3444."
