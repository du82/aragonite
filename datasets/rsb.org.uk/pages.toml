title = "Heads of University Biosciences"
description = "Heads of University Biosciences (HUBS) is a Special Interest Group of the Society of Biology"
full_description = "HUBS Heads of University Biosciences (HUBS) is a Special Interest Group of the Royal Society of Biology, and builds on the work of the previous Heads of Biological Sciences. The Group is open to heads of departments and subject leads or nominees, and aims to address the particular challenges of managing biological and life science departments and units in UK higher education (HE). HUBS acts as a forum for discussing issues on the provision and funding of research and teaching in the biological sciences, and as a source of informed comment on the consultations of the day that affect HE institutions delivering in the biological and life sciences. HUBS runs an annual meetings for members, which features sessions on higher education policy, research, and teaching and learning in the biosciences. The HE Bioscience Teacher of the Year Award is made at this meeting. For more details please see the HUBS news and events page. As a Special Interest Group of the Society, HUBS contributes to national debates on priorities in the biosciences, and our higher education policy work is informed by upwards of 3,000 academic specialists in the UK's academic departments. We invite any higher education institutions not currently involved to join the group and help develop it to make it relevant to and supportive of the biosciences across the UK and internationally. Further details about joining HUBS are on the membership page. For more information on the Society's HE work including HE policy responses, our work on the Degree Accreditation Programme and our HE teaching awards, please see the higher education policy section of our website. Read the HUBS constitution Read the HUBS 2024-2027 Strategy Document Follow us on X (formerly Twitter) @BiosciHeads ECLbio@HUBS Connect This is an online platform developed by Early Career Lecturers in Biosciences Forum and Heads of University Biosciences hosted by the AdvanceHE Connect. This reference point for bioscience teachers and investigators provides curated resources for teaching, research, scientific outreach and funding. The site delivers online support materials for new lectures, as well as webinar recordings of past workshops on a variety of topics. This platform also serves as secure and safe forum of exchanging ideas and experiences among the bioscience lecturers community. It is open to any HUBS member university.To connect: Register with AdvanceHE connect here: https://connect.advance-he.ac.uk/signup Once logged in, click on the connect tab and search for HUBS in the righthand side search box, the HUBS-ECLBio Biosciences Lecturer Resources and community will appear Request to join the HUBS-ECLBio community"
