full_description = "Careers & CPD Pursuing a career in biology is stimulating and rewarding. The RSB support biologists with career advice, professional recognition and training events. Registers The Society recognises professional biologists through Registers licences, including: Registered Science Technician (RSciTech) Registered Scientist (RSci) Chartered Scientist (CSci) Chartered Biologist (CBiol) Chartered Science Teacher (CSciTeach) Careers There are a range of options available for secondary school pupils and university students to find out more about a career in biology. To get started take a look at our careers pages for more information on work experience, apprenticeships, university, jobs and more. Training Our training programme is expanding, offering a wide range of courses for all abilities and interests both personal and professional, including persuasive scientific writing, presentation skills and drug development. Courses are offered at a substantial discount to members. View our current courses and book your place now. See a full list of the Society's past training events. CPD The importance of keeping up to date is particularly necessary in today's demanding society. CPD is a useful tool for achieving and demonstrating such ability and competence."
