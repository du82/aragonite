description = "Careers advice from the Royal Society of Biology"
full_description = "Careers Take control of your future Biology offers a wide range of career options and opportunities for school-leavers, apprentices, graduates, and postgraduates. Whichever stage of your career you're at - from deciding whether to study biology at school, college or university, to working out what to do after you graduate - the Royal Society of Biology is here to help. Working as a biologist First of all, there's no such thing as a typical biologist. Entering a career in biology could take you in almost any direction you can think of, and to anywhere in the world."
