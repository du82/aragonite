["https://rsb.org.uk/component/banners/click/121"]
title = "Home"
description = """
Find out about the variety of careers open to bioscience students at the annual Royal Society of Biology Bioscience Careers Day (BCD).
Event format 
This year the Bioscience Careers Day will take place online on Tuesday 25 - Thursday 27 March, from 12:30-14:30 via Zoom and will include:

 

Talks from industry professionals about the variety of careers available to bioscience graduates
A chance to ask questions to representatives from learned societies and top organisations
Interactive sessions designed to boost your skills in mastering the art of science communication



 
Topics included careers in pharmaceutical science, science communication, AI and machine learning and many more. 

Programme
The theme for this year's BCD is bioscience careers in the modern day and a draft programme is available to view.  We've previously had talks on careers in industry, science communication, publishing, academia, ecology, patent law, teaching and more at past events. Download top presentations from past events. What career would you like to know more about? Get in touch with the events team at events@rsb.org.uk or contact us on social media @RoyalSocBio using #RSBCareersDay.

Tuesday 25 March - Science communication interactive panel: learn how to effectively share scientific ideas with a diverse audience
Wednesday 26 March - AI and machine learning: areas of the biosciences they are transforming and the skills needed to get involved
Thursday 27 March - Career paths outside of academia/ industry: explore the different options available 

Attendees to more than one session will receive a certificate of attendance. There will also be the opportunity to win free access to RSB training in Artificial Intelligence and Machine Learning or Writing for Non-specialist Audiences.
Who can attend
BCD is aimed at undergraduate and master's students. Recent bioscience graduates, PhD students, postdocs, careers advisors and school/ college students considering a bioscience degree are also very welcome. Employers, if you would like to connect with talented students focused on their future careers, visit our sponsorship opportunities pages, or contact Ellie Barrand at events@rsb.org.uk to discuss opportunities. 
 
If you are an employer wanting to find out more about sponsoring this event, please get in touch by emailing Ellie Barrand at events@rsb.org.uk 
Sponsorship opportunities 
If you would like to get involved in BCD and showcase the opportunities your company can offer to bioscience graduates, please visit our Sponsors and Supporters page to view our sponsorship packages. 

Cost
RSB members - £5
Member of a Careers Committee organisation (see below) - £5
Non-member - £10
Bookings and bulk bookings
Bookings for this event can be made via the event page. You can submit questions for speakers ahead of time by emailing your questions to events@rsb.org.uk
If you would like to organise for a group of your students to attend, please email events@rsb.org.uk

Contact 
Please direct all enquiries to Ellie Barrand at events@rsb.org.uk or on 020 3925 3444. 


Continuing Professional Development (CPD)
This event has been approved by the Royal Society of Biology for purposes of CPD and can be counted as 18 CPD points.

Cancellation policy
Over 10 working days before the event = 100% refund less 25% administration feeBetween 5 and 10 working days before the event = 50% refund less 25% administration feeLess than 5 working days before the event = 0% refund 
For more information, please visit the terms and conditions on the RSB website. 


Careers Committee 
This event is supported by the following organisations, who have worked collaboratively with the Royal Society of Biology to bring together a diverse line-up of speakers for this event. The Association of the British Pharmaceutical Industry, the Biochemical Society, the British Ecological Society, the British Pharmacological Society, the British Society for Immunology, the Gatsby Plant Science Education Programme, the Microbiology Society, the Society for Experimental Biology and the Physiological Society."""
