["https://rsb.org.uk/education/publications"]
title = "Publications"
description = """
Our publications and specialist journals produced by our Member Organisations 
The Biologist is the Society's quarterly member magazine that carries the full richness and diversity of biology. Science is brought to life with stimulating and authoritative features, while topical pieces discuss science policy, new developments or controversial issues.
The Journal of Biological Education is an international journal that publishes the latest research into the teaching, learning and assessment of biology. It is owned by the Royal Society of Biology and published by Routledge.
Emerging Topics in Life Sciences
Science is rapidly changing and boundaries between disciplines are blurring. To support the needs of researchers who are moving fields or require an overview of an emerging topic, we are delighted to announce Emerging Topics in Life Sciences, a brand new journal coming in early 2017 jointly owned by the Royal Society of Biology and the Biochemical Society.
Covering research-driven reviews, each issue will focus on new or growing fields of life science research. Written for an interdisciplinary audience ranging from students and early career researchers to established scientists who are switching fields or adopting new techniques, each issue will be guest edited by an expert in the field allowing researchers to remain up t -date with recent advances, useful overviews and emerging trends across the life sciences.
Our Member Organisations produce a range of excellent specialist journals covering the latest advances in the fields of biochemistry, ecology, pharmacology, immunology, microbiology, endocrinology, physiology and more."""
