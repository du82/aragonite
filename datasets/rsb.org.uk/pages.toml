["https://rsb.org.uk/about-us/governance"]
title = "Governance"
description = "Governing documents for the Society of Biology including strategy document"
full_description = "Governance Governance documents regarding the aims, processes and codes of conduct of the Royal Society of Biology (RSB) and our members are all publicly available The RSB is incorporated by a Royal Charter and further governed by the Bylaws and Regulations. In 2019, the Society celebrated 40 years of the Charter, which is agreed by Her Royal Majesty's Privy Council, as are the Bylaws. The Royal Charter outlines the parameters within which the RSB can operate and the charitable objectives it must adhere to. The Bylaws detail the structure of the organisation and the Regulations provide instructions on the day-to-day functioning of the Society. The RSB Council has the power to amend the Regulations. Royal Charter Bylaws Regulations Annual report and accounts The RSB financial year runs from 1st October to 30th September. Each year we publish a report detailing all the work that has gone on during the financial year, as well as the full set of accounts which are formally approved by our membership at Annual General Meetings. Annual report and accounts for year end September 2023 Annual report and accounts for year end September 2022 Annual report and accounts for year end September 2021 Annual report and accounts for year end September 2020 Annual report and accounts for year end September 2019 Annual report and accounts for year end September 2018 Annual report and accounts for year end September 2017 Annual report and accounts for year end September 2016 Other useful governing documents Professional Code of Conduct Council Member/Trustee Role Description"
