title = "CPD"
description = "CPD is the process through which an individual maintains and extends the knowledge and skills necessary for lifelong professional competence"
full_description = "CPD Continuing Professional Development (CPD) can be defined as 'the process through which an individual maintains and extends the knowledge and skills necessary for lifelong professional competence'. Why do CPD? In a fast moving world, it is ever more important to keep up to date in order to maintain standards and demonstrate competence. As the professional body for biologists, we recognise that a diverse range of knowledge, skills and attributes are required by bioscientists working in numerous and varied professions. Our CPD scheme is wide ranging as we appreciate our members come from all areas of the life sciences, and the development of one member may differ widely from the development of another. Our CPD scheme is points based. We ask that you attain 50 CPD points throughout the year, allocating between one and three points per hour depending on the activity. What activities count towards CPD? Almost any activity that develops your valuable skills as a life science employee qualifies for CPD. A small selection includes: training staff, learning a new practical technique, presenting at a conference, volunteering, and self-study in any area of biological interest. Our CPD Guide contains a full list of the varied activities which can count towards an individual's CPD record. We also help you meet the targets for annual progression with RSB CPD approved events all of which are worth 3 points per hour. Upcoming Approved Events are always in our Members Newsletter. The RSB offers in person training and online training via myLearning which can also count towards your CPD. Many other RSB external, and member organisation events may also contribute to your development. As a member of the Society, you gain access to our online members' portal (mySociety), where you can register to begin recording CPD. Each activity is uploaded individually, along with a description of the event, the time spent on it and statements reflecting on how it has impacted on your professional development. You can add activities as frequently as you wish and upon completion of your CPD year with 50 points achieved or more, you will be issued a certificate. How do I log my CPD? When recording your CPD online on myCPD (through mySociety) please ensure that you address the following standards when completing the ‘My Review’ section: A registrant must seek to ensure that their CPD has contributed to the quality of their practice. In this section you should write a statement on how the activity has benefitted your professional practice. The purpose of this section is to help you reflect on the activity, thinking about what you learnt and how it has impacted you. A written reflection also provides evidence of the activity undertaken. A registrant must seek to ensure that their CPD benefits the users of the service (employee, customer, student etc). In this section you should write a statement on how others (such as a colleague, employee, student, or the wider community) have benefitted from the CPD activities you have undertaken if applicable. For more information on CPD, see the Science Council CPD Assessment Criteria, the CPD Guide pdf or email us. Example CPD records Example RSciTech CPD Record Example RSci CPD Record Example CSci CPD Record"
