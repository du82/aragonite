g on strategy, team development, partnerships, impact measurement and communication. Dr Jade Hall MRSB Senior Science Policy Officer (Equality, Diversity, Inclusion and Culture) 020 3925 3466 Jade leads delivery of our science policy outputs relevant to biosciences research culture. She supports the RSB Diversity and Inclusion Working Group and RSB Diversity and Inclusion Network. She convenes cross-team collaboration to develop and deliver the RSB’s equality, diversity and inclusion commitments. Kieran Woof MRSB Senior Science Policy Officer (Plant and Environmental Sciences) 020 3925 3470 Kieran leads delivery of our science policy outputs relevant to the plant and environmental sciences. He supports the RSB Plant Science Group and the Natural Capital Initiative. He convenes cross-team collaboration to develop and deliver the RSB’s climate and nature commitments. Sabrina Fleurimé MRSB Science Policy Officer (Research Landscape) 020 3432 8504 Sabrina leads and supports delivery of our science policy outputs relevant to the biosciences research landscape (including research funding, workforce, infrastructure and communications). She supports the RSB Education and Science Policy Committee. Dr Steph Preston Science Policy Assistant (Animal and Biomedical Sciences) Steph provides co-secretariat support for the UK Bioscience Sector Coalition helping to facilitate collaborative, coordinated policy work between member organisations. Publications Tom Ireland MRSB Managing Editor 020 3925 3464 Tom is editor of the RSB's membership magazine, The Biologist, both in print and online, and advises on our external communications. Charlotte Cross Senior Publications Officer 020 3925 3465 Charlotte supports RSB’s partner publications, including the Journal of Biological Education, Emerging Topics in Life Sciences, and the Oxford Biology Primers series. She also assists with The Biologist magazine. Communications and Public Affairs Download a department organogram or get in touch vi