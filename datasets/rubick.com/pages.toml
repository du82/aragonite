["https://rubick.com/engineering-handbook-tools"]
title = "Jade Rubick - What tools to use for an engineering handbook"
description = "Reviews the various tools you can use for an engineering handbook and process documentation in general."
full_description = 'What tools to use for an engineering handbook 2023-02-18processengineering-handbookThis contains my experience choosing tooling for an engineering handbook. It also has some points that might be relevant if you’re evaluating a wiki. <picture><source srcset="/static/9fd5709b43bcf121dd935de7f1f0cef3/16d62/umbrellas-2.jpg 200w, /static/9fd5709b43bcf121dd935de7f1f0cef3/27ec1/umbrellas-2.jpg 400w, /static/9fd5709b43bcf121dd935de7f1f0cef3/5fd6b/umbrellas-2.jpg 800w, /static/9fd5709b43bcf121dd935de7f1f0cef3/5a523/umbrellas-2.jpg 1200w, /static/9fd5709b43bcf121dd935de7f1f0cef3/b46c2/umbrellas-2.jpg 1600w, /static/9fd5709b43bcf121dd935de7f1f0cef3/c0a0e/umbrellas-2.jpg 1889w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/9fd5709b43bcf121dd935de7f1f0cef3/16d62/umbrellas-2.jpg 200w, /static/9fd5709b43bcf121dd935de7f1f0cef3/27ec1/umbrellas-2.jpg 400w, /static/9fd5709b43bcf121dd935de7f1f0cef3/5fd6b/umbrellas-2.jpg 800w, /static/9fd5709b43bcf121dd935de7f1f0cef3/5a523/umbrellas-2.jpg 1200w, /static/9fd5709b43bcf121dd935de7f1f0cef3/b46c2/umbrellas-2.jpg 1600w, /static/9fd5709b43bcf121dd935de7f1f0cef3/c0a0e/umbrellas-2.jpg 1889w" src="/static/9fd5709b43bcf121dd935de7f1f0cef3/5fd6b/umbrellas-2.jpg" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> The ideal tool would have these qualities: A short edit loop. A challenge with maintaining process documentation is that the cost of making changes is often too high. The more expensive it is to suggest changes, the less participation you’ll have. This is something I think most leaders underestimate the importance of. I suggest you look at two scenarios when evaluating tooling: How much effort does it take to correct a typo? How much effort does it take to add a new page? You know this is an issue when people will propose a workflow like this: We’ll use Google Docs to collaborate on things before they’re official. Then we’ll copy them into Confluence when we’re done. This is acknowledging that Confluence is terrible at the job of collaboration. So why would you choose to store your content there long-term? Github Google Docs Confluence Slite/Notion-like wikis Correct a typo Days Seconds Tens of seconds Seconds Add a page Days Tens of seconds Tens of seconds Tens of seconds Based on this criteria alone, I tend to order these solutions like this: Modern wikis (Slite/Notion) or Google Docs > Confluence > Github Easy for many types of people to contribute. If you’re an engineering leader, you may care mostly about engineering. So you may think you should focus on engineering team needs for the handbook. But you’ll soon find that Product and Design and Support will all want to be a part of your process docs. It’s useful to be able to work on a shared process with Support. Some tooling is harder for other specialties to use. Github is primarily an engineering tool, for example, and is challenging for many types of people to engage with. Based on this criteria, I tend to order these solutions like this: Google Docs > Modern wikis (Slite/Notion) > Confluence > Github Have flexible permissions and an approval process. Ideally, you’d have some sort of an approval process, and you can have a discussion about a set of changes. For larger changes, Github is pretty ideal. You can write up a set of changes and have an approval process that the change goes through. But the approval process for Github takes so long that I find it disincentivizes minor edits, and your process documents will degrade over time. In fact, I find it so bad that I’d rather have no approval process and just open up process docs to allow anyone to edit everything than to have a rigorous approval process. But your organization may have different preferences. Google Docs is pretty hard to beat, from both a permissions perspective, and the ability to suggest changes. You can set your permissions based on the context, which is a major advantage. Sensitive content can be set up so anyone can suggest changes. But less sensitive content can be world editable. And the “suggest changes” functionality is truly useful. However, Google Docs does have some awkwardness around inheriting permissions from parent folders. Based on this criteria, I tend to order these solutions like this: Google Docs > Github > Confluence > Modern wikis (Slite/Notion) Easy to organize your content. Finally, you want to be able to navigate your content and organize it. Github Google Docs Confluence Slite/Notion-like wikis Ability to organize content Slow, requires technical skills. Slow. Have to manually insert links for everything. Fairly easy Fairly easy For ease of content organization: Confluence and modern wikis (Slite/Notion) > Google Docs > Github Ease of marketing. Finally, you need to get an organization of people to use these process docs. Some tools are easier to market than others. Github Google Docs Confluence Slite/Notion-like wikis Marketability Engineers will love to use it. Signals you care about their participation. Others will feel excluded. Everyone will complain that it seems wrong to use Google Docs for a handbook. Everyone will think it’s a natural place to put things. But won’t use it without prodding. If you’re already using the tools, people will think it’s natural. Based on this criteria, I tend to order these solutions like this: Github or Slite/Notion-like wikis > Confluence > Google Docs Conclusion I recommend using a modern wiki for process docs (Slite or Notion are the ones I would start with). I would also consider using Google Docs. (Note I get a referral fee if you click the link above for Slite, but recommended it long before I included that link and will remove the link if I find another wiki I prefer). If I wanted to kickstart the process with engineering, I would consider using Github for a while. You could then migrate to another tool when other functions like product and design and support want to participate. Image by Pexels from PixabayI can help! Learn more and contact me. Or subscribe to my newsletters and podcast.Please enable Javascript to view comments.Comments powered by Talkyard.Your process should be open source 2023-02-18 Advice for new directors 2023-02-20'
