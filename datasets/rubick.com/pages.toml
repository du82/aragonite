["https://rubick.com/candidate-review-meeting"]
title = "Jade Rubick - The secret to holding a candidate review meeting that isn't boring as hell"
description = "Avoid the typical boring candidate review meeting, where everyone summarizes their feedback. Instead, use this surprisingly effective approach!"
full_description = '''The secret to holding a candidate review meeting that isn't boring as hell 2023-04-10interviewingmeetingshiringMost candidate debrief meetings are super-boring. Everyone just reads the feedback they already put into the application tracking system. A couple of years ago I was introduced to a much better approach, and I’d like to share that today. <picture><source srcset="/static/ef4039df73f806917c0e35862b9aaee5/16d62/python.jpg 200w, /static/ef4039df73f806917c0e35862b9aaee5/27ec1/python.jpg 400w, /static/ef4039df73f806917c0e35862b9aaee5/5fd6b/python.jpg 800w, /static/ef4039df73f806917c0e35862b9aaee5/5a523/python.jpg 1200w, /static/ef4039df73f806917c0e35862b9aaee5/b46c2/python.jpg 1600w, /static/ef4039df73f806917c0e35862b9aaee5/082a6/python.jpg 1860w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/ef4039df73f806917c0e35862b9aaee5/16d62/python.jpg 200w, /static/ef4039df73f806917c0e35862b9aaee5/27ec1/python.jpg 400w, /static/ef4039df73f806917c0e35862b9aaee5/5fd6b/python.jpg 800w, /static/ef4039df73f806917c0e35862b9aaee5/5a523/python.jpg 1200w, /static/ef4039df73f806917c0e35862b9aaee5/b46c2/python.jpg 1600w, /static/ef4039df73f806917c0e35862b9aaee5/082a6/python.jpg 1860w" src="/static/ef4039df73f806917c0e35862b9aaee5/5fd6b/python.jpg" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> A better format for candidate review meetings Instead of a meeting where people summarize their feedback, you as hiring manager do some work ahead of time. Go through all the written feedback. Make a list of observations that seem to be common between people. Then, more importantly, make a list of observations that contradict each other. Did some people have feedback that doesn’t match up? Did people bring up concerns that didn’t get responded to? During the meeting: Quickly summarize the feedback on the candidate Then move to the important part: go through the points people had disagreement about, and dig deeper on them, in a safe and curious way. For example: “Lisa, I noticed you were concerned about how the candidate communicated about their employer. But Josh said glowing things about how they talked about their team. Can you both share a little about that portion of the interview, what questions you asked and what you uncovered?” Your objective is to get to a set of tradeoffs with the candidate. You want the hiring manager to be able to say, Candidate A is stronger in these respects, and weaker in these respects. Candidate B has these other unique strengths, but is less well developed in these other areas. This gives the hiring manager the information they need to make an informed decision. Why this format works I’ve found that a lot of observations and assumptions break down when people have these type of discussions. An observation like, “they’re not very good at receiving feedback”, will become way more nuanced when you have a discussion about how you asked the question and what they said. And when people have opposing feedback, it forces your interviews to improve, because that conflict becomes apparent. Thank you Shaun Yelle introduced me to this meeting format. Image by Stefan Parnet from PixabayI can help! Learn more and contact me. Or subscribe to my newsletters and podcast.Please enable Javascript to view comments.Comments powered by Talkyard.How an executive advisor can help you grow faster and navigate unfamiliar terrain 2023-04-04 The ultimate playbook for hiring engineering managers - a step-by-step guide 2023-04-11'''
