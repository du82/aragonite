title = "Jade Rubick - Your hiring process is too slow -- speed it up with these five tips"
description = "The easiest way to improve your hiring is to speed it up. Here's how: use an SLA, reduce steps, use schedule blocks, present instant offers, and use a modified rolling approach."
full_description = '''Your hiring process is too slow -- speed it up with these five tips 2021-07-19hiringdiversity-equity-and-inclusionscalingpay-equity<picture><source srcset="/static/876638e3bc74c900022da411856d262a/16d62/hiring-fast.jpg 200w, /static/876638e3bc74c900022da411856d262a/27ec1/hiring-fast.jpg 400w, /static/876638e3bc74c900022da411856d262a/5fd6b/hiring-fast.jpg 800w, /static/876638e3bc74c900022da411856d262a/5a523/hiring-fast.jpg 1200w, /static/876638e3bc74c900022da411856d262a/b46c2/hiring-fast.jpg 1600w, /static/876638e3bc74c900022da411856d262a/03f0e/hiring-fast.jpg 1916w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/876638e3bc74c900022da411856d262a/16d62/hiring-fast.jpg 200w, /static/876638e3bc74c900022da411856d262a/27ec1/hiring-fast.jpg 400w, /static/876638e3bc74c900022da411856d262a/5fd6b/hiring-fast.jpg 800w, /static/876638e3bc74c900022da411856d262a/5a523/hiring-fast.jpg 1200w, /static/876638e3bc74c900022da411856d262a/b46c2/hiring-fast.jpg 1600w, /static/876638e3bc74c900022da411856d262a/03f0e/hiring-fast.jpg 1916w" src="/static/876638e3bc74c900022da411856d262a/5fd6b/hiring-fast.jpg" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> This is a part of a series of articles on hiring and recruiting. The easiest way to improve your hiring is to speed it up. Here is how to do that. Hiring faster can drive immense improvements Hiring for a position is a thoughtful and deliberate process. And it can take a lot of effort and time to get to the point where you’re confident making a decision on a candidate. But all that deliberation comes at a cost. Imagine your process took twice as long as it does now. Wouldn’t that result in a lot of those candidates deciding to work elsewhere? The same principle applies if you shorten the amount of time it takes to decide on a candidate. Imagine a theoretical situation where you could immediately decide on a candidate after they apply. How much more likely would it be that they would end up working for you? In my experience, this can result in dramatic improvements. <picture><source srcset="/static/d82b2f3f8755a88e0c513f8153fc0fec/f8f3a/apply-to-offer.png 200w, /static/d82b2f3f8755a88e0c513f8153fc0fec/6a8a8/apply-to-offer.png 400w, /static/d82b2f3f8755a88e0c513f8153fc0fec/7842b/apply-to-offer.png 800w, /static/d82b2f3f8755a88e0c513f8153fc0fec/5ece7/apply-to-offer.png 1200w, /static/d82b2f3f8755a88e0c513f8153fc0fec/b858d/apply-to-offer.png 1374w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/d82b2f3f8755a88e0c513f8153fc0fec/f8f3a/apply-to-offer.png 200w, /static/d82b2f3f8755a88e0c513f8153fc0fec/6a8a8/apply-to-offer.png 400w, /static/d82b2f3f8755a88e0c513f8153fc0fec/7842b/apply-to-offer.png 800w, /static/d82b2f3f8755a88e0c513f8153fc0fec/5ece7/apply-to-offer.png 1200w, /static/d82b2f3f8755a88e0c513f8153fc0fec/b858d/apply-to-offer.png 1374w" src="/static/d82b2f3f8755a88e0c513f8153fc0fec/7842b/apply-to-offer.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> Time windows are a differentiator when hiring. Candidates have an amount of time within which they’ll interview. And they have an amount of time within which they’ll make a decision. If you decrease your time window, you compete with fewer companies. You also speed up every aspect of your hiring. Instead of filling a position in three months, you might fill it in one. The compounding effect of this on a growing company is immense. Give your hiring team a service level agreement (SLA) My advice: give everyone that touches candidates 24 hours to get back to them. Ideally you get back to candidates within a few hours. <picture><source srcset="/static/168ec2fcb5fd2be4e447c465eb3adfb2/f8f3a/24-hr-sla.png 200w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/6a8a8/24-hr-sla.png 400w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/7842b/24-hr-sla.png 800w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/5ece7/24-hr-sla.png 1200w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/610c1/24-hr-sla.png 1484w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/168ec2fcb5fd2be4e447c465eb3adfb2/f8f3a/24-hr-sla.png 200w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/6a8a8/24-hr-sla.png 400w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/7842b/24-hr-sla.png 800w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/5ece7/24-hr-sla.png 1200w, /static/168ec2fcb5fd2be4e447c465eb3adfb2/610c1/24-hr-sla.png 1484w" src="/static/168ec2fcb5fd2be4e447c465eb3adfb2/7842b/24-hr-sla.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> Even if you do nothing else, this will give you many times better results than being average. Most companies take a week or more to get back to candidates. This little change accelerates every step of your interview process. The end result in people get through the whole process faster. This also results in a better experience. Candidates feel like they’re valued if they get a prompt response. Reduce the number of steps in your interview process The second change to make is to remove steps in your interview process. Most interview processes contain three to five rounds. For example, you might have a process like this: <picture><source srcset="/static/b787a6b894ac80c647cfa354a043e01b/f8f3a/more-steps.png 200w, /static/b787a6b894ac80c647cfa354a043e01b/6a8a8/more-steps.png 400w, /static/b787a6b894ac80c647cfa354a043e01b/7842b/more-steps.png 800w, /static/b787a6b894ac80c647cfa354a043e01b/5ece7/more-steps.png 1200w, /static/b787a6b894ac80c647cfa354a043e01b/0d4f8/more-steps.png 1600w, /static/b787a6b894ac80c647cfa354a043e01b/b6243/more-steps.png 1604w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/b787a6b894ac80c647cfa354a043e01b/f8f3a/more-steps.png 200w, /static/b787a6b894ac80c647cfa354a043e01b/6a8a8/more-steps.png 400w, /static/b787a6b894ac80c647cfa354a043e01b/7842b/more-steps.png 800w, /static/b787a6b894ac80c647cfa354a043e01b/5ece7/more-steps.png 1200w, /static/b787a6b894ac80c647cfa354a043e01b/0d4f8/more-steps.png 1600w, /static/b787a6b894ac80c647cfa354a043e01b/b6243/more-steps.png 1604w" src="/static/b787a6b894ac80c647cfa354a043e01b/7842b/more-steps.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> Each of these steps adds a new cycle of turnaround time to your interview process. So removing steps is the best way to compete with other companies: <picture><source srcset="/static/a45748cdb530ab60a3c81a41cd1e160a/f8f3a/less-steps.png 200w, /static/a45748cdb530ab60a3c81a41cd1e160a/6a8a8/less-steps.png 400w, /static/a45748cdb530ab60a3c81a41cd1e160a/7842b/less-steps.png 800w, /static/a45748cdb530ab60a3c81a41cd1e160a/5ece7/less-steps.png 1200w, /static/a45748cdb530ab60a3c81a41cd1e160a/0d4f8/less-steps.png 1600w, /static/a45748cdb530ab60a3c81a41cd1e160a/b6243/less-steps.png 1604w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/a45748cdb530ab60a3c81a41cd1e160a/f8f3a/less-steps.png 200w, /static/a45748cdb530ab60a3c81a41cd1e160a/6a8a8/less-steps.png 400w, /static/a45748cdb530ab60a3c81a41cd1e160a/7842b/less-steps.png 800w, /static/a45748cdb530ab60a3c81a41cd1e160a/5ece7/less-steps.png 1200w, /static/a45748cdb530ab60a3c81a41cd1e160a/0d4f8/less-steps.png 1600w, /static/a45748cdb530ab60a3c81a41cd1e160a/b6243/less-steps.png 1604w" src="/static/a45748cdb530ab60a3c81a41cd1e160a/7842b/less-steps.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> With these changes, your time window is a week or two, instead of a month or more. You’ve just made your hiring pipeline AT LEAST 2-4 times more effective. You’re competing with fewer companies for the same person. This isn’t even accounting for the fact that the candidate experience is so much better. Schedule all the steps ahead of time The formula for how long your interview takes is: <picture><source srcset="/static/dbd5ab9b45cee8cfa91230f979ae3b37/f8f3a/interview-time.png 200w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/6a8a8/interview-time.png 400w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/7842b/interview-time.png 800w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/5ece7/interview-time.png 1200w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/80397/interview-time.png 1444w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/dbd5ab9b45cee8cfa91230f979ae3b37/f8f3a/interview-time.png 200w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/6a8a8/interview-time.png 400w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/7842b/interview-time.png 800w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/5ece7/interview-time.png 1200w, /static/dbd5ab9b45cee8cfa91230f979ae3b37/80397/interview-time.png 1444w" src="/static/dbd5ab9b45cee8cfa91230f979ae3b37/7842b/interview-time.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> (Number of steps) * (Turnaround time + Coordination time) We’ve already optimized the number of steps, and turnaround time. The final optimization is to reduce coordination time. One way to do this is to pre-schedule your team for interview times, so they’re available for a certain number of interviews per week. Then you can offer times that are immediate, instead of far off in the future. By creating set times each week that are reserved for interviews, you avoid overloading your team with interviews on any given day or week. Now you’re cooking with fire! Interview until you find the right person, not in batches You can use two different models for your interviews: Batch interviews. You interview a bunch of candidates, compare them to each other, and have a decision after you’ve interviewed a whole bunch of them. Rolling interviews. You interview until you find the right person. Whenever you find the right person for the role, you stop. Batch interviews are slow, but more fair and thorough. Rolling interviews are difficult at the beginning, because you haven’t calibrated your candidates. They are also difficult at the end, because you may be reluctant to extend an offer when you you’re still interviewing promising candidates. I recommend using Rolling interviews. You should calibrate for a couple of weeks, until you have a good sense of how good each candidate is. Best of both models for diversity You can batch up candidates if you’re not getting enough diversity in your hiring pipeline. Research shows if you have one woman in your candidate pool, there is 0% chance she’ll be hired, and I imagine that’s true of other underrepresented groups). <picture><source srcset="/static/4242d7c6ac7148bae8d3b10de2be8e58/f8f3a/fair-interview.png 200w, /static/4242d7c6ac7148bae8d3b10de2be8e58/6a8a8/fair-interview.png 400w, /static/4242d7c6ac7148bae8d3b10de2be8e58/7842b/fair-interview.png 800w, /static/4242d7c6ac7148bae8d3b10de2be8e58/5ece7/fair-interview.png 1200w, /static/4242d7c6ac7148bae8d3b10de2be8e58/8d0e6/fair-interview.png 1462w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/4242d7c6ac7148bae8d3b10de2be8e58/f8f3a/fair-interview.png 200w, /static/4242d7c6ac7148bae8d3b10de2be8e58/6a8a8/fair-interview.png 400w, /static/4242d7c6ac7148bae8d3b10de2be8e58/7842b/fair-interview.png 800w, /static/4242d7c6ac7148bae8d3b10de2be8e58/5ece7/fair-interview.png 1200w, /static/4242d7c6ac7148bae8d3b10de2be8e58/8d0e6/fair-interview.png 1462w" src="/static/4242d7c6ac7148bae8d3b10de2be8e58/7842b/fair-interview.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> I like to not make a decision until I’ve interviewed people at least two people from underrepresented groups. To balance against the need to hire quickly, I give myself a time limit. If I don’t meet that limit, I can proceed, but note down the failure as a signal for improvement. This is how I try to balance my interest in hiring quickly, with my interest in hiring fairly and from a diverse pool of candidates. Present an offer the day of the last interview One way to speed things up is to monitor how the “onsite” interview goes, by talking with the interviewers right after the interview, or having them enter it into the applicant tracking system right afterwards (tip: have a meeting scheduled for them to reserve this time, right after their interview). If you see enough positive signs, prepare an offer to present them at the end of the day. Improve the visibility of your hiring pipeline One of the challenges I’ve had with a lot of applicant trackng systems is that it is hard to know which candidates are waiting on us. And it’s hard to get a sense of how we’re doing as a team in responding. A tool I have not used, but would check out if I were using Greenhouse or Lever, is TalentWall. It visualizes your candidate pipeline as a kanban board, and shows how you’re doing and what needs to be done for each candidate. Super valuable! Maksim Koutun describes his experiences with it here. Let me know your experiences with it — I have not used it. Also let me know if you’ve used any other tools that help you visualize your hiring pipeline. Did I miss anything? Please share your favorite ideas with me, I’d love to hear them! Thank you My appreciation to jtopper from Rands Leadership for his feedback on the post. Maksim Koutun shared the post on hiring improvements he made and his experience with TalentWall. Image by Pexels from PixabayI can help! Learn more and contact me. Or subscribe to my newsletters and podcast.Please enable Javascript to view comments.Comments powered by Talkyard.Wonderful hiring practices that for some reason aren't more common 2021-07-16 Rethink your hiring strategy to stand out and delight the best candidates 2021-07-19'''
