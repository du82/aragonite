full_description = '''Learn to build humane, effective engineering organizationsEngineering leadership weeklySign me up!Also useful for product and design leaders! A paid version is also available. I also offer a newsletter course for new managers. I respect your privacy. Unsubscribe anytime.Learn more👋 Hi, I'm Jade Rubick.I help 💻 startups and medium sized companies to organize people 🧑‍🦰 better to build great things together 🚀.When you subscribe ✨ to Engineering Leadership Weekly, you will receive an email 📧 each week with something that should be useful.The most common themes in my writing are Deconstructing how humans work together effectively to produce good results. Effective + humane management.Incremental & feedback-rich product development.Lots of specific management practices I've learned or invented.I offer a paid version 💰 of Engineering Leadership Weekly. This supports 💚 my writing. Use your "professional development" budget: pay for it and expense it. I've been so thankful 🙏 for the support! Although most of the material is the same, the paid version offers additional benefits, such as an optional 1-1 session. You can read more about the paid newsletter and courses here.Engineering leadership weekly (paid)You can also follow my writing in other ways:RSSMastodonLinkedIn'''
