title = "Jade Rubick - Rethink your hiring strategy to stand out and delight the best candidates"
description = "Practical questions to guide you to a strong answer to the question: 'why should anybody want to work at your company?'"
full_description = 'Rethink your hiring strategy to stand out and delight the best candidates 2021-07-19hiringrecruitingdiversity-equity-and-inclusionscalingpay-equity<picture><source srcset="/static/f98c3a352988234ff416b62aec18bf98/16d62/hiring-strategy.jpg 200w, /static/f98c3a352988234ff416b62aec18bf98/27ec1/hiring-strategy.jpg 400w, /static/f98c3a352988234ff416b62aec18bf98/5fd6b/hiring-strategy.jpg 800w, /static/f98c3a352988234ff416b62aec18bf98/4923b/hiring-strategy.jpg 983w" sizes="(max-width: 800px) 100vw, 800px" /><img loading="lazy" sizes="(max-width: 800px) 100vw, 800px" srcset="/static/f98c3a352988234ff416b62aec18bf98/16d62/hiring-strategy.jpg 200w, /static/f98c3a352988234ff416b62aec18bf98/27ec1/hiring-strategy.jpg 400w, /static/f98c3a352988234ff416b62aec18bf98/5fd6b/hiring-strategy.jpg 800w, /static/f98c3a352988234ff416b62aec18bf98/4923b/hiring-strategy.jpg 983w" src="/static/f98c3a352988234ff416b62aec18bf98/5fd6b/hiring-strategy.jpg" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture> This is a part of a series of articles on hiring and recruiting. Creating a hiring strategy Why should someone work at your company? Every company answers this question differently. Here are some valid strategies: We’ll pay the median rate in your area, but we’re investing heavily in making this the place for you to do your best work — the best work culture. (early days New Relic) We’re working in a compelling technical area, which attracts a lot of talented people, so you can work with a great team and solve interesting problems. Plus we’re making a great people-focused work environment. (Gremlin during my tenure there, also early days New Relic). We’re making Disneyland for engineers, lots of perks and top pay, in a university like environment (early Google strategy). We’ll pay really well for you to work your ass off, and in return you get a chance to work at a scale you won’t otherwise (Amazon today). We won’t pay you the most, but you’ll get to spend time each week working on open source software (a local software consultancy my friend ran for a while). What your company looks like without a strategy In practice, when you haven’t done the work to articulate why someone should work there, your hiring strategy looks like this: Work super hard at a stressful startup for low pay and equity that is probably worthless. Developing your strategy This step is to create your hiring strategy. Ask yourself, how are you going to stand out as a place people will want to work? Like any strategy, you should consider what your unique strengths and weaknesses are. Areas to flex in a strategy Some dimensions you can flex or emphasize to attract candidates: Remote versus in person. Having a strong stance on this will attract people who care about either of those options. Perks you are willing to offer. Consider offering allowances for teleconferencing (high quality cameras and microphones, for example). Flatfile offers an office makeover, with a designer helping you renovate your workspace. You can offer top of the line developer machines, or quality monitors. These are things that also help your team work more effectively together, so it’s offering a benefit that serves two purposes! If I were making my own startup nowadays, I’d focus on top-tier videoconferencing equipment (DSLRs and external microphones) as a main perk. When I was at New Relic, they offered free bicycle tuneups in the office to encourage people to commute by bike. Freedoms you’ll offer. You can offer a 4 day workweek. You can craft a narrative around offering no deadlines and no meetings. Or something else entirely. Transparency on salary and equity. Research shows diverse teams produce better business outcomes. There are a few things you can do to make your position stand out for candidates from diverse backgrounds: list the salaries (and equity!) for the positions you’re posting, and emphasize how you’ll make the workplace fair and equitable for all employees. Share your philosophy around how salary and equity are determined. Being more upfront about this than competitors will make you more desirable and competitive. Start by implementing pay equity, and then tell people you’re doing it. How bizarre is it that your hiring manager is expected to advocate for and win the trust of their team member once they’re hired, but they’re expected to negotiate against their best interests during the hiring process? Starting off the relationship without having to negotiate salary can be a huge relief for candidates. Haven for people from diverse backgrounds. The experience for many people in tech companies is far from ideal. Many people leave our field because they’re treated so poorly. Most companies haven’t invested the time and energy to build a work culture that retains and delights people who aren’t overrepresented in tech. Family friendliness. You can offer generous paid parental leave. On-site daycare. Or flexibility to stay home with sick kids. Impact people can have on the world. Consider ways your company helps employees connect their work to something meaningful or interesting to them. Are there ways you can emphasize this more? People at Patagonia are given the option to volunteer once a week, paid by the company. Working at a nonprofit can have direct impact. For most companies, you can think of the value of what you produce in a way that people will find meaningful. Think about how that ties into your narrative for why to join your company. Attributes of the team. What is the team like, and how can you use that to attract the type of people you’d like to come to the company? For example, you might be good at hiring people that are collaborative, and not assholes. You might be in a place with a lot of creative thinkers. What is the pitch? As you look through these, come up with a one sentence description of why people should join your company. You’ll know you have a real strategy if it is rational for a certain type of person to select your company over all the other companies out there. What’s your pitch? Let me know what you come up with! Image by PublicDomainPictures from PixabayI can help! Learn more and contact me. Or subscribe to my newsletters and podcast.Please enable Javascript to view comments.Comments powered by Talkyard.Your hiring process is too slow -- speed it up with these five tips 2021-07-19 Use a candidate packet to improve your interview process 2021-07-22'
