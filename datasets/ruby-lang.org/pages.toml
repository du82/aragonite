full_description = "Geschrieben von k0kubun am 14.2.2025 Übersetzt von Daniel Bovensiepen Ruby 3.4.2 wurde veröffentlicht. Dies ist ein Routine-Update, welches Fehlerbehebungen enthält. Bitte beachten Sie die Release Notes auf GitHub für weitere Details. Veröffentlichungsplan Wir beabsichtigen, eine neue stabile Ruby-Version (derzeit Ruby 3.4) alle 2 Monate zu veröffentlichen. Ruby 3.4.3 wird im April veröffentlicht, 3.4.4 im Juni, 3.4.5 im August, 3.4.6 im Oktober und 3.4.7 im Dezember. Wenn es Änderungen gibt, die eine beträchtliche Anzahl von Menschen betreffen, können diese Versionen früher als erwartet veröffentlicht werden. Herunterladen https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.2.tar.gz SIZE: 23174066 SHA1: 1537911b4a47940f11c309898e04187344a43167 SHA256: 41328ac21f2bfdd7de6b3565ef4f0dd7543354d37e96f157a1552a6bd0eb364b SHA512: edc3aede0aadcaa62343f38ea6cab7adacedba810d883f1d9c3e6e24e28e24e0e27a7df2c8e517cc2aab940168fc4872ab8cad000598aab5940aa79072ac190b https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.2.tar.xz SIZE: 17218200 SHA1: b169f9e0d35cf85085c5f23d774485ba6c00ebac SHA256: ebf1c2eb58f5da17c23e965d658dd7e6202c5c50f5179154c5574452bef4b3e0 SHA512: cb8b5023bce316393716548c5f0a44c7d0240724ff79b995517641266af30bedc6f402c1c8fa27368ea607e2aa6d36bbb201e00c6e9dd2a80d837431d32343b5 https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.2.zip SIZE: 28336243 SHA1: 5a790b8a5aa662df6512f865bb042e93b8520864 SHA256: e14b850e831bf046cf78d66f14207782da13e76777610596666a74fd6c786021 SHA512: ac897cdc013b71ac3f76d1f70e9b79155a08197e458ddb7bfb638d1168d166b08fbc022aae95953bdade19ccd68989d666b76b6d681ee3480bb5936fb475959d Veröffentlichungskommentar Viele Committer, Entwickler und Benutzer, die Fehlerberichte eingereicht haben, haben uns geholfen, diese Version zu erstellen. Vielen Dank für Ihre Beiträge."
