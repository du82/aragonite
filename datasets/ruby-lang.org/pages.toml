["https://ruby-lang.org/de/community/user-groups"]
title = "User Groups"
description = """
In der Entwicklergemeinde bilden User Groups Netzwerke von Leuten, die
sich für bestimmte Themen interessieren. Sie sind der ideale Platz, um
das eigene Wissen zu vergrößern und sich mit anderen Entwicklern
auszutauschen. User Groups sind zwanglos gehalten und unterscheiden sich
von Gruppe zu Gruppe in der Struktur. Jeder kann seine eigene User Group
mit seinen eigenen Regeln und Zeitplänen gründen."""
full_description = "In der Entwicklergemeinde bilden User Groups Netzwerke von Leuten, die sich für bestimmte Themen interessieren. Sie sind der ideale Platz, um das eigene Wissen zu vergrößern und sich mit anderen Entwicklern auszutauschen. User Groups sind zwanglos gehalten und unterscheiden sich von Gruppe zu Gruppe in der Struktur. Jeder kann seine eigene User Group mit seinen eigenen Regeln und Zeitplänen gründen. Ruby User Groups Wer sich mit anderen Ruby-Programmierern treffen will, sollte sich nach einer lokalen User Group umsehen. Ruby User Groups widmen sich komplett dem Thema Ruby. Typischerweise gibt es monatliche Treffen, eine Mailingliste, eine Website und eventuell auch häufig stattfindende Hacking-Sessions (dort wird dann mit Ruby programmiert). Auf den folgenden Webseiten finden sich Anlaufstellen für Ruby User Groups: deutschsprachige Ruby User Group Weltkarte Eine Weltkarte mit Stecknadeln für vorhandene User Groups. Ruby User Group Liste Eine Wikiseite mit bereits vorhandenen deutschsprachigen Ruby User Groups. onruby.de Ein Planungsportal für Ruby-Usergruppen in Deutschland. Kontaktinfos auf den jeweiligen Usergroup-Seiten. Eine eigene User Group organisieren Wer seine eigene Gruppe gründen will, sollte zuerst herausfinden, ob schon eine Gruppe in der Nähe existiert. Größere Treffen sind normalerweise interessanter, weshalb es nicht wirklich viel Sinn ergibt, wenn eine weitere kleine Gruppe in der Nähe einer anderen entsteht. Sollte noch keine User Group in deiner Nähe sein, so trage deine neue Gruppe doch oben in der Ruby User Group Liste ein, damit andere Interessierte deine Gruppe finden."
year_published = 2025
