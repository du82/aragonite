["https://ruby-lang.org/en/documentation/success-stories"]
title = "Success Stories"
description = """
Many people use Ruby in their daily jobs. Others just as a hobby. Here
you’ll find a small sample of real world usage of Ruby."""
full_description = "Many people use Ruby in their daily jobs. Others just as a hobby. Here you’ll find a small sample of real world usage of Ruby. Simulations NASA Langley Research Center uses Ruby to conduct simulations. A research group in Motorola uses Ruby to script a simulator, both to generate scenarios and to post process the data. 3D Modeling Google SketchUp is a 3D modeling application that uses Ruby for its macro scripting API. Business Toronto Rehab uses a RubyWebDialogs-based app to manage and track on-call and on-site support for the IT help desk and IT operations teams. Robotics At MORPHA project, Ruby was used to implement the reactive control part for the Siemens service robot. Telephony Ruby is being used within Lucent on a 3G wireless telephony product. System Administration Ruby was used to write the central data collection portion of Level 3 Communications Unix Capacity and Planning system that gathers performance statistics from over 1700 Unix (Solaris and Linux) servers scattered around the globe. Web Applications Basecamp, a web-based project management application, is programmed entirely in Ruby. A List Apart, a magazine for people who make websites that has been around since 1997, has recently been revamped and uses a custom application built with Ruby on Rails. Security The Metasploit Framework, a community open source project managed by Rapid7, is a free penetration testing platform that helps IT professionals assess the security of their networks and applications. The Metasploit Project consists of over 700,000 lines of code and has been downloaded over a million times in 2010. The commercial editions developed by Rapid7 are also based on Ruby. The Arachni Web Application Security Scanner is a free, modular, high-performance Ruby framework aimed towards helping penetration testers and administrators evaluate the security of modern web applications."
year_published = 2025
clearnet = "https://ruby-lang.org/en/documentation/success-stories"
