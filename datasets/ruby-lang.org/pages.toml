full_description = "Много хора използват Ruby във всекидневната си работа. За други това е просто хоби. Тук ще намерите малък пример от употребата на Ruby в реални проекти. Симулации Изследователски Център Лангли в НАСА използва Ruby в провеждането на различни симулации. Изследователска група в Motorola използва Ruby за написването на симулатор за генериране на сценарии и пост-процесорна обработка. 3D Моделиране Google SketchUp е програма за 3D моделиране, която използва Ruby за macro scripting API. Бизнес Toronto Rehab използва RubyWebDialogs базирана програма за управление и следене на екипа за поддръжка. Роботика В MORPHA се използва Ruby за имплементирането на реактивната контролна част за сервизния робот на Siemens. Телефония Ruby се използва в Lucent за изграждането на 3G безжични телефонни продукти. Системна Администрация Ruby се използва за написването на част от системата Level 3 Communications Unix Capacity and Planning, която събира статистика за производителноста от 1700 Unix (Solaris и Linux) сървъри по целия свят. Уеб Апликации Basecamp е уеб базирана система за управлението на проекти, разработена от 37signals A List Apart е списание за програмисти и дизайнери, като сайта съществува от 1997 и е пренаписан на Ruby."
