title = "Documentation"
description = "Guides, tutorials, and reference material to help you learn more about Ruby"
full_description = "Guides, tutorials, and reference material to help you learn more about Ruby Installing Ruby Although you can easily try Ruby in your browser, you can also read the installation guide for help on installing Ruby. Official Ruby Documentation docs.ruby-lang.org/en: List of documentation for all Ruby versions released after 2.1. docs.ruby-lang.org/en/3.4: Documentation for Ruby 3.4. docs.ruby-lang.org/en/master: Documentation for Ruby’s master branch. C Extension Guide: In-depth guide for creating C extensions for Ruby. Getting Started Try Ruby You can try Ruby right in your browser. Learn to Program A wonderful little tutorial by Chris Pine for programming newbies. If you don’t know how to program, start here. Ruby in Twenty Minutes A small Ruby tutorial that should take no more than 20 minutes to complete. The Odin Project An open source full stack curriculum excercism 120 exercises with automatic analysis and personal mentoring. Codecademy Online code bootcamp with a variety of topics. Manuals / Books Beginner Programming Ruby 3.3 The seminal work on Ruby in English. Recently updated to Ruby 3.3. The Well-Grounded Rubyist A tutorial that begins with your first Ruby program and takes you all the way to sophisticated topics like reflection, threading, and recursion. Intermediate Practical OOD in Ruby (POODR) A programmer’s tale about how to write object-oriented code. Expert Metaprogramming Explains metaprogramming in a down-to-earth style. Ruby Under a Microscope (RUM) An illustrated guide to Ruby internals. Community Documentation These documentation sites are maintained by the Ruby community. RubyDoc.info The one-stop web site for reference documentation about Ruby gems and GitHub-hosted Ruby projects. RubyAPI.org Easily find and browse Ruby classes, modules, and methods. ruby-doc.org Online API documentation DevDocs.io Online API documentation Ruby QuickRef The Ruby quick reference rubyreferences A full language reference + detailed language changelog. Style Guides rubystyle.guide RuboCop’s Ruby style guide RuboCop Automated enforcement of their style guide. Shopify Shopify’s Ruby style guide GitLab Gitlab’s Ruby style guide Airbnb Airbnb’s Ruby style guide w3resource W3’s Ruby style guide Tools IRB The interactive Ruby Read-Eval-Print-Loop (REPL) Pry An alternative Ruby REPL Rake A make-like build utility for Ruby. RI (Ruby Information) is the Ruby command-line utility that gives fast and easy on-line access to Ruby documentation. RBS Type Signature for Ruby TypeProf An experimental type-level Ruby interpreter for testing and understanding Ruby code. Steep Static type checker for Ruby. Editors and IDEs For coding in Ruby, you can use the default editor of your operating system. By the way, to be more effective in coding, it is worth choosing a source code editor with basic Ruby support (e.g. syntax-highlighting, file browsing) or an integrated development environment with advanced features (e.g. code completion, refactoring, testing support). Here is a list of popular editors used by Rubyists, broken up by learning curve: Days Sublime Text (paid) Visual Studio Code Zed Months RubyMine (paid) “Years” (as in, you’ll spend years still learning things about it) Emacs with Ruby mode or Enhanced Ruby mode Vim with vim-ruby plugin NeoVim All of these editors support the Language Server Protocol (LSP), either by default or through their LSP plugins. Shopify’s ruby-lsp is one of the most popular language servers for Ruby and supports all of the above editors. Older Reading / Resources These links were more prominent but haven’t been updated in ages. Ruby Koans The Koans walk you along the path to enlightenment in order to learn Ruby. The goal is to learn the Ruby language, syntax, structure, and some common functions and libraries. We also teach you culture. Ruby Essentials A free on-line book designed to provide a concise and easy to follow guide to learning Ruby. Why’s (Poignant) Guide to Ruby An unconventional but interesting book that will teach you Ruby through stories, wit, and comics. Originally created by why the lucky stiff, this guide remains a classic for Ruby learners. Learn Ruby the Hard Way A very good set of exercises with explanations that guide you from the absolute basics of Ruby all the way to OOP and web development. Programming Ruby The seminal work on Ruby in English, this first edition of the Pragmatic Programmers’ book is available for free online. The Ruby Programming Wikibook A free online manual with beginner and intermediate content plus a thorough language reference."
