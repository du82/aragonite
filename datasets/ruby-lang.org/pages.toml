["https://ruby-lang.org/de/community"]
title = "Community"
description = """
Die Community, die sich im Umfeld einer Programmiersprache entwickelt,
ist eine ihrer größten Stärken. Ruby hat eine lebhafte und wachsende
Community, die stets freundlich zu allen Leuten unterschiedlichen
Kenntnisstands ist."""
full_description = "Die Community, die sich im Umfeld einer Programmiersprache entwickelt, ist eine ihrer größten Stärken. Ruby hat eine lebhafte und wachsende Community, die stets freundlich zu allen Leuten unterschiedlichen Kenntnisstands ist. Für den, der sich gerne einbringen möchte, ist die folgende Liste ein guter Einstiegspunkt: Deutschsprachige Seiten ruby-de Die deutschsprachige Ruby-Mailingliste ist der Haupttreffpunkt für die Ruby-Community in und aus Deutschland und anderen deutschsprachigen Ländern. Hilfestellungen für Neulinge werden ebenso gern gegeben wie ausschweifende Diskussionen über Ruby-Interna geführt. Ruby User Groups Ihre lokale Ruby User Group ist der beste Ort, um sich mit anderen Ruby-Programmierern auszutauschen. Ruby-Benutzergruppen organisieren sich selbst, und typischerweise gibt es monatliche Treffen, eine Mailingliste, eine Website und eventuell auch häufig stattfindende Programmierparties. Ruby-Forum (Archiv) Das ehemalige deutschsprachige Ruby-Forum war der Haupttreffpunkt für die Ruby-Community in und aus Deutschland, bevor es zugunsten der oben angesprochenen Mailingliste ruby-de geschlossen wurde. Es gibt hier noch viele interessante Threads, weshalb die Seite als Archiv aufrecht erhalten wird. Es können aber keine neuen Posts erstellt werden. RubyWiki (Archiv) Das ehemals einzige deutschsprachige Ruby-Wiki ist eine gute Anlaufstelle für häufige Fragen und Sammelstelle für unterschiedlichstes Wissen aus dem Bereich um die Programmiersprache Ruby. Hier können allerdings keine neuen Artikel mehr erstellt werden, es handelt sich um eine Archivseite. Internationale Seiten Ruby-Mailinglisten und Newsgroups Für Ruby gibt es eine Auswahl an Mailinglisten zu verschiedenen Themen und in unterschiedlichen Sprachen. Wer Fragen zu Ruby hat, sollte diese in einer Mailingliste stellen, um eine Antwort zu bekommen. Ruby im IRC (#ruby) Der Ruby Language IRC-Channel ist eine hervorragende Möglichkeit mit anderen Rubyisten zu chatten. Ruby Core Gerade jetzt, wo Ruby 2.0 in Arbeit ist, ist die beste Gelegenheit, die Entwicklungen rund um Ruby näher zu betrachten. Wer daran interessiert ist zu helfen, startet am Besten hier. Weblogs zu Ruby Nur wenige Dinge passieren in der Ruby-Community, die nicht in Blogs festgehalten werden. Hier ist eine passende Liste mit Empfehlungen. Ruby-Konferenzen Ruby-Programmierer auf der ganzen Welt treffen sich immer öfter auf Konferenzen, um sich zu zu aktuellen Projekten auszutauschen, die Zukunft von Ruby zu diskutieren und Neueinsteiger in die Ruby-Community zu integrieren. Allgemeine Information zu Ruby Ruby Central Ruby beim Open Directory Project Rails beim Open Directory Project"
year_published = 2025
clearnet = "https://ruby-lang.org/de/community"
tags = ["beste", "beteilige", "community", "community.", "deutschsprachige", "dich", "eine", "einer", "eines", "einfach!"]
