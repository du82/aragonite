["https://ruby-lang.org/de/news"]
title = "Aktuelle Neuigkeiten"
full_description = "Ruby 3.4.2 veröffentlicht Ruby 3.4.2 wurde veröffentlicht. Weiterlesen... Geschrieben von k0kubun am 14.2.2025 CVE-2025-25186: DoS Sicherheitslücke in net-imap Es besteht die Möglichkeit eines DoS Angriffes auf das net-imap Gem. Diese Sicherheitslücke wurde mit der CVE-Kennung CVE-2025-25186 versehen. Wir empfehlen, das net-imap Gem zu aktualisieren. Weiterlesen... Geschrieben von nevans am 10.2.2025 Ruby 3.2.7 veröffentlicht Ruby 3.2.7 wurde veröffentlicht. Weiterlesen... Geschrieben von nagachika am 4.2.2025 Ruby 3.3.7 veröffentlicht Ruby 3.3.7 wurde veröffentlicht. Weiterlesen... Geschrieben von k0kubun am 15.1.2025 Ruby 3.4.0 veröffentlicht Wir freuen uns, die Veröffentlichung von Ruby 3.4.0 bekannt zu geben. Ruby 3.4 führt den it-Blockparameter ein, ändert Prism zum Standardparser, bietet Happy Eyeballs Version 2-Unterstützung in der Socket-Bibliothek, verbessert YJIT, integriert Modular GC und mehr. Weiterlesen... Geschrieben von naruse am 25.12.2024 Ruby 3.3.0 veröffentlicht Wir freuen uns, die Veröffentlichung von Ruby 3.3.0 anzukündigen. Ruby 3.3 fügt einen neuen Parser namens Prism hinzu, verwendet Lrama als Parser-Generator, fügt einen neuen reinen Ruby JIT-Compiler namens RJIT hinzu und viele Leistungsverbesserungen, insbesondere YJIT. Weiterlesen... Geschrieben von naruse am 25.12.2023 Ruby 3.0.0 veröffentlicht Wir freuen uns, die Veröffentlichung von Ruby 3.0.0 bekannt geben zu können. Seit 2015 haben wir an Ruby 3 gearbeitet, dessen Ziele sich so beschreiben lassen: Performanz, Nebenläufigkeit und Typisierung. Mit besonderem Blick auf die Performanz hatte Matz angekündigt: „Ruby 3 wird 3-mal so schnell sein wie Ruby 2“, ein Satz, der auch bekannt ist als Ruby 3x3. Weiterlesen... Geschrieben von naruse am 25.12.2020 Ruby 3.0.0 RC1 veröffentlicht Wir freuen uns, die Veröffentlichung von Ruby 3.0.0-rc1 bekannt geben zu können. Weiterlesen... Geschrieben von naruse am 20.12.2020 Ruby 3.0.0 Preview 2 veröffentlicht Wir freuen uns, die Veröffentlichung von Ruby 3.0.0-preview2 ankündigen zu können. Weiterlesen... Geschrieben von naruse am 8.12.2020 Ruby 2.7.2 veröffentlicht Ruby 2.7.2 ist veröffentlicht worden. Weiterlesen... Geschrieben von nagachika am 2.10.2020"
