full_description = "Публикувана от usa на 2015-12-16 Превод от Georgi Mitrev Излезе Ruby 2.1.8. Този рилийз включва поправка по сигурността за Fiddle и DL. Посетете страницата по-долу за повече информация. CVE-2015-7551: Уязвимост във Fiddle и DL Включени са и много бъгфиксове. Вижте Списък с промени за повече информация. Сваляне https://cache.ruby-lang.org/pub/ruby/2.1/ruby-2.1.8.tar.bz2 SIZE: 12014426 bytes SHA1: 0284eaf42ac76a641abd5cd4b6bd933abeb9934e SHA256: 250d0b589cba97caddc86a28849365ad0d475539448cf76bbae93190985b3387 SHA512: 7129c012bca7f0e7cfa51c73ba0898697f7a9f31abd5ae57d38be5b6b646fd80ab33be9b262cd3e2486c66f65aaf4ec6e881ae6e5a82ec9df62f00fa072510fc https://cache.ruby-lang.org/pub/ruby/2.1/ruby-2.1.8.tar.gz SIZE: 15154017 bytes SHA1: c7e50159357afd87b13dc5eaf4ac486a70011149 SHA256: afd832b8d5ecb2e3e1477ec6a9408fdf9898ee73e4c5df17a2b2cb36bd1c355d SHA512: 155121ed00a1a56e40a74bafd93dcc34a0ea65c56589cf36daa8318368acc12cc88cb73aba548ef204c8d2ad917b0feccf90b5608a86d1aca1203feca2263386 https://cache.ruby-lang.org/pub/ruby/2.1/ruby-2.1.8.tar.xz SIZE: 9382672 bytes SHA1: e1f4e043006a762604c042e6aac7540854a92d8c SHA256: 94eeae3b3e3ac93cfd205e1aaef4c5325227b7656cbb2fc1ee217618145dd19d SHA512: c712ee69cb1d41ad8420177b9564e451ab795e4903f1edc20c14aa189b8e38c54c5119d913204d13a5f8fa424f2ec43bfad04c77b313ea4533e23a9b1d161392 https://cache.ruby-lang.org/pub/ruby/2.1/ruby-2.1.8.zip SIZE: 16686848 bytes SHA1: b554328fb3d9f2a527adc5830de221b00e3ce2b9 SHA256: 6e0491e029a6f4c40bc091033c5bc91f65438f3f9153f93f1b86889521e79cee SHA512: 2f9409460c8729fff96522baf5c4a74e1a648db1749a471ee3b6523d8c01e1faaf5f17afdffcaf355654f23e8c2ac392830109dd68dfc4e5a694d95155c593b6 Коментар Благодарим на всички, помогнали при подготвянето на тази версия. Поддръжката на Ruby 2.1, включително и тази версия, е базиранa на ‘Споразумение за стабилни версии на Ruby’ от Ruby асоциацията."
