full_description = "Hier findest du Links zu Handbüchern, Tutorials und Referenzen, die beim Ruby-Programmieren sicher nützlich sein werden. Erste Schritte Try Ruby! Ein interaktives Tutorial für Anfänger, ursprünglich von Why the Lucky Stiff. Es ist nicht nötig, Ruby zu installieren, denn dieses ca. 15-minütige Tutorial erlaubt es, Ruby-Code direkt im Browser einzugeben! (englisch) Why’s (Poignant) Guide to Ruby Ein unorthodoxes Buch um Ruby zu lernen. Ruby in zwanzig Minuten Ein kleines Tutorial zu den Grundlagen von Ruby. 20 Minuten sollten ausreichen. Ruby für Umsteiger Du willst von einer anderen Programmiersprache auf Ruby umsteigen? Egal ob C, C++, Java, Perl, PHP, oder Python – dieser Artikel ist für Dich! Programmieren lernen mit Ruby Ein wunderbares kleines Tutorial, um Programmieren zu lernen, mit Ruby als erster Sprache. Wenn Du Anfänger bist, dann starte hier. Deutsche Übersetzung der populären englischen Einführung Learn To Program. Anleitungen Programming Ruby Dies ist die erste Auflage des bekannten Pickaxe-Buches der Pragmatic Programmers. Es ist kostenlos im Internet verfügbar (englisch). Programmieren mit Ruby Ein deutschsprachiges Buch zum Thema Ruby von Armin Roehrl, Stefan Schmiedl und Clemens Wyss. Es steht vollständig kostenlos im Internet zur Verfügung. Referenzdokumentation Referenz zu Rubys Standardklassen Dies ist die Referenz-Dokumentation des Rubykerns. Es handelt sich hierbei um eine aus dem Quelltext generierte Dokumentation (englisch). Referenz zu Rubys Standardbibliotheken Dies ist die Referenz-Dokumentation der Standardbibliothek. Diese Dokumentation wird ebenfalls direkt aus dem Quelltext generiert (englisch). Referenz zu Rubys C-API Offizielle C-API-Dokumentation von Ruby. Sie beschreibt die vordefinierten Schnittstellen für Erweiterungen in der Programmiersprache C und wie diese sowohl von der Ruby- als auch der C-Seite aus verwendet werden. RubyDoc.info Die Referenzdokumentation für Ruby, Gems und auf GitHub gehostete Ruby-Projekte. Weitere Informationen Ruby-Doc.org ist eine große Quelle von englischsprachigen Dokumenten zum Thema Ruby. Das Rubywiki ist ein Wiki mit vielen deutschsprachigen Artikeln. Für weitergehende Fragen steht eine große Community zur Verfügung."
