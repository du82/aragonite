Bitte nimm auch Rubys Lizenz zur Kenntnis."""
full_description = "Hier kannst Du die aktuellen Ruby-Distributionen herunterladen. Die stabile Version ist derzeit 3.4.2. Bitte nimm auch Rubys Lizenz zur Kenntnis. Verschiedene Möglichkeiten, Ruby zu installieren Auf allen wichtigen Plattformen gibt es mehrere Möglichkeiten, Ruby zu installieren: Auf Linux/UNIX kann man das Paketverwaltungssystem der jeweiligen Distribution oder Drittanbieter-Werkzeuge (rbenv und RVM) verwenden. Auf macOS kann man Drittanbieter-Werkzeuge verwenden (rbenv und RVM). Auf Windows kann man RubyInstaller verwenden. Siehe die Installationsanleitung für Details zu den verschiedenen Paketverwaltungssystemen und Drittanbieter-Werkzeugen. Natürlich kann Ruby auf allen wichtigen Plattformen auch aus dem Quellcode installiert werden. Ruby aus dem Quellcode kompilieren Ruby aus dem Quellcode zu installieren ist eine geeignete Lösung, wenn Du Dich gut mit Deinem System auskennst und eventuell spezielle Einstellungen für Deine Umgebung benötigst. Es ist außerdem eine gute Lösung, falls es keine vorgefertigten Pakete für Dein System gibt. Siehe die Installationsanleitung für Details. Falls es Schwierigkeiten beim Kompilieren geben sollte, solltest Du vielleicht zu einem der oben erwähnten Drittanbieter-Werkzeuge greifen. Stabile Versionen: Ruby 3.4.2 sha256: 41328ac21f2bfdd7de6b3565ef4f0dd7543354d37e96f157a1552a6bd0eb364b Ruby 3.3.7 sha256: 9c37c3b12288c7aec20ca121ce76845be5bb5d77662a24919651aaf1d12c8628 Ruby 3.2.7 sha256: 8488fa620ff0333c16d437f2b890bba3b67f8745fdecb1472568a6114aad9741 In der Phase der Sicherheits-Maintenance (Unterstützung endet bald!): Ruby 3.1.6 sha256: 0d0dafb859e76763432571a3109d1537d976266be3083445651dc68deed25c22 Nicht mehr unterstützt (EOL): Ruby 3.0.7 sha256: 2a3411977f2850431136b0fab8ad53af09fb74df2ee2f4fb7f11b378fe034388 Snapshots: Stable Snapshot: Hierbei handelt es sich um den neuesten Snapshot des stabilen Zweiges. Nightly Snapshot: Hierbei handelt es sich um eine Kopie der Git von letzter Nacht. Es besteht durchaus die Gefahr, dass in dieser Version noch nicht korrigierte Fehler enthalten sind. Weitergehende Informationen zum Subversion- und Git-Repository von Ruby sind unter Ruby Core zu finden. Der Ruby-Quellcode ist auch auf verschiedenen Mirror-Seiten zu finden. Bitte nutze einen Mirror in deiner Nähe."
