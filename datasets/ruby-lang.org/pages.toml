["https://ruby-lang.org/de/documentation/success-stories"]
title = "Erfolgsgeschichten"
description = """
Viele Leute nutzen Ruby bei ihrer täglichen Arbeit. Andere haben es zum
Hobby gemacht. Hier findest Du eine kleine Auswahl von “Real World”
Projekten, die Ruby nutzen."""
full_description = "Viele Leute nutzen Ruby bei ihrer täglichen Arbeit. Andere haben es zum Hobby gemacht. Hier findest Du eine kleine Auswahl von “Real World” Projekten, die Ruby nutzen. Simulationen Eine Forschungsgruppe bei Motorola setzt Ruby für die Entwicklung von Simulationen ein. Mit Ruby werden die Szenarien erstellt und die Ergebnisse aufbereitet. Geschäftsanwendungen Toronto Rehab nutzt eine auf RubyWebDialogs basierende Anwendung, um die Handhabung und Verfolgung des on-call und on-site Supports für ihren IT-Helpdesk und das IT-Operations-Team zu unterstützen. Robotics Im MORPHA Projekt, wurde Ruby eingesetzt, um für den Siemens Service Roboter die Reaktionskontrolle zu implementieren. Telephonie Ruby wird bei Lucent in einem 3G Wireless Telefonieprodukt eingesetzt. Systemadministration Ruby wurde für die Implementierung des zentralen Datenkollektors des Unix Kapazität und Planungssystems von Level 3 Communications genutzt, mit dem Performanzstatistiken von über 1700 Unix (Solaris und Linux) Servern auf der ganzen Welt gemessen werden. Web-Anwendungen Basecamp ist eine webbasierte Projektmanagement Software von 37signals und wurde komplett in Ruby geschrieben. A List Apart ist seit 1997 ein Magazin für Leute, die Websites erstellen. Die vor kurzem aktualisierte Site nutzt eine Individualsoftware, die mit Ruby on Rails entwickelt wurde."
