["https://ruby-lang.org/bg/news/2016/02/24/support-plan-of-ruby-2-0-0-and-2-1"]
title = "Планове за поддръжка на Ruby 2.0.0 и Ruby 2.1"
full_description = "Публикувана от usa на 2016-02-24 Превод от Georgi Mitrev Тук може да намерите плановете за поддръжка на Ruby 2.0.0 и Ruby 2.1 Ruby 2.0.0 Както бе обявено преди, поддръжката на Ruby 2.0.0 се прекратява днес. Бъгове и фиксове по сигурността няма да бъдат backport-вани към 2.0.0, както няма да бъдат издавани и повече пачове. Препоръчваме да преминете към Ruby 2.3 или 2.2 възможно най-скоро. Моля свържете се с нас чрез ruby-core ML ако желаете да поддържате 2.0.0 branch-a, в случай, че поради някаква причина не можете да преминете към нова версия. Ruby 2.1 Планирано е Ruby 2.1.9 да излезе към краят на Март. След това ще приключи фазата за поддръжка на 2.1 и ще излизат единствено поправки по сигурността. Това означава, че след излизането на 2.1.9 няма да бъде backport-вано нищо освен security фиксове. Препоръчваме да започнете с планирането на ъпгрейд към Ruby 2.3 или 2.2. След Ruby 2.1.9 ще излезе и 2.1.10, който няма да включва никакви новости. Единствената му цел е да се тества версия, която има двуцифрен patch-level. Ruby 2.1.10 няма да включва промени от 2.1.9 освен номера на версията. Не е нужно да го ползвате в продукция, но е добре да го тествате преди да излезе версия 2.1.11, която вероятно ще включва поправки по сигурността."
year_published = 2025
