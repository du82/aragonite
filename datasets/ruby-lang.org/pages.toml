["https://ruby-lang.org/bg/documentation"]
title = "Документация"
description = """
Тук ще намерите връзки към ръководства, самоучители и различни източници
на информация, свързани с изучаването и усъвършенстването на Ruby."""
full_description = "Тук ще намерите връзки към ръководства, самоучители и различни източници на информация, свързани с изучаването и усъвършенстването на Ruby. Инсталиране на Ruby Освен ако не искате да пробвате Ruby във вашият браузър (линкът е по-долу), трябва да инсталирате Ruby на вашият компютър. Може да проверите дали Ruby е вече инсталиран като отворите терминал и напишете: ruby -v Ако е инсталиран ще бъде изведена информация за инсталираната версия. В противен случай вижте страницата за инсталиране за подробни инструкции за инсталиране. Като за начало Try Ruby! Интерактивно ръководство за Ruby в твоят браузър. Препоръчва се за начинаещи, които искат да се запознаят с езика. Ruby Koans Коаните помагат с научаването на синтаксиса и структурата на Ruby, както и със запознаването с някои основни функции и библиотеки. Why’s (Poignant) Guide to Ruby Необичайна, но интересна книга, която ще ви научи на Ruby чрез истории, шеги и рисунки. Първоначално създадено от why the lucky stiff, това ръководство остава класика при ученето на Ruby. Ruby in Twenty Minutes Кратък туториал, покриващ основите на Ruby. Отнема не повече от 20 минути. Ruby from Other Languages Идвате от друг език? Независимо дали е C, C++, Java, Perl, PHP или Python, тази страница е за вас! Ruby Essentials Ruby Essentials е безплатна on-line книга, предоставяща лесен начин за научаването на Ruby. Learn to Program Чудесно ръководство за начинаещи Ruby програмисти от Chris Pine. Learn Ruby the Hard Way Много добър набор от упражнения с обяснения, които покриват всичко от от основите до ООП и разработката на web приложения. Ръководства Programming Ruby Първото издание на книгата Pragmatic Programmers, напълно безплатно. The Ruby Programming Wikibook Безплатно online ръководство със съдържание за начинаещи и средно напреднали. Документация Ruby Core Reference Официалната документация, извлечена от сорс кода чрез RDoc. Тук можете да намерите информация за всички вградени класове и модули (като String, Array, Symbol, и.т). Ruby Standard Library Reference Документация, също извлечена от сорс кода, описваща стандартната библиотека на Ruby. RubyDoc.info Документация за Ruby gem-ове и Ruby проекти, хоствани в github.com Ruby & Rails Searchable API Docs Rails и Ruby документация с възможност за умно търсене. APIdock Документация за Ruby, Rails и RSpec, включваща потребителски забележки и коментари. Редактори и среди за разработка За писане на Ruby може да бъде използван всеки редактор на текст. За по-голяма ефективност се препоръчва използването на редактор с вградена поддръжка на Ruby (напр. оцветяване на кода, автоматично подравняване) или интегрирана среда за разработка (IDE) с повече функционалности (напр. допълване на код, рефакторинг, дебъгер). Списък с най-популярните приложения, използвани от Ruby разработчици: Linux и мултиплатформени приложения: Aptana Studio Emacs с Ruby mode и Rsense Geany gedit Vim с плъгина vim-ruby и Rsense RubyMine SciTe NetBeans Sublime Text Visual Studio Code с плъгина Ruby LSP За Windows: Notepad++ За macOS: TextMate BBEdit Dash (за преглед на документация) Други източници Ruby-Doc.org поддържа списък с източници на информация на английски език. Ако имате въпроси относно Ruby, пощенският списък е чудесно място да ги зададете."
