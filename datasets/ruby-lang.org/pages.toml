title = "Изтегляне на Ruby"
description = """
Това е мястото, от където можете да свалите последната версия на Ruby.
Наличната стабилна версия е 3.4.2.
Препоръчително е да прочете Лиценз на Ruby."""
full_description = "Това е мястото, от където можете да свалите последната версия на Ruby. Наличната стабилна версия е 3.4.2. Препоръчително е да прочете Лиценз на Ruby. Начини за инсталиране Има няколко начина да се инсталира Ruby за всяка голяма платформа: За Linux/UNIX може да бъде използван пакетният мениджър на дистрибуцията (apt-get, yum, pacman, etc.) или приложение за управление на ruby версии (rbenv и RVM). За macOS може да се използва инструмент за управление на ruby версии (rbenv и RVM). За Windows машини може да бъде използван RubyInstaller. Вижте страницата за Инсталация за по-подробна информация за инсталиране. Ruby може да бъде инсталиран и от изходен код на всички големи платформи. Инсталация от изходен код Инсталацията на Ruby от изходен код е добро решение, ако се чувствате комфортно с вашата платформа и се нуждаете от специфични настройки за вашата среда. Това е и добър вариант, ако липсва прекомпилиран пакет за вашата платформа. Вижте страницата за Инсталация за детайли относно инсталирането от изходен код. Ако имате проблеми с компилирането на Ruby, може да използвате някое от приложенията за управление на Ruby версии, споменати по-горе. Те могат да ви помогнат. Стабилни версии: Ruby 3.4.2 sha256: 41328ac21f2bfdd7de6b3565ef4f0dd7543354d37e96f157a1552a6bd0eb364b Ruby 3.3.7 sha256: 9c37c3b12288c7aec20ca121ce76845be5bb5d77662a24919651aaf1d12c8628 Ruby 3.2.7 sha256: 8488fa620ff0333c16d437f2b890bba3b67f8745fdecb1472568a6114aad9741 Получават security ъпдейти (скоро ще бъдат преустановени!): Ruby 3.1.6 sha256: 0d0dafb859e76763432571a3109d1537d976266be3083445651dc68deed25c22 Преустановена поддръжка (EOL): Ruby 3.0.7 sha256: 2a3411977f2850431136b0fab8ad53af09fb74df2ee2f4fb7f11b378fe034388 Snapshots: Stable Snapshot: Това е архвирано копие на последната стабилна версия. Nightly Snapshot: Това е архивирано копие на последната версия в Git хранилището. Възможно е да съдържа бъгове или некоригирани проблеми. За повече информация относно Subversion хранилището можете да посетите страницата Ruby Core. Изходният код на Ruby е наличен и от голям брой огледални сайтове. Опитайте да използвате огледален сайт, който се намира възможно най-близо до вас."
