full_description = "Oбщността, която се образува около един език за програмиране е сила, която не може да бъде пренебрегвана. Ruby притежава ентусиазиранa и постоянно увеличаващa се общност, която е приятелско настроенa към хора на всякакво ниво на програмиране. Ако сте заинтересовани от възможноста да се включите, това са местата, от където можете да започнете: Ruby потребителски групи Вашата локална потребителска група е страхотно място за комуникация с други програмисти. Групите са самоорганизирани, разполагат с пощенски списък, сайт, провеждат се месечни събирания и конференции. Ruby пощенски списъци и новинарски групи Ruby разполага с пощенски списъци на различни езици, обхващащи интересни и разнообразни теми. Ако имате въпрос относно Ruby, те са чудесно място за бърз и точен отговор. Ruby в IRC мрежата (#ruby) IRC каналът на Ruby е прекрасно място за комуникация с други рубисти. Ruby ядро Сега е чудесно време да следите разработването на Ruby. Ако искате да помогнете, започнете тук. Ruby блогове Тук можете да намерите списък от блогове, свързани с Ruby. Ruby конференции Ruby програмистите по света все по-често организират конференции, където се събират, за да споделят интересни идеи, информация, да обсъждат бъдещето на езика и да посрещнат „новаците“ в Ruby обществото. Обща информация за Ruby Ruby Central Ruby в Open Directory Project Rails в Open Directory Project"
