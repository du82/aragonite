["https://ruby-lang.org/de/news/2020/10/02/ruby-2-7-2-released"]
title = "Ruby 2.7.2 veröffentlicht"
full_description = "Geschrieben von nagachika am 2.10.2020 Übersetzt von Marvin Gülker Ruby 2.7.2 ist veröffentlicht worden. Diese Veröffentlichung enthält eine bewusste Inkompatibilität. Veraltungswarnungen werden mit 2.7.2 ausgeschaltet. Sie können sie durch Angabe der Schalter -w oder -W:deprecated auf der Kommandozeile wieder einschalten. Weitere Informationen unten. Feature #17000 2.7.2 schaltet standardmäßig Veraltungswarnungen aus Feature #16345 Veraltungswarnungen nicht standardmäßig zeigen. Diese Veröffentlichung enthält die neue Version von Webrick, die die in folgendem Artikel beschriebene Sicherheitslücke behebt. CVE-2020-25613: Sicherheitslücke: Schmuggeln von Requests in WEBrick möglich Siehe die Commit-Logs für weitere Änderungen. Download https://cache.ruby-lang.org/pub/ruby/2.7/ruby-2.7.2.tar.bz2 SIZE: 14708724 SHA1: 7e30ca324464eab2f4c2a56d8ab4a37174998062 SHA256: 65a590313d244d48dc2ef9a9ad015dd8bc6faf821621bbb269aa7462829c75ed SHA512: f07592cce4de3532c0fa1c84d53a134527d28ba95e310cd3487ac321c49ee680faeace285de544ee6db432a90aa7538a1d49ff10c72b235968ca362ef9be621d https://cache.ruby-lang.org/pub/ruby/2.7/ruby-2.7.2.tar.gz SIZE: 16836767 SHA1: cb9731a17487e0ad84037490a6baf8bfa31a09e8 SHA256: 6e5706d0d4ee4e1e2f883db9d768586b4d06567debea353c796ec45e8321c3d4 SHA512: e80dc16b60149d0d6fedf0ba7b556ae460ff328ee63e9d9e41f5021f67addcc98159cb27bddccaebd6e4b1cddf29266f1c01c32d9ec8bb665aed63c0a2295f2f https://cache.ruby-lang.org/pub/ruby/2.7/ruby-2.7.2.tar.xz SIZE: 12037052 SHA1: 82a1fe683460caa8edb6199707f2905634e5ffcc SHA256: 1b95ab193cc8f5b5e59d2686cb3d5dcf1ddf2a86cb6950e0b4bdaae5040ec0d6 SHA512: 7972278b096aa768c7adf2befd26003e18781a29ca317640317d30d93d6e963ded197724c8e2f1dfe1e838c5647176d414a74732a62e931fb50d6f2e0f777349 https://cache.ruby-lang.org/pub/ruby/2.7/ruby-2.7.2.zip SIZE: 20618242 SHA1: 9acee3d4e9399c3a2ddc2dd078dd2ee26327cc8f SHA256: c6b8597e5414f2b01a7cb25095319f2b0e780c95a98fee1ccf1ef022acf93dcc SHA512: 5f3a8d78bbd3d9700e5f0434d0cec2072816c02f5d