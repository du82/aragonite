["https://ruby-lang.org/de/community/weblogs"]
title = "Weblogs"
description = """
Blogs zum Thema Ruby sind während des letzten Jahres explosionsartig
entstanden. Wer danach sucht, wird hunderte von Blogs ausgraben, die
Ruby-Code enthalten, neue Techniken beschreiben oder über die Zukunft
von Ruby spekulieren."""
full_description = "Blogs zum Thema Ruby sind während des letzten Jahres explosionsartig entstanden. Wer danach sucht, wird hunderte von Blogs ausgraben, die Ruby-Code enthalten, neue Techniken beschreiben oder über die Zukunft von Ruby spekulieren. Ruby-Blogs finden RubyFlow, „das Linkblog der Ruby- und Rails-Community“, bietet Ruby-Neuigkeiten in der Form von Links zu Bibliotheken, Blog-Artikeln, Tutorials und anderen Materialien zu Ruby. Erwähnenswerte Blogs Einige Blogs sind wegen ihres frequenten Outputs und der Aktualität zu empfehlen: Matz’ Blog ist das japanische Blog des Erfinders von Ruby. Selbst wer nicht alles versteht, was dort steht, sollte froh sein, dass dort etwas steht. ;-) Ruby-Mine ist ein Gruppenblog von mehreren Mitgliedern der deutschen Ruby-Szene. Es werden Neuigkeiten, Hacks und Projekte aus der Ruby-Welt thematisiert. Ruby Inside berichtet über interessante Applikationen und Bibliotheken aus der Welt von Ruby und von Rails. O’Reilly Ruby ist ein Gruppenblog mit entsprechendem Tutorial zu Ruby und Interviews mit interessanten Leuten aus der Community. Riding Rails ist das offizielle Blog der Macher von Ruby on Rails. Wer Rails einsetzt, sollte sich hier über die neuesten Sicherheits-Updates und weiteren Entwicklungen der breiten Rails-Community informieren. Weitersagen Die oben genannten Blogs sind ebenfalls gute Anlaufstellen, um dort eigene Themen anderen bereitzustellen. (Wenn es offensichtlich nichts mit Rails zu tun hat, wird das Riding Rails Team eventuell nicht daran interessiert sein, aber man weiß ja nie). Ruby ist außerdem auf Slashdot ein verbreitetes Thema. Wer interessanten Code findet, sollte sich dort melden."
year_published = 2025
clearnet = "https://ruby-lang.org/de/community/weblogs"
