["https://ruby-lang.org/de/libraries"]
title = "Bibliotheken"
description = """
Wie bei vielen anderen Programmiersprachen gibt es auch für Ruby
unzählige faszinierende und nützliche Bibliotheken."""
full_description = "Wie bei vielen anderen Programmiersprachen gibt es auch für Ruby unzählige faszinierende und nützliche Bibliotheken. Die meisten stehen im praktischen gem-Format zur Verfügung. RubyGems ist ein Paketsystem für Ruby, das die Erstellung, Verbreitung und Installation von Bibliotheken ermöglicht. (Es handelt sich um eine Art von Paketverwaltungssystem ähnlich wie zum Beispiel apt-get, aber speziell für Ruby.) Seit Ruby 1.9 ist RubyGems standardmäßig enthalten, bei früheren Versionen von Ruby muss RubyGems von Hand nachinstalliert werden. Andere Bibliotheken werden als gewöhnliches Quelltext-Archiv angeboten (.zip oder .tar.gz). Hier kann der Installationsprozess variieren, typischerweise gibt es eine README- oder INSTALL-Datei mit Hinweisen. Nun musst Du nur noch wissen, wie Du diese Bibliotheken finden und installieren kannst. Bibliotheken finden Die meisten Bibliotheken werden als Gems auf RubyGems.org gehostet. Nach Bibliotheken kann direkt auf der Webseite oder mithilfe des gem-Kommandos gesucht werden. Mit gem search -r kann das RubyGems-Repository durchsucht werden. Zum Beispiel liefert gem search -r rails eine Liste aller Gems, die mit Rails zu tun haben. Mit der --local-Option (-l) würden die lokal installierten Gems durchsucht werden. Ein Gem kann mit gem install [gem] installiert werden. Die lokal installierten Gems können mit gem list angezeigt werden. Mehr Informationen über den gem-Befehl finden sich unten oder in der RubyGems-Dokumentation. Es gibt jedoch auch andere Quellen für Bibliotheken. RubyForge war eine beliebte Anlaufstelle für Ruby-Bibliotheken, aber in den letzten Jahren hat sich vor allem GitHub zu einem der wichtigsten Repositories für Ruby-Projekte entwickelt. Sehr häufig findet auf GitHub die Entwicklung einer Bibliothek statt, während die Veröffentlichung als Gem auf RubyGems.org erfolgt. The Ruby Toolbox (“Die Ruby-Werkzeugkiste”) ist ein Verzeichnis, das die Suche nach freien Ruby-Projekten erleichtert. Es verfügt über Kategorien für häufige Entwicklungsaufgaben und sammelt zahlreiche Informationen über die Projekte, wie Release- und Commit-Häufigkeit oder Abhängigkeiten. Die Projekte werden nach ihrer Beliebtheit bei RubyGems.org und GitHub bewertet. Die Suchfunktion erleichtert das Auffinden von geeigneten Projekten. Eine kleine Einführung in RubyGems Hier folgt ein kurzer Überblick über den gem-Befehl für den täglichen Gebrauch. Eine genaue Beschreibung aller Funktionen dieses Paketsystems findet sich in RubyGems’ ausführlicher Dokumentation. Gems suchen Der Befehl search sucht nach Gems eines bestimmten Namens. Um ein Gem zu finden, dessen Name mit “html” beginnt, gibst Du beispielsweise Folgendes ein: $ gem search -r html *** REMOTE GEMS *** html-sample (1.0, 1.1) Der Parameter --remote / -r bewirkt, dass das offizielle Repository bei RubyGems.org durchsucht wird (Standardverhalten). Mit dem Parameter --local / -l wird eine Suche unter den lokal installierten Gems durchgeführt. Ein Gem installieren Sobald Du weißt, welches Gem Du installieren willst (zum Beispiel das beliebte Rails), gib Folgendes ein: $ gem install rails Du kannst sogar nur eine spezielle Version der Bibliothek installieren, indem Du den Parameter --version / -v übergibst: $ gem install rails --version 5.0 Alle Gems auflisten Um eine Liste aller lokal installierten Gems zu erhalten, verwende diesen Befehl: $ gem list Um eine komplette (und sehr lange) Liste aller Gems auf RubyGems.org zu erhalten, verwende diesen Befehl: $ gem list -r Hilfe! Hilfe ist verfügbar in Deinem Terminal: $ gem help Beispielsweise ist gem help commands sehr nützlich, das eine Liste aller Kommandos des gem-Befehls ausgibt. Eigene Gems erstellen Auf RubyGems.org gibt es verschiedene Anleitungen für das Erstellen eigener Gems. Möglicherweise solltest Du Dir auch Bundler etwas genauer anschauen, ein Werkzeug zur Verwaltung der Gem-Abhängigkeiten einer Ruby-Anwendung."
year_published = 2025
clearnet = "https://ruby-lang.org/de/libraries"
