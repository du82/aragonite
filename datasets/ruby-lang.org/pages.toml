full_description = "Mailinglisten sind eine prima Möglichkeit, um die Hand am Puls der Ruby-Community zu halten. Es gibt eine deutschsprachige Mailingliste zu Ruby: ruby-de Die einzige deutschsprachige Mailingliste zu Ruby, offen für alle Themen rund um Ruby. (Anmelden, Archiv, Benutzungsanleitung) Ruby hat vier englischsprachige Mailinglisten: Ruby-Talk Dies ist die höchstfrequentierte Liste. Sie behandelt alle allgemeinen Themen zu Ruby. (Archiv, Posting Guidelines) Ruby-Core Diese Liste behandelt die Core-Entwicklung von Ruby. Sie wird hauptsächlich zum Besprechen von Implementierungsfragen und Patch-Reviews verwendet. (Archiv) Ruby-Doc Diese Liste dient zur Diskussion der Ruby-Dokumentation und der dafür verwendeten Programme. (Archiv) Ruby-CVS Sämtliche Commits in das Ruby-Repository werden an diese Liste gesendet. comp.lang.ruby (Newsgroup) Für diejenigen, die das Usenet bevorzugen, ist die comp.lang.ruby-Newsgroup eine gute Anlaufstelle. (FAQ) Siehe https://ml.ruby-lang.org/mailman3/lists/ für weitere Informationen über alle Mailinglisten bei ruby-lang.org, einschließlich der Listen in japanischer Sprache. An- oder Abmelden An- oder Abmelden"
