full_description = "Here you can get the latest Ruby distributions in your favorite flavor. The current stable version is 3.4.2. Please be sure to read Ruby’s License. Ways of Installing Ruby We have several tools on each major platform to install Ruby: On Linux/UNIX, you can use the package management system of your distribution or third-party tools (rbenv and RVM). On macOS machines, you can use third-party tools (rbenv and RVM). On Windows machines, you can use RubyInstaller. See the Installation page for details on using package management systems or third-party tools. Of course, you can also install Ruby from source on all major platforms. Compiling Ruby — Source Code Installing from the source code is a great solution for when you are comfortable enough with your platform and perhaps need specific settings for your environment. It’s also a good solution in the event that there are no other premade packages for your platform. See the Installation page for details on building Ruby from source. If you have an issue compiling Ruby, consider using one of the third party tools mentioned above. They may help you. Stable releases: Ruby 3.4.2 sha256: 41328ac21f2bfdd7de6b3565ef4f0dd7543354d37e96f157a1552a6bd0eb364b Ruby 3.3.7 sha256: 9c37c3b12288c7aec20ca121ce76845be5bb5d77662a24919651aaf1d12c8628 Ruby 3.2.7 sha256: 8488fa620ff0333c16d437f2b890bba3b67f8745fdecb1472568a6114aad9741 In security maintenance phase (will EOL soon!): Ruby 3.1.6 sha256: 0d0dafb859e76763432571a3109d1537d976266be3083445651dc68deed25c22 Not maintained anymore (EOL): Ruby 3.0.7 sha256: 2a3411977f2850431136b0fab8ad53af09fb74df2ee2f4fb7f11b378fe034388 Snapshots: Stable Snapshot of ruby_3_4 branch: This is a tarball of the latest snapshot of the current ruby_3_4 branch. Stable Snapshot of ruby_3_3 branch: This is a tarball of the latest snapshot of the current ruby_3_3 branch. Stable Snapshot of ruby_3_2 branch: This is a tarball of the latest snapshot of the current ruby_3_2 branch. Stable Snapshot of ruby_3_1 branch: This is a tarball of the latest snapshot of the current ruby_3_1 branch. Nightly Snapshot: This is a tarball of whatever is in Git, made nightly. This may contain bugs or other issues, use at your own risk! For more information about specific releases, particularly older releases or previews, see the Releases page. Information about the current maintenance status of the various Ruby branches can be found on the Branches page. For information about the Ruby Subversion and Git repositories, see our Ruby Core page. The Ruby source is available from a worldwide set of Mirror Sites. Please try to use a mirror that is near you."
