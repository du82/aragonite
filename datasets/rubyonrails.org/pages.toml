["https://rubyonrails.org/2024/12/13/learn-Rails-8-tutorial-and-unpacked-videos"]
title = "Ruby on Rails — Want to learn about Rails 8? START HERE."
description = "Rails 8 is a major milestone, and for the first time in Rails’ history, thanks to the support of the members of the Rails Foundation, we are able to support this major release with new and updated tutorials, videos, and guides to help developers learn Rails’ new default features as quickly as possible."
full_description = "Rails 8 is a major milestone, and for the first time in Rails’ history, thanks to the support of the members of the Rails Foundation, we are able to support this major release with new and updated tutorials, videos, and guides to help developers learn Rails’ new default features as quickly as possible. The revamped Getting Started Guide walks you through building an e-commerce site while introducing Rails fundamentals and the latest Rails 8 defaults. Learn to use: This tutorial is beginner-friendly yet comprehensive, designed to make Rails accessible to everyone and welcome beginners to Rails for years to come. It’s also expandable, paving the way for future tutorials adding more features to the app. Note: The Installation Guide is now separate from the Getting Started Guide, making it easier to find. Special thanks to Chris Oliver of GoRails for writing this tutorial, with help from Rafael França, Xavier Noria, Jeremy Daer, Matthew Draper, Collin Jilbert, Kent Crutchfield, Harriet Oughton, Julian Duss, Santiago Rodriguez, Gianlo Occhipinti, Kim Perino, and all the reviewers on GitHub. Rails 8 Unpacked with Typecraft is a 9-part video series exploring Rails 8’s default features through the lens of adding features to a task management demo app. You can build your own app or follow along with the demo app by checking out the branches of the GitHub repo found under each episode. Thanks to Chris Power and Robert Beene from Typecraft, and reviewers Rosa Gutierrez, Donal McBreen, Breno Gazzola, Miles Woodroffe, Bruno Miranda, and the Rails Core team. Also: This series is subtitled in Japanese, Brazilian Portuguese, and Spanish thanks to the team at Happy Scribe! More updates are on the way! Thanks to the docs team - Ridhwana Khan, Bhumi Shah, Harriet Oughton, Petrik de Heus - and everyone in the community who reviewed their PRs. ** Whether you’re a new or experienced Rails developer, we hope you’ll find these resources helpful when exploring all that Rails 8 has to offer."
