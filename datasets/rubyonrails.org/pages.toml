["https://rubyonrails.org/doctrine/fr"]
title = "Ruby on Rails — La doctrine Rails"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "La montée en puissance phénoménale de Ruby on Rails est due en grande partie à sa technologie novatrice et à son timing. Mais les avantages technologiques s’érodent avec le temps et un bon timing ne permet pas de maintenir les mouvements sur le long terme. Une explication plus large de la manière dont Rails a continué à rester non seulement pertinent, mais également à renforcer son impact et sa communauté est nécessaire. Je propose que le catalyseur permanent ait été et reste sa doctrine controversée. Cette doctrine a évolué au cours de la dernière décennie, mais la plupart de ses plus puissants piliers en sont également les fondateurs. Je ne prétends pas à l’originalité fondamentale de ces idées. L’accomplissement principal de Rails a été de réunir et de former une tribu forte autour d’un large éventail de pensées hérétiques sur la nature de la programmation et des programmeurs. Après ce préambule, voici les neuf piliers les plus importants de la doctrine Rails, tels que je les perçois : Il n’y aurait pas de Rails sans Ruby, il est donc normal que le premier pilier doctrinal soit tiré de la motivation fondamentale qui a motivé la création de Ruby. L’hérésie originelle de Ruby consistait en effet à placer le bonheur du programmeur sur un piédestal. Au-dessus de nombreuses autres préoccupations concurrentes et valables qui ont conduit aux langages de programmation et les écosystèmes avant lui. Là où Python pouvait se vanter d’être “une et de préférence une seule façon de faire quelque chose”, Ruby adorait l’expression et la subtilité. Alors que Java défendait avec force les programmeurs d’eux même, Ruby a inclus une corde suspendue dans le kit de bienvenue. Là où Smalltalk a percé une pureté de transmission de messages, Ruby a accumulé des mots-clés et des constructions avec un appétit de glouton. Ruby était différent parce qu’il valorisait différentes choses. Et la plupart de ces choses étaient au service de cette aspiration au bonheur des programmeurs. Une quête qui a mis en contradiction avec non seulement la plupart des autres environnements de programmation, mais également avec la perception générale de ce qu’était un programmeur et de la façon dont il était censé agir."
