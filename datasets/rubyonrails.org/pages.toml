["https://rubyonrails.org/security"]
title = "Ruby on Rails — Security"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "This means including features to protect app makers from common issues like CSRF, Script Injection, SQL Injection, and the like. But it also means a clear policy on how to report vulnerabilities and receive updates when patches are released. All security bugs in Rails should be reported through our bounty program page at HackerOne. This will deliver a message to a subset of the core team who handle security issues. Your report will be acknowledged within 24 hours, and you’ll receive a more detailed response to your email within 48 hours indicating the next steps in handling your report. After the initial reply to your report the security team will endeavor to keep you informed of the progress being made towards a fix and full announcement. These updates will be sent at least every five days, in reality this is more likely to be every 24-48 hours. If you have not received a reply to your email within 48 hours, or have not heard from the security team for the past five days there are a few steps you can take: Please note, the Rails core list and Rails Discord server are public areas. When escalating to that address please do not discuss your issue, simply say that you’re trying to get a hold of someone from the security team. This process can take some time, especially when coordination is required with maintainers of other projects. Every effort will be made to handle the bug in as timely a manner as possible, however it’s important that we follow the release process above to ensure that the disclosure is handled in a consistent manner. The best way to receive all the security announcements is to subscribe to the Rails Security Announcements section of the forum. This section is very low traffic, and it receives the public notifications the moment the embargo is lifted. No one outside the security team or the initial reporter will be notified prior to the lifting of the embargo. We regret that we cannot make exceptions to this policy for high traffic or important sites, as any disclosure beyond the minimum required to coordinate a fix could cause an early leak of the vulnerability."
year_published = 2025
