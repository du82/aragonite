["https://rubyonrails.org/2025/1/10/this-week-in-rails"]
title = "Ruby on Rails — Sorted Columns in Schema Dumper, Deprecations, and lots of fixes!"
description = "Hey everyone, Happy Friday!"
full_description = "Before we start, a small update - I am happy to share that my team at Saeloun is joining the Rails Foundation as a contributing member. Read more about the reasons why we decided to join here, and why you should too! Colorize console prompt on non standard environments Currently, the Rails console prompt is colored according to the following rules: blue for dev and test, red of prod. On non-standard environments (like staging), the prompt is not colored. With this change, it will now be set to Magenta, for these environments. Fix running individual app:update commands This change fixes a regression, where the individual app:update commands (like app:update:configs or app:update:bin) could no longer be run on their own, as they require the app to be loaded and it no longer was. Fix backtrace of ArgumentErrors raised during template rendering Before this fix, any argument error in a template with strict locals would be swallowed and be replaced by an exception with unrelated backtrace, which made debugging templates difficult. With this change, any ArgumentError unrelated to strict locals is re-raised, preserving the original backtrace for developers. Fix local variable access in layouts Layouts now have access to local variables passed to render. This fixes a very old regression introduced in Rails 5.1! Sort table columns by name when dumping schema The table columns inside schema.rb are now sorted alphabetically. Previously they’d be sorted by creation order, which can cause merge conflicts when two branches modify the same table concurrently. Update NotificationAssertions’s assert_notifcation to match against payload subsets and return matched notification ActiveSupport::Testing::NotificationAssertions’s assert_notification now matches against payload subsets by default. Previously the following assertion would fail due to excess key values in the notification payload. Now with payload subset matching, it will pass. Load configured Active Storage plugins during boot Previously, the parts of Active Storage using ruby-vips, mini_magick, or image_processing would try to load gems only when used. This strategy works well because it allows apps that don’t need these features to easily ignore them and not have to depend on gems they don’t need."
