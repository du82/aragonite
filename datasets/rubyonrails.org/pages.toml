["https://rubyonrails.org/2015/3/7/this-week-in-rails-50-000-commits-gsoc-opportunity-and-more"]
title = "Ruby on Rails — This week in Rails: 50,000 commits, GSoC opportunity and more!"
description = "Ahoy there, rapscallion."
full_description = "We’re just about to depart for our weekly voyage on the sea of Rails news - beware the great snark! Our backs are all red from the pats given when news broke of Rails having more than 50,000 commits. Adding to that chalupa 42 chummy contributors crossed the web and helped out. Listen in as David takes a trip down memory lane. Hear why he made Rails and get some stories on the early days of Rails contributing. He also has some thoughts about money and open source. It might not be such a good thing to get paid to work on open source, after all. Speaking of being paid for open source, Rails will be part of this year’s GSoC. I was a student two years ago and wouldn’t be here without it. There we were. Having a nice day on the deck and a seagull wants to join in on the fun of staring at peaceful waters. Not on my watch. Rails 5 brings a restart Dr. Frankenstein would be envious of. The new rake restart command will knock your app out cold and zap it back to life. We also got a new Enumerable method to quickly rid of us stuff harmful to humans: [:whooping_cough, :vaccine, :measles].without(:vaccine). That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
