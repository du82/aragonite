full_description = "To improve the documentation, education, marketing, and events of our framework to the benefit of all new and existing Rails developers, and to ensure a prosperous ecosystem that continues to improve for decades to come. Read our announcement for more details. The foundation will commission freelancers and firms to work on better written documentation, more compelling screencasts, exciting events, and much more. We've only just gotten started, so more detailed plans are still to follow. We will also be administering the Rails trademarks through an exclusive license from the trademark owner. The next tier of membership is Contributing member, and we are pleased to have the further support of the following members: The foundation is always open to new Contributing members. Please apply for membership by writing to foundation@rubyonrails.org for more details. If your company has been benefiting from Rails over the years, but not sure how it might give back to the ecosystem, now there's a clear and obvious choice. The Core member companies are each represented by one employee on the foundation's board, which is then chaired by the creator of Ruby on Rails, David Heinemeier Hansson. In 2022, the first eight Core foundation members banded together to generously endow the foundation with $1,000,000 USD in funding to kick start the foundation and make a real difference on all the aforementioned areas of improvement. Going forward, each Core member has committed to contributing $75,000/year, with Contributing members donating a further $25,000/year. With this combined budget dedicated to fulfilling our mission, we will not have to rely on funding from individual contributors. We are always open to hearing ideas and suggestions that align with our mission to improve the documentation, education, events, and marketing efforts around Rails."
