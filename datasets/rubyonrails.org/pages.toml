["https://rubyonrails.org/2015/6/20/this-week-in-rails-security-releases-enumerable-relations-and-more"]
title = "Ruby on Rails — This week in Rails: Security Releases, Enumerable Relations and more!"
full_description = "I’m just glad we all made to this Friday. This is Washington again pulling together a few stories for our weekly newsletter on Rails. Keeping our tradition let’s start with the 32 splendid contributors that made their commits to rails/rails this week. Keep in mind a ton other people also helped by creating issues and helping the core team with PR reviews. Time to upgrade your applications. Five announcements landed on Rails security mailing list this week. Consider joining that list as well if you haven’t yet. After a couple years Rails core team seems to have changed its mind and Enumerable is finally included into active record relations. Things change and I believe that’s fine. Thanks to the awesome open source community it was noted ActiveRecord::RecordInvalid was not being eager loaded as expected. The fix was backported to all supported branches. As per an old change on Rack spec Rails 5 will no longer ship with ContentLength middlleware by default. The way to go now is to explicitly pass the status first then pass the options hash as a second parameter. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
