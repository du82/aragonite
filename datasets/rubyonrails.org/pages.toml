["https://rubyonrails.org/world/2024/faq"]
title = "Rails World - 2024 — Frequently Asked Questions"
description = "September 26 & 27 - Toronto, CA"
full_description = "Frequently Asked Questions General Tickets & Visas Venues & Hotels Accessibility General What is Rails World? Who is it for? Rails World is a conference focused on the Ruby on Rails framework. It brings together developers, engineers, and enthusiasts from around the world to discuss and explore the latest trends, techniques, and advancements in Rails development. It is designed for anyone with an interest in Ruby on Rails, from beginners to experienced professionals. Does Rails World have a Code of Conduct? You bet we do. Please read the Code of Conduct here. We are committed to making Rails World a safe space for all. If you have any issues please reach out to world@rubyonrails.org. Will Rails World be livestreamed? Rails World will not be livestreamed. Will the talks be recorded/published? Yes, all talks will be recorded and published on the Rails YouTube channel within 2 weeks after Rails World. Subscribe to the channel to be informed when the videos get published. Lighting talks will not be recorded. Will there be a conference app or chat? We will be using a Campfire instance for Rails World this year for updates, announcements, and a means for attendees to connect with each other. Registered attendees will be invited to Campfire in September. The Rails World conference app is developed by Telos Labs. Attendees can see a more detailed agenda, build their schedule, receive notifications of upcoming sessions, and share their profile for networking. Telos Labs has open sourced this app, and it is our hope that the (many) events in our space will also use it for their own events. Should I stay for the weekend after Rails World? Staying longer in Toronto is a great idea - there is definitely plenty to do, and with 1,000 other attendees coming from around the world to attend Rails World, it’s likely that you will have plenty of people to hang around with after the event! What are the starting and ending times and dates so I can book my travel? Sept 25, 4pm: Pre-registration and badge pickup. Sept 26, 9am: Day one, doors open at 9am at the venue. Sept 27, 10pm: Day two, closing party ends. We recommend booking your travel to arrive by 4pm on Wednesday September 25th and depart on Saturday September 28th if you want to attend the Rails World closing party without worrying about rushing to catch your flight. My question isn't answered here. Who can I contact? Reach out to us at world@rubyonrails.org. Tickets & Visas I need a letter with the event code to obtain a visa from the Canadian government. Please read about Canadian Visa Requirements here. Most foreign nationals need a temporary resident visa (TRV) or an Electronic Travel Authorization (ETA) to travel to Canada. ETAs are easy and take minutes to request, however if you need a TRV, the process can be considerably longer. Registered attendees have received information about visas and requesting a letter of invitation in their ticket confirmation. What is the refund policy? If you need to cancel your registration for Rails World, please let us know as soon as possible by emailing world@rubyonrails.org. Full refunds are available up to 45 days prior to the start of the event, minus a 4% transaction fee. If you cancel between 44 and 30 days prior to the event, you are eligible for a 50% refund, minus the transaction fee. Unfortunately, we cannot provide any refunds for cancellations less than 30 days prior to the event. However, you may transfer your ticket to another attendee free of charge up to 14 days prior to the start of Rails World. Badges will be pre-printed 14 days before the event, so no changes or transfers will be honored after that date. Can I transfer my ticket to someone else? You may reassign your ticket to another attendee free of charge up to 14 days prior to the start of Rails World via the personal ticket link emailed to you from Tito (registration software) after booking. Badges will be pre-printed 14 days before the event, so no changes or transfers will be honored after that date. What is the covid/mask policy? As of now (April 2024), Canada does not require testing, proof of vaccination, or masks at events, and so they will not be required for Rails World. Any changes in this policy will be communicated to attendees as soon as they are known. Those who feel more comfortable wearing masks are always welcome to do so, and we do ask that you abide by the new golden rule: if you feel unwell on the day of the event or the days leading up to the event, please do not come. In the event you test positive for Covid immediately before or on the first day of Rails World, your ticket cost will be transferred into credit to be used at the next Rails World event. To request credit for your attendance fee, or if you have any questions, please contact world@rubyonrails.org. Do you have a scholarship or financial support program? The financial support program is currently maxed out while we find sponsors for the current applicants. We will not be taking any further applicants at this time. Venues & Hotels Where is the event taking place? Rails World will be held at the Evergreen Brick Works in Toronto. This historic building used to be the former brick factory and quarry which produced the bricks that built some of Toronto’s most iconic buildings. We can’t wait for you to see this raw, industrial, beautiful space. Where should I stay? The Chelsea Hotel is a centrally located 3-star hotel where many attendees are staying. The event room block is currently full, but the hotel still has availability at $410 CAD ($305 USD) plus taxes. If you want to book this rate please reach out to info@magnifycommunications.com and we will do our best to assist. Accessibility How do I communicate my accessibility needs to the Rails World organizers? Rails World is committed to making the event accessible to everyone. If you have specific accessibility needs or require any accommodations, please indicate that in the ‘Accessibility needs’ question of the registration form, and we will do our best to accommodate you. Will the conference be accessible by wheelchair? Yes, Evergreen Brick Works is wheelchair accessible, and all programmed activity will take place on the ground level after you enter the venue. Because the building is a preserved monument and an old brick factory, some of the floor in the old kilns or the outside pavilion can be a little uneven. How much walking will be required? Most of the program will take place on two tracks and in the Sponsor Garden, all of which are all located closely together, so walking can be kept to a minimum if need be, and there will be plenty of seating throughout the space to relax. Will the talks have closed captioning? Closed captioning will be provided on the two main tracks to accommodate those with hearing impairments, as well as those who speak English as a second language and prefer to read spoken content. Screens will be set up next to the stage to display these captions, so attendees who wish to make use of the captions are advised to sit close to the screens for better viewing. Lightning talks will not have closed captioning. Are food and drinks included? Can special dietary requirements be accommodated? Rails World will provide lunch and food breaks, and light food and drinks at any official networking event. Efforts are made to accommodate special dietary requirements, such as vegetarian, vegan, gluten-free, or other specific dietary restrictions. Please indicate your dietary needs during registration to ensure suitable arrangements are made. Does the venue have a cloakroom? Luggage room? Yes, we will have a manned cloakroom at the entrance where attendees can store their coats, luggage and personal belongings during the event. Although this is a closed conference only open to ticket holders, attendees are always advised to watch their belongings closely. Does the venue have a nursing parents’ room? Not by design, so if you are a nursing parent, please indicate this on the registration form and we will assign a private meeting room for your needs. Does Rails World provide childcare? Rails World does not typically provide childcare services directly. However, if you require assistance in finding childcare options during the conference, the organizers may be able to offer recommendations for reliable local services. It is advisable to contact the Rails World team in advance to discuss your childcare needs and receive appropriate guidance. Does the venue have a single-occupancy or gender neutral bathroom? The bathrooms at Evergreen Brick Works are all gender neutral. const allATags = document.getElementsByClassName('categoryButton'); for (let i = 0; i < allATags.length; i++) { allATags[i].addEventListener('click', function (event) { const targetId = allATags[i].getAttribute('href'); const targetElement = document.querySelector(targetId); // Set focus for accessibility users targetElement.focus(); }); }"
