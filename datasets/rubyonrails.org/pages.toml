["https://rubyonrails.org/2023/4/3/the-rails-foundation-welcomes-cedarcode-as-a-contributing-member"]
title = "Ruby on Rails — The Rails Foundation welcomes Cedarcode as a Contributing member"
description = "Beginning this week, we are excited to announce that the Rails Foundation will be regularly updating this blog with information on the initiatives we are actively working on. Stay tuned for the latest updates on our progress and how we are working to improve the Ruby on Rails community."
full_description = "Beginning this week, we are excited to announce that the Rails Foundation will be regularly updating this blog with information on the initiatives we are actively working on. Stay tuned for the latest updates on our progress and how we are working to improve the Ruby on Rails community. Cedarcode integrates smoothly with companies to collaborate full-time on their development projects and help them boost their teams. With many members of the team bringing more than 10 years of Ruby on Rails experience to their work, Cedarcode is well equipped to offer high-quality code, attention to detail, and a passion for performance and security to a wide range of businesses and industries. In addition to their expertise in Ruby on Rails development, Cedarcode is also committed to giving back to the community. They have organized and participated in numerous community events, have contributed to open-source projects, including the Rails framework itself, as well as created and maintain their own open-source projects. We are Ruby on Rails lovers and many years ago we decided to invest our careers in this technology. It has helped our company grow and lets us enjoy what we do every day. When we heard about the Rails Foundation, we knew we wanted to get involved. We believe the Rails Foundation will help the Rails ecosystem evolve and stay strong for the years to come. We are glad to be part of it! Sebastian Suttner, Cedarcode Co-Founder We are excited to work with them and look forward to the valuable insights they will bring to our community. With their help, we can continue to build a vibrant and supportive community around Ruby on Rails development. Cedarcode joins the Rails Foundation Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals. If your company would also like to explore becoming a Contributing member, please reach out to foundation@rubyonrails.org. By joining the Rails Foundation, you will have the opportunity to help us grow and strengthen the Ruby on Rails community for generations to come."
