["https://rubyonrails.org/2015/11/14/this-week-in-rails-new-releases-exciting-rails-5-stuff-and-more"]
title = "Ruby on Rails — This week in Rails: new releases, exciting Rails 5 stuff and more!"
description = "Hey everyone - Tim here with another monster update with all the exciting Rails-related goings-on from this week."
full_description = "Hey everyone - Tim here with another monster update with all the exciting Rails-related goings-on from this week. One of the nicest things about development mode in Rails has to be the sheer convenience of running on your latest revision on each request. This of course comes at a performance cost but is about to change: instead the filesystem will notify Rails asynchronously of any changes. This week saw the release of both 4.2.5 and 4.1.14 versions of Rails. Go upgrade while they’re still hot! This week 33 fabulous people contributed to Rails. Check out the list of issues if you’d like to see your name up there. Now you can can call Time.days_in_year and, at the time of writing it will return 365. Call it next year and it will give you 366. Nice! This change adds an option to Preserve-the-CASE of the string instead of casting-everything-to-lowercase when generating parameters. Support for non-Active Record associations just got better by skipping marked_for_destruction? when going through validations if it’s not implemented, making it easier to define virtual associations. This brings more consistency across the adapters where those for MySQL and SQLite would return views in addition to tables when calling #tables, where PostgreSQL would not. Now they all return tables, and no views. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself."
year_published = 2025
