["https://rubyonrails.org/2023/8/28/calling-recent-le-wagon-grads-be-the-face-of-rails-world-as-an-emcee"]
title = "Ruby on Rails — Calling recent Le Wagon grads: Be the face of Rails World as an emcee!"
description = "The Rails Foundation has partnered with Le Wagon to search for two outstanding emcees to host our Rails World stages in Amsterdam this October. The roles will be filled with recent graduates of the Le Wagon Web Development course, because what better way for a junior developer to kickstart their career in Rails than by sharing the stage with our industry’s best speakers?"
full_description = "The Rails Foundation has partnered with Le Wagon to search for two outstanding emcees to host our Rails World stages in Amsterdam this October. The roles will be filled with recent graduates of the Le Wagon Web Development course, because what better way for a junior developer to kickstart their career in Rails than by sharing the stage with our industry’s best speakers? Since 2013, Le Wagon has taught Rails to more than 22,000 new developers (often career changers) at their immersive coding bootcamps across Europe, the Americas, Asia, Africa, the Middle East, and online, and has seen more than 200 startups launch from their alumni community. Le Wagon’s commitment to teaching Rails has been crucial in nurturing the next generation of Rails enthusiasts, so they were a natural for this partnership. As the face of Rails World, an emcee’s role will be to host a stage, introduce speakers to the audience, share relevant event updates, and keep the energy level high throughout the event. This is a great opportunity for a junior Rails developer just getting started in their career and looking to get involved in the community, and it wouldn’t be possible without the enthusiasm and support of everyone at Le Wagon. Now, the search for our emcees begins. Le Wagon alumni who have graduated in the past year are invited to apply- details shared in the Le Wagon alumni internal Slack."
