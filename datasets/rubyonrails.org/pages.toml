["https://rubyonrails.org/2015/10/2/this-week-in-rails-job-priorities-fast-failing-tests-and-fixtures-oh-my"]
title = "Ruby on Rails — This week in Rails: Job Priorities, Fast Failing Tests and Fixtures... Oh My!"
description = "Hello everyone! This is Greg with help from Andy (welcome!) bringing you the latest news from Rails."
full_description = "33 people contributed to Rails this week, including 3 first-time contributors! If you are interested in becoming a contributor, have look on the issues list. This commit allows you to set the priority for your jobs with Active Job, if your backend supports this. For more details head over to the pull request. From now on you can set the model class in your fixture files, but set_fixture_class on your model will override it. This commit adds indexes to the inputs in the inner blocks of a nested fields_for, so Rails won’t raise an exception on the submission of the form. This commit fixes an issue with strong_parameters if you have a single collection_radio_button on your form and the form is submitted with no selection. With this commit the Action Controller parameters are sanitized before being passed to the Active Record query methods. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself."
