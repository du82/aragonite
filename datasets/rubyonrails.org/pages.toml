["https://rubyonrails.org/2015/7/11/this-week-in-rails-action-cable-collection-caching-and-more"]
title = "Ruby on Rails — This week in Rails: Action Cable, collection caching and more"
full_description = "Action Cable is out in wild as promised by DHH in his Railsconf keynote. There is flurry of activity happening with it right now. It’s still in alpha mode and will get production ready with Rails 5. Meet the 21 lovely people who contributed to Rails this week, the community can’t thank you all enough! Now we can explicitly specify collection caching using a special directive # Template Collection. The partials which do not start with <% cache do %> calls will get benefitted by this feature. Do you have nested params with same child key and different parent keys? Do you want to filter the child keys for only some of the parent keys? Now you can! Params can be filtered based on parent key using a simple config. Thanks to this fix, behavior of HWIA is now in sync with Ruby’s built-in Hash when a default_proc is set on the instance and it is duped. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
