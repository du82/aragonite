["https://rubyonrails.org/2024/2/5/rails-world-2024-cfp-is-open"]
title = "Ruby on Rails — Apply to speak at Rails World 2024 in Toronto - CFP open until March 21"
description = "The Rails World 2024 Call for Papers is now open. Here’s an overview of what kind of talks we are looking for, what’s new this year, and how to submit."
full_description = "The Rails World 2024 Call for Papers is now open. Here’s an overview of what kind of talks we are looking for, what’s new this year, and how to submit. Rails World takes place on September 26 & 27, 2024 at Evergreen Brickworks in Toronto, Canada, and we are expecting 1,000 attendees. This year there will be 24 talks and keynotes across two tracks. Preference will be for technical talks with concrete takeaways, and original talks that will be presented for the first time at Rails World 2024. This CFP will remain open until March 21, and we aim to inform all applicants if they are accepted (or not) before tickets are released. Rails is stronger than ever thanks to continued progress in both core frameworks, like Active Record and Action Mailbox, as well as associated tools and frameworks, like Hotwire, Kredis, and Propshaft. We will also be on the lookout for talks that align Rails with emerging or important current trends in our industry right now, such as security, PWAs, observability, monitoring, accessibility, LLMs, or the move from microservices back to monoliths, to name a few. We encourage you to submit proposals that challenge the status quo, showcase forward-thinking ideas, and push the boundaries of what’s possible with Rails. We want the experience of speaking at Rails World to be one of the best and most inviting in the industry. Thanks to Fullscript, we are able to offer each speaker a $400 USD travel stipend to offset the cost of travel to Toronto in addition to the below benefits. Their sponsorship will also cover the speaker dinner and the on-site speaker lounge to help you prep for your talk. Work by the Rails Foundation is funded by the support of the foundation’s Core and Contributing members: Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals, AppSignal, BigBinary, Cedarcode, Planet Argon, and Renuo."
