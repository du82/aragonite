["https://rubyonrails.org/2023/9/18/rails-foundation-seeks-freelance-ux-designer-and-technical-writer"]
title = "Ruby on Rails — Rails Foundation Seeks Freelance UX Designer and Technical Writer"
description = "One of the primary goals of the Rails Foundation is to improve the Rails documentation for both new and existing users. We have a lot of ideas about how to achieve this, and we are now ready to start tackling this with the help of an experienced UX designer and a technical writer (or two) with a strong Rails background."
full_description = "One of the primary goals of the Rails Foundation is to improve the Rails documentation for both new and existing users. We have a lot of ideas about how to achieve this, and we are now ready to start tackling this with the help of an experienced UX designer and a technical writer (or two) with a strong Rails background. These two roles will have a lot of opportunity for cross-collaboration to find (and close) gaps in the current content. Both roles will also work closely with members of the Rails Core and Issues team as well as volunteers from the Rails community to understand the needs and pain points of Rails users. So: are you passionate about UX design? Do you have a knack for simplifying complex information? Are you a long-time fan/user of Rails? If so, read on. The focus of this role will be on improving the user experience of our existing online resources and helping the technical writers organize information in a logical and user-friendly manner. We have a number of small projects on both the marketing and documentation sections of rubyonrails.org that need the attention of an experienced UX designer, and we are willing to take our time to find the right person. While this is not a full-time role, we would like this person to become our go to UX designer on an ongoing, per-project basis, so we will start small. We will discuss the greater picture and our ideas, as well as possible beginning projects with the right candidates. To apply for the freelance UX designer position, please submit your resume, portfolio, and a brief cover letter explaining your interest and relevant experience. We will review applications on a rolling basis until Oct 15, 2023. As this is a freelance role, your proven experience will drive our decision. Shortlisted applicants will be invited for a call where we can answer any questions you have, and discuss potential start projects and timelines so that you can deliver a proposal and give an indication of your rates. We are looking for one or two technical writers that we can work with on a regular basis to update the documentation and guides, create tutorials, draft social posts, and write use cases for rubyonrails.org. You’ll work closely with the UX designer to create space for a learning path for new Rails users, and ensure that the Rails documentation is informative, engaging, user-centric, and easy to find."
