["https://rubyonrails.org/2024/12/17/introducing-new-docs-landing-page"]
title = "Ruby on Rails — Introducing the new Docs landing page"
description = "Last week, we published a bunch of new and updated resources to help you learn Rails and learn how companies leverage Rails to build successful businesses. But we also made a few structural and navigational changes to the website that you may not have noticed (yet)."
full_description = "Last week, we published a bunch of new and updated resources to help you learn Rails and learn how companies leverage Rails to build successful businesses. But we also made a few structural and navigational changes to the website that you may not have noticed (yet). We were excited that all this was coming, but the navbar was already quite crowded…where were all these new resources going to live? Introducing Docs, the friendly new starting point for everything you need to install Rails, learn it, get better at it, and get involved. From one convenient page, you can now access the following: Installation Guide, Tutorials, Guides, API Docs, Case Studies, the Forum, and the Contributing Guide. These changes aim to make the Rails website more welcoming and friendly-to-navigate for beginners, while helping you, as a more experienced Rails dev, find what you need quickly. This (re)structure also gives the Rails Foundation a clear home for future tutorials and case studies, so expect more of those released next year. The Docs landing page was designed and shipped by John Athayde with feedback and direction from the Rails Core, Issues, and Committers teams, and made possible by the support of the members of the Rails Foundation. Thank you to everyone involved for your input!"
