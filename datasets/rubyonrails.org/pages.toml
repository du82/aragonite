["https://rubyonrails.org/2025/1/10/saeloun-joins-rails-foundation"]
title = "Ruby on Rails — Saeloun joins the Rails Foundation as a Contributing member"
description = "Happy new year everyone! The Rails Foundation is kicking off the year with great news: Saeloun has joined the Rails Foundation as its newest Contributing member!"
full_description = "Happy new year everyone! The Rails Foundation is kicking off the year with great news: Saeloun has joined the Rails Foundation as its newest Contributing member! Saeloun is a Ruby on Rails consulting agency, based out of Boston, MA, and Pune, India. The team helps lead and grow startups and large corporations such as HaulHub and Methodology, helping with full stack Rails development, Rails upgrades, maintenance, scaling and performance, and helping companies implement AI solutions with their Rails apps. Saeloun is joining the Rails Foundation after years of actively making contributions to both the framework and the community. In fact, you might recognize two Saeloun names - CEO Vipul A M, and Lead Software Developer Akhil G Krishnan - from the Rails Issues team, where they help the Core and Committer teams triage issues. Both are also in the top 85 contributors to the Rails framework, along with other Saeloun engineers on the full list. Saeloun helps run the Pune Ruby Meetup, React Pune Meetup, and they sponsor numerous Ruby events and conferences including Rails Girls, Ruby Conf India and Rails World 2025. They also help document the latest Rails and Ruby features and updates on both the Saeloun blog and the This Week in Rails newsletter, where Vipul is a regular contributor. While working with the Rails Newsletter team and Rails Docs/Triage team, I get a front row seat to see the amount of work that the Foundation has done and keeps shipping every day! I have worked or have been contributing to the Rails ecosystem for more than a decade. But these last two years, I can clearly see the immense effects the Foundation has had in pushing Rails, with the documentation, marketing, and various events it hosts. Growth of Rails as a framework and its community helps Saeloun greatly, and being part of the Foundation helps us be part of this growth in a small way. We have for the past decade and will continue to be ALL-IN with Rails! Vipul A M, Saeloun CEO Saeloun joins a growing list of members who support the Rails Foundation mission: Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, 1Password, and 37signals, and Contributing members AppSignal, BigBinary, Cedarcode, Gusto, makandra, Planet Argon, Renuo, and TableCheck."
