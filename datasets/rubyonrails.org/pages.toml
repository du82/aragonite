["https://rubyonrails.org/2015/4/18/this-week-in-rails-ruby-2-2-2-railsconf-and-more"]
title = "Ruby on Rails — This week in Rails: Ruby 2.2.2, RailsConf and more!"
description = "Hey reader, Kasper here."
full_description = "But before the Rails juice, a quick story spruce: At my company we have a coworker we look up to, because she’s doing a cross country trek. This week 42 people helped Rails out. Rails 5 comes closer everyday and it’s only possible because of all your help. Keep it up and it’ll be the best version of Rails yet. Remember when we said alias_method_chain had been deprecated? Well, if the method being overriden called super, you’d be stuck in an infinite recursion - like that friend who didn’t graduate kindergarten. This week prepend became the successor Rails needs. And how is that possible? Well, I’m glad you kept reading, because Ruby 2.2.2 has a fix for prepend. The new version is mainly a security release - with some bug fixes squeezed in there - so no procrastinating the upgrade, okay? You want to be ready to hit the lab next week too. There’s a new default_form_builder method you can override in controllers. Then form_for and friends will use the passed builder class to architect the view. You’ve probably been prepending bin when running rake or rails like a good samaritan. Those are binstubs in action. But bin is for executables in general and not just those stubs. Not anymore, as Bundler reserves bin for binstubs and exe for executables. This week Railties executed that convention. A few of us are going to the big peach next week. So after you’ve seen DHH reveal the really big stuff coming in Rails 5, you can mingle with us at RailsConf. Both Godfrey and Claudio will be speaking. …and I guess I’m there too. Lastly, either pluck in a few of your friends’ emails here or ask Godfrey how you can get to write these things too."
