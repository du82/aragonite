["https://rubyonrails.org/docs/case-studies/doximity"]
title = "Ruby on Rails — Doximity Case Study - Fast, Flexible, and Scalable"
description = "Read how Rails has helped Doximity grow into the largest digital platform for U.S. medical professionals."
full_description = '''Doximity set out to help doctors save time and focus on what matters most: their patients. Over the past 15 years, they've built tools for communication, workflow, and telehealth that are now trusted by over two million healthcare professionals, including 80% of U.S. doctors. These tools make a real difference in the lives of both physicians and patients. But like many startups, Doximity began with a small team and a big challenge: how to build something fast enough to find its footing in the market. They chose to build on Rails because its speed, flexibility, and developer-friendly features were useful for Doximity's small team. The expressive syntax let them write clean, maintainable code quickly, while Rails' built-in conventions and rich ecosystem helped them launch features, gather feedback, and iterate rapidly. In Doximity's early days, Rails' focus on productivity allowed their developers to work quickly and efficiently. Rails allowed the Doximity team to prototype new features, test ideas, and respond to user feedback. Even with a small team, Rails' built-in testing tools made it easier to ensure code quality without the need for a dedicated QA team. The Doximity team also leans into Rails' "convention over configuration" philosophy, and Rails' familiar Model-View-Controller (MVC) structure makes onboarding new engineers as smooth as possible. With over 150 developers across a wide array of teams pushing code to production 80+ times a day, this consistency ensures systems stay easy to understand and scale. Developers can jump in, make an impact, and keep moving forward. The ability to experiment and iterate quickly paid off. What started as an initial 2010 Rails prototype app grew into the leading digital platform for U.S. medical professionals. When the pandemic hit in early 2020, doctors and healthcare professionals were forced to shift to remote care solutions. One of Doximity's standout patient-facing tools is Doximity Dialer, which lets doctors call or text patients from their own devices without exposing personal phone numbers. Patients receive an SMS link from their doctor and, upon clicking, are instantly connected - no native app installation required.'''
