["https://rubyonrails.org/2006/11/26/1-2-new-in-activerecord"]
title = "Ruby on Rails — Rails 1.2 RC1: New in ActiveRecord"
description = "Here are some of the smaller yet notable features in the Rails 1.2 release of ActiveRecord made since the 1.1 release. (compiled by Josh Susser)."
full_description = "Here are some of the smaller yet notable features in the Rails 1.2 release of ActiveRecord made since the 1.1 release. (compiled by Josh Susser). Added simple hash conditions to #find that will just convert a hash to an equality/AND-based condition string. Example: Added find_or_initialize_by_X which works like find_or_create_by_X but doesn’t save the newly instantiated record. Allow :uniq => true with has_many :through associations. This is equivalent to doing a SELECT DISTINCT in SQL, but it is done in Ruby code instead. Add records to has_many :through using «, push, and concat by creating the join model record. Raise if base or associate are new records since both ids are required to create the association. #build raises an error since you can’t associate an unsaved record. #create! takes an attributes hash and creates both the associated record and its join model record in a transaction. Support for row-level locking, using either the :lock finder option or the #lock! method. See ActiveRecord::Locking::Pessimistic docs for details."
