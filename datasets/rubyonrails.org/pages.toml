["https://rubyonrails.org/2024/12/14/this-week-in-rails"]
title = "Ruby on Rails — New Rails Tutorial and Unpacked Videos, Releases, ActiveModel::Attributes::Normalization and more!"
description = "Hey everyone, Happy Saturday!"
full_description = "This week, the Rails Foundation released a series of updated resources to help you learn the new Rails 8 defaults, including a brand new Getting Started Tutorial, a 9-part video series on YouTube, and updated Rails Guides. Read the announcement here. The Installation Guide has also been decoupled so it is easier to find, and includes the basics of installing Ruby with a version manager - arguably one of the biggest barriers to newcomers. Rails Versions 7.0.8.7, 7.1.5.1, 7.2.2.1, and 8.0.0.1 have been released! These are security patches addressing one new issue where using the content_security_policy helper with untrusted user input could lead to a bypass of the browser Content Security Policy. Rails Version 8.0.1 has been released! A new minor release - 8.0.1, is also out! Head over the CHANGELOG, to check the full set of changes in this release. Doximity Case Study - Fast, Flexible, and Scalable We also have a new official case study in! Check out how Rails powers Doximity’s Healthcare Platform. Here are some Highlights from the study: Accept a block for ActiveJob::ConfiguredJob#perform_later This pull request adds support for accepting a block for ActiveJob::ConfiguredJob#perform_later. This was previously inconsistent with a regular ActiveJob::Base#perform_later. Fix if_exists/if_not_exists for foreign keys addition and removal This PR addresses a few improvements with foreign keys additions/removals and if_exists/if_not_exists: Changing column nullability does not change default function This Pull Requests fixes MySQL default functions getting dropped when changing a column’s nullability. Migrate ActiveRecord::Normalization to Active Model ActiveRecord::Normalization has now been moved to Active Model. This change backports ActiveRecord::Normalization to ActiveModel::Attributes::Normalization. With this change we can now use this feature in PORO with ActiveModel::Attributes::Normalization - Change ActionText::RichText#embeds assignment to before_validation Prior to this change, assignment to the embeds association happened after validation callbacks, so it wasn’t possible to incorporate Rich Text-related file validation."
