["https://rubyonrails.org/2024/8/7/matz-and-dhh-fireside-chat"]
title = "Ruby on Rails — Special Rails World session: Matz & DHH Fireside Chat"
description = "Hot on the heels of yesterday’s 7.2 announcement, we have more good news: the Rails World agenda is live, and we added a last-minute session to the program that we think you are going to love: Ruby creator Yukihiro “Matz” Matsumoto will join us at Rails World in Toronto as a special guest of Shopify and the Rails Foundation."
full_description = "Hot on the heels of yesterday’s 7.2 announcement, we have more good news: the Rails World agenda is live, and we added a last-minute session to the program that we think you are going to love: Ruby creator Yukihiro “Matz” Matsumoto will join us at Rails World in Toronto as a special guest of Shopify and the Rails Foundation. To close day one, Matz and DHH will share the stage for the very first time for a fireside chat about Ruby, Rails and all things open source. This special conversation will be moderated and hosted by Shopify founder and early Rails Core member Tobias Lütke. We are beyond excited that Matz has found time in his epic conference schedule to join us for this chat. This is definitely a session that you don’t want to miss! Check out the full Rails World agenda here, and don’t forget that Telos Labs is creating the Rails World app, so attendees will soon be able to build their personal schedule. Rails World takes place September 26 & 27, 2024 at Evergreen Brickworks in Toronto, Canada. It is currently sold out, but those wishing to join the waiting list can email world@rubyonrails.org, and we will see what we can do!"
