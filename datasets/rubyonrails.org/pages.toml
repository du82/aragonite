["https://rubyonrails.org/2024/12/27/this-week-in-rails"]
title = "Ruby on Rails — This year in Rails"
description = "This is Greg, Vipul, Wojciech, and Zzak, bringing you the summary of what happened with Rails in the past year. It was a busy year with close to 4000 commits from 555 contributors and 50 releases, including Rails 8!"
full_description = "This is Greg, Vipul, Wojciech, and Zzak, bringing you the summary of what happened with Rails in the past year. It was a busy year with close to 4000 commits from 555 contributors and 50 releases, including Rails 8! For this year end issue, as a team we each hand-picked some of our favorite pull requests from the year. 2024 Wrap Up from the Rails Foundation Amanda wrote a summary of what the Rails Foundation has been up to this year and what she is plannning for next year. Add default PWA manifest and service worker file Progressive Web Apps got a lot of support in Rails this year starting with freshly generated Rails apps now include a manifest and service worker file to become full-fledged Progressive Web Applications. Add allow_browser to set minimum versions for your application Now you can easily specify which browsers you’ve supported to allow access to your application. Add rate limiting to Action Controller via the Kredis limiter type Rails got a built in rate limiter this year. Originally it was dependent on Kredis, but it was quickly refactored to use the Rails cache store. Generate devcontainer files by default This change generates a .devcontainer folder and its contents when creating a new app. The .devcontainer folder includes everything needed to boot the app and do development in a remote container. These files can be skipped using the --skip-devcontainer option. Add customized prompt for Rails console Rails console now indicates the current Rails environment with the name and color (red for production). Add Kamal by default to Rails 8 This PR adds Kamal for deployment by default, which includes generating a Rails-specific config/deploy.yml. This can be skipped using --skip-kamal. Check out more about Kamal on its official site. Change asset pipeline default to Propshaft in Rails 8 Sprockets has served us well, but it’s time to hand over the torch to Propshaft in Rails 8. Add a basic sessions generator This change adds a new sessions generator to give a basic start to an authentication system using database-tracked sessions."
