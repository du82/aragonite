title = "Ruby on Rails — Rails Соглашение"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "Феноменальная популярность Ruby on Rails в значительной степени обусловлена переходом к новым трендам и технологиям в нужный момент времени. Но, к сожалению, технические преимущества с течением времени становятся не актуальными. Поэтому необходимо подробное объяснение того, каким образом RoR не только продолжает оставаться актуальным, но расширяет свое влияние и сообщество. Мое предположение, что несокрушимым фактором было и остается его противоречивое соглашение. Соглашение активно развивалось последние десять лет, но большая часть основных идей осталась не тронута. Я не претендую на некую фундаментальную уникальность этих идей. Главное достижение Rails — это объединение вокруг себя сильного сообщества людей с нестандартным подходом и мировоззрением о природе программирования и программистах. Итак, вот девять самых важных столпов Rails-соглашения и того, как их воспринимает ваш покорный слуга: Ruby on Rails не существовало бы без Ruby, поэтому логично, что первый столп соглашения появился из самих истоков Ruby. Ruby возвеличивает удовольствие от разработки на пьедестал в отличие от многих других языков программирования."
