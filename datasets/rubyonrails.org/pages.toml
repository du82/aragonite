["https://rubyonrails.org/2024/2/27/rails-foundation-doximity-sponsor-rails-girls-sao-paolo"]
title = "Ruby on Rails — Rails Foundation and Doximity to Sponsor Rails Girls São Paulo 2024"
description = "(Portuguese below)"
full_description = "The Rails Foundation and Doximity are teaming up with Rails Girls São Paulo and Tropical.rb to co-host the return of the Rails Girls São Paulo in 2024. Scheduled for the weekend following Tropical.rb, Rails Girls São Paulo aims to bring together 30 individuals in teams of 6, each guided by dedicated Portuguese-speaking mentors, for a weekend of learning, coding, and community building. Rails Girls took place regularly in São Paulo from 2015 to 2019, introducing nearly 300 local students to Rails in that time. Inspired by the current momentum in the Rails community and the return of Tropical.rb in Brazil, the event is back with a new format targeting women who already have a basic knowledge of Rails and wish to enhance their skills even further to evolve in their careers. The aim is to organize two Rails Girls events per year in Brazil. Education is an important part of the Rails Foundation mission, and one way to further that mission is by supporting organizations like Rails Girls São Paulo and Tropical.rb who do fantastic work promoting Rails and introducing Rails to new audiences around the world. Doximity was the perfect co-host for this event. In addition to being a Core member of the Rails Foundation, they have a strong company culture of mentorship and a team of developers based in Brazil who can stand in as mentors during this edition of Rails Girls. For more information about the Rails Girls São Paulo event and to register, please visit railsgirls.com.br. A Rails Foundation e a Doximity estão se unindo ao Rails Girls São Paulo e ao Tropical.rb para co-organizar a volta do Rails Girls São Paulo em 2024. No sábado seguinte ao Tropical.rb, o Rails Girls São Paulo visa reunir 30 estudantes em equipes de 6, cada uma orientada por mentores dedicados que falam português, para um fim de semana de aprendizado, programação e fortalecimento da comunidade. As edições do Rails Girls São Paulo ocorreram de 2015 à 2019, introduzindo quase 300 estudantes locais ao Rails nesse período. Inspirada pela atual euforia na comunidade Rails e pelo retorno do Tropical.rb no Brasil, o evento está de volta com um novo formato voltado para mulheres que já possuem conhecimento básico em Rails e desejam aprimorar ainda mais suas habilidades e evoluir em suas carreiras. O objetivo é organizar dois eventos Rails Girls por ano no Brasil."
