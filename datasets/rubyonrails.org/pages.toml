["https://rubyonrails.org/2024/7/15/launch-your-podcast-at-rails-world"]
title = "Ruby on Rails — Launch your podcast at Rails World with Buzzsprout"
description = "The Rails Foundation has exciting news: After last year’s success Buzzsprout is once again sponsoring the Rails World Podcast program - only this year we are adding a fun new element."
full_description = "The Rails Foundation has exciting news: After last year’s success Buzzsprout is once again sponsoring the Rails World Podcast program - only this year we are adding a fun new element. If you’ve always wanted to have your own podcast, now is the time. Buzzsprout, the world’s largest premium podcast hosting platform built on Rails, wants to help you one lucky would-be podcaster launch their podcast at Rails World. With 1,000 attendees from around the world, and a lineup of some of our industry’s best speakers, it is a unique opportunity for podcasters to meet, interview, and connect with other community members at Rails World - all under one roof. Existing podcasts, we also have you covered. Apply below for the regular podcast program. Podcasts chosen this year will have access to a dedicated, podcast recording booth at Rails World where they can record episodes of their podcast with Rails World speakers or attendees. Selected podcast hosts will receive one ticket to Rails World, and the podcasters agree to record at least one episode on site including a shout-out highlighting Buzzsprout as a sponsor. If you’re interested in applying for the Podcast program- either as a new or existing podcast, please fill out this form by July 31. The selected podcasts will be contacted on or before August 7, 2023."
