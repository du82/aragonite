["https://rubyonrails.org/2005/11/6/liquid-templates-announced"]
title = "Ruby on Rails — Liquid templates announced"
description = "Liquid is a brand new template engine optimized for xhtml and emails. It features a very clean syntax and speedy execution speeds. The main difference to traditional ERb is that it does not rely on eval. This means that no potentially harmful code is executed when a Liquid template is compiled or rendered.The chief advantage is that you can let your users change templates without having to worry about your data’s security. The templates only see data which you export to them. In Shopify for example you will be able to edit your shop’s templates and emails directly in the admin interface. The templates are stored in the database and rendered directly from it.Liquid is packaged as a rails plugin for easy installation. In good rails style there is a small movie available showing how to install and use it."
