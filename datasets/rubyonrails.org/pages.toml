["https://rubyonrails.org/2023/10/2/renuo-joins-rails-foundation-as-contributing-member"]
title = "Ruby on Rails — Renuo joins Rails Foundation as a Contributing member"
description = "We are happy to give a warm welcome to Renuo, the latest Contributing member to join the Rails Foundation."
full_description = "We are happy to give a warm welcome to Renuo, the latest Contributing member to join the Rails Foundation. Renuo is a web agency based in Zurich, Switzerland, that has worked with Ruby on Rails since its foundation in 2011, focusing mostly on the Swiss market. They are the first Swiss company to join the Rails Foundation, and we are excited to have them! With solid roots in open source, Renuo has a company culture focused on giving back to the open-source community. They support events such as the Railshöck meetup in Zürich and Helvetic Ruby, and several Renuo employees teach at Le Wagon’s coding bootcamp. They also donate 10% of their annual profit to charities and open-source projects, all of which the company decides on together. In addition to the financial support of numerous projects each year, Renuo also maintains well-known libraries such as cancancan. A lot of their own work, their internal workflow, and their Applications Setup Guide are also open-sourced. This commitment to open source is also what inspired them to become a member of the Rails Foundation. We want to contribute to the longevity of Rails. Every day, a new project is bootstrapped using Ruby On Rails, and we’d like to provide a more basic angle to the future development of Rails. We come from a small agency’s point of view and want to influence the formal and cultural groundwork as a small player. We also feel strongly about education. Our vision? To see Ruby on Rails in universities. Alessandro Rodi, Software Engineer & Partner For these reasons and more, we are excited to work with Renuo. With solid ideals, a deep appreciation for open source, and a desire to see Rails continue to flourish, they are a perfect addition to the foundation, and we look forward to their input on the foundation’s mission moving forward. Renuo joins the Rails Foundation Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals, and Contributing members AppSignal, BigBinary, Cedarcode, and Planet Argon."
