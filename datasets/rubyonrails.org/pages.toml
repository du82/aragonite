["https://rubyonrails.org/2015/4/25/this-week-in-rails-railsconf-2015-edition"]
title = "Ruby on Rails — This week in Rails: RailsConf 2015 Edition"
description = "ZOMG! Hello everyone, it is Godfrey here (it’s been a while!), delivering the latest news from Rails to your inbox. This happens to be RailsConf week, so we have lots to cover; lets get to it!"
full_description = "ZOMG! Hello everyone, it is Godfrey here (it’s been a while!), delivering the latest news from Rails to your inbox. This happens to be RailsConf week, so we have lots to cover; lets get to it! Note: The links to the RailsConf videos are the unedited live-stream versions, and they might be removed later. Also, only talks from the keynote room are available at the moment, but don’t worry – the full set of talks will eventually be made available to everyone. Follow @railsconf to stay in the loop! David Heinemeier Hansson kicked off the conference by announcing a few new features in Rails 5: Rails API, turbolinks 3, a native mobile wrapper and web sockets support (a.k.a. Action Cable). Check the schedule for a full list of talks from Room 202. Shameless plug: yours truly gave a talk following the DHH keynote ;) Aaron Patterson started the second day with a punishing amount of word play jokes. In between trolling other keynote speakers and rebooting his computer, he also dropped an incredible amount of performance knowledge. The Ruby heroes awards were given on the third day, followed by a panel discussion featuring some members from the Rails core team. Kent Beck, aka the creator of XP (not to be confused with the other XP) wrapped up the conference with a focus on the human elements of programming. Just because it is Rails Conf, it doesn’t mean contributions to the Rails codebase will see any slow down. In fact, 37 contributors made their mark on Rails this week, with 11 first-time contributors! As mentioned in David’s keynote, Rails API will be part of Rails 5. Follow the pull request to track the progress and chime in on the discussion. (Please avoid leaving +1 comments!) Joining the existing bug report templates, this new template will be handy for reproducing small bugs with a minimal setup. Check the contributing guide for details. With this patch, you can easily check if a single attribute has previously changed and react to those changes appropriately."
