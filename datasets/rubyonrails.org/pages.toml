["https://rubyonrails.org/2015/8/15/this-week-in-rails-rails-4-2-4-rc1-4-1-13-rc1-and-more"]
title = "Ruby on Rails — This week in Rails: Rails 4.2.4 RC1, 4.1.13 RC1 and more!"
description = "Hello Everyone! This is Roque bringing the latest from Rails with some help from Kasper."
full_description = "We had 36 awesome contributors to the Rails codebase this week. Check out the active issues over on GitHub if you’d like to see your name here. There’s new release candidates, please try them and report any regressions you find, so that the Rails team can fix them before the final release. This week Active Record got a new method that works like find_in_batches but yields relations instead of arrays. It also added a cool delegation API that lets you do something like: This patch allows new locale YAML files to be loaded without having to restart the Rails server. It also reloads the available locales when files are deleted. As usage for XML serialization declined, it’s become less of a core concern of Rails. In Rails 5, this feature will be moved to the activemodel-serializers-xml gem. If you’re still using the XML Serialization feature in your app, you will need to add this to your Gemfile when you upgrade. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
