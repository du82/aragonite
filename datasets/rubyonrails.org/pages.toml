["https://rubyonrails.org/2015/4/11/this-week-in-rails-batch-touching-default-controller-response-and-more"]
title = "Ruby on Rails — This week in Rails: batch touching, default controller response and more!"
description = "Hey there, this is Washington. It’s finally Friday again!!!"
full_description = "A lot of bug fixing and a couple great improvements going on the Rails environment this week. Read on for more details. 31 contributors have helped improve Rails this week. Consider taking some time next week to make a contribution to an open-source project :) (I keep telling that to myself every day) YAY! I bet many projects have been looking forward to this improvement. After a couple discussions and experiments touching is finally limited to the fewest possible number of queries. After all these years DHH is still pushing for better defaults on Rails. Next major version will assume everything went fine if a controller action has no template. I can’t see why not. We are a few months into 2015, but these encoding-related problems are still haunting us! With this fix, Windows apps will stop blowing up on strange URLs. Yet another example of how awesome the Ruby and Rails community can be. An apparently nice performance improvement has caused a regression on the callback system. Plus according to new benchmarks it seems the original performance improvement is no longer relevant. I haven’t seen much noise about this vulnerability on the interwebs but just in case. If you have this markdown parser on any of your projects you should probably bump it whenever you have a chance. That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
