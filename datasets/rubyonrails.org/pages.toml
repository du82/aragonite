["https://rubyonrails.org/2015/10/16/this-week-in-rails-4000-subscribers-file-server-headers-config-and-more"]
title = "Ruby on Rails — This week in Rails: 4000 Subscribers, File Server Headers Config and More!"
full_description = "This Week in Rails just crossed 4000 subscribers. Thanks to all subscribers and collaborators! Stay tuned! 26 people contributed to Rails this week, including 5 first-time contributors! If you are interested in becoming a contributor, you can have a look at the issues list. Rails now allows any static file header to be defined using the configuration option config.public_file_server.headers. This also deprecates the former option static_cache_control that would only apply the header Cache-Control. The config.force_ssl option will now force mails to use the protocol https for the host setup in config.action_mailer.default_url_options. Lets say your application has multiple root endpoints depending on a constraint. You can now describe them using root entries in your config/routes.rb file instead of having to use get statements. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself."
