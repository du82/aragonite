full_description = "The Rails Foundation is excited to announce Rails World, our first conference. It will take place on October 5 & 6 in the stunning city of Amsterdam, Netherlands. Rails World is a two-day conference featuring technical talks, demos, workshops, networking, and keynotes. You’ll hear from the creators and maintainers of Rails on the latest features and best practices in Rails development. With Rails World, our goal is to create a fun and affordable space for the Rails ecosystem to connect, learn, and build lasting professional relationships. A limited number of Early bird tickets for Rails World will start at just €199. After that, General Admission tickets will be €299. With just 650 tickets available in total for the first Rails World, we expect them to sell out quickly. So make sure to book your ticket early if you intend to go! This super accessible price is made possible by the financial support of our foundation Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals, as well as our Contributing members Cedarcode and Planet Argon, and of course the support of Rails World sponsors who join us. Rails World is not meant to make a profit for the Rails Foundation; we are happy to organize this at a loss so that ticket prices stay affordable. Whether you’re a seasoned Rails developer or just starting out, join hundreds of other developers who share your passion for Rails at the first ever Rails World, and become part of the rich history and ongoing evolution of Ruby on Rails."
