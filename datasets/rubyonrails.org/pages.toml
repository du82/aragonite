["https://rubyonrails.org/2015/1/31/This-week-in-Rails-Relation-or-file-fixtures-kwargs-and-more"]
title = "Ruby on Rails — This week in Rails: Relation#or, file fixtures, kwargs and more!"
description = "It is that time of the week again!"
full_description = "A long waited feature is added to Active Record and from now on you can combine two Active Record relations with the or operator. With this addition to ActiveSupport::Testing there is no need to write custom helpers for testing features requiring a sample file (i.e. file uploads). Support for keyword arguments is added to the HTTP methods of the controller tests. An example of the new syntax: delegate turned out to be a bottleneck at the URL generation in the integration tests. With this patch the integration tests of the applications should have a speedup. The *_via_redirect methods are deprecated but do not fear, you can use follow_redirect! in your test suite for the same behaviour. That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
