["https://rubyonrails.org/2015/5/10/this-week-in-rails-job-ids-inline-images-preview-and-more"]
title = "Ruby on Rails — This week in Rails: Job IDs, inline images preview and more"
description = "Hi there!! Washington here again."
full_description = "Glad we all made to another Friday. A lot of small patches around Rails repository this week. So we had another relatively calm week after the major announcements on RailsConf. The talks list is getting bigger on confreaks by the way. You might want to watch some of those this weekend. 38 people made it to the Rails repository this week. Check out the pulse page on github too for the full list of recent issues and PRs. ActiveJob will be able to report the original adapter job ID in Rails 5. The patch started targeting Delayed Job then Sidekiq and Que got their own about a week later. Great team work. This commit adds a preview interceptor to search for inline cid: urls in src attributes and convert them to data urls. P.S. I had to look up the cid protocol myself to get this one. Rails is moving towards deprecating the assigns helper on controller tests. The main motivation is that it’s asserting against the internals of the implementation which we shouldn’t care about in a unit test. Quite interesting patch on improving the set up for database connection pools. The schema cache dump will now be applied to every connection as they are created to avoid querying the database for its schema. That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
