["https://rubyonrails.org/2024/11/15/this-week-in-rails"]
title = "Ruby on Rails — Rails 8 demo, Rails World re-edited videos, NotificationAssertions and more!"
description = "Hey everyone, Happy Friday!"
full_description = "Rails 8: The Demo In case you missed it, Rails 8 was released last week. A new demo from DHH is now up Rails 8: The Demo showcasing its usage. The video covers getting started with Rails 8 by building a basic blog, adding a WYSIWYG editor, putting it behind authentication, making it available as PWA, and deploying to production. In just 30 minutes! Rails World re-edited videos! All Rails World videos have been re-edited and are up on YouTube! They also now have Japanese, Brazilian Portuguese, and Spanish subtitles thanks to Happy Scribe (a transcription platform built on Rails). Add ActiveSupport::Testing::NotificationAssertions test helper module With this addition, we can now use various test helper methods for notification assertions: Put back the quiet assets config in development This config was removed during Sprockets removal. It is still supported by propshaft and without this config the terminal is cluttered with assets request log. This change bring back this config to silence these logs in development by default. Allow path regex in SilenceRequest middleware Rails::Rack::SilenceRequest middleware now supports regex in path filtering. For example Allow hidden_field(_tag) to accept a custom autocomplete value Previously a change introduced an enforced autocomplete=”off” to all hidden inputs generated by Rails to fix a Firefox bug. But it’s also a legitimate use-case to specify an autocomplete with a value such as username and a value on a hidden input. This hints to the browser that (in this example) the username of a password reset form is what we’ve provided as the value and the password manager can store it as such. Parallel tests with :number_of_processors uses cgroups-aware usable processor count Parallel tests with :number_of_processors uses cgroups-aware usable processor count, which is now correctly available for use via Concurrent.available_processor_count. Ensure normalized attribute queries are consistent for nil and normalized nil This change ensures that normalized attribute queries are consistent for nil and normalized nil. Ex:"
