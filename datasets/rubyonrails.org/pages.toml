["https://rubyonrails.org/2024/8/1/building-the-rails-world-app-with-telos-labs"]
title = "Ruby on Rails — Building the Rails World app with Telos Labs"
description = "Rails World 2024 (Sept 26 & 27, Toronto) is just around the corner, and we have a lot of news to share with you in the coming days, including speaker updates, sponsor news, and a little bit of what to expect while on site."
full_description = "Rails World 2024 (Sept 26 & 27, Toronto) is just around the corner, and we have a lot of news to share with you in the coming days, including speaker updates, sponsor news, and a little bit of what to expect while on site. Telos Labs stepped up this year and offered to build the Rails World 2024 app, and development is already underway. The app will have all the features you need in an event app, including an overview of the conference agenda, the ability to create your own personal agenda, notifications when a session is about to begin, and a personal profile with your bio and social links. This initiative is particularly special because Telos Labs is not just building the app for this edition of Rails World - in the spirit of Ruby and Rails, they are open-sourcing it and gifting it to the entire community. Any of the (many!) events in the Ruby space are invited to use this app at their own events and improve on it for years to come. We hope it can also serve as a great starter project for junior developers looking to get involved in open source. Telos Labs is sticking to the Rails way in their development process, creating a PWA using a full-stack pattern with Stimulus, Turbo, Solid Queue, and Kamal for deployments. Where possible, dependencies will also be built on Rails, with AvoHQ for the admin dashboard, MailPace for transactional emails, and AppSignal for monitoring (AppSignal is a Platinum sponsor again at Rails World this year, and they have generously provided free monitoring for this project). For the next few weeks, they will be building in public and you are invited to follow along as things progress. Even if you are not attending Rails World this year, we’d love your feedback and suggestions."
