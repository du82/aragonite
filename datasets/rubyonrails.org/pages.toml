["https://rubyonrails.org/2015/7/31/this-week-in-rails-wildcard-template-dependencies-and-more-performance"]
title = "Ruby on Rails — This week in Rails: wildcard template dependencies and more performance!"
description = "Happy Friday Everyone!"
full_description = "This is Greg with the latest news about Rails. We had a quiet week so this issue will be a short one. This week 23 awesome people helped to make Rails even better. If you are interested in becoming a contributor, you can have a look at the issues list. This pull requests adds an --api option in order to generate plugins that can be added inside API applications. By reducing the number of object allocations, this giant patch helps reduce memory usage and also brings you some significant speed improvement (as a benchmark, codetriage.com ran about 10% faster). That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
