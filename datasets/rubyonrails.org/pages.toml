["https://rubyonrails.org/2024/8/30/shopify-as-rails-world-toronto-city-host"]
title = "Ruby on Rails — Shopify is the official Toronto City Host for Rails World 2024"
description = "Once we announced Toronto as this year’s Rails World 2024 location, Shopify had one wish: that everyone attending Rails World would experience the best of what their city has to offer, before, during, and to close out the event. With the event taking place in their backyard, it was only fitting that they become the official Toronto Rails World City Host."
full_description = "Once we announced Toronto as this year’s Rails World 2024 location, Shopify had one wish: that everyone attending Rails World would experience the best of what their city has to offer, before, during, and to close out the event. With the event taking place in their backyard, it was only fitting that they become the official Toronto Rails World City Host. What does it mean to be the official City Host? It means that Shopify is going above and beyond to make this an unforgettable Rails World for you. Pre-Registration, September 25th - If you are already in town on the 25th, grab your badge early, have a welcome drink courtesy of Shopify, and meet up with other Rails World attendees. From here you can go out and explore Toronto’s Yorkville neighborhood just steps away. WNB.rb Meetup, September 25th - Shopify is also proud to sponsor the WNB.rb meetup, an event dedicated to supporting women and non-binary individuals in the Ruby community. For this meetup, Shopify is inviting WNB.rb members to the 14th floor of the Shopify port for a drink, a bite, and to connect with other women and non-binary Rails World attendees before we officially kick off. (Just wait until you see the views up there!) The Shopify Lounge & Rails merch store - In the Shopify Lounge at Rails World you’ll find the Shopify booth, pair programming, and plenty of additional space to hang out, grab a snack, and recharge. In the booth, you can meet with the Shopify Engineering team, or dive deep into technical problem solving at one of their four pair programming stations. Rails World attendees will also find the Rails merch store in the Shopify Lounge (since after all, the store is built on Shopify with the help of their Launch Engineering team). You’ll be the first to check out the merch before the store goes live to the public later this year. Lightning Track - Shopify is hosting the first-ever Rails World Lightning Track featuring 5-10 minute talks from Rails World attendees on a variety of topics. If you have an idea for a talk, keep an eye out for our Call for Proposals (CFP), opening soon."
