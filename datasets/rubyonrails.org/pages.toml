["https://rubyonrails.org/2022/11/14/the-rails-foundation"]
title = "Ruby on Rails — The Rails Foundation kicks off with one million dollars"
description = "Today, we are excited to announce the launch of The Rails Foundation. Its mission is to improve the documentation, education, marketing, and events in our ecosystem to the benefit of all new and existing Rails developers. It’s been started by some of the most important companies involved with Rails, and will work to ensure a prosperous ecosystem that continues to improve, and becomes even more attractive to newcomers going forward."
full_description = "Today, we are excited to announce the launch of The Rails Foundation. Its mission is to improve the documentation, education, marketing, and events in our ecosystem to the benefit of all new and existing Rails developers. It’s been started by some of the most important companies involved with Rails, and will work to ensure a prosperous ecosystem that continues to improve, and becomes even more attractive to newcomers going forward. It’s been over 18 years since Ruby on Rails was first released, and since then, an incredible ecosystem has emerged around it. Millions of applications have been built using Rails by hundreds of thousands of happy developers over the years. Companies have gone all the way from HELLO WORLD to IPO using Rails, creating billions of dollars in value along the way. It’s been a glorious run, and we’re still going! On the technical side, we’ve also never stood stronger than we do with Rails 7. The Rails Core Team, together with thousands of contributors, have steered us forward with fixes, enhancements, and improvements in release after release. The code we all depend on is in great condition and under great care. But after all these years, it’s also become clear that building a strong ecosystem depends on more than just great code. There have never been more options for new web developers than there are today, and if we want to continue to celebrate the success of Rails in another two decades from now, we need to make the best case possible for why someone should come join us. The reason for that is largely a question of documentation, education, marketing, and events. It’s not nearly easy enough for a developer interested in learning Rails to find their way through decades of often outdated books, blog posts, and screencasts, connect with others learning at the same time, make the case to coworkers or bosses why Rails is the right choice, or meet up with fellow practitioners at events solely dedicated to Rails. In alphabetical order, the eight founding core members of The Rails Foundation are: Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals. These corporate members have together generously endowed the foundation with $1,000,000 USD in seed funding to make a real difference on all the aforementioned areas of improvement."
