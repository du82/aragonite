["https://rubyonrails.org/2023/12/27/reflecting-on-2023"]
title = "Ruby on Rails — Reflecting on 2023: Rails Foundation's Inaugural Year"
description = "As 2023 winds to a close, it’s time to reflect on the first year of the Rails Foundation. Work on the mission began in earnest in February, and we accomplished a great deal these past ten months."
full_description = "As 2023 winds to a close, it’s time to reflect on the first year of the Rails Foundation. Work on the mission began in earnest in February, and we accomplished a great deal these past ten months. And still, many times throughout the year - when it felt like things weren’t moving fast enough - we had to remind ourselves that this is Year One. This is not a sprint to accomplish everything in the first year, nor is it a marathon with a finish line in sight. We are laying groundwork, having discussions, and setting up initiatives that are intended to see Rails and the Rails community through the coming decades. And after 20 solid years, Rails isn’t going anywhere. So we can take a moment to appreciate what we have built so far before we launch into another year of driving our mission to support the Rails community through improved documentation, education, marketing, and events. Here is a look back on the initiatives we set up in 2023 in support of that mission. This is only the beginning. The first edition of Rails World took place in Amsterdam this October, where we welcomed 700 attendees, 21 sponsors, and 30 speakers to two days of keynotes, talks, and workshops. Launched for the 20th anniversary of the Rails framework, Rails World packed a lot into two days: we saw the much-anticipated release of Rails 7.1, the introduction and immediate availability of Solid Cache, Strada, Kamal 1.0, previews of Turbo 8, Solid Queue, and Mission Control, a Rails Core AMA with ten of the current 12 Core team members, and a birthday celebration marking 20 years of Rails. We also launched a financial sponsor pairing program, which meant that 7 extra attendees were able to attend who might otherwise not have had the opportunity, and we welcomed a handful of volunteers to Amsterdam who helped make the event a success. Rails World will continue to be tech-forward and future-thinking - the best conference to attend for the latest features and best practices in Rails development. We hope you can join us next year in Toronto Sept 26 & 27, 2024. If your company is interested in sponsoring, now is the time to get in touch."
year_published = 2025
