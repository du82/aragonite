["https://rubyonrails.org/2024/11/22/this-week-in-rails"]
title = "Ruby on Rails — Active Support's NotificationAssertions and `sql.active_record` gets `affected_rows`"
description = "Hi, it’s zzak. Let’s explore this week’s changes in the Rails codebase."
full_description = 'Add Active Support Notifications test helper module This PR has been created because it’s currently cumbersome to test that a certain code block/action triggers an ActiveSupport::Notifications::Event to be emitted. It would be ideal to have some helpers to assert against such event emission. Have heard such helpers could be helpful internal to Rails as well. Add “affected_rows” to “sql.active_record” event The recently added row_count value is very useful for identifying cases where a query would return a large result set as large results can end up using a lot of memory or even be blocked by databases like Vitess. However, somewhere that row_count falls short is for queries that do not necessarily return their results back to the client. These queries that affect too many rows can lead to their own set of problems, such as overwhelming replication and causing replication lag. Allow “hidden_field” tag to accept a custom autocomplete value In #43280 autocomplete="off" was enforced for all hidden inputs generated by Rails to fix a firefox bug. Unfortunately it’s also a legitimate use-case to specify an autocomplete with a value such as username and a value on a hidden input. This hints to the browser that (in this example) the username of a password reset form is what we’ve provided as the value and the password manager can store it as such. Allow to reset cache counters for multiple records There is often a need to reset counter caches for multiple records. Achieving this before will generate many extra queries. Parallel tests with :number_of_processors uses cgroups-aware usable processor count When using parallel tests the default will now try to allocate a worker pool based of the total number of processors available to the system. Fix Mysql2Adapter support for prepared statements If you’re using the Mysql2 adapter and rely on prepared statements, you may want to wait for the next bug-fix release before upgrading to Rails 8.0. Silence deprecate message during “app:update” command When running the app:update command you previously may see warnings due to not adopting the new_framework_defaults. This PR silences those messages to avoid confusion.'
