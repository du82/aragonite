["https://rubyonrails.org/2024/12/2/rails-foundation-welcomes-1password-as-core-member"]
title = "Ruby on Rails — The Rails Foundation welcomes 1Password as Core member"
description = "The Rails Foundation is growing! After 2 years, we have made great strides in fulfilling our mission, but there is still more we want to accomplish. With that in mind, at a recent board meeting, the board voted in favor of expanding the number of Core members and seats on the board."
full_description = "The Rails Foundation is growing! After 2 years, we have made great strides in fulfilling our mission, but there is still more we want to accomplish. With that in mind, at a recent board meeting, the board voted in favor of expanding the number of Core members and seats on the board. Founded in 2022 by Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals, the Rails Foundation has since welcomed 7 other Contributing members, and enjoyed two years of operations, including two successful Rails Worlds, an ongoing documentation project, and a host of other initiatives. Expanding Core membership means a stronger foundation with more long-term growth and sustainability, and most importantly: more support for the Rails community. With that news, we are happy to announce that our first new Core member is none other than 1Password. 1Password has a strong connection with Rails, leveraging the framework to build Kolide, its Device Trust product acquired earlier this year and now integrated into 1Password’s Extended Access Management (XAM) platform. Kolide ensures that devices meet strict security criteria before accessing critical applications. This Rails-powered application handles thousands of web requests per second, authorizes millions of authentication attempts, processes billions of asynchronous jobs each month, and consistently delivers four nines of annual uptime for customers such as Databricks, Discord, Anduril, Robinhood, Hugging Face, Asana, and many others. Beyond its own use of Rails, 1Password has already made meaningful contributions to the community. This includes giving talks to share insights, creating tutorials to help developers leverage Rails effectively, and providing resources to tackle security challenges with confidence. Contributions to Rails itself include submitting improvements and building tools that simplify development, deployment, and security for software creators, organizations, and end users alike. Joining the Rails Foundation is about more than just using the framework; it’s about aligning with a community that shares our values. Rails represents speed of execution, craftsmanship, and care for the end user—principles we live by at 1Password. We’re excited to deepen our partnership with Rails through the Foundation and look forward to contributing to initiatives like security focused documentation and developer education, which are critical to Rails’ ongoing success. Jason Meller, VP, Product, 1Password"
