["https://rubyonrails.org/2015/6/12/this-week-in-rails-rails-api-fun-with-minitest-and-more"]
title = "Ruby on Rails — This week in Rails: Rails API, fun with minitest and more!"
full_description = "My name is Todd and I’ll be your guide through the land of Rails this week. Straight from the comfort of my couch with awful lumbar support, I proudly present bad posture and the highlights from This Week in Rails. After 52 days, lots of great comments, and a ton of incredible work by Santiago and Jorge, Rails API has been merged into master and will be released as part of Rails 5! If you’ve ever wanted the ability to avoid generating scaffold.css when performing a scaffold, you’re in luck. Simply use the --no-scaffold-stylesheet switch and you’re good to go! The new Rails test runner has been modified to take better advantage of minitest’s extension system. Rails 5 will deprecate the current behavior for Postgres point types. Moving forward, the Postgres adapter will return a Point object instead of an Array. Migrations using remove_foreign_key can now be automatically reverted with rake db:rollback without manually defining the down operations. This allows you to add a prefix or suffix to enum’s auto-generated methods. Useful if you have multiple enums with the same values. This change will now cause an ArgumentError to be raised in the event ignore_blank is set to false on a required select field. Fixes an issue where using belongs_to in abstract classes would result in a crash when loading test fixtures. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
