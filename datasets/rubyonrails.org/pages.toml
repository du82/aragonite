["https://rubyonrails.org/2024/12/11/gusto-joins-rails-foundation"]
title = "Ruby on Rails — Gusto joins the Rails Foundation as a Contributing member"
description = "We have a lot of good news coming this week, and this is just the start: Gusto, a leading provider of HR, payroll, and benefits solutions, and a big supporter of the Rails community, has joined the Rails Foundation as its newest Contributing member!"
full_description = "We have a lot of good news coming this week, and this is just the start: Gusto, a leading provider of HR, payroll, and benefits solutions, and a big supporter of the Rails community, has joined the Rails Foundation as its newest Contributing member! Gusto was founded in 2011 as ZenPayroll and rebranded in 2015 as they extended their focus from payroll to include health benefits and workers’ compensation services and more. Along the way, they have grown to around 3,000 employees with hundreds of Rails developers. Gusto’s codebase is largely divided into two majestic monoliths. They’ve leaned into gradual modularization by adopting packwerk and have contributed to the surrounding ecosystem with their rubyatscale tooling that helps to divide codebases into domain-based packages and helps to encapsulate private complexity behind public interfaces. Internally, Gusto encourage and promote open source contributions via an open source guild, having recently upstreamed some rubocop rules, improved the performance of lefthook, improved auto-install and the performance of bundler, and continued to maintain buildkite-builder that Rails itself uses for its build pipeline. Gusto’s Head of Security maintains Brakeman, a static analysis security tool also used in Rails for checking security issues in your application. In addition to this open source work, Gusto also sponsors individual open source contributors whose work they build on top of. They have also started to sponsor Boulder Ruby Group to help grow the Ruby developer community, and have hosted Women Who Code events at their Denver, New York City, and San Francisco offices. Gusto’s contributions to Rails and its commitment to fostering the open-source ecosystem align perfectly with the Foundation’s mission, and once again we are reminded of the impact that companies dedicated to open source can have on the broader community. Gusto joins the growing list of Rails Foundation Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, 1Passwordand 37signals, and Contributing members AppSignal, BigBinary, Cedarcode, Planet Argon, makandra, Renuo, and TableCheck."
