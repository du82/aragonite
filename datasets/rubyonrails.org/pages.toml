["https://rubyonrails.org/2005/12/8/rails-rc5-0-14-4-next-stop-one-oh-really-this-time"]
title = "Ruby on Rails — Rails RC5 (0.14.4): Next stop one-oh (really, this time!)"
description = "It’s been a month since we promised that RC4 would be the final countdown. And counting down we have. We’ve fixed a ton of major, minor, and aesthetic issues and now have a package that we would be very proud to call 1.0. No, it’s not completely spotless. A project of this size with thousands of programmers using it for every application type under the moon will never be. But it’s Pretty Damn Good.So here it goes: Release candidate 5. This is the final, short pitstop before 1.0 materializes next week. Thus, you’re more than well advised to upgrade and make sure we didn’t leave anything heinous in there. This is the “speak now or forever hold your peace” part of the ceremony.If you already upgraded to 0.14.x, going to RC5 is completely effortless. Simply call upon the gems to do your bidding with: gem install rails --include-dependencies. And you’ll be serving up your application with all the bugs squashed. On top of that, we’ve thrown in a new adapter for the Firebird database and added a beautiful new index.html that’ll greet you on new applications:So upgrade, dammit! Now. And stand by as we finish setting up the fireworks planned for next week’s release of the long-awaited 1.0. It’s magical times, my friends, and the spellcasting is just getting started.The interesting changes are in:Rails 0.14.4Action Pack 1.11.1Active Record 1.13.1"
full_description = "It’s been a month since we promised that RC4 would be the final countdown. And counting down we have. We’ve fixed a ton of major, minor, and aesthetic issues and now have a package that we would be very proud to call 1.0. No, it’s not completely spotless. A project of this size with thousands of programmers using it for every application type under the moon will never be. But it’s Pretty Damn Good. So here it goes: Release candidate 5. This is the final, short pitstop before 1.0 materializes next week. Thus, you’re more than well advised to upgrade and make sure we didn’t leave anything heinous in there. This is the “speak now or forever hold your peace” part of the ceremony. If you already upgraded to 0.14.x, going to RC5 is completely effortless. Simply call upon the gems to do your bidding with: gem install rails --include-dependencies. And you’ll be serving up your application with all the bugs squashed. On top of that, we’ve thrown in a new adapter for the Firebird database and added a beautiful new index.html that’ll greet you on new applications: So upgrade, dammit! Now. And stand by as we finish setting up the fireworks planned for next week’s release of the long-awaited 1.0. It’s magical times, my friends, and the spellcasting is just getting started."
