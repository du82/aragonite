["https://rubyonrails.org/doctrine/zh_tw"]
title = "Ruby on Rails — Rails 基本主義"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "Ruby on Rails 驚人的活躍主要是因為本身採用了新穎的技術和對的時間點。但技術優勢隨時間推移而削弱；好景不長久。但 Rails 為什麼不僅能繼續與時俱進，影響並帶領社群繼續前進？需要更進一步的解釋。我提議以下這篇內容，是我們的基本主義，也是飽受爭議的基本主義。 這篇基本主義，在過去十年裡不斷演化，是最主要的支柱，同時也是最基本的支柱。我不自詡自己是這些想法的原創者。Rails 的主要成就是統整與培養出，一個圍繞在廣泛程式設計本質思想與程式設計師本身的族群。 Ruby 早期的異端邪說就是把程式設計師的幸福擺在第一位。遠把追求幸福放在驅使程式語言與生態圈前進的競爭考量之上。 Python 可能對「用一種方法，最好只有一種方法來完成一件事」感到自豪，Ruby 則喜愛自身表現力與巧妙。Java 是保護程式設計師的強力擁簇者，Ruby 則在歡迎工具裡就附上可自盡的繩索。Smalltalk 鑽研消息傳遞的純粹性，Ruby 則積累關鍵字和臃腫的語法構造。 Ruby 與眾不同的原因是看重的事情不一樣。這些考量，都是為了滿足追求程式設計師的幸福。追求導致了與其它程式設計環境的辯論，也打開了主流文化對究竟什麼是程式設計師，以及該如何應對程式設計師的認知。 Ruby 不僅認可也適應與提昇了程式設計師的感受。這究竟是不適當、還是奇思呢，抑或是喜悅。Matz 跨越了驚人複雜的實作門檻，讓機器面有喜色充滿人性。Ruby 滿是視覺上的錯覺，在我們看起來 Ruby 很簡單，很清晰，也很優美，背後其實是雜技般的錯綜複雜。這些選擇不是沒有代價（問問 JRuby 那些試著要逆向工程 Ruby 的人看看！），這也是為什麼，這是很值得讚揚的一件事。 這是對程式設計另一種願景的致敬，也決定了我對 Ruby 的愛戀。這不只是簡單易用，不僅是美學的元素，也不是單一的技術成就。而是一種願景，是反文化。Ruby 是一個不適應呆板專業程式設計的人，而是專屬於愛好之士的樂土。"
