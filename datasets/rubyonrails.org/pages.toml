["https://rubyonrails.org/2024/12/18/wrap-up-2024-from-rails-foundation"]
title = "Ruby on Rails — 2024 Wrap Up from the Rails Foundation"
description = "It’s amazing how quickly a year flies by."
full_description = "It’s a total cliché, but it feels like only a few days ago that I sat by my Christmas tree and wrote last year’s final reflection post. Back then, I was excited for all of the plans the Rails Foundation had in the works for 2024. Rails 7.1 was just released and already Rails 8 was on the horizon. There was so much to do! Documentation! Tutorial! Videos! Toronto! Merch store! Case studies! I couldn’t wait to hit the ground running and start assembling the teams to make all this happen. …Then the motherboard in my new laptop died and I was forced to take the next week off until Apple provided a new one. I’m sure there was a ‘blessing in disguise’ lesson in there somewhere, but at the time I was too annoyed to see it. Now, one year later, seated again in the glow of my Christmas tree with a cautious eye on my second new laptop (don’t fail me now), I can look back and say with confidence that we did what we set out to do in 2024. Within two years the Rails Foundation has all 4 pillars of our mission up and running, and all pistons firing: Documentation, Education, Marketing, and Events. And once again, I am looking ahead with excitement to next year. We have a lot in store, and I can’t wait to get started. Before we sprint forward, I’d like to share all that we accomplished this year in support of our mission. The Rails Foundation expanded this year when 1Password joined as a brand new Core member. This is huge news for the Rails community that such a well-known SaaS company (and beloved tool) is so enthusiastic about Rails that they are contributing at our highest tier of membership. And not a Rails shop by origin, I might add, but rather a Rails shop by acquisition. That speaks volumes about Rails. VP of Product at 1Password Jason Meller joined the Rails Foundation board as a director. On the Remote Ruby podcast recently, he shared more about how this all came to be when his company Kollide was acquired by 1Password, and how joining the foundation took little convincing internally: “It felt like the right time for 1Password to step in and start getting formally involved in the community. It was a no-brainer. Instantly everybody saw the value.” (It’s a great episode, listen to it here.)"
