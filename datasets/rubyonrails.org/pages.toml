title = "Ruby on Rails — Rails Versions 7.0.8.7, 7.1.5.1, 7.2.2.1, and 8.0.0.1 have been released!"
description = "Hi everyone!"
full_description = "These are security patches addressing one new issue where using the content_security_policy helper with untrusted user input could lead to a bypass of the browser Content Security Policy. We think this usage will be rare, and the default configuration is not vulnerable, but advise upgrading. Older versions of Rails are unsupported, and users are recommended to upgrade to at least the 7.0 series, which will be receiveing security updates until April. See our maintenance policy for details. There is one known compatibility issue in the new version of Trix related to custom HTML tags and attributes, users depending on that functionality should be cautious. I anticipate making another Rails release soon to update the vendored Trix once a new version is available. If you’d like to verify that your gems are the same as the ones we’ve uploaded, please use these SHA-256 hashes."
