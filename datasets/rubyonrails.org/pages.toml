["https://rubyonrails.org/2023/5/9/rails-world-call-for-papers-now-open"]
title = "Ruby on Rails — Rails World Call for Papers now open"
description = "We are pleased to announce the Call for Papers (CFP) for Rails World 2023."
full_description = "Rails World is the first conference hosted by the Rails Foundation, and coincides with the 20th anniversary of the Ruby on Rails framework. It will take place on October 5 & 6, 2023 in the Beurs van Berlage in Amsterdam, Netherlands. There is space in the agenda for 26 talks on two tracks, and up to six workshops. Talks will be recorded for later publishing on the Rails YouTube channel and event website, and we are currently exploring the idea of a livestream during the event. This first edition will welcome 650 attendees. This CFP is open until June 16, and we are aiming to inform all applicants if they are accepted (or not) before tickets are released. Ruby on Rails has been a foundational technology for many developers for over 20 years, and is today stronger than ever thanks to continued progress in both core frameworks, like Active Record and Action Mailbox, as well as associated tools and frameworks, like Hotwire, Kredis, and MRSK. Therefore, we are particularly interested in hearing talks that explore emerging trends and innovative approaches to building applications with Rails. We want to hear about ideas that are forward-thinking, yet practical. Now and in the future, how does Rails make hard tasks possible, easy, trivial, or even delightful, promoting developer happiness and productivity? Whether you’re a seasoned veteran or a newcomer to the Rails ecosystem, we encourage you to submit proposals that challenge the status quo, showcase forward-thinking ideas and visionary insights, and push the boundaries of what’s possible. Let’s shape the future of Rails and build a stronger, more vibrant community for generations to come. Initiatives by the Rails Foundation are funded by the support of Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals, and Contributing members AppSignal, Cedarcode, and Planet Argon. See further details on the foundation page."
