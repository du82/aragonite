["https://rubyonrails.org/2015/9/12/this-week-in-rails-performance-mysql-prepared-statements-and-more"]
title = "Ruby on Rails — This week in Rails: Performance, MySQL prepared statements and more!"
description = "This is Prathamesh after a long long time bringing you latest and greatest news from Rails world!"
full_description = "37 people contributed to Rails this week, including 7 first-time contributors. If you are interested in becoming a contributor, you can have a look at the issues list. Now you can drop PostgreSQL indices concurrently in Rails 5, just like how you can already add indices concurrently today. Remember good ‘ol config.force_ssl? You can now use it with greater control. With improvements in SSL redirect and better handling of Strict Transport Security, you will surely love this improved version of config.force_ssl. Ever faced the need of running validations of create and update contexts both at the same time? Now you can do that by passing multiple contexts to the #valid? and #invalid? methods. This week lot of work was done for improving Active Record internals by reducing object allocations, avoid creating relations when not required and so on. Kudos to @tgxworld! Rails now supports latest version of mysql2 gem. Is this a big deal? Yes!! You can now use prepared statements using this version. Now that’s awesome! If you are using custom SQL queries with Ruby herredoc, you will be able to identify them instantly in your logs. Why? Because they will have better colors thanks to this patch. The cookie-handling code in Rails is one of the more complicated code in the framework, largely due to the need to support and migrate legacy cookies produced by older versions of Rails. If you have seen some weird characters showing up in error messages of rails g commands due to localization of some messages, it is now fixed! That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
