["https://rubyonrails.org/2015/8/21/this-week-in-rails-z"]
title = "Ruby on Rails — 🚂 This week in Rails 🚂: Learn How These 37 Rails Contributors Improved The Entire Framework In Just One Week"
description = "Good News Everyone, This Week In Rails has been acquired by BuzzFeed!"
full_description = "Just kidding. This is Godfrey here. It’s been a while since I get to write one of these myself and I’m very happy to be back. Without further ado, let’s dive right into it! The Rails team is committed to fostering a welcoming community for everyone. With the help of our community, we have added an official Code of Conduct for the project this week. Well, their pull requests were merged and they are immortalized on the Rails Contributors website. And oh, everyone please send a warm welcome to the 10 first-time contributors this week! According to @schneems who is responsible for the release, this is supposed to fix an issue for those of you “who share a cache in different directories between deploys”, which includes Heroku deployments. MySQL has recently added a native JSON data type (perhaps inspired by its more popular cousin, PostgreSQL). Thanks to this patch, you will be ready to take advantage of that feature in Rails 5. Concurrency is hard, but Rails might have finally cracked the nut. You might not know that Active Support offers a way to write to a file atomically with File.atomic_write. Even if you have heard about it, you probably didn’t realize there is a subtle race condition in its implementation. Anyway, with this patch landing on master, those bugs will soon be behind us and we can all just sit back and enjoy the convenience it provides. It turns out that things do not run twice as fast when you double-cache them. Who would have thought? (I wish we all wrote great commit messages like this by the way!) Along those same lines, it turns out that testing the same thing twice doesn’t provide much value either. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
