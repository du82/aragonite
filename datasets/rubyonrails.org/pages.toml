["https://rubyonrails.org/2015/5/22/this-week-in-rails-try-ing-with-delegator-schema-cache-and-a-lot-more"]
title = "Ruby on Rails — This week in Rails: try'ing with Delegator, schema cache and a lot more"
description = "Hey everyone, this is Prathamesh. Back with latest spells and bindings from magical world of Rails. Keep your wands ready!"
full_description = "Hey everyone, this is Prathamesh. Back with latest spells and bindings from magical world of Rails. Keep your wands ready! 39 people got commits into rails/rails this week. And 7 of them made their first patch in this week! Checkout the pulse page for more details. Delegator will now respond to try rather than delegating it to the underlying object. Phew! The surprising behavior when using try with normal objects and delegators is gone finally. Active Record does all the heavy lifting of maintaining and creating connection pools. It just got better. Thanks to this patch, it will copy the schema cache of old connections pools to the new ones if one already exists. Quoted sequence names in PostgreSQL will work properly now with serial? method. Before this patch, the serial? method would return false if the sequence name was quoted. Finally it’s fixed. Last week Integer#positive? and Integer#negative? were added to Rails and this week they became part of Ruby core. Hooray! That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
