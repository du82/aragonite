full_description = "28 people contributed to the framework by having their commits merged into rails/rails this week. Thanks and keep up the good work! Are you still on Rails 3? Do you wish you could use strong parameters? Check out this commit to protected_attributes… it might just make your day. The development of rails/sprockets moves on and… needs your help! If you’d like to contribute to its next version, don’t hesitate to contact any Rails core team member. Assigning a wrong value to a namespaced association used to raise NameError, but will now correctly raise ActiveRecord::AssociationTypeMismatch Kasper started contributing one year ago and has not stopped (240 commits and counting)! Thanks for being awesome and for your wonderful blog posts. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself! Have you been thinking about writing for us, but you’re scared of putting yourself out there? Don’t worry, you can help our editors improve their writing with thoughtful critique and general grammar policing."
