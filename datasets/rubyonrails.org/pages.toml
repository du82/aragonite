["https://rubyonrails.org/2024/2/6/documentation-update-work-has-begun"]
title = "Ruby on Rails — Documentation update: work has begun"
description = "Improving Rails documentation is one of the core pillars of why the Rails Foundation was formed, so we are pleased to share an update on how that mission is progressing."
full_description = "Improving Rails documentation is one of the core pillars of why the Rails Foundation was formed, so we are pleased to share an update on how that mission is progressing. Thanks to organic contributions from the community over the past 20 years, the Rails documentation is already in a fantastic place - arguably one of the most in-depth and robust set of docs in tech. Our mission at the foundation is to assemble a team to go over this impressive body of work with a fine-tooth comb. We want to fill in any gaps, check that the content is still up-to-date, and make sure that the writing is consistent, clear, and accessible for developers of all levels - from the experienced Rails dev to the new developer learning Rails (or web development) for the first time. The team is assembled and the work just began, so here is how we work, what’s next, and how you can help. If you’re interested in helping improve the documentation, keep an eye out for the PRs named RF-DOCS and labeled ‘rails foundation’. If you have experience with a certain component or feature, we would love if you reviewed and commented on that PR from a technical perspective. Furthermore, if you come across a section of a guide that needs work, feel free to open an issue in the Rails repo and label it with ‘docs’. We’ll continue monitoring these issues and the team will step in where needed. ‘I occasionally contribute PRs for documentation. Should I stop?’ ‘I have an open PR about a doc update. Should I close it?’ Absolutely not. The Rails documentation is the amazing resource that it is today thanks to such community contributions, so this project is meant to work alongside that - not interrupt it. Please continue contributing. We reserve the right to change this way of working if it becomes unwieldy or if it hampers the work that the Rails Core, Committers, and Issues team are focused on. If you have any questions or feedback about any of the above, feel free to reach out to foundation@rubyonrails.org."
