["https://rubyonrails.org/2015/4/3/this-week-in-rails-this-week-in-rails"]
title = "Ruby on Rails — This week in Rails"
description = "Happy Good Friday Everyone!"
full_description = "It is recommended to not change settings on ActiveJob::Base directly so from now on every generated Job will inherit from ApplicationJob and you can tweak that for your needs. This option only served an extremely specific use case hence became deprecated. If you rely on this functionality, you can implement it with a plain Ruby method. In the development environment ActiveSupport::FileUpdateChecker#max_mtim triggers many time comparison and there were many unnecessary to_time calls. With this patch Rails saves around 100ms per request! The PG::Result object were never cleared when the application queries the types. By clearing that object Rails use less memory. With this pull request ActionController::Parameters.const_missing’s super is always returned whereas before it was only called and its return value was mistakenly discarded. That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
