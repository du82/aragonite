["https://rubyonrails.org/doctrine/de"]
title = "Ruby on Rails — Die Rails-Doktrin"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "Einen Großteil seines phänomenalen Aufstiegs zur Bekanntheit verdankt Ruby on Rails dem Auftrieb, den es durch neuartige Technologien und passendes Timing erhielt. Aber technologische Vorteile schwinden mit der Zeit, und gutes Timing allein hält Bewegungen nicht langfristig aufrecht. Daher ist eine umfassendere Erklärung dafür erforderlich, warum Rails nicht nur weiterhin relevant bleibt, sondern auch seine Wirkung und seine Community ausbaut. Ich behaupte, dass seine umstrittene Doktrin der bleibende Wegbereiter ist und bleibt. Diese Doktrin hat sich in den letzten zehn Jahren weiterentwickelt, aber ihre stärksten Säulen sind auch ihre Gründungspfeiler. Ich erhebe keinen Anspruch auf die grundsätzliche Originalität dieser Ideen. Die Hauptleistung von Rails bestand darin, einen starken Stamm um eine breite Palette ketzerischer Gedanken über die Natur des Programmierens und der Programmierer zu vereinen und zu kultivieren. Nach dieser Vorrede folgen hier die neun wichtigsten Säulen der Rails-Doktrin, wie sie von mir wahrgenommen werden: Es gäbe kein Rails ohne Ruby, daher ist es angemessen, dass die erste Lehrsäule direkt von der Kernmotivation für die Entwicklung von Ruby übernommen wird. Rubys ursprüngliche Ketzerei bestand tatsächlich darin, das Glück des Programmierers auf ein Podest zu stellen. Über vielen anderen konkurrierenden und berechtigten Überlegungen, die Programmiersprachen und Umgebungen zuvor vorangetrieben hatten. Während Python damit prahlte, dass es „einen und vorzugsweise nur einen Weg gibt, etwas zu tun“, genoss Ruby Ausdruckskraft und Subtilität. Während Java sich dafür einsetzte, Programmierer energisch vor sich selbst zu schützen, legte Ruby dem Willkommenspaket einen Satz scharfer Messer bei. Wo Smalltalk eine Reinheit der Nachrichtenübermittlung übte, nahm sich Ruby Schlüsselwörter und Konstrukte mit einem fast gefräßigen Appetit. Ruby war anders, weil es andere Dinge schätzte. Und die meisten dieser Dinge unterstützen das Streben nach Glück des Programmierers. Ein Unterfangen, das Ruby nicht nur mit den meisten anderen Programmierumgebungen in Konflikt brachte, sondern auch mit der Mainstream-Wahrnehmung dessen, was ein Programmierer ist und wie er handeln sollte."
