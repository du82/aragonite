["https://rubyonrails.org/2015/5/2/this-week-in-rails-recovering-from-railsconf"]
title = "Ruby on Rails — This week in Rails: recovering from RailsConf"
description = "Happy Friday! It’s Claudio with the latest updates on Rails. Overall, this has been a relaxed week. Many documentation fixes have made their way into master while features uncovered at RailsConf (like the integration of Rails API) are being heavily discussed on GitHub."
full_description = "Happy Friday! It’s Claudio with the latest updates on Rails. Overall, this has been a relaxed week. Many documentation fixes have made their way into master while features uncovered at RailsConf (like the integration of Rails API) are being heavily discussed on GitHub. This week 31 people helped Rails out. Six people had their first commit merged into rails/rails. Hooray! One by one, all the presentations of RailsConf are being uploaded. Lots of great talks to fill your weekend! We are proud to announce that 8 students will be working on improving Rails as part of the Google Summer of Code 2015. Congratulations and welcome to Rails! Rails ships with minitest by default but has different naming conventions for inverse assertion methods. The new guides clarify this difference. And give us a great excuse to link to Ruby on Rails on Minitest. Everyone can help make Rails better by improving its guides. “Caching with Rails” is an awesome place to start. If you think you can improve it, don’t hesitate to submit a pull request! Some tests in the Rails codebase use the mocha library and can be faster by using minitest/mock instead. This commit fixes one of those tests; you are all invited to do the same for the remaining ones. The rake routes command was not properly showing nested routes with a scope constraint for the format override by a resource… but that just got fixed! That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
