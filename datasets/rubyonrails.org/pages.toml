title = "Ruby on Rails — Privacy"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "That's us – the Rails Foundation (the data controller). We control, manage, and decide how we use your personal information as part of our business activities. If you choose to provide your personal information to other parties during an event organized by the Rails Foundation, including sponsors, then their data privacy policies apply to the data that you give to them. However, we will take all reasonable measures to ensure that any third parties with whom we share your personal information are also compliant with data protection laws and have appropriate safeguards in place to protect your personal information. It includes but is not limited to your full name, email address, contact information, company/organization info, photos and biographies (for conference speakers), contact preference information, dietary preferences, and any other information related to you or anyone else you may provide to us. If you provide us with information about a third party, you must have their consent to share it and let them know about this privacy policy. The Rails Foundation uses some third-party services like Basecamp, Hey, and Tito for project management, email services, and Rails World registration (respectively). If their privacy policy is more restrictive than ours, we'll follow their terms. Read more about their policies here: We make sure that any vendors we work with are also compliant with data protection laws and have appropriate safeguards in place to protect your personal information. Some personal information is particularly sensitive, like ethnicity, nationality, gender, and other demographic information, and we only collect this data when you voluntarily give it to us. We don't share anyone's sensitive information with third parties unless required by law or with explicit opt-in consent from the individual. The Rails Foundation collects information when you provide it to us, such as when you email us information, connect with us on social media, use the suggestion form found on our website, subscribe to our mailing lists, or when you engage in any other communication, recorded or otherwise communicated."
