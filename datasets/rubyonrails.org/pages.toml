title = "Ruby on Rails — Community"
description = "A web-app framework that includes everything needed to create database-backed web applications according to the Model-View-Controller (MVC) pattern."
full_description = "The direction of the framework is stewarded by the Rails Core. This group of long-term contributors manages releases, evaluates pull-requests, handles conduct complaints, and does a lot of the groundwork on major new features. The Committer team assists with processing pull requests and making changes to the framework, but does not have the keys to make final releases or set policy. All members of the Core team came up through working on this team: The Issues team assists with issues triage, pull request reviews, and documentation improvements. They are often the first point of interaction of users with the Rails team: Adam Hess, Andrew Novoselac, Adrianna Chang, Akhil G Krishnan, Alex Ghiculescu, Edouard Chin, Haroon Ahmed, Hartley McGuire, Jorge Manrubia, Luan Vieira, Matheus Richard, Mike Dalessio, Nikita Vasilevsky, Paul Reece, Petrik de Heus, Prem Sichanugrist, Robin Dupret, Sean Doyle, Vipul A M, Zak Scott We’d like to extend special thanks to the following Rails Core team members, lovingly known as The Alumni: George Claghorn, Santiago Pastorino, Yves Senn, Godfrey Chan, Michael Koziarski, José Valim, Yehuda Katz, Jon Leighton, Josh Peek, Carl Lerche, Pratik Naik, Jamis Buck, Marcel Molina, Nicholas Seckar, Sam Stephenson, Florian Weber, Scott Barron, Tobias Lütke, Rick Olson On top of these formal teams, there are thousands of code contributors. We’ve tracked everyones work on the Rails Contributors site. The community also cherishes all the people who contribute in other important ways to have a sound community, including documentation, evangelism, organizing, and more."
