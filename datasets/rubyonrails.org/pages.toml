["https://rubyonrails.org/2015/5/15/this-week-in-rails-connection-pool-responsive-site-oh-my"]
title = "Ruby on Rails — This week in Rails: Connection Pool, Responsive Site, Oh my!"
description = "Hey everyone, cough this is cough Kasper."
full_description = "Feel free to insert cough’s through the rest of this, as long as you remember not to snooze on a sneeze or two too. Look at these 31 people and how they’ve hammered away at their keyboards, as if possessed by a different sickness. One of radness that is, my duderinos and duderinas. Active Record keeps a pool of database connections. To keep the pool safe from people trying to cannonball queries at once we need to lock it. The pull request slims down what happens when locking, so you can quicker release the lock. Basically more people can go splash, because the diving board is free earlier. Are you on your phone? Are you on your watch? Are you on the toi… eh, anyway, the Rails website is now responsive. Just to tide you over until the website redesign will be revealed. That’ll surely be a royal flush. This week integers gained introspection methods that makes a select a tad easier to read. They are the gangbuster team of negative? and positive?. And hopefully the polarity shockwaves will rock the Ruby world too. If you rendered a partial like <%= render partial: 'spruce_goose' %>, Rails would spruce up local_assigns with the name of the partial. That goose chase ended this week. The option to generate API only Rails apps is almost done. But there’s still a chance to help out by reviewing it. Give it a shot of love! That’s all for This week in Rails. As always, there are more changes than we have room to cover here, but feel free to check them out yourself! P.S. If you enjoyed this newsletter, why not share it with your friends? :) If you wish to be part of this project please don’t hesitate to contact Godfrey – there’re a lot of ways you could help make this newsletter more awesome!"
