["https://rubyonrails.org/2024/10/15/rails-world-2024-recap"]
title = "Ruby on Rails — Rails World 2024 Recap - All talks now online!"
description = "All the talks from Rails World 2024 are now available online! Revisit your favorite sessions or catch up on ones you missed on the Rails World 2024 YouTube playlist."
full_description = "All the talks from Rails World 2024 are now available online! Revisit your favorite sessions or catch up on ones you missed on the Rails World 2024 YouTube playlist. Just over 1,000 Rails devs from 57 countries gathered in Toronto for two days of technical talks, workshops, networking, evening parties, the Rails 8 beta release…and one glorious neon sign. Was there anything that didn’t work? The most reported answer by far was: chairs. You really hated those chairs. Fun backstory: Those were not the chairs we ordered. The day before the event the furniture company told us they didn’t have enough of the one we ordered, so they sent different chairs as a replacement. Sometimes that’s the way things play out with events. You also weren’t crazy about the wasps out in the Pavilion, which, you know….fair. (Note to self: no wasps next time.) Humor aside, you also shared a lot of feedback about things we can control (schedule, content, parties, etc) that we will take into consideration for next year, so thank you for all of your suggestions! None of this would have been possible without the generous support of the Rails Foundation Core and Contributing members, and this year’s fantastic list of sponsors: Platinum Sponsors and Track Hosts: GitHub, AppSignal City Host: Shopify Gold Sponsors: Clio, Huntress, Valkey Silver Sponsors: Crunchy Data, Framework, Happy Scribe, MongoDB, Paraxial, Sentry Podcast Program Sponsor: Buzzsprout Speaker Support Sponsor: Fullscript Rails World App Sponsor: Telos Labs Double Up Lab Sponsor: Test Double Coffee Cart Sponsor: Cedarcode Workshop Sponsor: Coder Financial Support Sponsor: ODDS, Saeluon Save the date - Rails World 2025 will take place in Amsterdam in early September! We’ll share a blogpost soon about the decision to return to Amsterdam, but until then, we hope you enjoy catching up with this year’s talks online!"
