["https://rubyonrails.org/2015/12/7/this-week-in-rails-rails-command-infrastructure-and-more"]
title = "Ruby on Rails — This week in Rails: Rails command infrastructure and more!"
description = "Hello everyone!"
full_description = "This week 28 fabulous people contributed to Rails. Check out the list of issues if you’d like to see your name up there. The infrastructure needed to support the movement of rake tasks to the rails command is now in place. This paves the way to make it easier to learn commands for persons new to Rails. An explicit global namespace to Rails::TestUnitReporter has been added to resolve a namespace conflict between minitest-rails and Rails test runner. If a database default was specified for the type column used in Single Table Inheritance (STI), it did not cast new instances to default type on initialize. This is now fixed. This simple refactor utilizes the respond_to_missing? hook introduced in Ruby 1.9. This prevents the usage of the method method from raising a NameError. The previously error message whenever all connections in the pool were used up, did not mention that. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself."
