title = "Ruby on Rails — Rails World 2023: A Recap of Two Days of Rails"
description = "First, we have good news…"
full_description = "We’re excited to share that all the talks from Rails World 2023 are now available online! Revisit your favorite sessions or catch up on ones you missed on the Rails World 2023 YouTube playlist here. The first edition of Rails World in Amsterdam was a two-day, two track community conference featuring technical talks, demos, workshops, networking, and keynotes about the latest features and best practices in Rails development. There were 700+ Rails developers in attendance, 29 speakers, 3 keynotes, workshops, an AMA with the Rails Core team, the first Rails Luminary awards, and one big birthday celebration to close it all off. It’s hard to miss the recurring theme in these replies: We may have provided the cool space and rallied the speakers, but you brought the vibe. This is exactly what the Rails Foundation Core & Contributing members felt, too. We loved meeting you in person, hearing your ideas on how we can support you, and sharing in your enthusiasm for the future of Rails. We would be remiss not to share what you thought didn’t work so well. The two most reported answers were: the screen in Track 1 was too low, and there wasn’t enough time between sessions to chat and hang out. We hear you, and we fully agree. This is important feedback we are already considering for next year. DHH delivered the Opening Keynote and covered a lot of ground, including introducing 7 major tools in support of The One Person Framework: Propshaft, Turbo 8, Strada, Solid Cache, Solid Queue, Mission Control, and Kamal. Watch it here. Eileen Uchitelle delivered the first Closing Keynote on the philosophy behind Rails - a sprinkling of magic, but also a good dose of common patterns to build agnostic and beautiful interfaces. Watch it here. Aaron Patterson closed Rails World with a keynote where he took a look at how language servers work, how we can improve language server support in Rails, and how this will increase our productivity as Rails developers. Find it online here. Ten of the current 12 Rails Core members sat down with Planet Argon founder and CEO Robby Russell to answer questions submitted by the Rails World audience, such as: How do they decide on which features to add? How should Rails evolve in the future? What does it take to join the Core team?"
