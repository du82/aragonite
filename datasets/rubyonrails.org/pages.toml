["https://rubyonrails.org/2015/11/6/this-week-in-rails-new-release-candidates-concurrent-migrations-and-more"]
title = "Ruby on Rails — This week in Rails: new release candidates, concurrent migrations and more!"
full_description = "Please take a minute or two to update your project Gemfile and run the build on the RCs. Spotting regressions now means they’re fixed in another RC rather than a new point release some month(s) away. As of 17h15min, UTC -3, 28 contributors made their commits to Rails master. Some of those for the very first time. Welcome! MySQL and Postgres Active Record adapters were enhanced to avoid confusing behaviour or exceptions when running migrations on multi-instance clusters. See the issue as well for more details. Good old serve_static_files is being deprecated as of Rails 5 in favor of public_file_server.enabled so we have all static asset options under the same public_file_server key. Exception wrapping implementation got a bit simpler this week by using Ruby’s built in Exception#cause, available since version 2.1. This was reported quite a while ago, but now someone stepped up to the plate and followed it through. Rails got a bit safer again, thanks to the community. ❤️ That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself."
