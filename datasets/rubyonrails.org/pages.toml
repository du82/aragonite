["https://rubyonrails.org/2023/10/23/celebrating-the-first-rails-luminaries"]
title = "Ruby on Rails — Celebrating the first Rails Luminaries: Chris Oliver & Tobias Lütke"
description = "We are thrilled to announce the inaugural winners of the Rails Luminary Award, a new tradition established by the Rails Foundation to honor those who have made outstanding contributions to the Rails ecosystem and have been a positive force in our community. Two awards were presented this year."
full_description = "We are thrilled to announce the inaugural winners of the Rails Luminary Award, a new tradition established by the Rails Foundation to honor those who have made outstanding contributions to the Rails ecosystem and have been a positive force in our community. Two awards were presented this year. After carefully reviewing nominations, the Rails Core team chose one individual for their unwavering dedication and extraordinary impact on the Rails community: Chris Oliver from GoRails. Chris was in the Rails World audience when we surprised him with this announcement. Rails Core member Xavier Noria presented Chris with the first Rails Luminary Award on stage at Rails World, and has this to say: Chris is, in his own unique way, a role model for many of us. He embodies the technical mastery, the community work, and the human quality of a luminary. We are grateful to have him. On winning the award, Chris shared, “I’m incredibly honored to win the Rails Luminary award. Rails has an incredibly helpful and kind community that I discovered back in 2010. The supportiveness of the community inspired me to give back and share my learnings along the way. I hope that my story can serve as an inspiration to others and encourage them to continue building up the community and pushing us forward every day.” The community that Chris has built around GoRails is without a doubt the only reason I was able to make it as a Rails developer. He has helped foster and nurture the next generation of Rails developers and demonstrated that is not as hard as you might think. Chris’s work with GoRails and his contributions to other critical gems has directly impacted my nearly 5 year long career as a Rails developer. I can directly associate my success and most of my career to the work he did in writing both content, and the community he built around GoRails. We also introduced a second award category at Rails World: the Rails Lifetime Award, acknowledging individuals whose long-term dedication and impact on the Rails ecosystem have been nothing short of legendary."
