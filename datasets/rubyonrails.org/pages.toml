["https://rubyonrails.org/2025/1/3/this-week-in-rails"]
title = "Ruby on Rails — Schema dumper versions formatter and more"
description = "Hi, Wojtek here. Let’s explore the first changes of the new year in the Rails codebase."
full_description = "Introduce versions formatter for the schema dumper It is now possible to override how schema dumper formats versions information inside the structure.sql file. Currently, the versions are simply sorted in the decreasing order. Within large teams, this can potentially cause many merge conflicts near the top of the list. Now, the custom formatter can be provided with a custom sorting logic (e.g. by hash values of the versions), which can greatly reduce the number of conflicts. Replace SyntaxTree with Prism in rail_inspector Now that Prism has been stable for a while and is the default parser in Ruby 3.4, use it in the rail_inspector. Handle path_params gracefully when a user sends a string When url contains the query part ?path_params=string it is now ignored and does not error. Fix setting to_time_preserves_timezone from “new framework defaults” Previously setting Rails.application.config.active_support.to_time_preserves_timezone = :zone in the initializer did not have effect. You can view the whole list of changes here. We had 21 contributors to the Rails codebase this past week!"
