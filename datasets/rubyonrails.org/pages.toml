["https://rubyonrails.org/2015/6/6/this-week-in-rails-datetime-vs-time-summer-student-projects-and-more"]
title = "Ruby on Rails — This week in Rails: DateTime vs Time, summer student projects and more!"
description = "Hello everyone!"
full_description = "This is Marcel making my ‘initial commit’ with awesome help from Kasper, your friendly ghost editor. Ten minutes from the lovely Jamaican shores, here are the headlines from This Week in Rails. Ever wondered what is the difference between DateTime and Time? Checkout this enlightening gist on when you would use each which also landed in the ruby documentation. Follow one of our Google Summer of Code student Hiroyuki on his thoughts, experiments and progress with the web-console browser extension project. Meet the 16 official teams that will be participating in the 2015 Rails Girls Summer of Code. We wish them the best of luck. Sometimes there’s a configuration your app simply needs to function. Now that important client secret can raise if it hasn’t been set. Just go out with a bang: Rails.application.kitty_litter_supreme.client_secret! Currently all mails sent with deliver_later are put in the mailers queue. This patch keeps that default but allows the queue name to be configured globally via config.action_mailer.deliver_later_queue_name. See also related documentation commit. No longer do you need to write a physical Gemfile when submitting bug reports, as Bundler 1.10.3 now supports inline gems. Of note, when an inline Gemfile is used, bundle exec is not supported. As it turns out using a block variable instead of a “magic” global variable is not only faster but easier to read. This allows easier integration with Active Record, such that ActiveRecord::Base#pluck will now use Enumerable#pluck if the relation is loaded, without needing to hit the database. In order to discourage ties in the controller tests to the internal structure of how your views are organized, assigns and assert_template have both been removed and extracted to the gem rails-controller-testing. Active Record’s suppress is now being applied to non-bang save and update methods. It was also missing from create_* methods provided by singular associations. See gist for more details. That’s all for This week in Rails. As always, there are many more changes than we have room to cover here, but feel free to check them out yourself!"
year_published = 2025
