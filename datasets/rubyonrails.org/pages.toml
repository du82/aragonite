["https://rubyonrails.org/2023/9/14/bigbinary-joins-rails-foundation"]
title = "Ruby on Rails — BigBinary joins the Rails Foundation"
description = "Please help us welcome BigBinary as the newest Contributing member of the Rails Foundation!"
full_description = "For more than twelve years, BigBinary has built custom web applications for clients using Ruby on Rails. Recently, they also launched neeto, an impressive suite of productivity tools all built on Rails. Over the past decade, the team has made many contributions to the Rails codebase and is active in the Rails community- organizing meet-ups, sponsoring events like Rails Girls, and speaking at various Ruby and Rails conferences around the world. At BigBinary, we all love working with Ruby on Rails, and find it incredibly productive. Without it, it wouldn’t be possible for us to build neeto, where we are building 20+ products simultaneously. We are thrilled to be part of the Rails Foundation. We believe Rails has a great future ahead and we want to do our bit to make that a reality. Neeraj Singh, BigBinary Founder & CEO We are also excited about BigBinary’s emphasis on education, comprehensive documentation, and developer happiness, all of which led to the creation of BigBinary Academy, Learn Ruby on Rails, and tools such as neetoCode. Documentation and education are two of the four main pillars on which the Rails Foundation was built, so we look forward to their insights, experience, and advice as we kick off our own initiatives (more on that soon!). In the 20th anniversary of the framework, the future of Rails is bright thanks to partnerships like this, and we are proud to have BigBinary as a Contributing member. BigBinary joins the Rails Foundation Core members Cookpad, Doximity, Fleetio, GitHub, Intercom, Procore, Shopify, and 37signals, and Contributing members AppSignal, Cedarcode, and Planet Argon. Everything we do at the Rails Foundation is thanks to the generous contributions by these members. If your company would like to become a Contributing member, please reach out to foundation@rubyonrails.org. We’d love to hear from you."
