["https://rubyonrails.org/2025/2/3/clio-joins-rails-foundation"]
title = "Ruby on Rails — Clio joins the Rails Foundation as a Contributing member"
description = "We’re excited to welcome Clio as the newest Contributing Member of the Rails Foundation. Since its founding in 2008, Clio has relied on Rails to build tools that empower legal professionals to manage their practices more efficiently."
full_description = "We’re excited to welcome Clio as the newest Contributing Member of the Rails Foundation. Since its founding in 2008, Clio has relied on Rails to build tools that empower legal professionals to manage their practices more efficiently. Today, Clio’s product suite is the largest and most sophisticated Rails-based system in the legal industry. The platform supports over 150,000 legal professionals globally, processing millions of transactions daily, and Rails remains at the heart of it all. From the very beginning, the Ruby and Rails community’s commitment to learning and open-source innovation has aligned with Clio’s own mission: to transform the legal industry for all. This is largely what attracted Clio to the Rails Foundation’s mission - particularly the focus on education and documentation - both efforts to ensure that Rails will remain accessible to developers of all skill levels. Rails has been at the core of Clio’s success, and joining the Rails Foundation is our way of giving back to a community that has given us so much. We’re proud to be a home for Rails developers, a part of the thriving ecosystem of companies built on Rails, and an active contributor to its future. Jonathan Watson, CTO Clio’s engineering team has now grown to over 300 developers, building and maintaining a sophisticated ecosystem powered by multiple Rails monoliths. These monoliths form the backbone of Clio’s product suite: Grow, Manage, Payments, and Accounting. (And, yes - they are hiring!) Clio developers actively contribute to the Rails ecosystem by maintaining open-source gems focused on testing, deployment, and performance improvements. The team has also contributed patches and enhancements to the framework itself. Clio has long been an active supporter of the Rails and Ruby community, supporting events and meetups. Those who attended Rails World in Toronto might remember Clio’s booth sponsorship and their unforgettable Day 1 party. More recently, they’ve taken their community involvement further by supporting and hosting the Toronto Ruby meetup group."
