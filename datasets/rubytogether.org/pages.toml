full_description = 'Ruby Central Supporting the Ruby Community Since 2001 January 2025 Newsletter Help Make RailsConf 2025 Happen Ruby Central Welcomes Marty Haught as Interim Lead for RubyGems and Bundler Ruby Central is a non-profit organization dedicated to supporting the worldwide Ruby community. We organize the annual RubyConf and RailsConf software conferences, support community growth, and provide vital infrastructure for the Ruby programming language. Learn more about us. RubyGems RubyGems is the code-packaging system for the Ruby community. Started as a project in 2004 by the directors of Ruby Central and friends, RubyGems has grown into an invaluable and wide-ranging resource for the sharing of code among all members of the community. With hosting support by Ruby Central, more information can be found at rubygems.org. Supporting Ruby Central, Inc The Ruby language could only have developed so robustly with its dedicated community. Our community consists of talented and passionate individual developers and many dynamic companies that recognize the value of helping foster a strong, sustainable environment for Ruby development. Join our Member Community, Become a Sponsor, or donate your time – there are numerous ways to Support Us! If you are looking for ways to help or have questions, please contact us at contact@rubycentral.org. 42 Conferences and counting. RubyConf RubyConf is the Ruby community’s annual celebration of all things Ruby! Every fall, we gather Ruby enthusiasts together to enjoy detailed talks about exciting new projects; meet and network with other Ruby developers; and hear from the community’s leading minds, including Yukihiro Matsumoto ("Matz"), the creator of the Ruby language. Learn more RailsConf RailsConf is the world’s largest gathering of Rails developers, brought together to further discussion and learning about building, managing, and testing Rails applications. With a specific focus on Rails, conference topics can range from new users to administration to advanced techniques. Learn more Directors Ben Greenberg David Corson-Knowles Freedom Dumlao Treasurer Kinsey Durham Grace Vice President Naijeria Toweett Secretary Ufuk Kayserilioglu Valerie Woolard President Staff Ally Vogel Operations Manager Chelsea Kaufman Transitional Executive Director Diesha Cooper Chief Financial Officer Rhiannon Payne Marketing Director Tom Chambers Sponsorship Manager Open Source Team André Arko RubyGems Arun Agrawal RubyGems.org Colby Swandale RubyAPI & RubyGems.org David Rodríguez Bundler & RubyGems Ellen Marie Dash RubyGems Gift Egwuenu RubyGems Irene Kannyo RubyGems Content Marketing Manager Josef Šimánek RubyGems.org Martin Emde RubyGems Marty Haught Director of Open Source Samuel Giddins RubyGems.org'
