title = "Support Us"
description = """
Would you like to help support Ruby Central? Here are the ways you can help:


Consider Becoming a Major Donor

Click here to learn more about annual sponsorship packages and get contacted by our Executive Director.


Support Our Conferences

Buy a ticket to RubyConf 2024 or become a sponsor!


One-off"""
full_description = "Support Us Would you like to help support Ruby Central? Here are the ways you can help:Consider Becoming a Major DonorClick here to learn more about annual sponsorship packages and get contacted by our Executive Director.Support Our ConferencesBuy a ticket to RubyConf 2024 or become a sponsor!One-off DonationsHere is a link to pay-what-you-can donations. We know everyone's finances vary, and not everyone can afford to donate regularly, so we created this donation link to allow anyone to support our work at any level, as a one-time gift.Sustaining MembershipsIndividual and Corporate Ruby Central monthly memberships help support us sustainably. Having regular monthly support helps us plan our open source projects more effectively.You can sign up for a membership here.If your employer is registered with Benevity, you can get enable employer matching funds for us through your company's profile. Our org profile is here.These memberships started life as Ruby Together in 2015 and merged with Ruby Central in 2021. You can read more about Ruby Together and Ruby Central coming together and about Ruby Central's journey to today.Ruby Central’s membership program was created so that the community can come together to help us achieve our mission. We are here to create pathways for the community to come together, to maintain the software ecosystem, and enable individuals in their learning journeys.The membership program helps the organization achieve this vision. As a member you receive a monthly newsletter on how we’ve spent the money raised and how we’re moving the ecosystem forward. You’ll also be invited to a private online space which allows you to be a bigger voice at the table.VolunteerWe could use volunteer help for almost everything. If you're interested in sharing your time, view our Leadership page on all of our volunteering opportunities.CodeOur community is filled with developers! For cost- and time-saving reasons, we have moved away from custom software and toward hosted solutions. It's the only feasible option for a tiny non-profit like ourselves. This marketing site is run on Ghost, which also manages our membership program (payments, account self-service, and newsletters). The Ghost theme is open-sourced and available here if you want to help fix problems or propose redesigns. Our Open Source Sustaining Membership Sponsors Fastly Sentry Shopify Sidekiq Sovereign Tech Fund Zendesk ← Back Home"
