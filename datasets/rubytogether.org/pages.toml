["https://rubytogether.org/news/make-railsconf-happen"]
title = "Help Make RailsConf 2025 Happen"
description = """
RailsConf is the longest-running gathering of Rails developers, dedicated to building, managing, and testing Rails applications. After almost 20 years, RailsConf 2025 will be our final conference — a celebration of the Rails community and the incredible legacy we’ve built together.

We are aiming to host RailsConf in July in"""
full_description = "Help Make RailsConf 2025 Happen RailsConf is the longest-running gathering of Rails developers, dedicated to building, managing, and testing Rails applications. After almost 20 years, RailsConf 2025 will be our final conference — a celebration of the Rails community and the incredible legacy we’ve built together.We are aiming to host RailsConf in July in Philadelphia. We’re working hard to finalize these plans and secure our venue, but we need your support to make this vision a reality.A crowded hallway of happy developers.Here’s how you can helpRegister your interestLet us know if you’re interested in attending RailsConf 2025 by sharing your email below! Understanding the level of interest from the community is crucial as we move forward with planning and making this event a success.Become a sponsorHelp make RailsConf 2025 a reality by becoming a sponsor. Early commitments are crucial for us to mitigate financial risks and create a memorable event. Sponsoring this final RailsConf will showcase your company’s dedication to the Rails and Ruby ecosystem, provide unparalleled visibility in the global Rails community, and highlight your support for open source and developer education. Email Tom Chambers at sponsors@rubycentral.org to get involved.We hope that this final chapter of RailsConf will serve as a tribute to the many developers and organizations who have been part of shaping the Rails ecosystem. Together, we’ll celebrate the legacy of Rails while looking ahead to Ruby Central’s future—with RubyConf as our flagship event, more support for regional conferences, and deeper investments in open source projects like RubyGems and Bundler."
