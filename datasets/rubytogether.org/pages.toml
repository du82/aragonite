full_description = '''Ruby Conferences Ruby Central organizes two annual software conferences, RubyConf and RailsConf.RubyConf The Ruby community’s annual celebration of all things Ruby! Every fall, we gather Ruby enthusiasts together to enjoy detailed talks about exciting new projects; meet and network with other Ruby developers; and hear from the community’s leading minds, including Yukihiro Matsumoto ("Matz"), the creator of the Ruby language.2024 Chicago - Get Tickets Now!RubyConf 2024 – Chicago, IL – November 13–15, 2024: Sign-up to learn when more information about RubyConf is available!Established in 2001, RubyConf has fostered the vibrant Ruby community by uniting experienced and budding Ruby enthusiasts of all backgrounds to explore new concepts, collaborate, and engage in social activities across the United States.RubyConf 2024 – Chicago, IL – November 13–15, 2024RailsConf The world’s largest gathering of Rails developers, brought together to further discussion and learning about building, managing, and testing Rails applications. With a specific focus on Rails, conference topics can range from new users to administration to advanced techniques.Get your supporter tickets for RailsConf 2025 here: https://ti.to/railsconf/2025RailsConf 2024RailsConf 2024 – Detroit, MI – May 7-9: Register for RailsConf Now!TitoTeam TitoThe Video Showcases RailsConf 2024 DetroitRubyConf 2023 San Diego (with Matz's Keynote)RailsConf 2023 AtlantaRubyConf 2022 Houston and Providence RailsConf 2022 PortlandRubyConf 2021 DenverTo view our full video catalog, watch our Youtube channel.Ruby CentralRuby Central is a non-profit organization that supports and advances the Ruby programming language and a welcoming and diverse worldwide Ruby community. We organize the annual software conferences, RubyConf and RailsConf, to which this video channel is dedicated. Learn more | www.rubycentral.org RubyConf is the Ruby community’s Fall celebration of all things Ruby! Ruby enthusiasts gather to enjoy detailed talks about exciting new projects; meet and network with other Ruby developers; and hear from the community’s leading minds, including Yukihiro Matsumoto (“Matz”), the creator of the Ruby language. RailsConf is the world’s largest gathering of Rails developers, brought together in the Spring to further discuss and learn about building, managing, and testing Rails applications. With a specific focus on Rails, conference topics can range from new users to administration to advanced techniques.YouTubeVolunteer at our ConferencesLearn MoreRegional US and International Ruby ConferencesA curated calendar of Ruby conferences worldwide, including speaking opportunities and registration info.For feedback on this page, contact us. March 07, 2023 ← Back Home'''
