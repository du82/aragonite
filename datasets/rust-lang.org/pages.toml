["https://rust-lang.org/what/cli"]
title = "Command-line apps - Rust Programming Language"
description = "A language empowering everyone to build reliable and efficient software."
full_description = '''Catch errors now What if the config file is missing or corrupt? What if the content of that one environment variable is empty? These cases are easy to forget about! But thanks to its approach to error handling and its library design, Rust will point out these “what if” situations before you even run your program. Rust’s error handling Easily extend later Rust allows you to be flexible in the way you organize your code. Start with just a single file and, when you need more features, refactor your application with the confidence that you aren’t breaking anything. Refactoring Rust Define your inputs use clap::Parser; /// Read some lines of a file #[derive(Debug, Parser)] struct Cli { /// Input file to read file: String, /// Number of lines to read #[structopt(short = 'n')] num: usize, } Write your tool use std::{error::Error, fs::read_to_string}; fn main() -> Result<(), Box> { let args = Cli::parse(); read_to_string(&args.file)? .lines() .take(args.num) .for_each(|line| println!("{}", line)); Ok(()) }'''
