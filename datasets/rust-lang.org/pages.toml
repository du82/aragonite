["https://rust-lang.org/community"]
title = "Community - Rust Programming Language"
description = "A language empowering everyone to build reliable and efficient software."
full_description = "Community Where to talk Users forum The Rust Users Forum is a place for Rust users to communicate about anything and everything related to Rust. Ask questions here, coordinate on project ideas, whatever you like! Visit Forum Internals forum The Rust Internals Forum is a place for discussion about the development of Rust itself – including work on the compiler as well as the design of the language and the standard library. Visit Forum Chat platforms Development of Rust, and general chatter happens on several chat platforms. Check out general channels and more on the Rust Discord server, or check out the teams page to find where specific teams meet. Discord Zulip Learn more about teams Visit Forum Visit Forum Discord Zulip Learn more about teams Where to learn Read about Rust The Rust programming language has many qualities, but Rust’s greatest strength is the community of people who come together to make working in Rust a rewarding experience. Stay up to date with the Rust community! This Week in Rust Get in contact We’d like to hear from you! Not sure where or who to ask a question? Want to get involved but aren’t sure how? The community team is eager to connect you with someone who can help! email community@rust-lang.org This Week in Rust email community@rust-lang.org Events Find a local meetup or conference There are more than 90 Meetups and several conferences worldwide in over 35 countries. Rustaceans meet periodically in Rust User Groups. They are a great introduction to the community and a great way to learn and socialize with other people with a similar interest. Meetings are usually informal and open to everyone. View Calendar Run your own event As Rust grows, we’re excited to help folks start their own local events. From hack and learns, to meetups, to conferences, the Rust Events Team is ready to help support you. Registering your event helps us to keep track of our community efforts and allows us to connect you to speakers or other members in your area. email community@rust-lang.org Community Standards We are committed to providing a friendly, safe and welcoming environment for all, regardless of gender, sexual orientation, disability, ethnicity, religion, or similar personal characteristic. Our code of conduct sets the standards for behavior in all official Rust forums. If you feel you have been or are being harassed or made uncomfortable by a community member, please contact any of the Rust Moderation Team immediately. Whether you are a regular contributor or a newcomer, we care about making the community a safe space for you. Message the moderation team read the code of conduct read the moderation guidelines"
