title = "Production - Rust Programming Language"
description = "A language empowering everyone to build reliable and efficient software."
full_description = "Production Whitepapers npm Read how npm, who runs the JavaScript Registry of the same name, found Rust to be boring to deploy. Read the whitepaper Tilde Learn how Rust helps Tilde, makers of Skylight, use minimal resources to enable feature-rich performance monitoring of their customers’ applications. Read the whitepaper Highlights Dropbox Several components of the Dropbox core file-storage system were written in Rust as one step in part of a larger project to pursue greater datacenter efficiency. It’s currently used by all Dropbox storage today, serving >500 million users. Read More Yelp Yelp has developed a framework in Rust for real-time A/B testing. It’s used across all Yelp websites and apps, and experiment subjects range from UX to internal infrastructure. Rust was chosen because it’s as fast as C (cheap to run) and safer than C (cheap to maintain). Watch the Video Does your company use Rust? Consider sharing your experience with us! Reach out to the Leadership Council See how companies are using tools in specific development domains! Command Line Learn More WebAssembly Learn More Networking Learn More Embedded Learn More Supporting Rust Interested in sponsoring work on Rust? A Rust conference? We’d love to hear from you. Message the Leadership Council License Rust is dually licensed under the Apache License Version 2.0 and the MIT license, making it suitable for all sorts of projects. Policies: License"
