full_description = "Governance How Rust is built by its community RFC process Each major decision in Rust starts as a Request for Comments (RFC). Everyone is invited to discuss the proposal, to work toward a shared understanding of the tradeoffs. Though sometimes arduous, this community deliberation is Rust’s secret sauce for quality. Learn More Teams Leadership council Charged with the success of the Rust Project as whole, consisting of representatives from top-level teams Members & Contacts Compiler team Developing and managing compiler internals and optimizations Members & Contacts Dev tools team Contributing to and creating the Rust development tools Members & Contacts Edition team Managing the editions of Rust Members & Contacts Infrastructure team Managing the infrastructure supporting the Rust project itself, including CI, releases, bots, and metrics Members & Contacts Language team Designing and helping to implement new language features Members & Contacts Library team Managing and maintaining the Rust standard library and official rust-lang crates Members & Contacts Moderation team Helping uphold the code of conduct and community standards Members & Contacts Working Groups Command-line interfaces (CLI) working group Focusing on the end-to-end experience of writing terminal apps, both large and small, in Rust. Members & Contacts Embedded devices working group Focusing on improving the end-to-end experience of using Rust in resource-constrained environments and non-traditional platforms Members & Contacts Game development working group Focusing on making Rust the default choice for game development Members & Contacts Secure Code working group Making it easy to write secure code in Rust Members & Contacts Security Response WG Triaging and responding to incoming vulnerability reports Members & Contacts Triage working group Triaging repositories under the rust-lang organisation Members & Contacts"
year_published = 2025
