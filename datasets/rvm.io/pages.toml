nd 2.4.0-rc1 Add support for Rubinius 3.69 Drop support for GoRuby #3786 Upgrade RubyGems to 2.6.8 Binaries: Ruby 2.3.0, 2.3.1 #3774, 2.3.3 #3822 binaries for Debian 8 x86_64 Ruby 2.0.0-p648, 2.1.5, 2.1.9, 2.2.5, 2.3.0 #3693, 2.2.6 and 2.3.2 #3809, 2.3.3 #3820 binaries for Ubuntu 16.04 Ruby 2.3.1 for Centos 6.6 #3712 Install CentOS binaries on both RedHat and CentOS machines #3735"
