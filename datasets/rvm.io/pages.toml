["https://rvm.io/blog/2017/03/toptal-grant"]
title = """
RVM: Ruby Version Manager -  Toptal Grant"""
full_description = "RVM received a grant from Toptal! We are happy to announce that we received a financial grant from Toptal, which would sponsor our work on RVM for the next 6 months. Toptal is an exclusive network of the top software developers, designers, and finance experts in the world. Top companies rely on Toptal agile talent for their most important projects. Toptal will be contributing up to $100,000 in grants over the next year to help offset the cost of living for Toptalers contributing to open source. Toptalers from all over the world and various levels of open source experience have applied for the program with very compelling projects and ideas. The applications were scored based on the impact that the project would have on the open source and remote communities, social good, and general public interest in the project. The committee has reached a final verdict on the first round of recipients and happily, RVM was part of the first round of financing amongst 3 other projects."
