["https://rwx.gg/what/knowledge/mvkb"]
title = "What is Minimum Viable Knowledge Base?"
full_description = "What is Minimum Viable Knowledge Base? Consumable, Composable, Sustainable, Shareable A minimum viable knowledge base is a knowledge base that follows the “do one thing well” philosophy. While the MVKB might contain thousands of knowledge nodes it makes sense as a single entity which itself can be composed into other knowledge bases. The minimum viable adjectives refer to the simplest possible tech requirement possible, which almost always means some form of Markdown — not a wiki — in a Git repo. The simple README can then be shared with the world without much fuss at all."
