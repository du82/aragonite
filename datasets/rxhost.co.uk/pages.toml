full_description = "Domain Nameservers Our Nameservers ns1.rxhost.co.uk ns2.rxhost.co.uk What is DNS? Each computer on the internet is allocated a unique number (IP Address). For example a server could be assigned the IP address 123.234.546.123. Computers deal well with numbers, however, as humans, we don’t do so well when it comes to remembering numbers. And so domain names come to the rescue! The Domain Name System (DNS), simply assigns a “name” to an IP address. This then allows us to use the name to access a server, rather than having to remember it’s unique IP Address. Behind the scenes your web browser asks a DNS server which IP address corresponds to the domain name you have entered, so it knows which server to request information from."
