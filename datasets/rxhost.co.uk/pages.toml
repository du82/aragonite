full_description = "Testimonials I would like to express my thanks for the superb work that you have undertaken on my website. Until your company took over the design and management of the site I was unaware of how to enhance my business and further its status on the Internet, to be honest, it was a mystery to me and previous designers were a disappointment. However, with you onboard I am happy to say that the design was constructed within the promised schedule, with the minimum of fuss and at an acceptable cost. But the most outstanding point to me is the continued advice and assistance that is freely given whenever I should contact you, which is pretty often. Your ideas are always fresh and innovative and your customer aftercare is second to none, I feel that you are not only my web designer but an interested partner in the business. As you know I have already recommended you to others, which will continue and I am sure our business relationship shall flourish well into the future. Fred Kauter bodyshop.uk.com The sense of urgency and priority by RX Host is First Class. You’re by far missing out if you’re with anybody else. Top notch all round. I was with a previous host provider and needed to change over as things were becoming complicated and support tickets were never getting answered. RX Host made the whole bad experience a super fantastic one come my discovery of their services. You simply cannot go wrong with RX Host. Excellent service, excellent communications and excellent provider. Paul I. glassmullagh.com RX Host is freakin’ awesome! Chirag et al are the best thing to happen to web hosting since cPanel. Seriously though, even before I was a paying customer, Chirag was eager to help (even on weekends). Now that I’ve fully switched over, I’m glad to pay him for this really excellent customer service and fair pricing. I would recommend them in a heartbeat! Cyrus F. cfarivar.org I want to thank you for your help on our WordPress website www.airgraphics.com . You were able to do what our former provider could not do and you did it quickly and completely. It is great to have a resource like RX Host to rely upon. You were thorough and offered ideas and assistance beyond what I could have expected. I know that AIR Graphics will be utilizing your services as we expand our website. I only wish we had started the entire process with you. Kevin Cully Executive Vice President, AirGraphics.com After years of using the same hosting company I am so glad to have made the switch to Rx Host, what a difference they always respond quickly to my questions and have really gone above and beyond when I made an error uploading a file and it crashed my site. Can’t recommend them enough and will definitely upgrade to their premium hosting in the future. Thank you very much Rx Host for a great service. Tracey R. I want to show a little love for the guys at RX Host. They took my site, www.sexandthesingledad.com from blah to bitchin’ and they can absolutely do the same for you. Their rates were very reasonable and they listened to what I wanted and got the work done quickly. If you need web hosting or site design you need to check them out at www.rxhost.co.uk.” “Chirag at rxhost.co.uk worked his butt off to help me out with [the new look site]!” JR Reed I have been very pleased with the work of RX Host. The response to my queries has been incredibly fast. The support has been brilliant. If you’re looking to set up something efficiently while remaining cost effective, then I would definitely recommend RX Host. They’re particularly good for start ups that don’t have the money to spend spend spend but need to get an effective platform going upon which to advertise their services. Lisa C. Holistic Health"
