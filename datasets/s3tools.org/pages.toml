["http://s3tools.org/repositories"]
title = "Amazon S3 Tools: Package Repositories for Linux"
description = "S3cmd package repositories for selected Linux distributions: CentOS, RHEL, Fedora, SLES, Debian, Ubuntu."
full_description = "Note: the following LINUX repositories are NOT up to date.Download the latest version of S3cmd from SourceForge or GitHub or get the s3cmd package from your Linux distribution's own repositories. S3cmd 1.5.0 pre-release packages in Fedora, RHEL, CentOS, Debian In an effort to get additional users testing the 1.5.0 codebase, in preparation for a final 1.5.0 release, new packages have been published for Fedora, RHEL, CentOS, and Debian. You may wish to use these, rather than each distribution’s primary release repositories. In Fedora, you can find a release slightly newer than 1.5.0-beta1 in the updates-testing repository for Fedora 18, 19, 20, and rawhide. $ sudo yum --enablerepo updates-testing install s3cmd In EPEL (Red Hat Enterprise Linux RHEL, CentOS, etc) you can find a release slightly newer than 1.5.0-beta1 in the updates-testing repository for EPEL 6 and beta/7. Please note that EPEL must be installed for this to work. $ sudo yum --enablerepo epel-testing install s3cmd In Debian, you can find a release slightly newer than 1.5.0-beta1 in the Experimental repository S3cmd 1.0.0 packages in CentOS, RHEL, Fedora, SLES, Debian, Ubuntu Some Linux distributions now provide s3cmd package in their base or add-ons package repositories. Unfortunately these repositories are very often “frozen” in the sense that package versions are never upgraded. From some points of view this is an understandable policy, however it also means that you will never automatically get any new features of future s3cmd releases. For example – Fedora 8 (FC8) has been released with s3cmd 0.9.8.1 and even if security issues may get fixed in their updates repository it is unlikely that the users of FC8 will ever get any new features from s3cmd 1.0.0, for instance. Therefore we decided to provide package repositories / RPM repositories / DEB repositories for some of the most popular distributions with the always most recent s3cmd package ready for installation. Here is a list of currently supported distributions: Repository .repo file RHEL 5 & CentOS 5 s3tools.repo RHEL 6 & CentOS 6 s3tools.repo Use also for Amazon Linux AMI and Fedora SLES 11 s3tools.repo Debian & Ubuntu We can’t provide packages for discontinued RPM based distributions like openSUSE 10.3 or Fedora 10 and older. However you can grab the .src.rpm file from one of the repositories above and rebuild it for your system, that should work just fine. How to add s3cmd 1.0.0 repository to RedHat, CentOS and Fedora There are probably some graphical package managers in RedHat based systems, but we only use yum ;-) As a superuser (root) go to /etc/yum.repos.d Download s3tools.repo file for your distribution. Links to these .repo files are in the table above. For instance wget http://s3tools.org/repo/RHEL_6/s3tools.repo if you’re on CentOS 6.x Run yum install s3cmd if you don’t have s3cmd rpm package installed yet, or yum upgrade s3cmd if you already have s3cmd rpm installed and long for a newer version. You will be asked to accept a new GPG key – answer yes (perhaps twice). That’s it. Next time you run yum upgrade you’ll automatically get the very latest s3cmd for your system. How to add s3cmd 1.0.0 repository to SLES 11 There are two ways to do it. The one described below uses command line package management tool called zypper, the other way is using YaST. Become a superuser (root) Find the s3tools.repo URL in the table above and run for instance: zypper addrepo http://s3tools.org/repo/SLES_11/s3tools.repo if you’re on OpenSUSE 11.0 Install s3cmd with: zypper install s3cmd You will be asked whether you want to trust a new GPG key. Answer yes two times. That’s it. The s3cmd package will now be kept up to date together with all your other installed packages. Debian & Ubuntu Our DEB repository has been carefully created in the most compatible way – it should work for Debian 5 (Lenny), Debian 6 (Squeeze), Ubuntu 10.04 LTS (Lucid Lynx) and for all newer and possibly for some older Ubuntu releases. Follow these steps from the command line: Import S3tools signing key: wget -O- -q http://s3tools.org/repo/deb-all/stable/s3tools.key | sudo apt-key add - Add the repo to sources.list: sudo wget -O/etc/apt/sources.list.d/s3tools.list http://s3tools.org/repo/deb-all/stable/s3tools.list Refresh package cache and install the newest s3cmd: sudo apt-get update && sudo apt-get install s3cmd"
