["https://s3tools.org/news"]
title = "Amazon S3 Tools: S3cmd News"
full_description = 'We have released s3cmd version 2.4.0: Added "setversioning" command for versioning configuration Added "settagging", "gettagging", and "deltagging" commands for bucket/object tagging Added "setobjectretention" and "setobjectlegalhold" commands Added "setownership" and "setblockpublicaccess" commands Added "cfinval" command to request Cloudfront to invalidate paths Added "--keep-dirs" option to have the folder structure preserved on remote side Added --skip-destination-validation option for "setnotification" command Added "--max-retries" flag and "max_retries" config option Added FIPS support Added "object ownership" and block public access" values to "info" command output for buckets Added to "ls" command a "DIROBJ" tag for directory objects in S3 remote Added server profiles to run-tests.py to skip tests depending on the server type Fixed "TypeError: sequence item 1: expected str instance, bytes found" error with Python 3.12 Fixed a missing return for "object_batch_delete" of S3.py Fixed "object is not callable" error because of md5 FIPS test Fixed "compute_content_md5 is not defined" error for "setversioning" Fixed list objects to use NextMarker when only prefixes are returned Fixed upload to not retry when an S3 compatible server is full Fixed recursive delete of objects named with whitespace Fixed the mime type when uploading directories to be "application/x-directory" Fixed "string indices must be integers" error for sync when in dry-run mode Fixed SignatureDoesNotMatch error when modifying an object on Cloudflare R2 Fixed Cloudfront invalidation issue for paths with wildcard or special characters Fixed Cloudfront crash because of error reporting for retries Fixed Cloudfront "unable to parse URL" error Improved the handling of "empty" files on the remote side to sync with local folders Improved "abortmp" command by requiring an object to avoid bad accidents when using Ceph Improved file download by retrying when encountering SlowDown or TooManyRequests errors Improved error messages in case of connection error or host unreachable Improved error messages to be more explicit for upload errors after retries Improved remote2local attributes setting code Improved remote2local with more explicit error messages when setting attributes Improved remote2local output messages by using the "mkdir" prefix instead of "make dir" Improved the SortedDict class Improved run-test.py by using "--include" when calling Curl instead of "-include" Improved GitHub CI by enabling pip cache in actions/setup-python Improved GitHub CI by adding a "codespell" check on push and PRs Updated GitHub CI tests to use more recent versions of Minio and Python Upgraded GitHub actions Cleanup and update of copyright headers, docs, comments and setup.py Cleanup to fix "invalid escape sequence" syntax warnings Many other bug fixes and cleanups Download from here: SourceForge Source code also available on GitHub: https://github.com/s3tools/s3cmd Dec 12, 2023'
