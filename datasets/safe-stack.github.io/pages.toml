["https://safe-stack.github.io/docs/quickstart"]
title = "Quickstart - SAFE Documentation"
description = "Documentation for SAFE"
full_description = '''Quickstart This page provides some basic guidance on getting up and running with your first SAFE application. Install pre-requisites You'll need to install the following pre-requisites in order to build SAFE applications The .NET 8 SDK node.js (v18.x or v20.x) npm (v9.x or v10.x) Azure CLI (optional - required for Azure deployments) Install an F# code editor You'll also want an IDE to create F# applications. We recommend one of the following great IDEs: VS Code + Ionide extension Visual Studio JetBrains Rider Create your first SAFE app Open a command prompt Create a new directory on your machine and navigate into it Enter dotnet new install SAFE.Template to install the SAFE project template (only required once ) Enter dotnet new SAFE to create a new SAFE project Enter dotnet tool restore to install local tools like Fable. Enter dotnet run to build and run the app Open a web browser and navigate to http://localhost:8080. Congratulations - after a short delay, you'll be presented with a basic SAFE application running in your browser! The application will by default run in "development mode", which means it automatically watches your project for changes; whenever you save a file in the client project it will refresh the browser automatically; if you save a file in the server project it will also restart the server in the background. The standard template creates an opinionated SAFE Stack app that contains everything you'll need to start developing, testing and deploying applications into Azure. Alternatively there is a "bare-bones" SAFE Stack app with minimal value-add features. Take a look at the template options to see a side by side comparison of features available between the standard and minimal template. Troubleshooting Still have issues getting started? Check out the troubleshooting page.'''
