title = "SAFE"
description = "The best way to write functional-first web applications."
full_description = "Develop full stack web applications entirely in F#. Benefit from the power that F# and functional programming brings both on the server with .NET Core but also in the browser. Share types and functions seamlessly - no more manual mapping between browser and server languages! SAFE Stack brings not only confidence to you but a sense of satisfaction and enjoyment to your development cycle. You’ll be delighted with the ease at which you can create client-server web applications. SAFE Stack isn’t a walled garden or closed ecosystem. It runs on top of existing ecosystems and tools including ASP .NET Core, .NET Core, Webpack, React and NPM. Using SAFE Stack means you can continue to use the libraries and tools that you already know and love, but still take advantage of the extra benefits that F# brings to the table! F# levels up the safety of your system without making you write reams of code. Gain more confidence that your code does what you expect it to do, with no dynamic typing required for the browser. And the SAFE Stack runs on trusted platforms such as ASP .NET, .NET Core, NPM and Webpack - popular, high-performance and reliable platforms with millions of users."
