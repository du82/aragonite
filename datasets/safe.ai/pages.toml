["https://www.safe.ai/blog/leading-ai-companies-join-white-houses-voluntary-commitment-to-enhance-ai-safety"]
title = "Leading AI Companies Join White House's Voluntary Commitment to Enhance AI Safety | CAIS"
description = "The Center for AI Safety state its support for the White House's securing of voluntary commitments from leading AI companies."
full_description = "We strongly support the voluntary commitments by AI companies announced today by the White House. These commitments include: red-teaming AI systems’ dangerous capabilities (bio, cyber, self-replication, and so on) and sharing information between organizations regarding safety risks, dangerous or emergent capabilities, and attempts to circumvent safeguards. Such commitments are essential to establishing a safe AI ecosystem. We also commend the seven companies that have voluntarily made these commitments. Their participation illustrates how corporations can take steps toward public accountability and improved oversight while remaining competitive. These commitments will hopefully set the stage for binding and detailed commitments. The Center for AI Safety is a nonpartisan institution dedicated to doing original research that enables and promotes safe and ethical AI development and research. We collaborate with a global network of stakeholders to ensure that safe, reliable, and secure AI and machine learning technologies are developed and deployed to benefit humanity. Cookies Notice: This website uses cookies to identify pages that are being used most frequently. This helps us analyze data about web page traffic and improve our website. We only use this information for the purpose of statistical analysis and then the data is removed from the system. We do not and will never sell user data. Read more about our cookie policy on our privacy policy. Please contact us if you have any questions."
