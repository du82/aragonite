["http://www.safe.ai"]
title = "Center for AI Safety (CAIS)"
description = "Center for AI Safety. Reducing societal-scale risks from AI by advancing safety research, building the field of AI safety researchers, and promoting safety standards."
full_description = "In contrast to the dramatic progress in AI, many basic problems in AI safety have yet to be solved. Our mission is to reduce societal-scale risks associated with AI by conducting safety research, building the field of AI safety researchers, and advocating for safety standards. The course offers a comprehensive introduction to how current AI systems work, their societal-scale risks, and how to manage them. To support progress and innovation in AI safety, we offer researchers free access to our compute cluster, which can run and train large-scale AI systems. The CAIS Philosophy Fellowship is a seven-month research program that investigates the societal implications and potential risks associated with advanced AI. Current systems already can pass the bar exam, write code, fold proteins, and even explain humor. Like any other powerful technology, AI also carries inherent risks, including some which are potentially catastrophic. As AI systems become more advanced and embedded in society, it becomes increasingly important to address and mitigate these risks. By prioritizing the development of safe and responsible AI practices, we can unlock the full potential of this technology for the benefit of humanity. At the Center for AI Safety, our research exclusively focuses on mitigating societal-scale risks posed by AI. As a technical research laboratory: We have compiled a list of frequently asked questions to help you find the answers you need quickly and easily. CAIS’ mission is to reduce societal-scale risks from AI. We do this through research and field-building. By field-building, we mean expanding the research field of AI safety by providing funding, research infrastructure, and educational resources. Our goal is to create a thriving research ecosystem that will drive progress towards safe AI. You can see examples of our projects on our field-building page. CAIS is always looking for value-driven, talented individuals to join our team. You can also make a tax-deductible donation to CAIS to help us maintain our independent focus on AI safety here."
