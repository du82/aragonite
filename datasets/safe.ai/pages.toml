["https://safe.ai/blog/representation-engineering-a-new-way-of-understanding-models"]
title = "Representation Engineering: a New Way of Understanding Models | CAIS"
description = "Representation engineering is an exciting new field which explores how we can better understand traits like honesty, power seeking, and morality in LLMs. We show that these traits can be identified by looking at model activations, and these same traits can also be controlled. This method differs from mechanistic approaches which focus on bottom-up interpretations of node to node connections. In contrast, representation engineering looks at larger chunks of representations and higher-level mechanisms to understand models in a 'top-down' fashion."
full_description = "Interpreting and controlling models has long been a significant challenge. Our research ‘Representation Engineering: A Top-Down Approach to AI Transparency’ explores a new way of understanding traits like honesty, power seeking, and morality in LLMs. We show that these traits can be identified live at the point of output, and they can also be controlled. This method differs from mechanistic approaches which focus on bottom-up interpretations of node to node connections. In contrast, representation engineering looks at larger chunks of representations and higher-level mechanisms to understand models. Overall, we believe that this ‘top-down’ method makes exciting progress towards model transparency, paving the way for more research and exploration into understanding and controlling AI. Transparency and honesty are important features of models - as AI becomes more powerful, capable and autonomous, it is increasingly important that they are honest and predictable. If we cannot understand and control models, AI would have the capacity to lie, seek power and ultimately subvert the goals of humans. In time, this would present a substantial risk to society as AI advances. To fully reap the benefits of AI, we need to make sure that these risks are balanced with better understanding of LLMs. Representation Engineering is an innovative approach to enhancing our understanding and control of AI by observing and manipulating the internal representations - weights or activations - that AI uses to understand and process information. This method involves identifying specific sets of activations within an AI system that correspond to a model’s behavior. Furthermore, we can utilize these representations to control the model’s behavior. In the paper, we first explore the representation of honesty in the model. To do this, we first ask the model to answer a question truthfully. Then we ask the model to answer the same question but with a lie. We observe the model state each time, and the resulting difference in the activations provide an insight into when a model is being honest and when a model lies. We can even tweak the internal representations of the model so that it becomes more honest, or less honest. We show that the same principles and approach applies across other concepts such as power seeking and happiness, and even across a number of other domains. This is an exciting and new approach to model transparency - and sheds light on not only honesty, but a variety of other desirable traits."
