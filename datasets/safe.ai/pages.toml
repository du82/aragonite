["https://safe.ai/work/compute-cluster"]
title = "Compute Cluster | CAIS"
description = "The Center for AI Safety is launching an initiative to provide large-scale compute resources for ML safety research. Apply here."
full_description = "Conducting useful AI safety research often requires working with cutting-edge models, but running large-scale models is expensive and often cumbersome to implement. As a result, many non-industry researchers are unable to pursue advanced AI safety research. To address this issue, CAIS runs an initiative to provide free compute for research projects in ML safety, based on a cluster of 256 A100 GPUs, with a dedicated team to provide support to cluster users. The CAIS Compute Cluster is specifically designed for researchers who are working on the safety of machine learning systems. For a non-exhaustive list of topics we are excited about, see Unsolved Problems in ML Safety or the ML Safety Course. We may also consider other research areas provided appropriate justification of the impact on ML safety is provided. Instructions on what your proposal should contain and other details required can be found in the application form. Project proposals can be brief and in many cases we expect that 250 words will be sufficient. Applicants will by default be granted access for an initial term of 4 months, which aims to align with major conference deadlines. For example, applicants accepted in February 2025 would have access until June 2025, after the NeurIPS paper submission deadline in late May 2025. Users of the cluster may request to extend their access at the end of this term, provided suitable progress is demonstrated. We support leading experts in a diverse range of ML safety research directions, some of which are listed below. Associate Professor of Biomedical Data Science and, by courtesy, of Computer Science and Electrical Engineering at Stanford University. We showed that it was possible to automatically bypass the safety guardrails on GPT-4 and other AI systems, causing the AIs to generate harmful content such as instructions for building a bomb or stealing another person’s identity. Our work was covered by the New York Times. We evaluated the tendency of AI systems to make ethical decisions in complex environments. The benchmark provides 13 measures of ethical behavior, including measures of whether the AI behaves deceptively, seeks power, and follows ethical rules."
year_published = 2025
clearnet = "https://safe.ai/work/compute-cluster"
