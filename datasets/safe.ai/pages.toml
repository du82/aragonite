["https://safe.ai/blog/ai-safety-ethics-and-society"]
title = "AI Safety, Ethics, and Society | CAIS"
description = "AI Safety, Ethics and Society is a textbook and online course providing a non-technical introduction to how current AI systems work, why many experts are concerned that continued advances in AI could pose severe societal-scale risks, and how society can manage and mitigate these risks."
full_description = "The blog post below is partly adapted from the book's preface.‍We are excited to announce the launch of AI Safety, Ethics and Society, a new textbook and online course. The course aims to provide an introduction to how current AI systems work, why many experts are concerned that continued advances in AI could pose severe societal-scale risks, and how society can manage and mitigate these risks. The textbook and other course materials are available to read online here and are forthcoming in print with Taylor & Francis. We will be running an online course based on the textbook from July-October 2024 - apply here by May 31st to take part.Key featuresInterdisciplinary approach. Ensuring that AI systems are safe is more than just a machine learning problem - it is a societal challenge that cuts across traditional disciplinary boundaries. A full understanding of the risks posed by AI requires knowledge in several disparate academic disciplines, which have so far not been combined in a single text. This book was written to fill that gap and adequately equip readers to analyze AI risk. It takes a holistic approach drawing on insights from engineering, economics and other relevant fields. The goal is to foster a thoughtful and nuanced understanding of AI safety, equipping participants equip readers with a solid understanding of the technical, ethical, and governance challenges that we will need to meet in order to harness advanced AI in a beneficial way. The book does not assume prior technical knowledge of AI.Time-tested, flexible frameworks. In order to have a solid grasp of the challenges of AI safety, it is important to consider the broader context within which AI systems are being developed and applied. The decisions of and interplay between AI developers, policy-makers, militaries, and other actors will play an important role in shaping this context. Since AI influences many different spheres, this book focusses on time-tested, formal frameworks to provide multiple lenses for thinking about AI, relevant actors, and AI's impacts. The frameworks and concepts used are highly general and are useful for reasoning about various forms of intelligence, ranging from individual human beings to corporations, states, and AI systems. While some sections of the book focus more directly on AI risks that have already been identified and discussed today, others set out a systematic introduction to ideas from game theory, complex systems, international relations, and more. We hope that providing these flexible conceptual tools will help readers to adapt robustly to the ever-changing landscape of AI risks.Table of contents"
