["https://www.safe.ai/blog/three-policy-proposals-for-ai-safety"]
title = "Existing Policy Proposals Targeting Present and Future Harms | CAIS"
description = "We highlight three regulatory suggestions – improved legal liability frameworks, increased scrutiny on the development cycle of AI products, and the importance of human oversight in high-risk AI systems – advocated by institutions like the AI Now Institute and the European Union."
full_description = "The Center for AI Safety exists to reduce societal-scale risks associated with AI. We will soon release policy recommendations to mitigate the future impacts of AI systems, especially harms from increasingly capable general-purpose models. At the same time, we believe many existing policy proposals designed to address the present impacts of AI systems would also promote AI safety if implemented. There is considerable overlap between the regulatory objectives of safety researchers and those of researchers concerned with the fairness, accountability, transparency, and ethics of AI systems. Building consensus around regulatory proposals can help to effectively promote their implementation, thereby both mitigating the present harms of AI systems and preventing future societal-scale risks. The purpose of this one-page document is to describe three existing policy proposals which we believe promote AI safety. This list is nonexhaustive. Cookies Notice: This website uses cookies to identify pages that are being used most frequently. This helps us analyze data about web page traffic and improve our website. We only use this information for the purpose of statistical analysis and then the data is removed from the system. We do not and will never sell user data. Read more about our cookie policy on our privacy policy. Please contact us if you have any questions."
