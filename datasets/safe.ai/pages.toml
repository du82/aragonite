["https://safe.ai/about"]
title = "About Us | CAIS"
description = "CAIS is working to reducing societal-scale risks from AI through field-building and research."
full_description = "Why we existCAIS exists to ensure the safe development and deployment of AIAI risk has emerged as a global priority, ranking alongside pandemics and nuclear war. Despite its importance, AI safety remains remarkably neglected, outpaced by the rapid rate of AI development. Currently, society is ill-prepared to manage the risks from AI. CAIS exists to equip policymakers, business leaders, and the broader world with the understanding and tools necessary to manage AI risk. AI risk has emerged as a global priority, ranking alongside pandemics and nuclear war. Despite its importance, AI safety remains remarkably neglected, outpaced by the rapid rate of AI development. Currently, society is ill-prepared to manage the risks from AI. CAIS exists to equip policymakers, business leaders, and the broader world with the understanding and tools necessary to manage AI risk. AI safety is highly neglected. CAIS reduces societal-scale risks from AI through research, field-building, and advocacy. CAIS conducts research solely focused on improving the safety of AIs. Through our research initiatives, we aim to identify and address AI safety issues before they become significant concerns. CAIS grows the AI safety research field through funding, research infrastructure, and educational resources. We aim to create a thriving research ecosystem that will drive progress towards safe AI. CAIS advises industry leaders, policymakers, and other labs to bring AI safety research into the real-world. We aim to build awareness and establish guidelines for the safe and responsible deployment of AI. CAIS is accelerating research on AI safety and raising the profile of AI safety in public discussions. Here are some highlights from our work so far: Scale the successful projects. We implement structures to make the project efficient and repeatable. ⟳ Cookies Notice: This website uses cookies to identify pages that are being used most frequently. This helps us analyze data about web page traffic and improve our website. We only use this information for the purpose of statistical analysis and then the data is removed from the system. We do not and will never sell user data. Read more about our cookie policy on our privacy policy. Please contact us if you have any questions."
