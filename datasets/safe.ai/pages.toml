["http://www.safe.ai/faq"]
title = "Frequently Asked Questions | CAIS"
description = "CAIS is working to reducing societal-scale risks from AI through field-building and research."
full_description = "CAIS’ mission is to reduce societal-scale risks from AI. We do this through research and field-building. To learn more, please see our Work & Projects Summary. By field-building, we mean expanding the research field of AI safety by providing funding, research infrastructure, and educational resources. Our goal is to create a thriving research ecosystem that will drive progress towards safe AI. You can see examples of our projects on our field-building page. We publish our research in ML conferences such as ICML, ICLR, and NeurIPS. Additionally, we promote safety research within the wider machine learning community by offering resources such as our compute cluster and providing high-quality infrastructure (e.g., workshops, socials, and competitions etc). To collaborate with us on research, see this form. Our work is driven by three main pillars: advancing safety research, building the safety community, and promoting safety standards. We understand that technical work will not solve AI safety alone, and prioritize having a real-world positive impact. You can see more on our mission page. CAIS is always looking for value-driven, talented individuals to join us. You can also make a tax-deductible donation to CAIS to help us maintain our independent focus on AI safety here. To collaborate with us on research, see this form. On May 30, 2023, CAIS released a statement signed by a historic coalition of AI experts — along with philosophers, ethicists, legal scholars, economists, physicists, political scientists, pandemic scientists, nuclear scientists, and climate scientists. You can read the statement and find the list of signatories here. Yes! We send a verification email to each signatory and verify each person before adding their name to the statement. In recent months, more AI experts and public figures have been speaking out about AI as an existential risk. An academic at the University of Cambridge, David Krueger, came up with the idea of developing a one-sentence statement (as opposed to a longer letter) to draw broader consensus, and we thought the time was right to make this happen. The statement was created independent of any input from the AI industry."
