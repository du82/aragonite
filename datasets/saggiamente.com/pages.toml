title = "Recensione Apple Mac mini M4 ed M4 Pro: più piccolo, più potente, il migliore"
description = "Bisogna infatti ricordare, che la RAM su Apple Silicon è condivisa da tutto il SoC, quindi anche dalla GPU. Questo è un lato negativo quando è poca, ma si"
full_description = 'Recensioni Hardware m4m4 promac mini Recensione Apple Mac mini M4 ed M4 Pro: più piccolo, più potente, il migliore Maurizio Natali 30 Novembre 2024 - 19:48 Fai clic per condividere su Facebook (Si apre in una nuova finestra)Fai clic qui per condividere su LinkedIn (Si apre in una nuova finestra)Fai clic qui per condividere su Twitter (Si apre in una nuova finestra)Fai clic per condividere su WhatsApp (Si apre in una nuova finestra)Fai clic qui per condividere su Pocket (Si apre in una nuova finestra) console.log("DONORS: Risposta grezza API: Referer mancante e IP non sicuro.");console.log("DONORS: Errore nella decodifica JSON: Syntax error"); Sono particolarmente affezionato al Mac mini. Dopo aver avuto un iMac G3, fu proprio uno di questi piccoli Mac, all’epoca con processore G4, a convincermi ad abbandonare Windows su tutte le postazioni di lavoro. Me lo prestò un caro amico, informatico in una tipografia, e quell’esperienza mi aprì letteralmente un mondo. Attesi qualche mese prima di acquistare il mio primo Mac, perché si vociferava di un imminente passaggio a Intel, e alla fine scelsi un MacBook Pro 15”, con cui iniziai una transizione che si rivelò fondamentale negli anni a venire. Negli anni ho avuto quasi tutti i Mac più importanti, ma non sono mai stato l’utente tipo del Mac mini: avevo bisogno di maggiore potenza, quindi iMac ben carrozzati e Mac Pro erano le uniche opzioni desktop per le mie esigenze. Eppure, il mini mi ha sempre affascinato, specialmente con l’arrivo della versione con Apple Silicon M1. Ancora più interessante è stata la generazione successiva, con il chip M2 e la possibilità di configurarlo con il più performante M2 Pro (recensione). La linea è poi passata direttamente all’M4 e M4 Pro, saltando la generazione M3. Il nuovo design compatto Con l’ultimo aggiornamento, Apple non si è limitata a cambiare il chip: ha riprogettato completamente il design. Il modello con M2 aveva mantenuto lo stesso design introdotto nel 2010 e che, all’epoca, aveva sostituito quello del primissimo con G4. Tuttavia, il passaggio ad Apple Silicon, con processi produttivi più avanzati, chip più compatti e consumi ridotti, aveva lasciato molto spazio vuoto all’interno. Apple ha colto l’occasione per ridisegnarlo, riducendone sensibilmente il volume. Non è piccolo come una Apple TV, ma la sua superficie è passata da 19,7 cm di lato a soli 12,7 cm, mentre l’altezza è aumentata leggermente: da 3,6 cm a 5 cm. Il risultato? Una riduzione del volume del 42%. Quasi dimezzato il peso: da 1,3 kg a circa 0,7 kg. Avrete notato che, fin qui, non ho menzionato il pulsante di accensione. Se ne è parlato tanto, quindi probabilmente già lo saprete: Apple ha deciso di posizionarlo sul fondo, nella parte posteriore sinistra. Lo spazio per metterlo altrove c’era, quindi è stata una scelta precisa, non tanto legata all’estetica, visto che sul retro avrebbe inciso poco. Peraltro, è sempre stato posizionato lì anche nei modelli precedenti e, come in quei casi, sarebbe stato possibile mimetizzarlo con la scocca semplicemente utilizzando lo stesso colore. All’inizio ho pensato fosse una sorta di “indicazione” su come usare il Mac mini: lasciarlo in standby senza spegnerlo definitivamente. Una logica che fila, considerando che il sistema operativo sfrutta i periodi di inattività per la manutenzione e che questi Mac con Apple Silicon consumano pochissimo. Tuttavia, ci sono situazioni in cui è necessario premere fisicamente il pulsante, quindi rimane una spiegazione incompleta. Più di recente, ho notato un dettaglio interessante nel video di presentazione. A differenza del Mac Studio, mostrato come un elemento statico accanto ad uno Studio Display, il Mac mini viene proposto spesso al centro della scrivania, al centro del tuo mondo. Una visione particolare che sembra suggerire un’interazione più diretta: collegare e scollegare periferiche, spostarlo, sollevarlo per premere il pulsante di accensione. Come se dicesse: “Guardami, sono piccolo, bello e leggero. Prendimi!”. Forse è la mia immaginazione, però mi è sembrato un messaggio molto chiaro che sarebbe interessante approfondire nel lungo periodo. Personalmente, però, preferisco un approccio più tradizionale. Ho sempre messo il Mac mini di lato rispetto al monitor, con un dock Thunderbolt nascosto sotto un rialzino di legno per avere le connessioni principali a portata di mano ma fuori dalla vista. A proposito, presto vi parlerò proprio di questo ottimo dock in una recensione dedicata. Connessioni e specifiche tecniche Il nuovo design, meno schiacciato, ricorda il Mac Studio. Come su quello, Apple ha aggiunto due porte frontali, che in questo caso s0no USB-C da 10Gbps. In più, sulla destra, c’è un’uscita audio per cuffie (anche con microfono). Manca un lettore di SD, che avrei apprezzato: forse non c’era spazio, o magari è stato lasciato fuori intenzionalmente per mantenere un vantaggio sul modello Studio. Sul retro si trovano le connessioni principali, a partire dall’alimentazione. Bello il cavo rivestito in tessuto, che termina con una spina italiana. Ma ciò che sorprende davvero è che, nonostante le dimensioni compatte, anche in questa versione l’alimentatore sia integrato. La porta Ethernet è presente, per fortuna. Alcuni rumor suggerivano che sarebbe stata eliminata, ma Apple ha deciso di mantenerla. Nella configurazione base è da 1Gbps, ma è possibile optare per quella da 10Gbps con un’aggiunta di 115€. Una cifra tutto sommato ragionevole, considerando il costo medio di queste schede di rete e i prezzi tipicamente elevati di Apple. Le connessioni senza fili sono le stesse per entrambi i modelli: Wi‑Fi 6E e Bluetooth 5.3. La differenza si trova nelle tre porte USB-C posteriori, che esteticamente sembrano identiche, tutte contrassegnate dal logo del fulmine. Tuttavia, sul modello M4 sono Thunderbolt 4, mentre sull’M4 Pro diventano Thunderbolt 5. Una scelta in linea con questa generazione, che adotta Thunderbolt 5 anche nei MacBook Pro con M4 Pro ed M4 Max e, senza dubbio, nel Mac Studio (quando sarà aggiornato). Al momento, la Thunderbolt 5 è ancora poco diffusa, ma rappresenta un dettaglio tecnico significativo per chi necessita di velocità più elevate e una maggiore capacità di gestione dei flussi dati, soprattutto in ambito professionale. Infatti, raddoppia la larghezza di banda rispetto alla Thunderbolt 4, passando da 40 Gbps a 80 Gbps, con picchi di 120 Gbps per applicazioni video. Configurazioni principali Vediamo ora le configurazioni principali disponibili, che ho racchiuso in questa tabella: Mac mini M4 M4 Pro Chip Apple M4 CPU 10-core GPU 10-core Apple M4 CPU 10-core GPU 10-core Apple M4 CPU 10-core GPU 10-core Apple M4 Pro CPU 12-core GPU 16-core Memoria 16GB 16GB 24GB 24GB Archiviazione SSD da 256GB (configurabile a 512GB, 1TB o 2TB) SSD da 512GB (configurabile a 1TB o 2TB) SSD da 512GB (configurabile a 1TB o 2TB) SSD da 512GB (configurabile a 1TB, 2TB, 4TB o 8TB) Prezzo 729 € 959 € 1189 € 1679 € Nella recensione analizzeremo due versioni in particolare: la base M4 con 16/256GB e la base M4 Pro con 24/512GB. Quest’ultima è nella configurazione binned, o ridotta, (chip con alcuni core disattivati per ridurre costi o migliorare la resa produttiva), mentre la versione completa, con CPU a 14-core (2-core in più) e GPU a 20-core (4-core in più), è disponibile come opzione con un sovrapprezzo di 230€. Una prima cosa interessante da notare è che non ci sono più versioni con 8GB di Memoria Unificata: si parte da 16GB, mantenendo lo stesso prezzo di prima. Purtroppo, però, la capacità dell’SSD rimane invariata, con il modello base che parte ancora da 256GB: un vero peccato. Su un desktop aggiungere un disco esterno è facile ed economico, ma partire da 512GB garantirebbe una migliore operabilità, velocità e maggiore durabilità del disco interno. Speriamo che l’abbandono dei 256GB avvenga con la prossima generazione M5. Per ora, il modello base offre un disco di dimensioni ridotte, ma con prestazioni comunque valide. Il disco da 512GB, testato da un Saggio Utente, si comporta ovviamente meglio, però quello con la stessa capacità presente nell’M4 Pro è decisamente più veloce. Quest’anno i dischi base da 256GB e 512GB sono veloci in lettura, un po’ di meno in scrittura Il chip M4 parte già con la configurazione completa sul Mac mini, a differenza dell’iMac, dove la versione base presenta 2-core disattivati sia sulla CPU che sulla GPU. L’M4 offre una CPU 10-core, con 4-core ad alte prestazioni e 6-core ad alta efficienza, una GPU a 10-core e il nuovo Neural Engine a 16-core. Passando all’M4 Pro ridotto che ho provato io, la CPU ha solo 2-core in più, ma il bilanciamento è molto diverso: 8-core ad alte prestazioni (il doppio) e 4-core ad alta efficienza (qui ne mancano 2). Anche la GPU migliora nettamente, aggiungendo ben 6-core in più. Mac mini base top top + opzione cpu Chip Apple M4 CPU 10-core GPU 10-core Apple M4 Pro CPU 12-core GPU 16-core Apple M4 Pro CPU 14-core GPU 20-core CPU core 4-core prestazioni 6-core efficienza 8-core prestazioni 4-core efficienza 10-core prestazioni 4-core efficienza Memoria 16GB, 24GB, 32GB 24GB, 48GB, 64GB 24GB, 48GB, 64GB Larghezza di banda 120 GBps 273 GBps 273 GBps Cambiano inoltre quantità e qualità della memoria: il modello base dell’M4 Pro parte da 24GB rispetto ai 16GB dell’M4 e può essere configurato fino a 64GB, contro i 32GB massimi dell’M4. Ma la differenza più significativa riguarda la larghezza di banda della memoria, nettamente superiore: 100 GBps per l’M4 e 273 GBps per l’M4 Pro. Prestazioni processore M4 l’abbiamo già visto nell’iPad Pro (recensione) ma, con i limiti di iPadOS, non è che se ne capissero davvero le potenzialità. Avere quest’ottimo chip su un vero Mac, fa tutta la differenza del mondo. Le prestazioni per singolo core su Geekbench 6 sono straordinarie, superiori a quelle di qualsiasi altro processore consumer attualmente in circolazione. Secondo l’attuale classifica pubblica, il miglior processore del mondo PC raggiunge un punteggio di 3137, già inferiore ai 3177 dell’Apple M3. L’M4, invece, vola a 3863, con la versione Pro che arriva fino a 3957. Qui sopra ho inserito solo i chip finora presenti nel Mac mini Il singolo core è fondamentale, poiché determina lo spunto e la reattività immediata del sistema. In un recente articolo, ho cercato di spiegare perché anche il multi-core è importante, a patto che venga realmente sfruttato. E a tal proposito, ho compilato un elenco di applicazioni professionali per creativi che fanno un uso efficace dei core multipli. Tutti i principali modelli di SoC Apple Silicon, ad oggi, nel multi-core Analizzando le prestazioni dei chip M4 e M4 Pro (sia nella versione ridotta che completa), si nota che occupano posizioni di rilievo nella gamma Apple Silicon. Il modello base dell’M4 supera già l’M2 Pro e l’M2 Max, posizionandosi più o meno a metà classifica. L’M4 Pro con CPU a 12-core (versione ridotta) supera l’M1 Ultra e l’M3 Max base, avvicinandosi all’M2 Ultra. L’M4 Pro completo, invece, supera tutti i chip visti finora: solo l’M4 Max fa meglio e, naturalmente, l’M4 Ultra che – quando arriverà – promette numeri da capogiro. La prova di rendering con Cinebench 2024 ha confermato che il singolo core della CPU di M4 spinge davvero forte, ma anche il multi-core non è affatto male. Un M4 arriva comunque davanti ad un M2 Pro completo, che era il top disponibile su Mac mini prima. M4 Pro base, quello ridotto a 12-core che ho provato io, supera di tanto sia M2 Max che M3 Pro, arrivando più nel territorio di M1 Ultra. Uso standard Nell’uso di tutti i giorni, sia M4 che M4 Pro rispondono benissimo. Sul modello base aiuta tanto tanto la partenza da 16GB, un cambio di rotta decisivo rispetto ai precedenti 8GB. Lo abbiamo visto in modo indiscutibile quando ho provato i MacBook Air M3 da 8GB e da 16GB insieme, perché il secondo non era solo più veloce in molti compiti, ma riusciva anche a fare delle cose che sul base andavano in errore. Un esempio banale: se provate ad eseguire il benchmark sulla GPU di Cinebench, non potete farlo con 8GB di Memoria Unificata. Bisogna infatti ricordare, che la RAM su Apple Silicon è condivisa da tutto il SoC, quindi anche dalla GPU. Questo è un lato negativo quando è poca, ma si rivela un vantaggio quando è di più. Sui PC, infatti, per avere 8GB o più per la GPU devi comprare una scheda grafica dedicata, cosa che aumenta le dimensioni, il prezzo e i consumi del computer. Sul Mac mini M4, invece, già con 16GB l’apertura di memoria per la GPU può essere tanta e anche il Neural Engine ci può fare affidamento. A tal proposito, introduco per la prima volta un test sul Machine Learning. Avrei voluto provare direttamente ad usare in locale una LLM come Qwen, ma questo non ci avrebbe dato la possibilità di avere una metrica univoca usabile anche tra qualche anno, quando il progetto avrà ovviamente versioni più moderne. Visto che è sempre utile vedere come si evolvono questi chip nelle varie generazioni, ho preferito appoggiarmi sempre a Geekbench e al loro tool standard sull’IA. Ho messo a confronto tutti i chip finora avuti sul mini e si vede chiaramente che, con generazioni uguali, il comparto del Neural Engine è molto simile – anche se i Pro conservano sempre dei vantaggi dovuti al contributo del resto del sistema. Tornando all’uso standard, che io intendo come navigazione, posta, videochiamate, riproduzione audio/video, social, documenti, ma anche programmazione, grafica illustrativa, per il web e manipolazione delle proprie foto, entrambi i Mac mini provati vanno benissimo. Il vantaggio prestazionale di quello M4 Pro non è una cosa che salta all’occhio, diciamo, ma puoi notarlo per una maggiore reattività quando lavori con tante, ma davvero tante, app contemporaneamente. Stessa cosa vale per chi compie molto del proprio lavoro tramite browser. Di base i due chip si comportano in modo identico e finché ci sono poche finestre e un numero di tab relativamente contenuto (diciamo fino a 10), l’M4 con 16GB fa benissimo il suo lavoro. Va anche ben oltre, sia chiaro, ma da quel punto in poi M4 Pro sarà avvantaggiato sia dal maggiore quantitativo di Memoria Unificata che dai core in più. La GPU Passando al comparto grafico, il test sintetico di Geekbench 6 con Metal vede la nuova generazione in grande vantaggio, visto che già M4 base va oltre l’M2 Pro del precedente Mac mini top di gamma. Se, però, si prendono in considerazione anche gli altri chip, l’M4 Pro più carrozzato non supera la metà della classifica. Questo perché, per quanto il singolo core sia molto potente, tutti i chip a partire dall’M1 Max dispongono di un numero significativamente maggiore di core. E ciò conferma che, per chi desidera giocare o lavorare intensivamente con la grafica, è sempre consigliabile puntare almeno sui modelli Max. L’attuale M4 Max, con GPU a 40-core, supera l’M1 Ultra nella sua configurazione più potente da 64-core e si avvicina molto all’M2 Ultra da 60-core. Però, però, però… i benchmark ci d'
