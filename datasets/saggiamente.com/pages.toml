title = "Hanno rotto il Black Friday, ma queste offerte sono davvero buone"
description = "Se vi sembra che oggi ci siano poche offerte interessanti, pur essendo il Black Friday, avete ragione. Dal momento che tutti gli store cercano da tempo di"
full_description = '''Fuori Programma black friday 2024promo Hanno rotto il Black Friday, ma queste offerte sono davvero buone Maurizio Natali 29 Novembre 2024 - 10:45 Fai clic per condividere su Facebook (Si apre in una nuova finestra)Fai clic qui per condividere su LinkedIn (Si apre in una nuova finestra)Fai clic qui per condividere su Twitter (Si apre in una nuova finestra)Fai clic per condividere su WhatsApp (Si apre in una nuova finestra)Fai clic qui per condividere su Pocket (Si apre in una nuova finestra) console.log("DONORS: Risposta grezza API: Referer mancante e IP non sicuro.");console.log("DONORS: Errore nella decodifica JSON: Syntax error"); Se vi sembra che oggi ci siano poche offerte interessanti, pur essendo il Black Friday, avete ragione. Dal momento che tutti gli store cercano da tempo di anticipare gli altri nella caccia ai nostri risparmi, quello che era un giorno, poi due e dopo un weekend, è diventato un’intera settimana. Le offerte che trovate su Amazon oggi, 29 novembre, sono in effetti partite giovedì 21. Per questo motivo non mi avete visto fare il solito articolo di mezzanotte con le offerte migliori. Diciamo pure che, alla fine, il giocattolo commerciale che era stato costruito si è rotto. Comunque, visto che seguiamo le offerte 365 giorni all’anno su @SaggeOfferte_Tech, noi qualcosa davvero interessante la stiamo trovando. Quindi, oltre ad invitarvi a seguirci su Telegram (anche su @SaggeOfferte_Extra e @SaggeOfferte_Pro), vi elenco alcuni prodotti molto buoni che hanno ricevuto uno sconto importante in queste ore. 💫🔝❤️Apple 2024 MacBook Air 13" Portatile con chip M3: display Liquid Retina da 13,6", 16GB di memoria unificata, 256GB di archiviazione SSD, CPU 8-core e GPU 8-core. Galassia999 € 1349 €Vai all'offerta Prima di tutto, ci metterei il MacBook Air 13″ M3 16GB/256GB di SSD. Sappiamo che tra 4/5 mesi dovrebbe uscire quello con M4, ma quello che molti non hanno capito è che M3 rappresentava già un salto importante rispetto ad M1 ed M2. Il motivo per il quale non si coglieva bene stava proprio nel quantitativo di memoria base che c’era prima. Nel mio confronto tra MacBook Air M3 8GB e 16GB ho dimostrato chiaramente che la versione con 8GB non era solo più lenta, ma non riusciva a compiere delle operazioni (cioè si bloccava o le erano precluse) che su quella da 16GB andavano benissimo. Quindi, ora che abbiamo 16GB su M3 a 999€, io non ci penserei due volte. Questa versione sul sito Apple costa 1349€, quindi ci sono 350€ di sconto. 💫🔝❤️Apple AirPods Pro 2 Auricolari wireless, Auricolari Bluetooth, Cancellazione attiva del rumore, Funzione Apparecchio acustico, Trasparenza, Audio spaziale personalizzato, Alta fedeltà, Ricarica USB-C189 € 279 €Vai all'offerta Restando in casa Apple, sono lieto di segnalarvi il miglior prezzo attuale per gli auricolari AirPods Pro 2 USB-C. So che potreste essere tentati dagli AirPods 4, lanciati di recente, ma non lasciatevi ingannare: i Pro 2 restano la scelta migliore. Anche se l’anno prossimo potrebbero arrivare gli AirPods Pro 3, questo modello rappresenta ancora il top tra gli auricolari Apple. Non ho ancora pubblicato la recensione degli AirPods 4, che sto provando da oltre un mese, ma vi anticipo il verdetto: sono un passo avanti rispetto agli AirPods 3, ma comunque inferiori ai Pro 2. Nessuna tecnologia degli AirPods 4 supera i Pro 2, che invece conservano vantaggi significativi: la riduzione del rumore è più efficace, i gommini adattabili (morbidi e confortevoli) garantiscono una vestibilità perfetta per tutti, e includono la nuova funzione di analisi dell’udito con equalizzazione automatica per un’esperienza audio ottimizzata. Funzionalità che gli AirPods 4 non offrono. Con il prezzo attuale più basso di sempre, se state valutando un investimento in auricolari di qualità, gli AirPods Pro 2 USB-C sono la scelta da fare. Ricordate che, con l’arrivo dei Pro 3 (probabilmente tra un anno), il prezzo di listino tornerà a 279€, e uno sconto così interessante, come quello attuale di 189€, potrebbe non ripresentarsi per anni. 💫🔝❤️Apple AirTag in confezione da 479 € 129 €Vai all'offerta Sempre l’anno prossimo, potrebbero uscire dei nuovi AirTag. Si dice che manterranno la stessa struttura, ma avranno un sistema anti-manomissione (perché alcuni tolgono il cicalino per tracciare meglio le persone). Comunque, rimangono dei prodotti molto utili, anche se costosi. Oggi abbiamo il miglior prezzo mai registrato per la versione con 4 AirTag a 79€. 💫🔝❤️Apple iPhone 16 128 GB: Telefono 5G con Controllo fotocamera, chip A18 e tanta autonomia in più. Compatibile con AirPods; Azzurro841,99 € 979 €Vai all'offerta Clicca per cambiare colore E impossibile non segnalare anche il nuovissimo iPhone 16 che sta mantenendo il suo minimo storico durante questo evento. È velocissimo con l’A18, ha un nuovo design molto riuscito e colori bellissimi. Arriverà anche Apple Intelligence su questo (non su iPhone 15) e ha il nuovo pulsante controllo fotocamera. Sul sito troverete tutta la recensione, ma è un buon momento per acquistarlo a 841€. 💫❤️Hisense TV 50" 4K Ultra HD 50A6N, Smart TV VIDAA U7, Dolby Vision, HDR 10+, DTS Virtual:X, Game Mode, Alexa Built-in, VIDAA Voice, Tuner DVB-T2/S2 HEVC 10, lativù 4K262,42 € 319 €Vai all'offerta Finora vi ho parlato di prodotti che conosco, che ho e che ho provato. Ora vi vorrei segnalare una TV che in realtà non possiedo, ma credo sia davvero un ottimo affare. Intanto: sapevate che HiSense è diventato il secondo produttore di TV al mondo dopo Samsung? Io ero convinto fosse ancora LG, ma un amico mi ha fatto notare che negli ultimi anni HiSense è cresciuta tantissimo e ha raggiunto il secondo podio più importante. La HiSense 50A6N non è una TV di quelle top per chi ha esigenze particolari, né in termini di diagonale che di tecnologia del pannello, però supporta HDR10+ e Dolby Vision, ha un telecomando con controllo vocale, è una 50″ 4K UHD, con tante app moderne integrate e altre installabili, ad un prezzo di soli 262,42€. Nella pagina leggerete una cifra più elevata, ma c’è una checkbox da attivare che dice “Applica coupon 56,58 €”… ed è così che si scende al prezzo che vi ho indicato. 💫🔝❤️LG OLED evo 65'', Serie C4 2024, OLED65C46LA, Smart TV 4K, Processore α9 Gen7, Brightness Booster, 40W, Dolby Vision, 4 HDMI 2.1 4K@144Hz, GSync, VRR, Alexa, ThinQ AI, webOS 24, Umber Brown1499,25 € 1899 €Vai all'offerta All’altro lato per qualità, specifiche e prezzo, si trova LG OLED 65 C46LA del 2024. Pannello ottimo, processore veloce, audio integrato di qualità superiore alla media e un 4K che arriva a 144Hz e supporta persino GSync. Questo schermo di listino costa 2599€, negli ultimi 30gg era sceso a 1899€, ma è in offerta temporanea a 1499€: però il numero è limitato, al momento è richiesto al 20%, non so quanto durerà. 💫❤️Logitech MX Master 2S wireless mouse Bluetooth Edition, multistrato, scorrimento veloce, ergonomico, ricaricabile, collega fino a 3 computer Mac/PC, Grafite49,99 € 60 €Vai all'offerta Anche se non è il più recente, il merito di rendere famoso questo mouse va proprio al Logitech MX Master 2s, che ha già tutte le caratteristiche presenti nei successivi. Erano anni che non si vedeva un prezzo così basso per questo modello, anzi, a 49,99€ non era mai arrivato, quindi vi consiglio di farci un pensierino. 💫🔝❤️Apple Watch Ultra 2 GPS + Cellular 49 mm Sportwatch con robusta cassa in titanio Nero e Alpine Loop Verde scuro - Large. Fitness tracker, GPS di precisione, tanta autonomia, luminoso display Retina819 € 909 €Vai all'offerta Sempre in casa Apple, va menzionato l’Apple Watch Ultra 2 titanio nero. La nuova colorazione di quest’anno che sta ottenendo molto consenso di pubblico. Non c’è molto altro da aggiungere sul prodotto, che rimane senza dubbio il migliore nell’offerta in quanto a funzionalità e durata della batteria. Io non faccio sport estremi, ma trovo comunque molto più comodo (e personalmente direi anche bello), il modello Ultra. Oggi c’è un 10% di sconto, raggiungendo 819€. Considerando che ha già la connessione cellulare, lo schermo grande e la costruzione in titanio, si dovrebbe confrontare con l’Apple Watch 10 con le stesse specifiche che costa di più (859€). Vi volevo consigliare un SSD esterno, che sono sempre molto utili. Soprattutto se prendete un Mac che ha 256GB di memoria interna, ma non solo: anche per progetti di lavoro pesanti e “spostabili”, per eseguire il backup del vostro computer, ecc.. Purtroppo, il costo delle memorie è salito dalla fine del 2023 ad oggi, con pochissime rare eccezioni. Vi posso personalmente sconsigliare gli SSD di SanDisk, perché c’è ancora in corso una particolare condizione per cui molti si stanno rompendo dopo un paio d’anni. È successo anche al mio pochi giorni fa, quindi ci ho messo una pietra sopra. Invece, per la mia esperienza di archiviatore seriale, vi posso dire che quelli di Samsung sono eterni. Ovviamente dipende dal modello, ma di recente un Samsung T5 che avevo non riusciva più a supportare la registrazione video in 6K della mia videocamera, sono andato a controllare e la velocità di scrittura era scesa del 50%. Male, penserete, ma siccome io metto la data di inizio lavori su ogni disco, sono andato a controllare e quello era del 2018! È stato 4 anni pieni a supportare scritture di centinaia di GB almeno 3 volte al giorno e non so davvero come abbia retto tanto. Inoltre, non si è rotto (come è successo a quello SanDisk di cui vi ho parlato), ha semplicemente ridotto la sua velocità – difatti l’ho regalato a mio padre che continua ad usarlo perfettamente dato che è sempre molto più veloce di un HDD meccanico. Dunque, considerando la questione delle memorie più costose, oggi non troviamo un best price vero, ma rispetto a ieri i prezzi sono scesi. 🔝❤️Samsung MU-PE1T0K/EU T7 Shield SSD Portatile da 1 TB, USB 3.2 Gen.2, beige, compatibile con Mac, iPhone e iPad97,34 € 102,50 €Vai all'offerta 🔝❤️Samsung MU-PE2T0K/EU T7 Shield SSD Portatile da 2TB, USB 3.2 Gen.2, beige, compatibile con Mac, iPhone e iPad149,99 € 169,26 €Vai all'offerta L’ottimo Samsung T7 Shield 1TB si paga 97€, mentre quello da 2TB 149€. Ripeto, non sono minimi storici, ma sono i prezzi più bassi dal 2023. E non c’è motivo di pensare che scenderanno facilmente, perché i motivi per cui le memorie costano di più non sono cambiati. Difatti, facendo delle ricerche nei comparatori, noterete che tutti gli store ormai hanno prezzi più alti. 💫🔝❤️D-Link DUB-M810 Hub USB di Tipo C 8 in 1, con HDMI 4K e 1080 p, 2 Porte USB 3.0 e USB 2.0, Lettore di Schede SD e MicroSD, Porta Rete RJ45 1 Gbps, Un USB C di Ricarica fino a 100 W19,99 € 50 €Vai all'offerta Anche se c’erano altre cose interessanti da segnalare, vorrei chiudere questa carrellata con un accessorio sempre più utile oggigiorno: un hub. Si chiama D-Link DUB-M810, un nome che ti fa passare la voglia, ma poi lo guardate ed è uno dei pochi ad avere sia la porta Ethernet che porte USB-A, doppio lettore SD/microSD (separati) e uscita HDMI. Oltre ad una porta USB-C passante per la ricarica. Ovviamente è uno di quei prodotti che scalda molto, come tutti i dock e gli hub, ma è assolutamente normale. Comunque, questo è un vero affare perché partiva da 80€ (ok, è tanto), si è trovato intorno ai 50€ negli ultimi 30gg, oggi viene venduto a 19,99€. E comunque state comprando un prodotto di una marca seria. Questo è solo un estratto di alcune promo interessanti, ma di cose interessanti ne capitano. Il mio consiglio, a rischio di sembrare noioso, è quello di seguirci su Telegram. Non pubblico un nuovo articolo ogni volta che esce una nuova offerta top, mentre lì le trovate tutte. Ah, ovviamente i prezzi possono cambiare se l’offerta termina, nel caso fatecelo sapere nei commenti. Grazie e buoni acquisti. Black Friday 2024 Hanno rotto il Black Friday, ma queste offerte sono davvero buone 3 mesi fa Partita la Settimana del Black Friday 2024: ecco alcune offerte, in attesa del 29 novembre 3 mesi fa Alcuni link presenti nell'articolo possono presentare codici di affiliazione con i partner sponsorizzati. Fai clic per condividere su Facebook (Si apre in una nuova finestra)Fai clic qui per condividere su LinkedIn (Si apre in una nuova finestra)Fai clic qui per condividere su Twitter (Si apre in una nuova finestra)Fai clic per condividere su WhatsApp (Si apre in una nuova finestra)Fai clic qui per condividere su Pocket (Si apre in una nuova finestra) Maurizio Natali Titolare e caporedattore di SaggiaMente, è "in rete" da quando ancora non c'era, con un BBS nell'era dei dinosauri informatici. Nel 2009 ha creato questo sito nel tempo libero, ma ora richiede più tempo di quanto ne abbia da offrire. Profondo sostenitore delle giornate di 36 ore, influencer di sé stesso e guru nella pausa pranzo, da anni si abbronza solo con la luce del monitor. Fotografo e videografo per lavoro e passione. Sul Web Twitter Google+'''
