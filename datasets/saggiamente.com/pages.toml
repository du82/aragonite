title = "Ecco la Sony A1 Mark II: prime impressioni e informazioni sulla regina delle ammiraglie"
description = "La nuova Sony A1 Mark II si posiziona come ammiraglia assoluta nella gamma Sony, al vertice di una lineup ben assortita. È un modello che coniuga tre aspetti"
full_description = 'Recensioni FotoVideo a1 mark iisony Ecco la Sony A1 Mark II: prime impressioni e informazioni sulla regina delle ammiraglie Maurizio Natali 19 Novembre 2024 - 15:30 Fai clic per condividere su Facebook (Si apre in una nuova finestra)Fai clic qui per condividere su LinkedIn (Si apre in una nuova finestra)Fai clic qui per condividere su Twitter (Si apre in una nuova finestra)Fai clic per condividere su WhatsApp (Si apre in una nuova finestra)Fai clic qui per condividere su Pocket (Si apre in una nuova finestra) console.log("DONORS: Risposta grezza API: Referer mancante e IP non sicuro.");console.log("DONORS: Errore nella decodifica JSON: Syntax error"); La nuova Sony A1 Mark II si posiziona come ammiraglia assoluta nella gamma Sony, al vertice di una lineup ben assortita. È un modello che coniuga tre aspetti principali: risoluzione (quasi a livelli della A7R V), velocità (dove il top è la A9 III) e video (con alcune specifiche superiori ad A7S III). Diciamo che la Sony A1 II si può considerare come la sintesi delle caratteristiche chiave di questi tre prodotti. La nuova Sony A1 Mark II Dalla prima versione del 2021 a questa nuova del 2024 vediamo un salto generazionale importante. Il cuore del sistema è il Sensore Exmor RS da 50.1MP con memoria integrata (stacked), doppio processore BIONZ XR per elaborazione ad alta velocità e nuova unità di elaborazione AI dedicata al riconoscimento dei soggetti (grazie alla quale si trova anche la nuova funzione completamente automatica). Le specifiche chiave derivanti da questo assetto includono: Ergonomia raffinata con nuovo grip e monitor multi-angolo (derivante dalla A7RV) Qualità immagine: sensore da 50.1MP con stabilizzazione fino a 8.5 stop Messa a Fuoco: prestazioni di riconoscimento soggetti migliorate Velocità: sistema avanzato con pre-capture e boost velocità Video: capacità 8K 30p e 4K 120p Workflow professionale migliorato Il grip ora è leggermente più arrotondato e l’angolazione favorisce una presa più naturale. Anche l’area intorno al pulsante di scatto è stata riprogettata, rendendo la pressione più fluida e ben direzionata, così da ridurre l’affaticamento nelle lunghe sessioni. Si mantiene l’ottima qualità costruttiva e la resistenza alle intemperie. La A1 II monta un mirino OLED di altissima qualità, con risoluzione QXGA e frequenza di 120 fps, ideale per seguire soggetti in rapido movimento. Il pannello è davvero grande, l’esperienza è fluida, senza lag visibile, e consente di mantenere sempre il controllo della scena. Lo schermo è orientabile su quattro assi (come su A7RV), facilitando inquadrature da angolazioni difficili. Con una diagonale di 3,2 pollici e 2,09 milioni di punti, garantisce una visualizzazione chiara e dettagliata, anche in condizioni di luce intensa (ma la luminosità si modifica sempre manualmente). Caratteristiche base Anche se il sensore mantiene la risoluzione di 50.1MP introduce miglioramenti significativi nella gestione del rumore ad alti ISO. Interessante anche la possibilità di avere ben 21MP in modalità APS-C, cosa che offre maggiore flessibilità operativa. Il sistema di esposizione automatica è stato notevolmente migliorato. L’algoritmo AE ora è circa il 20% più stabile rispetto al modello precedente, specialmente nelle situazioni di controluce. Un sensore IR dedicato, insieme all’unità di elaborazione AI, migliora significativamente le prestazioni del bilanciamento del bianco, soprattutto nelle scene in ombra. La gamma ISO standard va da 100 a 32000, espandibile da 50 a 102400. Il miglioramento più significativo si nota nelle sensibilità medie: a ISO 6400 la nuova A1 II mostra una gestione del rumore nettamente superiore rispetto alla precedente A1, mantenendo un maggior dettaglio e una migliore nitidezza. La stabilizzazione si evolve notevolmente con un sistema a 5 assi che raggiunge 8.5 stop al centro e 7.0 stop ai bordi – il record nella serie Alpha. Un miglioramento sostanziale rispetto ai 5.5 stop del modello precedente. La stabilizzazione del sensore lavora in sinergia con quella ottica eventualmente presente negli obiettivi per massimizzare l’efficacia. Il sistema Active Mode è stato potenziato con una modalità Dynamic che offre un 20% di stabilizzazione in più. Sistema AF evoluto Il sistema autofocus rimane uno dei punti di forza, con caratteristiche ulteriormente migliorate: 759 punti di messa a fuoco con copertura del 92% del sensore Prestazioni AF eccellenti in condizioni di scarsa illuminazione (fino a EV -4.0) Funzionamento continuo fino a f/22 Nuova funzione di tracking che permette di regolare la sensibilità dell’AF in base alla velocità del soggetto (Stable/Standard/Responsive) Un’interessante novità è l’introduzione di punti AF di dimensioni XL e XS, oltre alla possibilità di creare aree di messa a fuoco personalizzate tramite ghiere e rotelle. Questo offre maggiore flessibilità nella composizione, particolarmente utile per la fotografia naturalistica e sportiva. Altre caratteristiche nuove derivano dall’introduzione di un chip AI dedicato, che migliora il riconoscimento di: Pose umane complete (non solo viso/occhi) Animali con tracking di occhi/testa/corpo Veicoli e insetti con riconoscimento delle parti principali Introdotta anche una modalità Auto che seleziona in modo autonomia il soggetto da tracciare Secondo i test di Sony, la A1 II mostra un miglioramento fino al 50% nelle prestazioni di riconoscimento degli uccelli rispetto al modello precedente. Particolarmente interessante è la capacità di riconoscere soggetti anche in condizioni difficili, come quando sono ripresi diagonalmente o in zone poco illuminate. Il sistema riesce a identificare corpo, testa e occhi del soggetto con maggiore precisione. Operatività Pur avendo un sensore di così alta risoluzione, la potenza di calcolo della A1 II è così elevata che consente anche di arrivare a velocità di scatto elevatissime: 30 fps con AF/AE attivi alla massima risoluzione di 50.1MP, catturando fino a 153 scatti RAW compressi a 14 bit Pre-Scatto configurabile da 0.03 a 1 secondo Aumento temporaneo della velocità di scatto Scatto continuo senza blackout fino a f/22 Una delle funzioni più interessanti tra quelle implementate è il Pre-Scatto, che registra fino a 30 fps con tracking AF/AE attivo prima della pressione completa del pulsante di cattura. Questo permette di non perdere mai il momento decisivo, particolarmente utile nella fotografia naturalistica e sportiva. Un pulsante personalizzabile sul frontale, offre la possibilità di passare al volo da 15 a 30 fps. Una funzione che può fare la differenza in situazioni dinamiche come eventi sportivi o wildlife, dove ogni frazione di secondo conta, ma non si vuole scattare troppo velocemente se non necessario. Quando si scattano numerose immagini in sequenza, la A1 II è una utile alleata nel facilitare la vita del fotografo. È infatti possibile identificare rapidamente la prima foto di una singole scena, assegnare un rating (voto) ad ogni sequenza, scorrere nel catturato dando priorità ai contenuti con un voto più alto. Tutto direttamente in camera. Ci sono poi due modalità di scatto RAW composito: Pixel Shift Multi Shooting: combina 16 immagini per creare file da 199MP NR Shooting: novità assoluta che permette di ridurre drasticamente il rumore combinando da 4 a 32 scatti RAW Video Sul fronte video, la A1 II mantiene l’alto standard qualitativo del modello precedente, ma con alcune interessanti novità. La registrazione 8K sfrutta l’oversampling da 8.6K per una qualità superiore, con codec H.265 a 10bit e Long GOP fino a 30fps. In 4K abbiamo più opzioni diverse: Riprese 4K full-frame fino a 60fps con codec a scelta e tra 10 e 8 bit Modalità 4K 120fps con crop 1.1x Super 35mm con 4K in oversampling da 5.8K con crop 1,5x Il profilo S-Log3 è stato affinato per allinearsi meglio con le camere CineAlta come VENICE e BURANO. E con S-Cinetone si può avere un look cinematografico riducendo il lavoro di post-produzione e grading. Il sistema di riconoscimento soggetti in video è stato notevolmente potenziato: oltre agli umani, può ora tracciare animali, uccelli, insetti e persino mezzi di trasporto come auto, treni e aerei. Un bel passo avanti rispetto al modello precedente che si limitava al riconoscimento umano. Per i videomaker ci sono altre funzioni in più: Soft Skin Effect per risultati più morbidi nei ritratti Timer automatico per video Opzioni di slow motion a 24p in SS 1/48 e 1/96 Breathing Compensation, per eliminare le variazioni di inquadratura durante la messa a fuoco Time Code Sync per workflow professionali Output HDMI RAW per registrazione esterna La Sony A1 II introduce due modalità interessanti per la cattura di immagini fisse dal video: Shot Marks e Photo Capture. L’utilità di queste ultime sta nella possibilità di ottenere foto dai fermo immagine di un video appena catturato, mentre si riguarda. Una differenza sostanziale rispetto al passato è che ora l’azione successiva può essere eseguita immediatamente dopo l’arresto della registrazione, senza dover attendere la creazione delle immagini fisse. Controllo avanzato La Sony A1 II è pensata per semplificare il flusso di lavoro dei fotografi professionisti. Una novità è il microfono dedicato per le note vocali, integrato direttamente sul retro della fotocamera. Questa soluzione permette di registrare memo vocali con maggiore chiarezza rispetto al modello precedente, dove si utilizzavano i microfoni ambientali che captavano anche rumori indesiderati. Inoltre, è possibile caricare fino a 20 preset IPTC (per i metadata) direttamente nella fotocamera, una funzione pratica per chi ha bisogno di organizzare e classificare velocemente le immagini senza dover passare dal computer. Il sistema di navigazione a tre ghiere rende incredibilmente veloce la gestione di grandi quantità di immagini. Le opzioni di filtro sono davvero complete, permettendo di: Navigare per intervalli temporali (da 3 minuti fino a 24 ore) Filtrare per rating Visualizzare solo gli scatti con Shot Mark Saltare tra le immagini una per una o per gruppi di 100 Connettività Molto ricca la connettività, che include sia le funzionalità wireless che via cavo grazie al Wi-Fi ac dual band con tecnologia 2×2 MIMO, la porta USB-C 10Gbps e quella LAN 2.5GBASE-T per trasferimenti cablati ad alta velocità. Quest’ultima diventa particolarmente utile unita alla possibilità di trasferire grandi quantità di foto o video direttamente su server FTP. Una caratteristica che farà la felicità dei fotografi sportivi che devono inviare tanto materiale in tempo reale. Il layout delle porte è stato ristrutturato, seguendo il feedback degli utenti e l’esperienza maturata con la prima A1 e la A9 III. La disposizione è ora più razionale e include: Jack per microfono e cuffie ben separati, sotto due sportellini Porta HDMI Type-A più in basso USB Type-C (invertita di posizione rispetto la HDMI) Porta Ethernet, porta multi-interface e sync flash con sportellini singoli dedicati I nuovi accessori C’è anche una nuova impugnatura verticale VG-C5 che offre la stessa ergonomia della fotocamera. Questo accessorio, in grado di ospitare due batterie NP-FZ100, prolunga l’autonomia e permette di monitorare lo stato di carica di entrambe direttamente sul display. Una soluzione ideale per chi lavora in ambienti dove ricaricare è complicato o per chi non vuole interrompere la sessione per cambiare batteria. Un altro accessorio è il caricabatterie BC-ZD1, in grado di ricaricare simultaneamente due batterie NP-FZ100 con supporto USB Power Delivery, riducendo i tempi a circa 155 minuti. C’è anche l’adattatore DC-C1, che consente di alimentare direttamente la fotocamera attraverso un power bank senza occupare la porta USB. Infine, il nuovo oculare FDA-EP21 migliora la visibilità e la protezione dalla luce esterna grazie a un design avvolgente e a materiali morbidi. Cosa cambia? Vediamo gli aspetti principali che caratterizzano la Sony A1 Mark II: Nuova ergonomia ripresa dalla A9 III: presa più comoda, pulsante di scatto meglio posizionato Stessa elevata tropicalizzazione per resistere alle intemperie Ampio schermo LCD 3,2″ 2,09 milioni di punti multi-angolo a 4 assi Mirino OLED da 9,44 milioni di punti a 240fps 50,1 MP, sensore CMOS stacked Exmor RS, processore BIONZ XR Stabilizzazione sul sensore (IBIS) a 8,5 stop al centro e 7,0 stop agli angoli Chip AI per il riconoscimento AF in tempo reale sia per foto che per video Nuova modalità completamente automatica per l’AF Tracking avanzato in tempo reale e sistema AF con 759 punti ad alta densità Nessun blackout: fino a 30 fps in scatto elettronico continuo con tracking AF/AE e fino a 153 scatti RAW compressi Flash sincronizzato fino a 1/400 (APS-C 1/500) Funzioni RAW composito: NR Shooting: combina da 4 a 32 RAW per ridurre il rumore Pixel Shift Multi Shooting: foto da 166MP combinando 16 RAW Funzioni di pre-scatto e speed boost Registrazione video in 8K a 30p e 4K a 50/60p con campionamento colore 4:2:2 a 10 bit, All-I Compensazione del focus breathing Pulsanti ed ergonomia migliorati per una migliore presa Due slot compatibili con schede CFexpress Type A ed SD UHS-II Ricarica rapida: 155 minuti per ricaricare due batterie con il nuovo caricatore rapido Wi-Fi integrato con 802.11ac 2×2 MIMO, USB SuperSpeed da 10Gbps (USB 3.2 Gen 2), LAN cablata 2,5Gbit Microfono dedicato per memo vocali Supporto per streaming USB UVC/UAC fino a 4K a 30p Alta affidabilità per l’uso in ambienti di lavoro impegnativi Di seguito vi propongo una tabella di confronto con la precedente Sony A1, evidenziando solo le novità. Caratteristiche diverse Sony A1 Sony A1 Mark II Qualità d’immagine e velocità Pre-Cattura No Sì (0,3 sec) Funzione Speed Boost No Sì (30, 20, 15) IBIS 5,5 stop fino a 8,5 stop RAW Composito Pixel Shift Multi Shooting Pixel Shift Multi Shooting + NR shooting AF Riconoscimento dei soggetti Persone (foto e video) / Animali e Uccelli (solo foto) Automatico / Persone / Animali / Uccelli / Auto / Treni / Aerei (foto e video) Video LUT Utente No Importazione LUT Utente Movie IBIS Mode Active mode Active mode + Stabilizzazione inquadratura Altre funzioni video – Auto Framing Focus Map Effetto pelle morbida Timer registrazione video Operatività Mirino Quad XGA @ 240fps Quad XGA @ 240fps + Hi 120fps LCD Screen Inclinabile (sopra e sotto) Articolato 4 assi Connessioni Altre connessioni USB-C 10Gbps (USB 3.2) / HDMI tipo A / LAN 1Gbps / Flash Sync / Audio in/out USB-C 10Gbps (USB 3.2) / HDMI tipo A / LAN 2,5Gbps / Flash Sync / Audio in/out Autonomia in Foto Fino a 530 scatti (CIPA) Fino a 520 scatti (CIPA) Conclusioni La Sony A1 Mark II si conferma una fotocamera che punta a soddisfare sia fotografi che videomaker di alto livello, con un’attenzione particolare per l’affidabilità e la versatilità in ambiti professionali. Si trova all’apice della famiglia alpha perché riesce ad unire in un corpo solo il meglio delle caratteristiche dei vari segmenti. Raramente troviamo una tale risoluzione mantenendo altrettanta veloc'
