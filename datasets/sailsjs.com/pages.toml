["https://sailsjs.com/documentation/concepts/extending-sails"]
title = "Extending Sails"
full_description = "In keeping with the Node philosophy, Sails aims to keep its core as small as possible, delegating all but the most critical functions to separate modules. There are currently three types of extensions that you can add to Sails: * Core hooks, like http, request, etc. are hooks which are bundled with Sails out of the box. They can be disabled by specifying a hooks configuration in your .sailsrc file, or when lifting Sails programatically. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
