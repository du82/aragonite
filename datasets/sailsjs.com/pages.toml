["https://sailsjs.com/documentation/reference/blueprint-api/remove-from"]
title = "remove from"
full_description = '''This action removes a reference to some other record (the "foreign" or "child" record) from a collection of this record (the "primary" or "parent" record). Note that this does not actually destroy the foreign record, it just unlinks it. Say you're building an app for a small chain of grocery stores. Each store has a giant television screen that displays the current "Employees of the Month" at that store, so that customers and team members see it when they walk in the door. In order to be sure it is up to date, you build a scheduled job (e.g. using cron) that runs on the first day of every month to change the "Employees of the Month" for each store in their system. Let's say that, as a part of this scheduled job, we send a request to remove Dolly (employee #7) from store #16's employeesOfTheMonth: If you have WebSockets enabled for your app, then every client subscribed to the parent record will receive a notification about the removed child, where the notification event name is that of the parent model identity (e.g. store), and the “message” has the following format: For instance, continuing the example above, all clients subscribed to employee #7 (except for the client making the request) would receive the following message: Assuming employeesOfTheMonth was defined with a via, then either updated or removedFrom notifications would also be sent to any clients who were subscribed to Dolly, the child record we removed. If the via-linked attribute on the other side is also plural (e.g. employeeOfTheMonthAtStores), then another removedFrom notification will be sent. Otherwise, if the via points at a singular attribute (e.g. employeeOfTheMonthAtStore) then the updated notification will be sent. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier!'''
