["https://sailsjs.com/documentation/concepts/extending-sails/custom-responses"]
title = "Custom responses"
full_description = "Sails apps come bundled with several pre-configured responses that can be called from action code. These default responses can handle situations like “resource not found” (the notFound response) and “internal server error” (the serverError response). If your app needs to modify the way that the default responses work, or create new responses altogether, you can do so by adding files to the api/responses folder. Note: api/responses is not generated by default in new Sails apps, so you’ll have to add it yourself if you want to add / customize responses. This code handles a database error by sending a 500 error status and sending the error data to a view to be displayed. However, this code has several drawbacks, primarily: Any .js file saved in the api/responses/ folder can be executed by calling res.thatFileName(). For example, api/responses/insufficientFunds.js can be executed with a call to res.insufficientFunds(). The request and response objects are available inside of a custom response as this.req and this.res. This allows the actual response function to take arbitrary parameters. For example: All Sails apps have several pre-configured responses like res.serverError() and res.notFound() that can be used even if they don’t have corresponding files in api/responses/. Any of the default responses may be overridden by adding a file with the same name to api/responses/ in your app (e.g. api/responses/serverError.js). If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
author = "The Sails Company"
year_published = 2025
