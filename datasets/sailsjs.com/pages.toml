["https://sailsjs.com/documentation/reference/configuration/sails-config"]
title = "sails.config.*"
full_description = "For a conceptual overview of configuration in Sails, see https://sailsjs.com/documentation/concepts/Configuration. This page is a quick reference of assorted configuration topics that don't fit elsewhere, namely top-level properties on the sails.config object. Many of these properties are best set on a per-environment basis, or in your config/local.js. To set them globally for your app, create a new file in the config folder (e.g. config/misc.js) and add them there. The port setting determines which TCP port your Sails app will use to listen for incoming requests. Ports are a transport-layer concept designed to allow many different networking applications to run at the same time on a single computer. By default, if it’s set, Sails uses the port configured in your app (sails.config.port). If not, it checks to see if the PORT environment variable is set, and uses that if possible. Otherwise it falls back to port 1337. In production, you will probably want Sails to listen on port 80 (or 443, if you have an SSL certificate and are serving your site via https://), but depending on where your app is deployed, you may or may not need to actually modify this setting. For example, if you are deploying behind a proxy, or to a PaaS like Heroku, Azure App Service, or Deis, you probably won't need to configure sails.config.port, since in most cases that's handled automatically. For more guidance and tips related to deploying, scaling, and maintaining Sails in production, see Concepts > Deployment. By default, Sails will assume localhost as the host that will be listening for incoming requests. This will work in the majority of hosting environments you encounter, but in some cases (OpenShift being one example) you'll need to explicitly declare the host name of your Sails app. Setting explicitHost tells Sails to listen for requests on that host instead of localhost. In development, your Sails app will go out of its way to help you (for instance you will receive more descriptive error and debugging output)."
author = "The Sails Company"
year_published = 2025
clearnet = "https://sailsjs.com/documentation/reference/configuration/sails-config"
