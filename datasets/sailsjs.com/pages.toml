["https://sailsjs.com/documentation/concepts/models-and-orm/models"]
title = "Models"
full_description = '''A model represents a set of structured data, called records. Models usually correspond to a table/collection in a database, attributes correspond to columns/fields, and records correspond to rows/documents. For a complete walkthrough of available options when setting up a model definition, see Model Settings, Attributes, and Associations. Once a Sails app is running, its models may be accessed from within controller actions, helpers, tests, and just about anywhere else you normally write backend code. This allows your code's call model methods to communicate with your database (or even with multiple databases). There are many built-in methods available on models, the most important of which are the model methods like .find() and .create(). You can find detailed usage documentation for methods like these in Reference > Waterline (ORM) > Models. Every model in Sails has a set of methods exposed on it to allow you to interact with the database in a normalized fashion. This is the primary way of interacting with your app's data. Since they usually have to send a query to the database and wait for a response, most model methods are asynchronous. That is, they don't come back with an answer right away. Like other asynchronous logic in JavaScript (setTimeout() for example), that means we need some other way of determining when they've finished executing, whether they were successful, and, if not, what kind of error (or other exceptional circumstance) occurred. In Node.js, Sails, and JavaScript in general, the recommended way to handle this is by using async/await. Sails also provides a few other "resourceful pubsub" (or RPS) methods specifically designed for performing simple realtime operations using dynamic rooms. For more information about those methods, see Reference > WebSockets > Resourceful PubSub. In addition to the built-in functionality provided by Sails, you can also define your own custom model methods. Custom model methods are most useful for extrapolating controller code that relates to a particular model. They allow code to be pulled out of controllers and inserted into reusuable functions that can be called from anywhere (independent of req or res).'''
author = "The Sails Company"
year_published = 2025
clearnet = "https://sailsjs.com/documentation/concepts/models-and-orm/models"
