["https://sailsjs.com/documentation/reference/blueprint-api/replace"]
title = "replace"
full_description = '''This action resets references to "foreign", or "child" records that are members of a particular collection of this record (the "primary", or "parent" record), replacing any existing references in the collection. The fks parameter should be sent in the PUT request body, unless you are making this request using a development-only shortcut blueprint route, in which case you can simply include it in the query string as ?fks=[47,65]. Suppose you are in charge of keeping records for a large chain of grocery stores, and Dolly the cashier (employee #7) had been taking credit for being involved in a large number of purchases, when really she had only checked out two customers. Since the owner of the grocery store chain is very forgiving, Dolly gets to keep her job, but now you have to update Dolly's involvedInPurchases collection so that it only contains purchases #47 and #65: This returns Dolly, the parent record. Notice that her record only shows her being involved in purchases #47 and #65: If you have WebSockets enabled for your app, then every client subscribed to the parent record will receive one addedTo notification for each child record in the new collection (if any). For instance, continuing the example above, let's assume that Dolly's previous involvedInPurchases included purchases #65, #42, and #33. All clients subscribed to Dolly's employee record (except for the client making the request) would receive two kinds of notifications: addedTo for the purchase she was not previously involved in (#47), and removedFrom for the purchases she is no longer involved in (#42 and #33). Note that purchase #65 is not included in the addedTo notification, since it was in Dolly's previous list of involvedInPurchases. Assuming involvedInPurchases had a via, then either updated or addedTo/removedFrom notifications would also be sent to clients who were subscribed to any of the purchases we just linked or unlinked. If the via-linked attribute on the other side (Purchase) is also plural (e.g. cashiers), then an addedTo or removedFrom notification will be sent. Otherwise, if the via points at a singular attribute (e.g. cashier) then the updated notification will be sent.'''
