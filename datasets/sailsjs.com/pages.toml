["https://sailsjs.com/documentation/concepts/file-uploads"]
title = "File uploads"
full_description = '''Uploading files in Sails is similar to uploading files for a vanilla Node.js or Express application. However, the process may be unfamiliar if you're coming from a different server-side platform like PHP, .NET, Python, Ruby, or Java. But fear not: the core team has gone to great lengths to make file uploads easier without sacrificing scalability or security. Sails comes with a powerful "body parser", Skipper, which makes it easy to implement streaming file uploads—not only to the server's filesystem (i.e. hard disk), but also to Amazon S3, MongoDB's gridfs, or any other supported file adapter. Sails does not automatically virus scan file uploads, or do any other attempt to detect whether uploaded files might be infected, broken, or unusual. If you allow users to upload and share files with each other, it is your responsibility to protect your users from each other. Always assume any request coming into your server could be malicious or misrepresent itself. Files are uploaded to HTTP web servers as file parameters. In the same way that you might send a form POST to a URL with text parameters like "name", "email", and "password", you send files as file parameters like "avatar" or "newSong". Files should be uploaded inside of an action. Below is a more in-depth example that demonstrates how you could allow users to upload an avatar image and link it to an account. This example assumes that you've already taken care of access control in a policy, and that you're storing the id of the logged-in user in req.session.userId. When using the default receiver, file uploads go to the myApp/.tmp/uploads/ directory. This can be overridden using the dirname option. Note that you'll need to specify this option both when you call the .upload() function and when you invoke the skipper-disk adapter (so that you are uploading to and downloading from the same place). Any Node.js app (or other server-side app) that receives untrusted file uploads and stores them on disk should never upload those files into paths within a Java server web root or any directory that a legacy web server might automatically dive into recursively to execute arbitrary code files that it finds. For best results, upload files to S3 or a safe directory on disk. Always assume any request coming into your server could be malicious or misrepresent itself.'''
