["https://sailsjs.com/documentation/concepts/e-commerce"]
title = "E-commerce"
full_description = '''Like any web application framework, Sails can be used for e-commerce apps. Depending on your project's specific needs, you can use Sails as the base for your own custom solution, or integrate with an existing e-commerce platform. When building a custom e-commerce solution on Sails, there are a number of possibilities for how to structure your data. A good place to start is with four models: User (already included in the "Web app" template for new Sails apps), CartItem, Product, and Order. By including associations, you can track things like shopping carts and a user's individual order history. If the prospect of rolling custom e-commerce features from scratch is rather daunting, you may consider building your Sails app on top of an existing Sails-based platform (e.g. Ymple). If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame.'''
