["https://sailsjs.com/documentation/concepts/assets/default-tasks"]
title = "Default tasks"
full_description = '''The asset pipeline bundled in Sails is a set of Grunt tasks configured with conventional defaults designed to make your project more consistent and productive. The entire frontend asset workflow is completely customizable, while providing some default tasks out of the box. Sails makes it easy to configure new tasks to fit your needs. Concatenates JavaScript and CSS files, and saves concatenated files in .tmp/public/concat/ directory. Copies all directories and files, except coffeescript and less files, from the sails assets folder into the .tmp/public/ directory. Compiles LESS files into CSS. Only the assets/styles/importer.less is compiled. This allows you to control the ordering yourself (i.e. import your dependencies, mixins, variables, resets, etc. before other stylesheets). Automatically inject <script> tags for JavaScript files and <link> tags for CSS files. Also automatically links an output file containing precompiled templates using a <script> tag. A much more detailed description of this task can be found here, but the big takeaway is that script and stylesheet injection is only done in files containing <!--SCRIPTS--><!--SCRIPTS END--> and/or <!--STYLES--><!--STYLES END--> tags. These are included in the default views/layouts/layout.ejs file in a new Sails project. If you don't want to use the linker for your project, you can simply remove those tags. A grunt task to keep directories in sync. It is very similar to grunt-contrib-copy but tries to copy only those files that have actually changed. It specifically synchronizes files from the assets/ folder to .tmp/public/, overwriting anything that's already there. This grunt task is configured to transpile any >=ES6 syntax in your front-end Javascript files into code compatible with older browsers. Minifies client-side JavaScript assets. Note that by default, this task will "mangle" all of your function and variable names (either by changing them to a much shorter name, or stripping them entirely). This is usually desirable as it makes your code significantly smaller, but in some cases can lead to unexpected results (particularly when you expect an object's constructor to have a certain name). To turn off or modify this behavior, use the mangle option when setting up this task.'''
author = "The Sails Company"
year_published = 2025
clearnet = "https://sailsjs.com/documentation/concepts/assets/default-tasks"
