["https://sailsjs.com/documentation/reference/blueprint-api"]
title = "Blueprint API"
full_description = "The process for activating/deactivating blueprints varies slightly with the kind of blueprint route you are concerned with (RESTful routes, shortcut routes, or action routes). See the Blueprint Routes documentation section for a discussion of the different blueprint types. To change a blueprint route, we recommend explicitly configuring a custom route. Similarly, if you want to override a blueprint action, we recommend writing your own custom action. To override a RESTful blueprint route for a single model, simply create an action in the relevant controller file (or a standalone action in the relevant folder) with the appropriate name: find, findOne, create, update, destroy, populate, add or remove. If you’d like to override a particular blueprint for all models, check out the sails-hook-custom-blueprints plugin. It's important to realize that, even if you haven't defined these yourself, Sails will respond with built-in CRUD logic for each model in the form of a JSON API (including support for sort, pagination, and filtering) as long as action or shortcut blueprints are enabled in your blueprints configuration. The blueprint API is compatible with WebSockets (as are any of your custom actions and policies), thanks to the virtual request interpreter. Check out the reference section on the browser SDK (Reference > WebSockets > sails.io.js) for example usage. By default, the Find and Find One blueprint actions will call .subscribe() automatically when a socket request is used. This subscribes the requesting socket to each of the returned records. However, if the same socket sends a request to the Update or Destroy actions with io.socket.put() (for example) this will not by default cause a message to be sent to the requesting socket, but to the other connected, subscribed sockets. This is intended to allow UI code to use the client-side SDK's callback to handle the server response separately, e.g. to replace a loading spinner. By default, the find blueprint action (when triggered via a WebSocket request) will subscribe the requesting socket to notifications about new instances of that model being created. This behavior can be changed for all models by setting sails.config.blueprints.autoWatch to false."
author = "The Sails Company"
year_published = 2025
