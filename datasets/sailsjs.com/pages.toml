["https://sailsjs.com/documentation/upgrading"]
title = "Upgrading"
full_description = "Like most Node packages, Sails respects semantic versioning. For example, if you are using Sails v0.11.3, and then upgrade to Sails v0.11.4, you shouldn't need to change your application code. This is called a patch release. On the other hand, if you upgrade from Sails v0.11.3 to v1.0.0, you can expect some breaking changes, meaning that you will need to change your Sails app's code in order to use the new version. With any framework or tool, some breaking changes are inevitable over time, but you can expect to see these kinds of changes less often as the APIs in Node and Sails continue to stabilize. In the meantime, the core maintainers strive to minimize breaking changes and maintain backwards compatibility where possible. For details about changes between versions, as well as a migration guide to assist you in making an necessary changes to your app, please refer to the appropriate page: If your company has the budget, consider purchasing Flagship support. It's a great way to support the ongoing development of the open source tools you use every day. And it gives you an extra lifeline to the Sails core team. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
