title = "importer.less"
full_description = "By default, new Sails projects are configured to compile this file from LESS to CSS. Unlike CSS files, LESS files are not compiled and included automatically unless they are imported here. The LESS files imported in this file are compiled and included in the order they are listed. Mixins, variables, etc. should be imported first so that they can be accessed by subsequent LESS stylesheets. (Just like the rest of the asset pipeline bundled in Sails, you can always omit, customize, or replace this behavior with SASS, SCSS, or any other Grunt tasks you like.) The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
