["https://sailsjs.com/documentation/concepts/extending-sails/adapters/custom-adapters"]
title = "Custom adapters"
full_description = "Sails makes it fairly easy to write your own database adapter. Custom adapters can be built directly in your app (api/adapters/) or published as NPM packages. Check out Intro to Custom Adapters, the Adapter Interface Reference, and sails-adapter-boilerplate for more information about creating your own adapter. If an adapter is only going to be used in one app (e.g. a short-term fork of an existing adapter) you can put it in api/adapters/. This is what you get out of the box when you run sails generate adapter. In this case, the name of the adapter is determined by the name of the folder inside api/adapters/ (by convention, the entry point for your adapter should be index.js). Go with this option if you plan to share your adapter between multiple Sails apps, whether that's within your organization or as an open-source package for other members of the Sails/Node.js community at large. To use an externalized adapter like this, you'll need to do npm install your-adapter-package-name or npm link your-adapter-package-name. Before you start on an open-source adapter, we recommend you search GitHub for sails-databasename and waterline-databasename to check if a project already exists. If it does, it's generally a good idea to approach the author of an existing adapter and offer to contribute instead of starting a new project. Most developers will welcome your help, and the combined efforts will likely result in a better quality adapter. If one doesn't exist, we recommend you create a new project and name it following the convention: sails-databasename. In Sails, database adapters expose interfaces, which imply a contract to implement certain functionality. This allows us to guarantee conventional usage patterns across multiple models, developers, apps, and even companies, making app code more maintainable, efficient, and reliable. Adapters are primarily useful for integrating with databases, but they can also be used to support any open API or internal/proprietary web service that is purely RESTful."
