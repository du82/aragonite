full_description = '''The logos for Sails, Treeline, Waterline, and all projects maintained by The Sails Company are the property of either The Sails Company or Mike McNeil. They are meant to be symbols of their respective projects, and represent the quality that the core team works hard to ensure. We make these logos available to the Sails community to spread the word about the technology they're using, but do not give permission to use the logos in ways that would mislead and/or cause people to confuse other software with the original projects. The correct way to refer to the Sails framework is with a lowercased ".js", just like our beloved Node.js. You can also refer to it as simply "Sails". The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame.'''
