["https://sailsjs.com/documentation/concepts/globals"]
title = "Globals"
full_description = "For convenience, Sails exposes a handful of global variables. By default, your app's models, services, and the global sails object are all available on the global scope, meaning you can refer to them by name anywhere in your backend code (as long as Sails has been loaded). Nothing in Sails core relies on these global variables—each and every global exposed in Sails may be disabled in sails.config.globals (conventionally configured in config/globals.js.) In most cases, you will want to keep the sails object globally accessible, as it makes your app code much cleaner. However, if you _do_ need to disable all globals, including sails, you can get access to sails on the request object (req). Your app's models and services are exposed as global variables using their globalId. For instance, the model defined in the file api/models/Foo.js will be globally accessible as Foo, and the service defined in api/services/Baz.js will be available as Baz. Sails also exposes an instance of lodash as _, and an instance of async as async. These commonly-used utilities are provided by default so that you don't have to npm install them in every new project. Like any of the other globals in sails, they can be disabled. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
