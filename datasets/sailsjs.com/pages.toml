["https://sailsjs.com/documentation/contributing/code-submission-guidelines/sending-pull-requests"]
title = "Sending pull requests"
full_description = '''This guide is designed to get you started contributing to the Sails framework. It assumes basic familiarity with Github, but it should be useful for contributors of all levels. Like any open-source project, we must have guidelines for contributions—it helps protect the quality of the code and ensures that our framework stays robust and dependable. For these reasons, it's important that contribution protocols are followed for all contributions to Sails, whether they be bug fixes or whole sets of new features. If you have a high-priority hot-fix for the currently deployed version, please post an issue on Github and mention @mikermcneil. Also, for emergencies, please feel free to tweet @sailsjs. Then clone your fork into your local filesystem: git clone `[email protected]:YOUR_USER_NAME/sails.git` Please write a test for your addition/fix. I know it kind of sucks if you're not used to it, but it's how we maintain great code. For our test suite, we use Mocha. You can run the tests with npm test. See the "Testing" section in the contribution guide for more information. When you're done, you can commit your fix, push up your changes, and then go into Github and submit a pull request. We'll look it over and get back to you ASAP. This creates a symbolic link as a local dependency (in your app's node_modules folder). This has the effect of letting you run your app with the version Sails you linked. If your company has the budget, consider purchasing Flagship support. It's a great way to support the ongoing development of the open source tools you use every day. And it gives you an extra lifeline to the Sails core team. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame.'''
