["https://sailsjs.com/documentation/reference/application/advanced-usage/lifecycle"]
title = "Lifecycle"
full_description = "The Sails core has been iterated upon several times to make it easier to maintain and extend. As a result, it has a very particular loading order, which its hooks depend on heavily. This process is summarized below. Gather the set of configuration values passed in on the command line, in environment variables, and in programmatic configuration (i.e. options passed to sails.load or sails.lift). When an app is started via the command-line interface (by typing sails lift or sails console), the values of any .sailsrc files will also be merged into the config overrides. These override values will take precedence over any user configuration encountered in the next step. Unless the userconfiguration hook is explicitly disabled, Sails will next load the configuration files in the config folder (and subfolders) underneath the current working directory. See Concepts > Configuration for more details about user configuration. Configuration settings from step 1 will be merged on top of these values to form the sails.config object. Next, Sails will load the other hooks. Core hooks will load first, followed by user hooks and installable hooks. Note that hooks typically include configuration of their own which will be used as default values in sails.config. For example, if no port setting is configured by this point, the http hook's default value of 1337 will be used. Sails prepares the core Router, then emits multiple events on the sails object informing hooks that they can safely bind routes. After all hooks have initialized, Sails exposes global variables (by default: sails object, models, services, _, and async). This step does not run when sails.load() is used programmatically. To run the initialization step, use sails.lift() instead. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier!"
author = "The Sails Company"
year_published = 2025
clearnet = "https://sailsjs.com/documentation/reference/application/advanced-usage/lifecycle"
