["https://sailsjs.com/documentation/contributing/contributing-to-the-docs"]
title = "Contributing to the docs"
full_description = '''The official documentation on the Sails website is compiled from markdown files in the sails repo. Please send a pull request to the master branch with amendments and they'll be double-checked and merged as soon as possible. We are open to suggestions about the process we're using to manage our documentation, and to working with the community in general. Please post to the Gitter with your ideas; or, if you're interested in helping directly, contact @fancydoilies or @mikermcneil on Twitter. That depends on what kind of edit you are making. Most often, you'll be making an edit that is relevant for the latest stable version of Sails (i.e. the version on NPM) and so you'll want to edit the master branch of this repo (what you see in the sails repo by default). The docs team merges master into the appropriate branch for the latest stable release of Sails, and then deploys that to sailsjs.com about once per week. On the other hand, if you are making an edit related to an unreleased feature in an upcoming version—usually as an accompaniment a feature proposal or open pull request to Sails or a related project—then you will want to edit the branch for the next, unreleased version of Sails (sometimes called "edge"). We use a module called doc-templater to convert the .md files to the HTML for the website. You can learn more about how it works in the doc-templater repo. Each .md file has its own page on the website (e.g. all reference, concepts, and anatomy files), and should include a special <docmeta name="displayName"> tag with a value property specifying the title for the page. This will impact how the doc page appears in search engine results, and it will also be used as its display name in the navigation menu on sailsjs.com. For example: Documentation changes go live when they are merged onto a special branch corresponding with the current stable version of Sails (e.g. 0.12). We cannot merge pull requests sent directly to this branch—its sole purpose is to reflect the content currently hosted on sailsjs.com, and content is only merged just before redeploying the Sails website.'''
