["https://sailsjs.com/documentation/concepts/helpers"]
title = "Helpers"
full_description = '''As of v1.0, all Sails apps come with built-in support for helpers, simple utilities that let you share Node.js code in more than one place. This helps you avoid repeating yourself, and makes development more efficient by reducing bugs and minimizing rewrites. Like actions2, this also makes it much easier to create documentation for your app. In Sails, helpers are the recommended approach for pulling repeated code into a separate file, then reusing that code in various actions, custom responses, command-line scripts, unit tests, or even other helpers. You don't have to use helpers—in fact you might not even need them right away. But as your code base grows, helpers will become more and more important for your app's maintainability (plus, they're really convenient). For example, in the course of creating the actions that your Node.js/Sails app uses to respond to client requests, you will sometimes find yourself repeating code in several places. That can be pretty bug-prone, of course, not to mention annoying. Fortunately, there's a neat solution: replace the duplicate code with a call to a custom helper: Helpers can be called from almost anywhere in your code, as long as that place has access to the sails app instance. Though simple, this file displays several characteristics of a good helper: it starts with a friendly name and description that make it immediately clear what the utility does, it describes its inputs so that it’s easy to see how the utility is used, and it accomplishes a discrete task in the simplest way possible. The core of the helper is the fn function, which contains the actual code that the helper will run. The function takes two arguments: inputs (a dictionary of input values, or "argins") and exits (a dictionary of callback functions). The job of fn is to utilize and process the argins, and then trigger one of the provided exits to return control back to whatever code called the helper. Note that, as opposed to a typical JavaScript function that uses return to provide output to the caller, helpers provide that result value by passing it in to exits.success().'''
author = "The Sails Company"
year_published = 2025
