["https://sailsjs.com/documentation/concepts/actions-and-controllers"]
title = "Actions and controllers"
full_description = '''Actions are responsible for responding to requests from a web browser, mobile application or any other system capable of communicating with a server. They often act as a middleman between your models and views, and orchestrate the bulk of your project’s business logic: you can use actions to serve web pages, handle form submissions, manage 3rd party API requests, and everything in between. Actions are bound to routes in your application. When a user agent requests a particular URL, the action bound to that route performs the business logic within and sends back a response. For example, the GET /hello route in your application could be bound to an action like: Any time a web browser navigates to the /hello URL on your app's server, the page will display the message: “Hi there!”. Actions are defined in the api/controllers/ folder and subfolders (we’ll talk more about controllers in a bit). In order for Sails to recognize a file as an action, the filename must be kebab-cased (containing only lowercase letters, numbers and dashes). When referencing an action in Sails (in most cases, when binding it to a route), use its path relative to api/controllers, without any file extension. For example, to bind a route to an action located at api/controllers/user/find.js, you would point its URL to user/find. By default, Sails only knows how to interpret .js files, but you can customize your app to use things like CoffeeScript or TypeScript as well. An action can have any file extension that isn't .md (Markdown) and .txt (text). Since the release of Sails v1.0, we recommend writing your actions in the more modern "actions2" syntax, which works much the same way as Sails helpers. By defining your actions in this way, they are essentially self-documenting and self-validating. Note that when using actions2, you can access the request object as this.req.Alternatively, you can pass env into the function with inputs and exits to get access to req without using this.req. In a nutshell, your code will be standardized in a way that makes it easier to re-use and modify later. And since you'll declare the action's parameters ahead of time, you'll be much less likely to expose edge cases and security holes.'''
author = "The Sails Company"
year_published = 2025
