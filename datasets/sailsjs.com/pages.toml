["https://sailsjs.com/documentation/concepts/extending-sails/hooks/installable-hooks"]
title = "Installable hooks"
full_description = "Installable hooks are custom Sails hooks that reside in an application’s node_modules folder. They are useful when you want to share functionality between Sails apps, or publish your hook to NPM to share it with the Sails community. If you wish to create a hook for use in just one Sails app, see creating a project hook instead. Your new folder may contain other files as well, which can be loaded in your hook via require; only index.js will be read automatically by Sails. Use the dependencies key of your package.json to refer to any dependencies that need to be installed in order for your hook to work (you may also use npm install <dependency> --save to easily save dependency information to package.json). In certain cases, especially when using a scoped NPM package to override a core Sails hook, you will want to change the name that Sails uses internally when it loads your hook. You can use the sails.hookName configuration option in your package.json file for this. The value should be the name you want to be loaded into the sails.hooks dictionary, so you generally will not want a sails-hooks- prefix. For example, if you have a module @mycoolhooks/sails-hook-sockets that you wish to use to override the core sails-hook-sockets module, the package.json might look like: Before you distribute your installable hook to others, you’ll want to write some tests for it. This will help ensure compatibility with future Sails versions and significantly reduce hair-pulling and destruction of nearby objects in fits of rage. While a full guide to writing tests is outside the scope of this doc, the following steps should help get you started: Assuming your hook is tested and looks good, and assuming that the hook name isn’t already in use by another NPM module, you can share it with world by running npm publish. Go you! If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed."
