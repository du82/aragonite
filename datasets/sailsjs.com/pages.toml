["https://sailsjs.com/documentation/concepts/extending-sails/hooks/hook-specification/initialize"]
title = ".initialize()"
full_description = '''The initialize feature allows a hook to perform startup tasks that may be asynchronous or rely on other hooks. All Sails configuration is guaranteed to be completed before a hook’s initialize function runs. Examples of tasks that you may want to put in initialize include: Like all hook features, initialize is optional and can be left out of your hook definition. If implemented, initialize should be an async function which must be resolved (i.e. not throw or hang forever) in order for Sails to finish loading: By default, hooks have ten seconds to complete their initialize function and resolve before Sails throws an error. That timeout can be configured by setting the _hookTimeout key to the number of milliseconds that Sails should wait. This can be done in the hook’s defaults: You can use the "hook loaded" events to make one hook dependent on another. To do so, simply wrap your hook’s initialize logic in a call to sails.on(). For example, to make your hook wait for the orm hook to load, you could make your initialize similar to the following: To make a hook dependent on several others, gather the event names to wait for into an array and call sails.after: If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame.'''
