["https://sailsjs.com/documentation/concepts/deployment/faq"]
title = "FAQ"
full_description = "Sails also comes with built-in support for creating your own custom configuration settings that will be exposed directly on sails.config. And whether custom or built-in, any of the configuration properties in sails.config can be overridden using environment variables. See the conceptual documentation on Configuration for details. The easiest way to add configuration to your Sails app is by modifying the files in config/ or adding new ones. Sails supports environment-specific configuration loading out of the box, so you can use config/env/production.js. Again, see the conceptual documentation on Configuration for details. But sometimes you don't want to put certain configuration information into your repository. The best place to put this kind of configuration is in environment variables. That said, for development (e.g. on your laptop) using environment variables can sometimes be cumbersome. So for your other deployment/machine-specific settings, namely any kind of credentials you want to keep private, you can also use your config/local.js file. This file is included in your .gitignore file by default, which helps prevent you from inadvertently commiting your credentials to your code repository. Otherwise, get the IP address of your server and ssh onto it. Then npm install -g sails and npm install -g forever to install Sails and forever globally from NPM for the first time on the server. Finally git clone your project (or scp it onto the server if it's not in a git repo) into a new folder on the server, cd into it, and then run forever start app.js. Baseline performance in Sails is comparable to what you'd expect from a standard Node.js/Express application. In other words, it's fast! We've done some optimizations ourselves in Sails core, but our primary focus is not messing up what we get for free from our dependencies. For a quick and dirty benchmark, see http://serdardogruyol.com/sails-vs-rails-a-quick-and-dirty-benchmark. The most common performance bottleneck in production Sails applications is the database. Over the lifetime of an application with a growing user base, it becomes increasingly important to set up good indexes on your tables/collections and use queries which return paginated results. Eventually, as your production database grows to contain tens of millions of records, you will start to locate and optimize slow queries by hand (either by calling .query() or .native(), or by using the underlying database driver from NPM)."
