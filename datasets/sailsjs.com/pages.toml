["https://sailsjs.com/documentation/reference/application"]
title = "Application"
full_description = "The Sails application object contains all relevant runtime state for a Sails application. By default, it is exposed globally as sails and accessible almost anywhere in your code. Most users of the framework will only need to know about the sails application object in order to access a few basic methods and their custom configuration. Less commonly used methods can be found in the advanced usage section. The application object has a number of useful methods and properties. The officially supported methods on the sails object are covered by the other pages in this section. Here are a few of its most useful properties: By default, a model's identity is the lowercased version of its filename, without the .js extension. For example, the default identity for a model loaded from api/models/PowerPuff.js would be powerpuff, and the model would be accessible via sails.models.powerpuff. A model's identity can be customized by setting an identity property in its module file. The full set of configuration options for the Sails instance, loaded from a combination of environment variables, .sailsrc files, user-configuration files, and defaults. See the configuration concepts section for a full overview of configuring Sails, and the configuration reference for details on individual options. A set of convenience methods for low-level interaction with connected websockets. See the sails.sockets.* reference section for details. For more options and implementation details (including instructions for programmatic usage) see Advanced usage. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier!"
