["https://sailsjs.com/faq"]
title = "FAQ | Sails.js"
full_description = "Start with NPM's helpful troubleshooting guide. If you continue to have problems, and you've tried Google searching but you're still stumped, please carefully review the updated Sails contribution guide and then create a GitHub issue in the Sails repo. We have learned again and again over the years to take versioning of dependencies very seriously. We lock Sails's dependency versions and only bump those versions if the associated updates fix a security issue or present other substantive advantages to Sails users (improved compatibility, performance, etc.) In addition, the core maintainers of Sails are committed to fixing any major security, performance, or stability bugs that arise in any of our core dependencies-- regardless of whether those modules are officially maintained by another entity or not. Sails is tested with node versions 0.10.x and up, though, we recommend using The latest LTS version of Node. The framework is built on the rock-solid foundations of Express and Socket.io. Out of the box, it also depends on other great modules, like grunt, waterline, and fs-extra. Click the badge above for the full list of dependencies in the latest stable release of Sails core. Sails Flagship users: We manually verify every dependency of Sails and other officially-maintained modules by hand, every single week. This includes core hooks, adapters, generators, client SDKs, and Flagship packages. We regularly send security/compatibility reports about dependencies to the primary email address associated with your account. If you'd like additional people on your team to receive these reports, no problem! Just let us know their email addresses and we'll get them set up. (These email addresses will also receive communications about patches, shrinkwrap updates, and compatibility notices.) If you have questions or concerns about our dependencies, talk to a core team member. Please do not submit a pull request changing the version of a dependency without first (1) checking that dependency's changelog, (2) verifying compatibility, and (3) submitting an accompanying PR to update roadstead, our dependency wallah."
