full_description = "While actions are mainly registered automatically when the files in an app’s api/controllers folder are loaded, you can use the registerAction() method to add a new action programmatically. This is especially useful in custom hooks, in situations where you want to provide a new action but let the app developer determine the route to bind the action to, or when you want to ensure that policies and other action middleware apply to your action. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
