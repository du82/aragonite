["https://sailsjs.com/documentation/reference/web-sockets/socket-client"]
title = "Socket client"
full_description = "This section of the docs is about the Sails socket client SDK for the browser. It is written in JavaScript, and is also usable on the server. There are also a handful of community projects implementing Sails/Socket.IO clients for native iOS, Android, and Windows Phone. The Sails socket client (sails.io.js) is a tiny browser library that is bundled by default in new Sails apps. It is a lightweight wrapper that sits on top of the Socket.IO client and whose purpose is to make sending and receiving messages from your Sails backend as simple as possible. The main responsibility of sails.io.js is to provide a familiar, Ajax-like interface for communicating with your Sails app using WebSockets/Socket.IO. That basically means providing .get(), .post(), .put(), and .delete() methods that allow you take advantage of realtime features while still reusing the same backend routes you're using for the rest of your app. In other words, running io.socket.post('/user') in your browser will be routed within your Sails app in exactly the same way as an HTTP POST request to the same route. In the browser, all that is required to use sails.io.js is to include the library in a <SCRIPT> tag. Sails adds the library to the assets/js/dependencies folder of all new apps, so you can write: and then use io.socket as a global variable in subsequent inline or external scripts. For detailed instructions and examples of everyday usage, see io.socket. To use the Sails socket client SDK in a Node.js script, you will need to install and require both the sails.io.js and socket.io-client libraries: This section focuses on the most common runtime environment for the JavaScript socket client: the browser. See the sails.io.js GitHub repository for help configuring the socket client for use in a Node.js script. There are two ways to configure Sails' socket client in the browser: using HTML attributes on the <script> tag or by programmatically modifying the io.sails object. The easiest way to configure the four most common settings for the socket client (autoConnect, environment, headers, and url) is by sticking one or more HTML attributes on the script tag:"
