full_description = "Here is a non-comprehensive list of Node/Sails hosting providers and a few available community tutorials. Keep in mind that, most of the time, the process for deploying your Sails app is exactly the same as it would be for any other Node.js app. Just be sure to take a look at the other pages in this section of the docs (as well as your app's config/env/production.js file) and make any necessary adjustments before you actually deploy to production. Using Google Cloud Platform means that your apps run on the same infrastructure that powers all of Google's products, so you can be confident that they'll scale seamlessly—no matter how many users you have. Note: PM2 isn't really a hosting platform, but it's worth mentioning in this section just so you're aware of it. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
