["https://sailsjs.com/documentation/concepts/policies"]
title = "Policies"
full_description = "Policies in Sails are versatile tools for authorization and access control: they let you execute some logic before an action is run in order to determine whether or not to continue processing the request. The most common use-case for policies is to restrict certain actions to logged-in users only. NOTE: policies apply only to controllers and actions, not to views. If you define a route in your routes.js config file that points directly to a view, no policies will be applied to it. To make sure policies are applied, you can instead define an action which displays your view and then point your route to that action. It's best to avoid implementing numerous or complex policies in your app. Instead, when implementing features like granular, role-based permissions, rely on your actions to reject unwanted access. Your actions should also be responsible for any necessary personalization of the view locals and JSON response data you send in the response. For example, if you need to implement user-level or role-based permissions in your application, the most straightforward solution is to take care of the relevant checks at the top of your controller action—either inline or by calling out to a helper. Following this best practice will significantly improve the maintainability of your code. Sails has a built in ACL (access control list) located in config/policies.js. This file is used to map policies to actions and controllers. This file is declarative, meaning it describes what the permissions for your app should look like rather than how they should work. This makes it easier for new developers to understand what's going on, and it makes your app more flexible as requirements inevitably change over time. The config/policies.js file is a dictionary whose properties and values differ depending on whether you are applying policies to controllers or standalone actions. To apply policies to a controller, use the controller name as the name of a property in the config/policies.js dictionary, and set its value to a dictionary mapping actions in that controller to policies that should be applied to them. Use * to represent “all unmapped actions”. A policy's name is the same as its filename, minus the file extension."
author = "The Sails Company"
year_published = 2025
clearnet = "https://sailsjs.com/documentation/concepts/policies"
