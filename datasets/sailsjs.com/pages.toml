["https://sailsjs.com/documentation/contributing/issue-contributions"]
title = "Issue contributions"
full_description = "When opening new issues or commenting on existing issues in any of the repositories in this GitHub organization, please make sure discussions are related to concrete technical issues of the Sails.js software. Feature requests and ideas are always welcome, but they should not be submitted as GitHub issues. See Requesting Features below for submission guidelines. For general help using Sails, please refer to the official Sails documentation. For additional help, ask a question on StackOverflow or refer to any of the other recommended avenues of support. If you have found a security vulnerability in Sails or any of its dependencies, do not report it in a public issue. Instead, alert the core maintainers immediately using the instructions detailed in the Sails Security Policy. Please observe this request even for external dependencies not directly maintained by the core Sails.js team (e.g. Socket.io, Express, Node.js, or openssl). Whether or not you believe the core team can do anything to fix an issue, please follow the instructions in our security policy to privately disclose the vulnerability as quickly as possible. Finally, discussion of a non-technical nature, including subjects like team membership, trademark, code of conduct, and high-level questions or concerns about the project should be sent directly to the core maintainers by emailing [email protected]. Sails is composed of a number of different sub-projects, many of which have their own dedicated repository. Even so, the best place to submit a suspected issue with a module maintained by the Sails core team is in the main Sails repo. This helps us stay on top of issues and keep organized. Check that your issue has a concise, on-topic title that uses polite, neutral language to explain the problem as best you can in the available space. The ideal title for your issue is one that communicates the problem at a glance. Before putting together steps to reproduce your issue, normalize as many of the variables on your personal development environment as possible:"
