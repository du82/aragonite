["https://sailsjs.com/documentation/concepts/programmatic-usage"]
title = "Programmatic usage"
full_description = "Usually you will interact with Sails through its command-line interface, starting servers with sails lift, but Sails apps can also be started and manipulated from within other Node apps by using the programmatic interface. One of the main uses of this interface is to run Sails apps inside of automated test suites. To create a new Sails app from within a Node.js script, use the Sails constructor. The same constructor can be used to create as many distinct Sails apps as you like: Once you have a reference to a new Sails app, you can use .load() or .lift() to start it. Both methods take two arguments: a dictionary of configuration options, and a callback function that will be run after the Sails app starts. When Sails is started programmatically, it will still use the api, config and other folders underneath the current working directory to load controllers, models, and configuration options. One notable exception is that .sailsrc files will not be loaded when starting apps this way. Any configuration options sent as arguments to .load() or .lift() will take precedence over options loaded from anywhere else. Configuration options set via environment variables will not automatically be applied to Sails app started programmatically, with the exception of NODE_ENV and PORT. To load configuration options from .sailsrc files and environment variables, use the rc module that Sails makes available via require('sails/accessible/rc'). The difference between .load() and .lift() is that .lift() takes the additional steps of (1) running the app's bootstrap, if any, and (2) starting an HTTP server on the port configured via sails.config.port (1337 by default). This allows you to make HTTP requests to the lifted app. To make requests to an app started with .load(), you can use the .request() method of the loaded app. Here's an alternative to the previous example: starting a Sails app with .load() and sending what is semantically the same POST request, but this time we'll use a virtual request instead of HTTP:"
