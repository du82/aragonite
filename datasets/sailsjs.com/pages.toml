["https://sailsjs.com/documentation/concepts/routes"]
title = "Routes"
full_description = '''The most basic feature of any web application is the ability to interpret a request sent to a URL, then send back a response. In order to do this, your application has to be able to distinguish one URL from another. Like most web frameworks, Sails provides a router: a mechanism for mapping URLs to actions and views. Routes are rules that tell Sails what to do when faced with an incoming request. There are two main types of routes in Sails: custom (or "explicit") and automatic (or "implicit"). Every Sails project comes with config/routes.js, a simple Node.js module that exports an object of custom, or "explicit" routes. For example, this routes.js file defines six routes; some of them point to actions, while others route directly to views: Each route consists of an address on the left (e.g. 'GET /me') and a target on the right (e.g. { action: 'account/profile' }) The address is a URL path and (optionally) a specific HTTP method. The target can be defined in a number of different ways (see the expanded concepts section on the subject), but the syntax above is the most common. When Sails receives an incoming request, it checks the address of all custom routes for matches. If a matching route is found, the request is then passed to its target. "Hey Sails, when you receive a GET request to http://mydomain.com/me, run the account/profile action, would'ya?" In addition to your custom routes, Sails binds many routes for you automatically. If a URL doesn't match a custom route, it may match one of the automatic routes and still generate a response. The main types of automatic routes in Sails are: If no custom or automatic route matches a request URL, Sails will send back a default 404 response. This response can be customized by adding a api/responses/notFound.js file to your app. See custom responses for more info. If an unhandled error is thrown during the processing of a request (for instance, in some action code), Sails will send back a default 500 response. This response can be customized by adding an api/responses/serverError.js file to your app. See custom responses for more info.'''
author = "The Sails Company"
year_published = 2025
