["https://sailsjs.com/documentation/reference/blueprint-api/add-to"]
title = "add to"
full_description = '''This action adds a reference to some other record (the "foreign", or "child" record) onto a particular collection of this record (the "primary", or "parent" record). If you have WebSockets enabled for your app, then every client subscribed to the primary record will receive a notification in which the notification event name is the primary model identity (e.g. 'employee'), and the message has the following format: For instance, continuing the example above, all clients subscribed to Dolly, aka employee #7, (except for the client making the request) would receive the following message: Assuming involvedInPurchases had a via, then either updated or addedTo notifications would also be sent to any clients who were subscribed to purchase #47, the child record we just added. If the via-linked attribute on the other side is also plural (e.g. cashiers), then another addedTo notification will be sent. Otherwise, if the via points at a singular attribute (e.g. cashier) then the updated notification will be sent. If adding this purchase to Dolly's collection would "steal" it from another employee's involvedInPurchases, then any clients subscribed to that other, stolen-from employee record (e.g. Motoki, employee #12) would receive a removedFrom notification (see Blueprints > remove from. The example above assumes "rest" blueprints are enabled, and that your project contains at least an 'Employee' model with attribute: involvedInPurchases: {collection: 'Purchase', via: 'cashier'} as well as a Purchase model with attribute: cashier: {model: 'Employee'}. You can quickly achieve this by running: If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier!'''
