title = "sails lift"
full_description = "Run the Sails app in the current dir (if node_modules/sails exists, it will be used instead of the globally installed Sails). By default, Sails lifts your app in development mode. In the development environment, Sails uses Grunt to keep an eye on your files in /assets. If you change something (for example in one of your .css or .less files) and reload your browser, you'll notice that your changes are reflected automatically. Also note that, in development mode, your view templates won't be cached in memory. So, like assets, you can also change your view files without restarting Sails. Any changes to back-end logic or configuration (e.g. the files in config/, api/, or node_modules/) will not take effect unless you kill and restart the server (CTRL+C + sails lift). If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
