["https://sailsjs.com/documentation/reference/blueprint-api/create"]
title = "create"
full_description = '''Responds with a JSON dictionary representing the newly created instance. If a validation error occurred, a JSON response with the invalid attributes and a 400 status code will be returned instead. Additionally, if the autoWatch setting is on (which it is by default), then a "created" notification will be published to all client sockets which are watching this model; that is, client sockets who have previously sent a request to the "Find" blueprint action. Those same sockets will also be subscribed to hear about subsequent changes to the new record. Finally, if this blueprint action is triggered via a socket request, then the requesting socket will ALSO be subscribed to the newly created record. In other words, if the record is subsequently updated or deleted using blueprints, a message will be sent to that client socket informing them of the change. See .subscribe() for more info. Parameters should be sent in the request body. By default, Sails understands the most common types of encodings for body parameters, including url-encoding, form-encoding, and JSON. Create a new user named "Applejack" with a hobby of "pickin", who is involved in purchases #13 and #25: If you have WebSockets enabled for your app, then every socket client who is "watching" this model (has sent a request to the model's "find where" blueprint action) will receive a "created" notification where the event name is the model identity (e.g. user), and the message has the following format: For instance, continuing the example above, all clients who are watching the User model (except for the client making the request) would receive the following message: Since the new record in our example included an initial value for involvedInPurchases, an association pointed at by via on the other side, then addedTo notifications would also be sent to any clients who are subscribed to those now-associated child records on the other side of the relationship—in this case, purchases 13 and 25. See Blueprints > add to for more info about the structure of those notifications.'''
