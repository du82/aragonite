["https://sailsjs.com/documentation/reference/command-line-interface/sails-debug"]
title = "sails debug"
full_description = "Attach the node debugger and lift the Sails app (similar to running node --debug app.js). You can then use node-inspector to debug your app as it runs. To use the standard (command-line) Node debugger with Sails, you can always just run node debug app.js. Once the application is launched, visit http://127.0.0.1:8080?port=5858 in Opera or Chrome (Sorry, other browsers!). Now you can request your app as usual on port 1337 and debug your code from the browser. How it works Node.js includes a TCP-based debugger. When you start your application using sails debug, Node.js lifts your app and opens a socket on port 5858. This socket allows external tools to interact with and control the debugger. Node Inspector, accessible via the port 8080, is this kind of tool. If you don't see your files in the browser at http://127.0.0.1:8080?port=5858 or if it's very slow to load, try running Node Inspector with the --no-preload argument. See the Node Inspector repo for more details. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
