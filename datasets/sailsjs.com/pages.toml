["https://sailsjs.com/documentation/concepts/blueprints"]
title = "Blueprints"
full_description = "Like any good web framework, Sails aims to reduce both the amount of code you write and the time it takes to get a functional app up and running. Blueprints are Sails’s way of quickly generating API routes and actions based on your application design. Together, blueprint routes and blueprint actions constitute the blueprint API, the built-in logic that powers the RESTful JSON API you get every time you create a model and controller. For example, if you create a User.js model file in your project, then with blueprints enabled you will be able to immediately visit /user/create?name=joe to create a user, and visit /user to see an array of your app's users. All without writing a single line of code! Blueprints are a powerful tool for prototyping, but in many cases can be used in production as well, since they can be overridden, protected, extended or disabled entirely. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
