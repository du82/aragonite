["https://sailsjs.com/documentation/concepts/assets/task-automation"]
title = "Task automation"
full_description = "Tasks are mainly useful for bundling front-end assets, (like stylesheets, scripts, & client-side markup templates) but they can also be used to automate all kinds of repetitive development chores, from browserify compilation to database migrations. Sails bundles some default tasks for convenience, but with literally hundreds of plugins to choose from, you can use tasks to automate just about anything with minimal effort. If someone hasn't already built what you need, you can always author and publish your own Grunt plugin to npm! If you haven't used Grunt before, be sure to check out the Getting Started guide, as it explains how to create a Gruntfile as well as install and use Grunt plugins. The asset pipeline is the place where you will organize the assets that will be injected into your views, and it can be found in the tasks/pipeline.js file. Configuring these assets is simple and uses Grunt task file configuration and wildcard/glob/splat patterns. These are broken down into three sections: This is an array of CSS files to be injected into your HTML as <link> tags. These tags will be injected between the <!--STYLES--><!--STYLES END--> comments in any view in which they appear. This is an array of JavaScript files that gets injected into your HTML as <script> tags. These tags will be injected between the <!--SCRIPTS--><!--SCRIPTS END--> comments in any view in which they appear. The files get injected in the order in which they appear in the array, meaning you should place the path of dependencies before the file that depends on them. This is an array of HTML files that will compiled to a JST function and placed in a jst.js file. This file then gets injected as a <script> tag in between the <!--TEMPLATES--><!--TEMPLATES END--> comments in your HTML. The same Grunt wildcard/glob/splat patterns and task file configuration are used in some of the task configuration JS files themselves if you would like to change those too. Configured tasks are the set of rules your Gruntfile will follow when run. They are completely customizable and are located in the tasks/config/ directory. You can modify, omit, or replace any of these Grunt tasks to fit your requirements. You can also add your own Grunt tasks—just add a someTask.js file in this directory to configure the new task, then register it with the appropriate parent task(s) (see files in tasks/register/*.js). Remember, Sails comes with a set of useful default tasks that are designed to get you up and running with no configuration required."
author = "The Sails Company"
year_published = 2025
