["https://sailsjs.com/documentation/reference/blueprint-api/find-one"]
title = "find one"
full_description = '''Look up the record with the specified id from the database, and (if possible) subscribe to the record in order to hear about any future changes. The findOne() blueprint action returns a single record from the model (given by :model) as a JSON object. The specified id is the primary key of the desired record. If the action was triggered via a socket request, the requesting socket will be "subscribed" to the returned record. If the record is subsequently updated or deleted, a message will be sent to that socket's client informing them of the change. See the .subscribe() docs for more info. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame.'''
