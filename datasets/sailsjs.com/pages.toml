["https://sailsjs.com/documentation/reference/configuration/sails-config-blueprints"]
title = "sails.config.blueprints"
full_description = "These configurable settings allow you to configure the blueprint API in Sails. Some settings (like sails.config.blueprints.autoWatch) control the behavior of built-in blueprint actions, whereas others (like sails.config.blueprints.shortcuts) tweak the behavior of implicit blueprint routing and/or determine whether Sails automatically binds certain kinds of blueprint routes at all. Remember, blueprint actions can be attached to your custom routes regardless of whether or not you have any kind of implicit blueprint routing enabled. Each blueprint action includes, at its core, a Waterline model method call. For instance, the find blueprint, when run for the User model, runs User.find() in order to retrieve some user records. The options that are passed to these Waterline methods are determined by a call to parseBlueprintOptions(). The default version of this method (available via sails.hooks.blueprints.parseBlueprintOptions()) determines the default behaviors for blueprints. You can override parseBlueprintOptions in your blueprints config (in config/blueprints.js) to customize the behavior for all blueprint actions, or on a per-route basis to customize the behavior for a single route. The parseBlueprintOptions() method takes a single argument (the request object) and is expected to return a dictionary of Waterline query options. (You can review an unrealistically-expanded example of a such a dictionary here, but keep in mind that not all keys apply to all blueprint actions. See source code in Sails code for complete details). Adding your own parseBlueprintOptions() is an advanced concept, and it is recommended that you first familiarize yourself with the default method code and use it as a starting point. For small modifications to blueprint behavior, it is best to first call the default method inside your override and then make changes to the returned query options: If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed."
