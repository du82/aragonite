["https://sailsjs.com/documentation/contributing/core-maintainers"]
title = "Core maintainers"
full_description = "The Sails.js core maintainers constitute a small team of individuals located in Austin, TX who are passionate about making it easier for everyone to develop scalable, secure, custom web applications. We fell in love with Node.js at first sight and are firm believers in the continued, unprecedented dominance of JavaScript as a unifying force for good. We see Node.js as the logical continuation of the web standards movement into the world of server-side development. The Sails core team maintains the framework and its related sub-projects, including the Waterline ORM, the Node-Machine project, the Skipper body parser, and all officially-supported generators, adapters, and hooks. We rely heavily on the help of a network of contributors and users all over the world, but we make all final decisions about our releases and roadmap. Sails.js was originally developed by Mike McNeil with the help of his company Balderdash, a small development and design studio in Austin, TX. The first stable version of Sails was released as open source in 2012. Today, it is still actively maintained by the same core team members, along with the help of many amazing contributors. Today, Sails.js is financially supported by The Sails Company (YC W15). Please feel free to contact us directly with questions about the company, our team, or our mission. If your company has the budget, consider purchasing Flagship support. It's a great way to support the ongoing development of the open source tools you use every day. And it gives you an extra lifeline to the Sails core team. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
