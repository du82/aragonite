title = "sails.getBaseUrl()"
full_description = "There is no reliable, cross-platform way to automatically detect the external URL of a running Sails app (or any other Node app). Instead, configure your base URL explicitly and save it in custom configuration (e.g. sails.config.custom.baseUrl) that you can reference throughout the app. (This can then be overridden in production, staging, etc. as needed using environment-dependent configuration.) Return a (possibly incorrect) best guess of the base URL for this app, based on a combination of user-supplied and default configuration values. getBaseUrl() constructs a URL string by inspecting various configuration values and defaults. For example, if sails.config.ssl.key and sails.config.ssl.cert both have values, the URL will start with https:// instead of http://. If sails.config.explicitHost is not undefined, its value will be used as the domain name, otherwise it will be localhost. If sails.config.port is not 80 or 443, its value will be appended to the URL as well. If you notice something we've missed or could be improved on, please follow this link and submit a pull request to the sails repo. Once we merge it, the changes will be reflected on the website the next time it is deployed. The Sails framework is built by a web & mobile shop in Austin, TX, with the help of our contributors. We created Sails in 2012 to assist us on Node.js projects. Naturally we open-sourced it. We hope it makes your life a little bit easier! © 2012-2025 The Sails Company. The Sails framework is free and open-source under the MIT License. Illustrations by Edamame."
