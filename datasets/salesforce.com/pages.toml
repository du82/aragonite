stems. With Testing Center, teams can use AI to generate hundreds of synthetic interactions, then run those tests automatically in parallel to see what topics and actions Agentforce chooses. From here, teams can iterate by adjusting instructions as needed — saving time that would have been lost on manually testing many different variations of a conversation."
