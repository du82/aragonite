["https://www.salesforce.com/ca/customer-stories/inter-personalizes-banking-data-ai"]
title = "Inter boosts ROI 20x with the perfect banking offer."
description = "First, Inter led Brazil in digital banking. Now, it’s paving the way toward personalization with tailored messages, resulting in 35 times more conversions."
full_description = "Share the story Link Copied Inter personalizes every banking experience with Data and AI. Learn how Brazil’s first digital bank is leading the way globally toward personalized banking. 2 min read Share the story Link Copied By tailoring messages to different groups of customers, Inter achieved sky-high conversion rates and ROI. As Brazil’s first- ever digital bank, Inter also found a way to safely add AI to its business by quickly building an app on Slack. About Inter Banco Inter is Brazil’s first 100% digital bank. A digital pioneer in the country’s financial landscape, Inter offers free checking, personal, corporate, and microenterprise accounts; loans and credit cards; and investment and insurance services. The Challenge Leading the way to AI with a single view of customers.In three years of high growth, Inter’s customer data started to spread across six different sources and 103 streams. Each customer might own multiple products, leading to duplicate records and irrelevant messages. Inter needed to connect with customers on a more personal level by uniting marketing, sales, web, and mobile app data in a single view.As a pioneer in digital banking, Inter also wanted to lead the way in AI while managing risk and data privacy. By combining a single source of truth with AI, Inter could view each customer’s current products and predict what they’d need next. How Salesforce Helps Connected data makes every interaction feel personal.Salesforce helps Inter unify customer profiles across data sources and engage them at every touchpoint. Data Cloud then segments the data into audiences to deliver the most timely communications with the right product offers. On average, this efficiency has helped Inter eliminate 1.5 hours of meetings per day.Inter also uses Tableau to instantly analyze customer profiles and their preferences right in the flow of work. With Tableau and Data Cloud together, Inter can track the webpages customers visit and how often to recommend relevant products. This generates engagement scores for each customer, helping Inter create more than 3,500 new audience segments. By making each experience more personal, Inter increased conversion rates 35x and overall ROI 20x."
