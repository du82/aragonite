["https://www.salesforce.com/ca/blog/salesforce-number-one-g2-and-gartner"]
title = "Salesforce Voted #1 by Customers on G2 and Gartner | Salesforce"
description = "Just announced, Salesforce takes top marks for our sales force automation capabilities as affirmed by our customers."
full_description = "Salesblazer Salesforce Earns Top Honors from G2 and Gartner Our flagship product, Sales Cloud, is #1 in more sales capability G2 Grids than any other vendor, and has earned a Customers' Choice distinction from Gartner Peer Insights. [Salesforce] Our sales force automation capabilities continue to deliver value and innovation, as affirmed by our customers. Salesforce Staff February 28, 2024 3 min read Share article More than two decades ago, we launched Salesforce with a mission to empower sales professionals, sales operations, and sales leaders to forge meaningful connections. Today, we’re delighted to announce that our efforts have been recognized on both G2 and Gartner, thanks to your support. Salesforce voted #1 Global Software Company on G2 Our flagship product, Sales Cloud, is #1 in more sales capability G2 Grids than any other vendor. We clinched the #1 position across 36 Grid reports, ranging from sales engagement to AI, and catering to businesses of all sizes. And, Salesforce Revenue Cloud boasts the highest scores in CPQ for both satisfaction and market presence. Salesforce: A Customers’ Choice on Gartner Peer Insights™ We are the sole vendor to receive this Customers’ Choice distinction for Sales Force Automation, with an impressive rating of 4.4 out of 5 from 207 reviews (as of December 2023). Even more noteworthy: 92% of reviewers would recommend our software, reaffirming our value and impact. Your praise fuels our progress Your commendations of our innovation, customer-centric values, and results-driven features that simplify growth have truly touched us. Here are a few comments that have inspired us: “[Sales Cloud] is the class leading sales CRM. It has everything that your team needs to find leads, create opportunities, and close sales deals – all tracked with standard objects and enhanced with customisations. It is easy to implement out of the box and integrates with many systems with its built-in APIs. Customer support is great and the training online is world class. It’s used daily in my organization.” — Robert D., mid-market business (51-1000 employees) on G2 “Sales Cloud offers a nearly complete package for handling all of the facets a company needs to track and generate leads, sales, contacts, and interactions across almost all industries and business models. Sales Cloud is almost turnkey – a company can hit the ground running as soon as they turn it on for their teams with little upfront work. The ability to track products, quotes, sales, forecasting, contact engagements, leads, and campaign influences and robustly tie all of this into a single source platform is a gamechanger.” — Kristopher H., mid-market business (51-1000 employees) on G2 “Salesforce is our system of record and our goal is to integrate all other sales tools into Salesforce, which is very straightforward in the majority of cases. Super training and certification options for our admins. This gives us a lot of independence when tweaking the system to meet our unique needs.” — Manager of IT services on Gartner Peer Insights We are profoundly grateful for this recognition. Our customers sit at the heart of everything we do. Their success forms one of our core values. Today, we celebrate your success as much as ours. And we look forward to building a future of growth together. Onboard fast, sell faster See how Sales Cloud speeds up the sales cycle with data and AI, making you more efficient at every step. Watch the demo GARTNER is a registered trademark and service mark of Gartner and Magic Quadrant and Peer Insights are a registered trademark of Gartner, Inc. and/or its affiliates in the U.S. and internationally and are used herein with permission. All rights reserved. Gartner Peer Insights content consists of the opinions of individual end users based on their own experiences with the vendors listed on the platform, should not be construed as statements of fact, nor do they represent the views of Gartner or its affiliates. Gartner does not endorse any vendor, product or service depicted in this content nor makes any warranties, expressed or implied, with respect to this content, about its accuracy or completeness, including any warranties of merchantability or fitness for a particular purpose. Share article Just For You 70 Words That Win: Sales Terms Every Rep Should Know 15 min read 17 Cold Email Templates for Sales You Can Use to Generate Hot Leads 57 min read Explore related content by topic Sales Cloud Revenue Cloud Sales Service Innovation Sales Strategy Sales Management Salesforce Staff The 360 Blog from Salesforce teaches readers how to improve work outcomes and professional relationships. Our content explores the mindset shifts, organizational hurdles, and people behind business evolution. We also cover the tactics, ethics, products, and thought leadership that make growth a... Read More meaningful and positive experience. More by Salesforce Staff"
