["https://www.salvationarmyusa.org/usn/rehabilitation"]
title = "Rehabilitation | The Salvation Army USA"
description = "If you need help for yourself or a loved-one, our no-cost programs tackle the symptoms and causes of alcohol and drug dependence."
full_description = "For more than 100 years, The Salvation Army has operated rehabilitation facilities across the country that provide help and hope to individuals with a variety of problems, including issues relating to substance abuse. Our charitable residential programs offer spiritual, emotional, and social assistance in an environment designed to help participants live healthy, fulfilling lives. The Salvation Army Adult Rehabilitation Centers have served as beacons of hope to people seeking help for any number of social and life issues, including problems related to substance abuse. Our programs focus on the physical, emotional, and spiritual well-being of the people who choose to participate. The Salvation Army’s Adult Rehabilitation Centers are 180-day residential work-therapy programs providing spiritual, social, and emotional assistance to people who have lost the ability to cope with their problems and provide for themselves. The program is generally provided without charge to the participants once the Center staff has determined that the program can appropriately address the needs of the applicant (insurance is not necessary). Other minimum requirements include the following: The rehabilitation services at our Adult Rehabilitation Centers are examples of The Salvation Army’s commitment to meeting human needs in Jesus’s name without discrimination by helping individuals at the most difficult times in their lives to regain their dignity and independence. The Adult Rehabilitation Centers have a proven track record of helping people move to independence by offering classes, counseling, spiritual care, and opportunities to aid the rehabilitation process by developing strong work habits. Through group and individual counseling sessions, spiritual direction, holistic work therapy, and life-skills development, program participants learn to overcome problems, including abandoning substance reliance. The physical and spiritual components of the program equip participants with the tools to provide for themselves and others as they set and maintain sustainable employment goals."
