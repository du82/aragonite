["https://www.salvationarmyusa.org/usn/national-commanders-red-kettle-challenge"]
title = "National Commander's Red Kettle Challenge | The Salvation Army USA"
description = "This challenge provides a fun and engaging opportunity to raise awareness and funds for your local The Salvation Army."
full_description = "For the fifth year, The Salvation Army’s National Commander, Commissioner Kenneth Hodder, is challenging Salvation Army officers, employees, elected officials, and community supports across America to raise more money than him in a four-hour bell-ringing shift December 14th. Each year, The National Commander’s Red Kettle Challenge has continued to reach new heights in helping raise awareness and funds for your local Salvation Army. In years past, we have exceeded our fundraising expectations. This year we hope to meet our national goal of $2,000,000 but we will need everyone's help. Use the map below find a Red Kettle location near you to donate. Every donation made during the four-hour challenge goes back to your local Salvation Army. Come out and support your community with us this December 14th! Locate the nearest participating location in the map below to stop by and drop some money in the kettle. Your donation will be used to support hardworking families to stay in their homes and provide food, shelter, and utilities to those in need in your community. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
