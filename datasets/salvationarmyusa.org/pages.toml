["https://www.salvationarmyusa.org/usn/employment-opportunities"]
title = "Employment Opportunities | The Salvation Army USA"
description = "The Salvation Army employment opportunities at National Headquarters, Alexandria, VA"
full_description = "Positions listed here are open at The Salvation Army's National Headquarters in Alexandria, VA only. View Salvation Army opportunities by region or contact your local Salvation Army for job opportunities in your area. The National Advisory Organizations & Volunteer Development Manager will play a pivotal role in the growth and effectiveness of Salvation Army advisory organizations and volunteerism throughout the United States. Your mission will be to strategically oversee and enhance all facets of AO development, from conceptualizing innovative strategies to orchestrating impactful learning opportunities. Project manager to the grant proposal process, including implementation and disbursement of dollars to Salvation Army territories; cultivates strong working relationships with key funders in order to maintain sustainable funding; participates in grant related presentations as required; oversees procurement of additional funding, including research and grant writing. The System Administrator supports The Salvation Army's systems, including servers, networks, and communication hardware/software, proactively addressing issues. Responsibilities include resolving trouble tickets, enhancing the computing experience, and managing the Microsoft Office 365 environment for National Headquarters. The role involves daily system configuration and operation tasks to ensure availability, functionality, security, and performance. This position also provides higher-level Service Desk support and manages mobile device support through research, testing, troubleshooting, and deployment... The Data Warehouse Administrator is responsible for managing and optimizing the performance of a data warehouse, ensuring the integrity, security, and efficient storage and retrieval of data. This role involves collaborating with database developers, data architects, and business intelligence teams to design, implement, and maintain data warehouse solutions. Oversees the installation, configuration, and maintenance of data warehouse databases. Managing schema design, indexing, and optimizing SQL queries for efficient data retrieval..."
