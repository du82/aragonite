["https://salvationarmyusa.org/usn/2023-annual-report-1"]
title = "Annual Reports | The Salvation Army USA"
description = "The Salvation Army annually helps more than 25 million Americans overcome poverty, addiction, and economic hardships through a range of social services."
full_description = "In 2023, The Salvation Army helped nearly 27.5 million in the U.S. overcome poverty, addiction, and economic hardships through a range of social services. By providing food, emergency disaster relief, rehabilitation services, clothing and shelter, The Salvation Army is meeting human needs without discrimination at 6,401 centers of operation across the country. For over 150 years, The Salvation Army has shown love beyond hunger. Last year, nearly 167 million meals were served to those who needed them most. The Salvation Army understands the importance of financial aid. That's why 3,052,827 of people in the U.S. in need received financial assistance from The Salvation Army. Everyone deserves a roof over their head and a comfortable bed to lie in. By providing over 9 million nights of shelter, The Salvation Army is committed to showing love beyond evictions. The human spirit is remarkable. Nearly 1.5 million people dedicated their time and energy to volunteering for The Salvation Army last year. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
