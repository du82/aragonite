["https://salvationarmyusa.org/usn/contact"]
title = "Contact Us | The Salvation Army USA"
description = "Contact The Salvation Army National Headquarters, Alexandria Va"
full_description = "The Salvation Army's services, programs, and operations are unique to the communities in which they serve. Please enter a zip code below to find contact information for your nearest Salvation Army location. Many anwsers to commonly asked questions are available on our website. Listed below of several of the most commonly asked questions. At The Salvation Army, we take the security and privacy of our donors' personal information very seriously. We understand the importance of maintaining the trust of our supporters and have implemented robust measures to protect the data provided to us. As part of our commitment to safeguarding donor information, we have partnered with Classy, the leading digital fundraising platform used by The Salvation Army. Classy's privacy policy, which outlines their comprehensive security measures, can be accessed at classy.org/terms/privacy. Their state-of-the-art security protocols helps to ensure that all donor data is protected from unauthorized access, alteration, or disclosure. By adhering to strict security standards and leveraging Classy's advanced privacy practices, we aim to provide a secure and trustworthy environment for our donors to support our cause. Learn more about The Salvation Army's Privacy Policy. Please contact The Salvation Army Donor Services by completing our online inquiry form or calling 1-800-SAL-ARMY. Please contact The Salvation Army donor services by completing our online inquiry form or calling 1-800-SAL-ARMY. Receipts for mail donations are typically sent within 3 weeks following when The Salvation Army receives your gift. For online donations or donations made via 1-800-SAL-ARMY, a receipt is sent via email within minutes of the successful transaction. If you did not receive a receipt for a financial gift you've made, please contact Donor Services by completing our online inquiry form or calling 1-800-SAL-ARMY. Refunds are available within 180 days of your original (online) donation: - By calling donor services (1-800-SAL-ARMY) - By completing our online inquiry form If the requested refund is beyond 180 days of the original donation, please call 1-800-SAL-ARMY, and your request will be evaluated on an individual-case basis."
