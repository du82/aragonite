["https://www.salvationarmyusa.org/usn/flood-relief"]
title = "Flood Relief | The Salvation Army USA"
description = "The Salvation Army provides relief to those who have been impacted by floods."
full_description = "Rising flood waters can be fear-inducing and dangerous. Sometimes, floods destroy homes or entire communities. If you have been impacted or displaced by flooding in your area, contact your local Salvation Army or find a Salvation Army shelter near you to get emergency assistance. Floods are the most common natural disaster in the United States, and one of the most costly. They are usually the aftermath of severe storms such as hurricanes and tornadoes, or can be caused by thawing snow, several days of severe rain, or overflowing dams and water systems. Because of the various environmental causes, floods can happen at different speeds. Flash floods, for example, come on with very little warning. Even if there is minor flooding in your area, floodwaters are deceptively dangerous. They can hold chemical waste, debris, and animals, or electrically charged currents. Six inches of moving water can knock you off your feet, and two feet of moving water can push your car away. Despite their unpredictability and dangers, you can prepare for a flood to stay safe. In the wake of any type of disaster, The Salvation Army has been boots on the ground, serving our neighbors in need. Our disaster relief efforts and disaster assistance programs serve affected communities through our emergency relief efforts, long-term recovery strategies, and spiritual care outreach. The Salvation Army acts as a partner to local organizations and federal authorities to provide emergency relief to survivors of flooding. Our disaster relief workers mobilize to the areas where disaster survivors are in need of necessities such as food, water, and basic comforts, and provide for those needs in addition to clean-up kits, blankets, and financial assistance to those that need supplies. We have emergency shelters across the nation for those who have lost their homes due to flooding, and can also turn our properties into refuge sites. We understand that disasters like floods leave lasting effects long after the waters have receded. The Salvation Army is committed to providing long-term recovery and disaster relief efforts for as long as a community requires us. Our disaster recovery teams and emergency service providers often stay months and sometimes years after a disaster, working with local, state, and federal authorities to help with long-term disaster relief programs."
year_published = 2025
clearnet = "https://www.salvationarmyusa.org/usn/flood-relief"
