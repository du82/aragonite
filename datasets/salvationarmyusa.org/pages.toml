["https://www.salvationarmyusa.org/usn/disaster-preparedness"]
title = "Disaster Preparedness | The Salvation Army USA"
description = "Disaster can strike at any moment, make sure you and your family are prepared."
full_description = "Every year, earthquakes, hurricanes, tornadoes, wildfires, droughts, floods, and other natural disasters pose a devastating threat to our communities. The impact of disasters causes Americans emotional damage and $145 billion in losses as of 2021, according to climate.gov. In the midst of a terrifying disaster, it can be hard to know your next step. Although natural disasters are hard to prevent, through planning, knowledge, and supplies, you can be ready to protect yourself and your family. The Salvation Army is recognized by the Robert T. Stafford Emergency and Disaster Assistance Act as a relief and disaster assistance organization. Specially trained members of our Emergency Disaster Services team are providing spiritual comfort and emotional support to people coping with trauma resulting from the aftermath of disasters. We maintain a fleet of emergency response vehicles across the U.S for disaster aid, which include mobile canteens and kitchens. We also operate warehouses nationwide to store food, water, and medicine. Across the nation, The Salvation Army has emergency shelters staffed with emergency service personnel and caseworkers to help your family get back on your feet in the event that a disaster has caused you to lose your job or home. Learn more about our emergency shelter programs. Preparation is essential to effectively serving others in disaster recovery. Just like families must make preparations for potential dangers, disaster relief workers prepare by taking training classes. Courses are designed for adult learners, focusing on group interaction and cooperative learning. Training courses include classes in incident management, canteen operations, food service, emotional and spiritual care, as well as basic first aid and CPR training. After an emergency, you may be forced to ride out a storm, shelter in place, or evacuate. In any disaster situation, it's imperative that you have the supplies to survive on your own for several days. A disaster preparedness kit should contain basic household items you may need during an emergency. You should ensure you have vital supplies at home, work, and your car since you never know when a disaster may strike."
year_published = 2025
clearnet = "https://www.salvationarmyusa.org/usn/disaster-preparedness"
