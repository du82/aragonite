["https://salvationarmyusa.org/usn/bonds-funds-and-stocks"]
title = "Bonds, Funds and Stocks | The Salvation Army USA"
description = "To donate mutual funds, stock securities, please select your state of residence and contact the respective individual."
full_description = "To donate mutual funds, bonds, and stock securities, please select your state of residence and contact the respective individual. We want to make every effort to obtain and provide you with the correct information that pertains to your gift and to acknowledge your contribution appropriately. Donating appreciated securities, including stocks, bonds, or mutual funds, is an easy and tax-effective way for you to make a gift to The Salvation Army. Benefits of gifts of stocks, bonds, and mutual funds: • Avoid paying capital gains tax on the sale of appreciated stock • Receive a charitable income tax deduction • Further our mission today If you hold securities in certificate form, you need to mail two envelopes separately on the same day to complete your gift. In the first envelope, place the unsigned stock certificate(s). In the other envelope, include a signed stock power for each certificate. You may obtain this power from your broker or bank. Please remember to use certified mail. Looking to gift stocks or bond or have any question? If you have any questions about gifts of stocks and bonds, please contact your regional representative by clicking your state on the map below. We are happy to assist you and answer any questions that you have. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
