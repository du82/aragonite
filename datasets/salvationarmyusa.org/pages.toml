["https://www.salvationarmyusa.org/usn/donate-cryptocurrency"]
title = "Donate Cryptocurrency | The Salvation Army USA"
description = "Put your crypto to work to benefit the world. Your generosity will help us fill some of the most critical gaps in society."
full_description = "While Bitcoin is the original cryptocurrency and most widely followed, there are several cryptocurrencies options currently available to help us Do the Most Good Put your crypto to work to benefit the world. Your generosity will help us fill some of the most critical gaps in society. We work to understand the obstacles, hardships, and challenges native to the area's particular population to offer immediate relief, short-term care, and long-term growth. Finally, we offer the local programs to the local community, working to continually optimze their efficacy via spiritual, physical, and emotional service. Please contact us if you have any questions or are interested in donating other types of cryptocurrency. Cryptocurrency, also known as Virtual Currency or “Crypto,” is a digital asset designed to function as an alternative to sovereign fiat currency (US Dollars, for example) whereby transactions between two parties are verified through a public, distributed ledger, also known as a blockchain. Most people think of Bitcoin and/or Ether when they hear the word “Crypto,” and while Bitcoin is the original cryptocurrency and most widely followed, there are a number of cryptocurrencies currently available. The Engiven platform is a third party vendor provided donation software technology that enables nonprofits to safely and securely receive cryptocurrency donations and then convert those donations into usable fiat currency such as US dollars. Learn more about Engiven here. Yes. It is lawful for a nonprofit to accept a donation in the form of a cryptocurrency. On March 2014, the United States Internal Revenue Service (IRS) ruled that Bitcoin is treated as property for tax purposes (IRS Notice 2014-21). For U.S. tax purposes, transactions using virtual currency must be reported in U.S. dollars. Therefore, taxpayers will be required to determine the fair market value of virtual currency in U.S. dollars as of the date of donation. If a virtual currency is listed on an exchange and the exchange rate is established by market supply and demand, the fair market value of the virtual currency is determined by converting the virtual currency into U.S. dollars (or into another real currency which in turn can be converted into U.S. dollars) at the exchange rate, in a reasonable manner that is consistently applied. Donors who give cryptocurrency donations to The Salvation Army USA Western Territory will receive an electronic donation receipt (through the Engiven donation platform) in US dollars with comprehensive details about each transaction."
year_published = 2025
clearnet = "https://www.salvationarmyusa.org/usn/donate-cryptocurrency"
