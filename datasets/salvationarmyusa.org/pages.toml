["https://www.salvationarmyusa.org/usn/the-lgtbq-community-and-the-salvation-army"]
title = "LGBTQ Support | The Salvation Army USA"
description = "Service to All Without Discrimination"
full_description = "We serve the most vulnerable regardless of age, race, religion, sexual orientation, gender identity, or gender expression. Our hearts, services, and facilities are open to all. Our hiring practices are open to all, and we provide the same benefits to opposite-sex and same-sex couples. Each of our homeless shelters, transitional housing programs, permanent supportive housing services, and re-entry resources are available to anyone in need, according to their need and our capacity to help regardless of race, gender, ethnicity, or sexual orientation. Period. And because a majority of homeless LGBTQ+ people are under 18, we take special care of that vulnerable community. Read how The Salvation Army’s Young Adult Resource Center (YARC) in Houston collaborates (and shares a roof) with Tony’s Place, a center for LGBTQ+ youth who do not have stable housing. In addition, almost one-third of transgender people have been rejected from an emergency shelter. This is why The Salvation Army in Southern Nevada created a safe dorm in Las Vegas to offer safety and shelter to this group, which is statistically more vulnerable to assault. According to the Substance Abuse and Mental Health Services Administration, LGBTQ+ adults are more likely than their straight counterparts to abuse substances. The Salvation Army recognizes the need for all people, regardless of income, to have access to rehabilitation programs. Our LGBTQ+-friendly programs provide housing, food, counseling, community, and employment as we work to treat the symptoms and, ultimately, the root causes of prolonged alcohol and drug dependence. Hear Richard’s story of recovery through the Salvation Army’s Adult Rehabilitation Center in Denver that demonstrated he was worthy of Christ’s love. More than a quarter of LGBTQ+ Americans are food insecure and rely on the Supplemental Nutrition Assistance Program (SNAP). As one of the nation's largest providers of social services, we understand the importance of helping people maintain their dignity when looking for nutritious food by providing options."
year_published = 2025
