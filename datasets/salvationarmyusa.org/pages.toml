["https://www.salvationarmyusa.org/usn/brighten-the-holidays"]
title = "Holiday Giving | The Salvation Army USA"
description = "Every day hard working families are in danger of losing their homes. Thanks to you, Hope Marches On. Through hunger, fears of eviction, and endless bills."
full_description = "Most people know The Salvation Army for our Red Kettles, our Angel Trees, and our strong presence during the holiday season, but we support local families all throughout the year. Put a present under someone’s tree today with our Salvation Army Christmas Program. And a roof over someone’s head tomorrow. The donations we collect during the holiday season not only help us provide gifts to children who would otherwise go without, but they also help us provide food, shelter, and utility assistance to those who need it most every day of the year. Every dollar dropped into a red kettle helps give local families the Christmases they deserve and the yearlong support they so desperately need. If you or a loved one needs help, please contact your local Salvation Army to see what services are available in your area. Grammy-Winning Country Artist Lainey Wilson is performing at The Salvation Army’s annual Red Kettle Kickoff Halftime Show during the Dallas Cowboys game to launch the season of giving and help us work toward making this the best Red Kettle Campaign yet. This Giving Tuesday, your dollar stays local when you give to The Salvation Army. Help your neighbors in need of food, shelter, and love. Christmas is a season of giving, which for many of us means showering those we love with gifts. But it’s also about giving to those most in need. This holiday, donate to The Salvation Army Christmas Program and help us continue to provide vital services. Every year, The Salvation Army’s Angel Tree program puts new clothes and toys under the tree for 1 million children who usually must go without Christmas gifts. Anonymous donors adopt these little “angels” in an expanding Christmas tradition that makes the season more rewarding for the gift giver and happier for the receiver. This year, please consider taking a few more angels off the tree or donating gifts in bulk to our Salvation Army Christmas Program. As part of our ongoing efforts to address the homelessness epidemic in the United States, The Salvation Army serves people in need of a safe place to stay 365 days a year through our network of homeless shelters, traditional housing, permanent supportive housing, and reentry resources. Your donations help us provide shelter, food, and other essential services to those in need."
year_published = 2025
