title = "Double Your Donation | The Salvation Army USA"
description = "Help us leverage your generous donation by getting your employer to match your contribution."
full_description = "Help us leverage your generous donation by getting your employer to match your contribution. Check below to see if your company will also support us. Numerous companies offer programs that match their employees' charitable donations. By participating in corporate gift matching, your employer can significantly amplify your contribution to The Salvation army Companies and foundations have different processes for employees to request matching gifts. The specific conditions and criteria for these matches vary by employer. Additionally, some employers extend matching programs to include donations made by spouses, retirees, and board members. Please be sure to check our matching gift database by searching in the tool above. If you find your employer, follow the provided links or download and complete the relevant forms. If you do not see your employer, please contact your company's personnel or human resources department to research your options. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
