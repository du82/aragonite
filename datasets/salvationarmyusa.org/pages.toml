["https://www.salvationarmyusa.org/usn/who-we-are"]
title = "Who We Are | The Salvation Army USA"
description = "The people who make up The Salvation Army"
full_description = '''General Lyndon Buckingham and Commissioner Bronwyn Buckingham The General and Commissioner Buckingham for The Salvation Army International Headquarters. Read more National Commander and National Secretary for Program Commissioners Merle and Dawn Heatwole are the National Commander and National Secretary for Program for The Salvation Army in the U.S. Read more Salvation Army Officers Operations of The Salvation Army are supervised by trained, commissioned officers. They proclaim the gospel and serve as administrators, teachers, social workers, counselors, youth leaders, and musicians. Read more Salvation Army Soldiers The soldiers of The Salvation Army (wearing blue epaulets), the committed laity, are local citizens in communities throughout the U.S. who give allegiance to the doctrines and disciplines of the Army. There are more than 96,000 soldiers in the United States. Read more National Advisory Board Distinguished members of The Salvation Army's National Advisory Board are notable community leaders who voluntarily use their professional skills and knowledge to plan, advise, and generally assist The Salvation Army on issues of national significance. Read more Volunteers From its inception, The Salvation Army has relied heavily on volunteers who support its programs. Often referred to as "the army behind The Army," volunteers play a crucial role The Salvation Army's ability to provide quality social services for the entire community. Read more General Lyndon Buckingham and Commissioner Bronwyn Buckingham, originally from the New Zealand, Fiji, Tonga and Samoa Territory, are passionate representatives of The Salvation Army. They have served as officers since they were commissioned in 1990 as members of the Ambassadors for Christ Session. Commissioner Lyndon was appointed Chief of the Staff on 3 August 2018 and Commissioner Bronwyn as World Secretary for Spiritual Life Development on 1 January 2021, having previously served as World Secretary for Women’s Ministries. They assumed their current responsibilities as General and World President of Women’s Ministries on 3 August 2023. Over the years of their officership they have served in corps appointments in New Zealand and Canada, as Territorial Youth and Candidates Secretaries, Divisional Leaders and Territorial Programme Secretaries. On 1 February 2013 the Buckinghams were appointed to the Singapore, Malaysia and Myanmar Territory, firstly as Chief Secretary and Territorial Secretary for Women’s Ministries respectively, before assuming territorial leadership in June 2013. On 1 January 2018 they were appointed to lead the United Kingdom and Ireland Territory, Commissioner Lyndon Buckingham as Territorial Commander and Commissioner Bronwyn Buckingham as Territorial Leader for Leader Development. Bronwyn and Lyndon are blessed to be parents and grandparents. They are continually encouraged and challenged by the desire of their adult children to serve God in their generation. In each of their appointments the Buckinghams have displayed a desire to see the great news of the gospel shared. Bronwyn is inspired by the belief that God has a new truth to reveal to her daily and compelled by the promise that he is continuing to grow and stretch her (Philippians 1:6 NIV). She desires to be the woman God is calling her to be and is passionate to be part of an Army where the next generation will choose to embrace their leadership calling. Lyndon is passionate about finding ways for The Salvation Army to be more effective in fulfilling its mission. He is determined to be faithful to the covenants he has made and is motivated by verses from Paul’s letter to the Colossians: ‘Whatever you do, work at it with all your heart, as working for the Lord, not for men’ (Colossians 3:23 NIV 1984). Both are intent on enjoying life, endeavoring to stay fit by walking and rowing. They enjoy reading, watching good movies and are avid supporters of New Zealand’s ‘All Blacks’ rugby union team!'''
year_published = 2025
clearnet = "https://www.salvationarmyusa.org/usn/who-we-are"
