["https://www.salvationarmyusa.org/usn/help-disaster-survivors"]
title = "Disaster Relief | The Salvation Army USA"
description = "Help us keep open homeless shelters, food pantries and other services so essential during this global pandemic."
full_description = "Every year, natural disasters destroy local economies and devastate lives. They cost billions of dollars each year and cause our neighbors trauma and emotional damage. Earthquakes, hurricanes, tornadoes, wildfires, droughts, floods, and other major disasters pose a great threat to our country. We’re here to help — in any given year, The Salvation Army provides support, hope, and healing to nearly 600,000 survivors and first responders. Support recovery efforts for these large-scale disasters. Learn more about how we support disaster recovery efforts below. The Salvation Army is responding to the recent fires in Los Angeles, CA, with disaster food services for emergency responders and families in need and mobilizing to serve those affected in the emergency shelters. Learn more about how The Salvation Army is assisting communities and first responders affected by Hurricane Milton. The Salvation Army is responding to Hurricane Helene. Learn more about how The Salvation Army is helping after this historic storm. The Salvation Army Alabama Louisiana & Mississippi Division is mobilizing to support communities as Hurricane Francine approaches. We stand ready to meet the needs of affected communities. No matter where disaster strikes, The Salvation Army is already there with a comprehensive emergency response plan. As one of the most well-known disaster-relief organizations in the country, The Salvation Army is ready with immediate response and recovery plans unique to the community affected. Plans forged from decades of recovery efforts and learnings from across the world. We serve in nearly every community in the United States long before a disaster happens. We’re among the first on the spot, providing wildfire, flood, tornado, or hurricane relief, and we stay long after a catastrophe has passed. Our experience covers decades of leading recovery efforts – since the 1900 Galveston Hurricane, our trained staff and volunteers have served survivors and first responders of every major disaster."
