title = "The Salvation Army USA"
description = "The Salvation Army in the United States of America."
full_description = "Make a one-time or monthly donation to help your neighbors in need receive food, shelter, and bill assistance this Christmas. Each year, millions of children don't have any Christmas gifts to unwrap because there's no money in the budget. Eighty-two cents of every dollar given to The Salvation Army goes to work in the community in which it was donated. FIRST, we assess the needs of each community in which we serve. We work to understand the obstacles, hardships, and challenges native to the area's particular population. NEXT, we build local programs designed to offer immediate relief, short-term care, and long-term growth in the areas that will best benefit the community. THEN, we offer the local programs to the local community, working to continually optimize their efficacy via spiritual, physical, and emotional service. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
