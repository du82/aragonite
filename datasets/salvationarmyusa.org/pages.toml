["https://salvationarmyusa.org/usn/about"]
title = "About Us | The Salvation Army USA"
description = "About the Salvation Army"
full_description = '''The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. General Lyndon Buckingham and Commissioner Bronwyn Buckingham The General and Commissioner Buckingham for The Salvation Army International Headquarters. Read more National Commander and National Secretary for Program Commissioners Merle and Dawn Heatwole are the National Commander and National Secretary for Program for The Salvation Army in the U.S. Read more Salvation Army Officers Operations of The Salvation Army are supervised by trained, commissioned officers. They proclaim the gospel and serve as administrators, teachers, social workers, counselors, youth leaders, and musicians. Read more Salvation Army Soldiers The soldiers of The Salvation Army (wearing blue epaulets), the committed laity, are local citizens in communities throughout the U.S. who give allegiance to the doctrines and disciplines of the Army. There are more than 96,000 soldiers in the United States. Read more National Advisory Board Distinguished members of The Salvation Army's National Advisory Board are notable community leaders who voluntarily use their professional skills and knowledge to plan, advise, and generally assist The Salvation Army on issues of national significance. Read more Volunteers From its inception, The Salvation Army has relied heavily on volunteers who support its programs. Often referred to as "the army behind The Army," volunteers play a crucial role The Salvation Army's ability to provide quality social services for the entire community. Read more Soon after beginning his ministerial career in England in 1852, William Booth abandoned the concept of the traditional church pulpit in favor of taking the gospel of Jesus Christ directly to the people. Walking the streets of London, he preached to the poor, the homeless, the hungry, and the destitute.'''
