["https://salvationarmyusa.org/usn/stop-domestic-abuse"]
title = "Help for Domestic Abuse | The Salvation Army USA"
description = "The Salvation Army helps save victims from domestic violence."
full_description = "We provide immediate assistance to victims of domestic violence and put them on the path to independence at this 24-hour shelter specifically designed for women and children escaping domestic abuse. The center provides everything from health referrals, counseling, and transportation to GED certification programs, parenting classes, employment assistance, and permanent housing placement. We also offer children a nurturing environment in a therapeutic preschool program. The location of the facility is kept private for the safety of our clients. This refuge offers a safe haven to families of up to eight and children 17 and under, harboring over 1 million women each year. Over the course of up to 120 days, Elim House empowers victims of domestic abuse through personal goal and safety plan development. They also offer crisis counseling and recreational activities, such as field trips, games, and arts and crafts, for children escaping domestic violence. We put victims of domestic abuse on the road to recovery with this extensive program. In addition to providing confidential emergency and transitional shelters, we help them take steps toward recovery and living independently. In providing its relief programs and services to those experiencing domestic abuse, The Salvation Army is committed to accommodating all those in need without unlawful discrimination or harassment based on age, race, color, religion, sex, national origin, marital status, disability, citizenship, sexual orientation, gender identity, gender expression, or any other characteristic in accordance with our capacity to help. Turn your passion into action. Share these facts with your friends and followers to educate and inspire change. One in 15 children is exposed to intimate partner violence each year, and 90% of those children are eyewitnesses to the violence. When you give to The Salvation Army, you provide funding for programs that help families escape domestic abuse. Donate Now. Men who were exposed to domestic violence as children are three to four times more likely to perpetrate domestic violence as adults."
