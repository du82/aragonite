["https://salvationarmyusa.org/usn/cure-hunger"]
title = "Food Pantries | The Salvation Army USA"
description = "Food insecurity is at an all-time high during this global pandemic. Help our food pantries and meal programs feed the hungry."
full_description = "We provide neighborhood food pantries, mobile food meal programs, and food parcels to ensure everyone has enough to eat and to eliminate food insecurity. At The Salvation Army, we know that one of the first results to occur in times of crisis is food insecurity, prompting many to look for food assistance programs. Many families don’t know where their next meal will come from. Whether the cause is a natural disaster, financial strain, or a pandemic, many families in need struggle to find nutritional food. According to the USDA, in 2020, 6.7% of all U.S. households reported using a food pantry, an increase from 4.4% in 2019. For some, food pantries are a source of emergency aid to solve a hunger crisis. For others, food pantries supplement low-income families with nutritious meals. At The Salvation Army, our food pantries and meal programs provide a variety of healthy food and basic-need items for those seeking food assistance and to help them regain household food security. Our vision is to provide people facing food insecurity with the resources and support needed to improve their health and well-being through nutritious food in welcoming environments, including food distribution programs. If you or your family are hungry and don’t know where to get your next meal, you are not alone. Find food through our services at the nearest Salvation Army Food Pantry near you. The Salvation Army recognizes the importance of food security by offering various food programs for people and families across the United States. Through community engagement, volunteering, and generous donations, we can meet the needs of food-insecure individuals through the following food programs: The Salvation Army has many neighborhood food pantries to provide nutrition and other necessary items for you or your family. A typical visit to one of our food pantries will provide you with a three-to-five-day supply of nutritionally balanced groceries, completely free of charge. Our food pantries supply nonperishable food and dry pantry goods, with a focus on balanced grains, canned vegetables and fruits, proteins, and pasta. Knowing that these may only provide short-term relief, our food pantries also provide resources to help provide longer-term food support, plus access to different food bank locations."
year_published = 2025
