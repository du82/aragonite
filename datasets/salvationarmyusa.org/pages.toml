["https://www.salvationarmyusa.org/usn/teach-kids"]
title = "After-School Programs | The Salvation Army USA"
description = "Serving All Without Discrimination: Discover how the Salvation Army’s after-school programs change children’s lives."
full_description = "Children in the United States spend 80% of their waking hours outside of school, and 1 in 5 children are alone after the school day ends. After-school programs have been proven to foster social and academic development as programs provide safe and structured environments for kids during after-school hours, oftentimes filling the space between the end of the school day and when parents return from work. We know that every parent wants the best for their child’s future. Sometimes, in a world filled with distractions and challenges, finding the right support system can make all the difference. From homework assistance and tutoring to encouraging higher grades and boosting motivation to team-building activities and cooperative learning experiences that help develop essential social skills, our after-school programs are designed to empower kids to unlock their potential and thrive. The Salvation Army’s after-school programs are designed to inspire and challenge. For instance, the Cedar Rapids Salvation Army recently opened a new computer lab at its C Avenue headquarters as part of its after-school programs. The lab provides academic support, homework help, and enrichment opportunities to kids who otherwise have no access to computers. And The Salvation Army of North Texas, through its after-school programs, strikes the perfect balance of learning and having fun. In addition to providing homework assistance and tutoring, the staff also encourages kids to engage in art, music, STEM (science, technology, engineering, and math), martial arts, sports, and culinary arts. Healthy minds and healthy bodies are both crucial elements of youth development. Our no-fee and low-cost after-school programs offer children a chance to play sports and learn athletic skills. Our exciting after-school sports programs inspire a love for health and fitness while teaching teamwork and leadership skills that build healthy, positive relationships with peers. Consider the Seattle White Center after-school program. Best described as an action-packed game where fun meets growth, The White Center organizes youth sports leagues for basketball and futsal, a fast-paced soccer game played on the gym floor with a low-bounce ball and smaller goals. The kids have a blast and learn the essentials of teamwork and other skills that will stay with them for a lifetime."
year_published = 2025
clearnet = "https://www.salvationarmyusa.org/usn/teach-kids"
