["https://salvationarmyusa.org/usn/fight-human-trafficking"]
title = "Responses to Human Trafficking | The Salvation Army USA"
description = "The Salvation Army provides refuge and relief for human trafficking victims."
full_description = "Human trafficking is a heinous crime that exploits the most vulnerable through threats of violence and abuse of power to maintain control over victims. In 2021, an estimated 49.6 million people were living in modern slavery, including 27.6 million in forced labor and 22 million in forced marriage. (ILO) The Salvation Army raises national awareness of the injustices of human trafficking in collaboration with local and international partners, coalitions and nongovernmental organizations. Through prevention activities, we reduce vulnerabilities and demand for forced labor and commercial sexual exploitation. We pursue safety and justice for those who are victims of trafficking and offer holistic support and social services to survivors. In 2021, The Salvation Army helped 8,865 trafficking survivors. Read The Salvation Army's 2021 National Impact Report. We provide ongoing support and services to those who have survived trafficking through our victim assistance programs. Along with the immediate needs of shelter, transportation, food, and clothing, we address physical and psychological trauma through a variety of services, including: For more than 150 years, The Salvation Army has stood firmly behind individuals impacted by trafficking and exploitation. In the 1800s, we pioneered an undercover sex trafficking investigation, which directly shaped the Criminal Law Amendment Act of 1885. By 1900, The Salvation Army had created over 100 safe house throughout London, New York, and other global locations to help those fleeing exploitative circumstances. Over a century later, we remain fully committed to eradicating forced labor and sexual exploitation and to ending sexual and gender-based violence. In providing its anti-human trafficking programs and services, The Salvation Army is committed to serving all those in need without discrimination or harassment based on age, race, color, religion, sex, national origin, marital status, disability, citizenship, sexual orientation, gender identity, gender expression, or any other characteristic in accordance with our capacity to help."
