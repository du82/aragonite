["https://salvationarmyusa.org/usn/service-to-all"]
title = "Commitment to Diversity | The Salvation Army USA"
description = "The Salvation Army is committed to combatting racism and its impacts at an organizational, individual, and societal level."
full_description = "Equality has always been part of The Salvation Army’s mission and values. We uphold the dignity of all people, believing that everyone is equal in the eyes of God. Racism is fundamentally incompatible with the Christian conviction that all people are made in the image of God and are equal in value. The Salvation Army believes that the world is enriched by a diversity of cultures and ethnicities. “There before me was a great multitude that no one could count, from every nation, tribe, people and language, standing before the throne and before the Lamb.” (Revelation 7:9) The Salvation Army is committed to combatting racism and its impacts at an organizational, individual, and societal level. We recognize the importance of robust systems to report and discuss racism without fear and will endeavor to provide these and will continue to make efforts to ensure ethnic diversity in international and territorial leadership. In providing its programs and services, The Salvation Army is committed to accommodating all those in need without unlawful discrimination or harassment based on age, race, color, religion, sex, national origin, marital status, disability, citizenship, sexual orientation, gender identity, gender expression, or any other characteristic in accordance with our capacity to help. The Salvation Army is an Equal Opportunity Employer and committed to providing a respectful environment for all applicants and employees that is free from unlawful discrimination or harassment based on age, race, color, religion, sex, national origin, marital status, disability, citizenship, sexual orientation, gender identity, gender expression, or any other characteristic protected by law. Such equal opportunity for employment will apply to recruitment and hiring, training, promotion, salaries and other compensation, transfers and layoffs or termination. While many Salvationists have acted firmly and courageously against racism, we acknowledge that Salvationists have sometimes conformed to economic, political, social, and internal pressures that perpetuate racism. The Salvation Army is committed to fighting against racism wherever it is experienced and will speak into societies around the world wherever we encounter it."
year_published = 2025
clearnet = "https://salvationarmyusa.org/usn/service-to-all"
