["https://www.salvationarmyusa.org/usn/provide-shelter"]
title = "Homeless Shelters | The Salvation Army USA"
description = "During times like the current global pandemic, the homeless are especially vulnerable. Here's how you can help."
full_description = "From emergency homeless shelters to long-term housing assistance, The Salvation Army provides a wide array of services to address homelessness in communities across America. As of 2021, approximately 11.6% of people in the United States were living in poverty. Housing insecurity is not limited to a certain “type” of person. It can happen to virtually anyone at any time. The number of sheltered individuals with chronic patterns of homelessness increased by 20% between 2020 and 2021. This is a challenge that we are tackling with full heart and compassion. For those with no safe place to go or in need of emergency shelter, local Salvation Army shelters provide a warm, secure place for homeless men, women, and children to stay. At The Salvation Army, our doors are open every day — and night — of the year. Through our emergency housing facilities, homeless shelters, transitional living centers, group homes, and family shelters, we provide more than 8 million nights of lodging annually. In some cities where we do not currently operate homeless shelters, we help provide financial assistance to cover emergency overnight housing costs or refer those facing food insecurity and those at risk of homelessness to trusted partner programs with emergency shelter services. In addition to supplying beds, food, shelter from the elements, and basic hygiene resources to those in need, we help combat long-term homelessness in America by providing homeless adults, veterans, and children with holistic physical, emotional, and spiritual support. During the COVID-19 outbreak, our homeless shelters evolved and innovated to provide a variety of services to their neighbors in need despite the ongoing and ever-changing challenges. Check out The Salvation Army of Marquette County, Michigan’s successful efforts to keep people fed and sheltered when the public transit system was shut down due to the COVID-19 pandemic. Our transitional housing programs are designed to transition unhoused people into more permanent living situations. In many programs, The Salvation Army provides case management, child care, job skills training, substance abuse counseling, job placement, and referral to resources when needed."
year_published = 2025
