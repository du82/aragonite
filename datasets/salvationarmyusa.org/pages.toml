["https://www.salvationarmyusa.org/usn/hurricane-relief"]
title = "Hurricane Relief | The Salvation Army USA"
description = "Every year, hurricanes across the United States cause widespread damage and turn lives upside down"
full_description = "The Salvation Army began offering assistance to disaster survivors after a major hurricane hit Galveston, TX, in September 1900, destroying the coastal city and becoming the deadliest hurricane in U.S. history. The Army has consistently responded to hurricanes over the years, providing essential resources to those impacted by these destructive storms. Each hurricane season brings a heightened state of readiness and response as we gather our resources to ensure readiness at any given time. If you have been impacted or displaced by a hurricane, contact your local Salvation Army to find a Salvation Army shelter near you and receive emergency assistance Food Service The Salvation Army has served 452,175 Hot Meals, 42,045 Meal Kits, 207,512 Drinks and 220,006 Snacks from mobile feeding units in six states. Meals are provided in partnership with Southern Baptist Disaster Relief and other organizations. Emotional And Spiritual Care Salvation Army caregivers have provided emotional and spiritual to 44,208 People. Food Service The Salvation Army has served 167,803 Hot Meals, 10,632Meal Kits, 81,459 Drinks and 104,063 Snacks from mobile feeding units in six states. Meals are provided in partnership with Southern Baptist Disaster Relief and other organizations. Emotional And Spiritual Care Salvation Army caregivers have provided emotional and spiritual to 13,039 People. Our hurricane relief efforts begin well before the storm makes landfall. Even before there are disaster declarations, we are planning and mobilizing relief teams from around the region and around the country so that we can have the additional boots on the ground needed in the communities as soon as disaster strikes. There, we work with local organizations and federal authorities to bring people the vital resources and comfort they so desperately need. These services include: In the past several decades, we have been there before, during, and after all major disasters hit the United States, including Hurricanes Katrina, Hurricane Harvey, and Hurricane Sandy."
