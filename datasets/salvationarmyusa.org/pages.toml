["https://salvationarmyusa.org/usn/corporate-partnerships"]
title = "Corporate Partnerships | The Salvation Army USA"
description = "Salvation Army Corporate Partnerships"
full_description = '''The Salvation Army is one of the most recognized and beloved charities in the world and has a geographic footprint that stretches across almost every zip code in America, and 133 countries. This means the opportunities to create meaningful partnership experiences that match your business objectives, customer base, and corporate philanthropy focus are endless. We look forward to discovering opportunities to work with you to engage employees, delight customers, and increase sales — all while doing good for people in need. "The Salvation Army is by far the most effective organization in the United States. No one else even comes close to it with respect to clarity of mission, ability to innovate, measurable results, dedication, and putting money to maximum use." The Salvation Army is proud to partner with the following corporations who support our mission to meet human need. The Salvation Army helps more than 30 million people each year. That's nearly one person every second. With programs that meet the specific needs of each unique community we serve, The Salvation Army is filling some of the most critical gaps in society. Join us in making a marked impact in people's lives. With a presence in 133 countries and programs touching nearly every zip code in America, partnership with The Salvation Army means joining a large sophisticated network of people who are actively strengthening communities, providing hope to those in despair and reducing human suffering. A partnership with The Salvation Army can have a positive social impact on your business and engage your employees. Our team will work with you to develop a program that is customized for our shared values. In return, you will receive a lift in your brand’s reputation and the satisfaction of knowing you are part of the team that is Doing the Most Good. $(document).ready(function() { $('#accordion-1').prop('checked', true); }); //Get the button let mybutton = document.getElementById("btn-back-to-top"); // When the user scrolls down 20px from the top of the document, show the button window.onscroll = function () { scrollFunction(); }; function scrollFunction() { if ( document.body.scrollTop > 50 || document.documentElement.scrollTop > 50 ) { mybutton.style.display = "block"; } else { mybutton.style.display = "none"; } }'''
