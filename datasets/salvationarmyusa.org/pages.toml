description = "The Salvation Army airline miles donation program"
full_description = "You can use your miles to make a real difference in someone's life. With the SkyWish program, you can donate miles to The Salvation Army and join in supporting their worthwhile programs, such as moving personnel quickly in time of disaster, or providing travel for those in need of emergency medical care or who have social service emergencies outside of their area. All donations can be made through the SkyWish website or by e-mailing delta.bids@delta.com and including your name, SkyMiles number, SkyWish charity name, donation amount, and telephone number. If you would like to make a donation by fax or mail, Contact SkyMiles. Donations can also be made by calling the SkyMiles automated phone line at 1-800-325-3999. Donations must be a minimum of 1,000 miles and are not tax deductible for SkyMiles members or Delta. Allow up to 6 weeks for miles to be deducted from your account. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
