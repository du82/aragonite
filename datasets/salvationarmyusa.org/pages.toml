["https://www.salvationarmyusa.org/usn/rent-mortgage-and-utility-assistance"]
title = "Rent, Mortgage and Utility Assistance | The Salvation Army USA"
description = "The Salvation Army provides emergency services, including food, clothing, shelter, a safe space, and a hopeful word to everyone who needs it"
full_description = "The Salvation Army has been helping people in need for more than 150 years. We have seen many changes since then, but one thing remains constant: God calls us to serve those who are most vulnerable. Today, The Salvation Army provides emergency services, including food, clothing, shelter, a safe space, and a hopeful word to everyone who needs it — regardless of religion, race, gender, sexual orientation, or political affiliation. For many, making ends meet is a daily challenge, forcing people to choose between things like paying their utility bills, heating their homes and putting food on the table. We understand the stress these situations put on families and are here to help. With utility assistance, our goal is to provide resources that will help families stay in their homes. Salvation Army programs and services vary with local needs. For information on specific programs and locations, contact your local Salvation Army by using the location search. The Salvation Army understands the impact of unexpected life changes that can affect household income and lead to housing instability. Maybe you lost your job. Maybe you're a senior living on a fixed income. Maybe you're living with a long-term disability. If so, we are here for you. Throughout the country, The Salvation Army's emergency assistance programs are helping families pay their bills so they can keep the power and water on, fill prescriptions, and access transportation when necessary. Whether you own a home, are paying off a mortgage, or are currently renting, assistance is available to help reduce the financial and emotional burdens associated with housing, including options to apply for rental assistance through our program. As we saw in the early days of the COVID-19 pandemic, millions of people across the country were forced into making a choice between things like keeping a roof over their heads and putting food on their familiy's tables. We believe no one should have to make a decision like that, so we provide rent and mortgage relief to eligible households facing financial difficulties."
year_published = 2025
