["https://salvationarmyusa.org/usn/world-service-office-1"]
title = "Salvation Army World Service Office"
description = "The Salvation Army World Service Office -- Home"
full_description = "This Giving Tuesday empower our cause to improve the health, economic and spiritual conditions of the most vulnerable around the world! The purpose of SAWSO is to represent the interests of the four Salvation Army U.S.A. Territories as we work together with communities to improve the health, economic and spiritual conditions of the vulnerable throughout the world. The Salvation Army World Service Office (SAWSO) is an independent 501 (c) 3 organization dedicated to improving the health, economic, and spiritual conditions of the poor throughout the world where The Salvation Army is active. Since 1977, SAWSO has helped people help themselves through sustainable programs that improve living conditions, combat the spread of disease, raise skill levels, increase productivity, and instill self-confidence. For four decades, SAWSO has been delivering a proven approach to engaging individuals, families, and communities in evaluating their needs; creating transformational action plans; implementing effective strategies; and understanding how and why their actions can create positive change. Through funds entrusted to us, SAWSO is presently engaged in more than $57 million worth of projects throughout the world. Programs, projects, and activities provide tools and structure, but the real investment is in people. Our projects emphasize local ownership and community involvement as keys for lasting success. In all of our work, we employ a holistic approach to meet the physical, emotional, social, and spiritual needs of those served. With a presence in 134 countries, The Salvation Army’s global footprint is SAWSO’s map for engagement. SAWSO serves as a dedicated resource committed to responding to the global interests of The Salvation Army USA by: First, we assess the needs of each community in which we serve. We work to understand the obstacles, hardships, and challenges native to the area's particular population. Next, we build local programs designed to offer immediate relief, short-term care, and long-term growth in the areas that will best benefit the community."
