["https://www.salvationarmyusa.org/usn/news/hope-after-abuse"]
title = "Hope After Abuse | The Salvation Army USA"
description = "Life during the pandemic has been hard for everyone. It is more difficult for families already living on the margins or facing crises such as homelessness."
full_description = "Hope After Abuse Oct 25, 2021 Life during the pandemic has been hard for everyone. It is more difficult for families already living on the margins or facing crises such as homelessness, unemployment, and abuse. The Salvation Army is in the community to always support those in crisis. Alexis and her family sought help after several crises and multiple interstate moves. Alexis tried to keep her family together for the sake of her three children and because she loved her husband. But when his dependence on alcohol led to hostility and verbal and physical abuse in the home, Alexis knew it was time to leave with her boys. She quickly found help at a local shelter for survivors of domestic violence. Determined to make permanent arrangements and start over in a healthy environment, Alexis relocated the family to her sister’s home in Florida. But a family court judge required her to return to the Buffalo area so that the boys could have visitation with their father. The move back exhausted her remaining savings and forced her to leave most of her belongings in Florida. With the previous shelter full, the family reached out to The Salvation Army for help. Immediately, they found safety in the Army’s Emergency Family Shelter. During several moves and quarantine requirements, Alexis was able to maintain her full-time employment with a child-care organization but needed assistance finding and furnishing a home. Alexis enrolled in The Salvation Army’s Pathway of Hope program, which helped her find an apartment and secure furniture. The program also provided school supplies for her three boys. Alexis and her children are well on their way to rebuilding their lives."
year_published = 2025
