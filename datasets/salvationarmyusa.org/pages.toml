title = "Newsroom | The Salvation Army USA"
description = "Newsroom for the Salvation Army in the United States"
full_description = "National media relations are handled by The Salvation Army National Headquarters in Alexandria, VA, and its public relations consultant. All local media are asked to first contact their local Salvation Army representative for all inquiries, including spokesperson requests. The purpose of The War Cry, the official national publication of The Salvation Army in the United States, is the same as that for which the Army itself was called into being: to communicate the Christian gospel, to bring people to experience Jesus Christ as Savior and inspire them by His example. Peer is a Salvation Army youth publication for 16 to 22 year olds. By addressing topics related to faith, community and culture the mission of Peer is to ignite a faith conversation that will deepen biblical perspective, faith and holy living. “Peer” is your equal—a dependable companion as you journey through high school and college. The Salvation Army, an international movement, is an evangelical part of the universal Christian Church. Its message is based on the Bible. Its ministry is motivated by the love of God. Its mission is to preach the gospel of Jesus Christ and to meet human needs in His name without discrimination. The Salvation Army USA 615 Slaters Lane, Alexandria, Virginia 22314 | 1-800-SAL-ARMY | Privacy Policy | © The Salvation Army National Headquarters"
