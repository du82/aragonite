["https://salvationarmyusa.org/usn/assist-the-unemployed"]
title = "Job Training | The Salvation Army USA"
description = "Due to COVID-19, employment assistance is even more crucial for people in need. Our job training and placement services will get you back on your feet."
full_description = "The COVID-19 pandemic has taken a toll on our nation’s economy, and millions of people have experienced job losses in the past few months. Many of our newly jobless brothers and sisters were working paycheck to paycheck and only a month away from losing their homes, utilities, ability to feed their families, or all three. They are in danger of being homeless and jobless. Our “hand-up” employment services programs provide skills and strengths assessments, job-search counseling and support, and several programs that teach new job skills. These programs are increasingly important, as many government assistance programs – like SNAP and Medicaid – are adding work requirements to their eligibility criteria. We identify the strengths and abilities of the individual for the best job match. Often our assessments turn up skill sets that our client either didn’t know about or didn’t think were valuable. Let’s face it: Today’s job market is historically competitive no matter what the profession. By helping people pursue and complete school requirements, job-training services, certifications, and other requirements for employment, we tear down the qualification barriers standing in their way. For those with mental health or substance-abuse issues, we help them find the treatment and/or medication they need to perform at their best. Most career counselors will tell you personal and professional connections are keys to a successful job search. We not only help those in need and people who are homeless and unemployed with the basics of finding a job – like crafting a résumé and making a good impression in interviews – we provide job placement and employment assistance. Essentially, we are the professional connections that help job seekers find work opportunities for living wages. Our help goes beyond employment. Salvation Army caseworkers assist with obtaining sound financial planning and reliable insurance coverage, as well as helping to ensure affordable and safe care for children while parents are working."
year_published = 2025
clearnet = "https://salvationarmyusa.org/usn/assist-the-unemployed"
