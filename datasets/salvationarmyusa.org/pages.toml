["https://www.salvationarmyusa.org/usn/prison-ministry-and-correctional-services"]
title = "Prison Ministry and Correctional Services | The Salvation Army USA"
description = "Delivering Hope and Help to Prevent Recidivism"
full_description = '''"Continue to remember those in prison as if you were together with them in prison, and those who are mistreated as if you yourselves were suffering" Hebrews 13:3 On Dec. 16, 2010, Lieutenant Johnathan Herzog sat in his cold jail cell in Tacoma, Washington, with little hope. He had been sentenced to six years in prison for shooting out his neighbor's window and nearly killing another human being. He was despondent, empty, and tired of life. Far from unique, Johnathan was facing what more than a million adults across the United States experience every day. In fact, there were 1,204,300 people incarcerated at the end of 2021, according to the U.S. Department of Justice's Bureau of Justice Statistics. More alarming is that incarceration may not be a one-time event as evidenced by the recidivism rates among people in state prison. Recidivism refers to the act of a person who is rearrested for a similar offense after having served their initial penalty. According to a July 2021 Bureau of Justice Statistics report on recidivism: Adapting to the daily grind of prison was harrowing for Johnathan, who felt discouraged and fearful in a population where many had done time before only to become reincarcerated and are now serving longer sentences. It was a hard place for him to find the inspiration and motivation to attempt to get his life back on track. He once even landed in solitary confinement for fighting. Depending on the correctional facility, The Salvation Army offers a variety of resources to people encountering the criminal justice system. Bible Correspondence Courses, like the one Johnathan begin participating in, is one of those resources, which provides students with knowledge of the Bible and insight into their life's purpose and meaning. Parenting classes, decision-making courses, music theory, Celebrate Recovery meetings, and the annual Salvation Army Toy Lift during the holidays are available at a number of corrections facilities across the country. One especially transformative program is our Creative Arts in Prison initiative. Watch this powerful video to see how life-changing this program can be for real people serving time.'''
year_published = 2025
