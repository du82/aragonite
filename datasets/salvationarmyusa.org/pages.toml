["https://salvationarmyusa.org/usn/privacy-policy"]
title = "Privacy Policy | The Salvation Army USA"
description = "It is The Salvation Army's policy to respect and protect the privacy of our visitors."
full_description = "It is The Salvation Army’s policy to respect and protect the privacy of visitors to our websites. This Privacy Statement (“Privacy Statement”) explains how The Salvation Army National Corporation (“The Salvation Army” or “we”) collects, uses, shares, stores, and protects the personal information that we collect from you when you visit our websites (collectively, the “Website”), as well as your rights and choices regarding the personal information that we collect. This Website is operated by or on behalf of The Salvation Army National Headquarters in the United States, and the Website has both U.S. and international visitors. Information that we collect on our Website, including personal information, may be transferred to our National Headquarters in Alexandria, Virginia and to our other U.S. Salvation Army affiliates to permit us to comply with our legal and contractual obligations, to provide information and services, and to perform mission-related activities. In addition, we may work with third-party business partners and service providers in the U.S. and in other countries to support our mission-related activities. Thus, personal information may be transferred to, stored on servers in, and accessed from the United States and countries other than the country in which we initially collected the information. In all such instances, we use, transfer, and disclose personal information solely for the purposes described in this Privacy Statement. Please click on the headings and subheadings marked with a “+” below for more information, or expand all sections This Privacy Statement does not apply to information provided directly to and websites operated by any other Salvation Army entities, including U.S. affiliates. Information Collection Not Covered by this Privacy Statement + This Privacy Statement does not apply to information provided directly to and websites operated by any other Salvation Army entities, including U.S. affiliates. If you have any questions or concerns about this Privacy Statement or about The Salvation Army’s privacy and data security practices, please contact us at webmaster@usn.salvationarmy.org."
