["https://sam.hooke.me/trip/2023/04/ruby-beach"]
title = "Ruby Beach"
description = "The home page of Sam Hooke."
full_description = "Ruby Beach5 April 2023Arrived at 2pm for a brief visit. High tide had been 8.3ft at 1:05pm, so the tide was still very high. No tide pools accessible but still lots of fun to be had.The little stream to the north that flows from the pond into the sea was too wide to jump across, and too deep to walk through in boots. However, with the help of some strangers we built a very primitive bridge out of the driftwood. Though it still required a good sense of balance.The parking lot seems to have been updated since my last visit in 2021, with speed humps, clearly painted spaces and a one way system. There were plenty of spaces but I expect that will change as the weather improves.There are two pit toilets at the trailhead. Both of them seemed to have faulty doors that would not lock.Taggedhikeslippy map"
