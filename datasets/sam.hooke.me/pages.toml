["https://sam.hooke.me/recipe/french-toast"]
title = "French Toast"
description = "The home page of Sam Hooke."
full_description = "French Toast23 November 2024Ingredients §For two people (four pieces, two per person):For the liquid:2 large eggs.120g of milk.15g of plain flour.25g of granulated sugar.A pinch of salt.1 tsp ground cinnamon.1 tsp vanilla extract.For frying:Butter.4 slices of bread (thick but not too thick, preferably a day or two old).Method §Mix all ingredients for the liquid.Heat up a frying pan with some butter.Pour the liquid into a dish, then lay two pieces of bread in the dish to soak up the liquid, then turn so the other side soaks them up.Place the two slices on the fying pan and cook for a few minutes on each side until golden.Repeat for the other slides of bread."
