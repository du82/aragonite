["https://sam.hooke.me/trip/2024/06/tour-of-mrao-part-2"]
title = "Tour of MRAO (Part 2): HERA, MERLIN, AMI Small Array, COAST and SKA"
description = "The home page of Sam Hooke."
full_description = "Tour of MRAO (Part 2): HERA, MERLIN, AMI Small Array, COAST and SKA28 June 2024All trips at this location:(Jun 2024) Tour of MRAO (Part 1): Lord's Bridge station and AMI Large Array(Jun 2024) Tour of MRAO (Part 2): HERA, MERLIN, AMI Small Array, COAST and SKA(Jun 2024) Tour of MRAO (Part 3): 4C Array, Flora & Fauna, and One-Mile Telescope(Jun 2024) Tour of MRAO (Part 4): One-Mile Telescope Control RoomMap §SITE 1.ADMINISTRATIONCambridge RoadWimpoleRoadHaslingfieldRoadBarton RoadLord's BridgeStationAMI Small ArrayCOASTAMI Large Array†Pulsar Array4C Array†Half-Mile Telescope (small) & †One-Mile Telescope (large)†One-MileTelescopeTrack continues 1km eastwardse-MERLIN†CLFST†CATUnknown?Unknown?†SKA†HERAUnknown?†SKAPrototypearrayPrototypeindividualPrototypeRyle ControlRoomOne-MileControlRoom(Previously site of †Ryle Telescope)(Track is shared)Name†NameLong BrookBourn Brook𝕳𝖊𝖞 𝕳𝖎𝖑𝖑𝕽𝖔𝖒𝖆𝖓𝕭𝖆𝖗𝖗𝖔𝖜NSITE 6.SEWAGE DISPOSALSITE 2.BOMB STORESSITE 4.F.F.D.4.050403_AMI01_arrival02_station1 Mile1 Kilometerhttps://sam.hooke.me/mraoJune 2024Mullard Radio AstronomyObservatory (MRAO)KeyFormer railwayTelescope railwayMain roadMRAO tarmac roadMRAO trackTelescope (static)Telescope (on track)Telescope (approx. area)Telescope (active)Telescope (inactive)MRAO (approx. area)Leaving the AMI Large Array (at the furthest east of MRAO), we drove west back along the road that follows the old east-west railway line, under the bridge, and then turned left at the fork. This gentle curve follows the line of the former railway sidings, for when this site used to be a munitions storage facility.We carried on southwest, taking a slight right at the point of a teardrop shaped road, then pulled in just after the next road loop, where HERA is visible about 60m away to the northwest.HERA §HERA (Hydrogen Epoch of Re-ionization Array) is not mentioned on the MRAO Wikipedia page. Perhaps this is because it is technically a HERA prototype. Here is an article by Cavendish Astrophysics (who operate the MRAO) about the “3-dish HERA prototype” at MRAO, which can clearly be seen in the photos below:The three dishes of the HERA prototype.A close up of one of the receivers. The holes are cut strategically to reduce the weight, while also enabling it to have the correct characteristics for being an RF receiver. It is a type of vivaldi antenna.There is much more information about HERA and the receiver in this paper, titled Design of the New Wideband Vivaldi Feed for the HERA Radio-Telescope Phase II.The actual HERA radio telescope is in South Africa.The building in the distance, behind HERA.Cambridge MERLIN §From the same spot, but turning east, is a great view of the Cambridge MERLIN radio telescope with its 32m dish. It forms part of the e-MERLIN array, which consists of seven radio telescopes across England.The e-MERLIN array consists of:Cambridge MERLIN telescopeDefford telescopeDarnhall telescopeKnockin telescopePickmere telescopeLovell TelescopeMark IIWikipedia omits the Darnhall telescope from its list of MERLIN telescopes for some unknown reason?See this Wikipedia page for many more radio telescopes.The Cambridge MERLIN telescope, with its 32m diameter dish, is the second biggest dish in England. First place goes to the Lovell Telescope, which is also part of e-MERLIN, with its whopping 76.2m diameter!The e-MERLIN dish at MRAO is 32m in diameter, the second biggest dish in England.Map §SITE 1.ADMINISTRATIONCambridge RoadWimpoleRoadHaslingfieldRoadBarton RoadLord's BridgeStationAMI Small ArrayCOASTAMI Large Array†Pulsar Array4C Array†Half-Mile Telescope (small) & †One-Mile Telescope (large)†One-MileTelescopeTrack continues 1km eastwardse-MERLIN†CLFST†CATUnknown?Unknown?†SKA†HERAUnknown?†SKAPrototypearrayPrototypeindividualPrototypeRyle ControlRoomOne-MileControlRoom(Previously site of †Ryle Telescope)(Track is shared)Name†NameLong BrookBourn Brook𝕳𝖊𝖞 𝕳𝖎𝖑𝖑𝕽𝖔𝖒𝖆𝖓𝕭𝖆𝖗𝖗𝖔𝖜NSITE 6.SEWAGE DISPOSALSITE 2.BOMB STORESSITE 4.F.F.D.4.050403_AMI01_arrival02_station1 Mile1 Kilometerhttps://sam.hooke.me/mraoJune 2024Mullard Radio AstronomyObservatory (MRAO)KeyFormer railwayTelescope railwayMain roadMRAO tarmac roadMRAO trackTelescope (static)Telescope (on track)Telescope (approx. area)Telescope (active)Telescope (inactive)MRAO (approx. area)Moving on, from HERA we turned left heading southeast down the main road, then turned left after Long Brook to park outside the front of the AMI Small Array.According to the old map, this used to be the location of the BOMB STORES!Plaques §The AMI Small Array is completely enclosed within some angled walls. The only way to get in is through the adjacent building, which has a couple of interesting plaques out front:CAMBRIDGE UNIVERSITY MULLARD RADIO ASTRONOMY OBSERVATORYGROTE REBER (1911 - 2002) ELECTRICAL ENGINEER AND PIONEER ASTRONOMERInside §Inside, there is a server room that contains a couple of RF signal racks:AMI Small Array RF/IF Signal Rack.Back through the main hallway, a lab space leads to an angled door, that leans inwards at about 45 degrees. As will become clearer in the next picture, that’s because this door emerges from the sloping wall that encircles the AMI Small Array.The door that leads back outside, to the enclosed area with the AMI Small Array.AMI Small Array §As the name implies, the AMI Small Array is indeed smaller than the AMI Large Array!Each receiver is approximately 4m high from ground level, and the dishes are 3.7m wide.There are 10 receivers in total, arranged in the following formation: x x x x x x x x x xSeven of the receivers (the other three are behind the camera).A closer look at a dish.A view from behind.COAST §Just southeast of the AMI Small Array is COAST (Cambridge Optical Aperture Synthesis Telescope). Much of COAST is inside a bunker, but some of the equipment is also contained in this white boxes on the grass outside.The COAST bunker and nearby equipment.SKA §Directly in front of COAST is an individual prototype SKA antenna. Specifically, I believe this is a SKALA-2 antenna for SKA-Low. See the paper titled Evolution of SKALA (SKALA-2), the log-periodic array antenna for the SKA-low instrument.SKALA-2 has the appearance of a Christmas tree.While researching SKA, I found this post from Cavendish Astrophysics, which links to this YouTube video, which provides aerial drone footage of SKA!The array of SKALA-2 antennas is behind the hedge to the right. I did not get to take a look, but the above video shows the view from there.Another view of SKALA-2 with COAST equipment in the background.The tour guide told us that this SKA antenna was called “the final design”, but afterwards there were two more!Next part §To carry on with the tour, see here for part 3.TaggedobservatoryAll trips at this location:(Jun 2024) Tour of MRAO (Part 1): Lord's Bridge station and AMI Large Array(Jun 2024) Tour of MRAO (Part 2): HERA, MERLIN, AMI Small Array, COAST and SKA(Jun 2024) Tour of MRAO (Part 3): 4C Array, Flora & Fauna, and One-Mile Telescope(Jun 2024) Tour of MRAO (Part 4): One-Mile Telescope Control Room"
