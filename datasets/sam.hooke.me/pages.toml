title = "Gold Creek Pond Snowshoe"
description = "The home page of Sam Hooke."
full_description = "Gold Creek Pond Snowshoe11 April 2023All trips at this location:(Mar 2020) Gold Creek Pond Snowshoe(Dec 2020) Gold Creek Pond Snowshoe(Jan 2022) Gold Creek Pond Snowsnoe(Jun 2022) Gold Creek Pond(Apr 2023) Gold Creek Pond SnowshoeTrail is still snow covered, but both fairly compact and yet rather slushy. I used snowshoes, but others in our group were fine with Yaktrax, so long as they stayed on the well-trodden trail.The lake (pond) still appears to be frozen, apart from the north end where the creek flows in, though the surface is somewhat slushy and seems to give way easily.We arrived at 2:30pm on Tuesday and were able to park on the road right outside the winter trailhead. There were only three other cars, and the road was completely free of snow. We left about 4pm and were the last car present.The scenery, as always, was spectacular! In our brief visit we had both clear blue skies and thick heavy snow. The trail was quickly obscured by the heavy snow, but was not a problem because we knew the route well.Taggedsnowshoeslippy map"
