["https://sam.hooke.me/trip/2023/12/horsey-gap-and-horsey-windpump"]
title = "Horsey Gap and Horsey Windpump"
description = "The home page of Sam Hooke."
full_description = "Horsey Gap and Horsey Windpump16 December 2023Seals at Horsey Gap §We arrived at Horsey Gap at 12:45pm on a Saturday. There is a dedicated, paid car park, which is the only option for those who have come by car. The fee is reasonable, and although the car park is not very big, cars generally seem to leave frequently enough that you soon get a space.Following are some of my favourite photos I took of the seals and their pups. While most of the seal pups are down on the beach, a handful were up in the dunes. Some helpful volunteers make sure that everyone keeps a safe distance away so as not to disturb the pups. Additionally, guide ropes help ensure that people stick to the paths, which helps preserve the terrain.Horsey Windpump §Instead of parking at the Horsey Gap car park, you can park at Horsey Windpump and walk 3 miles to Horsey Gap (making for a 6 mile round trip). Since Horsey Windpump is owned by the National Trust, the parking is also paid, but free if you are a member.We arrived at 11:15am and attempt to walk from Horsey Windpump, but it was incredibly muddy and we had to turn back.The first field from Horsey Windpump had row after row of muddy patches. The whole field was boggy, so while it looked possible to try and navigate around the mud, you just ended up in grassy water.We persisted through the first field, but then there is a bottleneck to the next field, since there is a dyke between the fields and only one path.The route we were attempting is marked by the green ovals on the map below (found at the Horsey Windpump car park). The trail heads west through several fields, then briefly onto a road, before heading through more fields out to the beach.Taggedhikeslippy mapseal"
author = "Sam Hooke"
year_published = 2023
