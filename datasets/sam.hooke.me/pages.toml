["https://sam.hooke.me/teaandstuff/2012/11/all-about-tea"]
title = "All About Tea"
description = "The home page of Sam Hooke."
full_description = "All About Tea14 November 2012We went to All About Tea, and invested in a tea pot for loose leaf tea. This gave us a much wider selection of possible teas we could buy, since the constraint of bagged tea was vanquished.The three teas we purchased were as follows (all loose tea):Wendy Tea ** “A magical faery blend of garden flowers and herbs. Uplift your mind and soothe your senses with restful Lavender, rich Rooibos, sensuous Rose Petals, and bright Marigolds.”Moroccan Mint ** “Moroccan Mint is Chine green tea with Peppermint, for a fresh and thirst-quenching flavour. Moroccan Mint calls to mind the bazaars of Rabat, the capital city, where no business can be transacted without the preparation of several glasses of mint tea.”Strawberry & Kiwi ** “A bright red berry explosion full of joy and energy, our Strawberry and Kiwi fruit infusion smells so good you could eat it”This week, we drank and discussed the Wendy Tea. The tea was brewed in a teapot for 3 to 4 minutes, and served as suggested without milk. It was found to be soothing and relaxing, the sort of tea that would be much appreciated at the end of a busy day, or just after a calm day. We tried it also with optional sugar, and it was found to be a great improvement. Just one or two tea spoons of sugar helped amplify the flavour, and fill in certain gap in the flavour.Our rating are as follows:Smell, Taste, Texture, RetrospectivePhil: 6, 7, 8, 8Dave: 7, 8, 8, 9Sam: 7, 8, 9, 9Overall, everyone thoroughly enjoyed the tea and would be very pleased to have it again!Taggedteaall about teawendy teamoroccan mint teastrawberry and kiwi tea"
author = "Sam Hooke"
year_published = 2012
clearnet = "https://sam.hooke.me/teaandstuff/2012/11/all-about-tea"
