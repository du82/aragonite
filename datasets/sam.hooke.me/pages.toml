["https://sam.hooke.me/post/2025/01/map-of-mrao-and-telescopes"]
title = "Map of the Mullard Radio Astronomy Observatory (MRAO)"
description = "The home page of Sam Hooke."
full_description = "Map of the Mullard Radio Astronomy Observatory (MRAO)18 January 2025SITE 1.ADMINISTRATIONCambridge RoadWimpoleRoadHaslingfieldRoadBarton RoadLord's BridgeStationAMI Small ArrayCOASTAMI Large Array†Pulsar Array4C Array†Half-Mile Telescope (small) & †One-Mile Telescope (large)†One-MileTelescopeTrack continues 1km eastwardse-MERLIN†CLFST†CATUnknown?Unknown?†SKA†HERAUnknown?†SKAPrototypearrayPrototypeindividualPrototypeRyle ControlRoomOne-MileControlRoom(Previously site of †Ryle Telescope)(Track is shared)Name†NameLong BrookBourn Brook𝕳𝖊𝖞 𝕳𝖎𝖑𝖑𝕽𝖔𝖒𝖆𝖓𝕭𝖆𝖗𝖗𝖔𝖜NSITE 6.SEWAGE DISPOSALSITE 2.BOMB STORESSITE 4.F.F.D.4.050403_AMI01_arrival02_station1 Mile1 Kilometerhttps://sam.hooke.me/mraoJune 2024Mullard Radio AstronomyObservatory (MRAO)KeyFormer railwayTelescope railwayMain roadMRAO tarmac roadMRAO trackTelescope (static)Telescope (on track)Telescope (approx. area)Telescope (active)Telescope (inactive)MRAO (approx. area)After visiting the Mullard Radio Astronomy Observatory (MRAO) in June 2024, I was surprised to find that there is no comprehensive map available online which displays the locations of all the telescopes. So, using photos and notes from my visit, combined with research online, I created the above map. The MRAO was formerly site of the Lord’s Bridge railway station, and during WWI the sidings served as a mustard gas factory. During my visit I found a map1 of these old facilities, so I have overlaid some of them (such as the location of the railway line), as they help explain the seemingly unusual layout.2You can download a copy of the map below:Download (SVG)Download (PNG)Telescopes §Following is a full list of all the telescopes found at MRAO. As best as I can tell, at time of writing (January 2025) the Wikipedia page is not quite complete: it misses out the HERA prototype and SKA prototypes. There is also some other radio equipment I am uncertain about (labelled “Unknown?” on the map).HERA (Hydrogen Epoch of Re-ionization Array) prototype §The three prototype HERA receivers.There are three prototype HERA receivers at MRAO, tessalated together in a triangle just west of the e-MERLIN receiver. Each dish is placed horizontally on the ground, with a receiver suspended above in the middle.Links §HERA official websiteWikipediaCavendish Astrophysics post about HERA at MRAO (another).Papers §Design of the New Wideband Vivaldi Feed for the HERA Radio-Telescope Phase IIMeasurements of HERA Vivaldi Feed and Feed+Dish Performance Draft - 25 May 2020SKA (Square Kilometer Array) prototype §An individual SKA prototype.Each prototype SKA antenna at MRO is about the side of a Christmas tree, and similar in appearance. They are near the AMI Small Array. In one plot there is an individual SKA antenna, and behind a nearby hedge is a small array of SKA antennas.Links §SKA official websiteWikipediaCAT (Cosmic Anistrophy Telescope) §Since CAT was decommissioned in 20003 there is not much left to see.Links §CAT official website (Internet Archive link because website has been down since April 2019)WikipediaNOTE: The “Coordinates” field on Wikipedia has incorrectly marked the location of the CAT at MRAO! However, if you go to the category page, the map on the right has a hexagon with the CAT in the right place (but the marker is in the wrong place).NOTE: The External link to “The CAT enclosure” is also wrong.Cambridge MERLIN (enhanced Multi Element Remotely Linked Interferometer Network) §Cambridge MERLIN.With a 32m diameter, this is the biggest dish at MRAO. The Cambridge MERLIN radio telescope is part of the e-MERLIN network, which consists of seven radio telescopes situated around England.Links §e-Merlin official websiteWikipediaRyle Telescope §The old Lord’s Bridge railway line ran almost exactly along an east-west parallel. For reasons I can’t pretend to explain, this alignment was ideal for the Ryle Telescope. It consisted of eight elements (dishes) arranged along the east-west parallel: four mounted on the 1.2km railway track, and four fixed at 1.2km intervals.In 2006, the Ryle Telescope was repurposed for the AMI Large Array. So the Ryle Telescope itself no longer exists, however the same elements (dishes) are still present, but in a different configuration.Links §WikipediaAMI (Arcminute Microkelvin Imager) §AMI Large Array.AMI Small Array.The AMI consists of a pair of radio telescopes: the Small Array and Large Array. The Large Array consists of eight 12.8m diameter parabolic antennas (previously part of the Ryle Telescope).Links §WikipediaCOAST (Cambridge Optical Aperture Synthesis Telescope) §COAST.Most of the COAST equipment is inside a bunker, so there is not much to see from outside.Links §WikipediaCLFST (Cambridge Low Frequency Synthesis Telescope) §Like the Ryle Telescope, the CLFST makes use of the east-west parallel from the old Lord’s Bridge railway line. It consisted of 60 yagi antennas. It ceased operating in 20004, but a group of antennas has been preserved which can still be seen today near the old Lord’s Bridge station house.Links §WikipediaOne-Mile Telescope §The movable receiver of the One-Mile Telescope. The two fixed receivers are behind, out of view: one is directly behind, the other is half a mile away.The One-Mile Telescope consists of two fixed receivers and one on a track.Links §WikipediaHalf-Mile Telescope §The two movable receivers of the Half-Mile Telescope. The two fixed receivers are further away at the other end of the track.The Half-Mile Telescope consists of two fixed receivers and two on a track. It shares the same track as the One-Mile Telescope.Links §Wikipedia4C Array §4C Array.The 4C Array is a 450m long row of 20m wide antennas.5 It runs parallel to the track used by the One-Mile and Half-Mile Telescopes.Links §WikipediaInterplanetary Scintillation Array §The Interplanetary Scintillation Array, or Pulsar Array, consists of an array of 4096 dipole antennas spread across nine acres.There are good pictures of it on this website.Links §WikipediaThe old map of the munitions storage facility used to be classified information, but at some point since WWI was declassified. ↩︎For fun, I also included the nearby Hey Hill Roman Barrow. ↩︎According to this archive of the official CAT website from 26th April 2019, which says “The telescope was turned off and partly dismantled in 2000.” ↩︎According to this archive of the official CLFST website from 26th April 2019, which says “The 151-MHz telescope far exceeded its original projected lifetime and eventually ceased operating in 2000, but a group of aerials similar to those pictured here has been preserved at Lord’s Bridge.” ↩︎According to Wikipedia, there used to be “a second, moveable element (now mostly removed; some of it is still visible, beyond COAST)”. However, I am unsure where exactly this is. ↩︎Taggedobservatory"
author = "Sam Hooke"
year_published = 2025
