full_description = "BookshelfHere’s some of what I’ve been reading over the years:★ ★ ★ ★Orbital, by Samantha Harvey★ ★ ★ ★Oh, Ranger!: True Stories from our National Parks, by Mark J. Saferstein (editor) and 50 or so individual authors★ ★ ★ ★On the Trail of Wolves: A British Adventure in the Wild West, by Philippa Forrester★ ★ ★ ★More Days at the Morisaki Bookshop, by Satoshi Yagisawa★ ★ ★ ★ ★Dune, by Frank Herbert★ ★ ★ ★ ★How Iceland Changed the World, by Egill Bjarnason★ ★ ★ ★ ★Norwegian Wood: Chopping, Stacking and Drying Wood the Scandinavian Way, by Lars Mytting★ ★ ★ ★Winter Holiday, by Arthur Ransome★ ★ ★ ★ ★Exhalation, by Ted Chiang★ ★ ★ ★ ★A Short History of the World According to Sheep, by Sally Coulthard★ ★ ★ ★ ★The 99% Invisible City: A Field Guide to the Hidden World of Everyday Design, by Kurt Kohlstedt and Roman Mars★ ★ ★The Story of the Southwold — Walberswick Ferry, by Dani Church★ ★ ★Swallowdale, by Arthur Ransome★ ★ ★ ★ ★Wandering Souls, by Cecile Pin★ ★ ★ ★ ★The Second Jungle Book, by Rudyard Kipling★ ★ ★To the Island of Tides, by Alistair Moffat★ ★ ★ ★The Jungle Book, by Rudyard Kipling★ ★ ★ ★ ★Swallows and Amazons, by Arthur Ransome★ ★ ★ ★ ★Days at the Morisaki Bookshop, by Satoshi Yagisawa★ ★ ★ ★ ★Mr Rosenblum's List, by Natasha Solomons★ ★ ★The Village News, by Tom Fort★ ★ ★ ★The Fens, by Francis Pryor★ ★The Old Ways: A Journey on Foot, by Robert MacFarlane★ ★ ★ ★ ★A World on the Wing, by Scott Wiedensaul★ ★ ★ ★ ★The Tree Climber's Guide, by Jack Cooke★ ★ ★ ★ ★Treasure Island, by Robert Louis Stevenson★ ★ ★ ★ ★A Short History of Nearly Everything, by Bill Bryson★ ★ ★ ★ ★The Power of Geography, by Tim Marhsall★ ★ ★ ★ ★The Story of the British Isles in 100 Places, by Neil Oliver★ ★ ★ ★ ★The White Cascade: The Great Northern Railway Disaster and America's Deadliest Avalanche, by Gary Krist★ ★ ★ ★Mazama - The Past 125 Years, by Doug Devin★ ★ ★ ★ ★The Boy, The Mole, The Fox and The Horse, by Charlie Mackesy★ ★ ★ ★ ★The Father Christmas Letters, by J. R. R. Tolkien★ ★ ★ ★ ★The Machine Stops, by E. M. Forster★ ★ ★ ★ ★The Time Machine, by H. G. Wells★ ★ ★ ★ ★The Lord of the Rings: The Return of the King, by J. R. R. Tolkien★ ★ ★ ★ ★The Lord of the Rings: The Two Towers, by J. R. R. Tolkien★ ★ ★ ★ ★The Lord of the Rings: The Fellowship of the Ring, by J. R. R. Tolkien★ ★ ★ ★ ★Longitude, by Dava Sobel★ ★ ★ ★Never Split the Difference, by Chris Voss★ ★ ★ ★ ★When Breath Becomes Air, by Paul Kalanithi★ ★ ★ ★ ★The Man Who Mistook his Wife for a Hat, by Oliver Sacks★ ★ ★ ★Only Human, by Sylvain Neuvel★ ★ ★ ★Waking Gods, by Sylvain Neuvel★ ★ ★ ★ ★Sleeping Giants, by Sylvain Neuvel★ ★ ★ ★ ★Seveneves, by Neal Stephenson★ ★ ★ ★ ★The Buried Giant, by Mazuo Ishiguro★ ★Great Expectations, by Charles Dickens★ ★ ★ ★ ★The Phantom Tollbooth, by Norton Juster★ ★ ★ ★ ★Go Set a Watchman, by Harper Lee★ ★ ★ ★ ★To Kill a Mockingbird, by Harper Lee★ ★ ★ ★ ★The Essex Serpent, by Sarah Perry★ ★ ★ ★ ★All Quiet on the Western Front, by Erich Maria Remarque★ ★ ★ ★ ★The Martian, by Andy Weir★ ★ ★ ★ ★The Hobbit, by J. R. R. Tolkien★ ★ ★ ★ ★Mere Christianity, by C. S. Lewis★ ★ ★ ★ ★The Screwtape Letters, by C. S. Lewis★ ★ ★The Art of War, by Sun Tsu★ ★ ★ ★Mud, Sweat and Tears, by Bear Grylls★ ★ ★ ★Galapagos, by Kurt Vonnegut★ ★ ★ ★Lord of the Flies, by William Golding★ ★ ★ ★Mother Night, by Kurt Vonnegut★ ★Something Happened, by Joseph Heller★ ★ ★ ★ ★Getting Started with Dwarf Fortress, by Peter Tyson★ ★ ★ ★World War Z, by Max Brooks★ ★ ★ ★ ★Fahrenheit 451, by Ray Bradbury★ ★ ★ ★Incognito, by David Eagleman★ ★ ★ ★ ★Breakfast of Champions, by Kurt Vonnegut★ ★ ★ ★ ★A Brief History of Time, by Stephen Hawking★ ★ ★ ★Dirk Gentley's Holistic Detective Agency, by Douglas Adams★ ★ ★ ★ ★Hocus Pocus, by Kurt Vonnegut★ ★ ★ ★ ★A Clockwork Orange, by Anthony Burgess★ ★ ★ ★ ★The Odyssey, by Homer★ ★ ★ ★ ★The Toaster Project, by Thomas Thwaites★ ★ ★The Great Gatsby, by F. Scott Fitzgerald★ ★ ★ ★ ★Slaughterhouse 5, by Kurt Vonnegut★ ★ ★ ★ ★Animal Farm, by George Orwell★ ★ ★ ★ ★Of Mice & Men, by John Steinbeck★ ★ ★ ★ ★The Catcher in the Rye, by J. D. Salinger★ ★ ★ ★ ★Brave New World, by Aldous Huxley★ ★ ★ ★ ★Nineteen Eighty-Four, by George Orwell★ ★ ★ ★ ★Cat's Cradle, by Kurt Vonnegut★ ★ ★ ★ ★Catch-22, by Joseph HellerThoughtsFollowing are some quick thoughts on each book written shortly after finishing. I avoid writing any spoilers, as far as what I consider a spoiler to be. As a rule of thumb, if it appears in the blurb, I probably don’t think it’s a spoiler. That being said, sometimes blurbs do contain more than I’d like to know, so I’m probably even more restrained!OrbitalTODOOh, Ranger!TODOOn the Trail of WolvesPicked up on a whim from a charity shop in Ely. Turned out to be a surprisingly good book. It’s an acccount of a British family who moved to Wyoming, and starts out with the mother having some exciting encounters with wolves. She is keen to learn as much as she can about them, and discovers that they are quite a divisive topic, so she sets about trying to understand why. The latter two-thirds of the book recount conversations she has had with various people in and around Yellowstone, and she makes a point to find people with differing opinions, rather than just writing in an echo chamber of wolf appreciation. It is insightful to read all the accounts, and hear the different perspectives, and as she says, everyone there has a story to tell about wolves. Personally I found the second half of the book a bit less engaging than the first half: it seemed to descend more into an interview style format. Regardless it was worth the read, though it did bother me that the editor consistently insisted on using the word potholing to describe legs sinking in snow, when I’m sure they meant postholing!More Days at the Morisaki BookshopThe sequel to Days at the Morisaki Bookshop, I spotted this at Foyles in Waterloo station when I had a few minutes to kill while waiting for a train. I picked it up, but was already reading Exhalation, so did not get around to reading it until the flight to Iceland. The book is quite short, and so I read 80% of it on the flights, then finished it off a bit later at home. In my view, it had a more somber tone than the first book. While it was pleasant being able to return to the cosy world of the Morisaki Bookshop, it was also a different experience, and we see the characters change and grow further. You’ll almost certainly enjoy it if you read the first book, but don’t expect a comfy ride.DuneA couple of years back I began reading the Dune graphic novels and was hooked. Dune itself had been split into four graphic novels, but unfortunately only the first three had been published at the time, so I never knew who the story ended. So I began reading the novel around the start of this year, at that point having also seen the movie Dune: part 1, so still not knowing how it ended! Initially I found the book very engaging, but about half way through my interest flagged, while Paul Atreides was wandering through the desert. After seeing Dune: part 2, and finally seeing an ending to the story, my interest was renewed and I continued reading. Without giving anything away, I was glad to carry on reading, since the story did seem to pick up again, and it differed somewhat from the film. It’s left me curious to read the next book, but I’ll circle back to it after reading some other things first.How Iceland Changed the WorldI first saw this book while browsing the travel section of Waterstones on the hunt for a good guide to Iceland, since we were considering going there for holiday. Initially I just bought the Lonely Planet: Iceland guide and left this book behind. A week or so later, after reading the guide and deciding that would be our holiday destination, I nipped back into town, bought this book, and began reading it in preparation for the holiday. Each chapter covers a different aspect of Iceland’s history, from its discovery, the first settlers and sagas (some of whom even made it to Vinland, or as we know it, Newfoundland). The book is well-written and engaging, though personally I found the latter chapters less interesting, which leave behind history and enter the world of politics. It gave me a deeper appreciation for Iceland, and I would recommend the book for anyone planning to visit.Norwegian WoodA surprisingly engaging read that delivers exactly what it promises: information on the many ways of chopping, stacking and drying wood across Scandinavia, presented in a factual yet fascinating style. Just like the many photographs of stacked wood, the book itself is organised well, with sub-headings for each type of stacking technique, category of wood burner, or species of tree. You’ll find yourself longing for a cold Winter’s evening to carefully arrange some dry logs in the fire place, light the kindling and hear the fire crackle.Winter HolidayMuch more engaging than Swallowdale. The story is set in winter when the lake starts freezing over, which provides the backdrop for a very different set of events to the stories so far. Instead of sailing, the children are ice skating, sledging and constructing a vessel to glide over the frozen lake. There is another breath of fresh air as we meet Dick and Dorothea for the first time, who are “city folk” that befriend John and the other children, and desire to have outdoorsy adventures like them. Predictably, this ends up happening, but in a very charming manner. A common pattern in the story is how the children frequently communicate with each other via morse code, flags, and (although the word itself is never used) steganography. These non-standard methods of communication end up being more than just a bit of fun, as they are responsible for some pivotal moments in the story.ExhalationFantastic. I found this collection of short stories hard to put down. They consider fairly typical sci-fi topics such as time-travel, advanced technology, parallel and alternative universes, but explore them in deep and meaningful ways, often with fascinating worlds and characters. If that intrigues you, a good starting point is to go here and read What’s expected of us, which will only take a few minutes. I don’t want to say too much to risk spoiling the enjoyment. My favourite stories were The Merchant and the Alchemist’s Gate, Exhalation, and Anxiety is the Dizziness of Freedom; this last one in particular because it tackled an idea I tried to write about for NaNoWriMo years ago, but did such a better job than I could. I also particularly liked The Truth of Fact, the Truth of Feeling and Omphalos.A Short History of the World According to SheepThe impact sheep have had on society is far bigger than I had realised. This book covers many such aspects, from finance (such as how hundreds of finely crafted churches in Norfolk were funded by the wool trade), language (how so many words relate to sheep, such as shoddy and tenterhooks, or place names that begin with Ship, Shap, Shep or Skip), culture (such as how the Vikings and Inuit people shared techniques for spinning yarn), genetics (how humans selectively bred sheep that require shearing to make it easier to collect wool, but now we’re coming full circle to breeding sheep which naturally shed their coats since wool is no longer in such demand), and much more. It contains many interesting facts; such as how the sheep shearing machine was invented in the late 1800s by Frederick York Wolseley, an “Irish-born wool grower living in Australia”, and his foreman, Herbert Austin, who dabbled with motor cars in the sheep shearing off-season and went on to found the Austin Motor Company; and the oldest known tattoos in history, which went unnoticed for a century, are on a 5,000 year old Egyptian mummy in the British Museum, and are of a wild bull and a ram. The book is an easy read and flows well, and the author does a good job of keeping you engaged. You don’t need to be particularly fond of sheep to enjoy the book, but by the end of it you’ll have a fresh appreciation of them.The 99% Invisible CityAround 2020 I fairly regularly listened to the 99% Invisible podcast, which talks about various interesting things that all mostly go unnoticed, and so I pre-ordered their book when it was announced. It’s the sort of book you just dive into at random, since each chapter is just a page or three, and is largely independant to the rest of the book. So at first I just cherry picked the chapters that sounded interesting and left it at that. Now in 2024 I read the book from cover to cover, and it is a very well curated book of interesting little stories. As implied by the title, each chapter focuses on a particularly interesting but hidden aspect of one or more cities, covering topics such as the decorated man-hole covers found in cities such as Seattle, to the fake building facades used to hide ventilation facilities in London and beyond. My one critique of this book is that, while some examples are from cities around the world, it generally has a very US-centric focus, with especially many examples being taken from San Francisco. Admittedly the podcast authors are based in that region, so it’s understandable that would be their bias, but I’m sure there’s a wealth of equally interesting stories from other cities around the world.The Story of the Southwold — Walberswick FerryA short but interesting book covering the history of this relatively obscure ferry crossing, which has been operating on-and-off for several hundred years or more. The names of the original ferrymen are lost to time, but there is a surprising wealth of stories from the past few generations. The more recent accounts draw upon personal experience, with numerous accounts from individuals who operated or used the ferries, some in their own words. Some highlights were: learning that the river has changed course significantly over the years as the sea has shifted the shingle; that for a while it used to be a chain pontoon ferry rather than a row boat; that the pontoon ran into monetary troubles in large part because during the war soldiers used it without paying, and this issue was raised in parliament; and that depending upon who you ask, the ferry may have taken two or three circus elephants across! The book could do with some better editing, since the flow can be clunky at times and there are many grammar mistakes, but in a way this adds to the charm of a self published book about fairly niche local affairs. A good read for anyone who’s been to the area. The book is replete with pictures, in particular the chapter “Ferry Dogs” which, apart from an introductory sentence, is literally page after page of dog photos.SwallowdaleIt feels like a collection of slow paced short stories, rather than a complete novel like Swallows and Amazons. There is a lot of repetition, with a common pattern being that: an event will occur and be described by the narrator, then the characters will reflect on said event, and then the characters wi"
