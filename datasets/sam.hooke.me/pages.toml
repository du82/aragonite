title = "Aurora Borealis"
description = "The home page of Sam Hooke."
full_description = "Aurora Borealis13 September 2024During our stay in Iceland, in a rural area 20 minutes north of Selfoss, we were fortunate enough to see the Aurora Borealis (Northern Lights) two nights in a row. The skies were relatively clear, and there was a solar storm with a Kp-index of between 6 to 8 out of 9. These are some of my favourite photos:This time-lapse shows 7 minutes of aurora activity in 6 seconds, so is 70x faster than real life. It consists of 60 individual photos taken 7 seconds apart. The camera remained stationary, but enough time passes that you can see the stars move overhead.The photos were taken by shooting manually, with the following settings:ISO 1600 or 3200Aperture f/3.5Exposure between 4 and 15 secondsManually adjusted focus so that the lights in the distance were clearTaggedstargazingIceland"
