full_description = "Tea and Scones15 March 2013Our tea club reached new heights of sophistication today as it was accompanied by homemade scones. While we could not agree upon exactly how “scones” is pronounced, we could agree that the scones were amazing, and surprisingly filling.As for tea, we commenced with Hampshire Grey, before moving on to Rwandan Tea. While Rwandan Tea sounds rather exotic, it tastes particularly normal.To finish off, a game of Here be Dragons was played. It is a card game where you sail ships around an unexplored ocean, looting treasure and fighting off dragons.I forget what exactly happened during the last two tea club meetings, though one thing for certain is that we drank tea.Taggedteasconeshampshire greyrwandan teahere be dragonscard game"
