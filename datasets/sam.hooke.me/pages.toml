title = "Geysir"
description = "The home page of Sam Hooke."
full_description = "Geysir11 September 2024Strokkur §The main attraction at Geysir is Strokkur, a geyser that supposedly erupts about every 10 minutes. While we were there, it seemed to erupt about every 5 minutes! We saw more than half a dozen eruptions, and the height varied a lot.Geysir §The namesake of Geysir, this geyser is a stone’s throw from Strokkur, but nowadays is dormant. Still, it was exciting to see Geysir up close even though there were no eruptions.Little Geysir §On the way to Strokkur, we passed a small bubbling pool signed as “Little Geysir”.Other sights §There are a series of hot pools higher up above Strokkur and Geysir. We saw one last lupine of the season, and there was a good view to mountains in the distance.TaggedhikegeyserIceland"
