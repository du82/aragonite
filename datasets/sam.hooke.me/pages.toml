["https://sam.hooke.me/trip/2024/06/tour-of-mrao-part-4"]
title = "Tour of MRAO (Part 4): One-Mile Telescope Control Room"
description = "The home page of Sam Hooke."
full_description = "Tour of MRAO (Part 4): One-Mile Telescope Control Room28 June 2024All trips at this location:(Jun 2024) Tour of MRAO (Part 1): Lord's Bridge station and AMI Large Array(Jun 2024) Tour of MRAO (Part 2): HERA, MERLIN, AMI Small Array, COAST and SKA(Jun 2024) Tour of MRAO (Part 3): 4C Array, Flora & Fauna, and One-Mile Telescope(Jun 2024) Tour of MRAO (Part 4): One-Mile Telescope Control RoomMap §SITE 1.ADMINISTRATIONCambridge RoadWimpoleRoadHaslingfieldRoadBarton RoadLord's BridgeStationAMI Small ArrayCOASTAMI Large Array†Pulsar Array4C Array†Half-Mile Telescope (small) & †One-Mile Telescope (large)†One-MileTelescopeTrack continues 1km eastwardse-MERLIN†CLFST†CATUnknown?Unknown?†SKA†HERAUnknown?†SKAPrototypearrayPrototypeindividualPrototypeRyle ControlRoomOne-MileControlRoom(Previously site of †Ryle Telescope)(Track is shared)Name†NameLong BrookBourn Brook𝕳𝖊𝖞 𝕳𝖎𝖑𝖑𝕽𝖔𝖒𝖆𝖓𝕭𝖆𝖗𝖗𝖔𝖜NSITE 6.SEWAGE DISPOSALSITE 2.BOMB STORESSITE 4.F.F.D.4.050403_AMI01_arrival02_station1 Mile1 Kilometerhttps://sam.hooke.me/mraoJune 2024Mullard Radio AstronomyObservatory (MRAO)KeyFormer railwayTelescope railwayMain roadMRAO tarmac roadMRAO trackTelescope (static)Telescope (on track)Telescope (approx. area)Telescope (active)Telescope (inactive)MRAO (approx. area)Finally, we take a look inside the One-Mile Telescope Control Room, situated at the east end of the track, directly beneath one of the static dishes.One-Mile Telescope Control Room §The control room was a perfect time capsule. It’s as if the team just vanished one day, leaving everything the way it was.Equipment §First a look at some of the general equipment around the room.Some interesting rack mounted equipment.The inside of one of the units, which had been pulled out.Close up of a panel.The main control panel, with stacks of log books.Books §Let’s take a closer look at some of the books.Dominion Radio Astrophysical Observatory (DRAO) §Front cover of Dominion Radio Astrophysical Observatory.One of the inside pages.One-Mile Telescope - Copilots Guide §Front cover of One-Mile Telescope - Copilots Guide.Log Book No 1 §Front cover of LOG BOOK NO 1.One of the inside pages.1 Mile - 408MHz Interference - No 2 §Front cover of 1 MILE - 408MHZ INTERFERENCE - NO 2.One of the inside pages.Desk §A look at the workstation.An old Gemini Microcomputers keyboard. This looks like it might belong to a Galaxy 2 or Galaxy 3 “computer system” (see this old advert from ~1979, and this computing history page about the Galaxy 2).Not every desk has this view!The end §Thank you for reading about my visit to the Mullard Radio Astronomy Observatory, and thank you especially to Peter Doherty for the excellent tour!If you found this series interesting, you may also enjoy:This visit by Nelly from February 2012.This visit by Darbians from March 2012 and October 2014.This visit by Mike Lancaster from September 2015.This visit by BikinGlynn from July 2022.This visit by the Cambridge Philosophical Society from April 2023.For a slightly more concise overview of the MRAO, see my post with a map and summary of all the telescopes.Taggedobservatory"
