["https://sam.hooke.me/trip/2021/06/pyramid-lake"]
title = "Pyramid Lake"
description = "The home page of Sam Hooke."
full_description = "Pyramid Lake17 June 2021View looking down into Pyramid Lake.Summary §This scenic hike is named after its destination, Pyramid Lake. While the lake itself is a little on the small side, perhaps edging into “pond” territory, it is nevertheless beautiful, with some fascinating features. Carniverous sundew plants abound on the floating logs, and pikas hide in the nearby rocks.With a steady ascent up 1500ft, and a round trip of less than 5 miles, this there-and-back-again hike is moderately challenging but well worth the reward.Data §Distance7.79 km / 4.84 milesElevation gain474 m / 1555 ftDuration3h30mMoving2h15mAscent §The trailhead starts at a little layby on the North Cascades Highway, and is initially rather steep as you navigate to the top of the cliff that walls in the highway. The gradient lets up a little, but remains a fairly constant gradient. Much of the initial hike is quite exposed, and with little tree cover, so beware if you are going on a hot and sunny day like we did.About halfway up, the trail enters a thick forest, and you finally get some respite from the sun.Pyramid Lake §Pyramid Lake itself is not visible until you almost walk into it. The lake sits within a crater, that has very steep walls on all sides except on the North, which is from where you will be approaching. You are immediately greeted with the serene scene of a calm body of water, the nearby half being covered with floating logs. Remain quiet, and you may also be treated to some wildlife sightings!The view of Pyramid Lake when you first arrive.Flora §A closer look at the logs reveals more than initially met the eye: they are covered with sundew, a carniverous plant!It is easy to spot the distinctive shade of red growing on the logs all across the lake.It even grows on the nearby logs, so you can get a close up look:Sundew on a floating log, with Pyramid Peak just visible in the background.Close up of sundew on a floating log.Another close up of sundew on a floating log. What a fascinating plant!Fauna §While initially there was another couple at the lake, they left soon after we arrived, and so we had the lake to ourselves.Or so we thought. It turned out there was a cute little pika hiding in the rocks nearby:Pika hiding in the rocks.The Pika spots me taking a peek.It turned out the pika was not the only animal company we had.Nestled in the rocks further up was a less fuzzy critter, some kind of lizard:Some kinda of lizard?Pyramid Peak §Since Pyramid Lake is nestled inside a crater, looking around much of the view is just scree, trees or sky. However, to the South West it’s just about possible to see Pyramid Peak, which I assume is how Pyramid Lake gets its name:Pyramid Peak in the distance.Zoomed in on Pyramid Peak, but still somewhat obscured by the trees.By clambering a short way up the rocks, it is possible to get a better view of the peak:A clearer view of Pyramid Peak.Descent §It soon got dark at Pyramid Peak, not because the sun had set, but because the sun had dropped behind the rim of the crater. While everything had earlier been bathed in a warm glow, it now felt a bit chilly and gloomy, so we began to head back down.Beginning the descent, we noticed some impressive fungi:Some large fungi.Back near the trailhead, with so much sun now around, it is odd to think back to how dark it had begun to feel up at Pyramid Lake. Here the view is clear of any obstructions, and there is a sweeping vista across Diablo Lake:Looking down into Diablo Lake.Looking across Diablo Lake to the mountains.After this last view point, the trail descends sharply, hugging Pyramid Creek, and leads you back to the layby parking.Taggedhikeslippy mappika"
