["https://sam.hooke.me/game/iteration-ii"]
title = "Iteration II"
description = "The home page of Sam Hooke."
full_description = "Iteration II23 October 2013The step-based time-travelling sequel to Iteration: make every move count as you send short-lived clones into the past.Think in 2+1D (2 spatial + 1 time dimension) as you incrementally re-write the past.Iteration II takes a very different approach to Iteration. By being step-based (rather than time ticking automatically as in Iteration) it allows for more precise and complex puzzles. To aid you, a timeline is shown at the bottom of the screen with the status of each clone.Where to play? §Nowhere yet. I need to get around to building and uploading a release. Please let me know if you are particularly interested in me doing so.Gallery §Some screenshots:Trivia §In order to appear futuristic, Chronact Systems (the fictional time-travel OS) was dated as being from 2017: a whopping 4 years in the future! That got old fast.Inspired by the legendary Dwarf Fortress, code page 437 is used for the font.The levels are stored in plain text, so if inclined, it is possible to design your own.Level Format §Following is an example level:0006a.txt (Paradoxical) §15 6 ############### #...#.....#...# #...D..P..D..T# ##D############ #=.L.....l.Y# ############# Title: Paradoxical Subtitle1: Sometimes a paradox is necessary Subtitle2: Your past self can survive being interrupted Timelimit: 40 Critical: 40 Link: Alarm#1 ~> Door#3 Link: Lever#1 => Door#1 Link: Lever#2 => Door#2Line 1: level width.Line 2: level height.Taggedpuzzletime-travel"
