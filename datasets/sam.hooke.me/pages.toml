["https://sam.hooke.me/trip/2022/03/kachess-lake-snowshoe"]
title = "Kachess Lake Snowsnoe"
description = "The home page of Sam Hooke."
full_description = "Kachess Lake Snowsnoe5 March 2022View from the campground southwards, across the partially frozen lake.Summary: 5.5 mile round-trip snowshoe from Kachess Sno-Park to Kachess Campground.Kachess Lake Road (from the I-90 to Kachess Sno-Park) was completely clear of snow, so very easy to access the trailhead. Even though we arrived at midday on a Saturday, there were still plenty of spaces. Parking is on the right side of the road, with a big turning circle at the end by the trailhead (since from that point on the road is snow covered). There are chemical toilets just before the trailhead on the left.We snowshoed along NF-49 to the Kachess Campground, stopping at a couple of points where there are good views across the lake. NF-49 was very easy progress on the snowshoes since it is groomed and fairly level. However, after turning right off NF-49 towards the campground the trail is not groomed, and so becomes harder work, but just think how much harder it would be without snowshoes! The snow seemed especially sticky today, perhaps because it’s been quite warm.The beach at the campground made for a good turning around point, with expansive views across the lake and a fallen tree trunk sit on. The lake itself is frozen over from the beach northwards, though very soft and slushy.We encountered a few dozen people on the trail: a fairly even split between snowshoers and snowmobilers, and one couple cross country skiing, and the trail grooming machine!Parking at Kachess Sno-Park.The trail grooming machine, and a good example of what much of the trail looks like.View of a mountaintop on the other side of the lake.The southern end of the lake was not frozen.At the campsite the lake was frozen.View across the frozen lake with the camera at ground level.View of the freshly groomed trail.Taggedsnowshoeslippy map"
