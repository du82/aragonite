["https://sam.hooke.me/trip/2024/10/aurora-borealis-in-the-fens"]
title = "Aurora Borealis in the Fens"
description = "The home page of Sam Hooke."
full_description = "Aurora Borealis in the Fens10 October 2024Less than a month after seeing the Aurora Borealis for the first time during a holiday in Iceland, we saw them from our own back garden in the Fens. This time the lights were more of a blurry glow without any defining shapes, but they were quite bright at times, with a strong red hue easily visible to the naked eye. As best I can tell, the Kp-index was about 7 or 8 out of 9.The photos were taken by shooting manually, with the following settings:ISO 3200Aperture f/3.5Exposure 4 secondsManually adjusted focus so that the lights in the distance were clearTaggedstargazing"
