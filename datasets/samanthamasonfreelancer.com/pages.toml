full_description = '''Elevating writing to the next level, one word at a timeWhen writing, your goal is to engage the reader, who may be a reader of your blog or book, an investor, or potential employer. Whoever it is, your purpose is to engage your audience. Your ultimate goal may be to convince the person of something, but the only way you are going to do that is by keeping them interested throughout the entire piece.My job is to help you identify your target audience and how to best write to them to keep their interest. The approach may entail changing your writing style to using storytelling writing or including background information to bring your reader up to speed. But it could also include formatting decisions such as incorporating charts, images, bullet points, or simply headers to break the text up. No one likes to read the dreaded ”wall of text.” These decisions combine to create a great user experience. I have been editing and writing for 20+ years. I believe that literally everyone can write. In addition, it has also been my experience that all will benefit from a trusted, experienced coach looking over their shoulder as they progress. I customize my approach for each client and their unique individual needs – no two clients are the same nor two projects.Contact me to set up a free 15-minute phone consultation to see whether my services are right for your project. Learn More Read My Latest Blog PostWhich, That, Who, or Whom – Does It Really Matter? “Sam is fantastic. Her profile doesn’t do justice to her skill-set flexibility and competence. She is part coach, part task-master, part thought-partner, and a fantastic writer! My project involved several strategies for marketing myself in the context of a fellowship application. I’m not an easy grader, and highly recommend!” — Upwork client Areas of Specialty Writing coach / blog developmentWhether a beginner wanting to improve your writing, a non-native English speaker looking to elevate your English skills, or increasing your blog readership, many options are available – one-on-one coaching, a summary document with advice, or in-line editing. Identify weak spots then find solutions. ▸Technical ContentTechnical articles and books run the gamut from how to become a programmer and Agile/SAFe development to cryptocurrency and ICO white papers. Having a technical background ensures that I understand your subject; being a writer means that I can make it understandable to your readers. ▸ fiction / non-fiction editingWhat type of editing do you need? Developmental, line, or copy editing? Or, maybe fact checking and table verification. In our initial discussion, we will create a strategy that will produce a writing piece that will engage your target audience while maintaining exacting standards. ▸financial contentFinancial writing requires a special skill set because of the risks of providing advice. Whether it is giving tax advice or writing about a stock, meticulous care must be taken. Fact checking is key as is giving philosophical guidance instead of specific financial advice. ▸ resume, cover letter, Personal statementThe first step is getting your foot in the door, and the way to do that is to make a great first impression. Everyone knows how to customize cover letters and personal statements, but there is much more to it than that. One of the first steps is getting past Human Resources. ▸business servicesAre you starting or growing your business? Then, you need an experienced business consultant to help you find the right path. From startups to established firms, I can guide you to make sound decisions that work for your bottom line while creating a productive corporate culture. ▸ “I believe the writer anyway, should always be the final judge.” — Max Perkins Let’s Get StartedElevating your writing or presentation to the next level is only an email away. Why wait? Contact me now, and I will be in touch in less than 24 hours. Yes, I'm that responsive! {"secureUrl":"https