  Pricing  What will this cost?
  

          
    
      
                      


  Pricing optionsEvery project is different, and therefore, I must be flexible in the way I charge for projects. Some clients need to know the cost upfront, in which case a fixed-price cost is the best option. Other people prefer the flexibility of working a certain number of hours on a subject. Again, the decision is yours. We will work out a payment schedule before initiating the project.how does payment work?Well, it really depends on the project and our relationship. For first-time clients, I typically require a 10% upfront payment for fixed-price jobs, with milestones set up at appropriate times, and a final payment. Hourly fees are charged weekly or biweekly. For new clients, a downpayment of one hour may be required.I accept money from PayPal, Venmo, and Payoneer as well as American Express, Discover, MasterCard, and Visa.Unfortunately, due to Upwork rules, if you are currently one of my Upwork clients, I cannot accept your money offsite.how does time tracking work?I use TopTracker to track my time. If you would like to see progress during the week, please let me know. You can also set a weekly limit for the hours that I work.Who owns the work?Upon final payment, you have exclusive rights to all work. If the agreement was for credited work, I have the right to link to it from my website or use it as a reference. For ghostwritten or edited pieces, I will not reference the work, so it is yours outright.Fine Print: Unfortunately, I must mention the following: If payment is not made in entirety, I retain all rights to my work, which you may not use. This includes ideas that I give you regarding projects. Any ideas paid using hourly payment are yours to use at any time as long as timely payment has been made. Payment is due within 7 days of completion of the project. A 15% penalty applies for every 30 days past due, and the work may not be published until payment is made in its entirety.





















  
  






  hourly$65 – $150 per hour, depending on the contentFixed-price EDITINGPriced by the word $0.07 – $0.20 per word depending on the contentPriced by the chapter, varies by content and size of the bookPriced by the project, variesFixed-price writingPriced by the word $1.00 – $5.00 per word depending on the content, rewriting or new materialMixedSome projects combine the two. One is example is book editing where the editing of chapters is a fixed cost, but the telephone calls to discuss the changes is hourly. This ensures that the author controls the amount of work that goes into the edits.Special casesPrices vary based on credited work versus ghostwritten/ghost-edited work. Credited work costs less.Rush jobs and work on weekends and holidays are welcome but may incur additional fees.If plagiarism is detected, the author must rewrite any sections flagged. I do not use Copyscape, so I can only determine some portions that are in violation of other authors’ work. It is up to the author to resolve this issue and adhere to copyright policies.To pay with credit card, click the pay Now button





















  
  









      
      
      
    
          


