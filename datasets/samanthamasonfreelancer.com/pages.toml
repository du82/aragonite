  Writing Coach / Blog Development  What services do you provide?
  

          
    
      
                      


  Writing coachWithin the last two years, I have seen an uptick in people who want to learn how to improve their writing, especially among software engineers. It turns out that most people assume that technical people, programmers to be specific, cannot write. How wrong they are! Programming is merely speaking in a different language, whether it is C, Python, or JavaScript. Guess what? English is a language as well, and once you know the rules, you too can become a great writer, perhaps even an excellent one.Does it matter if what you are writing is a technical document, memoir, or novel? Absolutely not! Once you know the message or story you want to convey, and your target audience, then you are halfway there. The next step is to write the piece, and we will work on it together to take it to the next level.Whether you have always dreamed of writing but do not know where to start, are stuck in a rut and need new ideas, or you are ready to finally write that novel you have always dreamed of, I am with you each step of the way.non-native english speakersI work with many non-native speakers who want to improve their English skills. Most people make the same mistakes, for example with prepositions and the uses of "the" and "a." I point out patterns and explain ways to remember the rules.I also work with clients on improving both their written and spoken English.














































