full_description = '''Elevating writing to the next level, one word at a timeWhen writing, your goal is to engage the reader, who may be a reader of your blog or book, an investor, or potential employer. Whoever it is, your purpose is to engage your audience. Your ultimate goal may be to convince the person of something, but the only way you are going to do that is by keeping them interested throughout the entire piece.My job is to help you identify your target audience and how to best write to them to keep their interest. The approach may entail changing your writing style to using storytelling writing or including background information to bring your reader up to speed. But it could also include formatting decisions such as incorporating charts, images, bullet points, or simply headers to break the text up. No one likes to read the dreaded ”wall of text.” These decisions combine to create a great user experience. I have been editing and writing for 20+ years. I believe that literally everyone can write. In addition, it has also been my experience that all will benefit from a trusted, experienced coach looking over their shoulder as they progress. I customize my approach for each client and their unique individual needs – no two clients are the same nor two projects.Contact me to set up a free 15-minute phone consultation to see whether my services are right for your project. Learn More Read My Latest Blog PostWhich, That, Who, or Whom – Does It Really Matter? “Sam is fantastic. Her profile doesn’t do justice to her skill-set flexibility and competence. She is part coach, part task-master, part thought-partner, and a fantastic writer! My project involved several strategies for marketing myself in the context of a fellowship application. I’m not an easy grader, and highly recommend!” — Upwork client Areas of Specialty Writing coach / blog developmentWhether a beginner wanting to improve your writing, a non-native English speaker looking to elevate your English skill