  services providedFeedback from a writing coach can come in many different forms, from a phone call, inline comments in a Word or Google document, a separate writeup, or a combination. For your project, choose from the following list of services to create a custom process to improve your writing.Brainstorm on projectsDevelop an outlineIdentify the target audienceDevelop a personal Style GuidePoint out patterns and weak areas in writingDetailed line-by-line feedbackFormatting suggestions to engage the readerFinal line editingDiscuss venues for publishing














































  “Samantha is fantastic. She was able to review a blog post of mine on a tight time crunch. The feedback was phenomenal and has already improved my writing ten fold. If you can find a spot in her schedule, take it!”
  
  — Upwork client
























  “I made a blog post last week that was really influenced by your feedback. It was an article about cryptocurrency security, but I tried to focus on making it more personal and funny. The post ended up catching on and got over 40k views in one day and is now the all-time top voted post in two of the subreddits I posted to. Many of the commenters specifically cited the humor and storytelling as the reasons they enjoyed the post. I don’t think I would have written the article in that way if it hadn’t been for your feedback, so I wanted to tell you that you’ve definitely made a demonstrably positive impact on my writing.”
  
  — Michael Lynch




  Michael wrote a post on how working with me grew his audience: Hiring an Editor Grew My Blog Audience 450xBlog development AND EDITINGWhen people first start a blog, they are very excited and have plans to write new posts weekly or biweekly, certainly at least once a month. After all, how hard could it be? You have so many ideas that it is hard to choose what to write about. Well, as time goes on, you publish new posts once a month, then every other month, and then you notice that it has been six months. Sound familiar? It happens to a lot of people and even to companies. Time slips away because it is not a priority. Well, I have a solution.The key is creating a Content Calendar that contains the next topics you are going to write about. I suggest scheduling out ten because that means you will have ten topics that you could write about. Some will be harder to develop than others, so having a long list provides you with flexibility. Set aside a time each week to write and a time to publish the work. For example, publish a cooking post on Thursday or Friday. Most people read those types of posts on the weekend. If you post on Monday, it will probably slip their mind to read it. For businesses, Tuesdays are probably better – certainly not on a Monday!Why would someone need my help?Weekly calls to discuss the topic, generating inspiration and motivationAccountabilityLearning how to create a content calendarEditing and/or writing coachBrainstorming on additional topicsEnsuring that you are addressing your readers' needsTips for posting on social mediaI found these two articles to be extremely useful. While I do not agree with all the conclusions and find some data lacking, the articles raise many points for you to consider.The Best Time to post on Instagram, Facebook, Twitter, LinkedIn, Pinterest, and Google+10 LinkedIn Publishing Tips























      
      
      
    
          


