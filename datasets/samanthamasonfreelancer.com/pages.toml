 your site only to be turned off by the repetitive wording? For novels, you want more colorful and descriptive prose. Imagine reading “There was a car. It was red. It got towed.” No, just no. Know your audience, and write in a style that engages them. ConclusionYes, eliminating these words makes writing slower and harder, but the words convey a stronger, more concise message. Do not make the reader work so hard by needing them to parse out unnecessary words. They will appreciate your efforts, and you will grow as a writer. Trust me. I know how hard this is! Writing this post was the most difficult job for me to date because I needed to follow every rule I put in place. Again, none of these words entirely disappear from writing but eliminate as many as possible.Interested in adding words to this list? If so, leave a comment below!To automatically receive email notification of new posts, please sign up. Samantha MasonAugust 31, 2018Comment Facebook0 Twitter 0 Likes"
