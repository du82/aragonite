  What to Expect  How does this work?
  

          
    
      
                      


  Making the decisionChoosing an editor or writing coach is a very personal decision that should not be taken lightly. The process of receiving feedback on your writing can be difficult, so it is important to choose someone who has a demeanor that you can work with. Communication is critical to a good working relationship. We become a team that must work well together.To that end, the first step in the process is to have a free 30-minute chat to make sure that we are a good fit and that our processes and goals align. Sometimes it is not a good fit, and it is better to find that out early on. defining the projectThe next step is to clearly outline the scope of the work. Do you need help starting your project and want to brainstorm? Or, is your resume already written, but you need it customized for a specific job posting? Perhaps you need an outside perspective on a post that you wrote. Clearly understanding the project is critical to its success. The scope may change over time, which is why communication is always key.Identify the target audienceDetermine the writing styleIdentify potential roadblocksDescribe what success looks likeCreate a timelineCommunicationSome people like to talk on the phone, others through Skype, others through text and email. The choice is up to you. I am available 7 AM to 10 PM Eastern Time (GMT-5), including weekends and most holidays. My response time is usually within the hour because I understand that deadlines frequently occur outside normal business hours. What sets me apart is that I am here when you need me, and my turnaround time is fast.The processAfter defining the fundamentals, we start to work. Again, you define the process because each project is unique. For example:When first starting a blog, we may have weekly brainstorming calls to discuss the direction and plan the Content Calendar. For coaching on a post, we can go back and forth using Word documents with comments or Google Docs. Book editing can take many forms, from a call regarding every chapter or a complete edit with no feedback until the end. For a mock interview, we schedule a call and make it as real as possible. After the “interview,” we debrief regarding the conversation.Whatever the process, it needs to work for you. And, we will tweak it until you are satisfied.























 






















