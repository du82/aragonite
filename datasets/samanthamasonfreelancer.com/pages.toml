  SituationComma UsageCommentExample
  
  If...thenUse a comma before ‘then.’
If ‘then’ is not used, put the comma where it would be.

   
If it rains, I need an umbrella.
  
  E.g. and i.e.Use a comma before and after e.g./i.e.Also, use a comma to close off the phrase.
   I hope the weekend, i.e., Saturday and Sunday, will have moderate temperatures.
  
  Dependent clause before independentUse a comma before the independent clause begins.  
   When the sun shines, I am in a happier mood.
  
  Connecting independent clausesUse a comma before the connector word.  
   
I will mow the lawn Saturday, and I will do the weeding on Sunday.

  
  Beginning connector words
Use a comma after a connector word at the beginning of a sentence.

The exception is the word ‘but.’
   And, cooking will be done on both days.
  
  Independent connector words
Use a comma to set the word off from the sentence.If it appears at the beginning of a sentence, then a comma after; in the middle, use a comma before and after; at the end, use a comma before.
   Whether summer is coming to an end, however, remains to be seen.
  
  Name or titleSet the word(s) off with commas.  
   My husband, Peter, will actually mow the lawn this weekend.
  
  QuotationsUse a comma before the quotation.  
   Peter said, “I will mow the lawn if it doesn’t rain.”
  
  Oxford commaUse a comma in a list of three or more items.Just use it!
   I have tomatoes, peppers, and herbs growing in my garden.
  
  Because and sinceDo not use a comma when the word is in the middle of a sentence.  
   My tomatoes suffered this year because the squirrels climbed the vines.
  



  ConclusionThe end goal is for your writing to convey your message in an easily understandable format. I cannot stress enough how reading your words out loud will yield a vastly superior message. Pause at the commas. If you run out of breath, you have a problem because readers cannot retain more than they can breathe.While it may require more work on your part, reading it out loud and adding the appropriate commas will elevate your writing, more easily spreading your message and increasing readership.My suggestion is to decide on the rules that you want to follow and stick to it. Believe it or not, if you switch the punctuation, or style rules, throughout your writing, your readers will notice. Create a Style Guide for your writing and follow it!Do you have more questions or tips regarding when and where to use a comma? If so, leave a comment below!To automatically receive email notification of new posts, please sign up. 
























  Samantha MasonAugust 23, 2018Grammar Lesson, Writing coachComment




  
