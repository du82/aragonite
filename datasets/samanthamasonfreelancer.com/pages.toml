  "So that" versus "So"



  “So That” versus “So”On the surface, these two phrases seem the same, but they are far from it. Even the punctuation around them is different. So, let’s take a closer look.So that“So that” expresses the purpose, intention, or plan of what you are doing. It can often be replaced by “in order to.”Example 1Finnius’s friends needed to find him so that they could warn him of the volcano.Finnius’s friends needed to find him in order to warn him of the volcano.Their purpose was to warn Finnius.Example 2The group separated so that they could find him as quickly as possible.The group separated in order to find him as quickly as possible.Their purpose was to find him quickly.Example 3Dana jumped into the water so that she could search the center of the pond.Dana jumped into the water in order to search the center of the pond.Her purpose was to search the center of the pond.A closer lookMany people may notice that these sentences sound fine without the word “that.”Finnius’s friends needed to find him so they could warn him of the volcano.The group separated so they could find him as quickly as possible.Dana jumped into the water so she could search the center of the pond.And, you are correct. In speech, “that” is not needed. In writing, however, I suggest always using it. Why? Because it will help you know when to use a comma. Yes, the complicated comma rears its ugly head again.So“So” alone is used in two situations – as an intensifier and as a coordinating conjunction. The coordinating conjunction is what is confused with “so that,” so let’s quickly look at an example where “so” is an intensifier.Example 4The pond was so large that Karl ran slower and slower.This sentence uses “so” as an intensifier to give emphasis to the size of the pond.Now, we switch to the coordinating conjunction examples. “So” expresses the result or the effect. It can often be substituted with “as a result.”Example 5Squiggy found Finnius on the north end of the pond, so he yelled to the others.Squiggy found Finnius on the north end of the pond, and as a result he yelled to the others.The result was that he yelled to the others.Example 6Dana heard Squiggy, so she swam straight toward them.Dana heard Squiggy, and as a result she swam straight toward them.The result was that she swam to them.Example 7Karl was excited that they found their fish friend, so he ran faster to meet the others.Karl was excited that they found their fish friend, and as a result he ran faster to meet the others.The result was that he ran faster.If you read each of these sentences out loud, you see that substituting “so that” for “so” makes the sentence awkward. Read the sentences below.Squiggy found Finnius on the north end of the pond so that he yelled to the others.Dana heard Squiggy so that she swam straight toward them.Karl was excited that they found their fish friend so that he ran faster to meet the others.These sentences simply do not make sense. A very general rule is that if you insert “that” after “so,” then you are more likely dealing with the purpose instead of the result.PunctuationThe good news is that the use of the comma with “so that” and “so” is simple. For “so that,” never use a comma. For the intensifier case of “so,” never use a comma. For the coordinating connector “so,” always use a comma. For once, the comma is straightforward.Example recap“So that”Finnius’s friends needed to find him so that they could warn him of the volcano.The group separated so that they could find him as quickly as possible.Dana jumped into the water so that she could search the center of the pond.Intensifier case of “so”The pond was so large that Karl ran slower and slower.Coordinating connector “so”Squiggy found Finnius on the north end of the pond, so he yelled to the others.Dana heard Squiggy, so she swam straight toward them.Karl was excited that they found their fish friend, so he ran faster to meet the others.Placement in a sentenceThe “so that” clause can be placed before or after the independent clause.So that they could warn him of the volcano, Finnius’s friends needed to find him.So that they could find him as quickly as possible, the group separated.So that she could search the center of the pond, Dana jumped into the water.The same does not hold true for “so.” It must come between the two independent clauses.So, he yelled to the others Squiggy found Finnius on the north end of the pond.So, she swam straight toward them Dana heard Squiggy.So, he ran faster to meet the others Karl was excited that they found their fish friend.These sentences make no sense whatsoever.One special caseGrammarians tend to frown when coordinating conjunctions begin a sentence. Personally, I see nothing wrong with this usage as long as it is not overdone.Example 8So, the friends were finally together.RecapSo that: Expresses the purpose and can often be replaced with “in order to.”So: Expresses the result and can often be replaced with “as a result.”ConclusionWhile it may seem like a minor issue, the appropriate use of “so that” and “so,” along with the correct punctuation usage, makes your writing more understandable and easier for your audience to read.The next post will dive deeper into commas and explain why they are so important.Do you have more questions or tips regarding “so that” and “so”? If so, then add a comment below!To automatically receive email notification of new posts, please sign up.For the complete story of Finnius, Squiggy, Dana, and Karl, read more.
























