 a sentence because it does not complete a thought. You are left wondering what happened.Let’s look more closely at the dependent clause. If we leave out the word “as,” we have an independent clause “the two animals passed the big oak tree.” The word “as” in this case is called a dependent marker word, which is a word added to the beginning of an independent clause to make it dependent. This sentence is called a complex sentence, one with only one independent clause and at least one dependent clause.IndependentA squirrel joined themDependentAs the two animals passed the big oak treeExample 4When Dana, the dog, saw a tennis ball, she took a detour but soon remembered their group’s important task, and she returned to her friends.This sentence contains two independent clauses and one dependent clause. This is called a compound-complex sentence, one with at least two independent clauses and at least one dependent clause. Can you identify the clauses?IndependentShe took a detour but soon remembered their group’s important taskShe returned to her friendsDependentWhen Dana, the dog, saw a tennis ballSo, why is “but soon remembered their group’s important task” not a dependent clause? Remember when we talked about a coordinating conjunction? Well, this phrase is two independent clauses connected with a coordinating conjunction “but,” without repeating the noun “she.” It could be written as “she took a detour, but she soon remembered their group’s important task.” The coordinating conjunction “but” links the two verbs “took” and “remembered.”“When” is a dependent marker word, which is a word that is added to the beginning of an independent clause to make it dependent. “Dana, the dog, saw a tennis ball” is an independent clause. It only becomes dependent when preceded by “when.”At this point, the comma is starting to become more confusing. Typically, a comma is not used to separate a dependent clause – except when it is at the beginning of a sentence. Hence, the reason for the comma after “when Dana, the dog, saw a tennis ball."The next part of the sentence is more complicated. When connecting two independent clauses with a coordinating conjunction that leaves out the noun in the second phrase, do not use a comma.Correct: She took a detour but soon remembered their group’s important task.Correct: She took a detour, but she soon remembered their group’s important task.Incorrect: She took a detour, but soon remembered their group’s important task.The final independent clause, “she returned to her friends” also uses the conjunction “and” to connect it to the sentence, and since it is independent, it requires a comma.Example 5As I said, it is critical to understand this because many of the next posts rely on a complete understanding of this information.Dana, Karl, and Squiggy ran as fast as they could because they needed to save their fish friend.This sentence is another complex sentence, one with one independent clause and at least one dependent clause.IndependentDana, Karl, and Squiggy ran as fast as they couldDependentbecause they needed to save their fish friendExample 6However, Finnius was not in his usual spot at the far end of the pond.“However” in this case is an independent marker word. It is used before an independent clause and is separated by a comma.Summary of definitionsIt is not critical to remember the names of the sentences, but for the sake of being thorough, let’s review one more time.Clause – Contains a noun and a verbComplex sentence – Contains one independent clause and at least one dependent clauseCompound sentence – Contains at least two independent clausesCompound-complex sentence – Contains at least two independent clauses and at least one dependent clauseCoordinating conjunction – Connects clauses; examples: and, but, or, nor, yetDependent clause – A clause that cannot stand alone as a sentence because it does not complete a thoughtDependent marker word – Added before an independent clause to make it dependent; examples: after, as, because, before, when, whileIndependent clause – Clause that completes a thoughtIndependent marker word – Added to the beginning of an independent clause and separated by a comma; examples: also, hence, however, nevertheless, therefore, typicallySimple sentence – Contains only one independent clauseConclusionDependent clauses are not sentences that can stand alone and need to be attached to an independent clause. While this may seem like basic information, it will help in the next post when we discuss the topic of when to use “so that” instead of “so.” We will talk more about the tricky comma and why it is so important in another post. Knowing this will elevate your writing to the next level.Do you know other tips that might help writers to better understand independent and dependent clauses? If so, then add a comment below!To automatically receive email notification of new posts, please sign up.For the complete story of Finnius, Squiggy, Dana, and Karl, read more. Samantha MasonJuly 3, 2018Grammar Lesson, Independent vs. Dependent ClausesComment Facebook0 Twitter 0 Likes'
