["http://www.sameersingh.org/courses/gml/fa18"]
title = "CS 273A: Machine Learning (Fall 2018)"
description = "Sameer Singh, University of California, Irvine"
full_description = "How can a machine learn from experience, to become better at a given task? How can we automatically extract knowledge or make sense of massive quantities of data? These are the fundamental questions of machine learning. Machine learning and data mining algorithms use techniques from statistics, optimization, and computer science to create automated systems which can sift through large volumes of data at high speed to make predictions or decisions without human intervention. Machine learning as a field is now incredibly pervasive, with applications from the web (search, advertisements, and suggestions) to national security, from analyzing biochemical interactions to traffic and emissions to astrophysics. Perhaps most famously, the $1M Netflix prize stirred up interest in learning algorithms in professionals, students, and hobbyists alike; now, websites like Kaggle host regular open competitions on many companies' data. This class will familiarize you with a broad cross-section of models and algorithms for machine learning, and prepare you for research or industry application of machine learning techniques. We're using Campuswire for all class announcements, q&a and discussions. Please do not email me with questions except for official matters — paste them on Campuswire."
author = "Sameer Singh"
year_published = 2025
clearnet = "http://www.sameersingh.org/courses/gml/fa18"
