title = "CS 295: Statistical NLP (Winter 2017)"
description = "Sameer Singh, University of California, Irvine"
full_description = "A computer’s ability to read, learn, and understand language is becoming of utmost importance with access to enormous amounts of digitized text (that we can’t possibly read), with personal communication increasingly becoming digital (that we can’t possibly remember), and with autonomous agents becoming bigger parts of our everyday lives (with whom we need to talk to). This course will introduce the historical and recent approaches to natural language processing, in particular focusing on the computational tasks and the machine learning techniques involved in NLP that have achieved incredible successes."
