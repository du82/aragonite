age Processing (EMNLP). 2024 Conference [ BibTex ] @inproceedings{partial:emnlp24, author = {Yanai Elazar and Bhargavi Paranjape and Hao Peng and Sarah Wiegreffe and Khyathi Chandu and Vivek Srikumar and Sameer Singh and Noah A. Smith}, title = { {Measuring and Improving Attentiveness to Partial Inputs with Counterfactuals} }, booktitle = {Empirical Methods in Natural Language Processing (EMNLP)}, year = {2024} } Kolby Nottingham, Bodhisattwa Prasad Majumder, Bhavana Dalvi Mishra, Sameer Singh, Peter Clark, Roy Fox.Skill Set Optimization: Reinforcing Language Model Behavior via Transferable Skills. International Conference on Machine Learning (ICML). 2024 Conference [ PDF, ArXiV, OpenReview, BibTex ] @inproceedings{skillsetopt:icml24, author = {Kolby Nottingham and Bodhisattwa Prasad Majumder and Bhavana Dalvi Mishra and Sameer Singh and Peter Clark and Roy Fox}, title = { {Skill Set Optimization: Reinforcing Language Model Behavior via Transferable Skills} }, booktitle = {International Conference on Machine Learning (ICML)}, year = {2024} } Tamanna Hossain, Sunipa Dev, Sameer Singh.MisgenderMender: A Community-Informed Approach to Interventions for Misgendering. Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL). 2024 Conference [ PDF, ArXiV, BibTex ] @inproceedings{misgendermender:naacl24, author = {Tamanna Hossain and Sunipa Dev and Sameer Singh}, title = { {MisgenderMender: A Community-Informed Approach to Interventions for Misgendering} }, booktitle = {Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL)}, year = {2024} } Preethi Seshadri, Sameer Singh, Yanai Elazar.The Bias Amplification Paradox in Text-to-Image Generation. Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL). 2024 Conference [ PDF, ArXiV, BibTex ] @inproceedings{biasampl:naacl24, author = {Preethi Seshadri and Sameer Singh and Yanai Elazar}, title = { {The Bias Amplification Paradox in Text-to-Image Generation} }, booktitle = {Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL)}, year = {2024} } Raja Sekhar Reddy Mekala, Yasaman Razeghi, Sameer Singh.EchoPrompt: Instructing the Model to Rephrase Queries for Improved In-context Learning. Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL). 2024 Conference [ PDF, ArXiV, BibTex ] @inproceedings{echoprompt:naacl24, author = {Raja Sekhar Reddy Mekala and Yasaman Razeghi and Sameer Singh}, title = { {EchoPrompt: Instructing the Model to Rephrase Queries for Improved In-context Learning} }, booktitle = {Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL)}, year = {2024} } Kolby Nottingham, Yasaman Razeghi, Kyungmin Kim, JB Lanier, Pierre Baldi, Roy Fox, Sameer Singh.Selective Perception: Learning Concise State Descriptions for Language Model Actors. Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL). 2024 Conference [ PDF, ArXiV, BibTex ] @inproceedings{selperception:naacl24, author = {Kolby Nottingham and Yasaman Razeghi and Kyungmin Kim and JB Lanier and Pierre Baldi and Roy Fox and Sameer Singh}, title = { {Selective Perception: Learning Concise State Descriptions for Language Model Actors} }, booktitle = {Annual Conference of the North American Chapter of the Association for Computational Linguistics (NAACL)}, year = {2024} } Catarina Belém, Preethi Seshadri, Yasaman Razeghi, Sameer Singh.Are Models Biased on Text without Gender-related Language?. International Conference on Learning Representations (ICLR). 2024 Conference [ PDF, ArXiV, OpenReview, Project Page, Video, BibTex ] @inproceedings{unstereoeval:iclr24, author = {Catarina Belém and Preethi Seshadri and Yasaman Razeghi and Sameer Singh}, title = { {Are Models Biased on Text without Gender-related Language?} }, booktitle = {International Conference on Learning Representations (ICLR)}, year = {2024} } Yanai Elazar, Akshita Bhagia, Ian Helgi Magnusson, Abhilasha Ravichander, Dustin Schwenk, Alane Suhr, Evan Pete Walsh, Dirk Groeneveld, Luca Soldaini, Sameer Singh, Hannaneh Hajishirzi, Noah A. Smith, Jesse Dodge.What's In My Big Data?. International Conference on Learning Representations (ICLR). 2024 Conference [ PDF, ArXiV, OpenReview, Demo, BibTex ] @inproceedings{wimbd:iclr24, author = {Yanai Elazar and Akshita Bhagia and Ian Helgi Magnusson and Abhilasha Ravichander and Dustin Schwenk and Alane Suhr and Evan Pete Walsh and Dirk Groeneveld and Luca Soldaini and Sameer Singh and Hannaneh Hajishirzi and Noah A. Smith and Jesse Dodge}, title = { {What's In My Big Data?} }, booktitle = {International Conference on Learning Representations (ICLR)}, year = {2024} } 2023 Satyapriya Krishna, Jiaqi Ma, Dylan Slack, Asma Ghandeharioun, Sameer Singh, Himabindu Lakkaraju.Post Hoc Explanations of Language Models Can Improve Language Models. Neural Information Processing Systems (NeurIPS). 2023 Conference [ ArXiV, PDF, BibTex ] @inproceedings{posthoc:neurips23, author = {Satyapriya Krishna and Jiaqi Ma and Dylan Slack and Asma Ghandeharioun and Sameer Singh and Himabindu Lakkaraju}, title = { {Post Hoc Explanations of Language Models Can Improve Language Models} }, booktitle = {Neural Information Processing Systems (NeurIPS)}, year = {2023} } Shivanshu Gupta, Matt Gardner, Sameer Singh.Coverage-based Example Selection for In-Context Learning. Empirical Methods in Natural Language Processing (EMNLP). 2023 Conference [ ArXiV, PDF, BibTex ] @inproceedings{demselect:emnlp23, author = {Shivanshu Gupta and Matt Gardner and Sameer Singh}, title = { {Coverage-based Example Selection for In-Context Learning} }, booktitle = {Empirical Methods in Natural Language Processing (EMNLP)}, year = {2023} } Dheeru Dua, Emma Strubell, Sameer Singh, Pat Verga.To Adapt or to Annotate: Challenges and Interventions for Domain Adaptation in Open-Domain Question Answering. Association for Computational Linguistics (ACL). 2023 Conference [ ACL Anthology, ArXiV, PDF, Abstract, BibTex ] Recent advances in open-domain question answering (ODQA) have demonstrated impressive accuracy on general-purpose domains like Wikipedia. While some work has been investigating how well ODQA models perform when tested for out-of-domain (OOD) generalization, these studies have been conducted only under conservative shifts in data distribution and typically focus on a single component (i.e., retriever or reader) rather than an end-to-end system. This work proposes a more realistic end-to-end domain shift evaluation setting covering five diverse domains. We not only find that end-to-end models fail to generalize but that high retrieval scores often still yield poor answer prediction accuracy. To address these failures, we investigate several interventions, in the form of data augmentations, for improving model adaption and use our evaluation set to elucidate the relationship between the efficacy of an intervention scheme and the particular type of dataset shifts we consider. We propose a generalizability test that estimates the type of shift in a target dataset without training a model in the target domain and that the type of shift is predictive of which data augmentation schemes will be effective for domain adaption. Overall, we find that these interventions increase end-to-end performance by up to ~24 points. @inproceedings{adaptqa:acl23, author = {Dheeru Dua and Emma Strubell and Sameer Singh and Pat Verga}, title = { {To Adapt or to Annotate: Challenges and Interventions for Domain Adaptation in Open-Domain Question Answering} }, booktitle = {Association for Computational Linguistics (ACL)}, doi = {10.18653/v1/2023.acl-long.807}, pages = {14429–14446}, year = {2023} } Tamanna Hossain, Sunipa Dev, Sameer Singh.MISGENDERED: Limits of Large Language Models in Understanding Pronouns. Association for Computational Linguistics (ACL). 2023 Conference [ ACL Anthology, ArXiV, PDF, Video, Demo, Code, Abstract, BibTex ] Content Warning: This paper contains examples of misgendering and erasure that could be offensive and potentially triggering.Gender bias in language technologies has been widely studied, but research has mostly been restricted to a binary paradigm of gender. It is essential also to consider non-binary gender identities, as excluding them can cause further harm to an already marginalized group. In this paper, we comprehensively evaluate popular language models for their ability to correctly use English gender-neutral pronouns (e.g., singular they, them) and neo-pronouns (e.g., ze, xe, thon) that are used by individuals whose gender identity is not represented by binary pronouns. We introduce Misgendered, a framework for evaluating large language models’ ability to correctly use preferred pronouns, consisting of (i) instances declaring an individual’s pronoun, followed by a sentence with a missing pronoun, and (ii) an experimental setup for evaluating masked and auto-regressive language models using a unified method. When prompted out-of-the-box, language models perform poorly at correctly predicting neo-pronouns (averaging 7.6% accuracy) and gender-neutral pronouns (averaging 31.0% accuracy). This inability to generalize results from a lack of representation of non-binary pronouns in training data and memorized associations. Few-shot adaptation with explicit examples in the prompt improves the performance but plateaus at only 45.4% for neo-pronouns. We release the full dataset, code, and demo at https://tamannahossainkay.github.io/misgendered/. @inproceedings{misgendered:acl23, author = {Tamanna Hossain and Sunipa Dev and Sameer Singh}, title = { {MISGENDERED: Limits of Large Language Models in Understanding Pronouns} }, booktitle = {Association for Computational Linguistics (ACL)}, doi = {10.18653/v1/2023.acl-long.293}, pages = {5352–5367}, year = {2023} } Kolby Nottingham, Prithviraj Ammanabrolu, Alane Suhr, Yejin Choi, Hannaneh Hajishirzi, Sameer Singh, Roy Fox.Do Embodied Agents Dream of Pixelated Sheep: Embodied Decision Making using Language Guided World Modelling. International Conference on Machine Learning (ICML). 2023 Conference [ ArXiV, Project Page, Code, BibTex ] @inproceedings{deckard:icml23, author = {Kolby Nottingham and Prithviraj Ammanabrolu and Alane Suhr and Yejin Choi and Hannaneh Hajishirzi and Sameer Singh and Roy Fox}, title = { {Do Embodied Agents Dream of Pixelated Sheep: Embodied Decision Making using Language Guided World Modelling} }, booktitle = {International Conference on Machine Learning (ICML)}, pages = {26311-26325}, year = {2023} } Zhouhang Xie, Sameer Singh, Julian McAuley, Bodhisattwa P. Majumder.Towards Factual and Informative Review Generation for Explainable Recommendation. AAAI Conference on Artificial Intelligence (AAAI). 2023 Conference [ ArXiV, BibTex ] @inproceedings{recomm:aaai23, author = {Zhouhang Xie and Sameer Singh and Julian McAuley and Bodhisattwa P. Majumder}, title = { {Towards Factual and Informative Review Generation for Explainable Recommendation} }, booktitle = {AAAI Conference on Artificial Intelligence (AAAI)}, year = {2023} } Margarita Geleta, Jiacen Xu, Manikanta Loya, Junlin Wang, Sameer Singh, Zhou Li, Sergio Gago Masague.Maestro: A Gamified Platform for Teaching AI Robustness. AAAI Symposium on Educational Advances in Artificial Intelligence (EAAI). 2023 Conference [ BibTex ] @inproceedings{maestro:eaai23, author = {Margarita Geleta and Jiacen Xu and Manikanta Loya and Junlin Wang and Sameer Singh and Zhou Li and Sergio Gago Masague}, title = { {Maestro: A Gamified Platform for Teaching AI Robustness} }, booktitle = {AAAI Symposium on Educational Advances in Artificial Intelligence (EAAI)}, pages = {15816–15824}, year = {2023} } Elena Kochkina, Tamanna Hossain, Robert L. Logan IV, Miguel Arana-Catania, Rob Procter, Arkaitz Zubiaga, Sameer Singh, Yulan He, Maria Liakata.Evaluating the generalisability of neural rumour verification models. Information Processing and Management. 2023 Journal [ Journal page, PDF, Abstract, BibTex ] Research on automated social media rumour verification, the task of identifying the veracity of questionable information circulating on social media, has yielded neural models achieving high performance, with accuracy scores that often exceed 90%. However, none of these studies focus on the real-world generalisability of the proposed approaches, that is whether the models perform well on datasets other than those on which they were initially trained and tested. In this work we aim to fill this gap by assessing the generalisability of top performing neural rumour verification models covering a range of different architectures from the perspectives of both topic and temporal robustness. For a more complete evaluation of generalisability, we collect and release COVID-RV, a novel dataset of Twitt"
