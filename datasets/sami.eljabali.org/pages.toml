["https://sami.eljabali.org/macos"]
title = "macOS Configuration"
description = "Setting a new Mac up with its configuration is a great joy of mine. Because there are too many configurations to remember, documented here are them all for both you & I."
full_description = '''macos macOS Configuration Setting a new Mac up with its configuration is a great joy of mine. Because there are too many configurations to remember, documented here are them all for both you & I. Sami Eljabali 04 Jul 2021 • 5 min read With every new Mac I get gitty like a kid on a Christmas morning to set it up with configurations & apps of choice. There are too many configurations to remember, hence figured in documenting them will benefit both you & I. The setup below was done on Big Sur 11.4.MouseLarger mouse sizes help reduce cognitive load when trying to find them. Cursor size to 3.Uncheck "Shake mouse pointer locate."System Settings -> Accessibility -> Display -> CursorKeyboardKeyboard navigation always beats mouse in speed. You can enable tabbing through apps' controls, with the focused view at hand highlighted, and the Space bar emulating clicks.Check "Use keyboard navigation to move focus between controls."System Settings -> Keyboard -> ShortcutsSoundI dislike Mac making noises. They not only can be irritable, but too unexpectedly play back during Zoom calls. Set "Alert volume" to 0. Uncheck "Play sound on startup."Uncheck "Play feedback when volume is changed."System Settings -> Sound -> Sound EffectsDock & Menu BarMinimized app windows into doc icon appears camouflaged, minimize app windows in the dock instead.Uncheck "Minimize windows into application icon."Zen = Hidden Dock + Hidden Menu + 0 desktop icons. Check "Automatically hide and show the Dock."Check "Automatically hide and show the menu bar" (Big Sur onwards).Recent applications in Dock is a cop out; decide if it's in or out.Uncheck "Show recent applications in Dock."System Settings -> Dock & Menu BarClock & DatesTime format: 24-Hour Time (More concise).First day of the week: Monday (Accurately reflects work week).System Settings -> Language & RegionMenu bar:Show day of the week.Show date.System Settings -> Dock & Menu Bar -> ClockScreen SaverCheck "Show screen saver after 10 minutes."Check "Show with clock."System Settings -> Desktop & Screen SaverHot cornersTop left: Mission Control.Top right: Desktop.Bottom right: Start Screensaver (allows for quickly leaving computer with lock).System Settings -> Desktop & Screen Saver -> Hot Corners...Mission ControlUncheck "Automatically rearrange Spaces based on most recent use."Uncheck "When switching to an application, switch to a Space with open windows for the application" (This annoying for apps that can have multiple windows like Safari).Check "Displays have separate Spaces."System Settings -> Mission ControlSecurityCheck "Require password 5 seconds after sleep or screen saver begins."System Settings -> Security & Privacy -> GeneralTurn On FileVault. (Using iMac hence didn't enable here).System Settings -> Security & Privacy -> FileVaultTurn On Firewall.System Settings -> Security & Privacy -> FirewallSpotlightNot a fan of Google searching against every local search.Uncheck "Siri Suggestions."System Settings -> Spotlight -> Search ResultsMenu bar:Uncheck "Show in Menu Bar" (Command + Space is easy enough).System Settings -> Dock & Menu Bar -> SpotlightSiriI'm personally not ready to talk to my computer yet.Uncheck "Enable Ask Siri."Uncheck "Show Siri in menu bar."System Settings -> SiriGeneralAppearance: "Auto" (Switches between Light & Dark depending on hour).Accent Color: "Multicolor."Highlight Color: "Accent Color."Sidebar icon size: "Large."System Settings -> GeneralTrackPadCheck "Secondary click": "Click or tap with two fingers."Check "Tap to click."System Settings -> Track Pad -> Point & ClickCheck "Scroll direction": "Natural."Check "Zoom in or out."Check "Smart zoom."Check "Rotate."System Settings -> Track Pad -> Scroll & ZoomUncheck "App Exposé."Check "Show Desktop."System Settings -> Track Pad -> More GesturesFinderView Options:Finder -> View -> Show View OptionsCheck "Always open in column view."Check "Browse in column view."Group By "None."Sort By "Name."Text Size: 16.Finder -> View -> Show View OptionsFinder Preferences:Uncheck "Hard disks.""New Finder windows show": "[Home Folder]."Uncheck "Open folders in tabs instead of new windows."Finder -> Command + , -> GeneralUncheck all tags (Folder organization for the win).Finder -> Command + , -> TagsUncheck "Recents."Uncheck "iCloud Drive."Uncheck "Recent Tags."Finder -> Command + , -> SidebarCheck "Show all filename extensions."Check "When performing a search": "Search the Current Folder" (Let Spotlight do hard drive searches).Finder -> Command + , -> AdvancedSidebar Favorites:Create 1:1 mapping of important folders placed in Home folder with Sidebar.That concludes my list! If you got comments, or think I missed a configuration, email me.'''
