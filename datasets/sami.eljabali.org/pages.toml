full_description = '''iTerm2 setup Sami Eljabali 14 Dec 2024 • 2 min read Photo by Pankaj Patel / Unsplash When it comes to terminals available to use on mac, developers do not have a shortage of options. One thing for sure is that the default terminal available on Mac OS is subpar. My terminal of choice is iTerm2, an open source popular terminal. Below is a demo of my humble configuration of iTerm2 in action: 0:00 /0:14 1× Highlights:Non-floating, sticky, transparent window.Fullscreen window stays within space.Ability to navigate & delete words using ⌥ & ⌘.To load all my above settings in one step, import my config file:General -> Settings -> "Import All Settings and Data..."iTerm2 StateiTerm2 State.itermexport6 KB.a{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5px;}download-circleDone 🎉Alternatively, below a step by step process.Configure fullscreen:General -> Window -> Uncheck "Native fullscreen windows"Tabs at the top:Profiles -> WindowStyle: "Full-Width Top of Screen"Check "Use transparency" while at itNatural keyboard mappingsProfiles -> Keys -> Key MappingsSelect "Natural Text Editing" under PresetsIn Sequoia 15.1.1, I had to make a tweak to get word deletion (⌥+delete) working:Double click "⌥<-delete" Action "Send Hex Code"Place "0x17"Larger textProfile -> Text -> Font "16"ThemeInstall Oh My Zsh shell.Update theme to ZSH_THEME="jonathan" in ~/.zshrcThat concludes my configurations. Thanks for reading!Discuss on HN. Theming: An Unsolved Design System Problem Because dark mode is on the rise, mobile apps must support themes, however how do we define them? 15 Dec 2021 8 min read How to securely manage online accounts Management of online accounts is burdensome in today's digital age, so I took a plunge and assembled for you best practices. 19 Sep 2021 4 min read How to publish a Java / Kotlin library to Jitpack Publishing a Java / Kotlin library to JitPack was not as easy as I thought, so in finally doing so, put together easy steps for you to follow. 07 Sep 2021 5 min read'''
