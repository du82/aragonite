["https://samirbharadwaj.com/blog/pen-drawings-for-sanity"]
title = "Pen Drawings For Sanity - Samir Bharadwaj"
description = "I started drawing more sketches very soon after my last session of pen drawings, within a few days in fact. I was in the mood. But after having looked at my last drawings, which were done with a fair amount of abandon, I started to think too much. The first drawing that followed (above) was […]"
full_description = "Pen Drawings For Sanity I started drawing more sketches very soon after my last session of pen drawings, within a few days in fact. I was in the mood. But after having looked at my last drawings, which were done with a fair amount of abandon, I started to think too much. The first drawing that followed (above) was stiff and over-done. Then I picked up another magazine for inspiration and tried again. This is what I got, after a lot of struggle and long slow sessions trying to get everything looking just right. I wasn’t even sure what to do with the rest of the page, so I left it alone and decided to come back to it later. That was over a month ago. Today, I needed to draw to maintain my sanity. When you feel overwhelmed by things, drawing is a great productive escape. So, I picked up the same magazine I had put down a month ago and started drawing very quickly. These are what I got. Except for the very first drawing in this post, all the images here were put together by looking at a single magazine. They are all collages, including the drawing of the couple, which is made of two different images that I thought went well together. Speed was my main aim here and I tried various thought processes along the way. The man in the jacket was draw by blindly rendering the details without paying attention to the over-all image. The couple were drawn trying to use as little as possible to express as much as was needed. And in the last one, things were distorted and stretched to fit the elements on the page, rather than to maintain proportions. The speed worked out well. All the three images drawn today were finished in little over an hour. If I keep this up, I might actually get somewhere with my drawing skills. I’m nowhere near making accurate likenesses, but I do think the images are becoming more interesting, which is what counts in the end. Samir This entry was posted in Illustration and tagged ball point pen, drawing warm up, inspiration, pen and ink, pen drawings, sketching,on July 14, 2009January 28, 2014. Bookmark the permalink."
