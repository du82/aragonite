title = "Illustration Archives - Samir Bharadwaj"
full_description = "Ballpoint Pen Drawings for Memory I first put up some ballpoint pen drawings on this site back in 2009, a whole two years after I started the site at this domain, but I had dabbled with sketching in pen before. I had forgotten how seriously I’d tried my hand at it until a few days ago, when I was flipping […] Posted on March 18, 2014 by Samir Bharadwaj Inkscape Illustrations of Indian Mythology In the beginning, the idea was a simple one, to make a useful site. I always have written quite a bit on this blog about blogging software, content management systems and building websites, information I think is useful to many and surprisingly elusive in the flood of technical information online. I wanted to give all […] Posted on February 27, 2013 by Samir Bharadwaj Vector Painting of an Elven Princess “How would you draw a face in Inkscape from scratch?”, is the question I was asked, so to demonstrate it, I started drawing a random face in Inkscape and this is what resulted over the following four days. This portrait of an elven princess turned out to be a good demonstration and also a good […] Posted on May 24, 2012 by Samir Bharadwaj Wood Nymph Drawing in Pen About a year ago, a friend saw my original fountain pen drawings of figures and wanted to take some off me to put on his wall. Those were done on regular A4 copy paper and done in regular school-grade blue ink, so I wasn’t too enthusiastic to part with them. I promised I’d do something […] Posted on April 21, 2012April 21, 2012 by Samir Bharadwaj Ink Pen Drawings of Human Figures My last bout of drawing with a pen resulted in a chance encounter with an old fountain pen from my school days. That led to a whole new fluidity of sketching as I tried my hand at a more hatching-heavy technique of drawing. After January was done and the new year began to sink in, […] Posted on March 21, 2011March 21, 2011 by Samir Bharadwaj Pen Drawings As Procrastination The last time I tried to draw seriously was well over a year ago, and I was drawing with a pen to clear my head. This time was no different. I have a few projects on my mind at the moment, including the ever-postponed redesign of this site, and just planning out the various aspects […] Posted on October 25, 2010October 25, 2010 by Samir Bharadwaj"
