title = "Writing Archives - Samir Bharadwaj"
full_description = "A Comic is Not a Film I‘ve been savouring some comics recently. You can insist on calling them graphic novels if you’re too scared to say ‘comic’, it makes no difference to the experience of reading one. The comic is a wonderfully rich medium. Some of what I am reading is decidedly mediocre, and some of it holds that meaty satisfaction […] Posted on November 11, 2016November 12, 2016 by Samir Bharadwaj Why are you writing for people who hate reading? Writing advice has changed over the centuries. In the beginning, which I’m arbitrarily choosing to be the invention of the modern novel, the audience was select and unusually literate. Writing advice at the time was very much about quality and the effect on the discerning reader. Let’s face it, when literacy is not a close-to-universal […] Posted on May 29, 2015 by Samir Bharadwaj How to calm your inner monologue in an unspecified number of confusing steps The easiest thing to write about is not writing. That is followed closely by wisdom about how to write. For the sake of ending my recent writing drought, I’m resorting to the former, with flourishes of the latter, if I still have it in me to pull off flourishes. We will see. I’ve had an […] Posted on May 23, 2015May 24, 2015 by Samir Bharadwaj How to Write a Well-Crafted Tweet Writing isn’t as much a matter of blind, unconscious expression, as most readers like to think. The best writing is considered, crafted and the result of much hard work and editing after the initial expression of ideas has passed and been found wanting. There are the lucky breaks of good first-drafts and the even more […] Posted on January 7, 2014January 7, 2014 by Samir Bharadwaj Evolving Your Writing Voice When the first sea-creatures braved the shores of a primitive Earth and pulled themselves on to dry land, their attempts were probably not the prettiest thing to look at. They were still getting to grips with, and even inventing, the basic mechanics of locomotion with rudimentary limbs in the open air. They were aeons away […] Posted on February 16, 2013 by Samir Bharadwaj"
