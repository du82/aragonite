title = "Creative Ideas Archives - Samir Bharadwaj"
full_description = "This is Why Insecure People Don’t Ask for My Creative Help I‘m not a social butterfly, but I know enough people closely enough who know what I do, and know some of what I’m capable of. Most of these people rarely ask for my help. Now, I’m the master of not asking people about things (sometimes) and figuring them out in my own way, but I’m […] Posted on August 12, 2017August 19, 2017 by Samir Bharadwaj 3 Most Dangerous Idiots Who Creative People Must Endure Have you ever considered this weird paradox of human nature? The urge to make and build things at once defines us and makes us human, while also being the most discouraged activity on both social and individual levels. We like to think of a past golden age when we all, or at least most of […] Posted on November 16, 2016 by Samir Bharadwaj It’s Sexier To Follow Than To Fumble We like to think we celebrate the brave and original thinkers and doers, but in truth we lionise the ones who follow in the footsteps of many and do something we’re comfortable with. People who we say are “doing very well” are usually the most entrenched in some system, whether corporate, social, or some personal […] Posted on August 10, 2016August 20, 2016 by Samir Bharadwaj The Long Road From Creator to Creative All creators are not born equal and they certainly don’t think or work equal. In those differences lie the keys to true creativity, because what they don’t tell you in the cool places where they promise to sell you your new “creative” lifestyle, is that true creativity involves a lot of thinking and working. Posted on June 23, 2016 by Samir Bharadwaj Wishing Obscurity Upon the Solemn Juvenile It takes all types to make the world, but some types you just don’t like. Some types appear to not be as useful in the grander scheme, adding more to the chaos than helping build anything. I personally find the solemn juvenile to be quite the unsavoury type. Posted on March 1, 2014February 14, 2015 by Samir Bharadwaj"
