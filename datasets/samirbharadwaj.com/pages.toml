title = "Travel Journal Archives - Samir Bharadwaj"
full_description = "Familiar Treats in Unfamiliar Places Quirky facts become anecdote and eventually settle into legend. Among Indians of a certain age-group, such is the status of tour groups of middle-aged Indian couples, and families, that go on European holidays with the express comfort of knowing their tour-provider will arrange for familiar Indian food, and in some cases strictly prepared Indian food […] Posted on December 3, 2012December 3, 2012 by Samir Bharadwaj Improvised Spinach Sauté With Potatoes It’s been years since I’ve done anything resembling actual food preparation. Not that I’m a klutz in the kitchen or ignorant about the secret ways of the pot and the pan, but I’ve simply not found the necessity nor have had the specific inclination. Holidays, however, are meant to put you in new situations and […] Posted on September 17, 2012 by Samir Bharadwaj Bengaluru Bits When you visit an un-familiar place, and that too on a tight schedule, you try to pack in as much as is possible into the time you have. This means hitting the spots you’re interested in seeing, and darting between them as fast as you can, while sqeezing in the necessities of sleep and food. […] Posted on January 13, 2010January 28, 2014 by Samir Bharadwaj Climbing Rocks at Turhalli After our day at Nandi Hills and a bit of driving around Bangalore, we thought we were done. Set to leave the following afternoon, we had little to do on the one Sunday morning that remained, besides relax, spend some time with the family, and say our goodbyes. The evening before, we were sitting around […] Posted on January 11, 2010January 28, 2014 by Samir Bharadwaj Nandi Hills Memories The day after our quick trip to Lal Bagh was our only full day in Bengaluru, so we decided to explore further afield. That morning we set off for that ubiquitous bastion of Bangalore city tourism, Nandi Hills. Nandi Hills is a small mountain away from the city which is a popular weekend visit amongst […] Posted on January 9, 2