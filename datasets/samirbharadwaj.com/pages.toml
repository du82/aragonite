["https://samirbharadwaj.com/blog/im-back-and-my-dog-ate-my-homework"]
title = "I'm Back and My Dog Ate My Homework - Samir Bharadwaj"
description = "I really need to learn to take my own advice about getting things done. Wait! Hold the presses, I see a new post in this: “How to Take Your Own Advice in 13 Easy Steps”. Brilliant! Absolutely brilliant. I dazzle myself sometimes. I’ve been back in Dubai from my trip to Bombay for a good […]"
full_description = "I’m Back and My Dog Ate My Homework I really need to learn to take my own advice about getting things done. Wait! Hold the presses, I see a new post in this: “How to Take Your Own Advice in 13 Easy Steps”. Brilliant! Absolutely brilliant. I dazzle myself sometimes. I’ve been back in Dubai from my trip to Bombay for a good many days now. Every since then I have been planning on my grand comeback post. I’m guessing you have gotten to the realisation that I haven’t written it yet. The task of writing that perfect and (in my mind) ever growing post finally seemed so improbable that I decided to just get it over with and write the afterword of sorts that I had planned for that post. In short, I wanted to inform all you wonderful people out there that I’m back. As some of you have mentioned, I do plan on writing much more about my trip and various things about India. It’s quite an inspirational place really, and it always fills me with a million good ideas. Unfortunately my trips there rarely give me time for relaxed writing stints, and once I’m back here and do have the time, the buzz of India isn’t there to spur me on any more. Purely an excuse, I know, but true none the less. What life in Dubai is sorely in need of, is life. But write we must, because what else is there? So, once I mange to kick myself out of my hibernating huddle I plan, nay, I promise to write a whole bunch of articles about the trip and the many days I was silent. My story of a bus ride still remains to be continued and completed. Besides that one, I will also be writing these: The Perils and Promise of the Great Indian Binge Manifesto of a Social Malcontent What You Can Learn By Staking Out a Small Bank Memories Incorporated … and perhaps even others that I haven’t named or planned yet. Hopefully, I can do more than just recap throughout the coming weeks and also slot in some fresh content. Stay tuned! It’s strange how much fun writing can be (as it is now while I type this), and also how completely (but secretly) scared you can be to start, to commit, to write the first sentence. But write we must, because what else is there? Samir This entry was posted in Rambling and tagged bombay, india, inspiration, living in dubai,on February 18, 2008February 22, 2017. Bookmark the permalink."
