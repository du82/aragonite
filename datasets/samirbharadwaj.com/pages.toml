["https://samirbharadwaj.com/now"]
title = "What I’m doing now - Samir Bharadwaj"
description = "I'm focusing on building my own projects, learning and practicing skills that are dear to me and growing towards bigger things."
full_description = "What I’m doing now I’m in Mumbai, working on my own projects, and advising and helping a few clients and partners build good things. Currently focused on on these: technology & interaction for cultural institutions Over the past several years, my work has veered toward lending my expertise in technology and communication to cultural organisations. I have much to say about those projects and the field in general. Content Deliverance will be gradually converted into a vessel to hold case studies, techniques and thoughts on tech and communication for museums, art spaces and other science and culture spaces. paper art My activities in the realm of paper art as Papernautic have grown significantly over the past several years. That site has been revamped and the YouTube channel is now in the process of being revived with new visuals and videos. stationery love & histories Producing videos, for the now not-so-new collaboration that is Inky Memo. I started this several years ago with Minjal Kadakia. Along with Vishal Bharadwaj, we’ve also produced a stationery review show with over 50 episodes and continuing. Check out the site and the Youtube channel. design thinking & thinking about creativity Rebuilding this website from scratch and re-focusing it to be my general thoughts of design thinking. See existing articles which are all due for a refresh at the blog. That’s what I’m working on at the moment. I’m only taking on design or development work if I have skin in the game, and ideally in an advisory capacity. Get in touch if you have something like this in mind. I’m also glad to answer messages from friendly online strangers with interesting questions, this is how I met some of my closest friends, so feel free to drop me a message. I will update this page as things progress and move. Last update was May 2024. Samir Like all good ideas, the one for this page was borrowed from someone who had it first and more clearly. In this case, Derek Sivers"
