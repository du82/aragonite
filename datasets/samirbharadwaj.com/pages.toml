full_description = "Carnivale! December 04 2007 A couple of weeks ago I submitted the first article in my series on personality in blogging titled The Face That Launched a Thousand Ships to a few blog carnivals. Since then the post has been included in some carnivals. I’d like to thank the bloggers for the link love and pay them back in kind, so here goes: Diana Bajenaru of 134u.com linked to it in the 1st edition of the Resource for Bloggers Carnival. Sandra of Free Cash Quest linked to it in the 11th edition of the Free Cash & Making Money Online Carnival. Satish Talim of Blog Me Cash linked to it in the 11th edition of the Blog Me Cash Carnival. Tommy Smith of Online Income Project linked to it in the November 19, 2007 edition of the Carnival of Online Income. Liz Fuller of More Than We Know linked to it in the edition #27 of the Carnival of Small Business Issues. Anthony of The Lives and Times… of Anthony McCune linked to it in the the first Surfer’s Paradise HULLABALOO! Carnival. Butanido of Butanido-Autoblog linked to it in the November 27, 2007 edition of the Blog to Earn Carnival. John W. Furst of E-biz Booster Blog linked to it in the December 03, 2007 edition of the Webmaster Articles Carnival. Thank you all! Samir This entry was posted in Building a Website and tagged blog carnival, Blogging, individuality,on December 4, 2007May 6, 2014. Bookmark the permalink. Diana13 says: December 18, 2007 at 2:56 am Hi there! Thanks for your link. And I really am Diana Bajenaru 🙂 Reply Samir Bharadwaj says: December 18, 2007 at 10:39 am You’re welcome Diana. Extremely sorry about the typo, it is now fixed. Reply"
