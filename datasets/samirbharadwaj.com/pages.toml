seen tweaks and adjustments required as this project progresses. The hair has been made a little translucent, and specularity and translucency are set to vary between the fringes of the object and it’s central surfaces, using a gradient/blend texture to provide the template for the […] Posted on July 2, 2004January 27, 2014 by Samir Bharadwaj"
