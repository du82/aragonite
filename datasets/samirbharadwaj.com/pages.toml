["https://samirbharadwaj.com/blog"]
title = "Samir's Creative Ideas & Online Enterprise Blog - Samir Bharadwaj"
description = "“I‘m not one to judge …” is the biggest lie in human life. We are walking, talking judgement machines, and to be fair it has its benefits for our survival. Judgement helps us read situations and avoid those that might be harmful to us, but having the ability is a different beast from exercising it […]"
full_description = "Pointing Out Their Shortcomings Won’t Fix You “I‘m not one to judge …” is the biggest lie in human life. We are walking, talking judgement machines, and to be fair it has its benefits for our survival. Judgement helps us read situations and avoid those that might be harmful to us, but having the ability is a different beast from exercising it and communicating it every chance you get. Society goes through cycles in this regard, but we are currently in a state of constant and heightened public judgement. This is largely because the means now exist for individuals to raise their voice in judgement and be joined in it by the mob, free of traditional divides, geographical distances, and in some cases, even similar opinions on a broad range of things. We now latch on to the one microscopic argument placed before us and join into the virtual roar of dissenting voices without any real thought or consideration. The one thing that hasn’t changed, is that the most damaging voices calling people out on their character defects are confident in the belief that their belief will lead to the true enlightenment and salvation of the world from past evils. As always, as in every witch hunt in human history, the shortcomings of others are mostly called out by the morally superior and righteous of the time. Continue reading → Posted on August 31, 2017August 31, 2017 by Samir Bharadwaj in Life Lessons Are You an Ostrich or a Swan? Like all boring, old-school, heterosexual-coupling-based family units, I have the expected two sides of my extended tribe. I have my mother’s and my father’s sides of the family, who I have grown up observing, engaging, absorbing, cringing at, appreciating, being horrified by and loving throughout my life. Most family issues, or even harmless ticks, come down to communication, or more often a lack of it. A recent frivolous exchange about unsure travel plans on both sides of my family led me to wondering if the two sides of my family had a pattern to their idiosyncrasies. As my mind wandered, it suddenly occurred to me that one side were ostriches and the other were swans. Continue reading → Posted on August 23, 2017 by Samir Bharadwaj in Life Lessons"
