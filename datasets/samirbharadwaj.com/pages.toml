title = "Improvised Spinach Sauté With Potatoes - Samir Bharadwaj"
description = "It’s been years since I’ve done anything resembling actual food preparation. Not that I’m a klutz in the kitchen or ignorant about the secret ways of the pot and the pan, but I’ve simply not found the necessity nor have had the specific inclination. Holidays, however, are meant to put you in new situations and […]"
full_description = "Improvised Spinach Sauté With Potatoes It’s been years since I’ve done anything resembling actual food preparation. Not that I’m a klutz in the kitchen or ignorant about the secret ways of the pot and the pan, but I’ve simply not found the necessity nor have had the specific inclination. Holidays, however, are meant to put you in new situations and so tonight I found myself in possession of two bundles of spinach, limited additional ingredients, and the need to concoct some form of dinner. This sautéed spinach with potato mix is what resulted. Nothing too complex, rudimentary, in fact. A bit of oil heated in a broad saucepan. Cumin seeds (jeera) added to sputter. A pinch of sugar to help in the browning of the potatoes added in small pieces. After that it was a matter of adding what was available, salt, some turmeric powder (haldi), a few slivers of fresh ginger, and then finally when the potatoes were sufficiently brown, a healthy dose of the spinach, cut into rough pieces. A very little water to help it along once the leaves had reduced, and some chaat masala and a pinch of amchur to add some flavour. Worked out very well, mostly because the potatoes were well cooked without being reduced to mush. It would have been better with onions, and some fresh garlic, but considering it was improvised from what was available, a flavourful success. Samir This entry was posted in Travel Journal and tagged food preparation,on September 17, 2012. Bookmark the permalink. Sujata says: October 23, 2012 at 8:59 pm hey…..if u claim to be so handy in the kitchen…..keep the recipes coming 🙂 Reply Samir Bharadwaj says: November 4, 2012 at 1:44 pm Sujata, I claim no such thing. 🙂 I merely manage, and can survive in a kitchen if thrown in there. But if more cooking adventures ensue, I’ll be sure to write about them here. Reply Radhika says: November 9, 2012 at 11:38 am You can cook an impromptu sabzi? I can’t cook an impromptu Maggi! But that’s the magic of indian cuisine, right? I mean, the right spices and a basic idea of what you want it to taste like, and lo- you have khaana ready! Since you’re quite a keen blogger, I was hoping that you’d want to be part of the India Is Global Photography Challenge 2012. All you need to do is go through http://www.indiais.org and blog about it. By doing so, in words or pictures, you’ll help our team map India visually- through your experiences! Add the essence of what you feel about India, let your readers know about this global initiative and help us showcase India at its best! Of course it’s got its benefits, like India Is goodie bags! Do participate in this initiative, and claim yours. Looking forward to you joining us! Reply"
