mals go, human beings are not particularly unique. There are other creatures with considerable brain power, there are others that have a fair amount of dexterity, and there are many others that surpass us on every level of physical strength and prowess. One thing that does make us different from the rest, is our […] Posted on June 22, 2010June 22, 2010 by Samir Bharadwaj"
