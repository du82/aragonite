our apartment was still, when we walked in after our month long trip to India. The luggage was dropped on the floor, the footwear was discarded in neat bachelor stacks, and I walked up to the window to pull apart the white curtains. There on the narrow window sill, a mostly leafless […] Posted on October 18, 2010October 18, 2010 by Samir Bharadwaj"
