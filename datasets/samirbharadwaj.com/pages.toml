title = "Life Lessons Archives - Samir Bharadwaj"
full_description = "Pointing Out Their Shortcomings Won’t Fix You “I‘m not one to judge …” is the biggest lie in human life. We are walking, talking judgement machines, and to be fair it has its benefits for our survival. Judgement helps us read situations and avoid those that might be harmful to us, but having the ability is a different beast from exercising it […] Posted on August 31, 2017August 31, 2017 by Samir Bharadwaj Are You an Ostrich or a Swan? Like all boring, old-school, heterosexual-coupling-based family units, I have the expected two sides of my extended tribe. I have my mother’s and my father’s sides of the family, who I have grown up observing, engaging, absorbing, cringing at, appreciating, being horrified by and loving throughout my life. Most family issues, or even harmless ticks, come […] Posted on August 23, 2017 by Samir Bharadwaj The Mythical 2-3 Exemplary People What is it about 2-to-3 people? I wrote a while ago about the precious people in my life who meet me half way. When I looked closer at it, I realised that I knew only 2-3 such dear specimens. At various points I’ve also written about the clients I’ve worked with. In the technical and […] Posted on August 9, 2017 by Samir Bharadwaj Nothing is Easy. Everything isn’t Suffering. I have a bone to pick with marketing gurus. Which, let’s face it, is all of us at this moment in history. Every one of us with a platform to speak our minds is trying to sell something. We’ve been taught that this is the thing to do with an audience. Sell them things, whether […] Posted on August 1, 2017August 1, 2017 by Samir Bharadwaj What’s Stopping You From Doing What (or Whom) You Love? Love is a complex, wonderful thing. If you aren’t too stuck on pigeon-holed definitions, you will admit to yourself that the emotion is not as rationed and militaristically single-minded as you are sold by the powers that be. The ‘powers that be’ being Society, a nebulous term for our collective nebulous insecurities. It’s safe to […] Posted on September 27, 2016September 27, 2016 by Samir Bharadwaj"
