description = "I‘ve been savouring some comics recently. You can insist on calling them graphic novels if you’re too scared to say ‘comic’, it makes no difference to the experience of reading one. The comic is a wonderfully rich medium. Some of what I am reading is decidedly mediocre, and some of it holds that meaty satisfaction […]"
full_description = "A Comic is Not a Film I‘ve been savouring some comics recently. You can insist on calling them graphic novels if you’re too scared to say ‘comic’, it makes no difference to the experience of reading one. The comic is a wonderfully rich medium. Some of what I am reading is decidedly mediocre, and some of it holds that meaty satisfaction that you find in well-crafted fiction of longer lengths, the kind that never attempts startling remarkableness, but is made more satisfying for being bathed in solid craft without the gold leaf. I’ve come to appreciate that to understand the marvel that is the comic and what makes the best ones work, you must take into consideration two aspects of its existence: How the comic is placed in the history of storytelling, and how it is truly experienced by the reader in the most minute of details of perception and process. Continue reading → Posted on November 11, 2016November 12, 2016 by Samir Bharadwaj in Writing Gratefulness and Letting Go Not all spring cleaning happens in the spring but eventually it must happen. The Hindu festival of Diwali, one of light and beginnings, is traditionally when many households do their spring cleaning, though it doesn’t occur in spring. Diwali happens in the later part of the year when the tropical heat of the subcontinent takes a turn towards a milder temperament. These cooler climes at the year’s end is when many Indian festivals light up the night, and homes and those in them clean-up, take stock and start anew. There is a certain element of archaeology involved in cleaning or reorganising a long-running home. While sorting through messages or notebook pages is an effective glimpse into your recent past and thoughts, digging into the layers of accumulated life in your home is a bitter-sweet and sometimes startling history lesson. Continue reading → Posted on November 6, 2016November 11, 2016 by Samir Bharadwaj in Life Lessons What’s Stopping You From Doing What (or Whom) You Love? Love is a complex, wonderful thing. If you aren’t too stuck on pigeon-holed definitions, you will admit to yourself that the emotion is not as rationed and militaristically single-minded as you are sold by the powers that be. The ‘powers that be’ being Society, a nebulous term for our collective nebulous insecurities. It’s safe to say that whether you’re comfortable admitting it or not, you love many things. It is also safe to say that in most cases, you haven’t done anything about it. Continue reading → Posted on September 27, 2016September 27, 2016 by Samir Bharadwaj in Life Lessons"
