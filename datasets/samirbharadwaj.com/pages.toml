full_description = "In Praise of Subjective Writing Of all the much touted maxims of modern society and intellectual thought, things like separation of church and state, equality and equal opportunity for all and the like, the one I think is the most artificial construct is detached, unbiased and impersonal reporting. There is a prevailing falsehood about the effect of personal bias on […] Posted on November 1, 2011 by Samir Bharadwaj The Gates of Eden by Brian Stableford – book review Like much of my fiction reading, The Gates of Eden (1983) by Brian Stableford was picked up in a bargain bin, where all the strangest treasures are to be discovered, this one in a second-hand book store. The cover art by Doughlas Chaffee showed an auburn-haired beauty standing handsomely holding a spacesuit in an alien […] Posted on August 12, 2011 by Samir Bharadwaj The Bibliophile and the Writer For writers, bookshops are a double-edged sword. On the one hand, you were probably first inspired to have writing ambitions somewhere in a bookshop, surrounded by the wonder of words; On the other hand, bookshops and the books in them can be the greatest obstacle to writing that was ever conceived. Posted on June 21, 2011June 20, 2011 by Samir Bharadwaj Observing People At the Mall People watching is a common pastime; As a social species, it is instinctive. If you’re a writer, however, it can be the difference between flat featureless prose, and descriptions people can fall in love with. Being a keen observer of people gives you insights into human behaviour which are invaluable, whether you are a writer […] Posted on April 26, 2011April 26, 2011 by Samir Bharadwaj See Also … Writing is an important activity in the human pantheon of activities. We often ascribe this importance to the fact that human society works on the sharing and passing on of ideas to those who will come after us, or in the case of today’s magnificently connected world, those who are our peers in distant and […] Posted on March 5, 2011 by Samir Bharadwaj"
