title = "Pug v3.0.2 RCE (CVE-2024-36361)"
description = "samuzora's blog - ctf stuff and more"
full_description = '''This is the story of how I almost made a zero-day for a CTF challenge, and how it subsequently became my first-ever CVE, CVE-2024-36361. It was just slightly more than 2 weeks before HACK@AC 2024. I had spent most of my time fixing the CTF platform and making sure it was ready for the competition, and was desperate for a more difficult web chall (the hardest we had was a Docker internal network SSRF challenge - and we had about 5 easy ones at that point). I preferably wanted something with RCE too, since all the other challs weren’t RCE. Passing user input into the options object of JS templating engines has always had a super large attack surface, which makes it really fun to exploit. I first took a look at EJS, but after a while changed my mind because it was overdone and also fairly well-patched. Then I took a look at Pug, which I haven’t really seen many novel exploits for besides the pretty exploit. To find something new and that didn’t have a PoC online that participants could just copy to cheese the challenge, I had to read the source code very carefully. Anytime Pug is compiled to JavaScript, the Pug source is eventually passed to Compiler.compile through generateCode: Because of this, most of the potential injections will occur in the Compiler class, so I had to read it extra carefully. In Compiler.compile, the first option that I found that was injected so-called unsafely was options.includeSources: All I need to do is to make options.compileDebug something other than false, and also supply options.includeSources to escape the pug_debug_sources variable, getting my RCE! options.includeSources is set to a boolean value, so I can’t put arbitrary code in it, killing my exploit idea completely. Disappointed, but still faced with the very real need to make a challenge before the deadline, I continued reading the code. Then, this next line caught my attention: If we can set options.templateName, we can possibly change it to something containing spaces or other characters that don’t form a valid JS identifier and can break the parsing. For example, if templateName is "asdf(){}; console.log('hi'); //", then the compiled code would be'''
