["https://samuzora.com/posts/hackac-2024-anshin"]
title = "HACK@AC 2024 - 安心 Impact!"
description = "samuzora's blog - ctf stuff and more"
full_description = "When writing this challenge, I wanted to create a more subtle heap challenge than the usual “notepad” kind of challenge. At the same time, I wanted to make it more fun by incorporating a game into it, quite similar to RPS 2.0. So I decided to create a Genshin Impact clone just for fun :) Source code is provided in the repo. Its pretty long so I’ll only analyze the important functions here. In the main loop, we can do the following actions: Enter Level, Purchase Item, View Inventory or Use Item. The level isn’t so important as we just need sufficient coins to brew items. In the shop, we can brew custom potions and assign it a name. The potions are stored using malloc(len), where len is the length returned by the read_str function. We can rebrew potions which is just editing the data stored in the chunk. We also have a wishing well that just does malloc(0) and stores it in the inventory. This will be important later on. When we use a potion, the data in the potion is read to see what effects it can give according to some preset potions, and subsequently it is freed. Following best practices, the pointer to it is also set to NULL. So secure! We see in the above read_str function an off-by-one vulnerability! The len field is used to specify how many characters to read. However, the loop actually reads len + 1 characters, which makes it vulnerable. This can be exploited in the potion rebrewing functionality, since length is determined by the length of user input earlier during brewing. Let’s say we input a potion of name length 0x18. The chunk would be Thus, we have control over the size field of the adjacent chunk. From here, we can use the well-known House of Einherjar to proceed. As we know, the size field contains some metadata in the smallest nibble. We see what flags it corresponds to in libc source code: So a change of size from 0x101 to 0x100 will unset the PREV_INUSE flag. This flag is referenced when freeing an unsorted-sized chunk. So we see it consolidates the chunk with the previous (supposedly freed) chunk, by reading the prev_size field, which according to freed chunk structure, is the address just before the size field."
