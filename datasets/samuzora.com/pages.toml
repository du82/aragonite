["https://samuzora.com/posts/cve-2024-40453"]
title = "Squirrelly v9.0.0 RCE (CVE-2024-40453)"
description = "samuzora's blog - ctf stuff and more"
full_description = 'When looking through the Squirrelly source code, OwOverflow pointed out this segment of code in src/compile-string.ts to me: After following the complete function call chain (render -> handleCache -> compile -> compileString), I found that the env.varName parameter is indeed not sanitized. At first glance, this seems like an easy way to inject arbitrary JS and get RCE server-side. In order to get this exploit to work, the attacker should set env.useWith so that env.varName is injected. The with expression is an almost-deprecated Javascript feature that allows you to execute a block of code, appending an object to the global scope chain. This is demonstrated below: However, what is important is that we can inject an arbitrary expression into the with argument. This can easily allow us to get RCE! A simple payload would be: What does this mean? Searching for the error message, we can see the error being raised at src/compile.ts:44: The options.varName parameter is being passed to the ctor function (which is just a Function constructor). The Function constructor takes in n+1 arguments, where the first n arguments are parameters of the function to be created, and the last argument is the function body. That’s what’s causing our error, since we’re passing console.log("x") into the parameter field. This means our injection occurs in the first parameter of the new function being created, and should be a valid JS expression that can be passed in a parameter declaration. And our payload should still execute as per normal in the with expression. This is done through object destructuring. It’s quite flexible and also allows for default values to be set: This is the vector for our RCE. When setting the default value, the expression has to be evaluated, which we can use for RCE. Something like this should work: However, there’s a small problem - our payload is also being injected in the with expression, and this syntax is invalid there since it’s not a valid object initializer.'
