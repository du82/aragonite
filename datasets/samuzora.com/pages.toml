["https://samuzora.com/posts/sekai-2024"]
title = "Sekai CTF 2024"
description = "samuzora's blog - ctf stuff and more"
full_description = "I played with slight_smile and got 11th place, way higher than I expected given the overall difficulty of the challenges. We were just slightly below 10th place (in fact, near the end we kept swapping positions with Black Bauhinia because of dynamic scoring) All the pwns were really cool and I had a lot of fun solving them. These are my writeups for pwn/nolibc, pwn/speedpwn, and pwn/life-sim-2 (unfortunately windows kernel and v8 0-day are just slightly out of my skill level) The challenge binary was statically linked with a custom malloc/free implementation. No source was provided, so we gotta do a bit of reversing :( We can create a user with a username and password. Upon creation, a large chunk in the heap is allocated for the user’s data, and a pointer to this is stored in the global array. state[4] stores the number of created strings. We can create a string with a certain length between 0x0 and 0x100. The string is created with malloc(size + 1), and we can write size + 1 bytes to it. Note that the malloc implementation is custom which we’ll look at later. After the string is created, a pointer to it is appended to the user’s data, and the string count is incremented. Similarly, we can delete a string at a given index. After the string is freed, any pointers after the deleted string are shifted back by 1, and the string count is decremented. My first thought was to use save_strings_to_file to overflow the heap (since there’s no actual check on the total length of the chunk data being copied into the 0x7fff size chunk). Let’s first analyze the malloc and free implementations. This malloc is quite a simple implementation that only has 1 freed list, sorted by increasing size. This is the shape of a chunk allocated with malloc: The program stores a pointer to the smallest freed chunk as the list head, and cycles through the list until a chunk with size greater than or equal to requested size is found, eventually reaching the forest chunk. If even the forest chunk is too small to service the request, malloc will return 0."
