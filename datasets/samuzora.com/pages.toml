["https://samuzora.com/posts/siebersec-2023"]
title = "Sieberrsec 4.0"
description = "samuzora's blog - ctf stuff and more"
full_description = "This is a challenge from Sieberrsec 4.0. I thought it was a pretty good challenge that taught me how to properly use gdb for pwn. For this challenge, source and Dockerfile was given. Since I had the Dockerfile, the first thing I did was to locate and copy the libc to my host. I wanted to patch the binary using pwninit so that my environment was as similar to remote as possible, but the patcher strangely couldn’t detect the libc version, which means our linker couldn’t be automatically resolved and downloaded. On first reading through the source, I immediately spotted the format string vuln that is only triggered if a crewmate is killed. It passes my name (by default “Impostor”) into printf directly. However, there’s no built-in way to control this value. From this I identified another vuln - strncat doesn’t check the length of input! This allows me to overflow out of input, into name. Hence, this is how I’ll control name to exploit the FSB. Since I probably needed to leak some values first, I set a breakpoint at the vulnerable printf to examine the stack at the point of FSB: So, the plan is to leak these 2 addresses via FSB, and then on a second write, control the value at the 1st address which would give me my RCE. :) (ps. actually, leaking the 1st address isn’t necessary - the author made it such that the 2nd last byte of main and vent are always the same regardless of PIE, and PIE doesn’t affect the last 3 nibbles. So PIE is irrelevant in this case.) While experimenting with the binary, I also figured out how to fill up the input buffer so that I would land exactly at the start of name. However, for subsequent overflows after the first time we call printf, we need 11 more characters since “Dummy input” is no longer there. Back to the FSB - how can I determine the offsets to leak values from? Well, looking at the stack, “pink” should be at offset 8, and $rbp (the value we want to leak) at offset 12. I confirmed this by testing out offset 12, and true enough the expected value is there."
