["https://samuzora.com/posts/grey-finals-2024"]
title = "GreyCTF Finals 2024"
description = "samuzora's blog - ctf stuff and more"
full_description = "In late July, I played GreyCTF 2024 Finals with slight_smile and got 1st place by a really small margin of 29 points! The challenge archive can be found at https://github.com/NUSGreyhats/greyctf24-challs-public/tree/main/finals. Everyone rekt the Blob Runner so hard in Greyhats Welcome CTF 2023, I made sure to make it extra secure this time ;) The challenge reads shellcode into an mmaped region at 0x1337000, and then removes write perms on this region. Before jumping to the shellcode, it runs the shellcode through a blacklist: Actually, the comparison for int 0x80 doesn’t work since char is signed but the comparison is unsigned. I tried this for a while but soon realized that the following seccomp not only specifies syscall type, but also architecture (x64): The organizers also took a pic of me thinking I was very smart and showing the “unintended” to Elma :( All registers are set to 0, presumably to prevent libc or pie leaks. But if we run it in gdb, we actually see the following: In fact, the fs_base register hasn’t been cleared out and contains a libc address. This points to the fs struct which stores certain important values like canary or the key for PTR_MANGLE. To get this value in our shellcode, we can simply mov $register, fs_base and manipulate it from there. Writing challenges are too hard… so I wrote a program in 2 lines of code for you to pwn :/ I can even tell you that there is an obvious buffer overflow there, should be simple right? However, we have no syscall gadget here, so SROP is out of the question. Partial RELRO is also a good sign as we can fake resolve libc functions (I don’t think ret2dlresolve is possible on full RELRO?). In ret2dlresolve, we need to fake 3 structs: STRTAB, SYMTAB, and JMPREL. These 3 structs are placed at an offset from corresponding sections, and they are identified through indexes from the start of the section. The addresses of these sections can be found using readelf: For example, in the actual resolving of fgets, this is the helper function that is placed in GOT and called:"
