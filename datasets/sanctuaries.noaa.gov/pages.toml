["https://sanctuaries.noaa.gov/mallows-potomac"]
title = "Mallows Bay-Potomac River | National Marine Sanctuaries"
description = "Mallows Bay-Potomac River is a 18 square mile area of the tidal Potomac River adjacent to Charles County. The site was proposed to NOAA with broad-based community support to protect and celebrate the nation's maritime cultural heritage while expanding recreational, tourism, education, and economic development opportunities."
full_description = '''Mallows Bay-Potomac River National Marine Sanctuary Mallows Bay-Potomac River Home Visit Overview Directions Weather & Water Info Trail Signs Get Involved Overview Advisory Council Events & Volunteering Science Overview Ecology Research & Monitoring Community Science Learn Overview Education Shipwrecks Indigenous History & Culture Ocean Guardian Diving with a Purpose Multimedia News Latest News News Archive Accomplishments About Overview Management Plan & Designation Partners Contact ONMS Mallows Bay-Potomac River Mallows Bay-Potomac River National Marine Sanctuary protects and interprets the remnants of more than 100 World War I-era wooden steamships - known as the "Ghost Fleet." The best way to see this national treasure is by kayak but check out today's new Sanctuaries 360 video and explore the Ghost Fleet without ever getting your feet wet! Visit Photo: Matt McIntosh/NOAA Whether you are walking the shore or paddling through history, the Ghost Fleet is your gateway to recreation and educational opportunities. Maritime and Cultural Heritage Please contact the Piscataway Tribal Council to request authorization prior to using or reproducing this image. Photo: Matt McIntosh/NOAA Beyond the Ghost Fleet, the area’s history includes connections to the Revolutionary War and the Civil War. In addition, it has a rich heritage of commercial fishing, the military, the Piscataway Indian Nation and the Piscataway Conoy Tribe of Maryland, as well as the Patawomeck Indian Tribe of Virginia. Its significance is recognized by the national Register of Historic Places and it is listed as a National Treasure by the National Trust for Historic Preservation. It is a part of the Southern Maryland National Heritage Area. Get Involved: A Partnership with Community Photo: Kate Thompson /NOAA Community partnership is a hallmark of every national marine sanctuary. Communities actively participate to inform and evolve sanctuary management objectives and to enable partnerships that benefit sanctuary resources and the community itself. Volunteer networks, citizen science, and advisory councils are among the opportunities available to learn and share information about the sanctuary and promote stewardship of its resources. Volunteers Make a Difference All national marine sanctuaries rely on the energy and passion of volunteers. Force Blue is a volunteer organization that unites two worlds by helping veterans and helping the environment. A team from Force Blue volunteered to conduct an initial survey of the subaquatic vegetation in Mallows Bay-Potomac River National Marine Sanctuary. The data that they collected provides much needed information on the various species and the health of the sanctuary.'''
year_published = 2025
clearnet = "https://sanctuaries.noaa.gov/mallows-potomac"
