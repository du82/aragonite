["https://sanctuaries.noaa.gov/about"]
title = "About | Office of National Marine Sanctuaries"
description = "NOAA's Office of National Marine Sanctuaries serves as the trustee for a network of underwater parks encompassing more than 629,000 square miles of marine and Great Lakes waters. The network includes a system of 17 national marine sanctuaries and Papahānaumokuākea and Rose Atoll marine national monuments."
full_description = "NOAA's Office of National Marine Sanctuaries serves as the trustee for a network of underwater parks encompassing more than 629,000 square miles of marine and Great Lakes waters. The network includes a system of 18 national marine sanctuaries and Papahānaumokuākea and Rose Atoll marine national monuments. Few places on the planet can compete with the diversity of the National Marine Sanctuary System, which protects America's most iconic natural and cultural marine resources. The system works with diverse partners and stakeholders to promote responsible, sustainable ocean uses that ensure the health of our most valued ocean places. A healthy ocean is the basis for thriving recreation, tourism, and commercial activities that drive coastal economies. The Office of National Marine Sanctuaries also leads the National Marine Protected Areas Center, the nation's hub for building innovative partnerships and tools to protect our special ocean. Staff at your national marine sanctuaries are hard at work every day collaborating with partners on conservation initiatives, research and monitoring projects, education and outreach, community engagement, responsible recreation and tourism, cooperative resource management, and socioeconomic considerations. The U.S. National Marine Sanctuary System covers over 620,000 square miles of marine and Great Lakes waters from American Samoa to Massachusetts, to the Florida Keys. Learn about the different regional offices and the sanctuaries each one manages. From restaurants and hotels, to aquariums and kayak operators, the success of many businesses, millions of dollars in sales, and thousands of jobs, directly depend on thriving national marine sanctuaries. National marine sanctuary advisory councils are community-based advisory groups established to provide advice and recommendations to the sanctuary superintendents on issues including management, science, service, and stewardship. The National Marine Sanctuary System encompasses some of America's most iconic natural, cultural and historical marine resources in the ocean and Great Lakes."
