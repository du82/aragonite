description = "Featured news from your national marine sanctuaries"
full_description = "Home News Featured Stories Stay up to date with the latest news and stories from your National Marine Sanctuaries. From groundbreaking research to regenerative tourism and recreation opportunities, to inspiring ocean stories, our featured news highlights the incredible work being done to protect and celebrate America's underwater treasures. Dive in and discover what's happening beneath the waves! Read How National Marine Sanctuaries Fuel Local Economies Healthy marine protected areas are good for business—people travel from all over the world to visit national marine sanctuaries and enjoy activities such as whale watching and fishing—and the money they spend while visiting trickles throughout the local economy. Some of America's most recognized underwater treasures are found in the National Marine Sanctuary System—and sanctuaries couldn't exist without the communities and businesses who support them. Read Rare Species Found in Your National Marine Sanctuaries and Monuments Read A Match Made in the Ocean: Sanctuary Symbioses Read Remembering Billy Causey Read NOAA Announces Papahānaumokuākea National Marine Sanctuary Read Camping Itineraries to Explore the Best of Land and Sea: National Parks and National Marine Sanctuaries Read Frozen in Time: National Marine Sanctuary Researchers Discover Lost Shipwreck Ironton Read Third Graders Get Into Thunder Bay National Marine Sanctuary Read Tagging Humpbacks: Where Biology, Conservation, and Engineering Meet Read Nuisance Alga Found in New Locations of Papahānaumokuākea Marine National Monument Read Rachel Bowman Leads Lionfish Invitationals at Flower Garden Banks National Marine Sanctuary Read To Protect and Serve: NOAA Enforcement Gives Back to Military Families Read USS Monitor: From Weapon of War to Island of Life Read Explore Spectacular: Interesting Discoveries From 50 Years of National Marine Sanctuaries Read 10 Animals You've Probably Never Heard of From Our Annual Photo Contest 2025 Web Stories Check out some of latest news from across your national marine sanctuary system. Tune in each week for more updates. Read Remembering Billy Causey Read NOAA Announces Papahānaumokuākea National Marine Sanctuary Read How National Marine Sanctuaries Fuel Local Economies Read President Jimmy Carter’s National Marine Sanctuary Legacy Read more stories National marine sanctuaries offer unique opportunities for regenerative tourism and responsible recreation, supporting local jobs and economies while safeguarding marine ecosystems. Ready to explore your sanctuary? Discover resources and events to help you connect with these special places! Fish Bits Lionfish Invitational Fishing Happens Here Blue Star Fishing Guides"
