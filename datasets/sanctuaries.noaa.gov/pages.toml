["https://sanctuaries.noaa.gov/earthisblue/submissions.html"]
title = "Earth is Blue: Photo and Video Submissions | Office of National Marine Sanctuaries"
description = "Earth is Blue: daily photos and weekly videos from our National Marine Sanctuaries"
full_description = "Through a photo each day and a video each week, Earth Is Blue celebrates the wonder and beauty of NOAA's National Marine Sanctuary System and the work NOAA undertakes to protect these special places. We invite you to share your photos and videos of national marine sanctuaries for a chance to see them on our Facebook, Twitter, Instagram and Tumblr as part of Earth Is Blue. What Should I Submit? We welcome photos showing: Marine life Shipwrecks and other examples of maritime heritage Sanctuary landscapes/seascapes Portraits of people enjoying national marine sanctuaries Science and research conducted in sanctuaries Please include captions as follows: a brief explanation of what is happening in the photo or video the sanctuary in which the image was taken identify the people in the photograph by full name, if possible Each photo must be submitted as a JPEG file and a minimum of 1200 pixels wide (but the bigger, the better!). Videos should be in HD. Photographs and video may be in color or black and white. Entrants must not infringe on the rights of any other photographer or person or submit images that involve the harassment of wildlife or damage to the environment by the photographer. Remember to practice responsible recreation when taking your photos. Review NOAA Fisheries' marine life viewing guidelines for best practices and approach regulations for viewing marine mammals and other protected species. Photographs may not be watermarked. Photos that have been digitally altered beyond standard optimization (cropping, adjustments to color and contrast, etc.) will be disqualified. Am I Eligible to Submit? Earth Is Blue is open to the public, including professional photographers and videographers as well as NOAA employees. All entries must be original work, taken by the submitting photographer/videographers. Photographers/videographers must be at least 13 years old. Where Will I See My Photos and/or Videos? Selected photos and videos will be shared on the NOAA Office of National Marine Sanctuaries website and social media (including, but not limited to, Facebook, Instagram, Twitter and Tumblr). NOAA will have unrestricted use of all submitted photos/videos and accompanying material. Please note these photos and videos will be publicly viewable. The submitter assumes responsibility for obtaining consent from any persons appearing in their photograph prior to submission. How Do I Submit My Photos and/or Videos? Email them to earthisblue@noaa.gov! Please note that by sending your photos to this email address, you are giving us permission to use the photo for other purposes, such as on our website and in other NOAA publications. We will, of course, provide credit to photographers whenever we use any of the photos."
