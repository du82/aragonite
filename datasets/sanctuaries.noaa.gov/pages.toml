["https://sanctuaries.noaa.gov/espanol"]
title = "La Oficina de Santuarios Marinos Nacionales de la Administración Nacional Oceánica y Atmosférica"
description = "En este sitio encontrarán información es español de cada uno de los santuarios marinos y monumentos marinos nacionales que son administrados bajo el Sistema Nacional de Santuarios Marinos. Además, encontrará información sobre nuestros programas, como poder participar en nuestros procesos de consulta, y sobre las actividades que realizamos con las comunidades asociadas e interesadas en nuestros santuarios marinos."
full_description = "La Oficina de Santuarios Marinos Nacionales (ONMS) de la Administración Nacional Oceánica y Atmosférica (NOAA) ha decidido publicar esta sección en español en nuestro sitio web, para hacer extensivo el mensaje de protección y cuidado de los recursos naturales y culturales de nuestro océano y Grande Lagos a la población hispanoparlante de los Estados Unidos, de América Latina y del mundo. ¡Bienvenidos!, es un gran privilegio poder entregarle esta información en su idioma. En este sitio encontrarán información es español de cada uno de los santuarios marinos y monumentos marinos nacionales que son administrados bajo el Sistema Nacional de Santuarios Marinos. Además, encontrará información sobre nuestros programas, como poder participar en nuestros procesos de consulta, y sobre las actividades que realizamos con las comunidades asociadas e interesadas en nuestros santuarios marinos. El valor de las areas protegidas También, en esta sección podrá acceder a información sobre nuestro Centro Nacional para las Áreas Marinas Protegidas (MPA Center) y algunas de nuestras actividades de cooperación con agencias nacionales e internacionales. Esperamos que la información que encuentre en este sitio sea de su interés y lo alentamos a que sea un(a) miembro participativo(a) de los santuarios marinos nacionales y de la protección y cuidado de los recursos naturales y el patrimonio cultural de nuestro océano y Grandes Lagos. Por favor, visítenos frecuentemente, ya que actualizaremos esta página de manera periódica con más información en español sobre nuestro programa. ¡Esperamos su Participación! Sistema Nacional de Santuarios Marinos Sistema Nacional de Santuarios Marinos Folleto Informativo Santuarios Marinos Nacionales Santuario Marino Nacional American Samoa Santuario Marino Nacional Cordell Bank Santuario Marino Nacional Channel Islands Santuario Marino Nacional Florida Keys Santuario Marino Nacional Flower Garden Banks Santuario Marino Nacional Greater Farallones Santuario Marino Nacional Gray's Reef Santuario Marino Nacional Hawaiian Islands Humpback Whale Santuario Marino Nacional Monitor Santuario Marino Nacional Monterey Bay Santuario Marino Nacional Olympic Coast Monumento Nacional Marino Papahānaumokuākea Santuario Marino Nacional Stellwagen Bank Santuario Marino Nacional Thunder Bay Proceso para Nominar un Santuario Marino El Camino a la Designación de un Santuario Centro Nacional para las Areas Marinas Protegidas Centro Nacional para las Areas Marinas Protegidas Reservas Marinas en los Estados Unidos Equipo Internacional de Fortalecimiento de Capacidades para las Áreas Marinas Protegidas (IMPACT) Infografía sobre áreas marinas protegidas y cambio climático Herramienta de Planificación para Resiliencia y Adaptación"
year_published = 2025
