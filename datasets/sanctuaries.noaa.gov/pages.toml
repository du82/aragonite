["https://sanctuaries.noaa.gov/about/faqs"]
title = "National Marine Sanctuary Frequently Asked Questions"
description = "National Marine Sanctuary Frequently Asked Questions"
full_description = '''National Marine Sanctuary Frequently Asked Questions What is a national marine sanctuary? Our national marine sanctuaries embrace part of our collective riches as a nation. Within their protected waters, giant humpback whales breed and calve their young, temperate reefs flourish and shipwrecks tell stories of our maritime history. Sanctuary habitats include beautiful coral reefs, lush kelp forests, whale migrations corridors, spectacular deep-sea canyons and underwater archaeological sites. Our nation's sanctuaries can provide a safe habitat for species close to extinction or protect historically significant shipwrecks. Ranging in size from less than one square mile to 137,792 square miles, each sanctuary site is a unique place requiring special protections. Natural classrooms, cherished recreational spots and valuable commercial industries—marine sanctuaries represent many things to many people. What is the National Marine Sanctuary System? The National Marine Sanctuary System consists of 18 marine protected areas that encompass more than 629,000 square miles of marine and Great Lakes waters from Washington State to the Florida Keys, and from Lake Huron to American Samoa. The system includes 18 national marine sanctuaries and Papahānaumokuākea and Rose Atoll marine national monuments. What is the Office of National Marine Sanctuaries? The Office of National Marine Sanctuaries, part of the National Oceanic and Atmospheric Administration, manages a national system of 19 underwater-protected areas. Since 1972, the Office of National Marine Sanctuaries has worked cooperatively with the public and federal, state and local officials to promote conservation while allowing compatible commercial and recreational activities. Increasing public awareness of our marine heritage, scientific research, monitoring, exploration, educational programs and outreach are just a few of the ways the Office of National Marine Sanctuaries fulfills its mission to the American people. What is the difference between a national marine sanctuary and marine national monument? In general, national marine sanctuaries are designated under the National Marine Sanctuaries Act, while marine national monuments are established under the Antiquities Act. Because of this, marine monuments are typically created by presidential proclamation, while sanctuaries involve more public input and regulatory processes. A national marine sanctuary is a protected area designated to conserve and manage marine ecosystems while allowing compatible uses like responsible recreation and tourism. It focuses on public education, scientific research, and community engagement. A marine national monument, on the other hand, is established primarily for preservation, offering stricter protections with limited human activities, often restricting fishing and other extractive uses. Learn more about the differences between sanctuaries and monuments How does a sanctuary get established? National marine sanctuaries are designated under the National Marine Sanctuaries Act, the only federal law written specifically to protect ocean areas ranging from discrete geographies to entire ecosystems. Members of the public can nominate nationally significant marine and Great Lakes areas as potential new national marine sanctuaries. A nomination must meet certain criteria to be included on the inventory of areas NOAA can consider for designation. The U.S. Congress can also designate national marine sanctuariesand the president can use the authority of the Antiquities Act to establish marine national monuments to be managed as part of the National Marine Sanctuary System. Why are sanctuaries important to coastal communities? National Marine Sanctuaries protect some of America’s most iconic natural, cultural, and historical marine resources. Sanctuaries conduct and support research and monitoring to inform resource protection, management, and education. The primary objective of a sanctuary is to protect its natural and cultural features while allowing people to use and enjoy the ocean a sustainable way. Sanctuary waters provide a secure habitat for species close to extinction and protect historically significant shipwrecks and artifacts. National marine sanctuaries serve as natural classrooms and laboratories for schoolchildren and researchers alike to promote understanding and stewardship of our ocean. They often are cherished recreational spots for sport fishing and diving and support commercial industries such as tourism, fishing and kelp harvesting. What is an ecosystem? An ecosystem is the community of animals and plants and the environment with which it is interrelated. Within a sanctuary, the ecosystem includes all the living organisms, the ocean and its currents, the seafloor and shoreline, and the air and wind above. It may also include the freshwater watersheds that flow into the sanctuary and that are the spawning grounds for salmon and other fish species. How does a national marine sanctuary protect marine life? Sanctuary managers rely on a variety of mechanisms to understand and protect the sanctuary's living and historical resources. The National Marine Sanctuaries Act, along with site-specific legislation and regulations, provides the legal framework outlining the activities that are allowed or prohibited. The sanctuaries implement a permit system to regulate and oversee potentially harmful activities sanctuaries. This framework may be enhanced by the adoption of state and other federal laws and regulations. Another important tool is "interpretive enforcement," emphasizing education about responsible behavior as a proactive method to prevent harmful resource impacts from occurring in the first place. What are marine resources and why must they be protected? (Living and cultural) The term "marine resources" broadly defines the living marine resources (plants and animals), the water and currents, and the ocean floor and shoreline with a sanctuary. It also includes the historical and cultural resources within a sanctuary, from shipwrecks and lighthouses to archaeological sites and the cultural history of native communities. Sanctuaries are established to protect areas that encompass unique or significant natural and cultural features. What is the role of the Office of National Marine Sanctuaries when compared to other federal, state and local governments? Local, state and federal agencies may have overlapping regulations or other management authorities aimed at protecting specific marine resources. However, no other federal agency is directly mandated to comprehensively conserve and manage special areas of the marine environment like the Office of National Marine Sanctuaries. Each agency may focus on different aspects or different resources, but generally their goals are consistent with protection and sustainable development of these marine areas. Coordination and cooperation among the responsible government agencies is key to successful sanctuary management. What is the sanctuary nomination process? NOAA's sanctuary nomination process is a public, community-based process individuals or groups can identify and recommend special areas of the marine or Great Lakes environment for possible designation as a national marine sanctuary.'''
year_published = 2025
clearnet = "https://sanctuaries.noaa.gov/about/faqs"
