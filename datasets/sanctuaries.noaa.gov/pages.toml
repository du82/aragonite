["https://sanctuaries.noaa.gov/maritime"]
title = "NOAA National Marine Sanctuaries"
full_description = '''The greatest relics representing America's past as a seafaring nation lie at the bottom of the sea and lakes in our national marine sanctuaries. NOAA's national marine sanctuaries protect prehistoric sites, shipwrecks, and naval battlefields: places to explore, discover, and appreciate our country's maritime cultural heritage. This heritage is a legacy of thousands of years of settlement, exploration, immigration, harvesting the bounty of the seas and creating coastal communities and maritime traditions. Through the study, protection and promotion of this diverse legacy, sanctuaries help Americans learn more about our past. Our long maritime history is reflected in the hundreds of different kinds of boats, from small one-person kayaks to the large ocean-going clippers that have plied our streams, rivers, lakes, and ocean, including in many places now protected as national marine sanctuaries and marine national monuments. In order to protect historically significant shipwrecks and maritime heritage resources, NOAA proposed the designation of a national marine sanctuary in eastern Lake Ontario in April 2019. The area being considered for designation includes 1,700 square miles of lake waters and bottomlands adjacent to New York State. It contains 21 known shipwrecks and one military aircraft representing events spanning over 200 years of United States history. The area also contains the HMS Ontario, which is both the oldest confirmed shipwreck in the United States and the only fully intact British warship discovered in the Great Lakes. Earlier this year, NOAA selected a pre-designation Sanctuary Advisory Council for Lake Ontario, which will provide advice and a local point of view to NOAA during the designation process. In July 2019, NOAA designated the first new national marine sanctuary in nearly two decades. Located south of Washington, D.C., the sanctuary protects the remnants of more than 100 World War I-era wooden steamships, known as the "Ghost Fleet," as well as other cultural maritime heritage dating back more than 12,000 years.'''
author = "US Department of Commerce, National Oceanic and Atmospheric Administration"
year_published = 2025
