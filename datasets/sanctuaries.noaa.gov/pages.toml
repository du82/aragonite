["https://sanctuaries.noaa.gov/management"]
title = "Policy and Planning | National Marine Sanctuaries"
description = "The National Marine Sanctuary System brings together a collection of some of America's most significant and treasured places. Taken together, the sanctuary system conserves a network of ocean and Great Lakes environments with extraordinary biodiversity, scenic beauty, cultural heritage and economic opportunity. Within the system, each national marine sanctuary has unique ecosystems, resources and human uses. And while all sanctuaries emphasize resource protection and decision-making based on the best available scientific and socioeconomic data, they are managed per their own individual issues and opportunities."
full_description = "The National Marine Sanctuary System brings together a collection of some of America's most significant and treasured places. Taken together, the sanctuary system conserves a network of ocean and Great Lakes environments with extraordinary biodiversity, scenic beauty, cultural heritage and economic opportunity. Within the system, each national marine sanctuary has unique ecosystems, resources and human uses. And while all sanctuaries emphasize resource protection and decision-making based on the best available scientific and socioeconomic data, they are managed per their own individual issues and opportunities. Policy and planning within the Office of National Marine Sanctuaries is designed to manage both the sum and the parts of the sanctuary system. It follows the principles of public participation and adaptive management, both of which are fundamental to the National Marine Sanctuaries Act. Planning and Effectiveness Each national marine sanctuary has its own management plan. Learn more about the management planning process, locate all sanctuary management plans, and learn about efforts to improve management effectiveness. Planning Management Effectiveness Sanctuary Designations Learn more about growth of the sanctuary system, from nomination of new areas. Designations Nominations Laws and Regulations Learn more about the regulations, laws and policies that govern the management of national marine sanctuaries. You can also find all Federal Register notices published by ONMS here. Laws Regulations Permitting Find out more about the national marine sanctuary permitting process. Permits may allow certain activities that are otherwise prohibited in national marine sanctuaries. Permitting Enforcement Learn more about how ONMS and its partners enforce the National Marine Sanctuaries Act and national marine sanctuary regulations. Enforcement Damage Assessment Find out more about how ONMS determines the nature, degree and extent of injuries to sanctuary resources and how we work to mitigate them. Damage Assessment Consultation Learn more about how ONMS consults with other federal agencies on actions that may affect sanctuary resources. Consultation Environmental Compliance Learn more about how ONMS implements environmental compliance for all of our actions. Environmental Compliance Protected Species and Places NOAA's Office of National Marine Sanctuaries and NOAA Fisheries are working together to connect our place-based and species-based conservation efforts within U.S. waters and beyond. Protected Species and Places"
year_published = 2025
clearnet = "https://sanctuaries.noaa.gov/management"
