title = "Earth is Blue: daily photos and weekly videos from our national marine sanctuaries"
description = "Earth is Blue: daily photos and weekly videos from our national marine sanctuaries"
full_description = '''What is earth is blue? Photos Videos Magazine Get Into Your Sanctuary! Looking for fun and adventure this summer? Get Into Your Sanctuary! Watch Full Video Get Into Your Sanctuary! Watch Full Video Looking for fun and adventure this summer? Get Into Your Sanctuary! Featured Videos Earth is Blue: Your National Marine Sanctuary System One Year Anniversary: Dr. Kathryn Sullivan Featured Photos .eib:hover { background-color: #00467f !important; color: #e5f3f6 !important; } .eib { color: #00467f !important; background-color: #e5f3f6 !important; font-size: 3em !important; padding: 0 .24rem !important; margin: 0 1rem !important; padding: .8rem 1rem !important; border-radius: 10% !important; } Our planet is an ocean planet: Earth Is Blue. The National Marine Sanctuary System protects some of the most iconic underwater places throughout the United States, but we can't do it without you. No matter where you are, the ocean and Great Lakes are in your hands. We hope these images inspire you to help care for our ocean and to spread the word that Earth isn't green – it's blue. Submit your own photos and join us on: Photos Videos BEHOLD the mighty, emperor helmet snail 😱 The emperor helmet snail (Cassis madagascariensis) is the largest helmet species and also one of the largest gastropods in the world. It is most famously known for its ornate shell resembling a medieval knight's helmet. Found in sandy bottoms of the tropical Western Atlantic, Gulf of Mexico, and Caribbean Sea, they often bury themselves during the day and emerge to hunt at night. They use a long, flexible, tube-like structure (proboscis) to pierce and feed on the soft tissues of echinoderms such as sea stars, sea urchins, and sand dollars. Photo: Karen Neely (2023 Get Into Your Sanctuary Photo Contest submission) We love mashed potatoes, and sometimes it's okay to relax and be a couch potato. But, a sea potato? That's a new one! Stalked tunicates (Boltenia ovifera), commonly referred to as “sea potatoes,” are marine invertebrates that might be mistaken for plants due to their stationary appearance. Found in Arctic and North Atlantic waters, these animals belong to the Phylum Chordata, which makes them a primitive relative of vertebrates. Stalked tunicates, like other types of tunicates or “sea squirts” are filter feeders that pull water through their body (tunic) using a system of inhalant and exhalant siphons. This particular tunicate species is secured to the bottom of the sea by means of a long stalk. Photo: Kevin McCarthy (2022 Get Into Your Sanctuary Photo Contest submission) Martin Luther King, Jr. Day is not just a day off from school or work, but a day to give back. Cleaning up your local shoreline or even just your neighborhood can help prevent trash from becoming marine debris and can help to create a healthy ocean that we can all enjoy. Pictured here is debris cleaned up by the Marine Debris team from the shores of Midway Atoll cleaning the waters of Papahānaumokuākea Marine National Monument! "Behold the majestic whale shark. While these magnificent creatures are endangered, we are privileged to witness their grace and beauty in the wild worldwide. Let's cherish every encounter as a reminder of our responsibility to protect and conserve their precious habitat." -Lawrence Alex Wu Congratulations to Lawrence Alex Wu for winning 2nd place in the Sanctuaries Around the World category of our photo contest! 📸 There's nothing like a family game night! How have you spent the holiday season with your family and friends? Congratulations to the 2nd place winner of the Sanctuaries at Home category of our photo contest- Tina Morrison! 📸 This special place near NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries is called Bowling Ball Beach, can you guess why? Congratulations to the 2nd place Sanctuary Views winner of our photo contest, Martin McClure! 🌅 Have you ever experienced a clear starry night in nature? 🌌 National marine sanctuaries provide great stargazing spots! Congratulations to the 2nd place winner of the Sanctuary Recreation category, Daniel Eidsmoe for sharing his night under the stars in NOAA Florida Keys National Marine Sanctuary. "Our marine habitats and all the native species that live in these sanctuaries are worth protecting." -Jean Zuo This year, we introduced the "Sanctuaries Around the World" category, where photographers had the opportunity to share their connection to the ocean from across the globe 🌎 Our 3rd place winner, Kayvon Malek, shares his connection to species of the Antarctic Peninsula! In this photo, gentoo penguins dive off a piece of ice into the frigid, but extremely rich waters of Antarctica. Congratulations Kayvon! 🎉 Learning and play can go hand-in-hand. In this photo, an aspiring marine biologist practices measuring and counting toy "sea turtle hatchlings" and "eggs" at home. Congratulations to the 3rd place winner of the Sanctuaries at Home category of our photo contest- Jenn Fletcher! 🎉 Thank you for sharing how you connect with national marine sanctuaries from home 🏠 Did you know this shipwreck is located only five feet below the surface of Lake Huron? This angler and paddle boarder are checking out the remains of the wooden schooner Albany. Albany has rested on the bottom of Lake Huron since it ran aground in 1853. Today, it is a popular destination for snorkelers and paddlers. We want to congratulate and thank our 3rd place Sanctuary Recreation winner, Bryan Dort, for sharing what it means to #RecreateResponsibly in NOAA Thunder Bay National Marine Sanctuary. Congratulations to the 3rd place Sanctuary Life winner of our photo contest, Douglas Croft, for capturing this action shot of two elephant seals fighting in Greater Farallones National Marine Sanctuary. Each year between December and February, elephant seals come to shore to breed. Males – like the two seen here – arrive first and fight for territory on the beach in quick, aggressive battles. Though males may experience minor injury as a result of these battles, severe harm or lasting damage rarely occur. Following establishment of territories, females arrive and the mating season ensues. Each pregnant female then gives birth to a single pup, who she’ll nurse for about a month before returning to sea. Our National Marine Sanctuary System really is full of life! 🥁 Drum roll, please! 🥁 We would like to introduce you to the winners of the 2023 #GetIntoYourSanctuary Photo Contest. Sanctuary Life Douglas Hoffman in Hawaiian Islands Humpback Whale National Marine Sanctuary Jean Zuo in NOAA's Monterey Bay National Marine Sanctuary Douglas Croft in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Sanctuary Recreation Chuck Graham in NOAA Channel Islands National Marine Sanctuary Daniel Eidsmoe in NOAA Florida Keys National Marine Sanctuary Bryan Dort in NOAA Thunder Bay National Marine Sanctuary Sanctuary Views Bruce Sudweeks in NOAA's Monterey Bay National Marine Sanctuary Martin McClure in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Courtney Stanford in NOAA Olympic Coast National Marine Sanctuary Sanctuaries at Home Laurie Santoro Tina Morrison Jenn Fletcher Sanctuaries Around the World María Rodríguez-Salinas Lawrence Alex Wu Kayvon Malek Congratulations to all the outstanding photographers who entered our 2023 Get Into Your Sanctuary Photo Contest. Don’t forget to check out the winners and honorable mentions on our results page. Stay tuned over the next few weeks as we feature each winner in our #EarthIsBlue campaign! 🥁 Drum roll, please! 🥁 We would like to introduce you to the winners of the 2023 #GetIntoYourSanctuary Photo Contest. Sanctuary Life Douglas Hoffman in Hawaiian Islands Humpback Whale National Marine Sanctuary Jean Zuo in NOAA's Monterey Bay National Marine Sanctuary Douglas Croft in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Sanctuary Recreation Chuck Graham in NOAA C