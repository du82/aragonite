["https://sanctuaries.noaa.gov/live"]
title = "Sanctuaries Live | Office of National Marine Sanctuaries"
description = "Though our planet is mostly ocean, we still know little about what lies far beneath the surface. Approximately 95 percent of the ocean remains unexplored, much of it in the deep sea. Even your national marine sanctuaries contain areas that have still not been seen by humans."
full_description = "Home Live The sites of your National Marine Sanctuary System are hubs for science, exploration, and education. At any given time, researchers are in sanctuaries exploring the deep, monitoring kelp forests, tracking coral reef health, and more. Sanctuaries Live gives you a front row seat to sanctuary science. Watch expedition livestreams, chat with scientists, master educational resources, and more. As we learn more about the mysteries of the ocean, we can better protect our blue planet. Expeditions NOAA's Office of National Marine Sanctuaries works with partners to expand our understanding of sanctuaries through deep-water exploration and research. Learn about past, current, and future expeditions to your national marine sanctuaries, and find out how you can tune in to watch science in action. Ala ʻAumoana Kai Uli in Papahānaumokuākea Marine National Monument September 1, 2023 - September 28, 2023, Ocean Exploration Trust and partners are conducting a telepresence-enabled expedition to explore unseen deep-sea habitats aboard E/V Nautilus with ROV and seafloor mapping operations in Papahānaumokuākea Marine National Monument focused on the largely unexplored northwestern section of the Monument. While the expedition's main focus will be to explore the geology and biology of unexplored seamounts, the operating area includes several historically-significant shipwrecks associated with the Battle of Midway. Should these historic wrecks be located, and weather conditions allow for ROV dives on these locations, the expedition will seek to conduct non-intrusive, ROV-based archaeological characterizations. Follow along on NautilusLive.org. Sanctuaries Live Archive Learn about past expeditions to your national marine sanctuaries. Distance Learning Webinars The National Marine Sanctuaries Webinar Series provides educators with educational and scientific expertise, resources, and training to support ocean and climate literacy in the classroom. Webinars are designed for teachers but are open to all. Live Interactions Join NOAA's Office of National Marine Sanctuaries and Exploring by the Seat of Your Pants for live interactions with NOAA and partner experts. Hear about scientists' experiences exploring national marine sanctuaries and ask them questions over chat. These interactions are the perfect opportunity for students and educators alike. Educational Resources Videos Remotely Operated Vehicle Exploration Your Earth is Blue: Biodiversity Your Earth is Blue: MATE ROV Competition Deep-sea habitats in the National Marine Sanctuary System Earth is Blue: Your National Marine Sanctuary System Coral Forests of the Deep Lesson Plans National Marine Sanctuary Lesson Plan Remotely Operated Vehicle Curriculum Guide Learning Ocean Science Through Ocean Exploration"
year_published = 2025
