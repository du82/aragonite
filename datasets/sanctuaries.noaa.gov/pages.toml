["https://sanctuaries.noaa.gov/about/indigenous-peoples.html"]
title = "Working with Indigenous Peoples: Our Responsibilities, Commitments, and Actions | Office of National Marine Sanctuaries"
description = "The National Marine Sanctuary System overlaps across Indigenous Peoples' homelands—lands and waters that Indigenous Peoples have been part of and cared for from time immemorial, and many Indigenous cultures continue to hold the responsibility to care for today."
full_description = "Working with Indigenous Peoples: Our Responsibilities, Commitments, and Actions The Chumash tomol, ‘Elye’wun, crosses from the mainland to Limuw (Santa Cruz Island). Photo: Robert Schwemmer/NOAA The National Marine Sanctuary System overlaps across Indigenous Peoples' homelands—lands and waters that Indigenous Peoples have been part of and cared for from time immemorial, and many Indigenous cultures continue to hold the responsibility to care for today. Indigenous Peoples' leadership, knowledges, ingenuity, and vision within these spaces are needed at the forefront of conservation discussions, research, actions, and policies. As part of the U.S. federal government, NOAA's Office of National Marine Sanctuaries holds a trust responsibility to federally recognized Tribes and Native Hawaiian Communities, and takes seriously the responsibility and opportunities to work through meaningful partnerships with all Indigenous Peoples where the program works. Consultation Government-to-Government Consultation with Federally Recognized Tribes/Nations: An ONMS Field Guide NOAA Tribal Consultation Handbook (Updated 2023) Reporting Office of National Marine Sanctuaries Briefing: Actions Related to Commitments Shared at the first Cross-Pacific Indigenous Knowledge NOAA Indigenous Knowledge Guidance and Appendix (updated 5/20/2024)"
