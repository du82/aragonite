["https://sanctuaries.noaa.gov/involved"]
title = "Get Involved with your National Marine Sanctuaries"
description = "There are many ways to get involved with the National Marine Sanctuaries - volunteer opportunities, advisory councils, participation in management plan reviews, NOAA jobs, and being a steward for the ocean are all great ways."
full_description = "Get Involved Home Get Involved Volunteer Opportunities Volunteers participate in a wide variety of activities including diving, whale identification, beach cleanups, water quality monitoring, collecting field observations and surveys, acting as visitor center docents, and wildlife monitoring. Volunteer Citizen Science Citizen science volunteers work with scientists to identify research questions, collect and analyze data, interpret results, make new discoveries, develop technologies,and solve complex problems. Citizen Science How You Can Take Action NOAA has published a notice requesting comments on the methods, formulas, and rationale for the calculations it will use in order to assess fees associated with special use permits (SUPs). Federal Register Notices National Marine Sanctuary Foundation The National Marine Sanctuary Foundation enhances national marine sanctuaries in their goal to protect essential U.S. marine areas and to ensure a healthy ocean. NMS Foundation Advisory Councils Bringing together diverse community interests to strengthen the network of national marine sanctuaries and the nation's marine protected areas. National Marine Sanctuary Advisory Councils Site-focused, community-based councils advising National Marine Sanctuary System leadership Sanctuary System Business Advisory Council Program-focused council connecting the Office of National Marine Sanctuaries with national business interests Sponsorships, Donations & Licensing NOAA’s Office of National Marine Sanctuaries is authorized to seek and work with outside partners to enhance its management, science, education, and stewardship missions through donations, sponsorships, and licensing. Sponsorships Donations Licensing Scholarship Opportunities NOAA's Office of National Marine Sanctuaries supports a variety of scholarship, internship, and volunteer programs for undergraduate and graduate students to gain hands-on experience while pursuing research and educational training in NOAA-mission sciences. Ernest F. Hollings Undergraduate Scholarship The Hollings Scholarship Program provides successful undergraduate applicants with awards that include academic assistance (up to a maximum of $9,500 per year) for full-time study during the 9-month academic year and a 10-week, full-time internship position ($700/week) during the summer at a NOAA facility. Meet the 2019 Hollings Scholars! Meet the 2018 Hollings Scholars! Meet the 2017 Hollings Scholars! Meet the 2016 Hollings Scholars! Meet the 2015 Hollings Scholars! Educational Partnership Program Undergraduate Scholarship The Undergraduate Scholarship Program provides an opportunity for rising junior students to study disciplines relating to NOAA's mission. Students attending Minority Serving Institutions (Hispanic Serving Institutions, Historically Black Colleges and Universities, Tribal Colleges and Universities, Alaskan-Native Serving Institutions, and Native Hawaiian Serving Institutions) receive appointments to approved NOAA offices and sites upon acceptance to the program. Meet the 2017 EPP Scholar! Dr. Nancy Foster Scholarship Program The Dr. Nancy Foster Scholarship Program recognizes outstanding scholarship and encourages independent graduate level research in NOAA mission-related sciences of oceanography, marine biology, and maritime archaeology, including all science, engineering, and resource management of ocean and coastal areas. Scholarship selections are based on academic excellence, letters of recommendations, research and career goals, and financial need. Looking for more student opportunities? NOAA supports a variety of programs for students at all points in their education. View all NOAA-supported student opportunities. Jobs Office of National Marine Sanctuary Positions National Marine Sanctuary Foundation NOAA Corps"
year_published = 2025
clearnet = "https://sanctuaries.noaa.gov/involved"
