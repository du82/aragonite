description = "Enhancing public awareness, understanding, and appreciation of the marine environment"
full_description = "To receive the latest announcements about upcoming distance learning opportunities, as well as educator and student opportunities and resources, be sure to sign up to the Sanctuary Education list serv. For Teachers The NOAA Office of National Marine Sanctuaries aims to provide teachers with resources and training to support ocean literacy in America's classrooms. Teacher Resources & Opportunities For Students National marine sanctuaries are living classrooms that can be explored in person or through interactive digital labs and activities. Marine Careers & Opportunities Ocean Guardian Programs Ocean Guardian programs encourage children to explore their natural surroundings to form a sense of personal connection to the ocean and/or watersheds in which they live. Ocean Guardian Programs Sanctuaries 360° Virtual Reality Lessons Sanctuaries 360° is a collection of immersive underwater experiences to bring America’s underwater treasures to viewers all over the world. Check out the virtual reality videos and 360° immersive photos to explore your national marine sanctuaries from the comfort of our home. VR Lessons Games and Activities Games, coloring pages, and fun activities to help you learn about the National Marine Sanctuaries. Games and Activities Student Scholarships The National Oceanic and Atmospheric Administration (NOAA) offers many scholarships, internships, fellowships and post docs for undergraduate and graduate students. Student Scholarships Education Strategic Plan Learn more about our education vision and mission, and download our Education Strategic Plan 2010-2020. Education Strategic Plan 2023 Education Infographic Every day, our educators share the treasures of the National Marine Sanctuary System with the public. We work to engage, inspire, and connect people with these special places and spark wonder in visitors young and old. In 2023, we worked with more than 89,708 students and 17,298 educators. Education Infographic Education at your Sanctuary Find out what's happening in education at your local sanctuary West Coast Region Olympic Coast Cordell Bank Greater Farallones Monterey Bay Channel Islands Pacific Islands Region Papahanaumokuakea Hawaii Humpback Whale American Samoa Eastern Region Florida Keys Flower Garden Banks Gray's Reef Mallows Bay-Potomac River Monitor Thunder Bay Stellwagen Bank Wisconsin-Shipwreck Coast"
