we feature each winner in our #EarthIsBlue campaign! 🥁 Drum roll, please! 🥁 We would like to introduce you to the winners of the 2023 #GetIntoYourSanctuary Photo Contest. Sanctuary Life Douglas Hoffman in Hawaiian Islands Humpback Whale National Marine Sanctuary Jean Zuo in NOAA's Monterey Bay National Marine Sanctuary Douglas Croft in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Sanctuary Recreation Chuck Graham in NOAA Channel Islands National Marine Sanctuary Daniel Eidsmoe in NOAA Florida Keys National Marine Sanctuary Bryan Dort in NOAA Thunder Bay National Marine Sanctuary Sanctuary Views Bruce Sudweeks in NOAA's Monterey Bay National Marine Sanctuary Martin McClure in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Courtney Stanford in NOAA Olympic Coast National Marine Sanctuary Sanctuaries at Home Laurie Santoro Tina Morrison Jenn Fletcher Sanctuaries Around the World María Rodríguez-Salinas Lawrence Alex Wu Kayvon Malek Congratulations to all the outstanding photographers who entered our 2023 Get Into Your Sanctuary Photo Contest. Don’t forget to check out the winners and honorable mentions on our results page. Stay tuned over the next few weeks as we feature each winner in our #EarthIsBlue campaign! 🥁 Drum roll, please! 🥁 We would like to introduce you to the winners of the 2023 #GetIntoYourSanctuary Photo Contest. Sanctuary Life Douglas Hoffman in Hawaiian Islands Humpback Whale National Marine Sanctuary Jean Zuo in NOAA's Monterey Bay National Marine Sanctuary Douglas Croft in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Sanctuary Recreation Chuck Graham in NOAA Channel Islands National Marine Sanctuary Daniel Eidsmoe in NOAA Florida Keys National Marine Sanctuary Bryan Dort in NOAA Thunder Bay National Marine Sanctuary Sanctuary Views Bruce Sudweeks in NOAA's Monterey Bay National Marine Sanctuary Martin McClure in NOAA's Greater Farallones and Cordell Bank National Marine Sanctuaries Courtney Stanford in NOAA Olympic Coast National Marine Sanctuary Sanctuaries at Home Laurie Santoro Tina Morrison Jenn Fletcher Sanctuaries Around the World María Rodríguez-Salinas Lawrence Alex Wu Kayvon Malek Congratulations to all the outstanding photographers who entered our 2023 Get Into Your Sanctuary Photo Contest. Don’t forget to check out the winners and honorable mentions on our results page. Stay tuned over the next few weeks as we feature each winner in our #EarthIsBlue campaign! The sanctuaries and monuments of the national marine sanctuary system run along the shorelines and include the waters of many Native and Tribal Nations. We work in partnership with these communities to protect resources, shape policy, conduct research, and provide educational programs. At NOAA Olympic Coast National Marine Sanctuary (pictured here), the Makah Tribe, Quileute Tribe, Hoh Tribe, and Quinault Indian Nation have a critical role in sanctuary management as active members of the Intergovernmental Policy Committee and the Sanctuary Advisory Council. Join us in commemorating #NativeAmericanHeritageDay, today, respecting and honoring the deep cultural ties of Indigenous people to the ocean. The public is invited to attend the National Marine Sanctuary System Business Advisory Council's meeting on Wednesday, December 6, 2023. There will be an opportunity for oral and written comments during the meeting. November is #ManateeAwarenessMonth! In the winter months, these large herbivores are often found in shallow, quiet waters of NOAA Florida Keys National Marine Sanctuary where seagrass beds or vegetation flourish. Because manatees are slow-moving, they cannot swim quickly away from boats, and boat strikes often injure or kill these creatures. If you’re boating in a known manatee habitat, keep them safe and slow down! Photo: Nick Aumen/USGS Nothing hits the spot like a midday nap, especially for sea otters! 🦦 Due to their high metabolism, sea otters – like this one in NOAA's Monterey Bay National Marine Sanctuary – have to eat and rest a lot as part of their daily routine. As otterly adorable as they are, it’s important to keep a safe viewing distance when coming across a sea otter in the wild so you don’t interrupt the time they need to take care of themselves. Keep sea otters safe and undisturbed by respecting their space, and their naps! Photo: Cat Harper Each winter, thousands of humpback whales travel to Hawaiian Islands Humpback Whale National Marine Sanctuary to find mates, calve, and nurse their young. Scientists estimate that up to 12,000 whales—more than half of the North Pacific humpback population—return to Hawaiian waters from November through May. Mothers can be seen breaching alongside their calves and males can be seen competing with one another for females in fierce head-to-head battles. Photo: Ed Lyman/NOAA, under NOAA permit #774-1714 Is #SharkSaturday a thing? Because we think it's a fin-tastic idea! NOAA Monitor National Marine Sanctuary is the perfe'''
