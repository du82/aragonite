["https://sanctuaries.noaa.gov/gallery"]
title = "NOAA Office of National Marine Sanctuaries"
description = "Dive in without getting wet! Your National Marine Sanctuary System protects a network of underwater parks encompassing more than 620,000 square miles of marine and Great Lakes waters, and now you can visit these amazing places in the blink of an eye."
full_description = '''Northeast/Great Lakes & Southeast Regions Florida Keys Paddle through mysterious mangroves, dive above coral reefs, and cast your fishing line in this popular destination Dive in Flower Garden Banks Make a splash in some of the healthiest coral reefs in the world Dive in Gray's Reef Journey off the coast of Georgia to a vivid "live-bottom" reef Dive in Mallow Bay-Potomac River Paddle among the historic shipwrecks of the Ghost Fleet of Mallows Bay Dive in Monitor Go back in time and experience the story of the historic USS Monitor Dive in Stellwagen Bank Visit one of the world's premiere whale watching destinations to see breaching humpback whales and more Dive in Thunder Bay Dive among historic shipwrecks that hold the stories of the Great Lakes' maritime past Dive in Pacific Islands & West Coast Regions American Samoa Voyage to the Southern Hemisphere to learn about Fa‘a Samoa, the Samoan way, and to dive among incredible corals Dive in Channel Islands Experience the "Galapagos of North America" in this biodiverse seascape off Southern California Dive in Cordell Bank Dive deep beneath the ocean surface and encounter a surprising technicolor reefscape Dive in Greater Farallones Witness thousands of seabirds, explore a tide pool, and get to know the famed white sharks of the California coast Dive in Hawaiian Islands Humpback Whale Hear the haunting songs of courting humpback whales and join a sea turtle for a day at the spa Dive in Monterey Bay Travel to the "Serengeti of the Sea" to see whales, seals, sharks, sea otters, and more Dive in Olympic Coast Explore rugged coastlines, towering kelp forests, and a storied seascape Dive in Papahānaumokuākea Experience the largest conservation area in the United States, witness amazing biodiversity, and learn why Papahānaumokuākea is significant to Native Hawaiians Dive in Virtual Dives Immerse yourself in the ocean and your national marine sanctuaries without getting wet! Dive Into Your Sanctuaries Our planet is an ocean planet: Earth Is Blue. The National Marine Sanctuary System protects some of the most iconic underwater places throughout the United States, but we can't do it without you. No matter where you are, the ocean and Great Lakes are in your hands. We hope these images inspire you to help care for our ocean and to spread the word that Earth isn't green – it's blue. Join us on and submit your own photos. View More Photos Stories from the Blue Stories from the Blue celebrate the people at the center of national marine sanctuaries and marine national monuments. What does the National Marine Sanctuary System mean to you? What does the National Marine Sanctuary System mean to you? Earth is Blue Magazine Earth Is Blue Magazine - Volume 6 Read Online Download PDF Earth Is Blue Magazine - Volume 5 Read Online Download PDF Earth Is Blue Magazine - Volume 4 Read Online Download PDF Earth Is Blue Magazine - Volume 3 Read Online Download PDF Earth Is Blue Magazine - Volume 2 Read Online Download PDF Earth Is Blue Magazine - Volume 1 Read Online Download PDF Explore Sanctuaries Live with real-time video and communication feeds Experience science beneath the waves'''
