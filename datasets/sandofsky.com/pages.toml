full_description = '''Controller Hierarchies Occasionally an activity within your app requires multiple screens. Consider uploading a photo to Instagram: pick a photo, pick the filter, and add a description. When the user taps a photo in the first screen, it might look like: func userDidPickPhoto(_ photo:Photo){ let filter = FilterViewController() filter.photo = photo navigationController? Jan 6, 2019 7 min read How I Learned to Build Apps From time to time, people ask me how to learn iOS development. So here we go. Before you start, be serious about your goal. Are you trying to prototype a concept, get funding, and then hire someone else to deal with it? Are you a "generalist" who needs Feb 8, 2018 4 min read The Trouble with Manager Objects The first time I look at a legacy project, I scan for warning signs. I’ve covered singletons, excessive observers, and today I'll talk about "Manager" classes. I have to reiterate these are guidelines, not rules, and among guidelines, this one isn't critical. A Apr 17, 2016 3 min read KVO In my last post, I explained why you should prefer delegates over observers. The former encourages a tree-like data flow, while the latter leads to a cat's cradle. If you're sure you need an observer, Cocoa lets you choose between Notification Center and KVO. Which should Feb 1, 2016 5 min read Delegates vs Observers A well structured app consists of simple objects with well-defined responsibilities talking to each other. When you design an object, you might think of an object's properties, and the actions they take, but it's just as important to decide how they'll communicate. Cocoa provides Jan 6, 2016 4 min read The Sin in Singletons Singletons are not an anti-pattern, but they are an abused pattern. They're popular among beginners because they're convenient. Down the line they add complexity and cause maddening bugs. Let's start with the positive. Every so often, you have an object that should be represented Nov 8, 2015 3 min read The S Curve The worst question in software is, "When will it be done?" because it never correlates with, "When should we ship?" These questions involve guesswork, but a little science goes a long way. We'll define Done as, "When outstanding tickets reach zero." Graph Nov 6, 2015 4 min read'''
