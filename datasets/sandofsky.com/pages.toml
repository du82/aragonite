["https://sandofsky.com/humane"]
title = "Oh the Humanity"
description = "Don’t miss out on the latest issues. Sign up now to get access to the library of members-only issues."
full_description = '''By Benjamin Sandofsky — Apr 15, 2024 Oh the Humanity Why You Can't Build Apple with Venture CapitalAn ex-Apple designer who went on to startup success once told me, "I wish I could give a workshop for Apple alumni jumping into startups, to help them un-learn The Apple Way." As someone who strives to build products with the craft and quality of Apple, it pains me to admit that The Apple Way can destroy a lot of startups. Which brings us to Humane.Humane raised $230 Million and spent six years to ship an "Ai Pin," with disastrous results.The pin shipped with fraction of the features promised at its unveiling eleven months ago, and what features that did ship fail most of the time. It's too heavy, and has atrocious battery life, with users expected to swap batteries every few hours as the device runs uncomfortably hot. Its projector is useless in daylight, and its input system is awkward and slow. For a device meant to replace your phone, you expect an experience faster than just whipping out your phone. It's safe to say the Ai Pin deserves an exhibit alongside Juicero and Clinkle in the museum of Silicon Valley misfires. It stands out from those flops because, unlike your Clinkles, this isn't the story of a young man given too much money and power without the maturity to wield it. Humane's founders worked on the first iPhone.I don't have any inside information on what went wrong, but I have theories based on my experiences with venture backed startups and my understanding of The Apple Way of doing things.The Venture Capital MindsetA question that keeps coming up is how Humane raised so much money while launching nothing. To get there, we need to break down what Venture Capital is, and how VC firms think about investments.Rich people and rich organizations (think pension funds and billion dollar college endowments) don't throw all their money in a savings account or the stock market. They have so much money that they can place bets in alternative investments. These are hedge funds, real estate, or venture capital a.k.a. "throw money at a ton of startups."Investment returns always correlate with risk. Back in 2018, a savings account might earn you a 1% every year, with zero risk that you'll lose money. The stock market might earn you 10%, but carries the risk of a 2007 meltdown. The risk in Venture Capital is downright absurd, with many if not most of your investments losing money. But every so often you find a smash hit that pays back 10,000%.A respected VC once explained that a third of their investments flop and a third break even, so they need that last one third to be so successful that they both cancel-out the flops and make big returns for investors. That's all to say they play the opposite of moneyball: they aren't looking for safe bets, but a few home runs. You only need to pick one Uber-scale success to make up for picking a dozen Juiceros.While a normal person would be insane to put their retirement into startups, a VC fund may pool hundreds of millions of dollar— even upwards of a billion dollars— from people and groups so rich that losing $1m feels like a normal person losing $20 in the washing machine. The fund casts a wide net, and every once in a while they find an AirBnB.While the people who manage these investment firms like to paint themselves as "billionaire scouts" that possess some keen intuition to pick the winners and losers, in reality there's a handful of checkboxes that any mediocre dude can follow.One big signal is whether the startup founder's had prior success. Once you sell your first startup, VCs knock down your door to fund your next one. Whenever you hear about a stupid startup getting a truckload of funding, it's likely a case of a successful founder's sophomoric follow-up to another winning startup.While Humane's founders never ran their own startup, one of them (Imran Chaudhri's) did work on the original iPhone. How big a role is up for debate, and most Apple people I talk to think that he takes far too much credit for other people's work. However, Imran's personal website is titled "Select Patented Works, Volume 1: 1995-2017," and links to a thousand patents, his name alongside Steve Jobs. While it makes a lot of people I know cringe, it's enough to get your startup pitch in front of a VC.Within the pitch, VCs look for "moats." These are the features of the company that make it hard for competitors to copy, or otherwise lock your users into the service. Normal people call these "monopolies," but VCs would rather not say the quiet part aloud.Humane was pitched as replacing the the phone, so look to the iPhone for the moats. Once users trust a service with their most precious photos, they never want to deal with the hassle of switching. Once developers start developing for your platform, it's hard for even the best competitors (WebOS, Windows Phone) to catch up with that momentum.Finally, VCs look at investments through the lens of, "Why now?" In 2012 Uber showed that gig work could be the future of employment, so VCs rushed to back DoorDash and Instacart and anything else related to gig work. Humane was founded in 2018, a time when everyone realized screens could be toxic. Within Silicon Valley, parents made nannies sign contracts agreeing to hide their phones from kids. Maybe they imagined phones being stigmatized the same way we stigmatize public smoking.For all its interesting points, Humane had red flags. Married cofounders are a red flag so big you can see it from outer space. I think VCs cut Humane slack because they were desperate to fund anything during the late 2010's.Without making this whole post about financial theory, just understand that low interest rates lead to more startup investments. Following the financial meltdown of 2008, the US saw an unprecedented period of low interest rates, and there's even a meme going around where everything insane during the 2010's tech bubble is labeled a "Zero Interest Rate Phenomenon."In 2018, there was more money flowing into Silicon Valley than there were quality startups to invest in. That's OK for VCs because they actually make money whether or not they pick a winner. They charge "maintenance fees" in the range of 1.5% to 2.5%, so when an endowment writes a VC a check for nine figures, the firm makes millions a year. This meant that Humane didn't have to be a knockout, they just had to be the last single person at the bar at closing time.Startups Favor SpeedDespite all its quirks, Humane might have worked out if it followed a traditional VC startup formula. Instead, they tried to follow The Apple Way, where 1.0 products need to be so insanely polished as to blow people away.That approach makes sense for Apple. At minimum, they have a reputation to keep up. Sometimes the Apple Way leads to incredible products, like the first iPhone. Sometimes it doesn't work so well, in the case of the Apple Watch, Imran's final project at the company.The Apple Watch wasn't a flop, but it did struggle a bit out of the gate. That's expected when you try new things. Before you launch, you live in vacuum, and you operate on faith that your theories will pan out. After a launch, you find some of your theories were right ("Apple Watch is a fitness companion"), and some very wrong ("People will spend $10,000 on a solid gold gadget").The Apple Way works best when they take an existing product and make it amazing. The best pitch for Apple Watch wasn't "The Rolex of Tech," but rather, "A very fancy FitBit."It also helps when a product leverages Apple's existing ecosystem, and the goodwill Apple had earned from customers. The Apple Watch connected to the Health app, received messages from your phone, played your favorite music, etc. Apple has a beautiful moat, I'm sure filled with stunning koi fish.Humane spent five years developing their product in a vacuum. They lacked a FitBit to prove their concept. They had little evidence people want to ditch their phones. They didn't know what form factors users would tolerate. They didn't have normal people telling them battery swaps are dumb.But the most damaging consequence of their delayed launch was missing the chance to strike while the iron was hot. Humane sounded like a decent idea in 2018, but that same year the iPhone launched its "Screen Time," which has proven a good enough solution for many to curb their screen addiction. In the following years we've watched a decline in the use of social media, which gives me a "nature is healing" vibe. Phone addiction is still a thing, but it feels more like pot than fentanyl.The AI PivotIt's obvious that Humane pivoted to AI late in the game, and it's obvious how they got backed into that corner. The formula for a VC backed company goes:Raise a little bit of moneyBuild somethingProve it's taking offGo to step 1The more you can show a VC that your company is taking off, the more generous the terms of their investment. Being in a position of power means the difference between giving up 5% or 20% of your company for the exact same money.This was a lesson lost through the 2010's as money flowed freely and entrepreneurs raised way more than they needed. When interest rates went up in 2022, startups suddenly found it harder to raise money. Investors were suddenly interested in— GASP— profitability.At this point Humane had raised $130m, which sounds like a lot of money, but they were also growing their headcount to hundreds of employees. This is insane when you haven't validated your product. Knowing typical tech salaries, I'll guess they were burning $30m per year in salaries alone. On top for this, I'm sure they'd want to sell their product at a loss, the same way that Sony and Microsoft sell game consoles to grow their user base. Gotta build that moat.Humane was in a precarious position for raising more money. Normally, investors expect startups to find an "exit" (IPO or get acquired) somewhere between five and eight years from its inception. That's when investors get their money back with profit. According to VC schedule, Humane should already have a product on the market with a growing user base, and at least showing a path to profitability.To make matters worse, Humane needed an investor to write a big check. One reason you only ask for less money in your early years is that early-stage investors are comfortable losing a few million here and there. The late-stage investors that write nine figure checks look for safer bets, and they can get by with mere 5× returns.So Humane needed to ship something to look like a later stage company, but as we now know, their hardware sucked. They decided to latch on to AI, which was in the midst of a huge hype cycle. They shifted messaging away from the projector, and in May 2023, Imran delivered a Ted Talk with an obviously rigged demo that focused on AI.I tweeted my theory about an AI pivot in November 2023, and it found its way to the official Humane fan Discord. (Yes, Humane setup a fan Discord before announcing any sort of product. They also ran a podcast dedicated to how awesome they were.)Bethany replied:Now when someone says "you're wrong" without telling you how you're wrong, you're probably more right than wrong. Bethany tries to hand wave things away by mentioning "the pitch and vision," but… come on.I'm sure their 2018 pitch was about a post-iPhone device. I'm sure it mentioned a Siri-like assistant. There was zero chance that it involved ChatGPT in 2018, because ChatGPT launched in 2022.If it's true they always envisioned an AI-first experience, and they spent six years of their lives only to ship this, well, that's way more embarrassing than a last-minute AI pivot. The Power of Failing FastThe problems with Humane began at their seed stage. They should have tested the idea faster, and rejected it right away. I get that hardware is different than software, and there's no way Humane could have shipped their projector in a matter of months, or years, but it should have been obvious from early prototypes that this product had a minuscule chance of working in the real world. We've already seen the concept debunked.Yet I tried to withhold judgement after that Ted Talk. I thought, "Maybe they found a solution to projecting in daylight without getting really hot and egregiously depleting the battery." They didn't. They patched over it. Short battery life? Battery swaps! Doesn't work in daylight? Uh… don't use it in daylight!For all we know, maybe they did build prototypes but convinced themselves it would be solved. These are certain types of problems you can solve at the scale of Apple, but intractable as a startup. Scaling a startup is about deferring those moonshot bets until your company has the momentum to compete at that scale.There is absolutely nothing wrong with pitching one idea to investors and going in a totally different direction. There's a saying that early-stage investors back the team, not the idea. Twitter started as a podcast platform, and pivoted to social media after getting sherlocked by Apple. Slack started as— I kid you not— an MMORPG.Humane could have kept true to the essence of their product, detaching from our phones, while not having to fight an unwinnable battle. What about an e-ink phone? Imagine a device that gives you weeks of battery life, but too low-fi to leave you vulnerable to addictive apps. Maybe that idea sucks, but I'd try a hundred others before going all in on the doomed laser projectorPerhaps we can blame the early commitment on raising too much money, too early. I wish more entrepreneurs knew that you don't need to raise money right away. The co-founders must have walked away from Apple with enough money to diddle on silly concepts for a few years without pressure from investors. The moment they accepted their first check, the clock was ticking. They had eight years to build the next Apple.It's that funding that will be Humane's undoing. Before the Ai Pin launch, they convinced investors the company is worth $850 million. When they go back for their next round, they need to argue with a straight face that the company is now worth $1.7 Billion. Good luck with that.It's very likely that the next time Humane raises money, they'll have to value the company less than what they told their last group of investors. These "Down Rounds" screw recent investors and employees, as the stock that they bought is worth less than what they paid for it. It also has a chilling effect on longtime employees. Do not be surprised by an exodus.The HubrisI don't write essays about startups failing because it feels like punching down. I wouldn't want anyone doing it to me. In fact, my own apps have been plagiarized more than a few times, and I'll usually bite my tongue rather than trash talk the developers. It's just tacky and a waste of energy.If I had to give one bit of PR advice to a startup, it's to be humble. I learned this from Twitter's early early years, when users somehow tolerated weekly service o'''
