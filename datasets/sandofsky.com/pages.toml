["https://sandofsky.com/end-of-twitter"]
title = "The End of The Twitter Era"
description = "I've been thinking a lot about how social networks die. Will Twitter decline like MySpace, or collapse like Digg?"
full_description = '''By Benjamin Sandofsky — Nov 25, 2024 The End of The Twitter Era I've been thinking a lot about how social networks die, these past two years. It's an unusually personal topic. In 2009, I picked up my life to move to San Francisco and work for Twitter. I joined a startup you could fit around a giant lunch table, and left a corporation with thousands of employees and hundreds of millions of users.I resigned from Twitter ten years ago, but the company will always be an important chapter in my life. Watching its decline, my mind keeps returning to a graveyard of networks past.Friendster was my first relationship with social media, a summer fling of 2003. Technical problems knocked the site offline, letting MySpace swoop in to overtake it before it could set down roots. Facebook launched one year later, and despite a superior product, it took four years to overtake MySpace. How could that one year head start create so much friction for Facebook?Silicon Valley ascribes this to network effects. The idea goes that as a service gains more users, the value of that service increases. AirBnB isn't valuable due to its technology— it would be trivial to clone the website. AirBnB is the eight million listings and 150 million users. Clones starting from scratch are useless, which is why venture capitalists love to invest in these de-facto monopolies.As long as there was Twitter there were Twitter killers. Pownce (2007) allowed you to attach files, events, and links to your posts. Google tried to get in on the game with Google Buzz (2010) and Google Plus (2011), which integrated with your existing Google account. App.Net (2012) capitalized on a backlash around third-party clients. Every clone came out of the gate with solid momentum, only to crash into a wall of network effects. Users always returned to Twitter.This time, things feel different. Two years after the takeover, we have not one, but three thriving Twitter replacements. Following the election this month, Bluesky pulled into the lead, with upwards of one million signups every day. These new services seem to stick.Chart via TechcrunchIf this momentum continues, things will feel less like the slow decline of MySpace, and more like the sudden shift from Digg to Reddit.Digg was founded in 2004, and Reddit followed six months later. Reddit failed to break-out, so it was sold to Condé Nast for $10 million in 2006, a disappointing exit given Digg's talks of a $200m acquisition by 2008. When startups sell to big companies, you assume their best days are over, but in 2010 Reddit exploded in popularity after a massive backlash against Digg's product changes.What happened to network effects? Will Twitter see a slow death like MySpace, or a sudden collapse like Digg? Can a successor live up to its legacy? I'll spoil that question right now: No, because Twitter's time has come and gone.Since I resigned from the company ten years ago, I generally avoid writing about my time there, partly because it's unhealthy to dwell on your past, and partly because I couldn't look back without personal feelings getting in the way.The twoffice in 2009, courtesy of its dead Flickr accountAt the same time, I learned a lot in my time there. I witnessed first-hand how small changes dramatically accelerate growth. I was there for the battles between Twitter and Facebook over the social graph. I was personally involved in quite a few backlashes. With ten years of distance, maybe I'm ready to unpack some lessons.Metcalfe's LawCan you measure the power of a social network with a concrete number, like the "XP" of a character in a role playing game?You could count the people who use the site every month. That's good enough for publicly traded companies to disclose in their quarterly filings. However, active users counts can be deceiving.When an app goes viral, millions of people can sign up, spend five minutes checking it out, only to shrug and move on, never to return. In big tech lingo, those users churned, and churn was Twitter's worst enemy. Sure, breaking news and big name celebrities gave the platform unbelievable free publicity, which drove sign ups, but a ton of those signups churned.We have a better measure of a social network's value, and we owe it to Bob Metcalfe, a key figure in the history of the Internet. Metcalfe invented Ethernet, among other things. In 1980, he made a groundbreaking observation about computer networks that's often applied to social networks: the value a network isn't the nodes (or people) but the connections between the nodes.The telephone network is a perfect example, because everyone who joins the network can call anyone else. I can call one of my cousins in Boston just as easily as I can call a stranger Lesotho. When there are two nodes in this graph, there's only one connection:Credit: WikipediaWhen there's five nodes, there's ten connections:When there's twelve nodes, that's 66 connectionsThis means that the value of a fully connected network scales at N * (N - 1) * 2.Blue: nodes. Red: connections.If you tried to spin up a rival phone network, capturing 1% of users wouldn't capture 1% of value. You may offer as little as 0.01% of value.WhatsApp is a near-perfect example of this phenomenon. It dominates messaging outside of the USA, and there's little hope of disrupting that short of government intervention. Viewed under this lens, Facebook's purchase of WhatsApp for $19 Billion makes perfect sense.That said, the average venture capitalist possesses the intellect of an airport book, and they love to throw around Metcalfe's Law to justify the absurd valuation of their latest startup. I think Metcalfe's Law points in the right direction, but it's so overused that it becomes a thought terminating cliché.Social networks are not fully connected graphs. Facebook's entire selling point was that you aren't connected to everyone, just your friends. When you look at 66 connections on a social network, they don't look like that dense network of twelve users from earlier. 66 connections looks closer to this:Sure, my old college improv troupe are densely packed bestie's, but we're all several degrees away from anyone in Lesotho.In computer science, we call this a Sparse Network and it has serious implications around the strength of your network. If you lose key connectors in the graph, the network fragments into smaller, weaker, subnetworks. Compared to moving the world off telephones or email, it's pretty easy to move your closest friends and family from Facebook to private group chats.To counter this, every social network goes out of its way to connect you with other people, whether you want to or not. When Facebook notices that a lot of your friends follow someone and you aren't, you see them in one of those "People You Might Know" boxes, to help Facebook fill out its graph. Fun fact: I have a lot of actor friends, so I sometimes get suggestions for celebrities I've never met.This man is in everything, even my friend recs.In the late 2000's, building your graph was a slow process that involved manually searching for friends. This made Facebook's social graph its most valuable resource— a resource it guards with its life.Twitter tried to expand its graph by building a web-app that connected to Facebook to help you find those same friends on Twitter. When Facebook got wind, they pulled the plug. Apple built a similar tool for their ill-fated Ping, and Facebook also shut them down, knowing it would trigger a Cold War.The iPhone freed the social graph from Facebook's clutches. Once apps could upload their address books with one tap, it became trivial for new platforms to bootstrap their own graphs. This gave us networks like Snapchat and TikTok, to say nothing of smaller, hobbyist networks like VSCO, Goodreads, or Strava.Another flaw with Metcalfe's Law is that not all connections are created equal. If you believe Dunbar's Number, a person's maximum number of meaningful relationships tops out at 150. That implies that social networks actually scale more linearly than exponentially, and they aren't as bulletproof as their investors would have you believe.Different Types of GraphsSo we have WhatsApp, which is a pure network; Facebook, which is sparse; and then we have interest graphs like Digg and Twitter which are not only sparse, but one-way. Big yikes.Many connections on these networks are lopsided, with single accounts followed by tens of thousands to millions of followers. To put this in terms even a VC can follow, these people are super-connectors.Super-connectors are unavoidable in interest graphs, and while they're boon for growth, they also present a risk. If these connectors go elsewhere, their followers… well… follow. That's all to say that losing Taylor Swift would be catastrophic.Super-connectors are also responsible for one network effect impossible to synthesize in a lab:In January of 2009, the Miracle on the Hudson defined Twitter as the platform for breaking news. It was no longer just a website for nerds to live-tweet to each other as LOST aired. It was now part of the global conversation. It was the moment I knew I had to work at Twitter.This moment happened two and a half years into the company, and it could only happen thanks to millions of users, with super-connectors helping spread the story round the world in seconds.Network effects do not make a service invincible. Twitter is 40% social network, 40% interest graph, and 20% cultural phenomenon. So I'll place Twitter's decline somewhere in between Digg and MySpace. We may only be partway through a multi-year process, but if Twitter loses its super-connectors, I think things will quickly accelerate.Slowly, Then All at OnceNetwork effects create powerful inertia. To maintain control of their lead, the incumbent network just needs to evolve its product at a reasonable pace. In retrospect, the deaths of MySpace and Digg were completely avoidable.In 2005, News Corp acquired MySpace. According to former employees, News Corp focused on making money instead of competing with up-and-comer Facebook. This lines up with how my friends and I felt at the time, as users. There were legendary cross-site-scripting hacks, obnoxious ads, and because users could radically customize their page, the whole site felt cheap and janky.It doesn't have to be more complicated than, "MySpace stopped being fun." Eventually, the people in my friend network woke up and realized that a switch to Facebook was less painful than putting up with the spam, hacks, and profile pages that auto-play Evanescence.In contrast, when Facebook saw Vine as a threat to Instagram, it quickly launched video support, stopping Vine's growth dead in its tracks. When Facebook saw Snapchat as the next threat, it quickly launched Instagram Stories. When Facebook accepted WhatsApp was an unstopped force, it quickly whipped out its checkbook.That's not to say all product changes move things in the right direction. In 2008, Digg was on top of the world. They proceeded to make a series of bad product decisions, such as its obnoxious Digg Bar. These misfires may not kill a site, but it starts conversations like, "Where should we go if things get out of hand?" When Digg's 2010 disastrous redesign launched, everyone knew where to go.Twitter was long criticized for slow evolution, which was rooted in fear of driving users away. Until the takeover, its most unpopular changes involved killing third-party clients. With each backlash, the company caved, and came up with ways to keep the most popular third-party clients around.Most new Twitter products landed with a "meh," such as its answer to Snapchat Stories, Fleets. Every once in a while, they shipped a real banger like Twitter Spaces, which successfully destroyed Clubhouse, a Silicon Valley darling once valued at $4 billion.Since the takeover, almost every product change has ranged from flop to disaster. Just like News Corp did to MySpace, new leadership focused on making money. The made cuts to the Trust and Safety department which saturated the platform with scams, porn bots, and hate speech.The new "Twitter Premium" made matters worse. Putting verified badges up for sale made impersonation trivial. Premium accounts received algorithmic boosts, allowing the worst users to pay money to have their speech amplified. Paying users for page views further incentivized rage bait.If you ask someone to name an improvement to Twitter over the last two years, they'll probably say Community Notes, a feature built almost two years before the takeover. This feature receives so much praise today because it's the closest the platform has to moderation anymore. If you drive away these volunteers, the platform will descend into 8chan.I'm not here to dive into Elon Musk's politics, but I have to point out Rupert Murdoch had the smarts to keep his personal views confined to Fox News. You never felt like you were aligning with the right when visiting MySpace or watching The Simpsons. Musk goes out of his way to make Twitter feel like Trump's platform. For many, staying on the platform feels like a political statement, and regardless of one's politics, normal people don't want that drama in their lives. They come to social media for silly memes and cat photos.I could keep listing examples of terrible Twitter moves, such as burning bridges with advertisers, ill-planned layoffs, and personal meddling with algorithms. It doesn't have to be that complicated. For many people, myself included, Twitter just stopped being fun.So where do you go? We have three Twitter replacements with different perspectives on what Twitter actually was.Option 1: MastodonMastodon views Twitter as a public utility. Launching in 2016, this non-profit thinks Twitter should function like email, where no central entity controls everything. You don't sign up for Mastodon through the organization itself, but a Mastodon provider ("instance"), just like you sign up for email through Gmail or Yahoo. Anything decentralized is a bit more complicated than the centralized alternative. It made sense that in the 90s, America Online was America's introduction to email. That said, I don't think Mastodon is doing a bad job streamlining these concepts. My issue is that the product itself is too unpolished, surprising no one who has ever tried an open source consumer product.As such, Mastodon fosters a vibrant community of people comfortable setting up WiFi on Linux. As a developer, that's fine, I'm among my people, but there is zero chance that my nontechnical friends will join. It's a shame, because Mastodon is the only platform earnestly trying to decentralize things.With close to a million active users, Mastodon's modest success should have been a canary in a coal mine for Twitter. When this many people are willing to endure such a rough experience, you know you are on the cusp of an exodus.Option 2: ThreadsFacebook's Threads is more Facebook than Twitter. Yes, you can follow people, but yo'''
