["https://sandofsky.com/lambda-school"]
title = "Fast Crimes at Lambda School"
description = """
Two days after his company's downfall, Austen Allred wrote:

I wish people could see how ugly it is to be envious, and how obvious it is to those around you when that's what's happening.

There's not much uglier than trying to tear someone down because they achieved what you wish"""
full_description = '''By Benjamin Sandofsky — Jun 18, 2024 Fast Crimes at Lambda School Two days after his company's downfall, Austen Allred wrote:I wish people could see how ugly it is to be envious, and how obvious it is to those around you when that's what's happening.There's not much uglier than trying to tear someone down because they achieved what you wish you had.Austen co-founded Lambda School, one of the largest educational startups of all time. It promised to teach you to code in a matter of months, a common claim in 2017, a time when code bootcamps were commodities you could find in any strip mall. But you don't score $120 million in funding from the biggest names in venture capital by building a better boot camp. He took on college.An underdog with a story as fascinating as his company, Austen went from Mormon missionary to college dropout— at one point homeless and living out of his Honda Civic— to the founder of the hottest startup in the valley.What set his boot camp apart from the others were "Income Share Agreements." Instead of paying up-front for tuition, students agreed to pay a portion of future income. If you don't get a job, you pay nothing. It was an idea so clever it became a breakout hit of Y Combinator, the same tech incubator that birthed Stripe, AirBnb, and countless other unicorns.When Lambda School launched in 2017, critics likened ISAs to indentured servitude, but by 2019 it was Silicon Valley's golden child. Every day, Austen tweeted jaw-dropping results.These results blew away other bootcamps, proved the power of "incentive alignment," and belonged on the front page of LambdaSchool.com.With these results, Austen challenged college head-on.Esteemed names in tech became cheerleaders as they watched the company build bridges for the poor and needy to cross over into tech. On Reddit, the slightest criticism was drowned by mobs of supporters. In Silicon Valley, entrepreneurs envied the hype, and "Lambda School for X" became a meme.Just as Amazon started selling books only to grow into the everything-store, Lambda School expanded beyond programming and into design. In 2019, their first UX class continued their legendary results.In an interview with Wired that year, Austen said his next target was nursing. Behind closed doors, he negotiated with venture capitalists to value the company at $1 Billion. Lambda School was set to become the next unicorn.There was just one problem: the program didn't work.In early 2020, leaked communications with investors exposed dismal results. Most students weren't hired. What little money the school made came from quietly reselling student debt to hedge funds.It turned out the income share agreements were rigged. When graduates landed jobs unrelated to programming— everything from legal assistant to mailman— the company went after them anyway.Following the leaks, the company lost control of the narrative and their cheerleaders turned on them, realizing Lambda School was just another Uber, an unethical, untenable, profit-driven startup who took a gambit evading the law, hoping to grow too big to fail before the law catches up. Except Uber was good at being bad, and Lambda School combined malfeasance with incompetence, burning up to $11.8 million per quarter on a business that didn't work.In under two years, Lambda School went from the hottest startup in Silicon Valley to a veritable pariah, unable to raise money as its bank account drained. As executives fled and investors expunged it from their resumes, a series of layoffs cut the school's staff from hundreds to dozens. With mounting legal bills and an unredeemable brand, the company rebranded as, "The Bloom Institute of Technology." Disgruntled employees leaked the news a few days early, robbing the company the power to spin it as anything more than failure. Things got worse from there, and we'll get to it. First I need to address a common question: what do I have to do with any of this? I have no professional or personal connections to the company or the team. What compelled me to follow this story for the last five years?On the surface, this is another window into the 2010's tech bubble, a period where mediocre people could raise ludicrous money amid a venture capitalist echo chamber fueled by low-interest rates. But what makes this any worse than Juicero, Clinkle, or Humane? Why does this rise to the level of Theranos?These stories hinge on their villains, whose hubris and stupidity end in comeuppance. Theranos had Elizabeth Holmes, Fyre Festival had Bobby McFarlane, and Lambda School has Austen Allred.Austen's Twitter bio reads, "Will tweet as I wish and suffer the consequences," and it's true, as his 40,000 tweets provided damning evidence in his numerous legal battles. When he isn't promoting the company and attacking critics, he shares his love of capitalism, free markets, and his favorite billionaire.Just as Elizabeth Holmes mimicked Steve Jobs, Austen obsesses over Elon Musk. In 2016, he put his entire life savings into Tesla stock. When Lambda School raised its first round of financing, he tweeted "Funding Secure," a nod to Elon's infamous tweet. Austen role-played as Musk, but lacked the power to get away with his antics.Austen thought he could fake it 'till he made it. He lied about students getting jobs, the success of the company, and he even lied about being homeless.The moment that defines Austen came on October 27th, 2021. A catastrophic leak revealed his company spiraling toward bankruptcy, and a confidential slide deck proved once and for all that Austen had lied about the job numbers. With nowhere left to hide, it was finally time to admit everything and apologize. Instead, he retreated to narcissism, burning any bridge to redemption.While his mind went to his own greatness, mine turned to his victims. I began tweeting about Lambda School in 2019, and the more I tweeted, the more students shared messages like this:Hi Ben I just wanted to say thank you for your effort in exposing Lambda School. I was a student there and had a terrible experience. I dropped out last year (still on the hook for the 30k ISA) and since have been avoiding reading anything related to the school for my mental health. It sucks so bad that they are getting away with all of this, especially when the students are mostly minority or people who are in vulnerable positionsLambda School targeted single mothers, the disabled, reformed convicts, and people struggling with serious medical problems. They lost tens of thousands of dollars, some lost years of their lives, on a broken, predatory program.When students surfaced problems to staff, staff blamed the victims, gaslighting them with, "Trust the process," or blaming everything on "imposter syndrome." As the company unraveled, upset students overran the official /r/LambdaSchool subreddit with criticism. As Austen deleted posts, students created a rogue Discord to discuss legal options. Austen tried to contain things by pretending to be a student under a sock puppet account.His efforts to save his subreddit proved hopeless, and so he set it to private. This is generally how the company handled victims. Upon enrollment, students sign away many rights to legal action, not that it matters much, as most students lack the resources to hire lawyers.The rare time a victim scrounges together the resources to take legal action, the company rolled over, knowing they didn't stand a chance in court. However, they only released students from their contracts if they agreed to sign a non-disclosure agreement, robbing students the freedom to warn others.I thought Emily Bruner would find justice. A single mother who signed up for Lambda School based on false job placement rates, Emily thought it would change her life, only to be saddled with a $30,000 debt. Emily was in luck, because Lambda School forgot to make her sign away her rights to sue. Her case was taken up by a non-profit legal organization that stands up for students taken in by predatory, for-profit schools.After a long legal battle, Lambda School finally settled out of court, but Emily wasn't there to celebrate. She passed away suddenly the year before, at the age of 30, leaving behind her daughter.A famous physicist said, "There are some things so serious that you have to laugh at them," and if there's anything that makes this story palatable, it's Austen's brazen stupidity. Consider how easy it was to connect him to his sock puppet account: he linked to his own tweets, and even posted a video of his golf swing.This is a story about Austen, his victims, and a once-shining startup that Silicon Valley wishes everyone would forget. How did it rise so fast and unravel even faster? We need to back up and replay Lambda School's collapse, in slow motion. It starts with the mystery of why venture capitalists handed over so much money. The Early Years Selling a Dream To Students and Investors The rise of the 2010's tech bubble saw an explosion of tech jobs paying six figures. Just as most of the money in a gold rush goes to shovel salesmen, people who can't land high-paying jobs in tech sell training. You could find code bootcamps everywhere, from legit looking classrooms to some sketchy dude's house.California has a bad history with this sort of education grift. Back in the 1980s, the state was the "Diploma Mill Capital of the World," and in response, they established a bureau to regulate for-profit schools called the BPPE. This bureau has nothing to do with accreditation. They don't care if you run a flat-earth school, they just want to make sure that you don't go around claiming 90% of your graduates get jobs as sea captains.The BPPE went to work reigning in the flood of sketchy bootcamps, and by 2017, the combination of BPPE penalties, negative press, and general word of mouth left "code bootcamp" with the same sullied reputation as DeVry or The Art Institute.As just another bootcamp late to the fad, Lambda School didn't stand a chance. But in 2017, common sense didn't apply to VC backed startups. This was a wild time when WeWork was worth twenty billion dollars. Lambda School just needed their pitch.One of the first questions a venture capitalist asks is, "Why now?" Uber arrived at a time when taxis were annoying and everyone had a computer in their pocket. What made education ripe for disruption? Skyrocketing college tuition.Via educationdata.orgThe problems in higher education are complicated, from the rise of predatory for-profit schools to the funding cuts at public colleges. It's out of the scope of this story.Within the context of 2017, Lambda School's hook, "We don't get paid until you do," resonated with a generation saddled with insurmountable student debt. People were desperate for a solution, and venture capitalists were thirsty to get in on it.Another problem familiar to tech VCs was the difficulty hiring coders during this boom. Tech companies were no longer gatekeeping jobs to college degrees, and some big tech companies started apprentice programs that welcome boot camp graduates.Lambda School's 2017 Demo Day PitchWhen VCs looked at Lambda School, they saw a company with the potential to decimate Computer Science degrees the same way Uber destroyed taxi medallions.At the same time, Income Share Agreements had a huge red flag in the form of decades of failed experiments. Milton Friedman proposed ISAs as far back as 1955, and many schools experimented with them over the years, from Yale in the 1970s to Purdue in 2016, shortly before Lambda School. Every school that tried them abandoned them, for reasons we'll learn in a bit.Another red flag should have been the team. Austen cofounded the company alongside Ben Nelson and Caleb Hicks, two unremarkable former bootcamp instructors barely worth mentioning. Austen was the star of the show, but what did he bring to the table?At the time, Austen's 53,000 followers on Twitter created an illusion of importance. At least, until you come across his bragging about a bot army and follow spam on Hacker News.Austen had just packaged this sketchy advice into an eBook called, Secret Sauce: The Ultimate Growth Hacking Guide, which promised to show you how to "Exploit loopholes in social networks for major growth." It's a window into how Austen thinks about marketing.Austen wrote that book as a side-hustle, while his day-job was in marketing at LendUp, a payday loan company eventually shut down by the Consumer Financial Protection Bureau for deceptive marketing.I'm not surprised VCs gave Austen a pass on his work history, given LendUp was another Y Combinator company. I'm surprised they thought he could build a business. Bootcamps and mildly successful eBooks are small-potato endeavors that VCs label "lifestyle business". It takes very different skills to build a billion dollar company, and Austen was a mere carnival barker.I think VCs were blinded by ideology. Silicon Valley leans libertarian, with part-time Y Combinator partner Peter Thiel bemoaning college and offering $100,000 to entrepreneurs willing to skip it to build a startup. Thiel's donation of $1.25M to Trump's 2016 campaign, along with a rousing endorsement at the Republican National Convention, finally created enough backlash to cause the firm to sever ties, but Y Combinator's founder, Paul Graham, sits so adjacent to Thiel that Graham even asks him to review his blog posts. Graham is the type of guy who thinks his early investment in DoorDash was a good thing for the world.Austen pitched investors that the real problem in higher education is how schools make money regardless of whether or not you get a job. If schools only got paid when a student makes money, there's "Incentive Alignment." VCs like Graham fell for it because if all you know is capitalism, everything looks like a free-market problem.In many ways, Lambda School mirrored the model of venture capital. Firms bet on a large batches of companies, and the money from the big successes make up for the flops. Funds even have incentive alignment in the form of bonuses the fund managers make when investments pass profit milestones.Graham took Austen under his wing, and when the company unraveled years later, Graham leaped to Austen's defense. To this day, Graham has never admitted any wrongdoing by Lambda School. The Product With millions of dollars in the bank and the backing of the biggest names in Silicon Valley, the cards were stacked in Lambda School's favor. All they had to do was deliver a solid education. They didn't. Actually, it kind of sucked.At its best— burning money at an unfathomable rate— Lambda School was on-par with an average code bootcamp. Students got a taste of programming, but when it came to getting hired, neither the training nor credentials held a candle to a college degree. Yet Lambda School regularly compared itself to college in its marketing, promising, "The depth of a 4-year degree, the practicality of a bootcamp."An excerpt from Lambda School's front '''
year_published = 2024
year_updated = 2024
