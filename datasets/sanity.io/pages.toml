ation to learn more about installation, configuration, and getting started with video.Claim $50 in pay-as-you-go credits! New to Mux? They're offering $50 in pay-as-you-go credits to get you started. Sign up for a Mux account and when you're asked “How did you hear about Mux?” just select “Promo Code” and enter SANITYUPDATE.Sign upNeed help? Reach out to the friendly Mux support team at support@mux.com. They’ll be happy to guide you through the process and answer any questions."
