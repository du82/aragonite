["https://sanity.io/docs/localization"]
title = "How to Localize Content (Documents & Fields) - Sanity"
description = "Localize your content"
full_description = '''LocalizationLocalize your contentLocalizing UI vs localizing contentThis article is about how to localize the content you manage in Sanity Studio. To learn about how to change the UI language of your studio, visit this article, or visit this article if you want to learn about adding internationalization to your plugins.Best practiceLocalization in Sanity is performed by storing language data as a value of a field in a document.We recommend using these two optional plugins to simplify creating and maintaining localized documents and fields in Sanity Studio.For translated documents, we recommend the @sanity/document-internationalization plugin, which will relate translations as references and handle setting a “language” field value on documents.For translated fields, the internationalized-array plugin can be used with any field type and scales to as many languages as you may need to author.Methods of localizationSanity allows you to model translated content as it makes the most sense to your workflow and content structure. There are two main approaches:Field level localization A single document with content in many languagesRequires you to publish content in all languages simultaneouslyAchieved by creating an array or object that generates a field for each language valueBest for documents that have a mix of language-specific and common fieldsNot recommended for Portable Text when using localized objects - you should use localized arrays instead, which helps minimize attribute usage.Document level localization A unique document version for every languageAllows the option to publish each language version independentlyReferences join language versions togetherBest for documents that have unique, language-specific fields and no common content across languagesBest for translating content using Portable TextYour preferred method will depend on your use case, content model, and publishing workflow. Each document’s schema plays a role in deciding the appropriate localization strategy, so you may use both in a single project.We offer simple plugins for both strategies to improve the authoring experience in Sanity Studio.Sanity Studio walkthroughExample repositoryThis Course Platform Demo is a Sanity Studio and Next.js front-end showcasing internationalized schema, popular plugin configuration, and how to query for localized content.Field-level translations<img src="https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?rect=1,0,1183,750&amp;w=800&amp;h=507&amp;fit=clip&amp;auto=format" alt="An object field schema where each language is represented by its own unique field input for the value" loading="lazy" srcSet="https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?rect=1,0,1182,750&amp;w=320&amp;h=203&amp;fit=clip&amp;auto=format 320w,https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?w=480&amp;h=304&amp;fit=clip&amp;auto=format 480w,https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?rect=0,1,1184,749&amp;w=640&amp;h=405&amp;fit=clip&amp;auto=format 640w,https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?w=720&amp;h=456&amp;fit=clip&amp;auto=format 720w,https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?rect=1,0,1183,750&amp;w=800&amp;h=507&amp;fit=clip&amp;auto=format 800w,https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?w=960&amp;h=608&amp;fit=clip&amp;auto=format 960w,https://cdn.sanity.io/images/3do82whm/next/63887c9523d79a127a77ae43aeb1ef9b8490f83c-1184x750.png?w=1184&amp;h=750&amp;fit=clip&amp;auto=format 1184w" sizes="(max-width: 720px) 100vw, 720px" class="Image_img__5ZmPX"/>An object field schema where each language is represented by its own unique field input for the valueInstead of using a single field for a single value, field-level translations are created by building arrays or objects with a field for each language representing that value.This is most useful in document schemas where only some fields in the document require translation. For example, a person will use the same name and photo in every language, but their title would need localizing.So we create a structure like this with a title field for each language:<img src="https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=800&amp;h=450&amp;fit=clip&amp;auto=format" alt="Visual representation of a &quot;presenter&quot; schema where some fields are global and some are localized" loading="lazy" srcSet="https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=320&amp;h=180&amp;fit=clip&amp;auto=format 320w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=480&amp;h=270&amp;fit=clip&amp;auto=format 480w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=640&amp;h=360&amp;fit=clip&amp;auto=format 640w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=720&amp;h=405&amp;fit=clip&amp;auto=format 720w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=800&amp;h=450&amp;fit=clip&amp;auto=format 800w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=960&amp;h=540&amp;fit=clip&amp;auto=format 960w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=1280&amp;h=720&amp;fit=clip&amp;auto=format 1280w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=1440&amp;h=810&amp;fit=clip&amp;auto=format 1440w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=1600&amp;h=900&amp;fit=clip&amp;auto=format 1600w,https://cdn.sanity.io/images/3do82whm/next/f2f18425284fdeb72cbc26732b9cb0726363b703-1920x1080.png?w=1920&amp;h=1080&amp;fit=clip&amp;auto=format 1920w" sizes="(max-width: 720px) 100vw, 720px" class="Image_img__5ZmPX"/>Visual representation of a "presenter" schema where some fields are global and some are localizedSchema for localized objectsSince Sanity schema definitions are written in JavaScript, you can programmatically define the language properties for these localized versions of fields. Adding languages becomes a task of expanding the list of languages, and all fields will be expanded to include them.In the following code example, we are also using the fieldset feature of objects to group every language value except a "base language" into a collapsible group in order to tidy up the Studio document editor.GotchaCreating localized objects is fine for a few languages and fields, but it risks rapidly increasing your attribute count with many languages. Consider using arrays instead with the help of a plugin, detailed below.// ./schemas/localeStringType.ts import {defineType, defineField} from 'sanity' // Since schemas are code, we can programmatically build // fields to hold translated values. We'll use this array // of languages to determine which fields to define. const supportedLanguages = [ { id: 'en', title: 'English', isDefault: true }, { id: 'no', title: 'Norwegian' }, { id: 'fr', title: 'French' } ] export const baseLanguage = supportedLanguages.find(l => l.isDefault) export const localeString = defineType({ title: 'Localized string', name: 'localeString', type: 'object', // Fieldsets can be used to group object fields. // Here we omit a fieldset for the "default language", // making it stand out as the main field. fieldsets: [ { title: 'Translations', name: 'translations', options: { collapsible: true } } ], // Dynamically define one field per language fields: supportedLanguages.map(lang => ({ title: lang.title, name: lang.id, type: 'string', fieldset: lang.isDefault ? null : 'translations' })) })ProtipGeneralizing objects into their own “named types” makes them easily reusable across different documents. Many fields with unique name values could use this same localeString type.// ./schemas/presenterType.ts import {defineType, defineField} from 'sanity' import {baseLanguage} from './localeStringType.ts' export const presenterType = defineType({ title: 'Presenter', name: 'presenter', type: 'document', fields: [ defineField({ name: 'name', type: 'string' }), defineField({ name: 'title', type: 'localeString' }), ], preview: { select: { title: 'name', subtitle: `title.${baseLanguage.id}` } } })ProtipThe IANA language tags can be helpful when selecting identifiers for your supported languages.Plugin for localized objectsTo clean up the UI of a document with localized fields, you may choose to install the language filter-plugin to allow editors to hide languages they won’t need to interact with.Querying localized objects with GROQHere is an example of content structured according to this schema, as it appears fetched from our query API:*[_type == "presenter"][0]{ name, title }{ "name": "Rune Botten", "title": { "en": "Rune is a solution architect at Sanity.io", "es": "Rune trabaja como arquitecto de soluciones en Sanity.io", "no": "Rune jobber som løsningsarkitekt hos Sanity.io" } }When using this content in a front-end, you can fetch the full document as above or return a specific title field value depending on which locale you are interested in displaying.This example fetches only the English title and returns that value in the title property:*[_type == "presenter"][0]{ name, "title": title.en }This will return the following JSON from our previous content example:{ "name": "Rune Botten", "title": "Rune is a solution architect at Sanity.io" }If you query the title in a language that might not have a value set yet, you can use the coalesce function in GROQ to provide a fallback. In this case, the title.sv property won't have a value (since no sv language value is set in our example), so the English value is used instead, returning the same JSON as the example above. It would have fallen further back to the string Missing translation if it had not had an English value set either.*[_type == "presenter"][0]{ name, "title": coalesce(title.sv, title.en, "Missing translation") }Lastly, you may prefer to use variables in your GROQ query so that the query does not need to change when your desired language changes – just the values of the parameters supplied to the query:*[_type == "presenter"][0]{ name, "title": coalesce(title[$language], title[$baseLanguage], "Missing translation") }Localized arrays<img src="https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?rect=0,1,1184,565&amp;w=800&amp;h=382&amp;fit=clip&amp;auto=format" alt="Any array field where each item stores the content and the language as field values – this input is customised by the internationalized-array plugin" loading="lazy" srcSet="https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?w=320&amp;h=153&amp;fit=clip&amp;auto=format 320w,https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?rect=0,1,1184,565&amp;w=480&amp;h=229&amp;fit=clip&amp;auto=format 480w,https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?w=640&amp;h=306&amp;fit=clip&amp;auto=format 640w,https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?w=720&amp;h=344&amp;fit=clip&amp;auto=format 720w,https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?rect=0,1,1184,565&amp;w=800&amp;h=382&amp;fit=clip&amp;auto=format 800w,https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?w=960&amp;h=459&amp;fit=clip&amp;auto=format 960w,https://cdn.sanity.io/images/3do82whm/next/fe2c05e0bfc65df9f4a5132bb8a1b2d827afc8e5-1184x566.png?w=1184&amp;h=566&amp;fit=clip&amp;auto=format 1184w" sizes="(max-width: 720px) 100vw, 720px" class="Image_img__5ZmPX"/>Any array field where each item stores the content and the language as field values – this input is customised by the internationalized-array pluginYou may prefer to create localized fields in an array structure for projects with many languages. Arrays use fewer unique attributes than objects using this method.Here is a quick explanation of how language objects impact attributes.An object for a string field with three languages creates these attributes:title title.en title.fr title.esYou create another unique attribute in your dataset for every new language you add.An array of objects to store both a language and field value could create attributes like this:title title[] title[]._key title[].language title[].valueUsing the language field to store the language and value to store the field’s content, you can add many more languages without using more attributes.The built-in array component is not best suited to authoring like this – as every array item needs to open in a popup dialog – but there is a solution.Plugin for localized arraysThe internationalized-array plugin has a custom UI that can be used for any field type and renders each field input without a popup dialog.It also saves an extra attribute by writing the language value to the _key field – something you cannot customize in the Studio with a regular schema.Querying localized arrays with GROQNow performing the same query for name and title but with the title stored in an array, using the internationalized-array plugin.*[_type == "presenter"][0]{ name, title }You will receive this data:{ "name": "Rune Botten", "title": [ { "_type": "internationalizedArrayStringValue", "_key": "en", "value": "Rune is a solution architect at Sanity.io" }, { "_type": "internationalizedArrayStringValue", "_key": "es", "value": "Rune trabaja como arquitecto de soluciones en Sanity.io" }, { "_type": "internationalizedArrayStringValue", "_key": "no", "value": "Rune jobber som løsningsarkitekt hos Sanity.io" } ] }To avoid over-fetching, update the query to: Filter this array to just the language field _key you need Only return the value field*[_type == "presenter"][0]{ name, "title": title[_key == "en"][0].value }Now the returned data is filtered down to just what you need:{ "name": "Rune Botten", "title": "Rune is a solution architect at Sanity.io" }You can use the coalesce() GROQ function to fall back to another value if the targeted one is not yet set:*[_type == "presenter"][0]{ name, "title": coalesce( title[_key == "en"][0].value, title[_key == "nl"][0].value, "Missing translation" ) }For the most flexibility, use variables so that your query remains the same but will adapt to whichever parameters you pass into it.*[_type == "presenter"][0]{ name, "title": coalesce( title[_key == $langu'''
