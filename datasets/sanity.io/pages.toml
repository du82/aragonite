["https://sanity.io/careers/staff-accountant-sf"]
title = "Staff Accountant | Sanity"
description = "We are looking for a Staff Accountant to join our team. This position is a hands on job and provides the opportunities to learn the full cycle accounting MEC process. The team is high-energy and considerate and yet deadline driven and highly efficient."
full_description = "CareersStaff AccountantYou will be reporting to the Accounting Manager. You will be an integral part of the Accounting team. The Individual must have a strong operational and general accounting background and is willing to work at a fast paced start-up environment.Sanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems so companies like PUMA, Spotify, Figma, Riot Games, and Skims can create amazing digital experiences for their customers.Individuals must be self-starters, have a good work ethic, be action driven, flexible in changing direction and methods, and thrive in a fast-paced environment. The individual will manage multiple priorities, succeed in communicating with all levels within the organization and provide immediate contributions to the accounting department.This is a hands-on position with other miscellaneous administrative responsibilities associated with the operations of the accounting department in partnership with relevant departments across the company. The individual will be responsible but not limited to general day to day accounting and operating processes, support and run the daily accounting function and assist with ad-hoc projects and annual audits.What you would do:Day to day operations Full cycle accounts receivable: Oversee collections and monitor contract renewals in collaboration with the Sales team. Review and issue customer invoices, ensuring accuracy and timely resolution of customer inquiries.Full cycle accounts payable: Review vendor bills for accuracy, ensuring proper GL and departmental categorization. Manage vendor relationships and address payment issues promptly. Oversee the AP system and virtual credit card (VCC) processes.Month End Close Reconcile credit card transactions to ensure accuracy and completenessReview and resolve monthly cash reconciliationsPrepare and review month-end close schedules, including prepaids, accruals, and OpEx allocationsAssist with monthly flux analysis for the balance sheet and income statement to identify variances and trendsAd-Hoc project - listed but not limited to Internal and external Audits Implementation and maintenance of relevant software Additional accounting projects as they come upAbout you:Based in: San Francisco and will work at least 2-3 days in our San Francisco officeBS/BA Degree in finance or accounting or in relevant fields2-3 years of related accounting experience with an emphasis on operational accounting in a high-growth/fast-paced startup is preferred Experience with Netsuite and Airbase or similar payment tools preferred Strong communication skills, written and oral as this job is a hybrid role; A team player with experience working in remote/hybrid culture Structured, organized and attention to detail is a must Hard working and willing to roll up your sleeves to perform any given task Be curious and ask questions / speak up Solid experience in full cycle AR and AP processStrong understanding of core accounting principles, including debits, credits, prepaid expenses, accruals, and other fundamental accounting conceptsApply here!Apply for the position here!What we can offer:A highly-skilled, inspiring, and supportive teamPositive, flexible, and trust-based work environment that encourages long-term professional and personal growthA global, multi-culturally diverse group of colleagues and customersComprehensive health plans and perksA healthy work-life balance that accommodates individual and family needsCompetitive stock options programSalary range: $83,000 - $90,000Who we are:Sanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems. One of our big differentiators is treating content as data so that it can be stored in a single source of truth, but seamlessly adapted and personalized for any channel without extra effort. Forward-thinking companies choose Sanity because they can create tailored content authoring experiences, customized workflows, and content models that reflect their business.Backed by Netlify, Vercel, the founders of Twitter and Medium, Heroku’s ex-CEO, and leading VCs like ICONIQ Growth, Threshold Ventures, and Lead Edge Capital, Sanity is at the epicenter of the modern digital product development stack.You can only build a great company with a great culture. Read about our values and join us in building a diverse and inclusive team.Sanity.io pledges to be an organization that reflects the globally diverse audience that our product serves. We believe that in addition to hiring the best talent, a diversity of perspectives, ideas, and cultures leads to the creation of better products and services. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, or gender identity.LocationSan Francisco and will work at least 2-3 days in our San Francisco officeLocation TypeHybridTeamFinanceApply for this position"
