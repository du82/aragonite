full_description = "To grow your business, you need a CMS that drives your business goals. Sanity enables you to unlock the full potential of your Shopify store. Product pages shouldn’t be one-size-fits-all. Fully personalize all the content on your site, including product and category pages, even if you don’t know how to code. Customers crave authentic stories that help them connect with a brand. But telling a coherent story while also maintaining the nuts and bolts of your site is a complicated, never-ending job. Shopify and Sanity enable you to create an experience that customers love—without the added complexity. Used as a headless CMS, Sanity applies a structured content approach and treats all content as data. This makes it easier for you to update, add, move, and test new content without constantly reinventing the wheel. Whether you’re migrating from another CMS or expanding the capabilities of your store, here’s how Shopify and Sanity can help you get ahead. Connect products that are more likely to drive increased attachment rates to high value items, or provide better related product information by deriving relationships from your content structure. These recommendations can be flowed over APIs to outbound campaigns over any channel, such as email or SMS. Create loyalty programs that leverage structured content to drive repeat purchases and increase lifetime value. As customers shop, suggest related products that can be redeemed by customers based on their purchasing history and point values. Combining product data with structured content creates a smoother editing experience. Instead of chasing down data across your site, continuously synchronize Shopify to Sanity, including products, variants, and collections. Sanity was built with developers in mind. Build up-to-date storefronts without compromising quality, expertise, or SEO, using Shopify's latest technology, Hydrogen and Oxygen. Easily set up the CMS and integrate with your favorite tools so you can hit the ground running."
