["https://sanity.io/create"]
title = "Sanity Create: AI Writing Assistant - Free Early Access | Sanity"
description = "The new way to write that embraces the creative process and equips you to create better content, faster."
full_description = '''Early AccessSanity CreateThis is how we write now.The new way to create content that embraces the creative process and helps you deliver better and fasterTry Create for freeContext curatedYour team, your notes, your half-baked ideas. All in one place and tidied up.Distraction-freeA collaborative space for creativity with exactly (and only) the features you need.AI-acceleratedThe AI ghostwriter takes your lead and is always on top of your latest notes.Structured for deliveryAutomatically moves content into the structure of your Sanity Studio.Sanity Create in 5 minutesSee how Sanity Create separates itself from other authoring experiences, and with content mapping, can deliver free-form authored content into your applications as structured content in real-time.{"@context":"https://schema.org","@type":"VideoObject","url":"https://youtu.be/BhL-MJ3CglU","embedUrl":"https://www.youtube-nocookie.com/embed/BhL-MJ3CglU?rel=0","thumbnailUrl":"https://i.ytimg.com/vi/BhL-MJ3CglU/maxresdefault.jpg","name":"Sanity Create in 5 minutes","description":"Watch on YouTube","uploadDate":null}Sanity Create unlocks the future we've imagined for our content workflows. It's the missing piece for how editors work to create the best content out there.David AnnezVP of Product, loveholidaysGatherCollect notes, briefs, plans, loose ideas, facts and style guides from across your collaborators. Keeping yourself, your team and your AI assistance aligned.WriteWrite in a distraction-free, creative space. An AI ghostwriter is always ready to assist: following your lead, feeding you lines when you ask for them (and stepping aside the moment you take control).CollaborateInvite your team or contributors to create along with you. Enjoy the same comments, tasks, and revision history features you know and love from Sanity Studio (coming soon).Content Mapping to StudioTransform free-form writing in to your Studio's content model instantly. Let AI do the chores. No more manual field mapping or reformatting—just write naturally and ship faster.What can you do with Sanity Create?Use it to write faster, yes, but also to write better. Use Sanity Create as a trusted partner to expand your creativity and provide feedback as you work.Marketing contentGet the context that's in your head into Create, set your goal, and start writing. Call on Create to ghostwrite, ideate, or add assets as you go. Articles and talksTurn your unique point-of-view into a compelling story faster with Create there to suggest flow and phrasing. Your bold ideas, captured.Docs and guidesShare the specs, style, and tag team with Create to write accurate educational content. Then, let Create pressure-test clarity for your readers.Content adaptationsTurn a blog post into a video script, or a webinar into an article. Create takes your original content and brings the story to life for a new medium or context.Ideation and strategyEngage Create as a thought partner to brainstorm tactics or as a sounding board as you frame proposals. You don’t even need to bribe it with coffee.Real-world exampleWhat writing looks like nowSee how Sanity CTO Simen Svale used Sanity Create to write a real blog post (and borrow his tips and tricks as you build your own).Join the evolutionIt's free to use in Early Access. You don't need developers or a Sanity Studio to use it. Just sign in and you'll be creating in no time.Try Create for free'''
