["https://sanity.io/blog/community-digest-august-24-edition"]
title = "Sanity Digest - August ‘24 Edition | Sanity"
description = "New Sanity features like the Live Content API, a live feedback session with Lee from Vercel, a new library for rendering portable text in Angular, and more!"
full_description = '''BlogSanity Digest - August ‘24 EditionNew Sanity features like the Live Content API, a live feedback session with Lee from Vercel, a new library for rendering portable text in Angular, and more!Published August 9, 2024KapeheDeveloper Community Enablement Manager at SanityTable of ContentsTable of ContentsProduct newsHigh-Frequency CDN & Live Content API Auto updates for the StudioArray selector for the StudioEnhanced copy & paste for the StudioLive Feedback Session with Next.jsCommunity ContributionsRendering Portable Text in Angular just got easierA collection of delicious Tour de France recipesEvents 👏 Events 👏 Events 👏Virtual Developer Deep Dive, Aug. 20eTail East in Boston, Aug. 12-14Product-Led Summit in SF, Sept. 4-5That’s all, Folks!Sanity Learn×Below, you'll find a collection of new features and updates to the Studio from our engineering team, contributions from the community to the Sanity Exchange, and where to get started with your Sanity experience. Let's get right to it!Product newsThe engineering team always thinks of new features to add to Sanity to enhance your content experience. Check out what's new from the past month.High Frequency CDN & Live Content API for all contentFor Sanity Studio:Auto updatesArray selector updatesEnhanced copy & pasteDemos of these new features and updates can be found below from the engineers who built them! High-Frequency CDN & Live Content API The Live Content API and the CDN allow you to serve millions of visitors with real-time content updates.Auto updates for the StudioAdd autoUpdates to your config to keep your Studio up-to-date!Array selector for the StudioThe array field is often used for page builders and other types of "sectionized" content with various block types. It just got a big editorial experience upgrade:Array item types can be filtered with searchCategorize items into groupsAdd previews for items to give content creators visual cuesEnhanced copy & paste for the StudioFrom single fields to complex objects, the new copy & paste feature will save you lots of time.✨ Want to catch the full video? You can find that here:{"@context":"https://schema.org","@type":"VideoObject","url":"https://www.youtube.com/watch?v=epp-9VR1-Xk","embedUrl":"https://www.youtube-nocookie.com/embed/epp-9VR1-Xk?rel=0","thumbnailUrl":"https://i.ytimg.com/vi/epp-9VR1-Xk/maxresdefault.jpg","name":"Sanity: What's New. July/August 2024","description":"Watch on YouTube","uploadDate":null}Live Feedback Session with Next.jsLee from Vercel and our own Knut did a live feedback session with James and his in-prod website, Redshirt Sports. It all started with James's post on X asking Lee and Knut to help him fully utilize Next.js and Sanity in his app. Well, the schedules lined up, and we got all three on a stream together.They covered performance, build times, editorial experience, SEO, and more!Watch the full feedback session here.{"@context":"https://schema.org","@type":"VideoObject","url":"https://www.youtube.com/watch?v=OX5WxwdcefU","embedUrl":"https://www.youtube-nocookie.com/embed/OX5WxwdcefU?rel=0","thumbnailUrl":"https://i.ytimg.com/vi/OX5WxwdcefU/maxresdefault.jpg","name":"YouTube video in Sanity.io","description":"Watch on YouTube","uploadDate":null}Community ContributionsOur community is building amazing things with Sanity. Let's highlight a couple of them from the past month!Share your Sanity powered projects, code snippets, and more to the Sanity Exchange. Or need inspiration? The Exchange has loads of cool ideas and snippets.Rendering Portable Text in Angular just got easierRendering Portable Text in Angular projects just got easier! You can now use the new @limitless-angular/sanity library from Alfonso when building with Sanity and Angular. Run the command npm install @limitless-angular/sanity to start using the library today.This is now listed under Sanity's Portable Text GitHub repo, along with many other tools for serialization. Head to the repo to check them all out.Want a guide on how to use this plugin? Alfonso has written up a full guide on this.Huge thanks to Alfonso for creating and sharing this with the community!A collection of delicious Tour de France recipesDon't just watch the race; taste the race! The Tour de France may be over, but that doesn't mean you can't grab recipes from the different locations it hit. Built with Sanity, check out Flavours of the Tour built by Miha.Awesome project, Miha! Thanks for sharing it with all of us!Events 👏 Events 👏 Events 👏We may be coming to a location (or computer) near you soon! 👀Virtual Developer Deep Dive, Aug. 20Developers, this one's for you! Our virtual developer deep dive in August is all about Astro + Sanity plus more! These events are recorded and then uploaded to our YouTube channel. But we’d love to have you join us live! We do a Q&A after each talk, so take the opportunity to ask these amazing speakers anything on their topic.RSVP hereeTail East in Boston, Aug. 12-14Join us at eTail East, where industry professionals gather to explore the latest trends, strategies, and technologies in e-commerce and digital marketing. Visit Sanity at booth #102 to discover our innovative solutions and how they can elevate your business.More info hereProduct-Led Summit in SF, Sept. 4-5Mark your calendars for the Product-Led Summit in San Francisco! This event brings together senior product leaders from top organizations, providing an ideal platform to promote your solutions, forge new relationships, and position your brand at the forefront of the industry. Meet Sanity on the expo floor to learn more about our cutting-edge offerings and connect with leaders driving product innovation.Event details hereThat’s all, Folks!Thank you for reading the Sanity Digest - August ‘24 Edition! You’ll be seeing these monthly, so keep an eye out. Come join us in the Sanity Slack community for updates, announcements, and contributions.Sanity LearnWant to start your Sanity journey? Head to our Learn page to start building today!We've got courses that cover GROQ, Sanity Studio, and TypeGen. Some of our newest courses are:Re-platforming to Sanity - a course for teams to move their legacy content to a modern, fast, and structured content platform.Refactoring content for migration - for developers with techniques for how to migrate content out of a legacy CMS.Migrating content from WordPress to Sanity - for developers, an in-depth and hands-on WordPress migration course.Find all the courses here!Aloha everyone! See y’all at the next one. 🤙Stay in the knowNever miss a Sanity digest! Subscribe to our newsletter to get the monthly digest straight to your email!Subscribe hereTable of ContentsProduct newsHigh-Frequency CDN & Live Content API Auto updates for the StudioArray selector for the StudioEnhanced copy & paste for the StudioLive Feedback Session with Next.jsCommunity ContributionsRendering Portable Text in Angular just got easierA collection of delicious Tour de France recipesEvents 👏 Events 👏 Events 👏Virtual Developer Deep Dive, Aug. 20eTail East in Boston, Aug. 12-14Product-Led Summit in SF, Sept. 4-5That’s all, Folks!Sanity Learn'''
