["https://sanity.io/careers/staff-software-engineer-front-end-web"]
title = "Staff Software Engineer (Front-end) - Web | Sanity"
description = "Join our cross-functional Web team as a front-end web developer and help us build a performant, high-converting, and accessible marketing site using the latest web technologies."
full_description = "CareersStaff Software Engineer (Front-end) - WebSanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems so companies like PUMA, Spotify, Figma, Riot Games, and Skims can create amazing digital experiences for their customers.The Sanity.io marketing site is people’s first impression of Sanity, and to deliver a truly remarkable web experience, we set high standards for design, content, and performance. As a front-end web developer, you’ll be part of a highly skilled and supporting team of developers, designers, and content creators to create a best-in-class marketing site using the latest web technologies (TypeScript, Next.js, Vercel, Sanity).You’ll get the opportunity to contribute to development projects from ideation to production, build out our internal design system and component library, and work alongside the rest of the Web team on user research, experimentation, and rapid iterations. As part of a small, cross-functional team, you’ll also have the freedom to experiment and test out new ideas and technologies.What you would do:Help make Sanity.io a world-class marketing site that delivers a standout experience for developers and tech leaders, while showcasing the power and flexibility of the platform in action.Build a design system and component library to ensure consistent branding and user experience across all surfaces.Improve the site’s performance with appropriate render methods, caching, image optimization, Web Vitals, and other web development best practices.Ensure that our site is accessible by leveraging browser accessibility features.Make data-driven decisions based on user research, experimentation, and rapid iteration.Collaborate with other teams at Sanity, such as Growth, Product Marketing, Content Marketing, and Demand Generation.About you:Based in: Remote in United States, Canada (East Coast/EST only) or EuropeStrong web development generalist who can adapt to new technologies and scenarios and find pragmatic solutions for the problems at handExperience building CMS-powered websites leveraging design systems and component librariesStructured, creative, and enjoy collaborating with developers, designers, and content creators, yet self-driven and able to manage your timeWrite maintainable and high-quality TypeScript, React, and CSS code with an eye for good design/UX and accessibilityFocus on quantitative outcomes and delivering measurable site improvements5+ years of professional experience with modern web developmentPrevious experience with Next.js and Sanity is an advantageNot sure you’re exactly what we’re looking for in this role? Apply anyway!Apply for the position here!What we can offer:A highly-skilled, inspiring, and supportive teamPositive, flexible, and trust-based work environment that encourages long-term professional and personal growthA global, multi-culturally diverse group of colleagues and customersComprehensive health plans and perksA healthy work-life balance that accommodates individual and family needsCompetitive salary and stock options programWho we are:Sanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems. One of our big differentiators is treating content as data so that it can be stored in a single source of truth, but seamlessly adapted and personalized for any channel without extra effort. Forward-thinking companies choose Sanity because they can create tailored content authoring experiences, customized workflows, and content models that reflect their business.Backed by Netlify, Vercel, the founders of Twitter and Medium, Heroku’s ex-CEO, and leading VCs like ICONIQ Growth, Threshold Ventures, and Lead Edge Capital, Sanity is at the epicenter of the modern digital product development stack.You can only build a great company with a great culture. Read about our values and join us in building a diverse and inclusive team.Sanity.io pledges to be an organization that reflects the globally diverse audience that our product serves. We believe that in addition to hiring the best talent, a diversity of perspectives, ideas, and cultures leads to the creation of better products and services. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, or gender identity.LocationRemote in the United States or Canada (Eastern Time/ET only) or EuropeLocation TypeRemoteTeamMarketing Apply for this position"
