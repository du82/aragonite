title = "Senior Support Engineer | Sanity"
description = "We are looking for an experienced and empathic support engineer who is excited about solving technical issues for our enterprise customers. As a support engineer at Sanity, you will work closely with Product and Engineering teams and collaborate with Solution Engineering and Sales around customer-facing activities and initiatives."
full_description = "CareersSenior Support EngineerSanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems so companies like PUMA, Spotify, Figma, Riot Games, and Skims can create amazing digital experiences for their customers.We are looking for an experienced support engineer that loves helping people through their technical hurdles. Our fast-growing enterprise customer base and developer community consist of a wide range of people solving different problems with various frameworks and technologies. To us, it’s important to foster an inclusive and friendly environment and a space where people of different experience levels feel comfortable asking for help. You will have an important presence, interacting with developers from across the world.As our user base grows larger and, with it, the volume of questions and feedback, we also believe it’s important to build tooling, infrastructure and processes to help us incentivize community and customer self-reliance, make it easier to follow up conversations and to pull useful signals out from the activity.What you would do:Work closely with our Enterprise customers to resolve technical issues and answer questionsTroubleshoot bugs, create reusable code snippets, and produce minimal reproducible examples of issuesDevelop standard solutions, author self-serve resources, and improve documentation where neededBe the customer’s voice and use people's feedback to help improve our productSupport Customer Solutions and Sales teams with customer data and technical guidance in pre-sales activitiesBuild and maintain support infrastructure, tooling, and workflowsTake part in Sanity’s developer community rotation and help answer questionsLiaise between customers and internal teams during incidents and escalationsContinuously research best practices and learn existing and upcoming features of Sanity's content platformAbout you:Remote in the United States or Canada Exceptional communication and organizational skills4+ years of technical developer support and hands-on experience using JavaScript, TypeScript, and front-end frameworks like Next.jsExperience debugging complex technical issues with other developers and end-usersPassion for helping others be successful and fulfil their potentialDemonstrated capacity to quickly learn new concepts and technologiesSelf-starter who takes initiative and is energized when there is no obvious solutionNot sure you’re exactly what we’re looking for in this role? Apply anyway!Apply for the position here!What we can offerA highly-skilled, inspiring, and supportive teamPositive, flexible, and trust-based work environment that encourages long-term professional and personal growthA global, multi-culturally diverse group of colleagues and customersComprehensive health plans and perksA healthy work-life balance that accommodates individual and family needsCompetitive salary and stock options programWho we are:Sanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems. One of our big differentiators is treating content as data so that it can be stored in a single source of truth, but seamlessly adapted and personalized for any channel without extra effort. Forward-thinking companies choose Sanity because they can create tailored content authoring experiences, customized workflows, and content models that reflect their business.Backed by Netlify, Vercel, the founders of Twitter and Medium, Heroku’s ex-CEO, and leading VCs like ICONIQ Growth, Threshold Ventures, and Lead Edge Capital, Sanity is at the epicenter of the modern digital product development stack.You can only build a great company with a great culture. Read about our values and join us in building a diverse and inclusive team.Sanity.io pledges to be an organization that reflects the globally diverse audience that our product serves. We believe that in addition to hiring the best talent, a diversity of perspectives, ideas, and cultures leads to the creation of better products and services. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, or gender identity.LocationRemote in the United States or CanadaLocation TypeRemoteTeamSupport EngineeringApply for this position"
