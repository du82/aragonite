["https://sanity.io/content-platform"]
title = "Content platform: Bring your team together with Sanity"
description = "Our content platform helps content creators and digital teams accelerate business by making it easy to manage and deliver content to any website, app, or device."
full_description = '''More than a content management system, Sanity's content platform is a customizable, integrated, and fully-featured home for your digital content. In the 2022 JAMStack Community Survey, Sanity has the highest satisfaction score for content platforms. As a single source of truth for your entire digital presence, Sanity's content platform enables greater reuse and interoperability between presentation layers. Customers experience a unified brand across your channels, increasing your content velocity and decreasing the time it takes to pivot to new channels. Developers and editors can both benefit from a rich ecosystem of plugins, tooling, and libraries, all with an API custom tuned to your needs. Sanity over-delivers on features. If you're coming from a monolithic CMS architecture, it feels like stepping on a spaceship. You can get started in minutes. A custom-built query languageGROQ, or Graph-Relational Object Queries, compares favorably to GraphQL. An open source, extensible rich text formatPortable Text gives you the power to engineer your own deeply structured data model for unlimited types of rich text A simple React SPA back endCustomize Sanity studio by writing your own components. Build workflows, data models, bespoke input components, and easy integrations. Sanity has given us a clean slate and the opportunity to have our content platform match how the entire organization is thinking about content. Sanity's approach to structured content helped us innovate and reconsider the structure of our codebase. I’m now excited to model the entire App UI within Sanity. Sanity is a step beyond your average "CMS", and out of all the headless products I've worked with (which is probably all of them now), it's by far the best. Structured, connected content FTW! Sanity has helped us transform the way we deliver content. It’s easy to customize and extend to meet our growing business needs.'''
