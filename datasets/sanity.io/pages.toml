["https://sanity.io/blog/how-to-make-a-recipe-site-that-scales-well"]
title = "How to make a recipe site that scales well | Sanity"
description = "Bak&del is a site created to solve common frustrations with online recipe sites. Read how Dag used Sanity to make recipe instructions that scale (pun intended)."
full_description = 'BlogHow to make a recipe site that scales wellBak&del is a site created to solve common frustrations with online recipe sites. Read how Dag used Sanity to make recipe instructions that scale (pun intended).Published December 2, 2024Dag StuanManager/engineer at BekkTable of ContentsTable of ContentsHow could it be better?×Recently, Dag Stuan, engineer at Bekk, shared a cool recipe project in the community with nifty use of Portable Text. We asked him to write about his process to make "Bak & del". The name Bak&del is a playful Norwegian pun that combines "bake" (to bake) and "del" (to share), perfectly capturing the spirit of a baking community. As a cheeky bonus, the word bakdel also means “butt” in Norwegian slang—because who says baking can’t have a little spice?One of the best things about programming is that you can solve everyday problems all by yourself. With my latest hobby project, I’m doing just that. Meet bakdel.no (or go here for English version via Google Translate)!The problemIn recent years, I’ve started baking bread and other yeast-based goods at home. I have a few recipes I’ve used for a long time, and I also look up recipes online when I want to bake a different type of bread or other baked goodsThere are countless recipe sources online, so I rarely find recipes in the same place. Many of the sites are “okay” to use, but I often feel there’s more focus on the person publishing the recipe, than on me, the one actually baking. The recipes are filled with the life stories of the bloggers who write them, and packed with ads or affiliate links to things I can buy. Some sites even use a “bait-and-switch” tactic, placing recipes behind a paywall after a while.Although the actual recipes often are good, I also find them challenging to use. When I’m on my phone, I have to constantly scroll between the ingredient list and the recipe text, and the instructions are often packed with information I don’t need.But the biggest issue, and the main reason I created Bakdel, is scaling. When I bake bread, I want to make three loaves at a time because that’s what fits in my oven. The recipes I find are often for one or two loaves, so I have to scale them myself. So when I found myself with an Excel spreadsheet just for baking, I thought to myself “there must be a better way…”.Spreadsheet to scale recipe ingredients.How could it be better?What I wanted, was a place where I could:Store recipes I like in an easy-to-read, well-organized format. Without ads or unnecessary information.Avoid scrolling back and forth between the ingredient list and the recipe instructions while baking.Scale recipes so I can bake three loaves instead of two, or make waffles even if I only have two eggs left in the fridge on a Sunday.The ideaAt Bekk Trondheim, we’ve had a few workshop evenings this fall where we learned to use Sanity and completed the Sanity Developer Certification. Sanity is a content operating system that allows me to define content in the form of “documents” or “objects.” Unlike a traditional CMS, content in Sanity isn’t tied to a presentation layer; it’s more akin to a traditional SQL database or other low-level content abstractions.What sets Sanity apart from other headless CMS solutions is the ability to customize the editor experience. When setting up a project, you’re responsible for configuring Sanity Studio, the user interface for editing content. The studio is very customizable, which makes it relatively easy to tailor an editor experience to the content being created.When I got familiar with how to set up Sanity, I had an idea; what if I could model recipes and ingredients as content in Sanity, and create references to ingredients within a recipe’s instructions? That way, I could create a content model that made it easy to add recipes and link to the ingredients within the recipe text.Caption: Ingredient-reference inside portable text in Sanity.With a bit more logic, I could scale the ingredients dynamically so that adjusted quantities could appear directly in the text. When I showed a small demo to some colleagues, I got the suggestion to add a feature for checking off ingredients as you go, which was also fairly quick to implement. With that, the core product was in place, and most of the time since has been spent on refinement.Recipe with scaled ingredients inside the text.Caption: User interface for scaling ingredientsBelow is a excerpt of the schema code that defines the Portable Text field for Instructions (find all of the code on GitHub):// Definition for the instructions field for Portable Text defineField({ name: "instructions", title: "Instructions", group: ["content"], type: "array", of: [ defineArrayMember({ type: "block", styles: baseBlockStyles.filter((s) => s.value !== "h2"), lists: baseBlockLists, marks: baseBlockMarks, of: [ { type: recipeIngredientReferenceType.name }, { type: scalableRecipeNumberType.name }, ], }), alertArrayMember, imageArrayMember, imageGalleryArrayMember, ], }) ```Other technology choicesWhen I code in my spare time, I try to balance using technology I know well, with trying something new. This way, I stay productive with familiar tools while also picking up some new knowledge along the way. Familiar technology and productivity also help me stay motivated to finish a usable product.Bakdel is built as a Next.js app that includes both the website and the Sanity studio. For styling and UI components, I used Tailwind and Shadcn to speed up the setup. I also hadn’t worked with these before, so it was a great chance to explore a bit of new tech. I also got a bit of a boost from Vercel’s v0 platform to get up and running quickly.The app is hosted on Vercel, with DNS and proxy managed by Cloudflare. Together, these tech choices helped me get to production in a very short time, and the first version of the app was live after just a week of work.Next Steps 🛣️A little over a month later, I have a product I’m quite satisfied with and that I use several times a week when I bake. It’s easy to add new recipes using Sanity Studio, the ingredients are embedded within the instructions, even when the recipe is scaled, and users can scale recipes based on individual ingredients. Plus, there’s minimal unnecessary information, and no ads. 🎉While I have no plans to compete with larger recipe sites, it’s nice to have at least one place to go when I want to bake, where I can easily store the recipes I like. And if others can benefit from the site as well, that’s an added bonus.I plan to incorporate even more scaling logic in the future, and recently I have also added the ability to change measurement units in recipes, allowing users to switch from deciliters to grams in the recipes themselves.If you have a recipe suggestion that’s missing, or if you have any other questions, feel free to reach out with your feedback!You can find the app at bakdel.no, and the source code is available on GitHub.Table of ContentsHow could it be better?'
