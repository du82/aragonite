title = "Senior Technical Product Marketing Manager | Sanity"
description = "We’re looking for a Technical Product Marketer to connect our product’s capabilities to the needs of developers and IT leaders"
full_description = 'CareersSenior Technical Product Marketing ManagerSanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems so companies like PUMA, Spotify, Figma, Riot Games, and Skims can create amazing digital experiences for their customers.We’re looking for a Technical Product Marketer to connect our product’s capabilities to the needs of developers and IT leaders. You’ll craft messaging that resonates with technical audiences, empowering developers to see Sanity as their go-to solution and equipping them to champion its value within their organizations.If you’re passionate about technology, love creating impactful content, and thrive at the intersection of technical complexity and customer empathy, we’d love to hear from you.What you would do:Serve as the bridge between product capabilities and customer needs: Articulate how Sanity solves real-world problems better than alternatives, ensuring our messaging connects deeply with developers and IT leaders.Create clear messaging and materials for Developers, Product Owners and Technical leads: Help technical decision-makers to understand "Why Sanity is for them" by producing targeted resources. Equip developers with the tools to articulate Sanity’s value.Create compelling content: Write blogs, case studies, landing pages, host webinars, record videos, and other artifacts that showcase Sanity’s value and impact to our core ICP audience.Translate technical features into value-driven messaging: Work closely with Product Managers and Engineers to understand Sanity’s capabilities and explain them in a way that’s accessible and impactful.Engage with our developer community and customers: Listen to their challenges, uncover opportunities, and identify key differentiators. Translate these insights into actionable messaging and content that accelerates adoption and highlights Sanity’s unique value.About you:Someone with a unique blend of technology and business expertise, who understands technical concepts deeply and can effectively communicate benefits and value to a wider business audience.Based in: Remote in Europe or United States/Canada (Eastern Time Zone / ET only)5 years experience in a technical or developer-focused role: This could include pre-sales, engineering, Technical Product Marketing, Product Marketing or Product Management (for a developer-first company).Passion for content creation: Enjoys crafting blogs, demos, and other resources that inspire and inform.Knowledge of the Content Management industry: Ideally, experience with headless CMS solutions or adjacent technologies.Understanding of modern Front-end development: Familiarity with building modern digital experiences using frameworks like React, Next.js, and Vue.js, leveraging headless CMS architectures and API integrations for scalable and performant solutions.Strong technical communication skills: Ability to translate complex technical features into clear, value-driven messaging that resonates with developers and IT leaders.Collaborative and curious mindset: A natural communicator who enjoys talking to customers and internal teams, eager to learn about challenges and uncover opportunities.Customer empathy and problem-solving skills: Keen ability to understand technical problems and articulate how Sanity provides solutions.Not sure you’re exactly what we’re looking for in this role? Apply anyway!Apply for the position here!What we can offer:A highly-skilled, inspiring, and supportive teamPositive, flexible, and trust-based work environment that encourages long-term professional and personal growthA global, multi-culturally diverse group of colleagues and customersComprehensive health plans and perksA healthy work-life balance that accommodates individual and family needsCompetitive salary and stock options programWho we are:Sanity.io is a modern, flexible content operating system that replaces rigid legacy content management systems. One of our big differentiators is treating content as data so that it can be stored in a single source of truth, but seamlessly adapted and personalized for any channel without extra effort. Forward-thinking companies choose Sanity because they can create tailored content authoring experiences, customized workflows, and content models that reflect their business.Backed by Netlify, Vercel, the founders of Twitter and Medium, Heroku’s ex-CEO, and leading VCs like ICONIQ Growth, Threshold Ventures, and Lead Edge Capital, Sanity is at the epicenter of the modern digital product development stack.You can only build a great company with a great culture. Read about our values and join us in building a diverse and inclusive team.Sanity.io pledges to be an organization that reflects the globally diverse audience that our product serves. We believe that in addition to hiring the best talent, a diversity of perspectives, ideas, and cultures leads to the creation of better products and services. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, or gender identity.LocationRemote in Europe or United States/Canada (Eastern Time Zone / ET only)Location TypeRemoteTeamMarketing Apply for this position'
