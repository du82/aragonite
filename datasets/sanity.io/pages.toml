["https://sanity.io/docs/how-queries-work"]
title = "How GROQ Queries Work - Step by Step Guide"
description = "A tutorial on using the Sanity query language GROQ."
full_description = '''How Queries Work – GROQA tutorial on using the Sanity query language GROQ.The idea behind our query language GROQ (Graph-Relational Object Queries) is to be able to describe exactly what information your application needs, potentially joining together information from several sets of documents, then stitching together a very specific response with only the exact fields you need.If you need help setting up a client to perform these queries in your front end, you should check out the documentation for the client for JavaScript or PHP. You can also check out the GROQ Arcade if you want to query any JSON source and get familiar with the language.IntroductionLet us start with the basics. We will take this simple query and pick it apart:*[_type == 'movie' && releaseYear >= 1979] A query typically starts with *. This asterisk represents every document in your dataset. To do any useful work this is typically followed by a filter in brackets. The filter above has two terms:The filterFirst, we filter by document type. Every document in Sanity is required to have a type, and the type is always in the _type field. (We prefix any Sanity-specific fields with an underscore in an attempt to avoid clashing with any of your field names.) So _type == 'movie' limits this query to documents of the type ‘movie’. && is the operator “and”.The second term releaseYear >= 1979 assumes that the movies have a field called releaseYear that contains numbers. It will match any document where this number is larger than or equal to 1979.ProjectionsSo if we run this query, the result will be an array containing all movies from the year 1979 onwards in the dataset. Nice! However in a typical application movies might be huge documents containing information on actors, staff, posters, tag-lines, show-times, ratings, and whatnot. If our goal is to render a list of movies in an overview, we are wasting bandwidth. Projections to the rescue.The typical projection is wrapped in braces and describes the data we want to see for each movie. A nice and simple projection for this query would give us the id, title, and release year for each movie. It could look like this: {_id, title, releaseYear}. Putting it all together:*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear } Basic sortingNow there is another problem. Our movies appear in some unspecified order. Let’s say we want to sort our movies by year. For this, we use the order-function. Order takes a number of fields and sort directions and orders your documents accordingly. We wanted to sort our movies by releaseYear. This is easily accomplished with order(releaseYear), like this:*[_type == 'movie' && releaseYear >= 1979] | order(releaseYear) { _id, title, releaseYear } (We need the | operator here in front of the order()-function, we'll discuss that more later.)We think of GROQ statements as describing a data flow from left to right. First everything (*) flows through the filter [_type == 'movie' && …], then all those movies flow through the order()-function which is then all mapped through the projection {_id, title, ...} which picks out the bits we want to be returned.The order function accepts a list of fields, and optionally you can specify the sort direction for each field. If you wanted to sort the movies by year, and then within each year we want them alphabetical by title, we could use this ordering: order(releaseYear, title) And if we wanted the newest movies first, we could reverse the direction like this: order(releaseYear desc, title).Protipasc means “ascending” and desc means descending in this context. If you leave out the sort-direction, Sanity will assume you want the ascending order.Slicing the result setThis brings us to our final problem for this query: There are many movies in the world. Maybe our dataset contains tens of thousands. We need a way to describe which slice of that list we want to show. This is done using a selector. Let’s say we just wanted the first movie, we could add a [0] at the end. This works exactly like an array accessor and would return only the first element. If we want a slice, we can add the range operator like this: [0...100]. This would return the first hundred movies from index 0 through 99. We can just as well ask for [1023...1048] or any other slice we desire. So there we are, our first basic query with filtering, ordering, projections, and selector:*[_type == 'movie' && releaseYear >= 1979] | order(releaseYear) { _id, title, releaseYear }[0...100] References and joinsA reference in Sanity is a link from one document to another. Standard references are “hard” meaning when a document references another document, the target document must exist, and is actually prevented from being deleted until the reference is removed. (There are also weak-references that do not "hold on to" the target. You make them by adding a _weak-key to the reference object like this: {_ref: "<document-id>", _weak: true})Let’s say we have “person”-type documents that looks something like this:{ _id: "ridley-scott", _type: "person", name: "Ridley Scott" } Keeping it simple, maybe our movies had a field director that contained a reference to a person. It could look something like this:{ _id: "alien", _type: "movie", title: "Alien", releaseYear: 1979, director: { _ref: "ridley-scott" } }Remember Sanity-specific fields are prefixed with an underscore, and an object containing a _ref key appearing anywhere in the document becomes a hard reference.Expanding referencesNow we can do a number of useful things with this reference. The most basic thing is expanding the reference in place. Let’s revisit our movie queries from the introduction.*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear } Let’s say we wanted to include the director in the returned result. If we didn't know any better, we'd perhaps try something like this:*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear, director } But if we just naïvely include the director in like this, we will just get whatever is in the director field on this document, which is the literal reference description:[ { _id: "alien", title: "Alien", releaseYear: "1979", director: { _ref: "ridley-scott" } }, … (more movies) ] This is not what we wanted, we wanted to follow that reference! By adding the dereferencing operator -> we ask Sanity to follow the reference and replace it with the actual content of the document referenced:*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear, director-> } Now, this is useful. We’d get something like this:[ { _id: "alien", title: "Alien", releaseYear: "1979", director: { _id: "ridley-scott", _type: "person", name: "Ridley Scott" } }, … (more movies) ] Then maybe we didn’t want all that metadata with our director? We can add a separate projection for our director:*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear, director->{name} } Our query now returns the director with just the name property we wanted:{ _id: "alien", title: "Alien", releaseYear: "1979", director: { name: "Ridley Scott" } } But we can do one better. We are not limited to the existing fields in the document in our projections, we can actually declare new fields. Let’s say we are building our compact movie list and we wanted just the title, year, and director name. We can get minimal cruft by extracting just the name and putting it in a new field, like this:*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear, "directorName": director->name } Now our query returns exactly what we want in the form we want it:{ _id: "alien", title: "Alien", releaseYear: "1979", directorName: "Ridley Scott" } Expanding an array of referencesThe example above shows how to expand a reference, but sometimes you'll be working with an array of references. In the above example, let's say we wanted to add producers. Details on how to set this up in your schema can be found in the Array documentation, but we'll consider how you might query that data.In this revised example, let's look at a query like this:*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear, director, producers[] } We use square brackets after producers because it's an array. Note that we used producers with an s. The naming convention of your schema doesn't matter to GROQ (as long as you get the name right); it is our recommendation to use the plural form for arrays.Now, you might get this:[ { _id: "alien", title: "Alien", releaseYear: "1979", director: { _ref: "ridley-scott" } producers: [ { _key: "<uniqueKey1>", _type: "reference", _ref: "gordon-carroll" }, { _key: "<uniqueKey2>", _type: "reference", _ref: "david-giler" }, { _key: "<uniqueKey3>", _type: "reference", _ref: "walter-hill" }, ] }, … (more movies) ]Like before, this isn't returning the details for each producer. We're getting references like we did at the beginning of the single reference example (and a _key, which ensures uniqueness). To expand references in an array, we will use the dereferencing operator (->) again. However, the square brackets are mandatory to traverse the array.*[_type == 'movie' && releaseYear >= 1979]{ _id, title, releaseYear, director, producers[]-> } This will return the full details for each of the three producers referenced. Projections and naked projections can be used just as with single references (the projection would go after the dereference operator).GotchaIt would be easy to forget the square brackets when expanding an array of references (i.e., querying producers-> instead of producers[]->, with the former returning a single null value). This is perhaps complicated by the fact that both producers and producers[] will return the array (albeit with unexpanded references). This is the nature of how GROQ traversals work.Filtering by referencesWhen dealing with references, we have a useful function called references() which can be used in filters to select only documents that reference specific other documents. Let’s say we want to list every movie Ridley Scott has been involved in. It looks like this:*[_type == 'movie' && references('ridley-scott')]Our first joinIt is time to write our first proper join: Say we wanted to list people and include all the movies they were involved in? We’ll be querying the “person”-type documents, but in the projections for each person, we’ll ask for the movies they have been involved in. To do this we have to briefly cover the parent-operator ^. Let’s look at the query first:*[_type == "person"]{ _id, name, "movies": *[_type == "movie" && references(^._id)].title } In a join, the parent operator is a way to reference the “parent” document. In this example the outer query for “person”-type documents fetches a bunch of people, and for each person, it returns the _id and name. Then we want to fetch the movies referencing that person. Now we declare the new field “movies” where we start a new query for “movie”-type documents, but for each person, we want to limit our movie query to movies referencing that person. To achieve this we need the _id of the person, but if we just wrote _id in the movies-query we’d reference the _id of the movie. To get to the fields of the person record we go “up” one level using the parent operator ^. So ^ means the specific “person”-document that our movie query is about, and then ^._id is the _id of that person, just as ^.name would be her name. So when we say references(^._id) in the query above, we limit our movies to movies referencing the current person.Naked projectionsThere is one more new thing we haven’t talked about in this query. We could have written the movies-sub-query like this:*[_type == "movie" && references(^._id)]{title}Our list of movies would have looked something like this:”movies”: [{title: “Alien”}, {title: “Blade Runner”}, …]Since we just wanted the titles, we can use a “naked projection”. By naming the field we want, like this:*[_type == "movie" && references(^._id)].title We get a nice, simple array of values, like this:”movies”: [“Alien”, “Blade Runner”, …]So, for completeness, the result of the full person w/movies query above could look something like this:[ { _id: "river-phoenix", name: "River Phoenix", movies: ["My Own Private Idaho", "Stand By Me", …] }, { _id: "ridley-scott", name: "Ridley Scott", movies: ["Alien", "Blade Runner", …] }, … ] More ways to filterSanity supports a growing number of ways to filter your documents. We have shown simple attribute comparisons with _type == ‘movie’ and releaseYear >= 1979. We have shown filtering by references using the references()-function. In addition, we support:Text search using the match operator, e.g. *[title match "Alien*"]Filtering by the presence of a field, e.g. *[defined(status)] which only match documents that have the status property set to any value.The in-operator which matches values in arrays, as in *["sci-fi" in genres], that matches all documents where genres is an array and that array contains the value "sci-fi".You can of course combine these filters using the boolean operators && (and), || (or), ! (not), like this *[_type == "movie" && (!("sci-fi" in genres) || releaseYear >= 1979)].We are working on a full reference for the GROQ feature set. In the meantime, you'll find a comprehensive set of examples in the cheat sheet.Queries in projectionsA useful thing in GROQ is that filtering and projections also can be used inside your projections. Let’s say you work for an architect and every project has a number of milestones. A document might look something like this:{ _id: "timmerhuis" _type: "project", title: "Timmerhuis", milestones: [ {status: "competition", year: 2009}, {status: "design-development", year: 2011}, {status: "breaking-ground", year: 2013}, {status: "completed", year: 2015} ] } And let’s say the view we are producing is about showing the current status of the project. We could achieve this by finding the latest milestone and extracting its status tag. This can be done in GROQ like this:*[_type == "project"]{ _id, title, "status": milestones|order(year desc)[0].status } Let’s pick apart the status query milestones|order(year desc)[0].status in some detail:First, we take the field milestones which contain the (potentially unordered) list of milestones for the project. Using the pipe-operator | we send the contents of this array to the order function, which is instructed to sort the array by year in descending order order(year desc). Then we take only the first element [0] (which is the latest milestone) and return the value of its status field. So now our project list would look something like this:[ { _id: "timmerhuis", title: "Timmerhuis", status: "completed" }, … ] Let’s try another clever trick querying the contents of this object. Instead of a status field, we just want a boolean flag telling whether the project is completed. We could achieve this like this:*[_type == "project"]{ _id, title, "completed": count(milestones[status == 'comp'''
