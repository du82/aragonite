description = "Build remarkable experiences at scale. Sanity is a customizable solution that treats content as data to power your digital business."
full_description = '''ResourcesComposable architectureHeadless CMS 101: The Only Guide You'll Ever NeedHeadless CMS ExplainedKnut MelværHead of Developer Community and EducationLast updated February 27, 2025Table of ContentsTable of ContentsWhat is a Headless CMS?What do a recording studio and a headless CMS have in commonThe rise of headless CMSesHow does a Headless CMS work?How is it different from a traditional CMS?Headless CMS vs. Traditional CMS comparisonWhat is the difference between a headless CMS and a decoupled CMS?Headless CMS Benefits1. Faster editing experiences2. Manage content for more channels3. Developer flexibility4. Easier scaling5. Enhanced securityWho needs a headless CMS?Use cases for Headless CMSWebsites & web appsProducts & servicesE-commerce sitesMobile appsDigital signageHow do I choose the right headless CMS?Why big companies choose Sanity as their headless CMS×Headless CMS 101: The Only Guide You'll Ever NeedHeadless CMS ExplainedThe benefits of headless CMSesHeadless CMS vs. Traditional CMSWhat is a decoupled CMS?Learn about headless content management systems: what they are, how they work, and how they differ from traditional CMSes like WordPress. We explore the uses of headless content, and how to apply it to websites, apps, and more.{"@context":"https://schema.org","@type":"VideoObject","url":"https://www.youtube.com/watch?v=-Uor3I0n_vQ","embedUrl":"https://www.youtube-nocookie.com/embed/-Uor3I0n_vQ?rel=0","thumbnailUrl":"https://i.ytimg.com/vi/-Uor3I0n_vQ/maxresdefault.jpg","name":"What is a headless CMS? Explained in 2 minutes. ","description":"A headless CMS is a content management system that provides a way to author content, but instead of web page rendering, it provides the content as data over an API. A headless CMS works by giving editors an interface for managing content while providing APIs for developers to build applications on top off. Most headless CMSes are offered as a Software as a Service, meaning that your editors will have to log into a web application and that the APIs are hosted in a cloud-based backend. Some headless CMSes will let you host the whole solution on your own server and database (requiring you to do your own scaling and operations). With Sanity you can host the customizable editor interface yourself while getting the advantages of the hosted real-time backend – no-ops and effortless scaling.","uploadDate":"2018-01-28"}See Sanity in action﻿‍﻿​‍​‍‌‍﻿﻿‌﻿​‍‌‍‍‌‌‍‌﻿‌‍‍‌‌‍﻿‍​‍​‍​﻿‍‍​‍​‍‌﻿​﻿‌‍​‌‌‍﻿‍‌‍‍‌‌﻿‌​‌﻿‍‌​‍﻿‍‌‍‍‌‌‍﻿﻿​‍​‍​‍﻿​​‍​‍‌‍‍​‌﻿​‍‌‍‌‌‌‍‌‍​‍​‍​﻿‍‍​‍​‍​‍﻿﻿‌‍​‌‌‍‌​‌‍﻿‌‌‍‍‌‌‍﻿‍​‍﻿﻿‌‍‍‌‌‍﻿‍‌﻿‌​‌‍‌‌‌‍﻿‍‌﻿‌​​‍﻿﻿‌‍‌‌‌‍‌​‌‍‍‌‌﻿‌​​‍﻿﻿‌‍﻿‌‌‍﻿﻿‌‍‌​‌‍‌‌​﻿﻿‌‌﻿​​‌﻿​‍‌‍‌‌‌﻿​﻿‌‍‌‌‌‍﻿‍‌﻿‌​‌‍​‌‌﻿‌​‌‍‍‌‌‍﻿﻿‌‍﻿‍​﻿‍﻿‌‍‍‌‌‍‌​​﻿﻿‌‌‍​‍‌‍​‍​﻿​‌​﻿​‍‌‍‌‌‌‍‌‍​﻿‍‌‌‍​‍​‍﻿‌​﻿‌‌​﻿​‍‌‍‌‌‌‍​‌​‍﻿‌​﻿‌​​﻿​‌​﻿​﻿‌‍‌​​‍﻿‌‌‍​‍​﻿‌﻿​﻿‌‌​﻿​‍​‍﻿‌​﻿‌‍​﻿‍​​﻿‌‌‌‍​﻿​﻿‌‍​﻿​‌‌‍​‌​﻿​‍​﻿​‌​﻿​‍​﻿‍​​﻿‌​​﻿‍﻿‌﻿‌​‌﻿‍‌‌﻿​​‌‍‌‌​﻿﻿‌‌‍﻿​‌‍​‌‌‍﻿‍‌‍‌​‌‍‍‌‌‍﻿‍‌‍‌﻿‌‌​​‌‍​‌‌‍‌﻿‌‍‌‌​﻿‍﻿‌﻿​​‌‍​‌‌﻿‌​‌‍‍​​﻿﻿‌‌‍​﻿‌‍﻿﻿‌‍﻿‍‌﻿‌​‌‍‌‌‌‍﻿‍‌﻿‌​​‍‌‌​﻿‌‌‌​​‍‌‌﻿﻿‌‍‍﻿‌‍‌‌‌﻿‍‌​‍‌‌​﻿​﻿‌​‌​​‍‌‌​﻿​﻿‌​‌​​‍‌‌​﻿​‍​﻿​‍‌‍‌‌‌‍​‍​﻿​‌​﻿​‍​﻿‌‍​﻿​​‌‍​‍​﻿‌﻿​﻿‌​‌‍​‍​﻿‍​‌‍‌‌​‍‌‌​﻿​‍​﻿​‍​‍‌‌​﻿‌‌‌​‌​​‍﻿‍‌‍‌​‌‍‌‌‌﻿​﻿‌‍​﻿‌﻿​‍‌‍‍‌‌﻿​​‌﻿‌​‌‍‍‌‌‍﻿﻿‌‍﻿‍​﻿﻿﻿‌‍​‍‌‍​‌‌﻿​﻿‌‍‌‌‌‌‌‌‌﻿​‍‌‍﻿​​﻿﻿‌​‍‌‌​﻿​‍‌​‌‍‌‍​‌‌‍‌​‌‍﻿‌‌‍‍‌‌‍﻿‍​‍‌‍‌‍‍‌‌‍‌​​﻿﻿‌‌‍​‍‌‍​‍​﻿​‌​﻿​‍‌‍‌‌‌‍‌‍​﻿‍‌‌‍​‍​‍﻿‌​﻿‌‌​﻿​‍‌‍‌‌‌‍​‌​‍﻿‌​﻿‌​​﻿​‌​﻿​﻿‌‍‌​​‍﻿‌‌‍​‍​﻿‌﻿​﻿‌‌​﻿​‍​‍﻿‌​﻿‌‍​﻿‍​​﻿‌‌‌‍​﻿​﻿‌‍​﻿​‌‌‍​‌​﻿​‍​﻿​‌​﻿​‍​﻿‍​​﻿‌​​‍‌‍‌﻿‌​‌﻿‍‌‌﻿​​‌‍‌‌​﻿﻿‌‌‍﻿​‌‍​‌‌‍﻿‍‌‍‌​‌‍‍‌‌‍﻿‍‌‍‌﻿‌‌​​‌‍​‌‌‍‌﻿‌‍‌‌​‍‌‍‌﻿​​‌‍​‌‌﻿‌​‌‍‍​​﻿﻿‌‌‍​﻿‌‍﻿﻿‌‍﻿‍‌﻿‌​‌‍‌‌‌‍﻿‍‌﻿‌​​‍‌‌​﻿‌‌‌​​‍‌‌﻿﻿‌‍‍﻿‌‍‌‌‌﻿‍‌​‍‌‌​﻿​﻿‌​‌​​‍‌‌​﻿​﻿‌​‌​​‍‌‌​﻿​‍​﻿​‍‌‍‌‌‌‍​‍​﻿​‌​﻿​‍​﻿‌‍​﻿​​‌‍​‍​﻿‌﻿​﻿‌​‌‍​‍​﻿‍​‌‍‌‌​‍‌‌​﻿​‍​﻿​‍​‍‌‌​﻿‌‌‌​‌​​‍﻿‍‌‍‌​‌‍‌‌‌﻿​﻿‌‍​﻿‌﻿​‍‌‍‍‌‌﻿​​‌﻿‌​‌‍‍‌‌‍﻿﻿‌‍﻿‍​‍‌‍‌﻿​​‌‍‌‌‌﻿​‍‌﻿​﻿‌﻿​​‌‍‌‌‌‍​﻿‌﻿‌​‌‍‍‌‌﻿‌‍‌‍‌‌​﻿﻿‌‌﻿​​‌﻿‌‌‌‍​‍‌‍﻿​‌‍‍‌‌﻿​﻿‌‍‍​‌‍‌‌‌‍‌​​‍​‍‌﻿﻿‌The developer-first Content Operating System that redefines how you manage, collaborate on, and scale your content.Watch demoWhat is a Headless CMS?A headless CMS is a content management system that separates where content is stored (the “body”) from where it is presented (the “head“). It separates information and presentation. This enables content reuse and remixing across web, mobile, and digital media platforms as needed. You could even reuse your content in print.Format-agnostic content provides a transformative experience for everyone involved - authors, developers, and users alike.Authors benefit from a fully customizable editor built with structured data models. Developers receive a streamlined API for efficient querying and filtering. And, in the end, users enjoy content delivered exactly how and where they want it.What do a recording studio and a headless CMS have in commonMaking sense of the advantages of a headless CMS can be a bit tough at first, so let’s try something different.Imagine you wanted to record a song.A song is composed of many pieces of information - lyrics, melodies, instruments, voice tracks and more. You could just make a simple one track recording of a song in your basement. Information and presentation are mixed together.You can replay the song but you can’t remix it.What is much better, and what a professional recording studio does, is create a tailored recording experience for each musician. Each part is recorded as individual tracks. Then a sound engineer works with a team to remix and level all the tracks creating the perfect song.You can replay the song and remix the song.A headless CMS offers the same advantages as a professional recording studio. Content creators get a more organized and thoughtful editing experience. Developers, marketers and designers can remix and iterate on concepts as much as they need. And finally users get delivered the perfect mix of information, right where they need it.You can reuse and remix your content!The rise of headless CMSesLike most technological innovations, headless CMSes grew out of a set of needs that could no longer be met by a traditional monolithic CMS. This shift was kickstarted by the advent of smartphones in the late 2000s and has only accelerated as digital media platforms become more and more diverse.You now have screens on your wrist, in your car, on your tractor, on your fridge, and in your glasses—not to mention the classic triumvirate of TVs, computers and phones.How we consume content has fundamentally changed over the last decade and so how we store that content has also had to evolve and improve. Enter next-gen headless CMS platforms, like Sanity, where the content is decoupled from code allowing it to be remixed and reused. Wherever and however it is needed. Billboards to watches.How developers build digital media has also similarly evolved and improved. Popular modern frameworks, like NextJS and SvelteKit, work best with APIs for content. Headless CMSes give developers those approachable APIs. This symbiotic relationship between next-gen frameworks and next-gen storage options has cemented the emergence of headless CMSes as the next step in content management.Today Sanity and other headless CMSes lead developer satisfaction surveys and are the tech everyone wants to work with on their next project!How does a Headless CMS work?A headless CMS works by separating the content authoring experience from the software development experience, giving editors an interface for managing content and providing that content via APIs for developers to query and build applications with.Content authors get to focus on content. Developers get to focus on code. Everyone is doing what they do best.By comparison, a traditional CMS blurs lines between roles, making you part developer, part writer, and part security analyst. Just like a dinner party, this works well on a small scale but can quickly become overwhelming as a business grows.The content stored in the headless CMS is accessed via a set of APIs that developers can use to present the data wherever they need.Today most headless CMSes operate as a Software as a Service (SaaS) company, providing a managed backend and hosted web application. This means someone else is worrying about security, scaling and servers—it is all taken care of for you!Architecture of a headless CMSSanity is a pumped-up version of a regular headless CMS offering you all these benefits and more. It has a React-based editor, the Sanity Studio, which is easy to configure and customize. Real-time content collaboration on documents. Advanced publishing workflows for editors. And structured content models to power everything from a mobile app to digital signage.How is it different from a traditional CMS?As opposed to headless, a “traditional CMS” is software that you either install and have to manage on your own, or on a managed server environment. Traditional CMSes are also called “monolithic” because they pack all the functionality and assumptions for how you want to work into a single system.Architecture of a monolithic CMSTraditional CMSes often provide a “What You See Is What You Get” (WYSIWYG) content editing interface because they only have one context for presenting the content – usually a web page.In the last few years, we have seen an uptick of CMSes that try to be more flexible in their ways of making content available. These are usually called “Headless” or “API-first” CMSes. Some of them market themselves as “Content infrastructure,” “Content Hubs” or even “Content as a Service.” However, when you take a closer look, they all pretty much boil down to some database backend with a web-based user interface, and content made accessible through an API.Headless CMS vs. Traditional CMS comparisonTraditional CMSHeadless CMSArchitectureOne-to-oneOne-to-manyExtensibilityMonolithicModularDevice compatibilityLimitedResponsive by designIntegration and deploymentPunctuatedContinuousEngineeringDIYManagedDeveloper experienceLegacyContemporarySpeedHigher load timesLower load timesIterationLong cyclesRapid developmentAt Sanity we see today’s headless CMS systems as an evolutionary step that leads to an even better way of managing content – where structure is truly flexible, content is treated like data, and editors work in tailored real-time collaboration environments.→ Learn about the differences between headless and traditional CMSesThe basic architectural differences between traditional, and headless content management systems. What is the difference between a headless CMS and a decoupled CMS?Decoupled CMSes have emerged as a response to the introduction of headless CMSes. Some of the traditional CMS vendors have built APIs on top of their systems and market them as “decoupled.” These terms often get used interchangeably but mean slightly different things. A headless CMS separates content from code but never has a frontend presentation layer attached. A decoupled CMS still separates content from code but does have a presentation layer or head linked in some way.In practice, this means that content from a headless CMS can be used however and wherever it is needed, regardless of the presentation layer. A decoupled CMS, however, does still gain some flexibility by separating content from code but remains linked with a final presentation format, most often a website.→ Learn more about decoupled CMSes and how they're different from headless CMSesHeadless CMS BenefitsA headless CMS is a powerful and flexible way to manage content. It allows for faster editing experiences and the ability to manage content for multiple channels. It offers developers the flexibility to choose their own frontend tooling and makes it easier to scale. In addition, headless CMS also offers enhanced security by separating content from the presentation layer.1. Faster editing experiencesTraditional CMS architectures have to spend resources on content editing and content rendering. A headless CMS has an advantage over traditional alternatives because it doesn’t have to deal with the rendering side of things. That’s left to other more specialized parts of your stack.2. Manage content for more channelsTruly headless content isn’t tied to a single presentation concern (e.g. website), so it can find an audience across multiple channels. You can use a headless CMS to manage content for apps and websites. You can even manage your internal/admin content in the same place and extract more value from it that way.3. Developer flexibilityBecause headless content is served over APIs, developers can choose their own front-end tooling. If you’d prefer to work with Javascript instead of PHP or Ruby, you can do that. You can also interchange parts of your stack or move from one framework to another without affecting the CMS.4. Easier scalingHeadless lets you manage your content from a single source of truth, change developer tools at any time, and benefit from sending your content to high-performance cloud-based hosting and build services like Vercel and Netlify.5. Enhanced securityBecause headless content is separated from the presentation layer it’s a smaller area of attack.→ Learn more about the benefits of using a headless CMSWhile headless CMSes offer unparalleled flexibility and omnichannel content delivery, they come with their own set of challenges.The absence of a built-in front end means businesses must craft their own presentation layer, potentially increasing initial setup costs and complexity. Teams might face a steeper learning curve, especially when integrating with other systems or optimizing for headless SEO. Additionally, relying on developers for updates can sometimes slow down content modifications.However, with the right implementation and understanding, many of these challenges can be mitigated, allowing businesses to harness the full potential of a headless CMS.Who needs a headless CMS?Today a headless CMS is the right choice for most growing businesses and many use cases.They have three key competitive advantages over traditional CMSes. Offering a bespoke editing environment with advanced authoring and publishing workflows. Structured content to enable reuse across multiple platforms like an app, website and print media. And managed infrastructure with scaling and security for peace of mind.However, traditional CMSes still have their benefits and can fit where someone with a non-technical background needs to launch a website without paying a developer. Think small businesses, local brick-and-mortar stores, and even some basic e-commerce.The plugins and themes offered by a traditional CMS are packed with features and offer tremendous value.Use cases for Headless CMSHeadless CMSs are best suited for businesses who need a content management system that is highly customizable and easily managed, but don't necessarily need a front-end website. This includes businesses in the media, entertainment, publishing, and eCommerce industries, as well as companies that need to manage a lot of content for internal processes. Businesses in these industries can benefit from the scalability, flexibility, and efficiency headless CMSs provide.Websites & web ap'''
