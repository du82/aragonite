["https://sans.org/about"]
title = "About Us | SANS Institute"
description = """
Launched in 1989 as a cooperative for information security thought leadership, it is SANS’ ongoing mission to empower cyber security professionals with the practical skills and knowledge they need to make our world a safer place.

We fuel this effort with high quality training, certifications, scholarship academies, degree programs, cyber ranges, and resources to meet the needs of every cyber professional. Our data, research, and the top minds in cybersecurity collectively ensure that individuals and organizations have the actionable education and support they need."""
full_description = '''The Highest Standard in Cybersecurity Education The instructors you find in our classrooms are experienced practitioners who also excel in mentoring others. They are respected leaders in cyber who share research, tools, and incident analysis with the world, and bring practical, collaborative expertise to our community. They, along with our students and community contributors, make SANS the engaging, high-quality educational organization that it is.The SANS Promise: Everyone who completes SANS training can apply the skills and knowledge they’ve learned the day they return to work. Learn More Train & Certify At the heart of everything we do is our training and certification. Learn from the top cybersecurity instructors, then prove your knowledge and skill with the most trusted training and certification in the world. Cybersecurity Courses Cybersecurity Courses From cyber foundations to leadership strategies, SANS offers more than 60 hands-on courses to help cyber professionals at every level of experience gain immediately applicable skills. GIAC Certifications GIAC Certifications GIAC Certifications provide the highest and most rigorous assurance of cyber security knowledge and skill available to industry, government, and military clients across the world. Learn More “I have taken numerous courses over my career and many were online. Nothing, including expensive college-level courses, were on the same level as SANS training. It's dense, rich, and immediately applicable. If the student takes what they have learned into their workplace, they will immediately be able to distinguish themselves. I’m already looking forward to my next SANS training opportunity, and I highly recommend it to others." – Dave Brock, Lytx Inc. Skill Paths Explore common cyber career paths and the training that aligns with each. Cyber Defense & Blue Team Operations Offensive Operations Digital Forensics and Incident Response Cloud Security ICS/SCADA Security Cybersecurity Leadership From Foundations Training to the Most Elite Credential in Cybersecurity There are SANS courses and GIAC Certifications for every skill level. Whether you’re just getting started or leading the charge, you'll find hands-on training and support here to keep your skills sharp and ready. Foundations Course Learn the core knowledge and skills needed to begin a career transition or prepare you for advanced SANS cybersecurity training. Learn More SANS Technology Institute Begin or advance a career in cyber with a degree or certificate from the SANS Technology Institute. Degree Programs GSE There is only one cybersecurity certification in the world that validates mastery across all essential cyber security skills, the GSE. Find out how to pursue the most prestigious credential possible in this field. Learn More Initiatives SANS is a collaborative professional organization dedicated to creating a safer global community. To achieve this goal, we run multiple programs to draw more talent into the cybersecurity field and empower those people with the skills and knowledge needed to enter the workforce, accomplish important tasks, and lead the way. Explore our initiatives to learn how you can participate in this mission with us. See Our Initiatives'''
