description = "Speaking at a SANS Summit gives you the opportunity to engage with thousands of cybersecurity professionals, to share your expertise, and expand your network. If you have original content to share with the community, we encourage you to submit a talk proposal."
full_description = "Who Should Submit Diversity of thought is critical to any organization's success, and SANS Summits encourage participation by everyone regardless of age, culture, religious affiliation, ethnicity, sexual orientation, or gender identification. Whatever your background, whoever you are, we encourage you to respond to a CFP. We welcome people who are newer to the field or who have not yet done any public speaking. We offer mentoring at every stage of the process to help you develop an impactful presentation. Please contact us at SummitSpeakers@sans.org if you have any questions. Current Calls for Presentations SummitSubmission DeadlineDate of SummitLocationDigital Forensics & Incident Response (DFIR) SummitFriday, March 14 - 5:00 p.m. EDT (UTC-4)July 24-25Salt Lake City, UT & VirtualSANS Security Awareness SummitTBDAug 11 - 15Chicago, IL & VirtualCloudSecNext Summit & Training 2025TBDOct 2-9Denver, CO & Virtual Get Notified When CFPs Open Yes! Please notify me by email when Calls for Presentation (CFPs) are open for SANS Summits and Forums. First Name Last Name Email Phone Organization Country United States Canada United Kingdom Spain Belgium Denmark Norway Netherlands Australia India Japan Singapore Afghanistan Aland Islands Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belize Benin Bermuda Bhutan Bolivia Bonaire, Sint Eustatius, and Saba Bosnia And Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory Brunei Darussalam Bulgaria Burkina Faso Burundi Cambodia Cameroon Cape Verde Cayman Islands Central African Republic Chad Chile China Christmas Island Cocos (Keeling) Islands Colombia Comoros Cook Islands Costa Rica Cote D'ivoire Croatia (Local Name: Hrvatska) Curacao Cyprus Czech Republic Democratic Republic of the Congo Djibouti Dominica Dominican Republic East Timor Ecuador Egypt El Salvador Equatorial G