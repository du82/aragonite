["https://sans.org/cyber-academy"]
title = "SANS Cyber Academies | SANS Institute"
description = "Addressing the pressing need to fill the cybersecurity labor gap, the SANS Institute proudly presents the Cyber Academy program. Our cybersecurity training scholarship offers an accelerated, technical, and intensive pathway to mastering cybersecurity. This cost-free program empowers students to pass multiple industry-recognized certification exams within a year, equipping them with skills that make a real-world difference from day one."
full_description = "Numbers at a Glance Graduates land new jobs in cybersecurity with a 90% success rate within 12 months of program completion. 3700+ SANS Mission based program scholarships have funded internally and externally across the globe to bring more talent into the cybersecurity industry. Average salary of program graduates is $90,000 –$110,000Women's Pathway Previous Next Academy Women’s Cyber Academy Unleash your potential with the Women's Cyber Academy. Offering a specialized cybersecurity training scholarship, providing women with the tools and skills to excel in the cybersecurity industry. Our cost-free, intensive program is focused on real-world application, setting you up for immediate... Apply Academy WiCyS Security Training Scholarship Women in Cybersecurity (WiCyS) members can apply for this multi-staged scholarship opportunity made possible by Google, Bloomberg, and Facebook. Designed for students and career changers, this program will provide selected participants with a reliable pathway to cybersecurity employment within the... Academy Secure Diversity Leadership Academy Women and other underrepresented genders can utilize three programs focused on increasing gender diversity in cyber security leadership. The three programs—transformational cyber leader, operational cyber executive, and cloud security leader—offer SANS training and GIAC certifications to US-based,... Veterans Pathway Veterans Cyber Academy The Veterans Cyber Academy is a cybersecurity training scholarship program open to military veterans, active duty US military within 6 months of transition, and active duty military spouses looking to transition into the cybersecurity industry. This program provides comprehensive and immersive training that covers the latest technologies and techniques used in the field. The program is highly competitive, with limited training spots available, but provides participants with the skills and knowledge needed for a successful career in cybersecurity. Apply Now Mission 43 Veterans Academy Join the ranks at Mission 43 Veterans Academy, a place where Idaho's veterans can turn their military experience into a future in cybersecurity. It's all for free, and it's all about you. We help you transition smoothly into a career that values your skills and dedication. Let's work together to make the world of cybersecurity a safer place. Ready for your next mission? Diversity Pathway Previous Next Academy Diversity Cyber Academy Facing the cybersecurity challenge, SANS Diversity Cyber Academy offers cybersecurity training scholarships for women and minorities in cybersecurity. Our accelerated pathway is free, empowering you to make an immediate impact post-certification. Experience inclusive training, and achieve... Apply Today Academy Women’s Cyber Academy Unleash your potential with the Women's Cyber Academy. Offering a specialized cybersecurity training scholarship, providing women with the tools and skills to excel in the cybersecurity industry. Our cost-free, intensive program is focused on real-world application, setting you up for immediate... Apply Workforce Development Pathway Cyber Workforce Academy Maryland Embark on a new career with the SANS Cyber Workforce Academy - Maryland. This cybersecurity training scholarship offers Maryland residents the chance to reskill in cybersecurity. Enjoy advanced training, earn GIAC certifications, and join 90% of our graduates in securing jobs within 6 months. Outside the U.S. Pathway Previous Next Academy Upskill in Cyber Upskill in Cyber aims to meet the widening demand for skilled cyber security practitioners. Through intensive training, the program creates GIAC-certified professionals, ready to be deployed into junior cyber security roles in just 10 weeks. Upskill in Cyber is designed for people new to cyber... Apply Now Academy SANS Cyber Reskilling Program Bahrain Partnering with Tamkeen, the Cyber Reskilling Program aims to close the skills gap in Bahrain by trainin