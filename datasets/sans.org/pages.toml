ion, you agree to the processing of your personal data by SANS as described in our Privacy Policy. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Submit Practical Advice for Submitting a Talk Giving presentations at conferences is a great way to share your expertise, expand your professional network, and bolster your personal brand. But how do you submit a proposal that sets you apart from the crowd? Britta Glade, Director of Content for RSA Conference, and Dawn Cappelli, CISO of Rockwell Automation and program committee member for RSA Conference, have reviewed literally thousands of proposals, and share their tips for getting yours noticed and selected. Additional Resources to Help You Get Started Five Factors for Successful CFP Submissions by Jennifer Santiago, Content Manager, SANS Summits Writing Infosec Conference Proposals: A Step-by-Step Guide by CTI Summit co-chair Katie Nickels High-Value CFP Submissions | An Example of a Successful Proposal by Jennifer Santiago Giving Effective Presentations: A Crash Course by Cyber Defense Forum Chair, Chris Crowley"
