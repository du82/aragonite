full_description = "Project: Roman roads diagrams The Roman roads diagram project is a series of maps driven by an unconventional idea: what if we represented Ancient Rome’s famed road network in the style of a modern transit map? So far I’ve made five diagrams (below). Click for more information. You can see how my style has evolved since I made the first map back in 2017. My ultimate goal is to make a book out of these. I’ll probably have to redesign a few of them. * { box-sizing: border-box; } body { margin: 0; } .header { text-align: center; padding-bottom: 32px; } .row { display: -ms-flexbox; /* IE10 */ display: flex; -ms-flex-wrap: wrap; /* IE10 */ flex-wrap: wrap; padding: 0 4px; } /* Create four equal columns that sits next to each other */ .column { -ms-flex: 50%; /* IE10 */ flex: 50%; max-width: 50%; padding: 0 10px; } .column img { margin-top: 4px; margin-bottom: 15px; vertical-align: middle; width: 100%; } /* Responsive layout - makes a two column-layout instead of four columns */ @media screen and (max-width: 800px) { .column { -ms-flex: 50%; flex: 50%; max-width: 50%; } } /* Responsive layout - makes the two columns stack on top of each other instead of next to each other */ @media screen and (max-width: 600px) { .column { -ms-flex: 100%; flex: 100%; max-width: 100%; } } 1. Empire (Original) 3. Italy 5. Gaul 2. Britain 4. Iberia"
