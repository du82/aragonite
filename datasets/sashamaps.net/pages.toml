["https://sashamaps.net/docs/maps/roman-roads-original"]
title = "Roman roads | Sasha Trubetskoy"
description = "A map of the roads of ancient Rome, in the style of a transit diagram."
full_description = "Roman Roads 3 June 2017 It’s finally done. A subway-style diagram of the major Roman roads, based on the Empire of ca. 125 AD. Creating this required far more research than I had expected—there is not a single consistent source that was particularly good for this. Huge shoutout to: Stanford’s ORBIS model, The Pelagios Project, and the Antonine Itinerary (found a full PDF online but lost the url). The lines are a combination of actual, named roads (like the Via Appia or Via Militaris) as well as roads that do not have a known historic name (in which case I creatively invented some names). Skip to the “Creative liberties taken” section for specifics. How long would it actually take to travel this network? That depends a lot on what method of transport you are using, which depends on how much money you have. Another big factor is the season – each time of year poses its own challenges. In the summer, it would take you about two months to walk on foot from Rome to Byzantium. If you had a horse, it would only take you a month. However, no sane Roman would use only roads where sea travel is available. Sailing was much cheaper and faster – a combination of horse and sailboat would get you from Rome to Byzantium in about 25 days, Rome to Carthage in 4-5 days. Check out ORBIS if you want to play around with a “Google Maps” for Ancient Rome. I decided not to include maritime routes on the map for simplicity’s sake. Creative liberties taken The biggest creative element was choosing which roads and cities to include, and which to exclude. There is no way I could include every Roman road, these are only the main ones. I tried to include cities with larger populations, or cities that were provincial capitals around the 2nd century. Obviously to travel from Petra to Gaza you would take a more or less direct road, rather than going to Damascus and “transferring” to the Via Maris. The way we travel on roads is very different from rail, which is a slight flaw in the concept of the map. But I think it’s still aesthetically pleasing and informative. Here’s a list of the roads that have authentic names and paths: Via Appia Via Augusta Via Aurelia Via Delapidata Via Domitia Via Egnatia Via Flaminia Via Flavia (I, II, III) Via Julia Augusta Via Lusitanorum Via Militaris Via Popilia Via Portumia Via Salaria Via Tiburtina Via Traiana Via Traiana Nova Some roads have real names but were modified somewhat: The Via Latina I combined with the Via Popilia. In reality the Popilia ended at Capua, and the Latina went from Capua to Rome. Via Aquitania only referred to the road from Burdigala (Bordeaux) to Narbo (Narbonne). Via Asturica Burdigalam similarly only refers to the Astrurica-Burdigala section. “Via Claudia” is not a real name, but refers to a real continuous road built by Claudius. Via Hadriana was a real road in Egypt, but it refers to a slightly different section than the green route. The name “Via Maris” is considered to be a modern creation, referring to real ancient trade road whose real name has been lost to history. Via Valeria only referred to a section of the yellow Sicilian loop. The roads around Pisae, Luna and Genua had several names for different sections, including Via Aemilia Scauri. Sometimes “Via Aurelia” referred to the entire road from Rome to Arelate. Via Sucinaria is the Latin name for the Amber Road, a trade route from the Baltic region to Italy that carried amber as a valuable good. It probably was not used to refer to a single literal road. Via Gemina and Via Claudia Augusta are real names that referred to small parts of the routes marked on the map. The other roads have relatively uncreative names that I invented, usually based on a place that they pass through. I have never formally studied Latin and I’ll admit that I am somewhat confused by the distinction between -a and -ensis endings, so there’s a chance I may have messed that up. Update I got numerous comments following the release of my Roman roads map. Acting by the mantra of “OP delivers”, I decided to take this feedback into account and create an updated version of the map. The new map is featured here, and I have also replaced the map in the original post with the new version. Several changes were made: The typo in Gesoriacum is fixed. The Via Agrippa is now properly named. For some reason I had typed Via Flavia by mistake. Via Flavia now refers to the road along the Dalmatian coast, in reference to the actual Via Flavia in what is now Croatia. I have included Berytus, present-day Beirut, in the map. It was the capital of Roman Phoenicia and one of the most important cities in the Eastern Mediterranean at the time. The town of Vindonissa has been added. It was a prominent fort in what is now Switzerland. The road in Sardinia now goes from Caralis to Tarrae. This was (and still is) the most prominent land linkage on the island. Road names ending in -ensis have been changed to more classical names: Via Sarda now uses the proper Latin adjective for the island. Via__Augusta Nova is named after the emperor who established the proconsular government in Asia. Other geographically-named roads have had name changes: Via Domitiana is named after Domitian, who conquered Moesia. Via Tiberia in Cappadocia is named after Tiberius, who established the province. The British Isles are now displayed in full, and the British road network has been expanded a tiny bit. Lucus (Lugo) is now moved inland, and the road from Bracara Augusta to Asturica has been separated. Version in Chinese – 中文版 Chinese translations courtesy of Stone Chen."
year_published = 2017
year_updated = 2017
