["https://sashamaps.net/docs/writings/europe-and-mankind"]
title = "Europe and Mankind—English translation | Sasha Trubetskoy"
description = """
.book-toc { max-width: 8rem; }  Europe and Mankind—English translation Translator’s notes Europe and Mankind is an interesting essay written by Nikolai Sergeyevich Trubetzkoy (1890–1938), who happens to be a first cousin thrice removed. He was primarily a linguist, but occasionally wrote on historical and sociological topics.
I merely stumbled upon this essay and found it extremely relevant to today’s world. However, there doesn’t appear to be an English translation available."""
full_description = '.book-toc { max-width: 8rem; } Europe and Mankind—English translation Translator’s notes Europe and Mankind is an interesting essay written by Nikolai Sergeyevich Trubetzkoy (1890–1938), who happens to be a first cousin thrice removed. He was primarily a linguist, but occasionally wrote on historical and sociological topics. I merely stumbled upon this essay and found it extremely relevant to today’s world. However, there doesn’t appear to be an English translation available. I figured, I might as well translate it, and at the same time better understand the ideas of Nikolay Sergeyevich and others like him. This is an interpretive translation. My emphasis is on getting across Nikolai Sergeyevich’s ideas as clearly as possible in standard modern English without distorting them. If you are a scholar interested in closely analyzing the exact words and terms used, you should look at the Russian original. The original text contained section headings like “Preface”, “Part 1”, etc. Section titles (e.g. “Part 1: Chauvinism and Cosmopolitanism”), as well as summaries, notes, and highlights are added by me. Since this is my personal website, I want to share my thoughts and interactions with the text. Europe and Mankind By Nikolai Sergeyevich Trubetzkoy, Sofia, 1920. Translated into modern English by Alexandr (Sasha) Trubetskoy, 2023. Preface Summary The events of the Great War and Russian Revolution have moved Trubetzkoy to share his thoughts on European culture and identity. He feels that more and more people agree with him and is now more comfortable sharing. He hopes to rally his community of like-minded people to help implement these ideas. It is not without hesitation that I offer this work to the world. The thoughts expressed here had coalesced in my mind some 10 years ago. Since then, I’ve discussed these topics with many different people, wishing either to test myself or to convince the other person. Many of these conversations and discussions turned out to be rather beneficial to me, since they forced me to flesh out and deepen my ideas and arguments. But they did not change my core ideas. Of course I could not possibly limit myself to casual conversations. In order to verify whether the theses that I’m defending are actually correct, I had to open these ideas up to a broader discussion, i.e. publish them. This I have still not done. And I haven’t done this because, over many conversations (especially early on), I got the impression that most of the people I came across simply did not understand what I was trying to say. They didn’t get it, not because I wasn’t expressing myself clearly, but because the majority of educated Europeans find these ideas inherently unacceptable, as if they go against some unshakeable psychological foundation that is the basis of European thought. People saw me as a purveyor of paradoxes, trying too hard to be original with my arguments. Needless to say, under those circumstances, I found debating neither meaningful nor beneficial, since a debate can only be productive when both sides understand each other and speak the same language. And because, at the time, I encountered nothing but misunderstanding, I did not consider it timely to make my thoughts public. I waited for a more opportune moment. My decision to go to print is largely due to the fact that I am encountering more and more people who understand me; moreover, I am beginning to find people who agree with my core ideas. It turns out that many people have, completely independently, arrived at the same conclusions as I have. There seemed to have been a shift in the thinking of many educated people. The Great War and, in particular, the ensuing “peace” (which I am still forced to put in quotes), have challenged people’s faith in “civilized society” and have opened the eyes of many. We Russians are, of course, in a special situation. We have witnessed the sudden collapse of what we had called Russian culture. Many of us were shocked by the incredible speed and lack of difficulty with which it all happened, and many have pondered the causes of this phenomenon. Perhaps this pamphlet may help some of my compatriots to clear up their own thoughts on the matter. Some of my positions could have been amply illustrated with examples from Russian history. This might have made my writing more lively and engrossing, but such digressions would have made the bigger picture less clear. In offering the reader these relatively new ideas, my main concern is to present these ideas clearly and in a logical progression. Furthermore, my thoughts apply not only to Russians, but to all other peoples which have in one form or another taken up European culture without actually having Romance or Germanic heritage. When I release this booklet to the world in the Russian language, I do so only because charity begins at home, and above all I’d like for my thoughts to be received and understood by my fellow countrymen. In offering my thoughts to the reader’s attention, I would like to remind him of a choice he must personally make for himself. One of the following must be true: either the ideas that I am defending are false, and stand to be disproven logically; or these ideas are true, and we must draw practical conclusions from them. Accepting the truth of the theses in this pamphlet obligates one to do further work. Having accepted these theses, one must develop and concretize them in order to apply them to real life, and to use this point of view to revisit many of the questions that present themselves throughout life. Many people these days are “reevaluating their values” in one way or another. For readers who do accept the theses I am defending, the last theses will serve to indicate the direction in which their “reevaluation” should go. There is no doubt that the work that proceeds from accepting these ideas, be it theoretical or practical, must be a collective effort. An individual can choose to abandon some idea or join a well-known cause, but it is the collective that must develop an entire system based on these thoughts, and put that system into practice. I invite anyone who shares my convictions to participate in this collective work. Thanks to a few serendipitous encounters, I am convinced that these people do exist. All they have to do is to join forces in an earnest, concerted effort. And if my pamphlet can serve as the catalyst to unite these people, I would consider my goal accomplished. On the other hand, there are moral obligations that befall those who reject my theses as false. If the theses that I defend are truly false, then they are toxic and must be opposed. But since (dare I say) they are grounded in logic, then their refutation must be no less logical. They must be logically refuted in order to prevent those who have tasted these ideas from being misled. The author himself would forever toss aside these unpleasant, disconcerting thoughts that have haunted him for over a decade without looking back, if only someone would prove to him that they are logically false. Part I: Chauvinism and Cosmopolitanism Introduction Summary On the issue of nationalism, Europeans seem to fall on a spectrum with “chauvinism” on one end and “cosmopolitanism” on the other. In reality, the two are the same thing. Cosmopolitanism is just a chauvinism of Romano-Germanic values. There is a fairly large variety of positions that Europeans hold regarding the question of nationalism, but they are all on a spectrum between two extremes: chauvinism on one side, and cosmopolitanism on the other. All nationalism is basically a combination of elements of chauvinism or cosmopolitanism, a way of reconciling these two opposed notions.1 There is no doubt that this is how Europeans see chauvinism and cosmopolitanism—as two fundamentally, intrinsically opposite points of view. However, we cannot accept this premise. The moment we take a closer look at chauvinism and at cosmopolitanism, we notice that there is no inherent distinction between the two. We see that the two are no more than two levels, two differing manifestations of the same underlying phenomenon. The Chauvinist takes a priori the position that the best nation in the world happen to be his nation. His nation’s culture is better and more complete than all other cultures. His nation has the exclusive right to lead and dominate other nations, who must submit— and become assimilated, accepting the dominant faith, language and culture. Everything that stands in the way of his great nation’s final triumph must be swept away with force. This is how the Chauvinist thinks and, accordingly, acts. The Cosmopolite rejects any distinction between nationalities. If such distinctions do exist, they must be annihilated. Civilized human society must be united and have a single culture. Uncivilized nations must accept this culture and join it, entering the family of civilized nations, so that together they may walk the one path of world progress. Civilization is the ultimate good, in the name of which we must sacrifice our national particularities. When formulated this way, chauvinism and cosmopolitanism really do seem strikingly different. In the former, supremacy is claimed by the culture of a single ethno-anthropological group, while in the latter—by the culture of a post-national humanity. But let’s take a look at what European cosmopolites include in their definition of “civilization” and “civilized society”. By “civilization” they mean to say the culture that was produced by the Germanic and Romance peoples of Europe. And “civilized nations" refers, first and foremost, to those same Germanic and Romance nations, and only then to nations that have accepted European culture. And so we see that the culture that Cosmopolites believe should reign supreme, abolishing all other cultures, is the culture of the same specific ethno-anthropological group whose dominance the Chauvinist dreams of. There is no fundamental difference here. In fact, the national, ethno-anthropological and linguistic unity of every European nation is only relative. Each of these nations is a combination of different, smaller ethnic groups that have their own dialectical, cultural and anthropological features, but are related to each other by ties of kinship and common history that have created a stock of common cultural assets. Thus, the Chauvinist, bestowing upon his nation the crown of creation and deeming them the sole bearers of all possible perfection, is in fact the champion of a whole group of ethnic units. Moreover, the Chauvinist wants other nations to merge with his nation, losing their national likeness. When looking at other nations that have already done this, forfeiting their national identity and taking on the language, faith and culture of his nation, the Chauvinist will treat them as his own people. He will praise the others’ contributions to his nation’s culture—but, of course, only if this other nation has truly taken on a disposition that is sympathetic towards him, having completely abandoned their previous national mentality. To the nation that assimilated with the dominant nation, the Chauvinists always take a somewhat suspicious attitude, especially if the assimilation happened not long ago. But no Chauvinist fundamentally rejects the newly assimilated—we know, in fact, that among the European Chauvinists there are many people whose surnames and anthropological characteristics clearly show that, by origin, they do not belong to the people whose domination they so vehemently preach. Now let us consider the European Cosmopolite. We see that, in essence, he is the same as the Chauvinist. The “civilization”, the culture that he considers to be the highest, to which all other cultures should bow down, also represents a known stock of cultural assets common to a group of ancestrally and historically related nations. Just as the Chauvinist ignores the particular characteristics of the individual ethnic groups making up his own nation, the Cosmopolite does away with the peculiarities of individual Romano-Germanic1 nations and takes only those things that they share in common. The Cosmopolite also recognizes the cultural value of the activities of non-Romano-Germanic nations who fully embraced Romano-Germanic civilization, who discarded everything that contradicted the spirit of the dominant civilization, and exchanged their national likeness for one that is pan-Romano-Germanic. This is exactly like the Chauvinist, who recognizes as “his own” those aliens and foreigners who managed to fully assimilate with the dominant nation! Even the hostility experienced by Cosmopolites towards Chauvinists—and in general to those who distinguish the cultures of individual Romano-Germanic nations—even this hostility has a parallel in the Chauvinist worldview. Namely, the Chauvinists are always hostile to any attempts at separatism by the various parts of their own nation. They try to erase and obscure all regional particularities that could disrupt their nation’s unity. Therefore, as it turns out, there is complete parallelism between the Chauvinist and the Cosmopolite. It is essentially the same treatment of the ethno-anthropological group to which the person happens to belong. The only difference is that the Chauvinist takes a narrower ethnic group than the Cosmopolite. And in doing so, the Chauvinist nonetheless takes a group that is not entirely homogeneous—while the Cosmopolite, in turn, still ends up choosing a particular group. Thus the difference is only in scale, not in principle. Cosmopolitanism is Romano-Germanic chauvinism Summary Cosmopolitanism is pan-Romano-Germanic chauvinism. It is founded on unconscious prejudice and the egocentric mentality that all people have—everyone thinks their group is superior. When evaluating European cosmopolitanism, we must remember that terms like “mankind”, “human civilization”, etc. are highly nebulous terms that act as cover for very specific ethnographic concepts. The culture of Europe is not the culture of mankind. It is a product of the history of a particular ethnic grouping. Germanic and Celtic tribes, having been subjected to various degrees of Roman cultural influence, and having strongly intermixed amongst themselves, created a well-known, common way of life from elements of their own national culture and Roman culture. As a result of shared ethnographic and geographical conditions, for a long time they lived a shared existence, with a common history and way of life. Their constant communication with each other made their shared elements so numerous that they always unconsciously harbored a sense of Romano-Germanic unity. With time, like so many other peoples, they developed a thirst for studying the sources of their culture. The discovery of monuments to Roman and Greek culture brought to the surface the concept of a transnational world civilization, a concept that is very natural to the Greco-Ro'
