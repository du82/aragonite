title = "Sass: Sass color spaces & wide gamut colors"
description = "Syntactically Awesome Style Sheets"
full_description = '''Sass color spaces & wide gamut colors Posted 11 September 2024 by Miriam Suzanne Wide gamut colors are coming to Sass! I should clarify. Wide gamut CSS color formats like oklch(…) and color(display-p3 …) have been available in all major browsers since May, 2023. But even before that, these new color formats were allowed in Sass. This is one of my favorite features of Sass: most new CSS just works, without any need for "official" support or updates. When Sass encounters unknown CSS, it passes that code along to the browser. Not everything needs to be pre-processed. Often, that’s all we need. When Cascade Layers and Container Queries rolled out in browsers, there was nothing more for Sass to do. But the new CSS color formats are a bit different. Since colors are a first-class data type in Sass, we don’t always want to pass them along as-is. We often want to manipulate and manage colors before they go to the browser. Already know all about color spaces? Skip ahead to the new Sass features! The color format trade-offThe color format trade-off permalink CSS has historically been limited to sRGB color formats, which share two main features: They use an underlying RGB color model for representing & manipulating colors mathematically by controlling the relative amounts of red, green, and blue light. They can only represent colors in the sRGB color gamut – the default range of color that can be displayed on color monitors since the mid 1990s. Clear gamut boundariesClear gamut boundaries permalink The previously available formats in CSS – named colors (e.g. red), hex colors (e.g. #f00), and color functions (e.g. rgb()/rgba(), hsl()/hsla(), and more recently hwb()) – are all ways of describing sRGB colors. Named colors are special, but the other formats use a ‘coordinate’ system, as though the colors of the gamut were projected into 3d space: Images generated using ColorAide by Isaac Muse. Look at those nice, geometric shapes! RGB gives us a rainbow cube, while HSL and HWB (with their "polar" hue channels) arrange those same colors into cylinders. The clean boundaries make it easy for us to know (mathematically) what colors are in gamut or out of gamut. In rgb() we use values of 0-255. Anything inside that range will be inside the cube, but if a channel goes below 0 or above 255, we’re no longer inside the sRGB gamut. In hsl() and hwb() the hue coordinates can keep going around the circle without ever reaching escape velocity, but the saturation, lightness, whiteness, and blackness channels go cleanly from 0-1 or 0%-100%. Again, anything outside that range is outside the color space. Matching human perceptionMatching human perception permalink But that simplicity comes with limitations. The most obvious is that monitors keep getting better. These days, many monitors can display colors beyond sRGB, especially extending the range of bright greens available. If we simply extend our shapes with the new colors available, we’re no longer dealing with clean geometry! The crisp edges and clean math of sRGB formats were only possible because we knew exactly what colors could be displayed, and we arranged those colors to fit perfectly into a box. But human color perception is not so clear-cut, and it doesn’t align perfectly with the gamut of any monitors on the market. When we attempt to space all the same colors evenly based on human perception rather than simple math, we get an entirely different shape with swooping edges. This is the display-p3 gamut in oklch space: The practical difference is particularly noticeable when we compare colors of the same ‘lightness’ in hsl vs oklch. Humans perceive yellow hues as lighter than blues. By scaling them to fit in the same range, hsl gives us a yellow that is much brighter than the blue: New CSS formats give us the choiceNew CSS formats give us the choice permalink Moving forward, there are two directions we could go with wide gamut colors: Color formats that re-fit larger and larger gamuts into simple coordinates, stretching the colors to preserve clean, geometric boundaries. Color formats that maintain their perceptually uniform spacing, without any regard for specific gamuts. On the one hand, clean boundaries allow us to easily stay inside the range of available colors. Without those boundaries, it would be easy to accidentally request colors that aren’t even physically possible. On the other hand, we expect these colors to be perceived by other humans – and we need to make things look consistent, with enough contrast to be readable. The CSS Color Module Level 4 defines a number of new CSS color formats. Some of them maintain geometric access to specific color spaces. Like the more familiar rgb() and hsl() functions, the newer hwb() function still describes colors in the sRGB gamut, using hue, whiteness, and blackness channels. It’s an interesting format, and I’ve written about it before. The rest of the gamut-bounded spaces are available using the color(<space> <3-channels> / <alpha>) function. Using that syntax we can define colors in sRGB, srbg-linear, display-p3 (common for modern monitors), a98-rgb, prophoto-rgb, and rec2020. Each of these maps the specified gamut onto a range of (cubic) coordinates from 0-1 or 0%-100%. Nice and clean. In the same color() function, we can also access the ‘device independent’ (and gamut-less) xyz color spaces – often used as an international baseline for converting between different color models. I won’t get into white points here, but we can specify xyz-d65 (the default) explicitly, or use xyz-d50 instead. Working outwards from xyz, we get a number of new theoretically unbounded color formats – prioritizing perceptually uniform distribution over clean geometry. These are available in functions of their own, including lab() (lightness, a, and b) and lch() (lightness, chroma, and hue) along with the newer ‘ok’ versions of each – oklab() and oklch(). If you want the full history of these formats, Eric Portis has written a great explainer. TL;DR top priority new formatsTL;DR top priority new formats permalink For the color experts, it’s great to have all this flexibility. For the rest of us, there are a few stand-out formats: color(display-p3 …) provides access to a wider gamut of colors, which are available on many modern displays, while maintaining a clear set of gamut boundaries. oklch(…) is the most intuitive and perceptually uniform space to work in, a newer alternative to hsl(…) – chroma is very similar to saturation. But there are few guard rails here, and it’s easy to end up outside the gamuts that any screen can possibly display. The coordinate system is still describing a cylinder, but the edges of human perception and display technology don’t map neatly into that space. For transitions and gradients, if we want to go directly between hues (instead of going around the color wheel), oklab(…) is a good linear option. Usually, a transition or gradient between two in-gamut colors will stay in gamut – but we can’t always rely on that when we’re dealing with extremes of saturation or lightness. CSS color functions in SassCSS color functions in Sass permalink Sass now accepts all the new CSS formats, and treats them as first-class colors that we can manipulate, mix, convert, and inspect. These functions are all available globally: lab(), oklab(), lch(), and oklch() color() using the sRGB, srgb-linear, display-p3, a98-rgb, prophoto-rgb, rec2020, xyz, xyz-d65, and xyz-d50 color spaces hwb() (Sass previously had a color.hwb() function, which is now deprecated in favor of the global function) The Sass color functions use the same syntax as the CSS functions, which means that a given color can be represented in a variety of different spaces. For example, these are all the same color: SCSS Sass Playground SCSS Syntax@debug MediumVioletRed; @debug #C71585; @debug hsl(322.2 80.91% 43.14%); @debug oklch(55.34% 0.2217 349.7); @debug color(display-p3 0.716 0.1763 0.5105); Playground Sass Syntax@debug MediumVioletRed @debug #C71585 @debug hsl(322.2 80.91% 43.14%) @debug oklch(55.34% 0.2217 349.7) @debug color(display-p3 0.716 0.1763 0.5105) Sass colors hold their spaceSass colors hold their space permalink Historically, both CSS and Sass would treat the different color-spaces as interchangeable. When all the color formats describe the same color gamut using the same underlying model, you can provide a color using hsl() syntax, and the parser can eagerly convert it to rgb() without risking any data loss. That’s no longer the case for modern color spaces. In general, any color defined in a given space will remain in that space, and be emitted in that space. The space is defined by the function used, either one of the named spaced passed to color(), or the function name (e.g. lab for colors defined using the lab() function). However, the rgb, hsl, and hwb spaces are considered "legacy spaces", and often get special handling for the sake of backwards compatibility. Legacy colors are still emitted in the most backwards-compatible format available. This matches CSS’s own backwards-compatibility behavior. Colors defined using hex notation or CSS color names are also considered part of the legacy rgb color space. Sass provides a variety of tools for inspecting and working with these color spaces: We can inspect the space of a color using color.space($color) We can ask if the color is in a legacy space with color.is-legacy($color) We can convert a color from one space to another using color.to-space($color, $space) All of these functions are provided by the built-in Sass Color Module: SCSS Sass Playground SCSS Syntax@use 'sass:color'; $brand: MediumVioletRed; // results: rgb, true @debug color.space($brand); @debug color.is-legacy($brand); // result: oklch(55.34% 0.2217 349.7) @debug color.to-space($brand, 'oklch'); // results: oklch, false @debug color.space($brand); @debug color.is-legacy($brand); Playground Sass Syntax@use 'sass:color' $brand: MediumVioletRed // results: rgb, true @debug color.space($brand) @debug color.is-legacy($brand) // result: oklch(55.34% 0.2217 349.7) @debug color.to-space($brand, 'oklch') // results: oklch, false @debug color.space($brand) @debug color.is-legacy($brand) Once we convert a color between spaces, we no longer consider those colors to be equal. But we can ask if they would render as ‘the same’ color, using the color.same() function: SCSS Sass Playground SCSS Syntax@use 'sass:color'; $orange-rgb: #ff5f00; $orange-oklch: oklch(68.72% 20.966858279% 41.4189852913deg); // result: false @debug $orange-rgb == $orange-oklch; // result: true @debug color.same($orange-rgb, $orange-oklch); Playground Sass Syntax@use 'sass:color' $orange-rgb: #ff5f00 $orange-oklch: oklch(68.72% 20.966858279% 41.4189852913deg) // result: false @debug $orange-rgb == $orange-oklch // result: true @debug color.same($orange-rgb, $orange-oklch) We can inspect the individual channels of a color using color.channel(). By default, it only supports channels that are available in the color’s own space, but we can pass the $space parameter to return the value of the channel value after converting to the given space: SCSS Sass Playground SCSS Syntax@use 'sass:color'; $brand: hsl(0 100% 25.1%); // result: 25.1% @debug color.channel($brand, "lightness"); // result: 37.67% @debug color.channel($brand, "lightness", $space: oklch); Playground Sass Syntax@use 'sass:color' $brand: hsl(0 100% 25.1%) // result: 25.1% @debug color.channel($brand, "lightness") // result: 37.67% @debug color.channel($brand, "lightness", $space: oklch) CSS has also introduced the concept of ‘powerless’ and ‘missing’ color channels. For example, an hsl color with 0% saturation will always be grayscale. In that case, we can consider the hue channel to be powerless. Changing its value won’t have any impact on the resulting color. Sass allows us to ask if a channel is powerless using the color.is-powerless() function: SCSS Sass Playground SCSS Syntax@use 'sass:color'; $gray: hsl(0 0% 60%); // result: true, because saturation is 0 @debug color.is-powerless($gray, "hue"); // result: false @debug color.is-powerless($gray, "lightness"); Playground Sass Syntax@use 'sass:color' $gray: hsl(0 0% 60%) // result: true, because saturation is 0 @debug color.is-powerless($gray, "hue") // result: false @debug color.is-powerless($gray, "lightness") Taking that a step farther, CSS also allows us to explicitly mark a channel as ‘missing’ or unknown. That can happen automatically if we convert a color like gray into a color space like oklch – we don’t have any information about the hue. We can also create colors with missing channels explicitly by using the none keyword, and inspect if a color channel is missing with the color.is-missing() function: SCSS Sass Playground SCSS Syntax@use 'sass:color'; $brand: hsl(none 100% 25.1%); // result: false @debug color.is-missing($brand, "lightness"); // result: true @debug color.is-missing($brand, "hue"); Playground Sass Syntax@use 'sass:color' $brand: hsl(none 100% 25.1%) // result: false @debug color.is-missing($brand, "lightness") // result: true @debug color.is-missing($brand, "hue") Like CSS, Sass maintains missing channels where they can be meaningful, but treats them as a value of 0 when a channel value is required. Manipulating Sass colorsManipulating Sass colors permalink The existing color.scale(), color.adjust(), and color.change() functions will continue to work as expected. By default, all color manipulations are performed in the space provided by the color. But we can now also specify an explicit color space for transformations: SCSS Sass Playground SCSS Syntax@use 'sass:color'; $brand: hsl(0 100% 25.1%); // result: hsl(0 100% 43.8%) @debug color.scale($brand, $lightness: 25%); // result: hsl(5.76 56% 45.4%) @debug color.scale($brand, $lightness: 25%, $space: oklch); Playground Sass Syntax@use 'sass:color' $brand: hsl(0 100% 25.1%) // result: hsl(0 100% 43.8%) @debug color.scale($brand, $lightness: 25%) // result: hsl(5.76 56% 45.4%) @debug color.scale($brand, $lightness: 25%, $space: oklch) Note that the returned color is still returned in the original color space, even when the adjustment is performed in a different space. That way we can start to use more advanced color spaces like oklch where they are useful, without necessarily relying on browsers to support those formats. The existing color.mix() function will also maintain existing behavior when both colors are in legacy color spaces. Legacy mixing is always done in rgb space. We can opt into other mixing techniques using the new $method parameter, which is designed to match the CSS specification for describing interpolation methods – used in CSS gradients, filters, animations, and transitions as well as the new CSS color-mix() function. For legacy colors, the method is optional. But for non-legacy colors, a method is required. In most cases, the method can simply be a color space name. But when we’re using a '''
