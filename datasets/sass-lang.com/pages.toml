title = "Sass: @each"
description = "Syntactically Awesome Style Sheets"
full_description = '@each Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API The @each rule makes it easy to emit styles or evaluate code for each element of a list or each pair in a map. It’s great for repetitive styles that only have a few variations between them. It’s usually written @each <variable> in <expression> { ... }, where the expression returns a list. The block is evaluated for each element of the list in turn, which is assigned to the given variable name. SCSS Sass CSS Playground SCSS Syntax$sizes: 40px, 50px, 80px; @each $size in $sizes { .icon-#{$size} { font-size: $size; height: $size; width: $size; } } Playground Sass Syntax$sizes: 40px, 50px, 80px @each $size in $sizes .icon-#{$size} font-size: $size height: $size width: $size CSS Output.icon-40px { font-size: 40px; height: 40px; width: 40px; } .icon-50px { font-size: 50px; height: 50px; width: 50px; } .icon-80px { font-size: 80px; height: 80px; width: 80px; } With MapsWith Maps permalink You can also use @each to iterate over every key/value pair in a map by writing it @each <variable>, <variable> in <expression> { ... }. The key is assigned to the first variable name, and the element is assigned to the second. SCSS Sass CSS Playground SCSS Syntax$icons: ("eye": "\f112", "start": "\f12e", "stop": "\f12f"); @each $name, $glyph in $icons { .icon-#{$name}:before { display: inline-block; font-family: "Icon Font"; content: $glyph; } } Playground Sass Syntax$icons: ("eye": "\f112", "start": "\f12e", "stop": "\f12f") @each $name, $glyph in $icons .icon-#{$name}:before display: inline-block font-family: "Icon Font" content: $glyph CSS Output.icon-eye:before { display: inline-block; font-family: "Icon Font"; content: "\f112"; } .icon-start:before { display: inline-block; font-family: "Icon Font"; content: "\f12e"; } .icon-stop:before { display: inline-block; font-family: "Icon Font"; content: "\f12f"; } DestructuringDestructuring permalink If you have a list of lists, you can use @each to automatically assign variables to each of the values from the inner lists by writing it @each <variable...> in <expression> { ... }. This is known as destructuring, since the variables match the structure of the inner lists. Each variable name is assigned to the value at the corresponding position in the list, or null if the list doesn’t have enough values. SCSS Sass CSS Playground SCSS Syntax$icons: "eye" "\f112" 12px, "start" "\f12e" 16px, "stop" "\f12f" 10px; @each $name, $glyph, $size in $icons { .icon-#{$name}:before { display: inline-block; font-family: "Icon Font"; content: $glyph; font-size: $size; } } Playground Sass Syntax$icons: "eye" "\f112" 12px, "start" "\f12e" 16px, "stop" "\f12f" 10px @each $name, $glyph, $size in $icons .icon-#{$name}:before display: inline-block font-family: "Icon Font" content: $glyph font-size: $size CSS Output.icon-eye:before { display: inline-block; font-family: "Icon Font"; content: "\f112"; font-size: 12px; } .icon-start:before { display: inline-block; font-family: "Icon Font"; content: "\f12e"; font-size: 16px; } .icon-stop:before { display: inline-block; font-family: "Icon Font"; content: "\f12f"; font-size: 10px; } 💡 Fun fact: Because @each supports destructuring and maps count as lists of lists, @each’s map support works without needing special support for maps in particular. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'
year_published = 2025
