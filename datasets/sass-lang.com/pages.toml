["https://sass-lang.com/blog/node-sass-is-end-of-life"]
title = "Sass: Node Sass is end-of-life"
description = "Syntactically Awesome Style Sheets"
full_description = "Node Sass is end-of-life Posted 24 July 2024 by Natalie Weizenbaum The time has finally come to retire Node Sass. This Node.js wrapper for LibSass was the first official Sass compiler available in the JavaScript ecosystem and was a huge part of Sass growing beyond the scope of the Ruby community where it originated, but it hasn’t received a new release in a year and a half and the most recent set of maintainers no longer have the bandwidth to continue updating it. The npm package has been marked as deprecated, and the GitHub repository has been archived to mitigate confusion about which Sass repositories are still being developed. If you’re still using Node Sass, we strongly recommend you take this opportunity to migrate to the primary implementation, Dart Sass, instead. The LibSass implementation that Node Sass used remains deprecated but not yet end-of-life, as its maintainer Marcel Greter continues to make occasional fixes. However, there is no longer an officially-supported way to use this implementation from Node.js. I want to take this opportunity to thank everyone who used Node Sass over the years, as well as the major contributors: Michael Mifsud Adeel Mujahid Andrew Nesbitt Nick Schonning Marcin Cieślak And of course all the contributors to the underlying LibSass project as well. Without you, we wouldn’t be here today! Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide"
year_published = 2025
clearnet = "https://sass-lang.com/blog/node-sass-is-end-of-life"
tags = ["end-of-life", "free", "libsass", "node", "palestine", "sass"]
