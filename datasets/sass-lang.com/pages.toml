title = "Sass: @while"
description = "Syntactically Awesome Style Sheets"
full_description = '''@while Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API The @while rule, written @while <expression> { ... }, evaluates its block if its expression returns true. Then, if its expression still returns true, it evaluates its block again. This continues until the expression finally returns false. SCSS Sass CSS Playground SCSS Syntax@use "sass:math"; /// Divides `$value` by `$ratio` until it's below `$base`. @function scale-below($value, $base, $ratio: 1.618) { @while $value > $base { $value: math.div($value, $ratio); } @return $value; } $normal-font-size: 16px; sup { font-size: scale-below(20px, 16px); } Playground Sass Syntax@use "sass:math" /// Divides `$value` by `$ratio` until it's below `$base`. @function scale-below($value, $base, $ratio: 1.618) @while $value > $base $value: math.div($value, $ratio) @return $value $normal-font-size: 16px sup font-size: scale-below(20px, 16px) CSS Outputsup { font-size: 12.3609394314px; } ⚠️ Heads up! Although @while is necessary for a few particularly complex stylesheets, you’re usually better of using either @each or @for if either of them will work. They’re clearer for the reader, and often faster to compile as well. Truthiness and FalsinessTruthiness and Falsiness permalink Anywhere true or false are allowed, you can use other values as well. The values false and null are falsey, which means Sass considers them to indicate falsehood and cause conditions to fail. Every other value is considered truthy, so Sass considers them to work like true and cause conditions to succeed. For example, if you want to check if a string contains a space, you can just write string.index($string, " "). The string.index() function returns null if the string isn’t found and a number otherwise. ⚠️ Heads up! Some languages consider more values falsey than just false and null. Sass isn’t one of those languages! Empty strings, empty lists, and the number 0 are all truthy in Sass. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'''
