description = "Syntactically Awesome Style Sheets"
full_description = "At-Rules Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API Much of Sass’s extra functionality comes in the form of new at-rules it adds on top of CSS: @use loads mixins, functions, and variables from other Sass stylesheets, and combines CSS from multiple stylesheets together. @forward loads a Sass stylesheet and makes its mixins, functions, and variables available when your stylesheet is loaded with the @use rule. @import extends the CSS at-rule to load styles, mixins, functions, and variables from other stylesheets. @mixin and @include makes it easy to re-use chunks of styles. @function defines custom functions that can be used in SassScript expressions. @extend allows selectors to inherit styles from one another. @at-root puts styles within it at the root of the CSS document. @error causes compilation to fail with an error message. @warn prints a warning without stopping compilation entirely. @debug prints a message for debugging purposes. Flow control rules like @if, @each, @for, and @while control whether or how many times styles are emitted. Sass also has some special behavior for plain CSS at-rules: they can contain interpolation, and they can be nested in style rules. Some of them, like @media and @supports, also allow SassScript to be used directly in the rule itself without interpolation. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide"
