title = "Sass: Breaking Change: abs() Percentage"
description = "Syntactically Awesome Style Sheets"
full_description = 'Breaking Change: abs() Percentage Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API Sass has historically supported the abs() function. After CSS supported calculations in Values and Units Level 4, we had to workaround backwards-compatibility. However, for the abs() function we posses a compatibility problem supporting the % unit. The abs() global function in Sass supported the % unit as an input and would resolve the abs() function before resolving the % value. For instance, if the input was abs(10%) the function will return 10%. As a result, if the value of 10% represented -50px the function would return -50px. However, the CSS abs() abs function will resolve the % before resolving the function. Therefore if the value of 10% represented -50px, abs(10%) would return -10% which in the browser would be 50px. For this reason, we are deprecating the global abs() function with a percentage. To preserve the current behavior, use math.abs() instead. Can I Silence the Warnings?Can I Silence the Warnings? permalink Sass provides a powerful suite of options for managing which deprecation warnings you see and when. Terse and Verbose ModeTerse and Verbose Mode permalink By default, Sass runs in terse mode, where it will only print each type of deprecation warning five times before it silences additional warnings. This helps ensure that users know when they need to be aware of an upcoming breaking change without creating an overwhelming amount of console noise. If you run Sass in verbose mode instead, it will print every deprecation warning it encounters. This can be useful for tracking the remaining work to be done when fixing deprecations. You can enable verbose mode using the --verbose flag on the command line, or the verbose option in the JavaScript API. ⚠️ Heads up! When running from the JS API, Sass doesn’t share any information across compilations, so by default it’ll print five warnings for each stylesheet that’s compiled. However, you can fix this by writing (or asking the author of your favorite framework’s Sass plugin to write) a custom Logger that only prints five errors per deprecation and can be shared across multiple compilations. Silencing Deprecations in DependenciesSilencing Deprecations in Dependencies permalink Sometimes, your dependencies have deprecation warnings that you can’t do anything about. You can silence deprecation warnings from dependencies while still printing them for your app using the --quiet-deps flag on the command line, or the quietDeps option in the JavaScript API. For the purposes of this flag, a "dependency" is any stylesheet that’s not just a series of relative loads from the entrypoint stylesheet. This means anything that comes from a load path, and most stylesheets loaded through custom importers. Silencing Specific DeprecationsSilencing Specific Deprecations permalink If you know that one particular deprecation isn’t a problem for you, you can silence warnings for that specific deprecation using the --silence-deprecation flag on the command line, or the silenceDeprecations option in the JavaScript API. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'
year_published = 2025
