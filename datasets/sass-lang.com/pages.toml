["https://sass-lang.com/documentation/breaking-changes"]
title = "Sass: Breaking Changes"
description = "Syntactically Awesome Style Sheets"
full_description = "Breaking Changes Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API New versions of Sass are as backwards-compatible as possible, but sometimes a breaking change is necessary. Sass needs to keep up with the evolving CSS specification, and old language design mistakes occasionally need to be fixed. Before each breaking change is released, Sass implementations will produce deprecation warnings for stylesheets whose behavior will change. Whenever possible, these warnings will include suggestions for how to update the deprecated styles to make them forward-compatible. Different implementations have different policies for breaking changes and deprecations. Dart Sass will emit deprecation warnings for at least three months before releasing a breaking change, and will release the breaking change with a new major version number unless that change is necessary for CSS compatibility. CSS compatibility changes are often both non-disruptive and time-sensitive, so they may be released with new minor version numbers instead. These breaking changes are coming soon or have recently been released: The legacy JS API beginning in Dart Sass 1.79.0. Certain uses of the JS color API are deprecated beginning in Dart Sass 1.79.0. A number of color functions are deprecated beginning in Dart Sass 1.79.0, in favor of new CSS Color 4-compatible functions. The meta.feature-exists() function is deprecated beginning in Dart Sass 1.78.0. Mixing declarations with nested rules is changing behavior beginning in Dart Sass 1.77.7. Functions and Mixins Beginning with -- are deprecated beginning in Dart Sass 1.76.0. Passing a percentage unit to the global abs() is deprecated beginning in Dart Sass 1.65.0. Passing null as an alpha channel to new SassColor() is changing behavior beginning in Dart Sass 1.64.3. Loading Sass as a default export in JS is no longer allowed beginning in Dart Sass 1.63.0. A variable may only have a single !global or !default flag beginning in Dart Sass 1.62.0. Selectors with invalid combinators are invalid beginning in Dart Sass 1.54.0. / is changing from a division operation to a list separator beginning in Dart Sass 1.33.0. Functions are stricter about which units they allow beginning in Dart Sass 1.32.0. Parsing the special syntax of @-moz-document will be invalid beginning in Dart Sass 1.7.2. Compound selectors could not be extended in Dart Sass 1.0.0 and Ruby Sass 4.0.0. The syntax for CSS custom property values changed in Dart Sass 1.0.0, LibSass 3.5.0, and Ruby Sass 3.5.0. Early Opt-InEarly Opt-In permalink Dart Sass users can opt in to treat deprecations as errors early using the --fatal-deprecation command line option. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide"
