["https://sass-lang.com/documentation/js-api"]
title = "Sass: sass | JS API"
description = "Syntactically Awesome Style Sheets"
full_description = '''Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API sass The Sass JavaScript API can be used to to drive Sass Compilations from JavaScript. It even allows an application to control how stylesheets are loaded and define custom functions. The sass package on npm is a pure-JavaScript package built from the Dart Sass implementation, and includes Dart Sass's command-line interface. The sass-embedded package on npm is a JavaScript wrapper around a native Dart executable, and in general is faster than sass. Both sass and sass-embedded provide the same JavaScript API using the same underlying Dart Sass implementation, but have speed and platform tradeoffs. UsageThe JavaScript API provides two entrypoints for compiling Sass to CSS, each of which has a synchronous variant that returns a plain CompileResult and an asynchronous variant that returns a Promise. The asynchronous variants are much slower, but they allow custom importers and functions to run asynchronously. compile and compileAsync take a path to a Sass file and return the result of compiling that file to CSS. These functions accept an additional Options argument. const sass = require('sass');const result = sass.compile("style.scss");console.log(result.css);const compressed = sass.compile("style.scss", {style: "compressed"});console.log(compressed.css); Copy compileString and compileStringAsync take a string that represents the contents of a Sass file and return the result of compiling that file to CSS. These functions accept an additional StringOptions argument. const sass = require('sass');const input = `h1 { font-size: 40px; code { font-face: Roboto Mono; }}`;const result = sass.compileString(input);console.log(result.css);const compressed = sass.compileString(input, {style: "compressed"});console.log(compressed.css); Copy IntegrationsMost popular Node.js build systems have integrations available for the JS API: Webpack uses the sass-loader package. Gulp uses the gulp-sass package. Broccoli uses the broccoli-sass-source-maps package. Ember uses the ember-cli-sass package. Grunt uses the grunt-sass package. Legacy APIThe sass package also supports an older API. Although this API is deprecated, it will continue to be supported until the release of version 2.0.0 of the sass package. The legacy API is also supported by the node-sass package, which is a native extension wrapper for the deprecated LibSass implementation. The legacy API has two entrypoints for compiling Sass to CSS. Each one can compile either a Sass file by passing in LegacyFileOptions or a string of Sass code by passing in a LegacyStringOptions. renderSync runs synchronously. It's by far the fastest option when using Dart Sass, but at the cost of only supporting synchronous importer and function plugins. const sass = require('sass'); // or require('node-sass');const result = sass.renderSync({file: "style.scss"});console.log(result.css.toString()); Copy render runs asynchronously and calls a callback when it finishes. It's much slower when using Dart Sass, but it supports asynchronous importer and function plugins. const sass = require('sass'); // or require('node-sass');sass.render({ file: "style.scss"}, function(err, result) { if (err) { // ... } else { console.log(result.css.toString()); }}); Copy SpeedWhile multiple factors go into how long Sass compilations take, there are general speed trends that can help you minimize your compilation time. With the sass packageWith the sass package, the synchronous calls will be faster than asynchronous calls due to the overhead of making the entire evaluation process asynchronous. While the Compiler and AsyncCompiler class are available, they aren't faster than than the module-level compilation methods when using sass. With the sass-embedded packageThe sass-embedded package provides significant speed improvements in certain situations, and is generally faster than sass for large or frequent compilations. When using the module-level compilation methods, asynchronous calls are generally faster than synchronous ones due to the overhead of emulating synchronous messaging with worker threads and concurrent compilations being blocked on the main thread. The Compiler and AsyncCompiler classes provide significant improvements when using the sass-embedded package. These classes persist and reuse a single Dart process across multiple compilations, avoiding the need to repeatedly start up and tear down a process. When compiling a single file using sass-embedded, there is not much difference between the synchronous and asynchronous methods. When running multiple compilations at the same time, an AsyncCompiler will be considerably faster than a synchronous Compiler. Other factors like Functions, Importers and the complexity of your Sass files may also impact what compilation methods work best for your particular use case. sass Compile AsyncCompiler Compiler CompileResult compile compileAsync compileString compileStringAsync initAsyncCompiler initCompiler Options Options StringOptions OutputStyle StringOptionsWithImporter StringOptionsWithoutImporter Syntax Logger Logger silent Logger SourceLocation SourceSpan LoggerWarnOptions Importer NodePackageImporter FileImporter Importer ImporterResult Custom Function CalculationInterpolation CalculationOperation SassArgumentList SassBoolean SassCalculation SassColor SassFunction SassList SassMap SassMixin SassNumber SassString Value CalculationOperator CalculationValue CustomFunction ListSeparator sassFalse sassNull sassTrue Other Exception CanonicalizeContext Deprecations LegacyFileOptions ChannelName ChannelNameHsl ChannelNameHwb ChannelNameLab ChannelNameLch ChannelNameRgb ChannelNameXyz ColorSpaceHsl ColorSpaceHwb ColorSpaceLab ColorSpaceLch ColorSpaceRgb ColorSpaceXyz GamutMapMethod HueInterpolationMethod KnownColorSpace PolarColorSpace PromiseOr RectangularColorSpace info Legacy types Boolean Color Error List Map Null Number String LegacyException LegacyImporterThis LegacyPluginThis LegacyResult LegacySharedOptions LegacyStringOptions LegacyAsyncFunction LegacyAsyncFunctionDone LegacyAsyncImporter LegacyFunction LegacyImporter LegacyImporterResult LegacyOptions LegacySyncFunction LegacySyncImporter LegacyValue FALSE NULL TRUE render renderSync Messages Version Deprecation DeprecationOrId DeprecationStatus deprecations Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'''
