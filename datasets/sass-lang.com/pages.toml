title = "Sass: Breaking Change: Color JS API"
description = "Compatibility:Dart Sass  since 1.79.0  LibSass  ✗  Ruby Sass  ✗"
full_description = 'Breaking Change: Color JS API Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API Certain aspects of the JS color API that were designed with the assumption that all colors were mutually compatible no longer make sense now that Sass supports all the color spaces of CSS Color 4. Just as some aspects of Sass’s color functions are being deprecated with the addition of support for CSS Color 4, some corners of the JS API for manipulating colors are deprecated as well. color.change() now requires a space for cross-space changescolor.change() now requires a space for cross-space changes permalink Previously, the color.change() method just took a set of channel names from the RGB, HSL, or HWB spaces. As long as those channels weren’t mixed across spaces (for example by changing both red and hue at the same time), Sass could figure out which space was intended. With Color 4, color spaces are no longer unambiguous from their channel names alone. Many spaces have red, green, and blue channels with different ranges; many spaces have hue channels which produce very different color wheels. To fix this ambiguity, color.change() now takes a space parameter which explicitly specifies the name of the color space you want to do the transformation in: const color = new sass.SassColor({red: 0x66, green: 0x33, blue: 0x99}); color.change({hue: 270, space: "okclh"}); Specifying the color space is mandatory if the color in question isn’t in a legacy color space or if you’re changing a channel like chroma that only exists in non-legacy color spaces. It’s always optional if you’re changing a channel that exists in the color’s own space, so color.change({red: 0.8}) always refers to the native red channel of any color with red, green, and blue channels. For backwards-compatibility, if you’re changing legacy channels for a legacy color, Sass will still automatically convert the color for you. However, this behavior is deprecated. To be safe, you should always pass the space parameter unless you’re sure the color is already in the color space whose channel you want to change. null channel valuesnull channel values permalink One of the major changes in CSS Color 4 is the new concept of "missing" channels. For example, hsl(none 0% 40%) has a missing hue, which is treated as 0 in most cases but doesn’t contribute to color interpolation so that a gradient with this color won’t have a phantom red hue in the middle. When constructing colors, Sass represents missing values as the value null. Before adding support for CSS Color 4, the Sass JS API’s TypeScript types forbade the use of null in all places where it was relevant. However, the code itself treated null the same as undefined, and we don’t want to break compatibility with any plain JavaScript code that was relying on this behavior. For now, a null value is treated as undefined and emits a deprecation warning when constructing a new legacy color or calling color.change() for a legacy color. In either case, if you pass a space parameter explicitly, you’ll opt into the new behavior and null will be treated as a missing channel. Transition PeriodTransition Period permalink Compatibility: Dart Sass since 1.79.0 LibSass ✗ Ruby Sass ✗ First, we’ll emit deprecation warnings for all uses of these APIs that are slated to be changed. In Dart Sass 2.0.0, the breaking changes will go into effect fully, and the old behavior will no longer work how it used to. Can I Silence the Warnings?Can I Silence the Warnings? permalink Sass provides a powerful suite of options for managing which deprecation warnings you see and when. Terse and Verbose ModeTerse and Verbose Mode permalink By default, Sass runs in terse mode, where it will only print each type of deprecation warning five times before it silences additional warnings. This helps ensure that users know when they need to be aware of an upcoming breaking change without creating an overwhelming amount of console noise. If you run Sass in verbose mode instead, it will print every deprecation warning it encounters. This can be useful for tracking the remaining work to be done when fixing deprecations. You can enable verbose mode using the verbose option in the JavaScript API. ⚠️ Heads up! When running from the JS API, Sass doesn’t share any information across compilations, so by default it’ll print five warnings for each stylesheet that’s compiled. However, you can fix this by writing (or asking the author of your favorite framework’s Sass plugin to write) a custom Logger that only prints five errors per deprecation and can be shared across multiple compilations. Silencing Deprecations in DependenciesSilencing Deprecations in Dependencies permalink Sometimes, your dependencies have deprecation warnings that you can’t do anything about. You can silence deprecation warnings from dependencies while still printing them for your app using the quietDeps option in the JavaScript API. For the purposes of this flag, a "dependency" is any stylesheet that’s not just a series of relative loads from the entrypoint stylesheet. This means anything that comes from a load path, and most stylesheets loaded through custom importers. Silencing Specific DeprecationsSilencing Specific Deprecations permalink If you know that one particular deprecation isn’t a problem for you, you can silence warnings for that specific deprecation using the silenceDeprecations option in the JavaScript API. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'
year_published = 2025
clearnet = "https://sass-lang.com/documentation/breaking-changes/color-4-api"
