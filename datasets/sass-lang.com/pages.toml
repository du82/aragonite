full_description = 'Documentation Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API Sass is a stylesheet language that’s compiled to CSS. It allows you to use variables, nested rules, mixins, functions, and more, all with a fully CSS-compatible syntax. Sass helps keep large stylesheets well-organized and makes it easy to share design within and across projects. If you’re looking for an introduction to Sass, check out the tutorial. If you want to look up a built-in Sass function, look no further than the built-in module reference. If you’re calling Sass from JavaScript, you may want the JS API documentation. Or the Dart API documentation if you’re calling it from Dart. Otherwise, use the table of contents for the language reference! Older VersionsOlder Versions permalink This documentation is written for the most recent version of the Sass language. If you’re using Dart Sass 1.85.1, you’ll have access to all the features described here. But if you’re using an older version of Dart Sass or a deprecated Sass implementation like LibSass or Ruby Sass, there may be some behavioral differences. Anywhere behavior differs between versions or implementations, the documentation includes a compatibility indicator like this: Compatibility (Feature Name): Dart Sass ✓ LibSass since 3.6.0 Ruby Sass ✗ Implementations with a "✓" fully support the feature in question, and implementations with a "✗" don’t support it all. Implementations with a version number started supporting the feature in question at that version. Implementations can also be marked as "partial": Compatibility: Dart Sass ✓ LibSass partial Ruby Sass ✗ ➤ Additional details go here. This indicates that the implementation only supports some aspects of the feature. These compatibility indicators (and many others) have a "➤" button, which can be clicked to show more details about exactly how the implementations differ and which versions support which aspects of the feature in question. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'
