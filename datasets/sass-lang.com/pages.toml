["https://sass-lang.com/install"]
title = "Sass: Install Sass"
description = "Syntactically Awesome Style Sheets"
full_description = "Install Sass ApplicationsApplications permalink There are a good many applications that will get you up and running with Sass in a few minutes for Mac, Windows, and Linux. You can download most of the applications for free but a few of them are paid apps (and totally worth it). CodeKit (Paid) Mac Prepros (Paid) Mac Windows Linux LibrariesLibraries permalink The Sass team maintains two Node.js packages for Sass, both of which support the standard JavaScript API. The sass package is pure JavaScript, which is a little slower but can be installed on all platforms Node.js supports. The sass-embedded package wraps a JS API around the Dart VM, so it’s faster but only supports Windows, Mac OS, and Linux. There are also community-maintained wrappers for the following languages: Ruby Swift Java, including: A Gradle plugin. A lightweight Maven plugin wrapping the Sass CLI. It specifies the Sass version to use. The CLI arguments are passed-in with an <args> list. A batteries-included Maven plugin wrapping Dart Sass. It bundles a fixed dart-sass version. The CLI arguments are exposed as Maven parameters. Command LineCommand Line permalink When you install Sass on the command line, you’ll be able to run the sass executable to compile .sass and .scss files to .css files. For example: sass source/stylesheets/index.scss build/stylesheets/index.css First install Sass using one of the options below, then run sass --version to be sure it installed correctly. If it did, this will include 1.85.1. You can also run sass --help for more information about the command-line interface. Once it’s all set up, go and play. If you’re brand new to Sass we’ve set up some resources to help you learn pretty darn quick. Learn More About Sass Install Anywhere (Standalone) You can install Sass on Windows, Mac, or Linux by downloading the package for your operating system from GitHub and adding it to your PATH. That’s all—there are no external dependencies and nothing else you need to install. Install Anywhere (npm) If you use Node.js, you can also install Sass using npm by running npm install -g sass However, please note that this will install the pure JavaScript implementation of Sass, which runs somewhat slower than the other options listed here. But it has the same interface, so it’ll be easy to swap in another implementation later if you need a bit more speed! Install on Windows (Chocolatey) If you use the Chocolatey package manager for Windows, you can install Dart Sass by running choco install sass Install on Mac OS X or Linux (Homebrew) If you use the Homebrew package manager for Mac OS X or Linux, you can install Dart Sass by running brew install sass/sass/sass Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide"
year_published = 2025
clearnet = "https://sass-lang.com/install"
