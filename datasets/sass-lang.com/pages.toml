full_description = '@debug Contents Syntax Overview Parsing a Stylesheet Structure of a Stylesheet Comments Special Functions Style Rules Overview Property Declarations Parent Selector Placeholder Selectors Variables Interpolation At-Rules Overview @use @forward @import @mixin and @include @function @extend @error @warn @debug @at-root Flow Control Overview @if and @else @each @for @while From CSS Values Overview Numbers Strings Colors Lists Maps true and false null Calculations Functions Mixins Operators Overview Equality Relational Numeric String Boolean Built-In Modules Overview sass:color sass:list sass:map sass:math sass:meta sass:selector sass:string Breaking Changes Overview Strict Unary Operators Invalid Combinators Media Queries Level 4 / as Division Function Units -moz-document Extending Compound Selectors CSS Variable Syntax Duplicate Variable Flags Default Exports Null Alpha Channel abs() Percentage Functions and Mixins Beginning with -- Mixed Declarations meta.feature-exists Color Functions Color JS API Legacy JS API Command Line Overview Dart Sass Ruby Sass Migrator JavaScript API Sometimes it’s useful to see the value of a variable or expression while you’re developing your stylesheet. That’s what the @debug rule is for: it’s written @debug <expression>, and it prints the value of that expression, along with the filename and line number. SCSS Sass Playground SCSS Syntax@mixin inset-divider-offset($offset, $padding) { $divider-offset: (2 * $padding) + $offset; @debug "divider offset: #{$divider-offset}"; margin-left: $divider-offset; width: calc(100% - #{$divider-offset}); } Playground Sass Syntax@mixin inset-divider-offset($offset, $padding) $divider-offset: (2 * $padding) + $offset @debug "divider offset: #{$divider-offset}" margin-left: $divider-offset width: calc(100% - #{$divider-offset}) The exact format of the debug message varies from implementation to implementation. This is what it looks like in Dart Sass: test.scss:3 Debug: divider offset: 132px 💡 Fun fact: You can pass any value to @debug, not just a string! It prints the same representation of that value as the meta.inspect() function. Current Releases: Dart Sass 1.85.1 LibSass 3.6.6 Ruby Sass ⚰ Implementation Guide'
