["https://satnac.org.za/registration-events-and-travel"]
title = "SATNAC | Registration - Events and Travel Information"
description = "SATNAC, The Southern Africa Telecommunication Networks and Applications Conference, is a two-day conference featuring a number of plenary sessions and presentations focusing on the theme: Accelerated Digitalisation - Current and Future Ways of Working. SATNAC hosts speakers and panelists representing local and international telecommunication, software, network and infrastructure providers."
full_description = "Learn more about travel options to and from the Kruger National Park, and find out more about the extra activities planned to ensure that SATNAC 2024 is an unforgettable experience. Kruger Park is located in a malaria area. The governing body of Kruger Park, South African National Parks (SANParks), states that “the risk of malaria in Kruger Park is usually low, even in the summer months”, however we recommend that you speak to your doctor if you have any concerns. There are various transport options to and from the Skukuza Rest Camp in Kruger National Park, where SATNAC 2024 is taking place. When you register online for SATNAC 2024, you'll also have the chance to sort out your travel details. The SATNAC 2024 organisers are here to help you book your flights to and from the conference, so please contact us directly if you need assistance. SATNAC 2024 has also arranged luxury coaches to conduct road transfers to/from the Skukuza Rest Camp. You can book a seat(s) for yourself, and accompanying persons on a coach. The road transfers will depart from Telkom Park, Centurion, and O.R. Tambo International Airport, Johannesburg. We hope you'll join us for a variety of great events and activities that take full advantage of The Kruger National Park. During the month of October, it starts to get warmer, with temperatures ranging between 18°C/64°F in the morning and 31°C/88°F in the afternoon. Look forward to a great day of fresh air and golfing at the Skukuza Golf Club on Sunday, 6 October 2024, at no additional cost! During your online registration, you'll be able to tell us whether you'll be joining in on the fun or not. We hope to see you there! During the conference, you will have the option to participate in a safari experience by attending a game drive in an open safari vehicle. There are several game drives to choose from throughout the duration of the conference. You will be able to choose one of the options based on your availability and/or preference during your online registration."
