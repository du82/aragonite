["https://satnac.org.za/call-for-papers"]
title = "SATNAC | Call For Papers"
description = "SATNAC, The Southern Africa Telecommunication Networks and Applications Conference, is a two-day conference featuring a number of plenary sessions and presentations focusing on the theme: Accelerated Digitalisation - Current and Future Ways of Working. SATNAC hosts speakers and panelists representing local and international telecommunication, software, network and infrastructure providers."
full_description = "The SATNAC 2024 TPC requires that the documentation is submitted in Acrobat (pdf) version 9 compatible with no password or protection enabled. Ensure your paper or presentation adheres to IEEE conference standards by utilising the provided templates available on their website, which encompass the document structure, styles, and layout. The SATNAC 2024 TPC will acknowledge receipt of documentation within 5 working days of receiving the documentation. If no acknowledgement is received in this period, please contact the TPC Chair. Each paper will be reviewed by at least three reviewers. All papers will undergo a double-blind review process; therefore, submissions should have all identifying information removed. However, the paper format must remain consistent with the required guidelines. Full papers must adhere to 10 Page limit as indicated in template; WIP will be 3 pages. If a submission is co-authored, the primary recipient of the correspondence should be clearly indicated. An oral presentation of 15 minutes and 5 minutes of questions will be allowed to successful students at the conference. All documentation received will be checked for viruses. However, it is the responsibility of the author to ensure that documents are free of viruses. Any document that is infected with a virus and cannot be recovered will be returned to the author, with a request that a clean copy be resubmitted. Papers must be uploaded onto the online database, and access will be through the SATNAC website before the relative submission closing dates. All emails to the TPC Chair must contain the word “SATNAC” in the subject header. Please note that regarding submissions, the topics provided for each paper category are not limited to the examples given below."
year_published = 2025
