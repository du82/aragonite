title = "SATNAC | Registration - Booking and Accommodation"
description = "SATNAC, The Southern Africa Telecommunication Networks and Applications Conference, is a two-day conference featuring a number of plenary sessions and presentations focusing on the theme: Accelerated Digitalisation - Current and Future Ways of Working. SATNAC hosts speakers and panelists representing local and international telecommunication, software, network and infrastructure providers."
full_description = "Begin your SATNAC 2024 journey by registering for one of our specially curated conference packages that combine conference registration, social functions, catering, accommodation and a safari experience in one seamless package. It is recommended that the registration information is read along with the accommodation information. Once you have decided which conference package suits your needs, please access the registration page by clicking on the registration button below to proceed with the registration process. Select from one of our great conference packages. All packages include conference registration, social functions, catering, accommodation and a safari experience in one seamless package. Accommodation can be reserved for 3-nights or 4-night. For convenience, payments can be made online via debit or credit card, or you can request a tailored tax invoice by emailing us at satnac@africamassive.co.za after registering. Once you've registered, look out for a confirmation email that will officially welcome you to the adventure. Note: If you are bringing an accompanying person (not a conference delegate), and would like to share a room with them, you will be able to provide your accompanying person's details, and adjust your accommodation booking accordingly, during your online registration. An additional cost is payable. Immerse yourself in the untamed beauty of the African wilderness while enjoying luxurious comforts and unrivalled biodiversity. The Skukuza Safari Lodge is located within the renowned Skukuza Rest Camp in Kruger National Park, and within easy walking distance (approx. 200m) of the Nombolo Mdhluli Conference Centre where SATNAC 2024 will be hosted. The beauty of your luxury stay at Kruger Gate Hotel is your incredible access to the game-rich reaches of the southern Kruger Park. The Kruger Gate Hotel with its tree-top ambiance is ideally located on the bank of the Sabie River, less than a minute's drive from the Paul Kruger Gate. A daily shuttle service will be provided between the hotel and the Nombolo Mdhluli Conference Centre where SATNAC 2024 will be hosted, at no extra cost."
year_published = 2025
