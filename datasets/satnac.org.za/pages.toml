["https://satnac.org.za/past-challenge-2023"]
title = "SATNAC | Past Industry Challenge (2023)"
description = "SATNAC, The Southern Africa Telecommunication Networks and Applications Conference, is a two-day conference featuring a number of plenary sessions and presentations focusing on the theme: Accelerated Digitalisation - Current and Future Ways of Working. SATNAC hosts speakers and panelists representing local and international telecommunication, software, network and infrastructure providers."
full_description = "As SATNAC marked its 25th year, they elevated their commitment to foster collaboration between Academia and Industry by introducing the SATNAC Industry Solutions Challenge. In this challenge, postgraduate and undergraduate students were invited to participate in one of four industry-inspired challenges issued by SATNAC's top sponsors. Throughout the challenge, the teams researched, analysed and applied their technical skills to investigate practical solutions under the mentorship of an expert from each sponsoring industry partner. Huawei winners: Liu Hongzhen Director: Huawei SA, Bandile Malaza, Phephile Sigudla and Samkelo Msibi. Openserve winners: CEO of Openserve Althon Beukes, Frederick Steyn, Busisiwe Hlophe and Karabo Makau. Takudzwa Mzembegwa and Thandile Nododile, proudly display their certificates alongside Uri Zisser from Amdocs at the recognition ceremony. SATNAC/ Telkom Innovators: Ajibola Oladokun, ME of Telkom CSB Lebo Masalesa, Humphrey Otieno and SATNAC Chairman Dr Mmaki Janties. Huawei winners: Liu Hongzhen Director: Huawei SA, Bandile Malaza, Phephile Sigudla and Samkelo Msibi. Openserve winners: CEO of Openserve Althon Beukes, Frederick Steyn, Busisiwe Hlophe and Karabo Makau. Takudzwa Mzembegwa and Thandile Nododile, proudly display their certificates alongside Uri Zisser from Amdocs at the recognition ceremony. SATNAC/ Telkom Innovators: Ajibola Oladokun, ME of Telkom CSB Lebo Masalesa, Humphrey Otieno and SATNAC Chairman Dr Mmaki Janties. Topic: Deploying AI automated decision-making capabilities for delivering greener yet high preforming 5G networks Topic: Disruptive alternative energy solutions for telcos - combating the effects of loadshedding and ensuring cost efficiency"
