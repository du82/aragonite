["https://satnac.org.za/challenge"]
title = "SATNAC | Industry Challenge 2024"
description = "SATNAC, The Southern Africa Telecommunication Networks and Applications Conference, is a two-day conference featuring a number of plenary sessions and presentations focusing on the theme: Accelerated Digitalisation - Current and Future Ways of Working. SATNAC hosts speakers and panelists representing local and international telecommunication, software, network and infrastructure providers."
full_description = "The SATNAC 2024 Industry Solutions Challenge award ceremony will be held at Nombolo Mdhluli Conference Centre, Skukuza, Kruger National Park; as part of the SATNAC proceedings. The SATNAC Industry Solutions Challenge invites postgraduate and undergraduate students who are passionate about innovation to participate in the SATNAC 2024 Industry Solutions Challenge where they will get the opportunity to tackle industry-inspired challenges and propose innovative solutions. Participants stand a chance to win high value prizes, skills development opportunities, all expenses paid conference attendance in Kruger National Park, and a chance to compete for the SATNAC/Telkom Innovator Award Winners. This category aims at developing technologies that promote sustainability and efficient energy management. Participants can work on solutions related to renewable energy sources, advanced energy storage, smart grids, and sustainable practices in technology. The focus is on creating innovations that address environmental challenges and contribute to a more sustainable future. Openserve operates from several buildings that house network equipment for the national provisioning of communication services. The operation of these buildings (collective for all the network equipment housed within) consume large amounts of power and produces carbon emissions. Openserve is on a drive to optimise energy consumption and use alternate energy to sustain our environment as part of our green initiative. Openserve requires a simplified and automated way to quantify, classify & identify the building sites that present the best opportunity for energy savings. The output shall be a recommendation model that identifies critical metrics and attributable variables that influence energy consumption at equipment buildings. The model should classify a building and highlight what opportunities can be implemented for energy reduction. Participants will delve into AI technologies and their wide-ranging applications. This category encourages exploration of machine learning, natural language processing, computer vision, and other AI techniques to solve complex problems and create intelligent systems. Ethical considerations and responsible AI development are also key aspects, ensuring that AI solutions are both innovative and aligned with societal values."
year_published = 2025
