["https://satnac.org.za/about-satnac"]
title = "SATNAC | About"
description = "SATNAC, The Southern Africa Telecommunication Networks and Applications Conference, is a two-day conference featuring a number of plenary sessions and presentations focusing on the theme: Accelerated Digitalisation - Current and Future Ways of Working. SATNAC hosts speakers and panelists representing local and international telecommunication, software, network and infrastructure providers."
full_description = "The Southern Africa Telecommunication Networks and Applications Conference (SATNAC) is an annual event hosted under the auspices of Telkom and attracts in excess of 400 delegates. This prestigious event has become the continent's leading ICT conference where Industry, Academia and Operators publish on matters concerning progress achieved in applied research in the Information and Communications Technology (ICT) sector and where industry leaders share their views on latest trends and developments The SATNAC conference is a parallel development to the Telkom Centres of Excellence (CoE) programme and is a very important facet of this capacity building programme. It provides researchers a platform to test their work with peer groups by receiving input from fellow students at other CoE's, industry and international experts attending the conference. SATNAC is one of a few conferences recognised by Higher Education where researchers can claim subsidies for publishing the outcome of their research. Some institutions require students to publish peer reviewed papers before they can obtain their postgraduate degree. SATNAC therefore also affords students this opportunity as it follows a review process based on the international de facto standard for paper reviews. The CoE programme objective is to create the opportunity for young graduates to do research in a world-class environment so that the much needed skills can be developed to grow the ICT knowledge in order for South Africa as a developing nation to become internationally competitive. Towards the late 1990s Telkom Group recognised that there was a shortage of highly skilled engineers, computer scientists and related professionals in South Africa and as a result embarked on establishing a postgraduate research programme which focused on developing high level skills for the Information Communications and Technology (ICT) sector. The Telkom Centre of Excellence (CoE) programme was launched in February 1997, and there are currently 15 CoE’s, making it the largest coordinated research effort in ICT in South Africa."
year_published = 2025
