["https://savannah.nongnu.org/maintenance/WhyChooseSavannah"]
title = "WhyChooseSavannah"
full_description = '''Why choose Savannah Savannah has high project approval requirements and thus visitors can expect freedom-related qualities from projects hosted here (such as no proprietary dependencies). Moreover, there are no advertisements, thus you do not run the risk of getting an ad for a proprietary competitor on your project page. By choosing Savannah, you show that you value your freedom, as all of Savannah is running exclusively with free software. Check SourceForge Drifting by Savannah founder Loic Dachary, or GCode's Mercurial support based on a private, unpublished fork of the Mercurial server. Technically, Savannah provides: A choice of version control systems for your source code (alphabetical order): GNU Arch GNU Bazaar CVS Git Mercurial Subversion An integrated bug tracking system for bugs, support requests, tasks and patches. Mailing lists at lists.gnu.org and lists.nongnu.org, managed via Mailman. Webpages at www.gnu.org or www.nongnu.org, managed through CVS. A download area and its mirrors. Videos Savannah was presented at the following events: GNU Hackers Meeting 2009 Gothenburg FOSDEM 2010 Brussels (alternate) (talk) LSM/RMLL 2010 Bordeaux (videos in progress) (talk1, talk2) Links Other sites that use Savane and offer free software hosting: Puszcza: https://puszcza.gnu.org.ua/ - also philosophically compatible, also run by other people (primarily Sergey Poznyakoff); located in Ukraine (and pronounced "push-cha") Software projects for hosting projects, with their source code: Savane: https://savannah.nongnu.org/p/administration what we use! (PHP, Perl, AGPLv3+) Trac: http://trac.edgewall.org/ - integrated SVN/wiki/tracker for a single project; variants for other VCS exists as non-official plugins Redmine: http://www.redmine.org/ - multi-projects, integrated tracker/wiki/browser/gantt (Ruby [on Rails], GPLv2+) LibreSource: http://dev.libresource.org/ (Java/J2EE, SQL/GPLv2?) FusionForge: http://fusionforge.org/ - forked from the same original code base as Savane, a long time ago in 2001 (PHP, GPLv2+) With hosting: Tuxfamily: http://tuxfamily.org/ - Savannah-like free software hosting facility - code http://repo.or.cz/ - first public Git hosting facility, runs a modified version of gitweb as the main interface + a minimum chroot'd environment + a few crons - code (Perl + shell) Alioth: http://alioth.debian.org/ - aimed at Debian projects - code Launchpad: https://launchpad.net/ - centered on Bazaar and Ubuntu (Python, AGPL3, but nonfree artwork) code Allura: https://allura.apache.org/ (Note that we do not list projects that advertise a proprietary version.)'''
year_published = 2023
year_updated = 2023
clearnet = "https://savannah.nongnu.org/maintenance/WhyChooseSavannah"
