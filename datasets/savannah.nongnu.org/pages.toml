["https://savannah.nongnu.org/news"]
title = "Savannah Administration - News [Savannah]"
description = """
Savannah is a central point for development, distribution
and maintenance of free software, both GNU and non-GNU."""
full_description = "Savannah web interface has migrated from frontend1 (running Trisquel 10) to frontend2 (running Trisquel 11). Many thanks to Bob Proulx who upgraded frontend2 to Trisquel 11 back in 2022. Please report any problems. Recently, we discovered a vulnerability in our SFTP setup, and couldn't fix it otherwise than completely disabling SFTP. This affects uploading files to the download host, namely, the download area and audio-video.gnu.org. [...] A new commit-hook is available to install for git repositories that will send a single Datagram via UDP after each successful commit. This can be useful for continuous integration (CI) schemes and elsewise when a push driven model is prefered to (e.g) regularly repolling upstream when changes may or may not have occured. [...] The periodical reminders weren't active since 2016-11-30. Now they work again, powered by a rewritten script. To minimize the surprise, all previously existing reminder settings were reset; please re-enable them if needed. Coincidentally, the support for per-group reminders is dropped. It means that group administrators can't setup periodical mails to other people any more; the users who want them should configure them in their account preferences. Savannah web interface has migrated from frontend1 (running Trisquel 8) to frontend2 (running Trisquel 9); please report any problems. The server hosting svn, hg, and bzr services has been updated. This should resolve the OpenSSH obsolescence of SHA1. Please report any problems. The server hosting git services has been updated. This should resolve the OpenSSH obsolescence of SHA1 that has been seen by early adopters. The switch to the new server produced some unexpected problems found by users due to incomplete setup. Please report any problems you find so they can be fixed. The server hosting svn, hg, and bzr is still pending. Until then the mitigation for SHA1 previously posted will still be needed. This is getting attention and will be updated as well soonest. OpenSSH 8.8 was released on September 26, 2021 and deprecated all use of the SHA-1 hash algorithm. This affects users using git, svn, hg repositories using ssh-rsa keys and who have upgraded to ssh 8.8. (The cvs repositories are not affected.) For user workarounds please see this documentation page. [...]"
year_published = 2025
clearnet = "https://savannah.nongnu.org/news"
tags = ["...back", "access", "accounts", "activity", "added", "address", "admin", "administration", "against", "anonymous"]
