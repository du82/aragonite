full_description = "This project is dedicated to the administration of the savannah.gnu.org and savannah.nongnu.org development platform: we inform users, answer support requests, check project submissions for free compliance, fix the system (source control, upload, Apache, Savane, ...), and try to improve it. You can access currently used code of Savane with Registration Date: Fri 19 Dec 2003 07:38:28 PM UTC License: GNU Affero General Public License v3 or later Development Status: 5 - Production/Stable Savannah web interface has migrated from frontend1 (running Trisquel 10) to frontend2 (running Trisquel 11). Many thanks to Bob Proulx who upgraded frontend2 to Trisquel 11 back in 2022. Please report any problems. Recently, we discovered a vulnerability in our SFTP setup, and couldn't fix it otherwise than completely disabling SFTP. This affects uploading files to the download host, namely, the download area and audio-video.gnu.org. [...] A new commit-hook is available to install for git repositories that will send a single Datagram via UDP after each successful commit. This can be useful for continuous integration (CI) schemes and elsewise when a push driven model is prefered to (e.g) regularly repolling upstream when changes may or may not have occured. [...] The periodical reminders weren't active since 2016-11-30. Now they work again, powered by a rewritten script. To minimize the surprise, all previously existing reminder settings were reset; please re-enable them if needed. Coincidentally, the support for per-group reminders is dropped. It means that group administrators can't setup periodical mails to other people any more; the users who want them should configure them in their account preferences. Copyright © 2025 Free Software Foundation, Inc. Verbatim copying and distribution of this entire article is permitted in any medium, provided this notice is preserved. The Levitating, Meditating, Flute-playing Gnu logo is a GNU GPL'ed image provided by the Nevrax 