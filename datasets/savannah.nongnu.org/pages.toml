["https://savannah.nongnu.org/register/requirements.php"]
title = "Hosting requirements [Savannah]"
description = """
Savannah is a central point for development, distribution
and maintenance of free software, both GNU and non-GNU."""
full_description = "Please read these usage terms carefully. If you don't follow them, we will not accept your project; if we don't have enough information determine whether your project follows these terms, we will have to ask you for more details. Once your project is accepted, you are expected to continue following these terms. Our intent is to provide a permanent home for all versions of your project. We do reserve the right, however, to discontinue hosting a project. The space given to you on this server is given for the expressed purpose of advancing free software that can run in free operating systems, documenting such software, or creating free educational textbooks. Using it to host or advertise nonfree software is considered harmful to free software. For more information, please read the Philosophy of the GNU Project. In order to preserve history and complete transparency, we will not remove projects with substantive content. To be hosted on Savannah, your project must be free software, and it must be kept independent of any nonfree software. The package must not refer the user to any nonfree software; in other words, it must not say anything that in our judgment is likely to lead or steer users towards any nonfree software. In particular, it must not automatically download or install any nonfree software. For more info, see References to Non-Free Software and Documentation in the GNU Coding Standards. The program should deliver its full functionality and convenience on a completely free platform based on a free operating system, such as GNU/Linux, working entirely with other free software. Otherwise, it would be an inducement to install nonfree operating systems or other nonfree software. It is ok for the program to run on nonfree platforms or nonfree operating systems, and to work with well-known nonfree applications, in addition to working with free software, provided it gives the free software at least as good support as it gives to nonfree counterparts. In other words, at no time, in no way, should your program put free software users at a disadvantage compared to those willing to use proprietary software."
year_published = 2025
clearnet = "https://savannah.nongnu.org/register/requirements.php"
