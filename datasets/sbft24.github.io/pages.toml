["https://sbft24.github.io"]
title = "SBFT'24 Homepage"
full_description = "Optimization techniques can be applied to many aspects of the software development process: research areas known as Search-Based Software Engineering (SBSE). In our previous workshop editions, we focused on the application of SBSE to perform testing tasks, the so called Search-Based Software Testing (SBST). Ongoing research on SBST and Fuzz Testing are proposing techniques to address similar testing problems and with similar goals. This has led to the decision to rename the workshop to Search-Based and Fuzz Testing (SBFT). SBFT strategies have been applied to a wide variety of testing goals including achieving high coverage, finding faults and vulnerabilities, and checking various state-based and non-functional properties (e.g., scalability, acceptance). The central objective of this workshop is to bring together researchers and industrial practitioners from SBST, Fuzzing, and the wider Software Engineering community to share experience and provide directions for future research on the automation of software testing. The second objective of this workshop is to encourage the use of search and fuzzing techniques to combine testing with other software engineering areas. SBFT is a two-day workshop that comprises a research track, keynotes, and popular testing tool competitions. Additionally, the workshop brings together experts for a panel discussion. All those activities will contribute to break new ground in SBFT research. SBFT 2024 is co-located with ICSE 2024. However, SBFT will be held in a hybrid setting. In order to attend SBFT, you have to register for our workshop using the official ICSE registration link. Once you registered for SBFT, the ICSE team will send you an e-mail with the invitation to attend the conference online or in person, according to your preference. Similar to last year, we will also live-stream SBFT 2024 via Twitch. Feel free to join our stream and ask questions in the chat if you are not registered. NOTE: The link has been changed! In all cases, papers should address a problem in the software testing/verification/validation domain or combine elements of those domains with other concerns in the software engineering lifecycle. Examples of problems in the software testing/verification/validation domain include (but are not limited to) generating testing data, fuzzing, prioritizing test cases, constructing test oracles, minimizing test suites, verifying software models, testing service-orientated architectures, constructing test suites for interaction testing, SBFT for AI applications, machine learning techniques for SBFT, and validating realtime properties."
year_published = 2025
