["https://sbft24.github.io/tools"]
title = "SBFT'24 Tool Competition"
full_description = "This year as well we are pleased to announce the twelfth edition of the testing tool competition. The competition has the goal to experiment with testing tools for a diversified set of traditional and emerging systems and domains. As for recent years, we invite researchers to participate in the competition with their unit test generation tool for Java. Tools will be evaluated against a benchmark with respect to code coverage and mutation score. In addition to the traditional Java tool competition, we also organize a CPS testing competition on self-driving cars simulation environments. Specifically, in collaboration with the BeamNG research team, this competition focuses on the generation of scenarios using BeamNG self-driving cars simulator. More information on how to participate, follow this link. Continuing from previous year, we will hold a Fuzzing Tool competition. We will be using mutation analysis integrated into fuzzbench as a benchmarking tool for the fuzzers. The details on how to submit your fuzzer can be found here. We welcome researchers to engage in our competition by submitting their Python unit test generation tools. These tools will undergo assessment based on a benchmark that assesses code coverage and mutation score performance. We invite researchers to participate in the competition with their test generation tool for Unmanned Aerial Vehicles (UAVs). The UAV Testing Competition organized by the Search-Based and Fuzz Testing (SBFT) workshop is an initiative designed to inspire and encourage the Software Testing Community to direct their attention toward UAVs as a rapidly emerging and crucial domain. Tools will be evaluated against a benchmark with respect to relevant criteria, as done for other, previous competitions. Details on how to integrate your test generator in the benchmarking infrastructure can be found here. The infrastructure concerning the CPS tool competition can be found here: https://github.com/sbft-cps-tool-competition/cps-tool-competition."
