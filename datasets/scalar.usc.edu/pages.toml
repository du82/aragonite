title = "Alliance for Networking Visual Culture"
description = "Website of the Alliance for Networking Visual Culture, featuring information about the online publishing platform Scalar."
full_description = '''Home About Scalar Blog People Contact The Alliance for Networking Visual Culture Editorial workflow, version compare, editions, and more. Features for digital editors abound in Scalar 2.5. Learn more Sign in Updates Announcing Scalar 2.6 — and Lenses! September 7, 2021 We’re thrilled to announce the launch of Scalar 2.6, featuring Lenses — a whole new way to explore relationships between content in Scalar projects. Lenses allow you to dynamically search and visualize Scalar content in a wide variety of ways. For example, a lens can map all pages that are geo-tagged to within 100 miles of Tokyo, diagram all of the media items tagged “post-structuralism”, or draw a word cloud of the contents of every page the reader visited in the last week. Lenses can be embedded in a page using the Lens widget, and the content they return can be exported as CSV files. Any user can create new private lenses in any Scalar book, opening up new possibilities for research in Scalar publications. The impetus behind Lenses came from scholars Kate McDonald (UC Santa Barbara) and David Ambaras (North Carolina State University) as part of their Bodies and Structures project, which they describe as “a platform for researching and teaching spatial histories of Japan, its empire, and the larger worlds of which they were a part.” Seeing the potential for an expanded suite of visualization features to unlock new avenues of research, McDonald and Ambaras collaborated with Scalar team members Craig Dietrich and Erik Loyer to conceive the Lenses concept, which ultimately received funding in the form of a grant from the National Endowment for the Humanities. To see Lenses in action, check out this Twitter thread showing various examples in the USC Libraries project Mirrors and Mass: Wayne Thom’s Southern California. For more details about Lenses and how they work, visit the Scalar documentation. We can’t wait to see what you’ll do with Lenses! Comments Off on Announcing Scalar 2.6 — and Lenses! The Scalar Summer Institute is coming! May 28, 2021 Join the Scalar team for a USC Libraries Scalar Summer Institute this July 12-16, 2021. This free, five-day workshop is designed for librarians and others who wish to support the use of Scalar for born-digital scholarship and cutting-edge, collections-based digital pedagogy on their campus as well as those who wish to develop their own projects showcasing institutional collections. Get more info and apply here. Comments Off on The Scalar Summer Institute is coming! Scalar Webinars June 23, 2020 The Ahmanson Lab at USC Libraries is offering a series of free Scalar webinars this summer. Introduction to Scalar: July 7, 11am-1pm (PT) – CLOSED/FULL This webinar will cover basic features of the platform; a review of select Scalar projects and use cases; and a hands-on introduction to media, annotations, paths, and tags. Intermediate Scalar: August 4, 11am-1pm (PT) – CLOSED/FULL This webinar will delve into more advanced topics including the effective use of structure, metadata, widgets, and layouts. Comments Off on Scalar Webinars More updates Twitter Updates Tweets by @anvcscalar !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs"); More tweets Recent Posts Announcing Scalar 2.6 — and Lenses! The Scalar Summer Institute is coming! Scalar Webinars More posts The Alliance for Networking Visual Culture Home About Blog Scalar People Contact The Alliance for Networking Visual Culture was created with the generous support of the Andrew W. Mellon Foundation | Terms of Service'''
