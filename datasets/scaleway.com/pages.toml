title = "Betas | Scaleway"
description = "Stay up to date with the latest products and even become part of their creation by participating in different stages"
full_description = "Betas & PreviewsPublic BetaPublic Beta products are ready to be tested by all customers. Public Beta products may not include all of the final product’s features. Public Beta is the last stage of testing before a product is released in General Availability. These products are intended to be used in test environments unless specified otherwise. The Public Beta phase lasts six months on average.Environmental Footprint CalculatorNewScaleway is committed to helping you understand and reduce your carbon footprint with precision. With our environmental footprint calculator, you can now access precise estimates of your carbon emissions at the time of ordering and receive detailed monthly reports on the environmental impact of your Elastic Metal servers.Read the documentation.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Managed MongoDB®NewManaged MongoDB® is a fully managed document database combining MongoDB’s market leading technology and Scaleway’s sovereign and AI-driven Cloud, giving your teams time back to focus on app development without compromising on performance and reliability. Benefit from a 50% discount during the beta until March 31st, 2025.Learn more and get started.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Instance Scaling Groups APINewInstance Scaling Groups dynamically adjust their number of Instances based on defined scaling policies. Maintain optimal application performance and cost efficiency by scaling your Instance group up during peak traffic and scaling it down when demand decreases.Access documentation and try now.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Managed InferenceManaged Inference lets you deploy AI models (language, vision, embeddings...) and answer prompts from European end-consumers securely. You get dedicated endpoints on instances of your choice, and an enterprise-grade service: full isolation in virtual private cloud, access control management, built-in observability…Deploy a model .css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Dedicated IP for Transactional EmailNewAre you interested in a Dedicated IP/Pool offer for sending emails? We are looking for beta testers to refine this solution. If you are intrigued by the idea of using a dedicated IP address and want to contribute to its development, sign up here:.tf-v1-widget{width:100%;height:100%;min-height:inherit;position:relative}.tf-v1-widget iframe{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;min-height:inherit}.tf-v1-widget-close{display:none}.tf-v1-widget-iframe-overlay{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;position:absolute;top:0;left:0}.tf-v1-widget-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;width:100% !important;height:100% !important}.tf-v1-widget-fullscreen .tf-v1-widget-close{display:block;display:block;padding:0;margin:0;position:absolute;font-size:32px;font-weight:normal;line-height:24px;width:24px;height:24px;text-align:center;text-transform:none;cursor:pointer;opacity:.75;transition:opacity .25s ease-in-out;text-decoration:none;color:#000;top:6px;right:8px;background:none;border:none;border-radius:0;z-index:1}.tf-v1-widget-fullscreen .tf-v1-widget-close:hover{opacity:1}@media(min-width: 481px){.tf-v1-widget-fullscreen .tf-v1-widget-close{color:#fff !important}}.tf-v1-widget-fullscreen iframe{border-radius:0}Generative APIsNewYour drop-in replacement to the OpenAI APIs Generative APIs provide you instant access to pre-configured, serverless endpoints featuring the most popular AI models, all hosted in secure European data centers and priced per 1M tokens. No need to configure GPUs or deploy your own models. Access to this service is free while in beta. Specific beta terms and conditions apply. Get started with the documentation here. Read the data privacy policy Consume AI models.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Private BetaPrivate Beta products are early versions of future products or features. This phase allows users to test, validate a product in development, and give feedback to the Product team. Private Beta is limited to users selected by the Product Development team. Users can request access to the product via a form and the development team will grant access rights. The Private Beta stage usually lasts three to six months.Key Management ServiceNewEnhance your cloud infrastructure security with Key Management Service, a service for strong encryption of your critical data. Key Management Service provides you with a central place to create, manage and use your cryptographic keys safely. Partner with Scaleway as a co-creator by participating in the Beta testing phase of our product. Your insights are crucial to us. Your feedback will ensure the refinement of this product to its fullest potential!.tf-v1-widget{width:100%;height:100%;min-height:inherit;position:relative}.tf-v1-widget iframe{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;min-height:inherit}.tf-v1-widget-close{display:none}.tf-v1-widget-iframe-overlay{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;position:absolute;top:0;left:0}.tf-v1-widget-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;width:100% !important;height:100% !important}.tf-v1-widget-fullscreen .tf-v1-widget-close{display:block;display:block;padding:0;margin:0;position:absolute;font-size:32px;font-weight:normal;line-height:24px;widt