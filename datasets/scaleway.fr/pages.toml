["https://scaleway.fr/fr/a-propos"]
title = "À propos de Scaleway | Scaleway"
description = "Scaleway, the cloud of choice, aide les développeurs et les entreprises à créer, déployer et scaler des applications sur tout type d’infrastructure depuis 1999."
full_description = "À propos de ScalewayScaleway aide les développeurs et les entreprises à créer, déployer et scaler des applications sur tout type d’infrastructure depuis 1999. Situé à Paris, Amsterdam et Varsovie, l’écosystème Scaleway est utilisé par plus de 25 000 entreprises qui choisissent la redondance multi-AZ, l’expérience développeur optimisée sans friction, les datacenters alimentés uniquement par de l’énergie renouvelable et les outils natifs de Scaleway pour gérer leurs architectures multi-cloud. Avec ses offres entièrement managées pour les architectures serverless, la conteneurisation et le bare metal, Scaleway apporte le choix au cloud. Scaleway permet aux entreprises de choisir le lieu de stockage des données de leurs clients, l’architecture qui répond à leurs besoins, et d’évoluer de manière responsable.9 datacenters entièrement alimentés par des énergies renouvelables Plus de 550 talents160 paysIndex Egapro 91/100Scaleway est une entreprise citoyenne engagéeIl est de notre responsabilité d’être une force positive dans la société et de concevoir collectivement de nouveaux systèmes pour un avenir meilleur. Nous nous engageons à diriger notre infrastructure numérique mondiale de façon plus intelligente, plus responsable et plus durable afin de lutter contre le changement climatique ainsi que les disparités économiques qui l’accompagnent. Nous avons un rôle clé à jouer dans la restructuration de notre mode de consommation et de production d’énergie. Chez Scaleway, nous avons toujours défié le statu quo, et c’est pour cela que datacenters sont uniques au monde : ils utilisent 100 % d’énergie renouvelable. Le dernier datacenter DC5 utilise, quant à lui, un système de refroidissement adiabatique reposant sur l’évaporation d’eau (et non pas d’air conditionné). DC5 est donc radicalement plus efficace et beaucoup moins consommateur d’énergie des datacenters traditionnels.Notre histoire 2014 European Code of Conduct pour ses performances énergétiques grâce à la sobriété énergétique de son datacenter DC3.** (anciennement Online SAS). 2015 Online lance Scaleway, la 1re offre de Cloud Computing IaaS (Infrastructure as a Service) reposant sur des serveurs dédiés sans logiciel de virtualisation, à 2 centimes d’euros par heure. 2016 Très vite, Scaleway connait un succès aussi technologique que marché et devient la 1er plateforme proposant du cloud bare metal.. En parallèle, un nouveau datacenter voit le jour à Amsterdam. 2017 L’entreprise connait une belle croissance à l’international et rencontre un franc succès auprès de la nouvelle génération de développeurs. 2018 Pour accompagner sa croissance, un vaste plan de transformation et de R&D est lancé : Datacenters nouvelle génération, recrutement massif de talents, espaces de vie uniques. Tout converge pour amener Scaleway à devenir la marque principale de l’entreprise. 2019 Après des mois de R&D, de nouvelles briques de l’écosystème Cloud sont lancées : nouvelles instances GPU, Object Storage… Au même moment, Scaleway obtient la certification HDS lui permettant ainsi d’héberger des données de santé. Lors du second trimestre, l’entreprise réunit pour la première fois ses communautés lors du ScaleDay’n Night, un évènement IT accueillant pas moins de 1 200 participants (clients, fournisseurs, infogérants, presse, etc.). 2020 Poursuivant son expansion dans toute l’Union européenne, Scaleway y a ouvert une troisième région en Pologne. Arrivant sur le marché polonais avant les principaux acteurs dominants, Scaleway propose ses services à la fois aux utilisateurs locaux et aux entreprises internationales qui souhaitent déployer leurs infrastructures localement. L’entreprise a également lancé son offre de clusters Kubernetes managés, Kubernetes Kapsule. 2021 Scaleway a présenté son offre Apple silicon M1 as-a-Service, première innovation de ce calibre en Europe. L’entreprise poursuit son expansion internationale en renforçant ses offres en Espagne et en Allemagne. Scaleway a offert près de 3 M€ de crédits cloud aux agents IT de l’Etat français pour soutenir la stratégie « Cloud au centre » du gouvernement. L’entreprise a également lancé la première offre Serverless européenne avec Serverless Functions et Serverless Containers. 2022 Scaleway a lancé Elastic Metal, une gamme de serveurs dédiés cloud, alliant une performance dédiée à une tarification flexible. L’entreprise est devenue le premier fournisseur cloud européen à offrir de la résilience sur trois Zones de disponibilité (AZ) dans une même région, Paris. Poursuivant son expansion dans l’UE, Scaleway a ouvert deux nouveaux datacenters dans ses régions, Amsterdam et Varsovie. 2023 Scaleway a lancé le premier AI Supercalculateur en Europe, Nabuchodonosor.Notre entreprise est guidée par un ensemble de valeurs simplesLa transparenceLa transparence est une des valeurs clés de notre entreprise, notamment en ce qui concerne l’impact environnemental et l’empreinte carbone. Elle est essentielle pour établir une relation de confiance avec nos clients et nos communautés.La pleine conscienceInternet est le système nerveux central de l’économie moderne. La construction de l’avenir numérique de l’Europe repose sur le cloud pour fournir une puissance de calcul qui est flexible, fiable, sécurisée, durable et au juste prix. Il n’est donc pas surprenant que cela nécessite une énorme quantité d’énergie pour fabriquer, alimenter et prendre en charge nos équipements, nos datacenters et nos infrastructures.Centré sur les clientsPour nous, les infrastructures doivent être faciles d’utilisation, performantes et responsables. Nous nous engageons à résoudre les problèmes de nos clients en utilisant des technologies de pointe, des produits disruptifs et des infrastructures efficaces.DisruptifSelon nous, les infrastructures doivent être ultra simples, performantes et efficaces. Nous nous engageons à résoudre les problèmes concrets de nos clients grâce à des technologies de pointe et des produits innovants.Renforcer l'économie localeNous assemblons nos propres serveurs et exploitons 7 datacenters. Maîtrisant l’ensemble de la chaîne de valeur, nous sommes en mesure de fixer des objectifs ambitieux en termes d’efficacité, de performances et d’empreinte écologique."
