full_description = "Dedirack : Housing serveur Hébergez vos serveurs dans nos datacenters français sécurisésDedirack Espace: 1/4 de baie, 11U, 600×1000 Energie: 5 A redondé (1 100W) – Baie 2N Connectivité: 1 Gbit/sec (Port 1000 Base-T) Prix : 699,00 € HT /mois Frais d’installation : OffertsDedirack XL Espace: 1 baie, 47U, 600×1000 Energie:16 A redondé (3 300W) – Baie N+1 Connectivité: 1 Gbit/sec (Port 1000 Base-T) Prix : 1579,00 € HT /mois Frais d’installation : OffertsServices inclus dans l’offre housing serveur DedirackDatacenter certifié Tier-IIINe jamais faire de compromis ou d’option au détriment de la pérennité de vos infrastructures. Pour cette raison, vous bénéficiez en standard de notre certification Tier-III décernée par l’Uptime Institute.Protection DDOSNos serveurs et nos infrastructures sont protégés par défaut contre les attaques par déni de service (DDOS).Réseau premiumNous opérons un réseau simple, ultra rapide et fiable, entièrement maillé à 100Gbit/sec. Notre réseau AS12876 s’appuie sur les équipements les plus perfectionnés du marché et dispose de plus de 6TB/sec de capacité vers de multiples opérateurs et points d’échange. Nos serveurs sont compatibles IPv6.RPNLe RPN est une fonctionnalité de réseau privé, dédiée et physiquement séparée de votre interface réseau Internet. Il permet également de relier votre infrastructure aux serveurs Dedibox à travers le réseau privé.Geste de proximitéUne heure par mois de “gestes de proximité” incluse.Gestion des livraisonsNotre équipe gère vos livraisons et leurs stockages pendant 7 jours.Assistance 24h/24 7j/7Temps de réponse garantis pour les services critiques via tickets avec notre support 24/7, en français et anglais.En savoir plus sur l'offre Dedidrack.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Spécificités techniques de l’offre DedirackÉlectricité et alimentation énergétiquePour vos infrastructures critiques, Scaleway garantit une alimentation électrique ultra-fiable avec des systèmes redondants (N+1, 2N) et des générateurs autonomes capables de prendre le relais instantanément. Vous bénéficiez ainsi d'une continuité de service ininterrompue, même dans les situations les plus imprévues, tout en optimisant la consommation énergétique pour maîtriser vos coûts.Baies et racksNos baies sont conçues pour s’adapter à vos besoins spécifiques, que vous utilisiez des configurations standards ou non standards. Avec des racks haute densité et des options de refroidissement avancées, vous optimisez l’utilisation de l’espace et des ressources, tout en ayant un accès sécurisé et ergonomique à vos équipements à tout moment.Consommation énergétique et refroidissementScaleway s'engage à offrir des solutions de refroidissement de pointe, telles que le free cooling et le refroidissement liquide, pour maintenir vos serveurs à des températures optimales. Avec un PUE compétitif, nos datacenters garantissent des performances maximales tout en réduisant l’impact énergétique de vos infrastructures.Connectivité et réseauAssurez des performances réseau optimales avec une connectivité multi-opérateurs, une faible latence et des options de bande passante haute performance (jusqu’à 10 Gbps et plus). Nos solutions offrent également une redondance réseau complète et des possibilités d’interconnexion directe via peering ou cross-connect pour une flexibilité totale.Tarification et transparence des coûtsMaîtrisez vos coûts avec une tarification claire et évolutive, adaptée à vos besoins réels. Suivez en temps réel la consommation énergétique de vos équipements pour un contrôle précis de vos dépenses, sans frais cachés ni surprises."
