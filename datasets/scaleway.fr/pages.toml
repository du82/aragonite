full_description = "Anticipating Cyberthreats: The Winning Duo of WAF and CachingIn 2024, Europe saw an explosion in cyberattacks...Lire l'article (en anglais).css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;} Edge ServicesUne solution complète (cache, certificat SSL, domaines personnalisés et plus encore...) pour exposer vos services HTTP à l'internet avec sécurité, fiabilité et efficacité.Créer un compte professionnel.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Créer un compte personnel.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Bénéfices d'Edge ServicesAméliorer l'accès aux donnéesRéduire le temps de latence pour fournir des données fréquemment consultées en les diffusant à partir de la périphérie du réseau.Personnaliser et sécuriserApportez votre propre certificat et/ou domaine pour sécuriser votre service web et améliorer l'expérience de vos clients.Facile d'utilisationRationalisez vos efforts grâce à l'intégration à notre Console et exposez en un clic vos services web via Internet.Essayez-le maintenant avec Object Storage.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Commencer avec Edge Services.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Spécificités techniquescheckCacheMettez en cache vos objets à partir d'Object Storage ou le trafic provenant du Load Balancer.checkCertificat SSLLet's Encrypt Apportez votre propre certificatcheckDomaine personnaliséApportez votre propre domainecheckWAF (bientôt)Ensemble de règles préconfigurées contre les 10 principales menaces de l'OWASP.checkAccessibilitéPar le biais de l'API, de la CLI et de la ConsoleVous recherchez un pare-feu d'application Web (WAF) managé ?Inscrivez-vous sur la liste d'attente.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Cas d'utilisation courantsPlateforme de streaming.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Utilisez Edge Services pour mettre en cache le contenu au plus près des utilisateurs, afin de réduire la latence et d'améliorer les temps de chargement pendant les heures de pointe. Cela garantit une expérience de visualisation transparente avec une mise en mémoire tampon minimale.Bucket website.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Activez les domaines personnalisés et les certificats SSL pour les sites web hébergés dans Object Storage. Cela permet aux utilisateurs d'accéder à leurs sites web hébergés dans un bucket, en toute sécurité via HTTPS, en garantissant l'intégrité des données et en renforçant la confiance grâce à des URL personnalisées.Application web (bientôt).css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Protégez votre application web en filtrant le trafic malveillant et en protégeant les données des clients. Bloquez les injections SQL et les attaques de type cross-site scripting (XSS), et assurez la sécurité des transactions et la protection des informations des utilisateurs.Pourquoi choisir ScalewayAssistance 24/7Bénéficiez d'une tranquillité d'esprit grâce à notre service d'assistance 24 heures sur 24 et 7 jours sur 7. Nous veillons à ce que votre infrastructure soit toujours opérationnelle.Expérience enrichieNous offrons une nouvelle expérience avec un accès API, des distributions Linux, une Console intuitive et Terraform. Nos clients sont au centre de notre activité.Souveraineté européenneConservez les données de vos clients en Europe dans nos régions de Paris, Amsterdam et Varsovie. Nous garantissons une véritable souveraineté, de l'infrastructure au logiciel.Sécurité et conformitéLes exigences de sécurité concernant la protection des données, des services cloud et des datacenters sont essentielles. C'est pourquoi nous ne faisons jamais de compromis sur la sécurité.Créer un compte professionnel.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Blogs et contenusAnticipating Cyberthreats: The Winning Duo of WAF and CachingIn 2024, Europe saw an explosion in cyberattacks...Lire l'article (en anglais).css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Foire aux questionsQu'est-ce que Edge Services ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Edge Services est une fonctionnalité pour les Load Balancers Scaleway et les buckets d'Object Storage. Elle fournit un service de mise en cache pour améliorer les performances en réduisant la charge sur votre origine, et un endpoint personnalisable et sécurisé pour accéder au contenu via Edge Services, qui peut être défini sur un sous-domaine de votre choix.Quels sont les produits compatibles avec Edge Services ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Edge Services est actuellement disponible pour Scaleway Object Storage et pour Scaleway Load Balancer.Quel est le coût de Edge Services ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}La tarification d'Edge Services est disponible sur la page dédiée.Si je personnalise un endpoint Edge Services avec mon propre domaine, peut-il diffuser du contenu sur HTTPS ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Oui, si vous choisissez de personnaliser votre endpoint Edge Services avec votre propre sous-domaine, vous êtes invité à générer ou à télécharger un certificat SSL/TLS pour ce sous-domaine afin que Edge Services puisse servir du contenu via HTTPS. Ce certificat peut être un certificat Let's Encrypt généré et géré par Scaleway, ou vous pouvez importer votre propre certificat. Si vous importez votre propre certificat, il sera stocké dans Scaleway Secret Manager et facturé en conséquence."
