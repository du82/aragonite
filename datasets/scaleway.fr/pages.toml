rchitecture révolutionnaire de système sur puce (SoC), qui combine le CPU, le GPU, la mémoire unifiée et le moteur neuronal sur une seule puce économe en énergie.CI-CD rapide, n'importe où, n'importe quandDisponible où et quand vous le souhaitez. Profitez d'un CI-CD rapide pour iOS et macOS grâce à un excellent temps de latence depuis l'Europe.Datacenter à la pointe de la technologieVotre Mac mini se trouve dans l'un de nos datacenter de pointe, en France.Bureau distantAccédez pleinement à votre environnement Mac mini grâce à VNC, le protocole de partage de bureau à distance, qui vous permet de visualiser l'interface d'un bureau macOS.Sécurité et confidentialitéMacOS offre à Mac mini des fonctions de confidentialité et de sécurité à la pointe de l'industrie, sans équivalent dans sa catégorie, y compris des protections intégrées contre les logiciels malveillants et les virus. Secure Enclave de nouvelle génération permet de protéger votre système et vos données.Écosystème cloud de ScalewayIntégré au kit de développement logiciel de Scaleway. Profitez de l'ensemble de l'écosystème cloud de Scaleway.Une vidéo vaut mieux que mille motsCréer un Mac miniAccéder au bureau distantCommencez avec des tutorielsComment créer un Mac mini M1?Lire l'article.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Utiliser Mac mini avec Jump desktopLire l'article.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Installation d'un runner Github Actions sur un Mac miniLire l'article.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Tutorials.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:curr