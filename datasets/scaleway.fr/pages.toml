title = "Cookie Policy | Scaleway"
description = "Cette page explique les cookies utilisés lorsque vous visitez le site Web suivant"
full_description = '''Politique d’utilisation des cookiesSur cette page, vous trouverez plus d’informations sur les cookies utilisés quand vous visitez nos différents sites webs regroupés sous « le Site Web » : scaleway.com. Qu’est-ce qu’un cookie ? Un cookie est un petit fichier texte contenant une suite de caractères qui sont transmises par votre navigateur et stockées sur votre terminal (ordinateur, smartphone, tablette, etc.). Les cookies seuls ne permettent pas de vous identifier. En revanche, ils permettent d’enregistrer les informations liées à votre navigation sur le Site web, notamment vos préférences. Ces informations sont ensuite lues directement par nos serveurs quand vous visitez à nouveau le Site Web ou envoyez des requêtes. Comment Scaleway utilise les cookies ? La plupart des cookies stockés ou lus lorsque vous visitez notre Site Web sont utilisés uniquement pour faciliter votre navigation et vous donner accès à certains services. Le refus de ces cookies pourrait dégrader votre expérience de navigation et certains services pourraient être inaccessibles. Nous déclinons toute responsabilité à cet égard. Des cookies peuvent également être installés s’ils sont nécessaires à la fourniture de services que vous avez demandés. Ils peuvent être utilisés, par exemple, pour mémoriser vos choix en termes de personnalisation de l’interface ou pour garder votre session ouverte pendant que vous naviguez sur le site, entre le moment où vous vous connectez et celui où vous vous déconnectez. Certains cookies sont utilisés à des fins statistiques et d’analyse web, et servent à améliorer nos services et le contenu du Site Web. Ces cookies sont anonymes. Des tiers peuvent également installer et utiliser des cookies sur notre Site Web. Ces derniers sont régies par les politiques d’utilisation des cookies définies par ces tiers et nous vous recommandons de les lire. Nous n’avons aucun contrôle sur les cookies installés par des tiers. Comment puis-je gérer les cookies sur mon appareil ? Les cookies ne peuvent être installés sur votre appareil qu'avec votre consentement, sauf s'ils sont nécessaires à la fourniture d'un service que vous avez demandé ou s'ils sont destinés à permettre ou à faciliter les communications électroniques. Votre consentement préalable n'est pas requis pour les cookies anonymes utilisés uniquement pour obtenir des statistiques et pour les analyses web. Toutefois, il est possible de désactiver l'installation de ces types de cookies sur votre appareil si vous le souhaitez. Lorsque vous visitez notre site Internet, une bannière de cookies vous informe que nous utilisons des cookies et vous invite à activer ou désactiver leur installation sur votre appareil. Les cookies ne seront installés que si vous les acceptez ou si vous poursuivez la navigation sur notre site Internet en visitant une autre page du site ou en cliquant sur un lien du site. Votre consentement est valable pendant 13 mois et correspond à la durée maximale de conservation des cookies. Au bout de 13 mois, il vous sera demandé de consentir à nouveau aux cookies. Vous pouvez également gérer vos préférences concernant les cookies à tout moment, pour les activer ou les désactiver, en suivant les instructions indiquées ci-dessous. Vous pouvez gérer l'installation de cookies sur votre appareil en configurant les paramètres de votre navigateur. Toutefois, si vous décidez de ne pas autoriser certains cookies, cela peut bloquer votre accès à certains services proposés sur notre site. Vous pouvez désactiver l'installation de cookies sur votre terminal via les paramètres de votre navigateur en suivant les étapes ci-dessous : Firefox Cliquez sur le bouton Firefox, puis sélectionnez Options. Sélectionnez le panneau Vie privé. Paramétrez Règles de conservation : à utiliser les paramètres personnalisés pour l'historique. Décochez Accepter les cookies. Google Chrome En haut à droite de votre navigateur, cliquez sur les trois points verticaux, puis sur Paramètres. Cliquez sur Confidentialité et sécurité puis Cookies et autres données des sites. Désactiver les cookies : cochez Bloquer les cookies tiers (en mode navigation privée). Microsoft Internet Explorer Dans Internet Explorer, sélectionnez le bouton Outils, puis les options Internet. Sélectionnez l’onglet Confidentialité et, sous Paramètres, sélectionnez Avancé. Choisissez si vous souhaitez autoriser, bloquer ou être invité à déterminer la configuration voulue pour les cookies internes et les cookies tiers. Safari Sélectionnez Préfèrences puis Confidentialité Pour définir les réglages liés au blocage des cookies sur Safari, touchez Réglages > Safari, puis activez l’option Bloquer tous les cookies. Opera Sélectionnez « Supprimer les données confidentielles », allez à la section « Avancé ». Sélectionnez l’option que vous souhaitez concernant les cookies. iOS Sélectionner Réglages puis Safari Activez l’option Bloquer tous les cookies. Android En haut à droite, appuyez sur Plus. Paramètres. Appuyez sur Paramètres du site. Cookies. Désactivez l'option Cookies. Windows Phone Sélectionnez Paramètres puis Avancé. Sélectionnez Cookies dans le menu déroulant puis Bloquez tout. Vous pouvez régulièrement effacer les cookies installés sur votre appareil. Pour toute question concernant notre politique en matière de cookies, veuillez adresser votre demande à privacy@scaleway.com. SCALEWAY, Société anonyme par Actions Simplifiée au capital de 214 410,50 Euros, dont le siège social est situé au 8 rue de la ville l’Evêque – 75008 Paris, FRANCE, immatriculée au Registre du Commerce et des Sociétés de Paris sous le numéro RCS PARIS B 433 115 904, numéro de TVA FR 35433115904, joignable sur son site Internet https://www.scaleway.com/Scaleway respecte votre vie privéeCookies essentiels (ne peuvent être désactivés)Toujours actifsCes cookies sont nécessaires au bon fonctionnement du Site web et vous permettent d’accéder à ses services et fonctionnalités. Sans ces cookies, nous ne serions pas en mesure de fournir certains services ou fonctionnalités.Applicable cookies: .css-je8g23{pointer-events:none;}.css-16goplf{position:relative;display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-align-items:start;-webkit-box-align:start;-ms-flex-align:start;align-items:start;gap:0.5rem;}.css-16goplf .eqr7bqq4{cursor:pointer;}.css-16goplf[aria-disabled='true']{cursor:not-allowed;color:#484b5a;}.css-16goplf[aria-disabled='true'] .eqr7bqq4{cursor:not-allowed;}.css-16goplf[aria-disabled='true'] .eqr7bqq5{fill:#252a3b;}.css-16goplf[aria-disabled='true'] .eqr7bqq5 .eqr7bqq7{stroke:#252a3b;fill:#1e2335;}.css-16goplf[aria-disabled='true'] .eqr7bqq2[aria-invalid="true"]:checked+.eqr7bqq5{fill:#790d34;}.css-16goplf[aria-disabled='true'] .eqr7bqq2[aria-invalid="true"]:checked+.eqr7bqq5 .eqr7bqq7{stroke:#790d34;fill:#790d34;}.css-16goplf[aria-disabled='true'] .eqr7bqq2[aria-invalid="true"]+.eqr7bqq5{fill:#4e0921;}.css-16goplf[aria-disabled='true'] .eqr7bqq2[aria-invalid="true"]+.eqr7bqq5 .eqr7bqq7{stroke:#790d34;fill:#4e0921;}.css-16goplf[aria-disabled='true'] .eqr7bqq2:checked+.eqr7bqq5{fill:#3d206f;}.css-16goplf[aria-disabled='true'] .eqr7bqq2:checked+.eqr7bqq5 .eqr7bqq7{stroke:#4f1c89;fill:#4f1c89;}.css-16goplf[aria-disabled='true'] .eqr7bqq2[aria-checked="mixed"]+.eqr7bqq5{fill:#3d206f;}.css-16goplf[aria-disabled='true'] .eqr7bqq2[aria-checked="mixed"]+.eqr7bqq5 .eqr7bqq7{stroke:#3d206f;fill:#3d206f;}.css-16goplf .eqr7bqq2:checked+.eqr7bqq5 path{transform-origin:center;-webkit-transition:200ms -webkit-transform ease-in-out;transition:200ms transform ease-in-out;-webkit-transform:scale(1);-moz-transform:scale(1);-ms-transform:scale(1);transform:scale(1);-webkit-transform:translate(2px, 2px);-moz-transform:translate(2px, 2px);-ms-transform:translate(2px, 2px);transform:translate(2px, 2px);}.css-16goplf .eqr7bqq2:checked+.eqr7bqq5 .eqr7bqq7{fill:#8d40ee;stroke:#8d40ee;}.css-16goplf .eqr7bqq2[aria-invalid="true"]:checked+.eqr7b