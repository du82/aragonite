dden;border-radius:8px;min-height:inherit}.tf-v1-widget-close{display:none}.tf-v1-widget-iframe-overlay{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;position:absolute;top:0;left:0}.tf-v1-widget-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;width:100% !important;height:100% !important}.tf-v1-widget-fullscreen .tf-v1-widget-close{display:block;display:block;padding:0;margin:0;position:absolute;font-size:32px;font-weight:normal;line-height:24px;width:24px;height:24px;text-align:center;text-transform:none;cursor:pointer;opacity:.75;transition:opacity .25s ease-in-out;text-decoration:none;color:#000;top:6px;right:8px;background:none;border:none;border-radius:0;z-index:1}.tf-v1-widget-fullscreen .tf-v1-widget-close:hover{opacity:1}@media(min-width: 481px){.tf-v1-widget-fullscreen .tf-v1-widget-close{color:#fff !important}}.tf-v1-widget-fullscreen iframe{border-radius:0}Accès anticipéSavings PlanOptimisez vos coûts cloud avec le Compute Savings Plan de Scaleway. En vous engageant à un niveau d'utilisation de ressources constant sur une, deux ou trois années, vous pouvez bénéficier de réductions par rapport à la tarification à l'usage. Ce plan est conçu pour offrir flexibilité et rentabilité à long terme, afin que vous tiriez le meilleur parti de votre investissement cloud. Rejoignez notre bêta privée pour profiter de ces économies en avant-première et nous aider à affiner l'expérience. Nous apprécions vos retours et sommes là pour vous accompagner à chaque étape. Inscrivez-vous dès maintenant et faites le premier pas vers une gestion plus intelligente de vos dépenses cloud !.tf-v1-widget{width:100%;height:100%;min-height:inherit;position:relative}.tf-v1-widget iframe{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;min-height:inherit}.tf-v1-widget-close{display:none}.tf-v1-widget-iframe-overlay{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;position:absolute;top:0;left:0}.tf-v1-widget