title = "CLI | Scaleway"
description = "Pilotage de votre infrastructure depuis votre terminal."
full_description = "Pilotez votre infrastructureScaleway CLI est un outil qui vous aide à piloter votre infrastructure Scaleway directement depuis votre terminal. Nous fournissons des binaires compilés pour les plates-formes darwin (macOS), GNU/Linux et Windows. Les actions sont organisées autour d’un ensemble de verbes tels que list, get, create, update qui peuvent être utilisés avec une grande variété de produits. Authentification sécuriséeAprès avoir installé la dernière version de la CLI, vous pouvez exécuter la commande d’initialisation, scw init. Cette commande va configurer votre profil et l’authentification. Par défaut, vos informations d’identification seront stockées dans HOME/.config/scw/config.yaml sur les systèmes UNIX et dans votre USERPROFILE sous Windows. Auto-complétionPour faciliter l’utilisation de l’interface en ligne de commande Scaleway, vous pouvez utiliser la fonction d’auto-complétion. Nous avons une syntaxe commune pour tous nos produits : espace de noms, ressource et verbe. À titre d’exemple avec la commande suivante : scw instance server list instance : fait référence à l’espace de noms du produit server : fait référence à une ressource gérée dans l’espace de noms du produit list : fait référence à un verbe appliqué à l’API sélectionnée"
