full_description = "Elastic metal : Serveur Dédié CloudAllier la performance du Bare Metal à l'élasticité du cloud. Nos nouveaux serveurs Elastic Metal se caractérisent par une performance dédiée, une tarification souple et une intégration native dans notre écosystème cloud complet.Découvrez tous nos serveurs.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Nos offres de serveurs dédiés cloudGamme AluminiumA partir de 0,122 € HT/heure ou 43,99 € HT/moisDes serveurs Elastic Metal entièrement dédiés, dotés d'une intégration cloud-native, au meilleur prix.Page du produit.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Gamme BerylliumA partir de 0,263 € HT/heure ou 94,99 € HT/moisDes serveurs puissants, équilibrés et fiables, parfaits pour les applications de production.Page du produit.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Gamme IridiumA partir de 0,667 € HT/heure ou 239,99 € HT/moisServeur dédié puissant conçu pour gérer les applications à forte charge de travail.Page du produit.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Gamme LithiumA partir de 0,122 € HT/heure ou 43,99 € HT/moisConçue pour offrir un volume de stockage local considérable afin de conserver, sauvegarder et protéger vos données.Page du produit.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Gamme TitaniumÀ partir de 4,11€ HT/heure ou 1499,99€ HT/heurePuissance et stabilité des GPU dédiés avec une intégration transparente dans l'écosystème public cloud Scaleway.Page du produit.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}L'extension Private Networks - Elastic Metal vous permet de communiquer au sein d'un réseau isolé et sécurisé entre les serveurs Elastic Metal et Cloud. Consulter la documentation de l'API.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Tarification flexibleUne tarification horaire ou mensuelle, au choixÀ partir de 0,122€ par heure ou 43,99 € par mois.Recevez votre serveur en quelques minutesÀ peine payé, déjà lancé.FlexibleArrêtez à tout moment, sans préavis.Nous vous remercions pour votre fidélitéNous vous remboursons vos frais d'engagement mensuels à partir de 12 mois de fidélité.Choisissez votre prochain serveur dédiéIntégration native dans notre écosystème cloud completCompatibilité avec l'écosystème cloudLes serveurs physiques Elastic Metal font partie intégrante de notre écosystème:, qui comprend des produits comme : Instances, Object Storage, Load Balancers, Managed Database, Managed Kubernetes, etc.En savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}VPC-Private NetworksCombinez Elastic Metal, Instances, Databases & Load Balancers dans un même réseau privé L2 pour construire (et scaler) une infrastructure sécurisée et diversifiée. Avec Virtual Private Cloud, vous avez accès à un serveur DHCP intégré, aucune configuration réseau complexe n'est requiseEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}IPs flexiblesCréez, attachez et détachez vos flexible IPs avec vos serveurs Elastic Metal ou avec Instances pour adapter votre architecture à vos besoins.En savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}API, CLI & TerraformBoostez vos performances grâce à nos outils sur notre portail développeur : Scaleway CLI, Python SDK ou Go. Nos produits sont également compatibles avec Terraform, pour faciliter la création d’infrastructures et l’automation.En savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Commencez avec des tutorielsPremiers pas avec Elastic MetalEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Comment se connecter à son serveur Elastic MetalEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}IP Flexible sur Elastic MetalEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Tutorials.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Foire aux questionsQu'est-ce qu'un serveur Elastic Metal ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Un serveur Elastic Metal est une machine physique 100 % dédiée. Avec ce serveur bare metal vous avez la main sur le choix de l'OS et éventuellement de l'hyperviseur qui vous permettra de créer et gérer des machines virtuelles indépendement. Vous avez ainsi un contrôle total des ressources et des applications installées sur le serveur, pour un maximum de performance et de sécurité. Plusieurs systèmes d'exploitation sont disponibles à l'installation automatique depuis votre Console. La construction du nom du produit vous aide à identifier facilement le bon produit pour votre entreprise et vos besoins. La gamme, le modèle, la génération, la déclinaison et les processeurs sont tout de suite identifiés dans le nom ! Pourquoi choisir Elastic Metal?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Les serveurs de la gamme Elastic Metal sont les serveurs bare metal dédiés mis à votre entière disposition en location. Cette location se fait à l'heure ou au mois et sans engagement, vous permettant d'avoir votre propre serveur ou parc de serveurs bare metal rapidement. Avec nos solutions bare metal vous ou votre entreprise n'avez plus besoin d'investir dans vos propres serveurs et d'assurer la maintenance couteuse, nous nous occupons de tout et assurons le service continu de vos serveurs 24/7.Quelle est la différence entre Elastic Metal et les serveurs dédiés (Dedibox) ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Dedibox est notre gamme de serveurs historique, seulement disponible sur tarification mensuelle. L'offre Elastic Metal est améliorée et dotée d'une plus grande flexibilité. Elle propose les mêmes fonctionnalités, une tarification horaire plus souple, des intégrations cloud et plus encore.Comment fonctionne la facturation pour Elastic Metal ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Selon les besoins immédiats ou le projet long terme de votre entreprise, les serveurs dédiés Elastic Metal sont disponibles selon deux plans de facturation différents : à l'heure ou au mois. Dans les deux cas, vous recevrez une facture mensuelle calculée en fin de mois et basée sur votre consommation de ressources pendant le mois (nombre d'heures consommées si vous avez sélectionné la facturation horaire, ou le prix mensuel si vous avez opté pour la facturation mensuelle). Cependant, pour bénéficier de la facturation mensuelle, plus avantageuse, il vous faudra payer les frais d'engagement équivalents à un mois d'abonnement. En remerciement pour votre fidélité, si vous louez un serveur Elastic Metal pendant plus de 12 mois, nous vous rembourserons les frais d'engagement en crédits cloud Scaleway. Cliquez ici pour en savoir plus sur notre politique de remboursement des frais d'engagement.Combien de temps prend le démarrage d'un serveur Elastic Metal ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Vous recevrez un serveur Elastic Metal sur votre compte en quelques minutes. Vous pouvez alors lancer l'installation de votre serveur en quelques clics. L’installation de l’OS peut prendre jusqu’à 1 heure.Comment sauvegarder un serveur Elastic Metal ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}La sauvegarde d'un serveur Elastic Metal fonctionne différemment d'un Snapshot sur Instance. Il faut d'abord sauvegarder les données et la configuration de votre serveur Elastic Metal. Il est possible pour cela de les exporter vers un bucket Object Storage. Vous trouverez la documentation nécessaire sur la page. Vous pouvez également assurer la sécurité et la redondance de vos données en configurant votre application sous forme de cluster.Comment réinstaller un serveur Elastic Metal ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Vous pouvez réinstaller un serveur Elastic Metal en quelques clics, à tout moment, depuis votre console.Pour qui est conçu le serveur Elastic Metal ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Elastic Metal est conçu pour toutes les entreprises ayant des besoins d'infrastructure serveur dédié, et propose des gammes variées répondant à différents besoin, comme par exemple de l'hébergement de sites web ou d'applicatifs, ou la gestion de bases de données volumineuses avec un flux de données elevé. Nos serveurs bare metal vous permettront de configurez vos machines avec précision, assurant la sécurité des données et évitant les risques et inconvénients qui découlent de la colocation dans l'infrastructure partagée."
