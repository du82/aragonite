full_description = "Entièrement managéStockez, gérez et déployez des images de conteneur. Nous gérons vos registres du développement à la production. Déployez sur KubernetesOrchestrez rapidement le déploiement de toutes vos applications conteneurisées au sein d’une infrastructure flexible. Contrôlez le versioning du système d’exploitationSimplifiez votre environnement de développement. Assurez-vous que toute votre équipe travaille sur la même version de l’application. Container RegistryUn référentiel Docker intuitif.Créer un compte professionnel .css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Créer un compte individuel.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Entièrement managéStockez, gérez et déployez des images de conteneur. Nous gérons vos registres du développement à la production.Déployez sur KubernetesOrchestrez rapidement le déploiement de toutes vos applications conteneurisées au sein d’une infrastructure flexible.Contrôlez le versioning du système d’exploitationSimplifiez votre environnement de développement. Assurez-vous que toute votre équipe travaille sur la même version de l’application.Cas d'usageStockez vos images de conteneurRationalisez votre workflowContrôlez les politiques de confidentialité de vos imagesStockez vos images de conteneurFacilitez le stockage, la gestion et le déploiement de vos images de conteneur, et assurez la récupération rapide et sans friction de vos workloads conteneurisées.Rationalisez votre workflowSimplifiez votre flux de travail du développement à la production. Nous nous chargeons d’opérer votre Container Registry et de l’infrastructure sous-jacente.Contrôlez les politiques de confidentialité de vos imagesSuivez les changements de version de vos images de conteneur et revenez facilement en arrière dans votre déploiement au besoin. Choisissez la version d’images que vous souhaitez extraire, et supprimez celles dont vous n’avez plus besoin.FonctionnalitésRéplication d’imagesLes images sont stockées, distribuées grâce à un load balancer et répliquées sur nos buckets de stockage d’objet interne afin de garantir la haute disponibilité.Docker Registry managéNous gérons votre Docker Registry de l’installation aux mises à jour de sécurité.Versions d’imagesSuivez les changements de version de vos images de conteneur et revenez facilement en arrière dans votre déploiement au besoin. Choisissez la version d’images que vous souhaitez conserver et supprimez celles dont vous n’avez plus besoin.Authentification de requêtesPour chacune des actions du docker, une requête est adressée à l’API-controller qui vérifie la validité du jeton avant d’exécuter la requête.Contrôle les politiques de confidentialitéContrôlez vos politiques de confidentialité que ce soit au niveau du namespace ou à celui de l’image de conteneur. Vous pouvez modifier les politiques de confidentialité des images en fonction de vos besoins.Créer un compte.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Pourquoi choisir Scaleway ?Notre ADN européen et multi-cloudBasés en France et utilisés par des architectes cloud et des clients partout dans le monde, nos services sont protégés par les réglementations de l’Union européenne.Plus durable, et ce dès le début100 % de l’électricité consommée dans nos datacenters provient de l’énergie éolienne et de l’hydroélectricité depuis 2017.Support 24h/24 et 7j/7Grâce à notre support 24h/24 et 7j/7 profitez de votre expérience en toute tranquillité. Nous nous assurons en outre du bon fonctionnement de votre infrastructure.Une facturation transparente et prévisibleNos services sont conçus pour vous offrir le meilleur rapport prix-performance, que vous permet d’accroître votre activité tout en contrôlant votre budget.Commencez avec des tutorielsDeploy an image from Scaleway Elements Container Registry to Kubernetes KapsuleEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Periodically delete unused images in your Container RegistryEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Getting started with Kubernetes - Pushing to the Scaleway Container RegistryEn savoir plus.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Tutorials.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Foire aux questionsQu'est-ce que le Container Registry de Scaleway ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Le Container Registry de Scaleway est un registre de conteneurs mutualisé entièrement managé, conçu pour faciliter le stockage, la gestion et le déploiement des images de conteneurs. Ce service simplifie le flux de travail du développement à la production, puisqu’il ne vous est désormais plus nécessaire de piloter un registre de conteneurs ni de se soucier de l’infrastructure sous-jacente. Vous pouvez stocker tous les types d’images de conteneurs Docker sur le namespace et il est possible de définir la visibilité de chaque image en fonction de vos besoins. Cette visibilité peut être privée ou publique.Qu'est-ce qu'un namespace ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Les namespaces permettent de gérer les référentiels de manière simple, claire et lisible par l’homme. Un namespace est un ensemble d’images de conteneurs ayant un identifiant unique (chaque namespace ne peut exister qu’une seule fois). Un namespace appartient à un utilisateur, responsable de la configuration des autorisations push et pull.Qu'est-ce qu'une image de conteneur ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Les images de conteneur sont des fichiers qui incluent toutes les exigences et instructions de la version complète et exécutable d’une application. Lorsque vous exécutez une image, elle devient une ou plusieurs Instances de cette application. Vous pouvez extraire les instructions de l’image, modifier ses paramètres, afficher ses versions ou la supprimer.Où sont localisées mes données ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Le service Container Registry est disponible dans toutes les régions (Paris, Amsterdam, Varsovie).Puis-je stocker plusieurs versions d'une image ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Oui, le Container Registry de Scaleway prend en charge le versioning et vous pouvez stocker autant de versions d’une image que vous le souhaitez.Pourquoi reçois-je un message indiquant que le namespace n'est pas disponible ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Chaque namespace possède un nom unique dans chaque zone géographique. Si le nom du namespace est déjà pris, il n’est malheureusement plus disponible."
