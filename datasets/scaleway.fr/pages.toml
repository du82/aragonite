full_description = "Betas & PreviewsBêta publiqueLes produits en phase de Bêta publique (Public Beta) sont prêts à être testés par tous les clients. Ces produits ne contiennent cependant pas toujours toutes les fonctionnalités prévues pour la version finale. Il s’agit de la dernière phase de tests avant la sortie d’un produit en Disponibilité générale. Ces produits sont faits pour être utilisés dans des environnements de test sauf indication contraire. La phase Public Beta dure en moyenne six mois.Environmental Footprint CalculatorNewScaleway s'engage à vous aider à comprendre et réduire votre empreinte carbone avec précision. Grâce à notre calculatrice d'empreinte environnementale, vous pouvez désormais accéder à des estimations précises de vos émissions de carbone dès le moment de la commande et recevoir des rapports mensuels détaillés sur l'impact environnemental de vos serveurs Elastic Metal.Accéder à la documentation et essayer.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Instance Scaling Groups APINewInstance Scaling Groups API ajustent dynamiquement le nombre d'instances en fonction des politiques de mise à l'échelle définies. Maintenez les performances optimales de l'application et la rentabilité en augmentant votre groupe d'Instances lors des pics de trafic et en le réduisant lorsque la demande diminue.Accéder à la documentation et essayer.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Managed InferenceManaged Inference vous permet de déployer des modèles d'IA (langage, vision, embeddings...) et de répondre aux questions des utilisateurs européens en toute sécurité. Vous obtenez des points d'accès sur les instances de votre choix, et un service de niveau entreprise : isolation complète dans un réseau privé, gestion du contrôle d'accès, observabilité intégrée...Déployez un modèle.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Dedicated IP for Transactional EmailÊtes-vous intéressé par une offre de Pool/IP dédiée pour l'envoi de mails ? Nous recherchons des bêta-testeurs pour optimiser cette solution. Si l'idée d'utiliser une adresse IP dédiée vous séduit et que vous souhaitez participer à son développement, inscrivez-vous ici :.tf-v1-widget{width:100%;height:100%;min-height:inherit;position:relative}.tf-v1-widget iframe{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;min-height:inherit}.tf-v1-widget-close{display:none}.tf-v1-widget-iframe-overlay{width:100%;height:100%;border:none;overflow:hidden;border-radius:8px;position:absolute;top:0;left:0}.tf-v1-widget-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;width:100% !important;height:100% !important}.tf-v1-widget-fullscreen .tf-v1-widget-close{display:block;display:block;padding:0;margin:0;position:absolute;font-size:32px;font-weight:normal;line-height:24px;width:24px;height:24px;text-align:center;text-transform:none;cursor:pointer;opacity:.75;transition:opacity .25s ease-in-out;text-decoration:none;color:#000;top:6px;right:8px;background:none;border:none;border-radius:0;z-index:1}.tf-v1-widget-fullscreen .tf-v1-widget-close:hover{opacity:1}@media(min-width: 481px){.tf-v1-widget-fullscreen .tf-v1-widget-close{color:#fff !important}}.tf-v1-widget-fullscreen iframe{border-radius:0}Generative APIsNewVous souhaitez explorer une alternative européenne aux APIs d'OpenAI ? Generative APIs vous donne un accès serverless à des modèles d'IA, tous hébergés dans des centres de données européens sécurisés, et tarifés par million de tokens. L'accès à ce service est gratuit en beta. Des conditions spécifiques s'appliquent. Commencez à utiliser le service avec cette documentation Lire la politique de confidentialité 