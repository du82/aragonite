title = "Déclaration d'accessibilité | Scaleway"
description = "Déclaration d'accessibilité numérique de Scaleway relatif à ses contenus et ses services numériques."
full_description = '''Déclaration d'accessibilitéScaleway s'engageDéclaration d'accessibilité numérique de Scaleway relatif à ses contenus et ses services numériques.Scaleway s'engage à rendre ses sites Internet accessibles conformément à l'article 47 de la loi n°2005-102 du 11 février 2005 pour l'égalité des droits et des chances, la participation et la citoyenneté, à la loi n°2016-1321 du 7 octobre 2016 pour une république numérique, ainsi qu'au décret n°2019-768 du 24 juillet 2019. Scaleway a désigné un référent accessibilité numérique en février 2024 et soutient des actions de sensibilisation et de formation des Scalers à l'accessibilité numérique. En 2025, Scaleway publiera une feuille de route pour améliorer l'accessibilité de ses services. Ce document inclura un Schéma pluriannuel d'accessibilité numérique, décliné en plans d'actions annuels, avec les moyens nécessaires à leur mise en œuvre. Ces documents, en cours de rédaction, seront disponibles sur cette page. Ci-dessous les stratégies et actions actuellement en cours : la création d'un groupe de discussion externe disposant d'une adresse de courriel dédiée afin de recueillir les retours des utilisateurices ; une Masterclass mensuelle de sensibilisation aux enjeux de l'accessibilité numérique ouverte à toutes et tous ; une veille à destination des personnes chargées de la création, du développement ou de la contribution des contenus via notre outil de discussion interne (canaux Slacks) ; des contenus et références librement disponibles dans un espace dédié de l'intranet ; la formation d’un référent accessibilité numérique par une société de conseil spécialisée en accessibilité numérique (Access42) ; une formation "Concevoir du contenu éditorial accessible pour le web" (Access42) pour l'équipe Doc. D'autres actions sont initiées et se développent : un recrutement interne de volontaires déjà sensibilisés afin de constituer une communauté de pratiques et placer ses membres en support dans les différentes équipes métiers ; des ateliers de mise en pratique orientés sur la création, la contribution ou le développement lors des rencontres Team building ou pendant des informelles ; création et diffusion interne de supports d'auto-formation (outil interne 360Learning). Audits Le référent accessibilité dispose d'une certification EAE (Expert Accessibilité en Évaluation). Pour cette raison les travaux d'audits sont actuellement réalisés en interne. Un audit sur l'interface client console.scaleway.com a été produit courant juillet 2023 à l'aide du référentiel RGAA 4.1.2. Le rapport est disponible au téléchargement en version PDF (192Ko). Il révèle un taux moyen de conformité de 66,5% (moyenne des taux de conformité de chaque page) pour juillet 2023. NiveauxConformeNon-conformeA47,1 %52,9 %AA64,3 %35,7 % Pourcentage global de critères conformes et non-conformes par niveaux correspondants aux critères de succès des Règles pour l’accessibilité des contenus Web (WCAG) 2.1 de niveau simple A (A) et double A (AA). Technologies utilisées pour la réalisation du site HTML5 CSS JavaScript Agents utilisateurs et technologies d’assistance utilisées pour vérifier l’accessibilité des contenus Les tests des pages web ont été effectués avec les outils suivants : sur Mobile iOS avec Safari et VoiceOver ; sur Ordinateur MacOS avec Firefox, Safari et VoiceOver ; sur Ordinateur MacOS avec l'addon Firefox axe DevTools pour la partie automatisée. La vérification de l’accessibilité est le résultat de tests manuels, assistés par des outils (feuilles CSS dédiés, extensions HeadingsMaps et WebDeveloper Toolbar, Color Contrast Analyser). Échantillon ayant fait l’objet de la vérification de conformité Login : https://console.scaleway.com/login Register : https://console.scaleway.com/register Organization Overview : https://console.scaleway.com/organization Support Tickets : https://console.scaleway.com/support/tickets Project Overview : https://console.scaleway.com/project Account Profile : https://console.scaleway.com/account/profile Avis Le site a un niveau d’accessibilité moyen. Le site intègre de bonnes pratiques d’accessibilité de manière générale, mais certains contenus ou composants restent inaccessibles à une partie des utilisateurices. Au moment de l'audit les non-conformités les plus bloquantes concernent : les scripts et l’utilisation de l’API ARIA ; la structuration des titres ; les images sur des boutons/liens sans labels ; les Tooltips ; certains tableaux et formulaires. Actions réalisées depuis l'audit Depuis la réalisation de cet audit, des actions correctives ont étés engagées en collaboration avec les équipes : page intranet répertoriant les correctifs à appliquer classés en seuil de valeurs ; implication des parties prenantes, managers, concepteurs et développeurs ; création de tickets de tâches correctives à réaliser pour les équipes concernées ; traitement de la plupart des tickets par les développeurs de l'équipe console ou design system ; mise en place d'un flux de communication avec rendez-vous réguliers pour les parties prenantes ; ajout d'une ligne aux déclarations projet/intervenant/temps consacré, permettant d'obtenir des métriques. Au total 8 tickets ont étés traités et les corrections sont en production. Les principales corrections ont portés sur la structuration hiérarchique des pages, certains formulaire et les retours d'information de ces formulaires au moment de leur utilisation ainsi qu'une amélioration des textes alternatifs proposés sur certaines images et icônes. De plus la console Scaleway utilisant un design system développé en interne, appliquer une correction sur un élément a permis de la propager sur un large ensemble de pages. Suite à ces améliorations le taux de conformité n'a pas été mesuré à nouveau. Le potentiel taux révisé et amélioré sera confirmé lors d'un nouvel audit sur la partie console Scaleway selon les dispositions prises dans le schéma pluriannuel. État de conformité Console: Partiellement conforme ; Site vitrine: Audit prévu pour 2025 ; Site de documentation: Audit prévu pour 2025. Établissement de cette déclaration d’accessibilité Cette déclaration a été établie le 04 février 2025. Retour d’information et contact Il est important de rappeler qu’en vertu de l’article 11 de la loi de février 2005 : « La personne handicapée a droit à la compensation des conséquences de son handicap, quels que soient l’origine et la nature de sa déficience, son âge ou son mode de vie. » Scaleway s'engage à mettre en oeuvre les moyens nécessaires afin de donner accès, dans un délai raisonnable, aux informations et fonctionnalités recherchées par la personne en situation de handicap, que le contenu fasse l'objet d'une dérogation ou non. Si vous rencontrez des difficultés une assistance peut vous être apportée (alternative accessible, information et contenu donnés sous une autre forme) : digital.accessibility@scaleway.com Voies de recours Si vous constatez un défaut d'accessibilité vous empêchant d'accéder à un contenu ou une fonctionnalité du site, que vous nous le signalez et que vous ne parvenez pas à obtenir une réponse de notre part, vous êtes en droit de faire parvenir vos doléances ou une demande de saisine au Défenseur des droits. Plusieurs moyens sont à votre disposition : Formulaire de contact ; Liste du ou des délégués de votre région avec leurs informations de contact direct ; Numéro de téléphone : 09 69 39 00 00 ; Courrier postal gratuit, sans affranchissement : Le Défenseur des droits - Libre réponse 71120 - 75342 Paris CEDEX 07.'''
year_published = 2025
