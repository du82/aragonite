["https://scaleway.fr/fr/domains-and-dns"]
title = "Nom de domaine : Achat de domaine | Scaleway"
description = "Trouvez votre nom de domaine personnalisé et choisissez l'une des +300 extensions, permettant à vos clients et contacts de trouver facilement votre site Web."
full_description = '''Le point de départ de votre businessAchetez et gérez directement vos domaines et DNS depuis l’interface intuitive que vous utilisez déjà pour héberger votre business. Les domaines au meilleur prixUne facturation annuelle transparente et prévisible, sans surprises ni remises trompeuses. Un DNS cloud fiableAvec une zone DNS incluse par domaine et une intégration API complète, Scaleway vous garantit simplicité et rapidité. Achetez votre nom de domaine à prix compétitif avec ScalewayPour vos projets d’hébergement de site web, d’adresses email personnalisées ou d’un service cloud de stockage, l’achat d’un nom de domaine est la première étape à mettre en place : vérifiez la disponibilité des noms de domaine et achetez-les directement chez Scaleway.Rechercher un nom de domaine.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Créez votre compte.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Le point de départ de votre businessAchetez et gérez directement vos domaines et DNS depuis l’interface intuitive que vous utilisez déjà pour héberger votre business.Les domaines au meilleur prixUne facturation annuelle transparente et prévisible, sans surprises ni remises trompeuses.Un DNS cloud fiableAvec une zone DNS incluse par domaine et une intégration API complète, Scaleway vous garantit simplicité et rapidité.Des fonctionnalités fiables à des prix compétitifsChoisissez vos domainesVous pouvez désormais vérifier la disponibilité d’un domaine directement sur la console Scaleway. Enregistrez, renouvelez (automatiquement) ou transférez (bientôt disponible) vos domaines simplement et au juste prix. Plus de 300 extensions sont disponibles. Trouvez celle qui convient le mieux à votre entreprise sur la console.Gérez votre DNSGérez vos zones internes et externes, y compris le versionnage, les importations et exportations au format BIND, ainsi que les délégations de zones. Avec Domains and DNS, vous pouvez gérer les records classiques et dynamiques : GeoIP, Weighted Round Robin (WRR), health checks et vues. Lorsque vous gérez votre domaine avec Scaleway, nous incluons une zone DNS gratuite pour chaque domaineQue faire avec un nom de domaine ?Rechercher et acheter un nouveau domaineRegrouper tous mes domaines au même endroit Créer des sous-domaines pour d'autres services Rechercher et acheter un nouveau domaineVous démarrez une nouvelle entreprise ou lancez un projet personnel, vous recherchez un nouveau nom de domaine à utiliser pour votre site Web ou votre adresse e-mail. Vous pouvez chercher les options disponibles (.fr, .com, .net,...) et finaliser vos achats sur la console Scaleway.Regrouper tous mes domaines au même endroit Votre entreprise peut posséder plusieurs domaines pour divers projets et vous souhaitez disposer d'un emplacement centralisé pour les gérer tous afin d'afficher les dates d'expiration, les options de renouvellement et tout autre détail important.Créer des sous-domaines pour d'autres services Pour votre entreprise, vous souhaitez créer des sous-domaines pour héberger d'autres services, tels que leur API ou leur blog. En créant des sous-domaines, vous pouvez garder ces services organisés et facilement accessibles sous leur nom de domaine principal. Par exemple, une API située sur api.example.com et un blog situé sur blog.example.com.Découvrez nos noms de domaines et leurs prixConsulter la liste.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Pourquoi enregistrer votre nom de domaine chez Scaleway ?Une expérience encore plus complèteNous vous offrons une nouvelle expérience avec l’accès API, les distributions Linux, notre Console intuitive, Terraform. Déployer vos serveurs n’a jamais été aussi facile.Une console intuitiveNotre interface utilisateur a été conçue pour les développeurs. Nous voulons que notre interface soit la plus simple, utile et exhaustive de toute l’industrie du cloud. Notre but : vous garantir une expérience optimale lors de la gestion de vos projets cloud.Un véritable écosystème cloudNos produits cloud sont conçus et construits de façon à se compléter, vous offrant ainsi une expérience cloud de premier ordre et sans friction.Foire aux questionsQu'est-ce qu'un nom de domaine ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Un nom de domaine est l'identité unique de votre site web sur internet. Il traduit une adresse IP en un nom facile à retenir pour les internautes. Choisir le bon nom de domaine est crucial pour votre présence en ligne, votre image de marque et votre visibilité. Découvrez comment sélectionner, acheter et gérer efficacement votre nom de domaine pour développer votre activité sur le web. Le nom de domaine constitue un élément fondamental de l'architecture d'Internet. Il facilite l'accès aux sites web en remplaçant les adresses IP numériques par des noms mémorisables. Son rôle va au-delà de la simple identification : il structure l'organisation même du Web. Les noms de domaine permettent de catégoriser les sites selon leur activité (.com, .org) ou leur localisation géographique (.fr, .uk). Ils sont aussi essentiels pour la sécurité en ligne. Le système de noms de domaine (DNS) vérifie l'authenticité des sites visités, protégeant ainsi les internautes contre les fraudes. De plus, les noms de domaine contribuent à la hiérarchisation de l'information sur Internet, rendant possible la création de sous-domaines pour organiser efficacement le contenu d'un site web.Différence entre nom de domaine et URL.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Bien que souvent confondus, le nom de domaine et l'URL ont des fonctions distinctes. Le nom de domaine représente l'identifiant unique d'un site web, comme "google.com" ou "apple.com". L'URL, quant à elle, englobe le nom de domaine et fournit l'adresse complète d'une page spécifique. Elle inclut : le protocole (http:// ou https://), le nom de domaine, le chemin vers une page particulière. Par exemple, dans l'URL "https://www.scaleway.com/fr/domains-and-dns/", "scaleway.com/fr/" est le nom de domaine, tandis que l'URL complète indique la localisation précise de la page "nutrition" sur le site. Cette distinction s'avère cruciale pour la navigation web et l'optimisation du référencement.Quel est le prix d'un nom de domaine ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Les tarifs des noms de domaine varient considérablement selon l'extension choisie. Les domaines en .com coûtent généralement entre 10 et 15 € par an, tandis que les extensions moins courantes peuvent être plus onéreuses. La durée minimale d'enregistrement est habituellement d'un an. Certaines extensions comme .fr ou .de requièrent une présence locale, ce qui peut influencer le prix et les conditions d'enregistrement. Pour les domaines premium ou déjà détenus, les coûts peuvent atteindre plusieurs milliers d'euros.Comment acheter un nom de domaine ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}L'acquisition d'un nom de domaine se fait auprès de bureaux d'enregistrement accrédités comme Scaleway. Nous proposons un large éventail d'extensions : .com, .fr, .xyz, .io, etc.. Le processus d'achat comprend est le suivant : sélection du nom et de l'extension, vérification de la disponibilité, ajout au panier et paiement, fourniture des informations de contact.Quelle est la durée d'enregistrement d’un nom de domaine ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Les noms de domaine sont enregistrés pendant 1 an.Comment renouveler mon nom de domaine ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Le renouvellement régulier d'un nom de domaine garantit la continuité de votre présence en ligne.Chez Scaleway nous proposons une option de renouvellement automatique pour éviter toute interruption accidentelle. En cas de non-renouvellement, le domaine entre dans une période de grâce, généralement de 30 à 45 jours, durant laquelle il reste récupérable moyennant des frais supplémentaires. Après cette période, le domaine bascule en statut "rédemption" pour environ 30 jours. Les coûts de récupération augmentent considérablement à ce stade. Une fois ce délai écoulé, le domaine redevient disponible pour un nouvel enregistrement par n'importe qui. La perte d'un nom de domaine peut avoir des conséquences sérieuses : interruption du site web, perte des adresses e-mail associées et risque de voir un concurrent s'emparer du nom. Un calendrier de renouvellement bien géré prévient ces désagréments. Le renouvellement de votre nom de domaine se fait chaque année. Vous pouvez renouveler votre nom de domaine depuis la console, dans la rubrique renouvellement. Avant l’expiration du nom de domaine vous recevrez des emails pour vous informer de cette expiration. Si vous n’avez plus vos codes pour accéder à votre console de gestion et en cas d’urgence, il vous est possible de renouveler le ou les prestations ici.Qu'est-ce qu'une zone DNS ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Une zone DNS est la feuille de route du nom de domaine. Elle contient toutes les informations requises pour exploiter le domaine sur internet. Par exemple, les A-records indiquent où se trouve le site web. Les MX-records indiquent où les emails doivent être envoyés.'''
