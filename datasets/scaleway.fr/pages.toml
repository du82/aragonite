 facturation commence au premier du mois et se termine le dernier jour du mois. À chaque commande, vous serez facturé au prorata du mois en cours, sauf si vous payez par SEPA. Auquel cas, votre première facture vous sera envoyée lors du premier mois complet et comprend le montant au prorata du mois en cours et celui du prochain mois complet.Où sont hébergés les serveurs dédiés Dedibox ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Tous nos serveurs Dedibox et services associés sont hébergés dans nos datacenters de Paris et Amsterdam. Nous avons également un datacenter à Varsovie.Mes données sont-elles en sécurité ?.css-3sqif5{vertical-align:middle;fill:currentColor;height:1em;width:1em;min-width:1em;min-height:1em;}.css-3sqif5 .fillStroke{stroke:currentColor;fill:none;}Scaleway n’a pas accès à vos données. Cependant, la mise en place de sauvegardes est votre responsabilité, ainsi que celle de vos '''
