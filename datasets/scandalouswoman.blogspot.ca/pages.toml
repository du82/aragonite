full_description = '''Halloween Giveaway - A Haunted History of Invisible Women Get link Facebook X Pinterest Email Other Apps October 28, 2022 In the past, I've normally done a giveaway for my birthday or to celebrate the anniversary of Scandalous Women, but this year I decided to do something different. I'm giving away a copy of A Haunted History of Invisible Women by my friend and fellow author Leanna Renee Hieber and her co-author Andrea Janes . This is a fantastic book not just for ghost lovers but also women's history lovers. "Deliciously eerie.” —Leslie Rule, Bestselling Author From the notorious Lizzie Borden to the innumerable, haunted rooms of Sarah Winchester's mysterious mansion this offbeat, insightful, first-ever book of its kind from the brilliant guides behind “Boroughs of the Dead,” featured on NPR.org, The New York Times , and Jezebel, explores the history behind America’s female ghosts, the stereotypes, myths, and paranormal tales that swirl around them, what their stories reveal about us—and why they haunt us . . . Sorrowful widows, vengeful jezebels, innocent maidens, wronged love... Post a Comment Read more { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "http://www.elizabethkmahon.com/2022/01/interview-with-mimi-matthews-siren-of.html" }, "headline": "Interview with Mimi Matthews - The Siren of Sussex","description": "I am delighted to welcome author Mimi Matthews to the blog to talk about her new historical romance novel The Siren of Sussex which came out...","datePublished": "2022-01-24T08:00:00-05:00", "dateModified": "2022-01-24T08:00:00-05:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/a/AVvXsEjSRqM5NvmBfUMMGVO3HjfXCwiVGIpXcxUYFYcmf9YhhLSD7yjxJuCsrhBaOL5AZc-9ZpmrK2c5F6yIvJCh2JywdPhh6q_hJbGhMBI3Hu-gDGHUU0743WS_I_FI5xZrdT_1b_EM0JgIo-fXM4X1FATFqjlTYefmLcTk3uHgrlwOsarIAzZL-7tHwwK5=w1200-h630-p-k-no-nu", "height": 630, "width": 1200},"publisher