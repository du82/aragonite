title = "Blog – Page 2 – sceen.net"
full_description = "How bad can an ISP be ? I used to be an OVH DSL user. The service was very good. The only thing that could have been improved was the Technicolor router, which is clearly sub-par compared to the quality normally associated with OVH services, but as long as you stick to the default configuration, it would run fine. Continue reading “How bad can an ISP be ?” Author rbraunPosted on September 4, 2017Categories Computing Hey, real time ! Among the goals of the X15 operating system is real time. This expression is undoubtedly one of the vaguest buzzwords out there in the computer industry, which means I can’t really say anything about it without first attempting to provide a decent definition. Continue reading “Hey, real time !” Author rbraunPosted on March 5, 2017June 25, 2020Categories Computing, X15 The trust tree This could be the title of a novel, but no, the subject is really about computers and systems. Continue reading “The trust tree” Author rbraunPosted on January 3, 2017January 6, 2017Categories The Hurd, X15 The end of the thundering Hurd It’s 2016, and the Hurd project is still alive. Barely, as a bunch of only three to five people “regularly” contribute, but it is alive. And it’s making progress. Continue reading “The end of the thundering Hurd” Author rbraunPosted on May 31, 2016January 3, 2017Categories The Hurd Let’s Encrypt As a tech geek, I’m quite sensitive to a current trend that aims at pushing the Web towards globally encrypted communications. My main problem with this idea was trust in certificate authorities, and as a result, I ended up being my own CA, which only a few people could trust. Continue reading “Let’s Encrypt” Author rbraunPosted on May 14, 2016May 14, 2016Categories Computing The Nagler experience A while ago, I broke the wide angle eyepiece I mentioned in a previous post. It had dust inside its 4 elements, and I tried to clean it up. As I was a little frustrated by the presence of dust inside the eyepiece itself, I decided that I would only buy very good quality eyepieces from now on. Continue reading “The Nagler experience” Author rbraunPosted on April 26, 2015May 14, 2016Categories Astronomy"
