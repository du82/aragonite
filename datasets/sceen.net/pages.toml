["https://www.sceen.net/x1"]
title = "The X1 operating system – sceen.net"
full_description = "The X1 operating system X1 is a very small educational operating system intended for students who are learning low-level system programming. As a result, it focuses on clarity of explanation. It’s not meant to demonstrate state-of-the-art methods and algorithms, but rather simple, naive ones that do the job, while providing pointers and references to the more modern ways. X1 was written with the help of Jerko Lenstra (Github page). Matthew Leach uses X1 for his personal network stack project (Github page). Source code : https://git.sceen.net/rbraun/x1.git/ GitHub mirror : https://github.com/richardbraun/x1"
