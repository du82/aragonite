full_description = "One year review of the Softail Low Rider It’s been about a year since I got my motorcycle, and I figured it would be a good thing to write about it, and that now would be a good time to do it. Continue reading “One year review of the Softail Low Rider” Author rbraunPosted on January 31, 2020June 9, 2020Categories Motorcycle Shutting down the Buildroot autobuilder I’m moving sceen.net to a smaller machine, and decided to shut down the Buildroot autobuilder that has been running on the server for more than 5 years now. Buildroot is a great project, with great people. I’ve been recommending it for more than a decade now, used it personally and professionally on multiple occasions, and was glad I could contribute that long despite very limited available time. Author rbraunPosted on September 30, 2019Categories Computing X15 – Progress report – 2019Q1-2 The project is still mostly stalled, unfortunately. But a couple of things were achieved : Simon Venken reported a bug on semaphores, which were reworked.Simon Venken also reported a bug concerning the chaining of wake-ups in sleep queues, which was fixed.the kern/mbuf module, providing message ring buffers, was added.the kern/log module was reworked to use a message ring buffer, and a bug on the log buffer being full was fixed. Author rbraunPosted on July 11, 2019July 11, 2019Categories X15 Smaller is better Beginner guides for astronomy often mention that binoculars are not only a good, cheap way to start, but also that they end up complementing a telescope acquired afterwards nicely. I got the telescope first, but I have to agree. Continue reading “Smaller is better” Author rbraunPosted on May 22, 2019May 22, 2019Categories Astronomy Scenarios and invariants How does a developer come up with code ? How does he know what to write, and if it’s a correct thing to do ? Spoiler alert: it’s much more art than science. Continue reading “Scenarios and invariants” Author rbraunPosted on February 11, 2019October 4, 2021Categories Computing"
