title = "X15 – sceen.net"
full_description = "X15 – Progress report – 2019Q1-2 The project is still mostly stalled, unfortunately. But a couple of things were achieved : Simon Venken reported a bug on semaphores, which were reworked.Simon Venken also reported a bug concerning the chaining of wake-ups in sleep queues, which was fixed.the kern/mbuf module, providing message ring buffers, was added.the kern/log module was reworked to use a message ring buffer, and a bug on the log buffer being full was fixed. Author rbraunPosted on July 11, 2019July 11, 2019Categories X15 X15 – Progress report – 2018Q3-4 As a result of personal events, the project has been mostly stalled these last six months. However a few changes were made, the most important being : Interrupt handling rework on x86, with the merging of the trap module into the cpu module.Red zone support on x86 (amd64), which is required for full ABI compliance.Suspend/resume thread operations, similar to SIGSTOP/SIGCONT on Unix. Author rbraunPosted on February 11, 2019Categories X15 Cross compiling X15 on ARM Since I got myself an ARM Chromebook, I made it a goal to be able to work on X15 directly on that small device. This implies cross compiling from ARM (actually aarch64) to x86, and running it in an emulator. Continue reading “Cross compiling X15 on ARM” Author rbraunPosted on August 3, 2018Categories Computing, X15 X15 – Progress report – 2018Q2 The major change of this quarter is the addition of a generic low level performance monitoring system, developed in large part by Rémy Noël. Continue reading “X15 – Progress report – 2018Q2” Author rbraunPosted on July 10, 2018July 10, 2018Categories X15 X15 – Progress report – 2018Q1 It’s been a while since I’ve written about the progress on X15. As an open source project I work on in my free time, its development pace is unsurprisingly not constant, but despite that, a lot of progress was made since it was seriously restarted in 2017. Continue reading “X15 – Progress report – 2018Q1” Author rbraunPosted on May 25, 2018May 25, 2018Categories X15"
