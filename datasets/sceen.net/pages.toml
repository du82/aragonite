["https://www.sceen.net/category/computing/hurd"]
title = "The Hurd – sceen.net"
full_description = "The trust tree This could be the title of a novel, but no, the subject is really about computers and systems. Continue reading “The trust tree” Author rbraunPosted on January 3, 2017January 6, 2017Categories The Hurd, X15 The end of the thundering Hurd It’s 2016, and the Hurd project is still alive. Barely, as a bunch of only three to five people “regularly” contribute, but it is alive. And it’s making progress. Continue reading “The end of the thundering Hurd” Author rbraunPosted on May 31, 2016January 3, 2017Categories The Hurd Iceweasel 31 on Debian GNU/Hurd https://lists.debian.org/debian-hurd/2014/09/msg00070.html. For some reason, the system has become more unstable recently. I’ve seen it freeze as soon as swapping memory out. I suspect it’s because of recent changes on the ext2 file system. These changes are good but they expose existing bugs we didn’t suffer from in the past. In order to cope with that, I’ve been using a kernel with no VM object cache, and completely synchronous file system accesses. Author rbraunPosted on September 15, 2014May 14, 2016Categories The Hurd Iceweasel 30 on Debian GNU/Hurd https://lists.debian.org/debian-hurd/2014/06/msg00069.html. The good news is that the patch may land in upstream soon. Author rbraunPosted on June 22, 2014May 14, 2016Categories The Hurd"
