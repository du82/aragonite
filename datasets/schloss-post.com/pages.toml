["https://schloss-post.com/category/galleries"]
title = "Galleries | Akademie Schloss Solitude: Schlosspost"
full_description = "Solitude Summer Feast Love Is Reality by Solitude Fellows This years Solitude summer feast's motto »Love Is Reality« became true when studios were opened, readings were held and performances happened under a clear summer sky. Cyanotype Maps Where the Trees Stood in Water by Bambitchell Using cartographic and textual archival fragments, this work by Bambitchell asks questions about settlement and displacement as the entangled remaking of bodies and space. Gallery Give Me Your Dirty Love with Solitude fellows 1990–2015 Solitude fellows have left many traces in the house over the years, on the walls, in the corners, in their studios. Some of them have now been collected in this gallery. Self Portraits Pictures of Me in Different Places by Jorge Orozco Gonzalez In 2007, artist and architect Jorge Orozco Gonzalez started to draw portraits of himself in various places all over the world ... Studio Solitude Their Own Devices by Vladimir Miller Merging and mixing: with his installation, artist Vladimir Miller is questioning the architecture's task to control the flow of fluids. Part II The Hirschgang with Solitude fellows 1990–2015 We show how Solitude’s exhibition space, the Hirschgang, has changed over the last 25 years with the art works by the many Solitude fellows. Film Tokyo Will Occur Someday by Florian Goldmann According to scientists a fatal earthquake is likely to happen in Tokyo in the near future. Artist Florian Goldmann did research on the subject. Film Fictitious Force by Philip Widmann »Fictitious Force,« a film by artist Philip Widmann, investigates the visible and invisible borders of sharing the same moment. Rare Earth Deep Sea Displays by Lisa Rave From animism to today’s digital fetishism: the essay film »Europium« tells a different story of the fluorescent rare earth used in smartphone displays. In Transit The Hirschgang with Solitude fellows 1990–2015 We show how Solitude’s famous exhibition space Hirschgang has changed over the last 25 years with the many artists living and working in the house."
year_published = 2025
