title = "Forty Days | Akademie Schloss Solitude: Schlosspost"
full_description = "Imran Ali Khan Forty Days Forty days of abstaining. Forty days of filling it to the brim. Forty days of remembering the past. Forty days for letting it go. Forty days between presence and absence. Forty days to challenge and defeat. Forty days of resisting. Forty days of persisting. Forty days of crossing over into absence. Forty days of walking until the words become clear. Forty days of rain. Forty days of dry. Forty days of waiting. Forty men who hide. Forty to protect you from corrosion. Forty days to spy. Forty and they change the topic. Forty ways of saying the same thing. Forty ways of solitude. Forty Days. Forty days#18 Twenty Three Days of a Brief Moment by Imran Ali Khan — Dec 04, 2017 / 11:22 Forty Days#17 Twenty Four Days of Changing Phases by Imran Ali Khan — Nov 23, 2017 / 15:06 Forty Days#16 Twenty Five Days of Myth Making by Imran Ali Khan — Nov 23, 2017 / 15:02 Forty Days#15 Twenty Six Days of First Times by Imran Ali Khan — Nov 18, 2017 / 07:38 Forty Days#14 Twenty Seven Days of Till You Drop by Imran Ali Khan — Nov 13, 2017 / 16:40 Forty Days #13 Twenty Eight Days of the Odd One Out by Imran Ali Khan — Nov 09, 2017 / 15:41 Forty Days #12 Twenty Nine Days of Music by Imran Ali Khan — Nov 08, 2017 / 15:36 Forty Days#11 Thirty Days of Pleasant Darkness by Imran Ali Khan — Nov 07, 2017 / 16:47 Forty Days #10 Thirty One Days of the Unseen by Imran Ali Khan — Nov 05, 2017 / 13:14 Forty Days #9 Thirty Two Days of Not Enough by Imran Ali Khan — Nov 04, 2017 / 11:40 Forty Days #8 Thirty Three Days of a Belly Full by Imran Ali Khan — Nov 03, 2017 / 11:35 Forty Days #7 Thirty Four Days of Possibility by Imran Ali Khan — Nov 02, 2017 / 10:55 Forty Days #6 Thirty Five Days of Laughter by Imran Ali Khan — Nov 02, 2017 / 10:51 Forty Days #5 Thirty Six Days of Vanishing by Imran Ali Khan — Nov 02, 2017 / 10:48 Forty Days #4 Thirty Seven Days of Picking by Imran Ali Khan — Nov 02, 2017 / 10:46 Forty Days #3 Thirty Eight Days of Conversation by Imran Ali Khan — Nov 02, 2017 / 10:43 Forty Days #2 Thirty Nine Days of the Apple I Did not Eat by Imran Ali Khan — Nov 02, 2017 / 10:39 Forty Days #1 Forty Days of Sunshine by Imran Ali Khan — Nov 02, 2017 / 10:35 Share 0 Tweet E-mail"
