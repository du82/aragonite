full_description = "Conversation with Sun Choi Drawing from Within – Drawing with Breath by Ana Mendes For Ana Mendes' blog »On Drawing«, she spoke with the South Korean artist Sun Choi, who takes an experimental approach to painting. Educated at the Hong-Ik University in Seoul, Choi questions the nature of art as well as the western canons imposed onto Korean art. Gallery Drawing History by Patrizia Bach An image gallery of drawings by artist Patrizia Bach on the selective perception of the past and the process of writing history. Reading One Soldier Eats One Sparrow by Tupac Cruz Following objects or events rather than a main character, the comic strips of artist and philosopher Tupac Cruz are loaded with accidental encounters and unforeseen everyday occurrences. Talk with Luis Lacerda (neuroscientist) Neuroplasticity: How the Brain Restructures Itself by Ana Mendes Drawing Art is Hard to Educate by Matthias Reinhold Art teacher Matthias Reinhold believes in self motivation, freedom, and individuality. Questioning skills can be a barrier and once this barrier is removed the flow can find its way."
