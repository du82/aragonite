title = "Blogs | Akademie Schloss Solitude: Schlosspost"
full_description = "Out of Frame#2 In Between by Pauline de Chalendar When paper becomes a three-dimensional space: In the second entry of »Out of Frame,« artist Pauline de Chalendar adresses spatial questions on the practice of drawing. Poster Campaign Show You Are Not Afraid »Show you are not afraid« is a series of interventions in the form of posters, documented by the artist and former fellow Mikael Mikael. The posters quote the former mayor of New York, Rudolph Giuliani. Performance Der Tag der Weißen Fahne von Jean-Baptiste Joly mit Johannes Cladders Johannes Cladders, Künstler, Kurator und Museumsleiter hisste als künstlerische Aktion am 18. Oktober 1988 erstmals eine weiße Fahne zum Zeichen des Friedens. Architecture Responsive Architectures by Gabi Schillig Multisensorial perceptions mingle between bodies, spaces and landscapes – meet Gabi Schillig and her refreshing perspective! Solitude Literature #6 Hidden Treasures with Paula Kohlmann Some of the Solituders selected their favorite book from the castle's libraries. Listen to and read what they chose and why. Performing Arts Fluxus and Beyond by Jean-Baptiste Joly In three days and three nights Ben Patterson and Emmett Williams transformed the Akademie in what it is now: A ship which sinking is never ending. – Jean-Baptiste Joly, 2016 Solitude Nights … And We Have Nights, More Beautiful Than Your Days! 1990–2015 At Schloss, in Schloss, under Schloss, and around – Solitude nights since 1990. The next will follow! Performing Arts The Word that Never Becomes Flesh by Hamed Taheri »Theater is the house of the word that never becomes flesh« – In 2010, Hamed Taheri staged »Femmina Balba« at Solitude as an attempt towards failure. Sauna Project Never Ready – Always Ready by umschichten This is about a container for trash, a heavy-weight object with an assumed potential and, in our eyes, very aesthetic proportions. Gallery Give Me Your Dirty Love with Solitude fellows 1990–2015 Solitude fellows have left many traces in the house over the years, on the walls, in the corners, in their studios. Some of them have now been collected in this gallery."
