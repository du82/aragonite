title = "Streaming | Akademie Schloss Solitude: Schlosspost"
full_description = "Video stream/Reading American Valentines by Hannah Star Rogers No paradise without a snake. In her forthcoming poetry book American Valentines, Hannah Star Rogers asks what you and your country do for each other. In this video, Rogers reads a selection of her poetry. Audio stream/Reading »Der ferkelfarbene Himmel über Osteuropa (The piglet-colored sky over Eastern Europe) by Ilka Papp-Zakor Sooner or later, the mother becomes a brick-colored locomotive, an abandoned pregnant girl gives birth to nine double begonias, the grandmother is home to all kinds of animals and knocking lemurs help pensioners with malicious telephone pranks. Audio stream/Reading Nebensächlich, Nomade – Ungewiss übertragene Gedichte (Secondary, nomad – fleetingly transferred poems) by Regina Dürig and Savyon »I have translated Savyon’s poems from Hebrew into German as a bird ›which does not hear what we hear, and hears what we do not hear‹ – head inclined, bones full of air – because I can neither read the letters nor divine their meaning. Video stream from May 20 – June 10, 2020 An Empirical Queer Theory by Padraig Robinson Christina Myers Hepburn, a Los Angeles-based practitioner of touch therapy is in the limelight of Padraig Robinson’s film An Empirical Queer Theory (2019). The work discusses touch and physical tenderness as basic human needs, and at the same time challenges normative rules of society. Video stream/Reading Very Compact Theory on Longing by Vinicius Jatobá In Very Compact Theory on Longing, Vinicius Jatobá describes the pain of having lost something – or someone – loved that can never be retrieved. He performs a reading of his text, exploring the geography of feelings encompassed by the Portuguese term »saudade.« Video stream from May 06 – May 20, 2020 Ode to Seekers 2012 by Andrew Norman Wilson »Ode to Seekers 2012« is a looped video that celebrates mosquitoes, syringes, and oil derricks—symbols of some of the most significant threats to human life—mosquito borne illnesses, drug addiction, and the petroleum industry."
year_published = 2010
