["https://schloss-post.com/category/economyeconomics"]
title = "Economy/Economics | Akademie Schloss Solitude: Schlosspost"
full_description = "Loading GIF #1 Introduction On the Imaginary of International Taxation by Antoine Robin This blog aims to stimulate the imaginary of international taxation and welcomes any constructive comments or useful illustration. Essay Our Gourds First by Leone Contini Anthropologist Leone Contini recounts not only a one-sided history of Chinese farmer migrants in Tuscany, instead he reveals a poetic perspective on today’s Tuscan-Chinese landscape. Performing Arts Kafkamachine by Ana Fradique The artist Ana Fradique assembled »KAFKAMACHINE Device 1.0,« is an audiovisual interface that presents the unworking of what would be the direction, production and showcase of a film made by Kafka. Glossary Finance and Affection by Elisa Band, Cássio Diniz Santiago, Karolina Kucia & Akseli Virtanen In this glossary Elisa Band, Cássio Diniz Santiago, Karolina Kucia & Akseli Virtanen pursue the links between economy and performing arts. Interview The Art of »WimmelResearch« with Sophie-Charlotte Thieroff & Birgit Thoben How do you develop a space of conceptual freedom within a company with a 130-year old tradition? An interview about Platform 12 Feature The World Bank System by Elisabeth Weydt et. al For the multimedia report by NRD, WDR, and Süddeutsche Zeitung on the world bank, Elisabeth Weydt did investigative research for ten months in an international team of 50 journalists. Chronicles of Work Precarious Forms of Work by Maurizio Lazzarato Philosopher Maurizio Lazzarato on the atypical and precarious forms of the work of freelance artists. Economy Power at the End of the Economy with Maurizio Lazzarato, Akseli Virtanen et al. A discussion with Maurizio Lazzarato, Brian Massumi, Peter Pál Pelbart, and Akseli Virtanen about power at the end of economy. Chronicles of Work The Work of Robin Hood by Marcell Mars & Akseli Virtanen A talk about the counter-investment cooperative »Robin Hood,« presented within the framework of Akademie’s research topic »Chronicles of Work.« Photography The Changing Face of Europe by Damaso Reyes »When I began I was certain that the EU had a strong future. Today, like many others, I am far less certain.« Damaso Reyes in an interview about his project »The Europeans.«"
