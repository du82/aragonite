["http://schloss-post.com/category/future-relics-catalogue-1"]
title = "Future Relics: Catalogue #1 | Akademie Schloss Solitude: Schlosspost"
full_description = "Web Residency Call No. 3 Future Relics: Catalogue #1 Project Page by Polly Gregson »Future Relics: Catalogue#1« is the web residency project by writer and artist Polly Gregson who was selected for the third »Schlosspost Web Residencies«, curated by Apparatus 22 on the topic »SUPRAINFINIT: L’Avenir redux«. During November 2016, Polly Gregson compiled a catalogued collection, consisting of fabricated primary and secondary sources from alternative futures, strung together with the narrative presence of an archivist suspended somewhere in SUPRAINFINIT. The futures presented draw on current plausibilities, from climate change to mass genocide, disease to technological dictatorship, and exist alongside contemporary projections and statistics. Read an interview with the artist. Bad Guesses tabula repletus of which deaths permadrone -cracy Comfortable Neutrality [1 new message] Salerus Slow Buzzing Active Autocorrect beyond credit radical pronouns Ghrelin newer news Patient J flattening Empathizer™ Immortal Succulent break away Posthumous vitrification Bunker Syndrome Trim Putii T-Cell 242 Stuun Mung Beans 1 2 → Load More Share 0 Tweet E-mail"
