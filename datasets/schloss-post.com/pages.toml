["https://schloss-post.com/category/issues/rethinking-affordance"]
title = "Rethinking Affordance | Akademie Schloss Solitude: Schlosspost"
full_description = "On objects Questions of Affordance by Douglas Rogerson How do we search for the potential meanings of affordance? A collection of thoughts on affordance’s definition by Douglas Rogerson Essay On Techno-Industrial Artist Residencies by Ashley Scarlett Artists have always played a key role in the realization and critical negotiation of new technological affordances. How has this process taken shape within artist residency contexts? Speculative genealogy On Rotating Divinatory Hexagrams by Jol Thomson A fragmentary time travel around the globe to the origins and counterorigins of the digital. A critical inquiry An Introduction by Martin Zeilinger & Ashley Scarlett A brief introduction to J.J. Gibson’s initial theorization of affordance, its importance and why it still needs to be rethought in relation to the algorithmic. Art & blockchain Cryptoeconomics & Artistic Practice by Laura Lotti What can art do for blockchain to begin unveiling such facts that decentralized software architectures as blockchain do not necessarily decentralize power? Video Ways Of Sitting WIP by foci + loci Aesthetic objects like Marcel Duchamp's readymades deny any affordance that was usually associated with the object. Through the development of interactive, virtual objects this denial is challenged and transformed. Research _Whitepaper by FRAUD The art-research duo FRAUD examines the genealogy and affordance of the white paper, regarding the ideology of financial self-determination, by performing its scripted erasure."
year_published = 2025
