["https://schloss-post.com/category/humanities"]
title = "Humanities & Social Sciences | Akademie Schloss Solitude: Schlosspost"
full_description = "Commentary Black Knowledge Traditions – The Blank Space That Does Not Exist by Yeama Bangali »Now is the time to make black knowledge traditions more visible than ever. To anchor them in Germany's cultural memory, so we can set the course for coming closer to an anti-racist society,« says Yaema Bangali. Collaborative work Lighthouse Journal by Hannah Rogers and Steffany Suze Boucher Hannah‌ ‌Star‌ ‌Rogers‌ ‌and‌ ‌Steffany‌ ‌Suze‌ ‌Boucher’s‌ ‌poetic‌ ‌sculpture‌ ‌collaboration‌ ‌ constructs‌ ‌a‌ ‌hybrid‌ ‌aquasphere‌ ‌in‌ ‌digital‌ ‌form.‌ ‌ ‌ Introduction Bodies of Evidence by Gurur Ertem & Sandra Noeth An introduction to the publication Bodies of Evidence takes up the challenge to rethink corporeality today and underscore the intertwinement of aesthetics, politics, and ethics. Studio Visit Sensing Landscape with Saadia Mirza & Caitlin Berrigan »To make a map is to give order to the world.« Saadia Mirza links visualizations of landscapes derived by data with the old human obsession to measure the world. Sociological Studies How Do We Relate to Our Past? by Froso Papadimitriou In her sociological studies, artist Froso Papadimitriou discusses the relation between tradition and cultural identity theory. Critical Essay Naughty Legacy by Bojan Krištofić Bojan Krištofić reenvisions the monuments of ex-Yugoslavia’s National Liberation Movement, bringing them into dialogue with contemporary art in Croatia. Essay How Not to Tell a Story by Imran Ali Khan Mumbai-based writer/researcher Imran Ali Khan on how the multiple meanings of the Ramayana, a story told in oral tradition, were reduced to only one truth – by politics. Studio Solitude When the Gods Come to the Valley with Imran Ali Khan The stories that Indian researcher and artist Imran Ali Khan’s family told when he was young inspired him to later investigate oral traditions and ritual performances. Logging Solitude Project Logging Solitude by Deniz Johns and Martin Zeilinger In »Logging Solitude,« a hybrid-form project, Deniz Johns and Martin Zeilinger approach the castle’s lost Baroque garden architecture in a speculative rediscovery."
