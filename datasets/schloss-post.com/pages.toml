full_description = "Web Residencies by Solitude & ZKM A Calamitous Node in a Planetary Chain Interview with Bassem Saad The project »All Cared for by Chains and Loops« by web resident Bassem Saad elaborates on the interrelation of Beirut’s garbage crisis and economies of waste and care. Web Residencies by Solitude & ZKM The Future is a Cockroach Interview with Natasha Tontey Can we imagine a future in which humans won’t be the center anymore, but cockroaches play a major role in the ecosystem? This is exactly what the sci-fi-related project From Pest to Power proposes. Web Residencies by Solitude & ZKM The Dinner Table: Reconstructing Mukbang Interview with Jennifer Katanyoutanant In a world where people are lonelier than ever, Jennifer Katanyoutanant builds a website for the millions of mukbang fans to have online dinners with one another. Web Residencies by Solitude & ZKM Body Shifts in a Techno-Anthropocentric World Interview with Miriam Simun What if the cephalopod served as a model species for humans? Miriam Simun explores how we overcome using high technology for human enhancement by training the body. Web Residencies by Solitude & ZKM Bioplastics Cookbook for Ritual Healing Interview with Tiare Ribeaux Tiare Ribeaux fabricates an alternative present/near future – creating bioplastics, sharing those recipes, for creating speculative environments, and healing the earth. Loading GIF Web Residencies by Solitude & ZKM Undoing the Trap of The Planetary Shift by Mary Maggic From bioplastic cookbooks to multispecies speculative fictions: five new web residencies by Solitude & ZKM have started, selected by curator Mary Maggic. Loading GIF Simulate/Adapt/Immerse (SAI) Santiago Tavera & Milton Riano / Montreal, Canada & Bogota, Colombia Trans*Plant : May the Chlorophyll be with /in you Kina Madno (part of Qumera Rosa collective) / nomadic (in this moment Morocco)"
