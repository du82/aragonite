title = "Anita’s Archive | Akademie Schloss Solitude: Schlosspost"
full_description = "Poster Campaign Show You Are Not Afraid Nov 09, 2016 / 14:24 »Show you are not afraid« Show you are not afraid is a series of interventions in the form of posters, documented by the artist Mikael Mikael through formally reduced photographs. The posters – black on white – quote the former mayor of New York, Rudolph Giuliani, who asked people to show that they are not afraid one day after the terrorist attacks of September 11th, 2001. »Show you’re not afraid. Go to Restaurants. Go shopping!« By omitting the invitation to consume, read more… Performance Der Tag der Weißen Fahne von Jean-Baptiste Joly mit Johannes Cladders — Oct 18, 2016 / 09:34 Am 18. Oktober 1988, während eines Gastaufenthaltes im Jerusalem Center for the Visual Arts, brachte Johannes Cladders eine weiße Fahne an die Außenmauer eines alten, ehrwürdigen Gebäudes an, das an der ehemaligen Demarkationslinie zwischen West- und Ostjerusalem stand. Bis auf die nüchterne Beschreibung des Gegenstands (Maße und Material) machte er keine weiteren Kommentare. Wie man es sich leicht vorstellen kann, fand diese Aktion wenig Verständnis bei der israelischen Polizei und die Fahne wurde kurz darauf entfernt. Für die dortige Bevölkerung read more… Architecture Responsive Architectures by Gabi Schillig — Aug 02, 2016 / 08:18 »The work begins to suggest clues of another architecture. A responsive architecture, where her body-work and the conditions of its folds suggest a real, tectonic field.« Sir Peter Cook, London – A comment on Gabi Schillig´s work, in: »Mediating Space«, merz&solitude, 2009 In her artistic practice and teaching, Gabi Schillig investigates contemporary and future questions of spatial design such as the relationship between space and body, the evolution of spatial systems, the potentials of materiality and the experimental use of read more… The Big Day and Beyond Wedding Piece by Jackie Sumell — Jul 15, 2016 / 13:58 Saying »Yes« at the Schloss every single weekend is a unique experience for a couple – and another few thousands more. The wedding machine is roaring."
year_published = 2015
