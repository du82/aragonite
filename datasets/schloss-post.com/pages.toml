["https://schloss-post.com/category/web-residents"]
title = "Web Residencies | Akademie Schloss Solitude: Schlosspost"
full_description = "Web Residencies by Solitude & ZKM The Battle Between the Drone and the Kite Interview with Ronnie Karfiol In our interview with the artist we talk about gamification as a means to represent violence and how the web residency project at first appears to be an orchestrated battlefield, but actually is an invitation is to take a critical look at this »maker« battlefield. Web Residencies by Solitude & ZKM An Investigation on the Representation of Violence, Necropolitics, Gore Capitalism and Drug Trafficking Culture in Mexico Interview with Leonardo Aranda In our interview with the artist we talk about the relationship between technology, theory and art in addressing the aesthetic, ethical, and political values of image circulation of violence in our consumer media. Web Residencies by Solitude & ZKM An Act of Resistance in Times of Security Systems, Information Manipulation and Control Interview with Miyö van Stenis How can art be used as a practical response and political statement from the exile? In the interview we talked with the artist about her Web Residency project »Vigipirate Quadcopter Drone« created for the Solitude & ZKM web residencies on the topic »Violent Consumer Media« curated by Dani Ploeger. Web Residencies by Solitude & ZKM The Paradox of the Information Age Interview with Kosta Tonev The artist Kosta Tonev deals with the role of media technologies in the representation of reality and the contradictions of modern consumer technologies. In our interview with the artist we talked about his work and the paradox of the information age. Web Residencies by Solitude & ZKM TECHNO-SEX BOTS: Molecular Sex, Synthetic Love and Quantum Bodies Interview with Johanna Bruckner In the interview with Sandra Oehy, Johanna Bruckner talks about her project Molecular Sex & Synthetic Love. A project that aims at queering normative world views of intimate relations and individual-driven forms of care. Open Call Web Residencies by Solitude & ZKM Violent Consumer Media Curated by Dani Ploeger Examining the relationship between violent behavior and exposure to violent media, the latest call for the Web Residencies by Solitude & ZKM invites projects that address ‘subjective violence’."
