["https://schloss-post.com/category/issues/authorship"]
title = "Authorship | Akademie Schloss Solitude: Schlosspost"
full_description = "Copyright Perspectives on »Free Libraries« by Dennis Yi Tenen American researcher Dennis Yi Tenen gives insight into different perspectives on »free libraries« reporting his personal experiences from the »Custodians.online« discussion. Google Trapped in the Presence by Andrew Norman Wilson Yellow-badged scanner workers, questions on copyright, and Google »anomalies«: An interview with the artist A. N. Wilson on the lecture collage »Movement Materials and What We Can Do« Copyright Death and Survival of Dead Labor by Tomislav Medak The nexus author–work–copyright has transformed in fundamental ways – but opposite to what the recurrent claims of the death of the author have suggested. Lecture Témoin Considérable by Tomislav Medak Tomislav Medak, témoin considérable himself, responds from his own perspective to Hans Blumenberg’s question: »What was it that we from the outset wanted to know?« Lecture Performance Story on Copy: Jelena Vesić, Lecture Performance by Vladimir Jerić Vlidi & Jelena Vesić »In historical perspective of art, copy is something completely senseless…« A sophisticated and humorous »Story on Copy« with Mondrian and Duchamp by curator Jelena Vesić Jurisprudence/Law Pattern Recognition by Martin Zeilinger With a background in digital culture and intellectual property law, Martin Zeilinger explores questions of »authorship« and »creating,« concerning algorithm-generated artworks. Performed Bodies When I Sign My Name by Elisa Band »What part of my body is mine when the last layer of my atoms is mixed with the atoms around?« – A search for the distinctive self in our repetition of gestures. Collective Performance Aboard the Kafkamachine by Cássio Diniz Santiago Three groups traced the movement of Kafka’s main character from »Amerika« by doing a boat trip and working on a collective performance. Status of Authorship Authorship by Elisa Band What happens when authorship gets caught in stormy weather? Elisa Band takes us on a journey through the heavy swell into a vortex of stories that sound somehow familiar."
