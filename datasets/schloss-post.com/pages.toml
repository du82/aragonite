["https://schloss-post.com/category/exact-sciences"]
title = "Exact Sciences | Akademie Schloss Solitude: Schlosspost"
full_description = "Jurisprudence/Law Pattern Recognition by Martin Zeilinger With a background in digital culture and intellectual property law, Martin Zeilinger explores questions of »authorship« and »creating,« concerning algorithm-generated artworks. Copyright Perspectives on »Free Libraries« by Dennis Yi Tenen American researcher Dennis Yi Tenen gives insight into different perspectives on »free libraries« reporting his personal experiences from the »Custodians.online« discussion. Google Trapped in the Presence by Andrew Norman Wilson Yellow-badged scanner workers, questions on copyright, and Google »anomalies«: An interview with the artist A. N. Wilson on the lecture collage »Movement Materials and What We Can Do« Cryptography Automatic Merge Failed by Femke Snelting »Automatic Merge Failed« is a close reading of the way »difference« is encoded into software, and insists on its centripetal potential. Dreams & Dreaming Dreams About Data with Robert Ochshorn »Beware of anyone claiming an artificial intelligence by jumbling our memories into their models, for they may be trying to steal our dreams.« Artist Robert Ochshorn in conversation Economy Power at the End of the Economy with Maurizio Lazzarato, Akseli Virtanen et al. A discussion with Maurizio Lazzarato, Brian Massumi, Peter Pál Pelbart, and Akseli Virtanen about power at the end of economy. Art & Science Art And Mathematics Today by Martin Beck An artist, two philosophers, and a mathematician answer ahead of the symposium Calculation and Aesthetics. Chronicles of Work Obscene Structure? by Bill Dietz and Gavin Steingo Music may, undoubtedly, awaken feelings of great joy or intense sorrow; but… Fanzine Technologie und das Unheimliche – Enigma with Mário Z. Nemes Enigma as a discursive object is capable of opening up our imagination to a new field where the irrational, the paranormal, and the extraordinary are not colonized."
