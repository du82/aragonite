description = "Schlosspost is an open platform for the Solitude network and those who would like to be part of it."
full_description = "New Website Online Find out More About the Latest Web Residency Call, the New Solitude Journal, and Our Solitude Blog READ MORE New Website Online Find out More About the Latest Web Residency Call, the New Solitude Journal, and Our Solitude Blog READ MORE New Website Online Find out More About the Latest Web Residency Call, the New Solitude Journal, and Our Solitude Blog READ MORE New Website Online Find out More About the Latest Web Residency Call, the New Solitude Journal, and Our Solitude Blog READ MORE From 2015–2020 Schlosspost has become a dynamic transdisciplinary online platform for artistic research. It addressed current issues in art, culture, society, and the digital world, and provided insights into the practices of international artists and scientists. It allowed visibility to Solitude’s network of alumni, friends, and experts in more than 120 countries, promoting new political voices and collective discourses in an open and sustainable space. By exploring new forms of art publishing and writing, Schlosspost combined critical and serious – but also playful – attitudes and ways of thinking. Schlosspost remains an open archive to a multidimensional world, as well as transversal forms of knowledge and alternative futures. We would like to take this opportunity and thank everyone involved in this project. Since September you can find the Web Residencies, the Solitude Journal, and the Solitude Blog on our new website. Archive Loading GIF Web Residencies Issue No 9 Membrane Design by Beton, Vienna/Salzburg Permeable Thinking in African/-diasporic Literatures and Art Issue No 8 Soft Power [...] The Role of Independent Art Spaces for the Future of Cultural Exchange Issue No 7 Gemini The Journal Issue No 6 Rethinking Affordance Creative and Critical Explorations of Emerging Technologies Issue No 5 Histories – An Everyday Practice Examinations into the Relation of Historical Knowledge and Everyday Life Issue No 4 Biographies & Space The Produc