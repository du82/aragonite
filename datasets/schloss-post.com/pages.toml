title = "Artfail | Akademie Schloss Solitude: Schlosspost"
full_description = "Artfail No Goal No Mistake by Elisabeth Weydt with Sebastian Däschle — Nov 04, 2016 / 11:45 Dieses Mal bei Artfail: Sebastian Däschle, Designer in Berlin Cucula, das aktuellste Projekt von Designer Sebastian Däschle, beruht auf einem Denkfehler. In einem Workshop wollte er mit Flüchtlingen Möbel für Flüchtlinge bauen. Die klärten ihn auf: Wer nicht weiß, wo er in zwei Wochen oder Monaten ist, kann mit Möbeln herzlich wenig anfangen. Also wurde eine kleine Schreinerei draus. Sie bauen nun Möbel für andere. Jetzt hat Sebastian eine neue Idee: Er will die Welt retten. Der Podcast zum hören und downloaden: https://soundcloud.com/user-960467733/artfail-3-in-german-with-sebastian-daschle-no-goal-no-mistake English version read more… Artfail #2 »What can a mistake do?« With Project Master Jean-Baptiste Joly by Elisabeth Weydt — Jun 30, 2016 / 10:23 Jean Baptiste Joly ist der Herr über viele Projekte. Hunderte von Stipendiaten hat er in den vergangenen Jahren beobachtet und selbst viele Projekte umgesetzt. So hat er schon viele Fehler und unfertige Ideen mitbekommen. Aber er sagt, es komme auf den Rahmen an. Die Kunst verzeihe und ermögliche mehr als beispielsweise die Wirtschaft. So kann aus einem Fehler anderes werden. Er selbst ärgert sich vor allem über eine Sache bei Fehlern. Was das ist, verrät er im Podcast. In der read more… Artfail #1 Into the Vast Ice by Elisabeth Weydt with Magali Daniaux and Cédric Pigot — May 20, 2016 / 09:32 Magali and Cédric planned something big. For 365 days straight, they wanted to continuously film the ice melting. They worked on the preparation for an entire year only to later find out that climate change was too pessimistic for the sponsors of the project. So they searched for positive aspects of global warming. Another project almost failed because of suicidal thoughts and was then broken off due vanity. They are always working on something and some part of it is read more…"
