["https://schloss-post.com/category/issues/biographies-space"]
title = "Biographies & Space | Akademie Schloss Solitude: Schlosspost"
full_description = "Cyanotype Maps Where the Trees Stood in Water by Bambitchell Using cartographic and textual archival fragments, this work by Bambitchell asks questions about settlement and displacement as the entangled remaking of bodies and space. Film Boat by Xinjun Zhang In the short film »Boat,« Beijing-based artist Xinjun Zhang documented his experiment to make the social disparities in the population of Beijing visible. An Exploration Enter the Thick Space by CENTRALA & monnik »For too long, space has only been defined by its limits. It is time that we also define space by its content.« A project by the artist collective CENTRALA and monnik Two Poems Saving by Alice Miller & Fotini Lazaridou-Hatzigoga Poetry meets photography: An encounter that lets new stories emerge. By Alice Miller & Fotini Lazaridou-Hatzigoga Visual Arts Invisible Movement Spaces with Simone Rueß In her work, the German visual artist Simone Rueß investigates the structural dimensions of space as a product of human activity. Studio Solitude A Monument to Riots with Niloufar Tajeri and Gal Kirn Niloufar Tajeri and Gal Kirn examined the complex structure of sub/urban riots thinking about an alternative monument. Map Series The Colonial Machine by Ana Mendes From Samoa to Namibia, the Falklands to Jamaica or Australia, part experiment, part musical composition, »Map Series« asks the question: What is an empire today? Studio Berlin The Last Traces – Studio Visit with Astrid Schult We visited the documentary filmmaker Astrid Schult in her studio in Berlin. Her first fictional movie is currently in the making, dealing with the Third Reich and the question of culpability. Dialogue Multidimensional Pleasures with Philip Widmann & Philip Cartelli Film maker P. Widmann & critic P. Cartelli in a talk on the film »Szenario,« which develops around a briefcase with personal documents of an affair in 1970s West Germany. Self Portraits Pictures of Me in Different Places by Jorge Orozco Gonzalez In 2007, artist and architect Jorge Orozco Gonzalez started to draw portraits of himself in various places all over the world ..."
