["https://schloss-post.com/category/performing-arts"]
title = "Performing Arts | Akademie Schloss Solitude: Schlosspost"
full_description = "Conversation Bulgaria Is Your Future Alexander Manuiloff in Conversation with Krzysztof Gutfrański Independent curator and editor, Krzysztof Gutfrański talks to Alexander Manuiloff, dramaturge, writer, and founder of Radar Sofia – a contemporary writing platform and residency programme in the heart of Sofia. Conversation New Connections with Æther Voin de Voin in Conversation with Sebastian Schneider Æther is an independent art space located in the center of Sofia, Bulgaria. It was founded in 2016 by the artist Voin de Voin. Since then, Æther organized numerous solo and group shows presenting the work of international artists, scientists, and activists. A hotbed for critically engaged artistic and curatorial practices, Æther conceives the exhibition space an experimental platform. Studio Visit On Landscape, Cycles and Voice with Janneke van der Putten A series of conversations with artist Janneke van der Putten about her fascination for voice, textile and nature. Homemade podcast Eddy & Iggy Depressive Podcast by Edith Lázár and Igor Koruga This homemade amateurish podcast is designed for Schlosspost as a collaboration between choreographer Igor Koruga and art theorist Edith Lázár. This podcast is not depressive – it is about depression. Travelogue It was the end of the world, but bodies kept dancing. by Edith Lázár Lázár depicts traces of the 2000s fashion rave scene and senses a scenography of a dystopian world, while the performance reveals a potentiality of »queering« the body, a way of thinking sideways by unraveling pleasure and desires. Questionnaire Igor Koruga by Schlosspost Igor Koruga is a choreographer and artist from Belgrade. Educated institutionally and noninstitutionally, who as an author and choreographer, a dance dramaturg, a performer, a pedagogue, a researcher, and as a cultural worker – fighting actively for better conditions and visibility of contemporary dance practices in Serbia. Introduction Bodies of Evidence by Gurur Ertem & Sandra Noeth An introduction to the publication Bodies of Evidence takes up the challenge to rethink corporeality today and underscore the intertwinement of aesthetics, politics, and ethics."
