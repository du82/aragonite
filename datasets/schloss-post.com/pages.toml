title = "Re-entering the Ultimate Display | Akademie Schloss Solitude: Schlosspost"
full_description = "Software Etc., I Was a Teenage Cyber Flâneur John Brumley, Tsukuba/Japan & Alex Rickett, Los Angeles/USA In Data Shop, it is the Viewer who will Fill the Role of the Sale and Purchase of Personal Data Varvara & Mar, Estonia Re-entering the Ultimate Display Curated by Mario Doulis For the second call for Schlosspost Web Residencies in April/May 2016, the curator and juror Mario Doulis invited (digital) artists and scientists to revisit cyberspace and share their virtual reality wonderlands, dream sculptures, and marketplaces for lost memories. The call welcomed all kinds of VR projects dealing with the topic »Re-entering the Ultimate Display« to participate. 65 applicants from everywhere from Argentina to Estonia took part in the call. Three web residents were chosen from a shortlist of 16 teams and people. Web Residents Back to De Stijl: A Return to Modernist Cinema Jeremy Rotsztain, Portland, Oregon/USA *The Show & the Show* Brud, Warsaw/Poland Old Galleries Are Boring, New Horizons on Internet Manuel Minch, Cuenca/Spain Shortlist Hôtel Drouot 360° Lukas Fuchsgruber, Berlin/Germany Software Etc., I Was a Teenage Cyber Flâneur John Brumley, Tsukuba/Japan & Alex Rickett, Los Angeles/USA Ghosts Florian Egermann, Cologne/Germany Dreaming in Giverny Maja Kalogera, Munich/Germany Electric Summer Days Aleksandra Jovanic, Belgrade/Serbia Rough Cut Timo Kahlen, Berlin/Germany Brain to Brain – Modulator Robert B. Lisek, Wroclaw/Poland Interactive and Poetic Digital Creatures Jason Nelson, Brisbane/Australia Simulated Heavens Adela Muntean & Vaczi Lilla, Romania/Hungary Aqua System Solitude Playground Matthias Reinhold, Stuttgart/Germany Getting Into Your Screens’ Space Peter Williams, Hong Kong & USA The Magnetism of the Images Martin Volman, Buenos Aires/Argentina In Data Shop, it is the Viewer who will Fill the Role of the Sale and Purchase of Personal Data Varvara & Mar, Estonia Share 0 Tweet E-mail"
