["https://schloss-post.com/category/issues/histories-an-everyday-practice"]
title = "Histories – An Everyday Practice | Akademie Schloss Solitude: Schlosspost"
full_description = "Critical Essay In a Hypermediatized World by Enos Nyamor, illustrated by Sophie-Charlotte Opitz Writing about cultural artifacts needs new strategies of interpretation in a media-saturated world, as Enos Nyamor outlines in his essay. Critical photo essay Justice Delayed is Justice Denied by Helena Schätzle & Sudharak Olwe A photo essay by Helena Schätzle and Sudharak Olwe outlines the everyday atrocities on Dalits in India, which are shaped by the historical prejudice of the caste. Essay Dressed in shifting fictions by Edith Lázár Edith Lázár reflects on interrelations of second-hand fashion practices, western and eastern economic systems, technocratic changes, and her life in Romania. Letter exchange Correspondence by Ricardo Portilho & Santana Dardot Contemplating their experiences, two individuals connect through a visual exchange – an affirmation and replica of their interactions with their everyday lives. Essay Surrendering to the Beat by Alice Sarmiento Alice Sarmiento’s article reveals the power of dance to resist the repressive methods of the war on drugs in the Philippines, within Manila’s poorest districts. Cross Media Collage In Between with Zoltán Lesi and Ricardo Portilho Zoltán Lesi and Ricardo Portilho on poetic experiments, intertwining time and people, intersexual athletes, and their new book publication In Frauenkleidung. Essay The Memory Mosaic by Sophie-Charlotte Opitz Looking at Susan Meiselas’s work »Kurdistan: In the Shadow of History,« Sophie-Charlotte Opitz explains how memory can »survive« by becoming a part of social life. Studio Visit / Video I Wanted to Photograph You Conversation with Aykan Safoğlu Aykan Safoğlu reveals an intimate view on his work ziyaret/visit, an encounter with personalities buried at a West Berlin cemetery, in an attempt to sensitively deal with loss and transgression. Critical Essay Naughty Legacy by Bojan Krištofić Bojan Krištofić reenvisions the monuments of ex-Yugoslavia’s National Liberation Movement, bringing them into dialogue with contemporary art in Croatia."
