full_description = "Introduction Preface by anorak Because identifying one thing means saying it is different from an other. A curatorial investigation and introduction to »Gemini – The Journal.« Exhibitions Gemini with Rosa Aiello, Tupac Cruz, Daniel Hopp, James N. Kienitz Wilkins, Julica Morlok, Ana Wild / Nancy Holt & Robert Smithson, Judith Kakon, Ben Rivers, Andrew Norman Wilson The familiar unfamiliar. Close Reading and Conversation Sincerely, James N. Kienitz Wilkins and Andrew Norman Wilson Does a multiplicity of perspectives imply multiple realities? In an intimate conversation, two filmmakers discuss subjectivity, sincerity and quantum physics. Reflection Faulty Logic by Douglas Rogerson Linking ambiguity and closure, intuition and deduction, artist Douglas Rogerson reveals the striking similarities and fuzzy paradoxes between premises and promises. Skype Conversation What About Loving And Not Feeling Right? by Shaka McGlotten and Alkisti Efthymiou What allows us to love and be loved in neoliberal societies, in which love feels paradoxically more private and at the same time more political than ever? Essay Rule 403 / Indefinite Postponement by Tom Rosenberg What happens when the judicial reconciliation of a homicide gets tangled up within its own intention of letting justice prevail? A filmmaker’s perspective. Fellows talk Need Proof? Poof! by Ana Wild & Johanna Markert Autobiography, archaeology and history are narrative structures that create a sense of belonging. In the lure of identification, empathy becomes a powerful tool. Reading One Soldier Eats One Sparrow by Tupac Cruz Following objects or events rather than a main character, the comic strips of artist and philosopher Tupac Cruz are loaded with accidental encounters and unforeseen everyday occurrences. Podcast Occasional Criticism by Mike Sperlinger and Madeleine Bernstorff A one-off podcast discussion between Mike Sperlinger and Madeleine Bernstorff – about his publication, her recordings and the strange contemporary fate of cinephilia."
