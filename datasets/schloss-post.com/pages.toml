["https://schloss-post.com/category/web-residents/suprainfinit-lavenir-redux"]
title = "SUPRAINFINIT: L'Avenir Redux | Akademie Schloss Solitude: Schlosspost"
full_description = "SUPRAINFINIT: L'Avenir redux Schlosspost Web Residents #3 with Apparatus 22 The web residents for the third call on the topic »SUPRAINFINIT: L'Avenir redux« are selected! Read a statement by the jurors and curators of the call Apparatus 22. Beyond this World: Refugee Camps as Digital Spaces Azahara Cerezo & Jose Iglesias G-Arenal, Madrid/Spain & London/England Open Call No.3 SUPRAINFINIT: L’Avenir Redux Curated by Apparatus 22 »Hope is the new oxygen!« For the third call for »Schlosspost Web Residencies« in September 2016, the curators and jurors Apparatus 22 invited all creatives to contribute to the expansion of the SUPRAINFINIT universe. The call welcomed ideas, fantasies, and manifestoes for rituals, dreams, exchanges, objects, energies, knowledge and new words for »other futures.« 117 applicants from around the world took part in the call. This time, four web residents instead of three were chosen from a shortlist of 13 proposals. Read a note by the Schlosspost editor on the future of web residencies. SUPRAINFINIT: L'Avenir redux Schlosspost Web Residents #3 with Apparatus 22 The web residents for the third call on the topic »SUPRAINFINIT: L'Avenir redux« are selected! Read a statement by the jurors and curators of the call Apparatus 22. Loading GIF Lazy Spider Ersi Varveri, Antwerp/Belgium The Vortex-Faced Being Speaks Haseeb Ahmed, Belgium/USA Promised Interfaces / Loading Utopias Henrik Nieratschker, Portland, Oregon/USA Beyond this World: Refugee Camps as Digital Spaces Azahara Cerezo & Jose Iglesias G-Arenal, Madrid/Spain & London/England GGGRU_RAWR [Reconfigurable Asynchronous Web Robot] Robert B. Lisek, Wroclaw/Poland See Attachment Megan Snowe, New York/USA Spin the Gold Disk Nancy Nowacek, Brooklyn, NY/USA Quasi-Monte Carlo Paul Simon Richards, London/England Localearth.Online Raphaël Bastide, Paris/France Future Relics: Catalogue #1 Polly Gregson, Cornwall/UK Share 0 Tweet E-mail The web residents for the third call on the topic »S