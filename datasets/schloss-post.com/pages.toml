title = "Visual Arts | Akademie Schloss Solitude: Schlosspost"
full_description = "Video stream from May 20 – June 10, 2020 An Empirical Queer Theory by Padraig Robinson Christina Myers Hepburn, a Los Angeles-based practitioner of touch therapy is in the limelight of Padraig Robinson’s film An Empirical Queer Theory (2019). The work discusses touch and physical tenderness as basic human needs, and at the same time challenges normative rules of society. Conversation New Connections with Æther Voin de Voin in Conversation with Sebastian Schneider Æther is an independent art space located in the center of Sofia, Bulgaria. It was founded in 2016 by the artist Voin de Voin. Since then, Æther organized numerous solo and group shows presenting the work of international artists, scientists, and activists. A hotbed for critically engaged artistic and curatorial practices, Æther conceives the exhibition space an experimental platform. Video stream from May 06 – May 20, 2020 Ode to Seekers 2012 by Andrew Norman Wilson »Ode to Seekers 2012« is a looped video that celebrates mosquitoes, syringes, and oil derricks—symbols of some of the most significant threats to human life—mosquito borne illnesses, drug addiction, and the petroleum industry. Collaborative work Lighthouse Journal by Hannah Rogers and Steffany Suze Boucher Hannah‌ ‌Star‌ ‌Rogers‌ ‌and‌ ‌Steffany‌ ‌Suze‌ ‌Boucher’s‌ ‌poetic‌ ‌sculpture‌ ‌collaboration‌ ‌ constructs‌ ‌a‌ ‌hybrid‌ ‌aquasphere‌ ‌in‌ ‌digital‌ ‌form.‌ ‌ ‌ Exhibition documentation Our Loves Are Not Only Human with Johanna Bruckner, Gary Zhexi Zhang & Agnes Cameron, Umber Majeed and Tiare Ribeaux The exhibition Our Loves Are Not Only Human shows artistic works in which the social and ethical dimensions of care between humans, non-humans, other species, and the world of things collide. Gallery Drawing History by Patrizia Bach An image gallery of drawings by artist Patrizia Bach on the selective perception of the past and the process of writing history."
