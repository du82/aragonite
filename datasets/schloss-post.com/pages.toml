["https://schloss-post.com/category/design"]
title = "Design | Akademie Schloss Solitude: Schlosspost"
full_description = "Studio Visit Conversing with »Strange Agents« with Ariel Bustamante by Rebecca Hanna John A multipart and multilocal conversation between Ariel Bustamante and Rebecca Hanna John about listening practices, intimate setting, and the Conversation Room. Travelogue It was the end of the world, but bodies kept dancing. by Edith Lázár Lázár depicts traces of the 2000s fashion rave scene and senses a scenography of a dystopian world, while the performance reveals a potentiality of »queering« the body, a way of thinking sideways by unraveling pleasure and desires. Book review A Kat in the Library by David Mathews A reflection on the two in-house libraries of the Akademie Schloss Solitude, and how they continue to grow. But more so, an effusive review by David Mathews about one of his all-time favorite comics: George Herriman’s Krazy Kat. Interview Creating Order and Rhythm by Dobromiła Błaszczyk with Edith Lázár In an interview with Dobromiła Błaszczyk for Contemporary Lynx, Edith Lázár shares her experience from her residency at Akademie Schloss Solitude. Travelogue An Archive That Speaks in the Fashionable Self by Edith Lázár The third installment in the series »Edith in den Fashion-Städten» recalls questions around fashion imageries and archives, and how they »shape and reshape collective visual memories, for they operate with representations of class, gender, race and the body.« Travelogue I See Through You, Yet I Cannot Have You by Edith Lázár The second part of the series Edith in den Fashion-Städten recounts a trip to the Helmut Lang archive in Vienna's Museum of Applied Arts and reviews the show Contradiction by Elfie Semotan at C/O Berlin. This time, both body of works serve as starting point for a discussion on eroticized gazes, and desire in fashion. Travelogue Mind the Frills and the Ruffles. No Ding! Not my Thing! by Edith Lázár The first part of the series »Edith in den Fashion-Städten« recounts a trip to the archive of Ulm's School of Design. The exhibition »Nicht mein Ding« serves as starting point for a discussion on how gender gets to be represented."
