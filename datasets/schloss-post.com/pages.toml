title = "Music/Sound | Akademie Schloss Solitude: Schlosspost"
full_description = "Studio Visit Conversing with »Strange Agents« with Ariel Bustamante by Rebecca Hanna John A multipart and multilocal conversation between Ariel Bustamante and Rebecca Hanna John about listening practices, intimate setting, and the Conversation Room. Studio Visit On Landscape, Cycles and Voice with Janneke van der Putten A series of conversations with artist Janneke van der Putten about her fascination for voice, textile and nature. Conversation Aloardi Exchange Programme with Christian Galarreta, Janneke van der Putten & Natalia Sorzano The Aloardi Exchange Programme invited Peruvian artists to present their work in the Schengen area. The program is a project by Aloardi, a collective from Lima active since 1998 and dedicated to experimental and electronic music, media art, acoustic research, and local cultures. Audio Mix Radio Concrete, Everyday Routine, Everyday Samples by Yuval Shenar and Hagai Izenberg For the following mix, musician and sound artist Yuval Shenar used field recordings he collected at Akademie Schloss Solitude and various places in Tel Aviv, as well as a recording of a Sunday preacher praying in front of a church in Ein Karem, Jerusalem. Studio Visit What is a Score? Interview with Robert Blatt An extensive look into the practice of artist and musician Robert Blatt, which is rooted in explorations of expanded sonic situations – functioning as an occurrence itself. Audio Piece The Wall by Butterland: Regina Dürig & Christian Müller A gloomy story and sound piece about the creation of borders as the renunciation of humanity. Sound and Image Archive Sounds of Solitude by Yuval Shenhar Tel Aviv-based musician and sound designer Yuval Shenhar recorded different soundscapes of daily life at Akademie Schloss Solitude. Listen to a collection of acoustic objets trouvés. Audiotext NEGRO (RSRJ RJRS) by María Salgado and Fran MM Cabeza de Vaca NEGRO (RSRJ RJRS) is an audiotext by María Salgado and Fran MM Cabeza de Vaca that is meant to be listened to with headphones and evolves around questions of body, gender and desire."
