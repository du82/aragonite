["https://schloss-post.com/category/artist-studio"]
title = "Take a look inside the artist studio | Schloss-Post"
description = "Take a look inside the artists studios and discover works-in-progress from current and former fellows in and outside of Solitude."
full_description = "Studio Visit Conversing with »Strange Agents« with Ariel Bustamante by Rebecca Hanna John A multipart and multilocal conversation between Ariel Bustamante and Rebecca Hanna John about listening practices, intimate setting, and the Conversation Room. Studio visit Archive Works with Patrizia Bach In the work of visual artist Patrizia Bach, Walter Benjamin’s thoughts on writing history lead to drawings that mediate past and present. Studio Visit On Landscape, Cycles and Voice with Janneke van der Putten A series of conversations with artist Janneke van der Putten about her fascination for voice, textile and nature. Studio Japan Bat Dreams with Mica Cabildo, Dr. Tadashi Kuramoto, and Prof. Franz Hintereder-Emde In this interview, resident Mica Cabildo of Akiyoshidai International Art Village explores the life and dreams of bats, and their interrelations with humans. Studio Visit The Power Structures of Built Reality Interview with Ana Filipovic How does the hyper-financialization of housing affect our homes and the cities we live in? An examination into built structures and cultural values of late-capitalist society. Studio Visit / Video I Wanted to Photograph You Conversation with Aykan Safoğlu Aykan Safoğlu reveals an intimate view on his work ziyaret/visit, an encounter with personalities buried at a West Berlin cemetery, in an attempt to sensitively deal with loss and transgression. Studio Visit What is a Score? Interview with Robert Blatt An extensive look into the practice of artist and musician Robert Blatt, which is rooted in explorations of expanded sonic situations – functioning as an occurrence itself. Studio Solitude Forget Dichotomies With Santi Ariestyowanti & Dyatmiko Lancur Bawono The Indonesian artist duo indieguerillas finds joy in making mistakes and in imperfection, which allows them to work in different fields, from design to fashion and art. Studio Visit Dance as a Trajectory Interview with Elena Morena Weber A look into the passionate choreographic work of Elena Morena Weber, which often unpacks questions of belonging and ancestry and concerns sensitive and emotional human states."
