["https://schloss-post.com/category/issues/soft-power"]
title = "Soft Power [...] | Akademie Schloss Solitude: Schlosspost"
full_description = "Editorial Soft Power by Schlosspost Contributions by artists, curators and citizens from around the world explore formats and methods of soft power apart from the common strategies of culture, politics, and economy. Interview Being Soft Is the New Power with Paula Kohlmann and Mareen Wrobel The Soft Power Palace festival stands for the need to strengthen European cultural exchange and methods of togetherness – between art, social practice, and activism. Nomadic art initiative Fly, Float, Glide by Fireplace: Ángela Palacios and Quim Packard Confronted with issues like rising rents, lack of regular funding, and the loss of an actual space, the artist initiative Fireplace finds hope in the adaptive nature of insects. Conversation Aloardi Exchange Programme with Christian Galarreta, Janneke van der Putten & Natalia Sorzano The Aloardi Exchange Programme invited Peruvian artists to present their work in the Schengen area. The program is a project by Aloardi, a collective from Lima active since 1998 and dedicated to experimental and electronic music, media art, acoustic research, and local cultures. Curatorial project New Poetics of Labor by New Poetics of Labor Featuring the project Al camello camello y al amor amor, which refers to unrecognized forms of labor, especially performed by women and artists who work out of passion and love. Interview Are We Independent? with GmbH: Weiny Fitui and Marco Trotta GmbH focuses on self-organized structures of independent cultural initiatives and the bureaucratic apparatus beyond it, highlighting complex processes. Fictional Review The Future is Lilac by die Blaue Distanz (Anna Erdmann & Franziska Goralski) A fictional review by Meta Cunt about the communal feminist space LILA-X-BASE, Los Angeles, yet to be founded, in the near future. Collaborative practices Keep The Conversation Going by Leon Filter Along with other artist fellows, Leon Filter developed three strategies of collaborating without becoming a collective, and exchanging thoughts without becoming a platform."
