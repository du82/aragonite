["https://schloss-post.com/category/issues/digital-art"]
title = "Digital Art in our Solitude Digital Salon | Schloss-Post"
description = "Explore the digital art works of our solitude fellows. Read about current digital topics, digital media projects and digital art works. Explore now!"
full_description = "Interview Landscapes of the Virtual World with Daria Jelonek by Ana Mendes Ana Mendes spoke with digital artist Daria Jelonek, who explores the connection between technology and nature. In her work, Jelonek investigates »how humans will live with the increasing amount of technology and the degradation of biophysical nature« and what nature actually is to us. Web Residencies by Solitude & ZKM / Juror's note HASH Award 2020 Future Failure : Failed Futures by Nishant Shah In this manifesto, Nishant Shah juror of the Hash Award 2020 emphasizes the web-residencies that ambitiously, provocatively, and radically responded to the calls. In dealing with the imminent failure of future and the future of our unfolding failure they were strongest when they asked for a system reboot in order to liberate ourselves. Web Residencies by Solitude and ZKM HASH Award for Net-Based Projects by Solitude & ZKM On February 21, 2020, the international production prize HASH for net-based projects in the field of art, technology, and design will be awarded for the second time at the ZKM | Center for Art and Media Karlsruhe. Web Residencies by Solitude & ZKM TECHNO-SEX BOTS: Molecular Sex, Synthetic Love and Quantum Bodies Interview with Johanna Bruckner In the interview with Sandra Oehy, Johanna Bruckner talks about her project Molecular Sex & Synthetic Love. A project that aims at queering normative world views of intimate relations and individual-driven forms of care. In-depth reading The Other Sculptor by Sahej Rahal Sahej Rahal’s works aim to construct new narratives – even new worlds. His latest work Juggernaut – a video game populated by AI-controlled objects – is an attempt to bring his Walker sculptures to life and experiment with the algorithms of the nonplayable characters. Web Residencies by Solitude & ZKM Demystify the Algorithmic Recommendation Interview with Sam Lavigne We spoke with Sam Lavigne about his proposal for »Rigged Systems« and why humor and language are important elements of his work."
