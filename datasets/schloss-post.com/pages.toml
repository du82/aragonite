["https://schloss-post.com/legal-notes"]
title = "Data Privacy | Akademie Schloss Solitude: Schlosspost"
full_description = "Data Privacy Mar 02, 2025 Für die Deutsche Version bitte runterscrollen: Data privacy declaration by the Akademie Schloss Solitude The protection of the personal data (hereinafter termed »data«) of website users is a matter of special concern to us. The information below provides details of the nature, extent and purpose of collecting, processing and deploying users’ personal data. Person-specific data constitutes all data which contains information about the personal or material circumstances of a specific or identifiable user. Such information includes, for example, name, e-mail address, residential address, date of birth and telephone number. Access data In the event of the purely informational use of the Akademie Schloss Solitude’s internet presence, only the access data transferred automatically by users’ internet browsers is collected to the extent that this is technically necessary (name of the file retrieved, date and time of retrieval, quantity of data transmitted, notification of successful retrieval, browser type and version, users’ operating systems, referrer URL (the previously visited site), IP address and the requesting provider). The Akademie Schloss Solitude is not able to ascribe this data to specific individuals, and the information is not merged with data from other Akademie Schloss Solitude sources. It is evaluated for statistical purposes, in order to optimize our internet presence and our range of services. The data is deleted after evaluation. Personal data Personal data is only collected, used and passed on by the Akademie Schloss Solitude in the event that this is legally permissible, or users agree to the data collection. When contact is made with us (e.g. via contact form or e-mail), user data is saved in order to process the request and in the event that subsequent queries arise. Blog-related comments When users leave comments on the website, their IP addresses are saved. This is carried out in the interests of our security, in the event that someone posts illegal comments (libelous insults, banned political propaganda, etc.). In this case, the Akademie Schloss Solitude may be sued as a result of the comment and thus has a vested interest in its author’s identity. However, the IP addresses of those leaving comments are deleted as soon as we have read the comments in question. This usually occurs within a few hours. Blog-related article subscription Your e-mail address will only be used in order to send the requested articles. You may unsubscribe from this service at any time. The IP address will be saved at the times of registration and confirmation, in order to verify the former in case of doubt. Integration of third-party services and content It may be the case that third-party content, such as YouTube videos, Google Maps material, RSS feeds or graphics from other websites are integrated within this internet presence. This always requires that the providers of said content (hereinafter referred to as “third-party providers”) log the users’ IP addresses because, if they fail to do so, they are unable to send the content to the respective users’ browsers. As a result, the IP address is required in order to display the content in question. The Akademie Schloss Solitude makes every effort to use only such content offered by providers who use IP addresses solely in order to deliver content. However, the Akademie Schloss Solitude is unable to prevent third-party providers from saving the IP addresses, for example for statistical purposes. The Akademie Schloss Solitude will inform users of this as far as it is aware of the same. Cookies Cookies are small files which enable device-specific information to be saved on users’ access devices (PC, smartphone, etc.). On the one hand, they promote the user-friendliness of websites and thus benefit users (e.g. as regards the automatic saving of login data). On the other, they help record statistic data regarding website use and permit its analysis for the purposes of improving the internet presence. Users can influence the use of cookies. The majority of browsers have the option to limit or completely prevent cookies from being stored. However, users are alerted to the fact that website use and, in particular, user convenience, are limited without cookies. Google Analytics This website uses Google Analytics, a web analysis service provided by Google Inc. (“Google”). Google Analytics also uses cookies, or text files, which are deposited and stored on website users’ computers and facilitate an analysis of their website use. The information generated by the cookie regarding the use of this website is usually transferred to a Google-operated server in the USA, where it is saved. In the event that IP-anonymization is activated on this website, your IP address will, however, be abbreviated by Google in advance within European Union member states or in other countries which are contracting parties to the Agreement on the European Economic Area. The full IP address will only be transferred to a Google server in the USA and abbreviated there in exceptional cases. Google will use this information on our behalf in order to evaluate your use of the website, to generate reports on the website activities and to provide other services in connection with use of the website and the internet for us as the website operator. The IP address transmitted by the website users’ browser within the framework of Google Analytics will not be merged with other Google data. Although it is possible to prevent cookies being saved by activating the corresponding browser software settings, the Akademie Schloss Solitude would like to draw your attention to the fact that users may be unable to use all website functions as a result. The Akademie Schloss Solitude alerts you to the fact that this website uses Google Analytics with the extension “anonymizeIp()”, and that IP addresses will therefore only be processed in an abbreviated form to prevent the direct identification of individuals. Furthermore, it is possible to prevent the collection of data generated by the cookie which is related to your website use (including your IP address) and its processing by Google by downloading and installing the browser plugin saved at the following link: http://tools.google.com/dlpage/gaoptout?hl=de/. Social plugins a) Facebook The Akademie Schloss Solitude uses social plugins from the social network facebook.com, which is operated by Facebook Inc., 1601 S. California Ave, Palo Alto, CA 94304, USA (“Facebook”). Plugins can be recognized as one of the Facebook logos (white “f” on a blue tile or a “thumbs up” symbol) or are indicated with the additional text “Facebook social plugin”. The complete list and description of the Facebook social plugins can be viewed here: https://developers.facebook.com/docs/plugins/. When users retrieve a web page within the Akademie Schloss Solitude internet presence which includes one of the plugins described above, their browsers create a direct connection with Facebook’s servers. Facebook transmits the plugin’s content directly to its browser, and from this to the web page. As a result, the Akademie Schloss Solitude has no influence over the extent of the data which Facebook collects with the aid of the plugin. Via the plugin’s integration, Facebook is informed that a user has retrieved the corresponding page of the internet presence. If the same user is logged into Facebook, the latter can correlate the visit with the user’s Facebook account. If users interact with the plugins, activating the “Like” button or posting a comment, for example, the relevant information is transferred by their browsers directly to Facebook, where it is saved. If users do not hold Facebook accounts, Facebook may still ascertain their IP addresses and store these. According to Facebook, only an anonymized IP address is stored within Germany. Users are invited to view Facebook’s data privacy policy in order to learn more about the purpose and extent of data collection, processing and the use of this data by Facebook as well as all the relevant rights and the settings available for the protection of their privacy. https://www.facebook.com/about/privacy/ If users who are Facebook account holders do not wish to have data collected about them by Facebook via our website and linked with the membership data stored by Facebook, they must log out of Facebook before visiting the Akademie Schloss Solitude’s internet presence. b) Twitter The Akademie Schloss Solitude uses buttons from Twitter services. These buttons are provided by Twitter Inc., 795 Folsom St., Suite 600, San Francisco, CA 94107, USA. They can be identified by terms such as “Twitter” or “Follow”, in conjunction with a stylized blue bird. The buttons enable users to share a post or page within the Akademie Schloss Solitude internet presence on Twitter or to follow the provider on Twitter. When users retrieve a web page within this internet presence which includes one of these buttons, their browsers create a direct connection with Twitter’s servers. Twitter transfers the content of the Twitter buttons directly to the users’ browsers. As a result, the provider is unable to influence the extent of the data which Twitter collects via this plugin, and informs users to the best of its knowledge. According to this, the users’ IP addresses are only transmitted within the context of the URL of the web page in question when the button is used, but not used for any other purposes apart from the button’s display. For further information, please consult Twitter’s data privacy policy at http://twitter.com/privacy. c) Instagram The Akademie Schloss Solitude uses so-called social plugins (“plugins”) from Instagram, which is operated by Instagram LLC., 1601 Willow Road, Menlo Park, CA 94025, USA (“Instagram”). The plugins are identified by an Instagram logo, which may, for example, take the form of an “Instagram camera”. An overview and a description of the various Instagram plugins can be found here: http://blog.instagram.com/post/36222022872/introducing-instagram-badges When users retrieve a web page within our internet presence which includes one of the plugins described above, their browsers create a direct connection with Instagram’s servers. Instagram transmits the plugin’s content directly to its browser, and from this to the web page. Via the plugin’s integration, Instagram is informed that the browser has retrieved the corresponding page of our internet presence, even if the users have no Instagram profiles or are not currently logged into Instagram. This information (including the users’ IP addresses) is transferred directly to an Instagram server in the USA by their browsers, where it is saved. In the event that users are logged into Instagram, the latter can correlate the visit to our website directly with the user’s Instagram account. If users interact with the plugins, activating the “Instagram” button, for example, the relevant information is also transferred directly to an Instagram server, where it is saved. The information is also published on the users’ Instagram accounts and displayed to their respective contacts. Users are invited to view Instagram’s data privacy policy in order to learn more about the purpose and extent of data collection, processing and the use of this data by Instagram as well as all the relevant rights and the settings available for the protection of their privacy. https://help.instagram.com/155833707900388/ If users who are Instagram account holders do not wish Instagram to assign data collected via our internet presence directly to their Instagram accounts, they must log out of Instagram before visiting our internet presence. It is also possible to prevent the Instagram plugin from loading at all via browser add-ons, e.g. via the script blocker “NoScript” (http://noscript.net/) d) WordPress The Akademie Schloss Solitude uses WordPress.com stats, a tool used in the statistical analysis of visitor accesses and operated by Automattic, Inc., 132 Hawthorne Street San Francisco, CA 94107, USA, using tracking technology developed by Quantcast Inc., 201 3rd St, Floor 2, San Francisco, CA 94103-3153, USA. WordPress.com stats uses so-called “cookies”, or text files, which are deposited and stored on users’ computers and facilitate an analysis of their website use. The information relating to the use of this internet presence generated by the cookie is stored on a server in the USA. The IP address is anonymized prior to being stored. Although users can prevent cookies being stored by activating the corresponding browser software settings, we would like to draw your attention to the fact that you may be unable to use all website functions as a result. Users can revoke their consent regarding the collection and use of data by Quantcast with effect for the future by inserting an opt-out cookie in their browsers through clicking on the following link: “Click here to opt out”: http://www.quantcast.com/opt-out. Disclosure According to the provisions of the Federal Inter Act (BDSG), all users of the Akademie Schloss Solitude’s internet presence are entitled to request particulars of the data stored by us concerning them at any time, and the purpose of this storage. Furthermore, users are entitled to demand the rectification or deletion of data in cases where its storage is found to be illegitimate or no longer required. The Akademie Schloss Solitude will provide information concerning stored data on written request. Further information The Akademie Schloss Solitude endeavors to take all possible technical and organizational steps to store its users’ personal data in such a way that it this not accessible by third parties. Its employees, and any contracted service providers, are bound by the Akademie Schloss Solitude to maintain confidentiality and to comply with the provisions of the Federal Data Protection Act (BDSG) and other professional data privacy regulations. ———————————————————————————————————————- Datenschutzerklärung der Akademie Schloss Solitude Der Schutz der personenbezogenen Daten (künftig: »Daten«) von Nutzern der Webseite ist uns ein wichtiges Anliegen. Nachfolgend informieren wir über die Erhebung und Speicherung von Daten, die Art der Daten und deren Zweckbestimmung. Personenbezogen sind alle Daten, die Angaben über persönliche oder sachliche Verhältnisse eines bestimmten oder bestimmbaren Nutzers enthalten. Dazu zählen beispielsweise der Name, die E-Mail-Adresse, die Wohnadresse, Geburtsdatum oder Telefonnummer. Erhebung und Speicherung personenbezogener Daten sowie Art und Zweck von deren Verwendung a) Beim Besuch der Webseite Beim Aufrufen unserer Webseite www.schloss-post.com werden durch den auf Ihrem Endgerät zum Einsatz kommenden Browser automatisch Informationen an den Server unserer Website gesendet. Diese Informationen werden temporär in einem sog. Logfile gespeichert. Folgende Informationen werde"
