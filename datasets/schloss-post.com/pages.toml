["https://schloss-post.com/category/web-based-media"]
title = "Web-based Media | Akademie Schloss Solitude: Schlosspost"
full_description = "Round Table Discussion Expose yourself! with Shirin Barghnavard, Christoph Dreher, and Vinicius Jatobá Iranian filmmaker Shirin Barghnavard talks about her relationship to censorship and creativity, documentary and fiction, and the art of filmmaking. Web Residencies by Solitude & ZKM HASH Award | Virtual Goes Real by Solitude & ZKM Software artist and web resident in 2017 Marloes de Valk receives net art prize HASH by Solitude & ZKM. Digital Labour I Will Say Whatever You Want… by Sebastian Schmieg Digital artist Sebastian Schmieg created a speculative Prezi on digital labor and the amalgamation of humans and software narrated by a cloud worker. Loading GIF Web Residencies No.3 Messier, Stickier, Gooier by Steph Kretowicz Web resident Megan Snowe wants to make her work »messier, stickier, and gooier.« But the New York-based artist’s practice is paradoxically very deep. Studio Solitude Physicality of Imaginary Surfaces with Adityan Melekalam What happens when nothing happens? An interview with Delhi-based artist and designer Adityan Melekalam, who was a fellow in the Digital Solitude Program in 2016. Loading GIF Digital Solitude Fellowship Evangelists for Online Culture with Clara Herrmann, Alessandro Mininno, & Bruce Sterling For the second time, Akademie Schloss Solitude has awarded fellows for the Digital Solitude program. Read a statement by author and journalist Bruce Sterling, who was part of this year’s jury. Web Residents #2 Born on the Internet with Manuel Minch How should you exhibit art in virtual reality? An interview with web resident Manuel Minch on his project »Internet Moon Gallery« – a moon based exhibition space for digital art Web Residents #2 The House of Shadow Silence with Jeremy Rotsztain In Jeremy Rotsztain’s virtual reality world, Frederik Kiesler’s ideal cinema from the ’20s comes to life again. An interview with the web artist Exhibition The Artist Is Online by Judith Engel The exhibition »The Artist Is Online« dealt with the commonplace and ubiquitous practice of self-presentation in the virtual world and it's influence on performance art."
