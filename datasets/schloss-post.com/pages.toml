["https://schloss-post.com/category/literature"]
title = "Literature | Akademie Schloss Solitude: Schlosspost"
full_description = "Video stream/Reading American Valentines by Hannah Star Rogers No paradise without a snake. In her forthcoming poetry book American Valentines, Hannah Star Rogers asks what you and your country do for each other. In this video, Rogers reads a selection of her poetry. Audio stream/Reading »Der ferkelfarbene Himmel über Osteuropa (The piglet-colored sky over Eastern Europe) by Ilka Papp-Zakor Sooner or later, the mother becomes a brick-colored locomotive, an abandoned pregnant girl gives birth to nine double begonias, the grandmother is home to all kinds of animals and knocking lemurs help pensioners with malicious telephone pranks. Commentary Black Knowledge Traditions – The Blank Space That Does Not Exist by Yeama Bangali »Now is the time to make black knowledge traditions more visible than ever. To anchor them in Germany's cultural memory, so we can set the course for coming closer to an anti-racist society,« says Yaema Bangali. Conversation Bulgaria Is Your Future Alexander Manuiloff in Conversation with Krzysztof Gutfrański Independent curator and editor, Krzysztof Gutfrański talks to Alexander Manuiloff, dramaturge, writer, and founder of Radar Sofia – a contemporary writing platform and residency programme in the heart of Sofia. Video stream/Reading Very Compact Theory on Longing by Vinicius Jatobá In Very Compact Theory on Longing, Vinicius Jatobá describes the pain of having lost something – or someone – loved that can never be retrieved. He performs a reading of his text, exploring the geography of feelings encompassed by the Portuguese term »saudade.« Poem/Reflection from the kitchen window i see the world by Giuliana Kiersz »I arrived in Germany the day they closed all the borders or at least the ones I needed to cross.« Giuliana Kiersz is one of the fellows who should have arrived at the Akademie Schloss Solitude in April. Due to the official Covid-19 restrictions she had to remain in a Berlin flat. In the poem from the kitchen window i see the world she now shares her daily observations. She could't imagine … what's reality now."
