title = "#theColder OLYMPIX* | Akademie Schloss Solitude: Schlosspost"
full_description = "#theColderOLYMPIX*#3 Distribute Posters, Submit Translations by Z. Blace and Bojan Krištofić — Mar 10, 2018 / 11:56 #theTeam2050 posters are now available in print ready resolution as .pdf/.jpg/.png files… If you want print and share it you are most welcome to download it here. They are also available in few more languages (Croatian, Flemish, German, Greek, Italian, Macedonian). You are also welcome to submit new translation. For that please send email to theTeam2050@qsport.info #theColderOLYMPIX*#2 #teleTobogganing – Points of Failure by Z. Blace, Vanessa Brazeau & Agnese Trocchi — Mar 01, 2018 / 13:27 teleTobogganing is a sledding race between two different hills, climates, gravitational pulls, and continents – Stuttgart (Schloss Solitude) and Toronto (Trinity Bellwoods Park). Tobogganers in both places raced live against someone on the other side of the Atlantic on 25 February, 2018. As there were many technical elements of the DIY-style sledding event which could go wrong at any time and lead to major failure of the project, this message was made as an alternative art work which embraced the read more… #theColderOLYMPIX*#1 TEAM EUROPE 2050 by Z. Blace and Bojan Krištofić — Feb 11, 2018 / 15:11 TEAM EUROPE 2050 is a visual concept made for “The Future of Europe” and executed in #theColderOLYMPIX series as poster (A1 x 100prints), flyer and online media. Evoking imagination beyond nation-state identity and precisely timed with content for the sport event (now Winter Olympics) for re-thinking of concepts of identity, representation, political agency, institutions and formation. #theColderOLYMPIX* is a series of on-line and on-site events/activities related to the 2018 Winter Olympics in South Korea (February 9-25) and beyond. A cluster read more…"
