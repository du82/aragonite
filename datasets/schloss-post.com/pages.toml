title = "Gestures of Motherhood | Akademie Schloss Solitude: Schlosspost"
full_description = "Birth-Knowledge-Generator Web Project Hierarchies of Otherly Knowledge by Jasmin Schädler, Inga Marie Ruxton & by Christoph Knoth — Jun 23, 2017 / 14:54 Launch of Birth-Knowledge-Generator web project, in cooperation with graphic designer and programmer Christoph Knoth and illustrator Inga-Marie Ruxton A few weeks ago a woman was laughing about me because I work on the topic of motherhood without being a mother myself. In her opinion I was missing the experience. Apparently I can only gain this competence through pregnancy and giving birth. The reaction of this woman was actually a reoccurring theme for me. Whenever I talk about my project I read more… Gestures of Motherhood #6 Birth Information Night by Jasmin Schädler — Feb 24, 2017 / 11:40 Read article in German. »Hello World« 2. January 2017. I put a towel underneath my pullover and take pictures of myself in front of the mirror. I’m five months pregnant. How big is the belly after five months? I compare my towel belly to pictures on the internet. It is too low somehow. I put on my coat. Now the belly is almost not visible anymore. I am afraid nobody will believe me. I leave the house and take the read more… Gestures of Motherhood #5 The Ejection Phase and the Cognition by Johana Gomez — Jan 30, 2017 / 13:52 Loading GIF Read article in German. I was absorbed by my thoughts, I was winding down. There was a break between the nine months of pregnancy and the moment of the water breaking. A whole day that felt like a soundless break afterwards. The water was running down between my legs and my thoughts were tying into knots very quickly. I forgot every bit of instruction and advice. All by myself, my baby and I were working to make the first step read more… Gestures of Motherhood #4 Mutation of Body And Mind by Johana Gomez — Jan 13, 2017 / 10:53 Loading GIF How does it feel to have a life growing inside you? Euphoric, exciting, and incredible don’t seem to cover all the emotional and physical states a pregnancy awaits for you. Johana Gomez, guest author for the »Gestures of Motherhood« blog, describes what her body and mind was going through until she gave birth. This is her second entry of the three piece series »Phases of Accouchement«. Read article in German. My body started to change: I suddenly had insanely big breasts read more…"
