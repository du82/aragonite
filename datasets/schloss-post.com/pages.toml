full_description = "ongoing experiment / installation A kitchen is not a room by Alkistis Thomidou — Jun 15, 2020 / 11:42 A kitchen is not a room. It is a space. A geometric, physical and mental space. Kitchens have had a main role in the historical definition of the idea of home and family, and subsequently, in the creation of gender biased relationships within the domestic sphere. Nevertheless, technological innovation and new kitchen appliances enabled the emancipation of women. A kitchen developed from being the centre of the house with the fire heating, to a separate space, from a communal kitchen read more… Poetry Truth is Calling by Maayan Danoch — May 17, 2020 / 10:28 when the truth is calling and there is now way out when you wake up and know that your instinct of survival has been on for too long and you continued as if nothing is wrong when you know you could have handled it differently but you did not then sarcasm strikes after it explodes it’s surprising maybe shocking and there’s no hearing no resolution just an insult and confusion the hate of the self is stronger read more… spatial miniatures Tectonic Sculptures by Maayan Danoch — May 02, 2020 / 11:12 ≈ works that happen while you are building a wall “Tectonic Sculptures” are miniature objects, spatial compositions, made from wood and metal throughout the process of building two 208 x 117 x 15 cm walls. The walls are used for video projection as part of the set design of the performative object “front-back”."
