["https://schloss-post.com/overview/web-residencies"]
title = "Web Residencies – Akademie Schloss Solitude | Web Art | Schloss-Post"
description = "We award web residencies three times a year. Experiment with digital technologies and new art forms, and develop your web-based practice further."
full_description = "The »Web Residencies« program was initiated by Akademie Schloss Solitude in 2016 to support young talents from the international digital scene as well as artists of all disciplines who deal with web-based practices to present the process and results of their work online on the platform www.schloss-post.com. In the years 2017–2020, Akademie Schloss Solitude and ZKM | Center for Art and Media have announced nine calls for web residencies with different topics that were designed by invited curators. In the years 2018 and 2020, the production prize »Hash« was awarded for outstanding projects by the Web Residents. The upcoming calls will be initiated by the Akademie Schloss Solitude itself and presented on the new website. For each call, a curator selects four project proposals, whose creators are rewarded with a four-week residency and 750 USD. Artists are invited to experiment with digital technologies and new art forms, and reflect on the topics set by the curators. Find out more about the program and subscribe to the newsletter to receive the latest calls and news. Calls Violent Consumer Media Curated by Dani Ploeger Engineering Care Curated by Daphne Dragona Rigged Systems Curated by Jonas Lund Planetary Glitch Curated by Mary Maggic Loading GIF Refiguring the Feminist Future Curated by Morehshin Allahyari Loading GIF Ghosted 2018 Curated by Tegan Bristow An AI Summer Curated by Nora O Murchú Fractal Horses Curated by Claudia Maté Blowing the Whistle, Questioning Evidence Curated by Tatiana Bazzichelli Loading GIF SUPRAINFINIT: L'Avenir Redux Curated by Apparatus 22 Re-entering the Ultimate Display Curated by Mario Doulis Decentralization of Internet Art Curated by NETRO All Web Residencies Gore Devaluating Tool Interview VIGIPIRATE QUADCOPTER DRONE Interview 1001 Drone Nights Interview Late Night in Sorrento Interview Molecular Sex & Synthetic Love Interview On the Apparently Meaningless Texture of Noise Interview The »Care Bot« for the Un-Carin