["https://schloss-post.com/category/web-residents/engineering-care"]
title = "Engineering Care | Akademie Schloss Solitude: Schlosspost"
full_description = "Web Residencies by Solitude & ZKM The »Care Bot« for the Un-Caring Social Media Landscape Caroline Sinders / Berlin, Germany Web Residencies by Solitude & ZKM On the Apparently Meaningless Texture of Noise Pedro Oliveira / Berlin, Germany Web Residencies by Solitude & ZKM As Air Became This Number Hanna Husberg & Agata Marzecova / Stockholm, Sweden & Tallinn, Estonia Web Residencies by Solitude & ZKM The Timbral Matter of Voice and the Right to Opacity Interview with Pedro Oliveira Pedro Oliveira created a »sound essay,« in which he examines accent recognition software in asylum procedures, and challenges narratives of care around it. It serves as an entry point to or a conversation piece on the instrumentalization of voices and accents, on bodies as the site for the production of »evidence.« Web Residencies by Solitude & ZKM TECHNO-SEX BOTS: Molecular Sex, Synthetic Love and Quantum Bodies Interview with Johanna Bruckner In the interview with Sandra Oehy, Johanna Bruckner talks about her project Molecular Sex & Synthetic Love. A project that aims at queering normative world views of intimate relations and individual-driven forms of care. Web Residencies by Solitude & ZKM In Recent Years, We Learnt a Lot of Technical Words (…) Interview with Hanna Husberg and Agata Marzecova Hanna Husberg and Agata Marzecova developed a simple website employing the aesthetics of the color code used to communicate the national Air Quality Index (AQI). Quotes by transcripts that recount experiences of living in the hazy Beijing air create sometimes contradictory perspectives on the phenomena. Web Residencies by Solitude & ZKM Bridging the Care Gap of Social Media Systems Interview with Caroline Sinders With extensive research on online harassment, the researcher and artist Caroline Sinders explores the lack of »care« within social media systems through her Care Bot project. Web Residencies by Solitude & ZKM Web Residents »Engineering Care« Curated by Daphne Dragona Challenging the common narratives about artificial empathy and the robotic imaginary, the latest call for the Web Residencies by Solitude & ZKM invited projects that address care’s economization and instrumentalization, or shed light on forms of radical, collective, and critical care."
