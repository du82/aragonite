["https://schloss-post.com/category/beat-blog"]
title = "Beat Blog | Akademie Schloss Solitude: Schlosspost"
full_description = "Beat Blog VI Off-topic – Ethnomusicological Field Studies by Frauke Aulbert — Nov 10, 2016 / 14:06 This film was made during our reception ceremony with the chief of the Navotua people at Nacula Island, Republic of Fiji. The video only records the floor of the dark hut, so as to not intimidate the shy vocalists. The Navotua people live on a small island, and mostly eat what they grow themselves. They are Protestants, although the village is run by a chief – who is also the only one in the village allowed to wear sunglasses. read more… Beat Blog #5 Kargyraa Aug 17, 2016 / 15:09 Loading GIF For many years, I have been trying to grasp a very special voice sound: undertone singing. I use this term as a classification for all vocal sounds of this type, including vocal fry, Strohbass, growling, and Kargyraa – although they might vary in the sound and in the physiological production. Undertone singing also plays a role in beatboxing, as it can be used as an alternative for bass sounds. In literature on extended singing techniques and harmonic singing, you can read more… Beat Blog #4 Notating Beatboxing Sounds by Frauke Aulbert — Jul 22, 2016 / 09:17 When I started my residency here at Schloss Solitude on the topic of beatboxing, one of my aims was to develop a notation for this technique that would be suitable for experimental music. There are two main strategies for this: one based on the sound itself, and one based on the point of articulation. Basing the notation on the sound would be an easier thing to do for composers as one could draw on the notation of percussion, which looks read more… Beat Blog #3 Finding Beats Jul 05, 2016 / 13:15 One very useful approach is to transcribe videos from the Internet. It is full of instructive and non-instructive beatbox videos, and you can learn from each one. Actually, the ones which aren’t superprofessional are easier to capture and transcribe, and it is a really good exercise to later understand the more complex ones. YouTube has tools to change the quality and the speed of the playback, which comes in handy. Every beatboxer will develop his/her own language or repertoire of read more…"
