["https://schloss-post.com/category/time-based-media"]
title = "Time-based Media | Akademie Schloss Solitude: Schlosspost"
full_description = "Video stream from May 20 – June 10, 2020 An Empirical Queer Theory by Padraig Robinson Christina Myers Hepburn, a Los Angeles-based practitioner of touch therapy is in the limelight of Padraig Robinson’s film An Empirical Queer Theory (2019). The work discusses touch and physical tenderness as basic human needs, and at the same time challenges normative rules of society. Video stream from April 27 – May 06, 2020 Freeze Frame by Soetkin Verstegen In the animation Freeze Frame by Soetkin Verstegen, identical figures perform the hopeless task of preserving blocks of ice. The repetitive movements reanimate the animals captured inside. The work was mainly realized during her residency at the Akademie Schloss Solitude in 2018. Read the introductory interview with the artist. Studio Visit / Video I Wanted to Photograph You Conversation with Aykan Safoğlu Aykan Safoğlu reveals an intimate view on his work ziyaret/visit, an encounter with personalities buried at a West Berlin cemetery, in an attempt to sensitively deal with loss and transgression. Essay Was That Really You by Nadia Mounier An image research project by photographer Nadia Mounier, which explores representation of women in photographic images produced or circulated in the Arab-Islamic sphere. Podcast Occasional Criticism by Mike Sperlinger and Madeleine Bernstorff A one-off podcast discussion between Mike Sperlinger and Madeleine Bernstorff – about his publication, her recordings and the strange contemporary fate of cinephilia. Sketch Elliptical Inscriptions by Katharina Jabs »Have a good cry but also put it into words, please.« Film Appendix Off-White Tulips by Cana Bilir-Meier and Madeleine Bernstorff An atlas of figures taken from the essay film Off-White Tulips by Aykan Safoğlu that retains the associative narrative the film offers, but also presents an independent reading. Essay Rule 403 / Indefinite Postponement by Tom Rosenberg What happens when the judicial reconciliation of a homicide gets tangled up within its own intention of letting justice prevail? A filmmaker’s perspective."
