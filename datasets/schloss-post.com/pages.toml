["https://schloss-post.com/category/web-residents/an-ai-summer"]
title = "An AI Summer | Akademie Schloss Solitude: Schlosspost"
full_description = "Web Residencies by Solitude & ZKM An AI Summer with Nora O Murchú Read a statement by the curator Nora O Murchú on the chosen projects and have a look at the different ideas ranging from chat bots to deep unlearning exercises. Open Call No. 3 by Solitude & ZKM An AI Summer Curated by Nora O Murchú Web residencies call No 3., 2017 by Solitude and ZKM on the topic »An AI Summer« is curated by Nora O Murchú, who invited artists from all disciplines to address AI as a topic or employ AI methods in the creation of their work. 110 applicants took part in the call, four web residents were chosen from a shortlist of 9 proposals. The web residents will work on their ideas during the month of November. The projects will be shown on Schlosspost as well as on the ZKM website. Web Residencies AI-Mediated Production Residency Elaine Hoey & Alan Butler, Dublin/Ireland NefertitiBot Nora Al-Badri & Jan Nikolai Nelles, Berlin/Germany 24HOUR HOST Lauren McCarthy, Los Angeles/USA Deep Unlearning Sascha Pohflepp & Chris Woebken, La Jolla/USA & NY/USA Juror's Statement Web Residencies by Solitude & ZKM An AI Summer with Nora O Murchú Read a statement by the curator Nora O Murchú on the chosen projects and have a look at the different ideas ranging from chat bots to deep unlearning exercises. Shortlist AI-Union Elli Kuruş/Leipzig The Mouth Breathers Find A Body Ryan Wurst/Denver, CO, USA Befriending Hello Barbie Faith Holland/USA Building a Feminist Data Set for a Feminist AI Caroline Sinders/San Francisco, CA and New York/USA Desert Mother: a Multiplayer Intelligent Landscape Aaron Oldenburg, Baltimore/USA Share 0 Tweet E-mail Read a statement by the curator Nora O Murchú on the chosen projects and have a look at the different ideas ranging from chat bots to deep unlearning exercises."
