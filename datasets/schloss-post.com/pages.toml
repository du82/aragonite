["https://schloss-post.com/category/architecture"]
title = "Architecture | Akademie Schloss Solitude: Schlosspost"
full_description = "ongoing experiment / installation A kitchen is not a room by Alkistis Thomidou In apartment advertisements one will read “ Apartment for rent: 3 rooms, kitchen, bathroom, hallway”. A kitchen is not a room. Studio Visit The Power Structures of Built Reality Interview with Ana Filipovic How does the hyper-financialization of housing affect our homes and the cities we live in? An examination into built structures and cultural values of late-capitalist society. Report Debalkanize Skopje! by Damjan Kokalevski Damjan Kokalevski looks at the history of urban planning in Skopje by exploring an United Nations Development Programme from the seventies and a project called Skopje 2014. Architecture ‘Twas All in My Head by Devin Jernigan Architect Devin Jernigan on the absence of anthropomorphic elements in architecture and what this means for understanding the relationship between humans and buildings. Machines, Architecture & Psychoanalysis Air Loom by Devin Jernigan The Air Loom, a hypothetical machine for remote mind control, was invented in the late eighteenth century. An essay on architecture and paranoia by Devin Jernigan Architecture & Design If Not Political, It Is Not Design by Kaiwan Mehta Architecture is on the threshold of change, but it risks being reduced to the decorative arts. – An essay by Solitude's main juror, theorist and critic, Kaiwan Mehta Studio Solitude Cats, Bots & Dark Labour with Curtis Roth What makes attention valuable? Can bots be an audience? The answer might have something to do with cats. A talk with artist and architect Curtis Roth on his current project Loading GIF Teaching Art On The Strange Promise of Bad Ideas by Curtis Roth Architect, academic, and teacher Curtis Roth dreams of truly bad ideas that have the capacity to question the seemingly good things. Welcome to the University of Bad Ideas. Studio Solitude Farzin’s Memory with Farzin Lotfi-Jam by Judith Engel An interview with New York based architect Farzin Lotfi-Jam about his work, his broad interest in architecture and what had led him to his present point of being."
