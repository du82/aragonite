full_description = "Web Residencies by Solitude & ZKM Permaculture Network Gary Zhexi Zhang & Agnes Cameron / Ein Qinyya, Palestine Loading GIF Web Residencies by Solitude & ZKM PROFILING THE PROFILERS (Sousveillance of Big Tech Companies Using Their Own Tools) DISNOVATION.ORG / Warsaw, Poland & Paris, France Web Residencies by Solitude & ZKM The Future of Memory Xiaowei Wang / Oakland, CA, USA & Guangzhou Guangdong, China Web Residencies by Solitude & ZKM Flora, Fauna and Folk Tales Interview with Gary Zhexi Zhang & Agnes Cameron In the village of Ein Qinyya, Palestine, a local mesh network functions as both an organic community intranet and a means of interacting with the environment. Loading GIF Web Residencies by Solitude & ZKM From Surveillance Capitalism to Glitch Capitalism Interview with DISNOVATION.ORG We spoke with DISNOVATION.ORG about their working processes and their thoughts on the role of copy culture, free access, and media piracy. Web Residencies by Solitude & ZKM Demystify the Algorithmic Recommendation Interview with Sam Lavigne We spoke with Sam Lavigne about his proposal for »Rigged Systems« and why humor and language are important elements of his work. Web Residencies by Solitude & ZKM Shanzhai, Poetry and Bypassing Censorship Interview with Xiaowei Wang A poetic intervention of artificial intelligence algorithms and automated censorship of the Chinese Internet. Web Residencies by Solitude & ZKM Web Residents »Rigged Systems« by Jonas Lund Projects that playfully rethink the political power balance, imagine new ways of circumventing censorship, or build alternative networks are among the four proposals selected by curator Jonas Lund for the web residencies by Solitude & ZKM. Open Call Web Residencies by Solitude & ZKM Rigged Systems Curated by Jonas Lund How can we imagine new forms of political debate and places for political communication? The new call for the web residencies by Solitude & ZKM is online now. Apply until June 28, 2019. Exchanges with Turkers: initial guidelines for an alternative community Bruno Moreschi & Gabriel Pereira / São Paulo, Brazil & Aarhus, Denmark"
