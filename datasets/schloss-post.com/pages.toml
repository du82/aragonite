full_description = "Curated by Wikipedia Random Article Generator https://en.wikipedia.org/wiki/Shalom_Sharabi by Lorraine Evrard — Jul 24, 2019 / 11:30 I had the article about Shalom Sharabi, whose major accomplishment was to codify the kezayit of matzots. The kezayit is a unit of volume based on the size of an average olive: I found that it was very absurd as there’s no such thing as an average olive, but if you admit there is you can see the whole world as ruled by olives. I wrote a text to explain my theory of olives, sounding very serious but at the read more… Curated by Wikipedia Random Article Generator https://en.wikipedia.org/wiki/Kayode_Are by Viviane Ravier — Jul 24, 2019 / 11:15 »Celebrate with me« is a video I made about something I found on the Wikipedia Page of Kayode Are. Something we have in common. I discovered that in 1999, the year I was born, he became the Director General of The State Security Service of Nigeria. Twenty years ago our lives changed! I wanted to celebrate with him this date and I wrote an email that I illustrated in this video where I blow a candle on a big slice read more… Curated by Wikipedia Random Article Generator https://en.wikipedia.org/wiki/Aneurysm_of_sinus_of_Valsalva by Kenza Bahi — Jul 24, 2019 / 11:00 For this workshop, I had to work on the »Aneurysm of sinus of Valsalva.« I had no idea what it was about, all I knew is that it dealt with both science and medicine and I liked it! I tried to create a realistic heart made out of clay, then I proceeded to use wool so as to make the veins and the arteries and I also added some details with acrylic. I noticed that the color of the heart read more… Curated by Wikipedia Random Article Generator https://en.wikipedia.org/wiki/Yunzhongzi by Mateo Calderon — Jul 24, 2019 / 10:45 The random article was Yunzhongzi’s, a Chinese novel character. A sentence describing him struck me: »heart of cloud, mind of fluidity.« I finally came to this short fiction/report about very true undeniable scientific facts. As a slow cloud-gazer, I was glad to work in this field and to share one of the things I like. And I linked this with all the love I can find in every bottom of the Internet, that makes me always happy. Alt + 3 Alt + read more…"
