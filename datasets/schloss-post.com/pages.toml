["https://schloss-post.com/category/issues/wimmelresearch"]
title = "WimmelResearch | Akademie Schloss Solitude: Schlosspost"
full_description = "Interview The Art of »WimmelResearch« with Sophie-Charlotte Thieroff & Birgit Thoben How do you develop a space of conceptual freedom within a company with a 130-year old tradition? An interview about Platform 12 WimmelResearch Deep Time Machine Learning with Jol Thomson Artist Jol Thomson on his project developed during the WimmelResearch-Fellowship, a joint project between Robert Bosch GmbH, Akademie Schloss Solitude, and Wimmelforschung. Video BINEMA by Marko Milić »Can I borrow your body for one day?« asks BINEMA, an »Art Intelligence« created by Marko Milić, artist and WimmelResearch-Fellow. BINEMA created several »stations« all over the Robert Bosch GmbH campus that could be observed and experienced with a VR headset. Find a video documentation of the project here. Video Conversation Room by Ariel Bustamante Conversation Room is an acoustically isolated space specially designed for voice that houses conversations between the artist Ariel Bustamante, a Bosch employee, and a computer. This computer is equipped with a simple AI algorithm that allows it to converse with the participants, although it has its own, incomprehensible language. Video Designing Realities 3D Un-/Learning (Almost) Anything by Fabian Hesse and Mitra Wakil Mitra Wakil and Fabian Hesse, WimmelResearch-fellows at Platform 12, are two visual artists interested in open-access labs and in turning 3D technologies into social tools. During their time at Bosch’s Center for Research and Advance Engineering in Renningen, they initiated workshops inviting Bosch’s researchers to perform for 3D bodyscans. Video Local Sensing by Alexander Werle WimmelResearch fellow Alexander Werle, who took part in Platform 12 in spring 2018, launched his project with the questions: »How diverse are mobility needs? What about confidence in technology? How do reality and research reality overlap?« Video Secrets of Last Summer by Julian Palacz WimmelResearch fellow Julian Palacz reflects on topics about privacy, mass surveillance, and the use of consumer electronics. In his projects at Robert Bosch GmbH, he focuses on the digital and physical traces we leave behind."
year_published = 2025
