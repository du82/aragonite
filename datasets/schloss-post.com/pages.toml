["https://schloss-post.com/category/web-residents/fractal-horses"]
title = "Fractal Horses | Akademie Schloss Solitude: Schlosspost"
full_description = "Web Residencies by Solitude and ZKM What Is Beauty in Net Art? with Claudia Maté What role do patterns play in Net Art? Can we change patterns just by staring at them? And do patterns create beauty? A talk with curator Claudia Maté. Open Call No. 2 by Solitude & ZKM Fractal Horses Curated by Claudia Maté Web residencies call No 2., 2017 by Solitude and ZKM on the topic »Fractal Horses« is curated by net artist Claudia Maté, who invited artists of all disciplines to challenge the complexity and tensions of patterns and chaos. 100 applicants took part in the call, four web residents were chosen from a shortlist of 16 proposals. The web residents will work on their projects for four weeks (until August 3, 2017), posting articles and works regularly or reporting on the steps to their final piece. The projects will be shown on Schlosspost as well as on the ZKM website. Web Residencies Loading GIF Generative Music Patterns Jean-Michel Rolland, Marseille/France Gaze-based Emergent Pattern Evolution Eric Parren, Los Angeles/USA Ten Minute Painting Jeffrey Alan Scudder, Maine/USA SKYLIGHT Nicolas Sassoon, Vancouver BC/Canada Juror's Statement Web Residencies by Solitude and ZKM What Is Beauty in Net Art? with Claudia Maté What role do patterns play in Net Art? Can we change patterns just by staring at them? And do patterns create beauty? A talk with curator Claudia Maté. Shortlist Extending Artworks in the Time of Auto Complete Conan Lai/Montreal, Canada Neural Art – Pollock pattern Vincent Brinkmann/Cologne Loading GIF All in for the Air Castle Phenomena a.k.a. Starry Eyed Dreamer Matthew Keff/New York, US Relative Refractions Bogdan Seredyak/New York, US Access Forecast Jeroen van Loon/Utrecht, The Netherlands Highly-patterned Found Objects Jeff Thompson/USA Summoning Dragons for Free Tea Strazicic/Croatia The Alchemy of Data Mining Alexander Repp/Leipzig, Germany MAgnetic VIdeo CAmera Martin Volman/Buenos Aires, Argentina DPRK7 F.C. Federico Pozuelo/It