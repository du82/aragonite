["https://schloss-post.com/a-monument-for-rioters"]
title = "A Monument to Riots | Akademie Schloss Solitude: Schlosspost"
description = "Niloufar Tajeri and Gal Kirn examined the complex structure of sub/urban riots thinking about an alternative monument."
full_description = "Issue No 4 — Biographies & Space A Monument to Riots with Niloufar Tajeri and Gal Kirn — Feb 16, 2016 »What we share is the perspective, the way we look at things and the world, that is in a critical and engaged manner. The way we make this public or common is now the question for the present and future, how to develop different formats.« – Niloufar Tajeri/Gal Kirn In August 2011, thousands of people rioted in London and other cities and towns across England. Chaos broke out for several days, including cases of looting and arson, and resulted in the death of five people. Thousands were arrested. The catalyst for these events was the death of Mark Duggan, a man who was shot dead by police in London. An irrational mob? Looters and criminal gangs? Immigrants acting barbarically and immorally? Or a revolt against injustice through police violence and neoliberal structures? A political act of refusal, indignation, and looting, which some identify as a »moral economy of the poor?« Architect Niloufar Tajeri and Gal Kirn, a researcher in political philosophy and cultural theory, examined the complex structure of the sub/urban riots in London as well as LA and Lyon-Paris in the past few decades, taking into close consideration spaces where the poorer working classes reside as well as the proletariat and migrants from former colonies. They encountered a strong moralizing and criminalizing discourse on the rioters by the political class and media opinion leaders. This work aims to counter this demonization of the rioters by finding new ways to address the topic. As the collective Re-orient, they started the project »Thinking the monument to the sub/urban riots« to act outside of a strict academic circle and to intervene in this space. They propose an alternative monument to adress the »forgotten layer« of those demonized after the riots and oppressed in everyday life, not for glorification or victimization, but for solidarity and emancipation. Niloufar Tajeri & Gal Kirn, Solitude studio, February 2016 Clara Herrmann/Judith Engel: How long has the collective Re-orient existed and what is its aims, ideas, and projects? The collective Re-orient came into existence in 2012, first as a series of long discussions around the relationship between politics, art, and architecture from an emancipatory perspective – and specifically on the occasion of the possible renovation of a large socialist, modernist memorial park, Petrova Gora, by sculptor Vojin Bakic, in the former Yugoslavia (current Croatia) in 1980-81. This sculpture and memorial park is now in a gradual process of decay and destruction, as is case with many antifascist partisan monuments in the post-Yugoslavian context. This particular monument used to be covered in aluminium plates. It was set in nature and surrounded by a museum and other sites, making it a veritable memorial complex. But in the last few decades there hasn’t been any money or interest on the side of the state and municipality to invest in it, and these aluminium plates have been stolen over time. So the monument is being stripped away in front of our eyes, in a slow deconstructive way. In 2012, there was a public competition curated by Vesna Vuković in the WHW organisation, in which participants were asked to address this process and explore suggestions for what to do with the monument? Our proposal was accepted for the exhibition (along with some others). We suggested a minimal intervention, some kind of curtain which would visually »substitute« the aluminium, but not completely cover the skeleton structure which shows the process of decay and plundering. The fabric that would cover up the monument would not be completely fixed and would produce sounds with the movement of the wind, creating a new sound-land-memorial-scape which resonates with the natural environment. CH/JE: You both come from different academic and professional backgrounds. How do you collaborate together in your projects? Gal Kirn: I come from the fields of philosophy, political, and cultural theory and have been reading a lot of Marxist and other critical literature, but I became progressively more interested in the topic of space and memory. At the same time, I want to make my work visible outside of a strict academic format (publishing articles, organising conferences, and so on) and experiment with new methodologies. Niloufar Tajeri: I’m an architect. My doctoral research focuses on social housing and the possibility of integrating more common spaces into them in a certain way. I’m also critically revisiting (late) Modernism and asking how to continue it today. I’m also interested in critical urban studies, so conceptual work is not foreign to me … Johannes Blechschmidt Monument to Charles Fourier, The Situationists, 1969: The statue of the utopian socialist Charles Fourier was removed by the Vichy government on the order of the Nazis occupying power. The empty plinth was like a monument in an »unfinished« state, offering a radical potential for appropriation and action. Johannes Blechschmidt Mahnmal gegen den Faschismus (Memorial against Fascism), Esther und Jochen Gerz, 1986: This memorial consisted of a lead-coated column, which gradually sunk under ground over a period of six years. The monument here is a mirror of the manifold opinions of society. It represents the end of representation, which is completed by the disappearance of the column. Johannes Blechschmidt Granby Workshop, Assemble, 2015: The social critique of gentrification takes place in the form of an affirmative action, revealing a concrete alternative, which makes this “ready-made” monument a part of alternative political representation. Johannes Blechschmidt Conical Intersect, Gordon Matta-Clark, 1975: The »nonument« was articulated as a critique of urban gentrification in the form of a radical incision through two adjacent seventeenth century buildings designated for demolition right next to the Centre Georges Pompidou, which was then under construction. Johannes Blechschmidt Yugoslav Partisan Monuments, Different authors,1960-1980: From the 1960s to 1980s in Yugoslavia a vast alternative memorial movement emerged from within the official policy of socialist modernism. These monuments consist of large public spaces that entailed different social practices: from informing oneself, picnicking, going for a walk, to countercultural activities and acts of refusal. Johannes Blechschmidt Monument to Bataille, Thomas Hirschhorn, 2002: The monument was built in an immigrant neighbourhood of Kassel during the Documenta 11, and was based on a collaborative effort of the artist and the community. It is conceived as an instrument for the inclusion of an otherwise marginalised neighbourhood and encourages an encounter between different parts of society. Johannes Blechschmidt Radical Reconstruction, Sarajevo, Lebbeus Woods, 1993: Lebbeus Woods visited besieged Sarajevo during the war, where he developed a strategy that would deal with the transformation that the war caused in society. Johannes Blechschmidt Monument to the Third International, Vladimir Tatlin, 1917: Tatlin’s monument is a dynamic structure that incorporates three revolving halls supported by a skeletal and spiral framework. It is transnational, communicates and resolves; it is capable of organising and seeing things differently. What we share is the perspective, the way we look at things and the world, that is in a critical and engaged manner. The way we make this public or common is now the question for the present and future, how to develop different formats. We should probably mention that the project that we initially conceptualized for the Solitude residency focused on a book that we read together, and that triggered many conversations: David Harvey’s Condition of Postmodernity (link, 1989). In this book Harvey addressed in a powerful way how the change in aesthetical practices and movements occurred, most notably the move from (late) Modernism to Postmodernism. Furthermore, this book showed how these aesthetical changes were set in motion and interrelated with the changes in the political-economic structure of capitalism, the move from Fordism to post-Fordism and the rise of neoliberalism in the early 1970s. The strength of the book also lies in the ways in which the movement of capital is inscribed in space, and with it in architecture, and other arts. However, it also retains the sensitivity to concrete analysis of changes in arts and architecture. This gist was highly inspirational for us and predicted many structural and aesthetical changes that remained until today. Although we had at first wanted to transform and re-materialize the book into the exhibition, we later on decided to focus on certain novel political phenomena that belong to those changes: sub/urban riots (which Harvey briefly addressed in his more recent book Rebel Cities, 2012) and the way we can tell something new about them, that is to link the research on riots to the research on alternative monuments. »Thus, after the violence – which is evidently put on display, aesthetically so in the mainstream media – we asked how to counter this demonization of the riots and revisit both the political logic (they are political and not moral matters) and their deeper structural causes. On the other hand, we thought thinking about the monument and monumental strategies which address the dissent rather than build consensus would be a new effective way of addressing the topic (outside of or together with critical sociology) and intervening in space.«– Niloufar Tajeri/Gal Kirn CH/JE: Thinking a Monument to the Sub/Urban Riot is your first joint project, on show at Akademie Schloss Solitude until February 28, 2016. How did it start? When we were doing the research on the urban riots in the West, especially in the former colonial centers, such as London and Paris, we encountered a strong moralizing and criminalizing discourse on the rioters: »How come they loot? They are barbaric, scum, feral youth, members of gangs.« The representatives of the political class and media opinion leaders were all competing in reasserting authority. Thus, after the violence – which is evidently put on display, aesthetically so in the mainstream media – we asked how to counter this demonization of the riots and revisit both the political logic (they are political and not moral matters) and their deeper structural causes. On the other hand, we thought thinking about the monument and monumental strategies which address the dissent rather than build consensus would be a new effective way of addressing the topic (outside of or together with critical sociology) and intervening in space. Obviously, there are many traps when thinking about commemoration – will it take away the radical core, neutralize the operative modality, or could one end up with glorification or victimisation of the marginalized urban poor? But then again, we reflected upon ways we could deploy some emancipatory aspects of riots in a counter-archive. Solitude, February 2016 CH/JE: What does the false alternative of neither victimization nor glorification mean? Here, we refer critically to the long and dominant tradition in memorial practices and monumental strategies that have generally opted for either glorification of the grand personas and history of a national state with their victories (which, as Walter Benjamin shows, testify as documents to barbarity, colonial quests, genocides on the side of defeated, etc.), or for victimization connected to a certain tragedy. If the first option (victory) pertains more to the domain of the (national) state/empire and its imagined communities, then the second strategy (defeat and victims) pertains more to the religious realm and could be connected to the ultimate figure of suffering on the cross (Jesus), the martyr who died for others to remember this and build on it further. More recently, the figure of victimhood has had many resonances with the paradigm of the Holocaust, which made the killing of Jews a kind of religious ritual on the altar of the Nazis, thus minimizing the long anti-Semitic history in Europe, while also saturating our collective memory with an always passive and unified figure of the Jew. »For us, rioters are not some simple passive and innocent victims of police violence and objective conditions, they should not be seen as beautiful souls waiting for salvation. But on the other hand, we also don’t want to glorify the act of their insurrection as some kind of immediate and true communism, etc. – remember, Marx didn’t idealize the working class…« –Niloufar Tajeri/Gal Kirn Thus, our proposal of an alternative memory and monument to (sub)urban riots aims to avoid this false victory-victim alternative, of which there have been millions of reiterations in form depending on the different contexts. For us, rioters are not some simple passive and innocent victims of police violence and objective conditions, they should not be seen as beautiful souls waiting for salvation. But on the other hand, we also don’t want to glorify the act of their insurrection as some kind of immediate and true communism, etc. – remember, Marx didn’t idealize the working class; he was aware of their vices, chauvinism, alcoholism, etc. But he thought about the position of the proletariat moving towards the abolition of this system. For this to happen, a lot of political organization of the struggles had to take place (and as we see, this was not enough). Thus, in our case we want to address the forgotten layer, the repressed layer, those that are obviously demonized after the riots and, furthermore, oppressed in their everyday life. The alternative monument should address both the structural position of the oppressed and marginalized and also stress the moments of emancipation, that there is the will to change things, and to resist against the present and past unjust circumstances, despite the despair and past failures. The point is also how we are to move beyond the marginalized position and fixation within the margin. The question we ask is: Can a monument or a monumental strategy help us trigger perhaps both a stronger visual marker of structural inequalities and a stronger trigger which sets a frame in which potential solidarity among those more and those less excluded and exploited can be enhanced? How do we bring forward the solidarity of the excluded? CH/JE: Could you talk a bit more about the alternative history of monuments and emphasize some specific cases of monuments from the past? Alternative monuments from the twentieth century countered the dominant monuments which build on the national(istic) consensus of states. Contrary to this, they asserted a complex set of narratives and intended to achieve more than just commemoration, by inventing new spatial strategies and practices that would speak from the position of the oppressed. Despite their differences in appro"
