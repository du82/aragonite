title = "Fiction | Akademie Schloss Solitude: Schlosspost"
full_description = "Fiction When Solitude and solitude Meet in the Fog Cristina Vidruțiu »Solitude fog is different than any other fog. As soon as it invades the contours of everything, you find yourself either paralyzed by the disappearing background, or freer than ever.« The Edge of Reality #0 Living On The Edge: An Introduction by Mátyás Dunajcsik A project of research and reflection by Hungarian writer Mátyás Dunajcsik revolving around places and situations where so called »fiction« and so called »reality« intertwine. Humanities Solitude. A Conversation Guide in Three Acts by Cristina Vidruțiu »As I enter this strange space, I feel like an explorer discovering a new territory.« –A conversation guide in three acts for Solitude by Cristina Vidruțiu, fellow for Humanities. Fiction Violate the Leaves by Theodore Wheeler Theodore Wheeler's debut collection of short fiction, »Bad Faith,« was published this month by Queens Ferry Press. »Violate the Leaves« was composed at Solitude. Cross Media Only Analog is Safe by Stephanie Choi From the divine truth of the crystal to the surveillance of the prism, transparency affords revelations. A cross media project by architect Stephanie Choi in collaboration with Doretta Lau Literature Here Lies Memory by Doug Rice Going blind saved Elgin from the oblivion being created by a world that was too full of things to see and it stopped him from losing… Literature Friend, You Have Time by Phil Baber Book designer and publisher Philip Baber on Peter Handke. With an excerpt from Handke’s poem »To Duration,« translated by Scott Abbott. Literature In Defense of a Storyteller by Sînziana Păltineanu An excerpt from writer, historian, and artist Sînziana Păltineanu’s new debut novel »Elephant Chronicles.« Poetry Poems for Your Phone by Dan Boehl »War, immigration, assimilation, and poetic musings abound.« The Texan writer Dan Boehl collected poems in Belgrade/Serbia. Poetry Moonlight Faces: Living With Disease by Kinga Tóth Hungarian artist Kinga Tóth tells an intimate story of life with disease in hybrid images and »living text-bodies.«"
