["https://schloss-post.com/category/issues/membrane"]
title = "Membrane | Akademie Schloss Solitude: Schlosspost"
full_description = "Editorial Membrane – Boundary & Connectedness by Schlosspost A membrane is employed as a boundary-object and as a site of connectedness. Looking at this dual character of the membrane, the discussion in this issue is about flows, exchange, permeability, and translations, as well as about restraint, rejections, and protected areas. Index Issue No 9 – Membrane by Schlosspost With a widely varied pool of contributions ranging from multimedia content to more experimental forms, this issue includes contemplative and analytical writing in French and English, as well as other media. Programmatic Festival Statement The Need for Mutual Permeabilities by Literaturhaus Stuttgart, Institut français Stuttgart, and Akademie Schloss Solitude The organizers of the festival »Membrane – African Literatures and Ideas,« explore the possibilities within which permeability in thinking, speaking, and acting is the basic condition of change. Curator’s Statement Porosity: Pulse, Flow, Ebb by Nadja Ofuatey-Alazard, Felwine Sarr, and Yvonne Adhiambo Owuor The three curators of the festival »Membrane – African Literatures and Ideas« intend to refresh the flow of words, images, ideas, people, and notions from Africa, from the many Africas into the rest of the world. Interview Afrotopia or The Future is Open with Felwine Sarr by Deniz Utlu Felwine Sarr talks about his essay »Afrotopia« and the need for a »cultural revolution« in Africa: »Now is the time to dream the utopia in Africa itself, and to design the continent ourselves!« Travelogue Entanglements in Transnational Memory Politics by Eric Otieno On his way from Germany to Kenya, Eric Otieno passed by Bagamoyo, in Tanzania, where he found traces of German colonialism. A reflection on the difficult, and distorted memory politics, which often repeat national narratives of founders, fathers, and flags. Fiction Lebensentwürfe by Clementine Ewokolo Burnley By weaving together historical events and imagined texts, »Lebensentwürfe« questions the stories of West African women and their descendants, so as to tell it anew."
