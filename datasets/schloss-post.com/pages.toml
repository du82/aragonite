["https://schloss-post.com/category/issues/teaching-art"]
title = "Teaching Art | Akademie Schloss Solitude: Schlosspost"
full_description = "Studio Japan Fountain Studies by Mica Cabildo Mica Cabildo from tropical Philippines, opened her studio at the snowiest country in the world – Hokkaido/Japan – to teach primary schoolchildren how to work with ice and sand. Teaching Art Teaching Art as a Dubious Act by Katarina Burin Dealing with fiction, questioning authenticity, copying works, and telling a few lies: Swedish art students learn from American artist Katarina Burin. Film Teaching Documentary by Shirin Barghnavard Iranian filmmaker Shirin Barghnavard on teaching how to narrate »a reality« in a creative way. Notes A Disaster Dinner with Karolina Kucia et al. Sketches, notes, comments and pictures from a workshop on bodily and social (im-)balance with leaning duets, falling games, and a disaster dinner. Teaching Art Perceiving Sculpturally with Florian Goldmann The world is a sculpture and a drawing system: a workshop with Florian Goldmann and art history students, moving and measuring in and around Solitude. Teaching Art Material, Movement, Shape with Anna Kubelík »When we started to work with origami, we immediately began to understand how Anna develops concrete projects from this point.« – A workshop by Anna Kubelík Drawing Art is Hard to Educate by Matthias Reinhold Art teacher Matthias Reinhold believes in self motivation, freedom, and individuality. Questioning skills can be a barrier and once this barrier is removed the flow can find its way. Loading GIF Teaching Art On The Strange Promise of Bad Ideas by Curtis Roth Architect, academic, and teacher Curtis Roth dreams of truly bad ideas that have the capacity to question the seemingly good things. Welcome to the University of Bad Ideas. Collaborative practices Keep The Conversation Going by Leon Filter Along with other artist fellows, Leon Filter developed three strategies of collaborating without becoming a collective, and exchanging thoughts without becoming a platform. Creative writing and bookbinding Notes on Childhood by Clare Wigfall & Ricardo Portilho No matter where we grew up, we were all children at one point. A writing and bookbinding workshop examined the ways of expressing how childhood influences personalities."
