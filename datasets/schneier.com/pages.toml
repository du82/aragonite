title = "The Risks of Key Recovery, Key Escrow, and Trusted Third-Party Encryption - Schneier on Security"
description = "ABSTRACT: A variety of “key recovery,” “key escrow,” and “trusted third-party” encryption requirements have been suggested in recent years by government agencies seeking to conduct covert surveillance within the changing environments brought about by new technologies. This report examines the fundamental properties of these requirements and attempts to outline the technical risks, costs, and implications of deploying systems that provide government access to encryption keys. Original 1997 paper: [full text – PDF (Acrobat)] [full text – Postscript]..."
full_description = "The Risks of Key Recovery, Key Escrow, and Trusted Third-Party Encryption H. Abelson, R. Anderson, S. M. Bellovin, J. Benaloh, M. Blaze, W. Diffie, J. Gilmore, P. G. Neumann, R. L. Rivest, J. I. Schiller, and B. SchneierRevised version, 1998. ABSTRACT: A variety of “key recovery,” “key escrow,” and “trusted third-party” encryption requirements have been suggested in recent years by government agencies seeking to conduct covert surveillance within the changing environments brought about by new technologies. This report examines the fundamental properties of these requirements and attempts to outline the technical risks, costs, and implications of deploying systems that provide government access to encryption keys. Original 1997 paper: [full text – PDF (Acrobat)] [full text – Postscript] This paper is also available in a Spanish translation by Arturo Quirantes. CONTENTS Abstract Preface Executive Summary Group Charter 1 Background 1.1 Encryption and the Global Information Infrastructure 1.2 “Key Recovery”: Requirements and Proposals 2 Key Recoverability: Government vs. End-User Requirements 2.1 Communication Traffic vs. Stored Data 2.2 Authentication vs. Confidentiality Keys 2.3 Infrastructure: Local vs. Third-Party Control 2.4 Infrastructure: Key Certification and Distribution vs. Key Recovery 3 Risks and Costs of Key Recovery 3.1 New Vulnerabilities and Risks 3.1.1 New Paths to Plaintext 3.1.2 Insider Abuse 3.1.3 New Targets for Attack 3.1.4 Forward Secrecy 3.2 New Complexities 3.2.1 Scale 3.2.2 Operational Complexity 3.2.3 Authorization for Key Recovery 3.3 New Costs 3.3.1 Operational Costs 3.3.2 Product Design Costs 3.3.3 End-User Costs 3.4 Tradeoffs 3.4.1 Key Recovery Granularity and Scope 4 Conclusions Notes The Authors PREFACE INTRODUCTION One year after the 1997 publication of the first edition of this report, its essential finding remains unchanged and substantively unchallenged: The deployment of key recovery systems designed to facilitate surreptitious government access to encrypted data and communications introduces substantial risks and costs. These risks and costs may not be appropriate for many applications of encryption, and they must be more fully addressed as governments consider policies that would encourage ubiquitous key recovery. Our 1997 “Risks” report was designed to stimulate a public, technical debate and analysis that, in our judgment, must precede any responsible policy decision that could result in the wide-scale deployment of key recovery systems. While there are numerous and important economic, social, and political issues raised by key recovery, the report’s analysis was confined to the technical problems created by deployment of key recovery systems designed to meet government access specifications. As of mid-1998, no substantive response addressing these technical concerns has been offered. While efforts have been made over the last year to design key recovery systems for commercial purposes, they do not alleviate the concerns raised by deployment at the scale and in the manner required to meet government demands. The design of secure key recovery systems remains technically challenging, and the risks and costs of deploying key recovery systems are poorly understood. Most significantly, government demands for access place additional requirements on key recovery systems, including covert access, ubiquitous adoption, and rapid access to plaintext. There is good reason to believe that these additional requirements amplify the costs and risks of key recovery substantially. In the past year, the importance of cryptography for protecting computing and communications systems has gained broader recognition among the public and within industry. Most presently-deployed encryption systems support rather than hinder the prevention and detection of crime. Encryption helps to protect burglar alarms, cash machines, postal meters, and a variety of vending and ticketing systems from manipulation and fraud; it is also being deployed to facilitate electronic commerce by protecting credit card transactions on the Net and hindering the unauthorized duplication of digital audio and video. However, the deployment of encryption (and other information protection mechanisms) is still patchy. Most automatic teller machine transactions are protected by encryption, but transactions made by bank staff (which can involve much larger amounts of money) are often not protected. Most Internet electronic mail is still sent “in the clear” and is vulnerable to interception. Most cellular telephone calls in the U.S. are still sent over the air without the benefit of strong encryption. The situation is similar in other areas. Members of the law enforcement and intelligence communities continue to express concern about widespread use of unescrowed cryptography. At the same time, these communities have expressed increasing alarm over the vulnerability of “critical infrastructure.” But there is a significant risk that widespread insertion of government-access key recovery systems into the information infrastructure will exacerbate, not alleviate, the potential for crime and information terrorism. Increasing the number of people with authorized access to the critical infrastructure and to business data will increase the likelihood of attack, whether through technical means, by exploitation of mistakes or through corruption. Furthermore, key recovery requirements, to the extent that they make encryption cumbersome or expensive, can have the effect of discouraging or delaying the deployment of cryptography in increasingly vulnerable computing and communications networks. The technical concerns about key recovery and trusted third-party systems in 1998 remain largely unchanged from our 1997 analysis. We specifically do not address questions of how and whether key recovery might benefit law enforcement and whether there are alternatives to key recovery that might achieve equal or greater benefits. However, the predictable costs and risks of key recovery, particularly when deployed on the scale desired by law enforcement, are very substantial. The onus is on the advocates of key recovery to make the case that the benefits outweigh these substantial risks and costs. BACKGROUND Cryptography policy is a complex area, with scientific, technical, political, social, business, and economic dimensions. Our report is focused on the technical and economic aspects of the key recovery problem. In particular, we concentrate on the question of whether secure key recovery systems that meet government specifications are technically possible, and, if so, what additional costs and risks we would expect such systems to entail. For the purposes of this report, “key recovery” systems are characterized by the presence of some mechanism for obtaining exceptional access to the plaintext of encrypted traffic. Key recovery might serve a wide spectrum of access requirements, from a backup mechanism that ensures a business’ continued access to its own encrypted archive in the event keys are lost, to providing covert law enforcement access to wiretapped encrypted telephone conversations. Many of the costs, risks, and complexities inherent in the design, implementation, and operation of key recovery systems depend on the access requirements around which the system is designed. We focus specifically on key recovery systems designed to meet government access specifications. These specifications diverge in important ways from the needs of commercial or individual encryption users: 1. Access without end-user knowledge or consent—Few commercial users need (or want) covert mechanisms to recover keys or plaintext data they protect. On the contrary, business access rules are usually well known, and audit is a very important safeguard against fraud and error. Government specifications require mechanisms that circumvent this important security practice. 2. Ubiquitous adoption—Government seeks the use of key recovery for all encryption, regardless of whether there is benefit to the end-user or whether it makes sense in context. In fact, there is little or no demand for key recovery for many applications and users. For example, the commercial demand for recovery of encrypted communications is extremely limited, and the design and analysis of key recovery for certain kinds of communications protocols is especially difficult. 3. Fast paths to plaintext—Law enforcement demands fast (near real-time), 24-hour-a-day, 365-day-a-year access to plaintext, making it impossible to employ the full range of safeguards that could ameliorate some of the risks inherent in commercial key recovery systems. These special demands significantly increase the risks and costs identified in this report. While key recovery systems designed to meet commercial needs also have associated costs and risks, we address most of our attention to the effects caused by the special demands—rapid, covert access to all encrypted data—of government-access systems. CRITIQUES OF THE 1997 REPORT As noted above, there has been no published substantive response to the concerns we raised in our 1997 report. The few critiques of which we are aware avoid addressing the issues in any technical depth, and they mischaracterize our findings: 1. “The report assumes a single, massive, centralized infrastructure”—Although some key recovery proposals are centralized, our report examined key recovery generally, whether it takes the form of a single government-controlled infrastructure or many decentralized, private sector systems. The risks and costs identified arise chiefly from the functional requirements of key recovery (and especially on the scale sought by government), not from the manner in which these requirements are implemented. 2. “The report claims key recovery is impractical, but in fact industry, notably members of the Key Recovery Alliance (KRA), is already developing key recovery products”—While some companies are developing key recovery products, it is not at all clear that these products will achieve the ubiquitous scale envisioned by government. Many of these systems address narrow applications, where added risks and costs may be appropriate, or are at least easier to measure and weigh against end-user benefits. 3. “Key recovery’s benefits outweigh its costs”—Key recovery may have benefits for some users and for government. Ultimately, weighing these benefits and costs is an exercise for the marketplace and policymakers, and is outside the scope of this report. In this report we have merely tried to explain why the costs will be substantial. KEY RECOVERY IN 1998 As of mid-1998 we have seen a wide range of government, industry, and academic efforts toward specifying, prototyping, and standardizing key recovery systems that meet government specifications. Some of industry’s efforts were stimulated by U.S. government policies that offer more favorable export treatment to companies that commit to designing key recovery features into future products, and by U.K. government moves to link the licensing of certification authorities to the use of key recovery software. Yet despite these incentives, and the intense interest and effort by research and development teams, neither industry nor government has yet produced a key recovery architecture that universally satisfies both the demands of government and the security and cost requirements of encryption users. The commercial key recovery products in existence today do not reconcile the conflict between commercial requirements and government specifications. In the absence of government pressure, commercial key recovery features are by their nature of interest primarily to business operations willing to pay a significant premium to ensure continued access to stored data maintained only in encrypted form. Even within enterprises that do require key recovery products, many of the applications of encryption (such as communication traffic) are known in advance not to require recoverability and therefore would not be designed to use a key recovery system. Another problem is that the most secure and economical commercial key recovery systems do not support the real-time, third-party, covert access sought by governments in order to support surveillance. In particular, “self-escrow” by an individual does not meet government access demands. The third-party nature and global reach implied by these government demands make key recovery systems a much more difficult, expensive, and risky proposition than a facility for internal, off-line recovery in a business enterprise. For example, most organizations keep backups in the form of plaintext on magnetic media in physically protected premises. Similarly, organizations that keep encrypted data might naturally be best served by storing backup keys in a bank safe deposit box. A requirement for near-real-time access would preclude this approach, however prudent or appropriate. Any access-time requirement carries with it special risks. In particular, some sort of network technology will generally be required. Such a network, which must link a large number of law enforcement agencies with different key recovery centers, would be extraordinarily difficult to secure. The current attention in the U.S. on the problem of securing critical infrastructure, such as telephone networks, power grids, national banking networks and air traffic control systems, underscores the problem of managing risk in key recovery. The systems that support critical infrastructure, which are increasingly reliant on open networks and information systems, are among the most important current and future applications of cryptography. The complexity and increased risk introduced with key recovery would make critical infrastructure protected by cryptography more vulnerable to the kinds of sophisticated attackers that pose the most serious threats to these systems. In the 1997 edition of this report, we observed that many of the complexities, risks, and costs that make government-access key recovery difficult and expensive to build and operate in a secure manner arise from the requirements themselves. They are largely independent of the engineering details of particular systems. It is not difficult to design and implement small-scale systems that successfully recover keys or plaintext according to some access policy; indeed, many organizations already have in place practices that ensure the continued availability of their data. The difficulties arise from ensuring that a large-scale system, or system of systems, does not inadvertently or maliciously leak data. Government specifications for key recovery systems for export approval are focused on the easier problem of ensuring that keys are recoverable when authorized. They do not address or give techniques for the far harder problem of ensuring against unauthorized disclosure of data. The design and construction of prototype k"
