["https://www.schneier.com/books/a-hackers-mind"]
title = "A Hacker's Mind - Schneier on Security"
description = "A Hacker’s Mind How the Powerful Bend Society’s Rules, and How to Bend them Back A Book by Bruce Schneier It’s not just computers—hacking is everywhere. Legendary cybersecurity expert and New York Times best-selling author Bruce Schneier reveals how using a hacker’s mindset can change how you think about your life and the world. A hack is any means of subverting a system’s rules in unintended ways. The tax code isn’t computer code, but a series of complex formulas. It has vulnerabilities; we call them “loopholes.” We call exploits “tax avoidance strategies.” And there is an entire industry of “black hat” hackers intent on finding exploitable loopholes in the tax code. We call them accountants and tax attorneys..."
full_description = "February 7, 2023W. W. Norton304 PagesISBN (Hardcover): 978-0-393-86666-7ISBN (Paperback): 978-1-324-07453-3ISBN (Ebook): 978-0-393-86667-4Publisher's Book Page Ordering Hardcover: Amazon | Barnes & Noble | Books-a-Million | Bookshop.org | Powell's | Walmart | W. W. Norton Paperback: Amazon | Barnes & Noble | Books-a-Million | Bookshop.org | Powell's | Walmart | W. W. Norton Ebook: Amazon | Apple Books | Barnes and Noble | Kobo Audiobook: Amazon | Apple Books | Audible | Audiobooks.com | Barnes & Noble | Google Play | Kobo | Libro.fm Order signed copies: Hardcover HomeBooks A Hacker’s Mind How the Powerful Bend Society’s Rules, and How to Bend them Back A Book by Bruce Schneier It’s not just computers—hacking is everywhere. Legendary cybersecurity expert and New York Times best-selling author Bruce Schneier reveals how using a hacker’s mindset can change how you think about your life and the world. A hack is any means of subverting a system’s rules in unintended ways. The tax code isn’t computer code, but a series of complex formulas. It has vulnerabilities; we call them “loopholes.” We call exploits “tax avoidance strategies.” And there is an entire industry of “black hat” hackers intent on finding exploitable loopholes in the tax code. We call them accountants and tax attorneys. In A Hacker’s Mind, Bruce Schneier takes hacking out of the world of computing and uses it to analyze the systems that underpin our society: from tax laws to financial markets to democracy. He reveals an array of powerful actors whose hacks bend our economic, political, and legal systems to their advantage, at the expense of everyone else. Once you learn how to notice hacks, you’ll start seeing them everywhere—and you’ll never look at the world the same way again. Almost all systems have loopholes, and this is by design. Because if you can take advantage of them, the rules no longer apply to you. Unchecked, these hacks threaten to upend our financial markets, weaken our democracy, and even affect the way we think. And when artificial intelligence starts thinking like a hacker—at inhuman speed and scale—the results could be catastrophic. But for those who would don the “white hat,” we can understand the hacking mindset and rebuild our economic, political, and legal systems to counter those who would exploit our society. And we can harness artificial intelligence to improve existing systems, predict and defend against hacks, and realize a more equitable world. Excerpts Chapter 59 Reviews of A Hacker’s Mind Associated Press Ben Rothke Booklist California Litigation Financial Times Kirkus (starred review) The New York Times Pluralistic (Cory Doctorow) Publishers Weekly (starred review) RSA Conference (Ben Rothke) Science Strategist Post Web Informant Audiobook Sample Listen to a Sample of the Audiobook Related Essays CNN Slate Whatever (The Big Idea) Related Talks Harvard Kennedy School Ash Center Next Big Idea Club Related Interviews BarCode Cool Science Radio Cyber Security America Cybercrime Magazine Podcast Cyberlaw Podcast Dispatches from the War Room Harvard Kennedy School Ash Center Keen On Lawfare Podcast Marketplace Techtonic Usable Security Podcast Next Big Idea Club A Hacker’s Mind was a Next Big Idea Club Must-Read Book for February 2023. Book Cover High-resolution book cover Praise for A Hacker’s Mind “[An] excellent survey of exploitation. . . With lessons that extend far beyond the tech world, this has much to offer.” —Publishers Weekly (starred review) “An eye-opening, maddening book that offers hope for leveling a badly tilted playing field.” —Kirkus Reviews (starred review) “They say that rules are made to be broken, but more often rules are gamed, finessed, worked around, or subverted―in short, hacked. No one is better equipped than Bruce Schneier to explain how this often-perverse use of human ingenuity can undermine the institutions that civilized life depends on. A Hacker’s Mind is an important source of new insights on the forces that can sap the vigor and integrity of modern society.” —Steven Pinker, Johnstone Family Professor of Psychology, Harvard University, and author of Rationality “A Hacker’s Mind brilliantly explains how our society and democracy are being shaped by people taking the ‘hacking’ mentality into realms that weren’t designed to be hacked. Bruce Schneier shows how hacking, the tool of the rebel and the outsider, can also be used by the rich and powerful to win in business and politics, at great cost to the civic commitment needed for our free society. A great read and an important book!” ―Timothy H. Edgar, author of Beyond Snowden “An essential new perspective on hacking: the bad and the ugly, but also a surprisingly optimistic way of using a hacker mentality to solve society’s complex problems.” ―Marietje Schaake, international policy director at Stanford University Cyber Policy Center and member of European Parliament, 2009–2019 “By uncovering how the rich, powerful, and clever are misusing our institutions for their own gain, A Hacker’s Mind will transform how you think about the challenges our society faces and how to fix them. Erudite and funny, Bruce Schneier’s book is a must-read for anyone concerned about our democracy in the digital and data age.” ―Beth Simone Noveck, author of Solving Public Problems up to Books Sidebar photo of Bruce Schneier by Joe MacInnis. Powered by WordPress Hosted by Pressable"
