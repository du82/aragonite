full_description = "HomeNewsletter Unsubscribe from Crypto-Gram The easiest way to leave the Crypto-Gram list is to use the one-click unsubscribe link at the bottom of the email. This ensures that you’re unsubscribing the right address. If you already deleted the email, you can unsubscribe from the list here. up to Newsletter Sidebar photo of Bruce Schneier by Joe MacInnis. Powered by WordPress Hosted by Pressable The easiest way to leave the Crypto-Gram list is to use the one-click unsubscribe link at the bottom of the email. This ensures that you’re unsubscribing the right address. I am a public-interest technologist, working at the intersection of security, technology, and people. I've been writing about security issues on my blog since 2004, and in my monthly newsletter since 1998. I'm a fellow and lecturer at Harvard's Kennedy School, a board member of EFF, and the Chief of Security Architecture at Inrupt, Inc. This personal website expresses the opinions of none of those organizations."
