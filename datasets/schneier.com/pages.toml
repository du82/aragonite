title = "News Archive - Schneier on Security"
full_description = "Home Latest News Nearly 10 Years After Data and Goliath, Bruce Schneier Says: Privacy’s Still Screwed “In 50 years, I think we'll view these business practices like we view sweatshops today” Iain ThomsonThe RegisterFebruary 15, 2025 It has been nearly a decade since famed cryptographer and privacy expert Bruce Schneier released the book Data and Goliath: The Hidden Battles to Collect Your Data and Control Your World—an examination of how government agencies and tech giants exploit personal data. Today, his predictions feel eerily accurate. At stake, he argued then, was a possibly irreversible loss of privacy, and the archiving of everything. As he wrote, science fiction author Charlie Stross described the situation as the “end of prehistory,” in that every facet of our lives would be on a computer somewhere and available to anyone who knew how to find them… Read More → Video: The Social Responsibility of the Technologist Peter CarrJanuary 27, 2025 Watch the Video on YouTube.com Technologists have a responsibility to be aware of the impact of their activities. This discussion with Bruce Schneier considers artificial intelligence and democracy, cybersecurity, modern warfare, government data leaks and the internet of things, along with Bruce’s belief that a hacker’s mindset will help people better understand their lives and the world today. Read More → “Have a Good Bullshit Detector,” Advises Computer Security Expert Bruce Schneier Cyberspace seems more insecure than it has for a long time. In an interview, security guru Bruce Schneier proposes a radical solution: Top-tier managers should have to go to prison if they fail to protect their company networks against hacker attacks. Marie-Astrid LangerNZZJanuary 10, 2025 Summary Bruce Schneier, security expert, says improved defense measures against cyberattacks are urgently needed. Quantum computers do not pose a fundamental threat to cryptosecurity, Schneier says, but cryptographic agility will be important. The main problems in the field of cybersecurity are economic and regulatory, he says, rather than technological shortcomings. Cybersecurity is facing a tough challenge. Hospitals, schools and companies are constantly falling victim to ransomware attacks. Criminals are draining life savings from unsuspecting citizens through “pig-butchering” attacks. Even American government systems do not seem immune to hackers—Chinese attackers recently penetrated the largest telecommunications networks in the U.S. and … Read More → Researchers Find Some Worry, Some Hope for AI in Democracy Experts say intense focus on artificial intelligence as a misinformation tool can miss the mark Jennifer SmithCommonWealth BeaconDecember 10, 2024 When it comes to the 2024 election season, the democratic sky didn’t fall because of artificial intelligence, Harvard researchers say, with candidates using the technology to reach voters in helpful new ways. But, they warn, it is still worth keeping a wary eye on some of AI’s most insidious possible applications. New Englanders may recall the use of artificial intelligence to mimic President Joe Biden’s voice to dissuade voters from participating in the New Hampshire Democratic primary. More than a dozen states, including Massachusetts, have adopted or … Read More → Audio: Does AI Interfere in Our Democracy? CommonWealth BeaconDecember 4, 2024 Listen to the Audio on CommonWealthBeacon.com This week on the Codcast, CommonWealth Beacon’s Jennifer Smith is joined by Bruce Schneier, fellow and lecturer in public policy at the Harvard Kennedy School, and Nathan Sanders, fellow at the Berkman Klein Center for Internet & Society. They discuss how AI has the power to strengthen civic engagement in elections and policymaking, the importance of transparency it its use, and how it can be developed to prioritize democratic values. Read More → Audio: Firewalls Don’t Stop Dragons Episode 100 Special Firewalls Don't Stop DragonsOctober 28, 2024 Listen to the Audio on FirewallsDontStopDragons.com The first episode of Firewalls Don’t Stop Dragons Podcast aired on March 8, 2017 – almost 8 years ago now. Over that time, I’ve interviewed over 135 unique and amazing people, covered countless cybersecurity and privacy stories, and offered 100s of tips for protecting your devices and data. To celebrate this momentous occasion, world-renowned cryptography guru Bruce Schneier has returned to for our traditional Podcentennial interview! We discuss several timely topics including the Crowdstrike incident, the pager bombing and supply attacks more generally, US election security, the open market for cyber vulnerabilities, US intelligence agencies’ focus on offense versus defense, how AI might actually benefit democracy and much more!… Read More → Video: Supply Chain Security. Recent Attacks Highlight Risks. Cybercrime MagazineOctober 18, 2024 Listen to the Audio on YouTube.com Bruce Schneier, an internationally renowned security technologist, is the New York Times best-selling author of A Hacker’s Mind. In this episode, he joins host Paul John Spaulding to discuss an opinion piece he authored, which was recently published in the New York Times, called “Israel’s Pager Attacks Have Changed the World.” Together, they unpack how international supply chains leave us vulnerable, how geopolitical tensions can lead to increased risk, and more. Read the full story at https://www.nytimes.com/2024/09/22/opinion/israel-pager-attacks-supply-chain.html… Read More → Bruce Schneier on AI Security (Interview) In this interview, Bruce Schneier reflects on the security challenges of artificial intelligence. Hal BerghelComputerOctober 15, 2024 View or Download in PDF Format Bruce Schneier is without question one of the leading computer security professionals alive today. A true renaissance man when it comes to cybersecurity, he has been involved in the creation of a host of cryptographic algorithms (most notably, Blowfish and Twofish) and has written more than a dozen books, including Data and Goliath: The Hidden Battles to Collect Your Data and Control Your World and Click Here to Kill Everybody: Security and Survival in a Hyper-Connected World. Schneier is a lecturer in public policy at the Harvard Kennedy School, a fellow at the Berkman Klein Center for Internet and Society, and a board member of the Electronic Frontier Foundation and AccessNow. This interview resulted from our e-mail exchanges during June and July 2024… Read More → Audio: Technology Regulation is Outdated with Bruce Schneier EasyPrey PodcastSeptember 18, 2024 Listen to the Audio on EasyPrey.com Today’s guest is Bruce Schneier. Bruce is an internationally renowned security technologist called The Security Guru by The Economist. He is the author of over a dozen books including his latest, A Hacker’s Mind. He has testified before Congress, is a frequent guest on television and radio, has served on several government committees, and is regularly quoted in the press. He is a fellow at the Berkman-Klein Center for Internet and Society at Harvard University, a lecturer in Public Policy at Harvard Kennedy School, a board member of the Electronic Frontier Foundation and AccessNow, and an advisory board member of EPIC and VerifiedVoting.org… Read More → Audio: The State of Online Security with Bruce Schneier Deep Takes Not FakesSeptember 10, 2024 Listen to the Audio on PodcastPage.io As technology evolves at blinding speeds, so too does the world of cybersecurity. But is online security keeping up with the demands of this digital age? Today we are joined by Bruce Schneier, a public-interest technologist working at the intersection of security, technology, and people. Known as the “security guru,” Bruce has written over twelve books and hundreds of articles, essays, and academic papers, and he joins us today to share his thoughts on the current state of online security. We learn about Bruce’s professional background and interests before diving into the biggest security threats and challenges that business leaders face today. We unpack the role of AI in cybersecurity, where cryptography fits in, why national cybersecurity vulnerabilities are a bigger concern than many realize, and the role of new technology in building or breaking trust in this digital age. We end by examining the possible future of digital rights management, and Bruce shares some helpful advice for all Chief Information Officers to keep top-of-mind… Read More → ← Earlier News Sidebar photo of Bruce Schneier by Joe MacInnis. Powered by WordPress Hosted by Pressable"
