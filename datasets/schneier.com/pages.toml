["https://www.schneier.com/blog/archives/2024/07/radius-vulnerability.html"]
title = "RADIUS Vulnerability - Schneier on Security"
description = "New attack against the RADIUS authentication protocol: The Blast-RADIUS attack allows a man-in-the-middle attacker between the RADIUS client and server to forge a valid protocol accept message in response to a failed authentication request. This forgery could give the attacker access to network devices and services without the attacker guessing or brute forcing passwords or shared secrets. The attacker does not learn user credentials. This is one of those vulnerabilities that comes with a cool name, its own website, and a logo. News article. Research ..."
full_description = "RADIUS Vulnerability New attack against the RADIUS authentication protocol: The Blast-RADIUS attack allows a man-in-the-middle attacker between the RADIUS client and server to forge a valid protocol accept message in response to a failed authentication request. This forgery could give the attacker access to network devices and services without the attacker guessing or brute forcing passwords or shared secrets. The attacker does not learn user credentials. This is one of those vulnerabilities that comes with a cool name, its own website, and a logo. News article. Research paper. Tags: academic papers, authentication, man-in-the-middle attacks, protocols, vulnerabilities Posted on July 10, 2024 at 10:42 AM • 6 Comments ngô ############ long • July 10, 2024 10:10 PM on a scale from 1-10, how screwed up are we? i mean RADIUS is an incredibly common protocol used for securing info Marcel • July 11, 2024 2:00 AM It is a shame that in 2024, people are still using MD5 in security applications. That should already warrant an 11 out of 10 for ignorance. The actual problem IMHO is that we are still sending personal information (usernames, activity patterns, …) around in plaintext in 2024. Encapsulating this kind of traffic in (D)TLS should be best practice, at least. So, I would give a 10 out of 10 for neglicence, but only a 3 out of 10 for impact of this new vulnerability. But everybody, please, please, start encapsulating/tunneling this traffic NOW. (And then switch from MD5 to SHA-2/3. I know, this will take years, so embed this in TLS, then we have time to fix the rest.) ResearcherZero • July 11, 2024 2:26 AM Collisions online in less than five minutes depending on hardware. RADIUS has not been updated to remove MD5… “Unfortunately, although the proposals for RADIUS over TLS have existed for a decade, many systems continue to use RADIUS/UDP. Deploying TLS and maintaining a public-key infrastructure continues to be a much more involved process for system administrators than simply using UDP; many of the challenges are documented in the (D)TLS Internet Draft.” ‘https://www.blastradius.fail/pdf/radius.pdf To mitigate this attack, we recommend servers always include a Message-Authenticator as the first attribute in any response. This appears to prevent the above attack even if a client does not validate the HMAC-MD5. https://support.microsoft.com/en-us/topic/kb5040268-how-to-manage-the-access-request-packets-attack-vulnerability-associated-with-cve-2024-3596-a0e2f0b1-f200-4a7b-844f-48d1d5ab9e66"
