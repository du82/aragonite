title = 'Microsoft Takes Legal Action Against AI "Hacking as a Service" Scheme - Schneier on Security'
description = "Not sure this will matter in the end, but it’s a positive move: Microsoft is accusing three individuals of running a “hacking-as-a-service” scheme that was designed to allow the creation of harmful and illicit content using the company’s platform for AI-generated content. The foreign-based defendants developed tools specifically designed to bypass safety guardrails Microsoft has erected to prevent the creation of harmful content through its generative AI services, said Steven Masada, the assistant general counsel for Microsoft’s Digital Crimes Unit. They then compromised the legitimate accounts of paying customers. They combined those two things to create a fee-based platform people could use..."
full_description = "Microsoft Takes Legal Action Against AI “Hacking as a Service” Scheme Not sure this will matter in the end, but it’s a positive move: Microsoft is accusing three individuals of running a “hacking-as-a-service” scheme that was designed to allow the creation of harmful and illicit content using the company’s platform for AI-generated content. The foreign-based defendants developed tools specifically designed to bypass safety guardrails Microsoft has erected to prevent the creation of harmful content through its generative AI services, said Steven Masada, the assistant general counsel for Microsoft’s Digital Crimes Unit. They then compromised the legitimate accounts of paying customers. They combined those two things to create a fee-based platform people could use. It was a sophisticated scheme: The service contained a proxy server that relayed traffic between its customers and the servers providing Microsoft’s AI services, the suit alleged. Among other things, the proxy service used undocumented Microsoft network application programming interfaces (APIs) to communicate with the company’s Azure computers. The resulting requests were designed to mimic legitimate Azure OpenAPI Service API requests and used compromised API keys to authenticate them. Slashdot thread. Tags: AI, hacking, LLM, Microsoft Posted on January 13, 2025 at 7:01 AM • 9 Comments Kukumix • January 13, 2025 7:17 AM Is Microsoft masking here its own mistakes? “They then compromised the legitimate accounts of paying customers” – we have seen in the past multiple deep security holes in Azure. Have they exploited those? “Among other things, the proxy service used undocumented Microsoft network application programming interfaces (APIs) to communicate with the company’s Azure computers” – sounds like another security hole in Microsoft. Clive Robinson • January 13, 2025 9:29 AM @ Bruce, ALL, In another “news source”, https://arstechnica.com/security/2025/01/microsoft-sues-service-for-creating-illicit-content-with-its-ai-platform/ Dan Goodin says, “All 10 defendants were named John Doe because Microsoft doesn’t know their identity.” And goes on to say seven of them were customers of the illicit service. And more importantly, it appears access credentials were compromised. Microsoft is not saying how or on who’s servers the credentials were stored. Another article indicates Microsoft have been busy in the courts getting permission to raid and grab a server…"
