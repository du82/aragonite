title = "Phishing False Alarm - Schneier on Security"
description = "A very security-conscious company was hit with a (presumed) massive state-actor phishing attack with gift cards, and everyone rallied to combat it—until it turned out it was company management sending the gift cards."
full_description = "Phishing False Alarm A very security-conscious company was hit with a (presumed) massive state-actor phishing attack with gift cards, and everyone rallied to combat it—until it turned out it was company management sending the gift cards. Tags: false positives, phishing Posted on January 15, 2025 at 7:00 AM • 11 Comments Who? • January 15, 2025 12:04 PM What company was that?!? “[…] but the going theory was that a state actor was nearly certainly the source.” They are really paranoid. A good movement in our times, I guess. Even Siemens AG has been targeted by state actors (NSA in this case). It was just a matter of industrial espionage, possibly looking for the source code of Siemens SCADA systems to research vulnerabilities to exploit on an existing installation. Clive Robinson • January 15, 2025 2:35 PM @ Bruce, ALL, It begs the question, “For every false alarm, how many that are not?” As I oft note, “Having all computers properly segregated from all external communications mitigates many issues.” Whilst mostly not interfering with employee work or workflow. In fact people have found that over all “productivity” increases. I was surprised by one “environment” where although apparent productivity went down in one department, actual overall productivity of the product went up (the reason I’ve mentioned before). Andy • January 15, 2025 3:59 PM It’s a made-up story. No head of HR would spend time to bypass internal controls and make something look genuine if it could have just been a simple line in the payroll Carl Fink • January 15, 2025 7:28 PM I read that story, but it never occurred to me to think it really happened as described. NAR doesn’t vet stories. Bernie • January 16, 2025 10:18 AM @ Clive, other Old-Timers, Do you ever miss the days when all you had to do to make (new) users happy was put the Internet onto a floppy so they could always have it with them? It is often amazing what people think they need vs what the actually need."
