title = "March 2005 - Schneier on Security"
full_description = "Why Surveillance Cameras Don't Reduce Crime Interesting essay. Tags: cameras, crime, law enforcement, privacy, surveillance Posted on March 31, 2005 at 10:55 AM • 40 Comments ID Theft is Inescapable The Register says what I’ve been saying all along: While this is nothing new, there is an important observation here that’s worth emphasizing: none of these cases involved online transactions. Many people innocently believe that they’re safe from credit card fraud and identity theft in the brick and mortar world. Nothing could be farther from the truth. The vast majority of incidents can be traced to skimming, dumpster diving, and just plain stupidity among those who “own” our personal data. Only a small fraction of such incidents result from online transactions. Every time you pay by check, use a debit or credit card, or fill out an application for insurance, housing, credit, employment, or education, you lose control of sensitive data. In the US, a merchant is at liberty to do anything he pleases with the information, and this includes selling it to a third party without your knowledge or permission, or entering it into a computerized database, possibly with lax access controls, and possibly connected to the Internet. Sadly, Congress’s response has been to increase the penalties for identity theft, rather than to regulate access to, and use of, personal data by merchants, marketers, and data miners. Incredibly, the only person with absolutely no control over the collection, storage, security, and use of such sensitive information is its actual owner. For this reason, it’s literally impossible for an individual to prevent identity theft and credit card fraud, and it will remain impossible until Congress sees fit to regulate the privacy invasion industry. Tags: databases, fraud, identity theft, laws, privacy Posted on March 30, 2005 at 7:35 AM • 35 Comments More on ChoicePoint EPIC Executive Director Marc Rotenberg’s testimony before the House Subcommittee on Commerce, Trade and Consumer Protection is worth reading. Tags: background checks, crime, data breaches, EPIC, identity theft, laws, privacy Posted on March 29, 2005 at 8:32 AM • 12 Comments"
