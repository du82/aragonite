title = "Cryptanalysis of SPEED (Extended Abstract) - Schneier on Security"
description = "ABSTRACT: The cipher family SPEED (and an associated hashing mode) was recently proposed in Financial Cryptography ’97. In cryptanalyzing the cipher we found several troubling potential weaknesses. Next, we were able to efficiently break the SPEED hashing mode using differential related-key techniques. Finally, we examined differential attacks against the 48-round version of SPEED. These results raise some significant questions about the security of the SPEED design. [full text – PDF (Acrobat)] [full text – postscript]"
full_description = "Cryptanalysis of SPEED (Extended Abstract) C. Hall, J. Kelsey, and B. Schneier and D. WagnerFinancial Cryptography '98, Springer-Verlag, 1998, pp. 309-310. ABSTRACT: The cipher family SPEED (and an associated hashing mode) was recently proposed in Financial Cryptography ’97. In cryptanalyzing the cipher we found several troubling potential weaknesses. Next, we were able to efficiently break the SPEED hashing mode using differential related-key techniques. Finally, we examined differential attacks against the 48-round version of SPEED. These results raise some significant questions about the security of the SPEED design. [full text – PDF (Acrobat)] [full text – postscript] Categories: Algorithm Analyses"
