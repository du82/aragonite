title = "More on My AI and Democracy Book - Schneier on Security"
description = "In July, I wrote about my new book project on AI and democracy, to be published by MIT Press in fall 2025. My co-author and collaborator Nathan Sanders and I are hard at work writing. At this point, we would like feedback on titles. Here are four possibilities: Rewiring the Republic: How AI Will Transform our Politics, Government, and Citizenship The Thinking State: How AI Can Improve Democracy Better Run: How AI Can Make our Politics, Government, Citizenship More Efficient, Effective and Fair AI and the New Future of Democracy: Changes in Politics, Government, and Citizenship..."
full_description = "More on My AI and Democracy Book In July, I wrote about my new book project on AI and democracy, to be published by MIT Press in fall 2025. My co-author and collaborator Nathan Sanders and I are hard at work writing. At this point, we would like feedback on titles. Here are four possibilities: Rewiring the Republic: How AI Will Transform our Politics, Government, and Citizenship The Thinking State: How AI Can Improve Democracy Better Run: How AI Can Make our Politics, Government, Citizenship More Efficient, Effective and Fair AI and the New Future of Democracy: Changes in Politics, Government, and Citizenship What we want out of the title is that it convey (1) that it is a book about AI, (2) that it is a book about democracy writ large (and not just deepfakes), and (3) that it is largely optimistic. What do you like? Feel free to do some mixing and matching: swapping “Will Transform” for “Will Improve” for “Can Transform” for “Can Improve,” for example. Or “Democracy” for “the Republic.” Remember, the goal here is for a title that will make a potential reader pick the book up off a shelf, or read the blurb text on a webpage. It needs to be something that will catch the reader’s attention. (Other title ideas are here). Also, FYI, this is the current table of contents: Introduction 1. Introduction: How AI will Change Democracy 2. Core AI Capabilities 3. Democracy as an Information System Part I: AI-Assisted Politics 4. Background: Making Mistakes 5. Talking to Voters 6. Conducting Polls 7. Organizing a Political Campaign 8. Fundraising for Politics 9. Being a Politician Part II: AI-Assisted Legislators 10. Background: Explaining Itself 11. Background: Who’s to Blame? 12. Listening to Constituents 13. Writing Laws 14. Writing More Complex Laws 15. Writing Laws that Empower Machines 16. Negotiating Legislation Part III: The AI-Assisted Administration 17. Background: Exhibiting Values and Bias 18. Background: Augmenting Versus Replacing People 19. Serving People 20. Operating Government 21. Enforcing Regulations Part IV: The AI-Assisted Court 22. Background: Being Fair 23. Background: Getting Hacked 24. Acting as a Lawyer 25. Arbitrating Disputes 26. Enforcing the Law 27. Reshaping Legislative Intent 28. Being a Judge Part V: AI-Assisted Citizens 29. Background: AI and Power 30. Background: AI and Trust 31. Explaining the News 32. Watching the Government 33. Moderating, Facilitating, and Building Consensus 34. Acting as Your Personal Advocate 35. Acting as Your Personal Political Proxy Part VI: Ensuring That AI Benefits Democracy 36. Why AI is Not Yet Good for Democracy 37. How to Ensure AI is Good for Democracy 38. What We Need to Do Now 39. Conclusion Everything is subject to change, of course. The manuscript isn’t due to the publisher until the end of March, and who knows what AI developments will happen between now and then. EDITED: The title under consideration is “Rewiring the Republic,” and not “Rewiring Democracy.” Although, I suppose, both are really under consideration. Tags: AI, books, democracy, Schneier news Posted on October 11, 2024 at 3:00 PM • 34 Comments"
