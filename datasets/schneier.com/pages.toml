["https://www.schneier.com/tag/afghanistan"]
title = "Afghanistan Archives - Schneier on Security"
full_description = "Insurgent Groups Exhibit Learning Curve Interesting research: After analyzing reams of publicly available data on casualties from Iraq, Afghanistan, Pakistan and decades of terrorist attacks, the scientists conclude that “insurgents pretty much seemed to be following a progress curve—or a learning curve—that’s very common in the manufacturing literature,” says physicist Neil Johnson of the University of Miami in Florida and lead author of the study. Paper here. Posted on July 12, 2011 at 7:13 AM • View Comments Defeating al Qaeda Rare common sense: But Gen Richards told the BBC it was not possible to defeat the Taliban or al-Qaeda militarily. “You can’t. We’ve all said this. David Petraeus has said it, I’ve said it. “The trick is the balance of things that you’re doing and I say that the military are just about, you know, there. “The biggest problem’s been ensuring that the governance and all the development side can keep up with it within a time frame and these things take generations sometimes within a time frame that is acceptable to domestic, public and political opinion,” he said. […] Shadow defence secretary Jim Murphy told the BBC Gen Richards was “right” that there was no purely military solution and said there would be “no white flag surrender moment”. “This is a complicated issue. It will be for the long haul. It’s got to do with history. “But I think he’s right to talk about the different ways that this has got to be taken on – militarily yes but diplomatically and in a peaceful sense of nation building in Afghanistan is also important,” he said. Posted on November 22, 2010 at 1:08 PM • View Comments WikiLeaks Insurance File Now this is an interesting development: In the wake of strong U.S. government statements condemning WikiLeaks’ recent publishing of 77,000 Afghan War documents, the secret-spilling site has posted a mysterious encrypted file labeled “insurance.” The huge file, posted on the Afghan War page at the WikiLeaks site, is 1.4 GB and is encrypted with AES256. The file’s size dwarfs the size of all the other files on the page combined. The file has also been posted on a torrent download site. It’s either 1.4 Gig of embarrassing secret documents, or 1.4 Gig of random data bluffing. There’s no way to know. If WikiLeaks wanted to prove that their “insurance” was the real thing, they should have done this: Encrypt each document with a separate AES key. Ask someone to publicly tell them to choose a random document. Publish the decryption key for that document only. That would be convincing. In any case, some of the details might be wrong. The file might not be encrypted with AES256. It might be Blowfish. It might be OpenSSL. It might be something else. Some more info here. EDITED TO ADD (8/9): Weird Iranian paranoia: An Iranian IT expert warned here on Wednesday that a mysterious download file posted by the WikiLeaks website, labeled as ‘Insurance’, is likely a spy software used for identifying the information centers of the United States’ foes. “The mysterious file of the WikiLeaks might be a trap for intelligence gathering,” Hossein Mohammadi told FNA on Wednesday. The expert added that the file will attract US opponents and Washington experts can identify their enemy centers by monitoring individuals’ or organizations’ tendency and enthusiasm for the file. Posted on August 4, 2010 at 7:52 AM • View Comments"
