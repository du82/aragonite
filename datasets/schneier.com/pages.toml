["https://www.schneier.com/blog/archives/2024/06/recovering-public-keys-from-signatures.html"]
title = "Recovering Public Keys from Signatures - Schneier on Security"
description = "Interesting summary of various ways to derive the public key from digitally signed files. Normally, with a signature scheme, you have the public key and want to know whether a given signature is valid. But what if we instead have a message and a signature, assume the signature is valid, and want to know which public key signed it? A rather delightful property if you want to attack anonymity in some proposed “everybody just uses cryptographic signatures for everything” scheme."
full_description = "Recovering Public Keys from Signatures Interesting summary of various ways to derive the public key from digitally signed files. Normally, with a signature scheme, you have the public key and want to know whether a given signature is valid. But what if we instead have a message and a signature, assume the signature is valid, and want to know which public key signed it? A rather delightful property if you want to attack anonymity in some proposed “everybody just uses cryptographic signatures for everything” scheme. Tags: anonymity, cryptanalysis, keys, signatures Posted on June 20, 2024 at 7:10 AM • 8 Comments Bruce Schneier • June 20, 2024 7:10 AM All comments are now being held for moderation. For details, see this blog post. Clive Robinson • June 20, 2024 8:21 AM @ Bruce, ALL, “But what if we instead have a message and a signature, assume the signature is valid, and want to know which public key signed it?” The “theory” was that the signing process would inherit the “One Way Function”(OWF) properties of being non reversible, thus the only attack would be a form of “Dictionary Attack” we used to call “Rainbow Tables” However it was obvious from the get go that no such signature would be “unique to a message”. That is there would be an infinite number of messages that would produce the same signature either from a single Key or all Keys. It’s the same issue as the numbers between the natural numbers. There is an infinite number of rational numbers and between those an infinite number of real numbers. The problem is that all common usable presentations give a “string of digits” that gets truncated in some way so are in fact the equivalent of natural numbers that produce the same string of digits. This in turn tells us there will be interesting effects such as we get with other counting systems. cybershow • June 20, 2024 3:15 PM The article seemed a little confusing in purpose until “public keys are public”. Not immediately obvious what the threat was and it needed a standard Alice, Bob and Eve set-up with the misunderstandings explained. That said, these edge case misunderstandings like “I can encrypt and sign something and, notwithstanding any routing and meta-data leakage an eavesdropper will not know it came from me” are fascinating – not exactly counter-intuitive, but serious foot-guns for the average user saddled with numerous weak assumptions. Here’s my thoughts this week on splits in cybersecurity and how “professional” and “consumer” worlds may diverge as people are hoodwinked into poor security by tech companies who have an obvious financial interest in poor security – an “insecurity industry”."
