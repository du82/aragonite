["https://www.schneier.com/blog/archives/2024/07/on-the-csrbs-non-investigation-of-the-solarwinds-attack.html"]
title = "On the CSRB's Non-Investigation of the SolarWinds Attack - Schneier on Security"
description = "ProPublica has a long investigative article on how the Cyber Safety Review Board failed to investigate the SolarWinds attack, and specifically Microsoft’s culpability, even though they were directed by President Biden to do so."
full_description = "On the CSRB’s Non-Investigation of the SolarWinds Attack ProPublica has a long investigative article on how the Cyber Safety Review Board failed to investigate the SolarWinds attack, and specifically Microsoft’s culpability, even though they were directed by President Biden to do so. Tags: cyberattack, cyberespionage, DHS, Microsoft, national security policy, Russia Posted on July 8, 2024 at 1:59 PM • 10 Comments Clive Robinson • July 8, 2024 2:48 PM As the article notes, 1, “Microsoft had long known about — but refused to address — a flaw used in the hack.” 2, “The tech company’s failure to act reflected a corporate culture that prioritized profit over security and left the U.S. government vulnerable” Not just the US Government but many US businesses and many other Governments and Businesses world wide. Any one else have the feeling that it’s not just Microsoft but other Silicon Valley Corps and major software companies around the globe as well? Any one else remember Oracle and how those who used their product were told investigating security faults with the code was in effect a criminal act? It’s been argued in the past that Microsoft “made the model” by which software is produced and licensed back in the 1980’s and by the 1990’s it was a total disaster. But the simple fact is all of the consumer and commercial software venders have to behave this way, because for various reasons a “Free Market” was allowed to become a “Race for the Bottom” without legislation or regulation ensuring “fit for market” that most other products have to abide by. Now it would appear the software industry feels like it is now better than those large financial organisations that were, “To large to fail” Of the “Financial Crisis” a couple of decades back. The fall out of which we are still dealing with extraordinarily badly. Which raises the question, “How long in decades if evere is it going to take to sort the software industry out so that it meets the minimum of ‘Fit to Market’?” It’s a question I’ve asked before a couple of times since this blog came into existence. And like others I’ve also pointed out some of the changes that need to be made, but here we are and nothing has changed…"
