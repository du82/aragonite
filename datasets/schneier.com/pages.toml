["https://www.schneier.com/tag/aclu"]
title = "ACLU Archives - Schneier on Security"
full_description = "How Did Facebook Beat a Federal Wiretap Demand? This is interesting: Facebook Inc. in 2018 beat back federal prosecutors seeking to wiretap its encrypted Messenger app. Now the American Civil Liberties Union is seeking to find out how. The entire proceeding was confidential, with only the result leaking to the press. Lawyers for the ACLU and the Washington Post on Tuesday asked a San Francisco-based federal court of appeals to unseal the judge’s decision, arguing the public has a right to know how the law is being applied, particularly in the area of privacy. […] The Facebook case stems from a federal investigation of members of the violent MS-13 criminal gang. Prosecutors tried to hold Facebook in contempt after the company refused to help investigators wiretap its Messenger app, but the judge ruled against them. If the decision is unsealed, other tech companies will likely try to use its reasoning to ward off similar government requests in the future. Here’s the 2018 story. Slashdot thread. Posted on April 29, 2020 at 12:29 PM • View Comments Internet Voting in Puerto Rico Puerto Rico is considered allowing for Internet voting. I have joined a group of security experts in a letter opposing the bill. Cybersecurity experts agree that under current technology, no practically proven method exists to securely, verifiably, or privately return voted materials over the internet. That means that votes could be manipulated or deleted on the voter’s computer without the voter’s knowledge, local elections officials cannot verify that the voter’s ballot reflects the voter’s intent, and the voter’s selections could be traceable back to the individual voter. Such a system could violate protections guaranteeing a secret ballot, as outlined in Section 2, Article II of the Puerto Rico Constitution. The ACLU agrees. Posted on March 24, 2020 at 6:01 AM • View Comments ACLU on the GCHQ Backdoor Proposal Back in January, two senior GCHQ officials proposed a specific backdoor for communications systems. It was universally derided as unworkable—by me, as well. Now Jon Callas of the ACLU explains why. Posted on July 30, 2019 at 6:19 AM • View Comments"
