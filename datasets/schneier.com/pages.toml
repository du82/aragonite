full_description = "Friday Squid Blogging: Squid the Care Dog The Vanderbilt University Medical Center has a pediatric care dog named “Squid.” Blog moderation policy. Tags: squid Posted on February 14, 2025 at 12:05 PM • 31 Comments Dancing on thin ice • February 14, 2025 1:02 PM The DOGE website doesn’t give much confidence that what they’ve gained access to is being kept secure. Journalists are doing a better job at uncovering corruption or incompetance of those claiming others are the ones not to be trusted. https://www.404media.co/anyone-can-push-updates-to-the-doge-gov-website-2/ Clive Robinson • February 14, 2025 4:13 PM @ Bruce, Another AI dog ate my briefs contents… You would have thought the legal brethren would not just have heard about but learned from the first reported case of a GPT hallucinating in a case bundle and a judge being less than amused… But apparently not. So as a dog returns to it’s vomit… “Mi-Lord may I present exhibit B in the case of the AI barfing it up”, https://www.theregister.com/2025/02/14/attorneys_cite_cases_hallucinated_ai/ Tom Kenney • February 14, 2025 7:03 PM @Dancing It’s information that is supposed to be public record…no? Clive Robinson • February 14, 2025 10:10 PM @ Bruce, Italian’s caught at it again. As you are probably aware I point the finger at both Israeli and Italian “companies” that closely align with their respective Government Agencies to produce “Spyware” and worse. That they also make available –often through Bulgaria– to just about anyone with the money to pay… And so people get hurt and killed by these companies profit making. Well here is another article confirming an Italy Company and it’s Government are still at it, “Italian spyware maker SIO, known to sell its products to government customers, is behind a series of malicious Android apps that masquerade as WhatsApp and other popular apps but steal private data from a target’s device” https://techcrunch.com/2025/02/13/spyware-maker-caught-distributing-malicious-android-apps-for-years/ And apparently not just Android, “Kaspersky said in a 2024 report that the people behind Spyrtacus began distributing the spyware through apps in Google Play in 2018, but by 2019 switched to hosting the apps on malicious web pages made to look like some of Italy’s top internet providers. Kaspersky said its researchers also found a Windows version of the Spyrtacus malware, and found signs that point to the existence of malware versions for iOS and macOS as well.”"
