["https://www.schneier.com/blog/archives/2025/02/story-about-medical-device-security.html"]
title = "Story About Medical Device Security - Schneier on Security"
description = "Ben Rothke relates a story about me working with a medical device firm back when I was with BT. I don’t remember the story at all, or who the company was. But it sounds about right."
full_description = "Story About Medical Device Security Ben Rothke relates a story about me working with a medical device firm back when I was with BT. I don’t remember the story at all, or who the company was. But it sounds about right. Tags: business of security, medicine Posted on February 18, 2025 at 7:06 AM • 10 Comments Brent Hagerty • February 18, 2025 9:49 AM So very very true. As it is said: the more things change, the more they stay the same. Ben Rothke • February 18, 2025 10:52 AM Bruce – thanks for sharing. The link in the article may limit people from seeing it if they don’t have a Medium subscription. The following link allows full access to the article for everyone: https://brothke.medium.com/how-not-to-hire-for-a-senior-information-security-role-4bf71ce7ee26?sk=9cab2444ee1ead944e41ab61445aea4c wiredog • February 18, 2025 1:11 PM “Underpaying for the role” Especially in hourly, 1099, positions. Since I started responding to recruiters with what I’m making now, adjusted for a 1099 (at the very least triple what your hourly take home is), the number of recruiters spamming me has declined quite a bit. “Not understanding the needs for the role” “And just where on my resume did you see any indication I have X years of experience in areas related to role Y?” is often followed by “Ummm. Well…” Clive Robinson • February 18, 2025 2:04 PM @ Bruce, Ben, The problem with finding “specialized recruiters” is that a lot of roles are way more specialised than they appear capable of comprehending… I’m an “odd duck” when it comes to skills as they are many and varied. Back last century I found that mostly recruiters were fairly pointless when dealing with non senior management highly skilled roles. The result I started “talking to others” that worked in areas I have skills in. The result I’ve not been close to a recruiter and I get a larger slice of pie from the start. And more importantly the roles suit me as the glove that fits the required hand. Also for most of my long career all the “best jobs” came not through recruiters but through friends and contacts I trusted asking if “I knew someone who might be interested?” I’m not saying recruiters are universally bad they are not (even I did it for a while). But the big issue is “non aligned incentives” and the higher you are up a technology or other very specialised occupation the less understanding thus alignment that exists."
