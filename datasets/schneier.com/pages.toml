title = "3d printers Archives - Schneier on Security"
full_description = 'Friday Squid Blogging: 3D-Printed Underwater Autonomous "Squid" Pretty neat. As usual, you can also use this squid post to talk about the security stories in the news that I haven’t covered. Posted on November 11, 2016 at 4:02 PM • View Comments Making Handcuff Keys with 3D Printers Handcuffs pose a particular key management problem. Officers need to be able to unlock handcuffs locked by another officer, so they’re all designed to be opened by a standard set of keys. This system only works if the bad guys can’t get a copy of the key, and modern handcuff manufacturers go out of their way to make it hard for regular people to get copies of the key. At the recent HOPE conference, someone made copies of these keys using a 3D printer: In a workshop Friday at the Hackers On Planet Earth conference in New York, a German hacker and security consultant who goes by the name “Ray” demonstrated a looming problem for handcuff makers hoping to restrict the distribution of the keys that open their cuffs: With plastic copies he cheaply produced with a laser-cutter and a 3D printer, he was able to open handcuffs built by the German firm Bonowi and the English manufacturer Chubb, both of which attempt to control the distribution of their keys to keep them exclusively in the hands of authorized buyers such as law enforcement. […] Unlike keys for more common handcuffs, which can be purchased (even in forms specifically designed to be concealable) from practically any survivalist or police surplus store, Bonowi’s and Chubb’s keys can’t be acquired from commercial vendors. Ray says he bought a Chubb key from eBay, where he says they intermittently appear, and obtained the rarer Bonowi key through a source he declined to name. Then he precisely measured them with calipers and created CAD models, which he used to reproduce the keys en masse, both in plexiglass with a friend’s standard laser cutter and in ABS plastic with a Repman 3D printer. Both types of tools can be found in hacker spaces around the U.S. and, in the case of 3D printers, thousands of consumers’ homes. EDITED TO ADD (7/29): Interesting comment. EDITED TO ADD (8/13): Comment from the presenter. Posted on July 25, 2012 at 6:42 AM • View Comments'
