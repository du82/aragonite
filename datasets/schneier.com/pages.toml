title = "Justice Department Indicts Tech CEO for Falsifying Security Certifications - Schneier on Security"
description = "The Wall Street Journal is reporting that the CEO of a still unnamed company has been indicted for creating a fake auditing company to falsify security certifications in order to win government business. EDITED TO ADD (11/14): More info."
full_description = "Justice Department Indicts Tech CEO for Falsifying Security Certifications The Wall Street Journal is reporting that the CEO of a still unnamed company has been indicted for creating a fake auditing company to falsify security certifications in order to win government business. EDITED TO ADD (11/14): More info. Tags: auditing, business of security, certifications, fraud Posted on October 18, 2024 at 9:58 AM • 11 Comments Who? • October 18, 2024 10:33 AM If my search skills are reasonable good yet, he must be Deepak Jain, the CEO of AiNET, a company from Baltimore, Maryland. Obivously, unconfirmed! Clive Robinson • October 18, 2024 11:12 AM Re : “CEO of a still unnamed company” Well a few paragraphs into the WSJ article we find, “Deepak Jain, chief executive of an unnamed information-technology services company operating in Beltsville, Md. “ If true –and it might not be– having the, 1, CEO’s name 2, Likely location of HQ or corporate offices. Will probably come up in the first page of even a DuckDuck search. So just a brain dead search using, [] Gives as almost the first info –after the regurgitating MSM outlets–, https://www.justice.gov/opa/pr/data-center-company-ceo-indicted-major-fraud-and-making-false-statements-us-securities-and Results in further information about Deepak Jain, 1, They were –past tense– CEO 2, They are 49 3, And “of Potomac” Also the Beltsville location is also the companies data center… I could go on but in deference to others sensitivities I will not give the other quite interesting information that rattled out. The point I’m making is that under the way things are “rigged” “Open Source Intel” is rather more simple than others think. Oh and US law unlike UK Law does not realy hold with the, “innocent untill proved guilty” Stricture, which is why I say “Rigged” That is the LEOs and Gov Agencies blabber their mouths of in pretense of observing it, whilst in fact encouraging “trial by media” which automatically prejudices a potential jury member usually in the prosecutions favour… And yes the other information is out there and very easily found thus yes I know the name of the company and somewhat more…"
