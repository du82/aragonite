["https://www.schneier.com/blog/archives/2025/01/privacy-of-photos-apps-enhanced-visual-search.html"]
title = "Privacy of Photos.app's Enhanced Visual Search - Schneier on Security"
description = "Initial speculation about a new Apple feature."
full_description = "Privacy of Photos.app’s Enhanced Visual Search Initial speculation about a new Apple feature. Tags: Apple, searches Posted on January 6, 2025 at 7:06 AM • 8 Comments Clive Robinson • January 6, 2025 10:23 AM @ ALL, How ever you want to look at it, the re are two things that are undeniable, 1, It’s on device scanning of user data. 2, It phones home to the mothership. Prior to the bare Knuckle arguments between the previous Executive members who staffed positions in the FBI and DoJ and the more thoughtful privacy advocates over Communications Crypto & E2EE and what by any other name were Enhanced CALEA “back doors”, some were making warnings about “on device access to the User Data” that bypassed encryption and went directly to “plaintext user data”. Apple previously tried this with the “dog whistle” of “think of the children” and the alleged ability to spot CSAM. Not unexpectedly Apples system was found to be deficient in many ways. Not least because of both the false positive and false negatives the system had. Privacy advocates pointed out that one a user data side on device scanning process was implemented, what it scanned for was fairly arbitrary as at the end of the day a file of data is a “bag of bits” and for basic search purposes against a “fuzzy hash”, “One bag of bits is as good as any other bag of bits.” So it did not matter if it was searching for images or text or anything else. Now I don’t know about others, but I regard any search be it by machine or human as a search. The fact sone argue that a machine searching is not a search as defined by the founding fathers is some what idiotic. Because computers or other machines of sufficient capability did not exist at the time of the founding fathers, who actually made a blanket statement about searches not a conditional statement. The question everyone should ask is, “Why Apple, having already found device side scanning is unacceptable to the vast majority, are forcing it back in on people who really do not want it?” Especially as due to the points above it can be seen as a very serious breach of privacy and something that can all to easily be used as the base mechanism to perform illicit unwarranted searches that many would see as being illegal (and are illegal in the EU and other jurisdictions)."
