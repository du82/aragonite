["https://www.schneier.com/tag/9-11"]
title = "9/11 Archives - Schneier on Security"
full_description = "The NSA, Metadata, and the Failure of Stopping 9/11 It’s common wisdom that the NSA was unable to intercept phone calls from Khalid al-Mihdhar in San Diego to Bin Ladin in Yemen because of legal restrictions. This has been used to justify the NSA’s massive phone metadata collection programs. James Bamford argues that there were no legal restrictions, and that the NSA screwed up. Posted on July 30, 2015 at 6:13 AM • View Comments Tracking the Psychological Effects of the 9/11 Attacks Interesting research from 2012: “The Dynamics of Evolving Beliefs, Concerns, Emotions, and Behavioral Avoidance Following 9/11: A Longitudinal Analysis of Representative Archival Samples“: Abstract: September 11 created a natural experiment that enables us to track the psychological effects of a large-scale terror event over time. The archival data came from 8,070 participants of 10 ABC and CBS News polls collected from September 2001 until September 2006. Six questions investigated emotional, behavioral, and cognitive responses to the events of September 11 over a five-year period. We found that heightened responses after September 11 dissipated and reached a plateau at various points in time over a five-year period. We also found that emotional, cognitive, and behavioral reactions were moderated by age, sex, political affiliation, and proximity to the attack. Both emotional and behavioral responses returned to a normal state after one year, whereas cognitively-based perceptions of risk were still diminishing as late as September 2006. These results provide insight into how individuals will perceive and respond to future similar attacks. Posted on June 30, 2015 at 6:27 AM • View Comments Effects of Terrorism Fears Interesting article: “How terrorism fears are transforming America’s public space.” I am reminded of my essay from four years ago: “Close the Washington Monument.” Posted on December 10, 2014 at 11:40 AM • View Comments Lesson in Successful Disaster Planning I found the story of the Federal Reserve on 9/11 to be fascinating. It seems they just flipped a switch on all their Y2K preparations, and it worked. Posted on September 23, 2014 at 1:09 PM • View Comments"
