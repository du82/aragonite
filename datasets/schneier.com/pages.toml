["https://www.schneier.com/essays"]
title = "Essays Archive - Schneier on Security"
full_description = "Home Latest Essays What the UK Wants from Apple Will Make Our Phones Less Safe Once a backdoor to user data exists, everyone will want in. Foreign PolicyFebruary 25, 2025 Last month, the UK government demanded that Apple weaken the security of iCloud for users worldwide. On Friday, Apple took steps to comply for users in the United Kingdom. But the British law is written in a way that requires Apple to give its government access to anyone, anywhere in the world. If the government demands Apple weaken its security worldwide, it would increase everyone’s cyber-risk in an already dangerous world. If you’re an iCloud user, you have the option of turning on something called “advanced data protection,” or ADP. In that mode, a majority of your data is end-to-end encrypted. This means that no one, not even anyone at Apple, can read that data. It’s a restriction enforced by mathematics—cryptography—and not policy. Even if someone successfully hacks iCloud, they can’t read ADP-protected data… Read More → DOGE Is Hacking America The U.S. government has experienced what may be the most consequential security breach in its history. Bruce Schneier and Davi OttenheimerForeign PolicyFebruary 11, 2025 In the span of just weeks, the US government has experienced what may be the most consequential security breach in its history—not through a sophisticated cyberattack or an act of foreign espionage, but through official orders by a billionaire with a poorly defined government role. And the implications for national security are profound. First, it was reported that people associated with the newly created Department of Government Efficiency (DOGE) had accessed the US Treasury computer system, giving them the ability to collect data on and potentially control the department’s roughly … Read More → It’s Time to Worry About DOGE’s AI Plans Welcome to the end of the human civil servant. Bruce Schneier and Nathan E. SandersThe AtlanticFebruary 10, 2025 Donald Trump and Elon Musk’s chaotic approach to reform is upending government operations. Critical functions have been halted, tens of thousands of federal staffers are being encouraged to resign, and congressional mandates are being disregarded. The next phase: The Department of Government Efficiency reportedly wants to use AI to cut costs. According to The Washington Post, Musk’s group has started to run sensitive data from government systems through AI programs to analyze spending and determine what could be pruned. This may lead to the elimination of human jobs in favor of automation. As one government official who has been tracking Musk’s DOGE team told the… Read More → AIs and Robots Should Sound Robotic Here's a simple way to identify who, or what, is talking to us Barath Raghavan and Bruce SchneierIEEE SpectrumJanuary 30, 2025 Most people know that robots no longer sound like tinny trash cans. They sound like Siri, Alexa, and Gemini. They sound like the voices in labyrinthine customer support phone trees. And even those robot voices are being made obsolete by new AI-generated voices that can mimic every vocal nuance and tic of human speech, down to specific regional accents. And with just a few seconds of audio, AI can now clone someone’s specific voice. This technology will replace humans in many areas. Automated customer support will save money by cutting staffing at … Read More → AI Will Write Complex Laws AI is poised to help legislators write more intricate laws, exercising increasing control over the executive. Nathan E. Sanders and Bruce SchneierLawfareJanuary 16, 2025 Artificial intelligence (AI) is writing law today. This has required no changes in legislative procedure or the rules of legislative bodies—all it takes is one legislator, or legislative assistant, to use generative AI in the process of drafting a bill. In fact, the use of AI by legislators is only likely to become more prevalent. There are currently projects in the US House, US Senate, and legislatures around the world to trial the use of AI in various ways: searching databases, drafting text, summarizing meetings, performing policy research and analysis, and more. A Brazilian municipality … Read More → AI Mistakes Are Very Different from Human Mistakes We need new security systems designed to deal with their weirdness Bruce Schneier and Nathan E. SandersIEEE SpectrumJanuary 13, 2025 Humans make mistakes all the time. All of us do, every day, in tasks both new and routine. Some of our mistakes are minor and some are catastrophic. Mistakes can break trust with our friends, lose the confidence of our bosses, and sometimes be the difference between life and death. Over the millennia, we have created security systems to deal with the sorts of mistakes humans commonly make. These days, casinos rotate their dealers regularly, because they make mistakes if they do the same task for too long. Hospital personnel write on limbs before surgery so that doctors operate on the correct body part, and they count surgical instruments to make sure none were left inside the body. From copyediting to double-entry bookkeeping to appellate courts, we humans have gotten really good at correcting human mistakes… Read More → Trust Issues The closed corporate ecosystem is the problem. Bruce Schneier and Nathan E. SandersBoston ReviewDecember 6, 2024 This essay appeared as a response to Evgeny Morozov in Boston Review‘s forum, “The AI We Deserve.” For a technology that seems startling in its modernity, AI sure has a long history. Google Translate, OpenAI chatbots, and Meta AI image generators are built on decades of advancements in linguistics, signal processing, statistics, and other fields going back to the early days of computing—and, often, on seed funding from the U.S. Department of Defense. But today’s tools are hardly the intentional product of the diverse generations of innovators that came before. We agree with Morozov that the “refuseniks,” as he … Read More → The Apocalypse That Wasn’t: AI Was Everywhere in 2024’s Elections, but Deepfakes and Misinformation Were Only Part of the Picture Bruce Schneier and Nathan E. SandersThe ConversationDecember 4, 2024 This essay also appeared in Cascadia Daily News, Commonwealth Beacon, Fast Company, Gizmodo, and the Seattle Post-Intelligencer. It’s been the biggest year for elections in human history: 2024 is a “super-cycle” year in which 3.7 billion eligible voters in 72 countries had the chance to go the polls. These are also the first AI elections, where many feared that deepfakes and artificial intelligence-generated misinformation would overwhelm the democratic processes. As 2024 draws to a close, it’s instructive to take stock of how democracy did… Read More → Algorithms Are Coming for Democracy—but It’s Not All Bad Bruce Schneier and Nathan E. SandersWiredNovember 27, 2024 In 2025, AI is poised to change every aspect of democratic politics—but it won’t necessarily be for the worse. India’s prime minister, Narendra Modi, has used AI to translate his speeches for his multilingual electorate in real time, demonstrating how AI can help diverse democracies to be more inclusive. AI avatars were used by presidential candidates in South Korea in electioneering, enabling them to provide answers to thousands of voters’ questions simultaneously. We are also starting to see AI tools aid fundraising and get-out-the-vote efforts. AI techniques are starting to augment more traditional polling methods, helping campaigns get cheaper and faster data. And congressional candidates have started using AI robocallers to engage voters on issues. In 2025, these trends will continue. AI doesn’t need to be superior to human experts to augment the labor of an overworked canvasser, or to write ad copy similar to that of a junior campaign staffer or volunteer. Politics is competitive, and any technology that can bestow an advantage, or even just garner attention, will be used… Read More → The SEC Whistleblower Program Is Dominating Regulatory Enforcement As the program, which cuts in whistleblowers on enforcements awards, grows exponentially, conflicts of interest are emerging. AI could make it worse. Bruce Schneier and Nathan SandersThe American ProspectOctober 18, 2024 Tax farming is the practice of licensing tax collection to private contractors. Used heavily in ancient Rome, it’s largely fallen out of practice because of the obvious conflict of interest between the state and the contractor. Because tax farmers are primarily interested in short-term revenue, they have no problem abusing taxpayers and making things worse for them in the long term. Today, the U.S. Securities and Exchange Commission (SEC) is engaged in a modern-day version of tax farming. And the potential for abuse will grow when the farmers start using artificial intelligence… Read More → ← Earlier Essays Sidebar photo of Bruce Schneier by Joe MacInnis. Powered by WordPress Hosted by Pressable"
