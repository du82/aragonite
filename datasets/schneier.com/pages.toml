title = "February 2005 - Schneier on Security"
full_description = "Sneaking Items Aboard Aircraft A Pennsylvania Supreme Court Justice faces a fine—although no criminal charges at the moment—for trying to sneak a knife aboard an aircraft. Saylor, 58, and his wife entered a security checkpoint Feb. 4 on a trip to Philadelphia when screeners found a small Swiss Army-style knife attached to his key chain. A police report said he was told the item could not be carried onto a plane and that he needed to place the knife into checked luggage or make other arrangements. When Saylor returned a short time later to be screened a second time, an X-ray machine detected a knife inside his carry-on luggage, police said. There are two points worth making here. One: ridiculous rules have a way of turning people into criminals. And two: this is an example of a security failure, not a security success. Security systems fail in one of two ways. They can fail to stop the bad guy, and they can mistakenly stop the good guy. The TSA likes to measure its success by looking at the forbidden items they have prevented from being carried onto aircraft, but that’s wrong. Every time the TSA takes a pocketknife from an innocent person, that’s a security failure. It’s a false alarm. The system has prevented access where no prevention was required. This, coupled with the widespread belief that the bad guys will find a way around the system, demonstrates what a colossal waste of money it is. Tags: air travel, cost-benefit analysis, courts, DHS, economics of security, false positives, homeland security, searches, security theater, TSA, weapons Posted on February 28, 2005 at 8:00 AM • 48 Comments Regulation, Liability, and Computer Security For a couple of years I have been arguing that liability is a way to solve the economic problems underlying our computer security problems. At the RSA conference this year, I was on a panel on that very topic. This essay argues that regulation, not liability, is the correct way to solve the underlying economic problems, using the analogy of high-pressure steam engines in the 1800s. Definitely worth thinking about some more. Tags: debates, economics of security, externalities, incentives, laws, Schneier news, security conferences, software liability Posted on February 25, 2005 at 8:00 AM • 13 Comments"
