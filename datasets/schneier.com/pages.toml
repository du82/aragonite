["https://www.schneier.com/tag/apache"]
title = "Apache Archives - Schneier on Security"
full_description = "On the Log4j Vulnerability It’s serious: The range of impacts is so broad because of the nature of the vulnerability itself. Developers use logging frameworks to keep track of what happens in a given application. To exploit Log4Shell, an attacker only needs to get the system to log a strategically crafted string of code. From there they can load arbitrary code on the targeted server and install malware or launch other attacks. Notably, hackers can introduce the snippet in seemingly benign ways, like by sending the string in an email or setting it as an account username. Threat advisory from Cisco. Cloudflare found it in the wild before it was disclosed. CISA is very concerned, saying that hundreds of millions of devices are likely affected. Posted on December 14, 2021 at 9:55 AM • View Comments The Insecurity of WordPress and Apache Struts Interesting data: A study that analyzed all the vulnerability disclosures between 2010 and 2019 found that around 55% of all the security bugs that have been weaponized and exploited in the wild were for two major application frameworks, namely WordPress and Apache Struts. The Drupal content management system ranked third, followed by Ruby on Rails and Laravel, according to a report published this week by risk analysis firm RiskSense. The full report is here. Posted on March 18, 2020 at 7:45 AM • View Comments Story of the ZooKeeper Poison-Packet Bug Interesting story of a complex and deeply hidden bug—with AES as a part of it. Posted on May 25, 2015 at 9:20 AM • View Comments Attack Against Apache.org This blog entry should serve as a model for open and transparent security self-reporting. I’m impressed. More news reports. Posted on April 27, 2010 at 1:26 PM • View Comments DHS Funding Open Source Security From eWeek: The U.S. government’s Department of Homeland Security plans to spend $1.24 million over three years to fund an ambitious software auditing project aimed at beefing up the security and reliability of several widely deployed open-source products. The grant, called the “Vulnerability Discovery and Remediation Open Source Hardening Project,” is part of a broad federal initiative to perform daily security audits of approximately 40 open-source software packages, including Linux, Apache, MySQL and Sendmail. The plan is to use source code analysis technology from San Francisco-based Coverity Inc. to pinpoint and correct security vulnerabilities and other potentially dangerous defects in key open-source packages. Software engineers at Stanford University will manage the project and maintain a publicly available database of bugs and defects. Anti-virus vendor Symantec Corp. is providing guidance as to where security gaps might be in certain open-source projects. I think this is a great use of public funds. One of the limitations of open-source development is that it’s hard to fund tools like Coverity. And this kind of thing improves security for a lot of different organizations against a wide variety of threats. And it increases competition with Microsoft, which will force them to improve their OS as well. Everybody wins. What’s affected? In addition to Linux, Apache, MySQL and Sendmail, the project will also pore over the code bases for FreeBSD, Mozilla, PostgreSQL and the GTK (GIMP Tool Kit) library. And from ZDNet: The list of open-source projects that Stanford and Coverity plan to check for security bugs includes Apache, BIND, Ethereal, KDE, Linux, Firefox, FreeBSD, OpenBSD, OpenSSL and MySQL, Coverity said. Posted on January 17, 2006 at 1:04 PM • View Comments"
