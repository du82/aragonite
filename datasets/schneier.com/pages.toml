["https://www.schneier.com/academic/archives/1998/08/on_the_twofish_key_s.html"]
title = "On the Twofish Key Schedule - Schneier on Security"
description = "ABSTRACT: Twofish is a new block cipher with a 128 bit block, and a key length of 128, 192, or 256 bits, which has been submitted as an AES candidate. In this paper, we briefly review the structure of Twofish, and then discuss the key schedule of Twofish, and its resistance to attack. We close with some open questions on the security of Twofish’s key schedule. [full text – PDF (Acrobat)] [full text – Postscript]"
full_description = "On the Twofish Key Schedule B. Schneier, J. Kelsey, D. Whiting, D. Wagner, C. Hall, and N. FergusonFifth Annual Workshop on Selected Areas in Cryptography, Springer-Verlag, August 1998, pp. 27-42. ABSTRACT: Twofish is a new block cipher with a 128 bit block, and a key length of 128, 192, or 256 bits, which has been submitted as an AES candidate. In this paper, we briefly review the structure of Twofish, and then discuss the key schedule of Twofish, and its resistance to attack. We close with some open questions on the security of Twofish’s key schedule. [full text – PDF (Acrobat)] [full text – Postscript] Categories: Twofish"
