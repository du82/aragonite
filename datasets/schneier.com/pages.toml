title = "Texas Sues GM for Collecting Driving Data without Consent - Schneier on Security"
description = "Texas is suing General Motors for collecting driver data without consent and then selling it to insurance companies: From CNN: In car models from 2015 and later, the Detroit-based car manufacturer allegedly used technology to “collect, record, analyze, and transmit highly detailed driving data about each time a driver used their vehicle,” according to the AG’s statement. General Motors sold this information to several other companies, including to at least two companies for the purpose of generating “Driving Scores” about GM’s customers, the AG alleged. The suit said those two companies then sold these scores to insurance companies..."
full_description = "Texas Sues GM for Collecting Driving Data without Consent Texas is suing General Motors for collecting driver data without consent and then selling it to insurance companies: From CNN: In car models from 2015 and later, the Detroit-based car manufacturer allegedly used technology to “collect, record, analyze, and transmit highly detailed driving data about each time a driver used their vehicle,” according to the AG’s statement. General Motors sold this information to several other companies, including to at least two companies for the purpose of generating “Driving Scores” about GM’s customers, the AG alleged. The suit said those two companies then sold these scores to insurance companies. Insurance companies can use data to see how many times people exceeded a speed limit or obeyed other traffic laws. Some insurance firms ask customers if they want to voluntarily opt-in to such programs, promising lower rates for safer drivers. But the attorney general’s office claimed GM “deceived” its Texan customers by encouraging them to enroll in programs such as OnStar Smart Driver. But by agreeing to join these programs, customers also unknowingly agreed to the collection and sale of their data, the attorney general’s office said. Press release. Court filing. Slashdot thread. Tags: business of security, cars, data collection, deception Posted on August 14, 2024 at 12:48 PM • 7 Comments Alex Neff • August 14, 2024 1:36 PM IANAL, but it sounds like the dealerships or end users are at fault. Dealerships at times signed up for customers removing their ability to accept terms of service. Abstraction of sales process is one of the reasons automakers use dealerships. End users are given the opportunity to read terms of service and in the filing the argument is given that the terms of service are too long and/or confusing for the average user. Until some kind of laws force companies to offer TDLRs for terms of service, I have a hard time faulting a company for their length (at someone who has had to work with lawyers to craft them). Last, Telematics data is very valuable for safety usage. Sales to third parties, if denoted in the ToS agreements, is perfectly legal and is basically what half of the web has been monetized on. I’m not sure I fully agree with the lack of transparency, but wonder if this is more for show."
