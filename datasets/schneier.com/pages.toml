full_description = "xkcd on Cryptanalysis Good xkcd comic on the difference between theoretical and practical cryptanalysis. Tags: comics, cryptanalysis, cryptography, encryption, humor Posted on February 6, 2009 at 1:48 PM • 24 Comments William • February 6, 2009 2:19 PM This is what I love about analyzing security systems–finding the cheap yet highly effective ways to break or circumvent them. Anonymous • February 6, 2009 2:47 PM Don’t forget to mouse-over to see the actual actual reality. The Fiery Scribe • February 6, 2009 3:12 PM Abstruse Goose also has one on cryptography: http://abstrusegoose.com/113 Ward S. Denker • February 6, 2009 3:29 PM I can see Bruce’s countermeasure now: “I’m gunna kick some ass with with my own pipe wrench.” (If you don’t get the reference: http://www.youtube.com/watch?v=lnjYrP5J6rE ) Tangerine Blue • February 6, 2009 3:50 PM “I’m gunna kick some ass with with my own pipe wrench.” Long-ish video, funny. Methinks Bruce would find the pipe wrench too clumsy and random, uncivilized. Bruce would have stretched his brane and un-warped the fabric of the universe. Todd Knarr • February 6, 2009 4:08 PM That recalls a comment from a game: “Your objective’s on the other side of an impenetrable door, locked by an unpickable lock. Do you a) curse your misfortune, b) try and find better tools, or c) track down the watchman with the keys, slug him, take his keys and continue about your business?” Clive Robinson • February 6, 2009 5:32 PM @ Davi Ottenheimer, “Why such an expensive wrench?” If you are going to do something, do it with style. And as we all know these days style costs… keitai • February 7, 2009 4:22 AM I am disappointed that xkcd did not use a rubber-hose for beating. ed • February 7, 2009 7:17 PM Or “(e) poke around in the game’s unencrypted memory space until you figure out how to turn the impenetrable door into a pony, then wait for it to wander off looking for a nice Douglas Adams adventure”. spaceman spiff • February 7, 2009 8:26 PM Personally, I favor the 3 ft. length of 2×4, or just a handy brick. They’re cheap and effective. Plus it’s harder to get finger prints off them, unless you have really greasy fingers…"
