title = "UK Is Ordering Apple to Break Its Own Encryption - Schneier on Security"
description = "The Washington Post is reporting that the UK government has served Apple with a “technical capability notice” as defined by the 2016 Investigatory Powers Act, requiring it to break the Advanced Data Protection encryption in iCloud for the benefit of law enforcement. This is a big deal, and something we in the security community have worried was coming for a while now. The law, known by critics as the Snoopers’ Charter, makes it a criminal offense to reveal that the government has even made such a demand. An Apple spokesman declined to comment..."
full_description = "UK Is Ordering Apple to Break Its Own Encryption The Washington Post is reporting that the UK government has served Apple with a “technical capability notice” as defined by the 2016 Investigatory Powers Act, requiring it to break the Advanced Data Protection encryption in iCloud for the benefit of law enforcement. This is a big deal, and something we in the security community have worried was coming for a while now. The law, known by critics as the Snoopers’ Charter, makes it a criminal offense to reveal that the government has even made such a demand. An Apple spokesman declined to comment. Apple can appeal the U.K. capability notice to a secret technical panel, which would consider arguments about the expense of the requirement, and to a judge who would weigh whether the request was in proportion to the government’s needs. But the law does not permit Apple to delay complying during an appeal. In March, when the company was on notice that such a requirement might be coming, it told Parliament: “There is no reason why the U.K. [government] should have the authority to decide for citizens of the world whether they can avail themselves of the proven security benefits that flow from end-to-end encryption.” Apple is likely to turn the feature off for UK users rather than break it for everyone worldwide. Of course, UK users will be able to spoof their location. But this might not be enough. According to the law, Apple would not be able to offer the feature to anyone who is in the UK at any point: for example, a visitor from the US. And what happens next? Australia has a law enabling it to ask for the same thing. Will it? Will even more countries follow? This is madness. Tags: Apple, backdoors, cloud computing, data privacy, encryption, law enforcement, privacy, UK Posted on February 8, 2025 at 10:56 AM • 48 Comments Who? • February 8, 2025 11:24 AM “Apple can appeal the U.K. capability notice to a secret technical panel…” …where it will be automatically dismissed. Nice to see this NSL-style request has been published. I ask myself why it is a criminal offense to reveal that the government has even made such a demand. The only answer I can think about is that it is a completely illegal request. It is time to stop governments to act this way. The only way to achieve this goal is by means of technology and mathematics, as ever. People should wake up."
