["https://www.schneier.com/blog/archives/2025/02/pairwise-authentication-of-humans.html"]
title = "Pairwise Authentication of Humans - Schneier on Security"
description = "Here’s an easy system for two humans to remotely authenticate to each other, so they can be sure that neither are digital impersonations. To mitigate that risk, I have developed this simple solution where you can setup a unique time-based one-time passcode (TOTP) between any pair of persons. This is how it works: Two people, Person A and Person B, sit in front of the same computer and open this page; They input their respective names (e.g. Alice and Bob) onto the same page, and click “Generate”; The page will generate two TOTP QR codes, one for Alice and one for Bob; ..."
full_description = "Pairwise Authentication of Humans Here’s an easy system for two humans to remotely authenticate to each other, so they can be sure that neither are digital impersonations. To mitigate that risk, I have developed this simple solution where you can setup a unique time-based one-time passcode (TOTP) between any pair of persons. This is how it works: Two people, Person A and Person B, sit in front of the same computer and open this page; They input their respective names (e.g. Alice and Bob) onto the same page, and click “Generate”; The page will generate two TOTP QR codes, one for Alice and one for Bob; Alice and Bob scan the respective QR code into a TOTP mobile app (such as Authy or Google Authenticator) on their respective mobile phones; In the future, when Alice speaks with Bob over the phone or over video call, and wants to verify the identity of Bob, Alice asks Bob to provide the 6-digit TOTP code from the mobile app. If the code matches what Alice has on her own phone, then Alice has more confidence that she is speaking with the real Bob. Simple, and clever. Tags: authentication, protocols Posted on February 10, 2025 at 7:00 AM • 22 Comments Andreas E • February 10, 2025 7:54 AM You can do this without a webpage (i.e. offline): Open KeePass on Alice’s PC, let it generate a decent seed for a TOTP on Alice’s KeePass database and store a copy on Bob’s KeePass database. Once they’d want to authenticate to each other, they simply both generate the current TOTP and compare. Zsolt • February 10, 2025 8:12 AM “The page will generate two TOTP QR codes, one for Alice and one for Bob” Why do you need two TOTP seeds for authentication between exactly two people? The only reason I can think of is if you want mutual authentication at the very same moment. Otherwise a single TOTP seed (shared between the two people) should suffice and assuming that the code generators (e.g. Google Authenticator) generate/show a new code every minute, they can both authenticate the other one just a minute apart."
author = "Bruce Schneier"
year_published = 2025
