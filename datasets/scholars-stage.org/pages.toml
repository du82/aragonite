rsten Peter, National Geographic. © “The nomadic strategy is one means by which people adapt to thinly spread resources and to the variability of the resources across space and over time. It is also a strategy for avoiding other deleterious environmental conditions, such as extreme heat […] Continue Reading 2 Comments on The Nomadic Survival Strategy: Salzman’s 20 Observations"
