full_description = "Reading Assignment 30 June, 2010Tags:Bargaining and Balancing, Entangling Alliances, Near East, Persia Last week Prospect Magazine published a significant essay written by Boston University professor of international relations Stephen Kinzer. The ideas contained inside are more than reasonable, though they will be deemed radical by most who read it. If you can only read one article today, I ask that it be this one: The Next Power […] Continue Reading 0 Comments on Reading Assignment Addendum onTyranny 30 June, 2010Tags:Books and Literature, Political Theory, Tyranny Recently I wrote a post where I attempted to define “tyranny” as the word is used here on the Stage. I have given the matter some thought since then, and would like to add few points to this earlier effort. I concluded the post with the following operative definition of “tyranny”: Tyranny can be found […] Continue Reading 0 Comments on Addendum onTyranny For Those Tickled by Geopolitics (III) 26 June, 2010Tags:The Middle Kingdom The Washington D.C. based Jamestown Foundation warrants the attention of all interested in geopolitics. In particular, the foundation’s China Brief is a valuable resource. Using open source documents and statements originally published in Chinese, the Jamestown Foundation fellows create a short brief on the internal debates and political developments occurring within the Chinese Communist Party […] Continue Reading 0 Comments on For Those Tickled by Geopolitics (III) Pakistan and China: BFFs 25 June, 2010Tags:Diplomacy, Entangling Alliances, Pakistan, The Middle Kingdom In case you missed it: Chinese firms have brokered a deal to construct two nuclear reactors for the Chashma Nuclear Complex in Pakistan. Pakistan, and in particular, Punjab (the state in which the complex can be found) suffers from chronic energy shortages. After a series of rolling black outs this April, the Punjab Chief Minister […] Continue Reading 8 Comments on Pakistan and China: BFFs America Quibbles as Mexico Crumbles 24 June, 2010Tags:Media, Mexico, Military Affairs America is aflutter with talk of General Stanley McChrystal. The story is now old news and hardly needs to be repeated; the possible consequences and causes of General McChrystal’s intemperate remarks have been discussed by every person capable of articulating an opinion on the matter. Tonight I had planned on adding my voice to this […] Continue Reading 0 Comments on America Quibbles as Mexico Crumbles"
