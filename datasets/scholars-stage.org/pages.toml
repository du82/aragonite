full_description = "Change of the Guard 30 August, 2009Tags:Electoral Intrigues, Japan Japan has a new ruling party. In a landmark election the Democratic Party of Japan (DPJ) gained a majority in both houses of the Diet for the first time in its history. Yet the significance of this election has much less to do with the DPJ and much more to do those whom they knocked […] Continue Reading 0 Comments on Change of the Guard Video of the Day 30/08/2009 –What Stops Population Growth? 30 August, 2009Tags:Demographics, Sustainability, Video of the Day What stops population growth?Lecture by Hans Rosling. Gapminder Foundation 1 January 2009. An intelligent lecture that uses dynamic graphics to disprove a few population-related myths. Well worth the ten minutes it takes to watch. H/T to Dot Earth. Continue Reading 2 Comments on Video of the Day 30/08/2009 –What Stops Population Growth? The Mystery That is India 29 August, 2009Tags:Bharat, Culture, Geography I am continually fascinated by the greatest anomaly of our times, the Republic of India. In an age dominated by ethnonationalist states, India’s existence is a modern mystery. It is a hundred nations contained in one, a crucible of religions, cultures, and peoples whose history is as old as recorded history itself. That such a […] Continue Reading 6 Comments on The Mystery That is India Notes From All Over 23/08/09 23 August, 2009Tags:Climate, Dogs of War, DRC, Futuristics, Geopolitics, Mexico, Notes From All Over, Sustainability, The Middle Kingdom, Wealth TOP BILLING: An Analysis of Mitigation as a Response to Climate ChangeRichard SJ Tol. Copenhagen Consensus Center. 14 August 2009. Climate change costs: Too much is not enough.Katie Mackenzie. FT Energy Source. 14 August 2009. The Copenhagen Consensus Center has published the most important report related to climate change I have seen in a year. […] Continue Reading 2 Comments on Notes From All Over 23/08/09 Af/Pak in Tatters: The Debate Is On 17 August, 2009Tags:Bactria, COIN, Domestic Politics, Media, Pakistan, Strategy Six months ago I wrote a post questioning America’s ability to wage a proper population-centric counterinsurgency. The post noted the structural features of modern democratic institutions that make waging a “Long War” near impossible. I ended this post with a projection for the next year: Can Modern America Wage Counterinsurgency?T. Greer. Scholar’s Stage. 4 March […] Continue Reading 1 Comment on Af/Pak in Tatters: The Debate Is On"
