an Spectator. 10 October 2010. Republican candidates will discuss the need to cut waste from the budget vaguely while ruling out cuts to entitlements and defense spending. To demonstrate how absurd this is, I put together this pie chart breaking down the […] Continue Reading 2 Comments on News Flash: A Republican Majority Will Not Bring Spending Under Control"
