full_description = "If You Only Read One Essay Today… 28 September, 2010Tags:To My Countrymen, Tyranny It should be this one. Read it. Then pass it on to every American you know who might possibly give a wit. And then pass it on to all those you know who obviously do not. In this Republic tyranny should not be stood for. Continue Reading 3 Comments on If You Only Read One Essay Today… One More Website To Waste Your Days Away…. 24 September, 2010Tags:Books and Literature I came across the website Five Books today. The gist is this: every day the website interviews one politician, scholar, or pundit by asking them to pick the best five books on their self-selected “specialty subject” and explain why these five books ought to be read by the broader public and how these books influenced […] Continue Reading 0 Comments on One More Website To Waste Your Days Away…. Intelligent Look at America’s Income Inequality 22 September, 2010Tags:Demographics, Wealth This month Slate has published an unusually thoughtful series on America’s rising income inequality. The series comes in ten segments, all penned by Slate columnist Timothy North. The Great Divergence: Trying to Understanding America’s Income Inequality I recommend the series to my readers without reservation, and note that Mr. North’s sections on the United State’s […] Continue Reading 0 Comments on Intelligent Look at America’s Income Inequality Citizen Vigilantism: The Next Step in Mexico’s Drug War? 22 September, 2010Tags:Mexico From an Associated Press wire: Mexico: Mob Beats to Death Suspected Kidnappers CBS News. 22 September 2010. CIUDAD JUAREZ, Mexico – Mexican authorities say a mob has beaten two alleged kidnappers to death in the northern border state of Chihuahua. Chihuahua state prosecutors’ spokesman Arturo Sandoval says dozens of angry people in the town of […] Continue Reading 0 Comments on Citizen Vigilantism: The Next Step in Mexico’s Drug War? Connecting the Dots: Social Mobility and Family Structure 20 September, 2010Tags:Community, Demographics, Monied Interests, Wealth It does not matter who you are or where you come from. In America, if you study long enough and work hard enough you can become anything. Every American child has heard this story. It is a shame it is not true. Earlier this year the OECD published a report on the various economic policies […] Continue Reading 0 Comments on Connecting the Dots: Social Mobility and Family Structure"
