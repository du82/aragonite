full_description = "Notes From All Over (22/06/14): Rise of the West, Island Disputes, & Too Much Stuff About China 22 June, 2014Tags:Demographics, Dogs of War, Geography, Geopolitics, History, Military Affairs, Monied Interests, Notes From All Over, Political Theory, Southeast Asia, Strategy, The Middle Kingdom, Wealth A collection of articles, essays, and blog post of merit.TOP BILLING“The Little Divergence“‘Pseuderoerasmus,’ Pseudoarasmus (12 June 2014) In this blogpost I will argue the following : While very few economic historians now dispute that East Asia had lower living standards than Europe well before 1800, …there is no agreement on whether European economies prior to 1800 were “modern” […] Continue Reading 4 Comments on Notes From All Over (22/06/14): Rise of the West, Island Disputes, & Too Much Stuff About China Chinese Cookery: Notes on the History of Chinese Stir Fry 13 June, 2014Tags:History, Small and Simple Things, The Middle Kingdom When asked by Chinese acquaintances if I enjoy Chinese food more than American cuisine I often reply, “I like Chinese food. The problem is, Chinese food does not like me!” I speak this truthfully. Few national cuisines can compare with the savor of Chinese cookery. Alas, what is pleasing to the tongue does not always […] Continue Reading 5 Comments on Chinese Cookery: Notes on the History of Chinese Stir Fry Hard Truths and Hidden Gems at Shangri-La 11 June, 2014Tags:Diplomacy, Entangling Alliances, Japan, Media, Military Affairs, Narrative, The Middle Kingdom Prime Minister Shinzo Abe delivers the keynote address at the 2014 Shangri-La Dialogue Image Source This weekend I finally had the chance to sit down and read the collected transcripts of the 2014 Shangri-La Dialogue. This year’s round of the Dialogue has garnered much more media attention than usual. The coverage has focused on the […] Continue Reading 0 Comments on Hard Truths and Hidden Gems at Shangri-La The Cross Section Ilusion 07 June, 2014Tags:Cognition,