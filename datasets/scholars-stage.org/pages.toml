full_description = "Addendum to “Dreaming Grand Strategy” 31 August, 2010Tags:Culture, Narrative, Political Theory, Strategy Much of what is written below is pulled from my comments on Zenpundit’s critique of my earlier post “Dreaming Grand Strategy.” If you have already read them, you will find little new here. In the post “Dreaming Grand Strategy” I set out to explain why America is suffering a crisis in grand strategy. Doing so […] Continue Reading 1 Comment on Addendum to “Dreaming Grand Strategy” Chinese Troops Move Into Pakistan, Western Media Hardly Bats An Eye 29 August, 2010Tags:Entangling Alliances, Media, Pakistan, The Middle Kingdom Earlier this weekend The New York Times reported that Pakistan has allowed some 11,000 Chinese troops into Gilgit-Baltistan, a strategically significant part of the contested Kashmir region. Steve Hynd (of NewsHoggers) beat me to posting on the news. As his thoughts on the situation mirror my own, I direct my readers to his post: China […] Continue Reading 1 Comment on Chinese Troops Move Into Pakistan, Western Media Hardly Bats An Eye Manifest Destiny – A Case Study in National Purpose? 24 August, 2010Tags:Culture, History, Narrative, Strategy WARNING – ANOTHER SUPER LONG POST (Sorry I keep throwing these things on you guys). An interesting discussion has been enfolding over at Zenpundit’s place. The topic of the day is grand strategy and its relation to moral and national purpose. My previous foray into the topic, “Dreaming Grand Strategy”, drew the attention of Mark […] Continue Reading 2 Comments on Manifest Destiny – A Case Study in National Purpose? Don’t Trust a WEIRD Man’s Reasoning 22 August, 2010Tags:Culture, Narrative Via Arts and Letters Daily comes this fascinating presentation by psychologist Jonathan Haidt on ‘moral psychology’. More interesting than Hait’s thesis is the qualifiers he adds to it, noting two important studies that gave him cause for intellectual humility. Says he: The New Science of Morality Jonathan Haidt. Edge. July 2010. But before I come […] Continue Reading 1 Comment on Don’t Trust a WEIRD Man’s Reasoning"
