["https://www.schoolofhaskell.com/school/advanced-haskell/beautiful-concurrency/3-software-transactional-memory"]
title = "3. Software Transactional Memory - School of Haskell | School of Haskell"
full_description = '''Software Transactional Memory is a promising new approach to the challenge of concurrency, as I will explain in this section. I shall explain STM using Haskell, the most beautiful programming language I know, because STM fits into Haskell particularly elegantly. If you don’t know any Haskell, don’t worry; we’ll learn it as we go.3.1 Side effects and input/output in HaskellHere is the beginning of the code for transfer in Haskell:transfer :: Account -> Account -> Int -> IO () -- Transfer ’amount’ from account ’from’ to account ’to’ transfer from to amount = ...The second line of this definition, starting “--”, is a comment. The first line gives the type signature for transfer. This signature says that transfer takes as its arguments2 two values of type Account (the source and destination accounts), and an Int (the amount to transfer), and returns a value of type IO (). This result type says “transfer returns an action that, when performed, may have some side effects, and then returns a value of type ()”. The type (), pronounced “unit”, has just one value, which is also written (); it is akin to void in C. So transfer’s result type IO () announces that its side effects constitute the only reason for calling it. Before we go further, we must explain how side effects are handled in Haskell.A “side effect” is anything that reads or writes mutable state. Input/output is a prominent example of a side effect. For example, here are the signatures of two Haskell functions with input/output effects:hPutStr :: Handle -> String -> IO () hGetLine :: Handle -> IO StringWe call any value of type IO t an “action”. So (hPutStr h "hello")3 is an action that, when performed, will print "hello" on handle4 h and return the unit value. Similarly, (hGetLine h) is an action that, when performed, will read a line of input from handle h and return it as a String. We can glue together little side-effecting programs to make bigger side-effecting programs using Haskell’s “do” notation. For example, hEchoLine reads a string from the input and prints it:hEchoLine :: Handle -> IO String hEchoLine h = do s <- hGetLine h hPutStr h ("I just read that " ++ s) return sHere's a small program that calls the function hEchoLine and sets up data for it. Run it!{-# START_FILE main.hs #-} import System.IO hEchoLine :: Handle -> IO String hEchoLine h = do s <- hGetLine h hPutStr h ("I just read that " ++ s) return s main = do h <- openFile "test.txt" ReadWriteMode str <- {-hi-}hEchoLine h{-/hi-} hClose h str1 <- readFile "test.txt" hPutStr stdout str1 {-# START_FILE test.txt #-} Haskell rules!First, we import the appropriate library, in this case System.IO, which contains the definitions of hGetLine, hPutStr, and a few others used in main. Function main makes the call to hEchoLine with the appropriate argument -- a file handle, h. We get the handle by calling openFile with two arguments: the name of the file and the file mode -- ReadWriteMode in this case. Finally, we read the whole modified file using readFile and send the result to the standard output, stdout, for display.Notice that we are discarding the result of hEchoLine: str. If you want to display it, change the last line of main.The file test.txt is provided too (feel free to edit its content and run the program again).The notation:do a1 ... an constructs an action by gluing together the smaller actions a1 . . . an in sequence. So hEchoLine h is an action that, when performed, will first perform hGetLine h to read a line from h, naming the result s. Then it will perform hPutStr to print s, preceded5 by “I just read: ”. Finally, it returns the string s. This last line is interesting, because return is not a built-in language construct: rather, it is a perfectly ordinary function with typereturn :: a -> IO aThe action return v, when performed, returns v without having caused any side effects6. This function works on values of any type, and we indicate this by using a type variable a in its type.Input/output is one important sort of side effect. Another is the act of reading or writing a mutable variable. For example, here is a function that increments the value of a mutable variable:incRef :: IORef Int -> IO () incRef var = do val <- readIORef var writeIORef var (val+1) Here is a small test program calling incRef:import System.IO import Data.IORef incRef :: IORef Int -> IO () incRef var = do val <- readIORef var writeIORef var (val+1) main = do var <- newIORef 42 {-hi-}incRef var{-/hi-} val <- readIORef var hPutStr stdout (show val) This time main creates a new IORef with the initial value 42, passes it to our function incRef, reads the new value from IORef, and displays it. To display a number we convert it to a string using the function show.Here, incRef var is an action that first performs readIORef var to read the value of the variable, naming its value val, and then performs writeIORef to write the value (val+1) into the variable. The types of readIORef and writeIORef are as follows:readIORef :: IORef a -> IO a writeIORef :: IORef a -> a -> IO ()A value of type IORef t should be thought of as a pointer, or reference, to a mutable location containing a value of type t, a bit like the type (t *) in C. In the case of incRef, the argument has type IORef Int because incRef only applies to locations that contain an Int.So far I have explained how to build big actions by combining smaller ones together — but how does an action ever actually get performed? In Haskell, the whole program defines a single IO action, called main. To run the program is to perform the action main. For example, here is a complete program:import System.IO -- show main :: IO () main = do hPutStr stdout "Hello" hPutStr stdout " world\n"This program is a sequential program, because the do-notation combines IO actions in sequence. To construct a concurrent program we need one more primitive, forkIO:forkIO :: IO a -> IO ThreadIdThe function forkIO, which is built into Haskell, takes an IO action as its argument, and spawns it as a concurrent Haskell thread. Once created, it is run concurrently with all the other Haskell threads, by the Haskell runtime system. For example, suppose we modified our main program thus7:import System.IO import Control.Concurrent -- show main :: IO () main = do forkIO (hPutStr stdout "Hello") hPutStr stdout " world\n"In the first line of main, we could instead have written tid <- forkIO (hPutStr ...), to bind the ThreadId returned by forkIO to tid. However, since we do not use the returned ThreadId, we are free to discard it by omitting the “tid <-” part.import System.IO import Control.Concurrent main :: IO () main = do tid <- forkIO (hPutStr stdout "Hello") hPutStr stdout " world\n"Now the two hPutStr actions would run concurrently. Which of them would “win” (by printing its string first) is unspecified. Haskell threads spawned by forkIO are extremely lightweight: they occupy a few hundred bytes of memory, and it is perfectly reasonable for a single program to spawn thousands of them.Gentle reader, you may by now be feeling that Haskell is a very clumsy and verbose language. After all, our three-line definition of incRef accomplishes no more than x++ does in C! Indeed, in Haskell side effects are extremely explicit and somewhat verbose. However, remember first that Haskell is primarily a functional language. Most programs are written in the functional core of Haskell, which is rich, expressive, and concise. Haskell thereby gently encourages you to write programs that make sparing use of side effects.Second, notice that being explicit about side effects reveals a good deal of useful information. Consider two functions:f :: Int -> Int g :: Int -> IO IntFrom looking only at their types we can see that f is a pure function: it has no side effects. Given a particular Int, say 42, the call (f 42) will return the same value every time it is called. In contrast, g has side effects, and this is apparent in its type. Each time g is performed it may give a different result — for example it may read from stdin, or modify a mutable variable — even if its argument is the same every time. This ability to make side effects explicit will prove very useful in what follows.Lastly, actions are first-class values: they may be passed as arguments as well as returned as results. For example, here is the definition of a (simplified) for loop function, written entirely in Haskell rather than being built in:nTimes :: Int -> IO () -> IO () nTimes 0 do_this = return () nTimes n do_this = do do_this nTimes (n-1) do_thisThis recursive function takes an Int saying how many times to loop, and an action do_this; it returns an action that, when performed, performs the do_this action n times. Here is an example of a use of nTimes to print “Hello” 10 times:main = nTimes 10 (hPutStr stdout "Hello\n")import System.IO nTimes :: Int -> IO () -> IO () nTimes 0 do_this = return () nTimes n do_this = do do_this nTimes (n-1) do_this main = nTimes 10 (hPutStr stdout "Hello\n")We are calling nTimes with 10 and the action returned by (hPutStr stdout "Hello\n") that prints "Hello" to the standard input.In effect, by treating actions as first-class values, Haskell supports user-defined control structures.This chapter is not the place for a full introduction to Haskell, or even to side effects in Haskell. A good starting point for further reading is the tutorial “Tackling the awkward squad” [9].3.2 Transactions in HaskellNow we can return to our transfer function. Here is its code:transfer :: Account -> Account -> Int -> IO () -- Transfer ’amount’ from account ’from’ to account ’to’ transfer from to amount = atomically (do deposit to amount withdraw from amount)The inner do-block should by now be fairly self-explanatory: we call deposit to deposit amount in to, and withdraw to withdraw amount from account from. We will write these auxiliary functions in a moment, but first look at the call to atomically. It takes an action as its argument, and performs it atomically. More precisely, it makes two guarantees:Atomicity: the effects of atomically act become visible to another thread all at once. This ensures that no other thread can see a state in which money has been deposited in to but not yet withdrawn from from.Isolation: during a call atomically act, the action act is completely unaffected by other threads. It is as if act takes a snapshot of the state of the world when it begins running, and then executes against that snapshot.Here is a simple execution model for atomically. Suppose there is a single, global lock. Then atomically act grabs the lock, performs the action act, and releases the lock. This implementation brutally ensures that no two atomic blocks can be executed simultaneously, and thereby ensures atomicity.There are two problems with this model. First, it does not ensure isolation at all: while one thread is accessing an IORef inside an atomic block (holding the Global Lock), there is nothing to stop another thread writing the same IORef directly (i.e. outside atomically, without holding the Global Lock), thereby destroying the isolation guarantee. Second, performance is dreadful, because every atomic block would be serialised even if no actual interference was possible.I will discuss the second problem shortly, in Section 3.3. Meanwhile, the first objection is easily addressed with the type system. We give atomically the following type:atomically :: STM a -> IO aThe argument of atomically is an action of type STM a. An STM action is like an IO action, in that it can have side effects, but the range of side effects for STM actions is much smaller. The main thing you can do in an STM action is read or write a transactional variable, of type (TVar a), much as we could read or write IORefs in an IO action8.readTVar :: TVar a -> STM a writeTVar :: TVar a -> a -> STM ()STM actions can be composed together with the same do-notation as IO actions — the do-notation is overloaded to work on both types, as is return9. Here, for example, is the code for withdraw:type Account = TVar Int withdraw :: Account -> Int -> STM () withdraw acc amount = do bal <- readTVar acc writeTVar acc (bal - amount)We represent an Account by a transactional variable containing an Int for the account balance. Then withdraw is an STM action that decrements the balance in the account by amount.To complete the definition of transfer we can define deposit in terms of withdraw:deposit :: Account -> Int -> STM () deposit acc amount = withdraw acc (- amount)import System.IO import Control.Concurrent.STM type Account = TVar Int withdraw :: Account -> Int -> STM () withdraw acc amount = do bal <- readTVar acc writeTVar acc (bal - amount) deposit :: Account -> Int -> STM () deposit acc amount = withdraw acc (- amount) transfer :: Account -> Account -> Int -> IO () -- Transfer ’amount’ from account ’from’ to account ’to’ transfer from to amount = atomically (do deposit to amount withdraw from amount) showAccount :: Account -> IO Int showAccount acc = atomically (readTVar acc) main = do from <- atomically (newTVar 200) to <- atomically (newTVar 100) transfer from to 50 v1 <- showAccount from v2 <- showAccount to putStrLn $ (show v1) ++ ", " ++ (show v2)We are uning newTVar to create two TVars representing two accounts, from and to.Notice that, transfer ultimately performs four primitive read/write actions: a read and then write on account to, followed by a read and then write on account from. These four actions execute atomically, and that meets the specification given at the start of Section 2.The type system neatly prevents us from reading or writing a TVar outside of a transaction. For example, suppose we tried this:bad :: Account -> IO () bad acc = do hPutStr stdout "Withdrawing..." withdraw acc 10This program won't compile:import System.IO import Control.Concurrent.STM type Account = TVar Int withdraw :: Account -> Int -> STM () withdraw acc amount = do bal <- readTVar acc writeTVar acc (bal - amount) bad :: Account -> IO () bad acc = do hPutStr stdout "Withdrawing..." withdraw acc 10 main = do acc <- atomically (newTVar 200) bad acc hPutStr stdout "\nDone!\n"This program is rejected because the hPutStr is an IO action, while the withdraw is an STM action, and the two cannot be combined in a single do block. If we wrap a call to atomically around the withdraw, all is well:good :: Account -> IO () good acc = do hPutStr stdout "Withdrawing..." atomically (withdraw acc 10)This program compiles and runs:import System.IO import Control.Concurrent.STM type Account = TVar Int withdraw :: Account -> Int -> STM () withdraw acc amount = do bal <- readTVar acc writeTVar acc (bal - amount) good :: Account -> IO () good acc = do hPutStr stdout "Withdrawing..." {-hi-}atomically{-/hi-} (withdraw acc 10) main = do acc <- atomically (newTVar 200) good acc hPutStr stdout "\nDone!\n"3.3 Implementing transactional memoryThe guarantees of atomicity and isolation that I described earlier should be al'''
