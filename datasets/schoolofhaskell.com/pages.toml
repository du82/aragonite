["https://www.schoolofhaskell.com/school/advanced-haskell/xml-parsing-with-validation"]
title = "XML Processing with Error checking - School of Haskell | School of Haskell"
full_description = '''IntroductionOne of the most basic XML parsing tasks in web applications is reformatting XML data for display on a web page - basically using it as a markup language. For such chores, silently ignoring an invalid element is a minor problem. You get a missing or garbled row of data in output that's being read by a human, who can figure out what it should say, or ignore it, or even get the data from another source if it's the bit they're looking for.If that describes your application, you might consider using xml-conduit package, which has less complicated combinators. It is described in in our HTML parsing tutorial, which uses the same set of functions and operators, parsing the document with the HTML parser instead of an XML parser.Other applications of XML, like using it to hold program configuration information or data being collected in the field, are less tolerant of errors. A program misconfiguration can cause no end of problems, over and above missing data. If your application is processing financial data, that error could turn into a loss of money. If it's handling medical data - or worse yet, controlling medical equipment - then those errors could turn into a loss of life.XML provides tools for dealing with such conditions, and this tutorial is going to explore some of those.The applicationLet's build a simple financial application. It will process transactions made at a single ATM during the course of the day. A transaction consists of an account, the type of transaction (either a deposit or a withdrawal), and the amount. A real-world version of this would have a database back end, and update the accounts in the database as it processed them, but we're going to skip that. We'll just print the Haskell data structures in the document so we can verify that the XML was processed correctly.The softwareWe're going to be using the Haskell XML library HXT, as it provides the validation and processing features we need. The processing paradigm is arrows, which are very powerful, but unfortunately very complicated. This means we're going to be writing a lot of functions that are arrows, but we'll introduce the features we need.A note on DTD's, schemas and XMLIf you're not familiar with schemas at all, then the nickel tour is that they describe the structure of a valid document. For each tag, they list the valid attributes, contents and types for the tag. An XML document is said to be well-formed if it is syntactically correct XML, and the open and close tags pair up properly. An XML document is valid if it conforms to a schema. A document that isn't well-formed is called ill-formed, though not XML is also correct. An XML document that doesn't conform to a schema is invalid.The oldest format for schemas - predating XML - is the Document Type Definition, or DTD. A modern, more expressive format is the W3C XML Schema, which is XML. We're working with RelaxNG, because it has a compact form based on regular expressions that is easy for humans to read and edit as well as an XML form that is simpler than a W3C XML Schema, while having similar expressive power.The tool trang can be used to convert between these formats, and will warn you when you try using features of one that won't work in the other. It also has the ability to read XML files and create a schema for them.The schemaIn this case, we're fortunate enough to get to define schema we want to use. It's not at all unusual to be either given the schema, or worse, not be given the schema, and expected to figure out what is and isn't valid.The XML file will pretty much directly reflect our data structures. The RNC schema is:start = element transactions { (element deposit { info } | element withdrawal { info })+ } info = ( attribute account { xsd:positiveInteger }, attribute amount { xsd:decimal { pattern = "\d+.\d\d" }}, text )The root element is transactions. It contains a list of one or more (as denoted by the +) elements, each of which is either a withdrawal or (the |) a deposit element. Both those elements contain info, meaning they have account and amount atributes, and allow arbitrary text as content. The account attribute is a positive integer, and the amount attribute is a decimal number of dollars and cents.In XMLAs mentioned, this can be translated into a RelaxNG XML schema, and in fact that is what is required by HXT. It looks like:<?xml version="1.0" encoding="UTF-8"?> <grammar xmlns="http://relaxng.org/ns/structure/1.0" datatypeLibrary="http://www.w3.org/2001/XMLSchema-datatypes"> <start> <element name="transactions"> <oneOrMore> <choice> <element name="deposit"> <ref name="info"/> </element> <element name="withdrawal"> <ref name="info"/> </element> </choice> </oneOrMore> </element> </start> <define name="info"> <attribute name="account"> <data type="positiveInteger"/> </attribute> <attribute name="amount"> <data type="decimal"> <param name="pattern">\d+.\d\d</param> </data> </attribute> <text/> </define> </grammar>W3C XML VersionIf your software requires it, you can also translate it into a W3C XML Schema. While we won't use it, this looks like:<?xml version="1.0" encoding="UTF-8"?> <xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema" elementFormDefault="qualified"> <xs:element name="transactions"> <xs:complexType> <xs:choice maxOccurs="unbounded"> <xs:element ref="deposit"/> <xs:element ref="withdrawal"/> </xs:choice> </xs:complexType> </xs:element> <xs:element name="deposit"> <xs:complexType mixed="true"> <xs:attributeGroup ref="info"/> </xs:complexType> </xs:element> <xs:element name="withdrawal"> <xs:complexType mixed="true"> <xs:attributeGroup ref="info"/> </xs:complexType> </xs:element> <xs:attributeGroup name="info"> <xs:attribute name="account" use="required" type="xs:positiveInteger"/> <xs:attribute name="amount" use="required"> <xs:simpleType> <xs:restriction base="xs:decimal"> <xs:pattern value="\d+.\d\d"/> </xs:restriction> </xs:simpleType> </xs:attribute> </xs:attributeGroup> </xs:schema>As you can see, those are both harder to read than the RNC format. However, this is the last time we'll be using them. The RelaxNG schema will be in each example, but it won't change, so you can ignore it.ProcessingThe pieces are almost in place to start processing the data. But first, let's look at the sample data:<?xml version="1.0" encoding="utf-8"?> <transactions> <deposit account="1" amount="156.83">Payday!</deposit> <withdrawal account="1" amount="50.00" /> <deposit account="2" amount="218.12" /> <withdrawal account="2" amount="20.00" /> <deposit account="3" amount="123.45" /> <withdrawal account="3" amount="100.00" /> <deposit account="4" amount="1022.51" /> </transactions>The first example should give us back this input - give or take some formatting.Reading the fileParsing the XML - with or without validation - is done by the readDocument function. It expects two arguments. One is a list of options for parsing XML, and the other is a file name to read. Since we can't provide command line arguments, we hardcode the file name:readDocument [withRelaxNG "transactions.rng"] "transactions.xml"For now, we'll just write the data out in XML again. That uses writeDocument, which also takes two arguments, a list of options and a file name. In this case, we're going to use the file name "" to cause output to go to standard out:writeDocument [withIndent True, withOutputEncoding utf8] ""The two options give us nicely formatted output in UTF-8.Both of these functions return arrows, so can be combined with the >>> operator to produce a third arrow. This is just function composition ((.)) with arrows, so input values are passed to the first arrow, and the output of that to the second.{-# START_FILE Main.hs #-} import Text.XML.HXT.Core import Text.XML.HXT.RelaxNG main :: IO () main = do runX $ readDocument [withRelaxNG "transactions.rng"] "transactions.xml" >>> writeDocument [withIndent True, withOutputEncoding utf8] "" return () {-# START_FILE transactions.rng #-} <?xml version="1.0" encoding="UTF-8"?> <grammar xmlns="http://relaxng.org/ns/structure/1.0" datatypeLibrary="http://www.w3.org/2001/XMLSchema-datatypes"> <start> <element name="transactions"> <zeroOrMore> <choice> <element name="deposit"> <ref name="info"/> </element> <element name="withdrawal"> <ref name="info"/> </element> </choice> </zeroOrMore> </element> </start> <define name="info"> <attribute name="account"> <data type="positiveInteger"/> </attribute> <attribute name="amount"> <data type="decimal"> <param name="pattern">\d+.\d\d</param> </data> </attribute> <text/> </define> </grammar> {-# START_FILE transactions.xml #-} <?xml version="1.0" encoding="utf-8"?> <transactions> <deposit account="1" amount="156.83">Payday!</deposit> <withdrawal account="1" amount="50.00" /> <deposit account="2" amount="218.12" /> <withdrawal account="2" amount="20.00" /> <deposit account="3" amount="123.45" /> <withdrawal account="3" amount="100.00" /> <deposit account="4" amount="1022.51" /> </transactions>A list of Transaction'sNow that we can parse the XML transaction list, let's turn it into a list of Haskell Transaction's. A transaction is:import Data.Fixed (Centi) import Data.Text (Text, pack) type Comment = Maybe Text data Transaction = Deposit !Text !Centi !Comment | Withdrawal !Text !Centi !Comment deriving ShowWe introduce a type alias for Comment, which may or may not be present.For the actual data type, we use Centi instead of Float or Double because dollars and cents are a Centi values, and an obvious choice if we want to avoid the various issues with floating point representations. The account number could be an Integer, but making it Text leaves room for future changes. We also force all the values in the record to be strict with the ! prefix.Selecting our elementsHXT processes XML documents as lists of nodes. It provides a set of functions - specifically arrows - that transform an input list of nodes into an output list of nodes. Our select function will use those functions to produce a list of just the elements we want to process.The document element of an XML document has as it's children information about the document as well as the parsed XML document, which we can extract with getChildren. We want only the transactions element from those, so we use hasName to select that. The transactions children are the elements of interest. However, it also has text children from the whitespace between the elements, so we use isElem to get only the XML elements from the childre. So we select only the elements:select = getChildren >>> hasName "transactions" >>> getChildren >>> isElemSince we're using a validated document, we could replace the hasName "transactions" with isElem and get the same result. We could also leave it off entirely, but that would then process all the children of the document root through the second getChildren, rather than just the element we want.Constructing the data type we wantSince HXT is going to provide a string for the tag name, we need a function to map those to the appropriate constructors:make "deposit" = Deposit make "withdrawal" = Withdrawal make trans = error $ "Invalid transaction type: " ++ transThe final case isn't strictly necessary, as the validation will insure that it's never invoked. However, leaving the function definition partial is a sufficiently bad idea that we'll provide it anyway.Getting Haskell dataIn order to turn the elements into Haskell data, we're going to use the features enabled by the Arrows extension:transform = proc el -> do trans <- getName -< el account <- getAttrValue "account" -< el amount <- getAttrValue "amount" -< el comment <- withDefault (Just . pack ^<< getText <<< getChildren) Nothing -< el returnA -< (make trans) (pack account) (read amount) commentHere the Arrows keyword proc, like do, provides syntactic sugar but builds a function that is an arrow. It takes arguments simular to a lambda, in this case one, el, and passes it to the defined arrow. Inside the arrow, the Arrows syntax -< can be used to process values through arrows. If one of the internal arrows should fail for some reason, then processing stops.This arrow uses getName to get the name of the transaction, then getAttrValue to get the account and amount attribues.To get the comment, we use getText on the nodes children (provided by getChildren) to extract the text. That is then passed to pack and Just to get a Maybe Text value, using the ^<< combinator to combine Just . pack with an arrow. The withDefault function is used to return the text if available, or Nothing if there is no text available.The last step is to use the previously defined make function to create a transaction from that data, and pass it to returnA to get it back to our arrow monad.Putting it all togetherWith all that in place, all we need to do is modify main to pass the data through select and then transform to get a list of Transactions, which will will them mapM_ print over to demonstrate the results.{-# START_FILE Main.hs #-} {-# LANGUAGE Arrows #-} import Text.XML.HXT.Core import Text.XML.HXT.RelaxNG import Data.Text (Text, pack) import Data.Fixed (Centi) type Comment = Maybe Text data Transaction = Deposit !Text !Centi !Comment | Withdrawal !Text !Centi !Comment deriving Show make "deposit" = Deposit make "withdrawal" = Withdrawal make trans = error $ "Invalid transaction type: " ++ trans select = getChildren >>> hasName "transactions" >>> getChildren >>> isElem transform = proc el -> do trans <- getName -< el account <- getAttrValue "account" -< el amount <- getAttrValue "amount" -< el comment <- withDefault (Just . pack ^<< getText <<< getChildren) Nothing -< el returnA -< (make trans) (pack account) (read amount) comment main :: IO () main = do tl <- runX $ readDocument [withRelaxNG "transactions.rng"] "transactions.xml" >>> select >>> transform mapM_ print tl {-# START_FILE transactions.rng #-} <?xml version="1.0" encoding="UTF-8"?> <grammar xmlns="http://relaxng.org/ns/structure/1.0" datatypeLibrary="http://www.w3.org/2001/XMLSchema-datatypes"> <start> <element name="transactions"> <zeroOrMore> <choice> <element name="deposit"> <ref name="info"/> </element> <element name="withdrawal"> <ref name="info"/> </element> </choice> </zeroOrMore> </element> </start> <define name="info"> <attribute name="account"> <data type="positiveInteger"/> </attribute> <attribute name="amount"> <data type="decimal"> <param name="pattern">\d+.\d\d</param> </data> </attribute> <text/> </define> </grammar> {-# START_FILE transactions.xml #-} <?xml version="1.0" encoding="utf-8"?> <transactions> <deposit account="1" amount="156.83">Payday!</deposit> <withdrawal account="1" amount="50.00" /> <deposit account="2" amount="218.12" /> <withdrawal account="2" amount="20.00" /> <deposit account="3" amount="123.45" /> <withdrawal account="3" amount="100.00" /> <deposit account="4" amount="1022.51" /> </transactions>Handling errorsSo now let's see what happens if we have an error in the data. For example, what happoens if a withdra'''
