title = "Bartosz Milewski | School of Haskell"
full_description = '''Bartosz used to be a physicist (he has a Ph.D. in Quantum Physics) but he fell in love with programming and joined Microsoft as the development lead of the Content Index team -- the search engine before the Internet. Whenever you do a file search on Windows, you're running his code.After Microsoft, Bartosz started his own company, Reliable Software, where he designed and helped implement the first peer-to-peer version control system, Code Co-op, which is still in commercial use.He became an expert in C++ and published the book C++ In Action. He is best known for his blog, in which he discusses topics in concurrency, parallelism, language design, functional programming, and many other areas. He attended one C++ Standard Committee meeting on concurrency and decided that C++ was too far behind Haskell or even C# in this area. He's a frequent speaker at professional conferences on topics ranging from multicore architectures to implementing Haskell monads across languages.He has been the architect of the FP Complete School of Haskell.He is currently working on the book "Categories for Programmers."You can send him email to: his first name at relisoft.com.'''
