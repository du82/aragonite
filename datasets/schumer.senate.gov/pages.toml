full_description = '''Voting Record Search Voting Records on Congress.gov Search Congress.gov $('.js-inline-search-input').on('focus', function() { $(this).closest('.InlineSearch').addClass('InlineSearch--focused') }) $('.js-inline-search-input').on('blur', function() { $(this).closest('.InlineSearch').removeClass('InlineSearch--focused') }) $(function () { $('#CongressGovSearch--main').on('submit', function (e) { e.preventDefault(); var data = {}; $(e.target).serializeArray().each(function(field) { data[field.name] = field.value; }); var urlOptions = { "source": 'congrecord', "search": data.q }; if (data.congress) { urlOptions.congress = data.congress } urlOptionsAsString = JSON.stringify(urlOptions); var windowUrl = 'https://www.congress.gov/search?&q=' + encodeURIComponent(urlOptionsAsString) + '&searchResultViewType=expanded'; window.open(windowUrl, "_newtab"); }); }); /* Gov track API call https://www.govtrack.us/developers/api max limit is 600 sort by date created (-created +created) */ $(function () { // specfic congress var apiurl = 'https://www.govtrack.us/api/v2/vote_voter?limit=300&order_by=-created&format=jsonp&person=300087'; var container = $('#js-voting-record'); var thispage = $('<div class="js-page VotingRecordList" />').appendTo(container); var loading = $('<div class="VotingRecordList__loading Loading"><div class="Loading__spinner"><div></div><div></div><div></div><div></div></div></div>'); $(thispage).append(loading); /* --- local json --- */ $.ajax({ dataType: "jsonp", url: apiurl, cache: true, success: function (rslt) { var i = 0; var rowNum = 10; //var filter = 113; var row; $(loading).remove(); // loop through all the votes $.each(rslt.objects, function (index) { // varibles from object --------------------------- // date --- var whole_date = this .vote .created .split('T');; var date = moment(whole_date[0], 'YYYY-MM-DD').format('MM.DD.YYYY'); // etc --- var question = this.vote.question; var result = this.vote.result; var link = this.vote.link; var congress = this.vote.congress; var vote = this.option.value; var voteIsTrue = (vote == 'Yea'); var resultIsTrue = (result.indexOf('Passed') >= 0); // remove the underscore from some categories to enable line breaks var category = this .vote .category .replace('_', ' '); var row = ''; if (i == 0) { row += '<hr class="Separator my-0 d-none d-md-block"><div class="VotingRecordList__header d-none d-md-block">' + '<div class="row">' + '<div class="col-md-2">Date</div>' + '<div class="col-md-5">Bill</div>' + '<div class="col-md-1">Vote</div>' + '<div class="col-md-2">Result</div>' + '<div class="col-md-2">Category</div>' + '</div>' + '</div><hr class="Separator my-0">'; } row += '<div class="row VotingRecordList__item">' + '<div class="col-md-2 VotingRecordList__date"><strong class="d-md-none">Date: </strong>' + date + '</div>' + '<div class="col-md-5">' + '<a class="VotingRecordList__link Link" href="' + link + '" target="_blank">' + question + '</a>' + '</div>' + '<div class=" col-md-1 VotingRecordList__vote VotingRecordList__vote--' + voteIsTrue + '"><strong class="d-md-none">Vote: </strong><span class="VotingRecordList__voteLabel">' + vote + '</span></div>' + '<div class="col-md-2 VotingRecordList__result--' + resultIsTrue + '">' + result + '</div>' + '<div class="col-md-2 VotingRecordList__category"><strong class="d-lg-none">Category: </strong>' + category + '</div>' + '</div>' + '<hr class="Separator">'; // add row to the page element $(thispage).append(row); // track rows i++; // create a new page element if (i === rowNum && index != rslt.objects.length - 1) { i = 0; thispage = $('<div class="js-page VotingRecordList" />').appendTo($('#js-voting-record')); } }); addPage(); $('.js-page:not(:first-child)').hide(); window.refreshScrollTriggers(); }, error: function (XMLHttpRequest, textStatus, errorThrown) { console.log('ERROR GETTING RECORD'); } }); // Pagination ------------------------------------------------------------------------- var addPage = function () { var pageCount = 1; var pageMax = $('.js-page').length; var loopIndex; // pagination select var pg_select = '<form class="pagination__selector form-inline">' + '<label for="js-pg_select" class="sr-only">Page Select</label>' + '<select alt="pg_select" id="js-pg_select" class="InputSelect InputSelect--sm InputSelect--inline InputSelect--pagination">'; for (i = 0; i < pageMax; i++) { loopIndex = i + 1; pg_select += '<option alt="pg_select_item" label="' + loopIndex + '" val="' + loopIndex + '">' + loopIndex + '</option>'; } pg_select += '</select></form>'; // pagination element var pagination = $('<div class="pagination row align-items-center justify-content-between">' + '<div class="js-pages VotingRecordList__select col col-md-auto my-3">' + 'Showing Page ' + '<span>' + pg_select + '</span>' + ' of ' + '<span>' + pageMax + '</span>' + '</div>' + '<div class="col-md-auto my-3">' + '<div class="js-pages_nav row justify-content-md-end justify-content-between">' + '<div class="col-auto col-sm-auto">' + '<button type="button" class="js-arrw js-back Button Button--md Button--paginationLeft Button--block">Previous</button>' + '</div>' + '<div class="col-auto col-sm-auto">' + '<button type="button" class="js-arrw js-next Button Button--md Button--paginationRight Button--block">Next</button>' + '</div>' + '</div>' + '</div></div>'); // add pagination $('#js-voting-record').append(pagination); $('.js-back').hide(); $('.js-page:first-child').fadeIn(); // btn actions $('#js-voting-record .js-pages_nav .js-arrw').bind('click', function () { changePage(this); }); // select menu $('#js-voting-record .js-pages #js-pg_select').change(function () { pageCount = $(this).val(); updatePage(pageCount); }); // update the page based un btn var changePage = function (ele) { if ($(ele).hasClass('js-next')) { pageCount++; if (pageCount > $('.js-page').length) { pageCount = $('.js-page').length; } } else { pageCount--; if (pageCount < 1) { pageCount = 1; } } updatePage(pageCount); } // change the page var updatePage = function (num) { $('.js-page').hide(); $('#js-voting-record .js-pages #js-pg_select').val(num); $('.js-page:nth-child(' + num + ')').fadeIn(); $('html, body').animate({ scrollTop: 0 }, 'fast'); // btn boundaries $('.js-arrw').blur(); $('.js-arrw').show(); if (num == 1) { $('.js-back').hide(); } if (num == pageMax) { $('.js-next').hide(); } } }; });'''
