["https://www.schumer.senate.gov/services/congressionally-directed-spending"]
title = "Congressionally Directed Spending Requests - FY 2026 | Senator Chuck Schumer of New York"
description = "The Official U.S. Senate website of Senator Chuck Schumer of New York"
full_description = "Congressionally Directed Spending Requests – Fiscal Year (FY) 2026 Senator Schumer is now accepting preliminary requests for New York-based projects for FY 2026. These requests must be completed and submitted via electronic application by Monday, March 31, 2025 at 11:59 PM ET. Please note that the Appropriations Committee has set the following conditions on Congressionally Directed Spending (CDS) items: Eligible entities include state and local government entities and non-profit organizations. For-profit entities are not eligible for Congressionally Directed Spending. Congressionally Directed Spending items that are selected for funding by the Appropriations Committee are subject to audits by the Government Accountability Office. Funding is limited and not all eligible requests will be funded. To get started with your Congressionally Directed Spending Request and to access a FY 2026 Form and Instructions, CLICK HERE. Organizations are encouraged not to wait until the last minute to begin this process so that any corrections that need to be made or any questions that need to be answered can be. As a reminder, all forms must be completed and submitted by 11:59 PM on Monday, March 31, 2025. The FY 2026 Form is subject to change pending guidance from the Appropriations Committee, including a list of accounts that are eligible for CDS. A specific list of the CDS accounts and eligibility requirements in the FY 2025 process is available here. This website and form will be updated accordingly when the FY 2026 guidance is available. While funding projects through Congressionally Directed Spending is an option, organizations are also strongly encouraged to consider pursuing and applying for federal grants. Information on federal grants that are administered through the various government agencies is available through the Grants.gov Program Management Office. The website address for federal grant programs is https://www.grants.gov. For any questions regarding your CDS request or the FY 2026 process, please do not hesitate to contact my staff by calling my Washington D.C. office. Thank you for your interest in and commitment to improving the quality of programs and institutions in New York. Together we can keep New York at the forefront of cultural, educational, and economic excellence. CDS REQUESTS FY2025 CDS REQUESTS FY2024 cds requests fy2023"
year_published = 2025
clearnet = "https://www.schumer.senate.gov/services/congressionally-directed-spending"
