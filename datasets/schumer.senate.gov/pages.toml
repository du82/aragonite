["https://www.schumer.senate.gov/services"]
title = "Services | Senator Chuck Schumer of New York"
description = "We are happy to work with New Yorkers to arrange tours of the White House or the U.S. Capitol."
full_description = "Help for New Yorkers Leave a comment Services Need help with a Federal Agency? We are here to help you navigate the often frustrating and confusing government bureaucracies so you can get the help you need. How Can We Help? If you need assistance with your citizenship, green card, family or other petitions, DACA, employment authorization, and travel document, we can help. OPEN YOUR CASE Immigration We can help with your application for a first time passport or renewal. OPEN YOUR CASE Passports If you need immigrant or nonimmigrant visas, or if you are a U.S.citizen in an emergency abroad and need assistance from the nearest U.S. Embassy or Consulate, we can help OPEN YOUR CASE Visas & U.S. Citizens Abroad We can help get answers on your pending application for retirement or disability benefits. Open Your Case Social Security If you are a senior or person with disabilities, we can help you navigate Medicare claims. OPEN YOUR CASE Medicare If you are have questions about your tax filings for the current or previous years, we can help to get the answers. OPEN YOUR CASE Taxes If you are a New York service member seeking help in resolving a specific problem within the military, please contact us. OPEN YOUR CASE Military Assistance If you are seeking help in resolving a specific problem or need help obtaining the status of a pending claim with the Department of Veterans Affairs, please contact us. OPEN YOUR CASE Veteran's Assistance If you are experiencing difficulties receiving your mail or packages from the US Postal Service, please contact us. OPEN YOUR CASE United States Postal Service (USPS) Fill out our general casework form if you need help with a different topic. OPEN YOUR CASE Other Have questions about your casework? If you have already filled out and submitted your casework form above, you may contact the New York City office at (212) 486-4430. Our office continues to accept voicemail messages on this line and will do its best to respond to you as quickly as possible. We can also help with Tour Requests We are happy to work with New Yorkers to arrange tours of the White House or the U.S. Capitol. Learn More Flags We can assist New Yorkers with the purchase of flags flown over the U.S. Capitol building. Learn More Grant Requests We can help eligible grantseekers in New York find information on federal funding resources. Learn More Special Recognitions Request a personal letter honoring a special event. Learn More Congressionally Directed Spending My office will accept Congressionally Directed Spending request forms only from New York-based non-profit organizations, local and state agencies. For-profit organizations are not eligible for Congressionally Directed Spending. Learn More STUDENTS Our office is dedicated to helping the next generation reach their full potential. Whether finding an internship opportunity, navigating financial aid assistance, submitting service academy nominations, or exploring the Senate Page program, we are here to help. read more $('.Banner__featuredButtonsLayout a').on('click', function(event) { if (this.pathname.replace('/', '') !== window.location.pathname.replace('/', '')) return; debugger; event.preventDefault(); var offsetHeight = window.getStuckHeaderHeight() || 0; var targetElement = document.getElementById('help'); if (targetElement && gsap) gsap.to(window, {duration: 1, scrollTo: {y: targetElement, offsetY: offsetHeight}, ease: 'power3'}); })"
