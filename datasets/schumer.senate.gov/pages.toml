["https://schumer.senate.gov/services/grants"]
title = "Grants | Senator Chuck Schumer of New York"
description = "The Official U.S. Senate website of Senator Chuck Schumer of New York"
full_description = '''Grants Grants and Federal Domestic Assistance .more { display: none; /* border-top: 1px solid #666; border-bottom: 1px solid #666; */ } .more { display: none; /* border-top: 1px solid #666; border-bottom: 1px solid #666; */ } a.itemLink { text-decoration: none; color: #7496af; } a.itemLink:hover { text-decoration: underline; } a.showLink, a.hideLink { text-decoration: none; color: #7496af; padding-left: 3px; background: transparent url('down.gif') no-repeat left; } a.hideLink { background: transparent url('up.gif') no-repeat left; } a.showLink:hover, a.hideLink:hover { border-bottom: 1px dotted #5B85C9; } function showHide(shID) { if (document.getElementById(shID)) { if (document.getElementById(shID+'-show').style.display != 'none') { document.getElementById(shID+'-show').style.display = 'none'; document.getElementById(shID+'-hide').style.display = 'inline'; document.getElementById(shID).style.display = 'block'; } else { document.getElementById(shID+'-show').style.display = 'inline'; document.getElementById(shID+'-hide').style.display = 'none'; document.getElementById(shID).style.display = 'none'; } } } <!-- .style6 { COLOR: #000000 } --> Guidance and key resources to help eligible grantseekers find information on federal grants, loans, and nonfinancial assistance, as well as on private funding. Prepared by the Congressional Research Service for the U.S. Senate, updated May 2024. How Best to Find Information Key Federal Funding Sources Related Federal Sources Private and Corporate Funding How Best to Find Information TOP Find out Who is eligible for a Grant? Other government websites may be more suitable for personal needs, student loans, small business assistance, or other business opportunities such as government contracting. If eligible, search for programs at Assistance Listings . Includes grants, loans, business and nonfinancial help. Contact federal office given in each Assistance Listing program description. Go to federal websites given in each Assistance Listing program description for more information and for state administering agencies responsible for managing these programs. Check current federal grants opportunities at Grants.gov , register with System for Award Management (SAM), and apply online (links and instructions given at the website). Additional notices appear at FedConnect. Search foundations for project funding: use the Candid website or Foundation Information Network resources in libraries to identify national, state, and community foundations. Learn how to write grant proposals: Take the free online Foundation Center Proposal Writing Short Course, or see other tips and sample proposals at How Do I Write a Grant Proposal? Key Federal Funding Sources TOP Assistance Listings at SAM.gov Grants.gov State Single Points of Contact Assistance Listings at SAM.gov (General Services Administration) Official descriptions of more than 2,200 federal assistance programs (including grants, loans, and other financial and nonfinancial assistance) can be found on SAM.gov. The website is produced by the General Services Administration (GSA) and it houses federal assistance listings previously found on the now-retired Catalog of Federal Domestic Assistance (CFDA). Each federal assistance program has a corresponding CFDA program number; these CFDA numbers are still used as numerical program identifiers. Descriptions are updated by departments and agencies, and they cover authorizing legislation, objectives, and eligibility and compliance requirements. For current notices of funding availability, see Grants.gov or FedConnect . Grants.gov (via Dept. of Health and Human Services) Federal grants website that allows eligible grantseekers (see Who is eligible for a Grant? ) to find and apply for current competitive grant opportunities from ALL federal agencies. Grantseekers can check on notices of funding availability (NOFAs) posted in the last 7 days; access RSS feeds of grant opportunities; and apply for federal grants through a unified process by downloading the application and submitting online. The website guides grantseekers in registering with System for Award Management (SAM), and registering with Grants.gov to apply and to track applications. Also see the FedConnect website for additional grants and contracts opportunities. State Single Points of Contact (Office of Management and Budget) Under Executive Order 12372, some states require federal grants applicants to submit a copy of their application for state government level review and comment. The state offices listed here coordinate federal financial assistance and may direct federal development. For help in identifying state-level grants, other state government agencies websites may be found at State and Local Agencies . Related Federal Resources TOP A-Z Index Departments & Agencies Energy Efficiency and Renewable Energy Homeland Security Grants USA.gov for Business Student Aid on the Web Benefits.gov FTC Consumer Alert OMB Circulars A-Z Index of U.S. Department and Agencies (General Services Administration) To better develop a grant proposal, search a department or agency's Home Page to learn more about its programs and objectives. The site USA.gov also links to Government Benefits, Grants and Loans . Energy Efficiency and Renewable Energy Funding (Department of Energy) Grants are EERE's primary funding vehicle for businesses, industries, universities and others. Most EERE grants are awarded on merit on a competitive basis. See also EERE Financial Opportunities and listings on Grants.gov or FedConnect . For state-by-state information on state, local, utility, and federal incentives that promote renewable energy and energy efficiency, search DSIRE (Database of State Incentives for Renewables and Efficiency). DHS Financial Assistance (Department of Homeland Security) Most Homeland Security non-disaster grant programs are designated for state and local governments and specific entities such as colleges, etc. Unsolicited applications from individuals are generally not accepted. Includes Urban Area Security Initiative, Citizens Corps, Medical Response System, Operation Stonegarden (border security), Infrastructure Protection. Contact homeland security State Offices . Programs for firefighters may be found at Assistance to Firefighters . USA.gov for Businesses and Nonprofits ( GSA ) Includes contracting with the federal government, international trade and exporting, and small business. See also financial assistance links at the Small Business Administration website. Federal Contract Opportunities ( GSA ) Official website posting business, contracting, and procurement opportunities with the federal government. Search options include an advanced search form for more targeted filtering of current opportunities. Student Aid on the Web (Department of Education) Financial assistance for education beyond high school is generally "needs-based" and often includes loans and work-study, in addition to some grants. College and university applications, websites, and brochures usually include financial aid information for prospective and incoming students. Benefits.gov ( via Department of Labor ) Government grants are not direct assistance to individuals, but fund state and local programs providing help to those in need. This online screening site can be used to identify state and local government benefits and how to apply. Covers direct payments, loans, insurance, training, or other services. FTC Consumer Alert (Federal Trade Commission) The FTC warns consumers to beware of paying "processing fees" for information that is available free to the public. Ads claiming federal grants are available for home repairs, home business, unpaid bills, or other personal expenses are often a scam. OMB Grants Management Website (Office of Management and Budget) OMB establishes government-wide grants management policies and guidelines through circulars and common rules. OMB Circulars are cited in SAM.gov Assistance Listing program descriptions and may be printed out full text. Private and Corporate Funding Sources TOP Candid Grants Space Gateway to information about private funding sources, the grantseeking process, guidelines on writing a grant proposal, addresses of state libraries with grants reference collections, and links to other useful websites. Candid maintains a comprehensive Foundation Directory Online database on foundations; produces print and electronic directories and guides; conducts research and publishes studies in the field; and offers a variety of training and educational seminars. How do I find grants for my nonprofit? Proposal Writing Short Course (also in Spanish) Foundation Information Network (by state) Check for locations. Free funding information available in libraries, community foundations, and other nonprofit centers nationwide. Grants Resources by State (Grantsmanship Center) Click on state map to find links to information about a state's foundations, community foundations, corporate giving programs and the state's home page. Community Foundations There are more than 750 community foundations in the U.S., which are grantmaking public charities dedicated to improving the lives of people in a defined local geographic area. The Council on Foundations has a listing of community foundations by state. Also see these Congressional Research Service reports available to the public: Resources for Grantseekers How to Develop and Write a Grant Proposal Small Business Administration: A Primer on Programs and Funding Overview of the Federal Procurement Process and Resources'''
year_published = 2025
