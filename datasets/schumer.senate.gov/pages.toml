full_description = '''U.S. Senator Chuck Schumer of New York if (typeof initializeBannerGallery !== 'function') { function initializeBannerGallery() { new Splide('#banner-gallery-AWabK0QLsM', { type: 'fade', // 'loop' or 'fade' width: '100%', cover: true, heightRatio: 0.6, autoplay: true, rewind: true, interval: 4000, speed: 2000, drag: false, arrows: false, keyboard: false, pagination: false, pauseOnHover: false, }).mount(); } } initializeBannerGallery() 999 Chuck Around NY See where Chuck has been and what he's been doing. View Events <div class="EventMapWidget__itemDate">{{ date }}</div> {% if summary %} <div class="EventMapWidget__itemCity">{{ summary }}</div> {% elif city %} <div class="EventMapWidget__itemCity">{{ city }}, {{ state or 'NY' }}</div> {% endif %} <div class="EventMapWidget__itemTitle"> {{ description | safe | striptags(true) | truncate(150) }} </div> <a class="EventMapWidget__itemLink" href="/{{ url }}">View Event Details</a> delete window.eventData; window.eventData = { "A61296EE-3918-4912-9428-0E548CF95644": { "TotalRows": 82, "uid": "A61296EE-3918-4912-9428-0E548CF95644", "title": "Schenectady CHCs", "summary": "Schenectady, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "2.10.2025", "url": "about/chuck-around-new-york/schenectady-chcs", "city": "Schenctady", "county": "Schenectady", "lat": 42.800331115722656, "lng": -73.92750549316406, "description": "<p>Standing at Schenectady’s Hometown Health Centers Dental Clinic, U.S. Senator Chuck Schumer demanded immediate answers from the HHS amid <a href=\"https://www.syracuse.com/health/2025/01/syracuse-health-center-will-borrow-to-cope-with-trumps-funding-pause-and-eyes-cuts-if-it-drags-on.html\">funding delays</a> and recurring portal shutdowns in the fallout of Trump’s funding freeze fiasco. <a href=\"https://www.nbcnews.com/politics/donald-trump/health-clinics-face-cuts-closures-trumps-funding-fight-ripples-washing-rcna191014\">Community Health Centers (CHCs), which uniquely rely on federal funding, are now closing and even laying off staff across the country</a> as a result of these unexplained disruptions, and Schumer said we need these payment systems fixed now to ensure doctors can continue vital healthcare services.</p>" }, "93ED8BE9-E519-44D1-87B2-681B9CF57900": { "TotalRows": 82, "uid": "93ED8BE9-E519-44D1-87B2-681B9CF57900", "title": "Syracuse CHCs", "summary": "Syracuse, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "2.10.2025", "url": "about/chuck-around-new-york/syracuse-chcs", "city": "Syracuse", "county": "Erie", "lat": 43.03850173950195, "lng": -76.15038299560547, "description": "<p>Standing at Syracuse Community Health, U.S. Senator Chuck Schumer demanded immediate answers from the HHS amid <a href=\"https://www.syracuse.com/health/2025/01/syracuse-health-center-will-borrow-to-cope-with-trumps-funding-pause-and-eyes-cuts-if-it-drags-on.html\">funding delays</a> and recurring portal shutdowns in the fallout of Trump’s funding freeze fiasco. <a href=\"https://www.nbcnews.com/politics/donald-trump/health-clinics-face-cuts-closures-trumps-funding-fight-ripples-washing-rcna191014\">Community Health Centers (CHCs), which uniquely rely on federal funding, are now closing and even laying off staff across the country</a> as a result of these unexplained disruptions, and Schumer said we need these payment systems fixed now to ensure doctors can continue vital healthcare services.</p>\r\n<p>The senator is also sounding the alarm on the looming expiration of CHC’s main federal funding program next month if Congress doesn’t act, which was set to be extended last year, until Elon Musk sunk the bipartisan spending agreement. Schumer said with DOGE and the Trump Administration's indiscriminate cutting, CHCs are at serious risk of the chopping block, but he is leading the charge to protect this lifeline for 80,000 in Central NY and millions across America.</p>" }, "CE23D2CF-C5B3-46E3-B6B7-14E0B158CCFB": { "TotalRows": 82, "uid": "CE23D2CF-C5B3-46E3-B6B7-14E0B158CCFB", "title": "Rochester Egg Prices", "summary": "Rochester, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "1.27.2025", "url": "about/chuck-around-new-york/rochester-egg-prices", "city": "Rochester", "county": "Monroe", "lat": 43.14827346801758, "lng": -77.5779800415039, "description": "<p>On Janurary 27th, 2025, amid the increasing price of eggs in the Rochester-Finger Lakes region and across Upstate New York, U.S. Senator Chuck Schumer today stood at Rochester’s beloved Jines Restaurant and called on HHS and the USDA to surge funding and get all hands on deck for coordinated federal response to stop the spread causing sky-rocketing egg prices and lower costs for families, diners, and local bakeries.</p>\r\n<p>“Everyone in Rochester has eaten at Jines at some point, but diners like Jines and families in Rochester have been shell-shocked by higher egg and grocery prices. Egg prices are skyrocketing because of bird flu, driving costs up for families, farms, diners, and small businesses. In November, a dozen eggs cost about $4 in NY which is already high, but now the average is nearly $6, and with bird flu getting worse this problem could quickly spiral into a crisis,” <strong>said Senator Schumer. “</strong>Last year I secured millions to help contain this disease and we need the new administration to surge biosecurity efforts to beat back bird flu. We need a robust, coordinated federal response to <em>crack</em> down on bird flu and I am committed to working in a bipartisan way with the new administration to get grocery prices lower and that starts with getting a handle on bird flu. The health of our livestock, our restaurants, and Rochester families’ wallets depend on it.”</p>" }, "2B35F1AA-EC3A-4CAF-A5FD-A52E43415C81": { "TotalRows": 82, "uid": "2B35F1AA-EC3A-4CAF-A5FD-A52E43415C81", "title": "Hudson-Athens Lighthouse", "summary": "Athens, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "12.16.2024", "url": "about/chuck-around-new-york/hudson-athens-lighthouse", "city": "Athens", "county": "Greene", "lat": 42.2598876953125, "lng": -73.80815887451172, "description": "<p>After months of advocacy, U.S. Senate Majority Leader Chuck Schumer announced at the Stewart House in Athens, NY, that the U.S. Army Corps of Engineers (USACE) has selected the historic Hudson-Athens Lighthouse for their protection program and identified the Lighthouse as a priority for the Corps opening the desperately needed federal funding to help restore this beloved site. </p>\r\n<p>Now thanks to Schumer’s efforts, the Army Corps will begin work with Hudson-Athens Lighthouse Preservation Society to fund the engineering and construction work needed to save the lighthouse and stabilize the structure.</p>" }, "F4A6A6C4-BFFE-4E2F-A559-D1AA67500F21": { "TotalRows": 82, "uid": "F4A6A6C4-BFFE-4E2F-A559-D1AA67500F21", "title": "Buffalo HEARTS Act", "summary": "Cheektowaga, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "12.9.2024", "url": "about/chuck-around-new-york/buffalo-hearts-act", "city": "Cheektowaga", "county": "Erie", "lat": 42.91120529174805, "lng": -78.75643920898438, "description": "<p>On December 9, 2024, Standing with Buffalo Bills’ Safety Damar Hamlin, student-athletes, and Bills Mafia, U.S. Senate Majority Leader Chuck Schumer announced he will bring the lifesaving <em>HEARTS Act</em>, which he and Damar have worked together on for months, to the Senate floor this week for a unanimous consent vote to be passed into law. Schumer and Hamlin are now launching their final push to show why all should support this bipartisan legislation to help schools and students be prepared to respond to cardiac emergencies by making AEDs and CPR training more accessible across America. </p>" }, "30EFE78F-08B9-4F98-8C98-67A1D787CC5A": { "TotalRows": 82, "uid": "30EFE78F-08B9-4F98-8C98-67A1D787CC5A", "title": "Lewis County Kraft Visit", "summary": "Lowville, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "12.6.2024", "url": "about/chuck-around-new-york/lewis-county-kraft-visit", "city": "Lowville", "county": "Lewis", "lat": 43.778167724609375, "lng": -75.48291015625, "description": "<p>On December 6th, 2024, U.S. Senate Majority Leader Charles E. Schumer toured Lowville’s Kraft Heinz dairy plant to meet with workers and management after <a href=\"https://urldefense.com/v3/__https:/www.nny360.com/news/schumer-visits-lowville-kraft-heinz-plant-discusses-expansion/article_a2f034ec-9488-56a5-8455-c0837685cbfe.html__;!!JtwtF54jn92Iq-I!aHRAtBIEXpWnIOeVsvXDHLF5-526xcfI0s8ftdjXtz0YF9trSAI3tYM4wBoj1GvlmzrdP4KHa3lTeAwam_-xoG8JBEXd_8q7dVgL$\">saving the facility in 2015</a>, protecting hundreds of jobs in the North Country. Schumer highlighted that earlier this year Kraft Heinz in Lewis County was awarded an estimated <a href=\"https://urldefense.com/v3/__https:/www.schumer.senate.gov/newsroom/press-releases/schumer-announces-lowvilles-kraft-heinz-plant-to-receive-estimated-22-million-via-the-bipartisan-infrastructure-law-and-inflation-reduction-act-to-upgrade-electrify_transition-north-country-dairy-plant-to-clean-energy-to-reduce-greenhouse-gas-emissions__;!!JtwtF54jn92Iq-I!aHRAtBIEXpWnIOeVsvXDHLF5-526xcfI0s8ftdjXtz0YF9trSAI3tYM4wBoj1GvlmzrdP4KHa3lTeAwam_-xoG8JBEXd__rLqwo4$\">$22 million</a> in federal funding from the U.S. Department of Energy’s (DOE) Industrial Demonstrations Program (IDP) to upgrade and decarbonize its heating process to significantly reduce carbon emissions in pursuit of the company’s zero carbon by 2050 goal. Today, the Senator proudly announced that Kraft Heinz has successfully completed award negotiations with the Department of Energy on Phase I of the planned four-phase project. </p>" }, "B79E15B5-F556-45B8-98CE-FE88D456F82B": { "TotalRows": 82, "uid": "B79E15B5-F556-45B8-98CE-FE88D456F82B", "title": "Herkimer Dairy Cliff", "summary": "Little Falls, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "12.6.2024", "url": "about/chuck-around-new-york/herkimer-dairy-cliff", "city": "Little Falls", "county": "Herkimer", "lat": 42.997066497802734, "lng": -74.86509704589844, "description": "<p>On December 6th, 2024, Standing at Casler Family Farm in Little Falls, U.S. Senate Majority Leader Charles E. Schumer revealed how the vital <em>Dairy Margin Coverage Program (DMC) </em>Mohawk Valley dairy farmers rely on is in limbo as the program is set to expire, which could have farmers facing a “dairy cliff,’ – an outcome that could double wallop farmers and consumers.</p>\r\n<p>Schumer explained the DMC, which offers monthly price support payments from the feds to dairy farmers, will end this month and if no action is taken would lead to less support for our farmers, severe supply chain disruptions, and an increase in the price of milk. Schumer said it is imperative we protect this program to ensure Upstate New York dairy farmers have the support and safety net they need.</p>" }, "8608E554-F71F-4102-A3D1-CCABB2FD1E47": { "TotalRows": 82, "uid": "8608E554-F71F-4102-A3D1-CCABB2FD1E47", "title": "Schoharie Bridge", "summary": "Schoharie, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "12.6.2024", "url": "about/chuck-around-new-york/schoharie-bridge", "city": "Schoharie", "county": "Schoharie", "lat": 42.67529296875, "lng": -74.30316925048828, "description": "<p>Standing at the Schoharie Bridge St. Bridge, U.S. Senate Majority Leader Charles E. Schumer announced, after months of advocacy he has successfully gotten Schoharie County added to the Senate legislation reauthorizing the Northern Border Regional Commission, which delivers millions to counties included to it in NY every year. Schumer said he is now launching his push to pass this bill which would unlock federal funding for Schoharie County to address critical needs across the region, including to build infrastructure, invest in workforce training, childcare and health care, supporting new and existing businesses, and more.</p>\r\n<p> </p>\r\n<p>After this announcement, Senator Schumer met with local officials and firefighters to hold a roundtable discussion at Niagara Engine 6 Firehouse.</p>" }, "A6CB422B-6E0E-4BDD-AB4D-282EDE54102A": { "TotalRows": 82, "uid": "A6CB422B-6E0E-4BDD-AB4D-282EDE54102A", "title": "Wells Meeting", "summary": "Wells, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "11.27.2024", "url": "about/chuck-around-new-york/wells-meeting", "city": "Wells", "county": "Hamilton", "lat": 43.399898529052734, "lng": -74.28694915771484, "description": "<p>Senator Charles Schumer visited Wells, NY to meet with Wells Town Supervisor Beth Hunt and town council members at the Wells Town Hall where they discussed a range of local issues to see how Senator Schumer may be able to assist.</p>" }, "B78ADDF1-8684-4E05-9E3B-93C4D3809215": { "TotalRows": 82, "uid": "B78ADDF1-8684-4E05-9E3B-93C4D3809215", "title": "Amsterdam Beech-Nut Nutrition", "summary": "Amsterdam, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "11.27.2024", "url": "about/chuck-around-new-york/amsterdam-beech-nut-nutrition", "city": "Amsterdam", "county": "Montgomery", "lat": 42.940738677978516, "lng": -74.22854614257812, "description": "<p>Senator Charles Schumer visited the Beech-Nut plant in Florida, NY for the first time since the groundbreaking in June, 2010. Senator Schumer met with the senior management team, toured the food testing lab and production line.</p>" }, "6BE43AE8-29E8-453E-A302-3F688367BCB2": { "TotalRows": 82, "uid": "6BE43AE8-29E8-453E-A302-3F688367BCB2", "title": "Gloversville Telehealth", "summary": "Gloversville, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "11.27.2024", "url": "about/chuck-around-new-york/gloversville-telehealth", "city": "Gloversville", "county": "Fulton", "lat": 43.069580078125, "lng": -74.33038330078125, "description": "<p>Standing at Nathan Littauer Hospital in Fulton County, U.S. Senate Majority Leader Chuck Schumer launched his push to protect Medicare’s telehealth program, which could expire at the end of next month without Congressional action. Schumer said it is critical we avoid the upcoming <a href=\"https://www.employeebenefitsblog.com/2024/02/2024-the-year-of-the-telehealth-cliff/\">telehealth cliff</a> for Capital Region and Mohawk Valley seniors, which is especially important to rural areas like Fulton County, to maintain this vital lifeline for accessible healthcare. </p>" }, "41D34C69-7475-4C42-A583-30EC1E412997": { "TotalRows": 82, "uid": "41D34C69-7475-4C42-A583-30EC1E412997", "title": "Orleans Telehealth Cliff", "summary": "Holley, NY", "eventType": "chuck-around-ny", "eventTypeLabel": "Chuck Around NY", "date": "11.27.2024", "url": "about/chuck-around-new-york/orleans-telehealth-cli'''
