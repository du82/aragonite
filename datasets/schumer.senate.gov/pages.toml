["https://schumer.senate.gov/services/visiting"]
title = "Visiting DC | Senator Chuck Schumer of New York"
description = "The Official U.S. Senate website of Senator Chuck Schumer of New York"
full_description = "Help for New Yorkers Leave a comment Visiting D.C. Washington, DC is a popular vacation destination, and my office is happy to help make your trip to our nation's capital a memorable one. We are happy to work with New Yorkers to arrange tours of the White House or the U.S. Capitol. If you have any questions regarding your trip to Washington D.C., please contact Senator Schumer's tour coordinator at tours@schumer.senate.gov. request a tour The White House The White House is both home and workplace of the President of the United States and is full of history and architectural splendor – truly a sight to see. White House tours are typically hosted on Fridays and Saturdays from 8:00AM to 11:00AM (excluding federal holidays and unless otherwise noted). Requests to tour the White House can be submitted up to three months in advance and no less than 21 days prior to the desired tour date. Tours are scheduled on a first come, first served basis and a limited number of spaces are available; therefore, you are encouraged to submit your request as early as possible. To request a tour of the White House, please click on Request a Tour at the top of the page. If you have any questions, please contact Senator Schumer’s Tour Coordinator at (202) 224-6542. If you are a citizen of a foreign country, please contact your embassy in Washington, D.C. for assistance in submitting a tour request. Take a virtual tour of the White House here. visit the white house The United States Supreme Court The United States Supreme Court is open to the public Monday through Friday, 9 a.m. until 4:30 p.m. Although the Court does not offer guided walking tours, visitors are encouraged to tour the building on their own. Information about Courtroom Lectures and other exhibits the Court offers can be found here. Helpful information about attending a Supreme Court Oral Argument can also be found here. visit the united states supreme court The Kennedy Center In September 1971, the Kennedy Center opened its doors to the public. Since then, the Kennedy Center has served as a living memorial to President John F. Kennedy and as home to some of the most spectacular performing arts. Free tours of the Kennedy Center are available to the general public weekdays, 10:00 a.m. to 5:00 p.m., and weekends, 10:00 a.m. to 1:00 p.m. It is recommended that groups of 15 guests or more, VIP tours, foreign language requests, or visitors with special needs book online at http://www.kennedy-center.org/tours. Special Congressional tours are offered daily at 9:30 a.m. and on weekdays at 4:00 p.m. Following the afternoon tour, the Kennedy Center encourages you to stay for a free Millennium Stage concert at 6:00 p.m. When available, Congressional tour attendees can enjoy special views of the Presidential Box and the Opera House. If interested in a small group Congressional tour, please contact Senator Schumer’s Tour Coordinator at (202) 224-6542. Take a virtual tour of the Kennedy Center here. visit the kennedy center The Washington Monument The Washington Monument was built in honor of George Washington. May 31st to September 6th, the monument is open from 9 a.m. to 10 p.m. while during the rest of the year the monument will be open from 9 a.m. to 5 p.m. Tickets are needed for tours of the Washington Monument and can be picked up at the Washington Monument Lodge which. These free, same day, timed tickets are distributed on a first come first serve basis starting at 8:30 a.m. every morning. For more information regarding the Washington Monument, please visit: http://www.nps.gov/wamo/index.htm visit the washington monument Library of Congress The Library of Congress offers hour-long, fully accessible docent-led tours of the historic Thomas Jefferson Building. During your tour you will learn about the Building’s symbolic art, architecture and view the grandeur of the Main Reading Room. Tours are scheduled Monday – Saturday, 10:30 a.m., 11:30 a.m., 1:30 p.m., 2:30 p.m., 3:30 p.m. Please note that there are not 3:30 p.m. tours on Saturdays. For Groups Larger than 10, please visit: http://www.loc.gov/visit/tours/ to book a tour. Take a virtual tour of the Library of Congress here. visit the library of congress The National Park Service The National Park Service, founded in 1916, has been entrusted with the care of our national parks. With the help of volunteers and partners, the National Park Service safeguards these special places and share their stories with more than 318 million visitors every year. Washington, D.C. is home to countless national memorials, monuments, historical sites, and parks. Check with the National Park Service website for a complete list of locations you can visit in our nation’s Capital as well as the hours of operations: https://www.nps.gov/state/dc/index.htm visit the national park service - dc locations Smithsonian Institution The Smithsonian Institution, founded in 1846, is the largest museum complex in the world with 19 museums and galleries, the National Zoological Park and nine research facilities. The museums are all free and open year round. Check with the Smithsonian Institution website for hours and locations: http://www.si.edu/visit visit the smithsonian institution The Department of State by the Secretary of State and other key government officials. These reception rooms house a vast collection of 18th century American furniture, paintings and decorative arts. Guided tours of the Diplomatic Reception Rooms are offered by reservation only Monday through Friday at 9:30 a.m., 10:30 a.m., and 2:45 p.m. Reservations can be made online at receptiontours.state.gov. Please submit your reservations for this tour 90 days prior to your visit due to the high volume of requests. visit the department of state The Pentagon While in the nation’s capital, stop by one of the largest office buildings, the Pentagon. The program, under the purview of the Assistant Secretary of Defense for Public Affairs, hosts more than 106,000 visitors annually. Tours of the Pentagon last for approximately 60 minutes and are approximately one and one half miles in length. Tours of the Pentagon are available to the public by reservation only, Monday through Friday from 9 a.m. to 3 p.m. To book a tour of the Pentagon visit: https://pentagontours.osd.mil/ Watch the history of the Pentagon here. visit the pentagon Department of the Treasury The United States Treasury Building offers guided tours on Saturday mornings at 9:00 a.m., 9:45 a.m., 10:30 a.m., and 11:15 a.m. Some highlights of this tour are the Salmon Chase and Andrew Johnson Suites, the newly restored West dome and lobby, and the Cash Room. These tours can be arranged through Senator Schumer’s Washington D.C. office by contacting Senator Schumer’s Tour Coordinator at (202) 224-6542. Please have the names, dates of birth, and social security numbers of all guests when making the reservation. visit the department of the treasury Arlington National Cemetery Established during the Civil War, Arlington National Cemetery is the final resting place for many of our nations bravest and heroic Americans. Veterans and military casualties from each of the nation’s wars are interred in the cemetery, ranging from the American Civil War through to the military action in Afghanistan and Iraq. Arlington National Cemetery is open to the public at 8 a.m. 365 days a year. From April 1st to September 30th, the cemetery closes at 7 p.m.; the other six months it closes at 5 p.m. Take a virtual tour of the Arlington National Cemetery here. visit the arlington national cemetery The United States Holocaust Memorial Museum The United States Holocaust Memorial Museum is a monument, an exhibition space and also a research center for those studying the Holocaust and the prevention of genocide. The Holocaust Exhibit, provides a three floor historical narrative of the horrific events that took place during the Holocaust. Please note that this exhibit is only recommended for guests eleven years and older. Tours of the Holocaust exhibit are self-guided and require passes for admission March through August. Passes are distributed on a first-come first-served basis on the day of your visit and have specific timed entry for that day, denoting your tour time. Groups of 40 or more people need to schedule their tour visit. Please visit http://www.ushmm.org/visit/ to book your tour today. View online exhibits here. visit the united states holocaust memorial museum The National Archives The National Archives house some of the most important documents in United States history such as the Declaration of Independence, Constitution, and Bill of Rights. Self-guided tours of The Nation Archives are permitted daily from 10:00 a.m. to 5:30 p.m. Last admission is 30 minutes prior to closing. Open every day except Thanksgiving Day and Christmas Day. Reserved guided tours are available, Monday through Friday at 9:45 a.m. Reserved Time Visit Entry tours are also offered every 15 minutes, from 10:15 a.m. to 90 minutes before closing, daily. To book a reserved tour please visit: https://museum.archives.gov/reservations-and-tours Take a virtual tour of the National Archives here. visit the national archives The United States Botanical Garden The United States Botanic Garden is one of the oldest and most beautiful botanic gardens in North America. Tours of the Botanic Garden are open to the public and highlight the diversity of plants as well as their aesthetic, cultural, economic, therapeutic, and ecological significance. Groups of 10 to 15 may reserve a free 45-minute guided tour of the Conservatory at 10:30 a.m. or 1:30 p.m. Monday through Friday. Reservations must be made at least four weeks in advance. To arrange a group tour, please email usbgtours@aoc.gov or call (202) 226-2055. Take a virtual tour of the United States Botanical Garden here. visit the united states botanical garden The United States National Arboretum The United States National Arboretum was established in 1927 to serve the public need for scientific research, education and gardens that conserve and showcase plants to enhance the environment. Public and private tram tours are available daily. For the most up to date tour information please visit: https://usna.usda.gov/visit/tours/ To book a private tour please call (202) 245-4543 at least 3 weeks before your ideal tour date. For a virtual interactive experience, click here. visit the united states national arboretum Mount Vernon While in Washington D.C., visit the estate of one of our founding fathers and first United States President, George Washington. Visitors are welcome to tour the Mount Vernon Estate which includes the historic Mansion house, slave quarters, kitchen, stables, greenhouse, gardens, trails and pioneer farm site. Mount Vernon is open 365 days a year, including holidays. April through October the estate is open from 9:00 a.m. to 5:00 p.m., November through March it is open from 9:00 a.m. to 4:00 p.m. For more information about these tours and to purchase tickets please visit http://www.mountvernon.org/plan-your-visit/ Take a virtual tour of Mount Vernon here. visit mount vernon The FBI Experience The FBI Experience is a self-guided tour at FBI Headquarters in Washington, D.C. Open to the public, the tour features interactive multimedia exhibits, content, and artifacts—including a number of items from notable cases on display for the very first time—that help illustrate the importance of the Bureau’s work to protect the nation. Operating hours are Monday through Friday between 9:00 a.m. and 4:30 p.m., excluding federal holidays. You can schedule a visit to The FBI Experience up to five months in advance but no later than four weeks prior to the desired visit date. These tours can be arranged through Senator Schumer’s Washington D.C. office by contacting Senator Schumer’s Tour Coordinator at (202) 224-6542. Please have the names, dates of birth, and social security numbers of all guests when making the reservation. the fbi experience"
