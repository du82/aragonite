full_description = '''Flag Requests Senator Schumer is happy to assist New Yorkers with the purchase of flags flown over the U.S. Capitol building. These flags can be used to celebrate notable occasions such as anniversaries, birthdays, Eagle Scout ceremonies, retirements, or other special events. We offer nylon and cotton flags in various forms. Processing time can range from four to six weeks. Please provide three weeks’ notice if you would like your flag flown on a specific date. If a specific date is not requested, the flag will be flown within two weeks of when the request is received. Please note that flags are priced at cost and our office does not profit from this service. Questions regarding flag requests may be directed to Senator Schumer’s flag coordinator at flags@schumer.senate.gov. Submit Flag Order Online (fastest method) Submit Flag Order By Mail (slowest method) Select flag size and material Size & Material Price Qty Flown over Capitol Sub-total Flag option 1. Size & Material 3' by 5' Nylon Price $14 Quantity for 3' by 5' Nylon flag Would you like the flag Flown Overthe Capitol? Yes add ($9 per flag) for 3' by 5' Nylon flag Subtotal $0.00 Flag option 2. Size & Material 3' by 5' Cotton Price $15 Quantity for 3' by 5' Cotton flag Would you like the flag Flown Overthe Capitol? Yes add ($9 per flag) for 3' by 5' Cotton flag Subtotal $0.00 Flag option 3. Size & Material 4' by 6' Nylon Price $18 Quantity for 4' by 6' Nylon flag Would you like the flag Flown Overthe Capitol? Yes add ($9 per flag) for 4' by 6' Nylon flag Subtotal $0.00 Flag option 4. Size & Material 5' by 8' Nylon Price $27 Quantity for 5' by 8' Nylon flag Would you like the flag Flown Overthe Capitol? Yes add ($9 per flag) for 5' by 8' Nylon flag Subtotal $0.00 Flag option 5. Size & Material 5' by 8' Cotton Price $28 Quantity for 5' by 8' Cotton flag Would you like the flag Flown Overthe Capitol? Yes add ($9 per flag) for 5' by 8' Cotton flag Subtotal $0.00 Shipping & Handling ($9.80 per Flag) $0.00 Total $0.00 In Honor of Prefix * -- Ms. Mrs. Mr. Mx. Dr. Other. First Name * Middle Last Name * Occasion To Be Flown On Any Date Specific Date Select Date * Special Instructions Your Information Prefix * -- Ms. Mrs. Mr. Mx. Dr. Other. First Name * Last Name * Street Address * Street Address (2) City * State * AL AK AR AZ CA CO CT DC DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY ----Military---- AA AE AP ----Insular Areas---- American Samoa Guam Northern Mariana Islands Puerto Rico Virgin Islands U.S. Minor Outlying Islands ----Associated States---- Federated States of Micronesia Marshall Islands Palau Zip Code * Phone Number * E-mail * Verify E-mail * Shipping Address Shipping address is the same as requestor’s address Prefix * -- Ms. Mrs. Mr. Mx. Dr. Other. First Name * Last Name * Street Address * Street Address (2) City * State * AL AK AR AZ CA CO CT DC DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY ----Military---- AA AE AP ----Insular Areas---- American Samoa Guam Northern Mariana Islands Puerto Rico Virgin Islands U.S. Minor Outlying Islands ----Associated States---- Federated States of Micronesia Marshall Islands Palau Zip Code * Payment Information Please Note: This form cannot process monetary transactions. After clicking the "Submit" button, you will be able to print your completed form. Print a copy of your form and include it with your payment. Payment must be made out to "Keeper of the Stationery." Mail the copy of your request and payment to: c/o Keeper of the Stationery Senator Chuck Schumer of New York SH-322 Hart Senate Office Building Washington, D.C. 20510 Check Money Order Submit $('.js-form').hide(); $('.js-onlineLink').hide(); $('.js-onlineLink-toggle').on('click', function (e) { $(this).addClass('selected'); $('.js-form-toggle').removeClass('selected'); $('.js-form').hide(); $('.js-onlineLink').slideDown(500); }); $('.js-form-toggle').on('click', function (e) { $(this).addClass('selected'); $('.js-onlineLink-toggle').removeClass('selected'); $('.js-onlineLink').hide(); $('.js-form').slideDown(1200); }); $('.hide-on-submit').removeClass('hide-on-submit'); // date flown toggle $('.date_preference').click(function () { if ($(this).val() == 1) { $("#toggleFlownDay").slideDown(); } else { $("#toggleFlownDay").slideUp(); } }); // mailing_fname // mailing_lname // same address $('#same_address').click(function () { if ($(this).prop('checked')) { $('#mailing_salutation').val($('#requesters_salutation').val()); $('#mailing_fname').val($('#requesters_fname').val()); $('#mailing_lname').val($('#requesters_lname').val()); $('#mailing_streetAddress1').val($('#requesters_streetAddress1').val()); $('#mailing_streetAddress2').val($('#requesters_streetAddress2').val()); $('#mailing_city').val($('#requesters_city').val()); $('#mailing_state').val($('#requesters_state').val()); $('#mailing_zipcode').val($('#requesters_zipcode').val()); } else { $('#mailing_salutation').val(''); $('#mailing_fname').val(''); $('#mailing_lname').val(''); $('#mailing_streetAddress1').val(''); $('#mailing_streetAddress2').val(''); $('#mailing_city').val(''); $('#mailing_state').val(''); $('#mailing_zipcode').val(''); } }); if (typeof window.initFlagRequest !== 'function') { window.initFlagRequest = function () { // validation ------------------------------------------------ $.validator.addMethod("lettersonly", function (value, element) { return this.optional(element) || /^[a-z," "]+$/i.test(value); }, "Letters and spaces only please"); $.validator.addMethod("minimumFlags", function (value) { var v = 0; $.each($('.qty'), function () { if (parseInt($(this).val())) { v = v + parseInt($(this).val()); } }); return v > 0; }, "Please Select at least one flag."); $.validator.addClassRules("qty", {'digits': true}); var validation = $('.js-flagForm').validate({ 'onsubmit': true, 'focusCleanup': true, 'onkeyup': false, 'rules': { 'flag_35cotton': { 'minimumFlags': 0 }, 'email_verify': { 'equalTo': '#email' }, 'mailing_zipcode': { 'required': true, 'digits': true, 'minlength': 5, 'maxlength': 5 }, 'requesters_zipcode': { 'required': true, 'digits': true, 'minlength': 5, 'maxlength': 5 }, 'requesters_phone': { 'required': true, 'phoneUS': true }, 'honor_fname': { 'required': true, 'lettersonly': true }, 'honor_mname': { 'required': false, 'lettersonly': true }, 'honor_lname': { 'required': true, 'lettersonly': true }, 'requesters_fname': { 'required': true, 'lettersonly': true }, 'requesters_mname': { 'lettersonly': true }, 'requesters_lname': { 'required': true, 'lettersonly': true } }, 'messages': { 'salutation': { 'required': 'Please select a prefix' }, 'honor_fname': { 'required': 'Please enter a first name' }, 'honor_mname': { 'required': 'Please enter a middle name' }, 'honor_lname': { 'required': 'Please enter a last name' }, 'requesters_fname': { 'required': 'Please enter a first name' }, 'requesters_mname': { 'required': 'Please enter a middle name' }, 'requesters_lname': { 'required': 'Please enter a last name' }, 'mailing_streetAddress1': { 'required': 'Please enter a street address' }, 'mailing_city': { 'required': 'Please enter a city' }, 'mailing_state': { 'required': 'Please select a state' }, 'mailing_zip': { 'required': 'Please enter a zip code' }, 'subject': { 'required': 'Please enter a subject for your message' }, 'email': { 'required': 'Please enter an e-mail', 'email': 'Please enter a valid e-mail' }, 'email_verify': { 'equalTo': 'E-mails must match' }, 'requesters_phone': { 'required': 'Please enter a phone number' }, 'message': { 'required': 'Please enter your message' } }, }); var prefflownDay = document.getElementById('prefflown_day'); prefflownDay.hide = null; // Remove conflicting MooTools function from element $(prefflownDay).datepicker({autoclose: true}); // Flag Form Vars var flownPrice = '9'; var shippingPrice = '9.8' // flag total var flagTotal = function (e) { var flag = e.data('flag'); var i = 1; while (!flag && i < e.length) { flag = $(e[i]).data('flag'); i++; } var shipping = 0; var totalFlags = 0; var grandtotal = 0; // format dollar var dollar = function (val, type) { if (type) { return numeral().unformat(val); } return numeral(val).format('$0,0.00'); } var qnty = e.find('.qty'); var price = dollar(e.find('.price').html(), true); var isFlown = e.find('.isFlown'); var total = e.find('.total'); var pdfTotal = $('#flag_' + flag + '_total'); // add total row var rowVal = function () { var val; var quantity = qnty.val(); val = qnty.val() * price; if (isFlown.prop('checked')) { val = val + (quantity * flownPrice) } return val; } // update row ------------------------------------- total.html(dollar(rowVal(), false)); pdfTotal.val(dollar(rowVal(), false)); // update shipping $('.qty').each(function () { q = parseInt($(this).val()); if (Number(q) > 0) { totalFlags += q; } }); $('#min_flag').val(totalFlags); shipping = totalFlags * shippingPrice; // display value $('#shipping_total_display').html(dollar(shipping, false)); //hidden value $('#shipping_total').val(dollar(shipping, false)); // update shipping $('.total').each(function () { v = dollar($(this).html(), true); if (Number(v) > 0) { grandtotal += v; } }); $('#flags_total').val(grandtotal); // display value $('#grand_total_display').html(dollar(grandtotal + shipping, false)); //hidden value $('#grand_total').val(dollar(grandtotal + shipping, false)); } // date flown toggle $('.date_preference').click(function () { if ($(this).val() == 1) { $("#toggleFlownDay").slideDown(); $('#prefflown_day').attr('disabled', false); } else { $("#toggleFlownDay").slideUp(); $('#prefflown_day').attr('disabled', true); } }); // same address $('#same_address').click(function () { if ($(this).prop('checked')) { $('#mailing_streetAddress1').val($('#requesters_streetAddress1').val()); $('#mailing_streetAddress2').val($('#requesters_streetAddress2').val()); $('#mailing_city').val($('#requesters_city').val()); $('#mailing_state').val($('#requesters_state').val()); $('#mailing_zipcode').val($('#requesters_zipcode').val()); } else { $('#mailing_streetAddress1').val(''); $('#mailing_streetAddress2').val(''); $('#mailing_city').val(''); $('#mailing_state').val(''); $('#mailing_zipcode').val(''); } }); /* input action */ $('#flag-options input[type="number"]').change(function () { var row = $(this).parents('#flag-options .row'); flagTotal(row); }); /* checkbox action */ $('#flag-options input[type="checkbox"]').click(function () { var row = $(this).parents('#flag-options .row'); flagTotal(row); }); } } if (typeof window.getScripts !== 'function') { window.getScripts = function (scripts, callback) { var progress = 0; scripts.forEach(function(script) { $.getScript(script, function () { if (++progress == scripts.length) callback(); }); }); } } getScripts([ "https://www.schumer.senate.gov/scripts/jquery/jquery.validate.js", "https://www.schumer.senate.gov/scripts/jquery/additional-methods.js", "https://www.schumer.senate.gov/scripts/bootstrap-datepicker.js", "https://www.schumer.senate.gov/scripts/vendor/numeral.js", // "https://www.schumer.senate.gov/scripts/fancybox/jquery.fancybox.js", // uncomment for flag thumbnails ], function () { initFlagRequest() });'''
