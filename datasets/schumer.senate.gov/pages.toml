title = "SCHUMER, GILLIBRAND, GARBARINO, NADLER, ... | Senator Chuck Schumer of New York"
description = "Without Congressional Action, The WTCHP Will Have To Start Turning Away First Responders And..."
full_description = '''Back Published: February 26, 2025 SCHUMER, GILLIBRAND, GARBARINO, NADLER, KEAN, GOLDMAN INTRODUCE BIPARTISAN, BICAMERAL LEGISLATION TO FIX WORLD TRADE CENTER HEALTH PROGRAM FUNDING SHORTFALL Without Congressional Action, The WTCHP Will Have To Start Turning Away First Responders And Survivors, Cut Back Access To Care For Existing Enrollees By 2028 Today, U.S. Senator Chuck Schumer (D-NY), U.S. Senator Kirsten Gillibrand (D-NY), and U.S. Representatives Andrew Garbarino (R-NY), Jerrold Nadler (D-NY), and Dan Goldman (D-NY) joined advocates and survivors to introduce the 9/11 Responder and Survivor Health Funding Correction Act of 2025. Representative Tom Kean (R-NJ) is also an original House cosponsor. Despite recent congressional action, the World Trade Center Health Program (WTCHP) continues to face an impending funding shortfall. As a result, by October 2028, the program will be forced to close enrollment to new 9/11 responders and survivors, and existing enrollees will face direct cuts to their care and be denied medical monitoring and treatment. The 9/11 Responder and Survivor Health Funding Correction Act of 2025 would update the program’s outdated funding formula to ensure adequate funding until the program’s expiration in 2090. The bill would also increase funding for data collection on 9/11-related conditions and expand access to mental health care for program members. “‘Never Forget’ does not mean just commemorating 9/11, it is a promise to always take care of our 9/11 first responders and survivors. That’s why we are introducing legislation to stop funding patches and make this healthcare program funded permanently: now and forever,” said Senator Schumer. “Our 9/11 heroes should not have to come down here year after year, month after month, pleading for the funding for the healthcare they have earned, deserve, and was promised to them. It’s time for America to put its money where its mouth is and prove to the heroes of 9/11 that we mean it when we say will Never Forget.” “Yet again, we are introducing a bill to fix a projected funding shortfall in the World Trade Center Health Program,” said Senator Gillibrand. “Thousands of Americans risked their lives to protect our country in its darkest hour, and it is now our responsibility as members of Congress to be there for them as they continue to battle the horrific health ramifications from that day and the many days after. Our bill updates the funding formula for the WTCHP so that no 9/11 hero has to worry about losing coverage year after year. It is beyond time to get this passed, and I look forward to working across the aisle to do so.” “Today, alongside my House and Senate co-leads, responders, and survivors, I was proud to announce the reintroduction of the 9/11 Responder and Survivor Health Funding Correction Act,” said Congressman Garbarino. “This legislation would ensure the World Trade Center Health Program has the resources it needs to continue providing care for those suffering from 9/11-related conditions. We made a promise to never forget, and today, we stood together to reaffirm our commitment to delivering on that promise.” “While over twenty years have passed since the 9/11attacks, so many of our heroic responders and survivors continue to carry with them the burden of that terrible day as they have fallen sick from the air surrounding Ground Zero,” said Congressman Nadler. “Congress must uphold the promise made to our first responders and survivors by fully funding the WTCHP to provide the injured and their families the aid they need and deserve. I’m proud to join my colleagues in introducing the 9/11 Responder and Survivor Health Funding Correction Act of 2025, which will address the funding shortfall to keep the program available for those who need it for years to come.” "Every New Yorker has been impacted by the profound loss and devastating pain from the September 11th attacks, including those like me who lived in Lower Manhattan at the time," said Congressman Goldman. “We owe a permanent debt to the first responders and unwavering support for the survivors who continue to bear the physical and emotional scars. The 9/11 Responder and Survivor Health Funding Correction Act will ensure that these heroes receive the health care they are owed. As representatives of New York, it is our bipartisan duty to guarantee that these American heroes receive the assistance they deserve from the federal government." “Everyone remembers the dark day of 9/11, a day etched in history,” said Congressman Kean. “We honor all who ran toward danger, risking everything to help those in need. As an original cosponsor of the 9/11 Responder and Survivor Health Funding Correction Act of 2025, I am committed to ensuring that the heroes and survivors of 9/11 receive the care and support they deserve. This bill corrects outdated funding formulas, expands mental health resources, and strengthens data collection to address the long-term health impacts of that tragic day. We have a responsibility to stand by those who sacrificed so much, and this legislation reaffirms that commitment.” In addition to Reps. Garbarino, Nadler, Goldman, and Kean the 9/11 Responder and Survivor Health Funding Correction Act of 2025 is cosponsored by Reps. Michael Lawler (R-NY), Laura Gillen (D-NY), Nick LaLota (R-NY), Ritchie Torres (D-NY), George Latimer (D-NY), Yvette Clarke (D-NY), Nick Langworthy (R-NY), Adriano Espaillat (D-NY), Claudia Tenney (R-NY), Pat Ryan (D-NY), Josh Riley (D-NY), Tom Suozzi (D-NY), Nydia Valazquez (D-NY), Paul Tonko (D-NY), Gregory Meeks (D-NY), Josh Gottheimer (D-NY), Brian Fitzpatrick (R-PA), Nicole Malliotakis (R-NY), Tim Kennedy (D-NY), Grace Meng (D-NY), and Alexandria Ocasio-Cortez (D-NY). “Cancer, COPD, Pulmonary Fibrosis and other serious respiratory illnesses are literally decimating the 9/11 Community from the toxic aftermath of 9/11,” said 9/11 advocate John Feal. “But we fail to mention the Toxic Redundancy in DC that continues to to take its toll on the deathly ill men & women, uniform and non uniform heroes and survivors who continue to travel over and over and over again to implore lawmakers to enact legislation again. The redundancy of traveling, the redundancy of being away from family, the redundancy of telling their stories, and the redundancy of me watching them die one by one. So one more time, no one last time we implore Congress to "ACT" now, so we can be left alone. The WTCHP is a lifeline for 140,000. $3 billion is a small ask for what we have been through dealing with our injuries, illnesses and most of all the redundancy we had to put up with for over two decades now. Together, today "WE" all have the opportunity "NOW" to stop the madness, the cruelty and redundancy!” “My name is Mariama James. I’m the daughter of two now late survivors dead of 9/11-related disease, the mom of three young survivors all with multiple WTC Health Program certifications, and I’m a health-impacted survivor myself,” said Mariama James, 9/11 survivor and advocate. “I stepped into this fight as a young woman, believing justice and care would swiftly follow the devastation of 9/11. Now, nearly 24 years later, I stand here still, imploring our leaders: fully and permanently fund the WTC Health Program. Time is not healing, it's revealing the ongoing toll, and our commitment must match that reality." “Firefighters and officers are suffering from 9/11-related illnesses every day,” said Jim Brosi, President of the Uniformed Fire Officers Association. “Congress has a duty to uphold the promise made to first responders and ensure the WTCHP is fully funded for as long as our members need care. Access to treatment and medication is the least we can do for those who sacrificed their personal health to save the lives of countless victims.” “While it has been nearly 24 years since terrorists attacked our nation on 9/11, we still have daily reminders of the heavy price paid by the NYPD, FDNY, and first responders across this nation who willingly and selflessly answered the call to duty,” said NYPD Sergeants Benevolent Association (SBA) President Vincent Vallelong. “These brave men and women did not delay, they did not hesitate, and their actions in the weeks and months that followed September 11 gave our nation hope and the strength to rebuild. The original Zadroga Act and the World Trade Center Health Program recognize our nation’s obligation to care for those first responders who sacrificed so much on that fateful day. The SBA is grateful for the continuing strong leadership of Sen. Gillibrand, Rep. Garbarino, Sen. Schumer, and the New York delegation in reintroducing the 9/11 Responder and Survivor Health Funding Correction Act and ensuring Congress fulfills its obligation to fully fund this critical program.” ““We walked the halls of Congress in 2010 to enact the World Trade Center Health Program, and again in 2015 to reauthorize this vital program to ensure our nation took care of those suffering from 9/11-related chronic health conditions as a result of the September 11, 2001 attacks on the United States. Attacks that left many Port Authority Police Officers with severe disabling and life-threatening illnesses contracted during the selfless performance of their duties in the World Trade Center Rescue and Recovery efforts,” said Frank Conti, President of the Port Authority Police Benevolent Association. “The WTCHP is facing a significant funding gap that, if not addressed by Congress, will impact its ability to provide necessary care to our nation’s 9/11 responders and survivors, including the officers we represent. We thank Senator Gillibrand and Representatives Garbarino and Goldman for their support, and we stand with them in urging Congress to pass the 9/11 Responder and Survivor Health Funding Correction Act now. This is not over…the sacrifice continues.” “We fought for the enactment and near permanent reauthorization of the WTCHP as we view it as our obligation and duty to ensure that responders, who risked their lives to protect us, and survivors continue to receive the care that they deserve,” said Bill Johnson, Executive Director of the National Association of Police Organizations. “The 9/11 Responder and Survivor Health Funding Correction Act honors that obligation and ensures the WTCHP is fully funded. We thank Senator Gillibrand and Congressman Garbarino for their leadership and stand with them in support of this legislation.” We have vowed to never forget our heroes and survivors of the horrific attacks of 911. Yet, here we stand today, fighting for them once more. The actions Elon Musk has taken against the World Trade Center Health program are as insulting as they are inhumane. Our heroes and survivors deserve the utmost respect and the best possible care. I would like to thank the New York and New Jersey Republican members of Congress, led by Congressman Garbarino, for having the courage to stand shoulder to shoulder with us. Their actions were instrumental in having President Trump rescind the termination of many of the program’s key providers. Standing here in solidarity, hopefully Congressman Garbarino can convince more of his colleagues to do the right thing and fully fund the World Trade Center Health Program. As stated earlier we will never forget, and we will never go away until all our heroes and survivors are treated with the respect and dignity they deserve.” said Thomas Hart, President of Citizens for the Extension of the James Zadroga Act and President of Local 94 International Union of Operating Engineers. Print Email Share Tweet $(function () { if ($('.js-sharetool')) { $('.js-sharetool').bind('click', function () { var shareLink = $(this).attr('data-link'); var shareText = $(this).attr('data-text'); if (!shareLink) { shareLink = window .location .href .replace(/\/?$/, ''); } var caption = "Check this out!" if (shareText || caption) { shareText = 'text=' + (shareText || caption) + '&'; } var link; var newWindow; if ($(this).hasClass('js-tweet')) { link = 'http://www.twitter.com/share?' + shareText + 'url=' + encodeURIComponent(shareLink); newWindow = window.open(link, 'twitter', "height=450,width=600"); } if ($(this).hasClass('js-facebook')) { link = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareLink) + '&display=popup'; newWindow = window.open(link, 'facebook', "height=450,width=600"); } if ($(this).hasClass('js-email')) { var lb = '%0D%0A'; var body = 'From https://www.schumer.senate.gov/:' + lb + lb + caption + lb + lb + shareLink; window.location.href = 'mailto:?subject=' + caption + '&body=' + body; } if ($(this).hasClass('js-print')) { window.print(); } }); } }); Previous Next'''
