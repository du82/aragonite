title = "Taxes | Senator Chuck Schumer of New York"
description = "The Official U.S. Senate website of Senator Chuck Schumer of New York"
full_description = '''Taxes If you have questions about your tax filings for the current or previous years, we can help to get the answers. If you don't find the answers you need on this page, please select the topic you need help with: IRS PERSONAL IRS BUSINESS Undeliverable Refunds Were you expecting a refund check but didn't get it? Refund checks are mailed to your last known address. Checks are returned to the IRS if you move without notifying the IRS or the U.S. Postal Service. You may be able to update your address with the IRS on the "Where’s My Refund?" feature available on IRS.gov. You will be prompted to provide an updated address if there is an undeliverable check outstanding within the last 12 months. You can also ensure the IRS has your correct address by filing Form 8822, Change of Address, which is available on www.irs.gov or can be ordered by calling 800-TAX-FORM (800-829-3676). If you do not have access to the Internet and think you may be missing a refund, you should first check your records or contact your tax preparer. If your refund information appears correct, call the IRS toll-free assistance line at 800-829-1040 to check the status of your refund and confirm your address. Free Electronic Tax Form Filing New York taxpayers can take part in E-filing their taxes for free. According to the IRS, nearly 100 million Americans have utilized e-filing. The tax filing process is made far easier by e-filing, which includes answers to a variety of frequently asked questions, online fill-able forms, the ability to use direct deposit, and to pay electronically. On top of that, e-filing is considered the safest and fastest option for filing taxes. While the typical paper refund takes 8 weeks to receive, taxpayers who file electronically could see their refund deposited in their bank account in as little as 10 days. This services adds convenience and clarity to the tax filing process, and has continued to gain in popularity in recent years. To utilize the IRS' free e-filing website, please click here or for those filing with income exceeding $73,000, click here. Volunteer Income Tax Assistance Program (VITA) If your annual income is less than $60,000, you may qualify for assistance. During tax season The IRS Volunteer Income Tax Assistance (VITA) program or the Tax Counseling for the Elderly (TCE) program offer free tax help if you qualify. VITA sites are generally located at community and neighborhood centers, libraries, schools, shopping malls, and other convenient locations. Certified volunteers sponsored by various organizations receive training to help prepare basic tax returns in communities across the country. Most locations also offer free electronic filing. You should contact the site closest to you to determine if you are eligible for their service. Because VITA sites in New York can often change hours and locations, call 1-800-829-1040 for current information on the site nearest you. Tax Counseling for the Elderly (TCE) – AARP Tax-Aide Program If you are over age 60, you may qualify for assistance filing your income taxes through the AARP. The AARP Foundation's Tax-Aide program has sites throughout New York during tax season. The volunteers there are trained to do more complex tax returns. You should contact the AARP Tax-Aide site closest to you to determine if you are eligible for their service. Click here to find a list of AARP sites in New York near you. Items taxpayers need to bring to the VITA/TCE Sites to have their tax returns prepared Proof of identification Social Security Cards for you, your spouse and dependents and/or a Social Security Number verification letter issued by the Social Security Administration Birth Dates for you, your spouse and dependents on the tax return Current year’s tax package if you received one Wage and earning statement(s) Form W-2, W-2G, 1099-R, from all employers Interest and dividend statements from banks (Forms 1099) A copy of last year’s Federal and State returns if available Bank Routing Numbers and Account Numbers for Direct Deposit Total paid for day care provider and the day care provider's tax identifying number (the provider's Social Security Number or the provider's business Employer Identification Number) To file taxes electronically on a married filing joint tax return, both spouses must be present to sign the required forms. If you need further assistance, please fill out the correct form at the top of the page, and we will get back to you.'''
