["https://www.schumer.senate.gov/privacy-policy"]
title = "Privacy Policy  | Senator Chuck Schumer of New York"
description = "The Official U.S. Senate website of Senator Chuck Schumer of New York"
full_description = "Privacy Policy Thank you for visiting my web site. This web site has safeguards in place to protect the privacy of individuals who visit it. The U.S. Senate collects aggregate data about visits to Senate web sites, such as statistics that show which parts of each web site were visited the most. The following information is also collected when you visit any U.S. Senate web site: the domain from which you access the Senate web site, the date and time of your visit, the pages you visit, and the address of the web site, if any, that provided the link from which you reached the Senate site. This information is gathered only for the purpose of enabling us to improve the online service we provide to visitors of Senate web sites. No individual identifying or personal information (such as your name) is automatically gathered when you visit any Senate web site. Click here to learn more about the Senate's internet security and privacy policy online. Additionally, this web site will not collect any personal information about you when you visit the site unless you choose to provide that information. The web site does allow you to send me an electronic mail message expressing your views or concerns. I use this information provided by you to respond to your comments, questions and concerns. This information will be available to members of my staff so they can assist me in responding to your message. This web site also allows you to sign up for a monthly email update from my office. If you sign up for this update, your email and personal information will not be shared with any outside organization or individual. Other than when needed in the course of an authorized law enforcement investigation or emergency posing an imminent risk to public safety, my office will share no personal information communicated through this web site with any outside organization or individual."
year_published = 2025
clearnet = "https://www.schumer.senate.gov/privacy-policy"
