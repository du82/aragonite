["http://sciencepolicy.colorado.edu/students/fosep"]
title = "Home :: The Forum on Science Ethics and Policy"
full_description = "The Forum on Science Ethics and Policy FOSEP chapters are led by graduate and professional students and postdoctoral fellows from fields ranging from natural sciences and engineering to humanities, business, and education. Our primary mission is to promote civic dialogue about issues at the intersection of science and society across our campus and community. We believe that a better understanding of the 'big picture' about issues such as heath care, energy policy, and climate change, and talking with people outside of our own disciplines and outside of academia will help us to better connect our scholarly work with solutions to real-world problems. Learn more ... Announcements Call for Blog Posts on Science Ethics and Policy Want to get published online? FOSEP is seeking blog posts from graduate students, professional students and postdoctoral students. We're interested in pieces that promote civic dialogue about issues at the intersection of science and society across our campus and community. This can include issues like healthcare, energy and water policy, and climate change at local, state, national or international levels. Our goal is to connect the scholarly work of CU Boulder researchers with solutions to real-world problems. Please send a max. 250-word abstract of your blog post to Angela Boag and Amanda Grennell at: FOSEP@colorado.edu. If we deem your piece appropriate we will contact you to set up a publishing timeline for your post. Blog posts should be 1,000 words max., and we aim to publish one every 2 weeks. Submit your abstract today!"
