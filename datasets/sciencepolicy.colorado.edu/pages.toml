["http://sciencepolicy.colorado.edu/about_us/meet_us/bruce_goldstein/index.html"]
title = "Bruce Goldstein :: Center for Science and Technology Policy Research"
full_description = "Bruce Goldstein Center for Science and Technology Policy Research University of Colorado at Boulder UCB 488 Boulder, CO 80309-0488 Tel: 303-735-0451 Fax: 303-735-1576 brugo@colorado.edu Bruce Goldstein is an Associate Professor in the Program in Environmental Design and the Program in Environmental Studies at the University of Colorado Boulder, faculty in the Masters of Environment Program, core faculty in the Center for Science and Technology Policy Research, and a faculty research associate in the Institute for Behavioral Science. How can communities combine forces to adapt to social and ecological challenges and foster transformational change? This is the motivating question for my work. I partner with learning networks, which enable place-based learning and system-wide adaptation to innovate solutions that are both site-specific and applicable network-wide. Learning networks do more than just solve local problems – they promote fundamental change by encouraging practitioners to engage in reflection and learning by addressing essential questions like, “What is the system in which I live and practice, and how do I want to change it?” Accomplishing this isn’t easy, and I am particularly inspired by skilled network facilitators, or “netweavers”. Netweavers balance network-wide coherence with community autonomy, encouraging communities to experiment with new approaches that suit their circumstances. Netweavers support an open flow of ideas between communities and work to develop collective capacity that can overcome powerful resistance to systems change. To support their amazing work, I manage a learning community of netweavers, the Netweaver’s Network. My research is qualitative and interpretive, and I apply the principles of participatory action research. I seek to develop close partnerships with the networks I study, engaging netweavers in the research process and providing them with insights from research that can help them achieve their goals. I am particularly interested in partnering with netweavers who are attempting to promote positive change across critical social and ecological thresholds. These include my five primary projects – the Fire Adapted Communities Learning Network, the Rockefeller Foundation’s 100 Resilient Cities Initiative, the Locally-Managed Marine Areas Network, the Savory Institute’s restorative agriculture network, and the National STEM Education Centers network. Recent Publications Fazey, I., Schäpke, N., Caniglia, G., Patterson, J., Hultman, J., van Mierlo, B., Säwe, F., Wiek, A., Wittmayer, J., Aldunce, P., Al Waer, H., Battacharya, N., Bradbury, H., Carmen, E., Colvin, J., Cvitanovic, C., D’Souza, M., Gopel, M., Goldstein, M., et al. 2018. Ten essentials for action-oriented and second order energy transitions, transformations and climate change research. Energy Research & Social Science 405, 4-70. Yabes, Ruth and Goldstein, Bruce Evan. 2015. Collaborative Resilience to Episodic Shocks and Surprises: A Very Long-Term Case Study of Zanjera Irrigation in the Philippines 1979-2010. Social Sciences. Doak, Daniel F., Victoria J. Bakker, Goldstein, Bruce Evan, and Benjamin Hale. 2013. What Is the Future of Conservation? Trends in Ecology and Evolution 29(2): 77-81. Goldstein, Bruce, Wessells, Anne Taufen, Lejano, Raul P., and William Butler. 2013. Narrating Resilience: Transforming Cities Through Collaborative Storytelling. Urban Studies. Goldstein, Bruce Evan (ed.). Collaborative Resilience: Moving Through Crisis to Opportunity. MIT Press, November 2011. Link to Flyer, and Chapter 1, Introduction To Planning For Disaster: Building Resilience Through Collaboration. View all of Bruce's publications"
