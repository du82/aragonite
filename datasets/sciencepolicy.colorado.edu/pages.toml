["http://sciencepolicy.colorado.edu/about_us/meet_us/steven_vanderheiden/index.html"]
title = "Steven Vanderheiden :: Center for Science and Technology Policy Research"
full_description = "Steven Vanderheiden Center for Science and Technology Policy Research University of Colorado at Boulder UCB 488 Boulder, CO 80309-0488 Tel: 303-492-9482 Fax: 303-735-1576 steven.vanderheiden@colorado.edu Steve Vanderheiden (Ph.D., University of Wisconsin-Madison) is Associate Professor of Political Science and Environmental Studies at the University of Colorado at Boulder, as well as Professorial Fellow at the Centre for Applied Philosophy and Public Ethics (CAPPE) in Australia. He joined the CU-Boulder faculty in 2007, and specializes in normative political theory and environmental politics, with a particular focus on global governance and climate change. In addition to numerous published articles and book chapters on topics ranging from Rousseau's environmental thought to the politics of SUVs, and edited books on political theory approaches to climate change, energy politics, and environmental rights, his Atmospheric Justice: A Political Theory of Climate Change (Oxford, 2008) won the 2009 Harold and Margaret Sprout award from the International Studies Association for the best book on international environmental politics. He is currenty completing a book entitled Doing Our Bit: Individual Responsibility for Climate Change, along with several other current projects described elsewhere on this site. From this page, you can link to his teaching resources page, his CV, a description of his current projects, his online research archive, and contact information. Recent Publications Vanderheiden, S., 2017. Anti-Immigrant Populism & Climate Change Denial. The Critique. Vanderheiden, S., 2016. Climate Change and Free Riding. Journal Of Moral Philosophy 11 (4) 1-27, doi: 10.1163/17455243-4681046. Vanderheiden, S., 2016. Climate Justice Beyond International Burden Sharing. Midwest Studies In Philosophy , doi: 10.1111/misp.12045. Vanderheiden, S., 2016. Territorial Rights and Carbon Sinks. Science and Engineering Ethics, doi: 10.1007/s11948-016-9840-8. Van