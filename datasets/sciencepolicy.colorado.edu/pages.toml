title = "Red Cross/Red Crescent Climate Centre Internship Program :: Center for Science and Technology Policy Research"
full_description = '''Call for SUMMER 2020 placement is now open Application deadline is Monday, March 9. More information. CU-Boulder has partnered with the Red Cross Red Crescent Climate Centre (RCRCCC) to place graduate students in locations Southern/Eastern Africa each summer to help understand and address climate risks. This collaborative program targets improvements in environmental communication and adaptation decision-making as well as disaster prevention and preparedness in the humanitarian sector. It connects humanitarian practitioners from the Red Cross Red Crescent Climate Centre – an affiliate of the International Federation of Red Cross and Red Crescent Societies – with graduate student researchers at the University of Colorado who are interested in science-policy-humanitarian issues. Through this program we strive to accomplish three key objectives: to improve the capacity of humanitarian practitioners within the International Federation of Red Cross and Red Crescent Societies network at the interface of science, policy and practice to help meet needs and gaps as well as work as a research clearinghouse in environmental communication and adaptation decision-making in response to climate variability and change, as identified through Red Cross Red Crescent Climate Centre priorities and projects to benefit graduate students by complementing the classes and research that they undertake in their graduate program with real-world experience in climate applications and development work. Learn more ... Help Support the Work of the Red Cross Red Crescent Climate Centre Program! FINAL REPORT, EXECUTIVE SUMMARIES Prioritization of Forecast-based Impacts for Drought: Challenges and Opportunities by Sarah Posner (2019) Five Understandings to Build Communication Practices for Mozambique Red Cross by Juhri Selamet (2018) Flood Modelling and Assessments for Downstream Communities of Koka Dam, Ethiopia by Katie Chambers (2017) Anticipating Disaster: Local Dependence on Formal Climate Information vs. Traditional Ways of Knowing by Sierra Gladfelter (2016) Community Perceptions of Resilience and Conservation, PfR fieldsites Otuke and Napak by Drew Zackary (2014) Climate-Smart, Ecosystem-Friendly Livelihoods Assessment by Amy Quandt (2013) Vulnerability and Capacity Assessment (VCA) Report for Climate Change Adaptation Project in Teso and Karamoja by Arielle Tozier de la Poterie (2013) Improving Flood Risk Management in Zambia by Kanmani Venkateswaran (2013) NEWS & HIGHLIGHTS Perceptions of the Effects of Floods and Droughts on Livelihoods: Lessons from Arid Kenya 2017 publication by 2013 Red Cross/Red Crescent Climate Centre Junior Researcher, Amy Quandt. Read the article. Adapting Livelihoods to Floods and Droughts in Arid Kenya: Local Perspectives and Insights 2016 publication by 2013 Red Cross/Red Crescent Climate Centre Junior Researcher, Amy Quandt. Read the article. 2014 Summer Junior Researcher, Drew Zackary, Visits 'Introduction to Environmental Studies' class 2014 Red Cross/Red Crescent Climate Centre Junior Researcher, Drew Zackary, visited CU Boulder class 'Introduction to Environmental Studies' class. See photos ... Ogmius (Issue 39, Fall 2014) Highlights Red Cross/Red Crescent Climate Centre Program Issue 39 of Ogmius highlighted Leslie Dodson and Drew Zackary's Summer 2014 fellowships in the RC/RC CC program. Leslie wrote on "Promoting Climate Understanding and Adaptation: A Role for Serious Games and Effective Communication Technology" and Drew's article was on "Climate Change Adaptation: Early-Warning Forecasting in Northern Uganda - Summer 2014". Read the exchange here. 2014 Summer Junior Researchers Visit Boulder's Whittier Elementary 2014 Red Cross/Red Crescent Climate Centre Junior Researchers, Leslie Dodson and Drew Zackary, visited Wittier Elementary's 4th grade class in Boulder. See photos ... How to 'be Boulder' with climate communications. A webcam session of Paying for predictions Red Cross/Red Crescent Climate Centre February 18, 2014 The Climate Centre last Thursday remotely facilitated a session at the University of Colorado-Boulder of Paying for predictions – its popular game illustrating the cost, value and use of early warnings in which players decide whether to invest in forecast-based preparedness for floods. Read more ... CU-Boulder students focus on aid policies with new Red Cross partnership by Jake Hazan Colorado Daily June 26, 2013 CSTPR faculty and grad students (Dilling, Daly, Boykoff, Quandt,Tozier de la Poterie, and Venkateswaran) highlighted in Colorado Daily article on CU's Red Cross/Red Crescent Climate Centre program. Contacts Max Boykoff (Co-Director) CIRES Center for Science and Technology Policy Research Environmental Studies Program Campus Box 488, tel: (303) 735-0451 boykoff@colorado.edu Fernando Briones (Co-Director) CCB / INSTAAR CIRES Center for Science and Technology Policy Research (CSTPR) Research Affiliate University of Colorado fernando.brionesgamboa@colorado.edu These fellowships are made available through support by the Environmental Studies program (ENVS), The Natural Hazards Center, The Graduate School and The Center for Science and Technology Policy Research (CSTPR).'''
