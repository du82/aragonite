full_description = "CSTPR Projects Seeking Support * Your gift can help CSTPR research and collaborative works moving forward! Radford Byerly, Jr. Award in Science and Technology Policy Led by Professor Max Boykoff To provide support for any degree-seeking, full-time graduate student at the University of Colorado Boulder with a commitment to making a significant contribution to science and technology policy through a career in a variety of fields. Student must be in good academic standing. See award announcement. Inside the Greenhouse (ITG) Led by Professor Max Boykoff, Beth Osnes, Phaedra Pezzullo, and Rebecca Safran Creative framing and storytelling of issues surrounding climate change through video, theatre, dance, and writing can connect a wider audience to the deep and pressing need to address climate change. Learn more ... Media and Climate Change Observatory (MeCCO) Led by Professor Max Boykoff This observatory analyzes traditional/legacy media representations of climate change. At present, the MeCCO team monitors coverage monthly in fifty selected sources globally, and eight country profiles. Learn more ... Red Cross/Red Crescent Climate Centre Fellowship Program Led by Professor Max Boykoff Through collaborations between CSTPR and the Environmental Studies Program, CU-Boulder has partnered with the Red Cross/Red Crescent Climate Centre to place graduate students in locations in eastern and southern Africa for approximately three months each summer. Learn more ... Director's Reserve for General Center Operations Help support the work of CSTPR! To discuss other giving opportunities within our Center please contact Max Boykoff * All donations (which are made through the CU Foundation) are tax-deductible to the fullest extent of the law. Circumstances vary depending on each donor’s individual financial situation, so you should consult with your tax attorney/advisor concerning the deductibility of your gift. See the University of Colorado Foundation website."
