["https://sciencepolicy.colorado.edu/about_us/meet_us/matthew_burgess/index.html"]
title = "Matthew Burgess :: Center for Science and Technology Policy Research"
full_description = "Matthew Burgess University of Colorado Campus Box 488 Boulder, CO 80309-0488 Tel: 303-735-0451 Fax: 303-735-1576 matthew.g.burgess@colorado.edu Matthew Burgess is an Assistant Professor in Environmental Studies, with a courtesy appointment in Economics. His research focuses on natural resource management, endangered species conservation, and issues in global sustainability. Matthew uses a combination of mathematical and computer modeling, data synthesis, and collaboration with stakeholders, in order to make conceptual advances and link them to practice. Matthew's current research focuses on three broad questions: How can we best manage complex natural resource systems with limited data and governance capacity? Natural resource management is caught between conflicting pulls toward complexity and simplicity. On one hand, natural resource systems are becoming increasingly understood as complex multi-scale human-environment systems. On the other hand, the complexity of natural resource management is in practice heavily constrained by the limits of available data, and capacity for monitoring, administration, and enforcement. Thus, a key challenge for natural resource science is to find management approaches that are robust to complexity—including complexity that is not fully understood by the manager—and that are also feasible with commonly available data types and governance capacities. How can we quantify the bioeconomic conditions that cause species endangerment, in order to facilitate preventative conservation and better understand tradeoffs with other objectives? Current approaches to assessing species endangerment predominantly quantify symptoms of endangerment such as population declines, high current mortality rates, or species rarity. I am interested in developing approaches to measuring the bioeconomic conditions causing species endangerment, for two reasons. First, such mechanistic measures can identify threats of future extinction and severe population decline before the declines occur. Second, mechanistic measures can be used to quantify tradeoffs and synergies between species conservation and other social and ecological objectives. The nature of these tradeoffs is sometimes counterintuitive. What do sustainable global and regional economies look like, and what institutions are needed to support them? There are ongoing debates about how large and fast-growing economies can be and still be environmentally sustainable. The answer to this question in part depends on how efficiently food, water, and energy resources can be provided, and how fast technology can improve. Another important aspect to this question is what types of social, political, and economic institutions can be designed and implemented to facilitate the most efficient provisioning of these resources. Moreover, to the extent that the need for sustainability restricts the size and growth rates of future economies, it is important to anticipate what social and political problems might arise from this, and what institutions are needed to solve these problems. I am interested in each of these three aspects of the larger problem. Recent Publications Rao, A., M. G. Burgess, and D. Kaffine, 2020. Orbital-use fees could more than quadruple the value of the space industry. Proceedings of the National Academy of Sciences, doi: 10.1073/pnas.1921260117, Published April 14. Burgess, M.G., E. Carrella, M. Drexler, R.L. Axtell, R.M. Bailey, J.R. Watson, R.B. Cabral, M. Clemence, C. Costello, C. Dorsett, S.D. Gaines, E. S. Klein, P. Koralus, G. Leonard, S.A. Levin, L.R. Little, J. Lynham, J.K. Madsen, A. Merkl, B. Owashi, S.E. Saul, I.E. van Putten, S. Wilcox, 2020. Opportunities for agent-based modelling in human dimensions of fisheries. Fish and Fisheries, doi: 10.1111/faf.12447, Published February 28. Burgess, M.G. and M.J. Plank, 2020. What unmanaged fishing patterns reveal about optimal management: Applied to the balanced harvesting debate. ICES Journal of Marine Science , doi: 10.1093/icesjms/fsaa012, Published February 18. Ernesto Carrella, E., S. Saul, K. Marshall, M.G. Burgess, R.B. Cabral, R.M. Bailey, C. Dorsett, M. Drexler, J. Koed Madsen, and A. Merkl, 2020. Simple Adaptive Rules Describe Fishing Behaviour Better than Perfect Rationality in the US West Coast Groundfish Fishery. Ecological Economics 169 , doi: 10.1016/j.ecolecon.2019.106449, Published March. Burgess, M.G., A. Fredston-Hermann, D. Tilman, M. Loreau, and S.D. Gaines, 2019. Broadly inflicted stressors can cause ecosystem thinning. Theoretical Ecology , doi: 10.1007/s12080-019-0417-4. Tallis, H.M., P.L. Hawthorne, S. Polasky, J. Reid, M.W. Beck, K. Brauman, J.M. Bielicki, S. Binder M.G. Burgess, E. Cassidy, A. Clark, J. Fargione, E.T. Game, J. Gerber, F. Isbell, J. Kiesecker, R. McDonald, M. Metian, J.L. Molnar, N.D. Mueller, C. O'Connell, D. Ovando, M. Troell, T.M. Boucher, and B. McPeek, 2018. An attainable global vision for conservation and human well-being. Frontiers in Ecology and the Environment , doi: 10.1002/fee.1965. Bailey R., E. Carrella, R.L. Axtell, M.G. Burgess, R.B. Cabral, M. Drexler, C. Dorsett, J.K. Madsen, A. Merkl, and S. Saul, 2018. A computational approach to managing coupled human-environmental systems: The POSEIDON model of ocean fisheries. Sustainability Science. Burgess M.G. and S.D. Gaines, 2018. The scale of life and its lessons for humanity. Proceedings of the National Academy of Sciences 115: 6328-6330. (Companion to Bar-On et al. 2018). View all of Matthew's publications"
