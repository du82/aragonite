["http://sciencepolicy.colorado.edu/about_us/bylaws.html"]
title = "By-Laws :: Center for Science and Technology Policy Research"
full_description = "CSTPR By-Laws The Center for Science and Technology Policy Research (CSTPR) was initiated within the Cooperative Institute for Research in Environmental Sciences (CIRES) at the University of Colorado-Boulder in the summer of 2001 and was recognized as an official University center in the summer of 2002 as a contribution both to the CIRES goal of “promoting science in service to society” and to the University’s vision of establishing research and outreach across traditional academic boundaries. CSTPR seeks to improve how science and technology policies address societal needs, through research, education and service. The Center is a response to an increase in problem-focused research at the interfaces of environment, technology, and policy, and to the growing demand by public and private decision makers for “usable” scientific information. Our work is often aimed at understanding the choices that people and institutions make in pursuing goals under uncertainty, be it an uncertain future climate, uncertain outcomes of investments in science and technology, or the uncertain outcomes of a particular environmental policy. One of our goals is enlarging the range of choice considered by policy-makers, by analyzing options in areas such as energy technology, carbon management, science investments, and public lands and ecosystems management. By linking integrative science with the needs of decision makers, science and technology policy research can serve a valuable role in helping the research community better focus its efforts on issues of importance to society, and decision makers can more effectively incorporate scientific and technological advances into their decision processes."
