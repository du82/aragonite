title = "Annual Report :: Center for Science and Technology Policy Research"
full_description = "CSTPR Annual Report January 1 - December 31, 2018 The research described in this annual report reflects both our collective and individual efforts to pose and pursue important questions at the intersection of science and policy. Our work is shaped by several factors, especially the curiosity-driven interests of Center faculty, post-docs and graduate students, the big policy questions of our times, and the opportunities that the Center creates for collaborative research. The Center's location in a joint university/NOAA institute dedicated to environmental sciences also shapes our work, as does the track record of a decade of work that offers a base on which to build new projects. Click here to view the latest annual report as a PDF »"
