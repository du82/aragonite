title = "The Definition of Success - Cloudera Fast Forward Labs"
description = "by Grant Custer. 1. Ship S-513: Hibernation Room The crew awoke to Ship’s message: PLANET OF INTEREST APPROACHING — ESTIMATED ARRIVAL FOUR HOURS — BEGIN…"
full_description = '''In this report we show how to make deep learning models interpretable without sacrificing their capabilities or accuracy. PLANET OF INTEREST APPROACHING — ESTIMATED ARRIVAL FOUR HOURS — BEGIN PREPARATION FOR ON-PLANET EXPLORATION. "Someday I’d like to know what exactly your definition of 'interesting' is, Ship," Dariux grumbled. "Sometimes it seems like 'interesting' just means likely to get me killed." PREPARE FOR ON-PLANET EXPLORATION, Ship continued, giving no indication that it had heard or registered the complaint. Taera stood in the middle of hundreds of egg-like structures. They were each about a meter tall, with a covering that looked like a cross between leather and metal. They seemed to pulse slightly. A low humming suffused the cave. The humming in the room cut out. The new, eerie silence was pierced by Taera’s scream. The structure she’d approached had broken open and a creature that looked like a cross between a stingray and a starfish had attached itself to the front of her helmet. Taera’s body stiffened and she fell straight back. Dariux and Giyana rushed to help. "I can’t let you bring her in," Rue said from the operations panel. "We don’t know what that thing attached to her is. It could contaminate the entire ship." Four of the nine crew members were now dead, and two others weren’t responding. The aliens that had hatched from Taera’s body had taken over half of the ship. Taera’s death meant Rue was now acting captain, and therefore had access to the control room and diagnostic information not available to the rest of the crew. "That’s just a number and we both know it, Ship. Show me the success predictions for your last five missions." A table was projected on the wall facing Rue. The missions had success predictions ranging from 98% to 13%. I UTILIZE THOUSANDS OF FEATURES, PROCESSED THROUGH COMPLEX NEURAL NETWORKS. IT IS VERY TECHNICAL. HUMANS CANNOT UNDERSTAND. "Apply the interpretability module, then, and show me the top features contributing to the predictions."'''
