["https://scifi.fastforwardlabs.com/ff08/havurtat"]
title = "Havurtat - Cloudera Fast Forward Labs"
description = """
by Umair Kazi. There is a consensus among archaeologists and historians of the Near
East that the lost city of Havurtat  As far as we know,
Herodotus was…"""
full_description = "In this report, we show how, for complex tasks, multi-task learning can improve the accuracy, inference, and maintainability of models. There is a consensus among archaeologists and historians of the Near East that the lost city of Havurtat1 is nothing more than an ancient fabrication; no trace of the city so lavishly described in encyclopedias and maps of antiquity has been found. The numerous excavations around the present-day city of Jolfa on the banks of the Araz–beginning with the English explorer Roger Dimblesby’s expedition in 1878–have failed to unearth so much as an arrowhead. Yet there are still those who hold fast to the truth of the city’s historical existence, owing perhaps to the following account of its abrupt end. In its eighth-hundred year, a young prince assumed the throne of Havurtat after the occultation2 of his father. The young prince had only recently returned to the city from the frontiers, having rendered his services in the army of the Bronze-age emperor to whom the city pledged fealty. Because of his conscription into the army at an early age, he was unaccustomed to the comforts and plenitude of courtly life in which he found himself at the center, after ascending the seat of power. For the first few years of his reign, the young prince freely indulged in the powers and pleasures of his throne. He threw extravagant banquets, hunted exotic game animals, and commissioned ambitious construction projects, until– as so often happens to princes of happy cities–he grew bored and unhappy, and began contemplating his place in the scheme of things. He withdrew from court and began to spend more and more of his time in the library and in the company of the learned men in his court– seers, poets, judges, and advisers. One night, standing on the terrace of his palace, looking down at the matrix of squat brick houses of precisely equal dimensions that inhabited square plats of land separated by roads that stretched out to the city’s ramparts, the prince was seized by a despondency he had never experienced before. He asked his guards to fetch his advisers, who, roused from their sleep, were presently brought before the prince, unkempt in their night-time robes."
