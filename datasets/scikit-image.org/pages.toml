["https://scikit-image.org/docs/0.20.x/release_notes.html"]
title = "Latest release notes — skimage v0.20.0 docs"
full_description = '''Latest release notes New features and improvements Performance Changes and new deprecations Completed deprecations Bug fixes Documentation New Improved & updated Fixes, spelling & minor tweaks Other and development related updates Governance & planning Maintenance Benchmarks CI & automation 71 authors contributed to this release [alphabetical by first name or login] 42 reviewers contributed to this release [alphabetical by first name or login] Latest release notes¶ scikit-image is an image processing toolbox built on SciPy that includes algorithms for segmentation, geometric transformations, color space manipulation, analysis, filtering, morphology, feature detection, and more. For more information, examples, and documentation, please visit our website: https://scikit-image.org With this release, many of the functions in skimage.measure now support anisotropic images with different voxel spacings. Many performance improvements were made, such as support for footprint decomposition in skimage.morphology Four new gallery examples were added to the documentation, including the new interactive example “Track solidification of a metallic alloy”. This release completes the transition to a more flexible channel_axis parameter for indicating multi-channel images, and includes several other deprecations that make the API more consistent and expressive. Finally, in preparation for the removal of distutils in the upcoming Python 3.12 release, we replaced our build system with meson and a static pyproject.toml specification. This release supports Python 3.8–3.11. New features and improvements¶ Support footprint decomposition to several footprint generating and consuming functions in skimage.morphology. By decomposing a footprint into several smaller ones, morphological operations can potentially be sped up. The decomposed footprint can be generated with the new decomposition parameter of the functions rectangle, diamond, disk, cube, octahedron, ball, and octagon in skimage.morphology. The footprint parameter of the functions binary_erosion, binary_dilation, binary_opening, binary_closing, erosion, dilation, opening, closing, white_tophat, and black_tophat in skimage.morphology now accepts a sequence of 2-element tuples (footprint_i, num_iter_i) where each entry, i, of the sequence contains a footprint and the number of times it should be iteratively applied. This is the form produced by the footprint decompositions mentioned above (#5482, #6151). Support anisotropic images with different voxel spacings. Spacings can be defined with the new parameter spacing of the following functions in skimage.measure: regionprops, regionprops_table, moments, moments_central, moments_normalized, centroid, inertia_tensor, and inertia_tensor_eigvals. Voxel spacing is taken into account for the following existing properties in skimage.measure.regionprops: area, area_bbox, centroid, area_convex, extent, feret_diameter_max, area_filled, inertia_tensor, moments, moments_central, moments_hu, moments_normalized, perimeter, perimeter_crofton, solidity, moments_weighted_central, and moments_weighted_hu. The new properties num_pixels and coords_scaled are available as well. See the respective docstrings for more details (#6296). Add isotropic binary morphological operators isotropic_closing, isotropic_dilation, isotropic_erosion, and isotropic_opening in skimage.morphology. These functions return the same results as their non-isotropic counterparts but perform faster for large circular structuring elements (#6492). Add new colocalization metrics pearson_corr_coeff, manders_coloc_coeff, manders_overlap_coeff and intersection_coeff to skimage.measure (#6189). Support the Modified Hausdorff Distance (MHD) metric in skimage.metrics.hausdorff_distance via the new parameter method. The MHD can be more robust against outliers than the directed Hausdorff Distance (HD) (#5581). Add two datasets skimage.data.protein_transport and skimage.data.nickel_solidification (#6087). Add new parameter use_gaussian_derivatives to skimage.feature.hessian_matrix which allows the computation of the Hessian matrix by convolving with Gaussian derivatives (#6149). Add new parameters squared_butterworth and npad to skimage.filters.butterworth, which support traditional or squared filtering and edge padding, respectively (#6251). Support construction of a skimage.io.ImageCollection from a load_pattern with an arbitrary sequence as long as a matching load_func is provided (#6276). Add new parameter alpha to skimage.metrics.adapted_rand_error allowing control over the weight given to precision and recall (#6472). Add new parameter binarize to skimage.measure.grid_points_in_poly to optionally return labels that tell whether a pixel is inside, outside, or on the border of the polygon (#6515). Add new parameter include_borders to skimage.measure.convex_hull_image to optionally exclude vertices or edges from the final hull mask (#6515). Add new parameter offsets to skimage.measure.regionprops that optionally allows specifying the coordinates of the origin and affects the properties coords_scaled and coords (#3706). Add new parameter disambiguate to skimage.registration.phase_cross_correlation to optionally disambiguate periodic shifts (#6617). Support n-dimensional images in skimage.filters.farid (Farid & Simoncelli filter) (#6257). Support n-dimensional images in skimage.restoration.wiener (#6454). Support three dimensions for the properties rotation and translation in skimage.transform.EuclideanTransform as well as for skimage.transform.SimilarityTransform.scale (#6367). Allow footprints with non-adjacent pixels as neighbors in skimage.morphology.flood_fill (#6236). Support array-likes consistently in AffineTransform, EssentialMatrixTransform, EuclideanTransform, FundamentalMatrixTransform, GeometricTransform, PiecewiseAffineTransform, PolynomialTransform, ProjectiveTransform, SimilarityTransform, estimate_transform, and matrix_transform in skimage.transform (#6270). Performance¶ Improve performance (~2x speedup) of skimage.feature.canny by porting a part of its implementation to Cython (#6387). Improve performance (~2x speedup) of skimage.feature.hessian_matrix_eigvals and 2D skimage.feature.structure_tensor_eigenvalues (#6441). Improve performance of skimage.measure.moments_central by avoiding redundant computations (#6188). Reduce import time of skimage.io by loading the matplotlib plugin only when required (#6550). Incorporate RANSAC improvements from scikit-learn into skimage.measure.ransac which decrease the number of iterations (#6046). Improve histogram matching performance on unsigned integer data with skimage.exposure.match_histograms. (#6209, #6354). Reduce memory consumption of the ridge filters meijering, sato, frangi, and hessian in skimage.filters (#6509). Reduce memory consumption of blob_dog, blob_log, and blob_doh in skimage.feature (#6597). Use minimal required unsigned integer size internally in skimage.morphology.reconstruction which allows to operate the function with higher precision or on larger arrays. Previously, int32 was used. (#6342). Use minimal required unsigned integer size in skimage.filters.rank_order which allows to operate the function with higher precision or on larger arrays. Previously, the returned labels and original_values were always of type uint32. (#6342). Changes and new deprecations¶ Set Python 3.8 as the minimal supported version (#6679). Rewrite skimage.filters.meijering, skimage.filters.sato, skimage.filters.frangi, and skimage.filters.hessian to match the published algorithms more closely. This change is backward incompatible and will lead to different output values compared to the previous implementation. The Hessian matrix calculation is now done more accurately. The filters will now be correctly set to zero whenever one of the Hessian eigenvalues has a sign which is incompatible with a ridge of the desired polarity. The gamma constant of the Frangi filter is now set adaptively based on the maximum Hessian norm (#6446). Move functions in skimage.future.graph to skimage.graph. This affects cut_threshold, cut_normalized, merge_hierarchical, rag_mean_color, RAG, show_rag, and rag_boundary (#6674). Return False in skimage.measure.LineModelND.estimate instead of raising an error if the model is under-determined (#6453). Return False in skimage.measure.CircleModel.estimate instead of warning if the model is under-determined (#6453). Rename skimage.filters.inverse to skimage.filters.inverse_filter. skimage.filters.inverse is deprecated and will be removed in the next release (#6418, #6701). Update minimal supported dependencies to numpy>=1.20 (#6565). Update minimal supported dependencies to scipy>=1.8 (#6564). Update minimal supported dependencies to networkx>=2.8 (#6564). Update minimal supported dependency to pillow>=9.0.1 (#6402). Update minimal supported dependency to setuptools 67 (#6754). Update optional, minimal supported dependency to matplotlib>=3.3 (#6383). Warn for non-integer image inputs to skimage.feature.local_binary_pattern. Applying the function to floating-point images may give unexpected results when small numerical differences between adjacent pixels are present (#6272). Warn if skimage.registration.phase_cross_correlation returns only the shift vector. Starting with the next release this function will always return a tuple of three (shift vector, error, phase difference). Use return_error="always" to silence this warning and switch to this new behavior (#6543). Warn in skimage.metrics.structural_similarity, if data_range is not specified in case of floating point data (#6612). Automatic detection of the color channel is deprecated in skimage.filters.gaussian and a warning is emitted if the parameter channel_axis is not set explicitly (#6583). Completed deprecations¶ Remove skimage.viewer which was scheduled for removal in the postponed version 1.0 (#6160). Remove deprecated parameter indices from skimage.feature.peak_local_max (#6161). Remove skimage.feature.structure_tensor_eigvals (it was replaced by skimage.feature.structure_tensor_eigenvalues) and change the default parameter value in skimage.feature.structure_tensor to order="rc" (#6162). Remove deprecated parameter array in favor of image from skimage.measure.find_contours (#6163). Remove deprecated Qt IO plugin and the skivi console script (#6164). Remove deprecated parameter value method='_lorensen' in skimage.measure.marching_cubes (#6230). Remove deprecated parameter multichannel; use channel_axis instead. This affects skimage.draw.random_shapes, skimage.exposure.match_histograms, skimage.feature.multiscale_basic_features, skimage.feature.hog, skimage.feature.difference_of_gaussians, skimage.filters.unsharp_mask, and skimage.metrics.structural_similarity. In skimage.restoration, this affects cycle_spin, denoise_bilateral, denoise_tv_bregman, denoise_tv_chambolle, denoise_wavelet, estimate_sigma, inpaint_biharmonic, and denoise_nl_means. In skimage.segmentation, this affects felzenszwalb, random_walker, and slic. In skimage.transform, this affects rescale, warp_polar, pyramid_reduce, pyramid_expand, pyramid_gaussian, and pyramid_laplacian. In skimage.util, this affects montage and apply_parallel (#6583). Remove deprecated parameter selem; use footprint instead. In skimage.filters, this affects median, autolevel_percentile, gradient_percentile, mean_percentile, subtract_mean_percentile, enhance_contrast_percentile, percentile, pop_percentile, sum_percentile, threshold_percentile, mean_bilateral, pop_bilateral, sum_bilateral, autolevel, equalize, gradient, maximum, mean, geometric_mean, subtract_mean, median, minimum, modal, enhance_contrast, pop, sum, threshold, noise_filter, entropy, otsu, windowed_histogram, and majority. In skimage.morphology, this affects flood_fill, flood, binary_erosion, binary_dilation, binary_opening, binary_closing, h_maxima, h_minima, local_maxima, local_minima, erosion, dilation, opening, closing, white_tophat, black_tophat, and reconstruction (#6583). Remove deprecated parameter max_iter from skimage.filters.threshold_minimum, skimage.morphology.thin, and skimage.segmentation.chan_vese; use max_num_iter instead (#6583). Remove deprecated parameter max_iterations from skimage.segmentation.active_contour; use max_num_iter instead (#6583). Remove deprecated parameter input from skimage.measure.label; use label_image instead (#6583). Remove deprecated parameter coordinates from skimage.measure.regionprops and skimage.segmentation.active_contour (#6583). Remove deprecated parameter neighbourhood from skimage.measure.perimeter; use neighborhood instead (#6583). Remove deprecated parameters height and width from skimage.morphology.rectangle; use ncols and nrows instead (#6583). Remove deprecated parameter in_place from skimage.morphology.remove_small_objects, skimage.morphology.remove_small_holes, and skimage.segmentation.clear_border; use out instead (#6583). Remove deprecated parameter iterations from skimage.restoration.richardson_lucy, skimage.segmentation.morphological_chan_vese, and skimage.segmentation.morphological_geodesic_active_contour; use num_iter instead (#6583). Remove support for deprecated keys "min_iter" and "max_iter" in skimage.restoration.unsupervised_wiener’s parameter user_params; use "min_num_iter" and "max_num_iter" instead (#6583). Remove deprecated functions greycomatrix and greycoprops from skimage.feature (#6583). Remove deprecated submodules skimage.morphology.grey and skimage.morphology.greyreconstruct; use skimage.morphology instead (#6583). Remove deprecated submodule skimage.morphology.selem; use skimage.morphology.footprints instead (#6583). Remove deprecated skimage.future.graph.ncut (it was replaced by skimage.graph.cut_normalized) (#6685). Bug fixes¶ Fix round-off error in skimage.exposure.adjust_gamma (#6285). Round and convert output coordinates of skimage.draw.rectangle to int even if the input coordinates use float. This fix ensures that the output can be used for indexing similar to other draw functions (#6501). Avoid unexpected exclusion of peaks near the image border in skimage.feature.peak_local_max if the peak value is smaller 0 (#6502). Avoid anti-aliasing in skimage.transform.resize by default when using nearest neighbor interpolation (order == 0) with an integer input data type (#6503). Use mask during rescaling in skimage.segmentation.slic. Previously, the mask was ignored when rescaling the image to make choice of compactness insensitive to the image values. The new behavior makes it possible to mask values such as numpy.nan or numpy.infinity. Additionally, raise an error if the input image has two dimensions and a channel_axis is specified - indicating that the image is multi-channel (#6525). Fix unexpected error when passing a tuple to the parameter exclude_border in skimage.feature.blog_dog and skimage.feature.blob_log (#6533). Raise a specific error message in skimage.segmentation.'''
