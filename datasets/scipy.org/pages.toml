full_description = "SciPy is developed in the open on GitHub, through the consensus of the SciPy and wider scientific Python community. For more information on our governance approach, please see our Governance Document. The role of the SciPy Steering Council is to ensure, through working with and serving the broader SciPy community, the long-term well-being of the project, both technically and as a community. The SciPy Steering Council currently consists of the following members (in alphabetical order): Institutional Partners are organizations that support the project by employing people that contribute to SciPy as part of their job. Current Institutional Partners include: SciPy will always be 100% open source software, free for all to use and released under the liberal terms of the modified BSD license. While we have a large number of contributors who volunteer their time to improve SciPy, financial resources are needed to run the project and accelerate its development. If you have found SciPy useful in your work, research, or company, please consider making a donation to the project commensurate with your resources. Any amount helps! Donations are managed by the NumFOCUS foundation, which passes your contribution to the SciPy project, and provides the SciPy development team with basic administrative and legal services. NumFOCUS is a 501(c)3 non-profit foundation, so if you are subject to the US Tax law, your contributions are tax-deductible. The SciPy development team would like to thank the following companies and organizations for providing financial support, services, or development infrastructure:"
