["https://scipy.org/install"]
title = "SciPy - Installation"
description = """
Tip This page assumes that you are comfortable with using a terminal and happy to learn how to use a package manager. If you are a beginner and just want to get started with SciPy as quickly as possible, check out the beginner installation guide! The recommended method of installing SciPy depends on your preferred workflow. The common workflows can roughly be broken down into the following categories:
Project-based (e.g. uv, pixi) (recommended for new users) Environment-based (e.g. pip, conda) (the traditional workflow) System package managers (not recommended) Building from source (for debugging and development) To install SciPy with static type stubs, see Installing with type stubs."""
full_description = "This page assumes that you are comfortable with using a terminal and happy to learn how to use a package manager. If you are a beginner and just want to get started with SciPy as quickly as possible, check out the beginner installation guide! The recommended method of installing SciPy depends on your preferred workflow. The common workflows can roughly be broken down into the following categories: Installing type stubs may be required for Interactive Development Environments (IDEs) to provide accurate type hints. Here is a step-by-step guide to setting up a project to use SciPy, with uv, a Python package manager. After rebooting your computer, you’ll want to navigate to your try-scipy project directory and execute uv run python to drop back into a Python interpreter with SciPy importable. To execute a Python script, you can use uv run myscript.py. If you work with non-Python packages, you may prefer to install SciPy as a Conda package, so that you can use the same workflow for packages which are not available on PyPI, the Python Package Index. Conda can manage packages in any language, so you can use it to install Python itself, compilers, and other languages. The steps to install SciPy from conda-forge using the package management tool pixi are very similar to the steps for uv: In project-based workflows, a project is a directory containing a manifest file describing the project, a lock-file describing the exact dependencies of the project, and the project’s (potentially multiple) environments. In contrast, in environment-based workflows you install packages into an environment, which you can activate and deactivate from any directory. These workflows are well-established, but lack some reproducibility benefits of project-based workflows. Miniforge is the recommended way to install conda and mamba, two Conda-based environment managers. After creating an environment, you can install SciPy from conda-forge as follows: System package managers can install the most common Python packages. They install packages for the entire computer, often use older versions, and don’t have as many available versions. They are not the recommended installation method."
year_published = 2025
