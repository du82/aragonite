["https://scipy.org/community"]
title = "SciPy - Community"
description = """
SciPy is a community-driven open source project developed by a diverse group of contributors. The SciPy leadership has made a strong commitment to creating an open, inclusive, and positive community. Please read the SciPy Code of Conduct for guidance on how to interact with others in a way that makes the community thrive.
We offer several communication channels to learn, share your knowledge and connect with others within the SciPy community.
Participate online# The following are ways to engage directly with the SciPy project and community."""
full_description = "SciPy is a community-driven open source project developed by a diverse group of contributors. The SciPy leadership has made a strong commitment to creating an open, inclusive, and positive community. Please read the SciPy Code of Conduct for guidance on how to interact with others in a way that makes the community thrive. We offer several communication channels to learn, share your knowledge and connect with others within the SciPy community. Please note that we encourage users and community members to support each other for usage questions. Search for an answer first, because someone may already have found a solution to your problem. SciPy community meetings are ideal to anyone wanting to contribute to SciPy or just know how current development is going. You can follow our community calendar from your preferred calendar manager, or look out for the announcements on our development forum. Once a month we have special meetings for folks who want to start contributing or have just started. All are welcome! Check our community calendar for details, or look out for the announcements on our development forum. This space is the main forum for longer-form discussions, like adding new features to SciPy, making changes to the SciPy Roadmap, and all kinds of project-wide decision making. Announcements about SciPy, such as for releases, developer meetings, sprints or conference talks are also made on this forum. The SciPy team also has a Slack space that you can join. This is not a user support forum, but you can ask questions about contributing and getting involved in the community. To join, please follow this invite link. You can also join the #scipy channel on the Scientific Python discord. To join, please follow this invite link. Please note that GitHub is not the right place to report a security vulnerability. If you think you have found a security vulnerability in SciPy, please report it here. If you would like to find a local meetup or study group to learn more about SciPy and the wider ecosystem of Python packages for data science and scientific computing, we recommend exploring the PyData meetups (150+ meetups, 100,000+ members)."
