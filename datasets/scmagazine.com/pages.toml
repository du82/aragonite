["https://scmagazine.com/brief/widespread-network-edge-device-targeting-conducted-by-polaredge-botnet"]
title = "Widespread network edge device targeting conducted by PolarEdge botnet | SC Media"
description = "More than 2,000 Cisco, QNAP, Synology, and ASUS network edge devices have been compromised."
full_description = 'More than 2,000 Cisco, QNAP, Synology, and ASUS network edge devices worldwide — particularly in the U.S., Taiwan, Russia, India, Brazil, Australia, and Argentina — have been compromised by the PolarEdge botnet since the end of 2023, reports The Hacker News.Intrusions involved the targeting of various router vulnerabilities — including the critical Cisco Small Business router bug, tracked as CVE-2023-20118 — to facilitate the distribution of the PolarEdge TLS backdoor, an investigation from Sekoia researchers found."The botnet exploits multiple vulnerabilities across different types of equipment, highlighting its ability to target various systems. The complexity of the payloads further underscores the sophistication of the operation, suggesting that it is being conducted by skilled operators," said researchers. Such findings come after Microsoft 365 accounts were reported by SecurityScorecard to be subjected to sweeping password spraying attacks involving a botnet of more than 130,000 compromised devices, which is suspected to have been conducted by a China-linked threat operation. AI/MLHow AI has changed the DDoS industryRichard Hummel February 28, 2025Here are three ways teams can leverage AI against these AI-based DDoS attacks. IoTNearly 1.6M Android TVs compromised by Vo1d malware botnetSC StaffFebruary 28, 2025Users of Android TVs have been urged to be more vigilant of their device purchases. Network SecurityOpenSSF sets baseline security standards for Linux-based softwareSteve ZurierFebruary 26, 2025New standards seen as a good move, but some worry it may breed complacency in security.'
