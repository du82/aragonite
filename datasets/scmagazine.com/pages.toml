["https://scmagazine.com/brief/nearly-1-6m-android-tvs-compromised-by-vo1d-malware-botnet"]
title = "Nearly 1.6M Android TVs compromised by Vo1d malware botnet | SC Media"
description = "Users of Android TVs have been urged to be more vigilant of their device purchases."
full_description = '''BleepingComputer reports that almost 1.6 million Android TVs around the world have been roped in by a novel Vo1d malware botnet variant as part of a new attack campaign initially discovered in November.More than half of the impacted devices remain active, while Brazil, South Africa, Indonesia, Argentina, Thailand, and China accounted for most of the infections this month, according to an XLab report.India was also observed to have its bots spike from 3,900 to 217,000 in only three days, with researchers attributing the surge to Vo1d's leasing of its botnet infrastructure."Once the lease period ends, the bots rejoin the Vo1d network. This reintegration leads to a rapid spike in infection counts as the bots become active again under Vo1d's control," said researchers. With Vo1d enabling the obfuscation of malicious activity and ad fraud, users of Android TVs have been urged to be more vigilant of their device purchases and available security updates, as well as only download apps from Google Play and deactivate remote access features when not needed. Network SecurityWidespread network edge device targeting conducted by PolarEdge botnetSC StaffFebruary 28, 2025More than 2,000 Cisco, QNAP, Synology, and ASUS network edge devices have been compromised. Government RegulationsFDA reinstates ‘DOGED’ medical device staff amid cybersecurity, health concernsTom Spring February 26, 2025Feds reverse order and reinstate FDA staff critical to medical device safety less than a week after firing them. Vulnerability ManagementAuthentication credential compromise likely with Xerox VersaLink printer flawsSC StaffFebruary 18, 2025Threat actors with configuration page access to VersaLink printers with proper Lightweight Directory Access Protocol settings could enable IP address alterations and clear-text LDAP service credential compromise, according to Rapid7 researchers.'''
author = "SC Staff"
year_published = 2025
year_updated = 2025
