["https://scmagazine.com/brief/various-sectors-threatened-by-sweeping-ams-misconfigurations"]
title = "Various sectors threatened by sweeping AMS misconfigurations | SC Media"
description = "Nearly 2,000 of the exposed AMS systems were in the U.S."
full_description = "Organizations across various industries around the world are facing a privacy and physical security risk with misconfigurations observed in more than 49,000 online Access Management Systems leveraged for controlling employee access to their facilities, reports BleepingComputer.Nearly 2,000 of the exposed AMS systems were in the U.S., which is far fewer than vulnerable systems in Italy, Mexico, and Vietnam, according to an investigation from cybersecurity firm Modat.Meanwhile, information revealed by the internet-exposed AMS systems included not only employees' personal identification details, biometrics, and photographs but also access logs and work schedules.Aside from exposing information that could be leveraged for spear-phishing and social engineering attacks, attackers could also leverage AMS access to modify employee records and access credentials, threatening organizations' physical security. Such findings should prompt AMS owners and admins to use VPNs and firewalls, replace default admin credentials, and encrypt personally identifiable information and biometric details, as well as ensure up-to-date firmware and software updates. Identity12K hardcoded API keys and passwords found in public LLM training dataSteve ZurierFebruary 28, 2025Criminals use LLMJacking to abuse stolen API keys to GenAI services by selling the access to third parties. Data SecurityOver 500K Android, iOS, iPadOS devices impacted by Spyzie stalkerwareSC StaffFebruary 28, 2025Spyzie joins 23 other stalkerware operations that have had customers' and victims' data leaked. MalwareUpdated LightSpy malware facilitates more expansive targetingSC StaffFebruary 27, 2025More than 100 commands allowing multi-platform data compromise have been integrated into LightSpy."
