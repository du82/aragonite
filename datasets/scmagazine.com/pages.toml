["https://scmagazine.com/brief/over-500k-android-ios-ipados-devices-impacted-by-spyzie-stalkerware"]
title = "Over 500K Android, iOS, iPadOS devices impacted by Spyzie stalkerware | SC Media"
description = "Spyzie joins 23 other stalkerware operations that have had customers' and victims' data leaked."
full_description = "More than 500,000 Android devices, as well as at least 4,900 iPhones and iPads, have been unknowingly breached by the Spyzie mobile surveillance app, which exposed obtained data through the exploitation of a vulnerability recently discovered in the Cocospy and Spyic spyware apps, TechCrunch reports.Aside from enabling access to pilfered messages, location details, photos, and other phone data, such a flaw also exposed 518,643 email addresses belonging to Spyzie customers who sought to infiltrate others' devices, according to a security researcher, who already provided the email address cache to Have I Been Pwned breach notification site operator Troy Hunt. Spyzie — which has yet to address the vulnerability as well as comment on the findings — joins 23 other stalkerware operations that have had their customers' and victims' data leaked due to lacking security defenses over the past eight years, indicating the prevalence of weak security among such providers. Threat IntelligenceSuspected international hacker apprehendedSC StaffFebruary 28, 2025Singaporean and Thai law enforcement have arrested suspected Singaporean threat actor Omid16B. Security ArchitectureGoogle calls for overhaul of memory safety standardsShaun NicholsFebruary 27, 2025Google wants secure-by-design practices to limit access to data stored in memory. Data SecurityData compromise disclosed by Genea after purported leakSC StaffFebruary 27, 2025More than 940 GB of data was exfiltrated from Genea on Valentine's Day."
