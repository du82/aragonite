full_description = "Starting 2022-03-21, Scope of Work’s Reading Group is reading Fred Scharmen’s Space Forces: A Critical History of Life in Outer Space. From the publisher:Many societies have imagined going to live in space. What they want to do once they get up there—whether conquering the unknown, establishing space “colonies,” privatising the moon’s resources—reveals more than expected. In this fascinating radical history of space exploration, Fred Scharmen shows that often science and fiction have combined in the imagined dreams of life in outer space, but these visions have real implications for life back on earth.For the Russian Cosmists of the 1890s space was a place to pursue human perfection away from the Earth. For others, such as Wernher Von Braun, it was an engineering task that combined, in the Space Race, the Cold War, and during World War II, with destructive geopolitics. Arthur C. Clarke, in his speculative books, offered an alternative vision of wonder that is indifferent to human interaction. Meanwhile NASA planned and managed the space station like an earthbound corporation. Today, the market has arrived into outer space and exploration is the plaything of superrich technology billionaires, who plan to privatise the mineral wealth for themselves. Are other worlds really possible?Bringing these figures and ideas together reveals a completely different story of our relationship with outer space, as well as the dangers of our current direction of extractive capitalism and colonisation. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30"
