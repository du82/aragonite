full_description = "Starting 2022-09-23, Scope of Work’s Reading Group is reading Mark Miodownik’s Stuff Matters: Exploring the Marvelous Materials That Shape Our Man-Made World. Mark is a renowned materials scientist and New York Times bestselling author who interrogates the science behind everyday objects. From the publisher:In Stuff Matters, Miodownik explores the materials he encounters in a typical morning, from the steel in his razor to the foam in his sneakers. Full of enthralling tales of the miracles of engineering that permeate our lives, his stories of analysis will make you see stuff in a whole new way. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30 Interview • 16 min read Frostbitten A conversation with Nicola Twilley about refrigeration.… Spencer Wright • 2024-09-16"
