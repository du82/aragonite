full_description = "Starting 2022-06-13, Scope of Work's Reading Group is reading Virginia Postrel’s The Fabric of Civilization: How Textiles Made the World. From the publisher:The story of humanity is the story of textiles — as old as civilization itself. Since the first thread was spun, the need for textiles has driven technology, business, politics, and culture.In The Fabric of Civilization, Virginia Postrel synthesizes groundbreaking research from archaeology, economics, and science to reveal a surprising history. From Minoans exporting wool colored with precious purple dye to Egypt, to Romans arrayed in costly Chinese silk, the cloth trade paved the crossroads of the ancient world. Textiles funded the Renaissance and the Mughal Empire; they gave us banks and bookkeeping, Michelangelo’s David and the Taj Mahal. The cloth business spread the alphabet and arithmetic, propelled chemical research, and taught people to think in binary code.Assiduously researched and deftly narrated, The Fabric of Civilization tells the story of the world’s most influential commodity. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30 Interview • 16 min read Frostbitten A conversation with Nicola Twilley about refrigeration.… Spencer Wright • 2024-09-16"
