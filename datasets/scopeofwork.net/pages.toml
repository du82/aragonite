title = "The Toaster Project"
description = "Starting 2022-07-25, The Prepared’s Reading Group is reading Thomas Thwaite’s The Toaster Project: Or a Heroic Attempt to Build a Simple Electric Appliance from Scratch."
full_description = "Starting 2022-07-25, Scope of Work’s Reading Group is reading Thomas Thwaite’s The Toaster Project: Or a Heroic Attempt to Build a Simple Electric Appliance from Scratch. A fantastical and epic true story, The Toaster Project follows the trials and tribulations involved in recreating the supply chain for an almost comically simple object. From the publisher:Hello, my name is Thomas Thwaites, and I have made a toaster. So begins The Toaster Project, the author's nine-month-long journey from his local appliance store to remote mines in the UK to his mother's backyard, where he creates a crude foundry. Along the way, he learns that an ordinary toaster is made up of 404 separate parts, that the best way to smelt metal at home is by using a method found in a fifteenth-century treatise, and that plastic is almost impossible to make from scratch. In the end, Thwaites's homemade toaster, a haunting and strangely beautiful object, cost 250 times more than the toaster he bought at the store and involved close to two thousand miles of travel to some of Britain's remotest locations. The Toaster Project may seem foolish, even insane. Yet, Thwaites's quixotic tale, told with self-deprecating wit, helps us reflect on the costs and perils of our cheap consumer culture, and in so doing reveals much about the organization of the modern world. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30 Interview • 16 min read Frostbitten A conversation with Nicola Twilley about refrigeration.… Spencer Wright • 2024-09-16"
