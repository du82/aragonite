["https://scopeofwork.net/the-honorable-parts"]
title = "The Honorable Parts."
description = "How industrial photographer Christopher Payne spotlights the good in American labor."
full_description = '''Christopher Payne is watching Gay Burdick work, and I am watching Christopher Payne work.We’re at the MTA’s 207th Street repair shop, which Payne has, for some time, been photographing for the New York Times. Payne says he wants to wrap up the shoot and publish the photos; the MTA has experienced some turnover since the project began; they want to meet with Payne (and writer David Waldstein) and get a better understanding of what his goals are. While we’re here, Payne wants to see Gay’s workstation again. I’m not totally sure what Payne sees in Gay’s workstation — he keeps talking about her look — but this is what I see:I became aware of Payne through his previous work in the Times, where he has published shoots from factories that make colored pencils, container ships, and the paper version of the Times itself. His photography is striking, and from the accounts in his most recent book, Made in America, his process is meticulous. Payne will apparently return to the same factory dozens of times, waiting for the moment when a production run lines up just right, or the material being processed is just the right color, or — I don’t know — his subject finally lifts their hand in a particularly elegant way. Payne is an artist, and his art documents, explains, and valorizes manufacturing, fabrication, and maintenance work.Aspects of Payne’s work might be categorized as genre art. He captures moments in everyday time; he captures human intention and effort; he captures the infrastructure required to make stuff. His subjects are often highly engineered (he has photographed ASML’s EUV machines, Boeing’s 787 assembly line, and NASA’s Space Launch System), but just as often they’re highly soulful (Payne published a book about Steinway pianos; he has also photographed Martin’s guitar factory and Zildjian’s cymbal production process). Regardless of what he’s shooting, Payne’s photographs often feel just as carefully assembled as the objects in them. One of the more notable aspects of Payne’s photography is the way he seems to lift a subject out of its surroundings. Seen through Payne’s eyes, a motor being built is only surrounded by a factory part of the time; other times, it exists in a field of pure black.Assembly of a heavy industrial electric motor. Ward Leonard, Thomaston, Connecticut. Image courtesy of Christopher Payne.There is utility in this framing. When working on complex things, it can be helpful to black-box everything around them, focusing only on their inputs and outputs and ignoring the chaos they might eventually be dumped into. If I were employed to design a motor, I would be careful not to think too much about how its wiring is extruded, or how the power that will eventually run through it is generated, or for that matter what the most efficient method of shaving a yak might be. I would imagine my motor lit by a spotlight, not a floodlight. But there are also moments when Payne zooms out, and as the reader turns a page in Made in America they see not an isolated process but an entire industrial symphony, sprawling and expansive and in seemingly perpetual motion. There are, of course, engineers who work at this scale too: system architects who coordinate and conduct the various mechanics and mechanisms which make up a factory. Here, the subject of Payne’s photography seems to be modern industrial complexity itself.A "bottom up" view of the sub-fabrication floor at Global Foundries, Malta, New York. Image courtesy Christopher Payne.I first met Payne on a sunny January day in Gowanus, Brooklyn — a neighborhood whose namesake canal, abused by local tanneries, mills, and chemical plants for decades, is now one of the most polluted waterways in the country. No longer suitable for heavy industry, Gowanus remains a relatively hospitable neighborhood for taxi depots, lumber companies, and a cement supplier. But when I visit Gowanus it’s usually on a trip to my climbing gym, which is around the corner from another climbing gym; Gowanus is also home to a gymnastics camp, an indoor archery range, and the most suburban-looking Whole Foods in Brooklyn. It is a neighborhood beset by competing forces: a haven for light industrial business fleeing gentrification elsewhere, but also the site of lots of gentrification.Payne and I met at Griffin Editions, a print shop that Payne described enthusiastically as “the place.” He was there to inspect a print of his that had sold, and I milled nervously around, trying to understand what part of the art world I was standing in, and how it connected to the industrial neighborhood around it. A refrigerator in the entry was stocked with more film canisters than I had seen in decades, and the raw but neatly-constructed plywood shelving behind me was stacked with monographs by artists who I assumed had longstanding relationships with Griffin. Payne was inspecting prints of his photographs. One was from a series from Titleist’s golf ball assembly line, and Payne pointed at one of the balls, presumably suggesting how the photograph might be exposed differently on a reprint. I got the impression that he had a longstanding relationship with Griffin, and that it was a collaborative one — a sense that may have been reinforced by the swirls of activity happening around him. In front of me was a large, well-lit table, and behind the table were Payne’s prints, mounted on the far wall. Payne appeared to be discussing them with a manager of some kind, and as he approved one print, another worker slipped it off of the wall, transferred it to the table, and methodically wrapped it into a flat package, taping it up with precision and marking it neatly with a Sharpie. Sign up for Scope of Work Excellent writing about the physical world. Subscribe .nc-loop-dots-4-24-icon-o{--animation-duration:0.8s} .nc-loop-dots-4-24-icon-o *{opacity:.4;transform:scale(.75);animation:nc-loop-dots-4-anim var(--animation-duration) infinite} .nc-loop-dots-4-24-icon-o :nth-child(1){transform-origin:4px 12px;animation-delay:-.3s;animation-delay:calc(var(--animation-duration)/-2.666)} .nc-loop-dots-4-24-icon-o :nth-child(2){transform-origin:12px 12px;animation-delay:-.15s;animation-delay:calc(var(--animation-duration)/-5.333)} .nc-loop-dots-4-24-icon-o :nth-child(3){transform-origin:20px 12px} @keyframes nc-loop-dots-4-anim{0%,100%{opacity:.4;transform:scale(.75)}50%{opacity:1;transform:scale(1)}} Email sent! Check your inbox to complete your signup. No spam. Unsubscribe anytime. Payne was ebullient; I imagined that he was excited to have a physical product to show for his workday. He slipped the envelope under his arm and suggested we relocate to a pizza place nearby, and as we walked, I re-explained who I was and started my voice recorder. I went on to worry about the recorder for basically our entire conversation: Payne was the most soft-spoken patron in the pizza place, which was small and full of hard surfaces for competing conversations to reverberate off of. The recording, in the end, was fine.Piano rims being conditioned at Steinway & Sons, Astoria, New York. Image courtesy Christopher Payne.I, like Payne, have been to my share of factories, and independent of my conversations with him I consider that a point of pride. It is a part of my personal history which feels both distinguished and down-to-earth. But I no longer maintain an active list of factories to visit, and in this respect Payne has me beaten. His enthusiasm for manufacturing facilities is fully inhabited; while I sometimes look upon my own industrial tourism as a distraction, he is clearly energized by the idea. When I described his earlier books as “photography projects,” and suggested that Made in America seemed like something that he might pursue further, he pulled out his phone and swiped through a wishlist of factories that was multiple pages long. A week after our first meeting, Payne emailed me from Ohio; he was shooting a football factory. He was already planning his next factory visit.As Payne tells it, it was the urgency of his first MTA project that led to his career as an industrial photographer. At the time he was working at an architecture firm: “That was, like, my path,” he said, looking intensely ahead and miming a narrow, straight road. He enjoyed architecture’s collaborative aspects, but he didn’t enjoy “helping someone else fulfill their dreams,” and when he made friends with a superintendent of the MTA’s power department, Payne began obsessively visiting the subway’s soon-to-be-decommissioned electrical substations. “Initially, I was simply thrilled to discover something forgotten and hidden from public view,” Payne wrote in New York's Forgotten Substations. “But as I spent more and more time in them and saw them being destroyed, one by one, I began to feel a poignant sense of loss, and, in turn, a personal obligation to document this vanishing typology.” His MTA contact gave him access to a substation in Chelsea, and Payne started making sketches of the equipment there. Eventually he began taking photographs, rushing to capture these “ruins and relics of a bygone era.”Construction details of the Virgin River Bridge, Zion National Park, Utah. Created by Christopher Payne in 1993 for the Historic American Engineering Record; image via the Library of Congress.This was not his first time documenting old, highly engineered infrastructure. Between college and graduate school Payne had worked for the National Park Service’s Historic American Engineering Record (HAER), where he made meticulous as-built drawings of the bridges in Zion National Park. HAER (and the other programs within the Heritage Documentation Program) has produced over forty-five thousand surveys since its founding during the Great Depression; when Payne realized that he could be “getting paid to crawl around an abandoned building,” he jumped at the idea. “It was so much fun,” he told me, and the skills he developed there led directly to New York's Forgotten Substations and his second book, Asylum.I wanted very much to witness Payne in action, so the second time we met was clear across the city on a sunny morning in February. Payne was scouting a shoot at the MTA’s 207th Street Shop, a train yard near the northern tip of Manhattan which overhauls carriages, refurbishes HVAC units, and generally reminds its visitors that the trains have to go somewhere at the end of the line. To get there, I went almost to the end of the 4 train, salmoning northward against rush hour traffic for more than an hour, listening to the recording of our first conversation and trying to think of insightful follow-up questions to ask. I had consciously overpacked for the trip: large notebook, small notebook, laptop, voice recorder, not one but two cameras. The day ended up being surprisingly warm, and I had overdressed as well. But I had remembered to wear boots (one of the best things you can do while visiting a factory is wear boots) and felt, overall, reasonably well-prepared.One advantage of not holding firm to a professional title is that I sometimes find myself cosplaying in a trade that I barely understand. The 4 train ends in the Bronx; I got off at Fordham Road and then walked across the University Heights Bridge in the hopes of catching a glimpse of the 207th Street shop from across the river. It turned out that I could get a view, and so I grabbed my camera, hopped the barricade separating the bridge’s pedestrian walkway from the roadway, and strolled nonchalantly from one side of the bridge to the other, wedging myself into the space between the roadway and the bridge’s seafoam-painted truss members, keeping one eye on the traffic over my right shoulder while I took a couple of pictures of the sprawling complex, framed by nothing in particular and looking drab, cluttered, and unremarkable.Cars honked unnecessarily as they passed. From there I continued, hopping like Frogger back across the bridge’s four lanes of car traffic, stepping back over the low barricade to the sidewalk, and continuing westward. On the Manhattan side of the bridge I walked past a few large construction sites, then climbed up the steep east side of Inwood Hill to the coffee shop that Payne had suggested we meet at. Even with this miniature field trip I had more than an hour to kill before Payne and I were set to meet, and by the time he walked briskly up it was almost hot outside and I was eager for the adventure to come. Payne held a conspicuous old FreshDirect bag under his arm; in it were two hard hats and two pairs of safety glasses, which he showed me with an air of conspiracy. Payne lives in Inwood, and his eyes darted back and forth across the street knowingly. I imagined them like spotlights, searching for something to lock onto, but the streetscape seemed to be one that he was familiar with, nothing of note to discuss. We walked past an entrance to the A train, and suddenly something clicked, and without pausing he turned and pointed to an old cast iron pole sticking out of the curb, informing me with reverence that it was one of the last remnants of the city’s network of gas streetlights. It was a clear, dry winter morning, and the scene was undersaturated, blown out. The streetlight pole, painted filthy yellow, was an unremarkable part of a messy setting. But for a moment I imagined Payne’s spotlights on it, and I could see it, and the engineered system that it was once a part of, in all of its honorable and technological glory. For most of Manhattan, Tenth Avenue is on the far west side of the island; south of Central Park it has no subway lines at all, and it often feels windswept and semi-forgotten. But Manhattan drifts westward the farther uptown you go, and Inwood exists almost entirely to the west of 10th, leaning hesitantly away from the rest of the city and into the Hudson River. The 207th Street shop is on the east side of 10th Avenue, in a low-lying industrial area that must have been marshland before the city grid was drawn up. Payne and I picked our way through construction at 10th Avenue, the 1 train rumbling on elevated tracks above us, and walked up to a soft blue door in the middle of a huge brick facade. We entered into a small and decidedly industrial vestibule; identification was requested and proffered. Payne texted the MTA employee who had scheduled a meeting with him, and while the security guards decided whether we could enter, Payne took out his phone and showed me what he planned to scout that day. His energy was slightly nervous, and I got the sense that his nerves were more attuned to the politics of the situation (the MTA isn’t required to let photographers shoot their maintenance facilities) than they were to the technical aspects of the photographs he was scouting.Christopher Payne at the Coney Island Overhaul Shop, photographing the cleaning of an AC motor before it gets rebuilt.It’s a little bit unclear what I can write about our visit, or the negotiations of which our visi'''
