description = "Personal computing has long since arrived: Our lives and homes are bursting at the seams with computers; old phones and laptops spill out of drawers, full of the digital ephemera of our lives. In their recent book, Laine Nooney, Assistant Professor of Media Industries at NYU, traces the history of"
full_description = "Personal computing has long since arrived: Our lives and homes are bursting at the seams with computers; old phones and laptops spill out of drawers, full of the digital ephemera of our lives. In their recent book, Laine Nooney, Assistant Professor of Media Industries at NYU, traces the history of how computers became so ubiquitous. They outline how the Apple II, released in 1977, was pivotal in bringing everyday people on board as users and ushering in the personal computer revolution.Starting on 2023-09-08, Scope of Work's Reading Group is getting into microcomputing, reading The Apple II Age: How the Computer Became Personal by Laine Nooney. Each Friday, we discuss the book on Zoom and swap links and thoughts throughout the week on Slack. Members of Scope of Work can join the conversation in the #community-reading-groups channel on Slack – and follow along with the book themselves starting on 2023-09-08. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30 Interview • 16 min read Frostbitten A conversation with Nicola Twilley about refrigeration.… Spencer Wright • 2024-09-16"
