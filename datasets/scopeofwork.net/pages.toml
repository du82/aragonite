description = """
Founded by Spencer Wright in 2013, Scope of Work has sent out a newsletter about engineering, manufacturing, and infrastructure every week since.

Scope of Work also runs a Brooklyn-based workshop and publishes original features exploring these topics in depth. Lastly, Scope of Work has a vibrant Member community of people"""
full_description = "Founded by Spencer Wright in 2013, Scope of Work has sent out a newsletter about engineering, manufacturing, and infrastructure every week since.Scope of Work also runs a Brooklyn-based workshop and publishes original features exploring these topics in depth. Lastly, Scope of Work has a vibrant Member community of people working on real problems in the physical world.Keep up to date with what’s going on behind the scenes and be in touch. :)TEAM.Spencer Wright, editor-in-chief.Hillary Predko, deputy general manager. Scope of Work is supported by our awesome Members, and through generous support from: BUSINESS MEMBERSLoupeRBRKickstarterHammerheadImpossible ObjectsParallel SystemsPeak DesignCOOP DesignCopia AutomationFluxOno Food Co.AerolaseGlassboard LLCRonin Product Development LabsVuecasonT-Works FoundationWe care about inclusivity and expect everyone who participates in Scope of Work to follow our code of conduct."
