full_description = "Starting 2022-05-06, Scope of Work’s Reading Group is reading Vaclav Smil’s Made in the USA: The Rise and Retreat of American Manufacturing. From the publisher:Vaclav Smil powerfully rebuts the notion that manufacturing is a relic of predigital history and that the loss of American manufacturing is a desirable evolutionary step toward a pure service economy. Smil argues that no advanced economy can prosper without a strong, innovative manufacturing sector and the jobs it creates.Smil explains how manufacturing became a fundamental force behind America's economic, strategic, and social dominance. He describes American manufacturing's rapid rise at the end of the nineteenth century, its consolidation and modernization between the two world wars, its role as an enabler of mass consumption after 1945, and its recent decline. Some economists argue that shipping low-value jobs overseas matters little because the high-value work remains in the United States. But, asks Smil, do we want a society that consists of a small population of workers doing high-value-added work and masses of unemployed?Smil assesses various suggestions for solving America's manufacturing crisis, including lowering corporate tax rates, promoting research and development, and improving public education. Will America act to preserve and reinvigorate its manufacturing? It is crucial to our social and economic well-being; but, Smil warns, the odds are no better than even. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30 Interview • 16 min read Frostbitten A conversation with Nicola Twilley about refrigeration.… Spencer Wright • 2024-09-16"
