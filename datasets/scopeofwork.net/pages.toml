ork’s Slack instance is an excellent place to meet future collaborators, friends, and employees. The lively conversations range from current events to design and sourcing advice. Members get a peek behind the scenes at Scope of Work, with a direct line to our editors, visibility into newsletter writing, a full link archive, and quarterly reporting on operations. FAQ Who is Membership for? If you're interested in what we cover in our newsletter, then Membership is for you. Our Members come from a wide range of backgrounds, and their interests in the built environment are sometimes professional, sometimes personal, and always enthusiastic. How active is the Members' Slack? Most weekdays there are between one and two hundred messages posted to the Slack. However, we tend to organize conversation within threads -- so the vast majority of messages won't trigger a notification on your phone or computer. What is your cancellation and refund policy? All paid subscriptions to SOW can be canceled at any time by signing into your account, here. Paid subscriptions to SOW are automatically recurring on either a monthly or annual basis. If you would like to cancel your subscription within 30 days of the payment being processed, we're happy to offer a 50% refund."
