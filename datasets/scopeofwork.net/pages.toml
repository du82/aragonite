Starting on 2023-06-30, Scope of"""
full_description = "Disney is in the business of developing technologies that are indistinguishable from magic. This goal is aided by a research and development apparatus known as Imagineering, a group of engineers and artists who painstakingly design and fabricate the company's empire of amusement parks and cruises. Starting on 2023-06-30, Scope of Work's Reading Group is peering behind the curtain, reading The Imagineering Story: The Official Biography of Walt Disney Imagineering by Leslie Iwerks. Alongside the book, Members are encouraged to check out the accompanying documentary series. Each Friday, we discuss the book on Zoom and swap links and thoughts throughout the week on Slack. When we wrap up in August, we're inviting Colin Godby, a former Imagineer and friend of SOW to join the last call. Colin's done some amazing work over the years, both at Disney and as Director of Hardware and Design at Sphero, Director of Hardware Engineering at Glowforge, and now as the founder and CEO of Dust Moto.Members of Scope of Work can join the conversation in the #community-reading-groups channel on Slack – and follow along with the book themselves starting on 2023-05-12. Reading Group • 2 min read We're reading Building SimCity For people of a certain age—my age—the memory of playing SimCity, probably on a desktop computer in a public part of your childhood home, is an iconic and evocative part of early nerd culture. SimCity was… Spencer Wright • 2025-01-07 Interview • 21 min read Anything that Lets Me See More of the World An interview with Tim Hwang about infra-nerd tours, the internet ad market, and work in the age of parenthood.… Spencer Wright • 2024-09-30 Interview • 16 min read Frostbitten A conversation with Nicola Twilley about refrigeration.… Spencer Wright • 2024-09-16"
