description = "Spencer Wright is the (mostly accidental) founder of Scope of Work, which he started writing (as The Prepared) in 2013. Today he serves as its editor-in-chief and chief dilettante."
full_description = "Authors Spencer Wright Spencer Wright is the (mostly accidental) founder of Scope of Work, which he started writing (as The Prepared) in 2013. Today he serves as its editor-in-chief and chief dilettante. 435 posts Hillary Predko Hillary Predko is an interdisciplinary artist and researcher who works across the boundaries of craft and computation with a penchant for trash. 63 posts Scope of Work Excellent writing about the physical world. 18 posts Anna Pendergrast Anna Pendergrast is a writer and strategist based in Wellington, New Zealand. She is co-founder of Antistatic, a research and communications consultancy. 15 posts Kelly Pendergrast Kelly Pendergrast is a writer, researcher, and sometimes art worker based in Oakland. She is the co-founder of Antistatic, a consultancy that focuses on issues around technology and the environment. 15 posts Kane Hsieh 13 posts TW Lim TW Lim studied sociology and design and has worked in restaurants, big data, and 3D printing. Originally from Singapore, he writes about the business and culture of food. 13 posts James Coleman James has run classrooms, warehouses, and startups. Based in Atlanta, GA, he is currently focused on developing compelling spatial experiences in VR. 12 posts Sean Kelley Hardware Engineering Manager at KeyMe where I design kiosks that automate copying keys. Fell in love with product design growing up as a toy tester for IDEO Play Lab. California native living in NYC. 12 posts lee wilkins lee is an artist, cyborg, and scholar based in Canada. They are an outer space researcher, soft circuits enthusiast, and chair of the Open Hardware Summit. 12 posts Eric Weinhoffer 10 posts Drew Austin 8 posts Natasha Balwit-Cheung Natasha Balwit-Cheung is a writer and researcher from Oregon and New Mexico. She has written for ARCHITECT, CityLab, The Atlantic, The New Farmer's Almanac, and others. 8 posts Amreeta Duttchoudhury 7 posts Dan Hui 6 posts Lisa Neigut 5 posts George Cave George is an expert in experience prototyping & interactive technology. He's currently building the drone delivery network for the UK's National Health Service at Apian. 5 posts Surjan Singh 4 posts Ruth Grace Wong 3 posts Skyler Adams 3 posts SJ Jones 3 posts Matthew Hockenberry Matthew Hockenberry, PhD is a media historian and theorist whose work examines the media of global production. He writes on the state of global supply through the lens of its most emblematic objects. 2 posts Harrison Lin 2 posts Shannon Mattern Shannon is the Penn Presidential Compact Professor of Media Studies and Art History at the University of Pennsylvania. Her writing and teaching focus on archives, libraries, and media infrastructures. 2 posts Divya Manian 2 posts David Cranor 2 posts Ben Lachman 2 posts Chuma Asuzu Chuma Asuzu is a designer and engineer who writes about technology in Africa. 2 posts Brian Potter Brian Potter is a structural engineer and the author of the excellent Construction Physics newsletter. 2 posts Liam Grace-Flood Liam Grace-Flood works at the intersection of strategy, innovation, and social impact. His work has appeared in Make: Magazine, Core77, Yale Paprika!, Next City, and others. 1 post Sam Wurzel 1 post Sophi Kravitz 1 post Joanna Scutts Joanna Scutts writes about books, design, culture, and history, with a particular focus on erased and overlooked stories. Originally from London, she now lives in New York. 1 post Payton Barnwell 1 post Noah Lorang 1 post Monique Taylor-Mccants 1 post Anna Fitzpatrick Anna Fitzpatrick is a journalist and novelist living in Toronto, Canada. 1 post Maya Kelley 1 post Matt Pogue 1 post Mateo Sewillo 1 post Kate Mcmahon 1 post Cindy Feng Cindy Feng is a user experience professional whose work spans aviation human factors, flight deck human-centered design, and user research. She is based in Seattle, WA. 1 post Jordan Husney 1 post John Barnes 1 post Gabe Ochoa 1 post Taylor Dorrell Taylor Dorrell is a writer and photographer based in Columbus, Ohio. He writes for at the Cleveland Review of Books, the Columbus Free Press, and organizes with the Freelance Solidarity Project Union. 1 post Ameena Walker Ameena Walker is an NYC-based writer who covers architecture, design, real estate, transportation, and other aspects of culture and the built environment across the world. 1 post Deb Chachra 1 post Danielle Applestone 1 post Andrew Cantino 1 post Jessie Wright-Mendoza Jessie Wright-Mendoza is a reporter based in Brooklyn, NY. Her work has aired on NPR's All Things Considered, WHYY's The Pulse, and West Virginia Public Broadcasting's Inside Appalachia. 1 post Nicolas Kemper Nicolas Kemper is an architect in New York. He has written for the publications AA Files and Log, and in school, he edited the architecture often-weekly, Paprika! 1 post"
