full_description = "Seeing <—> Making: Room for Thought By y Susan Buck-Morss, Kevin McCaughey, and Adam Michaels Seeing <—> Making: Room for Thought both studies and presents the creative process of constructing ideas with images. By activating the techniques of montage and analogy, the book reveals a wide field of view and a space to engage new critical connections between a multiplicity of objects from the past and present. Realized through an intergenerational collaboration of three cultural producers committed to making theory visible, a transformative anthology of critical essays by Susan Buck-Morss anchors this kaleidoscopic project. Images and ideas sync with Buck-Morss’ perceptive texts on visual culture, history, politics and aesthetics, fusing criticism with visual play and linking collective imagination and social action. In both design and content, Seeing <—> Making: Room for Thought builds upon the dynamic sensorium of Marshall McLuhan and Quentin Fiore’s book The Medium Is the Massage, Walter Benjamin’s Arcades Project and John Berger’s Ways of Seeing. This innovative volume brings Buck-Morss’ more experimental, visually engaged work to the fore in a way that has not been available in the usual contexts within which her writing has appeared. Published By Inventory Press Publish Date 01/09/2024 Page Count 397 Format Paperback Type Book Process Offset Dimensions 4.76 x 7.68 in Language EN Filed Under AcademicDesignEssayPhilosophy ISBN 978-1941753538 Signed? No ← Next 10 Rules for Teachers and Students (4th Edition) Previous → Analog Photography: 1930–2000"
