["https://scottboms.com/library/garland-variations"]
title = "Garland Variations | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Garland Variations: A California Society of Printmakers Risograph Anthology By Zach Clark, Rachel Shelton Garland Variations is a Risograph Anthology publication featuring seven artist members of the California Society of Printmakers. The anthology publication has an established history within comics, and thus is a familiar format within the Riso community, showcasing a brief selection of work by a collection of artists. Anthology publications find their roots within poetry, where the earliest collections were referred to as ‘garlands.’ The moniker alludes to the act of selecting and arranging the finest flowers into a singular form, much like the editor would intentionally select works by chosen poets. Across these seven Northern California based artists, the natural world is a running theme, creating their own garlands as a cohort. The featured artists within this book work across the expanded field of printmaking, however this is the first time they have each worked with Risograph printing. Much like the tradition of variation based composing within classical music, each artist used the opportunity to see how their personal practice and research had the capacity to expand through arrangements and instruments beyond their usual toolkit. What results is a collection of works that reflect the larger body of each artist’s work, while in the process creating wholly unique works within their personal oeuvre as well as within the broader landscape of the medium. Published By National Monument Press Publish Date 11/01/2023 Page Count 66 Format Paperback (Limited Edition) Type Zine Process Risograph Edition Size 200 Dimensions 7.875 x 7.5 in Language EN Filed Under ArtDesignNonfiction Signed? No ← Next Pressing Matters: Issue 24 Previous → The Mysteries"
