full_description = "Imperfect Index Vol. 1: A Graphic Design Reference Book Edited by Abbie Vickress, Laura Parke A collaborative, crowd-sourced publication developed in response to an event held in 2023 and 2024, edited by the event co-founders. The series of essays it contains offer a non-linear, imperfect guide to a more expansive understanding of graphic design, reflecting on the discriminatory past and present of the discipline and looking forward to a more diverse and inclusive future. “The eurocentric graphic design canon of the 1960s is tired. It’s been used, presented, reused, and replicated for long enough. To ensure the discipline doesn’t continue to stagnate within this narrow view of the world, graphic design education and graphic design industries need to turn to the role models that represent, and have always represented, the complexities of diverse, intersectional identities and topics.” Contributors: Kaleena Sales, Michele Y Washington, Lihua Zhu, Amandine Forect-Aguié, Dohee Lwak, Zed Gregory,Tony Stiles and Mister SAmo, Kinda Savarino, Stephen Rosger, Arjun Harrison-Mann, Beatrice Sangster, Conor Foran (Dysfluent magazine), Poppy Thaxter, Kaiya Waera, Nina Paim, Lara Dautun, Joshua Dut weiler and Alexandria Canchola, Dellana Arievta, Elaine Lopez, Kelly Walters, Dina Benbrahim, Dmitri Reist and Lynne Elvins Published By Sold Out Publishing Publish Date 11/16/2024 Page Count 128 Format Paperback Type Periodical Process Offset Dimensions 148 x 210 mm Language EN Filed Under DesignCritiqueEssayJournal ISBN 978-1-914180088 Signed? No ← Next Silver Surfers Previous → Fracture: Japanese Graphic Design 1875-1975"
