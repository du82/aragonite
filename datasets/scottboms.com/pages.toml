["https://scottboms.com/making/able-allowed-should"]
title = "Able Allowed Should | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Able Allowed Should All technology, no matter how insignificant it might seem, must be carefully considered. Just because you’re able and allowed to do something doesn’t mean you should. This poster, like the talk and eventual Medium article that preceded it, intends to bring a critical and introspective conversation about responsibility and ethics into the foreground and out into the open at Facebook — on its walls in plain sight. What are the seen and unseen effects of technologies? How could they be misused? What are the worst-case scenarios if something goes wrong? What potentially unintended consequences haven’t been considered? And how does one weigh the heavy burden of responsibility that underpins technology that reaches billions of people every day? Client Made while employed by Facebook, Inc. Role PrintmakingCreative DirectionDesignTypography Country USA Languages English Year 2018 Format Poster Print Processes Silkscreen Risograph Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Facebook Global Signage System Previous → Is Acceleration Accelerating?"
