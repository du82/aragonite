full_description = "A Brief Atlas of the Lighthouses at the End of the World By José Luis González Macías There is something beautiful and wild in the impossible architecture of lighthouses. These precariously perched structures have been the homes and workplaces of keepers whose romantic guardianship has saved countless lives from cruel seas. While that way of life may have faded away, as the lights go out and the buildings crumble, we still have their stories. This collection of more than thirty tales spans the heights and depths of human experience: the blind lighthouse keeper tending a light in the Arctic Circle, the intrepid young woman saving ships from wreck beginning at just age twelve, the desperate plight of a crew cut off for forty days with meager supplies, the lighthouse haunted by the clacking sound of a long-passed keeper’s ghostly typewriter. Published By Chronicle Books Publish Date 04/02/2024 Page Count 160 Format Hardcover Type Book Process Offset Dimensions 6.75 x 9.5 in Language EN Filed Under TravelHistoryArt ISBN 978-1797227474 Signed? No ← Next Notes on Artist Publishing Previous → Pressing Matters: Issue 26"
