["https://scottboms.com/documenting/where-our-destination-lies"]
title = "Where our Destination Lies | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Monday, February 24, 2025 The real issue with speed is not just how fast can you go, but where are you going so fast? It doesn’t help to arrive quickly if you wind up in the wrong place. Walter Murch Steven Johnson says Keep your folders messy. Friction is there to be helpful, not a hinderance to creativity. As someone with a tendency to organize the hell out of all the screenshots, images, sketches, and notes squirreled away for reference or that might one day be useful — including the ones that didn’t go anywhere the first time around — a certain amount of randomness means having to revisit that history each time you dig through it. It becomes a chance to arrive where you’re really meant to rather than where you think you ought to go. My own process tends to favor either moving quickly out of the gate while leaving time for reflection, or to start slowly, mining my spark file to search for the right seeds. In either case, the trick is to leave room for mistakes, especially early on when there’s little meaningful risk. Both avenues allow for detours and wrong turns — and once and a while, you discover a road not on the map. Footnotes Murch, Walter. In the Blink of an Eye: A Perspective on Film Editing. Silman-James Press, 2001. ← Next Through Lines 247 Previous → Bits and Hexes"
