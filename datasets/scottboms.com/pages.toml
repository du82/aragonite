full_description = "Designer in Residence Program Between 2016 and 2020, I oversaw and curated the design-focused residency program within the Analog Research Lab. Established to add an increasingly diverse set of creative voices into the studio’s output, the program offered access to new tools, processes, and mentorship over periods ranging from 4 weeks to 3 months. More than 40 designers, illustrators, and printmakers were invited to participate in the program which during it’s initial 4-year run, expanded from California to New York, Dublin, London, and Singapore. This global growth offered access to an entirely new cohort of potential participants. Their work spanned a broad range of mediums and materials — Risograph and silkscreen prints, books, zines, pins, elaborate visual campaigns, large-scale painted and sculptural installations, workshops, and more. In addition to defining strategy and curatorial research for the program, I provided creative direction and project support for designers throughout their residencies. As the program expanded to other lab spaces in North America and Europe, we developed new processes to offer remote critique and collaboration. Beginning in 2018, we produced a series of award-winning mini-documentaries of the designers with our friends at Hello Design, Arcade Films, and Landucci Films. Alumni of the Designer in Residence program at the Analog Research Lab include: Joseph Alessio Liron Ashkenazi Bijan Berahimi Kaye Blegvad Cody Blocker Sarah Boris Alexandra Bowman Ashwin Chacko Luiza Dale Alan Dunne Trevor Finnegan Monica Garwood Heather Hardison Meagan Hyland Ryan Johnson Sabrena Khadija Hannah K. Lee M&E Design Fuchsia MacAree Gabriella Marcella Steve McCarthy Fiona McDonnell Frances MacLeod Ale Mercado Jimmy Mezei Conor Nolan Tara O'Brien Darius Ou Eddie Perrote Vanessa Power Bill Rebholz Elana Schlenker Pearl Shen Kyuha Shim Leta Sobierajski Sean Suchara John Patrick Thomas Andy Tran Amber Vittoria Mario Wagner The residency films produced with our partners at Hello Design were selected for a 2020 Communication Arts design award. Client Made while employed by Facebook, Inc. Role Creative DirectionCurationPhotography Country United States Languages English Year 2016–2020 Format Poster Installation Ephemera Book Illustration Mural Zine Film Social Processes Silkscreen Risograph Offset Lithography Painting Laser Cutting Prototyping All images were captured by Hello Design (California), Arcade Films (Dublin), and Landucci Films (New York) respectively. Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Why Aren’t We Talking About… Previous → Be the Nerd"
