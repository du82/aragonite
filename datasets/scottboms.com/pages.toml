title = "A Perilous Return to Earth | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "A Perilous Return to Earth Thursday, January 21, 2021 The first of several cyanotype (sun prints) made over the last few days at home. For several months I’ve been slowly amassing materials to get back into collage as a daily practice and reason to make something (nearly) every day. Bijan encouraged this during his residency in the Analog Lab way back in 2016, but it’s only been in the last almost year where the need for it has hit home. But it took until the last week or so where I finally gave myself permission to start. It wasn’t that I couldn’t find the time, or that I was afraid of making something bad. I think it simply that I wanted something just a bit more out of the experience — which so far has turned out to mean working with cyanotypes. ← Next Through Lines 039 Previous → The Hill We Climb"
