["https://scottboms.com/library/how-to-build-a-universe"]
title = "How to Build a Universe that Doesn't Fall Apart Two Days Later | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "How to Build a Universe that Doesn't Fall Apart Two Days Later By Phillip K. Dick With an introduction by David Krakauer, this prophetic 1978 essay follows legendary science fiction author Philip K. Dick as he explores the nature of reality, the power of media, and the authenticity of human experience, offering startling insights that resonate eerily with our modern world. Against the surreal backdrop of Disneyland in 1978, visionary science fiction author Philip K. Dick delivers a mind-bending lecture on the fragile nature of reality, the power of fiction, and the quest for authentic human experience in an increasingly mediated world. How To Build A Universe That Doesn’t Fall Apart Two Days Later is at once a lecture on the aims of writing science fiction, an essay on Pre-Socratic philosophers, and a reflection on similarities between the author’s life and the Book of Acts. Dick’s distrust of mass media information systems and those who operated them circa 1978 is so prescient that it seems the author may have uploaded himself into one of the androids in his fiction, so as to continue observing the world. Published By Isolarii Publish Date 11/19/2024 Page Count 120 Format Paperback Type Book Process Offset Dimensions 4.25 x 2.75 in Language EN Filed Under CritiqueNonfictionEssay ISBN 979-8987123126 Signed? No ← Next A Visible Distance Previous → Silver Surfers"
