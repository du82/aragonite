["https://scottboms.com/documenting/a-part-of-nature"]
title = "A Part of Nature | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Saturday, March 27, 2021 People today have forgotten they’re really just part of nature. Akira Kurosawa Kurosawa isn’t wrong, especially in our modern technology-laden world. I previously encountered this sentiment similarly in the writing of Wendell Berry where he explains why we struggle to change to combat an environment in crisis. The distance of most humans from doing real work in nature is now so great that we’ve lost sight of the knowledge and understanding of where modern conveniences come from and how they’re made. As everything is increasingly made up of 1s and 0s, and as we perceive more of our world through that lens, we risk deepening that divide to a point of no return. This is all to say that today might be a nice day for a quiet walk through the woods to reflect on the majesty of nature. ← Next R-2112 Previous → Through Lines 048"
