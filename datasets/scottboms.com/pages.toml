title = "Through Lines 122 | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Through Lines 122 Sunday, August 28, 2022 Eddie Vedder, celebrating the music and 70th birthday of the late Joe Strummer. This quote from Steve Jobs speaks to me: “The people that have created things that really changed our industry, are both the thinker and doer in one person.” I’m not sure I’d ever use/need the forthcoming Lockdown Mode in iOS 16, but it’s useful to understand its limits or how it could be create an entirely different problem. These animated figures of John, Paul, George and Ringo recreating the Abbey Road cover by Daniel Bennan are truly outstanding. Maybe Every Time Zone will help me finally untangle cross-zone collaboration. Artist Michael Heizer’s epic 50-year long project City has finally opened in the Nevada desert though visiting it is likely going to be challenging. I’m definitely ready to return to Middle Earth after watching this new trailer for Lord of the Rings: the Rings of Power. September 2nd is almost here. Meet me in the Metaverse should have been on the agenda while in London during this past week. Definitely of interest for a number of reasons. Although these aren’t technically photos of Jupiter from the JWST, they’re still outstanding composite renderings of the largest gaseous planet in our solar system. Finally a use of ink traps in a typeface for Leibniz that actually isn’t just about aesthetics but actually serves to connect back to the real characteristics of a product. And that monogram couldn’t be more perfect. I agree 100% with Jeremy based on the amount of work as performance I’ve had to both endure and witness in the tech industry. A fully functional 35mm camera made of LEGO parts. Hello. Debunking the tittle in typographic terminology. Well, there you have it. The Sabotage action figure set from Super7. OMG. McMansion Hell. Name says it all… Notable Type Releases You say you want letterform contrast? Beatrice Display from Sharp Type’s unique internal contrast system results in a family that ticks all the boxes. Studio Gummi’s Flake is the quirky construction display face you’ve been missing. Fenotype’s Berliner is another reinterpretation of the classic soft curves of Cooper with added ligatures, swash characters and more. The exciting, energetic, angular, and altruistic Ara Oms is available via a donation to a number of charities supporting Ukrainian refugees in Georgia. ← Next Try Not to Worry About It Quite So Much Previous → Waves on the Sea"
author = "Designed and built Scott Boms."
year_published = 2022
