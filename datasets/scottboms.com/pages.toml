full_description = "Ampersand Collection In 2010, along with some help from a few internet friends, I launched a small side project called Ligature, Loop & Stem as an outlet for typographic explorations and printmaking endeavors. The first product we launched was a limited edition letterpress print celebrating the humble ampersand aka the designer’s best friend. Produced in Toronto at Lunar Caustic Press, the edition of 25 letterpress prints included 36 ampersands across visual and categorical styles along with important historical information about this famous glyph. With limited marketing via the former bird site, the prints sold out in less than 48 hrs and fueled additional projects. Client Ligature, Loop, and Stem Role CopywritingCurationCreative DirectionDesignTypographyProduction Country Canada Languages English Year 2010–2011 Format Badge Card Poster Print Processes Letterpress Silkscreen Copyright © Ligature, Loop, and Stem. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Typographic Anatomy Lesson Plan Previous → Typographic Anatomy Lesson Plan Second Edition"
