["https://scottboms.com/good"]
title = "A Journal of Good Things | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Good Things Something good† or a favorite moment every day. Scored a pretty sweet new work email address (lol, I know, I know) and an even better secret alias. 03/04/2025 The comforting sound of Neko Case’s voice in my ears. 03/03/2025 A long peaceful walk with the dog and without being tethered to technology. 03/02/2025 Seeing an idea through from nothing to something really quickly. 03/01/2025 Warm sun, birds chirping away, and a good record spinning on the turntable. 02/28/2025 A quiet day off. Finishing not one but two excellent books. 02/27/2025 Reconnecting with old friends you haven’t seen in far too many years. 02/26/2025 A good song never fails to be the secret to making it through these difficult days. 02/25/2025 The rush of the moment when a personal truth clicks in your mind and you finally understand the why of something important. 02/24/2025 A warm and slightly overcast morning — perfect for the year’s first outdoor ride. 02/23/2025 Nearly through the last bits of organizing everything for tax season. I prefer duck season. 02/22/2025 A day off and a bright, crisp morning walk with the kids and the dog. 02/21/2025 Canada beat the US in the Four Nations Championship Face-off game. 02/20/2025 A welcome change of routine this morning including time on the whip. 02/19/2025 Held it together amidst a strange day full of change. 02/18/2025 Back on the ‘ol whip for the second day in a row after far too long. Rough but needed. 02/17/2025 A good haul of new reading material from the local library’s monthly book sale. 02/16/2025 Gillian is back in California while on a week off from classes. 02/15/2025 A peaceful train ride, a good book, and a shorter than usual workday to wind down the week. 02/14/2025 Delicious Deli Board sandwiches with the team. 02/13/2025 The sound of birds chirping away outside and unexpected sunlight streaming through the windows. 02/12/2025 Finally, finally (finally!) resolving a maddening code problem that’s plagued me for months. 02/11/2025 The sad beauty of colorful torn posters. 02/10/2025 † The world can be a drag and little moments of joy help fight against being overwhelmed by it."
