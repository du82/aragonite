["https://scottboms.com/making/everything-you-love-is-here"]
title = "Everything You Love is Here | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Everything You Love is Here An answer to Earth Week in the middle of a global pandemic Everything changed on March 6th, 2020 when Earth Week plans were completely upended and this project needed to be completely rethought. The original brief aimed to create urgency around the cascading effects of humanity’s impact on our planet and invite those conversations through art, a group of artists and designs from different parts of the world, and sustainable creative practice. That pivot resulted in a simple message aimed more at a sense of togetherness, something that felt urgent in a time when people needed to remain physically distant. It needed to feel approachable, warm, and personal for a time when people were unsettled and scared. The original poster design didn’t change much from my earliest sketch beyond different message phrasings and various changes to the lettering. The intentionally loose illustration of the Big Blue Ball was essentially the first version, but expanded to include global variations as it became an anchoring element across the larger program that developed. Client Made while employed by Facebook, Inc. Role Creative DirectionDesignIllustrationCopywritingTypography Country USA Languages English Year 2020 Format Ephemera Colateral Poster Illustration Processes Offset Lithography Digital Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next ♥︎ Healthcare Workers Previous → Open Arts"
