full_description = "A Dish Best Served… Sunday, May 9, 2021 Sterling silver serving tray, hand-painted in 2015. I need to make room in the studio (aka the garage) for new work and am selling off a few original hand-painted signs and objects. One is this piece I painted for an exhibition in Los Angeles in 2015. I have a soft spot for a good pun and this one is, as the kids say, ‘chef’s kiss’ for me. A few designs will also include either the original paper pattern or maybe an early practice run through. Unfortunately I can’t seem to find the original pattern for the Revenge tray, but I clearly recall the frustration the reflective surface caused while painting that two-tone mock block lettering before improvising the icy caps. $500.00 + shipping ← Next Our Data Ourselves Previous → Through Lines 054"
