["https://scottboms.com/library/silver-surfers"]
title = "Silver Surfers | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Silver Surfers: Sports Cars of the Sixties By Neil Peart The late Neil Peart, legendary drummer for the iconic rock band Rush, shares one last love letter to his beloved classic car collection and gives readers a glimpse of his lifelong passion for cars in this extraordinary collection. For Neil Peart, legendary drummer for Rush, cars were a lifelong passion. Now, in Neil’s final work — a never-before-seen piece completed before his untimely passing in 2020 — he writes about his beloved Silver Surfers collection; the joy of collecting these exquisite, rare, and important sports cars, and the even bigger joy of driving them. He first traces the roots of his auto obsession, taking us back to where it all began, with a 1969 Lotus Europa; through the cars he bought when the band first made it big and even his first “family car,” before taking us on a tour of the Silver Surfers themselves — a rare collection of the best sports cars from the 1960s. From a 1964 Aston Martin DB5 to a classic 1963 Chevrolet Corvette Sting Ray, each is a gorgeous silver (with the exception of one: a black 1964 Shelby Cobra whose patina Neil loved so much he wrote, “I am not going to paint it”). Published By Insight Editions Publish Date 11/19/2024 Page Count 96 Format Hardcover Type Book Process Offset Dimensions 12 x 9 in Language EN Filed Under BiographyEssayNonfictionPhotography ISBN 979-8886631005 Signed? No ← Next How to Build a Universe that Doesn’t Fall Apart Two Days Later Previous → Imperfect Index Vol. 1"
