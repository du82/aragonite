full_description = "Colophon This site was first built between 2019–2020 and replaces the previous one which managed to linger well past retirement age. It has been archived as-is. All design and development was done in-house (literally) using TextMate and BBEdit during the COVID-19 global pandemic. Illustrations were created using Procreate, Adobe Illustrator, and Adobe Photoshop. The site is generated using Kirby. Source code is managed on Github, deployed via rsync, and running on Linode. Typography The text on this site is set using typefaces from the Hoefler & Co. collection. The primary body text is set using Gotham ScreenSmart. Headings and other elements are set in Quarto. The site makes use of subset variants to provide contextual lining figures in headings and old-style numerals in body text for example. Essential Tools Design & Writing Adobe Creative Cloud Astute Graphics plugins Typeface.app Glyphs 3 Procreate Sketch Up VueScan Darkroom Instapaper iA Writer Studio Tools Risograph EZ 391U French Paper Co. Mohawk Paper Co. Blackwing pencils Speedball & Jacquard inks Squeegees (various) Flying Squirrel brushes Guillotine Stack Cutter 1 Shot enamel paints X-acto Knives Productivity 1Password Alfred TextMate BBEdit Mimestream Kirby CMS Drawbot Things Backblaze Cork"
