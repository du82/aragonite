["https://scottboms.com/shop/do-not-obey-in-advance-risograph-print"]
title = "Do Not Obey in Advance Risograph print | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Do Not Obey in Advance Risograph print All signs point to the complete dismantling of the American government over the next several years. Some of this may be needed and even helpful in the long-term, but it also might be unspeakably damaging for many in its wake. The goal is to drive so many to lose hope and surrender. We cannot do this. This is how fascists win. Instead, we must hold together and remember that they expect we will comply. Do not obey in advance. Shopping Bag Buy Now $12.00 Designer Scott Boms Production Methods Risograph Screenprinting Dimensions 10 x 12 in Product No. RSL-0029 Type Prints Edition Size 50 Published On 11/25/2024 Design & Production Notes Each individually numbered and signed print was printed on a Risograph EZ391U duplicator in Black ink along with two additional screen printed layers in blue and white. ← Next The Grouch Risograph print Previous → A Stone’s Throw: Or Let Them Fall Where They May zine"
