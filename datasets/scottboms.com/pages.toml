["https://scottboms.com/documenting/a-modern-man-hardly-knows-silence"]
title = "A Modern Man Hardly Knows Silence | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "A Modern Man Hardly Knows Silence Sunday, January 22, 2023 This book was gifted to me many years ago by Frank Chimero. April 6, 2011 to be exact (I looked it up). Its contents are somewhat irrelevant, and in fact, it’s only the strikingly illustrated cover painted by Frank that matters because that message is rarely far from the front of my mind in our over-technology and information saturated world. Sometimes all I want is to just go sit in a canoe in the middle of a lake away from everything. I’ve done it before and it’s glorious. ← Next Part A (Left Side) Previous → Through Lines 143"
