title = "A Lifelong Caper | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Saturday, February 6, 2021 I now inhabit a life I don’t deserve, but we all walk this earth feeling we are frauds. The trick is to be grateful and hope that the caper doesn’t end soon. David Carr This (I think) well known quote from journalist and author David Carr1 came to mind during a guest lecture appearance as part of a CSU East Bay design class earlier this week. Not surprisingly, the question of imposter syndrome came up, and while I didn’t directly quote Carr, this is what I was getting at. Footnotes The Night of the Gun: A Reporter Investigates the Darkest Story of His Life. His Own. by David Carr, 2009 Simon & Schuster. ↩ ← Next A Harvest of Invention Previous → Digital Black"
