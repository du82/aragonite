title = "A Helping Hand | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "A Helping Hand Sunday, January 12, 2025 I don’t know what’s coming as we’re now just days away from a major government transition. Everything already is starting to feel like it’s turning upside down. Deadly and devastating fires are burning through Southern California. Big Tech is currying favor with dangerous ideas and playing political games they’re not prepared or will likely accept responsibility for the lasting effects of — and there’s ominous clouds surrounding the future of discourse and democracy. This book’s contents were originally published in 1944 and declassified by the CIA in 2008. I’ve given this curious historical artifact — Simple Sabotage Field Manual, a new shape as an art project and a valuable tool for pattern recognition to shore up weaknesses that might originate from carelessness or inattention rather than exploiting them to cause damage or create chaos. Update: The first edition of 35 books is now SOLD OUT. I wasn’t originally planning on a second edition but I’m going to tinker a little with a couple design changes and see how I feel about potentially a new edition. ← Next The Narrowing Previous → Blog Questions Challenge"
