["https://scottboms.com/making/i-take-full-responsibility-book"]
title = "I Take Full Responsibility Book | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = 'I Take Full Responsibility Book I Take Full Responsibility is a book about this current moment in time in Silicon Valley. Released in two distinct editions, it is a permanent visual compendium of notable public-facing communications from technology company CEOs starting in November 2022, who, during that time, reduced their employee numbers by huge swathes. https://scottboms.com/media/pages/making/i-take-full-responsibility-book/a79184c9e6-1702681813/detail-riso-animation.jpg { "@context": "http://schema.org", "@type": "VideoObject", "name": "I Take Full Responsibility video animation", "description": "I Take Full Responsibility video animation", "thumbnailUrl": "https://scottboms.com/media/pages/making/i-take-full-responsibility-book/a79184c9e6-1702681813/detail-riso-animation.jpg", "contentUrl": "https://scottboms.com/media/pages/making/i-take-full-responsibility-book/bf630c3258-1702681813/detail-riso-animation.mp4", "uploadDate": "03/01/2024" } The book originated from my own experience looking for patterns and understanding in these communications — and as a critical response to seeing organizational morale cruelly decimated and culture steadily turned inside-out in the name of corporate profitability. It intends to act as a litmus test and time capsule of this critical juncture. The original limited edition sold out in less than 24 hours and has since been expanded and re-issued amidst continual job losses and further plummeting morale. Interspersed within its pages are personal photos and artwork from my ten years in tech along with an introduction that sets out its creation. Production Details Risograph printed in black, bright red, sunflower, and metallic gold inks on paper stocks from Neenah, Colorplan, and Lettermark, I Take Full Responsibility’s urgent message arrives enclosed within a Risograph and screen-printed closed-spine format along with laser-cut accessory prints delivered in a personalized Inter-office envelope. Each of the 100 hand-assembled books includes 2 additional prints — a tongue firmly planted in-cheek riff on a Silicon Valley classic alongside a new, original design created exclusively for the second edition. Client Personal Role Creative DirectionDesignIllustrationPhotographyCopywritingPrintmakingProductionTypography Country USA Languages English Year 2023 Format Book Ephemera Illustration Packaging Print Processes Risograph Silkscreen Laser Cutting Motion Graphics Copyright © Scott Boms. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Environmental Graphics Program Previous → Humane'
