["https://scottboms.com/library/citizen-printer"]
title = "Amos Paul Kennedy Jr: Citizen Printer | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Amos Paul Kennedy Jr: Citizen Printer By Amos Paul Kennedy Jr., Myron Beasley, Kelly Walters, Austin Kleon A self-described “humble negro printer,” Amos Paul Kennedy, Jr., is internationally recognized for his type-driven messages of social justice and Black power, emblazoned in rhythmically layered and boldly inked prints made for the masses. Borrowing words from civil rights heroes such as Rosa Parks, Fannie Lou Hamer, Frederick Douglass, and Sojourner Truth, Kennedy issues fearless statements on race, capitalism, history, and politics — along with plenty of witty truisms — in his exuberant, colorful, and one-of-a-kind posters and handbills. A vital monograph on a trailblazing contemporary Black artist, Citizen Printer features more than 800 reproductions representing the breadth of Kennedy’s letterpress prints (including rarely seen artist’s books), plus original portraiture of the maker at work, a powerful manifesto, and a foreword by New York Times bestselling author Austin Kleon, all presented in a dynamic and type-forward design from AIGA medalist Gail Anderson and Joe Newton. With essays by scholars Kelly Walters and Myron M. Beasley, Citizen Printer tells Kennedy’s inspiring story and contextualizes his work within the entwined legacies of Black printing and Black protest — and offers readers tools for lifting their voices so they too can agitate, agitate, agitate for a better today. Published By Letterform Archive Books Publish Date 09/17/2024 Page Count 276 Format Hardcover Type Book Process Offset Dimensions 9 x 12 in Language EN Filed Under DesignArtMonographNonfiction ISBN 978-1736863381 Signed? Yes ← Next The Life Impossible Previous → Shooting for the Stars"
