["https://scottboms.com/library/shooting-for-the-stars"]
title = "Shooting for the Stars | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Shooting for the Stars: Six Decades of Timeless Design By Richard Danne In its 248 colorful pages, there are countless award-winning, successful design programs and projects which have stood the test of time. Over six decades of global corporate clients (like AT&T and DuPont) to smaller not-for-profit organizations (like F.I.T. and Third Street Music School); Huge budgets to tiny, but all with strong concepts and enduring design solutions. Each design example is dated so one can appreciate the longevity of the work. In addition, the book contains many stories of how the projects evolved, some in unique and surprising ways. i.e.: NASA where we presented only a single Logo solution, but with multiple supporting applications; Or this author being stranded after a presentation in Saudi Arabia, with a full lock-down of airspace. Other stories have a decided teaching role and offer counterpoint to the diverse design presentations. There is also much about Danne’s design leadership and service, a commitment which goes well beyond his own practice, for the good of all. Simply put, it’s an animated long view of our graphic [visual] design profession, its history and evolution. Published By ORO Editions Publish Date 08/20/2024 Page Count 248 Format Hardcover Type Book Process Offset Dimensions 9.5 x 11.5 in Language EN Filed Under DesignMonographBiography ISBN 978-1961856134 Signed? Yes ← Next Amos Paul Kennedy Jr: Citizen Printer Previous → Burn"
