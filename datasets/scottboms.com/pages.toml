["https://scottboms.com/documenting/10-rules-again"]
title = "10 Rules Again | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "10 Rules Again Thursday, June 20, 2024 When I produced the last edition of the ★★★★★-star reviewed 10 Rules for Teachers and Students, I intended to make a larger but still modest edition. My Riso had other ideas, and although I had a handful of leftover covers and interior pages, there was enough missing that it cut the edition short. And then that limited run sold out. Fast forward to a recent friendly request that got me in the mood to produce another run. And so here we are with 40 new copies printed, folded, trimmed, and assembled. And now I can get back to one of the other projects I’ve been tinkering with. Sometimes going slow helps you figure out which of multiple things is the right one to actually focus on. ← Next Through Lines 213 Previous → Collecting my Collection"
