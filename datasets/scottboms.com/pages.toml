["https://scottboms.com/making/america-runs-on-manufactured-exhaustion"]
title = "America Runs On Manufactured Exhaustion | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "America Runs On Manufactured Exhaustion It doesn't have to be this way. It’s been a year. Or many. Who can really say anymore? But we’re all probably feeling some variation of the same malaise, frustration, exhaustion, or worse yet, panic — with few signs that solutions to the existential problems — and the very real ones we each face daily are being meaningfully addressed. Ask workers who’ve given up so much of their lives only to be tossed aside over email. Ask anyone from the Black, Asian, Muslim, Hispanic, Jewish, or LGTBQ+ communities who’ve been harassed, assaulted, or worse just for existing. Ask the single moms who work three jobs to ensure a better life for their children. And ask anyone struggling to navigate the byzantine complexities of modern health care. This is manufactured exhaustion. This project is for those people. America is hardly alone in these problems, but the irony of a country which has largely divested itself of real manufacturing together with Mandy Brown’s biting turn-of-phrase “manufactured exhaustion” and Dunkin’s longstanding tagline and you have a cracker of a condemnation of everything that’s wrong with just about everything. Who says America doesn’t manufacture anything anymore? Screenprinted one at a time by hand on Mohawk Superfine Ultrawhite 80C stock in three colors and across two editions (to-date). 82K Reach 11K+ Likes 3K Saves Polaroid 2 Editions Client Personal Role DesignPrintmakingCopywriting Country USA Languages English Year 2024 Format Ephemera Poster Print Sticker Processes Silkscreen Laser Cutting Product Design Copyright © Scott Boms. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Humane Previous → Simple Sabotage Field Manual"
author = "Designed and built Scott Boms."
year_published = 2024
