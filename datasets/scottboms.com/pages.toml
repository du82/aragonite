["https://scottboms.com/making/a-place-for-your-voice"]
title = "A Place for Your Voice | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "A Place for Your Voice The beginning of 2016 marked a new beginning for the Analog Lab with the launch of a new Designer in Residence program and an effort to reset expectations. This poster, a rare piece of marketing collateral for the Lab itself was an prompt to the community inside Facebook. The visual references the Lab as a platform — a place where individual voices can be elevated and multiplied, and the rainbow roll blend visualizes McLuhan’s concept of hot and cool media. McLuhan defined cool media as lower definition yet more participatory because they require audiences to fill in gaps and complete connections themselves, unlike to hot media which is inherently more passive. The metaphor further expresses the participatory nature of the techniques and processes used in the Analog Lab itself. Client Made while employed by Facebook, Inc. Role CopywritingPrintmaking Country USA Languages English Year 2016 Format Poster Processes Silkscreen Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Be the Nerd Previous → Unsung Heroes Poster Series"
