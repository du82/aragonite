description = "The World’s Best Typography: The Yearbook of the Type Directors Club of NY (published for the first…"
full_description = "TDC: Typography 44 By Type Directors Club The World’s Best Typography: The Yearbook of the Type Directors Club of NY (published for the first time 1980) is a bible of inspiration for typography practitioners and enthusiasts. Within its pages, top creatives as well as publishers and students can find role models, fresh trends, inspiring content and new sources of inspiration. Readers will be inspired by the intersection of craftsmanship and creation, of classical skills and trailblazing innovations. Here, trends are identified and set, as the around 750 illustrations, 263 awarding-winning designs from 39 countries and 46 new fonts presented clearly illustrate. Designers from all over the world compete to appear in the book. Previously divided into two competitions, one each for Communications Design and Typeface Design, the program is now a single competition consisting of three disciplines: Type Design, Typography and, for the first time, Lettering, which has its own jury. The Award for Typographic Excellence is the ticket to the best agencies in the world. The yearbook also reflects the latest typography trends, sets standards, is a collector’s item and distinguishes its owners as visual thought leaders. Published By Hoaki Publish Date 03/05/2024 Page Count 270 Format Paperback Type Book Process Offset Dimensions 8 x 11 in Language EN Filed Under DesignCritiqueAnnual ISBN 978-8419220523 Signed? No ← Next Flowers for Things I Don’t Know How to Say Previous → Drawn"
