["https://scottboms.com/documenting/a-passing-feeling"]
title = "A Passing Feeling | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "A Passing Feeling Tuesday, September 17, 2024 We often ignore little moments like this as we traverse the places we inhabit. But once in a while they catch our attention at just the right moment to access something within us that is the right thing at the right time. This is one of the quiet powers of art, design, and music — we just need to make enough of an effort to look up and around to experience it. Luckily, these things are patient and will wait for us to be open to them. I needed this today working through a bit of a fire drill that could absolutely have been avoided, especially during the moments when it feels like you’re spinning in circles. ← Next Meeting Your Heroes Previous → Phonocut"
