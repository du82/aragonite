full_description = "404 Magazine: Issue 4: Robots Write Bad Poetry By Andy Welfie In previous editions of this zine, we’ve delved into the unique intersection of UX writing and poetry, examining how the specialized, concise copy in our apps and websites transforms when re-contextualized as poetry. The rise of generative AI over the last year has revolutionized digital media creation (for better or worse). Large Language Models (LLMs) such as ChatGPT and Google Bard have transformed how writers craft convincing ad copy and informative emails. But how good is it at poetry? Turns out — not great? Published By Andy Welfie Publish Date 06/01/2024 Page Count 32 Format Paperback Type Periodical Process Digital Dimensions 4.125 x 5 in Language EN Filed Under ArtDesignComputer GraphicsEssay Signed? No ← Next Moonbound Previous → Observations: Year Two"
