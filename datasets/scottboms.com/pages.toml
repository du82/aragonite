["https://scottboms.com/making/practice-makes-perfect-zine"]
title = "Practice Makes Perfect Zine | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = 'Practice Makes Perfect Zine Capturing a decade of lettering practice In 2012 I dove headfirst into the world of traditional sign painting as a creative outlet and opportunity to learn a new skill. Over the course of ten+ years, I produced signs and murals along with hundreds of practice sheets of various lettering styles. These practice sheets were primarily a way to improve technique and track skill development and remained locked away in my archive for many years. In 2022, I had an idea for a small publication of abstracted lettering built from scans from these practice sheets and other related elements created for a few related projects over the years. https://scottboms.com/media/pages/making/practice-makes-perfect-zine/d8c5e4c000-1704255421/detail-practice-makes-perfect-8.jpg { "@context": "http://schema.org", "@type": "VideoObject", "name": "Practice Makes Perfect flip-through video animation", "description": "Practice Makes Perfect flip-through video animation", "thumbnailUrl": "https://scottboms.com/media/pages/making/practice-makes-perfect-zine/d8c5e4c000-1704255421/detail-practice-makes-perfect-8.jpg", "contentUrl": "https://scottboms.com/media/pages/making/practice-makes-perfect-zine/b02cb32de3-1704255421/detail-practice-makes-perfect-8.mp4", "uploadDate": "03/01/2024" } To add a unique element to the publication, repurpose practice sheets were cropped, layered, and included directly into books which fit naturally with the heavily overprinted layers of lettering featured throughout. And with the supply of practice sheets available, I was able to ensure each book was unique with no two including the same artwork. The books themselves were designed using French-folded pages, printed in five colors (Aqua, Sunflower, Light Teal, Bright Red, and Black), and assembled by hand using a stapled perfect-bound format and released in two very limited editions which each sold out almost immediately. One deluxe slipcase edition was produced with the remaining original painted sheets and is held in my personal archive. Client Personal Role Creative DirectionDesignIllustrationCopywritingPrintmakingProductionPhotography Country USA Languages English Year 2022 Format Book Book Cover Ephemera Illustration Lettering Packaging Zine Processes Risograph Painting Copyright © Scott Boms. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next TypeCon 2021: Together Previous → Hello, World'
