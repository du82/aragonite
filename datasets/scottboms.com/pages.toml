["https://scottboms.com/making/unsung-heroes-poster-series"]
title = "Unsung Heroes Poster Series | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Unsung Heroes Poster Series A poster series celebrating the enduring power of individuals This series, which came out of the very earliest days of our Designer in Residence program, began as a means of introducing portraiture, a new visual variable, into the existing body of original posters and prints that adorned the walls of then-Facebook. The candidates — both recognizable and lesser-known, were each selected to inspire the community through their unique societal contributions and to fulfill important diversity and representation objectives set as a core tenet of the series at the outset. Detail of the original screen print of Buffy St. Marie Detail of the original screen print of Elie Wiesel The didactic poster accompanying the series sums up the importance of these chosen few. It reads, “The truest of heros demonstrate extraordinary courage, conviction, and generosity in their beliefs, words, and actions, with no expectation of reward. The people honored in this series, recognizable and overlooked alike, represent those qualities through the last historical and social impact of their profound accomplishments. Our collective global cultures and histories are better for their efforts.” In 2019, while extending this substantial series, we took the opportunity to revisit it as a whole and methodically reworked the colorways, photography, and typography. The series was created and curated in collaboration with Bijan Berahimi, Drew Bennett, and Sun Helen Isdahl Kalvenes. Client Made while employed by Meta, Inc. Role Creative DirectionDesignCopywritingCurationPrintmakingTypography Country USA Languages English Year 2016–2019 Format Poster Installation Processes Silkscreen Offset Lithography In response to policy changes, two early designs featuring political figures have since been removed. Copyright © Meta, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next A Place for Your Voice Previous → Artist in Residence Season 3 Catalog"
