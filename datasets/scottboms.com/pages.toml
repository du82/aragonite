["https://scottboms.com/library/static-magic"]
title = "Static Magic | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Static Magic: Design Aesthetics of the American Security State By Paul Morgan Established in 1952, the National Security Agency conducts worldwide clandestine mass data collection for the U.S. Government. It began as a military unit to decipher coded communication in World War lI and grew to possess detailed information on billions of people worldwide, including U.S. citizens. Every year, the Agency monitors, collects, and processes trillions of signals between people and between machines. These data streams are frequently encrypted, requiring cryptological techniques to break. The process relies heavily on theoretical mathematics and computer science practices; this led the NSA to become the world’s largest employer of mathematicians and Maryland’s largest consumer of power. The agency also employees thousands of linguists, computer scientists, and engineers who all fall under the “Operations” division. In 1974, the Deputy Director of Operations announced the creation of an internal technical publication: Cryptolog. It would be “a new vehicle for the interchange of ideas on technical subjects.” An editor called it “a mix of technical, expository, philosophical, futuristic, argumentative and historical articles.” Published By Current Editions Publish Date 07/19/2024 Page Count 36 Format Paperback (Limited Edition) Type Zine Process Risograph Edition Size 240 Dimensions 6 x 9 in Language EN Filed Under DesignArtHistoryPolitics Signed? No ← Next Hold That Line! Previous → Unfolding Duplications"
