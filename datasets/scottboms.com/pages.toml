["https://scottboms.com/documenting/2023-by-the-numbers"]
title = "2023 By the Numbers | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "2023 By the Numbers Sunday, December 31, 2023 An inventory and notable recollections from the past year. Train 50 Office Days in SF1 Mask 0 COVID-19 cases2 Coffee 524 Coffees3 Tea 658 Cups of Tea4 Open Book 29 Books Read5 Bicycle 1375 Miles Biked6 Movie Player 62 Movies Watched7 Eye 8408 Riso Prints8 Code 1335 Site Project Commits9 Book 125 Library Additions10 Airplane 12 Trips Taken11 Walking 3.25M Steps Walked12 Checkmark 1 Magazine Subscriptions13 Scissors 13 Haircuts14 Polaroid 68 Polaroid Photos15 VR 0 VR Meetings16 Article 141 Notebook Entries17 Link 1125 Links Shared18 Photo 3 Instagram Posts19 Star 2 Kickstarters Backed20 Group of People 1 Unions Joined21 Match 3 Sold out Editions22 Computer Display 2 New Computers23 Cursor 2 Fonts in Development24 To describe this past year as full of surprises might be the understatement to end all understatements. It was its own particular mixed bag, at least metaphorically speaking. Work things started out rough, then got weird, then got really weird, then kind of leveled out, and now feel pretty good all things considered. Big Changes and Notable Events The biggest change was the not-unexpected (frankly, welcome at that point) layoffs at Meta which disbanded the last remnants of the Analog Research Lab/Open Arts team and the program all-but-shuttered. The first several months of the year were brutal and chaotic as we flip-flopped daily and sometimes hourly with whether we might survive through the announced layoff events. At a certain point it seemed clear from the work we were forced to do that the future was bleak. The saddest part was to see the program that we poured so much into go out with a whimper. On the positive side, the layoff timing was perfect for a well-earned summer break. And although I wasn’t really looking to dive into something new immediately, as luck would have it, an exciting opportunity landed and has kept me engaged, challenged, and learning since mid-August. It’s nice to be designing for something audacious, with a incredibly talented and humble group, and to not be bothered with internal politics. Hopefully (NDA permitting) I’ll be able to share more eventually. Of course I’d be remiss to not mention I Take Full Responsibility which carried me through that chaos. I tend to have modest expectations for personal projects but this exceeded them all with 3 editions selling out surprisingly quickly. I’ve started on a wildly different new edition. I could make this easy on myself but I tend to dislike repeating ideas unless there’s a new, unexpected, and creative approach to breathe new life into it. Stay tuned. These important artifacts will continue until morale improves or we’ve jettisonned all these billionaire CEOs into the sun. Musical Highlights I was thinking I might split music off into its own thing, but I’m feeling a little lazy about it so this is a condensed note on a few favorite albums of the year. All Over Favorite: i/o from Peter Gabriel which hit #1 in the UK upon its full release on December 1st after 12 months of individual track releases timed with the full moon. Bandcamp subscribers received mid-month bonus versions of each track along with other special content digging into the writing and recording of each. It’s easily his best work in many years and hits every important note in what I look for in music. Return to Form: Cousin from Wilco. I’ve enjoyed front-to-back thoroughly since its release. Cate le Bon brought back some of the edge that has felt like it’s been missing from the last couple albums in terms of the band performances. Biggest Surprise: Dolenz Sings R.E.M. EP from Micky Dolenz of The Monkeys. Did not see this coming and it’s quite delightfully full of out of left field choices in the songs and the individual performances themselves. Rediscovered Track: We watched the Tom Hanks film A Man Called Otto, which features Kate Bush’s This Woman's Work which deliveres the perfect gut punch for that climactic moment in the film. It’s also a perfect showcase of her unusual song structures and brilliantly unique voice. No, you’re crying! Other notable releases that spent a lot of time in my listening rotation this year were Hannah Georgas’ low-fi personal I'd Be Lying If I Said I Didn't Care (★★★★☆), Laugh Track (★★★★☆) and The First Two Pages of Frankenstein (★★★★☆) from The National, Feist’s sublime Multitudes (★★★★★), Roger Waters’ enigmatic reimagining of the classic The Dark Side of the Moon (★★★★☆), the new anniversary edition of The Tragically Hip’s Phantom Power (★★★★★) (especially the excellent live 1998 show from Metropol with singer Gord Downie in full Gord mode), the record (★★★★★) and the rest EP (★★★★★) from boygenius who also get props for easily the best musical performance this season on SNL, former Ben Folds Five drummer Darren Jessee’s latest outing Central Bridge (★★★★★) that cements how great a songwriter he is, and local Toronto indie hero Hayden’s Are We Good (★★★★☆). Notes on Notable Type I dug through the 49 weekly Through Line > Notable Type Release issues and analyzed the data to pick out a few notable details to summarize. It’ll be interesting to compare these stats next year to see if any trends emerge. 306 noted typeface releases from 175 unique individuals or named foundries. Of those, 243 were by male designers, 49 from female designers, 11 from mixed gender teams, and 3 unknown or where I wasn’t able to easily determine the specific creator. 87 OpenType variable font format releases compared to 219 non-variable releases. An average of 6 notable releases per week — the highest had 10 and the lowest, just 2. The vast majority of releases were from indie foundries rather than Monotype-owned properties. 46 of the releases (almost a 1/6th) were from Future Fonts which maybe says something about where the most unique and original work is happening. Looking Forward The success of the book also has me thinking more about how I might facilite an open studio here in the South Bay where nothing like that exists currently. I have a bunch of ideas and conversations with Greg and Luke are slowly yielding clarity for what could come of that. I’m going into 2024 with an open mind. I don’t really know how things are going to play out but I’m taking quiet steps to keep the boat afloat. The American healthcare system is the one thing that weighs on my mind more than anything given that we’ll be footing that bill ourselves starting at the end of January. Can’t say I’m looking forward to that particular thing, but otherwise things feel in pretty good shape. Wishing you ★★★★★ for the year ahead. Footnotes This was previously tracking remote working days but a lot changed in 2023 that it made more sense to change this to reflect the new gig which had me traveling to SF a few days a week. ↩ The correct number of cases every year. ↩ My coffee game got an upgrade with the introduction of a Gaggia Classic espresso machine — a game changer and definitely influenced an increase in consumption of 1.28% compared to previous years alongside a great new indie coffee shop opening in our little town. ↩ Conversely, my tea consumption went down a bit. ↩ Much more time outside on my bike meant less stationary bike multitasking and so I missed my target of reading 35 books this year. A good trade off honestly. ↩ I was outdoors on my bike 4.66x more this past year than 2023 (87 days outdoors, 111 days on the stationary bike) which has felt like a solid achievement. Getting out a few times in December was the real icing on the cake. Number of crashes: zero. Number of flat tires: definitely more than I would like. ↩ Quite a drop from last year which is interesting to me but likely due to the lengthy strikes in Hollywood and the delayed releases of films I might otherwise have seen. ↩ A modest increase in Riso prints for the year (8,404 in 2023 vs 5,442 in 2022). I got in my own way a bit in not producing more but I was trying to balance avoiding unnecessary waste, the increased cost of paper, and maybe a little bit of hesitation that a few things I’ve been working on being fully resolved. ↩ This number only represents commits to this site and not other projects I’ve been concurrently working on, but I’m ending the year in a very similar place from 2023 at about 98% of the commits comparatively. Which maybe just goes to show that I’ve been tinkering with things behind the scenes all along. ↩ Apparently I spent some time this year filling out the Library, going from 377 to 502 complete books which is over a 5x increase in the number added compared to last year. I didn’t buy that many new books but my focus lately has been backfilling the zine collection. ↩ 12 notable trips feels like a lot in an otherwise quiet year. I should note that 4 of those were to the Seattle-area (two for work, two personal) but two big trips south to Cabo, Mexico and then Costa Rica really made for some fun memories seeing new parts of the world with my family. ↩ It’s interesting to me that I seem to have walked almost an identical amount of steps this year and last which maybe means I’m a creature of habit and routine (true). ↩ Pressing Matters is still holding strong but I’ve been making more of an effort to keep subscriptions under control as everything seems to be turning into a subscription and it’s frankly ridiculous. I let my monthly Riso Club subscription lapse though that may have been accidental and I just rolled with it. I kind of miss that one. ↩ Somehow I’ve managed to double the number of haircuts I’ve had compared to last year — and all were with the same barber locally in San Carlos. ↩ I’m not sure I tracked this properly or wasn’t counting integral Polaroid shots alongside pack film photos. I suspect some general uncertainty this year played a role in shooting less film though. ↩ Like COVID cases, this is the correct number. Glad to not even have to think about this nonsense anymore. Hopefully never again. ↩ Publishing here picked up a bit with approximately 1.17x posts compared to 2023. I’m a bit surprised this wasn’t higher to be honest and I’m curious to know how this will work out next year. I’ve increasingly dug in my heels on owning my content and losing interest in social media services (except for Mastodon). ↩ In terms of the weekly Through Line posts, these included about 25% more links than 2023. I don’t have a split of whether this was influenced more by Type releases or other things but that might be interesting to look at. ↩ Instagram usage continued to plummet this year landing at less than 50% of what I posted in 2023. At this rate, I expect 2024 to be a big fat zero which I am totally ok with. ↩ Only 2 Kickstarters backed in 2023, but both delivered on their promises quickly which is always a nice surprise. I’m down to one outstanding project from 2022 which is behind schedule but still progressing and I expect will deliver before the middle of 2024. ↩ In November I joined The American Colored Printers Association. It’s a union I suppose more in vibe than anything but I’m counting it because it’s important and I’m proud to be a dues-paying member. ↩ I’m filing this under one of the more rewarding things of 2023 because these projects were all self-initiated and very much pieces of my voice coming through in work I made. There will be more of this in 2024. ↩ I haven’t bought a new computer for myself in 12 years so it feels worth capturing that I got myself not just a new M3 MacBook Pro but also (thanks to Luke) switched up the home iMac to a newer model than the aging 2011 one that we dragged from Canada so many years ago. ↩ I’d really love to finish the long-gestating typeface currently known as Eclectric Fence in 2024 because that would be something. I have a second idea sitting in the backlog that would be a real bonus to get started if not finish. ↩ ← Next An Important Public Service Reminder Previous → Terra Incognita"
