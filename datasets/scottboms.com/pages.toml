["https://scottboms.com/documenting/2022-by-the-numbers"]
title = "2022 by the Numbers | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "2022 by the Numbers Sunday, January 1, 2023 I might describe two thousand and twenty-two as like being piñata: we all kept hitting it hoping something good would fall out, but instead finding the contents to be the most mixed of metaphorical bags. I found myself splitting time between home and the “office” (whatever that is anymore), traveling more than I might have expected at the outset of the year, and things kind-of starting to feel normal again. The end of the year feels as topsy-turvy as the start, but also perhaps opened the door to a particular reset that I’ve only dreamt about. There was also plenty of reading, writing, tv, movies, bike riding, Riso print making, walks with Maple, family dinners, basketball practices and games — and yet more COVID booster shots too. Despite having to fully re-integrate time in-office back into routines, I’ve continued to pursue a healthier balance of work/life throughout which ultimately may be the great achievement of the year. Home 164 Days at home Mask 1 COVID-19 cases1 Book 23 Books Added2 Open Book 36 Books read3 Coffee 400 Coffees Tea 761 Cups of tea4 Movie Player 75 Movies watched5 Eye 5442 Riso prints6 Git Merge 1304 git project commits7 Bicycle 293 Miles biked8 Person Walking 7.7 Miles run9 Walking 3.25M Steps10 Open Book 2 Magazine subscriptions11 Scissors 6 Haircuts Polaroid 525 Polaroid photos12 VR 5 VR meetings13 Article 119 Notebook entries 891 Links shared14 Instagram 7 Instagram posts15 Star 2 Kickstarters backed Footnotes COVID finally got me in November 2022. Thankfully it was a fairly mild case all things considered. ↩ I slowed down adding books to the Design Library this year to instead focus on back-end things that I wanted to get to a better place such as the first version of detail views. ↩ I officially beat my Goodreads challenge of 35 books in 2022 by just 1, but the truth is I also re-read a few books throughout the year that I didn’t include in that list. ↩ My tea consumption was down 11% compared to 2021. I suspect this is at least partly related to travel. ↩ I watched considerably more movies this past year than in 2021 — 32% more to be exact. I definitely went to the actual theatre more times this year. I saw The Batman twice, but the highlights of the year were the bizarre Brian and Charles and of course Everything Everywhere All at Once. ↩ Apparently I produced fewer Riso prints this year than in 2021, but that might also be related to the work I did to tune up the machine so I was producing less waste in the process. ↩ Commits to the git repo for this site were up over 440% from the previous year. Yowza. ↩ I was biking outdoors considerably less this year — only 62% of the previous years’ total miles, but made up for that by more than 2.5 times the amount spent on my bike in stationary mode. ↩ My knees and ankles were not so keen on running, so this fell by the wayside early in the year. Total miles run is only 2% of my 2021 total distance of 371. I’m ok with this. ↩ I walked about 10% more compared to 2021 with around 270,000 additional steps. Having places to go like the office and traveling are the likely contributors to the increase. ↩ I’ve cut back on magazine subscriptions as I’ve just not had the time to read them, though I’ve kept Pressing Matters and Communication Arts. The latter is now a digital-only subscription though. ↩ This over 400% increase of was definitely tied to the Hello, World project I completed this year despite the majority of those Polaroids not making the actual cut in the final work itself. ↩ A minor increase. My feelings about VR meetings hasn’t changed: they still suck donkey balls. ↩ A decent uptick of 166% compared to 2021. I attribute this to two main things: an intentional aim to host my own content, and also from starting to highlight some of my favorite new type releases throughout the year. ↩ Per the above, my use of Instagram as a sharing platform shrank further — 7 posts compared to 24 in the main feed over the course of the year. Might end up with zero in 2023 at this rate. ↩ ← Next Through Lines 141 Previous → A Visit to Gehry Partners"
