title = "Bits and Hexes | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Bits and Hexes Sunday, February 23, 2025 I’ve been on a bit of a kick of late making a series of prints of classic Mac iconography for no other reason than it’s a fun distraction from heavier and more slow moving projects. There’s no master plan and these will likely go out as freebies accompanying orders from the ‘ol shop. Part of the fun is just plumbing the depths of my memory of those icons themselves. These go from fun to frustrating in some cases once it’s time to put ink on paper, at least with the Riso. A couple colors is no big deal but once you start getting upwards of 3 or 4 colors, there’s a lot that can go wrong in terms of registration. For the most part, this 5-color ResEdit print turned out kind of ok. Footnotes To date, I’ve produced prints for The Grouch, ResEdit, and Clarus, the dogcow (“moof”). I have a couple more in mind but we’ll see if and when I might spend some time on those. ← Next Where our Destination Lies Previous → Through Lines 246"
