full_description = "An Inventory of Inventories Zine Lists are infinitely useful in daily life. They keep track of groceries, the movies you want to see or have seen, the names of your friends, your last haircut, the things you need to do each day, or maybe even things like your favorite fonts or records, or what to pack for your next trip. An Inventory of Inventories is a collection of visualized lists made during a sabbatical in 2019. It was printed on a Risograph ME 9450 nicknamed Rex in 7 glorious colors and hand-folded and assembled in an edition of 30. Client Personal Role IllustrationPhotographyCopywritingPrintmakingCreative DirectionDesignTypography Country United States Languages English Year 2019 Format Zine Processes Risograph Copyright © Scott Boms. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Analog Research Lab Previous → Women in Research Posters"
