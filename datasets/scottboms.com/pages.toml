["https://scottboms.com/library/hold-that-line"]
title = "Hold That Line! | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Hold That Line!: Class Stuggle in the Waterforn Worker By Jessalyn Aaland From December 1932 to April 1936, a mimeographed newsletter circulated the San Francisco waterfront. Published by anonymous longshore workers, The Waterfront Worker championed labor rights, cross-sector unionism, and global antifascism, while condemning capitalist greed, police, and scabs. Addressing the daily issues longshore workers faced in what scholar Howard Kimeldorf deemed “colorful waterfront vernacular,” each edition featured many illustrations. These humorous drawings often took a harsh tone, directly calling out bosses and other scoundrels by name. A key stylistic approach involved labeling illustration subjects like scientific diagrams. The paper played a crucial role in fostering industrial unionism in the United States. From May to July 1934, longshore workers across West Coast ports united in the West Coast waterfront strike. Tensions peaked on July 5 in San Francisco when police attacked strikers, fatally shooting two men. This sparked a general strike throughout the city. The Waterfront Worker reported these events from the perspective of ordinary union members (the “rank-and-file”), showcasing their resilience and solidarity. Published By Current Editions Publish Date 07/19/2024 Page Count 48 Format Paperback (Limited Edition) Type Zine Process Risograph Edition Size 250 Dimensions 5.25 x 8 in Language EN Filed Under ArtHistoryCritique Signed? No ← Next Inside NeXT Previous → Static Magic"
