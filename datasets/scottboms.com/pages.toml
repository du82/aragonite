["https://scottboms.com/documenting/a-model-of-reality"]
title = "A Model of Reality | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Thursday, August 29, 2024 Too often we are blinded into believing that our models are the whole reality, forgetting that they are simply useful fact/fantasy coping devices. Gordon Mackenzie I re-read Gordon MacKenzie’s brilliant Orbiting the Giant Hairball at least once a year. It’s long been a great source of strategies for surviving the world as a creative person — and I suppose also modern capitalism in general. The chapter this quote originates from breaks down two conceptual organizational models — what MacKenzie refers to as The Pyramid and the Plum Tree. You definitely know the pyramid model, but I won’t spoil his brilliant pages that outline the other — do yourself a great favor and read the book. But it’s this idea, and frankly many others, that consistently pop into my mind as I see organizations fumble about, wastefully burning through people like kindling, and otherwise suck the creative life out of them rather than fueling their creative fires that would ultimately benefit both parties. It’s such a shame, because we wouldn’t need so many coping mechanisms if this lack of real imagination could be easily overcome. The existing model isn’t the only one, but it is a prison if you don’t consider that there are other possibilities. Footnotes MacKenzie, Gordon. Orbiting the Giant Hairball: A Corporate Fool's Guide to Surviving with Grace. Viking, 1998, p 163. ISBN: 978-0670879830 ← Next The Art of Letting Go Previous → Mind Your Ps and Qs"
