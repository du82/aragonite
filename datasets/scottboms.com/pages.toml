full_description = "Ethos 101 Ongoing thoughts on design, creativity, and technology. Subscribe for updates Subscribing via RSS Time can only be spent once. Nuance — not novelty, is the escape ladder from a rut. Reconsideration takes courage at the expense of comfort. You can’t stop the future, but you can change it. Emotion often counts for more than metrics. Solve et coagula. Impossible can be an obstacle or a match. One day a single grain, and the next — a beach. Paying attention means you’ll be prepared. Credibility in the future means including something from the past. The tinniest details may weigh the most. Only your nose knows. Next ← 2 of 9 Previous → Load the next 12 entries…"
