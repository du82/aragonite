full_description = "Climate Change Will Determine Not What is Right but What is Left There is no single more critical issue at hand than climate change. It demands to be the center of our attention. As scientists around the globe have declared — if we as a global community behave as though it’s business as usual and continue down the same paths we have for far too long, we’re doomed. This print picks up where Herb Lubalin left off. Today, rather than war, it’s climate change which has the greatest potential to obliterate our planet, and us. Client Made while employed by Facebook, Inc. Role CopywritingPrintmakingCreative DirectionDesign Country United States Languages English Year 2020 Format Poster Illustration Print Processes Risograph Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Facebook Design Lecture Series Previous → Analog Research Lab"
