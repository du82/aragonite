["https://scottboms.com/about"]
title = "About | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "About Me A multidisciplinary creative director, printmaker, and design and technology generalist originally from Toronto, Canada. Photo in front of a large wall of wood type blocks at the Hamilton Wood Type Museum by Angelina Lippert. I make things as a way of provoking questions, identifying problems, understanding ideas, and making connections that are not always obvious. Driven by a deep curiosity about the world and how things work, my primarily goal is always to empathize with others and encourage positive outcomes for all. In all things I value thoughtfulness, care, and craft. I believe that quality always wins over quantity and that there is such a thing as enough. Whether taking the form of physical or digital artifacts or experiences, my aim is to encapsulate everything I make with these values while reminding people of the outsize effects of technology and the inherent responsibility that impact carries. My work has been presented internationally at the Hammer Museum in LA, the London Design Museum, Designmuseo, Helsinki, Design Museum Den Bosch, the Type Directors Club in New York, and has appeared in HOW, Mohawk’s Maker Quarterly, Fast Co, Wired, Offscreen, Tech Crunch, Inc, and Ad Week among other publications. I also appear in and assisted in the production of the documentary film An Impossible Project which premiered in Rotterdam in early 2020. I’ve authored and produced numerous books — most recently, a quickly sold-out first edition of the Simple Sabotage Field Manual, A Stone's Throw, 10 Rules for Teachers and Students, and 3 sold-out editions of I Take Full Responsibility — and many more. New projects are conceived and published through Risolute Press, a self-directed publishing imprint. I periodically speak about design, printmaking, the value of analog process, and communications theory to educational and professional audiences worldwide. I enjoy making friends with creative folks all over the world and have had the pleasure of creating work with and for with organizations of all sizes, including: Humane.cls-1, .cls-2 {stroke-width: 0px;} .cls-2 {fill-rule: evenodd;} Meta Society of Typographic Aficionados Gingko Press Supersense Adobe PayPal Masterfile HSBC The McLuhan Institute Coca-Cola General Mills Sabre BlogTO P.S. In case you were wondering, it’s pronounced “B-ohm-s” — like “Homes.” Download my CV 48 kb PDF"
