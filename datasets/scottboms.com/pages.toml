full_description = "Fracture: Japanese Graphic Design 1875‑1975 By Ian Lynam and Edited by Louise Rouse, Chris Palmieri Fracture: Japanese Graphic Design 1875–1975 is an engaging and visually stunning exploration of a century of Japanese graphic design history. Written by esteemed designer, educator, and historian Ian Lynam, the book delves into the evolution of Japan’s graphic arts from the late 19th century to the dawn of the digital era, offering a unique perspective on the cultural and artistic transformations that shaped modern Japan. Through a series of insightful essays, Fracture examines the intersection of graphic design with key cultural and historical themes, including modernity, imperialism, gender, commercialism, sexuality, and aesthetics. Lynam expertly contextualizes the role of graphic design in reflecting and influencing the profound shifts Japan experienced after re-opening to the West. Lavishly illustrated and deeply informative, Fracture invites readers to appreciate the artistry and complexity of Japanese graphic design, making it an essential resource for designers, historians, and anyone fascinated by Japan’s dynamic visual culture. Published By Set Margins Publish Date 10/25/2024 Page Count 447 Format Hardcover Type Book Process Offset Dimensions 190 x 260 mm Language EN Filed Under DesignEssayArt ISBN 978-9083449845 Signed? No ← Next Imperfect Index Vol. 1 Previous → Pressing Matters: Issue 28"
