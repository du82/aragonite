["https://scottboms.com/library/drawn"]
title = "Drawn | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Drawn By Craig Frazier Drawn is a compendium of Frazier’s illustrations for the most prominent publications and businesses in America and abroad. The book presents over 405 illustrations and sketches curated from a career spanning over 40 years. Respected by design peers and leaders in business, Frazier’s illustrations connect two often disparate audiences with wit, metaphor and unabashed simplicity. Incorporated are several essays by Frazier on his upbringing and love of drawing, the transition from designer to illustrator, the computer, the business of illustrating, and myriad stories of how — and why — he makes the work that he makes. Through essays and illustration, Drawn shows Frazier’s career of work as a designer then an illustrator. He reveals in personal detail the principles and underpinnings of that work. Frazier talks about the business of illustration and his early plan he had to secure the right clientele and the style that he was formulating. He describes his commitment to create conceptual illustrations that are embedded with visual riddles, incongruities and wit designed to intrigue the reader — the style he is recognized for. Drawn is a deeply personal journey through Frazier’s creative career. His candor in word and work is equally inspiring and entertaining. Published By Goff Books Publish Date 01/30/2024 Page Count 276 Format Hardcover Type Book Process Offset Dimensions 8 x 10.6 in Language EN Filed Under DesignArtMonograph ISBN 978-1957183916 Signed? No ← Next TDC: Typography 44 Previous → Pressing Matters: Issue 25"
