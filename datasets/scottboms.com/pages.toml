["https://scottboms.com/making/facebook-global-signage-system"]
title = "Facebook Global Signage System | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Facebook Global Signage System Throughout the development of Facebook’s Building 20, designed by renowned architect Frank Gehry, and afterwards, I worked closely with the Facebook facilities team, Gehry Partners, and other partners to develop and extend what has become a comprehensive signage and wayfinding system covering more than 80 offices around the globe and millions of square feet of workspace. Wayfinding map Outside Building 10 in Menlo Park, California. The signage system was designed to be a natural continuation of real-world signage and to utilize existing recognizable visual cues and language to assist recognition and comprehension. One core element of the system is the iconography that is used throughout which aims to be recognizable and clear whether used with or without accompanying labels. Guidance and applications of this system have been documented in a regularly updated 200+ page guide that meticulously documents the breadth and depth of the overall system and illustrates how to apply it to new buildings or when retrofitting existing ones. Client Made while employed by Facebook, Inc. Role DesignIllustrationIconographyTypographyCopywriting Country USA Languages English Year 2015–2020 Format Illustration Sign Processes Digital Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next How Real is a Digital Future? Previous → Able Allowed Should"
