["https://scottboms.com/making/eric-mcluhan-double-book-launch"]
title = "Eric McLuhan Double Book Launch | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Eric McLuhan Double Book Launch This poster was designed to announce the launch of not one, but two new books from Eric McLuhan, the eldest son of renowned professor and media theorist, Marshall McLuhan. A brilliant author in his own right, Eric continued his father’s work on topics such as perception, the influence of technology, and media ecology. This poster aims to depict layers and constructs as metaphors for the ways media influence us and ultimately define the environments in and through which we experience them. It was screen printed by hand in an edition of 50 along with a series of companion Risograph prints for the event in Toronto at the (now former) McLuhan Center on the University of Toronto campus where McLuhan taught throughout the 1960s and ’70s. Client Eric McLuhan Role CopywritingPrintmakingCreative DirectionDesignTypography Country Canada Languages English Year 2015 Format Poster Print Processes Silkscreen Risograph Copyright © Eric McLuhan. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Museum of Reincarnated Technology Previous → Why Aren’t We Talking About…"
