["https://scottboms.com/house-rules"]
title = "House Rules | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "HouseRules These house rules express the core principles guiding this site. I’m firmly in the camp of people who believe a personal website is like a garden — a thing that needs attention and care to become what it’s meant to be. That belief aligns closely with deep-seated rules and behaviors I hold myself to — be respectful and kind, aim to be useful, encourage curiosity and play, share the things that interest you, and ultimately create things that are good. Content presented on this site represent threads that connect topics and ideas I find interesting or that may be on my mind at the time of writing. These tend to broadly cross between design, printingmaking, art, technology — and the process behind, and the cultural impact of each of these things.There’s no hidden agenda to any of it. My cards are plainly on the table. The opinions shared here are my own and do not necessarily reflect views shared by clients or my employer. Nevertheless I endeavor to be respectful towards them as can be reasonably expected.This is called covering your butt. Criticism is meant as a tool to open conversations, not shut them down and undertaken with the utmost care and sensitivity. I may take exceptions when it comes to obvious trolls, tech broligarchs, and Nazis.Any such criticism is fundamentally about pattern recognition and I remain as-ever, open to have my mind changed. There are corners of the internet that now are persona non grata. All attempts going forward will be made to explicitly avoid linking to content from services owned or operated by Mark Zuckerberg, Elon Musk, Jeff Bezos, and other tech broligarchs. Those guys can get f@&ked.Links to properties owned by said tech bros have been banished. A minimal number of links to Substack newsletters are still present while I figure out what to do about them. Similarly, AI content scraping bots are unwelcome here. Efforts have been made to prevent them from accessing the site using robots.txt and htaccess rules at the server level.The list of these bots is updated regularly to keep up with new ones as they are identified. I reserve the right and discretion to edit, update, or remove content over time. It will primarily be used to make corrections rather than undo or hide mistakes. Noteworthy changes will be responsibly annotated when possible.See below regarding the open acknowledgment of mistakes. All third-party content shared on this site will be handled in such ways to ensure reasonable privacy protections for visitors. The use of software such as 1Blocker or Ghostery is still recommended.This means preventing tracking via third-party cookies and similar protections. This site will remain free of web analytics, tracking, and reporting software. Server logs are scrubbed periodically and only used in the resolution of reliability issues or resolving technical errors.I’m not interested in collecting data about visitors because your business is just that — yours. There is not nor will there ever be third-party advertising or sponsorships of any kind allowed. Products or services mentioned are either of personal interest or based on real hands-on experience. Endorsement is not implied.Feel free to enjoy all the ads you want elsewhere. You won’t find them here. To err is to be human and I may get things wrong at times. Errors will be acknowledged with humility.I do my best to assume good intent and hope the same will be shared in return. Provided they adhere to the over-arching principles herein, additional rules may be adopted and existing rules may be thoughtfully amended over time.Look, things change and I reserve the right to change my mind about how I run my own site. But any notable changes will be handled with care, integrity, and transparency. These notes serve to annotate changes and provide additional context. These House Rules are currently a work-in-progress. First version released on 01/26/2025."
author = "Designed and built Scott Boms."
year_published = 2025
clearnet = "https://scottboms.com/house-rules"
