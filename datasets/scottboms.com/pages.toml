["https://scottboms.com/making/mcluhan-estate"]
title = "The Estate of Marshall McLuhan | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "The Estate of Marshall McLuhan 2011 marked the centenary of the birth of media theorist Marshall McLuhan. In 2010, the McLuhan Estate worked with the studio of famed designer Milton Glaser to create a mark which would become the anchor for planned activities around the centennial and as an identifier for new editions of some of McLuhan’s most important books. Detail from the Estate logo usage guide. The first official digital editions of McLuhan’s most important book, Understanding Media. Unofficial addition to the Know Canada campaign. I worked with the McLuhan Estate in taking a new logo mark designed by Milton Glaser’s studio and handling optimizations for on-screen use, refining and developing usage guidelines for practical uses such as across print and online media, and developing early concepts for a redesign of the Estate’s website. During this period I also worked with the Estate’s publisher of record, Gingko Press to create the first official digital edition of McLuhan’s 1964 masterpiece Understanding Media: The Extensions of Man which was made available in ePub and .mobi formats. Client The Estate of Marshall McLuhan Role DesignProgrammingTypographyCopywriting Country Canada Languages English Year 2010–2015 Format Book Letterhead Stationery Processes Digital Risograph Copyright © The Estate of Marshall McLuhan. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next George EP Previous → Typographic Anatomy Lesson Plan"
