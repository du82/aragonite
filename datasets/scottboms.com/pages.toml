["https://scottboms.com/library/flowers-for-things-i-dont-know-how-to-say"]
title = "Flowers for Things I Don't Know How to Say | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Flowers for Things I Don't Know How to Say By Tucker Nichols When it’s the most difficult to find the right words, we turn to flowers to express our compassion and care. This book is like a bouquet of flowers in book form. Based on Tucker Nichols’s celebrated multimedia art project entitled Flowers for Sick People, this book gathers vibrant floral paintings and pairs them with poetic dedications that pay tribute to a kaleidoscope of human experiences, from acts of unsung heroism to mundane moments of everyday beauty: “Flowers for Anyone Currently Eating a Cinnamon Bun in a Hospital Cafeteria,” “Flowers for the Last Time You Laughed So Hard It Hurt,” “Flowers for Spectacular Failures,” and more. Deeply relatable and equal parts heart-wrenching and humorous, this book is a comfort and encouragement in any moment and a salve for the loneliness that can come in life’s toughest times. Published By Chronicle Books Publish Date 03/19/2024 Page Count 176 Format Hardcover Type Book Process Offset Dimensions 6.3 x 8.3 in Language EN Filed Under ArtBibliography ISBN 978-1797228945 Signed? Yes ← Next Pressing Matters: Issue 26 Previous → TDC: Typography 44"
