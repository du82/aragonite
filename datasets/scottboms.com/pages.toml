["https://scottboms.com/making/bring-the-world-closer-together"]
title = "Bring the World Closer Together | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Bring the World Closer Together The world has never been more closely together than it is today. The question then becomes: is that a good thing — and has it led to a greater understanding of each other? This poster was designed to bring the announcement of a newly redefined company mission to employees and express the global scale of those ambitions. The change was a notable moment within the company. Depicting the message in the form of a newspaper felt right, and digs deep into company lore, especially as it appears in repeat — a metaphor for the multiplier effect of a news feed. The design also includes a nod to another poster, again referencing the supercontinent pangaea printed using a clear varnish. Client Made while employed by Facebook, Inc. Role IllustrationCopywritingPrintmakingCreative DirectionDesignTypography Country USA Languages English Year 2017 Format Poster Processes Silkscreen Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next The Beacon Project Previous → Good Design Is"
