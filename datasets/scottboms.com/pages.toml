["https://scottboms.com/making/being-hear"]
title = "Being Hear | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = 'Being Hear A book about being present and listening Being Hear charts a multi-sensory visual exploration of what it means to be present and our ability to listen to each other and the world in modern technological times. It was conceived as a response to observed behaviors and the effects of social networks. The book aims to encourage readers to slow down, focus, and be more aware of the world and people around them as well as their own behavior and ability to listen to understand — not just to respond. https://scottboms.com/media/pages/making/being-hear/de51c7144f-1716940991/detail-being-hear-book-tour-opener-poster.jpg { "@context": "http://schema.org", "@type": "VideoObject", "name": "Being Hear book tour opening animation", "description": "Being Hear book tour opening animation", "thumbnailUrl": "https://scottboms.com/media/pages/making/being-hear/de51c7144f-1716940991/detail-being-hear-book-tour-opener-poster.jpg", "contentUrl": "https://scottboms.com/media/pages/making/being-hear/442b5f376e-1716940828/detail-being-hear-book-tour-opener.mp4", "uploadDate": "29/05/2024" } The book exists in two distinct editions — an internal Facebook-only edition of 3000, and a version available exclusively via the Design Museum in London. Being Hear also took form as a collection of silkscreen posters featuring key art from Fuchsia MacAree and became a vehicle to bring its topics to Facebook offices around the globe in the form of an exciting and intimate 9-city book release tour. Along with a special set of posters featuring Fuchsia MacAree’s illustrations, the book is available for purchase from the Design Museum in London with all sales supporting their youth-oriented design programming. Client Made while employed by Facebook, Inc. Role IllustrationCopywritingCuration Country United States Languages English Year 2018 Format Book Poster Print Ephemera Processes Offset Lithography Silkscreen Copyright © Facebook, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next Time’s Up Previous → Principles'
