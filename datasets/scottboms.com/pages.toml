["https://scottboms.com/documenting/12-good-ones"]
title = "12 Good Ones | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "12 Good Ones Thursday, January 2, 2025 Although 2024 mostly felt like a year of holding strong on familiar musical favorites with only a few notable new-to-me artists (at least ones that had new releases during the year), these twelve tracks — and their accompanying albums probably best sum up the previous 365 days for me. In Front of Me Now — Nada Surf. This early single from Moon Mirror has been on high rotation all year and really encapsulates ideas that have been on my mind, something that Matthew Caws seems unusually good at doing with each Nada Surf album. It sounded great live too. Joan in the Garden — The Decemberists. A meandering 20+ minute Pink Floyd-esque epic full of basically everything that draws me in to songs — great musicianship, strong lyrics, and interesting song structures. A strong finish for their latest album. Scattered — David Gilmour. It was a bit tricky to pick one song from this album because there’s a lot of them, but this one gets the pick for some solid guitar soloing and lyrics — A man stands in a river, pushes against the stream, time is a tide that disobeys, that disobeys me. It might be because I’m on the cusp of turning 50 that a line like that hits home so deeply. Waiting for Stevie — Pearl Jam. This track kicks right into full gear out of the gate almost immediately and holds strong throughout. A tight, almost militaristic, syncopated-feeling Matt Cameron drumming track that I suspect would be a ton of fun to improvise over. Crawling Back to You — Kathleen Edwards. I’ve never been a huge Tom Petty fan, but other people’s covers are a good path to appreciation in my experience and Kathleen’s version is no exception. I’m glad she played this when I saw her in November and made me appreciate it all the more. Wild God — Nick Cave and the Bad Seeds. I’m a late bloomer when it comes to Nick Cave, but this album has me sold. Wild God is just one of several standout tracks. Watching the short making-of film added another level of enjoyment to this album — the studio where this was recorded is nuts. Knife Fight — Elbow. “I woke up thinking about the knife fight…” is a great first line to a song. This slow dirge of a track has that low-key The National groove where there’s not a lot of highs or lows musically but is easy to lock into rhythmically. Alone — the Cure. I love a good plodding Cure track and Alone and the other seven tracks on Songs for a Lost World do not disappoint in that regard. Sad, mopey Robert Smith is the best Robert Smith. Confront It — Caroline Spence. A standalone single from an artist who caught me by surprise with a previous duet with Matt from The National. Solid pop structure and strong melodies and lyrical themes make this one stand out. Say You Love Me — Wilco. This particular track stands out as a perfect pop gem that could easily have been on the band’s last full release Cousin. It encapsulates all the things I love about Wilco — good, often surprising lyrics, interesting melodic structures, and great all-around musicianship. Broken Man — St. Vincent. Strong early Nine Inch Nails vibes all throughout this track and album. Bonus points for a lot of distorted fuzz guitar and Dave Grohl on drums. Afterlife — Sharon Van Etten and the Attachment Theory. I’m not sure yet what to make of Sharon Van Etten’s new “band” project but I’m on board based on the single releases which suggest something a bit more synth-y and sonically punchy which is a departure in some ways for her. I think if I could add one more into the list it would be Peter Gabriel’s 1986 outtake This is the Road which was partly recycled lyrically for a track called Make Tomorrow which appeared over a decade later on his Ovo album. I’m surprised more bands haven’t picked up on the inexpensive subscription thing on Bandcamp. The National, Wilco, R.E.M., Pearl Jam and many others all feel like great contenders for this as a nice way to have a digital fan club to make rare, unreleased, unfinished demo tracks or unique live recordings available to fans. I miss the R.E.M. fan club. I was a member for more than a decade. ← Next Fuse Previous → 2024 by the Numbers"
author = "Designed and built Scott Boms."
year_published = 2025
clearnet = "https://scottboms.com/documenting/12-good-ones"
