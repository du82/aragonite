full_description = "A Visible Distance: Craft, Creativity, and the Business of Design By Matt Owens Part personal memoir and part professional manual by designer and creative strategist Matt Owens, A Visible Distance addresses the common challenges faced when building a practice in graphic design or branding. The book provides concrete strategies to tackle the complexities of balancing intuition and taste, technical and personal capability, strategic business decisions in design work and the demands of modern brand building. The book spans the last several decades: from Owens’ roots in DIY, punk and skateboarding in the later ’80s, to the advent of the commercialization of the internet in the late 1990s, building and growing a creative agency, to the present disruption of artificial intelligence, automation and distributed hybrid teams. A Visible Distance is a testimony to learning new things and embracing fundamental changes in popular culture, tools, technologies and processes to make your own way in design. Published By Set Margins Publish Date 12/10/2024 Page Count 236 Format Paperback Type Book Process Offset Dimensions 6 x 9 in Language EN Filed Under DesignBusinessNonfiction ISBN 978-9083404141 Signed? No ← Next It’s Always Sunny in Silicon Valley Previous → How to Build a Universe that Doesn’t Fall Apart Two Days Later"
