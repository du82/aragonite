["https://scottboms.com/documenting/5-years-of-impossible"]
title = "5 Years of Impossible | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "5 Years of Impossible Saturday, December 9, 2023 Today marks five years since the last scenes from An Impossible Project were captured in Vienna, Austria at Supersense — in the public storefront as well as the manufactory space across the street — and then later at Südbahnhotel, a brief drive outside the city in Semmering where we had a special evening and dinner event planned with an international group of what I’d call “analog luminaries.” These behind-the-scenes photos are just a tiny smattering of the many I captured leading up to the final event on that brisk winter evening among some lovely people and a magical, snow-covered location in the mountains. One of these days, I’ll get around to collecting them and some of the stories into a little book. ← Next Out and Down Previous → Ink by the Barrel"
