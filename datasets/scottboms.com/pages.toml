["https://scottboms.com/making/environmental-graphics-program"]
title = "Environmental Graphics Program | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Environmental Graphics Program Supporting a vibrant creative culture in Meta's global offices In late 2021, I led the strategic development and planning of a new environmental graphics program to sit alongside the existing poster and art commission programs from Open Arts at Meta with a focus on scalability and sustainability. Supported by a team of 3, this 0–1 program was designed to seamlessly integrate with an overarching curatorial framework we had developed earlier in the year. This included constructing, testing, and integrating a variety of robust yet streamlined production methodologies, and detailed research and documentation around sustainability. After completing initial pilot projects in California and Dublin and learning from early failures, we scaled the program globally throughout 2022 while incorporating additional production approaches and processes. Ruler 30K+ Square Feet Globe 100+ Global Installs Office Building 50 Buildings City 30 Cities By the end of 2022, over 100 international projects have been completed featuring original work from new design commissions, our Designer in Residence program, and artists from around the globe, including: Joseph Alessio Sebastien Aubin Edwin Beauchamp Tim Belonax Scott Boms Jez Burrows Diana Ejaita Monica Garwood Opashona Ghosh Joonbug (Lenworth Macintosh) Heejae Kim Sameer Kulavoor Hannah K. Lee Gabriella Marcella Christopher Martin M&E Design Soyun Park Bill Rebholz Kathleen Sleboda Studio ES Angello Torres Kelly Walters Client Made while employed by Meta, Inc. Role Creative DirectionCurationPrintmaking Country Global Languages English Year 2021–2023 Format Installation Illustration Mural Program Processes Digital Painting Laser Cutting Copyright © Meta, Inc. Transmission or reproduction of any materials protected by copyright beyond those allowed by fair use or non-commercial purposes requires written permission from the copyright holder. ← Next OpenUp Previous → I Take Full Responsibility Book"
