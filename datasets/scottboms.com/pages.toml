["https://scottboms.com/documenting/a-place-so-strange"]
title = "A Place So Strange | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Saturday, May 23, 2020 Nothing will happen if you’re not working. Work is absolutely the only thing that will take away the foulness, the curse and the pain that comes from not working. And, once you begin, you will go to a place so strange, so filled with possibility, you’ve already put aside your fear. Allow yourself to get lost there; just follow whatever idiot thread you get on. I do! Art tells you something you didn’t need to know until you know it. Jerry Saltz The Current Situation is a ripe opportunity for creativity and Saltz’s line follows a similar thread to Sister Corita Kent who said “the only rule is work.” His new book How to be An Artist just might be the perfect guide for these times. ← Next Maple Previous → How Real is a Digital Future?"
author = "Designed and built Scott Boms."
