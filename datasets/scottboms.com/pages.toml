["https://scottboms.com/documenting/2024-by-the-numbers"]
title = "2024 by the Numbers | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "2024 by the Numbers Wednesday, January 1, 2025 An inventory and notable recollections from the year that was. Train 153 Office Days in SF1 Airplane 4 Trips Taken2 Walking 3.24M Steps Walked3 Bicycle 948 Miles Biked4 Coffee 560 Coffees5 Tea 524 Cups of Tea6 Open Book 35 Books Read7 Movie Player 67 Movies Watched8 Article 156 Notebook Entries9 Link 910 Links Shared10 Book 204 Library Additions11 Code 957 Site Project Commits12 Eye 8938 Riso Prints13 Match 3 Sold out Editions14 Computer Display 0 New Computers15 Cursor 1 Fonts in Development16 Photo 6 Instagram Posts17 Polaroid 87 Polaroid Photos18 Checkmark 1 Magazine Subscriptions19 Scissors 13 Haircuts20 Star 4 Kickstarters Backed21 Group of People 0 Unions Joined22 VR 0 VR Meetings23 Mask 0 COVID-19 cases24 This past year felt like a fresh start. Things that felt up in the air in 2023 began to settle, especially on the work front. We all made it through the particularly significant milestones of our eldest heading off to university (following the family footsteps in Toronto no less) and the other starting his freshman year of high school here in California. So, no big deal. I made a whole pile of personal work like a new edition of 10 Rules, the A Stone's Throw zine, two editions of the Manufactured Exhaustion print, The Grouch print, the Ignore All Previous Instructions print set — amongst other things. The one project that turned out to be a miss was a fourth edition and total redesign of I Take Full Responsibility which I hummed and hawed too much on if I’m being honest. We’ll see if 2025 requires a fresh reminder about how capitalism works since I have some wickedly fun ideas for it. Reading Highlights I got way ahead of this and wrapped up what I read back in November, but I can say that I’m quite pleased with how much I was able to read in 2024. Officially five books over the same goal I set for 2023 feels good. Six, if you count the additional book read this past week. Musical Highlights A few condensed thoughts on some favorite albums from the year. All Over Favorite: Moon Mirror from Nada Surf was on high rotation since its release back in September and it was great fun to chat with singer Matthew Caws before and following the band’s stop at The Great American Hall in San Francisco in November. Return to Form: Songs of a Lost World from The Cure. An unexpected surprise getting a new album after so many years but a welcome one, and one that’s proven to be universally popular among I think every other 2024 music recap post I’ve seen so far. Biggest Surprise: As It Ever Was, So It Will Be Again from The Decemberists. They had me with the 20+ minute closing track, Joan in the Garden which hits all the weird prog-ear Genesis and Pink Floyd notes for me. Rediscovered Track: De Do Do Do, De Da Da Da from The Police (Live in Oakland) which reminded me just how much part of this track sounds exactly like XTC’s Making Plans for Nigel. I still cannot believe no one’s been sued for this yet! Other notable releases that spent a lot of time in my listening rotation this year were Pearl Jam’s return to form with Dark Matter (★★★★☆), St. Vincent’s most accessible and maybe rockin’ release in my opinion, All Born Screaming (★★★★☆), and the truly excellent Wild God from Nick Cave and the Bad Seeds (★★★★★). Then there’s Elbow’s slow burning Audio Vertigo (★★★★☆), and Luck and Strange (★★★★★) from David Gilmour which is easily his strongest solo release yet. Oh, and a massive pile of unreleased early demos and alternate takes of tracks from Peter Gabriel via his Full Moon Club. A year of tucking in with many favorites rather than searching out new things might be how best to describe my listening habits this year. While I didn’t pick up on much new music in 2024, I am looking forward to remedying that starting with a new album from Sharon Etten and the Attachment Theory based on the first singles, as well as Kathleen Edwards’ forthcoming Covers album which includes Crawling Back to You (Tom Petty), Human Touch (Springsteen), Hello in There (John Prine), and Sweetness Follows (R.E.M.). Looking Forward 2024 was a weird year (fresh start aside) with plenty of moments where I felt adrift or uncertain. Change does that I guess. There were paths not taken that in hindsight, I wish were handled a bit differently, but ultimately were still the right ones and I certainly feel like the year ended in a good place. Of course I’m also on high alert for whatever may come politically in this country as we’re days away from the clown show taking over. Wishing you ★★★★★ for the year ahead. Say no to oligarchs and nazis. Footnotes This was previously tracking remote working days but it made more sense to change this to reflect the new gig which had me traveling to SF at least a few days a week. ↩ I didn’t do a lot of travel this year which was a bit of a welcome change. Three of the four trips were all to Toronto with the one outlier to Chicago. There’s definitely a few places I’d like to get back to in 2025, but we’ll see what the year has in store for me. ↩ Perhaps the biggest surprise to me is that I walked slightly fewer steps than in 2023 though admittedly it was a very small amount (less than 1% difference). ↩ Early on in the year I decided I needed to go a little easier on myself on the bike in 2024. I spent zero time using the bike in stationary mode and almost hit 1,000 miles on the road over 59 days — and only with two crashes to note, which is unfortunately two more than last year. ↩ Considering an increase in the number of days in office, I’m not surprised that my coffee consumption is up a little bit compared to 2023 — 560 vs 524 in 2023 or ~6.5%. ↩ Less time at home meant less tea, taking that number down about 20% compared to 2023. ↩ I crushed my reading goal this year of 30 books. Considering I targeted the same number as 2023, ending 5 over (and 2,470 pages more) feels good. ↩ Surprisingly a small jump from 62 to 67 in 2024 but only 10 of those were in a theatre, so a lot more first releases and re-watches were done at home. I have a handful of tickets leftover from the year that I can use in 2025 at least. ↩ An increase of about 10% — 156 vs 141 in 2023. I definitely find myself gravitating much more to posting here than anywhere else. Quietly hoping RSS makes a big comeback in 2025. ↩ My shared link count in Through Line issues was down 20% compared to 2023. Not a surprise for me as I’ve been finding the real gold harder to find of late, but also the lack of weekly type releases as a major contributing factor. As I think about how the Through Lines weeklies may evolve in 2024, I expect this will hold true by the end of next year. I think I have a new idea how I might bring back a new version of Notable Type too. ↩ I made a lot of progress adding to the Library last year rounding out 2023 with 502 books.This year I added 204 more books, zines, magazines and journals which feels like a lot. ↩ I guess I didn’t do as much work under the hood on the site as in 2023, with a nearly 30% drop in the number of project commits. I find this surprising given quite a bit of new content, a total reworking of the site CSS to make it fully responsive (I cut ~50% of the previous style rules), the start of a Shop, new Library detail pages, and more. ↩ A modest jump from 2024 with 8,938 prints compared to 8,404 in 2023 (6% increase). I could easily print more but my preference is always for smaller editions and limiting waste. A lot of that is driven by the increasing cost and limited availability of paper which I’ve found harder to get generally since the pandemic even from my usual suppliers. ↩ Any number that’s not zero feels good, though even if it was zero, that would still be fine because it means I’m building up some inventory which I have other ideas for. ↩ No notable new tech for me this year. The M3 I bought last year is still holding strong. Only change in my tech setup really was a set of AirPod Pro 2 earbuds which I mostly wanted for the hearing test feature! ↩ I was hoping for meaningful progress on the now long-gestating typeface known as Eclectric Fence in 2024, but other than redrawing control characters to improve the foundation, I didn’t get very far. ↩ I managed to double last year’s total with a whopping 6 posts to the Grid. I expected zero at the end of 2023 so this is a little bit unexpected but so far I haven’t been able to convince myself to delete my account. I feel it might be coming though as I increasingly want to extract any social presence from anything to do with my former employers. ↩ I felt like I shot more Polaroids than this but comparatively 25% more than in 2023. ↩ Pressing Matters is still holding strong. Still missing the monthly monthly Riso Club subscription. ↩ Matching 2023 which I suppose is good? Switched things up this year and back at my previous local. ↩ I doubled the number of Kickstarters back compared to 2023. Hilariously, I’m still waiting on the one outstanding project I had at the end of 2022 to finally deliver something, anything though it does seem like it’s finally close to happening. ↩ None, zip, nada. Probably fine. ↩ Glad to not even have to think about this nonsense anymore, and hopefully never again. ↩ The correct number of cases every year. Again, thankfully. ↩ ← Next 12 Good Ones Previous → Tools, Targets, and Timing"
