["https://scottboms.com/documenting/a-different-life"]
title = "A Different Life | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Friday, November 12, 2021 If people sat outside and looked at the stars each night, I bet they would live a lot differently. Bill Watterson The last few weeks have been absolutely non-stop for me and always make me question whether it’s all worth it because it’s a choice, you know? Deep down it’s not sustainable or what a life deserves to be, yet I press on. A few quiet moments staring up at the sky as Watterson suggests offers a view that consistently pulls me out of that maelstrom. A solid day off also helps offer some perspective. ← Next A Metamorphosis Previous → A Long Way"
