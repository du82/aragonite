["https://scottboms.com/documenting/a-different-golden-goose"]
title = "A Different Golden Goose | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "Monday, May 27, 2024 Never underestimate the power of the person who dreams ideas in the clouds and throws three spread sheets to the wind. Rob Schwartz The delightful pun which caps off the latest from TBWA chair Rob Schwartz made me chuckle, yet also holds some truth, especially for designers and creative folks in Silicon Valley where data is held out like a golden goose to solve any problem. Yes, data is important1 but not without divergent thinking and the intuition that comes from experience. The “theatre of risk” is also a great line because so much is for show. Footnotes It also has to be the right data. All data is not created equal or even necessarily useful when it comes to making decisions… says a person who’s had to fight that battle before… ↩ ← Next Naming Things is Hard Previous → How the Current Moment Feels"
