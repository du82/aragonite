["https://scottboms.com/documenting/the-start-of-it-all"]
title = "The Start of It All | Scott Boms"
description = "The personal notebook and portfolio of creative director, designer, printmaker and publisher Scott Boms."
full_description = "The Start of It All Tuesday, March 4, 2025 Inside the HP garage, the birthplace of Silicon Valley including the company’s first product, a rudimentary (by today’s standards) audio oscillator. If you’re old enough, you might remember it from the role it played in the 1940’s Disney classic Fantasia. Although it was considerably smaller than I would have guessed, it felt very familiar — reminiscent of my own workshop. Really though, it’s the original rules of the garage that continue to be relevant for me despite some not aging as well as others. Nevertheless, I’ve found them to be a helpful jumping off point for developing a framework to guide and check the work coming out of my own studio. More to come on that. Previous → Not Another Brick in the Wall"
