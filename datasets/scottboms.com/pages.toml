full_description = "Burn By Peter Heller Every year, Jess and Storey have made an annual pilgrimage to the most remote corners of the country, where they camp, hunt, and hike, leaving much from their long friendship unspoken. Although the state of Maine has convulsed all summer with secession mania — a mania that has simultaneously spread across other states — Jess and Storey figure it’s a fight reserved for legislators or, worst-case scenario, folks in the capital. But after weeks hunting off the grid, the men reach a small town and are shocked by what they find: a bridge blown apart, buildings burned to the ground, and bombed-out cars abandoned on the road. Trying to make sense of the sudden destruction all around them, they set their sights on finding their way home, dragging a wagon across bumpy dirt roads, scavenging from boats left in lakes, and dodging armed men — secessionists or U.S. military, they cannot tell — as they seek a path to safety. Then, a startling discovery drastically alters their path and the stakes of their escape. Drenched in the beauty of the natural world and attuned to the specific cadences of male friendship, even here at the edge of doom, Burn is both a blistering warning about a divided country’s political strife and an ode to the salvation found in our chosen families. Published By Knopf Publishing Group Publish Date 08/13/2024 Page Count 304 Format Hardcover Type Book Process Offset Dimensions 5.7 x 8.5 in Language EN Filed Under Fiction ISBN 978-0593801628 Signed? No ← Next Shooting for the Stars Previous → A Stone’s Throw"
