description = "Scott O'Hara is a designer and developer based outside of Boston MA. He writes code and cares a ton about building great, accessible user experiences for everyone."
full_description = "Code Abode I’ve written some code, and I’ve done my very best to make sure it doesn’t stink. You can find a whole bunch of said code on my GitHub or CodePen profiles. Feel free to file an issue, or make a PR if you find that my code has an odor, despite my best efforts. But, looking through all your content sounds hard… That’s fair. Doing things is harder than not doing things, after all. I can’t expect you to go through all my stuff. So here are a just a few things to poke at: Accessible Components Accessible markup patterns and progressively enhanced JavaScript components to build common UI patterns. (this is kinda cheating because there’s a lot of individual repos linked in here, such as accordions, modal dialogs and more…) The Accessibility of Styled Form Controls A deep dive into ways to style or seemingly style form controls and related elements. Includes markup patterns, CSS, JavaScript when applicable, and documentation for screen reader support at the time the patterns were created. Sorta code Accessibility Interview Questions A whole bunch of accessibility and inclusive design related questions to ask an interviewee. I’ve been told people actually use these. Neat! Question submissions are welcome! W3C ARIA in HTML specification Joined as editor in September 2019. W3C HTML AAM specification Joined as editor in July 2018. W3C WAI-ARIA specification Joined as working group participant in mid-2019. Back to top"
