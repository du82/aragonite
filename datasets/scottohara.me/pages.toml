["https://www.scottohara.me/blog/2017/04/14/inclusively-hidden.html"]
title = "Inclusively Hidden | scottohara.me"
description = "There are various ways to hide content in web interfaces, but are you aware of the different ways they can impact the accessibility of the ‘hidden’ content? ..."
full_description = '''Inclusively Hidden Published: 2017.04.14 | Updated: 2023.03.02 There are various ways to hide content in web interfaces, but are you aware of the different ways they can impact the accessibility of the ‘hidden’ content? While some might think it’s strange to have various ways to hide content, there are use cases that each method is suited for. There have been many articles written about hiding content, and this post will cover some of the noted methods, and purposefully ignore others. This post will highlight the methods of hiding content that are most appropriate for modern web development, and note the accessibility impacts of each. But before we talk about how to hide content we should ask ourselves a question… Why are we hiding content? There are three primary reasons to hide content in an interface. It’s important to identify what those reasons are, as they will correlate with the appropriate technique needed to hide such content to the necessary type of end-user(s). 1. Completely Hidden Content: This sort of hidden content is part of the intended design and UX of an interface. There are many components in our interfaces (tab panels, off-screen navigations, modal windows, etc.) that are initially hidden until a state change occurs to bring these components, and their content, into view. Typically these sorts of initially hidden components are meant to be purposefully inaccessible until a requirement is met and the component becomes available to everyone. 2. Only Visually Hidden Content: To address a design’s contextual shortcomings, visually hidden content may be used within a component, or generally on a web page, when “visually” information is understandable, however how the content is otherwise exposed programmatically may be undiscoverable, awkward or confusing to users of assistive technology (AT). As the best interfaces are interfaces that you don’t really notice, removing extraneous visual elements and paring components down to their absolute necessities can go a long way to seemingly create streamlined, “out of the way” user experiences. However by striving for a minimal visual footprint, some of the first bits of “fluff” to be removed are often things like form control labels, or other descriptive copy which explains the content, or how to effectively interact with it. You know, the stuff that seems straight forward for the people who have made the interface, but is important for those actually using it… By re-injecting visually hidden (but AT, e.g., screen reader friendly) content, like text to accompany elements only represented by icons, or additional context to “read more” links, one can add or re-introduce information to bridge the gap between how sighted users and low vision or blind users will experience your interfaces. In contrast to temporarily completely hidden content, this sort of hidden content is not generally meant to become visually accessible, though there can be exceptions. For instance, skip links or other hidden until hovered/focused UI. 3. Visual-Only Content, or hiding content to assistive technologies: In very specific instances, there may be visual elements that should not be discoverable to users of assistive technology. While this may seem counter intuitive to creating fully accessible user experiences, the goal with hiding this sort of content is to reduce potential redundancies in information (e.g., an image that would have alt text as “warning”, followed by visible text which states “warning”. Communicating both to assistive technologies is not necessary.) Time to properly hide content Now that we’ve identified three categories of hidden content, the following are techniques one can utilize to appropriately hide each content type: Hiding Content Completely The techniques for hiding content completely are best used in conjunction with temporarily hidden content. This content should be hidden from all users until the content is needed. To achieve this, we can utilize the following: CSS display: none Useful for completely removing elements from the normal DOM flow. Content set to display none will not be accessible to any user. HTML’s hidden Attribute The hidden attribute is HTML’s native attibute which can be used to hide content to all users. It is essentially the a lower-specificity version of CSS’s display: none;. By declaring [hidden] { display: none; } in your CSS, even legacy browsers which don’t support the hidden attribute by default will still hide content in the same manner. Be aware, that the hidden attribute can be easily undone by any other CSS you specifiy on the element that changes its display value. This is by desgin. Additionaly, the hidden attribute should only be used if you do not want the content that is hidden to be exposed to users who may have CSS / JS turned off, blocked or disabled. For example, an element with the hidden attribute specified will not render in a browser’s reader mode. CSS visibility: hidden Much like display: none, this declaration will completely hide content from all users, with two important differences to display: none. First, this method does not remove the content from the normal DOM flow, so its “physical space” is still retained in the document. The second difference is unlike display: none, visibility: hidden will respect CSS transitions. This makes it a preferred choice when hidden content is meant to transition between its hidden and revealed state. To compensate for the first difference, visibility: hidden is best paired with other CSS properties that negate its position in the DOM. e.g., use position: absolute to remove it from the normal DOM flow in the hidden state, or overflow: hidden and height: 0;, etc. With these choices in mind, the correct one should be used when coding a toggle interaction for a particular component. For instance, if a component requires a basic show and hide interaction, and the content should become available were CSS to fail, toggle a display: none class. If a component should remain hidden regardless of CSS being available or not, use and toggle the hidden attribute. If a more complex transition is required, like when transitioning an off-screen navigation into the viewport, use visibility: hidden; along with other CSS positioning and transform properties when toggling the state of the component. To reveal content hidden via these methods, you will need to utilize JavaScript to toggle attributes or classes. Here is a quick demo of toggling content using CSS visibility and display properties: See the Pen toggles by Scott (@scottohara) on CodePen. Hiding Content Visually Visually hidden techniques allow for content to be hidden from sighted users while still allowing ATs to discover and interact with the content. There are multiple ways to use CSS to visually hide content, but the following example will cover many use cases. /* ie9+ */ .visually-hidden:not(:focus):not(:active) { clip: rect(0 0 0 0); clip-path: inset(50%); height: 1px; overflow: hidden; position: absolute; white-space: nowrap; width: 1px; } The above “visually-hidden” class is utilizing various declarations to shrink an element into a 1px square, hiding any overflow, and absolutely positioning the element to remove any trace of it from the normal document flow. The :not portions of the selector are allowing a means for any focusable element to become visible when focused/active by a user. So elements that normally can’t receive focus, like paragraphs, will not become visible if a user navigates through content via screen reader controls or the Tab key, but natively focusable elements, or elements with a non-negative tabindex will have these elements appear in the DOM on focus. As for some examples, this class can help provide context to read more links: <a href="#foo"> Read more <!-- always visually hidden because the parent is the focusable element. --> <span class="visually-hidden"> about how to visually hide content </span> </a> inline skip links: <!-- temporarily hidden until <a> is focused --> <a href="#main_content" class="visually-hidden"> Jump to main content </a> or labels to form components where context is visually implied, but may not be apparent to users reliant on screen readers. <fieldset class="date-range-component"> <legend> Select Start and End Dates </legend> <!-- always visually hidden --> <label for="start_date" class="visually-hidden"> Start Date: </label> <input type="date" id="start_date" name="start_date"> <span> to </span> <label for="end_date" class="visually-hidden"> End Date: </label> <input type="date" id="end_date" name="end_date"> </fieldset> If you’d like to learn more about .visually-hidden classes, there are additional links in the resources section at the end of the article. Visually Hidden: Off-Screen Another method for hiding content from view is to push it outside of the browser’s visible viewport. /* baseline rules for an off-screen class */ .off-screen { left: -100vw; position: absolute; } Absolute of fixed positioning content off screen removes the content from the document flow, while also retaining access to it for ATs. For left to right languages it’s best to position content off to the left, as positioning it to the right may create horizontal scroll bars, if an overflow-x: hidden; is not set on containing elements. The reverse would be true for right to left languages. Where this sort of technique can be preferred over the .visually-hidden class is when it’s modified for content that will transition from off-screen to within the view port, upon focus. e.g., grouped skip links: <!-- a list of skip links to jump directly to the primary navigation or content of an interface. --> <ul class="off-screen-ul"> <li> <a href="#primary_nav" class="skip-link"> Skip to Primary Navigation </a> </li> <li> <a href="#primary_content" class="skip-link"> Skip to Primary Content </a> </li> </ul> /* Hides the list off screen, since these are links that are only useful for keyboard users, and do not require being consistently visible. */ .off-screen-ul { left: -100vw; list-style: none; position: absolute; } /* Style the skip links to be fixed to the top of the page, and have an initial negative Y-axis value. */ .skip-link { background: #000; color: #fff; left: 0; padding: .75em; position: fixed; top: 0; transform: translateY(-10em); transition: transform .2s ease-in-out; } /* Upon focus of the skip link, transition it into view by returning it's Y-axis to the default 0 value. */ .skip-link:focus { transform: translateY(0em); } Here’s a CodePen of the above example. See the Pen Simple off-screen skip link nav by Scott (@scottohara) on CodePen. In the above example, I’ve expanded the basic .off-screen class to hide the unordered list from being visible. The skip links have a variation of an off-screen class, as I want them to always be positioned at the top of the screen, but not transition in from the left. Since I want these links to individually slide into view, I’m also using the transform property, rather than top property, as transitioning transforms has better performance (YouTube video of Will Boyd’s CSS Conf 2016 talk). Alternate ways to visually hide content Keep in mind there are other variations to the CSS used to visually hide content. For instance, it may be appropriate to use opacity: 0; or color: transparent;. With opacity: 0, it can be used to fully hide an element like a native radio button, and then by using position: absolute it can be placed atop a custom radio button so that it will be discoverable by users exploring by touch on touch screen devices. This technique is used in A11y Styled form controls: Styled radio buttons. As with using a transparent color, this could be done to specifically hide text or even a border-color so that it is invisible in standard viewing, but visible with Windows High Contrast Mode enabled. Regarding the use of opacity: 0 to hide content, this used to completely hide elements from the ChromeVox web extension screen reader.Testing today (June 17, 2021) after a prompt by Rachel Leggett, it appears this is no longer a bug and opacity: 0 will no longer incorrectly completely hide content from the screen reader. Exploiting a Completely Hidden Content Loophole Using display: none, the hidden attribute, and visibility: hidden to completely hide content will negate all users from directly access that content. However, there is a way to reveal that content solely to screen readers in certain circumstances. By attaching an aria-describedby or aria-labelledby attribute to a focusable element, and setting the ARIA attribute’s value to the completely hidden element’s id, screen readers will announce the content of the completely hidden element. The use case for doing this would be if there was a need to provide additional context to an element (like test fields in a form), or to provide a label to an element without having that content discovered and announced multiple times by a screen reader. For example: <!-- the visually-hidden class does not completely hide content. These instructions will still be discovered by screen readers. --> <p class="visually-hidden" id="example_desc"> Here are specific instructions for the type of information this form input is expecting to receive... </p> <!-- ... --> <label for="example"> Example </label> <input type="text" id="example" aria-describedby="example_desc"> The above example would allow screen readers to read the contents of the example description as a user navigates through the document with the virtual cursor. While this is not “inaccessible”, the issue with it is that the information may not make sense when accessed in isolation to the form control in which it describes. It’s only necessary to make it available to users when they are accessing the form control to which it relates. So, to make sure the content is only accessible when necessary, it could be marked up like so: <!-- using the hidden attribute, this description is now inaccessible via standard methods of content discovery. The aria-describedby, attribute on the input will still announce it to the user. --> <p hidden id="updated_example_desc"> Here are specific instructions for the type of information this form input is expecting to receive... </p> <!-- ... --> <label for="example"> Example </label> <input type="text" id="example_2" aria-describedby="updated_example_desc"> Now the instructions are hidden from everyone in the normal document flow, but the ARIA attribute can still reference the ID, and reveal the content to the screen reader as descriptive text for the form control. Hiding Content from Assistive Technology Sometimes content is for decorative purposes only, and it would be optimal to not announce this content to assistive technology. For instance, icon fonts. The Filament Group wrote an excellent article Bulletproof Accessible Icon Fonts that I suggest reading if you or your organization is still using icon fonts. I also suggest reading'''
