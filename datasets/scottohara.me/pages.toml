["https://www.scottohara.me/posts/css-filters"]
title = "CSS Filters | scottohara.me"
full_description = "What are CSS filters? Published: 11.24.2015 The CSS filter property allows for powerful, PhotoShop-like, effects to be applied an element prior to an element's rendering in the browser. What this means is that image or element manipulation that could once only be performed with image editing software, server-side image manipulation or JavaScript have become available to us in CSS with very straight-forward syntax. .example { filter: filter-type(value); } CSS filters are currently only fully implemented in FireFox (v.35+), but can be used in Chrome, Opera and Safari with the -webkit- prefix. There is no current support in any version of Internet Explorer. Note: CSS filters may also be applied to SVG elements, but at the time of writing this demo, applying filters to SVGs is only available in FireFox, with no support in any other browsers. Read much more about CSS filters on MDN, CSS Tricks and the W3C Spec Draft. Photo Credit: unsplash.com Read other things I've written. Examples of CSS Filters No filter. Blur Filter Brightness Filter Contrast Filter Drop Shadow Filter Grayscale Filter Hue Rotate Filter Invert Filter Opacity Filter Saturate Filter Sepia Filter Contrast & Brightness Filters"
