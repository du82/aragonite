title = "Who is this guy? | scottohara.me"
description = "Scott O'Hara is a designer and developer based outside of Boston MA. He writes code and cares a ton about building great, accessible user experiences for everyone."
full_description = "Who is this guy? Hi again! I am Scott (as you’re likely aware, being this is my web page n’ all) an accessibility engineer who contributes to web standards, participating in the ARIA working group, WCAG working group, and co-editing the ARIA in HTML and HTML AAM specifications. Aside from my focus on accessibility, I’ve been a designer, developer, team lead, and design and development director. I want to help people create inclusive user interfaces. I don’t care for nit-picking what shade of blue to make a button (unless the chosen blue will create a color contrast failure - in which case, then I will care). If I’m not doing computery-work things, I’m most likely to be found engaged in some sort of ‘spending time with the people I love and care about’ activity. I quite like those activities. If it’s not too cold I may well be outside running. I also quite enjoy listening to music, podcasts, and trying to get through my backlog of Playstation games. To be honest though, I think outside of work the thing I spend the most time doing is dishes. At least, that’s what it feels like. Perpetually loading and emptying the dishwasher. Washing the things that don’t go in the dishwasher. Finding dishes my kids have left around the house, as if they think it’ll somehow make washing the dishes more fun if I need to go on a scavenger hunt to find them, first. Scott O’doing-the-dishes-again. You can find me on: Twitter GitHub CodePen Dribbble LinkedIn Last.fm Websites I've written for The A11y Project The Paciello Group / TPGi 24 Accessibility 24 Ways Smashing Magazine CSS Tricks Fresh Tilled Soil (archive.org) Modern Web (archive.org) Sitepoint Everyday Designer Part of a Whole Back to top"
