full_description = '''Mostly Coherent Thoughts I like to write. I hope you like to read. 2024 Paragraphs Posted: 2024.08.29 | Updated: 2024.08.31 Spoiler Alert: it needs to be accessible Posted: 2024.08.22 | Updated: 2024-08-23 popover accessibility Posted: 2024.03.22 2023 The search element Posted: 2023.03.24 | Updated: 2023.10.08 Visually hidden content is a hack that needs to be resolved, not enshrined Posted: 2023.03.21 | Updated: 2023.05.01 Having an AI dialog Posted: 2023.02.17 Setting expectations for asking ChatGPT web accessibility questions Posted: 2023.01.31 Use the dialog element (reasonably) Posted: 2023.01.26 2022 Responsive accessibility using visibility hidden Posted: 2022.11.07 The details and summary elements, again Posted: 2022.09.12 Making a custom clear text field button Posted: 2022.02.19 Considering dynamic search results and content Posted: 2022.02.05 | Updated: 2022.02.06 Are we live? Posted: 2022.02.05 | Updated: 2022.08.22 Div divisiveness Posted: 2022.01.20 | Updated: 2022.01.24 2021 Name, labels, ARIA, what to do? Posted: 2021.11.02 A spooky tale: The Headingless Horseman Posted: 2021.10.31 Semantic <menu> context Posted: 2021.10.21 | Updated: 2023.10/30 Redundantly Redundant a11y Accessibility Posted: 2021.10.04 | Updated: 2022.03.24 Using JavaScript to detect high contrast and dark modes Posted: 2021.10.01 | Updated: 2021.10.03 One last time: custom styling radio buttons and checkboxes Posted: 2021.09.24 | Updated: 2021.09.25 Image SVG aria-hack=resolved Posted: 2021.09.03 New in ARIA 1.2: ARIA IDL attributes Posted: 2021.07.23 | Updated: 2021.07.25 Accessibility of the section element Posted: 2021.07.16 | Updated: 2022.01.29 ARIA in HTML Posted: 2021.07.07 | Updated: 2021.09.30 Disabling a link Posted: 2021.05.28 | Updated: 2022.01.29 2020 Results of labeling lists (and list items!) Posted: 2020.05.02 | Updated: 2023.03.24 Using a spacer.gif in 2020 Posted: 2020.02.13 2019 Testing lazy image support, and instead finding another unexpe