["https://scottohara.me/blog/2014/10/03/link-tabbing-firefox-osx.html"]
title = "No, tabbing is not broken. Yes, I was confused too. | scottohara.me"
description = "Note: this post was previously titled"
full_description = '''No, tabbing is not broken. Yes, I was confused too. Published: 2014.10.03 | Updated: 2019.11.25 Note: this post was previously titled "Tabbing Links in OSX/macOS Firefox". However, it is not just a Firefox quirk as this updated post now outlines. Jump to the latest update for this post. For those of you who have attempted to do basic keyboard accessibility testing with Mac OSX or macOS and Firefox (or Safari), you’ve likely wondered why the Tab key isn’t moving focus to links and potentially other focusable elements. By default, macOS has limited keyboard tabbing to only ‘text boxes and lists’ as a system preference. Why? I’m sure there’s a reason. It may even be a good one… but that reason escapes me. And I do know it confuses people who are trying to do right with basic keyboard testing. How do I “fix” this? There are two things you’re going to want to do to make sure focusable elements in websites are actually focusable. Change your system preferences First, open System Preferences and then go to Keyboard Preferences. Once there, update the radio button selection to “all controls”, as shown in the screen shot below, then OSX/macOS, and thus Firefox, will allow keyboard tabbing to all focusable elements. Note: I originally found guidance / information about on this setting per this stackoverflow question on how to allow keyboard focus of links. Make sure Safari is appropriately setup too Beyond the system preference, you’re going to need to open Safari’s preferences, and go to the Advanced options as well: Make sure the setting is checked so as to not need to press both Option and Tab to navigate. Once both of those settings have been updated you should be able to navigate to all focusable elements in websites by use of the Tab key. Updated: August 17, 2017 Revised the article a bit and added in references to macOS, cause that's the latest operating system, and this is still confusing people... Update: August 24, 2018 Another year later and this is still a thing. I'm only making this update because I just happened to be talking about it the other day. Update: October 19, 2018 Minor text revisions and typo fixes. Update: April 26, 2019 Article updated re: Am I the only one for which Safari (12.0.2) just completely skips the styled check-boxes when I tab there: https://t.co/weveh43PcH. It jumps to the first <summary>. Is it expected? A setting most people would have set and not me? ping @scottohara— Romaric Pascal (@romaricpascal) April 26, 2019 Update: November 13, 2019 With the latest release of macOS Catalina, links cannot be focused in Firefox when following the instructions of this blog post alone. This post will be updated again once an updated solution is found. Update: November 25, 2019 The A11y Project's article on macOS tabbing has been updated to include the information about how to allow Firefox to allow tabbing to links if you've updated to macOS Catalina. However, apparently in Firefox 71+, an update will be put in place where this may no longer be necessary. Back to top'''
