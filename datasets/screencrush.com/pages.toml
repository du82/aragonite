full_description = "Everything New to Watch on Netflix in March 2025Matt SingerMatt SingerPublished: February 26, 2025NetflixShare on FacebookShare on TwitterBefore the Russo brothers return to Marvel to direct two new Avengers movies, they’re releasing The Electric State on Netflix. The film features Millie Bobby Brown and Chris Pratt, in a sci-fi adventure tale about a ruined future after a failed robot uprising. (Apparently a robotic Mr. Peanut also plays a role? I didn’t even know Mr. Peanut was a robot. I thought he was a peanut. You really do learn something new everyday.)The cast and creators involved make The Electric State one of the biggest titles coming to Netflix in March. But that’s all it is; one of dozens of films and shows debuting on streaming over the course of the month. There’s also a new season of Formula 1: Drive to Survive, a new SpongeBob SquarePants movie, a new season of the reality series Temptation Island (remember that one??), a new documentary about Charles Manson, and another week of John Mulaney’s live talk show. And that’s still barely scratching the surface of everything you can watch.For the rest, here’s the full list of what’s coming to Netflix in March 2025:Avail. 3/1/25The Potato Lab -- NETFLIX SERIESA passionate researcher’s life takes a turn when a strict director arrives at her potato lab — proving that love can sprout in the most unlikely places.Sakamoto Days -- NETFLIX ANIME (new episode)Once the greatest hitman of all, Taro Sakamoto retired in the name of love. But when his past catches up, he must fight to protect his beloved family.50 First Dates Annie (2014) Beginners Black Hawk Down Blade Runner: The Final Cut Blood and Bone Cell 211 Do the Right Thing Friday High-Rise The Holiday Ma National Security Next Friday Pride & Prejudice Runaway Jury See No Evil, Hear No Evil Sicario Ted Vampires Wedding CrashersNetflixNetflixloading...READ MORE: The Best Netflix Movies of the Year to Watch Right NowAvail. 3/3/25Hot Wheels Le