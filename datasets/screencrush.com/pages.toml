ar-old girl. As she searches for the truth, Ema finds herself forced to confront her own demons.I Survived a Crime: Season 2NetflixNetflixloading...Million Dollar Secret -- NETFLIX SERIESThis is a game of wit, cunning and deception. Twelve strangers enter a sumptuous lakeside estate and in each of their rooms is a mysterious welcome gift — a box. Eleven of them are empty and one contains $1,000,000, and it's for that guest to keep — as long as they keep their identity hidden. Devilish games will reveal clues about the millionaire’s identity, and they must do whatever it takes to keep their Million Dollar Secret.Avail. 3/27/25Gold & Greed: The Hunt for Fenn's Treasure -- NETFLIX DOCUMENTARYAn eccentric man named Forrest Fenn sets off a real-life treasure hunt when he hides a chest of gold in the Rockies — and hides clues in a cryptic poem.Survival of the Thickest: Season 2 -- NETFLIX SERIESWith her styling brand on the rise — and her love life on the rocks — Mavis takes ambitious risks to make waves in the world of high fashion.Avail. 3/28/25The Lady’s Companion -- NETFLIX SERIESHired to find husbands for three wealthy sisters, chaperone Elena Bianda is drawn into a late 19th-century world of love, scandal and comic intrigue.NetflixNetflixloading...The Life List -- NETFLIX FILMWhen Alex Rose’s mother sends her on a quest to complete her childhood bucket list, it takes her on a journey that will make you both laugh and cry as she uncovers family secrets, finds romance, and discovers herself along the way.Avail. 3/31/25Gone Girls: The Long Island Serial Killer -- NETFLIX DOCUMENTARYYoung women who worked in the sex industry were disappearing from New York City and Long Island, and no one was looking for them. Then in 2010, female remains were found in the Gilgo Beach area of Long Island, leading to a string of additional discoveries, all of which seemed to be connected. The case of the Long Island Serial Killer remained unsolved for 13 years — until July 2023 when the police arrested a suspect. From Academy Award®-nominated and Emmy-winning director Liz Garbus (Lost Girls) comes the definitive look at the twists and turns in a case that dominated headlines and is still developing in real time.Promised Hearts -- NETFLIX FILMA young woman's future is jeopardized by a secret arrangement that throws her life into chaos — but it may be the only way to save her family.Rhythm + Flow Italy: Season 2 -- NETFLIX SERIESNew talent. New locations. Young artists from north to south and even overseas battle it out for a grand prize and the title of Italy's next rap star.Get our free mobile app10 Movie and TV Stars Who Quit Show BusinessThese amazing actors walked away from hugely successful careers. Filed Under: Netflix, Russo Brothers, The Electric StateCategories: Movie News"
