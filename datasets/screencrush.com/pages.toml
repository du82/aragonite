["https://screencrush.com/movie-theater-ceiling-collapse-captain-america"]
title = "Movie Theater Ceiling Collapses During ‘Captain America’"
description = "Talk about a ‘Brave New World’ for movie theaters."
full_description = "Movie Theater Ceiling Collapses During ‘Captain America’ ScreeningMatt SingerMatt SingerPublished: February 28, 2025YouTubeShare on FacebookShare on TwitterA movie theater in Washington that was showing Captain America: Brave New World wound up looking like the Red Hulk had rampaged through it before the film was over.In very scary footage and images shared by the Wenatchee Valley Fire Department on Instagram, you can see that the ceiling of the Liberty Cinema in Wentachee, Washington collapsed in the middle of a screening of Brave New World. The fire department’s caption along with their footage from the scene says that “at approximately 8 PM, Wenatchee Valley firefighters responded to a reported ceiling collapse at Liberty Cinema. Two people were inside the theater at the time, but fortunately, no injuries were reported.”You can see what was left of the theater — and Captain America: Brave New World still visible on the screen! — below.READ MORE: Every Movie Theater Candy, Ranked From Worst to BestGet our free mobile appThe cause of the collapse is still under investigation. According to the movie theater website Cinema Treasures, the Liberty in Wentachee is over 100 years old and first opened in 1920 as part of the Fox theater chain.The New York Times interviewed the chief of the fire department, Brian Brett, who added some details about what happened when the two moviegoers realized what was happening...They started to move away from what was falling from the ceiling ... A very large section of framed-in area underneath the roof came loose and dropped into about the first three rows of seats in the old historic theater.One of the viewers was reportedly “struck by some debris” but was otherwise okay. Which, given the scene, is kind of remarkable. It’s a good thing this didn’t happen on Brave New World’s opening weekend; the film made more than $88 million in its first three days in U.S. theaters.The Wentachee fire department summed up the whole situation well: “Talk about an interactive movie experience... just not the kind you want.”12 Things We Miss in Modern Movie TheatersWhile we still love movie theaters, they have changed through the years. And not always for the better.Filed Under: Captain America: Brave New World, Marvel, Movie Theaters, TheatersCategories: Movie News"
