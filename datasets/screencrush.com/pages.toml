ontrol, CIA experiments and murder.Delicious -- NETFLIX FILMDuring their vacation in the French countryside, a wealthy German family becomes entangled with a young hotel worker harboring sinister intentions.Formula 1: Drive to Survive: Season 7 (GB) -- NETFLIX DOCUMENTARYFamiliar faces make a comeback, team stalwarts defect to arch rivals, and new champions emerge in one of Formula One's most tumultuous seasons yet.Nadaaniyan -- NETFLIX FILMWhen a misunderstanding turns her friends against her, lovable rich girl Pia hires Arjun, a career-focused new student, to pretend to be her boyfriend.NetflixNetflixloading...Plankton: The Movie -- NETFLIX FAMILYPlankton's tangled love story with his sentient computer wife goes sideways when she takes a stand — and decides to destroy the world without him.When Life Gives You Tangerines -- NETFLIX SERIESIn Jeju, a bold girl and a devoted boy's fated bond blossoms into a lifelong tale of setbacks and triumphs — proving love can endure across generations.Avail. 3/8/25Sakamoto Days -- NETFLIX ANIME (new episode)Once the greatest hitman of all, Taro Sakamoto retired in the name of love. But when his past catches up, he must fight to protect his beloved family.Avail. 3/10/25American Manhunt: Osama bin Laden -- NETFLIX DOCUMENTARYFeaturing rare footage and interviews with CIA insiders, this edge-of-your-seat documentary series traces the epic hunt for Osama bin Laden.Avail. 3/12/25Everybody’s Live with John Mulaney -- NETFLIX LIVE EVENTJohn Mulaney unleashes his one-of-a-kind comedic genius on late night with a spontaneous and sidesplitting live weekly show. (Live event in English.)NetflixNetflixloading...Temptation Island -- NETFLIX SERIESIn this spicy update to the hit reality series, four couples test their relationships by shacking up with eligible singles on a tropical island.Welcome to the Family -- NETFLIX SERIESA struggling single mom rallies her quirky family to outsmart a mafia boss after her estranged, wealthy father dies, leaving them with his debt.Avail. 3/13/25Adolescence -- NETFLIX SERIESWhen a 13-year-old is accused of the murder of a classmate, his family, therapist and the detective in charge are all left asking: what really happened?Love is Blind: Sweden: Season 2 -- NETFLIX SERIESA new group of singles arrives for the ultimate dating experiment: finding true love and lifetime commitment, all before laying eyes on each other.Avail. 3/14/25AudreyNetflixNetflixloading...The Electric State -- NETFLIX FILMMillie Bobby Brown and Chris Pratt star in this retro-futuristic adventure about an orphaned teen's journey to find her brother after a robot rebellion.Avail. 3/15/25Sakamoto Days -- NETFLIX ANIME (new episode)Once the greatest hitman of all, Taro Sakamoto retired in the name of love. But when his past catches up, he must fight to protect his beloved family.Avail. 3/17/25CoComelon Lane: Season 4 -- NETFLIX FAMILYFollow JJ and friends on everyday adventures fueled by the power of imagination as they try new things, celebrate special moments and more!Inside: Season 2 -- NETFLIX SERIESContent creators take on a series of challenges to win a huge cash prize in this reality series from viral British YouTubers, the Sidemen.The Walking Dead: Dead City: Season 1Avail. 3/18/25Bert Kreischer: Lucky -- NETFLIX COMEDY SPECIALLosing 45 pounds. Getting parenting advice from Snoop Dogg. Bert Kreischer knows he's the luckiest guy around — and he's recounting his blessings.Love & Hip Hop New York: Seasons 3-4The OutrunAvail. 3/19/25Twister: Caught in the Storm -- NETFLIX DOCUMENTARYIn May 2011, a massive tornado ripped through Joplin, Missouri. Through pulse-pounding firsthand footage, this documentary goes inside a deadly twister.NetflixNetflixloading...Woman of the Dead: Season 2 -- NETFLIX SERIESTwo years after avenging her husband's death, Blum has found a measure of peace — but secrets never stay buried for long.Avail. 3/20/25Bet Your Life -- NETFLIX SERIESA down-and-out sports betting writer 