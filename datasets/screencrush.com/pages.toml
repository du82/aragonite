full_description = "Viola Davis Is an Action Hero President in the ‘G20’ TrailerMatt SingerMatt SingerPublished: February 12, 2025Prime VideoShare on FacebookShare on TwitterThe world is not lacking for Die Hard clones. At this point it’s not even lacking for Die Hard clones about the President of the United States. Back in the ’90s Harrison Ford played a heroic president who fights terrorists who hijack his plane in Air Force One. And about a decade ago we got White House Down with Jamie Foxx and Channing Tatum and Olympus Has Fallen with Gerard Butler and Morgan Freeman — which became an ongoing franchise with movie sequels and TV spinoffs.So I wouldn’t say G20 is a wildly novel idea — but it sure looks like a fun execution. This time Viola Davis is playing the President, who must save the day after terrorists kidnap pretty much every other world leader and hold them hostage at an international summit in South Africa.The trailer for the film shows Davis’ President Sutton saving hostages, fighting bad guys, and kicking an enormous amount of butt. (If you’ve seen Davis’ The Woman King, you know kicking enormous amounts of butt is something she is quite good at.)Check out the G20 trailer below:READ MORE: The Best Jason Statham Action MoviesThere’s a pretty fantastic poster for the film as well.Prime VideoPrime Videoloading...Here is the film’s official synopsis:When the G20 summit comes under siege, U.S. President Danielle Sutton (Academy Award® winner Viola Davis) becomes the number one target. After evading capture by the attackers, she must outsmart the enemy to protect her family, defend her country and safeguard world leaders in this action-packed thrill ride.G20 premieres on Amazon’s Prime Video streaming service on April 10.Get our free mobile appTV Shows We Used to Love That Are Cringe NowWe can't say why we liked these shows, but we can certainly say why we can't watch them now. Gallery Credit: Emma StefanskyFiled Under: Amazon, Die Hard, G20, Prime Video, Viola DavisCategories: Movie News, Trailers"
