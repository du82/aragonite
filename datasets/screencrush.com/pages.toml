full_description = "‘The Conversation’: The Little But Important Details You Might Have MissedMatt SingerMatt SingerUpdated: April 29, 2020ParamountShare on FacebookShare on TwitterStuck at home? So is ScreenCrush’s Matt Singer — which is why he’s watching things streaming on Netflix, Hulu, Amazon, Disney+, YouTube, Criterion, Tubi, and elsewhere, and then writing about what he finds. If you want to suggest something for him to watch and write about, find him on Twitter. Previous installments of this column can be found here.Today’s Film:The Conversation (1974)Director: Francis Ford CoppolaWriter: Francis Ford CoppolaStars: Gene Hackman, John Cazale, Allen GarfieldBox Office Total: $4.4 millionRotten Tomatoes Rating: 98 percentCurrently Streaming On: Amazon PrimeWhy I Watched It: Before the coronavirus pandemic struck, The Conversation had been scheduled for a run at New York’s Film Forum, in a new 35mm print personally supervised by Francis Ford Coppola. I was looking forward to seeing it again, for the first time in at least five years — but life had other plans. Streaming the movie isn’t as good as watching it on the big screen, but it’s better than nothing. So put on some headphones, crank up that classic David Shire score, and listen carefully...Gallery — The Little Important Details You Missed in Last Action Hero:Sign Up For the ScreenCrush NewsletterFiled Under: Francis Ford Coppola, Gene Hackman, Little DetailsCategories: Movie News, Original Features ‘Madame Web’ Wins Worst Picture of the Year Award‘Madame Web’ Wins Worst Picture of the Year Award Gene Hackman and Wife’s Deaths Called ‘Suspicious’ By PoliceGene Hackman and Wife’s Deaths Called ‘Suspicious’ By Police Gene Hackman, Oscar-Winning Hollywood Star, Dies at 95Gene Hackman, Oscar-Winning Hollywood Star, Dies at 95 10 Directors’ Passion Project Movies That Almost Didn’t Get Finished10 Directors’ Passion Project Movies That Almost Didn’t Get Finished ‘Megalopolis’ Review: Coppola’s One (Hundred and Twenty Million Bucks) From the Heart‘Megalopolis’ Review: Coppola’s One (Hundred and Twenty Million Bucks) From the Heart"
