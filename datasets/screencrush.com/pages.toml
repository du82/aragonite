full_description = "What Happened on ‘The Falcon and the Winter Soldier’? Full Series RecapScreenCrush StaffScreenCrush StaffPublished: February 10, 2025MarvelShare on FacebookShare on TwitterIf you see the big Marvel movies but only pay casual attention to what’s going on in the TV shows, you might be a bit befuddled by Captain America: Brave New World. How did Sam Wilson go from Falcon to Captain America? Who‘s this other guy who’s the new Falcon?It all went down on the Disney+ TV series The Falcon and the Winter Soldier. And if you’ve got questions about what happened on the show, we’ve got answers. In our latest Marvel Cinematic Universe video, we’ll recap the full series and explain where all the characters are at the start of Brave New World. It also works to get you ready for Thunderbolts* too — since both Winter Soldier and U.S. Agent were big parts of the show as well.Watch the video below:READ MORE: The Worst Marvel Comics EverIf you liked that video recapping the entire Falcon and Winter Soldier Disney+ series, check out more of our videos below, including one on the entire Captain America franchise up to Brave New World, one on the hidden Watcher cameo in The Fantastic Four: First Steps trailer and what it means for the future of the MCU, and one breaking down all the Marvel Easter eggs in the new The Fantastic Four: First Steps teaser. Plus, there’s tons more videos over at ScreenCrush’s YouTube channel. Be sure to subscribe to catch all our future episodes. Captain America: Brave New World is scheduled to open in theaters this Friday.Sign up for Disney+ here.Get our free mobile appEvery Marvel Cinematic Universe Movie, Ranked From Worst to BestIt started with Iron Man and it’s continued and expanded ever since. It’s the Marvel Cinematic Universe, with 34 movies and counting. But what’s the best and the worst? We ranked them all.Filed Under: Captain America: Brave New World, Disney Plus, Marvel, Marvel Cinematic Universe, The Falcon and the Winter SoldierCategories: TV News, Videos"
