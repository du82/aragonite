ge, and demographic information. It is optional for you to engage in such activity; however, if you choose to do so, we may not be able to permit you to participate in the activity unless certain pieces of information are provided.Emails, Communications and AccountsWhen you send an email or other communication to TSM, or when you register for an account on one of our services, we may ask for your name, phone number, and email address and, where you are seeking to advertise with us, or procure our services, other information about you and/or your company. We also collect the content of your message or submission to us, which contains any additional information, including Personal Information, you choose to share with us. When you use the Services, you may be given the option to subscribe to or to be added to our email list. We collect this information when you initiate contact with us for the purpose of responding to your email or other communications. Your selection will not affect other uses or sharing of your information as described in this this Privacy Notice. Subscriptions to the email list can be cancelled at any time by following the instructions in the “Your Choices and Rights” section of this Privacy Notice below, or by clicking the “unsubscribe” link at the bottom of an email and follow the unsubscribe instructions. Completing a SurveyIf you choose to participate in a survey, you may be asked to provide basic demographic information. You also will be asked to provide additional information related to the survey topic, which may include Personal Information. We use this information to conduct statistical analyses on topics of interest to our users, and your data will only be reported in aggregate form, unless we obtain your consent for further use. Additionally, if you choose to provide a free-text comment in your survey response, we may publish your response. We only collect this information when you consent to participate in the survey. Sweepstakes and GiveawaysWhen you enter a contest, you may be asked to provide your name, address, e-mail address, company name, and phone number. This information is used to verify your identity, notify you that your entry has been received, and contact you if you are a winner and/or prize recipient.As part of your entry in our contests, we may choose to provide you with the option of receiving information about our services and publications or other advertisements or information. If you consent to receive this information, we will collect the Personal Information you provided as part of your contest entry for this purpose. You can change, withdraw, or withhold your consent at any time. Posting User Generated ContentYou may also choose to participate in different interactive features we offer. We collect this information for the purpose of facilitating your participation in our interactive features. Applying for a JobWhen you submit a job application via our Sites, we collect your first and last name, phone number, and e-mail address. We also ask you to provide a cover letter and permit you to upload any documents to support your job application. When you submit your cover letter and supporting documentation, we will collect any additional information, including Personal Information, you include in those documents. Register for an EventWhen you register for one of our events, we may ask you to provide your name, address, e-mail address, and phone number. We also may ask you additional information such as age to facilitate registration.In exchange for sponsoring our content, we may provide our third party partners for the event, including advertising partners, with the Personal Information you provide when you choose to register for an event. Other InformationWhen you purchase something from any of our Sites as part of the buying process we collect the Personal Information you give us such as your name, address and email address. We use this information to process and provide you with the items you purchased.We collect this information for the purpose of fulfilling your order, including updating you on your order status. Additionally, if you choose to receive future communications from us regarding our products and offers, we will use the Personal Information you provide through the order process for such purposes. Personal Information Collected via Web-Based TechnologiesBrowser or Device InformationWe automatically receive and record information on our server logs from your browser, or device, including your browser type; mobile phone, tablet or other device type; computer or mobile operating system; the domain of the website that referred you to us; name of your Internet service provider; web pages you visit on the Services; IP address; geo-location information; and standard server log information, cookie information, and the page(s) you request. We also collect information about your interactions with our email messages, such as whether the messages were opened and the links clicked in those emails. We collect this data for the following general purposes: Customizing your user experience; Fulfilling your requests for products and services; Promoting and improving services; Contacting you; Analyzing the effectiveness of ad campaigns and personalization; Personalize content and services; Analyzing the effectiveness of marketing campaigns including offline marketing; Targeted advertising; Optimize ad campaigns and other online or digital media; and Create market and other insights. We also collect your IP address(es) for the purpose of analyzing website trends, administering the Sites, and tracking user movement for aggregate usage analysis. This website usage information enables TSM to provide our users with an ever-improving site, service, and general offering, including with respect to security. Except for our processing of IP addresses as a necessary part of providing the Services, and except where you have provided consent for us to use your identifiable Personal Information, we only use anonymous, aggregate data that cannot be used to identify you individually for our analytics research. Cookies and Web BeaconsWe may set and access TSM session cookies on your computer or device to customize the user experience. “Cookies” are small files placed on your computer or device by your browser and are often used to make websites work, as well as provide information to the website operator.We collect this information for the purpose of conducting analyses on our web traffic and improving a user’s experience while visiting our Sites and targeting advertising. When you first visit our website, you will be asked to consent to our use of cookies, and you can withhold, withdraw, or change your consent at any time. You also have the ability to decline cookies by modifying the settings in your browser. If you decline or disable cookies, please note that certain functionalities of our Sites may no longer work. We place two types of cookies on our Sites: Session Cookies: Session cookies typically only last for as long as your session, which is usually the duration of your current visit to our Sites or for as long as you keep the browser open that was used to visit our Website. We use our session cookies to store information about your visit (referring website, landing page, etc.). We also use session cookies to track and record the number of visits to our Website.Persistent Cookies: Persistent cookies are cookies that remain on your browser and are read when you return to our Sites. We may use persistent cookies to remember your preferences, personalize your experience, and help secure your visit to our Sites. We use persistent cookies to remember the contents of your shopping cart (which is stored for two weeks), and, if applicable, determine if you have access credentials to the Site.We may also use cookies to work with a partner to show you relevant advertising when you visit a partner’s site or application. The third-party partners that generate these cookies, such as Facebook, Instagram, LinkedIn, Twitter, have their own privacy policies and may use their cookies to target advertising to you on other websites based on your visit to our Sites.Communications you receive from us, as well as pages of our websites, may also contain small electronic files known as web beacons (also referred to as clear gifs, pixel tags and single-pixel gifs) that enable us to analyze email and website statistics, including visits and click-through rates. The web beacons only collect aggregate, anonymous data and cannot be traced back to you individually. Third Party Cookies and Web BeaconsSome content or applications on our Sites are served by third parties, including advertisers, content providers, service providers and application providers. These third parties and other of our third-party partners may use cookies alone or in conjunction with web beacons or other tracking technologies already in your browser to collect information about you when you visit our Sites. The information they collect may be associated with your Personal Information or they may collect information, including Personal Information, about your online activities over time and across different websites and other services. These third-party web technologies may also allow us to share our content with you when you visit the websites of our third-party partners, such as Facebook.Among the third party cookies used for purposes of optimizing the Services is Google Analytics, a web analytics service provided by Google, Inc. Google Analytics uses cookies or other tracking technologies to help us analyze how users interact with and use the Services, compile reports on the Services’ activity, and provide other services related to our Services’ activity and usage. The technologies used by Google may collect information such as your IP address, time of visit, whether you are a return visitor, and any referring website. The Services 