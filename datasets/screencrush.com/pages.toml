["https://screencrush.com/french-connection-censored"]
title = "‘The French Connection’ Is Censored on Streaming"
description = "And some fans are very upset about it."
full_description = "‘The French Connection’ Is Censored on Streaming, and Some Fans Are Not HappyCody McintoshCody McintoshPublished: June 7, 2023FoxShare on FacebookShare on TwitterWilliam Friedkin’s 1971 film The French Connection is now hailed as a classic of the crime genre. Unfortunately, it's definitely also a product of its time. While using slurs is never okay, it was definitely more socially acceptable as a whole back in the 1970s. As a result, they’ve shown up a lot frequently in older movies. Sometimes, they’re even used by protagonists or people we’re supposed to otherwise connect with. That’s the case with Gene Hackman’s cop character, Popeye Doyle, in The French Connection.The film is a fictional account of a real-life case, where a plot to smuggle drugs into New York from France was uncovered. It also features one of the most famous car chases in the history of cinema. It involves Doyle, in a car, chasing an elevated train across New York City.20th Century Fox20th Century Foxloading...READ MORE: ’70s Classics That Couldn’t Even Get Made TodayIn a key scene Hackman’s Popeye Doyle uses the n-word — and although the exact specifics of who removed it or why have yet to be uncovered, fans have discovered that the version of the film currently streaming on the Criterion Channel, has excised this slur. (Fans have also discovered that the print of the film currently available on Apple’s iTunes store is censored as well.)Criterion is typically known for restoring and streaming classic or culturally impactful movies in versions intended by their filmmakers — not the sort of place you expect to find a censored print of a film. Ever since Disney acquired 20th Century Fox and the Fox film library, the company has controlled the rights to The French Connection, although it’s not yet clear whether they were the ones responsible for removing the offending word from the film.Perhaps what we're seeing here is a kind of historical revisionism that seeks to deny a problematic past in the pursuit of more money. While it would be better if Hollywood never had a phase where this was okay in the first place, that's not the case. But those who do not acknowledge history are doomed to repeat it.Get our free mobile appThe Best Oscar Best Picture Winners EverMore than 90 films have earned the title of Best Picture from the Academy Awards. These are the best of the best.Filed Under: Disney, Gene Hackman, The Criterion Channel, The French Connection, William FriedkinCategories: Movie News"
