["https://screencrush.com/razzies-2025-winners"]
title = "‘Madame Web’ Wins Worst Picture of the Year Award"
description = "See the full list of winners from the annual Razzie awards."
full_description = "‘Madame Web’ Wins Worst Picture of the Year AwardMatt SingerMatt SingerPublished: February 28, 2025SonyShare on FacebookShare on TwitterMadame Web is the worst film of the year.At least that was the pick for that dubious honor by the Razzie Awards, the longest-running bad-movie alternative to the Oscars. Every year the members of the Razzies (which is literally anyone who wants to pay to be a member) votes on their picks for the worst films of the year. And this year the consensus choice for the dregs of cinema was the disastrous Spider-Man spinoff starring Dakoja Johnson as a clairvoyant EMT worker.Johnson herself won the Razzies’ Worst Actress prize, and the film also won the Worst Screenplay award.The other big Razzie winners of the year (we’re using that term loosely here, of course) included Jerry Seinfeld’s Unfrosted, which was given the awards for Worst Actor (for Seinfeld himself) and Worst Supporting Actress (for Amy Schumer), and the notorious Joker: Folie à Deux, which received the awards for Worst Sequel and for Worst Onscreen Couple for stars Joaquin Phoenix and Lady Gaga.With very few historical exceptions, the winners of the Razzies typically stay away from the ceremony and ignore the awards entirely. But one of this year’s winners decided to embrace his prize.That’s Francis Ford Coppola, who won the Worst Director Razzie for his Megalopolis, a costly (but extremely ambitious) sci-fi flop that Coppola financed himself with millions of dollars from his personal fortune after decades of attempts to mount the film through more traditional financing.“I am thrilled to accept the Razzie award” wrote Coppola on his Instagram account. “In this wreck of a world today, where ART is given scores as if it were professional wrestling, I chose to NOT follow the gutless rules laid down by an industry so terrified of risk that despite the enormous pool of young talent at its disposal, may not create pictures that will be relevant and alive 50 years from now. What an honor to stand alongside a great and courages filmmaker like Jacques Tati who impoverished himself completely to make one of cinema’s most beloved failures, PLAYTIME!”“Let us remind ourselves,” Coppola added, “that box-office is only about money, and like war, stupidity, and politics has no true place in our future.”READ MORE: The Worst Razzie Nominees in HistoryPlaytime never won a Razzie (the awards weren’t even created until 1981) but nonetheless I admire Coppola’s defiant spirit, just like I admired that same spirit in Megalopolis, even if the movie itself was occasionally incomprehensible and often bizarre. In other words: An easy target for the Razzies but not one of the truly bad films of 2024. (Madame Web, on the other hand, was really and truly terrible.)Here’s the full list of winners from this year’s Razzies:Worst PictureBorderlands Joker: Folie a Deux Madame Web - WINNER Megalopolis ReaganWorst ActorJack Black, Dear SantaZachary Levi, Harold and the Purple CrayonJoaquin Phoenix, Joker: Folie a DeuxDennis Quaid, ReaganJerry Seinfeld, Unfrosted - WINNERDakota Johnson - LA Premiere - Madame Web - 2024 - Sony Pictures - GettyDakota Johnson - LA Premiere - Madame Web - 2024 - Sony Pictures - Gettyloading...Worst ActressCate Blanchett, BorderlandsLady Gaga, Joker: Folie a DeuxBryce Dallas Howard, ArgylleDakota Johnson, Madame Web - WINNERJennifer Lopez, AtlasWorst Supporting ActorJack Black, BorderlandsKevin Hart, BorderlandsShia LaBeouf, MegalopolisTahar Rahim, Madame WebJon Voight, Megalopolis, Reagan, Shadow Land & Strangers - WINNERUNFROSTEDNetflixloading...Worst Supporting ActressAriana DeBose, Argylle and Kraven the HunterLeslie Anne Down, ReaganEmma Roberts, Madame WebAmy Schumer, Unfrosted - WINNERFKA twigs, The CrowWorst DirectorS.J. Clarkson, Madame WebFrancis Ford Coppola, Megalopolis - WINNERTodd Phillips, Joker: Folie a DeuxEli Roth, BorderlandsJerry Seinfeld, UnfrostedWarner Bros.Warner Bros.loading...Worst Onscreen ComboAny Two Obnoxious Characters (But Especially Jack Black), BorderlandsAny Two Unfunny “Comedic Actors,” UnfrostedThe Entire Cast of MegalopolisJoaquin Phoenix and Lady Gaga, Joker: Folie a Deux - WINNERDennis Quaid and Penelope Ann Miller, ReaganWorst Prequel, Remake, Rip-Off or SequelThe Crow Joker: Folie a Deux - WINNER Kraven the Hunter Mufasa: The Lion King Rebel Moon: Part 2 — The ScargiverSonySonyloading...Worst ScreenplayJoker: Folie a Deux Kraven the Hunter Madame Web - WINNER Megalopolis ReaganGet our free mobile appGood Movies That Won Razzie AwardsThe Razzies are supposed to be awards for the worst in cinema. So why did they give awards to these titles?!?Filed Under: Francis Ford Coppola, Joker 2, Madame Web, Megalopolis, Razzie Awards, Razzies, The Razzies, UnfrostedCategories: Awards, Movie News"
