["https://screencrush.com/things-90s-kids-did"]
title = "Things We Did in the ’90s That Would Confuse Kids Today"
description = "Today's youth have everything at their fingertips thanks to smart devices and modern conveniences. Here are some of the things we did in the '90s that would likely have them scratching their heads."
full_description = "Things We Did in the ’90s That Would Confuse Kids TodayDanielleDanielleUpdated: February 25, 2025CanvaShare on FacebookShare on TwitterEvery generation has its “quirks,” that you basically need to be there to understand. The ’90s were no different. It was a much simpler time though (especially compared to today.) Phones were attached to walls, music and movies were stored in cabinets, and you needed a printed map to get somewhere unfamiliar.What a time to be alive! In fact, it’s strange to think that this was once a way of life that we considered modern.Without all of the bells and whistles of today's technology, things moved a little slower. And because of that, we did things a little differently. For example, remember when you wanted to watch a new movie at home you had to go here?The Weinstein Company And Blockbuster Make Rental Release AgreementGetty Imagesloading...Today, even their website sits vacant.Before Streaming There Was BlockbusterBefore the days of Netflix, Hulu and all the other streaming services that allow us to watch whatever we want whenever we want it, we had Blockbuster. A retailer that housed VHS and DVDs that would could physically rent and take home. It was like a library for movies, and was the place to take the family on a Friday to pick out something that everyone could enjoy.REPLAY | Do You Remember These Iconic ’90s Commercials?Something like that seems silly to kids today that literally everything at their fingertips. Let’s take a look at some other things we did in the '90s that kids today just wouldn't understand.Things We Did in the '90s That Kids Today Wouldn't UnderstandToday's youth have everything at their fingertips thanks to smart devices and modern conveniences. Here are some of the things we did in the '90s that would likely have them scratching their heads. Gallery Credit: Danielle KootmanRELATED | Things You'd Find in Every '90s Home Back in the DayAhh, the good ol’ days. What was your favorite thing about the era?Whether it’s that catchy commercial or the sound of your internet starting up, there are some distinctive sounds that every ’90s kid will remember.Sounds That Every '90s and 2000's Kid Will RememberLet's take a listen down memory lane to some classic sounds of the '90s and early 2000s.Gallery Credit: Danielle KootmanGet our free mobile appWhile we're reminiscing the ’90s here, we've got to take a look at some of the toys that we were obsessed with as kids.'90s Toys That Spark Instant Childhood MemoriesThis '90s nostalgia is sure to make you feel like a kid again.Gallery Credit: Danielle Kootman Source: Things We Did in the ’90s That Would Confuse Kids Today Filed Under: NostalgiaCategories: Lists, Original Features, Special Features"
