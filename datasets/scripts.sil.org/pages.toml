title = "Download - Latin, Cyrillic, and Greek Fonts"
description = "A range of fonts designed for literacy, linguistics, translation and language development"
full_description = 'DownloadMain Latin, Cyrillic, Greek FontsOur main Latin, Cyrillic, Greek fonts are available for download:Charis SILDoulos SILGentium PlusAndikaGalatia SILModified Fonts for Special UsesIn addition to the font subsets described below, some modified fonts are available for a specific purpose or region. All of these fonts are derivatives made from the “parent” font.NOTES:These fonts were created using SIL TypeTuner and they cannot be tuned further.Also, any of our Latin, Cyrillic, or Greek fonts that have had the linespacing changed to a tighter setting could potentially have "clipping" of diacritics if there is more than one diacritic above a tall character. This is normally just a screen problem. When the page is printed, the diacritics will print.CompactThese fonts were created using TypeTuner Web by setting their Line spacing set to “Tight”. They cannot be TypeTuned again.Charis SIL CompactDoulos SIL CompactGentium Plus CompactAndika CompactLiteracy and Literacy CompactThese fonts were created using TypeTuner Web by setting the “Literacy alternates” to “true”. The Compact fonts have their Line spacing set to “Tight”. They cannot be TypeTuned again. Note that the Gentium Plus Literacy Compact fonts have been renamed to Gentium Plus Lit Comp due to technical limitations on font name length.Charis SIL LiteracyCharis SIL Literacy CompactDoulos SIL LiteracyDoulos SIL Literacy CompactGentium Plus LiteracyGentium Plus Lit CompAmericas AreaThese fonts were created using TypeTuner Web by setting the “Uppercase Eng alternates” feature to “Capital N with tail”, “Barred-bowl forms” to “True”, “Chinantec tones” to “True”, “Show deprecated PUA” to “Through Unicode 5.1”. Line spacing metrics are modified to match Mexico Branch legacy font line spacing. They cannot be TypeTuned again.Charis SIL AmAreaDoulos SIL AmAreaGentium Plus AmAreaAndika AmAreaAmericas Area LiteracyThese fonts were created using TypeTuner Web by setting the “Uppercase Eng alternates” feature to “Capital N with tail”, “Barred-bowl forms” to “True”, “Chinantec tones” to “True”, “Show deprecated PUA” to “Through Unicode 5.1” and “Literacy alternates” to “true”. Line spacing metrics are modified to match Mexico Branch legacy font line spacing. They cannot be TypeTuned again. Note that the Gentium Plus Literacy AmArea fonts have been renamed to Gentium Plus Lit AmArea due to technical limitations on font name length.Charis SIL Literacy AmAreaDoulos SIL Literacy AmAreaGentium Plus Lit AmAreaMaliThese fonts were created using TypeTuner Web by setting the “Capital N-left-hook alternate” feature to “lowercase style”, “Open-O alternate” to “Top serif”. Line spacing metrics are modified to match SIL Mali legacy font line spacing. They cannot be TypeTuned again.Charis SIL MaliDoulos SIL MaliGentium Plus MaliAndika MaliOther Mali resources include mapping files to convert from the SIL Mali standard legacy fonts to Unicode encoding and Keyman keyboards developed for use in Malian languages.TatThis font was created using TypeTuner Web by setting the “Capital H-stroke alternate” to “Vertical stroke”. It cannot be TypeTuned again.Charis SIL TatDoulos SIL TatGentium Plus TatAndika TatFont SubsetsPLEASE NOTE:The special font subsets described here are based on version 5 of the fonts, not the current version. They should continue to work well. We do not currently plan to provide subsets based on version 6, as the need for subset fonts has been considerably reduced by current font and browser technology. If you have a particular need for any of these fonts to be updated to version 6 please contact us and describe your need.SIL’s Non-Roman Script Initiative has created comprehensive fonts for Latin and Cyrillic character sets. They are very large fonts that cover just about every need we know of in the Latin and Cyrillic world. Now, in the age of mobile devices and web usage, there is a need for fonts that are small and compact.We have provided subsets for Africa, Americas, Asia/Pacific, Europe/Eurasia, Vietnam, Phonetic, Cyrillic (Basic) and Cyrillic Extended. With the exception of the Phonetic font, the font subsets are intended for orthographic use only. We have not put anything in the other subsets for phonetic, transliteration, or transcription use. For those purposes, use the Phonetic subset. For more information on the contents and use of the subsets – and known issues – see our dedicated Font Subsets page.All these font subsets are available in one package: Charis SIL, Doulos SIL, Gentium Plus, Andika Font Subsets 5.000for all platforms ZIP | 12.63 MB | 19 Dec 2016'
