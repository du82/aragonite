title = "Input Utilities"
full_description = "Many of these items are outdated, but they are provided here for historical purposes. We recommend using the Keyman tool for keyboards on all platforms. Ukelele John Brownie, 2019-09-05 Ukelele is a Unicode keyboard layout editor for Mac OS X versions 10.2 and later. The latest beta release version, 3.4b2, is available for download, and can be used on Mac OS X 10.9 and later. The previous stable releases of Ukelele, version 3.3 (for macOS 10.9 and later), version 3.2.7 (for Mac OS X 10.8 and later), version 2.2.8 (universal binary, for Mac OS 10.4 and later) and version 1.8.4 (universal binary, for Mac OS X 10.2 and later) are still available for download. This version works on Mac OS X 10.9 (Mavericks) and later. Keyman Joan Wardell, 2007-04-23 Keyman is a keyboard management utility that makes it practical to input many different languages in almost any Windows application. Keyman allows you to have arbitrarily long input sequences and to have diacritics typed after the base character. SILKey for Macintosh Jonathan Kew, 1998-03-11 SILKey is a suite of programs that can be used to modify the behavior of the Macintosh keyboard when typing in any standard Macintosh word processor or other text-editing program. Written by Jonathan Kew, it is very similar to, but is not based on, the Keyman program for Windows. KeyLayoutMaker: Jonathan Kew, 2006-06-01 KeyLayoutMaker is a Perl script designed to create Mac OS X keyboard layout files, based on simple lists of keystrokes and required Unicode characters. It is particularly suited to creating layouts for syllabic scripts. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
