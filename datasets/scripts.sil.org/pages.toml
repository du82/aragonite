full_description = "You are here: Rendering > Technologies > OpenType Short URL: https://scripts.sil.org/RenderingOpenType Uniscribe versions Lorna A. Priest, Joan Wardell, 2010-11-01 This chart lists various versions of Uniscribe (usp10.dll), what software they were distributed with and some of the complex scripts they support. Replacing your Uniscribe dll Joan Wardell, Lorna A. Priest, 2007-05-23 Updating your version of Uniscribe is not recommended by Microsoft. However, if you need to update your version of Uniscribe (to provide updated script support) these instructions may prove helpful to you. Microsoft VOLT UI Overview Paul Nelson, 2001-09-02 This document is to provide an overview and understanding of the VOLT menus and UI. Microsoft VOLT Tutorial (VOLT – Visual OpenType Layout Tool) Paul Nelson, 2001-09-02 VOLT is Microsoft’s tool for adding OpenType tables to fonts. It provides a graphical UI that enables a person to visualize what is going to happen with the substitutions and positioning lookups when they are created. VOLT also includes a proofing tool that permits the functionality of the font to be tested without having to install the font in the system. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
