["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontfaq_ipa93%26site_id%3Dnrsi.html"]
title = "SIL IPA and SIL IPA93 (legacy) fonts – FAQ"
full_description = 'Please note that the Doulos SIL font and Charis SIL font fonts provide Unicode IPA support. However, you must convert existing data using the "SIL IPA93 Fonts" to Unicode before using the Doulos SIL or Charis SIL font (see SIL IPA93 Data Conversion). For a good discussion on making the decision of which font to use, read IPA Transcription with SIL Fonts. Question: I have MS Word documents which use your SIL IPA93 fonts, but I want to begin using Unicode. Can you tell me how to convert my data to Unicode? Answer: As you have implied, documents which were created (encoded) with legacy fonts are not compatible with Unicode fonts. You not only need to use a Unicode font, you will need to convert your data to Unicode. Since you have MS Word documents it might be a straightforward problem. These instructions should work if you have MS Word 2003: We hope your data will have converted correctly! These instructions are for converting your data in one document. Once you have tried it for one document and understand the concepts, you might want to use the Bulk Word Document Converter. (Start / Programs / SIL Converters / Bulk Word Document Converter) to do all your documents in one go. At this point we do not have step-by-step instructions, but basically you select your documents, choose your fonts, converter and font to apply. If you do not have MS Word 2003 and want to try an older version of SIL Converters 2.5, you can try: SILConverters — Obsolete version. However, this version does not always work correctly and we are not providing any support for this product. Question: I have plain text files which use your SIL IPA93 fonts, but I want to begin using Unicode. Can you tell me how to convert my data to Unicode? Question: I have Standard Format Marker (sfm) text files and want to convert only one or two of the sf markers from an SIL IPA93 encoding to Unicode. Can I do that? The SILIPA93.EXE is a setup program containing the SIL IPA93 fonts and documentation. All you need to do is double click on it with the mouse. This will install the fonts and documentation into Windows for you. You do not need to use Control Panel / Fonts.'
