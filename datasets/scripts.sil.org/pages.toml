["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dmappingfiles%26site_id%3Dnrsi.html"]
title = "Mapping Files"
full_description = "We have moved all the TECkit mapping files to a GitHub repository. That repo is found here: https://github.com/silnrsi/wsresources. You are welcome to browse and find mapping files or to submit your own mapping files. The mapping files on this page continue to be available. However, they now come directly from the GitHub repo rather than a static download. These mapping files were created for converting data to Unicode. Some, but not all, will also convert data from Unicode back to the legacy encoding. These mapping files are for use with TECkit applications. You can do this using the program TECkit or SILConverters 4.0. Compiled (and uncompiled) conversion tables for each set of fonts is included here, which maps SIL Burkina Faso encoded data to Unicode and vice versa. Compiled (and uncompiled) conversion tables for each set of fonts is included here, which maps SIL Cameroun encoded data to Unicode and vice versa. Compiled (and uncompiled) conversion tables for each set of fonts is included here, which map Tchad2000 and Chad95 encoded data to Unicode (not vice versa). Although each mapping file is bi-directional, conversion from Unicode back into the legacy encoding isn't recommended, as there would be some poor diacritic choices back in the legacy encoding. Each mapping file is currently only intended to support legacy to Unicode conversion. Compiled (and uncompiled) conversion tables for each set of fonts is included here, which maps SIL Côte d’Ivoire encoded data to Unicode and vice versa. A compiled (and uncompiled) conversion table is included here, which maps SIL ECG encoded data to Unicode and vice versa. This mapping file is Unicode 5.0 compliant. Three TECkit mapping files (compiled and uncompiled) are included in this package. They are intended for use where text has been input “phonetically” as a syllable (be, ppii, etc.) and conversion to fidel is desired (, , etc.). This mapping file enables conversion of custom-encoded text using the GeezTypeNet font to Unicode codepoints."
