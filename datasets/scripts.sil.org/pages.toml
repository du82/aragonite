title = "Are you ready to learn about how to use Unicode?"
full_description = "Sometimes, a conversion to Unicode is almost completely transparent to a user. They’ll be able to continue working almost the same way as they always have. However, it doesn’t always work that way. As you think through when to do a conversion, find out how much you’ll have to learn. This may include Most everyone can learn these things. It doesn’t take a lot of time, but it will slow you down for a couple weeks or in rare cases a few months. So, don’t do a Unicode conversion when you have pressing deadlines coming up, if you can help it. Plan ahead for a time when the conditions are right for an unhurried change-over. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
