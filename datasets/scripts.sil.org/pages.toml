["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dkeyboardinstallationanduse%26site_id%3Dnrsi.html"]
title = "Keyboard Installation and Use"
full_description = "Computers were designed to work primarily with English. The problem is that many of us wish to input other languages into the computer. This is possible by switching keyboards (not the physical keyboard) on the computer. In this overview we give details of how to use Microsoft and Keyman keyboards. Microsoft keyboards are probably preferable to use if you wish to input text in one of the languages for which they have supplied a keyboard. If you need a keyboard for some other language, or you do not like Microsoft's layout, you may want to use a keyboard manager like SIL's Keyman. Keyman allows you to create your own customized keyboard, or if you choose, you may use a Keyman keyboard someone else has created. Microsoft provides numerous Unicode keyboards as part of their operating system language support. These have to be selected and installed individually. You may need your Windows installation CD for this. The keyboard layouts are not provided on the CD, but are available on the Internet. Next you will select a language and keyboard. There may be several keyboards available for a given language. You can install as many as you want. Go to Start / Settings / Control Panel / Regional Options. You should already be at the General tab. Select the language you want to enable. You may need your Windows installation CD for this step. Follow the installation instructions. Next, on the Input Locales tab, click Change... and Add... (you can add multiple layouts for a given locale). Select Enable indicator on taskbar (for Win 9x and Win 2000, in lower left corner) (or for Vista, WinXP or Win 2000 with Office XP enabled, click on Language Bar and select Once you have the Visual keyboard open, you can either type using keys or just mouse click on each key and it will insert the character you clicked on - in whatever app you have open at the time. If you have Internet Explorer 5 or later, such keyboards can be downloaded from Microsoft using one of these two methods: On some machines, for reasons we don't understand, some languages are not listed in Windows Update. In that case, try this method:"
