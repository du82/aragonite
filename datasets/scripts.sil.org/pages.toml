["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Denccnvtrs%26site_id%3Dnrsi.html"]
title = "SILConverters 4.0"
full_description = "This page is now obsolete and remains here for historical purposes. The new SIL Converters home page is at: https://software.sil.org/silconverters/ This package provides tools through which you can change the encoding, font, and/or script of text in Microsoft Word and other Office documents, OpenOffice and LibreOffice documents, XML documents, and SFM text and lexicon documents. It also installs a system-wide repository to manage your encoding converters and transliterators (TECkit, CC, ICU, Perl, or Python based, as well as support for adding custom transduction engines). For developers, it provides a simple COM interface to select and use a converter from the repository. It is easy to use from VBA, C++, C#, Perl, Python or any .NET/COM enabled language. The core EncConverters assembly is fully integrated with SIL FieldWorks, Speech Analyzer, Phonology Assistant, Adapt It and OneStory Editor software. It provides the same system-wide registry of installed and available encoding converters for all of these user programs. Additionally the package includes some extra utilities such as a clipboard converter for manipulating text between cut and paste operations. The following picture illustrates the suite of tools, utilities, and applications that are available and how they interact: If you are an end user, you are probably most interested in how to use EncConverters with client applications—for example: This version (4.0) was released to fix various bugs including most significantly the removal of the core EncConverters assembly from the Global Assembly Cache. From v4.0 and following, client applications will redistribute the core assemblies ECInterfaces.dll and SilEncConverters.dll with their applications directly. They can still share the same global system repository of activated converters, but there will be less dependency between the various clients in terms of release requirements. As of v3.1.1, a new transduction engine was added that provides support for the webpage-based converters in the Scientific and Technical Hindi Google Group. The Files section of that group contains a number of webpage-based encoding converters and transliterators for numerous Indic legacy encodings. The conversion code embedded in these web-pages can now be used to convert data with any SIL Converters client application (e.g. the Bulk Word Document Converter) by using the new Technical Hindi Html EncConverter Add-in. To activate this new add-in be sure to check the Maps and Tables, Indic converters feature during installation. Once installed, you can read Help for Technical Hindi (Google group) Html Converter Plug-in (in Start, All Programs, SIL Converters, Help) for further instructions."
