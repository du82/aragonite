["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Drenderingtechnologies%26site_id%3Dnrsi.html"]
title = "Technologies"
full_description = "Uniscribe versions Lorna A. Priest, Joan Wardell, 2010-11-01 This chart lists various versions of Uniscribe (usp10.dll), what software they were distributed with and some of the complex scripts they support. Replacing your Uniscribe dll Joan Wardell, Lorna A. Priest, 2007-05-23 Updating your version of Uniscribe is not recommended by Microsoft. However, if you need to update your version of Uniscribe (to provide updated script support) these instructions may prove helpful to you. Microsoft VOLT UI Overview Paul Nelson, 2001-09-02 This document is to provide an overview and understanding of the VOLT menus and UI. Microsoft VOLT Tutorial (VOLT – Visual OpenType Layout Tool) Paul Nelson, 2001-09-02 VOLT is Microsoft’s tool for adding OpenType tables to fonts. It provides a graphical UI that enables a person to visualize what is going to happen with the substitutions and positioning lookups when they are created. VOLT also includes a proofing tool that permits the functionality of the font to be tested without having to install the font in the system. Download WorldPad Sharon Correll, 2003-02-07 WorldPad is a basic text editor whose main distinction is the ability to display text in complex scripts using Graphite, a programmable rendering engine particularly suited to complex minority scripts. Graphite Sharon Correll Graphite is a project under development within SIL’s Non-Roman Script Initiative and Language Software Development groups to provide rendering capabilities for complex non-Roman writing systems on the Windows platform. Graphite: Frequently Asked Questions Sharon Correll, 2003-04-30 What is Graphite? How does Graphite differ from OpenType? How can I make a Graphite font? And more... Download Graphite Fonts Sharon Correll Download fonts that can be used to try out the Graphite rendering engine. Graphite in OpenOffice.org Tim Eves, 2010-04-08 OpenOffice 3.2 uses SIL Graphite software! This project integrates the Graphite smart font rendering engine for complex non-roman scripts and writing systems into OpenOffice.org, the well-known cross-platform FLOSS office suite."
