["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate02%26site_id%3Dnrsi.html"]
title = "NRSI Update #2 – September 1996"
full_description = "In the previous TTO Update (#2), we indicated that the NRSI research into TTO is proceeding along 3 lines: Middle East Win95 subset, dialog with Microsoft on the “TTO APIs”, and our own TTO font compiler. Here are updates for each area, followed by a brief analysis of our understanding of (and concern about) Microsoft’s direction for TTO. MEW95 is due to be shipped in September. According to Microsoft, they have had their last beta cycle on this product, so we should see the real thing soon. Based on experiments with beta releases, it appears that much of the Arabic script behavior is implemented as part of the MEW95 operating system rather than being imbedded into the TTO tables in the fonts. For example, the fact that certain letters have no initial or medial forms (and thus do not “join” with letters on their left) appears to be part of Win95. If Win95 simply looked at the TTO tables to determine this, then it would be feasible to change the behavior of such letters. We often get requests from people who need a font “just like standard Arabic except these few differences.” It was my hope that MEW95 would have depended on TTO sufficiently that these kinds of requests would be easy to meet by simply modifying the TTO tables in the font. Instead, it looks like we are in the same games as Windows 3.1: If the extra letters you need behave just like some in the font that you don’t need, then we can replace the glyphs. We cannot change the behavior. Please note that the above is based on yet-incomplete research using beta releases of MEW95. More research is needed on the final release in order to confirm these conclusions. We have had a chance to review a draft specification of a new set of APIs being developed by Microsoft to enable application developers to take advantage of TrueType Open technology. The APIs, known collectively as the TTO Services Library, make it much easier for an application to read and process the TTO tables in a font. The APIs take care of the nitty gritty detail of decoding the tables and actually doing the glyph substitutions or repositioning or whatever that the tables call for."
year_published = 1996
