full_description = "SIL IPA and SIL IPA93 (legacy) fonts – FAQ 2004-03-09 Frequently Asked Questions about SIL IPA and SIL IPA93 fonts. Keyboarding issues as related to SIL fonts – FAQ Frequently Asked Questions about keyboarding issues as related to older SIL fonts. Ezra SIL Fonts v.1 and 2 (Obsolete) Known Issues NRSI, 2007-06-15 The answer to your problems with using the Ezra SIL Unicode fonts v.1 may be found here. This guide gives some requirements for best use of the fonts and lists OpenType and type design issues. Ezra SIL Fonts ver. 2.5 Known Issues NRSI staff, 2007-06-15 This technical guide lists OpenType, type design, and closed issues. Using SIL Fonts in Documents and Publications – FAQ Frequently Asked Questions about using SIL fonts in publications. Ezra SIL Frequently Asked Questions for Office 2000/XP — FAQ Christopher Samuel and NRSI staff, 2007-06-15 Frequently Asked Questions about Hebrew and the Ezra SIL fonts. Check here if you are have questions about the Ezra SIL fonts and are using Office 2000 or Office XP. SIL Unicode Roman Fonts – FAQ and Known Issues NRSI staff, 2007-01-31 Known Issues in SIL Unicode Roman Fonts and Frequently Asked Questions with regard to SIL Unicode Roman Fonts (such as Doulos SIL and Charis SIL). General Font FAQ NRSI staff, 2007-11-14 Questions which are more general and not specifically about individual SIL fonts. SIL Greek Font System Support NRSI staff, 2002-12-09 Frequently Asked Questions and Known Issues relating to the SIL Greek Font System (legacy). Ezra SIL Frequently Asked Questions for Office 2003 — FAQ Christopher Samuel and NRSI staff, 2007-06-15 Frequently Asked Questions about Hebrew and the Ezra SIL fonts. Check here if you are have questions about the Ezra SIL fonts and are using Office 2003. Using SIL fonts in other Operating Systems (non-Windows) – FAQ Frequently Asked Questions about using SIL fonts in non-Windows operating systems. Font linking reg keys – FAQ What are the registry keys for listing