["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dunibookwalthru%26site_id%3Dnrsi.html"]
title = "Unibook: Introductory Walkthrough"
full_description = "Navigate to C:Program FilesUnibook, unzip the file you just downloaded and then right-click on DeleteUnibookRegistry.inf and select Install. Also in C:Program FilesUnibook, double-click unibook.exe. You’ll need to enter your name and company, click on View License / OK / Accept. Unibook will be open. Finally, Unibook can save your configuration (i.e., a given set of configuration files) in a Unibook Project (.UPR) file. All Toolbar buttons are shortcuts for menu items. Pictures of the buttons will be included below to indicate their functions. Normally Unibook is used to display the Unicode character set. But it also has knowledge of other internationally recognized character sets. As such it can be used as a “Codepage viewer”: When you want to return to Unicode character set, select codepage 1200 or select Unibook or ISO chart styles, or press again. Use the above to locate some characters that Unibook is rendering using Code2000 to prove that Exercise 1 was successful. Unicode defines various properties for all its characters. Microsoft Windows also define character properties. Unibook can search for characters with specific properties. You can turn Unibook into a font viewer so that it ignores the current Combining Font List (.CFL) configuration and displays only those characters supported by a given font. The Toolbar and Go To menu provide other navigation aids, e.g., go to first/last/next/previous page, section, plane, etc., as well as a general “Go back” (Backspace, ) function Unibook contains implementations of Unicode’s “bidi” and “linebreak” algorithms. You can experiment with these algorithms, trying out different data sequences. Important note: Both of these tools use “pseudo-data” rather than actual Unicode data. The pseudo-data mechanism assigns various Unicode properties to the ASCII characters, and then you enter the sequence of ASCII characters that mimics the properties of the sequence of data you are interested in. For example, if you wanted to see how the bidi algorithm dealt with a Hebrew word embedded in between two English words, then you might enter the data sequence “abcde GHIK fghij” because in the Unibook’s bidi sample implementation, letters a-z represent characters with bidi property “L” (e.g., English letters), while G-Z stand for characters with bidi property “R” (which is what the Hebrew letters have.) Using Tools / Bidi..., Unibook shows that that sequence would display as “abcde KIHG fghij”, thus we see the Hebrew letters now in visual order."
