["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dwsi_guidelines%26site_id%3Dnrsi.html"]
title = "WSI Guidelines"
full_description = "A complete index of all SIL's contributions to UNESCO‘s project Initiative B@bel can be found here. From January to October of 2003, SIL International was engaged in a cooperative project with UNESCO as part of UNESCO’s Initiative B@bel effort. The goal was to enable the development of complex script support in information and communication technologies (ICTs). This was done through preparation of documents to guide development, technical tools for complex script support, and two example script implementations. All of these are available from a general UNESCO page. This is the primary document of the project, and describes the key issues around supporting complex scripts in ICTs. It is intended as a guide to the planning and development of writing system implementations. It introduces a model for writing system implementations, outlines the development process, and highlights keys to project success. These Guidelines are written primarily for policy makers and professionals, but includes introductory technical material in later sections. This covers important topics regarding encoding, keyboarding and rendering. It gives specific guidance on working with Unicode™, including how to propose new characters for submission. The complete document is available on these pages, but can also be downloaded in both Word and PDF formats: © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
