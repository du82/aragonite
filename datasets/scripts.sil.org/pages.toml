["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dkeyman32to60tutorial%26site_id%3Dnrsi.html"]
title = "Converting Keyman 3.2 Keyboards to Keyman 6"
full_description = "This page is obsolete. It may still be useful for historical purposes. For using the Keyman program, please go to the Keyman site. Getting your old Keyman 3.2 keyboards to work in Keyman5 or 6 is not difficult. There are just a few modifications needed, as discussed below. Whether you should convert your keyboards so that they can be used in Windows 2000 and higher is a question that should also be considered. It may be better to encourage users to move to new Unicode keyboards, rather than continue producing texts which must be converted. But there are legitimate reasons for using legacy fonts and keyboards, so this is how you get the keyboards to work. Keyman’s editor TIKE will walk you through most of the necessary changes, so the easiest way is to follow the compile errors. Keyman 5 and 6 now create compiled versions of the keyboard, which is the required file to run the keyboard. It has the extension “.kmx”. You can also distribute the source, the “.kmn” file, but it is not necessary. It is also not necessary to distribute the .bmp file with the compiled Keyman keyboard. “kmp” files are also new. These are installers which include installing Keyman as well as the keyboards. Follow instructions at Keyboard Installation and Use using Icelandic or Africaans as the input language of choice. Don’t associate an old Keyman 3.2 keyboard with a language (input locale) unless it is the same codepage (not likely). Don’t mix ANSI and UNICODE in the same keyboard unless the output is identical to the codepage for that language. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
