["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate15%26site_id%3Dnrsi.html"]
title = "NRSI Update #15 – June 2001"
full_description = "I was born in northern California and adopted by my parents before my first birthday. I grew up in a small town called Taft, in central California. My parents had one “natural”-born son, had already adopted a boy by the time they adopted me and adopted another boy and two girls after me. It was a wonderful way to grow up! I remember kids at school asking me what it was like to be adopted. My response was “what’s it like to not be adopted?” I knew how much my parents loved me and wanted me before they’d ever met me! How much more loved could a kid be! In October 1994, I moved to Houston, Texas to be near my two sisters and their families who had moved to the area earlier in the year. I learned about SIL from some friends and made a trip back to California in the summer of 1995 to meet with some people from SIL. Little did I know, I was to meet my future parents-in-law at that time. A year later, I came to the Dallas area to visit with the couple I had met. I met their son, Drew, at that time. We were married the following year. I came to work with the NRSI team in February 2001 as the administrative assistant. I have a lot to learn about the work that goes on here and it is an exciting challenge. The people here are great and are very willing teachers! Over the next couple of months, one of these willing teachers, Peter Martin, will be teaching me how to create and manage web content. The Syriac Computing Center (SyrCOM) of Beth Mardutho has released version 1.1 of a collection of OpenType-based Syriac fonts for use with Windows XP, Office XP, or Internet Explorer 6. The fonts are free, though SyrCOM encourages voluntary donations. Answer: Yes and No! You will not be able to write Syriac under these platforms as they are not Unicode-compliant. But you can read Syriac texts and web pages using Internet Explorer 6.0. Answer: Classical Syriac, Swadaya (the Eastern Neo-Aramaic dialect of the Assyrians and Chaldeans), Turoyo (the Central Neo-Aramaic dialect of the Syriac Orthodox of Tur Abdin), Garshuni (Arabic written in Syriac), Christian Palestinean Aramaic (also called Palestinean Syriac)."
