title = "Legacy Fonts and Keyboards"
full_description = '''This page is now obsolete. It is provided for historical information. For using the Keyman program, please go to the Keyman site. Most of these keyboards are now available for Unicode from the https://keyman.com/ site. The fonts and keyboards on this page are considered "legacy" solutions. As such, they are made available for use and downloading. Unicode solutions are encouraged and are being developed for fonts and keyboards. Also available for some legacy systems are mapping files to convert data encoded in a legacy font to Unicode. There are two separate solutions for the Mali Standard font, one for the Qwerty and the other for the Azerty (French) keyboard. The MaliStdQwerty.zip file contains the 'English' keyboarding solution for the Qwerty keyboard. The Mali-Clavier.zip file contains the 'French' keyboarding solution for the Azerty keyboard. To convert data using the Mali Standard font to Unicode there is a TECKit mapping file to do this, found here. This keyboard is only accessible as part of the font download. It does not use Unicode and will only work with the SIL Vai fonts. This is a separate download from the fonts. These are replacement keyboards for the Keyman 3.2 keyboards which came with the SIL New Tai Lue Font System. They have been compiled for use with Keyman 6. The original keyboards were written for Keyman 3.2 and do not function with Keyman 5 or 6. No corrections or additions have been made to these keyboards. They do not use Unicode and will only work with the SIL New Tai Lue fonts. This is a separate download from the fonts. These are replacement keyboards for the Keyman 3.2 keyboards which came with the SIL Tai Dam Font System. They have been compiled for use with Keyman 6. The original keyboards were written for Keyman 3.2 and do not function with Keyman 5 or 6. No corrections or additions have been made to these keyboards. They do not use Unicode and will only work with the SIL Tai Dam fonts. This is a separate download from the fonts. However, they will only work with the SIL Greek Font System fonts. These are replacement keyboards for the Keyman 3.2 keyboards which came with the SIL Greek Font System. They have been compiled for use with Keyman 6.'''
