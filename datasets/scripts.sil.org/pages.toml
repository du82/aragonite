["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Drenderingprinciples%26site_id%3Dnrsi.html"]
title = "Principles"
full_description = "The following presentation was prepared for the Non-Roman Technical Consultation 2001. It presents issues and solutions for creating quality pdfs. This checklist was written as a starting point to figure out what features SIL needed in the way of a publication application. Challenges in publishing with non-Roman scripts Lorna A. Priest, 2003-02-27 There are a number of challenges in the typesetting of non-Roman scripts. These include problems of interaction between the font and typesetting system, problems of very large character sets, and considerations of typesetting the particular script. The following presentation was prepared for the Non-Roman Technical Consultation 2001. It presents a brief look at the various publishing packages in use by SIL today. The following presentation was prepared for SIL's International Publishing Department to help with their planning for transitioning to Unicode. Those needing to work with multilingual text, particularly using any kind of complex script, commonly run into two problems: input and output. On the input side, it is often necessary to use keyboarding modules that map sequences of keys to the characters needed for the languages. On the output side, smart font rendering technology may be needed to properly display or print many complex writing systems. This presentation describes several technologies that can be used to provide extensible writing system implementations in situations where the solutions implemented as part of the operating system are inadequate. Specifically we will focus on Keyman, for keyboard input, and the Graphite system, for complex rendering. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
