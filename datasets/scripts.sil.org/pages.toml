["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontfaq_crossplatform%26site_id%3Dnrsi.html"]
title = "Moving Documents Across Platforms – FAQ"
full_description = "You are here: Rendering > Resources > Font FAQ Short URL: https://scripts.sil.org/FontFAQ_CrossPlatform Question: Why is Word changing my IPA characters when documents are moved between Windows and Macintosh? I’m working with the SIL IPA fonts in Word documents that are being exchanged between Macintosh and Windows systems. Since the native character sets of the two systems are different, Word is translating characters in the IPA font when the documents change platforms with disastrous results. Can you recommend any software or technique that will unmap the SIL IPA characters (or prevent the mapping in the first place) in documents that have changed platforms? We are having trouble translating a Microsoft Word document from Word 97 into Word 98 for Macintosh. The document is using SIL Encore IPA fonts. The font displays clearly on a Windows machine, but will not translate to the Macintosh format. Question: I had a question about the SIL IPA fonts. When the font is used in a Mac program and then viewed on a PC (or vice-versa), some of the characters are different. Question: If a Mac document is read on a Windows machine (or vice versa), do the fonts translate correctly from one to the other? Answer: It's important to understand that some characters are represented differently on Windows and the Mac. The same characters are in the same locations in both the Windows and Mac versions of the fonts. If the document is saved as ASCII text on one type of machine, it should be able to be read correctly on the other type of machine. If it is saved in Word format, however, the characters probably will not show up correctly on the other machine. That’s because the standard character sets for Windows and Mac are different. When a WinWord document is opened in MacWord or vice-versa, Word typically rearranges the characters in the document to match the standard character set for the platform (Mac or Windows) it’s being opened in. It’s possible to keep the characters from being rearranged, however. Depending on the version(s) of Word being used, the strategies are either:"
