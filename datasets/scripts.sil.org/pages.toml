title = "TECkit Downloads"
full_description = 'You are here: Encoding > Conversion > Utilities > TECkit Short URL: https://scripts.sil.org/TECkitDownloads This page is now obsolete and remains here for historical purposes. The new page is at: https://software.sil.org/teckit/ This release updates the supported character repertoire to Unicode 13, for purposes of character name lookup in the compiler, and Unicode normalization support. Updated zlib to version 1.2.11 for Windows and macOS builds, Linux builds use zlib as provided by the system. Various improvements for compiling and documentation were also done. The updated libraries should work with existing applications. The TECkit package is copyright ©2002-2020 SIL International. It is being made available as free software but without any warranty; see the license for more information. The TECkit source code is available from GitHub at https://github.com/silnrsi/teckit. Additional downloads for technical users are at https://github.com/silnrsi/teckit/releases. The code is expected to compile and run on typical Unix/Linux systems using standard ./configure && make && make install commands. Tools, libraries, documentation, and samples are included in the .zip archive. Command line tools are teckit_compile.exe, txtconv.exe, and sfconv.exe. TECkit version 2.5.6 released 23 August 2016 is the last version to contain DropTEC.exe and TECkit Mapping Editor.exe. Version 2.5.10 for currently supported releases of Ubuntu Linux can be downloaded from http://packages.sil.org/. The PDF documentation is not in the Linux package, Linux users should obtain the PDF files from the Windows release. Disk image for macOS containing the TECkit libraries and Unix command-line tools (teckit_compile, txtconv, sfconv) and documentation. Installer package for version 2.5.1. This release includes both PowerPC and Intel x86 code as "fat" libraries and executables. The programs are compiled on Mac OS X 10.4, but are expected to work on 10.3.9 or later versions. For users of Perl 5.8 on Linux and Windows, or Perl 5.10 on Windows, there are bundles that will install the binary module without the need for compilation. Unpack the .zip file and run perl Install.PL and the module will be installed if newer than that you have installed.'
