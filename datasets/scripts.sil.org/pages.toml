full_description = "Unicode Character Properties Excel and LibreOffice Calc spreadsheet Peter Constable, Bob Hallissy, and Bobby de Vos, 2022-10-04 Various files from the Unicode Character Database compiled into a spreadsheet (Excel and LibreOffice Calc) workbook. Unicode Character Count utility Bob Hallissy, 2004-11-16 UnicodeCCount is a quick-and-dirty Unicode-aware replacement for CCount, the character count utility. Unibook: Introductory Walkthrough Bob Hallissy, 2003-03-03 This is a short walkthrough on using the Unibook Character browser. The Unibook Character browser is a small utility for offline viewing of the character charts and character properties for The Unicode Standard. Codepage templates for MS Word Peter Constable, 2000-10-20 These Word templates show “all the characters in a font”. (That is, all of the characters in a font than can be displayed using a particular codepage.) Martin’s Codepage 1252 Hack Martin Hosken, 1998-10-06 Martin’s Codepage 1252 Hack allows the Symbol codes (U+F020-U+F0FF) to be converted to 8-bit data via the codepage of the data (usually cp_1252) by adding mappings for the Symbol code range back to normal ASCII values. When you try to save Symbol encoded text in an 8-bit only form, the codes will be converted to conventional ASCII codes rather than question marks. Another option to this solution is to use the Symbol-encoded font to codepage 1252 transliterator. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
