["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate13%26site_id%3Dnrsi.html"]
title = "NRSI Update #13 – June 2000"
full_description = '''One of the applications scheduled to be included with the first FieldWorks release is a basic text editor called WorldPad. WorldPad will feature basic word-processing capabilities, but will also include the ability to use Graphite as its renderer for complex scripts. Many of WorldPad’s features are standard aspects of the FieldWorks text-editing framework, such as adjusting paragraph indentation and alignment, creating a simple stylesheet, handling multilingual text, and creating keyboard short-cuts. There is also the possibility of including some features that will be useful for those working with Graphite fonts, such as the ability to simultaneously view data using a Graphite renderer and a “dumb” renderer. The Graphite (previously WinRend) project continues to make progress toward our goal of providing complex rendering for those working with non-Roman and complex Roman scripts. The engine is complete in terms of its ability to perform complex transformations and is undergoing initial testing by several field members. A demo of the Graphite renderer was given at the Language Software Board meetings in May. Several of the board members commented on the fact that Graphite will be useful not only for non-Roman scripts, but for more general needs in SIL such as IPA. As an example, Graphite’s smart rendering capabilities eliminate the need for multiple versions of a diacritic depending on the visual characteristics of the character it is placed over, thus reducing the range of characters needed to represent the underlying data. Using Graphite to render IPA will result in a representation of phonological data that is not only simpler but also more linguistically consistent. We believe we are on target for a more general field test during the months of July - September, 2000. Members of the testing team are expected to be knowledgeable in a complex writing system that might be usefully implemented in Graphite. Responsibilities include: learning the Graphite Description Language, using it to implement an interesting writing system, testing and debugging the program, and providing feedback on the language, compiler, behavior, and performance. A commitment of about a person-month is needed. If you would like to be involved in this test effort, please contact me at <!-- var str1 = "<a hre"; var str2 = "f='mai"; var str3 = "lto:"; var str4 = "graphite_nrsi"; var str5 = "@"; var str6 = "sil.org'>"; var str7 = "<img src='/cms/assets/icons/e-mail.png' border='0'>&nbsp;graphite_nrsi@"; var str8 = "sil.org</a>"; document.write(str1 + str2 + str3 + str4 + str5 + str6 + str7 + str8); //--> .'''
