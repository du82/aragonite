["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate03%26site_id%3Dnrsi.html"]
title = "NRSI Update #3 – November 1996"
full_description = "Welcome to issue #3 of the NRSI Update! We’ve held back this issue until after the Computer Technical Conference in Waxhaw. Enjoy! Since August, NRSI has had a new team member working here in Dallas. Margaret wanted me to let people know who I am and what I’m up to, so here goes: I’m Peter Constable. I’m a native of Montreal, PQ, Canada, though Toronto was my more recent home base. My wife, Lori, and I have an adopted son, Joshua, who is not quite 3 years old and who has been part of our family since he was two months old. We thank God that we were able to complete the legal adoption process this past June, and are presently trying to figure out how to establish citizenship for him. (He is a “stateless” child; i.e. he does not have citizenship anywhere this side of heaven.) I studied Mathematics at the University of Waterloo, and later received an MA in Linguistics from the University of N. Dakota. I’ve been a member of SIL since 1984. While still a “Member in Training”, I spent some time in Mexico and had a lot of interaction with the SIL Mexico Branch as I researched a Mayan language for my MA thesis. Lori and I also spent4.5 years in Thailand working with the SIL Mainland Southeast Asia Group, of which we are still members. We completed a year of furlough in July of this year, but are not able to return to Thailand yet for family-related reasons (not the least of which is the need to establish citizenship for Josh). It is this circumstance that resulted in our coming to Dallas and me working with the NRSI: in looking for something to work on, non-roman scripts seemed particularly relevant to me, given the area of the world I have been working in. From the time I arrived through the end of the Non-Roman Technical Consultation (NRTC) in September, I was given a chance to get oriented to what everyone on the team here was doing and to begin learning about NRS issues. One practical contribution I was able to make during that time was to do some development on a KeyMan keyboard for Biblical Hebrew."
year_published = 1996
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate03%26site_id%3Dnrsi.html"
