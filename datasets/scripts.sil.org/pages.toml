["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dworldpadxhtmlformat%26site_id%3Dnrsi.html"]
title = "XHTML Format For WorldPad File Equivalence (Version 1.0)"
full_description = "A complete index of all SIL's contributions to UNESCO‘s project Initiative B@bel can be found here. From January to October of 2003, SIL International was engaged in a cooperative project with UNESCO as part of UNESCO’s Initiative B@bel effort. The goal was to enable the development of complex script support in information and communication technologies (ICTs). This was done through preparation of documents to guide development, technical tools for complex script support, and two example script implementations. All of these are available from a general UNESCO page. This document describes a subset of the XHTML/CSS standard that provides the equivalent functionality to WorldPad's XML format. This will enable WorldPad to function as an editor for documents that can be accessed over the Internet and viewed in a web browser. The complete document is available on this page, but can also be downloaded in both Word and PDF formats: This document describes a subset of the XHTML/CSS standard that provides the equivalent functionality to WorldPad's XML format. This will enable WorldPad to function as an editor for documents that can be accessed over the Internet and viewed in a web browser. A particular goal is to provide a process for authoring web documents containing text that can be displayed using Graphite, SIL's smart-font rendering technology. This technology is currently supported by WorldPad and will be supported by the Mozilla browser in the near future, so a path to convert documents from the former format to the latter will enable us to meet this goal. The aim of this specification is simply to define a format for web data which will fairly closely approximate what is seen WorldPad. The purpose is not to define the most compact or human-readable format, or one that facilitates further editing of the document in an HTML editor. There are also a few kinds of formatting where XHTML produces some deviation from the exact appearance of the data in WorldPad. These cases are summarized in section 4."
year_published = 2003
