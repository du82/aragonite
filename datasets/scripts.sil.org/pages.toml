["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dunicode%26site_id%3Dnrsi.html"]
title = "Unicode"
full_description = "Orthography development in relation to Unicode Lorna A. Priest, 2004-11-18 It is out of our scope to give complete guidelines for developing an orthography. However, we would like to give you a process to work through from a Unicode perspective. In designing a writing system, one must decide what symbols will be used and how. Here we list Unicode factors that should be taken into account. Understanding Unicode™ - II Peter Constable, 2001-06-13 Unicode is a hot topic these days among computer users that work with multilingual text. They know it is important, and they hear it will solve problems, especially for dealing with text involving multiple scripts. They may not know where to go to learn about it, though. Or they may have read a few things about it and perhaps have seen some code charts, but they are at a point at which they need to gain a firmer understanding so that they can start to develop implementations or create content. This introduction is intended to give such people the basic grounding that they need. Understanding Unicode™ - I Peter Constable, 2001-06-13 Unicode is a hot topic these days among computer users that work with multilingual text. They know it is important, and they hear it will solve problems, especially for dealing with text involving multiple scripts. They may not know where to go to learn about it, though. Or they may have read a few things about it and perhaps have seen some code charts, but they are at a point at which they need to gain a firmer understanding so that they can start to develop implementations or create content. This introduction is intended to give such people the basic grounding that they need. Software requirements for different levels of Unicode Support Lorna A. Priest, 2009-11-30 This page provides information on levels of Unicode support provided by different software applications. Reversed Nun in the BHS Joan Wardell, Peter Constable and Christopher Samuel, 2003-11-05 This short discussion of reversed nun explains how it is used in the Ezra SIL fonts."
