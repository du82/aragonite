["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dukelele%26site_id%3Dnrsi.html"]
title = "Ukelele - Keyboard Layout Editor for macOS"
description = "Ukelele is a user-friendly Unicode Keyboard Layout Editor for macOS, making the tedious, error-prone task of editing XML-based keyboard layouts a breeze."
full_description = "Ukelele Keyboard Layout Editor for macOS Simplify Keyboard Layout Editing Ukelele is a user-friendly Unicode Keyboard Layout Editor for macOS, making the tedious, error-prone task of editing XML-based keyboard layouts a breeze. Designed to support macOS versions 10.2 and later, Ukelele allows users to drag and drop characters directly onto keys using a graphical interface, streamlining the process of creating or modifying keyboard layouts. With Ukelele, you can easily assign multiple-character strings, create “dead keys” to modify subsequent keystrokes, and more. It’s an essential tool for anyone working with diverse scripts and characters, providing an intuitive solution for keyboard customization. Feature Highlights Easy-to-Use Interface Ukelele’s graphical interface makes it simple to drag and drop characters onto keys, eliminating the need to manually edit complex XML files. Advanced Functionality Assign multiple-character strings and create “dead keys” to enhance your typing experience and meet your specific needs. Seamless Integration Integrate seamlessly with Keyboard Juggler to manage your keyboard layouts effortlessly, especially useful for macOS 10.10 and later versions. Experience the power and convenience of Ukelele, and transform how you interact with your keyboard. Downloads Note: Keyman Keyboarding SoftwareA more flexible, cross-platform keyboard utility for macOS 10.7 (Lion) and later is Keyman. However, Keyman does not use the same .keylayout files as Ukelele and must be installed separately. Download the software from the table below. Then follow the steps in Installation Instructions to activate your .keylayout files. Ukelele 3.6b1 for Mac DMG | 54.92 MB | 28 Feb 2025 Ukelele 3.5.12 for Mac DMG | 51.72 MB | 1 Mar 2024 Ukelele 3.5.7 for Mac DMG | 55.54 MB | 11 Aug 2022 Installation Instructions Follow these steps to install and enable the .keylayout files: Copy .keylayout files to /Library or ~/Library Enable the .keylayout files: macOS 10.10 and later: System Preferences > Keyboard > Input Sources macOS 10.6 to 10.9: System Preferences > Language & Text > Input Sources macOS 10.5 and earlier: System Preferences > International > Input Version Notes The latest version works with macOS 10.14.6 and later. See Previous Versions (below) for more download options. Please see our Release Notes for a detailed version history. Previous Versions (for older versions of macOS) Previous Version Notes Versions 3.4.2 and 3.5.7 require macOS 10.9 (Mavericks) or above. Versions 3.3 and later require macOS 10.9 (Mavericks) or above. Version 3.2.7 requires macOS 10.8 (Mountain Lion) or above. Version 2.2.8 requires macOS 10.4 (Tiger) or above. Ukelele 3.2.7 for Mac DMG | 25.94 MB | 7 Oct 2017 Ukelele 2.2.8 for Mac DMG | 9.42 MB | 8 Mar 2014 Ukelele 1.8.4 for Mac DMG | 5.65 MB | 14 Sep 2009 Keyboard Juggler Keyboard Juggler is a companion application to Ukelele, and allows you to move keyboard layouts in and out of the installation folders without having to use the Finder. Keyboard Juggle is available for macOS 10.10 (Yosemite) and later, but is not needed for Ukelele version 3.3 or later, as its functionality has been incorporated into Ukelele. Keyboard Juggler 1.0 for Mac DMG | 4.25 MB | 1 Oct 2017 Support Feedback about the Ukelele tool is invited (see the Read Me file for contact information). This software is provided in the hope that it may be useful, but with no warranty, expressed or implied, and with no guarantee of support or future upgrades. There is also a user forum available: Ukelele Users Google Group. Drag-and-Drop Characters To find special characters for drag-and-drop: Enable the Character Viewer in System Preferences > Keyboard > Input Sources Access the Character Viewer via Input Menu > Show Emoji & Symbols. License Ukelele is written by John Brownie of SIL and is copyright ©2003-2022. This software is currently provided under a freeware license, but future versions will be released under an open source license. Contact If you are unable to obtain support through the Google group, please contact us."
