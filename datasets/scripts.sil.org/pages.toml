["https://scripts.sil.org/keybrddesign.html"]
title = "An introduction to keyboard layout design theory: What goes where?"
full_description = "Designing a keyboard layout is relatively easy: you just allocate codepoints to keystrokes. The difficulty comes when trying to decide what codepoints to assign to what keystrokes. Do you design based around the characters on the keytops of a user's keyboard or the relative position of the keys? What do you do if you want to be able to type more characters than there are keys in your keyboard? This chapter will examine various design tradeoffs and look at some of the different approaches used in different keyboarding situations and technologies. Notice that, as yet, there is no technology which can support all the different approaches presented here. So in addition to making decisions based on the particular keyboard behaviour required, you will also need to take into consideration the limitations of your keyboarding software. First we consider issues of keyboard layout and then issues of large keyboards (those where there are more characters to be typed than keys to type them). Notice that this section contains information relevant to those designing keyboards with very few characters as well. Then we look at sequence checking and finally the whole issue of how different types of keyboards are expressed as rule systems. Surprisingly, much of what we need to consider can be brought out in the simple example of adding support for the character ÿ to a keyboard. All the examples will be expressed in terms of the Keyman keyboard description language, and the reader is referred to the relevant documentation on that language. The first way to consider the 'ÿ' is that it consists of two components: 'y' + umlaut. In this case we would have a special keystroke to add the umlaut on top of the 'y', for example the keystroke ¨ following a y might add the umlaut:. In other words we are using existing information on the keys of a users keyboard to help the user remember the keying of the character. We use the term mnemonic keyboard: for this type of keyboard. The SILIPA93 keyboard is of this type. Mnemonic keyboards are commonly used with Latin-based scripts, since there is a close correspondence between what people want to type and what they see printed on the keyboard in front of them."
year_published = 2003
year_updated = 2020
clearnet = "https://scripts.sil.org/keybrddesign.html"
