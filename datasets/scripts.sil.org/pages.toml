["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dencodingfaq%26site_id%3Dnrsi.html"]
title = "How do I encode...?"
full_description = 'If you want something that looks like a curly quote you should use U+02BC MODIFIER LETTER APOSTROPHE. You could use U+2019 RIGHT SINGLE QUOTATION MARK, but there are at least two issues with that. It is considered punctuation with different properties than an orthographic character and if you use quote marks there is nothing to distinguish between the two characters. (Our Roman fonts (such as Andika, Charis SIL, Doulos SIL and Gentium Plus) all have an alternate glyph for U+02BC MODIFIER LETTER APOSTROPHE which is a bit larger than normal to help distinguish the glyph from U+2019 RIGHT SINGLE QUOTATION MARK.) Many orthographies have used something that looks like the straight quote. There were so many problems with using U+0027 APOSTROPHE for this character that we requested the addition of a character to Unicode for that. You should use U+A78C LATIN SMALL LETTER SALTILLO (one language even "cases" this and U+A78B is used for the uppercase). (Our Roman fonts (such as Andika, Charis SIL, Doulos SIL and Gentium Plus) all have an alternate glyph for U+A78C LATIN SMALL LETTER SALTILLO and U+A78B LATIN CAPITAL LETTER SALTILLO which are a bit larger than normal to help distinguish the glyph from U+0027 APOSTROPHE.) U+02BE MODIFIER LETTER RIGHT HALF RING is sometimes used for transliterating Arabic hamza (glottal stop). This looks different from both U+A78C LATIN SMALL LETTER SALTILLO and U+02BC MODIFIER LETTER APOSTROPHE and might be a good option for traditions which recognize the transliterated hamza. Some Saskatchewan orthographies use an upper and lowercase glottal stop. Those are U+0241 LATIN CAPITAL LETTER GLOTTAL STOP and U+0242 LATIN SMALL LETTER GLOTTAL STOP. Of course, the IPA representation is U+0294 LATIN LETTER GLOTTAL STOP and some languages also use this in their orthographies (where casing is not required). Question: I want to put a diacritic on a “dotted i” and want to retain the dot on the “i”. Can you add that feature to your fonts? Answer: The Unicode Standard addresses this in chapter 7 (see http://www.unicode.org/versions/latest/ch07.pdf). You should encode it as U+0069 U+0307 U+0301.'
year_published = 2009
year_updated = 2020
