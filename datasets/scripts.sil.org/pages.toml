["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfloss%26site_id%3Dnrsi.html"]
title = "Resources for Writing Systems Implementation using Copyleft and FLOSS (Free/Libre and Open Source Software)"
full_description = '''Although many of the solutions mentioned in this document can be very helpful for those interested in implementing writing systems, SIL International has not tested them, does not make any specific recommendations or specific claims about their legality or suitability for use. It is the user's responsibility to test the maturity and to understand the licensing of the following items before using, modifying or redistributing them. Comments and feedback welcome. If you have experience with any of the projects mentioned below, feel free to add a comment. Please use the "Add a response to.." link at the bottom of this page. Thank you. Are you looking for ideas, information and tools to enhance or start from scratch a WSI (Writing System Implementation) or one of its components for a specific language community? This collection of links will help you use copyleft and FLOSS (Free/Libre and Open Source Software) technologies and methods to develop, adapt or enhance a WSI. The copyleft approach can increase a language community's ability to fully enjoy the benefits of the information age and to effectively reduce the Digital Divide. Using open standards and copylefted technologies can lower the barrier of entry for use, cooperation and dissemination of a particular WSI by bringing cyber-literacy to minority language communities through improved sustainability, interoperability, and capacity building. The cooperative models allow a distributed and networked team to be set up to get volunteers and users more closely in touch with the developers than with proprietary development models. In fact, copyleft and FLOSS are methods of creating software more than just freely available tools. As a developer - or any kind of contributor - there are many advantages to a well-managed copyleft strategy, you can: It is a good idea to check software catalogs (such as freshmeat.net) and to keep an eye on community news-sites (such as newsforge.net) to track the evolution and the maturity of these various writing systems-related projects. Be aware of the direction of the various leading projects as well as the discussions about new standards. Being able to give input at the right time can dramatically help improve support for your language. You're also very likely to hear about new interesting projects being set up in the meantime.'''
year_published = 2004
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfloss%26site_id%3Dnrsi.html"
