["https://scripts.sil.org/support.html"]
title = "Support and Troubleshooting"
full_description = "This page is now out of date. For help with SIL fonts please see our Font Help Guides. For discussion and support, please go to our Language Software Community site. Thank you for visiting scripts.sil.org. If you are experiencing a technical problem with one of our products, please use this troubleshooting guide which is designed to help us figure out how best to address your problem. At the end of the guide there is an option to contact us directly if we have been unable to answer your question here. As our fonts and utilities are distributed at no cost, we are unable to provide a commercial level of personal technical support. We will, however, try to resolve problems that are reported to us. We do hope that you will report problems so they can be addressed in future releases. Even if you are not having any specific problems, but have an idea on how this system could be improved, we want to hear your ideas and suggestions. Please note that our software products are intended for use by experienced computer users. Installing and using them is not a trivial matter. The most effective technical support is usually provided by an experienced computer user who can personally sit down with you at your computer to troubleshoot the problem. General troubleshooting information, including frequently asked questions, can be found in the documentation. Additional information is also available on the FAQ pages. If that fails to answer your question, please contact us by starting a topic on the Language Software Community site. We also have an email contact form, however we will responding to those messages only as staff resources allow. Please use the new community site before using the form. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
