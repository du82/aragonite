["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Diws-chapter01%26site_id%3Dnrsi.html"]
title = "The NRSI Model for Implementing Writing Systems"
full_description = "Over its short history, the Non-Roman Script Initiative of SIL International has developed a model for using computers to implement the various writing systems that are needed for text input, storage, processing, and output. Because of the variety and breadth of locations where it works, SIL has one of the greatest needs for flexibility in these various functions. During its early days a model was developed for dealing with complex scripts that encompassed all of these needed functions. The NRSI model has, at its heart, data which is encoded according to a standard. This data standardization can be split into two parts: a standard for the character-by-character storage and a separate standard for the structure of the text or overall document. Surrounding this data centre are four processes which act on or interact with the data: keyboarding, rendering, analysis, and conversion. The following material will provide an introduction to these five important areas. As mentioned previously, data is at the centre of our model. To ensure it does not change, one important requirement is for it to be stored in a way that is uniform and conforms to a standard. This standard storage form is called encoding. Character encoding refers to the storage of individual pieces of data. During the past fifteen years a standard for character encoding has been developed which is increasingly inclusive of non-Roman scripts, both present and past. This standard is called Unicode. Structure encoding of a text describes the type of information that is stored and how individual pieces of information relate to the whole document. The encoding can be simple or ?flat?, where it is sometimes referred to as text markup. However, it can also have a hierarchical structure as in XML. Keyboarding refers to data input, whether by the computer keyboard or other input methods. In our data centred model, keyboarding is the means by which data is provided for storage. In the non-Roman world keyboarding needs to be flexible, allowing the user to modify input quickly and easily while at the same time providing the data in the standard storage form or encoding. Other factors to consider when designing a keyboard are consistency, efficiency, and uniformity of the process to make learning and using the keyboard easier."
year_published = 2001
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Diws-chapter01%26site_id%3Dnrsi.html"
