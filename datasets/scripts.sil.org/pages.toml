title = "SIL Galatia (Obsolete)"
full_description = "You are here: Type Design > Resources > Font Downloads Short URL: https://scripts.sil.org/SILGrk_home The SIL Greek Font System is a pre-Unicode or “legacy” font system which was originally released by SIL in 1998. These fonts have been superceded by Unicode-encoded Greek fonts, such as Galatia SIL or Gentium — a typeface for the nations. The SIL Greek Font System is designed to be an integrated system for entering, displaying and printing Biblical Greek texts. Also included are fonts for transliteration and conversion routines for going from one encoding to another. SIL Galatia - containing the basic set of characters needed for Biblical Greek texts (Regular & Bold faces) SIL Greek Trans - containing characters used to transliterate Greek into Roman text (Regular, Bold, Italic & Bold Italic faces) In addition to the fonts themselves, this package includes keyboard control files for use with either the Tavultesoft Keyboard Manager (Keyman) for Windows or SILKey for the Mac OS. Using Keyman or SILKey greatly simplifies the typing of Greek text and is highly recommended. (Please see the note under “Additional Files” regarding updated keyboard control files for use with Keyman 5 and 6.) Conversion routines, for use with the Consistent Changes program are also included to convert texts between character encodings. Keyman, SILKey and the Consistent Changes programs are available from the links listed under “Related Packages”. For Mac OS users, the SIL Galatia font family, when used with QuickDraw GX-savvy applications, automatically combines diacritics (without the need for additional keyboarding utilities) and includes many alternate forms and additional features. A WorldScript script file that provides some of these features is also included. Here are a few of the alternate forms available through QuickDraw GX: © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
