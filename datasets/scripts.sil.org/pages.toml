["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate01%26site_id%3Dnrsi.html"]
title = "NRSI Update #1 – July 1996"
full_description = "The Non-Roman Script Initiative (NRSI) is a project of SIL’s International Publishing Services focusing resources on issues pertaining to using, displaying and researching non-roman (NR) scripts. There is an NRSI-Central team in Dallas, but NRSI team members are working in field locations. Among other activities, we develop NR fonts and scripting systems, keep up to date on current and emerging technologies that benefit the NR script user, and coordinate NR information. A new version of KeyMan (version 3.2) is currently in Beta Testing. This version contains several bug fixes and enhancements including: Although we are nearing the end of the Beta Test program, new Beta Testers would be welcomed (if you’re serious about testing and don’t mind an occasional disruption). One of my responsibilities is to look into new publishing applications that would be suited for non-roman minority script languages. I’ve had an opportunity to work with three applications that work with GX fonts: “UniQorn”, “Ready, Set, Go!”, and “TeXgX”. From these initial investigation, it’s clear that UniQorn and Ready, Set, Go! are not suited for long document publications. However, they are well suited for work we do with literacy and other shorter documents. In my opinion I think they could handle most scripting systems but time will tell. I’ll be working with these two applications more during the summer and should know better what their limitations are by fall. As for our long-document publishing, TeXgX is the only viable tool available in the non-roman environment. It’s not what you would class a user-friendly application but it works better than anything else I’ve seen. Jonathan Kew has done a fantastic job of porting TeX over to the GX environment. Apple’s WorldScript (WS) technology, introduced four years ago, has been used successfully to provide non-roman script solutions inside and outside SIL. Preparing WS “Language Kits”, however, has always been a difficult programming task, discouraging their development. Only a few applications were “WorldScript- savvy” and supported custom kits. Apple was also reluctant to make the WorldScript system extension available outside their own kits."
year_published = 1996
