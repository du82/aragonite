["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dutconvert2unicode%26site_id%3Dnrsi.html"]
title = "When to Convert to Unicode"
full_description = "Linguists and others who work with minority language data often still use older special character systems (fonts and keyboards) that work only for certain languages. These older (‘legacy’) systems are gradually being replaced by Unicode (What is Unicode?), which attempts to cover all languages in one unified system. So, you are probably wondering: When is the right time to convert to Unicode? That’s what this article is about. The question actually has two parts: There is usually a period of time—a window of opportunity—between the time when it becomes possible and when it becomes necessary. Ideally, you should plan ahead so you can convert your data during that window. You want to find a time when it is convenient to do so, before a conversion is forced on you at perhaps a very inconvenient time. Hopefully your window of opportunity will be large: it will be reasonable for you to convert your data to Unicode at least a year before it becomes necessary. This article will help you recognize whether you and your language data have entered that window of opportunity. It will also help you predict whether you are approaching the end of the window: the point where a conversion is necessary. It will help you decide whether now is the time to convert. Likewise, if you are just starting to work with a language, you may need to decide which special character system to use. From now on, most people should plan to start with Unicode, but there may be a few situations where older fonts and special character systems are necessary. This article is written mostly for a general audience, although some of the links get more detailed and technical. At some point, you may need the advice of someone with special technical knowledge to decide when to convert, and most people need help to actually do the conversion and get set-up to use Unicode. This article will also help you decide when you need to get that help, and provide guidance to the technicians who are advising you. Because it is written for two audiences—ordinary users and technicians—the words “you” and “your” sometimes refer to the users/owners of the data and sometimes to the technicians assisting them. You decide whether they apply to you personally."
year_published = 2007
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dutconvert2unicode%26site_id%3Dnrsi.html"
