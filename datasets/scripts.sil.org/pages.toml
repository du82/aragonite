title = "Resources"
full_description = "Roman Script to Arabic Script Conversion NRSI staff, 2013-04-25 The SIL Converters software provide the framework to convert your texts from Roman script to Arabic script. This document is not a manual of SIL Converters or the TECkit mapping language but attempts to highlight some principles that need to be considered when converting text from Roman script to Arabic script. SILConverters 4.0 Bob Eaton, Mark Penny, 2015-08-14 This package provides tools through which you can change the encoding, font, and/or script of text in Microsoft Word and other Office documents, XML documents, and SFM text and lexicon documents. It also installs a system-wide repository to manage your encoding converters and transliterators (TECkit, CC, ICU, Perl, or Python-based, as well as support for adding custom transduction engines). Encore2Unicode — E2U is a command-line utility for Windows that can examine a font built using the Encore font system and create a draft TECkit mapping table for converting data using that font to (and back from) Unicode. Unicode Character Properties Excel and LibreOffice Calc spreadsheet Peter Constable, Bob Hallissy, and Bobby de Vos, 2022-10-04 Various files from the Unicode Character Database compiled into a spreadsheet (Excel and LibreOffice Calc) workbook. Unicode 8.0 Latin and Cyrillic characters – sorted Lorna Evans, 2016-04-05 PDF documents with tables of Latin and Cyrillic characters from Unicode 8.0 sorted in Unicode Collation Algorithm default order. Useful for finding characters in Unicode. Unibook: Introductory Walkthrough Bob Hallissy, 2003-03-03 This is a short walkthrough on using the Unibook Character browser. The Unibook Character browser is a small utility for offline viewing of the character charts and character properties for The Unicode Standard. https://r12a.github.io/app-conversion/ — Unicode Code Converter is a chart that allows you to convert text to Unicode codepoints, UTF-8, UTF-16, HTML/XML, and hex and decimal. Just add one type of data, press the tab, and see all the corresponding values"
