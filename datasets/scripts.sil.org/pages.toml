["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dgeneral%26site_id%3Dnrsi.html"]
title = "General"
full_description = "Resources for Writing Systems Implementation using Copyleft and FLOSS (Free/Libre and Open Source Software) Nicolas Spalinger, external contributor, 2004-01-20 Are you looking for ideas, information and tools to enhance or start from scratch a WSI or one of its components for a specific language community? This collection of links will help you to use copyleft and FLOSS (Free Libre and Open Source) technologies to develop, adapt or enhance a WSI. Right-to-left scripts in Microsoft Office Bob Hallissy, 2016-12-05 The ability to display right-to-left (RTL) and other complex scripts is built into the standard editions of Microsoft Office since Office 2000. Additionally, the ability to handle RTL scripts is not dependent on underlying Windows support, so it works even on English editions of Windows 9x. All of this is a significant change from previous Office products for which Microsoft made customized editions of the applications for different areas of the world. This document template provides helpful hints on use of RTL scripts in Word 2000, Word 2002 and Word 2003. Included are general instructions for getting such scripts to work correctly, known bugs and weaknesses, and various tips and tricks. There are also some macros that may be helpful when working with RTL scripts. Although written primarily for users of Arabic Based Scripts (ABS), users of other RTL scripts such as Hebrew will find the material helpful. Welcome to SIL’s Writing Systems Technology team Sharon Correll A brief introduction to the Writing Systems Technology vision and team members. Arabic script support - home Lorna Evans, 2017-11-15 The materials on this page are aimed at people working in lesser-known languages using Arabic script. It is geared for the power user. However, IT language support and publishing personnel working in areas of the world where Arabic script is used would benefit. These materials are not focused on font developers or font development. Decompression Utilities, Downloading & Font Installation Tips Lorna A. Priest, 2007-06-15 If you have just downloaded a zip file and do not know what to do with it, this page might help you. This page also offers other tips for downloading files and installing fonts."
