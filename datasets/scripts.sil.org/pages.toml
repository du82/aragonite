["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dipahome%26site_id%3Dnrsi.html"]
title = "IPA Transcription with SIL Fonts"
full_description = "This page is no longer the most up-to-date page. Please go to IPA transcription with SIL fonts for the most up-to-date information. SIL International has produced several font sets over the years that allow for the transcription of linguistic data using the International Phonetic Alphabet. These fonts are: In general, SIL recommends the use of the Unicode-encoded fonts. The older, “legacy” fonts were designed to work with text in a custom 8-bit encoding, not a recognized character encoding standard, and required changing fonts when switching between normal text and IPA transcription. With Unicode-encoded fonts, the user can produce both normal text and IPA transcription with a single font. In addition, Unicode provides cross-platform compatibility. There were built-in incompatibilities between Windows and Mac versions of the legacy fonts, whereas Unicode has been adopted as a standard for Windows, Mac, and Linux systems. Using Unicode fonts: Below, we provide a brief discussion of the issues related to the use of each of the above-mentioned fonts. The best option for publication-quality typesetting is Charis SIL. Charis SIL — Charis SIL is a Unicode-encoded serif font. Besides having a comprehensive inventory of glyphs needed for almost any Roman- or Cyrillic-based writing system, it also contains the entire inventory of the International Phonetic Alphabet. The latest version also contains the newly-adopted symbol for the labiodental flap. It includes the characters in the SIL Private Use Area. It has built-in “smart-font” capabilities, so diacritics are properly placed. It contains all four typefaces (regular, bold, italic, and bold-italic). This is the font that SIL recommends using for publication-quality typesetting. SIL plans to continue developing Charis SIL in the future. Doulos SIL — Doulos SIL is a Unicode-encoded serif font similar to Times New Roman. Besides having a comprehensive inventory of glyphs needed for almost any Roman- or Cyrillic-based writing system, it also contains the entire inventory of the International Phonetic Alphabet. The latest version also contains the newly-adopted symbol for the labiodental flap. It includes the characters in the SIL Private Use Area. It has built-in “smart-font” capabilities, so diacritics are properly placed. At present, it only contains the regular typeface; bold, italic, and bold-italic are not available. SIL plans to continue developing Doulos SIL in the future, for the regular typeface only."
