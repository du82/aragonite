["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Diws-toc%26site_id%3Dnrsi.html"]
title = "Implementing Writing Systems (The Book)"
full_description = "The NRSI Model for Implementing Writing Systems Melinda Lyons, Victor Gaultney, 2001-07-04 Over its short history, the Non-Roman Script Initiative of SIL International has developed a model for using computers to implement the various writing systems that are needed for text input, storage, processing, and output. Understanding characters, keystrokes, codepoints and glyphs Peter Constable, 2003-05-28 Software systems that are used for working with multilingual data are evolving, and it is increasingly important for users and support personnel to have an understanding of how these systems work. This chapter explains some of the most basic concepts involved in working with multilingual text; characters, keystrokes, codepoints, and glyphs. Each notion is explained, as is the way they relate to one another and interact within a computer system. Character set encoding basics Peter Constable, 2001-06-13 In understanding technologies for working with multilingual and multi-script text data, we need to start with an understanding of character encoding. Systems for working with text involve a collection of processes that work together—processes for creating and editing text, presenting it, for sorting, for laying out paragraphs and wrapping at line breaks, etc. Character encoding is the thing that ties all of these processes together. Computer systems employ a wide variety of character encodings. The most important of these for us is Unicode. It is also important for us to understand other encodings, however, and how they relate to Unicode. In this section, I want to look at some basic concepts that relate to all encodings, and also give an overview of legacy encodings and their importance for us. Understanding Unicode™ - I Peter Constable, 2001-06-13 Unicode is a hot topic these days among computer users that work with multilingual text. They know it is important, and they hear it will solve problems, especially for dealing with text involving multiple scripts. They may not know where to go to learn about it, though. Or they may have read a few things about it and perhaps have seen some code charts, but they are at a point at which they need to gain a firmer understanding so that they can start to develop implementations or create content. This introduction is intended to give such people the basic grounding that they need."
