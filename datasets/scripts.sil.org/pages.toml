["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dusing_web_fonts%26site_id%3Dnrsi.html"]
title = "Using SIL Fonts on Web Pages"
full_description = "This page is now out of date. An updated guide is available at https://software.sil.org/fonts/webfonts/. SIL fonts can be successfully used on web pages. There are many strategies available, and some tricks to making them work well. A basic assumption is that the page text is encoded as Unicode UTF-8 text. There are four main options for designing web pages that use SIL fonts. They are described here and demonstrated on another page. The technique that works for most current browsers is to have the user download the font from the SIL web site and install it. The text style can then be set using CSS to refer to that particular font. Although this has the highest browser support, it does require a user-installed font. If the font is not installed the system will attempt to display your text using some other available font, and the text could become unreadable. You can host the normal SIL font on your server and refer to it on your web pages using the CSS @font-face rule. Note that we currently do not host our normal font files on our servers for use by others in this way - you need to host them yourself. The SIL Open Font License allows this - see the OFL-FAQ for more information. Some very old browsers do not support the @font-face rule, in which case the system will attempt to display your text using another available font according to the list you define, and the text could become unreadable. Note that versions of Internet Explorer up through 8 do not support @font-face for normal server fonts. For example, to make the Gentium font available to your web pages place it on your site, then refer to it in CSS in the following way, where 'site/fonts' is your domain and the path to where you have stored the font: WOFF (Web Open Font Format) is a font 'wrapping' technology that is has become the standard for web fonts for the long-term future and has broad support. It compresses the font data, so is more efficient (and faster) than referring to hosted TrueType or OpenType fonts. All modern browsers support WOFF, and most SIL font packages now include WOFF versions."
year_published = 2016
year_updated = 2020
