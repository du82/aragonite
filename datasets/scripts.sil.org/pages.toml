["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontdownloadsgentium%26site_id%3Dnrsi.html"]
title = "Home - Gentium—a Greek font with Latin and Cyrillic"
description = "The Gentium family is a complete Greek font, supporting both monotonic and polytonic forms. While some Greek characters do closely resemble Latin ones, it is"
full_description = "”Gentium” is a Latin word meaning belonging to the nations. The Gentium typeface family was created to enable the diverse ethnic groups—nations—around the world who use the Latin, Cyrillic, or Greek scripts to produce readable, high-quality publications. It supports almost the complete range of Unicode characters for these scripts, including a comprehensive range of diacritics and a large set of symbols useful for linguistics and literacy work. Gentium’s design is intended to be highly readable, reasonably compact, and visually attractive. One design strategy for greater readability is to make slightly more generous counters, which are the spaces inside and around the strokes of the letters. For compactness, capital letters are modest in size and slightly compressed. For attractiveness, Gentium combines good design with careful letterspacing, plus a friendly, calligraphic character. The Gentium family is a complete Greek font, supporting both monotonic and polytonic forms. While some Greek characters do closely resemble Latin ones, it is a separate design that embraces the robust, distinctive character of the Greek script, but does so within the design context of the whole typeface. As a result, the two scripts can be successfully mixed in a paragraph or page of text. Gentium was a winner of the TDC2003 Type Design Competition and was exhibited as part of the bukva:raz! exhibit at the UN Headquarters Main Lobby. Read more about its design. Gentium Plus is carefully designed to support the full range of letterforms for three scripts—Latin, Cyrillic, and Greek—while bringing harmony to their design. Each font contains over 4,600 glyphs and supports advanced OpenType features useful for multilingual texts, including careful diacritic positioning and small caps. Read more about our font features. The Latin and Cyrillic scripts are used to write thousands of languages around the world. Gentium Plus provides comprehensive support for these writing systems, and includes a wide range of additional characters and symbols useful for linguistics and literacy work. It also supports the Greek script. Read more about our character set support."
year_published = 2014
year_updated = 2024
