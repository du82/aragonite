["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontdownloadsdoulos%26site_id%3Dnrsi.html"]
title = "Home - Doulos SIL"
description = "Doulos SIL is a Unicode-based font family that supports the wide range of languages that use the Latin and Cyrillic scripts, whether used for phonetic or"
full_description = "Doulos SIL is a Unicode-based font family that supports the wide range of languages that use the Latin and Cyrillic scripts, whether used for phonetic or orthographic needs. Linguists appreciate the wide range of characters and symbols useful in their work. This Doulos SIL font is essentially the same design as the SIL Doulos font first released by SIL in 1992. The design has been changed from the original in that it has been scaled down to be a better match with contemporary digital fonts, such as Times New Roman®. Read more about its design. Doulos SIL is a Unicode-encoded serif font similar to Times New Roman. Besides having a comprehensive inventory of glyphs needed for almost any Roman- or Cyrillic-based writing system, it also contains the entire inventory of the International Phonetic Alphabet (IPA). The font supports advanced OpenType features useful for multilingual texts, including careful diacritic positioning and small caps. Read more about our font features. The Latin and Cyrillic scripts are used to write thousands of languages around the world. Doulos SIL provides comprehensive support for these writing systems, and includes a wide range of additional characters and symbols useful for linguistics and literacy work. Read more about our character set support. This font software is free to use, modify and redistribute according to the terms of the SIL Open Font License."
