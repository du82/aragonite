["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate12%26site_id%3Dnrsi.html"]
title = "NRSI Update #12 – April 2000"
full_description = '''Graphite is the new name of what was previously known as the “WinRend” project. The name reflects the orientation of the package to drawing or rendering, and the fact that we hope it will “lubricate” the process of working with non-Roman scripts! The project has made good progress over recent months. The compiler for the “Graphite Description Language,” the rule-based programming language for describing writing system behavior, is almost complete. In the rendering engine itself, most of the sophisticated features for performing complex rendering are fully operational. In March, I presented a paper on Graphite at the Sixteenth International Unicode Conference in Amsterdam. The presentation included a demo showing the current functionality of the system and was attended by representatives of several leading companies in industry. We received some very positive feedback. A number of individuals were impressed with capabilities of the system and expressed that we are moving in the right direction to meet a significant technological need. There are also possibilities of collaboration with related development efforts going on in other organizations. A field test period is planned for the summer of 2000. Members of the testing team are expected to be knowledgeable in a complex writing system that might usefully be implemented in Graphite. Responsibilities include: learning the Graphite Description Language, using it to implement an interesting writing system, testing and debugging the program, and providing feedback on the language, compiler, behavior, and performance. A commitment of about one person-month is needed over the period of July - September. If you would like to be involved in this test effort, please contact me at: <!-- var str1 = "<a hre"; var str2 = "f='mai"; var str3 = "lto:"; var str4 = "graphite_nrsi"; var str5 = "@"; var str6 = "sil.org'>"; var str7 = "<img src='/cms/assets/icons/e-mail.png' border='0'>&nbsp;graphite_nrsi@"; var str8 = "sil.org</a>"; document.write(str1 + str2 + str3 + str4 + str5 + str6 + str7 + str8); //--> . More information can be found at this web site.'''
