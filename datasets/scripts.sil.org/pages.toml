["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsilencorefonts%26site_id%3Dnrsi.html"]
title = "SIL Encore (Obsolete)"
full_description = '''You are here: Type Design > Resources > Font Downloads Short URL: https://scripts.sil.org/SILEncoreFonts Please note that this package does not provide automatic support for the The Unicode Standard. It was primarily designed to create fonts that use 'legacy' encodings, which are now discouraged. The Doulos SIL, Charis SIL, Andika and Gentium fonts do provide Unicode support. The SIL Encore Font System, version 3.0, is a library of over 1600 phonetic characters and linguistic symbols that can be used to create customized, scalable TrueType fonts for Windows and Macintosh systems. The Encore library has a complete Roman based glyph set for linguistic applications, including: TypeCaster is a Windows font compiler that is backwards compatible with CSTs created for Premier and Encore version 2.0 font compilers. It eliminates the need to use third party font manipulation products to generate customized Encore TrueType font sets for Windows applications. By using the on-line glyph catalog you can select your glyphs on screen and drag or copy them to the editor. The SILID and comments are copied along with the glyph. Double-clicking on a glyph in the editor allows you to make horizontal, vertical, size, and width adjustments to a base character or diacritic. You can choose several options for the font and file names, including a combination of CST and job names, or you can create a custom name. The individual font files in the Macintosh version can be installed and used "as is," (i.e., without compiling custom fonts), but it will be necessary to switch fonts in order to access specific characters. These fonts and software are the property of SIL International. They are distrbuted as copyrighted freeware. You may use this software without any charge and may distribute it, as is, to others. Commercial distribution of this software is restricted without prior written permission. If you wish to distribute this software commercially, contact SIL for details on obtaining a license. You may not rent or lease the software, nor may you modify, adapt, translate, reverse engineer, decompile, or disassemble the software. THE SOFTWARE AND RELATED FILES ARE PROVIDED "AS IS" AND WITHOUT WARRANTY OF ANY KIND.'''
