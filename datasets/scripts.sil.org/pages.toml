["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontdesigntools%26site_id%3Dnrsi.html"]
title = "Design Tools"
full_description = '''Most fonts look great when printed, but look terrible on screen. It takes special instructions, built into the font, to improve screen appearance. These "hints" tell the computer how to be consistent when drawing strokes and individual features. Font development programs, such as FontLab, will automatically generate these hints, but the results are not always satisfying. Some of these also include the ability to manually set hints. Hinting a font manually can be a long, tedious, frustrating process. It doesn't take much effort, however, to improve upon FontLab's autohinting. You can also tweak individual glyphs while allowing FontLab to deal with the rest. The key to successful hinting is the correct setting of alignment zones and stem values. Once those are in place, even FontLab's automatic hinting works better. Then you can go in and play with those glyphs that really bother you. This article is intended to help you maximize FontLab's autohinting behavior. It is not a full tutorial on hinting strategies or techniques, and doesn't get into details of when it's better to use an align instead of a link, etc. There are some documents that do discuss this. See the list of links at the end of this article. Screenshots are from FontLab 4.5 for Macintosh, but are not substantially different from what you'd see in Windows. Examples are from Roman fonts, but the same concepts can be applied to non-Roman ones as well. If you have comments, corrections, additions, etc. please use the annotation feature at the bottom of this article to add them. Thank you! The process described below is a general outline for hinting a font in FontLab. This assumes that you've been drawing your glyphs using PostScript Bézier curves, but want to deliver a hinted TrueType font. Disclaimer: this process seems to work, although I will admit that I don't understand why in every case. There are some steps that mystify me, but they seem to work! The pain you will feel in hinting is directly related to how consistently the glyphs have been designed. Care invested in checking stroke widths, heights, depths, etc. will pay off in better autohinting and easier manual tweaking. Be careful, though - you never want to sacrifice an important glyph feature for the sake of consistency. But despite how consistent you are, sometimes the glyphs just look terrible on screen. But that's why you're reading this article.'''
year_published = 2003
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontdesigntools%26site_id%3Dnrsi.html"
