["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontfaq_display%26site_id%3Dnrsi.html"]
title = "Display Issues – FAQ"
full_description = "This page is now out of date. For help with SIL fonts please see our Font Help Guides. For discussion and support, please go to our Language Software Community site. Some character shapes may be distorted or garbled. Examples of fonts that are known to manifest these symptoms are SIL Ezra, Ramna Classique, and SIL Doulos NP. Answer: The culprit appears to be the initial version of Microsoft’s font smoothing technology based on ClearType. To fix this problem, either switch to standard font smoothing, turn off font smoothing altogether, or apply Windows XP SP1. More information: In Windows XP, there are three settings for font smoothing: None, Standard, and ClearType. There are a number of methods to control the selection, but the most obvious is from the Control Panel: Control Panel / Display / Appearance / Effects.... If you want to turn off smoothing altogether, just uncheck this box. Otherwise, select Standard instead of ClearType if you are having trouble with font display. Answer: It may sound silly, but I've often been asked to help with a font-related problem only to find out that the user doesn't have the required font installed! To save yourself some embarrassment, be sure to look for this before going further. A tip for Microsoft Word users: You can find out whether Word thinks it has all the fonts required for a given document quite easily. With the document open, click Tools / Options, then select the Compatibility tab and press Font Substitution... . If Word is missing any fonts needed for this document, it will list them and tell you what fonts it is using for the missing ones. You open a Word document, select some text, and change the font. Some of the characters now show up as boxes. For example, with this text: Answer: Boxes show up when there is a mismatch between Unicode characters in the document and those supported by the font. Specifically, the boxes represent characters not supported by the selected font. One common situation is when the original text is formatted with a symbol-encoded font such as SIL's legacy fonts (SIL Galatia, SIL Ezra, SIL IPA93). The SIL Encore font system can also be used to create symbol-encoded fonts."
year_published = 2005
year_updated = 2020
