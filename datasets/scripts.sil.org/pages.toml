["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Drtf2sfm%26site_id%3Dnrsi.html"]
title = "RTF2SFM — converting styled Word documents to SFM"
full_description = '''RTF2SFM converts a styled Word .RTF file to UTF8-encoded SFM. Unlike the old SF Converter package, RTF2SFM correctly handles Unicode characters. RTF2SFM is part of the SIL::RTF Perl module that provides an event-driven parser for examining or processing RTF files. The program is supplied either as a Perl module (requiring Perl 5.8 or later) or as a standalone Windows .EXE file. If -c is not supplied, looks for an RTF2SFM.INI file in the current directory. If RTF2SFM.INI isn't found, uses a standard set of options (based on SFConverter). Note: .INI files are assumed to be UTF-8! The control file has syntax like a Windows .INI file. Use -p option or see Downloads for working examples. Any residue (e.g., text in a style for which there is no sf tag defined, or unknown RTF destinations) is written to a residue file (named after the output file if -o supplied, else named residue.res). RTF2SFM always generates a residue file that contains information about things in the RTF that it didn't understand. Always review the residue file. Although some of the messages may not make much sense, most messages end with a [chapter:verse] reference (assuming such are present in the input) which will point you to the offending area of your RTF file. are likely to be important. What it means is that the document contains (near chapter 31 vs 30) text in a style ('Subtitle') that RTF2SFM doesn't know about. If your document is correct, then you need to enhance the control file for RTF2SFM to tell the program what should happen with text in this style. RTF is, even after all these years, an evolving standard. New features of programs like Microsoft Word often mean new features in the RTF. Sometimes these come as new "destinations" that RTF2SFM doesn't know about, and this causes this type of message. Most likely these errors can be ignored. But check the verses indicated to see if any important text is missing from the SFM file. Also, I would appreciate receiving copies of RTF files (and the control file you are using, if any) that generate such messages. I will attempt to eliminate the offending destinations in future releases.'''
