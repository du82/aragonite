["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontfaq_input%26site_id%3Dnrsi.html"]
title = "Keyboarding issues as related to SIL fonts – FAQ"
full_description = "Please note these questions relate to older, legacy fonts and technologies and not to newer, Unicode-encoded fonts or keyboards. Our current recommendation is to use the Keyman program. Question: I have installed the SIL fonts, and have been trying to use them in a document. When I use the key sequences listed in the documentation, however, I don’t get any of the characters I’m supposed to. Why not? How can I get them? Answer: In order to use the keystrokes shown in the documentation you must have Keyman (Windows) or SILKey (Macintosh) installed and running, with the appropriate keyboard loaded in Keyman/SILKey, and the keyboard activated. If you are using Windows 3.1, you will need to use Keyman 3.2. If you are using a later version of Windows (95, 98, Me, NT, 2000, or XP) Keyman 6 is recommended. Question: SIL fonts in combination with Keyman 3.2 do not work on Windows XP, although entering the ASCII codes does produce the desired characters. Answer: Keyman 3.2 does not run in Windows NT, 2000, or XP. Keyman 5 or Keyman 6, which is compatible with Windows NT, 2000, and XP, is available from http://www.tavultesoft.com/. The Keyman keyboard files included in SIL fonts packages are for Keyman 3.2, and are not compatible with Keyman 5/6. If you wish to use Keyman 5/6 with SIL fonts, you will need new keyboards compiled for use with with Keyman 5/6. Check the SIL fonts website for the font you are using to find a separate download of the Keyman keyboard for Keyman 5/6. Question: The Keyman sequences for SIL IPA and SIL IPA93 fonts don’t seem to work. What should I do? Question: Is there any way to easily merge Keyman files? And how do you specify from within Keyman which font Keyman sequences will be printed in? Answer: Unfortunately there is no known way to do the first, at least not yet. As for the second question, Keyman does not determine what font will be displayed or printed by your application. Keyman merely takes your keyboard input and generates access codes to send to the application. All fonts use the same 256 access codes internally; what is displayed is determined by the font chosen. You must choose that font from within the application itself."
year_published = 2025
