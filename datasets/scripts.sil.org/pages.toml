["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dapparatussil%26site_id%3Dnrsi.html"]
title = "Apparatus SIL"
full_description = 'You are here: Type Design > Resources > Font Downloads Short URL: https://scripts.sil.org/ApparatusSIL You may be interested to know that all of the characters in Apparatus SIL are now supported in Charis SIL, Doulos SIL, Gentium Plus and Andika SIL. The specific "apparatus" glyphs are the same in each font; the design of the apparatus characters was not updated to match the design of each font. The Apparatus SIL fonts are the Unicode version of their predecessor, SIL Apparatus. The design is the same, only the encoding is different. The Apparatus SIL fonts were designed to provide most of the symbols needed to reproduce the textual apparatus found in major editions of Greek & Hebrew biblical texts. The fonts include: These fonts were based on SIL Charis, a font designed for optimum clarity and compactness when printed at small point sizes. This assures that both Charis SIL and Apparatus SIL can be used together in documents with a consistency of style. Most lines of text in the apparatus can be reproduced by combining the Greek and Hebrew fonts, transliteration (using a font such as Charis SIL), and the Apparatus SIL font. These fonts utilize OpenType and Graphite technology to provide rendering information needed by application and system software. Usability of the features provided in these fonts will depend on the exact capabilities of your software. Some of the characters are in plane 1 of Unicode and your software will need to be able to display plane 1 characters. The original SIL Apparatus font contained some superscript characters that are not in Unicode. Those characters are superscript (or modifier) lambda mu pi rho ? C F Q S X Y Z q / [ ] . , – *. Rather than encode them in SIL’s Private Use Area (PUA), we have chosen not to include those characters in this Unicode font. This pdf displays all the characters in the font. Below the glyph is the Unicode Scalar Value and then below that is the glyph id. It is the USV that you will need for accessing the characters. We do not provide a keyboard for accessing them.'
