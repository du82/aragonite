title = "Are there fonts available that will work for you?"
full_description = "Just having the characters you need in Unicode is not enough. Unicode is too big to fit all in one font, so you also have to find out which fonts contain all the characters you need. That is, all the characters you need for a particular language and script should be in the same font, and hopefully you’ll find more than one. If you use multiple languages or scripts, you can use a different font for each one. There are some fonts that contain very large inventories of Unicode, plus many others that focus on specific scripts, so you’ve got a good chance of finding a font that will work. More are appearing every year. See Font Resources. When you’re looking for a font, however, you need to consider more than just whether the font has the characters you need. For example: © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
