["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate09%26site_id%3Dnrsi.html"]
title = "NRSI Update #9 – May 1998"
full_description = "This is a longer-than-usual WinRend Update, made possible by the adaptation of a longer report given to the NRSI Field Advisory board meeting last month. Topics covered herein are: The NRSI originally hoped to have a prototype of WinRend running by CTC 1998. Unfortunately, we were unable to staff the project at all until October 1997, and even at that the staffing has been minimal. Additionally, the project has been much more complex than anticipated. This complexity stems from two areas, the first of which is simply the complexity of the problem. The second is the changing landscape, both internal to SIL (Santa Fe, LSB, etc.) and externally (Rhapsody/Yellowbox, OpenType, Java 2D). As a result of these factors, it is not clear what we will be able to show by CTC. Nevertheless, we are making progress and we are working closely with the Santa Fe and Cellar II project teams to ensure that their products are designed from the ground up with non-Roman issues in mind. WinRend is seen as a critical component for Santa Fe. We were privileged to have Martin Hosken join the team from November through January. His energy and enthusiasm helped us all make progress. Wes Cleveland and Joel Lee continue as part-time staff, working 20 hours a week each. I maintain other responsibilities within IPub and am able to work about half time on the project. When Margaret Swauger took another assignment in February, I was asked to take over management of project. Just this week, Alan Ward has been added to the WinRend team. He has some other ongoing development responsibilities so we won’t have him all to ourselves, but we are excited to his help and look forward to his contributions. Martin Hosken’s research shows that due to limitations in the Windows operating system and the way Office applications work, it is not feasible to create and utilize our own code pages in Office apps. There is therefore no significant benefit to utilizing the codepage mechanism for WinRend implementation. Unicode research is still incomplete, and on hold due to the priorities of other items."
