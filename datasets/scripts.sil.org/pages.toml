["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dencore-ipa%26site_id%3Dnrsi.html"]
title = "SIL IPA  (Obsolete)"
full_description = '''The SIL IPA Fonts are scalable outline fonts for both Macintosh and Windows systems. They contain every base character, diacritic, and suprasegmental mark currently prescribed by the International Phonetic Association. They do not include full punctuation, capitals, non-IPA, or former IPA characters. They are intended to provide as complete a solution as is possible in one font for the display and publication of phonetic text using the current IPA. The SIL Encore IPA and SIL IPA93 fonts are obsolete, symbol-encoded fonts. Their use is discouraged. If you decide to download and use these fonts, please note there is no user support for these fonts. If your university or organization requires the use of these fonts, please request they change their requirement to Doulos SIL, a Unicode-encoded font which contains the complete IPA repertoire. Please note that these fonts do not provide Unicode support. Their use is discouraged. The Doulos SIL and Charis SIL fonts do provide Unicode IPA support. However, you must convert existing data using the "SIL IPA93 Fonts" to Unicode before using the Doulos SIL or Charis SIL font (see SIL IPA93 Data Conversion). For a good discussion on making the decision of which font to use, read IPA Transcription with SIL Fonts. The SIL Encore IPA and SIL IPA93 fonts are obsolete, symbol-encoded fonts. Their use is discouraged. If you decide to download and use these fonts, please note there is no user support for these fonts. The SIL Encore IPA and SIL IPA93 fonts are obsolete, symbol-encoded fonts. Their use is discouraged. If you decide to download and use these fonts, please note there is no user support for these fonts. These fonts are intended for use by experienced computer users. Installing and using these fonts is not a trivial matter. The most effective technical support is usually provided by an experienced computer user who can personally sit down with you at your computer to troubleshoot the problem. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here.'''
