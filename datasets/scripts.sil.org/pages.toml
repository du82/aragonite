["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontfaq_otheros%26site_id%3Dnrsi.html"]
title = "Using SIL fonts in other Operating Systems (non-Windows) – FAQ"
full_description = '''Answer: SIL’s Macintosh TrueType fonts should work fine on Mac OS X, as they are traditional Macintosh fonts. Some of the special features, such as WorldScript support, would be available only in Classic apps that support them. Unfortunately, the SILKey keyboards will work only in Classic apps as well. SIL’s Unicode fonts are usable on the Mac, but only to the extent the application allows. SIL’s Unicode fonts are not fully functional on a Mac, because they rely on OpenType features to handle such things as diacritic placement, and OS X does not support OpenType features. It is up to the application to support OpenType, and very few Mac applications do so at this time. The few applications that do support OpenType provide varying levels of OpenType support. Users of Microsoft Word for Macintosh should note that versions of MacWord prior to Word 2004 do not support Unicode. Furthermore, although Word 2004 supports Unicode, the "smart rendering" technologies required to correctly render SIL's Unicode fonts have not been implemented in Word 2004. Answer: In order to install fonts in Mac OS X, you will need to be sure you have both read and write access to the Fonts folder located in the Library folder. Open the Library folder and select the Fonts folder. In the Finder, click on Get Info, then on Ownership & Permissions. In the palette that opens, check to be sure that Access is set to Read and Write. (If the pop-up menus are grayed out, click the padlock icon to unlock the pop-up menus.) In OS X, fonts may be placed in four different places: (a) the Library:Fonts folder in the Home directory of a user account; (b) the Library:Fonts folder; (c) the Library:Fonts folder in the Mac OS X System folder; and (d) the Fonts folder in the OS 9.2 ("Classic") System folder. Fonts in (a) are usable only to the user of that account. Fonts in (b) are available to all users. Fonts in (c) are also available to all users, but are essential for system use. Fonts in (d) are used by Classic applications, as well as by applications running in OS X.'''
year_published = 2025
