["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Ddecompressutil%26site_id%3Dnrsi.html"]
title = "Decompression Utilities, Downloading & Font Installation Tips"
full_description = "When you select a link for a download, you will have two options. You can choose to Open (or Run ) the download, or Save the download. If you choose to Open (or Run ) the download, your computer will first of all transfer the file from the internet to your computer, and then run the program that you have downloaded. After you are finished, it will erase the download from your computer. Selecting Save allows you to transfer the downloaded program to your computer (you can specify the name the file is to be saved under and the folder on your computer where the file will be saved.) After the file transfers to your computer, you can then Open or Run the file. “Zip files” or archives are simply a way of packaging a collection of files and folders into a single file, for more convenient downloading; the contents will also be compressed when possible, to reduce storage space and download time. To actually use the software or data, you need to extract the original files from the compressed archive. Modern operating systems have built-in decompression utilities. When you double-click on a .zip file usually another window will pop-up which contains all the files that are in your .zip file. There is usually a way for you to Extract the files into a folder of your choosing. For example, in Windows XP you would click on File / Extract All..., and then follow the wizard; and in Mac OS X, double-clicking a .zip file expands the archive into a new folder, and you can then use the Finder to move or copy the files as needed. If your operating system does not have a built-in way to expand your archive then you will need a decompression utility such as: If you do not have 7-zip, WinZip, Stuffit Expander or another decompression utility you should download the .exe file which is sometimes also provided as a download option. An .exe is sometimes an installer and sometimes it is a compressed file which is simply a way of packaging a collection of files and folders into a single file, for more convenient downloading; the contents will also be compressed when possible, to reduce storage space and download time. To actually use the software or data, you need to extract the original files from the compressed archive."
year_published = 2007
