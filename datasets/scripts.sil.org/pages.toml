["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsitesonscriptsandwss%26site_id%3Dnrsi.html"]
title = "Sites on Scripts and Writing Systems"
full_description = "The intent is to provide links to sites that describe scripts and writing systems, as opposed to sites that provide content in various scripts and writing systems, or that provide computing resources such as fonts (though some of the sites do provide such resources). Some of the sites listed provide information about orthographies of particular languages. In the long term, it will not be feasible to maintain that kind of information on a single page. For now, though, we will list sites that we know of. At some point, hopefully we will have a more comprehensive collection of information on orthographies of individual languages, and a better mechanism for presenting it. The list is organised by geographic regions, with scripts listed according to the region of origin. There is also a section for special-purpose writing systems for which a region of origin may not be familiar. (Note: although IPA is derived from European scripts, it and other general systems for phonetic transcription are covered in the section on special-purpose writing systems.) The general sites have information on many scripts, and these are not individually referenced under each script. If you are looking for details on a specific script, don't forget to check the general sites as well as the script-specific sites. Alfabetos de Ayer y de HoyThis Spanish-language site starts with an interesting family tree of scripts, with Proto-Sumerian at the root of the largest tree, and pages for each of the nodes. There appears to be more descriptive information on some than others, but there is at least one sample for each. AncientScripts.com “The aim of Ancient Scripts is? to give an introduction to writing systems, which hopefully will tantalize the reader into searching for more information on the web or in books and publications.” An Introduction to Writing Systems A tutorial on scripts and writing systems developed by Richard Ishida. “The tutorial will provide you with an understanding of key requirements for implementing writing systems in information technology. It will do this by examining real examples of a wide range of modern scripts to discover features that a computerized implementation must support.”"
year_published = 2009
year_updated = 2020
