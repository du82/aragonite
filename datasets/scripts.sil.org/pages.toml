["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate14%26site_id%3Dnrsi.html"]
title = "NRSI Update #14 – October 2000"
full_description = "Unicode is being adopted as the character encoding standard for an increasing amount of software, both in the commercial world and within SIL. However, SIL has a lot of existing data encoded according to a variety of other “legacy” encodings. Some of these are “standard,” defined by international bodies or major companies; examples include ASCII, various ISO standards, Windows codepages, Mac OS Script Manager encodings, etc. Others, however, are “in-house” encodings created for a particular SIL entity, language team, or project where “special characters” were needed and a custom font was created. For data in standard encodings, we can reasonably expect that operating systems and/or applications, as they move to Unicode, will provide the ability to convert existing data into the new encoding. In many cases, this happens automatically as part of the process of interpreting an old file format by a new version of an application; the user may not even be aware that an encoding conversion is happening. For custom encodings, the situation is different: we cannot expect that software will know how to map between our private encodings and Unicode unless we somehow describe the mapping required. In many cases, we do not even have an explicit description of the encoding; it exists only in the sense that someone picked certain locations in a font for the “special characters” required. And to complicate matters, much of our data is not tagged in any way to indicate its encoding. In the case of formatted (styled) documents, the font used for a text run may imply a certain encoding, but that encoding may only have an implicit “existence” by virtue of the arrangement of glyphs in a font. And some of our data is in plain text files, where there is even less opportunity to reliably identify the encoding(s) used. In order to successfully use legacy data in the new world of Unicode-based software, then, several things are needed: explicit descriptions of legacy encodings and their relationship to Unicode, where non-standard encodings have been used; configurable conversion software that can use such descriptions to map between the old encodings and Unicode; and identification of the encoding of each piece of data. Sometimes this may be at the level of a complete file; in other cases, a single file includes data in many different encodings (for example, in different fields of a Shoebox database)."
year_published = 2000
