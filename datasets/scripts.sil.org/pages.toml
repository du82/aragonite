["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsamplescriptimplementation%26site_id%3Dnrsi.html"]
title = "Sample Script Implementations"
full_description = "You are here: General > Initiative B@bel Short URL: https://scripts.sil.org/SampleScriptImplementation A complete index of all SIL's contributions to UNESCO‘s project Initiative B@bel can be found here. From January to October of 2003, SIL International was engaged in a cooperative project with UNESCO as part of UNESCO’s Initiative B@bel effort. The goal was to enable the development of complex script support in information and communication technologies (ICTs). This was done through preparation of documents to guide development, technical tools for complex script support, and two example script implementations. All of these are available from a general UNESCO page. This paper describes two sample script implementations prepared as part of the project. These include an implementation for Myanmar and a pan-African implementation (a single implementation for many Roman writing systems across Africa). Included in each package are fonts, keyboards and sample text files. The font files also contain the Graphite source. The keyboard files include the Keyman source. The sample text files are in the form of WorldPad files, screenshots and html. This page can also be downloaded in both Word and PDF formats: Although these sample files may still be useful, there is a more up-to-date font package found here: http://software.sil.org/padauk/. The GDL files are provided primarily as a sample for those who wish to learn to write GDL. However, these are all the files you need for recreating the Padauk Graphite enabled Myanmar font. These keyboards were developed for Keyman 5.0 or later. With this package you should have the source of this keyboards and can easily make modifications, or you may choose to look at the source to learn more about creating Keyman keyboards. Although these sample files may still be useful, there is a more up-to-date keyboard package found here: SIL Keyboarding Chart for Africa. These keyboards were updated so that no Private Use Area (PUA) characters are needed. All PUA-encoded characters that were in this keyboard are now in Unicode."
