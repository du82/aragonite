title = "IPA SIL keyboards for Mac OS X"
full_description = 'We no longer maintain any of the keyboards on this page. The Keyman program is cross-platform (works on Windows, macOS, Linux) and the IPA (SIL) keyboard is our recommended keyboard for typing IPA: IPA (SIL) These downloads contain Macintosh keyboards for typing IPA characters, compatible with Unicode 5.1. These keyboards are for Mac OS X and above. Documentation is included in some packages. This software and documentation is distributed as freeware. You may modify it, but please change the filename(s). The IPA Unicode Macintosh Keyboard in its present state is specific to the “Doulos SIL” and "Charis SIL" fonts, in that it references characters in the private use area. In future releases of Doulos SIL and Charis SIL, a number of these characters are expected to appear in standard positions according to the newest Unicode specification, and the keyboard (and encodings of any documents using those characters) will have to be changed accordingly. This does not, of course, affect standard (non-PUA) Unicode IPA characters. The keyboard now supports Unicode 6.2. The IPA Unicode Macintosh Keyboard layout is based upon the IPA MSKLC Keyboard layout found here: IPA Unicode Keyboards. Double-click and drop .keylayout file in ~/Library/Keyboard Layouts/. The Keyboard layout is available as a separate download below. It is the same as the Windows MSKLC keyboard: Below are the source files if you wish to adapt the Macintosh keyboard or documentation for your own use. The application for creating the keyboard is KeyLayoutMaker: or Ukelele. See Related Packages. Dvorak layout of v1.4 of above keyboard. Unzip and drop in ~/Library/Keyboard Layouts/. No documentation. Use the Macintosh Show Keyboard Viewer to see layout. IPA Palette IPA Unicode Input Method for Mac OS X 10.2 (‘Jaguar’) and later. A free Unicode character palette input method for the International Phonetic Alphabet. This palette is compatible with the Hiragino font shipped with Mac OS, the (Doulos SIL) font supplied by SIL, and other IPA Unicode fonts. The software enables point-and-click character entry into Unicode-compliant software under Mac OS X.'
