["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate07%26site_id%3Dnrsi.html"]
title = "NRSI Update #7 – October 1997"
full_description = "The WinRend development team is assembling in Dallas, beginning the first phase of work — research. Bob Hallissy, Wes Cleveland, Joel Lee, and (hopefully) Martin Hosken (visa permitting) will be delving into severaltechnologies to determine the best architecture for the rendering engine mandated by the NRSI Field Advisory Board (AB) last May (see WinRend, NRSI Update #5). The goal is to develop a flexible, non-Roman Windows rendering engine for use in SIL apps. We want this solution to be user accessible and we want to develop it with regular and significant field input. We plan to have a development direction ready for evaluation by the CTWC (Nov 18 &19). We envision the final product to consist of a rendering engine and a set of script tools for the user. In addition to the team listed above, we will be enlisting the expertise of our Mac specialists (Victor, Jonathan, et al) and those with strong linguistic skills (Peter Constable, Timm Erickson, for example) as well as those on the AB. Windows Keyboard Coming Everyone, including us, is eagerly awaiting the Windows release with keyboard of the SIL Hebrew Font System. Due to confusion on the part of some users, we have removed the Windows 0.5 release from the SIL Web page. Currently, only the Macintosh version is available. The Windows keyboard is currently being tested by members of the Translation Department. Macintosh WorldScript and GX Fonts Coming On the Macintosh front, staff are working on a ‘smart’ font which will perform in WorldScript and GX applications. The GX coding is completed and the WorldScript functionality is currently being added. The WorldScript version should allow full right-to-left capability in WorldScript-aware applications, although the cantillation mark placement will not be as refined as with the GX font. With GX, you will have the added capability of a ‘smart’ transliteration font, making it possible to use the same text for either Hebrew or transliteration. We are not currently planning a WorldScript transliteration font — a left-to-right rendering of right-to-left encoded text is not supported."
