["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dunicodetutorials%26site_id%3Dnrsi.html"]
title = "Tutorials"
full_description = 'Because of special character needs, SIL teams have long used custom encoded fonts. This was often the only solution and worked fairly well until newer software began "breaking" our solutions. Unicode obviates the need for most custom encoded fonts. The tutorials in this section were developed for helping people in their transition to Unicode. You will find tools for helping you figure out what the Unicode encoding should be, tutorials and tools for actually converting legacy encoded documents to Unicode encoded documents and tutorials to help you with keyboarding issues. The numbers in parentheses below refer to the folder names used in the Tutorials directory (part of Setting up your computer). SIL ViewGlyph: Introductory walkthrough notes Bob Hallissy, 2003-03-03 These are notes for showing how to use the SIL ViewGlyph utility. The SIL ViewGlyph utility is a font browser — it lets you see what is in a font. Unibook: Introductory Walkthrough Bob Hallissy, 2003-03-03 This is a short walkthrough on using the Unibook Character browser. The Unibook Character browser is a small utility for offline viewing of the character charts and character properties for The Unicode Standard. Unicode Character Properties Excel and LibreOffice Calc spreadsheet Peter Constable, Bob Hallissy, and Bobby de Vos, 2022-10-04 Various files from the Unicode Character Database compiled into a spreadsheet (Excel and LibreOffice Calc) workbook. UniView — UniView is an HTML-based application for working with Unicode characters. You can look up or find characters (using graphics or fonts) and related information, view whole character blocks or custom ranges, select characters to paste into your document, paste in and discover unknown characters, search for characters using regular expressions, do hex/dec/ncr conversions, highlight character types, etc. etc. It supports Unicode 8.0 and is written with Web Standards to work on a variety of browsers. Several pages you might find helpful as you go through this process are: How do I encode...? and Symbols in Phonetic Symbol Guide 2nd edn. in relation to Unicode 5.1.'
