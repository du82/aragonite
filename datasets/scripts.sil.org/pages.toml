["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dxsem%26site_id%3Dnrsi.html"]
title = "XSEM: XML Scripture Encoding Model"
full_description = 'This page is out of date. It may still be useful for historical purposes. XSEM was the guiding concept which led to the development of Open Scripture Information Standard (OSIS) and the OXES (Open XML for Editing Scripture) format. When a piece of literature is translated from one language to another, something special takes place. When done accurately, ideas are conveyed, knowledge and even emotions are transferred to the receptor language. Concepts and ideas that were previously contained only in one language are now free to be explored by the reader in another language. In a sense, this same concept holds true for our computers when it comes to delivering content to a user. Different software applications have different ways of containing and expressing information. This makes it inherently difficult for content producers when they want to have their material available on several different forms of media. For example, a publisher of a medical journal may wish to have a volume that was published in book format also available on the world-wide-web. The source text of the book will need to be converted from the format used to produce the book into an electronic delivery format that will be used for the Internet. There are several different kinds of electronic delivery formats available today to choose from. The one that is chosen becomes the "receptor" language. The diversity of the two mediums, book and electronic, will determine the level of difficulty in converting, or translating, this volume of literature from one format to another. Different forms of content delivery mechanisms have different advantages and are tailored to different audiences. The obvious advantage of a book is that once it is produced, other than light, it requires no power to deliver its content. However, it is more difficult to perform a word search on a paper book than an HTML web page. For this reason it is beneficial for publishers to have their content published in as many content delivery forms as reasonable so that the widest audience can be reached. This means that there can be many copies of the content in as many delivery formats.'
year_published = 2001
year_updated = 2020
