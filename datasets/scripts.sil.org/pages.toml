["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate11%26site_id%3Dnrsi.html"]
title = "NRSI Update #11 – January 2000"
full_description = "Nearly five years ago, on an assignment for Hewlett-Packard in Germany, I sat wearing headphones in a tri-lingual setting struggling to understand as a presentation was shared and concurrently translated into English. It affected me deeply, I had no idea cross-cultural communication was so difficult. Unknowingly, that moment changed my direction toward working with SIL International and the NRSI. I was born and grew up, though not taller, in the Northwest, United States. 21 years ago I met and married my wife Cyndi; together we have four boys: Ryan-19, Wes-17, Kurt-12 and Trenton-9. The family moved to the Dallas area to begin our first assignment with SIL International this past June after spending the past 20+ years in Boise, Idaho. We have purchased a home here and are all adjusting, slowly, to the climate and culture. I graduated with an Advertising Design major from Utah State University in 1975, where I developed a love for letterforms, logos and visual communications. My professional career started at a design studio in San Diego, California, proceeded to an advertising agency in Boise, Idaho, then for 18 years, with the Hewlett-Packard Company (HP). At HP I had the privilege of being part of the advent of laser printing and fonts as we know (and love?) them today. I even had opportunities to “flip bits” on early 180- and 300-dpi characters long before Fontographer-like tools. I worked as a graphics designer, managed designers/typesetters and for the past nine years, served in laser-printer marketing communications and program management. It was interesting to have a front row seat in the transition to desktop typography. After four years of preparation, my family and I are very happy to finally be here. We look forward to meeting and working with each of you associated with the NRSI team. My name is Dennis Drescher. My wife Nancy and daughter Leila (age 3) are settling into our new roles here in Dallas. I came to SIL as an auto mechanic with over 10 years experience. Our first term of service with SIL, which started in 1990, was in Togo, West Africa. My original training and assignment was in construction and maintenance. I did some management but the bulk of my first term revolved around administrative support. Because of various factors beyond the control of the branch I was never able to establish an auto repair shop as originally planned."
year_published = 2000
year_updated = 2000
