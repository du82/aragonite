["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dunesco_profiles%26site_id%3Dnrsi.html"]
title = "UNESCO Contributors' Profiles"
full_description = "Victor Gaultney has been a typeface designer with SIL International for twelve years. He has worked extensively in the area of non-Roman font design and development, but is also known for his recent Roman typeface - Gentium - which includes an extensive extended character set to cover thousands of languages around the world and has won multiple international design awards. Victor has been a consultant to major computer companies, and received his education at St. Olaf College, Minnesota, USA and the University of Reading, UK. Sharon Correll is the lead developer for Graphite, a system developed at SIL International to provide extensible rendering support for the complex writing systems of the world. She has also worked on SIL's LinguaLinks and FieldWorks projects to support the task of multilingual field research. She holds an M.S. degree in computer science from the University of Delaware, with an emphasis in artificial intelligence. In her spare time, Sharon performs as a mezzo-soprano with The Dallas Opera chorus and is pursuing opportunties as an oratorio soloist. Frank Tang was born in Taiwan, ROC. He has been an Internationalization Software Developer since 1989 and Mozilla Internationalization Module Owner from 1997 to 2002. In his free time, Frank enjoys reading the Bible. Lorna Priest grew up in Bolivia, South America. She has been with SIL International for 18 years. Lorna has worked in England, Kenya and the USA doing typesetting of Roman and Ethiopic books, computer support and teaching computer classes. The past four years Lorna has worked in the area of non-Roman publishing research and development. She has also been strategic in the process of helping SIL transition to using Unicode. Lorna also enjoys sitting with her cat Panda, reading and digging in her garden. Martin Hosken holds an BEng. in Electrical Engineering from Sheffield University in England, and he has been working with minority scripts of South East Asia and computers for ten years. Martin is currently the head of the Mainland Southeast Asia Computing Department and the SIL Secondary representative to the Unicode technical committee."
