["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dmozilla_graphitedoc%26site_id%3Dnrsi.html"]
title = "Project SILA: A Graphite-enabled Web Browser"
full_description = '''Frank Yung-Font Tang, <!-- var str1 = "<a hre"; var str2 = "f='mai"; var str3 = "lto:"; var str4 = "ytang0648"; var str5 = "@"; var str6 = "aol.com'>"; var str7 = "ytang0648"; var str8 = "@aol.com</a>"; document.write(str1 + str2 + str3 + str4 + str5 + str6 + str7 + str8); //--> , 2003-07-11 A complete index of all SIL's contributions to UNESCO‘s project Initiative B@bel can be found here. From January to October of 2003, SIL International was engaged in a cooperative project with UNESCO as part of UNESCO’s Initiative B@bel effort. The goal was to enable the development of complex script support in information and communication technologies (ICTs). This was done through preparation of documents to guide development, technical tools for complex script support, and two example script implementations. All of these are available from a general UNESCO page. SILA is a version of Mozilla that is capable of rendering text using SIL's Graphite rendering technology. This document defines the goal, requirements, and dependency of the project. It also discusses the high level architecture of project SILA after a high level overview of the Mozilla text processing and display subsystem. The complete design document is available on this page, but can also be downloaded in both Word and PDF formats: Installation: SILA can be installed by downloading and executing the installer available at http://sila.mozdev.org/silab2.html SILA is a version of Mozilla that is capable of rendering text using SIL's Graphite rendering technology. In every other aspect this software is a standards-compliant program and behaves similarly to other versions of Mozilla, including the ability to display standard HTML and XHTML with CSS stylesheets. This document defines the goal, requirements, and dependency of project SILA. This document also discusses the high level architecture of project SILA after a high level overview of the Mozilla text processing and display subsystem. To enable minority language communities to publish on the Internet by integrating the Mozilla Internet application suite (Browser, Email , Newsgroups, HTML Composer, Address Book, IRC Chat program) with SIL's Graphite technology in order to display complex writing systems correctly.'''
