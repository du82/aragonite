["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dhome%26site_id%3Dnrsi.html"]
title = "Home"
full_description = "WSTech is a department of SIL International, whose task is to provide assistance, research and development for SIL International and its partners to support the use of non-Roman and complex scripts in language development. Our vision is that language communities are effectively using their preferred writing system on computers without technical barriers. Andika, Gentium Basic, Scheherazade and Lateef are now available for use on web pages via the Google Web Fonts service! This makes it very easy for you to use on your website. For more information on this and other ways to use SIL fonts on web sites see Using SIL Fonts on Web Pages. The following list is no longer kept up-to-date. For the most recent information follow the links from our new Writing Systems Technology pages. FontUtils Martin Hosken, Bob Hallissy, Alan Ward, David Raymond, 2016-09-08 The FontUtils package provides a plethora of command line tools for manipulating TrueType fonts. These tools are essential to NRSI's font development processes. SIL Font Subsets — SIL's Writing Sysytems Technology team has created very comprehensive fonts for Latin and Cyrillic character sets. These are very large fonts that cover just about every need we know about in the Latin and Cyrillic world. Now, as we move into the age of mobile phone and web usage, everyone wants fonts that are small and compact. Our fonts are over a megabyte each and that is considered much too large for mobile phone usage. We have now created subsets of our fonts for different regions of the world. Each regional font only contains the characters (and glyphs) that are known to be used in that region of the world. We have attempted to use the most common glyph required for that region. New and improved Graphite website! Most recently: Version 4.2 of the Graphite compiler has been released for Windows, and Firefox 11+ now includes Graphite support. Unicode BMP Fallback Font Bob Hallissy, 2012-03-26 Intended for debugging, this font contains a glyph for every character in the Basic Multilingual plane (including Private Use Area) of Unicode 6.1, each glyph consisting of a box enclosing the four hex digits identifying the Unicode scalar value."
