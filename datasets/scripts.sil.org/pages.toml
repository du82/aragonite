title = "Use of SIL IPA/IPA93/Greek/Hebrew Fonts In Web Browsers – FAQ"
full_description = "Question: Is it possible to use SIL IPA, IPA93, Galatia or Ezra fonts within HTML pages within either Netscape or Internet Explorer? Answer: Unfortunately, the SIL IPA, IPA93, Galatia and Ezra fonts do not work correctly in all browsers. The SIL IPA, IPA93, Galatia and Ezra fonts are encoded as symbol fonts (rather than normal text fonts), and some browsers (including various versions of Netscape Navigator and MS Internet Explorer) cannot display symbol-encoded fonts. New versions of the SIL Unicode IPA Fonts (Doulos SIL, Charis SIL, Gentium), Galatia (Galatia SIL Greek Unicode) and Ezra (Ezra SIL Fonts) fonts are available. Note: the opinions expressed in submitted contributions below do not necessarily reflect the opinions of our website. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
