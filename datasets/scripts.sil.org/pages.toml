["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dteckitintro%26site_id%3Dnrsi.html"]
title = "TECkit"
full_description = 'You are here: Encoding > Conversion > Utilities > TECkit Short URL: https://scripts.sil.org/TECkitIntro This page is now obsolete and remains here for historical purposes. The new TECkit home page is at: https://software.sil.org/teckit/ TECkit is a low-level toolkit intended to be used by other applications that need to perform encoding conversions (e.g., when importing legacy data into a Unicode-based application). The primary component of the TECkit package is therefore a library that performs conversions; this is the "TECkit engine". The engine relies on mapping tables in a specific binary format (for which documentation is available); there is a compiler that creates such tables from a human-readable mapping description (a simple text file). To facilitate the development and testing of mapping tables for TECkit, several applications are also included in the current package; these include simple tools for applying conversions to plain-text and Standard Format files, as well as both command-line and simple GUI versions of the TECkit compiler. However, it is not intended that these tools will be the primary means by which end users perform conversions, and they have not been designed, tested, and debugged to the extent that general-purpose applications should be. TECkit: Recent changes Jonathan Kew, Bobby de Vos, 2020-05-13 This page notes significant changes made to the TECkit package and website. These notes are not guaranteed to be exhaustive! TECkit Downloads Jonathan Kew, Bobby de Vos, Nicolas Spalinger, 2020-05-13 Here is where the current version of TECkit can be obtained. Version 2.5.10, released 13 May 2020, updates the supported character repertoire (for normalization and character names) to Unicode 13. TECkit: Notes for Developers Jonathan Kew, 2004-03-30 These notes should help with Frequently Asked Questions from Developers. SILConverters 4.0 Bob Eaton, Mark Penny, 2015-08-14 This package provides tools through which you can change the encoding, font, and/or script of text in Microsoft Word and other Office documents, XML documents, and SFM text and lexicon documents. It also installs a system-wide repository to manage your encoding converters and transliterators (TECkit, CC, ICU, Perl, or Python-based, as well as support for adding custom transduction engines).'
