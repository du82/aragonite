["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dinputtutorials%26site_id%3Dnrsi.html"]
title = "Tutorials"
full_description = "Demo using Keyman Lorna Evans, 2017-11-14 This document was prepared specifically for demonstrating keyboard creation and usage with Arabic script. Comparing Keyman and Microsoft Windows Keyboard Layout Creator Ken Zook and NRSI team, 2007-04-25 This table offers a comparison of the capabilities between Keyman and Microsoft Windows Keyboard Layout Creator. Converting Keyman 3.2 Keyboards to Keyman 6 Joan M. Wardell, 2003-03-05 Getting your old Keyman 3.2 keyboards to work in Keyman5 or 6 is not difficult. There are just a few modifications needed, as discussed below. Whether you should convert your keyboards so that they can be used in Windows 2000 and higher is a question that should also be considered. It may be better to encourage users to move to new Unicode keyboards, rather than continue producing texts which must be converted. But there are legitimate reasons for using legacy fonts and keyboards, so this is how you get the keyboards to work. Installing a Keyman keyboard on macOS Nico Spalinger, 2017-11-14 These are instructions for installing and using Keyman on macOS. Keyboard Installation and Use Lorna Priest and Joan Wardell, 2009-02-19 Computers were designed to work primarily with English. The problem is that many of us wish to input other languages into the computer. This is possible by switching keyboards (not the physical keyboard) on the computer. In this overview we give details of how to use Microsoft and Keyman keyboards. Microsoft keyboards are probably preferable to use if you wish to input text in one of the languages for which they have supplied a keyboard. If you need a keyboard for some other language, or you do not like Microsoft's layout, you may want to use a keyboard manager like Keyman. Keyman allows you to create your own customized keyboard, or if you choose, you may use a Keyman keyboard someone else has created. Instructions are given here for installing Microsoft keyboards as well as Keyman keyboards. Building Keyboards with Keyman 6.0 Lorna Priest, 2003-02-20 We will be creating a keyboard which will allow us to type IPA text. Our goal will be to learn how to develop a Keyman keyboard, not to create a complete keyboard."
