["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dmac_kbd_faq%26site_id%3Dnrsi.html"]
title = "Keyboards troubleshooting - Mac OS X"
full_description = "Answer: If you have downloaded a keyboard onto your Mac but it doesn't seem to be working as you expected, it may be that you have not fully installed it. Until the keyboard is correctly installed, nothing else that you do will make it work. Once you have downloaded the keyboard, find the keyboard file in your downloads folder and open it. This will open up a new window called ‘Keyboard’ with two files in it. Select the one with the extension .keylayout. Next, open up a new Finder window, go to your ‘Library’, and select ‘Keyboard Layouts’. Drag the .keylayout file over into your ‘Keyboard Layouts’. Then, under the Apple menu, go into ‘System Preferences’ and select ‘Language and Text’ (this is called ‘International’ in some versions of the Mac OS). Click on ‘Input Sources’ (sometimes called ‘Input Menu’), scroll through the list of keyboards, and put a check mark next to the keyboard you have just downloaded. Finally, you need to select the keyboard from the keyboard menu. This usually appears as a small icon of a flag or a little box containing the letters ‘U+’ in your menu bar. Click on this to see a list of key layouts on your machine, and select the one you need. Once a keyboard has been successfuly installed on your machine, you need only to select it from this keyboard menu each time you need it; you don't have to go through the whole process every time. In the same way, once you are finished using your new keyboard and wish to switch back to a different one, use the keyboard menu to do this also. As our fonts and utilities are distributed at no cost, we are unable to provide a commercial level of personal technical support. We will, however, try to resolve problems that are reported to us. We do hope that you will report problems so they can be addressed in future releases. Even if you are not having any specific problems, but have an idea on how this system could be improved, we want to hear your ideas and suggestions."
year_published = 2014
