title = "Rendering"
full_description = "Rendering technologies overview Bob Hallissy, 2003-05-27 A tour of basic issues related to rendering text for various writing systems, beginning with a simple model and building up to current technologies available for complex rendering. An Introduction to TrueType Fonts: A look inside the TTF format Victor Gaultney, Martin Hosken, Alan Ward, 2003-05-23 The primary font technology used on Microsoft Windows and the Mac OS is based on the TrueType specification. This article examines the function of each of the internal tables that comprise a TrueType font. Examples of Complex Rendering Sharon Correll Many writing systems around the world have complex rules governing the way the elements of the script are written. These kinds of writing systems require smart font technology to be rendered properly on the computer. Presentations and working papers in the area of rendering Melinda Bowman, 2003-01-28 You can download this information written by members of SIL. Challenges in publishing with non-Roman scripts Lorna A. Priest, 2003-02-27 There are a number of challenges in the typesetting of non-Roman scripts. These include problems of interaction between the font and typesetting system, problems of very large character sets, and considerations of typesetting the particular script. Applications that provide an adequate level of support for SIL Unicode Roman fonts WSTech staff, 2011-07-15 Known applications which provide an adequate level of support for SIL Unicode Roman fonts (such as Andika, Charis SIL, Doulos SIL and Gentium Plus). SIL TypeTuner Alan Ward, 2008-10-26 TypeTuner can change the default glyphs, line metrics, and behaviors in specially prepared fonts. SIL TypeTuner Web Bob Hallissy, 2010-11-30 TypeTuner Web (or TTW) is a web delivery system for customized versions of SIL fonts. Now including: Andika, Charis SIL, Doulos SIL, Gentium Plus, Lateef and Scheherazade. The XeTeX typesetting system Jonathan Kew, 2008-04-11 XeTeX, a typesetting system based on a merger of Donald Knuth's TeX system with Unicode and modern font technologies, including support for both AAT (on Mac OS X) and OpenType (on all platforms) layout features."
