["https://scripts.sil.org/fontutils.html"]
title = "FontUtils"
full_description = '''2015-01-26 - Added GSUB Type 8 Reverse-chaining substitution, make_fea; bugfixes to ttfsubset, hackos2, ttf2woff, others. 2014-01-14 - Improvements to ttfbuilder, ttfsubset, volt2ttf, dumpfont, ttf2woff, psfix and others; bug fixes throughout; clarified license. 2008-06-11 - New utility (add_classes); new options (make_gdl, make_volt, volt2ttf); improvements to volt2ttf. 2007-11-16 - New utilities (volt2ttf, ttf2volt, ttfbboxfix, ttftable, sfd2ap, volt2ap); ttfname improvements. SIL FontUtils collection provides command line tools for manipulating TrueType fonts. These tools are cross-platform and work on Windows, Mac, and Linux. Written in pure Perl, the source modules (Font::TTF::Scripts and the supporting library package Font::TTF) have been available for a number of years and are an essential tool of NRSI's font development processes. For Perl users the most up-to-date sources can be retrieved from our Subversion repositories. These scripts are also packaged as standalone Windows executables, making them usable by those who do not have Perl. A number of utilities formerly installed with this package have been obsoleted by alternative tools or deemed to be low usage and so are no longer installed as executables by the standard installers (binary or source). However, the source bundle includes all of these in the Examples folder. All of the tools are commandline, so you will typically launch them by typing the command name and parameters into a CMD window. Most tools provides their own "usage" message explaining the parameters. To get the usage message, execute the command with no parameters. For example: The installer should be downloaded to a temporary folder and then launched. This will install the package. By default the installer adds the installation folder to your PATH. As an alternate installation: turn off the option to modify your PATH variable during installation. When the installer has finished, copy all the .BAT files from the install directory (typically C:/Program Files/SIL/FontUtils to a folder that is already on your PATH.'''
