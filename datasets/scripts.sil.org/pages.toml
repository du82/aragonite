["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dfontfaqs%26site_id%3Dnrsi.html"]
title = "General Font FAQ"
full_description = "Question: Why can't you create a single font that contains all of the scripts needed rather than separate fonts for each script? Or, if you can't do it in one font, at least put all the IPA in each different writing system font. Our basic position is that this is the wrong approach to the issue. This is an application developer's problem. It is technically impossible with today's technology to create a single font that can display all the characters in Unicode, even if we wanted to. Applications need to deal with the fact that arbitrary text may require multiple fonts. (Today's operating systems provide fallback mechanisms to help with this, for cases where the app doesn't want to explicitly style all the text runs.) Question: Will documents created with earlier (legacy) fonts such as the SIL IPA and IPA93 fonts be compatible with the new (Unicode) version? Answer: No, documents which were created (encoded) with legacy fonts are not compatible with Unicode fonts. You will need to convert your data to Unicode. You can use TECkit for this process. We have mapping files (which work with TECkit) for converting documents which used our Greek, Hebrew and IPA fonts to Unicode. For instructions geared to IPA, see SIL IPA93 Data Conversion. Answer: If SIL is in front of a font name then that probably means it is a legacy font. If it is after the font name it probably means it is Unicode. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
