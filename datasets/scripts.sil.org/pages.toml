["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dcodepage1252%26site_id%3Dnrsi.html"]
title = "Martin’s Codepage 1252 Hack"
full_description = '''Martin’s Codepage 1252 Hack allows the Symbol codes (U+F020-U+F0FF) to be converted to 8-bit data via the codepage of the data (usually cp_1252) by adding mappings for the Symbol code range back to normal ASCII values. When you try to save Symbol encoded text in an 8-bit only form, the codes will be converted to conventional ASCII codes rather than question marks. Use at your own risk! Microsoft does not condone or support customized codepage definitions. We cannot be held responsible for any problems if you install this unsupported codepage. For use on Windows 9x only. Do not attempt to use on Windows 2000 or Windows XP as it reportedly crashes those systems. Codepage 1252 HackMartin Hosken, 1998-08-21Download "cp_1252a.nls", Windows NLS file, 9KB [4537 downloads] If you notice any differences in your environment, change the registry key back to cp_1252.nls, and reboot. If you can’t access your registry, restore it from the backup taken in step 1 above. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here.'''
