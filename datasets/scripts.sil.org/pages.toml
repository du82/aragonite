["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dkeymanipatutorial%26site_id%3Dnrsi.html"]
title = "Building Keyboards with Keyman 6.0"
full_description = "This page is now obsolete. It is provided for historical information. For using the Keyman program, please go to the Keyman site. We will be creating a keyboard which will allow us to type IPA text. Our goal will be to learn how to develop a Keyman keyboard, not to create a complete keyboard. In this tutorial we are going to begin creating a mnemonic keyboard for IPA. In order to test the keyboard you will also need a Unicode-based font. Either Doulos SIL or Code2000 (which is a shareware Unicode font you can use) will work fine. Before we begin, we need to look at which characters we want in our keyboard. In order to save time, I have chosen to use just a few of the characters used for IPA. These are listed in the following charts. A keyboard file is divided up into a header (which contains such things as the name of the keyboard, copyright information, etc.) and the rules. The rules give Keyman information it needs for converting keystrokes into something else. Let’s begin by opening TIKE (Start / Programs / Tavultesoft Keyman Developer / TIKE) and writing the header. When you open TIKE you get a welcome screen. Select Keyboard or Start a Keyboard Source File and OK Type in the information you want for your header or select Keyboard / Insert Standard Header. You can choose to use a traditional header or use the newer stores options: Each of the above rules must all be typed on one line. You will get an error message if any of the rules/lines go onto the next line. NAME is the name you will see when you install the keyboard and go to select the keyboard you want to use. BITMAP is the bitmap shown on the tray when it is active. (You don’t need the .bmp extension in the Keyman file, although the actual filename does.) MESSAGE is if you want other people using this keyboard to read something as they install the keyboard. To edit the bitmap (or create a new one), right-click anywhere on the BITMAP line and click on Edit bitmap… If you already have a bitmap by that name it will bring that one up, if not it will ask if you want to create a new one. Editing is simple so we won’t cover how to create a bitmap. When you are finished, close the bitmap and save it."
