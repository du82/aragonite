["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dezrasil_faq_2003%26site_id%3Dnrsi.html"]
title = "Ezra SIL Frequently Asked Questions for Office 2003 — FAQ"
full_description = '''1. Marks may not display properly or consistently unless Office 2003 or later is installed. Part of the code for displaying Hebrew is included in this software, plus there are numerous bug fixes for language handling. See Keying in Hebrew.pdf if you are uncertain of the mark classes. This strict order may be handled internally in subsequent versions of Microsoft Office. Other Hebrew fonts may not require this order. 3. Note that where there are multiple vowels or multiple cantillation marks, they should be listed in the order they appear, from right to left and low before high. 4. As shown, cantillation marks which normally occur at the beginning of a word (pre-positives) must follow the first consonant and vowel, according to Unicode 3 requirements. The font will recognize and place them word-initial. 5. These fonts will not correctly display text which is in Unicode 5.0 canonical order. Use the order in statement 2, above. Some preliminary tests suggest that this is no longer true for Windows Vista or Office 2007, but this has not been checked extensively. The original Biblical Hebrew font (SIL Ezra) was optimized for reading at point sizes of 14 or 16. We suggest that you use Ezra SIL at a point size of 16 to be fully readable and not out of proportion to Times New Roman at point size 12. It may help to turn on ClearType for better screen display. Here are instructions for Windows XP, from Microsoft Help (search on ClearType): Sometimes the right parenthesis appears when you type ")" and sometimes you get the left one. This is because certain items are now "mirrored" in Unicode. These include parentheses, brackets, and curly brackets or braces. The application, not the keyboard or the font, determines which one you will get. So if you don't get the right shape when you type ")", try "(". Yes, as long as you meet the conditions of the license (do not sell by itself, include the necessary files, rename Modified Versions, do not abuse the Author(s)' name(s) and do not sublicense).'''
