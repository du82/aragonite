["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate06%26site_id%3Dnrsi.html"]
title = "NRSI Update #6 – August 1997"
full_description = "I will be traveling to San Jose, California to attend the “Eleventh International Unicode Conference and Global Computing Showcase” September 1 - 5, 1997. The theme for this year’s Conference is “Software Development+ the Internet: Going Global with Unicode”. The Conference will bring together industry-wide experts on the global Internet and Unicode, internationalization and localization, implementation of Unicode in operating systems and applications, fonts, text layout, and multilingual computing. For more information about the Unicode conference, see http://www.reuters.com/unicode/iuc11. For more information about Unicode see http://www.unicode.org. Included in Shoebox for Windows beta version 3.07 (another test version is expected in September 1997) will be a new version of the SDF-based Rendering Engine, as well as a new non-Roman Script development tool, the SDF Editor.(For a brief description of the SDF-based Rendering System, see “Introducing the SDF-based Rendering Engine”, NRSI Update #4.) Anyone interested in helping test SDF in Shoebox should contact Karen Buseman. In addition to the original features supporting cursive-script, ligatures and right-to-left text in ShoeBox (no localized version of Windows required), the latest version of the SDF-based Rendering Engine includes some new capabilities. It now gives users the ability to specify special forms of a character/ligature that occur in word-initial, word-final and word-by-itself contexts, as well as a way to create forms that depend on a specific environment constraint. Fairly complex script behavior can now be described without large sets of extended ligatures. This new program allows editing of Script Description Files (SDFs) in a WYSIWYG, point-and-click environment with extensive online help. The goal of the interface design was to make Non-Roman Script Rendering customization and experimentation accessible to novice users, so that field linguists could test out their own ideas in orthography and come up with workable non-Roman script solutions for themselves."
year_published = 1997
year_updated = 1997
