["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dintlniameykybd%26site_id%3Dnrsi.html"]
title = "The “international niamey keyboard” Layout"
full_description = "The African Reference Alphabet was a proposal for characters to be used in writing the languages of Africa, developed at meetings in Niamey, Niger in 1978. Two of the participants in that work, David Dalby and Michael Mann, went on to revise that proposal, and further proposed a standardised keyboard layout, which they called the “international niamey keyboard”. Note that one of the differences between the original 1978 proposal (see charts of the African Reference Alphabet) and Mann and Dalby's revision is that the latter does not use case. Mann and Dalby comment, “it is our view that no language requires upper and lower case varieties of every letter for its transcription, and we consider that the textual use of capital letters could be abandonded [sic] without detriment… to insist on the use of capitals in the writing of african languages is to impose on these languages an unnecessary western european convention...”1 Clearly, abandonment of capitals has a very significant impact on the design of a keyboard layout since there are only half as many characters to support. With that background, the “international niamey keyboard” proposed by Mann and Dalby is as follows: Mann, Michael, and David Dalby. 1987. A thesaurus of African languages: A classified and annotated inventory of the spoken languages of Africa with an appendix on their written representation. London: Hans Zell Publishers. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
