["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsiltd_home%26site_id%3Dnrsi.html"]
title = "SIL Tai Dam (Obsolete)"
full_description = "This SIL Tai Dam fonts are a pre-Unicode or “legacy” font system. These fonts are superceded by the Unicode-encoded Tai Heritage Pro font. The SIL Tai Dam Fonts are regular and bold versions of the traditional Tai Dam script and are closely based on handwritten letters. The fonts are available for both Macintosh and Windows systems and include keyboard definitions. Over half a million Tai Dam people (also known as Black Tai or Tai Noir) live in northwestern Vietnam and northern Laos. Their language is a member of the Tai-Kadai language family and is closely related to Laotian and Standard Thai. The Tai Dam have a long tradition of literacy in the script rendered by the TaiHeritage font family. In more recent years, other orthographies, including romanizations, have come into use as well. Special thanks are due to Mr. Faah Baccam, whose drawings have served as the basis for the development of these fonts. Any defects in the final digital designs, however, remain our responsibility. Suggestions for design improvements in any future edition, especially from Tai Dam users of the fonts, are welcome. SIL International (SIL) is an organization of linguists dedicated to the study and promotion of the thousands of languages around the world. SIL’s International Publishing Services serves SIL by developing products to assist in the publication of linguistic texts. As a service to the general academic community, we are happy to make this package available at no charge. You may (and are encouraged to) share this package with your friends and co-workers, as long as you abide by certain distribution restrictions. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
