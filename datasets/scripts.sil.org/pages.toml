title = "Codepage templates for MS Word"
full_description = "These Word templates show “all the characters in a font”. (That is, all of the characters in a font than can be displayed using a particular codepage.) AllChar6.dot, AllChar2000.dot: Characters at codes d32 - d255 are displayed in a user-selectable font in 16 rows of 16 along with a character code label in decimal. Codepg6.dot, Codepage2000.dot: Characters at codes x20 - xFF are displayed in a user-selectable font in 16 columns of 16 along with character code labels in hexadecimal and decimal. each pair, there is one template that is intended for use with Word 6 or Word 95; these are AllChar6.dot and Codepg6.dot. The other templates, AllChar2000.dot and Codepage2000.dot, are intended for use with Word 97 and later versions. The templates for Word 97 and later have some additional functionality to address certain issues related to codepages (in particular, changes made in Windows codepage 1252 to support the euro character). © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
