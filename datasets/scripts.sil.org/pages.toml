["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dgraphiteeditcontrolspecs%26site_id%3Dnrsi.html"]
title = "Specifications for Graphite-enabled Edit Control"
full_description = "A complete index of all SIL's contributions to UNESCO‘s project Initiative B@bel can be found here. This document describes the specifications for the Graphite-enabled edit control that is being developed by SIL International in accordance with their contract with UNESCO. The edit control will consist of a DLL for an ActiveX control that can be embedded within a host application. The control will run on Windows 2000 and XP operating systems. The first phase of development will support a simple COM interface that is adequate to initialize the control with data. Also the standard ActiveX control mechanism will be used to set the physical height and width of the control. Later versions of the control will support standard COM interfaces ITextDocument and ITextRange. Later phases will require support of ITextSelection, ITextFont, and ITextPara. The following methods will be implemented: Phase 4 involves adding the Text Object Model interfaces to the control. This will involve implementing the methods named below. The behavior of these methods is specified in Microsoft's MSDN documentation. The control will support the following subset of the XHTML format described in the document “XHTML Format for WorldPad File Equivalence”. Style properties: style, font-style, font-weight, color, background-color [optional, since it is not required by Paratext], vertical-align, text-decoration, text-align, text-indent, margin-left/right/top/bottom, line-height (single, 1\u001A, double spacing). For a single-line edit control, the entire text will be displayed on a single line that scrolls horizontally. Typing off the trailing side (i.e., in a left-to-right control, the left side) of the control will cause the control to scroll horizontally; similarly deleting or moving the selection with the arrow keys will scroll to keep the selection visible. No scroll bar is required. Insertion of paragraph-breaking characters such as the Return key will be ignored. Pasting data or reading data from a file that includes paragraph-breaking characters will have the effect of inserting just the first line of the text."
year_published = 2003
