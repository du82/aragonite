["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Duniipakeyboard%26site_id%3Dnrsi.html"]
title = "IPA Unicode Keyboards"
full_description = "We no longer maintain any of the keyboards on this page. The Keyman program is cross-platform (works on Windows, macOS, Linux) and the IPA (SIL) keyboard is our recommended keyboard for typing IPA: IPA (SIL) The name and version number for the SIL keyboards have changed in order to comply with SIL’s PUA deprecation policy. To find out more, you can also read SIL PUA version — what is that?. Documentation for SIL’s Corporate PUA, along with version numbers, can be found here: SIL Corporate PUA Assignments On Windows, three keyboarding options are available: an IPA Keyman keyboard and keyboards which work through the Windows keyboarding system (MSKLC) for US, UK, FR, DE and PT (Portuguese) keyboard layouts. The “SIL IPA” keyboard, developed by Martin Hosken, is a mnemonic compiled Keyman keyboard. It is intended to provide a text input method for Unicode-based applications, in order to access IPA characters. Although greatly expanded, the keyboard layout is similar to that provided for the old pre-Unicode SIL IPA93 fonts. The Keyman IPA (SIL) keyboard is now available on the Keyman site: https://keyman.com/keyboards/sil_ipa This keyboard will no longer be maintained. Since Keyman is freely available and now works on all platforms, we encourage people to use the IPA (SIL) Keyman keyboard available here: https://keyman.com/keyboards/sil_ipa This keyboard uses The Microsoft Keyboard Layout Creator (MSKLC): https://support.microsoft.com/en-us/help/823010/the-microsoft-keyboard-layout-creator It was designed to be similar to SIL's IPA Unicode Keyman Keyboard, in that the keystrokes follow a similar layout. In many cases keystrokes are merely reversed. That is, instead of typing n> to get a U+014B , you would type >n. This system is not always possible to maintain using MSKLC since the Keyman keyboard often used more than two keystrokes and this is not allowed using MSKLC. Please read IPA Unicode 6.2 (ver 1.4) MSK.pdf (in the download package) for installation instructions and the keyboard layout. Make sure that you reboot after installing the keyboard."
