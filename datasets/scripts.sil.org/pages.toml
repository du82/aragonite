["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dgreditctrldoc%26site_id%3Dnrsi.html"]
title = "Graphite-enabled Edit Control Version 0.9"
full_description = '''A complete index of all SIL's contributions to UNESCO‘s project Initiative B@bel can be found here. From January to October of 2003, SIL International was engaged in a cooperative project with UNESCO as part of UNESCO’s Initiative B@bel effort. The goal was to enable the development of complex script support in information and communication technologies (ICTs). This was done through preparation of documents to guide development, technical tools for complex script support, and two example script implementations. All of these are available from a general UNESCO page. This document describes a beta version of a basic Graphite edit control for data input applications. It includes a software development kit (SDK) that includes: a binary DLL for Windows 2000 and XP, a developer guide for integrating into host applications, well commented source code, a simple Windows (2000 & XP) based test application for testing the control. The complete document is available on this page, but can also be downloaded in both Word and PDF formats: SilGraphiteControl is an ActiveX control that provides rendering using SIL's Graphite engine. It is intended for use on the Window 2000 and Windows XP operating systems. The functionality of version 0.9 is fairly close to what is described as "phase 3" in the specification document. See the Known issues section below for more details about the status of specific features. The test application is provided solely to demonstrate how to interface with the edit control. It is known to be buggy! To use the edit control within your application, you will need to download one of the executable packages above. The SILGraphiteControl.ocx file must be registered using regsvr32. You may also need to install and register the three MFC DLLs in the package above if they are not already present on your system. Mouse bug: It is possible to get into a state where the mouse hangs. Workaround: do an extra right click to return the mouse to its normal state. Graphite and Uniscribe: The Graphite engine is used for all fonts, even those with no Graphite tables. This is a hinderance to perforance, and also means that Uniscribe support built into the operating system is not available.'''
