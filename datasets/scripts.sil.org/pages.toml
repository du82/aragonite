title = "Unicode Character Count utility"
full_description = "UnicodeCCount is a quick-and-dirty Unicode-aware replacement for CCount, the character count utility. Written in Perl, the program is available both as the Perl source (requires Perl 5.8.1 or newer) and as a stand-alone Windows EXE. UnicodeCCount is a command line utility. When executed without any parameters it emits a short help message: Suppose I have the first paragraph of the Russian translation of the Universal Declaration of Human Rights in a plain-text UTF-8 file called mytext.txt. The text looks like this: Принимая во внимание, что признание достоинства, присущего всем членам человеческой семьи, и равных и неотъемлемых прав их является основой свободы, справедливости и всеобщего мира; и (note the redirection of standard out in order to capture the output to a file) would result in the following UTF-8 data in counts.txt: As this program is distributed at no cost, I am unable to provide a commercial level of personal technical support. I am interested in hearing from you, however, and will try to resolve problems that are reported to me. You can send feedback to me here. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
