["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnastaliq_support%26site_id%3Dnrsi.html"]
title = "Nastaliq Navees Troubleshooting tips"
full_description = '''Please note that this font does not provide automatic support for the The Unicode Standard. The Nastaliq Navees font is an obsolete, symbol-encoded font requiring the obsolete QuickDraw GX technology. The use of Nastaliq Navees is discouraged. If you decide to download and use this font, please note there is no user support for the font. SIL has a Nastaliq style font called Awami. We also provide four other Naskh fonts: Arabic Fonts. This section attempts to provide answers to the most common problems encountered with the Nastaliq Navees package. Answer: Applications which do not use GX typographic functions (even though they may claim to "support" GX, meaning they can use the GX printing system) will not see the Nastaliq Navees fonts, as mentioned above. You need a true GX-based text application to use Nastaliq Navees. Answer: Things can be a little confusing in TeXgX. The Font menu refers only to the text editing window, not the typeset output. The text editor uses WorldScript but not GX typography, and as such cannot use (or even see) Nastaliq Navees. However, the Font Information window (available from the File menu) should show that Nastaliq Navees is available, and it can be selected for typesetting with a font... command in the TeX document. Answer: This happens (often intermittently) if you forget to use the GXPatcher to modify your copy of QuickDraw GX or GXGraphics. See the instructions for more details. Answer: Due to a bug in the GX-to-PostScript translator, glyphs can occasionally be incorrectly positioned on PostScript Level 2 printers. You get the proper character shape, but the vertical positioning is wrong and therefore it doesn't join properly with its neighbors. To work around this problem, instruct the printer driver to use only PostScript Level 1; this can be done with the PostScript Options printing extension. As these fonts and utilities are distributed at no cost, we are unable to provide a commercial level of personal technical support. This is the final release of these fonts.'''
year_published = 1997
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnastaliq_support%26site_id%3Dnrsi.html"
