full_description = "You are here: Encoding > Conversion > Utilities Short URL: https://scripts.sil.org/EncConverters40_Usage This document is primarily for developers who are interested in adding EncConverter support to their application. There are several functions in the EncConverter(s) interfaces that greatly simplify the use of the EncConverters core in various client applications. Through these functions, the various Transduction Engine plug-ins provide their own user-interface for adding and configuring converters, eliminating the need for client applications to create their own user-interface elements for the various transduction engines. This article shows the new functions, some snippets of code to invoke them, and examples of the resulting user-interface dialog boxes. The functions described here have not changed significantly since version 2.2, however, the program ID string is different in different versions. If you are using the EncConverters core version 4.0, then you use the namespace prefix, “SilEncConverters40” as shown below. If you are using an earlier version (e.g. SILConverters 3.1 or earlier), you will want to use “SilEncConverters31” in the strings given in the snippets of code below. The AutoSelect function can be used by client application code to launch the Select Converter dialog box, which allows the user to choose the transducer they want to use: In this dialog box, the user can select the desired converter from the list of available converters in the System Repository and also select the Conversion Options, such as Direction, Normalization of the output data, and Debug mode for getting feedback about what data was sent and received by the underlying conversion engine. Once configured, the user clicks OK , and the IEncConverter object corresponding to the selected transducer is returned to the client application for use. The ConvType parameter can be used to have the Select Converter dialog filter the list of converters being displayed. Depending on the needs of the client app, you can limit the list to only Legacy to Unicode Encoding converters, for example, by passing in the value:"
