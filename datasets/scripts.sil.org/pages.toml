["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsilkeyboards%26site_id%3Dnrsi.html"]
title = "Keyman Keyboards"
full_description = '''This page is now obsolete. For using the Keyman program, please go to the Keyman site. Most of the keyboards on this page are now available on the Keyman site. This page is now obsolete. It is provided for historical information. For using the Keyman program, please go to the Keyman site. Most of these keyboards are now available for download from the https://keyman.com/ site. Other Cameroon resources include a mapping file to convert from the SIL Cameroun Branch "cam2dr" truetype font to Unicode encoding. This is a pan-Africa keyboarding chart. Results were compiled from data received from SIL entities in Benin, Burkina Faso, Cameroon, Chad, Côte d'Ivoire, Nigeria, Senegal and Togo. Where possible, the keystroke sequences that the majority of the entities seemed to prefer was used. Other Eastern Congo resources include a mapping file to convert from the Eastern Congo Group fonts to Unicode encoding. This keyboard was developed for use by BTL (Bible Translation & Literacy) language teams in Kenya. It was originally created for customized fonts but has been updated for Unicode. Other Vai resources: Two Vai Unicode fonts are available here. Dukor is based on SIL Vai. Windows 7 provides a Unicode font with Vai support called Ebrima. TECkit mapping files for converting SIL Vai text to Unicode are provided here. Other Mali resources include mapping files to convert from the SIL Mali standard legacy fonts to Unicode encoding and Charis SIL fonts which have been modified for use in Malian languages. This keyboard was developed for keyboarding Wayuu which is spoken in Colombia and Venezuela. This keyboard is developed for Keyman 6.0 on any keyboard. Keyman 6.0 must be installed prior to attempting to install this keyboard. Guidelines for who can use Keyman can also be find at this site. After installing Keyman, download the Wayuu keyboard and double-click on the file you downloaded. This should install the keyboard and the documentation. Read the documentation by going to Start / Programs / Wayuu Keyboard / Wayuu Documentation.'''
