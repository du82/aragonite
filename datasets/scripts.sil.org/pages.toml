["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsilfred%26site_id%3Dnrsi.html"]
title = "Friendly Right-to-Left Editor (FRED)"
full_description = "This SIL Hebrew Font System is a pre-Unicode or “legacy” font system. It provides a means of working with biblical Hebrew texts in an encoding created by SIL in 1995. These fonts are superceded by Unicode-encoded Hebrew fonts, such as Ezra SIL. The transliteration fonts in this package were made obsolete with the advent of Latin Unicode fonts, available with any newer OS. Only a keyboard is helpful (not required) for typing Hebrew transliteration. See last item in Ezra SIL package or Hebrew-Greek Transliteration Unicode Keyboard for Macintosh for two examples. Use of the SIL Hebrew Font System is enhanced by this Windows utility for typing right-to-left. It only works with the SIL Ezra Hebrew font (obsolete). FRED simplifies typing with the SIL Ezra font (only) by allowing the user to view text right-to-left as it is typed in a small window. It can then be cut and pasted to any Windows text window. It is therefore not required to use Microsoft Word 6.0 and the Reverse macro when using the SIL Ezra font. The download file (SILFRED1.EXE) is a self-extracting archive. After the download is complete, use File Manager or Explorer to select the drive icon where the SILFRED1.EXE file is located. Find SILFRED1.EXE in the directory window and double-click on it. This will extract the files to the current directory. (In the Windows 3.1 File Manager you may need to press F5 to update the directory screen). Windows 98 OS: Do not hit the return or enter key when typing in the FRED window. This causes FRED to disappear and you will not be able to type in any window. The mouse will still be working however. To clear this problem, completely exit from KeyMan. You may then re-open both Keyman and FRED and continue. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
