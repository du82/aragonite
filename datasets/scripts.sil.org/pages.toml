full_description = "You are here: Rendering > Technologies > Graphite Short URL: https://scripts.sil.org/WorldPadDownload This page is obsolete. WorldPad is no longer being maintained. LibreOffice now uses Graphite and can be used as a replacement for WorldPad. For using the Keyman program, please go to the Keyman site. .NET runtime. WorldPad 2.14 requires the .NET runtime version 2.0 to be installed. Windows users can get it at the link below. (It can be installed simultanously with the 1.1 runtime which is needed for WorldPad 2.1.) Keyman Version 6 (build 164 or later) - this is optional. WorldPad will run without it, but entering non-Roman text may be more difficult. The FieldWorks installer provides an alternate way of installing WorldPad, but only one installation can be in effect at a time. Installing WorldPad 2.8 will uninstall the FieldWorks suite, and WorldPad 2.8 must be uninstalled before installing or reinstalling FieldWorks. For Windows XP. Release version. .NET 2.0 (see link above) is a prerequisites and must be installed before installing WorldPad. Generates a new .WPX format. No installer is available; consult the readme.txt file for installation instructions. For Windows 2000 and XP only. Release version. If you already have WorldPad 1.0 or 1.0.1 installed, this is a smaller download that will allow you to simply replace the executable and DLLs. For Windows 2000 and XP only. The 1.0.1 version has different set-up requirements than 1.0; please consult the readme.txt file. Debug version. The 1.0 version uses a different file format from the beta and does not include a nice installer. For Windows 98, 2000, and XP. We gratefully acknowledge the assistance of UNESCO in this project. This material is released under LGPL/CPL licenses. Details of these licenses may be found at http://www.opensource.org/licenses/ © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology tea