full_description = "SIL has created comprehensive fonts for Latin, Cyrillic, and Greek character sets. Charis SIL, Doulos SIL, Gentium Plus and Andika are very large fonts that cover just about every need we know about in the Latin and Cyrillic world. These fonts are also well known for supporting the needs of the International Phonetic Alphabet (IPA). Gentium Plus and Galatia SIL also support the Greek script. Our Latin, Cyrillic and Greek fonts were designed for a variety of styles and uses. In order to understand which font would best be suited for your needs you can read more about the different styles of our fonts… SIL serves language communities worldwide, building their capacity for sustainable language development, by means of research, translation, training and materials development. See SIL home page. Most of the fonts listed below support a similar set of Latin and Cyrillic characters. However, Gentium Plus supports Greek characters as well as Latin and Cyrillic. Galatia SIL supports Greek characters and a minimal set of Latin characters. Visit the individual pages to find the exact character set supported by each font. This font software is free to use, modify and redistribute according to the terms of the SIL Open Font License."
