["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dconversion%26site_id%3Dnrsi.html"]
title = "Conversion"
full_description = "Roman Script to Arabic Script Conversion NRSI staff, 2013-04-25 The SIL Converters software provide the framework to convert your texts from Roman script to Arabic script. This document is not a manual of SIL Converters or the TECkit mapping language but attempts to highlight some principles that need to be considered when converting text from Roman script to Arabic script. An Experiment in Converting Legacy Data to Unicode and XML Lorna A. Priest, 2003-07-16 This is a quick example to give a general overview of the complete process of converting a legacy file to Unicode (UTF-8) and XML (we have chosen to use OSIS markup format). Learning about the various utilities will take time, but this should give you the big picture. Encoding Conversion Frequently Asked Questions and Known Issues Lorna A. Priest, 2009-05-15 Frequently Asked Questions and Known Issues concerning conversion of legacy data to Unicode. SIL IPA93 Data Conversion Lorna A. Priest, 2009-02-16 Step-by-step instructions on how to convert Microsoft Word, text or Standard Format (sfm) documents that use SIL IPA93 fonts in order to use Unicode fonts. Are there fonts available that will work for you? Albert Bickford, Jim Brase and Lorna Priest, 2007-05-11 This article helps you know what to consider when looking for fonts to meet your Unicode needs. When to Convert to Unicode Albert Bickford, Jim Brase and Lorna Priest, 2007-05-11 This article will help you recognize whether you and your language data have entered the window of opportunity for converting your data to Unicode. It will also help you predict whether you are approaching the end of the window: the point where a conversion is necessary. It will help you decide whether now is the time to convert. Is the technical expertise to do the conversion available to you? Albert Bickford, Jim Brase and Lorna Priest, 2007-05-11 Actually converting data to Unicode requires special expertise. Some users can learn what is required. This article explores whether you should get help or whether you have the expertise to attempt it by yourself."
