["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dpadauk_faq%26site_id%3Dnrsi.html"]
title = "Home - Padauk"
description = "Padauk is a Unicode Myanmar font family with broad support for writing systems that use the Myanmar script. This script is an abugida, a writing system in"
full_description = "Padauk is a Unicode Myanmar font family with broad support for writing systems that use the Myanmar script. This script is an abugida, a writing system in which each consonant has an inherent vowel. A wealth of alternate character forms used by different language communities are included in Padauk, along with current technologies for their proper display. This Myanmar font works on all platforms: Android, iOS, Windows, macOS, and Linux. Four weights of Padauk are included in this font package: Regular, Bold, Book (slightly heavier than Regular), and Book Bold (slightly heavier than Bold). See the Type Sample on the Design page to compare them. Also included in the download package are WOFF and WOFF2 versions of the fonts for use with web pages. More than 40 languages use Myanmar script for their writing system. Padauk fully supports all of these languages. See the complete list of Myanmar writing systems on ScriptSource. The fonts use state-of-the-art OpenType and Graphite font technologies to provide accurate typography for Unicode-encoded text. This means that you will see correctly positioned vowels and properly formed medial clusters. Padauk includes full support for Unicode 16.0 Myanmar ranges, including five different sets of digits. Read more about our character set support. This font is designed to work with two advanced font technologies, Graphite and OpenType. To take advantage of the advanced typographic capabilities of this font, you must be using applications that provide an adequate level of support for Graphite or OpenType. These advanced capabilities provide the logic for complex rendering of the Myanmar script and access to the variant character forms used in many languages. Yes. You can create web pages that request that Padauk be used to display them. In the download package we provide a WOFF font. See Using SIL Fonts on Web Pages for instructions on using fonts on web pages. This font software is free to use, modify and redistribute according to the terms of the SIL Open Font License"
