["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate16%26site_id%3Dnrsi.html"]
title = "NRSI Update #16 – December 2001"
full_description = "The September 11 tragedies nearly derailed the second Non-Roman Technical Consultation, (NRTC2) held in Horsleys Green, England from September 17-22, 2001. The SIL Non-Roman Script Initiative (NRSI) had spent nearly two years preparing for this conference. Airlines were back in the air, and staff and participants were travelling by the weekend; NRSI team members resident in England went the extra mile taking care of arrangements on site as other team members arrived far later than they had expected. This conference was held for computer consultants from various entities within SIL around the world, as well as partner organizations and software developers. We all had one thing in common: our work requires the handling of non-Roman scripts on various computer platforms. The administration of my own entity, the North America Branch, sent our computer consultant who routinely supports our Branch language and support teams with their computer and software concerns. So what was I doing there, just an ordinary working linguist from the Naskapi language project in Northern Quebec? Well, Naskapi uses a non-Roman script which is a subset of Cree Syllabics, and due to the remoteness of our allocation I was asked early on to be involved in developing strategies for using the Naskapi script on computers in the village. The solutions I came up with for Naskapi were later easily adapted to various dialects of Cree and Ojibwe, and after a dozen years on the field I found myself routinely called upon to assist various Aboriginal academic and cultural organizations across the north with their Canadian Syllabics scripts. When I received an invitation to NRTC2, I was provided the opportunity to represent the many Canadian Aboriginal organizations and Native Language speakers who would benefit from my attendance. Much of the support I am asked to provide often falls beyond the reach of our Branch computer consultant. So, I attended representing not only the North America Branch of SIL, but also users of Canadian Syllabics."
year_published = 2001
