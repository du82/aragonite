["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dencodingprinciples%26site_id%3Dnrsi.html"]
title = "Principles"
full_description = "For those working with minority languages, one of the first needs is the ability to work with the orthography of the language on a computer. The prerequisite for this is an adequate description of the orthography. But how does one go about that description? What is needed to form such a description? This paper provides a detailed outline for such a description with practical suggestions for a variety of script families and addressing particular domain specific issues. The following presentation was prepared for the Non-Roman Technical Consultation 2001. It presents approaches and issues when describing an existing encoding. The following presentation was prepared for the Non-Roman Technical Consultation 2001. It presents how an orthography statement can help in understanding a particular writing system and implementing it. The following paper was presented at the 31st Internationalization & Unicode Conference in October 2007. It gives an overview of the challenges encountered in the process of writing a Unicode proposal for the Tai Viet script. Globalisation has led to an interest in an increasingly diverse variety of languages. Across industry, academic, and government sectors, there is a felt need for language identification standards that go beyond what are currently available. In response to these needs, ISO TC 37/SC 2 has resolved to begin a new work initiative to extend the ISO 639 family of standards. This paper proposes a set of notions for language-related categories that are relevant for information technologies (IT) and examines the relationships between them. It explores some usage scenarios and considers what ways of formulating identifiers might be appropriate for the various scenarios. Many processes used within information technology need to be customized to work for specific languages. For this purpose, systems of tags are needed to identify the language in which information is expressed. Various systems exist and are commonly used, but all of them cover only a minor portion of languages used in the world today, and technologies are being applied to an increasingly diverse range of languages that go well beyond those already covered by these systems. Furthermore, there are several other problems that limit these systems in their ability to cope with these expanding needs. This paper examines five specific problem areas in existing tagging systems for language identification and proposes a particular solution that covers all the world's languages while addressing all five problems."
year_published = 2007
