["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dbabel%26site_id%3Dnrsi.html"]
title = "Initiative B@bel"
full_description = '''From January to October of 2003, SIL International was engaged in a cooperative project with UNESCO as part of UNESCO’s "Initiative B@bel" effort. The goal was to enable the development of complex script support in information and communication technologies (ICTs). This was done through preparation of documents to guide development, technical tools for complex script support, and two example script implementations. These items are available from pages specifically prepared for each item — links are below. This document describes the key issues around supporting complex scripts in ICTs. It is intended as a guide to the planning and development of writing system implementations. It introduces a model for writing system implementations, outlines the development process, and highlights keys to project success. These Guidelines are written primarily for policy makers and professionals, but includes introductory technical material in later sections. This covers important topics regarding encoding, keyboarding and rendering. It gives specific guidance on working with Unicode™, including how to propose new characters for submission. A related document — Resources for Writing Systems Implementation using Copyleft and FLOSS (Free/Libre and Open Source Software) — has also been prepared, but was not part of the UNESCO project. The goal of this paper is to highlight some of the intellectual property (IP) issues and problems, and document the areas that specifically would need to be addressed in the development of models for writing system implementation development and distribution. This document describes a subset of the XHTML/CSS standard that provides the equivalent functionality to WorldPad's XML format. This will enable WorldPad to function as an editor for documents that can be accessed over the Internet and viewed in a web browser. These software tools are based around SIL’s Graphite technology, and are focused on providing applications to use with complex script smart fonts.'''
