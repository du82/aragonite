["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Drtf2sfm_tutorial%26site_id%3Dnrsi.html"]
title = "Converting RTF to SFM using RTF2SFM perl script"
full_description = "This tutorial is based on Bob Hallissy's RTF2SFM program. RTF2SFM is a useful tool for converting a styled Word .RTF file to UTF8-encoded SFM (Standard Format Marker). Unlike SFConv it correctly handles Unicode characters. This tutorial was written for an older version of RTF2SFM which required Perl5.6. For Windows users, the latest version is available as a standalone Windows executable and no longer requires Perl to be installed first. Additionally, there is now more extended help (see -h option) that means you don't have to look into the Perl source to understand the control file options. For those not on Windows or who, for other reasons, want the Perl source, it now requires Perl 5.8 or newer. If you already had a “500” version installed (this one is a “600”), installing this will fail. You will need to uninstall the prior version and do some registry maintenance to get this to work. This is all documented in the html Release Notes. The download file is rather large at over 8 MB. For downloading and installing Perl you will need at least 50 MB free on your hard drive. This downloads the file ActivePerl-5.6.1.nnn-MSWin32-x86.msi which you can install by double clicking from Windows Explorer. Download the RTF2SFM ZIP archive for the program (current version 0.7) to your hard drive and unzip it to your directory of choice such as: This should create RTF2SFM.PLX and RTF2SFM.BAT in c:Perlbin so that when you type RTF2SFM at the Command Prompt it actually executes. Open the file to be converted into Word. 41MAT.RTF is provided for you as an example. Confirm which styles are used. You can do this in Word 2000 (9.0) by selecting Format, Style…, under List text box styles in use. Creating macros similar to what follows is better as it generates a list of used styles that can be copied later. These macros search to see which styles available to this document are actually used in the document. It also checks it against the styles found in RTF2SFM.plx to see if you need to do anything else."
year_published = 2004
year_updated = 2022
