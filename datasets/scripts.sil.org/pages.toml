["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dannapurna_faq%26site_id%3Dnrsi.html"]
title = "FAQ - Annapurna SIL"
description = "Annapurna SIL will work on Mac OS X, Linux and Windows. However, keep in mind that more recent versions (such as Mac OS x v10.8+ and Windows 7+) give the best"
full_description = "FAQWhat platforms and software will Annapurna SIL work in?Annapurna SIL will work on Mac OS X, Linux and Windows. However, keep in mind that more recent versions (such as Mac OS x v10.8+ and Windows 7+) give the best support. The other key to successful rendering of complex fonts is the support given by the application you are using.What is so special about Annapurna SIL?This font is designed to work with two advanced font technologies, Graphite and OpenType. To take advantage of the advanced typographic capabilities of this font, you must be using applications that provide an adequate level of support for Graphite or OpenType. These advanced capabilities provide the logic for complex rendering of the Devanagari script and access to the variant character forms used in many languages.What characters are included with this release?Annapurna SIL covers all the characters from the Devanagari block in Unicode 7.0 standard plus characters from other blocks. See Character Set Support for the full listing.My language uses variant forms of some Devanagari characters. How do I type these using the Annapurna font?If your application supports Graphite or the OpenType Stylistic Sets features, you can use these to access the font features built into the font. See Annapurna SIL Features on the Annapurna Smart Font Features page for more details.If your application does not support Graphite or the OpenType Stylistic Sets features, you can use TypeTunerWeb to customize the font with the variants you require. See Annapurna SIL TypeTuner Guide on the Annapurna Smart Font Features page for more details. We also provide a separate Nepali font download containing the glyph variants used in Nepal.Can I make a web page using this font?Yes. You can create web pages that request that Annapurna SIL be used to display them. In the download package we provide a WOFF font. See Using SIL Fonts on Web Pages for instructions on using fonts on web pages.Do you supply a keyboard to use with Annapurna SIL?Annapurna SIL does not include any keyboarding helps or utilities. If you cannot use the built-in keyboards of the operating system, you will need to install the appropriate keyboard and input method for the characters of the language you wish to use. If you want to enter characters that are not supported by any system keyboard, the Keyman program (www.keyman.com) is available for Windows, macOS, Linux and even mobile devices. For other options, KMFL (kmfl.sourceforge.net), XKB (www.x.org/wiki/XKB) or Ukelele (software.sil.org/ukelele) can be helpful.If you want to enter characters that are not supported by any system keyboard, and to access the full Unicode range, we suggest you use gucharmap, kcharselect on Ubuntu or similar software. Another method of entering some symbols is provided by a few applications such as Adobe InDesign. They can display a glyph palette that shows all the glyphs (symbols) in a font and allow you to enter them by clicking on the glyph you want.Can I make changes to Annapurna SIL?Yes! That is allowed as long as you abide by the conditions of the SIL Open Font License.I notice that the Annapurna font is missing a number of Vedic characters and extensions. Will you be adding these soon?We do not currently have plans to add full Vedic support to Annapurna. However, the font is released under the SIL Open Font License, which permits you to modify the font and release it under a different name. If you wish to add these characters yourself, please do so, bearing in mind the full terms of the license."
