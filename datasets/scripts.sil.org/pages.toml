["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate17%26site_id%3Dnrsi.html"]
title = "NRSI Update #17 – July 2002"
full_description = "Strictly speaking I’m not really new to the NRSI, because I was “on loan” from the Language Software Development department for about three years (1998 - 2001) as part of the Graphite development effort. Non-Roman scripts proved addictive, and I am now officially a member of the NRSI. My first job in computing was at my alma mater, the University of Delaware, developing computer-based instruction materials. Although this seems a far cry from working with non-Roman scripts, I had an opportunity to be part of a team that was creating an adventure game for foreign language instruction. During this project I learned the Prolog programming language and worked on parsing and correcting French grammar and spelling, and the concepts involved in this sort of work would turn out to be similar in many ways to what I later discovered in Graphite. I also completed a master’s degree at the U of D with a focus on artificial intelligence, and those studies exposed me to a lot of the ideas of non-traditional programming and conceptual modelling that is relevant to the kind of applications that SIL is developing. I joined SIL around the time I was doing my masters’ and moved to Dallas in 1991 to start my first assignment in what was then the Academic Computing Department. I was a member of the CELLAR programming team, building the underpinnings of what would eventually become LinguaLinks. More recently I’ve been helping with the latest generation of tools, FieldWorks, and specifically I’ve done a lot of work on WorldPad, the text editor that can render complex scripts using Graphite. Now that I’m full-time with the NRSI, I’m hoping to put some effort into improving the Graphite package (see related article). Eventually I’d like to develop smart fonts using Graphite and OpenType and develop more expertise in Unicode. Not all my life revolves around programming. In my spare time I love doing music—leading worship at my church and singing with groups like the Dallas Symphony Chorus and the chorus of The Dallas Opera. My dream is to someday be involved in a music ministry using classical music. But until then, Graphite is a fun and rewarding project to be a part of!"
year_published = 2002
year_updated = 2002
