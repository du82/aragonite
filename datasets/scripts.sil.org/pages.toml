title = "Principles"
full_description = "Basic Set of characters needed in a Non-Roman font NRSI team, 2010-12-09 Some people have asked what a basic character set for a Non-Roman font should include (besides the Non-Roman characters). The chart on this page is our recommendation for a basic set of characters. It includes the union of Windows CP1252 and Mac-Roman. Balancing typeface legibility and economy: Practical techniques for the type designer J. Victor Gaultney This essay looks at some of the variables that affect legibility, particularly those under the control of the type designer. From this foundation, it continues with a summary of techniques used in the design of economical typefaces throughout type history and evaluates their impact on legibility. Problems of diacritic design for Latin script text faces J. Victor Gaultney, 2002-01-01 Early in the development of the Latin script, special marks, separate in nature from the basic letters, began to be used. Since the innovation of movable type, these diacritics, or accents, have been a special challenge for the type designer. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
