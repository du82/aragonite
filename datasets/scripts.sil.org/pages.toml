["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dezrasil_faq_2000xp%26site_id%3Dnrsi.html"]
title = "Ezra SIL Frequently Asked Questions for Office 2000/XP — FAQ"
full_description = "1. Marks may not display properly or consistently unless Office 2003 or later is installed. Part of the code for displaying Hebrew is included in this software, plus there are numerous bug fixes for language handling. See Keying in Hebrew.pdf if you are uncertain of the mark classes. This strict order may be handled internally in subsequent versions of Microsoft Office. Other Hebrew fonts may not require this order. 3. Note that where there are multiple vowels or multiple cantillation marks, they should be listed in the order they appear, from right to left and low before high. 4. As shown, cantillation marks which normally occur at the beginning of a word (pre-positives) must follow the first consonant and vowel, according to Unicode 3 requirements. The font will recognize and place them word-initial. 5. These fonts will not correctly display text which is in Unicode 5 canonical order. Use the order in statement 2, above. Some preliminary tests suggest that this is no longer true for Windows Vista or Office 2007, but this has not been checked extensively. There can be problems using the Ezra SIL fonts with Word 2000 and Word 2002, or any software which relies on Uniscribe for displaying text. An updated Uniscribe (1.468.4015.0 or above) is recommended. Solution 1: If you upgrade to Office 2003, you will have the rest of the code intended for working in biblical Hebrew. Your problem may have a solution below, but while it is possible to use the Ezra SIL fonts in older versions of Office, it may be too inconsistent or frustrating for users to tolerate. Solution 2: If you are using Office 2003, make sure you have upgraded to v. 2.5 of the Ezra SIL fonts. Problem: Using any Keyman or Microsoft Keyboard Layout Creator keyboard, all the Hebrew characters typed without 'shift' are fine. Everything is as it should be. Any character typed with 'shift' (aleph, ayin, final forms, tsere, qamets) appear as the correct character, but at the right hand end of the string, instead of the left. Sometimes, the language indicator in Word 2000 changes to English, but the language indicator on the Windows taskbar remains 'HE' and the Keyman icon on the windows taskbar remains aleph (for Keyman). Sometimes the diacritics are in the wrong place — too far left."
