["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dsildb_home%26site_id%3Dnrsi.html"]
title = "SIL Dai Banna  (Obsolete)"
full_description = "The SIL Dai Banna Fonts are pre-Unicode or “legacy” fonts which were originally released by SIL in 2000. These fonts have been superseded by the Unicode-encoded Dai Banna SIL Fonts. The SIL Dai Banna Fonts are a custom-encoded rendering of the New Tai Lue (Xishuangbanna Dai) script. Two font families, differing only in weight, allow for a wide range of uses. The fonts are available for both Macintosh and Windows systems and include keyboard definitions. The New Tai Lue script is used by approximately 700,000 people who speak the Tai Lue language in Yunnan, China. It is a simplification of the original Lanna script as used for the Tai Lue language for hundreds of years. We particularly thank the staff of the Research Center for the Minority Languages of China for their assistance in developing this font package. The Research Center for the Minority Languages is part of the Chinese Academy of Social Sciences, Institute for Nationalities Studies located in Beijing, China. SIL International (SIL) is an organization of linguists dedicated to the study and promotion of the thousands of languages around the world. As a service to the general academic community, we are happy to make this package available at no charge. You may (and are encouraged to) share this package with your friends and co-workers, as long as you abide by certain distribution restrictions. © 2003-2024 SIL International, all rights reserved, unless otherwise noted elsewhere on this page. Provided by SIL's Writing Systems Technology team (formerly known as NRSI). Read our Privacy Policy. Contact us here."
