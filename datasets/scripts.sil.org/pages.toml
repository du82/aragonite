["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate05%26site_id%3Dnrsi.html"]
title = "NRSI Update #5 – April/June 1997"
full_description = "For a number of years I have done two large and very different jobs: Manager of the NRSI, and wife and mother of three. In the last few months my family responsibilities have become heavy and difficult, requiring me to step down as NRSI manager. Peter Constable has taken my place and I will be assisting him in the areas of planning and resource development. All correspondence intended for the NRSI manager should be sent to Peter Constable. To date, Peter Martin has distributed four issues of the NRSI Update electronically, at approximately two-month intervals (often held back in order to report on certain events). In the light of increasing web access and HTML usage, starting with Issue #3 these are distributed as HTML documents(with a text-only version for those who ask) to provide a compact format with some layout control, navigation among sections and issues, and links to relevant external sites. For many years, we have all awaited the development of technologies on the Windows platforms that would enable us to do multilingual work and, in particular, to work with non-roman language data. There was great anticipation that Microsoft’s TrueType Open (TTO) technology might be the answer, but it had become apparent by late summer 1996 that TTO was going to fall well short of what we need. At the Non-Roman Technical Consultation in September 1996, after the disappointing facts regarding TTO had been digested by all, some participants began to discuss the possibility of SIL developing a rendering engine that could run as a layer on top of Windows and that would have the flexibility to work with any writing system. (For now, this software-to-be has been dubbed “WinRend”.) Some important problems were noted, as were some of the challenges that would have to be faced, but the benefits were readily apparent. For various reasons, the NRSI/Dallas team had not felt that there was a clear mandate to pursue development of WinRend at that time. At the CTC in November, however, we got together with all of the representatives from entities for which non-roman scripts are a major concern to get their input on how the problem of poor non-roman support on Windows should be addressed. During this discussion, the suggestion of developing WinRend came up again. Among the representatives of field entities, there was concensus that we should pursue development of WinRend, even if it only works with SIL applications. (This, in fact, was the main consideration behind link#ctc a resolution passed by CTC} in relation to the work of NRSI.) At the recent meeting of the NRSI Field Advisory Board, the NRSI/Dallas team was given a very clear mandate with regard to WinRend: the Board identified development of WinRend as the top priority for NRSI in the coming years. Accordingly, we are publicly announcing our intent to pursue development of WinRend."
year_published = 1997
clearnet = "https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dnrsiupdate05%26site_id%3Dnrsi.html"
