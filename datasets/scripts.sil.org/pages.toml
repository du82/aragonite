["https://scripts.sil.org/cms/scripts/page.php%3Fid%3Dlimbu%26site_id%3Dnrsi.html"]
title = "Namdhinggo SIL L (Obsolete)"
full_description = '''Namdhinggo SIL L is a custom (legacy) 8-bit font. It is not a Unicode font. We now have a Unicode encoded font called Namdhinggo SIL which is still in development. However, we believe the font is useful in its present state and thus we have released it as a "Font in Development". The font is available here: Namdhinggo SIL The Limbu, or Kirat Sirijonga, script is used by around 400,000 people in Nepal and India. This font has been designed to support literacy and materials development work in the Limbu language. According to traditional histories the Limbu script was developed by King Sirijonga in the 9th Century. It then fell out of use before being reintroduced in the 18th century by Teongsi Sirijonga (1704-1741) whom many felt to be the reincarnation of the first Sirijonga. The modern Sirijonga was apparently martyred in 1741 for the sake of this script by lamas in Sikkim. The script was named 'Sirijonga' in his honour by the Limbu scholar Iman Singh Chemjong. The current font - Namdhinggo SIL L - uses an encoding that is common among other fonts for the script. Although the Limbu script has been accepted into The Unicode Standard, this font does not yet support that international standard. A Unicode-based version of Namdhinggo SIL is currently in the final stages of development. Because the Unicode font is still in development, we are not currently soliciting contributions to the project. We do, however, welcome feedback and suggestions on how to make the font better. You are also free to make derivative versions according to the conditions listed in the included SIL Open Font License. The font files themselves contain basic source data for the fonts. Future releases will likely include source data in additional formats, such as a FontLab database. Note that this font is not encoded according to The Unicode Standard. A Unicode-encoded version is in development. The Namdhinggo SIL font is released under the SIL Open Font License, version 1.1. Copyright (c) 2002-2007, SIL International ( http://www.sil.org/), with Reserved Font Names "Namdhinggo" and "SIL".'''
