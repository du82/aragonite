title = "PUA"
full_description = "The SIL PUA committee is no longer functioning. If you wish to see the latest files related to the SIL PUA and the status of encoding in Unicode please visit the new home for the SIL PUA. Procedure for Registration of SIL Entity Private Use Area Assignments (for Entity portion of the PUA) Approximately 248 characters, supporting orthographies in many minority languages, have been approved for assignment to the SIL corporate PUA. Many technical linguistic characters have also been approved. Many of these characters are already supported in current versions of the Encore fonts (SIL fonts) although the Doulos SIL font is the first to contain these in a Unicode encoded font. Future versions will include additional approved characters. SIL Corporate PUA Assignments Lorna Evans, 2021-08-16 Reference information on Unicode private-use character assignments used within SIL International. Revised for Unicode 14.0 A strategy for deprecating SIL PUA characters Bob Hallissy and Lorna Priest, 2007-11-07 A strategy for deprecating SIL PUA character assignments once characters have been accepted into Unicode. SIL Private Use Area Registration Form Lorna Evans, 2020-06-03 The Private Use Areas in the Unicode encoding are a limited resource which needs to be managed carefully. SIL International has chosen to maintain a central information repository to ensure consistency of field data and the ability to share and archive data within SIL and cooperating agencies. This page allows for SIL Entities and FOBAI member organizations (requests from persons outside these parameters will not be accepted) to make requests to add characters that are not in the Unicode standard to the SIL Corporate PUA. Procedure for Registration of SIL Entity Private Use Area Assignments Peter Constable, 1999-05-14 This document describes what the SIL Entity PUA character registration process consists of and provides a description of procedures for SIL entities to follow in submitting to the NRSI registrations of the Entity portion of the PUA."
