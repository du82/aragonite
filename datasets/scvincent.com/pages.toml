full_description = '← Remember… Songs of a bard…. → Petals of the Rose Posted on December 8, 2023 by Sue Vincent Petals of the Rose Guided Journeys Sue Vincent A collection of guided meditations, designed to open aspects of the personality in as gentle and natural way as the petals of the rose open at the touch of the sun. Each inner journey will carry you to a haven within your own psyche from which to explore layers of your own being, learning their meaning and purpose. From mystical and silent castles, to the song of the unicorn… each journey takes you deeper into your inner being and carries you out beyond the stars. Stories stir the imagination, casting images upon the screen of mind that allow us to explore, in safety, aspects of our lives and being that we might otherwise avoid or overlook. There is a rich vein of experience in memory that can be mined for its treasures. One of the simplest and best ways of exploring the labyrinths of the mind is to do so through a guided journey. Meditation and visualisation are not arcane practices in which a few indulge… we all use these tools every day, to navigate our way around the world and our lives. We ask ourselves ‘what if?’, creating imaginary scenarios before we act. We visualise the route we walk to work, or what the basket full of ingredients will look like, once assembled and cooked, on a dinner plate. There is no mystery in meditation… but when you give time and attention to the practice, it can open the door to many mysteries… including those of our own being… Available via Amazon.com, Amazon UK and worldwide in Paperback and for Kindle Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Sue Vincent Sue Vincent was a Yorkshire born writer, esoteric teacher and a Director of The Silent Eye. She was immersed in the Mysteries all her life. Sue maintained a popular blog and is co-author of The Mystical Hexagram with Dr G.M.Vasey. Sue lived in Buckinghamshire, having been stranded there due to an accident with a blindfold, a pin and a map. She had a lasting love-affair with the landscape of Albion, the hidden country of the heart. Sue passed into spirit at the end of March 2021. View all posts by Sue Vincent → This entry was posted in Books, Life, Poetry, writing and tagged haiku, magic, mystery, psychology, spirituality. Bookmark the permalink. ← Remember… Songs of a bard…. → 1 Response to Petals of the Rose noelleg44 says: December 8, 2023 at 14:53 Perfect from Sue, who had a silver tongue! LikeLiked by 1 person Reply Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
