full_description = '← White Sun… Love to Sue… Posted on December 3, 2024 by Stuart France R.I.P. ANI 2009 – 2024 (Gone to play ‘Fetch’ with her Mum) *** “You’re not a Bird, Anu, you’re a Dog! And it’s not a game, this birth and death business, it is serious stuff. Do you understand?” Anu nods sagely, turns, trots off to the flower pot, selects a Ball of Power, returns and drops the Ball of Power at my feet. “Hopeless!” Anu ignores my negativity and commences his millennia old adoration of the Ball of Power, crouching on his forelegs, still eyeing the Ball, as he shuffles backwards in primed and primal expectation of its wondrous flight. “I’ve just worked out the game of ‘fetch’.” “Oh, really?” “Yes really, the Ball of Power is… Love. And no matter how hard you try to get rid of it. It just keeps coming back to you.” The Ball of Power flies through the air. Quick as lightning Anu leaps skyward, catches it in his jaws, lands with a thud and proudly trots back to me to again lay it at my feet. “You’re a clever Bird-Dog, Anu, aren’t you boy?” – Triad of Albion, Giants Dance N.B. In this series of books Ani’s gender and name were changed to preserve her anonymity. *** Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in albion, Books, Photography, Templars and tagged Life, love, Stuart France and Sue Vincent, writing. Bookmark the permalink. ← White Sun… 11 Responses to Love to Sue… D. Avery @shiftnshake says: December 3, 2024 at 13:11 Thank you for sharing this news of Ani. I had been thinking of Sue lately. What a reunion these two will have! LikeLiked by 1 person Reply Eunice says: December 3, 2024 at 13:17 A beautiful picture, thank you for sharing. RIP Ani xx LikeLiked by 1 person Reply noelleg44 says: December 3, 2024 at 14:11 The loss of Ani was inevitable but she will be reunited with Sue, her lodestar. This hit me personally – I had grown to love that dog. LikeLiked by 1 person Reply Stuart France says: December 3, 2024 at 14:19 As had we all… LikeLiked by 1 person Reply noelleg44 says: December 3, 2024 at 14:20 And probably hardest on you, Stuart. My condolences. Keep Sue out in front of us! LikeLiked by 1 person Reply Darlene says: December 3, 2024 at 16:04 Thanks for letting us know, Stuart. I had been thinking about Ani lately. May this dear sweet little dog rest in peace with her favourite human. ❤️❤️ LikeLiked by 1 person Reply willowdot21 says: December 3, 2024 at 17:13 Hi Stuart thank you for letting us know that Ani has passed over the bridge to join Sue. Imagine the joy at their meeting. I am sorry for your loss but I am sure you see the bigger picture. 💜💜💜💜 LikeLiked by 1 person Reply Ritu says: December 3, 2024 at 18:17 RIP Ani, you will be missed, but I’m sure Sue will be so happy to be reunited with you 💖🥰🙏🏼💛 LikeLiked by 1 person Reply Audrey Driscoll says: December 19, 2024 at 23:54 This is sad news, Stuart, but thank you for it nevertheless. Both Sue and Ani are remembered. LikeLiked by 1 person Reply pedmar10 says: January 23, 2025 at 14:08 RIP Ani love those dogs so much have one 7 yrs old mix border collier and labrador. Best wishes LikeLiked by 1 person Reply Anonymous says: February 2, 2025 at 09:33 Just orbited back from a rather elliptical path. Sorry to hear about Ani. She was a beauty. ~Darcy LikeLiked by 1 person Reply Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
