description = "'OM' *** 'Once, when the Gods and Demons, both children of Prajapti, arrayed themselves against each other, the Gods got hold of a Big Chant. With this we will overpower them, they thought. They venerated the Big Chant as the wind within the nostrils but the Demons riddled it with evil. On it one now…"
full_description = '''← Big Liars… Mister Fox… → Big Chants… Posted on October 8, 2023 by Stuart France ‘OM’ *** ‘Once, when the Gods and Demons, both children of Prajapti, arrayed themselves against each other, the Gods got hold of a Big Chant. With this we will overpower them, they thought. They venerated the Big Chant as the wind within the nostrils but the Demons riddled it with evil. On it one now smells both good and bad odours. They venerated the Big Chant as speech but the Demons riddled it with evil. One speaks what is both true and false. They venerated the Big Chant as sight but the Demons riddled it with evil. One sees both good and bad images. They venerated the Big Chant as hearing but the Demons riddled it with evil. One hears both good and bad sounds. They venerated the Big Chant as mind but the Demons riddled it with evil. One thinks both good and bad things… Finally they venerated the Big Chant as the breath within the mouth. The Demons hurled themselves against it but were smashed to smithereens like earth thrown against a rock. The Chandogya Upanisad *** A Big Chant – ‘OM’ Nine chants of ‘OM’ at Nine O’Clock tonight?… Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in Ancestors, Art, Books, esoteric, symbolism and tagged consciousness, magic, mystery, psychology. Bookmark the permalink. ← Big Liars… Mister Fox… → 1 Response to Big Chants… Pingback: Big Liars… | Sue Vincent's Daily Echo Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'''
