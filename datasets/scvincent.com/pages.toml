description = "*** All boundaries... Are important... But some boundaries... Are more important... Than others... The boundaries between... England and Wales... And Scotland And England... For instance... Are not important at all... Because they are not really boundaries... The boundary between... Land and Sea... Or between Earth and Sky... These are proper boundaries... Not proper ties... No…"
full_description = '← Mister Fox in Holmfirth A Pen and the Swords → Spendyke… Posted on November 17, 2023 by Stuart France *** All boundaries… Are important… But some boundaries… Are more important… Than others… The boundaries between… England and Wales… And Scotland And England… For instance… Are not important at all… Because they are not really boundaries… The boundary between… Land and Sea… Or between Earth and Sky… These are proper boundaries… Not proper ties… No such thing as a proper tie… Either… That’s just legalise… Unlawful… When certain streets in a town are pedestrianised… They still have to indicate… Where the pavement… Once met the road… Ever wondered… Why? *** Here’s a clue… It has to do… With High Ways… And By Ways… Definitely not… Bye Laws… The Spendyke picture book… Was a case in point… It showed St John’s… Which is the church… In the centre of town… On church street… With a graveyard!… There had never been any gravestones… Just grass… And a couple of erratics… ‘Look at those things’… Snorted Gramps… When walking… The boundary… Of what was once the graveyard… After recognising the sense of what Gramps was saying… Something inexplicably ancient… Insisted that these stones… Needed to be… Considered. *** As it turns out… Those particular stones… Were sculpted… By the sea… And in the remotest places… Of Scotland… And Wales… Such stones… Usually dredged… From the river-bed… Are still… To this day… Venerated… By what… We might want to call… The country-folk… Or folk… Who dwell in the shadows… Otherwise… Folk in the know… But what is it that they can know… That we don’t… It is not so much… A question of… Knowing… But rather of comprehending… That there are some things… That can’t be known… And that some things… Just have to… Fall-out… As they will… *** * SPENDYKE 1022, a fugitive from planet Spendyke holes up in the bowels of the Rubicon library. There he discovers ancient accounts of the reasons for his planet’s current plight. Further research uncovers practical solutions to the dire world situation in the prevailing views of State Philosopher Hux. As the global government crumbles around him the fugitive embarks upon a journey into his own past in order to pull Spendyke back from the brink. But will he be successful? Front and Back Cover artwork by Sue Vincent Available now in Amazon Paperback Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in adventure, albion, Ancestors, Art, fiction, mystery, writing and tagged Books, consciousness, magic, psychology, story. Bookmark the permalink. ← Mister Fox in Holmfirth A Pen and the Swords → 5 Responses to Spendyke… joylennick says: November 17, 2023 at 10:58 Good to be reminded of dear, Sue…Thank you, Stuart! xx LikeLiked by 1 person Reply noelleg44 says: November 18, 2023 at 21:03 Lovely cover, and I’m looking forward to a good read. But you got me at the picture of Ani. Is she still with us? LikeLiked by 1 person Reply Stuart France says: November 19, 2023 at 00:09 Yes, Ani is still chugging along nicely for an ‘old girl’. It’s an old photo of Sue’s… LikeLike Reply noelleg44 says: November 19, 2023 at 17:12 I remember it, it’s one of my favorites. Please give her some belly rubs and ear scritches from me! LikeLiked by 1 person Reply Stuart France says: November 19, 2023 at 18:00 Consider it done… LikeLike Reply Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
