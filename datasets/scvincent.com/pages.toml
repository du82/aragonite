full_description = '← Big Chants… …And the Green Man → Mister Fox… Posted on October 13, 2023 by Sue Vincent * The Grand-Father Clock, tock…tock…tocked reassuringly in the corner of the oak-panelled study. Through the window to one side the ancient time piece’s Big Brother could be discerned dominating the metropolitan sky-line… Tee was willfully oblivious of the time. He deliberately shuffled the pile of predominantly red and black images on his large teak writing desk for the third time and shifted uneasily in his racing green, leather-upholstered, swivel chair. Then he snorted… It was the snort of a man determined to do something, somehow, anyhow, about whatever it was that currently irked him. Tee snorted again, “Not in this day and age, Carstairs!” Continue reading at France & Vincent Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Sue Vincent Sue Vincent was a Yorkshire born writer, esoteric teacher and a Director of The Silent Eye. She was immersed in the Mysteries all her life. Sue maintained a popular blog and is co-author of The Mystical Hexagram with Dr G.M.Vasey. Sue lived in Buckinghamshire, having been stranded there due to an accident with a blindfold, a pin and a map. She had a lasting love-affair with the landscape of Albion, the hidden country of the heart. Sue passed into spirit at the end of March 2021. View all posts by Sue Vincent → This entry was posted in albion, Art, Books, Don and Wen, fantasy, fiction, france and vincent and tagged Folk Tale, landscape, magic, mystery, Mythology, psychology. Bookmark the permalink. ← Big Chants… …And the Green Man → Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
