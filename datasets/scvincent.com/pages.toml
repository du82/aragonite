ne another and didn’t know it. We had so many shared memories of places and people. I hope she’s taking care of them for both of us. Funny how losing someone you never knowingly met can leave such a painful gap. LikeLiked by 7 people Reply TanGental says: March 30, 2021 at 08:30 Ahh… and so it came to pass. Stuart, pass on our best to the family. She created a glorious family around her blog, a mother hen of words and poetry. And I know dogs grieve so please, a hug for Ani and one more chew on her manky ball. Somewhere Sue is throwing it still. LikeLiked by 12 people Reply kimbladeswritingblog says: March 30, 2021 at 08:39 I’m so sorry Stuart, but your mom is free of pain and anguish now and will always be with you and your brother and Ani, in spirit. RIP Sue. LikeLiked by 4 people Reply Books & Bonsai says: March 30, 2021 at 08:44 Sue’s legacy will live on and she will continue to be loved by everyone who knew her… LikeLiked by 5 people Reply Books & Bonsai says: March 30, 2021 at 08:44 Reblogged this on Books & Bonsai. LikeLiked by 4 people Reply socialbridge says: March 30, 2021 at 08:45 Deepest sympathy, Stuart and all the family, including her precious Ani. Sue was a truly special person and I hope she has left you all with a wealth of love to sustain you through the sadness. As a blogger, I will always treasure her advice, good humour and wonderful posts. Hugs, Jean LikeLiked by 5 people Reply Pingback: There are some things a poet cannot accept | Chris The Story Reading Ape's Blog pensitivity101 says: March 30, 2021 at 08:56 My thoughts are with you Stuart, her family and friends. We have lost a gem and I am privileged to have known her through her blog, books, and personal messages. Pensitivity101 is going quiet today. Much love to you all LikeLiked by 5 people Reply Stevie Turner says: March 30, 2021 at 09:15 Rest in peace, Sue. x LikeLiked by 5 people Reply Jane Sturgeon says: March 30, 2021 at 09:22 ❤ LikeLiked by 5 people Reply V.M.Sang says: March 30, 2