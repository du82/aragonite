title = "Time travelling: A place of kings and “holy air…” | Sue Vincent's Daily Echo"
description = '"Holy air encased in stone" … that is how Sir John Betjeman described the crypt at Repton, and it was this that we had come to see… we hoped. On a previous visit, the crypt had been locked. This time, as we descended the worn stone steps that lead beneath the nave, we were really…'
full_description = '← Lucky Year of the Pig… → Time travelling: A place of kings and “holy air…” Posted on January 12, 2024 by Sue Vincent “Holy air encased in stone” … that is how Sir John Betjeman described the crypt at Repton, and it was this that we had come to see… we hoped. On a previous visit, the crypt had been locked. This time, as we descended the worn stone steps that lead beneath the nave, we were really hoping the door would yield. Early in the eighth century, the crypt was built to a mausoleum for the relics of the royal house of Mercia. It is one of the most intact survivals from the Anglo-Saxon era, preserved perhaps as it was closed and forgotten, remaining lost until it was rediscovered by a workman excavating a grave space in the nave in 1779. He fell through its roof and found himself in a wholly unexpected and sacred space. It is believed that the crypt was first constructed as a baptistry, during the reign of King Æthelbald who reigned from 716 to 757. The Repton Stone, found near the church but now in a museum, is believed to show the king, and is thus the earliest full-scale depiction of a British monarch. The crypt is sunk into the earth and built over a spring which drains to the east. You have to wonder how long that spring had been a place of veneration… perhaps predating Christianity in the area by a very long time. King Æthelbald was possibly the first to be interred there when it became a place of burial, followed by King Wiglaf in 840 and Wiglaf’s grandson Wystan, who was murdered in 849. Records say that a great light shot up to heaven when Wystan died and many miracles were attributed to his relics. Repton became a place of pilgrimage until the saints remains were moved to escape the Great Heathen Army of Viking invaders in 873. The army overwintered in Repton and a vast mound has been excavated there containing the bones of around hundreds of them, disarticulated and neatly stacked. The volume of pilgrims was so great that rough-hewn passages had to be cut through the fabric of the church and stone to enable a ‘one way system’ to manage the number of people visiting the relics of the kings. The church today reflects the whole of English history from that time onward… the scars and damage of the Reformation, the rebuilding and changes in fashion, the burials of medieval knights and Tudor dignitaries… it is all there to read in the glass, wood and stone of a little parish church. The door yielded reluctantly to our touch and we stepped back in time to breathe the ‘holy air encased in stone’. There are no relics remaining of those long-dead kings, only the niches were their bones were laid to rest. They were never buried here; the bodies were first interred then the bones, once the flesh was gone and the bones were clean, were recovered and placed in the crypt. The columns that have supported the vault for one and a half thousand years are decorated with ascending spirals, a symbol that links back to the very earliest rock carvings… and the silence is complete. Each breath resonates in a very strange way, making you very conscious of your life in this house of the dead. Conscious too of your presence within a greater human story. Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Sue Vincent Sue Vincent was a Yorkshire born writer, esoteric teacher and a Director of The Silent Eye. She was immersed in the Mysteries all her life. Sue maintained a popular blog and is co-author of The Mystical Hexagram with Dr G.M.Vasey. Sue lived in Buckinghamshire, having been stranded there due to an accident with a blindfold, a pin and a map. She had a lasting love-affair with the landscape of Albion, the hidden country of the heart. Sue passed into spirit at the end of March 2021. View all posts by Sue Vincent → This entry was posted in Ancient sites, archaeology, Churches, historic sites, Photography, Sacred sites, Stuart France and Sue Vincent and tagged archaeology, churches, Derbyshire, folklore, ghosts, local legnds, Repton, Saxon. Bookmark the permalink. ← Lucky Year of the Pig… → 17 Responses to Time travelling: A place of kings and “holy air…” Alethea Kehas says: February 18, 2019 at 13:34 Ooo, I’d like to go there someday. LikeLiked by 2 people Reply Sue Vincent says: February 18, 2019 at 20:38 Now whay does that not surprise me? 😉 x LikeLiked by 2 people Reply Jennie says: February 18, 2019 at 13:36 Gorgeous columns. I can imagine the pilgrimage, and you breathing in the holy air. LikeLiked by 1 person Reply Sue Vincent says: February 18, 2019 at 20:38 I didn’t want to leave the crypt… it has a wonderful feel. LikeLiked by 1 person Reply Jennie says: February 18, 2019 at 21:47 I could tell. 🙂 LikeLiked by 1 person Reply noelleg44 says: February 18, 2019 at 17:31 From your posts on this church, it sounds like the one place to visit to see the panorama of English history! LikeLiked by 1 person Reply Sue Vincent says: February 18, 2019 at 20:36 It is a church we are going to have to revisit… we barely scratched the surface here! LikeLike Reply noelleg44 says: February 21, 2019 at 18:18 Good grief! There’s more? LikeLike Reply Sue Vincent says: February 21, 2019 at 19:13 Oh yes ! This was just a flying visit 🙂 LikeLike Reply OIKOS™-Publishing says: February 18, 2019 at 21:04 Its wonderful, Sue! Thank you for sharing! I think too, sometimes want to see with my own eyes, and feeling the spirit. Michael LikeLike Reply Sue Vincent says: February 18, 2019 at 21:14 You really need to with places like this one. LikeLike Reply D. Wallace Peach says: February 18, 2019 at 21:15 Fascinating, Sue. What a place to “fall into.” LikeLike Reply Sue Vincent says: February 18, 2019 at 21:27 It is such a fabulous place… and to stand within its walls and feel the depth of its history is incredibly moving. LikeLiked by 1 person Reply Alethea Kehas says: February 18, 2019 at 22:44 🙂 LikeLiked by 2 people Reply Eliza Waters says: February 19, 2019 at 02:15 Such antiquity amazes me. What a marvelous church! LikeLiked by 1 person Reply Sue Vincent says: February 19, 2019 at 06:28 It really is like stepping through a portal into the pat 🙂 LikeLiked by 1 person Reply Anonymous says: January 6, 2024 at 18:32 I was born in Repton, often visiting the crypt as a child and an adult. It wasn’t until decades later that I truly appreciated the historical significance of the place, and understand how unique and important it is. Wish I had known more about it at the time. LikeLike Reply Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
