title = "Sue Vincent's Daily Echo | Echoes of Life, Love and Laughter"
description = "Echoes of Life, Love and Laughter"
full_description = "← Older posts Into Spirit… Posted on March 30, 2021 by Stuart France Sue Vincent 14th September 1958 – 29th March 2021 R.I.P * For the last nine years of her life, Sue was a Director of the Silent Eye school of Consciousness. In addition to the works published during her lifetime, which are listed in the post, Legacy, there are now a number of her works published posthumously. These are all large format paperback books and are available from Amazon. Hawk at Dawn – SE Writings 2012 – 2015 Hawk at Noon – SE Writings 2015 – 2018 Hawk at Dusk – SE Writings 2018 – 2021 Flying Kites – Selected SE Writings 2012 – 2021 Wisdom’s Way – Selected SE Writings 2012 – 2021 * Books written with Stuart France Wild-Hunt Circle to Circle The Calling Hob Hurst’s House: Strange Tales from the Dales Giant Rombald Triad of Albion The Doomsday Books Lands of Exile Reading Don & Wen Sacred Spaces * All cover art – Sue Vincent Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Posted in adventure | Tagged consciousness | 184 Comments Love to Sue… Posted on December 3, 2024 by Stuart France R.I.P. ANI 2009 – 2024 (Gone to play ‘Fetch’ with her Mum) *** “You’re not a Bird, Anu, you’re a Dog! And it’s not a game, this birth and death business, it is serious stuff. Do you understand?” Anu nods sagely, turns, trots off to the flower pot, selects a Ball of Power, returns and drops the Ball of Power at my feet. “Hopeless!” Anu ignores my negativity and commences his millennia old adoration of the Ball of Power, crouching on his forelegs, still eyeing the Ball, as he shuffles backwards in primed and primal expectation of its wondrous flight. “I’ve just worked out the game of ‘fetch’.” “Oh, really?” “Yes really, the Ball of Power is… Love. And no matter how hard you try to get rid of it. It just keeps coming back to you.” The Ball of Power flies through the air. Quick as lightning Anu leaps skyward, catches it in his jaws, lands with a thud and proudly trots back to me to again lay it at my feet. “You’re a clever Bird-Dog, Anu, aren’t you boy?” – Triad of Albion, Giants Dance N.B. In this series of books Ani’s gender and name were changed to preserve her anonymity. *** Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Posted in albion, Books, Photography, Templars | Tagged Life, love, Stuart France and Sue Vincent, writing | 11 Comments White Sun… Posted on August 27, 2024 by Stuart France * The White Sun of the Tarot Fool is reputed to signify the spiritual sun… An impersonal power manifesting as a limitless energy radiated to the world-system of planets without number, streaming out and over them from their respective suns. … Otherwise designated, the sun behind the sun. In our solar system the sun behind the sun is the dog-star Sirius. Derived from the Greek ‘Serius’ the name means a ‘scorching’ or ‘blazing’ light. The heliacal rising of Sirius marked the flooding of the Nile in Ancient Egypt, which brought life-bestowing fertile soil to the region, and the leisurely dog-days of summer for the philosophers of Ancient Greece. The spiritual sun never achieves its zenith for from the zenith it would then have to descend. Infinite energy cannot reach a point in manifestation from whence its power decreases. In Ancient Britain, the Arch-Mage Merlin’s daimon, or higher-self, was known to him as Blaise. The sun-flowers of the Tarot Sun have all, but one, turned their face away from the Day-Star. The one that has not, still in bud, signifies the ‘Fifth Dimension’. The higher-self casts no shadow. Alien Heat 1024 * SPENDYKE 2022, a fugitive from planet Spendyke holes up in the bowels of the Rubicon library. There he discovers ancient accounts of the reasons for his planet’s current plight. Further research uncovers practical solutions to the dire world situation in the prevailing views of State Philosopher Hux. As the global government crumbles around him the fugitive embarks upon a journey into his own past in order to pull Spendyke back from the brink. But will he be successful? * SPENDYKE 2023 – Anarchy stalks the streets. The Globotomists and the grandees of their Home Stand are closing in on the Rubicon. That improbable haven founded thousands of years before the current madness erupted. Our fugitive, Demos, still lurks somewhere within its crusty corridors scouring the old tomes, housed on its crumbling shelves, for an antidote to Spendyke’s most grim secret… The Riddle of the Nine Dark Tri-Grams is key to overcoming the demon hordes that hold sway, and now run amok. Will Demos solve his home planet’s ancient enigma, before the inevitable doom descends, or not? Welcome, to the apocalyptic world of Cashelkeep! * * Front and Back Cover art by Sue Vincent * SPENDYKE 2024 – A hot white sun rises over the Rubicon and its myriad of now deserted city streets. Within the crumbling, ancient structure, Demos still lurks in fervent correspondence with the few survivors who have somehow managed to contact him. What solutions to their dire predicament does a forties, black and white, classic film contain? And what will the Globotomists’ new, inter-dimensional, world look like and be peopled with… A whiter than white world ablaze with Gods, Giants, Androids, and Souls of the Dead, perchance, or just more, and bigger, bolder conglomerates of the power crazed? Here at the end of all time, there really is only one way to find out… Read it like your very life depends upon it! Now Available in large format Paperback here. Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Posted in albion, Art, Books | Tagged consciousness, imagination, magic, mystery, psychology, story, Stuart France and Sue Vincent, writing | Leave a comment Lizard-Men Posted on July 4, 2024 by Stuart France *** … “You know, I’m not sure syncretism is quite the right word,” says Wen, eyeing the icon of Gilgamesh with some trepidation. We are in the British Museum doing ‘research’ as Wen likes to call it. ‘Pick up your staff and pen,’ she said, ‘we have work to do.’ Which means in Wen-Speak, among other things, more churches… “Your doubts are probably well founded. Mr Graves called it ‘iconotropy’ – turning religious iconography to new religious purpose.” “Oh, him again. No one knows who Robert Graves is.” “Well, they should! Anyway, in ‘King Jesus’ he has a Priestess of Astarte and Joshua-ben-Miriam go through a whole series of cave-bound images with each of them giving a different yet perfectly valid interpretation of the self-same icon.” “Cave-bound?” “Inscribed in a cave.” “It hardly seems possible.” “Religious interpretation, I should have said.” “It still hardly seems possible.” “Why isn’t anything, anything else?” “You’re being obscure again,” says Wen. “It’s what we bring to the table!” “Hmmm… That’s a good thought… Okay then, is Gilgamesh meant to be a giant?” “In the story he is two-thirds divine, one third-man.” “Which doesn’t actually answer my question.” “I don’t know, is he meant to be a giant?” “Ah, I see… Well, if that is a mature lion, then he is very definitely a giant.” “The Hebrew storytellers saw fit to make the lion a cub.” “With the express aim of de-gigantic-ising him I expect.” “Is that a word?” “I shouldn’t think so.” “So, why would they down-size him?” “Because the strength of their hero didn’t come from his size. It came from God.” “The Spirit of the Lord.” “The Spirit of the Lord, that’s right.” “But if Gilgamesh is two-thirds divine, doesn’t his strength come from ‘God’ too?” “Gilgamesh has a divine mother, Ninsun, and a father who was born human but later became divine.” “Ninsun, is a name to conjure with,” murmurs Wen and then, “this becoming divine business is interesting.” “And the crux of their reasoning for a change. The Hebrews did not go in for that kind of truck with the Gods. Their God was transcendent. Only his feminine aspect was immanent and because of that she was not regarded as a Goddess. She was known as the Shekinah but even this, later became all but forgotten. At least officially.” “That is not the jaw-bone of an ass is it?” “I very much doubt it.” “Do we have any idea what it actually is?” “Nope. None whatsoever, but I expect it will reveal its identity at some point during the proceedings.” “Research!” proclaims Wen, triumphantly. “If you insist,” but this is a form of research too. The Greeks called it dialectic… three, six, nine… lots of maybe’s, lots of supposes…” “So, why should transcendence be considered the ‘be all and end all’?” “I don’t know, why should transcendence be considered the ‘be all and end all’?” “Well, it has to do with the outer, and hierarchy, and objectivity.” “None of which are intrinsically unsound concepts.” “Until they are regarded as ends in themselves and not as integral parts of process and cycle… I like his hair.” “Not so sure about the chain-mail beard though.” “Did Samson have a beard?” “I expect so, although I suspect the ban on the razor only extended to his head.” “Oh really, and why would one suspect that?” “I’m not totally sure, but I think it has something to do with the sun, and its rays of light.” “If most of the Hebrew males wore long hair and beards anyway, why was there a need for the razor ban?” pondered Wen. “Ah, is that the sound of trumpets scaling the ramparts of heaven?” “What on earth are you talking about?” “A question of questions, young Wendolina, the answer to which may serve as a stunning proof of our original assertion.” “Your original assertion, which was posed as a question anyway. And I’m older than you are.” “Yes, yes, dearest Wendlebury. There was a need for the razor ban, in order to achieve assimilation. The original model for Samson wasn’t Gilgamesh at all, it was his ‘alter-ego’, the wild-man, Enkidu, who in the words of birds-feet etched into tablets of baked-clay over four thousand years ago, possessed long hair like a woman and an excessively hairy body.” “In that case the ‘jaw-bone’ may well be a form of boomerang…” muses Wen, and then, “Birds’ feet?” “Cuneiform.” “If I wasn’t so confused, I’d be tempted to jump up and down,” says Wen. “Two-thirds animal, one-third man.” “Ah,” says Wen, the light of comprehension settling down to roost in her visage, “I knew the British Museum would be a good idea.” “Rule Britannia!” “Are we allowed to be rational for a moment?” “We would not expect you to be anything else.” “If we consider Enkidu who is two-thirds animal, one-third man, together with Gilgamesh, who is two-thirds divine, one-third man, and treat them as one whole man, we get a ruler who is one-third animal, one-third divine, and one third man.” “The idea was to create harmony out of an imbalance. On his own Gilgamesh mistook arrogance for strength and had become a tyrant and tormentor of his people.” “But the constructor of this tale would have to be a psychologist of far greater acumen than Carl Gustav Jung to have come up with that device.” “But it gets better. The harmony doesn’t last for long. The human part of Gilgamesh corrupts the animal part of Enkidu and as a result, together, they visit an ecological disaster upon their civilisation.” “This story is how old?” “About four thousand years.” “It’s not only high genius, it’s also pertinent.” “Genius is always pertinent.” “Do we know who the author is?” “Do we ever know who the author is?” “Do we know who the author is purported to be?” “Gilgamesh existed as the legendary protagonist in a number of Sumerian poems long before ‘his story’ was turned into an ‘epic poem’.” “So, who turned it into an epic poem?” “The compiler of the first ‘epic’ now referred to as the Old Babylonian Version is unknown.” “And the later version?” “Five hundred years after the Old Babylonian version had been circulated a ‘scholar-priest’ called Sin-leqi-unninni revised and elaborated it.” “Another name to conjure with. Do we know what it means?” “Something along the lines of, ‘The Moon accepts the Prayer’.” “Nice!” “Sin-leqi-unninni’s epic is now regarded as the Standard Version.” “And in some quarters, at least, he is regarded as a genius with greater psychological acumen than Carl Gustav Jung.” “Well, he was a priest.” *** *** The phenomenon of twins has always carried with it an aura of mystery. We use the terms identical and non identical to describe its biological manifestation, yet identity itself is, to us, no less mysterious. The earliest spiritual writings and teaching insist that this phenomena lies at the very heart of the human enigma. Would it, then, be worthwhile to consider what the ancients have left us to ponder in this regard? For those who dare to awaken to being… LIZARD-MEN – Now available in Amazon Paperback Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Posted in Art, Books | Tagged consciousness, magic, mystery, psychology, spirituality | Leave a comment Door of Dreams Posted on June 27, 2024 by Sue Vincent * Would you walk the corridor of dreams Into the dark and unknown inner places Where silent voices whisper your desires From unkissed lips upon amorphous faces * Dare you cross the Temple chequerboard Where black and white in alternating tread Reflect the hope and terror of the night To face imagination’s deeper dread * * Could you face each inner world you find Knowing that they are a true reflection That shows the turmoil of the conscious mind Destroying your illusion of perfection * Can you face the demons hidden there Where every rock and tree and fragrant flower May hold the cryptic kernel of your fears Reverberating with emotive power * * Look deep into the mirror of your dreams To see reflected ancient joys and sorrow Begin to read the soul and journeys there Face today and walk towards tomorrow Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Posted in Photography, Poetry | Tagged consciousness, imagination, Life, love, mystery, psychology, spirituality | 9 Comments Year of the Pig… Posted on February 14, 2024 by Stuart France Image – Sue Vincent * The device of riddling is common to most traditional cultures. Maidens set riddles for their suitors: ‘What is sweeter than mead…?’ ‘What is whiter than snow…?’ ‘What is lighter than a spark…?’ * Antagonists use riddles to settle their disputes: ‘Forty white horses on a red hill first they gnash then they champ then they stand still…?’ ‘What is blacker than the raven…?’ ‘What is swifter than the wind…?’ * Divinities play hide and seek with their devotees within the miasmic form of riddles: ‘What dances on the surface of the water…?’ ‘What good did Man find on earth that God di"
