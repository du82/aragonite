description = "Flames light the night and the beat of the drum calls... Guardians await the coming of the Silver Fox... Foxes prowl the night... ...and the revellers become aware... and they follow. Music fills the night... Trees blossom with fireflowers... and strange creatures, half seen in the shadows. The Silver Fox lights the torches... Many flock…"
full_description = '''← Mister Fox: Winter’s Tail… Spendyke… → Mister Fox in Holmfirth Posted on November 10, 2023 by Sue Vincent Flames light the night and the beat of the drum calls… Guardians await the coming of the Silver Fox… Foxes prowl the night… …and the revellers become aware… and they follow. Music fills the night… Trees blossom with fireflowers… and strange creatures, half seen in the shadows. The Silver Fox lights the torches… Many flock to the banner… Dragons dance in the flames… …and a giant Crow challenges the Silver Fox. …but he is no match for the feral fire. and he flees into the shadows. A shaft of flame from the staff of the Silver Fox lights the braziers… and the Foxes dance, triumphant. Esto Audax…Esto Ferox. Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Sue Vincent Sue Vincent was a Yorkshire born writer, esoteric teacher and a Director of The Silent Eye. She was immersed in the Mysteries all her life. Sue maintained a popular blog and is co-author of The Mystical Hexagram with Dr G.M.Vasey. Sue lived in Buckinghamshire, having been stranded there due to an accident with a blindfold, a pin and a map. She had a lasting love-affair with the landscape of Albion, the hidden country of the heart. Sue passed into spirit at the end of March 2021. View all posts by Sue Vincent → This entry was posted in Dance, England, Events, mystery, Photography, Stuart France and Sue Vincent, Traditions, travel and tagged crow, fire dance, folk dance, legend, Mister Fox. Bookmark the permalink. ← Mister Fox: Winter’s Tail… Spendyke… → 35 Responses to Mister Fox in Holmfirth Sixeighty says: May 10, 2016 at 06:10 England, as an old country, should have more things like this. I mean, I LITERALLY live 10 minutes away from a castle that was built in the 10th century. Why are we not so interesting!? LikeLike Reply Sue Vincent says: May 10, 2016 at 06:16 I live close to an ancient settlement, a Roman road and Saxon remains… and few in the village know about them. But this event is in England… Yorkshire…and the Foxes are most definitely local 🙂 LikeLiked by 1 person Reply Jane Dougherty says: May 10, 2016 at 08:02 Is that really what they get up to in Holmfirth? Who’d have thought it? Gorgeous photos btw. LikeLike Reply Sue Vincent says: May 10, 2016 at 08:25 Certainly the foxes invade once a year 🙂 thanks Jane. LikeLiked by 1 person Reply Woebegone but Hopeful says: May 10, 2016 at 10:24 Timeless. Heart your heart out 21st Century. LikeLike Reply Sue Vincent says: May 10, 2016 at 10:42 It is truly a magical experience that takes you out of time 🙂 LikeLiked by 1 person Reply Helen Jones says: May 10, 2016 at 11:55 Love this – the photos, the light, the words – just fantastic! I imagine it’s quite an experience in person. LikeLiked by 1 person Reply Sue Vincent says: May 10, 2016 at 12:01 It is a whole other world when you are there… the smells and sounds… an incredible experience. Every time 🙂 LikeLiked by 1 person Reply Helen Jones says: May 10, 2016 at 12:02 Otherworldly seems a very apt way to describe it, Sue – it looks extraordinary. LikeLiked by 1 person Reply Sue Vincent says: May 10, 2016 at 12:03 Oh it is 🙂 And to be inside the arena with them at the workshop was just amazing 🙂 LikeLiked by 1 person Reply Mary Smith says: May 10, 2016 at 12:01 Awesome – I hope one day I’ll have the chance to see the Foxes. LikeLiked by 1 person Reply Sue Vincent says: May 10, 2016 at 12:02 I hope you can, Mary. They are fabulous 🙂 LikeLiked by 1 person Reply macjam47 says: May 10, 2016 at 20:08 What a fabulous post. The pictures are truly amazing. LikeLike Reply Sue Vincent says: May 10, 2016 at 20:09 So difficult to choose just a few… there are so many … LikeLiked by 1 person Reply macjam47 says: May 10, 2016 at 20:59 No problem. Besides reading, looking at photos is my other love. LikeLike Reply Sue Vincent says: May 10, 2016 at 21:00 I like pictures too 🙂 Not that you would ever have guessed, of course 😉 LikeLiked by 1 person Reply macjam47 says: May 10, 2016 at 21:03 🙂 LikeLike Reply Pingback: Mister Fox in Holmfirth | GrannyMoon's Morning Feast Sue Vincent says: May 10, 2016 at 21:49 Thank you! LikeLike Reply GrannyMoon says: May 11, 2016 at 06:06 Wonderful! Loved seeing Sid’s Cafe as well! LikeLike Reply Sue Vincent says: May 11, 2016 at 06:08 You can’t help recognising so many of the locations there 🙂 LikeLike Reply stevetanham says: May 11, 2016 at 07:57 Reblogged this on stevetanham. LikeLike Reply Sue Vincent says: May 11, 2016 at 08:30 Thanks Steve x LikeLike Reply D. Wallace Peach says: May 11, 2016 at 14:05 Love the photos, Sue. The last close up is fabulous. All that fire and smoke sets such a wonderful mood; it’s so otherworldly and evocative. What great fun 🙂 LikeLike Reply Sue Vincent says: May 11, 2016 at 14:09 I would love to share all the rest of the photos… but hesitate to put several hundred of them on the blog 🙂 I am a dab hand now at framing the dancing ground and clicking in time to the music without actually looking at the screen 🙂 I don’t have to miss a thing 🙂 LikeLiked by 1 person Reply D. Wallace Peach says: May 11, 2016 at 14:18 Digital cameras are the best. Remember the old days? One technological advancement that we all enjoy 🙂 LikeLike Reply Sue Vincent says: May 11, 2016 at 14:24 I do… and all the films I could never afford to get processed too! 🙂 LikeLiked by 1 person Reply D. Wallace Peach says: May 11, 2016 at 15:17 Exactly! And all the pictures I didn’t take because I only had two shots left! LikeLike Reply Sue Vincent says: May 11, 2016 at 15:18 Yep… I love my digital camera.. even if it does need replacing after a nasty fall… LikeLike Reply Maca the Caller says: May 12, 2016 at 19:18 Excellent always a good story always a good show LikeLiked by 1 person Reply Sue Vincent says: May 12, 2016 at 19:24 That they are 🙂 LikeLike Reply marianbeaman says