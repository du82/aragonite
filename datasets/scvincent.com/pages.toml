title = "About Sue Vincent | Sue Vincent's Daily Echo"
description = "I am a Yorkshire born painter and writer, living in the south of England. I paint the strange things that come as images in dreams and fantasies and write about life as it happens. I was raised in a spiritually eclectic family in a landscape where myths and legends were woven into the stones, and…"
full_description = "About Sue Vincent I am a Yorkshire born painter and writer, living in the south of England. I paint the strange things that come as images in dreams and fantasies and write about life as it happens. I was raised in a spiritually eclectic family in a landscape where myths and legends were woven into the stones, and have always had an intimate relationship with the inner worlds and the understanding that all paths are but spokes on a wheel, leading ultimately to the same centre. It is not the path that one walks that matters, but how one chooses to walk it. I have been a student of the Mysteries for most of my life, studying alone for many years before joining the Servants of the Light. In 2012 I joined Steve Tanham as Director of the Silent Eye School of Consciousness, a modern Mystery School that seeks to strip back many of the layers in which esoteric thought has become shrouded and teach students a way to find the inherent magic in living and being. The School is not a business and is run simply and ethically to cover its own costs, not make a profit. The Silent Eye website has a blog, news and events section. We hold regular workshops and events in the ancient landscape, details of which can be found details on the Silent Eye Events page. As a painter, I play in most media and have painted everything from wedding cakes to huge murals. I spent a long time chasing realism, until I found the confidence to paint what I saw in the colours that sing to me. As a writer, I have always scribbled. Poetry came first, I think, and I was fortunate enough to win the David Burland International Poetry Prize in 2008. In that year also I began writing a column for The Spirit Guides. It was a busy year, as I was teaching online with various esoteric forums and made the acquaintance of Dr G. Michael Vasey. The friendship grew and we released The Mystical Hexagram, recently republished as an extended and updated edition. In 2013 a writing partnership was born that has proved a joy. Stuart France, now the third in the triad of Directors of the Silent Eye, and I embarked, all unknowing, on an adventure that would take us across the sacred landscape of Albion and which has resulted in the publication of a number of books together, with more to come. We have an enormous amount of fun in our wanderings and wonderings, which may reflect somewhat in the way we write. In 2009 my eldest son, Nick, was left for dead, stabbed through the brain in an unprovoked attack. Many of the earlier entries here chart his remarkable and near miraculous journey and the fallout the attack had on the family. An event like this changes everything, including one’s outlook. Luckily, for us it changed it for the better and love and laughter thrive. Apart from that, I have two adult sons, too many books (or not enough….) and a mad dog who also blogs when I let her near the keyboard… You can contact me via the form on my contact page, where you will also find the principal social media links. And yes, that was a lucky shot. Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... 360 Responses to About Sue Vincent margateichman says: December 7, 2012 at 22:25 So lovely to discover your writing today! A mystery school! I had just listened to a Neil Kramer interview this week, where he was talking about the mystery schools that used to be and are no more, and I found myself pondering this loss. I will look forward to catching up on your writing! You words caught my attention immediately – the ring of truth in one’s voice and words is becoming ever more apparent to me. Marga LikeLiked by 6 people Reply Echo says: December 7, 2012 at 22:35 Thank you, Marga. I noticed you had found the Facebook page.. there is also one for he School as well as the website. We are not the only Mystery School, there are others, some long established and respected Schools. We are just coming to birth, carrying forward a flame we have been handed. It is something we are passionate about and want to bring to life in the modern world. LikeLiked by 1 person Reply Ganesh says: December 16, 2012 at 20:35 Nice and interesting blog, Sue! Thanks for following “Known is a drop, Unknown is an Ocean”. 🙂 LikeLiked by 2 people Reply Echo says: December 16, 2012 at 20:43 Yours also, Ganesh. Nice to meet you. LikeLike Reply LyannV says: December 28, 2012 at 15:42 Hi! I have nominated you for the Blog of the Year 2012 Award. Please check out the link for more details: http://starfishway.wordpress.com/2012/12/28/thank-you/ Blessings, ~Lyann LikeLiked by 2 people Reply Echo says: December 28, 2012 at 16:25 Oh thank you Lyann! How kind of you! In Light, Sue LikeLike Reply overwhelmingpeace says: December 29, 2012 at 00:12 Thank you for liking my article “What do you seek?” I’m very glad your son not only survived that attack, but is doing so well. That kind of thing, as well as your car crash when you were 19, either destroy us and our families or make us stronger. It’s good to see that your family has held tightly together. LikeLiked by 3 people Reply Echo says: December 29, 2012 at 00:15 We’ve had our moments 🙂 But you are right, we can allow them to destroy us or choose to draw strength and learn something from them. And I’ve learned a lot from my sons 🙂 LikeLiked by 2 people Reply ajaytao2010 says: December 29, 2012 at 21:55 Absolutely beautiful reading about you I loved the expression ” spiritually eclectic family in a landscape where myths and legends were woven into the stones “, Oh so wonderful & humble as well. Thanks for visiting my blog. Be in touch. Browse through the category sections, I feel you may find something of your interest. LikeLiked by 3 people Reply Echo says: December 29, 2012 at 21:57 I browse as we speak 🙂 LikeLiked by 1 person Reply ajaytao2010 says: December 29, 2012 at 22:00 oh thanks LikeLike Reply Spiritual World Traveler says: December 30, 2012 at 04:57 The Silent Eye sounds interesting… I will have to see what that is all about! So glad you stopped by my blog! LikeLiked by 2 people Reply Echo says: December 30, 2012 at 08:04 Feel free to drop in and have a look at the website 🙂 Thanks for the likes and comments here. 🙂 LikeLike Reply Anna Failla says: January 2, 2013 at 14:47 Thank you so much for stopping by my blog -I can’t tell you how much I loved finding yours in return! I just spent a good half hour reading a million entries of yours -your writing is magical and had me hypnotized! It’s that good! Have a wonderful year and a beautiful life -look forward to reading more of your work in the future, i’m definitely following! Love, Anna LikeLiked by 2 people Reply Echo says: January 2, 2013 at 14:58 Thank you so much Anna! That is a lovely thing to find as I come home 🙂 LikeLike Reply Paul Handover says: January 3, 2013 at 18:03 Delighted to make the connection. That came, of course, from your decision to call by Learning from Dogs. So a big thank you for that. Let me wish you a Happy New Year, Paul LikeLiked by 2 people Reply Echo says: January 3, 2013 at 18:07 Happy new year to you, Paul. I sort of had to drop by, given how much I learn from my Ani… she even wrote one of the recent posts here for me 🙂 LikeLiked by 1 person Reply Echo says: January 3, 2013 at 18:24 https://scvincent.com/2012/12/20/notes-from-a-small-dog/ You may appreciate this 🙂 LikeLiked by 1 person Reply Richard Harrison says: January 4, 2013 at 02:18 Sue, thanks for stopping by and thanks for the follow. Seems we both have dogs in common. Look forward to dropping in from time to time to see how your year is going I’ll keep an eye out for a stray dog no matter where I go. Happy New Year! LikeLiked by 2 people Reply Richard Harrison says: January 4, 2013 at 02:19 And for some reason the post failed to identify MY blog – richardbegone. LikeLike Reply Echo says: January 4, 2013 at 08:30 It does odd things occasionally… 🙂 LikeLike Reply Echo says: January 4, 2013 at 08:27 There’s always the odd stray that needs a decent meal and a little love. Beautiful work on your blog! But ok.. it was the dog’s smile that caught my attention first 🙂 LikeLike Reply mytreetv says: January 4, 2013 at 14:31 Can you see the tree-spirit? LikeLiked by 2 people Reply Echo says: January 4, 2013 at 14:34 In your logo? of course 🙂 LikeLike Reply mytreetv says: January 4, 2013 at 14:35 Can you imagine, that some people don’t see it? LikeLike Reply Echo says: January 4, 2013 at 14:35 People see what they expect to see, I think. LikeLike Reply Echo says: January 4, 2013 at 14:40 You may like this 🙂 https://www.facebook.com/notes/scvincent/the-tree/113429005354722 LikeLike Reply QuotesYou says: January 6, 2013 at 16:45 i tagged you in an award http://quotesyou.wordpress.com/2013/01/06/the-liebster-blog-award/ 🙂 LikeLiked by 2 people Reply Echo says: January 6, 2013 at 22:51 Thank you … I’ll try and work them out 🙂 LikeLiked by 1 person Reply Kokowrites says: January 9, 2013 at 12:47 You’ve been nominated for the Super Sweet Blog Award http://kokowrites.wordpress.com/2013/01/09/the-super-sweet-blog-award/ LikeLiked by 2 people Reply Joan Miranda says: January 10, 2013 at 08:06 I love your writing…:D I enjoy the way you weave words to share tales of the heart… Thank you so much for visiting my blog and I’m glad that I stumbled upon yours. LikeLiked by 2 people Reply Echo says: January 10, 2013 at 08:08 Thank you 🙂 That’s a lovely thing to read before breakfast 🙂 LikeLike Reply ajaytao2010 says: January 10, 2013 at 11:19 I Nominate you for the Liebster Blog Award. Please accept & oblige. Please the link below & follow instructions. http://ajaytao2010.wordpress.com/2013/01/10/liebster-blog-award/ LikeLiked by 2 people Reply earthriderjudyberman says: January 13, 2013 at 03:50 That which doesn’t break us only makes us stronger. I am so glad that your son survived. Thanks so much for stopping by my blog. (Loved that photo of your dog winking.) LikeLiked by 1 person Reply Echo says: January 13, 2013 at 03:52 I’ve just been reading some more. Great articles you have posted. As to the dog, she is forever hijacking the blog….;-) LikeLike Reply earthriderjudyberman says: January 13, 2013 at 04:04 Thank you. I’m glad you enjoyed my stories. I was intrigued to see that you, too, went to Paris. LikeLiked by 1 person Reply Echo says: January 13, 2013 at 09:40 I lived there for a while, then moved to Vichy. There was something about that first photograph on your story that took me straight back. Happy years 🙂 LikeLike Reply theyorkshiretart says: January 15, 2013 at 15:36 Thanks for stopping by my blog, Sue. It’s wonderful to hear from fellow Yorkshire-woman! I very much enjoy your writing – there are some very inspirational stories here. All the best, TYT. LikeLiked by 1 person Reply Echo says: January 15, 2013 at 15:38 The curds caught my eye and tastebuds. Living here in the south where there are neither curd tarts, proper parkin nor a decent vanilla slice to be had, I could not have wandered by without stopping to look and whimper longingly a little.:-) LikeLike Reply gita4elamats says: January 25, 2013 at 03:20 Your dog looks like my Sushna, see photo on: http://poet4justicedotwordpressdotcom.wordpress.com/2012/09/19/a-prayer-to-ganesha-2/ Best wishes for your son’s recovery. LikeLiked by 2 people Reply Echo says: January 25, 2013 at 07:04 Thank you, my son continues to amaze me 🙂 Your Sushna does look very like my Ani! I was sad to read that you are dogless though. x LikeLike Reply Sanjuna says: May 24, 2020 at 12:48 Congrats for discovering your skills and thanks for helping other writers to know each other by your prompts..inspite of all your chaos you are clearing up sky for a shine..you are doing great and keep going on sue Vincent 🤗🤗🤗 LikeLike Reply Sanjuna says: May 24, 2020 at 12:48 Congrats for discovering your skills and thanks for helping other writers to know each other by your prompts..inspite of all your chaos you are clearing up sky for a shine..you are doing great and keep going on sue Vincent 🤗🤗🤗 LikeLike Reply gita4elamats says: January 25, 2013 at 07:26 We are hoping to travel a bit while we are dogless but will probably get another dog after that. I’m so glad that your son contiues to improve and amaze you. LikeLiked by 1 person Reply Echo says: January 25, 2013 at 07:43 Oh wonderful 🙂 LikeLike Reply gita4elamats says: January 25, 2013 at 08:24 Cheers! 🙂 LikeLiked by 2 people Reply Echo says: January 25, 2013 at 08:28 🙂 LikeLike Reply suzywordmuser says: January 29, 2013 at 16:41 Just thought I’d leave you a note here to say, how good it was to read what your son Nick wrote and as a lady of poetry and fiction, it is a refreshing change to read something of real value. I have realised in my very short life of blogging that it’s not good for my mind to follow and read too many poets and writers of fiction, because it all starts to feel like rubbish in the end – and some of it is (hope they don’t read this!!) I include some of my own in that too! You must be a real inspiring lady to have a son who thinks like he does, because we all are inspired by our parents in some form or another, even if we would rather not admit it! And one last thing, your post by Nick really made my day! Suzy 😀 LikeLiked by 2 people Reply Echo says: January 29, 2013 at 16:52 Your response made my son’s day too. I just spoke to him on the phone 🙂 He has mentioned on the odd occasion that the hobbit has had some value to him 😉 The blog here is always true.. unless clearly specified. The journey with my son, if anything, toned down as it would be too much for some, I think. My poetry varies in quality.. I write it for me and merely inflict it on the rest of the world…*chuckles* Nick has gone in search of the book you mentioned. He wants to read it… and being able to read again at all is such a joy for him, and for me to see. Love, Sue LikeLike Reply Siege says: February 1, 2013 at 21:20 Thank you for stopping by my blog. I like your writing. LikeLiked by 2 people Reply Echo says: February 1, 2013 at 21:22 I was just about to post the same on your blog 🙂 LikeLike Reply Siege says: February 1, 2013 at 21:24 🙂 LikeLike Reply Rachel says: February 11, 2013 at 22:18 Thank you for stopping by my post 🙂 I too am Yorkshire born and living in the south. What a small world it is. Your blog is wonderful. I shall have to continue tomorrow when I can see again (after reading one of your recent posts!) LikeLiked by 2 people Reply Echo says: February 11, 2013 at 22:20 Oh lovely! Where are you from.. Leeds area myself. Here, have a tissue…. LikeLike Reply Rachel says: February 12, 2013 at 09:23 I’m from Huddersfield, so not far away at all! LikeLiked by 1 person Reply Echo says: February 12, 2013 at 09:34 I know it well. Worked there for a while.. and went to the Grammar in Batley, no not far at all. LikeLike Reply Heather says: February 11, 2013 at 22:38 thank you for visiting"
