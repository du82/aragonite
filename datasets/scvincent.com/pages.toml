full_description = '''← Big Wheels… Big Chants… → Big Liars… Posted on October 8, 2023 by Stuart France ‘Evil is also that which destroys spirit.’ *** The psychology of evil is distinguished by – Consistent destructive, scapegoating behaviour, which may often be quite subtle. Excessive, albeit usually covert, intolerance to criticism and other forms of narcissistic injury. Pronounced concern with public image and a self image of respectability, contributing to a stability of life-style but also pretentiousness and the denial of hateful feelings or vengeful motives. Intellectual deviousness, with increased likelihood of a mild schizophrenic disturbance of thinking at times of stress. People of the Lie, M Scott-Peck To which may also be added – Habitual cognitive dissonance and a tendency to speak, or write, in ‘word salad’. ‘Fort of Foreign Powers?’ The State has repeatedly proven itself a poor ‘parent’. To be continued… Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in albion, Ancestors, Art, Books and tagged consciousness, psychology, spirituality. Bookmark the permalink. ← Big Wheels… Big Chants… → 2 Responses to Big Liars… Pingback: Big Wheels… | Sue Vincent's Daily Echo Pingback: Big Chants… | Sue Vincent's Daily Echo Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'''
