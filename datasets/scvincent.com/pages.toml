description = "*** ... “You know, I’m not sure syncretism is quite the right word,” says Wen, eyeing the icon of Gilgamesh with some trepidation. We are in the British Museum doing ‘research’ as Wen likes to call it. ‘Pick up your staff and pen,’ she said, ‘we have work to do.’ Which means in Wen-Speak, among…"
full_description = '← Door of Dreams White Sun… → Lizard-Men Posted on July 4, 2024 by Stuart France *** … “You know, I’m not sure syncretism is quite the right word,” says Wen, eyeing the icon of Gilgamesh with some trepidation. We are in the British Museum doing ‘research’ as Wen likes to call it. ‘Pick up your staff and pen,’ she said, ‘we have work to do.’ Which means in Wen-Speak, among other things, more churches… “Your doubts are probably well founded. Mr Graves called it ‘iconotropy’ – turning religious iconography to new religious purpose.” “Oh, him again. No one knows who Robert Graves is.” “Well, they should! Anyway, in ‘King Jesus’ he has a Priestess of Astarte and Joshua-ben-Miriam go through a whole series of cave-bound images with each of them giving a different yet perfectly valid interpretation of the self-same icon.” “Cave-bound?” “Inscribed in a cave.” “It hardly seems possible.” “Religious interpretation, I should have said.” “It still hardly seems possible.” “Why isn’t anything, anything else?” “You’re being obscure again,” says Wen. “It’s what we bring to the table!” “Hmmm… That’s a good thought… Okay then, is Gilgamesh meant to be a giant?” “In the story he is two-thirds divine, one third-man.” “Which doesn’t actually answer my question.” “I don’t know, is he meant to be a giant?” “Ah, I see… Well, if that is a mature lion, then he is very definitely a giant.” “The Hebrew storytellers saw fit to make the lion a cub.” “With the express aim of de-gigantic-ising him I expect.” “Is that a word?” “I shouldn’t think so.” “So, why would they down-size him?” “Because the strength of their hero didn’t come from his size. It came from God.” “The Spirit of the Lord.” “The Spirit of the Lord, that’s right.” “But if Gilgamesh is two-thirds divine, doesn’t his strength come from ‘God’ too?” “Gilgamesh has a divine mother, Ninsun, and a father who was born human but later became divine.” “Ninsun, is a name to conjure with,” murmurs Wen and then, “this becoming divine business is interesting.” “And the crux of their reasoning for a change. The Hebrews did not go in for that kind of truck with the Gods. Their God was transcendent. Only his feminine aspect was immanent and because of that she was not regarded as a Goddess. She was known as the Shekinah but even this, later became all but forgotten. At least officially.” “That is not the jaw-bone of an ass is it?” “I very much doubt it.” “Do we have any idea what it actually is?” “Nope. None whatsoever, but I expect it will reveal its identity at some point during the proceedings.” “Research!” proclaims Wen, triumphantly. “If you insist,” but this is a form of research too. The Greeks called it dialectic… three, six, nine… lots of maybe’s, lots of supposes…” “So, why should transcendence be considered the ‘be all and end all’?” “I don’t know, why should transcendence be considered the ‘be all and end all’?” “Well, it has to do with the outer, and hierarchy, and objectivity.” “None of which are intrinsically unsound concepts.” “Until they are regarded as ends in themselves and not as integral parts of process and cycle… I like his hair.” “Not so sure about the chain-mail beard though.” “Did Samson have a beard?” “I expect so, although I suspect the ban on the razor only extended to his head.” “Oh really, and why would one suspect that?” “I’m not totally sure, but I think it has something to do with the sun, and its rays of light.” “If most of the Hebrew males wore long hair and beards anyway, why was there a need for the razor ban?” pondered Wen. “Ah, is that the sound of trumpets scaling the ramparts of heaven?” “What on earth are you talking about?” “A question of questions, young Wendolina, the answer to which may serve as a stunning proof of our original assertion.” “Your original assertion, which was posed as a question anyway. And I’m older than you are.” “Yes, yes, dearest Wendlebury. There was a need for the razor ban, in order to achieve assimilation. The original model for Samson wasn’t Gilgamesh at all, it was his ‘alter-ego’, the wild-man, Enkidu, who in the words of birds-feet etched into tablets of baked-clay over four thousand years ago, possessed long hair like a woman and an excessively hairy body.” “In that case the ‘jaw-bone’ may well be a form of boomerang…” muses Wen, and then, “Birds’ feet?” “Cuneiform.” “If I wasn’t so confused, I’d be tempted to jump up and down,” says Wen. “Two-thirds animal, one-third man.” “Ah,” says Wen, the light of comprehension settling down to roost in her visage, “I knew the British Museum would be a good idea.” “Rule Britannia!” “Are we allowed to be rational for a moment?” “We would not expect you to be anything else.” “If we consider Enkidu who is two-thirds animal, one-third man, together with Gilgamesh, who is two-thirds divine, one-third man, and treat them as one whole man, we get a ruler who is one-third animal, one-third divine, and one third man.” “The idea was to create harmony out of an imbalance. On his own Gilgamesh mistook arrogance for strength and had become a tyrant and tormentor of his people.” “But the constructor of this tale would have to be a psychologist of far greater acumen than Carl Gustav Jung to have come up with that device.” “But it gets better. The harmony doesn’t last for long. The human part of Gilgamesh corrupts the animal part of Enkidu and as a result, together, they visit an ecological disaster upon their civilisation.” “This story is how old?” “About four thousand years.” “It’s not only high genius, it’s also pertinent.” “Genius is always pertinent.” “Do we know who the author is?” “Do we ever know who the author is?” “Do we know who the author is purported to be?” “Gilgamesh existed as the legendary protagonist in a number of Sumerian poems long before ‘his story’ was turned into an ‘epic poem’.” “So, who turned it into an epic poem?” “The compiler of the first ‘epic’ now referred to as the Old Babylonian Version is unknown.” “And the later version?” “Five hundred years after the Old Babylonian version had been circulated a ‘scholar-priest’ called Sin-leqi-unninni revised and elaborated it.” “Another name to conjure with. Do we know what it means?” “Something along the lines of, ‘The Moon accepts the Prayer’.” “Nice!” “Sin-leqi-unninni’s epic is now regarded as the Standard Version.” “And in some quarters, at least, he is regarded as a genius with greater psychological acumen than Carl Gustav Jung.” “Well, he was a priest.” *** *** The phenomenon of twins has always carried with it an aura of mystery. We use the terms identical and non identical to describe its biological manifestation, yet identity itself is, to us, no less mysterious. The earliest spiritual writings and teaching insist that this phenomena lies at the very heart of the human enigma. Would it, then, be worthwhile to consider what the ancients have left us to ponder in this regard? For those who dare to awaken to being… LIZARD-MEN – Now available in Amazon Paperback Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in Art, Books and tagged consciousness, magic, mystery, psychology, spirituality. Bookmark the permalink. ← Door of Dreams White Sun… → Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
