full_description = '← Year of the Pig… Lizard-Men → Door of Dreams Posted on June 27, 2024 by Sue Vincent * Would you walk the corridor of dreams Into the dark and unknown inner places Where silent voices whisper your desires From unkissed lips upon amorphous faces * Dare you cross the Temple chequerboard Where black and white in alternating tread Reflect the hope and terror of the night To face imagination’s deeper dread * * Could you face each inner world you find Knowing that they are a true reflection That shows the turmoil of the conscious mind Destroying your illusion of perfection * Can you face the demons hidden there Where every rock and tree and fragrant flower May hold the cryptic kernel of your fears Reverberating with emotive power * * Look deep into the mirror of your dreams To see reflected ancient joys and sorrow Begin to read the soul and journeys there Face today and walk towards tomorrow Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Sue Vincent Sue Vincent was a Yorkshire born writer, esoteric teacher and a Director of The Silent Eye. She was immersed in the Mysteries all her life. Sue maintained a popular blog and is co-author of The Mystical Hexagram with Dr G.M.Vasey. Sue lived in Buckinghamshire, having been stranded there due to an accident with a blindfold, a pin and a map. She had a lasting love-affair with the landscape of Albion, the hidden country of the heart. Sue passed into spirit at the end of March 2021. View all posts by Sue Vincent → This entry was posted in Photography, Poetry and tagged consciousness, imagination, Life, love, mystery, psychology, spirituality. Bookmark the permalink. ← Year of the Pig… Lizard-Men → 9 Responses to Door of Dreams Tanvir Kaur says: June 27, 2024 at 09:04 Beautiful share LikeLiked by 1 person Reply janetweightreed10 says: June 27, 2024 at 09:39 Thank you for sharing this…. LikeLiked 