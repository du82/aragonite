full_description = "← The Soft Emptiness of a Liminal Place -Alethea Kehas Swift Passage… → Into Spirit… Posted on March 30, 2021 by Stuart France Sue Vincent 14th September 1958 – 29th March 2021 R.I.P * For the last nine years of her life, Sue was a Director of the Silent Eye school of Consciousness. In addition to the works published during her lifetime, which are listed in the post, Legacy, there are now a number of her works published posthumously. These are all large format paperback books and are available from Amazon. Hawk at Dawn – SE Writings 2012 – 2015 Hawk at Noon – SE Writings 2015 – 2018 Hawk at Dusk – SE Writings 2018 – 2021 Flying Kites – Selected SE Writings 2012 – 2021 Wisdom’s Way – Selected SE Writings 2012 – 2021 * Books written with Stuart France Wild-Hunt Circle to Circle The Calling Hob Hurst’s House: Strange Tales from the Dales Giant Rombald Triad of Albion The Doomsday Books Lands of Exile Reading Don & Wen Sacred Spaces * All cover art – Sue Vincent Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in adventure and tagged consciousness. Bookmark the permalink. ← The Soft Emptiness of a Liminal Place -Alethea Kehas Swift Passage… → 184 Responses to Into Spirit… Chatter Master says: March 30, 2021 at 02:19 “On angel’s wings” you now fly Sue. Thank you for gracing our lives. I am saddened by your leaving, gladdened for having ‘met’ you. Bless you (and those who love you) on your journey. I will miss you. ❤️ LikeLiked by 13 people Reply SoundEagle 🦅ೋღஜஇ says: April 3, 2021 at 00:31 How nicely put! Sue, our fellow poet and writer, had always been a very graceful and amiable human being. She will definitely be missed by those who knew her and her prose well. Her essence will live on in her poems and writings that touch our hearts and minds. I hereby salute and embrace all of you in our united stance towards paying our respect for Sue who had ceased cheating life and walked through the “door [that] hangs open and beckoning [her] … to see what the other side is like, its views and vistas, its salons, its gardens”, to borrow Jim Webster’s words. Yours sincerely, ჱܓSoundEagle🦅 LikeLiked by 2 people Reply Chatter Master says: April 6, 2021 at 00:49 Beautiful. Spirit on wonderful soul. LikeLiked by 2 people Reply Alicia Butcher Ehrhardt says: March 30, 2021 at 02:20 Thank you, Stuart. She was a very special woman. LikeLiked by 8 people Reply bobcabkings says: March 30, 2021 at 02:38 Sue will be sorely missed by all of us, and one small dog. LikeLiked by 10 people Reply Pingback: Into Spirit… | Sue Vincent’s Daily Echo | Pattys World Pingback: Into Spirit… — Sue Vincent’s Daily Echo | Jen Goldie says: March 30, 2021 at 03:27 ❤🦋❤🌹 LikeLiked by 6 people Reply Dorinda Duclos says: March 30, 2021 at 03:30 I am so deeply sorry to hear this sad news. Sue was a very special lady and will be greatly missed. LikeLiked by 10 people Reply Felicia Denise says: March 30, 2021 at 03:32 Thank you, Stuart. Rest in peace, dear Sue. ❤❤🙏🙏 LikeLiked by 9 people Reply Jo Elizabeth Pinto says: March 30, 2021 at 03:42 Valla con Dios, la flor hermosa de la primavera. LikeLiked by 6 people Reply balroop2013 says: March 30, 2021 at 03:48 Rest in peace dear Sue, you leave behind a grieving blogosphere. My deepest condolences to her family and friends. LikeLiked by 9 people Reply Marilyn Armstrong says: March 30, 2021 at 04:09 Reblogged this on Serendipity Seeking Intelligent Life on Earth and commented: Fare thee well, my good friend. I will always miss you. LikeLiked by 8 people Reply Sadje says: March 30, 2021 at 04:14 We will miss her, she was a special lady. May she Rest In Peace. Amen LikeLiked by 8 people Reply Marilyn Armstrong says: March 30, 2021 at 04:18 And you Stuart, take care of yourself, too. It’s a terrible loss. LikeLiked by 10 people Reply The Persecution of Mildred Dunlap says: March 30, 2021 at 04:30 Thank you, Stuart. She was a very special, inspirational cyber friend. I shall miss her. My condolences to the family. ❤️🙏 LikeLiked by 9 people Reply Christine Bolton, Poetry for Healing says: March 30, 2021 at 04:34 Thank you Stuart for sharing your sad news. My heart goes out to you and your family. Sue was a very special person to so many. A friend, a mentor, a coach. I will miss her ❤️ LikeLiked by 7 people Reply Anonymous says: March 30, 2021 at 04:37 In Spain to offer condolences we say, I accompany you in the feeling, which, although it is a cliché, makes a lot of sense in moments of mourning. I’m so sorry. LikeLiked by 7 people Reply artbychristinemallabandbrown says: March 30, 2021 at 04:52 I just woke up early and checked my emails. I have been reading Sue’s work for a couple of years now. I knew the situation but didn’t want to believe it. Please accept my deepest condolences. Regards Christine LikeLiked by 7 people Reply Ana says: March 30, 2021 at 04:52 In Spain to offer condolences we say, I accompany you in the feeling, which, although it is a cliché, makes a lot of sense in moments of mourning. I’m so sorry.😔 LikeLiked by 7 people Reply Jean Lamb says: March 30, 2021 at 05:10 Thank you for letting us know. I was pretty much always a lurker, but loved all this. The room is empty Then a breath of love blows through; Perfume for the soul. LikeLiked by 9 people Reply Charli Mills says: March 30, 2021 at 05:13 Sue blessed us all and has now flown into spirit. Her legacy lives on in her stories and ours. She will be missed here. LikeLiked by 10 people Reply RuthScribbles says: March 30, 2021 at 05:41 She will be missed. 💕🧚🏻‍♀️💕 LikeLiked by 8 people Reply Dyanna says: March 30, 2021 at 06:18 Sue’s sense of humor and her views on day-to-day life will be greatly missed. LikeLiked by 7 people Reply DiosRaw says: March 30, 2021 at 06:27 Be at peace, you inspired so many. ♥️🌹 LikeLiked by 5 people Reply Ritu says: March 30, 2021 at 06:34 Thank you, Stuart , for letting us know. Sue was the special kind of woman who touched the lives of many. Fly high, Sue. We’ll miss you, and never forget all you gave us. 💜🙏🏼 LikeLiked by 6 people Reply ladyleemanila says: March 30, 2021 at 06:38 our hearts and prayers are with Sue’s family, may her soul rest in peace ❤ LikeLiked by 8 people Reply G. Michael Vasey says: March 30, 2021 at 07:11 Reblogged this on The Magical World of G. Michael Vasey and commented: No words… LikeLiked by 8 people Reply petespringerauthor says: March 30, 2021 at 07:12 May Sue’s family have nothing but good memories. What a treasure! LikeLiked by 8 people Reply Ritu says: March 30, 2021 at 07:20 Reblogged this on But I Smile Anyway… and commented: RIP, Sue 😢🙏🏼💜 T You were an angel to many, here, on earth, and now you fly above, as a real one. I’ll miss you. LikeLiked by 8 people Reply eloisedesousa says: March 30, 2021 at 07:39 Daffodils bow their heads As a literary angel walks in their stead. You’re now free from the pain And will not be forgotten For your words, for eternity, will remain. R.I.P. Sue🌸 LikeLiked by 8 people Reply willowdot21 says: March 30, 2021 at 07:45 Thank you Stuart for letting us know Sue was a wonderful person. I am so sorry for you loss, and please pass my condolences on to the boys and the grandchildren. Her spirit will live on with us all. Fly high Sue we all loved you and still do.💜💜 LikeLiked by 8 people Reply willowdot21 says: March 30, 2021 at 07:46 Reblogged this on willowdot21 and commented: Born high on angel wings. LikeLiked by 8 people Reply KL Caley says: March 30, 2021 at 07:56 Thank you Stuart for letting us know. I am so sorry for the loss to you and all of Sue’s family. She was a treasure, an inspiration to us all and I will always be so very grateful for the encouragement she gave me in my writing and all the wisdom she shared in hers. With prayers and sympathy, KL ❤ Lik