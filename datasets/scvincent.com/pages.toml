description = "* The White Sun of the Tarot Fool is reputed to signify the spiritual sun… An impersonal power manifesting as a limitless energy radiated to the world-system of planets without number, streaming out and over them from their respective suns. … Otherwise designated, the sun behind the sun. In our solar system the sun behind…"
full_description = '← Lizard-Men Love to Sue… → White Sun… Posted on August 27, 2024 by Stuart France * The White Sun of the Tarot Fool is reputed to signify the spiritual sun… An impersonal power manifesting as a limitless energy radiated to the world-system of planets without number, streaming out and over them from their respective suns. … Otherwise designated, the sun behind the sun. In our solar system the sun behind the sun is the dog-star Sirius. Derived from the Greek ‘Serius’ the name means a ‘scorching’ or ‘blazing’ light. The heliacal rising of Sirius marked the flooding of the Nile in Ancient Egypt, which brought life-bestowing fertile soil to the region, and the leisurely dog-days of summer for the philosophers of Ancient Greece. The spiritual sun never achieves its zenith for from the zenith it would then have to descend. Infinite energy cannot reach a point in manifestation from whence its power decreases. In Ancient Britain, the Arch-Mage Merlin’s daimon, or higher-self, was known to him as Blaise. The sun-flowers of the Tarot Sun have all, but one, turned their face away from the Day-Star. The one that has not, still in bud, signifies the ‘Fifth Dimension’. The higher-self casts no shadow. Alien Heat 1024 * SPENDYKE 2022, a fugitive from planet Spendyke holes up in the bowels of the Rubicon library. There he discovers ancient accounts of the reasons for his planet’s current plight. Further research uncovers practical solutions to the dire world situation in the prevailing views of State Philosopher Hux. As the global government crumbles around him the fugitive embarks upon a journey into his own past in order to pull Spendyke back from the brink. But will he be successful? * SPENDYKE 2023 – Anarchy stalks the streets. The Globotomists and the grandees of their Home Stand are closing in on the Rubicon. That improbable haven founded thousands of years before the current madness erupted. Our fugitive, Demos, still lurks somewhere within its crusty corridors scouring the old tomes, housed on its crumbling shelves, for an antidote to Spendyke’s most grim secret… The Riddle of the Nine Dark Tri-Grams is key to overcoming the demon hordes that hold sway, and now run amok. Will Demos solve his home planet’s ancient enigma, before the inevitable doom descends, or not? Welcome, to the apocalyptic world of Cashelkeep! * * Front and Back Cover art by Sue Vincent * SPENDYKE 2024 – A hot white sun rises over the Rubicon and its myriad of now deserted city streets. Within the crumbling, ancient structure, Demos still lurks in fervent correspondence with the few survivors who have somehow managed to contact him. What solutions to their dire predicament does a forties, black and white, classic film contain? And what will the Globotomists’ new, inter-dimensional, world look like and be peopled with… A whiter than white world ablaze with Gods, Giants, Androids, and Souls of the Dead, perchance, or just more, and bigger, bolder conglomerates of the power crazed? Here at the end of all time, there really is only one way to find out… Read it like your very life depends upon it! Now Available in large format Paperback here. Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Stuart France Writer and Director of T.O.L.L. View all posts by Stuart France → This entry was posted in albion, Art, Books and tagged consciousness, imagination, magic, mystery, psychology, story, Stuart France and Sue Vincent, writing. Bookmark the permalink. ← Lizard-Men Love to Sue… → Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
