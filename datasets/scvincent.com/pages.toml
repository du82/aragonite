full_description = '← Mister Fox… Mister Fox and The Green Man… → …And the Green Man Posted on October 20, 2023 by Sue Vincent * …If Tee’s study was the hub of intelligence, then Miss Hunnyfludd’s office, which comprised no more than a hastily compromised ante-chamber to its plush superior, was the heart… Thomas Welch was currently making himself at home in the heart of operations and musing about his latest exploits in the name of service… ‘…hub-ub…hub-ub…hub-ub…’ It was not, upon reflection, the most distinguished of performances from our number one agent. “They’re already referring to it as The Big Stone Head Affair, Tommy,” said Hunnyfludd disarmingly. “Oh, they are, are they, Hunnyfludd, and who, precisely, might I ask, are ‘they’?” Welch smiled sardonically and raised a secretly famous eyebrow. “Why, those in the know, of course, Tommy, those in the know,” smiled back Hunnyfludd, equally sardonically for she enjoyed their little contretemps. Continue reading at France & Vincent Press a button or two to share... go on, make my day :)FacebookTwitterLinkedInPinterestWhatsAppTumblrRedditPocketPrintEmailTelegramMixLike Loading... Related About Sue Vincent Sue Vincent was a Yorkshire born writer, esoteric teacher and a Director of The Silent Eye. She was immersed in the Mysteries all her life. Sue maintained a popular blog and is co-author of The Mystical Hexagram with Dr G.M.Vasey. Sue lived in Buckinghamshire, having been stranded there due to an accident with a blindfold, a pin and a map. She had a lasting love-affair with the landscape of Albion, the hidden country of the heart. Sue passed into spirit at the end of March 2021. View all posts by Sue Vincent → This entry was posted in albion, Art, Books, fantasy, fiction, france and vincent, Humour and tagged earth mysteries, Fairy Tale, Folk Tale, magic, mystery, Photography, psychology, the mysteries. Bookmark the permalink. ← Mister Fox… Mister Fox and The Green Man… → Leave a comment Cancel reply Δdocument.get