ity, affecting vote scores, subscribing to members, sending messages to other members, promoting your social media profiles, etc. Control, Rights & Correction of your Data As a member, you have control to rectify or remove what you post as well as change your username and email at anytime. If you are unable to access your account, you can request the specific modification or complete removal of your content or account via our contact form or ticket system. Please be aware that the public posts, messages, and activities you submitted prior to deleting your account will remain visible to others, unless you remove or request removal of such content. We may retain internal information as required by law or for protecting against Service, member or visitor abuse. If you have questions or need help correcting or removing your data, contact us. Information about children We don’t believe social media is suitable for children under 13 years of age and therefore all members must confirm they are of 13 years or older when signing up. To comply with GDPR, we raised the age confirmation to 16 for EU members on sign up. Individuals under the age of 13, 16 in EU, may not create an account or otherwise access or use the Services. Data Protection & Security We take every reasonable precaution to protect the data on our servers from loss, misuse, unauthorized access, disclosure, alteration, or destruction, taking into account the risk level and the nature of the data. You are responsible for taking every reasonable precaution on your end to protect any unauthorized person from accessing your Sea-of-Memes account. We recommend using complex and unique passwords for all of your online accounts. Ads and Analytics Partners We may partner with third-party advertisers, ad networks, and analytic providers to deliver advertising and content that is targeted to your interests or to better understand your use of the Services. These third parties may collect information sent by your computer, 