full_description = "Referrer Policy Starting on Jul 15, 2022 Brave Search is updating its referrer policy [1] from noreferrer to strict-origin-when-cross-origin. This is a standard practice among search engines and provides a way for pages to know where traffic is coming from, which is essential to evaluate regulatory efforts, for instance, to appear in Google’s Android choice screen[2]. This change has no practical implication on privacy, for cross-origin requests only the origin is sent, which will be https://search.brave.com. Duckduckgo published a good piece motivating the use of strict-origin-when-cross-origin in this article. Referrer Policy, MDN docs ↩︎ Android Choice Screen ↩︎ Resources Brave Search Premium Brave Search Help Transparency Report Report a security issue Status Products Brave Browser Brave Search Brave Wallet Brave Talk Brave Firewall + VPN Brave Playlist Brave News Brave Rewards Brave Search API Brave Ads Policies Privacy Policy Terms of Use"
