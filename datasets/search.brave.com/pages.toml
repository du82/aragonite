["https://search.brave.com/help/integrations"]
title = "Brave Search Partner Integrations | Brave Search"
description = "Search the Web. Privately. Truly useful results, AI-powered answers, & more. All from an independent index. No profiling, no bias, no Big Tech."
full_description = "Brave Search Partner Integrations Sometimes Brave Search integrates with industry partners to improve search results and offer certain rich widgets. Partner integrations can provide some sort of revenue for Brave through affiliate or sponsored links or access to high-utility data to improve the experience on Brave Search. In the case of revenue, those widgets will be disabled for rewards users until there is a mechanism to reward their attention. Partners For example we partner with Tripadvisor to enrich results about locations and businesses. We partner with Kayak to provide a link to relevant flights directly in our flights widget. This link contains information, in the form of a generic partner code, which discloses to Kayak that the visit is coming from Brave Search. We partner with Amazon to expand product ad inventory for Brave Search advertising. This partnership is done in the spirit of Brave’s commitment to privacy. For queries with shopping intent that we would consider relevant for Amazon, Brave provides Amazon with the following non-personal data: Query User agent (browser) Truncated IP address IPv4 ― Only top 24 bits IPv6 ― Only top 48 bits Amazon uses this data in accordance with their Privacy Notice. Partner tags Brave Search sometimes adds a query parameter (“tag”) to the partner’s URL for attribution (see Partner tags section below). This tag does not identify you in any way, it has the same value for all users. It does not affect Brave’s privacy protections in any way. Below you will find the complete list of cases for which we add a partner tag, as well as the tag itself highlighted in the examples. Integration Example Url Privacy policy Tripadvisor https://www.tripadvisor.com/Hotel_Review-g1385761-d1111845-Reviews-Leonardo_Hotel_Munchen_City_Center-Upper_Bavaria_Munich.html?m=66412** Link Kayak https://www.kayak.com/in?a=kan_249103_561427&encoder=27_1&pid=deeplinks&url=%2Fflights%2FMUC-FCO%2F2023-04-27%2F2023-05-04%2Feconomy%2F1adults%3Fsort%3Dbestflight_a Link Amazon https://www.amazon.com/dp/B07WGJ1DNJ?tag=bravesoftwa04-20&linkCode=osi&th=1&psc=1&language=en_US Link"
