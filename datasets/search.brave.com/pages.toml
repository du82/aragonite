["https://search.brave.com/help/discussions"]
title = "Brave Search Discussions | Brave Search"
description = "Search the Web. Privately. Truly useful results, AI-powered answers, & more. All from an independent index. No profiling, no bias, no Big Tech."
full_description = "Brave Search Discussions Discussions is a feature in Brave that is designed to easily serve discussion-based results around searches where there are heavy SEO results. The Brave Search ranking algorithm detects cases where discussion forums would provide an alternative or complementary viewpoint to the organic search results. This is done by computing a “discussion_worthiness” score, which is based on a variety of signals such as: Freshness of the topic (i.e Is the topic time sensitive?) The popularity of the topic on discussion forums The quality of the discussions (i.e user engagement on these threads) The search quality score on how relevant the discussion is to the user query Once the query is considered ‘discussion-worthy’, we retrieve and rank results from a variety of forums which match the user query. A deep search of this nature is possible on Brave Search due to our independent index, which has been optimized for this purpose. While the first version of Discussions is focused on Reddit and the StackExchange network, we are working on expanding our support for additional forums in the near future. Resources Brave Search Premium Brave Search Help Transparency Report Report a security issue Status Products Brave Browser Brave Search Brave Wallet Brave Talk Brave Firewall + VPN Brave Playlist Brave News Brave Rewards Brave Search API Brave Ads Policies Privacy Policy Terms of Use"
