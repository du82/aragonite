full_description = "EU Digital Services Act The EU Digital Services Act requires online search engines and other intermediary services and platforms to publish “information on average monthly active recipients of the service” in the European Union, calculated as an average over the period of the last six months. This is to assist the European Commission decide whether an online platform or online search service falls under the definition of a Very Large Online Platform (VLOP) or a Very Large Online Search Engine (VLOSE), meaning that monthly active recipients of the service in the EU is equal to or higher than 45 million. Over the period June 30, 2023 to December 31, 2023 we have estimated the average monthly active recipients of the Brave Search service within the EU member states to be under 45 million. Resources Brave Search Premium Brave Search Help Transparency Report Report a security issue Status Products Brave Browser Brave Search Brave Wallet Brave Talk Brave Firewall + VPN Brave Playlist Brave News Brave Rewards Brave Search API Brave Ads Policies Privacy Policy Terms of Use"
