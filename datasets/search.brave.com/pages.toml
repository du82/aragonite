["https://search.brave.com/help/google-fallback"]
title = "Google fallback mixing | Brave Search"
description = "Search the Web. Privately. Truly useful results, AI-powered answers, & more. All from an independent index. No profiling, no bias, no Big Tech."
full_description = "Google fallback mixing Brave Search is still refining its index. For any query where we may not return enough results, you can allow the Brave browser to anonymously check Google for the same query. This feature—the Google fallback mixer—presents the results together for you, and sends the query results back to Brave Search so we can improve responses next time. Context Due to the ubiquity of some other search engines, most users will be accustomed to seeing search results presented in a specific way. This includes result sets, ranking order, ad placement, content snippets, mapping functionality, peer-ratings, and more. As Brave launches its private, independent search engine, we must still meet user expectations. However, given the newness of the Brave Search index and its ranking algorithm, our results may not yet be refined enough for all queries. (Especially for less common or “long-tail” queries). To counter this, Brave Search gives you the option to let your browser anonymously check Google when our results need more depth. The result sets are mixed in your browser, and sent back to us for analysis so we can learn what types of queries need more work. Note that choosing this option has no effect on your privacy. If you happen to have a Google account, Google will not be able to associate your query with this account. And Brave does not keep your queries in any shape or form. Brave’s goal is to reduce the reach of other search engines. In this case, the fallback mixer is simply a short-term means to an end. It allows us to create a product that competes, not just on philosophy, but on the speed, accuracy, nuance, and completeness that users expect. In a short time our search results will actually surpass other engines, both by combatting their ranking algorithm bias, and by indexing a more complete set of the pages on the Web worth reading. Resources Brave Search Premium Brave Search Help Transparency Report Report a security issue Status Products Brave Browser Brave Search Brave Wallet Brave Talk Brave Firewall + VPN Brave Playlist Brave News Brave Rewards Brave Search API Brave Ads Policies Privacy Policy Terms of Use"
year_published = 2025
