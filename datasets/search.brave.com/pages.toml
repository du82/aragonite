["https://search.brave.com/help/rerank"]
title = "Rerank | Brave Search"
description = "Search the Web. Privately. Truly useful results, AI-powered answers, & more. All from an independent index. No profiling, no bias, no Big Tech."
full_description = "Rerank Rerank allows the user to create rules to either raise or discard domains to alter their search ranking algorithm. It can be thought of as light weight Goggles that get applied to all normal searches. These rules can be created using a control panel which opens from top right corner of search results page. How does it work? The rules that the user creates are stored as cookies on users device (see cookies). From these cookies we create an ephemeral Goggle specification on every request and apply it when ranking the search results. Raised domains will receive a bump upwards in the final result set. Discarded domains will not be considered as candidates for the final result set. Privacy considerations We treat Rerank with the same strict provisions we use to handle other data elements (like IP or geo-coordinates) that could serve as identifiers. Brave does not track the queries of any of its users, and using Rerank is no exception. However using a unique set of raise and discard rules could serve as an identifier and enable creation of a profile of the user. Resources Brave Search Premium Brave Search Help Transparency Report Report a security issue Status Products Brave Browser Brave Search Brave Wallet Brave Talk Brave Firewall + VPN Brave Playlist Brave News Brave Rewards Brave Search API Brave Ads Policies Privacy Policy Terms of Use"
