["https://seas.upenn.edu"]
title = "Penn Engineering | Inventing the Future"
description = "Penn Engineering | Inventing the Future"
full_description = "For more than a decade, Penn’s Dan Huh has been developing super-small devices called organs-on-chips that use living cells to stand in for larger organs. In May 2019, a SpaceX Falcon 9 rocket launched two experiments with Huh’s organs-on-chips to the International Space Station. In orbit, a lung chip and bone marrow chip are being compared to Earth-bound counterparts to shed light on astronauts’ susceptibility to infection. Learn More @media(max-width: 767px){ #home_content{ background-image: url('https://www.seas.upenn.edu/wp-content/uploads/2018/09/background-mobile.jpg')!important; } } Inventing the Future Ravi Radhakrishnan Named AIChE Fellow Ravi Radhakrishnan, Professor and Herman P. Schwan Department Chair of Bioengineering (BE) and Professor in Chemical and Biomolecular Engineering (CBE), has been named a Fellow of the American Institute of Chemical Engineers (AIChE). This prestigious honor recognizes his outstanding leadership and research. Read More A Look Inside One uCity Square One uCity Square is a a dynamic space that brings together Penn Engineering, Penn Medicine and a wide range of research centers and startups to advance precision medicine. This fall, Penn Engineering faculty moved into their new labs, where natural light, flexible seating and shared resources drive discovery. Among these researchers are Xue “Sherry” Gao, Noor Momin, Shujie Yang, Claudia Loebel, Michael J. Mitchell, Yihui Shen and Daniel A. Hammer. Read More How Entrepreneurship Transcends Disciplines For someone who’s navigated multiple careers and passions, starting in music, pivoting to tech and now teaching engineering entrepreneurship, Jeffrey Babin, Practice Professor in Mechanical Engineering and Applied Mechanics (MEAM), is quick to stress that his career path has been anything but linear. Yet, looking back, it’s clear that each step, each shift, has played a role in shaping the educator and mentor he is today. Read More A Brighter, Greener Future The Vagelos Laboratory for Energy Science and Technology is a newly dedicated, $173 million cutting-edge facility designed to propel interdisciplinary research and house the Vagelos Integrated Program in Energy Research (VIPER), an undergraduate dual-degree program run jointly by the School of Arts & Sciences and the School of Engineering and Applied Science (SEAS). Read More Dean Vijay Kumar Honored with John Scott Award Congratulations to Vijay Kumar, Penn Engineering’s Nemirovsky Family Dean, for receiving the prestigious 2024 John Scott Award. Recognized for his robotics and drone technology work, Dean Kumar draws inspiration from nature to create systems that collaborate and innovate. Read More News Eco-Friendly Rare Earth Element Separation: A Bioinspired Solution to an Industry Challenge 02.26.2025 | Read MoreStentix Wins 2025 Y-Prize Competition 02.21.2025 | Read MoreRavi Radhakrishnan Named AIChE Fellow 02.20.2025 | Read More View More Events ESE Spring Seminar – “Versatile RF Interconnects and Electronics for Extreme Environment Sensing and Communications” Event DetailsMEAM Seminar: “Engineering Soft Medical Robots and Devices to Solve Hard Health Problems in Extreme Body Environments” Event DetailsASSET Seminar: “From Data to Insights: Trustworthy Solutions for Imaging Problems” Event Details View More About Penn Engineering At Penn Engineering, we are preparing the next generation of innovative engineers, entrepreneurs and leaders. Our unique culture of cooperation and teamwork, emphasis on research, and dedicated faculty advisors who teach as well as mentor, provide the ideal environment for the intellectual growth and development of well-rounded global citizens. Learn More"
