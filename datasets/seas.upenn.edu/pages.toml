["https://www.seas.upenn.edu/about/board-of-advisors"]
title = "Advisory Boards"
description = "Advisory Boards"
full_description = "Mr. Robert Stavis (EAS’84, W’84) Chair, Penn Engineering Board of Advisors Partner, Bessemer Venture Partners “My Penn Engineering education taught me how to ask well-structured questions and to fundamentally understand how systems work. As a member of the Penn Engineering Board of Advisors, I am proud to support and help guide the focus of the strategic research goals and curricula in the School. I credit Penn with a lot of my success, and I’m excited to give back as a Penn volunteer. In today’s world, when engineering is ever more important, Penn Engineering continues to lead on global challenges through research and education of our future engineering talent.” The Board of Advisors for the School of Engineering and Applied Science is the main advisory body to the School and its Dean. Its members are thought leaders, innovators, and experts in the engineering profession and areas of relevance to the School’s activities. They participate in the strategic planning process, serve as a sounding board for initiatives of the School, represent the School within the rest of the University and the larger engineering and corporate community, and act as a liaison between the School and the Board of Trustees of the University. Their support and guidance plays an important role in furthering the School’s strategic goals. Board members serve a three-year, renewable term. Mr. Peter N. Detkin, Esq. (EE’82, L’85), Founder, Intellectual Ventures; Managing Director, Sherpa Technology Group Ms. Pooja Goyal (ENG’02, W’02), Partner and Chief Investment Officer, Carlyle Global Infrastructure Mr. Ryan D. Limaye (ENG’93, W’93, WG’93), Managing Director and Co-Head, Global Technology Investment Banking, Goldman Sachs Mr. Mitchell I. Quain (EE’73), Penn Engineering Advisory Board Chair Emeritus; Senior Advisor, Carlyle Group Mr. Andrew Rachleff (W’80), Penn Engineering Advisory Board Chair Emeritus; Executive Chairman, Wealthfront, Inc. We are living in an era of transformative changes fueled by an explosion in technology. Penn Engineering has a unique opportunity to take the lead and dramatically expand the School’s capacity to foster innovation and game-changing research. The Technical Advisory Board is made up of experts that include innovators from both startups and corporations, venture capitalists, thought leaders in industry and entrepreneurs that can help position Penn Engineering as the leader in this space over the next decade."
year_published = 2025
