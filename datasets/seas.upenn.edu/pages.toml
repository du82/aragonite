["https://www.seas.upenn.edu/academic-departments"]
title = "Departments"
description = "Departments"
full_description = "Penn Engineering is home to one of the oldest and most successful bioengineering departments in the United States, with undergraduate and graduate programs consistently ranking among the top 10 in the country. BE capitalizes on Penn’s great institutional strengths, including a compact urban campus of 12 separate schools, geographic proximity linking the engineering and medical schools within one city block, and a collaborative, integrated environment that allows students and faculty to transcend disciplines with curricula, research, technology, and patient care. More than 80 percent of our undergraduates perform independent research, and our graduate students publish their work in the most prestigious scientific journals. Our graduates form a vast global alumni network at companies, health centers, government agencies, and colleges and universities. Penn Engineering has the oldest continuously operating degree-granting program in chemical engineering. Since its inception in 1893, we have been expanding the frontiers of knowledge in the field. CBE is renowned for the caliber of both our undergraduate and graduate educational programs, and we are absolutely committed to preparing our students for leadership roles in the biological, chemical, pharmaceutical, and electronics industries. Our department is widely recognized for the excellence of our faculty’s research programs, which are in areas including soft materials, molecular and cellular biophysics, materials simulation and advanced methods of energy conversion, as well as more traditional areas of chemical engineering, including transport phenomena and process design. Penn Engineering is the birthplace of the modern computer. It was here that ENIAC, the world’s first electronic, large-scale, general-purpose digital computer, was developed in 1946. For over 70 years, the field of computer science at Penn has been marked by exciting innovations. While the field has always had strong connections with many other disciplines such as mathematics, electrical engineering, biology, economics, linguistics and philosophy among others, it appears that every other academic discipline is starting to build a relationship to computer science. Our faculty have research activities across many areas of computer science, including intelligent systems, information systems, hardware and software systems, networks and theory."
