["https://www.seas.upenn.edu/about/school-leadership"]
title = "School Leadership"
description = "School Leadership"
full_description = "Since 2015, Vijay Kumar has served as the Nemirovsky Family Dean of Penn Engineering. He holds appointments in the Departments of Mechanical Engineering and Applied Mechanics, Computer and Information Science, and Electrical and Systems Engineering. Kumar has held many administrative positions in the School of Engineering and Applied Science, including director of the GRASP Laboratory, chair of Mechanical Engineering and Applied Mechanics, and the position of the Deputy Dean. He served as the assistant director of robotics and cyber physical systems at the White House Office of Science and Technology Policy. Kumar is a fellow of ASME and IEEE and has been elected to the National Academy of Engineering, American Philosophical Society, and the American Academy of Arts and Sciences. He is the founder of Exyn Technologies, an advisor to Treeswift, and serves on the board of WeRobotics and O2Micro. PENN ENGINEERING ©2017 | UNIVERSITY OF PENNSYLVANIA | SCHOOL OF ENGINEERING AND APPLIED SCIENCE 220 South 33rd Street | 107 Towne Building | Philadelphia, PA 19104-6391 | 215-898-7246 Contact us with questions about admissions or academic programs | For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
