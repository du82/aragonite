["https://www.seas.upenn.edu/student-life-and-wellness"]
title = "Student Life and Wellness"
description = "Student Life and Wellness"
full_description = "Penn Engineering’s unique approach to undergraduate education fosters student success. In addition to promoting student participation in research, collaboration within peer groups and global learning experiences, the School also stresses a well-rounded university experience. Students are strongly encouraged to pursue extracurricular activities, whether in athletics or other clubs, organizations and student activities. Being an engineering student in a high-caliber, Ivy League school is a rigorous experience, and having activities and friends from across all schools and disciplines at Penn is an important way to remain grounded. Upon matriculation, students are assigned a dedicated faculty advisor to serve as an academic guide and mentor. This advisor collaborates in not only the success of a student’s academic career at Penn, but can also connect students to resources for needs that go beyond the academic. Staff advising is also available during regularly scheduled advising hours in the School. Guiding the process for advising, student life and wellness in the School is the Penn Engineering Wellness Team, which works to ensure that faculty and staff advisors are up-to-date on University resources and opportunities for students. PENN ENGINEERING ©2017 | UNIVERSITY OF PENNSYLVANIA | SCHOOL OF ENGINEERING AND APPLIED SCIENCE 220 South 33rd Street | 107 Towne Building | Philadelphia, PA 19104-6391 | 215-898-7246 Contact us with questions about admissions or academic programs | For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
