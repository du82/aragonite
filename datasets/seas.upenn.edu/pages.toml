title = "Penn Engineering Endowed Professorships"
description = "Penn Engineering Endowed Professorships"
full_description = "A scholarly professorship, or named faculty position, is one of the highest honors a faculty member can receive from an academic institution. Such an appointment increases a faculty member’s distinction and validates the individual’s work, elevating their influence at Penn and beyond. In Fiscal Year 2024, Penn Engineering appointed the inaugural recipients of three recently established scholarly professorships in addition to the full list below. Pictured to the far left is Cherie Kagan, Stephen J. Angello Professor of Electrical and Systems Engineering, Chemistry, and Materials Science and Engineering (MSE); and Chris Murray (second from right), Richard Perry University Professor, Chemistry and MSE Adani President’s Distinguished Professor: Zachary Ives AMA Family Assistant Professor: Ottman A Tertuliano Stephen J. Angello Professor: Cherie Kagan Peter and Susanne Armstrong Distinguished Scholar: Deep Jariwala Robert D. Bent Professor: Dennis E. Discher Robert D. Bent Professor of Engineering: Eric Stach Boileau Professor of Electrical Engineering: André Dehon Joseph Bordogna Professor: Shu Yang Jonathan and Linda Brassington Practice Professor: Vanessa Z. Chan Solomon and Sylvia G. Charp Professor of Electrical and Systems Engineering: Alejandro Ribeiro David L. Cohen University Professor: Kevin B. Johnson ENIAC President’s Distinguished Professor: Stephanie Weirich Alfred G. and Meta A. Ennis Professor: Daniel A. Hammer Richard H. & S. L. Gabel Professor of Mechanical Engineering: Haim H. Bau William K. Gemmill Term Assistant Professor of Mechanical Engineering: Samantha McBride Eduardo D. Glandt Distinguished Professor: Dan Roth Eduardo D. Glandt Distinguished Scholar: Paulo Arratia Eduardo D. Glandt Presidential Professor: Chinedum Osuji Eduardo D. Glandt President’s Distinguished Professor: Vivek Shenoy Eduardo D. Glandt President’s Distinguished Professor: Beth A. Winkelstein Eduardo D. Glandt Faculty Fellow: Jing (Jane) Li Richer & Elizabe