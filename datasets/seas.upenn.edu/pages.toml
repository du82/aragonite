["https://www.seas.upenn.edu/about/strategic-plan"]
title = "Strategic Plan"
description = "Strategic Plan"
full_description = "The School of Engineering and Applied Science at the University of Pennsylvania is well positioned to address current global challenges. Guided by In Principle and Practice, Penn’s strategic framework, Penn Engineering will leverage and build on its foundation of excellence to be a leader in the profession. Resting on a proud history of innovation and firsts, Penn Engineering is also unique among its peers: It has strong academic and research ties with the 11 other schools at Penn, and it is situated in close physical proximity on a single urban campus. The resulting cross-pollination gives the School exclusive interdisciplinary strengths and sustains a culture of transdisciplinary collaboration. In addition, collaborations and startups are conceived and enhanced by access to top industry partners and institutions in Philadelphia and the region, as well as other hubs on the East Coast, producing real-world results. Guided by In Principle and Practice, Penn’s strategic framework, Penn Engineering will leverage and build on its foundation of excellence to be a leader in the profession. As a leader in education and research, Penn Engineering seeks a balance between the creation of knowledge and the translation of research into practice. Accordingly, our mission has two facets: Penn Engineering’s central guiding principle is to attract the best talent in students and faculty, from diverse backgrounds and perspectives, to expand the frontiers of knowledge, to catalyze the translation of research to practice and to educate the next generation of responsible innovators, all in service of addressing the key challenges facing our world. Inspired by the vision of our founder, Benjamin Franklin, Penn Engineering advances scientific discovery, innovation and opportunity for all. In doing so, we embrace the following shared values: Technology is essential to confronting the grand challenges faced by human civilization. Penn Engineering will become a catalyst for innovation by addressing challenges in areas as diverse as human health, climate, energy, food, urban infrastructure and education."
