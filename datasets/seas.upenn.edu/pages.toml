["https://www.seas.upenn.edu/admissions"]
title = "Admissions"
full_description = "At Penn Engineering, we are preparing the next generation of engineers, entrepreneurs and leaders. Our unique culture of cooperation and teamwork, emphasis on research, and dedicated faculty who mentor as well as teach, provide the ideal environment for the intellectual growth and development of well-rounded global citizens. Since its founding by Benjamin Franklin, America’s “first engineer,” The University of Pennsylvania, a world-class Ivy League institution, has fulfilled his vision of providing an education that is both “useful and ornamental.” For over 150 years, Penn Engineering has been a vibrant and collaborative community of innovation. Two key elements distinguish the Penn Engineering undergraduate experience from that provided by many other institutions: exceptional academic programs, and practical design and research experience. Our undergraduate programs emphasize both theory and practice while forming intellectual linkages across a breadth of disciplines. The opportunity for hands-on research, over the four years, allows undergraduates the opportunity to learn about the creation of knowledge and delve more deeply into their chosen fields, becoming collaborators in the search for knowledge. Research and education form the creative graduate mission of Penn Engineering. The excitement and discovery of research is open to all students and is the keystone of our world-renowned doctoral programs. These programs are augmented by a diverse array of master’s degree offerings that include terminal degrees in several areas. Our collaborative research and learning environment truly distinguishes us from our peers. Students work with and learn from faculty mentors within the core disciplinary programs as well as through scholarly interactions involving the Schools of Medicine, Law, Design, Arts and Sciences, and The Wharton School of Business. This environment is further enriched by Penn’s many cross-disciplinary institutes, centers, and laboratories."
