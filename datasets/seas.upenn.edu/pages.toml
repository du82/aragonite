["https://www.seas.upenn.edu/opportunities-for-global-learning"]
title = "Global Learning"
description = "Global Learning"
full_description = "At Penn Engineering, we prepare our students to be well-rounded, global citizens. Gaining experience in an international setting is something that all students are strongly encouraged to pursue. Through various options, students have ample opportunities to spend time abroad, learning to see the world from a different perspective and developing engineering skills in a hands-on way. Opportunities for global learning experiences include: By spending a semester or even a year abroad, students have months of time to study and explore their host country. Classes are taken abroad for credit that can be used toward course requirements at Penn. Penn Engineering provides unique resources for engineering students who wish to study abroad. Penn Engineering maintains a vast network of collaborations with institutions and companies around the world. Opportunities for undergraduates are available during the summer to pursue hands-on research experiences and internships with one of Penn Engineering’s partner institutions abroad. PENN ENGINEERING ©2017 | UNIVERSITY OF PENNSYLVANIA | SCHOOL OF ENGINEERING AND APPLIED SCIENCE 220 South 33rd Street | 107 Towne Building | Philadelphia, PA 19104-6391 | 215-898-7246 Contact us with questions about admissions or academic programs | For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
