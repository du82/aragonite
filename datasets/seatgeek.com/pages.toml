["https://seatgeek.com/about"]
title = "Learn More About Us | SeatGeek"
description = "Buy and sell concert tickets, sports tickets, theater tickets and find other events near you on SeatGeek!"
full_description = 'With our technological savvy and fan-first attitude, we’re simplifying and modernizing the ticketing industry. We make it easy for fans to buy tickets and attend events through industry-first features like Deal Score, our ticket-rating technology, and Rally, our event experience platform. These features and more have made us the highest rated and most trusted ticketer. Our enterprise ticketing software allows teams, venues and shows to efficiently grow their businesses while delivering the superior experience that all fans deserve. We’re proud to partner with some of the most recognized names in the world across sports and entertainment since launching in 2016. Fan of Cleveland sports teams, believer that technology is truly a force for good and dog dad to Turtle Defender of New Jersey and its sports teams and believer that live events will be better when ticketing gives more than it takes “In five years, if we all build this right, then there’s no reason for a seat to be empty at a live event. There’s no reason for people to not go to events - it’s seamless, on-demand and as easy as going out to dinner. And then when you’re there it’s more interactive, dynamic and personalized, allowing you to focus more on the magic and each other than the logistics.” "Net Promoter Score" (NPS) is based on a customer research survey of of 5,403 consumers conducted by Qualtrics on behalf of SeatGeek in June, 2024.'
