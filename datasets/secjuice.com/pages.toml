full_description = '''HTB Support Walkthrough Observe how to use Rubeus to break into an Active Directory server. Andy74 Sep 2, 2024 • 36 min read This image was generated using Microsoft Copilot. Windows machines are always very interesting to investigate because they have specific attacks that clearly stand out from Linux machines. Sometimes the solution to identifying their attacks is at your fingertips, but choosing the right method to arrive at the answer takes a lot more time than expected. Thus, a lot of time was wasted on finding the solution to this machine towards the end when I already had the solution right at my fingertips. Nonetheless, the fun was certainly not lacking.As usually happens on a Windows machine, the nmap scan reveals a myriad of open ports.Starting Nmap 7.92 ( https://nmap.org ) at 2022-08-28 11:30 CEST Nmap scan report for 10.10.11.174 Host is up (0.11s latency). Not shown: 989 filtered tcp ports (no-response) PORT STATE SERVICE VERSION 53/tcp open domain Simple DNS Plus 88/tcp open kerberos-sec Microsoft Windows Kerberos (server time: 2022-08-28 09:13:39Z) 135/tcp open msrpc Microsoft Windows RPC 139/tcp open netbios-ssn Microsoft Windows netbios-ssn 389/tcp open ldap Microsoft Windows Active Directory LDAP (Domain: support.htb0., Site: Default-First-Site-Name) 445/tcp open microsoft-ds? 464/tcp open kpasswd5? 593/tcp open ncacn_http Microsoft Windows RPC over HTTP 1.0 636/tcp open tcpwrapped 3268/tcp open ldap Microsoft Windows Active Directory LDAP (Domain: support.htb0., Site: Default-First-Site-Name) 3269/tcp open tcpwrapped Service Info: Host: DC; OS: Windows; CPE: cpe:/o:microsoft:windows Host script results: |_clock-skew: -17m25s | smb2-time: | date: 2022-08-28T09:13:46 |_ start_date: N/A | smb2-security-mode: | 3.1.1: |_ Message signing enabled and required Service detection performed. Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1 IP address (1 host up) scanned in 75.97 secondsStart to analyze them all and try to find out what they hide, but first of all insert the htb domain for this BOX (support.htb) in our /etc/hosts file.Port 53 - DNSThere is a DNS server on this port, so we can query it for the base records registered within it.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox/_10.10.11.174 - Support (win)] └─$ dig version.bind CHAOS TXT @10.10.11.174 ; <<>> DiG 9.18.4-2-Debian <<>> version.bind CHAOS TXT @10.10.11.174 ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOTIMP, id: 59086 ;; flags: qr rd; QUERY: 1, ANSWER: 0, AUTHORITY: 0, ADDITIONAL: 1 ;; WARNING: recursion requested but not available ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 1232 ; COOKIE: 674839c2a602b51c (echoed) ;; QUESTION SECTION: ;version.bind. CH TXT ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (UDP) ;; WHEN: Sun Aug 28 11:34:30 CEST 2022 ;; MSG SIZE rcvd: 53Nothing so interesting; let's go a little deeper and scan and interrogate the service on all the records. I recently "played" on another BOX Windows, and I had prepared a little script sh that did just this thing; let's take it back and modify it ad hoc for this specific scenario.┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.174 - Support (win)/attack/dns] └─$ cat scan.sh dig ANY @10.10.11.174 support.htb #Any information dig A @10.10.11.174 support.htb #Regular DNS request dig AAAA @10.10.11.174 support.htb #IPv6 DNS request dig TXT @10.10.11.174 support.htb #Informaeion dig MX @10.10.11.174 support.htb #Emails related dig NS @10.10.11.174 support.htb #DNS that resolves that name dig -x 10.10.11.174 @10.10.11.174 #Reverse lookup ┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.174 - Support (win)/attack/dns] └─$ ./scan.sh ; <<>> DiG 9.18.4-2-Debian <<>> ANY @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 23563 ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 3, AUTHORITY: 0, ADDITIONAL: 2 ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 4000 ;; QUESTION SECTION: ;support.htb. IN ANY ;; ANSWER SECTION: support.htb. 600 IN A 10.10.11.174 support.htb. 3600 IN NS dc.support.htb. support.htb. 3600 IN SOA dc.support.htb. hostmaster.support.htb. 105 900 600 86400 3600 ;; ADDITIONAL SECTION: dc.support.htb. 3600 IN A 10.10.11.174 ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (TCP) ;; WHEN: Sun Aug 28 11:46:39 CEST 2022 ;; MSG SIZE rcvd: 136 ; <<>> DiG 9.18.4-2-Debian <<>> A @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 18114 ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1 ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 4000 ;; QUESTION SECTION: ;support.htb. IN A ;; ANSWER SECTION: support.htb. 600 IN A 10.10.11.174 ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (UDP) ;; WHEN: Sun Aug 28 11:46:39 CEST 2022 ;; MSG SIZE rcvd: 56 ; <<>> DiG 9.18.4-2-Debian <<>> AAAA @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 38798 ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 0, AUTHORITY: 1, ADDITIONAL: 1 ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 4000 ;; QUESTION SECTION: ;support.htb. IN AAAA ;; AUTHORITY SECTION: support.htb. 3600 IN SOA dc.support.htb. hostmaster.support.htb. 105 900 600 86400 3600 ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (UDP) ;; WHEN: Sun Aug 28 11:46:39 CEST 2022 ;; MSG SIZE rcvd: 90 ; <<>> DiG 9.18.4-2-Debian <<>> TXT @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 14509 ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 0, AUTHORITY: 1, ADDITIONAL: 1 ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 4000 ;; QUESTION SECTION: ;support.htb. IN TXT ;; AUTHORITY SECTION: support.htb. 3600 IN SOA dc.support.htb. hostmaster.support.htb. 105 900 600 86400 3600 ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (UDP) ;; WHEN: Sun Aug 28 11:46:39 CEST 2022 ;; MSG SIZE rcvd: 90 ; <<>> DiG 9.18.4-2-Debian <<>> MX @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 15656 ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 0, AUTHORITY: 1, ADDITIONAL: 1 ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 4000 ;; QUESTION SECTION: ;support.htb. IN MX ;; AUTHORITY SECTION: support.htb. 3600 IN SOA dc.support.htb. hostmaster.support.htb. 105 900 600 86400 3600 ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (UDP) ;; WHEN: Sun Aug 28 11:46:39 CEST 2022 ;; MSG SIZE rcvd: 90 ; <<>> DiG 9.18.4-2-Debian <<>> NS @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ;; Got answer: ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 25546 ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 2 ;; OPT PSEUDOSECTION: ; EDNS: version: 0, flags:; udp: 4000 ;; QUESTION SECTION: ;support.htb. IN NS ;; ANSWER SECTION: support.htb. 3600 IN NS dc.support.htb. ;; ADDITIONAL SECTION: dc.support.htb. 3600 IN A 10.10.11.174 ;; Query time: 108 msec ;; SERVER: 10.10.11.174#53(10.10.11.174) (UDP) ;; WHEN: Sun Aug 28 11:46:39 CEST 2022 ;; MSG SIZE rcvd: 73 ; <<>> DiG 9.18.4-2-Debian <<>> -x 10.10.11.174 @10.10.11.174 ;; global options: +cmd ;; connection timed out; no servers could be reachedApart from a "dc.support.htb" (which we are going to insert in the /etc/hosts file), nothing is useful (we ignore hostmaster.support.htb, it is often found on DNS windows). Let's check the transfer zones now.┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.174 - Support (win)/attack/dns] └─$ dig axfr @10.10.11.174 ; <<>> DiG 9.18.4-2-Debian <<>> axfr @10.10.11.174 ; (1 server found) ;; global options: +cmd ;; connection timed out; no servers could be reached ┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.174 - Support (win)/attack/dns] └─$ dig axfr @10.10.11.174 support.htb 9 ⨯ ; <<>> DiG 9.18.4-2-Debian <<>> axfr @10.10.11.174 support.htb ; (1 server found) ;; global options: +cmd ; Transfer failed. ┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.174 - Support (win)/attack/dns] └─$ fierce --domain support.htb --dns-servers 10.10.11.174 NS: dc.support.htb. SOA: dc.support.htb. (10.10.11.174) Zone: failure Wildcard: failure Found: dc.support.htb. (10.10.11.174) Found: management.support.htb. (10.10.10.4)I was hoping for something more, perhaps management.support.htb. It might be interesting, but not that much. We are left with a brute-force approach to reverse DNS.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ dnsrecon -r 127.0.0.0/24 -n 10.10.11.174 [*] Performing Reverse Lookup from 127.0.0.0 to 127.0.0.255 [+] PTR localhost 127.0.0.1 [+] 1 Records Found ┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ dnsrecon -r 127.0.0.0/32 -n 10.10.11.174 130 ⨯ [*] Performing Reverse Lookup from 127.0.0.0 to 127.0.0.0 [+] 0 Records Found ┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ dnsrecon -d support.htb -a -n 10.10.11.174 [*] std: Performing General Enumeration against: support.htb... [*] Checking for Zone Transfer for support.htb name servers [*] Resolving SOA Record [+] SOA dc.support.htb 10.10.11.174 [*] Resolving NS Records [*] NS Servers found: [+] NS dc.support.htb 10.10.11.174 [*] Removing any duplicate NS server IP Addresses... [*] [*] Trying NS server 10.10.11.174 [+] 10.10.11.174 Has port 53 TCP Open [-] Zone Transfer Failed (Zone transfer error: REFUSED) [*] Checking for Zone Transfer for support.htb name servers [*] Resolving SOA Record [+] SOA dc.support.htb 10.10.11.174 [*] Resolving NS Records [*] NS Servers found: [+] NS dc.support.htb 10.10.11.174 [*] Removing any duplicate NS server IP Addresses... [*] [*] Trying NS server 10.10.11.174 [+] 10.10.11.174 Has port 53 TCP Open [-] Zone Transfer Failed (Zone transfer error: REFUSED) [-] A timeout error occurred please make sure you can reach the target DNS Servers [-] directly and requests are not being filtered. Increase the timeout from 3.0 second [-] to a higher number with --lifetime <time> option.And again, a small hole in the water.135, 593 - MSRPCFor the Microsoft Remote Procedure Call (MSRPC) protocol, there are only a few tools to use. Normally, you can proceed with a rpcdump (which gives us a lot of information, but in this case nothing worthy of attention) and with the Metasploit Framework (which has the same effect as the previous tool).139, 445 - SMBThere are many possibilities on the SAMBA protocol instead, which is normally the point of attack of a Windows machine.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ nbtscan -r 10.10.11.174/32 Doing NBT name scan for addresses from 10.10.11.174/32 IP address NetBIOS Name Server User MAC address ------------------------------------------------------------------------------It doesn't seem to start very well, though.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ enum4linux -a 10.10.11.174 Starting enum4linux v0.9.1 ( http://labs.portcullis.co.uk/application/enum4linux/ ) on Sun Aug 28 12:23:49 2022 [...] ===================================( Session Check on 10.10.11.174 )=================================== [+] Server 10.10.11.174 allows sessions using username '', password '' ================================( Getting domain SID for 10.10.11.174 )================================ Domain Name: SUPPORT Domain Sid: S-1-5-21-1677581083-3380853377-188903654 [+] Host is part of a domain (not a workgroup) [...] ============================( Password Policy Information for 10.10.11.174 )============================ [E] Unexpected error from polenum: [+] Attaching to 10.10.11.174 using a NULL share [+] Trying protocol 139/SMB... [!] Protocol failed: Cannot request session (Called Name:10.10.11.174) [+] Trying protocol 445/SMB... [!] Protocol failed: SAMR SessionError: code: 0xc0000022 - STATUS_ACCESS_DENIED - {Access Denied} A process has requested access to an object but has not been granted those access rights. [E] Failed to get password policy with rpcclient [...]Damn. I really would have hoped for something more. Let's try to connect and query the service from the inside.┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.174 - Support (win)/attack/smb] └─$ rpcclient -U "" -N 10.10.11.174 rpcclient $> lsaquery Domain Name: SUPPORT Domain Sid: S-1-5-21-1677581083-3380853377-188903654 rpcclient $> enumprivs found 35 privileges SeCreateTokenPrivilege 0:2 (0x0:0x2) SeAssignPrimaryTokenPrivilege 0:3 (0x0:0x3) SeLockMemoryPrivilege 0:4 (0x0:0x4) SeIncreaseQuotaPrivilege 0:5 (0x0:0x5) SeMachineAccountPrivilege 0:6 (0x0:0x6) SeTcbPrivilege 0:7 (0x0:0x7) SeSecurityPrivilege 0:8 (0x0:0x8) SeTakeOwnershipPrivilege 0:9 (0x0:0x9) SeLoadDriverPrivilege 0:10 (0x0:0xa) SeSystemProfilePrivilege 0:11 (0x0:0xb) SeSystemtimePrivilege 0:12 (0x0:0xc) SeProfileSingleProcessPrivilege 0:13 (0x0:0xd) SeIncreaseBasePriorityPrivilege 0:14 (0x0:0xe) SeCreatePagefilePrivilege 0:15 (0x0:0xf) SeCreatePermanentPrivilege 0:16 (0x0:0x10) SeBackupPrivilege 0:17 (0x0:0x11) SeRestorePrivilege 0:18 (0x0:0x12) SeShutdownPrivilege 0:19 (0x0:0x13) SeDebugPrivilege 0:20 (0x0:0x14) SeAuditPrivilege 0:21 (0x0:0x15) SeSystemEnvironmentPrivilege 0:22 (0x0:0x16) SeChangeNotifyPrivilege 0:23 (0x0:0x17) SeRemoteShutdownPrivilege 0:24 (0x0:0x18) SeUndockPrivilege 0:25 (0x0:0x19) SeSyncAgentPrivilege 0:26 (0x0:0x1a) SeEnableDelegationPrivilege 0:27 (0x0:0x1b) SeManageVolumePrivilege 0:28 (0x0:0x1c) SeImpersonatePrivilege 0:29 (0x0:0x1d) SeCreateGlobalPrivilege 0:30 (0x0:0x1e) SeTrustedCredManAccessPrivilege 0:31 (0x0:0x1f) SeRelabelPrivilege 0:32 (0x0:0x20) SeIncreaseWorkingSetPrivilege 0:33 (0x0:0x21) SeTimeZonePrivilege 0:34 (0x0:0x22) SeCreateSymbolicLinkPrivilege 0:35 (0x0:0x23) SeDelegateSessionUserImpersonatePrivilege 0:36 (0x0:0x24) [...] rpcclient $> dsr_getdcname support.htb DsGetDcName gave: info: struct netr_DsRGetDCNameInfo dc_unc : * dc_unc : '\\dc.support.htb' dc_address : * dc_address : '\\10.10.11.174' dc_address_type : DS_ADDRESS_TYPE_INET (1) domain_guid : 553cd9a3-86c4-4d64-9e85-5146a98c868e domain_name : * domain_name : 'support.htb' forest_name : * forest_name : 'support.htb' dc_flags : 0xe003f3fd (3758355453) 1: DS_SERVER_PDC 1: DS_SERVER_GC 1: DS_SERVER_LDAP 1: DS_SERVER_DS 1: DS_SERVER_KDC 1: DS_SERVER_TIMESERV 1: DS_SERVER_CLOSEST 1: DS_SERVER_WRITABLE 1: DS_SERVER_GOOD_TIMESERV 0: DS_SERVER_NDNC 0: DS_SERVER_SELECT_SECRET_DOMAIN_6 1: DS_SERVER_FULL_SECRET_DOMAIN_6 1: DS_SERVER_WEBSERV 1: DS_SERVER_DS_8 1: DS_SERVER_DS_9 1: DS_SERVER_DS_10 1: DS_DNS_CONTROLLER 1: DS_DNS_DOMAIN 1: DS_DNS_FOREST_ROOT dc_site_name : * dc_site_name : 'Default-First-Site-Name' client_site_name : * client_site_name : 'Default-First-Site-Name' [...] rpcclient $> dsr_getsitename dc.support.htb Computer dc.support.htb is on Site: Default-'''
