["https://secjuice.com/ethereum-reboots-crypto-investigation"]
title = "Ethereum Reboots Crypto Investigation"
description = "The smart blockchain created a crypto ecosystem of NFTs, DeFi, and Dapps, along with new kinds of investigations."
full_description = 'OSINT Ethereum Reboots Crypto Investigation The smart blockchain created a crypto ecosystem of NFTs, DeFi, and Dapps, along with new kinds of investigations. Tom Caliendo Aug 31, 2024 • 7 min read At the risk of using and overused phrase, the Ethereum Blockchain "revolutionized crypto" by also being a virtual computer that can execute code. Ethereum gave us smart contracts and the ability to create NFTs, DeFi and so much else.In turn, this opened up a whole new world of opportunities for investigation. For crypto investigators, this is arguably akin to the change in OSINT before and after social media. This post walks through some foundational aspects of investigations on the Ethereum Blockchain, including researching an Ethereum address, smart contracts, and NFTs.Etherscan.io and Ethereum Address ResearchStarting at the Etherscan.io main page, you can search an address in its search function and pull up a profile page for the address.At the top of the page we see the address’s Eth balance, the token holdings, and on the right under “Multi Chain,” it shows that the address is used (by the same owner) on 11 different block chains.Under token holdings, we see the address holds $4,547 worth of tokens, with six kinds of tokens. Clicking the pulldown menu shows the 6 kinds of tokens, including NFTs and ERC-20 tokens. This is a more complicated subject, but basically ERC-20 tokens are used to represent other cryptocurrencies on the Ethereum block chain. Returning to the “Multi Chain“ section on the right side, you can click on “Blockscan” to pull up more detailed information on the address’s presence on other blockchains. This opens a page on Blockscan.com showing each block chain with the address and a link to blockchain explorers for each of those chains. The links open the specific address’s profile page with each blockchain explorer website.There is also a tab showing all of the address’s transactions on each blockchain mixed together in chronological order.Back to the main address page on etherscan.io. Lower down is a list of previous transactions. Ether transactions are identified under the “Transactions” tabSmart ContractsA smart contract is essentially an that works on the Ethereum blockchain. independent automated contract. Officially defined as a digital contract written as a piece of code, stored on the blockchain, and automatically executed when certain pre-established conditions are met.Each token has its own smart contract which is on the Ethereum blockchain. These contracts are often used as the foundation for additional contracts using the same token.Smart contracts are written in a programming code called Solidity, and when a transaction calls a contract it calls a function from the code.A contract written to the blockchain cannot be changed, so a proxy contract allows updates to be done while keeping the first contract the same. The foundational contracts have functions or actions that can be called upon by subsequent smart contracts for the same token.People and contracts can both create additional contracts. The new contract will have a profile page that identifies the original contract’s address and list it as the “Parent Address”.Transaction with Smart Contract in ItThis is what a token (in this case, an NFT) purchase transaction looks like on etherscan.io, it shows someone’s Ethereum address (“Ox7…”) interact with the smart contract used for this specific token/NFTYou see the term “From” twice. On top, the “From” refers to the Token buyer’s Ethereum address. The second usage of “From” (in the sections “ERC-1155 Tokens Transferred:”), the From address is the seller of the NFT.Investigating Smart ContractsInvestigate a contract by looking at the Read and the Write section to see the functions / methods available.If you pull up a contract in etherscan.io you can see every time it has been called by a transaction.When a transaction calls a contract it calls a function from the code which we can see in the transactions list of the address.Some basic questions to ask when investigating a smart contract are, Who owns this contract? What does the contract do? What are the Total Assets? Who is the ultimate owner / the parent address?Whenever you are looking at a contract address page in etherscan.io, you will see the parent address listed on the same page. Keeping going up through tree of creators until you reach an address that isn’t a contract, this is the owner or creator. That is an address to a investigate. Also, when you are looking for the “parent contract,” Google the different contract addresses to see if they have names, especially the parent contract.Search “similar” contracts (click on contract in the contract’s address page and then on the right side click where it says “more options” and choose “similar”) can be useful when you are looking at a scam contract and want to find others.“Liquidity Pools” (check smart contracts for the method “addLiquidity”) you make a deposit into a liquidity pool and then a 2nd person swaps Ethereum for token or vice versa with a 3rd person and there is a fee charged from that transaction. You will then make money from your deposit that is being transferred.Non Fungible TokensThere are some basic research methods for a Non-Fungible Token (NFT).This will avoid the deeper questions of what is an NFT. So for now we’ll use the gross oversimplification of describing an NFT as a picture with a unique ID that people buy and sell with cryptocurrency.SIDE NOTE: A slightly less oversimplified explanation would be to say that an NFT is a unique digital asset stored on a blockchain that represents ownership or proof of authenticity of a specific item, such as art, music, or virtual real estate. Unlike cryptocurrencies like Bitcoin, NFTs are indivisible and cannot be exchanged on a one-to-one basis, making each token distinct and valuable in its own right. Let’s get started.For the sake of this example, let’s start with the NFT’s Token ID (a long string that is the NFT’s unique identifier). Here is a Token ID:9961498451080298818169728249433222030914980129654055269747476883220178403329Start at opensea.io (OpenSea is a marketplace for NFTs, other marketplaces include SuperRare, and Rarible)Generally, you can use Opensea by simply entering a search term, including Items, collections, or account names, into the search bar and hit enter.The results will have collections appearing at the top and there are filters on the left-hand of the page to narrow results.Clicking on a Collection result will take investigators to the NFTs listed in that collection.From there you can click on a specific NFT will show the current and historic valuation and transaction history for that NFT, often including the name of the buyer.Here is a walkthrough for a specific ID. We can search the ID directly in the search bar to find the NFT.Click on the NFT and go to its profile page.From the profile page you can look up a lot of information. Notable details include the current owner, the NFT’s history (creation, who sold it to who, etc), and it’s smart contract (which is basically an automatic contract, more below).In the screenshot above you see it says “Owned by 160602”. This is the owner and you can click on the their ID number to go to a page with info on them. At the least you’ll see their activity but there might be other identifying information too.Back to the NFT profile, the section “Item Activity” gives the history including creation and sales.Under the “Details” section you find the contract address for the NFT’s smart contract .The smart contract ID will be linked to the second useful website, etherscan.ioClick on the contract link and you’ll be brought here:Some other useful tools to include:1- Non Fungible – https://nonfungible.com/ - is an NFT database that enables investigators to locate, analyze, and track digital asset transactions.To use Non Fungible, hit the magnifying glass button in the top right corner and enter a collection name.Non Fungible will provide sales details in relation to the searched collection2- Zapper - http://zapper.fi/ - serves as a comprehensive DeFi asset management platform, allowing users to swap digital assets. Acting as a centralized dashboard, Zapper provides users with a streamlined interface to monitor and visualize all their DeFi assets and obligations. Investigators can employ Zapper to gain insights into the assets belonging to the subjects under scrutiny.Zapper proves handy for searching cryptocurrency and NFT holdings. To utilize Zapper, input an address into the search bar and press enter. The outcomes will display the wallet’s value and transaction history categorized by cryptocurrency type. Zapper encompasses Portfolio, NFTs, and History tabs, which investigators can utilize to obtain the necessary information. Upon identifying a wallet ID associated with an NFT buyer or seller from platforms like Open Sea or Rarible, investigators can navigate to the NFTs tab to examine the held NFTs.3- Rarible – https://rarible.com/ - is another NFT marketplace that investigators can leverage.To use Rarible, enter a collection name, NFT name, or username into the search bar and hit enter.More on this topic later on.'
