full_description = "INFOSEC The CMMC Countdown, Part 4 This high-level review of the five-point controls required for a conditional certificate will wrap up the CMMC action plan. Dec 29, 2024 10 min read INFOSEC The CMMC Countdown: The Action Plan, Part 3 Continue your CMMC action plan with this high-level review of the five-point controls required to get a conditional certificate. Nov 24, 2024 6 min read INFOSEC Featured SecjuiceCON 2025 Come and host a talk at SecjuiceCON, our very first virtual conference! Submit your speaker presentation abstract by December 31, 2024. Oct 31, 2024 1 min read INFOSEC The CMMC Countdown: The Action Plan, Part 2 Start your CMMC action plan with this high-level review of the five-point controls required to get a conditional certificate. Oct 31, 2024 3 min read OSINT Download Websites to Find OSINT Websites are full of useful information that is hidden in source code or small print in obscure subdomain. The following is an excerpt from the book, The OSINT Guide, by Thomas Caliendo. Here we will walk through how to discover Open Source Intelligence (OSINT) by downloading a website to search Mar 1, 2024 4 min read INFOSEC Understanding the Implications of the Europcar Data Breach In recent years, data breaches have become a concerning trend, affecting companies across various industries. One such incident involved Europcar, a prominent car rental company, which was embroiled in controversy following claims of a massive data breach affecting millions of its customers. However, as investigations unfolded, it became apparent that Mar 1, 2024 3 min read INFOSEC The CMMC Countdown: Why Your Company Needs to Prepare for 2025 Now, Part 1 Prepare your company for CMMC 2.0 compliance by 2025 with our guide on Azure tenant selection and System Security Plan creation to stay ahead in cybersecurity readiness. Feb 5, 2024 3 min read INFOSEC Data Breaches and the Role of Stolen Credentials in 2023 Tom Caliendo unravels the intricate web of U.S. data