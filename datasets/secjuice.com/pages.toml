ce detection performed. Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1 IP address (1 host up) scanned in 146.07 secondsWoo, a lot of information! Five ports open: 22 for ssh, 80 and 3000 for http, 3306 with a mySQL instance and 7921 unknown). Insert the usual domain (ambassador.htb) in the /etc/hosts file and proceed with the analysis.80 - HTTPAt first glance, it looks like a simple blog with just one post. The only message posted seems to give some clues on how to access via ssh, but it is not very clear, and despite some attempts, I cannot log in. I proceed with a simple dirb session.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox/_10.10.11.183 - Ambassador (lin)] └─$ dirb http://ambassador.htb ----------------- DIRB v2.22 By The Dark Raver ----------------- START_TIME: Wed Oct 19 21:36:12 2022 URL_BASE: http://ambassador.htb/ WORDLIST_FILES: /usr/share/dirb/wordlists/common.txt ----------------- GENERATED WORDS: 4612 ---- Scanning URL: http://ambassador.htb/ ---- ==> DIRECTORY: http://ambassador.htb/categories/ ==> DIRECTORY: http://ambassador.htb/images/ + http://ambassador.htb/index.html (CODE:200|SIZE:3654) ==> DIRECTORY: http://ambassador.htb/posts/ + http://ambassador.htb/server-status (CODE:403|SIZE:279) + http://ambassador.htb/sitemap.xml (CODE:200|SIZE:645) ==> DIRECTORY: http://ambassador.htb/tags/ ---- Entering directory: http://ambassador.htb/categories/ ---- + http://ambassador.htb/categories/index.html (CODE:200|SIZE:2330) ---- Entering directory: http://ambassador.htb/images/ ---- (!) WARNING: Directory IS LISTABLE. No need to scan it. (Use mode '-w' if you want to scan it anyway) ---- Entering directory: http://ambassador.htb/posts/ ---- + http://ambassador.htb/posts/index.html (CODE:200|SIZE:3140) ==> DIRECTORY: http://ambassador.htb/posts/page/ ---- Entering directory: http://ambassador.htb/tags/ ---- + http://ambassador.htb/tags/index.html (CODE:200|SIZE:2288) ---- Entering directory: http://ambassador.htb/posts/