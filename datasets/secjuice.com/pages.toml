full_description = "What Is Secjuice? Secjuice is a volunteer led collective of 100+ writers focused on cybersecurity, information security, network security and open source intelligence. Secjuice Apr 1, 2018 • 2 min read Secjuice is the only non-profit, independent and volunteer led publication in the information security space. We are a private members writing club focused on cybersecurity, information security, network security, hacking, cyberwar, and open source intelligence gathering.We believe that our value as professionals lies in our ability to share our research and knowledge with others through the written word. We mentor hackers, help them prepare their research, polish their articles and translate their skills into commercial writing experience and freelance writing opportunities. Our members feel a strong sense of civic duty, it's what drives us to spread our knowledge and experiences with our community. Defending the interests of those who hack is within our remit.We pay homage to the infosec space and we are proud to be an independent voice in our industry. We don't do advertising, we don't do sponsors and we don't monetize our content. Secjuice delivers the written word and helps aspiring writers find their voice.If you want to see live writers rankings click here.If you want to see live article rankings click here.Fair Use NoticeTL;DR - We use a ton of artwork without asking for permission first, the notice below covers this use. We always credit the creators and link back to their work, but on occasion some creators do not like us doing this, if you are a creator who does not want us using your artwork, please get in touch with us and we will fix it.The Secjuice.com website contains copyrighted material, the use of which has not always been specifically authorized by the copyright owner. The material is being made available for the purpose of advancing information security knowledge, and it is distributed without profit to those who have expressed an interest in receiving the included information for research and educational purposes. We believe this constitutes a “fair use” of any such copyrighted material as provided for by US Copyright law (e.g. Title 17 U.S.C. Section 107). If for any reason you believe that our use of your material on this site does not constitute ‘fair use,’ please notify us."
