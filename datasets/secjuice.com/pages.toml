full_description = "INFOSEC Featured SecjuiceCON 2025 Come and host a talk at SecjuiceCON, our very first virtual conference! Submit your speaker presentation abstract by December 31, 2024. Secjuice Oct 31, 2024 • 1 min read After a decade of publishing your favorite infosec articles, we are very proud to announce SecjuiceCON 2025, our very first virtual conference. The first Secjuice conference is an online event for infosec and osint industry insiders, and we'd love for you to talk to our audience about your wisdom and learnings.You might already know about our work, but Secjuice is the only non-profit, independent, and volunteer-led publication in the information security space. We are a private members' writing club focused on cybersecurity, information security, hacking, and open-source intelligence gathering.We believe that our value as professionals lies in our ability to share our research and knowledge with others through the written word. We mentor hackers and help them prepare their research for publication. Our members feel a strong sense of civic duty; it's what drives us to spread our knowledge and experiences with our community. Defending the interests of those who hack is within our remit.Conference DateMark it in your calendar: Sunday, March 30, 2025VenueOnline: Registration information will become available in Q1 2025.TopicsSecjuiceCON will cover the following topics and welcome speaker applications around these topics on any subject:Deep Technical VibesPenetration Testing Pro'sThe Art of Security ResearchThe Dirty Dark WebOpen-Source Intelligence (OSINT) TechnologyOpen-Source Intelligence (OSINT) MethodologyHow Laws and Regulations Annoy YouEthics & Best Practices In What We DoSurprise Us With Insanity!Code Of ConductNo drama, no hostility, maintain civility, or else.Call for PresentersPlease visit https://sessionize.com/SecjuiceCon2025/ to submit an abstract. The deadline to submit is 12/31/2024.Our SponsorsWe thank the following sponsors:SessionizeWant to sponsor SecjuiceCon? Please email conference at secjuice dot com to get more details!!"
