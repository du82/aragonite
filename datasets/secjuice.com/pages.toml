full_description = "CYBERSEC Secjuice Hall Of Fame The Secjuice Hall Of Fame, where we immortalize legendary Secjuice members, volunteers who made a difference and writers who contribute to our project. Secjuice Feb 23, 2020 • 2 min read Welcome to the Secjuice Hall Of Fame, a place where we immortalize legendary Secjuice members, the precious few who volunteer tirelessly for the group, those who have won writers awards and those who complete one of our challenges. It is not easy to get into our hall of fame, we only include those who have won a top ten position in our annual writer rankings, who have completed our very own infosec writers challenge, or who have contributed to our group in some way. What follows is a list of mentors, volunteers, champions, award winners, our wittiest writers, our brightest sparks, our sharpest minds and our most talented hackers.Be sure to look them up on social media, they are well worth following!Legendary VolunteersThe following members have gone above and beyond the call of duty when volunteering for the Secjuice community and helping other members.Miguel Calles - Follow him on Twitter and LinkedIn.Mars Groves - Follow him on Twitter and LinkedIn.Paul Dannewitz - Follow him on Twitter.Alessandro Innocenzi - Follow him on Twitter and LinkedIn.Writers Challenge ChampionsThe following champions have completed the 'Triple Ten' Infosec Writers Challenge and have been awarded a Secjuice Challenge Coin in recognition of their achievement.Guise Bule - Follow him on Twitter and LinkedIn.Stuart Peck - Follow him on Twitter and LinkedIn.Jamie Collier - Follow him on Twitter and LinkedIn.Gus Ralph - Follow him on Twitter and HackMD.Muhammad Luqman - Follow him on Twitter.Miguel Calles - Follow him on Twitter and LinkedIn.Andrea Menin - Follow Him on Twitter and LinkedIn.Arif Khan - Follow Him on Twitter and LinkedIn.Abartan Dhakal - Follow Him on Twitter and LinkedIn.Sinwindie - Follow Him on Twitter.Andy From Italy - Follow him on Twitter.Secjuice Top Ten Big GunsThe following members are currently the top ten writers at Secjuice, ranked in our annual writer/article count, based on the number of their article reads in 2020. If you want to see live writers rankings click here.If you want to see live article rankings click here.#1 Andrea Menin - @AndreaTheMiddle#2 Guise Bule - @guisebule#3 Paul Dannewitz - @padannewitz#4 Shivam Singh Sengar - @shisen_404#5 Nihad Hassan - @DarknessGate#6 Minatow - @MinatoTW_#7 Sinwindie - @Sinwindie#8 Roy Shoemake - @royshoemake#9 Secprentice - @secprentice#10 Rohan Chavan - @rohanchavan1918The awesome image used in this article is called The Greatest Showmen and was created by Alexy Kot."
