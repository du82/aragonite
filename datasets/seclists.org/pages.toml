["https://seclists.org/dailydave"]
title = "Daily Dave Mailing List"
description = "SecLists.org archive for the Daily Dave mailing list: This technical discussion list covers vulnerability research, exploit development, and security events/gossip.  It was started by ImmunitySec founder Dave Aitel and many security luminaries participate.  Many posts simply advertise Immunity products, but you can't really fault Dave for being self-promotional on a list named DailyDave."
full_description = '''Daily Dave Mailing ListCurrent Quarter RSS Feed About List All Lists This technical discussion list covers vulnerability research, exploit development, and security events/gossip. It was started by ImmunitySec founder Dave Aitel and many security luminaries participate. Many posts simply advertise Immunity products, but you can't really fault Dave for being self-promotional on a list named DailyDave. List Archives Jan–MarApr–JunJul–SepOct–Dec20257 – – – 20249 14 14 4 20233 13 14 5 20226 4 18 – 202111 2 4 1 202015 10 19 8 201938 8 12 15 201823 12 15 16 201741 37 43 20 201663 74 54 16 201562 51 68 63 201485 57 68 88 201377 53 67 71 201270 65 89 55 201140 113 90 87 201086 68 55 56 2009143 146 129 74 2008161 136 252 134 2007324 209 176 193 2006270 220 315 318 2005352 399 408 281 2004247 204 294 361 2003– – – 84 Latest Posts on your child going to college in Christchurch, NZ and velvet worms Dave Aitel via Dailydave (Feb 11) *on your child going to college in Christchurch, NZ and velvet worms* By mid‑August the garden already practices absence — stems turning hollow, the robin leaving its notes hanging in the air like torn corners of a song. Under the chirp of palmetto bugs, a log eases itself back into earth. Inside, hidden from the light, a velvet worm does the impossible: offers herself to a spill of pale, blind threads. For days she is nothing but hunger... Re: (the root of the root and the bud of the bud) Sean Heelan via Dailydave (Jan 13) As it happens, I’ve found the most effective way to use LLMs is to de-anthropomorphise them entirely and treat them very like fuzzers (large scale generation of results, lots of false positives/nonsense, filtered by some oracle). The “conversation with an AI” approach where you imagine yourself as having a single artificial brain to interact with is (currently at least) practically far less useful than one in which you are content with... Anthropological "Hacker" Map A K via Dailydave (Jan 13) Hi all, In the latest "Security Weekly" (https://www.youtube.com/watch?v=CXefYdEGW04 ) they present the Anthropological "Hacker" Map https://wherewarlocksstayuplate.com/map/ While the map is incomplete (how can it ever be complete?), I think it is one of the few times, outside of David Aitel's writings about the cross-cut between the "underground" (for a lack of a better term) and subsequent commercial... Re: (the root of the root and the bud of the bud) Don A. Bailey via Dailydave (Jan 12) I designed one of the first working fuzzers (albeit unintentionally) back in the late 90's. I don't remember if I published it, but I still have the code. It, however, worked - badly - but it worked. I was heavily flamed, however, because as you stated - it was not hip. It only attacked environment variable and command-line argument based vulnerabilities. But, in the 90's and early 00's, we had no shortage of local suid-based... Re: (the root of the root and the bud of the bud) Thomas Dullien via Dailydave (Jan 12) Hey, I have one quibble: We are using "reasoning" in a qualitative, not descriptive, form here -- "fuzzing is or is not reasoning", "LLMs reason or do not reason". I am not sure this is helpful. Fuzzing is empirically successful at finding crashes. Somebody that needs to light a fire and smashes two stones together until they throw sparks does not, once the fire burns, need to justify that 'stones perform... Re: (the root of the root and the bud of the bud) Darren Bounds via Dailydave (Jan 12) Everything old is new and the way we reason is the same way LLMs reason. It's not about looking for the same problem the same way it's about going to searching for that flaw the same way with unlimited (nearly) resources. Traditional human-led vulnerability research and discovery is, today, a short lived venture. Things will change very rapidly over the coming 24 months. Memories and thoughts are the same thing, someone tried to... (the root of the root and the bud of the bud) Dave Aitel via Dailydave (Jan 11) Memories and thoughts are the same thing, someone tried to explain to me recently. You have to think to remember, in other words. This is hard to grasp for a lot of people because they *think *they have *memories*. They wrongly think memory is a noun instead of a verb, which is ok in philosophy and psychology but in cutting edge computer science we have to be precise about these sorts of things. Twenty-five years ago, when I first started... the endless stream Dave Aitel via Dailydave (Dec 31) I've seen great people in our industry crushed under the weight of the secrets they carry into a singularity from which no information can emerge. In some ways the lesson from apache_nosejob.c <https://www.exploit-db.com/exploits/21560> was that we cannot take ourselves seriously, that at the heart of our discipline there must remain a jester, that we must float upon the stream of endless information rather than absorb it into our... Hacking the Edges of Knowledge: LLMs, Vulnerabilities, and the Quest for Understanding Dave Aitel via Dailydave (Nov 02) [image: image.png] It's impossible not to notice that we live in an age of technological wonders, stretching back to the primitive hominids who dared to ask "Why?" but also continually accelerating and pulling everything apart while it does, in the exact same manner as the Universe at large. It is why all the hackers you know are invested so heavily in Deep Learning right now, as if someone got on a megaphone at Chaos... Old Infosec Talks: Metlstorm's Take on Hacky Hacking Dave Aitel via Dailydave (Oct 31) The Anatomy of Compromise One of my demented hobbies is watching old infosec talks and then seeing how well they hold up to modern times. Recently I excavated Metlstorm's 2017 BSides Canberra <https://www.youtube.com/watch?v=OjgvP9UB9GI&list=TLGGvAY1CcIr-AcyNjEwMjAyNA> talk on "How people get hacked" - a pretty generic topic that gives a lot of room for opinion, and one a lot of people have opined on, but the talk itself... Grace Hopper and the Rebirth of US Conferences Dave Aitel via Dailydave (Oct 10) I spent some time watching all the Grace Hopper videos on the youtubes, as I prepared for what up North is a horrible storm, but here in Miami is, so far, a breezy and clear day. You can hear her talk about how subroutines used to be literal handwritten pages of instructions in notebooks. When you wanted SIN or COS you would go over to whoever had the notebook with the working version, and copy it out into your code. It was this experience that... More Lists Dozens of other network security lists are archived at SecLists.Org.'''
