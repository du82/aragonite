ys head of Cyber Command Matthew Wheeler (Jun 02) https://www.three.fm/news/world-news/us-military-hackers-conducting-offensive-operations-in-support-of-ukraine-says-head-of-cyber-command/ US military hackers have conducted offensive operations in support of Ukraine, the head of US Cyber Command has told Sky News. In an exclusive interview, General Paul Nakasone also explained how "hunt forward" operations were allowing the United States to search out foreign hackers and identify... SideWinder Hackers Launched Over a 1, 000 Cyber Attacks Over the Past 2 Years Matthew Wheeler (May 31) https://thehackernews.com/2022/05/sidewinder-hackers-launched-over-1000.html An "aggressive" advanced persistent threat (APT) group known as SideWinder has been linked to over 1,000 new attacks since April 2020. "Some of the main characteristics of this threat actor that make it stand out among the others, are the sheer number, high frequency and persistence of their attacks and the large collection of encrypted and obfuscated... Hackers are Selling US University Credentials Online, FBI Says Matthew Wheeler (May 31) https://tech.co/news/hackers-are-selling-us-university-credentials-online-fbi-says The Federal Bureau of Investigation has warned US universities and colleges that it has found banks of login credentials and other data relating to VPN access circulating on cybercriminals forums. The fear is that such data will be sold and subsequently used by malicious actors to orchestrate attacks on other accounts owned by the same students, in the hope... Interpol Nabs 3 Nigerian Scammers Behind Malware-based Attacks Matthew Wheeler (May 31) https://thehackernews.com/2022/05/interpol-nabs-3-nigerian-scammers.html Interpol on Monday announced the arrest of three suspected global scammers in Nigeria for using remote access trojans (RATs) such as Agent Tesla to facilitate malware-enabled cyber fraud. "The men are thought to have used the RAT to reroute financial transactions, stealing confidential online connection details from corporate organizations, including oil and gas... U.S. Warns Against North Korean Hackers Posing as IT Freelancers Matthew Wheeler (May 18) https://thehackernews.com/2022/05/us-warns-against-north-korean-hackers.html Highly skilled software and mobile app developers from the Democratic People's Republic of Korea (DPRK) are posing as "non-DPRK nationals" in hopes of landing freelance employment in an attempt to enable the regime's malicious cyber intrusions. That's according to a joint advisory from the U.S. Department of State, the Department of the... FBI and NSA say: Stop doing these 10 things that let the hackers in Matthew Wheeler (May 18) https://www.zdnet.com/article/fbi-and-nsa-say-stop-doing-these-10-things-that-let-the-hackers-in/ Cyber attackers regularly exploit unpatched software vulnerabilities, but they "routinely" target security misconfigurations for initial access, so the US Cybersecurity and Infrastructure Security Agency (CISA) and its peers have created a to-do list for defenders in today's heightened threat environment. CISA, the FBI and National... Fifth of Businesses Say Cyber-Attack Nearly Broke Them Matthew Wheeler (May 18) https://www.infosecurity-magazine.com/news/fifth-of-businesses-cyber-attack/ A fifth of US and European businesses have warned that a serious cyber-attack nearly rendered them insolvent, with most (87%) viewing compromise as a bigger threat than an economic downturn, according to Hiscox. The insurer polled over 5000 businesses in the US, UK, Ireland, France, Spain, Germany, the Netherlands and Belgium to compile its annual Hiscox Cyber... Hacker And Ransomware Designer Charged For Use And Sale Of Ransomware, And Profit Sharing Arrangements With Cybercriminals Matthew Wheeler (May 18) https://www.shorenewsnetwork.com/2022/05/16/hacker-and-ransomware-designer-charged-for-use-and-sale-of-ransomware-and-profit-sharing-arrangements-with-cybercriminals/ A criminal complaint was unsealed today in federal court in Brooklyn, New York, charging Moises Luis Zagala Gonzalez (Zagala), also known as “Nosophoros,” “Aesculapius” and “Nebuchadnezzar,” a citizen of France and Venezuela who resides in Venezuela, with attempted... State of Ransomware shows huge growth in threat and impacts Matthew Wheeler (May 04) https://www.continuitycentral.com/index.php/news/technology/7275-state-of-ransomware-shows-huge-growth-in-threat-and-impacts Sophos has released its annual survey and review of real-world ransomware experiences in its ‘State of Ransomware 2022’ report. This shows that 66 percent of organizations surveyed were hit with ransomware in 2021, up from 37 percent in 2020. The average ransom paid by organizations that had data encrypted in their... More Lists Dozens of other network security lists are archived at SecLists.Org.'''
