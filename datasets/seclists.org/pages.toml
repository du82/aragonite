title = "CERT: CISA Releases Eight Industrial Control Systems Advisories"
full_description = '''CERT mailing list archives By Date By Thread CISA Releases Eight Industrial Control Systems Advisories From: "CISA" <CISA () messages cisa gov> Date: Tue, 21 Mar 2023 19:25:30 +0000 Cybersecurity and Infrastructure Security Agency (CISA) - Defend Today, Secure Tomorrow You are subscribed to Cybersecurity Advisories for Cybersecurity and Infrastructure Security Agency. This information has recently been updated, and is now available. CISA Releases Eight Industrial Control Systems Advisories [ https://www.cisa.gov/news-events/alerts/2023/03/21/cisa-releases-eight-industrial-control-systems-advisories ] 03/21/2023 08:00 AM EDT CISA released eight Industrial Control Systems (ICS) advisories on March 21, 2023. These advisories provide timely information about current security issues, vulnerabilities, and exploits surrounding ICS. * ICSA-23-080-01 Keysight N6854A Geolocation Server and N6841A RF Sensor [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-01 ] * ICSA-23-080-02 Delta Electronics InfraSuite Device Master [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-02 ] * ICSA-23-080-03 Siemens RUGGEDCOM APE1808 Product Family [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-03 ] * ICSA-23-080-04 Siemens RADIUS Client of SIPROTEC 5 Devices [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-04 ] * ICSA-23-080-05 VISAM VBASE Automation Base [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-05 ] * ICSA-23-080-06 Rockwell Automation ThinManager [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-06 ] * ICSA-23-080-07 Siemens SCALANCE Third-Party [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-080-07 ] * ICSA-21-343-01 Hitachi Energy GMS600, PWC600, and Relion (Update A) [ https://www.cisa.gov/news-events/ics-advisories/icsa-21-343-01 ] CISA encourages users and administrators to review the newly released ICS advisories for technical details and mitigations: Please share your thoughts. We recently updated our anonymous Product Feedback Survey [ https://www.surveymonkey.com/r/CISA-cyber-survey?product=%5bproduct_value%5d ] and we'd welcome your feedback. This product is provided subject to this Notification [ https://www.cisa.gov/terms-use ] and this Privacy & Use [ https://www.dhs.gov/privacy-policy ] policy. body { font-size: 1em; font-family: Arial, Verdana, sans-serif; font-weight: normal; font-style: normal; color: #333333; } Having trouble viewing this message? View it as a webpage [ https://content.govdelivery.com/accounts/USDHSCISA/bulletins/3501415 ]. [ https://content.govdelivery.com/accounts/USDHS/bulletins/292141e ] You are subscribed to updates from the Cybersecurity and Infrastructure Security Agency [ https://www.cisa.gov ] (CISA) Manage Subscriptions [ https://public.govdelivery.com/accounts/USDHSCISA/subscriber/edit?preferences=true#tab1 ] | Privacy Policy [ https://www.cisa.gov/privacy-policy ] | Help [ https://subscriberhelp.granicus.com/s/article/Subscriber-Help-Center ] [ https://insights.govdelivery.com/Communications/Subscriber_Help_Center ] Connect with CISA: Facebook [ https://www.facebook.com/CISA ] | Twitter [ https://twitter.com/CISAgov ] | Instagram [ https://Instagram.com/cisagov ] | LinkedIn [ https://www.linkedin.com/company/cybersecurity-and-infrastructure-security-agency ] | YouTube [ https://www.youtube.com/channel/UCxyq9roe-npgzrVwbpoAy0A ] ________________________________________________________________________ This email was sent to using GovDelivery Communications Cloud, on behalf of: Cybersecurity and Infrastructure Security Agency · 707 17th St, Suite 4000 · Denver, CO 80202 GovDelivery logo [ https://subscriberhelp.granicus.com/ ] body .abe-column-block { min-height: 5px; } table.gd_combo_table img {margin-left:10px; margin-right:10px;} table.gd_combo_table div.govd_image_display img, table.gd_combo_table td.gd_combo_image_cell img {margin-left:0px; margin-right:0px;} By Date By Thread Current thre