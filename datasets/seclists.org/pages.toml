title = "SecLists.Org Security Mailing List Archive"
description = "Security mailing list archive for the Nmap lists, Bugtraq, Full Disclosure, Security Basics, Pen-test, and dozens more. Search capabilities and RSS feeds with smart excerpts are available"
full_description = '''SecLists.Org Security Mailing List Archive Any hacker will tell you that the latest news and exploits are not found on any web site—not even Insecure.Org. No, the cutting edge in security research is and will continue to be the full disclosure mailing lists such as Bugtraq. Here we provide web archives and RSS feeds (now including message extracts), updated in real-time, for many of our favorite lists. Browse the individual lists below, or search them all using the Site Search box above. Insecure.Org Lists Nmap Development — Unmoderated technical development forum for debating ideas, patches, and suggestions regarding proposed changes to Nmap and related projects. Subscribe to nmap-dev here.Current Quarter Archived Posts RSS Feed About List nmap-devLatest Posts Windows 10/11: Ncat: A message sent on a datagram socket was larger than the internal message buffer ... Ken Kayser (Feb 20) *Describe the bug* When listening to a port with ncat, as soon as a UDP packet is received, I receive a constant stream of errors with the following text: "Ncat: A message sent on a datagram socket was larger than the internal message buffer or some other network limit, or the buffer used to receive a datagram into was smaller than the datagram itself. ." *To Reproduce* 1. In either a Windows command line or Powershell I enter... Reverse DNS (issue #3007) Matteo Nicoli (Feb 13) Hi all, I noticed a cool feature proposal on GitHub (issue 3007 <https://github.com/nmap/nmap/issues/3007>). It basically suggests a new feature for returning the (complete) list of DNS records obtained — through reverse DNS lookups — from an IP address. If it matches with the map product roadmap, I’d like to start implementing it. Is there some maintainer who could give me a brief feedback about it? Cheers, Matteo Re: Mail stoppage Gordon Fyodor Lyon (Feb 12) Yes, this was my fault. Mail to the Nmap dev list from non-subscribers goes through moderation to keep out the spam. I regularly go through the moderation queue to find and approve the "real" messages, but I was a bit slow this time. We strongly recommend that folks posting to the list first subscribe to it. This avoids the moderation delay and prevents them from missing any responses which might only be sent to the list. Cheers,... Mail stoppage Dave Close (Feb 12) Several messages received today seem to have been stuck on nmap.org for up to a month. Example (edited for clarity): Version: 7.94+SVN TypeError: Couldn't find foreign struct converter for 'cairo.Context' Hendrick Halim (Feb 12) Version: 7.94+SVN TypeError: Couldn't find foreign struct converter for 'cairo.Context' topology tab crash Genny and Doug Kent (Feb 12) zenmap crashes when topology tab clicked. Output message below Version: 7.94+SVN TypeError: Couldn't find foreign struct converter for 'cairo.Context' Doug Kent PR #2954, Fix out of bounds reads in packet parsing Domen Puncer Kugler via dev (Feb 12) Hi, I've submitted a pull request a few months ago: https://github.com/nmap/nmap/pull/2954 The PR includes following three commits: - Fix out of bounds read in HopByHopHeader::validate - Fix out of bounds read in PacketParser::split - Add AFL test code for PacketParser This was found as a part of a short Hackathon at NCC Group. As far as I can tell, there is no security impact, but it would still be nice to see this fixed. Kind regards High-Priority HTML Parsing script astrotoki via dev (Feb 12) Hello, I noticed that under the high priority script ideas was the need for a library that parses HTML info from sites. I wrote a script that uses a web crawler and extracts html info from attached pages and accompanying urls within the html body. Let me know if this is what yall were after? Thanks! Ryan LaPierre <Astro>_______________________________________________ Sent through the dev mailing list... URL Pathfinder astrotoki via dev (Feb 12) Hello all! I just wrote up another script, trying to practice and maybe have some added to the master list for nmap. This script enumerates possible hidden path extensions on urls. As always, Id love input on it, changes or updates. Thanks all! Ryan LaPierre <Astro>_______________________________________________ Sent through the dev mailing list https://nmap.org/mailman/listinfo/dev Archived at https://seclists.org/nmap-dev/ Null Byte Poisoning NSE astrotoki via dev (Feb 12) Here is my submission of a script I wrote that should test a site for null byte poisoning vulnerabilities._______________________________________________ Sent through the dev mailing list https://nmap.org/mailman/listinfo/dev Archived at https://seclists.org/nmap-dev/ Re: First Go astrotoki via dev (Feb 12) Here is an updated version with more XSS patterns integrated into it. As well as some clean up! I also created a separate .lua with just the http crawler function. Sent through the dev mailing list https://nmap.org/mailman/listinfo/dev Archived at https://seclists.org/nmap-dev/ First Go astrotoki via dev (Feb 12) Hello!, I just started learning Lua for writing NSEs and had a go at a HTTP crawler that identifies XSS vulnerabilities on sites. I used Juice-Shop OWASP to confirm it works. (Thats why the source code uses port 3000 in addition to 80) Id love feedback! Doing my best to learn as much as I can. I attached the http_xss_crawler.nse below! PS. I had used ChatGPTo1 and Github CoPilot to aid in debugging and syntax issues. The overall code is my... Re: [PATCH] nping: bind to interface on Linux for IPv4 send-ip Daniel Miller (Feb 10) Thanks, Valdik! I reviewed the code and moved the call to socket_bindtodevice() to ProbeMode::start() so that it will affect all modes, not just TCP. The change is in r39078. Dan High-Priority HTML Parsing script astrotoki via dev (Jan 28) Sent through the dev mailing list https://nmap.org/mailman/listinfo/dev Archived at https://seclists.org/nmap-dev/ Post Quantum hackathon and nmap Loganaden Velvindron (Dec 09) Hi Folks, I'm logan from the cyberstorm.mu team. We have opened several PRs for nmap to improve support for Post Quantum algorithms: https://github.com/nmap/nmap/pull/2977 https://github.com/nmap/nmap/pull/2978 https://github.com/nmap/nmap/pull/2987 We are working on other PRs for PQ which we will send in due time. Feedback is welcome and we are willing to commit time to improve our PRs. Kind regards, Logan (On behalf of the... Nmap Announce — Moderated list for the most important new releases and announcements regarding the Nmap Security Scanner and related projects. We recommend that all Nmap users subscribe to stay informed.Previous Year Archived Posts RSS Feed About List nmap-announceLatest Posts Nmap 7.95 released: OS and service detection signatures galore! Gordon Fyodor Lyon (May 05) Dear Nmap Community, I just arrived in San Francisco for the RSA conference and am delighted to announce our Nmap Version 7.95 release! I'm most excited that we finally tackled our backlog of OS and service detection fingerprint submissions. We're not talking about dozens or hundreds of them-we processed more than 6,500 fingerprints! For OS detection, we added 336 signatures, bringing the new total to 6,036. Additions include iOS 15... Npcap Celebrates its 10th Anniversary In Space! Gordon Fyodor Lyon (Oct 05) Dear Nmap community, Last month we celebrated Nmap's 26th birthday and today I'm happy to share another big milestone: Our Npcap driver for capturing and sending raw packets on Windows turned 10 this year! From humble beginnings as a security and modernization patch for the discontinued WinPcap project, Npcap has become an indispensable component for both Nmap and Wireshark. And it's used by hundreds of other software products and... Nmap 26th Birthday Announcement: Version 7.94 Gordon Fyodor Lyon (Sep 01) Dear Nmap community, Today is Nmap’s 26th birthday, which reminded me that I hadn’t yet announced our Nmap 7.94 release from May. And it’s a great one! The biggest improvement was the Zenmap and Ndiff upgrades from the obsolete Python 2 language to Python 3 on all platforms. Big thanks to Daniel Miller, Jakub Kulík, Brian Quigley, Sam James, Eli Schwartz, Romain Leonard, Varunram Ganesh, Pavel Zhukov, Carey Balboa, and Hasan Aliyev for... Full Disclosure — A public, vendor-neutral forum for detailed discussion of vulnerabilities and exploitation techniques, as well as tools, papers, news, and events of interest to the community. The relaxed atmosphere of this quirky list provides some comic relief and certain industry gossip. More importantly, fresh vulnerabilities sometimes hit this list many hours or days before they pass through the Bugtraq moderation queue.Previous Month Archived Posts RSS Feed About List fulldisclosureLatest Posts SEC Consult SA-20250226-0 :: Multiple vulnerabilities in Siemens A8000 CP-8050 & CP-8031 PLC SEC Consult Vulnerability Lab via Fulldisclosure (Feb 27) SEC Consult Vulnerability Lab Security Advisory < 20250226-0 > ======================================================================= title: Multiple Vulnerabilities product: Siemens A8000 CP-8050 PLC Siemens A8000 CP-8031 PLC vulnerable version: <05.40 for Vulnerability 1, <05.30 for Vulnerability 2 fixed version: 05.40 for Vulnerability 1, 05.30 for Vulnerability 2... Re: MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client Jordy Zomer (Feb 27) Hey all, First of all, cool findings! I've been working on the CodeQL query and have a revised version that I think improves accuracy and might offer some performance gains (though I haven't done rigorous benchmarking). The key change is the use of `StackVariableReachability` and making sure that there's a path wher e `var` is not reassigned before taking a `goto _;`. Ran it on an older database, found some of the same bugs... MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client Qualys Security Advisory via Fulldisclosure (Feb 20) Qualys Security Advisory CVE-2025-26465: MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client CVE-2025-26466: DoS attack against OpenSSH's client and server ======================================================================== Contents ======================================================================== Summary Background Experiments Results MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client DoS... Self Stored XSS - acp2sev7.2.2 Andrey Stoykov (Feb 20) # Exploit Title: Self Stored XSS - acp2sev7.2.2 # Date: 02/2025 # Exploit Author: Andrey Stoykov # Version: 7.2.2 # Tested on: Ubuntu 22.04 # Blog: https://msecureltd.blogspot.com/2025/02/friday-fun-pentest-series-19-self.html Self Stored XSS #1: Steps to Reproduce: 1. Visit "http://192.168.58.168/acp2se/mul/muladmin.php"; and login with "admin" / "adminpass" 2. In the field "Put the name of the new... Python's official documentation contains textbook example of insecure code (XSS) Georgi Guninski (Feb 20) Python's official documentation contains textbook example of insecure code (XSS) Date: 2025-02-18 Author: Georgi Guninski === form = cgi.FieldStorage() if "name" not in form or "addr" not in form: print("<H1>Error</H1>") print("Please fill in the name and addr fields.") return print("<p>name:", form["name"].value) print("<p>addr:",... Re: Netgear Router Administrative Web Interface Lacks Transport Encryption By Default Gynvael Coldwind (Feb 17) Hi, This isn't really a problem a vendor can solve in firmware (apart from offering configuration via cloud, which has its own issues). Even if they would enable TLS/SSL by default, it would just give one a false sense of security, since: - the certificates would be invalid (public CAs don't give out certs for IP addresses), - they would be easy to clone (due to being self-signed and/or being easy to extract from a similar device), -... Monero 18.3.4 zero-day DoS vulnerability has been dropped publicly on social network. upper.underflow via Fulldisclosure (Feb 16) Hello, About an hour ago, a group appearing to be named WyRCV2 posted a note on the nostr social network, which can be found at the following link: https://primal.net/e/note1vzh0mj9rcxax9cgcdapupyxeehjprd68gd9kk9wrv939m8knulrs4780x7 Save, share, use. The paste link includes a list of nodes that the attacker has instructed to target, along with a Python code to leverage the attack. According to their explanation, this vulnerability is... Netgear Router Administrative Web Interface Lacks Transport Encryption By Default Ryan Delaney via Fulldisclosure (Feb 16) <!-- # Exploit Title: Netgear Router Administrative Web Interface Lacks Transport Encryption By Default # Date: 02-13-2025 # Exploit Author: Ryan Delaney # Author Contact: ryan.delaney () owasp org # Vendor Homepage: https://www.netgear.com # Version: Netgear C7800 Router, F/W 6.01.07, possibly others # Tested on: Netgear C7800 Router, F/W 6.01.07 # CVE: CVE-2022-41545 The administrative web interface of a Netgear C7800 Router running... [CVE-2024-54756] GZDoom <= 4.13.1 Arbitrary Code Execution via Malicious ZScript Gabriel Valachi via Fulldisclosure (Feb 15) In GZDoom 4.13.1 and below, there is a vulnerability involving array sizes in ZScript, the game engine's primary scripting language. It is possible to dynamically allocate an array of 1073741823 dwords, permitting access to the rest of the heap from the start of the array and causing a second array declared in the same function to overlap with this huge array. The result is an exploit chain that allows arbitrary code execution through a... Re: Text injection on https://www.google.com/sorry/index via ?q parameter (no XSS) David Fifield (Feb 15) Today at about 2025-02-13 19:00 I noticed the "≠" is back, but now the type 0x12 payload of the ?q query parameter gets formatted into the string representation of an IP address, rather than being copied almost verbatim into the page. If the payload length is 4 bytes, it gets formatted as an IPv4 address; if 16 bytes, as an IPv6 address. I didn't try a ton of experiments, but it looks like payload lengths other than 4 and 16... SEC Consult SA-20250211-0 :: Multiple vulnerabilities in Wattsense Bridge SEC Consult Vulnerability Lab via Fulldisclosure (Feb 12) SEC Consult Vulnerability Lab Security Advisory < 20250211-0 > ======================================================================= title: Multiple vulnerabilities product: Wattsense - Wattsense Bridge vulnerable version: Wattsense Bridge * Hardware Revision: WSG-EU-SC-14-00, 20230801 * Firmware Revision: Wattsense (Wattsense minimal)... APPLE-SA-02-10-2025-2 iPadOS 17.7.5 Apple Product Security via Fulldisclosure (Feb 10) APPLE-SA-02-10-2025-2 iPadOS 17.7.5 iPadOS 17.7.5 addresses the following issues. Information about the security content is also available at https://support.apple.com/122173. Apple maintains a Security Releases page at https://support.apple.com/100100 which lists recent software updates with security advisories. Accessibility Available for: iPad Pro 12.9-inch 2nd generation, iPad Pro 10.5-inch, and iPad 6th generation Impact: A phy'''
