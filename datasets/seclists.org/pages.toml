title = "CERT: CISA Releases Six Industrial Control Systems Advisories"
full_description = '''CERT mailing list archives By Date By Thread CISA Releases Six Industrial Control Systems Advisories From: "CISA" <CISA () messages cisa gov> Date: Thu, 23 Mar 2023 17:23:32 +0000 Cybersecurity and Infrastructure Security Agency (CISA) - Defend Today, Secure Tomorrow You are subscribed to Cybersecurity Advisories for Cybersecurity and Infrastructure Security Agency. This information has recently been updated, and is now available. CISA Releases Six Industrial Control Systems Advisories [ https://www.cisa.gov/news-events/alerts/2023/03/23/cisa-releases-six-industrial-control-systems-advisories ] 03/23/2023 08:00 AM EDT CISA released six Industrial Control Systems (ICS) advisories on March 23, 2023. These advisories provide timely information about current security issues, vulnerabilities, and exploits surrounding ICS. * ICSA-23-082-01 RoboDK [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-01 ] * ICSA-23-082-02 CP-Plus KVMS Pro [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-02 ] * ICSA-23-082-03 SAUTER EY-modulo 5 Building Automation Stations [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-03 ] * ICSA-23-082-04 Schneider Electric IGSS [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-04 ] * ICSA-23-082-05 ABB Pulsar Plus Controller [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-05 ] * ICSA-23-082-06 ProPump and Controls Osprey Pump Controller [ https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-06 ] CISA encourages users and administrators to review the newly released ICS advisories for technical details and mitigations: Please share your thoughts. We recently updated our anonymous Product Feedback Survey [ https://www.surveymonkey.com/r/CISA-cyber-survey?product=%5bproduct_value%5d ] and we'd welcome your feedback. This product is provided subject to this Notification [ https://www.cisa.gov/terms-use ] and this Privacy & Use [ https://www.dhs.gov/privacy-policy ] policy. body { font-size: 1em; font-family: Arial, Verdana, sans-serif; font-weight: normal; font-style: normal; color: #333333; } Having trouble viewing this message? View it as a webpage [ https://content.govdelivery.com/accounts/USDHSCISA/bulletins/35089eb ]. [ https://content.govdelivery.com/accounts/USDHS/bulletins/292141e ] You are subscribed to updates from the Cybersecurity and Infrastructure Security Agency [ https://www.cisa.gov ] (CISA) Manage Subscriptions [ https://public.govdelivery.com/accounts/USDHSCISA/subscriber/edit?preferences=true#tab1 ] | Privacy Policy [ https://www.cisa.gov/privacy-policy ] | Help [ https://subscriberhelp.granicus.com/s/article/Subscriber-Help-Center ] [ https://insights.govdelivery.com/Communications/Subscriber_Help_Center ] Connect with CISA: Facebook [ https://www.facebook.com/CISA ] | Twitter [ https://twitter.com/CISAgov ] | Instagram [ https://Instagram.com/cisagov ] | LinkedIn [ https://www.linkedin.com/company/cybersecurity-and-infrastructure-security-agency ] | YouTube [ https://www.youtube.com/channel/UCxyq9roe-npgzrVwbpoAy0A ] ________________________________________________________________________ This email was sent to using GovDelivery Communications Cloud, on behalf of: Cybersecurity and Infrastructure Security Agency · 707 17th St, Suite 4000 · Denver, CO 80202 GovDelivery logo [ https://subscriberhelp.granicus.com/ ] body .abe-column-block { min-height: 5px; } table.gd_combo_table img {margin-left:10px; margin-right:10px;} table.gd_combo_table div.govd_image_display img, table.gd_combo_table td.gd_combo_image_cell img {margin-left:0px; margin-right:0px;} By Date By Thread Current thread: CISA Releases Six Industrial Control Systems Advisories CISA (Mar 23)'''
