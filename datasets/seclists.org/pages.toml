["https://seclists.org/cert/2023/3"]
title = "CERT: Apple Releases Security Updates for Multiple Products"
full_description = '''CERT mailing list archives By Date By Thread Apple Releases Security Updates for Multiple Products From: "CISA" <CISA () messages cisa gov> Date: Tue, 28 Mar 2023 17:12:15 +0000 Cybersecurity and Infrastructure Security Agency (CISA) - Defend Today, Secure Tomorrow You are subscribed to Cybersecurity Advisories for Cybersecurity and Infrastructure Security Agency. This information has recently been updated and is now available. Apple Releases Security Updates for Multiple Products [ https://www.cisa.gov/news-events/alerts/2023/03/28/apple-releases-security-updates-multiple-products ] 03/28/2023 01:00 PM EDT Apple has released security updates to address vulnerabilities in multiple products. An attacker could exploit some of these vulnerabilities to take control of an affected device. CISA encourages users and administrators to review the following advisories and apply the necessary updates. * macOS Ventura 13.3 [ https://support.apple.com/en-us/HT213670 ] * Safari 16.4 [ https://support.apple.com/en-us/HT213671 ] * Studio Display Firmware Update 16.4 [ https://support.apple.com/en-us/HT213672 ] * iOS 15.7.4 and iPadOS 15.7.4 [ https://support.apple.com/en-us/HT213673 ] * tvOS 16.4 [ https://support.apple.com/en-us/HT213674 ] * macOS Big Sur 11.7.5 [ https://support.apple.com/en-us/HT213675 ] * iOS 16.4 and iPadOS 16.4 [ https://support.apple.com/en-us/HT213676 ] * macOS Monterey 12.6.4 [ https://support.apple.com/en-us/HT213677 ] * watchOS 9.4 [ https://support.apple.com/en-us/HT213678 ] Please share your thoughts. We recently updated our anonymous Product Feedback Survey [ https://www.surveymonkey.com/r/CISA-cyber-survey?product=%5bproduct_value%5d ] and we'd welcome your feedback. This product is provided subject to this Notification [ https://www.cisa.gov/terms-use ] and this Privacy & Use [ https://www.dhs.gov/privacy-policy ] policy. body { font-size: 1em; font-family: Arial, Verdana, sans-serif; font-weight: normal; font-style: normal; color: #333333; } Having trouble viewing this message? View it as a webpage [ https://content.govdelivery.com/accounts/USDHSCISA/bulletins/3518611 ]. [ https://content.govdelivery.com/accounts/USDHS/bulletins/292141e ] You are subscribed to updates from the Cybersecurity and Infrastructure Security Agency [ https://www.cisa.gov ] (CISA) Manage Subscriptions [ https://public.govdelivery.com/accounts/USDHSCISA/subscriber/edit?preferences=true#tab1 ] | Privacy Policy [ https://www.cisa.gov/privacy-policy ] | Help [ https://subscriberhelp.granicus.com/s/article/Subscriber-Help-Center ] [ https://insights.govdelivery.com/Communications/Subscriber_Help_Center ] Connect with CISA: Facebook [ https://www.facebook.com/CISA ] | Twitter [ https://twitter.com/CISAgov ] | Instagram [ https://Instagram.com/cisagov ] | LinkedIn [ https://www.linkedin.com/company/cybersecurity-and-infrastructure-security-agency ] | YouTube [ https://www.youtube.com/channel/UCxyq9roe-npgzrVwbpoAy0A ] ________________________________________________________________________ This email was sent to using GovDelivery Communications Cloud, on behalf of: Cybersecurity and Infrastructure Security Agency · 707 17th St, Suite 4000 · Denver, CO 80202 GovDelivery logo [ https://subscriberhelp.granicus.com/ ] body .abe-column-block { min-height: 5px; } table.gd_combo_table img {margin-left:10px; margin-right:10px;} table.gd_combo_table div.govd_image_display img, table.gd_combo_table td.gd_combo_image_cell img {margin-left:0px; margin-right:0px;} By Date By Thread Current thread: Apple Releases Security Updates for Multiple Products CISA (Mar 28)'''
