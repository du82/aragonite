["https://seclists.org/dailydave/2025/q1/4"]
title = 'Dailydave: Anthropological "Hacker" Map'
full_description = '''Dailydave mailing list archives By Date By Thread Anthropological "Hacker" Map From: A K via Dailydave <dailydave () lists aitelfoundation org> Date: Mon, 13 Jan 2025 14:54:52 +0100 Hi all, In the latest "Security Weekly" (https://www.youtube.com/watch?v=CXefYdEGW04 ) they present the Anthropological "Hacker" Map https://wherewarlocksstayuplate.com/map/ While the map is incomplete (how can it ever be complete?), I think it is one of the few times, outside of David Aitel's writings about the cross-cut between the "underground" (for a lack of a better term) and subsequent commercial activity. Based on my personal bubble, completely empirical evidence that you should take with a huge grain of salt the cross-cut is not the actual highlight here - the highlight is a temporal one. The generation of folks contained therein are the among the first two generations (or so) between the commoditization of Internet - essentially having first movers advantage on the space. Anyway, felt like sharing this with the rest of the community here _______________________________________________ Dailydave mailing list -- dailydave () lists aitelfoundation org To unsubscribe send an email to dailydave-leave () lists aitelfoundation org By Date By Thread Current thread: Anthropological "Hacker" Map A K via Dailydave (Jan 13)'''
