description = "SecLists.org archive for the Full Disclosure mailing list: A public, vendor-neutral forum for detailed discussion of vulnerabilities and exploitation techniques, as well as tools, papers, news, and events of interest to the community.  The relaxed atmosphere of this quirky list provides some comic relief and certain industry gossip.  More importantly, fresh vulnerabilities sometimes hit this list many hours or days before they pass through the Bugtraq moderation queue."
full_description = '''Full Disclosure Mailing ListPrevious Month RSS Feed About List All Lists A public, vendor-neutral forum for detailed discussion of vulnerabilities and exploitation techniques, as well as tools, papers, news, and events of interest to the community. The relaxed atmosphere of this quirky list provides some comic relief and certain industry gossip. More importantly, fresh vulnerabilities sometimes hit this list many hours or days before they pass through the Bugtraq moderation queue. List Archives JanFebMarAprMayJunJulAugSepOctNovDec202524 20 – – – – – – – – – – 202475 25 44 29 37 13 24 41 60 21 20 22 202329 17 27 14 28 10 52 33 21 32 15 30 202291 57 63 54 48 57 27 17 30 52 26 32 202184 93 81 77 81 60 72 39 59 79 56 50 202052 36 57 63 60 35 37 24 55 34 45 60 201971 54 64 41 52 49 40 37 45 59 34 37 2018102 84 79 61 73 46 95 53 57 54 69 56 201799 103 91 113 108 52 95 58 98 71 51 89 2016100 128 97 93 75 79 89 139 85 103 162 88 2015134 101 165 115 133 112 126 86 121 115 111 129 2014194 273 434 325 213 173 167 89 115 135 103 138 2013282 162 290 263 227 259 277 303 187 294 222 224 2012611 477 390 382 323 428 394 393 210 277 236 280 2011580 687 439 561 572 565 367 393 370 995 466 511 2010637 502 564 452 408 631 417 445 414 523 342 696 2009979 380 465 318 282 291 550 455 421 339 386 502 2008615 496 600 821 681 403 591 557 639 531 739 634 2007593 629 573 744 555 661 662 530 709 935 582 641 2006992 740 1865 865 789 1058 770 771 578 678 545 493 2005927 676 950 654 678 437 766 1078 890 677 1065 1531 20041358 1534 1499 1153 1451 1031 1370 1314 1091 1174 1424 731 2003505 405 296 500 421 890 1251 1942 1763 1806 1123 782 2002– – – – – – 314 835 684 381 454 313 Latest Posts SEC Consult SA-20250226-0 :: Multiple vulnerabilities in Siemens A8000 CP-8050 & CP-8031 PLC SEC Consult Vulnerability Lab via Fulldisclosure (Feb 27) SEC Consult Vulnerability Lab Security Advisory < 20250226-0 > ======================================================================= title: Multiple Vulnerabilities product: Siemens A8000 CP-8050 PLC Siemens A8000 CP-8031 PLC vulnerable version: <05.40 for Vulnerability 1, <05.30 for Vulnerability 2 fixed version: 05.40 for Vulnerability 1, 05.30 for Vulnerability 2... Re: MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client Jordy Zomer (Feb 27) Hey all, First of all, cool findings! I've been working on the CodeQL query and have a revised version that I think improves accuracy and might offer some performance gains (though I haven't done rigorous benchmarking). The key change is the use of `StackVariableReachability` and making sure that there's a path wher e `var` is not reassigned before taking a `goto _;`. Ran it on an older database, found some of the same bugs... MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client Qualys Security Advisory via Fulldisclosure (Feb 20) Qualys Security Advisory CVE-2025-26465: MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client CVE-2025-26466: DoS attack against OpenSSH's client and server ======================================================================== Contents ======================================================================== Summary Background Experiments Results MitM attack against OpenSSH's VerifyHostKeyDNS-enabled client DoS... Self Stored XSS - acp2sev7.2.2 Andrey Stoykov (Feb 20) # Exploit Title: Self Stored XSS - acp2sev7.2.2 # Date: 02/2025 # Exploit Author: Andrey Stoykov # Version: 7.2.2 # Tested on: Ubuntu 22.04 # Blog: https://msecureltd.blogspot.com/2025/02/friday-fun-pentest-series-19-self.html Self Stored XSS #1: Steps to Reproduce: 1. Visit "http://192.168.58.168/acp2se/mul/muladmin.php"; and login with "admin" / "adminpass" 2. In the field "Put the name of the new... Python's official documentation contains textbook example of insecure code (XSS) Georgi Guninski (Feb 20) Python's official documentation contains textbook example of insecure code (XSS) Date: 2025-02-18 Author: Georgi Guninski === form = cgi.FieldStorage() if "name" not in form or "addr" not in form: print("<H1>Error</H1>") print("Please fill in the name and addr fields.") return print("<p>name:", form["name"].value) print("<p>addr:",... Re: Netgear Router Administrative Web Interface Lacks Transport Encryption By Default Gynvael Coldwind (Feb 17) Hi, This isn't really a problem a vendor can solve in firmware (apart from offering configuration via cloud, which has its own issues). Even if they would enable TLS/SSL by default, it would just give one a false sense of security, since: - the certificates would be invalid (public CAs don't give out certs for IP addresses), - they would be easy to clone (due to being self-signed and/or being easy to extract from a similar device), -... Monero 18.3.4 zero-day DoS vulnerability has been dropped publicly on social network. upper.underflow via Fulldisclosure (Feb 16) Hello, About an hour ago, a group appearing to be named WyRCV2 posted a note on the nostr social network, which can be found at the following link: https://primal.net/e/note1vzh0mj9rcxax9cgcdapupyxeehjprd68gd9kk9wrv939m8knulrs4780x7 Save, share, use. The paste link includes a list of nodes that the attacker has instructed to target, along with a Python code to leverage the attack. According to their explanation, this vulnerability is... Netgear Router Administrative Web Interface Lacks Transport Encryption By Default Ryan Delaney via Fulldisclosure (Feb 16) <!-- # Exploit Title: Netgear Router Administrative Web Interface Lacks Transport Encryption By Default # Date: 02-13-2025 # Exploit Author: Ryan Delaney # Author Contact: ryan.delaney () owasp org # Vendor Homepage: https://www.netgear.com # Version: Netgear C7800 Router, F/W 6.01.07, possibly others # Tested on: Netgear C7800 Router, F/W 6.01.07 # CVE: CVE-2022-41545 The administrative web interface of a Netgear C7800 Router running... [CVE-2024-54756] GZDoom <= 4.13.1 Arbitrary Code Execution via Malicious ZScript Gabriel Valachi via Fulldisclosure (Feb 15) In GZDoom 4.13.1 and below, there is a vulnerability involving array sizes in ZScript, the game engine's primary scripting language. It is possible to dynamically allocate an array of 1073741823 dwords, permitting access to the rest of the heap from the start of the array and causing a second array declared in the same function to overlap with this huge array. The result is an exploit chain that allows arbitrary code execution through a... Re: Text injection on https://www.google.com/sorry/index via ?q parameter (no XSS) David Fifield (Feb 15) Today at about 2025-02-13 19:00 I noticed the "≠" is back, but now the type 0x12 payload of the ?q query parameter gets formatted into the string representation of an IP address, rather than being copied almost verbatim into the page. If the payload length is 4 bytes, it gets formatted as an IPv4 address; if 16 bytes, as an IPv6 address. I didn't try a ton of experiments, but it looks like payload lengths other than 4 and 16... SEC Consult SA-20250211-0 :: Multiple vulnerabilities in Wattsense Bridge SEC Consult Vulnerability Lab via Fulldisclosure (Feb 12) SEC Consult Vulnerability Lab Security Advisory < 20250211-0 > ======================================================================= title: Multiple vulnerabilities product: Wattsense - Wattsense Bridge vulnerable version: Wattsense Bridge * Hardware Revision: WSG-EU-SC-14-00, 20230801 * Firmware Revision: Wattsense (Wattsense minimal)... APPLE-SA-02-10-2025-2 iPadOS 17.7.5 Apple Product Security via Fulldisclosure (Feb 10) APPLE-SA-02-10-2025-2 iPadOS 17.7.5 iPadOS 17.7.5 addresses the following issues. Information about the security content is also available at https://support.apple.com/122173. Apple maintains a Security Releases page at https://support.apple.com/100100 which lists recent software updates with security advisories. Accessibility Available for: iPad Pro 12.9-inch 2nd generation, iPad Pro 10.5-inch, and iPad 6th generation Impact: A physical... APPLE-SA-02-10-2025-1 iOS 18.3.1 and iPadOS 18.3.1 Apple Product Security via Fulldisclosure (Feb 10) APPLE-SA-02-10-2025-1 iOS 18.3.1 and iPadOS 18.3.1 iOS 18.3.1 and iPadOS 18.3.1 addresses the following issues. Information about the security content is also available at https://support.apple.com/122174. Apple maintains a Security Releases page at https://support.apple.com/100100 which lists recent software updates with security advisories. Accessibility Available for: iPhone XS and later, iPad Pro 13-inch, iPad Pro 12.9-inch 3rd generation... CVE-2024-55447: Access Control in Paxton Net2 software (update) Jeroen Hermans via Fulldisclosure (Feb 10) CloudAware Security Advisory CVE-2024-55447: Potential PII leak and incorrect access control in Paxton Net2 software ======================================================================== Summary ======================================================================== Insecure backend database in the Paxton Net2 software. Possible leaking of PII incorrect access control. Access cards can be cloned without physical access to the original... ChatGPT AI finds "security concern" (XSS) in DeepSeek's code Georgi Guninski (Feb 10) Summary: On 2025-02-09 ChatGPT AI found "security concern" (XSS) in DeepSeek's AI python code. Background: Consider the simple coding question (Q): Write Python CGI which takes as an argument NAME and outputs: "Hello NAME". First page and results on google for "python CGI" return for me tutorials, which are flawed and textbook examples of the cross site scripting (XSS) vulnerability. This is a... More Lists Dozens of other network security lists are archived at SecLists.Org.'''
