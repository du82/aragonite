title = "MTA to shelve 2021 fare hike for now, citing the economic toll of the pandemic on NYC - Second Ave. Sagas"
description = "Amidst an ongoing pandemic that has decimated the economy and reduced daily transit ridership to essential workers traveling to keep the city and themselves afloat, the MTA Board has tabled…"
full_description = 'Fare Hikes MTA to shelve 2021 fare hike for now, citing the economic toll of the pandemic on NYC by Benjamin Kabak January 19, 2021 written by Benjamin Kabak January 19, 2021 Amidst an ongoing pandemic that has decimated the economy and reduced daily transit ridership to essential workers traveling to keep the city and themselves afloat, the MTA Board has tabled talks of a fare hike, agency officials confirmed on Monday. The decision comes after months of public pressure by both elected officials and transit advocates, and it marks the first time since biennial fare hikes began in 2010 that the MTA Board — and by extension, the governor — has opted to cancel or at least postpone a fare hike. Rumors that the MTA would be delaying the fare hike had been swirling since the New Year, and as the local pile-on from elected officials continued throughout the holidays and into 2021, it seemed as though the politics of a mid-pandemic fare hike would make the move untenable. CBS 2’s Marcia Kramer broke the news, and MTA Chairman and CEO Pat Foye sent out a statement a few hours later explaining the decision: “The COVID-19 pandemic has wreaked economic havoc — devastating the MTA’s ridership and revenues and bringing them to levels far worse than the Great Depression. It has also hit people of color and low income communities hardest, many of whom are the very same essential workers that have been on the frontlines of this crisis and who are also most dependent on mass transit. “As part of our biennial review of fare and toll policy, the MTA conducted the unprecedented level of outreach this year required, holding eight public hearings and receiving 2,100 public comments. What we heard at these hearings was that people are suffering and cannot shoulder even a modest fare increase right now. “Buoyed by President-elect Biden, incoming Senate Majority Leader Chuck Schumer and Speaker Nancy Pelosi, the MTA also has hope for $8 billion in additional pandemic relief and continued federal investment in mass transit in 2021 and beyond. For these reasons, the MTA has decided to postpone the planned fare increase for several months. We plan to move forward with a discussion and vote on recommended toll changes in February.” According to Clayton Guse of The Daily News, the MTA will not move to raise the fares until at least the summer, and I expect the agency to delay the hike until the pandemic abates and transit ridership rebounds significantly. The city’s transit advocates were quick to praise the move. “When riders organize, our governor listens. With offices closed and Broadway dark, a transit fare hike would fall overwhelmingly on essential workers and New Yorkers with no other way to get around beside the bus, subway, and paratransit,” Riders Alliance Policy & Communications Director Danny Pearlstein said. “With the regressive MTA fare hike off the table, Governor Cuomo must now put a stop to state raids on transit-dedicated funds. While riders are breathing a sigh of relief, the governor must craft a bold, progressive solution to his transit agency’s money woes.” For now, the relieve is temporary. The MTA will seek to raise fares within the next six or twelve months, but the decision this week is the right. Last month, as the MTA seemed on a collision course with a public economically drained by the pandemic, I wrote a piece urging the MTA to delay the fare hike, and the reasoning holds up. On the backs of essential riders, the MTA would have raised approximately $79 million in total by implementing a 2021 fare hike, and the agency is still requesting $8 billion from the incoming Biden Administration. It would have been political suicide for any fare hike to go through, and from conversations I’ve had with MTA and state sources, it seems clear the Governor knew this. So what happens next? First, the mystifying debate over the future of unlimited ride fare cards will be delayed a few more months, and that may give us more time to understand why Larry Schwartz, architect of New York State’s current vaccine rollout plan, wants to eliminate them. Second, the bridge and tunnel toll hikes will continue, and this is good public policy. Drivers should be expected to pay more, both as a way to capture the externalities of driving and as a way to encourage transit usages. The MTA hasn’t revealed the specifics of the planned toll hikes, but we know that crossings could increase to as much as $6.70 for New York E-ZPass customers. We also know the MTA is considering variable tolling based on time of day and/or on so-called Gridlock Alert Days, a quasi-congestion pricing plan. Resident discounts and carpool incentives may be reduced as well. Again, these are all fine proposals that should be adopted, especially as bridge and tunnel traffic has recovered significantly faster than transit usage. (Bridge and tunnel traffic is down by only 16-17 percent from pre-pandemic figures while subway and bus ridership have steadied at around 30 and 45 percent of normal, respectively.) Still, the MTA plans to reduce some service. The commuter rail lines will see some trips eliminated as part of a pandemic-related “right-sizing” of weekday service, and New York City Transit has had to cancel around 2 percent of scheduled trips in recent months due to crew unavailability, as Jose Martinez reported on Monday. The LIRR/Metro-North cuts will be approved by the MTA Board, but the subway service reductions remain off the books. Ideally, the MTA won’t have to make further cuts, but the budget remains shaky at best. The big X Factor though involves federal funding. With a technical Democratic majority in the Senate and control of the House, the Biden Administration should be able to secure the rest of the funding the country’s transit agencies have requested, including $8 billion the MTA wants, and the next COVID-19 relief package should include this funding, if Democrats get their way. With no room for error in the Senate, that remains a reasonably sizable “if,” but we should know soon how aggressive Democrats in the Senate will be in determining the future of the legislative filibuster and their political success. The city and the MTA need a strong federal response. For now, though, cooler and saner heads have prevailed, and transit fares will not increase in April, as originally anticipated. This is welcome news for a city and its workforce hoping to reach the light at the end of the pandemic tunnel and the right move by the MTA and Gov. Cuomo. 5 comments 7 FacebookTwitterPinterestEmail Benjamin Kabak previous post Some thoughts on Moynihan Train Hall and designing public spaces with nowhere to sit next post How the vaccine creates a politically expedient way to end the overnight subway closures You may also like Service cuts, fare hikes ‘off the table for... November 17, 2021 The MTA should not raise fares in 2021 December 29, 2020 As part of the 2021 fare hike, the... December 9, 2020 Nixing pay-per-ride discounts, MTA Board approves April fare... February 28, 2019 The Delayed Fare Hike Edition of ‘That’s No... January 29, 2019 Fare hikes and service cuts and death spirals,... November 18, 2018 MTA Board approves fare hike but avoids a... January 29, 2017 Fare hike proposals for 2017 include $3 fare,... November 16, 2016 MTA continues to anticipate a March 2017 fare... July 29, 2016 An FAQ for Sunday’s fare hike; weekend work... March 21, 2015 5 comments Larry Penne January 19, 2021 - 7:50 am Here is one way to make up for lost revenue by cancellation or major reduction to the previously scheduled 4%. In 2019, the MTA estimated it lost over $300 million to fare evasion. The MTA OIG issued a report last September that NYC Transit’s past practices for tracking how many bus and subway riders failed to pay their fare were unreliable and contained sampling shortcomings. This could imply that revenue loses due to fare evasion were far greater. Ridership is significantly less due to COVID-19. Does this translate into a significant decrease in fare evasion? It will be interesting to see the MTA’s statistics for fare evasion for 2020 when they are made public later in 2021.. The MTA’s One Metro New York (OMNY) will be replacing the old Metro Card. Will the MTA become more efficient in reducing fare evasion with the OMNY? According to the MTA’s own McKinsey consultants report, if all goes well, perhaps 80% of the pre-COVID-19 ridership will return by some time in 2024. Whatever happens over the next few years, every dollar counts. The MTA including NYC Transit bus and subway, MTA Bus, LIRR and MNRR need to do a far better job in dealing with fare evasion. It is unfair to keep asking honest commuters to pay a higher fare and continue to see so many who routinely go unpunished for not paying their fare as well (Larry Penner is a transportation advocate, historian and writer who previously worked 31 years for the Federal Transit Administration Region 2 New York Office. This included the development, review, approval and oversight for billions in capital projects and programs for the MTA, NYC Transit, LIRR, MNRR, MTA Bus along with 30 other transit agencies in NY & NJ). Reply Jean Ryan January 19, 2021 - 9:59 am I saw something different. Perhaps the MTA is over estimating how much fare evasion happens. New Yorkers need to get places. What do poor people do who can’t afford transportation? Reply meesalikeu January 22, 2021 - 9:19 pm anxious read your take on the new port authority bus terminal plan agreement. Reply Otis Boone January 24, 2021 - 11:47 pm We need to finally create a dedicated funding stream for the MTA. Systems all over the country (and several publicly-run systems around the world) have a dedicated sales tax somewhere between 1/2¢ and 2¢ that goes towards transit and transportation projects that cannot be raised – since they’re typically approved at county-level. It’s about time to do one of those here in these five counties/boroughs to cover NYC Transit. Reply JJ May 29, 2021 - 12:23 pm It’s so easy to complain about fare hikes, but it’s such a great value , and always has been I’d rather take the train than cab or Uber any day of the week Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. Notify me of follow-up comments by email. Notify me of new posts by email. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
