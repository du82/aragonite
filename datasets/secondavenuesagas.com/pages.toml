["https://secondavenuesagas.com/2021/01/10/some-thoughts-on-moynihan-train-hall-and-designing-public-spaces-with-nowhere-to-sit"]
title = "Some thoughts on Moynihan Train Hall and designing public spaces with nowhere to sit - Second Ave. Sagas"
description = "New York spent $1.6 billion on the Moynihan Train Hall, but all we got was a big waiting room/mall with nowhere to sit. New York spent $4 billion on Santiago…"
full_description = "Moynihan Station Some thoughts on Moynihan Train Hall and designing public spaces with nowhere to sit by Benjamin Kabak January 10, 2021 written by Benjamin Kabak January 10, 2021 A panorama of Moynihan Train Hall, New York State’s attempt at righting the wrongs at Penn Station. (Photo by Benjamin Kabak) New York spent $1.6 billion on the Moynihan Train Hall, but all we got was a big waiting room/mall with nowhere to sit. New York spent $4 billion on Santiago Calatrava’s Oculus, but all we got was a big waiting room/mall with nowhere to sit. New York spent $1.4 billion on the Fulton St. Transit Center, but all we got was a big waiting room/mall with nowhere to sit. Are you sensing a trend yet? Why is New York spending so much money on giant waiting room/malls that all have nowhere to sit? And what does this say about how we’ve chosen to treat our public spaces and transit infrastructure? Must we make every public space so inhospitable to the people using it or can we find a better way? I’ve thought a lot about these questions since visiting the brand-new Moynihan Train Hall on Saturday, and while we have a chance, as a city, to design friendlier public spaces, the opportunity is slipping away. Before I dig into this philosophical discussion on urban policy, let’s talk about Moynihan Hall. It’s very nice – exceedingly nice. It’s so nice that I overheard someone say to his companion, “This place is too nice.” I couldn’t tell if it was a compliment or if he felt truly out of place to be in a clean, light, airy, modern train station in the middle of Manhattan. New Yorkers are so beaten down by the grunginess of Penn Station and the general mediocrity of the design of newer transit infrastructure that something nice is too good to be true. This isn’t New York City; it’s too nice. Moynihan Hall also isn’t finished. None of the shops or restaurants that will make it feel more like London’s St Pancras Station are open yet, and they won’t be until later in 2021. Even though Gov. Andrew Cuomo insisted on opening Moynihan Hall “on time” — whatever that means during the middle of a pandemic when few people are traveling — the building is still a work in progress. Still, it has high ceilings and clear sight lines and bathrooms with three faucets and feels very much a modern train station should feel. Moynihan Train Hall, a glorified and expensive waiting room, plays the role of a state-of-the-art train station quite well, and considering how much of the problems with Penn Station are aesthetic, that may not ultimately be a bad thing. Without capacity upgrades or service improvements, I still can’t shake the feeling it’s the infrastructure equivalent of putting lipstick on a pig. Ultimately, the space looks like the renderings, and after decades of a cramped, crowded Penn Station, the new Hall is a significant visual and environmental upgrade. It makes going to Manhattan to catch an Amtrak or Long Island Rail Road train a pleasant experience. An Art Deco clock looms over the middle of the train hall. (Photo by Benjamin Kabak) The critics have had a lot to say. You can read a review of SOM’s work at Dezeen and an interview with Peter Pennoyer, design of the Hall’s snazzy Art Deco clock, at Architectural Digest. (I love the clock, even if it is very much A Clock A Train Station Should Have According To Andrew Cuomo.) Justin Davidson likes it and took exception to my characterization of lipstick on a pig while Aaron Gordon found it mediocre. Steve Cuozzo thinks it’s a great example of adoptive reuse but says it can’t hold a candle to the original Penn Station. As nice as the new hall is, it isn’t all days of wine and roses. What Penn Station enjoys in location, location, location, the Moynihan Train Hall does not. Penn, situated between 7th and 8th Avenues and one block away from Herald Square, is amidst 14 different subway lines. The entrance to Moynihan is west of every single one of the subway lines, and the Hall itself, with escalators down to the Penn Station platforms, is even further west. It pretends to be a Penn Station replacement but without Penn’s greatest asset, and when the world returns to regular commuting, those heading into the city may find the convenience of Penn and the shorter walk to the subway outweighs a nicer glimpse passing through Moynihan. The hall itself continues the siloed fiefdoms of Penn Station. Although the new hall provides access to Long Island Rail Road and Amtrak trains, you wouldn’t even know New Jersey Transit services Penn Station. There are simply no signs of the New Jersey-bound trains. That’s partially due to the reality that you can’t access every NJ Transit track that far west, but it’s also due to the fact that none of the three entities that use Penn Station get along. Without through-running or capacity increases that won’t arrive until we get new trans-Hudson tunnels and Penn Station South, the Moynihan Train Hall is a testament to the reality that it’s harder to rationalize operations across multiple transit agencies based in different states than it is to simply renovate an old building that was already there. The only seats in the Moynihan Train Hall are reserved for ticketed passengers only. (Photo by Benjamin Kabak) But beyond the politics of improving commuter rail service through the New York City area, a few key aspects of the Moynihan Train Hall speak to decisions we as a city have made regarding our approach to public spaces that do not sit right with me and reflect societal failures to address policy challenges. In a sense, the Moynihan Train Hall is a public space but hostile architecture. It’s designed to look nice, but it’s not designed to encourage reflection or time spent within the space. You are to pass through the space, admire the Instagram-worthy elements of it and leave. Soon you’ll be able to dine and shop as well, but when you’re done with that, get outta here. To hit you over the head with this element, the new building is closed every night from 1 a.m. to 5 a.m., while Penn Station remains open, and there is nowhere to sit. The new hall is a vast open space with narrow escalators leading down to the platforms, clear sight lines, a stunning skylight and no seats. The only waiting areas are reserved for ticketed Amtrak and LIRR passengers, and while station architects say the dining hall will have seats when it opens in the fall, those will be for people who are eating. Moynihan is, like Calatrava’s Oculus, the Fulton St. Transit Center, and the current iteration of Grand Central, a train station with nowhere to sit. Why, you may ask do we make public places so anti-public? The answer is rooted in our inability to house the homeless and our societal fear that New York’s homeless residents will take over public spaces that aren’t designed properly. If Moynihan were open 24/7 as Penn Station is, if Moynihan had seats out in the open, if Moynihan were truly a public space, homeless New Yorkers would not leave, as many do not leave Penn Station, the Port Authority Bus Terminal or even parts of Laguardia Airport. Instead of solving for this specific problem, whether through better housing programs or homeless outreach or humane enforcement of public space, the city and state have opted to turn public spaces into museums. You can look at them, but you can’t stay long because staying long isn’t comfortable. This is, of course, a New York City problem that isn’t constrained to train stations, though the profusion of new train stations in recent years has laid bare this approach to public space. It manifests itself in the lack of public seating throughout the city and the lack of any public restrooms as well. If these spaces don’t exist, then “undesirables” can’t use them or inhabit them. Now, this should not be read as a defense of ceding public space to anyone or turning those spaces into de facto housing at the expense of the general public at large. But a competent and functional government should be able to design nice new train halls that include spaces where the public can relax while enjoying these spaces and policies that address the root of homelessness. We have chosen not to, and as nice as Moynihan Train Hall is — as much of an improvement over Penn Station it is — it’s hard to look beyond the choice made to design the space. These design choices affect more than just the homeless. For anyone facing mobility challenges or anyone pushing luggage or rolling a stroller, Moynihan offers little respite from the constant on-the-go motion of people passing through. It’s a new train hall, where people come and go, without any place for anyone to simply sit and collect themselves for a few minutes, and that’s a design choice we should un-make in the future. 30 comments 16 FacebookTwitterPinterestEmail Benjamin Kabak previous post The MTA should not raise fares in 2021 next post MTA to shelve 2021 fare hike for now, citing the economic toll of the pandemic on NYC You may also like Cuomo’s new Moynihan Station plan restarts debate over... October 6, 2016 Capacity issues draw the short straw in Cuomo’s... January 7, 2016 Once more unto the Moynihan Station morass August 27, 2014 A glimpse of a future for Amtrak’s expensive... March 4, 2014 Moynihan Phase 1 work to start later this... May 9, 2012 Moynihan Phase 1 scaled back amidst cost concerns February 13, 2012 NY officials celebrate as Moynihan ‘Moves Forward’ October 19, 2010 Transit-related developments irk the Empire State Building August 20, 2010 Moynihan construction start in October July 23, 2010 Public Authorities Control Board OKs Moynihan Phase 1 July 22, 2010 30 comments Jeff January 11, 2021 - 12:27 am Simple answer, because any seats would get filled up with bums. I don’t like it either. Reply VLM January 11, 2021 - 12:43 am You should at least pretend to read the article Ben wrote before commenting. He addresses that point in multiple paragraphs. Reply Asher Samuels January 11, 2021 - 12:50 am The more complicated answer is that if seats are only available for people who buy something to eat or drink then it’s a way to generate more rent which means more money for those running the station. Reply Eric January 11, 2021 - 6:21 am This is by far the best assessment I have seen so far. Reply Jude Ahern December 15, 2021 - 5:20 pm It’s horrible let’s be honest Reply OneNYersOpinion January 11, 2021 - 6:33 am In Moynihan, Grand Central, the Oculus and Fulton St, it’s ALL about keeping vagrants from rooting. And to anyone who has experienced Penn Station proper, where it’s perfectly apparent – the trade off is perfectly clear. The only grand indoor place in Manhattan that appears to provide seating while providing seating is the WTC Glass Garden, where there are benches among the palm trees. Security there does an effective and reasonably discreet job of discouraging homeless. In summary – Point made re the lack of seating. However the reasons are obvious, and are justifiable, given our social reality. The people who actually use these transit hubs typically pass through em-route to their next destination and as ticket holders, have seating areas available to them. Gawkers are certainly free to come and view, but their ongoing presence is not a primary benefit to the stations or the commuters. Reply SEAN January 11, 2021 - 11:58 am Unless of course these visitors spend money & then it doesn’t matter if they hang out for long stretches of time. Also as a comparison, our largest international airports in the US have been are becoming mall like as well & there largest complaint by users is lack of gate seating. But of course the hallways themselves – no seating, so this is much the same. Reply Larry Penner January 11, 2021 - 7:24 am The $300 million 8th Avenue West End Concourse, $600 million new 33rd Street Entrance & widening of the Main Concourse also have no seating. There is very limited seating for LIRR riders as part of the new $1.6 billion Moynihan Train Hall. Clearly the lack of seating was deliberately designed to keep homeless people out. This represents $2.5 billion in investments which end up as an inconvenience for LIRR commuters waiting for trains that are periodically delayed due to service disruptions.. In 1992, the estimated cost was $315 million. Several years later, the cost grew to $500 million with the completion date slipping to the late 1990s. What is the current status for paying back a federal $550 million Transportation Infrastructure Finance and Innovation Act (TIFIA) loan which played a major role in financing this project? (Larry Penner is a transportation advocate, historian and writer who previously worked for the Federal Transit Administration Region 2 NY Office. This included the development, review, approval and oversight for billions of dollars in grants which provided funding for capital projects and programs to the MTA, LIRR, New Jersey Transit and over 30 transit agencies in NY & NJ) . Reply Johnny C. August 24, 2021 - 5:10 pm Penner strikes again, this time slightly on topic. Reply BrooklynBus January 11, 2021 - 7:51 am They don’t even deserve credit for the three “innovative” bathroom faucets that allow you to wet, wash and dry your hands in one place. They had this in Germany in 1981 when I visited there. But the German faucets were even better. First came the water, then the soap, and a few seconds later, the same faucet turned into a dryer which were all on a timer. You didn’t even have to walk from one faucet to the other. What took the US so long? All your other points, I agree with. Reply Curious January 11, 2021 - 8:10 am You know, it’s easy to lament the lack of seating and say that the city should instead solve the root problem of homelessness. But in practice what should they really have done here? Homelessness is a massive, extremely difficult, politically charged problem. I don’t think anyone would disagree with your sentiments here Ben, but they do seem a bit idealistic to me. We can’t just wave our wand and get rid of homelessness. And frankly, the area around Penn Station is one of the worst in the city for it! If/when the homelessness problem is ever solved (don’t hold your breath), putting in seats should be a relatively easy retrofit. As it stands, I think they likely make the right decision given the current constraints. Reply Doctor Memory January 11, 2021 - 4:41 pm My only slightly snarky response is that Amtrak’s NYC station should do exactly what Amtrak’s Boston, New Haven, Trenton, Philadelphia, Wilmington and DC stations do and provide ample public seating in the waiting areas and let station personnel and if necessary the NYPD handle any cases where homeless people use those seats in a problematic way. Seriously, the most maddening part of this entire debacle is that people insist that this is some sort of insoluble gordian knot of a quandry when the answer is very simple: do exactly the same thing as in all of the other stations where this "
