["https://secondavenuesagas.com/2021/06/07/inside-east-side-access-18-months-before-the-new-terminal-opens"]
title = "Inside East Side Access, 18 months before the new terminal opens - Second Ave. Sagas"
description = "The last time I had been down into the East Side Access cavern far beneath Grand Central Terminal feels like eons ago. It was 2015, a time when New Yorkers…"
full_description = 'East Side Access Project Inside East Side Access, 18 months before the new terminal opens by Benjamin Kabak June 7, 2021 written by Benjamin Kabak June 7, 2021 Andrew Cuomo leads the scrum atop East Side Access’ 182-foot escalators. (Photo by Benjamin Kabak)Gov. Andrew Cuomo surveys the down escalator underneath 45th St. (Photo by Benjamin Kabak)Looking down the escalators. (Photo by Benjamin Kabak)Going up. The 182-foot escalators will be the longest in the MTA’s system. (Photo by Benjamin Kabak)Inside East Side Access, the passageways are reminiscent of the TWA Flight Center. (Photo by Benjamin Kabak)Major construction on East Side Access has been completed, but finishes and system testing are yet to be done. (Photo by Benjamin Kabak)Looking south toward a dead end underneath Park Ave. (Photo by Benjamin Kabak)Tunnels are dug; tracks are laid; but walls remain bare with 18 months before passengers arrive. (Photo by Benjamin Kabak)A view down the tracks. (Photo by Benjamin Kabak)Signage points the way to street level, anchoring commuters on the Manhattan street grid above. (Photo by Benjamin Kabak)East Side Access in progress. (Photo by Benjamin Kabak)An arched passageway underneath Grand Central but above the LIRR’s new tracks. With bright walls and familiar marvel, the new station is evocative of Grand Central itself. (Photo by Benjamin Kabak)Much work remains to be completed. (Photo by Benjamin Kabak)East Side Access will connect commuters directly with the subways. (Photo by Benjamin Kabak)Ceci n’est past une departure board. (Photo by Benjamin Kabak) The last time I had been down into the East Side Access cavern far beneath Grand Central Terminal feels like eons ago. It was 2015, a time when New Yorkers commuted daily to their midtown offices, and the cavern was very much just that — a large, dark, very unfinished, damp cave that barely resembled a train station. I took a trip down to the LIRR’s new midtown home two weeks ago, and after six years, I can confidently confirm there is a new Long Island Rail Road terminal deep in the ground below Grand Central. New York has successfully built a train station underneath another train station. The occasion for the trip was celebratory as Gov. Andrew Cuomo and his MTA had just announced that morning, though not for the first time, that the 350,000 square foot terminal will open on time by the end of 2022. It seemed oddly fitting for this long-delayed project that’s taken 20 years and $12 billion to construct that it’s big announcement came amidst a pandemic that has shaken commuting patterns to their very core and has left the future of Midtown Manhattan up in the air, but regardless of the oddities of the times, the Long Island Rail Road will serve the East Side in 18 months or so. Prior to the press tour of the new terminal, Cuomo hosted one of his famous/infamous pandemic press conference. This was the first one I’ve had the opportunity to sit through, and the Governor spoke a lot, often extemporaneously, making news here and there (particularly about the Gateway Tunnel), and he spoke at length about the challenges of completing East Side Access. “Thanks to the hard work of the so many people, major construction on this transformative project is now complete and we are proud to announce East Side Access will open up next year,” Cuomo said, “significantly cutting travel times and easing the commute into Manhattan for countless travelers. I’ve been through a lot of difficult infrastructure projects during my time in government, and while this project may have been one the most difficult to get accomplished, its completion will have a huge impact on New York’s economy and vibrancy for generations to come and serve as yet another example of what New Yorkers can do when we put our minds to something.” Cuomo said a lot of eyebrow-raising statements, including claims that the project had stalled out prior to his personal review of it in 2018, and he never mentioned the follow-up L train-inspired review he ordered in April of 2019. He also vowed that the projected 160,000 passengers per day – a relatively paltry total for the billions spent – would be back in their offices by the end of 2022. Maybe he’s right; maybe the world will clamor for the commute and the companionship of the office after 15 months (and counting) of an isolating pandemic. Or maybe the ultimate irony of the East Side Access project will be an opening into a changed world and a changed New York, where we spent countless billions on an under-used deep-bore dead-end terminal underneath Grand Central that never should have been built in the first place. We won’t know this future for a few more years, but this project will never realize full bang for its buck. Gov. Andrew Cuomo chats with reporters during a tour of the East Side Access project. (Photo by Benjamin Kabak) Cuomo’s promise to open the station next year come hell or high water set off some familiar alarm bells. When he last made this promise for Phase 1 of the Second Ave. Subway, he opened the subway before systems testing had been complete, and he drove the opening date by diverting massive MTA resources away from subway maintenance. The subway crisis, which lead to the Subway Action Plan and Andy Byford’s Fast Forward plan, grew out of Cuomo’s push to open the Second Ave. Subway, and Cuomo then later tried to take credit for solutions to the crisis he created. Will this drive to open East Side Access — in a similar state of completion — lead to a repeat of recent history? I’m holding my breath. Neither the city nor the MTA can afford that fate at this moment. But outside of these concerns and my own long-documented skepticism toward this project and the way the cavern beneath a Metro-North terminal not under capacity highlights the lack of inter-agency cooperation with the MTA, I wanted to offer a few observations about the terminal now that I’ve seen it in its near-finished state. It is, first and foremost, very much an Andrew Cuomo Transit Project. While EXCELSIOR isn’t yet plastered all over the place, the main focus on East Side Access is about getting into and out of New York City, and it does very little to improve getting around NYC. Janno Lieber, the head of MTA Construction & Development, could not answer if the agency planned to further rationalize fares to allow Queens commuters rationally-priced access to LIRR. Cuomo himself spoke at length about how East Side Access will free up space at Penn Station for Penn Station Access, another commuter rail-based project designed to facilitate easier access into and out of NYC (though one with more benefits to Bronx commuters than East Side Access will, on Day One, deliver to Queens). Thus, the only state-funded project finished under Cuomo’s watch to increase transit capacity in NYC will be Phase 1 of the Second Ave. Subway (and maybe Phase 2 if Cuomo gets another two terms and it moves forward). Meanwhile, the state has spent or will spend billions on Moynihan Station and the Penn Station South/Empire Station complex, the Tappan Zee Bridge replacement, the airport overhauls and new AirTrain and both East Side and Penn Station Access. New York City, with its transit system run by Andrew Cuomo, continues to get the short shrift. On the physical side, the most evident element of East Side Access is how deep it is. During the press conference, Cuomo tried to sell the depth as a marvel. The new terminal will, he bragged, have 17 high-rise escalators, each 182 feet in length to bring commuters up from 140 feet below Grand Central to the surface. With entrances along Park and Madison Avenues up to around 48th Street, East Side commuters won’t be as far from their offices as they could be, but the depth adds time. The escalators weren’t on during the press tours, but officials said the rides will take 2 minutes at a stand still. These will be the MTA’s deepest escalators, which could spell trouble for an agency with a shaky track record when it comes to escalator maintenance. Will all of these ticket windows ever be fully staffed? (Photo by Benjamin Kabak) The station feels deep in other ways as well. The visual design of the station is very reminiscent of Grand Central itself with similar typefaces and marble used throughout. In an era of OMNY and digital ticketing, there is, for some reason, a massive ticket hall, but I can’t imagine all of the windows ever being staffed. Still, despite bright lights and arching ceilings, the station feels deep. The ceilings are lower than they would be, and there is no sense of place or direction that far underground. When completed the station will feature ample directions, including street signs, to anchor travelers on the Manhattan street grid. Still, it will be bright and clean in the vein of Grand Central when it opens. It’s very deep. Long escalators and low ceilings, despite a generally pleasant, if sterile, aesthetic. And finally, East Side Access will be another transit mall — which is fine, though it also relies on a return of pre-pandemic commute volumes. The MTA plans to lease out 25 new retail spaces in the terminal, which will give NYC it’s fifth train station/mall and fourth new one this century. Unlike the Grand Central retail spaces, which are a part of the street level attraction, the new retail spaces will be deeper underground and out of the way. Some will be in the passageways at the top of the 182-foot escalators and some will be in the halls connecting to 1 Vanderbilt. But these spaces will be geared far more toward LIRR commuters than the malls in the PATH Oculus, Grand Central itself or Moynihan Station are. All of this leads me to wonder how East Side Access will work and what it means for it to work? It’s nearly unique among massive train stations and will rely heavily on a return to the old in an era of the new. It’s a project conceptualized in the 1960s, designed in the 1990s and opened, if on time, in 2022. 31 comments 12 FacebookTwitterPinterestEmail Benjamin Kabak previous post Gov. Cuomo, in charge of the MTA, announces May 17th return of 24/7 subway service next post Lieber replaces Foye, Feinberg departs Transit as N.Y. Senate fails to act on Cuomo MTA plan You may also like Far too late, Cuomo orders L train ‘experts’... April 15, 2019 East Side Access price tag passes $11 billion... April 22, 2018 Inside East Side Access: A new LIRR connection... November 5, 2015 A week of safety concerns as ESA drill... October 31, 2014 East Side in-Access: A mid-project post mortem January 29, 2014 East Side in-Access: Costs could balloon to $10B... January 24, 2014 Musings on East Side Access, Penn Station Access... January 13, 2014 Déjà vu all over again: East Side Access... January 12, 2014 From LI pols, unreasonable opposition to Penn Station... May 5, 2013 Video: East Side Access blasting wraps under GCT April 9, 2013 31 comments Larry Penner June 7, 2021 - 6:45 am Great article! I wonder what ever happened to Governor Cuomo’s 2019 independent audit on this project? Since 2001, the total direct cost has grown from $3.5 billion in 2001 to $11.2 billion today. This does not include $4 billion more for indirect costs known as “readiness projects” carried off line from the official project budget. This includes $2.6 billion Main Line Third Track, $450 million Jamaica Capacity, $387 million Ronkonkoma Double Track, $120 million Ronkonkoma Yard Expansion, $44 million Great Neck Pocket Track just to name a few support direct implementation of East Side Access. The promised opening service date has slipped on numerous occasions from 2009 to December 2022. A detailed project risk assessment by the Federal Transit Administration independent engineer as part of the FTA – MTA 2016 amended ESA Full Funding Grant Agreement predicted a final cost of $12 billion. The MTA has repeatedly increased the budget by billions and pushed back the first day of service by thirteen years. A cat has nine lives and this project long ago already used all of them. When it comes to completion of ESA, the 1960’s LIRR motto “Line of the Dashing Dan” should be changed to “Line of the Slow Moving Sloth.” (Larry Penner — transportation historian and advocate who previously worked for the Federal Transit Administration Region 2. This included the development, review, approval and oversight for grants supporting billions in capital projects and programs on behalf of the MTA and over thirty other transit operators in NY & NJ). Reply Charles Davis June 8, 2021 - 8:45 am Thank you for your informative insights, much appreciated. Reply John June 7, 2021 - 7:31 am It will ultimately be the world’s greatest 350,000 sq ft empty cavern. Shall we name it the “Nursing Home Victims Memorial Tomb?” Reply Jeremiah Clemente June 7, 2021 - 8:45 pm No. It will be named “Alternate Penn Station”. East Side Access and Penn Station Access both serve a second purpose: system resiliency, especially from service diversions (if one terminal is out, trains can travel to the other). Reply Brian June 7, 2021 - 8:48 am New York City has revived itself from far deeper holes than Covid-19. Remember Fort Apache the Bronx days? Reply A June 7, 2021 - 9:18 am I’ve never understood why East Side Access was critical to spend whatever $20 billion on, but New York had to cancel a 7th avenue station in hell’s kitchen to save a few hundred million dollars. Reply Charles Davis June 8, 2021 - 8:27 am ¿Are you referring to the scuppered 42nd & ~12th Ave #7 station? That was regrettable. In fact, a Far West continuation both Down & UpTown is sorely needed. It would revitalize economic backwater areas around Javits, the Yards, Clinton… Even just something elevated or street-level like Jersey City Light Rail… from downtown to uptown. Having said all that, selfishly \ individually I would favor none of it. It would destroy the peace and tranquility of the remaining oases both downtown and up- protected by their geographic remoteness and relative lack of mass access combined. But collectively \ for the City’s good it’d be a home run. West Side doesn’t have enough subway, along with substantial underdeveloped or economically disadvantaged space. Reply DaniBot June 7, 2021 - 9:57 am it commuters really don’t return at scale to the old patterns, the danger goes much deeper than ESA. A change in working patterns to a default of remote work for white collar workers would basically end New York City as we know it and toss its sprawling mass transit system into redundancy. Given that this is the United States and the New York metro is basically the only surviving example of large-scale, ubiquitous mass transit in a mostly human-scale environment, there is no way it would survive if forced to depend on federal subsidy to maintain its service. The arguments from Republican Senators write themselves: “Why should hardworking families in Omaha and Anchorage pay billions of dollars in federal subsidy to keep the trains runnin'
