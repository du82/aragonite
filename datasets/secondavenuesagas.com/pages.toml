full_description = "AsidesL Train Shutdown MTA looking at 14th St. Peopleway, but NYC DOT holds the key by Benjamin Kabak September 15, 2016 written by Benjamin Kabak on September 15, 2016 My apologies for the silence this week. It’s tough to get back in the swing of regular posting while combating jetlag. There’s certainly a lot to talk about — most notably the AECOM discussion piece regarding the 1 train for Red Hook. I saw Chris Ward’s presentation at NYU earlier this week, and we’ll get to that soon enough. It’s not quite a fully-baked or even half-baked proposal, but it’s certainly sent Red Hook into a tizzy (and likely rightly so). Meanwhile, we have some slight movement on the plan to turn 14th Street into a car-free Peopleway for buses, bikes and pedestrians during the L train shutdown. As the Daily News reported earlier this week, MTA officials say they will study a car-free 14th Street as part of its overall effort to model the traffic and transit impact of the L train’s looming outage. Results of the study will be released in the spring, Dan Rivoli reported. This is all well and good, and looking at ways to prioritize transit over private automobiles, especially during the L train shutdown, should be part of the MTA’s general planning approach. But there’s a rub: The ultimate decision to shut 14th St. to cars will rest with NYC DOT, and this agency has not been particularly forthcoming with its plans or aggressive in its actions of late. Of course, we still have 27 months before the L train shutdown begins, but DOT, and not the MTA, will hold the keys to the future of the 14th St. Peopleway. Whether the DOT head is Polly Trottenberg (also currently an MTA Board member) or someone else, that person will be integral in the MTA’s plans to alleviate the impact of the lack of L train. September 15, 2016 12 comments 1 FacebookTwitterPinterestEmail Asides A brief update on the recent lack of posts by Benjamin Kabak July 1, 2016 written by Benjamin Kabak on July 1, 2016 Just wanted to check in with my loyal readers to let you all know that I’m still here! I’ve been traveling a bit over the past few weeks, and among trips, my job and a relatively quiet summer on the transit front, I’ve let daily posts slip a bit. I have some catching up to do regarding recent news on SBS ridership and travel time figures and a lawsuit over subway accessibility and MTA ADA compliance. I should be back to a semi-regular schedule next week, and I’ll put up the service advisories for the long weekend later on Friday. Thanks to all who have reached out asking about the posts. Everything is a-OK, and I’m still here. Stay tuned, as always, for more. July 1, 2016 6 comments 1 FacebookTwitterPinterestEmail"
