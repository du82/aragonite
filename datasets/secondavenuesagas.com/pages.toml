title = "Bronx Archives - Second Ave. Sagas"
full_description = "BronxMetroCardMTA TechnologyStaten IslandView from Underground Links: MetroCard money, an extended 3 train and SI countdown clocks by Benjamin Kabak January 24, 2014 written by Benjamin Kabak on January 24, 2014 I’ve been sitting on a bunch of open tabs for a little while and thought it would be a good idea to get around to sharing these. These are stories I found interesting or newsworthy but just haven’t had an opportunity to post here. $500 million from unused MetroCards I’ve talked a bit about the MTA’s new green fee and the money realized from unused MetroCards, and a recent piece in The Times put those dollars into context. Throughout the first decade of the 21st century, the MTA collected half a billion dollars from unused fares. Since straphangers have to pre-pay for MetroCards, dollars that are left on the cards long after their expiration dates remain with the MTA, and on an annual basis, the money is a small, but important, part of the agency’s annual budget. Unused fares isn’t something that’s come about because of the MetroCard era. Back in the day, New Yorkers would buy tokens and never use them. They would get lost, get forgotten, get overlooked, and the MTA could collect those fares. But today with uneven bonuses that make the math of a free fare more difficult, more dollars are left on cards that expire, and the $1 fee for new MetroCards means revenue as well. As the MTA phases out the MetroCard — the topic of my March 19 Problem Solvers session — these unused fares may diminish a bit. The next system may well be a pay-as-you-go set-up that doesn’t focus around any proprietary fare collection system. While the MTA will lose the money from unused fares, it will also drastically reduce the amount it has to spend to collect fares. That’s a win for the customers, and a win for the transit agency as well. Send the 3 to the Bronx As New York City subways go, the 3 train runs an odd route. It stretches deep into Brooklyn but then stops short of anything in Manhattan. It terminates at 148th St. near the Lenox Yard and goes no further north. In a piece at Welcome2TheBronx, Richard Garey argues for extending the train to the Bronx. With the need for some cross-Bronx subway service and the incoming soccer facility near Yankee Stadium, the time may be right to look at some subway extension options. Garey’s post focuses on the 3 train as a way to serve neighborhoods that once enjoyed streetcar service and now don’t, but I think he has the routing wrong. The 3 shouldn’t end up as another north-south route in the Bronx but could instead cut across the borough, serving areas that don’t have good cross-Bronx transit options while boosting subway service. It is, after all, a fast ride downtown on the IRT express. Without a massive infusion of cash, we’re just dreaming, but it’s an intriguing proposition after all. Unhappiness at 149th Street For years, I’ve been using the 149th Street-Grand Concourse subway stop as a transfer point on the way to Yankee Stadium, and for years, it has been one disgusting station. The walls were marred by leaking pipes, and on the way home from a World Series game in 2001, my sister and I saw squirrel-sized rats on the uptown 2/5 platform. It was very, very unpleasant. Recently, the station underwent a renovation, but a few area residents are unhappy. One transit buff took a video tour of the station post-renovation and discovered some subpar work. Meanwhile, another group of residents wants to restore elevator service that was shuttered 40 years ago. As best as I can tell, the elevator in question went from the 2/5 platform to street level. The MTA has no money, and protestors hope Mayor de Blasio can help out. I wouldn’t hold me breath. Countdown clocks for the SIR Thanks to an infusion of funds from Council member Vincent Ignizio, four stations along the Staten Island Railway — Great Kills, Eltingville, Annadale and Huguenot — now have countdown clocks. The work is part of a $675,000 initiative funded by Ignizio’s office that will eventually include a Subway Time component that will add these SIR stations to the MTA’s tracking app. For now, the information is available on the St. George-bound side, but Tottenville-bound service will have its time in the sun as well. If you pay for it, it will come. January 24, 2014 20 comments 4 FacebookTwitterPinterestEmail"
