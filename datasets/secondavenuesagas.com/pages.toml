["https://secondavenuesagas.com/2015/01/29/a-postmortem-for-now-on-cuomos-laguardia-airtrain-plan"]
title = "A postmortem (for now) on Cuomo's LaGuardia AirTrain plan - Second Ave. Sagas"
description = "Gov. Andrew Cuomo’s decision to shut the subway system on Monday night wasn’t the most surprising transit development coming from the governor’s office this past week. Prior to this week’s…"
full_description = "Queens A postmortem (for now) on Cuomo’s LaGuardia AirTrain plan by Benjamin Kabak January 29, 2015 written by Benjamin Kabak January 29, 2015 A nice idea, but is Cuomo’s LaGuardia AirTrain the right one? Gov. Andrew Cuomo’s decision to shut the subway system on Monday night wasn’t the most surprising transit development coming from the governor’s office this past week. Prior to this week’s snow brouhaha, Gov. Andrew Cuomo’s other idea — an AirTrain to LaGuardia Airport — dominated the transit press coverage. As you’ll recall, seemingly out of nowhere, Cuomo announced a plan to build an AirTrain for $450 million from Willets Point to LaGuardia via the Grand Central Parkway. In theory, improving rail access to LaGuardia is a great idea that needs a champion; in practice, Cuomo’s idea isn’t one we should rush to embrace by any means. When I had a chance to delve into Cuomo’s proposal last week, I wasn’t too impressed. He picked the worst choice out of three or four possible routings, and the money seemed optimistically low. Since then, I’ve learned that, much like Mayor Michael Bloomberg’s idea to send the 7 to Secaucus, the Govornor’s AirTrain proposal doesn’t have much backing it. The cost estimates can’t be traced to any recent (or, for that matter, old) study, and it’s not clear from those at the MTA how or why the governor chose this plan or why the Port Authority is not involved as it was with the JFK AirTrain. I’m not alone in casting a skeptical eye toward Cuomo’s plan, and as part of today’s postmortem — likely not to be the final word on this idea — I’d like to look at three other takes. The first comes to us from Yonah Freemark who dusted off The Transport Politic to share his thoughts on the proposal. Freemark’s headline sums it up: The LaGuardia AirTrain “will save almost no one any time.” He writes: Governor Cuomo’s project would not have any of the negative community effects the proposal from fifteen years ago had. Its elevated tracks would be hidden behind a much more noisy and already-existing highway. Moreover, its terminus station at Mets-Willets Point would be surrounded by parking lots and sports facilities. These attempts to shape a project that does nothing to disturb existing communities, however, has produced a proposal that would be worthless in terms of time savings for people traveling from the airport in almost all directions… Transit travel times from LaGuardia to destinations throughout New York City — from Grand Central in Midtown Manhattan to Borough Hall in downtown Brooklyn to Jamaica in central Queens to Yankee Stadium in the Bronx — would be longer for passengers using the AirTrain than for passengers using existing transit services already offered by the Metropolitan Transportation Authority. This finding suggests that for most people in the Bronx, Manhattan, Queens, Brooklyn, and Long Island, AirTrain services will not be beneficial from a time perspective. Given the fact that the AirTrain services would likely be automated, therefore reducing labor costs, it may be reasonable to assume that existing transit services to the airport would be eliminated to save costs. In other words, people may be forced to switch into the new, slower rail option. That, alone, should be enough to doom the project, and based on Freemark’s study, both an AirTrain from Jackson Heights or a direct extension of the N train from Astoria would be the preferred build as both have essentially equal travel times from popular destinations. As Freemark states, “It’s hard to imagine how the state can justify spending half a billion dollars on a transit project that will increase travel times for most people.” Over the weekend, Nate Silver offered his analysis of public transit options for airport travel. Picking up on my piece and Freemark’s analysis, Silver determines, unsurprisingly, that transit options to U.S. airports are by and large terrible. Even with the AirTrain, most travelers would be far better off taking a cab from LaGuardia to popular destinations factoring travel times and cab fares in a cost-benefit analysis. A viable proposal would seek to flip that result. Finally, I urge you to read Alon Levy’s analysis of the political theory behind Cuomo’s decision. Levy brings up the idea that, by starting the debate with the Willets Point plan, he has framed it in such a way that he wins. Cuomo’s approach to transit planning is a top-down one that omits community feedback and benefits a very specific constituency — airport travelers. With no stops in populated neighborhoods that need transit access, Cuomo can allege to stifle NIMBYism without actually offering anything useful. Levy, in fact, thinks we should ignore Cuomo’s plan altogether. He writes, “In such a climate, as soon as we talk about tweaks to Cuomo’s plan, Cuomo’s already won; whatever happens, he will reap the credit, and use it to buy political capital to keep building unnecessary megaprojects. Even trying to make the best of a bad situation by making the airport connector better is of little use, since Cuomo will support the plan that maximizes his political capital and not the one that maximizes transit usage even within such constraints as “must serve LaGuardia.'” I believe Alon has a very good point, but I’m trying hard, and usually failing, to be less cynical about this plan. LaGuardia access seems to have a champion even if we don’t know what his true motives or underlying rationale are. The key though is opportunity. If New York sees through Cuomo’s plan, we’ve built something, but is that something good or even good enough? We have to remember that we have only one chance. Once the first dollar is allocated and the first pylon is sunk, New York will stuck with whatever Cuomo has decided. Based on the current proposal with its circular routing, slow travel times, and mysterious budget, that’s a scary thought for our future. 152 comments 3 FacebookTwitterPinterestEmail Benjamin Kabak previous post A postmortem on Cuomo’s questionable subway snow decision next post A postmortem on a postmortem: MTA’s snow plan; LGA AirTrain’s true cost You may also like Long-awaited Rockaway Beach Branch study reveals subway, LIRR... November 20, 2019 The Laguardia AirTrain is still happening, for some... February 26, 2017 Thoughts on Cuomo’s Laguardia AirTrain vaporware June 15, 2016 MTA to study transportation options for Rockaway Beach... April 4, 2016 Assembly budget includes dollars for Rockaway Beach Branch... March 18, 2016 Ahead of 2nd Ave. Subway opening, MTA officially... February 19, 2016 Mayor set to endorse $2.5 billion Brooklyn-Queens waterfront... February 4, 2016 A look at the initial studies for a... January 8, 2016 On the Montauk Cutoff and a lesson from... December 7, 2015 For NYC’s transit deserts, Riders Council suggests ‘Freedom’ December 3, 2015 152 comments Andrew January 29, 2015 - 12:34 am I agree largely, though not entirely, with Levy. There’s a natural assumption here that Cuomo’s goal is to improve access to LaGuardia. It isn’t. As a transit line serving LaGuardia, Cuomo’s plan is obviously deeply flawed. It’s so obvious that even Cuomo would have noticed if he had been thinking about transit service to LaGuardia. This isn’t about LaGuardia. It’s about Willets Point. http://www.streetsblog.org/201.....1807254307 Debating where exactly this AirTrain should go instead of Willets Point misses the point entirely. Anything that doesn’t go to Willets Point is automatically off the table. Instead of asking where this AirTrain should go, we should be asking how this $450 million (ha!) should be spent instead. There’s no shortage of transportation projects that could desperately use the cash. For instance, maybe he could use it to help plug the gaping hole in the MTA’s new Capital Plan. Reply Rob January 29, 2015 - 11:45 am So the connection to Willets Point is about Cuomo supporting Sterling Equities? Is there a campaign funding connection? Reply SEAN January 29, 2015 - 7:41 pm Is there a campaign funding connection? I think the answer is self evident Reply Dan January 30, 2015 - 5:13 pm But is it actually going to serve Willets Point other than in terms of people coming straight from the airport (which I doubt would be very many)? You already have the train/subway station there and as far as we know, this AirTrain would make no stops in between. Reply BronxSteve February 2, 2015 - 3:23 pm It would benefit W.Point because the existence of the AirTrain would require LIRR to serve their station there with regular service (now it only is used for sports events) and probably even have fairly frequent service (half-hourly). John-2 January 29, 2015 - 12:38 am Cuomo’s plan is basically the path of least resistance. But it does contain the reality that any AirTrain to Astoria or Jackson Heights has to run down the Grand Central Parkway and/or the Brooklyn-Queens Expressway, because trying to run an elevated line through any other area is NIMBY nightmare just waiting to happen. Even the route to Astoria would face a fight to go to the Ditmars Blvd. station instead of Astoria Blvd. — let alone the problems with getting past the Hell’s Gate viaduct — while potential NIMBY fights in the Roosevelt Avenue area could end up leaving the AirTrain terminus at the 7 train’s 69th Street stop, instead of the far more useful 74th-Broadway station. Cuomo’s propsal may be the least useful of the three, but at least you can see why it was chosen, and that’s to have a project that the governor might be able to both start and finish while in office, as opposed to one he starts and the next governor or the one after that gets to do the ribbon cutting on. For a governor who wants to take credit for everything good the MTA does while escaping any blame for it’s problems, ruffling as few neighborhood feathers as possible is the deciding factor in the route. Reply Andrew January 29, 2015 - 1:02 am The path of last resistance is to not build anything at all. Which, given the options on the table, is the appropriate path. Reply Ray January 29, 2015 - 7:59 am I’m surprised by the whipping Cuomo gets on this blog. I moved to New York from California eight years ago where we were lucky to get a rapid bus project discussed at the county level. While I know he has his faults, I am thrilled to have a governor who wants to engage on infrastructure: Tappan Zee, airport redevelopment, rail access, Penn Station redevelopment, Metro North west side access, new subway cars, keeping the second ave project funded. Perhaps he’ll turn out to be a fair weather friend of mobility in the end, I don’t know. I suppose we can judge him by his record when he’s done. Yet for now, I will support the governor who is willing to make an effort. Reply VLM January 29, 2015 - 8:16 am Cuomo deserves this because planning without regard for utility or use is worse than no-build. His Tappan Zee Bridge didn’t allow for adequate transit, and the funding is a disaster. The LGA AirTrain plan is, as Ben and numerous others have noted, a worse option than the alternatives. Metro-North’s Penn Station Access is a good project, but one that’s been in the planning stages long before Cuomo was governor. He doesn’t deserve and shouldn’t take credit for it. Reply Justin Samuels January 29, 2015 - 8:39 pm If people on here can do better than Cuomo they are more than free to run for office themselves. At a certain point being critical of everything the governor does when you yourself cannot get elected to office is just plain meaningless. LGA-Airtrain is not worse than the alternatives, considering that residents in Astoria and Jackson Heights will not allow elevated trains to cross those neighborhoods to the Astoria and Queens Blvd lines. The people on this forum can be train fantatics to the point where they can’t see anything but their wildest transit expansions (like the Utica Avenue line which is in absolutely no danger of manifesting this century). Reply Henry January 29, 2015 - 10:49 pm So criticism of spending a half billion dollars when the MTA is fifteen billion in the hole is unwarranted unless we have political aspirations? Mobility wise, it’s the worst of all options, and in the grander financial context of no or shaky funding for Gateway, the Capital Plan, the Tappan Zee, and other projects, this is just downright reckless. Reply Alon Levy January 30, 2015 - 3:31 am None of us is the son or daughter of a governor. Some of us aren’t even enfranchised in New York, but even the eligible voters here don’t have the right pedigree. Why don’t you ask people why they don’t become English kings and queens? LGA-AirTrain is worse than No Build, and contrary to the perception among the authoritarians of neighborhood residents as irredeemable NIMBYs, the plan that the Astoria NIMBYs opposed wouldn’t have given them any extra stop. What would they have gotten from the whole thing? Access to LGA? They don’t fly that often to care. As for Utica, why is this so wild? In the postwar decades, it was supposed to be built right after SAS. In the 1970s, the plan was to have it open by 1992. What’s wild is that the local elites decided that area is no longer worth their attention and directed billions of dollars into airport connectors and the 7 extension. Reply Joey K January 29, 2015 - 9:23 am You mention all of these projects as if Cuomo has either led the way with them or seen them through to the benefit of transit advocates. The Tappan Zee Bridge replacement was a very long coming, and Cuomo shelved any transit from being built without as much as a reasonable explanation. Airport redevelopment hasn’t happened yet, it’s just been talked about. And before his LaGuardia airport design competition was even finished (the deadline is at the end of this week), he announces this doomed AirTrain plan. It shows how “open” his contest really was. Penn Station redevelopment has gone nowhere, although there should be much more consideration into renovation as opposed to the RPA’s carte blanch move and rebuild plan. I’m not sure Cuomo understands the intricacies of the Penn situation. Metro North Penn access has also been on the table for years before Cuomo took office. He’ll end up taking credit for it if it ever gets going, but it’s still unclear how Penn Station is supposed to absorb more trains and more passengers considering it can’t deal with the ones it already has, especially considering East Side Access is still at least 6 years away from completion. I don’t think Cuomo has a clue when it comes to transit or really any large scale urban planning. Do you remember his wacky plan to build the country’s largest convention center at the Aqueduct Raceway? What a joke… Reply Bolwerk January 29, 2015 - 10:12 am You can’t just build infrastructure for infrastructure’s sake. Nearly every project you list is of spurious value for mobility or has little to do with Cuomo. Reply SEAN January 29, 2015 - 11:18 am Bolwerk, What you "
