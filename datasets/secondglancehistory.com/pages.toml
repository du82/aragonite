title = "Christmas Don’ts – Second Glance History"
description = "♪ You better watch out,You better not cry,Better not pout,I'm telling you why:History is coming to town. ♪ These days, it’s not hard to make Santa’s “nice list,” especially with a spy, er, elf always looking over your shoulder. But in centuries past, the holiday season could bring worse fates than coal in your stocking.…"
full_description = 'Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! StoryChristmas Don’tsOn December 25, 2024 by Elyse♪ You better watch out,You better not cry,Better not pout,I’m telling you why:History is coming to town. ♪These days, it’s not hard to make Santa’s “nice list,” especially with a spy, er, elf always looking over your shoulder. But in centuries past, the holiday season could bring worse fates than coal in your stocking.Fortunately, Second Glance History has compiled the rules you didn’t know you needed to not only stay on Santa’s good side but keep yourself safe from rampaging reindeer and other Christmas catastrophes. <img data-recalc-dims="1" fetchpriority="high" decoding="async" width="1024" height="803" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-horse.jpg?resize=1024%2C803&#038;ssl=1" alt="" class="wp-image-4044 lazyload" style="width:422px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-horse.jpg?w=1024&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-horse.jpg?resize=300%2C235&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-horse.jpg?resize=768%2C602&amp;ssl=1 768w" sizes="(max-width: 1024px) 100vw, 1024px" />1919 photograph from the Library of Congress. Don’t spy on animals.Horses and cattle in the German Alps are believed to possess the gift of speech upon Christmas Eve, but to play the eavesdropper upon them means death before the New Year.According to an Alpine legend, a doubting servant once hid in his master’s barn loft upon a Christmas Eve to prove to his neighbours that they were fools to believe such trash.Upon the stroke of twelve he heard a farm horse say, “We shall have hard work to do this day week.”“Yes,” replied his mate, “the farmer’s servant is heavy, and the way to the churchyard is long and steep.”Upon New Year’s Day the servant was buried.– The Manilla Express, December 24, 1902In the Alps and everywhere else, snitches get stitches.<img data-recalc-dims="1" decoding="async" width="1024" height="753" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mail.jpg?resize=1024%2C753&#038;ssl=1" alt="" class="wp-image-4043 lazyload" style="width:440px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mail.jpg?w=1024&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mail.jpg?resize=300%2C221&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mail.jpg?resize=768%2C565&amp;ssl=1 768w" sizes="(max-width: 1024px) 100vw, 1024px" />Early 20th-century photograph from the Library of Congress.Don’t send gifts by mail.The Birmingham postal authorities are embarrassed by an extraordinary number of Christmas messages and gifts, which, through insufficient addresses, have found their way to the dead letter department.They include 12,000 Christmas cards, 30,00 letters, and 600 parcels. The last include a great variety of articles, ranging from false teeth and wooden legs to Devonshire cream and game in various degrees of freshness.– The Evening Express, January 2, 1909If anyone tried to send me cream or meat by way of Birmingham, thanks, but no thanks. It’s the thought that counts.<img data-recalc-dims="1" decoding="async" width="295" height="413" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Oyster.png?resize=295%2C413&#038;ssl=1" alt="" class="wp-image-4041 lazyload" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Oyster.png?w=295&amp;ssl=1 295w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Oyster.png?resize=214%2C300&amp;ssl=1 214w" sizes="(max-width: 295px) 100vw, 295px" />Oyster illustration from the Pacific Commercial Advertiser, October 9, 1901. Don’t serve oysters.Señor Herrero, who won the second prize in a Christmas lottery, celebrated the occasion with a plate of oysters. The first oyster which he opened contained a large pearl. Señor Herrero hurried out and sold the pearl to a dealer for £100.Meanwhile the bar was crowded with men and women clamoring to be served with oysters. The stock was quickly sold out and consumed, but as no pearls were found the disappointed customers wrecked the restaurant.– The Wanganui Chronicle, January 2, 1925It was after this unfortunate occurrence that restaurants started serving complimentary desserts with candles for special occasions instead of pearls.<img data-recalc-dims="1" decoding="async" width="524" height="216" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mistletoe.jpg?resize=524%2C216&#038;ssl=1" alt="" class="wp-image-4042 lazyload" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mistletoe.jpg?w=524&amp;ssl=1 524w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Christmas-mistletoe.jpg?resize=300%2C124&amp;ssl=1 300w" sizes="(max-width: 524px) 100vw, 524px" />1893 cartoon from the Library of Congress.Don’t mess with mistletoe.In remote country parts it is still believed that he or she who breaks mistletoe from a tree instead of cutting it will meet with an accident within Christmastide.– The Lyttelton Times, December 26, 1919Fortunately, there’s no injunction against strategically hanging that mistletoe above your sweetheart.Follow these simple don’ts, and you and your loved one are guaranteed to have a history-approved merry Christmas and a happy New Year!<img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=289%2C75&#038;ssl=1" alt="" class="wp-image-2385 lazyload" width="289" height="75" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=1024%2C269&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=300%2C79&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=768%2C202&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?w=1149&amp;ssl=1 1149w" sizes="(max-width: 289px) 100vw, 289px" />Am I trying too hard?Recent Posts You May Have MissedChristmas Don’tsGet the Party GrowingEverything You Never Wanted to Know about GhostsTabloid TypecastingYou Say “Potato,” I Say “Potahto,” Let’s “Pot-duel”Multipurpose Your MattressesDid you click through Facebook or Twitter? We got lucky—don’t let social media algorithms keep you from seeing a post! Save yourself a click, and subscribe to have stories delivered to your inbox as soon as they’re published.Disclaimer: The modern era is far from the first to grapple with rampant “fake news.” As I am neither a historian nor journalist, I make no claims about the accuracy or lack thereof of the above sources. I assert only that they make for a good story.Share this:Click to email a link to a friend (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Reddit (Opens in new window)Tags: 20th Century, Animal, Birmingham, Christmas, Dead Letter, England, Germany, Holiday, Horse, Letter, Mail, Newspaper, Oyster, Post Office, Restaurant, Spain, United KingdomLeave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment *Name * Email * Website Notify me of follow-up comment