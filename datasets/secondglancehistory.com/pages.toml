title = "Everything You Never Wanted to Know about Ghosts – Second Glance History"
description = "‘Tis the season for ghost stories, out-of-work spirits and erm, haunted gates. But what do we really know about ghosts, other than they’re friendly, can be trapped in glorified vacuum cleaners and occasionally dance with their still-living partners? Ghosts like their pints as much as the rest of us. All ghosts, according to the [Encyclopedia…"
full_description = '''Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! StoryEverything You Never Wanted to Know about GhostsOn October 30, 2024 by Elyse‘Tis the season for ghost stories, out-of-work spirits and erm, haunted gates. But what do we really know about ghosts, other than they’re friendly, can be trapped in glorified vacuum cleaners and occasionally dance with their still-living partners?Ghosts like their pints as much as the rest of us.All ghosts, according to the [Encyclopedia of German Superstition], like beer. The best method to catch them is to place a half emptied beer bottle near where the ghost is likely to make its appearance. The ghost, according to ancient German beliefs, is bound to creep into the bottle, because it cannot resist the liquid.All one has to do apparently is to put the stopper on and the ghost is bottled up. Even the famous White Woman, whose appearance is said to predict the death of a member of the Hohenzollern family, is listed in the encyclopedia as a beer addict.– The Auckland Star, November 6, 1934If your drinking problem gets you trapped in the bottle – literally – it might be time to try AA: Apparitions Anonymous.<img data-recalc-dims="1" fetchpriority="high" decoding="async" width="256" height="256" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Ghost-drinking-beer.png?resize=256%2C256&#038;ssl=1" alt="" class="wp-image-3999 lazyload" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Ghost-drinking-beer.png?w=256&amp;ssl=1 256w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Ghost-drinking-beer.png?resize=150%2C150&amp;ssl=1 150w" sizes="(max-width: 256px) 100vw, 256px" />Image generated at Craiyon.com.Ghosts are cannibals.What do ghosts like to eat? Us, as it turns out.A message from Johannesburg says that manifestations alleged to be of a ghostly character have been causing considerable excitement at Turffontein. Various members of a local family declare that they have repeatedly seen a ghost about the house, which, in addition to playing all manner of pranks, has actually bitten one of the occupants. The family doctor is said to have been present when the biting incident occurred.– The Flintshire Observer, June 3, 1910 Zombies aren’t the only spooky creatures with a taste for human flesh.Ghosts possess spiders.As if poisonous spiders weren’t scary enough, allow me to introduce otherworldly arachnids:The hideous “Cardinal Spiders,” which are a constant dread to residents at Hampton Court, are supposed to be inhabited by the evil spirit of Cardinal Wolsey. Their bite is poisonous, and when several of them crawl simultaneously over the oaken floors they sound for all the world like a number of castanets being loudly rattled by inexperienced hands.– The Otago Witness, May 8, 1907<img data-recalc-dims="1" decoding="async" width="256" height="256" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Ghost-spider.png?resize=256%2C256&#038;ssl=1" alt="" class="wp-image-4000 lazyload" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Ghost-spider.png?w=256&amp;ssl=1 256w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Ghost-spider.png?resize=150%2C150&amp;ssl=1 150w" sizes="(max-width: 256px) 100vw, 256px" />Image generated at Craiyon.com.Ghosts have manners.When they’re not too busy being humanity’s worst nightmare, ghosts can be quite polite:The little village of Tumble. . . is now suffering through the presence of a spook. The ghost’s behaviour is reported as being decorous in the extreme. It does not go in for smashing crockery a la ‘poltergeist,’ but simply comes in at a certain time of the night to a bedroom, says ‘good-night,’ and leaves—till the following night.– The Llanelly Star, December 31, 1910There you have it. If you see any ghosts wandering around this Halloween, be polite, offer them a drink and if they have eight legs and/or are carrying castanets—run.<img data-recalc-dims="1" decoding="async" width="1024" height="666" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?resize=1024%2C666&#038;ssl=1" alt="" class="wp-image-4001 lazyload" style="width:560px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?resize=1024%2C666&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?resize=300%2C195&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?resize=768%2C500&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?resize=1536%2C999&amp;ssl=1 1536w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?resize=2048%2C1333&amp;ssl=1 2048w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Halloween-ghost.jpg?w=2340&amp;ssl=1 2340w" sizes="(max-width: 1024px) 100vw, 1024px" />From the Evening Star, October 24, 1908.<img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=289%2C75&#038;ssl=1" alt="" class="wp-image-2385 lazyload" width="289" height="75" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=1024%2C269&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=300%2C79&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=768%2C202&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?w=1149&amp;ssl=1 1149w" sizes="(max-width: 289px) 100vw, 289px" />Am I trying too hard?Recent Posts You May Have MissedChristmas Don’tsGet the Party GrowingEverything You Never Wanted to Know about GhostsTabloid TypecastingYou Say “Potato,” I Say “Potahto,” Let’s “Pot-duel”Multipurpose Your MattressesDid you click through Facebook or Twitter? We got lucky—don’t let social media algorithms keep you from seeing a post! Save yourself a click, and subscribe to have stories delivered to your inbox as soon as they’re published.Disclaimer: The modern era is far from the first to grapple with rampant “fake news.” As I am neither a historian nor journalist, I make no claims about the accuracy or lack thereof of the above sources. I assert only that they make for a good story.Share this:Click to email a link to a friend (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Reddit (Opens in new window)Tags: 20th Century, England, Germany, Ghost, Halloween, Holiday, Newspaper, South Africa, Tumble, Turffontein, United Kingdom, Wales2 comments <img alt='' src='https://secure.gravatar.com/avatar/f2abaebf2e47e7dce40cc2df1a9e0e27?s=80&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/f2abaebf2e47e7dce40cc2df1a9e0e27?s=160&#038;d=mm&#038;r=g 2x' class='avatar avatar-80 photo lazyload' height='80' width='80' decoding='async'/> David November 2, 2024 at 4:28 pm Reply And here I thought ghostly victuals consisted of breakfast foods – Ghost Toasties and evaporated milk… <img alt='' src='https://secure.gravatar.com/avatar/63455fb7b9bb1770759b92c31666f0d2?s=80&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/63455fb7b9bb1770759b92c31666f0d2?s=160&#038;d=mm&#038;r=g 2x' class='avatar avatar-80 photo lazyload' height='80' width='80' decoding='async'/> Elyse Nove