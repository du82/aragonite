description = "1908 photograph of Harry Houdini standing by the Charles River wearing chains and handcuffs. From the Library of Congress. We all have that one friend who takes the joke too far: A singular and amusing case came up at Dublin Police-court on Saturday, a clerk, named Thomas Summer, being charged with handcuffing Richard M’Cormack. The…"
full_description = 'Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! ClipClip of the Week: September 18, 2024On September 18, 2024 by Elyse<img data-recalc-dims="1" fetchpriority="high" decoding="async" width="768" height="709" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/09/Houdini-e1726671664955.jpg?resize=768%2C709&#038;ssl=1" alt="" class="wp-image-3954 lazyload" style="width:606px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/09/Houdini-e1726671664955.jpg?w=768&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/09/Houdini-e1726671664955.jpg?resize=300%2C277&amp;ssl=1 300w" sizes="(max-width: 768px) 100vw, 768px" />1908 photograph of Harry Houdini standing by the Charles River wearing chains and handcuffs. From the Library of Congress. We all have that one friend who takes the joke too far:A singular and amusing case came up at Dublin Police-court on Saturday, a clerk, named Thomas Summer, being charged with handcuffing Richard M’Cormack.The evidence showed that the prisoner and a friend visited the Tivoli Music-hall on the previous evening, and there witnessed the performance of a lady “manacle expert.” They afterwards went to a billiard-saloon, where, for a joke, Summer handcuffed the complainant.M’Cormak’s shouts brought a policeman on the scene, and the too practical joker was locked up for the night. The magistrate said he was satisfied that only a joke was intended, and discharged the accused.– The Evening Express, February 8, 1909At least M’Cormak didn’t end up married to a stranger and arrested in Tuckahoe. Which might have been preferable to what happened to this poor kid:A youth, 18 years of age, was found almost strangled in a house in Sutherland road on Saturday afternoon, and was at once brought in to the Hospital for treatment.Inquiries followed, and it was suggested that the youth, who, according to one version, had aspirations to the title of a handcuff king, had made a serious mistake with one of his escapes, and as a result had been unable to free himself.– The Hawke’s Bay Tribune, January 25, 1922No word on the identity of the wannabe escape artist, but it’s safe to say we can eliminate Harry Houdini.<img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=289%2C75&#038;ssl=1" alt="" class="wp-image-2385 lazyload" width="289" height="75" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=1024%2C269&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=300%2C79&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=768%2C202&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?w=1149&amp;ssl=1 1149w" sizes="(max-width: 289px) 100vw, 289px" />Am I trying too hard?Recent Posts You May Have MissedChristmas Don’tsGet the Party GrowingEverything You Never Wanted to Know about GhostsTabloid TypecastingYou Say “Potato,” I Say “Potahto,” Let’s “Pot-duel”Multipurpose Your MattressesDid you click through Facebook or Twitter? We got lucky—don’t let social media algorithms keep you from seeing a post! Save yourself a click, and subscribe to have stories delivered to your inbox as soon as they’re published.Disclaimer: The modern era is far from the first to grapple with rampant “fake news.” As I am neither a historian nor journalist, I make no claims about the accuracy or lack thereof of the above sources. I assert only that they make for a good story.Share this:Click to email a link to a friend (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Twitt