title = "Get the Party Growing – Second Glance History"
description = "Are you entertaining this season? And do you have vegetables to get rid of? Although these questions may seem unrelated, the historical newspapers have the perfect recipe to squash boredom and turnip the fun. Read on for nutritious party games your friends will talk about for years to come. . . even if they stop…"
full_description = '''Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! StoryGet the Party GrowingOn November 27, 2024 by ElyseAre you entertaining this season? And do you have vegetables to get rid of? Although these questions may seem unrelated, the historical newspapers have the perfect recipe to squash boredom and turnip the fun. Read on for nutritious party games your friends will talk about for years to come. . . even if they stop talking to you.<img data-recalc-dims="1" fetchpriority="high" decoding="async" width="911" height="902" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Onions.jpg?resize=911%2C902&#038;ssl=1" alt="" class="wp-image-4023 lazyload" style="width:330px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Onions.jpg?w=911&amp;ssl=1 911w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Onions.jpg?resize=300%2C297&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Onions.jpg?resize=150%2C150&amp;ssl=1 150w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Onions.jpg?resize=768%2C760&amp;ssl=1 768w" sizes="(max-width: 911px) 100vw, 911px" />From the Evening Star, December 11, 1960.The onion game is the latest fad in rural society, and it will doubtless interest city people who enjoy introducing unique features at their social entertainments. . . Six young ladies stand in a row. The hostess gives a “silver skinned” onion to the head of the row, who passes it along the line.Some one takes a bite, and then the young men, who have been rigidly excluded from the drawing room, and imprisoned somewhere in the vicinity of the front hall hat rack, are called upon to guess who bit the onion. The young man who guesses correctly is allowed to kiss the fair biter of the tender vegetable.– The Bridgeton Pioneer, August 29, 1889Don’t feel too badly for that young man who guesses correctly. In another version of the onion game:The fellow who guesses right kisses the other girls and the one who guesses wrong has to kiss the girl who bit the onion.– Grant County Herald, November 9, 1904<img data-recalc-dims="1" decoding="async" width="551" height="586" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Corn.png?resize=551%2C586&#038;ssl=1" alt="" class="wp-image-4022 lazyload" style="width:389px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Corn.png?w=551&amp;ssl=1 551w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Corn.png?resize=282%2C300&amp;ssl=1 282w" sizes="(max-width: 551px) 100vw, 551px" />From the Denison Review, January 23, 1918.For a less intimate but no less corny party game:The lady friends of Mrs. Herman Aper. . . surprised her Friday evening, the occasion being her thirtieth birthday. After a game of pedro had been engaged in, a pop-corn game in which parties were blindfolded and attempted to find the grains of corn was suggested by Mrs. Welcome Miller and afforded much amusement. It was a merry party which will be long remembered by all who participated.– The Plymouth Tribune, February 8, 1906This blog is proof that the party has been long remembered—but perhaps not for the reason the hostesses or Mrs. Welcome Miller had hoped.<img data-recalc-dims="1" decoding="async" width="572" height="357" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Potatoes.png?resize=572%2C357&#038;ssl=1" alt="" class="wp-image-3968 lazyload" style="width:456px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Potatoes.png?w=572&amp;ssl=1 572w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/10/Potatoes.png?resize=300%2C187&amp;ssl=1 300w" sizes="(max-width: 572px) 100vw, 572px" />From the Omaha Daily Bee, April 6, 1913.Even if finding a figurative needle in the haystack isn’t your cup of tea, er, veggie broth, there’s no need to be a couch potato:Potato parties, says an exchange, are the latest. A large potato, the more uneven the better, is placed on the floor, and a teaspoon is placed beneath it. The object is for the party, one at a time, to raise the potato on the spoon and walk across the floor with it without letting it roll off. While the game is not very classical it is amusing.– The Belmont Chronicle, June 23, 1892The definition of “amusing” may have changed in the last century or so.<img data-recalc-dims="1" decoding="async" width="496" height="494" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Peanuts.png?resize=496%2C494&#038;ssl=1" alt="" class="wp-image-4021 lazyload" style="width:310px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Peanuts.png?w=496&amp;ssl=1 496w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Peanuts.png?resize=300%2C300&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Peanuts.png?resize=150%2C150&amp;ssl=1 150w" sizes="(max-width: 496px) 100vw, 496px" />From the Evening Star, March 5, 1961.While peanuts are technically fruits, don’t let that stop you from driving your guests nuts:Before luncheon a very novel contest, designated as a “peanut party” afforded divertisement. The game was to plunge a table knife into a large bowl of peanuts and carry as many peanuts as possible on the knife blade across the room to another bowl.At the conclusion Miss Genieve Ewing was awarded the first prize, a letter opener in ivory and silver. The visitor’s prize, a very pretty bust, was awarded to Miss Hitchcock, of Rockland, Me. The consolation, a bronze donkey, went to Miss Flora Stifel.– The Wheeling Register, February 2, 1901<img data-recalc-dims="1" decoding="async" width="717" height="1024" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Veggies.jpg?resize=717%2C1024&#038;ssl=1" alt="" class="wp-image-4020 lazyload" style="width:331px;height:auto" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Veggies.jpg?w=717&amp;ssl=1 717w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Veggies.jpg?resize=210%2C300&amp;ssl=1 210w" sizes="(max-width: 717px) 100vw, 717px" />1904 print from the Library of Congress. This holiday season, lettuce toss out ugly sweater competitions and white elephant gift exchanges. For an un-beet-able party, all you need is a vegetable patch!<img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=289%2C75&#038;ssl=1" alt="" class="wp-image-2385 lazyload" width="289" height="75" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=1024%2C269&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=300%2C79&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=768%2C202&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?w=1149&amp;ssl=1 1149w" sizes="(max-width: 289px) 100vw, 289px" />Am I trying too hard?Recent Posts You May Have MissedChristmas Don’tsGet the Party GrowingEverything You Never Wanted to Know about GhostsTabloid TypecastingYou Say “Potato,” I Say “Potahto,” Let’s “Pot-duel”Multipurpose Your MattressesDid you click through Facebook or Twitter? We got lucky—don’t let social media algorithms keep you from seeing a post! Save yourself a click, and subscribe to have stories delivered to your inbox as soon as they’re published.Disclaimer: The modern era is far from the first to grapple with rampant “fake news.” As I am neither a historian nor journalist, I make no claims about the accuracy or lack thereof of the above sources. I assert only that they make for a good story.Share this:Click to email a link to a friend (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Reddit (Opens in new window)Tags: 19th Century, 20th Century, Game, Newspaper, Party, United States, Vegetable4 comments <img alt='' src='https://secure.gravatar.com/avatar/96f0ba4be4bd963893c3c744ec022147?s=80&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/96f0ba4be4bd963893c3c744ec022147?s=160&#038;d=mm&#038;r=g 2x' class='avatar avatar-80 photo lazyload' height='80' width='80' decoding='async'/> Marilyn Canna November 27, 2024 at 3:07 pm Reply OMG—of the best! Lettuce continue to second glance! <img alt='' src='https://secure.gravatar.com/avatar/63455fb7b9bb1770759b92c31666f0d2?s=80&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/63455fb7b9bb1770759b92c31666f0d2?s=160&#038;d=mm&#038;r=g 2x' class='avatar avatar-80 photo lazyload' height='80' width='80' decoding='async'/> Elyse November 28, 2024 at 12:49 am Reply Thank you so much! 😊 With or without the vegetables, hope you have a wonderful Thanksgiving! <img alt='' src='https://secure.gravatar.com/avatar/f2abaebf2e47e7dce40cc2df1a9e0e27?s=80&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/f2abaebf2e47e7dce40cc2df1a9e0e27?s=160&#038;d=mm&#038;r=g 2x' class='avatar avatar-80 photo lazyload' height='80' width='80' decoding='async'/> David November 27, 2024 at 4:12 pm Reply …and here I thought it was the height of hilarity to talk my very stoned friends into playing catch with a beach ball under a strobe light. Now I find that all I needed was some produce.(I learned very early on it was more fun to 