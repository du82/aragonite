ays:—“If you think a shock will do the patient good (many diseases, including deafness, blindness, madness, and sadness or hypochondriasis yield to shock), choose a raw, cold morning and drive your car, bare-handed, to Read More ClipClip of the Week: June 26, 2024On June 26, 2024 by ElyseDoes anyone know a good barber? This guy could use a recommendation: Mr. Frederick Wilkins, landlord of the Tow Tree, a village inn at Burghill, in the lovely lands of pastoral Hereford, renowned as a man of a strange oath, and bearded like the pard, may now go to the barber again. Sixteen years ago Read More ClipClip of the Week: June 12, 2024On June 12, 2024 by ElyseThis is what happens when Americans go abroad: Mr. W. W. Umberhauer, a Philadelphia banker, had to change a suit of clothes yesterday on account of the peculiar effect the pattern had on horses in the Strand [in London] and other thoroughfares. Mr. Umberhauer is a guest at the Hotel Cecil, and the suit is Read More ClipClip of the Week: May 15, 2024On May 15, 2024 by ElyseProof that politicians have been saying “Do as I say, not as I do” for at least 100 years: A rather amusing and somewhat unusual incident occurred during Mr [future New Zealand Prime Minister William] Massey’s recent visit to the West Coast. . . The leading citizens of Greymouth decided to banquet him, and the Read More ClipClip of the Week: May 1, 2024On May 1, 2024 by ElyseWhat do we want? Life, liberty and the pursuit of hairstyles! When do we want them? Now! The telephone girls of Stockholm (Sweden) are fighting for the liberty of hairdress. They recently all adopted the fashion set by the French dancer “Cleo de Merode,” of combing the hair over the ears. The telephone subscribers, however, Read More"
