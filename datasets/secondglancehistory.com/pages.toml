full_description = 'Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! About<img data-recalc-dims="1" decoding="async" class="aligncenter wp-image-936 lazyload" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2019/09/About.jpg?resize=441%2C331&#038;ssl=1" alt="" width="441" height="331" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2019/09/About.jpg?resize=300%2C225&amp;ssl=1 300w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2019/09/About.jpg?resize=768%2C576&amp;ssl=1 768w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2019/09/About.jpg?resize=1024%2C768&amp;ssl=1 1024w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2019/09/About.jpg?w=2340&amp;ssl=1 2340w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2019/09/About.jpg?w=3510&amp;ssl=1 3510w" sizes="(max-width: 441px) 100vw, 441px" />Welcome to Second Glance History, a blog that uncovers the people and stories forgotten by history and gives them another read through a modern lens. Big stories, small stories, happy stories, sad stories, amusing stories, quirky stories—there’s something for every palate.Many of these neglected stories come from the Library of Congress’ collection of digitized newspapers, the majority of which are from the late 19th and early 20th centuries. Equally compelling tales are found in obscure books, random articles and other dusty corners of the Internet. Although I am not a trained historian, I approach each story with a deep curiosity and research the facts and context as well as any internet-savvy non-professional.Second Glance History is my effort to creatively translate a passion for untold stories into a 21st-century medium. I hope you’ll join me every other week as I discover tales from bygone eras and seek out the common threads connecting the “then” to the “now.”If you’d like to come along for the ride, subscribe and connect with the blog on Facebook and Twitter!'
