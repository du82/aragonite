full_description = '''Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! ClipClip of the Week: December 11, 2024On December 11, 2024 by Elyse<img data-recalc-dims="1" fetchpriority="high" decoding="async" width="427" height="343" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Travellers-rights.png?resize=427%2C343&#038;ssl=1" alt="" class="wp-image-4034 lazyload" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Travellers-rights.png?w=427&amp;ssl=1 427w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/12/Travellers-rights.png?resize=300%2C241&amp;ssl=1 300w" sizes="(max-width: 427px) 100vw, 427px" />Is this bad customer service or the customer from hell? You decide:A traveller in the Lake district who found himself stranded owing to a mishap at 5.45 one morning went to an hotel and rang the bell.No one opened the door, and, though he rang again and again, he was unable to gain admission for over an hour, while he stood in the cold and rain.The traveller brought an action against the hotel keeper because he wished to show that innkeepers have a duty to the travelling public which they are legally bound to carry out, and the Judge, agreeing with him, awarded him £50 damages.– The New Zealand Herald, March 28, 1925The verdict is in: it’s a win for Karen kind. But if I were a Karen, I’d sleep with one eye open—the judge didn’t say anything about what kind of a room the innkeeper has to provide. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=289%2C75&#038;ssl=1" alt="" class="wp-image-2385 lazyload" width="289" height="75" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2021/05/Read-me.png?resize=1024%2C269&amp;ssl=1 102