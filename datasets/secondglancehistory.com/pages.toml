full_description = "Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! StoryChristmas Don’tsOn December 25, 2024 by Elyse♪ You better watch out,You better not cry,Better not pout,I’m telling you why:History is coming to town. ♪ These days, it’s not hard to make Santa’s “nice list,” especially with a spy, er, elf always looking over your shoulder. But in centuries past, the holiday season could bring worse fates than coal in your stocking. Read More ClipClip of the Week: December 11, 2024On December 11, 2024 by ElyseIs this bad customer service or the customer from hell? You decide: A traveller in the Lake district who found himself stranded owing to a mishap at 5.45 one morning went to an hotel and rang the bell. No one opened the door, and, though he rang again and again, he was unable to gain Read More StoryGet the Party GrowingOn November 27, 2024 by ElyseAre you entertaining this season? And do you have vegetables to get rid of? Although these questions may seem unrelated, the historical newspapers have the perfect recipe to squash boredom and turnip the fun. Read on for nutritious party games your friends will talk about for years to come. . . even if they stop Read More ClipClip of the Week: November 13, 2024On November 13, 2024 by ElyseThis is what happens when you hire Florida Man as your attorney: Attorney William F. Koegler had been acting as special prosecutor in the Miami (Florida) Court of Crimes all the week. Then he changed his role and defended a youth charged with stealing a watch. He ended his speech to the jury with the Read More StoryEverything You Never Wanted to Know about GhostsOn October 30, 2024 by Elyse‘Tis the season for ghost stories, out-of-work spirits and erm, haunted gates. But what do we really know about ghosts, other than they’re friendly, can be trapped in glorified vacuum cleaners and occasionally dance with their still-living partners? Ghosts like their pints as much as the rest of us. All ghosts, according to the [Encyclopedia Read More StoryTabloid TypecastingOn October 16, 2024 by ElyseLongtime Second Glance History readers no doubt remember what happens when Americans go abroad. (Reminder: They get accused of being German spies.) But what does the rest of the world think of Americans back home? While the answer to that question is as varied as the people responding, the results of my unscientific, niche survey of 19th- and Read More StoryYou Say “Potato,” I Say “Potahto,” Let’s “Pot-duel”On October 2, 2024 by ElyseThe potato’s many nutritional benefits are common knowledge, but once upon a time, the noble spud did more than simply provide vitamins, minerals and fiber: . . . in a certain district in Kentucky some forty years ago. . . a traveling preacher named Bowman, a strong, muscular man, was conducting a series of religious Read More ClipClip of the Week: September 18, 2024On September 18, 2024 by ElyseWe all have that one friend who takes the joke too far: A singular and amusing case came up at Dublin Police-court on Saturday, a clerk, named Thomas Summer, being charged with handcuffing Richard M’Cormack. The evidence showed that the prisoner and a friend visited the Tivoli Music-hall on the previous evening, and there witnessed Read More StoryMultipurpose Your MattressesOn September 4, 2024 by ElyseYou’ve finally done it: After years of squeaky bed springs, back pain and dust mites, you’ve bought yourself a new mattress and potentially years of life. Congratulations! A good night’s sleep is yours. But what should you do with your old mattress? Reenacting Hans Christian Andersen’s The Princess and the Pea is always an option, Read More"
