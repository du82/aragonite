rified vacuum cleaners and occasionally dance with their still-living partners? Ghosts like their pints as much as the rest of us. All ghosts, according to the [Encyclopedia Read More StoryTabloid TypecastingOn October 16, 2024 by ElyseLongtime Second Glance History readers no doubt remember what happens when Americans go abroad. (Reminder: They get accused of being German spies.) But what does the rest of the world think of Americans back home? While the answer to that question is as varied as the people responding, the results of my unscientific, niche survey of 19th- and Read More StoryYou Say “Potato,” I Say “Potahto,” Let’s “Pot-duel”On October 2, 2024 by ElyseThe potato’s many nutritional benefits are common knowledge, but once upon a time, the noble spud did more than simply provide vitamins, minerals and fiber: . . . in a certain district in Kentucky some forty years ago. . . a traveling preacher named Bowman, a strong, muscular man, was conducting a series of religious Read More ClipClip of the Week: September 18, 2024On September 18, 2024 by ElyseWe all have that one friend who takes the joke too far: A singular and amusing case came up at Dublin Police-court on Saturday, a clerk, named Thomas Summer, being charged with handcuffing Richard M’Cormack. The evidence showed that the prisoner and a friend visited the Tivoli Music-hall on the previous evening, and there witnessed Read More StoryMultipurpose Your MattressesOn September 4, 2024 by ElyseYou’ve finally done it: After years of squeaky bed springs, back pain and dust mites, you’ve bought yourself a new mattress and potentially years of life. Congratulations! A good night’s sleep is yours. But what should you do with your old mattress? Reenacting Hans Christian Andersen’s The Princess and the Pea is always an option, Read More1 2 3 … 23 »"
