full_description = '''Subscribe to Blog via EmailNever miss a new post ever again! Enter your email address to subscribe to Second Glance History, and stories will be delivered to your inbox as soon as they’re published. Email Address Sign me up! ClipClip of the Week: November 13, 2024On November 13, 2024 by Elyse<img data-recalc-dims="1" fetchpriority="high" decoding="async" width="422" height="351" src="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Guilty.png?resize=422%2C351&#038;ssl=1" alt="" class="wp-image-4014 lazyload" srcset="https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Guilty.png?w=422&amp;ssl=1 422w, https://i0.wp.com/secondglancehistory.com/wp-content/uploads/2024/11/Guilty.png?resize=300%2C250&amp;ssl=1 300w" sizes="(max-width: 422px) 100vw, 422px" />This is what happens when you hire Florida Man as your attorney:Attorney William F. Koegler had been acting as special prosecutor in the Miami (Florida) Court of Crimes all the week. Then he changed his role and defended a youth charged with stealing a watch.He ended his speech to the jury with the words: “There is only one possible verdict—guilty!” He sat down without realising his mistake.A bailiff pointed out the error, and the judge permitted Koegler to reopen his argument. The youth was acquitted.– The Hawera Star, June 15, 1935For more helpful professional advice from Second Glance History, check out “How to Get Sued for Medical Malpractice in Three Easy Steps.” Your own attorney will appreciate the extra business!Share this:Click to email a link to a friend (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Reddit (Opens in new window)Tags: 20th Century, Crime, Florida, Miami, Newspaper,