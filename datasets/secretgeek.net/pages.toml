title = "Desert Skies - exclusive inside information from the developers (secretGeek.net)"
full_description = '''Desert Skies - exclusive inside information from the developers October 06, 2019 color, food, games Unless you've been living under a rock like some disgusting sand-sneaking Seeker -- you're aware of the awesome sensation taking the gaming community by storm: Desert Skies. Here's a video of the game play in case you're not familiar. I recently sat down for an intense lunch with one of the minds from White Rabbit Games - the creative duo behind this Indy gaming sensation, and I found out some exclusive information. Although the company is called "White Rabbit Games" the logo is of a cat. SEE!? What's that all about? T: we have a fluffy white cat, and it looks like a bunny so we call it "bunny". Thus the white rabbit is actually a cat. Woah. That's enough revelations for one day. It's a really awesome game. I find it pretty exciting because it's a simple idea that is popular enough that it will get a chance to expand in some really interesting directions. Keep an eye on this! Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
