["https://secretgeek.net/MeetingCosts"]
title = "Meetings: Are They Worth It? (secretGeek.net)"
full_description = '''Meetings: Are They Worth It? February 22, 2019 twitter, tools, it industry, productivity I tweeted recently that, inside a corporation, it would be handy to have, for example... An Outlook plugin that automatically edits every meeting request, and appends a few characters to the title: If the meeting request was for 10 people, for 120 minutes, it would calculate "10 people times 2 hours times (some reasonable rate per hour, e.g. $89)" and then it would append "for $1780" to the time of the meeting hence: Project Kick Off would become: Project Kick Off for $1780! (The exclamation would only be added if the dollar amount was above some configuration value.) Or better yet: Project Kick Off for $1780, so make sure it's worth it! And, although it was not an original idea, I saw a few people in agreement. In the past I've seen some "passive-aggressive" tools that perform a similar calculation, giving attendees a calculator to continuously measure their mounting frustration: but I think my idea is more straight-forward "aggressive-aggressive". Initially it would be hampered by people feeling defensive, but once the underlying truth has been internalized people can (I believe) move forward and be both: less wasteful and more productive. As always, I reserve the right to change my mind in the morning. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
