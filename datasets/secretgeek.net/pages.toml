title = "Three Questions About Each Bug You Find (secretGeek.net)"
full_description = '''Three Questions About Each Bug You Find June 12, 2009 cartoon, color, html, microISV, tools 3 Questions... in cartoon form too! I really love this timeless Tom Van Vleck article from 1989. It teaches us to ask ourselves: Three Questions About Each Bug You Find Those questions being: Is this mistake somewhere else also? What next bug is hidden behind this one? What should I do to prevent bugs like this? When I first read these rules, I was foolish enough to think: 'Cute, But Too Obvious! i do this intuitively all the time.' But watch yourself closely! I've caught myself out on occasion, and maybe you will too. I'm making an effort to be more explicit about the three questions. Maybe i'll end up fixing related problems at first hint more often than i do now. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
