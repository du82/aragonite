title = "21 tools used in our MicroISV (secretGeek.net)"
full_description = '''21 tools used in our MicroISV July 02, 2008 blog, google, html, microISV, microsoft, sql, sysadmin, tools Many, well, years, ago I started a series of articles on '25 steps for building a Micro ISV'. It's still something that I care about very much, and that I hope to get back to sharing.In the meanwhile, here's a quick wrap up of the some of the tools we use to help run TimeSnapper, our MicroIsv.These are by no means the 'ultimate' choice or 'best of breed' in each category -- these are just the choices that we happen to use in TimeSnapper.I think it's interesting to see just how much software we rely upon, even though we are 'Independent'.This also leaves out the dozens of articles and blog entries that teach, inspire or unblock along the way, and the many tools we've considered using, or the many tools we're planning to switch to.Register Domain Go DaddyReliable hosting Web Host 4 LifeWebsite design -- free templates Andreas ViklundBasic Website content (write it yourself)Install traffic monitoring on your site Google AnalyticsCreate forums, encourage feedback Community ServerMaintain a FAQ (write it yourself)Get the best screenshots you can Snag It Configure email for domain (all by yourself)Get payment account PaypalAllow payment from your website (all by yourself)Create a PAD file -- portable application description PAD GenRegister at download sites RoboSoftStrategy: separate "free" from "professional" products (all by yourself)Get a suitable end user license agreement (EULA) -- infact get two! (write it yourself, with help from weasel lawyer friends)Auto update strategy Advantech Download Unzip and Run tool, which in turn uses:SharpZipLibLicense activation webservice/website (we wrote our own using asp.net and firebird)Get a license management database (we wrote our own)Build a proper installer inno setupObfuscate your assemblies dotfuscatorAutomate your build+release strategy We've switched from final builder pro to batch files, to ms buildFree up enough time/resources for dealing with support/feedback fogbugz ondemandShiny, Usable, Helpful Plan and enact your promotional strategy bits du jour shareware promotions campaign monitorDo it all again No tools required ;-)Strangely absent from the list is our current choice of source control tool -- SourceGear Vault. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more.'''
