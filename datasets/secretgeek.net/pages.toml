title = "Productivity Flowchart: 13 years in the making (secretGeek.net)"
full_description = '''Productivity Flowchart: 13 years in the making January 10, 2017 tools, blog, UX, productivity, functional TL/DR: Go here: The very very first article I tried to write for this blog (before it was even a blog) was called 'GeekBlock' waaay back in September 2003. The article was about a process for getting un-stuck. It has always amused & annoyed me that the article sits there unfinished. Eventually I rewrote it as an article at YourFirstProduct.com with the humble title: 'A 3 Minute Guide to Fixing All Your Productivity Problems Forever.' But its non-linear structure was simply too tricky to follow. People who read it said they got lost about half way through. Finally, I rewrote it as a tiny application; an interactive flowchart, a choose your own adventure, a tiny state machine. Now I'm happy with it. You can play with it here: Productivity Flowchart Some people have suggested I re-write it as an infographic (What is this, 2015?) but I like it as it is. It'll be due for a rewrite in another 13 years, around 2030, I guess. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
