full_description = '''a html quine June 04, 2019 html Yesterday I was on a bus! Yes, a bus! I don't get to ride buses so often due to the working from home lyfe, but I took the opportunity to write some simple code (as I used to do on buses in the past... i even gave a talk about it once, when alt.net was a thing.) And the thing I coded on the bus was a html quine. Go and see this html quine It's... different? A quine is a program that produces, as output, its own source code. I've discussed and demonstrated quines over here in the wiki. And as I say in the html quine link, although the idea had bounced around in my head for a decade, the thing that reminded me to go and do it was seeing this piece of "Code as Art" from Geoff Huntley recently: no yaml. There must be more Code as Art in this world. See also, lengthy Hacker News discussion and more recently more discussion. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
