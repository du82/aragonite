["https://secretgeek.net/03Sept04"]
title = "The 3rd of the month -- Hey! it's backup day! (secretGeek.net)"
full_description = '''The 3rd of the month -- Hey! it's backup day! September 03, 2004 blog Did you backup your home computer today? Did you?Probably not. And I hope you wake up tomorrow to find that: Your hard drive is dead You've accidentally wiped important documents A virus has damaged your operating system Your computer has been stolen Your house has burnt down AND A lightning-strike has destroyed your hard drive Regarding the lightning-strike possibility: don't snigger. It happened to my parents about two years ago, along with several other houses around them. Computers, microwaves, televisions: all sorts of things were destroyed. Naturally there were no backups. If you're the geek in your family (and I know that you are) then you have an obligation to use your geekery for good instead of evil. The third of the month is the day when you back up your home PC -- and you insist that your family and friends back up their's as well. backups backups backups So how do you actually do one of these? I think there are two types. Type one is a 'complete' backup, an image of your hard drive. This is impractical and unneccessary for most home users, so I'll ignore it. Type two, which is relevant here, is to backup your most valuable information. A stepped list is provided below. Work out what to backup Schedule it! (once a month is good!) So back it up already Mark your back ups Take it off site! Automate what you can On the 3rd of October I might solicit more details about how to achieve each of these steps. People who read this blog are cluey enough to perform a backup and take it off-site. Don't overcomplicate it. Just get on with it. Best of Luck! Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
year_published = 2004
clearnet = "https://secretgeek.net/03Sept04"
