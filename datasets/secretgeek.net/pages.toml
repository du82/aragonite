full_description = '''What next for the 3 minute guides?? August 08, 2006 commandline, functional, linguistics, microsoft, powershell, [ruby], UX Lately I've written a bunch of 'introductions' to newish technologies.Watir, JSON, Powershell (Part 1, Part 2)-- all of them completely new to me. If you've been interested in this series to date, can you make a suggestion for what technology to tackle next?Some ideas currently: F# -- microsoft's functional programming language Ruby On Rails -- an absolute beginners guide, targeted at Microsoft developers WPF (formerly avalon) WCF (formerly indigo)What is there that scares you? Come on, 'fess up.(I bet it scares me too. So let me go off and research it for the both of us ;-)Or, what technology has you intrigued? Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
