["https://secretgeek.net/2017_review"]
title = "2017 by the Numbers (secretGeek.net)"
full_description = '''2017 by the Numbers January 02, 2018 twitter, tools, blog, microsoft, color, UX, microISV, social network, productivity, nimbletext, ideas rat, functional Being productive in 2017 was particularly challenging. The most powerful nation on earth elected a madman, and no-one could really think about anything else. If you produced nothing, but managed to survive, then good for you. Here's a summary of things I shipped. Numbers in parens, e.g. "(3)", are last year's figures. 1 book published, Lakes Creek Adventures (0) 1 great t-shirt design released (0) 13 Blog posts written (17) 2 blogs posts published to medium (0) 133 Today-I-Learned Entries written (233) — 35289 words (42352), 21 new topics (44), further detail 1 talk delivered, "Evergreen Skills for Software Developers" (in conjunction with Joseph Cooney, and coming soon as an ebook) (1) 0 slackathons hosted (1) 10 new wiki articles completed (50) 1 (really minor) pull request successfully submitted to open source software (3) 1 vote lodged in favor of same-sex marriage (0) 2 pairs of reading glasses acquired (0) 189 contributions at Github/secretGeek (292) 2 production websites moved from Windows to Linux (3) 1000s of tweets written Many thousands of words written toward "Your First Product" 2 tools created for "Your First Product" (2) 6 articles written for "Your First Product" (17) 1 new version of NimbleText released (3) Things I didn't publish: A massive pile of genealogical research. Research into Python in Minecraft "Epic Loot Quest of the Dungeon Raider" (threejs fps) "Androids versus Electric Sheep" (Artificial Life program) Linqpad scripts for generating Guitar chord/key/scale cheatsheets and progressions. 65 stub articles at the wiki. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
