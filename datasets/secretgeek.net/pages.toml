["https://secretgeek.net/react_not_ok"]
title = "React is NOT ok (secretGeek.net)"
full_description = '''React is NOT ok March 14, 2019 tools, powershell, [code], commandline Look how tragic this is.... You create your new react app with: npx create-react-app my-app And it spits out 907 lines of techno-babblicious output, scrolling scrolling scrolling in your console, ending at last with exactly one useful shard of information: Success! Created my-app at C:\example\my-app Inside that directory, you can run several commands: yarn start Starts the development server. yarn build Bundles the app into static files for production. yarn test Starts the test runner. yarn eject Removes this tool and copies build dependencies, configuration files and scripts into the app directory. If you do this, you can’t go back! We suggest that you begin by typing: cd my-app yarn start Happy hacking! But after the wall of gobbledygook that preceded it, it's easily overlooked. If the React team knew about the wonders of "ok" (for bash or powershell) they'd simply create a ".ok" file inside the "my-app" folder that says: yarn start # Starts the development server. yarn build # Bundles the app into static files for production. yarn test # Starts the test runner. ...Then you'd immediately be able to find the commands again, and run them with a simple "ok 1", or "ok 2" or "ok 3" But instead: those commands, sailing by in the infinite neon-scroll of the console, will be lost in time like tears in rain. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
