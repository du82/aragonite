["https://secretgeek.net/slackathon_Tminus3"]
title = "Less than 3 days until the Stupid Ideas Powershell Slackathon. (secretGeek.net)"
full_description = '''Less than 3 days until the Stupid Ideas Powershell Slackathon. June 14, 2016 twitter, tools, blog, microsoft, microISV, powershell, google, [code], social network, nimbletext, commandline What's that? It's a newly-coined portmanteau of the words Slack and Marathon. It's a lazy, online event, where people from around the world give as much or as little time as they can spare over the course of a weekend, to achieve Stupid And Entirely Un-Noteworthy Things, with any kind of tenuous link to PowerShell. Why should you join? So far there are 53 people who've joined the slack channel (and a further 23 who are yet to accept the invitations they requested) And these 53 people seem to mostly be very clever and knowledgeable bounders, brimming with knowledge on the PowerShell. They're all very keen to help any inexperienced dabblers, so I hope that anyone who hesitated join before will now jump in while they can, knowing that they'll be well supported by a super helpful team. Enough jibber-jabber Leon, how do I join?? Loading... Alternatively you can: email me (leonbambrick@gmail.com) Or send (@secretGeek) a direct message on twitter including your email address. And how long until it starts? Run this command to find out... New-TimeSpan -Start (GET-DATE) -End (get-date -Date "2016-06-17T11:00:00Z") Days : 2 Hours : 11 Minutes : 26 It'll be here in the blink of an eye! Any further details? See my previous post on the topic! There are now confirmed prizes, such as 2 Chocolatey Pro Licenses, A copy of Douglas Finke's book: Windows Powershell for Developers (O'Reilly) and I'll give away a few copies of my own product (NimbleText) for good measure. Some of the snippets that have been discussed so far are available at our public floobits site. Here's an example of a Wolfram-Alpha script that Doug Finke has been working on (click to enlarge)... Also -- you can order a slackathon T-Shirt here: Order-TShirt Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more.'''
