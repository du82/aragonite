full_description = '''Improvements to the Way MessageBox works, in latest Service Pack for Windows 7, 8 and 8.1 July 07, 2016 microsoft No doubt you are all familiar with the way the 'System.Windows.Forms' MessageBox behaves in all versions of the .net framework. For example you type this code: MessageBox.Show("Please click OK."); And you get this result: With the upcoming service pack for Windows 7, 8 and 8.1, improvements to the System.Windows.Forms.dll mean that the style of messagebox will be altered slightly. The exact same code: MessageBox.Show("Please click OK."); Will produce this slightly altered dialog. The service pack is being automatically deployed during a forced reboot as soon as you finish reading this sentence. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
