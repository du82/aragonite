["https://secretgeek.net/capital"]
title = "Think you're clever? Can you name each of these CASING styles? (secretGeek.net)"
full_description = '''Think you're clever? Can you name each of these CASING styles? November 27, 2018 html, tools, blog, microISV, education, nimbletext How many of these capitilization styles can you name? I'll give you a clue, the first one is "UPPERCASE" ALL WORK AND NO PLAY MAKES HOMER SOMETHING SOMETHING all work and no play makes homer something something All Work And No Play Makes Homer Something Something AllWorkAndNoPlayMakesHomerSomethingSomething allWorkAndNoPlayMakesHomerSomethingSomething All work and no play makes homer something something all_work_and_no_play_makes_homer_something_something ALL_WORK_AND_NO_PLAY_MAKES_HOMER_SOMETHING_SOMETHING all-work-and-no-play-makes-homer-something-something All-Work-And-No-Play-Makes-Homer-Something-Something All wOrk And nO plAy mAkEs hOmEr sOmEthIng sOmEthIng alL woRk AnD No plAy MAkeS HOMer sOMetHInG sOmetHING Take your time. Look through them carefully. One at a time, out loud, say what each of them is called. Scroll down for the answers. scroll... scroll... scroll... scroll... scroll... The Answers Easy one first up: 1. ALL WORK AND NO PLAY MAKES HOMER SOMETHING SOMETHING That's uppercase. Letters A-Z. 2. all work and no play makes homer something something ...lowercase, letters a-z. 3. All Work And No Play Makes Homer Something Something ...Title Case, the first letter of each word is capitalized.* 4. AllWorkAndNoPlayMakesHomerSomethingSomething Good old PascalCase... words are smashed together, with the first word capitalized. 5. allWorkAndNoPlayMakesHomerSomethingSomething PascalCase's close relative, camelCase... words are smashed together, with the first word not-capitalized. 6. All work and no play makes homer something something Sentence case... all words lowercase, but the first letter capitalized. 7. all_work_and_no_play_makes_homer_something_something Snake case: underscores as word separators. 8. ALL_WORK_AND_NO_PLAY_MAKES_HOMER_SOMETHING_SOMETHING Combine snake_case with UPPERCASE and you get C_CONSTANT_CASE. 9. all-work-and-no-play-makes-homer-something-something This is kebab-case, great for URL fragments, it's lowercase with each word separated by a hyphen. 10. All-Work-And-No-Play-Makes-Homer-Something-Something This is Train-Case, the slightly shouty cousin of kebab-case. 11. All wOrk And nO plAy mAkEs hOmEr sOmEthIng sOmEthIng You might have to pay attention to spot that this is vOwEl cAsE - where vowels are sent to UPPERCASE. 12. alL woRk AnD No plAy MAkeS HOMer sOMetHInG sOmetHING And this is an exmple of Sponge Bob Case, where letters are randomly assigned a case; it's different every time, and hard to detect. You can't disprove that every one of the above examples is ALSO an example of Sponge Bob case. That's the thing about random ;-) Here's a NimbleText pattern that demonstrates all of the above. Yeh, this fun and educational content is also a promo for NimbleText... This example lets you play with all the different casing styles and generate your own in a snap! Thanks to Doeke Zanstra for the idea of vOwEl cAsE. * For a more nuanced take on Title Case (for professional writers) try the title case converter tool, which can apply complex house styles, like Chicago, APA. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more.'''
