full_description = '''3 Types of Argument March 21, 2008 color, functional Engineering Argument:There are two ways to implement something. Neither option is perfect -- both have their own compromises, which are known and measurable. Argument centres on which compromises are most acceptable.Example: should the bike-shed be made from wood or brick?Artistic Argument:There are two ways to implement something. Both are functionally correct, but have unquantifiable differences. Argument centres on intuition and opinion. Example: should we paint the bike-shed topaz or cyan?Religious Argument:There are two conflicting points of view. Both are utterly wrong. Argument has no centroid and no limiting factors.Example: should the bike-shed be built to honour the green walrus or the almighty unicorn? [notebook image above is 'a thorough mathematical analysis of two competing models for optimising energy dissipation through behavioural approaches to leaving the toilet seat up.'] Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
