["https://secretgeek.net/25steps"]
title = "25 steps for building a Micro-ISV (secretGeek.net)"
full_description = '''25 steps for building a Micro-ISV January 18, 2007 blog, hanselman, microISV, ocr, podcast, sql, sysadmin, tools As promised, here's my 25 steps for building a Micro-ISV which are hard learned steps based on our experience getting TimeSnapper to where it is today. Each of these steps is both harder than it looks, and easier than you'd think.It's hard because there are pitfalls, procrastination, misconceptions, anxiety, conflicting opinions and confusion at every step. It's easy because, hey, you're a smart guy or gal, so you can do this stuff in your sleep.I'm planning to write a blog entry on each of these, and yes if things go very well, it may be a book someday ;-) The big news is that Scott Hanselman interviewed me, about this list, for this week's episode of hanselminutes, out now! (Hanselminutes, for those who live under sedimentary deposits, is a weekly audio talk show with noted web developer and technologist Scott Hanselman.)If you want to get some early tips on all of these topics, please listen to the show! It was a real blast doing the show -- far more excitement than this little geek is used to. Scott and Carl were very helpful with all the technical aspects, and Scott was just as sharp and witty as you'd hope.(He sure was enthusiastic about TimeSnapper too, which really means a lot to us)Now, on to the list! Register Domain Reliable hosting Website design Basic Website content Install traffic monitoring on your site Create forums, encourage feedback Maintain a FAQ Get the best screenshots you can Configure email for domain Get payment account Allow payment from your website Create a PAD file -- portable application description Register at download sites Strategy: separate "free" from "professional" products Get a suitable end user license agreement (EULA) -- infact get two! Auto update strategy License activation webservice/website Get a license management database Build a proper installer Obfuscate your assemblies Automate your build+release strategy Free up enough time/resources for dealing with support/feedback Shiny, Usable, Helpful Plan and enact your promotional strategy Do it all again As each article comes out, i'll update this list to point to the relevant article. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more.'''
