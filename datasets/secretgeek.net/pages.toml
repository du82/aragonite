["https://secretgeek.net/4TypesOfStupid"]
title = "4 Types of Person (a guide to stupidity) (secretGeek.net)"
full_description = '''4 Types of Person (a guide to stupidity) January 03, 2009 color, education, html, productivity, tdd, UX Summary.You're an idiot. Deal with it.The longer version.I've been pondering the chronic over-supply of stupidity, and I've come to a new conclusion.Stupidity itself is not the problem. Abundant stupidity is inevitable. The problem is the people (like you, for instance) who don't even begin to suspect that they are stupid. People who insist they're God's gift to intellectual discourse. But in reality: as thick as whale blubber.So here's a matrix to show four different types of people... the cross product of those who think they are smart (or dumb) and those who are actually smart (or dumb). .matrixoid {background-color:#FFF;border:3px solid #DDD;} .header0 { background-color:#9CF;padding:10px;} .header1 { background-color:#AF8;padding:10px;} .header2 { background-color:#FF8;padding:10px;} .header3 { background-color:#F66;padding:10px;} .header4 { background-color:#FF8;padding:10px;} .header5 { background-color:#F66;padding:10px;} .header6 { background-color:#FF0;padding:10px;} .header7 { background-color:#F80;padding:10px;} .header8 { background-color:#F80;padding:10px;} .header9 { background-color:#F00;padding:10px;}4 types of personthinks he is... dumbsmartis actuallydumb forrest gumphomersimpsonsmart detectivecolumbomr spockThis matrix has four types of people. Stealing an idea from my usability-buddies i've assigned a 'persona' to each quadrant:Forrest Gump: stupid, but he knows it.Homer Simpson: is actually dumb, but seems to think he's the cleverest guy alive.Columbo: is actually smart, but comes across as quite a dope.Mr Spock: smart, and knows exactly how smart he is.Here's a pictorial version.4 types of personthinks he is... dumbsmartis actuallydumb smart And here's my guess at how common (or rare) each of the four categories are.(I started with the rule that only 20% of people could be called smart, and then assigned a breakdown after that.)4 types of personthinks he is... dumbsmartis actuallydumb 2%78%smart 5%15%The chief lesson: lots of Homers, very little of everything else. The stupidity vortex is spreading. More on that later.The goal, interestingly enough, is not to end up in the lower right (Spock) but in the lower left (Columbo).Why would a smart person (a Spock) decide to put themselves in the third quadrant and become a Columbo? Because they're smart enough to realise that they're really stupid. Stupid for two reasons.Two things make you stupid There's two reasons that a smart person should realise they are still, essentially, stupid.The obvious thing is that no matter how much you know, your knowledge is an insignificant dot compared with the sum total of what can be known. (It's even very small compared with the sum total that other humans currently know.)But here's the real kicker: every idiot in the world knows at least one or two things you don't know.I've gone all out and used Powerpoint to create a Venn diagram (at right) to help illustrates this point.Here we're comparing a genius with an idiot -- and the size of the circles indicates the relative size of their 'knowledge' or wisdom or intellect or some other hard to measure, but easy-to-chat-about concept.Clearly the genius has greater brain points -- and indeed knows almost everything the idiot knows. But look out genius, because there's still a little sliver of things the idiot knows that you don't know. And this is a humbling thought.The idiot won't hesitate to grab onto those one or two tiny points and rub your nose in them mercilessly. Trust me on this: I've done it to smart people many times over.So don't get too cocky there Spock. Chill out, Yoda. Pull your head in, Gandalf.Stopped ClocksTo remain humble even in the face of blatant stupidity, never forget:"Even a stopped clock is right twice a day."Tattoo that on the back of your eyelids. The real lessonBut the real lesson is this: if you think you're Spock, you're much more likely to actually be Homer Simpson.Please, dear idiot reader, err on the side of safety and assume that, like me, you are a mental ass hat with much to learn. We'll all be better off.Final word: How To Get SmartOne final word though, on a more positive note... it might be possible to actually become smart. Imagine that?I haven't tried this personally, but according to 'Wetware refactorings' which quotes 'Pragmatic Thinking and Learning: Refactor Your Wetware' by Andy Hunt:...in a rich environment with things to learn, observe, and interact with, you will grow plenty of new neurons and new connections between them...Your working environment needs to be rich in sensory opportunities, or else it will literally cause brain damage. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more.'''
year_published = 2009
