["https://secretgeek.net/goals_streak"]
title = "The value of realistic goals (with data) (secretGeek.net)"
full_description = '''The value of realistic goals (with data) October 03, 2017 education, apple, productivity (I guess I'm one of those productivity gurus now.... sorry) I accidentally created some data that seems to have broad implications: Lesson If you set your goals even a little bit too high, then your performance will be considerably worse. Backstory I've started using my iPhone to track how many steps I do each day. When I first started tracking my steps, I set the goal at 10,000 steps per day (10K) because that's what I'd heard was good. I'd make it most days but fail on other days. Sometimes I'd smash way past 10k, then crash really low for a day or two. In 3 weeks, I missed my goal on about a quarter of days. It felt quite frustrating. I took a step back (pun intended) and decided to lower my goal to just 8,000 steps per day (8K). This was still a big increase from the low activity levels I'd exhibited before tracking my steps. (Working from home: hard to keep active!) With this lower goal of 8K per day, I've now managed to achieve my goal every day for 42 days, also maintained a much higher weekly average than I had during the 10k days, and I feel a lot better about it. I might increase the goal soon but would only increase it to 8,500. If I manage that consistently I'll bump it up again: but the increases will be slow and steady and always achievable. Next → ← Previous My book "Choose Your First Product" is available now. It gives you 4 easy steps to find and validate a humble product idea. Learn more. (By the way, I read every comment and often respond.) Your comment, please? Your Name Your Url (optional) Note: I may edit, reuse or delete your comment. Don't be mean.'''
