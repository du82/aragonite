full_description = '''Home Who is the Secret Victorianist? Sunday, 23 February 2025 Neo-Victorian Voices: The Swan’s Nest, Laura McNeal (2024) It’s no secret that I love a book based on real Victorian scandals (after all, I did write a novel about the affair between Branwell Bronte and Lydia Robinson!), so I was excited to read Laura McNeal’s 2024 The Swan’s Nest as part of my Neo-Victorian Voices series, reviewing works set in the nineteenth century, but written in the twenty-first.The Swan’s Nest tells the story of the relationship between Robert Browning and Elizabeth Barrett, in the lead up to, and early days of, their marriage, set against a backdrop of an English social milieu grappling with the legacy of slavery and exploitation in Jamaica. The courtship depicted here is tender, rather than steamy, and much of the novel focuses on side characters (some fictional, some based on real figures). Lovers of historical romance may be disappointed, but McNeal’s prose is enjoyable, and the novel feels well-researched and realistic. Barrett’s anxiety over her controlling father’s reaction to her burgeoning relationship and the love of poetry she shares with Browning came across most strongly. The sections dealing with colonialism leaned a little too didactic for my taste and took us away from the central characters but the important topic being explored will engage readers who are learning about the Barretts’ unsavory “business” interests for the first time.Overall, while The Swan’s Nest is one of the quieter novels I’ve reviewed as part of this series, I would recommend it to anyone with a love for Browning and/or Barrett’s poems, an interest in the history of the British West Indies, or a preference for biographical historical fiction.Do you have recommendations for what book I should review next as part of my Neo-Victorian Voices series? Let me know—here, on Instagram, on Facebook, or by tweeting @SVictorianist!Want regular updates from this blog? Sign up to my emai