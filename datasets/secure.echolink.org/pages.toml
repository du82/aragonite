["https://secure.echolink.org/uri.htm"]
title = "EchoLink and the URI"
full_description = "Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status EchoLink for Windows (version 2.3 and above) supports the URI series of USB-to-radio interfaces, as an option when running EchoLink in Sysop mode. The URI is a USB-powered interface with a built-in sound chip that lets you connect a transceiver to your PC, with both sound and signalling, over a single USB connection. It's available from DMK Engineering at dmkengineering.com. Ready-to-go cables for connecting the URI to many popular transceivers are available from uricables.com. Before connecting the URI, please disable the Windows service called “Human Interface Device Service”. This service can interfere with proper operation of the URI. Use Windows+S to search for the Services app; locate Human Interface Device Service, right-click it, choose Properties, and change the Startup type to Disabled. Click OK to save. Use the USB cable to connect the URI to any available USB port on the PC. Avoid using a USB hub with the URI, unless the hub has its own power supply. When connected to USB, the green LED on the URI should illuminate. When connected, Windows will automatically download and install the appropriate drivers. Windows will set up the URI as a new sound device, typically named “USB Audio Device” or “C-Media USB Headphone Set”. This might also become the new default sound device on your PC, which is probably not what you want if you already have another. In that case, after connecting the URI, right-click the speaker icon in the system tray, choose Sounds, and on the Playback and Recording tabs, set your original sound device as the default for both. If not already done, install EchoLink, and run it. During first-time setup, EchoLink will ask which type of node to configure; choose Simplex Link or Repeater Link. Or, if you’ve already installed EchoLink, choose Link Setup Wizard from the Tools menu. In either case, choose URI as the type of interface to be used. (If the URI option is grayed out, check to be sure the drivers installed themselves correctly, and that the device is properly connected.)"
