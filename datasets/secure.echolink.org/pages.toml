["https://secure.echolink.org/authentication.htm"]
title = "Authentication"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink's policy is that each user must hold a valid Amateur Radio license in order to be allowed access. Each new user must be validated, and the most critical part of validation is authentication. Authentication is simply verifying that you are who you say you are. If your callsign is W1XYZ, you would probably not be pleased if we granted access to someone else claiming to be W1XYZ. The first step is to download, install, and run the EchoLink software. This registers your callsign with the system. However, you will not be able to connect with anyone on the EchoLink network until you have been authenticated. Please understand that the purpose of authentication is not to exclude any licensed Amateur from using EchoLink, but to ensure its continued enjoyment by you and other users who appreciate its commitment to security. Part of this is to ensure that the callsign you're using is valid. But the other, and most important part, is to verify that you are indeed the licensee. There are several different ways you can authenticate yourself for EchoLink. The specific options available vary somewhat depending upon the country in which you are licensed. Note that one of the validation options may be to scan and upload a copy of your station license. If you choose this option, the file you upload must be one of these file types: JPG, GIF, PDF, or PNG. Complete instructions on how to upload are provided on the Validation pages. To be validated, the requestor must hold a current, valid amateur radio license, CEPT Class 2 or equivalent, or above. The following callsigns will not be accepted for validation: EchoLink will accept validation for a club or repeater callsign if a valid copy of the club station's license document is provided, subject to the same rules as any other station license. However, a club or repeater callsign will not be validated for single-user mode, only for sysop mode (with a -L or -R suffix)."
