["https://secure.echolink.org/firewall_solutions.htm"]
title = "Firewall Solutions"
full_description = '''Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status Most likely, a problem with your network set-up is preventing your node from receiving messages from other stations over the Internet. This is a very common issue. Please note that this is not a problem with the EchoLink software itself. For this reason, the EchoLink Support team will not be able to help you solve it. However, the information on this page might help. It's also recommended that you first try the Firewall/Router Test Page on this site. The solution depends on what kind of hardware and software you are using for your Internet connection. Unfortunately, many different hardware and software products may be involved, so it is not possible to document every solution. A few of the most common situations are listed below. EchoLink requires that your router or firewall allow inbound and outbound UDP to ports 5198 and 5199, and outbound TCP to port 5200. If you are using a home-network router, you will also need to configure the router to "forward" UDP ports 5198 and 5199 to the PC or device on which EchoLink is running. (Do not forward TCP 5200). Allow UDP destination ports 5198-5199 between Internet and EchoLink node in both directions Forward UDP 5198-5199 to your EchoLink node Allow TCP (source port any, destination port 5200) from EchoLink node to Internet The information above applies to every situation, regardless of the type of equipment and software you are using. If the information below does not help you solve the problem, please consult your equipment's documentation, or contact the manufacturer for support, and provide them with the information above. Note: If you are using Internet security software and have recently upgraded to a newer version of EchoLink, you may need to re-apply the special security settings you had established earlier. If you connect to the Internet using DSL, Fiber, or Cable Modem service, there might be a router built into the equipment that the telephone company or cable company provided you. For example, some of the equipment provided by Comcast and Verizon have built-in routers. Check the make and model of your modem or router, and then look for instructions on one of the Web sites described below.'''
