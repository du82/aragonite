["https://secure.echolink.org/faq_advop.htm"]
title = "FAQs - Advanced Operating"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies Try to find out about commonly-used simplex frequencies in your area, and then choose a frequency that is not commonly used as your link frequency. Good sources of information are local clubs and frequency coordinators. By all means, avoid repeater input or output frequencies, unless of course you are setting up a link to a repeater, which you should only do with the permission of the repeater trustee. In most areas, you should also avoid standard frequencies such as 146.52. Also, please avoid frequencies that are typically used for weak-signal or satellite operation such as the 145.8 to 146.0 band. Beginning with Version 1.7, you can use Windows Task Scheduler to invoke special scripts to enable or disable your node. These scripts can be found in the same program directory as the EchoLink software. Multi-conferencing is the connection of one conference to another. EchoLink includes safeguards to prevent multi-conferencing, since there is currently no reliable way to detect and prevent conference loops , in which more than one path is established between conferencees. Conference loops can cause substantial disruption of communication for all participants. However, EchoLink includes automatic conference-loop detection, and allows multi-conferencing to be enabled. For more information, see the Conferencing section in the EchoLink Help file. If another station's attempt to connect to yours is denied, the specific reason is noted in the log. Choose Log from the View menu to open up the log file, then scroll to locate the date and time on which the attempt was made (or choose Find to locate the callsign). This number indicates the number of stations which are currently connected to that station, when Conferencing is enabled. If the station's conference limit hasn't yet been reached, the Status will appear as "On", even though several stations may be connected.'''
