["https://secure.echolink.org/faq_installation.htm"]
title = "FAQs - Installation"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink was developed on Windows 10, and has been tested extensively on Windows 10/11 and Windows 7. It is designed to run on all 32-bit and 64-bit versions of Microsoft Windows, Vista and above. (The current version of EchoLink does not run on Windows XP, nor Windows editions prior to XP.) Currently, there are no plans to offer official versions of EchoLink for other desktop operating systems. You should see an EchoLink icon on your Windows desktop. Double-click this icon to start the program. You can also start EchoLink by opening the Start menu (at the bottom left), choosing Programs, and then choosing the appropriate folder. This is called "EchoLink", unless you chose something different during installation. Choose this folder, then click "EchoLink", next to the radio-tower icon, to start the program. Simply download and install EchoLink as you did previously. Do not delete or un-install your older version. The installer will update the program automatically and retain your existing settings. From your Windows Control Panel, double-click the Add/Remove Programs icon, then select EchoLink from the list of programs and follow the instructions on the screen. If you had already removed some files from the EchoLink folder manually, you can do a "clean" un-install by re-installing the program and then following the procedure above. You are free to install EchoLink on as many computers as you wish. Once your callsign has been validated, there is no need to be re-validated for additional installations. However, be sure to follow these guidelines: No, unless you've made special arrangements with your Internet provider to use more than one Internet address. Otherwise, it won't work because EchoLink requires each node to have a different public IP address.'''
