["https://secure.echolink.org/googleInfo.htm"]
title = "EchoLink and Google Earth"
full_description = "Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status Google Earth is a desktop application that provides detailed views of the Earth's surface by combining a variety of data sources, such as maps and satellite images. If you have installed this program on your computer, you can also use it to view the location of many active EchoLink nodes. First, download the Google Earth software from the Google Earth web site. Then, on the Link Status page, click on the Google Earth View link to open the Google Earth application. This will download the positions of EchoLink nodes and display them. You can also set up Google Earth to retrieve this information directly from the EchoLink site periodically, by adding it as a Network Link. The URL for the Network Link is http://www.echolink.org/node_location.kmz. The nodes and positions shown in the Google Earth view are taken from the same data that is presented on the Link Status page. Only active links are shown. The latitude, longitude, and frequency of each node are provided by the individual node owners via the RF Info tab of the EchoLink software; this information has not been independently verified. Also, not all node owners have provided this information, so not all active nodes are included in the display. A:The information for the Google Earth view is updated on the EchoLink Web site approximately once every three minutes. How often your Google Earth software updates itself depends on how often it is set up to retrieve this data. A: On the RF Info tab under Sysop Settings, be sure you have entered the latitude and longitude correctly. Following the APRS standard, this information must be entered in degrees and decimal minutes. A common mistake is to enter the location in degrees, minutes, and seconds, which is not the same thing. To convert fractional degrees to decimal minutes, multiply the fractional part by 60. For example, if your latitude is 42.155167 degrees, enter 42 degrees and 09.31 minutes."
