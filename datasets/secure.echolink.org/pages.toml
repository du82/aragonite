["https://secure.echolink.org/faq_servers.htm"]
title = "FAQ - Servers"
full_description = 'Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies No. Contrary to popular belief, the server only provides a list of available stations -- it is not involved in connecting to another station, or in exchanging audio or text during a QSO, except for certain signals used to assist with firewall pass-through. All of your communication with another station is transmitted directly to that station over the Internet, without going through a server. However, if you notice audio break-up while the station list is refreshing, it may be because the new information coming down from the server is filling up the same Internet "pipe" you use for your QSO. To avoid this, un-check the option "Even while connected" on the Stations tab of the Preferences window. The EchoLink servers, which have been custom-designed for use with the EchoLink software, are installed at various locations around the world. Typically, 4 servers are online at a given time. The total load is balanced among them so that no single server becomes overloaded. The servers replicate (exchange data) with each other every 20 seconds so that all servers in the network show essentially the same information to all users. The servers and the EchoLink software are also designed so that users are automatically shifted to another server in case one (or more) fails. This architecture has proven to be highly reliable, with the system experiencing approximately 99.999% uptime since September 1, 2002, even as load has increased from about 300 users online at a time to more than 6,000. The servers now process more than 2,000,000 transactions per day. The servers are now all operated on Linux virtual instances in the Amazon Elastic Compute Cloud (EC2). The cloud servers are in various locations in the United States and Europe. It is estimated that this arrangement of servers can support about 5 times the current worldwide load.'
year_published = 2025
clearnet = "https://secure.echolink.org/faq_servers.htm"
