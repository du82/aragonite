["https://secure.echolink.org/validation_docs.htm"]
title = "Validation Documents"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies The purpose of this request is usually not to determine whether the callsign is valid (that can often be checked elsewhere), but to verify that you are indeed the licensee -- in other words, to prove your identity. If you decide you don't want to provide proof of license, no action is required on your part; your original validation request will be withdrawn automatically. You can un-install the EchoLink software using the Add/Remove Programs applet in your Windows Control Panel. If you wish to be validated, the document you send must be a photocopy (or digital photograph) of the Amateur license, showing the callsign under which you are requesting validation. (An exception is for the United States, which has a special validation procedure; see below). The copy must clearly show the station license expiration date, if applicable in your country, and the document must not have expired. If you live in a country where operator licenses and station licenses are separate documents, you must provide the station (or apparatus) license. Unofficial documents, such as QSL cards, award certificates, and callbook pages cannot be accepted for validation. We also cannot accept anything that was downloaded from a public Web site. If you have recently been licensed and have not yet received your documentation, please wait until it arrives. Validation of U.S. callsigns requires downloading a PDF Official Copy from the FCC ULS web site. See the step-by-step instructions at echolink.org/validation/uls. For all other countries, the license copy may be sent to the EchoLink validation team by uploading it directly, scanning it and uploading the scan, or by sending it as a fax. Certain other validation options may also be available. Please go to the Validation page to begin."
year_published = 2025
clearnet = "https://secure.echolink.org/validation_docs.htm"
