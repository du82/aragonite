["https://secure.echolink.org/faq_validation.htm"]
title = "FAQs - Validation"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies For proper security, EchoLink requires that only duly-licensed Amateur Radio operators have access to the system. Each new user's callsign must be validated before being given access to the EchoLink system. The most important part of validation is authentication. EchoLink offers you several different options. To begin, please see Validation . For more information about authentication and access-control policies, please see the sections Authentication and Access Policies. Outside of the U.S., it may be possible to send a copy of your current license. Uploading or faxing a copy of your license are just two of the available validation options. If you choose one of these options, complete instructions on how to send it are provided on the Validation pages when you make this choice. Amateurs in the U.S. may choose Official Copy PDF upload or credit-card-based verification. Step-by-step instructions for each option are provided on the Validation pages. In most cases, there isn't a shadow of a doubt that the callsign is valid; callsign validity is usually easy to verify. What we are asking you to do is authenticate yourself, which means proving that you are who you say you are, just like showing a driver's license when you write a check. In fact, if your callsign is well-known around the world, it is even more likely to be a target for pirating. You would probably not be happy if you heard someone else using your callsign on the air because we had taken for granted that it was you. Many hams are surprised to learn how many non-hams have attempted to gain access to EchoLink over the years by pretending to be someone else — and sometimes going to great lengths to do so. Keep in mind also that many online callbooks (such as QRZ.COM) are very useful for obtaining QSL address information, but are not necessarily reliable for callsign verification, since most non-U.S. information does not come from official sources. Most of these sites allow new calls to be added to the database by unauthenticated users."
year_published = 2025
