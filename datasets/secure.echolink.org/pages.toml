["https://secure.echolink.org/firewall-friendly.htm"]
title = "EchoLink, Firewalls, and Routers"
full_description = '''Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status Your connection to the Internet might be going through a router or a firewall. These devices can improve the security of your computer, and can allow a single Internet address to be shared by more than one computer on your network. However, routers and firewalls can be a problem for peer-to-peer programs such as EchoLink. The reason is that EchoLink nodes communicate directly with each other over the Internet, rather than sending all of their packets through a server. This is good for the efficiency and scale of the system, but it is not always "firewall-friendly". By far, the most common problem involves a device called a NAT router. Now that broadband Internet connections are so common, NAT routers are more widespread than ever. NAT stands for network address translation. If you have a home network or DSL service, you're likely to have one of these. It poses a problem for EchoLink because it normally does not allow unsolicited packets from the Internet to reach your PC. The solution to this problem is to configure the port forwarding feature of the router to allow certain packets to reach the EchoLink software. Unfortunately, each make and model of router has a different procedure for setting up port forwarding, so the steps to follow aren't easy to document. (A good starting point, however, is portforward.com. Please use this is a good information resource, and not necessarily for the software being sold on that site.) Furthermore, in many situations (such as public Wi-Fi hotspots, cellular hotspots, and other wireless Internet service), you might not even have access to the router to be able to change its configuration. For more discussion about internet service providers and EchoLink, please see Internet Service Providers. A: In most cases, you will be able to connect to conference servers, EchoIRLP nodes, and nodes running EchoLink, without setting up your router. But to ensure that you can connect to all nodes, you will need to set up port forwarding in your router, or use an EchoLink Proxy, or a VPN service.'''
year_published = 2025
