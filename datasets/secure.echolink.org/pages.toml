["https://secure.echolink.org/download.htm"]
title = "Download EchoLink"
full_description = '''EchoLink® software is offered free of charge to licensed Amateur Radio operators worldwide, for Amateur Radio use only. Please note that you must hold a valid Amateur Radio license in order to use EchoLink. After installing the program, you must provide proof of license if you wish to use it; see Authentication for more information. Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status This is a self-extracting installer, which installs the program and the help file. Download this file to your hard drive and then open it to begin installation. After installing, you can run EchoLink from the Programs section of your Start menu, or from your desktop. Proof of license is required for all new EchoLink users. After downloading and installing the software, please run it to register your callsign with the system. Then, to begin the validation process, click here. Note: If you are running a very old version of Windows, such as Windows XP, please use the legacy installer here. 2.0 Version of EchoLink v 2.0.908 Download This installer supports Windows Vista and above. For older versions of Windows, please use the legacy installer instead. EchoLink Proxy Software v 1.2.3 Download Works together with EchoLink (version 1.9 or above) to allow access to the EchoLink network via restricted Internet services in hotels, airports, offices, and other areas. Please see EchoLink Proxy for more info and installation instructions. EchoLink Programmer's Reference Download | Online Edition Information for software developers interested in creating programs and scripts to interact with the EchoLink for Windows software. Note: You must download this file before opening it; do not choose "Open" or "Run" after clicking the link above. EchoLink App for iOS EchoLink for iOS runs natively on iPhone and iPad. It is available from the iOS App Store. EchoLink App for Android EchoLink for Android works on Android phones, tablets, and other devices. It is available from Google Play.'''
