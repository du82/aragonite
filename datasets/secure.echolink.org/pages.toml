["https://secure.echolink.org/faq_audio.htm"]
title = "FAQs - Audio Issues"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies There is a special "echo" conference server, called *ECHOTEST*, to which you can connect to test your audio. Once connected, the server simply records anything you transmit and plays it back. This is a convenient way to verify that your transmitted audio is clean, and to adjust record and playback sound levels. You can connect by choosing "Connect to Test Server" from the Station menu. If you are connecting to EchoLink via an RF link, the node number for *ECHOTEST* is 9999. If you're not hearing any audio, first check to see if a text message appears on the right-hand side of the screen when you establish the connection. (Typically, this message says a few words about the station you have connected to.) If not, you might have a "firewall" problem that needs to be resolved -- see the Connecting FAQ. Next, double-check the settings under Tools->Setup, on the Audio tab. The two audio devices listed should match the name of the sound card you're using, or should be set to "[system default]". Finally, be sure your computer's microphone and speakers are plugged in properly, and the audio levels are set right. Go to Tools->Adjust Volume->Recording and be sure the Microphone is turned up, selected, and not muted. Then, go to Tools->Adjust Volume->Playback and be sure that Volume Control and Wave are both turned up, selected, and not muted. Also, be sure the volume control on your speakers is turned up. Despite its amazing capabilities, the Internet does not form a perfect connection between your computer and the other station's computer. Information on the Internet moves along many diverse paths, most of which are shared with others. As a result, information can be delayed, or sometimes even get lost.'''
