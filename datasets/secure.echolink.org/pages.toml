["https://secure.echolink.org/faq_iphone.htm"]
title = "EchoLink for iOS"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink for iOS is an edition of the EchoLink software that runs on an iPhone, iPad, or iPod touch. If you own one of these devices and are a validated EchoLink user, you can access the EchoLink system from nearly anywhere where WiFi networking is available. If you have an iPhone or cellular-capable iPad, you can also use it to access EchoLink over the cellular data network. EchoLink for iOS is available free of charge from Apple's App Store. EchoLink for iOS runs on any iPhone, iPod touch, or iPad running iOS 10.0 or above. You can also run it on a Mac with an Apple M1 or M2 chip, on macOS 11.0 or above. If are running an older version of iOS, go to Settings->General->Software Update to see if a newer iOS version is available. (Some older devices are not upgradeable to iOS 10.) If you had already installed EchoLink on a device running an older iOS version, EchoLink will continue to work, but it cannot be upgraded to 2.0 or beyond. The iOS edition focuses on the basic features of EchoLink, such as managing the Station List, connecting and disconnecting, and transmitting and receiving voice and text. Unlike the Windows edition, you can be connected to only one node at a time, and there is no Sysop mode. The user interface has been re-designed to function smoothly on the smaller screen of the iPhone, and to take advantage of some of its built-in hardware features. If you have used EchoLink before (for example, on Windows), enter the callsign and password you already have. Otherwise, choose and enter a password, and the app will walk you through the first part of the registration procedure. Yes. Although the app uses the device's microphone and speaker by default, you can switch the audio source to a paired Bluetooth device, AirPlay, or the internal handset audio after startup, using the icon that appears just to the right of the audio-level meter on the QSO screen."
