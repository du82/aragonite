["https://secure.echolink.org/faq_webapp.htm"]
title = "FAQ - EchoLink Web"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink Web is an edition of EchoLink that runs entirely within a Web browser. It runs on various browsers and OS platforms and doesn't require any app to be installed — just click and go. Go to webapp.echolink.org and enter your existing EchoLink callsign and password. EchoLink Web requires a single-user-mode EchoLink callsign (with no -L or -R suffix). If you enter a callsign which hasn't yet been validated, you'll be prompted to begin the validation process. If you get the message "incorrect password", you can re-set your EchoLink password on the Validation page. During audio transmissions, EchoLink Web uses about 650kbps downstream and 128kbps upstream; this is similar to other audio/video applications such as Skype. If you select the Low Bandwidth option in Settings, the downstream bandwidth becomes 128kbps, with slightly lower audio quality. No — EchoLink Web is a client-server application, and all its connections operate through EchoLink's proxy network, so it should work over nearly any good Internet connection, without any special settings. All data in transit is encrypted, for privacy. The page may ask for permission to use the microphone. Granting permission to use the microphone is required if you wish to transmit. If you deny permission, the app will be receive-only. Normally, EchoLink Web uses the system-default sound devices. If you wish to change this, you can choose a specific pair of sound devices in the app's Settings. You can begin and end transmitting by clicking on the Transmit button, or by pressing and holding the space bar. (You can only transmit when the EchoLink Web page is in the foreground.) Favorites are currently supported, and Alarms will be supported in the near future. Your lists can be accessed from any browser on which you log in to EchoLink Web. However, these lists are initially empty — even if you've set up Alarms or Favorites already on another platform, you'll need to do this again for EchoLink Web, the first time you use it.'''
