["https://secure.echolink.org/access_policies.htm"]
title = "Access Policies"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies The following guidelines are followed for all stations requesting access to the EchoLink® system. These guidelines have been established to help ensure legal, courteous enjoyment of the system by every station. Every effort is made to apply these policies universally and fairly. Although EchoLink is offered free of charge, please keep in mind that it is a privately-operated system. All EchoLink users are guests on the system, and are being permitted the use of it in exchange for following these guidelines. Please note that the EchoLink software allows additional security policies to be adopted by individual stations. For example, a station not wishing to be joined to a conference can disallow such access. These decisions are made by each individual station and are not under the control of the developers of EchoLink, or the servers with which it operates."
