["https://secure.echolink.org/faq.htm"]
title = "FAQs"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink allows licensed Amateur Radio stations to connect to one another over the Internet. You can use EchoLink to connect your station (or your computer) over the Internet to other amateurs using the same software, and carry on a voice QSO. This greatly enhances the range and utility of mobile and portable VHF/UHF-FM stations, and also allows computer-equipped hams to access distant repeaters directly. You can access EchoLink either with a radio or a computer. If you are in range of an FM repeater or simplex station equipped with EchoLink, you can use DTMF commands from your radio to access the EchoLink network. If you are a licensed amateur with an Internet-connected PC, you can access EchoLink stations directly from your PC. First, download and install the Windows software from this Web site, or install the mobile app from the Apple App Store (iOS) or Google Play (Android). Then, start it up to register your copy of the software. The final step is to provide proof of license so your callsign can be added to the system; see Validation for details. Then, you're ready to go. No. EchoLink is an extension of conventional voice modes, particularly FM. EchoLink communicates over the Internet digitally, but does not transmit any digital signals over the air. Definitely not. EchoLink is a system designed to provide VoIP gateways for repeaters and simplex stations. If you are interested in talking (by voice) with other Internet users from your computer, or you would like to participate in or set up your own Internet chat room, please use one of the many excellent software packages designed for this purpose, such as Google Meet or Microsoft Teams. For Windows, there is only one edition of EchoLink, which can be operated either in "user mode" or "sysop mode". Switching to Sysop mode enables all of the features needed for connecting a transceiver to EchoLink using an interface. Please see Sysop (Link) Nodes for more information. The iOS and Android editions of EchoLink do not have a Sysop mode.'''
