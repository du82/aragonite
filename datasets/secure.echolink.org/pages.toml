["https://secure.echolink.org/faq_new_node.htm"]
title = "FAQ - Setting Up a New Node"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies Every station logged into the EchoLink system is considered a node, including RF gateways (also called Sysop nodes), conference servers, and individual users who are running software using a microphone and speakers. Even EchoLink running on an iPhone is considered a node. Each node on the system must have its own unique callsign. Some callsigns have a -L or -R suffix; these indicate RF links to simplex frequencies or repeaters. Each of these combinations is considered a separate callsign, so W1XYZ, W1XYZ-L, and W1XYZ-R are considered to be three separate callsigns; they can even have different passwords from one another. RF links are also known as "sysop nodes". For more information about this type of node, please see Sysop (Link) Nodes. Each EchoLink node also has a node number. The node number is assigned to the node when it is initially registered. Node numbers have no special significance; they exist to make it easier to connect using DTMF digits. Each callsign has one node number, and each node number has one callsign. You can look up the node number for any validated EchoLink callsign on the Validation page at echolink.org/validation. No, EchoLink does not dispense node numbers. To set up a new node, please set up your hardware and software, configure it with the correct callsign, and start it up to register the new node with the system. Then, proceed to Validation. When the callsign is validated, a node number will be assigned to it. Node numbers are managed by the EchoLink servers and do not need to be stored in your node's local configuration. The only suffixes available for Sysop nodes are -L and -R. Some link operators have a need to run more than two Sysop nodes. If you are already using the -L and -R suffixes for active nodes and have a need to run additional nodes, the only option is to run the additional nodes under another base callsign. Radio clubs often use the repeater's callsign for one of their nodes, and another club member's callsign for additional nodes.'''
