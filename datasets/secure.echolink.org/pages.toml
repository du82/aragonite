["https://secure.echolink.org/faq_android.htm"]
title = "EchoLink Android"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink for Android is an edition of the EchoLink software that runs on an Android smartphone or tablet. If you own one of these devices and are a validated EchoLink user, you can access the EchoLink system from nearly anywhere where WiFi or cellular networking is available. EchoLink for Android is available free of charge from Google Play; tap the Google Play icon on your phone and search for EchoLink. Or, if you have a bar code scanner app on your Android phone, scan the QR code that appears to the right. The Android edition focuses on the basic features of EchoLink, such as managing the Station List, connecting and disconnecting, and transmitting and receiving voice and text. Unlike the Windows edition, you can be connected to only one node at a time, and there is no Sysop mode. The user interface has been re-designed to function smoothly on the smaller screen of a smartphone, and to take advantage of some of its built-in hardware features. EchoLink for Android has some special networking features to make it work more smoothly with different kinds of mobile and wireless networks. Yes. Although Relay is the default, and will generally give the best performance, the following limitations currently apply: If you're connecting over cellular instead of WiFi, you are using your carrier's cellular data network to communicate with the Internet. If you have a flat-rate, "unlimited" data plan with your carrier, you are probably not being charged extra, since streaming audio is permitted within the data plan. If you have any doubts, check with your wireless provider to be sure. You can request a password re-set from the Validation page on the EchoLink Web site. But please note that if you've forgotten your password and you've changed your e-mail address, we have no way to confirm your identity, so you'll need to be re-valdated. Follow the steps described in Password Reset if that's the case.'''
