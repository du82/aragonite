["https://secure.echolink.org/v71a.htm"]
title = "EchoLink and the Kenwood TM-V71A"
full_description = "Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status The Kenwood TM-V71 and TM-D710 are the first commercially-available Amateur Radio transceivers with built-in EchoLink system capabilites. There are two different features of these rigs that make them useful for EchoLink operation: The TM-V71 and TM-D710 have been designed and built entirely by Kenwood. Specific questions about this equipment should be addressed to Kenwood, or to your dealer. However, the FAQ below is being provided as a guide to getting these radios up and running with the EchoLink software. Q: I'm planning to set up an EchoLink node by connecting the TM-V71 or TM-D710 to my PC. How do I configure the rig's DTMF memories? A: The EchoLink DTMF memories in the TM-V71 and TM-D710 are not used when the transceiver is acting as an EchoLink node (in Sysop mode). Instead, this feature is intended to be used by mobile stations when contacting a node over the air. See the Kenwood manual for details on this feature. A: You would connect the TM-V71 or TM-D710 to your PC if you are setting up your own EchoLink node, which will function as a gateway between local RF signals and the EchoLink network. You will need the optional cable set offered by Kenwood (PG-5H), which is package of two different cables. Following the instructions in the manual, connect the cables to the two jacks in the back of the radio and to the serial port and sound card jacks of your computer. The pink plug goes to the mic input of the sound card, and the green plug goes to the line out (or speaker out). The black 9-pin connector goes to the serial port. A: If your computer has no serial port, you will need to use either a serial-to-USB adapter cable, or a serial port option card. Either can be purchased from stores that sell computer accessories. A: You might be able to wire your own cables if you can get a hold of matching plugs for the two multi-pin jacks in the back of the TM-V71A. Diagrams showing the pin-outs of these two jacks can be found in the Kenwood manual on pages 83 and 90."
