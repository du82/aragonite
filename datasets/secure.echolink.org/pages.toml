["https://secure.echolink.org/support.htm"]
title = "Support"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies EchoLink is offered free of charge to the Amateur Radio community, and is supported by a small network of volunteers. Experience has shown that the majority of questions about EchoLink are similar, and can be answered by reading the Help documentation or one of the Frequently-Asked Questions sections. Most likely, you'll find that your particular question or problem has already been answered or addressed. General Topics Installing the Software Callsign Validation and Passwords Problems Connecting to Other Stations Problems Connecting to Servers Basic Operation Advanced Operation Audio Issues EchoLink for iOS EchoLink for Android EchoLink Web Firewall Solutions EchoLink Proxy Conference Servers If you are writing about a possible bug, please first check the section Known Bugs to see if the issue has already been discovered. If you still need help, and you have a question that isn't answered in the FAQs above, please fill out the form below and your question will be directed via e-mail to someone who can help. Be sure to include your own e-mail address if you expect a reply. Your patience is appreciated by those who devote their free time to supporting EchoLink."
