["https://secure.echolink.org/faq_connecting.htm"]
title = "FAQs - Connecting"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies Most likely, there's an adjustment which needs to be made to your router or your computer's "firewall" configuration. Please note that this is not a problem with the EchoLink software itself ; it will probably require adjustment to other equipment or software you may have, so there isn't much additional help we can provide you. However, we have posted some tips on the Firewall Solutions page. Also, keep in mind that if you are able to start up the EchoLink software and you can see the list of stations on the screen, there is nothing wrong with the validation of your callsign, or your password. If you're not hearing any audio, first check to see if a text message appears on the right-hand side of the screen when you establish the connection. (Typically, this message says a few words about the station you have connected to.) If not, you might have a "firewall" problem that needs to be resolved -- see the first FAQ above. Next, double-check the settings under Tools->Setup, on the Audio tab. The two audio devices listed should match the name of the sound card you're using, or should be set to "[system default]". A common reason for this is that the other station is having a "firewall" issue, such as mentioned above. If that's the case, the other station will be able to connect to yours, but won't realize he's connected since he never receives an acknowledgement. He would also not hear any transmissions you make after connecting. Another reason is that some PC users might be clicking on various nodes to connect and look for a QSO already in progress, and then disconnect when nothing is heard. This is a very bad practice, but it is unfortunately hard to avoid. Each station running EchoLink has the option of setting its own security policy. The message "access denied" means your request to connect was rejected by the other station because of one of its security rules.'''
