["https://secure.echolink.org/proxy.htm"]
title = "EchoLink Proxy"
full_description = '''Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status EchoLink is a peer-to-peer system, by design. This means that when your node is connected to another node over the Internet, the voice and text signals are sent directly from one node to the other, rather than going through some central server. This helps ensure that the system is scalable and reliable. Unfortunately, there are certain situations in which peer-to-peer connections such as these are difficult to establish. A growing number of Internet providers are offering "one-way" access to the Internet — allowing your computer to initiate a connection, but not to accept one. These include wireless community networks, or hotspots. An example is the wireless Internet service now being provided by many hotels to their guests. Guests with wireless-enabled laptop computers can check their e-mail and surf the Web from their rooms. The hotel uses a router with a fast Internet connection and a single public address (or a small pool of addresses) shared amongst all guests. This arrangement does not work with EchoLink, because the guests' computers are not reachable from the Internet. A solution to this problem is to split the EchoLink software into two pieces � one that runs on your laptop, and the other that runs on a PC in some other location with good Internet access. With this arrangement, the laptop need only establish a single, outbound Internet connection to the PC. Then, the EchoLink software on the laptop "tunnels" all traffic through this connection to the remote PC, and the PC in turn establishes all of the necessary peer-to-peer connections to other EchoLink nodes. In this scenario, the PC is acting as a proxy on behalf of the laptop. EchoLink now offers special software to make this possible. The proxy software, which is designed specifically for use with EchoLink, is called EchoLink Proxy. The diagram below illustrates how EchoLink Proxy can be used.'''
year_published = 2025
clearnet = "https://secure.echolink.org/proxy.htm"
