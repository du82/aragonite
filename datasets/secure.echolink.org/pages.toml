["https://secure.echolink.org/sysop_nodes.htm"]
title = "Sysop (Link) Nodes"
full_description = "Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies Although you can run EchoLink directly from a PC or mobile device, the true power of EchoLink lies in its ability to bridge between the worlds of Internet and RF. This is accomplished through the thousands of nodes on the system that run in Sysop mode; that is, which function as links between EchoLink and a local repeater or simplex frequency. If you want to set up your own link, there are many ways to do it, with different combinations of hardware and software. This page describes some of the most common approaches. A “hotspot” is a low-power simplex link which serves only a very small area, such as the inside of your own home. With this arrangement, you can use an HT to communicate with any station on the EchoLink system, as long as your HT is in range of your hotspot. This type of node will have a -L callsign suffix. A simplex link is just like a hotspot, but it serves a wider area and might be intended for use by other hams who are in range of it. It will typically have higher power and a better antenna than a hotspot, and will be tuned to a carefully selected, clear frequency. This type of node will have a -L callsign suffix. A repeater link serves an existing repeater, adding EchoLink capability to it. With a repeater link, anyone who is in range the repeater can benefit from being able to connect to any node on the EchoLink system and carry on a QSO just as if it were a local station. Other nodes on the EchoLink system can also discover and connect to the repeater via this link. This type of node will have a -R callsign suffix and will typically use the same callsign as that of the repeater it serves. There are two ways to set up a repeater link. One is to build it exactly like a simplex link — a PC connected through an interface to an FM transceiver, but with the transceiver tuned to the frequency pair of a local repeater. This is often the most convenient approach, since this equipment can be located anywhere in range of the repeater, such as at your own QTH. The second way is to co-locate the equipment at the repeater site, as long as the site has Internet access. Although often more complicated to set up, this can be more reliable and more operationally sound, since it is less susceptible to interference and can provide a cleaner experience on-air."
year_published = 2025
