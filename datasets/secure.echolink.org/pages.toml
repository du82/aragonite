["https://secure.echolink.org/faq_operating.htm"]
title = "FAQs - Operating"
full_description = '''Home Up FAQ - General FAQ - Installation FAQ - Callsign Validation FAQ - Nodes FAQ - Servers FAQ - Connecting FAQ - Operating FAQ - Advanced Operating FAQ - Audio FAQ - iPhone FAQ - Android FAQ - EchoLink Web Firewall Solutions Authentication Validation Documents Access Policies First, try connecting to the Test Server (*ECHOTEST*). If that succeeds, but connections to some other nodes fail, it's most likely a networking issue at the other end. However, if the test to *ECHOTEST* fails, you might need to make an adjustment to your router or your computer's "firewall" configuration. For more information, see the Firewall Solutions section, or the Help section "Firewall Issues". A yellow-highlighted line indicates a station which has just recently come on line. If a station's Status is highlighted, it means the station's status has recently changed (from On to Busy, or vice versa). The [r] indicates a station running on a smartphone or tablet (Echolink for iOS or Android) which is operating through a Relay server. In this configuration, the station can make outgoing connections, but can't accept incoming connections; if you try to connect to one of these, you'll get a "No Route Available" message. Because each EchoLink station must have a different Internet address, it is not possible to run EchoLink on two or more computers that share a common "public" address, even under different callsigns, unless you choose one of the Proxy options, or run one or both using a VPN service. Some cable-modem and DSL providers, however, offer the option of multiple IP addresses sharing the same Internet connection. Several amateurs have had success using screen readers with EchoLink. The program has also been designed so that nearly all functions are accessible from the keyboard. For some tips on using EchoLink with screen readers, e-mail Roger, KA1USA, at rrc@ime.net Yes. Virtually all of the mouse commands have keyboard equivalents. For a full list, see the Keyboard Commands section in the EchoLink Help file.'''
