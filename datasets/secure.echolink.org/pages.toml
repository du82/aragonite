["https://secure.echolink.org/conf.htm"]
title = "Conference Servers"
full_description = 'Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status Each installation of EchoLink can operate as a conference host in Sysop mode, with up to 99 other stations connected in roundtable fashion, if your Internet connection has sufficient bandwidth to support it. In this configuration, the software runs under your own callsign, and there is no need to run extra software on a separate computer under a separate IP address. To enable this feature, go to the Connections tab of the Preferences screen. See Conferencing for details. Some EchoLink users have also set up dedicated conference servers, which are designed specifically to support large, continuous conferences, often dedicated to a particular theme or interest. These conference servers are listed separately in the Station List, and have names beginning and ending with an asterisk (such as *CONF*). These dedicated conference servers use a different software package called theBridge, developed and maintained separately from EchoLink. If you wish to establish such a server, please follow the guidelines below. If you wish to run a dedicated conference using theBridge, please apply for conference server validation at www.echolink.org/conf.jsp. <!-- google_ad_client = "ca-pub-9750999421065379"; /* Banner */ google_ad_slot = "6011041761"; google_ad_width = 468; google_ad_height = 60; //-->'
