["https://secure.echolink.org/interfaces.htm"]
title = "Interfaces"
full_description = "Home Take a Tour Download Validation Interfaces Support and FAQs Help Files Call CQ! News and Tips Vanity Node Numbers Conference Servers Routers and Firewalls Current Logins Link Status For maximum flexibility, EchoLink is designed to work with several different types of interfaces. Below is a partial list of high-quality interfaces which are specifically recommended for use with EchoLink. The URI is a USB-powered interface with a built-in sound chip that lets you connect a transceiver to your PC, with both sound and signalling, over a single USB connection. Please see EchoLink and the URI for more information. The Kenwood TM-V71 and TM-D710 dual-band FM transceivers are the only commercially-available rigs with EchoLink capabilities built in. With these rigs, no special interface is required; you can use the optional PG-5H cable set (or a homebrew cable set) to connect the rig directly to your PC. For answers to frequently-asked questions about using EchoLink with the TM-V71 and TM-D710, please click here. Several models of these general-purpose digital-mode interfaces are available, all of which are compatible with EchoLink. Use EchoLink's internal DTMF decoder when using a RIGblaster and set it to VOX in the Sysop mode. (If you wish to use a RIGblaster and join the EchoLink QSO using the linked radio's microphone, the RIGblaster DXpro or Pro model is required.) This is a USB device that functions as an external sound card, with VOX-controlled PTT, so no connections to your computer's sound card or serial port are required. Pre-wired cables are available for popular transceivers. Can also be used with digital modes such as FT8. This is a USB device that functions as an external sound card, with direct-controlled PTT, so no connections to your computer's sound card or serial port are required. Pre-wired cables are available for popular transceivers. Can also be used with digital modes such as FT8."
