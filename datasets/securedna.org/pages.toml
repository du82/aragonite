full_description = "Get started with SecureDNA Utilize SecureDNA’s free, advanced screening to elevate biosecurity within your operations. Find our onboarding guides and fill out our registration form below, or visit our launch page to learn more. To kickstart your integration and familiarize yourself with our platform, we have provided two starting-point documents: our Quickstart Guide and our API documentation. To receive authorization and begin utilizing our screening services, securely generate your certificate request files here, or follow the manual certificate generation instructions outlined in our Quickstart Guide. Once done, fill out the registration form below and upload your certificate request file. Should you require further assistance or have any questions, our team is ready to support you. If the form is not visible or you have any issues, please use this direct link to access it."
