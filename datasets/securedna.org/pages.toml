["https://securedna.org/exemption_certification_system"]
title = "Exemption Certification System: Safe Access to SOCs"
description = "SecureDNA's Exemption Certification System allows authorized researchers to safely access hazardous DNA sequences, balancing research and biosecurity."
full_description = "Exemption Certification System Streamline Research Access with SecureDNA's Exemption Certification System SecureDNA's Exemption Certification System enables authorized researchers to access hazardous DNA sequences safely and efficiently. This innovative solution balances critical research needs with stringent biosecurity measures, streamlining processes for labs, synthesis providers, and regulatory agencies. Streamlined Approval Process Rapid authorization for pre-approved sequences. Reduces administrative burden on providers and regulators. Enhanced Compliance Ensures adherence to local and international biosecurity regulations. Provides clear audit trails for all exempted sequences. Increased Security Utilizes advanced cryptographic validation. Implements physical authentication measures. How It Works A Research Lab requests an exemption from their Biosafety Officer (BSO) or other biosafety authority. The BSO reviews the requested sequence(s) and other order information. BSO grants approval, issuing an exemption token, a cryptographically signed artifact that contains a public key identification (PKI) certificate. The Research Lab submits the sequence order to manufacturer, including the exemption token The synthesizing manufacturer screens the sequence using SecureDNA, and includes the exemption token at the time of screen, overriding “denial” flags for the specific sequence(s) covered in the exemption token Who It's For Research Laboratories: Gain faster access to necessary sequences DNA Synthesis Providers: Reduce administrative overhead Regulatory Agencies: Enhance oversight and ensure compliance Biosafety Officers: Efficiently manage and monitor sequence approvals Security and Compliance Our system adheres to the highest security standards, utilizing advanced cryptography and physical authentication to prevent unauthorized access. It's designed to meet and exceed current and anticipated regulatory requirements for DNA synthesis screening."
