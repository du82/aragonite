title = "SecureDNA - fast, free, and accurate DNA synthesis screening"
description = "Our challenge is to prevent the immense power of biotechnology from being misused. Historical pandemics killed tens of millions of people, and engineered agents could be even more destructive."
full_description = "System Demo Experience SecureDNA's advanced screening system firsthand Discover SecureDNA's Screening Capabilities Curious about how SecureDNA's cutting-edge screening system works? Now you can experience it directly through our interactive demo. Specifically designed for professionals in the DNA synthesis and biosecurity sectors - including commercial providers, benchtop manufacturers, biofoundries, academic core facilities, research institutions, and more - our demos provide an accessible way to explore the features and benefits of SecureDNA's platform. Option 1: Hands-On System Demo For the best experience, try our System Demo – available through GitHub Codespaces. This interactive environment allows you to run synthclient, the core tool used in SecureDNA's screening infrastructure, directly from your browser. You'll have the opportunity to: Interact with the actual screening software used by providers and researchers. Test sample sequences to see how the system identifies and reports hazards. Explore the API and integration capabilities for automated workflows. Why Use the System Demo? Authentic Experience: Access the same tools and environment used in real-world applications. No Setup Required: Run everything directly in your browser—no software installations or local configurations needed. Guided Instructions: Step-by-step guidance is provided to help you navigate and use the demo effectively. Already have a SecureDNA access certificate? Get Started with the System Demo here! Don’t have an access certificate yet? Quickly and easily request one here! Not familiar with GitHub or Codespaces? No problem. We have made a 4-minute video walkthrough on how to access the system demo you can watch here. Option 2: Quick Online Screening Tool If you're looking for a simpler way to see SecureDNA in action, try our online screening tool. This user-friendly interface allows you to: Submit nucleotide sequences in FASTA format. Receive immediate screening results. Visualize any identified hazards in an easy-to-understand format. Please Note This demo is intended for basic screening purposes and is rate-limited to prevent spam. It is not suitable for submitting sensitive or proprietary information, as sequences entered directly into the webpage bypass the cryptographic protections of our integrated solution. Try the Online Screening Tool"
