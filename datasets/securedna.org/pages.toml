["https://securedna.org"]
title = "SecureDNA: Free, Secure DNA Synthesis Screening Platform"
description = "SecureDNA provides a free, secure system to screen DNA synthesis for potential hazards, safeguarding public health and biotechnology research."
full_description = "Safeguarding DNA synthesis A free, cryptographically secure, and verifiably up-to-date system to screen all DNA synthesis for potential hazards Learn More System Demo What We Do SecureDNA provides free, privacy-preserving DNA synthesis screening to detect security-relevant, controlled, or regulated sequences. Our advanced system helps researchers and companies ensure biosecurity and regulatory compliance without compromising data confidentiality. Why Effective DNA Screening Matters Public health COVID-19 took over 20 million lives worldwide, over 10x more than if a nuclear warhead detonated in a major city, and future pandemics could be even worse. SecureDNA helps to safeguard against potential future risks while safely supporting critical biotechnological research and advancements. Regulation Governments worldwide are recognizing the need for robust DNA synthesis screening. The US has recently introduced a framework, and similar guidelines or regulations are emerging or anticipated in other countries. SecureDNA is designed to meet and exceed these evolving global standards. Liability Implementing comprehensive screening and exemption protocols demonstrates due diligence, potentially mitigating liability risks associated with synthesis of hazardous or controlled genetic material. SecureDNA helps protect providers and their customers. We offer fast, free synthesis screening you can trust The SecureDNA team is composed of academic life scientists and cryptographers, policy analysts, information security specialists, and software engineers from many nations. They came together in 2019 to build a system capable of secure and universal DNA synthesis screening that would be suitable for stepwise or complete implementation by industry stakeholders. Our team"
year_published = 2025
clearnet = "https://securedna.org"
