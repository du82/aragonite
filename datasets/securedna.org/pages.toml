nces, with minimal false negatives."}]}]},{"type":"ul","children":[{"type":"li","children":[{"children":[{"text":"The inclusion of prediction-proof functional variants prevents adversaries from redesigning or mutating the hazard to evade screening. SecureDNA can be aggressive in predicting large numbers of functional variants because it focuses on the specific regions of a sequence most vulnerable to attack, i.e. those that are dangerous and could be modified without loss of function."}]}]},{"type":"li","children":[{"children":[{"text":"Searching for 30-base-pair subsequences – in addition to 20 amino acid peptides – makes it difficult to assemble hazards from oligonucleotides that are too small to be screened using other methods."}]}]}]},{"type":"li","children":[{"children":[{"text":"Specific","bold":true},{"text":": SecureDNA has a negligible false alarm rate due our patented reverse screening system, which removes known non-hazards from the database. This saves you time and avoids human error in interpreting long lists of matches. It also enables integration into synthesizers and assemblers without a human in the loop."}]}]},{"type":"li","children":[{"children":[{"text":"Up-to-date","bold":true},{"text":": Unlike some alternatives, all SecureDNA screening includes recently discovered hazards, because we use a centralized database that is updated swiftly by our biosecurity team as soon as a new threat is identified. There is no reliance on any synthesis company to update a local installation. Since many scientists are actively attempting to "},{"type":"link","newTab":false,"url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9588614/","children":[{"text":"identify"}]},{"text":" and "},{"type":"link","newTab":false,"url":"https://spillover.global/","children":[{"text":"list"}]},{"text":" potential pandemic pathogens, keeping the database up-to-date is an essential part of protecting synthesis providers and the world."}]}]}]},{"type":"li","children":[{"children":[{"text":"Trustworthy","bold":true},{"text":": Customer data is protected by multiple layers of distributed cryptography. This means we never see your customers' sequences, only opaque representations that we cannot decode. All code is open source, so that anyone can inspect it, except the database and the process for generating the database (for security reasons). And SecureDNA is politically neutral, as our screening is run by an independent Swiss nonprofit foundation and without involvement by any government. "}]}]}]},{"children":[{"text":"To our knowledge, no alternative screening solution outperforms SecureDNA on "},{"text":"any","italic":true},{"text":" of: sensitivity, false positive rate, minimum sequence length, or strength of cryptographic sequence protection. SecureDNA combines these strengths with a rapid screening speed, hardware integration capabilities, and a $0 price."}]}]},{"id":"649aeffaf12d548f0a48bb66","title":"What kinds of pathogens does SecureDNA screen for?","text":[{"children":[{"text":'''
