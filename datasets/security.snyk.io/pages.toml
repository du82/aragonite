["https://security.snyk.io/vuln/SNYK-JAVA-ORGAPACHEATLAS-8728358"]
title = "Cross-site Scripting (XSS) in org.apache.atlas:apache-atlas | CVE-2024-46910 | Snyk"
description = "Common Vulnerabilities and Exposures (CVE) are common identifiers for publicly known security vulnerabilities"
full_description = "Common Vulnerabilities and Exposures (CVE) are common identifiers for publicly known security vulnerabilities In a few clicks we can analyze your entire application and see what components are vulnerable in your application, and suggest you quick fixes. Affected versions of this package are vulnerable to Cross-site Scripting (XSS) due to improper input sanitization. An attacker can inject malicious scripts and potentially impersonate another user by submitting crafted input. A cross-site scripting attack occurs when the attacker tricks a legitimate web-based application or site to accept a request as originating from a trusted source. This is done by escaping the context of the web application; the web application then delivers that data to its users along with other trusted dynamic content, without validating it. The browser unknowingly executes malicious script on the client side (through client-side languages; usually JavaScript or HTML) in order to perform actions that are otherwise typically blocked by the browser’s Same Origin Policy. Injecting malicious code is the most prevalent manner by which XSS is exploited; for this reason, escaping characters in order to prevent this manipulation is the top method for securing code against this vulnerability. Escaping means that the application is coded to mark key characters, and particularly key characters included in user input, to prevent those characters from being interpreted in a dangerous context. For example, in HTML, < can be coded as &lt; and > can be coded as &gt; in order to be interpreted and displayed as themselves in text, while within the code itself, they are used for HTML tags. If malicious content is injected into an application that escapes special characters and that malicious content uses < and > as HTML tags, those characters are nonetheless not interpreted as HTML tags by the browser if they’ve been correctly escaped in the application code and in this way the attempted attack is diverted. The most prominent use of XSS is to steal cookies (source: OWASP HttpOnly) and hijack user sessions, but XSS exploits have been used to expose sensitive information, enable access to privileged services and functionality and deliver malware."
year_published = 2025
year_updated = 2025
