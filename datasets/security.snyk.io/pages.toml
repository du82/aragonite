["https://security.snyk.io/package/pip/agentscope/0.0.1"]
title = "agentscope 0.0.1 vulnerabilities | Snyk"
description = "Learn more about known agentscope 0.0.1 vulnerabilities and licenses detected."
full_description = 'Known vulnerabilities in the agentscope package. This does not include vulnerabilities belonging to this package’s dependencies. Automatically find and fix vulnerabilities affecting your projects. Snyk scans for vulnerabilities and provides fixes for free. Affected versions of this package are vulnerable to Exposure of Sensitive System Information to an Unauthorized Control Sphere due to insecure initialization of the _DEFAULT_CACHE_DIR in _app.py, using of user input paths. An attacker can read arbitrary files from the server, including sensitive files such as API keys, by manipulating the filename parameter. Affected versions of this package are vulnerable to Eval Injection via the result = eval(s) field of the is_callable_expression function in the agentscope\web\workstation\workflow_utils.py file. An attacker can execute arbitrary code by providing malicious input to this function. Affected versions of this package are vulnerable to Arbitrary Code Injection. This vulnerability is caused by an incomplete fix for SNYK-PYTHON-AGENTSCOPE-8145542. The applied black-list to filter out dangerous commands can be simply bypassed. For example, the attackers can run rm --rf (note that there are more than one space character in between the rm and -rf) to bypass the check as the blocked item only has one space in between. Moreover, the current black-list also overlooked many other dangerous commands such as netcat, the hackers can simply create a backdoor by the command nc -lvvp 6666 -e /bin/sh to enable a remote shell and then log into the victim system to run arbitrary commands as follows. Affected versions of this package are vulnerable to Arbitrary Code Injection due to improper isolation of the execution of user-provided code. An attacker could achieve takeover of the server running the code by exploiting this vulnerability.'
year_published = 2025
