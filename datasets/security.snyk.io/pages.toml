["https://security.snyk.io/vuln/SNYK-JS-PARSEDURATION-8715711"]
title = "| Snyk"
description = "Snyk has a proof-of-concept or detailed explanation of how to exploit this vulnerability."
full_description = '''Common Vulnerabilities and Exposures (CVE) are common identifiers for publicly known security vulnerabilities In a few clicks we can analyze your entire application and see what components are vulnerable in your application, and suggest you quick fixes. Affected versions of this package are vulnerable to Regular Expression Denial of Service (ReDoS). An attacker could cause an event loop delay or trigger an out of memory error that would crash a running Node.js application by supplying excessively large strings. The out of memory crash can only be achieved if a large amount of data (e.g. 200MB) is sent over a network so it is unlikely to affect common application usage. Denial of Service (DoS) describes a family of attacks, all aimed at making a system inaccessible to its original and legitimate users. There are many types of DoS attacks, ranging from trying to clog the network pipes to the system by generating a large volume of traffic from many machines (a Distributed Denial of Service - DDoS - attack) to sending crafted requests that cause a system to crash or take a disproportional amount of time to process. The Regular expression Denial of Service (ReDoS) is a type of Denial of Service attack. Regular expressions are incredibly powerful, but they aren't very intuitive and can ultimately end up making it easy for attackers to take your site down. $ time node -e '/A(B|C+)+D/.test("ACCCCCCCCCCCCCCCCCCCCCCCCCCCCX")' 1.79s user 0.02s system 99% cpu 1.812 total The entire process of testing it against a 30 characters long string takes around ~52ms. But when given an invalid string, it takes nearly two seconds to complete the test, over ten times as long as it took to test a valid string. The dramatic difference is due to the way regular expressions get evaluated. Most Regex engines will work very similarly (with minor differences). The engine will match the first possible way to accept the current character and proceed to the next one. If it then fails to match the next one, it will backtrack and see if there was another way to digest the previous character. If it goes too far down the rabbit hole only to find out the string doesn’t match in the end, and if many characters have multiple valid regex paths, the number of backtracking steps can become very large, resulting in what is known as catastrophic backtracking.'''
year_published = 2025
