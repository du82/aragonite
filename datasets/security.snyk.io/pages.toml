["https://security.snyk.io/vuln/SNYK-JAVA-ORGAPACHEIGNITE-8728363"]
title = "| Snyk"
description = "Common Vulnerabilities and Exposures (CVE) are common identifiers for publicly known security vulnerabilities"
full_description = "Common Vulnerabilities and Exposures (CVE) are common identifiers for publicly known security vulnerabilities In a few clicks we can analyze your entire application and see what components are vulnerable in your application, and suggest you quick fixes. org.apache.ignite:ignite-core is a memory-centric distributed database, caching, and processing platform for transactional, analytical, and streaming workloads delivering in-memory speeds at petabyte scale. Affected versions of this package are vulnerable to Deserialization of Untrusted Data due to Class Serialization Filters being ignored for some Ignite endpoints. An attacker can execute arbitrary code on the server by sending a crafted message containing a vulnerable object whose class is present in the Ignite server classpath and sends it to Ignite server endpoints. Serialization is a process of converting an object into a sequence of bytes which can be persisted to a disk or database or can be sent through streams. The reverse process of creating object from sequence of bytes is called deserialization. Serialization is commonly used for communication (sharing objects between multiple hosts) and persistence (store the object state in a file or a database). It is an integral part of popular protocols like Remote Method Invocation (RMI), Java Management Extension (JMX), Java Messaging System (JMS), Action Message Format (AMF), Java Server Faces (JSF) ViewState, etc. Deserialization of untrusted data (CWE-502) is when the application deserializes untrusted data without sufficiently verifying that the resulting data will be valid, thus allowing the attacker to control the state or the flow of the execution."
year_published = 2025
