title = "Snyk Cloud Rules Database | Snyk"
description = "High severity Cloud Storage Buckets allow AllUsers and AllAuthenticatedUsers in Cloud Storage | SNYK-CC-00787"
full_description = "CCSS (Common Configuration Scoring System) is a set of measures used to determine the severity of the rule. Each rule is associated with a high-level category. For example IAM, Container, Monitoring, Logging, Network, etc. CCSS (Common Configuration Scoring System) is a set of measures used to determine the severity of the rule. Each rule is associated with a high-level category. For example IAM, Container, Monitoring, Logging, Network, etc. In a few clicks we can analyze your entire application and see what components are vulnerable in your application, and suggest you quick fixes. Granting permissions to AllUsers or AllAuthenticatedUsers can expose Cloud Storage buckets and their contents to the public, leading to unauthorized data access and potential data breaches. Ensuring that neither of these groups are granted permissions mitigates the risk of public exposure of sensitive data. Set the members attribute in google_storage_bucket_iam resource to value other than allUsers or allAuthenticatedUsers."
