description = "High severity (8.3) Embedded Malicious Code in @solana/web3.js | CVE-2024-54134"
full_description = "The probability is the direct output of the EPSS model, and conveys an overall sense of the threat of exploitation in the wild. The percentile measures the EPSS probability relative to all known EPSS scores. Note: This data is updated daily, relying on the latest available EPSS model version. Check out the EPSS documentation for more details. Common Vulnerabilities and Exposures (CVE) are common identifiers for publicly known security vulnerabilities The probability is the direct output of the EPSS model, and conveys an overall sense of the threat of exploitation in the wild. The percentile measures the EPSS probability relative to all known EPSS scores. Note: This data is updated daily, relying on the latest available EPSS model version. Check out the EPSS documentation for more details. In a few clicks we can analyze your entire application and see what components are vulnerable in your application, and suggest you quick fixes. Affected versions of this package are vulnerable to Embedded Malicious Code that is designed to steal private keys from unsuspecting developers and users, potentially enabling attackers to drain funds from dApps, like bots, that handle private keys directly. The malicious code was added to npm releases 1.95.6 and 1.95.7 after a publish-access account was compromised. This issue should not affect non-custodial wallets, as they generally do not expose private keys during transactions. This is not an issue with the Solana protocol itself but with a specific JavaScript client library and only appears to affect projects that directly handle private keys and that were updated within the window of 3:20pm UTC and 8:25pm UTC on Tuesday, December 2, 2024. Developers who suspect they might be compromised should rotate any suspect authority keys, including multisigs, program authorities, server keypairs, and so on."
