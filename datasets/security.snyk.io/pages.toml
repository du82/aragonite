full_description = "CCSS (Common Configuration Scoring System) is a set of measures used to determine the severity of the rule. Each rule is associated with a high-level category. For example IAM, Container, Monitoring, Logging, Network, etc. CCSS (Common Configuration Scoring System) is a set of measures used to determine the severity of the rule. Each rule is associated with a high-level category. For example IAM, Container, Monitoring, Logging, Network, etc. In a few clicks we can analyze your entire application and see what components are vulnerable in your application, and suggest you quick fixes. S3 bucket policies and ACLs should not be configured for public read access. It is a security risk for a bucket to have an ACL or bucket policy that is configured for public read access, even if the bucket itself is not currently public. A bucket configured for public read access can potentially be made public, allowing any AWS user or anonymous user to access the data in it. Remove any aws_s3_bucket acl, grant, and/or policy fields that allow public read or write access. Optionally use an aws_s3_bucket_public_access_block or aws_s3_account_public_access_block."
