full_description = "The basics What is BSides? What to expect at a BSides #BSidesSF, #BSidesAustin, #BSidesLV FAQ (Contact Info) Media Sponsoring Get involved Organize a BSides! Event Quick Start Guide Hosting tips and organizer commitment Using the wiki BSides Event template (start here!) Elsewhere @SecurityBSides Mailing List If you have questions or experience problems, please report them to [email protected]. For issues related to this wiki, please see the PBWiki Support Forum. Where's the padlock? About the wiki and HTTPS: Logins are encrypted, but PBWorks does not consistently support HTTPS on custom domains. We are moving to a new platform, but BSides is a volunteer organization and migration will be a significant undertaking. A team has come together, but please be patient as we plan and execute the migration. If you are interested in helping with these events (or any others) as sponsors or volunteers, please check the individual event wiki pages for local coordinator contact information. If there is no contact information available, please send a message to [email protected] and we'll do our best to put you in contact with the organizers. Examples? Take a look at the BSides Las Vegas 01, BSides San Francisco, BSides Bay, and BSides Austin for details of what completed events look like. New here? Join the BSides Mailing List, LinkedIn Group, FaceBook BSides Group, SlideShare, or Twitter. BSides was born out of number of rejections to the CFP for Black Hat USA 2009. A number of quality speakers were rejected, not due to lack of content but lack of space and time. Any constrained system must operate within the bounds to which it has defined itself. Conferences constrain themselves to the eight hours a day for however many days they run. Our goal is to provide people with options by removing those barriers and providing more alternatives for speakers, topics, and events. It makes us all sad, but pointers to external pages from the front page will most likely be deleted without notice. Otherwise the page fills up rapidly with difficult-to-detect spam. Since version 2.0 of PBWiki, users can be authorized as 'Writers' or 'Readers'. By default, new users are authorized as 'Writers', accounts conducting inadequate operations will be turned into 'Readers' as a safety precaution. If the change appears unjustified, please contact the Site Maintainers to restore the normal rights for the corresponding account."
year_published = 2025
clearnet = "https://securitybsides.com/Guidelines"
