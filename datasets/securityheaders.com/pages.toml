ferable, limited right to use the Service solely for your own internal business purposes for the term of this Agreement. You may not distribute the Service as a stand-alone or primary element to any third party. In addition, you will not (and you will not allow any thirty party to): copy, distribute, rent, lease, transfer or sublicense all or any portion of the Service to any third party; modify or prepare derivative works of the Service; use the Service in any commercial context or for any commercial purpose or in any commercial product including reselling the Service; use the Service in any manner that threatens the integrity, performance or availability of the Service; or reverse engineer, decompile, or disassemble the Service.'''
