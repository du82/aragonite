["https://securityintelligence.com/infographic-zero-trust-policy"]
title = "infographic - Security Intelligence"
full_description = "What is zero trust? The zero trust strategy's goal is to securely connect only proven and authorized users to the right data at the right time and in the right context. Zero trust assumes nothing; takes nothing for granted. Every connection must be continuously checked and validated. And, this strategy can help protect the industries that are most at risk of attack. A regional hospital system has been attacked—again. The culprit? Ransomware launched through a phishing email. The threat actors want to hold the hospital system hostage, shutting down its electronic health records and patient portals. If the hospital can't access patient records and scheduling systems, then everything but critical care will be canceled, resulting in lost time, revenue and trust. Luckily, the hospital systems' IT and security teams learned by watching attacks on other organizations and put a zero trust strategy in place. A zero trust strategy isolates threats to a specific area, limiting the ability for attacks to move to other parts of the organizations and limiting disruption. Health care teams focus on protecting patient data, but everything is connected and defense must go beyond just data. The rise of the Internet of Medical Things and personal health devices increases the potential attack surface. Breaches and data compromise can damage the hospital's brand, escalating the total cost of the threat. A nation-state threat actor group seeks to sow chaos. Knowing that smaller towns and rural cooperatives rarely have the budget or staff for robust defenses, that's where they focus. They also hope a smaller utility will provide the gateway into an even larger grid where they can do more damage. Their goal is to attack a water treatment plant and raise chemical content to dangerous levels, poisoning the water supply. But their first target has learned lessons from other attacks. The rural county's security lead put a zero trust strategy in place over the facility's operations technology infrastructure and industrial control systems. Implementing continuous and adaptive authentication throughout the entire organization—from grid to corporate systems—improves protection and limits the opportunity for wide-spread compromise."
year_published = 2025
