full_description = "Customer Reviews See what leading cybersecurity experts, researchers and developers have to say about SecurityTrails. Cheers @securitytrails love that you note when a DNS change has been made. Random Robbie Hacker It's extremely useful for tracking threat actor / DNS changes and identifying sinkhole c2's and TA infrastructure Stök Fredrik Hacker Hear more from people Michael Skelton @codingo_ @crunchbase is the go to, but you can also make the most of Google dorking and using services like @securitytrails to explore associated nameservers / whois adjacency.. Though, keep in mind, M&A normally isn't the best for bounties - very often those entities aren't in scope 4:03 AM · Jun 26, 2023 I_Am_Jakoby @I_Am_Jakoby Yup this SecurityTrails api probably just made its way into my daily routine 4:27 AM · Jun 22, 2023 Mike Gras @MichaelJGras Ooof.What's the domain? I kinda like poking around with SecurityTrails.Don't mean to brag, but I once stopped a group of scammers targeting local doctors for $10k a pop by crossx-ing domains associated with hosts bad guys were using.Feel free to send dm. 5:06 PM · Jun 12, 2023 Tekzilver @tekzilver Thanks for sharing. I think RiskIQ is too intrusive to be OSINT. They need registration/tax ids, phone numbers etc. Hosting history by dnslytics isn't free. Considering how important this is for investigation, I'd suggest the free version of securitytrails to check hostng history 2:14 AM · Jun 12, 2023 Leo Rac @leo__rac @securitytrailsRE: @pdiscoveryio Which APIs for subdomain enumeration would you recommend paying for? 💰🤷 Share your recommendations below 👇 8:12 AM · May 31, 2023 Gigasheet @gigasheet Research domains in a #spreadsheet CSV or JSON with this #nocode @securitytrails integration. Fetch hostnames, stats, number of other hostnames that have the same IP, #threatinel and more. Scales to millions of records https://gigasheet.com/no-code-api/securitytrails-api-details #blueteam #competitiveintelligence 2:47 PM · May 30, 2023 Daniel Kelley @danielmakelley 30 cybersecurity search engines for researchers:1. Dehashed—View leaked credentials.2. SecurityTrails—Extensive DNS data.3. DorkSearch—Really fast Google dorking.4. ExploitDB—Archive of various exploits.5. ZoomEye—Gather information about targets. 2:05 AM · May 13, 2023 Jason Haddix @Jhaddix My holy grail would be access to all @securitytrails products and APIs 9:03 PM · Apr 29, 2023 Ninad Mishra @NinadMishra5 Want to find some new subdomains for your target?Use SecurityTrails API 🔥 to enumerate.Credit: @IfrahIman_#bugbountytipsbr 4:30 PM · Mar 7, 2023 haksec.io @haksecio Super, speedy subdomain enumeration with a super, speedy #Golang client by @hakluke that queries @securitytrails API data👇 👉 🔗 http://github.com/hakluke/haktrails 3:00 AM · Jan 17, 2023 Zach Edwards @thezedwards SecurityTrails also has a nice Fortune 500 domain list @ https://securitytrails.com/data/fortune-500 for updating any of those 🖖🏻 10:55 PM · Jan 15, 2023 Coyote Den @CoyoteDen Yeah. If you override DNS it will load. That’s the real site, and unless they move it, bypassing Cloudflare is as simple as adding an entry to /etc/hosts or using curl —resolve. Going live before getting behind Cloudflare is the mistake they all make. SecurityTrails always knows 6:08 PM · Dec 10, 2022 haksec.io @haksecio We ❤️ @securitytrails 12:57 AM · Nov 19, 2022 Uzair Ali @r00tali @securitytrails get a pretty good attack surface subs and dns history which is important as old ip’s contain some leftover assets and apps that may lead to something on production 🤷🏻‍♂️ 2:49 PM · Nov 18, 2022 Coyote Den @CoyoteDen Because they’re not too bright. There are other hosts in DNS for the *.kiwifarms.net domain, and they are all in the 103.114.191.* IP range. SecurityTrails is good for finding that stuff: https://securitytrails.com/list/apex_domain/kiwifarms.net Once you have the IP range, you scan it. 8:49 AM · Aug 24, 2022 TechINT @0xtechrock OSINT TIP #7@securitytrails - highly recommended for subdomains, must explore!#infosec #cybersecurity #osint #Day7 #bugbountytips 10:57 PM · Jul 19, 2022 hakluke @hakluke In my experience they just have the most comprehensive data of anything that I've seen. I also wrote https://github.com/hakluke/haktrails for specifically querying @securitytrails data beyond just subdomains :) 4:54 AM · Apr 6, 2022 Jason Haddix @Jhaddix The verdict is out! both @ITSecurityguard & @hakluke agree that@securitytrails is the best (paid) recon subscription.Both stand-alone and with Amass or Subfinder! 5:23 AM · Apr 6, 2022 hakluke 👨‍💻🚀 @hakluke This is my day-to-day hacking tool stack:🛠️ Burp🛠️ Nmap🛠️ Httpx🛠️@securitytrails🛠️ @Shodanhq🛠️ @spiderfoot🛠️ My own tools (mostly open source on github)🛠️ Everything by @projectdiscoveryio🛠️ Everything by @tomnomnomThat covers about 99% of my hacking 🤷‍♂️ 1:00 AM · Mar 31, 2022 Katie Paxton-Fear @InsiderPhD Shoutout to@securitytrails for helping out when @0xLupin max'd his credits! We love to see it 1:29 PM · Jan 10, 2022 The AntiSocial Engineer @antisocial_eng Well done@securitytrails @Bugcrowd @RiskIQ and @Cloudflare for making your email comms clear, informational and helpful. With minimal sales focus on the ongoing incident. The rest of you... not so much. 3:06 PM · Dec 13, 2021 Sean Gallagher @thepacketrat On a related note,@securitytrails is pretty cool. 3:22 PM · Nov 19, 2021 MrNY2Cali @mrNY2cali Yep, @Twitch I've been their & done that on the service provider end during my Content Delivery Network engineering team days and since I like connecting my friends with other friends. @TwitchDev @TwitchSupport meet@securitytrails @oktadev both are great IT Security companies 6:37 PM · Oct 7, 2021 Colin Sullender @shiruken The@securitytrails service is documenting the unique subdomains of tens of thousands of @UnraidOfficial servers using the My Servers plugin and exposing their respective login pages 9:49 AM · Sep 23, 2021 Colin Sullender @shiruken Wiser words have never been spoken before 😬