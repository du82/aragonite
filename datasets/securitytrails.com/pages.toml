full_description = "SecurityTrails Integrations and SDKs Fetch our domain, IP and WHOIS data from your own applications. Integrations help you to get started. SDKs and Wrappers NodeJS Wrapper Python Wrapper Ruby Wrapper (Beta) PHP Wrapper Advanced Python Wrapper Didn't find the SDK or wrapper you were looking for your programming language? Get started using our API documentation and build your own library, or contact our support for more information. Third-party Integrations Cortex XSOAR for Attack Surface Intelligence Allows you to quickly identify critical infrastructure risks and get alerts on the Cortex XSOAR platform. Tines (Jira & ServiceNow) This Risk Rules API integration with Tines helps security teams automate attack surface manual workloads. Maltego Maltego Standard Transforms are now powered by SecurityTrails DNS data. Cortex XSOAR This integration brings SecurityTrails API access to the XSOAR platform. Haktrails Haktrails is the official CLI client for querying SecurityTrails API data, written by hakluke. SpiderFoot SpiderFoot automates OSINT to find out everything about your target. Splunk Add-On Provides a method to use Splunk Adaptive Response to automate lookup of a Domain or IP address against the SecurityTrails API. Intrigue.io Intrigue makes it easy to discover information about your attack surface connected to the Internet. Phantom Cyber (Beta) Phantom Cyber app for SecurityTrails. Cortex Analyzer (Beta) Cortex Analyzer for SecurityTrails. Cisco SecureX Cisco SecureX is a cloud platform that integrates the SecurityTrails API to enrich its threat response ecosystem. MISP - Open Source Threat Intelligence An expansion module that queries SecurityTrails API services. theHarvester An effective theHarvester + SecurityTrails API integration for information gathering tasks. ExTrails This API client for SecurityTrails works as both a standalone CLI or as an Elixir application client. amass This project uses the SecurityTrails API to perform advanced network mapping and attack surface analysis. Subfinder Terminal-based infosec tool that uses the SecurityTrails API to find subdomains. Ukemi CLI-based tool to query the SecurityTrails passive DNS services. Mihari OSINT tool that uses the SecurityTrails API to run information gathering queries & manage results continuously. R language SecurityTrails API integration with R programming language. Subdomain Enumerator A python-based tool to enumerate subdomains, check for CNAME records inside them, and find stale DNS records. harpoon OSINT Threat Intelligence CLI tool that integrates the SecurityTrails API™ Pown Recon Reconnaissance framework that uses the SecurityTrails domain intelligence to enrich its results. IntelOwl IntelOwl integrates the SecurityTrails API™ to boost domain and IP recon. Findomain The perfect solution for domain recon, integrated with the SecurityTrails API™. ReconPi A fast recon tool that integrates the SecurityTrails API™ to helps researchers with intelligence gathering using a Raspberry Pi. Do you want to integrate SecurityTrails in your software or service? Contact us to get started quickly. Browser Extensions Sputnik OSINT Extension for advanced IP and domain intelligence research. Mitaka Handy Indicator of Compromise search add-on that queries the SecurityTrails database. Gotanda Search OSINT information from IOCs on any web page. Build your own infosec browser add-ons by using our free app and API services. Contact us to get started. Are you a developer working on infosec apps? Sign Up Now"
