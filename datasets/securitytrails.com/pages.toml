["https://securitytrails.com/support/knowledge-base/faq"]
title = "FAQ - Documentation"
description = "Got stuck on some feature or just want to know more about some of our product? This article will help you get your question answered"
full_description = "FAQTable of ContentsGeneralPre-SalesWebsiteTechnicalAPISurfaceBrowser™BillingDataGlobal Inventory ScanningPartnershipGeneralDo you have integrations with recon tools? Yes, check out https://securitytrails.com/corp/integrationsWhy didn’t I receive a verification email for my account?Every new user needs to verify their account via email in order for their API key to be generated. Occasionally, that email can be blocked or sent to the spam folder by a user’s email service. If you are not receiving your verification email, please contact our support team so we can verify your account directly.Can I change my account’s email?Please contact the support team to get your email changed.Do you pull associated domains from WHOIS and CT logs?While we focus primarily on WHOIS signals, we’re constantly adding more, including: CT logs, website copyright information, nameservers, IPs, tracking pixels and many other types of signals as WHOIS becomes less available due to GDPR.How does GDPR hurt WHOIS results?It undermines the reliability and usage of WHOIS data. We provide customers with historical WHOIS data, which can circumvent guarded WHOIS records.How often is your WHOIS and DNS data updated?Our WHOIS data, as well as all of our DNS data, is updated on a daily basis.I can’t find a certain domain or hostname—why isn’t it there? Can you add it?There are various reasons why the domain name you’re looking for is not visible in our database. We’re unable to add a domain name straight away, but you can report that domain to our support team and we’ll be sure to include it in the future.What Plan should I buy in order to download Feeds?Feeds is a separate product from the API and requires you to subscribe to our feed service. For more information about Feeds please contact our team.Do you sell a list of all the domains you know about?Yes, we do. A list of all domains that we know is available on our Domain Data Feed. For more information about Feeds please contact our team.Can I download WHOIS data in bulk?At this time we do not offer bulk download of WHOIS data. The only way WHOIS data can be accessed is via our API or SurfaceBrowser™.Can I see older records than those presented on the website?The historical DNS records shown on the web app are all the records we have for that domain.I would like my personal information removed. How can I let you know?Please submit a ticket to our support team with a link to the records in question. Should there be any sensitive or personally identifiable information included we will immediately forward your request for its removal to our Abuse team.Do you accept payments via Alipay or WeChat?Unfortunately we do not accept payments from Alipay or WeChat at this time. We do offer other convenient ways of payment for your subscription.Do you accept Bitcoin or any other cryptocurrency payments?Unfortunately we do not accept Bitcoin or other cryptocurrencies as a payment option at this time.What time zone is used for your data output?The time zone for our data output is the UTC time zone.Pre-SalesCan I schedule a demo?Yes, our team is available to perform demos. For scheduling, please contact our product experts.Do you perform custom data jobs?Yes. We have had significant success with custom data job performance for our clients, including projects dealing with associated domains and IPs, determining identification of multi-tenanted or single-tenanted IPs, and working with hedge funds. We have a great deal of resources and are equipped to deliver on many custom data jobs. For more information and to schedule a custom data job, please contact us at our Enterprise Sales department.WebsiteWhy are search results on the web app limited to 10 pages?Search results on the website are currently limited to 10 pages to prevent data from being scraped. To see more results, you can use our API or one of our other products offered for purchase.Why isn’t my search by keyword working?Keyword searches are specifically for searching the domain field. For example, “domain” would match www.domain.com, domain.io and mail.domain.co.uk but would not match www.somedomains.com or similar results. The Domain DSL on our API plans offers this feature.Can I view WHOIS history on the web app?Currently, WHOIS history is not available on the web app. However, WHOIS history is available via our API or SurfaceBrowser™.Can I download search results on the web app?Subscribing to SurfaceBrowser™ will allow you to download search results.TechnicalHow do you generate the list of domains to lookup?We use various methods for collecting domains. GTLDs and .ru, .uk, .se and .nu ccTLD zones are generated from their master zone files. All other ccTLDs are collected by Web Scrapers, Certificate Transparency logs, Scraping Wikipedia, Pastebin, and others — about 30 sources in total.How do you generate the list of subdomains to lookup?After we get the list of domains we check them to find subdomains. There are about 30 sources for subdomains.How do you look up domains?You can lookup domains directly on our web app. Just go to our website’s main page securitytrails.com and once you open it you will see a search box. Input the desired domain name there, click on search and you’ll get DNS records for that domain.How many domains do you have?We currently have around 320 million domains in our database. You can check out our daily domain statistics here: securitytrails.com/stats.How many new domains do you find per day?The number of newly added domains varies each day, and for more details, you can check our domain statistics page. There you’ll find the Top Level Domain Stats where you can see how many domains are added and how many are deleted.How long does it take for a new domain to appear in the search?Based on how we gather domain names, it can take up to 48 hours for gTLDs, depending on the time of day the domain was registered. For most ccTLDs with no available master zone files, it can take longer.How long does it take for a new domain to appear in the search?Based on how we gather domain names, it can take up to 48 hours for gTLDs, depending on the time of day the domain was registered. For most ccTLDs with no available master zone files, it can take longer.If I change my DNS records, how long does it take for these changes to show up in the search?While we resolve all domains daily, it can take up to 36 hours for new records to show up.What percentage of gTLDs do you have?All of them. We gather gTLDs from their master zone files, so we have one hundred percent of them in our database.What percentage of ccTLDs do you have?As ccTLDs have to be crawled we cannot claim an exact percentage, but we know certainly that we have a large majority of them.Can I see an IP address of a website that is hidden behind a proxy like Cloudflare?There’s a good chance you can. While you cannot merely type the desired domain name and get its hidden IP address immediately, you can use our service to investigate it further. For example, you can look up historical records of the domain and if someone registered the domain without immediately hiding the IP address, then you would be able to see the real IP for that domain as a historical record. For further information, please refer to this article: Finding the IP address of a website behind Cloudflare.Can I get all domains from a specific State/City?It is possible to filter domains from a specific city by using one of our Search Domain API endpoints: https://docs.securitytrails.com/v1.0/reference#domain-search. And then you can use filter.whois_city to filter the desired city.As every country is designated by its own administrative division, we do not offer filtering specifically by state. However, you can use one of our Search Domain API endpoints and then search for desired results by keyword (using filter.keyword) using the name of the State. If you need to search in multiple fields, exclude entries or filter further, take a look at our more advanced Domain DSL, https://docs.securitytrails.com/v1.0/reference#search-domain-dsl.Do you use cached results or authoritative?We use both. For historical DNS data, we use cached results from our passive DNS database.Do you offer ASN information?Yes, we do. ASN information is currently available on SurfaceBrowser™.What is SOA email?SOA email is the email address of the administrator responsible for a DNS zone.What is a CNAME record?A CNAME record, or Canonical Name record, is a DNS record that maps an alias domain name to a true or canonical domain name. For example, a CNAME record can map the web address www.securitytrails.com to the actual DNS records for securitytrails.com.Do you have historical CNAME records?Yes, by looking up the record the CNAME is referring to, you’ll get the information you need.Which ports are you currently scanning?A comprehensive list of TCP and UDP ports being scanned by us is available here.Can I be removed from the port scanning?SecurityTrails scans help the data security community protect themselves and their clients from cyber security threats. The data collected from our scan activity is sometimes used to detect security problems and to inform operators of vulnerable systems so that they can be fixed. If you opt-out of the research, you might not receive these important security notifications. However, if you still wish to be removed from our scanning process please send your request along with the IP prefixes to be excluded to securitytrails@recordedfuture.comAPIWhat happens if I try to use features that are not available on my plan?If you try to make an API call using endpoints that are not available on your plan, or if you try to use features available on higher-tiered plans, you’ll get an HTTP response error 403 (Forbidden) with the following message: “This feature is not available for your subscription package. Consider upgrading your package or contact securitytrails@recordedfuture.com“. This message indicates that you would need to upgrade your current API Plan to use the desired feature.Can I save response data from API request?At this time we do not have that option available directly from the API. We are planning to release the Download API soon, however. In the meantime, you can save JSON from the response with a custom script.Can I get data in a format like CSV instead of JSON?At this time JSON is the only available output format for the API.Can I request multiple pages of results with a single API call?With each API request, you can only get one page of results. There is, however, an exception with the Scroll API endpoint. With Scroll you can also request one page with one API call, but with it, you would get 200 results on each page, instead of the 100 results you would get with other API endpoints.Why I can’t get more than 100 pages with API?With each API request, you can only get one page of results. There is, however, an exception with the Scroll API endpoint. With Scroll you can also request one page with one API call, but with it, you would get 200 results on each page, instead of the 100 results you would get with other API endpoints.Why I can’t get more than 100 pages with API?We currently limit the number of pages you can get with most API endpoints to 100. This is governed by how the API works. For example, let’s say the user wants to get page 50 of the results. To get that page, the server needs to go through the first 49 pages of the results to show page 50. That’s why getting results is significantly harder if given requests seek more than 100 pages of results. However, there is an exception with our Scroll API, which allows scrolling over the Search Domain (DSL) endpoint. With Scroll there are no limitations, giving you all pages of the results, page by page.Why do I get only 2000 results when using subdomain API endpoint?We have currently limited the number of results you can get with subdomain API endpoint to 2000. The reason behind that is that a large majority of domains have less than 2000 subdomains. We thought it unnecessary to yield more than that number of results.Can I get a demo to test your API?Yes! Sign up for a free account to test the functionality of our API.What 3rd party applications do you support?You can check out the various 3rd party software we support on our integrations page.How can I download Feeds with API?The Domain Feed is a separate product from API, but we have enabled our Domain Feed users to access the data they need via API. To use that endpoint, a subscription to our Domain Feed is needed.How can I perform a reverse DNS lookup?By using our IP Search statistics API endpoint. Check out our API reference for more information on how you can use this endpoint, at https://docs.securitytrails.com/v1.0/reference#ip-search-statistics.Can I perform a reverse WHOIS search?Yes, by using filters on any of our Search Domain endpoints.Filters you can use are: email, street1, street2, street3, street4, telephone, postalCode, organization, name, fax, cityWhat happens if I go over quota?If you go over the quota and try to make an API call you will receive the HTTP/1.1 429 (Too many requests) error.How do I use Search IPs DSL endpoint and what response will I get from that API call?In order to use that API endpoint you need, as with any other endpoint, your API key as well as what parameters you want to query. Available fields to query in the IPs database are:ptr_part — Matches the end of the ptr record. It must exactly match a fragment so, for example, microsoft.com would match any ptr record that ends with microsoft.com. test.microsoft.com would match, but test.otherserviceatmicrosoft.com would not.ptr — Matches the full ptr record exactly.port — Matches open ports. These are numeric, so operators between gt lt > >= <= etc. are all supported, e.g. port between 1000 and 4000 or port <= 100. We are keeping the following ports in our index: FTP 21, FTPs 990, HTTP 80, HTTPS 443, Redis 6379, SSH 22, CouchDB 5984, ElasticSearch 9200, Memcached 11211ip – Matches the IP address. Network masks are supported. e.g. 1.1.1.1/24An example query for this endpoint looks like this: ip in ('1.1.1.1/24', '2.2.2.2/24' and ptr_part != 'microsoft.com') or (ptr_part = 'microsoft.com' and ip = '3.3.3.3/24')For more information about this endpoint, check out our IP search API documentation.Do you support multiple API keys on the same account?Yes, we do. You can create a new API key inside your account dashboard.Can I have multiple email users under one quota?At this time it is not possible to have multiple email addresses under one quota.Can I rekey my API key?Yes, you can. You can delete your API key inside your account dashboard.Can I increase my rate limit?In most cases, we can increase your rate limit up to 10 requests per second.Please contact our support team for more information.Do I have to authorize my API key in the GET URL?No, it is not required to authorize your API key in GET URL.Do you allow cross-origin re"
