["https://securitytrails.com/privacy-policy"]
title = "Privacy Policy | Recorded Future"
description = 'View the most recent <a href="/privacy-policy/3/">archived version</a>.'
full_description = '<iframe src="https://9890019.fls.doubleclick.net/activityi;src=9890019;type=sitew0;cat=sitew0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;ord=&#x27;779134233710.7809&#x27;?" width="1" height="1" style="display:none" title="Floodlight Random"></iframe><iframe src="https://9890019.fls.doubleclick.net/activityi;src=9890019;type=sitew0;cat=sitew0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;ord=1?" width="1" height="1" style="display:none" title="Floodlight"></iframe>BlogCareersContact UsLoginPlatformOutcomesProductsServicesResearchResourcesCompanyGet a demo Book a free demo Privacy PolicyView the most recent archived version. Version 4.0 — Updated November 22nd, 2024 Recorded Future is the world’s most comprehensive and independent threat intelligence cloud platform. It enables organizations to identify and mitigate threats across cyber, supply-chain, physical, and fraud domains. It is trusted by organizations to provide real-time, unbiased and actionable intelligence. Recorded Future is committed to protecting and respecting your privacy. This Privacy Policy explains your privacy rights and how we collect, use, share, retain, and transfer personal information (collectively referred to as “processing” or “process”). I. POLICY APPLICATION This Privacy Policy applies to personal information we process on or through our websites, our mobile application, our platform (the “Sites”), and other offerings (collectively, the “Services”) and explains our processing practices, including the personal information we may collect, our use of such personal information, and your privacy rights, including the rights of data subjects that may differ based on location. For example, European Union individuals under the General Data Protection Regulation or California residents pursuant to the California Consumer Privacy Act and California Privacy Rights Act. This Privacy Policy applies to all of Recorded Future’s US Entities and Subsidiaries, listed herein: SecurityTrails, LLC Regemini, LLC Gemini Advisory, LLC Recorded Future LLC The Record by Recorded Future LLC RF Ultimate Parent, Inc. This Privacy Policy does not apply to personal information we collected: when you apply for a job with Recorded Future; or in the course of your employment with, or otherwise rendering services to, Recorded Future, whether as an employee, independent contractor, consultant or similar. By accessing the Services, you agree to our collection and use of personal information as described in this Privacy Policy, our Terms of Use, and/or other agreements as may be executed between us and you or your organization. II. PERSONAL INFORMATION WE COLLECT – SOURCES AND CATEGORIES Our business focuses on collecting threat intelligence data from, or about, threats for security purposes. Generally, this data does not typically contain information that relates to, or could be used to identify an individual, or be linked with a particular individual or household. We collect personal information when you visit our Sites and through your interactions with us. For example, when you request information about our Services, when you use our Services (such as submitting queries, performing analysis, or annotating results), subscribe to or read our published content through the Sites, listen to or subscribe to our podcast, indicate your interest in receiving marketing or other materials through our Sites, use our mobile application, provide us with your information to register for, or while at, a conference, event, or webinar, participate in our Community of Practice, when you request product support, or when you voluntarily provide information to us through our Sites or via email or telephone. We also collect personal information from our LinkedIn page and our other social media presences, from third-party commercial sources of personal information, and from publicly available sources including the dark web and open source intelligence. For more information about our security measures to protect this information, please refer to our Information Security FAQ. The categories of personal information we may collect include the following: Personal identifiers: Name; email, physical or billing addresses; social media handles; telephone numbers; IP address; account number and passwords; Internet or other electronic activity information: Device, operating system and browser information; information regarding your interaction with our Sites; URLs of the pages you visit; mobile application data; logs of browser extension queries and other usage data; Professional information: Name of current employer or company you represent and position(s) you hold; additional professional information you provide to us or post or share with our community; Financial information: credit/debit card information, bank details; Commercial information: Information about queries, analysis, or annotating results that users create by utilizing the Services. Additional information: We may collect additional categories of personal data that threat actors, and others, have collected and posted to the dark web or other publicly available sources. We collect such data through our threat intelligence tools. We cannot control or predict the categories of such personal information we may index through our threat intelligence activities, because the contents of such data are dependent upon what external third parties, such as threat actors, may post. This means that much of the information will relate to high profile people, companies or events (e.g., the President of the United States, CEOs, cybersecurity experts etc.), but it can include information about just about anyone – if that information is in an available source online. Information Included in Queries: Recorded Future offers both free-text search, and sandbox submission functionality, so any personal information included by you in such searches or sandbox submissions may be processed by Recorded Future. A sandbox end user may upload a file that contains personal information, to include a broader range of personal information than those listed above, however the malware analysis processes the personal data in a manner incidental to the analysis of the file. The public sandbox option does store those analyzed files in a manner that is viewable to other public sandbox users. Cookies and Other Technologies We collect the above information partly through our use of cookies, which allow Recorded Future to provide customers and site visitors a better and more secure experience. While the exact names and parameters of cookies used by Recorded Future may periodically change, they are generally used for authentication, security, performance, or analytics. These cookies can be deleted at any time. For detailed information on how we use cookies, please click here. Additionally, we use Google Analytics to evaluate the use of our Sites. Google Analytics uses cookies and other identifiers to collect information, such as how often users visit a website, what pages they visit when they do so, and what other websites they visited prior to visiting a website. To learn more about how Google Analytics collects personal information, review Google’s Privacy Policy. III. HOW WE USE YOUR INFORMATION Recorded Future only processes personal information in a way that is compatible with and relevant to the purpose for which it was collected or authorized. As a general matter, for the categories of data described in Section III above we may use your personal information to: To provide our Services to you or your organization, including: (i) providing access to certain areas, functionalities, and features of our Services; (ii) communicating with you about your account, issues with the Services, account support, security notifications, activities on our Services and policy changes; and (iii) providing access to other content, such as our podcasts. To allow you to register for and attend events, conferences, webinars etc. and to provide you with materials and information (e.g., white papers) you request from us. To engage in direct marketing activities with you or your organization, including, but not limited to, to send you surveys, newsletters, offers, promotions, contests, and events and to keep you up to date on our Services or to ask you about your experience with our Services. To understand your actions, behaviors, preferences, expectations, and feedback in order to improve our products and Services, develop new offerings and Services, and to improve the relevance of offers of products and Services by us, to implement settings changes you make. To ensure network and information security, and compliance with applicable law, including monitoring access to our Services for the purpose of preventing cyber-attacks, unauthorized use of our systems and Sites; export control; prevention or detection of fraud, crime and protection of your personal information. To enable any due diligence and other appraisals or evaluations for any actual or proposed merger, acquisition, financing transaction or joint venture we or our affiliates may consider. To defend and enforce our rights including, against legal claims that involve us or our affiliates, and to manage regulatory matters, investigations, data breaches, and/or data subject requests. To comply with a legal obligation. To respond to your inquiries and take action on your requests when you contact us through the Sites or by other means. To pursue our legitimate interests to operate and improve our business. To populate our Intelligence Cloud, Recorded Future processes the intelligence referenced above for certain legitimate business purposes, which may include (but is not limited to) the following: Empowering organizations to remediate compromised credentials; Locating data that may have been breached or leaked online; Tracking vulnerabilities and exploits targeting our customers; Providing enrichment for data logs and security infrastructure; and Enabling organizations to better research threats. We analyze threat intelligence to better protect the organizations that use our service, and we believe this makes technology (and the world) more secure. When we process personal information for our legitimate interests, we make sure to consider and balance any potential impact on potential data subjects and their rights under data protection laws. IV. COLLECTIVE INSIGHTS AND QUERY DATA Generally, Recorded Future uses query data in one of two ways - i) Recorded Future uses this data to provide our services to our customers, this includes everything from returning the query results to providing the search history feature and sending out alerts as configured by users; and ii) Recorded Future uses unattributed Customer Data to develop & improve our offerings. These improvements may include but are not limited to providing a signal to our teams regarding what type of data to improve, what research to pursue, insight into trends, data enrichment, and potential feature improvements. Additionally, there may be incidents that require access to this data in the event that there is a valid legal request, investigation of a security, safety, or related issue, or enforcement of the Terms of Use. Further, Recorded Future may index metadata from security events generated through Collective Insights integrations to create correlations. When used on the Recorded Future Platform, this metadata will be devoid of attribution to their original sources. Recorded Future may share certain parts of this unattributable data with independent third parties for permissible business purposes. V. DISCLOSING YOUR INFORMATION FOR BUSINESS PURPOSES The categories of personal information and the corresponding business purpose that we disclose to third parties are: Personal identifiers to service providers that provide customer relationship management services; assist us in operating, analyzing, and displaying content on our Sites; provide analytics information; provide website hosting, webcast, event/conference services; track email open rates and provide email alert services; provide advertising and marketing services; provide payment processing services. Internet or other electronic network activity information to service providers that provide data security services and cloud-based data storage; host our Sites and assist with other IT-related functions; assist us in operating, analyzing, and displaying content on our Sites; provide analytics information; provide advertising and marketing service. Employer and other professional information to service providers that provide customer relationship management services; assist us in operating, analyzing, and displaying content on our Sites; assist us in providing webcast and event/conference services; provide advertising and marketing services. Financial information to service providers that provide payment processing services. Additionally, we may also share personal information: With our affiliates, accountants, attorneys, advisors, affiliates, subsidiaries, outsourcers and third party service providers to provide and administer our offerings, and exercise our rights; As required or permitted by law to comply with a subpoena or similar legal process or government request, or when we believe in good faith that disclosure is legally required or otherwise necessary to protect our rights and property or the rights, property or safety of others, including to law enforcement agencies, and judicial and regulatory authorities; With third parties to help detect and protect against fraud or data security vulnerabilities; To a third party in the event of an actual or contemplated sale, merger, reorganization of our entity or other restructuring. VI. DATA SUBJECT PRIVACY RIGHTS Depending on your location, you may have certain privacy rights under the General Data Protection Regulation (GDPR), California Consumer Privacy Act (CCPA), California Privacy Rights Act (CPRA), or other applicable laws. These rights may include the following: Right to Know At your request, to the extent required under applicable law, we will disclose the following, limited to what we have collected (to the extent we are able to identify): Specific pieces of personal information we have collected about you; Categories of personal information we have collected about you; Categories of sources from which such personal information was collected; Categories of personal information that the business sold or disclosed for a business purpose about you; Categories of third parties to whom the personal information was sold or disclosed for a business purpose; and The business or commercial purpose for collecting or selling your personal information. The Right to Delete At your request, to the extent required under applicable law, we will delete the personal information we have collected about you, unless such applicable laws authorizes or requires u'
