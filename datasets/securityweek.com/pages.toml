full_description = "Cyber risk management and threat intelligence firm Outpost24 announced the appointment of Omri Kletter as its new Chief Product Officer (CPO). Kletter most recently served as the General Manager of the Risk and Fraud Product Line at Bottomline Technologies, and previously he was the Head of Fraud Solutions at NICE Actimize. Application detection and response firm Oligo Security has appointed Brandon Conley as Chief Revenue Officer (CRO) and Alberto Rodrigues as Chief Customer Officer (CCO). Conley previously served as CRO of AppOmni, and VP of Worldwide Cloud Security Sales at Palo Alto Networks. Rodrigues has been promoted from EVP of Customer Success to CCO. Prior to Oligo, he was CCO at Armis, and held leadership positions at Skycure (acquired by Symantec) and Trusteer (acquired by IBM). Nightwing, the cybersecurity and intelligence company that last year spun out of defense giant RTX (formerly Raytheon), has announced the appointment of Bob Coleman as Chief Executive Officer (CEO). Coleman, who succeeds John DeSimone at Nightwing, previously served as President and CEO of Six3 Systems, and President and Chief Operating Officer at ManTech International. Cloud solutions provider CoreWeave has appointed Jim Higgins as Chief Information Security Officer (CISO). Higgins was most recently CISO for social media firm Snap, and previously was CISO at payments firm Block. Following its recent Initial Public Offering, SailPoint has appointed Chandra Gnanasambandam as Chief Technology Officer and Executive Vice President of Product. Chandra joins SailPoint from McKinsey & Company, where he most recently co-led the firm’s global high-tech practice. Karen Evans has been named Executive Assistant Director for Cybersecurity at the Cybersecurity and Infrastructure Security Agency (CISA). Up until her appointment as Executive Assistant Director, Evans served as Senior Advisor at CISA. Prior to CISA, she served as the first assistant secretary for cybersecurity, energy security and emergency response at the Energy Department, CIO for the Department of Homeland Security, and Managing Director of the Cyber Readiness Institute."
year_published = 2024
year_updated = 2024
clearnet = "https://securityweek.com/industry-moves"
