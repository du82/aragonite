full_description = '''Latest Cybersecurity News Amnesty Reveals Cellebrite Zero-Day Android Exploit on Serbian Student Activist Amnesty International publishes technical details on zero-day vulnerabilities exploited by Cellebrite’s mobile forensic tools to spy on a Serbian student activist. Gabbard Decries Britain’s Reported Demand for Apple to Provide Backdoor Access to Users’ Cloud Data The Director of National Intelligence said such a demand would violate Americans’ rights and raise concerns about a foreign government pressuring a U.S.-based technology company. In Other News: Krispy Kreme Breach Cost, Pwn2Own Berlin, Disney Hack Story Noteworthy stories that might have slipped under the radar: Krispy Kreme data breach costs $11M, Pwn2Own moves to Berlin, the story of the 2024 Disney hack. Ransomware Group Takes Credit for Lee Enterprises Attack The Qilin ransomware gang claims to have stolen 350 Gb of files from Lee Enterprises in the attack that caused newspaper disruptions. Vo1d Botnet Evolves as It Ensnares 1.6 Million Android TV Boxes The Vo1d botnet is now powered by 1.6 million Android TV devices, up from 1.3 million half a year ago. Microsoft Names Suspects in Lawsuit Against AI Hackers In a lawsuit targeting cybercriminals who abuse AI services, Microsoft has named individuals from Iran, the UK, China and Vietnam. 26 New Threat Groups Spotted in 2024: CrowdStrike CrowdStrike has published its 2025 Global Threat Report, which warns of faster breakout time and an increase in Chinese activity. Hacker Behind Over 90 Data Leaks Arrested in Thailand A Singaporean man accused of being a hacker responsible for over 90 data leaks has been arrested in Thailand. Watch Now: Ransomware Resilience & Recovery Summit – All Sessions Available on Demand SecurityWeek’s 2025 Ransomware Resilience & Recovery Summit tool place on February 26th as a fully immersive virtual event. The Hidden Cost of Compliance: When Regulations Weaken Security The current state of regulation and