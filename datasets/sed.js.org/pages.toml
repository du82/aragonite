["https://sed.js.org/help.html"]
title = "GNU sed live editor"
full_description = "--help Print a usage message briefly summarizing these command-line options and the bug-reporting address, then exit. -n --quiet --silent By default, sed prints out the pattern space at the end of each cycle through the script. These options disable this automatic printing, and sed only produces output when explicitly told to via the p command. -e script --expression=script Add the commands in script to the set of commands to be run while processing the input. --posix GNU sed includes several extensions to POSIX sed. In order to simplify writing portable scripts, this option disables all the extensions that this manual documents, including additional commands. Most of the extensions accept sed programs that are outside the syntax mandated by POSIX, but some of them (such as the behavior of the N command described in see Reporting Bugs) actually violate the standard. If you want to disable only the latter kind of extension, you can set the POSIXLY_CORRECT variable to a non-empty value. -r --regexp-extended Use extended regular expressions rather than basic regular expressions. Extended regexps are those that egrep accepts; they can be clearer because they usually have less backslashes, but are a GNU extension and hence scripts that use them are not portable. See Extended regular expressions. If no -e --expression options are given on the command-line, then the first non-option argument on the command line is taken to be the script to be executed. A sed program consists of one or more sed commands, passed in by one or more of the -e --expression options, or the first non-option argument if zero of these options are used. Commands within a script can be separated by semicolons (;) or newlines (ASCII 10). Some commands, due to their syntax, cannot be followed by semicolons working as command separators and thus should be terminated with newlines or be placed at the end of a script. Commands can also be preceded with optional non-significant whitespace characters. Each sed command consists of an optional address or address range, followed by a one-character command name and any additional command-specific code."
year_published = 2025
