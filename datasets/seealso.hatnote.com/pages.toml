full_description = 'Code: WikiBrain on github and pre-processing code on Github (note -- code is pending publication) Data: Wikipedia "A People Map of the US, where city names are replaced by their most Wikipedia’ed resident: people born in, lived in, or connected to a place." "The tool renders Wikipedia content in a 3-dimensional, web-based cartographic environment. The map acts as a medium that enables the discovery and exploration of articles in a manner that explicitly associates geography and information." "While not perfect, Wikipedia traffic serves as a solid proxy for the ebb and flow of a celebrity’s cultural relevance." "Encartopedia helps locate yourself, or to be more precise, locate the subject matter of your curiosity within the universe of Wikipedia articles." "Wikipedia can tell us more than is written on its pages. ... In the paper we proposed a new method for patterns detection in large-scale dynamic graphs. We applied the method to the Wikipedia datasets. We have managed to detect dynamical patterns in terms of events and collective memories in Wikipedia using the combination of the hyperlinks graph and the visitor activity on the website." "An exhaustive knowledge of the evolutionary relationships linking all organisms (the whole biodiversity) would produce a tree-like structure, referred to as the Tree of Life (ToL)." "In this project, I intended to explore knowledge diversity across the different language versions of one and the same article on Wikipedia." "Chronas is a history project linking Wikipedia and Wikidata with a chronological and cartographical view." "Wikipedia is a gold mine of lists, lists of lists and even lists of lists of lists. One of these lists of lists happens to be Billboard’s Hot 100 songs which allows us to browse Wikipedia’s data pretty easily." "Omnipedia highlights the similarities and differences that exist among the language editions, making salient information that is unique to each language as well as that which is shared more widely."'
