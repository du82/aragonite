["https://seehuhn.de/blog"]
title = "Jochen's Blog"
description = """
I am happy to announce the release of fast-dm version 30.2. This
release fixes some memory leaks found by
Valgrind. You can download the program
from the Fast-dm homepage."""
full_description = '''Fast-dm version 30.2 released 2015-04-17 I am happy to announce the release of fast-dm version 30.2. This release fixes some memory leaks found by Valgrind. You can download the program from the Fast-dm homepage. "new" paper 2015-02-06 A new paper, together with my PhD student Mark Webster and my colleague Stuart Barber, has been published today! S. Barber, J. Voss and M. Webster: The Rate of Convergence for Approximate Bayesian Computation. Electronic Journal of Statistics, vol. 9, pp. 80–105, 2015. DOI:10.1214/15-EJS988, arXiv:1311.2038, more… This paper took a long time to be published, but I think it is worth the wait. slow article 2014-03-04 I am very happy to announce that a very old (nearly forgotten?) article has finally appeared. We chose the journal because we had heard the rumour that they have a fast turnaround, but this plan didn't work out: the article was submitted 23 September 2011 and accepted on 21 February 2012. But then came a two year wait, and the article only has appeared just now: K.V. Mardia and J. Voss: Some Fundamental Properties of a Multivariate von Mises Distribution. Communications in Statistics — Theory and Methods, vol. 43, pp. 1132–1144, 2014. DOI:10.1080/03610926.2012.670353, arXiv:1109.6042, more… New PhD position 2013-11-22 Do you want to do a PhD on Bayesian Uncertainty Quantification with me? Are you good with maths and computers? As part of the new, NERC funded, doctoral training centre I am advertising for a PhD position. Details can be found on the DTP web page, the deadline for applications is 24 January 2014, start of the PhD is October 2014. The Rate of Convergence for Approximate Bayesian Computation 2013-11-08 I am very happy to report that after a long struggle we have finally finished (and submitted) a new paper today: S. Barber, J. Voss and M. Webster: The Rate of Convergence for Approximate Bayesian Computation. Electronic Journal of Statistics, vol. 9, pp. 80–105, 2015. DOI:10.1214/15-EJS988, arXiv:1311.2038, more… The paper studies the convergence of ABC estimates to the correct value. In particular, we prove that the method converges under very weak conditions, we show that the tolerance parameter δ should be chosen proportional to n-1/4, where n is the number of accepted ABC samples, and we determine the speed of convergence under optimal choice of δ. Hopefully, these results prove useful for others, too.'''
