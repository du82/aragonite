["https://seehuhn.de/pages/keys.html"]
title = "PGP Schlüssel"
description = "Öffentliche GnuPG/PGP Schlüssel von Jochen Voß"
full_description = 'GnuPG und PGP sind Verschlüsselungsprogramme, die nach dem "public key"-Verfahren arbeiten. Damit kann man z.B. Emails verschlüsseln und signieren. Ich freue mich über signierte und verschlüsselte Emails. Meine Schlüssel kann man entweder auf einem Keyserver finden, oder von hier bekommen: Mein Schlüssel ist mit etlichen digitalen Signaturen versehen, die helfen, die Echtheit meines Schlüssels sicherzustellen. Es gibt spezielle Programme, um Ketten solcher Signaturen zwischen zwei gegebenen Schlüsseln zu finden, z.B. den Experimental PGP key path finder von Jonathan McDowell und die PGP pathfinder & key statistics Seite von Henk P. Penning. Die Quelltexte auf dieser Webseite sind ebenfalls alle digital signiert. Dadurch kann man nachprüfen, ob die Quelltexte auf der Webseite tatsächlich meiner Version entsprechen. Das Programm GnuPG verwendet dazu die Option --verify. Die Ausgabe sollte etwa folgendermaßen aussehen: Ich bin gerne bereit, Schlüssel für GnuPG zu signieren. Dazu solltest Du Deinen Schlüssel auf einen öffentlichen Keyserver exportieren und danach mit mir einen Termin für ein Treffen vereinbaren. Mitbringen solltest Du einen Zettel, auf dem der "fingerprint" Deines Schlüssels steht (damit wir wissen, daß wir über denselben Schlüssel reden), und einen Personalausweis (damit ich bestätigen kann, daß Du Du bist). Copyright © 2012 Jochen Voss. All content on this website (including text, pictures, and any other original works), unless otherwise noted, is licensed under the CC BY-SA 4.0 license.'
author = "Jochen Voss"
year_published = 2012
year_updated = 2012
