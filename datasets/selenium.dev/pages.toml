["https://www.selenium.dev/blog/2010/a-smattering-of-selenium-28"]
title = "A Smattering of Selenium #28 | Selenium"
description = "So we go from not-enough-stuff-to-do-one to wow-this-will-take-awhile."
full_description = "A Smattering of Selenium #28So we go from not-enough-stuff-to-do-one to wow-this-will-take-awhile.By Adam Goucher (@adamgoucher) | Monday, September 27, 2010Categories:GeneralTags:SmatteringSo we go from not-enough-stuff-to-do-one to wow-this-will-take-awhile. And we’re off..Tellurium is one of the many frameworks that absorb Se and has an article on InfoQ called Introducing the Tellurium Automated Testing Framework which, well, introduces the framework.In the first of many Cucumber related posts this week is Sean Grove’s Cucumber Sauce for doing parallel Cucumber runs on the Sauce infrastructure. Might be general enough to use outside of it as well.Cuke4Ninja: The Secret Ninja Cucumber Scrolls, aside from outstanding ninja cucumber images, has a dead-tree book’s work of getting starting with Cucumber information.I updated the list of plugins for Se-IDE (that I know of) on the Se-HQ download pageArquillian is testing framework, developed at JBoss.org, that empowers developers to write integration tests for business objects that are executed inside of an embedded or remote container–options include a servlet container, a Java EE application server or a Java SE CDI environment. Oh, and it has a Selenium (1.x RC and 2.x Se WebDriver) extensionsThe Fall 2010 issue of Methods & Tools has an article on BromineAnother piece of Cucumber news is a Skills Matter video of Gojko Adzic and David de Florinier (see Cuke4Ninja able) talking about Cucumber & Selenium 2.0If you are doing automation, the right place to be running it is not the IDE but a CI server. Well, perhaps in addition to the IDE… Anyways, here is a post on Setting up a python CI server with Hudson. Now there is no excuse Python kids…Parallel Testing should be this year’s automation theme. Here is how to do it in C#.…and in PHP (this one, again with a bent to Sauce OnDemand, but…)And yet another PHP Sauce integration.Selenate is a JS 1.6 runner for SeActionscript Javascript Communication actually shows how the whole ExternalInterface stuff works when talking into Flash/Flex from within Se. I could have used this a year ago…Aside from parallel stuff, I think the Decorators and their kin are nice additions to the automation toolkit. Here is one for taking screenshots on test failure in PythonLondon is having another meetup on November 3The fall 2010 issue of Automated Software Testing Magazine is out. I think its kinda sad that articles on dynamic data generation still need to be written, but the ‘Testing With Reflection’ article seems to be not bad in that the message is ‘automate to learn, not to test’ PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
