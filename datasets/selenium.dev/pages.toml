full_description = "2.0b1 and MavenIf you’re using Maven and the 2.0b1 release of Selenium, you may be running into some problems getting maven to pick up your tests.By Simon Stewart (@shs96c) | Tuesday, January 25, 2011Categories:GeneralTags:SeleniumMavenIf you’re using Maven and the 2.0b1 release of Selenium, you may be running into some problems getting maven to pick up your tests. The underlying problem is that selenium contains support classes for both JUnit and TestNG. The solution is to add this to your pom.xml<dependency> <groupId>org.seleniumhq.selenium</groupId> <artifactId>selenium</artifactId> <version>2.0b1</version> <exclusions> <exclusion> <groupId>org.testng</groupId> <artifactId>testng</artifactId> </exclusion> </exclusions> </dependency> PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
