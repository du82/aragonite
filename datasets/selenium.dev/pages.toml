["https://selenium.dev/ja"]
title = "Selenium"
description = """
Seleniumはブラウザを自動化します。そうです！ その力で何をするかは完全にあなた次第です。
主にテスト目的でWebアプリケーションを自動化するためのものですが、それに限定されるものではありません。 退屈なWebベースの管理タスクも自動化できます（自動化する必要があります）。 Welcome! Note: only the documentation is translated to 日本語. The rest of the website is in English. We have an official translator for this language, but check our contribution guidelines if you’d like to help. 入門 Selenium WebDriver Selenium WebDriver 堅牢なブラウザーベースの回帰自動化スイートとテストを作成し、スクリプトをスケーリングして多くの環境に分散する場合は、 言語固有のバインディングのコレクションであるSeleniumWebDriverを使用して意図した操作でブラウザーを駆動します。
Read more Selenium IDE Selenium IDE 迅速なバグ再現スクリプトを作成したい場合、自動化支援の探索的テストを支援するスクリプトを作成したい場合は、SeleniumIDEを使用します。 Chrome、Firefox、Edgeのアドオンがブラウザとの対話の簡単な記録と再生を行います。
Read more Selenium Grid Selenium Grid 複数のマシンでテストを分散して実行し、複数の環境を中央から管理して、 ブラウザーとOSの膨大な組み合わせに対してテストを簡単に実行できるようにすることでスケーリングしたい場合は、 SeleniumGridを使用します。
Read more"""
