["https://selenium.dev/documentation/grid/advanced_features/observability"]
title = "Observability in Selenium Grid | Selenium"
description = """
Table of Contents Selenium Grid Observability Distributed tracing Event logging Grid Observability Visualizing Traces Leveraging event logs References Selenium Grid Grid aids in scaling and distributing tests by executing tests on various browser and operating system combinations.
Observability Observability has three pillars: traces, metrics and logs. Since Selenium Grid 4 is designed to be fully distributed, observability will make it easier to understand and debug the internals.
Distributed tracing A single request or transaction spans multiple services and components."""
full_description = '''DocumentationGridAdvanced FeaturesObservabilityv4.0Observability in Selenium GridTable of ContentsSelenium GridObservabilityDistributed tracingEvent loggingGrid ObservabilityVisualizing TracesLeveraging event logsReferencesSelenium GridGrid aids in scaling and distributing tests by executing tests on various browser and operating system combinations.ObservabilityObservability has three pillars: traces, metrics and logs. Since Selenium Grid 4 is designed to be fully distributed, observability will make it easier to understand and debug the internals.Distributed tracingA single request or transaction spans multiple services and components. Tracing tracks the request lifecycle as each service executes the request. It is useful in debugging in an error scenario. Some key terms used in tracing context are:Trace Tracing allows one to trace a request through multiple services, starting from its origin to its final destination. This request’s journey helps in debugging, monitoring the end-to-end flow, and identifying failures. A trace depicts the end-to-end request flow. Each trace has a unique id as its identifier.Span Each trace is made up of timed operations called spans. A span has a start and end time and it represents operations done by a service. The granularity of span depends on how it is instrumented. Each span has a unique identifier. All spans within a trace have the same trace id.Span Attributes Span attributes are key-value pairs which provide additional information about each span.Events Events are timed-stamped logs within a span. They provide additional context to the existing spans. Events also contain key-value pairs as event attributes.Event loggingLogging is essential to debug an application. Logging is often done in a human-readable format. But for machines to search and analyze the logs, it has to have a well-defined format. Structured logging is a common practice of recording logs consistently in a fixed format. It commonly contains fields like:TimestampLogging levelLogger classLog message (This is further broken down into fields relevant to the operation where the log was recorded)Logs and events are closely related. Events encapsulate all the possible information available to do a single unit of work. Logs are essentially subsets of an event. At the crux, both aid in debugging. Refer following resources for detailed understanding:https://www.honeycomb.io/blog/how-are-structured-logs-different-from-events/https://charity.wtf/2019/02/05/logs-vs-structured-events/Grid ObservabilitySelenium server is instrumented with tracing using OpenTelemetry. Every request to the server is traced from start to end. Each trace consists of a series of spans as a request is executed within the server. Most spans in the Selenium server consist of two events:Normal event - records all information about a unit of work and marks successful completion of the work.Error event - records all information till the error occurs and then records the error information. Marks an exception event.Running Selenium serverStandaloneHub and NodeFully DistributedDockerVisualizing TracesAll spans, events and their respective attributes are part of a trace. Tracing works while running the server in all of the above-mentioned modes.By default, tracing is enabled in the Selenium server. Selenium server exports the traces via two exporters:Console - Logs all traces and their included spans at FINE level. By default, Selenium server prints logs at INFO level and above. The log-level flag can be used to pass a logging level of choice while running the Selenium Grid jar/s.java -jar selenium-server-4.0.0-<selenium-version>.jar standalone --log-level FINE Jaeger UI - OpenTelemetry provides the APIs and SDKs to instrument traces in the code. Whereas Jaeger is a tracing backend, that aids in collecting the tracing telemetry data and providing querying, filtering and visualizing features for the data.Detailed instructions of visualizing traces using Jaeger UI can be obtained by running the command :java -jar selenium-server-4.0.0-<selenium-version>.jar info tracing A very good example and scripts to run the server and send traces to JaegerLeveraging event logsTracing has to be enabled for event logging as well, even if one does not wish to export traces to visualize them.By default, tracing is enabled. No additional parameters need to be passed to see logs on the console. All events within a span are logged at FINE level. Error events are logged at WARN level.All event logs have the following fields :FieldField valueDescriptionEvent timeeventIdTimestamp of the event record in epoch nanoseconds.Trace IdtracedIdEach trace is uniquely identified by a trace id.Span IdspanIdEach span within a trace is uniquely identified by a span id.Span KindspanKindSpan kind is a property of span indicating the type of span. It helps in understanding the nature of the unit of work done by the Span.Event nameeventNameThis maps to the log message.Event attributeseventAttributesThis forms the crux of the event logs, based on the operation executed, it has JSON formatted key-value pairs. This also includes a handler class attribute, to show the logger class.Sample logFINE [LoggingOptions$1.lambda$export$1] - { "traceId": "fc8aef1d44b3cc8bc09eb8e581c4a8eb", "spanId": "b7d3b9865d3ddd45", "spanKind": "INTERNAL", "eventTime": 1597819675128886121, "eventName": "Session request execution complete", "attributes": { "http.status_code": 200, "http.handler_class": "org.openqa.selenium.grid.router.HandleSession", "http.url": "\u002fsession\u002fdd35257f104bb43fdfb06242953f4c85", "http.method": "DELETE", "session.id": "dd35257f104bb43fdfb06242953f4c85" } } In addition to the above fields, based on OpenTelemetry specification error logs consist of :FieldField valueDescriptionException typeexception.typeThe class name of the exception.Exception messageexception.messageReason for the exception.Exception stacktraceexception.stacktracePrints the call stack at the point of time when the exception was thrown. Helps in understanding the origin of the exception.Sample error logWARN [LoggingOptions$1.lambda$export$1] - { "traceId": "7efa5ea57e02f89cdf8de586fe09f564", "spanId": "914df6bc9a1f6e2b", "spanKind": "INTERNAL", "eventTime": 1597820253450580272, "eventName": "exception", "attributes": { "exception.type": "org.openqa.selenium.ScriptTimeoutException", "exception.message": "Unable to execute request: java.sql.SQLSyntaxErrorException: Table 'mysql.sessions_mappa' doesn't exist ..." (full message will be printed), "exception.stacktrace": "org.openqa.selenium.ScriptTimeoutException: java.sql.SQLSyntaxErrorException: Table 'mysql.sessions_mappa' doesn't exist\nBuild info: version: '4.0.0-alpha-7', revision: 'Unknown'\nSystem info: host: 'XYZ-MacBook-Pro.local', ip: 'fe80:0:0:0:10d5:b63a:bdc6:1aff%en0', os.name: 'Mac OS X', os.arch: 'x86_64', os.version: '10.13.6', java.version: '11.0.7'\nDriver info: driver.version: unknown ...." (full stack will be printed), "http.handler_class": "org.openqa.selenium.grid.distributor.remote.RemoteDistributor", "http.url": "\u002fsession", "http.method": "POST" } } Note: Logs are pretty printed above for readability. Pretty printing for logs is turned off in Selenium server.The steps above should set you up for seeing traces and logs.ReferencesUnderstanding TracingOpenTelemetry Tracing API SpecificationSelenium WikiStructured logs vs eventsJaeger frameworkLast modified December 7, 2021: reorganize documentation and update titles (#861) [deploy site] (872174bfdd8)'''
