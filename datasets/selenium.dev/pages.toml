["https://selenium.dev/blog/2010/selenium-grid-1-0-7-released"]
title = "Selenium Grid 1.0.7 Released | Selenium"
description = "Following up on the Selenium Grid 1.0.6 release, we’re pleased to announce the release of Selenium Grid 1.0.7"
full_description = "Selenium Grid 1.0.7 ReleasedFollowing up on the Selenium Grid 1.0.6 release, we’re pleased to announce the release of Selenium Grid 1.0.7By Kevin Menard (@nirvdrum) | Tuesday, May 11, 2010Categories:ReleasesTags:SeleniumGridFollowing up on the Selenium Grid 1.0.6 release, which was mostly a bug fix release, we’re pleased to announce the release of Selenium Grid 1.0.7. This is another bug fix release that focuses primarily on how Selenium Grid handles browser sessions.You can download it now or view the changelog. The list of changes are:Hub now instructs remote controls to shutdown a session if the hub is going to remove it due to being idle for too longAdded ability to specify timeout period when waiting for remote controls to become available. Now the client can timeout gracefully and decide what it would like to do nextHandle common case of session ID not being found, either because it timed out or was already closed; rather than raising a NullPointerException we now raise a NoSuchSessionExceptionTruncate long command response bodies to 128 charactersRetry remote control checks up to three times before deciding that a remote control is unreliable or unresponsive. This prevents aggressive unregistration of hosts that are busy or suffer from network issuesAs always, patches and bug reports are appreciated:Code repositoryIssue trackerBarring any critical issues, the next release of Selenium Grid will be 1.1 and will feature an enhanced Web view as well as a status API. After that, we will be moving from GitHub to Google Code to live alongside the other Selenium projects.If you have any questions about Selenium Grid, please use either the user or the developer list, as is most appropriate for the nature of your question. Ongoing discussion about grid development should take place on the developer list. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
