["https://selenium.dev/pt-br/documentation/about/contributing"]
title = "Contribuindo com o Site e Documentação do Selenium | Selenium"
description = "Informações em como melhorar a documentação e exemplos de código para Selenium."
full_description = '''DocumentaçãoSobre esta documentaçãoContribuindo com o Site e Documentação do Seleniumv4.0Contribuindo com o Site e Documentação do SeleniumInformações em como melhorar a documentação e exemplos de código para Selenium.Selenium é um grande projeto de software, seu site e documentação são fundamentais para entender como as coisas funcionam e aprender maneiras eficazes de explorar seu potencial.Este projeto contém o site e a documentação do Selenium. Isto é um esforço contínuo (não direcionado a nenhuma versão específica) para fornecer informações atualizadas sobre como usar o Selenium de forma eficaz, como se envolver e como contribuir para o Selenium.As contribuições para o site e documentação seguem o processo descrito na seção abaixo sobre contribuições.O projeto Selenium recebe contribuições de todos. Há um várias maneiras de ajudar:Reportar um problemaAo relatar um novo problema ou comentar sobre problemas existentes, por favor certifique-se de que as discussões estão relacionadas a questões técnicas concretas sobre o software Selenium, seu site e/ou documentação.Todos os componentes do Selenium mudam bastante rápido ao longo do tempo, então este pode fazer com que a documentação fique desatualizada. Se você observar que este é o caso, como mencionado, não hesite em criar um problema para isso. Também pode ser possível que você saiba como atualizar a documentação, então, envie-nos um Pull Request com a alteração.Se você não tem certeza se o que encontrou é um problema ou não, pergunte através dos canais de comunicação descritos em https://selenium.dev/support.What to Help WithCreating ExamplesExamples that need to be moved are marked with:Add ExampleWe want to be able to run all of our code examples in the CI to ensure that people can copy and paste and execute everything on the site. So we put the code where it belongs in the examples directory. Each page in the documentation correlates to a test file in each of the languages, and should follow naming conventions. For instance examples for this page https://www.selenium.dev/documentation/webdriver/browsers/chrome/ get added in these files:"/examples/java/src/test/java/dev/selenium/browsers/ChromeTest.java""/examples/python/tests/browsers/test_chrome.py""/examples/dotnet/SeleniumDocs/Browsers/ChromeTest.cs""/examples/ruby/spec/browsers/chrome_spec.rb""/examples/javascript/test/browser/chromeSpecificCaps.spec.js"Each example should get its own test. Ideally each test has an assertion that verifies the code works as intended. Once the code is copied to its own test in the proper file, it needs to be referenced in the markdown file.For example, the tab in Ruby would look like this: {{< tab header="Ruby" >}} {{< gh-codeblock path="/examples/ruby/spec/browsers/chrome_spec.rb#L8-L9" >}} {{< /tab >}} The line numbers at the end represent only the line or lines of code that actually represent the item being displayed. If a user wants more context, they can click the link to the GitHub page that will show the full context.Make sure that if you add a test to the page that all the other line numbers in the markdown file are still correct. Adding a test at the top of a page means updating every single reference in the documentation that has a line number for that file.Finally, make sure that the tests pass in the CI.Moving ExamplesExamples that need to be moved are marked with:Move CodeEverything from the Creating Examples section applies, with one addition.Make sure the tab includes text=true. By default, the tabs get formatted for code, so to use markdown or other shortcode statements (like gh-codeblock) it needs to be declared as text. For most examples, the tabpane declares the text=true, but if some of the tabs have code examples, the tabpane cannot specify it, and it must be specified in the tabs that do not need automatic code formatting.ContribuiçõesO projeto Selenium dá as boas-vindas a novos contribuidores. Indivíduos fazendo contribuições significativas e valiosas ao longo do tempo são transformados em Committers e recebem acesso de commit ao projeto.Este guia irá guiá-lo através do processo de contribuição.Passo 1: ForkFaça um fork do projeto no GitHub e faça checkout na sua cópia localmente.% git clone git@github.com:seleniumhq/seleniumhq.github.io.git % cd seleniumhq.github.io Dependências: HugoUsamos Hugo e Docsy theme para criar e gerar o website. Você vai necessitar de usar a versão “extended” Sass/SCSS do binário Hugo. Recomendamos a versão 0.125.4 .Por favor siga as instruções do Docsy Install HugoPasso 2: BranchCrie uma branch e comece a hackear:% git checkout -b my-feature-branch Praticamos o desenvolvimento baseado em HEAD, o que significa que todas as mudanças são aplicadas diretamente no topo do dev.Passo 3: Faça mudançasO repositório contém o website e a documentação. Antes de começar a alterar coisas, por favor veja o resto dos passos para preparar as dependências e sub-módulos (veja os comandos abaixo).Para fazer alterações ao website, trabalha na pasta website_and_docs. Para ver uma previsão do aspecto do website, execute hugo server a partir da raíz do projecto.% git submodule update --init --recursive % cd website_and_docs % hugo server See Style Guide for more information on our conventions for contributionPasso 4: CommitPrimeiro, certifique-se de que o git saiba seu nome e endereço de e-mail:% git config --global user.name 'Santa Claus' % git config --global user.email 'santa@example.com' Escrever boas mensagens de commit é importante. Uma mensagem de confirmação deve descrever o que mudou, por que e conter referência de problemas corrigidos (se houver). Siga estas diretrizes ao escrever um:A primeira linha deve ter cerca de 50 caracteres ou menos e conter uma breve da descrição da mudança.Mantenha a segunda linha em branco.Quebra todas as outras linhas em 72 colunas.Incluir Fixes # N, onde N é o número do problema que o commit corrige se houver.Uma boa mensagem de confirmação pode ter a seguinte aparência:explain commit normatively in one line Body of commit message is a few lines of text, explaining things in more detail, possibly giving some background about the issue being fixed, etc. The body of the commit message can be several paragraphs, and please do proper word-wrap and keep columns shorter than about 72 characters or so. That way `git log` will show things nicely even when it is indented. Fixes #141 A primeira linha deve ser significativa, pois é o que as pessoas veem quando executam git shortlog ou git log --oneline.Passo 5: RebaseUse git rebase (não git merge) para sincronizar seu trabalho de tempos em tempos.% git fetch origin % git rebase origin/trunk Passo 6: TesteLembre-se sempre de executar o servidor local, com isso, você pode ter certeza de que suas alterações não prejudicaram nada.Passo 7: Push% git push origin my-feature-branch Acesse https://github.com/yourusername/seleniumhq.github.io.git e clique em Pull Request e preencha o formulário. Por favor indique que você assinou o CLA (consulte a Etapa 7).Os Pull Requests geralmente são revisados em alguns dias. Se houver comentários a abordar, aplique suas alterações em novos commits (de preferência fixups) e envie para a mesma branch.Passo 8: IntegraçãoQuando a revisão do código for concluída, um committer integrará seu PR no branch de tronco do repositório. Porque gostamos de manter um histórico linear no trunk, nós normalmente iremos dar Squash & Rebase no histórico da sua branch.ComunicaçãoTodos os detalhes sobre como se comunicar com os colaboradores do projeto e a comunidade em geral podem ser encontrados em https://selenium.dev/supportÚltima modificação August 27, 2024: update hugo version to 0.125.4 in contribute, to avoid build error (#1899) (00251f47fc1)'''
