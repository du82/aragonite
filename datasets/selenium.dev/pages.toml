title = "A Smattering of Selenium #18 | Selenium"
description = "Not too much this week with various holidays around the world, but still managed to dig some things up."
full_description = "A Smattering of Selenium #18Not too much this week with various holidays around the world, but still managed to dig some things up.By Adam Goucher (@adamgoucher) | Monday, July 05, 2010Categories:GeneralTags:SmatteringNot too much this week with various holidays around the world, but still managed to dig some things up.Sauce Labs has started a webinar series and recently had one on using Cucumber and OnDemand. Cucumber and Robot Framework like tools are the coming wave of testing tools.Another bit of Sauce-ish news is the folks at Rally put up a post on how to get Se 2 scripts in their OnDemand cloudIf writing Se scripts is ‘programming’, then writing the controlling frameworks is real programming. That means that proper development practices should be followed; such as TDD. If you are new to TDD, then The Prags have released a screencast series by Kent Beck would be helpful. I’ll be getting this one as soon as my to-watch backlog gets under control.Re-usable Selenium Testing with GWT has lots of tricks to dealing with GWT widgets — something which comes up a lot on the Se-Users mailing listAnd lastly, the Selenium Stack Exchange proposal has progressed to the next level which is getting people to commit to using it. The number of commits is a convoluted formula, but every one counts. If you think the Se-Users mailing list is too crazy, this format might be better for you. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
