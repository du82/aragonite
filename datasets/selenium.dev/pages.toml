["https://selenium.dev/blog/2010/a-smattering-of-selenium-20"]
title = "A Smattering of Selenium #20 | Selenium"
description = "12 hours late, but I was driving draft horses all day so that’s my excuse and I’m sticking with it."
full_description = "A Smattering of Selenium #2012 hours late, but I was driving draft horses all day so that’s my excuse and I’m sticking with it.By Adam Goucher (@adamgoucher) | Monday, July 19, 2010Categories:GeneralTags:Smattering12 hours late, but I was driving draft horses all day so that’s my excuse and I’m sticking with it. Enjoy. I’m going for a nap.The big news this week was the next alpha of Se 2 came out. Time to update those automation machines.Like TestNG’s @BeforeClass and @AfterClass but using JUnit4? Using JUnit Nested Suites with Selenium RC to simulate TestNG suite and grouping annotations is a long titled post, but describes how to fake one out to act like the other.Also on the topic of TestNG is the announcement of Selenium on TestNGThe folks at ActiveState did a survey in their community about tooling and Selenium wonI had to hack DNS a bit for a client’s Se setup to work the other week, but that seems pretty kludgey compared to Selenium Trick: Using a different DNSUsing ExtJS? According to Testing ExtJS with Selenium Automating UI Tests the trick is to use CSS as your location strategyJason Huggins was interviewed by Matt Heusser in Episode 3 of TWiSTIf you are doing Se, then you are doing code. If you are converting ‘classic’ manual testers to do automation you need to start thinking about Training Testers in how to code…While not directly related to Se, Practicing Continuous Integration on Flash Projects: Using Hudson is the wrapup post in a series on doing what it says. If you are doing CI, and of course everyone is, then it needs to be for all parts of your systemParkCalc automation – Keyword-driven tests in FitNesse wraps up the series by Markus Gärtner that has been mentioned the last two weeks as well.HOWTO: Test JQuery AJAX autocomplete menus with Selenium details something that is fairly common I think. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
