full_description = "Selenium Community Live - Episode 2Selenium Community Live - Episode 2By Pallavi Sharma | Tuesday, January 21, 2025Categories:WebinarTags:WebinarMeetupTalksCommunityThe second episode of Selenium Community Live happened on Jan 21st, 2025, with speaker David Burns, event hosted by Pallavi SharmaYou can watch the episode here- Selenium Community Live - Episode 2Selenium Community Live - Episode 2David Burns, Selenium Project Leadership Member, Chair W3C Browser Testing and Tools Workgroup, Head Open source and Developer Advocacy at Browser Stack was the speaker for the episode. David spoke about Web Browsers and Browser engines, and how while automating them we should be aware of the underlying software we are automating, even the platform makes a difference! Thank you everyone who joined the community event.Meet the Speakers:David BurnsWatch the RecordingCouldn’t join us live? Watch the entire episode here - 📹 Recording Link: Watch the Event Recording on YouTubeDavid also runs a blog, and if you are interested in knowing internals of Selenium explore the link - Blog By DavidStay tuned as we bring the next! Subscribe here to the Selenium HQ Official YouTube Channel. PreviousNext Last modified January 29, 2025: Update selenium-community-live-episode2.md (095529d036c)"
