["https://selenium.dev/sponsor"]
title = "Sponsor | Selenium"
description = "Sponsor The Selenium project is a member of the Software Freedom Conservancy, a 501(c)3 non-profit organization. The Conservancy has allowed us to pool organizational resources with other projects, such as Inkscape, Samba, and Wine, in order to reduce the management overhead associated with creating our own, dedicated legal entity. The majority of sponsorship funds go directly towards supporting the Selenium project, such as server and software expenses. A small portion of the funds are set aside for the Conservancy to continue their work in supporting Selenium and other open source initiatives."
full_description = '''SponsorThe Selenium project is a member of the Software Freedom Conservancy, a 501(c)3 non-profit organization. The Conservancy has allowed us to pool organizational resources with other projects, such as Inkscape, Samba, and Wine, in order to reduce the management overhead associated with creating our own, dedicated legal entity.The majority of sponsorship funds go directly towards supporting the Selenium project, such as server and software expenses. A small portion of the funds are set aside for the Conservancy to continue their work in supporting Selenium and other open source initiatives.GoalsOur goals are straightforward: we aim to enhance Selenium by performing tasks such as code reviews, specialized bug fixes, and paying hosting bills, all for the benefit of the entire Selenium user community and the public. Additionally, we want to enable sponsors to make tax-deductible donations and publicly recognize these contributions.General BenefitsYou (or your company) are contributing to an extraordinary open-source project.The support of Selenium by your company will be more widely known in the Selenium community, increasing community awareness of your company.Our website is the first place people learn about Selenium. By having a link to your website, you will be seen as a supporter of the Selenium project that our users adore.Contributions are tax-deductible.Sponsoring us may involve participation in a Sponsors Online Summit, webinars and social media cross-promotion, offering valuable exposure and engagement opportunities.Check the Sponsorship Levels for more benefits.Sponsorship LevelsBelow are the names and amounts associated with levels of sponsorship (all values in USD).Selenium: $16,000Your logo will be placed on each page of our website20% discount available on sponsorship packages for the Selenium ConferenceIf you were a sponsor of the most recent Selenium Conference , you are eligible for a 20% discount.After one year, your logo will automatically move to the Gold level if sponsorship isn't renewed; after two years, it will be eligible for removal.Fortnightly retweets of Selenium related contentDevelopmentThis level has the same benefits as the Selenium level above, but instead of making a monetary contribution, at least one employee from your company needs to be actively contributing to the project.Currently limited to 2 companies but reviewed yearly.Special mention at Selenium eventsWeekly cross-promotion of Selenium related content through the social media platforms where Selenium is present.Note: If the employee(s) are removed from the project then the company will lose this sponsorship level.Gold: $8,000Your logo will be placed on the sponsors page10% discount available on sponsorship packages for the Selenium ConferenceIf you were a sponsor of the most recent Selenium Conference , you are eligible for a 10% discount.After one year, your logo will automatically move to the Silver level if sponsorship isn't renewed; after two years, it will be eligible for removal.Silver: $4,000Your logo will be placed on the sponsors pageAfter one year, your logo will automatically move to the Bronze level if sponsorship isn't renewed; after two years, it will be eligible for removal.Bronze: $1,000Your logo will be placed on the sponsors pageAfter one year, your logo will automatically removed if sponsorship isn't renewed.LogosLogos may be up to 468 pixels wide and 80 pixels tall. Selenium-level sponsors may be up to 600 pixels wide and 250 pixels tall.You can get started on working with the website by following the instructions on our wiki.Non-Monetary DonationsThe Selenium project will consider the value of non-monetary donations to the project - for example, donations of hardware, software licenses, or hosting - on a case-by-case basis. We will set a sponsorship level appropriately. We note that non-monetary donations may not be tax-deductible; to confirm, you should seek the counsel of a qualified tax professional. In general, we suggest cash donations, as that process is much simpler.How to DonateBronze sponsors can donate through our Open Collective profile.For larger donations (Silver and higher), we request that payment is remitted by check or wire transfer. This ensures 100% of the donation goes to the project and that we don't pay unnecessarily large transaction fees. To pay by check, make it payable to "Software Freedom Conservancy" and write "Selenium Sponsorship" in the "memo" field. Checks should be sent to the following address, so that the Conservancy can process them:Software Freedom Conservancy, Inc.137 MONTAGUE ST STE 380Brooklyn, NY 11201-3548We can also email you wire transfer instructions and/or provide an invoice for your sponsorship.Regardless, please email: sponsorship@seleniumhq.org to let us know that you've sent a check or PayPal payment, or to request the invoice.'''
year_published = 2024
clearnet = "https://selenium.dev/sponsor"
