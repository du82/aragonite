["https://selenium.dev/documentation/legacy/selenium_1"]
title = "Selenium RC (Selenium 1) | Selenium"
description = "The original version of Selenium"
full_description = '''DocumentationLegacySelenium 1Legacy Code!Selenium RC (Selenium 1)The original version of SeleniumIntroductionSelenium RC was the main Selenium project for a long time, before the WebDriver/Selenium merge brought up Selenium 2, a more powerful tool. It is worth to highlight that Selenium 1 is not supported anymore.How Selenium RC WorksFirst, we will describe how the components of Selenium RC operate and the role each plays in running your test scripts.RC ComponentsSelenium RC components are:The Selenium Server which launches and kills browsers, interprets and runs the Selenese commands passed from the test program, and acts as an HTTP proxy, intercepting and verifying HTTP messages passed between the browser and the AUT.Client libraries which provide the interface between each programming language and the Selenium RC Server.Here is a simplified architecture diagram:The diagram shows the client libraries communicate with the Server passing each Selenium command for execution. Then the server passes the Selenium command to the browser using Selenium-Core JavaScript commands. The browser, using its JavaScript interpreter, executes the Selenium command. This runs the Selenese action or verification you specified in your test script.Selenium ServerSelenium Server receives Selenium commands from your test program, interprets them, and reports back to your program the results of running those tests.The RC server bundles Selenium Core and automatically injects it into the browser. This occurs when your test program opens the browser (using a client library API function). Selenium-Core is a JavaScript program, actually a set of JavaScript functions which interprets and executes Selenese commands using the browser’s built-in JavaScript interpreter.The Server receives the Selenese commands from your test program using simple HTTP GET/POST requests. This means you can use any programming language that can send HTTP requests to automate Selenium tests on the browser.Client LibrariesThe client libraries provide the programming support that allows you to run Selenium commands from a program of your own design. There is a different client library for each supported language. A Selenium client library provides a programming interface (API), i.e., a set of functions, which run Selenium commands from your own program. Within each interface, there is a programming function that supports each Selenese command.The client library takes a Selenese command and passes it to the Selenium Server for processing a specific action or test against the application under test (AUT). The client library also receives the result of that command and passes it back to your program. Your program can receive the result and store it into a program variable and report it as a success or failure, or possibly take corrective action if it was an unexpected error.So to create a test program, you simply write a program that runs a set of Selenium commands using a client library API. And, optionally, if you already have a Selenese test script created in the Selenium-IDE, you can generate the Selenium RC code. The Selenium-IDE can translate (using its Export menu item) its Selenium commands into a client-driver’s API function calls. See the Selenium-IDE chapter for specifics on exporting RC code from Selenium-IDE.InstallationInstallation is rather a misnomer for Selenium. Selenium has a set of libraries available in the programming language of your choice. You could download them from the downloads page.Once you’ve chosen a language to work with, you simply need to:Install the Selenium RC Server.Set up a programming project using a language specific client driver.Installing Selenium ServerThe Selenium RC server is simply a Java jar file (selenium-server-standalone-.jar), which doesn’t require any special installation. Just downloading the zip file and extracting the server in the desired directory is sufficient.Running Selenium ServerBefore starting any tests you must start the server. Go to the directory where Selenium RC’s server is located and run the following from a command-line console. java -jar selenium-server-standalone-<version-number>.jar This can be simplified by creating a batch or shell executable file (.bat on Windows and .sh on Linux) containing the command above. Then make a shortcut to that executable on your desktop and simply double-click the icon to start the server.For the server to run you’ll need Java installed and the PATH environment variable correctly configured to run it from the console. You can check that you have Java correctly installed by running the following on a console. java -version If you get a version number (which needs to be 1.5 or later), you’re ready to start using Selenium RC.Using the Java Client DriverDownload Selenium java client driver zip from the SeleniumHQ downloads page.Extract selenium-java-.jar fileOpen your desired Java IDE (Eclipse, NetBeans, IntelliJ, Netweaver, etc.)Create a java project.Add the selenium-java-.jar files to your project as references.Add to your project classpath the file selenium-java-.jar.From Selenium-IDE, export a script to a Java file and include it in your Java project, or write your Selenium test in Java using the selenium-java-client API. The API is presented later in this chapter. You can either use JUnit, or TestNg to run your test, or you can write your own simple main() program. These concepts are explained later in this section.Run Selenium server from the console.Execute your test from the Java IDE or from the command-line.For details on Java test project configuration, see the Appendix sections Configuring Selenium RC With Eclipse and Configuring Selenium RC With Intellij.Using the Python Client DriverInstall Selenium via PIP, instructions linked at SeleniumHQ downloads pageEither write your Selenium test in Python or export a script from Selenium-IDE to a python file.Run Selenium server from the consoleExecute your test from a console or your Python IDEFor details on Python client driver configuration, see the appendix Python Client Driver Configuration.Using the .NET Client DriverDownload Selenium RC from the SeleniumHQ downloads pageExtract the folderDownload and install NUnit ( Note: You can use NUnit as your test engine. If you’re not familiar yet with NUnit, you can also write a simple main() function to run your tests; however NUnit is very useful as a test engine.)Open your desired .Net IDE (Visual Studio, SharpDevelop, MonoDevelop)Create a class library (.dll)Add references to the following DLLs: nmock.dll, nunit.core.dll, nunit. framework.dll, ThoughtWorks.Selenium.Core.dll, ThoughtWorks.Selenium.IntegrationTests.dll and ThoughtWorks.Selenium.UnitTests.dllWrite your Selenium test in a .Net language (C#, VB.Net), or export a script from Selenium-IDE to a C# file and copy this code into the class file you just created.Write your own simple main() program or you can include NUnit in your project for running your test. These concepts are explained later in this chapter.Run Selenium server from consoleRun your test either from the IDE, from the NUnit GUI or from the command lineFor specific details on .NET client driver configuration with Visual Studio, see the appendix .NET client driver configuration.Using the Ruby Client DriverIf you do not already have RubyGems, install it from RubyForge.Run gem install selenium-clientAt the top of your test script, add require "selenium/client"Write your test script using any Ruby test harness (eg Test::Unit, Mini::Test or RSpec).Run Selenium RC server from the console.Execute your test in the same way you would run any other Ruby script.For details on Ruby client driver configuration, see the Selenium-Client documentation_From Selenese to a ProgramThe primary task for using Selenium RC is to convert your Selenese into a programming language. In this section, we provide several different language-specific examples.Sample Test ScriptLet’s start with an example Selenese test script. Imagine recording the following test with Selenium-IDE.open/typeqselenium rcclickAndWaitbtnGassertTextPresentResults * for selenium rcNote: This example would work with the Google search page http://www.google.comSelenese as Programming CodeHere is the test script exported (via Selenium-IDE) to each of the supported programming languages. If you have at least basic knowledge of an object- oriented programming language, you will understand how Selenium runs Selenese commands by reading one of these examples. To see an example in a specific language, select one of these buttons.CSharp using System; using System.Text; using System.Text.RegularExpressions; using System.Threading; using NUnit.Framework; using Selenium; namespace SeleniumTests { [TestFixture] public class NewTest { private ISelenium selenium; private StringBuilder verificationErrors; [SetUp] public void SetupTest() { selenium = new DefaultSelenium("localhost", 4444, "*firefox", "http://www.google.com/"); selenium.Start(); verificationErrors = new StringBuilder(); } [TearDown] public void TeardownTest() { try { selenium.Stop(); } catch (Exception) { // Ignore errors if unable to close the browser } Assert.AreEqual("", verificationErrors.ToString()); } [Test] public void TheNewTest() { selenium.Open("/"); selenium.Type("q", "selenium rc"); selenium.Click("btnG"); selenium.WaitForPageToLoad("30000"); Assert.AreEqual("selenium rc - Google Search", selenium.GetTitle()); } } } Java /** Add JUnit framework to your classpath if not already there * for this example to work */ package com.example.tests; import com.thoughtworks.selenium.*; import java.util.regex.Pattern; public class NewTest extends SeleneseTestCase { public void setUp() throws Exception { setUp("http://www.google.com/", "*firefox"); } public void testNew() throws Exception { selenium.open("/"); selenium.type("q", "selenium rc"); selenium.click("btnG"); selenium.waitForPageToLoad("30000"); assertTrue(selenium.isTextPresent("Results * for selenium rc")); } } Php <?php require_once 'PHPUnit/Extensions/SeleniumTestCase.php'; class Example extends PHPUnit_Extensions_SeleniumTestCase { function setUp() { $this->setBrowser("*firefox"); $this->setBrowserUrl("http://www.google.com/"); } function testMyTestCase() { $this->open("/"); $this->type("q", "selenium rc"); $this->click("btnG"); $this->waitForPageToLoad("30000"); $this->assertTrue($this->isTextPresent("Results * for selenium rc")); } } ?> Python from selenium import selenium import unittest, time, re class NewTest(unittest.TestCase): def setUp(self): self.verificationErrors = [] self.selenium = selenium("localhost", 4444, "*firefox", "http://www.google.com/") self.selenium.start() def test_new(self): sel = self.selenium sel.open("/") sel.type("q", "selenium rc") sel.click("btnG") sel.wait_for_page_to_load("30000") self.failUnless(sel.is_text_present("Results * for selenium rc")) def tearDown(self): self.selenium.stop() self.assertEqual([], self.verificationErrors) Ruby require "selenium/client" require "test/unit" class NewTest < Test::Unit::TestCase def setup @verification_errors = [] if $selenium @selenium = $selenium else @selenium = Selenium::Client::Driver.new("localhost", 4444, "*firefox", "http://www.google.com/", 60); @selenium.start end @selenium.set_context("test_new") end def teardown @selenium.stop unless $selenium assert_equal [], @verification_errors end def test_new @selenium.open "/" @selenium.type "q", "selenium rc" @selenium.click "btnG" @selenium.wait_for_page_to_load "30000" assert @selenium.is_text_present("Results * for selenium rc") end end In the next section we’ll explain how to build a test program using the generated code.Programming Your TestNow we’ll illustrate how to program your own tests using examples in each of the supported programming languages. There are essentially two tasks:Generate your script into a programming language from Selenium-IDE, optionally modifying the result.Write a very simple main program that executes the generated code.Optionally, you can adopt a test engine platform like JUnit or TestNG for Java, or NUnit for .NET if you are using one of those languages.Here, we show language-specific examples. The language-specific APIs tend to differ from one to another, so you’ll find a separate explanation for each.JavaC#PythonRubyPerl, PHPJavaFor Java, people use either JUnit or TestNG as the test engine.Some development environments like Eclipse have direct support for these via plug-ins. This makes it even easier. Teaching JUnit or TestNG is beyond the scope of this document however materials may be found online and there are publications available. If you are already a “java-shop” chances are your developers will already have some experience with one of these test frameworks.You will probably want to rename the test class from “NewTest” to something of your own choosing. Also, you will need to change the browser-open parameters in the statement: selenium = new DefaultSelenium("localhost", 4444, "*iehta", "http://www.google.com/"); The Selenium-IDE generated code will look like this. This example has comments added manually for additional clarity. package com.example.tests; // We specify the package of our tests import com.thoughtworks.selenium.*; // This is the driver's import. You'll use this for instantiating a // browser and making it do what you need. import java.util.regex.Pattern; // Selenium-IDE add the Pattern module because it's sometimes used for // regex validations. You can remove the module if it's not used in your // script. public class NewTest extends SeleneseTestCase { // We create our Selenium test case public void setUp() throws Exception { setUp("http://www.google.com/", "*firefox"); // We instantiate and start the browser } public void testNew() throws Exception { selenium.open("/"); selenium.type("q", "selenium rc"); selenium.click("btnG"); selenium.waitForPageToLoad("30000"); assertTrue(selenium.isTextPresent("Results * for selenium rc")); // These are the real test steps } } C#The .NET Client Driver works with Microsoft.NET. It can be used with any .NET testing framework like NUnit or the Visual Studio 2005 Team System.Selenium-IDE assumes you will use NUnit as your testing framework. You can see this in the generated code below. It includes the using statement for NUnit along with corresponding NUnit attributes identifying the role for each member function of the test class.You will probably have to rename the test class from “NewTest” to something of your own choosing. Also, you will need to change the browser-open parameters in the statement: selenium = new DefaultSelenium("localhost", 4444, "*iehta", "http://www.google.com/"); The generated code will look similar to this. using System; using System.Text; using System.Text.RegularExpressions; using System.Threading; using NUnit.Framework; using Selenium; namespace SeleniumTests { [TestFixture] public class NewTest { private ISelenium selenium; private StringBuild'''
