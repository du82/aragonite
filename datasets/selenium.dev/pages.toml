title = "A Smattering of Selenium #33 | Selenium"
description = "…and here’s the links!"
full_description = "A Smattering of Selenium #33…and here’s the links!By Adam Goucher (@adamgoucher) | Monday, November 22, 2010Categories:GeneralTags:Smattering…and here’s the links!Henrik Skupin was one of the speakers at the London Selenium Meetup and has written about the night and his talkSpeaking of which, videos of the talks are now upPart of good automation is knowing how to code. So here are some sites that crossed my path this week for thatRails for ZombiesDive into HTML 5HTML5 RocksCheezy continues his UI series which takes a detour over to WATIR land, but things are transferable. Introducing a Simple DSL and Default DataFunctional Automation is an important part of Continuous Delivery. Here is Jez talking about Continuous Delivery — beer in hand. (which to me is the most important concept of the year)Acceptance Test-Driven Development with Robot Framework is an excerpt from Practices for Scaling Lean & Agile Development.BidiChecker is a tool for checking bidirectional (BiDi) text. So who is going to integrate this into Se?Interaction with Flash using FlashSelenium and Javascript – Part 1 starts to show how to use FlashSelenium to interact with Flash-y things.Looking for a Selenium job? Have a look at How to get a Rails job. When I have hired, or help people hire, this is very true.And finally the whole should-testers-need-to-know-how-to-code conflict bubbled up again somewhat last week. Since this is my list of links: if you are automating, yes; if you are not, then no (but it can’t hurt).Don’t call me TechnicalThe Future of TestingThe Future of Testing is Wide Open PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
