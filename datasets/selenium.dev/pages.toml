["https://selenium.dev/documentation/grid/architecture"]
title = "Grid architecture | Selenium"
description = """
The Grid is designed as a set of components that all fulfill a role in maintaining the Grid. It can seem quite complicated, but hopefully this document can help clear up any confusion.
The Key Components The main components of the Grid are:
Event Bus Used for sending messages which may be received asynchronously between the other components. New Session Queue Maintains a list of incoming sessions which have yet to be assigned to a Node by the Distributor."""
full_description = 'DocumentationGridArchitecturev4.0Grid architectureThe Grid is designed as a set of components that all fulfill a role in maintaining the Grid. It can seem quite complicated, but hopefully this document can help clear up any confusion.The Key ComponentsThe main components of the Grid are:Event BusUsed for sending messages which may be received asynchronously between the other components.New Session QueueMaintains a list of incoming sessions which have yet to be assigned to a Node by the Distributor.DistributorResponsible for maintaining a model of the available locations in the Grid where a session may run (known as "slots") and taking any incoming new session requests and assigning them to a slot.NodeRuns a WebDriver session. Each session is assigned to a slot, and each node has one or more slots.Session MapMaintains a mapping between the session ID and the address of the Node the session is running on.RouterActs as the front-end of the Grid. This is the only part of the Grid which may be exposed to the wider Web (though we strongly caution against it). This routes incoming requests to either the New Session Queue or the Node on which the session is running.While discussing the Grid, there are some other useful concepts to keep in mind:A slot is the place where a session can run.Each slot has a stereotype. This is the minimal set of capabilities that a new session session request must match before the Distributor will send that request to the Node owning the slot.The Grid Model is how the Distributor tracks the state of the Grid. As the name suggests, this may sometimes fall out of sync with reality (perhaps because the Distributor has only just started). It is used in preference to querying each Node so that the Distributor can quickly assign a slot to a New Session request.Synchronous and Asynchronous CallsThere are two main communication mechanisms used within the Grid:Synchronous “REST-ish” JSON over HTTP requests.Asynchronous events sent to the Event Bus.How do we pick which communication mechanism to use? After all, we could model the entire Grid in an event-based way, and it would work out just fine.The answer is that if the action being performed is synchronous (eg. most WebDriver calls), or if missing the response would be problematic, the Grid uses a synchronous call. If, instead, we want to broadcast information to anyone who’s interested, or if missing the response doesn’t matter, then we prefer to use the event bus.One interesting thing to note is that the async calls are more decoupled from their listeners than the synchronous calls are.Start Up Sequence and Dependencies Between ComponentsAlthough the Grid is designed to allow components to start up in any order, conceptually the order in which components starts is:The Event Bus and Session Map start first. These have no other dependencies, not even on each other, and so are safe to start in parallel.The Session Queue starts next.It is now possible to start the Distributor. This will periodically connect to the Session Queue and poll for jobs, though this polling might be initiated either by an event (that a New Session has been added to the queue) or at regular intervals.The Router(s) can be started. New Session requests will be directed to the Session Queue, and the Distributor will attempt to find a slot to run the session on.We are now able to start a Node. See below for details about how the Node is registered with the Grid. Once registration is complete, the Grid is ready to serve traffic.You can picture the dependencies between components this way, where a “✅” indicates that there is a synchronous dependency between the components.Event BusDistributorNodeRouterSession MapSession QueueEvent BusXDistributor✅X✅✅Node✅XRouter✅X✅Session MapXSession Queue✅XNode RegistrationThe process of registering a new Node to the Grid is lightweight.When the Node starts, it should emit a “heart beat” event on a regular basis. This heartbeat contains the node status.The Distributor listens for the heart beat events. When it sees one, it attempts to GET the /status endpoint of the Node. It is from this information that the Grid is set up.The Distributor will use the same /status endpoint to check the Node on a regular basis, but the Node should continue sending heart beat events even after started so that a Distributor without a persistent store of the Grid state can be restarted and will (eventually) be up to date and correct.The Node Status ObjectThe Node Status is a JSON blob with the following fields:NameTypeDescriptionavailabilitystringA string which is one of up, draining, or down. The important one is draining, which indicates that no new sessions should be sent to the Node, and once the last session on it closes, the Node will exit or restart.externalUrlstringThe URI that the other components in the Grid should connect to.lastSessionCreatedintegerThe epoch timestamp of when the last session was created on this Node. The Distributor will attempt to send new sessions to the Node that has been idle longest if all other things are equal.maxSessionCountintegerAlthough a session count can be inferred by counting the number of available slots, this integer value is used to determine the maximum number of sessions that should be running simultaneously on the Node before it is considered “full”.nodeIdstringA UUID used to identify this instance of the Node.osInfoobjectAn object with arch, name, and version fields. This is used by the Grid UI and the GraphQL queries.slotsarrayAn array of Slot objects (described below)versionstringThe version of the Node (for Selenium, this will match the Selenium version number)It is recommended to put values in all fields.The Slot ObjectThe Slot object represents a single slot within a Node. A “slot” is where a single session may be run. It is possible that a Node will have more slots than it can run concurrently. For example, a node may be able to run up 10 sessions, but they could be any combination of Chrome, Edge, or Firefox; in this case, the Node would indicate a “max session count” of 10, and then also say it has 10 slots for Chrome, 10 for Edge, and 10 for Firefox.NameTypeDescriptionidstringUUID to refer to the slotlastStartedstringWhen the slot last had a session started, in ISO-8601 formatstereotypeobjectThe minimal set of capabilities this slot will match against. A minimal example is {"browserName": "firefox"}sessionobjectThe Session object (see below)The Session ObjectThis represents a running session within a slotNameTypeDescriptioncapabilitiesobjectThe actual capabilities provided by the session. Will match the return value from the new session commandstartTimestringThe start time of the session in ISO-8601 formatstereotypeobjectThe minimal set of capabilities this slot will match against. A minimal example is {"browserName": "firefox"}uristringThe URI used by the Node to communicate with the sessionLast modified August 29, 2022: Updating Grid architecture (9df8227bc4c)'
year_published = 2022
