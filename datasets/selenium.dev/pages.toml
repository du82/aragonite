full_description = "DocumentationLegacyLegacy Code!LegacyDocumentation related to the legacy components of Selenium. Meant to be kept purely for historical reasons and not as a incentive to use deprecated components.Selenium RC (Selenium 1)The original version of SeleniumSelenium 2Selenium 2 was a rewrite of Selenium 1 that was implemented with WebDriver code.Selenium 3Selenium 3 was the implementation of WebDriver without the Selenium RC Code. It has since been replaced with Selenium 4, which implements the W3C WebDriver specification.Legacy Selenium IDESelenium IDE was the original Firefox extension for Record and Playback.JSON Wire Protocol SpecificationThe endpoints and payloads for the now-obsolete open source protocol that was the precursor to the W3C specification.Legacy Selenium Desired CapabilitiesThese capabilities worked with the legacy JSON Wire ProtocolLegacy developer documentationInformation of interest to developers of SeleniumLast modified December 7, 2021: reorganize documentation and update titles (#861) [deploy site] (872174bfdd8)"
