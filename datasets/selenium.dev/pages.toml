full_description = "DocumentationLegacySelenium 2Legacy Code!Selenium 2Selenium 2 was a rewrite of Selenium 1 that was implemented with WebDriver code.Migrating from RC to WebDriverInformation on Updating from Selenium 1 to Selenium 2.Backing Selenium with WebDriverThe Java and .NET versions of Selenium 2 provided implementations of the original Selenium APILegacy Firefox DriverThe legacy Firefox Driver was developed as a browser extension by the Selenium Developers. Firefox updated their security model, so it no longer works. You now need to use geckodriver.Selenium grid 2Selenium Grid 2 supported WebDriver and Selenium RC. It was replaced by Grid 3 which removed RC code. Grid 3 was completely rewritten for the new Grid 4.History of Grid PlatformsInformation for working with platform names in Grid 2.Remote WebDriver standalone serverWorking with the Standalone Server.Limitations of scaling up tests in Selenium 2Summary of additional constraints that arise when running Selenium2 in parallel.Stealing focus from Firefox in LinuxHow to work with Native Events in the Legacy Firefox extension.Untrusted SSL CertificatesDetails on how Selenium 2 accepted untrusted SSL certificatesWebDriver For Mobile BrowsersDescribes how Selenium 2 supported Android and iOS before Appium was createdFrequently Asked Questions for Selenium 2Items of interest for moving from Selenium 1 to Selenium 2Selenium 2.0 TeamThis is who you can blame for the Selenium 2 release.Last modified January 10, 2022: More wiki (#907) [deploy site] (adcf706a1ad)"
