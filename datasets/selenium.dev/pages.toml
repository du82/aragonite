full_description = "DownloadsBelow is where you can find the latest releases of all the Selenium components.You can also find a list of previous releases, source code, and additional information for Maven users.Selenium Clients and WebDriver Language BindingsIn order to create scripts that interact with the Selenium Server (Remote WebDriver) or create local Selenium WebDriver scripts, you need to make use of language-specific client drivers.While language bindings for other languages exist, these are the core ones that are supported by the main project hosted on GitHub..NET/C#Stable: 4.29.0 (February 20, 2025)ChangelogAPI DocsRubyStable: 4.29.0 (February 20, 2025)ChangelogAPI DocsJavaStable: 4.29.0 (February 20, 2025)ChangelogAPI DocsPythonStable: 4.29.0 (February 20, 2024)ChangelogAPI DocsJavaScriptStable: 4.29.0 (February 20, 2025)ChangelogAPI DocsSelenium Server (Grid)The Selenium Server is needed in order to run Remote Selenium WebDriver (Grid).Latest stable version 4.29.0To use the Selenium Server in a Grid configuration see the documentation.To run the Grid with popular browsers using Docker see the repository.To deploy the Grid to Kubernetes cluster see the Helm chart configuration.The Internet Explorer Driver ServerThis is required if you want to make use of the latest and greatest features of the WebDriver InternetExplorerDriver.Please make sure that this is available on your %PATH% in order for the IE Driver to work as expected.Download version 4.14.0.0 for:32 bit Windows IE (recommended)64 bit Windows IECHANGELOGSelenium IDESelenium IDE is a Chrome, Firefox and Edge plugin which records and plays back user interactions with the browser. Use this to either create simple scripts or assist in exploratory testing.Download latest released version for Chrome or Firefox or Edge. View the Release Notes.Download previous IDE versions.Selenium Nightly BuildsIf you need a bug fix or a feature that just landed on the codebase, or if you wish to test the next release before it is out, check the Selenium Nightly Builds.While we always strive to keep code in a releasable state, bugs or undocumented changes might be present when you use a nightly build..NET/C#Selenium.WebDriver & Selenium.SupportYou will need to authenticate to the GitHub NuGet registry, instructions can be seen at the GitHub documentation .RubyWebDriver & DevToolsYou will need to authenticate to the GitHub RubyGems registry, instructions can be seen at the GitHub documentation .PythonNightly builds are pushed to TestPyPI.JavaScriptselenium-webdriverYou will need to authenticate to the GitHub npm registry, instructions can be seen at the GitHub documentation .JavaWebDriver & GridTo use the Java SNAPSHOT versions, you will need to add the snapshot repository .C# NuGetNuget latest release is 4.29.0 Released on February 20, 2025.WebDriverSupportWebDriverBackedSelenium (Final version 4.1.0 Released on November 22, 2021)RC (Final version 3.1.0 Released on February 16, 2017)Previous ReleasesHere you can find a more complete list of Selenium releases.Previous Releases × NightlyRelease date: February 25, 2025 NameSizeselenium-java-4.30.0-SNAPSHOT.zip34.8 MBselenium-server-4.30.0-SNAPSHOT.jar40.3 MBselenium-server-4.30.0-SNAPSHOT.zip97.3 MB Selenium 4.29.0Release date: February 19, 2025 NameSizeselenium-dotnet-4.29.0.zip14.1 MBselenium-dotnet-strongnamed-4.29.0.zip14.1 MBselenium-java-4.29.0.zip34.8 MBselenium-server-4.29.0.jar40.3 MBselenium-server-4.29.0.zip97.3 MB Selenium 4.28.0Release date: January 20, 2025 NameSizeselenium-dotnet-4.28.0.zip12.8 MBselenium-dotnet-strongnamed-4.28.0.zip12.8 MBselenium-java-4.28.0.zip34.8 MBselenium-java-4.28.1.zip34.8 MBselenium-server-4.28.0.jar41.3 MBselenium-server-4.28.0.zip99.6 MBselenium-server-4.28.1.jar41.3 MBselenium-server-4.28.1.zip99.6 MB Selenium 4.27.0Release date: November 25, 2024 NameSizeselenium-dotnet-4.27.0.zip13.5 MBselenium-dotnet-strongnamed-4.27.0.zip13.5 MBselenium-java-4.27.0.zip35.2 MBselenium-server-4.27.0.ja