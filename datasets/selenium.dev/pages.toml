["https://www.selenium.dev/blog/2010/selenium-grid-1-0-8-released"]
title = "Selenium Grid 1.0.8 Released | Selenium"
description = "We’re pleased to announce the release of Selenium Grid 1.0.8"
full_description = "Selenium Grid 1.0.8 ReleasedWe’re pleased to announce the release of Selenium Grid 1.0.8By Kevin Menard (@nirvdrum) | Thursday, June 10, 2010Categories:ReleasesTags:SeleniumGridWe’re pleased to announce the release of Selenium Grid 1.0.8. This release fixes multithreaded issues with the Selenium Grid hub that appeared randomly under heavy load. If you’ve ever seen a log message about HttpClient being accessed by multiple threads, you definitely want to upgrade. Even if you haven’t, this release is highly recommended for all.You can download it now or view the changelog. The list of changes is:Multi-threaded issue with access to HttpClient has been resolved, fixing random crashes on a heavily loaded gridsMany thanks go out to Chris Gulley for identifying and fixing the problem. As always, patches and bug reports are appreciated:Code repositoryIssue trackerI mentioned in the release notes for 1.0.7 that barring any major issues, 1.1 would be the next release. This fix was major enough to warrant an intermediate release. We are still planning to put out 1.1 as the next feature release.If you have any questions about Selenium Grid, please use either the user or the developer list, as is most appropriate for the nature of your question. Ongoing discussion about grid development should take place on the developer list. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
