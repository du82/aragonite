["https://selenium.dev/ja/documentation/about/contributing"]
title = "Seleniumのサイトとドキュメントに貢献する | Selenium"
description = "Information on improving documentation and code examples for Selenium"
full_description = '''ドキュメントこのドキュメントについてSeleniumのサイトとドキュメントに貢献するv4.0Seleniumのサイトとドキュメントに貢献するInformation on improving documentation and code examples for Selenium Page being translated from English to Japanese. Do you speak Japanese? Help us to translate it by sending us pull requests!Seleniumは大きなソフトウェアプロジェクトであり、そのサイトとドキュメントは、物事の仕組みを理解し、その可能性を活用する効果的な方法を学ぶための鍵となります。このプロジェクトには、Seleniumのサイトとドキュメントの両方が含まれています。これは、Seleniumを効果的に使用する方法、Seleniumに参加する方法、およびSeleniumに貢献する方法に関する最新情報を提供するための継続的な取り組みです（特定のリリースを対象としていません）。サイトおよびドキュメントへの貢献は、以下のセクションで説明されているプロセスに従います。Seleniumプロジェクトは、皆様からのコントリビューションを歓迎します。 お手伝いをいただくには、いくつかの方法があります:イシュー報告新しい問題を報告したり、既存の問題についてコメントしたりするときは、議論がSeleniumソフトウェア、そのサイトおよび/またはドキュメントに関する具体的な技術問題に関連していることを確認してください。Seleniumのすべてのコンポーネントは、時間の経過とともに非常に速く変化するため、ドキュメントが古くなる可能性があります。 このようなケースを見つけた場合には、遠慮なくイシューを作成してください。 また、ドキュメントを最新の状態に更新する方法をご存知でしたら、関連する変更を含むプルリクエストを送ってしてください。見つかったものが問題であるかどうかわからない場合、https://selenium.dev/supportに記載されているコミュニケーション手段にて質問してください。What to Help WithCreating ExamplesExamples that need to be moved are marked with:Add ExampleWe want to be able to run all of our code examples in the CI to ensure that people can copy and paste and execute everything on the site. So we put the code where it belongs in the examples directory. Each page in the documentation correlates to a test file in each of the languages, and should follow naming conventions. For instance examples for this page https://www.selenium.dev/documentation/webdriver/browsers/chrome/ get added in these files:"/examples/java/src/test/java/dev/selenium/browsers/ChromeTest.java""/examples/python/tests/browsers/test_chrome.py""/examples/dotnet/SeleniumDocs/Browsers/ChromeTest.cs""/examples/ruby/spec/browsers/chrome_spec.rb""/examples/javascript/test/browser/chromeSpecificCaps.spec.js"Each example should get its own test. Ideally each test has an assertion that verifies the code works as intended. Once the code is copied to its own test in the proper file, it needs to be referenced in the markdown file.For example, the tab in Ruby would look like this: {{< tab header="Ruby" >}} {{< gh-codeblock path="/examples/ruby/spec/browsers/chrome_spec.rb#L8-L9" >}} {{< /tab >}} The line numbers at the end represent only the line or lines of code that actually represent the item being displayed. If a user wants more context, they can click the link to the GitHub page that will show the full context.Make sure that if you add a test to the page that all the other line numbers in the markdown file are still correct. Adding a test at the top of a page means updating every single reference in the documentation that has a line number for that file.Finally, make sure that the tests pass in the CI.Moving ExamplesExamples that need to be moved are marked with:Move CodeEverything from the Creating Examples section applies, with one addition.Make sure the tab includes text=true. By default, the tabs get formatted for code, so to use markdown or other shortcode statements (like gh-codeblock) it needs to be declared as text. For most examples, the tabpane declares the text=true, but if some of the tabs have code examples, the tabpane cannot specify it, and it must be specified in the tabs that do not need automatic code formatting.貢献Seleniumプロジェクトは新しいコントリビュータを歓迎します。目立った価値ある貢献を継続的に行った個人は コミッター として認められ、プロジェクトへのコミットアクセス件が与えられます。本ガイドでは、貢献のプロセスについて説明します。ステップ 1: フォークGitHub上のプロジェクトをフォークし、コピーをローカルにチェックアウトしてください。% git clone git@github.com:seleniumhq/seleniumhq.github.io.git % cd seleniumhq.github.io 依存関係: HugoWe use Hugo and the Docsy theme to build and render the site. You will need the “extended” Sass/SCSS version of the Hugo binary to work on this site. We recommend to use Hugo 0.125.4 .Please follow the Install Hugo instructions from Docsy.ステップ 2: ブランチの作成フィーチャーブランチを作成し、ハックを開始します。:% git checkout -b my-feature-branch 我々はHEADベースの開発を行っています。つまり、全ての変更はtrunkブランチ上に直接適用されます。ステップ 3: 変更を加えるThe repository contains the site and docs. Before jumping into making changes, please initialize the submodules and install the needed dependencies (see commands below). To make changes to the site, work on the website_and_docs directory. To see a live preview of your changes, run hugo server on the site’s root directory.% git submodule update --init --recursive % cd website_and_docs % hugo server See Style Guide for more information on our conventions for contributionステップ 4: コミットまず、gitがあなたの名前とメールアドレスを知っていることを確認してください:% git config --global user.name 'Santa Claus' % git config --global user.email 'santa@example.com' **適切なコミットメッセージを書くことは重要です。**コミットメッセージには、変更された内容、理由、修正されたイシューへの参照（ある場合）を記述する必要があります。作成するときは、次のガイドラインに従ってください。:最初の行は約50文字以下で、変更の簡単な説明を含める必要があります。2行目は空白のままにします。他のすべての行を72列で折り返します。Fixes #Nを含めてください。ここでは N がこのコミットで修正したイシュー番号です（存在する場合）。適切なコミットメッセージは次のようになります:explain commit normatively in one line Body of commit message is a few lines of text, explaining things in more detail, possibly giving some background about the issue being fixed, etc. The body of the commit message can be several paragraphs, and please do proper word-wrap and keep columns shorter than about 72 characters or so. That way `git log` will show things nicely even when it is indented. Fixes #141 最初の行はgit shortlogやgit log --onelineを実行した際に他人が最初に目にするため、意味のあるものでなければなりません。ステップ 5: リベースあなたの作業を同期するため、(git mergeではなく)git rebaseを時々実行してください。% git fetch origin % git rebase origin/trunk ステップ 6: テストあなたの変更が何も問題を起こしていないことを確認するため、常に忘れずにローカルサーバーの実行を行ってください。ステップ 7: プッシュ% git push origin my-feature-branch https://github.com/yourusername/seleniumhq.github.io.git を開き、_Pull Request_を押し、フォームを入力してください。 CLAに署名したことを示してください (ステップ7を参照)プルリクエストは通常数日以内にレビューされます。対応すべきコメントがある場合は、新しく(できれば fixupsで)コミットし、同じブランチにプッシュしてください。ステップ 8: 統合コードレビューが完了すると、コミッターがPRを取得し、リポジトリのtrunkブランチに統合します。 マスターブランチで履歴を線形に保持するのが好きなので、通常はブランチの履歴をスカッシュしてリベースします。コミュニケーションプロジェクトのコントリビューターおよびコミュニティ全体と交流する方法については、全て https://selenium.dev/support で詳細が記載されています。最終更新 August 27, 2024: update hugo version to 0.125.4 in contribute, to avoid build error (#1899) (00251f47fc1)'''
