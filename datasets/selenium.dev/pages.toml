title = "A Smattering of Selenium #25 | Selenium"
description = "A day late, but that sort of thing happens when you have family."
full_description = "A Smattering of Selenium #25A day late, but that sort of thing happens when you have family.By Adam Goucher (@adamgoucher) | Tuesday, August 31, 2010Categories:GeneralTags:SmatteringA day late, but that sort of thing happens when you have family.I keep telling myself I will document how to incorporate Se launching and result recording in QC, but never seem to find the excuse. Looks like Aaron found the excuse: Finding the API for a DLL, Connecting to HP/Mercury Quality Center from a client side scriptAlso from Aaron is a cool Credit Card Generator which has nice id tags which makes for easy Se parsing. Though I would argue that rather than open a new browser for this you send a URL get or similar, but this works as well.David continues to post about his employer’s ‘Elastic Build System’ in the context of Se-Grid in Nimble Test ClustersHaving had, and then mutually cancelling a book deal on Se, its a delight to see Overview of Selenium 1.0 Testing Tools: Beginner’s Guide now available in ‘beta’. Guess you need to finish it now, eh David?easy setup for your cucumber scenarios using headless gem run selenium your ci server is in the context of cucumber, but could be easily ported to other things I suspect.Another I-switch-to-Se2-and-liked-it post, this time from Ben at Switching from Selenium 1.x to WebDriver/Selenium 2 and HtmlUnithowfuckedismydatabase is just plain funny. And who of us hasn’t asked that very question – usually at some less than optimal timeThe September gathering of Chicago ALT.NET is on September 8 and is going to be on Selenium 101.3: Practical Functional Testing TechniquesTesting Flash With Selenium talks about the standard ExternalInterface stuff, but most important is the last sentence: So, if your app has less functions that needs to tested, you can use this approach, if not, testing manually will be the better option.. Just because you can, doesn’t mean you should (more insight into the life of Selenium consultant…)Another framework! This time it is Selena.An over-the-should problem-solution post on getting started with Se – FMK vs Selenium. Worth also checking out the ‘Modeling Portfolio’ for the, erm, interesting hairstyles he has tried on himselfSeems like Yeti and Se should work well together, though I can’t quite figure out why/how. And for those with small kids, the Yeti Stomp might also be familiar. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
