["https://selenium.dev"]
title = "Selenium"
description = """
Selenium automates browsers. That's it! What you do with that power is entirely up to you.
Primarily it is for automating web applications for testing purposes, but is certainly not limited to just that. Boring web-based administration tasks can (and should) also be automated as well. Getting Started Selenium WebDriver Selenium WebDriver If you want to create robust, browser-based regression automation suites and tests, scale and distribute scripts across many environments, then you want to use Selenium WebDriver, a collection of language specific bindings to drive a browser - the way it is meant to be driven."""
full_description = "Selenium automates browsers. That's it!What you do with that power is entirely up to you.Primarily it is for automating web applications for testing purposes, but is certainly not limited to just that.Boring web-based administration tasks can (and should) also be automated as well.Getting Started.cls-selenium_webdriver{fill:#cf0a2c}Selenium WebDriverSelenium WebDriverIf you want to create robust, browser-based regression automation suites and tests, scale and distribute scripts across many environments, then you want to use Selenium WebDriver, a collection of language specific bindings to drive a browser - the way it is meant to be driven.Read more .cls-selenium_ide{fill:#0033a0}Selenium IDESelenium IDEIf you want to create quick bug reproduction scripts, create scripts to aid in automation-aided exploratory testing, then you want to use Selenium IDE; a Chrome, Firefox and Edge add-on that will do simple record-and-playback of interactions with the browser.Read more .cls-selenium_grid{fill:#645d9c}Selenium GridSelenium GridIf you want to scale by distributing and running tests on several machines and manage multiple environments from a central point, making it easy to run the tests against a vast combination of browsers/OS, then you want to use Selenium Grid.Read more Development PartnersSelenium Level SponsorsNewsSelenium Community Live - Episode 2Tuesday, January 21, 2025By Pallavi SharmaSelenium Community Live - Episode 2Read More Selenium 4.28 Released!Monday, January 20, 2025By Diego Molina @diemolToday we’re happy to announce that Selenium 4.28 has been released!Read More Selenium Community Live - Episode 1Wednesday, December 25, 2024By Pallavi SharmaSelenium Community Live - Episode 1Read More More news Support the Selenium ProjectLearn more or view the full list of sponsors.Learn more Donate to Seleniumthrough Open Collective"
