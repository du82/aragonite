["https://selenium.dev/documentation/grid/configuration/help"]
title = "Configuration help | Selenium"
description = "Get information about all the available options to configure Grid."
full_description = "DocumentationGridConfigurationHelpv4.0Configuration helpGet information about all the available options to configure Grid.The help commands display information based on the current code implementation. Hence, it will provide accurate information in case the documentation is not updated. It is the easiest way to learn about Grid 4 configuration for any new version.Info CommandThe info command provides detailed docs on the following topics:Configuring SeleniumSecuritySession Map setupTracingConfig helpQuick config help and overview is provided by running:java -jar selenium-server-<version>.jar info config SecurityTo get details on setting up the Grid servers for secure communication and node registration:java -jar selenium-server-<version>.jar info security Session Map setupBy default, Grid uses a local session map to store session information. Grid supports additional storage options like Redis and JDBC - SQL supported databases. To set up different session storage, use the following command to get setup steps:java -jar selenium-server-<version>.jar info sessionmap Setting up tracing with OpenTelemetry and JaegerBy default, tracing is enabled. To export traces and visualize them via Jaeger, use the following command for instructions:java -jar selenium-server-<version>.jar info tracing List the Selenium Grid commandsjava -jar selenium-server-<version>.jar --config-help It will show all the available commands and description for each one.Component help commandsPass –help config option after the Selenium role to get component-specific config information.Standalonejava -jar selenium-server-<version>.jar standalone --help Hubjava -jar selenium-server-<version>.jar hub --help Sessionsjava -jar selenium-server-<version>.jar sessions --help New Session Queuejava -jar selenium-server-<version>.jar sessionqueue --help Distributorjava -jar selenium-server-<version>.jar distributor --help Routerjava -jar selenium-server-<version>.jar router --help Nodejava -jar selenium-server-<version>.jar node --help Last modified December 7, 2021: reorganize documentation and update titles (#861) [deploy site] (872174bfdd8)"
