full_description = "DocumentationWebDriverv4.0WebDriverWebDriver drives a browser natively; learn more about it.WebDriver drives a browser natively, as a user would, either locally or on a remote machine using the Selenium server. It marks a leap forward in terms of browser automation.Selenium WebDriver refers to both the language bindings and the implementations of the individual browser controlling code. This is commonly referred to as just WebDriver.Selenium WebDriver is a W3C RecommendationWebDriver is designed as a simple and more concise programming interface.WebDriver is a compact object-oriented API.It drives the browser effectively.Getting startedIf you are new to Selenium, we have a few resources that can help you get up to speed right away.Driver SessionsSupported BrowsersWaiting StrategiesWeb elementsIdentifying and working with element objects in the DOM.Browser interactionsActions APIA low-level interface for providing virtualized device input actions to the web browser.BiDirectional functionalitySupport featuresSupport classes provide optional higher level features.Troubleshooting AssistanceHow to solve WebDriver problems.Last modified November 7, 2024: Rephrase/reformat a few sentences (#1981) (77ae509e3ca)"
