["https://selenium.dev/blog/2010/selenium-grid-1-0-6-released"]
title = "Selenium Grid 1.0.6 Released | Selenium"
description = "Following up on the Selenium Grid 1.0.5 release, we’re pleased to announce the release of Selenium Grid 1.0.6"
full_description = "Selenium Grid 1.0.6 ReleasedFollowing up on the Selenium Grid 1.0.5 release, we’re pleased to announce the release of Selenium Grid 1.0.6By Kevin Menard (@nirvdrum) | Tuesday, April 13, 2010Categories:ReleasesTags:SeleniumGridFollowing up on the Selenium Grid 1.0.5 release, which added self-healing features to ease grid management, we’re pleased to announce the release of Selenium Grid 1.0.6. This is a bug fix release for 1.0.5 with some minor new additions.You can download it now or view the changelog. The summary of changes are:Fixed some concurrent modification issues that may have resulted in NullPointerExceptionsFixed issue with shutting down workers with RakefileAdded PID file support for hub and worker started via Rakefile, making it easier to use a process monitor such as monitIn case you missed the announcement, Philippe is no longer maintaining Selenium Grid. We thank him for his years of effort and helping the project get to where it is today. This is my first release as the new Selenium Grid maintainer. I will be getting out a new post shortly that lays out the future for the project [UPDATE: The promised post is live]. In the meanwhile, please note the new location of several key resources:Code repositoryIssue trackerIf you have any questions about Selenium Grid, please use either the user or the developer list, as is most appropriate for the nature of your question. Ongoing discussion about grid development should take place on the developer list. We look forward to hearing what you think about how we can improve the project. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
