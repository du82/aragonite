["https://selenium.dev/blog/2010/a-smattering-of-selenium-23"]
title = "A Smattering of Selenium #23 | Selenium"
description = "I was at Agile 2010 in Orlando last week so missed doing the Smattering, so here is two weeks worth of links."
full_description = "A Smattering of Selenium #23I was at Agile 2010 in Orlando last week so missed doing the Smattering, so here is two weeks worth of links.By Adam Goucher (@adamgoucher) | Monday, August 16, 2010Categories:GeneralTags:SmatteringI was at Agile 2010 in Orlando last week so missed doing the Smattering, so here is two weeks worth of links.There is crazy amounts of power hiding in that there JUnit 4 library – such as @Rule. One usage of them is described here. A useful pattern indeed when doing something like BDD or ATDDThe next SFSE has been announced; August 24 at LinkedIn. Se creator Jason Huggins will be fielding questions in a Q&A session on steroids.While on topic of meetups, Dawn will be presenting about Selenesse at Agile Carolinas also on the 24thiCheckWebsite is an accessibility monitoring site which is a niche that I haven’t seen exploited yet. What is interesting is their checklist of what they check for. Looks like a great start for a suite of Se tests.Se plays a large part in Continuous Deployment setups, but what I am really interested in is Continuous Delivery. Jez (who literally wrote the book on it) explains the difference between the two.One of the better sessions I went to at Agile last week was Mountains to Molehills: A Story of QA that featured some Se content so gets included here.Setting up flex testing with selenium – with Selenium Flex API and FlashSeleniumSelenium 2/Web Driver – the land where Page Objects are king! is the winner of the ‘most twitter love for the last two weeks’ award.Samit continues to churn out plugins for Se-IDE, this time with the Log Search Bar PluginThe Bromine kids have released a bit of a case study on the Roskilde Festival and CI in Continuous integration of the orange feelingOoo! A completely useless tool competition! – Vote Selenium!Web Automation Framework claims to integrate Selenium, TestNG, ReportNG, SimpleXML, Java, Sikuli, Flash-selenium — which is an interesting fruit salad as it lists apples, oranges, bananas and pears when comparing things.I hate to pimp my own stuff, but Six Shocking Automation Truths did fairly well from page view perspective. It even spawned a well thought out response/reaction.Again, sorry to have my stuff in here, but if you are wondering what Page Objects are (and how to implement them in Python) then my article Page Objects in Python from the August issue of PragPub is what you need.Managing Se-Grid machines is a pain (which is why you have companies like Sauce Labs coming into the fray. Another option is to use Copper from GridCentric to have Elastic Build SystemsOne of the Se 2a6 new features was the Web Timings API which David experiments with in Automating the Capture of Web Timings with Selenium 2Parallelism is kinda (but not really) solved by Se-Grid, but when you start specing out machines, do you need more threads or cores – and do you know the difference?Robot Framework is growing Flash/Flex support; the status of which can be see in this email from the flex-pilot mailing list PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
