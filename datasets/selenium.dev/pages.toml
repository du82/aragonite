["https://selenium.dev/blog/2010/a-smattering-of-selenium-29"]
title = "A Smattering of Selenium #29 | Selenium"
description = "A fair number of links this week. The vast majority of which were buried in annoying airport internet advertising frames…"
full_description = "A Smattering of Selenium #29A fair number of links this week. The vast majority of which were buried in annoying airport internet advertising frames…By Adam Goucher (@adamgoucher) | Monday, October 04, 2010Categories:GeneralTags:SmatteringA fair number of links this week. The vast majority of which were buried in annoying airport internet advertising frames…This looks like it is Spanish which would normally mean it doesn’t get included but it Integração Selenium e Testlink explains how to integrate Se with TestLink. We, as a community, need to document this sort of thing more.JUnit 4 Vs TestNG is a somewhat biased comparison between JUnit 4 and TestNG; but useful none the less.Hot on the heels of last week’s SFSE is the announcment of Learn to Test Your SproutCore Apps with Lebowski Framework for the month of October.Behaviour Driven Development With JBehave Web 3, Selenium and Maven 2 on OS X Snow Leopard is, aside from very buzzword compliant, the first thing I’ve seen using Se and JBehave.Bi-Testual: Coming out of the Software Closet is something a lot of people in automation grapple with. Am I a tester who programs? A programmer who tests? Something entirely new?Using Selenese and want to use Sauce OnDemand? Absolute Beginners Guide to Running Sauce RC with HTML Scripts is for you.While combing the Sauce Labs blog, I noticed my How To Minimize The Pain Of Locator Breakage has been published.Page Objects are ‘in’ to say the least these days. Writing page based tests with selenium in ruby is just enough to get you down the path of page objects in ruby.And because we can’t have only one post on Page Objects, Step-by-step selenium tests with page objects, dsl and fun! is in GroovyCheatsheet: Creating mocks in PHPUnit could be useful for those who write Se scripts in PHPThe talks for GTAC 2010 have been announced. I don’t know what the pool of talks they pulled from was like, but I’m underwhelmedI have no idea where SeleniumWiki came from, but there is a fair bit of content there. Not sure how much is original and how much is lifted from other places on the internets — the spidey sense tingles when the title says ‘VB Code’ which seems to imply it is an SEO hunting site.Martin Fowler’s DSL book is out Real Soon Now and the first chapter is available online. Most people have been saying ‘build a DSL for your scripts’ for awhile — now we’ll see just how off all our definitions of that were.getXpathCount is one of the more powerful commands in Se, but the bulk of people use it ‘wrong’. Effectively using Selenium’s getXpathCount function starts to address that problem. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
