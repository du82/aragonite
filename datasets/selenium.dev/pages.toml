full_description = "Selenium automatiza navegadores. É isso!O que você fará com esse poder é inteiramente consigo.O uso mais normal é automatizar testes para aplicativos web, mas não está limitado a apenas isso.Tarefas aborrecidas de administração baseadas em web também podem (e devem) ser automatizadas.Welcome!Note: only the documentation is translated to Português (Brasileiro). The rest of the website is in English.We have an official translator for this language, but check our contribution guidelines if you’d like to help.Getting Started.cls-selenium_webdriver{fill:#cf0a2c}Selenium WebDriverSelenium WebDriverSe pretende criar um conjunto de testes de automação para regressão, testes, distribuir scripts por muitos ambientes, então quererá usar Selenium WebDriver, um conjunto de ‘bindings’ específicos para várias linguagens para ‘conduzir’ um navegador web, da forma que foi concebido.Read more .cls-selenium_ide{fill:#0033a0}Selenium IDESelenium IDECaso queira criar scripts rápidos para reproduzir bugs, ajudar na automação de testes exploratórios, então quererá usar Selenium IDE, um extra para os navegadores Firefox, Chrome e Edge. Com Selenium IDE irá conseguir gravar e reproduzir interacções com o navegador.Read more .cls-selenium_grid{fill:#645d9c}Selenium GridSelenium GridSe pretende escalar, distribuir e correr testes em várias máquinas e gerir vários ambientes a partir de uma localização central, simplificando a gestão dos testes com várias combinações de sistemas operativos e navegadores, então quererá usar a Selenium Grid.Read more Development PartnersSelenium Level SponsorsNewsMore news Support the Selenium ProjectLearn more or view the full list of sponsors.Learn more Donate to Seleniumthrough Open Collective"
