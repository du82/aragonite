["https://selenium.dev/zh-cn/documentation"]
title = "Selenium 浏览器自动化项目 | Selenium"
description = '''
Selenium 是支持 web 浏览器自动化的一系列工具和库的综合项目。
它提供了扩展来模拟用户与浏览器的交互，用于扩展浏览器分配的分发服务器， 以及用于实现 W3C WebDriver 规范 的基础结构， 该 规范 允许您为所有主要 Web 浏览器编写可互换的代码。
这个项目是由志愿者贡献者实现的，他们投入了自己数千小时的时间， 并使源代码免费提供给任何人使用、享受和改进。
Selenium 汇集了浏览器供应商，工程师和爱好者，以进一步围绕 Web 平台自动化进行公开讨论。 该项目组织了一次年度会议，以教学和培养社区。
Selenium 的核心是 WebDriver，这是一个编写指令集的接口，可以在许多浏览器中互换运行。 这里有一个最简单的说明：
Java Python CSharp Ruby JavaScript Kotlin package dev.selenium.hello; import org.openqa.selenium.WebDriver; import org.openqa.selenium.chrome.ChromeDriver; public class HelloSelenium { public static void main(String[] args) { WebDriver driver = new ChromeDriver(); driver.get("https://selenium.dev"); driver.quit(); } } View full example on GitHub from selenium import webdriver driver = webdriver.Chrome() driver.get("http://selenium.dev") driver.'''
full_description = '''文档v4.0Selenium 浏览器自动化项目Selenium 是支持 web 浏览器自动化的一系列工具和库的综合项目。它提供了扩展来模拟用户与浏览器的交互，用于扩展浏览器分配的分发服务器， 以及用于实现 W3C WebDriver 规范 的基础结构， 该 规范 允许您为所有主要 Web 浏览器编写可互换的代码。这个项目是由志愿者贡献者实现的，他们投入了自己数千小时的时间， 并使源代码免费提供给任何人使用、享受和改进。Selenium 汇集了浏览器供应商，工程师和爱好者，以进一步围绕 Web 平台自动化进行公开讨论。 该项目组织了一次年度会议，以教学和培养社区。Selenium 的核心是 WebDriver，这是一个编写指令集的接口，可以在许多浏览器中互换运行。 这里有一个最简单的说明： Java Python CSharp Ruby JavaScript Kotlinpackage dev.selenium.hello; import org.openqa.selenium.WebDriver; import org.openqa.selenium.chrome.ChromeDriver; public class HelloSelenium { public static void main(String[] args) { WebDriver driver = new ChromeDriver(); driver.get("https://selenium.dev"); driver.quit(); } } View full example on GitHubfrom selenium import webdriver driver = webdriver.Chrome() driver.get("http://selenium.dev") driver.quit() View full example on GitHubusing OpenQA.Selenium.Chrome; namespace SeleniumDocs.Hello; public static class HelloSelenium { public static void Main() { var driver = new ChromeDriver(); driver.Navigate().GoToUrl("https://selenium.dev"); driver.Quit(); } } View full example on GitHubrequire 'selenium-webdriver' driver = Selenium::WebDriver.for :chrome driver.get 'https://selenium.dev' driver.quit View full example on GitHubconst {Builder, Browser} = require('selenium-webdriver'); (async function helloSelenium() { let driver = await new Builder().forBrowser(Browser.CHROME).build(); await driver.get('https://selenium.dev'); await driver.quit(); })(); View full example on GitHubpackage dev.selenium.hello import org.openqa.selenium.chrome.ChromeDriver fun main() { val driver = ChromeDriver() driver.get("https://selenium.dev") driver.quit() } View full example on GitHub请参阅 概述 以检查不同的项目组件, 并确定Selenium是否适合您.您应该继续阅读 开始, 以了解如何安装Selenium, 将其成功用作测试自动化工具, 并将这样的简单测试扩展为 在大型分布式环境, 以及不同操作系统上的环境上 运行多个浏览器的测试.概述Selenium适合你吗? 请参见不同项目组件的概述.WebDriverWebDriver以原生的方式驱动浏览器; 在此了解更多内容.Selenium Manager (Beta)Selenium Manager is a command-line tool implemented in Rust that provides automated driver and browser management for Selenium. Selenium bindings use this tool by default, so you do not need to download it or add anything to your code or do anything else to use it.Grid要在多台计算机上并行运行测试吗? 那么, Grid正是为你准备的.IE驱动服务器Internet Explorer驱动是一种实现WebDriver规范的单机服务器.Selenium IDESelenium IDE是一个记录和回放用户操作的浏览器扩展.鼓励的行为Selenium项目的一些测试指南和建议.Legacy在此部分，您可以找到与Selenium的旧组件有关的所有文档. 这样做纯粹是出于历史原因，而不是鼓励使用已废弃的组件.关于这个文档最后修改 September 10, 2024: Transparent png favicons (#1937)[deploy site] (03705be0833)'''
