title = "Selenium"
description = """
Selenium automates browsers. That's it! What you do with that power is entirely up to you.
Primarily it is for automating web applications for testing purposes, but is certainly not limited to just that. Boring web-based administration tasks can (and should) also be automated as well. Welcome! Only documentation gets translated into other languages. The rest of the website will remain in English.
Is there another translation you’d like to see?"""
full_description = "Selenium automates browsers. That's it!What you do with that power is entirely up to you.Primarily it is for automating web applications for testing purposes, but is certainly not limited to just that.Boring web-based administration tasks can (and should) also be automated as well.Welcome!Only documentation gets translated into other languages. The rest of the website will remain in English.Is there another translation you’d like to see? We’re only supporting translations for which we have a dedicated translator. If you’d like to volunteer to be a translator, read how you can help. ×Getting Started.cls-selenium_webdriver{fill:#cf0a2c}Selenium WebDriverSelenium WebDriverIf you want to create robust, browser-based regression automation suites and tests, scale and distribute scripts across many environments, then you want to use Selenium WebDriver, a collection of language specific bindings to drive a browser - the way it is meant to be driven.Read more .cls-selenium_ide{fill:#0033a0}Selenium IDESelenium IDEIf you want to create quick bug reproduction scripts, create scripts to aid in automation-aided exploratory testing, then you want to use Selenium IDE; a Chrome, Firefox and Edge add-on that will do simple record-and-playback of interactions with the browser.Read more .cls-selenium_grid{fill:#645d9c}Selenium GridSelenium GridIf you want to scale by distributing and running tests on several machines and manage multiple environments from a central point, making it easy to run the tests against a vast combination of browsers/OS, then you want to use Selenium Grid.Read more Development PartnersSelenium Level SponsorsNewsMore news Support the Selenium ProjectLearn more or view the full list of sponsors.Learn more Donate to Seleniumthrough Open Collective"
