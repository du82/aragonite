["https://selenium.dev/documentation/legacy/selenium_2/firefox_driver"]
title = "Legacy Firefox Driver | Selenium"
description = "The legacy Firefox Driver was developed as a browser extension by the Selenium Developers. Firefox updated their security model, so it no longer works. You now need to use geckodriver."
full_description = 'DocumentationLegacySelenium 2Firefox DriverLegacy Code!Legacy Firefox DriverThe legacy Firefox Driver was developed as a browser extension by the Selenium Developers. Firefox updated their security model, so it no longer works. You now need to use geckodriver.This documentation previously located on the wikiYou can read more about geckodriver.AboutFirefox driver is included in the selenium-server-stanalone.jar available in the downloads. The driver comes in the form of an xpi (firefox extension) which is added to the firefox profile when you start a new instance of FirefoxDriver.ProsRuns in a real browser and supports JavascriptFaster than the InternetExplorerDriverConsSlower than the HtmlUnitDriverImportant System PropertiesThe following system properties (read using System.getProperty() and set using System.setProperty() in Java code or the “-DpropertyName=value” command line flag) are used by the FirefoxDriver:PropertyWhat it meanswebdriver.firefox.binThe location of the binary used to control firefox.webdriver.firefox.marionetteBoolean value, if set on standalone-server will ignore any “marionette” desired capability requested and force firefox to use GeckoDriver (true) or Legacy Firefox Driver (false)webdriver.firefox.profileThe name of the profile to use when starting firefox. This defaults to webdriver creating an anonymous profilewebdriver.firefox.useExistingNever use in production Use a running instance of firefox if one is presentwebdriver.firefox.logfileLog file to dump firefox stdout/stderr toNormally the Firefox binary is assumed to be in the default location for your particular operating system:OSExpected Location of FirefoxLinuxfirefox (found using “which”)Mac/Applications/Firefox.app/Contents/MacOS/firefox-binWindows%PROGRAMFILES%\Mozilla Firefox\firefox.exeBy default, the Firefox driver creates an anonymous profileRunning with firebugDownload the firebug xpi file from mozilla and start the profile as follows: File file = new File("firebug-1.8.1.xpi"); FirefoxProfile firefoxProfile = new FirefoxProfile(); firefoxProfile.addExtension(file); firefoxProfile.setPreference("extensions.firebug.currentVersion", "1.8.1"); // Avoid startup screen WebDriver driver = new FirefoxDriver(firefoxProfile); FirefoxDriver Internals(Previously located: https://github.com/SeleniumHQ/selenium/wiki/FirefoxDriver-Internals)The FirefoxDriver is largely written in the form of a Firefox extension. Language bindings control the driver by connecting over a socket and sending commands (described in the JsonWireProtocol page) in UTF-8. The extension makes use of the XPCOM primitives offered by Firefox in order to do its work. The important thing to notice is that the command names map directly on to methods exposed on the “FirefoxDriver.prototype” in the javascript code.Working on the FirefoxDriver CodeFirstly, make sure that there’s no old version of the FirefoxDriver installed:Start firefox’s profile manager: firefox -ProfileManagerDelete the existing WebDriver profile if there is one. Delete the files too (it’s an option that’s offered when you delete the profile in the profile manager)Secondly, take a look at the Mozilla Developer Center, particularly the section to do with setting up an extension development environment. You should now be ready to edit code. It’s best to create a test around the area of code that you’re working on, and to run this using the SingleTestSuite. The FirefoxDriver logs errors to Firefox’s error console (“Tools->Error Console”), so if a test fails, that’s a great place to start looking.To actually log information to the console, use the “Utils.dumpn()” method in your javascript code. If you find that you’d like to examine an object in detail, use the “Utils.dump()” method, which will report which interfaces an object implements, as well as outputting as much information as it can to the console..Flow of Control: Starting FirefoxThe following steps are performed when instantiating an instance of the FirefoxDriver:Grab the “locking port”Last modified January 10, 2022: More wiki (#907) [deploy site] (adcf706a1ad)'
