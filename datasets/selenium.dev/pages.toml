["https://www.selenium.dev/blog/2024/selenium-community-live-episode1"]
title = "Selenium Community Live - Episode 1 | Selenium"
description = "Selenium Community Live - Episode 1"
full_description = "Selenium Community Live - Episode 1Selenium Community Live - Episode 1By Pallavi Sharma | Wednesday, December 25, 2024Categories:WebinarTags:WebinarMeetupTalksCommunityAt the eve of celebration of 20 years of Selenium, the current Project Leadership Committee of Selenium decided on starting Selenium Community Live event, an idea helmed by Maaret Pyhäjärvi . The first episode happened on Dec 18th, 2024: Selenium Community Live - Episode 1Selenium Community Live - Episode 1Collaboration, communication and community are the force behind the success of the Selenium Project in open source for last twenty years. Jason Huggins and Simon Stewart with their respective projects Selenium and WebDriver collaborated and brought together Selenium WebDriver. Eventually WebDriver became a W3C standard for browser automation, and Jim Evans and Manoj Kumar in the first episode of Selenium Community Live discuss all about Selenium, and making of the WebDriver standard. They shed light on the process and people behind building these specifications. They also spoke about various browser vendors and browser automation projects coming together to collaborate on making the next standard in browser automation WebDriver Bi-Di. The Selenium project extend thanks to both Jim and Manoj for commemorating the first episode for community.Meet the Speakers:Jim EvansManoj KumarWatch the Recording the first Episode of Selenium Community LiveCouldn’t join us live? Watch the entire episode here - 📹 Recording Link: Watch the Event Recording on YouTubeThe links for the various projects which were discussed in the event -A few links which you may wish to explore - TPACW3C Browser Testing Working GroupWebDriverWebDriver Bi-DiWebDriver Bi-Di .net implementation by Jim EvansStay tuned as we bring the next! Subscribe here to the Selenium HQ Official YouTube Channel. PreviousNext Last modified December 26, 2024: added blog for community live episode 1 (#2112) (ef7d1c6a5a1)"
