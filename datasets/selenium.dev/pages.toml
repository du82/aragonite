title = "A Smattering of Selenium #26 | Selenium"
description = "It’s Labour Day here, so this post was written to backdrop of Sponge Bob."
full_description = "A Smattering of Selenium #26It’s Labour Day here, so this post was written to backdrop of Sponge Bob.By Adam Goucher (@adamgoucher) | Monday, September 06, 2010Categories:GeneralTags:SmatteringIt’s Labour Day here, so this post was written to backdrop of Sponge Bob. In case you were wondering.selenium-java-evidence appears to be another logging framework, this time with an emphasis on auditability. Personally, the reports from a CI server should be all that are required, but to each their own…taza is an opinionated browser-based test frameworkwebdry is a Python (jquery-inspired) wrapper for DRY:er access to the Selenium WebDriverSelf-testing AppEngine apps with Saucelabs seems like a cool little (if very low level) trick to using Se inside AppEngineSauce Labs released their Getting Started With Selenium guide and is looking for feedback on itNeed to interact with a web service during a BrowserMob run? Hybrid BrowserMob Scripts explains how to do it.Self-Verifying Page Objects is Patrick Wilson-Welsh’s first post in the series patterns that made up his and Dawn‘s Agile 2010 session.Felipe is starting to explore Se and TestNG (which is timely for me) starting with Using TestNG to launch your tests (and the Selenium server)Hudson create Kohsuke Kawaguchi did a webinar for Sauce Labs on using Hudson with their OnDemand service that was recorded. I haven’t watched it yet, but it looks like it has general Hudson and Se information as well.Se’s CSS support got and overhaul this week as Sizzle replaces CSSQuery as the way of finding things via the CSS locator. Sizzle is the CSS engine that powers JQuery.JBehave 3.0 has been released – for those who use itSimon wrote another technical piece on some of the inner workings for Se2 in Going Atomic: How PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
