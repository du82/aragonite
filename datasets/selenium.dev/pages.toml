["https://www.selenium.dev/blog/2025/selenium-4-28-released"]
title = "Selenium 4.28 Released! | Selenium"
description = "Today we're happy to announce that Selenium 4.28 has been released!"
full_description = "Selenium 4.28 Released!Today we’re happy to announce that Selenium 4.28 has been released!By Diego Molina @diemol | Monday, January 20, 2025Categories:ReleasesTags:SeleniumWe’re very happy to announce the release of Selenium 4.28 for Javascript, Ruby, Python, .NET, Java and the Grid! Links to everything can be found on our downloads page.HighlightsChrome DevTools support is now: v132, v131, and v130 (Firefox still uses v85 for all versions)Expanded nullability annotations for better type safety in .NET and Java.Refinements to Selenium Grid, including more efficient session handling and node management.Packaging and installation enhancements across Python and Ruby for smoother integration.Documentation improvements across Python and .NET libraries, ensuring clearer developer guidance.Updated language-specific implementations for modern development standards.Changes by LanguageJavaEncapsulation Improvements: Encapsulated additionalCommands with a getter method (#14816).Nullability Enhancements: Added nullness annotations for enums, exceptions, interactions, logging, and Proxy (#15105, #15094).SpotBugs Updates: Excluded specific warnings to maintain clean code (#14766).Improved Logging: Enhanced error handling and message clarity in exceptions (#15116).Relative Locators: Updates for RelativeBy locators, simplifying usage (#14482).PythonPackaging Fixes: Addressed issues for smoother installation (#14806, #14823).Documentation Upgrades: Added comprehensive docstrings to multiple classes, including WebDriverWait, ExpectedConditions, and WebElement (#15077, #15096).Refactoring: Moved project metadata and improved code organization (#14837).Enhanced CDP Command Handling: Added execute_cdp_cmd to Remote (#14809).JavaScriptFederated Credential Management Support: Introduced support for Federated Credential Management, enhancing authentication capabilities. (#15008)Node.js Version Specification: The minimum required Node.js version has been specified as 18.20.5.Improved Logging: Added detailed error messages for invalid cookie name validation in getCookie and deleteCookie methods, aiding in debugging.Diagnostic Logging for Safari: Enabled diagnostic logging for Safari, facilitating better issue tracking and resolution..NETNullability Improvements: Added annotations to SessionId, Alert, CookieJar, Logs API, and more (#14840, #14874).Refactored DevTools: Modernized code style and enhanced JSON parsing (#14990).Future-Proofing: Added notes and deprecated setters for better immutability (#15107).Testing Updates: Migrated NUnit assertions to modern syntax (#14870).RubyBiDi Network Enhancements: Added request handlers for authentication and interception (#14751).Cookie Management Updates: Added tests and improved handling for cookies (#14843).GridImproved Session Management: Enhanced slot matching and session queue handling (#14914).Dynamic Grid Enhancements: Added video recording capabilities on browser node (#15047).Reliability Boost: Improved HTTP request retries and node health checks (#14924).Docker SeleniumUpdate procedure to install Firefox in Node/Standalone Firefox (#2550)Enable video recorder in Node/Standalone containers (#2539)Env var SE_ENABLE_TRACING=false is not required when starting the container anymore (#2549)Env var SE_NODE_PLATFORM_NAME & SE_NODE_BROWSER_VERSION to adjust default Node stereotypes for autoscaling (#2520, #2525)Selenium Grid scaler in KEDA improvements (KEDA#6437, KEDA#6477)See all changesWe thank all our contributors for their incredible efforts in making Selenium better with every release. ❤️For a detailed look at all changes, check out the release notes.ContributorsSpecial shout-out to everyone who helped the Selenium Team get this release out!Selenium@AdamPDottyDinesh Kumar R A@DineshKumarRAMustafaAgamy@MustafaAgamyDennis Oelkers@dennisoelkersAlex@iampopovichLauro Moura@lauromoura@mk868Navin Chandra@navin772Simon Benzer@shbenzerSelenium Docs & WebsiteSwastik Baranwal@Delta456Jason Ren@jasonren0403Navin Chandra@navin772Pallavi@pallavigitwork@praveenmarSimon Benzer@shbenzerVinaysimha Varma Yadavali@yvsvarmaDocker SeleniumAvivGuiser@KyriosGN0@jbolsens-legion@joshfngSelenium Team MembersThanks as well to all the team members who contributed to this release:Augustin Gottlieb@aguspeDavid Burns@AutomatedTesterBoni García@bonigarciaDiego Molina@diemolSri Harsha@harsha509@joerg1985Nikolay Borisenko@nvborisenkoAlex Rodionov@p0dejePuja Jagani@pujaganiMichael Render@RenderMichaelSimon Stewart@shs96cTitus Fortner@titusfortnerViet Nguyen Duc@VietND96Stay tuned for updates by following SeleniumHQ on:MastodonBlueSkyLinkedInSelenium Community YouTube ChannelX (Formerly Twitter)Happy automating! PreviousNext Last modified January 22, 2025: [blog] include js changelog in 4.28.x blog [deploy site] (626aefb6041)"
