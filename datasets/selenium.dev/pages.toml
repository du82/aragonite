title = "Sobre esta documentação | Selenium"
description = """
Essa documentação, como o próprio código, são mantidos 100% por voluntários dentro da comunidade Selenium. Muitos têm usado desde o seu início, mas muitos mais o usam há pouco tempo, e dedicaram seu tempo para ajudar a melhorar a experiência de integração para novos usuários.
Se houver algum problema com a documentação, queremos saber! A melhor maneira de comunicar um problema é visitar https://github.com/seleniumhq/seleniumhq.github.io/issues e pesquise se o problema já foi ou não arquivado."""
full_description = "DocumentaçãoSobre esta documentaçãov4.0Sobre esta documentaçãoEssa documentação, como o próprio código, são mantidos 100% por voluntários dentro da comunidade Selenium. Muitos têm usado desde o seu início, mas muitos mais o usam há pouco tempo, e dedicaram seu tempo para ajudar a melhorar a experiência de integração para novos usuários.Se houver algum problema com a documentação, queremos saber! A melhor maneira de comunicar um problema é visitar https://github.com/seleniumhq/seleniumhq.github.io/issues e pesquise se o problema já foi ou não arquivado. Se não, fique à vontade para abrir um!Muitos membros da comunidade frequentam o canal Libera #selenium em Libera.chat. Sinta-se à vontade para entrar e fazer perguntas e se você receber ajuda que você acha que poderia ser útil nessa documentação, certifique-se de adicionar sua contribuição! Podemos atualizar essa documentação, mas é muito mais fácil para todos quando recebemos contribuições de fora dos committers normais.Direitos autorais e atribuiçõesCopyright, contributions and all attributions for the different projects under the Selenium umbrella.Contribuindo com o Site e Documentação do SeleniumInformações em como melhorar a documentação e exemplos de código para Selenium.Style guide for Selenium documentationConventions for contributions to the Selenium documentation and code examplesÚltima modificação December 7, 2021: reorganize documentation and update titles (#861) [deploy site] (872174bfdd8)"
