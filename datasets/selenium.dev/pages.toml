["https://selenium.dev/documentation/legacy/developers/crazy_fun_build"]
title = "Crazy Fun Build Tool | Selenium"
description = 'The original Selenium Build Tool that grew from nothing to be extremely unwieldy, making it both crazy and "fun" to work with.'
full_description = '''DocumentationLegacyDevelopersCrazy FunLegacy Code!Crazy Fun Build ToolThe original Selenium Build Tool that grew from nothing to be extremely unwieldy, making it both crazy and “fun” to work with.This documentation previously located on the wikiWebDriver is a large project: if we tried to push everything into a single monolithic build file it eventually becomes unmanageable. We know this. We’ve tried it. So we broke the single Rakefile into a series of build.desc files. Each of these describe a part of the build.Let’s take a look at a build.desc file. This is part of the main test build.desc:java_test(name = "single", srcs = [ "SingleTestSuite.java", ], deps = [ ":tests", "//java/server/src/org/openqa/selenium/server", "//java/client/test/org/openqa/selenium/v1:selenium-backed-webdriver-test", "//java/client/test/org/openqa/selenium/firefox:test", ] ]) TargetsThis highlights most of the key concepts. Firstly, it declares target, in this case there is a single java_test target. Each target has a name attribute.Target NamesThe combination of the location of the “build.desc” file and the name are used to derive the rake tasks that are generated. All task names are prefixed with “//” followed by the path to the directory containing the “build.desc” file relative to the Rakefile, followed by a “:” and then the name of the target within the “build.desc”. An example makes this far clearer :)The rake task generated by this example is //java/client/test/org/openqa/selenium:singleShort Target NamesAs a shortcut, if a target is named after the directory containing the “build.desc” file, you can omit the part of the rake task name after the colon. In our example: //java/server/src/org/openqa/selenium/server is the same as //java/server/src/org/openqa/selenium/server:server.Implicit TargetsSome build rules supply implicit targets, and provide related extensions to a normal build target. Examples include generating archives of source code, or running tests. These are declared by appending a further colon and the name of the implicit target to the full name of a build rule. In our example, you could run the tests using “//java/client/test/org/openqa/selenium:single:run”Each of the rules described below have a list of implicit targets that are associated with them.OutputsEach target specified in a “build.desc” file produces one and only one output. This is important. Keep it in mind. Generally, all output files are placed in the “build” directory, relative to the rake task name. In our example, the output of “//java/org/openqa/selenium/server” would be found in “build/java/org/openqa/selenium/server.jar”. Build rules should output the names and locations of any files that they generate.DependenciesTake a look at the “deps” section of the “single” target above. The ":tests" is a reference to a target in the current “build.desc” file, in this case, it’s a “java_library” target immediately above. You’ll also see that there’s a reference to several full paths. For example "//java/server/src/org/openqa/selenium/server" This refers to another target defined in a crazy fun build.desc file.BrowsersThe py_test and js_test rules have special handling for running the same tests in multiple browsers. Relevant browser-specific meta-data is held in rake-tasks/browsers.rb. The general way to use this is to append _browsername to the target name; without the _browsername suffix, the tests will be run for all browsers.As an example, if we had a js_test rule //foo/bar, we would run its tests in firefox by running the target //foo/bar_ff:run or we would run in all available browsers by running the target //foo/bar:runBuild TargetsYou can list all the build targets using the -T option. e.g../go -T Being a brief description of the available targets that you can use.Common AttributesThe following attributes are required for all build targets:Attribute NameTypeMeaningnamestringUsed to derive the rake target and (often) the name of the generated binaryThe following attributes are commonly used:Attribute NameTypeMeaningsrcsarrayThe raw source to be build for this targetdepsarrayPrerequisites of this targetjava_libraryOutput: JAR file named after the “name” attribute if the “srcs” attribute is set.Implicit Targets: run (if “main” attribute specifiec), project, project-srcs, uber, zipRequired Attributes: “name” and at least one of “srcs” or “deps”.Attribute NameTypeMeaningdepsarrayAs abovesrcsarrayAs aboveresourcesarrayAny resources that should be copied into the jar file.mainstringThe full classname of the main class of the jar (used for creating executable jars)java_testOutput: JAR file named after the “name” attribute if the “srcs” attribute is set.Implicit Targets: run, project, project-srcs, uber, zipRequired Attributes: “name” and at least one of “srcs” or “deps”.Attribute NameTypeMeaningdepsarrayAs above.srcsarrayAs above.resourcesarrayAny resources that should be copied into the jar file.mainstringThe alternative class to use for running these tests.argsstringThe argument line to pass to the main classsyspropertiesarrayAn array of maps containing System properties that should be setjs_depsOutput: Marker file to indicate task is up to date.Implicit Targets: NoneRequired Attributes: “name” and “srcs”Attribute NameTypeMeaningnamestringAs abovesrcsarrayAs abovedepsarrayAs abovejs_binaryOutput: A monolithic JS file containing all dependencies and sources compiled using the closure compiler without optimizations.Implicit Targets: NoneRequired Attributes: At least one of srcs or deps.Attribute NameTypeMeaningnamestringAs abovesrcsarrayAs abovedepsarrayAs abovejs_fragmentOutput: Source of an anonymous function representing the exported function, compiled by the closure compiler with all optimizations turned on.Implicit Targets: NoneRequired Attributes: name, module, function, depsAttribute NameTypeMeaningnamestringAs abovemodulestringThe name of the module containing the functionfunctionstringThe full name of the function to exportdepsarrayAs abovejs_fragment_headerOutput: A C header file with all js_fragment dependencies declared as constants.Implicit Targets: NoneRequired Attributes: name, depsAttribute NameTypeMeaningnamestringAs abovesrcsarrayAs abovedepsarrayAs abovejs_testOutput:Implicit Targets: _BROWSER:run, runRequired Attributes: None.Attribute NameTypeMeaningdepsarrayAs above.srcsarrayAs above.pathstringThe path at which to expect the test files to be hosted on the test server.browsersarrayList of browsers, from rake_tasks/browsers.rb, to run the tests in. Will only attempt to run tests in those browsers which are available on the system. If absent, defaults to all browsers on the system.Assuming browsers = [‘ff’, ‘chrome’], for target //foo, the implicit targets: //foo_ff:run and //foo_chrome:run will be generated, which run the tests in each of those browsers, and the implicit target //foo:run will be generated, which runs the tests in both ff and chrome.py_testOutput: Creates the directory structure required to run the listed python tests.Implicit Targets: _BROWSER:run, runRequired Attributes: name.Attribute NameTypeMeaningdepsarrayOther py_test rule(s), whose tests should also be run.common_testsarrayTest file(s) to be run in all browsers. These tests will be passed through a template, with browser-specific substitutions, so that they are laid out properly for each browser in the python output file tree.BROWSER_specific_testsarrayTest file(s) to be run only in browser BROWSER.resourcesarrayResources which should be copied to the python directory structure.browsersarrayList of browsers, from rake_tasks/browsers.rb, to run the tests in. Will only attempt to run tests in those browsers which are available on the system. If absent, defaults to all browsers on the system.Note: Every py_test invocation is performed in a new virtualenv.rake_taskOutput: A crazy fun build rule that can be referred to “blow the escape” hatch and use ordinary rake targets.Implicit Targets: NoneRequired Attributes: name, task_name, out.Attribute NameTypeMeaningnamestringAs abovetask_namestringThe ordinary rake target to calloutstringThe file that is generated, relative to the Rakefilegcc_libraryOutput: Shared library file named after the “name” attribute if the “srcs” attribute is set.Implicit Targets: None.Required Attributes: “name” and “srcs”.Attribute NameTypeMeaningsrcsarrayAs abovearchstring“amd64” for 64-bit builds, “i386” for 32-bit builds.argsstringArguments to the compiler (-I flags, for example).link_argsstringArguments to the linker (-l flags, for example)Note: When building a new library for the first time, the build will succeed but copying to pre-built will fail with a similar message:cp build/cpp/amd64/libimetesthandler64.so go aborted! can't convert nil into String Solution: Copy the just-built library to the appropriate prebuilt folder (cpp/prebuilt/arch/).Last modified January 10, 2022: More wiki (#907) [deploy site] (adcf706a1ad)'''
