full_description = "A Smattering of Selenium #19I’ve got a full day of driving ahead of me to go to a client so this is the early-morning (for me) edition of the Smattering post.By Adam Goucher (@adamgoucher) | Monday, July 12, 2010Categories:GeneralTags:SmatteringI’ve got a full day of driving ahead of me to go to a client so this is the early-morning (for me) edition of the Smattering post. That of course means there will be an absolute link explosion in about 20 minutes.Dave talks about some of the stuff he is doing with Se-IDE in the post Improving Selenium IDEAnother post on how to deal with file downloads in Se. Mission Impossible no moreHue Doj got some tweet love as another possible locator strategy for Se. So who wants to write the integration?I’m really starting to enjoy JUnit 4. Ben has been learning about it too and shares Data driven Selenium in JUnit via @ParametersFake.app also got some twitter love. It looks nice, but drag-and-drop script creation and Mac only will ultimately limit its growth capabilityThere was a contest around the test management system, TestRail. What is cool though is the API that they have for it that allows external script engines report into it. It’s all about the integrations…The Bromine project has released new screencast which showcases Sauce OnDemand and Hudson integration. And it is a really slick integration at that.Dawn is interviewed on DZone about Agile testing and SeleNesse (the Se / Fitnesse bridge)High level acceptance testing in your PHP applications using Python, Lettuce and Selenium is a mini tutorial on umm, well, High level acceptance testing in your PHP applications using Python, Lettuce and SeleniumHudson Ci Server Running Selenium/Webdriver Cucumber In Headless Mode Xvfb is another well named postIf you are using FarCry, testMXUnit will take a Selenese script and convert it to a format it needsProgrammatic testing with Selenium and TestNG is a nice post that discusses TestNG, DbUnit, and CargoSe-IDE Plugin: Stored Variables Viewer – This plugin allows you to view these variables when the test is running.Another post from Markus Gärtner on a European Weekend Testing session on automation with RobotFramework; this time titled ParkCalc automation – A short reflectionSyn JS claims to provide proper click events for Se 1.x scripts. It was only soft launched but expect more from these folks in the near futureAnd lastly, BrowserMob, which was started by Se Core member Patrick Lightbody announced that it has been acquired by Neustar Webmetrics. Congrats! Now stop drinking the champagne and get back to work! 🙂 PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
