["https://www.selenium.dev/blog/2010/selenium-2-0-beta-1-release"]
title = "Selenium 2.0 beta 1 Release | Selenium"
description = "We recently released the first of the betas for Selenium 2."
full_description = "Selenium 2.0 beta 1 ReleaseWe recently released the first of the betas for Selenium 2.By Simon Stewart (@shs96c) | Friday, December 24, 2010Categories:ReleasesTags:SeleniumBetaWe recently released the first of the betas for Selenium 2. It’s available for Java, C# and Ruby. If you’ve been holding off trying Selenium 2 because of the alpha label, then the biggest improvement you’ll see is with the new WebDriver APIs, but there’s a lot more!A promise of relatively stable APIsFor Firefox only right now, an API for dealing with alerts, prompts and confirms (http://selenium.googlecode.com/svn/trunk/docs/api/java/org/openqa/selenium/WebDriver.TargetLocator.html#alert()).A brand new IE driver.Better selenium emulation (http://selenium.googlecode.com/svn/trunk/docs/api/java/org/openqa/selenium/WebDriverBackedSelenium.html) when using webdriverAnd a better implementation of webdriver’s API backed by the traditional Selenium technology (http://selenium.googlecode.com/svn/trunk/docs/api/java/org/openqa/selenium/SeleneseCommandExecutor.html).Ubiquitous use of Sizzle for emulating CSS selectors where native CSS selectors aren’t supportedThe advanced user interactions (http://selenium.googlecode.com/svn/trunk/docs/api/java/org/openqa/selenium/interactions/package-frame.html) APIAn update to the AndroidDriver’s Android app.Of course, we’d love this release to be completely bug free, but this is, after all, a beta, so there are some known issues:The selenium 1.x emulation using IE is a little flaky.The ChromeDriver is not as capable as the others.Anything in our bug list.You can download it from here:http://code.google.com/p/selenium/downloads/listYou can read the javadocs (http://selenium.googlecode.com/svn/trunk/docs/api/java/index.html) and the ruby docs (http://selenium.googlecode.com/svn/trunk/docs/api/rb/index.html).An obvious question is “When will the beta end?” The short answer is when we’ve implemented the alerts and prompts and advanced user interactions APIs in all supported browsers. We expect there to be some flex in some APIs (removing deprecated methods, and within the advanced user interactions API) but what you have here is basically what you’re going to get when we hit 2.0 final. I have no idea how long this will take, but if you’re interested in helping out, let us know!Thanks are due to all the committers who have worked so hard to get this code into shape. Thanks are also due to all the people who have taken the time to file bugs, ask for features and participated on the mailing lists. Thank you to you too, for going out and trying this new beta of Selenium 2.You rock. 🙂 PreviousNext Last modified April 5, 2024: Broken Links (#1612)[deploy site] (c73064b0d9b)"
