["https://selenium.dev/blog/2010/selenium-2-0a3-released"]
title = "Selenium 2.0a3 Released | Selenium"
description = "Selenium 2.0a3 has been released. This is a major update to 2.0 and all users are encouraged to update."
full_description = "Selenium 2.0a3 ReleasedSelenium 2.0a3 has been released. This is a major update to 2.0 and all users are encouraged to update.By Simon Stewart (@shs96c) | Monday, April 19, 2010Categories:ReleasesTags:SeleniumBetaSelenium 2.0a3 has been released and can be downloaded from the Selenium project site. This is a major update to 2.0 and all users are encouraged to update. The new features include:An improved remote protocol.Updating the version of HtmlUnit used to 2.7.Improved support for simulating user interactions with the browser via native events on Linux.Better support for Firefox 3.6.Bug fixesThe .Net, Python and Ruby bindings will be updated soon, as will the maven artefacts.The next release will be Selenium 2.0a4, and it is planned to include the following when it is released in late May:Android supportA new API to support writing tests involving complex user interactions.Far more integration of the underlying architecture. PreviousNext Last modified August 7, 2021: Renaming directory (e9895f27c26)"
