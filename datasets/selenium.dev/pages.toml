title = "Projects | Selenium"
description = "Projects Selenium has many projects that combine to form a versatile testing system. Selenium WebDriver Selenium WebDriver drives a browser natively, as a real user would, either locally or on remote machines. Simple and concise WebDriver is simple, it is designed as a concise and compact programming interface. Works in all major browsers Through a simple setup, WebDriver can be used with all major browsers. Automate real user interactions in Firefox, Safari, Edge, Chrome, Internet Explorer and more!"
full_description = "ProjectsSelenium has many projects that combine to form a versatile testing system.Selenium WebDriverSelenium WebDriver drives a browser natively, as a real user would, either locally or on remote machines.Simple and conciseWebDriver is simple, it is designed as a concise and compact programming interface.Works in all major browsersThrough a simple setup, WebDriver can be used with all major browsers. Automate real user interactions in Firefox, Safari, Edge, Chrome, Internet Explorer and more! Selenium WebDriver refers to both the language bindings and the implementations of the individual browser controlling code. This is commonly referred to as just WebDriver.WebDriver is a W3C Recommendation!The W3C is an international community that works to develop Web standards. In June 2018, WebDriver became a W3C recommendation. What does this mean? Major browser vendors (Mozilla, Google, Apple, Microsoft) support WebDriver and work constantly to improve the browsers and browser controlling code, which leads to a more uniform behaviour across the different browsers, making your automation scripts more stable.Learn more Selenium IDESelenium IDE is a Chrome, Firefox and Edge extension that makes it easy to record and playback tests in the browser.Web ReadySimple, turn-key solution to quickly author reliable end-to-end tests. Works out of the box for any web app.Easy DebuggingEnjoy easier test debugging with rich IDE features like setting breakpoints and pausing on exceptions.Cross-browser ExecutionRun your tests on any browser/OS combination in parallel using the Command-line Runner for Selenium IDE.Learn more Selenium GridSelenium Grid takes WebDriver to another level by running tests on many machines at the same time, cutting down on the time it takes to test on multiple browsers and operating systems.Multiple browsers, versions, and operating systemsGrid helps you to run your automation scripts across multiple combinations of browsers, versions and operating systems.Reduce execution timeSpeed up execution and cut down overall run time of your automation scripts. You still need scripts that can run in parallel though!Learn more"
