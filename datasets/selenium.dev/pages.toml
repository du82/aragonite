["https://selenium.dev/pt-br/documentation"]
title = "O Projeto Selenium de Automação de Navegadores | Selenium"
description = """
Selenium é um projeto que abrange uma variedade de ferramentas e bibliotecas que permitem e suportam a automação de navegadores da web.
Ele fornece extensões para emular a interação do usuário com os navegadores, um servidor de distribuição para escalonar a alocação do navegador, e a infraestrutura para implementações da Especificação W3C WebDriver que permite escrever código intercambiável para todos os principais navegadores da web.
Este projeto é possível graças a colaboradores voluntários que dedicam milhares de horas de seu próprio tempo, e disponibilizaram o código-fonte disponível gratuitamente para qualquer um usar, aproveitar e melhorar."""
full_description = '''Documentaçãov4.0O Projeto Selenium de Automação de NavegadoresSelenium é um projeto que abrange uma variedade de ferramentas e bibliotecas que permitem e suportam a automação de navegadores da web.Ele fornece extensões para emular a interação do usuário com os navegadores, um servidor de distribuição para escalonar a alocação do navegador, e a infraestrutura para implementações da Especificação W3C WebDriver que permite escrever código intercambiável para todos os principais navegadores da web.Este projeto é possível graças a colaboradores voluntários que dedicam milhares de horas de seu próprio tempo, e disponibilizaram o código-fonte disponível gratuitamente para qualquer um usar, aproveitar e melhorar.Selenium reúne criadores de navegadores, engenheiros e entusiastas para promover uma discussão aberta sobre a automação da plataforma da web. O projeto organiza uma conferência anual para ensinar e nutrir a comunidade.No núcleo do Selenium está WebDriver, uma interface para escrever conjuntos de instruções que podem ser executados alternadamente em muitos navegadores. Aqui está uma das instruções mais simples que você pode fazer: Java Python CSharp Ruby JavaScript Kotlinpackage dev.selenium.hello; import org.openqa.selenium.WebDriver; import org.openqa.selenium.chrome.ChromeDriver; public class HelloSelenium { public static void main(String[] args) { WebDriver driver = new ChromeDriver(); driver.get("https://selenium.dev"); driver.quit(); } } View full example on GitHubfrom selenium import webdriver driver = webdriver.Chrome() driver.get("http://selenium.dev") driver.quit() View full example on GitHubusing OpenQA.Selenium.Chrome; namespace SeleniumDocs.Hello; public static class HelloSelenium { public static void Main() { var driver = new ChromeDriver(); driver.Navigate().GoToUrl("https://selenium.dev"); driver.Quit(); } } View full example on GitHubrequire 'selenium-webdriver' driver = Selenium::WebDriver.for :chrome driver.get 'https://selenium.dev' driver.quit View full example on GitHubconst {Builder, Browser} = require('selenium-webdriver'); (async function helloSelenium() { let driver = await new Builder().forBrowser(Browser.CHROME).build(); await driver.get('https://selenium.dev'); await driver.quit(); })(); View full example on GitHubpackage dev.selenium.hello import org.openqa.selenium.chrome.ChromeDriver fun main() { val driver = ChromeDriver() driver.get("https://selenium.dev") driver.quit() } View full example on GitHubConsulte a Visão Geral para verificar os diferentes componentes do projeto e decidir se o Selenium é a ferramenta certa para você.Você deve continuar no Guia de Introdução para entender como instalar o Selenium e usá-lo com sucesso como uma ferramenta de automação de teste e dimensionar testes simples como esse para serem executados em ambientes grandes e distribuídos em vários navegadores e em vários sistemas operacionais diferentes.ResumoSerá Selenium a ferramenta para você? Veja um resumo dos componentes do projecto.WebDriverWebDriver manipula um navegador nativamente; aprenda mais sobre isso.Selenium Manager (Beta)Selenium Manager is a command-line tool implemented in Rust that provides automated driver and browser management for Selenium. Selenium bindings use this tool by default, so you do not need to download it or add anything to your code or do anything else to use it.GridPretende executar testes em paralelo em várias máquinas? Então a Grid é para si.Servidor de drivers do IEO Internet Explorer Driver é um servidor autónomo que implementa a especificação WebDriver.Selenium IDESelenium IDE é uma extensão do navegador que grava e reproduz uma acção do utilizador.Diretrizes e recomendaçõesGuias e recomendações ao preparar soluções de testes com o projecto Selenium.LegadoNesta seção você pode encontrar toda a documentação relacionada aos componentes legados do Selenium. Isso deve ser mantido puramente por razões históricas e não como um incentivo para o uso obsoleto componentes.Sobre esta documentaçãoÚltima modificação September 10, 2024: Transparent png favicons (#1937)[deploy site] (03705be0833)'''
