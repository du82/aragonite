["https://selenium.dev/documentation"]
title = "The Selenium Browser Automation Project | Selenium"
description = """
Selenium is an umbrella project for a range of tools and libraries that enable and support the automation of web browsers.
It provides extensions to emulate user interaction with browsers, a distribution server for scaling browser allocation, and the infrastructure for implementations of the W3C WebDriver specification that lets you write interchangeable code for all major web browsers.
This project is made possible by volunteer contributors who have put in thousands of hours of their own time, and made the source code freely available for anyone to use, enjoy, and improve."""
full_description = '''Documentationv4.0The Selenium Browser Automation ProjectSelenium is an umbrella project for a range of tools and libraries that enable and support the automation of web browsers.It provides extensions to emulate user interaction with browsers, a distribution server for scaling browser allocation, and the infrastructure for implementations of the W3C WebDriver specification that lets you write interchangeable code for all major web browsers.This project is made possible by volunteer contributors who have put in thousands of hours of their own time, and made the source code freely available for anyone to use, enjoy, and improve.Selenium brings together browser vendors, engineers, and enthusiasts to further an open discussion around automation of the web platform. The project organises an annual conference to teach and nurture the community.At the core of Selenium is WebDriver, an interface to write instruction sets that can be run interchangeably in many browsers. Once you’ve installed everything, only a few lines of code get you inside a browser. You can find a more comprehensive example in Writing your first Selenium script Java Python CSharp Ruby JavaScript Kotlinpackage dev.selenium.hello; import org.openqa.selenium.WebDriver; import org.openqa.selenium.chrome.ChromeDriver; public class HelloSelenium { public static void main(String[] args) { WebDriver driver = new ChromeDriver(); driver.get("https://selenium.dev"); driver.quit(); } } View full example on GitHubfrom selenium import webdriver driver = webdriver.Chrome() driver.get("http://selenium.dev") driver.quit() View full example on GitHubusing OpenQA.Selenium.Chrome; namespace SeleniumDocs.Hello; public static class HelloSelenium { public static void Main() { var driver = new ChromeDriver(); driver.Navigate().GoToUrl("https://selenium.dev"); driver.Quit(); } } View full example on GitHubrequire 'selenium-webdriver' driver = Selenium::WebDriver.for :chrome driver.get 'https://selenium.dev' driver.quit View full example on GitHubconst {Builder, Browser} = require('selenium-webdriver'); (async function helloSelenium() { let driver = await new Builder().forBrowser(Browser.CHROME).build(); await driver.get('https://selenium.dev'); await driver.quit(); })(); View full example on GitHubpackage dev.selenium.hello import org.openqa.selenium.chrome.ChromeDriver fun main() { val driver = ChromeDriver() driver.get("https://selenium.dev") driver.quit() } View full example on GitHubSee the Overview to check the different project components and decide if Selenium is the right tool for you.You should continue on to Getting Started to understand how you can install Selenium and successfully use it as a test automation tool, and scaling simple tests like this to run in large, distributed environments on multiple browsers, on several different operating systems.Selenium OverviewIs Selenium for you? See an overview of the different project components.WebDriverWebDriver drives a browser natively; learn more about it.Selenium Manager (Beta)Selenium Manager is a command-line tool implemented in Rust that provides automated driver and browser management for Selenium. Selenium bindings use this tool by default, so you do not need to download it or add anything to your code or do anything else to use it.GridWant to run tests in parallel across multiple machines? Then, Grid is for you.IE Driver ServerThe Internet Explorer Driver is a standalone server that implements the WebDriver specification.Selenium IDEThe Selenium IDE is a browser extension that records and plays back a user’s actions.Test PracticesSome guidelines and recommendations on testing from the Selenium project.LegacyDocumentation related to the legacy components of Selenium. Meant to be kept purely for historical reasons and not as a incentive to use deprecated components.About this documentationLast modified November 17, 2023: Upgrade to Docsy 0 7 2 (#1529) (48f43616907)'''
