full_description = "Selenium 1.0.2 Released: Firefox 3.6 and Snow Leopard SupportToday we’re happy to announce that Selenium Remote Control 1.0.2 has been released!By Patrick Lightbody (@plightbo) | Tuesday, February 23, 2010Categories:ReleasesTags:SeleniumSelenium-RcToday we’re happy to announce that Selenium Remote Control 1.0.2 has been released. While most of our efforts are on Selenium 2.0, we understand that there are millions of Selenium users that still need the 1.x line supported. That’s why we’ve said from the start that our goal is make 2.x 100% backwards compatible with 1.x. And that’s why we’re releasing a new version of Selenium RC today.Download it here (http://selenium.googlecode.com/files/selenium-remote-control-1.0.2.zip).In addition to many bug fixes, the biggest improvements in this version are support for both Firefox 3.6 and OS X Snow Leopard. PreviousNext Last modified April 5, 2024: Broken Links (#1612)[deploy site] (c73064b0d9b)"
