["https://selenium.dev/ja/documentation"]
title = "Seleniumブラウザー自動化プロジェクト | Selenium"
description = '''
Seleniumはブラウザー自動化を可能にし、それを支えるツール群とライブラリー群プロジェクトです。
ユーザーとブラウザーのやり取りのエミュレーション、ブラウザーの割当を増強したり縮減する分散型サーバー、そしてすべてのメジャーなブラウザー用に置換可能なコードの実装を可能にするW3C WebDriver 仕様インフラの提供します。
このプロジェクトは多くの有志貢献者の何千時間に及ぶ個々の時間を費やした事とソースコード自由に利用可能を誰にでも利用、楽しめ、そして改良できることによって実現しました。
Seleniumはウェブプラットフォームの自動化のより開かれた議論をするためブラウザーベンダー、エンジニア、愛好家をまとめます。このプロジェクトはコミュニティーを導きと育成のために年次カンファレンス開催します。
Seleniumの中核はWebDriverであり、様々なブラウザーを変えてインストラクション集を実行できるインターフェースです。これは作りえる一番基本的な インストラクションの一つです:
Java Python CSharp Ruby JavaScript Kotlin package dev.selenium.hello; import org.openqa.selenium.WebDriver; import org.openqa.selenium.chrome.ChromeDriver; public class HelloSelenium { public static void main(String[] args) { WebDriver driver = new ChromeDriver(); driver.get("https://selenium.dev"); driver.quit(); } } View full example on GitHub from selenium import webdriver driver = webdriver.Chrome() driver.get("http://selenium.dev") driver.quit() View full example on GitHub using OpenQA.Selenium.Chrome; namespace SeleniumDocs.Hello; public static class HelloSelenium { public static void Main() { var driver = new ChromeDriver(); driver.'''
full_description = '''ドキュメントv4.0Seleniumブラウザー自動化プロジェクトSeleniumはブラウザー自動化を可能にし、それを支えるツール群とライブラリー群プロジェクトです。ユーザーとブラウザーのやり取りのエミュレーション、ブラウザーの割当を増強したり縮減する分散型サーバー、そしてすべてのメジャーなブラウザー用に置換可能なコードの実装を可能にするW3C WebDriver 仕様インフラの提供します。このプロジェクトは多くの有志貢献者の何千時間に及ぶ個々の時間を費やした事とソースコード自由に利用可能を誰にでも利用、楽しめ、そして改良できることによって実現しました。Seleniumはウェブプラットフォームの自動化のより開かれた議論をするためブラウザーベンダー、エンジニア、愛好家をまとめます。このプロジェクトはコミュニティーを導きと育成のために年次カンファレンス開催します。Seleniumの中核はWebDriverであり、様々なブラウザーを変えてインストラクション集を実行できるインターフェースです。これは作りえる一番基本的な インストラクションの一つです: Java Python CSharp Ruby JavaScript Kotlinpackage dev.selenium.hello; import org.openqa.selenium.WebDriver; import org.openqa.selenium.chrome.ChromeDriver; public class HelloSelenium { public static void main(String[] args) { WebDriver driver = new ChromeDriver(); driver.get("https://selenium.dev"); driver.quit(); } } View full example on GitHubfrom selenium import webdriver driver = webdriver.Chrome() driver.get("http://selenium.dev") driver.quit() View full example on GitHubusing OpenQA.Selenium.Chrome; namespace SeleniumDocs.Hello; public static class HelloSelenium { public static void Main() { var driver = new ChromeDriver(); driver.Navigate().GoToUrl("https://selenium.dev"); driver.Quit(); } } View full example on GitHubrequire 'selenium-webdriver' driver = Selenium::WebDriver.for :chrome driver.get 'https://selenium.dev' driver.quit View full example on GitHubconst {Builder, Browser} = require('selenium-webdriver'); (async function helloSelenium() { let driver = await new Builder().forBrowser(Browser.CHROME).build(); await driver.get('https://selenium.dev'); await driver.quit(); })(); View full example on GitHubpackage dev.selenium.hello import org.openqa.selenium.chrome.ChromeDriver fun main() { val driver = ChromeDriver() driver.get("https://selenium.dev") driver.quit() } View full example on GitHub概要を参照して、さまざまなプロジェクトコンポーネントを確認し、 Seleniumが適切なツールであるかどうかを判断してください。入門に進んで、 Seleniumをインストールし、テスト自動化ツールとして正常に使用する方法を理解し、 このような単純なテストをスケーリングして、複数のブラウザー、 複数の異なるオペレーティングシステムの大規模な分散環境で実行する必要があります。概要Seleniumはあなたに適していますか？さまざまなプロジェクトのコンポーネントの概要を参照してください。WebDriverWebDriverはブラウザをネイティブに操作します。詳細については、こちらをご覧ください。Selenium Manager (Beta)Selenium Manager is a command-line tool implemented in Rust that provides automated driver and browser management for Selenium. Selenium bindings use this tool by default, so you do not need to download it or add anything to your code or do anything else to use it.Grid複数のマシンで並行してテストを実行したいですか？ Grid が手助けします。IE Driver サーバーInternet Explorer Driverは、WebDriverの仕様を実装するスタンドアロンサーバーです。Selenium IDESelenium IDEは、ユーザーのアクションを記録および再生するブラウザー拡張機能です。テストの実践Seleniumプロジェクトからのテストに関するいくつかのガイドラインと推奨事項レガシーこのセクションでは、Seleniumのレガシーコンポーネントに関連するすべてのドキュメントを見つけることができます。 これは、非推奨コンポーネントを使用する動機としてではなく、純粋に歴史的な理由で保持されることを意図しています。このドキュメントについて最終更新 September 10, 2024: Transparent png favicons (#1937)[deploy site] (03705be0833)'''
