["https://selenium.dev/documentation/grid/configuration/cli_options"]
title = "CLI options in the Selenium Grid | Selenium"
description = "All Grid components configuration CLI options in detail."
full_description = '''DocumentationGridConfigurationCLI Optionsv4.0CLI options in the Selenium GridAll Grid components configuration CLI options in detail.Different sections are available to configure a Grid. Each section has options can be configured through command line arguments.A complete description of the component to section mapping can be seen below.Note that this documentation could be outdated if an option was modified or added but has not been documented yet. In case you bump into this situation, please check the “Config help” section and feel free to send us a pull request updating this page.SectionsStandaloneHubNodeDistributorRouterSessionsSessionQueueDistributorDockerEventsLoggingNetworkNodeRouterRelayServerSessionQueueSessionsDistributorOptionTypeValue/ExampleDescription--healthcheck-intervalint120How often, in seconds, will the health check run for all Nodes. This ensures the server can ping all the Nodes successfully.--distributorurihttp://localhost:5553Url of the distributor.--distributor-hoststringlocalhostHost on which the distributor is listening.--distributor-implementationstringorg.openqa.selenium.grid.distributor.local.LocalDistributorFull class name of non-default distributor implementation--distributor-portint5553Port on which the distributor is listening.--reject-unsupported-capsbooleanfalseAllow the Distributor to reject a request immediately if the Grid does not support the requested capability. Rejecting requests immediately is suitable for a Grid setup that does not spin up Nodes on demand.--slot-matcherstringorg.openqa.selenium.grid.data.DefaultSlotMatcherFull class name of non-default slot matcher to use. This is used to determine whether a Node can support a particular session.--slot-selectorstringorg.openqa.selenium.grid.distributor.selector.DefaultSlotSelectorFull class name of non-default slot selector. This is used to select a slot in a Node once the Node has been matched.--newsession-threadpool-sizeint24The Distributor uses a fixed-sized thread pool to create new sessions as it consumes new session requests from the queue. This allows configuring the size of the thread pool. The default value is no. of available processors * 3. Note: If the no. of threads is way greater than the available processors it will not always increase the performance. A high number of threads causes more context switching which is an expensive operation.--purge-nodes-intervalint30How often, in seconds, will the Distributor purge Nodes that have been down for a while. This is calculated based on the heartbeat received from a particular node.DockerOptionTypeValue/ExampleDescription--docker-assets-pathstring/opt/selenium/assetsAbsolute path where assets will be stored--docker-string[]selenium/standalone-firefox:latest '{"browserName": "firefox"}'Docker configs which map image name to stereotype capabilities (example `-D selenium/standalone-firefox:latest ‘{“browserName”: “firefox”}’)--docker-devicesstring[]/dev/kvm:/dev/kvmExposes devices to a container. Each device mapping declaration must have at least the path of the device in both host and container separated by a colon like in this example: /device/path/in/host:/device/path/in/container--docker-hoststringlocalhostHost name where the Docker daemon is running--docker-portint2375Port where the Docker daemon is running--docker-urlstringhttp://localhost:2375URL for connecting to the Docker daemon--docker-video-imagestringselenium/video:latestDocker image to be used when video recording is enabled--docker-host-config-keysstring[]Dns DnsOptions DnsSearch ExtraHosts BindsSpecify which docker host configuration keys should be passed to browser containers. Keys name can be found in the Docker API documentation, or by running docker inspect the node-docker container.EventsOptionTypeValue/ExampleDescription--bind-busbooleanfalseWhether the connection string should be bound or connected.When true, the component will be bound to the Event Bus (as in the Event Bus will also be started by the component, typically by the Distributor and the Hub).When false, the component will connect to the Event Bus.--events-implementationstringorg.openqa.selenium.events.zeromq.ZeroMqEventBusFull class name of non-default event bus implementation--publish-eventsstringtcp://*:4442Connection string for publishing events to the event bus--subscribe-eventsstringtcp://*:4443Connection string for subscribing to events from the event busLoggingOptionTypeValue/ExampleDescription--http-logsbooleanfalseEnable http logging. Tracing should be enabled to log http logs.--log-encodingstringUTF-8Log encoding--logstringWindows path example :'\path\to\file\gridlog.log'or'C:\path\path\to\file\gridlog.log'Linux/Unix/MacOS path example :'/path/to/file/gridlog.log'File to write out logs. Ensure the file path is compatible with the operating system’s file path.--log-levelstring“INFO”Log level. Default logging level is INFO. Log levels are described here https://docs.oracle.com/javase/7/docs/api/java/util/logging/Level.html--plain-logsbooleantrueUse plain log lines--structured-logsbooleanfalseUse structured logs--tracingbooleantrueEnable trace collection--log-timestamp-formatstringHH:mm:ss.SSSAllows the configure log timestamp formatNetworkOptionTypeValue/ExampleDescription--relax-checksbooleanfalseRelax checks on origin header and content type of incoming requests, in contravention of strict W3C spec compliance.NodeOptionTypeValue/ExampleDescription--detect-driversbooleantrueAutodetect which drivers are available on the current system, and add them to the Node.--driver-configurationstring[]display-name="Firefox Nightly" max-sessions=2 webdriver-path="/usr/local/bin/geckodriver" stereotype="{\"browserName\": \"firefox\", \"browserVersion\": \"86\", \"moz:firefoxOptions\": {\"binary\":\"/Applications/Firefox Nightly.app/Contents/MacOS/firefox-bin\"}}"List of configured drivers a Node supports. It is recommended to provide this type of configuration through a toml config file to improve readability--driver-factorystring[]org.openqa.selenium.example.LynxDriverFactory '{"browserName": "lynx"}'Mapping of fully qualified class name to a browser configuration that this matches against.--driver-implementationstring[]"firefox"Drivers that should be checked. If specified, will skip autoconfiguration.--node-implementationstring"org.openqa.selenium.grid.node.local.LocalNodeFactory"Full classname of non-default Node implementation. This is used to manage a session’s lifecycle.--grid-urlstringhttps://grid.example.comPublic URL of the Grid as a whole (typically the address of the Hub or the Router)--heartbeat-periodint60How often, in seconds, will the Node send heartbeat events to the Distributor to inform it that the Node is up.--max-sessionsint8Maximum number of concurrent sessions. Default value is the number of available processors.--override-max-sessionsbooleanfalseThe # of available processors is the recommended max sessions value (1 browser session per processor). Setting this flag to true allows the recommended max value to be overwritten. Session stability and reliability might suffer as the host could run out of resources.--register-cycleint10How often, in seconds, the Node will try to register itself for the first time to the Distributor.--register-periodint120How long, in seconds, will the Node try to register to the Distributor for the first time. After this period is completed, the Node will not attempt to register again.--session-timeoutint300Let X be the session-timeout in seconds. The Node will automatically kill a session that has not had any activity in the last X seconds. This will release the slot for other tests.--vnc-env-varstring[]SE_START_XVFB SE_START_VNC SE_START_NO_VNCEnvironment variable to check in order to determine if a vnc stream is available or not.--no-vnc-portint7900If VNC is available, sets the port where the local noVNC stream can be obtained--drain-after-session-countint1Drain and shutdown the Node after X sessions have been executed. Useful for environments like Kubernetes. A value higher than zero enables this feature.--hubstringhttp://localhost:4444The address of the Hub in a Hub-and-Node configuration. Can be a hostname or IP address (hostname), in which case the Hub will be assumed to be http://hostname:4444, the --grid-url will be the same --publish-events will be tcp://hostname:4442 and --subscribe-events will be tcp://hostname:4443. If hostname contains a port number, that will be used for --grid-url but the URIs for the event bus will remain the same. Any of these default values may be overridden but setting the correct flags. If the hostname has a protocol (such as https) that will be used too.--enable-cdpbooleantrueEnable CDP proxying in Grid. A Grid admin can disable CDP if the network doesnot allow websockets. True by default.--enable-managed-downloadsbooleanfalseThis causes the Node to auto manage files downloaded for a given session on the Node.--selenium-managerbooleanfalseWhen drivers are not available on the current system, use Selenium Manager. False by default.--connection-limit-per-sessionint10Let X be the maximum number of websocket connections per session.This will ensure one session is not able to exhaust the connection limit of the host.RelayOptionTypeValue/ExampleDescription--service-urlstringhttp://localhost:4723URL for connecting to the service that supports WebDriver commands like an Appium server or a cloud service.--service-hoststringlocalhostHost name where the service that supports WebDriver commands is running--service-portint4723Port where the service that supports WebDriver commands is running--service-status-endpointstring/statusOptional, endpoint to query the WebDriver service status, an HTTP 200 response is expected--service-protocol-versionstringHTTP/1.1Optional, enforce a specific protocol version in HttpClient when communicating with the endpoint service status--service-configurationstring[]max-sessions=2 stereotype='{"browserName": "safari", "platformName": "iOS", "appium:platformVersion": "14.5"}}'Configuration for the service where calls will be relayed to. It is recommended to provide this type of configuration through a toml config file to improve readability.RouterOptionTypeValue/ExampleDescription--passwordstringmyStrongPasswordPassword clients must use to connect to the server. Both this and the username need to be set in order to be used.--usernamestringadminUser name clients must use to connect to the server. Both this and the password need to be set in order to be used.--sub-pathstringmy_company/selenium_gridA sub-path that should be considered for all user facing routes on the Hub/Router/Standalone.--disable-uibooleantrueDisable the Grid UI.ServerOptionTypeValue/ExampleDescription--external-urlstringhttp://10.0.1.1:33333External URL where component is generally available. Useful on complex network topologies when components are on different networks and proxy servers are involved.--allow-corsbooleantrueWhether the Selenium server should allow web browser connections from any host--hoststringlocalhostServer IP or hostname: usually determined automatically.--bind-hostbooleantrueWhether the server should bind to the host address/name, or only use it to" report its reachable url. Helpful in complex network topologies where the server cannot report itself with the current IP/hostname but rather an external IP or hostname (e.g. inside a Docker container)--https-certificatepath/path/to/cert.pemServer certificate for https. Get more detailed information by running “java -jar selenium-server.jar info security”--https-private-keypath/path/to/key.pkcs8Private key for https. Get more detailed information by running “java -jar selenium-server.jar info security”--max-threadsint24Maximum number of listener threads. Default value is: (available processors) * 3.--portint4444Port to listen on. There is no default as this parameter is used by different components, for example, Router/Hub/Standalone will use 4444 and Node will use 5555.SessionQueueOptionTypeValue/ExampleDescription--sessionqueueurihttp://localhost:1237Address of the session queue server.-sessionqueue-hoststringlocalhostHost on which the session queue server is listening.--sessionqueue-portint1234Port on which the session queue server is listening.--session-request-timeoutint300Timeout in seconds. A new incoming session request is added to the queue. Requests sitting in the queue for longer than the configured time will timeout.--session-retry-intervalint5Retry interval in seconds. If all slots are busy, new session request will be retried after the given interval.--maximum-response-delayint8How often, in seconds, will the the SessionQueue response in case there is no data, to reduce the http requests while polling for new session requests.SessionsOptionTypeValue/ExampleDescription--sessionsurihttp://localhost:1234Address of the session map server.--sessions-hoststringlocalhostHost on which the session map server is listening.--sessions-portint1234Port on which the session map server is listening.Configuration examplesAll the options mentioned above can be used when starting the Grid components. They are a good way of exploring the Grid options, and trying out values to find a suitable configuration.We recommend the use of Toml files to configure a Grid. Configuration files improve readability, and you can also check them in source control.When needed, you can combine a Toml file configuration with CLI arguments.Command-line flagsTo pass config options as command-line flags, identify the valid options for the component and follow the template below.java -jar selenium-server-<version>.jar <component> --<option> value Standalone, setting max sessions and main portjava -jar selenium-server-<version>.jar standalone --max-sessions 4 --port 4444 Hub, setting a new session request timeout, a main port, and disabling tracingjava -jar selenium-server-<version>.jar hub --session-request-timeout 500 --port 3333 --tracing false Node, with 4 max sessions, with debug(fine) log, 7777 as port, and only with Firefox and Edgejava -jar selenium-server-<version>.jar node --max-sessions 4 --log-level "fine" --port 7777 --driver-implementation "firefox" --driver-implementation "edge" Distributor, setting Session Map server url, Session Queue server url, and disabling busjava -jar selenium-server-<version>.jar distributor --sessions http://localhost:5556 --sessionqueue http://localhost:5559 --bind-bus false Setting custom capabilities for matching specific NodesImportant: Custom capabilities need to be set in the configuration in all Nodes. They also need to be included always in every session request.Start the Hubjava -jar selenium-server-<version>.jar hub Start the Node A with custom cap set to truejava -jar selenium-server-<version>.jar node --detect-drivers false --driver-configuration display-name="Chrome (custom capability true)" max-sessions=1 stereotype='{"browserName":"chrome","gsg:customcap":true}' --port 6161 St'''
