["https://www.selenium.dev/getinvolved"]
title = "Get Involved | Selenium"
description = "Getting Involved Selenium is certainly a team effort! There are several ways you can help out, whether you are a programmer, designer, QA engineer, writer, project manager, or just willing to help. If you are interested in helping, the best way to connect with us is at the Selenium Developers Group. We will work with you to get you set up to contribute. You can help by... Answering Questions for Other Users We get a lot of questions, and we have a great community to help answer them."
full_description = "Getting InvolvedSelenium is certainly a team effort! There are several ways you can help out, whether you are a programmer, designer, QA engineer, writer, project manager, or just willing to help. If you are interested in helping, the best way to connect with us is at the Selenium Developers Group. We will work with you to get you set up to contribute.You can help by...Answering Questions for Other UsersWe get a lot of questions, and we have a great community to help answer them. If you could register and log into the user group to answer a question or two, that would be great! There are often some very basic questions that are easy to answer. You can also join in the conversations in our Chat Room.Maintaining our Website and DocumentationWe have a lot of out-of-date information that needs to be tidied up on the site! Help by writing documentation, producing helpful diagrams, re-skinning the website, or organizing content. Documentation files are all in markdown, so use your favorite editor offline to make edits.To add content or report issues with our site or documentation, follow the applicable instructions on our contributing section.Feel free to post questions on the Selenium Developers Group or in the #selenium-documentation channel in our Chat Room.Translating our Website and DocumentationIt is important to us that our documentation be made more accessible to people around the world. As such, our website and documentation are set up to facilitate translations to other languages. We would love for our documentation to be made more accessible to people worldwide. If you are interested in contributing translations of existing languages, please check out on our site joining our team of translators to make sure that theIf you would like to take ownership of a language that is not currently being maintained, and be added to our Selenium Translators group, please contact the Selenium Technical Leadership Committee in our Chat Room.If you see places where an existing translation is incorrect or can be improved or updated, please submit an issue or pull request by following the instructions on our translations section.Bug Reports and Feature RequestsIf you run into a problem with Selenium, feel free to file a bug report about it on our Bug Tracker. Similarly, if you have an idea for a feature you’d like to see in a future version, report that as well.Also, we would love help going through the bug reports and adding comments (which automatically get sent to the reporter) for cases where advice is all that is needed.Please note:Although these templates help the clear structuring of an issue, please keep in mind that bugs have to be reproducible and feature / change requests have to be understandable!Contributing Code to SeleniumMuch of the magic behind Selenium is the hard work of programmers with backgrounds in Javascript, Java, Ruby, PHP, Python, Perl, C#, HTML and other languages.We encourage code patches and other contributions - get involved by following the contribution guidelines. The Selenium project's source can be found at https://github.com/SeleniumHQ/selenium.If you do supply a patch, please sign the CLA when required in the pull request. We are a part of Software Freedom Conservancy (SFC)."
