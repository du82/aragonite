["https://selvaag.no/apenhetsloven/redegjorelse"]
title = "Redegjørelse | Selvaag AS"
full_description = "Selvaags arbeid med menneskerettigheter og anstendige arbeidsforhold Åpenhetsloven trådte i kraft 1. juli 2022. Hovedformålet med loven er å fremme virksomheters respekt for grunnleggende menneskerettigheter og anstendige arbeidsforhold. Loven skal også sikre at allmennheten har tilgang til informasjon om hvordan virksomheter håndterer sin menneskerettighetsrisiko. Selvaag har siden lovens ikrafttredelse jobbet systematisk med å etablere et helhetlig system for å ivareta hensyn til menneskerettigheter og arbeidsforhold i vår virksomhet, leverandørkjede og med våre forretningspartnere. Selvaag er opptatt av å opptre ansvarlig og ønsker å utvise åpenhet rundt vårt arbeid med menneskerettigheter og anstendige arbeidsforhold gjennom vår årlige redegjørelse. Vår virksomhet og driftsområde Selvaag AS er et investeringsselskap, som også er morselskap og konsernspiss i Selvaag konsern. Selvaag er organisert i henhold til en holdingmodell, hvilket innebærer at underliggende selskaper av Selvaag AS rapporterer til egne styrer, driver virksomhet, investerer og finansieres på selvstendig grunnlag, innenfor rammer gitt av Selvaag AS som morselskap eller investor. I Selvaag AS er det ti ansatte som jobber med ledelse, drift og administrative oppgaver, samt eieroppfølging og styrearbeid i de underliggende selskapene. Selvaag AS har sin virksomhet og aktivitet i Norge. Selvaag konsernets virksomhet er hovedsakelig knyttet til eiendomsinvesteringer, bolig- og byutvikling, samt tilliggende aktiviteter. Konsernet har i all hovedsak virksomheten i Norge, men med tillegg av boligutviklingsvirksomhet i Sverige. Selvaag konsern er inndelt i fire virksomhetsområder, samt andre investeringer kategorisert som øvrige: Selvaag Eiendom Selvaag Utleiebolig Selvaag Bolig Selvaag By Øvrige er enten mindre konsernselskaper eller andre investeringer med mindre eierandel Selvaag Eiendom, Selvaag Utleiebolig, Selvaag Bolig og Selvaag By omfattes alle av åpenhetsloven på selvstendig grunnlag. I tråd med Selvaags desentraliserte styringsmodell arbeider selskapene selvstendig med å forholde seg til pliktene i loven, og de utarbeider egne redegjørelser for egen virksomhet som går i mer detalj enn konsernets redegjørelse. Redegjørelsene er tilgjengelig på selskapenes respektive nettsider. Denne redegjørelsen fokuserer derfor på selskapet Selvaag AS sitt arbeid med grunnleggende menneskerettigheter og anstendige arbeidsforhold, samt aktiviteten i øvrige selskaper i den grad det er relevant. Aktsomhetsvurderinger Selvaag AS har forpliktet seg til å opptre ansvarlig og sikre respekt for grunnleggende menneskerettigheter og arbeidstakerrettigheter. Denne forpliktelsen kommer frem av våre etiske retningslinjer, vedtatt av selskapets styre, som omfatter menneskerettigheter og anstendige arbeidsforhold. Våre etiske retningslinjer bygger på Selvaags verdier om «omtanke» og «skaperkraft». Fra våre retningslinjer følger det at vi skal: Etterleve anerkjente standarder for ansvarlig forretningsdrift 2 Respektere grunnleggende menneskerettigheter og arbeidstakerrettigheter, herunder FNs verdenserklæring om menneskerettigheter og ILOs kjernekonvensjoner om grunnleggende rettigheter og prinsipper i arbeidslivet Sette helse, miljø og sikkerhet først både i egen virksomhet og med våre forretningspartnere Fremme likestilling og mangfold Oppfordre til å varsle om kritikkverdige forhold i Selvaag Selvaag AS etiske retningslinjer gir føringer for valg av leverandører i morselskapet. De operative datterselskapene har etablert egne etiske retningslinjer, inneholdende krav knyttet til opptreden i henhold til åpenhetsloven for vesentlige leverandører. Selvaag AS har gjennom arbeidet med sin aktsomhetsvurdering for 2023 innhentet Selvaag Eiendom, Selvaag Utleiebolig, Selvaag Bolig og Selvaag By sine risikovurderinger og retningslinjer. Selvaag AS har i tillegg gjennomført en egen mer overordnet risikovurdering som omfatter konsernets samlede virksomhet. Denne beskrives nærmere under punktet «risikovurdering». Selvaag AS har lagt inn arbeidet med oppfølging av åpenhetsloven inn i et årshjul for å ivareta det løpende arbeidet med menneskerettigheter og anstendige arbeidsforhold. Risikovurdering Selvaag AS har i arbeidet med implementering av åpenhetsloven jobbet etter et rammeverk basert på FNs veiledende prinsipper for næringsliv og menneskerettigheter (UNGP) og OECDs modell for aktsomhetsvurderinger. Vi har gjennom 2023 gjennomført en overordnet risikokartlegging av vår mulige påvirkning på menneskerettigheter og anstendige arbeidsforhold. Formålet med kartleggingen har vært å identifisere risikoområder i egen virksomhet og leverandørkjede, og på denne måten fremme menneskerettigheter og anstendige arbeidsforhold. Kartleggingen viser at risikoen, som forventet, primært knyttes til den operative aktiviteten i Selvaags fire større virksomhetsområders kjernevirksomhet, med tilhørende leverandørkjede. Selvaag har sett hen til ulike kilder for bransjespesifikke risikoer og geografiske risikoer, samt Selvaag sine egne erfaringer og innsikt. Basert på kartleggingen har vi identifisert og prioritert følgende risikoområder i konsernet: innkjøp av materialer og andre innsatsfaktorer til bolig- og annen eiendomsutvikling benyttelse av leverandører innen bygg- og anlegg, transport og renhold som gir lønn under tariff eller på andre måter bedriver sosial dumping manglende helse-, miljø- og sikkerhet i forbindelse med bolig- og eiendomsutvikling innkjøp av kontorrekvisita og IKT-produkter Ingen faktiske brudd eller negative konsekvenser er blitt avdekket i forbindelse med kartleggingen i 2023. Risikoområdene ble vurdert etter hvor alvorlig den mulige negative påvirkningen er, hvor mange som vil kunne påvirkes, om skaden kan rettes opp og sannsynlighet for at risikoen inntreffer. Videre har vi sett hen til vår innflytelse og påvirkningskraft for de identifiserte risikoområdene når vi har prioritert hvilke områder vi særlig skal legge vekt på i det videre arbeidet. Selvaag Eiendom, Selvaag Utleiebolig, Selvaag Bolig og Selvaag By har naturlig nok identifisert lignende risikoområder som Selvaag totalt sett. Risikoene knyttes til hovedsakelig til prosjekter i bolig- og eiendomsutviklingsaktiviteten. Den geografiske eksponeringen i leverandørkjeden knyttes til materialer og andre innsatsfaktorer som benyttes i virksomheten. 3 Slik jobber vi for å forebygge, redusere og stanse negative konsekvenser Selvaag AS har tilrettelagt for varsling gjennom tjenestevei om brudd på menneskerettigheter og anstendige arbeidsforhold, lover og regler eller brudd på etiske retningslinjer. All varsling behandles konfidensielt, og vil bli fulgt opp. Vi har forbedret våre varslingsrutiner og tilrettelagt for anonym varsling på våre nettsider, som kan sendes til det aktuelle Selvaag selskapet eller uavhengig advokat. Dette vil bidra til å senke terskelen for å rapportere eventuelle kritikkverdige forhold i vår leverandørkjede. De vesentlige identifiserte risikoene i Selvaag håndteres løpende av de aktuelle datterselskapene som utgjør egne virksomhetsområder. De har det operative ansvaret for egen virksomhet og har tettere bånd knyttet til leverandørene. Selvaag AS etterspør som ledd i sin eieroppfølging og det løpende styrearbeidet informasjon om og rapportering av tiltakene i datterselskapene for å forebygge, redusere og stanse mulige negative konsekvenser. Vi anser dette som en av våre viktigste tiltak gitt risikoområdene som har blitt identifisert. Vi forventer at dette bidrar til å øke oppmerksomheten rundt viktigheten av arbeidet med menneskerettigheter og anstendige arbeidsforhold. Arbeidet med åpenhetsloven er under kontinuerlig utvikling. Vi vil fortsette å tilegne oss kunnskap om aktsomhetsvurderinger i året som kommer og bruke dette for å forbedre vårt arbeid på området. Mer informasjon og spørsmål Henvendelser knyttet til Selvaag AS, som eier- og investeringsselskap, arbeid med grunnleggende menneskerettigheter og anstendige arbeidsforhold kan sendes til: varsling@selvaag.no Henvendelser knyttet til en av Selvaags operative virksomheter (datterselskaper), bes sendt direkte til den aktuelle av disse: Selvaag Eiendom (næringseiendom), varsling@selvaageiendom.no Selvaag Utleiebolig (utleieboliger), varsling@selvaagutleiebolig.no Selvaag Bolig (boliger for utvikling og salg), ero@selvaagbolig.no Selvaag By (byutviklingsprosjekter), varsling@selvaagby.no Oslo, 13. juni 2024 Bjarne Borgersen G. Frederik Selvaag styreleder styremedlem Olav H. Selvaag Tore Myrvold styremedlem administrerende direktør"
year_published = 2025
