full_description = "Et selskap tuftet på 60 års erfaring. Gjennom sin lange historie har Selvaag skaffet boliger til hundretusener av mennesker, i tillegg til å utvikle næringseiendommer for tusenvis av store og små bedrifter. Underveis er nye bydeler og levende bomiljøer blitt formet. Selvaag By skal fokusere på de lange og store prosjektene, med funksjoner og kompetanse som til sammen ivaretar den helheten som er nødvendig. Aktiviteter, opplevelser, kultur, boliger, næringsbygg, hotell, restauranter – det store bildet består av mange faktorer som skal vurderes. Gjennom Selvaag By samles et miljø med en unik forståelse av hva god byutvikling handler om. Ta kontakt for mer informasjon For varsling klikk her"
