["https://selvaag.no/personvern"]
title = "Personvernerklæring | Selvaag AS"
full_description = "Personvernerklæring Denne personvernerklæringen gjelder Selvaag Gruppen AS, Selvaag Fellestjenester AS og Selvaag Invest AS («Selvaag«) sin behandling av personopplysninger om besøkende på , samarbeidspartnere, leverandører, kunder og andre som tar kontakt. Denne personvernerklæringen gir deg informasjon om hvilke personopplysninger Selvaag samler inn, hvorfor Selvaag behandler personopplysningene og dine rettigheter knyttet til behandlingen av personopplysningene. Selvaag vil behandle personopplysninger i henhold til den til enhver tid gjeldende personvernlovgivningen. 1 Behandlingsansvarlig for dine personopplysninger Selvaag er behandlingsansvarlig for dine personopplysninger og tar ditt personvern på alvor. Dersom du har spørsmål knyttet til Selvaags behandling av dine personopplysninger eller denne personvernerklæringen, kan du kontakte oss ved henvendelse til: Selvaag Gruppen AS, Silurveien 2, 0380 Oslo. Du kan også sende en e-post til 2 Personopplysningser som behandles, Formål og rettslig grunnlag Selvaag behandler personopplysninger om kontaktpersoner hos kunder, leverandører og andre samarbeidspartnere, samt om besøkende på Nettsiden og personer som kontakter Selvaag, f.eks. ved å melde seg på nyhetsbrev. Selvaag samler inn personopplysningene om deg på ulike måter, som eksempel via Nettsiden, via telefon og mail eller annen kontakt, og i forbindelse med vårt samarbeid med kunder og leverandører hvor vi mottar personopplysningene dine fra deg eller din arbeids- eller oppdragsgiver. Selvaag behandler personopplysninger til følgende formål: Administrasjon av kunde- leverandør og andre samarbeidsforhold, hvor vi behandler navn, tittel/funksjon og kontaktinformasjon på ansatte hos kunder, leverandører eller andre samarbeidspartnere. Behandlingen har grunnlag i en interesseavveining for at vi skal kunne kommunisere med våre kunders kontaktpersoner og utføre oppdrag for våre kunder. Besvarelse av henvendelser; for å motta og besvare henvendelser til Selvaag, for eksempel via Nettsiden. Dette kan innebære behandling av personopplysninger som navn, tittel/funksjon, telefonnummer, e-postadresse, adresse og andre personopplysninger som oppgis i forbindelse med henvendelsen. Konsekvensene av ikke å gi slike opplysninger er at Selvaag ikke kan besvare henvendelsen. Behandlingen skjer på grunnlag av en interesseavveining. Selvaags berettigede interesse er å hjelpe deg med det du lurer på. Sende ut nyhetsbrev Rekruttering til nye stillinger oss hos, hvor vi behandler CV, vitnemål, søknad, attester, referanser (som du oppgir) og eventuell annen informasjon du oppgir. Dette er nødvendig for at vi skal kunne vurdere din jobbsøknad. Konsekvensene av ikke å gi slike opplysninger er at vi ikke kan vurdere din jobbsøknad eller kan tilby deg jobb. Behandlingen er nødvendig for å kunne gjennomføre tiltak på grunnlag av jobbsøknaden med sikte på å inngå en arbeidsavtale. Personopplysningene innhentes fra søkeren, men også fra oppgitte referanser. Analyse- og markedsføringsformål; for å forbedre Nettsiden og Selvaag sine tjenester. Behandlingsgrunnlaget for denne typen av behandling er at behandlingen er nødvendig for å ivareta Selvaags berettigede interesser i å optimalisere og videreutvikle informasjonstilbudet på Nettsiden og sine tjenester. Overholdelse av lovpålagte krav og rettslige forpliktelser, for å overholde lovpålagte krav, som for eksempel krav i regnskapslovgivningen, og for å overholde andre pålegg fra offentlige myndigheter. Ivaretakelse av Selvaags eller tredjeparters rettigheter, for å fastsette, gjøre gjeldende og forsvare rettskrav som Selvaag mener å ha, eller er rettet mot Selvaag fra interessenter, boligkjøpere, besøkende på Nettsiden, leverandører, samarbeidspartnere eller andre tredjeparter eller offentlige myndigheter. Vår Nettside benytter cookies (informasjonskapsler) og andre sporingsmekanismer. Cookies er små filer som lagres på datamaskinen din, og som brukes til å innhente informasjon mens du besøker Nettsiden. Vi bruker cookies for at vi bedre kan forstå hvordan du bruker Nettsiden, innhente statistikk om bruk av vår Nettside og tilpasse annonser som vises deg, for eksempel på Facebook. På sikt bruker vi denne kunnskapen for å utarbeide stadig bedre og mer brukervennlige tilbud og for å tilby deg en bedre opplevelse når du besøker Nettsiden vår. Eksempler på hva statistikken gir oss svar på er; hvor mange som besøker ulike sider, hvor lenge besøket varer, hvilke nettsteder brukerne kommer fra og hvilke nettlesere som benyttes. Informasjonen vi samler inn ved bruk av cookies er blant annet IP-adresser, operativsystemer, bruk/navigasjon, enhetens lokasjon etc. Opplysningene behandles i avidentifisert og aggregert form, som betyr at vi ikke kan spore opplysningene vi samler inn tilbake til den enkelte bruker. IP-adressen din blir bare lagret mens du besøker nettstedet, deretter blir den enten slettet eller anonymisert før informasjonen lagres og bearbeides. Selvaag bruker Google Analytics’ informasjonskapsler, som du kan lese mer om her: https://developers.google.com/analytics/devguides/collection/analyticsjs/cookie­usage. [Selvaag bruker også følgende typer informasjonskapsler:] For å følge med på bruken av informasjonskapsler og andre sporingsmekanismer kan du besøke www.ghostery.com eller www.disconnect.me. Du kan endre nettleserinnstillingene dine for å identifisere og blokkere bruk av informasjonskapsler. Les mer om hvordan du administrerer informasjonskapsler på nettvett.no. Vær oppmerksom på at dersom du velger å avslå bruk av informasjonskapsler, kan det begrense tilgang til noen funksjoner på Nettsiden. 4 Oppevaring av personopplysninger Selvaag vil ikke lagre dine personopplysninger lenger enn det som er nødvendig for å oppnå formålene personopplysningene ble samlet inn for. Dersom behandlingen beror på samtykke, vil behandlingen opphøre når du trekker ditt samtykke tilbake. Du kan på ethvert tidspunkt trekke dette tilbake. For søkere på stilling hos oss vil vi oppbevare personopplysningene så lenge rekrutteringsprosessen pågår. Dersom søkeren ikke ansettes, vil vi slette personopplysningene [senest innen ett år fra stillingen ble tilsatt], med mindre samtykke til lengre oppbevaring gis. Ved ansettelse, vil personopplysningene i din søknadsdokumentasjon reguleres av personvernerklæringen som gjelder for våre ansatte. Personopplysningene vil likevel oppbevares så lenge det er nødvendig for at Selvaag kan oppfylle lovpålagte krav og rettslige forpliktelser, herunder krav til fortsatt lagring etter regnskapslovgivningen. 5 Beskyttelse av personopplysninger Selvaag tar ditt personvern på alvor, og har iverksatt tilstrekkelige sikkerhetstiltak for å beskytte dine personopplysninger mot brudd på personopplysningssikkerheten og uautorisert tilgang til og utlevering av personopplysninger. 6 Utlevering av personopplysninger til tredjepartER Selvaag vil bare utlevere personopplysninger til tredjeparter dersom det er lovlig grunnlag for dette. Selvaag bruker databehandlere til å samle inn, lagre eller på annen måte behandle personopplysninger på våre vegne. Forholdet til slike databehandlere vil reguleres gjennom en databehandleravtale, som blant annet sikrer konfidensialitet og ivaretakelse av informasjonssikkerhet i alle ledd. 7 Andre nettsteder og sosiale medier Nettsiden kan inneholde linker eller henvisninger til andre nettsteder. Disse nettstedene har egne personvernerklæringer som gir informasjon om hvordan nettstedene driftes og hvordan personopplysninger innhentes og behandles. Selvaag anbefaler at du setter deg inn i tredjepartsnettstedenes egne personvernerklæringer når du besøker og tar i bruk disse nettstedene. [Når du «liker» eller blir medlem av Selvaags Facebook-side 8 Dine rettigheter Du har rett til å kreve innsyn, retting eller sletting av personopplysningene Selvaag behandler om deg om vilkårene for dette er oppfylt. Du har videre rett til å kreve begrenset behandling, rette innsigelse mot behandlingen og dataportabilitet (rett til å få utlevert eller overført personopplysninger i et egnet format), hvor vilkårene for dette er oppfylt. Dersom behandlingen er basert på ditt samtykke, kan du på ethvert tidspunkt trekke dette tilbake. Dersom du ønsker å utøve dine rettigheter, se kontaktinformasjonen i punkt 1. Du har rett til å klage over Selvaags behandling av dine personopplysninger til Datatilsynet. Selvaag oppfordrer deg til å ta opp eventuelle innsigelser mot Selvaags behandling av personopplysninger med Selvaag først. 9 Endringer i personvernerklæringen Den til enhver tid gjeldende personvernerklæringen vil være tilgjengelig på vår nettside. Ved endringer i Selvaags behandling av personopplysninger, vil erklæringen oppdateres på nettsiden. Sist oppdatert: 07.oktober 2019"
