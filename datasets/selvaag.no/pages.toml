full_description = "Åpenhetsloven Selvaags arbeid med menneskerettigheter og anstendige arbeidsforhold I over 70 år har Selvaag jobbet med å sikre én av de sentrale menneskelige behovene; å ha et hjem. Det følger av verdigrunnlaget vårt at Selvaags virksomheter skal bidra positivt til samfunnet, bidra til å beskytte miljøet og verne om liv og helse. Selvaag mener videre at: Et ansvarlig selskap forventes å påta seg større ansvar for mennesker, samfunn og miljø som påvirkes av virksomheten enn de hensyn som er pålagt ved lov. Selvaag AS er konsernspissen i Selvaag konsern. Selvaag er organisert i henhold til en holdingmodell, hvilket innebærer at underliggende selskaper av Selvaag AS rapporterer til egne styrer, driver virksomhet, investerer og finansieres på selvstendig grunnlag, innenfor rammer gitt av Selvaag AS. Virksomheten i Selvaag skjer hovedsakelig i Norge (mer enn 99% av omsetningen), og er først og fremst knyttet til eiendomsinvesteringer, bolig- og byutvikling, samt tilliggende aktiviteter. Konsernet er inndelt i følgende virksomhetsområder: For informasjon om våre selskaper se: https://selvaag.no/vare-selskaper/ For Selvaags årsrapport se https://selvaag.no/finansiell-informasjon/ Vår forpliktelse til å fremme menneskerettigheter og anstendige arbeidsvilkår Selvaags selskaper har gjennom mange år jobbet med å: hindre svart arbeid og annen arbeidslivkriminalitet og sikre HMS for våre ansatte Åpenhetsloven er en bekreftelse på at dette arbeidet er viktig, den forplikter Selvaag til å: utføre aktsomhetsvurderinger i samsvar med OECDs retningslinjer for flernasjonale selskaper redegjøre for vårt arbeid med aktsomhetsvurderinger knyttet til menneskerettigheter og anstendige arbeidsforhold svare på informasjonsforespørsler fra allmennheten. FNs bærekraftsmål er retningsgivende for det samlede arbeidet med bærekraftig utvikling og samfunnsansvar. Selvaag er bevisst sitt ansvar og vi vil påta oss et større ansva"
