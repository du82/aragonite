["https://selvaag.no/om-selvaag"]
title = "Om Selvaag | Selvaag AS"
full_description = "Selvaag AS Selskapet, som er konsernspissen i Selvaag konsern, eies av Olav H. Selvaag og Gunnar Frederik Selvaag gjennom deres investeringsselskaper. Virksomheten i konsernet er først og fremst tilknyttet eiendomsinvesteringer, bolig- og byutvikling, samt tilliggende aktiviteter. Investeringsvirksomhet utgjør også en betydelig del av verdiene i konsernet. Retning for fremtiden Visjonen «Realiserer ideer – til glede for generasjoner» spiller på verdiene våre. Realiserer verdier spille på skaperkraft og til glede for generasjoner spiller på omtanke. Skaperkraft & Omtanke bygger verdier Med nytenkning og sosialt engasjement som rettesnorer, har Selvaag gjennom over 60 år skaffet bolig til hundretusener av mennesker. Underveis er nye bydeler og levende bomiljøer blitt formet. Samtidig har selskapet utviklet bærekraftige arbeidsplasser både innenfor og utenfor vår kjernevirksomhet, og har skapt verdier både for bedrift, eiere, medarbeidere og samfunn. Skaperkraft og omtanke, er også i dag kjerneverdier i Selvaag, selv om måten det skjer på, kanskje er annerledes enn da Olav Selvaag fikk oppført Ekeberghuset i 1948. Nye skapende oppgaver Ekeberghuset, vindeltrappen og terrassehusene er allerede funnet opp. Men inspirasjonen og skaperkraften fra tiden de ble skapt, har vi med oss når vi påtar oss nye oppgaver: Bidra til at nye generasjoner og befolkningsgrupper får løst sine boligbehov Bygge og videreutvikle levende bymiljøer, hvor folk bor, jobber eller tilbringer sin fritid Foredle eiendom og investeringer nøkternt, solid og langsiktig Fortsatt bidra til aktiv nyskaping, gjennom ideer som plussboliger Forvalte en viktig kulturarv ved å gjøre kunst tilgjengelig der folk ferdes"
year_published = 2025
year_updated = 2024
