["https://selvaag.no/var-historie"]
title = "Vår historie | Selvaag AS"
full_description = "Omtanke og skaperkraft siden 1948 – Jeg kan bygge boliger til en tredjedel av den prisen som er vanlig, sa sivilingeniør Olav Selvaag i 1948. Det ble starten på et konsern som har preget eiendomsbransjen i Norge i tre generasjoner. Bakgrunnen for Selvaags utspill var at Norge manglet boliger etter krigen. Han ville hjelpe de husløse, og var full av skaperkraft. Selvaags ideer om å bygge mer rasjonelt ble møtt med skepsis, men med «Ekeberghuset» klarte han å bevise sin teori. Det lille huset ble en stor sensasjon, og over 70 000 mennesker kom for å se på det. Noen år senere ble Selvaags kontroversielle tanker nye standarder for boligbygging. Boliger for folk flest Ekeberghuset ble starten på Selvaagbygg, der den energiske sivilingeniøren realiserte boligdrømmene for titusenvis av familier gjennom effektiv seriebygging og helt nye boligtyper. Selvaag lanserte blant annet terrasseblokkene, som ble svært populære. Med slagordet «Boliger for folk flest» bygget Selvaagbygg en rekke store boligområder i og rundt Oslo. Områder som Veitvet, Stovner og Rykkinn fikk også butikker, skoler og andre lokaler som skapte komplette bomiljøer. I 2012 ble entreprenørvirksomheten solgt, og Selvaag Bolig ble etablert som et børsnotert selskap. Selskapet utvikler og selger boligene, men bruker ulike entreprenører til å bygge. Oslo og kommunene rundt Oslofjorden er fortsatt hjemmebane, men Selvaag Bolig satser også i Stavanger, Bergen, Trondheim og Stockholm. Siden 1948 har Selvaag bygget mer enn 60 000 boliger over 75 år. Kunsten å utvikle eiendom Selvaag har ofte overrasket med nye tanker. I 1958 sto boligområdet Veitvet ferdig, med Norges første kjøpesenter! Her var det ikke bare butikker, men også kirke, festsal, ungdomsklubb, bibliotek, bowlinghall, musikkskole, apotek, lege, tannlege, advokat, frisør, skomaker, postkontor, bank, restaurant og lokalavis. I tillegg kom skole og speiderhus. Rett før åpningen ble 23 skulpturer av landets fremste billedhuggere plassert ut. Noe slikt hadde ingen sett før! Siden den gang har både næringseiendom og skulpturer vært en viktig del av Selvaag. I dag eier og driver Selvaag Eiendom en rekke attraktive kontor-, butikk- og serveringslokaler i Oslo. Porteføljen spenner fra handel og servering på Tjuvholmen og Løren, via sentrale kontorbygg, til lager og logistikkbygg. Med slagordet «Kunsten å utvikle eiendom» legger selskapet listen høyt, både for lokaler, drift og utsmykning. Gode hjem for alle Da Olav Selvaag startet sin gjerning, for over 70 år siden, var målet at alle skulle ha råd til å kjøpe sin egen bolig. Man trengte ikke reise langt utenfor Oslo sentrum for å finne rimelige tomter som gjorde dette mulig. I dag gjør høye eiendomspriser at leie er mer aktuelt for mange som vil bo sentralt. Derfor ble Selvaag Utleiebolig lansert i 2019. Selskapets ambisjon er å leie ut nyere leiligheter og skape gode bomiljøer. Selskapet kjøper hele, nye bygg eller oppganger, og ønsker at de som leier skal få minst like gode boliger som de som kjøper bolig. Tanken bak er at alle fortjener gode hjem. Selv om denne satsingen er ny, er det ikke første gang Selvaag satser på utleie. Da eiendomsmarkedet kollapset ved inngangen til 1990-tallet, og få ville kjøpe boliger, fortsatte Selvaag å bygge for egen regning for å sikre de ansatte arbeid. Leilighetene, blant annet i Colosseum Park på Majorstua, ble leid ut i mange år, før markedet ble bedre og boligene ble solgt. Bydeler med gode kvaliteter og attraksjoner Helt siden utbyggingen av Veitvet på 1950-tallet har Selvaag perfeksjonert kunsten å skape levende bo- og bymiljøer. Men den rette miksen av boliger, kontorer, butikker, serveringssteder og attraksjoner har Selvaag sammen med partnere utviklet byområder som Tjuvholmen og Løren i Oslo, og Union brygge i Drammen. Flere av prosjektene har blitt hedret for vellykket byutvikling. Selvaag By, gjennom datterselskapet Snøbyen, gjennomfører nå det som kanskje er Selvaags mest spektakulære forvandlingsprosjekt noensinne. I en åsside inntil E6 ved Lørenskog er verdens største innendørsarena for alpint, langrenn og andre vinteraktiviteter bygget. Arenaen heter SNØ. I tilknytning til SNØ er det hotell, sportsbutikk, treningssenter, trampolinepark og lokaler for en rekke virksomheter som er engasjert i vintersport. Det er også bygget boliger, parkering og andre næringslokaler, og bydelen som omkranser SNØ vil fortsatt være i utvikling gjennom mange år til. Selvaag By eier sammen med Aspelin Ramm Union Eiendomsutvikling, som fokuserer på sentrale byutviklingsprosjekter i Drammen. Forbedrer og fornyer Norske boliger har utviklet seg i takt med velstandsutviklingen i landet. Det som var luksus på 50- og 60-tallet, er for enkelt i dag. Selvaag-boligene fra den gang er pusset opp mange ganger, av generasjoner av beboere. Oppussing inne er noe alle kan gjøre, men når et helt borettslag skal få en ansiktsløftning er det et større prosjekt. Selvaag Prosjekt har spesialisert seg på fornyelse av sameier, og bruker Selvaags nedarvede kunnskap til å oppgradere fasader, terrasser og annet utvending. Selskapet tilbyr også modernisering av baderom. Gjennom god prosjektering og godt håndverk gjøres borettslagene attraktive for nye generasjoner. Realiserer ideer – til glede for generasjoner Selvaag drives i dag av brødrene Olav H. Selvaag og Frederik Selvaag, som er barnebarn av grunnleggeren. Selskapene som er nevnt over, eies helt eller delvis av morselskapet Selvaag, men drives som selvstendige virksomheter. Felles for alle selskapene er kjerneverdiene omtanke og skaperkraft. De speiler både Selvaags historie og eiernes ambisjon. Med utgangspunkt i menneskers behov, og med respekt for ulike ønsker og utgangspunkt, bruker Selvaag skaperkraft til å realisere ideer. Brødrene, som sammen eier Selvaag, vil at virksomheten skal være til glede for samfunnet, både på kort og lang sikt. Det vises blant annet gjennom at Selvaag har utplassert mer enn 600 skulpturer i boligområder, og etablert to store skulpturparker. Tanken er å gi folk kunstopplevelser der de ferdes. Skulpturene er både klatrestativ, tankevekkere og gledesspredere, for unge og gamle. Sammen med innovative eiendomsprosjekter illustrerer de godt Selvaags ønske om å være til glede for generasjoner."
