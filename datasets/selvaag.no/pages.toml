["https://selvaag.no/samfunnsansvar"]
title = "Samfunnsansvar | Selvaag AS"
full_description = "Verdigrunnlag Selvaag har et verdigrunnlag som alle selskapene i konsernet må forholde seg til. Verdigrunnlaget tar for seg de sentrale elementene i begrepet samfunnsansvar, og stiller blant annet krav om at Selvaags virksomhet skal bidra positivt til samfunnet, bidra til å beskytte miljøet og verne om liv og helse. Utplassering av kunst og skulpturer på våre eiendommer, i boligprosjekter og ellers i det offentlige rom, samt engasjement i og økonomisk støtte til utvalgte veldedige formål – som representerer et samfunnsengasjement utover det som skjer gjennom kjerneaktivitetene i konsernet. Ansvar Ansvar selskaper forventes å påta seg for mennesker, samfunn og miljø som påvirkes av virksomheten, dvs. hensyn ut over det som er pålagt ved lov. Samfunnsansvar bør være en integrert del av alle selskapers forretningsstrategi for å sikre at det ivaretas i den daglige drift. Å ta ansvar for mennesker, samfunn og miljø bidrar til å styrke bedriftenes langsiktige konkurransekraft, posisjon og omdømme. Eksempel til etterfølgelse Det betyr mye for Selvaag brødrene å skape gode steder og bidra til samfunnet. Selvaag har et stort samfunnsengasjement og lang erfaring med byutvikling. Allerede på 1950- tallet planla og etablerte selskapet bydelen Veitvet, som datidens første helhetlige bydel. Her ble det bygget både boliger, butikker, musikkskole og kirke. Blandingen av et merkantilt og kulturelt senter var nytt i Norge, og ble et eksempel til etterfølgelse. FOTO: Dagbladet/ Norsk Folkemuseum Den «nye» byen Selvaag viderefører tanken om å skape boområder folk har tilhørighet til, og som de trives i. men kravene til hva som anses som gode bomiljø er annerledes i dag. Vi etterspør nye tjenester og måter å leve livene våre på. Den «nye» byen må svare til disse behovene. Som en del av samfunnsansvaret Selvaag legger vekt på er også utplasseringer av skulpturer og kunst på de ulike boligprosjektene og større bidrag til sånn som Oslo Røde Kors."
