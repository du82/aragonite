["https://selvaag.no/kunst-og-kultur"]
title = "Kunst og kultur | Selvaag AS"
full_description = "Tradisjonen Selvaag har lange tradisjoner med å bruke kunst til å forskjønne omgivelsene. Gleden ved å dele kunst har blitt ført i arv, og startet da sivilingeniør Olav Selvaag utplasserte de første 23 skulpturene på Veitvet i Oslo – der vi i tillegg til boligene bygget landets første shoppingsenter. Mot det moderne Gjennom tre generasjoner har Selvaag satt ut flere enn 600 skulpturer og kunstverk i sine nærings- og boligprosjekter. Flere hundre tusen mennesker har bodd i en Selvaag-bolig og har vokst opp med en bronseskulptur i nabolaget. Mange forbinder derfor Selvaag med figurativ kunst. Peer Gynt-parken på Løren De siste årene har Selvaag tatt skulpturinteressen flere skritt videre, blant annet gjennom etableringen av Peer Gynt-parken på Løren. Her kan du se 23 spennende og flotte skulpturer som illustrerer ”Peer Gynt” av Henrik Ibsen. Skulpturparken på Tjuvholmen Tjuvholmen, som er en av Oslos nyeste bydeler, er bygget ut av Selvaag og Aspelin Ramm Gruppen gjennom selskapet Tjuvholmen KS. Her er Selvaags årelange tradisjon med kunst kombinert med interessen for samtidskunst Skulpturparken på Tjuvholmen åpnet høsten 2012, og inneholder en rekke skulpturer fra noen av etterkrigstidens internasjonalt mest anerkjente kunstnere: Anish Kapoor, Franz West, Louise Bourgeois, Peter Fishli & David Weiss, Ellsworth Kelly og Paul McCarthy. Skulpturparken er tegnet av den verdenskjente arkitekten Renzo Piano. Det er også han som har tegnet det nye Astrup Fearnley museet på Tjuvholmen. I still believe in Miracles De siste 20 årene har Olav og Gunnar Frederik Selvaag bygd opp en betydelig samling av samtidskunst, og i 2018 viste de deler av samlingen i utstillingen «I Still Believe in Miracles» på Astrup Fearnley Museet. Dette prosjektet var en mulighet for å kombinere Selvaags årelange tradisjon med kunst, med interessen for samtidskunst. Selvaag Art Collection Les mer om samlingen på Selvaag Art Collection sine hjemmesider. Selvaag Art Collection"
