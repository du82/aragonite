full_description = 'Semantic Scholar APIOverviewTutorialDocumentationGalleryCite the PaperSemantic Scholar API - OverviewProviding a reliable source of scholarly data for developersBuild projects that accelerate scientific progress with the Semantic Scholar Academic Graph APICode ExamplesQ&A BankRequest an API KeyAPI Service Status PageRead the PaperWhy use Semantic Scholar API?The Semantic Scholar REST API allows you to find and explore scientific publication data about authors, papers, citations, venues, and more. The API is organized into the following services:Academic Graph: Provides data about authors, papers, citations, venues, SPECTER2 embeddings, and more that allows you to link directly to the corresponding page on semanticscholar.org for more information.Recommendations: Provides recommended papers similar to a given paper.Datasets: Provides downloadable links of datasets in the academic graph.To learn more about our API service, read The Semantic Scholar Open Data Platform paper.Get StartedSemantic Scholar providing infrastructure for the research ecosystem is exciting as it enables partners like Litmaps to focus on creating great experiences for end users. We found the Semantic Scholar API and bulk data, clear and straightforward to use. The documentation, examples, and easy access to the raw data allowed us to move quickly on data integration, and get back to solving problems for our users.Axton PittCo-founder and CTO, LitmapsEddie SmolyanskyCo-founder, Connected PapersSince day 1 Connected Papers has been built on top of the Semantic Scholar Open Corpus and APIs, and heavily relies on them to provide paper discovery and search capabilities to our users. The APIs are well maintained, frequently updated, fast, and easy to use. The team is extremely responsive and has supported our growth every step of the way from open beta to a million users. This massive resource given to the public for free is a great driver for innovation in science and we are proud to be a part of the next layer of tools being built on top of it.We are a startup that tracks the evolution and progress of AI research. Thanks to the Semantic Scholar API pulling in the latest references to papers from top AI conferences has been a really simple task. Otherwise, it would have taken much more time and effort.Eduardo Antonio Espinosa GrimaldoFounder, Stateoftheart AIElman MansimovCo-Owner, Sourcely and YomuWe at Sourcely have migrated to the Semantic Scholar API to provide academic references to students writing their essays, and our experience working with academic references APIs has never been better. Not only is the Semantic Scholar API very easy to use, quick, and reliable, but it also incorporates a lot of additional metadata like PDF URLs, abstract, summarization, and more, that are not easily accessible with other academic reference providers like Google Scholar. Students love the references provided by Semantic Scholar API and their experience on Sourcely has improved since migration. On top of that, the Semantic Scholar team has been very helpful in answering our questions and considering our feedback.Access Our Continually Updating Corpus214 MillionPapers2.49 BillionCitations79 MillionAuthorsDo I need an API Key?Most Semantic Scholar endpoints are available to the public without authentication, but they are rate-limited to 1000 requests per second shared among all unauthenticated users. Requests may also be further throttled during periods of heavy use.Certain endpoints require authentication via an API key, and authenticated users have access to higher rate limits. As a best practice, we recommend including your API key with every request. Using an API key will also help us better support you when you need additional help.The introductory rate limit for an API key is 1 RPS on all endpoints.You will receive your private API key via email. Do not share your key with anyone.Request an API keyAdditional ResourcesWe also provide the following datasets as free and open resources.Semantic Scholar Academic Graph Dataset (S2AG)Download records for research papers published in all fields as an easy-to-use JSON archiveSUPP.AIAn AI-curated corpus of supplements, drugs, and interactionsS2ORCA general purpose corpus for NLP and text mining research over scientific papers hbspt.forms.create({ region: "na1", portalId: "5910970", formId: "105f3885-cfd8-4b57-a570-6174c5c1650a" });'
