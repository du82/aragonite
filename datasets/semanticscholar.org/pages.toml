["https://semanticscholar.org/about"]
title = "Semantic Scholar | About Us"
description = "We are motivated to use AI in novel ways for a dramatic impact. Tackling our problems with AI not only helps our community, it also improves the quality of our AI research by grounding it in real-world application."
full_description = "About Semantic ScholarOverviewPublishersBlogAI2 CareersAbout Semantic ScholarHelping Scholars Discover New InsightsSemantic Scholar provides free, AI-driven search and discovery tools, and open resources for the global research community. We index over 200 million academic papers sourced from publisher partnerships, data providers, and web crawls.Our MissionAccelerating Scientific Breakthroughs Using AI We are a Research and Product Development team within Ai2 building a better way to search and discover scientific knowledge.Developed in-house, our state-of-the-art models process and classify papers in our pipeline. We distribute open code and datasets while publishing results of our research in the areas of Natural Language Processing, Machine Learning, Human Computer Interaction, and Information Retrieval.AI-Driven Tools for ScholarsStaying up-to-date with scientific literature is an increasingly pressing challenge for scholars. With Semantic Scholar, researchers can understand a paper at a glance. Our system extracts meaning and identifies connections from within papers, then surfaces these insights to help Scholars discover and understand research.Learn MoreOur ValuesOur Values reflect who we are, why we are building Semantic Scholar, and guide us through hard decisions.Apply AI CreativelyWe are motivated to use AI in novel ways for a dramatic impact. Tackling our problems with AI not only helps our community, it also improves the quality of our AI research by grounding it in real-world application.Promote Equal Access to ScienceScientific knowledge should be available to everyone. We recognize that the status quo disproportionately benefits certain groups of scholars over others. As a non-profit, we evaluate the impact of our choices and pursue directions that help balance the scales.Be CollaborativeCollaboration makes us stronger. We make a conscious effort to collaborate with our teammates, and by doing so, we will both improve the quality of our work and distribute the burden of support.Take Bold MeasuresWe are small, but mighty. We stand behind our convictions when we believe they are the right direction, even if that is a more difficult path. We question what has been done historically, never satisfied with the status quo.Learn EarlyWe aim to gain knowledge sooner by starting conversations early and by prototyping our ideas quickly. When we realize a path we have chosen is not working, we are willing to recognize it openly and do the work to learn from it.Be Trustworthy and TransparentWe aim to establish a higher standard for applying AI in a trustworthy and transparent way. By educating and building trust in our AI-driven solutions, we will foster a community who are invested in our success and patient with our mistakes.Resources for the Global Research CommunityWe provide a free, reliable source of scholarly data for developers to build projects that accelerate scientific progress. The Semantic Scholar Academic Graph (S2AG) Dataset and APIs provide records for research papers published in all fields provided as an easy-to-use JSON archive. The Semantic Scholar Open Research Corpus (S2ORC) is a general purpose corpus for NLP and text mining research over scientific papers built and maintained by Semantic Scholar’s research team. Papers are aggregated into a unified source to create the largest publicly-available collection of machine-readable academic text, provided as a JSON archive.AI For The Common GoodAt Ai2, our mission is building breakthrough AI to solve the world's biggest problems.Semantic Scholar was launched in 2015 as a groundbreaking project at Ai2, a non-profit research institute founded in 2014 with the mission of conducting high-impact AI research and engineering in service of the common good. Ai2 is the creation of Paul Allen, Microsoft co-founder.Our FounderBoard of DirectorsScientific Advisory BoardAre you interested in our mission? Join the team!View OpeningsIndustry PartnersPartnering with 50+ Publishers and Scholarly SocietiesReach millions of scholars by integrating your academic content into Semantic Scholar's knowledge graphLearn MoreJoin Our Beta ProgramHelp improve the future of scholarly researchJoin our Beta Program to provide feedback and help scholars around the globeLearn MoreMediaBrand ToolkitDownload logos, illustrations, and brand guidelinesDownload"
