title = "Release Notes | Semantic Scholar"
description = "See the latest feature releases and product improvements on Semantic Scholar."
full_description = "Semantic Reader: After months of collecting user feedback, we've decided that Hypothesis is not the right fit for Semantic Reader. As a result, we will be removing the Hypothesis integration from Semantic Reader on January 31st, 2024. If you've created annotations within Semantic Reader, don't worry—you can still access your notes by directly logging into Hypothesis. You can also continue using Hypothesis in Semantic Reader by installing the Hypothesis browser extension. Venue pages: You can now browse through papers from a certain venue! Click on the conference or journal shown on paper pages or search results to see a full list of papers from the venue, along with useful search filters. Ask This Paper: You can now ask questions about a paper and get AI-generated answers along with supporting statements from the paper! From the Ask This Paper section on paper pages, select a suggested question or enter your own questions about the paper. Note that Ask This Paper has been tested only on English-language papers and is available on limited papers. Visit FAQ for more details. Topic pages: You can now explore topics in Computer Science fields by navigating to the Topics section on paper pages! We aim to help scholars get a quick overview of any topic of interest by collecting AI-generated definitions, papers often cited for the topic, recent papers on the topic, and related topics. Semantic Reader: We've fixed a few accessibility issues on Semantic Reader! Citation cards are now a lot easier to navigate via screen readers. Semantic Reader: Semantic Reader just got 3 times faster! We understand how loading time impacts your experience, and we’ve worked on some changes that significantly improved the loading time. The Semantic Reader Open Research Platform: We’re releasing open-source libraries and prototypes that enable the broader research community to explore exciting challenges around novel research support tools! Join us in designing the future of scholarly reading interfaces: https://openreader.semanticscholar.org"
