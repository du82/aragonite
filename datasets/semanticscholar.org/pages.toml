["https://www.semanticscholar.org/faq"]
title = "Semantic Scholar | Frequently Asked Questions"
description = "Answers to commonly asked questions about Semantic Scholar."
full_description = '''ResourcesFrequently Asked QuestionsQuick LinksAboutAccountAI-FeaturesAlertsCitationsContentCorrectionsClaim Author PageLibraryPersonalized To YouResearch FeedsSearchSemantic ReaderThank you! Your submission has been received!Oops! Something went wrong while submitting the form.ClearAboutText LinkWhat is the advantage of using Semantic Scholar instead of other academic search engines?Semantic Scholar is a free, AI-powered search and discovery tool that helps researchers discover and understand scientific literature that's most relevant to their work.Semantic Scholar uses machine learning techniques to extract meaning and identify connections from within papers, then surfaces these insights to help scholars gain an in-depth understanding quickly.Our mission is to accelerate scientific breakthroughs by using AI to help scholars locate and understand the right research, make important connections, and overcome information overload.If you're a new user, check out our tutorials.Text LinkDoes Semantic Scholar offer programmatic access to its data through an API or downloadable dataset?Semantic Scholar is committed to supporting high-impact research and engineering by providing universities and organizations with access to our data.For information about programmatic access to Semantic Scholar's data, please visit:Semantic Scholar Academic Graph (S2AG) RESTful API at www.semanticscholar.org/product/apiSemantic Scholar Academic Graph (S2AG) downloadable datasets updated monthly at api.semanticscholar.org/corpusAcademic Conference Peer Review Service at api.semanticscholar.org/api-docs/peer-reviewS2ORC, a general-purpose corpus for NLP and text mining, at github.com/allenai/s2orcWe request that any published research using this data provides proper citing.Additionally, please visit our Research page to view projects that contribute to some of the features you use on Semantic Scholar. Below each project are links to papers, demos, and GitHub repositories that host datasets, software, and code.Text LinkHow many articles does Semantic Scholar currently index?Our corpus is constantly expanding. See the search bar to get the current number of articles.Text LinkI would like permission to use, publish, or distribute part of a paper for my work.In order to obtain permission to use, publish, or distribute any part of a paper listed on our site, please contact the author or publisher directly.Semantic Scholar is an academic search engine and we are unable to provide the proper permissions on behalf of the authors and publishers whose content is discoverable on our site.Text LinkWhich browsers does Semantic Scholar support?We support the latest versions of the most popular browsers including desktop and mobile versions of Mozilla Firefox, Microsoft Edge, Google Chrome, and Apple Safari. If you discover an issue in your browser, please contact us.Text LinkIs Semantic Scholar available as a mobile application?We currently do not have a smartphone app, but www.semanticscholar.org is designed to be easily accessed on both desktop and mobile devices.Text LinkDoes Semantic Scholar support any claims made within research papers found on the site?Semantic Scholar does not endorse or support any claims made within any papers currently available on the site. As an academic search engine and discovery tool, Semantic Scholar is not engaged in any editorial decisions in the publishing process.The goal of Semantic Scholar is to leverage AI research and engineering to utilize methods from data mining, natural-language processing, and computer vision to help researchers discover and understand scientific papers.Text LinkWhat is a "Beta" feature?A Beta feature is one that we make available early while our engineers are still actively working on it. Beta features often still have rough edges and continue to evolve quickly, and we especially welcome feedback on them.To get exclusive access to new features and to help us shape the future of scholarly research, we invite you to join our Beta Program.Text LinkWhat is a TLDR?A TLDR is an AI-generated summarization for a scientific paper that helps researchers quickly determine the key important aspects of a paper. These extreme paper summaries are an alternative to abstracts, intended to help researchers navigate and understand scientific literature easily and efficiently.TLDRs are currently limited to the computer science and biomedical domains. To find out more about TLDRs, see our TLDR page, try our demo, or read the paper on Semantic Scholar.Text LinkHow does Semantic Scholar support libraries?For information on how Semantic Scholar can help your researchers, please visit our Librarian Resources page.Text LinkHow does Semantic Scholar determine a paper’s Field of Study?Semantic Scholar assigns Field of Study using a machine learning classification model based on a paper’s title and abstract. A paper may be assigned up to three Fields of Study. Field of Study classification is currently limited to English-language papers. It is most reliable when both title and abstract are available, but works on just titles as well. If a paper’s title is too ambiguous, it may not be assigned any Field of Study. To learn more about Field of Study classification on Semantic Scholar, see our blog post.Text LinkDoes Semantic Scholar support integration with Zotero?Yes, you can use Zotero in multiple ways on Semantic Scholar:Semantic Reader: You can save any paper in Semantic Reader. By selecting the Zotero extension on your browser, the paper information, URL, PDF, and TLDR (if available) will be sorted and saved to your Zotero library. You can then easily reopen a paper in Semantic Reader from Zotero and read with AI-powered augmentations such as citation cards.Paper page: You can save any paper on any paper page. By selecting the Zotero extension on your browser, the paper information, URL, PDF (if available), and TLDR (if available) will be sorted and saved to your Zotero library.Search results page: You can bulk save multiple papers on any search results page. By selecting the Zotero extension on your browser and selecting the paper(s) you want to save on that page, the paper information, URL, PDF (if available), and TLDR (if available) will all be sorted and saved to your Zotero library.AccountText LinkWhat are the benefits of creating an account?Creating a Semantic Scholar account enables you to:Create email alerts for new papers.Generate research feeds for new paper recommendations.Save papers that you'd like to revisit in a library.Claim an author page so you can better manage your author details and papers.Please note that you do not need to create an account to access papers on Semantic Scholar.Text LinkHow do I create an account on Semantic Scholar?To create a Semantic Scholar account:Visit any page on the Semantic Scholar site at www.semanticscholar.org.In the top right corner, select Create Free Account.In the pop-up window, select how you’d like to create an account using your institutional email, Google, Facebook, or your email and password.Enter your sign-in credentials.Please note that Semantic Scholar does not collect any sign-in information such as username or password. You do not need to create an account to access papers on Semantic Scholar.Text LinkHow do I sign in with my institution?Semantic Scholar partners with Open Athens to provide a privacy-focused institutional sign-in option.To see if your institution is currently supported, select Sign In with Your Institution during sign-in or when creating a free account and search for your organization.When signed in with your institution, you can access full-text articles that your institution subscribes to. For more details, see How do I access a PDF using my institutional affiliation?Text LinkI'm having trouble signing in to my Semantic Scholar account.Starting from April 27th, 2023, we no longer support Twitter-authenticated accounts.Starting from December 11th, 2024, we no longer support Facebook-authenticated accounts.Semantic Scholar does not collect sign-in information.If you created an account using your Google credentials, see their password recovery options.If you created an institutional account, contact the institution.If you created an account using an email address and password, select the Forgot Password link on the Sign In page.Text LinkI forgot my password and I cannot sign in.Semantic Scholar does not collect emails and passwords.If you created an account using a sign-in provider such as Google, Facebook, or your institution, please reach out to the sign-in provider you used when creating your account.If you did not create your account using any of our sign-in providers, select the Forgot Password link and follow the prompts.Text LinkHow do I manage my email preferences?To manage your email preferences:Sign in to your Semantic Scholar account.Under 'Account' in the top right corner, select Settings from the dropdown menu.Under 'Settings,' go to Contact Preferences.From here, you can disable any existing subscription by sliding the toggle next to the listed options. You may also select Unsubscribe from all subscriptions if you no longer wish to receive updates.You can also access and edit your alert preferences by selecting the Manage Preferences link located in the footer of the emails you receive from Semantic Scholar.AI-FeaturesText LinkWhat should I be cautious of when using features that employ generative AI?Since text in these features is generated by a language model, it will not be free of errors, and the errors could be difficult to detect. Possible errors include:Factual inaccuracies. Most of these will be subtle, but some may be serious factual errorsAwkwardly phrased answersIrrelevant informationWhile we generally found models to be accurate, you should verify the accuracy of generated text whenever possible.Features that use generative AI include:Ask This PaperGenerative Term UnderstandingText LinkHow are questions answered by Ask This Paper?We query OpenAI’s gpt3.5-turbo-16k with the content of the current paper alongside your question; the model returns an answer, along with one or more supporting statements from the paper. We find the closest text to snippets in the original paper and display it to you alongside the model answer. Note that our system has only been tested on English-language papers and is available on a subset of papers.Text LinkWhat kinds of questions can Ask This Paper handle?Ask This Paper is designed to work on questions which can be answered by the current paper. There are a few predefined questions that we find generally work well, however, we encourage you to try new questions. We are always learning more about the abilities of this experimental system.Questions you can try:What is the goal of this paper?What are the key results of this paper?What methods are used?How is the system evaluated?What is the baseline condition?How did the paper differentiate the proposed approach with prior work?Text LinkHow are terms defined in the Semantic Reader?When you click on an underlined term in the Semantic Reader, we ask ChatGPT to provide a definition for the given term in the context it appears in.Text LinkWhich terms are definable in the Semantic Reader?We identify scientific terms by extracting noun-phrases from the text. We filter these noun-phrases using methods inspired by this paper, plus some hand-tuned rules-based filtering.Text LinkWhat are Topic pages?Topics are phrases in research papers that are often accompanied by citations. Topic pages aim to help scholars quickly understand a field by synthesizing concepts from several papers that mention or explain the topic with generative AI, including:Definition of the topicRelated topicsPapers often cited for this topicRecent papers that mention this topicText LinkWhy don’t I see topics for a paper I’m interested in?Currently, only topics in the Computer Science field are available. To see if a topic is available, you can directly search for it from the search bar on any Topic page.Text LinkHow are Topic pages generated?We use large language models (LLMs) to extract a list of topics from the title and abstract of a paper. Subsequently, we leverage these models to generate definitions and descriptions using relevant snippets from the single most cited paper for a topic.AlertsText LinkWhat is the benefit of receiving email alerts from Semantic Scholar?Creating email alerts helps to stay up-to-date on authors, papers, and topics in your field of study. Email alerts are a tool for tracking the latest developments in your field and enable you to survey and assess the impact of research available on Semantic Scholar.Text LinkWhat type of alerts does Semantic Scholar offer?Author Alerts: New citations and papers for a specific author to assess the author’s impact.Paper Alerts: New citations for a specific paper to keep track of how it is impacting related research.Topic Alerts: New papers that mention a research topic to stay up-to-date on the latest papers in a given research field.Research Feed Alerts: New papers based on your Research Feed ratings.Text LinkHow do I create an alert?To create a new alert for an author, visit the author page for the author you’re interested in. In the left panel below the author's name, select Create Alert. Choose whether you wish to create an alert for new citations or newly published papers for that author. Confirm by selecting Create Alert.To create an alert for a paper or topic, visit the paper or topic page you’re interested in. Select Create Alert located below the paper abstract or select Create Alert located below the topic description.When you create a research feed, you will automatically receive email alerts once you rate five relevant papers with More Like This and three non-relevant papers with Less Like This.Text LinkHow do I edit my alert preferences?To edit your alerts preferences:Sign in to your Semantic Scholar account.Under 'Account' in the top right corner, select Settings from the dropdown menu.Under 'General Settings,' select Alert Preferences.Select Alert Email Address to specify where you would like to receive email alerts. Any email address you enter will need to go through a verification process before you will receive alerts.Choose your Alert Frequency by selecting 'Once a Day' or 'Once a Week.'To enable or disable an existing alert, click the sliding icon to the left of the alert title. If enabled, the toggle will be blue. If disabled, the toggle will be gray. To delete an existing alert entirely, click the X icon to the right of the alert.You can also access and edit your alert preferences by selecting the Manage Alerts link located at the bottom of your alert emails.Text LinkHow do I enable, disable or delete existing alerts?To enable, disable or delete existing alerts:Sign in to your account using the sign-in link in the top right corner.Under 'Account' in the top right corner, select Settings f'''
year_published = 2025
clearnet = "https://www.semanticscholar.org/faq"
