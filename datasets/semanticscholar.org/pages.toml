full_description = '''Tutorial VideosLearn how to use our AI-powered academic search engineQuick Links101: Citations Overview101: Search101: Paper Pages101: Citations OverviewWith billions of citations, Semantic Scholar provides a scientific literature graph that allows scholars to navigate and discover the most relevant research across all fields of study. Our novel citation features allow you to discover highly influential works and easily search a paper's citations. This video covers:Classifications: Citations are classified by 'Cites Results', 'Cites Methods', or 'Cites Background'Highly Influential Citations: Identifies important citations in the literatureSearch, Sort, Filter: Quickly search and filter a paper's citationsView TranscriptHide Transcript"Semantic Scholar is an AI-powered research tool for scientific literature. With billions of citations, Semantic Scholar provides a citation graph that allows scholars to navigate and discover the most relevant research across all fields of study. We offer many ways to explore our citation graph, including our novel method of classifying citations by type and influence, as well as searching citations.Our system indexes billions of citations, using AI models to classify the intent and predict the influence of each. We’ve identified three classification types; cites background, cites methods, and cites results. You can find citation type by scrolling to the citations listed for any paper and using the citation type filter to identify papers that cites background, cites methods, or cites results.While many citations are incidental, Semantic Scholar classifies some citations as being “Highly Influential,” allowing scholars to quickly determine which publications to read in depth. Find highly influenced citations sorting by Most Influenced Papers or scanning for the Highly Influenced paper badge under each paper title.Searching citations of a paper helps researchers quickly navigate through a large list of citations and narrow results down to the most relevant. To get the most out of this feature, search for a keyword in the paper title, filter by date range, citation or publication type, author, or, filter by a specific conference or field of study. You can also sort by relevance, most influenced papers, citation count, or recency.Explore citations to discover new research on semanticscholar.org."101: SearchNavigate through millions of scientific papers in all fields of study by searching our corpus.In this video learn search best practices like:Selecting 'Field of Study' to find literature from a particular domainSpecifying a date range or select 'This Year' to find the most recent literatureRefining results further by choosing a Publication Type, Authors, or Journals and Conferences View TranscriptHide Transcript"Semantic Scholar is an AI-powered search and discovery tool used by millions of scholars globally each month, and supports hundreds of thousands of scholarly searches each week.Our mission is to empower researchers to fight information overload. Searching on our platform enables scholars to navigate through hundreds of millions of papers in all scientific domains.So, how does it work?Underlying all of Semantic Scholar is a deep semantic analytic engine that helps researchers understand the meaning of a paper. Natural language processing and machine learning models rank the results by relevance, all to help you quickly find the most up-to-date research in your field.To get started, visit semanticscholar.org and enter a search for a paper, author, topic, or keyword. You can further refine your search results using our many filter options.Select field of study to find literature from a particular domain.If you're looking for recent research, filter your results down to the past two years.You can also filter by publication type, authors, or journals and conferences.Clicking on a paper title will take you to our paper pages. To learn more about Semantic Scholar paper pages, watch the tutorial. Find new research at semanticscholar.org."101: Paper PagesSemantic Scholar's corpus includes nearly 200 million academic papers across all domains, including biomedicine, computer science, business, history, and economics.Our system extracts key information from papers and presents it on the Paper Page for review. Learn how to:Browse videos, presentations, code libraries, and clinical trialsGet a glimpse at a paper’s figures, tables, and topicsSkim news or blog articles discussing a paperNavigate citations and references to find connections to other papersView TranscriptHide Transcript"Semantic Scholar is a free, AI-powered research tool for scientific literature used by more than 8 million scholars globally.With nearly 200 million papers across all scientific domains, Semantic Scholar provides professional scholars like researchers, engineers, clinicians, and scientists with free, AI-powered tools to quickly find the research that is most relevant to their work.To get started, visit semanticscholar.org and search for a paper, author, topic, or keyword. You can filter by field, date range, conference, and more to refine the search results as well as sort by relevance or recency.On a paper page, you can browse videos, presentations, code libraries, and clinical trials. Get a glimpse at a paper’s figures, tables, and topics, skim news or blog articles discussing a paper, and navigate citations and references to find connections to other papers.Our system indexes citations for millions of publications, using AI models to classify the intent and predict the influence of each. With a free account, you can save papers for later reading, create an alert to get email notifications for a paper, cite the paper, or launch a research feed for new recommendations based on your ratings. Visit semanticscholar.org to get started."'''
year_published = 2025
clearnet = "https://semanticscholar.org/product/tutorials"
