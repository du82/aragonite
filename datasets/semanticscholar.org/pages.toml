["https://semanticscholar.org/product/semantic-reader"]
title = "Semantic Scholar | Semantic Reader"
description = "An AI-powered augmented scientific reading application from the Semantic Scholar team at the Allen Institute for AI, UC Berkeley, and the University of Washington, and supported in part by the Alfred P. Sloan Foundation"
full_description = "Introducing Semantic ReaderAn AI-Powered Augmented Scientific Reading ApplicationWhat is Semantic Reader?Semantic Reader is an augmented reader with the potential to revolutionize scientific reading by making it more accessible and richly contextual.Studies have uncovered many points of friction that break the flow of comprehension when reading technical papers:Frequently paging back and forth looking for the details of cited papersChallenges recognizing the same work across multiple papersLosing track of reading history and notesContending with a PDF format that is not well suited to mobile reading or assistive technologies such as screen readersTo create a better reading experience, Semantic Reader uses artificial intelligence to understand a document’s structure and merge it with the Semantic Scholar’s academic corpus, providing detailed information in context via tooltips and other overlays. If you’re logged-in, Semantic Reader integrates with your library and, over time, will incorporate personalized contextual augmentations as well.A Revolutionary Reading ExperienceSemantic Reader is now available for most arXiv papers on Semantic Scholar with a growing set of features.Citations Cards that show details of a cited paper in-line where you’re reading, including TLDR summariesTable of Contents to quickly navigate between sections (availability varies)Save to Library to conveniently track your reading listPersonalized In-line CitationsWith the volume and variety of citations during literature review, it can be challenging to prioritize which ones to explore. In Semantic Reader, citations within a paper are visually augmented based on their connections to your research activities, such as saved in your library or cited by a paper in your library.If you have at least one paper in your library, this feature is available on desktop devices for you! For more details, visit our FAQ.‍Skim Papers FasterFind key points of a paper using AI-generated highlighted overlays with 3 category labels: Goal, Method, and Result. Customize the number of highlights and the opacity of highlights from the side panel to create your own experience.Now available on most English-language arXiv papers in computer science fields.Try ItSkimming ExamplesBERT: Pre-training of Deep Bidirectional Transformers for Language UnderstandingALBERT: A Lite BERT For Self-supervised Learning of Language RepresentationsLLaMA: Open and Efficient Foundation Language ModelsScim: Intelligent Skimming Support for Scientific PapersOpen Resources for the CommunityCreate innovative research tools with resources and demos on the Semantic Reader Open Research Platform. Access open-source libraries for PaperMage and PaperCraft to build intelligent and interactive paper readers. Discover interactive prototype demos developed with these tools.Explore the Semantic Reader Open Research PlatformDefinitions On-DemandLearn definitions for words and acronyms without losing your place in the paper.Simply click any term with a dotted underline and get an AI-generated definition based on its context in the paper.For more instructions on using this feature in Semantic Reader, visit our FAQ.Annotate and HighlightWith Hypothesis integration, Semantic Reader allows you to highlight and take notes while reading papers.To access the Annotations panel, highlight some text in Semantic Reader and select Annotate or Highlight. From the panel, sign up for a Hypothesis account and log in. From there, you can post annotations, review your annotations anytime, and share them with others.For more instructions on using Hypothesis in Semantic Reader, visit our FAQ or Hypothesis help articles.Try Out Semantic ReaderHere are examples of Semantic Reader operating over popular Computer Science papers across various subfields. The current design is best experienced on a full-size screen.NLPNatural Language ProcessingDeep Speech 2: End-to-End Speech Recognition in English and MandarinALBERT: A Lite BERT for Self-supervised Learning of Language RepresentationsGoogle’s Multilingual Neural Machine Translation System: Enabling Zero-Shot TranslationCVComputer VisionLong-term Recurrent Convolutional Networks for Visual Recognition and DescriptionDeep Laplacian Pyramid Networks for Fast and Accurate Super-ResolutionRethinking the Inception Architecture for Computer VisionMLMachine LearningConditional Generative Adversarial NetsLearning Important Features Through Propagating Activation DifferencesWaveNet: A Generative Model for Raw AudioPixel Recurrent Neural NetworksPowered by State-of-the-Art ResearchSemantic Reader is based on research from the Semantic Scholar team at AI2, UC Berkeley and the University of Washington, and supported in part by the Alfred P. Sloan Foundation.Augmenting Scientific Papers with Just-in-Time, Position-Sensitive Definitions of Terms and SymbolsSeptember 2020CHITLDRThis work introduces ScholarPhi, an augmented reading interface with four novel features: tooltips that surface position-sensitive definitions from elsewhere in a paper, a filter over the paper that “declutters” it to reveal how the term or symbol is used across the paper, automatic equation diagrams that expose multiple definitions in parallel, and an automatically generated glossary of important terms and symbols.CiteRead: Integrating Localized Citation Contexts into Scientific Paper ReadingMarch 2022IUITLDRA novel paper reading experience that integrates relevant information about follow-on work directly into a paper, allowing readers to learn about newer papers and see how a paper is discussed by its citing papers in the context of the reference paper.Scim: Intelligent Faceted Highlights for Interactive, Multi-Pass Skimming of Scientific PapersMay 2022ArXivTLDRScim is presented, an AI-augmented reading interface designed to help researchers skim papers by automatically identifying, classifying, and highlighting salient sentences, organized into rhetorical facets rooted in common information needs."
year_published = 2025
