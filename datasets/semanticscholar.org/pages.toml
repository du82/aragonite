["https://semanticscholar.org/product/api%2Ftutorial"]
title = "Tutorial | Semantic Scholar Academic Graph API"
description = "Quick guide to get started with Semantic Scholar Academic Graph API."
full_description = '''Semantic Scholar APIOverviewTutorialDocumentationGalleryCite the PaperSemantic Scholar API - TutorialGet Started with Semantic Scholar APILearn to search for papers and authors, download datasets, and moreIntroductionWhat is an API?The Semantic Scholar APIsHow to make requests faster and more efficientlyExample: Request paper detailsMake Calls to the Semantic Scholar APIStep 1: Keyword search for relevant papersStep 2: Get recommended papersStep 3: Look up authorsAdditional ResourcesPaginationExamples using search query parametersHow to download full datasetsHow to update datasets with incremental diffsTips for working with downloaded datasetsIntroductionThe Semantic Scholar REST API uses standard HTTP verbs, response codes, and authentication. This tutorial will teach you how to interact with the API by sending requests and analyzing the responses. All code examples are shown in Python. If you prefer a code-free experience, follow along using the Semantic Scholar Postman Collection, which lets you test out the API on Postman, a popular and free API testing platform.What is an Application Programming Interface (API)?An API is a structured way for applications to communicate with each other. Applications can send API requests to one another, for instance to retrieve data.Each API request consists of:An API endpoint, which is the URL that requests are sent to. The URL consists of the API’s base URL and the specific endpoint’s resource path (See Figure 1).A request method, such as GET or POST. This is sent in the HTTP request and tells the API what type of action to perform.Figure 1. The endpoint for Semantic Scholar’s paper relevance search endpoint.Each API request may also include:Query parameters, which are appended to the end of the URL, after the resource path.A request header, which may contain information about the API key being used.A request body, which contains data being sent to the API.After the request is sent, the API will return a response. The response includes a status code indicating whether the request was successful and any requested data. The response may also include requested data.Common status codes are:200, OK. The request was successful.400, Bad Request. The server could not understand your request. Check your parameters.401, Unauthorized. You're not authenticated or your credentials are invalid.403, Forbidden. The server understood the request but refused it. You don't have permission to access the requested resource.404, Not Found. The requested resource or endpoint does not exist.429, Too Many Requests. You've hit the rate limit, slow down your requests.500, Internal Server Error. Something went wrong on the server’s side.The Semantic Scholar APIsSemantic Scholar contains three APIs, each with its own unique base URL:Academic Graph API returns details about papers, paper authors, paper citations and references. Base URL: https://api.semanticscholar.org/graph/v1Recommendations API recommends papers based on other papers you give it. Base URL: https://api.semanticscholar.org/recommendations/v1Datasets API lets you download Semantic Scholar’s datasets onto your local machine, so you can host the data yourself and do custom queries. Base URL: https://api.semanticscholar.org/datasets/v1See the Semantic Scholar API documentation for more information about each API and their endpoints. The documentation describes how to correctly format requests and parse responses for each endpoint.How to make requests faster and more efficientlyHeavy use of the API can cause a slowdown for everyone. Here are some tips to avoid hitting rate limit ceilings and slowdowns when making requests:Use an API Key. Users without API keys are affected by the traffic from all other unauthenticated users, who share a single API key. But using an individual API key automatically gives a user a 1 request per second rate across all endpoints. In some cases, users may be granted a slightly higher rate following a review. Learn more about API keys and how to request one here.Use batch endpoints. Some endpoints have a corresponding batch or bulk endpoint that returns more results in a single response. Examples include the paper relevance search (bulk version: paper bulk search) and the paper details endpoint (batch version: paper batch endpoint). When requesting large quantities of data, use the bulk or batch versions whenever possible.Limit “fields” parameters. Most endpoints in the API contain the “fields” query parameter, which allows users to specify what data they want returned in the response. Avoid including more fields than you need, because that can slow down the response rate.Download Semantic Scholar Datasets. When you need a request rate that is higher than the rate provided by API keys, you can download Semantic Scholar’s datasets and run queries locally. The Datasets API provides endpoints for easily downloading and maintaining Semantic Scholar datasets. See the How to Download Full Datasets section of the tutorial under Additional Resources for more details.Example: Request paper details (using Python)Now we’ll make a request to the paper details endpoint by running Python code. Complete the steps listed under Prerequisites below before proceeding. If you prefer to follow along in Postman, the same request in Postman is located here. For more examples of API requests using Python, see the section Make Calls to the Semantic Scholar API.Prerequisites:Install Python if it is not already on your machine.Install pip, Python's package manager, if it is not already on your machine.According to the Academic Graph API documentation, the paper details endpoint is a GET method and its resource path is /paper/{paper_id}.Figure 2. Each endpoint's resource path is listed in the API documentation.When combined with the Academic Graph base URL, the endpoint’s URL is: https://api.semanticscholar.org/graph/v1/paper/{paper_id}The curly brackets in the resource path indicate that paper_id is a path parameter, which is replaced by a value when the request is sent. Accepted formats for the value of paper_id are detailed in the Path Parameters section of the documentation.Figure 3. Accepted formats are listed in the Path Parameters section.The Query Parameters section of the documentation only lists a single optional parameter: fields. The fields parameter takes a string of comma-separated field names, which tell the API what information to return in the response.Figure 4. Fields that can be returned in the response are listed in the Response Schema section of Responses.For our Python request, we'll query the same paper ID given in the documentation’s example. We'll request the paper’s title, the year of publication, the abstract, and the citationCount fields:import requests paperId = "649def34f8be52c8b66281af98ae884c09aef38b" # Define the API endpoint URL url = f"http://api.semanticscholar.org/graph/v1/paper/{paperId}" # Define the query parameters query_params = {"fields": "title,year,abstract,citationCount"} # Directly define the API key (Reminder: Securely handle API keys in production environments) api_key = "your api key goes here" # Replace with the actual API key # Define headers with API key headers = {"x-api-key": api_key} # Send the API request response = requests.get(url, params=query_params, headers=headers) # Check response status if response.status_code == 200: response_data = response.json() # Process and print the response data as needed print(response_data) else: print(f"Request failed with status code {response.status_code}: {response.text}")Note that this request is using an API key. The use of API keys is optional but recommended. Learn more about API keys and how to get one here.We are using the Python Requests library to send the request. So we know the response has a property named status_code that returns the response status. We check the status_code and either print the successfully returned data or the error message.See the API documentation for how the response is formatted. Each Status Code section expands with further details about the response data that is returned.Figure 5. The Responses section describes how responses are formatted.When the request is successful, the JSON object returned in the response is:{ "paperId": "649def34f8be52c8b66281af98ae884c09aef38b", "title": "Construction of the Literature Graph in Semantic Scholar", "abstract": "We describe a deployed scalable system for organizing published ...", "year": 2018, "citationCount": 365 }See the Make Calls to the Semantic Scholar API section for more Python examples using the paper search, paper recommendations, and authors endpoints.Make Calls to the Semantic Scholar APIUse Case: Let's suppose you are an early-career academic researcher interested in doing research in generative AI. You would like to learn about recent research developments in the generative AI field and discover what areas are most exciting for future research.How to use Semantic Scholar: You can do a keyword search for relevant papers on generative AI. You can pick out a few papers that seem the most interesting, then recommend more papers that are similar to them. You can examine the list of recommended papers to see which are the most cited and which authors worked on them, then look up other research by those same authors.Let’s walk through those scenarios together. We’re going to use Python, but you can follow along using the Postman collection.Step 1: Keyword search for relevant papersUse Case: We want to learn more about generative AI, so we’ll start by searching for recent generative AI research papers. Two Academic Graph API endpoints use Semantic Scholar’s custom-trained ranker to perform keyword searches: the paper relevance search endpoint and the paper bulk search endpoint.Paper bulk search should be used in most cases because paper relevance search is more resource intensive. The paper relevance search endpoint is able to return more detailed information about each paper’s authors, its referenced papers, and the papers that cite it. The paper bulk search supports sorting and special syntax in the query parameter. In this scenario, we will use the paper bulk search endpoint.Get the Endpoint URLThe Academic Graph API endpoint’s base URL is: http://api.semanticscholar.org/graph/v1/ Whenever we want to retrieve data from or send data to an endpoint in the Academic Graph, that’s how the URL starts. The API documentation for paper bulk search endpoint lists its resource path as /paper/search/bulk, so the endpoint’s full URL is:http://api.semanticscholar.org/graph/v1/paper/search/bulk Set the Query ParametersThe paper bulk search API documentation lists the following query parameters:query sets the search termtoken automatically handles paginationfields determines what data the API endpoint will return to yousort allows users to sort the results by the paperId, publicationDate, or citationCount fieldspublicationTypes filters results by paper publication type (e.g. journal articles)openAccessPdf filters results by whether they contain public PDFs of papersminCitationCount filters results by whether they have at least a given number of citationspublicationDateOrYear filters results by a date rangeyear filters results by a year rangevenue filters results by publication venuefieldsOfStudy filters results by the paper’s field of studyOnly the first query parameter, query, is required in every request. The token query parameter isn’t included in the original request. Instead, it is returned in the response to the original request, then included in subsequent requests to automatically handle pagination.In our request, we will include 3 query parameters: query, fields, and year:Use quotation marks in the query to search for the phrase “generative AI”. See the Additional Help section for more examples of using search query syntax.In fields, include the title, url, type of publication, date of publication, and link to the pdf of the paper. Separate field names with commas, without spaces. See the API documentation for all available field names.Filter for papers published during or after the year 2023 by using the “2023–” syntax.These query parameters are appended to the end of the URL, so the complete URL looks like this: http://api.semanticscholar.org/graph/v1/paper/search/bulk?query="generative ai"&fields=title,url,publicationTypes,publicationDate,openAccessPdf&year=2023-Send the RequestThe URL is long and hard to read, so in our code we’ll break it up a bit:import requests import json # Specify the search term query = '"generative ai"' # Define the API endpoint URL url = "http://api.semanticscholar.org/graph/v1/paper/search/bulk" # Define the query parameters query_params = { "query": '"generative ai"', "fields": "title,url,publicationTypes,publicationDate,openAccessPdf", "year": "2023-" } # Directly define the API key (Reminder: Securely handle API keys in production environments) api_key = "your api key goes here" # Replace with the actual API key # Define headers with API key headers = {"x-api-key": api_key} # Send the API request response = requests.get(url, params=query_params, headers=headers).json()The request is formatted and sent to the API endpoint, and the response is captured in the variable response.According to the API documentation, if the request was successful, with status code 200, the response variable contains three fields:Figure 6. The API documentation lists the data format of the response schema.The total parameter is an estimate of how many papers were found that matched the search request, the token parameter is used for pagination, and the data parameter contains the data returned from the endpoint. Note that the paper bulk search endpoint’s use of tokens to handle pagination is unlike the paper relevance search endpoint’s use of the offset and limit query parameters for pagination.The next part of our code saves the data returned from the endpoint to a json file titled papers.json and prints the code’s progress to the console. If the token parameter is present, fetch the next batch of responses.print(f"Will retrieve an estimated {response['total']} documents") retrieved = 0 # Write results to json file and get next batch of results with open(f"papers.json", "a") as file: while True: if "data" in response: retrieved += len(response["data"]) print(f"Retrieved {retrieved} papers...") for paper in response["data"]: print(json.dumps(paper), file=file) # checks for continuation token to get next batch of results if "token" not in response: break response = requests.get(f"{url}&token={response['token']}").json() print(f"Done! Retrieved {retrieved} papers total")Each data object in the papers.json file contains the fields we requested, as well as the paperId.{ "paperId": "001720a782840652b573bb4794774aee826510ca", "url": "https://www.semanticscholar.org/paper/001720a782840652b573bb4794774aee826510ca", "title": "Developing Design Features to Facilitate AI-'''
