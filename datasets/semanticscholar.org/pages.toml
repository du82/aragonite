full_description = "Scholars worldwide spend endless hours discovering new insights and breakthroughs. With the volume of new research published every day, we understand how hard it is to stay up-to-date with the latest discoveries. That's why we curated this hub for you. Papers in Biology, Computer Science, Medicine, Physics, and Psychology that are currently growing in citations and page traffic. Papers with the most page traffic on Semantic Scholar, filtered through referrals from arXiv, a trusted source for scholarly content. Papers that earned the most citations from popular CS venues including ACL, EMNLP, and ICML, implying their significant impact on computational linguistics research. Papers published in ACL, EMNLP, and ICML that have garnered significant page views as well as frequently saved in libraries on Semantic Scholar. Papers that have received best paper awards from renowned venues in Artificial Intelligence or Theory. Theme-based paper lists curated by our own research team. By curating these theme-based paper collections, we aim to promote equal access to science and start conversations within and beyond the scholar community. Proudly built by Ai2 with the help of our CollaboratorsTerms of Service • Privacy Policy • API License Agreement"
