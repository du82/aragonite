description = "Publishers partner with us to acquire highly qualified traffic and gain valuable insight into how scholars interact with their content."
full_description = '''About Semantic ScholarOverviewPublishersBlogAI2 CareersPublishersCollaboration is key to our mission Reach millions of scholars by integrating your academic content into Semantic Scholar's knowledge graphPublisher PartnersCollaborating with academic publishers to build a trustworthy and authoritative scientific knowledge graphWith millions of scholars visiting the site each month, academic publishers partner with us to increase discoverability of their content and gain valuable insight into how scholars interact with their catalogue. More than 50 direct partnerships with publishers, data providers, and aggregators provide Semantic Scholar with content from 500+ academic journals, university presses, and scholarly societies around the globe.Testimonials"The sheer volume of scientific content can be overwhelming for all researchers, no matter their field. As a publisher we must therefore support researchers in every way we can so that they can easily find and assess articles in the context of supporting material. Our expanded content indexing partnership with AI2 allows researchers to cut through the clutter and discover research relevant for them, which supports the advancement and acceleration of science and knowledge."Henning Schoenenberger, Director, Product Data & Metadata Management, Springer Nature"Our partnership opens up exciting opportunities for HighWire publishers to apply this powerful new source of metadata to their content repositories. It will enhance the discovery, search and browsing experiences of their researchers and users. Exactly how publishers leverage the metadata that Semantic Scholar creates will be driven by each publisher’s unique needs, and custom development work will be supported by HighWire’s professional services team."Jim Longo, former Highwire staff member'''
