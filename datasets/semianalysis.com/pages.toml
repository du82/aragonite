["https://semianalysis.com/2025/01/15/2025-ai-diffusion-export-controls-microsoft-regulatory-capture-oracle-tears"]
title = "2025 AI Diffusion Export Controls – Microsoft Regulatory Capture, Oracle Tears, Impacts Quantified, Model Restrictions – SemiAnalysis"
description = "The US government lobbed the largest salvo in the new technology cold war with its new Framework for Artificial Intelligence Diffusion. These new export restrictions are completely unprecedented in scope and scale, with many calling the efforts overzealous or misguided. The regulation at its core is targeted at preventing China from accessing AI compute to…"
full_description = "January 15, 2025 2025 AI Diffusion Export Controls – Microsoft Regulatory Capture, Oracle Tears, Impacts Quantified, Model Restrictions Malaysia's Stranded Capacity, Western Hyperscale Strength, AI Accelerator Restrictions, India Brazil Middle East Concerns, Sovereign AI Killed, VEU Restrictions and Implications, Compute Budget, Open-Source Creating Lower Bound, Model-Weights Controlled 29 minutes 8 comments on 2025 AI Diffusion Export Controls – Microsoft Regulatory Capture, Oracle Tears, Impacts Quantified, Model Restrictions By Dylan Patel, Daniel Nishball, Myron Xie, AJ Kourabi, Jeremie Eliahou Ontiveros, Reyk Knuhtsen and Ivan Chiam ShareCopied to clipboard LinkedIn X Facebook Table of Contents Executive Summary + High Level TakeawaysAI Chips in Scope and the Total Processing Performance (TPP) FrameworkHow the AI Diffusion Framework WorksShipments to Two Classes of Validated End Users (VEUs):Individual Country Allocations of Compute (TPP)The Loophole: Low Processing Performance (LPP) ExemptionGaming GPU Carveouts and AI Training RestrictionsAI Diffusion Framework Effective Date and ImplementationHow the Validated End User (VEU) Framework Impacts AI Regional DeploymentAI Training and Inference ImpactAI Model FLOPS Regulation Depends On Strong Open SourceModel Weights Are Now An Export-controlled ItemHow the BIS Monitors Global ComplianceThe Resultant Geographical OrderGlobal Datacenter ImpactDatacenter Winners and LosersYTL and Malaysia Neocloud EcosystemTowards Stronger Big Tech Monopoly?Oracle Stands to Lose the MostNvidia's Lost BusinessCloud Margins Eat All Including Sovereign AIChinese Chip Ecosystem and Overseas PenetrationTrump Administration's Next StepsSubscribe for full access The US government lobbed the largest salvo in the new technology cold war with its new Framework for Artificial Intelligence Diffusion. These new export restrictions are completely unprecedented in scope and scale, with many calling the efforts overzealous or misguided. The regulation at its core is targeted at preventing China from accessing AI compute to build frontier models. The prevailing rationale within the US government is that AI progress has become so rapid, that access to compute to build and improve these models over the next few years will decide the fate of the next global order for decades to come. In short, the government believes that AI with determine whether US hegemony persists or if it is ceded to China. If so, the AI regulations are justified, but if AI takes longer to make any meaningful impact on the world economy, then these regulations are shortsighted and will harm American competitiveness in the long term. While the semiconductor controls still have some loopholes, the AI chip controls were much more Swiss Cheese. Up until now, while China has been limited from accessing AI compute, that has only been on paper, and it has been circumvented through several methods. In reality, restricted Nvidia GPUs were simply re-exported by bad actors to China from unrestricted countries with a meaningful number of H100s available on various clouds and marketplaces in China. Additionally, over a million China specific accelerators that skirt the line on current regulations have been legally shipped such as the Nvidia H20, B20, AMD MI308X, and Intel Gaudi HL-328 + HL-388. Chinese firms such as ByteDance have had unfettered access to GPUs outside their borders through various cloud companies. Furthermore, in just Malaysia alone, based on our individual datacenter by datacenter tracking, there is ~3 Gigawatts of Critical IT capacity of datacenters being built in just a few years. This represents as much capacity as Meta had globally for serving all their traffic in the beginning of 2024. The only use case for such an enormous amount of concentrated datacenter capacity is AI. Source: SemiAnalysis Datacenter Model Our data shows a similar story playing out in the Middle East, India, and Brazil as well. The US Government is cognizant of this and therefore believes regulating this is the upmost priority. There are a huge number of negative externalities within the rules that will greatly impact the supply chain, geopolitics, and where AI gets built. For many firms this ruling is quite negative, for some select others it is positive. The regulations are very complicated and the team at SemiAnalysis has worked around the clock to break down the rules and quantify the impacts. We will deeply dive into them below, but first an Executive Summary on the restrictions and what the major ramifications are. Executive Summary + High Level Takeaways On January 13, the Bureau of Industry and Security with its Framework for Artificial Intelligence Diffusion has narrowed these loopholes that are being exploited by entrepreneurial business units and bad actors, while arguably streamlining access to chips for deployment overseas by trusted nations as well as for a small number of trusted US Hyperscalers (Microsoft, Google, Amazon) and approved overseas providers. To accomplish this, the AI Diffusion Framework divides the world into three tiers of countries with varying levels of access to AI Chips and strict caps for purchasing of GPUs: Tier 1 for the US and 18 major allies and security partners, Tier 3 for 23 Arms Embargoed Nations plus Macau, Tier 2 for all other countries – with varying degrees of relations with the US: ranging from Singapore who gets to buy F35s to Yemen who bombs US tankers! Source: SemiAnalysis, BIS It establishes a Validated End User (VEU) framework that identifies the entities and companies, mainly these US Hyperscalers, that can import AI chips into each country tier, as well as a few other exceptions for non VEUs. Lastly, it introduces exports controls for AI Models themselves, applying restrictions globally on entities not from Tier 1 countries training AI Models that require a large quantity of training compute (currently set at 1e26 Training FLOPS which is 2x that of Llama 405B, but pegged to the training FLOPS for the largest open-weights model), and prohibits the export of closed-weight models beyond this same size. The framework is unabashedly nationalistic, and it is clear from the spirit and the letter of the rule that it is designed to significantly advantage Google, Microsoft, and Amazon versus foreign providers as well as Neoclouds from Tier 2 countries. It reshuffles the deck with respect to individual nations’ access to AI compute, and it puts at risk the business case for many colocation providers with considerable AI Datacenter capacity pipelines in Tier 2 countries. Its new global licensing regime makes illicit re-exports much more difficult, and depending on which providers are approved as VEUs, this may also meaningfully restrict companies from Tier 3 countries like China from accessing AI compute through cloud services, although there is a big loophole we will discuss below. As shown in the chart below, the majority of existing and future AI datacenter capacity is in Tier 1 versus Tier 2 countries – mainly in the US. The only meaningful Tier 3 country is China (not shown in the chart). While these rules will reconfigure and stymie the business case for many colocation operators with large Tier 2 country pipelines, potentially affecting AI gigaclusters like Johor in Malaysia, India, Brazil, and the Middle East. Ultimately it may not meaningfully constrain shipments of AI Chips in aggregate due to increased building in tier 1 and reconfiguring AI Chip deployment plans, shifting them into the hands of major US Hyperscalers operating overseas, or reshoring demand back to the US. Most the largest Neoclouds such as Coreweave, G42, Nebius, etc will be unaffected as they will continue to expand in Tier 1 and get licenses for Tier 2. Source: SemiAnalysis Datacenter Model To be clear, the impact to Nvidia is still large in the medium term in so far as it reduces GPU access for China which does make the market smaller. The question is if Western demand makes up for it, and the answer is likely not as the pricing of H100’s is tanking. While Nvidia’s H20 and B20 production targets keep being increased, these products are lower margin and ASP than the regulated H200 and B200. It is important to note that this Framework is not just about regulating the physical destination of chips but also the nationality of the end user of those chips. Tiering of companies is based on the country of the ultimate parent of a company. For example, in the case of Volvo, the “Swedish” automaker, which is majority owned by Chinese automaker Geely and uses significant Chinese auto parts, electronics, manufacturing, and design, would be considered Chinese and has their GPU access limited. The rule has very far reaching effects such as customer confidentiality and confidential compute being effectively illegal because clouds must now track what clusters ranging in the 10k+ GPU range are doing to ensure they are not making frontier models on them for China. This compounded with the very strict limitations on GPU caps changes the landscape drastically and was effectively regulatory capture by Microsoft, Amazon, and Google. Next we will dive into the details of this new rule, and the impact it has on chip designers and manufacturers, major US hyperscalers, AI Neoclouds, and datacenter colocation providers. We will also zero in on Johor, Malaysia, India, Brazil, and the Middle East, explaining how this rule will decisively reshuffle the deck for the datacenter market that has seen some of the most ambitious plans for AI datacenter buildouts – some of which have been to cater to demand targeted by the new rules. We will dive into the incorrect argument that Huawei and China will be able to leverage this to gain influence overseas. We will explain in detail the new restrictions on Model training and Model Weight Exports. We will cover impacts to Nvidia, Google, Microsoft, Amazon, Oracle, G42, Scala, and more. We will also talk ASICs vs GPUs and the cloud margin impacts. Lastly we will cover what the Trump administration should do next. AI Chips in Scope and the Total Processing Performance (TPP) Framework The October 2023 export restrictions introduced a number of incredibly strict rules blocking the shipment or reexport of the most powerful chips to a number of restricted countries including China. The Total Processing Performance (TPP) and Performance Density framework effectively blocked the A100, H100, MI250X and MI300X as well as even some gaming GPUs like the RTX4090 among other powerful chips from export to China and other restricted countries. To recap, TPP is calculated by multiplying the marketed TFLOPS by the Bitlength for that marketed TFLOPS throughput (i.e. for H100 on FP8, this would be 1,978.9 x 8 = 15,831), while Performance Density is the TPP divided by the Die size (i.e. for the H100, this would be 15,831 / 814mm2 = 19.4). The overhaul of the scope covered by Export Control Classification Numbers (ECCN) 3A090.a in the October 2023 rules prohibited export of the Chip to restricted countries if EITHER the TPP is above 4,800 OR the performance density is above 5.92 as depicted in the Black Zone in the diagram below. ECCN 3A090.b covers less powerful chips than 3A090.a and exports under the former ECCN may be allowed with licensing. 3A090.b’s scope (The “Grey Zone” in the chart below) includes chips such as the L40 and MI210, with 3A090.a (The “Black Zone”) catching the most desirable chips. Note these rules do not add additional controls to 3A090.b chips and they continue to be able to be freely exported to countries that are not Arms Controlled Countries or Macau. In reality, official GPU shipments to China are dominated by the PRC SKUs such as the Nvidia H20 and AMD MI308X that fall below both performance thresholds for both 3A090.a and 3A090.b, and are in the “White Zone” below. Source: Center for Strategic and International Studies The table below features most current and upcoming leading edge AI Chips, illustrating how TPP is calculated, and specifying whether the chips are in scope for ECCN 3A090.a, and how shipments of each SKU count toward the various exemptions made available which will be discussed in greater detail below. Source: SemiAnalysis, US Bureau of Industry and Security, Nvidia, AMD, Intel, Google, Amazon. Notice how the 1,700 H100s cap quickly becomes fewer than 500 GB300 GPUs. One bright side of the regulation is that Nvidia and AMD may stop capping on the FLOPS they publish for their chips finally because there’s no conceivable way to get 1979 TFLOPS on an H100, the max you can get on repeat GEMM is more than 25% lower. This may have AMD and Nvidia transition to an advertised boost clock and a true base clock like CPUs so FLOPS aren’t exaggerated. How the AI Diffusion Framework Works To begin, the AI diffusion framework creates a global license requirement for the export of AI chips, and grants exemptions to this licensing requirement that effectively divides the world into three tiers of countries:Tier 1: The United States plus 18 security and trade partners or treaty allies that are highly aligned with the US in terms of control over strategic technology and have trustworthy export control regimes. GPUs may be shipped into these countries under the Artificial Intelligence Authorization (AIA) exception, but the entity importing the GPUs must be headquartered or have its ultimate parent from a Tier 1 country. Tier 3: Countries are the list of 23 arms-embargoed nations (Country List D:5) plus Macau, where exports of controlled chips are effectively banned. This includes China, Russia, Syria and other countries. Tier 2: These countries are all the other countries all other countries that are not the countries in Tier 3 and Tier 1. It is these countries where the biggest changes occur, and shipments to these countries may be allowed under a set of license exemptions that set up quotas, limits and rules depending on the parties importing the AI chips. We outline the various exemptions later in this section. Some notable countries in the Tier 2 list are Malaysia, India, and Singapore. The fact Yemen which bombs US tankers and Singapore which is a significant US strategic partner are in the same tier speaks volumes to how much the US government believes GPUs are being smuggled through Singapore to China. The table below sets forth a complete list of Tier 1 and Tier 3 countries, as well as a non-exhaustive list of notable Tier 2 countries. Particularly noteworthy markets and countries are highlighted in light red. Source: SemiAnalysis, Bureau of Industry and Security There are three broad categories in which AI Chips are permitted to be exported to Tier 2 Countries: Shipments to Two Classes of Validated End Users (VEUs): Universal Validated End Users (UVEUs): Companies that have their headquarters or ultimate parent in a Tier 1 country and that can meet various security and compliance standards. Compani"
