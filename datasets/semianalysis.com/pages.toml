title = "Datacenter Anatomy Part 2 – Cooling Systems – SemiAnalysis"
description = "Cluster deployments are an order of magnitude larger in scale with Gigawatt-scale datacenters coming online at full capacity much faster than most believe. As such, there are considerable design changes that Datacenter developers planning future sites must consider. We previously covered the Electrical system of Datacenters and how the rise of Generative AI is impacting datacenter…"
full_description = "February 13, 2025 Datacenter Anatomy Part 2 – Cooling Systems L2A, L2L, Immersion, Two-Phase, Google vs Meta vs Microsoft vs Amazon Water Cooling Design, WUE, PUE, Nvidia Rubin Power & Cooling Architecture 34 minutes 13 comments on Datacenter Anatomy Part 2 – Cooling Systems By Dylan Patel, Jeremie Eliahou Ontiveros, Daniel Nishball and Reyk Knuhtsen ShareCopied to clipboard LinkedIn X Facebook Table of Contents The Upcoming Datacenter Cooling MarketDatacenter Cooling BasicsCooling Systems and Energy EfficiencyAir-Cooled Datacenter ArchitectureServer Thermal Management and AirflowAnatomy of an Energy-Inefficient Cooling SystemIndoor Cooling UnitAir-Cooled and Water-Cooled ChillersWater Usage, Air Cooled Chillers and Dry CoolersA Look at Hyperscaler Designs and Their Ultra-Low-PUE SystemsMicrosoft Datacenters and Cooling SystemsMeta’s “H”: Efficiency Over Time-to-marketGoogle Datacenters – Energy for Water TradeoffAI Datacenters, the Rise of Liquid Cooling, and GenAI System RoadmapLiquid Cooling PrimerThe Future of Datacenter Cooling SystemsDedicated Cooling SystemsHyperscaler Designs and Roadmap – The End of CDUs?Equipment Supplier LandscapeIs DLC a Temporary Solution to be Replaced by Immersion?Oracle & Bytedance Market Rumblings at PTC 2025Subscribe for full access Cluster deployments are an order of magnitude larger in scale with Gigawatt-scale datacenters coming online at full capacity much faster than most believe. As such, there are considerable design changes that Datacenter developers planning future sites must consider. We previously covered the Electrical system of Datacenters and how the rise of Generative AI is impacting datacenter design and equipment suppliers. In the second part of this series exploring Datacenter infrastructure and technologies, we’ll focus on Cooling Systems. Oct 14, 2024 Datacenter Anatomy Part 1: Electrical Systems Dylan Patel, Jeremie Eliahou Ontiveros, Daniel Nishball Nvidia shook the entire Datacenter Industry in March when it announced that its state-of-the-art AI computing platform would be a 120kW, 72-GPU rack exclusively cooled via Direct-to-Chip Liquid Cooling (DLC). The Nvidia GB200 NVL72 system will provide the best TCO for Large Language Model (LLM) inference and training, and will be instrumental towards enabling advancement according to scaling laws and reductions in costs of reasoning models like o3. As such, the GB200 NVL36/72 will be the highest volume SKU of the Blackwell product family – and this is just the beginning of Nvidia’s extremely ambitious roadmap. Source: SemiAnalysis Datacenter Model DLC is not a new technology, but it has long been confined to cost-insensitive R&D government supercomputers that operate at >100kW rack density – and Google’s custom AI infrastructure. In the broader market, rack density has been rising slowly over time, from at most 5-10kW per rack in the 2010s up to the 15-20kW that is typical for modern Cloud Computing datacenters. The Hyperscale era caused an increase in scale of operations, but the underlying Datacenter design was fundamentally unchanged. Apr 12, 2023 Google AI Infrastructure Supremacy: Systems Matter More Than Microarchitecture Dylan Patel, George Cozma, Gerald Wong The Upcoming Datacenter Cooling Market Of the key datacenter systems, Cooling is arguably the area that is evolving at the fastest pace, presents the steepest learning curve and carries the execution risk for datacenter operators. With large-scale projects commonly requiring billions in capital expenditure, the stakes are extremely high. Rapid advancement in datacenter requirements also amplifies the risk of developing assets that could become obsolete quickly. Demand for Liquid Cooling is underestimated and will lead to an increase in inefficient “bridge” solutions as there won’t be enough liquid-cooling capable datacenters. To quantify this, we built a chip-by-chip model and forecast of the Liquid Cooling market, and location-by-location tracker of future datacenter capacity. Source: SemiAnalysis Datacenter Model This report is a comprehensive primer on Datacenter cooling systems. In the first section, we explain the basic concepts underlying Datacenter cooling and introduce key equipment. The second part of the report focuses on current Hyperscaler self-build designs and explains their methodology to achieve best-in-class cooling efficiency – informed by real-time imagery of their flagship AI Datacenters. Source: SemiAnalysis Datacenter Model We will also discuss the future of Datacenter cooling with Nvidia’s roadmap and that of its key customers. We’ll explain how each hyperscaler has adapted to market conditions and their considerable design shifts to adapt their infrastructure to the GenAI era. Each hyperscaler has taken a different approach and reviewing them has interesting supply chain implications. We will also discuss Oracle and Bytedance in Malaysia. Finally, we’ll discuss key suppliers and the impact on their business. Nvidia’s massive ramp is causing shortages on components that on first glance look simple such as Quick Disconnects! While all firms will benefit from the underestimated Datacenter CapEx boom, there are relative winners and losers based on underlying design changes. Datacenter Cooling Basics Thirty years ago, datacenter HVAC (Heating, Ventilation, Air Conditioning) resembled that of office buildings, reusing office or commercial style equipment with beefed-up AC (Air Conditioning) and/or AHUs (Air Handling Unit). But with modern datacenters generating >50x the amount of heat per square feet compared to an office and commonly requiring north of 30MW of power delivery to IT equipment (all converted into heat), the industry transitioned to much more specialized solutions. These sophisticated systems aim to maintain IT equipment at optimal temperatures – for example between 5°C and 30°C for the DGX H100. Operating outside this range would reduce equipment lifespan—which is economically unsound since servers and associated hardware represent the largest portion of a datacenter’s total cost of ownership. Source: Nvidia In today’s datacenters, cooling systems represent the second-largest capital expense after electrical systems (excluding IT equipment). They’ve become perhaps the most critical design consideration due to their architectural variety and significant impact on operating expenses, particularly energy – the largest variable cost for a Cloud Service Provider (CSP). Electricity consumption related to non-IT equipment, of which the majority is cooling, is purely a non-productive expense which should be minimized – but there are tradeoffs. Source: SemiAnalysis Datacenter Model Cooling Systems and Energy Efficiency The industry standard for comparing facility energy efficiency is the Power Usage Effectiveness (PUE) ratio, which divides total facility power by total IT power. A PUE of 1.5 means that for each Watt of IT load, the datacenter will consume an extra 0.5 Watts for cooling, power conversion losses and other minor items like lighting. The industry average PUE, calculated by the Uptime Institute, is around 1.6. While many analysts and marketing charts take that number at face value, it is not representative of the industry – it is based on a survey that largely excludes hyperscalers and is a simple average of respondents with datacenters bigger than 4MW. Google and Meta both operate at around 1.1 PUE, and Microsoft and AWS around 1.15 PUE – we’ll explore later in the report how they achieve it. Source: Uptime Institute It’s important to note that PUE can be manipulated and doesn’t always enable fair comparisons. For example, server fan power is generally included within IT load. This means that when comparing otherwise identical air-cooled and liquid-cooled server, the latter might show a higher PUE despite consuming less total power, due to lower server fan power. Alternative metrics have been proposed, but PUE remains the industry standard. As a rule of thumb, non-IT electricity consumption typically breaks down as follows: 60-80%: Cooling system, primarily chillers, followed by fans and pumps. 15-30%: Electrical system – mainly UPS power conversion, power distribution losses and transformer inefficiency. 5-20%: Lighting and other – datacenters often include a small office area. Air-Cooled Datacenter Architecture Let’s now explore common designs found in Colocation datacenters. The main cooling components are an indoor cooling unit for the data hall, chillers and cooling towards. In some cases the chiller and cooling tower may be integrated. These components work together through isolated liquid circuits to transfer heat efficiently. Source: Accuspeclnc Source: Mitsubishi Heavy Industries In a datacenter, heat flows from the IT equipment to the outside environment in the following way: At the rack level, IT equipment generates heat, which is displaced via fans inside IT servers. This hot air is blown into the data hall. Indoors cooling units – commonly CRACs (“Computer Room Air Conditioner”) or CRAHs (“Compute Room Air Handler”) – remove heat from the data hall. Cold water (or another fluid) circulates inside the cooling coil of these units. Hot return air is blown over these coils, transferring its heat into the facility water, which is then pumped back to the chiller. Source: MEPacademy The chiller performs a refrigeration cycle – an energy-intensive process to lower temperature. This involves transferring heat from water to a separate fluid called a “refrigerant”. The warmed-up refrigerant is compressed to further increase its temperature and flows through a heat exchanger called a condenser – either air-cooled with fans expelling heat onto the outside air or water-cooled with a separate cooling loop linked to a cooling tower. The refrigerant’s temperature drops in the condenser and returns much cooler. The cooling tower then finally exchanges heat from the condenser water into the outside environment. With heat removed from the data hall, the cycle starts again, with cooled water supplied to the indoors cooling unit. This continuous process requires varying amounts of energy and water, depending on system design. Source: Alpine Intel Let’s now zoom into the individual components of cooling systems in each loop. Server Thermal Management and Airflow The heat flow starts in the data hall, where IT Equipment generates heat as a direct byproduct of electrical power consumption—one kilowatt of electricity powering IT equipment produces approximately one kilowatt of heat. Chipmakers specify the maximum heat a chip or system can handle through its Thermal Design Power (TDP), which guides thermal engineers in designing appropriate cooling solutions. Over the past 5-10 years, chip TDP has shown a consistent upward trend. With AI accelerators, this trajectory continues to steepen, with 1500W chips shipping next year. Source: SemiAnalysis Starting from the chip, in an air-cooled server, a Thermal Interface Material (TIM) sits atop the die, conducting heat from the chip package itself to the heat spreader or heat sink. Source: TSMC In air-cooled servers, a Thermal Interface Material (TIM) sits atop the die, conducting heat to the heat spreader or heat sink. Heat sinks increase surface area to reduce heat flux (heat per unit area), thereby improving cooling performance. Higher chip heat generation necessitates larger heat sinks, as exemplified by the oversized heat sink on the NVIDIA H100 (700W TDP). These oversized heat sinks are one reason why and Nvidia H100 server is typically 8 rack units (RUs), while a much lower power CPU server can fit within a 1U or 2U form factor. Source: SVA.de Server fans evacuate the combined heat generated by internal components, with GPUs and CPUs contributing the largest portion for a typical H100 server. There must be sufficient airflow to remove heat from the heat sinks – an airflow of 165 to 170 cubic feet per minute (CFM) per kW of heat is a common rule of thumb that can be used. Source: Gigabyte Server fans can consume significant power, which led hyperscalers to design custom servers instead purchasing off-the-shelf solutions from vendors like Dell or Supermicro. Recent data from Nebius, a Neocloud with hyperscale-level resources, demonstrates how custom server designs can reduce energy consumption. Source: Nebius at OCP Global Summit 2024 The relationship between temperature and energy consumption is governed by Delta T—the difference between inlet temperature (entering the server) and outlet temperature. Delta T influences energy consumption in the following ways: In a cooling system, a higher temperature differential means that less airflow or pumping power is required to dissipate heat – the relationship is linear. Although the airflow required may vary linearly with delta T, the energy required to achieve a different airflow does not scale linearly. According to Fan Law physics, fan energy consumption equals fan speed cubed; a 10% reduction in fan speed (i.e. airflow) yields a 27% energy consumption reduction. Higher chip utilization rates prove more energy efficient, as increased heat generation creates a larger Delta T for outlet temperature relative to inlet temperature. Anatomy of an Energy-Inefficient Cooling System Let’s now dig more into typical operating temperatures and their critical role in the design and efficiency of cooling system. The picture below shows how a traditional “inefficient” air-cooled Datacenter operates: Server inlet air at 22°C – the temperature at which air enters the server. Chilled water temperature at 7°C in the indoor cooling unit coils, rising to 13°C after heat absorption – a delta T of 6°C at the air handling unit. In most global locations, cooling water down to 7°C requires substantial electricity, primarily for the chiller’s refrigeration cycle. Such a low chilled water temperature is inherited from office or commercial HVAC systems. The energy cost from chilling water to such a low temperature far exceeds savings from reduced server fan speeds. Source: Supermicro at Hot Chips 2024 Over the past decade, datacenter operators have increasingly adopted higher inlet temperatures – well above 22°C, discovering that this approach doesn’t actually compromise IT equipment longevity. The below table from ASHRAE, an American HVAC standards institute, shows recommends dry bulb (i.e. air) temperature between 18°C to 27°C for servers. However, going above 30°C is allowable and air temperature can even be set as high as 45°C in some cases – although the server class “A4” is more for military-like applications. Source = ASHRAE Examining the Supermicro diagram raises an important question: Why does 7°C inlet water into the data hall air handling unit produce a 22°C server air inlet temperature )? This significant temperature gap often results from poor airflow management. Upsite Technologies developed the concept of the”Four Delta Ts” to deconstruct this "
