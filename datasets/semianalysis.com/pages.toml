description = "The Open AI Stargate Joint Venture announcement had many folks heads turning, despite us calling out the capital requirements for OpenAI's immediate plans months ago. The headline $500 billion is such an earth-shattering number that it also caused deserved skepticism from folks like Elon Musk stating that Softbank has well under $10 billion of funding…"
full_description = "January 23, 2025 OpenAI Stargate Joint Venture Demystified | Microsoft Sore Loser, Does Softbank Have The Capital?, Texas GigaCampus, Winners & Losers Money Rules Everything Around Me, The Real Numbers Behind Stargate, Lancium, Abilene Texas, Crusoe, Oracle, Cost Breakdown, Arm Is Fake News 7 minutes 5 comments on OpenAI Stargate Joint Venture Demystified | Microsoft Sore Loser, Does Softbank Have The Capital?, Texas GigaCampus, Winners & Losers By Dylan Patel, Reyk Knuhtsen, Christopher Seifel and Jeremie Eliahou Ontiveros ShareCopied to clipboard LinkedIn X Facebook Table of Contents Cluster Measuring ContestThe Real Numbers Behind StargateProject OverviewScope and Location of the Initial $100 Billion InvestmentPower, Rental Price, Capex, and GPU Spend BreakdownThe Project's Financial BackingThe Reality of The Stargate Joint Venture – Winners and LosersMicrosoft Is The Biggest LoserArm – Technology Partner or Fake NewsThe Future of The Stargate Joint VentureSubscribe for full access The Open AI Stargate Joint Venture announcement had many folks heads turning, despite us calling out the capital requirements for OpenAI’s immediate plans months ago. The headline $500 billion is such an earth-shattering number that it also caused deserved skepticism from folks like Elon Musk stating that Softbank has well under $10 billion of funding secured. Sam Altman clapped back by saying it was already under construction, and to come visit it. Cluster Measuring Contest It’s fun to see the elite are going through their measuring contests with clusters but also they are both right to some extent. Softbank doesn’t have anywhere close to the money required for the cluster. At the same time, the cluster is already under construction in Texas, see the low res GIF for free subscribers. SemiAnalysis Datacenter Model The reality is that only the first phase is certain, which is a portion of the committed $100 billion, but the top line number is being counted in an interesting way to say the least. We already discussed the first phases of this Abilene, Texas datacenter site publicly in our report on Multi-Datacenter Training report 4 months ago. We also have had it in both the Accelerator Industry Model and Datacenter Industry Model for quite a bit longer. Below we will go over what’s actually happening with Stargate, what’s up with Microsoft and the crisis there, the structure and cost, and how real the cluster actually is. Subscribe for full access to this article With a SemiAnalysis subscription you’ll get full access to all newsletter articles and article discussions. Log in or Subscribe Enter the code sent to your email Please verify your email address to proceed. By subscribing, you agree to the Privacy Policy and Terms and Conditions. Next Article DeepSeek Debates: Chinese Leadership On Cost, True Training Cost, Closed Model Margin Impacts H100 Pricing Soaring, Subsidized Inference Pricing, Export Controls, MLA Keep Reading The Semiconductor Heist Of The Century | Arm China Has Gone Completely Rogue, Operating As An Independent Company With Inhouse IP/R&DArm and a Leg: Arm’s Quest To Extract Their True ValueCheap If They Can Charge Qualcomm-like Royalties?Arm Changes Business Model – OEM Partners Must Directly License From ArmNo More External GPU, NPU, or ISP’s Allowed In Arm-Based SOCs Comments anonymous-b37feb3ec January 23, 2025 Sign up for a paid plan and join the discussion With a SemiAnalysis subscription you get full access to all articles, Data Explorer graphs, article discussions, and further insight into deep dives. Log in or Subscribe Enter the code sent to your email Please verify your email address to proceed."
