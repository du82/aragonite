["https://semrush.com/pricing"]
title = "Plans & Pricing | Semrush"
description = "Semrush Plans and Pricing"
full_description = '''Plans & Pricing FAQ Can I cancel my subscription anytime? Yes, you can cancel your subscription, downgrade or upgrade your plan at any time. What is Semrush’s refund policy? You get a 7-day money-back guarantee on all plans. Submit your request via our contact form, and we will refund the payment made if the request is made within 7 days after the sign-up. What payment methods do you accept? You can pay using the following payment methods: All major credit cards including Visa, Mastercard, Discover, American Express, and UnionPay Wire transfer (upon request) Check or money order (US only, upon request) Do I get a customer demo? Once you sign up for a Semrush free trial, request a free training session here. After your demo, you will be assigned a dedicated point of contact for all of your Semrush-related questions. Can I use Semrush for free? Yes. With a free account, you can still use a lot of tools, but you will be limited in your ability to pull all of the data and use other tools. The maximum number of requests made to the Analytics reports per day is limited to only 10 (Pro users have access to 3,000 searches, Guru — 5,000 searches, Business — 10,000 searches). As a free user, you can create and manage only one Project and track 10 keywords in Position Tracking. Discover more features we offer our free users and the comparison to our paid plans in this article. Am I charged when I enter my credit card? We will charge a nominal amount to your credit card to check its validity; once confirmed, it will be immediately refunded. Until your Semrush trial period ends you won’t be charged. Which would be better for me, Guru or Pro? If you’re a freelancer, blogger, or in-house marketer with a limited budget, then the Semrush Pro plan will likely be the best option. If you’re a professional SEO consultant or an agency with numerous clients, then you will be best suited to the Semrush Guru plan. You can find a deep comparison of our plans by limits in the subscription limits article. I run a small agency. What plan should I choose? You might choose Pro plan, which is the basic subscription, or Guru plan, which is the most popular for SMBs and growing agencies. The plans differ in the number of tools available as well as in the number of limits. You can consult this page to understand better which subscription will better fit your marketing needs. What is the pricing currency? All prices are in US dollars. Testimonials 1 / 5 By using Semrush, my team saves a lot of time by working on the right content and in a more data-driven way. Everything we do here is backed up with data, and your tool is giving us more ammunition. Idan Segal Organic Growth Lead, Wix The most important thing I can have really is data. Data is my currency. I need to support initiatives, business cases - any tools that give me insight I find incredibly useful. Semrush is a very solid package that delivers exactly that. Nick Wilsdon Product Owner, Search, Vodafone Group Encouraged by our successes with Semrush software, I was asked to rollout Semrush to the rest of the university including all the faculties. With the help of Semrush, we empowered every single marketing team within the university to do what was done for the central sites. Shefali Joshi Marketing Optimization Analyst, Monash University The competition is really tough. It’s getting harder to compete for the top 3 positions when it comes to the most popular KWs. You have to really deep dive into keyword research to find those untapped opportunities. Semrush helps us get to the very bottom of it to identify new type of terms can really help to drive the demand. James Gibbons Growth Manager, Skyscanner In the first 5 years of RockContent's existence Semrush has helped us to become Brazil's biggest digital marketing blog. Vitor Peçanha Co-Founder, Rock Content window.pricingConfig = { isLoyal: false, trialAvailable: true, hasProduct: false, productGroup: "free", isPaid: false, limits: [], billingPeriod: "monthly", agkPermission: false, } window.userConfig = { isAuthenticated: false, useIntercomWorkflow: true, countryCode: 'us', name: '', company: '', } window.pricingProps = { csrf: 'dou8sF4PAuJYAWIF2HeTjyClK4sM1m0zbTjp8q41DRufMDFvSLq2SO8ZU9RtKeMR', recaptchaKey: '6Lcv-_scAAAAAOYTCzmOpm0hosUkSPLAN52Z0PEj' }'''
