title = "Master Your Brand Voice: Workshop with Jack Appleby - Semrush Academy"
description = "Master your brand voice from scratch in this free course with social strategist Jack Appleby. Discover what a brand voice is, why it matters, and complete practical exercises to make your voice stand out."
full_description = "Main page / Courses / Social Media / Master Your Brand Voice: Workshop with Jack Appleby Master Your Brand Voice: Workshop with Jack ApplebyYour brand voice is how you get your message to the world – but how do you actually create it from scratch? In this course hosted by social strategist Jack Appleby, you'll learn exactly what a brand voice is, why it's important, and complete exercises to curate a voice as unique as your brand.Enroll for freeLoading…Who is this сourse for?This course is for marketers looking to boost their content strategy, whether that be from scratch or a much-needed revamp. If you're looking to develop a brand voice that is full of personality that your customers love, this course is for you.What you’ll learnYou'll learn how to identify the most iconic brand voices and discover how to tailor them to your own brand. Through tried-and-tested exercises, you'll be able to form your own brand voice to enhance your future content.Earn Your Certificate from Semrush AcademySemrush has been recognized by the search community across the globe, winning several accolades as the best SEO software suite. Learn moreJack ApplebyAfter 15 years leading social media for brands like Microsoft, Beats By Dre, Verizon, Morning Brew, Twitch, & more, Jack Appleby started Future Social, a weekly newsletter teaching 70,000+ marketers to build best-in-class social media strategy. He breaks down the latest social news into actionable how-to's, from whatever new feature Elon's launched to handling a national crisis from your brand's account. Jack is now a full-time writer + consultant with over 200,000 overall readers via Twitter, LinkedIn, and Beehiiv.Course Structure1About this CourseMeet your course leader, Jack Appleby – a leading social strategist who will guide you through the basics of finding your brand voice, from why it's important to activities to find yours!1 video4 minutesRead more2What is Brand Voice?In this lesson, Jack will walk you through what exactly a brand voice consists of with examples from top brands, so we're all on the same page before the activities begin!1 video4 minutesRead more3Activity: Word BucketsIn this lesson, you'll brainstorm words that define your brand’s essence. Create a curated list from your ideas to pinpoint the words that will guide your messaging and ensure a clear, consistent voice for your brand’s communication.1 video5 minutesRead more4Activity: The Four DimensionsIn this lesson, you'll explore the 'Four Dimensions' exercise to refine your brand’s tone. Is your brand formal or casual? Serious or funny? Choose the dimensions that suit your brand best to develop a consistent, targeted brand voice.1 video5 minutesRead more5Activity: Who We Are, Who We Aren'tIn this lesson, you'll create guardrails for your brand by identifying three words that describe who your brand is and three that describe who it isn’t. This exercise sharpens your tone and helps maintain consistency across all messaging. Make sure you follow along using our free worksheet!1 video7 minutesRead more6Activity: The DoppelgangerIn this lesson, you’ll use the 'Doppelganger' exercise to define your brand voice by choosing a celebrity or fictional character that represents your brand's values. This approach makes your brand’s tone easy to understand and communicate, making it relatable for everyone in your company.1 video5 minutesRead more7Activity: 12 Brand ArchetypesIn this lesson, you'll discover how Carl Jung’s 12 brand archetypes can influence your voice. By identifying the archetype that matches your brand’s values, you’ll create a more compelling and authentic brand personality that resonates with your audience.1 video7 minutesRead more8Walkthrough: Defining Your Brand Voice with Semrush ToolsIn this lesson, Rita Cidre from Semrush Academy shares four tools to refine your brand voice, check audience fit, and ensure consistency across platforms. Simple steps to define your voice and create content that truly reflects your brand!1 video6 minutesRead more9Bringing it All TogetherIn this final stretch, taking the results from all the previous exercises, we're going to try out your new brand voice for a spin. Try your hand at writing some content!1 video2 minutesRead more10Congratulations!Congrats on finishing the course! All you need to do is pass the exam, and the certificate (and glory) is all yours! Don't forget to tag Semrush and Jack on LinkedIn with your achievements!1 video1 minuteRead moreEnroll for freeTake your brand voice to the next level by completing this course, packed with exercises you can complete right now.Enroll for freeLoading…Share"
