full_description = '''Download Full Study Annual Global Issues Index by Semrush A unique and expansive study to discover what people around the world have been searching for when it comes to societal issues impacting the country in which they live — offering powerful insights for world leaders, NGOs, government agencies, businesses and marketers to create CSR initiatives and campaigns that better address the needs of their communities. Download Full Study Global issues explored 35 Countries analyzed 159k Keywords collected 24 Societal issues examined Preview the study findings From 2020 to 2024, the world has undergone profound change. Discover what people across 35 countries searched for the ost,and how these concerns are evolving over time. Uncovering most-searched societal issues Using the Semrush Keyword Magic Tool, we analyzed search volumes for 24 core societal issues across 35 countries around the world and uncovered the top 10 issues that people in each country searched for. Discover data available only from Semrush as well as expert insights from Columbia Professor Jeremy Kagan “The Annual Global Issues Index is an eye-opening look at the most important issues that populations online are searching for. For the first time, we can clearly see what social issues people care about the most in their country, and what organizations are doing to address those issues based on the popularity of their Corporate Social Responsibility (CSR) initiatives. The AGII is the perfect destination for anyone concerned about the state of the world, and for organizations deciding what issues they can and should prioritize from a Corporate Social Responsibility (CSR) perspective.” Jeremy Kagan Professor of Business, Columbia University Dive deeper into the top 10 societal issues in 2024 <form class='mktoForm mktoNoJS'> <input type="hidden" name="formid" value="1491" /> </form> <p>Please enable Javascript to view this form.</p> MktoForms2.loadForm("https://lp.semrush.com", "519-IIY