full_description = '''Free Online Marketing CoursesEnrich your marketing skills with the help of best-in-class industry experts.SEOSemrush ToolsSemrush Academy17 lessons1 hourCertificationBeginner SEO with SemrushIf anyone knows search engine optimization, it's Semrush. So why not kickstart your SEO journey with this free course, designed with Semrush tools in mind? If you're looking to get started with keyword research, or building backlinks with Semrush, this is the course for you!View course infoStart learningSemrush ToolsSemrush Academy10 lessons30 minutesCertificationGetting Started with SemrushThis free course is your essential guide for how to use Semrush. Learn how to navigate the platform, measure online visibility, conduct competitive analysis, and track keyword performance. Unlock the full potential of Semrush tools to improve your SEO and digital marketing strategies.View course infoStart learningSocial MediaSemrush ToolsMarketingJack Appleby10 lessons45 minutesCertificationMaster Your Brand Voice: Workshop with Jack ApplebyYour brand voice is how you get your message to the world – but how do you actually create it from scratch? In this course hosted by social strategist Jack Appleby, you'll learn exactly what a brand voice is, why it's important, and complete exercises to curate a voice as unique as your brand.View course infoStart learningSEOMarketingRita Cidre1 lesson1 minuteCertificationUltimate 2024 Marketing Trivia2024 was quite the ride for marketers. AI leveled up big time, Google kept us on our toes with update after update, and somehow the word "BRAT" became a whole vibe. But how well do you really remember the top moments? That’s where our ultimate 2024 marketing trivia comes in. This is your chance to relive the biggest, weirdest, and most impactful marketing trends of the year!View course infoStart learningMarketingPRRita Cidre5 lessons16 minutesCertificationEmoji Marketing Mini-CourseMaster the foundations and execution of a successful emo