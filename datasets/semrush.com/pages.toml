full_description = "Semrush WebinarsLearn from the best voices in SEO, content marketing, ecommerce, social media, competitive research, and more! Sharpen your digital marketing skills with our free webinars.What Do You Want to Learn?SearchTopicLanguageFormatpastSEOLocal SEOAIMatt DiamanteNastia Smoroda1 hourLocal SEO 2024 Wrapped: Hits, Misses, and What’s Next for 2025It’s time for our very own Semrush Local 2024 Wrapped! And while we’re not revealing who your top artist was this year, we will be reflecting on the hits and misses of 2024’s local marketing strategies. We're bringing SEO expert Matt Diamante as he takes a look back at the local SEO strategies that delivered big results—and the ones that didn’t hit the mark (at all). Plus, Matt will reveal his predictions for local SEO in 2025 and the things you should start doing to stay ahead of the competition. And yes, we’re going to talk about AI.View webinar infoWatch NowpastContent MarketingSocial MediaNicole PonceBen Kaluza45 minutesBeyond the Hype: Real Talk on Influencer MarketingThis is not just your regular influencer marketing webinar. It’s a peek behind the curtain of how influencer marketing is done from some of the top people in the business. Join us for an eye-opening webinar where Nicole Ponce, the Head of Influencer Marketing at Semrush, and Ben Kaluza, a full-time creator with 700k+ followers, will share their stories and secrets. Get ready to learn how to nurture genuine connections, amplify your brand's voice, and master collaboration from both sides of the table.View webinar infoWatch NowpastLocal SEOSEOLuc DurandMorgan Howard1 hourThe Google Business Profile Game PlanJoin us for a deep dive with top local marketing and SEO expert Luc Durand (yes, the one from Ranking Academy!). Luc is here to answer the big question: what’s next after you've nailed the basics of your GBP?View webinar infoWatch NowpastSEOCrystal CarterErich Casagrande45 minutesSEO for New Websites: Start as an ExpertLaunching a new website is exciting, but it can also feel overwhelming - especially when it comes to SEO and generating traffic. With so much to do, it’s difficult to know where to focus your efforts first. Join Erich Casagrande from Semrush and Crystal Carter, Head of SEO Communications at Wix, for a webinar where they’ll walk you through essential SEO priorities for new websites. They’ll share practical tips and strategies to help you lay a solid SEO foundation from day one and focus on what matters most. Don’t miss this chance to set your website up for long-term success!View webinar infoWatch NowpastSEOLocal SEOAndrew ShotlandMarika Ramishvili1 hourThe Local Pack Blueprint for Top RankingsWant to take your local business to the top of Google Maps? Join our upcoming webinar featuring Andrew Shotland, CEO and founder of Local SEO Guide. We’ll break down real-world examples and use cases, revealing strategies to increase your visibility —whether you run a single location or multiple, serve a highly competitive market, or cover an entire city or region. We'll use Semrush Local’s Map Rank Tracker to investigate actual Google Maps data and uncover valuable insights to help you craft a winning local SEO strategy. You'll also discover how Map Rank Tracker can reveal your rankings alongside your competitors' to measure the impact of your SEO efforts and fine-tune your approach. If you’re looking to boost your position in Google Maps or refine your strategy to get more eyes on your business, this webinar is a must!View webinar infoWatch NowpastSEOContent MarketingSocial MediaRita CidreVictoria BlinovaNitin ManchandaCory JohnsonZaria Parvez45 minutesExpert Roundtable: Insider Tips from Spotlight SpeakersFor every marketing challenge you have, there’s a marketer out there who’s solved it. And guess what…they’re probably in this panel. Join us for a roundtable discussion with some of today’s brightest minds in marketing. Each of our esteemed guests will get 10 minutes in the spotlight to share their top marketing tips and, most importantly, answer your most burning questions.View webinar infoWatch NowLoad more"
