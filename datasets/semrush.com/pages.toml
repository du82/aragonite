title = "Privacy Policy | Semrush"
full_description = '''Semrush Privacy Policy Last Modified Date: July 30, 2024 Table of Contents INTRODUCTION KEY DEFINITIONS INFORMATION WE COLLECT Information Provided Directly by You Information Received From Third Parties Information Collected Automatically Device and Usage Data Third-Party Widgets Cookies and Similar Technologies. HOW WE USE YOUR PERSONAL DATA HOW WE DISCLOSE YOUR PERSONAL DATA DATA RETENTION HOW WE PROTECT YOUR PERSONAL DATA INTERNATIONAL TRANSFERS OF PERSONAL DATA ADDITIONAL SEMRUSH WEBSITES PRIVACY RIGHTS AND CHOICES CHILDREN CONTACT INFORMATION INTRODUCTION This Privacy Policy explains how Semrush collects, uses, stores, discloses and otherwise processes the personal data we collect when you use and interact with our websites and apps that display or link to this Privacy Policy, register for an account and use our Services, visit our branded social media pages, register for, attend or take part in our events, webinars, or contests, participate in our academy or otherwise interact with us in person and/or by email, text message, instant messaging, telephonically, and by other electronic means. It also tells you about your rights and choices with respect to your personal data, and how you can contact us if you have any questions or concerns. This Privacy Policy does not apply to our handling of personal data that we process on behalf of our business customers as a service provider or processor. Our processing of that information is governed by our agreement with our business customers. Please read this Privacy Policy carefully. If you do not agree with the terms of this Privacy Policy, you should not use our website and the Services or otherwise provide us with your personal data. By using and/or accessing our website and the Services or otherwise providing us with your personal data, you acknowledge that you have read and understood this Privacy Policy. Your use of our websites and the Services is also governed by our Terms of Service. This Privacy Policy is effective as of the date first set forth above. We may update this Privacy Policy from time to time. If we make changes, we will post the updated Privacy Policy on this page or another page that links to this page and change the date at the top of this webpage. We encourage you to look for updates and changes to this Privacy Policy by checking this date when you access our website. We will notify you of any modifications to this Privacy Policy that might materially affect the way we use or disclose your personal data prior to the change becoming effective by means of a message on this website, unless another type of notice is required by the applicable law. Your continued use of the website and our Services after we have posted changes to this Privacy Policy or notified you, if applicable, is deemed to be your acceptance of those changes. KEY DEFINITIONS "Affiliates“ means entities in our group who are listed in this Privacy Policy (please read the Affiliates section). “European Data Protection Law” means the General Data Protection Regulation (EU) 2016/679 (GDPR) and applicable national legislation implementing the GDPR and, if applicable, the UK data Protection Act 2018 and the UK GDPR. “Privacy Policy” refers to this Privacy Policy. “Semrush”, “we”, “us” and/or “our” refers to SEMrush Inc. and its Affiliates, unless specified otherwise. “Services” refers to our Software as a Service professional service made available via our websites. “You” and “your” refers to the individual to whom personal data covered by this Privacy Policy relates. INFORMATION WE COLLECT Some of our website’s functionality can be used without providing any personal data, though for using some features of the Services, personal data is required. We process three broad categories of personal data: Information provided directly by you; Information received from third parties; and Information collected automatically. Information Provided Directly by You Account registration. If you register with the Services through our website at https://www.semrush.com/, or through a separate subscription agreement with us, then as part of such registration we will ask you to provide certain personal data, including your name, your company name, your email address and password. If you create an account or log into the Services using third-party services, such as Google, Facebook or LinkedIn, we will receive your name and email address and/or phone number as permitted by your profile settings on the third-party service in order to authenticate you. The information we receive when you authenticate through a third-party service depends on the settings, permissions and privacy policy controlled by that third-party service. You should always check the privacy settings and notices in the relevant third-party services to understand what data may be disclosed to us or shared with our Services. Communication with Semrush. We collect personal data that you voluntarily give us when you contact us with inquiries (including by filling out relevant forms on our websites), engage with our chat bot on the website, respond to one of our surveys, contact our customer support regarding a problem you are experiencing with the Services or otherwise contact us regarding the website or the Services. Transactions. We collect details of transactions you carry out using the Services including information you provide to enable us to fulfill your orders, which may include financial information such as your credit card number. As a paying user of the Services, we will receive your payment transaction details (for example, your name, the amount paid and the date of payment). Payment Information. We collect billing and other payment information (for example, if you sign up for a trial, a paid service or purchase a Third-Party Service), including payment method details, such as credit card number. Additional Payment Information. You may choose to provide additional information such as your VAT, additional billing address or name of the entity that you represent. Identity Verification. In some cases (for example if you request a refund) we may ask you to provide us information such as your billing information (name, transaction ID, last 4 digits of the credit card associated with the account, billing date, etc.), email address, login name, and if needed, information that verifies your identity, in accordance with applicable law. Using our blog, requesting content or creating a Public Profile. If you use our blog, request content or would like to participate in our webinars or events, we may ask you to provide us with information such as your name, job title, your photo or other information. By posting any information on publicly accessible blogs or other areas of our websites you acknowledge and agree that the data you provide on our websites - including information provided to create your public profile (hereinafter "Public Profile") - would be visible to any member of the public who accesses the websites. You can change the information in your Public Profile whenever you want. Testimonials. We collect and display personal testimonials of satisfied customers and users on the Services in addition to other endorsements. With your consent, we may post your testimonial, along with your name, on the Services. If you wish to update or delete your testimonial, you can contact us at privacy@semrush.com. Information Received From Third Parties We may combine personal data we receive from you with personal data we obtain from other sources, such as: Our authorized resellers or distributors, for example, if you purchase access to the Services through one of these partners. The personal data we may receive includes business contact information, including mailing addresses, job titles, email addresses, and phone numbers. Other third parties, such as email campaigns, marketing partners, publicly-available sources and data providers. The personal data we may receive includes company information, location information, demographic information, and business contact information, including mailing addresses, job titles, email addresses, and phone numbers. We may use this information to enhance the information that we already maintain about you and to improve the accuracy of our records, in addition to other purposes described in this Privacy Policy. Information Collected Automatically Like many other commercial websites, we use certain technologies, such as tools for collecting usage data, cookies, web beacons, pixels, and similar technologies, to automatically collect information that may contain personal data as you navigate our websites or use our Services or interact with communications we send to you, subject to your consent where required by applicable laws. Device and Usage Data. When users come to our websites, we may track, collect, and aggregate information indicating, among other things, which pages of our websites were visited, the order in which they were visited, when they were visited, and which hyperlinks were clicked. We also collect information from the URLs from which you linked to our websites. Collecting such information may involve logging the IP address, operating system and browser software used by each user of the websites. We may be able to determine from an IP address a user’s Internet Service Provider and the geographic location of his or her point of connectivity. Third-Party Widgets. Some of our Services contain widgets and social media features, such as the Facebook or LinkedIn button. You are the only person who decides if you would like to press this button and share your personal data with the respective third-party operators of widgets or social media. These widgets and features collect your IP address, the information about the page you are visiting during your use of the Services and may set a cookie to enable the feature to function properly. Widgets and social media features are either hosted by a third party or hosted directly within our Services. Your interactions with these features are governed by the privacy policy of the company providing it and we recommend that you read them prior to sharing your data with such third parties. Mailbox integration Mailbox integration means an integration of Semrush tools with Gmail and/or Microsoft (Outlook, Exchange Online, Office365) accounts (jointly and individually referred to as “Mailbox account”) via API. Some of our tools may ask your permission to integrate your Mailbox account with. In order to enhance your removal requests or outreach emails experience for your productivity and monitoring purposes you can grant us access to your Mailbox account via API only if you voluntarily decide to give us the permission to integrate our tools with your mail account and to choose which email account you would like to connect with our tools. With this integration: you will be able to compose, send, read and process outreach email via a tool’s interface; you will be able to send removal requests regarding backlink(s) which looks unnatural or harmful via a tool’s interface; we will provide you with the information related to your emails sent via tool’s interface. We will show you if your emails were received, opened, if there are any replies to your emails. We will demonstrate your replies to your email via our tool interface. After the integration we will be able to store in our database in the encrypted way the following information related only to outreach emails sent by you via tool interface: Initial email’s subject and body text; Replies email’s subject and body text; API token; Thread and message ids; Recipient(s) and sender of emails; Metadata: time/day of email sending, delivering, opening, replying, email status. Notwithstanding anything herein to the contrary, we will use the data received via Mailbox integration only to provide you with the features mentioned above in order to enhance your email experience for productivity purposes and for monitoring purposes. We may also transfer data received via Mailbox integration as necessary to comply with applicable law or as a part of a merger, acquisition, or sale of assets with notice to users. All other transfers or sales of the user data received via Mailbox integration are prohibited. We will not use the data received via Mailbox integration for any other purposes except providing you with services inside of our tools, specifically we will not use the data received via Mailbox integration for any advertising purposes, including retargeting, personalized or internet-based advertising. All the data received via Mailbox integration will be processed only at the software level. We will allow a person to read the data received via Mailbox integration only if: You first give us affirmative agreement for specific messages; It is necessary for security purposes (such as investigating a bug or abuse); It is necessary to comply with applicable law; or Our use is limited to internal operations and the data received via Mailbox integration (including derivations) have been aggregated and truly anonymized. You can revoke your permission and access to your Mailbox account at any time by clicking the “bin” icon next to the mailbox mention inside the tool. You can delete all your previous emails available due to the integration by deleting the project in the tool during the revocation process, or sending us the relevant request. As soon as you revoke the access, we will remove your Mailbox token which allowed us to carry out the functions mentioned above and stop monitoring your emails immediately. For the purposes of this clause the data received via Mailbox integration means the raw data, aggregated data, anonymized data or derived data. In a case of any conflict between the terms of this clause and terms of the Privacy Policy, the provisions of this clause regarding the data received via Mailbox integration shall prevail. Cookies and Similar Technologies. Google Analytics. The Services use Google Analytics, a web analytics service of Google Ireland Limited (Google Building Gordon House, 4 Barrow St, Dublin, D04 E5W5, Ireland). The use includes the "Universal Analytics" operating mode. This facilitates the assignment of data, sessions and interactions across several devices to a pseudonymous user ID and thus the analysis of a user's activities across devices. API YouTube. Semrush uses YouTube API Services. If you are using our Services, by agreeing to our Privacy Policy you hereby also certify that you have read and agree to YouTube’s General Terms of Service (https://www.youtube.com/t/terms) and Google’s Privacy Policy (https://policies.google.com/privacy?hl=en). In addition to normal procedure for deleting stored data, you can revoke access to your data via the Google security settings page at https://myaccount.google.com/permissions?pli=1. Google Maps API. Semrush uses Google Maps API Services. If you are using our Services, by '''
