["https://semver.org/lang/sl"]
title = "Semantične verzije 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Dodatne oznake za pred-izdaje in metapodatki gradnje so na voljo kot razširitve v obliki GLAVNA.MANJŠA.POPRAVEK. V svetu programske opreme obstaja grozen prostor imenovan “pekel odvisnosti”. Večji kot sistem zraste in več je paketov, ki jih integrirate v vašo programsko opremo, bolj možno se boste našli nekega dne v tem obupu. V sistemih z veliko odvisnostmi lahko izdaja nove verzije paketa hitro postane nočna mora. Če so specifikacije odvisnosti preveč ozke, ste v nevarnosti zaklenjenih verzij (nezmožnost nadgradnje paketa brez, da izdajate nove verzije za vsak odvisni paket). Če so odvisnosti določene preveč ohlapno, boste neizogibno ugriznjeni s strani promiskuitete verzije (ob predpostavki, da je združljivost z večimi prihodnjimi verzijami razumna). Pekel odvisnosti je, kjer ste vi, ko je verzija zaklenjena in/ali vam promiskuiteta verzije preprečuje, da enostavno in varno prestavite vaš projekt naprej. Kot rešitev tega problema, predlagam enostaven skupek pravil in zahtev, ki diktirajo, kako naj bodo številke verzij določene in povečane. Ta pravila so osnovana na in ne nujno omejena na pred obstoječe široko skupne prakse v uporabi tako v programski opremi zaprte kode kot odprte kode. Da ta sistem deluje, morate najprej določiti javni API. To lahko sestoji iz dokumentacije ali je izvršeno s strani same kode. Ne glede na to, pomembno je, da je ta API jasen in točen. Ko enkrat identificirate vaš javni API, lahko komunicirate spremembe na njem z določenimi povečanji na vaši številki verzije. Smatrajte obliko verzije X.Y.Z (Glavna.Manjša.Popravek). Popravki hroščev ne vplivajo na API a povečujejo številko popravka, nazaj združljivi API dodatki/spremembe povečujejo manjšo verzijo in nazaj nezdružljive API spremembe povečujejo glavno verzijo. Ta sistem se imenuje “Semantične verzije.” Pod to shemo, številke verzij in način, kako spreminjajo poslani pomen o podležeči kodi in kaj je bilo spremenjeno iz ene verzije v naslednji."
