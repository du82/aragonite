["https://semver.org/lang/hr"]
title = "Semantičko verzioniranje 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Dodatne oznake za pred-izdanja i metapodatke builda mogu se koristiti kao proširenje na VEĆA.MANJA.ZAKRPA format. U svijetu upravljanja softverom postoji strašno mjesto koje zovemo “pakao ovisnosti.” Što više vaš sustav raste i što više paketa integrirate u vaš softver, vjerojatnije je da ćete se, jednoga dana, naći u toj jami očaja. U sustavima s više ovisnosti, izdavanje novih verzija paketa, može se vrlo brzo pretvoriti u noćnu moru. Ako su specifikacije ovisnosti previše stroge, postoji opasnost zaključavanja verzije (nemogućnosti nadogradnje paketa bez potrebe izdavanja nove verzije svakog ovisnog paketa). Ako su pak ovisnosti specificirane previše slobodno, sigurno ćete osjetiti posljedice verzijskog promiskuiteta (pretpostavke kompatibilnosti s više budućih verzija nego što je razumno). Pakao ovisnosti je slučaj gdje zaključavanje verzije i/ili verzijski promiskuitet sprječavaju lagano i sigurno napredovanje projekta. Kao rješenje tog problema predlažem jednostavan set pravila i zahtjeva koji će nalagati kako se dodjeljuju i inkrementiraju oznake verzija. Ova se pravila temelje, no nisu nužno i ograničena, na već postojećoj i raširenoj uobičajenoj praksi u projektima otvorenog i zatvorenog koda. Kako bi ovaj sustav funkcionirao, potrebno je prvo objaviti javni API. Možemo to primijeniti u dokumentaciji ili u samom kodu. U svakom slučaju, važno je da API bude jasan i precizan. Jednom kad identificiramo javni API, komuniciramo promjene u njemu kroz specificirane inkrementacije u oznake/broja verzije. Uzmimo format verzije X.Y.Z (VEĆA.MANJA.ZAKRPA). Ispravci bugova koji ne utječu na API inkrementiraju oznaku zakrpe, unatrag-kompatibilni dodaci/promjene u APIju inkrementiraju manju verziju, a unatrag inkompatibilne promjene u APIju inkrementiraju veću verziju. Ovaj sam sustav nazvao “Semantičko verzioniranje”. Unutar ove sheme, oznake verzije i način na koji se mijenjaju prenose određene informacije o kodu koji se nalazi ispod i što se mijenjalo od jedne do druge verzije."
