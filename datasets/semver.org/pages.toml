["https://semver.org/lang/hy/spec/v2.0.0-rc.1.html"]
title = "Սեմանտիկ Տարբերակում 2.0.0-rc.1 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Ծրագրային ապահովման մենեջմենթի աշխարհում գոյություն ունի «կախվածությունների դժոխք» (dependency hell) հասկացություն։ Ձեր համակարգի մեծացման և դրան ինտեգրված փեքիջների քանակի ավելացման հետ մեծանում է հավանականությունը, որ դուք վաղ թե ուշ կկանգնեք այս խնդրի առաջ։ Այն համակարգերում, որոնք ունեն շատ կախվածություններ, նոր տարբերակի թողարկումը կարող է արագ վերածվել մղձավանջի։ Եթե կախվածությունների սպեցիֆիկացիան շատ խիստ է, դուք կարող եք կանգնել նոր տարբերակի թողարկման արգելքի (version lock) առաջ (անհնար է դառնում թարմացնել ծրագիրը՝ առանց թարմացնելու կախման մեջ գտնվող բոլոր փեքիջները)։ Մյուս կողմից էլ, եթե կախվածությունների սպեցիֆիկացիան շատ ազատ է, դուք անխուսափելիորեն կբախվեք տարբերակի անհամապատասխանության (version promiscuity) խնդրին․ անհիմն է ենթադրությունը, որ ձեր ծրագիրը կմնա համատեղելի ապագա տարբերակների հետ։ «Կախվածությունների դժոխքը» մի իրավիճակ է, երբ տարբերակի թողարկման և/կամ տարբերակի անհապատասխանության արգելքը թույլ չի տալիս ձեզ հեշտ և անվտանգ զարգացնել ձեր նախագիծը։ Որպես այս խնդրի լուծում՝ ես առաջարկում եմ պարզ կանոններ և պահանջներ, որոնք սահմանում են, թե ինչպես են սահմանվում և մեծացվում տարբերակների համարները։ Նախևառաջ, որպեսզի այս կանոններն աշխատեն, դուք պետք է սահմանեք փաբլիք API: Այն կարող է նկարագրված լինել ինչպես դոկումենտացիայի, այնպես էլ կոդի մեջ։ Կարևոր է, որ API֊ը լինի ճիշտ և հասկանալի։ Ձեր API֊ը հայտարարելուց հետո դուք փոփոխությունների մասին կտեղեկացնեք տարբերակի համարը մեծացնելու միջոցով։ Դիտարկենք այս ֆորմատով ներկայացված տարբերակ՝ X.Y.Z (ՄԱԺՈՐ․ՄԻՆՈՐ․ՓԱԹՉ)։ Սխալների ուղղումները (bug fix), որոենք չեն ազդել API-ի վրա, մեծացնում են ՓԱԹՉ֊ը։ Հետ համատեղելի հավելումները և փոփոխությունները մեծացնում են ՄԻՆՈՐ֊ը, հետ համատեղելիությունը խախտող փոփոխությունները մեծացնում են ՄԱԺՈՐ֊ը։"
