title = "სემანტიკური ვერსიონირება 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "როდესაც გვაქვს ვერსიის ნომერი მაჟორული.მინორული.პატჩი, უნდა გაიზარდოს: პრე-რელიზის და ბილდის მეტა-მონაცემების დამატებითი აღნიშვნები შესაძლებელია მიემატოს ფორმატს მაჟორული.მინორული.პატჩი პროგრამული უზრუნველყოფის შემუშავების მართვის პროცესში არსებობს ცნება “დამოკიდებულებათა ჯოჯოხეთი” (dependency hell). რაც უფრო იზრდება სისტემა და რაც უფრო მეტი ბიბლიოთეკის ინტეგრირება ხდება პროექტში, მით უფრო იზრდება ამ სიტუაციაში მოხვედრის ალბათობა. სისტემაში სადაც ბევრი დამოკიდებულებაა, ახალი ვერსიის გამოშვება შეიძლება გადაიქცეს დიდ თავის ტკივილად. თუ დამოკიდებულებების სპეციფიკაცია ზედმეტად მკაცრია, არსებობს ახალი ვერსიის გამოშვების ბლოკირების საფრთხე (შეუძლებელია პაკეტის განახლება თითოეული დამოკიდებული ბიბლიოთეკის განახლების გარეშე). თუ დამოკიდებულებების სპეციფიკაცია ზედმეტად თავისუფალია, ადრე თუ გვიან აუცილებლად დადგება ვერსიების შეუსაბამობის პრობლემა (უსაფუძვლო იმედი მომავალ ვერსიებთან თავსებადობისა). “დამოკიდებულებათა ჯოჯოხეთი” არის მდგომარეობა როდესაც დამოკიდებულებების არსებობა ხელს უშლის პროექტის წინსვლას და განვითარებას."
