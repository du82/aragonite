["https://semver.org/lang/it/spec/v2.0.0-rc.1.html"]
title = "Semantic Versioning 2.0.0-rc.1 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Nel mondo della gestione del software esiste un posto terribile chiamato “inferno delle dipendenze”. Più cresce il sistema, più crescono i pacchetti da integrare in esso e più è probabile ritrovarsi, un giorno, in questa valle di lacrime. Nei sistemi con molte dipendenze, il rilascio di nuove versioni dei package può diventare presto un incubo. Se le specifiche sulle dipendenze sono troppo stringenti, si corre il rischio di finire quanto prima in un cosiddetto version lock (ossia l’impossibilità di aggiornare un package senza dover anche rilasciare le nuove versioni di ciascun altro package ad esso dipendente). Se invece le dipendenze sono troppo lasche, si verrà inevitabilmente colti dal fenomeno della version promiscuity (assumendo una compatibilità con più versioni future di quanto non sia ragionevole). L’inferno delle dipendenze si ha appunto quando ci si trova in una di queste due situazioni estreme ― version lock e/o version promiscuity ― che impedisce l’aggiornamento facile e sicuro del progetto. Come soluzione a questo problema, propongo un semplice insieme di regole e requisiti che determinino come i numeri di versione vengano assegnati e incrementati. Affinché questo metodo funzioni, si deve innanzitutto dichiarare un API pubblica. Questa può essere semplicemente documentazione o meglio ancora codice che ne valida i vincoli. A prescindere, l’importante è che un API simile sia chiara e precisa. Una volta identificate le tue API pubbliche, si comunicano le modifiche ad esse attraverso incrementi specifici al numero di versione. Si consideri un formato di versione del tipo X.Y.Z (Major.Minor.Patch). Le risoluzioni ad anomalie che non intaccano le firme delle API causano un incremento della sola componente patch del numero di versione, aggiunte/modifiche retrocompatibili delle API causano un incremento della componente minor del numero di versione version, e infine modifiche non retrocompatibili delle API si traducono nella modifica della componente major del numero di versione."
author = "Tom Preston-Werner"
year_published = 2025
clearnet = "https://semver.org/lang/it/spec/v2.0.0-rc.1.html"
