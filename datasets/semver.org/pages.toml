["https://semver.org/lang/ro"]
title = "Numerotarea Semantica a Versiunii Software 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Etichete adiționale pentru pre-release și build sunt disponibile ca extensii ale formatului MAJOR.MINOR.PATCH. În lumea dezvoltării de software exista ceea ce se numește “iadul dependențelor”. Cu cât sistemul crește și cu cât integrezi mai multe pachete în soft-ul tău, cu atât crește posibilitatea să ajungi, într-o zi, în acest iad. În sistemele cu multe dependențe, lansarea de versiuni noi ale pachetelor poate sa devină ușor un coșmar. Daca specificațiile dependențelor sunt prea stricte, există riscul de înghețare a versiunii (inabilitatea de a îmbunătății un pachet fara a lansa versiuni noi pentru fiecare din pachetele dependente). Dacă specificațiile sunt prea flexibile, exista riscul de promiscuitate a versiunii (compatibilitate cu prea multe versiuni viitoare). Iadul dependențelor este acela când înghețarea versiunii sau promiscuitatea versiunii te împiedică să avansezi proiectul ușor și sigur. Ca o soluție la această problemă, propun un set de reguli și cerințe simple care să stabilească modul în care să se stabilească și să se incrementeze numerele de versiune. Aceste reguli sunt bazate pe, dar nu neapărat limitate la, practici răspândite folosite în dezvoltarea de software open-source și closed-source. Pentru ca acest sistem de numerotare a versiunii sa funcționeze, întâi trebuie stabilit și declarat un API public. Acesta poate consta în documentație sau să reiasă automat din codul sursă. Indiferent de metoda aleasă, este important ca acest API sa fie clar și foarte specific. Odată ce ai stabilit API-ul public, vei comunica schimbări efectuate asupra sa prin incrementări ale numărului de versiune. Sa luam în considerare formatul X.Y.Z (Major.Minor.Patch). Corectările de bug-uri care nu afectează API-ul vor incrementa versiunea patch, adăugările și modificările care de asemenea păstrează compatibilitatea vor incrementa versiunea minoră, iar adăugările și modificările care sunt incompatibile vor incrementa versiunea majoră."
author = "Tom Preston-Werner"
year_published = 2025
clearnet = "https://semver.org/lang/ro"
