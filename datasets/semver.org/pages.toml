["https://semver.org/lang/kab/spec/v2.0.0.html"]
title = "Asefrek anamkan n yileqman 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Llant tecraḍ nniḍen i yileqman send tuffɣa (pre-release) d yidfersefka n usali (build metadata) i irennun d isiɣzaf i talɣa MAJOR.MINOR.PATCH. Deg umaḍal n usnefli n yiseɣẓanen, tella yiwet n tegnit ttkukrun-tt medden ssawalen-as “times n teglin” (seg Teglizit “dependency hell”). Simal yettimɣur unagraw-nwen, simal trennum iwemmusen i useɣẓan-nwen, simal yettaẓ-d wass deg ur as-tettafem ara akk ixef-is deg wanu-a yesbelɛen asirem. Deg unagraw deg i caḍent teglin, asufeɣ n yileqman imaynuten n kra yisger yezmer ad yuɣal awal sin am yir targit. Ma yella ilugan n tigelt bezzaf ḥersen, tzemrem ad tesweḥlem ileqman-nwen (ur tettizmirem ara ad tleqmem isger war ma tessufɣem-d ileqman imaynuten n yal isger uɣur yurez). Ma yella tiglin bezzaf serrḥent, iban ad d-teɣlim deg uceṛṛeɛ n ulqem (aqbal s tmara n umɛabi d yileqman i d-itteddun nnig wayen ilaqen). Ma ur ken-yeǧǧi ara usewḥel n yileqman neɣ aceṛṛeɛ n yileqman ad tseddum asenfar-nwen ar zdat s tefses d tɣellist, ad d-tafem iman-nwen deg “tmes n teglin”. Akken ad yefru wugur-a, summreɣ-d kra n yilugan d tmariwin ara awen-d-yinin amek ara tesbeddem neɣ ad tesnernim uṭṭunen n yileqman. Ilugan-a bnan ― ɣas akken mačči ala ɣef waya ― ɣef tsemras i nennum, yellan yakan ttwaseqdacent s waṭas ama deg useɣẓan uslig ama deg win yeldin. Akken ad yeddu unagraw-a, ilaq ad tesbeddem API tazayezt (agrudem n usihel n yesnasen). Aya yezmer ad yili s usedles neɣ ad yettwaseyyef deg tengalt yakan. Akken yebɣu yili, API-a ilaq ad tettwafham yerna ad temqet. Mi dayen tesbeddem-tt, ad tessawalem ɣef ubeddel-is s usnerni n wuṭṭun-nwen n ulqem. Ma nesɛa alqem s talɣa X.Y.Z (Major.Minor.Patch), iseɣtiyen ur nettbeddil ara API ad snernin alqem patch, abeddel d usegmu n API yemɛaban d wayen yezrin ad snernin minor, abeddel n API yemyagin d wayen yezrin ad yesnerni alqem major. Semmaɣ-as i unagraw-a “aleqqem anamkan”. S unagraw-a, uṭṭunen n ulqem d wamek s i ttnernin ttaken anamek i tengalt uɣur cudden d wayen yettbeddilen seg ulqem ar wayeḍ."
author = "Tom Preston-Werner"
year_published = 2025
