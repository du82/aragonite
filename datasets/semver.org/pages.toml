["https://semver.org/lang/hy/spec/v2.0.0.html"]
title = "Սեմանտիկ Տարբերակում 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Այս ֆորմատով ներկայացված տարբերակի համարի (version number) դեպքում՝ ՄԱԺՈՐ․ՄԻՆՈՐ․ՓԱԹՉ (MAJOR.MINOR.PATCH), պետք է մեծացնել՝ Կարելի է անել նաև հավելյալ նշանակումներ՝ որպես հավելում ՄԱԺՈՐ․ՄԻՆՈՐ․ՓԱԹՉ ֆորմատին․ մինչթողարկումային (pre-release) պիտակ (label) և բիլդ-մետատվյալ (build metadata)։ Ծրագրային ապահովման մենեջմենթի աշխարհում գոյություն ունի «կախվածությունների դժոխք» (dependency hell) հասկացություն։ Ձեր համակարգի մեծացման և դրան ինտեգրված փեքիջների քանակի ավելացման հետ մեծանում է հավանականությունը, որ դուք վաղ թե ուշ կկանգնեք այս խնդրի առաջ։ Այն համակարգերում, որոնք ունեն շատ կախվածություններ, նոր տարբերակի թողարկումը կարող է արագ վերածվել մղձավանջի։ Եթե կախվածությունների սպեցիֆիկացիան շատ խիստ է, դուք կարող եք կանգնել նոր տարբերակի թողարկման արգելքի (version lock) առաջ (անհնար է դառնում թարմացնել ծրագիրը՝ առանց թարմացնելու կախման մեջ գտնվող բոլոր փեքիջները)։ Մյուս կողմից էլ, եթե կախվածությունների սպեցիֆիկացիան շատ ազատ է, դուք անխուսափելիորեն կբախվեք տարբերակի անհամապատասխանության (version promiscuity) խնդրին․ անհիմն է ենթադրությունը, որ ձեր ծրագիրը կմնա համատեղելի ապագա տարբերակների հետ։ «Կախվածությունների դժոխքը» մի իրավիճակ է, երբ տարբերակի թողարկման և/կամ տարբերակի անհապատասխանության արգելքը թույլ չի տալիս ձեզ հեշտ և անվտանգ զարգացնել ձեր նախագիծը։"
