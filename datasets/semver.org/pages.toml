["https://semver.org/lang/bg"]
title = "Семантично версиониране 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Използвайки номериране на версиите като ГЛАВНА.ВТОРОСТЕПЕННА.КРЪПКА, трябва да увеличите: ГЛАВНАта версия, при направени несъвместими промени в приложно-програмният интерфейс (API). ВТОРОСТЕПЕННАта версия, когато промените са обратно съвместими. КРЪПКА-номера, когато са направени обратно съвместими поправки. Допускат се допълнителни етикети за предварителни издания и билд-метаданни, като разширения на формата за версия ГЛАВНА.ВТОРОСТЕПЕННА.КРЪПКА. В света на софтуерния мениджмънт съществува страховито място, наречено „ад на зависимостите“. Колкото по-голяма става вашата система и колкото повече библиотеки интегрирате в проекта си, толкова по-голяма е вероятността един ден да се окажете в тази яма на отчаяние. В системи с множество зависимости пускането на нови версии на някои от тях може бързо да се превърне в кошмар. Ако спецификациите за зависимост са твърде стриктни, рискувате да блокирате версията (невъзможността да обновите пакет, освен ако не пускате нова версия при всяка промяна в библиотека, от която той зависи). Ако зависимостите са посочени твърде слабо, неизбежно ще ви застигне несъвместимостта на версиите (поради заявена съвместимост с повече бъдещи версии, отколкото е разумно). Адът на зависимостта е мястото, където се намирате, когато блокирането на версията и/или несъвместимостта на версията ви пречат лесно и безопасно да движите проекта си напред."
