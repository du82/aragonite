["https://semver.org/lang/hu/spec/v2.0.0.html"]
title = "Szemantikus Verziószámozás 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "További verziócímkéket és kiadással kapcsolatos metaadatokat a MAJOR.MINOR.PATCH formátum kiegészítéseként lehet még hozzáadni. A szoftvermenedzsment univerzumában létezik egy rettegett hely: a verziópokol. Minél nagyobbra nő a rendszered, minél több csomagot adsz hozzá, annál valószínűbb, hogy előbb-utóbb a kellős közepében találod magad. Sok függőséggel rendelkező rendszerekben az új csomagverziók kiadása hamar rémálommá válhat. Ha túl szigorúak a függőségi specifikációid, fennáll a “verzió zár” veszélye (amikor már nem tudsz úgy frissíteni egy csomagot, hogy vele együtt az összes tőle függő csomagot ne kelljen frissíteni). Ugyanakkor, ha túl szabadon vannak ugyanezek megszabva, elkerülhetetlen, hogy idővel utolérjen a verzió-keveredés (amikor jobb kompatibilitást remélünk szoftver komponensek között, mint ami realisztikus). A verziópokol az, amikor e két helyzet közül az egyik vagy akár egyszerre mindkettő meggátol a projekt könnyed és rizikómentes előrevitelében. A probléma megoldásaként javaslom ezen egyszerű szabályok és követelmények halmazát, melyek megszabják hogyan rendeljünk hozzá, illetve inkrementáljuk a verziószámokat. Ezen szabályok a már jól bevett gyakorlatokon alapulnak ― ám, nem szükségszerűen korlátozódnak rájuk -, mind zárt- és nyílt forráskódú szoftverekben. A rendszer első feltétele egy publikus API létrehozása. Ez egyaránt lehet dokumentáció formájában, vagy a programon keresztül meghatározva. Kulcsfontosságú, hogy ez az API átlátható es precíz legyen. Miután az API-t kiadtuk, minden változást a szoftverben verziószám növelésével kommunikálunk. Tekintsük az X.Y.Z(Major.Minor.Patch) verzióformátumot. Hibajavításoknál, melyek nem érintik az API-t, növeljük a patch verziót, visszafelé kompatibilis API kiegészítések/módosítások esetén növeljük a minor verziót, és visszafelé nem kompatibilis módosításoknál növeljük a major verziót. A rendszert “Szemantikus Verziószámozásnak” keresztelem. Ezen séma alapján, a verziószámok és ahogyan ezek változnak, jelentést hordoznak a mögöttes kódról és hogy mi változott egyik verzióról a másikra térve."
author = "Tom Preston-Werner"
year_published = 2025
