["https://semver.org/lang/sv"]
title = "Semantisk versionshantering 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Ibland kan det även förekomma ytterligare delar i versionsnumret för att markera t.ex. en test- eller betaversion. I mjukvaruutvecklingens värld finns det en obehaglig plats, det så kallade “beroendeträsket”. Ju större ditt system blir och ju fler paket du integrerar i ditt program, desto större är risken att du en dag finner dig själv i förtvivlans grepp. I system med många beroenden kan nya versioner av paket snabbt bli en mardröm. Om de specificerade beroendena är för hårt satta är risken stor att du hamnar i ett versionslås (oförmågan att uppgradera ett paket utan att släppa nya versioner av alla paket det finns beroende till). Om beroendena är specificerade för löst kommer du oundvikligen hamna i en versionsnaivitet (övertro på kompabilitet med nyare versioner). Du är i ett beroendeträsk om versionslås och/eller versionsnaivitet förhindrar dig att enkelt och säkert ta ditt projekt framåt. Som en lösning på detta problem föreslår jag en enkel samling regler och krav som beskriver hur versionsnummer ska tilldelas och räknas upp. Dessa regler är baserade på, men inte nödvändigt begränsade till, redan existerande välkänd och vanlig praxis som används både för sluten och öppen källkod. För att detta system ska fungera måste du deklarera ett publikt API. Detta kan bestå av dokumentation eller vara en del av själva källkoden. Oavsett vilket är det viktigt att detta API är klart och tydligt. När du har identifierat ditt publika API kommunicerar du ändringar i det med specifik ökning av versionsnumret. Överväg X.Y.Z (Major.Minor.Patch) som format på versionsnumret. Buggfixar som ej påverkar API:t ökar patch-versionen, bakåtkompatibla API-ändringar/tillägg ökar minor-versionen och icke bakåtkompatibla API-ändringar ökar major-versionen. Jag kallar detta system “Semantisk versionshantering”. Under detta schema förmedlar versionsnumret och dess förändringar mening till den underliggande koden och hur den har förändrats från en version till en annan."
author = "Magnus Österlund"
year_published = 2025
