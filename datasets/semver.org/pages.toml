["https://semver.org/lang/da/spec/v2.0.0.html"]
title = "Semantisk versionsstyring 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Yderligere etiketter til pre-release og build-metadata er tilgængelige som udvidelser til MAJOR.MINOR.PATCH-formatet. I verden af ​​software management findes der et frygtet sted kaldet “afhængighedshelvede.” Jo større dit system vokser, og jo flere pakker du integreres i din software, jo større sandsynlighed er der for, at du finder dig selv, en dag, i denne fortvivlelses hule. I systemer med mange afhængigheder kan frigivelse af nye pakkeversioner hurtigt blive et mareridt. Hvis afhængighedsspecifikationerne er for stramme, er du med fare for versionslås (manglende evne til at opgradere en pakke uden at skulle frigive nye versioner af hver afhængig pakke). Hvis afhængigheder er specificeret for løst, vil du uundgåeligt blive bidt af versionspromiskuitet (forudsat kompatibilitet med flere fremtidige versioner end rimeligt). Afhængighedshelvede er, når versionslås og/eller versionspromiskuitet forhindrer dig i nemt og sikkert at komme videre med dit projekt. Som en løsning på dette problem foreslår vi et simpelt sæt regler og krav, der dikterer, hvordan versionsnumre tildeles og øges. Disse regler er baseret på, men ikke nødvendigvis begrænset til, allerede eksisterende udbredt almindelig praksis i brug i både lukket og open source-software. For at dette system skal fungere, skal du først erklære en offentlig API. Dette kan evt bestå af dokumentation eller håndhæves af selve koden. Uanset hvad er det vigtigt, at dette API er klar og præcis. Når du identificerer dit offentlige API, kommunikerer du ændringer til det med specifikke ændringer til dit versionsnummer. Overvej et versionsformat af X.Y.Z (Major.Minor.Patch). Fejlrettelser der ikke påvirker API’et øger patchversionen (Z), bagudkompatibelt API med tilføjelser/ændringer øger den mindre version (Y) og bagud inkompatible API ændringer øger hovedversionen (X). Vi kalder dette system “Semantisk versionering.” Under denne ordning, formidler versionsnumrene mening om den underliggende kode og hvad der har blevet ændret fra den ene version til den næste."
author = "Jens Kristian Villadsen"
year_published = 2025
clearnet = "https://semver.org/lang/da/spec/v2.0.0.html"
