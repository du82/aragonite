["https://semver.org/lang/sk"]
title = "Sémantické verziovanie 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Značenie predbežných verzií a pridávanie metadát verzií je možné rozšírením spomínaného formátu MAJOR.MINOR.PATCH o potrebné informácie. Vo svete softvéru, jeho vývoja a správy existuje hrozné miesto nazývané peklo závislostí (angl. dependency hell). Znamená to, že čím viac váš systém rastie a máte v ňom integrovaných čoraz viac knižníc, tým je väčšia pravdepodobnosť, že sa, kompletne zúfalí, v tomto pekle sami ocitnete. Ak majú systémy veľa závislostí, raz-dva sa vám stane, že vydávanie novej verzie sa stane nočnou morou. Ak je špecifikácia závislostí príliš striktná, hrozí vám, že ostanete na jednej verzii (angl. version lock) a nebudete mať možnosť prejsť na ďalšiu verziu bez toho, aby ste vydali ďalšie verzie všetkých balíčkov, na ktorých závisí. Naopak, ak je špecifikácia závislostí príliš voľná, prídete na to, že váš systém je kompatibilný s viac verziami, ako je potrebné. V pekle závislostí sa nachádzate, ak ste zviazaný určitou verziou, prípadne nie je presne špecifikované, ktorú máte použiť. Jednoducho, bráni vám to v tom, aby ste sa so svojim projektom pohli bezpečne vpred. Riešením tohto problému je jednoduchý súbor pravidiel, ktorý určuje, ako budú čísla verzií priraďované a zväčšované. Tieto pravidlá sú založené (no nie nevyhnutne obmedzené) na už existujúcich bežne zaužívaných praktikách vo vývoji otvoreného, či uzavretého softvéru. Pre fungovanie tohto systému si musíte najskôr zadefinovať rozhranie popisujúce spôsob, akým sa bude komunikovať s vaším systémom (ďalej len API). Môže byť zadefinované formou dokumentácie, prípadne vynútené samotným kódom. Bez ohľadu na formu akou to bude, je dôležité aby toto API bolo presné a jasné. Akonáhle budete mať zadefinované vaše API, jeho zmeny budete oznamovať špecifickým zväčšením čísla verzie vášho systému. Uvažujme, že číslo verzie bude vo formáte MAJOR.MINOR.PATCH. Opravy chýb, ktoré nemenia vaše API, zväčšujú číslo PATCH verzie. Spätne kompatibilné zmeny API zväčšujú číslo MINOR verzie a spätne nekompatibilné zmeny API zväčšujú číslo MAJOR verzie."
author = "Tom Preston-Werner"
year_published = 2025
