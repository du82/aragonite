["https://semver.org"]
title = "Semantic Versioning 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Additional labels for pre-release and build metadata are available as extensions to the MAJOR.MINOR.PATCH format. In the world of software management there exists a dreaded place called “dependency hell.” The bigger your system grows and the more packages you integrate into your software, the more likely you are to find yourself, one day, in this pit of despair. In systems with many dependencies, releasing new package versions can quickly become a nightmare. If the dependency specifications are too tight, you are in danger of version lock (the inability to upgrade a package without having to release new versions of every dependent package). If dependencies are specified too loosely, you will inevitably be bitten by version promiscuity (assuming compatibility with more future versions than is reasonable). Dependency hell is where you are when version lock and/or version promiscuity prevent you from easily and safely moving your project forward. As a solution to this problem, we propose a simple set of rules and requirements that dictate how version numbers are assigned and incremented. These rules are based on but not necessarily limited to pre-existing widespread common practices in use in both closed and open-source software. For this system to work, you first need to declare a public API. This may consist of documentation or be enforced by the code itself. Regardless, it is important that this API be clear and precise. Once you identify your public API, you communicate changes to it with specific increments to your version number. Consider a version format of X.Y.Z (Major.Minor.Patch). Bug fixes not affecting the API increment the patch version, backward compatible API additions/changes increment the minor version, and backward incompatible API changes increment the major version. We call this system “Semantic Versioning.” Under this scheme, version numbers and the way they change convey meaning about the underlying code and what has been modified from one version to the next."
author = "Tom Preston-Werner"
year_published = 2025
clearnet = "https://semver.org"
tags = ["0.y.z", "1.0.0?", "2.0.0", "42.0.0", "accidentally", "alter", "api?", "backus–naur", "backward", "breaking"]
language = "en"
internal-references = ["none"]
external-references = ["creativecommons.org", "github.com", "regex101.com", "tom.preston-werner.com", "tools.ietf.org"]

["https://semver.org/lang/he/spec/v2.0.0.html"]
title = "Semantic Versioning 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "תוויות נוספות עבור גרסאות קדם הפצה ובניית מטא-דאטה זמינות כתוספת לפורמט MAJOR.MINOR.PATCH. בעולם של ניהול תוכנה קיים מקום מפחיד בשם “גיהנום התלויות (dependency hell)”. ככל שהמערכת גדלה ואתה משלב יותר ויותר חבילות לתוכנה, קיים סיכוי גבוה יותר שתמצא את עצמך, יום אחד, בבור של יאוש. בתוכנות עם המון תלויות, שחרור גרסה של חבילה חדשה יכול במהירות להפוך לסיוט. אם מפרט התלויות הדוק מידי, אתה בסכנה של “נעילת גרסה (version lock)” (חוסר היכולת לשדרג חבילה מבלי לשחרר גרסה חדשה של כל חבילה תלויה). אם מפרט התלויות רופף מידי, באופן בלתי נמנע אתה תכווה ע”י “מתירנות גרסה (version promiscuity)” (השערה של תאימות, יותר מהסביר, עם גרסאות עתידיות). “גיהנום התלויות” הוא כאשר אתה נמצא במקום בו נעילת גרסה ו/או מתירנות גרסה מונעים ממך להניע את הפרויקט שלך קדימה בקלות ובבטחה. על מנת לפתור בעיה זו, מוצע סט פשוט של כללים ודרישות המכתיבים כיצד מספרי גרסאות יוקצו ויוגדלו. כללים אלה מבוססים על מנהגים משותפים, קיימים ונפוצים בפרויקטי קוד פתוח וסגור. על מנת שמערכת זו תעבוד, תחילה צריך להכריז על API ציבורי. זה אולי יהיה מורכב מתיעוד או יאכף על ידי הקוד עצמו. בכל מקרה, זה חשוב שה API יהיה ברור ומדויק. ברגע שאתה מגדיר את ה API הציבורי שלך, אתה מתקשר בו את השינויים עם תוספות ספציפיות למספר הגרסה. הסתכל על תבנית גרסה של X.Y.Z (בפורמט Major.Minor.Patch). תיקוני באגים שלא משפיעים על ה API יגדילו את מספר את מספר התיקון (Patch), תוספות / שינויים תואמי API לאחור יגדילו את הגרסה המשנית (Minor), ושינויים שאינם נתמכים לאחור ב API יגדילו את הגרסה הראשית (Major)."
author = "Tom Preston-Werner"
year_published = 2025
