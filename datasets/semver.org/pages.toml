["https://semver.org/lang/pl"]
title = "Wersjonowanie semantyczne 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Dodatkowe oznaczenia dla wydania przedpremierowego lub meta-danych buildu są dostępne jako rozszerzenia formatu MAJOR.MINOR.PATCH. W świecie zarządzania oprogramowaniem istnieje przerażające miejsce nazywane „piekłem zależności”. Im bardziej twój system rośnie i im więcej pakietów integrujesz w swoim oprogramowaniu, tym większe jest prawdopodobieństwo, że pewnego dnia znajdziesz się w tej otchłani rozpaczy. W systemach z wieloma zależnościami, wydawanie nowych wersji pakietu może szybko stać się koszmarem. Jeśli zależności są określone zbyt wąsko, jesteś zagrożony blokadą wersji (niemożnością zaktualizowania pakietu bez konieczności wydania nowych wersji każdego zależnego pakietu). Jeśli zależności są określone zbyt luźno, nieuchronnie natniesz się na „rozwiązłość wersji” (założenie kompatybilności z większą liczbą kolejnych wersji niż jest to rozsądne). Piekłem zależności jest sytuacja, w której blokada wersji i/lub rozwiązłość wersji uniemożliwiają wygodny i bezpieczny rozwój twojego projektu. Jako rozwiązanie tego problemu proponuję prosty zbiór zasad i wymogów, które regulują jak przypisywać i zwiększać numery wersji. Zasady te są oparte, ale niekoniecznie ograniczone, na istniejących wcześniej, szeroko rozpowszechnionych praktykach, stosowanych zarówno w zamkniętym, jak i otwartym oprogramowaniu. Aby ten system działał, musisz najpierw określić publiczne API. Może to być dokumentacja lub może wymusić je sam kod źródłowy. Niezależnie od sposobu określenia, ważne jest, by to API było przejrzyste i precyzyjne. Kiedy już masz swoje publiczne API, komunikujesz zmiany w nim określonymi zwiększeniami w swoim numerze wersji. Rozważmy format wersji X.Y.Z (major.minor.patch). Naprawy błędów nieingerujących w API zwiększają wersję patch, kompatybilne wstecz dodatki/zmiany w API zwiększają wersję minor, a niekompatybilne wstecz zmiany w API zwiększają wersję major."
author = "Tom Preston-Werner"
year_published = 2025
