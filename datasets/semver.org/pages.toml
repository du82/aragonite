["https://semver.org/lang/ca"]
title = "Gestió semàntica de versions 2.0.0 | Semantic Versioning"
description = "Semantic Versioning spec and website"
full_description = "Es poden afegir etiquetes addicionals per a versions preliminars i metadades de compilació com a extensió del format MAJOR.MINOR.PATCH. Al món de la gestió del programari hi ha un lloc temut anomenat “l’infern de les dependències” (de l’anglès “dependency hell”). Com més gran creixi el vostre sistema i més components hi integreu, més probable serà que us trobeu, algun dia, en aquest abisme de desesperació. En sistemes amb moltes dependències, publicar la versió d’un nou component pot esdevenir ràpidament un malson. Si les regles de dependència són massa estrictes, us podeu trobar en el perill de blocar les vostres versions, (la incapacitat d’actualitzar un component sense haver de publicar una nova versió de cada component que en depèn d’ell). En canvi, si les regles de dependència són massa toves, inevitablement patireu la promiscuïtat de versions (mantenir una compatibilitat amb més versions futures del que seria raonable). L’infern de les dependències és quan el bloqueig o la promiscuïtat de versions us impedeixen avançar el vostre projecte de manera fàcil i sense riscos. Com a solució a aquest problema, proposo un conjunt de regles i requisits senzills que dicten com s’assignen i incrementen els nombres de versions. Aquestes regles es basen, però no es limiten necessàriament, en pràctiques generalitzades en programari privat i lliure. Perquè aquest sistema funcioni, primer heu de declarar una API pública. Pot consistir en un document o en les normes imposades pel propi codi. Tanmateix, és important que aquesta API sigui clara i precisa. Un cop l’hàgiu enllestida, comuniqueu els canvis que hi feu amb increments específics en el nombre de versió. Considerant el format de la versió X.Y.Z (Major.Minor.Patch): quan les correccions o pedaços no afectin l’API s’ha d’incrementar la versió de correcció (‘patch’), quan s’hi afegeixin canvis i/o millores que tampoc afectin l’API s’ha d’incrementar la versió menor (‘minor’), i quan els canvis afectin la compatibilitat de l’API amb versions anteriors s’ha d’incrementar la versió principal (‘major’)."
