["https://sendgrid.com/en-us/solutions/expert-services/set-up-assistance"]
title = "Set-Up Assistance: Laying the Groundwork for Email Programs | SendGrid"
description = "Get set up on Twilio SendGrid’s email platform and optimize your email architecture to see better results."
full_description = '''Briefcase with a settings gear symbol Expert Services Overview Type of service Set-Up Assistance Maximizing Delivery Ongoing Consulting Set-Up Assistance Lay the groundwork for better email results. The world's leading brands trust Twilio SendGrid to deliver: Uber logo Yelp! logo Glassdoor logo Instacart logo Expert help for a smarter setup Get set up on Twilio SendGrid’s email platform and optimize your email architecture to see better results. Implementation services can help with: Setting up an email program under tight deadlines Integrating sophisticated email programs Preventing deliverability issues Migrating from another email provider SET-UP ASSISTANCE Types of packages Email Implementation Get your program set up correctly by our experts to avoid common architecture errors and achieve long-term success. Get set up An icon of a right arrow Email Implementation & Strategy Our email experts will set you up for success by establishing an implementation and sending strategy. Partner with experts An icon of a right arrow ASK US Frequently asked questions How long do services last? It depends on the package you choose. Bootcamp is a 2-hour webinar, Email Implementation is a 35-day engagement, and Implementation and Strategy is a 60-day engagement. What kind of support can I expect through this service period? With the Email Implementation engagement, your team will have access to an Implementation Manager and Solutions Architect for the extent of your service. Together, this team will manage the project to meet your overall goals and answer technical questions. If you purchase the Email Implementation and Strategy engagement, you would have the added benefit of support from a Delivery Expert on questions in addition to the regular implementation team. Can you build templates, import contacts, and perform housekeeping on my existing program? Unfortunately, no. Our Expert Services team will provide set-up guidance and best practices. However, due to the specificity of each customer’s email program, we cannot perform template builds or list maintenance. Would this service engagement be tailored to my needs? Yes! If you purchase an Email Implementation or Email Implementation and Strategy package, our team will work off of our baseline services to learn about your email program. We want your engagement to be productive and speak directly to your needs in relation to the Twilio SendGrid platform. However, there are some general practices and deliverables we provide to all customers who use these services and you’ll benefit from those as well. Is Email Bootcamp a good fit for me? Bootcamp is for customers who want a condensed overview of the Twilio SendGrid product and best practices. If you would like a custom session with our experts or you need help getting your email program set up for optimal performance because you’ve had delivery or engagement issues in the past, you might want to consider the Email Implementation or Email Implementation and Strategy engagements. What's the difference between "Email Implementation" and "Email Implementation and Strategy"? Email Implementation is a 35-day engagement to ensure your account is set up for success. During the engagement, our team will get you sending and provide some basic metrics monitoring. An Email Implementation and Strategy engagement will ensure you are set up for success and provide you with a deep understanding of delivery best practices and adjustment strategies for your program as needed. {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How long do services last?","acceptedAnswer":{"@type":"Answer","text":"<p>It depends on the package you choose. Bootcamp is a 2-hour webinar, Email Implementation is a 35-day engagement, and Implementation and Strategy is a 60-day engagement.</p>\r\n"}},{"@type":"Question","name":"What kind of support can I expect through this service period?","acceptedAnswer":{"@type":"A