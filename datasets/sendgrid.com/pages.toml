title = "Sign-up FAQ | SendGrid"
description = "To better help customers learn about SendGrid accounts, we've compiled the following Frequently Asked Questions (FAQs)."
full_description = '''Frequently Asked Questions To better help customers learn about SendGrid, we’ve compiled the following Frequently Asked Questions (FAQs). For any additional questions please refer to our documentation. How does Twilio SendGrid work? Twilio SendGrid is a leader in email deliverability that serves both marketers and developers. We are a cloud-based SMTP provider that acts as an email delivery engine, so you can send email without the cost and complexity of maintaining your own email servers. Twilio SendGrid manages the technical details of email delivery, like infrastructure scaling, ISP outreach, reputation monitoring, and real-time analytics. We also offer Marketing Campaigns, our flagship email marketing solution. Use it to raise the bar across all of the email you send—from promotional newsletters to time-based automated drip series. Marketing Campaigns features targeted segmentation and contact list management tools, visual drag-and-drop design, powerful HTML capabilities, integrated Email Testing and Signup Forms, and actionable analytics—all from the brand loved by marketers and developers alike. Learn more: How to send an SMTP email, How to send email with Marketing Campaigns How does the free trial work? You’ll be able to send 100 emails per day once you create and verify your free Email API plan. Once your create and verify your free Marketing Campaigns plan, you’ll be able to send 6,000 emails per month and store up to 2,000 contacts. If you need to send more email or store more contacts, you can easily upgrade to one of our paid plans in the UI! Ready to get started? Sign Up for my free account Do I have to sign up for the Marketing Campaigns and the Email API separately? Yes! If you want to use Marketing Campaigns and the Email API, you will need to purchase the plans separately. But once you sign up, you can use the same account to send via the Email API or Marketing Campaigns. Learn more: How to send email with Marketing Campaigns, How to send an SMTP email How do you measure the number of emails I send? Every time you send one email to one recipient, it's deducted as one email credit from your plan. This occurs whether the email is ultimately deferred or sent to spam by the inbox provider. It's important to keep in mind that emails sent using an Email API package are counted separately from emails that you send using a Marketing Campaigns package. Learn more about the billing structure: Billing info and FAQs What happens if I go over my plan? If you send more emails than your plan allows within a given billing period, you will be charged a small overage fee on a per-email basis. Any overage fees are added to your invoice for the following billing period. Learn more about overage costs: How do overages work? Can you help me get started? Do you offer deliverability consulting? Yes! Our Onboarding Specialists can walk you through the entire process to ensure that your account is set up for success. You can also work with our Delivery Consultants to evaluate your entire email program and get a detailed assessment to help you identify areas for optimization, such as configuring your IPs correctly or diagnosing email deliverability issues. Interested? Learn more: Twilio SendGrid’s Expert Services Why do I need to verify my account? We require all of our customers to verify their accounts. This helps us to safeguard your account and maintain deliverability for you and all of our customers. Learn more: Verifying your account I’m ready to sign up. What do I do and how do I pay? When you’re ready to sign up, select an Email API and/or Marketing Campaigns plan that covers your monthly email volume. We accept credit cards and charge on the first of every month. If you want to do some testing before committing to a paid plan, you can sign up for one of our free plans! Get started: Plans and pricing Do I have to sign a contract? There are no contracts—each plan is month-to-month—and you can cancel at any time. Learn More: Plans and pricing How do I partner with Twilio SendGrid? We have a number of ways we can work together: Reseller partners: Perfect for cloud, ecommerce, and CMS platform companies that want to provide more value to their customers.Marketplace partners: List your service on the SendGrid Marketplace as a recommended solution.ISV partners: Offer your users the ability to send email, invisibly powered by Twilio SendGrid. Learn More: Become a Twilio SendGrid partner {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How does Twilio SendGrid work?","acceptedAnswer":{"@type":"Answer","text":"<p>Twilio SendGrid is a leader in email deliverability that serves both marketers and developers.</p>\r\n<p>We are a cloud-based SMTP provider that acts as an email delivery engine, so you can send email without the cost and complexity of maintaining your own email servers. Twilio SendGrid manages the technical details of email delivery, like infrastructure scaling, ISP outreach, reputation monitoring, and real-time analytics.</p>\r\n<p>We also offer Marketing Campaigns, our flagship email marketing solution. Use it to raise the bar across all of the email you send—from promotional newsletters to time-based automated drip series. Marketing Campaigns features targeted segmentation and contact list management tools, visual drag-and-drop design, powerful HTML capabilities, integrated Email Testing and Signup Forms, and actionable analytics—all from the brand loved by marketers and developers alike.</p>\r\n<p>Learn more:&nbsp;<a href=\"https://docs.sendgrid.com/for-developers/sending-email/getting-started-smtp\" target=\"_self\" rel=\"noopener noreferrer\">How to send an SMTP email</a>,&nbsp;<a href=\"https://docs.sendgrid.com/ui/sending-email/how-to-send-email-with-marketing-campaigns\" target=\"_self\" rel=\"noopener noreferrer\">How to send email with Marketing Campaigns</a></p>\r\n"}},{"@type":"Question","name":"How does the free trial work?","acceptedAnswer":{"@type":"Answer","text":"<p>You’ll be able to send 100 emails per day once you create and verify your free Email API plan.</p>\r\n<p>Once your create and verify your free Marketing Campaigns plan, you’ll be able to send 6,000 emails per month and store up to 2,000 contacts.</p>\r\n<p>If you need to send more email or store more contacts, you can easily upgrade to one of our paid plans in the UI!</p>\r\n<p>Ready to get started?&nbsp;<a href=\"https://signup.sendgrid.com/\">Sign Up for my free account</a></p>\r\n"}},{"@type":"Question","name":"Do I have to sign up for the Marketing Campaigns and the Email API separately?","acceptedAnswer":{"@type":"Answer","text":"<p>Yes! If you want to use Marketing Campaigns and the Email API, you will need to purchase the plans separately. But once you sign up, you can use the same account to send via the Email API or Marketing Campaigns.</p>\r\n<p>Learn more:&nbsp;<a href=\"https://docs.sendgrid.com/ui/sending-email/how-to-send-email-with-marketing-campaigns\" target=\"_self\" rel=\"noopener noreferrer\">How to send email with Marketing Campaigns</a>,&nbsp;<a href=\"https://docs.sendgrid.com/for-developers/sending-email/getting-started-smtp\" target=\"_self\" rel=\"noopener noreferrer\">How to send an SMTP email</a></p>\r\n"}},{"@type":"Question","name":"How do you measure the number of emails I send?","acceptedAnswer":{"@type":"Answer","text":"<p>Every time you send one email to one recipient, it's deducted as one email credit from your plan. This occurs whether the email is ultimately deferred or sent to spam by the inbox provider.</p>\r\n<p>It's important to keep in mind that emails sent using an Email API package are counted separately from emails that you send using a Marketing Campaigns package.</p>\r\n<p>Learn more about the billing structure:&nbsp;<a href=\"https://docs.sendgrid.com/ui/account-and-settings/billing\" target=\"_self\" rel=\"noopener noreferrer\">Billing info and FAQs</a></p>\r\n"}},{"@type":"Question","name":"What happens if I go over my plan?","acceptedAnswer":{"@type":"Answer","text":"<p>If you send more emails than your plan allows within a given billing period, you will be charged a small overage fee on a per-email basis. Any overage fees are added to your invoice for the following billing period.</p>\r\n<p>Learn more about overage costs:&nbsp;<a href=\"https://docs.sendgrid.com/ui/account-and-settings/billing#overages\" target=\"_self\" rel=\"noopener noreferrer\">How do overages work?</a></p>\r\n"}},{"@type":"Question","name":"Can you help me get started? Do you offer deliverability consulting?","acceptedAnswer":{"@type":"Answer","text":"<p>Yes! Our Onboarding Specialists can walk you through the entire process to ensure that your account is set up for success. You can also work with our Delivery Consultants to evaluate your entire email program and get a detailed assessment to help you identify areas for optimization, such as configuring your IPs correctly or diagnosing email deliverability issues.</p>\r\n<p>Interested? Learn more:&nbsp;<a href=\"/content/sendgrid/global/en-us/solutions/expert-services.html\" target=\"_self\" rel=\"noopener noreferrer\">Twilio SendGrid’s Expert Services</a></p>\r\n"}},{"@type":"Question","name":"Why do I need to verify my account?","acceptedAnswer":{"@type":"Answer","text":"<p>We require all of our customers to verify their accounts. This helps us to safeguard your account and maintain deliverability for you and all of our customers.</p>\r\n<p>Learn more:&nbsp;<a href=\"https://docs.sendgrid.com/ui/account-and-settings/verifying-your-account\" target=\"_self\" rel=\"noopener noreferrer\">Verifying your account</a></p>\r\n"}},{"@type":"Question","name":"I’m ready to sign up. What do I do and how do I pay?","acceptedAnswer":{"@type":"Answer","text":"<p>When you’re ready to sign up, select an Email API and/or Marketing Campaigns plan that covers your monthly email volume. We accept credit cards and charge on the first of every month. If you want to do some testing before committing to a paid plan, you can sign up for one of our free plans!</p>\r\n<p>Get started:&nbsp;<a href=\"/content/sendgrid/global/en-us/pricing.html\" target=\"_self\" rel=\"noopener noreferrer\">Plans and pricing</a></p>\r\n"}},{"@type":"Question","name":"Do I have to sign a contract?","acceptedAnswer":{"@type":"Answer","text":"<p>There are no contracts—each plan is month-to-month—and you can cancel at any time.</p>\r\n<p>Learn More:&nbsp;<a href=\"/content/sendgrid/global/en-us/pricing.html\" target=\"_self\" rel=\"noopener noreferrer\">Plans and pricing</a></p>\r\n"}},{"@type":"Question","name":"How do I partner with Twilio SendGrid?","acceptedAnswer":{"@type":"Answer","text":"<p>We have a number of ways we can work together:</p>\r\n<ul>\r\n<li><a href=\"/content/sendgrid/global/en-us/partners/contact-us-reseller.html\" target=\"_self\" rel=\"noopener noreferrer\">Reseller partners</a>: Perfect for cloud, ecommerce, and CMS platform companies that want to provide more value to their customers.</li>\r\n<li><a href=\"/content/sendgrid/global/en-us/partners/contact-us-marketplace.html\" target=\"_self\" rel=\"noopener noreferrer\">Marketplace partners</a>: List your service on the SendGrid Marketplace as a recommended solution.</li>\r\n<li><a href=\"/content/sendgrid/global/en-us/partners/contact-us-oem.html\" target=\"_self\" rel=\"noopener noreferrer\">ISV partners</a>: Offer your users the ability to send email, invisibly powered by Twilio SendGrid.</li>\r\n</ul>\r\n<p>Learn More:&nbsp;<a href=\"/content/sendgrid/global/en-us/partners/become.html\" target=\"_self\" rel=\"noopener noreferrer\">Become a Twilio SendGrid partner</a></p>\r\n"}}]} Learn more by visiting our Knowledge Base ›'''
