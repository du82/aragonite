s. Select your volume below to see which plans are right for you. How many contacts would you like to store? 100 5,000 10,000 20,000 50,000 100,000 200,000 500,000+ 100 5,000 10,000 20,000 50,000 100,000 200,000 500,000+ How many emails would you like to send per month? <6,000 15,000 30,000 50,000 60,000 100,000 150,000 250,000 300,000 500,000 1,000,000 2,500,000+ <6,000 15,000 30,000 50,000 60,000 100,000 150,000 250,000 300,000 500,000 1,000,000 2,500,000+ Recommended Start for free No credit card, no commitment. Close Open Show Features What’s included: Check Design & code editors Check Segmentation Check A/B testing & actionable insights Check Automation Close Access to dedicated IPs Email testing credits: 3 Signup forms: 1 Additional teammates: 1 Support type: Ticket Recommended Start for free You can upgrade any time after your free account is set up. Taxes and overages may apply. Close Open Show Features What’s included: Check Design & code editors Check Segmentation Check A/B testing & actionable insights Close No automation Close Access to dedicated IPs Email testing credits: 10 Signup forms: 5 Additional teammates: 1 Support type: Ticket, chat, phone Recommended Start for free You can upgrade any time after your free account is set up. Taxes and overages may apply. Close Open Show Features What’s included: Check Design & code editors Check Segmentation Check A/B testing & actionable insights Check Automation Check Access to dedicated IPs Email testing credits: 60 Signup forms: 15 Additional teammates: 1,000 Support type: Guaranteed response times on ticket, chat & phone support Recommended Contact sales Need to send more? Talk to us for custom, high volume pricing. Close Open Show Features What’s included: Check Design & code editors Check Segmentation Check A/B testing & actionable insights Check Automation Check Access to dedicated IPs Email testing credits: 60 Signup forms: 15 Additional teammates: 1,000 Support type: Guaranteed response times on ticket, chat & phone support Get started with zero commitment Discover the power of SendGrid with no upfront cost. Start with our free plan and try the full suite of features at your own pace. Upgrade at any time as your demands evolve. Jumpstart your email success today—no strings attached. Start for free Full Feature Breakdown Compare the features and benefits of each plan. Design | Contacts | Analytics | Deliverability | Account Management | Support | Integration | Privacy Design and Testing Design features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Design & code editors A/B testing & actionable insights Responsive templates Email testing 3 credits 10 credits (more for purchase) 60 credits (more for purchase) 60 credits (more for purchase) Content personalization Back to top Caret up Contacts and sending Contacts features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Segmentation Automation Send scheduling Signup forms 1 form 5 forms 15 forms 15 forms Back to top Caret up Analytics and reporting Analytics features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Engagement statistics Link click tracking Bounce rate, spam, blocked reporting Deliverability insights Application, Device, Browser, and Mailbox Usage Geographical Distribution Email Category Comparison Back to top Caret up Deliverability Deliverability features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Inbox provider relationships Built-In best practices Authentication Dedicated IP included Access to Additional IPs Back to top Caret up Test the features with our free plan Sign up for our free plan (no credit card required) to try the features for yourself. Upgrade to a paid plan when you're ready to scale. Start for free Account and team management Account features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Subuser management Additional teammate access 1 teammate 1 teammate 1,000 teammates 1,000 teammates Access to transactional templates Email API statistics API Key permissions Back to top Caret up Expertise and Support Support features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Personalized support Available for purchase Available for purchase Available for purchase Expert services Available for purchase Available for purchase Back to top Caret up Integration and Customization Collaboration features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Marketing Campaigns APIs Event Webhook Subuser API Universal links Segment connector Back to top Caret up Privacy and Security Security features Free $0/mo Basic starting at $15/mo Advanced starting at $60/mo Custom custom pricing Two-factor authentication IP access management GDPR compliance TLS encryption SOC 2 Type II Certification Back to top Caret up Start for free Download PDF An icon of a outbound link arrow Download PDF An icon of a outbound link arrow Frequently Asked Questions How does Twilio SendGrid work? Twilio SendGrid is a cloud-based SMTP provider that acts as an email delivery engine, allowing you to send email without the cost and complexity of maintaining your own email servers. Twilio SendGrid manages the technical details of email delivery, like infrastructure scaling, ISP outreach, reputation monitoring, and real-time analytics. Learn more: Getting Started with Email API How does the free trial work? Once you create a sender identity, you can send 100 emails per day on our free SMTP trial. If you need to send more than that, complete your account setup to upgrade to a paid plan! We also offer a Free Marketing Campaigns Plan. This lets you store up to 2,000 contacts and send 6,000 free emails per month. It also provides A/B testing, sign-up forms, automation, and email testing credits. Sign Up for My Free Account Do I have to sign up for the Marketing Campaigns and Email API separately? Yes! If you want to use Marketing Campaigns and the Email API, you will need to purchase the plans separately. But once you sign up, you can use the same account to send via the Email API or through Marketing Campaigns. Learn more: How to Send Email With Marketing Campaigns Why are the email marketing pricing and email API pricing plans different? Our Email API and Marketing Campaigns products provide different features and functionality. Marketing Campaigns is designed for users who need robust, ready-to-use tools for managing email campaigns. It offers features like drag-and-drop design, list management, and comprehensive analytics to monitor campaign effectiveness. The email campaign pricing is tailored to marketers focusing on engagement and long-term customer relationships. Our Email API plan caters to developers looking to integrate email functionality directly into their applications or websites, offering maximum flexibility and control over how emails are sent and managed. The Email API plan is priced based on the volume of emails sent (and additional tools like Email Validation and Dedicated IPs) to accommodate the varying needs of apps from startups to large enterprises. How do you measure the number of emails I send? Every time you send one email to one recipient, it’s deducted as one email credit from your Email API plan. This occurs whether the email is ultimately deferred or sent to spam by the inbox provider. Also note that emails you send via Marketing Campaigns will be counted separately from any emails you send via the Email API. Learn more about the billing structure: Billing Info and FAQs What happens if I go over my plan? If you send more emails than your plan allows within a given billing period, you will be charged a small overage fee on a per-email basis. Any overage fees are added to your invoice for the following billing period. Learn more about overage costs: Overages Get started Start sending email with SendGrid for free Sign up for a free trial to experience SendGrid’s reliable, scalable email delivery. Start for free Contact sales"
