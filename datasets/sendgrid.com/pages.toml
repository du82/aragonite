rom, subject, to, content) sg = SendGrid::API.new(api_key: ENV['SENDGRID_API_KEY']) response = sg.client.mail._('send').post(request_body: mail.to_json) puts response.status_code puts response.body puts response.headers // using SendGrid's Go Library // https://github.com/sendgrid/sendgrid-go package main import ( "fmt" "log" "os" "github.com/sendgrid/sendgrid-go" "github.com/sendgrid/sendgrid-go/helpers/mail" ) func main() { from := mail.NewEmail("Example User", "test@example.com") subject := "Sending with SendGrid is Fun" to := mail.NewEmail("Example User", "test@example.com") plainTextContent := "and easy to do anywhere, even with Go" htmlContent := "<strong>and easy to do anywhere, even with Go</strong>" message := mail.NewSingleEmail(from, subject, to, plainTextContent, htmlContent) client := sendgrid.NewSendClient(os.Getenv("SENDGRID_API_KEY")) response, err := client.Send(message) if err != nil { log.Println(err) } else { fmt.Println(response.StatusCode) fmt.Println(response.Body) fmt.Println(response.Headers) } } <?php require 'vendor/autoload.php'; // If you're using Composer (recommended) // Comment out the above line if not using Composer // require("/sendgrid-php.php"); // If not using Composer, uncomment the above line and // download sendgrid-php.zip from the latest release here, // replacing with the path to the sendgrid-php.php file, // which is included in the download: // https://github.com/sendgrid/sendgrid-php/releases $email = new \SendGrid\Mail\Mail(); $email->setFrom("test@example.com", "Example User"); $email->setSubject("Sending with SendGrid is Fun"); $email->addTo("test@example.com", "Example User"); $email->addContent("text/plain", "and easy to do anywhere, even with PHP"); $email->addContent( "text/html", "<strong>and easy to do anywhere, even with PHP</strong>" ); $sendgrid = new \SendGrid(getenv('SENDGRID_API_KEY')); try { $response = $sendgrid->send($email); print $response->statusCode() . "\n"; print_r($response->headers()); print $response->body() . "\n"; } catch (Exception $e) { echo 'Caught exception: '. $e->getMessage() ."\n"; } // using SendGrid's Java Library // https://github.com/sendgrid/sendgrid-java import com.sendgrid.*; import java.io.IOException; public class Example { public static void main(String[] args) throws IOException { Email from = new Email("test@example.com"); String subject = "Sending with SendGrid is Fun"; Email to = new Email("test@example.com"); Content content = new Content("text/plain", "and easy to do anywhere, even with Java"); Mail mail = new Mail(from, subject, to, content); SendGrid sg = new SendGrid(System.getenv("SENDGRID_API_KEY")); Request request = new Request(); try { request.setMethod(Method.POST); request.setEndpoint("mail/send"); request.setBody(mail.build()); Response response = sg.api(request); System.out.println(response.getStatusCode()); System.out.println(response.getBody()); System.out.println(response.getHeaders()); } catch (IOException ex) { throw ex; } } } // using SendGrid's C# Library // https://github.com/sendgrid/sendgrid-csharp using SendGrid; using SendGrid.Helpers.Mail; using System; using System.Threading.Tasks; namespace Example { internal class Example { private static void Main() { Execute().Wait(); } static async Task Execute() { var apiKey = Environment.GetEnvironmentVariable("NAME_OF_THE_ENVIRONMENT_VARIABLE_FOR_YOUR_SENDGRID_KEY"); var client = new SendGridClient(apiKey); var from = new EmailAddress("test@example.com", "Example User"); var subject = "Sending with SendGrid is Fun"; var to = new EmailAddress("test@example.com", "Example User"); var plainTextContent = "and easy to do anywhere, even with C#"; var htmlContent = "<strong>and easy to do anywhere, even with C#</strong>"; var msg = MailHelper.CreateSingleEmail(from, to, subject, plainTextContent, htmlContent); var response = await client.SendEmailAsync(msg); } } } Need help building? No problem. Build your one-of-a-kind email program with help from our partners. View partners Why Twilio SendGrid Email API 148+ billion Emails Sent Every Month 99% Deliverability Rate 99.99% Uptime SLA 1.9 second Median Delivery Speed More reasons to use Twilio SendGrid Start for free. Then pay as you go. Sign up for a free trial to experience SendGrid’s reliable, scalable email delivery. Start for free View pricing ASK US Frequently asked questions What is the SendGrid Email API? The SendGrid Email API is a powerful tool that enables you to send, receive, and manage emails programmatically. It provides features like dynamic templates, real-time analytics, and robust security to ensure your emails reach the inbox and engage your audience effectively. How do I get started with the SendGrid Email API? To get started, sign up for a free SendGrid account, obtain your API key, and integrate the API with your application using our comprehensive documentation. You can find guides and code examples for various programming languages in our docs section. Can I send transactional and marketing emails with the SendGrid Email API? Yes, the SendGrid Email API supports both transactional and marketing emails. You can use dynamic templates to customize your emails and target different segments of your audience with personalized content. How can I monitor the performance of my email campaigns? SendGrid offers advanced analytics and reporting tools that provide detailed metrics on open rates, click-through rates, bounce rates, and more. You can access these insights through our user-friendly dashboards to optimize your email campaigns. What kind of support is available for SendGrid users? SendGrid offers 24/7 support to help you troubleshoot issues and optimize your email campaigns. Our support team is available to assist you with any questions or problems you may encounter. How does SendGrid handle email deliverability? SendGrid leverages a globally distributed, cloud-based architecture and advanced deliverability tools to ensure your emails reach the inbox. Features like ISP monitoring, sender authentication, and dedicated IP addresses help maintain optimal deliverability rates.'''
