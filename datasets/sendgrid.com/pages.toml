full_description = '''Signup Forms New Build your email list and grow your business with simple signup forms. Try for free Companies that scale trust twilio SendGrid to deliver results: Uber logo Yelp! logo Glassdoor logo Instacart logo Build your list Reach new customers. Customers can stay in the loop with fast and easy signups. Set your form live and watch your contact list thrive. Embed the signup form on your website Share a link to a landing page we'll host for you Know signups are legit with reCAPTCHA Stay on brand Simple customization. Create signup forms that look and feel like your company to increase customer trust and tell a cohesive brand story. Update colors and styling to match your look Customize your form copy to reflect your voice Capture email address only or add first and last name fields Make connections Meet, greet, and engage. Once contacts add their names to your list, delight them with relevant, valuable content that inspires engagement. Pair with Automation to send timely welcome emails Add a personal touch by greeting contacts by name Segment contacts by interest and send them custom content ASK US Frequently asked questions Will my contacts be added to Marketing Campaigns automatically? Yes. Contacts captured via Signup Forms will be added to the Marketing Campaigns list you choose. If the list is tied to a live automation, the new contact will begin receiving the messages in that automation automatically. Can I customize the look and feel of the form? Yes. You can apply brand colors and styling from within the Signup Form editor. Can I embed the form on my website? Yes. You can either embed the form as an iframe, or you can share the form using a Twilio SendGrid-hosted link. Do you protect against fake signups or spambots? Yes. reCAPTCHA is included on all signup forms which helps protect websites from spam and abuse by establishing that a computer user is human. {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"