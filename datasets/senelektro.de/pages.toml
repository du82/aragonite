 Lichttechnik oder Beleuchtung im Innen- und Außenbereich. Wir gestalten auf Basis Ihrer Vorstellungen und Wünsche das passende Beleuchtungssystem. Wir sind Ihr starke Partner, von der Montage einer simplen Glühbirne bis hin zu einer ganzheitlichen Installation einer Lichttechnik. Mehr erfahren<img sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Ff1f8cf43-7b37-4531-9023-c860dcb3be3d_sen-elektro-services-gebaeudetechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" loading="lazy"/>GebäudetechnikOb Neubau, Altbau, Ein- oder Mehrfamilienhaus, wir installieren jegliche Art von Gebäudetechnik. Auch im gewerblichen Kontext realisieren wir eindrucksvolle Licht- und Elektrotechnik in den Bereichen: Hotels, Ladengeschäfte und Bürokomplexe. Zudem bieten wir unsere Leistungen auch für Bauunternehmer und Architekten an. Mehr erfahren<img sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F7bf9cecd-f851-4f52-8727-f6bc07be08ee_sen-elektro-services-industrietechnik.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" loading="lazy"/>IndustrietechnikIn der Industrietechnik betreuen wir Sie in alle Richtungen, da uns Ihre Beleuchtung und Sicherheit sehr wichtig ist. Somit garantieren wir Ihnen, dass jeder Mitarbeiter zur richtigen Zeit am richtigen Ort angenehm arbeiten kann. Zudem unterstützen wir Sie bei der Neuinstallation und Aufrüstung Ihrer Anlagen.Mehr erfahren<img sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F920aad67-8474-4569-83ca-82a161ebe7e8_sen-elektro-services-schaltschrank.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" loading="lazy"/>SchaltschrankbauFolgende Leistungen bieten wir beim Thema Schaltschrankbau an: Ausführung, Serienfertigung, Einzelstücke, Verteilerbau, Steuerschrank und Leistungsschrank. Zudem liefern wir Ihre Schaltschränke an die gewünschte Lieferadresse, installieren diese direkt vor Ort und unterstützen Sie bei Ihren laufenden Projekten.Mehr erfahren'
