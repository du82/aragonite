["https://senelektro.de/datenschutz"]
title = "Datenschutz – SEN Elektro Elektriker für Strom- und Lichttechnik"
description = "Wir sind SEN Elektro aus Murr. Ein junges, dynamisches Unternehmen, spezialisiert in den Bereichen Strom- und Lichttechnik. Kontaktieren Sie uns: info@senelektro.de"
full_description = "Datenschutz1. Informationen über die Erhebung personenbezogener Daten(1) Im Folgenden informieren wir über die Erhebung personenbezogener Daten bei Nutzung unserer Webseite.Personenbezogene Daten sind alle Daten, die auf Sie persönlich beziehbar sind, z.B. Name, Adresse, E-Mail-Adressen, Nutzerverhalten.(2) Verantwortlicher gem. Art. 4 Abs. 7 DSGVO ist:Sen ElektroHaydnweg 871711 MurrE-Mail: info@senelektro.de2. Ihre Rechte(1) Sie haben gegenüber uns folgende Rechte hinsichtlich der Sie betreffenden personenbezogenen Daten:Recht auf AuskunftRecht auf Berichtigung oder LöschungRecht auf Einschränkung der VerarbeitungRecht auf Widerspruch gegen die VerarbeitungRecht auf Daten Übertragbarkeit.(2) Sie haben zudem das Recht, sich bei einer Datenschutzaufsichtsbehörde über die Verarbeitung Ihrer personenbezogenen Daten durch uns zu beschweren.3. Erhebung personenbezogener Daten beim Besuch unserer Website(1) Bei der bloß informatorischen Nutzung der Webseite, also wenn Sie sich nicht zur Nutzung der Website anmelden, registrieren oder uns sonst Informationen übermitteln, erheben wir keine personenbezogenen Daten, mit Ausnahme der Daten, die Ihr Browser an unseren Server übermittelt.Wenn Sie unsere Webseite betrachten möchten, erheben wir die folgenden Daten, die für uns technisch erforderlich sind, um Ihnen unsere Webseite anzuzeigen und die Stabilität und Sicherheit zu gewährleisten (Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DS-GVO):IP-AdresseDatum und Uhrzeit der AnfrageZeitzonendifferenz zur Greenwich Mean Time (GMT)Inhalt der Anforderung (konkrete Seite)Zugriffsstatus / HTTP-Statuscodejeweils übertragene DatenmengeWebsite, von der die Anforderung kommtBrowserBetriebssystem und dessen OberflächeSprache- und Version der Browser Software.(2) Zusätzlich zu den zuvor genannten Daten verwenden wir sogenannte „Cookies“. Cookies sind kleine Textdateien zur Speicherung von Informationen zu Ihrer Nutzung der Website. Sie werden entweder vorübergehend für die Dauer einer Sitzung (Session-Cookies) oder dauerhaft (persistente Cookies) auf Ihrem Endgerät gespeichert. Session-Cookies werden nach Ende Ihres Besuchs automatisch gelöscht. Persistente Cookies bleiben auf Ihrem Endgerät gespeichert, bis Sie diese selbst löschen oder eine automatische Löschung durch Ihren Webbrowser erfolgt Cookies haben verschiedene Funktionen.Zahlreiche Cookies sind technisch notwendig, da bestimmte Website Funktionen ohne diese nicht funktionieren würden (z. B. das Consent-Management). Andere Cookies dienen dazu, das Nutzerverhalten auszuwerten oder Werbung anzuzeigen. Cookies, die zur Durchführung des elektronischen Kommunikationsvorgängen (notwendige Cookies) oder zur Bereitstellung bestimmter, von Ihnen gewünschter Funktionen (funktionale Cookies) oder zur Optimierung der Website erforderlich sind, werden auf Grundlage unserer berechtigten Interessen (Art. 6 Abs. 1 lit. f DSGVO) gespeichert, sofern keine andere Rechtsgrundlage angegeben wird. Wir haben ein berechtigtes Interesse an der Speicherung von Cookies zur technisch fehlerfreien und optimierten Bereitstellung unserer Dienste.Teilweise können auch Cookies von Drittunternehmen (Third-Party-Cookies) auf Ihrem Endgerät oder technisch nicht notwendige Cookies gespeichert werden. Diese ermöglichen uns oder Ihnen die Nutzung bestimmter Dienstleistungen eines Drittunternehmens. Die Speicherung der betreffenden Cookies erfolgt ausschließlich auf Grundlage einer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Die Einwilligung ist jederzeit widerrufbar (Cookies).Für die den Betrieb der Webseite notwendige Cookies werden automatisch beim Aufruf der Webseite gesetzt. Andere nicht für die Nutzung notwendige Cookies und Funktionalitäten des Webseiten Betreibers und von Dritten dürfen erst nach ihrer Zustimmung genutzt werden. Dazu werden Sie beim Aufruf der Webseite um eine Auswahl von erlaubten Cookies und Funktionen gebeten. Diese Auswahl wird wiederum in einem Cookie solange gespeichert, bis Sie dieses Cookie von Ihrem Endgerät löschen. Im Consent-Manager finden Sie weitere Angaben zu Cookie-Bezeichnungen, deren Aussteller und Lebensdauer sowie deren Funktionsordnung.Sie können jederzeit die Auswahl der zugelassenen Cookies und Funktion korrigieren (Cookies).4. Weitere Funktionen und Angebote unserer Webseite(1) Neben der rein informatorischen Nutzung unserer Website bieten wir verschiedene Leistungen an, die Sie bei Interesse nutzen können. Dazu müssen Sie in der Regel weitere personenbezogene Daten angeben, die wir zur Erbringung der jeweiligen Leistung nutzen und für die die zuvor genannten Grundsätze zur Datenverarbeitung gelten.(2) Teilweise bedienen wir uns zur Verarbeitung Ihrer Daten externer Dienstleister. Diese wurden von uns sorgfältig ausgewählt und beauftragt, sind an unsere Weisungen gebunden und werden regelmäßig kontrolliert(3) Soweit unsere Dienstleister oder Partner ihren Sitz in einem Staat außerhalb des Europäischen Wirtschaftsraums (EWR) haben, informieren wir Sie über die Folgen dieses Umstands in der Beschreibung des Angebotes.4.1 Anfragen(1) Bei einer Kontaktaufnahme mit uns per E-Mail oder über unser Kontaktformular wird Ihre Anfrage inklusive aller daraus hervorgehenden personenbezogenen Daten (Name, Anfrage, Kontaktadresse) zum Zweck der Bearbeitung Ihres Anliegens bei uns gespeichert und verarbeitet. Diese Daten geben wir ohne Ihre Einwilligung nur an Dritte weiter, wenn dies zur Erfüllung Ihrer Anfrage erforderlich ist. Die Verarbeitung dieser Daten erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, sofern Ihre Anfrage mit der Erfüllung eines Vertrags zusammenhängt oder zur Durchführung vorvertraglichen Maßnahmen erforderlich ist.(2) In allen übrigen Fällen beruht die Verarbeitung auf unserem berechtigten Interesse an der effektiven Bearbeitung der an uns gerichteten Anfragen auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO oder auf Ihrer Einwilligung nach Art. 6 Abs. 1 lit. a DSGVO, sofern diese abgefragt wurde. Die von Ihnen an uns per Kontaktanfragen übersandten Daten verbleiben bei uns, bis Sie uns zur Löschung auffordern, Ihre Einwilligung zur Speicherung widerrufen oder der Zweck für die Datenspeicherung entfällt (z. B. nach abgeschlossener Bearbeitung Ihres Anliegens). Zwingende gesetzliche Bestimmungen – insbesondere gesetzliche Aufbewahrungsfristen – bleiben unberührt.4.2 Nutzeranalyse – Google Analytics(1) Wir benutzen Google Analytics nur mit Ihrer Einwilligung, um die Nutzung unserer Website analysieren und regelmäßig verbessern zu können. Eine Einbindung erfolgt mit dem Google Tagmanager. Über die gewonnenen Statistiken können wir unser Angebot verbessern und für Sie als Nutzer interessanter gestalten. Rechtsgrundlage für die Nutzung von Google Analytics ist Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Ihre erteilte Einwilligung können Sie jederzeit für die Zukunft widerrufen.(2) Google Analytics ist ein Webanalysedienst der Google Inc. („Google“). Google Analytics verwendet Cookies, die auf Ihrem Computer gespeichert werden und die eine Analyse der Benutzung der Website durch Sie ermöglichen. Die Cookies erzeugten Informationen über Ihre Benutzung dieser Website werden in der Regel an einen Server von Google übertragen und gespeichert. Nur in Ausnahmefällen wird die volle IP-Adresse an einen Server von Google in den USA übertragen und dort gekürzt. Im Auftrag des Betreibers dieser Website wird Google diese Informationen benutzen, um Ihre Nutzung der Website auszuwerten, um Reports über die Website-Aktivitäten zusammenzustellen und um weitere mit der Websitenutzung und der Internetnutzung verbundene Dienstleistungen gegenüber dem Websitebetreiber zu erbringen."
