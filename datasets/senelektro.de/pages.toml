full_description = '<img sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Fedc87959-be59-426e-9bf4-07c0d050324a_sen-elektro-unternehmen.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" loading="lazy"/>Wir über uns und unsere WerteWir sind ein junges, dynamisches Unternehmen aus Murr. Uns ist es wichtig, fair und loyal gegenüber unseren Kunden und Mitarbeitern zu sein. Der Respekt untereinander und ein gesundes Miteinander machen die Zusammenarbeit angenehmer.Gründung und FührungDas Unternehmen wurde im Jahr 2000 von Sahin Sen gegründet. Ihm waren damals drei Punkte wichtig: Qualität, Leistung und permanente Weiterentwicklung. Seine Werte prägen das Unternehmen bis heute und sind in allen Bereichen und Leistungen spürbar. Heute bedient Sen Elektro sowohl Privat- als auch Geschäftskunden, Konzerne und Unternehmen. Mit einer steigenden Anzahl an Mitarbeitern werden unsere Kunden sorgfältig bedient und zufrieden gestellt. Das Unternehmen wird heute in der zweiten Generation von Ertekin Sen geführt und weiterentwickelt.Warum wir?Wir kombinieren unsere Erfahrungen mit nachhaltigen Produkten und schaffen so das beste Ergebnis.<img srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F0b2d870a-36d0-49bf-ab74-6ebeb8177866_model.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F0b2d870a-36d0-49bf-ab74-6ebeb8177866_model.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F0b2d870a-36d0-49bf-ab74-6ebeb8177866_model.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>PräzisionGute Beratung und genaue Ausführung<img srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F4c296e6c-62f3-4488-9004-3cd46f4beeaa_rocket.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F4c296e6c-62f3-4488-9004-3cd46f4beeaa_rocket.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2F4c296e6c-62f3-4488-9004-3cd46f4beeaa_rocket.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>InnovationPermanente Weiterentwicklung<img srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Feb2f0f65-d465-479c-8834-23b9a34c6c20_star.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Feb2f0f65-d465-479c-8834-23b9a34c6c20_star.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fsenelektro%2Feb2f0f65-d465-479c-8834-23b9a34c6c20_star.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>NachhaltigkeitErneuerbare Energien um die Umwelt zu schonenWerde Teil unseres TeamsWir bieten dir, den idealen Einstieg und eine angenehme Arbeitsatmosphäre. Du arbeitest gerne im Team und übernimmst Verantwortung, dann erwarten dich vielfältige Chancen und langfristige Perspektiven.Initiativ bewerben'
