full_description = "CANSA Shavathon 2010 Reading time ~3 min Posted by jacqui.maree@orangecyberdefense.com on 10 March 2010 Categories: About:us, Community, Fun, Local This past Thursday we received notice that Boogterman & Partners would be a host company for the CANSA Shavathon 2010 taking place on Friday, 05/03/2010. So when I send out an email to everyone at SensePost, little did I know at the time what a huge thing this would turn into. However I really shouldn’t be surprised as this is a typical show of how “We Roll”! I was challenged (as the only girl in the office) to shave my head for CANSA. Well what can I say, the guys really wanted to see me do this because the enthusiasm was amazing! However more importantly we raised R3000.00 for this worthy cause and I was also able to donate my hair (as it met the length criteria) to make a wig and a R100 also goes to CANSA when they sell it. CANSA Shavathon’s goal was to raise R10 million and it would seem they have raised over R19 million so far which is brilliant! Showing how supportive South Africans are in general to this worthy cause which makes me proud to be South African! So all in all this turned out to be one of the most amazing charity runs I have been involved with and definitely worth sacrificing my hair for! I want to send out a special thank you to all the guys that I work with that donated money to this important cause and also a BIG thank you to the guys that came with to support me and also had their heads shaved! I am truly honored and proud to work for a company like SensePost and even though I am the only girl in the office I wouldn’t want to work any where esle :) Just incase you don’t believe us…..here are the pictures."
