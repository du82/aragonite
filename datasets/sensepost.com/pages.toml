full_description = "EDoS is the new DDoS ? Reading time ~1 min Posted by Haroon Meer on 27 January 2009 Categories: Infrastructure, Security-news Over at [Rational Survivability] beaker as coined the term EDoS. To describe how “the utility and agility of the cloud computing models such as Amazon AWS (EC2/S3) and the pricing models that go along with them can actually pose a very nasty risk to those who use the cloud to provide service” Of course, this has kicked off the flurry of responses from “How is this different to soaking up the bandwidth of people who pay per gig” to “OMG! thats the new thing.. Cloud Computing is bad”. It is an interesting concept, one we blogged about briefly back in 2007 . What makes it interestinger for me, is that with a smart enough attacker, the defender is far worse off trying to differentiate valid application requests from the invalid and black-holing wont be as easy to do.. We are currently doing some fiddling on this, and while i dont think it deserves a new acronym, i do think its got some coolness that needs exploring.."
