full_description = "ASPX and reDuh Reading time Less than a minute Posted by Ian de Villiers on 09 February 2009 Categories: Research, Tools We’ve received a number of queries regarding folkses unable to get the ASPX version of reDuh to work. In truth, the client had a faulty HTTP implementation meaning that HTTP requests were malformed. Apache and Tomcat cope admirably with the malformed requests, IIS does not. So, we’ve built a new client version for reDuh which will play nicely with IIS. Apart from the bugfix, the new version also supports SSL. A direct link to the updated client is here. More information regarding reDuh is here. Finally, in addition to queries regarding the ASPX version of reDuh, some folkses also appear to be having difficulty with the PHP version. We are looking into the matter at the moment, and we’ll get back with resolutions soon – so please watch this space."
