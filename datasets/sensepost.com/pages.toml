full_description = "ITWeb Security Summit 2009 – CFP Now Open Reading time ~1 min Posted by Charl van der Walt on 28 November 2008 Categories: Community, Conferences A couple of months back SensePost were asked by a prominent South African media company to assist in the selection of content and speakers for an upcoming information security conference called ‘the ITWeb Security Summit‘. The show runs 26-28 May 2009. The speaker lineup is mostly local (including yours truly) but past speakers have been pretty high-profile – including Dave Litchfield, Johnny Long, Kevin Mitnick, Johnny Cache, Howard Schulz and others. Here is some background on the conference: “The 4th Annual ITWeb Security Summit will once again bring together international and local IT and security professionals, practitioners, industry experts and analysts to share their experiences, acquire knowledge and gain an understanding of the key tools, techniques and strategies needed to safeguard their organisations’ most valuable asset – information. The 2009 ITWeb Security Summit is designed for IT and security professionals and C-level managers who have business and information management responsibilities. It is positioned as an independent security conference aimed at delivering vendor-neutral expertise for proactive security professionals and addressing the education and training needs of both the seasoned IS security professional and newcomer. ITWeb’s Security Summit is THE South African conference of choice in the security area. Last year’s event was attended by nearly 500 delegates and had a total of 39 sponsors. This year’s event will be a high-profile three-day conference that will arm delegates with the expert advice it takes to tackle today’s mission-critical security objectives – no matter how rampant user ignorance or non-compliance runs throughout their organisations.” I wanted to let people know that the CFP is now open and can be found at: http://www.itweb.co.za/events/securitysummit/2009/ We already have some really great speakers and topics lined up (watch this space). Be sure to get your papers in their early so you can be part of the action! /charl"
