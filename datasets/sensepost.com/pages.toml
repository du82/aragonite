full_description = "Feedback on our courses in Switzerland Reading time ~3 min Posted by Charl van der Walt on 27 September 2007 Categories: About:us, Training We just finished presenting an HBN Bootcamp and an HBN Combat Edition in Lausanne, Switzerland. A lot of people don’t know that we do this format – small courses on location worldwide. Its a different vibe to the big courses we do at Black Hat and the like, but it has some real advantages. Here’s the feedback we received – I especially like the nice things they say about me… On the Bootcamp Edition: “Amazing and excellent!! Great teaching.” “Excellent and very very interesting.” “Very interesting ! Makes me want to know more.” “Cool, crazy, sexy and very rich !!” “It was my first time in a training where the goal is to succeed without following the book!! And it’s fun.” “Impressionnant!” “This is seriously the most interesting course I have been to for a long time.” “A complete overview of the basis of hacking and security. I liked most the experience of the teacher and his knowledge. “ “The instructor is Very very good. Competent, knows what he is talking about and can share his knowledge.” “I liked most the demonstrations of what hackers do. Learned how to use applications like wikto, burn, etc.” “I liked most all exercises and the mix between theory and practise. “ “Yes. I liked most the labs, because it’s a very good way to learn and to detect if the understanding is correct. “ “The instructor was Very good and highly knowledgeable.” “Really good !! It’s the first time I stayed awake until 7pm :-)” “I liked most the demos and explanations from Charl.” “Super instructor!” “Very interesting course, very technical. The teacher knows what he’s talking about.” “If 10 is the best rate, I’d say 9.5 (just so as not to be too nice ;-)” And on Combat: “Fun and too short !!” “A good way to test our skills or to develop out-of-the-box thinking.” “A must-have ! Great teacher.” “Un moment parfait pour se confronter aux circonstances de la sécurité quotidienne.” “A conseiller à tous ceux qui pensent être bons dans le domaine de la sécurité informatique. Ce cours rend modeste :-)” “I’ve been able to see the spirit of some attack technics. “ “What I liked most: everything. The time imparted was a little short.” “Good match with Bootcamp. Interesting approach, but still fun and of very good quality. What I liked most: The begninning, the middle and the end ;-)The course could be longer, like 3 days or even more.” “I liked the way the course is delivered, in an interactive and challenging way” “The way Charl explains the concepts, he makes it really easy to catch the “essence” of the things. Great labs and demos too.” “Cours de haut niveau donné avec beaucoup de pédagogie. Ce que j’ai préféré: des exemples, des exemples et des démonstrations… Rien de tel que de pratiquer.” “Excellent instructeur. Ce que j’ai préféré: le hands-on est vraiment très bon pour retenir les solutions: de la pratique.” “Approche pratique, permet d’apprendre beaucoup plus en pratiquant qu’en étant simple auditeur. Varié et bien rythmé, le cours est captivant. Toutes les situations présentées étaient intéressantes.. Un jour supplémentaire serait un plus. “Charl is great. His explanations are clear and often linked with real-life examples.” “Very good, made the subject very interesting.” “Excellent, he knows the job and how to capture the audience.” “Excellent !”"
