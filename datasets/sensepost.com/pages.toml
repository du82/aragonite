full_description = "New SensePost Website – check it out Reading time ~1 min Posted by Charl van der Walt on 07 June 2010 Categories: About:us Sigh. We’ve never been much good at marketing or advertising, and I guess we still aren’t. But we have tried to give our old website a bit of a face-lift, and it’s starting to feel like we’re finally making some progress. Certainly most of the content is new and accurate and and certainly its much more comprehensive than our previous one. We’ve also gone to some effort to implement a more user-friendly CMS that will allow us to keep the content more current and interesting. Please do us the favour of checking the site out at www.sensepost.com and letting us know what you think. For those of you reading this blog, the following links would probably be the most useful: This blog stays right where it is Our tools and papers get their very own SensePost SDH Labs section We’ve created a Black Hat Training Page to outline and summarize our courses at Black Hat USA this year Thanks for visiting, and again, please let us know what you think."
