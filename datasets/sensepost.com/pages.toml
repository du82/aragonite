full_description = 'The hunt for Chromium issue 1072171 Reading time ~40 min Posted by Javier Jimenez on 29 May 2020 Categories: Browser, Chrome, Exploit development, Vulnerability research, 0day, V8, Vulnerability Intro The last few months I’ve been studying Chrome’s v8 internals and exploits with the focus of finding a type confusion bug. The good news is that I found one, so the fuzzing and analysis efforts didn’t go to waste. The bad news is that I can reliably trigger the vulnerability but I haven’t found a way to weaponise it yet. If you don’t have prior knowledge of v8, I encourage you to take some time and read through the previous post I wrote. It covers all of the basics regarding the v8 compiler and tools that helped me throughout my research. More importantly, it will help newcomers understand all of the research described within this post. You can see the TL;DR version of the vulnerability I found in the Chromium bug report: https://bugs.chromium.org/p/chromium/issues/detail?id=1072171. However, if you want to see all the pieces that led to that report, from fuzzing to root cause analysis (including Twitter drama), I encourage you to keep on reading! Table of Contents -0 day – Discovery & set-upFuzzilliIntermediate LanguageTargeting the typerThrough instrumentationImproving the methodologyThrough customisationExtending code generation capabilitiesMaximising fuzzing efforts0 day – Initial crash and disclosureHoney, we’ve got a crash!Amazing world of toolsDisclosure+0 day – AnalysisClairvoyanceAnalysisIntro to NumberMax functionThe importance of -0 in NumberMaxVisual confirmationTriggering the type confusionPatch thoughtsConclusionsResources -0 day – Discovery & set-up In the days prior to the discovery, most of my efforts were spent on understanding Fuzzilli and analysing how to reach interesting parts of v8’s code. If we just decided to launch fuzzers with “out-of-the-box” configurations it’s very likely that we won’t find any vulnerabilities. Fuzzing is a constant race with many other people doing it. Then, if we wanted complete code coverage we’d need a vast amount of resources due to the pure size of v8’s code base. Without complete coverage we wouldn’t get the necessary depth, which is often needed to find complex and exploitable bugs. Fuzzilli I was determined to use Fuzzilli, but Fuzzilli relied on patching v8 to convert it into “fuzzable” software, however, a patch for the latest v8 wasn’t available at the time. So, I needed to implement a patch for the latest commit, for which I recently did a Pull Request for the v8 patch here (After this research, the patch and some other bits made it into v8’s code base, so now the only thing that’s needed is to use v8_fuzzilli when generating the build files on the v8 project). The parts of the initial patch were mostly unchanged, the only thing that was needed was to understand the changes on the relevant v8 files and update the Fuzzilli logic accordingly with some added bits that we’ll see later. In any case, all credit goes to Samuel Groß for the initial patch and open-sourcing Fuzzilli! Intermediate Language Fuzzilli could be considered to be a context-aware fuzzer. The really neat thing about it is the fact that it implements an Intermediate Language (IL, guess that’s why its called FuzzILli). Examples of this can be seen by having a look at the FuzzIL folder: https://github.com/googleprojectzero/fuzzilli/tree/master/Sources/Fuzzilli/FuzzIL Files in the FuzzIL folder Having skimmed over the files, you should see that it has the concept of “Programs” which is basically the IL representation within Fuzzilli. The next stop should be the ProgramBuilder file. This file is interesting because it contains the functions used to generate valid JavaScript code, by either generating new code … public func genIndex() -> Int { return genInt() } … or by referencing variables defined somewhere else within the “Program”: /// Returns a random variable satisfying the given constraints or nil if none is found. private func randVarInternal(_ selector: ((Variable) -> Bool)? = nil) -> Variable? { var candidates = [Variable]() // Prefer inner scopes withProbability(0.75) { candidates = chooseBiased(from: scopeAnalyzer.scopes, factor: 1.25) if let sel = selector { candidates = candidates.filter(sel) } } ... Once a potentially valid program has been generated and mutated, a text file is generated by lifting the program into JavaScript. In essence, Fuzzilli will translate all the IL instructions into their JavaScript counterparts, line by line, ready to be fed into v8. case let op as LoadBoolean: output = Literal.new(op.value ? "true" : "false") Targeting the typer Most of the time while fuzzing, we’ll want to target specific parts of a program by either instrumenting just the parts we want to fuzz, by isolating the portions we want to fuzz or by having test cases that hit that certain part of the code. I tried to aim for a mix of both and, keeping in mind that Fuzilli didn’t take any test cases, did some modifications to, hopefully, target the typer even more. Through instrumentation During an internal Friday talk about (Fuzz|Scal)ing, I described my methodology for more effective fuzzing. More specifically, instrumenting only the functionality that we want to target. By doing this (using coverage guided fuzzers such as Fuzzilli), we benefit from the fuzzer generating JavaScript files that focus on a specific part of code, generating more code depth in terms of coverage. After all, that’s the purpose of a coverage guided fuzzer; generate test cases that are likely to hit a larger amount of instrumented code paths. If we narrow down these code paths to aim for depth rather than breadth, the fuzzer will more likely generate outputs that will keep hitting a vertical code path, going into more depth with every mutation. Improving the methodology In the past, I used to do the following hack to instrument features or libraries: Compile the program without any instrumentation.Delete the libraries that I wanted to instrument.Generate and compile the deleted libraries with the desired instrumentation enabled. While this worked in pretty much all of the software I previously fuzzed, it didn’t work on v8. When using the aforementioned workflow we’d get the usual clang errors that relate to undefined symbols at the time of linking libraries, pointing to the fact that certain libraries have been compiled with different flags. Example of what undefined symbols could look like Google Chrome (and by extension, v8) uses ninja to build source code. Google provides great tooling with many options to generate build files such as GN from the depot_tools repository. Running GN will generate the necessary build files with rules. Our little hack here will be to create a ninja build rule to instrument with -fsanitize-coverage=trace-pc-guard, just the parts we want to (refer below to the toolchain.ninja file). These will be all of the “compiler” related parts of v8, since type confusions happen when the JIT (Just In Time) compiler gets triggered and a wrong assumption of a type is made. By taking the following ninja build rule into account we’ll be able to take it as a baseline to create a cxx-instr rule: $ grep -A 4 "rule cxx" toolchain.ninja rule cxx command = ../../third_party/llvm-build/Release+Asserts/bin/clang++ -MMD -MF ${out}.d ${defines} ${include_dirs} ${cflags} ${cflags_cc} -c ${in} -o ${out} description = CXX ${out} depfile = ${out}.d deps = gcc We can now generate said extra rule called cxx-instr that looks like the following, serving as a rule that adds the desired instrumentation: $ grep -A 4 "rule cxx-instr" toolchain.ninja rule cxx-instr command = ../../third_party/llvm-build/Release+Asserts/bin/clang++ -fsanitize-coverage=trace-pc-guard -MMD -MF ${out}.d ${defines} ${include_dirs} ${cflags} ${cflags_cc} -c ${in} -o ${out} description = CXX ${out} depfile = ${out}.d deps = gcc After creating this rule, all that is left to do is to apply it to whichever libraries we want or need to have instrumentation in, by changing the build rule from cxx to the newly created cxx-instr: $ grep "cxx-instr.*/typer" obj/v8_compiler.ninja build obj/v8_compiler/typer.o: cxx-instr ../../src/compiler/typer.cc || obj/v8_compiler.inputdeps.stamp With these modifications, we’ll ensure that only a certain part of v8 gets instrumented, more specifically in our case, the typer. Through customisation After instrumenting the code to our liking, we need to ensure that our fuzzing efforts are maximised. Fuzzilli provides two ways to try and trigger JIT on v8; one with the JITStressMutator.swift mutator and another one with the V8Profile.swift profile. For V8Profile there is a code generator: fileprivate func ForceV8TurbofanGenerator(_ b: ProgramBuilder) { let f = b.randVar(ofType: .function()) let arguments = b.generateCallArguments(for: f) let start = b.loadInt(0) let end = b.loadInt(100) let step = b.loadInt(1) b.forLoop(start, .lessThan, end, .Add, step) { _ in b.callFunction(f, withArgs: arguments) } } Basically, what this code generator is doing is: get a reference to a previously defined function within a FuzzIL program with b.randVar(ofType. function()), then try to call it inside a for loop (100 times) so that it (hopefully) triggers optimisation (Turbofan). Extending code generation capabilities To target the JIT compiler (one of which is Turbofan in v8), I started writing a new code generator like ForceV8TurbofanGenerator, but this time aiming for a type confusion that could yield a crash. Most type confusions I studied have the following pattern for exploitation: function confusing_function(x) { define_variables; trigger_bug(x); if (bug_triggered) { access_OOB_array; } } confusing_function(value1); for (let i = 0; i < 10000; i++) { confusing_function(value2); } confusing_function(value3); This is almost the same logic that ForceV8TurbofanGenerator has. I say almost because while it’s ensuring optimisation, it wasn’t ensuring that calls with different parameters could trigger crashes. It is important to try and trigger a crash because type confusion bugs will likely yield no crash, as we’ll see in the Proof-of-Concept later. fileprivate func AimForTypeConfusion(_ b: ProgramBuilder) { // Start modelling the function body let f = b.defineFunction(withSignature: FunctionSignature(withParameterCount: Int.random(in: 2...5), hasRestParam: probability(0.4)), isJSStrictMode: probability(0.2)) { _ in b.generate(n: 5) let array = b.randVar(ofType: .object()) // maybe .jsArray? let index = b.genIndex() b.loadElement(index, of: array) b.doReturn(value: b.randVar()) } // End of function modelling // Generate three random arguments for the function let initialArgs = b.generateCallArguments(for: f) let optimisationArgs = b.generateCallArguments(for: f) let triggeredArgs = b.generateCallArguments(for: f) // Initial call to the function with initialArgs b.callFunction(f, withArgs: initialArgs) // Definition of the for loop to force the function as "hot" b.forLoop(b.loadInt(0), .lessThan, b.loadInt(Int.random(in: 100 ... 20000)), .Add, b.loadInt(1)) { _ in // Call the function with different arguments while being optimised b.callFunction(f, withArgs: optimisationArgs) } // Call the function with different arguments after optimisation b.callFunction(f, withArgs: triggeredArgs) } From the code above, a program function was generated with 5 instructions expecting to get an array from the outer scope and trying to access an index of it (with hopes that it would trigger out-of-bounds accesses). Its definition is then stored in variable f so that we can generate 3 different calls (initialArgs, optimisationArgs and triggeredArgs) with different arguments. This is to mimic the type confusion exploitation pattern shown before. In the interest of time, I don’t want to dwell much more in all of the modifications I made to fuzzilli. But, there’s one important change I made that I think was pivotal in discovering the initial bug. This is, adding the -0 number into the JavaScriptEnvironment.swift file. Maximising fuzzing efforts Up until here, all of the setup work had been modifications I implemented while fuzzing. Meaning, I didn’t get to this point right from the start but rather did the following on repeat: Shutting down fuzzing instancesModified Fuzzilli code and try to improve coverageRestart and sync with the master fuzzer instance During the previous process of changing fuzzing strategies and coding, I also chose different cloud providers and configurations for said fuzzing strategies. As I mentioned before, fuzzing is a constant race and if you want to beat other fuzzers, including Google’s own oss-fuzz, you’ll need to optimise code analysis while also trying to go for depth rather than breadth: As of January 2020, OSS-Fuzz has found over 16,000 bugs in 250 open source projects.– https://github.com/google/oss-fuzz#trophies So, my fuzzers were started, having a leader with just a few cores: 40 fuzzing cores In order to have this blog post advertisement-free, I’ll just mention that a mix of different cloud providers were used for these machines where I fuzzed for several days at a rate of £2.08/hr on average. The top speed I reached was 1710 executions per second. This speed only lasted for about an hour and as soon as more complex cases were found, the execution speed dropped down to an average of 500~600 per second. The maximum number of connected Fuzzilli workers I had at a single point in time was 62. Fuzzer statistics – peak execution speed. 0 day I’m not going to lie, the disclosure was a mess. Given that my knowledge of v8 wasn’t that extensive and that impostor syndrome kicked me in the face a few times, I was unsure if what I discovered was a security vulnerability. To be clear: at this point I had found something, but I was hesitant whether it would have any impact at all. Honey, we’ve got a crash! There is this thing about fuzzing that keeps you excited throughout the process; the feeling of seeing new crashes. This is something that’s both exciting and draining. It was an early Sunday morning when I jumped straight from bed onto my laptop to start triaging/analysing new crashes with some good old for loops in bash. Most of them being out-of-memory (OOM) crashes, except for one. This started with my partner high 5’ing me, cheering me up, followed by me trying to explain to her why it’s so important that the crashes number went from 247 to 248 and why that single instance mattered so much. I’m sure that by now she knows more about exploit development than she would like to. She could have avoided long explanations if in the beginning I had this simple line of code that would prevent crashing on the annoying out-of-memory crashes. This is part of the bits I added that I mentioned before which helped at a later stage to focus fuzzing (and AFL++) efforts even more. Regardless, up until that moment, the line of code to triage each and every '
