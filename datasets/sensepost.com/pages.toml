full_description = '''PsExec’ing the right way and why zero trust is mandatory Reading time ~20 min Posted by aurelien.chalot@orangecyberdefense.com on 10 February 2025 Categories: Psexec, Sensecon, Tools 2021 was the year I met two incredible hackers, Michael and Reino with whom I had the opportunity to work with during my first ever SenseCon. The Sensecon is an internal conference that lasts 3 days during which we meet people, share knowledge and have fun. There is also a day long hackathon during which we work on hacking subjects we are interested in. For that hackathon, we wanted to dig into PsExec.exe in order to see if it is possible to communicate with it via a python script and thus not depend anymore on a windows system. Spoiler alert, we were able to! But for some reasons, the project died in a private repo. Until a few weeks ago where I really needed such a tool to bypass a specific EDR. Seeing that it worked quite well, I thought of finishing the project and publishing it alongside this blog post to explain how we achieved that. In this blog post, we’ll have a glimpse at how PsExec.exe works, we’ll write a python script that allows us to act as a legitimate PsExec.exe client and finally, we’ll see why zero trust is a core requirement of cybersecurity. 1/ How does PsExec.exe work Lots of people have already explained it, but since we are going to mimic it, I thought it would be interesting to explain it one more time. For those unaware, PsExec.exe is one binary among an entire toolkit called Sysinternals which was first released in 1996 by Mark Russinovich. As of today, the latest version of PsExec.exe is version 2.43 which can be downloaded here. Most of the time you will use PsExec in two ways: To gain local system privileges: PsExec.exe -s -i cmd To execute commands remotely as a domain user: PsExec.exe \\dc.whiteflag.local -u WHITEFLAG\Administrateur -p Defte@WF cmd To achieve remote command execution, PsExec.exe relies on 4 steps: Extracting and uploading PsExeSVC.exe When you run PsExec.exe, the first thing it does is extract PsExeSVC.exe, the server side component, which is embedded in PsExec.exe. See the following binwalk output: This binary is then uploaded to the ADMIN$ share (pointing to C:\Windows) as PsExeSVC.exe: 2. Launching the PsExeSVC service Then PsExec.exe, the client, connects remotely to the SVCCTL RPC endpoint which is used to manage services and calls 4 interfaces: OpenSCManagerW to connect to the Service RPC endpoint ; OpenServiceW to create a new service ; StartServiceW to start the newly created service ; QueryServiceStatus to make sure that the service is actually running. And indeed we can see that a new service, PSEXESVC is running: 3. Sending init packet When PsExeSVC starts, it first creates a named pipe called psexecsvc which we will call the initialisation named pipe: Right after this pipe is set up, a transceive operation occurs between the client (PsExec.exe) and the server (PsExeSVC.exe) where they both send their version and receive the version of the other part: Looking at the content of these packets, we will see that they both send 4 bytes of data containing a numeric value stored in hexadecimal (little endian): Which translated, tells us this is PsExec.exe and PsExeSVC.exe version 1.9: Little endia = BE000000 Big endian = 0000000BE = 190 = version 1.9 Why am I not using the latest version? This is because once both components have sent their respective versions, the client will send 19032 to 19040 bytes of data (depending of the version of PsExec). Thing is, since PsExec 2.20, that data, and all later communications, are encrypted. So here is what you would see if you are monitoring PsExec.exe v2.43 communications via Wireshark: And here is the exact same packet with version 1.90: Looking at this one, we can already understand why newer versions of PsExec implement encryption; because the client was sending clear text credentials over the network (we will see why later) which are prone to man in the middle attacks. We can also see that a program is specified, cmd.exe, as well as the computer name from where PsExec.exe was executed (a VM of mine whose hostname is COMMANDO). Notice that all this clear text information is surrounded by null bytes. That is because that data is not just random data, but is a structure whose contours can be seen: # Size of the packet to be read by PsExeSVC (19032) 584a0000 # Little endian hexadecimal for 5800 (don't know what it's used for yet) a8160000 # String (C.O.M.M.A.N.D.O) 43004f004d004d0041004e0044004f00 [ LOTS OF ZEROS ] # String (C.M.D) 63006d006400 [ LOTS OF ZEROS ] # Some bytes ?? 00000101000000000000000000000000ffffffff0100 # String (W.H.I.T.E.F.L.A.G.\.A.d.m.i.n.i.s.t.r.a.t.e.u.r) 5700480049005400450046004c00410047005c00410064006d0069006e00690073007400720061007400650075007200 [ LOTS OF ZEROS ] # String D.e.f.t.e.@.W.F 44006500660074006500400057004600 [ LAST ZEROS ] Right after that structure is received by PsExeSVC.exe, three new named pipes are created: PSEXECSVC-X-Y-stdin used to send commands we want to run remotely ; PSEXECSVC-X-Y-stdout used to retrieve the output of the command ; PSEXECSVC-X-Y-stderr used to retrieve the errors. With: X being a string ; Y being a numeric value. Listing named pipes on the remote target with PowerShell : Get-ChildItem \\.\\pipe\ Shows us the following ones: What about that 5800 numeric value ? Well, looking at the task manager on the computer where PsExec.exe was launched we will see the following: Which implies that this value (Y in the previous pattern) is actually the PID of PsExec.exe. Now we understand that the psexecsvc named pipe is here to receive information that will be used to create the other three named pipes. Schematically, we can say that PsExec.exe creates named pipes this way: Last thing we need to know is how these PsExec.exe options are sent: Since I didn’t want to decompile the binary, which is not really TOS compliant, I just thought of flipping random options and see the differences in the Wireshark outputs. And so I did, until I realised that there is a 32 byte buffer that only contained 0’s and 1’s depending of the options used with PsExec.exe. At that point I was now able to define the structure of the data passed to the PsExeSVC named pipe which is the following: class PsExecInit(Structure): structure = ( ('PacketSize', '<I'), # 19032 (size of the init packet) ('PID', '<I'), # PID of the PsExeSVC.py script ('Computer', '520s'), # Hostname of the computer where PsExeSVC.py is run ('Command', '520s'), # Remote binary to call ('Arguments', '520s'), # Arguments ('OthersOptions', '16385s'), # Some space mostly used to copy files ('ElevateToSystem', '1s'), # Whether we elevate to system or not ('Interactif', '1s'), # Whether launch interactive session (no it won't let you type command otherwise) ('LogonUser', '1s'), # Logs the user in remotely (which enables Windows SSO) ('RestrictedToken', '1s'), # Do we want a restricted priv token ? (nope LOL) ('EnableAllPrivs', '1s'), # Do we able all privileges (HELL YEAH!!) ('OthersFlags', '16s'), # Others options we don't really need ('Username', '520s=""'), # DOMAIN\Username ('Password', '520s=""'), # Password ('Padding', '18s=""') # Padding ) As you can see quite a lot of data is stored in that structure, with the most important ones being the following flags: LogonUser which allows us to have a shell as the authenticated user ; EnabledAllPrivs which allows us to have a full token privilege ; ElevateToSystem which allows us to have a NT AUTHORITY\System remote shell. Pack all of this stuff into a copy of the psexec.py script from Impacket and here you have got psexecsvc.py which you can use in two ways: To get a NT AUTHORITY\System shell (with -system flag): To get a remote shell as the user you supplied credentials for in the target (with the -user flag): Note that authenticating as a domain user requires filling clear text credentials as these credentials will be passed to the PsExeSVC service that will then use them to authenticate locally on the remote target. To do that, PsExeSVC.exe relies on the LogonUser function from the WinAPI whose prototype is the following: BOOL LogonUserA( LPCSTR lpszUsername, LPCSTR lpszDomain, LPCSTR lpszPassword, DWORD dwLogonType, DWORD dwLogonProvider, PHANDLE phToken ); That API call will give you a primary token that will allow you to use the Windows SSO and thus connect to others systems from your remote shell. For example, if I connect to the srv.whiteflag.local server using the -user flag, I will be able to list the C$ share on the dc.whiteflag.local one: But using this feature has a huge caveat since credentials will be stored in the memory of the LSASS process and can be hijacked by an attacker using, for example, NetExec: nxc smb serveur.whiteflag.local -u Administrateur -p Defte@WF -M lsassy That is the reason why you will always see people mention that credentials are not stored in LSASS when authenticating remotely except with the original PsExec.exe, because of the local logon which is done by the PsExecSVC service on the remote server. 2/ What are the benefits of PsExeSVC.py ? Yeah you are right, you may say that this is useless since we can already run commands remotely via psexec.py. But first I’m a lazy hacker, spinning up a Windows VM is a lot for me. Second of all , psexec.py deploys the RemCom service on the remote Windows system which is great… But flagged: While PsExeSVC.exe is not: The reason why RemCom is flagged is because Impacket embeds a compiled version which has been, and is still used, by attackers. Of course you can lower the detection rate by compiling your own version of RemCom. But using a legitimate remote administration tool is better because of this certificate: Which is used to sign a binary and prove that it is part of a toolkit distributed by Microsoft. That certificate alone implies that the binary is not supposed to be malicious and should not be blocked. As such you will often see EDR’s block wmiexec.py and psexec.py but they won’t always block PsExecSVC.py because it relies on a legitimate and trusted tool (the PsExeSVC.exe binary)! That mechanism is called a whitelist, and it is something I have seen a lot which allowed me to pwn many internal networks of the most hardened clients I ever had. Now if you have read the blog post I wrote about building your own EDR, maybe you played with the challenge I published alongside it. In this challenge, I added such a whitelist mechanism, and I was actually surprised because a lot of people sent me their write-ups with amazingly good ideas but that one logical bug I made wasn’t exploited. The bug is located in the code of the static analyzer agent, see the main function: int main() { LPCWSTR pipeName = L"\\\\.\\pipe\\dumbedr-analyzer"; DWORD bytesRead = 0; wchar_t target_binary_file[MESSAGE_SIZE] = { 0 }; printf("Launching analyzer named pipe server\n"); // Creates a named pipe HANDLE hServerPipe = CreateNamedPipe( pipeName, // Pipe name to create PIPE_ACCESS_DUPLEX, // Whether the pipe is supposed to receive or send data (can be both) PIPE_TYPE_MESSAGE, // Pipe mode (whether or not the pipe is waiting for data) PIPE_UNLIMITED_INSTANCES, // Maximum number of instances from 1 to PIPE_UNLIMITED_INSTANCES MESSAGE_SIZE, // Number of bytes for output buffer MESSAGE_SIZE, // Number of bytes for input buffer 0, // Pipe timeout NULL // Security attributes (anonymous connection or may be needs credentials. ) ); while (TRUE) { // ConnectNamedPipe enables a named pipe server to start listening for incoming connections BOOL isPipeConnected = ConnectNamedPipe( hServerPipe, // Handle to the named pipe NULL // Whether or not the pipe supports overlapped operations ); wchar_t target_binary_file[MESSAGE_SIZE] = { 0 }; if (isPipeConnected) { // Read from the named pipe ReadFile( hServerPipe, // Handle to the named pipe &target_binary_file, // Target buffer where to stock the output MESSAGE_SIZE, // Size of the buffer &bytesRead, // Number of bytes read from ReadFile NULL // Whether or not the pipe supports overlapped operations ); printf("~> Received binary file %ws\n", target_binary_file); int res = 0; BOOL isSeDebugPrivilegeStringPresent = lookForSeDebugPrivilegeString(target_binary_file); if (isSeDebugPrivilegeStringPresent == TRUE) { printf("\t\033[31mFound SeDebugPrivilege string.\033[0m\n"); } else { printf("\t\033[32mSeDebugPrivilege string not found.\033[0m\n"); } BOOL isDangerousFunctionsFound = ListImportedFunctions(target_binary_file); if (isDangerousFunctionsFound == TRUE) { printf("\t\033[31mDangerous functions found.\033[0m\n"); } else { printf("\t\033[32mNo dangerous functions found.\033[0m\n"); } BOOL isSigned = VerifyEmbeddedSignature(target_binary_file); if (isSigned == TRUE) { printf("\t\033[32mBinary is signed.\033[0m\n"); } else { printf("\t\033[31mBinary is not signed.\033[0m\n"); } // Here there is a logical bug. If the binary is signed, all others checks are ignored wchar_t response[MESSAGE_SIZE] = { 0 }; if (isSigned == TRUE) { swprintf_s(response, MESSAGE_SIZE, L"OK\0"); printf("\t\033[32mStaticAnalyzer allows\033[0m\n"); } else { // If the following conditions are met, the binary is blocked if (isDangerousFunctionsFound || isSeDebugPrivilegeStringPresent) { swprintf_s(response, MESSAGE_SIZE, L"KO\0"); printf("\n\t\033[31mStaticAnalyzer denies\033[0m\n"); } else { swprintf_s(response, MESSAGE_SIZE, L"OK\0"); printf("\n\t\033[32mStaticAnalyzer allows\033[0m\n"); } } DWORD bytesWritten = 0; // Write to the named pipe WriteFile( hServerPipe, // Handle to the named pipe response, // Buffer to write from MESSAGE_SIZE, // Size of the buffer &bytesWritten, // Numbers of bytes written NULL // Whether or not the pipe supports overlapped operations ); } // Disconnect DisconnectNamedPipe( hServerPipe // Handle to the named pipe ); printf("\n\n"); } return 0; } This code is quite simple, it creates a named pipe that is used by the driver to send information, obtained via a kernel callback, about processes being launched. For each program received, the static analyzer does a few checks: If there are dangerous functions in the binary (this is just a IAT lookup) ; If the SeDebugPrivilege string is found inside ; If the binary is signed. But here is the catch, if the binary is signed, all others requirements become optional, see the if statement: wchar_t response[MESSAGE_SIZE] = { 0 }; if (isSigned == TRUE) { swprintf_s(response, MESSAGE_SIZE, L"OK\0"); printf("\t\033[32mStaticAnalyzer allows\033[0m\n"); } else { // If the following conditions are met, the binary is blocked if (isDangerousFunctionsFound || isSeDebugPrivilegeStringPresent) { swprintf_s(response, MESSAGE_SIZE, L"KO\0"); printf("\n\t\033[31mStaticAnalyzer denies\033[0m\n"); } else { swprintf_s(response, MESSAGE_SIZE, L"OK\0"); printf("\n\t\033[32mStaticAnalyzer allows\033[0m\n"); } } Now let’s take a look at how the signing check function works: BOOL isSigned; switc'''
