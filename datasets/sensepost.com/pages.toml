full_description = "2 Winning quotes.. Reading time ~1 min Posted by Haroon Meer on 29 March 2008 Categories: About:us, Conferences from the SourceBoston videos i blogged about: Dr Geer never dissapoints, and kicked it off with the 4 rules on his office wall: Work like hell, Share all you know, Abide by your handshake, Have fun. If he mentioned anything about foosball or pool.. i woulda sworn blind he was talking about SensePost! The 2nd quote that was awesome, (during the interview with the l0pht members) was from Dildog.. ex-l0pht, ex-@stake, now Veracodes chief scientist.. The discussion turned to “security companies and snake oil”, and the fact that dildog was a “vendor” again.. With a dry smile that could have been at home in a john cleese movie, he replies: “*nod*..Â this time with feeling!” This was a bit of a catchphrase in our office a few years back, after a QA process kicked back a report to an analyst with those words: “once more with feeling…”. The difference between someone going through the motions, and someone doing it with feeling is marked… and i cant imagine why anyone would do it any other way.."
