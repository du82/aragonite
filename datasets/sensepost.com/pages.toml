full_description = "Open source (and lightning fast) Safari ? Reading time ~1 min Posted by Haroon Meer on 10 February 2008 Categories: Mac, Tools While im into posting mac-links.. Check out [Webkit] A little while back i mentioned not understanding why anyone would run a closed source browser while a decent open source version existed.. Then i was forced to use Safari while doing some testing, and was impressed by its snappiness.. it impressed me more when it didnt flinch at me opening ans surfing thousands of tabs.. blergh.. suddenly my firefox was losing its sheen! Yesterday, i downloaded the latest webkit build [http://nightly.webkit.org/] – and while it comes with the obvious disclaimers since its a nightly dev build, its shockingly pleasing, and easily the quickest browser ive used.. it at least gets a spot next to firefox on the dock! /mh ps.. for those who wont bother checking webkit out, from their about page: “WebKit is an open source web browser engine. WebKit is also the name of the Mac OS X system framework version of the engine that’s used by Safari, Dashboard, Mail, and many other OS X applications.“"
