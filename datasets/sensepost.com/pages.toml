full_description = "HBN Developer Edition Training Reading time Less than a minute Posted by Shane Kemp on 30 March 2009 Categories: Training Hi All We have scheduled our first Developer course for April in Pretoria, should you know of anyone in your area that would like to attend. – Hacking by Numbers – Developer Edition (28-30th April) Information about the course: HBN – Developer Edition ‘Hacking By Numbers – Developer Edition’ is a course aimed at arming web application developers with knowledge of web application attack techniques currently being used in the ‘wild’ and how to combat them. Derived from our internationally acclaimed ‘Hacking By Numbers’ security training, this course focuses heavily on two questions: “What am I up against?” and “How can I protect my applications from attack?” During the course sample applications will be dissected to discover security related bugs hidden within the code. The class will then consider prevention, detection & cure. A registration form can be downloaded from [here] Otherwise please mail [training@sensepost.com] for more information. /shane"
