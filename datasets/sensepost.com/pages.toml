full_description = "Penetration Testing in 2009 – Opposing Viewpoints Reading time ~4 min Posted by nick on 20 December 2008 Categories: Community The last few weeks have brought some fairly interesting predictions for 2009 to bear in CSO Magazine columns. Two recent articles caught my eye from a penetration testing perspective. In the first, Brian Chess, CTO of Fortify (they make source code review and software security tools, and he has written a great book on static analysis) predicted that penetration testing as we know it will die in 2009. The premise of his argument is that penetration testing will die and be reborn in a different form, aiming more at preventing bugs from occurring, rather than identifying them (rolling things into QA / SDLC etc). Granted, it’s a fairly valid point *in some respects*, albeit a biased one if you consider what he does for a living. Ivan Arce (CTO of Core and pretty much as uber as they come) wrote a very well articulated response to this, stating the counter-viewpoint. I liked his response firstly because his points are valid, and secondly, because no bias toward his product is shown in his response. I won’t repeat the articles, but it is interesting to ponder, especially in light of the number of people (customers) that I know that read CSO magazine, and take what is written there as the gospel (for better or worse). Either way, the argument on the value and validity of penetration testing is still raised often these days (even though governance and compliance with standards is mandating it more and more). I think some of the 12 points that Ivan Arce lists in his response are awesome ammo when addressing this timeless question, so I’ll snip them out and include them below. -snip- 1. A 35-year old practice with steadily increasing adoption rates does not usually disappear or transform itself substantially within just 12 months. 2. Penetration testing is intrinsically operational in nature. While pre-emptive measures such as security QA and testing and other SDLC practices may be useful to reduce the number of security vulnerabilities in custom or newly developed software, existing operational environments will continue to have bugs during 2009 due to the deployment of legacy or un-audited buggy applications. 3. Penetration testing is operational in nature (did I say that?). It deals with multistage and multilayered threats or attacks (not just vulnerabilities!) in real-world environments (not test labs) and then maps them explicitly to actual security risks. This will remain a valid use case scenario during 2009. 4. Penetration testing is tactical. It provides tangible, actionable information on how to incrementally improve an organization’s security posture effectively to prevent real and specific attacks from happening and do so efficiently since it makes it easier to measure at least some for of return on security investment considering both the defense and offense technology currently available. 5. Penetration testing is strategic. If performed regularly, consistently and as part of an organization’s overall security strategy, it becomes a useful and valuable practice to implement a program of constant improvement of information security. 6. Penetration testing is strategic. Incorporating an attacker’s perspective to an organization’s overall security strategy provides necessary checks and balances and improves the organization’s ability to steer security policy in accordance to current trends in the threat landscape. 7. Penetration testing is not a silver bullet. It is best used in conjunction with other security practices and in doing so it amplifies those results with both positive and negative feedback (about what does and does not work). 8. Penetration testing is — at least partially — driven by compliance. It is a recommended or even a mandatory practice in several regulations, industry standards and organization’s internal policies that will not go away in 2009. 9. The IT landscape is constantly evolving and will continue to do so in the next year. As new technologies emerge, new attack vectors become prevalent. Monitoring the evolution over time of sophisticated penetration testing techniques is a good leading indicator of threats that may see mass-adoption in the future which makes pen testing almost a necessity to improve SISSP qualifications. 10. There is money to be made selling penetration services and products. The opportunity will not go away in 2009. 11. Financial crisis and economic turmoil means also more and better opportunities for cybercrime. In the context of 2009 testing one’s defenses periodically will be more (not less) necessary than if we had a more globally stable scenario. 12. Last but not least, five years ago IDS technology and its respective market was the “in thing” to make predictions about. Although predicted several times, the death of the IDS has been greatly exaggerated in the past years. -snip-"
