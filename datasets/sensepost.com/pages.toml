full_description = "BiDiBLAH Case Study (Part 1) Reading time Less than a minute Posted by francesco on 09 March 2009 Categories: Tools With our recent release of BiDiBLAH 2.0, we’ve decided to revisit some real world scenarios, and ways BiDiBLAH can deal with it… All the scenarios can be downloaded from the BiDiBLAH home page. Scenario: If a hacker can mine/collect email addresses from our company he/she can send malware / phishing attacks to these people. But, who are these people? And what other sensitive information are we leaking from a particular domain? Solution: Using BiDiBLAH, you can easily find out what email addresses can be allocated from the internet, as well as which DNS names are associated with your domain. Assuming your domain is called supercorp123.com, BiDiBLAH can generate the following within 5 minutes /Francesco"
