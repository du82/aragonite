["https://sentry.io/careers"]
title = "Careers | Sentry"
description = "Work at Sentry. We have fun. But not too much. This is still work, after all."
full_description = "These are a bunch of buzzwords we’re not gonna use. It’s not that working here is a meaningless slog, but we’d rather give real reasons you should apply to Sentry. We’re a company built around a product that works, and a team that isn’t a cult. We understand that the difference between a good product and a great one is in the finer details. We take extra care to get everything right, down to the last pixel. White lies help no one. We give each other constructive, respectful, and sincere feedback for the best collective outcome and most personal growth. (On our work, that is. We'll keep opinions on your floral-patterned pants to ourselves.) We don't expect to get things right the first time around. We do our best work by iterating: making small changes, measuring impact, and trying again (and again, and sometimes again). Sentry is a tool for everyone who codes. We strive to create a product that's accessible (and indispensable) to developers at any level, at companies big, small, and everything beyond and in between. We know that we don't know everything. Nothing here is set in stone. We're still filling roles and writing rules, as a team. In the meantime, we embrace individual ownership, autonomy, and accountability. We respect one another. We understand that success comes from a variety of backgrounds, experiences, skills, and opinions — not in spite of it. Even if we disagree on the route, we still push forward to the end. You're more like a sprocket, but with a fridge stocked with a minimum of six different brands of sparkling water. We’re a relatively small and moderately fast-growing team, where every person influences the product, brand, culture, and snack closet. So we promise you’ll never feel useless. Or hungry. We won’t tell you that we’re changing the world one bug at a time, because that’d be cheesy and a little weird. But our cloud-based error monitoring saves more than 1 million developers at over 100K organizations a lot of time and headaches. Not to mention, it helps developers find software bugs before they cause any trouble, keeping your everyday tech mostly glitch-free."
year_published = 2025
clearnet = "https://sentry.io/careers"
