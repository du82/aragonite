title = "Sentry Community & Events | Sentry"
description = "Hang out with us."
full_description = 'Whether it’s inefficient code, resource bottlenecks, or slow database calls, left undetected, performance regressions can bring your app to a crawl. A picture is worth a thousand words. But, if that picture fails to load or ruins your website, then how much is it worth? Believe it or not, we’ve been using images in our web pages since 1993, since the days of Netscape! We’ve used them to support and enhance our text content, and even to decorate our websites and make them look prettier. But, as much as can images bring value, they can also ruin the credibility of our website and the experience of our visitors. We need to make sure that the images bolster rather than burden our websites. This section of articles focused on optimizing images and handling errors connected to images will help you strike that crucial balance between visual appeal and good website performance. Ask questions, find answers, and connect with other people who get weirdly excited about application monitoring. How Tackle Monitors Performance in Serverless: "We continuously use @getsentry to monitor run time errors and API performance so that we can give our developers visibility into real customer experiences." Earlier in the summer I was worried the Slopes server was too slow. Installed @getsentry’s new Laravel performance monitoring to rnd sample calls yesterday. Good to have hard numbers that my code isn’t particularly slow 😄 New on Code[ish] - @bentlegen from @getsentry explores how being a #JavaScript developer went from reviled to respected. Hosted by @superhighfives: http://hrku.co/codeish85 Sentry is amazing @getsentry I know about every issue as it happens. Down to the file and line number where the error occurred. Without having to manually look at logs. We collect PII about people browsing our website, users of the Sentry service, prospective customers, and people who otherwise interact with us. What if my PII is included in data sent to Sentry by a Sentry customer (e.g., someone using Sentry to monitor their app)? In this case you have to contact the Sentry customer (e.g., the maker of the app). We do not control the data that is sent to us through the Sentry service for the purposes of application monitoring.'
