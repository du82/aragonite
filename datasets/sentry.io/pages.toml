title = "Error Monitoring and Crash Reporting for Game Development | Sentry"
description = "Sentry for Gaming catches all of your errors & provides suggestions on how to fix them before they impact the player experience. Try Sentry for free."
full_description = '''Your game's code is telling you more than what your logs let on. Sentry for Gaming catches all your errors and performance issues, and shows you how to fix them before they bring down the player experience. Whether you’re building the latest FPS or a turn-based classic, you need visibility in how your game performs. In the event players hit an unexpected issue—anything from your game failing to instantiate specific objects or simply corrupted savegames — Sentry will report on device type, orientation, battery level, GPU state, CPU info, and everything about the software and OS that your game is running on so you can reproduce the issue and fix it faster. Stop querying log files to troubleshoot performance issues. Use Sentry Performance Monitoring to quickly identify errors and latency problems by tracing from your frontend through all your services to see the exact poor-performing API call or slow database query. Add log files to receive Breadcrumbs showing the events leading up to the crash. Include fine-grained information of game state in custom tags or even upload screenshots or links to replay-servers. Get real-time visibility across releases to see core metrics like crash-free sessions, version adoption, and failure rate so you can see the moment a release starts to degrade and quickly take action. "Sentry provides a feature-rich marketplace application which integrates directly with Riot’s game operations and monitoring channels." Use Sentry to collect and process errors and performance issues from clients and@media (min-width: 0px){.css-1l9mcjf{display:none;}}@media (min-width: 576px){.css-1l9mcjf{display:block;}} connected projects. We support all major platforms. We collect PII about people browsing our website, users of the Sentry service, prospective customers, and people who otherwise interact with us. What if my PII is included in data sent to Sentry by a Sentry customer (e.g., someone using Sentry to monitor their app)? In this case you have to contact the Sentry customer (e.g., the maker of the app). We do not control the data that is sent to us through the Sentry service for the purposes of application monitoring.'''
