["https://sentry.io/for/flask"]
title = "Flask Error Monitoring | Sentry"
description = "Track Flask performance issues back to code-related errors with Flask error & performance monitoring. Get started for free with Sentry here."
full_description = "Actionable insights to resolve Flask performance bottlenecks and errors. Improve your monitoring workflow with a full view of releases so you can mark Flask errors as resolved and prioritize live issues. Within minutes after installing Sentry, software teams are able to trace Flask performance issues back to a poor performing API call as well as surface all related code errors. Engineering Managers and Developers now have a single tool to optimize performance of their code and deliver fast customer experiences with Performance Monitoring. See local variables in the stack for prod errors, just like in your dev environment. Introspect more deeply into the runtime and jump into the frame to get additional data for any local variable. Filter and group Flask exceptions intuitively to eliminate noise. Expose the important events that led to each Flask exception: SQL queries, debug logs, network requests, past errors. Learn in which version a bug first appeared, merge duplicates, and know if things regress in a future release. Aggregate errors by details like HTTP request, hostname, and app version to see what’s new, a priority, or a trend. Assign custom tags to reproduce the error environment specific to your application, business, and users. Find answers to key questions: How actionable is this error? In which app release did the Flask bug occur? Traditional logging provides you with a trail of events. Some of those events are errors, but many times they’re simply informational. Sentry is fundamentally different because we focus on exceptions, or in other words, we capture application crashes. We discuss in more detail here and on our blog. You can get started for free. Pricing depends on the number of monthly events, transactions, and attachments that you send Sentry. For more details, visit our pricing page. If you look at the configuration options for when you initialize Sentry in your code, you’ll see there’s nothing regarding minimizing its impact on your app’s performance. This is because our team of SDK engineers already developed Sentry with this in mind."
