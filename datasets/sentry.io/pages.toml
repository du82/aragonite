description = "Stay up to date on everything big and small, from product updates to SDK changes with the Sentry Changelog."
full_description = "Sentry's GitHub Action has Improved Runtime CompatibilitySentry's GitHub Action has improved runtime and compatibility for Linux based GitHub action runners while still supporting Mac OS and Windows runners.February 28, 2025 Compare Queries in Trace Explorer (Early Adopters)Compare several queries simultaneously to find correlations between span metricsFebruary 27, 2025 Laravel SDK 4.13.0SDKSPHPLARAVELThe latest version of the Laravel SDK added support for Laravel 12.0.February 18, 2025 Android/Java SDK v8.0.0SDKSPERFORMANCEANDROIDMOBILEBACKENDJAVAThe latest release of the Sentry Java SDK is live with version 8.0.0. It includes improvements to automatically capture more data from popular libraries and frameworks.February 18, 2025 Issue Views supports saving project, environment, and time range filters (Early Adopter)ISSUESEARLY-ACCESSSave filters for projects, environments, and time ranges in Issue Views (available for Early Adopters), for quicker access and greater control and customizability.February 13, 2025 JavaScript SDK v9SDKSJAVASCRIPTNODE.JSThe Sentry JavaScript SDK just had the most boring major release ever.February 12, 2025 Sentry Release GitHub Action Now Available On All RunnersSentry's Release GitHub Action is now available for all GitHub-hosted runners.February 7, 2025 New Issue Details UI Now AvailableThe revamped issue details page is now available to all users, with an improved UI which streamlines triage workflows and addresses usability concerns.February 6, 2025 AI-powered Issue Grouping now Generally AvailableISSUESAI/MLAlertsWe have updated the Sentry issue grouping algorithm to improve duplicate detection and reduce noise, resulting in 40% less issues and alerts.February 5, 2025 Introducing the Mobile VitalsPERFORMANCEMOBILEWe've introduced an opinionated Mobile Vitals landing page, summarizing your mobile metrics.February 4, 2025"
