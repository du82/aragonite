["https://sentry.io/for/go"]
title = "Go Error Tracking and Performance Monitoring | Sentry"
description = "Prevent crashes across your entire stack with Go error monitoring. Learn how to trace Go performance issues & related errors with Sentry here."
full_description = "Debug Go apps and prevent crashes across your entire stack. Trace Go performance issues back to a poor performing API call and surface any related code errors. Sentry provides a single platform to optimize the performance of Go code and deliver fast customer experiences. See details like filename and line number so you never have to guess with Go errors. Filter and group Go exceptions intuitively to eliminate noise. Monitor errors at scale without impacting throughput in production. Reproduce errors without user feedback. Sentry’s Go error monitoring includes each bug’s history of events and actions. Use issue graphs to understand frequency, scope, and impact of Goerrors and prioritize what needs to be fixed. Get alerts via email, SMS, or chat when bugs make it into production without disrupting your development workflow. Understand the context that contributed to errors with tags and relevant information about your software, environment, and users. You can also submit optional custom data to provide extra context for bug tracking that is unique to your application and business. Find answers to key questions: Which clients’ users experienced this bug? Was their game running in 32 bit or 64 bit mode? Traditional logging provides you with a trail of events. Some of those events are errors, but many times they’re simply informational. Sentry is fundamentally different because we focus on exceptions, or in other words, we capture application crashes. We discuss in more detail here and on our blog. You can get started for free. Pricing depends on the number of monthly events, transactions, and attachments that you send Sentry. For more details, visit our pricing page. If you look at the configuration options for when you initialize Sentry in your code, you’ll see there’s nothing regarding minimizing its impact on your app’s performance. This is because our team of SDK engineers already developed Sentry with this in mind. Sentry is a listener/handler for errors that asynchronously sends out the error/event to Sentry.io. This is non-blocking. The error/event only goes out if this is an error."
year_published = 2025
