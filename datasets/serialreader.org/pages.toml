["https://serialreader.org/faqs"]
title = "About - FAQs - Contact | Serial Reader for iOS and Android"
description = "Frequently asked questions, contact info, press images and more. Read classic books in bite-sized bits delivered every day with Serial Reader for iOS and Android."
full_description = '''Serial Reader is made by me, Michael Schmitt (👋). I also add all the books to the app. Serial Reader launched in 2016 after helping me improve my reading. It's free for iOS and Android platforms. Dividing up a book in 20 minute daily issues offers several benefits but definitely isn't for everyone. I built the app to improve my reading habits by slowing down: limiting myself to digest smaller parts of dense literature over many days helped me think more critically about the work and retain more of the story. Others find it's a great way to work through otherwise daunting books, or to luxuriously re-read old favorites. If a book was originally written in a language other than English, the translator should be listed at the beginning of the book's first issue. If not, please let me know and I'll add it ASAP. You can unsubscribe by swiping to the left on the book in the bottom list of the initial home screen within Serial Reader, or by going to the "Settings" section within a book and selecting the "Delete Serial" button. You can change fonts, sizes, margins, themes, and more while reading by selecting the "Aa" or settings gear icon in the top navigation bar. If the navigation bar is not visible, simply tap the center of the screen to make it appear. Yes! You can add your own ebook files to Serial Reader. The app will automatically serialize your books, letting you read one issue a day just like other books in Serial Reader. When browing for new books, simply select the "Add Your Own Book" option to get started. Please note this feature is currently in beta and only accepts EPUB files. It cannot accepted files with DRM protections. Yes! The easiest way is to search for the book in Serial Reader. If it's not available, a "Request" button will appear where you can send the title and author of the book you want directly to me. I may not be able to add your request due to rights issues, but I look at every request that comes in! I can most easily add books published before 1925.'''
