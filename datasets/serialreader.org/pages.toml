["https://serialreader.org/blog/books-1925-public-domain-gatsby-dalloway-christie-hemingway"]
title = "New Serials from 1925: The Great Gatsby, Mrs. Dalloway, An American Tragedy, and more | Serial Reader for iOS and Android"
description = "New for 2021 in Serial Reader: The Great Gatsby, Mrs. Dalloway, The New Negro, An American Tragedy, Manhattan Transfer, Arrowsmith, and more from Agatha Christie, Ernest Hemingway, Willa Cather, and authors."
full_description = '''Happy 2021! Today all works published in 1925 enter the US public domain and many are now available to read in Serial Reader! It was an impressive year for literature -- an article from the BBC even suggests "1925 may well be literature’s greatest year" -- with famous titles like The Great Gatsby, Mrs. Dalloway, The New Negro, and An American Tragedy, as well as works from Agatha Christie, Ernest Hemingway, Willa Cather, P.G. Wodehouse, Aldous Huxley, and more. The themes and focal points from 1925's literature certainly resonate in 2021: conflict brought on by differences in race, social, and economic classes, questions on the attainability of the American dream, the complexity of medical care and new technology. "The literature reflected both a booming economy, whose fruits were unevenly distributed, and the lingering upheaval and tragedy of World War I," writes Jennifer Jenkins, Director of Duke's Center for the Study of the Public Domain. "The culture of the time reflected all of those contradictory tendencies." "These books weren’t just original, even revolutionary, creations," wrote Jane Ciabattari for the BBC. "They were helping to establish the very idea of modernity, to make sense of the times." The Jazz Age story of lavish Long Island parties, a young mysterious millionaire, and the woman he loved. Arguably one of the greatest novels ever written, exploring themes of decadence, idealism, and the American dream. "It has almost the status of a holy work, and it’s seen as embodying all kinds of things about American values and society... one of those remarkable literary works that seems to adapt to its times." - James L. W. West III Over the course of a single day, Clarissa Dalloway prepares for a high-society party and is struck with memories of the past. Considered Woolf's greatest novel. "A remarkably expansive and an irreducibly strange book. Nothing you might read in a plot summary prepares you for the multitudes it contains" - Jenny Offill in The New Yorker'''
