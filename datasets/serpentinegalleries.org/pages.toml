["https://serpentinegalleries.org"]
title = "Serpentine Galleries"
description = "Free contemporary art gallery in London's Kensington gardens with a year-round programme taking place across two galleries, in the park and online."
full_description = "Arpita Singh Remembering Opens 20 March What's On Join us for exhibitions, events, virtual talks and public art projects. ← → Public Art Public Art Dr Esther Mahlangu: Umuntu ngumuntu ngabantu Serpentine North Garden 4 October 2024 - 28 September 2025 Serpentine presents a public art mural by Dr Esther Mahlangu. Read more + Exhibitions Exhibitions Arpita Singh: Remembering Serpentine North Gallery 20 March - 27 July 2025 Remembering is the first solo exhibition of Arpita Singh outside India, featuring key works selected in collaboration with the artist from her prolific career spanning over six decades. Read more + Exhibitions Exhibitions Giuseppe Penone: Thoughts in the Roots Kensington Gardens Serpentine South Gallery 3 April - 7 September 2025 Thoughts in the Roots brings works together works from 1969 to the present, illustrating Penone’s enduring fascination with the interplay between organic and artistic processes. Read more + Exhibitions Live Exhibitions Court for Intergenerational Climate Crimes (CICC) Offsite 5-24 April 2025 Serpentine is pleased to present a new chapter of the Court for Intergenerational Climate Crimes (CICC), titled The British East India Company on Trial. Read more + Reader Read more + Plan your visit Find out how to make the most of your visit to Serpentine Read more Serpentine South Kensington Gardens, London W2 3XA Closed until 3 April. Bookshop open Tue-Sun, 10am-6pm Serpentine North West Carriage Drive, London W2 2AR Closed until 20 March. Cafe open Tue-Sun, 8.30am-4.30pm Serpentine Reader Discover the inaugural issue of Serpentine Reader, a publication featuring contributions from artists and writers passionate about crafting immersive narratives and exploring new literary expressions. FIND OUT MORE Free Digital Guide Discover more from Serpentine with our free Bloomberg Connects audio guide. Hear from artists, curators and special guests talking in-depth about Serpentine exhibitions. DOWNLOAD NOW"
