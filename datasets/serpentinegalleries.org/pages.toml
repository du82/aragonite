description = "Get in touch with the Serpentine's visitor experience team and find direct contact details for our staff."
full_description = "Contact us General Enquiries Visitor Experience Information Desk Tel: 020 7402 6075 Email: [email protected] For all ticketing enquires please email: [email protected] Shop Enquiries Email: [email protected] Feedback We welcome visitor feedback. It helps us improve our visitors’ experiences and informs our decision-making processes. Contact us with your feedback and questions: T: +44 (0)20 7402 6075 [email protected] If a response is required, we will aim to contact you within two working days. Postal address: Visitor Feedback Serpentine Galleries Kensington Gardens London W2 3XA United Kingdom Handling your feedback We’ll share your feedback with the relevant departments within the Serpentine. We’ll respect your privacy and will resolve your concerns to the best of our ability. For more information, please read our Feedback and Complaints Policy and Procedure."
