title = "servant 0.14.1 released - haskell-servant"
full_description = '''servant 0.14.1 released We’re happy to announce the minor release of servant-0.14.1. Merge in (and slightly refactor) servant-generic (by Patrick Chilton) into servant (Servant.API.Generic), servant-client-code (Servant.Client.Generic) and servant-server (Servant.Server.Generic). data Routes route = Routes { _get :: route :- Capture "id" Int :> Get '[JSON] String , _put :: route :- ReqBody '[JSON] Int :> Put '[JSON] Bool } deriving (Generic) record :: Routes AsServer record = Routes { _get = return . show , _put = return . odd } app :: Application app = genericServe record See the new cookbook recipe for an example. Deprecate Servant.Utils.Links, use Servant.Links. The Servant.Utils.Links module will be removed in an upcoming major release. servant-server Deprecate Servant.Utils.StaticUtils, use Servant.Server.StaticUtils. The Servant.Utils.StaticUtils module will be removed in an upcoming major release. Posted on July 5, 2018 by The servant team'''
