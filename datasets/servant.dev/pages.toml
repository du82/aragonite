title = "Servant - haskell-servant"
full_description = "Servant servant is a set of packages for declaring web APIs at the type-level and then using those API specifications to: write servers (this part of servant can be considered a web framework), obtain client functions (in haskell), generate client functions for other programming languages, generate documentation for your web applications and more… All in a type-safe manner. Documentation – Cookbook – WGP2015 Paper Blog Why is servant a type-level DSL? by Alp Mestanogullari - July 12, 2018 servant 0.14.1 released by The servant team - July 5, 2018 servant 0.14 released by The servant team - June 19, 2018 Passing a DB connection to handlers in Servant by Oleg Grenrus - March 3, 2017 servant 0.5 released by The servant team - March 19, 2016 Announcing servant-swagger and swagger2 by David Johnson, Nickolay Kudasov, Julian Arni - February 6, 2016 Content Type Bliss by Julian K. Arni - August 5, 2015 Pulling a mock server for your APIs out of thin air by Alp Mestanogullari - July 24, 2015 servant paper submitted to WGP 2015 by Alp Mestanogullari - May 25, 2015 servant 0.4 released by The servant team - May 10, 2015 External Tutorials and Blog Posts Hackage API client in 5 minutes Developing a servant application with Halcyon Type-Safe Microservices in Haskell with Servant Type-safe web services in Haskell with servant Servant, Type Families, and Type-level Everything Combining Servant With Persistent Implementing a minimal version of haskell-servant Consultancies If you’d like to be added, please send a pull request changing the consultancies.md file, while maintaining alphabetical order. Being listed does not imply endorsement by the servant maintainers. Well-Typed This work is licensed under the Creative Commons Attribution 4.0 International License. To view a copy of this license, visit creativecommons.org/licenses/by/4.0/."
