title = "servant 0.14 released - haskell-servant"
full_description = "servant 0.14 released Table of contents Introduction Significant changes Other changes Introduction We’re happy to announce the release of servant-0.14. This is relatively small release, still containing some new features and breaking changes. Significant changes Stream takes a status code argument -Stream method framing ctype a +Stream method status framing ctype a (#966 #972) ToStreamGenerator definition changed, so it’s possible to write an instance for conduits. -class ToStreamGenerator f a where - toStreamGenerator :: f a -> StreamGenerator a +class ToStreamGenerator a b | a -> b where + toStreamGenerator :: a -> StreamGenerator b (#959) Added NoFraming streaming strategy (#959) servant-client-core Free Client implementation. Useful for testing HasClient instances. (#920) servant-client-core Add hoistClient to HasClient. Just like hoistServer allows us to change the monad in which request handlers of a web application live in, we also have hoistClient for changing the monad in which client functions live. Read tutorial section for more information. (#936) If you have own combinators, you’ll need to define a new method of HasClient class, for example: type Client m (MyCombinator :> api) = MyValue :> Client m api hoistClientMonad pm _ nt cl = hoistClientMonad pm (Proxy :: Proxy api) nt . cl servant Add safeLink' :: (Link -> a) -> ... -> MkLink endpoint a, which allows to create helpers returning something else than Link. (#968) servant-server File serving in polymorphic monad. i.e. Generalised types of serveDirectoryFileServer etc functions in Servant.Utils.StaticFiles (#953) servant-server ReqBody content type check is recoverable. This allows writing APIs like: ReqBody '[JSON] Int :> Post '[PlainText] Int :<|> ReqBody '[PlainText] Int :> Post '[PlainText] Int which is useful when handlers are subtly different, for example may do less work. (#937) servant-client Add more constructors to RequestBody, including RequestBodyStream. Note: we are looking for http-library agnostic API, so the might change again soon. Tell us which constructors are useful for you! (#913) Other changes GetHeaders instances implemented without OverlappingInstances (#971) Added tests or enabled tests (#975) Add pagination cookbook recipe (#946) Add servant-flatten “spice” to the structuring api recipe (#929) Dependency updates (#900 #919 #924 #943 #964 #967 #976) Documentation updates #963 #960 #908 #958 #948 #928 #921) Development process improvements (#680 #917 #923 #961 #973) Posted on June 19, 2018 by The servant team"
