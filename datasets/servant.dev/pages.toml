["https://servant.dev/posts/2018-07-12-servant-dsl-typelevel.html"]
title = "Why is servant a type-level DSL? - haskell-servant"
full_description = '''Why is servant a type-level DSL? Table of contents It all started with a problem A first, non-modular attempt The Expression Problem A first modular attempt Servant’s approach (simplified) Conclusion Going further This post is an attempt at explaining servant’s design as an embedded domain specific language, and particularly why it had to be a type-level domain specific language, given our requirements. Along the way, we will discuss approaches for designing extensible EDSLs in Haskell and see why other simpler approaches just can’t meet the said requirements. It all started with a problem Back in 2014, Sönke Hahn, Julian Arni and myself were working together in “the Haskell team” at Zalora on all sorts of projects. Many of them involved serving web applications, querying external APIs or our own services from Haskell, PHP, JS and probably a few other languages. At the time, we were using a few of the well established “web frameworks”, among which scotty, whenever we had to offer some service over HTTP. However, writing all those functions for hitting our own webservices was a lot of manual, error-prone, tedious work. The bigger web applications got, the more tedious it became. And it had to be done once per language in which we wanted to hit the application. This could not continue. For reference, this is what a simple scotty application looks like: {-# LANGUAGE OverloadedStrings #-} import Data.Text (split) import Web.Scotty main :: IO () main = scotty 8000 $ get "/repeat/:n" $ do n <- param "n" json (replicate n n) post "/message" $ do msg <- jsonData json (split "\n" msg) How could we somewhat automate the creation of one client function per endpoint of the web application? In an ideal world, we would just show this application to some program or library and it would collect all the data it needs about the overall structure of the application from the code itself, in order to produce 2 client functions: -- Client for the first endpoint. -- -- The Int is the value you want to set ":n" to (/repeat/23, /repeat/10, ...). getRepeat :: Int -> ClientMonad [Int] -- Client for the second endpoint. -- -- The JSON body (just a naked string) to send is the Text argument. postMessage :: Text -> ClientMonad [Text] which would do all the hard work of preparing an HTTP request for us, even taking care of JSON encoding and decoding for us. But… the entire structure of the application is just hidden in the do block and we just cannot programmatically access it. So… this is not realistically doable. We clearly need to change (a little bit? a lot?) the way we write our applications, making sure we get a description of the web’s application structure (the endpoints, the part of the request they use or depend on, what they return) that we could then hand over to something, which would get us our client functions. We will now try implementating such a web application description DSL in the most straightforward way possible. Note: We could define a DSL with an interpreter that spits out Haskell code for us (through Template Haskell or another mechanism). The result would be typed, but the process would not be. The translation from the DSL to the result would be untyped code, therefore easy to get wrong. As Haskell programmers, we prefer static type checking where possible. This therefore excludes Template Haskell and other code generation mechanisms. A first, non-modular attempt We want to produce client functions that look like the ones above, that prepare and send HTTP requests for us by taking some pieces of data given as arguments to those functions and encoding then storing them in the right places of the request (request path for URL captures, request body, headers, etc). Let’s perhaps start simple with a data type for describing an endpoint that can be served under some path (which can contain static string fragments and captures), for a given http method, ignoring everything else for now. It could look like this: data Method = Get | Post data Endpoint = Static String Endpoint | Capture Endpoint | Verb Method -- GET /hello/:name getHello :: Endpoint getHello = Static "hello" (Capture (Verb Get)) and, if we want it to look a little more “servant-y”, we can define: infixr 5 :> (:>) :: (Endpoint -> Endpoint) -> Endpoint -> Endpoint f :> x = f x getHelloNew :: Endpoint getHelloNew = Static "hello" :> Capture :> Verb Get Unlike servant though, as you can see with the type of getHello and getHelloNew, our descriptions are good old Haskell values, both of the Endpoint type. Given those few definitions, how could we go about, say, generating links to endpoints? Well, here is a straightforward attempt. -- a link here is just a list of path components -- (we ignore query parameters in this post) type Link = [String] linkTo :: Endpoint -> Link linkTo (Static str rest) = str : linkTo rest linkTo (Verb _method) = [] linkTo (Capture rest) = ??? : linkTo rest But… what should we put in place of those ???, if anything? Well, we definitely want to add some path component, to fill the Capture slot. However, by definition, a captured path fragment is not fixed, it is allowed to vary. In other words, Capture :> Verb Post matches both POST /x and POST /y. We cannot just pick one value and hope that it is the one the user wanted. We need to take it as an argument. But what about Capture :> Capture :> Verb Post? We would need our linkTo function to take 2 arguments for that case. And zero additional argument for Static "hello" :> Verb Post. This is quite problematic. Indeed, we would like the type of linkTo to be Endpoint -> Link, Endpoint -> String -> Link, Endpoint -> String -> String -> Link and so on depending on what the Endpoint argument is. In other words, we want the return type of linkTo (when really seen as a function of one argument, which it is anyway) to depend on the value of type Endpoint it gets as input. That is, we want a type that depends on a value, i.e dependent types. The alternative would be: -- linkTo assumes that the capture values are given in the same order as we want -- them to appear in the url. linkTo :: Endpoint -> [String] -> Link linkTo (Static str rest) captureValues = str : linkTo rest captureValues -- when there is at least one value left in the list, we use it. -- when there isn't... we error out. linkTo (Capture rest) (c : cs) = c : linkTo rest cs linkTo (Capture rest) [] = error "linkTo: capture value needed but the list is empty" -- :-( linkTo (Verb method) _ = [] This solution is very unsatisfactory, first and foremost because it is possible for it to error out if we don’t supply the right number of captures. However, it will also silently let us pass too many capture values without telling us that some of them are not used. Such a function should be total, we really don’t want an implementation that can let us down if we’re not very careful. Fortunately, GADTs can help here. We could turn Endpoint into a GADT that tracks captures and then use some type-level computations to get the type of the link-making function from our list of captures, as well as define the link making function through typeclass instances that would go through the captures and add an argument for each of them. Request bodies, query parameters, headers? We could probably track them too, in a similar way. Or we could unify it all by basically building up and tracking actual servant API types through a GADT version of Endpoint’s type argument, and do some of what servant does at the type-level, with everything else at the value-level. However, all those approaches have a big problem. Once you’ve made a decision, it is set in stone, in a way. Indeed, in all these approaches, if you want to extend your web app description language, you need to add a new constructor to your Endpoint type. You then need to handle this new constructor in all the functions that pattern match on Endpoint constructors since they’ve instantly become partial. Not to mention that just the act of adding a constructor requires rebuilding the entire library. You cannot explore two different directions simultaneously without breaking code, you cannot add new constructs you hadn’t thought of without touching the library, e.g just locally in a project of yours. Extensibility and modularity were central requirements as we had been bitten by the lack of them in libraries that we were using at the time. Note that a GADT-based approach would work well (in addition to being more approachable) for very stable domains, and is not considered here because of the kind of flexibility we are asking for. So… how do people build extensible/modular DSLs in Haskell? The next section talks about the general problem behind this and a solution that I read about that gets us halfway to servant. The Expression Problem To quote Phil Wadler: “the expression problem is a new name for an old problem. The goal is to define a datatype by cases, where one can add new cases to the datatype and new functions over the datatype, without recompiling existing code, and while retaining static type safety (e.g., no casts)”. In Haskell, the standard approach to representing some domain is to define an algebraic data type for it. For a simple type of expressions with additions and integers, we usually do: data Expr = I Integer | Add Expr Expr and proceed to write what we call “interpreters”, which in this case are just functions that take expressions as input and do something interesting with them. eval :: Expr -> Integer eval (I n) = n eval (Add a b) = eval a + eval b prettyPrint :: Expr -> String prettyPrint (I n) = show n prettyPrint (Add a b) = unwords [prettyPrint a, "+", prettyPrint b] So, given an expression type, we can easily “add new functions over the data type”, to reuse Phil’s wording. We just write a new function. However, when the time comes to “add new cases to the data type”, this approach becomes painful. A “new case” here means a new constructor for our Expr data type. Let’s say we want to support multiplications too: data Expr = I Integer | Add Expr Expr | Mul Expr Expr Now, we have to modify every single function that patterns matches on an Expr to handle the Mul constructor, including our eval and prettyPrint “interpreters”. For any non-trivial domain, this becomes very painful, very quickly. Fine, so what other options are there? Ralf Lämmel’s slides on the topic have been of a great help for me, back when we were looking for a solution suitable to our needs. With Oleg Kiselyov, they show how we can reasonably easily (that is, in Haskell 98) achieve full extensibility in both directions (constructors and interpretations) in Haskell. It boils down to: Turn what would be a constructor into its own little data type. Turn what would be a simple function that operates on the data type into a typeclass with a method. Write instances of those typeclasses for the data types representing the DSL’s constructs. This effectively means that we won’t have a single type to represent all the valid “endpoint descriptions”. Instead, with this approach, we will be able to process any “reasonable” combination of “endpoint components”. The Expr typeclass below is exactly what lets us say what is a valid endpoint description and what isn’t. Using their approach for our expressions would look like this: -- our expression constructs, one data type per -- constructor we had previously. -- integer constants data I = I Integer -- Since we don't have an 'Expr' type anymore, to use as a type for -- the fields of Add, we just make them type parameters. Sometimes -- 'l' and 'r' might be I, some other times they might be 'Add I I', -- or 'Add (Add I I) I', and so on. The type reflects the recursive -- structure. data Add l r = Add l r -- an "open union" to be able to describe all the -- valid expression types. class Expr a instance Expr I instance (Expr l, Expr r) => Expr (Add l r) -- our first interpretation, evaluation class Expr a => Eval a where eval :: a -> Integer -- evaluating a constant amounts to returning it instance Eval I where eval (I n) = n -- if we know how to evaluate two things, we know how to evaluate -- their addition instance (Eval l, Eval r) => Eval (Add l r) where eval (Add a b) = eval a + eval b -- our second interpretation, pretty printing class Expr a => Pretty a where pretty :: a -> String instance Pretty I where pretty (I n) = show n instance (Pretty l, Pretty r) => Pretty (Add l r) where pretty (Add a b) = unwords [pretty a, "+", pretty b] Every constructor that we had in our previous Expr data type is now turned into its own little type, and every interpretation becomes a type class that all those little types are then free to provide an instance for. In fact, we do not necessarily have to supply an instance of each interpretation for all of our constructs. If we try to interpret an expression that uses a construct not supported by this interpretation, we get a type error! This is much better than calling error in some corner cases that should in theory not be reached… In theory. Right. Anyway, if we now want to add support for multiplications, we can do: data Mul l r = Mul l r instance (Expr l, Expr r) => Expr (Mul l r) instance (Eval l, Eval r) => Eval (Mul l r) where eval (Mul a b) = eval a * eval b instance (Pretty l, Pretty r) => Pretty (Mul l r) where pretty (Mul a b) = unwords [autoParens a, "*", autoParens b] where autoParens a@(Add _ _) = "(" ++ pretty a ++ ")" autoParens a = pretty a We didn’t have to change any existing function, that’s great! Let’s apply this approach to a very simplified web application description “language” that we could make out of tiny building blocks (static path fragments, captures, etc). A first modular attempt Adapting the approach from the previous section to our domain, we can give a shot at decomposing the kind of information we want to represent into a few different “constructs” (i.e data types). -- static path fragments data Static = Static String -- variable path fragments ("captures") data Capture = Capture -- HTTP method data Method = Get | Post -- Leaf of a chain of :>'s, specifies the HTTP method data Verb = Verb Method -- chain a few "endpoint components" with this operator, -- all chains must be terminated with a 'Verb' component. infixr 5 :> data a :> b = a :> b -- a class to specify all the valid endpoint descriptions class Endpoint a -- Verb alone is one. instance Endpoint Verb -- if we have a valid description, sticking 'Static :>' in front of it -- yields another valid description. instance Endpoint rest => Endpoint (Static :> rest) -- if we have a valid description, sticking 'Capture :>' in front of it -- yields another valid description. instance Endpoint rest => Endpoint (Capture :> rest) -- GET /hello endpoint1 = Static "hello" :> Verb Get OK, why not. Let’s now try to write an interpretation for generating links to endpoints like the one above. This is a lot simpler and self-contained than investigating client generation or serv'''
