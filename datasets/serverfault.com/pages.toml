title = "Active Directory SQL Server Random Handshake Timeouts - Server Fault"
description = "We've installed active directory on a new server and joined our database server and web servers to this new domain.  However, randomly, we'll get the following error.  What would be the cause of the"
full_description = '''Active Directory SQL Server Random Handshake Timeouts Ask Question Asked 10 years, 4 months ago Modified today Viewed 5k times 1 We've installed active directory on a new server and joined our database server and web servers to this new domain. However, randomly, we'll get the following error. What would be the cause of the handshake timeout error we're sometimes seeing? The fact that it's not ALWAYS happening to me means that the connection string information is probably correct (or close to it). Below is the connection string we're using and the error we are SOMETIMES seeing: Connection string: Data Source=<IP Address>;Initial Catalog=<DB Name>;Integrated Security=SSPI Stacktrace: System.Data.SqlClient.SqlException (0x80131904): Connection Timeout Expired. The timeout period elapsed while attempting to consume the pre-login handshake acknowledgement. This could be because the pre-login handshake failed or the server was unable to respond back in time. The duration spent while attempting to connect to this server was - [Pre-Login] initialization=15610; handshake=0; ---> System.ComponentModel.Win32Exception (0x80004005): The wait operation timed out at System.Data.SqlClient.SqlInternalConnection.OnError(SqlException exception, Boolean breakConnection, Action`1 wrapCloseInAction) at System.Data.SqlClient.TdsParser.ThrowExceptionAndWarning(TdsParserStateObject stateObj, Boolean callerHasConnectionLock, Boolean asyncClose) at System.Data.SqlClient.TdsParserStateObject.ReadSniError(TdsParserStateObject stateObj, UInt32 error) at System.Data.SqlClient.TdsParserStateObject.ReadSniSyncOverAsync() at System.Data.SqlClient.TdsParserStateObject.TryReadNetworkPacket() at System.Data.SqlClient.TdsParser.ConsumePreLoginHandshake(Boolean encrypt, Boolean trustServerCert, Boolean integratedSecurity, Boolean& marsCapable) at System.Data.SqlClient.TdsParser.Connect(ServerInfo serverInfo, SqlInternalConnectionTds connHandler, Boolean ignoreSniOpenTimeout, Int64 timerExpire, Boolean encrypt, Boolean trustServerCert, Boolean integratedSecurity, Boolean withFailover) at System.Data.SqlClient.SqlInternalConnectionTds.AttemptOneLogin(ServerInfo serverInfo, String newPassword, SecureString newSecurePassword, Boolean ignoreSniOpenTimeout, TimeoutTimer timeout, Boolean withFailover) at System.Data.SqlClient.SqlInternalConnectionTds.LoginNoFailover(ServerInfo serverInfo, String newPassword, SecureString newSecurePassword, Boolean redirectedUserInstance, SqlConnectionString connectionOptions, SqlCredential credential, TimeoutTimer timeout) at System.Data.SqlClient.SqlInternalConnectionTds.OpenLoginEnlist(TimeoutTimer timeout, SqlConnectionString connectionOptions, SqlCredential credential, String newPassword, SecureString newSecurePassword, Boolean redirectedUserInstance) at System.Data.SqlClient.SqlInternalConnectionTds..ctor(DbConnectionPoolIdentity identity, SqlConnectionString connectionOptions, SqlCredential credential, Object providerInfo, String newPassword, SecureString newSecurePassword, Boolean redirectedUserInstance, SqlConnectionString userConnectionOptions, SessionData reconnectSessionData) at System.Data.SqlClient.SqlConnectionFactory.CreateConnection(DbConnectionOptions options, DbConnectionPoolKey poolKey, Object poolGroupProviderInfo, DbConnectionPool pool, DbConnection owningConnection, DbConnectionOptions userOptions) active-directorysql-server Share Improve this question Follow edited Oct 9, 2014 at 14:53 Adam Levitt asked Oct 9, 2014 at 14:39 Adam LevittAdam Levitt 11111 silver badge44 bronze badges 2 What exactly is your question? There are a couple of different ones I could see as possibilities from your post. – squillman Commented Oct 9, 2014 at 14:48 I'm wondering what would be the cause of the handshake failure – Adam Levitt Commented Oct 9, 2014 at 14:53 Add a comment | 2 Answers 2 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 This is most likely a timeout due to some network issue. What the cause of the network issue is impossible to state given the information. It could be anything in between the client and the SQL Server instance. Client or server resource issues, problematic IP settings, errors with a NIC, network congestion or latency, etc. I know the errors are not reliably reproducable but if you can get a network trace when one of the exceptions happens it can help point you in the right direction and you can begin to narrow things down from there. Share Improve this answer Follow answered Oct 9, 2014 at 15:33 squillmansquillman 38.1k1212 gold badges9494 silver badges146146 bronze badges 2 Thanks for the assistance. What sort of technique would you recommend to do a network trace? – Adam Levitt Commented Oct 9, 2014 at 15:37 2 Packet capture / analyzer. If you don't have one or you can't get help from your network infrastructure team, Wireshark is the way to go. – squillman Commented Oct 9, 2014 at 15:40 Add a comment | 0 Step 1: netsh trace start capture=yes Step 2: Open in Microsoft Message Analyzer Step 3: Profit Share Improve this answer Follow answered Nov 4, 2017 at 13:26 spacenomyousspacenomyous 1,33988 silver badges1616 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged active-directorysql-server. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 175 Find name of Active Directory domain controller 258 How can I find out what Active Directory groups I'm a member of? 0 Can't Connect to (local) database 6 timeout during the post-login phase connecting to SQL Server 2012 2 .NET + Connection to SQL Server 2008 R2 6 SQL Server Connection Timeout after load brought onto IIS web server 1 Install SQL Server 2017 on Windows 10 Azure VM 0 "An existing connection was forcibly closed by the remote host" when trying to connect to azure sql server 0 SQL Server - Windows Active Directory users $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 634768, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions Do I need to replace my water-softener? Is the word κρίσεως well translated in the biblical versions presented? Movie where they're searching for the base of monsters. Have to sneak into Russia to find the cave and destroy it before these monsters spread When can I equip a secondary weapon? Are the literals "" and "\0" identical? how to decide algorithmically of whether an element in a GCD Domain is a square? How to understand the final sentence of Wittgenstein's Tractatus? Why is the PDF in Maxwell Distribution of Speeds simply NOT the derivative of the Boltzmann Distribution? Can I use a commercial appliance in my home? Are all Bernoulli measure preserving homeomorphisms of the Cantor space eventually tree automorphisms? Who discovered that vacuum tubes could be used for logic and computation? How do I get permission to use Marvel characters in my work? According only to Marx and Engels, how would a socialist (not communist) government or state work? How to get historical Schengen travel records Does human skin recover better in dry or humid environments? PTIJ: Prohibition of Centaur Meat Was the meaning of ... (ellipsis) for buttons and menus already defined in MS DOS? Unidirectional File Transfer (write only) Using Serial Adapter? How should introductory statistics material explain sample size estimation for means in the case 