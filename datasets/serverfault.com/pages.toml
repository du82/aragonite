title = "linux - iptables forward external ip and port to internal ip and port - Server Fault"
description = """
I need help urgent with direct examples, not with words.
As of being working with FreeBSD since version 4.2 I'm ok with pf(packet filter), but now I got a project to make a module for web panel for"""
full_description = '''iptables forward external ip and port to internal ip and port Ask Question Asked 7 years, 8 months ago Modified today Viewed 14k times 3 I need help urgent with direct examples, not with words. As of being working with FreeBSD since version 4.2 I'm ok with pf(packet filter), but now I got a project to make a module for web panel for OpenVZ in Linux. The admin part is 95% ready but I got stucked. I realized that every VM have to be forwarded to a different port. And the thing is that it have to be forwarded to a local IP. They have only 1 NIC and only 1 public IP, so they will use for every VM a local IP. Let's say: We create VM 101 with local IP 192.168.199.105 to listen for SSH on port 5050, and we have public IP 88.252.14.32. How to set IPTABLES to forward ssh requests from 88.252.14.32:5050 to 192.168.199.105:5050? The server is NATed and for Apache is easy with vhost, but for SSH - no idea how. I beg you for help with direct examples, not with words. Thank you. linuxiptablesportforwarding Share Improve this question Follow edited Jul 5, 2017 at 10:57 Alexander Tolkachev 4,65833 gold badges1717 silver badges2424 bronze badges asked Jul 4, 2017 at 22:24 dark_avengerdark_avenger 3111 gold badge11 silver badge22 bronze badges 2 1 To me it seems that you haven't even tried anything yourself. ServerFault is for people who have tried solutions, but haven't been able to find a working solution. – Tero Kilkanen Commented Jul 5, 2017 at 9:48 Welcome to Server Fault! Please read How do I ask a good question and try to rewrite your question so that it matches the site quidelines. Include the following: What have you tried? What did you expect to happen? What happened instead? What does your config look like? Do you have any log entries from the times it didn't work as expected? – Jenny D Commented Jul 5, 2017 at 10:59 Add a comment | 2 Answers 2 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 3 You could try to read this tutorial. It describes iptables well. For your question, you could use PREROUTING rules in nat table. It will looks like: iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 5050 -j DNAT --to-destination 192.168.199.105:5050 iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE You should change eth0 to your interface name. Share Improve this answer Follow answered Jul 5, 2017 at 10:02 Alexander TolkachevAlexander Tolkachev 4,65833 gold badges1717 silver badges2424 bronze badges 1 not working for me – Sunding Wei Commented Jul 21, 2023 at 3:19 Add a comment | 0 Wonderful : your solution works like a charm ! Thank you Alexander ! Share Improve this answer Follow answered 3 hours ago corbelrcorbelr 111 bronze badge New contributor corbelr is a new contributor to this site. Take care in asking for clarification, commenting, and answering. Check out our Code of Conduct. Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged linuxiptablesportforwarding. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 151 How can I port forward with iptables? 323 Check if port is open or closed on a Linux server? 3 Forwarding MySQL connection with iptables and differents network interfaces 1 Iptables port forwarding - what am I doing wrong? 3 iptables FORWARD port to internal server 1 Linux routing - Access external IP from LAN 0 iptables forward port range through OpenVPN 3 IPTables, route specific port through VPN 2 Is it possible with IPTABLES to ACCEPT a service by NAME like ssh or only by PORT? $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEv