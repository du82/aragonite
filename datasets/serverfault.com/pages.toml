ctual fix happened about a year later when I had the opportunity to take down the system completely - I deleted the array and set it up from scratch as RAID6 with the new disk included. raidmegaraidraid6storcli Share Improve this question Follow edited 8 hours ago Jarmund asked Jul 4, 2020 at 17:26 JarmundJarmund 54422 gold badges66 silver badges1919 bronze badges Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 1 +50 If my old knowledge of working with storcli serves me well, this should do the trick. However you’re running these commands at your risk... after all it’s your array... I’d recommend taking any answer on here and studying it against man pages etc and make sure you’re 100% storcli /c0/e0/s13 insert dg=2 array=0 row=11 Then do storcli /c0/e0/s13 start rebuild Share Improve this answer Follow answered Jul 6, 2020 at 23:09 Timothy FrewTimothy Frew 60244 silver badges77 bronze badges 9 After checking, reading, and verifying against a machine of identical disk setup I was more than happy to try the command, but for some reason storecli gives me There is no drive missing in DG 2 Array 0 Row 11 . From what I can see, the numbers are correct, and googling "There is no drive" gives me no results. Any tips? – Jarmund Commented Jul 7, 2020 at 11:13 Try changing row=11 to row=0 – Timothy Frew Commented Jul 7, 2020 at 11:15 Same result. 'no drive missing' – Jarmund Commented Jul 7, 2020 at 11:18 I am beginning to think that perhaps the array was not set up to include all disks to begin with. I just stumbled across a guide for adding a missing disks, and there the array topology lists a disk as actually missing. Could it be that the RAID needs to be extended first? – Jarmund Commented Jul 7, 2020 at 11:30 In my particular case, there were other things at play. Once I had them sorted out, the above worked just fine – Jarmund Commented Jul 8, 2020 at 23:18 | Show 4 more comments You 