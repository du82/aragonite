["https://serverfault.com/questions/557520/fail2ban-log-filled-with-entries-saying-fail2ban-filter-warning-determined-ip"]
title = 'linux - Fail2ban log filled with entries saying "fail2ban.filter : WARNING Determined IP using DNS Lookup:.." - Server Fault'
description = """
My fail2ban log at /var/log/fail2ban.log is completely filled with entries saying:

fail2ban.filter : WARNING Determined IP using DNS Lookup: [IP address]\r
I think this may have begun after I chang..."""
full_description = '''Fail2ban log filled with entries saying "fail2ban.filter : WARNING Determined IP using DNS Lookup:.." Ask Question Asked 11 years, 3 months ago Modified today Viewed 16k times 13 My fail2ban log at /var/log/fail2ban.log is completely filled with entries saying: fail2ban.filter : WARNING Determined IP using DNS Lookup: [IP address] I think this may have begun after I changed my ssh port... Any idea what the cause of this is and how to stop it? linuxubuntulog-filesfail2banip-blocking Share Improve this question Follow asked Nov 26, 2013 at 13:20 Dirk CallowayDirk Calloway 26211 gold badge33 silver badges99 bronze badges Add a comment | 4 Answers 4 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 10 Had the same issue. Simple solution: add the following line at the top of your /etc/fail2ban/jail.conf file, in the [DEFAULT] section usedns = no To understand why your log file is being filled with warnings, consult the following page in the Fail2Ban wiki. It's basically to prevent people manipulating PTR record of their attack IPs to inject false values in your logs. Share Improve this answer Follow edited Mar 1, 2017 at 16:38 k0nsl 4544 bronze badges answered Mar 24, 2014 at 19:32 quxqux 37122 silver badges77 bronze badges 3 1 Won't this open the possibility for attack if users make login attempts for hostname origins (since hostnames will just be ignored in this case)? Perhaps I've read the docs wrong, but it seems this could be a bad idea. – Quinn Comendant Commented Jul 27, 2015 at 18:45 3 Also, the documentation says, The solution is to set all services not to do reverse DNS lookups and instead to log IP addresses only. The warning given by fail2ban (Determined IP using DNS Lookup) indicates that some service is logging hostnames. The best solution is to determine which service that is, and disable DNS lookups for it. Setting usedns = no stops the warnings and will prevent blocking of spoofed PTR networks, but leaves the service that is logging hostnames completely unprotected by fail2ban. – Quinn Comendant Commented Jul 28, 2015 at 17:05 I have fail2ban configured to work with home assistant. I changed the failregex of the filter to the following and the problem went away: ^%(__prefix_line)s.*\[homeassistant.components.http.ban\] Login attempt or request with invalid authentication from.* \(<HOST>\).*$ – Jerther Commented Dec 4, 2024 at 1:14 Add a comment | 2 Check the PTR record of the [IP address] and compare the resolved name with the original IP address, i.e. drill -x ip_address or dig -x ip_address or host ip_address Then compare the result with: drill result or dig result or host result It should be the same. If it is not - the attacker changed the PTR. You may modify usedns directive to "no" or "warn" in jail.conf. Share Improve this answer Follow edited Mar 1, 2017 at 19:06 chicks 3,8991010 gold badges2929 silver badges3737 bronze badges answered Mar 24, 2014 at 19:48 plluksieplluksie 47833 silver badges1010 bronze badges Add a comment | 0 In my case the warning was: WARNING Determined IP using DNS Lookup: localhost = ['127.0.0.1', '127.0.0.1', '::1'] This appeared every 10s. Setting usedns=no was no option as I wanted to get the root cause - after all somewhere in my logs this "localhost" appeared. After trying a bunch of logs I took the "brute force" way: find /var/log -type f -name '*.log' | xargs grep localhost -l which gave me all the log files containing that "localhost" (which were only two, one of them the fail2ban.log itself). It turned out that the "mysql/error.log" was the one. I dropped a database without stopping the service (omg...) which lead to (every 10s): 2021-01-20T05:31:17.784116Z 2680 [Note] Access denied for user 'myserviceaccount'@'localhost' (using password: YES). In the end - no need to stop the warnings (just stop the service ;-) ). Share Improve this answer Follow answered Jan 20, 2021 at 6:28 GerdGerd 10111 bronze badge Add a comment | 0 Check that your filter regular expression don't match you own host, for example, in log: your-host.com:443 123.22.33.44 - - [01/Mar/2025:00:00:00 +0000] "GET /your-endpoint HTTP/1.1" 200 78413 "-" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.2020.127 Safari/537.36" the <HOST> in RegExp ^.*<HOST>.*$ matches to your-host.com instead of 123.22.33.44 as you expect. Share Improve this answer Follow answered 6 hours ago GHosTGHosT 10111 bronze badge New contributor GHosT is a new contributor to this site. Take care in asking for clarification, commenting, and answering. Check out our Code of Conduct. Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged linuxubuntulog-filesfail2banip-blocking. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 7 Fail2Ban is not adding iptables rules 0 How do I block an abusive IP address using a Netgear FVS338 firewall? 3 fail2ban apache-badbots not blocking IP 6 fail2ban doesn't add IPs to ipset (firewalld) 0 Fail2Ban not working on http-get-dos filter 0 fail2ban not banning "matched" IPs from vsftp log 1 fail2ban doesnt work (Ubuntu/SSH) 0 Trying to understand if fail2ban is working on Debian 10 VPS $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 557520, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions How should I handle a revision that