full_description = '''What does the token counts represent in the metrics' tab in Azure OpenAI? Ask Question Asked today Modified today Viewed 26 times 0 What does the token counts represent in the metrics' tab in Azure OpenAI? I understand what a token is, and that a token count counts how many tokens the LLM received (input tokens) and emitted (output tokens), but I don't understand what the value in the plot means. E.g., is it the number of tokens used within one minute? azuremonitoring Share Improve this question Follow asked 4 hours ago Franck DernoncourtFranck Dernoncourt 1,30233 gold badges1616 silver badges3939 bronze badges Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 Each point on the plot represents the number of tokens used within 30 minutes (since on the screenshot, there's a point every 30 minutes, and the sum of the value of each point approximately matches the counts mentioned before the plot). Share Improve this answer Follow answered 3 hours ago Franck DernoncourtFranck Dernoncourt 1,30233 gold badges1616 silver badges3939 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged azuremonitoring. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 8 Graphite shows "None" for all data points even though I send it data 1 MS Azure Linux Diagnostic Extension 3.0 does not post metrics to Azure 4 OAUTH / OIDC - Client auth using a signed JWT instead of a secret 4 Investigate potential breach in Azure App Service 0 "Tags" blade during Azure Notificaiton Hubs setup 0 Azure EventHub - Create 1 Service Principal per writer [OR] multiple certificates (1 per writer) over 1 