full_description = '''Full Implications of SMB mount option "noserverino"? Ask Question Asked 2 years ago Modified today Viewed 6k times 11 Working with Ubuntu-based systems. Having run into a samba mount giving a stale file handle, the advice around the net seems to be adding noserverino as an option for the mount. Reading the documentation, it states: You can also use "noserverino" mount option to generate inode numbers smaller than 2 power 32 on the client. But you may not be able to detect hardlinks properly. This doesn't really say much, for me. I don't see what issues could arise from this. What negative consequences could there be for not knowing certain files are the same hardlink, unless you have a system going where you manually change files a bunch of times? As for the "generate inode numbers smaller than 2 power 32 on the client" part... am I to assume that any numbers above this will still be generated on the server and properly communicated to the client? Considering this is a non-default option and it's summary is so small, I'm a bit worried about unknown implications and/or behavior if you use this. Can anyone elaborate on this? Or give some certainty that this won't break after a year? Or with a filesystem with too many files? linuxsamba Share Improve this question Follow asked Feb 3, 2023 at 11:27 KoenDGKoenDG 18722 silver badges99 bronze badges Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 From something like this (which has this advice) https://forums.unraid.net/topic/103945-psahow-to-proper-fix-for-smb-stale-file-handle/ it sounds like it changes from server side inode handling to client side. As this question is over a year old, I'll assume you tried it, and it was OK! Share Improve this answer Follow answered Jan 9 at 3:57 Arthur S.Arthur S. 14344 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? B