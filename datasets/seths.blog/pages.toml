["https://seths.blog/2025/02/your-project-is-important"]
title = "Your project is important | Seth's Blog"
description = "But that’s not why it’s your project. Lots of things are important. Countless problems need to be solved, people need to be connected, a living needs to be made. But this work you&#8217…"
full_description = "Lots of things are important. Countless problems need to be solved, people need to be connected, a living needs to be made. But this work you’re doing now, the work you’re doing instead of everything else–it’s your project. When we talk about whether this is the project for you, we’re not demeaning its importance or questioning whether it needs to be done. Instead, we’re discussing whether you’re the one to do it, whether it serves your particular needs and skills and assets. Priorities must be set, no matter how important each option might be. We choose a project because our assessment of the situation leads us to believe our effort might pay off. Talking about our priorities with clarity celebrates our potential, it doesn’t diminish the urgency of what you were doing yesterday."
