["https://seths.blog/about"]
title = "About Seth Godin | Seth's Blog"
description = "I have a blog. It comes out every day, and I’m approaching 10,000 posts. And I have a page listing all my books And there’s a page of most of my bio. Here are some highlights Coordinato…"
full_description = "The Song of Significance, about doing work that matters and creating the conditions for others to do so as well. I was the founder of Akimbo, home of the altMBA. These were spun out as an independent B corp and the leaders of these projects have sunsetted them as of 2024. For more than thirty years, I’ve been trying to turn on lights, inspire people and teach them how to level up. This blog has been appearing daily for more than a decade. One day, if we meet, I hope you’ll share with me your favorite posts. Even better, I’d like to hear about how a book or course helped you interact with the world differently and make a difference. I’ve spent most of my professional life as a writer. I’ve published 20 bestselling books. Translated into nearly 40 languages. These books are a great way to go deep into a concept, and I think many of them stand the test of time. Along the way, I’ve found countless detours, interesting projects designed to inspire and entertain you as you continue to do your work. My latest book is THE SONG OF SIGNIFICANCE. The one before that is THE PRACTICE. And the one before that is THIS IS MARKETING, all three were bestsellers. I am the founding editor of the all-volunteer CARBON ALMANAC. It’s the most important project of my career. Check out Your Turn. It’s illustrated and shareable and provocative. I designed it and self-published it, and I hope you’ll invest a few minutes to see what you’ve been missing. In 2015, I created the altMBA. It’s a life-changing 30-day workshop and it’s entirely possible it will change your life. It’s now part of Akimbo, which is now an independently owned entity, a B corp, creating new ways to learn. More than 60,000 people have taken my online courses, including The Marketing Seminar and several on Udemy. I’m in the Guerrilla Marketing Hall of Fame, the Direct Marketing Hall of Fame and, just recently, the plain old no-modifier Marketing Hall of Fame. Which is pretty cool. You can read my free ebooks on the placebo effect and education. And there are five TED talks. I pioneered ethical online direct marketing, now a $30bn a year industry."
year_published = 2018
year_updated = 2024
