["https://seths.blog/2025/02/at-the-speed-of-judgment"]
title = "At the speed of judgment | Seth's Blog"
description = "Getting to the conference in Santa Fe isn’t difficult. Someone will drive/fly you there. The hard part is deciding to go. And yet, it might take 8 hours to arrive. If they invented teleportat…"
full_description = "Getting to the conference in Santa Fe isn’t difficult. Someone will drive/fly you there. The hard part is deciding to go. And yet, it might take 8 hours to arrive. If they invented teleportation and offered it for free, it would be very clear that where we went would simply depend on where we decided to go, not the mechanics, cost or time it took. Beyond that… with an app like cursor, if you want to write computer code, you can. The hard part is deciding what to build. We’re often afraid to lead. Afraid of the responsibility. Indoctrinated to let someone else take the wheel and to take the blame."
