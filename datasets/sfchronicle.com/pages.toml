["https://sfchronicle.com/ai_use"]
title = "Our Use of AI"
full_description = "Our Use of AIAt HNP, we believe in innovation and experimentation in all forms. Therefore, we’ve begun experimenting with Generative AI (ChatGPT, etc) to enhance our journalism and reporting efforts. Generative AI is not a journalist, but it can facilitate and accelerate the work of journalism by pulling together information, production duties and the distribution of our work. Beginning now, we will, at times, use Generative AI in our work to: • Assist with functions involved in the assembling of content before it is published, such as SEO, keywords and briefs. However, no content from our newsrooms will be published without an editor’s review. • Be an initial review of content for grammatical and/or style editing. A final review by an editor will happen before content goes live. • Assist with creating multiple versions and/or alternate versions (summaries, briefs, etc) of our content for different platforms. None of these versions would go live on any platform without an editor’s review. • Provide research, information and/or data related to or to assist in reporting. All content will still be fact-checked and reviewed by reporters and editors before being published live. • Be a filter for our content and our archives and surface answers, results and/or recommendations that come from content previously published on the site. From time to time, we may publish content from outside of our newsrooms that provides information or data generated using AI tools. For example, shopping information or sports scoring. When this is deployed, it will be clearly marked on the page. If you have any questions about any of our content, please reach out via our contact us page."
