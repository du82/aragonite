["https://sfconservancy.org/copyleft-compliance/past-lawsuits.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = '''Pursuant to our Principles of Community-Oriented GPL enforcement, Software Freedom Conservancy sees litigation as an last resort when other methods to achieve copyleft compliance fail. Below, we discuss the outcome of past compliance lawsuits where Conservancy played a role. On 14 December 2009, Software Freedom Conservancy filed a federal copyright lawsuit against 14 defendants, including Best Buy, Samsung, Westinghouse, and JVC. The docket of that lawsuit is available (on archive.org) and the original complaint is on our website. Conservancy settled with each defendant at different times, and the dismissals can be seen in the docket. Generally speaking, and pursuant to our Principles of Community-Oriented GPL enforcement, Conservancy never settles a lawsuit unless we believe that full compliance has been achieved (or will be achieved imminently) with the terms of all copyleft licenses on all software included in the devices at issue in any lawsuit that we've filed. One oft-stated confusion about this litigation was that we sued Best Buy for sales of third-party devices in their stores. That is not accurate. Best Buy had a house-brand DVD player under the “Insignia” “house brand” that they produced as their own product. Conservancy partially funded and assisted in coordination of Christoph Hellwig's lawsuit against VMware in Germany. That case concluded in 2019. You can view the relevant announcements and analysis that Conservancy has published about the case below, starting with the announcement regarding the conclusion of the case: This SFC-funded user rights lawsuit was filed by Sebastian Steck in Berlin in 2023 and received a positive final decision from the court in June 2024 with AVM providing "the scripts used to control ... installation of the executable" for the LGPLv2.1 works in the AVM router that Steck purchased. More details are available in our press release and informational page, which provides the source code that was received from AVM allowing users to modify and reinstall copylefted works into the router's flash memory:'''
