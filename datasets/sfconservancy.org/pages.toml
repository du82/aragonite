["https://sfconservancy.org"]
title = "Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Software Freedom Conservancy is a nonprofit organization centered around ethical technology. Our mission is to ensure the right to repair, improve and reinstall software. We promote and defend these rights through fostering free and open source software (FOSS) projects, driving initiatives that actively make technology more inclusive, and advancing policy strategies that defend FOSS (such as copyleft). Learn more. SFC funded lawsuit wins rights in Germany! Users of AVM routers in Germany are now able to take advantage of the LGPL software on their routers to allow them to reinstall and reconfigure their FRITZ!Box routers. To read more about the case and why this software right-to-repair is important. SFC filed an amicus brief in the ongoing case of Neo4j, Inc. v. PureThink, LLC, which is now appealed to the United States Court of Appeals for the Ninth Circuit. The appeal focuses on a downstream licensee's right under the Affero General Public License, version 3 (and similar rights under GPLv3 and LGPLv3) to remove “Further Restrictions” — even when such restrictions are put in place by original licensors. SFC was proud to stand up for this important right under copyleft, and appears to be the only organization that filed an amicus brief in this case. “Amicus curiae” literally means “friend of the court” and is what you call someone who isn’t a party to the case but,because of their strong interest or expertise in the subject matter of the case, has information or argument that the court would find useful in reaching a decision. This page, and all contents herein, unless a license is otherwise specified, are licensed under a Creative Commons Attribution-ShareAlike 4.0 International License."
