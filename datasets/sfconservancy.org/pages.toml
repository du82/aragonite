["https://sfconservancy.org/about/board"]
title = "Directors - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Like many non-profits, Conservancy is directed by a self-perpetuating Board of Directors, who appoint the Executive Director and staff to carry out the day-to-day operations of the organization. The Directorship of the Conservancy includes both talented non-profit managers and experienced FLOSS project leaders who can both guide the administrative operations of the organization as well as mentor member project leaders as needed. Our Directors constantly search for additional directors who can contribute a variety of expertise and perspective related to the Conservancy's mission. Jeremy Allison is one of the lead developers on the Samba Team, a group of programmers developing an Open Source Windows compatible file and print server product for UNIX systems. Developed over the Internet in a distributed manner similar to the Linux system, Samba is used by all Linux distributions as well as many thousands of corporations and products worldwide. Jeremy handles the co-ordination of Samba development efforts and acts as a corporate liaison to companies using the Samba code commercially. Dr. Laura Fortunato is a professor of evolutionary anthropology at the University of Oxford, where she researches the evolution of human social and cultural behavior, working at the interface of anthropology and biology. An advocate of reproducible computational methods in research, including the use of Free/Open-Source tools, she founded the Reproducible Research Oxford project, with the aim to foster a culture of reproducibility and open research at Oxford. Laura holds a degree in Biological Sciences from the University of Padova and masters and PhD in Anthropology from University College London. Before joining Oxford she was an Omidyar fellow at the Santa Fe Institute, where she is currently an External Professor and a member of the Science Steering Committee. She is also a member of the steering group of the UK Reproducibility Network, a peer-led consortium that aims to promote robust research practice in the UK."
