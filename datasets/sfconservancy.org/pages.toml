["https://sfconservancy.org/about/outside"]
title = "Outside Counsel, et alia - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Olivier Hugot is a member of the New York (2003) and Paris (2004) Bars. He advises and represents French and foreign companies in the areas of Internet, luxury and creation. He assists many innovative Internet entrepreneurs and companies, both in formalizing their projects as well as in development during fundraising. He advises clients in connection with the protection and exploitation of their rights in compliance with the constantly evolving internet regulations. Olivier has extensive experience in the practical and legal problems of the internet, both with counseling and litigation. He has also developed a particular expertise in the legal aspects of free culture. Olivier has presented his work at a number of conferences, particularly pertaining to free licenses (GNU/GPL, Creative Commons) as well at Wikimania 2008, the annual international conference of the Wikimedia Foundation. Olivier is also a masters instructor at the University of Paris I La Sorbonne and a member of the associations INTA and IAEL. Directors Emeriti of the Software Freedom Conservancy are former members of Conservancy's Board of Directors who continue to support Conservancy's mission and occasionally advise Conservancy. Peter Brown has worked in non-profit management and finance for more than twenty years. He served as the Executive Director of the Free Software Foundation from 2005 until 2011, and previously as its Financial Controller and GPL Compliance Lab Manager. Peter has also been a Director of New Internationalist Publications Cooperative, and worked in London for BBC Network Radio. Loïc Dachary has been involved with the Free Software Movement since 1987, when he started distributing GNU tapes to the general public in France. In 2012, he founded Upstream University, a nonprofit with the goal of teaching developers how to contribute easily and efficiently. Dachary volunteers as a developer for April, a grassroots organization promoting Free Software. He maintains April's OpenStack cluster and organizes contributions with agile methods. As President of FSF France, he also provides technical and legal resources to French Free Software developers. His day job is to use and contribute to Ceph within OpenStack."
