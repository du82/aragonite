["https://sfconservancy.org/copyleft-compliance/help.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Folks often ask us how they can help us defend the software freedoms and rights that copyleft makes possible. There are lots of ways to help and we believe that the entire public can help. All versions of the GPL and LGPL allow companies to make an offer for Complete, Corresponding Source (CCS) rather than giving you the CCS outright with the product. Sadly, many companies make an offer with no intention of actually providing that CCS to you. As consumers, you have a right to that source code. Look in every manual and “Legal Notices” section of every product you buy. If you see an offer, follow the instructions and request that CCS! If you don't get it, or they give you the run-around, then report the violation to us! If you are aware of a license violation or compliance issue regarding any copyleft license, such as the AGPL, GPL or LGPL, please contact us by email at <compliance@sfconservancy.org>. If you think you've found a GPL violation, we encourage you to read this personal blog post by our Policy Fellow, Bradley M. Kuhn, about good practices in discovering and reporting GPL violations. Finally, Conservancy welcomes donations in support of our copyleft compliance work, and we encourage you to become a an official Sustainer of Software Freedom Conservancy. To support our copyleft compliance & enforcement work, please become a Conservancy Sustainer right now. We can't sustain this work without ongoing support from donors like you! This page, and all contents herein, unless a license is otherwise specified, are licensed under a Creative Commons Attribution-ShareAlike 4.0 International License."
year_published = 2025
