["https://sfconservancy.org/copyleft-compliance/glossary.html"]
title = "Glossary of terms - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = 'Here are a list of terms you might be unfamiliar with but occur frequently in our work. If you have any suggestions on things we can add here, please reach out to info@sfconservancy.org “Amicus curiae” literally means “friend of the court” and is what you call someone who isn’t a party to the case but,because of their strong interest or expertise in the subject matter of the case, has information or argument that the court would find useful in reaching a decision. Ability to inspect the exact software running on a device. This includes version information, modifications and licensing information. In the context of a lawsuit, the Complaint is the document that begins the lawsuit. It states the basic claims of action by the Plaintiff, and their requests for remedy for the matter. Informally, CCS is all of the technical materials and source code required to modify, run, and/or reinstall the software. The GPL and LGPL have a formal definitions for CCS, which is sometimes called "Corresponding Source." A kind of software licensing that leverages the restrictions of copyright, but with the intent to promote sharing (using copyright licensing to freely use and repair software). Software programs are copylefted when they utilize software with a copyleft license. These copyleft licenses are unique in that they seek to put large corporations, small companies, consumers, and hobbyists all on equal footing. The intention is for this to be achieved by granting everyone the exact same rights, permissions, and privileges to modify, improve, and/or include the software in their products. When companies utilize copylefted software, they thereby agree to the terms associated with its use. By utilizing copylefted software when designing products, companies agreed to these terms, and so have both contractual and copyright obligations to take certain actions to ensure others have the same rights they did with regard to the software. When rights are respected, the sharing of software under copyleft licensing is a mutually beneficial approach, but many companies are not holding up their side of the bargain. A company is in compliance when it ensures that all of its customers have the same rights, permission, and ability that it has to improve that software and install their improvements onto a device. The best way a company can demonstrate its intent to be in full compliance is by creating a vibrant third-party marketplace for improved software.'
year_published = 2025
