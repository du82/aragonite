["https://sfconservancy.org/blog/2025/jan/15/cory-doctorow-video-interview"]
title = "Karen Sandler interviews Cory Doctorow - Conservancy Blog - Software Freedom Conservancy"
description = "Our Executive Director Karen Sandler recently sat down with Cory Doctorow to talk about software right to repair, the utility and history of DMCA exemptions, and some of the differences between the way laws take effect in different places around the world. Doctorow is widely known for his speculative fiction touching on issues of technology, activism, and post-scarcity economics. We were so excited for this conversation, many on SFC staff are fans and had a great time preparing for the conversation."
full_description = "Our Executive Director Karen Sandler recently sat down with Cory Doctorow to talk about software right to repair, the utility and history of DMCA exemptions, and some of the differences between the way laws take effect in different places around the world. Doctorow is widely known for his speculative fiction touching on issues of technology, activism, and post-scarcity economics. We were so excited for this conversation, many on SFC staff are fans and had a great time preparing for the conversation. Covering a range of topics, it was great to hear from Cory about how proprietary platforms can actually lead to conversations with loved ones about interoperability. Of particular note was a discussion about the similarities to the accessibility rights movement. Interoperability and accessibility are fundamental rights that technology should empower us to have, but often times we need to advocate and fight for those rights. With a good appreciation of history combined with a forward looking eye Doctorow's unique perspective sheds light on how the free software movement can be more open to availing itself to the wider public. We look forward to a future where more people are brought into the conversations and issues that today's technology forces us to reckon with. Karen talked about the potential of software freedom and in particular the opportunities inherent in all copyleft licenses to completely change the way ordinary people experience technology that impacts them. She talked about the concrete and incremental work Software Freedom Conservancy does to move the needle towards ethical technology. Thanks to Cory for sitting down with Karen and having a great conversation that we hope inspires you as much as us to look to the future with eagerness and energy for change! PS: Today is the last day of our fundraiser, so if you like content like this, please donate now to support us in making things like this happen! This page, and all contents herein, unless a license is otherwise specified, are licensed under a Creative Commons Attribution-ShareAlike 4.0 International License."
