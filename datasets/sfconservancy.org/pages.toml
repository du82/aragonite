["https://sfconservancy.org/about/eval-committee"]
title = "Evaluation Committee - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "The Evaluation Committee evaluates projects that have applied to become members of Conservancy. Conservancy's Board of Directors formally charters and authorizes this Committee to offer membership to projects that apply for membership in Conservancy. Jeremy Allison is one of the lead developers on the Samba Team, a group of programmers developing an Open Source Windows compatible file and print server product for UNIX systems. Developed over the Internet in a distributed manner similar to the Linux system, Samba is used by all Linux distributions as well as many thousands of corporations and products worldwide. Jeremy handles the co-ordination of Samba development efforts and acts as a corporate liaison to companies using the Samba code commercially. Tom Callaway has been working for Red Hat since 2001. He started in Sales Engineering and has been the Fedora Engineering Manager since 2008. He served three consecutive elected terms on the Fedora Board from 2007 to 2011. Tom also maintains or co-maintains a large number of Packages in Fedora (currently 390) and is leading the Fedora Packaging Committee, responsible for RPM Packaging Standards and Practices. Additionally, he is responsible for managing Fedora's Legal issues. Tom frequently represents Fedora and Free Software at conferences around the world, and tries his best not to make too big of a fool of himself. Mark Galassi has been involved in the GNU project since 1984. He currently works as a researcher in the International, Space, and Response division at Los Alamos National Laboratory, where he has worked on the HETE-2 satellite, ISIS/Genie, the Raptor telescope, the Swift satellite, and the muon tomography project. In 1997 Mark took a couple of years off from Los Alamos (where he was previously in the ISR division and the Theoretical Astrophysics group) to work for Cygnus (now a part of Red Hat) writing software and books for eCos, although he continued working on the HETE-2 satellite (an astrophysical Gamma Ray Burst mission) part time. Mark earned his BA in Physics at Reed College and a PhD from the Institute for Theoretical Physics at Stony Brook."
