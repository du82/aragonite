["https://sfconservancy.org/news/2012/may/29/compliance"]
title = "Conservancy Projects Launch Coordinated Free Software Compliance Efforts - Software Freedom Conservancy"
description = """
Software Freedom Conservancy, a 501(c)(3) charitable non-profit
that provides a home and
a broad range of
services to Free Software projects, announced today a unified effort
among many of its member projects to ensure compliance with their Free
Software licenses.  The effort brings together copyright holders,
developers, and users of a variety of Conservancy's projects — old
and new — to ensure that the rights embodied in Free Software
licenses are fully upheld for all developers, users, and the general
public."""
full_description = "Software Freedom Conservancy, a 501(c)(3) charitable non-profit that provides a home and a broad range of services to Free Software projects, announced today a unified effort among many of its member projects to ensure compliance with their Free Software licenses. The effort brings together copyright holders, developers, and users of a variety of Conservancy's projects — old and new — to ensure that the rights embodied in Free Software licenses are fully upheld for all developers, users, and the general public. Conservancy is well-known for its ongoing license compliance efforts on behalf of its BusyBox member project. Today, more Conservancy projects and initiatives join BusyBox in its desire to ensure compliance with Free Software licenses. Firstly, Conservancy's Samba member project announces today its intention to engage in compliance efforts with Conservancy. Samba has been ensuring compliance with Samba's license, the GPL, since the 1990s. Historically, that work has been led by Samba Team member, Simo Sorce, who does a fantastic job, said Jeremy Allison, co-creator of Samba and Conservancy Director. Samba is delighted to help Simo by appointing Conservancy officially in charge of these efforts, and to gain the benefit of Conservancy's wealth of knowledge and expertise in achieving license compliance in a friendly and collaborative way. Secondly, joining Samba and BusyBox in these efforts is a new Conservancy project called the GPL Compliance Project for Linux Developers. This new project is comprised of copyright holders in the Linux kernel who have contributed to Linux under its license, the GPLv2. These seven copyright holders have formally asked Conservancy to engage in compliance efforts for their copyrights in the Linux kernel. Matthew Garrett, an accomplished Linux kernel developer, was the first to put forward his copyrights as part of the GPL Compliance Project for Linux Developers, and was quickly joined by six other individuals. In a statement today, Matthew noted: For some time, many Linux kernel copyright holders have offered our moral support to the BusyBox enforcement efforts through Conservancy, but didn't have the ability to formalize that support. I'm glad to put my copyrights forward for this new initiative, and welcome any Linux kernel copyright holders who wish to join us to reach out to Conservancy via <compliance@sfconservancy.org>."
