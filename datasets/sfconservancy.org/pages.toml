["https://sfconservancy.org/copyleft-compliance/principles.html"]
title = "Principles of Community-Oriented GPL Enforcement - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "The GNU General Public License (GPL) is the principal copyleft license. Copyleft is a framework that permits ongoing sharing of a published work, with clear permissions that both grant and defend its users' freedoms — in contrast to other free licenses that grant freedom but don't defend it. Free software released under the GPL is fundamental to modern technology, powering everything from laptops and desktops to household appliances, cars, and mobile phones, to the foundations of the Internet. Following the GPL's terms is easy — it gets more complicated only when products distributed with GPL'd software also include software distributed under terms that restrict users. Even in these situations, many companies comply properly, but some companies also try to bend or even break the GPL's rules to their perceived advantage. As stalwarts of the community's freedom, we act as a proxy for users when companies impede the rights to copy, share, modify, and/or redistribute copylefted software. We require all redistributors to follow the GPL's requirements in order to protect all the users' freedom, and secondarily to support businesses that respect freedom while discouraging and penalizing bad actors. Copyleft is based on copyright; it uses the power of copyright to defend users' freedom to modify and redistribute rather than to hinder modification and redistribution. A traditional copyright license is violated by giving the work to others without permission; a copyleft license is violated by imposing restrictions to prevent further redistribution by others. Nevertheless, with their basis in copyright law, copyleft licenses are enforced through the same mechanisms — using the same vocabulary and processes — as other copyright licenses. We must take care, in copyleft enforcement, to focus on the ultimate freedom-spreading purpose of copyleft, and not fall into an overzealous or punitive approach, or into legitimizing inherently unjust aspects of the copyright regime. Therefore Conservancy does enforcement according to community-oriented principles originally formulated by other community leaders in 2001."
year_published = 2025
clearnet = "https://sfconservancy.org/copyleft-compliance/principles.html"
