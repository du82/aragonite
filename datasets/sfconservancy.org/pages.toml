["https://sfconservancy.org/blog/2025/jan/06/embroidery-and-resilient-software-freedom-in-2025"]
title = "Embroidery and resilient software freedom in 2025 - Conservancy Blog - Software Freedom Conservancy"
description = "I spent most of 2024 recovering from a spine injury after a car accident. I’d love to share my new insight into free software accessibility, and how both free software and embroidery helped me build resiliency. I’ve been working on a special embroidery that I’ll send to a donor who gives to Software Freedom Conservancy on January 8. We hope if you are able to give you’ll consider donating!"
full_description = "I spent most of 2024 recovering from a spine injury after a car accident. I’d love to share my new insight into free software accessibility, and how both free software and embroidery helped me build resiliency. I’ve been working on a special embroidery that I’ll send to a donor who gives to Software Freedom Conservancy on January 8. We hope if you are able to give you’ll consider donating! Please join me on January 8 for a Q&A session with the SFC staff and contractors who run the Outreachy internship program. After the Outreachy organizer Q&A, join me for a crafting session while I work on the SFC logo embroidery. There will be two Q&A sessions with the Outreachy team to accommodate time zones. You can join us on BigBlueButton at the times below (information is also in the attached .ics files): I had pain and tingling in my fingers for 6 months. Everything I touched felt like picking up a cactcus. This chronic pain made it hard to do my normal work tasks as Software Freedom Conservancy’s Senior Director of Diversity and Inclusion, and an organizer for Outreachy internships. Most free software communication happens via email or text chat. Which meant a whole lot of very painful typing for me. Luckily, free and open source software helped me find a more accessible way to work. I dreaded looking for accessibility software because I knew it’s usually both expensive and proprietary. I was so excited to find speech to text free software like vosk for the Linux desktop. For my phone, I found sayboard, a speech to text Android keyboard that uses vosk. Free software allowed me to switch away from using my hands to write, and towards using my voice to write. I wrote this email using those tools. I am so grateful to the free software developers who helped me avoid hand and shoulder pain. My injury also gave me a new perspective on the gaps in software accessibility best practices. Very few free software projects offer options to accommodate people who have pain whenever they touch a screen, use a keyboard, or click a mouse button."
year_published = 2025
year_updated = 2025
