["https://sfconservancy.org/blog/2024/dec/23/kuleana-and-software-freedom-for-the-future"]
title = "Kuleana and software freedom for the future - Conservancy Blog - Software Freedom Conservancy"
description = "During the holiday season I really want to share with you some thoughts on why software freedom is so important to me. Please donate during our fundraiser (and have you donation doubled from our matchers!). Also please see the note at the bottom about 2 Q&A sessions we’ll be having on December 27th and 30th!"
full_description = "During the holiday season I really want to share with you some thoughts on why software freedom is so important to me. Please donate during our fundraiser (and have you donation doubled from our matchers!). Also please see the note at the bottom about 2 Q&A sessions we’ll be having on December 27th and 30th! My name is Pono, a name my native Hawaiian grandmother gave me. In Hawaiian we have a word: kuleana. A duty to take care of the land and the people around you given your own gifts and abilities. It’s been an important concept to me to guide me and share my passions and desires for a better world with the community around me. I came to Software Freedom Conservancy first as a Sustainer and activist, and then years later an employee. Software Freedom is an interesting area to think about place, because the digital world sometimes feels like an astral plane, so distant from our everyday lives. But the reality is that we can inhabit the physical world and digital world at the same time. Whether it’s liberating farming equipment so that we can repair the software on tools vital for food production or making sure that the internet connected devices in our homes are not spying on us, our stewardship for the Earth and for the digital spaces we occupy are not distinct but intertwined. My wife and I are expecting our first child soon. We’re so excited for the future and how the three of us will grow and experience the world together. And while software freedom certainly wasn’t the first thing on our minds in this situation, we’ve already encountered baby gear that is internet connected and has moved to subscription model for existing features (this article from The Register talks about it as well as the letter we signed to the FTC advocating against such technology). It’s frustrating the many ways that our technology is dictated to us, when it is from our own labor that all this technology is created in the first place [footnote]. What does software freedom look like to someone growing up in a world filled with proprietary cloud based software, an increasing surveillance state, and corporations seeking to lock you in the their walled gardens?"
year_published = 2024
year_updated = 2024
clearnet = "https://sfconservancy.org/blog/2024/dec/23/kuleana-and-software-freedom-for-the-future"
