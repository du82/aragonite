["https://sfconservancy.org/usethesource"]
title = "Use The Source - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = '''Software Freedom Conservancy works for your right to repair and modify the software on your devices. Use The Source shows you how we evaluate the source code candidates companies must provide for GPLed software. Join us as we highlight common issues in source candidates, and what companies need to do to fix them. Check out the options below, or subscribe to our mailing list to participate in the public discussion on these candidates. One crucial way to get involved is to let us know about any source candidates you find! Many devices have an offer for source code (check the manual or device's user interface to find it) and we'd be very interested to know what they send you when you request it. Here are the steps to submit a new source candidate to list on this page: There are many other ways you can help, regardless of whether you're a developer or not - see our Help Defend Software Freedom and Rights page for details! To join the public discussion of these candidates, please subscribe to our ccs-review mailing list. We re-post especially notable email replies from this community mailing list in the candidate comments, alongside SFC and other official Use The Source comments on each candidate's page linked below. A "round" indicates how many times we've received new candidates for a given device/firmware - if the round is "of N" it means we don't know how many rounds will be needed before we receive a compliant source candidate for the device/firmware. This candidate is an image of the CD that is provided in the box alongside the TPE-R1300. Note that in addition to being confirmed as the firmware running on the device, the binary firmware image is also available inside the source CD, in the bin folder. This source release is provided to people who purchased an OpenWrt One (from https://www.aliexpress.com/item/1005007795779282.html for example) and requested source code for it. This source release is provided to people who purchased an OpenWrt One (from https://www.aliexpress.com/item/1005007795779282.html for example) and requested source code for it. It is an updated version of https://sfconservancy.org/usethesource/candidate/openwrt-one-round-1-of-2/ that replaced the earlier version a few days after its release.'''
year_published = 2025
