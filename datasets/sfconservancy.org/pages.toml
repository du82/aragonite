["https://sfconservancy.org/donate"]
title = "Donations - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "As a not-for-profit charity, Conservancy relies on support from the public to continue its work. Please give generously to support Conservancy’s work. The best way to donate to Conservancy is via our official Sustainer program, which earns a t-shirt and other surprise Sustainer-only perks throughout the year. You can use this method to donate any amount. You can donate once or set up a recurring monthly donation. Donations are accepted by wire transfer. Please write to <donate@sfconservancy.org> to let us know what country you’re donating from and what currency you’re sending, and we’ll send back the instructions you need. Conservancy has accounts to receieve US Dollars and Euros. We’ll convert other currencies to US Dollars. This method is called a “wire transfer” in the United States, but it’s usually compatible with most online banking forms that people use in Europe and elsewhere to send funds. Please just contact us if you need to donate in native currency from your country and we’ll discuss it. If you work for a company based in the USA, your company may have a donation matching program for 501(c)(3) charities. Please contact your HR, Personnel, or charitable giving department and ask! If you need assistance in talking with your company about this, please don't hesitate to ask us! Through the eBay/PayPal Giving Fund program, you can donate a portion of your eBay sale proceeds to Software Freedom Conservancy. You can also donate directly through the PayPal Giving Fund. Finally, Conservancy also maintains directed donation programs for its member projects. Using the PayPal Donate button on that page is the easiest way to donate to a specific project. You can also designate a donation for a project in the memo line of a check or wire transfer. Software Freedom Conservancy, Inc. is a 501(c)(3) organization incorporated in New York, and donations made to it are fully tax-deductible to the extent permitted by law. This page, and all contents herein, unless a license is otherwise specified, are licensed under a Creative Commons Attribution-ShareAlike 4.0 International License."
