["https://sfconservancy.org/copyleft-compliance"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "As existing donors and sustainers know, the Software Freedom Conservancy is a 501(c)(3) non-profit charity registered in New York, and Conservancy helps people take control of their computing by growing the software freedom movement, supporting community-driven alternatives to proprietary software, and defending free software with practical initiatives. Conservancy accomplishes these goals with various initiatives, including defending and upholding the rights of software users and consumers under copyleft licenses, such as the GPL. Free and open source software (FOSS) is everywhere and in everything; yet our software freedom is constantly eroded. With the help of its volunteers, member projects, and staff, Conservancy stands up for users' software freedom via its copyleft compliance work. Conservancy's primary work in copyleft compliance currently focuses on our Strategic GPL Enforcement Initiative. This initiative, launched in October 2020, represents the culmination of nearly 15 years of compliance work of Conservancy spanning ten different fiscally sponsored projects, past lawsuits against more than a dozen defendants, and hundreds of non-litigation compliance actions. For these many years, Conservancy has always given the benefit of the doubt to companies who exploited our good nature and ultimately simply ignore the rights of users and consumers. In that time, the compliance industrial complex has risen to a multi-million-dollar industry — selling (mostly proprietary) products, services, and consulting to companies. Yet, these compliance efforts ignore consistently the most essential promise of copyleft — the complete, Corresponding Source and “the scripts used to control compilation and installation of the executable”. We encourage our sustainers and software freedom enthusiasts everywhere to read our detailed strategic plan for GPL enforcement and its companion project, our Firmware Liberation Project. Historically, Conservancy was well-known for its ongoing license compliance efforts on behalf of its BusyBox member project. Today, Conservancy does semi-regular compliance work for its BusyBox, Git, Inkscape, Mercurial, Samba, QEMU and Wine member projects. If you are a copyright holder in any member project of Conservancy, please contact the project's leadership committtee, via <PROJECTNAME@sfconservancy.org> for more information on getting involved in compliance efforts in that project."
year_published = 2025
