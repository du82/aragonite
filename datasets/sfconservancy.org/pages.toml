["https://sfconservancy.org/copyleft-compliance/vmware-code-similarity.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = '''This analysis verifies by reproducible analysis a set of specific contributions that are clearly made by Christoph Hellwig to Linux, and shows how those contributions appear in the VMware ESXi 5.5 product. Software is often modified in various ways; indeed, Linux developers form a community that encourages and enables modification by many parties. Given this development model, communities often find it valuable to determine when software source code moves from one place to another with only minor modifications. Various scientifically-vetted techniques can be used to identify "clones" -- a portion of code that is substantially similar to pre-existing source code. The specific area of academic research is called "code cloning detection" or "code duplication detection". The area has been under active research since the mid-1990s 1. In 2002, Japanese researchers published a tool called CCFinder 2, which, in its updated incarnation (called CCFinderX), is widely used and referenced by academic researchers in the field 3 and has specifically been used to explore reuses of code in GPL'd software such as Linux 4. CCFinderX uses a token-based clone detection method and a suffix-tree matching algorithm; both techniques have been highly vetted and considered in the academic literature. The techniques are considered viable and useful in detecting clones. Many academic papers on the subject have been peer-reviewed and published, and nearly every newly published paper compares its new techniques of clone detection to the seminal results found by CCFinderX. For purposes of our analysis, we have therefore chosen to use CCFinderX. These results can be easily reproduced since CCFinderX is, itself, also Open Source software. CCFinderX offers many statistics for clone detection. After expert analysis, we concluded that most relevant to this situation is the "ratio of similarity" between the existing code and the new code. To establish a baseline, we considered two different comparisons of Free and Open Source Software (FOSS). First, we compared the Linux kernel, Version 4.5.2, to the FreeBSD kernel, Version 10.3.0. This comparison was inspired by the similar 2002 study 5 of these two large C programs. The hypothesis remained that CCFinderX would encounter a low but significant percentage of code similarity, since the FreeBSD and Linux projects collaborate on some subprojects and willingly share code under the 3-Clause BSD license for those parts. (These collaborations are public and well-documented.)'''
year_published = 2025
