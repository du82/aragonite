["https://sfconservancy.org/members/apply"]
title = "Project Services - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Part of Conservancy's activity is through its member projects. These projects become formally part of Conservancy and have a close relationship with our activity. Most of our projects are purely software projects, but we also occasionally accept initiatives designed to advance software freedom, such as Outreachy. The situation for non-profit homes for FOSS activities has improved greatly since Conservancy was founded in 2006. In the USA, options now exist for 501(c)(3), 501(c)(6) and even for-profit fiscal sponsorship, and there are other options around the globe as well. Prospective member projects should carefully consider what type of structure is right for them. For our part, Conservancy seeks projects that dedicate themselves to the advancement of software freedom and focus their projects on the rights of users to copy, share, modify and improve their software. Being a FOSS project under an OSI-approved and DFSG-free license is mandatory, but not the only criteria. Given the many options available for fiscal sponsorship, we are selective and often refer projects to other fiscal sponsors that are a better fit. Nevertheless, we encourage projects to that need a non-profit home to apply to many fiscal sponsors. Conservancy's Evaluation Committee considers applications on a rolling basis. Conservancy generally has dozens of projects in various stages of the application process. We do not move rapidly to accept new projects, as we have found that consideration of joining or forming a non-profit organization for your project is best done with careful consideration over a period of many months rather than rapidly. Conservancy's application process is somewhat informal. New applicants should write an initial inquiry email to <apply@sfconservancy.org> with a very brief description of their project and a URL to their project's website. We'll send back initial questions, and after those questions are answered, we'll send the full application materials. Applications should be submitted in plain ASCII text via email. Your application will be assigned a ticket number in our ticketing system, and please be sure to include the proper ticket number details in the Subject line of your emails to ensure they are routed to the right place."
year_published = 2025
clearnet = "https://sfconservancy.org/members/apply"
