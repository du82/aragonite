["https://sfconservancy.org/copyleft-compliance/enforcement-strategy.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "As existing donors and sustainers know, the Software Freedom Conservancy is a 501(c)(3) non-profit charity registered in New York, and Conservancy helps people take control of their computing by growing the software freedom movement, supporting community-driven alternatives to proprietary software, and defending free software with practical initiatives. Conservancy accomplishes these goals with various initiatives, including defending and upholding the rights of software users and consumers under copyleft licenses, such as the GPL. The spring of 2003 was a watershed moment for software freedom on electronic devices. 802.11 wireless technology had finally reached the mainstream, and wireless routers for home use had flooded the market earlier in the year. By June 2003, the general public knew that Linksys (a division of Cisco) was violating the GPL on their WRT54G model wireless routers. Hobbyists discovered (rather easily) that Linux and BusyBox were included in the router, but Linksys and Cisco had failed to provide source code or any offer for source code to its customers. A coalition formed made up of organizations and individuals — including Erik Andersen (major contributor to and former leader of the BusyBox project) and Harald Welte (major contributor to Linux’s netfilter subsystem) — to enforce the GPL. Bradley M. Kuhn, who is now Conservancy’s Policy Fellow and Hacker-in-Residence, led and coordinated that coalition (when he was Executive Director of the FSF). By early 2004, this coalition, through the process of GPL enforcement, compelled Linksys to release an almost-GPL-compliant source release for the WRT54G. A group of volunteers quickly built a new project, called OpenWrt based on that source release. In the years that have followed, OpenWrt has been ported to almost every major wireless router product. Now, more than 15 years later, the OpenWrt project routinely utilizes GPL source releases to build, improve and port OpenWrt. The project has also joined coalitions to fight the FCC to ensure that consumers have and deserve rights to install modified firmwares on their devices and that such hobbyist improvements are no threat to spectrum regulation."
year_published = 2025
