["https://sfconservancy.org/about/staff"]
title = "Staff - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Rosanne DiMesio is the Technical Bookkeeper at the Software Freedom Conservancy where she handles incoming and outgoing accounting activities for all its member projects as well as financial operations for Conservancy itself. Rosanne has been volunteering with the Wine Project since 2008 where she focuses on user support and documentation. She has worked as an English teacher, a freelance writer and as IT support. She is passionate about helping free software projects improve their user experience. Rosanne received her Masters in Communication & Theater at the University of Illinois at Chicago and her Bachelor’s degree in English from the University of Chicago. Denver manages SFC's license compliance work, including its technical parts (such as triaging new reports and verifying complete corresponding source) as well as planning and carrying out our enforcement strategy (with advice and input from SFC's Executive Director and Policy Fellow). Outside of SFC, Denver also co-runs a FOSS business. Previously, Denver authored financial trading software on Linux. Denver writes free software in his spare time: his patches have been accepted into Wine, Linux, and wdiff. Denver received his BMath in Computer Science from the University of Waterloo. He gives presentations about digital civil rights and how to ensure FOSS remains sustainable as a community and financially, having spoken at conferences such as LinuxCon North America, Texas Linux Fest, LibrePlanet, CopyCamp Toronto, FOSSLC's Summercamp, CopyleftConf, and the Open Video Conference. Tracy acts as Operations Manager at Software Freedom Conservancy. Bringing her super-skills of organization and love of bureaucracy, she helps things run at SFC smoothly behind the scenes. Tracy also serves on the board of her local hackerspace, an organization committed to teaching and promoting open technology exclusively. She feels that open techonology allows people to express their creativity regardless of their financial situation or technical background. Tracy has a degree in GIS from the University of Tennessee and enjoys making artistic maps using FOSS."
