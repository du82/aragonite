["https://sfconservancy.org/news/2024/nov/26/2024-fundraiser"]
title = "2024 Fundraiser launches with historic match challenge! - Software Freedom Conservancy"
description = "The 2024 Software Freedom Conservancy match fundraiser launches today with an historic $204,887 match total! That means for every dollar you donate before January 15th 2025, our generous individual matchers will donate the same, making your donation go twice as far until we reach our goal! SFC prides itself on being funded by individuals like you, who believe that software freedom is a right for everyone."
full_description = "The 2024 Software Freedom Conservancy match fundraiser launches today with an historic $204,887 match total! That means for every dollar you donate before January 15th 2025, our generous individual matchers will donate the same, making your donation go twice as far until we reach our goal! SFC prides itself on being funded by individuals like you, who believe that software freedom is a right for everyone. Our matchers include people giving large donations but also people who are giving small amounts as their budget allows because they care about software freedom. This year, we're so grateful to highlight Sustainers Kyle Wiens (CEO of iFixit), Holger Kienle, Emily Dunham, and Patrick Masson. Look forward to some interviews about what makes software freedom important to them and why they continue to support our mission driven work. We have been extremely busy this year! Our pursuit of copyleft compliance ramps up with completely new efforts like Use the Source and coalition building with Right to Repair groups. Our commitment to diversity and inclusion within free software remains a priority, and programs like Outreachy continue to serve and grow our community. Software Freedom Conservancy has always spoken to current issues and trends in technology; we think it's incredibly important to stand up for all users and our fundamental digital freedoms. In that vein we've spoken out at various regulatory processes, technology conferences and created an aspirational statement on generative AI. We see the technology as secondary, serving people should always be first. Our member projects dedicated to providing freedom respecting technology have achieved major successes this year, like the hardware project, the OpenWrt One (which will be generally available by the end of the year), improved supply chain security and high quality tooling for open standards. You can read a detailed account of what we've been up to in our Year in Review. This page, and all contents herein, unless a license is otherwise specified, are licensed under a Creative Commons Attribution-ShareAlike 4.0 International License."
