["https://sfconservancy.org/copyleft-compliance/vmware-lawsuit-faq.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Update 2019-04-02: Please see this announcement regarding conclusion of the VMware suit in Germany. Since the suit has concluded, any funds you donate here will support our ongoing compliance efforts. The remaining material below is left as it was before that announcement: Conservancy maintains this FAQ list regarding Christoph Hellwig's lawsuit against VMware in Germany over alleged GPL violations on Linux as a service to the Free Software community, and in particular, the copyleft community. Conservancy realizes this lawsuit generates many questions and interest from the community. Legal counsel (both Conservancy's own, and Christoph's lawyer, Till Jaeger) correctly advise us to limit our public comments regarding specific details of the case while litigation remains pending in court. Nevertheless, Conservancy, as a non-profit charity serving the public good, seeks to be as transparent as possible. If you have additional questions you'd like to see answered here, please email <info@sfconservancy.org>, but understand that we may often need to answer: We cannot comment on this while litigation is pending. Christoph is one of most active developers of the Linux kernel. He has contributed 279,653 lines of code to the latest Linux 3.19 kernel, and thus ranks 20th among the 1,340 developers involved in that release. Christoph also ranks 4th among those who have reviewed third-party source code, and he has tirelessly corrected and commented on other developers' contributions. Not currently. Court proceedings are not public by default in Germanyg (unlike in the USA). Conservancy will continue to update this FAQ with information that Conservancy knows about the case. We would all also welcome an agreement with VMware whereby both sides would agree to publish all Court documents. Unfortunately, VMware has explicitly asked for the filings not to be published. Accordingly, Conservancy itself has not even been able to review VMware's statement of defense nor Christoph's response to that statement of defense."
