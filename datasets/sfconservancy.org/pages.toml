["https://sfconservancy.org/copyleft-compliance/firmware-liberation.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Conservancy plans to select a class of product in the Linux-based embedded system space. For this product, Conservancy will launch, or assist, a project that creates a functioning alternative firmware for those devices. The promise of GPL enforcement is only realized through actual, practical use and improvement of the released software for users. Simply enforcing the GPL is an important first step, and Conservancy continues our efforts in that regard. However, we can replicate the success found with OpenWrt only by a substantial effort after enforcement occurs to turn the compliant source release into a viable alternative firmware for the platform. Conservancy has seen non-compliant Linux-based firmwares on refrigerators, baby monitors, virtual assistants, soundbars, doorbells, home security cameras, police body cameras, cars, AV receivers, and televisions. We believe that building an alternative firmware for one of these classes of devices — or joining our work with an existing alternative firmware project that is struggling due to lack of sources available — will lead to more palpable software freedom for users of these device. Alternative hardware projects remain an essential component of small device freedom. Conservancy supports and engages with communities that seek to source and build IoT-style devices from the ground up. We’re excited to see deployable boards that allow Maker efforts to create new devices. Nevertheless, we remain ever-cognizant that FOSS succeeded on servers, laptop, desktop, and wireless router computers precisely because users could buy commodity hardware at any store and install FOSS alternatives to the vendor-provided software. Throughout the history of FOSS, most new users who seek to experience software freedom want to do so with their existing devices first. Many don't even know much about the issues involved in software liberation until they've already purchased hardware. Conservancy therefore believes support of alternative firmwares for such devices is paramount."
year_published = 2025
