["https://sfconservancy.org/copyleft-compliance/vmware-lawsuit-appeal.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = "Update 2019-04-02: Please see this announcement regarding conclusion of the VMware suit in Germany. Since the suit has concluded, any funds you donate here will support our ongoing compliance efforts. The remaining material below is left as it was before that announcement: In March 2015, Conservancy announced Christoph Hellwig's lawsuit against VMware in Germany. In July 2016, we announced that Christoph would appeal the lower court's ruling. Everyone asked us to give companies as many chances as possible and as much help as possible to comply with copyleft, so we did. We've worked for years to help VMware comply with the GPL, but they refuse. Negotiations broke down for the last time when they insisted on an NDA just to discuss settlement terms! Christoph is among the most active developers of Linux. As of Feburary 19, 2015, Christoph has contributed 279,653 lines of code to the Linux kernel, and ranks 20th among the 1,340 developers involved in the latest 3.19 kernel release. Christoph also ranks 4th among those who have reviewed third-party source code, tirelessly corrected and commented on other developers' contributions. Christoph licenses his code to the public under the terms of the GPL for practical and ideological reasons. VMware, a company with net revenue of over $1 billion and over 14,000 employees, ignored Christoph's choice. They took Christoph's code from Linux and modified it to work with their own kernel without releasing source code of the resulting complete work. This is precisely the kind of activity Christoph and other kernel developers seek to prevent by choosing the GPL. The GPL was written to prevent this specific scenario! Free and open source software is everywhere and in everything; yet our software freedom is constantly eroded. We want companies to incorporate our software into new products, but there are a few simple rules. Copylefted free software is so prevalent because there's no way a company can compete without using a significant amount of free software to bring products to market in reasonable time. They get so much benefit from our work. Allowing the whole community to review, use, improve and work with the code seems very little to ask in return. Copyleft also ensures competitors cannot undercut those who contribute. Without active enforcement, the GPL is effectively no different from a non-copyleft license."
year_published = 2025
