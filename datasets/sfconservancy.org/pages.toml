["https://sfconservancy.org/blog/2025/jan/18/usa-should-require-bytedance-to-open-source-tiktok"]
title = "Everyone is asking the wrong questions about TikTok - Conservancy Blog - Software Freedom Conservancy"
description = """
As we write this, everyone is wondering what will happen with TikTok in the next 48 hours.
Social media as a phenomenon was designed to manufacture drama to sell advertising, and 
in this moment, the meta-drama is bigger than the in-App drama.The danger of pervasive software is clear: powerful entities — be
they governments or for-profit corporations — should not control the
online narrative and remain unregulated in their use of personal data
generated by these systems.  However, the approach taken by Congress and
  upheld by SCOTUS remains fundamentally flawed.  When there is power imbalance
between a software systems' users and its owners, the answer is never
“pick a different owner”."""
full_description = '''As we write this, everyone is wondering what will happen with TikTok in the next 48 hours. Social media as a phenomenon was designed to manufacture drama to sell advertising, and in this moment, the meta-drama is bigger than the in-App drama. The danger of pervasive software is clear: powerful entities — be they governments or for-profit corporations — should not control the online narrative and remain unregulated in their use of personal data generated by these systems. However, the approach taken by Congress and upheld by SCOTUS remains fundamentally flawed. When there is power imbalance between a software systems' users and its owners, the answer is never “pick a different owner”. Whoever owns ByteDance, the fundamental problem remains the same: users never really know what data is collected about them, and they don't know how the software manipulates that data when deciding what they are shown next. The problem can only be solved if users can learn, verify, and understand how that software works. TikTok is a software system — implemented in two parts: somewhere, there is a server (or, likely, a group of servers), running the software that gathers and aggregates posts, and then there is the client software — the App — installed on users' devices. In both cases, ByteDance likely owns and controls both pieces of technology and is the only entity with access to the “source code” — the human readable software that can be studied and understood by human beings. When users download the TikTok App, they don't get that source code for the App, and certainly get no information about the software running on the servers. If the USA operations of TikTok are sold to another entity, quite likely the software itself will remain in control of ByteDance. While the wording in the Act is expansive about the required divestment, it's likely the new USA owners wouldn't themselves receive the right to review or modify the source code — they could just receive a binary (non-source form) of that software. In that case, no one in the USA will have permission to review and verify that software behaves in a way that is in the interest of its USA users. The Act is vague on these details. Will complete, corresponding source code ultimately be considered part of “a qualified divestiture”? The Act simply leaves "an interagency process", with no guidance (to our knowledge) on the issue of server or App source code. (We have seen similar failures where government agencies with a duty to examine software found in medical devices do not actually even have access to the source code.)'''
year_published = 2025
year_updated = 2025
