["https://sfconservancy.org/copyleft-compliance/avm.html"]
title = "Copyleft Compliance Projects - Software Freedom Conservancy"
description = "The Software Freedom Conservancy provides a non-profit home and services to Free, Libre and Open Source Software (FLOSS) projects."
full_description = '''We are pleased to be able to share with you the complaint and final court decision in the SFC-funded lawsuit against router manufacturer AVM, in both their original German, and in an English version translated by a dispassionate legal document translator, hired by SFC. The German legal system does not make court dockets public by default, so we are limited in what we can publish. We encourage AVM to publish the filings written by its own lawyers, for greater transparency. We understand, for example, that (happily) AVM chose to provide "the scripts used to control ... installation of the library" prior to the final court decision. (Documents in AVM's possession, which are not by default public under the German legal system, would confirm that.) We will post any updates that AVM provides to us here. We are also publishing the source code candidates that AVM provided along the path to the final resolution of this case, which we have put in SFC's Use The Source repository of source code candidates, for the public to discuss and benefit from. Note that these differ from the source code candidate(s) on AVM's website, since AVM has chosen not to publish "the scripts used to control ... installation of the library" there, and instead provided them only to Sebastian Steck, the plaintiff in this lawsuit. Steck wants these scripts published, and they are part of the complete source code, meaning that LGPLv2.1 requires them to be redistributable, so we are redistributing them now for everyone to use. The lawsuit itself focused only on the rights under LGPLv2.1. Sadly, AVM has still not provided Steck or SFC with "the scripts used to control ... installation of the program" for works under GPLv2 in AVM's firmware image, such as Linux, which it still distributes today. We implore AVM to comply with all copyleft agreements they use, and will continue to pursue this enforcement action just as we continue to pursue dozens of other enforcement actions. To support our copyleft compliance & enforcement work, please become a Conservancy Sustainer right now. We can't sustain this work without ongoing support from donors like you!'''
year_published = 2025
