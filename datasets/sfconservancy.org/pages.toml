["https://sfconservancy.org/members"]
title = "Support Conservancy - Software Freedom Conservancy"
description = "Software freedom is critical to many of today’s most pressing social issues, but it’s only effective when FOSS is for everyone. Support Conservancy today to help make that happen!"
full_description = "Credit card and ACH payments are processed with Stripe. We also accept payment by PayPal, paper check and wire transfer. Please write SUSTAINER, T-shirt size, if you are renewing, and if you want public acknowledgment in memo line. We are so proud that we're funded by individuals and stay unbeholden to corporate interests and pressures. We stand up for developers, consumers and those who have been historically excluded. We work to make technology truly fair for all. We are beyond thankful for the ability to continue our work — which only continues due to your financial contributions. We recognize that not everyone has the same financial leeway to donate as they have in the past. But please consider giving what you can so that our organization can continue to advocate and support the rights of all software users. We work hard and efficiently, and accomplish so much with our small staff. We hope — through our hard work, creativity, and passionate dedication — that we've demonstrated over the years how Software Freedom Conservancy continues to be the beacon of change for software freedom that the world needs. Please consider donating now! 2024 has been a jam packed year at Software Freedom Conservancy; from the new copyleft compliance efforts, continued community building at Outreachy and new venues of outreach and advocacy in the software right to repair world. There is growing interest in why software freedom is important for us all, and as we learn from and work with all of you about how to affect the change needed, we strive for making the world a more technologically inclusive and human centered place. Outreachy accepted 58 interns in the December 2023 cohort, and 35 interns in the May 2024 cohort with over 30 Free and Open Source software communities. Bringing in new communities in the Open Science and Humanitarian spheres, Outreachy continues to lead the way in providing opportunities to people subject to systemic bias and impacted by underrepresentation in technology. Last year celebrated our 1000th intern (!!!), and we've continued to provide these critical opportunities to people who need them most."
