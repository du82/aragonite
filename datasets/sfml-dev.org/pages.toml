full_description = '''Simple and Fast Multimedia Library Home Learn Tutorials Documentation Documentation SFML 3.0.0 SFML 2.6.2 SFML 2.6.1 SFML 2.6.0 SFML 2.5.1 SFML 2.5.0 SFML 2.4.2 SFML 2.4.1 SFML 2.4.0 SFML 2.3.2 SFML 2.3.1 SFML 2.3 SFML 2.2 SFML 2.1 SFML 2.0 SFML 1.6 Download Community Development /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ var searchBox = new SearchBox("searchBox", "search/",'.html'); /* @license-end */ /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function() { codefold.init(0); }); /* @license-end */ Main Page Topics Namespaces Classes Files /* @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&amp;dn=expat.txt MIT */ $(function(){ initResizable(false); }); /* @license-end */ Loading... Searching... No Matches SFML Documentation Welcome Welcome to the official SFML documentation. Here you will find a detailed view of all the SFML classes and functions. If you are looking for tutorials, you can visit the official website at www.sfml-dev.org. Short example Here is a short example, to show you how simple it is to use SFML: #include <SFML/Audio.hpp> #include <SFML/Graphics.hpp> int main() { // Create the main window sf::RenderWindow window(sf::VideoMode({800, 600}), "SFML window"); // Load a sprite to display const sf::Texture texture("cute_image.jpg"); sf::Sprite sprite(texture); // Create a graphical text to display const sf::Font font("arial.ttf"); sf::Text text(font, "Hello SFML", 50); // Load a music to play sf::Music music("nice_music.ogg"); // Play the music music.play(); // Start the game loop while (window.isOpen()) { // Process events while (const std::optional event = window.pollEvent()) { // Close window: exit if (event->is<sf::Event::Closed>()) window.close(); } // Clear screen window.clear(); // Draw the sprite window.draw(sprite); // Draw the string window.draw(text); // Update the window window.display(); } } Audio.hpp Graphics.hpp sf::FontClass for loading and manipulating character fonts.Definition Font.hpp:64 sf::MusicStreamed music played from an audio file.Definition Music.hpp:53 sf::RenderTarget::drawvoid draw(const Drawable &drawable, const RenderStates &states=RenderStates::Default)Draw a drawable object to the render target. sf::RenderTarget::clearvoid clear(Color color=Color::Black)Clear the entire target with a single color. sf::RenderWindowWindow that can serve as a target for 2D drawing.Definition RenderWindow.hpp:55 sf::SpriteDrawable representation of a texture, with its own transformations, color, etc.Definition Sprite.hpp:51 sf::TextGraphical text that can be drawn to a render target.Definition Text.hpp:57 sf::TextureImage living on the graphics card that can be used for drawing.Definition Texture.hpp:56 sf::VideoModeVideoMode defines a video mode (size, bpp)Definition VideoMode.hpp:44 sf::WindowBase::pollEventstd::optional< Event > pollEvent()Pop the next event from the front of the FIFO event queue, if any, and return it. sf::WindowBase::isOpenbool isOpen() constTell whether or not the window is open. sf::Window::closevoid close() overrideClose the window and destroy all the attached resources. sf::Window::displayvoid display()Display on screen what has been rendered to the window so far. sf::Event::ClosedClosed event subtype.Definition Event.hpp:54 Back to top'''
