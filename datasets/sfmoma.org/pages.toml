full_description = "In the heart of SOMA and just steps from Moscone Center, SFMOMA has unique event spaces, each one open and welcoming. A LEED Gold–certified building designed with sustainability in mind by renowned architecture firm SnØhetta, SFMOMA has unique event spaces that work for a variety of event types: large cocktail receptions, corporate dinners, product launches, film premieres, meetings, galas, or weddings. With its soaring ceilings, elegant architecture, and sweeping staircase, the iconic SFMOMA Atrium is an unmistakable backdrop that’s flexible enough to accommodate a range of events from cocktail receptions to dancing and DJs! At the heart of the museum with views over the Atrium and the Roberts Family Gallery, the spacious Schwab Hall is an open and versatile space perfect for large dinners, banquets, or receptions. With its high ceilings, natural light, and clean white walls, the White Box is a sleek and elegant stage for your dinner, presentation, or wedding. Available day or evening, it overlooks the Living Wall. Stunning city views and majestic artwork greet your guests as they stroll between the expansive Pavilion and the Jean and James Douglas Family Sculpture Garden. With sliding doors, this space transforms seamlessly from indoor to outdoor, and is ideal for intimate cocktail receptions, seated dinners, wedding and commitment ceremonies, and more. A highlight of our expansion is our Living Green Wall. This thirty-foot vertical garden lines the Sculpture Terrace, a partially covered outdoor space spanning the distance between Minna and Natoma Streets. This stunning space is located immediately outside the Calder Gallery and features modern sculptures. With state-of-the-art audio, video, and projection equipment, plus easy access for all abilities, the Wattis Theater is a comfortable, sophisticated venue for presentations, lectures, screenings, and live performances. The Howard Steet Mural Alley provides a perfect outdoor option for your next Happy Hour or entrance to your event. Tucked into the museum, with a glass wall viewing into the Roberts Family Gallery, it provides an ideal spot for guests to gather."
