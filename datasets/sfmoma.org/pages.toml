["https://www.sfmoma.org/join-the-team"]
title = "Join Our Team · SFMOMA"
description = """
Our benefits package provides health care, wellness, retirement planning, and financial resources for you and your family. But we believe the most compelling reason to work at SFMOMA is the unique spirit of our staff. “The people” is the number one reason our employees love their work. Together, we aim to make art a vital and meaningful part of public life.
A few of the perks for all SFMOMA staff:

Complimentary SFMOMA membership
30% off at the SFMOMA Museum Store
20% off gift memberships for friends and family
Wellness programs such as on-site massage, yoga classes, ergonomic evaluations, fitness center discounts, and seminars on health and wellness
A commuter program that sets aside pretax dollars to offset the costs of getting to work

Regular staff (working 21 hours or more per week) are eligible for:

Medical, dental, vision, and long-term disability coverage
Life insurance
Paid vacation, holidays, and sick leave
Enrollment in an organization-sponsored retirement plan
Flexible spending accounts that set aside pretax dollars for health care and childcare expenses"""
full_description = "Become a part of something bigger than yourself. Feel a sense of belonging. Be proud of the work you do. Learn about our current open roles here. At SFMOMA, we strive to foster an inclusive, rewarding, and inspiring place to work. Our people and the work we do reflect our four core, museum-wide values: Our working environment is meaningful and intentional—a place for our employees to embrace creativity, connection, diverse thinking, discussion, and education. We celebrate the differences and uniqueness that each person brings into our place of work, as we believe we all have something to learn from each other. From curatorial experts to museum store professionals, our employees are all driven by the same goal: to share the art of our time with passion and purpose. The theme of “caring” runs throughout our people-centered, empathetic community, where strong workplace relationships flourish and translate directly into our work. Our benefits package provides health care, wellness, retirement planning, and financial resources for you and your family. But we believe the most compelling reason to work at SFMOMA is the unique spirit of our staff. “The people” is the number one reason our employees love their work. Together, we aim to make art a vital and meaningful part of public life. Header image credits: Staff member in front of Muzae Sesay’s With Roots, Far Too Deep (2020) at Member Preview, 2020; courtesy SFMOMA; photo: Don Ross. Artist Wayne Thiebaud and SFMOMA staff selecting objects for exhibition, 2018; courtesy SFMOMA; photo: Katherine Du Tiel. SFMOMA staff installing Muzae Sesay’s With Resilience, Far Too Long (2020), 2020; courtesy SFMOMA; photo: Katherine Du Tiel. Artist Liz Hernández installing her Bay Area Walls mural with SFMOMA staff, 2020; courtesy SFMOMA; photo: Katherine Du Tiel. Installation of Diego Rivera’s The Marriage of the Artistic Expression of the North and of the South on this Continent (Pan American Unity) (1940); collection of City College of San Francisco, presented by the San Francisco Museum of Modern Art; photo: Katherine Du Tiel. SFMOMA curators speaking with artist Oliver Lee Jackson, 2021; courtesy SFMOMA; photo: Katherine Du Tiel."
