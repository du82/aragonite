["https://www.sfmoma.org"]
title = "SFMOMA"
description = "Visit one of the largest museums of modern and contemporary art in the United States and discover artists from around the world."
full_description = "Don't miss this extraordinary exhibition of Amy Sherald’s luminous paintings, including her iconic portraits of Michelle Obama and Breonna Taylor and new works on view for the first time. Closing March 9! Using work by members of Group f64 as a nexus, this exhibition explores various histories of Bay Area photography from the 1910s to the present. Looking for a Sunday afternoon groove? On Sunday, March 2, celebrate the inaugural SF Music Week with a free concert at SFMOMA in partnership with SFJAZZ! Discover Ruth Asawa’s extraordinary experimental vision and how San Francisco became the center of her creative universe in the most expansive exhibition of the artist’s work to date. Opens April 5! Enjoy first access to exhibitions, free admission for you and a guest, and other exclusive offerings. Explore unforgettable gifts for all ages, including art prints, books, puzzles, clothing, jewelry, and home decor! Learn about Amy Sherald’s artistic process as well as other behind-the-scenes stories of the art and artists in SFMOMA’s collection."
