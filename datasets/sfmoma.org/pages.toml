["https://www.sfmoma.org/membership/member-faq"]
title = "Member FAQ · SFMOMA"
description = "San Francisco Museum of Modern Art"
full_description = "Each level of membership offers a variety of perks and benefits. Basic membership includes free admission for you and a guest for one year, invitations to exclusive member events, discounts at the SFMOMA Museum Store, and more. Higher levels of membership bring additional benefits, from guest passes for unaccompanied guests to invitations to evening receptions, day trips to Bay Area art destinations, and more. Reserve online: To ensure your preferred day and time for visiting, we encourage you to reserve your tickets online in advance of your visit. You can also purchase tickets for additional guests beyond your member allotment. Print your tickets at home or show them on your phone to skip the Membership Desk and head straight into the galleries. If we have your email address, then you already have an online account. If you need assistance or would like to set up an online account, contact us at membership@sfmoma.org or 415.357.4135. Reserve in person: Present your membership card at the Membership Desk to reserve tickets. Please note that the museum has a limited number of tickets available on-site every day. Members receive priority tickets through the Membership Desk, but on very busy days there is a chance tickets may sell out for your preferred time slot. It is easy to join or renew your membership online through the SFMOMA website. To join, go to sfmoma.org/membership/ and select the level at which you’d like to become a member. To renew, go to sfmoma.org/renew-your-membership and select the level at which you’d like to renew. You can also join or renew by phone at 415.357.4135, on-site at the Membership Desk, or by mailing a check to the museum (to the attention of Member Services). If your membership expires in more than six months, you can upgrade for the remainder of your current membership by paying only the difference between the two levels’ rates. Call 415.357.4135, visit, or email us so we can assist you. If your current membership expires in the next three months, you can upgrade online. Your membership will be renewed for an additional year at the level you selected, and you’ll start enjoying your additional benefits right away!"
