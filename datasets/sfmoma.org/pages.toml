["https://www.sfmoma.org/artwork/2008.109"]
title = 'Felix Gonzalez-Torres, "Untitled" (Golden), 1995 · SFMOMA'
description = "Explore the artists and artworks of our time at the San Francisco Museum of Modern Art."
full_description = "https://d1hhug17qm51in.cloudfront.net/www-media/2023/03/02101715/47513_en_355a_GonzalezTorres_UntitledGolden.mp3 Here are curators Alison Gass, Apsara DiQuinzio, and Janet Bishop in conversation. Take time to pass through the beads as you listen. There’s always that moment of doubt when you approach it. Can I walk through this? Can I touch it? And that’s, I think, an integral part of the piece. So much of Felix Gonzalez-Torres’s work really is about the body, but in a very unexpected way. This doesn’t look figurative, it doesn’t represent the body, but as you walk through it, it touches every part of your body. Usually we engage our eyes or maybe our ears in the museum, but here the work is really encompassing you and touching you in a totally different way, it’s really unexpected. This gold beaded curtain by Cuban artist Felix Gonzalez-Torres was conceived of before his death in 1996, and realized afterwards. Gonzalez-Torres was known for his deceptively simple works involving paper, hard candies, and other common materials that the visitor could touch, take, or even eat. It’s meant to be installed either going all the way across a gallery or all the way across a doorway, so that the viewers go right through the beads, setting this tremendous sort of ripple into motion. And it’s extraordinarily fluid, and almost liquid, in a sense, where you walk through it and then the—the beads sort of settle back into place over time. You know, almost like throwing a stone into a lake, creating a ripple effect and then having it settle again. Please note that artwork locations are subject to change, and not all works are on view at all times. Only a portion of SFMOMA's collection is currently online, and the information presented here is subject to revision. Please contact us at collections@sfmoma.org to verify collection holdings and artwork information. If you are interested in receiving a high resolution image of an artwork for educational, scholarly, or publication purposes, please contact us at copyright@sfmoma.org."
