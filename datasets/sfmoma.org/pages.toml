["https://www.sfmoma.org/privacy-policy"]
title = "Privacy Policy · SFMOMA"
description = "San Francisco Museum of Modern Art"
full_description = "The San Francisco Museum of Modern Art (“SFMOMA,” “we,” “our,” and/or “us”) values the privacy of SFMOMA members and visitors and those who use www.sfmoma.org and its associated websites and services (collectively, the “Site”), as well as the users of SFMOMA’s mobile app (the “App”) (collectively or individually “Users”). This privacy policy (the “Privacy Policy”) governs information you provide to us or that we learn from your use of the Site and App (collectively our “Services”) and tells you how we may collect, use, and in some instances share this information. Your use of our Services is also subject to our Terms of Use. When you register for an account or our Press List or submit an application. We collect information that may include your name, postal mailing address, email address, phone number, and password when you register or apply. We partner with SnapHire to provide employment application features on our Site. If you submit an employment application via our Site, we will collect your resume/CV and potentially certain demographic and preference information about you. When you make a purchase. When you make a purchase from our gift shop or ticket office, make a donation, or purchase a membership via our Site, we will collect information about what you purchase, your billing and shipping addresses, and your email address. We use our CRM application, a secure third party, to process your payment card information. Full payment card information is not stored on our network. When you post content. We collect content that you submit or post to our Site, for example when you leave a comment on one of SFMOMA’s blogs. Any content you choose to post on our Site will be viewable to the public, along with your name. We urge you to consider the sensitivity of any information prior to sharing it publicly by posting it on our Site because by posting content on our Site you are consenting to us sharing it with the public. When you contact us. We collect other information that you may give us directly, such as when you request customer support, ask for more information about our programs for educators, reserve a space at SFMOMA for an event, sign up to receive our newsletter, or communicate with us via email or social media sites."
