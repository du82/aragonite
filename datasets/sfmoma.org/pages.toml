["https://www.sfmoma.org/library-archives"]
title = "Library + Archives · SFMOMA"
description = "The SFMOMA Library collection includes books, serials, ephemera, and other print materials documenting modern and contemporary art."
full_description = "Part of our commitment as a museum is to share ideas, advance scholarship, and preserve history in our Bay Area community and beyond. The Library and Archives play a central role in this mission, preserving and providing access to a growing collection of scholarly and archival research materials. The SFMOMA Library collection includes books, serials, ephemera, and other print materials documenting modern and contemporary art. The SFMOMA Archives holds the institutional records of the museum, dating back to the museum’s opening in 1935. We hold records from the Office of the Director(s), exhibition documentation and photographs, publications, sound and video recordings of events, and more. The Collections Center, our collections research facility in South San Francisco, is home to the SFMOMA’s archives and houses much of the museum’s collection when not on public view."
