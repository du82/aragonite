full_description = "Sweeping views over the city’s skyline towers. The verdant green of a 4,400-square-foot Living Wall. Galleries filled with masterpieces of modern and contemporary art. There’s no place more romantic and meaningful than SFMOMA to have a truly unforgettable day. With its high ceilings, natural light, and clean white walls, the White Box is a sleek and elegant stage for your wedding reception. It overlooks the living wall. Stunning city views and majestic artwork greet your guests as they stroll between the expansive Pavilion and the Jean and James Douglas Family Sculpture Garden. With sliding doors, this space transforms seamlessly from indoor to outdoor, and is ideal for intimate cocktail receptions, seated dinners, wedding and commitment ceremonies, and more.Photo credit: Larissa Clevelend A thirty-foot living wall surrounded by iconic modern sculpture is a backdrop like none other. Partially covered and perfect for cocktail parties or smaller events, the Sculpture Terrace is adjacent to the Floor 3 galleries, and pairs easily with Schwab Hall for larger events. At the heart of the museum with views over the Atrium and the Roberts Family Gallery, the spacious Schwab Hall is an open and versatile space perfect for large dinners, banquets, or receptions. With its soaring ceilings, elegant architecture, and sweeping staircase, the iconic SFMOMA Atrium is an unmistakable backdrop that’s flexible enough to accommodate a range of events from cocktail receptions to dancing and DJs!Photo credit: Larissa Clevelend var qbxqs2s0225unz;(function(d, t) { var s = d.createElement(t), options = { 'userName':'sfmoma', 'formHash':'qbxqs2s0225unz', 'autoResize':true, 'height':'260', 'async':true, 'host':'wufoo.com', 'header':'hide', 'ssl':true}; s.src = ('https:' == d.location.protocol ? 'https://' : 'https://') + 'www.wufoo.com/scripts/embed/form.js'; s.onload = s.onreadystatechange = function() { var rs = this.readyState; if (rs) if (rs != 'complete') if (rs != '