["http://sfmoma.org/stories"]
title = "Discover Stories by SFMOMA"
description = "Amy Sherald is perhaps best known for her portraits of former First Lady Michelle Obama and Breonna Taylor, though most of her works defy the traditional definition of portraiture. She chooses individuals who, for her, embody a particular idea or narrative she wants to put forth in the world. Learn more about Sherald’s artistic process and central themes."
full_description = "Amy Sherald is perhaps best known for her portraits of former First Lady Michelle Obama and Breonna Taylor, though most of her works defy the traditional definition of portraiture. She chooses individuals who, for her, embody a particular idea or narrative she wants to put forth in the world. Learn more about Sherald’s artistic process and central themes. We asked our resident poster expert, associate curator Joseph Becker, to walk us through a few selections from decades of political action. Learn about activist, writer, mischief- and media-maker, and self-described “cyborg oracle” Alice Wong. Discover the accessible and provocative visual language Emory Douglas pioneered for the Black Panther newspaper. Over sixty swimmers participated in SFMOMA’s Joan Brown Jump and Swim honoring the beloved Bay Area artist. Visit the archive for Open Space (2008–2021), SFMOMA’s publishing platform for artists, writers, community members et al. Dive into the museum’s digital publications, featuring original research, curatorial perspectives, and more."
