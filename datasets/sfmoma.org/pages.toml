["https://www.sfmoma.org/read/our-history"]
title = "Our History · SFMOMA"
description = "San Francisco Museum of Modern Art"
full_description = "On January 18, the San Francisco Museum of Art, under the leadership of founding director Grace McCann Morley, opens on the fourth floor of the War Memorial Veterans Building on Van Ness Avenue. A gift of several hundred artworks from Albert M. Bender, including works by Frida Kahlo and Diego Rivera, establishes the nucleus of the permanent collection. In a remarkable display of generosity, Bender goes on to donate more than 1,100 objects to the museum, including photographs, and endows its first purchase fund before his death in 1941. Diego Rivera, The Flower Carrier, 1935; Collection SFMOMA, Albert M. Bender Collection, gift of Albert M. Bender in memory of Caroline Walter; © Banco de Mexico Diego Rivera & Frida Kahlo Museums Trust, Mexico, D.F. / Artists Rights Society (ARS), New York The museum’s second year begins with an exhibition of works by Henri Matisse — the first on the West Coast — primarily drawn from two local private collections. Many of the featured paintings and sculptures are later donated to the museum, forming the core of an exceptional collection of Fauvism. The San Francisco Museum of Art becomes one of the first museums to recognize photography as a fine art by establishing, under the guidance of Curator John Humphrey, a collection of photographic works. The museum organizes its first architecture exhibition, Telesis: Space for Living, a landmark effort that prompts the city of San Francisco to establish an office of planning. Fifty member countries convene in the War Memorial Veterans Building to establish the United Nations Charter. With its galleries commandeered for delegates and press, the museum relocates to a temporary facility on Post Street from March through July. The museum presents Jackson Pollock’s first solo museum exhibition. Pollock’s early masterpiece Guardians of the Secret (1943) is added to the collection. The Women’s Board establishes the Rental Gallery (later known as the Artists Gallery). The first program of its kind in the country, it expands the collecting base in the Bay Area and creates a vibrant sales venue for local artists."
