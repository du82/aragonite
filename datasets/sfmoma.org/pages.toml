["https://sfmoma.org/about"]
title = "About SFMOMA"
description = "It takes many people to run a museum, from our director, Christopher Bedford, to our curators and fund-raisers. See how we’re organized."
full_description = "The San Francisco Museum of Modern Art is one of the largest museums of modern and contemporary art in the United States and a thriving cultural center for the Bay Area. Our remarkable collection of painting, sculpture, photography, architecture, design, and media arts, is housed in an LEED Gold-certified building designed by the global architects Snøhetta and Mario Botta. In addition to our seven gallery floors, SFMOMA offers 45,000 square feet of free, art-filled public space open to all. Welcome! SFMOMA believes the art of our time is vital and shares it with passion and purpose, and that art and the creative process can open minds and help build a better world. For that reason, we assemble unparalleled collections, create exhilarating exhibitions, and develop engaging public programs that connect with our community. It takes many people to run a museum, from our director, Christopher Bedford, to our curators and fund-raisers. See how we’re organized."
