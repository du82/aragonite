["https://www.sfmoma.org/event/free-live-jazz-concert-ft-heavy-arts-ensemble"]
title = "SFMOMA · Free Live Jazz Concert ft. Heavy Arts Ensemble"
description = "Looking for a Sunday afternoon groove? Celebrate the inaugural SF Music Week with a free concert by Heavy Arts Ensemble in partnership with SFJAZZ!"
full_description = "Looking for a Sunday afternoon groove? Celebrate the inaugural SF Music Week with us and enjoy a free concert! SFMOMA and SFJAZZ are excited to announce our joint participation in SF Music Week 2025, a new initiative co-produced by Noise Pop, SF Live, and the San Francisco Office of Economic and Workforce Development (OEWD) to celebrate the city’s rich tradition of music and strengthen this sector’s growth and economic vitality. This citywide celebration, from February 24 to March 2, spotlights the past, present, and future of San Francisco’s renowned music scene. Heavy Arts Ensemble is a collective of Bay Area musicians. Through a collage of extended melodic improvisation, live sampling, modular synthesis, live visuals, and the outer edges of experimental lo-fi beats, ambient jazz, and drone, Heavy Arts Ensemble seeks to push deep grooves into trance-inducing states. The collective features a rotating lineup alongside core members Justin Esposito (double bass), Joel Reber (saxophones), Diego Mungia (modular sampler) and Melanie Marie (live visuals). *No reservations needed. Seats are available on a first-come, first-served basis. Accessible seating is available at this event. Concert attendance does not include museum admission. If you would like to visit the galleries, please purchase museum tickets."
