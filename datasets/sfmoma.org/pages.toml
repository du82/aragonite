title = "Director + Departments · SFMOMA"
description = "Christopher Bedford was appointed the Helen and Charles Schwab Director of the San Francisco Museum of Modern Art (SFMOMA) in 2022. Bedford is recognized as an innovative and dynamic leader, with a career focused on increasing community engagement and creating programs of national and international impact. During his nearly two decades in the museum field, Bedford has organized or co-organized numerous major exhibitions, commissions and projects with artists including Mark Bradford, Chris Burden, Mickalene Thomas, Lisa Yuskavage, Jack Whitten, Melvin Edwards, Pipilotti Rist, and Al Loving."
