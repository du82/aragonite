["https://www.sfmoma.org/rental-events/facility-rental-faq"]
title = "Event Planning Resources · SFMOMA"
description = "San Francisco Museum of Modern Art"
full_description = "The approved caterers below offer a variety of menus and price ranges, as well as excellent food and exceptional service. SFMOMA requires the use of approved caterers for all events. No outside caterers may be used. Each caterer listed below is familiar with our venue, policies, and procedures, and will carry our required insurance, health permits, and liquor liability insurance. Please contact the Rentals Team at (415) 915-1777 or fill out the online inquiry form (https://www.sfmoma.org/facility-rentals/send-inquiry/). We can place a tentative hold on a date for up to three weeks. During this time, another group can challenge your hold by paying a percentage of the rental fee. If another group challenges your hold, we will contact you via phone and email, and you will have 48 business hours to book the date. If you do not book the date, we will release your hold. In order to challenge a hold, a payment of 50% of the estimated rental fee must be submitted to the Rental Events Department. The payment acts as a deposit for a specific date. Once the payment has been received, the holding party will be contacted, and they will have 48 business hours to either book the space or release their hold. The museum’s smallest rentable space is 3,000 square feet and is ideal for groups of 100-200. The museum does not have smaller meeting rooms available to rent. Yes, the museum is available for all-day events with option to do load-in the day prior if available. We require a non-refundable 50% initial payment of the estimated rental fee along with the signed contract when a client commits to booking a space. Site visits may be scheduled during museum business hours Mon-Fri 9am-4pm with the Rentals Team. Site visits are by appointment only and required at least 48 hours notice. Virtual Tours are also available. All rentals fees include security guards, engineers, janitorial services, and an on-site event manager. Depending on the space being rented, coat check may or may not be included."
