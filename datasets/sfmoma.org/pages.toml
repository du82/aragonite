["https://www.sfmoma.org/exhibition/ruth-asawa-retrospective"]
title = "Ruth Asawa: Retrospective · SFMOMA"
description = "Member tickets now available! General public tickets go on sale March 11. Become a member to enjoy early access, members-only hours, and free tickets.   Ruth Asawa: Retrospective will present the full range of the artist’s groundbreaking practice, offering an in-depth look at her expansive output and its inspirations through more than 300 artworks. It […]"
full_description = "General public tickets go on sale March 11. Become a member to enjoy early access, members-only hours, and free tickets. Ruth Asawa: Retrospective will present the full range of the artist’s groundbreaking practice, offering an in-depth look at her expansive output and its inspirations through more than 300 artworks. It will also explore the ways her longtime San Francisco home and garden served as the epicenter of her creative universe and highlight the ethos of collaboration and inclusivity that informed her numerous public sculpture commissions and unwavering dedication to arts advocacy. Asawa’s signature looped-wire sculptures will share gallery space with lesser-known works that bring insight into the relentlessly experimental nature of her artistic vision. In addition to Asawa’s own work, the exhibition will include a select number of works by peers and mentors with whom Asawa engaged in creative dialogue, including Josef Albers and Imogen Cunningham. Artist Ruth Asawa creates a woven wire sculpture and discusses other sculptural forms in her home studio in this 1978 film footage. Excerpts from Robert Snyder’s film Ruth Asawa: Of Forms and Growth © Masters & Masterworks Productions, Inc. All rights reserved www.mastersmasterworks.com Ruth Asawa: Retrospective is an exhibition partnership between the San Francisco Museum of Modern Art (SFMOMA) and The Museum of Modern Art, New York (MoMA). The exhibition is co-curated by Janet Bishop, Thomas Weisel Family Chief Curator and Curator of Painting and Sculpture, SFMOMA and Cara Manes, Associate Curator, Department of Painting and Sculpture, MoMA; with Marin Sarvé-Tarr, Assistant Curator, and William Hernández Luege, Curatorial Associate, Painting and Sculpture, SFMOMA; and Dominika Tylcz, Curatorial Assistant, Department of Department of Painting and Sculpture, MoMA. At the San Francisco Museum of Modern Art, lead support is provided by Randi and Bob Fisher, the Mimi and Peter Haas Fund, Diana Nelson and John Atwater, and Helen and Charles Schwab."
