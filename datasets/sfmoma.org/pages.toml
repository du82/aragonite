["https://www.sfmoma.org/about/our-expansion-2016"]
title = "Our Expansion · SFMOMA"
description = "Take a look inside the new SFMOMA. From photos of our building looking like our collection to stories about the fabrication of the locally produced facade, stay up to date with our expansion in preparation for our opening on May 14, 2016."
full_description = "After a three-year closure, the newly transformed and expanded San Francisco Museum of Modern Art (SFMOMA) opened its doors to the public on May 14, 2016. Purpose-built to showcase the museum’s celebrated collection, the new SFMOMA was designed by renowned architecture firm Snøhetta. With nearly three times more gallery space than before, the museum opened with 19 inaugural exhibitions, including a curated selection from the distinguished Doris and Donald Fisher Collection, the first presentation of works promised through the Campaign for Art, nearly a full floor devoted to the Pritzker Center for Photography, cherished favorites from SFMOMA’s permanent collection, and works specially commissioned for the new museum. SFMOMA now includes nearly 45,000 square feet of art-filled free public spaces, and offers free admission for all visitors 18 and younger in perpetuity. .swiper-container-255591 .swiper-wrapper{ height:auto;}@media only screen and (min-width: 768px){.swiper-container-255591 .swiper-wrapper{ height:400px;}}"
