["https://shamelessplug.app/pricing"]
title = "Pricing | Shameless Plug"
description = "A privacy focused ad management service for your apps, websites and others."
full_description = "Simple Pricing. No Suprises. Shameless Plug offers a free tier for development purposes and light usage of 500 API calls/month. Once you're ready to commit, please select a plan that fits you. Save 20% Yearly Plan € 200/year Simple, yearly payment unlocking all features of Shameless Plug. No additional charges for Client's Portal. Paying yearly means you save 20% of the normal price. Monthly Plan € 20/month A perfect plan for users wanting to take it slowly. You will unlock all Shameless Plug features without the yearly commitment. You can always upgrade to yearly once ready. Get started with Shameless Plug → All paid plans include: Flat fee and no hidden or additional charges Unlimited Client Portals Ad scheduling Unlimited ads and categories Unlimited API keys Unlimited data retention Image CDN and image resize options Developer friendly API Statistics shown on ads and categories pages Email reports (weekly & monthly) (coming soon) Great documentation and support Professional infrastructure Supporting a bootstrapped business that is not VC funded You will always have access to your data no matter your subscription status. We collect VAT, on top of the set price, for customers based in Europe. Is this not what you were looking for? In case you would like to create your own ad space and display messages or shoutouts to your viewers but you are not planning on offering your ad space to clients, we recommend using Shoutouts. Shoutouts is a free service created by Vincent Ritter that will give you pure 'ad hosting' experience without the Client Portal and some advanced features. The service is free of charge but not free of development cost. If you like it, we strongly encourage you to support Vincent's work."
year_published = 2025
