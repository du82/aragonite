title = "About – Shamrock Show Stables"
description = "Located in beautiful central Florida, Shamrock Show Stables offers full-service boarding, alongside detail-oriented training programs for hunters and jumpers. Our farm is conveniently located in northwest Ocala, offering a unique setting where you can enjoy the time you commit to your horse and work toward your personal riding goals. Founded by professional rider and trainer,…"
full_description = "About Located in beautiful central Florida, Shamrock Show Stables offers full-service boarding, alongside detail-oriented training programs for hunters and jumpers. Our farm is conveniently located in northwest Ocala, offering a unique setting where you can enjoy the time you commit to your horse and work toward your personal riding goals. Founded by professional rider and trainer, Caitlin Maloney, we pride ourselves on exceeding the standards in show-horse management with top training and care. We are passionate about bringing each horse and rider to their full potential with a positive and holistic approach. Shamrock Show Stables takes advantage of the beautiful grass turn-out and Florida sunshine to keep your horse relaxed and happy. Our barn sits atop rolling hills, featuring large pastures, level riding areas, and a spacious cinderblock barn with temperature-controlled tack room. Horses are monitored on site daily, which includes, but not limited to : feeding and mucking, grooming at least once a day, pasture turn-out, tacked/ untacked for riding, tack cleaning, scheduling and consulting with vets / farriers, etc. Our goal is to bring horses and riders to horse shows, both locally and nationally, feeling ready to perform at their very best! Share this:TwitterFacebookLike Loading..."
