full_description = "Back in Judges’ box : Aiken Fall at Bruce’s Field April 19, 2022ShamrockShowStablesLeave a Comment on Back in Judges’ box : Aiken Fall at Bruce’s Field After about a year and a half away from learner-judging, due to COVID restrictions as well as staying busy with the group of horses and riders in training during 2021, I made arrangements to judge in Aiken at Bruce’s Field after returning home from showing at Capital Challenge last fall. I attended the October 27-31 show with ‘R’s Robert Crandall and Claudia Roland. Despite being a little rusty myself, it was a fabulous horse show and great to get back in the swing of judging with two top veterans. Bruce’s Field is a top facility, from the stabling to the arenas and jumps. The staff was over the top friendly and helpful. During the week, I checked off a few more requirements that allowed me to apply for my ‘r’ hunters license! From the judges’ box, a rainbow at sunrise the first morning of the show — A welcome from Bruce Duchossois Share this:TwitterFacebookLike Loading... Related Published by ShamrockShowStables World-class Hunter / Jumper Training in the Heart of Florida's Horse Country View all posts by ShamrockShowStables Categories: Uncategorized Post navigation Previous USEF Suspension of Competition Next Final show as an applicant: Florida Horse Park"
