["https://shamrockshowstables.com/author/shamrockshowstables"]
title = "ShamrockShowStables – Shamrock Show Stables"
description = "World-class Hunter / Jumper Training in the Heart of Florida's Horse Country"
full_description = "Final show as an applicant: Florida Horse Park April 19, 2022ShamrockShowStablesLeave a Comment on Final show as an applicant: Florida Horse Park To round out my experience as a licensed-official applicant, I spent a weekend at the Florida horse park in Ocala during the January AIR Horse shows. I needed a few more days judging equitation classes, as there are only certain classes that fulfill applicant requirements. Of course, the list of qualifying classes has changed since I first began the process in 2019. The list of approved equation classes has evolved with the creation of new 3’3″ junior and / or amateur classes, as well as more 3′ Eq classes, which has become more and more competitive. This year also saw some adjustments in the approved equitation tests as the industry leaders make adjustments for modern riding expectations. In addition to equitation classes, I also sat on board to judge a National Hunter derby for the third time, which I always enjoy. The classes are a little more fast paced and you really get to see some horses in top form, so there are big scores to give out. This week, I spent full days with T. Lyman Whitehead, Phillip Long, and sat in for the derby with Diane Grod. I absorbed new information and tools. The management ran a great show and makes new improvements here every year. I’m proud to say that this show allowed me to finish the checklist to allow me to apply for licensure. With the help of the licensed official committee, all of the judges, the horse show staffs, and an inner-drive to stay committed to this process, I have earned my ‘r’ licensed and look forward to getting back out to the judge’s box! Categories: Uncategorized Back in Judges’ box : Aiken Fall at Bruce’s Field April 19, 2022ShamrockShowStablesLeave a Comment on Back in Judges’ box : Aiken Fall at Bruce’s Field After about a year and a half away from learner-judging, due to COVID restrictions as well as staying busy with the group of horses and riders in training during 2021, I made arrangements to judge in Aiken at Bruce’s Field after returning home from showing at Capital Challenge last fall. I attended the October 27-31 show with ‘R’s Robert Crandall and Claudia Roland. Despite being a little rusty myself, it was a fabulous horse show and great to get back in the swing of judging with two top veterans. Bruce’s Field is a top facility, from the stabling to the arenas and jumps. The staff was over the top friendly and helpful. During the week, I checked off a few more requirements that allowed me to apply for my ‘r’ hunters license! From the judges’ box, a rainbow at sunrise the first morning of the show — A welcome from Bruce Duchossois Categories: Uncategorized"
