["https://shamrockshowstables.com/training"]
title = "Training – Shamrock Show Stables"
description = "Balance, Harmony, Strength, and Grace in our Equine Aspirations . . . A coach is someone whose hindsight can be your foresight. Shamrock Show Stables' training programs are designed to bring out the best in our hunter/ jumper horses and riders while competing at shows locally and nationwide. Caitlin Maloney is the head trainer, and…"
full_description = "Training Balance, Harmony, Strength, and Grace in our Equine Aspirations . . . A coach is someone whose hindsight can be your foresight. Shamrock Show Stables’ training programs are designed to bring out the best in our hunter/ jumper horses and riders while competing at shows locally and nationwide. Caitlin Maloney is the head trainer, and a USEF/USHJA licensed ‘r’ judge in hunter and equitation, pursing her ‘R’ status. Caitlin is both fun and rewarding to work with as she helps her riders pursue their competitive goals in systematic and detail-oriented programs. Drawing from her years of experience as a respected trainer in top show barns across the country, you can expect a sophisticated and thoughtful approach to achieving the most from your partnership with your horse. As a coach and instructor, not enough can be said about the positivity that she gives students. Riding is challenging — both physically and mentally. It takes a good balance of pressure and challenge, as well as reward and encouragement, to evoke harmony between a horse and rider combination. Through patience, positivity, and creative-thinking, our lesson and training programs produce qualities of strength, grace, and confidence in horse and rider. A sought-after professional and well-rounded horsewoman, Caitlin established herself and honed her skills while working for barns such as Balmoral (CA), Don Stewart Stables (FL), Split Rock Farm (KY), and Olde Welbourne (Chicago, IL). She has thorough riding experience and a solid background working with a wide range of different horses’ abilities and temperaments. From winners at Devon and Indoors, to off-the-track thoroughbreds and young horses, Caitlin is able to take on and manage many types of show horses and develop their potential. She takes pride in treating every horse in the barn as her own. Shamrock students compete both at National ‘A’ Shows throughout the country as well as local non-rated shows. We like to attend a variety of shows to stay fresh, on our game, and most importantly, have fun. Contact Caitlin today! We are now accepting new customers! Schedule a tour and meeting today by contacting Caitlin directly. (Links at the top of the page.) Shamrock Show Stables | Caitlin Maloney Share this:TwitterFacebookLike Loading..."
