title = "Building a microsite using GraphQL, CraftCMS and 11ty"
full_description = "One Sunday I was having breakfast with a friend and got talking about team structures and how projects vary. It was a really useful discussion and I felt that other people might find conversations like that useful too, this idea very quickly became Interviews by Shane Hudson. I began building it that day and within just over a week I published the website with five interviews. In this post I want to explain some of my thought processes. I have worked on so many side projects that never got off the ground due to being over-engineered or just took too much time to make, so I knew I wanted to take a simple approach. I also try to always learn or practise something every time I make a side project, that way even if no one ever sees it it is still useful to me. These two principles drove the choices behind building the site. The first step was to decide if the interviews should go in a category on my personal site or if it should be a thing of its own. Originally I thought about getting a domain for it to be its own site but if there is anything I've learned over the years it is that having lots of domain names is expensive to maintain. So that left me thinking it should go on my site but I felt it would be nice to keep them separate so the focus is clearly on the interviews and it would give me the opportunity to play around with the design and building it. Now I had my excuse, a project that required it's own site and some content. For a while now I've been, mainly due to Andy Bell, interested in trying 11ty. It is a static site generator written in JavaScript. This means you can have layout files and content files that are built to HTML files. It also means you can have a lot of control of how that happens using JavaScript, particularly with where the content comes from or how it is parsed. Okay, so that sounds doable... but I already have a CMS on my personal site, so I started thinking maybe this was all a mistake and I was once again over-engineering a side project. Then I had a brilliant idea, I had already paid the $59 for the CraftCMS GraphQL plugin (CraftQL) a while back when I made my Bookmark Uploader. After all, one of 11ty's biggest advantages is you can write JavaScript to access a data source. So that's what I did, I decided to hook 11ty up to my personal site using GraphQL so it was essentially a microsite that is fast and self contained but uses my existing CMS as a data source so I don't have content all over the place."
