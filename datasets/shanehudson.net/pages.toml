["https://shanehudson.net/articles/2013/a-job-for-life"]
title = "A Job For Life?"
full_description = "On the 22nd of April 2013, I noticed some reactions on Twitter to an article written by Aditya Chakrabortty for the Guardian. Please do read his article before the rest of mine. It is not a secret that I am generally not a fan of most newspapers due to how opinionated they often are so I wasn't planning to write about it but over the past few days I have been mulling the article over and decided to share my views. Young appmakers can't count on a job for life Brits force-fed the language of enterprise and no-jobs-for-life are now putting it into practice and getting precisely nowhere The title and sub-heading alone are enough to give me a bit of a gripe. Now, I should note that Aditya does have a point and it is something I have been saying for a few years now but it appears that he is targeting the blame at the wrong people and certainly makes a very bold statement in the title. What does he even mean by young app makers? The article certainly focuses on mobile apps, although it only mentions Apple. It is not true that every app is on the Apple app store and it certainly is not definite that Apple will be the lead app store for the rest of the developer's life. Making apps, especially for one demographic, is never intended to be for life. In fact, I am sure that it is only the minority of people that want to work on the same project for their whole life anyway! Aditya goes on to say that there is a lot of money in apps but only focuses on the big deals. Sure Instagram sold for a billion dollars and there have been hundreds of other massive deals, but who cares about that? A job for life doesn't have to make you a millionaire, does it? The majority of 'appmakers' are either working on their own projects (which may or may not be successful.. it really doesn't matter) or getting a good wage. Oh and guess what? The people working on their own apps can always find work in one of the many places that are looking for employees. I would like to take note of the term 'appmakers'. That is not really a term. What is an app maker? There are three roles that Aditya might mean, he might mean all three as one person perhaps? Those roles are: developer, designer, entrepreneur. If Aditya means that entrepreneurs do not have a job for life, then I can see where he is coming from. But the people who make the apps are the developers, often with a lot of help from the designers. These people do have jobs for life."
year_published = 2013
