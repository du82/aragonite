["https://shanehudson.net/articles/2013/trekking-the-great-wall-of-china-for-make-a-wish"]
title = "Trekking The Great Wall Of China For Make-A-Wish"
full_description = '''Update: We have one week left to raise the 2,500. I just donated 200 myself but we still have 800 to raise. We have already raised 1,700... so that should be easy! Please donate, share and ask your friends and family to donate. Also a massive thanks to everybody that has already donated... whether big or small amounts, thanks so much! Let's start with the charity itself. What they do is kind of in the title Make-A-Wish grants wishes to young people aged between 3 and 17 that have life threatening conditions. There are a lot of incredible charities out there that aim to cure particular conditions, Make-A-Wish take a slightly different approach, in that they oversee the logistics of giving these children an experience. Memories. Many of these children rarely leave the hospital, or experience life away from their condition, so Make-A-Wish uses the money raised to organise trips to Disneyland or to let a child meet their favourite actor/actress on the set of a film. When I have said this before, some people have said "Surely if it is a wish of a child in that condition, people would do it for free". Well yes, of course many would but the problem, in most cases, is getting the medical equipment and expertise to go with the child while they are travelling. Like I said, this is largely a logistics operation But it is a logistics operation that gives a once in a lifetime experience to children who really need and deserve it. Hopefully you can see why I am so passionate about this particular charity. There are so many that do amazing stuff, but Make-A-Wish use all of the money raised to deliver experiences and just by reading through the stories you can see that they really do deliver on their promise of making wishes come true. By now, it is quite likely that you will have seen that, in August, I will be trekking parts of the Great Wall of China to raise money for Make-A-Wish Foundation UK. To celebrate raising 1,500 (60% of the target, well done everyone!) I would like to take some time to explain who they are, as well as some brief details of the trip, etc.'''
