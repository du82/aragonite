["https://shanehudson.net/articles/2013/altitude"]
title = "Altitude"
full_description = "Update 2013/03/15: Audio is available! I went to the Altitude conference last night. Got back in at 6am so that just proves it was a good night! It was based up at Spinnaker Tower, I had never been up the tower before and was amazed by the stunning view of Portsmouth (it was dark so there were lights everywhere). Enjoyed the night and wanted to keep a reminder so thought I would write a blog post (blame Jeremy Keith!). The night started with a couple of drinks and getting to know people, before we moved up to the top for interviews with Robin Christopherson and Mike Kus. The interviewer was none other than Paul Boag, so it was extremely entertaining! I have heard Robin's name and seen it around the web associated with accessibility, but I have never known anything about him or heard him speak. Wow. He had me on the edge of my seat, in just 15 or so minutes he was able to explain things such as problems we have had in the past, what we have already and what could happen in the future. Most things that help disabled people the most are designed and developed to aide 'temporary disability' such as bluetooth phone through car speakers rather than designed purely for people with permanent disabilities. Apple products generally have amazing accessibility. We all know about Voice Over, but I had no idea that on iOS you can get audio feedback about how many faces are in frame if you are taking a photo etc. There are even apps that Robin uses to check if the lights are turned on or off. And that is not even counting Siri. Google Glass. We all love the idea, or most of us do, but Robin was extremely excited about it, the heads-up display is what we think of but he thinks of the audio feedback and a camera that is always looking where you are looking that can provide useful feedback. Wow. He even mentioned doing a Google Hangout or Skype if you need help from someone that can see what you are looking at! I know Mike fairly well, he is a great guy and incredible designer. However, I have never seen him speak. Really interesting! Most of us try to stick to a tight deadline and know exactly what we are doing Mike just jumps into it and works on it until it looks great. To most people, this makes no business sense but he wants every site to be his best, and it works."
