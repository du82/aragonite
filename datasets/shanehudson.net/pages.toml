["https://shanehudson.net/articles/2014/shane-hudson-and-the-magic-of-real-life"]
title = "Shane Hudson and the Magic of Real Life"
full_description = "The vast majority of you that knew me when I was younger will remember the near-unhealthy nature of my obsession with the Harry Potter books. That obsession ended up having a very positive impact on my life, though that is a story for another day. Today I would like to talk about real life magic. Not fantasy books, not even magic tricks - real life magic. Now, before you start calling me delusional, please let me explain. Im currently working in a laboratory, a place of science. During one lunch break, I mentioned how incredible I find clouds. The way they form, how they look like a painting in the sky. Whether they are dark rain clouds or wispy, they all have such character that I just adore. I noted what a strange phenomenon they are. As you can imagine, that got quite a few weird looks and one of my colleagues questioned me, as if to try to explain the physics of clouds. Now, Im not a scientist myself but I have a pretty good understanding of many areas of physics (indeed, I once seriously considered a career in Quantum Physics - well, more precisely Quantum Computing). I do understand how clouds are formed. But they still feel magical to me, in the same way as rainbows feel magical despite simply being refractions of light in the water droplets. This is not a post about some delusional idea that magic and sorcery exists, it is more of a love letter to physics. You see, magic tricks can be incredible - there are some extraordinarily talented magicians. But as soon as you learn the trick, the magic disappears (although there may also be some extra respect for how the trick was pulled off so well). Physics is quite the opposite. When you have no idea how rainbows are formed, you might think Oh, thats a very pretty rainbow or even wonder how they are formed. But the fact that they are refractions, turning the light into its visible components, in millions of rain droplets that you happen to see due to being at a particular place at a particular time, looking in the particular direction while the earth is at a particular angle to the sun… that is incredible. In fact, since rainbows are not even *real* (whatever that means), even if there are a hundred people standing with you looking at the rainbow, they are all seeing different rainbows! Even each eye is seeing a different rainbow. Now thats one magic trick that wont be getting boring any time soon!"
year_published = 2014
