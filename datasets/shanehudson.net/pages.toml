["https://shanehudson.net/articles/2019/halloween-quiz-with-pumpkin-buzzers"]
title = "Halloween Quiz with Pumpkin Buzzers"
full_description = '''Every year I see all the incredible Halloween projects that people make. I've never had much opportunity to play around with hardware so it always feels like too big of a task to try. This year however I had a Raspberry Pi Zero W on the side and a small bit of time to make something. As with all my side projects I wanted to use the time to learn something new. We decided to have a little Halloween party so I knew I had to make something that could be used for that. I spent a while browsing Hack A Day and saw a video of pumpkins being used as a synth. It seemed really cool but would have cost a fair bit so I wanted to keep the costs low and not have to buy much. So I just bought an Adafruit 8-Key Capacitive Touch Sensor Breakout board, for £10 including postage, to make buzzers for a quiz where each team's buzzer would be a real pumpkin that would have individual buzzer sounds. Once it arrived I quickly connected it all up... and low and behold... nothing. I reached out to my friend Dave who informed me at once that every single connection I had soldered on the headers of the Raspberry Pi was a cold joint. I had no idea what that meant! Thankfully Dave was extremely kind and let me use his tools and guided me on how to solder well. After 10 minutes it felt like I got the hang of it and everything went well. You can see the finished "product" in this video, four pumpkins hooked up so they had a unique buzzer per team. We managed the hide the wires quite nicely, thanks to the table being wood slats so plenty of gaps. The Raspberry Pi Zero W and the breakout board were taped to the underneath of the table with black bin bags hiding it all. Okay so this may feel like a bit of a tangent, but it was the majority of my time for this project. For a few weeks I had been learning React from Wes Bos' course and Tyler McGinnis' course. I learned a lot from these but I do find I have to have a project of my own to really put it into action. So I decided to make the project with a web portion that would run on my laptop or tablet (more on that later) and a device portion that would run on the Raspberry Pi.'''
year_published = 2019
