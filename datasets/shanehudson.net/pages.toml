["https://shanehudson.net/articles/2015/what-i-read-in-2015"]
title = "What I Read in 2015"
full_description = '''At the beginning of the year I planned to track all the books that I read, that has not yet become a habit so I may have missed some from this list. They are not in an order of any kind, but I have tried to rate them to the best of my memory. I did not read as many books as I normally do, as I was focussed on finishing university and "going out into the real world" but I got through the 14 books of The Wheel of Time, which I loved! I remember being recommended this book by friends while I was at school but I never got around to it, possibly due to the very childish front cover. However I finally decided to read it just before Christmas and I almost finished it in a single sitting. This book is written from the viewpoint of a 15 year old with Asperger's Syndrome and he is very literal. The storyline of the book is essentially his journey while writing the book. It starts off as a murder mystery of a neighbours dog and soon spirals out of control into a really fun and upsetting adventure. Absolutely worth reading and I regret waiting so long! This is the only book series I have ever read that I felt at absolute peace, ecstasy even, when I finished reading it. There are 14 books and a prequel. I barely stopped reading them, they were absolutely incredible. It is a high fantasy, in which all the main characters go from minor people to some of the most important people in the world. In that respect, it isn't very believable... it is also full of magic, so some people won't like it. However if you do like fantasy, this series is perfection. It feels very familiar, it has parts of Eragon and Harry Potter and other stories but it is such a large universe that there are still twists throughout the books. I was skeptical that Hardboiled Web Design would stand the test of time, but I read it because Andy asked me to give him feedback to help him write the new edition. Five years is a long time when it comes to CSS. Even the design trends change very quickly, let alone the actual technologies. However, the original edition was very forward thinking and cutting edge at the time so it actually wasn't too bad at all. Sure, there were some things that have changed quite a bit but it did not have me cringing while I read it.'''
year_published = 2015
