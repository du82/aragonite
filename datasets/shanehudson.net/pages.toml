["https://shanehudson.net/articles/2015/book-review-for-the-journal-of-functional-programming"]
title = "Book Review for the Journal of Functional Programming"
full_description = '''Review of "Learn You Some Erlang For Great Good! A Beginner's Guide", by Fred Hbert, no starch press, 2013. This book is marketed as a beginners guide to Erlang and it does do a brilliant job at teaching the basics; however through a perfect blend of humour and nitty gritty details, Hbert has written an outstanding guide to learning Erlang. This is a book written for people that have heard of Erlang or the power of functional languages, but have not yet "dipped their toes into" it. Throughout the book there are sections titled Dont drink too much kool-aid which are used to explore the common misconceptions and pitfalls that are often encountered when learning Erlang. As a newcomer to the language, I found these sections particularly interesting because Hbert used the sections to be very forthcoming about the advantages and disadvantages of the language. The production quality of the book is high, with illustrations and sketched diagrams on most pages. It is part of the same series as Learn you a Haskell for Great Good and so has a brightly coloured front page with a purple multitasking octopus that sets the tone of the entire book: fun and packed full of knowledge. The inner pages are all black and white, supposedly to keep the costs down, but it is laid out in such a way that the lack of colour is really not an issue, the illustrations are just as entertaining in black and white. At just under 600 pages long, it is not a quick read but Hberts conversational style of writing makes it easy and fun to read. As the book is fairly large, it is often not suitable for travelling so I found it very useful that the entire book is freely available online at https://learnyousomeerlang.com/content. As a textbook, it has a good order of topics and a logical flow in how it explains the concepts and syntax. For example, in the first chapter it starts with using the shell as a calculator and quickly gets into explaining how variables cannot be changed and that atoms are the same value as their name. From this point he is able to quickly explain pattern matching within tuples because of the way he already explained the nature of variables in Erlang. It also has a good approach to learning, as each section has parts (such as the kool-aid sections) that the reader can either skip or read to gain more insight as they wish. Many books for beginners tend either to stay at a very basic level or to have a steep learning curve. In this book each chapter has a smooth learning curve, in the same way he quickly went from variables to pattern matching, taking the reader from the absolute basics all the way through to unit testing, sockets and the organisation of large programs. Throughout the book, Hbert focuses on explaining the concepts and makes it feel that the syntax that is scary to a beginner is actually just a quirk of the language. There are no exercises for the reader to do alone, but there are many small little examples that make sure the reader understands the concepts. This constant encouragement and focus on the concepts makes the language far easier to learn. That said, it may not be for everybody. This book is conversational and has a narrative from beginning to end, it is meant to be read all the way through, therefore it is not quite so good as a reference guide. That said, the index pages do include syntax from operators to binary strings and match specifications so it does make it easy to dip into the book when you have forgotten the quirky syntax.'''
year_published = 2015
clearnet = "https://shanehudson.net/articles/2015/book-review-for-the-journal-of-functional-programming"
