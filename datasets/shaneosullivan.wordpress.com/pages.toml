description = "In case you're working with the Origin Private File System on a browser whose dev tools don't yet support browsing the files (all browsers as of Nov 2023, though Chrome does have an unofficial extension which is nice), then here's a code snippet you can use to list all the contents of the file system.…"
full_description = "How to list all files in a browser’s Origin Private File System (OPFS) Shane O'Sullivan Technical November 28, 2023August 27, 2024 1 Minute In case you’re working with the Origin Private File System on a browser whose dev tools don’t yet support browsing the files (all browsers as of Nov 2023, though Chrome does have an unofficial extension which is nice), then here’s a code snippet you can use to list all the contents of the file system. Great for working on Safari, Firefox etc, though of course native support in the browsers would be much preferred. listDirectoryContents = async (directoryHandle, depth) => { depth = depth || 1; directoryHandle = directoryHandle || await navigator.storage.getDirectory(); const entries = await directoryHandle.values(); for await (const entry of entries) { // Add proper indentation based on the depth const indentation = ' '.repeat(depth); if (entry.kind === 'directory') { // If it's a directory, log its name // and recursively list its contents console.log(`${indentation}${entry.name}/`); await listDirectoryContents(entry, depth + 1); } else { // If it's a file, log its name console.log(`${indentation}${entry.name}`); } } } Share this:ShareFacebookTwitterLike Loading... Related TaggedFirefoxopfssafari Published by Shane O'Sullivan I am a software engineer and manager from Ireland. I spent 7 years working in Ireland from 2003 – 2010, then ten years in Silicon Valley from 2010 to 2020. In California I spent about 6.5 years at Facebook Engineering, the last three of which I was an engineering manager in the Ads organisation focusing on customer facing products for creating and managing ads. At Stripe I built the Developer Productivity organisation, with teams that were responsible for the use of the Ruby language, testing infrastructure, documentation, developer tooling (e.g. IDE integrations) and more. At Promise, I was Head of Engineering from 2018 – 2020, responsible for building the first few iterations of our products, hiring for all product roles, meeting with clients and investors, and anything else needed to get a tiny startup bootstrapped and successful. Now I’m back in Ireland, working on my next company. Coming soon (as of early 2023!). This blog contains my various musings on all things technical/interesting on the interweb and beyond. View all posts by Shane O'Sullivan Published November 28, 2023August 27, 2024"
