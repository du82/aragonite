full_description = "Quick chicken soup recipe for sick people Thanks to ChatGPT for this recipe with no stupid SEO in it. Total time to make: 80 minutes if you’re a normal slow chopper of vegetables (like me), 50 minutes if you’re super fast with a knife. For a simple chicken soup with potatoes, you’ll need the following ingredients: 500g (1 lb) chicken breast or thighs, cut into bite-sized pieces 4 medium potatoes, peeled and diced 1 large onion, chopped 2 cloves of garlic, minced 1.2L (6 cups) chicken broth or stock 1 teaspoon salt (adjust to taste) 1/2 teaspoon black pepper 2 tablespoons olive oil or butter Optional: chopped fresh parsley or dill for garnish Here’s how to make it: In a large pot, heat the olive oil or butter over medium heat. Add the chopped onion and garlic, sautéing until they’re soft and fragrant, about 2-3 minutes. Add the chicken pieces to the pot and cook until they’re no longer pink on the outside, about 5-7 minutes. Add the diced potatoes to the pot along with the chicken broth. Bring the mixture to a boil. Once boiling, reduce the heat to a simmer and cover the pot. Let it simmer for about 20-25 minutes, or until the potatoes are tender. Season the soup with salt and pepper. Taste and adjust the seasoning as necessary. Serve hot, garnished with chopped fresh parsley or dill if desired. Here’s how it looked when I made it for my 7 year old. She got some of it down the first time and liked it, then had more as she felt better. No need to read this bit, look after yourself/your person. But yeah, I hate all the recipes online these days that bury what you really want under mountains of SEO crap. So, while my blog is almost exclusively tech, every now and then I have a sick kid and no bloody patience for that SEO nonsense so this is the recipe that worked for me thanks to ChatGPT, and now I can easily find it forever! Share this:ShareFacebookTwitterLike Loading... Shane O'Sullivan Food Leave a comment February 17, 2024February 17, 2024 1 Minute"
