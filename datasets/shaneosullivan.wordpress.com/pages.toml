2); colours.forEach((color, index) => { const stopPosition = index / (colours.length - 1); gradient.addColorStop(stopPosition, color); }); context.fillStyle = gradient; context.fillRect(x1, y1, x2 - x1, y2 - y1); Normally the code above would fill the entire rectangle with the gradient colours. However we prevent this by using the very cool globalCompositeOperation property on the Canvas context. By setting it to the value “source-in”, any modified pixels are only actually changed if the existing pixel is already non-transparent. So in this case, only the black pixels we previously drew are now drawn with the gradient colours, achieving the goal of rapidly filling any shape at all with a linear gradient. Step 4 Finally, when the user lifts their pen/finger, the main thread draws the OffscreenCanvas to the main user canvas using the code userCanvasContext.drawImage(offscreenCanvas, 0, 0); and the operation is complete: the user canvas now has the selected shape filled with the gradient colours. Note that you must use the drawImage function to get the image data out of the OffscreenCanvas. You cannot use other operations as you would in a user thread Canvas, such as getting the ImageData from the Canvas context object. Try it out I’ve put an example implementation of this online for you to try out. The demo is at https://shaneosullivan.github.io/example-gradient-fill/ The source code is at https://github.com/shaneosullivan/example-gradient-fill Epilogue If you’re still here, thanks for following along, and give Kidz Fun Art a try – it’s packed full of goodies, all built using the best that the web and my kids’ imaginations have to offer. Share this:ShareFacebookTwitterLike Loading... Related Published by Shane O'Sullivan I am a software engineer and manager from Ireland. I spent 7 years working in Ireland from 2003 – 2010, then ten years in Silicon Valley from 2010 to 2020. In California I spent about 6.5 years at Facebook Engineering, the last three of which I was an