["https://shanesnover.com/2022/08/09/debugging-ros-integration-tests.html"]
title = "Debugging Failures in ROS Integration Tests | Shane’s dev blog"
description = "Today I found myself debugging a CI pipeline failure involving a ROS1 integration. And it was not convenient."
full_description = "Debugging Failures in ROS Integration Tests Aug 9, 2022 | 2-minute read Today I found myself debugging a CI pipeline failure involving a ROS1 integration. And it was not convenient. Unfortunately, the CI pipeline at work is making use of catkin test and when you use caktin test, it suppresses all of the output. One approach that’s typically advised is to edit your roslaunch file to specify a launch-prefix, like is shown here. As you can see, there’s actually quite a few permutations as most people do not develop their ROS nodes to daemonize and instead rely on a program like screen to keep their process running and accessible. I find reaching the exact invocation in the launch-prefix to be pretty inconvenient since I’m usually running a byobu session on a remote host. If I don’t remember to set up the X server ahead of time it needs to use screen and that can conflict with byobu. What I really want anyway is all of the fluff out of the way so I can see the backtrace. Turns out it is pretty easy! You’ll need to run roscore in some process as roslaunch and/or catkin are doing that for you, but after that you can invoke your node just like any other binary. It can most likely be found under <CATKIN_WS>/devel/lib/<PACKAGE_NAME>/<NODE_NAME>. The only additional piece of info you need is the node name being passed in the roslaunch file for the test, otherwise ros::init will crash. Then you can do: $ gdb <relative path to binary>/<binary filename> <snip all of the gdb print out> (gdb) r __name:=NODE_NAME I’m partly writing this post because I find the syntax of the argument passing to be hard to remember since it’s very non-standard (to avoid conflicting with normal user arguments I suspect). I can’t find any documentation of this syntax anywhere either, but it works with ROS1 Noetic and likely many recent versions of ROS1."
year_published = 2022
year_updated = 2022
