["https://shanesnover.com/iot-arduino-course/print.html"]
title = "Introduction to Internet of Things with Arduino and Python"
full_description = '''Introduction to Internet of Things with Arduino and Python About the Course This course is an introduction to developing networked embedded systems. It will walk you through writing a program to collect data from a sensor with an Arduino UNO, sending that data to a computer over a serial connection, and then logging that data into a database. By the end of this tutorial, you'll have a system collecting temperature data and reporting it to a database from which you can view historic plots of the data. This will give you a template from which you can record almost any type of data you could think of and get it into a saved format which can be easily analyzed later or for which actions can be triggered in real-time. Notes On Using this Book Asynchronously I originally wrote and developed this for the purpose of instructing the content live with hardware provided and an instance of the database accessible over LAN. If you're interested in following along remotely, check out the appendix items for a list of hardware you'll need to purchase and a non-comprehensive guide to setting up InfluxDB with Docker. This Book is a Living Document If you find a mistake, a broken link, or an opportunity to provide a better explanation, please file an issue on this course's GitHub repository! Knowledge to Have Before the Course This course assumes a small amount of prerequisite knowledge. While the content should be accessible if you've not programmed in Python or C++ before (the two languages the provided code are written in), the course will not explain the basics of programming. If you're taking the course with me in person, I've provided the hardware and no changes should be required. However if you're following along remotely, you'll need to be comfortable using a breadboard and perhaps soldering. If you're new to programming, I suggest following along with the earlier chapters of Automate the Boring Stuff with Python by Al Sweigart. You can find the online version here. This will instruct you on how to install the tools, basics of programming like variables and functions, and basic concepts about the operating system and resources it makes available to you. If you've new to electronics, Adafruit has put together a simple guide to getting started with Arduino and electronics in general. Naturally, they'll sell you a kit to do so, but similar kits are also available on Amazon or Sparkfun and from stores like Microcenter. I recommend shopping around as they contain various different kinds of hardware. Adafruit's course can be found here. A Little About Myself I've been developing embedded systems in industry for several years now working on smart home systems as well as in robotics. This is a field I've found to be very approachable for hobbyists and students due to the vast amount of information available online and the relatively low monetary cost of entry. I write about my projects in robotics and systems programming on my website if you're curious about my other projects or want updates as I write more courses (maybe). Install Prerequisites This page will walk you through installing all of the tools required for building the code for the Arduino and running the Python script on your host system. Arduino IDE I won't repeat too much information here which could easily go out of date and instead refer to Arduino's documentation for installing the Arduino IDE. Instructions there are available for Windows, macOS, and Linux. Verify your installation by opening the IDE, creating a new sketch, and navigating the menu to Tools -> Board -> Arduino AVR Boards -> Arduino UNO. This is the board we'll be focusing on in this course. Then select the checkmark button in the top left and verify that the output window eventually finishes printing and shows something like below: Sketch uses 444 bytes (1%) of program storage space. Maximum is 32256 bytes. Global variables use 9 bytes (0%) of dynamic memory, leaving 2039 bytes for local variables. Maximum is 2048 bytes. Ubuntu 22.04-based Linux Distros A quick note that if you're using an unofficial Arduino, you'll find that the device does not actually mount as it's supposed to. If you run lsusb you might see an entry for CH340 or CP210x USB drivers, but no device at /dev/ttyACM0 or /dev/ttyUSB0. By default Ubuntu 22.04 and distributions based on it ship with a Braille reader software called brltty which is aggressive in claiming devices it thinks are Braille readers. In dmesg, you might see something like this as a symptom: input: BRLTTY 6.4 Linux Screen Driver Keyboard as /devices/virtual/input/input31 usb 1-8: usbfs: interface 0 claimed by ch341 while 'brltty' sets config #1 ch341-uart ttyUSB0: ch341-uart converter now disconnected from ttyUSB0 If you are not blind and no one who is blind is using your computer, feel free to uninstall it: sudo apt remove brltty. If you want to keep the software on your system for one reason or another, try: sudo systemctl stop brltty-udev.service sudo systemctl mask brltty-udev.service sudo systemctl stop brltty.service sudo systemctl disable brltty.service Or if you use a Braille screen reader, you might just try editing the udev rules at /usr/lib/udev/rules.d/85-brltty.rules. For the CH340 (with USB VID and PID of 1a86:7523), remove the corresponding entry: # Device: 1A86:7523 # Baum [NLS eReader Zoomax (20 cells)] ENV{PRODUCT}=="1a86/7523/*", ENV{BRLTTY_BRAILLE_DRIVER}="bm", GOTO="brltty_usb_run" Python and pip Similarly, for installing python3 and pip, there are great directions available. Here is a link to Python's documentation for installation on various operating systems. Verify your installation in two parts. First, python: python3 --version And then pip: python3 -m pip -V Both commands will print the versions of python3 and pip respectively. Once both of those are installed, create a new folder for your project, something like iot_course, and inside download this file. Save it as requirements.txt. Then you can run python3 -m pip install -r requirements.txt from that directory to install the Python libraries we'll be using in this course. Python Development Environment Feel free to develop and execute the python code in whatever way is most comfortable for you. However, if you've never written python before, I recommend a free program called VSCode for editing and running. Downloads for all platforms are available here. Once you've finished installing, navigate to the Extensions tab in the left column sidebar (icon shows three blocks together and an additional block by itself). There is an extension by Microsoft for Python which gives convenient ways of running Python scripts. Blinking an LED We'll get started on the Arduino side of things first since that will eventually be the source of the data. This is always a useful first step no matter how experienced you are with embedded systems as it verifies that your compiler and flashing toolchain is functional and that the basics of your hardware setup are correct. Luckily the Arduino UNO has an LED onboard for expressly this purpose. Open your new sketch in the Arduino IDE, call it temperature_sensor or something like that. This should give you a file with two functions defined: setup and loop. Rather than defining a main function yourself, Arduino typically tries to hide some of these details in their attempt to be more user-friendly. I usually leave the loop function empty and treat setup as my main function. This means you don't need to define every as a global variable (since there's otherwise no way to reference variables in both functions). Source Code Let's start with this implementation to get an LED blinking, I'll explain what each line is doing down below. void setup() { const int LED_PIN = 13; pinMode(LED_PIN, OUTPUT); bool led_state = false; while (true) { digitalWrite(LED_PIN, led_state); led_state = !led_state; delay(5000); } } The code can be explained in two parts. First we have the initialization step, making a constant variable with a good name of LED_PIN and assigning it to 13 since the Arduino's onboard LED is pin D13. We have to configure that GPIO pin on the microcontroller as an output (instead of an input) so that we can set that GPIO pin to logical high or low states (5 volts or 0 volts respectively). This is done with the pinMode function, whose documentation can be found here. Finally, we create a variable to represent the current state of the LED (false meaning off). Next there's the looping code which will run forever as long as the board is powered (due to while (true) {}). In here, we use digitalWrite to set the LED's pin to our current LED state, then we flip the LED state with boolean logic. Finally, we add a delay since otherwise it would blink so fast that we'd never see it. The delay function takes an argument of milliseconds, so in this case there will be 5 seconds between changes to the LED. Flashing Code to the Arduino Use the Verify (checkmark) to compile the C++ source code (make sure you've chosen your Board first) and wait for a successful compile. If you've missed a semicolon or have another type of syntax error, the Output window on the bottom will show red text explaining the error that prevented compiling. It will also show warnings here in yellow text which can provide clues if your code doesn't function how you expect. Plug in the board's USB cable to your computer and select the board's port via Tools -> Port. On Windows, it will be something like COM1. On Linux, it will be something like /dev/ttyACM0. On Mac, it will be something like <TODO>. Once the port is chosen, you can flash the board with Upload button (has an -> in its icon). A successful Upload will have text like this in the Output window: avrdude: AVR device initialized and ready to accept instructions Reading | ################################################## | 100% 0.00s avrdude: Device signature = 0x1e950f (probably m328p) avrdude: reading input file "/tmp/arduino/sketches/E9A94DB52016B8DEAFA0AB134D40CC04/sketch_sep3a.ino.hex" avrdude: writing flash (882 bytes): Writing | ################################################## | 100% 0.14s avrdude: 882 bytes of flash written avrdude done. Thank you. You should now see a blinking LED on your Arduino. Verify the period of the blinking matches what you expect with a watch or by counting. You can also change the 5000 to some other numbers and re-upload to verify that it updated. Reporting Data Over Serial Next, we're going to cover getting data off the Arduino and onto devices that talk to it. This is what actually makes an embedded system an Internet of Things (IoT) device. The device needs to be connected, directly or indirectly, to the network in some way such that other applications can make use of the data it produces or send commands to the device. The technology we'll be making use of here is called serial (or UART if you want to research the details). I'll not be explaining in-depth how serial works here. Instead I'll be focusing exclusively on how we are to use it and what it provides us. Serial is means of sending data between two devices as a series (keyword here) of bytes. Back in the day, many desktop computers had hardware on board for talking to serial devices directly (using a DB-9 connector), but on modern hardware we usually connect to serial devices over USB. Fortunately, the Arduino has the circuitry on board in order to send serial data over USB. For this chapter, we'll be looking exclusively at how to send data from the Arduino using serial. We'll use the Arduino IDE's Serial Monitor tool to see the information we send. See the next chapter for writing a program to actually receive that data and do something with it. From last chapter, we're starting here: void setup() { // Initialization const int LED_PIN = 13; pinMode(LED_PIN, OUTPUT); bool led_state = false; // Main loop while (true) { digitalWrite(LED_PIN, led_state); led_state = !led_state; delay(5000); } } To the initialization section, we'll be adding some code for setting up the Arduino's serial hardware: // Initialization // --snip-- Serial.begin(115200); Serial.println(); Serial.println("info: booting"); while (true) { // --snip-- I've omitted most of the code from before, but make sure to add this new code above the while loop. Here, we tell the microcontroller to start up the serial port hardware with Serial.begin(115200);. Specifically, we're telling it to start up with a baud rate of 115200 bits per second. This is the frequency of serial communication and you don't need to give it much thought other than to remember that number since it's important that both devices talking serial are operating with the same frequency. Next, we use the serial port to send some simple text (or strings) to any device listening on the other side. Go ahead and compile (verify) and flash (upload) that code. Then open the Serial Monitor (Tools -> Serial Monitor in the Arduino IDE menu). In the serial monitor, select 115200 baud in the rightmost dropdown menu. If you forget, and have something like 9600 baud, you'll probably see some question mark-like characters. You'll also need to hit the button marked "Reset" on your Arduino to see the boot message we added to initialization. This is because connecting the Serial Monitor doesn't actually reboot the program and our program has been running since the flashing completed! Next up, let's print the status of the LED in our main loop! // --snip-- while (true) { digitalWrite(LED_PIN, led_state); Serial.print("LED state: "); if (led_state) { Serial.println("ON"); } else { Serial.println("OFF"); } led_state = !led_state; delay(5000); } Notice that for the first statement I used Serial.print instead of Serial.println! The difference between these two is that println does everything print does, except it also sends a special character sequence which means that the next data sent should be printed on the next line. If you're familiar with strings in C, you'll know that this is either \n or \r\n. The details of that aren't incredibly important just yet, but making use of print and println effectively can make reading data in the Serial Monitor easier. When you build and run the code, you should see something like this in your Serial Monitor: info: booting LED state: OFF LED state: ON LED state: OFF LED state: ON LED state: OFF LED state: ON Congratulations! You've taken the first steps towards reporting data from hardware to your computer! In the next chapter we'll switch gears and focus on using Python to read that data. The full Arduino code up to this point is shown below: void setup() { // Initialization const int LED_PIN = 13; pinMode(LED_PIN, OUTPUT); bool led_state = false; Serial.begin(115200); Serial.println(); Serial.println("info: booting"); // Main loop while (true) { digitalWrite(LED_PIN, led_state); led_state = !led_state; Serial.print("LED state: "); if (led_state) { Serial.println("ON"); } else { Serial.println("OFF"); } dela'''
