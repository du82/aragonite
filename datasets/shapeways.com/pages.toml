["https://shapeways.com/3d-print-material-technology/material-jetting"]
title = "Material Jetting (MJ)- 3D Printing Material - Shapeways"
description = "Learn about Shapeways’ Material Jetting process, which takes inkjet technology to the industrial additive manufacturing level. Shapeways leverages Material Jetting for many 3D printing applications."
full_description = "The Material Jetting Process The MJ process begins as small, multi-nozzle printheads spray hundreds of micro-droplets of resin onto the print bed for immediate curing of the liquid material through ultraviolet light. This continues layer by layer, until 3D printing of the desired part and accompanying support structures are complete. Material Jetting Printers Material Jetting 3D printers at Shapeways range in build volume from 490 mm x 390 mm x 200 mm (Stratasys J750) to 495 x 495 x 300 mm (Mimaki 3DUJ-553), with layer thickness averaging 32 microns for full-size models. Advanced features like multiple print heads offer efficiency, accuracy, and superior resolution for full-color 3D prints. 3D Systems ProJet MJP 3D printers feature a build volume of up to 282 mm x 181 mm x 150 mm for Smooth Fine Detail Plastic. Fine Detail Plastic This versatile photopolymer offers good detail, high dimensional accuracy, and smooth surfaces. Especially good for products requiring good aesthetic quality, Fine Detail Plastic is translucent. Also known as Frosted Detail Plastic or Resin-Based Acrylic Plastic, this material is typically well-suited for: • Models • Master patterns for molds • Jewelry prototypes Explore the design guidelines for Fine Detail Plastic High Definition Full Color Printed on the Mimaki 3DUJ-553, High Definition Full Color allows for over 10 million color choices in eye-popping color and fine detail. Post-processing like overcoating is available too. This material is often used for: • Architectural models • Tabletop gaming miniatures • Medical models • Photorealistic visual prototypes Explore the design guidelines for High Definition Full Color Multi-Color Polyjet Printed on the Stratasys J750 3D printer, Polyjet technology offers over 500,000 colors, to include clear plastic and other combinations for translucent and opaque colors, along with full color. This material is recommended for: • Medical models • Highly detailed prototypes • Visual aids • Displays Explore the design guidelines for Multi-Color Polyjet"
