["https://shapeways.com/3d-print-material-technology/binder-jetting"]
title = "Binder Jetting 3D Printing - Shapeways"
description = "A powerful 3D printing technology, Binder Jetting relies on one or more nozzles to build green parts which emerge in a delicate state until being cured. Create complex geometries with speed and precision."
full_description = "What’s so special about this technology? With the added capability for 3D printing with metal powders and alloys too, high-performance prototypes and parts can be manufactured efficiently; however, there is also the opportunity to create complex geometries never before possible with conventional technology. Like Selective Laser Sintering (SLS), support structures are not required in metal Binder Jetting either. This is due to the intrinsic support provided by unused powder bolstering parts during printing. Stainless Steel 316L Stainless Steel 316L is 3D printed with Triple Advanced Compaction Technology by ExOne, in partnership with Shapeways. This material is unique as a corrosion-resistant single alloy, offering high strength that extends to extreme temperatures too. Shapeways customers use this material for the following industrial applications: Mechanical machinery, surgical tooling, heat exchangers, and fasteners and brackets. Stainless Steel 316L is available in a natural finish, blasted with ceramic media for a slightly rough surface and a matte finish. It is also offered in a polished finish, with 3D printed parts tumbled for a smooth surface. For this material, 3D models must meet the following minimum and maximum bounding box sizes: Bounding Box Min: 15 x 15 x 3 mm Bounding Box Max: 127 x 127 x 76.2 mm Find out more about the design guidelines for Stainless Steel 316L Steel Steel materials from Shapeways are 60% stainless steel and 40% bronze matrix material, and are recommended for strong metal parts that require an industrial look and feel. This material is recommended for consumer products at any size, including applications like tools and accessories, home decor, and small goods requiring intricate structures. This metal is available in the following colors: Bronze, gold, nickel, bronzed-silver, and black. A matte finish is available for Steel, featuring an unpolished, rough surface. A polished finish is also offered for shiny, smooth parts; however, note that parts larger than 150 x 150 x 150 or those with thinner details will be finished with bead blasting instead to avoid breakage. This may also present a rougher, less consistent result. For this material, 3D models must meet the following minimum and maximum bounding box sizes: Bounding Box Min: 6 x 6 x 3 mm Bounding Box Max: 762 x 393 x 393 mm (Bronzed-Silver, Bronze, Black), 178 x 178 x 178 mm (Gold, Nickel), 152 x 152 x 76 (Polished models), 178 x 178 x 178 (Plated models) Find out more about the design guidelines for Steel"
