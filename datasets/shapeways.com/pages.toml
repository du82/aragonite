title = "3D Printing Materials: Plastic, Metal, and More - Shapeways"
description = 'Make custom products in plastic, metal, full color and more high quality 3D Printing Materials. Design, Prototype and Sell with Shapeways."'
full_description = '/*! elementor - v3.6.5 - 27-04-2022 */ .elementor-heading-title{padding:0;margin:0;line-height:1}.elementor-widget-heading .elementor-heading-title[class*=elementor-size-]>a{color:inherit;font-size:inherit;line-height:inherit}.elementor-widget-heading .elementor-heading-title.elementor-size-small{font-size:15px}.elementor-widget-heading .elementor-heading-title.elementor-size-medium{font-size:19px}.elementor-widget-heading .elementor-heading-title.elementor-size-large{font-size:29px}.elementor-widget-heading .elementor-heading-title.elementor-size-xl{font-size:39px}.elementor-widget-heading .elementor-heading-title.elementor-size-xxl{font-size:59px}Materials for every stage of any project /*! elementor - v3.6.5 - 27-04-2022 */ .elementor-widget-text-editor.elementor-drop-cap-view-stacked .elementor-drop-cap{background-color:#818a91;color:#fff}.elementor-widget-text-editor.elementor-drop-cap-view-framed .elementor-drop-cap{color:#818a91;border:3px solid;background-color:transparent}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap{margin-top:8px}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap-letter{width:1em;height:1em}.elementor-widget-text-editor .elementor-drop-cap{float:left;text-align:center;line-height:1;font-size:50px}.elementor-widget-text-editor .elementor-drop-cap-letter{display:inline-block} From strong plastics to polished metals, Shapeways’ materials can bring your 3D print ideas to life. Binder JettingIn Binder Jetting, a binder is selectively deposited onto the powder bed, bonding these areas together to form a solid part one layer at a time. The materials commonly used in Binder Jetting are metals, sand, and ceramics that come in a granular, powder form. /*! elementor - v3.6.5 - 27-04-2022 */ .elementor-widget-image{text-align:center}.elementor-widget-image a{display:inline-block}.elementor-widget-image a img[src$=".svg"]{width:48px}.elementor-widget-image img{vertical-align:middle;display:inline-block} Stainless Steel 17-4PH – 3D Printing Material Learn More Stainless Steel 316L – 3D Printing Material Learn More Steel – 3D Printing Material Learn More Fused Deposition Modeling (FDM)Fused Deposition Modeling (FDM) is a popular 3D printing technique that builds objects layer by layer using a thermoplastic filament. The filament is melted in a heated nozzle and deposited onto a build platform, where it solidifies to create the desired shape. Known for its affordability and versatility, FDM is widely used for prototyping, functional parts, and hobbyist projects. FDM – ABS Learn More FDM – ASA Learn More FDM – PC Learn More FDM – PET Learn More FDM – PETG Learn More HP Multi Jet Fusion [MJF]Multi Jet Fusion (MJF) begins with a thin layer of powdered material being deposited across the build platform. Droplets of fusing and detailing agents are applied along with thermal energy on top of the powdered material to define the part’s geometry. Full Color Nylon 12 – 3D Printing Material Learn More Nylon 12 Glass Beads [PA12 GB] – 3D Printing Material Learn More Nylon12 – [PA12] – 3D Printing Material Learn More Thermoplastic Polyurethane [TPU] – 3D Printing Material Learn More Laser Powder Bed Fusion Metal (LPBF-M)Selective Laser Melting (SLM) process uses a laser to scan and selectively melt the metal powder particles, bonding them together and building a part layer-by-layer. Aluminum – 3D Printing Material Learn More Material JettingMaterial Jetting operates in a similar fashion to 2D printers. In material jetting, a printhead (similar to the printheads used for standard inkjet printing) dispenses droplets of a photosensitive material that solidifies under ultraviolet (UV) light, building a part layer-by-layer. High Definition Full Color – 3D Printing Material Learn More MJP – Visijet – 3D Printing Material Learn More Selective Laser Sintering [SLS]Selective laser sintering (SLS) uses a laser as the power source to sinter powdered material, aiming the laser automatically at points in space defined by a 3D model, binding the material together to create a solid structure. Nylon 11 [PA11] – 3D Printing Material Learn More SLS – Nylon 12 [PA12] Learn More Thermoplastic Elastomer [TPE] – 3D Printing Material Learn More Stereolithography [SLA]Stereolithography (SLA) creates parts in a layer by layer fashion using photochemical processes by which light causes chemical monomers to link together to form polymers. Those polymers then make up the body of a three-dimensional solid. Accura® 60 – 3D Printing Material Learn More Accura® Xtreme™ 200 – 3D Printing Material Learn More Wax Casting3D printing technologies create a smooth wax pattern, which is used to create casting molds to produce precious metal parts. Brass – 3D Printing Material Learn More Bronze – 3D Printing Material Learn More Copper – 3D Printing Material Learn More Gold – 3D Printing Material Learn More Gold Plated Brass – 3D Printing Material Learn More Platinum – 3D Printing Material Learn More Rhodium Plated Brass – 3D Printing Material Learn More Silver – 3D Printing Material Learn More Stay up to date on promotions, case studies, and more. Sign Up Now'
