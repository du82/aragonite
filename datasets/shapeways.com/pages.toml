tware and digital manufacturing technologies eliminate design, development and production barriers, improving the quality, lifespan and sustainability of each part, product or machine we help bring to life. Quality Products Shapeways’ digital manufacturing engine streamlines our customers supply chain, lowers manufacturing barriers and expedites delivery of quality 3D printed products. We distribute all products ourselves, and we deploy stringent inspections to ensure consistently high quality of all outgoing products. Shapeways operates according to ISO:9001, IATF 16949, and ISO 14001 standards. 21+ Million Parts Shapeways offers 12 additive manufacturing technologies and a large suite of materials and finishes to a wide range of customers, from engineers to large enterprises in sectors such as automotive, aerospace, architecture, medical technology, and semiconductors. We provide complete on-demand management of each or all services, offering value added Services such as reverse engineering, design, production, finishing, and drop shipping, as needed. Our Management & Founding Team /*! elementor - v3.6.5 - 27-04-2022 */ .elementor-widget-tabs.elementor-tabs-view-vertical .elementor-tabs-wrapper{width:25%;-ms-flex-negative:0;flex-shrink:0}.elementor-widget-tabs.elementor-tabs-view-vertical .elementor-tab-desktop-title.elementor-active{border-right-style:none}.elementor-widget-tabs.elementor-tabs-view-vertical .elementor-tab-desktop-title.elementor-active:after,.elementor-widget-tabs.elementor-tabs-view-vertical .elementor-tab-desktop-title.elementor-active:before{height:999em;width:0;right:0;border-right-style:solid}.elementor-widget-tabs.elementor-tabs-view-vertical .elementor-tab-desktop-title.elementor-active:before{top:0;-webkit-transform:translateY(-100%);-ms-transform:translateY(-100%);transform:translateY(-100%)}.elementor-widget-tabs.elementor-tabs-view-vertical .elementor-tab-desktop-title.elementor-active:after{top:100%}.elementor-widget-tabs.elementor-ta