title = "MJF 3D Printing - Multi Jet Fusion 3D Printing - Shapeways"
description = "Learn about 3D printing material polypropylene (PP), a versatile choice for a wide range of automotive, consumer, industrial and medical applications."
full_description = "3D Printing Speed, Quality, and Customization Relatively new, unveiled by HP in 2016, Multi Jet Fusion 3D printing stands apart due to its capacity for powerful production. MJF runs neck and neck with Selective Laser Sintering (SLS) technology but is not reliant on laser heat, and adhesion is not based on glue. Instead, one layer of powder is deposited onto the next, 80 microns at a time, as an inkjet array goes back and forth, separately releasing fusing and detailing agents onto the powder. Thermal heat melts the layers together completely, resulting in faster production, and greater output in comparison to other popular methods like Fused Filament Fabrication (FFF) or SLS. Parts are well-defined with more stable mechanical properties and sophisticated interlocking parts can be printed in one piece without any need for post assembly. While size is limited to the volume of the printer, many different pieces can be printed in each build--nested horizontally and vertically--and then fitted together later if necessary. MJF PA12 This material is commonly relied on for superior strength and elasticity, making it suitable for highly functional parts. MJF PA12 parts are also chemical- and water-resistant. Because of its outstanding flexibility, MJF PA12 is suited for applications like: Mechanical and structural components Architectural designs and home decor Drone parts Fixtures Eye frames Jewelry Prosthetics Explore the design guidelines for MJF PA12 MJF Plastic PA12 Glass Beads This unique material is filled with 40% glass beads, offering superior stiffness, and also helping to prevent warping in larger or flatter parts. MJF PA12GB is also used for applications that require great strength, to include: Tooling Robotics Drones Medical braces Housings and cases Explore design guidelines for MJF PA12GB Polypropylene (PP) This material is also offered for 3D printing with MJF technology. Ideal for a wide range of products, PP offers superior resistance to chemicals, low-moisture absorption, and is extremely durable for long-term use. HP High Reusability PP enabled by BASF is ideal for applications like piping, fluid systems, and containers. Other good examples of products made with PP include: Medical devices like braces or respirator equipment Prototypes for automotive test applications Electronic devices Explore design guidelines for Polypropylene (PP)"
