["https://shapeways.com/materials/copper"]
title = "Copper 3D Printing Material Information - Shapeways"
description = "Learn everything about 3D printing in Copper: tips, design rules, technical documentation, and product examples and inspiration."
full_description = "Copper is 100% copper formed through a lost wax casting process. It has a red-orange color that oxidizes over time turning the surface a darker brown, blue, or greenish color depending on the environment. Each copper part is 3D printed in a wax material which is used to create a mold for investment casting. Lost wax casting is capable of showcasing intricate details, offering a professional, finished look and feel that oxidizes over time creating a corrosion resistant boundary layer on the surface of the part. Internal detail can not be polished, well-reachable surfaces will be polished therefore tight internal spaces may remain unpolished. More information about this material can be found in our Help Center. The bounding box is a 3D imaginary outline of a box that encloses the smallest area occupied by your model. Your model must be within the minimum and maximum bounding box sizes. If the size of the model is close to the maximum bounding box, then the printing orientation will be restricted. A supported wall is connected at least on two sides of the wall, while an unsupported wall is connected only on one side of the wall. Walls that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wall geometry of the model. Please consider the size of your model and reinforce the walls or add support structures as needed as minimum guidelines will not always be adequate for large models. A wire is a circular, rectangular or even triangular feature that is thinner in its unconnected directions than its length. A supported wire is connected at least on two sides of the model, while an unsupported wire is connected on one side of the model. Wires that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wire geometry of the model. Please consider the size of your model and reinforce the wires or add support structures as needed as minimum guidelines will not always be adequate for large models."
year_published = 2025
year_updated = 2024
clearnet = "https://shapeways.com/materials/copper"
