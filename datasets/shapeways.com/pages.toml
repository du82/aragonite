["https://shapeways.com/materials/bronze"]
title = "Bronze 3D Printing - Shapeways"
description = "Learn everything about 3D printing with Bronze: tips, design rules, technical documentation, and product examples and inspiration."
full_description = "Bronze is a copper-tin alloy featuring a deep red color, similar to rose gold. Jewelry, accessories, and home decor are all popular applications for use with Bronze 3D printing. This metal material exhibits a subtle marbling effect with silvery highlights, giving each piece unique character with a vintage look. Composed of 10% Tin and 90% Copper, Bronze 3D printing materials are capable of showcasing intricate details, and offering a professional, finished look and feel. This material will tarnish over time, but can be polished back to achieve a like-new surface. Internal detail can not be polished, well-reachable surfaces will be polished therefore tight internal spaces may remain unpolished. More information about this material can be found in our Help Center. The bounding box is a 3D imaginary outline of a box that encloses the smallest area occupied by your model. Your model must be within the minimum and maximum bounding box sizes. If the size of the model is close to the maximum bounding box, then the printing orientation will be restricted. A supported wall is connected at least on two sides of the wall, while an unsupported wall is connected only on one side of the wall. Walls that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wall geometry of the model. Please consider the size of your model and reinforce the walls or add support structures as needed as minimum guidelines will not always be adequate for large models. A wire is a circular, rectangular or even triangular feature that is thinner in its unconnected directions than its length. A supported wire is connected at least on two sides of the model, while an unsupported wire is connected on one side of the model. Wires that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wire geometry of the model. Please consider the size of your model and reinforce the wires or add support structures as needed as minimum guidelines will not always be adequate for large models."
