["https://shapeways.com/materials/aluminum"]
title = "Aluminum 3D Printing - 3D Printed with Aluminum - Shapeways"
description = "Models made from 3D printed aluminum are strong and precise. The material is recommended for its strength, stiffness, low weight, and high accuracy. Learn more here."
full_description = "Aluminum 3D printing material is both lightweight and strong, recommended for functional parts requiring durability, stiffness, and high accuracy. Aluminum 3D printing relies on Selective Laser Melting (SLM) technology. Aluminum or 3D printed aluminum (alloy AlSi10Mg, 10% Silicon 0.5% Mg) offers great corrosion resistance, making it an ideal material for outdoor applications, also providing high electrical and thermal conductivity. 3D printed aluminum can be machined, milled and tapped too. More information about this material can be found in our Help Center. The bounding box is a 3D imaginary outline of a box that encloses the smallest area occupied by your model. Your model must be within the minimum and maximum bounding box sizes. If the size of the model is close to the maximum bounding box, then the printing orientation will be restricted. A supported wall is connected at least on two sides of the wall, while an unsupported wall is connected only on one side of the wall. Walls that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wall geometry of the model. Please consider the size of your model and reinforce the walls or add support structures as needed as minimum guidelines will not always be adequate for large models. A wire is a circular, rectangular or even triangular feature that is thinner in its unconnected directions than its length. A supported wire is connected at least on two sides of the model, while an unsupported wire is connected on one side of the model. Wires that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wire geometry of the model. Please consider the size of your model and reinforce the wires or add support structures as needed as minimum guidelines will not always be adequate for large models. For text, the ratio between width and depth, should be 1:1 and sans-serif fonts are preferred for line weight consistency."
year_published = 2025
year_updated = 2024
