["https://shapeways.com/3d-print-material-technology/wax-casting"]
title = "3D Print Lost Wax Casting - Shapeways"
description = "Shapeways customers can choose from a range of metals for Wax Casting, including brass, bronze, copper, gold, platinum, and silver. Learn relevant applications and criteria for 3D models."
full_description = "3D Printing and Lost Wax Casting Casting with metal is multifaceted, and usually includes numerous, careful steps. At Shapeways, the process is accompanied by modern technology like 3D printing to make wax patterns for building plaster molds. Sprues are added so that metal can flow through, as the initial wax is melted and drained, thus explaining the term lost wax casting. Once the metal cools and is solidified, the plaster is broken away from the mold. The metal product is detached, and from there, post-processing begins. This may include tumbling to polish the metal piece, or where applicable, it may be plated; for example, metals like Brass can be plated in Gold or Rhodium. Brass This material is made up of a copper alloy containing 15% zinc, 5% tin and 80% copper. Used for products with intricate details, Brass tarnishes but can be polished for a shiny surface with a professional, finished look and feel. This material is available in Gold Plate and Rhodium also. Both Natural and Polished finishes are available. Brass is suitable for applications like prototypes, jewelry, home accessories, and miniatures. For this material, 3D models must meet the following minimum and maximum bounding box sizes: Bounding Box Min: 2.4 × 2.4 × 0.6 mm Bounding Box Max: 89 × 89 × 100 mm, 75 × 75 × 40 mm for Interlocking Parts Explore the design guidelines for Brass Bronze A copper-tin alloy, 10% tin and 90% copper, Bronze is famous for its deep red color. This metal also presents a marbling effect, with silver highlights that offer a vintage look. Used for products with intricate details, Bronze tarnishes but can be polished for a like-new surface. Both Natural and Polished finishes are available. Bronze is suitable for applications like jewelry, fashion, home decor, and prototypes. For this material, 3D models must meet the following minimum and maximum bounding box sizes: Bounding Box Min: 2.4 × 2.4 × 0.6 mm Bounding Box Max: 89 × 89 × 100 mm, 75 × 75 × 40 mm for Interlocking Parts Explore further design guidelines for Bronze"
