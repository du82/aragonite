px;line-height:1;margin-bottom:15px}.elementor-slides .swiper-slide-inner .elementor-slide-description{font-size:13px;line-height:1.4;margin-bottom:15px}} Michael Martel, Product Development, My Track TechnologyRobotics 3D PrintingUnless you have $100,000 or more to invest in an SLS or HP printer you will never have the quality, robustness, precision and surface finish of a Shapeways part.Eli Lazar, CTO and Co-Founder of SNOOZConsumer 3D PrintingThe Shapeways printing service has really been instrumental to the success of our product and company. We used Shapeways to print probably 100+ variations of our product to perfect the acoustics and create our signature sound.Drone 3D PrintingBy using Shapeways, Kespry is able to quickly iterate to meet evolving customer needs while maintaining reasonable costs.LuxMea StudioMedical 3D PrintingWe have been working with Shapeways since early 2016 and Shapeways has always been our trusted and go-to partner for commercial 3D printing production. The Shapeways Advantage Collaboration for Unique Requirements Let us help with any other unique design and manufacturing requirements—whether that involves specialized facilities or taking on additional certifications to help your business meet its goals. Fast Turnaround Working on a project for a customer that has to be just right? Get models back fast, and 3D print new iterations when necessary for final feedback and production. Reliable Quality Proprietary processes, expert 3D printing operators, and inspections are our secrets to delivering exceptional, quality products every time. if (jQuery('.elementor-editor-active').length == 0) { jQuery(document).ready( () => { jQuery('.fullwidgetlink').each(function( index ) { jQuery(this).css('cursor', 'pointer'); jQuery(this).on('click', (event) => { location.replace(jQuery(event.target).closest('.fullwidgetlink').find('a').attr('href')); }) }); }); } Leading-Edge Manufacturing Technology We use the most advanced manufacturing technology and 