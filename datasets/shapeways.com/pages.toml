["https://shapeways.com/3d-print-material-technology/fused-deposition-modeling-fdm"]
title = "Fused Deposition Modeling - [FDM] - Shapeways"
full_description = "Cost Effective, Variety Of Materials and Colors FDM is valued for its affordability, ease of use, and compatibility with a wide range of materials, including PLA, ABS, PETG, and specialized composites. It excels in producing functional prototypes and end-use parts with good strength and durability. FDM’s limitations are its surface finish and resolution compared to our other 3D printing methods, and parts can exhibit anisotropic properties due to the layer-by-layer construction. The FDM process Fused Deposition Modeling (FDM) is an additive manufacturing process where a thermoplastic filament is heated to its melting point and extruded through a nozzle to create precise layers. The nozzle or build platform (depending on the machine) moves along defined axes while the nozzle extrudes material, forming the part layer by layer according to a digital 3D model. A unique feature of the FDM process is that some machines can use multiple materials during the build process deploying multiple nozzles. Another unique feature is the ability to infill parts to create strength while reducing weight and cost."
year_published = 2025
year_updated = 2025
