["https://shapeways.com/materials/fdm-asa"]
title = "FDM - ASA - Shapeways"
description = "A high-performance, weather-resistant thermoplastic ideal for outdoor applications - FDM"
full_description = "ASA (Acrylonitrile Styrene Acrylate) is a robust and weather-resistant thermoplastic, making it an ideal choice for various outdoor applications. Renowned for its durability and stability, ASA is engineered to withstand harsh weather and maintain its integrity over time. A wide variety of colors is available and can be printed at request. Parts will be printed and priced in uploaded orientation. When uploading a part, take into consideration how orientation affects strength in different directions, the amount of support needed, and print time. More details about orientation and print quality can be found in our Help Center. The bounding box is a 3D imaginary outline of a box that encloses the smallest area occupied by your model. Your model must be within the minimum and maximum bounding box sizes. If the size of the model is close to the maximum bounding box, then the printing orientation will be restricted. A supported wall is connected at least on two sides of the wall, while an unsupported wall is connected only on one side of the wall. Walls that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wall geometry of the model. Please consider the size of your model and reinforce the walls or add support structures as needed as minimum guidelines will not always be adequate for large models. A wire is a circular, rectangular or even triangular feature that is thinner in its unconnected directions than its length. A supported wire is connected at least on two sides of the model, while an unsupported wire is connected on one side of the model. Wires that do not meet the minimum requirements may not survive printing and cleaning processes. Additionally, models may still be rejected based on the wire geometry of the model. Please consider the size of your model and reinforce the wires or add support structures as needed as minimum guidelines will not always be adequate for large models."
year_published = 2025
year_updated = 2025
clearnet = "https://shapeways.com/materials/fdm-asa"
