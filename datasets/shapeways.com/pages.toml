["https://shapeways.com/3d-print-material-technology/selective-laser-sintering"]
title = "SLS 3D Printing - Selective Laser Sintering - Shapeways"
description = "A standout technology, SLS 3D printing is extremely appealing to designers, engineers, and industrial companies of all sizes. It’s ideally suited for 3D printing products like delicate luxury jewelry and custom architectural designs."
full_description = "The SLS Process The SLS process in 3D printing begins as thin layers of polymer powder are dispersed over the build platform. A computer-controlled CO2 laser traces the cross-section of the 3D design on the powder. It then scans each layer, fusing them all together at a high temperature, just under the melting point, until the 3D printed structure is complete. SLS industrial 3D printers can range in build volume size; for example, smaller printers may have a build volume of 200 mm x 250 mm x 330 mm, but printers from EOS can range in build volume from 650 mm x 350 mm x 550 mm to 700 mm x 380 mm x 580 mm, with a layer thickness of 100 to 120 microns. Thousands of parts may be included in one build, boasting higher accuracy and repeatability than most techniques. Nylon 12 [Versatile Plastic] Nylon 12 [Versatile Plastic] is a strong polyamide relied on worldwide for industrial products. This material truly lives up to its name, setting it apart from other materials due to its ability to act flexible for thinner structures and moving mechanical parts, but also rugged and stiff for substantial, end-use parts in applications like jewelry, architectural designs and home decor, fixtures, and prosthetics. Nylon 12 [Versatile Plastic] is also porous enough to allow for dyeing, with a wide range of colors available for parts and prototypes. Explore the design guidelines for Nylon 12 [Versatile Plastic] Thermoplastic Polyurethane (TPU) Thermoplastic Polyurethane (TPU) is a rubber-like material (available in white) that offers impact resistance and durability, and also works well for 3D printing of some interlocking parts. Made for elastic, end-use products, TPU is used for important applications like: Automotive Medical Robotics Footwear Sports equipment Explore the design guidelines for TPU Nylon 11 [PA11(SLS)] Nylon 11 [PA11(SLS)] is a robust white polyamide offering great tensile strength, durability, impact resistance, and flexibility. Due to its biocompatibility, Nylon 11 [PA11(SLS)] is uniquely suited for manufacturing the following: Exterior medical devices Automotive parts Sports equipment Loaded functional prototypes Hinges Explore the design guidelines for Nylon 11 [PA11 (SLS)]"
