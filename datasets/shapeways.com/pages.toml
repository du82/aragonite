ability, and a wealth of knowledge and expertise in the field of on-demand manufacturing, Marleen is uniquely suited to build on the company’s previous successes while ensuring that delivering value to customers remains at the core.As former COO, Marleen led Shapeways from its inception through the launch of the world’s first upload-to-3D-print service – ultimately building it into the largest 3D printing marketplace in the world, democratizing access to digital manufacturing. She left Shapeways in 2014 and went on to create and lead several innovative manufacturing startups. As founder and CEO of Hudson Valley Mask Company, Marleen oversaw the development of the first 100% biodegradable respirator worldwide. Previously, Marleen founded Ziel, a turnkey service offering design, on-demand manufacturing and retail integration for apparel brands – improving their working capital, speed to market and ecological footprint while simultaneously increasing their profits.Marleen is a former heptathlete, current natural parkour devotee, and spends her spare time outdoors as much as possible.LinkedIn Robert Schouwenburg, CTO Robert Schouwenburg, CTORobert, an original co-founder of Shapeways, has returned to usher the company into its new chapter. Passionate about the intersection of technology and operations, he brings extensive experience in developing technology platforms, growing businesses and scaling teams. Robert is especially excited to bring Shapeways 3D printing to small volume production, closing the gap between prototyping and mass-production.As former CTO of Shapeways, Robert built the first 3D printing marketplace, enabling online ordering and fulfillment of 3D printed parts. He left Shapeways 2012 to work on other technology startups. Most recently, Robert founded and led OneFiber on their mission to deliver fiber networks to unserved and underserved areas. Previously, he was managing director US at Hubs, delivering 100% growth in two years. A pioneer of distributed digital manufacturing, Hubs was acquired by Protolabs (NYSE:PRLB) in January 2021 for $280M.In his spare time, Robert loves nurturing his orchids, bonsai and tropical fish. He is also a part-time audiophile and enjoys listening to his collection of CDs and records.LinkedIn Jules Witte, COO Jules Witte, COOJules brings over a decade of experience driving operational excellence and strategic transformation in advanced manufacturing, with a keen focus on delivering value to customers. With an in-depth knowledge of Shapeways and an action-oriented and results-driven approach, Jules is equipped to steward Shapeways into its next chapter.Joining Shapeways in 2012, Jules quickly progressed through multiple roles before assuming leadership of the Eindhoven manufacturing facility in 2018. Under his guidance, the facility achieved significant operational milestones, including the insourcing of pivotal technologies and system optimizations, resulting in the Eindhoven facility becoming the main global additive manufacturing hub for Shapeways. Jules additionally drove the company’s transition from B2C to B2B, implementing consultative sales, robust quality management systems and attaining ISO:9001 and IATF:16949 certifications.In his spare time, Jules enjoys Futsall, CrossFit, cooking and spending time with his family.LinkedIn Job van de Laar, Plant Manager Job van de Laar, Plant ManagerJob brings extensive operations, quality and commercial management experience to his role at Shapeways. As Plant Manager, he drives best practices and implements improved margin structures, with a focus on bringing out the best in his team.Job joined Shapeways in 2019 as Operations Manager of the Eindhoven factory. He successfully onboarded and grew several of Shapeways’ top 10 customers – most notably managing a high-publicity, award-winning project with Microsoft. Prior to Shapeways, Job worked in operations and commercial management roles in the technology and automotive industries for Fortune 500 companies for more than 20 years.Job has lived and worked on several continents and speaks 6 languages, equipping him with the essential cross-cultural sensitivity required for a globally-operating company. In his spare time, Job enjoys working on, and racing, classic race cars.LinkedIn Tiago Sao Jose, Head of Engineering Tiago Sao Jose, Head of EngineeringAs Head of Engineering, Tiago leads the development of innovative, scalable digital solutions at Shapeways. With an ethos that anything is possible, a passion for technology, and a proven track-record of leading engineering teams in complex problem-solving, Tiago supports Shapeways in providing exceptional value to its customers.Tiago joined Shapeways in 2012 and has played a key role in advancing the company’s technology and operations. He has been pivotal in creating essential tools and systems that enhance efficiency and streamline workflows. His expertise in software architecture and cloud infrastructure, combined with his leadership skills, ensures that Shapeways remains at the forefront of manufacturing innovation.In his spare time, Tiago enjoys playing with his young daughter and creating and producing his own music.LinkedIn /*! elementor - v3.6.5 - 27-04-2022 */ .elementor-toggle{text-align:left}.elementor-toggle .elementor-tab-title{font-weight:700;line-height:1;margin:0;padding:15px;border-bottom:1px solid #d4d4d4;cursor:pointer;outline:none}.elementor-toggle .elementor-tab-title .elementor-toggle-icon{display:inline-block;width:1em}.elementor-toggle .elementor-tab-title .elementor-toggle-icon svg{-webkit-margin-start:-5px;margin-inline-start:-5px;width:1em;height:1em}.elementor-toggle .elementor-tab-title .elementor-toggle-icon.elementor-toggle-icon-right{float:right;text-align:right}.elementor-toggle .elementor-tab-title .elementor-toggle-icon.elementor-toggle-icon-left{float:left;text-align:left}.elementor-toggle .elementor-tab-title .elementor-toggle-icon .elementor-toggle-icon-closed{displa