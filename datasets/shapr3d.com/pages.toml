full_description = "Build a product that breaks the mold. Give real value to our users. This is how we create the CAD of the future. At Shapr3D, we’re a team of innovators who wake up every day to make our product better. Better than our competitors, better than what our users can dream of, better than what we now think possible. As we are scaling things up, we’re looking for fellow trailblazers to experiment and break the mold with us. If all this speaks to you, apply to our open positions. And don’t worry if you don’t tick every box in the requirements. We’re always looking to hire for potential and the right mindset. Don’t just work for us – become a part of our mission! At Shapr3D, you’ll receive stock options the moment you join our team, making you essentially an owner of the company. Are you curious by nature? If there’s a book, a seminar, or training you’re interested in, let us know and we’ll cover the costs up to $500/year. And your learning opportunities don’t stop there: at Shapr3D, you’ll get to hone your skills by learning from the absolute best in their field while developing a world-class product. We offer a generous healthcare package upon passing your probation, plus 100% sick leave payment, and on top of that, we offer an extra 3 sick leave days. Our Employee Assistance Program comes with a wide range of services including psychological, legal, and financial consultation, or even coaching. And we offer an extra 5 days of paternity leave, doubling the amount of days fathers can normally spend with their newborn in Hungary. Not a Hungarian resident? No worries, no matter where you’re coming from, we offer international relocation support to help you move here without any issues. Want a gadget or an app for work? We’ll grant you any hardware or software you need to make your workflow as smooth as possible. And if you’re into 3D modeling, you can print your own designs on our in-house, cutting-edge 3D printer. You’ll find a company culture in which you can thrive from the get-go! From board game nights through long hikes all the way to team dinners and celebrations, we strive to build a team bound not only by work but by shared memories and values."
