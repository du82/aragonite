title = "ShellCheck: Home – Welcome to the ShellCheck wiki!"
full_description = "If you tried to follow a link for an issue but ended up here, it means that page does not exist yet :( ShellCheck is a static analysis tool for shell scripts. This wiki holds all the long form descriptions of warnings and suggestions it outputs. If you get this output: and it's too terse or you're not sure whether it applies, you can read more on this wiki page: SC1118. If you would like to contribute and create a page, just copy the Template and give it a name like SC1000, and bask in unending appreciation from shell scripters world wide! Are you a robot or web crawler? See https://www.shellcheck.net/wiki/ for a list of all available search engine indexable copies of pages of the GitHub Wiki."
