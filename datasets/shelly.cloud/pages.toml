title = """
Door Closed and Locked Monitoring with Shelly BLU Door Window  
 – Shelly Europe"""
description = "The occupant of the apartment or house or even family members can now check the status of the door at any time and in any place."
full_description = "As you get older, it's normal to forget things from time to time. Especially when you leave the house and are out, doubts often arise: Have I closed and locked the door? The Shelly Blu Door/Window is the right device to solve this problem. However, it only uses the magnet to check that the door is closed but not that it is locked. Now the innovative solution is an extension of the function of the Shelly BLU Door/Window. I have connected a limit switch in parallel to the reed relay in the Shelly. I installed the limit switch in the striking plate of the multipoint lock. When the door is closed and when the door is locked, the dead bolt actuates the limit switch. This gives the Shelly the complete information that the door is closed and locked. This clever extension has solved the problem. The occupant of the apartment or house or even family members can now check the status of the door at any time and in any place via the Shelly app and be sure that the apartment or house is closed and locked."
