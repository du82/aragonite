["https://shelly.cloud/blogs/customer-projects/rv-trailer-as-shelly-smart-home"]
title = """
RV Trailer As A Shelly Smart Home  
 – Shelly Europe"""
description = "If I had one wish, it would be for the Shelly LPG sensor to also work on 12V, so that this safety aspect can also be covered when we are drycamping."
full_description = 'It all started with the desire to monitor the temperature in the refrigerator while traveling and the first Shelly H&T. In the meantime, almost 30 Shelly products are in use and have turned it into a real "smart home on wheels". At the front are our two water tanks, with a total of 80 liters of water. Three Shelly Plus 1s and two add-ons measure the water levels and temperatures. As soon as the main tank on the left (main water tank) has little water, water is automatically pumped from the secondary tank (on the right side) into the main tank via a scene. And a second scene switches the pump off again when the main tank is full or the secondary tank has too little water. Since we like to go winter camping, a Shelly Plus Plug S and the aforementioned temperature sensor in the water tanks activate a water heater to prevent the water from freezing, controlled by scene. And as a further safety measure, Shelly Floods are also in use, because there is nothing worse in an RV trailer than leaking water. Since we have a combined gas and electric heating system, a thermostat function is also used thanks to additional Shelly H&Ts and a Shelly Plus 1PM, of course with automatic night-time temperature reduction thanks to the interval function. Speaking of warmth: we also have heating foils under the mattresses, which we can control with Shelly dimmers so that it is nice and warm in winter too. Of course, we also use another Shelly Plus Plug S to control the total power consumption when we have shore power. And if this is not the case, a Shelly Uni checks the status of the trailer battery. In terms of security, we have a Shelly Smoke and also Shelly Motions and Shelly Blu Door/Window as burglary protection, which activate a siren via a Shelly Plus 1 when the alarm is activated. The latest addition, which still needs to be installed, is the Shelly Wall-Display, so that we can control our Shelly Smart Home on Wheels without a smartphone in our hands. If I had one wish, it would be for the Shelly LPG sensor to also work on 12V, so that this safety aspect can also be covered when we are drycamping (just using our battery, no shore power.'
year_published = 2025
clearnet = "https://shelly.cloud/blogs/customer-projects/rv-trailer-as-shelly-smart-home"
