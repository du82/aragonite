full_description = "Edit views, layout constraints and even user defaults in real time, simulate running on other devices, and jump straight to the source code, all from your Simulator - zero configuration required. Edit properties on your view and it’s layer in real time - so you can create the perfect shadow or fix your stack view layout in half the time. Edit, enable or disable your Auto Layout constraints and layout priorities so that you can get your layout just right without having to rebuild. Sherlock doesn’t just work with UIKit classes - it can automatically detect @IBInspectable and @objc properties of supported types on your custom view classes and let you view and edit them in real time. No need to hop between the Simulator and Xcode to find the source code for a view. Simply select the view and click Jump to File. Sherlock uses Auto Layout to predict how your app will be rendered with different screen sizes and safe areas, so you can see what your app will look like instantly, without having to rerun your app on each device. Zero setup is required, just start Sherlock and then launch your app from Xcode or the simulator’s home screen, and Sherlock will automatically connect to it. No - Sherlock integrates deeply with the simulator to do things that just wouldn’t be possible on an actual device. A Sherlock license is valid for one year from the time of purchase. During this period you are eligible to receive all updates."
