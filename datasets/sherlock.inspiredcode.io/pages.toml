title = "FAQ - Sherlock by InspiredCode"
full_description = "Zero setup is required, just start Sherlock and then launch your app from Xcode or the simulator’s home screen, and Sherlock will automatically connect to it. No - Sherlock integrates deeply with the simulator to do things that just wouldn’t be possible on an actual device. Sherlock requires Xcode command line tools be configured on your machine. The command line tools come bundled with Xcode.app, and you can ensure that your system is pointed at the version included with the Xcode.app you’re using with the xcode-select command, or from the Locations tab in Xcode’s preferences. You can define properties in your own views and expose them to Sherlock by marking them as @objc or @IBInspectable. We currently support Int, CGFloat, Bool, String, CGRect, CGSize and UIColor.Example:@objc var isAnimating = false Sherlock uses various techniques to generate as accurate a representation as possible of your Auto Layout driven views on the target device, but in some cases there may be some minor differences from the real thing. For best results, use the Resizable Screen feature with iOS 12. If your view’s don’t use Auto Layout you can subscribe to SherlockScreenWillResizeNotification to be notified before we simulate the new screen size to make any adjustments. Both license types are suitable for commercial usage. A personal license is registered to and bought by an individual. If you’re buying on behalf of a company, you must buy a commercial license. A Sherlock license is valid for one year from the time of purchase. During this period you are eligible to receive all updates. A yearly subscription supports the team in developing new features and keeping pace with Apple ecosystem changes. Sherlock requires major updates to maintain compatibility with the latest versions of Xcode and iOS. Along with continual updates and enhancements, we think this provides great value in a sustainable way. You can activate and use Sherlock on two machines simultaneously. This is so you’re able to use it on both a personal machine, and a work one too, if you’d like. If you’re planning to change machines, deactivating a license allows you to use it on a different one. You can deactivate your license on a machine from Sherlock’s preferences, or you can contact us if you are unable to access a machine to deactivate Sherlock on it."
