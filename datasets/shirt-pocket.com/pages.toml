["https://shirt-pocket.com/SuperDuper/SuperDuperDescription.html"]
title = "SuperDuper!"
full_description = '''SuperDuper is the wildly acclaimed program that makes recovery painless, because it makes creating a fully bootable backup painless. Its incredibly clear, friendly interface is understandable, easy to use, and SuperDuper's built-in scheduler makes it trivial to back up automatically. It's the perfect complement to Time Machine, allowing you to store a bootable backup alongside your Time Machine volume—and it runs beautifully on your Mac! Version 3.9 supports bootable backups for Sequoia, Sonoma, Ventura, Monterey, Big Sur, is Apple silicon native, adds Dark Mode support, and improves Cloud file handling. It includes previous improvements, allowing you to ignore "missing drive" errors during scheduled copies, and Smart Wake, which ensures your backups happen whether your Mac is awake or asleep...and won't turn on your screen if your Mac is already awake. This new version also includes Smart Delete, an awesome capability that minimizes the possibility of disk full errors while maintaining safety with no speed penalty, native Notification Center support, a Finder extension to quickly run copies, and other improvements. SuperDuper can even create and copy from snapshots, which means with an APFS backup drive, you can restore today's Smart Update, yesterday's, etc! It's super cool. SuperDuper's interface confirms all your actions in simple, clear language to ensure that the end result is exactly what you intended. Take a look, and click for additional screen shots! It happens to all of us, eventually. And recovering can be a painful, error-prone, time-wasting experience, if it's even possible at all. Until now. SuperDuper is the most advanced, yet easy to use disk copying program available for macOS. It can, of course, make a full backup, or "clone" — in moments, you can completely duplicate your boot drive to another drive, partition, or image file. In even less time, you can update an existing clone with the latest data: use Smart Update and, minutes later, your backup is completely up to date!'''
year_published = 2025
clearnet = "https://shirt-pocket.com/SuperDuper/SuperDuperDescription.html"
