title = "Shirt Pocket"
full_description = '''SuperDuper! v3.9: Heroic System Recovery for Mere Mortals. Compatible with Sequoia, Sonoma, Ventura, Monterey, Big Sur, and smarter than ever. Back-to-back 2005 and 2006 Eddy Award Winning...and compatible with the Mac you're using. We're happy to announce the immediate availability of SuperDuper! 3.9, the latest version of our popular disk copying utility for macOS. 3.9 is fully compatible with Sequoia. the latest version of macOS, as well as Sonoma, Ventura, Monterey, and Big Sur (all the way back to macOS High Sierra), is Apple silicon native, and produces fully bootable HFS+ and APFS backups faster and easier than ever. It even supports creating and copying from snapshots! You can keep your backup on its own volume, or you can even store and Smart Update it alongside your Time Machine backups. We even let you copy your HFS+ Time Machine backups to other disks, so you can back them up or upgrade to a larger disk without losing your history! In v3.9 we've added Dark Mode support, improved cloud file handling, and it still includes our super-cool Smart Delete feature, which helps to safely banish "disk full" errors to the land of wind and ghosts, without any speed penalty; a Smart Wake feature to ensure your backups happen whether your Mac is awake or asleep; and the ability to turn off "missing drive" errors during scheduling...plus a lot more. But of course we didn't abandon our non-Ventura users. 3.9 is still compatible with High Sierra (10.13) and later, and as always we've made improvements for everyone. And, of course, 3.9 still includes all the other terrific features of SuperDuper!, including: the ability to easily schedule backups; many imaging options; more control over shutdown; AppleScript support; hundreds of UI improvements; Growl support; and an extensive, task-based User's Guide. SuperDuper! also includes Smart Update, a great feature that updates a clone to exactly reflect any changes on the original in just minutes! Once again, it's a free update for existing customers. Copies will auto-upgrade, but you can also download now!'''
