["https://shirt-pocket.com/blog"]
title = "Shirt Pocket Watch"
description = "Notes from Dave Nanian @ Shirt Pocket"
full_description = '''Happy New Fix! Monday, January 27, 2025 Just a quick post: macOS 15.3 is now out, and with it, a fix for the broken replicator. As such, macOS copying will work again with Erase, then copy backups. No update to SuperDuper is necessary (but feel free to install our v3.10 Beta 2, below). Note that this does not mean boot from the copy will work in all situations (but, again, we have no control over that). But at least the copy can be made without (this) failure occurring. Thanks for your patience as we waited for the fix from Apple. I know I'm relieved that I (hopefully) will no longer be bombarded with support because of it! Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News Permalink • Tell-a-Friend Beta-ing Wednesday, December 18, 2024 Well, although we can't do anything about macOS 15.2 breaking the replicator, we can continue to work on the things we have control over. And, in that spirit, here's Beta 2 of SuperDuper! v3.10. Minimal Changes Not a lot new in this version, actually, but it's gone through additional weeks of external and internal testing. Changes include: Thrilling Snapshot Unmounting! That's right, we found cases where our snapshots weren't unmounting, and now they are! Spectacular Image Fixes! Hold on to your horses, because they might bolt when they discover that we found a bit of protective code was being too protective when backing up to images! And we fixed it! Rarely Seen Failures! Thrill to the secret knowledge that a very rare license check error will no longer randomly crash! I know! You might have to step away from your computer for a moment to catch your breath! Whew! OK! I know you're very excited about getting this on to your Mac as soon as possible, so you can Download SuperDuper! v3.10 B2 Of course, existing Beta copies will offer this as an automatic update as well. Enjoy, and let us know if you have any problems. Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News Permalink • Tell-a-Friend You’re a Mean One Friday, December 13, 2024 macOS 15.2 was released a few days ago, with a surprise. A terrible, awful surprise. Apple broke the replicator. Towards the end of replicating the Data volume, seemingly when it's about to copy either Preboot or Recovery, it fails with a Resource Busy error. In the past, Resource Busy could be worked around by ensuring the system was kept awake. But this new bug means, on most systems, there's no fix. It just fails. Puppet on Strings Since Apple took away the ability for 3rd parties (eg, us) to copy the OS, and took on the responsibility themselves, it's been up to them to ensure this functionality continues to work. And in that, they've failed in macOS 15.2. Because this is their code, and we're forced to rely on it to copy the OS, OS copying will not work until they fix it. To put it bluntly, this sucks. It's bad enough we have to work around other bugs in this code, but when it breaks completely, we're stuck pointing fingers and offering workarounds that don't involve the replicator. Workaround Runaround Redux What this means is this: until Apple fixes the bug, you'll have to use "Backup - all files" with "Smart Update" to copy everything but the OS. This backup, as I've explained before, has all your stuff: applications, data, settings, etc. The System volume (the OS, effectively), is read-only and you can't change it. So a clean install brings it back exactly as it was...and then you can restore when prompted during first boot. We Know This Sucks The section title says it all. I know. This sucks. We think it sucks. You think it sucks. But we can't fix it: Apple has to do so. For those who may be working for Apple, or have good contacts, the bug is FB16090831. A fix would be really helpful, folks. Happy Holidays It's unfortunate this is happening during this period, since Apple rarely releases updates between now and New Year's. I sincerely hope you'll be having a better Holiday Season than I am about to have, with fewer emails and more fun. Thanks for using SuperDuper, and thanks for your understanding. Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News Permalink • Tell-a-Friend Brighten the Corners Saturday, November 23, 2024 Welcome to the first Beta release of SuperDuper! v3.10—the cycle begins again. For those who don't know the drill: if you download and install this Beta release, you will automatically receive subsequent Beta releases until the final release of v3.10. Once that comes out, it will also be offered, and then you'll only receive normal releases...until and unless you install a Beta release in the future. Let There Be Light As I've mentioned previously (in the Roll Up Some Fixes post), in the past we've tried to change the color of the status bar with a hue filter, and it caused some older Macs to crash during testing, so we took it out. Well, hope springs eternal...since we've dropped support for 10.10-10.12 in 3.9, and since we've implemented this with something that only works in 10.15 and later, we've put it back. The progress bar is more visible. Much more visible. We'll see how it goes...let us know if you have problems. Data Clone Files I explained in Fraternal Twins that it's possible to put more data on an APFS volume than you have literal space for, due to "Clone Files". Basically, when you copy or duplicate a file or folder on an APFS volume, it doesn't really "copy" it. Instead, it references the original file, at a low level, and effectively doesn't take up any additional space. Unless you copy the files to another volume, of course, at which point they take up their full size...and that can cause the destination volume to fill. We've gone ahead and supported replication for APFS data sources and destinations in this version. That ensures clone files are copied in their "cloned" state when using "Erase, then copy", so the data should fit in the edge cases where the expanding clones filled the volume. Details, Details... There are a number of other little tweaks and improvements detailed in the release notes (Help > Release Notes) for the curious/bored. Have at It! So that's about it on this cold, rainy Saturday. Give it a try, and get in touch if you have any problems: Download SuperDuper! v3.10 Beta 1 Enjoy! Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News Permalink • Tell-a-Friend SuperDuper! v3.9.1 Now Available Saturday, September 21, 2024 For a while I thought that, maybe, I'd somehow managed to delete the v3.9 blog post. But, it looks like, somehow, I didn't write it, maybe? I don't even know any more. No Matter Well, in the end, it's OK, because the semi-inevitable point release is out—v3.9.1—and fixes an issue that was causing Catalina (10.15)'s dynamic library cache builder to crash. While we were working on that we turned off updates for 10.15 and earlier, so now that it's fixed we've enabled updates for all supported versions of macOS. So, welcome to v3.9/v3.9.1, our Sequoia compatible release! Woo! Cue the orchestra! Wait a Sec... Yes, I said "all supported", but nothing to worry about. The only slightly unusual thing is that we had to drop support for some versions of macOS in this release: 10.10, 10.11 and 10.12. v3.8 is still available for those who are running those older versions—and remember, we have versions available going all the way back to Panther or something, so if you're a fan of lickable interface elements, we've got you covered. It Comes at Night Don't worry - this wasn't arbitrary. In exchange for those dropped versions, we were able to bring you Dark Mode support, as many have already noticed. So no longer will you have to shield your eyes as the distressing glare of a white background assaults your senses. You can finally back up while placing your sunglasses to the side. Cloudy with a Chance of Stubs In this version, we're also handling "dataless" files and folders explicitly, and the way Apple itself suggests. That is, we copy files that are on your local drive, and we do not copy (or materialize/download) files or folders that are cloud-only. This will work for all cloud services that make use of Apple's FileProvider framework, not just iCloud. So if you're using an outdated version of your preferred cloud service, ensure you've installed the one that uses Apple's API. Enjoy So there you go. Existing copies will offer the update automatically (or you can manually check for updates, as always). Note that if SuperDuper doesn't quit and relaunch after it updates, you should quit and restart it yourself or you will get an error. It's a satisfying update, with a few new features, additional polish, various fixes, and a whole new blog post, which I definitely wrote this time, and did not accidentally delete, or imagine. I think. Man, it'd really suck if I dreamed I wrote this and had to do it again. Here's hoping it's real! Download SuperDuper! v3.9.1 Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News Permalink • Tell-a-Friend Quick Fix Friday, September 13, 2024 Not much to say, other than "we fixed a bug". SuperDuper checks the version of the OS on a give drive by checking the SystemVersion.plist, which is stored in /System/Library/CoreServices. On some systems, we've found that that file is missing a value that we assumed would always be there. That assumption led to a crash at launch for some (two) people. This version fixes that problem. Download SuperDuper v3.9 B5 Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News Permalink • Tell-a-Friend New macOS / Adoption Tuesday, September 10, 2024 tl;dr (although this is unlikely to be "l") - SuperDuper v3.9 Beta 4 is now available for download. This is the release candidate for v3.9. (St|F)umbling Towards Sequoia Probably the wrong headline, since our Sequoia testing has gone well. Beta 4 has some changes that fix a longstanding minor-but-annoying issue: an 'unlocked' copy of SuperDuper, if launched from a backup drive (typically because a user launches from Spotlight, and it returns the wrong copy), fails when it tries to run. The reason for this is technical, but basically the authorized part of the app is not authorized when run from an external drive, for security reasons. As such, it fails, and it used to do this in an obnoxious way. Well, now, we recognize this case and prompt for a password. We also update the "lock text" to reflect the restriction (you can't unlock when run from an external, non-boot drive). Yes, hold onto your butts—this beta release is exactly that exciting. Padding After the rather sad postscript to the last blog post, I'm happy to announce the arrival of the fourth under-the-desk dog: Cooper! After Haku's passing, a veterinary technician, who works with Zabeth, let her know that a 4-year old Bernese had been surrendered by a couple who were going to euthanize him, and that he was available for adoption. We headed up to Lowell Animal Hospital, met with him, and decided he was perfect. He's been an "instant dog", fit into the family perfectly, and has been a delight over the past few weeks. Download So that's about it! Download away, and let us know if you have any issues. Barring unexpected surprises, the final version to be out day-and-date with Sequoia's release next week. Download SuperDuper! v3.9 B4 Posted by Dave Nanian in Shirt Pocket in SuperDuper! in Blogging in News Permalink • Tell-a-Friend Polishing (and RIP Haku) Friday, July 05, 2024 Executive Summary v3.9 B3 is now out, with additional polish and tweaks to our cloud handling, some fixes for dark mode and the like. It will be offered as an automatic update for existing v3.9 Beta users, or you can download it here. Download SuperDuper! v3.9 B3 It's (Almost) the Weekend Non-Summary Not much negative to report about the previous Beta—the feedback has been good, our internal testing has been successful, and in general this looks like a pretty uneventful update, in a good way. That makes a lot of sense, given the work we'd done behind the scenes before the 1st beta ever came out, but it's nice when a plan comes together. Sweet. Some Monsterism. We've noticed that, on occasion, "dataless" cloud files and folder proxies can get into strange states on the backup where, quite literally, nothing can delete them. In these situations, we have no choice but to throw up our hands and continue. We're not sure how they get this way (especially since we're not copying them...but the fix is an Erase, then copy backup (Options > During copy) followed by a Smart Update (ditto). Conclusion(s) I just wanted to take a minute here to celebrate the life of my dog Haku, who died on July 1st, at about 8.75 years old, of a combination of Lymphoma and Wobbler's. SuperDuper has been a 3 Dog Project (so far): first Ketzl, then Taiko and now Haku. All have been Bernese Mountain Dogs, and all three were, truly, great pups. Haku, though, was even more special. He was a big dog, 135lbs at his (healthy) peak, but the gentlest giant you can imagine. He was the mayor of our neighborhood, and loved not just by us, but by everyone who was lucky enough to meet him. Even through the challenges of the slow deterioration that Wobbler's brings, and the difficulty of treating Lymphoma, he was happy, friendly, and engaged, always wanting to visit his favorite spots on our daily walks, always greeting his fans who we would meet along the way. Here's a little video from over that weekend. He'll be hard to replace, and is truly missed. Here's the beta: Download SuperDuper! v3.9 B3 Posted by Dave Nanian in Shirt Pocket in SuperDuper! in News in Personal Permalink • Tell-a-Friend Shadows and Tall Trees Wednesday, June 12, 2024 We're happy to announce Beta 2 of SuperDuper! v3.9, our initial cut at a Sequoia compatible release. "Wait!", you might say, "Beta 2? Did you guys hit your heads on something?" Well, maybe. But Beta 1 of this was a non-public external beta that's been in process for months for other things. To ensure all those users get updated too, this first public Beta for Sequoia is Beta 2. You can deal. It'll be OK. Shadows Back in 2018, when we released Smart Delete, I wrote the following: We're also supporting Mojave in 3.2 with one small caveat: for the moment, we've opted out of Dark Mode. We just didn't have enough time to finish our Dark Mode implementation, didn't like what we had, and rather than delay things, decided to keep it in the lab for more testing and refinement. It'll be in a future update. So...yeah. It's been a little while. But the wait is over: SuperDuper v3.9 includes Dark Mode support, and banishes our old textured window to the land of shadows. (please clap) (pause for cheers) Note that this also means that macOS 10.13, High Sierra, is the minimum macOS version for v3.9. (please keep clapping) Clouds Apple, and other cloud providers, have been slowly moving to the new Cloud Storage structure. Now that it's stabilized, embraced, and seems to be working in a predictable fashion, we've turned on our abilit'''
