full_description = "Minecraft is a sandbox video game that enables players to explore a blocky, procedurally-generated 3D world with infinite terrain, and may extract raw materials, craft tools and items, and build structures or earthworks. CS: GO is an objective-based multiplayer first-person shooter. Each player joins either the Terrorist or Counter-Terrorist team and attempts to complete objectives or eliminate the enemy team. Starbound takes place in a two-dimensional, procedurally generated universe which the player will explore in order to obtain new weapons, armour, and miscellaneous items. Ark: Survival Evolved is an action-adventure survival video game played from either a third-person or first-person view and its world is navigated on foot or by riding a dinosaur. Farming Simulator 19 is the richest and most complete farming experience ever made! You’ll take control of vehicles and machines faithfully recreated from all the leading brands in the industry. An online multiplayer survival game, now with mounts and mounted combat, set in the lands of Conan the Barbarian. Survive in a vast open world sandbox, build a home and kingdom, dominate your enemies in single or multiplayer. This co-operative action horror FPS takes you and your friends through the cities, swamps and cemeteries of the Deep South, from Savannah to New Orleans across five expansive campaigns. Space Engineers is a sandbox game about engineering, construction, exploration and survival in space and on planets. Players build space ships, space stations, planetary outposts of various sizes and uses, pilot ships and travel through space to explore planets and gather resources to survive. Nine distinct classes provide a broad range of tactical abilities and personalities. Constantly updated with new game modes, maps, equipment and, most importantly, hats! The only aim in Rust is to survive - Overcome struggles such as hunger, thirst and cold. Build a fire. Build a shelter. Kill animals. Protect yourself from other players."
