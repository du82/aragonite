["https://www.shodan.io/about/products"]
title = "Shodan Search Engine"
description = "Search Engine for the Internet of Things"
full_description = "Keep track of all your devices that are directly accessible from the Internet. Shodan provides a comprehensive view of all exposed services to help you stay secure. Explore the world of Internet-connected devices using a map. Zoom in, pan around and narrow down results based on the GeoIP information. Shodan collects screenshots for many different services and as a member you get access to a new search interface that makes browsing those screenshots much easier. Not sure where to get started? Check out our Help Center where we have articles for many common use cases. If there's something we're not yet answering there let us know! All Shodan websites are built entirely on-top of the same public Shodan API that all of our users have access to. This is the core platform API. The InternetDB API provides a fast way to see the open ports for an IP address. It gives a quick, at-a-glance view of the type of device that is running behind an IP address to help you make decisions based on the open ports. The GeoNet API lets you run common network tools from servers that are located around the world. Identify different network behavior depending on the region that the end-user is located in. Want to see how a cronjob in Kubernetes is progressing or if your shell script finished? Use Chrono to have a progress bar on the web for your scripts or containers. The CVEDB API offers a quick way to access insights into vulnerabilities. This aids you in making well-informed decisions regarding security measures. Full, unlimited access to all aspects of the Shodan platform - including bulk data access. The enterprise product gives organizations unprecedented insight about the Internet. How secure is your country? The Internet Exposure Observatory provides a high-level view of the services that are exposed in a country."
year_published = 2025
