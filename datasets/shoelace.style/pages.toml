["https://shoelace.style/components/select"]
title = "Select"
description = "Selects allow you to choose items from a menu of predefined options."
full_description = '''Select Examples Labels Help Text Placeholders Clearable Filled Selects Pill Disabled Multiple Setting Initial Values Grouping Options Sizes Placement Prefix & Suffix Custom Tags Lazy loading options Importing Slots Properties Events Methods Parts Dependencies Select <sl-select> | SlSelect Since 2.0 stable Selects allow you to choose items from a menu of predefined options. Option 1 Option 2 Option 3 Option 4 Option 5 Option 6 <sl-select> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> <sl-option value="option-4">Option 4</sl-option> <sl-option value="option-5">Option 5</sl-option> <sl-option value="option-6">Option 6</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> <SlOption value="option-4">Option 4</SlOption> <SlOption value="option-5">Option 5</SlOption> <SlOption value="option-6">Option 6</SlOption> </SlSelect> ); Source HTML React This component works with standard <form> elements. Please refer to the section on form controls to learn more about form submission and client-side validation. Examples Labels Use the label attribute to give the select an accessible label. For labels that contain HTML, use the label slot instead. Option 1 Option 2 Option 3 <sl-select label="Select one"> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect label="Select one"> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> ); Source HTML React Help Text Add descriptive help text to a select with the help-text attribute. For help texts that contain HTML, use the help-text slot instead. Novice Intermediate Advanced <sl-select label="Experience" help-text="Please tell us your skill level."> <sl-option value="1">Novice</sl-option> <sl-option value="2">Intermediate</sl-option> <sl-option value="3">Advanced</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect label="Experience" help-text="Please tell us your skill level."> <SlOption value="1">Novice</SlOption> <SlOption value="2">Intermediate</SlOption> <SlOption value="3">Advanced</SlOption> </SlSelect> ); Source HTML React Placeholders Use the placeholder attribute to add a placeholder. Option 1 Option 2 Option 3 <sl-select placeholder="Select one"> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect placeholder="Select one"> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> ); Source HTML React Clearable Use the clearable attribute to make the control clearable. The clear button only appears when an option is selected. Option 1 Option 2 Option 3 <sl-select clearable value="option-1"> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect placeholder="Clearable" clearable> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> ); Source HTML React Filled Selects Add the filled attribute to draw a filled select. Option 1 Option 2 Option 3 <sl-select filled> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect filled> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> ); Source HTML React Pill Use the pill attribute to give selects rounded edges. Option 1 Option 2 Option 3 <sl-select pill> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect pill> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> ); Source HTML React Disabled Use the disabled attribute to disable a select. Option 1 Option 2 Option 3 <sl-select placeholder="Disabled" disabled> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect placeholder="Disabled" disabled> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> ); Source HTML React Multiple To allow multiple options to be selected, use the multiple attribute. It’s a good practice to use clearable when this option is enabled. To set multiple values at once, set value to a space-delimited list of values. Option 1 Option 2 Option 3 Option 4 Option 5 Option 6 <sl-select label="Select a Few" value="option-1 option-2 option-3" multiple clearable> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> <sl-option value="option-4">Option 4</sl-option> <sl-option value="option-5">Option 5</sl-option> <sl-option value="option-6">Option 6</sl-option> </sl-select> import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <SlSelect label="Select a Few" value={["option-1", "option-2", "option-3"]} multiple clearable> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> <SlOption value="option-4">Option 4</SlOption> <SlOption value="option-5">Option 5</SlOption> <SlOption value="option-6">Option 6</SlOption> </SlSelect> ); Source HTML React Note that multi-select options may wrap, causing the control to expand vertically. You can use the max-options-visible attribute to control the maximum number of selected options to show at once. Setting Initial Values Use the value attribute to set the initial selection. When using multiple, the value attribute uses space-delimited values to select more than one option. Because of this, <sl-option> values cannot contain spaces. If you’re accessing the value property through Javascript, it will be an array. Option 1 Option 2 Option 3 Option 4 <sl-select value="option-1 option-2" multiple clear