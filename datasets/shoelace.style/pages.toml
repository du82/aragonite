full_description = '''Radio Button Examples Checked States Disabled Sizes Pill Buttons Prefix and Suffix Icons Buttons with Icons Importing Slots Properties Events Methods Parts Radio Button <sl-radio-button> | SlRadioButton Since 2.0 stable Radios buttons allow the user to select a single option from a group using a button-like control. Radio buttons are designed to be used with radio groups. When a radio button has focus, the arrow keys can be used to change the selected option just like standard radio controls. Option 1 Option 2 Option 3 <sl-radio-group label="Select an option" name="a" value="1"> <sl-radio-button value="1">Option 1</sl-radio-button> <sl-radio-button value="2">Option 2</sl-radio-button> <sl-radio-button value="3">Option 3</sl-radio-button> </sl-radio-group> import SlRadioButton from '@shoelace-style/shoelace/dist/react/radio-button'; import SlRadioGroup from '@shoelace-style/shoelace/dist/react/radio-group'; const App = () => ( <SlRadioGroup label="Select an option" name="a" value="1"> <SlRadioButton value="1">Option 1</SlRadioButton> <SlRadioButton value="2">Option 2</SlRadioButton> <SlRadioButton value="3">Option 3</SlRadioButton> </SlRadioGroup> ); Source HTML React Examples Checked States To set the initial value and checked state, use the value attribute on the containing radio group. Option 1 Option 2 Option 3 <sl-radio-group label="Select an option" name="a" value="1"> <sl-radio-button value="1">Option 1</sl-radio-button> <sl-radio-button value="2">Option 2</sl-radio-button> <sl-radio-button value="3">Option 3</sl-radio-button> </sl-radio-group> import SlRadioButton from '@shoelace-style/shoelace/dist/react/radio-button'; import SlRadioGroup from '@shoelace-style/shoelace/dist/react/radio-group'; const App = () => ( <SlRadioGroup label="Select an option" name="a" value="1"> <SlRadioButton value="1">Option 1</SlRadioButton> <SlRadioButton value="2">Option 2</SlRadioButton> <SlRadioButton value="3">Option 3</SlRadioButton> </SlRadioGroup> );