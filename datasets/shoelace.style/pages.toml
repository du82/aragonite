["https://shoelace.style/components/breadcrumb"]
title = "Breadcrumb"
description = "Breadcrumbs provide a group of links so users can easily navigate a website's hierarchy."
full_description = '''Breadcrumb Examples Breadcrumb Links Custom Separators Prefixes Suffixes With Dropdowns Importing Slots Properties Parts Dependencies Breadcrumb <sl-breadcrumb> | SlBreadcrumb Since 2.0 stable Breadcrumbs provide a group of links so users can easily navigate a website’s hierarchy. Breadcrumbs are usually placed before a page’s main content with the current page shown last to indicate the user’s position in the navigation. Catalog Clothing Women’s Shirts & Tops <sl-breadcrumb> <sl-breadcrumb-item>Catalog</sl-breadcrumb-item> <sl-breadcrumb-item>Clothing</sl-breadcrumb-item> <sl-breadcrumb-item>Women's</sl-breadcrumb-item> <sl-breadcrumb-item>Shirts &amp; Tops</sl-breadcrumb-item> </sl-breadcrumb> import SlBreadcrumb from '@shoelace-style/shoelace/dist/react/breadcrumb'; import SlBreadcrumbItem from '@shoelace-style/shoelace/dist/react/breadcrumb-item'; const App = () => ( <SlBreadcrumb> <SlBreadcrumbItem>Catalog</SlBreadcrumbItem> <SlBreadcrumbItem>Clothing</SlBreadcrumbItem> <SlBreadcrumbItem>Women's</SlBreadcrumbItem> <SlBreadcrumbItem>Shirts &amp; Tops</SlBreadcrumbItem> </SlBreadcrumb> ); Source HTML React Examples Breadcrumb Links By default, breadcrumb items are rendered as buttons so you can use them to navigate single-page applications. In this case, you’ll need to add event listeners to handle clicks. For websites, you’ll probably want to use links instead. You can make any breadcrumb item a link by applying an href attribute to it. Now, when the user activates it, they’ll be taken to the corresponding page — no event listeners required. Homepage Our Services Digital Media Web Design <sl-breadcrumb> <sl-breadcrumb-item href="https://example.com/home">Homepage</sl-breadcrumb-item> <sl-breadcrumb-item href="https://example.com/home/services">Our Services</sl-breadcrumb-item> <sl-breadcrumb-item href="https://example.com/home/services/digital">Digital Media</sl-breadcrumb-item> <sl-breadcrumb-item href="https://example.com/home/services/digital/web-design">Web Design</sl-breadcrumb-item> </sl-breadcrumb> import SlBreadcrumb from '@shoelace-style/shoelace/dist/react/breadcrumb'; import SlBreadcrumbItem from '@shoelace-style/shoelace/dist/react/breadcrumb-item'; const App = () => ( <SlBreadcrumb> <SlBreadcrumbItem href="https://example.com/home">Homepage</SlBreadcrumbItem> <SlBreadcrumbItem href="https://example.com/home/services">Our Services</SlBreadcrumbItem> <SlBreadcrumbItem href="https://example.com/home/services/digital">Digital Media</SlBreadcrumbItem> <SlBreadcrumbItem href="https://example.com/home/services/digital/web-design">Web Design</SlBreadcrumbItem> </SlBreadcrumb> ); Source HTML React Custom Separators Use the separator slot to change the separator that goes between breadcrumb items. Icons work well, but you can also use text or an image. First Second Third First Second Third / First Second Third <sl-breadcrumb> <sl-icon name="dot" slot="separator"></sl-icon> <sl-breadcrumb-item>First</sl-breadcrumb-item> <sl-breadcrumb-item>Second</sl-breadcrumb-item> <sl-breadcrumb-item>Third</sl-breadcrumb-item> </sl-breadcrumb> <br /> <sl-breadcrumb> <sl-icon name="arrow-right" slot="separator"></sl-icon> <sl-breadcrumb-item>First</sl-breadcrumb-item> <sl-breadcrumb-item>Second</sl-breadcrumb-item> <sl-breadcrumb-item>Third</sl-breadcrumb-item> </sl-breadcrumb> <br /> <sl-breadcrumb> <span slot="separator">/</span> <sl-breadcrumb-item>First</sl-breadcrumb-item> <sl-breadcrumb-item>Second</sl-breadcrumb-item> <sl-breadcrumb-item>Third</sl-breadcrumb-item> </sl-breadcrumb> import '@shoelace-style/shoelace/dist/components/icon/icon.js'; import SlBreadcrumb from '@shoelace-style/shoelace/dist/react/breadcrumb'; import SlBreadcrumbItem from '@shoelace-style/shoelace/dist/react/breadcrumb-item'; const App = () => ( <> <SlBreadcrumb> <sl-icon name="dot" slot="separator" /> <SlBreadcrumbItem>First</SlBreadcrumbItem> <SlBreadcrumbItem>Second</SlBreadcrumbItem> <SlBreadcrumbItem>Third</SlBreadcrumbItem> </SlBreadcrumb> <br /> <SlBreadcrumb> <sl-icon name="arrow-right" slot="separator" /> <SlBreadcrumbItem>First</SlBreadcrumbItem> <SlBreadcrumbItem>Second</SlBreadcrumbItem> <SlBreadcrumbItem>Third</SlBreadcrumbItem> </SlBreadcrumb> <br /> <SlBreadcrumb> <span slot="separator">/</span> <SlBreadcrumbItem>First</SlBreadcrumbItem> <SlBreadcrumbItem>Second</SlBreadcrumbItem> <SlBreadcrumbItem>Third</SlBreadcrumbItem> </SlBreadcrumb> </> ); Source HTML React Prefixes Use the prefix slot to add content before any breadcrumb item. Home Articles Traveling <sl-breadcrumb> <sl-breadcrumb-item> <sl-icon slot="prefix" name="house"></sl-icon> Home </sl-breadcrumb-item> <sl-breadcrumb-item>Articles</sl-breadcrumb-item> <sl-breadcrumb-item>Traveling</sl-breadcrumb-item> </sl-breadcrumb> import SlBreadcrumb from '@shoelace-style/shoelace/dist/react/breadcrumb'; import SlBreadcrumbItem from '@shoelace-style/shoelace/dist/react/breadcrumb-item'; import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; const App = () => ( <SlBreadcrumb> <SlBreadcrumbItem> <SlIcon slot="prefix" name="house" /> Home </SlBreadcrumbItem> <SlBreadcrumbItem>Articles</SlBreadcrumbItem> <SlBreadcrumbItem>Traveling</SlBreadcrumbItem> </SlBreadcrumb> ); Source HTML React Suffixes Use the suffix slot to add content after any breadcrumb item. Documents Policies Security <sl-breadcrumb> <sl-breadcrumb-item>Documents</sl-breadcrumb-item> <sl-breadcrumb-item>Policies</sl-breadcrumb-item> <sl-breadcrumb-item> Security <sl-icon slot="suffix" name="shield-lock"></sl-icon> </sl-breadcrumb-item> </sl-breadcrumb> import SlBreadcrumb from '@shoelace-style/shoelace/dist/react/breadcrumb'; import SlBreadcrumbItem from '@shoelace-style/shoelace/dist/react/breadcrumb-item'; import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; const App = () => ( <SlBreadcrumb> <SlBreadcrumbItem>Documents</SlBreadcrumbItem> <SlBreadcrumbItem>Policies</SlBreadcrumbItem> <SlBreadcrumbItem> Security <SlIcon slot="suffix" name="shield-lock"></SlIcon> </SlBreadcrumbItem> </SlBreadcrumb> ); Source HTML React With Dropdowns Dropdown menus can be placed in the default slot to provide additional options. Homepage Web Design Web Development Marketing Our Services Digital Media <sl-breadcrumb> <sl-breadcrumb-item>Homepage</sl-breadcrumb-item> <sl-breadcrumb-item> <sl-dropdown> <sl-button slot="trigger" size="small" circle> <sl-icon label="More options" name="three-dots"></sl-icon> </sl-button> <sl-menu> <sl-menu-item type="checkbox" checked>Web Design</sl-menu-item> <sl-menu-item type="checkbox">Web Development</sl-menu-item> <sl-menu-item type="checkbox">Marketing</sl-menu-item> </sl-menu> </sl-dropdown> </sl-breadcrumb-item> <sl-breadcrumb-item>Our Services</sl-breadcrumb-item> <sl-breadcrumb-item>Digital Media</sl-breadcrumb-item> </sl-breadcrumb> import { SlBreadcrumb, SlBreadcrumbItem, SlButton, SlDropdown, SlIcon, SlMenu, SlMenuItem } from '@shoelace-style/shoelace/dist/react'; const App = () => ( <SlBreadcrumb> <SlBreadcrumbItem>Homepage</SlBreadcrumbItem> <SlBreadcrumbItem> <SlDropdown slot="suffix"> <SlButton slot="trigger" size="small" circle> <SlIcon label="More options" name="three-dots"></SlIcon> </SlButton> <SlMenu> <SlMenuItem type="checkbox" checked> Web Design </SlMenuItem> <SlMenuItem type="checkbox">Web Development</SlMenuItem> <SlMenuItem type="checkbox">Marketing</SlMenuItem> </SlMenu> </SlDropdown> </SlBreadcrumbItem> <SlBreadcrumbItem>Our Services</SlBreadcrumbItem> <SlBreadcrumbItem>Digital Media</SlBreadcrumbItem> </SlBreadcrumb> ); Source HTML React Alternatively, you can place dropdown menus in a prefix or suffix slot. Homepage Our Services Digital Media Web Design Web Design Web Development Marketing <sl-breadcrumb> <sl-breadcrumb-item>Homepage</sl-breadcrumb-item> <sl-breadcrumb-item>Our Services</sl-breadcrumb-item> <sl-breadcrumb-item>Digital Media</sl-breadcrumb-item> <sl-breadcrumb-item> Web Design <sl-dropdown slot="suffix"> <sl-button slot="trigger" size="small" circle> <sl-icon label="More options" name="three-dots"></sl-icon> </sl-button> <sl-menu> <sl-menu-item type="checkbox" checked>Web Design</sl-menu-item> <sl-menu-item type="checkbox">Web Development</sl-menu-item> <sl-menu-item type="checkbox">Marketing</sl-menu-item> </sl-menu> </sl-dropdown> </sl-breadcrumb-item> </sl-breadcrumb> import { SlBreadcrumb, SlBreadcrumbItem, SlButton, SlDropdown, SlIcon, SlMenu, SlMenuItem } from '@shoelace-style/shoelace/dist/react'; const App = () => ( <SlBreadcrumb> <SlBreadcrumbItem>Homepage</SlBreadcrumbItem> <SlBreadcrumbItem>Our Services</SlBreadcrumbItem> <SlBreadcrumbItem>Digital Media</SlBreadcrumbItem> <SlBreadcrumbItem> Web Design <SlDropdown slot="suffix"> <SlButton slot="trigger" size="small" circle> <SlIcon label="More options" name="three-dots"></SlIcon> </SlButton> <SlMenu> <SlMenuItem type="checkbox" checked> Web Design </SlMenuItem> <SlMenuItem type="checkbox">Web Development</SlMenuItem> <SlMenuItem type="checkbox">Marketing</SlMenuItem> </SlMenu> </SlDropdown> </SlBreadcrumbItem> </SlBreadcrumb> ); Source HTML React Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/breadcrumb/breadcrumb.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/breadcrumb/breadcrumb.js'; To import this component using a bundler: import '@shoelace-style/shoelace/dist/components/breadcrumb/breadcrumb.js'; To import this component as a React component: import SlBreadcrumb from '@shoelace-style/shoelace/dist/react/breadcrumb'; Slots Name Description (default) One or more breadcrumb items to display. separator The separator to use between breadcrumb items. Works best with <sl-icon>. Learn more about using slots. Properties Name Description Reflects Type Default label The label to use for the breadcrumb control. This will not be shown on the screen, but it will be announced by screen readers and other assistive devices to provide more context for users. string '' updateComplete A read-only promise that resolves when the component has finished updating. Learn more about attributes and properties. Parts Name Description base The component’s base wrapper. Learn more about customizing CSS parts. Dependencies This component automatically imports the following dependencies. <sl-icon>'''
