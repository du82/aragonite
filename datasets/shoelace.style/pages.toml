title = "Menu Label"
description = "Menu labels are used to describe a group of menu items."
full_description = '''Menu Label Importing Slots Parts Menu Label <sl-menu-label> | SlMenuLabel Since 2.0 stable Menu labels are used to describe a group of menu items. Fruits Apple Banana Orange Vegetables Broccoli Carrot Zucchini <sl-menu style="max-width: 200px;"> <sl-menu-label>Fruits</sl-menu-label> <sl-menu-item value="apple">Apple</sl-menu-item> <sl-menu-item value="banana">Banana</sl-menu-item> <sl-menu-item value="orange">Orange</sl-menu-item> <sl-divider></sl-divider> <sl-menu-label>Vegetables</sl-menu-label> <sl-menu-item value="broccoli">Broccoli</sl-menu-item> <sl-menu-item value="carrot">Carrot</sl-menu-item> <sl-menu-item value="zucchini">Zucchini</sl-menu-item> </sl-menu> import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuLabel from '@shoelace-style/shoelace/dist/react/menu-label'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => ( <SlMenu style={{ maxWidth: '200px' }}> <SlMenuLabel>Fruits</SlMenuLabel> <SlMenuItem value="apple">Apple</SlMenuItem> <SlMenuItem value="banana">Banana</SlMenuItem> <SlMenuItem value="orange">Orange</SlMenuItem> <SlDivider /> <SlMenuLabel>Vegetables</SlMenuLabel> <SlMenuItem value="broccoli">Broccoli</SlMenuItem> <SlMenuItem value="carrot">Carrot</SlMenuItem> <SlMenuItem value="zucchini">Zucchini</SlMenuItem> </SlMenu> ); Source HTML React Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/menu-label/menu-label.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/menu-label/menu-label.js'; To import this component using a bundler: import '@shoelace-style/shoelace/dist/components/menu-label/menu-label.js'; To import this component as a React component: import SlMenuLabel from '@shoelace-style/shoelace/dist/react/menu-label'; Slots Name Description (default) The menu label’s content. Learn more about using slots. Parts Name Description base The component’s base wrapper. Learn more about customizing CSS parts.'''
