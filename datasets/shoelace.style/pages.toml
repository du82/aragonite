title = "Split Panel"
description = "Split panels display two adjacent panels, allowing the user to reposition them."
full_description = '''Split Panel Examples Initial Position Initial Position in Pixels Vertical Snapping Using a Custom Snap Function Disabled Setting the Primary Panel Min & Max Nested Split Panels Customizing the Divider Importing Slots Properties Events Custom Properties Parts Split Panel <sl-split-panel> | SlSplitPanel Since 2.0 stable Split panels display two adjacent panels, allowing the user to reposition them. Start End <sl-split-panel> <div slot="start" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; const App = () => ( <SlSplitPanel> <div slot="start" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > Start </div> <div slot="end" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > End </div> </SlSplitPanel> ); Source HTML React Examples Initial Position To set the initial position, use the position attribute. If no position is provided, it will default to 50% of the available space. Start End <sl-split-panel position="75"> <div slot="start" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> Source Initial Position in Pixels To set the initial position in pixels instead of a percentage, use the position-in-pixels attribute. Start End <sl-split-panel position-in-pixels="150"> <div slot="start" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; const App = () => ( <SlSplitPanel position="200"> <div slot="start" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > Start </div> <div slot="end" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > End </div> </SlSplitPanel> ); Source HTML React Vertical Add the vertical attribute to render the split panel in a vertical orientation where the start and end panels are stacked. You also need to set a height when using the vertical orientation. Start End <sl-split-panel vertical style="height: 400px;"> <div slot="start" style="height: 100%; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 100%; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; const App = () => ( <SlSplitPanel vertical style={{ height: '400px' }}> <div slot="start" style={{ height: '100%', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > Start </div> <div slot="end" style={{ height: '100%', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > End </div> </SlSplitPanel> ); Source HTML React Snapping To snap panels at specific positions while dragging, you can use the snap attribute. You can provide one or more space-separated pixel or percentage values, either as single values or within a repeat() expression, which will be repeated along the length of the panel. You can also customize how close the divider must be before snapping with the snap-threshold attribute. For example, to snap the panel at 100px and 50%, use snap="100px 50%". Start End .split-panel-snapping { position: relative; } .split-panel-snapping-dots::before, .split-panel-snapping-dots::after { content: ''; position: absolute; bottom: -12px; width: 6px; height: 6px; border-radius: 50%; background: var(--sl-color-neutral-400); transform: translateX(-3px); } .split-panel-snapping .split-panel-snapping-dots::before { left: 100px; } .split-panel-snapping .split-panel-snapping-dots::after { left: 50%; } <div class="split-panel-snapping"> <sl-split-panel snap="100px 50%"> <div slot="start" style="height: 150px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 150px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> <div class="split-panel-snapping-dots"></div> </div> <style> .split-panel-snapping { position: relative; } .split-panel-snapping-dots::before, .split-panel-snapping-dots::after { content: ''; position: absolute; bottom: -12px; width: 6px; height: 6px; border-radius: 50%; background: var(--sl-color-neutral-400); transform: translateX(-3px); } .split-panel-snapping .split-panel-snapping-dots::before { left: 100px; } .split-panel-snapping .split-panel-snapping-dots::after { left: 50%; } </style> Source Or, if you want to snap the panel to every 100px interval, as well as at 50% of the panel’s size, you can use snap="repeat(100px) 50%". Start End .split-panel-snapping-repeat { position: relative; } <div class="split-panel-snapping-repeat"> <sl-split-panel snap="repeat(100px) 50%"> <div slot="start" style="height: 150px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 150px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> </div> <style> .split-panel-snapping-repeat { position: relative; } </style> Source Using a Custom Snap Function You can also implement a custom snap function which controls the snapping manually. To do this, you need to acquire a reference to the element in Javascript and set the snap property. For example, if you want to snap the divider to either 100px from the left or 100px from the right, you can set the snap property to a function encoding that logic. panel.snap = ({ pos, size }) => (pos < size / 2 ? 100 : size - 100); Note that the snap-threshold property will not automatically be applied if snap is set to a function. Instead, the function itself must handle applying the threshold if desired, and is passed a snapThreshold member with its parameters. Start End .split-panel-snapping-fn { position: relative; } .split-panel-snapping-fn .split-panel-snapping-dots::before, .split-panel-snapping-fn .split-panel-snapping-dots::after { content: ''; position: absolute; bottom: -12px; width: 6px; height: 6px; border-radius: 50%; background: var(--sl-color-neutral-400); transform: translateX(-3px); } .split-panel-snapping-fn .split-panel-snapping-dots::before { left: 100px; } .split-panel-snapping-fn .split-panel-snapping-dots::after { left: calc(100% - 100px); } (() => { const container = document.querySelector('.split-panel-snapping-fn'); const splitPanel = container.querySelector('sl-split-panel'); splitPanel.snap = ({ pos, size }) => (pos < size / 2 ? 100 : size - 100); })(); <div class="split-panel-snapping-fn"> <sl-split-panel> <div slot="start" style="height: 150px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 150px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> <div class="split-panel-snapping-dots"></div> </div> <style> .split-panel-snapping-fn { position: relative; } .split-panel-snapping-fn .split-panel-snapping-dots::before, .split-panel-snapping-fn .split-panel-snapping-dots::after { content: ''; position: absolute; bottom: -12px; width: 6px; height: 6px; border-radius: 50%; background: var(--sl-color-neutral-400); transform: translateX(-3px); } .split-panel-snapping-fn .split-panel-snapping-dots::before { left: 100px; } .split-panel-snapping-fn .split-panel-snapping-dots::after { left: calc(100% - 100px); } </style> <script> const container = document.querySelector('.split-panel-snapping-fn'); const splitPanel = container.querySelector('sl-split-panel'); splitPanel.snap = ({ pos, size }) => (pos < size / 2) ? 100 : (size - 100); </script> import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; const css = ` .split-panel-snapping { position: relative; } .split-panel-snapping-dots::before, .split-panel-snapping-dots::after { content: ''; position: absolute; bottom: -12px; width: 6px; height: 6px; border-radius: 50%; background: var(--sl-color-neutral-400); transform: translateX(-3px); } .split-panel-snapping-dots::before { left: 100px; } .split-panel-snapping-dots::after { left: 50%; } `; const App = () => ( <> <div className="split-panel-snapping"> <SlSplitPanel snap="100px 50%"> <div slot="start" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > Start </div> <div slot="end" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > End </div> </SlSplitPanel> <div className="split-panel-snapping-dots" /> </div> <style>{css}</style> </> ); Source HTML React Disabled Add the disabled attribute to prevent the divider from being repositioned. Start End <sl-split-panel disabled> <div slot="start" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; const App = () => ( <SlSplitPanel disabled> <div slot="start" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > Start </div> <div slot="end" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > End </div> </SlSplitPanel> ); Source HTML React Setting the Primary Panel By default, both panels will grow or shrink proportionally when the host element is resized. If a primary panel is designated, it will maintain its size and the secondary panel will grow or shrink to fit the remaining space. You can set the primary panel to start or end using the primary attribute. Try resizing the example below with each option and notice how the panels respond. Start End None Start End (() => { const container = document.querySelector('.split-panel-primary'); const splitPanel = container.querySelector('sl-split-panel'); const select = container.querySelector('sl-select'); select.addEventListener('sl-change', () => (splitPanel.primary = select.value)); })(); <div class="split-panel-primary"> <sl-split-panel> <div slot="start" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> <sl-select label="Primary Panel" value="" style="max-width: 200px; margin-top: 1rem;"> <sl-option value="">None</sl-option> <sl-option value="start">Start</sl-option> <sl-option value="end">End</sl-option> </sl-select> </div> <script> const container = document.querySelector('.split-panel-primary'); const splitPanel = container.querySelector('sl-split-panel'); const select = container.querySelector('sl-select'); select.addEventListener('sl-change', () => (splitPanel.primary = select.value)); </script> import { useState } from 'react'; import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => { const [primary, setPrimary] = useState(''); return ( <> <SlSplitPanel primary={primary}> <div slot="start" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > Start </div> <div slot="end" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} > End </div> </SlSplitPanel> <SlSelect label="Primary Panel" value={primary} style={{ maxWidth: '200px', marginTop: '1rem' }} onSlChange={event => setPrimary(event.target.value)} > <SlMenuItem value="">None</SlMenuItem> <SlMenuItem value="start">Start</SlMenuItem> <SlMenuItem value="end">End</SlMenuItem> </SlSelect> </> ); }; Source HTML React Min & Max To set a minimum or maximum size of the primary panel, use the --min and --max custom properties. Since the secondary panel is flexible, size constraints can only be applied to the primary panel. If no primary panel is designated, these constraints will be applied to the start panel. This examples demonstrates how you can ensure both panels are at least 150px using --min, --max, and the calc() function. Start End <sl-split-panel style="--min: 150px; --max: calc(100% - 150px);"> <div slot="start" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > Start </div> <div slot="end" style="height: 200px; background: var(--sl-color-neutral-50); display: flex; align-items: center; justify-content: center; overflow: hidden;" > End </div> </sl-split-panel> import SlSplitPanel from '@shoelace-style/shoelace/dist/react/split-panel'; const App = () => ( <SlSplitPanel style={{ '--min': '150px', '--max': 'calc(100% - 150px)' }}> <div slot="start" style={{ height: '200px', background: 'var(--sl-color-neutral-50)', display: 'flex', alignItems: 'c'''
