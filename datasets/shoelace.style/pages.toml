CarouselItem> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </SlCarouselItem> </SlCarousel> ); Source HTML React Navigation Use the navigation attribute to show previous and next buttons. <sl-carousel navigation> <sl-carousel-item> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </sl-carousel-item> </sl-carousel> import SlCarousel from '@shoelace-style/shoelace/dist/react/carousel'; import SlCarouselItem from '@shoelace-style/shoelace/dist/react/carousel-item'; const App = () => ( <SlCarousel navigation> <SlCarouselItem> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </SlCarouselItem> </SlCarousel> ); Source HTML React Looping By default, the carousel will not advanced beyond the first and last slides. You can change this behavior and force the carousel to “wrap” with the loop attribute. <sl-carousel loop navigation pagination> <sl-carousel-item> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </sl-carousel-item> </sl-carousel> import SlCarousel from '@shoelace-style/shoelace/dist/react/carousel'; import SlCarouselItem from '@shoelace-style/shoelace/dist/react/carousel-item'; const App = () => ( <SlCarousel loop navigation pagination> <SlCarouselItem> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </SlCarouselItem> </SlCarousel> ); Source HTML React Autoplay The carousel will automatically advance when the autoplay attribute is used. To change how long a slide is shown before advancing, set autoplay-interval to the desired number of milliseconds. For best results, use the loop attribute when autoplay is enabled. Note that autoplay will pause while the user interacts with the carousel. <sl-carousel autoplay loop pagination> <sl-carousel-item> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </sl-carousel-item> </sl-carousel> import SlCarousel from '@shoelace-style/shoelace/dist/react/carousel'; import SlCarouselItem from '@shoelace-style/shoelace/dist/react/carousel-item'; const App = () => ( <SlCarousel autoplay loop pagination> <SlCarouselItem> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </SlCarouselItem> </SlCarousel> ); Source HTML React Mouse Dragging The carousel uses scroll snap to position slides at various snap positions. This allows users to scroll through the slides very naturally, especially on touch devices. Unfortunately, desktop users won’t be able to click and drag with a mouse, which can feel unnatural. Adding the mouse-dragging attribute can help with this. This example is best demonstrated using a mouse. Try clicking and dragging the slide to move it. Then toggle the switch and try again. Enable mouse dragging (() => { const container = document.querySelector('.mouse-dragging'); const carousel = container.querySelector('sl-carousel'); const toggle = container.querySelector('sl-switch'); toggle.addEventListener('sl-change', () => { carousel.toggleAttribute('mouse-dragging', toggle.checked); }); })(); <div class="mouse-dragging"> <sl-carousel pagination> <sl-carousel-item> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </sl-carousel-item> </sl-carousel> <sl-divider></sl-divider> <sl-switch>Enable mouse dragging</sl-switch> </div> <script> const container = document.querySelector('.mouse-dragging'); const carousel = container.querySelector('sl-carousel'); const toggle = container.querySelector('sl-switch'); toggle.addEventListener('sl-change', () => { carousel.toggleAttribute('mouse-dragging', toggle.checked); }); </script> import { useState } from 'react'; import SlCarousel from '@shoelace-style/shoelace/dist/react/carousel'; import SlCarouselItem from '@shoelace-style/shoelace/dist/react/carousel-item'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlSwitch from '@shoelace-style/shoelace/dist/react/switch'; const App = () => { const [isEnabled, setIsEnabled] = useState(false); return ( <> <SlCarousel navigation mouseDragging={isEnabled}> <SlCarouselItem> <img alt="The sun shines on the mountains and trees (by Adam Kool on Unsplash)" src="/assets/examples/carousel/mountains.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A waterfall in the middle of a forest (by Thomas Kelly on Unsplash)" src="/assets/examples/carousel/waterfall.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="The sun is setting over a lavender field (by Leonard Cotte on Unsplash)" src="/assets/examples/carousel/sunset.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A field of grass with the sun setting in the background (by Sapan Patel on Unsplash)" src="/assets/examples/carousel/field.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A scenic view of a mountain with clouds rolling in (by V2osk on Unsplash)" src="/assets/examples/carousel/valley.jpg" /> </SlCarouselItem> </SlCarousel> <SlDivider></SlDivider> <SlSwitch checked={isEnabled} onSlInput={() => setIsEnabled(!isEnabled)}> Enable mouse dragging </SlSwitch> </> ); }; Source HTML React Multiple Slides Per View The slides-per-page attribute makes it possible to display multiple slides at a time. You can also use the slides-per-move attribute to advance more than once slide at a time, if desired. Slide 1 Slide 2 Slide 3 Slide 4 Slide 5 Slide 6 <sl-carousel navigation pagination slides-per-page="2" slides-per-move="2"> <sl-carousel-item style="background: var(--sl-color-red-200);">Slide 1</sl-car'''
