full_description = '''Dialog Examples Custom Width Scrolling Header Actions Preventing the Dialog from Closing Customizing Initial Focus Importing Slots Properties Events Methods Custom Properties Parts Animations Dependencies Dialog <sl-dialog> | SlDialog Since 2.0 stable Dialogs, sometimes called “modals”, appear above the page and require the user’s immediate attention. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Close Open Dialog (() => { const dialog = document.querySelector('.dialog-overview'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); })(); <sl-dialog label="Dialog" class="dialog-overview"> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-dialog> <sl-button>Open Dialog</sl-button> <script> const dialog = document.querySelector('.dialog-overview'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDialog label="Dialog" open={open} onSlAfterHide={() => setOpen(false)}> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDialog> <SlButton onClick={() => setOpen(true)}>Open Dialog</SlButton> </> ); }; Source HTML React Examples Custom Width Use the --width custom property to set the dialog’s width. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Close Open Dialog (() => { const dialog = document.querySelector('.dialog-width'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); })(); <sl-dialog label="Dialog" class="dialog-width" style="--width: 50vw;"> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-dialog> <sl-button>Open Dialog</sl-button> <script> const dialog = document.querySelector('.dialog-width'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDialog label="Dialog" open={open} style={{ '--width': '50vw' }} onSlAfterHide={() => setOpen(false)}> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDialog> <SlButton onClick={() => setOpen(true)}>Open Dialog</SlButton> </> ); }; Source HTML React Scrolling By design, a dialog’s height will never exceed that of the viewport. As such, dialogs will not scroll with the page ensuring the header and footer are always accessible to the user. Scroll down and give it a try! 👇 Close Open Dialog (() => { const dialog = document.querySelector('.dialog-scrolling'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); })(); <sl-dialog label="Dialog" class="dialog-scrolling"> <div style="height: 150vh; border: dashed 2px var(--sl-color-neutral-200); padding: 0 1rem;"> <p>Scroll down and give it a try! 👇</p> </div> <sl-button slot="footer" variant="primary">Close</sl-button> </sl-dialog> <sl-button>Open Dialog</sl-button> <script> const dialog = document.querySelector('.dialog-scrolling'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDialog label="Dialog" open={open} onSlAfterHide={() => setOpen(false)}> <div style={{ height: '150vh', border: 'dashed 2px var(--sl-color-neutral-200)', padding: '0 1rem' }} > <p>Scroll down and give it a try! 👇</p> </div> <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDialog> <SlButton onClick={() => setOpen(true)}>Open Dialog</SlButton> </> ); }; Source HTML React Header Actions The header shows a functional close button by default. You can use the header-actions slot to add additional icon buttons if needed. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Close Open Dialog (() => { const dialog = document.querySelector('.dialog-header-actions'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); const newWindowButton = dialog.querySelector('.new-window'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); newWindowButton.addEventListener('click', () => window.open(location.href)); })(); <sl-dialog label="Dialog" class="dialog-header-actions"> <sl-icon-button class="new-window" slot="header-actions" name="box-arrow-up-right"></sl-icon-button> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-dialog> <sl-button>Open Dialog</sl-button> <script> const dialog = document.querySelector('.dialog-header-actions'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); const newWindowButton = dialog.querySelector('.new-window'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); newWindowButton.addEventListener('click', () => window.open(location.href)); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; import SlIconButton from '@shoelace-style/shoelace/dist/react/icon-button'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDialog label="Dialog" open={open} onSlAfterHide={() => setOpen(false)}> <SlIconButton class="new-window" slot="header-actions" name="box-arrow-up-right" onClick={() => window.open(location.href)} /> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDialog> <SlButton onClick={() => setOpen(true)}>Open Dialog</SlButton> </> ); }; Source HTML React Preventing the Dialog from Closing By default, dialogs will close when the user clicks the close button, clicks the overlay, or presses the Escape key. In most cases, the default behavior is the best behavior in terms of UX. However, there are situations where this may be undesirable, such as when data loss will occur. To keep the dialog open in such cases, you can cancel the sl-request-close event. When canceled, the dialog will remain open and pulse briefly to draw the user’s attention to it. You can use event.detail.source to determine what triggered the request to close. This example prevents the dialog from closing when the overlay is clicked, but allows the close button or Escape to dismiss it. This dialog will not close when you click on the overlay. Close Open Dialog (() => { const dialog = document.querySelector('.dialog-deny-close'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); // Prevent the dialog from closing when the user clicks on the overlay dialog.addEventListener('sl-request-close', event => { if (event.detail.source === 'overlay') { event.preventDefault(); } }); })(); <sl-dialog label="Dialog" class="dialog-deny-close"> This dialog will not close when you click on the overlay. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-dialog> <sl-button>Open Dialog</sl-button> <script> const dialog = document.querySelector('.dialog-deny-close'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); // Prevent the dialog from closing when the user clicks on the overlay dialog.addEventListener('sl-request-close', event => { if (event.detail.source === 'overlay') { event.preventDefault(); } }); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; const App = () => { const [open, setOpen] = useState(false); // Prevent the dialog from closing when the user clicks on the overlay function handleRequestClose(event) { if (event.detail.source === 'overlay') { event.preventDefault(); } } return ( <> <SlDialog label="Dialog" open={open} onSlRequestClose={handleRequestClose} onSlAfterHide={() => setOpen(false)}> This dialog will not close when you click on the overlay. <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDialog> <SlButton onClick={() => setOpen(true)}>Open Dialog</SlButton> </> ); }; Source HTML React Customizing Initial Focus By default, the dialog’s panel will gain focus when opened. This allows a subsequent tab press to focus on the first tabbable element in the dialog. If you want a different element to have focus, add the autofocus attribute to it as shown below. Close Open Dialog (() => { const dialog = document.querySelector('.dialog-focus'); const input = dialog.querySelector('sl-input'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); })(); <sl-dialog label="Dialog" class="dialog-focus"> <sl-input autofocus placeholder="I will have focus when the dialog is opened"></sl-input> <sl-button slot="footer" variant="primary">Close</sl-button> </sl-dialog> <sl-button>Open Dialog</sl-button> <script> const dialog = document.querySelector('.dialog-focus'); const input = dialog.querySelector('sl-input'); const openButton = dialog.nextElementSibling; const closeButton = dialog.querySelector('sl-button[slot="footer"]'); openButton.addEventListener('click', () => dialog.show()); closeButton.addEventListener('click', () => dialog.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; import SlInput from '@shoelace-style/shoelace/dist/react/input'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDialog label="Dialog" open={open} onSlAfterHide={() => setOpen(false)}> <SlInput autofocus placeholder="I will have focus when the dialog is opened" /> <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDialog> <SlButton onClick={() => setOpen(true)}>Open Dialog</SlButton> </> ); }; Source HTML React You can further customize initial focus behavior by canceling the sl-initial-focus event and setting focus yourself inside the event handler. Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/dialog/dialog.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/dialog/dialog.js'; To import this component using a bundler: import '@shoelace-style/shoelace/dist/components/dialog/dialog.js'; To import this component as a React component: import SlDialog from '@shoelace-style/shoelace/dist/react/dialog'; Slots Name Description (default) The dialog’s main content. label The dialog’s label. Alternatively, you can use the label attribute. header-actions Optional actions to add to the header. Works best with <sl-icon-button>. footer The dialog’s footer, usually one or more buttons representing various options. Learn more about using slots. Properties Name Description Reflects Type Default modal Exposes the internal modal utility that controls focus trapping. To temporarily disable focus trapping and allow third-party modals spawned from an active Shoelace modal, call modal.activateExternal() when the third-party modal opens. Upon closing, call modal.deactivateExternal() to restore Shoelace’s focus trapping. - new Modal(this) open Indicates whether or not the dialog is open. You can toggle this attribute to show and hide the dialog, or you can use the show() and hide() methods and this attribute will reflect the dialog’s open state. boolean false label The dialog’s label as displayed in the header. You should always include a relevant label even when using no-header, as it is required for proper accessibility. If you need to display HTML, use the label slot instead. string '' noHeader no-header Disables the header. This will also remove the default close button, so please ensure you provide an easy, accessible way for users to dismiss the dialog. boolean false updateComplete A read-only promise that resolves when the component has finished updating. Learn more about attributes and properties. Events Name React Event Description Event Detail sl-show onSlShow Emitted when the dialog opens. - sl-after-show onSlAfterShow Emitted after the dialog opens and all animations are complete. - sl-hide onSlHide Emitted when the dialog closes. - sl-after-hide onSlAfterHide Emitted after the dialog closes and all animations are comple'''
