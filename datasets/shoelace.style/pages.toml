["https://shoelace.style/components/button-group"]
title = "Button Group"
description = "Button groups can be used to group related buttons into sections."
full_description = '''Button Group Examples Button Sizes Theme Buttons Pill Buttons Dropdowns in Button Groups Split Buttons Tooltips in Button Groups Toolbar Example Importing Slots Properties Parts Button Group <sl-button-group> | SlButtonGroup Since 2.0 stable Button groups can be used to group related buttons into sections. Left Center Right <sl-button-group label="Alignment"> <sl-button>Left</sl-button> <sl-button>Center</sl-button> <sl-button>Right</sl-button> </sl-button-group> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlButtonGroup from '@shoelace-style/shoelace/dist/react/button-group'; const App = () => ( <SlButtonGroup label="Alignment"> <SlButton>Left</SlButton> <SlButton>Center</SlButton> <SlButton>Right</SlButton> </SlButtonGroup> ); Source HTML React Examples Button Sizes All button sizes are supported, but avoid mixing sizes within the same button group. Left Center Right Left Center Right Left Center Right <sl-button-group label="Alignment"> <sl-button size="small">Left</sl-button> <sl-button size="small">Center</sl-button> <sl-button size="small">Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button size="medium">Left</sl-button> <sl-button size="medium">Center</sl-button> <sl-button size="medium">Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button size="large">Left</sl-button> <sl-button size="large">Center</sl-button> <sl-button size="large">Right</sl-button> </sl-button-group> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlButtonGroup from '@shoelace-style/shoelace/dist/react/button-group'; const App = () => ( <> <SlButtonGroup label="Alignment"> <SlButton size="small">Left</SlButton> <SlButton size="small">Center</SlButton> <SlButton size="small">Right</SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton size="medium">Left</SlButton> <SlButton size="medium">Center</SlButton> <SlButton size="medium">Right</SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton size="large">Left</SlButton> <SlButton size="large">Center</SlButton> <SlButton size="large">Right</SlButton> </SlButtonGroup> </> ); Source HTML React Theme Buttons Theme buttons are supported through the button’s variant attribute. Left Center Right Left Center Right Left Center Right Left Center Right Left Center Right <sl-button-group label="Alignment"> <sl-button variant="primary">Left</sl-button> <sl-button variant="primary">Center</sl-button> <sl-button variant="primary">Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button variant="success">Left</sl-button> <sl-button variant="success">Center</sl-button> <sl-button variant="success">Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button variant="neutral">Left</sl-button> <sl-button variant="neutral">Center</sl-button> <sl-button variant="neutral">Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button variant="warning">Left</sl-button> <sl-button variant="warning">Center</sl-button> <sl-button variant="warning">Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button variant="danger">Left</sl-button> <sl-button variant="danger">Center</sl-button> <sl-button variant="danger">Right</sl-button> </sl-button-group> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlButtonGroup from '@shoelace-style/shoelace/dist/react/button-group'; const App = () => ( <> <SlButtonGroup label="Alignment"> <SlButton variant="primary">Left</SlButton> <SlButton variant="primary">Center</SlButton> <SlButton variant="primary">Right</SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton variant="success">Left</SlButton> <SlButton variant="success">Center</SlButton> <SlButton variant="success">Right</SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton variant="neutral">Left</SlButton> <SlButton variant="neutral">Center</SlButton> <SlButton variant="neutral">Right</SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton variant="warning">Left</SlButton> <SlButton variant="warning">Center</SlButton> <SlButton variant="warning">Right</SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton variant="danger">Left</SlButton> <SlButton variant="danger">Center</SlButton> <SlButton variant="danger">Right</SlButton> </SlButtonGroup> </> ); Source HTML React Pill Buttons Pill buttons are supported through the button’s pill attribute. Left Center Right Left Center Right Left Center Right <sl-button-group label="Alignment"> <sl-button size="small" pill>Left</sl-button> <sl-button size="small" pill>Center</sl-button> <sl-button size="small" pill>Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button size="medium" pill>Left</sl-button> <sl-button size="medium" pill>Center</sl-button> <sl-button size="medium" pill>Right</sl-button> </sl-button-group> <br /><br /> <sl-button-group label="Alignment"> <sl-button size="large" pill>Left</sl-button> <sl-button size="large" pill>Center</sl-button> <sl-button size="large" pill>Right</sl-button> </sl-button-group> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlButtonGroup from '@shoelace-style/shoelace/dist/react/button-group'; const App = () => ( <> <SlButtonGroup label="Alignment"> <SlButton size="small" pill> Left </SlButton> <SlButton size="small" pill> Center </SlButton> <SlButton size="small" pill> Right </SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup label="Alignment"> <SlButton size="medium" pill> Left </SlButton> <SlButton size="medium" pill> Center </SlButton> <SlButton size="medium" pill> Right </SlButton> </SlButtonGroup> <br /> <br /> <SlButtonGroup