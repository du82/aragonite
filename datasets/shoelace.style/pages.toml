["https://shoelace.style/components/icon"]
title = "Icon"
description = "Icons are symbols that can be used to represent various options within an application."
full_description = '''Icon Default Icons Examples Colors Sizing Labels Custom Icons Icon Libraries Boxicons Lucide Font Awesome Heroicons Iconoir Ionicons Jam Icons Material Icons Remix Icon Tabler Icons Unicons Customizing the Default Library Customizing the System Library Importing Properties Events Parts Icon <sl-icon> | SlIcon Since 2.0 stable Icons are symbols that can be used to represent various options within an application. Shoelace comes bundled with over 1,500 icons courtesy of the Bootstrap Icons project. These icons are part of the default icon library. If you prefer, you can register custom icon libraries as well. Depending on how you’re loading Shoelace, you may need to copy icon assets and/or set the base path so Shoelace knows where to load them from. Otherwise, icons may not appear and you’ll see 404 Not Found errors in the dev console. Default Icons All available icons in the default icon library are shown below. Click or tap on any icon to copy its name, then you can use it in your HTML like this. <sl-icon name="icon-name-here"></sl-icon> Outlined Filled All icons Examples Colors Icons inherit their color from the current text color. Thus, you can set the color property on the <sl-icon> element or an ancestor to change the color. <div style="color: #4a90e2;"> <sl-icon name="exclamation-triangle"></sl-icon> <sl-icon name="archive"></sl-icon> <sl-icon name="battery-charging"></sl-icon> <sl-icon name="bell"></sl-icon> </div> <div style="color: #9013fe;"> <sl-icon name="clock"></sl-icon> <sl-icon name="cloud"></sl-icon> <sl-icon name="download"></sl-icon> <sl-icon name="file-earmark"></sl-icon> </div> <div style="color: #417505;"> <sl-icon name="flag"></sl-icon> <sl-icon name="heart"></sl-icon> <sl-icon name="image"></sl-icon> <sl-icon name="lightning"></sl-icon> </div> <div style="color: #f5a623;"> <sl-icon name="mic"></sl-icon> <sl-icon name="search"></sl-icon> <sl-icon name="star"></sl-icon> <sl-icon name="trash"></sl-icon> </div> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; const App = () => ( <> <div style={{ color: '#4a90e2' }}> <SlIcon name="exclamation-triangle"></SlIcon> <SlIcon name="archive"></SlIcon> <SlIcon name="battery-charging"></SlIcon> <SlIcon name="bell"></SlIcon> </div> <div style={{ color: '#9013fe' }}> <SlIcon name="clock"></SlIcon> <SlIcon name="cloud"></SlIcon> <SlIcon name="download"></SlIcon> <SlIcon name="file-earmark"></SlIcon> </div> <div style={{ color: '#417505' }}> <SlIcon name="flag"></SlIcon> <SlIcon name="heart"></SlIcon> <SlIcon name="image"></SlIcon> <SlIcon name="lightning"></SlIcon> </div> <div style={{ color: '#f5a623' }}> <SlIcon name="mic"></SlIcon> <SlIcon name="search"></SlIcon> <SlIcon name="star"></SlIcon> <SlIcon name="trash"></SlIcon> </div> </> ); Source HTML React Sizing Icons are sized relative to the current font size. To change their size, set the font-size property on the icon itself or on a parent element as shown below. <div style="font-size: 32px;"> <sl-icon name="exclamation-triangle"></sl-icon> <sl-icon name="archive"></sl-icon> <sl-icon name="battery-charging"></sl-icon> <sl-icon name="bell"></sl-icon> <sl-icon name="clock"></sl-icon> <sl-icon name="cloud"></sl-icon> <sl-icon name="download"></sl-icon> <sl-icon name="file-earmark"></sl-icon> <sl-icon name="flag"></sl-icon> <sl-icon name="heart"></sl-icon> <sl-icon name="image"></sl-icon> <sl-icon name="lightning"></sl-icon> <sl-icon name="mic"></sl-icon> <sl-icon name="search"></sl-icon> <sl-icon name="star"></sl-icon> <sl-icon name="trash"></sl-icon> </div> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; const App = () => ( <div style={{ fontSize: '32px' }}> <SlIcon name="exclamation-triangle" /> <SlIcon name="archive" /> <SlIcon name="battery-charging" /> <SlIcon name="bell" /> <SlIcon name="clock" /> <SlIcon name="cloud" /> <SlIcon name="download" /> <SlIcon name="file-earmark" /> <SlIcon name="flag" /> <SlIcon name="heart" /> <SlIcon name="image" /> <SlIcon name="lightning" /> <SlIcon name="mic" /> <SlIcon name="search" /> <SlIcon name="star" /> <SlIcon name="trash" /> </div> ); Source HTML React Labels For non-decorative icons, use the label attribute to announce it to assistive devices. <sl-icon name="star-fill" label="Add to favorites"></sl-icon> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; const App = () => <SlIcon name="star-fill" label="Add to favorites" />; Source HTML React Custom Icons Custom icons can be loaded individually with the src attribute. Only SVGs on a local or CORS-enabled endpoint are supported. If you’re using more than one custom icon, it might make sense to register a custom icon library. <sl-icon src="https://shoelace.style/assets/images/shoe.svg" style="font-size: 8rem;"></sl-icon> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; const App = () => <SlIcon src="https://shoelace.style/assets/images/shoe.svg" style={{ fontSize: '8rem' }}></SlIcon>; Source HTML React Icon Libraries You can register additional icons to use with the <sl-icon> component through icon libraries. Icon files can exist locally or on a CORS-enabled endpoint (e.g. a CDN). There is no limit to how many icon libraries you can register and there is no cost associated with registering them, as individual icons are only requested when they’re used. Shoelace ships with two built-in icon libraries, default and system. The default icon library contains all of the icons in the Bootstrap Icons project. The system icon library contains only a small subset of icons that are used internally by Shoelace components. To register an additional icon library, use the registerIconLibrary() function that’s exported from utilities/icon-library.js. At a minimum, you must provide a name and a resolver function. The resolver function translates an icon name to a URL where the corresponding SVG file exists. Refer to the examples below to better understand how it works. If necessary, a mutator function can be used to mutate the SVG element before rendering. This is necessary for some libraries due to the many possible ways SVGs are crafted. For example, icons should ideally inherit the current text color via currentColor, so you may need to apply fill="currentColor or stroke="currentColor" to the SVG element using this function. Here’s an example that registers an icon library located in the /assets/icons directory. <script type="module"> import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('my-icons', { resolver: name => `/assets/icons/${name}.svg`, mutator: svg => svg.setAttribute('fill', 'currentColor') }); </script> To display an icon, set the library and name attributes of an <sl-icon> element. <!-- This will show the icon located at /assets/icons/smile.svg --> <sl-icon library="my-icons" name="smile"></sl-icon> If an icon is used before registration occurs, it will be empty initially but shown when registered. The following examples demonstrate how to register a number of popular, open source icon libraries via CDN. Feel free to adapt the code as you see fit to use your own origin or naming conventions. Boxicons This will register the Boxicons library using the jsDelivr CDN. This library has three variations: regular (bx-*), solid (bxs-*), and logos (bxl-*). A mutator function is required to set the SVG’s fill to currentColor. Icons in this library are licensed under the Creative Commons 4.0 License. import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('boxicons', { resolver: name => { let folder = 'regular'; if (name.substring(0, 4) === 'bxs-') folder = 'solid'; if (name.substring(0, 4) === 'bxl-') folder = 'logos'; return `https://cdn.jsdelivr.net/npm/boxicons@2.0.5/svg/${folder}/${name}.svg`; }, mutator: svg => svg.setAttribute('fill', 'currentColor') }); <script type="module"> import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('boxicons', { resolver: name => { let folder = 'regular'; if (name.substring(0, 4) === 'bxs-') folder = 'solid'; if (name.substring(0, 4) === 'bxl-') folder = 'logos'; return `https://cdn.jsdelivr.net/npm/boxicons@2.0.5/svg/${folder}/${name}.svg`; }, mutator: svg => svg.setAttribute('fill', 'currentColor') }); </script> <div style="font-size: 24px;"> <sl-icon library="boxicons" name="bx-bot"></sl-icon> <sl-icon library="boxicons" name="bx-cookie"></sl-icon> <sl-icon library="boxicons" name="bx-joystick"></sl-icon> <sl-icon library="boxicons" name="bx-save"></sl-icon> <sl-icon library="boxicons" name="bx-server"></sl-icon> <sl-icon library="boxicons" name="bx-wine"></sl-icon> <br /> <sl-icon library="boxicons" name="bxs-bot"></sl-icon> <sl-icon library="boxicons" name="bxs-cookie"></sl-icon> <sl-icon library="boxicons" name="bxs-joystick"></sl-icon> <sl-icon library="boxicons" name="bxs-save"></sl-icon> <sl-icon library="boxicons" name="bxs-server"></sl-icon> <sl-icon library="boxicons" name="bxs-wine"></sl-icon> <br /> <sl-icon library="boxicons" name="bxl-apple"></sl-icon> <sl-icon library="boxicons" name="bxl-chrome"></sl-icon> <sl-icon library="boxicons" name="bxl-edge"></sl-icon> <sl-icon library="boxicons" name="bxl-firefox"></sl-icon> <sl-icon library="boxicons" name="bxl-opera"></sl-icon> <sl-icon library="boxicons" name="bxl-microsoft"></sl-icon> </div> Source Lucide This will register the Lucide icon library using the jsDelivr CDN. This project is a community-maintained fork of the popular Feather icon library. Icons in this library are licensed under the MIT License. import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('lucide', { resolver: name => `https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/icons/${name}.svg` }); <div style="font-size: 24px;"> <sl-icon library="lucide" name="feather"></sl-icon> <sl-icon library="lucide" name="pie-chart"></sl-icon> <sl-icon library="lucide" name="settings"></sl-icon> <sl-icon library="lucide" name="map-pin"></sl-icon> <sl-icon library="lucide" name="printer"></sl-icon> <sl-icon library="lucide" name="shopping-cart"></sl-icon> </div> <script type="module"> import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('lucide', { resolver: name => `https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/icons/${name}.svg` }); </script> Source Font Awesome This will register the Font Awesome Free library using the jsDelivr CDN. This library has three variations: regular (far-*), solid (fas-*), and brands (fab-*). A mutator function is required to set the SVG’s fill to currentColor. Icons in this library are licensed under the Font Awesome Free License. Some of the icons that appear on the Font Awesome website require a license and are therefore not available in the CDN. import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('fa', { resolver: name => { const filename = name.replace(/^fa[rbs]-/, ''); let folder = 'regular'; if (name.substring(0, 4) === 'fas-') folder = 'solid'; if (name.substring(0, 4) === 'fab-') folder = 'brands'; return `https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.1/svgs/${folder}/${filename}.svg`; }, mutator: svg => svg.setAttribute('fill', 'currentColor') }); <script type="module"> import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('fa', { resolver: name => { const filename = name.replace(/^fa[rbs]-/, ''); let folder = 'regular'; if (name.substring(0, 4) === 'fas-') folder = 'solid'; if (name.substring(0, 4) === 'fab-') folder = 'brands'; return `https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.1/svgs/${folder}/${filename}.svg`; }, mutator: svg => svg.setAttribute('fill', 'currentColor') }); </script> <div style="font-size: 24px;"> <sl-icon library="fa" name="far-bell"></sl-icon> <sl-icon library="fa" name="far-comment"></sl-icon> <sl-icon library="fa" name="far-hand-point-right"></sl-icon> <sl-icon library="fa" name="far-hdd"></sl-icon> <sl-icon library="fa" name="far-heart"></sl-icon> <sl-icon library="fa" name="far-star"></sl-icon> <br /> <sl-icon library="fa" name="fas-archive"></sl-icon> <sl-icon library="fa" name="fas-book"></sl-icon> <sl-icon library="fa" name="fas-chess-knight"></sl-icon> <sl-icon library="fa" name="fas-dice"></sl-icon> <sl-icon library="fa" name="fas-pizza-slice"></sl-icon> <sl-icon library="fa" name="fas-scroll"></sl-icon> <br /> <sl-icon library="fa" name="fab-apple"></sl-icon> <sl-icon library="fa" name="fab-chrome"></sl-icon> <sl-icon library="fa" name="fab-edge"></sl-icon> <sl-icon library="fa" name="fab-firefox"></sl-icon> <sl-icon library="fa" name="fab-opera"></sl-icon> <sl-icon library="fa" name="fab-microsoft"></sl-icon> </div> Source Heroicons This will register the Heroicons library using the jsDelivr CDN. Icons in this library are licensed under the MIT License. import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('heroicons', { resolver: name => `https://cdn.jsdelivr.net/npm/heroicons@2.0.1/24/outline/${name}.svg` }); <script type="module"> import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('heroicons', { resolver: name => `https://cdn.jsdelivr.net/npm/heroicons@2.0.1/24/outline/${name}.svg` }); </script> <div style="font-size: 24px;"> <sl-icon library="heroicons" name="chat-bubble-left"></sl-icon> <sl-icon library="heroicons" name="cloud"></sl-icon> <sl-icon library="heroicons" name="cog"></sl-icon> <sl-icon library="heroicons" name="document-text"></sl-icon> <sl-icon library="heroicons" name="gift"></sl-icon> <sl-icon library="heroicons" name="speaker-wave"></sl-icon> </div> Source Iconoir This will register the Iconoir library using the jsDelivr CDN. Icons in this library are licensed under the MIT License. import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('iconoir', { resolver: name => `https://cdn.jsdelivr.net/gh/lucaburgio/iconoir@latest/icons/${name}.svg` }); <script type="module"> import { registerIconLibrary } from '/dist/utilities/icon-library.js'; registerIconLibrary('iconoir', { resolver: name => `https://cdn.jsdelivr.net/gh/lucaburgio/iconoir@latest/icons/${name}.svg` }); </script> <div style="font-size: 24px;"> <sl-icon library="iconoir" name="check-circled-outline"></sl-icon> <sl-icon library="iconoir" name="drawer"></sl-icon> <sl-icon library="iconoir" name="keyframes"></sl-icon> <sl-icon library="iconoir" name="headset-help"></sl-icon> <sl-icon library="iconoir" name="color-picker"></sl-icon> <sl-icon library="iconoir" name="wifi"></sl-icon> </div> Source Ionicons This will register the Ionicons library using the jsDelivr CDN. This library has three variations: outline (default), filled (*-filled), and sharp (*-sharp). A mutator function is required to polyfill a handful of styles we’re not including. Icons in this library are licensed under the MIT License. import { registerIconLibrary } from '/dist/utilities/icon'''
