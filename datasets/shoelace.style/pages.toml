en the drawer opens. <sl-drawer label="Drawer" contained class="drawer-contained" style="--size: 50%;"> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-drawer> </div> <sl-button>Toggle Drawer</sl-button> <script> const drawer = document.querySelector('.drawer-contained'); const openButton = drawer.parentElement.nextElementSibling; const closeButton = drawer.querySelector('sl-button[variant="primary"]'); openButton.addEventListener('click', () => (drawer.open = !drawer.open)); closeButton.addEventListener('click', () => drawer.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDrawer from '@shoelace-style/shoelace/dist/react/drawer'; const App = () => { const [open, setOpen] = useState(false); return ( <> <div style={{ position: 'relative', border: 'solid 2px var(--sl-panel-border-color)', height: '300px', padding: '1rem', marginBottom: '1rem' }} > The drawer will be contained to this box. This content won't shift or be affected in any way when the drawer opens. <SlDrawer label="Drawer" contained no-modal open={open} onSlAfterHide={() => setOpen(false)} style={{ '--size': '50%' }} > Lorem ipsum dolor sit amet, consectetur adipiscing elit. <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDrawer> </div> <SlButton onClick={() => setOpen(true)}>Open Drawer</SlButton> </> ); }; Source HTML React Custom Size Use the --size custom property to set the drawer’s size. This will be applied to the drawer’s width or height depending on its placement. This drawer is always 50% of the viewport. Close Open Drawer (() => { const drawer = document.querySelector('.drawer-custom-size'); const openButton = drawer.nextElementSibling; const closeButton = drawer.querySelector('sl-button[variant="primary"]'); openButton.addEventListener('click', () => drawer.show()); closeButton.addEventListener('click', () => drawer.hide()); })(); <sl-drawer label="Drawer" class="drawer-custom-size" style="--size: 50vw;"> This drawer is always 50% of the viewport. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-drawer> <sl-button>Open Drawer</sl-button> <script> const drawer = document.querySelector('.drawer-custom-size'); const openButton = drawer.nextElementSibling; const closeButton = drawer.querySelector('sl-button[variant="primary"]'); openButton.addEventListener('click', () => drawer.show()); closeButton.addEventListener('click', () => drawer.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDrawer from '@shoelace-style/shoelace/dist/react/drawer'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDrawer label="Drawer" open={open} onSlAfterHide={() => setOpen(false)} style={{ '--size': '50vw' }}> This drawer is always 50% of the viewport. <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDrawer> <SlButton onClick={() => setOpen(true)}>Open Drawer</SlButton> </> ); }; Source HTML React Scrolling By design, a drawer’s height will never exceed 100% of its container. As such, drawers will not scroll with the page to ensure the header and footer are always accessible to the user. Scroll down and give it a try! 👇 Close Open Drawer (() => { const drawer = document.querySelector('.drawer-scrolling'); const openButton = drawer.nextElementSibling; const closeButton = drawer.querySelector('sl-button[variant="primary"]'); openButton.addEventListener('click', () => drawer.show()); closeButton.addEventListener('click', () => drawer.hide()); })(); <sl-drawer label="Drawer" class="drawer-scrolling"> <div style="height: 150vh; border: dashed 2px var(--sl-color-neutral-200); padding: 0 1rem;"> <p>Scroll down and give it a try! 👇</p> </div> <sl-button slot="footer" variant="primary">Close</sl-button> </sl-drawer> <sl-button>Open Drawer</sl-button> <script> const drawer = document.querySelector('.drawer-scrolling'); const openButton = drawer.nextElementSibling; const closeButton = drawer.querySelector('sl-button[variant="primary"]'); openButton.addEventListener('click', () => drawer.show()); closeButton.addEventListener('click', () => drawer.hide()); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDrawer from '@shoelace-style/shoelace/dist/react/drawer'; const App = () => { const [open, setOpen] = useState(false); return ( <> <SlDrawer label="Drawer" open={open} onSlAfterHide={() => setOpen(false)}> <div style={{ height: '150vh', border: 'dashed 2px var(--sl-color-neutral-200)', padding: '0 1rem' }} > <p>Scroll down and give it a try! 👇</p> </div> <SlButton slot="footer" variant="primary" onClick={() => setOpen(false)}> Close </SlButton> </SlDrawer> <SlButton onClick={() => setOpen(true)}>Open Drawer</SlButton> </> ); }; Source HTML React Header Actions The header shows a functional close button by default. You can use the header-actions slot to add additional icon buttons if needed. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Close Open Drawer (() => { const drawer = document.querySelector('.drawer-header-actions'); const openButton = drawer.nextElementSibling; const closeButton = drawer.querySelector('sl-button[variant="primary"]'); const newWindowButton = drawer.querySelector('.new-window'); openButton.addEventListener('click', () => drawer.show()); closeButton.addEventListener('click', () => drawer.hide()); newWindowButton.addEventListener('click', () => window.open(location.href)); })(); <sl-drawer label="Drawer" class="drawer-header-actions"> <sl-icon-button class="new-window" slot="header-actions" name="box-arrow-up-right"></sl-icon-button> Lorem ipsum dolor sit amet, consectetur adipiscing elit. <sl-button slot="footer" variant="primary">Close</sl-button> </sl-drawer> <sl-button>Open Drawe