full_description = '''Carousel Item Importing Slots Custom Properties Carousel Item <sl-carousel-item> | SlCarouselItem Since 2.0 experimental A carousel item represent a slide within a carousel. <sl-carousel pagination> <sl-carousel-item> <img alt="The sun shines on the mountains and trees - Photo by Adam Kool on Unsplash" src="/assets/examples/carousel/mountains.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A waterfall in the middle of a forest - Photo by Thomas Kelly on Unsplash" src="/assets/examples/carousel/waterfall.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="The sun is setting over a lavender field - Photo by Leonard Cotte on Unsplash" src="/assets/examples/carousel/sunset.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A field of grass with the sun setting in the background - Photo by Sapan Patel on Unsplash" src="/assets/examples/carousel/field.jpg" /> </sl-carousel-item> <sl-carousel-item> <img alt="A scenic view of a mountain with clouds rolling in - Photo by V2osk on Unsplash" src="/assets/examples/carousel/valley.jpg" /> </sl-carousel-item> </sl-carousel> import SlCarousel from '@shoelace-style/shoelace/dist/react/carousel'; import SlCarouselItem from '@shoelace-style/shoelace/dist/react/carousel-item'; const App = () => ( <SlCarousel pagination> <SlCarouselItem> <img alt="The sun shines on the mountains and trees - Photo by Adam Kool on Unsplash" src="/assets/examples/carousel/mountains.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A waterfall in the middle of a forest - Photo by Thomas Kelly on Unsplash" src="/assets/examples/carousel/waterfall.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="The sun is setting over a lavender field - Photo by Leonard Cotte on Unsplash" src="/assets/examples/carousel/sunset.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A field of grass with the sun setting in the background - Photo by Sapan Patel on Unsplash" src="/assets/examples/carousel/field.jpg" /> </SlCarouselItem> <SlCarouselItem> <img alt="A scenic view of a mountain with clouds rolling in - Photo by V2osk on Unsplash" src="/assets/examples/carousel/valley.jpg" /> </SlCarouselItem> </SlCarousel> ); Source HTML React Additional demonstrations can be found in the carousel examples. Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/carousel-item/carousel-item.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/carousel-item/carousel-item.js'; To import this component using a bundler: import '@shoelace-style/shoelace/dist/components/carousel-item/carousel-item.js'; To import this component as a React component: import SlCarouselItem from '@shoelace-style/shoelace/dist/react/carousel-item'; Slots Name Description (default) The carousel item’s content.. Learn more about using slots. Custom Properties Name Description Default --aspect-ratio The slide’s aspect ratio. Inherited from the carousel by default. Learn more about customizing CSS custom properties.'''
