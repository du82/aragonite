title = "Skeleton"
description = "Skeletons are used to provide a visual representation of where content will eventually be drawn."
full_description = '''Skeleton Examples Effects Paragraphs Avatars Custom Shapes Custom Colors Importing Properties Custom Properties Parts Skeleton <sl-skeleton> | SlSkeleton Since 2.0 stable Skeletons are used to provide a visual representation of where content will eventually be drawn. These are simple containers for scaffolding layouts that mimic what users will see when content has finished loading. This prevents large areas of empty space during asynchronous operations. Skeletons try not to be opinionated, as there are endless possibilities for designing layouts. Therefore, you’ll likely use more than one skeleton to create the effect you want. If you find yourself using them frequently, consider creating a template that renders them with the desired arrangement and styles. .skeleton-overview header { display: flex; align-items: center; margin-bottom: 1rem; } .skeleton-overview header sl-skeleton:last-child { flex: 0 0 auto; width: 30%; } .skeleton-overview sl-skeleton { margin-bottom: 1rem; } .skeleton-overview sl-skeleton:nth-child(1) { float: left; width: 3rem; height: 3rem; margin-right: 1rem; vertical-align: middle; } .skeleton-overview sl-skeleton:nth-child(3) { width: 95%; } .skeleton-overview sl-skeleton:nth-child(4) { width: 80%; } <div class="skeleton-overview"> <header> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> </header> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> </div> <style> .skeleton-overview header { display: flex; align-items: center; margin-bottom: 1rem; } .skeleton-overview header sl-skeleton:last-child { flex: 0 0 auto; width: 30%; } .skeleton-overview sl-skeleton { margin-bottom: 1rem; } .skeleton-overview sl-skeleton:nth-child(1) { float: left; width: 3rem; height: 3rem; margin-right: 1rem; vertical-align: middle; } .skeleton-overview sl-skeleton:nth-child(3) { width: 95%; } .skeleton-overview sl-skeleton:nth-child(4) { width: 80%; } </style> import SlSkeleton from '@shoelace-style/shoelace/dist/react/skeleton'; const css = ` .skeleton-overview header { display: flex; align-items: center; margin-bottom: 1rem; } .skeleton-overview header sl-skeleton:last-child { flex: 0 0 auto; width: 30%; } .skeleton-overview sl-skeleton { margin-bottom: 1rem; } .skeleton-overview sl-skeleton:nth-child(1) { float: left; width: 3rem; height: 3rem; margin-right: 1rem; vertical-align: middle; } .skeleton-overview sl-skeleton:nth-child(3) { width: 95%; } .skeleton-overview sl-skeleton:nth-child(4) { width: 80%; } `; const App = () => ( <> <div className="skeleton-overview"> <header> <SlSkeleton /> <SlSkeleton /> </header> <SlSkeleton /> <SlSkeleton /> <SlSkeleton /> </div> <style>{css}</style> </> ); Source HTML React Examples Effects There are two built-in effects, sheen and pulse. Effects are intentionally subtle, as they can be distracting when used extensively. The default is none, which displays a static, non-animated skeleton. None Sheen Pulse .skeleton-effects { font-size: var(--sl-font-size-small); } .skeleton-effects sl-skeleton:not(:first-child) { margin-top: 1rem; } <div class="skeleton-effects"> <sl-skeleton effect="none"></sl-skeleton> None <sl-skeleton effect="sheen"></sl-skeleton> Sheen <sl-skeleton effect="pulse"></sl-skeleton> Pulse </div> <style> .skeleton-effects { font-size: var(--sl-font-size-small); } .skeleton-effects sl-skeleton:not(:first-child) { margin-top: 1rem; } </style> import SlSkeleton from '@shoelace-style/shoelace/dist/react/skeleton'; const css = ` .skeleton-effects { font-size: var(--sl-font-size-small); } .skeleton-effects sl-skeleton:not(:first-child) { margin-top: 1rem; } `; const App = () => ( <> <div className="skeleton-effects"> <SlSkeleton effect="none" /> None <SlSkeleton effect="sheen" /> Sheen <SlSkeleton effect="pulse" /> Pulse </div> <style>{css}</style> </> ); Source HTML React Paragraphs Use multiple skeletons and some clever styles to simulate paragraphs. .skeleton-paragraphs sl-skeleton { margin-bottom: 1rem; } .skeleton-paragraphs sl-skeleton:nth-child(2) { width: 95%; } .skeleton-paragraphs sl-skeleton:nth-child(4) { width: 90%; } .skeleton-paragraphs sl-skeleton:last-child { width: 50%; } <div class="skeleton-paragraphs"> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> </div> <style> .skeleton-paragraphs sl-skeleton { margin-bottom: 1rem; } .skeleton-paragraphs sl-skeleton:nth-child(2) { width: 95%; } .skeleton-paragraphs sl-skeleton:nth-child(4) { width: 90%; } .skeleton-paragraphs sl-skeleton:last-child { width: 50%; } </style> import SlSkeleton from '@shoelace-style/shoelace/dist/react/skeleton'; const css = ` .skeleton-paragraphs sl-skeleton { margin-bottom: 1rem; } .skeleton-paragraphs sl-skeleton:nth-child(2) { width: 95%; } .skeleton-paragraphs sl-skeleton:nth-child(4) { width: 90%; } .skeleton-paragraphs sl-skeleton:last-child { width: 50%; } `; const App = () => ( <> <div className="skeleton-paragraphs"> <SlSkeleton /> <SlSkeleton /> <SlSkeleton /> <SlSkeleton /> <SlSkeleton /> </div> <style>{css}</style> </> ); Source HTML React Avatars Set a matching width and height to make a circle, square, or rounded avatar skeleton. .skeleton-avatars sl-skeleton { display: inline-block; width: 3rem; height: 3rem; margin-right: 0.5rem; } .skeleton-avatars sl-skeleton:nth-child(1) { --border-radius: 0; } .skeleton-avatars sl-skeleton:nth-child(2) { --border-radius: var(--sl-border-radius-medium); } <div class="skeleton-avatars"> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> <sl-skeleton></sl-skeleton> </div> <style> .skeleton-avatars sl-skeleton { display: inline-block; width: 3rem; height: 3rem; margin-right: 0.5rem; } .skeleton-avatars sl-skeleton:nth-child(1) { --border-radius: 0; } .skeleton-avatars sl-skeleton:nth-child(2) { --border-radius: var(--sl-border-radius-medium); } </style> import SlSkeleton from '@shoelace-style/shoelace/dist/react/skeleton'; const css = ` .skeleton-avatars sl-skeleton { display: inline-block; width: 3rem; height: 3rem; margin-right: .5rem; } .skeleton-avatars sl-skeleton:nth-child(1) { --border-radius: 0; } .skeleton-avatars sl-skeleton:nth-child(2) { --border-radius: var(--sl-border-radius-medium); } `; const App = () => ( <> <div className="skeleton-avatars"> <SlSkeleton /> <SlSkeleton /> <SlSkeleton /> </div> <style>{css}</style> </> ); Source HTML React Custom Shapes Use the --border-radius custom property to make circles, squares, and rectangles. For more complex shapes, you can apply clip-path to the indicator part. Try Clippy if you need help generating custom shapes. .skeleton-shapes sl-skeleton { display: inline-flex; width: 50px; height: 50px; } .skeleton-shapes .square::part(indicator) { --border-radius: var(--sl-border-radius-medium); } .skeleton-shapes .circle::part(indicator) { --border-radius: var(--sl-border-radius-circle); } .skeleton-shapes .triangle::part(indicator) { --border-radius: 0; clip-path: polygon(50% 0, 0 100%, 100% 100%); } .skeleton-shapes .cross::part(indicator) { --border-radius: 0; clip-path: polygon( 20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30% ); } .skeleton-shapes .comment::part(indicator) { --border-radius: 0; clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 75% 75%, 75% 100%, 50% 75%, 0% 75%); } .skeleton-shapes sl-skeleton:not(:last-child) { margin-right: 0.5rem; } <div class="skeleton-shapes"> <sl-skeleton class="square"></sl-skeleton> <sl-skeleton class="circle"></sl-skeleton> <sl-skeleton class="triangle"></sl-skeleton> <sl-skeleton class="cross"></sl-skeleton> <sl-skeleton class="comment"></sl-skeleton> </div> <style> .skeleton-shapes sl-skeleton { display: inline-flex; width: 50px; height: 50px; } .skeleton-shapes .square::part(indicator) { --border-radius: var(--sl-border-radius-medium); } .skeleton-shapes .circle::part(indicator) { --border-radius: var(--sl-border-radius-circle); } .skeleton-shapes .triangle::part(indicator) { --border-radius: 0; clip-path: polygon(50% 0, 0 100%, 100% 100%); } .skeleton-shapes .cross::part(indicator) { --border-radius: 0; clip-path: polygon( 20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30% ); } .skeleton-shapes .comment::part(indicator) { --border-radius: 0; clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 75% 75%, 75% 100%, 50% 75%, 0% 75%); } .skeleton-shapes sl-skeleton:not(:last-child) { margin-right: 0.5rem; } </style> import SlSkeleton from '@shoelace-style/shoelace/dist/react/skeleton'; const css = ` .skeleton-shapes sl-skeleton { display: inline-flex; width: 50px; height: 50px; } .skeleton-shapes .square::part(indicator) { --border-radius: var(--sl-border-radius-medium); } .skeleton-shapes .circle::part(indicator) { --border-radius: var(--sl-border-radius-circle); } .skeleton-shapes .triangle::part(indicator) { --border-radius: 0; clip-path: polygon(50% 0, 0 100%, 100% 100%); } .skeleton-shapes .cross::part(indicator) { --border-radius: 0; clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%); } .skeleton-shapes .comment::part(indicator) { --border-radius: 0; clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 75% 75%, 75% 100%, 50% 75%, 0% 75%); } .skeleton-shapes sl-skeleton:not(:last-child) { margin-right: .5rem; } `; const App = () => ( <> <div className="skeleton-shapes"> <SlSkeleton className="square" /> <SlSkeleton className="circle" /> <SlSkeleton className="triangle" /> <SlSkeleton className="cross" /> <SlSkeleton className="comment" /> </div> <style>{css}</style> </> ); Source HTML React Custom Colors Set the --color and --sheen-color custom properties to adjust the skeleton’s color. <sl-skeleton effect="sheen" style="--color: tomato; --sheen-color: #ffb094;"></sl-skeleton> import SlSkeleton from '@shoelace-style/shoelace/dist/react/skeleton'; const css = ` .skeleton-avatars sl-skeleton { dis