ement="top"> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlDropdown> ); Source HTML React Prefix & Suffix Use the prefix and suffix slots to add presentational icons and text. Avoid slotting in interactive elements, such as buttons, links, etc. New Option 1 Option 2 Option 3 New Option 1 Option 2 Option 3 New Option 1 Option 2 Option 3 <sl-select placeholder="Small" size="small" clearable> <sl-icon name="house" slot="prefix"></sl-icon> <sl-badge slot="suffix">New</sl-badge> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> <br /> <sl-select placeholder="Medium" size="medium" clearable> <sl-icon name="house" slot="prefix"></sl-icon> <sl-badge slot="suffix">New</sl-badge> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> <br /> <sl-select placeholder="Large" size="large" clearable> <sl-icon name="house" slot="prefix"></sl-icon> <sl-badge slot="suffix">New</sl-badge> <sl-option value="option-1">Option 1</sl-option> <sl-option value="option-2">Option 2</sl-option> <sl-option value="option-3">Option 3</sl-option> </sl-select> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; import SlOption from '@shoelace-style/shoelace/dist/react/option'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; const App = () => ( <> <SlSelect placeholder="Small" size="small"> <SlIcon name="house" slot="prefix"></SlIcon> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</SlOption> <SlOption value="option-3">Option 3</SlOption> </SlSelect> <br /> <SlSelect placeholder="Medium" size="medium"> <SlIcon name="house" slot="prefix"></SlIcon> <SlOption value="option-1">Option 1</SlOption> <SlOption value="option-2">Option 2</