title = "Popup"
description = 'Popup is a utility that lets you declaratively anchor "popup" containers to another element.'
full_description = '''Popup Examples Activating External Anchors Placement Distance Skidding Arrows Syncing with the Anchor’s Dimensions Positioning Strategy Flip Flip Fallbacks Shift Auto-size Hover Bridge Virtual Elements Importing Slots Properties Events Methods Custom Properties Parts Popup <sl-popup> | SlPopup Since 2.0 stable Popup is a utility that lets you declaratively anchor “popup” containers to another element. This component’s name is inspired by <popup>. It uses Floating UI under the hood to provide a well-tested, lightweight, and fully declarative positioning utility for tooltips, dropdowns, and more. Popup doesn’t provide any styles — just positioning! The popup’s preferred placement, distance, and skidding (offset) can be configured using attributes. An arrow that points to the anchor can be shown and customized to your liking. Additional positioning options are available and described in more detail below. Popup is a low-level utility built specifically for positioning elements. Do not mistake it for a tooltip or similar because it does not facilitate an accessible experience! Almost every correct usage of <sl-popup> will involve building other components. It should rarely, if ever, occur directly in your HTML. top top-start top-end bottom bottom-start bottom-end right right-start right-end left left-start left-end Active Arrow (() => { const container = document.querySelector('.popup-overview'); const popup = container.querySelector('sl-popup'); const select = container.querySelector('sl-select[name="placement"]'); const distance = container.querySelector('sl-input[name="distance"]'); const skidding = container.querySelector('sl-input[name="skidding"]'); const active = container.querySelector('sl-switch[name="active"]'); const arrow = container.querySelector('sl-switch[name="arrow"]'); select.addEventListener('sl-change', () => (popup.placement = select.value)); distance.addEventListener('sl-input', () => (popup.distance = distance.value)); skidding.addEventListener('sl-input', () => (popup.skidding = skidding.value)); active.addEventListener('sl-change', () => (popup.active = active.checked)); arrow.addEventListener('sl-change', () => (popup.arrow = arrow.checked)); })(); .popup-overview sl-popup { --arrow-color: var(--sl-color-primary-600); } .popup-overview span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-overview .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } .popup-overview-options { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; } .popup-overview-options sl-select { width: 160px; } .popup-overview-options sl-input { width: 100px; } .popup-overview-options + .popup-overview-options { margin-top: 1rem; } <div class="popup-overview"> <sl-popup placement="top" active> <span slot="anchor"></span> <div class="box"></div> </sl-popup> <div class="popup-overview-options"> <sl-select label="Placement" name="placement" value="top" class="popup-overview-select"> <sl-option value="top">top</sl-option> <sl-option value="top-start">top-start</sl-option> <sl-option value="top-end">top-end</sl-option> <sl-option value="bottom">bottom</sl-option> <sl-option value="bottom-start">bottom-start</sl-option> <sl-option value="bottom-end">bottom-end</sl-option> <sl-option value="right">right</sl-option> <sl-option value="right-start">right-start</sl-option> <sl-option value="right-end">right-end</sl-option> <sl-option value="left">left</sl-option> <sl-option value="left-start">left-start</sl-option> <sl-option value="left-end">left-end</sl-option> </sl-select> <sl-input type="number" name="distance" label="distance" value="0"></sl-input> <sl-input type="number" name="skidding" label="Skidding" value="0"></sl-input> </div> <div class="popup-overview-options"> <sl-switch name="active" checked>Active</sl-switch> <sl-switch name="arrow">Arrow</sl-switch> </div> </div> <script> const container = document.querySelector('.popup-overview'); const popup = container.querySelector('sl-popup'); const select = container.querySelector('sl-select[name="placement"]'); const distance = container.querySelector('sl-input[name="distance"]'); const skidding = container.querySelector('sl-input[name="skidding"]'); const active = container.querySelector('sl-switch[name="active"]'); const arrow = container.querySelector('sl-switch[name="arrow"]'); select.addEventListener('sl-change', () => (popup.placement = select.value)); distance.addEventListener('sl-input', () => (popup.distance = distance.value)); skidding.addEventListener('sl-input', () => (popup.skidding = skidding.value)); active.addEventListener('sl-change', () => (popup.active = active.checked)); arrow.addEventListener('sl-change', () => (popup.arrow = arrow.checked)); </script> <style> .popup-overview sl-popup { --arrow-color: var(--sl-color-primary-600); } .popup-overview span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-overview .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } .popup-overview-options { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; } .popup-overview-options sl-select { width: 160px; } .popup-overview-options sl-input { width: 100px; } .popup-overview-options + .popup-overview-options { margin-top: 1rem; } </style> import { useState } from 'react'; import SlPopup from '@shoelace-style/shoelace/dist/react/popup'; import SlSelect from '@shoelace-style/shoelace/dist/react/select'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; import SlInput from '@shoelace-style/shoelace/dist/react/input'; import SlSwitch from '@shoelace-style/shoelace/dist/react/switch'; const css = ` .popup-overview sl-popup { --arrow-color: var(--sl-color-primary-600); } .popup-overview span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-overview .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } .popup-overview-options { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; } .popup-overview-options sl-select { width: 160px; } .popup-overview-options sl-input { width: 100px; } .popup-overview-options + .popup-overview-options { margin-top: 1rem; } `; const App = () => { const [placement, setPlacement] = useState('top'); const [distance, setDistance] = useState(0); const [skidding, setSkidding] = useState(0); const [active, setActive] = useState(true); const [arrow, setArrow] = useState(false); return ( <> <div className="popup-overview"> <SlPopup placement={placement} active={active || null} distance={distance} skidding={skidding} arrow={arrow || null} > <span slot="anchor" /> <div className="box" /> </SlPopup> <div className="popup-overview-options"> <SlSelect label="Placement" name="placement" value={placement} className="popup-overview-select" onSlChange={event => setPlacement(event.target.value)} > <SlMenuItem value="top">top</SlMenuItem> <SlMenuItem value="top-start">top-start</SlMenuItem> <SlMenuItem value="top-end">top-end</SlMenuItem> <SlMenuItem value="bottom">bottom</SlMenuItem> <SlMenuItem value="bottom-start">bottom-start</SlMenuItem> <SlMenuItem value="bottom-end">bottom-end</SlMenuItem> <SlMenuItem value="right">right</SlMenuItem> <SlMenuItem value="right-start">right-start</SlMenuItem> <SlMenuItem value="right-end">right-end</SlMenuItem> <SlMenuItem value="left">left</SlMenuItem> <SlMenuItem value="left-start">left-start</SlMenuItem> <SlMenuItem value="left-end">left-end</SlMenuItem> </SlSelect> <SlInput type="number" name="distance" label="distance" value={distance} onSlInput={event => setDistance(event.target.value)} /> <SlInput type="number" name="skidding" label="Skidding" value={skidding} onSlInput={event => setSkidding(event.target.value)} /> </div> <div className="popup-overview-options"> <SlSwitch checked={active} onSlChange={event => setActive(event.target.checked)}> Active </SlSwitch> <SlSwitch checked={arrow} onSlChange={event => setArrow(event.target.checked)}> Arrow </SlSwitch> </div> </div> <style>{css}</style> </> ); }; Source HTML React A popup’s anchor should not be styled with display: contents since the coordinates will not be eligible for calculation. However, if the anchor is a <slot> element, popup will use the first assigned element as the anchor. This behavior allows other components to pass anchors through more easily via composition. Examples Activating Popups are inactive and hidden until the active attribute is applied. Removing the attribute will tear down all positioning logic and listeners, meaning you can have many idle popups on the page without affecting performance. Active .popup-active span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-active .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } (() => { const container = document.querySelector('.popup-active'); const popup = container.querySelector('sl-popup'); const active = container.querySelector('sl-switch'); active.addEventListener('sl-change', () => (popup.active = active.checked)); })(); <div class="popup-active"> <sl-popup placement="top" active> <span slot="anchor"></span> <div class="box"></div> </sl-popup> <br /> <sl-switch checked>Active</sl-switch> </div> <style> .popup-active span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-active .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } </style> <script> const container = document.querySelector('.popup-active'); const popup = container.querySelector('sl-popup'); const active = container.querySelector('sl-switch'); active.addEventListener('sl-change', () => (popup.active = active.checked)); </script> import { useState } from 'react'; import SlPopup from '@shoelace-style/shoelace/dist/react/popup'; import SlSwitch from '@shoelace-style/shoelace/dist/react/switch'; const css = ` .popup-active span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-active .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } `; const App = () => { const [active, setActive] = useState(true); return ( <> <div className="popup-active"> <SlPopup placement="top" active={active}> <span slot="anchor" /> <div className="box" /> </SlPopup> <br /> <SlSwitch checked={active} onSlChange={event => setActive(event.target.checked)}> Active </SlSwitch> </div> <style>{css}</style> </> ); }; Source HTML React External Anchors By default, anchors are slotted into the popup using the anchor slot. If your anchor needs to live outside of the popup, you can pass the anchor’s id to the anchor attribute. Alternatively, you can pass an element reference to the anchor property to achieve the same effect without using an id. #external-anchor { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px 0 0 50px; } #external-anchor ~ sl-popup .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } <span id="external-anchor"></span> <sl-popup anchor="external-anchor" placement="top" active> <div class="box"></div> </sl-popup> <style> #external-anchor { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px 0 0 50px; } #external-anchor ~ sl-popup .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } </style> import SlPopup from '@shoelace-style/shoelace/dist/react/popup'; const css = ` #external-anchor { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px 0 0 50px; } #external-anchor ~ sl-popup .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } `; const App = () => { return ( <> <span id="external-anchor" /> <SlPopup anchor="external-anchor" placement="top" active> <div class="box" /> </SlPopup> <style>{css}</style> </> ); }; Source HTML React Placement Use the placement attribute to tell the popup the preferred placement of the popup. Note that the actual position will vary to ensure the panel remains in the viewport if you’re using positioning features such as flip and shift. Since placement is preferred when using flip, you can observe the popup’s current placement when it’s active by looking at the data-current-placement attribute. This attribute will update as the popup flips to find available space and it will be removed when the popup is deactivated. top top-start top-end bottom bottom-start bottom-end right right-start right-end left left-start left-end .popup-placement span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-placement .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius: var(--sl-border-radius-medium); } .popup-placement sl-select { max-width: 280px; } (() => { const container = document.querySelector('.popup-placement'); const popup = container.querySelector('sl-popup'); const select = container.querySelector('sl-select'); select.addEventListener('sl-change', () => (popup.placement = select.value)); })(); <div class="popup-placement"> <sl-popup placement="top" active> <span slot="anchor"></span> <div class="box"></div> </sl-popup> <sl-select label="Placement" value="top"> <sl-option value="top">top</sl-option> <sl-option value="top-start">top-start</sl-option> <sl-option value="top-end">top-end</sl-option> <sl-option value="bottom">bottom</sl-option> <sl-option value="bottom-start">bottom-start</sl-option> <sl-option value="bottom-end">bottom-end</sl-option> <sl-option value="right">right</sl-option> <sl-option value="right-start">right-start</sl-option> <sl-option value="right-end">right-end</sl-option> <sl-option value="left">left</sl-option> <sl-option value="left-start">left-start</sl-option> <sl-option value="left-end">left-end</sl-option> </sl-select> </div> <style> .popup-placement span[slot='anchor'] { display: inline-block; width: 150px; height: 150px; border: dashed 2px var(--sl-color-neutral-600); margin: 50px; } .popup-placement .box { width: 100px; height: 50px; background: var(--sl-color-primary-600); border-radius'''
