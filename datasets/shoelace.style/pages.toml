tton> <SlRadioButton value="2">Option 2</SlRadioButton> <SlRadioButton value="3">Option 3</SlRadioButton> </SlRadioGroup> <br /> <SlRadioGroup size="medium" label="Select an option" name="a" value="1"> <SlRadioButton value="1">Option 1</SlRadioButton> <SlRadioButton value="2">Option 2</SlRadioButton> <SlRadioButton value="3">Option 3</SlRadioButton> </SlRadioGroup> <br /> <SlRadioGroup size="large" label="Select an option" name="a" value="1"> <SlRadioButton value="1">Option 1</SlRadioButton> <SlRadioButton value="2">Option 2</SlRadioButton> <SlRadioButton value="3">Option 3</SlRadioButton> </SlRadioGroup> ); Source HTML React Pill Buttons Use the pill attribute to give radio buttons rounded edges. Option 1 Option 2 Option 3 Option 1 Option 2 Option 3 Option 1 Option 2 Option 3 <sl-radio-group size="small" label="Select an option" name="a" value="1"> <sl-radio-button pill value="1">Option 1</sl-radio-button> <sl-radio-button pill value="2">Option 2</sl-radio-button> <sl-radio-button pill value="3">Option 3</sl-radio-button> </sl-radio-group> <br /> <sl-radio-group size="medium" label="Select an option" name="a" value="1"> <sl-radio-button pill value="1">Option 1</sl-radio-button> <sl-radio-button pill value="2">Option 2</sl-radio-button> <sl-radio-button pill value="3">Option 3</sl-radio-button> </sl-radio-group> <br /> <sl-radio-group size="large" label="Select an option" name="a" value="1"> <sl-radio-button pill value="1">Option 1</sl-radio-button> <sl-radio-button pill value="2">Option 2</sl-radio-button> <sl-radio-button pill value="3">Option 3</sl-radio-button> </sl-radio-group> import SlRadioButton from '@shoelace-style/shoelace/dist/react/radio-button'; import SlRadioGroup from '@shoelace-style/shoelace/dist/react/radio-group'; const App = () => ( <SlRadioGroup size="small" label="Select an option" name="a" value="1"> <SlRadioButton pill value="1">Option 1</SlRadioButton> <SlRadioButton pill value="2">Option 2</SlRadioButton> <SlRadioButton pill value="3">Option 3</SlRadioButton> </SlRadioGroup> <br /> <SlRadioGroup size="medium" label="Select an option" name="a" value="1"> <SlRadioButton pill value="1">Option 1</SlRadioButton> <SlRadioButton pill value="2">Option 2</SlRadioButton> <SlRadioButton pill value="3">Option 3</SlRadioButton> </SlRadioGroup> <br /> <SlRadioGroup size="large" label="Select an option" name="a" value="1"> <SlRadioButton pill value="1">Option 1</SlRadioButton> <SlRadioButton pill value="2">Option 2</SlRadioButton> <SlRadioButton pill value="3">Option 3</SlRadioButton> </SlRadioGroup> ); Source HTML React Prefix and Suffix Icons Use the prefix and suffix slots to add icons. Option 1 Option 2 Option 3 <sl-radio-group label="Select an option" name="a" value="1"> <sl-radio-button value="1"> <sl-icon slot="prefix" name="archive"></sl-icon> Option 1 </sl-radio-button> <sl-radio-button value="2"> <sl-icon slot="suffix" name="bag"></sl-icon> Option 2 </sl-radio-button> <sl-radio-button value="3"> <sl-icon slot="prefix" name="gift"></sl-icon> <sl-icon slot="suffix" name="cart"></sl-icon> Option 3 </sl-radio-button> </sl-radio-group> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; import SlRadioButton from '@shoelace-style/shoelace/dist/react/radio-button'; import SlRadioGroup from '@shoelace-style/shoelace/dist/react/radio-group'; const App = () => ( <SlRadioGroup label="Select an option" name="a" value="1"> <SlRadioButton value="1"> <SlIcon slot="prefix" name="archive" /> Option 1 </SlRadioButton> <SlRadioButton value="2"> <SlIcon slot="suffix" name="bag" /> Option 2 </SlRadioButton> <SlRadioButton value="3"> <SlIcon slot="prefix" name="gift" /> <SlIcon slot="suffix" name="cart" /> Option 3 </SlRadioButton> </SlRadioGroup> ); Source HTML React Buttons with Icons You can omit button labels and use icons instead. Make sure to set a label attribute on each icon so screen readers will announce each option correctly. <sl-radio-group label="Select an option" name="a" value="neutral"> <sl-radio-button value="angry"> <sl-icon name="emoji-angry" label="Angry"></sl-icon> </sl-radio-button> <sl-radio-button value="sad"> <sl-icon name="emoji-frown" label="Sad"></sl-icon> </sl-radio-button> <sl-radio-button value="neutral"> <sl-icon name="emoji-neutral" label="Neutral"></sl-icon> </sl-radio-button> <sl-radio-button value="happy"> <sl-icon name="emoji-smile" label="Happy"></sl-icon> </sl-radio-button> <sl-radio-button value="laughing"> <sl-icon name="emoji-laughing" label="Laughing"></sl-icon> </sl-radio-button> </sl-radio-group> import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; import SlRadioButton from '@shoelace-style/shoelace/dist/react/radio-button'; import SlRadioGroup from '@shoelace-style/shoelace/dist/react/radio-group'; const App = () => ( <SlRadioGroup label="Select an option" name="a" value="neutral"> <SlRadioButton value="angry"> <SlIcon name="emoji-angry" label="Angry" /> </SlRadioButton> <SlRadioButton value="sad"> <SlIcon name="emoji-frown" label="Sad" /> </SlRadioButton> <SlRadioButton value="neutral"> <SlIcon name="emoji-neutral" label="Neutral" /> </SlRadioButton> <SlRadioButton value="happy"> <SlIcon name="emoji-smile" label="Happy" /> </SlRadioButton> <SlRadioButton value="laughing"> <SlIcon name="emoji-laughing" label="Laughing" /> </SlRadioButton> </SlRadioGroup> ); Source HTML React Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/radio-button/radio-button.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/radio-button/radio-button.js'; To import this component using a bundler: import '@shoelace-style/shoelace/dist/components/radio-button/radio-button.js'; To import this component as a React component: import SlRadioButton from '@shoelace-style/shoelace/dist/react/radio-button'; Slots Name Description (default) The radio button’s label. prefix A presentational prefix icon or similar element. suffix A presentational suffix icon or similar element. Learn more about using slots. Properties Name Description Reflects Type Default value The radio’s value. When selected, the radio group will receive this value. string - disabled Disables the radio button. boolean false size The radio button’s size. When used inside a radio group, the size will be determined by the radio group’s size so this attribute can typically be omitted. 'small' | 'medium' | 'large' 'medium' pill Draws a pill-style radio button with rounded edges. boolean false updateComplete A read-only promise that resolves when the component has finished updating. Learn more about attributes and properties. Events Name React Event Description Event Detail sl-blur onSlBlur Emitted when the button loses focus. - sl-focus onSlFocus Emitted when the button gains focus. - Learn more about events. Methods Name Description Arguments focus() Sets focus on the radio button. options: FocusOptions blur() Removes focus from the radio button. - Learn more about methods. Parts Name Description base The component’s base wrapper. button The internal <button> element. button--checked The internal button element when the radio button is checked. prefix The container that wraps the prefix. label The container that wraps the radio button’s label. suffix The container that wraps the suffix. Learn more about customizing CSS parts.'''
