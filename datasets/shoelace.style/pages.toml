title = "Dropdown"
description = 'Dropdowns expose additional content that "drops down" in a panel.'
full_description = '''Dropdown Examples Getting the Selected Item Placement Distance Skidding Submenus Hoisting Importing Slots Properties Events Methods Parts Animations Dependencies Dropdown <sl-dropdown> | SlDropdown Since 2.0 stable Dropdowns expose additional content that “drops down” in a panel. Dropdowns consist of a trigger and a panel. By default, activating the trigger will expose the panel and interacting outside of the panel will close it. Dropdowns are designed to work well with menus to provide a list of options the user can select from. However, dropdowns can also be used in lower-level applications (e.g. color picker). The API gives you complete control over showing, hiding, and positioning the panel. Dropdown Dropdown Item 1 Dropdown Item 2 Dropdown Item 3 Checkbox Disabled Prefix Suffix Icon <sl-dropdown> <sl-button slot="trigger" caret>Dropdown</sl-button> <sl-menu> <sl-menu-item>Dropdown Item 1</sl-menu-item> <sl-menu-item>Dropdown Item 2</sl-menu-item> <sl-menu-item>Dropdown Item 3</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item type="checkbox" checked>Checkbox</sl-menu-item> <sl-menu-item disabled>Disabled</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item> Prefix <sl-icon slot="prefix" name="gift"></sl-icon> </sl-menu-item> <sl-menu-item> Suffix Icon <sl-icon slot="suffix" name="heart"></sl-icon> </sl-menu-item> </sl-menu> </sl-dropdown> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => ( <SlDropdown> <SlButton slot="trigger" caret> Dropdown </SlButton> <SlMenu> <SlMenuItem>Dropdown Item 1</SlMenuItem> <SlMenuItem>Dropdown Item 2</SlMenuItem> <SlMenuItem>Dropdown Item 3</SlMenuItem> <SlDivider /> <SlMenuItem type="checkbox" checked> Checkbox </SlMenuItem> <SlMenuItem disabled>Disabled</SlMenuItem> <SlDivider /> <SlMenuItem> Prefix <SlIcon slot="prefix" name="gift" /> </SlMenuItem> <SlMenuItem> Suffix Icon <SlIcon slot="suffix" name="heart" /> </SlMenuItem> </SlMenu> </SlDropdown> ); Source HTML React Examples Getting the Selected Item When dropdowns are used with menus, you can listen for the sl-select event to determine which menu item was selected. The menu item element will be exposed in event.detail.item. You can set value props to make it easier to identify commands. Edit Cut Copy Paste (() => { const container = document.querySelector('.dropdown-selection'); const dropdown = container.querySelector('sl-dropdown'); dropdown.addEventListener('sl-select', event => { const selectedItem = event.detail.item; console.log(selectedItem.value); }); })(); <div class="dropdown-selection"> <sl-dropdown> <sl-button slot="trigger" caret>Edit</sl-button> <sl-menu> <sl-menu-item value="cut">Cut</sl-menu-item> <sl-menu-item value="copy">Copy</sl-menu-item> <sl-menu-item value="paste">Paste</sl-menu-item> </sl-menu> </sl-dropdown> </div> <script> const container = document.querySelector('.dropdown-selection'); const dropdown = container.querySelector('sl-dropdown'); dropdown.addEventListener('sl-select', event => { const selectedItem = event.detail.item; console.log(selectedItem.value); }); </script> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => { function handleSelect(event) { const selectedItem = event.detail.item; console.log(selectedItem.value); } return ( <SlDropdown> <SlButton slot="trigger" caret> Edit </SlButton> <SlMenu onSlSelect={handleSelect}> <SlMenuItem value="cut">Cut</SlMenuItem> <SlMenuItem value="copy">Copy</SlMenuItem> <SlMenuItem value="paste">Paste</SlMenuItem> </SlMenu> </SlDropdown> ); }; Source HTML React Alternatively, you can listen for the click event on individual menu items. Note that, using this approach, disabled menu items will still emit a click event. Edit Cut Copy Paste (() => { const container = document.querySelector('.dropdown-selection-alt'); const cut = container.querySelector('sl-menu-item[value="cut"]'); const copy = container.querySelector('sl-menu-item[value="copy"]'); const paste = container.querySelector('sl-menu-item[value="paste"]'); cut.addEventListener('click', () => console.log('cut')); copy.addEventListener('click', () => console.log('copy')); paste.addEventListener('click', () => console.log('paste')); })(); <div class="dropdown-selection-alt"> <sl-dropdown> <sl-button slot="trigger" caret>Edit</sl-button> <sl-menu> <sl-menu-item value="cut">Cut</sl-menu-item> <sl-menu-item value="copy">Copy</sl-menu-item> <sl-menu-item value="paste">Paste</sl-menu-item> </sl-menu> </sl-dropdown> </div> <script> const container = document.querySelector('.dropdown-selection-alt'); const cut = container.querySelector('sl-menu-item[value="cut"]'); const copy = container.querySelector('sl-menu-item[value="copy"]'); const paste = container.querySelector('sl-menu-item[value="paste"]'); cut.addEventListener('click', () => console.log('cut')); copy.addEventListener('click', () => console.log('copy')); paste.addEventListener('click', () => console.log('paste')); </script> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => { function handleCut() { console.log('cut'); } function handleCopy() { console.log('copy'); } function handlePaste() { console.log('paste'); } return ( <SlDropdown> <SlButton slot="trigger" caret> Edit </SlButton> <SlMenu> <SlMenuItem onClick={handleCut}>Cut</SlMenuItem> <SlMenuItem onClick={handleCopy}>Copy</SlMenuItem> <SlMenuItem onClick={handlePaste}>Paste</SlMenuItem> </SlMenu> </SlDropdown> ); }; Source HTML React Placement The preferred placement of the dropdown can be set with the placement attribute. Note that the actual position may vary to ensure the panel remains in the viewport. Edit Cut Copy Paste Find Replace <sl-dropdown placement="top-start"> <sl-button slot="trigger" caret>Edit</sl-button> <sl-menu> <sl-menu-item>Cut</sl-menu-item> <sl-menu-item>Copy</sl-menu-item> <sl-menu-item>Paste</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item>Find</sl-menu-item> <sl-menu-item>Replace</sl-menu-item> </sl-menu> </sl-dropdown> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => ( <SlDropdown placement="top-start"> <SlButton slot="trigger" caret> Edit </SlButton> <SlMenu> <SlMenuItem>Cut</SlMenuItem> <SlMenuItem>Copy</SlMenuItem> <SlMenuItem>Paste</SlMenuItem> <SlDivider /> <SlMenuItem>Find</SlMenuItem> <SlMenuItem>Replace</SlMenuItem> </SlMenu> </SlDropdown> ); Source HTML React Distance The distance from the panel to the trigger can be customized using the distance attribute. This value is specified in pixels. Edit Cut Copy Paste Find Replace <sl-dropdown distance="30"> <sl-button slot="trigger" caret>Edit</sl-button> <sl-menu> <sl-menu-item>Cut</sl-menu-item> <sl-menu-item>Copy</sl-menu-item> <sl-menu-item>Paste</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item>Find</sl-menu-item> <sl-menu-item>Replace</sl-menu-item> </sl-menu> </sl-dropdown> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => ( <SlDropdown distance={30}> <SlButton slot="trigger" caret> Edit </SlButton> <SlMenu> <SlMenuItem>Cut</SlMenuItem> <SlMenuItem>Copy</SlMenuItem> <SlMenuItem>Paste</SlMenuItem> <SlDivider /> <SlMenuItem>Find</SlMenuItem> <SlMenuItem>Replace</SlMenuItem> </SlMenu> </SlDropdown> ); Source HTML React Skidding The offset of the panel along the trigger can be customized using the skidding attribute. This value is specified in pixels. Edit Cut Copy Paste Find Replace <sl-dropdown skidding="30"> <sl-button slot="trigger" caret>Edit</sl-button> <sl-menu> <sl-menu-item>Cut</sl-menu-item> <sl-menu-item>Copy</sl-menu-item> <sl-menu-item>Paste</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item>Find</sl-menu-item> <sl-menu-item>Replace</sl-menu-item> </sl-menu> </sl-dropdown> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const App = () => ( <SlDropdown skidding={30}> <SlButton slot="trigger" caret> Edit </SlButton> <SlMenu> <SlMenuItem>Cut</SlMenuItem> <SlMenuItem>Copy</SlMenuItem> <SlMenuItem>Paste</SlMenuItem> <SlDivider /> <SlMenuItem>Find</SlMenuItem> <SlMenuItem>Replace</SlMenuItem> </SlMenu> </SlDropdown> ); Source HTML React Submenus To create a submenu, nest an <sl-menu slot="submenu"> element in a menu item. Edit Undo Redo Cut Copy Paste Find Find… Find Next Find Previous Transformations Make uppercase Make lowercase Capitalize <sl-dropdown> <sl-button slot="trigger" caret>Edit</sl-button> <sl-menu style="max-width: 200px;"> <sl-menu-item value="undo">Undo</sl-menu-item> <sl-menu-item value="redo">Redo</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item value="cut">Cut</sl-menu-item> <sl-menu-item value="copy">Copy</sl-menu-item> <sl-menu-item value="paste">Paste</sl-menu-item> <sl-divider></sl-divider> <sl-menu-item> Find <sl-menu slot="submenu"> <sl-menu-item value="find">Find…</sl-menu-item> <sl-menu-item value="find-previous">Find Next</sl-menu-item> <sl-menu-item value="find-next">Find Previous</sl-menu-item> </sl-menu> </sl-menu-item> <sl-menu-item> Transformations <sl-menu slot="submenu"> <sl-menu-item value="uppercase">Make uppercase</sl-menu-item> <sl-menu-item value="lowercase">Make lowercase</sl-menu-item> <sl-menu-item value="capitalize">Capitalize</sl-menu-item> </sl-menu> </sl-menu-item> </sl-menu> </sl-dropdown> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const css = ` .dropdown-hoist { border: solid 2px var(--sl-panel-border-color); padding: var(--sl-spacing-medium); overflow: hidden; } `; const App = () => ( <> <SlDropdown> <SlButton slot="trigger" caret>Edit</SlButton> <SlMenu style="max-width: 200px;"> <SlMenuItem value="undo">Undo</SlMenuItem> <SlMenuItem value="redo">Redo</SlMenuItem> <SlDivider /> <SlMenuItem value="cut">Cut</SlMenuItem> <SlMenuItem value="copy">Copy</SlMenuItem> <SlMenuItem value="paste">Paste</SlMenuItem> <SlDivider /> <SlMenuItem> Find <SlMenu slot="submenu"> <SlMenuItem value="find">Find…</SlMenuItem> <SlMenuItem value="find-previous">Find Next</SlMenuItem> <SlMenuItem value="find-next">Find Previous</SlMenuItem> </SlMenu> </SlMenuItem> <SlMenuItem> Transformations <SlMenu slot="submenu"> <SlMenuItem value="uppercase">Make uppercase</SlMenuItem> <SlMenuItem value="lowercase">Make lowercase</SlMenuItem> <SlMenuItem value="capitalize">Capitalize</SlMenuItem> </SlMenu> </SlMenuItem> </SlMenu> </SlDropdown> </> ); Source HTML React As a UX best practice, avoid using more than one level of submenu when possible. Hoisting Dropdown panels will be clipped if they’re inside a container that has overflow: auto|hidden. The hoist attribute forces the panel to use a fixed positioning strategy, allowing it to break out of the container. In this case, the panel will be positioned relative to its containing block, which is usually the viewport unless an ancestor uses a transform, perspective, or filter. Refer to this page for more details. No Hoist Item 1 Item 2 Item 3 Hoist Item 1 Item 2 Item 3 .dropdown-hoist { position: relative; border: solid 2px var(--sl-panel-border-color); padding: var(--sl-spacing-medium); overflow: hidden; } <div class="dropdown-hoist"> <sl-dropdown> <sl-button slot="trigger" caret>No Hoist</sl-button> <sl-menu> <sl-menu-item>Item 1</sl-menu-item> <sl-menu-item>Item 2</sl-menu-item> <sl-menu-item>Item 3</sl-menu-item> </sl-menu> </sl-dropdown> <sl-dropdown hoist> <sl-button slot="trigger" caret>Hoist</sl-button> <sl-menu> <sl-menu-item>Item 1</sl-menu-item> <sl-menu-item>Item 2</sl-menu-item> <sl-menu-item>Item 3</sl-menu-item> </sl-menu> </sl-dropdown> </div> <style> .dropdown-hoist { position: relative; border: solid 2px var(--sl-panel-border-color); padding: var(--sl-spacing-medium); overflow: hidden; } </style> import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlDivider from '@shoelace-style/shoelace/dist/react/divider'; import SlDropdown from '@shoelace-style/shoelace/dist/react/dropdown'; import SlMenu from '@shoelace-style/shoelace/dist/react/menu'; import SlMenuItem from '@shoelace-style/shoelace/dist/react/menu-item'; const css = ` .dropdown-hoist { border: solid 2px var(--sl-panel-border-color); padding: var(--sl-spacing-medium); overflow: hidden; } `; const App = () => ( <> <div className="dropdown-hoist"> <SlDropdown> <SlButton slot="trigger" caret> No Hoist </SlButton> <SlMenu> <SlMenuItem>Item 1</SlMenuItem> <SlMenuItem>Item 2</SlMenuItem> <SlMenuItem>Item 3</SlMenuItem> </SlMenu> </SlDropdown> <SlDropdown hoist> <SlButton slot="trigger" caret> Hoist </SlButton> <SlMenu> <SlMenuItem>Item 1</SlMenuItem> <SlMenuItem>Item 2</SlMenuItem> <SlMenuItem>Item 3</SlMenuItem> </SlMenu> </SlDropdown> </div> <style>{css}</style> </> ); Source HTML React Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/dropdown/dropdown.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@'''
