 = () => <SlProgressRing value="50" label="Upload progress" />; Source HTML React Showing Values Use the default slot to show a label inside the progress ring. 50% (() => { const progressRing = document.querySelector('.progress-ring-values'); const subtractButton = progressRing.nextElementSibling.nextElementSibling; const addButton = subtractButton.nextElementSibling; addButton.addEventListener('click', () => { const value = Math.min(100, progressRing.value + 10); progressRing.value = value; progressRing.textContent = `${value}%`; }); subtractButton.addEventListener('click', () => { const value = Math.max(0, progressRing.value - 10); progressRing.value = value; progressRing.textContent = `${value}%`; }); })(); <sl-progress-ring value="50" class="progress-ring-values" style="margin-bottom: .5rem;">50%</sl-progress-ring> <br /> <sl-button circle><sl-icon name="dash" label="Decrease"></sl-icon></sl-button> <sl-button circle><sl-icon name="plus" label="Increase"></sl-icon></sl-button> <script> const progressRing = document.querySelector('.progress-ring-values'); const subtractButton = progressRing.nextElementSibling.nextElementSibling; const addButton = subtractButton.nextElementSibling; addButton.addEventListener('click', () => { const value = Math.min(100, progressRing.value + 10); progressRing.value = value; progressRing.textContent = `${value}%`; }); subtractButton.addEventListener('click', () => { const value = Math.max(0, progressRing.value - 10); progressRing.value = value; progressRing.textContent = `${value}%`; }); </script> import { useState } from 'react'; import SlButton from '@shoelace-style/shoelace/dist/react/button'; import SlIcon from '@shoelace-style/shoelace/dist/react/icon'; import SlProgressRing from '@shoelace-style/shoelace/dist/react/progress-ring'; const App = () => { const [value, setValue] = useState(50); function adjustValue(amount) { let newValue = value + amount; if (newValue < 0) newValue = 0; if (newValue > 100) newValue = 100; setValue(newValue); } return ( <> <SlProgressRing value={value} style={{ marginBottom: '.5rem' }}> {value}% </SlProgressRing> <br /> <SlButton circle onClick={() => adjustValue(-10)}> <SlIcon name="dash" label="Decrease" /> </SlButton> <SlButton circle onClick={() => adjustValue(10)}> <SlIcon name="plus" label="Increase" /> </SlButton> </> ); }; Source HTML React Importing If you’re using the autoloader or the traditional loader, you can ignore this section. Otherwise, feel free to use any of the following snippets to cherry pick this component. Script Import Bundler React To import this component from the CDN using a script tag: <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/progress-ring/progress-ring.js"></script> To import this component from the CDN using a JavaScript import: import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.0/cdn/components/progress-ring/progress-ring.js'; To import this component using a bundler: import '@shoelace-style/shoelace/dist/components/progress-ring/progress-ring.js'; To import this component as a React component: import SlProgressRing from '@shoelace-style/shoelace/dist/react/progress-ring'; Slots Name Description (default) A label to show inside the ring. Learn more about using slots. Properties Name Description Reflects Type Default value The current progress as a percentage, 0 to 100. number 0 label A custom label for assistive devices. string '' updateComplete A read-only promise that resolves when the component has finished updating. Learn more about attributes and properties. Custom Properties Name Description Default --size The diameter of the progress ring (cannot be a percentage). --track-width The width of the track. --track-color The color of the track. --indicator-width The width of the indicator. Defaults to the track width. --indicator-color The color of the indicator. --indicator-transition-duration The duration of the indicator’s transition when the value