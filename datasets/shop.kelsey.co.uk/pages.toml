["https://shop.kelsey.co.uk/boxing-news-magazine"]
title = "Subscribe to Boxing News | iD Sports Media"
description = "Boxing News"
full_description = "• Enjoy exclusive news, features, videos, interviews and galleries• Ringside reports from big international fights to the small halls• Expert pre-fight analysis of the contests people are talking about Written by our experienced editorial team, international journalist network and exclusive contributions from big-name sporting legends.Boxing News is published weekly and has a cover price of £4.25.Subscribe now and save money on the shop price. Choosing our print and online option means not only will you get the magazine delivered direct to your door each week but you will also get early subscriber access to our online content; which also includes access to a digital version of the magazine. Simply select the Subscribe option above, then select the Region (UK, Europe, North America or Rest of World) that you would like the subscription delivered to. The price of your subscription will adjust to reflect the delivery destination.If you take out the rolling subscription offer, this will automatically renew itself until you tell us to cancel, which you can do at any time.If you make a one-off payment, the subscription will not auto renew but we will contact you to remind you to renew. There are multiple subscription choices you can take advantage of such as a Print only subscription which means you will receive a printed copy of the magazine posted through your door.A Print and Digital subscription will allow you to receive a printed copy of the magazine to your door but it also means you can view the magazine online either on your Phone, Tablet or Laptop etc..This means you can read your magazine on the go!A Digital only subscription means you do not receive the print copies. You will only have online access to the magazine which can be viewed on your Phone, Tablet, or Laptop.You can read your magazines at any time! Get access via Pocketmags To activate your digital subscription, please create a create a Pocketmags account, then log in.Click the My Library link in the top-right corner of the screen. From the menu that appears on the left-hand side, select Activate Subscription and choose the title of the magazine that you have subscribed to from the dropdown menu.You will then need to confirm your Customer ID/Order ID as well as your email address. If the title that you purchased is not listed please contact us.If you require your customer ID to activate your digital subscription, please get in touch with us by creating a ticket.If you have any further queries relating to digital issues, please see the Help & FAQ page on the Pocketmags website. If you do not find an answer, you can contact them by popping them an email at help@pocketmags.com.Get access via a branded app If you are accessing your digital edition via the magazine app or website then please click Restore Purchases and choose the option related to print subscriptions.Boxing News Online Boxing News online not only allows you to view the digital Issues, you can also view extra articles. To access these please see the below instructions:• Go to boxingnewsonline. Click on the green Axate tab on the left of your screen.• If you see that you are listed as a subscriber, that's it, you are good to go.If you have subscribed to Boxing News but are experiencing problems logging into Boxing News Online then here are some quick tips:• Go to boxingnewsonline. Click on the green Axate tab on the left of your screen.• If you see that you are listed as a subscriber, that's it, you are good to go.• If you see two buttons saying 'log in' and 'register' that just means that you need to log in. click the 'login' button.• In the next window, add your email address. The system will send you an email to verify your details (check your spam box if you don't see it).• Click the link in the email and you will return to the site. You will now be logged in.• Once logged in, click that green Axate tab and you'll see that you are listed as a subscriber.Why the email? We have a password-less login system. This means that you don't need to log in each time you go to boxing news online. You need to log in if you have logged out for any reason, or if you are reading on a different device.Still having problems? contact us by creating a ticket here or contact the support team for Axate by emailing support@axate.com."
