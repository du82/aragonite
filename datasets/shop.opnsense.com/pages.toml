description = """
The official OPNsense security platform for Amazon Web Services AWS / EC2

OPNsense® Open Source Security – High-end security made easy™
OPNsense is the fastest growing open-source security platform with an Open Source Initiative (OSI) approved 2-clause or simplified BSD license.
Its feature set is extensive and ranges from router/firewall to inline intrusion detection and prevention.
It is the only open-source product that comes with the highly valued Proofpoint® ET Pro ruleset at no cost in the form of the ET Pro Telemetry edition.
The project is defined by its innovation through modularisation and hardening, simple and reliable firmware upgrades, multi-language support, hardened security, fast adoption of upstream software updates as well as a large and friendly community.
Optionally instances can be upgraded with the Business Edition using a separate licence."""
