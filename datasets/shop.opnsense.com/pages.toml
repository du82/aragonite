82.6 (19″) x 302 (274 excl. mount/handle) 43.8 (1U) x 482.6 (19″) x 274 (274 excl. mount/handle) Height x Width x Length (inches) 1.73 x 19 x 11.9 (10.8 excl. mount/handle) 1.73 x 19 x 11.9 (10.8 excl. mount/handle) Form Factor 19″ Rackmountable 19″ Rackmountable Weight (appliance only) 4.70Kg 4.85 Kg Environment Power Requirements 100-240VAC, 50-60Hz 100-240VAC, 50-60Hz Maximum Current (Single PSU) 2.6A 2.6A Power Consumption (Typical – Single PSU) 55W 80W Heat Dissipation 187.6 BTU/hr 273 BTU/hr Operating Temperature 0 to +45°C 0 to +45°C Storage Temperature -20 to +70°C -20 to +70°C Humidity 10-90% non-condensing 10-90% non-condensing Regulatory Compliance FCC part 15 Class A, CE, Rohs FCC part 15 Class A, CE, Rohs 1 The user interface is designed for normal business usage, large rulesets, high number of users or interface assignments may be less practical. All measurements are based upon TCP traffic unless stated otherwise. Total Firewall Throughput is calculated based on maximum PPS and standard 1500 byte packets. Maximum PPS is measured using 500 byte packets. IPS performance is measured using ET Open and standard 1500 byte package size (using Suricata version 6.0.12 / Netmap version 14). SSL VPN is measured using AES256GCM16+SHA512. Concurrent sessions are based upon memory available, where one state consumes 1KB of memory and 1GB of memory is reserved for system tasks. Latency is measured as an average over 60 seconds. Related products 10G SFP+ SR 850nm 300m Transceiver Module €79,00 Add to cart DEC850 – OPNsense® Desktop Security Appliance €1.599,00 Select options This product has multiple variants. The options may be chosen on the product page DEC677 – OPNsense® Desktop Security Appliance €549,00 Select options This product has multiple variants. The options may be chosen on the product page"
