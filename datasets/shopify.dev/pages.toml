["https://shopify.dev/changelog/inventoryitem-queryable-and-updatable-with-products-scopes"]
title = "InventoryItem Queryable and Updatable with Products Scopes - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 22, 2025Admin GraphQL APIInventoryItem Queryable and Updatable with Products ScopesThe scopes for the InventoryItemInput input object and the InventoryItem object have been relaxed. These objects can now be updated and queried using the write_products and read_products scopes, respectively. Specifically, the following changes have been made: The InventoryItemInput can now be set within product* mutations using only the write_products scope. The InventoryItem can be queried with either the read_products or read_inventory scope. However, the following restrictions still apply: The inventoryLevel cannot be queried from the InventoryItem object without the read_inventory scope. The location cannot be queried without the read_locations scope. These changes are applicable across all API versions. Was this section helpful?YesNo"
