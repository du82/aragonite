["https://shopify.dev/changelog/support-bundles-grouped-view-fields-in-graphql-api"]
title = "New fields to represent product bundles in a grouped view - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 1, 2025Admin GraphQL APICustomer Account GraphQL API2025-01New fields to represent product bundles in a grouped viewAs of API 2025-01 version, we have introduced two new fields that allow you to accurately nest component products under the parent product in a grouped view. The new components field has been added to the AbandonedCheckoutLineItem object in the Admin GraphQL API. Use this field to define the component products within a product bundle, ensuring a grouped view in Abandoned Checkout Emails. The new group field has been added to the LineItem object in the Customer Account API. Use this field to indicate that line item products are a part of a product bundle, ensuring a grouped view in Orders Detail Pages. In addition, these fields can help you display product bundles in a grouped view in transactional emails, such as order confirmations and shipping updates. Learn how you can implement a grouped view by following this tutorial. Was this section helpful?YesNo"
