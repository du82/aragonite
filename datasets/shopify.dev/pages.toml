["https://shopify.dev/changelog/deprecation-of-storefrontcustomeraccesstokencreate-mutation"]
title = "Deprecation of storefrontCustomerAccessTokenCreate Mutation - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 1, 2025Customer Account GraphQL API2025-01Deprecation of storefrontCustomerAccessTokenCreate MutationAs of API version 2025-01, the storefrontCustomerAccessTokenCreate mutation is deprecated. This mutation, which was used to exchange the Customer Access Token in the Authorization header for a Storefront Customer Access Token, is no longer necessary. The Storefront API now directly supports Access Tokens from the Customer Accounts API via the @inContext BuyerInput#customerAccessToken, and can be used for cart creation and buyer updates. Migration Path: Obtain an access token using the OAuth2 specification. Detailed steps are available here. These steps are identical to those for obtaining an access token for the Customer Accounts API. Use this access token directly with the Storefront API, replacing the deprecated storefrontCustomerAccessTokenCreate mutation. This access token identifies your customer, enabling personalized features within the Storefront API. For more information on the Customer Accounts API, visit Shopify.dev. Was this section helpful?YesNo"
