["https://shopify.dev/changelog/events-and-origins-in-store-credit-account-transactions"]
title = "Events and Origins in Store Credit Account Transactions - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } December 31, 2024Admin GraphQL API2025-01Events and Origins in Store Credit Account TransactionsAs of Admin API version 2025-01, we've enhanced the store credit transaction object with two new features to provide more detailed insights into store credit transactions. New Types Introduced: StoreCreditAccountTransactionOrigin: This type identifies the origin of a store credit transaction, offering additional context and traceability. StoreCreditSystemEvent: This type details system events related to store credit transactions, facilitating improved tracking and auditing. New Fields Added to Transaction Objects: The event and origin fields are now part of the following transaction object types: StoreCreditAccountCreditTransaction StoreCreditAccountDebitRevertTransaction StoreCreditAccountDebitTransaction StoreCreditAccountExpirationTransaction StoreCreditAccountTransaction These enhancements allow you to access event and origin data for each transaction, enriching the store credit transaction data. By utilizing these new fields, you can gain deeper insights into transaction histories, enhancing financial reporting and customer service. For detailed implementation instructions, please refer to our documentation. Was this section helpful?YesNo"
