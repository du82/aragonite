title = "Payout statuses In Transit and Scheduled have been merged - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = 'Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 29, 2025Admin GraphQL API2025-04Payout statuses In Transit and Scheduled have been mergedDeprecation Announcement: Payout Status Changes We’ve made a significant update to the payout statuses in our system. As part of our ongoing efforts to streamline and enhance your experience, we have merged the payout statuses "In Transit" and "Scheduled" into a single status: Scheduled. Key Changes Merged Payout Statuses: The previous statuses of "In Transit" and "Scheduled" will now be represented simply as Scheduled. What You Need to Do If you have been utilizing the "In Transit" status in your workflows or integrations, please update your systems to just recognize the Scheduled status moving forward. This change will ensure that you continue to receive accurate information regarding your payouts. Why This Change? We made this decision to simplify the payout tracking process, improve clarity, and enhance your overall experience with our services. Deprecation Date This change is effective immediately, and the statuses will be adjusted in your dashboards and API responses. For more detailed information on this change, please refer to our documentation. We appreciate your understanding and support as we continually work to improve our services for you. Was this section helpful?YesNo'
