title = "Versions"
description = "POS UI Extensions versions. Contains the changelog for each version as well as the information on which versions are currently supported."
full_description = "POS UI Extensions versions. Contains the changelog for each version as well as the information on which versions are currently supported. - Added in POS version: N/A - Removed in POS version: N/A - Release day: N/A ### Features - Added support for the [pos.transaction-complete.event.observe](/docs/api/pos-ui-extensions/targets/post-purchase/pos-transaction-complete-observe) target. - Added support for cash tracking session. [pos.cash-tracking-session-start.event.observe](/docs/api/pos-ui-extensions/targets/cash-tracking/pos-cash-tracking-session-start-observe), [pos.cash-tracking-session-cancel.event.observe](/docs/api/pos-ui-extensions/targets/cash-tracking/pos-cash-tracking-session-cancel-observe), [pos.cash-tracking-session-complete.event.observe](/docs/api/pos-ui-extensions/targets/cash-tracking/pos-cash-tracking-session-complete-observe) targets. - Added in POS version: 9.26 - Removed in POS version: N/A - Release day: 1/6/2025 ## Important Fixes - **POS 9.29.0**: - Fixed an issue where the `FormattedTextField` component was rendering black input text in dark mode. - **POS 9.27.0**: - Fixed an issue where the `Stack` component was not rendering correctly. By default, `Stack` will now always wrap. Additionally, stacks using `'block'` will now compress horizontally. Use `alignContents: 'stretch'` to take all of the horizontal space. This will not have an impact on layout in previous POS versions. ### Breaking Changes - Removed the deprecated `ActionItem` component. Use a [Button](/docs/api/pos-ui-extensions/components/button) instead. - Removed the deprecated `SmartGridApi`. Use the [ActionApi](/docs/api/pos-ui-extensions/apis/action-api) instead. - Removed the deprecated DiscountType. Use [CartDiscountType](/docs/api/pos-ui-extensions/apis/cart-api#cartapi-propertydetail-applycartdiscount) and [LineItemDiscountType](/docs/api/pos-ui-extensions/apis/cart-api#cartapi-propertydetail-setlineitemdiscount) instead. - Removed the deprecated `badge` prop from the [List](/docs/api/pos-ui-extensions/components/list) component. Use `badges` instead. - Removed the deprecated `TextFieldProps` type from the [TextField](/docs/api/pos-ui-extensions/components/textfield) component. - Deprecated `'vertical'` and `'horizontal'` as values for the `direction` field in the [Stack](/docs/api/pos-ui-extensions/components/Stack) component. Use `'block'` and `'inline'` instead. - Deprecated the `flex` field in the [Stack](/docs/api/pos-ui-extensions/components/Stack) component. Set `blockSize` or `inlineSize` to a value other than `'auto'` to create the desired size for your `Stack`. - Deprecated the `flexWrap` field in the [Stack](/docs/api/pos-ui-extensions/components/Stack) component. Content will now wrap automatically. - Deprecated the `paddingHorizontal` and `paddingVertical` fields in the [Stack](/docs/api/pos-ui-extensions/components/Stack) component. Use `paddingInline` and `paddingBlock` instead. - Removed `customValidator` prop from the [FormattedTextField](/docs/api/pos-ui-extensions/components/formattedtextfield) component. - Removed `email`, `firstName`, `lastName`, and `note` from the [Customer](/docs/api/pos-ui-extensions/apis/cart-api#customer) object. - `Text` now takes priority in growing over other components. To contain Text to its minimum width, wrap it in a `Box` component. ### Features - Added [PrintApi](/docs/api/pos-ui-extensions/apis/print-api) and a [PrintPreview](/docs/api/pos-ui-extensions/components/printpreview) component. - Added `currency` prop to the [SessionApi](/docs/api/pos-ui-extensions/apis/session-api). - [Cart API](/docs/api/pos-ui-extensions/apis/cart-api) updates: - Added `bulkUpdateCart` function for single-operation cart updates. - The `addLineItem` and `addCustomSale` functions now return a `UUID` for the added line item. - Added [Box](/docs/api/pos-ui-extensions/components/box) component. - Added a new `justifyContent` prop to [Stack](/docs/api/pos-ui-extensions/components/Stack) component. The default value is `'start'`. - Added a new `alignContents` prop to [Stack](/docs/api/pos-ui-extensions/components/Stack) component. The default value is `'start'`. By default, `'block'` stacks may compress horizontally. Use `'stretch'` to take all of the horizontal space. - Added a new `alignItems` prop to [Stack](/docs/api/pos-ui-extensions/components/Stack) component. The default value is `'stretch'`. This may by default cause certain elements to stretch. - Added a new `blockSize` prop to [Stack](/docs/api/pos-ui-extensions/components/Stack) component. This will allow setting a vertical size for the stack. - Added a new `inlineSize` prop to [Stack](/docs/api/pos-ui-extensions/components/Stack) component. This will allow setting a horizontal size for the stack. - Added sizing and fill options to the [Image](/docs/api/pos-ui-extensions/components/image) component."
