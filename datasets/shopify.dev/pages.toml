full_description = "Builds and deploys your Hydrogen storefront to Oxygen. Requires an Oxygen deployment token to be set with the `--token` flag or an environment variable (`SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN`). If the storefront is [linked](/docs/api/shopify-cli/hydrogen/hydrogen-link) then the Oxygen deployment token for the linked storefront will be used automatically. Generate an authentication bypass token, which can be used to perform end-to-end tests against the deployment. Specify a build command to run before deploying. If not specified, `shopify hydrogen build` will be used. Specifies the environment to perform the operation using its handle. Fetch the handle using the `env list` command. Create a JSON file containing the deployment details in CI environments. Defaults to true, use `--no-json-output` to disable. Checks that there is exactly one valid lockfile in the project. Defaults to `true`. Deactivate with `--no-lockfile-check`. Description of the changes in the deployment. Defaults to the commit message of the latest commit if there are no uncommited changes. The path to the directory of the Hydrogen storefront. Defaults to the current directory where the command is run. Shop URL. It can be the shop prefix (janes-apparel) or the full myshopify.com URL (janes-apparel.myshopify.com, https://janes-apparel.myshopify.com)."
