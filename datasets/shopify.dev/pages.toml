full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } February 19, 2025Admin GraphQL APIAdmin REST APICustomer Account GraphQL API2025-04Reserved prefix protection for metafields and metaobjectsStarting today, reserved prefixes have been widened to include any phrase. You can no longer make any metafield namespace or metaobject type that includes -- (e.g., foo-- , foo--bar ). This only affects new metafield and metaobject definitions; existing definitions will continue to work as before. This change is intended to reserve the -- format for platform defined features such as shopify--{standard} and app--{your-app-id}. Was this section helpful?YesNo"
