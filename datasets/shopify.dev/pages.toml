["https://shopify.dev/changelog/new-markets-apis"]
title = "New Markets APIs - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = '''Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 3, 2025Action RequiredAdmin GraphQL API2025-04New Markets APIsAs of 2025-04, the Markets APIs have been updated to support additional customizations and conditions for each market, enabling merchants to tailor their shops' buyer experiences. Primary Market To transition away from the "primary market" concept, a new mutation, backupRegionUpdate allows you to set a shop-wide region to use when no better option can be determined from buyer signals. Instead of MarketRegionCreateInput, you must use BackupRegionUpdateInput. To query the shop's backup region, use backupRegion. To obtain a list of available regions that can be set as a backup, use the availableBackupRegions query. Currency Settings The Market.currencySettings field is now nullable. A null value indicates that the currency settings are inherited from the parent market. Web Presence A web presence can now exist without a market and can also be assigned to multiple markets. The field MarketWebPresence.market is deprecated in favour of MarketWebPresence.markets, which allows for this expanded functionality. Catalogs As of 2025-04, the Product's contextualPricing field and Product Variant's contextualPricing field will resolve prices only considering active markets. Previous versions will continue to consider draft markets in the calculation of these fields. Was this section helpful?YesNo'''
