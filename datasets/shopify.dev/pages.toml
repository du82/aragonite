["https://shopify.dev/docs/api/pos-ui-extensions/components/textfield"]
title = "TextField"
description = "Use a text field to allow merchants to enter or edit text. If you want to specify the kind of input, then use a formatted text field."
full_description = "Use a text field to allow merchants to enter or edit text. If you want to specify the kind of input, then use a formatted text field. Indicates an error to the user. The field is given specific stylistic treatment to communicate problems that have to be resolved immediately. Callback when the user makes any changes in the field. As noted in the documentation for `onChange`, you **must not** use this to update `value` — use the `onChange` callback for that purpose. Use the `onInput` prop when you need to do something as soon as the user makes a change, like clearing validation errors that apply to the field as soon as the user begins making the necessary adjustments. The current value for the field. Defaults to now. You should update this value in response to the `onChange` callback."
