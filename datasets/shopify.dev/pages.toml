["https://shopify.dev/docs/api/liquid/filters/array-filters"]
title = "Liquid filters"
description = "Liquid filters are used to modify Liquid output."
full_description = '''Many filters accept parameters that let you specify how the filter should be applied. Some filters might require parameters to be valid. To apply filters to an output, add the filter and any filter parameters within the output's curly brace delimiters {{ }}, preceded by a pipe character |. In the example below, product is the object, title is its property, and upcase is the filter being applied. code: {%- assign original_prices = collection.products | map: 'compare_at_price' -%} Original prices: {% for price in original_prices -%} - {{ price }} {%- endfor %} {%- assign compacted_original_prices = original_prices | compact -%} Original prices - compacted: {% for price in compacted_original_prices -%} - {{ price }} {%- endfor %} data: {"collection":{"products":[{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":"1000000.59"},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":"10.00"},{"compare_at_price":null},{"compare_at_price":"25.00"},{"compare_at_price":"400.00"},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null},{"compare_at_price":null}]}} output: Original prices: - - - - - 100000059 - - - - 1000 - - 2500 - 40000 - - - - - - - Original prices - compacted: - 100000059 - 1000 - 2500 - 40000 code: {%- assign types_and_vendors = collection.all_types | concat: collection.all_vendors -%} Types and vendors: {% for item in types_and_vendors -%} {%- if item != blank -%} - {{ item }} {%- endif -%} {%- endfor %} data: {"collection":{"all_types":["","Animals & Pet Supplies","Baking Flavors & Extracts","Container","Cooking & Baking Ingredients","Dried Flowers","Fruits & Vegetables","Gift Cards","Health","Health & Beauty","Invisibility","Love","Music & Sound Recordings","Seasonings & Spices","Water"],"all_vendors":["Clover's Apothecary","Polina's Potent Potions","Ted's Apothecary Supply"]}} output: Types and vendors: - Animals &amp; Pet Supplies - Baking Flavors &amp; Extracts - Container - Cooking &amp; Baking Ingredients - Dried Flowers - Fruits &amp; Vegetables - Gift Cards - Health - Health &amp; Beauty - Invisibility - Love - Music &amp; Sound Recordings - Seasonings &amp; Spices - Water - Clover's Apothecary - Polina's Potent Potions - Ted's Apothecary Supply'''
