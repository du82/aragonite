full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 29, 2025Action RequiredAdmin GraphQL API2025-04New Catalog APIsAs of April 2025, the Catalog APIs have been updated to support changes in how markets are managed. For more details, see the New Markets APIs. With these updates, multiple markets can now be assigned to a single catalog. Consequently, the MarketCatalog.markets connection will no longer guarantee the return of a single entry. Additionally, the Market object now supports new conditions. Previously, only RegionConditions were available for a market; now, CompanyLocationConditions are also supported. To maintain the existing behavior and access only Regions, you must update the markets connection by using the type: REGION argument. Was this section helpful?YesNo"
