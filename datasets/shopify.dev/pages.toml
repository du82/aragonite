["https://shopify.dev/changelog/discounts-reference-docs-improvements"]
title = "Discounts reference docs improvements - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } February 7, 2025Admin GraphQL APIDiscounts reference docs improvementsWe’ve rewritten our most-visited and least-loved docs in the Discounts and marketing section of the GraphQL Admin API reference. You've shared many helpful comments and questions through our Was this page helpful? form, and we’ve reviewed and addressed 100% of them. Here’s the lowdown on the latest updates. Better descriptions Many of our descriptions were too brief, circular (restated the method name), expected too much Shopify knowledge, or didn’t link to other relevant docs. We’ve thoroughly revamped descriptions for Discounts objects, queries (including query filters), mutations, and input objects to include all the details you need without any guesswork. We also added more links to relevant tutorials to make it easier to find your way around and speed up your coding process. Better examples We know how helpful it is to see code in action! That’s why we’ve added more real-world examples for common use cases. We added examples across top Discounts pages, especially for pages with 0 examples going in. Thanks for your feedback! These updates are all about making your life easier. Less time scratching your head or making guesses means more time building amazing things! We'd love to know what you think—where have these updates helped, and where else in the Admin API docs would you like to see improvements? You can leave comments by clicking the Was this page helpful? button on Shopify.dev. Was this section helpful?YesNo"
year_published = 2025
year_updated = 2025
