["https://shopify.dev/changelog/pos-ui-extensions-2025-01-update"]
title = "POS UI Extensions 2025-01 Update - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 6, 2025POS ExtensionsPOS UI Extensions 2025-01 UpdateAs of January 20, we added the following updates to POS UI Extensions: Breaking Changes Removed the deprecated ActionItem component. Use a Button instead. Removed the deprecated SmartGridApi. Use the ActionApi instead. Removed the deprecated DiscountType. Use CartDiscountType and LineItemDiscountType instead. Removed the deprecated badge prop from the List component. Use badges instead. Removed the deprecated TextFieldProps type from the TextField component. Deprecated 'vertical' and 'horizontal' as values for the direction field in the Stack component. Deprecated the flexChildren' field in the Stack component. Deprecated the flex' field in the Stack component. Deprecated the flexWrap' field in the Stack component. Deprecated the paddingHorizontal' and paddingVertical fields in the Stack component. Removed customValidator prop from the FormattedTextField component. Removed email, firstName, lastName, and note from the Customer object. Features Added PrintApi and a PrintPreview component. Added currency prop to the SessionApi. Cart API updates: Added bulkUpdateCart function for single-operation cart updates. The addLineItem and addCustomSale functions now return a UUID for the added line item. Added Box component. Enhanced the Stack component. New fields include justifyContent, alignItems, and alignContent, as well as numerous new sizing and spacing options. Added Sizing and fill options to theImage component. All of the changes are available for POS UI extensions version 2025-01 and POS app version 9.26.0. See the version log for all version details. Was this section helpful?YesNo"
year_published = 2025
year_updated = 2025
