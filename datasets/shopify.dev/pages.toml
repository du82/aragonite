["https://shopify.dev/changelog"]
title = "Recent changes to Shopify’s platform"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = '''Developer changelogSubscribe to the changelog to stay up to date on recent changes to Shopify’s APIs and other developer products, as well as preview upcoming features and beta releases.RSS Updates .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } Search changelogFilter by tagAPIToolsShopify App StoreThemesPlatformShopify Theme StoreBuilt For ShopifyAction RequiredFilter by release2024-102025-01February 28, 2025Action RequiredAdmin GraphQL APIStorefront GraphQL API2025-04AMAZON_PAY enumerated in DigitalWalletsThe DigitalWallets enum now includes AMAZON_PAY, enabling its use in Storefront and Admin GraphQL APIs which can determine if Amazon Pay is available to buyers and has been used in transactions. Read full post –>February 24, 2025Admin GraphQL API2025-04The X-Shopify-API-Deprecated-Reason HTTP header will return actual GraphQL deprecations if anyAs of 2025-04, the X-Shopify-API-Deprecated-Reason HTTP header will return the list of detected deprecations instead of a generic URL. Read full post –>February 26, 2025Admin GraphQL API2025-04New customer address capabilities in the Admin API2025-04 adds customerAddressCreate, customerAddressUpdate, and customerAddressDelete mutations for more granular control on customer addresses. Read full post –>February 27, 2025Action RequiredAdmin GraphQL API2025-07Metafield description input field removalThe description field for metafields is being removed in unstable. Read full post –>February 19, 2025Admin GraphQL APIAdmin REST APICustomer Account GraphQL API2025-04Reserved prefix protection for metafields and metaobjectsNew metafield namespaces and metaobject types can not have prefixes that end with double hyphens (e.g., "foo--"). Existing definitions remain unaffected. Read full post –>February 18, 2025Admin GraphQL APIAdmin REST APIWebhookNo-op for unchanged metafields and metaobjectsMetafield/metaobject writes that don't change values won't trigger actions like webhooks, enhancing efficiency by reducing unnecessary processing in select mutations and bulk operations. Read full post –>February 17, 2025Admin GraphQL API2025-04New ends_at, created_at, and updated_at query filter parameters for searching discountsAPI version 2025-04 introduces the ends_at, created_at, and updated_at query filter parameters, which provides greater flexibility in managing and viewing discounts. Read full post –>February 17, 2025Action RequiredAPIExplicit access grants for metafields removedExplicit grants for app-owned metafields end on Feb 24, 2025. Use custom namespace for sharing metafields between apps after this date. Read full post –>February 18, 2025PlatformHydrogen February 2025 releaseHydrogen v2025.1.1 validated Remix v3_singleFetch future flag, stabilized B2B methods and props and several package version updates. Read full post –>February 15, 2025Admin GraphQL API2025-04NON_TEST_ORDER_LIMIT_REACHED error code for subscriptions billing attemptsAdds NonTestOrderLimitReached field to SubscriptionBillingAttemptErrorCode, alerting you when you've exceeded the order limit for a payment processor. Read full post –>February 11, 2025ThemesLiquid arrays now support the find, find_index, has, and reject filtersNew Liquid filters find, find_index, has, and reject simplify array handling by eliminating verbose loops and complex logic, making your code more concise and declarative Read full post –>February 5, 2025Admin GraphQL API2025-04Attribute Marketing Consent to Retail LocationsUse the GraphQL Admin API to query the retail location where customers are updating their marketing consent. Read full post –>February 14, 2025Admin GraphQL API2025-04Updated Country Harmonized System Code validations on Product Variant mutationsAs of 2025-04, Product Variant mutations will validate country harmonized system codes against existing inventory item harmonized system codes. Read full post –>February 7, 2025PlatformFlow: Template extensions no longer block deploysapp deploy now instantly deploys Flow template extensions. After a post-deploy review, approved templates appear in the library; unapproved ones receive feedback for changes before redeployment. Read full post –>February 7, 2025Admin GraphQL APIDiscounts reference docs improvementsRevamped our Discounts GraphQL Admin API docs with more detailed descriptions and real-world examples, based on your user feedback! Read full post –>December 31, 2024Admin GraphQL API2025-01Events and Origins in Store Credit Account TransactionsAdmin API 2025-01 adds 'event' and 'origin' fields to store credit transactions, enhancing traceability and auditing for better financial reporting and customer service. Read full post –>February 1, 2025Admin GraphQL APICustomer Account GraphQL API2025-04Removing unnecessary RELEVANCE sort optionsRELEVANCE will no longer be included in connection sort options by default as of 2025-04. This will eliminate cases where the option offered no unique behavior. Read full post –>January 31, 2025PlatformHydrogen January 2025 releaseHydrogen v2025.1.0 adds Storefront API 2025-01 support, validated Remix v3_lazyRouteDiscovery future flag and several bug fixes. Deprecated features removed for improved performance. Read full post –>February 7, 2025Customer Account GraphQL API2025-04New event and origin fields for store credit transactionsNew fields event and origin added to store credit transactions for Customer Account GraphQL API 2025-04. Read full post –>January 29, 2025Action RequiredAdmin GraphQL API2025-04New Catalog APIsCatalog APIs now support multiple markets per catalog. Use type: REGION to maintain single market behavior. Read full post –>January 29, 2025Admin GraphQL API2025-04Payout statuses In Transit and Scheduled have been mergedPayout statuses "In Transit" and "Scheduled" are now merged as "Scheduled." Update workflows to recognize "Scheduled" for accurate payout info. Change is effective immediately. Read full post –>January 28, 2025Liquidshop.metaobjects is now just metaobjects in liquidAccess metaobjects in Liquid using metaobjects.type.handle for standardization. The old shop.metaobjects.type.handle is deprecated but still supported. Transition to the new syntax. Read full post –>January 25, 2025Admin GraphQL APICustomer Account GraphQL API2025-04New creation, update, and status filters for subscriptionContractsAPI v2025-04 now supports filtering subscriptionContracts by created_at, updated_at, and status in admin and customer APIs. Read full post –>January 24, 2025Shopify App StoreApps will be reviewed for necessary scopesStarting February 1, 2025, all apps submitted to the Shopify App Store will be checked for scopes that require Shopify permission for approved use cases. Apps that have unnecessary scopes, or... Read full post –>January 31, 2025Admin GraphQL API2025-04Record partial payments on OrdersAs of 2025-04 partial payments can be recorded on orders using the new orderCreateManualPayment mutation.... Read full post –>January 23, 2025Admin GraphQL API2025-04Optional role argument for themeCreate mutationThe themeCreate mutation now supports an optional role argument. Read full post –>January 22, 2025Admin GraphQL APIInventoryItem Queryable and Updatable with Products ScopesUpdated InventoryItemInput and InventoryItem scopes allow updates with write_products and queries with read_products. Restrictions on inventoryLevel and location queries remain. Applies to all API versions. Read full post –>January 22, 2025Admin GraphQL APISupport added for $app in product queries by metafieldSupport added for $app namespaces in product queries by metafield which improves query flexibility. Read full post –>January 16, 2025Action RequiredStorefront GraphQL APIContinuous cart authenticationEnable continuous authentication by appending customerAccessToken to cart in buyerIdentity. Authenticated checkouts now available for all plans. Read full post –>January 16, 2025Action RequiredShopify App StoreNew Buyer Consent RequirementAs of Feb 18, 2025, all apps must show costs and get buyer consent for paid items in Storefront, Cart, and Checkout. Applies to published and unpublished apps. Read full post –>January 15, 2025Admin GraphQL API2025-04Line item weight input for orderCreate mutationThe orderCreate mutation now supports OrderCreateLineItemInput.weight to set line item weights. Read full post –>January 15, 2025Admin GraphQL API2025-04Expose the id field in ProductFullSyncPayload objectVersion 2025-04: Admin API now includes the return field id in product full sync payload, enhancing data tracking for developers. Read full post –>January 15, 2025Admin ExtensionsAdmin GraphQL APINew inventoryItem field on ProductSetVariantInputThe GraphQL Admin API now includes the inventoryItem field in ProductVariantSetInput, effective from API version 2024-10, enhancing product management capabilities. Read full post –>January 11, 2025Built for ShopifyPerformance, integration and category-specific requirements come into practiceTo ensure that the Built for Shopify status represents the highest quality of app apps will need to meet the following performance, integration and category-specific requirements. These... Read full post –>January 10, 2025Admin GraphQL API2025-04New card brands for OrderTransactions.paymentMethodsOrderTransactions.paymentMethods now includes CARTES_BANCAIRES and BANCONTACT. From API version 2025-04, transactions using these methods will show updated values in responses. Read full post –>January 8, 2025ToolsShopify Functions template and Shopify CLI changes to support Rust 1.84Shopify Functions templates for Rust now exclude cargo-wasi due to Rust 1.84 changes. Shopify CLI 3.73 adds default build optimization. Read full post –>January 6, 2025API2025-01New validations on function input query variables metafieldsAs of 2025-01, Function APIs validate input query variables. Invalid metafields now trigger InvalidVariableValueError, improving error detection and debugging for developers. Read full post –>January 6, 2025Admin GraphQL APIAdd tax validation with localizedFields in Checkout UI Extensions & FunctionsUse the new localizedFields in the Checkout Extensions APIs to apply custom validation for tax fields. The localizationExtensions field in the Admin API has now been renamed to localizedFields. Read full post –>January 6, 2025POS ExtensionsPOS UI Extensions 2025-01 UpdateAs of January 20, we added the following updates to POS UI Extensions: Breaking Changes Removed the deprecated ActionItem component. Use a... Read full post –>January 3, 2025Action RequiredAdmin GraphQL API2025-04New Markets APIsMarkets APIs update: Use backupRegionUpdate for shop-wide regions, BackupRegionUpdateInput replaces MarketRegionCreateInput. Market.currencySettings is nullable. WebPresence replaces MarketWebPresence. Read full post –>January 1, 2025Admin GraphQL API2024-10New collection_id filter added to products query filtersThe 2024-10 GraphQL Admin API update adds collection_id as a filter in the products query, usable with specific filters like created_at, status, and vendor. Read full post –>January 1, 2025Admin GraphQL APICustomer Account GraphQL API2025-01New fields to represent product bundles in a grouped viewWe introduced two new fields that allow you to accurately nest component products under the parent product in a grouped view. Read full post –>January 1, 2025Storefront GraphQL API2025-01Filter products by category or taxonomy metafieldStorefront API 2025-01 adds CategoryFilter and TaxonomyMetafieldFilter for filtering products by category ID and taxonomy metafield, enhancing search and collection queries. Read full post –>January 1, 2025Admin GraphQL API2025-01Minimum requirement is now optional on automatic discountsThe minimumRequirement field in discount APIs is now optional, allowing null values. This change simplifies discount setup for merchants in version 2025-01. Read full post –>January 1, 2025Admin GraphQL API2025-01New customer input field for the OrderCreate mutationGraphQL Admin API 2025-01 deprecates customer_id for customer, allowing direct customer association or upsert, simplifying order creation by removing the need to fetch customer IDs. Read full post –>January 1, 2025Admin GraphQL API2025-01Introduce concatenatedOriginContract to subscriptionLineAs of 2025-01, we've introduced concatenatedOriginContract to subscriptionLine . You can now query the origin contract of the lines if you have used the Subscription Billing Cycle APIs to... Read full post –>January 1, 2025Action RequiredAdmin GraphQL API2025-01Unused PriceListUserErrorCode values removedStarting from 2025-01, unused PriceListErrorCode values will be removed. Read full post –>January 1, 2025Storefront GraphQL API2025-01Update to percentage_adjustment field on SellingPlanPercentagePriceAdjustmentIn Storefront API 2025-01, adjustmentPercentage in SellingPlanPercentagePriceAdjustment changes from Int to Float, affecting how percentage price adjustments are handled. Read full post –>January 1, 2025Customer Account GraphQL API2025-01Deprecation of storefrontCustomerAccessTokenCreate MutationAPI version 2025-01 deprecates storefrontCustomerAccessTokenCreate. Use Customer Accounts API tokens directly with Storefront API for cart and buyer updates, replacing the deprecated mutation. Read full post –>January 1, 2025Admin GraphQL API2025-01New delivery promise participants APIAs of the 2025-01 Admin GraphQL API, you can now query for delivery promise participants, using... Read full post –>Next'''
