title = "Support added for $app in product queries by metafield - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = 'Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 22, 2025Admin GraphQL APISupport added for $app in product queries by metafieldWe now support querying products by app-owned metafields with a saved namespace using the $app syntax. To include an app-owned metafield in your query, you can use the syntax metafields.$app.key:\"value\" or metafields.$app\\:optional-additional-text.key:\"value\". As documented, special characters need to be escaped from queries. For this reason, you need a \\ when specifying :. For example, suppose you have an app-owned metafield with the optional-additional-text swatch-app and key color with a value of green. To query for products with this metafield, you would use the following search syntax: "metafields.$app\\:swatch-app.color:\"green\"" Learn more about querying products by metafield value and creating metafields with reserved namespaces. Was this section helpful?YesNo'
