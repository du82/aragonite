["https://shopify.dev/changelog/line-item-weight-input-for-ordercreate-mutation"]
title = "Line item weight input for orderCreate mutation - Shopify developer changelog"
description = "Shopify’s developer changelog documents all changes to Shopify’s platform. Find the latest news and learn about new platform opportunities."
full_description = "Back to Developer changelog .Mode-Dark { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-dark-B9onMHn1.png); } } .Mode-Light { .-assetshero-light-Drov1vFSpngassetshero-dark-B9onMHn1png { background-image: url(/assets/hero-light-Drov1vFS.png); } } January 15, 2025Admin GraphQL API2025-04Line item weight input for orderCreate mutationWe have enhanced the orderCreate mutation by adding an optional field, OrderCreateLineItemInput.weight, which allows you to specify the weight of each line item using the WeightInput object. For line items linked to a product variant: Specifying a weight will override the variant's default weight. If no weight is specified, the variant's weight will be used by default. For line items not linked to a product variant, such as custom items: Specifying a weight will apply that weight to the line item. If no weight is specified, the line item's weight will default to 0. This is an improved version of the line_items.grams field that exists in the REST API. Was this section helpful?YesNo"
