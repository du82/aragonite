title = "Should I Use A Carousel?"
full_description = "so... should i use a carousel? NO!!! seriously, you really shouldn't why not? well, let me tell you... 1% clicked a feature. Of those, 89% were the first position. 1% of clicks for the most significant object on the home page? nd.edu stats by @erunyon The target was the biggest item on the homepage - the first carousel item. “Nonetheless, the user failed the task.” nielsen norman Group “We have tested rotating offers many times and have found it to be a poor way of presenting home page content.” wider funnel “Almost all of the testing I’ve managed has proven content delivered via carousels to be missed by users. Few interact with them.” adam fellowes “Carousels are effective at being able to tell people in Marketing/Senior Management that their latest idea is on the Home Page. Use them to put content that users will ignore on your Home Page. Or, if you prefer, don’t use them. Ever.” lee duddell “Carousels pose accessibility issues for keyboard and screen reader users that simply cannot be adequately addressed by markup or hacks. Carousels are this decade's <blink> tag.” jared smith frustrated? use a carousel and your users will be too next prev"
