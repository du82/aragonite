["https://shrm.org/credentials/certification/how-to-get-shrm-certified-process"]
title = "How to Get SHRM Certified in 6 Steps"
description = "Looking to advance your HR career and increase your earning potential with a SHRM certification? Here's where to start."
full_description = "How to Get SHRM Certified Looking to advance your HR career and increase your earning potential with a SHRM certification? Here's where to start. SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Self-Study Instructor-Led Recertify Get Recertified Recertification Portal Qualifying PDC Activities How to Enter PDCs More Educators For Educators More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Organizations Certify My Team Recertification Providers Certified Directory Apply Now More Apply Now SHRM Certification Process 1. Decide on a SHRM Certification. Verify whether SHRM Certification fits within your career goals.Determine your appropriate exam level, either the SHRM-CP or SHRM-SCP.Validate you meet the eligibility criteria to take the SHRM Certification exam.Confirm your readiness: Do you have the time? Do you have the energy? Do you have the commitment? Do you have the funding and the support? Explore Certifications 2. Apply and schedule your exam. Determine when you want to take your exam; either May - July, or December - February. See Exam Details and Fees. Note: Your desired testing date must coincide with the application window.Apply for the exam during an open application window.Arrange testing accommodations, if needed.Schedule your exam at a Prometric test center. Apply for Exam 3. Prepare for your exam. Start by studying the SHRM Body of Applied Skills and Knowledge® (SHRM BASK®).Evaluate the SHRM Learning System options, including self-study, instructor-led or team-preparation options.Find a local SHRM chapter and join a study group.Take your learning to the next level with additional resources, including SHRM Preparation Webinars and the Ace Your SHRM Certification Exam book or e-book. View Exam Prep Recommendations 4. Take the exam. Review the information about in-person testing.Your exam will take approximately 3 hours and 40 minutes to complete. Good luck!A passing score is 200, and your results are communicated immediately. View SHRM Exam Details & Fees 5. Earn your certification. Use the SHRM-CP or SHRM-SCP designation letters after your name.Receive your complimentary digital certificate. Purchase a framed certificate if desired.Receive a digital badge and accept it to share on social media.Have your name listed in the SHRM Certification Directory. View Directory 6. Recertify your SHRM-CP or SHRM-SCP. Recertify your credential every three years from the date you become certified.Recertify with Professional Development Credits (PDCs) or by re-taking the exam.If recertifying with PDCs, earn 60 within your three-year recertification cycle.Recertify by your recertification cycle end date. Learn More About Recertification"
year_published = 2025
