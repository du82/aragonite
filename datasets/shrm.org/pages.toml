description = "The SHRM Foundation elevates and empowers HR professionals as a force for social good so that all workplaces can prosper and thrive."
full_description = "If it’s a workplace opportunity thing, it’s a SHRM thing. You Have the Power to Transform Workplaces At SHRM Foundation, we believe HR professionals are essential to driving workplace change, fostering inclusion, and ensuring all talent thrives. Support us in creating a world of work that works for all. DONATE NOW You Have the Power to Transform Workplaces At SHRM Foundation, we believe HR professionals are essential to driving workplace change, fostering inclusion, and ensuring all talent thrives. Support us in creating a world of work that works for all. DONATE NOW Keeping HR Ahead of the Curve SHRM sits at the center of talent and workplace development strategies, supporting HR professionals, employers and employees alike — and the SHRM Foundation drives action to improve the future of the workplace. Explore how the SHRM Foundation drove positive change across the world of work in 2023, keeping HR ahead of the curve. The 2024 Impact Report is coming in early Q2 2025. Download the Report Our Focus To expand access to work and help workers and workplaces thrive, SHRM Foundation focuses on three interconnected pools of work. Widening Pathways to Work Helping employers engage the full spectrum of talent. Learn More Strengthening the HR Field Supporting, celebrating, and diversifying the HR leaders of today and tomorrow. Learn More Tackling Societal Challenges Preparing and supporting HR leaders to address the challenges coming their way. Learn More By the Numbers 3 out of 4 HR professionals report work from employees hired from untapped talent pools perform the same or better than other employees. Source: SHRM Foundation (2021), Beneath the Surface: A Unified Approach To Realizing The Value Of Untapped Talent 2.1 million HR professionals driving change in the U.S.—a number expected to go up by twice the national average growth rate for all other occupations between now and 2032. Source: Bureau of Labor Statistics, Occupational Employment and Wage Statistics. 76% of people believe companies should be doing more to support the mental health of their workforce. Source: Dan Schawbel, in partnership with Oracle (2020), Workplace Intelligence Our Supporters INNOVATION: Diamond Investor INSPIRATION: Gold Investor IMAGINATION: Silver Investor COLLABORATION: Bronze Investor CHAMPION: Friend Investor Upcoming Opportunities The SHRM Foundation supports and celebrates HR professionals by providing over $600,000 in scholarships and grants annually, and recognizing leaders through prestigious awards programs. View all Opportunities Jan 13 - Mar 14 2025 HR Leadership Program Apply Now Jan 13 - Mar 14 2025 Undergraduate & Graduate Scholarships Apply Now Jan 13 - Mar 14 2025 Annual Conference Grants Apply Now This scholarship allows for me to focus on that task, do high-caliber research, and know that I have the support of a prestigious society of people with the same values behind me. Naomi Samuel, Graduate Scholarship Recipient University of Texas at Arlington Learn About Scholarships Get Involved Make a Donation Donate Now Volunteer View Volunteer Opportunities Become an Investor Learn More .v-align > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid, .equal-heights > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid { display: flex; flex-wrap: wrap; } .v-align .layout-container__wrapper, .v-align .cmp-container, .v-align .layout-container__inner, .v-align .aem-Grid{ height:100%; align-items:center; } .v-align .layout-container__wrapper { background-position: center; } .equal-heights .container > .layout-container__wrapper, .equal-heights .container > .layout-container__wrapper > .cmp-container, .equal-heights .container > .layout-container__wrapper > .cmp-container > .layout-container__inner{ height:100%; } .button.d-inline { display: inline-block; width: unset !important; margin: 0 15px 15px 0; float:unset !important; } .btn-group > .layout-container__wra