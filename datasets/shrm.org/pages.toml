["https://shrm.org/advocacy"]
title = "SHRM Advocacy | Driving Workplace Change"
description = "SHRM advocates for policy areas that create meaningful impact on the workplace, such as workforce development, equity, health care, and immigration."
full_description = "SHRM Public Policy Priorities As we work with policymakers, learn more about SHRM's public policy priorities. Learn More EO Impact Zone: A Guide for HR Leaders Inclusion and diversity are essential for creating thriving workplaces and communities. These principles drive innovation, foster collaboration, and ensure every individual feels valued and empowered. Review DEI Impacts See Other EO Impacts SHRM Priorities for the 119th Congress SHRM is focused on recognizing the success of the past and acknowledging the need to drive meaningful change to stay ahead of workplace change. To make the most of this year, SHRM is calling on Congress to update three key pieces of legislation that greatly impact the future of work, workers and the workplace. Read Full Agenda Closing the Workforce Participation Gap U.S. businesses face a talent shortage worsened by demographic shifts and employment gaps. SHRM’s policy pillars offer Congress solutions to close these gaps and strengthen the workforce. Shaping the Future of Work SHRM advocates for policies addressing labor shortages, including immigration reform, paid leave, reskilling, and upskilling to support a competitive workforce. Modernizing Pivotal Workplace Policies SHRM is focused on advocacy efforts to modernize bedrock legislation affecting the world of work—Family and Medical Leave Act, Fair Labor Standards Act and Immigration and Nationality Act. Let's Get to Work At SHRM, we are focused on six key policy areas that have a meaningful impact on the workplace. Workforce Development Support effective workforce development strategies Learn More Workplace Inclusion Advance healthy workplace cultures and workplace inclusion Learn More Workplace Flexibility & Leave Enact modern paid leave and workplace flexibility solutions Learn More Workplace Health Care Strengthen and improve the employer-based health care system Learn More Workplace Immigration Build a modern immigration system that fuels economic growth and protects U.S. workers Learn More Workplace Governance Promote clear, balanced rules and guidance on governance issues Learn More Advocacy Spotlight Why Advocacy Matters Policy change does not happen without it. Every advance made in social, economic, labor, and human rights passed by Congress has been accomplished through the committed efforts of individuals organizing to push for that advance through their participation and persistence. Robert Hamer, SHRM-SCP Washington, D.C. Advocacy matters to me because progress is important to promote better health, engagement, productivity, and quality of life for our employees and for our society. If we had only ever relied on the status quo and the standards to which we have become accustomed, we would not have child labor protections, equal opportunitiy, minimum wage, safety standards, or any of the other protections that we have begun to take for granted. Rebecca Tipton Huntsville, AL It is important for our elected officials to hear from their constituents, and advocacy efforts help us have our voices heard on issues that are important to us. Most of the best ideas for legislation comes from constituent ideas and bringing these ideas to those in elected office often result in positive changes for all. Jeff Palkowski, SHRM-SCP Janesville, WI Nonpartisan advocacy and education of elected officials, staff members, and regulators is the most effective way to influence public policy relating to workplace issues. I regularly communicate with and visit elected officials, testify before state legislative committees, and write comment letters. Nancy McKeague, SHRM-SCP East Lansing, MI Previous Next Robert Hamer Rebecca Tipton Jeff Palkowski Nancy McKeague Contact the SHRM Government Affairs Team Phone: 703.535.6099 Email: governmentaffairs@shrm.org Social: @SHRM"
year_published = 2025
