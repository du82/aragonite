full_description = "Enterprise Solutions HR Team Events Teams Thrive at SHRM Events Invest in Group Attendance at SHRM Conferences As the leading authority on all things work, workers, and the workplace, SHRM is the industry standard for best-in-class professional conferences. Our events are designed to elevate and empower the people at the heart of your organization and the leaders at its head—and they’re even more impactful as a group. Revolutionize your business strategy with cutting-edge insights and access to innovation on essential topics. Conferences showcase the latest tools, technology and industry best practices.Harness the power of knowledge-sharing to discover solutions, streamline workflows and accelerate efficiency.Tap into new networks, building strategic connections that can lead to new opportunities and collaborations.Discover transformative experiences and thought leadership to drive better business decisions and create lasting workplace culture change, beyond each event. SHRM Annual Conference & Expo June 29 - July 2, 2025, San Diego Harness powerful resources and connections for your company at the largest convening of HR professionals in the world. Join leading experts from multiple industries to discover the latest and best ways to elevate your workplace culture and enhance your world of work. Learn More Attend as a Team The AI+HI Project April 09 - 10, 2025 San Francisco, CA Launching spring 2024. Witness the extraordinary fusion of artificial intelligence and human ingenuity. This cutting-edge experience is designed for groups of C-suite executives. Join us to help shape cutting-edge conversations—and shape the future. Learn More SHRM Talent 2025 March 24 - 26, 2025 Nashville, TN & Virtual Access the latest insights and proven methods to retain your top talent and attract the best candidates from a dynamic talent pool. Revolutionize your approach to talent management and cultivate meaningful connections for your company by sending a corporate delegation of talent acquisition pros and recruiting experts to attend together. Learn More CEO Academy Because nobody knows like other CEOs. The renowned CEO Academy, now a SHRM company, empowers CEOs thought leadership from some of the world’s most iconic brands and Ivy League professors from the Wharton School on the most relevant topics organizations are facing right now. Learn More INCLUSION 2025 October 26 - 29, 2025 Louisville, KY & Virtual Learn how to create better workplaces where all employees act with civility and feel they can belong and thrive, at the leading IE&D conference in America. Transform your workplace culture and cultivate meaningful connections by sending a group of IE&D trailblazers to INCLUSION 2025. Learn More Visionaries Summit September 25 - 27, 2025 Atlanta, GA This future-focused, Executive Network (EN) members-exclusive executive summit focuses on major challenges in the workplace, with proven approaches to address them. Join the EN for a complimentary registration to this event and the opportunity to convene with HR leaders on critical workplace issues. Learn More The Women in Leadership Institute September 27 - 30, 2025 San Diego, CA & Virtual Supercharge your leadership team and demonstrate your organization's commitment to gender equity at the highest levels by sending a cohort of women leaders to the experience of a lifetime. Learn More Inspire Your Team at SHRM Events Are you looking to drive enhanced business decision-making and foster lasting cultural changes in the workplace? SHRM events offer the latest industry insights, drawing the brightest minds in HR and business each year. Uplift and empower both the core of your organization—the dedicated individuals—and its guiding leaders through curated knowledge-sharing in unparalleled team experiences. Attend as a Team"
