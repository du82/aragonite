["https://shrm.org/credentials/certification/shrm-scp"]
title = "SHRM-SCP | Earn a Senior Certified Professional HR Certification"
description = "Advance your HR career with the SHRM-SCP certification. Gain the strategic skills and recognition you need to lead in HR. Explore eligibility, resources, and how to prepare for the exam."
full_description = "SHRM-SCP Senior Certified Professional Advance your career as an HR leader by earning a SHRM-SCP certification and begin transforming your workplace. Apply Now Prepare For the Exam SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Self-Study Instructor-Led Recertify Get Recertified Recertification Portal Qualifying PDC Activities How to Enter PDCs More Educators For Educators More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Organizations Certify My Team Recertification Providers Certified Directory Apply Now More Apply Now What Can A SHRM-SCP Do For Your Career? The SHRM Senior Certified Professional (SHRM-SCP) certification is for individuals whose work includes duties such as developing HR policies or procedures, overseeing the execution of integrated HR operations, directing an entire HR enterprise or leading the alignment of HR strategies to organizational goals. Eligibility Criteria A SHRM-SCP is for individuals with a work history of at least three years performing strategic level HR or HR-related duties; or for SHRM-CP holders who have held the credential for at least three years and are working in, or are in the process of transitioning to, a strategic-level role. You lead HR Operations. Your current or most recent work in HR is strategic in nature (i.e., drives culture, creates HR strategy, develops policy, etc.). Please review the eligibility critera for a complete list of requirements for earning a SHRM-SCP credential. Exam Composition The SHRM-SCP exam contains two types of multiple-choice questions: stand-alone knowledge-based items that assess your knowledge and understanding of factual information, and scenario-based situational judgment items that assess your judgment and decision-making skills. Approximately half of the items on each exam are allocated across the three behavioral competency clusters, and the other half are allocated across the three HR knowledge domains. For more information, please review the SHRM BASK™. Topic Areas Question Types Topic Areas There are also 24 field-test items that are used to gather data on a question's effectiveness and don't count as part of a candidate's score. Field test items are randomly mixed with scored exam items. Download Sample Questions Question Types There are also 24 field-test items that are used to gather data on a question's effectiveness and don't count as part of a candidate's score. Field test items are randomly mixed with scored exam items. Download Sample Questions Exam Format & Length Four hours in length (including 3 hours and 40 minutes of testing time).134 questions (80 knowledge items and 54 situational-judgment items, of which 24 are field-test items).Computer-based testing experience. You can take the SHRM-SCP exam in person at an authorized Prometric test center."
year_published = 2025
clearnet = "https://shrm.org/credentials/certification/shrm-scp"
