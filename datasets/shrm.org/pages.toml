["https://shrm.org/about/careers-at-shrm"]
title = "Careers at SHRM"
full_description = "Better Workplace, Better World If you have the enthusiasm and commitment to change the world of work, SHRM wants you! Find Your Dream Job Existing Employee? Apply Here About Us SHRM is a member-driven catalyst for creating better workplaces where people and businesses thrive together. As the trusted authority on all things work, SHRM is the foremost expert, researcher, advocate, and thought leader on issues and innovations impacting today’s evolving workplaces. With nearly 340,000 members in 180 countries, SHRM touches the lives of more than 362 million workers and their families globally. Guiding Principles We perform bold, purpose-driven work that positively impacts the lives of millions of workers and their families. We are passionate about what we do and live by our Guiding Principles: Bold Purpose We move forward with single-minded determination to change the world of work by focusing not just on incremental change but monumental impact. Excellence & Accountability We unequivocally demand absolute excellence even in failed ventures and trust we will not settle for anything less from ourselves, our peers, our partners, and our profession. Flexibility & Agility We are open to new ways of doing things, able to pivot and embrace change with zeal and ingenuity. Smart & Curious We are naturally inquisitive with a voracious appetite for learning and a boundless intellectual capacity for solving complicated problems. Collaborative Openness We are open-minded professionals first and foremost, recognizing teamwork is rooted in honest interactions and unparalleled transparency, all with civility and respect. Challenge. Decide. Commit. We respectfully challenge each other's ideas and points of view because it makes us a stronger and better organization. We confront without being confrontational. We want and expect individuals to advocate for their perspectives. Once the diverse voices are heard and explored, we can decide and commit, moving forward with collective determination. At SHRM, inclusion and diversity are fundamental to fulfilling our vision of building a better workplace and better world. From our hiring practices through the entire employee experience, we embrace and celebrate the unique experiences, perspectives and cultural backgrounds that each employee brings to the workplace. We encourage diverse points of view which allows us to develop innovative solutions to the ever-evolving world of work. SHRM strives to foster an environment where our employees feel respected, valued and empowered, and our team members are at the forefront of helping us promote and sustain an inclusive workplace that works for all. Join Our Winning Team Our Benefits Pay & Rewards SHRM knows that recognition for a job well done goes a long way, so we offer competitive salaries and employee recognition programs. Location & Transportation SHRM’s offices are conveniently located in historic Old Town Alexandria, VA just a few short blocks from the King Street Metro and 495 and just footsteps away from Whole Foods and over a dozen restaurants. Health Care SHRM offers coverage for medical, vision, dental and prescriptions, along with flexible spending accounts and a variety of insurance options. Transparency in Coverage Open Leave & Flexibility SHRM offers an open leave benefit that provides you with flexibility when you need it most, for re-energizing, family needs, illness, community and other needs to give our employees the balance to excel at their jobs. Professional Development & Training We offer educational assistance and professional development opportunities that will help foster your career and growth at our organization. Investments & Retirement SHRM helps our employees progress not only professionally but also financially. We offer a 401(k) plan, a pension plan and access to a credit union. Application Process Search Use our careers site to find a job that fits your experience. Apply Apply through our careers site and a recruiter will reach out. Interview Interview will take place either virtually or in person. Onboarding Become a part of the SHRM family."
