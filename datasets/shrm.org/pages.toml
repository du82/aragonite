["https://shrm.org/advocacy/executive-order-impact-zone"]
title = "Executive Order Impact Zone"
description = "Inclusion and diversity are essential for creating thriving workplaces and communities. These principles drive innovation, foster collaboration, and ensure every individual feels valued and empowered."
full_description = '''EO Impact Zone, A Guide for HR Leaders DEI Executive Orders Do not abandon, but evaluate and evolve. It is about legal, equal opportunity for all. Overview Together Our Commitment Federal Employee Impact News & Updates More Inclusion and diversity are essential for creating thriving workplaces and communities. These principles drive innovation, foster collaboration, and ensure every individual feels valued and empowered. With the recent Executive Orders (EOs) issued by President Trump, the landscape of DE&I is drastically shifting. As your trusted partner, SHRM is here to help you navigate these changes and ensure your workplace continues to promote opportunity, success, and compliance. These EOs represent a critical shift in workplace policies. While they call for the elimination of “illegal” and “discriminatory” programs, they also emphasize the importance of legal, inclusive practices that benefit all employees. The Current Landscape President Trump has taken decisive action consistent with his campaign platform, issuing two Executive Orders that directly impact DE&I: Private Sector: Ending Illegal Discrimination and Restoring Merit-Based Opportunity Government: Ending Radical and Wasteful Government DEI Programs and Preferencing Need guidance with the new Administration changes? Ask a SHRM Knowledge Advisor Together We Can: Lead the Transition HR is at the forefront of adapting to these changes. This shift aligns with the campaign commitment to reevaluate DE&I initiatives, and it’s now a reality. SHRM encourages HR leaders to remain proactive, ensuring workplaces evolve to meet these new requirements while continuing to foster inclusive environments. Focus on Legal Inclusion & Access The EOs emphasize compliance with legal requirements and highlight the importance of merit-based opportunities. Now is the time to review your DE&I programs to ensure they align with legal standards and focus on fostering inclusion across your workforce. This includes reexamining practices like goals, quotas, and set-asides to ensure they are both legal and equitable. Key Update: EO 11246, which required Affirmative Action programs for federal contractors, is now withdrawn. This follows the Supreme Court decision in 2023, which struck down similar requirements in higher education admissions. As you review your policies and transform your inclusion and culture efforts, engage with a SHRM Knowledge Advisor. Our Commitment to You SHRM is your partner through these changes and other forthcoming EOs, offering the resources, expertise, and advocacy you need to create a workplace that complies with the law while promoting opportunities for all. What does this mean for private sector employers and what do they need to do now? Examine Existing Programs to Ensure Compliance Organizations should avoid reactive measures that may result in rushed or incomplete policy changes. Instead, focus on proactive compliance strategies that align with the letter of the law while supporting a workplace culture of fairness, inclusion and respect. Inclusion and diversity (I&D) initiatives must be evaluated to ensure they provide equal access to opportunities, skills development, and merit-based advancement, avoiding any perception of identity-based favoritism. Training programs should be reviewed to determine whether they foster inclusivity through team collaboration, unconscious bias education, and leadership development without appearing to enforce quotas or preferential treatment. Clarify Title VII Interpretation The EO signals a shift toward a stricter interpretation of Title VII, emphasizing the prohibition of discrimination based on protected characteristics without considering the intent behind the practices. Employers should revisit hiring, promotion, and training programs to ensure they do not inadvertently use protected characteristics as the basis for preferential treatment. Legal teams and HR should collaborate to evaluate whether any practices could be perceived as non-compliant in light of the Administration’s recent orders and policy statements. Focus on DEI Programs Federal directives are now explicitly aimed at identifying and curbing DEI programs that could be interpreted as discriminatory or preferential. Companies should conduct internal audits of all EEO initiatives, including express equity and DEI initiatives to assess compliance and make adjustments where necessary, ensuring that all programs promote equal employment opportunity for all and merit-based practices. Such audits should be conducted under advice of counsel. Heighten Vigilance with Regulatory Agencies Agencies like the EEOC, DOL, and OFCCP are likely to adopt stricter scrutiny of I&D practices, which may result in increased audits or enforcement actions. Employers should prepare for potential inquiries by maintaining detailed documentation of employment practices, compliance efforts, and the rationale behind I&D initiatives. Leaders Lead CEOs and executive teams must proactively communicate organizational shifts to employees and stakeholders, emphasizing a commitment to both legal compliance and workplace equity and inclusion. Senior leaders should establish cross-functional task forces to oversee policy reviews, ensure alignment with the EO, and guide strategic decision-making. Initiate Comprehensive Policy and Training Reviews Review existing I&D policies, employee training modules, and workplace practices to identify any areas of potential conflict with the EO. Update training content to reflect the new compliance landscape, focusing on legal obligations and fostering inclusive behaviors within the bounds of the law. Engage in Long-Term Organizational Planning Reevaluate long-term goals for workforce I&D, ensuring alignment with the current legal environment while maintaining organizational values. Develop transparent metrics for tracking progress on I&D efforts without relying on identity-based benchmarks that could invite scrutiny. Impact of DEI EOs on Federal Employers All contractors providing services to advance DEI initiatives/programs are terminated.The Executive Order, Ending Illegal Discrimination and Restoring Merit-Based Opportunity, officially rescinded Executive Order 11246 (1965) – ending federal contractor affirmative action requirements.The Office of Federal Contract Compliance Programs' mission shifts from promoting diversity to enforcing against DEI programs deemed discriminatory.This means they can no longer promote “diversity,” hold contractors and subcontractors responsible for “affirmative action,” and they cannot allow for balancing on the basis of race, color, sex, sexual preference, religion or national origin.All new federal contracts and grants must include certifications that recipients do not operate DEI programs that violate federal anti-discrimination laws. Impact extends to all grant recipients – including healthcare, research institutions, and educational institutions receiving federal funds. News & Updates Latest News Judge Blocks Enforcement of DEI Orders as Applied to Companies A federal district judge in Maryland preliminarily blocked several challenged provisions of President Donald Trump’s executive orders (EOs) on diversity, equity, and inclusion (DEI), including enforcement of provisions applying to private companies. Read More What the DEI Executive Orders Mean for Employee Resource Groups Some employers are concerned about the legality of employee resource groups (ERGs) in light of the diversity, equity, and inclusion (DEI) executive orders passed last week by President Donald Trump. Read More Reassessing Inclusive Hiring: Access Over Identity in Talent Recruitment President Donald Trump’s executive orders DEI in the workplace have jump-started discussions about when inclusion and diversity (I&D) strategies are merely performative versus when they produce tangible results. Read More Redefining Merit: Steps to Build a More Inclusive Workforce College degrees from highly ranked universities, tenure at prestigious companies, work histories free from resume gaps—these have long been prized measures of evaluating job candidates. Read More EEOC Chair: Agency Must Rescind ‘Flawed’ Harassment Guidance The U.S. Equal Employment Opportunity Commission’s (EEOC’s) Acting Chair Andrea Lucas has said the agency’s “flawed” guidance on harassment due to gender identity should be rescinded. Read More OFCCP Stops All Enforcement Activity Under Rescinded EO 11246 In response to President Donald Trump revoking Executive Order 11246, acting U.S. Labor Secretary Vincent Micone issued an order Jan. 24 instructing Department of Labor (DOL) employees to stop all enforcement activity under the rescinded Executive Order 11246. Read More The CHRO Response to Trump’s Executive Orders on Diversity, AI, Hiring, and Remote Work As a wave of executive orders from President Donald Trump reshapes workplace policies, CHROs across the country are racing to adapt. Read More Navigating DEI Policy Shifts with SHRM’s BEAM Framework In a recent webinar, SHRM leadership addressed the potential implications of these executive orders for businesses, introducing the Belonging Enhanced by Access through Merit (BEAM) framework. Read More SHRM’s BEAM Framework for Inclusion: Aligning Merit with Organizational Excellence Explore how recent executive orders impact I&D initiatives and discover SHRM’s BEAM framework—a practical, merit-based approach to creating truly inclusive workplaces. Read More How to Adjust Your I&D Initiatives Under Trump’s New Guidelines Learn how the private sector can ensure policies align with anti-discrimination laws and support merit-based practices per the president’s executive order. Read More Trump Rescinds Affirmative Action by Contractors Based on Race, Gender President Donald Trump has rescinded the 60-year-old Executive Order 11246, which mandated affirmative action based on race and gender by federal contractors. Read More Redefining Inclusion and Diversity Post-Executive Order On January 21, 2025, President Donald Trump issued an executive order titled "Ending Illegal Discrimination and Restoring Merit-Based Opportunity," aimed at ending illegal diversity, equity, and inclusion (DEI) practices in federal contracting and encouraging private employers to do the same. Read More Navigating Affirmative Action Post-Executive Order President Donald Trump has rescinded Executive Order 11246, which required federal contractors to practice affirmative action based on race and gender. Read More New Webinars Navigating Title VII Compliance Amid Recent DEI Policy Changes Following President Trump's recent executive orders changing Diversity, Equity and Inclusion (DEI) initiatives, organizations face a complex and evolving compliance landscape. Watch Webinar Diving Deeper Into Affirmative Action and Federal Contractor Compliance: Key Insights & Critical Actions Recent changes in federal executive orders have created new compliance challenges and raised questions about the future of Affirmative Action (AA) requirements and obligations for federal contractors. Watch Webinar Gender & Inclusion: Navigating New DEI Executive Orders Continuing our series on the recent DEI EOs from President Trump we recognize that in addition to the DEI mandates, these EOs also recognize only two genders—male and female— therefore it's crucial to understand the implications for workplace inclusion and gender pay equity. Watch Webinar What to Expect from a Trump Administration and a Narrowly Divided Congress Join SHRM Government Affairs for an essential webinar on the key workplace issues anticipated in 2025. Leading experts will provide a comprehensive forecast of the workplace policy landscape at both the state and federal levels. Watch Webinar Navigating the Two DEI Executive Orders To navigate this evolving landscape, it's crucial to understand how to uphold merit-based practices while fostering a sense of belonging among all employees. Watch Webinar Resources and Peer Collaboration SHRM Connect - A 24/7 platform where you can collaborate with HR peers, share insights, and find practical solutions. Stay tuned for live webinars to be announced shortly.'''
