title = "Partner Products"
full_description = "Partner Products You have a lot on your plate. That is why SHRM has joined forces with industry leading partners to offer business solutions that enable agility, efficiency and optimization of all things work. Compensation & Benefits 401K Solutions SHRM 401(k) Solutions by Raymond James is built for small businesses to take some of the burden of retirement planning off your shoulders, giving you more time to run your business. Whether it’s time to upgrade your existing plan or you are looking to start a new plan, we can help. Learn More PEO Center of Excellence The PEO Center of Excellence aims to help streamline HR operations, reduce costs, ensure compliance, enhance employee benefits, and effectively manage risks, to enable you to concentrate on your core business objectives. Let the PEO Center of Excellence guide you in finding the ideal PEO for your needs! Learn More SHRM Compensation Data Center Whether you need a single, real-time HR-reported compensation data report, or a more robust solution for a salary equity study, salary.com can help. Learn More Compliance Leave Manager Make leave tracking easier while complying with the latest federal and state regulations. Now includes an employee self-service portal. Learn More HRIS Integration Harassment Prevention Training From classroom streaming to DVDs, our harassment prevention training meets and exceeds federal and state requirements. Learn More Labor Law Posters Take the guesswork out of state and federal labor law posting compliance with a labor law poster subscription. Each poster comes with an Update Service, for hassle-free, worry-free posting compliance. Learn More Safety Management Suite This online platform includes a suite of world-class workplace safety tools to meet increased safety standards and keep you compliant. Learn More SHRM Employee Handbook Builder Create a custom handbook and stay compliant. Get notified of state/federal changes with updated workplace policies for your employee handbook. Learn More Global Employment Law Guides Brightmine™ HR & Compliance Centre's authoritative and reliable HR and employment law guides help HR professionals with responsibilties for staff outside of the U.S. Learn More Culture and Engagement Employee Recognition and Rewards Nectar helps companies start peer-to-peer recognition centered on core values. Employees receive points from shoutouts, milestones, and challenges which they can then redeem in Nectar's robust rewards catalog. Learn More Employee Engagement Survey Shape a culture that supports job engagement and performance. Learn More Workplace Mental Health Ally Certificate SHRM and Psych Hub's Workplace Mental Health Ally Certificate equips HR Professionals and people managers to understand critical mental health topics and identify appropriate approaches to help. Learn More Internal Communication Solutions Nectar's internal comms platform is an easy drag-n-drop builder that allows HR professionals a simple solution to create, schedule, send, and analyze company communications to employees. Learn More Organizational Development DEI Training This foundational DEI training is relevant for employees at all levels of your organization. This online training is perfect for physical, hybrid and remote work environments. Courses are delivered on our industry-leading Learning Management System or via SCORM to your LMS. Learn More Survey Elite Save time, get actionable insights with preprogrammed HR surveys. Powered by Metolius Learn More Talent Acquisition Interview Guide Builder The Interview Guide Builder can improve your hiring decisions and ensure that you are conducting equitable and lawful interviews. Learn More SHRM HireVets Veterans possess highly desired skills, training, core values, and dedication which translate to passionate and successful employees! Post your job and hire your next superstar. Learn More Talent Management SHRM Job Description Manager Accurate job descriptions are imperative to all stages of the employee lifecycle. Our platform allows you to create, edit, export, approve, and maintain all your job descriptions online. Learn More Open Position? SHRM HR Jobs Can Help Post your HR position on SHRM HR Jobs to reach thousands of experienced and entry-level candidates as well as recruit recent HR grads. Post Your Job Search Jobs"
