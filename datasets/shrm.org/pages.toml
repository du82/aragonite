["https://shrm.org/about/bio/betty-thompson"]
title = "Betty Thompson"
full_description = "Betty Thompson, SHRM-SCP Chair, SHRM Board of Directors Betty Thompson, SHRM-SCP, is a true pioneer in human capital strategy. Her forward-leaning insights for attracting and retaining a global workforce—including how to accelerate inclusion and diversity, and propel enterprise wellness—have inspired audiences around the world. Book Betty to Speak Betty Thompson is the Chair of SHRM’s Board of Directors. Betty joined the SHRM Board in 2019 and was named Chair in 2023. Betty has decades of human resources, executive leadership and board experience. Betty served as Executive Vice President and Chief People Officer for Booz Allen Hamilton (NYE:BAH) from 2008 to 2024. She led a complete reimagining of the firm’s employee value proposition and executive talent management processes, as well as the reshaping of recruitment, retention, and development programs. Under Betty’s leadership, the workforce was transformed to be a leading provider of advanced technology solutions with highly skilled, innovative and diverse talent. Booz Allen received numerous awards and recognitions for its workplace, culture, employer brand, diversity and more, including Forbes’ Best Employers for Women and Best Employers for Diversity, Fast Company’s Best Workplaces for Innovators, CAREERS & the disABLED Magazine’s Private Sector Employer of the Year, and Ethisphere’s World’s Most Ethical Companies. Betty continues to serve as a Senior Executive Advisor. Prior corporate experience includes VP, Human Resources at Fannie Mae (1993 – 2008) and several senior Human Resource positions at IBM. Betty is a native Washingtonian and lives in Vienna, Virginia with her husband. Betty has four adult children and two grandsons. MS, Human Resources Management, American University SHRM-SCP NACD Certified BAH AI Aware Certified SIGNATURE KEYNOTE No Paper Required: How HR Can Drive Skills-Based Hiring and Equitable Pathways to Work In a world facing talent shortages, rapid tech advancement, and evolving employee expectations, moving beyond degree-based qualifications and breaking the “paper ceiling” can open new doors to a diverse pool of skilled talent. Betty Thompson, Chair, SHRM Board of Directors and former Chief People Officer, Booz Allen Hamilton, explores how breaking down traditional hiring barriers can invigorate workforces and transform organizations. Hear how HR can champion hiring practices that emphasize potential over perfection, creating equitable lanes to success for qualified candidates from all backgrounds. Drawing from SHRM research and the SHRM Foundation’s “Widening Pathways to Work” initiatives, Thompson will share the importance of removing barriers and developing strategies that enable HR leaders to embrace inclusive hiring strategies, access untapped pools of talent, and activate a skills-first mindset for recruitment and retention that align with the future of work. Explore Other Keynote Topics Leading with Belonging: Building a Future-Ready Workforce Through Inclusion and Diversity Social change is unfolding rapidly, forcing organizations to navigate the shifting demographics and growing incivility in the workplace. Fostering a culture where everyone feels they belong has never been more critical to an organization’s growth, resilience—and even survival. Betty Thompson, Chair, SHRM Board of Directors, will dive into the real-world trends that are refining, and increasingly redefining, inclusion and diversity in our workplaces. Learn practical strategies for creating workplaces where people of all backgrounds and beliefs can truly feel included, opening broad avenues to more diverse and equitable workplaces. Thompson will tackle the problem of incivility with practical solutions and highlight common roadblocks that hamper inclusion. Drawing from SHRM’s latest data and her hands-on experience as the former Chief People Officer at Booz Allen Hamilton, Thompson’s insights will equip leaders with strategies they can use today to shape inclusive, future-ready workplaces that mirror our diverse world. Mind Power: How Commitment to Workplace Mental Wellness Leads to Thriving Businesses Betty Thompson, Chair, SHRM Board of Directors and former Chief People Officer, Booz Allen Hamilton, maps out critical pathways to prioritizing mental health and wellness in the workplace, framing it as both an ethical obligation and a business imperative. With years of C-suite HR leadership, and as architect of Booz Allen’s people policies, Thompson shares practical insights into fostering a supportive culture that considers mental well-being a core component of employee and organizational success. Thompson underscores the need for managers to act as mental health allies, highlighting the SHRM Foundation's resources, such as the Workplace Mental Health Ally Certificate, to equip leaders for this responsibility. She also touches on the concept of the workplace as a cultural “Third Place”—a unique setting where employees find purpose, connection, and a refuge from the isolation many have experienced in recent years. The call to action for HR leaders is clear: lead with empathy, advocate for open dialogue, and establish mental health as a core pillar of organizational culture. Book a SHRM Executive to Speak"
year_published = 2025
clearnet = "https://shrm.org/about/bio/betty-thompson"
