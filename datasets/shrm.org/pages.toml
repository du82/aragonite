["http://www.shrm.org/about"]
title = "About SHRM | Building a World of Work that Works for All"
description = "SHRM is the foremost expert, convener and thought leader on issues impacting today's evolving workplace."
full_description = "About SHRM Our Purpose Is to Elevate HR Our mission is to empower people and workplaces by advancing HR practices and by maximizing human potential. Our vision is to build a world of work that works for all. SHRM creates better workplaces where employers and employees thrive together. SHRM is a member-driven catalyst for creating better workplaces where people and businesses thrive together. As the trusted authority on all things work, SHRM is the foremost expert, researcher, advocate, and thought leader on issues and innovations impacting today’s evolving workplaces. With nearly 340,000 members in 180 countries, SHRM touches the lives of more than 362 million workers and their families globally. Key Dates in SHRM History SHRM stands for the Society for Human Resource Management, which traces its origin back to the founding of the American Society for Personnel Administration (ASPA) on Nov. 21, 1948. 1949: The first annual conference is held in Cleveland with 67 attendees.1953: The first chapter is established in Metropolitan New York.1964: Headquarters are established in Berea, Ohio.1973: ASPA gives its first testimony before Congress.1976: The first credentialed member is recognized through the ASPA Accreditation Institute.1984: The board votes to move to the Washington, D.C., area, citing the need to “create a national presence” and to “have more consistent engagement” on workplace public policy.1989: The ASPA is renamed the Society for Human Resource Management (SHRM).2023: SHRM celebrates its 75th anniversary as the trusted authority on all things work. ul.dates-list{ list-style:none; margin:0 0 10px 0; padding:0; } .dates-list li{ margin:0 0 6px 10px; padding:0; } .rounded-4 { border:1px solid #eded; border-radius: 15px; background:white; padding:30px; margin:5px; } Are You a Catalyst for Civility? .civility-stats .cmp-title__text{color: #FF8900;} .civility-banner { background: #020937; margin-left:-4px; margin-right:-4px; } We know people and businesses work best when we choose civility. At SHRM we’re working to put the latest research and tools in the hands of business leaders, HR professionals, and workers to build a more civil and productive workplace. Together, we can encourage inclusivity, bridge divides and build understanding, one conversation at a time. Learn More Press Room Contact Us Read 2023 Annual Report Work at SHRM Apply Today Partner with SHRM Learn More Board of Directors & Senior Leadership Learn More Financial Transparency SHRM is a mission-driven organization that makes available for public inspection its annual information return via Form 990. Here we provide the organization’s finances and activities, including grants, fundraising fees, program service revenue, and employee salaries as required by the IRS filings. 2023 SHRM 9902022 SHRM 9902022 SHRM Foundation 9902021 SHRM 9902020 SHRM 9902019 SHRM 990 Annual Impact Report In our 2023 annual report, we highlight the impactful outcomes of our collaborative efforts with members, business leaders, and policy makers in shaping the world of work. Through empowering our members with resources and networking opportunities, collaborating closely with industry leaders to champion best practices, and influencing policy makers to enact modern workplace policies, we've driven tangible change. Additionally, our proprietary research provides valuable data-driven insights that enable professionals and organizations to make informed decisions about talent management, workforce development, and organizational strategy. Take a look inside for more! 2023 Annual Impact Report2022 Annual Impact Report"
year_published = 2023
year_updated = 2025
