full_description = "SHRM Assumes Leadership of CEO Action for Inclusion & Diversity As of October 1, 2024, SHRM has assumed ownership of CEO Action for Inclusion & Diversity, the largest business-led coalition of CEOs. Combining industry-leading research, with a focus on actionable, evidence-based strategies, SHRM will partner with CEOs to drive meaningful change across the world of work, further expanding the coalition’s impact. Stay tuned for more on CEO Action and SHRM’s plans for growth and expansion. .v-align > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid, .equal-heights > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid { display: flex; flex-wrap: wrap; } .v-align .layout-container__wrapper, .v-align .cmp-container, .v-align .layout-container__inner, .v-align .aem-Grid{ height:100%; align-items:center; } .v-align .layout-container__wrapper { background-position: center; } .equal-heights .container > .layout-container__wrapper, .equal-heights .container > .layout-container__wrapper > .cmp-container, .equal-heights .container > .layout-container__wrapper > .cmp-container > .layout-container__inner{ height:100%; } .button.d-inline { display: inline-block; width: unset !important; margin: 0 15px 15px 0; float:unset !important; } .btn-group > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid{ display:block; text-align:center; } @media only screen and (max-width:768px){ .button.d-inline { display: block; width: 100% !important; margin: 0 0 15px 0; }} About CEO Action for Inclusion & Diversity CEO Action for Inclusion & Diversity is the largest business-led coalition dedicated to fostering inclusive workplaces that drive innovation and business success. By joining CEO Action, CEOs gain access to unique tools, resources, and experts equipped to help them build inclusive environments while achieving business outcomes. Leading with inclusion means empowering every employee to contribute their best and unlocking the full potential of diverse talent. Learn More Resources CEO Action Leadership Press ReleaseSHRM’s I&D PlaybookSHRM’s I&D Content HubWhy I&D Are Crucial for Business Success Connect Follow us on Twitter (X)Email us To build a culture of inclusion, change must start at the top. CEO Action works with CEOs to deliver data-driven solutions that empower organizations to create lasting diversity and inclusion. Anuradha Hebbar President, CEO Action for Inclusion & Diversity Mission Statement At CEO Action for Inclusion & Diversity, our mission is to empower CEOs to foster inclusive workplaces where every employee can thrive. We are dedicated to equipping business leaders with the tools, resources, and insights needed to create cultures of belonging, harness diverse perspectives, and drive business success through innovation. By leading with inclusion, we aim to make lasting, transformative changes across industries. Vision Statement Our vision is a world where inclusive workplaces are the foundation of business excellence. We strive to create a future where organizations not only embrace diversity, but actively cultivate environments that empower all employees to contribute their best. Through our coalition of forward-thinking CEOs, we are shaping workplaces that are resilient, innovative, and ready to meet the challenges of tomorrow. Get Involved Are you ready to lead the way in fostering inclusion and diversity in your organization? Join the largest business-led coalition dedicated to driving real change in the workplace. Fill out our intake form to learn how your company can become part of CEO Action for Inclusion & Diversity. Learn More Meet the CEO Action Team Anuradha Hebbar President Ashley Miller Director of Operations Madison Lazas Communications and Marketing Manager Chris Loscar Senior Specialist, Operations .circle-img { border-radius:50%; width:80px; height:auto; } jQuery(document).ready(function($){ $('.adjust-background').closest('.layout-container__wrapper').css({'background-size': '100%', 'background-color' : '#034332'});"
