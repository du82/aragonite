full_description = "If it’s a competitive advantage thing, it’s a SHRM thing. The business landscape is constantly evolving. You must navigate change. Step into SHRM CEO Circle to gain insights and strategies tailored to your unique team challenges, culture, and goals, driving impactful change. Let’s unlock your organization’s full potential—together. Where CEOs Drive Real Change SHRM CEO Circle is a launchpad for CEOs at every stage to navigate the evolving business landscape with confidence and agility. From access to a global network of visionary changemakers to intimate and exclusive tailored experiences, CEO Circle thrives on innovation, collaboration, and empowerment. #bg-circle { background-image: unset; background: url(/content/dam/en/shrm/ceo-circle/bg-banner-ceo-circle-light-dark.jpg) no-repeat center top #0d133d !important; background-size: contain !important; } .dam-video { border-radius: 8px !important; overflow:hidden; -webkit-box-shadow: 4px 4px 8px 0 rgba(0,0,0,.25); box-shadow: 4px 4px 8px 0 rgba(0,0,0,.25); } SHRM CEO Circle currently has two offerings designed for your unique business and team: .icon-large { padding: 15px; display:flex; align-items:center; border-radius: 8px; background: rgba(255, 255, 255, .95); margin: 0 0 30px 0; min-height:225px; } .icon-large .cmp-image{ max-width:unset !important; } CEO Action for Inclusion & Diversity CEO Action for Inclusion & Diversity is the largest business-led coalition advancing I&D in the workplace. Gain unparalleled access to cutting-edge resources, real-time insights from experienced leaders, and an opportunity to connect with 2,500 CEOs around the world taking action now. Learn More CEO Academy CEO Academy is an invite-only experience built for today’s CEOs addressing tomorrow’s workplace issues. Engage and connect with a trusted network of chief executive peers looking together toward the future of business. Leave with a strategy to chart your organization’s path forward. Learn More .v-align > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid, .equal-heights > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid { display: flex; flex-wrap: wrap; } .v-align .layout-container__wrapper, .v-align .cmp-container, .v-align .layout-container__inner, .v-align .aem-Grid{ height:100%; align-items:center; } .v-align .layout-container__wrapper { background-position: center; } .equal-heights .container > .layout-container__wrapper, .equal-heights .container > .layout-container__wrapper > .cmp-container, .equal-heights .container > .layout-container__wrapper > .cmp-container > .layout-container__inner{ height:100%; } .button.d-inline { display: inline-block; width: unset !important; margin: 0 15px 15px 0; float:unset !important; } .btn-group > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid{ display:block; text-align:center; } @media only screen and (max-width:768px){ .button.d-inline { display: block; width: 100% !important; margin: 0 0 15px 0; }}"
