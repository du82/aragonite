["https://shrm.org/credentials/certification/certification-faqs"]
title = "Certification FAQs"
full_description = '''Frequently Asked Questions Exam & Eligibility Payments & Refunds Certification Portal More Recertification Digital Badging SHRM BASK Other Questions Recertification Digital Badging SHRM BASK Other Questions More Home Home Certification Certification FAQs Exam & Eligibility How do I determine if I am eligible for the exam? View the eligibility requirements. Contact us if you have additional questions. A job description(s) may be requested in order for us to determine your eligibility. Do I need to become eligible by the time I take the exam or do I need to be eligible when I apply? Eligibility requirements to sit for either of the SHRM exams must be met at the time you apply for the exam. How do I apply for the exam? You may apply for the exams when the application period is open.Visit https://store.shrm.org/certification-application. After completing the application process, create a user account, or login if you already have a profile. Enter your name as it appears on your unexpired original government-issued ID. (Name on ID must be represented in Latin characters). When applying, I received a message stating that I am not eligible for the exam, but I feel as if I am. How can I proceed? View the eligibility requirements to ensure you do meet the requirements. If you know you are typing valid eligibility data and you are still getting the error, please try the following: Log out of your certification profile.Clear your cookies and temporary internet files in your web browser.Log back into your certification profile.Try the application again. If the error message persists, you will need to contact us for further assistance. How do I schedule my exam appointment? The SHRM exams are administered via computer-based testing by SHRM’s test delivery vendor, Prometric, at one of their testing centers. Once your application is complete, you will receive an Authorization to Test (ATT) letter via e-mail. This letter will include your Eligibility ID that you will need when you contact Prometric to schedule your exam appointment. Go to prometric.com/shrm or call 888.736.0134 to schedule your exam appointment. I never received my Authorization to Test Letter. How do I receive it? In order to receive an ATT letter, you must have:: Submitted a completed exam application with payment.If audited, completed, and passed the audit verification process.If special testing accommodations were requested, submit a completed Testing Accommodations Request Form and had it approved by the SHRM Certification Department. If you have completed all of the applicable requirements, you should be able to access your ATT letter by going to your certification portal and clicking on the link located under the"Submitted Certification Applications" section. If you do not see the link, please contact us. I have my SHRM-CP and now I want to sit for the SHRM-SCP exam. How do I apply? If you are currently eligible to sit for the SHRM-SCP exam, you may apply for the SHRM-SCP exam when the application period is open. Visit https://store.shrm.org/certification-application. and complete an application for the SHRM-SCP exam. Can I take both exams in the same testing window? Yes, you may take both exams within the same testing window as long as you are eligible for and pay for both exams. In order to apply, complete your first exam application https://store.shrm.org/certification-application. To apply for the second exam, please contact us at certification@shrm.org for assistance. Please be aware that should you pass the SHRM-SCP and decide not to take the SHRM-CP exam you will be bound by the cancellation/refund policy outlined in the Certification Handbook. How do I change my exam appointment? Exam appointments may be changed as long as you are keeping your appointment within the same exam window and do so five or more business days before your scheduled exam appointment. If a candidate cancels more than 30 days prior to their exam appointment, a $35.00 cancellation fee will be charged by Prometric.If you are between five and 29 business days before your scheduled exam date, you may reschedule your exam appointment, but there will be a fee due to Prometric.If you are less than five business days before your scheduled exam date, you may not reschedule and will forfeit your fees. All exam appointment changes must be done directly through Prometric: Within the U.S.: prometric.com/shrm or 888.736.0134Outside the U.S.: prometric.com/shrm or call the local Prometric Regional Contact Center found in Appendix C in the Certification HandbookIf you requested special testing accommodations: 800.967.1139 Can I change my exam level? A candidate may request an exam level change once during an exam window. If an exam appointment has already been scheduled, it must first be canceled with Prometric. Once the exam appointment has been canceled, an exam level change request must be submitted at least 10 business days before the scheduled exam date. Because an exam level change cancels the originally scheduled exam appointment, a candidate is required to schedule a new exam appointment. If the exam window has already opened, the same time and location for the new exam appointment is not guaranteed. To request an exam level change, e-mail certification@shrm.org, specifying which exam you wish to take. Candidates requesting to change from SHRM-CP to SHRM-SCP must provide applicable work experience to ensure the eligibility requirements for the SHRM-SCP are met. If those requirements are met, SHRM will verify the exam level change request with a new ATT letter. Beginning with 2025 exams, there is a price difference between CP and SCP exams. If requesting an exam level change of CP to SCP, you will be required to pay the difference between the two exams. If you are requesting an exam level change of SCP to CP, you will receive a refund of the difference between the two exams. Membership status at the time of initial exam application applies. How long are the exams? How many questions? Both exams will contain Knowledge- and Competency-based questions: Candidates for the SHRM-CP and SHRM-SCP exams will have 4 hours to answer a total of 134 questions, of which approximately 55 are stand-alone knowledge items and 55 will be situational judgment items. Breakdown of Testing-Time: Candidate Confirmation Details: 2 minutes Introduction and Tutorial: 8 minutes Exam: 4 hours (240 minutes) Note: The entire seat time is 240 minutes. However, the exam itself is 220 minutes long administered in two equal halves of 110 minutes. Survey: 5 minutes Each section shows a countdown timer on the screen, and each section is separate and time-independent. Minutes do not roll over. For instance, if a candidate spends less time in the introduction, extra minutes are not rolled over to the exam portion. What is the format of the SHRM exam? We have enhanced the exam layout to improve navigation throughout the exam. We recommend you become familiar with the new layout prior to your exam date. A tutorial is now available to preview the navigation functions including the highlight feature, the strike out feature, the calculator, and marking questions for review. Click here to access the tutorial. On the first page of the tutorial simply click on OK to begin the tutorial. What are Situational Judgment Items? Situational judgment items (SJIs) assess candidates’ judgment and decision-making skills, which are not easily measured using traditional knowledge-based questions. Examinees are presented with realistic work-related scenarios and asked to choose the best of several possible strategies to resolve or address the issues described in each scenario. Although more than one strategy may be effective for addressing actual work-related scenarios, examinees only receive credit for choosing the best possible answer, as determined by a panel of experienced HR professionals. All other answers, which reflect either less effective or ineffective strategies, receive no credit. What is a Knowledge Item? There are two categories of stand-alone knowledge-based items on the SHRM-CP and SHRM-SCP exams. Items in the first category, referred to as HR-specific knowledge Items (KIs), cover key concept topics associated with the 14HR functional areas, while items in the second category, referred to as foundational knowledge items (FKIs), cover key concept topics considered foundational to the nine behavioral competencies. Examinees receive credit for selecting the correct answer to a given question; otherwise, no credit is awarded. What do I need to provide if my exam application is selected for audit? Experience documentation to verify years of experience and the specific HR role(s) included on your application: Resume, Letter from a supervisor, HR, or business owner (on company letterhead)Resume to include years of experience as well as responsibilities in HR role(s)Must verify 1,000 hours in a calendar year in an HR roleSatisfies years of experience as well as HR role Upload the supporting documentation to the Certification Portal. How can I request special testing accommodations? If you require testing accommodations, complete and submit Sections I, II, and IV of the Testing and Certification Accommodations Request Form at the time of application submission. Upon approval, SHRM will provide reasonable and appropriate accommodations related to the testing process. Payments & Refunds How do I pay for the exam by check/ACH/wire transfer? If you wish to pay for your SHRM Certification Exam through Check, ACH, or Wire Transfer, please submit your application here. Should you have any questions or concerns about this process, please contact us via email. How do I get an invoice for my exam application? If you wish to be invoiced, please submit your application here. Allow 8-10 business days for processing. Should you have any questions or concerns about this process, please contact us via email. How can I transfer my exam to the next window? Candidates may request a transfer to the next testing window one-time per exam application for a fee of $150.00 under the following circumstances: Candidates with an exam appointment must submit their request no later than 5 business days before their scheduled appointment. The exam appointment must be canceled before the transfer request can be processed. A cancellation fee of $35.00 (more than 30 days prior to an exam appointment) or $53.00 (less than 30 days prior to an exam appointment), payable to Prometric, may also apply.Candidates without an exam appointment may request a transfer up to the first day of the current testing window. Candidates who receive a transfer but who are unable to test during their new appointment will forfeit all fees, except in the case of a medical or personal emergency. Under these circumstances, supporting documentation must be provided. What do I need to do to cancel my exam? To cancel an exam appointment, visit prometric.com/shrm or call Prometric, SHRM’s test delivery vendor at 888.736.0134. International candidates, refer to the Certification Handbook and see Appendix C: Regional Testing Contact Centers for the correct phone number. To cancel an exam appointment based on a request for testing accommodations, call 800.967.1139. If a candidate cancels more than 30 days prior to their exam appointment, a $35.00 cancellation fee will be charged by Prometric. If a candidate cancels less than 30 days but no later than five days prior to an exam appointment, a $53.00 cancellation fee will be charged by Prometric. What is the refund policy? All SHRM Certification fees are nonrefundable. In the case of a medical or personal emergency please contact shrmcertification@shrm.org for more information. What if I have an emergency and need to cancel? For purposes of the SHRM certification program, medical or personal emergencies are defined as unplanned events affecting the candidate or immediate family member(s) (spouse, child, or parent), which arise within five days of the scheduled exam appointment and prevent the candidate from taking the exam, or from rescheduling or canceling an exam appointment. An event that can be anticipated is not considered a medical or personal emergency. A candidate’s inability to take the exam due to work commitments or insufficient or inappropriate preparation is not considered a personal emergency. Candidates who experience medical or personal emergencies within five days prior to a scheduled exam appointment may transfer or request a refund (See the Exam Transfer or Refund section). All requests must include supporting documentation as to the nature of the medical or personal emergency. Requests will be reviewed on a case-by-case basis. A refund request must be submitted to SHRM via e-mail to certificationpayment@shrm.org no later than 30 days after closure of the exam window and must include supporting documentation as to the nature of the medical or personal emergency. Requests will be reviewed on a case-by-case basis. In order for SHRM to process the appropriate refund based on our policy, the Cancellation/Refund Form. must be submitted. I applied for the exam as a nonmember, but I am a member. How do I get the member pricing? In order to receive member pricing, a candidate must be a SHRM Member® at the time of application. If you were a member at the time of application, but are not seeing the member pricing, please contact us so we may adjust your account to reflect your SHRM membership. You will then be able to reapply to receive the member pricing. How do I receive a receipt for my exam application? When you submit payment, you will receive a receipt via e-mail. If this does not occur, or you are interested in receiving a copy of the digital receipt, please get in touch with our Customer Experience department via email. Certification Portal I don't know my password. How do I login? Please reset your password here. Key in your e-mail and click “Send Instructions”. You will receive an e-mail that contains a link to reset your password. You may then access the SHRM Certification Portal. I am locked out of my account. What do I do? If you have received the message "This account is currently locked, please contact SHRM for assistance." Please contact us for assistance in unlocking your account. Can I change my password? Please go to MySHRM and select "Change Password". Follow the prompts to change your password. I can't login to the SHRM Certification Portal. Please reset your password. If you cannot do so, please contact support. I log into shrm.org with a different e-mail address than I do for my SHRM Certification Portal, what do I do? Please login using your shrm.org information, we have merged our records and you’ll only need one login for both your SHRM membership and certification accounts. I have never logged into shrm.org. I only login to the SHRM Certification Portal, what do I do? Please login using the e-mail address and passwo'''
year_published = 2025
