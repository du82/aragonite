["https://shrm.org/about/bio/scott-snell"]
title = "Scott Snell"
description = "Professor Scott Snell is the Frank Sands, Sr. Chair in Business Administration."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Scott Snell Sr. Chair in Business Administration and former Senior Associate Dean for Executive Education at Darden School of Business at University of Virginia Connect Professor Scott Snell is the Frank Sands, Sr. Chair in Business Administration and former Senior Associate Dean for Executive Education at the University of Virginia's Darden Graduate School of Business. He teaches courses in strategic management and works internationally with senior executives to help their companies align strategy, organizational capability, and investments in talent. His research has been published in a number of top journals, and he is an author of several books, notably Strategic Execution: Driving Breakthrough Performance in Business (Stanford Press, 2019), Management: Leading and Collaborating in a Competitive World (McGraw-Hill, 2016), and Managing Human Resources (Cengage, 2018). He currently serves on the board of the Society for Human Resource Management (SHRM), and has served on the boards of the Strategic Management Society's Human Capital Group, the SHRM Foundation, the Academy of Management's HR Division, the Academy of Management Journal and the Academy of Management Review. Prior to joining the Darden faculty, Scott was Professor and Director of Executive Education at Cornell University's Center for Advanced Human Resource Studies and a Professor of Management in the Smeal College of Business at Pennsylvania State University. He received his B.A. from Miami University, as well as his M.B.A. and Ph.D. in business from Michigan State University.'''
