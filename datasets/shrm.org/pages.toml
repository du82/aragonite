["https://shrm.org/about/bio/emily-dickens"]
title = "Emily M. Dickens, J.D."
description = "Emily M. Dickens, J.D. Corporate Secretary and Chief of Staff"
full_description = "Emily M. Dickens, J.D. Chief of Staff, Head of Government Affairs and Corporate Secretary for SHRM Emily M. Dickens is Chief of Staff, Head of Government Affairs, and Corporate Secretary for SHRM. An executive team member, Dickens is responsible for implementing the CEO's vision, corporate communications, corporate governance, global policy, government affairs, and the organization's real property. Book Emily to Speak As a member of the executive team for the world’s largest human resources trade association, and 4th largest trade association in the world, Emily M. Dickens leads SHRM’s efforts across multiple critical areas of strategic and operational importance. In addition to guiding SHRM’s advocacy and policy initiatives, she oversees government affairs, global policy, legal affairs, and the SHRM Foundation — the 501(c)(3) philanthropic arm of SHRM. Dickens plays a pivotal role in aligning these functions to advance SHRM’s mission of creating better workplaces for a better world while driving organizational effectiveness and impact. Through her leadership of SHRM’s Advocacy Team — the “A-Team” — comprising nearly 30,000 active HR professionals across the United States, Dickens ensures the HR profession remains at the forefront of advancing workplace policy. A sought-after expert on workplace issues and business leadership, her insights have been featured in CBS News, NBC News, AP News, The Wall Street Journal, CNBC, Bloomberg Law, Crain's Business, Marketplace, WTOP, Yahoo Finance, HR Brew, and HR Dive. She has also testified before Congress and the EEOC on AI, gender bias, and paid leave. Dickens represents SHRM on the boards of several influential organizations to amplify SHRM’s voice in global, national, and local business and labor policy discussions. These include the B20 Brazil Women in Business Action Council (Co-Chair); USCIB-United States Council for International Business (Governance Committee); The Bryce Harlow Foundation; Skill-Up; and the National Foundation for Women Legislators. Before joining SHRM, Dickens was a passionate advocate for access to higher education, serving in leadership roles such as General Counsel and Head of Policy for the Thurgood Marshall College Fund, Vice President of Public Policy for the Association of Governing Boards for Colleges and Universities, and Assistant Vice President for Federal Affairs at the University of North Carolina System. She has also held key administrative and external affairs roles at Duke University and Fayetteville State University. Drawing on her extensive higher education experience, Dickens continues to champion the education-to-employment pipeline as a solution to future workforce challenges. Beyond her professional achievements, Dickens is actively engaged in board service. She is the Chair of the North Carolina Central University Board of Trustees and Co-Chair of the HR Committee for the NCNW Board of Directors. A life member of Alpha Kappa Alpha Sorority, Incorporated, she has served as Chairman of the International HBCU Task Force and on the sorority’s Education Advancement Foundation Board of Directors (AKAEAF). Dickens is a proud graduate of North Carolina Central University and its School of Law. SIGNATURE KEYNOTE School House Rock: Civics, Policy, and Compliance for HR Professionals Delve into the essential role of civics education in understanding and navigating the complex landscape of workplace policy and compliance. Emily M. Dickens, Chief of Staff, Head of Government Affairs, and Corporate Secretary for SHRM, underscores the importance of HR professionals being well-versed in governmental processes and legislative frameworks to effectively advocate for their organizations and employees. She provides a comprehensive overview of how civic knowledge can empower HR leaders to engage with policymakers, influence legislation, and ensure their companies are compliant with ever-evolving laws and regulations. Attendees will gain practical insights into aligning organizational policies with legal requirements and fostering a culture of compliance. Emily shares strategies for staying updated on legislative changes and best practices for implementing policies that reflect both legal mandates and organizational values. This session aims to equip HR professionals with the knowledge and tools needed to navigate the intersection of civics, policy, and compliance, ultimately enhancing their ability to lead and advocate within their organizations. Explore Other Keynote Topics Workplaces That Work For All: Understanding Policy, Advocacy, and Inclusion As we navigate the complex landscape of contemporary workplaces, it’s critical to understand the instrumental role that policy and advocacy play in shaping effective and sustainable work environments. Drawing connections between legislative developments on the Hill and their direct implications for your boardroom and beyond, this talk demystifies the often opaque realm of policy-making, offering practical insights into how you can align your organizational strategies with evolving societal frameworks. Learn from and be inspired by compelling personal stories underscoring the transformative impact of creating opportunities out of unforeseen circumstances—and highlight why fostering diversity and promoting equity are strategic imperatives driving organizational effectiveness. This narrative sets the stage for a broader exploration of how inclusion can be cultivated among employees, leading to a thriving workplace culture that works for all. Civility Starts at Work: Nurturing Civility in the Workplace to Inspire a More Civil World As long as we have a heartbeat, polarizing topics will continue to exist both inside and outside of the workplace, leading to pain and division among colleagues, leadership, and even customers. The question is not if we deal with conflict but how we, as people and as organizations, will handle it when we inevitably do. The problem is that no one has led the discussion about how to guide today’s workforce to remain civil when discussing polarizing topics… until now. With extensive experience in navigating organization-wide conflict and influence over 362 million workers worldwide, SHRM’s Executive Voices are uniquely positioned to help all of us nurture civility in the workplace. No stranger to the ups and downs of a divided workplace, through Civility Starts at Work, SHRM executives explore the impact of civility on work culture and provide an outline for equipping employees to have candid, civil dialogue while supporting the mental health of all employees. Walk away with a strategic roadmap for facing the storm of conflict, gain insight on just how to measure and quantify people and strategy, and put your audience on a path to inspiring a more civil world. Untapped Talent: Leveraging a Global Workforce In an era where the digital economy has given rise to new measures of global expansion, many companies find themselves unprepared to harness the wealth of talent at their fingertips. When we open up our organizations to a world of candidates—literally—we often lack the research and training needed to bridge international differences and build connections across the globe. Through the message of Untapped Talent, SHRM executives provide vital strategies for tapping into previously overlooked talent pools, ensuring your workforce possesses the skills needed for success. Learn how a global workforce is defined and what steps must be taken to become one, while gaining the tools needed to juggle this unprecedented growth. SHRM’s Executive Voices use decades of combined experience in people management and global expansion to bring you best practices for talent acquisition and retention in this new era of unparalleled opportunities. The Big 3: Education, Caregiving, and Policy Explore the crucial interconnections between education, caregiving responsibilities, and public policy in shaping the modern workplace. Discover how aligning educational outcomes with industry needs, supporting employees with caregiving responsibilities through flexible work arrangements and comprehensive family leave policies, and proactively engaging with policymakers can create a more resilient and inclusive workforce. This talk emphasizes the importance of lifelong learning and the role of employers in fostering an environment that acknowledges and supports caregivers. Gain valuable insights into the latest legislative trends and their implications for workplace practices, along with practical strategies for implementing supportive policies that address the needs of a diverse workforce. This session aims to inspire HR professionals, business leaders, and policymakers to champion initiatives that integrate education, caregiving, and policy, ultimately driving positive change and fostering a thriving workplace. Gender and the Global Focus for Inclusion Explore the pivotal role of gender inclusion in creating equitable and diverse workplaces worldwide. This talk delves into the importance of gender diversity, highlighting its positive impact on organizational performance, innovation, and employee engagement. She examines global trends and best practices in promoting gender inclusion, emphasizing the need for culturally sensitive approaches that respect regional differences while striving for universal principles of equality. Attendees will gain valuable insights into developing and implementing effective gender inclusion strategies within their organizations. Emily shares actionable steps for fostering an inclusive culture that supports gender diversity, addressing challenges such as unconscious bias, pay equity, and career advancement opportunities for all genders. This session aims to inspire HR professionals and business leaders to champion gender inclusion initiatives, contributing to a more inclusive and prosperous global workforce. Book a SHRM Executive to Speak"
