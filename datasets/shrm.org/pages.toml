["https://shrm.org/linkage"]
title = "Optimizing Workforces – Linkage"
description = "Accelerate inclusive leadership at your organization with this set of leadership development tools focused on advancing women."
full_description = "Relaunching SHRM Linkage and SHRM Linkage Institute Guided by insights from clients, stakeholders, and leadership experts, this transformation honors Linkage’s distinguished legacy while maintaining our deep commitment to empowering women, from the backpack to the boardroom, and accelerating workplace inclusion to transform organizations and build business success. Read more from Linkage’s CEO SEPT. 27-30, 2025 | SAN DIEGO, CA AND VIRTUAL SHRM Linkage Institute Optimizing talent and building highly effective teams means developing everyone’s unique strengths and skills. SHRM Linkage Institute works with teams and organizations to meet the unique needs of women across their leadership journey and empowers organizations to harness their full potential to drive business results. The Institute is a four-day, immersive leadership development experience for organizations who want to develop, engage, and align their high-potential leaders and drive team performance. Explore More Transformational Leadership Solutions Linkage, a SHRM company, offers a signature solution set of leadership development tools focused on advancing women and accelerating inclusive leadership to propel organizations across industries to thrive. For more than 35 years, Linkage has been changing the face of leadership by impacting organizational effectiveness and equity. Find Your Solution Linkage Professional Services Linkage’s unique datasets, actionable insights, and cutting-edge products allow organizations to address critical talent challenges. Advancing Women Leaders™, Linkage Signature Solution The Advancing Women Leaders™ solution is a practical framework designed to empower organizations to attract, retain, develop, and advance top talent at all levels. This transformational approach is built on a deep understanding of women's experiences in the workplace, bolstered by the latest research, and highlights the leadership competencies essential for success and growth. Learn More What Leaders Are Saying About SHRM Linkage The data speaks for itself. It is so obvious that there’s been a change in the company. I’m really proud of that. We could not have done it without partnering with Linkage. Aida Sabo, Senior Vice President & Global Head of Diversity, Equity & Inclusion Parexel Just the leadership supporting me to come into this program and believe that I’m going to make a difference inspired me to look at myself. How do I come in every day and think differently? How do I impact product and processes? Ken Strickhouser, Senior Operations Manager Dentsply Sirona Through this experience, I gained valuable insights and developed action plans that will benefit my company [and] support my growth and career and my personal life. I’m grateful for the opportunity. Brenda Smith, Senior Director, Workplace Possibilities The Standard Previous Next Quote 1 Quote 2 Quote 3 Top-Notch Workforce Optimization Unlock the full potential of your workforce with custom solutions based on your business needs. Find Talent Solutions Tamla Oates-Forney, CEO of SHRM Linkage With decades of executive and human resources experience, Oates-Forney brings a wealth of knowledge and leadership to her role as CEO of SHRM Linkage. She has served as CHRO of USAA and Waste Management, in addition to her outstanding career at General Electric, where she received the GE Chairman Award. She has been recognized numerous times for her accomplishments, including being named one of the Top 30 Influential Women of Houston, the Most Influential Black Corporate Directors, and the Most Influential Black Executives in Corporate America."
