["https://shrm.org/about/bio/jim-link"]
title = "Jim Link, SHRM-SCP"
description = "Chief Human Resources Officer for SHRM"
full_description = "Jim Link, SHRM-SCP Chief Human Resources Officer for SHRM Jim Link is the Chief Human Resources Officer for SHRM, the largest HR professional association in the world and the leading voice for matters related to workers and the workplace. As a recognized thought leader in human capability and the future of work, Link’s expertise spans the full spectrum of work, workers, and the workplace. Book Jim to Speak Jim Link is the Chief Human Resources Officer for SHRM. With more than 340,000 members around the world, SHRM is the largest HR professional association in the world and the leading voice for matters related to workers and the workplace. Prior to joining SHRM, Link’s career included roles of increasing responsibility across a variety of industries and companies including General Electric, the Pillsbury Company, Porsche Cars, and Randstad. While at Randstad North America, he led a global team of 150 HR professionals who were instrumental in transforming the company into an award-winning, inclusive, and sustainable global leader. Link consistently demonstrates dynamic and visionary thought leadership with a variety of presentations focusing on the interconnection between effective human capital management and business results. Using a data-driven, story-telling approach with his audiences, Link’s presentations weave together insights gleaned from a variety of sources to address the rapid and necessary changes required for tomorrow’s leaders to succeed. Typical topics Link addresses include the future of HR, global workforce dynamics, workplace evolution, emerging leadership trends, tech readiness, culture, employee and organization wellbeing, as well as entrepreneurship and innovation. Link has graced stages across diverse geographical landscapes, sharing his expertise with audiences in North America, India, Southeast Asia, the Middle East, and Europe. As a sought-after speaker on the international stage, his insightful presentations delve into critical aspects of the contemporary workplace, including but not limited to inclusion, employee experience and engagement, organizational culture, benefits strategies, and mental health advocacy. His compelling discussions not only showcase his depth of knowledge but also reflect his commitment to driving positive change in society and business through the lens of empathy and civility. His ability to translate complex ideas into manageable outcomes, coupled with his passion for fostering inclusive and thriving workplace environments, positions him as a thought leader who leaves a lasting impact on audiences across the globe. SIGNATURE KEYNOTE EX IN FOCUS Employee Experience [EX] Driving Business Outcomes The physical workspace, culture and technology are critical elements in shaping EX. EX is a central driver for employee engagement, retention, and work performance. What is Leadership’s role in tying it all together? Explore Other Keynote Topics Future-Ready HR: Prepared to Lead in the New World of Work The workforce, and the workplace, are changing at a pace faster than ever before, and to deliver maximum impact on results and effectively align teams and talent with the organization's strategic plans, leaders must deeply understand the business, focus strategically, understand how to influence change, and play a key role in solving business problems. Join this session to be able to thrive in the business environment of the future by exploring progressive ways to evolve and disrupt traditional business practices, while building the relationships and influence necessary to gain approval and executive support. How AI Will Transform HR: The Key to Success for HR Leaders How you adapt will dictate the future of your success - explore where AI sits in your HR toolkit and ensure the technology can reach its full potential to prove its value to your business. Discover how AI technology is transforming HR processes and empower your leaders to embrace the change to cement your organization’s position as innovative and forward-thinking. Learn how to fully embrace AI as a helping hand, halting burnout of HR teams through reducing administrative tasks and freeing up time for meaningful work that our leaders strive for. Shaping the Business Landscape by Growing People Capabilities The time for HR leaders to provide able support for CXOs is now. 4 Ps: People, Purpose, Productivity and Pricing have emerged as key issues for the C-suite in 2022, and looking towards 2023, reflecting a radical change in priorities as compared to the recent past. Considering this power shift that is likely to impact every facet of the workplace, this conversation will explore ways to leverage people strategy to augment business growth. Book a SHRM Executive to Speak"
year_published = 2025
clearnet = "https://shrm.org/about/bio/jim-link"
