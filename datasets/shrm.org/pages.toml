title = "Ask an Advisor | SHRM"
description = "HR Knowledge Advisors offer guidance, real-life personal/professional experiences, and resources to assist with HR-related inquiries."
full_description = "Ask an Advisor Have an HR Question? We're Here To Help. SHRM's HR Knowledge Advisors offer guidance, real-life personal/professional experiences, and resources to assist our members with their HR-related inquiries. This member benefit includes up to 15 inquiries per 12-month membership period. This benefit is not offered to SHRM student members or non-SHRM members. Join or upgrade your membership to gain access. NOTE: Please be sure to use the email address associated with your membership when submitting requests. For questions about SHRM products and services, please contact our Customer Experience Team. Not a member? Join SHRM Ask an Advisor Call Weekdays 8:30 a.m. – 8:00 p.m. ET U.S: 800.283.SHRM (7476) Select Option 5 INTERNATIONAL: 1.703.548.3440 Select Option 5 Chat Weekdays 8:30 a.m. – 8:00 p.m. ET Chat transcripts are automatically sent after your chat. Chat Now Email Anytime Make sure your spam blocker accepts email from the shrm.org domain. Email an Advisor Active Executive Network (EN) Members Get Unlimited Inquiries As an active SHRM Executive Network (EN) member, you receive unlimited inquiries during your membership period. NOTE: Please be sure to use the email address associated with your EN membership when submitting requests. SHRM memberships are individual and cannot be shared. We may only speak with or send information to the person holding the SHRM membership, therefore speakerphone use is not permitted.Due to federal regulations, HR Knowledge Advisors are not able to provide services to members from foreign countries with which the U.S. has trade sanctions in place. These countries include Cuba, Iran, North Korea, Syria, Russia, and the Crimea region of Ukraine. If you have already received a response to your request and need further clarification on the issue, we ask that you contact the HR Knowledge Advisor who responded to your original request for follow-up.SHRM's HR Knowledge Advisors are not attorneys and cannot provide legal advice. They provide general knowledge and information as HR professionals. Add Us to Your Contacts You never know when you'll need advice from our Advisors. Just scan the QR code with the camera app on your phone. Additional Resources SHRM Resources Guide Quick access to frequently used resources. Download Now SHRMConnect Ask questions and get answers from peers within the SHRM community. Ask Questions Express Requests Top resources from around the web for your toughest HR questions. Find Answers Now Knowledge Center Team Liz Petersen, SHRM-SCP Read Bio Denise Fenrick Read Bio Kimberly McNeil, SHRM-SCP Read Bio Meet Our Advisors Theresa Adams, SHRM-SCP Senior HR Knowledge Advisor Theresa Adams is a SHRM-SCP certified professional with 23 years generalist experience in the human resources field. Read Bio April Brasher, SHRM-CP April Brasher is an accomplished HR professional with extensive expertise in management, employee relations, benefits, and leave administration. Holding dual Master’s Degrees in Business and HR, she has a diverse background spanning nonprofit and for-profit sectors, including manufacturing, education, and union environments. Recently certified in OSHA 30, she is committed to workplace safety and excellence. Outside of work, she enjoys reading, yoga, spin classes, and Zumba. Read Bio Katie Brennan, SHRM-CP HR Knowledge Advisor Katie Brennan, SHRM-CP, has been a SHRM HR Knowledge Advisor since October 2015. Read Bio Karen Burke, SHRM-CP HR Knowledge Advisor Karen Burke have 13 years of employment with the SHRM HR Knowledge Center. Read Bio Jennifer Chang, SHRM-CP HR Knowledge Advisor Jennifer Chang, SHRM-CP, brings a decade of human resources experience. Read Bio Amanda Crockett HR Knowledge Advisor Read Bio Rue Dooley, SHRM-SCP HR Knowledge Advisor Rue Dooley, SHRM-SCP, has been an HR Knowledge Advisor for SHRM for over 22 years. Read Bio Jim Emanuel, SHRM-SCP HR Knowledge Advisor Jim Emanuel has over 30+ years of HR experience. Read Bio Regan Gross, SHRM-SCP HR Knowledge Advisor Regan Gross has over 25 years of HR experience. Read Bio Rosa Hardesty, SHRM-SCP HR Knowledge Advisor Rosa Hardesty, SHRM-SCP began employment at SHRM in May 2016 as an HR Advisor. Read Bio Robyn Hopper, SHRM-CP HR Knowledge Advisor Robyn Hopper is a SHRM-CP with 24+ years of experience in the human resources field. Read Bio Elissa Jessup, SHRM-SCP HR Knowledge Advisor Elissa Jessup, SHRM-SCP, has 8 years' human resources experience. Read Bio Yvette Lee, SHRM-SCP HR Knowledge Advisor Yvette Lee, SHRM-SCP, is an HR Knowledge Advisor at SHRM. Read Bio Deniece Maston, SHRM-CP HR Knowledge Advisor ​Deniece Maston has 14+ years of HR experience. Read Bio Victoria Neal, SHRM-SCP HR Knowledge Advisor Victoria Neal, SHRM-SCP, is an HR Knowledge Advisor. Read Bio Julie Schweber, SHRM-SCP Senior HR Knowledge Advisor Julie Schweber, SHRM-SCP, has over 18 years of strategic and tactical HR experience. Read Bio Melissa White, SHRM-CP HR Knowledge Advisor Melissa White, SHRM-CP, has over 11 years of direct human resources experience in the nonprofit and health care fields. Read Bio .biography-card__text{display:none;}"
