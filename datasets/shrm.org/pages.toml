["https://shrm.org/credentials/certification/exam-options-fees"]
title = "Exam Options and Fees - SHRM Certification"
description = "Learn more about SHRM exam options such as location, testing windows, fees & payment, process, language options, and stats."
full_description = "SHRM Certification SHRM Exam Details and Fees Your SHRM-CP or SHRM-SCP exam must be taken in person at an authorized Prometric testing center. After you complete the SHRM certification application process, you will receive an Authorization to Test (ATT) letter with instructions on how to schedule your exam appointment at a test center. Schedule An Exam Sample Questions SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Self-Study Instructor-Led Recertify Get Recertified Recertification Portal Qualifying PDC Activities How to Enter PDCs More Educators For Educators More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Organizations Certify My Team Recertification Providers Certified Directory Apply Now More Apply Now Both Exams, CP and SCP, Are Offered at Prometric Test Centers In-Person Testing Select a testing center near you and travel there on exam day. Take your exam on a PC in a controlled location with staff assistance available as needed. Test center staff are responsible for the testing environment and technology. Testing in a test center is safe and reliable, and preferred by SHRM. Note: All exam takers are required to adhere to all Prometric testing rules and the requirements detailed in the SHRM Certification Handbook. Testing Windows The SHRM-CP and SHRM-SCP exams are offered during two windows each year. When applying for the exam, you must apply during the application period that coincides with your testing window. Applications must be received by the standard deadline for each window. First Test Window: May 1 - July 15, 2025 Applications AcceptedDeadlineJanuary 3, 2025May 16, 2025 Exam application deadlines close at 11:59 PM, ET. Second Test Window: Dec. 1, 2025 - Feb. 15, 2026 Applications AcceptedDeadlineJune 4, 2025Dec. 17, 2025 Exam Fees FEE TYPESHRM MEMBER® PRICENONMEMBER PRICESHRM CP Exam Fee$495 $595 SHRM SCP Exam Fee$595 $695 Student Exam Fee Student Eligibility Requirements$225$325Military Exam Fee Military Eligibility Requirements$395$495Corporate Exam Fee Team Certification Requirements 5-9 Exams $470$470Corporate Exam Fee Team Certification Requirements 10-19 Exams $445$445Corporate Exam Fee Team Certification Requirements 20-39 Exams $421$421Corporate Exam Fee Team Certification Requirements 40+ Exams $396$396Transfer Exam Fee$150 Subject to an additional $53 appointment cancellation fee when applicable.$150 Subject to an additional $53 appointment cancellation fee when applicable.​Reset fee ​$100 ​$100 Retest Exam FeeFull exam feeFull exam feeResults Review Fee$100$100 Taking the Exam The SHRM-CP and SHRM-SCP exams contain two types of multiple-choice questions: stand-alone knowledge-based items that assess a candidate’s knowledge and understanding of factual information and scenario-based situational judgment items that assess a candidate's judgment and decision-making skills. Half of the items on each exam are allocated across the three behavioral competency clusters (Leadership, Interpersonal, and Business), and the other half are allocated across the three HR knowledge domains (People, Organization, and Workplace). Forty percent of the items on each exam are situational judgment items, 10% are foundational knowledge items that test the key concepts of the nine behavioral competencies, and 50% are knowledge items that test the 14 HR-specific HR functional areas. Testing and Certification Accommodations Request SHRM is fully committed to ensuring access to the SHRM-CP and SHRM-SCP certification examinations, as well as providing modifications to our certification and recertification policies, for all individuals with disabilities covered by the Americans with Disabilities Act (or the Canadian/Australian equivalent). SHRM provides reasonable accommodations to individuals with documented disabilities who demonstrate a need for special accommodations. Requests for special accommodations are inherently individualized and considered on a case-by-case basis. Therefore, no single type of accommodation will be appropriate for all individuals with disabilities. To request special accommodations, the individual seeking an accommodation must complete the accommodations request form and have a qualified licensed professional complete the Professional Evaluation. How Do I Take the SHRM Certification Exam? The SHRM Certification exams are delivered by computer, and candidates for both exams have 3 hours and 40 minutes divided into two 110-minute sections to answer a total of 134 multiple-choice questions. There are 80 stand-alone knowledge-based questions, and 54 are scenario-based situational judgment items. The testing schedule is as follows: Confidentiality Reminder – 2 minutesIntroduction and tutorial – 8 minutesExam Section 1 – Up to 1 hour and 50 minutes *Exam Section 2 – Up to 1 hour and 50 minutesSurvey – 5 minutes * Candidates may take one optional 15-minute break. SHRM recommends the candidate take a break only if needed and before ending Section 1 if time remains in Section 1. Otherwise, take a break after Section 2 starts. The clock will not stop during the optional break. Each section shows a countdown timer on the screen, and each section is separate and time-independent. Minutes do not roll over. If a candidate spends less time in the introduction, extra minutes are not rolled over to the exam portion. Exam Composition Knowledge Items There are two categories of stand-alone knowledge-based items on the SHRM-CP and SHRM-SCP exams. Items in the first category, referred to as HR-specific knowledge Items (KIs), cover key concept topics associated with the 14 HR functional areas. Items in the second category, which are referred to as foundational knowledge items (FKIs), cover key concept topics that are considered foundational to the eight behavioral competencies. Examinees receive credit for selecting the single correct answer to a given question. Situational Judgment Items Situational judgment items (SJIs) assess candidates’ judgment and decision-making skills. Examinees are presented with realistic work-related scenarios and asked to choose the best of several possible strategies to resolve or address the issues described in each scenario. Although more than one strategy may be effective, examinees only receive credit for choosing the one best answer, as determined by a panel of experienced HR professionals. Field-Test Questions Each exam contains 24 field-test items that are not counted as part of a candidate’s score. Field test items are used to gather data on a question’s effectiveness. Examinees’ answers to field-test items do not count toward any part of their exam scores and are only used for item development purposes. Field test items on the SHRM-CP and SHRM-SCP exams are randomly mixed with scored exam items. Language Options SHRM exams are also available in Arabic, only available in a Prometric test center (in-person). To support candidates from Arabic-speaking countries taking the Arabic-language exams, SHRM has also translated the SHRM BASK into Arabic. To take the exam in Arabic, you must reside in one of the following countries: Algeria, Bahrain, Comoros, Djibouti, Egypt, Jordan, Kuwait, Mauritania, Morocco, Oman, Palestine, Qatar, Saudi Arabia, Tunisia, UAE, Western Sahara, Iraq*, Lebanon*, Libya*, Somalia*, Sudan*, Syria*, Yemen* Note: Individuals living in these designated Arabic-speaking countries will be assigned the translated test form, but have the option of taking the English version of the SHRM exams upon making a request in writing to a shrmcertification@shrm.org. *These countries are subject to U.S. OFAC restrictions and must go through a prescreening process before applying for the exam. Please refer to SHRM’s Standard Terms and Conditions for Program Delivery policy for additional information. Exam Statistics Examinee performance on the certification exams is measured against pre-determined standards (or passing score standards) using methods that are common for prominent testing programs. The SHRM-CP standard is the expected level of competency and knowledge for HR professionals who perform operational work. The SHRM-SCP standard is the expected level of competency and knowledge for HR professionals who perform strategic work. The passing scores for the SHRM-CP and SHRM-SCP exams are reported as scaled scores. The range of possible scores is 120 to 200. All candidates who pass one of the exams receive a maximum score of 200. Following each administration of the SHRM certification exams, in accordance with guidance from the SHRM Certification Commission, SHRM publishes the global exam pass rates for the SHRM-CP and SHRM-SCP. These scores reflect the percentage of examinees across the world who have successfully earned their credentials by passing the relevant exams. EXAM PERIOD SHRM-CP PASS RATESHRM-SCP PASS RATE​May - July 2024 ​71% ​56% ​Dec. 2023 - Feb. 2024 ​70% ​53% ​May - July 2023 ​71% ​54% Dec. 2022 - Feb. 2023 68% 48% May - July 202265%46% Exam Application Audits SHRM will randomly audit a percentage of applications during each testing window. Candidates will be responsible for providing the requested supporting documentation to verify their years of HR experience and degree obtained (if applicable). SHRM’s practice is not to contact employers or educational institutions to obtain verification documentation on the candidate’s behalf. Failure to comply with the audit, and/or falsification or misrepresentation of requested information, will result in denial of the application and/or revocation of the authorization to test. Candidates subject to audit will be notified by e-mail and will have 10 business days to respond. Once selected for audit, candidates will be required to satisfy the audit requirements before being able to continue with the certification process. Failure to comply with the audit will result in forfeiting all fees. Additionally, a candidate who does not comply with the audit will be subject to audit if reapplying for a future testing window. For questions or technical support, please contact shrmcertification@shrm.org or 1-800-283-7476, option #3 or 1-703-548-3440, option #3. Payment Methods For individuals who apply for the SHRM-CP or SHRM-SCP via the SHRM Store, a credit card payment is required at the time of application. Corporate delegations may pay by check, money order, ACH or wire transfer. Please work with your SHRM contact for corporate delegations to arrange payment."
