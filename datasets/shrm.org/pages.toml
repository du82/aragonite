["https://shrm.org/advocacy/about"]
title = "About | SHRM Advocacy Team"
description = "As the voice of all things work, lawmakers rely on SHRM to inform and shape policy solutions that benefit work, workers, and the workplace."
full_description = "About SHRM Advocacy Driving Holistic Change in the World of Work For more than 75 years, SHRM has worked to drive holistic change in the world of work and now serves as the foremost expert, convener and thought leader on issues impacting today’s evolving workplaces. As the voice of its members, SHRM has focused on policy — not politics — to impact legislation. Our members represent the backbone of the business community and are the connective tissue in our workplaces, serving employees and employers alike. More than 95 percent of Fortune 500 companies rely on SHRM as their go-to resource for all things work and as their business partner in creating next-generation workplaces. SHRM Public Policy Priorities SHRM pursues nonpartisan public policy efforts and elevates the voice of HR in discussions on policies affecting the world of work. HR professionals sit at the intersection of work, workers and the workplace, providing SHRM with the unique voice, policy perspective and technical expertise necessary to successfully advocate for major policy issues. HR professionals and business executives expect SHRM to be a vocal advocate for key labor, employment and safety issues. SHRM Government Affairs organizes these key workplace issues into six core policy areas: Workforce Development Supporting effective workforce development strategies Learn More Workplace Inclusion Advancing healthy work cultures and workplace inclusion. Learn More Workplace Flexibility & Leave Enacting modern paid leave and workplace flexibility solutions Learn More Workplace Immigration Modernizing the U.S. immigration system and better enabling the nation to compete globally Learn More Workplace Health Care Strengthening and improving the employer-based health care system Learn More Workplace Governance Promoting clear, balanced rules and guidance on governance issues to create better workplaces Learn More As the Voice of All Things Work, SHRM pursues nonpartisan public policy efforts to promote flexible, inclusive and equitable workplaces that help employers thrive as talent is tapped, trained and empowered to reach its full potential. Contact SHRM Government Affairs We value your input and are here to collaborate and answer your questions. Please don’t hesitate to get in touch with us through the following methods: We are committed to responding to your inquiries promptly and look forward to connecting with you. Thank you for your interest in our work and your support in shaping the future of work, workers and the workplace. General Inquiries, Public Policy and Collaboration Opportunities: For general questions, public policy-related inquiries, information about our advocacy efforts or collaboration opportunities, please contact our team at governmentaffairs@shrm.org. Media Inquiries: For members of the media seeking information, interviews or press-related inquiries, please reach out to our media relations team at press@shrm.org."
