["https://shrm.org/about/bio/johnny-c-taylor-jr"]
title = "Johnny C. Taylor, Jr., SHRM-SCP"
description = "Johnny C. Taylor, Jr., SHRM's President and CEO, is a dynamic, revolutionary leader whose thought leadership is shaping current and future generations of the global workforce."
full_description = '''Johnny C. Taylor, Jr., SHRM-SCP President and CEO of SHRM Johnny C. Taylor, Jr., SHRM's President and CEO, is a dynamic, revolutionary leader whose thought leadership is shaping current and future generations of the global workforce. Johnny’s magnetic delivery and research-backed content will help you and your organization elevate your executive leadership, maximize the power of human capital, future proof your business, and more. Book Johnny to Speak Johnny C. Taylor, Jr., SHRM-SCP, is President and Chief Executive Officer of SHRM. With nearly 340,000 members in 180 countries, SHRM impacts the lives of more than 362 million workers and their families globally. As a global leader on the future of employment, culture, and leadership, Mr. Taylor is a sought-after voice on all matters affecting work, workers, and the workplace. Recognized as one of the “300 Most Influential Executives in Corporate America” for 2024 by Savoy Magazine and one of the “Most Influential People Shaping Public Policy” in our nation’s capital by Washingtonian Magazine, Mr. Taylor is frequently asked to testify before Congress on critical workforce issues and authors the weekly USA Today column, "Ask HR." Mr. Taylor's career spans more than 20 years as a lawyer, human resources executive, and CEO in both the not-for-profit and for-profit spaces. He has held senior and chief executive roles at IAC/InteractiveCorp, Viacom's Paramount Pictures, Blockbuster Entertainment Group, the McGuireWoods law firm, and Compass Group USA. Most recently, Mr. Taylor was President and Chief Executive Officer of the Thurgood Marshall College Fund. He is the author of the national bestseller, RESET: A Leader’s Guide to Work in an Age of Upheaval, which immediately upon its release in September 2021, was in the top three of The Wall Street Journal’s list of best-selling hardcover business books. Mr. Taylor is a member of the United Way Worldwide Board of Trustees and serves on the corporate boards of XPO Logistics (NYSE: XPO), Flores & Associates, and Guild Education. He previously served on the White House American Workforce Policy Advisory Board and as chairman of the President's Advisory Board on Historically Black Colleges and Universities during the Trump Administration. The Women Business Collaborative (WBC) named Mr. Taylor as one of its 2023 Trailblazers in Gender Equity and Diversity for his work to achieve equal position, pay, and power for all women in business. In 2020, he received the Distinguished Executive of the Year Award from the Academy of Management, and he was named 2021 ALA Professional Society CEO of the Year by CEO Update. He is a Fellow of the National Academy of Human Resources and is licensed to practice law in Florida, Illinois, and Washington, D.C. SIGNATURE KEYNOTE Maximize Human Potential: Win Together in a Shifting World In a world characterized by constant change and economic uncertainty, the true powerhouse of any organization is its human capital. However, many organizations are not leveraging the full potential of their most valuable asset—their people. In this talk, President and CEO of SHRM, Johnny C. Taylor, Jr., equips executives to maximize their pivotal role in shaping the workforce, nurturing talent, and steering the organization through the complexities of the modern business landscape. When we meet uncertainty with innovative thought and evolved strategies, we’re unstoppable. Learn how, by working together, we can truly win together in the face of challenge. Explore Other Keynote Topics Civility Starts at Work: Nurturing Civility in the Workplace to Inspire a More Civil World As long as we have a heartbeat, polarizing topics will continue to exist both inside and outside of the workplace, leading to pain and division among colleagues, leadership, and even customers. The question is not if we deal with conflict, but how we as people and as organizations will handle it when we inevitably do. The problem is, no one has led the discussion about how to guide today’s workforce to remain civil when discussing polarizing topics… until now. With extensive experience in navigating organization-wide conflict, and influence over 362 million workers worldwide, SHRM’s Executive Voices are uniquely positioned to help all of us nurture civility in the workplace. No stranger to the ups and downs of a divided workplace, through Civility Starts at Work, SHRM executives explore the impact of civility on work culture, and provide an outline for equipping employees to have candid, civil dialogue while supporting the mental health of all employees. Walk away with a strategic roadmap for facing the storm of conflict, gain insight on just how to measure and quantify people and strategy, and put your audience on a path to inspiring a more civil world. Exponential Impact: Thriving in the Age of Intelligence Internal and external pressures make one thing very clear: when it comes to pursuing organizational success, you can adapt or die. With the introduction of AI, changing economies, and more sparking change across the workforce, the need to evolve rapidly grows, but who is leading the charge? While many may look to the C-suite for direction, it’s HR that is the linchpin for navigating the adoption of tech, talent change management, and productivity. With a pulse on innovation and people management, your organization has the power to harness and integrate the power of Artificial Intelligence (AI) with Human Intelligence (HI) to create meaningful change and exponential impact. In this talk, SHRM’s Executive Voices speak to how HR is uniquely positioned to monitor and integrate innovation into an organization, all while anticipating pitfalls and advancing positive outcomes. Backed with real-world examples, this keynote will teach your audience how to train for skill gaps in a truly digital economy, and pull back the curtain to reveal how to thrive in the age of intelligence. Untapped Talent: Leveraging a Global Workforce In an era where the digital economy has given rise to new measures of global expansion, many companies find themselves unprepared to harness the wealth of talent at their fingertips. When we open up our organizations to a world of candidates - literally - we often lack the research and training that is needed to bridge international differences and build connections across the globe. Through the message of Untapped Talent, SHRM executives provide key strategies on tapping into previously overlooked talent pools, ensuring your workforce possesses the skills needed for success. Learn how a global workforce is defined and what steps must be taken to become one, while gaining the tools needed to juggle this unprecedented growth. SHRM’s Executive Voices take decades of combined experience in people management and global expansion to bring you best practices for talent acquisition and retention in this new era of unparalleled opportunities. Book a SHRM Executive to Speak RESET the Conversation Build Your Business for Tomorrow Informed by more than 70 years of SHRM experience and expertise and propelled by extensive original research, RESET delivers a candid and forward-thinking vision for leaders to reimagine their company cultures in a time of global upheaval and presents data-driven strategies to make the necessary foundational reset of all things work. Learn More { "@context": "http://schema.org", "@type": "Person", "name": "Johnny C. Taylor, Jr.", "jobTitle": "President and Chief Executive Officer of SHRM", "worksFor": { "@type": "Organization", "name": "Society for Human Resource Management", "url": "https://www.shrm.org/" }, "description": "Johnny C. Taylor, Jr., SHRM-SCP, is a prominent leader in the fields of employment, culture, and leadership. He has significantly impacted global workforces and workplaces, and is known for his expertise in HR and legal matters. Author of the bestselling book RESET and a recognized voice in public policy, Taylor's career spans over two decades in various executive roles across different sectors.", "url": "https://www.shrm.org/about/bio/johnny-c-taylor-jr", "image": "https://www.shrm.org/adobe/dynamicmedia/deliver/dm-aid--9be5764f-16e3-4161-9fca-afa968198459/johnny-taylor.jpg", "hasCredential": [ { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "BSC in Broadcast Journalism", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "University of Miami" } }, { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "Juris Doctor (J.D.)", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "Drake University Law School" } } ], "sameAs": [ "https://www.linkedin.com/in/johnnyctaylorjr", "https://www.facebook.com/JohnnyCTaylorJr", "https://twitter.com/JohnnyCTaylorJr" ] }'''
year_published = 2025
