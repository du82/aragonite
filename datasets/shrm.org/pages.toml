["https://shrm.org/about/bio/paula-harvey"]
title = "Paula Harvey"
description = "Paula Harvey is a member of the SHRM Board of Directors."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Paula H. Harvey Vice President of Human Resources and Safety for Schulte Building Systems, Inc. Connect Paula H. Harvey is the Vice President of Human Resources and Safety at Schulte Building Systems, Inc., a metal buildings manufacturer, headquartered in Hockley, TX. She has more than 35 years’ experience as a HR generalist in the retail, services, construction, and manufacturing industries. She also owned her HR and Safety consulting firm for 12 years. In addition to her full-time position she teaches business and leadership topics for Rice University as an adjunct including the SHRM Learning System. Paula is an internationally recognized speaker on global and strategic business issues. Her work has been published or appeared in articles on HR topics and she co-authored three books with other HR professionals: What’s Next In Human Resources, Evolution of Human Resources, and Compassion @ Work. Paula is an active member of the Society for Human Resources Management (SHRM) and is currently serving on the SHRM Board of Directors. She has also served on the SHRM Foundation Board of Directors, SHRM Membership Advisory Council (MAC), SHRM's Talent Acquisition Panel, NCSHRM State Director/President and President of Union County HR Association and Charlotte Area SHRM. Paula earned her Bachelor of Business Administration in International Marketing/Operations Management/Finance from the University of Texas at Austin, and her MBA with a concentration in HR Management from the University of North Carolina at Charlotte. She attends the Iona School for Ministry in preparation for ordination as a deacon. She is a past recipient of the NCSHRM HR Professional of the Year, NCSHRM HR Hall of Fame, and NCSHRM HR Humanitarian of the Year awards. She is a member of the NCSHRM Hall of Fame. Paula lives in Cypress, TX, a suburb of Houston, with her husband, Kenneth, and their two cats. She enjoys church activities, spending time with her grandchildren, martial arts, and traveling. She is a member of the All Fifty States club and working on all 7 continents.'''
