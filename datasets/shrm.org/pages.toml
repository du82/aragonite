["https://shrm.org/about/privacy-policy"]
title = "Privacy Policy"
full_description = 'Privacy Policy Updated January 2, 2025 1. Introductions Welcome to the Society for Human Resource Management ("SHRM"). SHRM is the leading membership association for the human resource profession. We are committed to protecting your privacy, and this Privacy Policy ("Policy") will help you understand how we collect and process Personal Information from those who use of any our websites (e.g., www.shrm.org), mobile apps or related online and offline services we offer (collectively, the "Services"). This Policy also describes what we will and will not do with the information we collect, and your choices about the collection and use of your information. If you have a business relationship with us, or the Services you receive from us are subject to a separate agreement (e.g., with your employer), the contractual terms of that relationship will control in the event of any conflict. Please read this Policy and our posted Terms of Use (together with this Policy, the "Terms") before you use our Services. By using the Services, you represent and warrant that you are of legal age to form a binding contract with us, and agree to be bound and abide by our Terms. If you do not agree to all of our Terms, or if you violate them in any way, you may not access or use the Services. PLEASE SEE SECTIONS 10-14 OF OUR TERMS REGARDING YOUR LEGAL RIGHTS IN ANY DISPUTE INVOLVING OUR SERVICES, INCLUDING A WAIVER TO A CLASS ACTION. Except as otherwise expressly stated, SHRM is the designated data controller for Personal Information. SHRM is based in the United States, with an office 1800 Duke Street, Alexandria, Virginia 22314. The SHRM Foundation, Strategic Human Resource Management India Pvt. Ltd. ("SHRM India"), SHRM MEA FZ (Dubai) and SHRM Corporation all subsidiaries of SHRM, and are all subject to this Privacy Policy as well. Where your data is collected and/or used by one of SHRM’s subsidiaries, all references to SHRM herein shall mean that subsidiary. 2. What is Personal Information? This Policy applies to Personal Information collected or used by SHRM in connection with its Services. "Personal Information" generally means any information that enables us to identify you, directly or indirectly, by reference to an identifier such as your name, identification number, location data, online identifier or one or more factors specific to you. Personal Information can include "Sensitive Personal Information" (particularly sensitive types of Personal Information) and "Pseudonymised Personal Information" (information that does not identify you directly but can be linked to other information that does). Personal Information does not include anonymous information or information that has had the identity of an individual permanently removed. Note that privacy laws apply different definitions to "Personal Information" in various jurisdictions and contexts, and we may therefore need to apply a particular definition in specific circumstances. 3. How We Collect Personal Information As described further below, we may receive Personal information through many aspects of our online and offline Services, and we may collect such information about you by various means, including: Directly from you, both online (e.g., our websites, email) and offline (e.g., phone);From your employer, such as through SHRM Employer Programs;From other third party sources and social media platforms that you may use to engage with us;From event coordinators, sponsors or other third parties we work with; andBy combining information from different sources, including online and offline data. 4. What Information Do We Collect? SHRM may collect the following types of Personal Information: a. Information Provided to SHRM You (or in the case of SHRM Employer Programs, your employer) may provide Personal Information to us which may include your name, home and/or work email address, postal address, phone number and/or fax number, your employer and job title, demographic information about you including birth year, certification designation, etc., and if you are making a purchase, your payment information (e.g., credit card). SHRM can receive such information in various ways through our Services, including: Membership: You share Personal Information with us when you join or renew SHRM membership or a SHRM Chapter through the Services. SHRM members can use log-in credentials to access certain restricted content and features offered by the Services.Other Registration: When registering for specific other services, such as subscribing to an e-mail newsletter.Online Purchases: When making a purchase in the SHRMStore or subscribing to a SHRM publication.Exchange Visitor Program Applications: When participating in SHRM’s Exchange Visitor Program, Host Organizations (the entity hosting an exchange visitor) and Exchange Visitor Trainees/Interns (the foreign individual) must provide SHRM with Personal Information as necessary to process the applications and operate the program. The precise types of information collected and used by SHRM for this program may change over time, based on applicable laws and regulations. In addition to the terms of this Privacy Policy, Personal Information associated with SHRM’s Exchange Visitor Program is subject to the Exchange Visitor Program Privacy Policy and any governing terms agreed-upon with the Host Organization.Employment Applications: SHRM collected relevant Personal Information from job applicants, including a Resume or CV, and any other information required to verify qualifications and assess suitability for an available position.SHRM Research: When you participate in SHRM research activities, we may ask for your Personal Information, such as name, e-mail address, employer, and any other information required to verify your qualifications for the research and/or to conduct the research. In addition to the terms of this Privacy Policy, participation in certain SHRM Research Panels may be subject to the terms of the SHRM Voice of Work Research Panel Privacy Policy, where specified.SHRM Employer Programs: When you participate in certain SHRM programs purchased by your employer, including the THRIVE360 program, used for assessment, training and other workplace growth opportunities, we may collect your Personal Information from you or your employer in order for you to participate in the program. SHRM Foundation Donations and Scholarships: When you make a donation to the SHRM Foundation or apply or a SHRM Foundation Scholarship or other award, we may collect your Personal Information, such as contact information, educational institution (if applicable) and payment information (to process a donation or award). In addition to the terms of this Privacy Policy, Personal Information provided in connection with a donation is subject to the SHRM Foundation Donor Privacy Statement.Surveys: SHRM may receive information about you in response to forms we posted on our Services or sent to you, including for feedback and research purposes.Events: SHRM may receive information about you when you participate in any events we host, organize or sponsor, both online (e.g., webinar) or offline (e.g., conferences).Interactions: We receive information through communications between you and us, such as via email, web form, mail, phone, or other channels. b. Information About Others If you provide us with information regarding another individual (such as a colleague or co-worker), you represent that you have their consent to give us their information and to permit us to use the information in accordance with this Policy. c. Information SHRM Receives Through Automated Means When you use online SHRM Services, we receive certain technical information about your use of the Services, and that may be associated with your Personal Information in some instances. This “Online User Activity” is described further in the next section. 5. Online User Activity and Cookies a. Site Use Information SHRM collects technical information when an individual visits any online SHRM Services, including IP address, browser type and version, time zone settings, browser plug-in types and versions, operating system and platform type (e.g., Chrome or Edge on a Windows platform). We may also collect information about the visit, including pages and content viewed or searched for, page response times, download errors, length of visits to certain pages, page interaction information, and methods used to browse to or away from the page. SHRM may also receive location information where you choose to provide the Services with access to information about your location. This technical information can be necessary to provide the Services, and it also helps us determine which portions of Services are most popular and which part of the website people have visited. We can also use such information to deliver customized content and advertising to users of the Services whose behavior indicates that they are interested in a particular subject area, and measure the effectiveness of advertisements and web searches. We can collect this information irrespective of whether someone has a registered account with SHRM, although some associations may only occur for registered accounts (e.g., members). b. What Are "Cookies" and How Does SHRM Use Them? In order to collect certain Online User Activity, our Services use “cookies”, pixels, SDKs and other commonly-used web technologies. A cookie is a small text file containing a unique identification number that is transferred from a website to your computer. This unique number identifies your web browser whenever you visit the Services. Cookies let us remember your browser so we can provide personalized member services such as My SHRM and SHRM search agents. Cookies also allow us to identify SHRM members who are returning to the Services. Most web browsers are set to accept cookies by default, but if you prefer, you can configure your browser to notify you before accepting a cookie, or refuse to accept cookies altogether. While SHRM does not require you to use cookies, certain Services may not function properly if your browser refuses cookies. We may provide certain Personal Information to third parties we engage with for targeted advertising, user analytics, and to provide a more personalized experience and special offers to You. Specifically, identifying information and Online User Activity may be shared through targeting cookies or other means. Please visit Your Privacy Choices page for more information about such sharing and to opt-out of such activities. You can opt back in to targeting cookies there as well. Our Services also endeavor to process Global Privacy Control (“GPC”) signals from web browsers by automatically opting-out website visitors from third party targeting cookies on the visited website, although GPC technology is not fully developed and it is not yet supported by all browsers. 6. How We Use Personal Information We Collect a. General Use of Information We use Personal Information to operate, evaluate, and improve our Services, including for the following purposes: Performance of our obligations arising from your membership, Exchange Visitor sponsorship, and any other agreement entered into between you and us, or in the case of SHRM Employer Programs, between your employer and us;To update, renew and manage memberships, certifications and credentials as required;To provide you with information, products and services you request from us; To arrange and deliver conferences, events and programming relevant to your job and subjects of interest;To respond to your questions and provide related membership or customer services;To tailor the content that we display to you in our Services and communications, including member benefits, special offers, advertising and other opportunities and information that we believe may be of interest to you;For our business purposes, such as data analysis, audits, developing new products and features, enhancing our website, improving our products and services, identifying usage trends, and determining the effectiveness of our promotional campaigns;To notify you about changes to your membership or related services or to ask you to provide feedback; To enable you to partake in a prize draw, competition or complete a survey;To administer and protect our business and websites (including troubleshooting, data analysis, testing, system maintenance, support, reporting and hosting of data);For those who apply for employment with SHRM, to process your employment application, including background checks and education and employment verification, as applicable;To comply with all applicable laws, legal processes and industry standards, our policies and our contractual rights; andFor any other purpose specified at the point of collection or as described in your express authorization. We may use and disclose non-personal, non-individual statistics or demographic information in a de-identified or aggregate form without restriction. b. Enhanced Privacy On some occasions SHRM collects Personal Information through its Services with the intent or understanding that it will endeavor to maintain a greater degree of privacy for such information than is otherwise set forth in this Privacy Policy. In those relatively rare situations, SHRM will expressly disclose at the time of collection what enhanced degree of privacy will be afforded to the Personal Information, and SHRM will reasonably apply the enhanced degree of privacy to such information. For example, if SHRM conducts a sensitive survey where its intended use of any Personal Information from that survey will be more limited than this general Privacy Policy provides, SHRM will specifically disclose the stricter privacy terms which will apply to that survey information when it is collected from the survey respondent. 7. How You May Share Information With Third Parties The SHRM Services may also include forums, bulletin boards, discussion lists, and/or moderated chats available to SHRM members. Any information disclosed in these areas becomes public information with no expectation of confidentiality, and you should exercise appropriate caution when deciding to disclose your Personal Information or post any other information in these areas. Although users may at times post messages that will appear anonymously on the message boards, SHRM does retain records identifying each individual who posted content in these areas. 8. How We May Share Information With Third Parties SHRM will not disclose your Personal Information to third parties without your consent except as described below: a. Third Party Disclosures When you provide Personal Information through the Services for a particular service, product or promotion, such as when registering for a SHRM-organized event, SHRM may sell or share certain limited information (e.g., title, contact information) derived from such registrations with third parties (e.g., event spon'
