["https://shrm.org/about/bio/valerie-vargas"]
title = "Valerie Vargas"
description = "Valerie Vargas is Senior Vice President of AT&T Advertising and Retail Marketing."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Valerie Vargas Senior Vice President of AT&T Advertising and Retail Marketing Connect Valerie Vargas is Senior Vice President of AT&T Advertising and Retail Marketing. She is responsible for the strategic development and creative execution of mass, diversity & digital advertising, and social media marketing. She also leads retail marketing, overseeing the design of marketing communications and experiences in AT&T stores. Her history with AT&T emanates from BellSouth Cellular as a Market Research Manager and Manager of Strategic Alliances. She was on the Marketing Merger team in forming Cingular Wireless and was the Director of National Sponsorships at time of the brand launch. Valerie departed from telecom for five years to gain incremental marketing expertise in the financial services arena serving as Senior Vice President of Marketing in HomeBanc Mortgage Corporation. In 2007, she returned to the new AT&T as Vice President of Advertising over Home Solutions and ultimately returned to the wireless organization where she held a Vice President role in the Advertising team. She spent two years as the Vice President of Marketing managing research and insights, direct acquisition marketing, customer base marketing communications, advertising and direct tactics among diversity markets, youth marketing programs, and social media marketing. She previously held positions with responsibility for Marketing Sciences and built AT&T’s Consumer Insights Platform & Big Data team – called AT&T Data Patterns – leading the development of this new company initiative in monetizing AT&T’s unique data assets among 3rd party marketers. Valerie also launched the incubator AT&T Creator Lab/ AT&T HelloLab for branded content/influencer and engagement experiences as well as unique integrations of WarnerMedia content programs. Valerie is a graduate of the Martin J. Whitman School of Management at Syracuse University (’94), holds a Juris Doctor from the University of Miami School of Law (’97), and is a member of the American Bar Association and State Bar of Georgia. Valerie is married to Jose A. Vargas (SU ’93), a Director of IT in AT&T and they have 3 children; Isabella 18, Miller 17, and Patton 14.'''
