title = "SHRM Specialty Credentials | Expand Your Influence"
description = "Demonstrate targeted competence in several key areas while enhancing your credibility as an HR professional among peers and employers."
full_description = "SHRM Specialty Credentials Prove Your Proficiency. Demonstrate Your Passion. SHRM Specialty Credentials are the optimal way to prove to your organization and network your credibility and dedication. Buy Now Home Speciality Credentials What's Your Specialty? Build specialized knowledge and expand your influence by earning a SHRM Specialty Credential. These credentials allow HR professionals to demonstrate targeted competence in several key areas while enhancing credibility among peers and employers. Earning a SHRM Specialty Credential is an investment in your continued career development and can be accomplished by engaging in content-specific, competency-based education and achieving a successful score on an online assessment. Specialty Credentials are an approved professional development activity for recertification credits towards your SHRM-CP® or SHRM-SCP® certification. Specialty Credentials SHRM AI + HI Launch your AI journey with the comprehensive, hands-on course. This intensive program features a structured learning approach, with each level building upon the previous one. You'll progress through three stages, gaining a strong foundation in AI concepts through interactive exercises and practical applications. If you are SHRM-certified, completing this credential will earn you 30 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now California Law HR Gain the critical knowledge needed to develop employment guidelines that satisfy the intricate California labor code – including 52 updated laws for 2024 alone, minimize potential litigation risks, and meet the strategic objectives of your organization. The California Law HR Specialty Credential offers an immersive experience in the full scope of dynamic challenges faced by HR professionals managing workforces in California. This credential goes beyond just mitigating risk; it empowers you to operate a high-performing, compliant business in this complex environment. The program is interactive, encouraging you to engage with the content, solve problems, make informed decisions, and practice new skills and knowledge. If you are SHRM-certified, completing this credential will earn you 26.5 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now SHRM Caltech Advanced Technology The world of work is constantly changing, and strategic HR professionals recognize the need to stay abreast of new and shifting technologies. The SHRM Caltech Advanced Technology Credential, part of the Future Skills Academy ™, equips HR professionals with the knowledge and expertise needed to navigate the rapidly evolving workplace. This credential covers a wide range of vital topics; learning about the application of artificial intelligence, understanding big data, establishing strong cybersecurity practices, and using multi-dimensional data modeling. If you are SHRM-certified, you will receive 20 PDCs which will auto-populate in your SHRM Certification profile after completion of the entire specialty credential. In addition, you will receive 4 extra PDCs if you complete the bonus content. Interact with the content, problem-solve, make judgment calls, and try out new skills and knowledge. Buy Now SHRM Caltech Strategy Capabilities HR requires strategic thinkers to move beyond what has always worked and align the organization with the rapidly evolving business landscape. Become a strategic leader in HR with the SHRM Caltech Strategy Capabilities Credential, part of the Future Skills Academy ™. Discover the power of design thinking, master talent strategy for platform business models, and unlock the secrets of creating a future-ready workforce with our Future of Work and Creating Workforce 4.0 modules. Explore the innovative world of NFTs, cryptocurrency and the metaverse’s business applications, all while gaining insights into marketing and customer segmentation strategies. If you are SHRM-certified, you will receive 20 PDCs which will auto-populate in your SHRM Certification profile after completion of the entire specialty credential. In addition, you will receive 4 extra PDCs if you complete the bonus content. Interact with the content, problem-solve, make judgment calls, and try out new skills and knowledge. Buy Now HR Department of One HR professionals who are solo practitioners in their organizations face unique challenges. They must bring a full range of HR expertise, balance competing priorities, and work extensively through their non-HR counterparts. The SHRM HR Department of One Specialty Credential addresses these unique challenges, highlighting key areas, identifying best practices, and aiding in maximizing success in smaller organizations. If you are SHRM-certified, completing this credential will earn you 17 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now Inclusive Workplace Culture Every workplace has a culture. Whether it is intentionally designed or habitually overlooked can critically differentiate an organization's success. Workplaces that are diverse, inclusive, flexible, and engaging are where people thrive. The Inclusive Workplace Culture Specialty Credential, a program for HR professionals, provides the strategies and tools necessary to effectively shift organizational culture. Participants in this program will learn to maximize employee potential by fostering an inclusive and belonging-driven work environment, ultimately unlocking the benefits of a diverse and dedicated workforce. If you are SHRM-certified, completing this credential will earn you 22 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now People Analytics Talent represents the largest and most significant ongoing investment for successful organizations, yet most decisions about people are still made based on intuition and instinct. Today's workplaces offer an abundance of information, enabling HR professionals to leverage data and analytics to drive business decisions and provide evidence-based recommendations. The SHRM People Analytics Specialty Credential equips HR professionals to start their journey in people analytics, allowing them to explore real-world business challenges and effectively communicate findings supported by data. If you are SHRM-Certified, completing this credential will earn you 22 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now Talent Acquisition Sourcing, engaging, and retaining the best talent are top priorities for organizations. The SHRM Talent Acquisition Specialty Credential recognizes the crucial role of talent acquisition professionals in today's challenging business environment and validates your expertise as a strategic talent acquisition partner. This credential addresses the specialized and rapidly evolving field of talent acquisition. It is designed to develop the skills of participants, ensuring that their talent acquisition efforts contribute to the creation of a sustainable, high-performing workforce. If you are SHRM-certified, completing this credential will earn you 22 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now Total Rewards In today’s job market, the number of available positions significantly exceeds the pool of qualified talent. Workers are seeking more than just competitive salaries, and every compensation plan has its limits. How can your organization effectively access talent under these circumstances? The answer lies in SHRM’s Total Rewards Specialty Credential. This program offers the knowledge and guidance needed to create a comprehensive Total Rewards strategy, enabling your organization to attract and retain top talent. Now more than ever, it’s essential to inspire and reward workers to realize their full potential. Register now and enhance your credibility in developing a Total Rewards package that meets the demands of the modern workforce. If you are SHRM-certified, completing this credential will earn you 21 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now U.S. Employment Immigration Talent knows no borders, and people are an organization’s most vital resource and crucial investment. In today's competitive global market for skilled workers, a deep understanding of the U.S. immigration system is essential. The rapidly changing policies and complex immigration requirements demand agility and resourcefulness from professionals in sourcing the best talent. The SHRM U.S. Employment Immigration Specialty Credential enhances your ability to manage employment visas, regulations, employment verification processes, and audit risks, ensuring your organization remains both competitive and compliant. This credential sets you apart, showcasing your expertise in a highly sought-after field of practice. If you are SHRM-certified, completing this credential will earn you 26 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now Workplace Investigations Even the best-run organizations may face situations that necessitate an investigation to mitigate workplace risk. Addressing complaints demands meticulous attention from HR professionals. This includes understanding when and how to engage external counsel, determining what justifies a formal investigation, mastering effective interviewing and data gathering techniques, analyzing results, drawing conclusions, and formulating recommendations for resolution. By earning SHRM’s Workplace Investigation Specialty Credential, you empower yourself to operate effectively and accurately as an investigator. This credential provides the skills and knowledge necessary to lead workplace investigations within your organization, ensuring both compliance and resolution. If you are SHRM-certified, completing this credential will earn you 13.5 Professional Development Credits (PDCs), which will automatically be added to your SHRM Certification profile. Learn More Buy Now Completing the SHRM U.S. Employment Immigration Specialty Credential has given me the confidence and HR expertise to proactively navigate complex immigration challenges, support diverse talent, and ensure compliance for my organization. This is a great place to start if you're new to the immigration and mobility space! Kaitlyn Reeves, SHRM-CP, HR Generalist Global Technology Company Yes, as an HR Department of One, we wear many hats. But we also have influence over the most crucial portion of our business: the people. The SHRM HR Department of One Specialty Credential gives you the information and empowerment you need to take your career to the next level and truly start making a greater impact in your organization. Jennifer Currence, MBA, SHRM-SCP, ACC, President The Currence Group, LLC This has been an INCREDIBLE experience. I'm in a new leadership position for a new role with my organization. While my HR team is excited and enthusiastic, they are looking to me to spearhead their ambitions and provide a fresh lens to their vision on DEI. After this course, I feel much more equip to lead this organization, collaborate with like-minded staff, and welcome new perspectives and ideas as we move forward toward being DEI-effective, not just DEI-competent. Pedro Llanos Altagracia Easter Seals SHRM's Total Rewards Specialty Credential will equip you with the knowledge and skills to attract, retain and motivate the right people, and drive business strategy. From building market-competitive reward programs, to embedding equity into reward practices, ensuring regulatory compliance, and managing vendor relationships, you will learn the fundamental concepts and skills required to succeed in the dynamic field of total rewards management. Ifedapo Adeleye, SHRM-SCP, Professor of the Practice of HRM Georgetown University Previous Next Kaitlyn Reeves, SHRM-CP Jennifer Currence Pedro Llanos Altagracia Ifedapo Adeleye, SHRM-SCP Specialty Credentials FAQs How much time do I have to complete the specialty credential program? You have one year after your purchase date to complete all elements. I have an accessibility/reasonable special accommodation request. How can I submit one? Please see our Accessibility policy page for the complete details on what is supported and how to request accommodations. What type of format are the Specialty Credential programs available in? Specialty Credential programs are available in in-person and virtual formats (pending availability). Please view the program offerings to determine scheduling availability, as they vary. Are course materials available for download? Yes, you will be given downloadable details when you receive the Welcome Letter for the program. How long will it take me to take the test? Do I have multiple attempts? Is this a proctored test? The test is not timed, but should be completed in one sitting. You will have 3 attempts. This is a non-proctored test that you can take remotely. Why can't I see my test results? Test results are not disclosed. You either pass or fail. How do I maintain my specialty credential? A SHRM Specialty Credential is evergreen and does not expire once it is obtained How does this compare to the SHRM-CP and SHRM-SCP? A SHRM Specialty Credential recognizes competency-based professional development accomplished in a focused practice field. Those completing a SHRM Specialty Credential have demonstrated specialized knowledge in a complex and continually evolving topic area. Once earned, practitioners will receive a certificate of accomplishment and a digital badge verifying their specialty. In addition, SHRM-CP or SHRM-SCP credential-holders who complete a SHRM Specialty Credential will have the designated set of professional development credits (PDCs) allotted to the specialty credential automatically uploaded to their SHRM Certification Portal. The SHRM Certified Professional (SHRM-CP) and SHRM Senior Certified Professional (SHRM-SCP) are the most comprehensive competency-based certifications for HR professionals. Based upon a core set of competency and knowledge, the SHRM Body of Applied Skills and Knowledge™ (SHRM BASK), the SHRM-CP, and the SHRM-SCP provide certificants with a roadmap for achieving vital personal outcomes leading to successes such as leadership opportunities and career growth, as well as organizational successes that could include increased staff engagement, improvement of overall effectiveness and operational efficiency."
