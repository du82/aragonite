full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Mike Aitken Chief Membership Officer at SHRM Connect Mike Aitken is Chief Membership Officer at SHRM, following 15 years of leading SHRM’s successful advocacy programs as Vice President of Government Affairs. Mike is a leading authority on the issues important to the human resource profession and drives SHRM’s membership vision, ensuring excellent member experiences, and implementing the organization’s newly developed business strategy. He applies his proven model of engagement to shape the future of work, workers, and workplaces. He is an expert relationship-builder across diverse constituencies and stakeholders, always seeking out the “win-win” in every situation. As a member of SHRM’s executive team, Mike also plays a key role in setting the strategic direction of the organization, offering important counsel on SHRM’s educational programs and professional development opportunities. Prior to joining SHRM in 2003, he spent 14 years with the College and University Professional Association for Human Resources (CUPA-HR), which represents more than 23,000 HR professionals at over 1,900 higher education institutions. In 2015 and 2016, Mike served as an employer representative on the U.S. delegation to the International Labour Conference. Mike holds a Bachelor of Arts degree from the University of San Diego.'''
