full_description = "Partner with SHRM SHRM works with businesses that align with its purpose, vision and mission through many different types on partnerships. Review the options below to learn more. Contact SHRM Partnership Opportunities Advertise with Us When you need to make the biggest impact with your marketing budget, turn to SHRM. Our advertising, exhibits, and sponsorship opportunities position your brand in front of the right audience for maximum return. Event Sponsorship Opportunities Expand your organization's brand awareness and impact as a SHRM event sponsor or exhibitor. Become a SHRM Recertification Provider Being identified as a SHRM Recertification Provider eliminates the guesswork for credential-holders, who will know by your status that your program qualifies for recertification credits. Enterprise Solutions Unlock your organization’s full potential with tailored, human-centric solutions designed to support the complex needs of your business. Take Action Your voice matters. Join the A-Team to become a trusted workplace expert, then take action on issues that shape the world of work. Home The SHRM Foundation elevates and empowers HR professionals as a force for social good so that all workplaces can prosper and thrive. Press Room Look to SHRM for HR experts. Our media team can help connect you with experts, share trends from latest research, and explain SHRM’s point of view. Research Our vision is to advance the HR profession by providing evidence-based insights, recommendations, and innovations at the intersection of people and work."
