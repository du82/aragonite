["https://shrm.org/about/bio/alexander-alonso"]
title = "Alexander Alonso, Ph.D, SHRM-SCP"
description = "Alexander Alonso, Ph.D, SHRM-SCP  is SHRM's Chief Knowledge Officer."
full_description = "Alexander Alonso, Ph.D., SHRM-SCP Chief Data & Analytics Officer at SHRM Alexander Alonso, Ph.D., SHRM-SCP, is SHRM's Chief Data & Analytics Officer leading intelligence, insights, and innovation function. As leader of SHRM’s Research & Insights business units, his total career portfolio has been based upon practical thought leadership designed to make better workplaces and to grow revenue across industry. Book Dr. Alonso to Speak Alonso’s thought leadership has been recognized through various bodies including as an inaugural member of SHRM’s Blue-Ribbon Commission on Racial Equity in the Workplace, a coalition designed to foster equitable and inclusive cultures. His research has been featured in numerous media outlets including USA Today, NBC News, BBC, CNN, and more. He has served as a member of several speaker’s bureaus with more than 400 speaking engagements over the last decade. His works have been recognized for their contribution to real-world human capital issues. They include being recognized with the Society for Industrial and Organizational Psychology (SIOP’s) 2007 M. Scott Myers Award for Applied Research in the Workplace for developing the federal standard for learning and development of healthcare providers; a 2009 Presidential Citation for Innovative Practice by the American Psychological Association for designing performance management systems; and the 2013 SIOP Distinguished Early Career Contributions for Practice Award for extensive applied research on the link between human resource management and organizational sustainability. Throughout his career, he has published works in peer-reviewed journals, authored several chapters on community-based change initiatives in workforce readiness, and authored books like The Price of Pettiness, Talking Taboo: Making the Most of Polarizing Topics (just released), and Defining HR Success: A Guide to the SHRM Competency Model in Practice. Alex also serves as a columnist analyzing major trends in the workforce for TIP and our HR magazine, HR Quarterly. He has served on several professional society boards including as president for the Personnel Testing Council of Metropolitan Washington Area. Alex currently serves on the Secretary of Defense’s Defense Business Board (DBB), the North American HR management Association (NAHRMA) board, and the Zeal Capital Advisory board. He is a Fellow of SIOP, Division 14 of the American Psychological Association. SIGNATURE KEYNOTE The Future of Work is Now: Establishing a Proactive vs. Reactive Workforce The landscape of work is rapidly evolving and we can no longer discuss the future of work as if it’s simply approaching—it's here. In The Future of Work is Now, Dr. Alex Alonso, Chief Data & Analytics Officer at SHRM, equips you with the latest workforce research and a roadmap for creating a workplace environment where your employees handle shifting realities in a way that’s proactive instead of reactive. He’ll not only define a proactive workforce but will also explore the dynamic role AI-enabled tools and other data can have in creating a proactive workforce. You’ll discover how these tools not only bridge skill gaps but also foster inclusive opportunities for professional development, diversify talent pools, and strategically position your organization for success. Explore Other Keynote Topics Civility Starts at Work: Nurturing Civility in the Workplace to Inspire a More Civil World As long as we have a heartbeat, polarizing topics will continue to exist both inside and outside of the workplace, leading to pain and division among colleagues, leadership, and even customers. The question is not if we deal with conflict, but how we as people and as organizations will handle it when we inevitably do. The problem is, no one has led the discussion about how to guide today’s workforce to remain civil when discussing polarizing topics… until now. With extensive experience in navigating organization-wide conflict, and influence over 362 million workers worldwide, SHRM’s Executive Voices are uniquely positioned to help all of us nurture civility in the workplace. No stranger to the ups and downs of a divided workplace, through Civility Starts at Work, SHRM executives explore the impact of civility on work culture, and provide an outline for equipping employees to have candid, civil dialogue while supporting the mental health of all employees. Walk away with a strategic roadmap for facing the storm of conflict, gain insight on just how to measure and quantify people and strategy, and put your audience on a path to inspiring a more civil world. Exponential Impact: Thriving in the Age of Intelligence Internal and external pressures make one thing very clear: when it comes to pursuing organizational success, you can adapt or die. With the introduction of AI, changing economies, and more sparking change across the workforce, the need to evolve rapidly grows, but who is leading the charge? While many may look to the C-suite for direction, it’s HR that is the linchpin for navigating the adoption of tech, talent change management, and productivity. With a pulse on innovation and people management, your organization has the power to harness and integrate the power of Artificial Intelligence (AI) with Human Intelligence (HI) to create meaningful change and exponential impact. In this talk, SHRM’s Executive Voices speak to how HR is uniquely positioned to monitor and integrate innovation into an organization, all while anticipating pitfalls and advancing positive outcomes. Backed with real-world examples, this keynote will teach your audience how to train for skill gaps in a truly digital economy, and pull back the curtain to reveal how to thrive in the age of intelligence. Untapped Talent: Leveraging a Global Workforce In an era where the digital economy has given rise to new measures of global expansion, many companies find themselves unprepared to harness the wealth of talent at their fingertips. When we open up our organizations to a world of candidates - literally - we often lack the research and training that is needed to bridge international differences and build connections across the globe. Through the message of Untapped Talent, SHRM executives provide key strategies on tapping into previously overlooked talent pools, ensuring your workforce possesses the skills needed for success. Learn how a global workforce is defined and what steps must be taken to become one, while gaining the tools needed to juggle this unprecedented growth. SHRM’s Executive Voices take decades of combined experience in people management and global expansion to bring you best practices for talent acquisition and retention in this new era of unparalleled opportunities. Book a SHRM Executive to Speak Learn from Dr. Alonso Unsung Heroes: The Untold Story of HR Talking Taboo: Making the Most of Polarizing Discussions at Work The Price of Pettiness: Bad Behavior in the Workplace and How to Stomp It Out"
