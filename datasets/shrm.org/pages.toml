["https://shrm.org/about/accessibility"]
title = "Accessibility"
full_description = "Home Home Accessibility Policy ﻿ We provide standard organizational-wide accommodations and will review ad hoc requests for additional accommodation needs. Standard Accommodations Starting July 23, 2022, new SHRM content will include the following accommodations for all. SHRM webcasts: CaptionsSHRM eLearning Modules: Captions SHRM Learning System: CaptionsSHRM On-demand: CaptionsSHRM PMQ: CaptionsSHRM podcasts: Transcripts SHRM Education Programs Virtual including Certification Prep: CaptionsSHRM Conferences:In Person: ASL Interpretation and CART for all general sessions on the main stageVirtual: CART for all general sessions on the main stage Accessibility Accommodation Requests If you have additional accommodation requests or have any questions, please reach out to us using this accessibility accommodation form. If you have questions pertaining to accommodations related to the SHRM-CP and SHRM-SCP tests, please refer to the SHRM Certification Handbook for additional information. When you register for live events, or other certain online events, you will also be prompted to specify additional accommodation needs. Please be as specific as possible. Reasonable accommodations for SHRM programming may include but are not limited to Captions, CART, Transcripts, ASL, dietary needs, lactation room access or extended exam times. Please allow for appropriate lead time for any accommodation request. For example, the following lead times are preferred: CART requests at least 5 business days before the programASL Interpretation requests at least 7 calendar days before the start of event SHRM aims to promptly acknowledge receipt of all completed forms and to substantively respond in a timely manner. If you do not receive an acknowledgement or substantive response within 5-business days, please contact our Accessibility Project Manager, Carolyn Barley. When you register for live events, you will also be prompted to specify additional accommodation needs. If you are seeking Professional Development Credits (PDC) for an event or program for which SHRM has agreed to provide transcripts, then the thirty day timeline to request PDC’s will begin on the date transcripts are sent to you. If an accommodations request is denied, then you may request a refund for events and/or SHRM membership for SHRM’s consideration by contacting the SHRM Customer Experience Team at 800.283.7476, option 3 (US Only), +1.703.548.3440, option 3 (Int'l), TTY/TDD +1.703.548.6999 or shrm@shrm.org between 8:00 a.m. and 8:00 p.m. ET. Digital Accessibility We are in the process of making our website and digital programming as accessible and usable as possible. In addition to the accommodations already provided, we are doing this by looking to the Web Content Accessibility Guidelines (WCAG 2.2) produced by the World Wide Web Consortium. Despite these efforts, you may encounter a URL and/or content that is not accessible to you. If you wish to request an additional accommodation for specific programming that is not already provided, such as additional auxiliary aids, please reach out to us by using the accommodation form. If you have a disability that impacts your use or enjoyment of a computer or mobile device, we also recommend that you visit the FCC Accessibility Clearinghouse and the Access Board website. There, you may find advice about how to make your digital experience easier, such as alternative screen readers, screen magnifiers, and other tips and devices that can improve your access to our site and materials. We also recommend that you visit AbilityNet's My Computer My Way, which provides information on making your computer accessible. SHRM Contact: SHRM Accessibility Project Manager"
year_published = 2025
clearnet = "https://shrm.org/about/accessibility"
