["https://shrm.org/credentials/certification/recertification/qualifying-activities"]
title = "Qualifying Professional Development Credit Activities | SHRM"
description = "To recertify, SHRM credential-holders must earn 60 professional development credits (PDCs) within their 3-year recertification cycle period."
full_description = "SHRM Recertification Qualifying PDC Activities SHRM recertification is required every three years. To recertify with Professional Development Credits (PDCs), SHRM credential-holders must earn 60 PDCs within their three-year recertification cycle period. Find Activities SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Self-Study Instructor-Led Recertify Get Recertified Recertification Portal Qualifying PDC Activities How to Enter PDCs More Educators For Educators More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Organizations Certify My Team Recertification Providers Certified Directory Apply Now More Apply Now Advance Your Education Earn recertification credits by advancing your education through learning activities. Earn PDCs Advance Your Organization Earn PDCs for projects that contribute to the success of your organization. Earn PDCs Advance Your Profession Earn credits for contributing to the advancement of the HR profession. Earn PDCs Earn Recertification PDCs for COVID-19 Work If you are a SHRM-CP or SHRM-SCP credential-holder who is working toward recertification, you can earn 30 PDCs for your work in this area. Advance Your Education No PDC maximum per 3-year recertification cycle. SHRM recognizes the value of professional development through lifelong learning and supports formats that cater to individual learning needs and preferences. Qualifying continuing education programs must be related to the HR behavioral competencies or knowledge domains outlined in the SHRM Body of Applied Skills and Knowledge® (SHRM BASK®). For complete information about qualified activities, PDC calculations and/or allocations, and policy/procedure details, please refer to the Recertification Requirements Handbook. ACTIVITY OPTIONS: Conferences, Seminars and Workshops: You may earn recertification credit for attending HR/HR-related conferences, seminars or workshops. SHRM Conferences | SHRM Educational Programs Conferences and Programs from Linkage, a SHRM Company: Linkage, a premier leadership development firm, is now part of SHRM, and offers transformative development experiences, including the Women in Leadership Institute (In-Person, Virtual All-Access, Virtual Keynotes, Virtual Keynotes PLUS, or Executive Track) and independent virtual learning programs focused on the Advancement of Women Leaders and the Acceleration of Purposeful Leaders. Courses Taken for Degree Programs: You may earn recertification credit for taking an undergraduate or graduate graded or ungraded course from an accredited college or university. If the course is graded, you must earn a grade of C or better to receive recertification credit. Continuing Education Units and Continuing Legal Education: SHRM recognizes programs for which the International Association for Continuing Education and Training (IACET) has awarded continuing education units (CEUs). SHRM also recognizes continuing legal education. E-Learning, Videoconferences, Webcasts and Podcasts: You may earn recertification credits for HR/HR-related self-paced, self-directed or e-learning programs. SHRM eLearning SHRM-Approved Books and E-Books: You may earn recertification credit for reading books that SHRM has identified as credit-worthy and submitting an essay. Credentials and Certificates: You may earn recertification credits for earning a SHRM Specialty Credential (17-26 PDCs per program) and/or a SHRM Foundation Veterans at Work or Getting Talent Back to Work certificate program (10 PDCs per program). When you see the SHRM Recertification Provider badge, you can trust these programs have been preapproved for SHRM PDCs. Advance Your Organization 30 PDC maximum per 3-year recertification cycle. Earn recertification credits for projects you work on that contribute to the continued success of your organization and to your growth as an HR professional. PDCs are calculated based on time spent working on the project. Options are listed below. To be awarded credits you must provide a brief write-up detailing the specifics of the project. A template for the write-up is provided in the certification portal. 10 PDCs for the completion of an HR-related project that involved 40+ hours of work 20 PDCs for the completion of an HR-related project that involved 80+ hours of work30 PDCs for the completion of an HR-related project that involved 120+ hours of work Advance Your Profession 30 PDC maximum per 3-year recertification cycle. SHRM recognizes the value of activities that contribute to the continued development of the HR profession and the community. Activities available for professional development credit (PDCs) fall within the following categories. For additional information please refer to the Recertification Handbook. PRESENTATIONS Earn recertification PDCs for creating and presenting educational content based on the HR behavioral competencies and functional domains outlined in the SHRM BASK®. ActivityPDCs1 hour of presenting including preparation time2Presentations that span more than 10 educational hours20 maximum RESEARCHING, WRITING AND PUBLISHING Earn recertification PDCs for conducting primary research and/or authoring or coauthoring a book, article, white paper, or blog post on an HR/HR-related topic that is published by a third party. ActivityPDCsAuthoring, co-authoring, or editing a book 20 maximumAuthoring, co-authoring, or editing an article or another published work 10 maximumAuthoring a white paper or blog post 1 (6 maximum per cycle) VOLUNTEERING SHRM recognizes the value of volunteering your time and talent to support HR/HR-related initiatives for nonprofit organizations. Volunteer activities that qualify for recertification credits are those in which you provide HR services without compensation. ActivityPDCsServing as a SHRM national or MAC* board member or officer 5 per year Serving as a SHRM affiliate** leader 5 per yearServing as a SHRM national or affiliate committee or council chairperson 5 per yearServing as a SHRM national or affiliate committee, council, or panel member 5 per yearServing as a Board member or officer for another HR/HR-related organization 4 per yearMentoring in a formal HR/HR-related mentorship program 3 per yearPeer-reviewing white papers or articles 1 per yearWriting an HR-related letter or making a call to Congress/State Legislature .25 per activityParticipating in a SHRM research workshop 2 per activityParticipating in a SHRM focus group .25 per 15-minute time frameTaking a SHRM survey .25 per 15-minute time frameServing as a SHRM Advocacy team (A-Team) member 3 per yearParticipating in a Capitol Hill visit 3 per yearExam Development Volunteer Activities Varies per activity (refer to the Exam Development Activities brochure for details) * Stands for Member Advisory Council **Affiliates include SHRM chapters, state councils and global forum organizations. PROFESSIONAL MEMBERSHIP SHRM recognizes the value of joining the wider community of HR professionals by becoming a member of SHRM or of other HR-related organizations. Professional association membership also earns SHRM-CP/SHRM-SCPs SHRM recertification PDCs. Organizations include but are not limited to the following: World Federation of People Management Association (WFPMA) Charted Professionals in Human Resources Canada (CPHR) Institute for Human Resource Professionals (IHRP)Association of Talent Development (ATD)Other national or international HR membership organizations ActivityPDCsProfessional membership3 per year"
year_published = 2025
