["https://shrm.org/about/bio/jeanne-morris"]
title = "Jeanne Morris"
description = "Johnny C. Taylor, Jr., SHRM-SCP, is President and Chief Executive Officer of SHRM."
full_description = '''Jeanne Morris SVP, Consumer Products Jeanne Morris started her career with SHRM over 30 years ago, serving in various leadership roles on the Accounting and Finance, Strategic Planning, Professional Development, and Education Teams during her tenure. She played a pivotal role in the growth of these teams and pioneered the conception, development, and launch of SHRM’s Specialty Credentials, including the upcoming SHRM AI Specialty Credential. Recently promoted to Senior Vice President, Consumer Products, Jeanne oversees the teams responsible for the design, development, and execution of all SHRM’s consumer products. She proudly leads the Seminars, Instructional Design, Products, Certification Operations, and SHRM’s Bookstore Teams. Her product portfolio includes SHRM’s specialty credentials, seminars, eLearning, the People Manager Qualification (PMQ), certification preparation tools, SHRM Essentials, and the SHRM Bookstore consumer products. Jeanne and her team are passionate about providing professionals with the tools and knowledge to elevate performance in their workplaces, build resilient teams, and cultivate positive and flourishing workplace cultures. She holds a Bachelor of Science Degree in Accounting from George Mason University in Fairfax, Virginia. { "@context": "http://schema.org", "@type": "Person", "name": "Johnny C. Taylor, Jr.", "jobTitle": "President and Chief Executive Officer of SHRM", "worksFor": { "@type": "Organization", "name": "Society for Human Resource Management", "url": "https://www.shrm.org/" }, "description": "Johnny C. Taylor, Jr., SHRM-SCP, is a prominent leader in the fields of employment, culture, and leadership. He has significantly impacted global workforces and workplaces, and is known for his expertise in HR and legal matters. Author of the bestselling book RESET and a recognized voice in public policy, Taylor's career spans over two decades in various executive roles across different sectors.", "url": "https://www.shrm.org/about/bio/johnny-c-taylor-jr", "image": "https://www.shrm.org/adobe/dynamicmedia/deliver/dm-aid--9be5764f-16e3-4161-9fca-afa968198459/johnny-taylor.jpg", "hasCredential": [ { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "BSC in Broadcast Journalism", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "University of Miami" } }, { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "Juris Doctor (J.D.)", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "Drake University Law School" } } ], "sameAs": [ "https://www.linkedin.com/in/johnnyctaylorjr", "https://www.facebook.com/JohnnyCTaylorJr", "https://twitter.com/JohnnyCTaylorJr" ] }'''
