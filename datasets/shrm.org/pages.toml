sonalized HR Knowledge Advisors to answer your most pressing HR questions; 24-hr networking on SHRM Connect; and exclusive pricing on all professional development opportunities and events. Join Now Learn More Global $118/yr Get resources, news and macro-economic analysis to help you manage HR across multiple countries including a distributed workforce across different time zones, cultures, and workplace laws. Receive a digital version of SHRM HR Quarterly Magazine and take advantage of exclusive membership pricing on professional development opportunities and all SHRM events – domestic and international. Join Now Learn More Student $75/yr Looking to start your career in HR? Reveal resources and insights to prepare for your career in HR, as well as valuable opportunities such as mentorship programs, scholarships, and special student discounts on SHRM events and select educational programs, including SHRM Certification. Join Now Learn More Enterprise Prices vary Turn to SHRM to customize membership package to give your HR department the training, tools, analysis and insights they need to perform at the highest level. Learn More Executive Prices vary Valued at $34,000+, including a community of seasoned HR executives, insightful dialogues on pressing industry issues and strategic solutions to workplace obstacles. Apply Now Learn More An HR Membership Customized for You No matter where you are in your career, our membership options are designed to help you excel as a leader so you can make a lasting impact on both your organization and the future of HR. Whether you’re looking to serve your organization, excel in your career or both, our membership options are customized for your exact needs and designed to grow with you as they change. Professional $299/yr Save 15% with a 3 year membership Over $13,000 worth of research, tools, and the latest in workplace news. Also, you’ll receive our HR Quarterly Magazine, access to HR Advisors to answer your most pressing HR questions, and exclusive pricing on all professional development opportunities and events. Renew Now Learn More Global $118/yr Get supportive resources, news and information to help you manage HR across multiple countries and receive a digital version of HR Magazine and take advantage of exclusive membership pricing on professional development opportunities and all SHRM events! Renew Now Learn More Student $75/yr Enjoy resources and insights to help you prepare for your career in HR, as well as valuable opportunities such as mentorship programs, scholarships, and special student discounts on SHRM events and select educational programs, including SHRM Certification! Renew Now Learn More Enterprise Prices vary Put together a custom-priced membership package to give your HR department the training, tools and insights they need to perform at the highest level. Learn More Executive Prices vary Valued at $34,000+, including a community of seasoned HR executives, insightful dialogues on pressing industry issues and strategic solutions to workplace obstacles. Apply Now Learn More Why SHRM? For more than 75 years, SHRM has helped transform workplaces for the better, making them more efficient, empathetic and resilient. Find a suite of resources at your fingertips to get the job done—and done well. Here’s what you can expect. AI & the Future of HR Research-backed news and trends help you identify opportunities in emerging technology such as AI to automate, improve and innovate. Create a Culture to Attract and Keep High Performers Top talent goes to top companies. Use the latest data to inform policies that offer competitive benefits to create engaged, inclusive and diverse cultures that bring the best out of your people. Stay Compliant & Protect Your Organization Real-time updates allow you to navigate the complexities and important changes in workplace compliance on the federal, state and local level to keep your organization compliant. Develop Solutions for Every Challenge Manage difficult issues such as employee disputes or disciplinary action effectively and ethically with the best practices and a community of 325,000+ professionals providing expert support. SHRM Member® Benefits Latest Workplace News Templates, How-To Guides, Webinars, More Ask an Advisor Discounts on SHRM Educational Programs Latest Workplace News Find the latest workplace news and cutting-edge research and information you need to stay ahead of industry challenges. Join Now View All Member Benefits Guide Templates, How-To Guides, Webinars, More Access essential tools to streamline your day-to-day efforts and give you a professional edge, from handbook guides and HR forms and checklists to leadership development resources. Join Now Explore Tools Member Benefits Guide Ask an Advisor Receive guidance and real-life personal/professional HR-related insights by consulting an expert Knowledge Advisor through call, email or chat. Join Now Learn More Member Benefits Guide Discounts on SHRM Educational Programs Enjoy significant savings on SHRM educational programs and products as a member. Join Now View Programs Member Benefits Guide SHRM Member® Benefits Latest Workplace News Templates, How-To Guides, Webinars, More Ask an Advisor Discounts on SHRM Educational Programs Latest Workplace News Find the latest workplace news and cutting-edge research and information you need to stay ahead of industry challenges. Renew Now View All Member Benefits Guide Templates, How-To Guides, Webinars, More Access essential tools to streamline your day-to-day efforts and give you a professional edge, from handbook guides and HR forms and checklists to leadership development resources. Renew Now Explore Tools Member Benefits Guide Ask an Advisor Receive guidance and real-life personal/professional HR-related insights by consulting an expert Knowledge Advisor through call, email or chat. Renew Now Learn More Member Benefits Guide Discounts on SHRM Educational Programs Enjoy significant savings on SHRM educational programs and products as a member. Renew Now View Programs Member Benefits Guide The Latest in HR Explore updates, news and more affecting your organization and the HR industry as a whole. (opens in a new tab) News What's Ahead in 2024? HR Leaders, Other Experts Share Predictions ​The way organizations operate—including training initiatives, the ongoing debate over the return to the office, and approaches to hiring—is rapidly changing. Workplace experts shared the following 2024 predictions with SHRM. (opens in a new tab) News New Temporary Work Visa Is Available in Saudi Arabia Saudi Arabia has launched a new Temporary Work Visa designed to streamline and expedite the process of bringing short-term workers into the country, while also broadening which types of workers are eligible for the visa. (opens in a new tab) News Minimum Wage Proposal Would Reduce Poverty but Cost Jobs, CBO Says Raising the federal minimum wage to $17 an hour by July 2029 could increase wages for more than 18 million people, but also put about 700,000 Americans out of work, according to a study by the Congressional Budget Office. View All Frequently Asked Questions Get answers to your questions about SHRM membership. What does SHRM offer to small companies that may not have an HR professional? SHRM offers an extensive array of resources designed to optimize time and cost efficiencies for those overseeing HR responsibilities while ensuring compliance and fostering a positive work environment. These resources include the “Ask an Advisor” service, which provides tailored guidance on individual HR inquiries or challenges; comprehensive how-to guides; model policies; job descriptions; interview question templates; and a suite of additional assets. Additionally, SHRM membership extends benefits such as discounted rates on a wide spectrum of professional, personal and travel services, as well as HR labor law posters and a diverse range of supplementary materials. I don't know my username and/or password. What should I do? Your email address is your username. If you have forgotten your password, go to the login page and click "Need Help Signing In?" to have your password reset. What should I do if I can’t log into the members-only pages? Visit the login page to log in or reset your password. If you still need assistance, please call the SHRM Customer Experience Team at 800-283-7476 (US only) or +1.703-548-3440 (Int'l), or email shrm@shrm.org between 8:00 a.m. and 8:00 p.m. ET. Please note: For security reasons, if you need to change your email address or have a name change, members will need to provide Customer Experience with a government-issued ID for verification. After becoming a SHRM Member®, when will I have access to the website? When joining online or by phone: 30 minutesWhen joining by fax: 24-48 hoursWhen joining by mail: 4-6 weeks Can my membership fees be refunded? No. SHRM membership is nonrefundable and nontransferable. Where can I find SHRM’s Accessibility Policy? For information about SHRM’s Accessibility Policy and how to make accommodation requests, go to https://www.shrm.org/about/accessibility. Get Certified with SHRM-CP and SHRM-SCP It’s no surprise that SHRM-certified professionals report earning salaries an average of 25% higher than peers who are not SHRM-certified.* Give yourself a professional advantage by equipping yourself with the knowledge and skills you need to excel in the evolving field of HR. *2022 HR Career Survey, SHRM. Renew and Save Get Certified with SHRM-CP and SHRM-SCP It’s no surprise that SHRM-certified professionals report earning salaries an average of 25% higher than peers who are not SHRM-certified.* Give yourself a professional advantage by equipping yourself with the knowledge and skills you need to excel in the evolving field of HR. *2022 HR Career Survey, SHRM. Become a Member and Save'''
