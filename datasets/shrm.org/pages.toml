full_description = '''Jane Hadley Chief Financial Officer Jane Hadley is the Chief Financial Officer at SHRM, where she leads the Accounting, Financial Planning and Analysis, and Regulatory Compliance functions. With a focus on fiscal stewardship and strategic financial analysis, Jane is responsible for all aspects of financial management and plays a vital role in developing and implementing financial strategies that support SHRM’s mission and objectives. Bringing over twenty years of experience to SHRM, Jane has a proven track record of success in accounting, financial management and reporting. Prior to joining SHRM in 2022, she held key roles at non-profit organizations including the Pew Charitable Trusts as the Director of Accounting and Financial Reporting, and at Autism Speaks as the Vice President, Controller. Jane is a graduate of Villanova University, holding a Bachelor of Science degree in Accounting, and she is a certified public accountant. { "@context": "http://schema.org", "@type": "Person", "name": "Johnny C. Taylor, Jr.", "jobTitle": "President and Chief Executive Officer of SHRM", "worksFor": { "@type": "Organization", "name": "Society for Human Resource Management", "url": "https://www.shrm.org/" }, "description": "Johnny C. Taylor, Jr., SHRM-SCP, is a prominent leader in the fields of employment, culture, and leadership. He has significantly impacted global workforces and workplaces, and is known for his expertise in HR and legal matters. Author of the bestselling book RESET and a recognized voice in public policy, Taylor's career spans over two decades in various executive roles across different sectors.", "url": "https://www.shrm.org/about/bio/johnny-c-taylor-jr", "image": "https://www.shrm.org/adobe/dynamicmedia/deliver/dm-aid--9be5764f-16e3-4161-9fca-afa968198459/johnny-taylor.jpg", "hasCredential": [ { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "BSC in Broadcast Journalism", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "University of Miami" } }, { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "Juris Doctor (J.D.)", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "Drake University Law School" } } ], "sameAs": [ "https://www.linkedin.com/in/johnnyctaylorjr", "https://www.facebook.com/JohnnyCTaylorJr", "https://twitter.com/JohnnyCTaylorJr" ] }'''
