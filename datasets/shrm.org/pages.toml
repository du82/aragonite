title = "SHRM Certification Handbook"
full_description = "SHRM Certification SHRM Certification Handbook Everything you need to begin your SHRM Certification journey. Download the Handbook SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Self-Study Instructor-Led Recertify Get Recertified Recertification Portal Qualifying PDC Activities How to Enter PDCs More Educators For Educators More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Organizations Certify My Team Recertification Providers Certified Directory Apply Now More Apply Now Start Your HR Certification Journey The SHRM Certification Handbook is the primary source of information for SHRM certification and provides everything you need to know, understand, complete and participate in the SHRM certification process. The handbook is required reading for those who apply for, test for, and hold SHRM certification credentials. All individuals who go through this process must comply with the policies, procedures, and deadlines in this handbook and must attest to this fact by signing the SHRM Certification Candidate Agreement when applying. The policies and procedures in this handbook help protect exam content, maintain process integrity, and ensure test fairness and validity for all candidates and credential-holders. The SHRM certification process and certification exams are made available to candidates and credential-holders exclusively under the terms set forth in this handbook, which constitutes a legally binding agreement between SHRM and all candidates and credential-holders. Download the Certification Handbook"
