title = "Anuradha Hebbar"
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Anuradha Hebbar President, SHRM CEO Action for Inclusion & Diversity Professional Summary Anuradha is a strategic business leader and human capital executive with a demonstrated history of designing and executing transformational change in global, Fortune 500, mid-size, and private equity backed organizations. Anuradha is adept at translating business strategy into visionary and results-driven solutions. Anuradha has a wealth of experience as an Executive Leader and C-suite management consultant with demonstrated expertise in HR strategy, HR operating models, succession planning, leadership, talent management, diversity, equity, and inclusion, people analytics, and change management. Anuradha is a trusted advisor and partner to CEOs, CHROs, C-suites, and boards, leveraging a consultative skill set to optimize talent, culture, leadership, HR enablement, and the employee experience to drive organizational and culture change. Anuradha has an unmatched ability to drive meaningful conversations with global CEOs, CHROs, and C-Suite Leaders as a trusted advisor, coach, confidant, and facilitator to influence their thinking, shift mindsets, and enhance leadership behaviors. Currently, Anuradha serves as a Consultant and Advisor. Previously, as a Partner, Executive Managing Director at Kincentric, a Spencer Stuart company, Anuradha was recruited by the CEO to transform the Aon culture and engagement acquisition into a $70 million global consultancy specializing in employee engagement, people strategy, organizational culture, leadership assessment/development and HR advisory services. Anuradha helped drive revenue growth by 27% to $70 million, up $15 million, and helped establish a new human capital consulting firm by developing new business and people processes, recruiting talent, creating novel people solutions, conducting global research, and building organizational capabilities to facilitate client success. Prior Experience A results-driven leader with more than 25 years of demonstrated success in global Fortune 500 corporate and consulting experience aligning human capital initiatives with business strategies to drive performance, Anuradha has experience in many industries including retail, consumer products, industrial, technology, health care, financial services, insurance, pharmaceuticals, telecommunications, and professional services. Anuradha has solved complex talent issues and driven culture change as the Global Head of Diversity & Inclusion at Verizon as well as Zurich Insurance, Divisional Vice President at Health Care Service Corporation, and Strategic Director at McDonald’s Corporation. An accomplished marketing communications expert known to build the reputation and meaningful engagement of brands, companies, and executives, Anuradha has built some of the most iconic Fortune 500 brands including McDonald’s, Keebler, Kellogg’s, and State Farm. Anuradha was named a Chicago United “Business Leader of Color 2021,” a 2021 Crain’s “Notable Executive in Diversity, Equity and Inclusion,” a “2016 Top 100 under 50 Executive Leader” by Diversity MBA, and a “2015 Diversity Leader” by Profiles in Diversity Journal. She has served on not-for-profit boards including the Women’s Business Enterprise National Council Board and many industry councils. She is a frequent speaker and thought leader with numerous publications and often quoted in leading publications and media articles.'''
