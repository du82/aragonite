["https://shrm.org/about/copyright-permissions"]
title = "Copyright & Permission"
full_description = '''Copyright & Permissions SHRM Logo Use The SHRM logo is a federally registered trademark and service mark owned by Society for Human Resource Management. SHRM restricts the use of its logo to SHRM chapters and affiliates. Express, written permission must be obtained from SHRM for any other use of SHRM's logo. No corporation, organization, or individual SHRM member may use SHRM's logo to state or imply that it is a member of SHRM. Individual members of SHRM are allowed to add a statement next to their individual names on business cards, websites, social media profiles, etc. that they, the individuals, are “Member, Society for Human Resource Management.” Copyright Content available through our print and electronic publications is the property of SHRM or its licensors and is protected by copyright and other intellectual property laws. Therefore, SHRM materials cannot be reproduced, retransmitted, distributed, disseminated, sold, published, broadcasted or circulated without SHRM's prior written consent or license. SHRM members do not have the right to republish or redistribute SHRM materials without SHRM's prior written consent. Content is available for your limited, non-commercial use, as specified in the Terms of Use Agreement. Endorsements SHRM does not endorse products or services so we prefer that our content and publications not be quoted in marketing or sales materials. Permission Permission to republish or make photocopies is generally available for SHRM content. Where it is available, click the "Reuse Permissions" link (appearing at the top and bottom of each page) to visit the Copyright Clearance Center at copyright.com for pricing information and licensing terms. Please note that a license grants permission to reuse SHRM content, but it does not provide a copy of the content. Once you obtain a license, you may return to the content page and print or save the item for which permission was granted. If you need an article formatted and printed, please scroll down to the contact information for YGS, SHRM's reprint vendor. Permission to Translate Please contact SHRM if you are interested in translating any SHRM materials into any language. A fee may apply. Reprints Glossy, customizable reprints are offered by SHRM’s reprint vendor, YGS Group. Reprints are great for mailing or as hand-outs and the document can be customized with your company information and logo. Reprints are available for editorial content from our HR magazine, HR Quarterly, or any of the SHRM Online HR disciplines. YGS Group provides reliable quality, expert customer service, and fast turnaround—direct from its facility. All aspects of the reprint process are completed on their premises. If you would like to order reprints, please contact YGS Group by phone at (800) 501-9571 or by e-mail at SHRMreprints@theYGSGroup.com. Additional Questions? If you still have questions about copyright permission, please contact SHRM for more information.'''
