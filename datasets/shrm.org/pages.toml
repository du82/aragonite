["https://shrm.org/advocacy/a-team"]
title = "Join SHRM's Advocacy Team"
description = "SHRM’s A-Team is the core driver of positive workplace policy in action–and encourages all SHRM members to advocate on behalf of the HR profession."
full_description = '''SHRM Advocacy Team (A-Team) Advancing Public Policies that Foster Better Workplaces Policymakers rely on the voices of every SHRM Member® to inform legislation from its inception and to shape enduring policies that address the needs of employees and employers. SHRM members are uniquely qualified to advocate for workplace policy issues, as their collective work impacts the lives and livelihoods of more than 362 million employees globally. That is why SHRM created the Advocacy Team (A-Team). SHRM’s A-Team is the core driver of positive workplace policy in action, and we encourage all SHRM members to join and become an advocate on behalf of the HR profession. With a growing network of nearly 30,000 members spanning 435 congressional districts, SHRM’s A-Team is advancing public policies that foster better workplaces and create a better world. Your Voice Matters – Join SHRM’s A-Team Today Unlock the full potential of your SHRM membership by becoming a valued member of SHRM’s A-Team. The A-Team was created to enable HR professionals like you to make their voices heard on public policy issues impacting the workplace. What You Gain as a Member of SHRM’s A-Team: Exclusive Workplace Policy Updates You will receive breaking email alerts that provide the latest updates on federal, state and regulatory policy developments. This direct access supports your role not only as an advocate but as a key decision-maker in your organization. Expand Your Network Connect with fellow HR professionals, business leaders and policy influencers to cultivate meaningful relationships and expand your connections within the HR community. Advocacy & Communication Training Develop persuasive communication and policy advocacy skills that will elevate your role as a strategic partner in your organization. Engage Directly with Policymakers You will receive opportunities to elevate your voice with elected officials by participating in SHRM advocacy activations, in district-office visits, meetings with lawmakers and much more. Join SHRM's A-Team Today Why Advocacy Matters "It is important for elected officials to hear from their constituents. Advocacy efforts help us have our voices heard on issues that are important to us. Most of the best ideas for legislation come from constituent ideas and bringing these ideas to those in elected office, often resulting in positive change for all." Jeff Palkowski SHRM-SCP Janesville, WI "Nonpartisan advocacy and education of elected officials, staff members and regulators is the most effective way to influence public policy relating to workplace issues. I regularly communicate with and visit elected officials, testify before state legislative committees and write comment letters." Nancy McKeague SHRM-SCP East Lansing, MI "Advocacy matters to me because progress is important to promote better health, engagement, productivity and quality of life for our employees and for our society. If we had only ever relied on the status quo and the standards to which we have become accustomed, we would not have child labor protections, equal opportunity, mininmum wage, safety standards or any of the ohter protection that we have begun to take for granted." Rebecca Tipton Huntsville, AL Contact Us Ready to Get Started? You can unlock the full potential of your SHRM membership by becoming a valued member of SHRM’s A-Team. Email us by clicking the button below, or call 703-535-6099. Email Us'''
year_published = 2025
clearnet = "https://shrm.org/advocacy/a-team"
