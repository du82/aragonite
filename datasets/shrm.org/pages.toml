["https://shrm.org/about/bio/sean-n--woodroffe"]
title = "Sean N. Woodroffe"
description = """
Executive Vice President, Chief People, Culture and Communications Officer
Lincoln Financial Group."""
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Sean N. Woodroffe, SHRM-SCP Sean N. Woodroffe is the Chief People, Culture and Communications Officer at Lincoln Financial – he is responsible for all aspects of human resources (HR) and oversees the company’s corporate communications function. He reports to CEO Ellen Cooper and is a member of Lincoln’s Senior Management Committee. Connect Woodroffe has 35+ years of experience in HR for financial services institutions. Prior to joining Lincoln, he served as Chief People Officer at TIAA, where he was responsible for HR and internal communications. Previously, Woodroffe served as Chief People Officer at National Life Group and as the U.S. Head of HR and Associate Communications at Sun Life Financial. He has also held senior executive HR roles at the United Bank for Africa and Financial Guaranty Insurance Company. Woodroffe started his career and spent more than 18 years at Merrill Lynch. Woodroffe is an active leader in the community and currently serves on the boards of Shaw University in Raleigh, North Carolina, the Peddie School in Hightstown, New Jersey and the U.S. Soccer Foundation. He holds a bachelor’s degree in international relations from Shaw University.'''
