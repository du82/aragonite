title = "SHRM Advocacy & Legislative Resources"
description = "View workplace advocacy resources, webcasts, a legislative tracker, and sign up for the SHRM newsletter to stay up-to-date on workplace issues."
full_description = "Advocacy & Legislative Resources Policymakers rely on the voice of SHRM members to inform legislation from its inception and shape enduring policy to best address the needs of employees and employers. Here you will find useful resources that assist SHRM Advocacy to elevate the voice of HR. SHRM’s Pledge to Elevate the Voice of HR SHRM invites you to join our efforts to drive change in Washington and across the country by taking these five actions in 2023. Learn More SHRM’s Disability Inclusion Pledge SHRM, in collaboration with the Office of Disability Employment Policy (ODEP) at the U.S. Department of Labor and ABLE today, has launched the 2023 Disability Inclusion Pledge to give HR professionals and business executives the tools they need to build better workplaces for disabled workers. Take the Pledge SHRM HR Votes Through SHRM’s HR Votes platform, you can see if you’re registered, access polling information and more. Learn More Top 5 Workplace Policy Issues for HR Professionals, CEOs, and CHROs to Watch in 2025 This year, workplaces face significant challenges, including regulatory changes under a new administration, ongoing inclusion and diversity (I&D) concerns, AI-driven workforce displacement, and more. Learn More SHRM Advocacy Resources Empower your advocacy efforts with our comprehensive suite of resources. SHRM’s Disability & Inclusion Pledge 2024 State Legislative Calendar - an HR Guide to Local Advocacy 2024 Congressional Calendar Workplace Policy Newsletters HR Policy Briefing Newsletter Keep up with SHRM advocacy on laws and regulations that govern the workplace in this biweekly newsletter, delivered on Tuesday afternoons. Subscribe Today SHRM California HR Newsletter Subscribe to California HR and employment law news, delivered the 2nd and 4th Tuesdays of each month. Learn More SHRM Workplace Compliance Newsletter Subscribe to receive summaries of legal decisions, legislative news and regulatory news, delivered weekly on Friday afternoons. Learn More Government Affairs Webcasts Throughout the year, SHRM Government Affairs hosts webcast programs about the latest congressional, regulatory and state workplace policy issues. These programs are recorded and made available for on-demand viewing, and closed captions are provided. New York Workplace Policy 2023 Legislative Recap & 2024 Look Ahead Live Air Date: October 24, 2023 View Recording SHRM Government Affairs & U.S. Department of Education Webcast Federal Student Loan Update: Tools and Resources to Help Employees. Live Air Date: October 23, 2023. View Recording 2023 Disability Inclusion Pledge Roundtable Discussion Live Air Date: October 19, 2023 View Recording California Workplace Policy 2023 Legislative Recap & 2024 Look Ahead Live Air Date: October 18, 2023 View Recording EEOC Webinar: Overview of the 2022 EEO-1 Component 1 Data Collection Live Air Date: October 4, 2023 View Recording DOL WHD Overtime Proposed Rule First Word Alert Webcast Live Air Date: September 6, 2023 View Recording NLRB First Word Alert Webcast Live Air Date: August 10, 2023 View Recording Form I-9 First Word Alert Webcast Live Air Date: July 27, 2023 View Recording SHRM Government Affairs Quarterly Webcast Live Air Date: March 23, 2023 View Recording State Workplace Policy Legislative Tracker Using SHRM’s legislative tracking system, receive real-time information about legislation affecting the world of work in your state. Workforce Development Background/Credit Checks Background/Criminal Disability Employment Employee/Employer Drug Testing Medical Marijuana/Cannabis Workers Compensation Right to Work Unemployment Insurance Union Organizing/Collective Bargaining Veterans Hiring Workplace Inclusion Discrimination in the Workplace Domestic Violence/Workplace Bullying Equal Pay/Comparable Worth Hazard Pay Minimum Wage Harassment in the Workplace Overtime Pay Payroll Cards Social Media Passwords Wage Theft Weapons in the Workplace Workplace Inclusion E-Verify Workplace Health Care Employer-Based Healthcare Health Screenings Workplace Immigration Fair Work Scheduling Leave"
