["https://shrm.org/about/bio/michael-dambrose"]
title = "Michael D'Ambrose"
description = "Michael D'Ambrose is the chief human resources officer and executive vice president of Human Resources for The Boeing Company."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Michael D'Ambrose Global Business Strategist & Board Director Connect A three-time Fortune 50 Chief Human Resources Officer (CHRO), former CEO, and board director, Michael D’Ambrose is a trailblazer in leading complex, global transformations. Energized by the most daunting challenges, he has led seven CEO transitions across five public companies and played a key role in multiple turnarounds. Mike is renowned for breaking down bureaucracy to identify and honor each person’s unique value to an organization—a differentiating vision that sets him apart in his field. As a result of his achievements, he was awarded HR’s highest honor as a National Academy of Human Resources Fellow. Strategic Expertise Nationally recognized expert in CEO succession, labor negotiations, global HR challenges, and executive compensation.Mentor to multiple CEOs and leaders across manufacturing, technology, retail, aerospace/aviation, agriculture, and media industries.Unmatched ability to assess, develop, and place talent to create competitive advantage.Out-of-the-box leadership and workforce development designs and a passion for reskilling workforces for the future.Instills data-driven methodology and psychologically safe culture to set and achieve DEI goals as a business priority. As CHRO of Boeing, Mike was a trusted voice to the executive leadership team during multiple crises as he led an end-to-end transformation of the HR function. A dynamic change leader, he spearheaded the CEO’s succession while simultaneously renegotiating multiple labor contracts globally. Known for elevating companies into employers of choice, he revamped global rewards to establish bonus eligibility for 100% of employees and created innovative recruitment and training programs for college and high school students. Mike joined Boeing after serving as CHRO of ADM, where he facilitated a company-wide turnaround into an industry leader and 5X growth in profitability. During his tenure, he created a world-class HR function and led ADM’s first-ever worldwide organizational restructuring—including refreshing the entire senior management team and the selection and transition of a new CEO. Prior to ADM, Mike served as CHRO of Citigroup (Citicorp), where he led the integration of Travelers and Citicorp, which was then the world’s largest merger. Earlier in his career, he developed his financial acumen and his business approach to HR after acquiring and transforming a bankrupt New York business into a nationwide premier media enterprise as CEO. Mike is a valued member of multiple boards focused on HR excellence, including the Society for Human Resource Management and the National Academy of Human Resources. He is also a founding Board Director and Senior Strategic Adivsor for the Center for Executive Succession at the University of South Carolina Darla Moore School of Business. Passionate about increasing the country’s high- school graduation rate and addressing skilled labor needs, Mike has been deeply involved with Jobs for America’s Graduates and has testified before the Equal Employment Opportunity Commission. He also founded and leads Together We Grow, a consortium of more than 40 industrial, educational, NGO, and legislative partners to develop the next generation of industry leaders. Mike is a sought-after speaker on topics such as leveraging HR functions to drive business growth. He graduated from Cornell University with a BS in industrial and labor relations, where he now serves as an Executive-in-Residence.'''
