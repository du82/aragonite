["https://shrm.org/advocacy/take-action"]
title = "Take Action - Shape the World of Work | SHRM"
description = "Your voice matters. Join the A-Team to become a trusted workplace expert, then take action on issues that shape the world of work."
full_description = "Your voice matters. Join us in advocating for the workplace's most pressing issues, creating lasting positive change for workers everywhere. Join the A-Team Gain access to SHRM’s leading policy research and become a trusted workplace expert Learn More Take Action Gain access to SHRM’s leading policy research and become a trusted workplace expert Explore Workplace Issues Provide Feedback Let us know of any responses received as a result of your interactions. Contact Us SHRM Advocacy Alerts Urge Congress to Strengthen and Support the Education-to-Employment Pipeline The U.S. is facing a critical talent gap, and now is the time for HR professionals to make their voices heard. As an HR leader, you know that building a strong workforce starts with ensuring workers have access to education, training, and upskilling opportunities that align with employer needs. Please contact your members of Congress today and urge them to strengthen and support the education-to-employment pipeline. Take Action Today Key Policy Areas At SHRM, we are focused on six key policy areas that have a meaningful impact on the workplace. Workforce Development Support effective workforce development strategies Learn More Workplace Inclusion Advance healthy work cultures and workplace inclusion Learn More Workplace Flexibility & Leave Enact modern paid leave and workplace flexibility solutions Learn More Workplace Health Care Strengthen and improve the employer-based health care system Learn More Workplace Immigration Build a modern immigration system that fuels economic growth and protects U.S. workers Learn More Workplace Governance Promote clear, balanced rules and guidance on governance issues Learn More Together, We Have: Secured assistance for SHRM affiliates with the expansion of the Paycheck Protection ProgramAdvocated for Modernized Health Savings Plans Rules through key changes in the CARES ActConnected HR professionals and business leaders to lawmakers with over 1,600 unique interactions at the federal and state levels Increased the ways employers can help students by advocating for the expansion of employer-provided education assistance to include student loan repaymentProtected the employer-employee relationship in California through important changes to the California Consumer Privacy Act of 2018 Showcased powerful women’s voices through SHRM’s partnership with the National Foundation for Women Legislators to celebrate 100 years of the 19th AmendmentPaved the way for a permanent option for remote examination of documentation related to the Form I-9 that successfully modernizes the employment verification process without sacrificing safety or security."
