["https://shrm.org/ceo-academy"]
title = "CEO Academy"
description = "Your membership is nearing its expiration. Renew now to continue enjoying unlimited articles and exclusive resources."
full_description = "#adjust-background { background-position: center top; } CEO Academy: The Exclusive Summit for Global CEOs, Successors, and Board Leaders In a world where leadership demands are constantly evolving, the CEO Academy stands out as a beacon of excellence. Join us for an invitation-only, two-day immersive leadership experience where the world’s top executives come together to share their wisdom and advance their strategic vision. Explore the most pressing challenges facing CEOs in impactful keynotes, insightful plenary sessions, and intimate peer-to-peer exchanges. New York City November 18 - 19 2025 Past Agenda Dubai Fall 2025 Apply for Your Seat Why Attend Session Topics Advisory Board Past Events Request Invitation More I realize there are many programs for top executives out there, but if you want to choose the best one, go to the CEO Academy in conjunction with the Wharton School. The take-home value is extraordinary. Maggie Wilderotter Chairman, Docusign Built for Today’s Enterprise CEO Intimate Conversations and Unrivaled Peer-to-Peer Exchanges Engage in candid discussions of business-critical topics with your C-level peers. The CEO Academy is the perfect “war room” training ground for newer CEOs and potential successors. Insightful Plenary Sessions from Leading Visionary Speakers Gain tactical insights from 15+ of the most sought-after speakers who continue to drive transformation in leadership, including current and veteran CEOs from Fortune Global 500 companies and Wharton faculty members. Impactful Connections in an Invitation-Only Community Share and learn in intimate conversations with carefully vetted attendees in a transparent, off-the-record environment designed to foster meaningful connections and help you build a trusted network of fellow CEOs. Immersive Learning Experiences to Inspire Transformation Benefit from an immersive learning experience engineered to transform your strategic approach. Leave armed with tactical advice and action plans to chart the path forward for your organization’s growth. Session Topics Activism: Investors, Employees, Public Artificial Intelligence Board Excellence CEO, CFO, CHRO Collaboration CEO Succession CEO Survival/Crisis Management CybersecurityEconomic Update Geopolitical Issues Impacts from the Global Elections New York Agenda Dubai Agenda * Tentative Agendas Subject to Change For me, the CEO Academy is a ‘must program’ for CEOs dealing with the ever-changing governance and investor landscape. I have served as a panelist discussing investor issues but stuck around after speaking, and I’ve learned a ton beyond the investor landscape just sitting in the room with a world-class group of executives from around the globe. William McNabb Former Chairman and CEO, The Vanguard Group Meet the Speakers Speaking in Dubai Peter Cappelli George W. Taylor Professor of Management at The Wharton School and Director of Wharton's Center for Human Resources Dennis Carey Founder, CEO Academy Ram Charan President & Founder, Charan Associates, Inc. Nader Haffar Former Chairman & CEO KPMG Lower Gulf Barbara Humpton President & CEO, Siemens Corporation Jusuke Ikegami Professor, Dean of Waseda Business School, Waseda University Achal Khanna CEO, SHRM India and the Asia Pacific and MENA region Bill Schaninger Senior Partner, Modern Executive Solutions and Senior Partner Emeritus, McKinsey & Company Johnny C. Taylor, Jr., SHRM-SCP President & CEO, SHRM Tiger Tyagarajan Former President & CEO, Genpact Stanislav Vecera President- Asia Pacific, Middle East, and Africa Procter & Gamble Joseph W. Westphal Senior Global Fellow, The Lauder Institute, The Wharton School and Former U.S. Ambassador to the Kingdom of Saudi Arabia Stay tuned for additional 2025 speaker announcements as we approach the events. Meet the Advisory Board Dr. Erika H. James Dean, The Wharton School William McNabb Former Chairman & CEO, The Vanguard Group Alan Mulally Former President & CEO, Ford Motor Company Johnny C. Taylor, Jr., SHRM-SCP President & CEO, SHRM Maggie Wilderotter Chairman, Docusign The CEO Academy provides corporate executives and directors with a unique and very special venue in which to exchange knowledge and insights about today’s most pressing business issues with Wharton’s top-rated research faculty and the nation’s foremost business leaders. Emilie Feldman Professor of Management, The Wharton School, University of Pennsylvania Explore Past CEO Academy Events Entering its 24th year, CEO Academy stands as a beacon of excellence, renowned for fostering an intimate forum where chief executives connect and learn from peers. Participants consistently acclaim CEO Academy as the pinnacle of CEO preparation, the “absolute best program anywhere,” and the premier immersion course for current CEOs and future successors alike. Past Agendas 2024 New York | 2023 San Francisco Past Speakers Sunil D'Souza Managing Director & CEO Tata Consumer Products Limited Alex Gorsky Former Chairman & CEO Johnson & Johnson Johnny C. Taylor, Jr., SHRM-SCP President & CEO, SHRM Marna Whittington Former CEO Allianz Global Investors View All Past Speakers Request Your Invitation to CEO Academy In an era of continual disruption and change, the role of chief executive officer is evolving rapidly. CEOs must drive change at every level of their organization. Be part of a summit that propels current and future CEOs to new heights of leadership. Request your invitation today and join us for an unparalleled leadership experience. Attendance is limited to 25 enterprise CEOs for each event. Apply for Your Seat Request More Information .v-align > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid, .equal-heights > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid { display: flex; flex-wrap: wrap; } .v-align .layout-container__wrapper, .v-align .cmp-container, .v-align .layout-container__inner, .v-align .aem-Grid{ height:100%; align-items:center; } .v-align .layout-container__wrapper { background-position: center; } .equal-heights .container > .layout-container__wrapper, .equal-heights .container > .layout-container__wrapper > .cmp-container, .equal-heights .container > .layout-container__wrapper > .cmp-container > .layout-container__inner{ height:100%; } .button.d-inline { display: inline-block; width: unset !important; margin: 0 15px 15px 0; float:unset !important; } .btn-group > .layout-container__wrapper > .cmp-container > .layout-container__inner > .aem-Grid{ display:block; text-align:center; } @media only screen and (max-width:768px){ .button.d-inline { display: block; width: 100% !important; margin: 0 0 15px 0; }} Educational Partners"
