["https://shrm.org/about/bio/achal-khanna"]
title = "Achal Khanna"
description = "​Achal Khanna is the CEO of SHRM in India and the Asia Pacific and MENA region."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Achal Khanna CEO of SHRM in India and the Asia Pacific and MENA region Connect Achal Khanna is the CEO of the Society for Human Resource Management (SHRM) in India and the Asia Pacific and MENA region. As a women leader, Achal is enthusiastic about women's empowerment, work culture, and leadership. Achal joined SHRM as COO for SHRM-India, was promoted to CEO-SHRM India, and now manages the global business development role. Achal Khanna is responsible for leading the Indian operations of SHRM, Asia Pacific, the Middle East, and North Africa. In her current role, she is responsible for building the SHRM brand, expanding its business, and developing professional relationships with government agencies and other regional HR and business associations. She has more than 30 years of work experience. Before joining SHRM in 2011, she was managing director for Kelly India operations, Vice president for GE, and Country Manager for Polaroid India. She has also worked in various capacities with DuPont, ITC, and Cosmo Group. Achal Khanna has diverse experience and a highly successful track record of building and operating successful and profitable businesses for leading multinational and Indian companies and managing their businesses across the globe. Achal is a recipient of the "Best Women Executive in India" award. She holds a Bachelor's degree in Economics, a Master's Degree in English Literature, and a Master's in Business Management from the Indian Institute of Management, Ahmedabad, India.'''
