title = "Susana Suarez Gonzalez"
description = "Dr. Susana Suarez Gonzalez is a dynamic senior global executive."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Susana Suarez Gonzalez Executive Vice President and Chief Human Resources, Diversity & Inclusion Officer at Amcor Connect Dr. Susana Suarez Gonzalez is a dynamic senior global executive with deep experience in successfully delivering human capital results connected to growth and profitability across the chemical, mining, engineering, oil & gas, infrastructure, beauty, scent, taste, nutrition, and health industries. As Executive Vice President and Chief Human Resources, Diversity & Inclusion Officer at Amcor a global leader in developing and producing responsible packaging for food, beverage, pharmaceutical, medical, home and personal-care, and other products, she leads the talent agenda of 46,000 Amcor people who generate $13 billion in annual sales from operations that span about 225 locations in 40-plus countries. In addition to this role, she has been appointed in charge of Safety for the entire corporation as well as Global Communications. Prior to her role in Amcor, she led as CHRO International Flavors & Fragrances HR function (IFF), a global company that creates, manufactures, and supplies natural taste, scent, and nutrition for the food, beverage, personal care, and household products industries. Susana partnered with the CEO, Board of Directors, and Business Unit Presidents to lead strategic corporate human resources management. She played a key role in deal negotiations associated with the $7.5 billion acquisition of Frutarom and the announced $26 billion merger with DuPont’s Nutrition and Biosciences business. Building on her past 29 years of experience, she has transformed IFF’s human capital strategy, defining and executing a solid CEO, Board, and Executive Committee succession plan and redesigning a world class total reward platform. Prior to joining IFF, Susana spent 25 years at Fluor Corporation, one of the world’s largest engineering, procurement, fabrication, construction, and maintenance companies. She held leadership positions across several business groups and functions, including construction, marketing, sales, project engineering, and human resources, culminating in Senior Vice President Global Operations, Human Resources. Susana holds an executive Master of Business Administration from IUDE University and a Doctorate in Psychology (summa cum laude) from the University of Oviedo, Spain. She lives in New York, New York, and Madrid, Spain, with her family. She has completed professional development at the Thunderbird School of Global Management, the University of Chicago School of Business Executive Education Program, and the University of Michigan Stephen M. Ross School of Business. She is pursuing a Master of Arts in International Relations and Social Justice at Harvard University. She is the recipient of numerous awards and actively volunteers in many community programs.'''
