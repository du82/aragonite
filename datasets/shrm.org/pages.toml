["https://shrm.org/about/bio/james-clark"]
title = "James Clark"
description = "Jim has served as President and CEO of Boys & Girls Clubs of America since January 2012."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } James Clark President and CEO of Boys & Girls Clubs of America Connect Jim has served as President and CEO of Boys & Girls Clubs of America since January 2012. During his tenure, the enterprise realized a substantial positive impact due to his new strategic direction. Over the past nine years the organization reached 4.7M annual youth served in all 50 states and on U.S. military installations worldwide, added more than 700 new facilities, and reached a record $2.2 billion in revenues, an increase of $780 million (53%). Notable milestones during Jim’s tenure include Boys & Girls Clubs serving nearly 470,000 youth daily in 2019 – up more than 20% since he joined BGCA in 2012, originating a national youth outcomes study, and introducing new programming that supports STEM, summer learning, and workforce readiness. Under Jim's leadership, in 2018 BGCA launched he most transformational initiative in the organization's history, Great Futures 2025, which aims to double the size of the organization in eight years. Prior to joining BGCA, Jim spent eight years as President and CEO of the Boys & Girls Clubs of Greater Milwaukee, more than doubling revenue and achieving a 30 percent increase in membership. Jim also enjoyed success in the publishing industry, where he served in senior leadership roles in distribution, sales/marketing, and customer service operations. Clark earned a Bachelor of Business Administration with a major in finance and marketing from the University of Wisconsin. He is married to Samantha and they have two sons, Chase and Grayson.'''
