["https://shrm.org/about/bio/nichol-bradford"]
title = "Nichol Bradford"
full_description = "Nichol Bradford Executive-in-Residence for AI + HI at SHRM Nichol Bradford stands at the forefront of human potential and AI, accelerating human transformation through technology investments, research, and global thought leadership. Currently, Bradford serves as Executive-in-Residence for AI + HI at SHRM, shaping global thinking on human-AI collaboration. She is also Co-Founder and Partner of Niremia Collective, an early-stage venture fund focused on human potential technologies, and she co-founded TransformativeTech.org, the largest global ecosystem of founders, investors, and innovators building tech for human flourishing. Book Nichol to Speak Before becoming a leader in transformative technology, Bradford served as a senior interactive entertainment executive responsible for strategy, operations, and marketing for major brands that include: Epic Games, Activision-Blizzard, Disney, and Vivendi. She led operations for World of Warcraft China and Blizzard properties in China, played a key role on the Vivendi team responsible for the landmark $18B Activision-Blizzard merger deal, and helped produce record-breaking events in the metaverse at Epic Games. Bradford speaks extensively on human transformation, transformative tech, and the future of health, work, and human excellence. Weaving well-being, technology, and science into practical possibilities for us all, she lays out how we can successfully navigate the future of work and society with our humanity intact. Using real-life examples and use cases from the latest trends in wellness technologies, Bradford demonstrates to groups how these emerging advances can be applied to upskill, enhance human capability, and benefit all of mankind. Currently, Bradford is focused on advancing human potential through ethical and empowering AI—catalyzing a global ecosystem of innovators to create technology for human thriving. Bradford has been a Lecturer and Adjunct Professor at Stanford University, is a graduate of Singularity University’s Global Solutions program, has an MBA from the Wharton School of Business, and a BBA in Marketing from the University of Houston. She is a board trustee of the California Institute of Integral Studies, a fellow of the British American Project, served on the board of the Brandon Marshall Foundation for Mental Health, and is a former term member of the Council on Foreign Relations. SIGNATURE KEYNOTE AI-Charged Growth: Navigating Generative AI for Competitive Advantage In a transformative era where Generative AI reshapes every facet of work, this talk will navigate leaders through the labyrinth of digital evolution. We'll cut through the AI hype, grounding capabilities in real business value. Via case studies and data-driven insights, we’ll provide an actionable blueprint for cultivating an agile, innovative culture that harnesses AI to ethically drive efficiency, decision-making, and experiences. We'll explore frameworks for AI governance, trust building, and human-centric adoption that unlock ROIs while mitigating risks like bias. Drawing on principles of human and AI enablement, we'll dissect the synergy between AI's capabilities and human ingenuity. Leaders will gain practical tools to champion AI pilots that augment human talent over replacement. The focus will be on fostering a culture of innovation and agility that integrates AI ethically, with a keen eye on sustaining competitive advantage through enhanced decision-making, operational efficiency, and customer experiences. Attendees leave empowered to lead as AI+HI Catalysts focused on ethical, sustainable growth in the age of AI. Explore Other Keynote Topics Imagine the Future of Work In our fast-changing world, technology is advancing quickly, and it can be tough to keep up. Many people feel unsure about what's coming next. The speed of progress can be a bit overwhelming, leading to worry and questions. But it's not just about technology; it's also about people and how ready they are for AI. We get that it's important to adapt to this AI-driven era, and we're here to help make sure your team can thrive and be creative alongside AI. Don't let your business fall behind in the AI revolution. The cost of inaction is too high. Instead, enable your team to confident leveraging AI for innovation and growth. The HR Leader’s Playbook: Architecting an AI-Enabled Workforce as an AI+HI Catalyst HR leaders are central to integrating AI’s opportunities while ensuring ethics and human potential stay core. This talk positions CHROs as architects and AI+HI Catalysts of an AI-enabled workforce. We’ll explore leading practices in AI-powered talent optimization—from personalized experiences to diversity/inclusion gains—with a human-centric focus. Via case studies, gain strategies for championing human-centered AI adoption across upskilling, policy shaping, and change management. We’ll also tackle pressing ethical questions, providing frameworks to ensure AI transparency, accountability and security. Audiences will gain insights and tools to partner with leaders in piloting AI appropriately while future-proofing workforces for agility and resilience. As AI+HI Catalysts, HR will learn how to drive cultural change and lead workforce transformation powered by ethical and responsible AI integration. Visioning the AI-Empowered Future of Work Work is where humanity will iterate the best collaborative applications of generative AI. Futurist Nichol Bradford, SHRM’s EIR for Human and AI Enablement, shares insights from pioneering the future of work. Learn how responsible AI implementation focused on empowering human talent and potential builds better workplaces, fueling an enlightened society. Discover how workforce experiments with augmenting people via generative AI systems to enhance skills, capacities and wellbeing result in solutions that benefit lives more broadly. Gain first-hand case studies of organizational transformations that pilot AI ethically to unlock human ingenuity and promise. Attendees will leave with an actionable understanding of the ingredients and implications for supercharging society by elevating humanity through innovations in the world of work. Book a SHRM Executive to Speak"
year_published = 2025
clearnet = "https://shrm.org/about/bio/nichol-bradford"
