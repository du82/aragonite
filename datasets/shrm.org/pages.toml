["https://shrm.org/about/executive-voices"]
title = "Executive Voices | Book a SHRM Executive to Speak"
description = "SHRM Executive Voices bring the best of SHRM to the stage so that your audience can be equipped with research-backed guidance that will propel them forward."
full_description = "Bring the Authority on All Things Work to Your Audience SHRM Executive Voices bring the best of SHRM to the stage so that your audience can be equipped with research-backed guidance that will propel them forward. Book a SHRM Executive to Speak This collection of SHRM's leading voices represent more than 362 million workers and their families across the globe, making them perfectly positioned to address topics critical to today's leaders and workforce. Does your C-suite need to understand how to better leverage the power of human capital? Are you an organization that needs a better grasp on how what’s happening on the Hill impacts your business? Or are you looking to future-proof your organization with the latest in organizational management? SHRM Executive Voices can deliver the answers to these vital questions and more. Meet SHRM's Executive Voices Johnny C. Taylor, Jr., SHRM-SCP Johnny C. Taylor, Jr., SHRM's President and Chief Executive Officer, is a dynamic, revolutionary leader whose thought leadership is shaping current and future generations of the global workforce. Johnny’s magnetic delivery and research-backed content will help you and your organization elevate your executive leadership, maximize the power of human capital, future proof your business, and more. Book Johnny to Speak Johnny C. Taylor, Jr., is President and Chief Executive Officer of SHRM. Recently named one of the “300 Most Influential Executives in Corporate America” by Savoy Magazine, Mr. Taylor’s career spans more than 20 years as a lawyer and an executive, serving at IAC, Paramount Pictures, Blockbuster Entertainment Group, and the Thurgood Marshall College Fund, among other organizations. He is a member of the United Way Worldwide Board of Trustees and serves on the corporate boards of XPO Logistics (NYSE: XPO), Flores & Associates, and Guild Education. He previously served on the White House American Workforce Policy Advisory Board and as chairman of the President's Advisory Board on Historically Black Colleges and Universities. Mr. Taylor writes a weekly column in USA Today and is a Fellow of the National Academy of Human Resources and a SHRM Certified Professional. See More from Johnny Emily M. Dickens, J.D. Chief of Staff, Head of Government Affairs and Corporate Secretary SHRM Speaks to Global HR Policy, I&D, Government Policy, Workplace Issues & Workplace Culture View Bio Alexander Alonso, Ph.D., SHRM-SCP Chief Data & Analytics Officer SHRM Speaks to AI, Future of Work, Skills Gap View Bio Jim Link, SHRM-SCP Chief Human Resources Officer SHRM Speaks to the Future of HR, AI, Leadership, Workplace Culture & Employee Relations View Bio Nichol Bradford Executive-in-Residence for AI + HI SHRM Speaks to AI + HI & the Future of Work View Bio Tamla Oates-Forney CEO Linkage, a SHRM Company Speaks to Women in Leadership, Inclusion, Talent Development & Wellness View Bio Betty Thompson, SHRM-SCP Chair SHRM Board of Directors Speaks to Mental Health in the Workplace, Skills-Based Hiring, Inclusion & Diversity, AI, & Leadership View Bio Trusted by Industry Leaders Bring a Research-Backed Message to Your Audience Don’t settle for just one perspective—bring a SHRM Executive Voice to your event to hear from thought leaders representing more than 362 million workers and their families, and shaping the present and future of work through research, policy, and more. Begin by selecting the message that best addresses your audience’s needs. Each talk can be tailored to your audience profile and additional keynote topics are available. Civility Starts at Work: Nurturing Civility in the Workplace to Inspire a More Civil World As long as we have a heartbeat, polarizing topics will continue to exist both inside and outside of the workplace, leading to pain and division among colleagues, leadership, and even customers. The question is not if we deal with conflict, but how we as people and as organizations will handle it when we inevitably do. The problem is, no one has led the discussion about how to guide today’s workforce to remain civil when discussing polarizing topics… until now. With extensive experience in navigating organization-wide conflict, and influence over 362 million workers worldwide, SHRM’s Executive Voices are uniquely positioned to help all of us nurture civility in the workplace. No stranger to the ups and downs of a divided workplace, through Civility Starts at Work, SHRM executives explore the impact of civility on work culture, and provide an outline for equipping employees to have candid, civil dialogue while supporting the mental health of all employees. Walk away with a strategic roadmap for facing the storm of conflict, gain insight on just how to measure and quantify people and strategy, and put your audience on a path to inspiring a more civil world. Exponential Impact: Thriving in the Age of Intelligence Internal and external pressures make one thing very clear: when it comes to pursuing organizational success, you can adapt or die. With the introduction of AI, changing economies, and more sparking change across the workforce, the need to evolve rapidly grows, but who is leading the charge? While many may look to the C-suite for direction, it’s HR that is the linchpin for navigating the adoption of tech, talent change management, and productivity. With a pulse on innovation and people management, your organization has the power to harness and integrate the power of Artificial Intelligence (AI) with Human Intelligence (HI) to create meaningful change and exponential impact. In this talk, SHRM’s Executive Voices speak to how HR is uniquely positioned to monitor and integrate innovation into an organization, all while anticipating pitfalls and advancing positive outcomes. Backed with real-world examples, this keynote will teach your audience how to train for skill gaps in a truly digital economy, and pull back the curtain to reveal how to thrive in the age of intelligence. Untapped Talent: Leveraging a Global Workforce In an era where the digital economy has given rise to new measures of global expansion, many companies find themselves unprepared to harness the wealth of talent at their fingertips. When we open up our organizations to a world of candidates—literally—we often lack the research and training that is needed to bridge international differences and build connections across the globe. Through the message of Untapped Talent, SHRM executives provide key strategies on tapping into previously overlooked talent pools, ensuring your workforce possesses the skills needed for success. Learn how a global workforce is defined and what steps must be taken to become one, while gaining the tools needed to juggle this unprecedented growth. SHRM’s Executive Voices take decades of combined experience in people management and global expansion to bring you best practices for talent acquisition and retention in this new era of unparalleled opportunities. Book a SHRM Executive to Speak Additional Keynotes Available Maximize Human Potential: Win Together in a Shifting World Johnny C. Taylor, Jr., SHRM-SCP President and CEO of SHRM More About Johnny Workplaces That Work for All: Understanding Policy, Advocacy, and Inclusion Emily M. Dickens, J.D. Chief of Staff, Head of Government Affairs and Corporate Secretary More About Emily The Future of Work is Now: Establishing a Proactive vs. Reactive Workforce Alexander Alonso, Ph.D., SHRM-SCP Chief Data & Analytics Officer More About Alex EX IN FOCUS Employee Experience [EX] Driving Business Outcomes Jim Link, SHRM-SCP Chief Human Resources Officer More About Jim AI-Charged Growth: Navigating Generative AI for Competitive Advantage Nichol Bradford Executive-in-Residence for AI + HI More About Nichol Evolution of Leadership Tamla Oates-Forney CEO of Linkage, a SHRM Company More About Tamla Prioritizing Mental Health: Investing in Employees’ Wellbeing Betty Thompson, SHRM-SCP Chair, SHRM Board of Directors More About Betty Book a SHRM Executive to Speak"
year_published = 2025
