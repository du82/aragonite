["https://shrm.org/credentials/certification/educators"]
title = "Educators"
full_description = "SHRM Certification For Educators Prepare your HR students to meet the needs of today’s challenging business landscape by aligning your HR program with SHRM’s recommended curriculum guidelines. Based on extensive research, SHRM’s HR guidelines help bridge the gap between academic excellence and business readiness. Become a Recognized Program SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Recertify Get Recertified Recertification Portal Qualifying PDC Activities More Educators For Educators Teaching Resources More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Teaching Resources Organizations Certify My Team Recertification Providers Certified Directory More Why Align Your HR Program With SHRM? Increased Program Exposure Have your school listed in the SHRM HR Program Directory, a resource widely used by prospective HR students. Expanded SHRM Partnership Offerings Receive complimentary status in SHRM’s Recertification Provider Program, which allows you to award professional development credits for programs or degree courses offered to SHRM Certification credential holders seeking to maintain their credential. Extended Business Opportunities Be provided with the opportunity to apply to become a SHRM Education Partner and offer SHRM Certification Preparation courses as an additional revenue stream for your school. Enhanced Student Career Development Give students enrolled in your HR program the opportunity to earn a SHRM-CP credential under SHRM’s Eligibility Program, thereby providing them with a career advantage as they enter the job market. Participation Requirements SHRM offers its alignment review service free of charge to colleges and universities interested in aligning their undergraduate or graduate HR degree program(s) with SHRM’s HR Curriculum Guidelines. To qualify, the program must contain curriculum content that covers the following areas: Compensation and BenefitsEmployee and Labor RelationsEmployment LawStrategyTraining and DevelopmentWorkforce Planning HR Academic Program Directory Includes HR- and HR-related undergraduate and graduate degree programs that align with SHRM’s Human Resource Curriculum Guidelines. Search Content HR Curriculum Guidebook Provided free of charge to academic institutions seeking quality HR content to supplement or enhance their HR curriculum. The guide provides an overview of SHRM’s extensive research in the area of HR education and defines the minimum HR content areas that should be included in an HR degree program. Download Guidebook Teaching Resources SHRM is committed to empowering HR faculty with the proper tools and resources needed to create better-prepared entry-level HR professionals through instruction for HR students. Courses and case study content is available free of charge to faculty members in aligned and non-aligned programs who are active SHRM members."
