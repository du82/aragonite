["https://shrm.org/advocacy/global-policy"]
title = "Global Policy | SHRM Advocacy"
description = "SHRM is the go-to organization for international leaders and global businesses on all matters related to HR and the global workplace."
full_description = 'Global Policy SHRM is the go-to organization for international leaders and global businesses on all matters related to HR and the global workplace. SHRM’s Global Worker Project In partnership with the International Organisation of Employers (IOE) and Seyfarth Shaw LLP, the SHRM Global Worker Project is focused on building a shared, human-centered understanding of the future of the workplace to inform policymakers through policy recommendations and best practices on how workers and employers can thrive. Current initiatives include: SHRM Research: What Global Workers Want The SHRM Global Worker Project aims to build a human-centered understanding of the future workplace, informing policymakers with recommendations for worker and employer success. In 2023, SHRM launched phase one of "What Global Workers Want," surveying diverse worker types across the U.S., Mexico, Canada, and the U.K. to gather critical insights. Executive Summary Full Research Paper Human-Centered Worker Playbook Based on the data collected from its research, SHRM is creating a playbook that describes 30 global worker personas and presents the results of the research. It will also deliver policy recommendations and best practices for policymakers and employers to ensure workers and workplaces across the globe thrive. Global Convening of Stakeholders in Geneva and New York SHRM, in partnership with the IOE and Seyfarth, convened experts, researchers, global leaders and workers from around the world in Geneva, Switzerland and New York City to discuss how employees, global business leaders, civic organizations and policymakers can work together to secure the lives and livelihoods of today’s and tomorrow’s workers. The Business 20 (B20) The Business 20 (B20) is the business voice of the G20, the multilateral platform connecting some of the world’s major developed and emerging economies. SHRM served as co-chair of the B20 India Future of Work, Skilling and Mobility Task Force. SHRM also served as a task force member of the B20 India African Economic Integration Action Council and was selected as a B20 India Network Partner to provide technical expertise and advocate for the implementation of B20 India policy recommendations. SHRM is an original signatory of the B20 One Global Women Empowerment initiative, which is committed to the empowerment of women in business and the workplace. In 2022 and 2023, SHRM served as co-chair and the U.S. representative for the B20 Women in Business Action Council (B20 Indonesia) and the Future of Work, Skilling, and Mobility Task Force (B20 India).In 2024, SHRM is a co-chair and the U.S. representative for the B20 Brazil Women, Diversity, and Inclusion Action Council. SHRM’s J-1 Visitor Exchange Program The SHRM Exchange Visitor Program provides highly educated foreign employees and students the opportunity to visit the United States for a short time to receive on-the-job training and engage in cultural exchange. SHRM Global Partnerships To advance SHRM’s global policy efforts, SHRM partners with the following international organizations: International Organisation of Employers (IOE) The IOE is the largest network of private-sector employers in the world, with more than 150 business and employer organization members. World Health Organization (WHO) The WHO is the United Nations agency working to promote health, keep the world safe and serve the vulnerable. International Labour Organization (ILO) The ILO is a United Nations agency that advances social and economic justice by setting international labor standards. United States Council for International Business (USCIB) The USCIB is an independent business advocacy group that was founded to promote free trade and represent U.S. businesses at the United Nations. SHRM President & CEO Johnny C. Taylor, Jr. is a member of USCIB’s Board of Trustees, and SHRM Chief of Staff and Head of Public Affairs Emily M. Dickens is a member of the USCIB Board of Directors. Global Forum on Migration and Development (GFMD) Created in 2007, the Global Forum on Migration and Development (GFMD) is a state-led, informal and non-binding process, which helps shape the global debate on migration and development. It provides a flexible, multi-stakeholder space where governments can discuss the multi-dimensional aspects, opportunities and challenges related to migration, development, and the link between these two areas. The GFMD process allows governments - in partnership with civil society, the private sector, local and regional governments, youth, the UN system and other relevant stakeholders – to analyze and discuss sensitive issues, create consensus, pose innovative solutions, and share policy and practices. Learn more about SHRM’s global affairs work and policy priorities by contacting SHRM Government Affairs at governmentaffairs@shrm.org.'
year_published = 2025
