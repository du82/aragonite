["https://shrm.org/advocacy/first-100-days"]
title = "The First 100 Days"
full_description = "The First 100 Days Welcome to the Trump Administration 100-Day Tracker SHRM is dedicated to equipping HR professionals and business leaders with the information you need to navigate evolving workplace policies. Our focus remains on Policy, Not Politics. This Hub provides insights into key actions and developments from the Trump administration’s first 100 days, emphasizing their potential impact on workplaces and workforces. Please check back frequently to find the latest updates or contact us for more information about our public policy priorities. Top Executive Orders Impacting the Workplace – A Guide for HR Leaders Learn more about our policy pillars. More information on all of President Trump’s Executive Orders. (opens in a new tab) DEI Executive Orders Inclusion and diversity are essential for creating thriving workplaces and communities. These principles drive innovation, foster collaboration, and ensure every individual feels valued and empowered. (opens in a new tab) Deregulation Executive Orders This will impact regulatory compliance, workplace policies, and the overall regulatory environment. The postponement of effective dates and public comment periods may also affect businesses and industries awaiting new regulations. (opens in a new tab) Rescission of Executive Order 14110 SHRM supported this executive order as it established new standards for AI safety and security that advanced equity and civil rights and promoted innovation and competition. (opens in a new tab) Protecting The United States From Foreign Terrorists This will impact hiring processes. Enhanced vetting and screening of aliens seeking admission to the U.S. could impact the hiring process for businesses that employ foreign nationals. (opens in a new tab) Return to In-Person Work The EO directs the Executive branch department and agency heads to end remote work arrangements and require employees to return to in-person, full-time work at their duty stations, with exemptions allowed at their discretion. Member Tools for Navigating New Administration Changes CHECKLIST What to Do To Prepare For an ICE Workplace Visit Learn More CHECKLIST What To Do During an Immigration (ICE ) Workplace Visit Learn More Need guidance with the new Administration changes? Ask a SHRM Knowledge Advisor Stay Up to Date On Cabinet Nominations (opens in a new tab) 2025 Presidential Cabinet The appointments to the President's cabinet play a critical role in shaping the policies and direction of the nation. This page provides an overview of President Donald Trump's cabinet nominations and their status. Read our letters of support for cabinet nominees: Lori Chavez-DeRemerKeith SonderlingKelly Loeffler (nomination)Marco RubioDouglas A. CollinsKelly Loeffler (confirmation) News & Updates Webinar recap: SHRM Public Policy Discussion: What to Expect from a Trump Administration and a Narrowly Divided Congress Now is the time to conduct audits to make sure that companies’ diversity, equity, and inclusion (DEI) programs are complying with Title VII of the Civil Rights Act of 1964. Read More Trump Issues EO on AI Innovation President Donald Trump issued an executive order on artificial intelligence requiring a review of “existing AI policies and directives that act as barriers to American AI innovation.” Read More SHRM’s Top 5 EOs That Will Impact the Workplace Discover five executive orders reshaping DEI, AI, immigration, and federal policies under President Trump’s administration. Read More"
