["https://shrm.org/credentials/certification/recertification"]
title = "SHRM Recertification"
description = "Maintain your SHRM certification to demonstrate your commitment to self-improvement, continued growth, and HR excellence."
full_description = "SHRM Recertification Enhance your HR skills, maintain relevance and maximize the value of your original investment by recertifying your SHRM-CP or SHRM-SCP today. SHRM Certification Decide Which Certification? SHRM-CP SHRM-SCP Get Certified Getting Started Certification Handbook SHRM Certification Exam Prepare Exam Preparation SHRM BASK SHRM Learning System Self-Study Instructor-Led Recertify Get Recertified Recertification Portal Qualifying PDC Activities How to Enter PDCs More Educators For Educators More Organizations Certify My Team Recertification Providers Certified Directory More Educators For Educators Organizations Certify My Team Recertification Providers Certified Directory Apply Now More Apply Now You’re SHRM Certified. What’s Next? Earning your SHRM certification credential proves your competence in the HR field and your dedication to the profession. Maintaining the credential shows that you are committed to self-improvement, continued growth and development, and HR excellence. With continuing education as its cornerstone, the SHRM recertification process supports your efforts to stay at the top of your game by maintaining your competence and relevance in the field, thereby maximizing the value of your SHRM-CP or SHRM-SCP credential. Once certified, your recertification cycle begins the day you pass the exam and ends three years later, on the last day of your birth month. Recertification Cycle Example: Your birth month is July.You take and pass the exam on May 3, 2025.Initial recertification cycle start date: May 3, 2025.Cycle end date: July 31, 2028.Certification revoked: September 30, 2028. You must complete your recertification within this three-year time frame. Credential-holders who do not complete these requirements then enter a 60-day grace period. However, the recertification fee increases by $75 and your certification will be revoked at the end of the grace period if your recertification is not completed by then. HR professionals attain recertification by engaging in professional development activities that relate to the behavioral competencies and HR knowledge identified in the SHRM Body of Applied Skills and Knowledge® (SHRM BASK®). Recertification Processing Fee: Fee TypeMemberNonmemberRegular$165 USD$210 USDLate$240 USD$285 USD Become a SHRM Member® to save on your SHRM recertification fee. Recertification processing fees apply to recertification by PDCs only. Fees are nonrefundable and nontransferable. Late fee applies to completed records submitted during the 60-day grace period (after the cycle end date and before the expiration date). Getting Started with Recertification Identify Skill Gaps Review your Certification Exam Score Report or ask your supervisor what areas you might need to focus on. Learn More Create Your PDC Plan Select qualifying activities, such as HR related courses, books, events or work projects. Learn More Track Your Progress Enter PDCs in your Certification Portal. Remember Advancing Your Education has no PDC Limit! Learn More Recertify Submit your completed record by your end date. Your end date is the last day of your birth month. Learn More Download Recertification Handbook Two Ways to Recertify As a SHRM certification-holder, you can choose one of two options for recertification: Earn 60 professional development credits within your three-year recertification cycle. Enter your PDCs in your SHRM certification portal, submit your completed recertification record before your expiration date and pay the recertification processing fee. Qualifying activities include projects that advance your education, your organization or your profession. Find PDCs How to Enter PDCs Retake the certification exam within the last year of your recertification cycle. Contact us before you apply online and pay the exam fee. You must test at your current level no earlier than 12 months before the end of your three-year recertification cycle. If you fail the exam, your credential will be revoked and you will need to reapply and pass the exam to regain it. You will not be able to pursue recertification with PDCs. Contact us at SHRMRecertification@shrm.org or 1-800-283-7476. Note: To avoid the applicable late fee, you must achieve the required PDCs and submit a paid recertification application by the recertification end date (your birth month in year 3 of your recertification cycle). GRACE PERIOD: While you can complete your PDC requirements within the 60-day grace period between your end date and expiration date, you must pay both the recertification fee and the applicable late fee. RETIRED STATUS: To apply for SHRM certification retired status you must be completely retired from the professional with no plans to continue working in the human resources area. Download and complete the retired status request form to submit your request. Recertification was not even a question for me, since I received my SHRM-CP I have had so many opportunities to share my knowledge. Amanda Hofer, SHRM-CP Director of HR and Admin, Chapter President - SHRM of Tulare/Kings County Ways to Earn PDCs SHRM Conferences Earn 20+ PDCs Educational Programs Earn 7.5-36 PDCs SHRM Membership Earn 3 PDCs per year Podcasts Earn 1-2 PDCs Specialty Credentials Earn 13.5-26 PDCs SHRM on Demand Earn 1-60 PDCs eLearning Earn 1-5 PDCs Webinars Earn 1 PDC each All Qualifying PDC Activities"
year_published = 2025
