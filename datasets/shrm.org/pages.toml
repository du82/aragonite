["https://shrm.org/about/bio/tamla-oates-forney"]
title = "Tamla Oates-Forney"
description = "Johnny C. Taylor, Jr., SHRM-SCP, is President and Chief Executive Officer of SHRM."
full_description = '''Tamla Oates-Forney CEO of Linkage, a SHRM Company Tamla Oates-Forney is an innovative thought leader and speaker, women’s advocate, wellness champion, philanthropist and investor. She serves as Chief Executive Officer of Linkage, a SHRM company, a global leadership development firm committed to advancing women and accelerating inclusion in leaders and organizations. Book Tamla to Speak { "@context": "http://schema.org", "@type": "Person", "name": "Johnny C. Taylor, Jr.", "jobTitle": "President and Chief Executive Officer of SHRM", "worksFor": { "@type": "Organization", "name": "Society for Human Resource Management", "url": "https://www.shrm.org/" }, "description": "Johnny C. Taylor, Jr., SHRM-SCP, is a prominent leader in the fields of employment, culture, and leadership. He has significantly impacted global workforces and workplaces, and is known for his expertise in HR and legal matters. Author of the bestselling book RESET and a recognized voice in public policy, Taylor's career spans over two decades in various executive roles across different sectors.", "url": "https://www.shrm.org/about/bio/johnny-c-taylor-jr", "image": "https://www.shrm.org/adobe/dynamicmedia/deliver/dm-aid--9be5764f-16e3-4161-9fca-afa968198459/johnny-taylor.jpg", "hasCredential": [ { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "BSC in Broadcast Journalism", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "University of Miami" } }, { "@type": "EducationalOccupationalCredential", "credentialCategory": "degree", "educationalLevel": "Juris Doctor (J.D.)", "recognizedBy": { "@type": "CollegeOrUniversity", "name": "Drake University Law School" } } ], "sameAs": [ "https://www.linkedin.com/in/johnnyctaylorjr", "https://www.facebook.com/JohnnyCTaylorJr", "https://twitter.com/JohnnyCTaylorJr" ] } Oates-Forney previously served as EVP, Chief Human Resources Officer (CHRO) for USAA, where as a member of the Executive Council she led USAA’s team of more than 500 HR professionals spanning talent development, talent acquisition, pay and benefits, culture and employee services for 37,000 teammates. Prior to joining USAA, Oates-Forney served as Senior Vice President and Chief People Officer at WM (previously Waste Management). She spent the majority of her career (20 years) at General Electric, where she held multiple leadership roles, including HR Leader for GE Africa, Chief Diversity Officer for GE Appliances and Lighting, and Vice President of HR for GE Energy Connections. Oates-Forney is also an independent director and member of the Human Capital and Compensation committee for Summit Materials. She serves as a member of the Board of Advisors for her alma mater, UNC Chapel Hill’s Kenan-Flagler Business School, and is a sought-after speaker, advisor and thought leader for several HR-related technology startups. She is a graduate of the University of North Carolina at Chapel Hill, where she earned her Bachelor of Science in business administration. A renowned expert in her field, she has received multiple honors, including being featured in The New York Times, Fast Company, The Network Journal’s 25 Influential Black Women in Business and Savoy’s 2020 Most Influential Black Executives in Corporate America. She is also a member of the Executive Leadership Council (ELC), a network of black CEOs and business leaders who support the development of diverse talent and the promotion of social justice.'''
