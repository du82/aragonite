title = "Workplace Healthcare | SHRM Advocacy"
description = "SHRM is committed to providing American workers impacted by our over 325,000 members with quality, affordable health care coverage."
full_description = "SHRM Advocacy Workplace Healthcare According to SHRM’s comprehensive benefit survey, HR professionals consider health-related benefits the most important type of benefit an organization can offer, and 98% of employers make health care coverage available to their employees. Employers recognize that providing health insurance is vital to attract talent, even among organizations that are not subject to the employer mandate under the Affordable Care Act. SHRM's Position on Workplace Healthcare: SHRM is committed to advancing policy solutions that strengthen and improve the employer-based health care system, including preservation of the current tax treatment of employer-sponsored health plans. As the cost of health care continues to rise, employers are keeping a close eye on the benefits they provide to ensure their health and wellness offerings meet the demands of today’s workforce. Policies should be implemented to help employers provide quality, affordable health care for their employees. Johnny C. Taylor, Jr., President and CEO SHRM Requirements Related to the Mental Health Parity and Addiction Equity Act On October 17, 2023, SHRM submitted a public comment on the Proposed Regulations on Requirements Related to the Mental Health Parity and Addiction Equity Act (MHPAEA) issued by the U.S. Departments of Health and Human Services (HHS), Labor and Treasury. SHRM’s comment advocated for the future regulation to strike a balance that will encourage mental health care offerings in the workplace without creating a regulatory burden that might drive employers away from offering such benefits. SHRM-Supported Legislation: Telehealth Benefit Expansion for Workers Act of 2023 (H.R. 824): Improved access to telehealth allows workers to access health care options at their convenience and expands the services and providers available to them. This bill would seek to increase workers access to this vital benefit while ensuring the ability of employers to provide benefit options valued by their workers.Interstate Mental Health Compact Agreements: Interstate compacts, or contracts between states, allow professional counselors and psychologists licensed and residing in a compact member state to practice in other compact member states without the need for multiple licenses. Interstate mental health compacts are critical to bridging the gap in mental health care through telehealth. SHRM advocates for states to join the Counseling Compact and PSYPACT interstate compacts to expand access to workplace mental health through telehealth."
year_published = 2025
clearnet = "https://shrm.org/advocacy/policy/workplace-health-care"
