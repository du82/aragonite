["https://shrm.org/about/bio/nick-schacht"]
title = "Nick Schacht"
description = "Nick Schacht is a highly experienced executive with more than three decades of experience."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Nick Schacht Chief Commercial Officer for SHRM Connect Nick Schacht is a highly experienced executive with more than three decades of experience in professional services, education, and corporate learning and development. He has a history of driving product innovation, growth, and profitability, and he has led organizations operating worldwide. Schacht is Chief Commercial Officer for SHRM, the world's largest HR professional society. Before joining SHRM, he was the founder and CEO of KnowCyber, a learning and development company focused on improving the cybersecurity-related skills of people in all types of organizations worldwide. Prior to KnowCyber, he was President and Chief Operating Officer for PetroSkills, a provider of training and development services to the worldwide petroleum industry. Prior to that, he was CEO and President of Learning Tree International, a publicly traded provider of IT and management learning and development. Schacht was also the President of Global Learning Systems, a start-up focused on e-Learning and digital content. He served in a variety of capacities at ESI International, culminating in his role as President when ESI was sold to the Institute for International Research (IIR) and then as Group President for the Americas for IIR. He has been a Research Fellow at the Logistics Management Institute, and began his career as a U.S. Navy Supply Officer, on the headquarters staff of the Naval Nuclear Propulsion Program. Schacht graduated with honors from the U.S. Naval Academy, and holds Master's degrees in Administration from the University of Maryland University College and Information Systems Technology from The George Washington University.'''
