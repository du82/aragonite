["https://shrm.org/community/shrm-northern-california/about"]
title = "About"
full_description = "About SHRM Northern California Better workplaces for a better world starts locally Community SHRM Northern California About We are pleased to provide SHRM members in the San Francisco Bay Area with California-specific information and resources, access to California HR experts in SHRM’s Knowledge Center, and local networking events, seminars and conferences. This is an enhanced member benefit for SHRM members in the Bay Area. California has 16 SHRM chapters, but the Northern California group is a “community” that is part of SHRM. All SHRM members in Northern California are automatically part of this group and don’t pay any membership fees. Programs are open to all Northern California HR professionals, regardless of SHRM affiliation. Contact Us 1820 Gateway Drive Suite 170 San Mateo, CA 94404 650.609.2379 / 650.378.1327 norcal@shrm.org Customer Care 800.283.SHRM (7476) Monday - Friday 8:00am -8:00pm EST Connect With Us Leadership Gina Ayllon, SHRM SCP, CAE Executive Director, Northern California San Mateo, CA gina.ayllon@shrm.org @SHRMGina Anne Gamino, CMP Senior Specialist, Northern California San Mateo, CA anne.gamino@shrm.org Stefany Wilson Membership Engagement Specialist - Northern California San Mateo, CA stefany.wilson@shrm.org Steven Perrotta SHRM Director of Public Policy steven.perrotta@shrm.org Volunteer Opportunities Do you have an interest in serving HR Professionals throughout the Greater San Francisco Bay Area? Consider a volunteer role with SHRM NorCal. Volunteering with SHRM NorCal is a great way to connect and engage with other HR professionals in the Bay. It helps you foster new professional relationships, leadership skills, and insights you can bring back to your company. Volunteer Committee Applications for 2025 are now closed for 2025. If you would still like to be considered and to volunteer, please email us at norcal@shrm.org Click here to for more details on Committee Roles & Responsibility. Those who apply will be notified in December. There will be a Volunteer Orientation in January 2025. SHRM NorCal Project Volunteer The success of our community depends on the many volunteers willing to share their talents and time. Serving as a Project Volunteer is a great way to give back to the HR community and to network with your peers. It is also a great way to use skills you already have or to develop a new skill you need. An SHRM NorCal Project Volunteer participates when SHRM NorCal needs additional support for an event, such as being part of the Warmth & Welcome at an Educational Event or Meet and Mingle* and sharing your love of SHRM NorCal with attendees or supporting a committee with an urgent need to facilitate a round table. These are short-term and project-based roles that fill an important or urgent need. *Please note this does not include volunteering at the SHRM NorCal Annual Conference. BECOME A VOLUNTEER"
