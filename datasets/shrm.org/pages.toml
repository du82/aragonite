["https://shrm.org/community/membership-councils/membership-advisory-council"]
title = "Membership Advisory Council"
full_description = "Membership Advisory Council (MAC) The purpose of the Membership Advisory Council (MAC) is to serve as an interface between SHRM’s members, its Volunteer Leaders, its Executive Team and its Board of Directors. Community Councils Membership Advisory Council Membership Advisory Council (MAC) 2025 The Membership Advisory Council (MAC) serves as an interface between SHRM's Volunteer Leaders and the SHRM Board of Directors. The MAC is composed of one elected representative from each of the Regional Councils. The MAC provides input from the membership through the Regional Councils to the Board and feedback from the Board to the membership; and provides strategic input to SHRM to ensure optimum service/support to and from the volunteer leadership. 2025 MAC Representatives: NORTHEAST REGION CT, DE, MA, MD, ME, NH, NJ, NY, PA, RI, VT Susan Greene, SHRM-CP Chief Clerk Administrator (Chief Operating Officer-COO) Union County, Pennsylvania Lewisburg, PA E-mail: sgreene@unionco.org Sue Greene, Ph.D., SHRM-CP, PHR, CCT is the Chief Clerk Administrator (Chief Operating Officer-COO) for Union County, Pennsylvania. She holds a Ph.D. from Penn State University in Workforce Education and Development, Master of Science in Human Resource Management from Warren National University (private), and a Bachelor of Science in Workforce Education and Development from Penn State University. She has over 30 years of business, human resources, operations and workforce development experience that spans various industry sectors (profit, not for profit, healthcare, manufacturing, energy, government, retail, and education). Sue has been dedicated to her volunteer roles that span over 25 years in the Human Resource field. She started as a member of a local chapter, got involved on committees, joined the board, and moved into the Chapter President role for Susquehanna Human Resource Management Association. That position automatically gave her a seat on the Pennsylvania SHRM State Council. She continued to volunteer on Core Leadership Areas; Workforce Readiness, Certification, and District Director before moving into executive leadership as Secretary, Director Elect, and State Director. She is currently the immediate Past State Director. Sue has been recognized in other areas including an Athena International Leadership award recipient, a Women of Outstanding Leadership by the International Women’s Leadership Association, and a Woman of Excellence in Lycoming County through the YWCA. She served on the Commission for Women appointed by the President at Penn State University. She continues to give back to her community and participates on several executive leadership boards for Transitions and is the past chair of the Greater Susquehanna Valley Chamber of Commerce. Sue lives in Lewisburg, PA with her husband Dan and their fur baby Gracie. She is a lifelong learner, loves to share information about her research, and currently is working on SHRM’s Talent Acquisition Strategy credential. Sue believes it takes a village and enjoys paying back to her profession, community, and the next generation of leaders. Northeast Region Alternate: Orlena Cowan-Bailey, SHRM-SCP (CT) SOUTHEAST REGION AL, GA, FL, MS, BM, BS, PR, USVI, DC, KY, NC, SC, TN, VA, WV Shirley Rijkse, SHRM-SCP Lead Professor HR & Workforce Readiness Central Carolina Community College Broadway, NC Email: shirleyr.ncshrm@gmail.com Shirley boasts extensive HR knowledge gained from diverse roles, including healthcare, cosmetology, and retirement community management.She excels in curriculum design, teaching, and coaching, helping individuals and students achieve their goals.Shirley has demonstrated strong leadership, achieving platinum status for SHRM chapters, and initiating student scholarships. She also mentors professionals and students to embrace their talents and reach their dreams. In Toastmasters, Shirley has held club officer positions, club coach, and area director. Leading Youth Leadership programs is one of her passions.Shirley has served on numerous boards, currently on a soup kitchen board and a Guardian Ad Litem for children in District 11.She holds numerous qualifications, including an MBA, SHRM-SCP, and a Master Certificate in Data Driven Leadership, among others.SHRM Involvement: Shirley has actively contributed to SHRM at both the chapter and state levels, consistently exceeding expectations. Southeast Region Alternate: Chad Sorenson (FL) SOUTHWEST CENTRAL REGION AR, AZ, CO, KS, LA, MO, NM, OK, TX, UT Rose Ann Garza, SHRM-SCP Chief Human Resources Officer Kerbey Lane All Day Cafe Austin, TX E-mail: southwestcentralmac@gmail.com Rose Ann Garza is a dedicated HR professional and SHRM Volunteer Leader with a proven track record of cultivating a culture that encourages open communication, collaboration, trust, and innovative idea sharing. With over 25 years of experience in the field, Rose Ann has a deep understanding of how to listen, lead, and follow when needed. Rose Ann has held numerous roles at Kerbey Lane over the last 18 years, and was named the Chief Human Resources Officer in 2018. Kerbey Lane is the largest privately owned and operated restaurant group in Central Texas.Beyond her professional career, Rose Ann is a dedicated Volunteer Leader in the HR community. She began her service as a Volunteer Leader when she was a student, and quickly transitioned into an active member of the SHRM Austin community in her early 20s. Once involved in SHRM Austin she joined numerous committees, held director roles, and ultimately served as President of the Chapter. Her involvement in SHRM Austin led her to SHRM Texas where she has had the honor of serving as the Workforce Readiness Director, District Director, Assistant State Director of CLAs and District Directors, State Director Elect, State Director and is currently the Immediate Past State Director. As the State Director Rose Ann supported and juggled the many needs of the diverse chapters across Texas. During her leadership of Texas she led the development and creation of their own leadership development program, LeadHRs, which was awarded the SHRM Pinnacle Award in 2024. Rose Ann holds a Bachelor of Arts in Communication Studies from Texas State University San Marcos and a Master of Fine Arts from The University of Texas Austin. Rose Ann considers herself a lifelong student, approaching all situations knowing there is something to learn which is evident by the many trainings, conferences, and certifications she has worked to obtain throughout her career. Southwest Central Region Alternate: Linda Dausend (AZ) NORTH CENTRAL REGION IA, MN, WI, ND, SD, NE, IL, IN, MI, OH Jason Sutheimer, SHRM-SCP Human Resource Business Partner ND Adjutant General Bismarck, ND E-mail: jasutheimer@nd.gov Jason is currently the Human Resource Business Partner at North Dakota Adjutant General. Along with his current full-time position, he also serves as the Government Affairs Chair of the Central Dakota Human Resources Association, and the President of the International Association of Workforce Professionals.He holds a Master’s degree in Business Administration from the University of Mary; a Bachelor’s degree in Management Information Systems and Business Administration from North Dakota State University; and is certified as a Society for Human Resource Management – Senior Certified Professional from the Society for Human Resource Management, Senior Professional in Human Resources from the Human Resource Certification Institute, and a Certified Workforce Professional from the International Association of Workforce Professionals.Jason was recognized for this expertise through the 2016 ND SHRM Award for Professional Excellence in Human Resource Management and the 2020 Prairie Business 40 under 40. North Central Region Alternate: Julie Doyle (OH) PACIFIC WEST REGION AK, CA, Guam, HI, ID, MT, NV, Northern Mariana Islands, OR, WA, WY Christine Rodman, SHRM-CP Founder and CEO Lynx Employer Resources, LLC Santa Rosa, CA Email: pacwestmac@outlook.com Christine Rodman is the founder and CEO of Lynx Employer Resources, LLC, driven by her steadfast commitment to imparting knowledge and expertise in human resources and compliance. With more than 25 years of progressive HR and training experience, including 10 years of HR consulting and 5 years co-building Lynx Employer Resources from the ground up, Christine has developed strong business acumen and a proven ability to make tough decisions while prioritizing the best interests of the HR community. Her consulting work has been particularly impactful for small to mid-size businesses and nonprofits, helping them navigate the complexities and challenges specific to California’s employment laws and regulations.Throughout her career, Christine has successfully designed and facilitated numerous training and mentorship programs to increase productivity, ensure legal compliance, and boost morale across a wide range of industries. Her strategic approach to HR, combined with her passion for fostering inclusive and effective workplaces, has positioned her as a trusted advisor to organizations and leaders throughout California. Christine is deeply passionate about elevating HR within California, actively sharing ideas across chapters, and delivering a return on investment through SHRM membership and networking opportunities.Christine holds a bachelor’s degree in Ethnic Studies from San Francisco State University, a SHRM-CP designation through SHRM, and an HR Management Certificate from Sonoma State University, where she currently teaches Talent Acquisition and Total Compensation.Dedicated to giving back to both her profession and community, Christine has served as State Director for the California State Council for SHRM and formerly the co-chair for HR Roundtable II of Women for Wine Sense. She has been actively involved with various community organizations, including the Volunteer Center of Sonoma County, Chops Teen Club, and the YWCA.Outside of work, Christine enjoys scuba diving, snowboarding, running marathons, traveling and spending time with her family and friends. Pacific West Region Alternate: Sarah Elkinton, SHRM-CP (OR) SHRM Staff Michael P. Aitken Executive Vice President HR Professional Solutions Email: mike.aitken@shrm.org Gloria Sinclair Miller, SHRM-SCP Vice President, Membership & Customer Community Experience Email: gloria.sinclairmiller@shrm.org Meredith Nethercutt Director, Volunteer Leader Community Email: meredith.nethercutt@shrm.org"
