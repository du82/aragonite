["https://shrm.org/about/bio/nilanjan-adhya"]
title = "Nilanjan Adhya"
description = "Nilanjan Adhya is a member of the SHRM Board of Directors."
full_description = '''Connect Linked In Facebook Twitter Email function openEmailClient(anchor) { var recipient = anchor.dataset.emailid; var mailtoLink = "mailto:" + recipient; var newWindow = window.open(mailtoLink, '_blank'); if (newWindow) { newWindow.focus(); } } Nilanjan Adhya Chief Digital Officer at BlackRock Connect Nilanjan (Neel) Adhya is the Chief Digital Officer of BlackRock — the world’s largest investment management corporation. In his role, Neel actively collaborates with marketing, design, product, and sales teams at BlackRock to reimagine all aspects of digital experiences, create new digital innovations, build great experiences, and accelerate transformation across the digital ecosystem. He is passionate about blending design, data, and cross-functional teams to create experiences that people love. Neel has over 20 years of experience working at the intersection of technology, platforms, and people to help global organizations leverage new business models and drive growth. Prior to BlackRock, Neel was the Chief Digital Officer of IBM’s Cognitive Applications Unit and Vice President of Digital Transformation where he was instrumental in building the digital platforms that power experiences for IBM’s cloud and AI products. Neel is a keynote speaker at several digital and innovation-focused industry conferences. He frequently shares his thinking on building innovative products and driving transformation in his blog and on LinkedIn. Neel lives in Fairfield, CT with his wife and two kids.'''
