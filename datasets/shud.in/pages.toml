["https://shud.in/thoughts/labyrinth-of-borges"]
title = "博尔赫斯的迷宫 - Shu Ding"
full_description = "博尔赫斯的迷宫 我走入博尔赫斯的迷宫，天上的月亮开始被填充。指针在融化，我跟随它的痕迹去翻越破败的转角与褐色的高墙。我穿过一条流向天际的河流，河水再从天顶的裂缝渗落成雨。我越过一座传来古老回声的山坡，山脚堆满了未完成的陶罐。我遇到一面刻着我无法阅读的长诗的断碑，与它一同保持心照不宣的沉默。我看见镜中的盲人，伟大登山者的骸骨，沉落海底的铜匙。我遇见冰原上滚动的巨大的笔杆，我听见浮在云中呼啸的船帆。我梦见断崖尽头通天石柱的倒塌，梦见我走失的瘦弱的马。我在沙丘上翻开一本时间之书，星斗也随之转动。我不断前往上一个昼夜，造访阿刻戎河岸无尽亡魂的记忆，嵇康头顶万片竹叶的呼唤。我无数次踏入所有前人留下的脚印，审视每一个宇宙中每一种可能的命运，写完世上任何一本书。我走入时间的终结，只剩下难以遗忘的自我、难以击穿的孤独、难以消解的困惑。在我最后有限的记忆里，月亮终于化为无法流传的历法、无法填满的沙漏、无法飘散的迷雾。因而我失去了时间，时间也失去了我。 Sidenote: 日内瓦博尔赫斯之墓，二零二一"
