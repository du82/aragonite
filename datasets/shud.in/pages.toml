["https://shud.in/projects"]
title = "Projects - Shu Ding"
full_description = "Projects Over the past years, I’ve been super lucky to work with some amazing people, on a variety of great projects, ranging from open-source libraries to large-scale applications. I have been a core maintainer of Next.js since 2020, collaborating closely with the React team to drive significant advancements. I led the development of Streaming SSR, Edge Runtime, React Server Components, Server Actions and other major architectural improvements in Next.js. Working on a large-scale project like Next.js is both challenging and rewarding. Innovating on the foundation while maintaining a balance between features, performance, and simplicity is a delicate art. I co-created v0 with Jared Palmer, Max Leiter, and shadcn in 2023. I helped design the application architecture and implemented multiple parts of the core AI and streaming pipeline. Vercel AI SDK I designed the very first version of client-side hook APIs, implemented function calling, RSC and data APIs for AI SDK. Besides it, I also developed the initial AI playground and documentation site. I created SWR with Guillermo Rauch in 2019 as the first hook-based, stale-while-revalidate data fetching library. Led its development for 5 years. Paco Coursey designed the delightful SWR logo. Nextra is one of the most popular Next.js based documentation solutions. Prior to Nextra, there is no good documentation solution for Next.js. I created it in 2020 and led the development of Nextra v2 in 2022, which powers many of my projects’ homepages. Satori Satori is the first CSS-to-SVG render engine that does not rely on a browser environment. I created Satori in 2021 for Vercel’s OG Image Generation project. Given the good balance between size, performance and compatibility, Satori now becomes a semi-standard way of generating social cards in many popular Web frameworks such as Next.js, Nuxt.js, SvelteKit, and many others. COBE COBE is maybe the smallest (5kB) web 3D globe implementation, with a minimalistic style. I made it in 2021 to optimize Vercel’s homepage performance (story), and it seems to become a popular choice for many websites. React Wrap Balancer React Wrap Balancer was created in 2022 to improve the typesetting of the Vercel blog, which was later ported to Vue and Svelte. I believe this library helped pushing forward the development of the CSS standard text-wrap: balance. Next View Transitions In 2024, I created Next View Transitions for Next.js as the View Transitions API is becoming stable. My other side projects (find all of them on GitHub): Y86 CPU Simulator Metaballs Mak Ink Frosted Glass Composable SVG Shaders Flappy Cube Creative Coding Template Fluid Photo Gallery Infinite Scroll Indicator Border Gradient Fade-In Animation 1 Fade-In Animation 2 Fade-In Animation 3"
