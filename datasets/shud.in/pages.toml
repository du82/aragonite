["https://shud.in/thoughts/false-premise"]
title = "伪命题 - Shu Ding"
description = "这篇文章由我二零一三至二零一七大学四年期间零零散散的日记和随手笔记整理而成。大多杂乱无章，段落间并无逻辑；又各有语境，无所谓对错。但弃之可惜，我只在此写下，以作记录。"
full_description = "伪命题 这篇文章由我二零一三至二零一七大学四年期间零零散散的日记和随手笔记整理而成。大多杂乱无章，段落间并无逻辑；又各有语境，无所谓对错。但弃之可惜，我只在此写下，以作记录。 一、世界的来信 这些年来看到的诸多新闻、一遍遍回忆起的旧闻，反复轮替直至全都光芒黯淡。我不断记起某晚写下的一句话，人有希望，但人类没有希望。虚无主义者难以往后看，不留神走到历史视野下，一切都是稍纵即逝的追寻，劫数轮回。沉默是因为难以不沉默。但我也由衷钦佩这些不持沉默的罗曼罗兰笔下的 “英雄主义” 者们，你们已经胜利。 我似乎是以一种观察者介入其中的；庆幸的是，观察者可以随时逃离；悲剧的是经历者们却不能。世界线在这一刻分裂了；两种可能性以概率的方式并存：我是观察者和经历者。 二、沉默的声音 当然这种基本命题往往是循环依赖，闭口不谈才可能是完全的正确。但闭口不谈无法交流，一开口却产生悖论。所以选择真理的人选择死亡，选择妥协的人 “当我沉默着的时候，我觉得充实；我将开口，同时感到空虚”。再往下想，“就像发现生活的荒诞性使他们有可能毫无节制地投入荒诞的生活”。我称其为伪命题。 但我绝不能接受没有片刻沉默的反驳。 三、自我有所附丽 所有人都在以 “不同的方式” 追寻永生。 设计是对平衡的理解。是一种值得每一个人学习的思考方式。 周作人说，“我們看夕陽，看秋河，看花，聽雨，聞香，喝不求解渴的酒，吃不求飽的點心，都是生活上必要的——雖然是無用的裝點，而且是愈精煉愈好。” 終日讀著作興的書，鬧著無謂的心。精雕琢的顯蒼白，却突然間发觉恍惚度日。要是《匆匆》编在高中课本里多么好。 沉默者可能是伟大的人，我因他们不易察觉的流露，对其致以巨大的敬意。语言源于交流，过度带来吵闹。如果一定要以标准衡量人，只能依靠作品。 我一直想找机会去坦白承认，这几年的自己变得很糟，但又觉得或许没那么糟。一直在与自己和解的路上，但似乎还要花更久的时间。写下待删的文字，彷徨于虚无。我害怕于这些痛苦是否与他人的痛苦不同，同时分裂于理性感性过去现在内部外部的混沌之中。一切也没那么坏，甚至更好。“一个人要像一支军队”。离家越来越远的我，也越来越肯定这一点了。 稳定乃是不安的起点，不安是稳定的起点。笼与天空相对偶，没有任何不同。 这样一想，浦泽直树应该是深受西方文化影响的。他可以领悟到相当精髓，但创作上还比伟大还差一点。这方面，今敏就是大师：我们很难去追寻到他的灵感之源——似乎包含很多，但又不一样。同样我也在莫比斯、大友克洋、松本大洋，以及电影、音乐中看到各式各样的闪光点和隐隐连起来的线，这一切都令人惊奇。如同爱因斯坦所说，伟大的创作者懂得隐藏自己的灵感来源。 予我力量的东西，还将一直给我力量。 人对形式的迷恋本质上还是对内容的迷恋，其剩余只是仪式感。内容一定需要通过形式来表达。不同的形式如同投影一般表达出作者的本意，再由我们还原（补全）回意识。这个过程是有损耗的，不同的投影方向、维度，损耗是有不同的。而形式和内容共同组成了我们的认知。那种模糊的 “补全体验” 是其中最神秘的，它带来 “美”（The most beautiful thing we can experience is the mysterious）。游戏只是另一种投影，或许其维度更多于音乐或文字。一方面其表达能力的局限得到了拓宽，但另一方面对于表达者而言，其选择表达形式的难度也变大了。 我希望成为一个创作者。这世界上没有困难。一切问题都是自己与自己的问题。 每天不早不晚醒来，对着镜子时总有莫大的心理压力。刷牙中又时不时去想，刚才手机是否振动了一下。其实什么也没有，或者是些广告推送。如同他总在发呆时候，有什么人或者事情会突然冒出来，就像刚刚的广告推送一样，打破现有的一切，又或者没有。这便是生活感的建立了。 给人希望究竟是好是坏呢？每当我想到此，就记起鲁迅先生的那句话，“人必生活着，爱才有所附丽”。 去性格因素和其他考虑，刚才还一直在思考着为什么。于是又翻了出来心底里的野草。也许是这样，鲁迅对我影响实在太深刻。秋夜和影的告别无非是外部和内部，它们同教会我沉默。而沉默教我看到更多此前错过的好东西。当一个小孩不时困惑地记起那些文字意象、占有他的大脑而无法抹去之时，如同他人生第一次看到自己的影子一般：意识到影子成为了自己的一部分。这种意识是不自知的。人确是矛盾的。一方面呜呼呜呼，一方面又不愿接受，不如彷徨于无地。鲁迅清楚虚无是虚无，又觉得虚无乃是实有，还说自己偏激。每当想到这些，都会是我最安静的时刻，我感到我的存在。 四、时间与空间的记忆 阿尔卑斯山下 我从未想象过这样一个夜晚。在奥地利小镇的旅馆阳台上，看着不远处阿尔卑斯山脉的轮廓，山腰上零零碎碎的帐篷灯光，星星点点的天空。我读起搁置一半的《雪国》，喝着威士忌，不愿睡去。 上海 周一夜里我还想着做点什么，而这已浑浑噩噩到了周四；我又记起开春时也想做点什么，入学时似乎也是。在这焦躁不安的日子里，想沉下心来，就如真弄出点什么动静一样不容易。昨夜里又一个人吃饭回来，看到宿舍楼后挂着巨大的月亮。面前阴冷的路笔直铺向宿舍，而身后影子嗖嗖地拉长，推着我向前。 但今天夜里，我走出教学楼，从一簇簇人流中穿梭而过，教室和街灯的光点散在我眼睛边缘。熙攘、模糊。我无能为力，只得低着头继续走。读的每一个字都无味，写的每一个字都肤浅。我不断地在纸上画出高塔，走着自认为对的路。颇为无力，这却是我一生的故事——从二十年前，到这一瞬间。回想这二十年的人生，满是自己划下的遗憾。我辜负了一些想法，但庆幸我不曾忘记它们之中任何一个。一个人怎样才能成为刀锋呢？这些文字还是很幼稚。 尖沙咀 我转身望去，那条队伍已被淹没在霓虹灯之中。又看到刚刚街角倚墙吸着烟的男人的侧影，旁边是堆满垃圾的巷口，里头深不可测。再往前走，只转身随便可步入一间街边楼道，整个旺角即会突然间消失，声音与灯光也戛然而止。这个世界上，狂欢往往相同，但所有沉默都是独一无二的。 之后深夜去喝酒，友人开玩笑地说要不要来杯 “港男” 尝尝，大家都开心地笑了起来。人们喜欢拍照，照片可以神奇地暂停住时间的画面，为语言所不可及。但它是那么瞬时精确，以至对于此后的观者而言不够准确。甚至我再从维多利亚港的照片回想去，只有记忆中轻轻的低吟声。那种模糊的不确切感究竟是什么，将再也不能被知道了。 还有太平山顶的风起云涌。那不知来去的孤寂的人们……都不存在了。再不见吞掉人们的街口。没有相逢、别离、苦难、喜悦、酒和故事。一切都变为港湾之下沉沉的，轰轰隆隆的幻想和数不尽的楼宇，一个精密的机械。 写到这里，我想起离开香港的飞机上，后排一位轻声哭泣的学生。广播通知延误的时候我听到，似乎是她父亲在医院，即将离世；我一直忍不住去想到包里的那本圣经，随后拿外套时候还碰到它。我想，宗教意味着什么呢，我被米开朗基罗的穹顶覆盖着的时候，神性是怎么降临的。如同窗外隐隐的轰轰隆隆。 但起飞的那一刻，看去乌云密布的天空，吵吵闹闹的人，空气却变得释然了。我想到一些文章……北岛，青灯里提到的香港，波兰来客里的句子，还有北岛与他的父亲。但我也知道，走出机舱这一瞬间她就会消失在人群中，变成每一个普普通通的人……像我站在在红磡街头的车流中；每一个人，都与这飞机一起划过天空，再散落在世界上。我只能什么也不去想，戴上耳机听起尼尔杨的 See The Sky About To Rain。但城市并不会记得你。 与我的房间相遇并分别 在家最后一天夜里，我起身去关上灯。看到手机微弱的光，映着我的影子到墙上。我的轮廓模模糊糊，就像一个人被击碎、影子飞溅到墙上，分辨不出这与十年前的自己究竟有何分别；我的墙也依然雪白地立在那里。是啊，我与我的墙又一次相遇了。 此刻我想起一句话，这是王尔德的遗言：墙纸越来越破，而我越来越老，两者之间总有一个要先消失。 我记起预科时训练结束，回往邯郸校区的路上，渐渐远去的外滩，星星点点，像海一样。整个夜空都装在校车里，漫溢出来。我记起去往重庆的飞机，一片缓缓降落的梯田。我记起在奥地利的环山隧道，山间景色和道道灯光交错而过，像二十四格胶片闪烁。我记起我每次离开一个地方，义无反顾，都一闪而过。 余光中提到安东尼奥尼的黑白影像，记忆和念想，等等、等等。恐怕就是类似的时候。 金色梦乡 高中最后几节语文课上，我已经没有升学压力。陈老师在讲古文，而我在下面看《苏菲的世界》和《美学》。老师绕着教室，走到我身边悄悄说，跟着听听吧。而今我才感到，自己那点实用主义早被发觉。那时候哪里知道会失去语文。 而迫不及待迎接我的只是标签式的文艺了。 北京的秋夜 每到这样空气渐寒的夜晚，我都会突然想起《秋夜》来。除此之外，刚才面对的一切，严肃或有趣的，都变成静止的寒冷空气中某一团雾。散去不可察觉的温暖和湿润。那迎面的寒气，天空中圆满的月亮，冷冰冰的雨水，在我昏暗的台灯下，也都一同散去。 说渐寒就是沉湎于疏离。像这些文字也都冰冰凉凉，棱角分明，互不黏着。手摸上去就寒意散开，产生一丝温度；退一步又模糊。大脑也是，所披着的毛毯也是，没有感受，没有压力，没有附着，没有一点汗，但有点距离。 而突然间我又被唤起那文字间隙交替着互相对比的一切，冷风中的灯火，广阔的天地和细小的飞虫，寂寞的烟，惨白的月，鬼魅，和红红绿绿的花草与落叶的梦。一切幻想，一切希望，像野草和春火。谁又可以说这秋夜不是他另一个梦……只在这字里行间，或是幻觉中，它们才可被如此合适地摆放。如刘所言，野草是双重尽头。我只能这样去想，也作敬奠这些不知名的夜晚了。 五、杂言絮语 我呆滞地看着刺亮的屏幕上红红绿绿的代码覆盖着的不紧不慢闪烁光标与相接的键盘，还有粘在键盘上动弹不得的手指后面长长的神经连回呆滞的目光抖动起来，一股恶心感在眼前剧烈晃动。 我们相互窥视／语言轰然响鸣／舌尖碾过每个字／指尖点燃每个词／你戛然而止／夜无尽蔓延。 对这座教堂而言，我与它合影的意义是什么？即使我死去一百次，它依然矗立在那里。我抬眼望去，那十字架像一柄长剑，坠下，径直朝我劈来。我才突然意识到那已不是过错，是罪责。我并不愿意向你描述那苦涩：我开始意识到，同情自己的人是怯懦的。但是，我终于还是撑不住动笔了。 和学霸聊起最近的事情，感觉到一种深深的、深深的迷茫。发呆时又羡慕 Jobs 在二十岁就可以放手去做一切。真是，“當你老了，回顧一生，就會發覺：什麼時候讀書，什麼時候決定做第一份職業，何時選定了對象而戀愛，什麼時候結婚，其實都是命運的巨變。只是當時站在三岔路口，眼見風雲千檣，你作出選擇的那一日，在日記上，相當沉悶而平凡。當時還以爲是生命中普通的一天。” 又是：“如果我能够从头活过， 我会试着犯更多的错。 我会放松一点，我会灵活一点。 我会比这一趟过得傻。 很少有什么事情能让我当真。 ……”，不可知。 如今很多角落已经像藏在夜空中的星座一样，把光辉连了起来。技巧开始显现，符号悄然消失，最终神话般的隐喻把一切拼到一起。 我们停止缪谈吧，时间已不早了。 But I am just another line in the field of time."
