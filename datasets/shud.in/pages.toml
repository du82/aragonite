["https://shud.in/thoughts/cobe"]
title = "COBE: WebGL Globe in 5kB - Shu Ding"
description = "How to build a WebGL globe with only 5kB of code."
full_description = '''COBE: WebGL Globe in 5kB This blog post was originally published as a Tweet thread. COBE5kB WebGL globe lib.https://github.com/shuding/cobe I made github.com/shuding/cobe a while ago: a 5kB globe lib, and it improved our page performance by almost 60%. How was it created? First of all, today's popular WebGL libs are usually sized at hundreds of kilobytes, but there are also lightweight choices such as github.com/vaneenige/phenomenon and github.com/xem/W. All of them are wrappers on top of the WebGL standard APIs, but with different feature sets. Earlier this year we were using a Three.js based solution. The globe is a SphereGeometry that loads the full world map JPEG as texture. Every visitor will spend ~40kB loading that image, and it still felt blurry so we couldn't optimize it further. We tried to set a higher texture anisotropy (threejs.org/docs/#api/en/textures/Texture.anisotropy) which improved it a bit, but that's still a trade-off between performance and quality. Some day I read this great post by GitHub: How we built the GitHub globe. They're not rendering an image, but thousands of dots, on the globe. So a lot of information loss (size win!): no more sharp edges and rich detail, but still looking amazing. How we built the GitHub globe | The GitHub BlogGitHub is where the world builds software. More than 56 million developers around the world build and work together on GitHub. With our new homepage, we wanted to show how open source development transcends the borders we’re living in and to tell our product story through the lens of a developer’s journey. Now that it’s […]https://github.blog/2020-12-21-how-we-built-the-github-globe/ But one bottleneck in that GitHub approach is, they have to reduce the number of dots from ~12,000 to ~8,000 to keep it fast, because they are using a loop to generate those samples. However the work here can be parallelized. The idea of using a shader came to my mind naturally. To start with that idea, let's create a shader to draw a sphere, and a 4096×2048 world map as the texture (80kB): color = isOnLand(x, y) ? light : dark Then we can render some kind of lattice on the globe, like this a basic one: color = isOnDot(x, y) ? light : dark By multiplying them, you get a dotted world map: color = isOnLand(x, y) && isOnDot(x, y) ? light : dark It's interesting that, thanks to the sampling, if you downscale that texture from 4096×2048 (80kB) to 256×128 (1kB), the dotted world maps look almost the same! Since it's small enough, I just inlined it in the lib as a base64 string: data:image/png;base64, You might noticed that the sampling doesn't feel good especially near the North Pole. That's because we are evenly putting samples by longitude and latitude, not by density. A better way is Spherical Fibonacci Lattice, example by @mbostock: Spherical Fibonacci LatticeRef. extremelearning.com.au The lattice is expressed as a sequence of points in the unit square . Each point is converted to spherical coordinates (longitude and latitude in radians) by the inverse cylindrical equal area projection: . Appendixhttps://observablehq.com/@mbostock/spherical-fibonacci-lattice There's also an excellent animation by @cristobalvila showing the math behind this: Nature by NumbersA movie inspired on numbers, geometry and nature, by Cristóbal Vilahttps://www.youtube.com/watch?v=kkGeOWYOFoA But one blocker was, to use a shader we have to compute the nearest point in the Fibonacci lattice from the current coordinates. Whereas most implementations today are producing these points kinda "unpredictably", which makes it difficult to render on a GPU. Then I saw shadertoy.com/view/lllXz4 created by @iquilezles, which implemented an algorithm to map a point on a sphere to its closest Spherical Fibonacci point! Here's the paper if you are interested: Spherical Fibonacci Mapping. So now we finally got everything ready. The sampling looks good with the new algorithm: We also got rid of the precision error by rounding before sin/cos as well as @farteryhr’s amazing mantissa trick, if you want to know more about that part: https://twitter.com/shuding_/status/1470068674560155650 https://github.com/shuding/cobe/pull/8 https://github.com/shuding/cobe/pull/9 Finally, we can add some phong lighting and glow effect to make it look good. And the last step is to use @evanwallace’s glslx to compress the shader for distribution. This library now powers vercel.com and vercel.com/edge :) Develop. Preview. Ship. For the best frontend teams – VercelDeploy web projects with the best frontend developer experience and highest end-user performance.https://vercel.com'''
year_published = 2025
