title = "不存在的乡愁 - Shu Ding"
description = "“I want to feel nostalgic, I want to feel like there’s this place, just a couple subway stops away, where everything will be alright.”"
full_description = "不存在的乡愁 两年前临近毕业之际，去港中大附近徒步。山脚下杂草丛生，周边也平静而祥和。在山上爬了长长的阶梯，最终也还是半途而废。 还没有毕业的孩子，对于未来只有些懵懂的紧迫。但回望过去，却找到一种存在于回忆中的生命力。我那天的日记写下了形形色色的人，复杂的世界，还有奇异的梦。 但一切都那么困难。此时我只想翻译一段 Aaron Swartz 的话： 天空渐渐被阴云笼罩，学生们逐渐散去。有些还留在校园里，但也都低下头急匆匆地走着。突然间，我感到疲倦，也越来越悲伤。不知道为何，有这么多东西从我身边悄然逝去。 我想去怀旧；我渴望找到一个地方，只有几站路远，一切却都安详宁静的地方。那里有更好的一切，我属于它，它也会一直愿意接纳我。但当我去到那个想象中的庇护所，才发现这个无力的现实：它并不存在，它从未存在过。我只是在怀念一个不曾存在的地方。 如同我的校园时光，如同一个美丽幻影的淡去。"
