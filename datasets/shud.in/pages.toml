["https://shud.in/thoughts/the-form-of-experimental-literature"]
title = "实验文学的形式 - Shu Ding"
description = "记录一些让我印象深刻的实验文学作品及其他。"
full_description = "实验文学的形式 此文章是知乎 关于实验小说 问题的回复，这里作为记录。 在传统小说的基础上，除了题材的区别，实验小说更注重时空、体裁、手法、体验上的创新与开拓。 首先是乔治·佩雷克的大部分作品。《人生拼图版》：空间的关联、《53 天》：递归的故事、《W 或童年回忆》：时空的盘旋、《消失》与《重现》：字母的游戏。 纳博科夫《微暗的火》，尝试了超文本（hypertext）写作。@离线 曾有过 一篇文章 介绍： 四种截然不同的文本形式（诗歌、前言、索引、注释）经过纳博科夫的组合形成了一个三维式的故事结构。文本间的关联词相互指引，相互关联，阅读这部小说如同在一座庞大的迷宫里探险：读者既可以阅读谢德的自传诗，了解他的一生；也可以跟随金波特的线索，窥视这位同性恋者对谢德的崇拜与爱恋；还可以根据文本提供的信息，自己摸索出作者特意隐藏的一条主线，两人背后的命运纠葛，误杀、阴谋、逃亡，一个令人战栗的发现之旅。 卡尔维诺《如果在冬夜，一个旅人》，反复打破第四面墙。《看不见的城市》、《交叉命运的城堡》也很有意思。 Mark Z. Danielewski 的《House of Leaves》，目前还没有中译本。引用 微批文学 的介绍： ……小說的內容會影響文字的排列方式，Navidson 一行人探索迷宮時，發現某處可游繩下降，在頁面上則可看見，本來的文字都置於頁面上方，直至他們都到了下層，文字則只顯現在頁面最底。另一個例子是，迷宮中有人發瘋了，朝他人開槍，文字則模仿子彈的行進軌跡，整頁只有一行字，連綿數頁，直至子彈打穿木門，碎成幾個散碎的段落。這一種以文字模擬內容的排版方式，在 Mark Z. Danielewski 後來的作品中也屢見不鮮。 除了這種平面上的操作外，House of Leaves 更有一個章節，當中頁面左右各有一個框框，內裡寫有文字，必須翻揭書頁才能讀下去，一邊次序由前到後，另一邊則由後到前，另外頁面左右的旁註也有類似的處理。如此的設置，就彷如在書中打開了兩條通道，兩道樓梯，可供讀者從一邊走下去，在另一邊走上來。如是，書本的平面就此打破，築成了三維的空間，書籍本身就裝載了一個可以目視的迷宮。 Alain Robbe-Grillet 的大部分作品。他是 新小说 代表人物，作品里充满了隐秘感和对于时空的想象，可以移步 张佳伟的评价。 以及我最爱的博尔赫斯的部分作品，《小径分岔的花园》、《巴别图书馆》、《沙之书》等等。博尔赫斯是一个很会偷懒的人。他不写长篇实验小说，但常常构想出一部奇妙的、不存于世的作品，与现实世界混杂在一起，留给读者和剧中人想象与回味。可以由他较短的一段《死镜——B/B》起走入这个深坑。 另外，还有更常见一些的，诸如辞典体、日记体、笔记体、口述体等等。如《哈扎尔辞典》、《狂人日记》、《S. 忒修斯之船》、《我弥留之际》。最近一次读到惊艳的作品，是朱岳的《说部之乱》。特德·姜的《你一生的故事》中双线、反向、交错叙事，也让我印象深刻。 在我眼中，既然已经开始 “实验” 了，就不应该局限于文学的范畴。不仅仅是娱乐，实验小说可以与任何东西结合起来。正如近些年流行的 “图像小说” 与 “交互电影”，均属 “实验”。如果愿意拓宽，许多游戏也完全应归于此类。一些在叙述性上创新的推理小说、漫画也如此。去思考体裁（媒介）对于作品的表达力的影响，是一件相当有趣的事情（请读《理解漫画》，对于此类创作解释得最为透彻）。 再说到游戏与漫画，《她的故事》、《奥博拉丁的回归》、《时空幻境》（以及其灵感来源之一《爱因斯坦的梦》）、《画的秘密》、《这里》、《3 秒》、《阿扎克》……。故事本身未必好，但一定足够实验。在这些作品中，天马行空的想象、时空的倒错、故事载体的变化、叙事本身的突破，都是家常便饭，如同埃舍尔的画作一般。如果我们认为电影与戏剧也是文学的一部分，则会有更多的例子……"
year_published = 2025
clearnet = "https://shud.in/thoughts/the-form-of-experimental-literature"
