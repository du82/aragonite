["https://sia.tech/roadmap"]
title = "Sia - The Sia Foundation Roadmap"
description = "This Sia roadmap provides mid to high level insight into core Sia development. It will be updated once a quarter at minimum, and will show an outline of what we’re currently working on, why we’re working on it, and what we have in mind after that’s done."
full_description = 'The Sia Foundation RoadmapThis Sia roadmap provides mid to high level insight into core Sia development. It will be updated once a quarter at minimum, and will show an outline of what we’re currently working on, why we’re working on it, and what we have in mind after that’s done.Our primary development goal for 2024 is to launch the “v2” hardfork. “v2” is our codename for a massive overhaul to Sia’s consensus mechanisms. It will modernize Sia’s core consensus code and provide a number of usability, performance, and quality-of-life improvements to the network. After the hardfork, we will be working on reducing onboarding friction for users, developers, and enterprises including: Light worker agents for renterd to increase horizontal scalability for enterprises, but also enable users to download and upload objects from all of their devices. Simple SDKs for developers to interact with the Sia network directly. A mobile and web app that lets all users take advantage of the cost savings, privacy, accessibility, and performance advantages of decentralized storage without the hassle of buying crypto or managing storage contracts. Project Board “v2” hardfork “v2” is an umbrella term that refers to an upcoming radical overhaul of Sia’s consensus code. The primary change is the transition from a large, unwieldy database of UTXOs to a compact cryptographic accumulator, bringing myriad benefits to performance, scalability, and functionality. This is a big deal: it requires changing the block and transaction formats, which have been untouched since Sia’s mainnet launch back in 2014. As such, we are taking this opportunity to clean up a few other warts in Sia’s consensus code, giving the project a solid foundation for many years to come. For a more technical dive on how Utreexo works, check out Luke’s blog post here and MIT Bitcoin talk here. Highlights UTreexo Near instant syncing Reduced blockchain size Improved UTXO spend policies “Composable” unlock conditions HTLC support for atomic swaps Storage contract changes Early contract termination Collateral efficient renewals Milestones August 2024 Reset Anagami testnet - Complete November 2024 Upgrade Zen testnet December 2024 Release v2.0 ready software Announce activation dates RHP4 RHP4, short for renter-host protocol 4, is the next iteration of the protocol hosts and renters use to communicate. Our goal for RHP4 is to increase the parallelism of data uploads, reduce protocol overhead, and improve download performance. A new protocol is required to enable some exciting new features to be available after the Utreexo hardfork, such as early contract termination, capacity reservation, and contract renewal fund rollover. RHP4 will also enable storage consumers to download and upload data directly in the browser without installing additional software. Highlights Improved upload and download performance Concurrent uploads Decentralized uploads and downloads in a browser without downloading software Milestones October 2024 Implement RHP4 client in coreutils - In Progress December 2024 Release Sia SDK beta - In Progress renterd The new Sia renter, replacing the current siad renter module. Drawing on what we’ve learned from siad, skyd, and us, we designed renterd from the ground up to be modular and horizontally scalable. Although the average user likely won’t notice, a renterd deployment is actually a set of interconnected services. As such, it can distribute workloads in parallel across multiple machines, and can be configured to store its metadata in any SQL backend. This flexibilty makes renterd easier to integrate with other Sia ecosystem software, such as Sia Satellite and S5, and addresses the scalability barriers that have historically hampered enterprise solutions. Milestones August 2024 Price pinning for gouging settings - Complete October 2024 Add support for RHP4 - In Progress November 2024 Release hardfork ready v2.0.0 alpha December 2024 Release hardfork ready v2.0.0 hostd The new Sia host, replacing the current siad host module. The host module has been chronically neglected for years, and suffers from poor upload performance, data integrity issues, and a general lack of user-friendliness. hostd is our greenfield reimagining of the Sia hosting experience, bringing a sorely-needed refresh to our host community. Aside from addressing performance bottlenecks, hostd also -offers superior metrics and monitoring tools, which will allow users to make informed decisions about storage allocations, contract parameters, pricing, and quality of service. Milestones October 2024 Add support for RHP4 - In Progress Release hardfork ready v2.0.0 alpha December 2024 Release hardfork ready v2.0.0 walletd The new Sia wallet, replacing the current siad wallet module. walletd aims to be the go-to option for average holders, lite wallet developers, exchanges and miners that need a secure place to store their SC. Accordingly, it supports both hot and cold setups, including multi-sig schemes and hardware wallet integration. Like renterd and hostd, walletd comes packaged with a sleek, yet powerful UI, which can be securely accessed from any device. Note: you do not need walletd to be a renter or a host; renterd and hostd include their own built-in hot wallets. Milestones September 2024 Improve support for exchanges - Complete December 2024 Release hardfork ready v1.0.0 explored The new Sia explorer, replacing and going far beyond the current siad explorer capabilities. explored will serve as both a standalone blockchain explorer with a web interface, and as a library providing powerful indexing and searching capabilities to third-party explorers (e.g. SiaStats) and “lite-client” systems like narwal. explored will be developed and launched alongside the Utreexo overhaul, making it one of the world’s first Utreexo-native block explorers. Milestones October 2024 Beta release December 2024 Release hardfork ready v1.0.0 Document version date: Oct 24, 2024ActivityMar 1, 2025SiaFoundation/hostd#622 Update README.md [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } in docker compose - it has to be hostd, not hostFeb 28, 2025SiaFoundation/hostd#621 Add v2 contracts endpoints [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Adds two new endpoints for querying V2 contracts [GET] /v2/contracts/:id Returns a single V2 contract by its ID [POST] /v2/contracts Queries a list of contracts with optional filtering Example request body { "statuses": [], "contractIDs": [], "renewedFrom": [], "renewedTo": [], "renterKey": [], "minNegotiationHeight": 0, "maxNegotiationHeight": 0, "minExpirationHeight": 0, "maxExpirationHeight": 0, "limit": 0, "offset": 0, "sortField": "", "sortDesc": false } Feb 28, 2025SiaFoundation/hostd#619 Add V2 sector roots to cache [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } This fixes an issue where V2 sector roots were not being properly loaded into the cache at startup and adds the integrity check method for v2 contracts.Feb 28, 2025SiaFoundation/hostd#620 Fix outdated API client consens