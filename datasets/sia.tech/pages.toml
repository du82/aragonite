ts. Further payments may be withheld for missed milestones. Potential risks that will affect the outcome of the project: Development Information Will all of your project’s code be open-source? [Projects can use closed-source components, but can’t develop closed-source code. If any of your project’s code is closed-source, please describe what code and why.] Leave a link where code will be accessible for review. Links. Do you agree to submit monthly progress reports? [Progress reports must be submitted monthly here in the forum.] Do you agree to designate a point of contact for committee questions and concerns? Name and contact info. Provide links to previous work or code from all team members. Links. Have you developed a proof of concept for this idea already? If not, you can develop this as part of another grant before submitting this grant. Yes/No and links. Do you agree to participate in a demo at our monthly community call at significant milestones or after the grant’s completion? Yes/No. Contact info "
