5, 2025SiaFoundation/web#946 chore: re-enable cluster latest [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Update cluster dependency to the latest. Includes a cors change for explorer nodes. Unpinned/updated to latest daemons and coreutils. Adds build-cluster nx step to the explorer project, matching other apps. Feb 25, 2025SiaFoundation/web#960 chore: upgrade playwright [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Ensure we are running the latest version of playwright libraries. Feb 25, 2025SiaFoundation/web#959 chore(explorer-e2e): typescript strict mode [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Enabled strict mode on the explorer-e2e project and added necessary type changes. Ran into some wonky lack of null typing issues on the cluster work in #947, enabling this made development much nicer. Feb 25, 2025SiaFoundation/web#958 chore(explorer): seperate dev build artifacts per target config [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } This change should fix any problems switching between: nx run explorer:serve:development and nx run explorer:serve:development-testnet-zen. Feb 25, 2025SiaFoundation/renterd#1838 deps: update core, coreutils, and hostd dependencies [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Feb 25, 2025SiaFoundation/core#282 rhp: Parallelize SectorRoot [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } goos: darwin goarch: arm64 pkg: go.sia.tech/core/rhp/v2 cpu: Apple M2 Pro BenchmarkSectorRoot BenchmarkSectorRoot/serial BenchmarkSectorRoot/serial-10 49 23381873 ns/op 179.38 MB/s 0 B/op 0 allocs/op BenchmarkSectorRoot/parallel BenchmarkSectorRoot/parallel-10 326 3563796 ns/op 1176.92 MB/s 14806 B/op 34 allocs/op Pretty unambiguous ~10x speedup when testing with a 10-core CPU. I experimented with inlining more of the appendLeaves logic into the worker goroutines, but it didn't have a significant impact on throughput and it made the code much more complex. ‾\_(ツ)_/‾Feb 24, 2025SiaFoundation/hostd#611 build(deps): bump the dependencies group with 2 updates [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Bumps the dependencies group with 2 updates: go.sia.tech/core and go.sia.tech/mux. Updates go.sia.tech/core from 0.10.1 to 0.10.2 Release notes Sourced from go.sia.tech/core's releases.0.10.2 (2025-02-20) Features Add helpers to get revision as an element from v1/v2 file contract element diffs #274 by @​chris124567 In the old ForEachFileContractElement interface, the revision was provided as a pointer to a (V2)FileContractElement. In the new system of diffs, the revision is only provided as a (V2)FileContract. There are multiple places where it is useful to have the revision as an element, and in all of these places more or less the same code will be duplicated unless we create this helper. Add RPCReplenish to RHP4 Adds an RPC to RHP4 that enables renters to set a target balance instead of first fetching the current balance and then funding the account with the difference. This is primarily to speed up account funding and reduce round trips when managing a large number of accounts. Changelog Sourced from go.sia.tech/core's changelog.0.10.2 (2025-02-20) Features Add helpers to get revision as an element from v1/v2 file contract element diffs ##274 by @​chris124567 In the old ForEachFileContractElement interface, the revision was provided as a pointer to a (V2)FileContractElement. In the new system of diffs, the revision is only provided as a (V2)FileContract. There are multiple places where it is useful to have the revision as an element, and in all of these places more or less the same code will be duplicated unless we create this helper. Add RPCReplenish to RHP4 Adds an RPC to RHP4 that enables renters to set a target balance instead of first fetching the current balance and then funding the account with the difference. This is primarily to speed up account funding and reduce round trips when managing a large number of accounts. Commitsfe05f66 Merge pull request #275 from SiaFoundation/release 8dd06fb chore: prepare release 0.10.2 dcacdc2 rhp4: use actual encoding sizes 939a947 Merge pull request #277 from SiaFoundation/nate/fix-replenish-encoding 9b4e96d encoding: set reasonable object size 37d788f return deposits instead of cost sum 5d00184 extend validate replenish accounts 847e895 rhp: add validate for fund accounts request 29bd92e add account batch size constant 400d96c fix lint Additional commits viewable in compare view Updates go.sia.tech/mux from 1.3.0 to 1.4.0 Commitsfc41f91 Merge pull request #12 from SiaFoundation/flip-nonce f736c2b v2: Add theirVersion parameter to Dial/AcceptAnonymous 4ae5086 Merge pull request #11 from SiaFoundation/flip-nonce 4057618 v2: Remove nonce derivation and hash pubkeys into shared secret e057384 v2: Improve signature and nonce handling abf58b0 Merge pull request #7 from SiaFoundat'''
