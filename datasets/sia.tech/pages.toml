["https://sia.tech/about-sia-foundation"]
title = "Sia - The Sia Foundation"
description = "The Foundation maintains, supports, promotes, and conducts research for the Sia network."
full_description = "The Sia FoundationThe Foundation maintains, supports, promotes, and conducts research for the Sia network.VisionSia began its life as a startup, which means it has always been subjected to two competing forces: the ideals of its founders, and the profit motive inherent to all businesses. Its founders have taken great pains to never compromise on the former, but this often threatened the company's financial viability. With the establishment of the Sia Foundation, this tension is resolved. The Foundation, freed of the obligation to generate profit, is a pure embodiment of the ideals from which Sia originally sprung.The goals and responsibilities of the Foundation are numerous: to maintain core Sia protocols and consensus code; to support developers building on top of Sia and its protocols; to promote Sia and facilitate partnerships in other spheres and communities; to ensure that users can easily acquire and safely store siacoins; to develop network scalability solutions; to implement hardforks and lead the community through them; and much more. In a broader sense, its mission is to commoditize data storage, making it cheap, ubiquitous, and accessible to all, without compromising privacy or performance.ContactFor developer support please see our documentation. For general inquiries email [email protected]. If you are interested in a career at The Sia Foundation please see our openings.The Sia teamNatePresidentChrisDirector of EngineeringFrancesDirector of OperationsSteveDirector of People & SupportLukeBlockchain Researcher & FounderAlexProduct EngineerPJCore DeveloperChristopherCore DeveloperKinoCommunity ManagerOliverDeveloper RelationsMurrayTechnical WriterJohnFrontend EngineerEddieChairmanJosh CincinnatiAdvisorQuarterly reports2024Q1Q2Q3Q42023Q1Q2Q3Q42022Q1Q2Q3Q42021Q1Q2Q3Q4Work at the Sia FoundationIf you are interested in a career at the Sia Foundation please see our openings.View job openingsjobs.lever.coRead the latest updatesRead the latest