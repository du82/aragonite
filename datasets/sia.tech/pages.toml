full_description = "Sia Foundation Privacy PolicyYour right to privacy is very important. We recognize that when you choose to provide us with personal information (defined as information that identifies, relates to, describes, or can be associated with you), you trust us to act in a responsible manner. We make every effort to preserve user privacy. This Privacy Policy describes the personal information that the Sia Foundation (the “Foundation,” “us,” “we” or “our”) collects through your interactions with the Sia Foundation website (sia.tech) (the “Website”), and how we collect, use, safeguard and disclose that information. By using this Website, you acknowledge and agree that you have read and understand the data practices described in this Privacy Policy. Automatic Collection of Personal Information When you visit our Website, we may automatically collect your device information and other unique identifiers, such as IP address, and may automatically collect information about your interactions with our Website through cookies. This information is used to improve the content of our Website, and any web browser cookies we deploy are only used to collect aggregate statistics that help us measure the effectiveness of our Website content as well as our navigational design. We do not use cookies for targeted advertising. Please see the section “Cookies and Online Interactions” for more information about the cookies that we use and how we use them. Collection of Voluntarily Submitted Personal Information The Sia Foundation may collect the email addresses, names, and telephone numbers of those who voluntarily communicate with us by email. Disclosure of Personal Information We may disclose your personal information in the following situations, as permitted by applicable law. Service Providers. We work with third parties that provide services on our behalf. Such services may include website hosting. We may disclose personal information to these third parties for the purpose of enabling them to provide these services. Consent. We may disclose personal information in accordance with any consent you provide. Government agencies, regulators, and professional advisors. We may disclose personal information if we are required to do so by law or pursuant to legal process, in response to a request from government officials or law enforcement authorities, as necessary or appropriate in connection with an investigation of illegal activity, to comply with our legal obligations, and defend our legal interests. Certain Transactions. We may disclose or transfer personal information to third parties who acquire all or a portion of our business, whether such acquisition is by way of merger, consolidation, or purchase of all or a portion of our assets, or in connection with any bankruptcy or reorganization proceeding brought by or against us. We have not disclosed your personal information for direct marketing purposes in the preceding twelve (12) months. Security We take appropriate steps to protect your privacy and implement reasonable security measures to protect your personal information in storage and in transmission. However, no method of transmitting or storing data is completely secure. As a result, although we strive to protect personal information about you, we cannot guarantee the security of any information you transmit to us through or in connection with the Website. If you have reason to believe that personal information is no longer secure, please notify us immediately by contacting us in accordance with the last section below. In the event of a breach that we are required by law to inform you of, we may notify you electronically, in writing, or by telephone, if permitted to do so by law. External Links Our Website may provide links to third-party sites. Since we do not control those websites, we encourage you to review the privacy policies of these third-party websites. Data Retention We retain information about you and your use of our Website for as long as is needed to fulfill our legitimate business purposes outlined in this Privacy Policy. The specific periods for which we keep information about you vary depending on the nature of the information, why we need it, and whether the personal information is de-identified. We also consider the minimum necessary retention period prescribed by applicable laws, recommended by industry standards, and stated in contracts and other legal obligations. Children’s Privacy Our Website is not intended for persons under 13 years of age. If we learn that we have collected personal information from persons under 13 through our Website, we will take appropriate steps to delete this information. Cookies and Online Interactions We may use various technologies to collect and store information, including cookies. Cookies are small bits of data cached or stored on your computer or mobile device based on your Internet activity. This section describes how we may use cookies and other data-collection technologies and how you can manage cookies that are not required to operate our sites and mobile applications. We differentiate between cookies that are essential for the technical features of the Website and analytics cookies. We do not use advertising cookies. Cookie TypeDescriptionEssential CookiesThese are cookies that the Website needs in order to function, and that enable you to move around and use the Website. Without these essential cookies, the Website will not perform as smoothly for you as we would like it to and we may not be able to provide the Website or certain features you request. We currently do not use essential cookies.Analytics CookiesAnalytics cookies allow website operators to understand more about how many visitors the website has, how many times they visit and how many times they view specific pages within the website. Although analytics cookies allow website operators to gather specific information about the pages that are visited and whether a visitor has visited the website multiple times, they cannot be used to find out details such as an individual’s name or address. We do not use analytics cookies on our Website, but instead deploy a privacy-friendly embed script called Fathom Analytics to perform website analytics. You can find out more about Fathom Analytics here. Most web browsers automatically accept cookies, but you can usually change your browser settings to prevent this. If you disable cookies, your ability to use some features of the Website may be limited. For mobile devices, you may be able to manage certain cookies using your built-in mobile device settings and controls, or the settings within your mobile application, where applicable. Choices are browser- and/or device-specific. If you clear your cookies from your browser on any of your devices, your choices will need to be reset. You should check how to do this on your device(s) and operating systems. Updates to this Privacy Policy We may update this Privacy Policy from time to time to reflect changes to our practices, technology, legal requirements, and other factors. When changes are made to this Privacy Policy, they will become effective immediately upon posting. We encourage you to review this Privacy Policy periodically for the latest information on our information processing practices. To the extent that our Privacy Policy changes in a material way, the Privacy Policy that was in place at the time that you submitted personal information to us will generally govern that information unless we receive your consent (express or implied) to the new Privacy Policy where and as required by applicable law. How to Contact Us The Sia Foundation Email: [email protected] Last update: August 2023Document version date: Sep 6, 2023OverviewHomeLearnRentHostWalletActivityNewsSoftwarerenterdhostdwalletdexploredDocumentationWhitepaperMiCA IndicatorsFoundationThe Sia FoundationGrantsRoadmapHosting Best PracticesLetterCareersBrand guidelinesCommunityEcosystem