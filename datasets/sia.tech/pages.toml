full_description = '''renterdrenterd is a next-generation Sia renter, developed by the Sia Foundation. It aims to serve the needs of both everyday users — who want a simple interface for storing and retrieving their personal data — and developers — who want a powerful, flexible, and reliable API for building apps on Sia.Download renterd softwareSystem requirements: quad-core processor, 8GB RAM, 256GB SSD for consensus dataDesktop applicationbetaDownload the full-featured desktop app for Windows, macOS, or Linux.I accept the Terms of Servicev0.21.0MacOS ARM64MacOS AMD64Windows AMD64Debian ARM64Debian AMD64RPM ARM64RPM AMD64DownloadTerminal applicationDownload the powerful CLI-based daemon for Windows, macOS, or Linux.I accept the Terms of Servicev2.0.0 MacOS AMD64 MacOS ARM64 Linux AMD64 Linux ARM64 Windows AMD64DownloadSetup guideAPI DocsSource codeFilesContractsHostsAutopilotConfigurationWalletNodePreferencesManage your storage with a powerful user interfaceManage your files, contracts, wallet, settings, and more with an intuitive interface. The embedded interface can be accessed with your web browser.Smart defaults for the everyday userrenterd comes with a built-in "autopilot" that handles host selection, contract management, and file repair. Want more control? Just disable it with -autopilot.enabled=false, and use the renterd HTTP API to implement custom maintenance logic in your favorite language. [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Modular APIs that give developers more controlWe've designed a brand-new API for renting that offers both power and performance. Form contracts, transfer data, and manage your files with clean and consistent JSON-speaking endpoints. renterd can even scale horizontally: in worker mode, it provides raw access to the Sia renter-host protocol, with no UI, no blockchain, and no disk I/O — perfect for massive renting operations.View API docsExample: Form a contract with a host. [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Example: Upload a file and fetch the metadata. [data-radix-scroll-area-viewport] { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; } [data-radix-scroll-area-viewport]::-webkit-scrollbar { display: none; } :where([data-radix-scroll-area-viewport]) { display: flex; flex-direction: column; align-items: stretch; } :where([data-radix-scroll-area-content]) { flex-grow: 1; } Tutorials for developers new to SiaTechnical tutorials for new developers looking to build on Sia.Learn how to rent storage space on the Sia networkdocs.sia.techLearn how create a wallet and make transactions on the Sia networkdocs.sia.techLearn how to offer storage space on the Sia network's storage marketplacedocs.sia.techLearn how to mine on the Sia networkdocs.sia.techLearn about the technology behind SiaTechnical deep-dives from the core team and the ecosystem of developers building technology on top of Sia.Utreexo in ContextMay 8, 2022•lukechampine.comYou Could Have Invented SkynetJan 1, 2021•lukechampine.comVerifiable Computation on Skynet using a Merklized Virtual MachineDec 30, 2020•blog.sia.techOptimizing Payment Channels to Achieve CDN LatenciesOct 27, 2020•blog.sia.techReducing Latency 96% by Switching P2P Platform Skynet to a MultiplexerAug 12, 2020•blog.sia.techA Lightweight Wallet for SiaJun 1, 2020•lukechampine.comOne Year of usMay 1, 2020•l