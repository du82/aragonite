["https://sia.tech/grants"]
title = "Sia - Grants"
description = "The Sia Foundation welcomes contributors from all over the world to come and build on Sia through our Grants program. Our goal for this program is to fund research, development, developer tools, and anything else that will support and further our mission of user-owned data while enriching the Sia ecosystem."
full_description = "GrantsThe Sia Foundation welcomes contributors from all over the world to come and build on Sia through our Grants program. Our goal for this program is to fund research, development, developer tools, and anything else that will support and further our mission of user-owned data while enriching the Sia ecosystem.Table of contentsThe grant processBrowse grant ideasBrowse example projectsBrowse current proposalsGrant guidelinesProposal formatsGrant applicant FAQApproved grantee FAQCreate a proposalThe Grant Process The following section outlines the proposal requirements, the proposal process, and evaluation criteria for the Sia grant program. Read on to get started on your own grant application. Submit your proposal Review the grant guidelines and proposal formats. Submit your proposal here. Open discussion will ensue in the comment section from the community. The Grants Committee convenes every two weeks to review the following: New proposals: to accept, reject, or request more info. Existing grants: to assess their progress. Newly completed grants: to review their outcomes. Keep in mind that the Grants Committee is far more likely to approve a grant with a smaller, focused objective than a sprawling, big-budget project attempting to become the next platform for _____. We recommend using Small Grants as a starting point for most ideas, and then moving into a larger proposal once you’ve proven your development chops and project viability. Scoring Rubric All proposals are reviewed by the Grant Committee. When evaluating a grant proposal, the Committee considers the following factors while utilizing a scoring matrix to ensure a thorough vetting process. In line with Foundation’s mission: Does the proposal address a recognized need in the decentralized cloud storage community? Is the need consistent with The Sia Foundation’s mission of user-owned data? Community Impact: Will the project provide a meaningful volume of services and/or people served in the decentralized cloud storage community (in particular the Sia community)? Goals, Objectives & Outcome: Are there clear goals and objectives written? Are measurable outcomes evident? Deliverable: How well does the individual/organization demonstrate the ability to deliver and measure proposed outcomes? Risks and Technical Feasibility: Is the risk reasonable for the timeline provided? Please be thoughtful if the risk is high enough to impact the outcome of the project. Budget Justification: How well does the applicant justify the budget? Grant Committee Luke (Sia Foundation) Nate (Sia Foundation) Chris (Sia Foundation) Manasi (Sia community) Mike76 (Sia community) Redsolver (Sia community) We would love to see the following ideas as Grant projectsThe Sia community would love to see the following projects built. If you are interested in building one of these projects, please reach out to the community on Discord to discuss your proposal.Benchmarking ToolsWith the recent release of hostd, the Sia Foundation would like to see the community get creative and build new benchmarking and scoring tools. Interested in building a benchmarking tool for Sia? Apply for a Grant!Apply for a grant related to Benchmarking ToolsHost Monitoring ToolsRunning a host requires good stability and uptime, it would be useful to have monitoring tools that track status and alerting tools that send email or SMS notifications when a node goes offline. Interested in building a monitoring tool for hostd? Apply for a Grant!Apply for a grant related to Host Monitoring ToolsCheck out what people are building on SiaSia is a thriving ecosystem of data storage enthusiasts, open source software, and commercial data storage platforms. Apply for a Sia grant and start contributing.Browse all ecosystem projectsVupPrivate and decentralized open-source cloud storage app with encrypted file sharing and media streaming support.Learn more about filesharing with Vupvup.appS5Content-addressed storage, but fast. Works with Sia and any S3-compatible storage provider.Learn more about content-addressed storage with S5docs.sfive.netsiafs renterd FUSE filesystemFUSE (Filesystem in Userspace) is a Unix-based filesystem that allows users to mount a virtual filesystem in userspace. With FUSE integration, users can mount renterd storage as a virtual drive and access it from their local file system. With write support, users can modify files and folders stored on renterd directly from their local machine. siafs is an ongoing grant project.Learn more about siafs renterd FUSE filesystemgithub.com/OKayIncHost BrowserThe Sia Central Host Browser lets you explore and filter Sia hosts by a variety of criteria.Learn more about Host Browserhosts.siacentral.comSiaShareSiaShare is an end-to-end encrypted file sharing software that uses the Sia decentralized storage network to store files.Learn more about encrypted file sharing with SiaSharegithub.com/mjmay08IPFSRIPFS is a widely used peer-to-peer hypermedia protocol that supports content addressing. IPFSR is a renterd storage backend allows an IPFS gateway to store its data on Sia. Learn more about IPFSRipfsr-website.vercel.appGrant guidelines The Sia Foundation has some limitations with funding grants in certain locations. Please refer to this list if you are outside the US to see if the Grants Committee can consider your proposal. Small Grants Goal: To incentivize the creation and field testing of novel ideas and small utilities that add value to the Sia ecosystem. Guidelines: Budget limits: Less than $10,000 USD Time to first review: 2-4 weeks Timeline: A maximum of three months from grant approval (flexible if you provide adequate justification). Reporting: We will continue our existing policy of expecting monthly progress reports from grantees. Proposal Format: A concise, short proposal detailing the objectives, method, and expected outcomes. Standard Grants Goal: Provide more structure for projects with a larger scope and make it easier for the committee and community to gauge progress. Guidelines: Budget limits: Every grant is paid in equal monthly installments. Your budget request must come to less than $8,333 per month, but be over $10,000 total. Time to first review: 4-6 weeks Reporting: Besides monthly progress reports, all standard grants must propose upfront milestones. Milestones: A proposed schedule of milestones should be part of each grant application. The committee reserves the right to accept, modify, or reject proposed milestones to ensure they represent thoughtful and reasonable project evaluation checkpoints. Further payments may be withheld for missed milestones. Proposal Format: Proposals should detail the project's scope, objectives, expected results, milestone schedule, and budget breakdown. The inclusion of team members' qualifications and prior work is encouraged (or may be required by the committee on a case-by-case basis). Demo day: A short presentation upon completion of the grant or significant milestones at the monthly community call Large Grants Goal: To engage in a deeper vetting process, ensuring that large sums are granted to projects with clear plans, experienced teams, and demonstrated abilities. Guidelines: Budget limits: Every grant is paid in equal monthly installments. Your budget request must come to $8,333 or more per month. Time to first review: 8-12 weeks Definitive point-of-contact: a clear point of contact that provides updates and engages with the grant committee Reporting: Besides monthly progress reports, all large grants must propose upfront milestones. Milestones: A proposed schedule of milestones should be part of each grant application. The committee reserves the right to accept, modify, or reject proposed milestones to ensure they represent thoughtful and reasonable project evaluation checkpoints. Further payments may be withheld for missed milestones. Examples of previous work: Proposers should present samples of past work and code, helping the committee gauge the team's expertise and capability Proof of concept: A small proof of concept should be provided to demonstrate the viability and potential of the project. Can be developed as part of a prior grant. Proposal Format: Proposals should be comprehensive, covering the project's in-depth plan, team expertise, prior accomplishments, and expected milestones. A detailed budget breakdown is also required. Demo day: A short presentation upon completion of the grant or significant milestones at the monthly community call Proposal formats Please note that for all grant proposals, all proposal info should be contained in the body of the forum post. If there are external links to any of the requested information below, we will ask you to get that content in the post itself. We request this for archival purposes. Small Grants Format Introduction Project Name: Name of the organization or individual submitting the proposal: Describe your project. Answer here. How does the projected outcome serve the Foundation’s mission of user-owned data? Answer here. We cannot provide grants to residents of jurisdictions under increased FATF monitoring, those that have active OFAC sanctions, or those that fail our bank compliance tests. We also cannot provide grants if your payment bank account is located in those same locations. Please review the following list. Are you a resident of any jurisdiction on that list? Yes/No Will your payment bank account be located in any jurisdiction on that list? Yes/No Grant Specifics Amount of money requested and justification with a reasonable breakdown of expenses: Consider the following when submitting your budget. The Foundation can only pay out grant funds in $USD via ACH or wire. Grant payments will be made monthly. What are the goals of this small grant? Please provide a general timeline for completion. Potential risks that will affect the outcome of the project: Development Information Will all of your project’s code be open-source? [Projects can use closed-source components, but can’t develop closed-source code. If any of your project’s code is closed-source, please describe what code and why.] Leave a link where code will be accessible for review. Links. Do you agree to submit monthly progress reports? [Progress reports must be submitted monthly here in the forum.] Contact info Email: Any other preferred contact methods: Standard Grants Format Use the following template when submitting your proposal. Proposals must be in this format in order to be considered. Read this entire template before submitting. Introduction Project Name: Name of the organization or individual submitting the proposal: Describe your project. Answer here. Who benefits from your project? Answer here. How does the project serve the Foundation’s mission of user-owned data? Answer here. We cannot provide grants to residents of jurisdictions under increased FATF monitoring, those that have active OFAC sanctions, or those that fail our bank compliance tests. We also cannot provide grants if your payment bank account is located in those same locations. Please review the following list. Are you a resident of any jurisdiction on that list? Yes/No Will your payment bank account be located in any jurisdiction on that list? Yes/No Grant Specifics Amount of money requested and justification with a reasonable breakdown of expenses: Consider the following when submitting your budget. The Foundation can only pay out grant funds in $USD via ACH or wire. Timeline with measurable objectives and goals. REQUIRED: Milestones with which to judge your progress. Milestones should be easy for the Grants Committee to understand and evaluate as your project moves through its term. The Committee reserves the right to accept, modify, or reject proposed milestones to ensure they represent thoughtful and reasonable project evaluation checkpoints. Further payments may be withheld for missed milestones. Potential risks that will affect the outcome of the project: