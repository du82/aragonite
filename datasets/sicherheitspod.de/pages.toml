full_description = "Spezial: Deutsch-Amerikanische Beziehungen 3. Oktober 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In dieser Spezialfolge sind Ulrike Franke, Carlo Masala und Thomas Wiegold zu Gast beim International Security Forum 2019 am Center for International Security and Governance (CISG) der Universität Bonn – Frank schaltet sich aus Brüssel zu. Wir sprechen mit Jeff Rathke, dem Präsident des AICGS, einer Denkfabrik in Washington, die sich mit Deutschland beschäftigt (ja, sowas gibt es). Das Gespräch mit Jeff dreht sich um die deutsch-amerikanischen Beziehungen im Kleinen, das Verhältnis der USA zu Europa im Großen sowie die Folgen des Aufstiegs Chinas für alle. Ist in der Ära Trump etwas irreparabel beschädigt worden? Carlo gibt eine zynische, Frank eine deprimierte Antwort. Am Ende bekommen alle (außer Frank) Geschenke. Unser herzlicher Dank an Jeff und das CISG Bonn (das sich gerade ins “CASSIS”, “Center for Advanced Security, Strategic and Integration Studies”, umwandelt: https://www.cassis.uni-bonn.de/de). Unser Gast: Jeff Rathke, President, American Institute for Contemporary German Studies (AICGS) at the Johns Hopkins University in Washington, DC. https://www.aicgs.org/by-author/jeff-rathke/ Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Annett Meiritz, Anna Reimann und Severin Weiland: Merkels Bierzeltrede – Jeder Satz ein Treffer, Spiegel Online, 29. Mai 2017, https://www.spiegel.de/politik/deutschland/angela-merkel-das-bedeutet-ihre-bierzelt-rede-ueber-donald-trump-a-1149649.html Jim Townsend, Trump’s Defense Cuts in Europe Will Backfire, Foreign Policy, 17 September 2019 https://foreignpolicy.com/2019/09/17/trumps-defense-cuts-in-europe-will-backfire/ Kori Schake, America pays its dues in the Age of Trump, The Atlantic, 27 Juli 2019, https://www.theatlantic.com/ideas/archive/2019/07/america-pays-its-dues-age-trump/594880/ Ulrike Franke, Watching for signs of NATO’s end of times, War on the Rocks, 10 Juli 2018 https://warontherocks.com/2018/07/watching-for-signs-of-natos-end-of-times/ Sicherheitshalber-Folge zur Tornadonachfolge: https://soundcloud.com/sicherheitshalber/sicherheitshalber-7-tornadonachfolge-klimawandel-und-buchempfehlungen Sicherheitshalber-Folge zur liberalen Weltordnung, Diskussion mit Constanze Stelzenmueller https://soundcloud.com/sicherheitshalber/5-die-zukunft-der-liberalen-weltordnung-und-bundeswehr-trendwenden-bei-personal-und-material Ähnliche Beiträge Folge 11: NATO-Geburtstag und Bundeswehr-Werbung 5. April 2019 in Podcast Folge 16: Militarisierung des Weltraums und Marinemissionen in der Straße von Hormuz 15. August 2019 in Geopolitics Podcast Weltraum Folge 1: Sicherheitspolitik für die Ohren – ein Podcast auf Deutsch 19. Juli 2018 in Blogthings Podcast Veröffentlicht in Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
