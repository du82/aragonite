title = "Folge #81 Sicherheitspolitische Horrorwoche: Rotes Meer. Scholz zu Taurus. Scholz vs. Macron. Taurus-Leak – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #81 Sicherheitspolitische Horrorwoche: Rotes Meer. Scholz zu Taurus. Scholz vs. Macron. Taurus-Leak 6. März 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 81 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über die zurückliegende Horror-Woche für die deutsche Sicherheitspolitik: Von Fehlschüssen der Fregatte “Hessen” im Roten Meer über die Aussagen von Bundeskanzler Olaf Scholz zum Marschflugkörper Taurus und von Frankreichs Präsident Emanuel Macron zu eventuellen möglichen vielleicht Bodentruppen in der Ukraine bis zum Taurus-Leak, dem von Russland abgehörten Gespräch hoher Luftwaffenoffiziere. Au backe! Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit russische Nuklearwaffen im Orbit, “Surveillance Capitalism”, Pistorius’ Vorstoß für eine neue Wehrpflicht und dem Verhältnis der USA zu Israel. Hessen im Rotem Meer: 00:01:50 Scholz und Taurus: 00:21:22 Macron und Bodentruppen: 00:32:10 Taurus-Leak: 00:48:10 Fazit: 01:08:40 Sicherheitshinweise: 01:09:52 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema Horrorwoche Eine Woche in der deutschen Außen- und Verteidigungspolitik Montag, 26 Februar: Scholz begründet Taurus-NIchtlieferung Macron schliesst Bodentruppen nicht aus Hessen schiesst versehentlich auf US Drohne Dienstag, 27 Februar Hessen schiesst erste Houthi drohnen ab Mittwoch, 28 Februar Verteidigungsministerium räumt Fehlschüsse auf Drohne ein Donnerstag, 29 Februar (da war nix?) Freitag, 1. März RT veröffentlicht abgehörte Bundeswehr Unterhaltung Thema 1) Die Hessen im Roten Meer Augen geradeaus, Rotes Meer: Nach zwei Fehlschüssen zerstört Fregatte ‚Hes