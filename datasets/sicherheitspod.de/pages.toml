title = "Folge 41: Bidens Außenpolitik: Is America Back? | Operation Neuland: Die Bundeswehr in den sozialen Medien – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 41: Bidens Außenpolitik: Is America Back? | Operation Neuland: Die Bundeswehr in den sozialen Medien 15. März 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 41 fragen sich Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst, ob die USA unter dem neuen Präsidenten Biden wirklich zurück auf der Weltbühne sind. Die Antwort? Im Prinzip ja, aber… ! Im zweiten Teil diskutieren die vier Podcaster mit ihrem Gast Sascha Stoltenow, dem “Bendlerblogger”, die unübersichtliche Lage, die sich aus den zahlreichen und vielfältigen Aktivitäten von SoldatInnen in sozialen Medien – mal mit dienstlichem Auftrag, mal “rein privat” – ergibt. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zur EU als möglichem Rüstungsexporteur, einer Fehleinschätzung des chinesischen Nukleararsenals, der Beschaffung eines schweren Transporthubschraubers für die Bundeswehr und der Verteidigungsfähigkeit der NATO gegenüber Russland. Sicherheitshalber · #41 Bidens Außenpolitik: Is America Back? | Operation Neuland: Die Bundeswehr in den sozialen Medien Is America Back?: 00:04:10 Bundeswehr und soziale Medien: 00:31:03 Fazit: 01:09:35 Sicherheitshinweise: 01:11:20 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Is America Back? US Interim National Security Strategy Guidance: https://www.whitehouse.gov/briefing-room/statements-releases/2021/03/03/interim-national-security-strategic-guidance/ Remarks by President Biden on America’s Place in the World, 04.02.2021, https://www.whitehouse.gov/briefing-room/speeches-remarks/2021/02/04/remarks-by-president-biden-on-americas-place-in-the-world/ Biden’s First 100 Days: https://foreignpolicy.com/projects/biden-first-100-days/ Doyle McManus, Biden’s foreign policy may not be Trump’s — but it’s not Obama’s, either, L.A. Times, 10.03.2021, https://www.latimes.com/politics/story/2021-03-10/column-bidens-foreign-policy-may-not-be-trumps-but-its-not-obamas-either Steward M. Patrick, Biden’s Foreign Policy Takes Shape, Council on Foreign Relations, 08.02.2021, https://www.cfr.org/blog/bidens-foreign-policy-takes-shape Charlie Savage and Eric Schmitt, Biden Secretly Limits Counterterrorism Drone Strikes Away From War Zones, New York Times, 03.03.2021, https://www.nytimes.com/2021/03/03/us/politics/biden-drones.html?searchResultPosition=1 Thema 2 – Bundeswehr und soziale Medien Sascha Stoltenow Twitter: @BendlerBlogger Web: https://bendler-blog.de/ Social Media Guidelines der Bundeswehr, 2020, https://web.archive.org/web/20200623131944/https://www.bundeswehr.de/de/social-media-guidelines-bundeswehr & https://web.archive.org/web/20200120121225/https://www.bundeswehr.de/resource/blob/153030/7713bef2cf60a5198b74abfe0b8b0444/20191122-download-social-media-guidelines-data.pdf Sicherheitshalber – Folge 11, https://soundcloud.com/sicherheitshalber/11-siebzig-jahre-nato-und-rekrutierung-bei-der-bundeswehr Bendlerblog: Wer ist bundeswehrexclusive auf TikTok?, 25.1.2021, https://bendler-blog.de/2021/01/25/wer-ist-bundeswehrexclusive-auf-tiktok/ Bendlerblog: Die Causa Bohnert: Warum die #SocialMediaDivision ein Update braucht, Ein Gastbeitrag von Paul C. Strobel, 18.8.2020, https://bendler-blog.de/2020/08/18/die-causa-bohnert-warum-die-socialmediadivision-ein-update-braucht/ Sicherheitshinweise Frank: Die EU als Rüstungsexporteur?, https://www.tagesschau.de/investigativ/monitor/eu-waffenexporte-101.html Carlo: China-USA Nuklearwaffen. When is outnumbered outnumbered?, https://twitter.com/kenmoriyasu/status/1369309382001975298?s=20 & https://www.defensenews.com/opinion/commentary/2021/03/13/when-it-comes-to-chinas-nuclear-weapons-numbers-arent