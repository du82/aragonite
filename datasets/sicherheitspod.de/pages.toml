title = "Folge 52: Die Ukraine-Krise und ihr Kontext | Dieses “FCAS”… äh, brauchen wir das? | Buchempfehlungen – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 52: Die Ukraine-Krise und ihr Kontext | Dieses “FCAS”… äh, brauchen wir das? | Buchempfehlungen 31. Dezember 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 52 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die aktuellen Vorgänge rund um die Ukraine und die russischen Truppen an der Grenze. Der Schwerpunkt ist dabei weniger das aktuelle Geschehen als vielmehr die Diskussion der historischen Hintergründe, insbesondere mit Blick auf die NATO-Osterweiterung und die russische Bedrohungsperzeption, die ja in der öffentlichen Debatte aktuell immer wieder eine Rolle spielen. Auch die Frage, was Russland – bzw. Putin – mit der inzwischen von detaillierten Vertragsentwürfen flankierten militärischen Drohkulisse eigentlich bezweckt, eruieren die vier Podcaster. Im zweiten Teil wenden sie sich – bereits zum zweiten Mal ausführlicher – dem Future Combat Air System (FCAS) zu und fragen sich, warum dieses Rüstungsprojekt eigentlich geplant ist wie es geplant ist. Dabei stehen (durchaus unterschiedliche) Vorstellungen auf deutscher und französischer Seite mit Blick auf militärische, industrie- und europapolitische Aspekte im Vordergrund – ebenso wie die Frage, wofür man FCAS eigentlich konkret zu brauchen glaubt. Abschließend ausnahmsweise mal nicht der “Sicherheitshinweis”, sondern, der guten alten Jahresendtradition folgend, stattdessen ein paar Buchempfehlungen. Sicherheitshalber · #52 Die Ukraine-Krise und ihr Kontext | Dieses “FCAS”… äh, brauchen wir das? | Buchempfehlungen Ukraine: 00:01:45 FCAS: 00:45:46 Fazit: 01:20:48 Buchempfehlungen: 01:22:43 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Ukraine/Russland/USA/NATO Uwe Klußmann, Matthias Schepp, Klaus Wiegrefe: “Absurde Vorstellung”, Der Spiegel 48/2009. National Security Archive: Memorandum of conversation between Mikhail Gorbachev and James Baker in Moscow, 9.2.1990. Svetlana Savranskaya, Tom Blanton: NATO Expansion: What Gorbachev Heard, National Security Archive Briefing Book 613, 12.12.2017. Hannes Adomeit: NATO Osterweiterung: Gab es westliche Garantien?, BAKS Arbeitspapier 03/2018. Luke Harding: On the Ukraine frontline: ‚only the dead aren’t afraid‘, The Guardian, 16.12.2021. Nolan Peterson, Lessons in Winter Warfare From the Ukrainian War Zone — A Case Study for America’s Arctic Pivot, Coffe or Die Magazine, 13. 3.2021 Christoph Heusgen im Interview: “Putin verklärt das Stalin-Regime”, RND, 28.12.2021. Augengeradeaus: Russlands Vorschläge für Verträge über „Sicherheitsgarantien“: Faktisch ein Ende der NATO (Neufassung) – inklusive Links zu den zwei russischen Vertragsentwürfen in der inoffiziellen, allerdings vom russischen Außenministerium veröffentlichten englischen Übersetzung, 17.12.2021. Michael Schwirtz: Ukraine Commanders Say a Russian Invasion Would Overwhelm Them, New York Times, 9.12.2021. Gustav Gressel: Russia’s military movements: What they could mean for Ukraine, Europe, and NATO, ECFR, 17.11.2021. Gustav Gressel: Why Russia could invade Ukraine again, ECFR, 3.12.2021. Thema 2 – FCAS Sicherheitshalber Folge #22 (Live aus Urania in Berlin): Iran+USA=WWIII? | Deutsch-französisches Milliardenprojekt „Kampfflugzeug FCAS“, 28.01.2020. Airbus/Fraunhofer FKIE: Die verantwortliche Nutzung neuer Technologien in einem Future Combat Air System (FCAS) – Full Disclosure: Das ist die AG, in der Rike und Frank mitarbeiten. Franz-Stefan Gady, Oskar Glaese: Germany to operate armed UAVs: too little too late?, IISS Analysis, 29.11.2021 Dominic Vogel: Future Combat Air System: Too Big to Fail, SWP, 11.12.2020. Nana Brink: Die Wunderwaffe, Internationale Politik, 1.5.2021. Buchempfehlungen Carlo: S.A. Cosby: Blacktop