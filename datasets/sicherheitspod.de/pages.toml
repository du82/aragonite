full_description = "Folge 51: “Hybride Kriegsführung” & “Migration als Waffe” – schwierig! | Der neue Ampel-Koalitionsvertrag 27. November 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 51 sprechen – nein, streiten! – Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die sogenannte hybride Kriegsführung. Woher stammt dieser Begriff? Was bedeutet er – und kann bzw. sollte man so vieles, von Informationen über Gas bis hin zu Migranten, als “Waffen” in diesem “Krieg” einordnen? Die Antworten fallen unterschiedlich, das Gespräch (endlich mal wieder) richtig kontrovers aus. Im zweiten Teil wenden die vier Podcaster sich dem Koalitionsvertrag der Ampel-Regierung zu und werfen einen Blick auf einige ausgewählte außen-, sicherheits- und verteidigungspolitische Schlüsselstellen. Ist schnell besprochen und abgehakt? Denkste! Es gibt einiges zu analysieren und den einen oder anderen kryptischen Formelkompromiss im Detail zu sezieren. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem italienischen Vorstoß zu FCAS, dem Kauf von EMT durch Rheinmetall, den Auswirkungen des jüngsten russischen Anti-Satelliten-Raketen-Tests und der Duldungspflicht in Sachen Corona-Impfung bei der Bundeswehr (#Impfpflicht). Sicherheitshalber · #51 “Hybride Kriegsführung” & “Migration als Waffe” – schwierig! | Der neue Ampel-Koalitionsvertrag Hybrid: 00:02:44 KoaV: 00:45:46 Fazit: 01:20:48 Sicherheitshinweise: 01:22:43 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Intro (in unserer neuen Rubrik “Royales” diesmal…): Princess Ingrid Alexandra visited special forces and practiced skydiving – The Norway News, 20.11.2021,