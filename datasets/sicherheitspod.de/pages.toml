full_description = "Folge 46: Analyse der Wahlprogramme zur Bundestagswahl 2021: Wer will was bei Sicherheit und Verteidigung? 4. August 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. Anlässlich der Bundestagswahl am 26. September widmen sich Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala in Folge 46 nur einem einzigen Thema: Den Wahlprogrammen der sechs aktuell im Bundestag vertretenen Parteien. Im ersten Teil stellen die vier Podcaster deren sicherheitspolitische Schwerpunkte vor. Im zweiten Teil diskutieren sie die aus gegenwärtiger Sicht vier wahrscheinlichsten Koalitionsoptionen, um Gemeinsamkeiten, Differenzen und mögliche Kompromisslösungen zu identifizieren. Abschließend gibt es aber natürlich trotzdem – wie immer – den “Sicherheitshinweis”, den kurzen Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem britischen Vorwurf gegenüber dem Iran, einer deutschen Fregatte gegen den Uhrzeigersinn im Info- äh… Indo-Pazifik, einer deutsch-britischen Absichtserklärung und vielen neuen chinesischen Silos für Interkontinentalraketen. Wichtig: Wir geben hier selbstverständlich keine Wahlempfehlungen ab. Aber wir sagen: Erstens, informiert euch (wir hoffen, dass unser Podcast dazu einen kleinen Beitrag leisten kann). Zweitens, geht wählen! Sicherheitshalber · #46 Analyse der Wahlprogramme zur Bundestagswahl 2021: Wer will was bei Sicherheit und Verteidigung? Wahlprogramme: 00:01:31 CDU/CSU: 08:19 SPD: 18:14 AFD: 27:41 FDP: 37:38 LINKE: 47:10 Grüne: 58:30 Koalitionsoptionen: 01:12:24 Sicherheitshinweise: 01:43:31 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema – Wahlprogramme (nach aktueller Fraktionsgröße geordnet) CDU/CSU https://cdudl.s3.eu-central-1.amazo