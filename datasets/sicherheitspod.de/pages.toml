["https://sicherheitspod.de/2024/01/31/folge-80-ist-die-nato-osterweiterung-schuld-an-russlands-krieg-gegen-die-ukraine"]
title = "Folge #80 Ist die NATO-Osterweiterung Schuld an Russlands Krieg gegen die Ukraine? – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #80 Ist die NATO-Osterweiterung Schuld an Russlands Krieg gegen die Ukraine? 31. Januar 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 80 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Mary Elise Sarotte ausführlich über ihre Forschung zur NATO-Osterweiterung. Wie viel Anteil an der katastrophalen Sicherheitslage im heutigen Europa hat die NATO-Osterweiterung? War sie gar der eigentliche Grund, weswegen Putin die Ukraine angegriffen hat? Einige behaupten, Russland sei nach dem Ost-West-Konflikt hintergangen worden, die NATO sei Russland unbotmäßig auf die Pelle gerückt. Andere wissen es nicht genau. Dritte streiten kategorisch ab, dass an der NATO-Osterweiterung irgendwas problematisch sein könnte. Die vier Podcaster und Mary nehmen sich die Zeit, das Thema ein für allemal komplett zu durchleuchten. Wer hat wann was zu wem gesagt? Was wurde im 2+4-Vertrag zur deutschen Wiedervereinigung wirklich vereinbart – und wer interpretiert das auf welche Weise? Was geschah in den 1990ern mit Russland, NATO und EU? Was hätte anders gemacht werden können, etwa mit Blick auf “NATO Partnership for Peace” statt “NATO Erweiterung” – und, dazu gibt es im Podcast ordentlich Dissens, hätte das mit Blick auf das Hier und Jetzt etwas Entscheidendes geändert? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit nordkoreanischen Kriegsdrohungen, US-Atomwaffen in Großbritannien, dem neuen Sturmgewehr der Bundeswehr und einer neuen Drohne für alle. Sicherheitshalber · #80: Ist die NATO-Osterweiterung Schuld an Russlands Krieg gegen die Ukraine? NATO-Osterweiterung: 00:00:40 Sicherheitshinweise: 01:34:04 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema: NATO-Osterweiterung Unsere Gesprächspartnerin: Prof. Dr. Mary Elise Sarotte, Marie-Josée and Henry R. Kravis Distinguished Professor of Historical Studies, Johns Hopkins SAIS Mary Elise Sarotte 2023: Nicht einen Schritt weiter nach Osten. C.H. Beck. Mary Elise Sarotte 2021: Not One Inch: America, Russia, and the Making of Post-Cold War Stalemate. Yale University Press. taz Interview: „Die Ukraine im Stich gelassen“ – Putin begründet den Angriff auf die Ukraine auch mit der Nato-Osterweiterung. Historikerin Mary Elise Sarotte rekonstruiert, wie das damals genau war. taz. 24.09.2023 Sicherheitshinweise: Thomas: Tests für neues Sturmgewehr der Bundeswehr begonnenhttps://augengeradeaus.net/2024/01/neues-sturmgewehr-gewollte-treffer-im-labor/ Frank: Will Kim Jong Un Krieg oder blufft er nur? https://www.38north.org/2024/01/is-kim-jong-un-preparing-for-war/ vs. https://www.38north.org/2024/01/a-fundamental-shift-or-more-of-the-same-a-rebuttal/ Rike: Neue zivile Drohne für alle – mit 30 Kilogramm Nutzlast https://www.dji.com/de/newsroom/news/dji-launch-fly-cart-30-de Carlo: Amerikanische Nuklearwaffen zurück nach Großbritannien? https://www.faz.net/aktuell/politik/ausland/bericht-usa-wollen-wieder-atomwaffen-in-grossbritannien-stationieren-19478444.html Social Media Gedöns: Sicherheitspod Twitter: @Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Blue Sky: @sicherheitspod.bsky.social Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Skeet: @rikefranke.bsky.social Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Skeet: @drfranksauer.bsky.social Carlo Tweet: @CarloMasala1 Skeet: @carlomasala1.bsky.social Carlo tröötet nicht. Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegoldSkeet: @twiegold.bs Ähnliche Beiträge Folge 52: Die Ukraine-Krise und ihr Kontext | Dieses “FCAS”… äh, brauchen wir das? | Buchempfehlungen 31. Dezember 2021 in Allgemein Folge #55 Krieg gege