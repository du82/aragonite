full_description = "Spezial zur Münchner Sicherheitskonferenz #1: Nachlese mit Almut Wieland-Karimi 16. Februar 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In diesem ersten von insgesamt gleich zwei Sicherheitshalber Spezial – aufgenommen im Rahmen der Münchner Sicherheitskonferenz (MSC 2020) – sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold mit Almut Wieland-Karimi, der Geschäftsführerin des Zentrums für Internationale Friedenseinsätze (ZIF) über die folgenden Fragen: 00:01:00 – Was ist das ZIF und was machen ZIF-ExpertInnen auf ihren Friedensmissionen? 00:06:45 – Wie ist die Gender Balance in den Einsätzen und was ist der “vernetzte Ansatz”? 00:10:05 – Sind Entwicklung und Frieden bei der MSC angemessen repräsentiert? 00:19:45 – Wie ist das Spannungsfeld zwischen Militär und ziviler Komponente im Einsatz? 00:24:26 – Was sind die Lehren aus dem Einsatz in Afghanistan und wie ist aktuell die Lage? 00:30:10 – MSC Nachlese (Transatlantisches Verhältnis, 5G, Covid-19, Klima u.a.) 00:56:51 – Outro Wie bei jedem Sicherheitshalber Spezial entfallen auch hier das Fazit und der sonst übliche Sicherheitshinweis. Die zweite der beiden Sicherheitshalber MSC2020 Spezial-Folgen ist auch online: Darin sprechen wir mit dem Generalinspekteur der Bundeswehr, General Eberhard Zorn. Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Dr. Almut Wieland-Karimi, Geschäftsführerin des ZIF (Zentrum für Internationale Friedenseinsätze), Web: https://www.zif-berlin.org/de/ueber-zif/das-team.html MSC: Munich Security Report 2020: Westlessness https://securityconference.org/publikationen/munich-security-report-2020/ Tobias Bunde: Die liberale Ordnung muss neu begründet werden, Tagesspiegel, 12.02.2020, https://www.tagesspiegel.de/politik/was-ist-der-westen-die-liberale-ordnung-muss-neu-begruendet-werden