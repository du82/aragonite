full_description = "Folge #53 Zur geopolitischen Bedeutung von Energie: Ukraine, Russland, Nord Stream 2, Kasachstan… 20. Januar 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 53 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit der Energie-Expertin Kirsten Westphal: Kann Russland im Konfliktfall wirklich “den Gashahn zudrehen”? Worin liegen die Ursachen der aktuellen Energiepreis-Krise? Wie groß ist das “Erpressungspotenzial” der Pipeline Nord Stream 2 mit Blick auf die Ukraine? Warum fließt ausgerechnet jetzt Gas in der Yamal-Pipeline ostwärts, von Deutschland nach Polen? Wie ist das Zusammenspiel von Märkten und (Sicherheits-)Politik bei der Energiepreisbildung? Wie lassen sich die jüngsten Vorgänge in Kasachstan in all das einordnen? Auf diese Fragen und mehr geht das ausführliche und extrem gehaltvolle Gespräch ein. Und auch die sicherheitspolitische Bedeutung der Energiewende in Deutschland kommt zur Sprache. Auf ein zweites Thema verzichten die vier Podcaster daher ausnahmsweise mal. Aber natürlich gibt es trotzdem wie immer den “Sicherheitshinweis”, den kurzen Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Schadsoftware und Kampfdrohnen in der Ukraine sowie Neuigkeiten zu Mali und der NATO-Speerspitze im Baltikum. Energie: 00:00:55 Fazit: 00:53:00 Sicherheitshinweise: 00:54:15 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema: Energie und Geopolitik Unser Gesprächspartnerin: Dr. Kirsten Westphal Senior Analyst bei der Stiftung Wissenschaft und Politik (SWP) (beurlaubt), aktuell Executive Director Analysis & Research bei der H2Global Stiftung Twitter: @kirstenwestpha1 Anne Neumann, Leonard Göke, Franziska Holz, Claudia Kemfert, Christian von Hirschhausen: Erdgasversorgung: Weitere Ostsee-Pipeline ist überflüssig. Deutsches Institut für Wirtschaftsforschung Berlin, DIW Wochenbericht 27/2018, S. 589–597. Energiekosten: Zieht euch warm an (mit Zitaten von Kirsten Westphal), Süddeutsche Zeitung, 22.9.2021 Lukas Feldhaus, Kirsten Westphal, Georg Zachmann: Die Anbindung der Ukraine an Europas Stromsystem, Zwischen technischen Details und harter Geopolitik, SWP November 2021. Russia’s Gazprom has no Europe gas exports planned in February via Yamal pipeline, Reuters, 17.1.2022 Sicherheitshinweise Frank: Website Defacements und Schadsoftware in der Ukraine, https://www.heise.de/news/Ukraine-Nach-Defacement-Angriffen-findet-Microsoft-weitere-gefaehrliche-Malware-6328373.html Thomas: Türkische Kampfdrohnen als Game Changer in der Ukraine?, https://www.stripes.com/theaters/europe/2022-01-15/why-ukraine-turkish-drone-became-flashpoint-tensions-russia-4302104.html Carlo: Revision des Verteidigungsvertrags Mali-Frankreich?, https://twitter.com/SimNasr/status/1482667013025812482?s=20 Rike: Frankreich und deutsch-französische Brigade übernehmen VJTF Führung, https://www.nato.int/cps/en/natohq/news_190458.htm Ähnliche Beiträge Folge 31: Posttraumatische Belastungsstörung (PTBS) | Nord Stream 2: Die politisierte Problem-Pipeline 28. Juli 2020 in Allgemein Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende 9. April 2022 in Allgemein Folge #59 Was macht eigentlich China? Ukraine-Krieg beobachten, Russland stützen, Systemkonflikt forcieren 31. Mai 2022 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
