full_description = "Folge #63 LIVE Geopolitische Konsequenzen des russischen Kriegs in der Ukraine: Bleibt nichts wie es war? 15. Oktober 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 63 sind Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zu Gast in der Israelitischen Kultusgemeinde München, um (endlich wieder) live vor Publikum zu diskutieren. Es geht um die geopolitischen Implikationen des russischen Kriegs gegen die Ukraine, also nicht weniger als die Auswirkungen auf Deutschland, die EU und die Welt. Dank Phoenix ist die Aufzeichnung (bald) auch im Fernsehen, auf YouTube und in der Mediathek zu finden. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Apokalypse-Diagrammen, PESCO-Geld für Großbritannien, Macrons neuesten Tweets und Verstimmung in Litauen. Sicherheitshalber · #63 LIVE Geopolitische Konsequenzen des russischen Kriegs in der Ukraine: Bleibt nichts wie es war? Ukraine und Geopolitik: 00:03:49 Fazit: 00:55:23 Sicherheitshinweise: 00:56:30 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema – Ukraine und Geopolitik Rede von Josep Borrell, Hoher Vertreter der Europäischen Union für Außen- und Sicherheitspolitik, 10.10.2022 Interview mit Frank, „Wir sehen Putins Demütigung bereits“, n-tv.de, 12.10.2022. Christoph B. Schiltz, EU will Tausende Soldaten der ukrainischen Armee ausbilden Die Welt 09.10.2022 Gustav Gressel, In Europe’s defence: Why the EU needs a security compact with Ukraine ECFR, 30 September 2022 Ukraine support tracker, IFW Kiel Sicherheitshinweise: Rike: UK macht bei PESCO military mobility mit https://www.politico.eu/newsl