full_description = "Folge 23: Ein europäischer Nuklearschirm? und Türkei & Russland in Syrien und das Ende des Flüchtlingsdeals 3. März 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 23 sprechen Ulrike Franke, Frank Sauer und Carlo Masala und Thomas Wiegold zunächst über die (fixe?) Idee eines von den USA unabhängigen nuklearen Schutzschirms für Europa. Das zweite Thema ist die volatile Situation in Syrien. Wir sprechen über die Kampfhandlungen zwischen Syrien, der Türkei und Russland sowie über die zynische politische Instrumentalisierung von flüchtenden Menschen. Abschließend wie immer der Sicherheitshinweis auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zum Friedensvertrag in Afghanistan, der deutschen Absage an die Triton-Drohne, der US-amerikanischen Absage ans Anti-Personenminen-Verbot sowie dem britischen Kampfeinsatz im Rahmen der UN-Mission in Mali. Hinweis zu Corona: 00:01:55 Thema #1: 00:04:57 Thema #2: 00:42:07 Sicherheitshinweise: 01:06:14 Neuigkeiten zum Sicherheitshalber-Shop: 01:17:00 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Schaut rein: Neue Produkte, niedrigere Preise, kostenlose Lieferung von 3. bis 7. März Erwähnte und weiterführende Interviews, Literatur und Dokumente: Zu SARS-CoV-2 (#COVID-19): Täglicher NDRInfo-Podcast mit Prof. Dr. Christian Drosten (auf Twitter @c_drosten), Direktor des Instituts für Virologie an der Berliner Charité (https://virologie-ccm.charite.de/). Link zum Podcast-Feed: https://www.ndr.de/nachrichten/info/podcast4684.xml Thema 1 – Ein europäischer Nuklearschirm? Rede Macrons in englischer Sprache: https://www.elysee.fr/en/emmanuel-macron/2020/02/07/speech-of-the-president-of-the-republic-on-the-defense-and-deterrence-strategy Deutscher Bundestag – Wissenschaftliche Dienste: “Völkerrechtliche Verpflichtungen Deutschlands beim Umgang mit Kernwaffen. Deutsche und 