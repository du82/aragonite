full_description = "Sicherheitshalber Spezial ***3. Geburtstag*** Patches & Tassen: “dark edition”! Q&A! Buchtipps! 19. Juli 202117. Februar 2025 ~ sicherheitspod Sicherheitshalber Spezial ***3. Geburtstag*** Patches & Tassen: “dark edition”! Q&A! Abseitiges! Buchtipps! “Sicherheitshalber“ ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt – an allen anderen 364 Tagen im Jahr. Heute – wie immer, wenn am 19. Juli Geburtstag gefeiert wird – reden Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mal wieder über alles Mögliche rund um den Podcast und darüber hinaus. Ergo gibt’s UFO Updates, ordentlich “Fan-Service” (neue Patches und Pötte!) und natürlich Antworten auf Hörerfragen, die eigentlich schon zum 2. Geburtstag fällig gewesen wären! Etwa: Was wäre eure erste Amtshandlung als Verteidigungsminister(in)? Oder, was noch viel dringender zu klären ist: Star Trek, Star Wars oder Stargate? +++ Diese Folge haben wir am 12. Juli aufgezeichnet. +++ Sicherheitshalber kommt schon in ein paar Tagen mit den gewohnten sicherheitspolitischen Inhalten aus der Sommerpause 2021 zurück – und zwar gleich zum Auftakt mit einer Analyse der Wahlprogramme der im Bundestag vertretenen Parteien anlässlich der Bundestagswahl 2021. Website: https://sicherheitspod.de/ Patreon: https://www.patreon.com/sicherheitspod Im Sicherheitshalber Shop findet ihr die neuen Sicherheitspötte „dark edition“ – nur für kurze Zeit! Unsere Aktion Patches, “dark edition”: Das Sicherheitshalber-Logo gibt es jetzt auf vielfachen Wunsch auch als dunklen Patch, in einer limitierten Auflage von 150 Stück. Als gesticktes Abzeichen mit 8 cm Durchmesser und mit Klett auf der Rückseite, für den Rucksack oder wo es sonst passen könnte… Im Falle der Patches muss Thomas jede Bestellung einzeln verpacken, adressieren, frankieren, zur Post bringen usw… (#EinzelnZurPost). Den ganzen Aufwand kriegt er nur bewältigt, wenn es wie folgt läuft: Für einen Patch bitte 6 (sechs) Euro überweisen auf das Konto Thomas WiegoldIBAN: DE62700222000020060182BIC: FDDODEMMXXX(FIDOR Bank)Verwendungszweck: Patch – und danach die Anschrift, an die er geschickt werden soll (ggf. auch einen Empfängernamen, wenn er nicht mit dem Namen des Kontoinhabers identisch ist). Ohne den Hinweis Patch geht das evtl. unter, also bitte unbedingt so angeben.Bitte max. zwei (2) Patches auf diese Weise bestellen – wer eine größere Bestellung vornehmen möchte, muss sich evtl. etwas länger gedulden; und bitte parallel zur Zahlung eine Mail an sicherheitspod@gmail.comDer Versand wird voraussichtlich ab dem 10. August starten; bitte also etwas Geduld.Vor allem aber: NUR SO LANGE DER VORRAT REICHT! Wir haben 150 Patches, also eine limited edition – wer ein paar Tage nach Veröffentlichung dieser Folge bestellt, bitte erst noch mal hier nachgucken, ob nicht evtl. schon alles weg ist. UFO Update: Lex Fridman Podcast, David Fravor: UFOs, Aliens, Fighter Jets, and Aerospace Engineering, https://www.youtube.com/watch?v=aB8zcAttP1E Cool Worlds, Breakdown of the Pentagon UFO videos with Mick West, 29.4.2020, https://youtu.be/Le7Fqbsrrm8 CBS 60 MInutes, Navy pilots describe encounters with UFOs (David Fravor & Alex Dietrich), 17.05.2021, https://www.youtube.com/watch?v=ZBtMbBPzqHY Roger Kisby, The Truth Has Not Always Been Out There, NYT, 25.6.2021, https://www.nytimes.com/2021/06/24/us/politics/ufo-report-us-pentagon.html Buchtipps: Rike: Joseph de Weck: Emmanuel Macron – Der revolutionäre Präsident Frank: Kim Stanley Robinson: New York 2140 Carlo: Jason Lyall: Divided Armies Thomas: Elliot Ackermann/James Stavridis: 2034 Die Geburtstage 1 und 2: Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Website! Patreon! Q&A! Buchtipps! https://soundcloud.com/sicherheitshalber/sicherheitshalber-spezial-2-geburtstag Sicherheitshalber Spezial ***1. Geburtstag*** https://soundcloud.com/sicherheitshalber/sicherheitshalber-spezial-jubilaumsfolge Ähnliche Beiträge Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Website! Patreon! Q&A! Buchtipps! (Update) 18. Juli 2020 in Allgemein Sicherheitshalber Spezial ***6. Geburtstag*** Der deutsche Diskurs, raketenmäßig. Außerdem: Patches! 19. Juli 2024 in Allgemein Folge 42: Der große europäische Strategievergleich: Frankreich. Großbritannien. Deutschland? 10. April 2021 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
