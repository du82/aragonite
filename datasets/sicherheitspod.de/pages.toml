title = "Sicherheitshalber Spezial ***6. Geburtstag*** Der deutsche Diskurs, raketenmäßig. Außerdem: Patches! – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Sicherheitshalber Spezial ***6. Geburtstag*** Der deutsche Diskurs, raketenmäßig. Außerdem: Patches! 19. Juli 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. Seit inzwischen sechs Jahren tragen Ulrike Franke, Carlo Masala, Frank Sauer und Thomas Wiegold ihren bescheidenen Teil zur sicherheitspolitischen Debatte in Deutschland bei. Dieses Jahr haben die vier sich zum Geburtstag Jörg Lau von der ZEIT eingeladen, der dankenswerterweise die Einladung angenommen hat. Ausgehend von der jüngsten Ankündigung, ab 2026 neue US-Mittelstreckenwaffen in Deutschland zu stationieren, fragen die vier Podcaster sich gemeinsam mit ihrem Gast: Wie steht es denn eigentlich um die sicherheitspolitische Diskussion in Deutschland im Jahr 2024? Ist sie besser geworden in den letzten Jahren? Jörg Lau ist der Meinung, dass sich tatsächlich vieles verändert hat. Die vier Podcaster fürchten, dass wir hier und da noch immer nicht schnell genug zum Notwendigen kommen. Wie sieht ihr das? Die Crew freut sich über Zuschriften! Ach ja, und … weil Geburtstag ist, gibt es natürlich auch Geschenke. Also für die Hörerinnen und Hörer. Es gibt – und einige werden sagen: endlich wieder! – Patches. Und das auch noch verbunden mit einem guten Zweck. Details weiter unten. Danke an dieser Stelle an alle Hörerinnen und Hörer, die sich den Sicherheitshalber Podcast regelmäßig antun. Haltet die Ohren steif. Es sind ernste und bewegte Zeiten – das hat Jörg Lau von der ZEIT offiziell bestätigt! Der Sicherheitspod kommt Anfang September aus der Sommerpause zurück. SiPo-Debatte: 00:01:54 Patches: 01:14:11 Es gibt sie wieder, die allseits beliebten und begehrten Sicherheitshalber-Patches! +++ Hier geht’s zum Online Shop +++ Limitierte Auflage: 1.000 Stück. Farbe: schwarz mit Sicherheitspod-Logo. Preis: 10 EUR (inkl. Versand) – Bitte nicht mehr als 5 Stück pro Person bestellen, sonst ist Briefversand unmöglich. Den Gewinn spenden wir in Kooperation mit md-textil an die Malteser, die vom russischen Angriffskrieg betroffenen Menschen in der Ukraine, in den Nachbarländern sowie in Deutschland humanitäre Hilfe zukommen lassen. Web: https://sicherheitspod.de/ (<– Achtung: hier gibt’s KEINE Patches. Für Patches, siehe oben) Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Unser Gesprächspartner: Jörg Lau, Außenpolitischer Korrespondent im Hauptstadtbüro, DIE ZEIT. X/Twitter: @joerglau Erwähnte und weiterführende Interviews, Literatur und Dokumente: Theo Sommer, Blick zurück in die Zukunft, DVA, 1984. Sylvie Kauffmann, Les aveuglés, Comment Berlin et Paris ont laissé la voie libre à la Russie, 2024. Jörg Lau, In 80 Phrasen um die Welt, Internationale Politik. Thomas Wiegold, USA und Deutschland vereinbaren zeitweise Stationierung weitreichender US-Waffen (mit Ergänzungen), Augengeradeaus, 10.07.2024. Lars Hoffmann, Tomahawk, SM-6 und neue Hyperschallwaffe Dark Eagle kommen nach Deutschland, hartpunkt, 11.07.2024. Thomas Newdick, U.S. Long-Range Missiles Headed To Germany As Arms Race Escalates, The War Zone, 11.07.2024. Lee Ferran, Let it go (long): France joins Germany, Italy and Poland in new ELSA long-range missile project, Breaking Defense, 12.07.2024. Interview mit Frank, „Sahra Wagenknecht und die AfD schüren falsche Ängste„, Chrismon, 17.07.2024. Interview mit Frank, Raketen und Nato-Zentrum? „Wir müssen solche Signale senden“, Wiesbadener Kurier, 18.07.2024. Social Media Gedöns: Sicherheitspod Twitter: @Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Blue Sky: @sicherheitspod.bsky.social Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Skeet: @rikefranke.bsky.social Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Skeet: @drfranksauer.bsky.social Carlo Tweet: @CarloMasala1 Skeet: @carlomasala1.bsky.social Carlo tröötet nicht. Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Skeet: @twiegold.bsky.social Ähnliche Beiträge Sicherheitshalber Spezial ***3. Geburtstag*** Patches & Tassen: “dark edition”! Q&A! Buchtipps! 19. Juli 2021 in Allgemein Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Website! Patreon! Q&A! Buchtipps! (Update) 18. Juli 2020 in Allgemein Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte 23. Juli 2022 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
