full_description = "Folge 15: Chinas sicherheitspolitische Fähigkeiten & Ambitionen 31. Juli 201917. Februar 2025 ~ sicherheitspod „Sicherheitshalber“ ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 15 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold mit Sarah Kirchberger, Leiterin der Abteilung Strategische Entwicklung in Asien-Pazifik am Institut für Sicherheitspolitik an der Universität Kiel. Die Diskussion dreht sich um Chinas militärische Projekte und Fähigkeiten und die Zukunft Taiwans und des Südchinesischen Meeres. Am Ende steht wie immer der „Sicherheitshinweis“, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu den französischen Militär-Ambitionen im Weltall, dem Stand der Diskussion zur Straße von Hormuz, dem Abzug britischer Truppen aus Deutschland und zwei Hinweisen für den rüstungskontrollpolitischen Kalender im Monat August. Thema China (mit Sarah Kirchberger) 00:01:35 Sicherheitshinweise 00:56:35 Unser Shop ist online: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Sicherheitshalber Aktuell: Bilanz der Amtszeit von Ministerin Ursula von der Leyen: https://augengeradeaus.net/2019/07/sicherheitshalber-der-podcast-aktuell-eine-kurze-bilanz-der-amtszeit-von-der-leyens/ Chinas militärische Fähigkeiten und politischen Ambitionen Unser Gast: Dr. Sarah Kirchberger: https://www.ispk.uni-kiel.de/en/center-for-asia-pacific-strategy-and-security/team/dr-sarah-kirchberger Sarah Kirchberger (2015), Assessing China’s Naval Power: Technological Innovation, Economic Constraints, and Strategic Implications. Berlin: Springer. ISBN 9783662471265 Text des neuen chinesischen Weissbuches: http://www.xinhuanet.com/english/2019-07/24/c_138253389.htm Tai Ming Cheung (2009), Fortifying China: The Struggle to Build a Modern Defense Economy, Ithaca & London: Cornell University Press. ISBN 9