full_description = "Folge #66 Wozu gibt es Militärseelsorge? | Ukraine: Der 2023-Vorausschau-Versuch | Buchempfehlungen 21. Dezember 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 66 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Barbara Hepp über Militärseelsorge. Die ehemalige Militärpfarrerin erklärt, wie Militärseelsorge in der Bundeswehr verortet ist und welche Aufgaben sie übernimmt. Es geht natürlich auch ein bisschen um Weihnachten und die Bedeutung von Traditionen, die in Auslandseinsätzen ganz besonders wichtig werden können. Im zweiten Teil wenden die vier den Blick nach vorn und identifizieren die Faktoren, die für den Verlauf des russischen Kriegs gegen die Ukraine im Übergang von 2022 nach 2023 bestimmend sein werden. Vorhersagen sind seriöserweise nicht möglich. Niemand weiß, wann und wie der Krieg endet. Aber aktuell – so viel kann man sagen – deuten alle Anzeichen leider in Richtung noch länger andauernder Gefechte. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit “Amtshilfe” in Großbritannien, Covid in China und Puma-Debakel in Deutschland. Allen Hörerinnen und Hörern frohe Feiertage und einen guten Rutsch in ein (hoffentlich ganz bald) friedlicheres Jahr 2023. Bleibt gesund, wir hören uns bald wieder. Militärseelsorge: 00:02:33Ukraine 2023: 00:43:40Fazit: 01:06:50Sicherheitshinweise: 01:08:50Buchempfehlungen: 01:15:50 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Militärseelsorge Unser Gast: Barbara Hepp, Leiterin der Evangelischen Stadtakademie München und ehemalige Militärdekanin an der Universität der Bundeswehr München https://www.stadtakademie-muenchen.de/blog/barbara-hepp-die-stadtakademie-muenchen/ Militärseelsorge in der Bundeswehr – Bundeswehr.de Thomas Elssner, Militärseelsorge für Muslime in der Bundeswehr, Eine Skizze 2018 Muslimische Militärseelsorge in der Bundeswehr?, Akademie fuer Islam und Wissenschaft in der Gesellschaft, 10. Januar 2022 Thema 2 – Ukraine Sergey Radchenko. What will Putin do next? Spectator, 18.12.2022 Martin Knobbe. Der Kanzler und die Panzer – Der sorgenvolle Herr Scholz, Spiegel, 20.12.2022 Sicherheitshinweise: Ulrike: Britisches Militaer im zivilen Einsatz https://radio.bfbs.com/radioplayer/podcast/f7b6f0c8-87d9-5b60-84c6-9655b5b6b39b Frank: Covid-19 in China 2023 https://www.npr.org/sections/goatsandsoda/2022/12/15/1143002538/china-appears-to-be-facing-what-could-be-the-world-s-largest-coronavirus-outbrea Carlo und Thomas: Puma down https://augengeradeaus.net/2022/12/bundeswehr-meldet-schuetzenpanzer-probleme-kurz-vor-bereitschaft-fuer-nato-eingreiftruppe/ & https://augengeradeaus.net/2022/12/erste-konsequenz-aus-puma-debakel-lambrecht-stellt-2-los-infrage/ Buchempfehlungen: Carlo: Don Winslow: City on Fire, Harper Collins 2022 Lucky Chops: New Day (Musik) Charles Llyod: Tone Poem (Musik) Rike: Anais Llobet: Au café de la ville perdue Sylvain Neuvel: A history of what comes next Thomas: Paul Jankowski: Das Wanken der Welt – Wie 1933 der Weltfrieden verspielt wurde Frank: Anil Seth 2021: Being You: A New Science of Consciousness. Unsere Twitter- und Mastodon-Handles: Rike: Twee: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Frank: Tweet: @drfranksauerTrööt: mastodontech.de/@drfranksauer Carlo:Tweet: @CarloMasala1 Thomas: Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Ähnliche Beiträge Folge 45: Taiwan: Kriegsgefahr zwischen China und den USA? | Zehn Jahre Aussetzung der Wehrpflicht 30. Juni 2021 in Allgemein Folge #59 Was macht eigentlich China? Ukraine-Krieg beobachten, Russland stützen, Systemkonflikt forcieren 31. Mai 2022 in Allgemein Folge #86 Realismus und Realität – wozu Theorien gut sind | War die ganze Rüstungskontrolle fürn Arsch? 2. Oktober 2024 in Allgemein Veröffentlicht in Allgemein V