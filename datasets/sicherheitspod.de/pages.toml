full_description = "Sicherheitshalber wird 4 Jahre alt 14. Juli 202217. Februar 2025 ~ sicherheitspod Wir feiern unseren 4. Geburtstag! Mit kalten Getränken, seichten Themen und schlauen Überraschungsgästen. Das Sicherheitshalber SuperSommerSpezial findet live auf Zoom statt – und zwar Mittwoch, den 20.07.2022 um 19:00 Uhr. Die Folge erscheint danach auch als Podcast. Aber live dabei sein ist etwas Besonderes. Also feiert mit! Wir freuen uns auf euch. Hier geht’s zur Anmeldung: https://www.eventbrite.de/e/4-geburtstag-das-supersommerspezial-live-tickets-374218897797 Ähnliche Beiträge Folge #67 Was ist “Wehrhaftigkeit”? | Was hält uns nachts wach, wird übersehen, wird positiv überraschend? 11. Januar 2023 in Allgemein Sicherheitshalber Spezial ***3. Geburtstag*** Patches & Tassen: “dark edition”! Q&A! Buchtipps! 19. Juli 2021 in Allgemein Folge #60 Atomkriegs-Risiko und Sicherheit in Europa: Funktioniert Abschreckung? | Brennpunkt Kaliningrad 28. Juni 2022 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
