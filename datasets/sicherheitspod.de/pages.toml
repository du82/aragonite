full_description = "Folge 9: Die sicherheitspolitische Debatte in Deutschland, Ausländer in die Bundeswehr? 9. Februar 201917. Februar 2025 ~ sicherheitspod **Sicherheitshalber ist für den Podcastpreis nominiert – und die Hörerinnen und Hörer können hier abstimmen (und das täglich, bis zum zum 15. Februar – mit drei Stimmen)** Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 9 reden Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold zunächst über die sicherheitspolitische Debatte in Deutschland: Immer wieder wird sie angemahnt, aber gibt es sie überhaupt? Und wer sind eigentlich die Akteure in dieser Debatte? Im zweiten Teil schauen wir auf die immer wieder aufflackernde Diskussion über die Frage: (EU)Ausländer in die Bundeswehr? Die Zeitangaben zu den einzelnen Themen: Deutsche sicherheitspolitische Debatte: 00:01:51 EU-Staatsbürger in die Bundeswehr: 00:39:05 Unser Sicherheitshinweis: 00:53:52 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Die deutsche sicherheitspolitische Debatte Nora Müller: Den Schuß nicht gehört, ZEIT online, 22. Januar 2019 https://www.zeit.de/politik/ausland/2019-01/aussenpolitik-deutschland-europa-vereinte-nationen-internationale-verantwortung Hans-Ulrich Klose: Welt und Wahlkreis. Warum es uns an außenpolitischen Experten mangelt, Internationale Politik, 1. November 2012 https://zeitschrift-ip.dgap.org/de/ip-die-zeitschrift/archiv/jahrgang-2012/november-dezember/welt-und-wahlkreis Stephen Walt, The Hell of Good Intentions, America’s Foreign Policy Elite and the Decline of U.S. Primacy, Oktober 2018, https://us.macmillan.com/books/9780374280031 Deutschlandfunk, Johann Wadephul (CDU) für Militär-Einsatz im Mittleren und Nahen Osten, 7. Februar 2019 https://www.deutschlandfunk.de/anti-is-kampf-wadephul-cdu-fuer-militaer-einsatz-im.694.de.html?dram:article_id=440387 Hanns Maull, Auf leisen Sohlen aus der Aussenpolitik? Internationale Politik, 1. Se