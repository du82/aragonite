full_description = "Folge #91 Schmuggel, Sabotage, “Schattenflotte” | Wiedervorlage: Geopolitik nach Covid 18. Januar 202517. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 91 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala im ersten Segment mit Nele Matz-Lück. Die Seerechts-Expertin erklärt, was die Schattenflotte eigentlich ist, wie die rechtlichen Rahmenbedingungen sind und weswegen es aktuell so wenig Handhabe gibt, um vermuteten Sabotageakten auf hoher See wirksam nachzugehen. Carlo fragt dann natürlich, warum man die verdächtigen Schiffe nicht einfach versenken kann … Im zweiten Teil rekurrieren die vier Podcaster auf eine beinahe 5 Jahre alte Folge, in der sie die Auswirkungen der Covid-Pandemie auf die internationale Politik diskutiert hatten. Wie stellt sich diese Diskussion in der Rückschau dar? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit dem E-X-odus des BMVg, dem HALFLOOP24-Hack, dem Ende der Drohnendebatte und dem Anfang der Drohnenabwehr. Schattenflotte: 00:02:00 Wiedervorlage Covid: 00:50:43 Fazit: 01:26:31 Sicherheitshinweise: 01:28:41 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Thema 1: Schattenflotte Unsere Gesprächspartnerin: Prof. Dr. Nele Matz-Lück, Professorin für Öffentliches Recht mit dem Schwerpunkt Völkerrecht, insbesondere Seerecht, an der Christian-Albrechts-Universität zu Kiel Live-Karte: Positionsdaten der russischen Schattenflotte The Economist, Finland’s seizure of a tanker shows how to fight Russian sabotage, 01.01.2025 Sophia Besch and Erik Brown, Securing Europe’s Subsea Data Cables, Carnegie, 16.12.2024 Meaghan TobinMuyi Xiao and Amy Chang Chien, Taiwan Says It Suspects a Chinese-Linked Ship Damaged an Undersea Inter