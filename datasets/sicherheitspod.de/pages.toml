full_description = "Folge #88 Axis of upheaval, Ukraine … sind wir schon im Weltordnungskonflikt? | Privatkapital für Rüstung? 5. November 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 88 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über die “axis of upheaval” (und BRICS), also Staaten, die die aktuelle Weltordnung offen herausfordern. In diesem Zusammenhang erörtern die vier auch, wie der russische Krieg gegen die Ukraine sich – vielleicht, vielleicht auch nicht? – in diese Überlegungen zu Weltordnungskonflikten einfügt. Im zweiten Teil geht es um die private Finanzierung von Rüstungsgütern und die Frage, ob die bestehenden Regulierungen in der EU im Lichte der düsteren Sicherheitslage womöglich überdacht werden müssen. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einer allzu realistischen Katastrophenübung in Berlin, einem neuen Vertrag zwischen Großbritannien und Deutschland, schrumpfenden britischen Landstreitkräften und einer wieder aufwachsenden russischen Armee. “Axis of upheaval” und Weltordnung: 00:02:37 Privatkapital für Rüstung: 00:53:12 Fazit: 01:13:50 Sicherheitshinweise: 01:14:50 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Fashion Tip und Veranstaltungshinweis: Derek Guy, How to dress for the civil war, X/Twitter, 04.11.2024 Sicherheitshalber Live – am 22.11. sind wir zu Gast bei der “Buch Wien” Thema 1: “Axis of upheaval” Joint Statement of the Russian Federation and the People’s Republic of China on the International Relations Entering a New Era and the Global Sustainable Development, 04.02.2022 Ukraine is now struggling to cling on, not to win, Economist, 29.10