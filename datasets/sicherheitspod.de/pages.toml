full_description = "Folge 19: Wer macht deutsche Sicherheitspolitik? und: Afrika 2. November 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold nehmen die aktuellen Diskussionen um AKKs Schutzzonen-Vorschlag für Syrien und die Forderung nach einem Nationalen Sicherheitsrat zum Anlass, in Folge 19 mal zu klären, wie in Deutschland eigentlich Außen- und Sicherheitspolitik gemacht wird (Achtung, es kommen Handpuppen zum Einsatz). Danach lassen wir den Blick nach Afrika schweifen, um einen Überblick über die (zahlreichen) Missionen der Bundeswehr zu erlangen und vor diesem Hintergrund nach der deutschen Strategie für den Kontinent zu fragen. Am Ende steht wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu den neuen KI-Prinzipien des Pentagons, zum Hack von WhatsApp, zu polnischen Trollfarmen und zur Unbedenklichkeitsprüfung bei Grundbesitzerwerb in Finnland (inkl. Serientip). Thema #1: 00:05:00 Thema #2: 00:42:15 Sicherheitshinweise: 01:05:48 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Wie wird deutsche Außen- und Sicherheitspolitik gemacht? Julianne Smith: Aussenansicht: Denk ich an Deutschland, SZ, 13.2.2019, https://www.sueddeutsche.de/politik/aussenansicht-denk-ich-an-deutschland-1.4326101 Christina Moritz: Höchste Zeit für einen Nationalen Sicherheitsrat, FAZ, 23.10.2019 https://m.faz.net/aktuell/politik/inland/gastbeitrag-hoechste-zeit-fuer-einen-deutschen-sicherheitsrat-16447310.amp.html Muriel Asseburg, Markus Kaim: Eine internationale Sicherheitszone in Syrien – Versuch einer Klärung. Stiftung Wissenschaft und Politik (SWP) “Kurz gesagt”, 30.10.2019 https://www.swp-berlin.org/publikation/eine-internationale-sicherheitszone-in-syrie