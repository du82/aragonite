["https://sicherheitspod.de/2021/06/06/folge-44-raketenabwehr-wie-funktioniert-das-eigentlich-die-nicht-reform-zur-bundeswehr-der-zukunft"]
title = "Folge 44: Raketenabwehr: (Wie) funktioniert das eigentlich? | Die Nicht-Reform zur Bundeswehr der Zukunft – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 44: Raketenabwehr: (Wie) funktioniert das eigentlich? | Die Nicht-Reform zur Bundeswehr der Zukunft 6. Juni 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 44 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über Raketenabwehr im Großen wie im Kleinen. Es geht dabei nicht nur um den jüngsten Einsatz des israelischen Iron Dome, sondern auch um Laser, strategische Raketenabwehr gegen Interkontinentalraketen, ob und wie das alles funktioniert – und vor allem auch, was die abschreckungspolitischen Implikationen der strategischen Raketenabwehr sind. Im zweiten Teil wenden die vier Podcaster sich dem neuen “Eckpunktepapier” zur “Reform” (die man nicht Reform nennen soll!) der Bundeswehr zu. Mehr Truppe, weniger Stäbe, mehr einsatzbereites Material und schnellere Verfahren … das klingt doch eigentlich gut, oder? Mal sehen. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zum Ende des “Vertrags über den Offenen Himmel”, Spekulationen zu algorithmisch per Drohne getöteten Personen in Libyen, einem neuen Impuls für die internationale Regulierung solcher Waffensystemautonomie sowie einem erneuten Hinweis darauf, dass Menschen besser nicht mit Nuklearwaffen herumhantieren sollten. Sicherheitshalber · #44 Raketenabwehr: (Wie) funktioniert das eigentlich? | Die Nicht-Reform zur Bundeswehr der Zukunft Raketenabwehr: 00:02:43Eckpunktepapier: 00:53:38Fazit: 01:20:34Sicherheitshinweise: 01:22:17 Web: https://sicherheitspod.de/Shop: https://shop.spreadshirt.de/sicherheitshalbershopPatreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente:(Langfassung auf: www.sicherheitspod.de) Thema 1 – Raketenabwehr Andrew Englang: Israel’s Iron Dome keeps toll of rockets in check, Financial Times, 14.5.2021,https://www.ft.com/content/65b74c14-3ed7-4e4d-8fcf-f28520225d84 Barak Ravid: Israel to ask U.S. for $1 billion in emergency military aid, Axios, 1.6.2021https://www.axios.com/israel-1-billion-military-aid-gaza-iron-dome-486f640a-4b95-470b-a59b-b28673fd404e.html Arms Control Association: Missile Defense Systems at a Glance,https://www.armscontrol.org/factsheets/missiledefenseataglance Congressional Research Service: Defense Primer: Ballistic Missile Defense, 29.12.2020,https://crsreports.congress.gov/product/pdf/IF/IF10541 National Research Council 2012: Making Sense of Ballistic Missile Defense,https://www.nap.edu/read/13189/chapter/1 Naomi Egel and Jane Vaynman: Reconsidering Arms Control Orthodoxy, War on the Rocks, 26.3.2021,https://warontherocks.com/2021/03/reconsidering-arms-control-orthodoxy/ Robert Soofer: Missile Defense is Comptabile with Arms Control, War on the Rocks, 29.04.2021,https://warontherocks.com/2021/04/missile-defense-is-compatible-with-arms-control/ Carlos Sicherheitshalber Aktuell zum Iron Dome: https://twitter.com/Sicherheitspod/status/1392459350552285185 Folge #33 zur Drohnenabwehr https://soundcloud.com/sicherheitshalber/33-feministische-ausenpolitik-flugabwehr-gegen-drohnen-fahigkeitslucke-short-range-air-defense Folge #20 Raketen, Raketen, Raketen mit Fabian Hinz https://soundcloud.com/sicherheitshalber/20-raketen-raketen-raketen-und-macron-akk-und-nato Folge #12 zu Hyperschallwaffenhttps://soundcloud.com/sicherheitshalber/12-hyperschallwaffen-und-multinationale-verbande Garwin, Richard L./Bethe, Hans 1968: Anti-Ballistic-Missile Systems, in: Scientific American 218 (3): 21-31, https://fas.org/rlg/03%2000%201968%20Bethe-Garwin%20ABM%20Systems.pdf Wer mal so ein kinetisches “Kill Vehicle” für die strategische US-Raketenabwehr sehen will:https://www.youtube.com/watch?v=KBMU6l6GsdM (Video ist schon älter. Achtung: Laut!) Atari Classics (im Browser): Missile Commandhttps://games.aarp.org/games/atari-missile-command Thema 2 