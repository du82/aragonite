full_description = "Folge 43: Afghanistan: Was bleibt? | Zukünftige Auslandseinsätze: Koalitionen der Willigen (k)eine Option? 9. Mai 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 43 diskutieren Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala das zwei Jahrzehnte lange und dieses Jahr endende Engagement Deutschlands und der Bundeswehr in Afghanistan. Welche Lehren können daraus gezogen werden? Ist der Abzug vielleicht sogar ein Fehler? Im zweiten Teil erörtern die vier Podcaster den rechtlichen und politischen Rahmen, in dem der Bundestag über Auslandseinsätze entscheidet – ein nicht nur mit Blick auf die kommende Bundestagswahl bedeutsames und kontroverses Thema. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit der “Fischfang-Implikation” für die Theorie des Demokratischen Friedens (Hallo, Jersey, Großbritannien und Frankreich), einer dräuenden Bundeswehrreform (Hallo, ZSanDstBw und SKB), einem Tabu-Wort (Hallo, EU-Armee) und der maximalen Sicherheitspod-Selbstreferenzialität (Hallo, PeaceLab-Blog, Sarah Brockmeier und Nationaler Sicherheitsrat). Sicherheitshalber · #43 Afghanistan: Was bleibt? | Zukünftige Auslandseinsätze: Koalitionen der Willigen (k)eine Option? Afghanistan: 00:02:17 Koalition der Willigen: 00:55:00 Sicherheitshinweise: 01:27:34 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Afghanistan Bundestagsdrucksache 14/7930, 21.12.2001Antrag der Bundesregierung: Beteiligung bewaffneter deutscher Streitkräfte an dem Einsatz einer Internationalen Sicherheitsunterstützungstruppe in Afghanistan auf Grundlage der Resolutionen 1386 (2001), 1383 (2001) und 1378 (2001) des Sicherh