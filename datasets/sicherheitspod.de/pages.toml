full_description = "Folge #90 Syrien und Nahost | Mental gesund und zuversichtlich, trotz Krisen, Krieg, Atomangst? | Buchtipps 18. Dezember 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 90, der letzten Folge des Jahres 2024, sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Florence Gaub – und zwar in beiden Segmenten! Eine Premiere. Zuerst erklärt Florence die Lage in Syrien nach dem Sturz Assads. Wer ist nun an der Macht? Welche Konsequenzen hat diese Entwicklung für die Region? Welche für Russland? Was sind die Interessen Israels und der Türkei? So viel steht fest: Die Zukunft Syriens ist offen, und um die Zukunft geht es auch im zweiten Teil. Die vier Podcaster diskutieren mit Florence, wie man trotz der in vielerlei Hinsicht schwierigen Lage geistig gesund und hoffnungsvoll mit Blick auf die Zukunft bleibt. Das geht nämlich durchaus – auch oder vielleicht gerade dann, wenn man Sicherheitspod macht und hört. Abschließend, wie immer zum Jahresende, die allseits bekannten und beliebten Buchtipps. Die Sicherheitspod Crew wünscht allen Hörerinnen und Hörern schöne Feiertage und einen guten Start ins neue Jahr. Auf Wiederhören 2025! Syrien und Nahost: 00:03:05 Positiv in die Zukunft: 00:52:18 Fazit: 01:21:20 Buchtips: 01:22:40 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Unsere Gesprächspartnerin: Florence Gaub, Twitter/X: https://x.com/FlorenceGaub Thema 1: Syrien und Nahost Markus Bickel: Angriff auf Irans Atomprogramm: Israel wartet auf grünes Licht von Trump, Security Table, 16.12.2024 Thema 2: Positiv in die Zukunft Economist: Sun Machines: Solar, an energy source that gets cheaper and cheaper, is going to be huge, 20.06.2024 Buchtips: Frank: Edward Geist: Deterrence under Uncertainty