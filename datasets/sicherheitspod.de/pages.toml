full_description = "Folge 25: Globale Machtverschiebungen durch Corona? und: Abzug aus Afghanistan 7. April 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 25 reden Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold zuerst darüber, welche internationalen Auswirkungen und vor allem globalen Machtverschiebungen die Corona-Pandemie nach sich ziehen könnte. Im zweiten Teil beleuchten wir den beginnenden Abzug der internationalen Truppen aus Afghanistan. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Abschreckung im Pazifik, einer vermeintlichen Seeschlacht, dem Corona-Kalender der Rüstungskontrolldiplomate und dem bevorstehenden Ende des “Vertrags über den Offenen Himmel (Open Skies)”. Außerdem: maritime Metaphern! Globale Machtverschiebungen durch Corona?: 00:02:10 Abzug aus Afghanistan: 00:43:29 Sicherheitshinweise: 00:58:48 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Neue Produkte und Preise! Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Globale Machtverschiebungen durch Corona? Matthias Rogg, COVID-19 – die Pandemie und ihre Auswirkungen auf die Sicherheitspolitik, #GIDS Statement, Nr. 1, 2020, https://gids-hamburg.de/wp-content/uploads/2020/04/GIDSstatement2020_1_Rogg_COVID19.pdf# Henry A. Kissinger, The Coronavirus Pandemic Will Forever Alter the World Order, Wall Street Journal, 3 April 2020 https://www.wsj.com/articles/the-coronavirus-pandemic-will-forever-alter-the-world-order-11585953005 Scholz und Maas sichern EU-Partnern Solidarität in Coronakrise zu, Spiegel, 6.4.2020 https://www.spiegel.de/politik/deutschland/corona-krise-heiko-maas-und-olaf-scholz-sichern-eu-partner-solidaritaet-zu-a-526fa3de-cd1e-4e34-b92a-f7e95124ffbb Mira Rapp-Hooper, China, America, and the International Order after the 