title = "Folge 38: Kriegsbild der Zukunft: Frieden durch Resilienz? | Brexit: (Nur) sicherheitspolitisch kein #FAIL – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 38: Kriegsbild der Zukunft: Frieden durch Resilienz? | Brexit: (Nur) sicherheitspolitisch kein #FAIL 9. Januar 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 38 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über das zukünftige Kriegsbild, also die Vorstellungen, die wir uns von den Konflikten der Zukunft machen. Altbekannte Bedrohungen durch konventionelle Streitkräfte spielen darin ebenso eine Rolle wie “hybride Kriegsführung”, also etwa gezielte Desinformationskampagnen zur Polarisierung und Spaltung von Gesellschaften. Was ist aus deutscher und europäischer Sicht der richtige Umgang mit solchen Herausforderungen? Und was heisst das alles für den Unterschied zwischen Krieg und Frieden, und für die Rüstungskontrolle im 21. Jahrhundert? Als zweites wenden die vier Podcaster sich dem Brexit zu. Alle sind sich einig: Dieser scheint (zumindest) für die europäische Sicherheit und Verteidigung kein Debakel. Gegenstand von Diskussionen ist aber, ob Großbritannien seine eigenen, mit dem Brexit verbundenen globalen Ambitionen wird einlösen können. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Fragezeichen zu Frankreichs militärischem Engagement in Mali, einem “Signal” gegen WhatsApp, einer PESCO-Regel für Drittländer und dem dezenten (Warn-)Hinweis, dass ab jetzt die Parteien in Deutschland auch sicherheitspolitisch in den Wahlkampfmodus schalten. Kriegsbilder: 00:02:55 Brexit: 00:43:14 Sicherheitshinweise: 01:03:25 Hausmitteilungen: 01:12:38 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Kriegsbilder der Zukunft GI Eberhard Zorn im Interview,, NZZ, 20.12.2020 https://www.nzz.ch/international/eberhard-zorn-verteidigung-ist-eine-gemeinschaftsaufgabe-ld.1589704 Carlo im Interview, Welt, 23.12.2020 https://www.welt.de/politik/deutschland/plus223050032/Sicherheitspolitik-Auch-Deutschland-muss-bereit-sein-Terroristen-zu-jagen.html Papiere des Heeres: 2017: Wie kämpfen Landstreitkräfte zukünftig?: https://augengeradeaus.net/wp-content/uploads/2018/03/180327-Thesenpapier-I-Wie-ka%CC%88mpfen-LaSK-zuku%CC%88nftig.pdf 2019: Künstliche Intelligenz in den Landstreitkräften: https://www.bundeswehr.de/resource/blob/156024/d6ac452e72f77f3cc071184ae34dbf0e/download-positionspapier-deutsche-version-data.pdf US Army “Mad Scientist Laboratory” https://madsciblog.tradoc.army.mil/ Raphael S. Cohen et al: The Future of Warfare in 2030: Project Overview and Conclusions, RAND, 2020, https://www.rand.org/pubs/research_reports/RR2849z1.html Tracey German: How will wars be fought in the future?, Oxford University Press Blog, 20.07.2019 https://blog.oup.com/2019/07/how-will-wars-be-fought-in-the-future/ Helen Warrell: Future of warfare: high-tech militias fight smouldering proxy wars, FT, 21.01.2021, https://www.ft.com/content/ab49c39c-1c0c-11ea-81f0-0c253907d3e0 Handeln in der Pandemie – Blaupause für hybride Kriegführung, Generaloberstabsarzt Ulrich Baumgärtner, Inspekteur des Sanitätsdienstes der Bundeswehr, in: Behörden-Spiegel, 8.01.2021 https://www.behoerden-spiegel.de/2021/01/08/handeln-in-der-pandemie-blaupause-fuer-hybride-kriegfuehrung/ ‚Psychological Warfare‘: Taliban Adopts New Strategy In Afghanistan, RFE/RFL 8.01.2021 https://gandhara.rferl.org/a/psychological-warfare-taliban-adopts-new-strategy-in-afghanistan-/31039336.html Thema 2 – Brexit Ulrike Franke: UK-EU Defence Cooperation after Brexit, ECFR, December 2020, https://ecfr.eu/article/how-britain-and-the-eu-could-cooperate-on-defence-after-brexit/ Brexit – mit Auswirkungen auf die EU-Sicherheits- und Verteidigungspolitik?, NDR Streitkräfte und Strategien, 27.12.2020 https: