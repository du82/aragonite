full_description = "Folge #64 Sechs falsche Lehren aus dem Ukraine-Krieg | Frische strategische Buchstabensuppe aus den USA 7. November 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 64 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst mit Franz-Stefan Gady vom IISS, der gerade von einer Recherchereise aus der Ukraine zurückgekehrt ist. Die Diskussion dreht sich um die Frage, welche Lehren man aus dem Krieg besser nicht ziehen sollte. Es geht um Doktrin, Streitkräftestrukturen und Technik – mit anderen Worten: es wird stellenweise ziemlich militär-nerdig. Spoiler: Es gibt keine Wunderwaffen! Im zweiten Teil wenden die vier Podcaster sich der reichlich verspätet komplettierten und mit Spannung erwarteten neuen Strategiedokumentelandschaft der Biden-Administration zu – es geht also um die “National Security Strategy” sowie um die “National Defense Strategy”. Diese wiederum besteht aus NPR und MDR. Keine Sorge, die Abkürzungen werden aufgelöst – so viel vorab: NPR steht nicht für “National Public Radio” und MDR nicht für “Mitteldeutscher Rundfunk”. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einer möglichen Falle in Kherson, neuen Aufgaben für die deutsche Marine, privat beschafften britischen Truppentransportern für die Ukraine und den Auswirkungen der iranischen Drohnenlieferungen an Russland auf israelische Luftangriffe in Syrien. Ukraine: 00:02:00 U.S. NSS NDS NPR MDR: 00:57:23 Fazit: 01:21:31 Sicherheitshinweise: 01:23:00 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Ukraine Unser Gesprächspartner: Franz-Stefan Gady Senior Fellow for Cyber Power and Future Conflict, Institute for International Strategic Studies (IISS), London, Twitter: @HoansSolo Franz-Stefan Gady. 6 Wrong Lessons for Taiwan From the War in Ukraine. Foreign Policy. 02.11.2022. Franz-Stefan Gady. Predicting Military Performance Can’t Be Perfect. But It Can Be Better. World Politics Review. 18.06.2022. Thema 2 – U.S. NSS NDS NPR MDR National Defense Strategy including the 2022 National Posture Review and 2022 Missile Defense Review. FACT SHEET: The Biden-⁠Harris Administration’s National Security Strategy. White House.. 12.10.2022. Joe Cirincione. A failure to review America’s nuclear posture. Bulletin of the Atomic Scientists. 28.10.2022. Emma Claire Foley. Biden’s nuclear posture review maintains nuclear status quo. Bulletin of the Atomic Scientists. 28.10.2022. Atlantic Council. Eight things you need to know about the new US National Defense Strategy. 27.10.2022. Andrea Kendall-Taylor and Michael Kofman. Russia’s Dangerous Decline: The Kremlin Won’t Go Down Without a Fight. Foreign Affairs. Nov/Dec 2022. Carl Bildt. The new US National Security Strategy: Battling China for technological leadership. CER. 24.10.2022. Konstantinos Tsetsos. Resilienz denken. Metis Studie #21. November 2020. Sicherheitshinweise: Carlo: Kherson. Eine Falle? https://www.wionews.com/world/russia-hints-retreat-in-southern-ukraine-but-kyiv-thinks-its-a-trap-531050 Thomas: Deutsche Marine beteiligt sich am Schutz der kritischen maritimen Infrastruktur Norwegens https://www.presseportal.de/pm/67428/5360395 Rike: Iran-Russland Beziehung macht Israel in Syrien das Leben schwer. https://www.haaretz.com/news/middle-east/2022-10-26/ty-article-opinion/.highlight/the-russia-iran-drone-war-on-ukraine-is-a-stark-warning-for-israel/00000184-0f16-dbfb-a1df-6fd794140000?lts=1667761831286 Frank: 50 privat beschaffte gepanzerte Truppentransporter für die Ukraine https://www.theguardian.com/world/2022/nov/03/a-joke-that-went-out-of-control-crowdfunding-weapon