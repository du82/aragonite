full_description = "Folge 34: Militärische Nutzung von Neurotechnologie | Die NATO-2%, oder: Wieviel Prozent hätten sie denn gern? 1. Oktober 202017. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 34 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über das Gehirn als Teil des Schlachtfelds – und zwar über die lange Geschichte dahinter ebenso wie über die jüngsten Bestrebungen in Sachen militärischer Anwendung von Neurotechnologie. Von Harry Houdini zur Hirn-Computer-Schnittstelle. Erst gruselt sich Rike, dann alle vier. Im zweiten Teil wenden die Sicherheitspodder sich – mal wieder, aber diesmal ausführlich, systematisch – dem berühmt-berüchtigten NATO 2%-Ziel zu. Motto: Zahlen, Daten, Fakten, und immer an die HörerInnen denken. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit der “State of the European Union”-Rede von Ursula von der Leyen, der US-Präsidentschaftswahl, den Kampfhandlungen zwischen Armenien und Aserbaidschan und der Schweizer Entscheidung in Sachen nüüe Champfflüüglis. Sicherheitshalber · #34 Militärische Nutzung von Neurotechnologie| Die NATO-2%: Wieviel Prozent hätten Sie denn gern? Neuro: 00:01:45 NATO 2% : 00:32:00 Sicherheitshinweise: 00:58:43 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Militärische Nutzung von Neurotechnologie Prof. Dr. Bertolt Meyer – Professor für Psychologie…und gedankenkontrollierte Musik 😉 https://www.tu-chemnitz.de/hsw/psychologie/professuren/owpsy/Team/meyer.php Hacking my arm prosthesis to output CV so that it plugs into my synth: SynLimb live modular set as aired on modular.world Ep 3 (June 13 2020):https://www.youtube.com/watch?v=xO