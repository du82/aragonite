ed Artikel zu Überwachungskapitalismus- Byron Tau How the Pentagon Learned to Use Targeted Ads to Find Its Targets—and Vladimir Putin Carlo: US schickt Hilfslieferungen nach Gaza – U.S. CENTCOM, United States Central Command and Royal Jordanian Armed Forces Conduct Additional Airdrops of Humanitarian Aid Into Gaza Social Media Gedöns: Sicherheitspod Twitter: @Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Blue Sky: @sicherheitspod.bsky.social Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Skeet: @rikefranke.bsky.social Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Skeet: @drfranksauer.bsky.social Carlo Tweet: @CarloMasala1 Skeet: @carlomasala1.bsky.social Carlo tröötet nicht. Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Skeet: @twiegold.bsky.social Ähnliche Beiträge Folge #57 Die überschätzten russischen Streitkräfte: Fehlersuche | Waffenlieferungen: Pro & Contra 23. April 2022 in Allgemein Folge 15: Chinas sicherheitspolitische Fähigkeiten & Ambitionen 31. Juli 2019 in Podcast Folge 20: Raketen, Raketen, Raketen, und Macron, AKK und NATO 21. November 2019 in Podcast Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
