full_description = "Folge 11: NATO-Geburtstag und Bundeswehr-Werbung 5. April 201917. Februar 2025 ~ sicherheitspod „Sicherheitshalber“ ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 11 erörtert Thomas Wiegold mit Ulrike Franke, Carlo Masala und Frank Sauer anlässlich des 70. Geburtstags der NATO die Bedeutung der Allianz und ihre Besonderheiten. Im zweiten Teil beleuchten wir den aktuellen Aufreger rund um die Arbeit der Jugendoffiziere der Bundeswehr in Schulen und diskutieren dann kontrovers die Rekrutierungsbemühungen der Bundeswehr. Am Ende steht wie immer der „Sicherheitshinweis“, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zum Vorstoß von CDU-Chefin Annegret Kramp-Karrenbauer in Sachen “Allgemeine Dienstpflicht” (Carlo), zu Präsident Trump und der “nuklearen Monarchie” in den USA (Frank), zur jüngsten Gerichtsentscheidung in Sachen Ramstein und US-Drohnenprogramm (Rike) sowie zu den Planungen für Militär-Imame in der Bundeswehr (Thomas). NATO: 00:03:15 Jugendoffiziere & Bundeswehr-Nachwuchswerbung: 00:40:30 Sicherheitshinweis: 00:59:00 Unser Shop ist online! https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – 70 Jahre NATO Wales Gipfeltreffen (2014) Abschlussdokument: https://www.nato.int/cps/en/natohq/official_texts_112964.htm?mode=pressrelease “Die USA rechnen mit den Verbündeten ab” (Rede von US-Verteidigungsminister Robert Gates im Juni 2011), Augen geradeaus!, 10. Juni 2011 https://augengeradeaus.net/2011/06/die-usa-rechnen-mit-den-verbundeten-ab/ Johannes Varwick: Auf dem Weg zum Weltpolizisten?, APuZ, 1. April 2009 http://www.bpb.de/apuz/32058/auf-dem-weg-zum-weltpolizisten?p=all Barry Posen: “Trump Aside, What’s the U.S. Role in NATO?”, New York Times, 10 March 2019, https://www.nytimes.com/2019/03/10/opinion/trump-aside-whats-the-us-role-in-nato.html Trump Discussed Pulling U.S. From NATO, Aides Say Amid New Concerns Over Russia, New York Times, https://www.nytimes.com/2019/01/14/us/politics/nato-president-trump.html#click=https://t.co/dJRpexzDgB Ulrike Franke: “Now What? Lessons for Europe from the NATO Summit”, Texas National Security Review, https://tnsr.org/roundtable/policy-roundtable-trump-and-the-future-of-nato/#essay2 2018 Midterm Voters: Issues and Political Values, Pew, 4 October 2018 http://www.people-press.org/2018/10/04/2018-midterm-voters-issues-and-political-values/ Ursula von der Leyen: “The World Still Needs NATO”, New York Times, 18 Jan 2019, https://www.nytimes.com/2019/01/18/opinion/nato-european-union-america.html Matthew Karnitschnig: “For NATO, China is the New Russia”, Politico, 4. April 2019 https://www.politico.eu/article/for-nato-china-is-the-new-russia/ Thema 2 – Jugendoffiziere und Bundeswehr-Rekrutierungsbemühungen “Kritik an geplantem Bundeswehrverbot an Schulen”, Die ZEIT, 1. April 2019, https://www.zeit.de/politik/deutschland/2019-04/berliner-spd-bundeswehr-anwerbung-minderjaehrige-verbot-schulen “Bundeswehr nutzt Stellenabbau bei Ford für Jobwerbung”, Spiegel Online, 4. April 2019 http://www.spiegel.de/karriere/bundeswehr-nutzt-stellenabbau-bei-ford-fuer-jobwerbung-a-1261279.html “Mit großer Macht kommt große Verantwortung”, Bendler-Blog, 5. April 2019 http://bendler-blog.de/2019/04/05/mit-grosser-macht-kommt-grosse-verantwortung/ Bundeswehr Youtube Serien: https://www.youtube.com/channel/UCZPAni75bkLnjGO8yhuJpdw Sicherheitshinweise Carlo: Allgemeine Dienstpflicht Kramp-Karrenbauer: „Wir werden in der CDU das Thema einer allgemeinen Dienstpflicht diskutieren“, Stern, 3 April, https://www.stern.de/politik/deutschland/kramp-karrenbauer-im-stern—wir-werden-in-der-cdu-das-thema-einer-allgemeinen-dienstpflicht-diskutieren–8648602.html Frank: Trump und die US-Nuklearmonarchie Bruce Blair and Jon Wolfsthal: Trump can launch nuclear weapons whenever he wants, with or without Mattis, December 23, 2018 https:/