full_description = "Spezial: Berlin Foreign Policy Forum – Außen-Blick auf Deutschland und das Buzzword Europa-Armee 29. November 201817. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: Eigentlich wäre jetzt Folge 7 dran, aber wir schieben ein Spezial ein: Am Rande des Berlin Foreign Policy Forums der Körber-Stiftung haben wir am 27. November 2018 zwei Gäste in die Aufzeichnung geholt. Die Sicherheitshalber-Crew Ulrike Franke vom European Council on Foreign Relations (ECFR), Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold sprachen mit Eric Gujer, dem Chefredakteur der Neuen Zürcher Zeitung (NZZ), und Jana Puglierin, Leiterin des Europaprogramms bei der Deutschen Gesellschaft für Auswärtige Politik (DGAP) über die Außenansicht des aktuellen Wandels der deutschen Sicherheits- und Verteidigungspolitik sowie über die Debatte rund um das Buzzword Europäische Armee. Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Außenperspektive auf die deutsche Sicherheitspolitik Körber-Stiftung, Videos des „Berlin Foreign Policy Forum“ 2018, www.koerber-stiftung.de/mediathek/ber…rum-2018-1676 Körber-Stiftung, Berlin Pulse 2018/2019, www.koerber-stiftung.de/the-berlin-pulse Susi Dennison, Ulrike Franke, Paweł Zerka (2018) The Nightmare of the Dark. The security fears that keep Europeans awake at night. ECFR www.ecfr.eu/specials/scorecard/…utm_campaign=buffer Jana Puglierin, Rolle rückwärts. Deutschland droht ein sicherheitspolitischer Ansehens- und Vertrauensverlust, IP, 31.8.2018 zeitschrift-ip.dgap.org/de/ip-die-zei…e-rueckwaerts Eric Gujer, Wo Trump recht hat,NZZ, 13.7.2018, www.nzz.ch/meinung/wo-trump-recht-hat-ld.1403225 Eric Gujer, Die militärische Logik ist zurück in Europa, NZZ, 12.1.2018, www.nzz.ch/meinung/kommentare/…n-europa-ld.1346778 Thema 2 – Europäische Armee, nein danke? (ab Minute 33:30) Interview mit Emmanuel Macron, Europe 1 (französisch) www.europe1.fr/politique/en-dire…-1-a-7h40-3794357 Rede von Bundeskanzlerin Merkel vor dem Europäischen Parlament am 13. November 2018 in Straßburg www.bundeskanzlerin.de/bkin-de/aktue…sburg-1549538 Ursula von der Leyen, Schritte zu einer Armee der Europäer, FAZ, 16.11.2018 edition.faz.net/faz-edition/polit…a4f7706c/?GEPC=s9 Augengeradeaus, Deutsch-Französische Brigade: Getrennt marschieren, getrennt schlagen, getrennter Einsatz im gleichen Land, 29.1.2018 augengeradeaus.net/2018/01/deutsch…-gleichen-land/ Financial Times, EU unveils plans for new but limited military projects, 20.11.2018, www.ft.com/content/272daf9a-ec…8-89c8-d36339d835c0 Claudia Major, Christian Mölling, L’armée européenne : un projet prématuré, Le Monde, 26.11.2018 (französisch) www.lemonde.fr/idees/article/201…5388586_3232.html Douglas Barrie, Ben Barry, Henry Boyd, Marie-Louise Chagnaud, Nick Childs, Bastian Giegerich, Christian Mölling, Torben Schütz Protecting Europe: meeting the EU’s military level of ambition in the context of Brexit, IISS/DGAP, November 2018 t.co/GSKWMUQvMy Ähnliche Beiträge Spezial: Aspen Cyber Security Forum 18. Mai 2019 in Cyberwar Podcast Folge 8: Macht, Recht, Völkerrecht; Auslandseinsätze und neu: der Sicherheitshinweis 11. Januar 2019 in Podcast Folge 9: Die sicherheitspolitische Debatte in Deutschland, Ausländer in die Bundeswehr? 9. Februar 2019 in Podcast Veröffentlicht in Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
