full_description = "Folge 14: Türkei in der NATO, Untersuchungsausschuss Berater 28. Juni 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 14 sprechen Ulrike Franke, Carlo Masala, Frank Sauer und Thomas Wiegold zuerst über die schwierige Rolle, die die Türkei in der NATO spielt. Ausgangspunkt ist der Streit, der sich jüngst an der türkischen Ankündigung entzündet hat, das russische Boden-Luft-Raketen-System S-400 zu kaufen. Im zweiten Teil wenden wir uns der sogenannten Berateraffäre im Verteidigungsministerium zu und diskutieren die letzte Sitzung des parlamentarischen Untersuchungsausschusses vor der Sommerpause. Am Ende steht wie immer der Sicherheitshinweis, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu „autonomen“ (oder doch „autarken“?) Gefechtsfahrzeugen der Bundeswehr, europäischen Verteidigungsanstrengungen und amerikanischen Reaktionen, Cyberoperationen gegen Stromnetze sowie den Vorstellungen der AfD zur Zukunft der Bundeswehr. Türkei in der NATO: 00:01:25 BMVg Berateraffäre: 00:36:35 Sicherheitshinweis: 01:05:40 Unser Shop ist online: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Die Türkei in der NATO Mehmet Yegin: Turkey between NATO and Russia: The Failed Balance, SWP Comment 2019/C 30, June 2019, https://www.swp-berlin.org/en/publication/turkey-between-nato-and-russia-the-failed-balance Buddhika Jayamaha and Jahara Matisek: NATO at a Crossroads. Modern War Institute, June 7 2019, https://mwi.usma.edu/nato-crossroads-turkey-becoming-problem-alliance/ Judy Dempsey: Is Turkey Damaging NATO?, in Carnegie Europe, January 24 2018, https://carnegieeurope.eu/strategiceurope/75345?lang=en Thema 2 – Zwischenfazit zur „Berateraffäre“ Sven Becker und Matthias Gebauer: Der Berater und seine Freunde, SPIEGEL online, 28. Juni 2