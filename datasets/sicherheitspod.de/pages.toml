full_description = "Folge 36 Unterseekabel: Achillesferse des Internet? | Deutschland im Indo-Pazifik: Wieso, Weshalb, Warum 21. November 202017. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 36 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Marc Helmus, einem Spezialisten für optische Nachrichtentechnik. Er erklärt, was Unterseekabel eigentlich genau sind, warum, wie und wo sie verlegt werden und welche plausiblen Angriffsszenarien es gibt. Es entspannt sich eine Diskussion um die Frage, ob diese kritische Infrastruktur womöglich so bedroht gar nicht ist wie bisweilen befürchtet (Entwarnung im Sicherheitspod!? Hat es sowas überhaupt schon mal gegeben?) Im zweiten Teil wenden sich die vier Podcaster dem “Indo-Pazifik” zu. Was ist das überhaupt? Und warum will sich Deutschland dort vermehrt engagieren? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Aufruhr in Großbritannien aufgrund von “Lawfare”, australischen Kriegsverbrechen in Afghanistan, dem neuen Atomwaffenverbotsvertrag und einem Verweis auf kommende Entscheidungen in Sache deutsche Verteidigungsausgaben. Unterseekabel: 00:02:14 Indo-Pazifik : 00:43.26 Sicherheitshinweis : 01:08:16 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: (Langfassung auf: www.sicherheitspod.de) Thema 1 – Unterseekabel Die von Marc erwähnte Seekabelkarte https://kis-orca.eu/map/ Adam Satariano: How the Internet Travels Across Oceans, 10.032019,New York Times https://www.nytimes.com/interactive/2019/03/10/technology/internet-cables-oceans.html David E. Sanger and Eric Schmitt, “Russian Ships Near Data Cables Are Too Close for U.S. Comfort, 25.10.2015 New Yo