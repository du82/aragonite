full_description = "Folge 10: Sicherheitspolitik als weiterer Spaltpilz für die Groko? & Bundeswehr in Mali 9. März 201917. Februar 2025 ~ sicherheitspod „Sicherheitshalber“ ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 10 diskutieren Ulrike Franke, Carlo Masala, Frank Sauer und Thomas Wiegold, inwieweit sich sicherheitspolitische Themen – insbesondere die heikle Frage der Rüstungsexporte nach Saudi-Arabien – derzeit als ein weiterer Spaltpilz für die angeschlagene Große Koalition in Berlin entpuppen. Als zweites Thema nehmen wir die Einsätze der Bundeswehr in Mali (es sind in der Tat mehrere!) kritisch unter die Lupe. Am Ende steht wie immer der „Sicherheitshinweis“, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zur Lage in Syrien (Rike), Aktuellem im Bereich Autonomie in Waffensystemen (Frank), dem Indien-Pakistan-Konflikt (Carlo) sowie dem internationalen Frauentag (Thomas). Sicherheitspolitik und die GroKo: 00:03:31 Bundeswehr in Mali: 00:40:40 Sicherheitshinweis: 01:05:39 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Sicherheitspolitik und die Große Koalition Thomas Wiegold: Großbritannien und Deutschland vereinbaren engere militärische Zusammenarbeit – der nächste Stolperstein ist schon in Sicht, Augen geradeaus!, 5. Oktober 2018 https://augengeradeaus.net/2018/10/grossbritannien-und-deutschland-vereinbaren-engere-militaerische-zusammenarbeit-der-naechste-stolperstein-ist-schon-in-sicht/ Jörg Köpke und Andreas Niesmann: Ein Metallbauteil aus Bremen bremst die europäische Rüstungspolitik aus, Hannoversche Allgemeine, 1. März 2019, http://www.haz.de/Nachrichten/Politik/Deutschland-Welt/Ruestungsexporte-Warum-Deutschland-die-europaeischen-Partner-so-sehr-nervt Annegret Kramp Karrenbauer im Interview: „Russland will Deutschland destabilisieren“, Internationale Politik (IP), 13. Februar 2019, https://zeitschrift-ip.dgap.org/de/ip-die-zeitschrift/archiv/jahrgang-2019/maerz-april-2019/russland-will-deutschland-destabilisieren Thomas Wiegold: Deutsch-französische Rüstungsvorhaben: Export-Veto nur in gravierenden Fällen, Augen geradeaus!, 22. Februar 2019 https://augengeradeaus.net/2019/02/deutsch-franzoesische-ruestungvorhaben-export-veto-nur-in-gravierenden-faellen Rolf Mützenich und Arne Lietz: SPD: Rüstungsexportstopp nach Saudi-Arabien verlängern, 25. Februar 2019, https://www.vorwaerts.de/artikel/spd-ruestungsexportstopp-saudi-arabien-verlaengern Matthias Gebauer und Christoph Schult, “Großbritannien wirft Berlin mangelnde Bündnistreue vor”, Spiegel, 19. Februar 2019, http://www.spiegel.de/politik/deutschland/ruestungsexporte-nach-saudi-arabien-brandbrief-aus-grossbritannien-an-deutschland-a-1253997.html Thomas Wiegold: Deutscher Exportstopp für die Saudis: Großbritannien warnt Deutschland vor Folgen, Augen geradeaus!, 19. Februar 2019 https://augengeradeaus.net/2019/02/deutscher-exportstopp-fuer-die-saudis-grossbritannien-warnt-deutschland-vor-folgen/ Carlo Masala: Der 2% Fetisch, Cicero, 4. Januar 2019, https://www.cicero.de/innenpolitik/nato-zwei-prozent-ziel-militaer-ruestungsausgaben-usa-deutschland-bundeswehr-verteidigungsetat/plus Andrea Shalal: Berlin arms policy risks ‚German-free‘ European defence projects, Reuters 4. März 2019, https://uk.reuters.com/article/uk-germany-arms-analysis/berlin-arms-policy-risks-german-free-european-defence-projects-idUKKCN1QL1HD Thema 2 – Bundeswehreinsätze in Mali Bundeswehr: Die Ausbildungsmission in Mali (EUTM Mali), https://bit.ly/2NReJMq Bundeswehr: Die Stabilisierungsmission in Mali (MINUSMA), https://bit.ly/2VKpFOn Thomas Wiegold: UN-Sicherheitsrat beschließt Blauhelmmission für Mali, Augen geradeaus, 25. april 2013 https://augengeradeaus.net/2013/04/un-sicherheitsrat-beschliest-blauhelmmission-fur-mali/ Thomas Wiegold: Mali: Luftbetankung unterm Blauhelm, Augen geradeaus!, 13. Juni 2013 https://augengeradeaus.net/2013/06/mali-luftbetankung-unterm-blauhelm/ Thomas Wiegold: Französischer Einsatz in Mali endet, Einsatz im Sahel beginnt, Augen geradeaus!, 13. Juli 2014, https://augengeradeaus.net/2014/07/franzoesischer-einsatz-in-mali-endet-einsatz-im-sahel-beginnt/ Thomas Wiegold: Bundeswehr prüft Einsatz im Norden Malis, Augen geradeaus!, 6. August 2015, https://augengeradeaus.net/2015/08/bundeswehr-prueft-einsatz-im-norden-malis/ Thomas Wiegold:Amsterdam oder Paris? Egal, Hauptsache Afrika!, Augen geradeaus!, 25. November 2015, https://augengeradeaus.net/2015/11/amsterdam-oder-paris-egal-hauptsache-afrika/ Thomas Wiegold: Bundestag billigt Blauhelm-Einsatz zur Aufklärung im Norden Malis, Augen geradeaus!, 28. Januar 2016, https://augengeradeaus.net/2016/01/bundestag-billigt-blauhelm-einsatz-zur-aufklaerung-im-norden-malis/ Thorsten Jungholt: So redet die Ministerin den Mali-Einsatz schön, Welt.de, 21. April 2017, https://www.welt.de/politik/deutschland/article163872858/So-redet-die-Ministerin-den-Mali-Einsatz-schoen.html Thomas Wiegold: Deutsch-Französische Brigade: Getrennt marschieren, getrennt schlagen, getrennter Einsatz im gleichen Land, Augen geradeaus!, 29. Januar 2018 https://augengeradeaus.net/2018/01/deutsch-franzoesische-brigade-getrennt-marschieren-getrennt-schlagen-getrennter-einsatz-im-gleichen-land/ Thomas Wiegold: Dokumentation – Merkel bei der Bundeswehrtagung: „Plötzlich sind wir in Afrika“, Augen geradeaus!, 14. Mai 2018, https://augengeradeaus.net/2018/05/dokumentation-merkel-bei-der-bundeswehrtagung-ploetzlich-sind-wir-in-afrika/ Thomas Wiegold: Angriff auf EU-Ausbilder in Mali: Fahrzeugbomben und Gewehre, Augen geradeaus!, 25. Februar 2019 https://augengeradeaus.net/2019/02/angriff-auf-eu-ausbilder-in-mali-fahrzeugbomben-und-gewehre/ YouGov Umfrage: Jeder zweite Deutsche ist für einen Bundeswehreinsatz in Mali, 18. Januar 2013, https://yougov.de/news/2013/01/18/jeder-zweite-deutsche-ist-fur-einen-bundeswehreins/ Sicherheitshinweise Rike: Henry Foy, Chloe Cornish, Asser Khattab, Laura Pitel, “Idlib: Russia and Turkey dig in for a final Syria battle”, Financial Times, 6 Maerz 2019, https://www.ft.com/content/60d234fa-3e6a-11e9-9bee-efab61506f44 Carlo: Brahma Chellaney: How the terrorist threat from Pakistan can be quelled, The Globe and Mail, March 1 2019, https://www.theglobeandmail.com/opinion/article-how-the-terrorist-threat-from-pakistan-can-be-quelled/ Frank: Hayley Evans und Natalie Salmanowitz: Lethal Autonomous Weapons Systems: Recent Developments, Lawfare, March 7 2019, https://www.lawfareblog.com/lethal-autonomous-weapons-systems-recent-developments Thomas: Thomas Wiegold: Wie sieht’s aus mit Frauen in den Streitkräften? Fragen an einen norwegischen Zweisterner, Augen geradeaus!, 7. März 2019, https://augengeradeaus.net/2019/03/wie-siehts-aus-mit-frauen-in-den-streitkraeften-fragen-an-einen-norwegischen-zweisterner/ Ähnliche Beiträge Folge 49: Mali, wir müssen reden | US-Nuklearwaffen und “sole purpose”: Politikwechsel mit Auswirkungen? 13. Oktober 2021 in Allgemein Folge 28: Die (alte/neue) Debatte um bewaffnete Drohnen für die Bundeswehr 13. Mai 2020 in DroneWatch Podcast Folge 9: Die sicherheitspolitische Debatte in Deutschland, Ausländer in die Bundeswehr? 9. Februar 2019 in Podcast Veröffentlicht in Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
