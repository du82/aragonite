title = "Folge #65 Was, bitte, ist das “European Sky Shield”? | Shopping mit dem Sonder(un)vermögen – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #65 Was, bitte, ist das “European Sky Shield”? | Shopping mit dem Sonder(un)vermögen 3. Dezember 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 65 dreht sich im Grunde alles ums Geld. Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala sprechen nämlich zuerst über das European Sky Shield – eine neue Initiative im Bereich der europäischen Luftverteidigung, die maßgeblich auf Deutschland zurückgeht. Klingt gut, ist es im Grunde auch. Trotzdem bleiben einige Fragen und Fallstricke. 100%ige Sicherheit, das steht fest, kann man nicht kaufen, egal wie viel Geld man ausgibt. Im zweiten Teil wenden die vier Podcastenden sich dem Sondervermögen für die Bundeswehr zu. Das ist inzwischen kleiner geworden, wirft beim Shopping also weit weniger Artikel ab als erhofft. Und Geld ausgeben, stellt sich raus, ist ganz grundsätzlich nicht so einfach. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit nuklearer Rüstungskontrolle, nicht-nuklearen russischen Marschflugkörpern, unbemannten Bodenfahrzeugen (Drohnen?) für die Ukraine und, mal wieder, FCAS. Wir versuchen vor dem Jahreswechsel trotz “Jahr-2022-Erschöpfung” noch eine Folge in den Kasten zu kriegen. Falls wir doch aber unterm Weihnachtsbaum einschlafen und das nicht mehr schaffen, dann frohes Fest an alle, so ihr es denn feiert, und vor allem ein gutes und hoffentlich friedliche(re)s Jahr 2023. Sicherheitshalber · #65 Was, bitte, ist das “European Sky Shield”? | Shopping mit dem Sonder(un)vermögen European Sky Shield: 00:03:33 Sondervermögen: 00:44:33 Fazit: 01:17:20 Sicherheitshinweise: 01:18:57 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Sicherheitspod bei Famous F1rst Words – für alle, die uns und den Podcast noch nicht so lange kennen. Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – European Sky Shield 14 NATO Allies and Finland agree to boost European air defence capabilities. NATO. 13.10.2022 Giovanni de Briganti. Germany’s Ulterior Motives for Europe’s Sky Shield. Defense-Aerospace.com. 17.10.2022 Margaryta Khvostova, Dmytro Kryvosheiev, Test drive: How Ukraine could strengthen Europe’s Sky Shield Initiative. ECFR. 26.10.2022 Nachgefragt: Flugabwehr I Wie gut sind wir geschützt?. Bundeswehr. 25.11.2022 NORAD tracks Santa Thema 2 – Sondervermögen Marco Seliger. Sondervermögen der Bundeswehr – Das sind die zehn wichtigsten Projekte Mykhaylo Zabrodskyi, Dr Jack Watling , Oleksandr V Danylyuk and Nick Reynolds. Preliminary Lessons in Conventional Warfighting from Russia’s Invasion of Ukraine: February–July 2022. Royal United Services Institute, 30.11.2022 Sicherheitshinweise Carlo: Russische nuklear bestückbare Cruise Missiles und die Ukraine: https://twitter.com/CarloMasala1/status/1596439930716442624?s=20&t=IGi6yy9XlftSmVEv-ABqcA Rike: FCAS – warum ist das nur so schwer?: https://www.senat.fr/enseance/2022-2023/114/Amdt_II-10.html Thomas: Deutschland finanziert unbemannte Bodensysteme für die Ukraine: https://web.archive.org/web/20221129155911/https://milremrobotics.com/milrem-robotics-to-deliver-14-themis-ugvs-to-ukraine-in-cooperation-with-kmw/ Frank: Russland will nicht über NewSTART reden: https://www.kommersant.ru/doc/5693436 Sicherheitspod auf Mastodon: mastodontech.de/@Sicherheitspod Unsere Twitter- und Mastodon-Handles Rike: @RikeFranke @rikefranke@bagarrosphere.fr Frank: @drfranksauer @drfranksauer@mastodontech.de Carlo: @CarloMasala1 Mastodon will der Carlo nicht… :-/ Thomas: @thomas_wiegold @twiegold@berlin.social Ähnliche Beiträge Folge #64 Sechs falsche Lehren aus dem Ukraine-Krieg | Frische strategische Buchstabensuppe aus den USA 7. November 2022 in Allgemein Folge #83 LI