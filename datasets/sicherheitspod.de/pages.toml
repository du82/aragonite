full_description = "Folge #73 Die neue Nationale Sicherheitsstrategie | Die ukrainische Gegenoffensive: was wir (nicht) wissen 16. Juni 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 73 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die druckfrische Nationale Sicherheitsstrategie Deutschlands. Es ist ein langes Gespräch, aber trotzdem können natürlich nicht ausnahmslos alle Punkte in dem 76 Seiten langen Dokument beleuchtet werden. Der Fokus der vier liegt auf folgenden Aspekten: Entstehungsprozess. Integrierte Sicherheit. Multipolarität. China. Verteidigung und Bundeswehr. Finanzierung. Abschließend dann noch auf ein paar kleineren Auffälligkeiten, gefolgt von der Bewertung. Im zweiten Teil wenden die vier Podcaster sich der ukrainischen Gegenoffensive zu: Was wissen wir, und vor allem: was wissen wir nicht? Über was kann man aktuell sinnvoll und seriös reden, welche Einschätzungen sind möglich und welche nicht? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit gegenderten Dienstgraden, UFOs, amerikanischer Innenpolitik und neuen Luftverteidigungssystemen für die Bundeswehr. Sicherheitsstrategie 00:02:20 Gegenoffensive: 01:24:20 Fazit: 01:36:06 Sicherheitshinweise: 01:38:24 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Sicherheitsstrategie Offizielle Webseite zur Nationalen Sicherheitsstrategie DLF. Interview mit Jana Puglierin vom European Council on Foreign Relations. 14.06.2023 Thomas Wiegold. Erste Nationale Sicherheitsstrategie: „Integrierte Sicherheit“, aber (vorerst) nicht mehr Geld. AugenGeradeaus.14.06.2032 Thomas Wiegold. Nationale Sicherheitsstrategie: Schon mal was zum Lesen (Update: und zum Hören). AugenGeradeaus. 14.06.2032 Matthias Wyssuwa. Sicher ist nichts sicher. FAZ, 14.06.2023 Marco Seliger. Die deutsche Regierung wollte eine Nationale Sicherheitsstrategie vorlegen. Das hat sie während der Arbeit daran offenkundig vergessen. NZZ, 14.06.2023 Christian Geyer, Baerbocks Sicherheitsdenken geht unter die Haut , FAZ 14.06.2023 Rikes internationaler Sicherheitsstrategienvergleich Thema 2: Gegenoffensive Jack Watling. Ukraine’s Counteroffensive Begins: Shall the Leopards Break Free? RUSI, 14.06.2023. Helene Cooper, The Ukrainians are now on the offense. But measuring their progress is difficult this early on. New York Times, 14.06.2023 War on the Rocks Podcast. Michael Kofman: Ukraine’s Multiple Axes of Attack. 14.06.2023 Sicherheitshinweise: Carlo: Briten diskutieren gegenderte Dienstränge https://www.forces.net/services/army/masculine-coded-ranks-need-be-thought-through-british-army-chief-says Thomas: Neue Systeme für die Luftverteidigung: Bundestag billigt Arrow und Iris-T SLM für die Bundeswehr https://web.archive.org/web/20230615143243/https://www.bmvg.de/de/aktuelles/iris-t-arrow-wechselladersysteme-fuer-bundeswehr-5636272 Frank: I want to believe (kinda, but not really) https://www.heise.de/news/Whistleblower-USA-hat-angeblich-intakte-Raumschiffe-nicht-menschlicher-Herkunft-9182004.html Rike: Innenpolitik haelt Biden von Aussenpolitik ab https://www.theguardian.com/australia-news/2023/may/17/cancelled-quad-summit-meeting-china-us-pacific-standing Unsere Twitter- und Mastodon-Handles: Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Carlo Tweet: @CarloMasala1 Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Ähnliche Beiträge Folge #74 Auch wenn es weh tut: Wir müssen unseren nuklearen IQ erhöhen | Bunker: Äh, brauchen wir die? 25. Juli 202