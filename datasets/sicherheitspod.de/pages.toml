full_description = "Folge #92 Analyse der Wahlprogramme zur Bundestagswahl 2025: Wer will was bei Sicherheit und Verteidigung? 7. Februar 202517. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 92 analysieren Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Blick auf Sicherheit und Verteidigung die Wahlprogramme aller Parteien, die eine Chance auf den Einzug in den Bundestag haben. Es geht also um: CDU/CSU, SPD, Grüne, AfD, FDP, BSW, Linke. Im ersten Teil geht es um das systematische Zusammentragen der Inhalte. Danach wird bewertet und diskutiert. Diese Episode ist etwas für Feinschmeckerinnen! Für die Jogger gilt: Nehmt euch dafür eine längere Runde vor. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit den Vorgängen in Westpoint nach Trumps Amtsantritt, einem möglichen Ausstieg Österreichs aus dem European Sky Shield, ein Vorschlag zu Pferden für die Heeresaufklärer und drei Modellen zur Absicherung eines Waffenstillstands in der Ukraine (der in Wahrheit noch in weiter Ferne liegt). Sicherheitshalber · #92 Analyse der Wahlprogramme zur Bundestagswahl 2025: Wer will was bei Sicherheit und Verteidigung? Wahlprogramme – Inhalte: CDU/CSU: 00:02:09 SPD: 00:12:55 Grüne: 00:25:00 AfD: 00:34:18 FDP: 00:52:45 BSW: 01:00:23 Linke: 01:06:25 Wahlprogramme – Bewertung und Diskussion: 01:11:36 Sicherheitshinweise: 01:39:20 Mail: mail@sicherheitspod.de Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Thema 1: Wahlprogramme Jonas J. Driedger und Thorsten Gromes. Die Wahlprogramme zu Russlands Angriffskrieg gegen die Ukraine. PRIF. 29.01.2025 Gesine Weber and Sandrine Neugart. German Security, Defense, and Foreign Policy Options. GMF. 29.01.2025 Zu den Wahlprogrammen: CDU/CSU SPD AfD 