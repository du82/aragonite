full_description = "Folge 7: Tornado-Nachfolge, Klimawandel und Buchempfehlungen 7. Dezember 201817. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 7 redet Thomas Wiegold mit Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die Frage , welches Kampfflugzeug den betagten Tornado der Bundeswehr ersetzen könnte – und welche Bedeutung diese Entscheidung für die nukleare Teilhabe Deutschlands hat. Als zweites Thema schauen wir auf den Klimawandel und diskutieren über die sicherheitspolitischen Auswirkungen (auch über das Ob). Und zum Ende, wir sind schließlich in der Weihnachtszeit, reden wir über Bücher – Empfehlungen als Anregung zum Lesen und natürlich für alle, die noch nach Ideen für Buchgeschenke suchen. Das ist die letzte Folge für dieses Jahr. Sicherheitshalber kommt 2019 zurück. Bis dahin wünscht die ganze Podcast-Crew allen Hörerinnen und Hörern eine friedliche Weihnachtszeit, schöne Feiertage und einen guten Start ins neue Jahr! Die Themen: Tornadonachfolge: 02:05 Klimawandel: 40:03 Buchvorstellungen: 1:00:06 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Tornado-Nachfolge und nukleare Teilhabe Augen geradeaus!: Für den Kalender: Entscheidung über Tornado-Nachfolge bis Jahresende https://augengeradeaus.net/2018/11/fuer-den-kalender-entscheidung-ueber-tornado-nachfolge-bis-jahresende/ Mike Szymanski: Flieger des Kalten Krieges, in: Süddeutsche Zeitung, 22. November 2018 https://www.sueddeutsche.de/politik/luftwaffe-flieger-des-kalten-krieges-1.4222399 Wissenschaftliche Dienste des Bundestages: Völkerrechtliche Verpflichtungen Deutschlands beim Umgang mit Kernwaffen: Deutsche und europäische Ko-Finanzierung ausländischer Nuklearwaffenpotentiale, WD 2 – 3000 – 013/17, 2017 https://www.bundestag.de/blob/513080/c9a903735d5ea334181c2f946d2cf8a2/wd-2-013-17-pdf-data.pdf Claudia Major: Germany’s complicated relationship with nuclear weapons could turn into a big risk for European security. Carnegie, January 25, 2018 http://carnegieeurope.eu/strategiceurope/75351?lang=en Rolf Mützenich: Rückkehr des nuklearen Denkens: Mit der Kündigung des INF-Vertrages droht ein neues nukleares Wettrüsten in Europa IPG Journal, 04.12.2018 https://www.ipg-journal.de/rubriken/aussen-und-sicherheitspolitik/artikel/rueckkehr-des-nuklearen-denkens-3128/ Matthias Gebauer und Gerald Traufetter: Deutsche „Tornados“ sind nicht Nato-tauglich Spiegel Online, 31.03.2018 http://www.spiegel.de/politik/deutschland/bundeswehr-kampfjets-tornado-sind-nicht-nato-tauglich-a-1200662.html F-35 Kostenumrechner: https://jscalc.io/calc/TuYzNETZTIQkKXlM Christian Mölling, Torben Schütz: Doppelentscheidung mit Zielkonflikten: Warum die Wahl der Tornado-Nachfolge mehr als ein neues Kampfflugzeug bestimmt, DGAPkompakt Nr. 32, 6. Dezember 2018 https://dgap.org/de/think-tank/publikationen/dgapkompakt/doppelentscheidung-mit-zielkonflikten Thema 2 – Klimawandel und Sicherheit Caitlin Werrell and Francesco Femia Climate change as a national security threat and what to do about it War on the Rocks, December 3, 2018 https://warontherocks.com/2018/12/climate-change-as-a-national-security-threat-and-what-to-do-about-it/ New Zealand Ministry of Defense and New Zealand Defence Forces: The Climate Crisis: Defence Readiness and Responsibilities, November 2018 http://www.nzdf.mil.nz/downloads/pdf/public-docs/2018/newzealanddefenceassessmentonclimatechangeandsecurity2018.pdf U.S. Department of Defense: National security implications of climate-related risks and a changing climate, July 2015 https://archive.defense.gov/pubs/150724-congressional-report-on-national-implications-of-climate-change.pdf?source=govdelivery Delf Rothe et al: The Knowledge Politics of Security in the Anthropocene, DFG-Projekt (2018-2021) am Institut für Friedensforschung und Sicherheitspolitik an der Universität Hamburg http://anthropocene-security.org/ Frank Sauer: Ernährungs- und Wasserkn