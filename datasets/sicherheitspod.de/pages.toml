full_description = "Folge 17: Abzug aus Afghanistan? und: Rüstungsbeschaffung 17. September 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 17 nehmen Ulrike Franke, Frank Sauer , Carlo Masala und Thomas Wiegold das Trumpsche Hin und Her in Sachen US-Truppenabzug aus Afghanistan zum Anlass, einmal über die Lehren zu sprechen, die sich für Deutschland und die Bundeswehr aus diesem inzwischen 18 Jahre andauernden Engagement ziehen lassen. Im zweiten Teil widmen wir uns dem unerquicklichen Thema der Rüstungsbeschaffung: Ist die deutsche Militärbürokratie im internationalen Vergleich ein besonderer Hemmschuh? Am Ende steht wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu dem noch mysteriösen Angriff auf die saudi-arabische Ölproduktion, der neuen EU-Kommission, der Mittelstreckenraketen-Rüstung der USA und Russlands sowie den Auswirkungen der von Präsident Trump geplanten Grenzmauer auf den US-Verteidigungsetat. Thema #1: Abzug aus Afghanistan: 00:01:31 Thema #2: Beschaffung: 00:37:46 Sicherheitshinweise: 00:59:12 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Abzug aus Afghanistan? Afghanistan, in: Human Development Indicators, United Nations Development Programme, Stand: 2018, http://hdr.undp.org/en/countries/profiles/AFG Afghanistan, in: Our World in Data (University of Oxford & Global Change Data Lab), https://ourworldindata.org/country/afghanistan Afghanistan: Liste von Terroranschlägen, in: Wikipedia, https://de.wikipedia.org/wiki/Liste_von_Terroranschl%C3%A4gen_in_Afghanistan Augengeradeaus, Merkposten: Trump stoppt abrupt Verhandlungen über Afghanistan-Abkommen, 08.09.2019, https://augengeradeaus.net/2019/09/merkposten-trump-stoppt-abrupt-verhandlungen-ueber-afghanistan-abkommen/ E