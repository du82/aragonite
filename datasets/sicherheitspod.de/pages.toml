full_description = "Spezial: Aspen Cyber Security Forum 18. Mai 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. Für diese Spezialfolge war Thomas Wiegold mit Ulrike Franke, Carlo Masala und Frank Sauer am 16. und 17. Mai 2019 in Berlin beim Aspen Cyber Security Forum, um dort zwei interessante Gespräche aufzuzeichnen: Mit Alexander Klimburg schlagen wir zunächst eine Schneise durch den Begriffsdschungel, etwa mit Blick auf den Unterschied zwischen Informationssicherheit und Cybersicherheit. Außerdem erklärt Alexander, welche Rolle das Kriegsvölkerrecht im Rahmen der Cybersicherheit spielt, ob es so etwas wie einen Cyberwar schon mal gegeben hat, welche Rolle Propaganda in der ganzen Diskussion spielt und wie sich staatliche und nicht-staatliche Akteure zueinander verhalten. Bei seiner Schilderung der Operation Cupcake bekamen alle Hunger. Gemeinsam mit Isabel Skierka wirft der Podcast dann im zweiten Teil einen Blick auf Deutschland und die deutsche Institutionen- und Gesetzeslandschaft, wo sich derzeit einiges tut. Isabel erklärt dabei unter anderem die zunehmend wichtigere Rolle des Bundesamt für Sicherheit in der Informationstechnik (BSI) und erläutert einige Inhalte des Entwurfs für ein neues IT-Sicherheitsgesetz, etwa mit Blick auf die neuen Meldepflichten für von Cyberangriffen betroffene Unternehmen. Natürlich schneidet sie auch den aktuellen Fall Huawei und das Problem der Lieferkettensicherheit an. Carlo erfindet zwischendurch die Cyber-Schlumpf-Polizei. Alexander Klimburg: 00:01:00 Isabel Skierka: 00:34:14 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Gast #1 Alexander Klimburg https://hcss.nl/expert/alexander-klimburg Alexander Klimburg, 2017: The Darkening Web: The War for Cyberspace, Penguin Press David Sanger, 2018: The Perfect Weapon: War, Sabotage, and Fear in the Cyber Age, Crown Gast #2 Isabel Skierka https://www.gppi.net/team/isabel-skierka Martin Schallbruch & Isabel Skierka 2018: Cybersecurity in Germany, SpringerBriefs in Cybersecurity, 1st ed., Springer. https://faculty-research.esmt.berlin/node/8416 Internet of Things Statistik aus dem Report der Muenchner Sicherheitskonferenz 2018 https://www.securityconference.de/fileadmin/images/MSR/MSC_MunichSecurityReport_2018.pdf (Seite 50) Aussage von Bundesinnenminister Horst Seehofer am 14.05.2019 bei der Vorstellung der Fallzahlen für politisch motivierte Kriminalität vor der Bundespressekonferenz: Das Kanzleramt hat uns jetzt auch noch als Innenministerium für zuständig erklärt bei dem Stichwort hybride Bedrohungen. Auch das ist eine Aufgabe, die wir ab sofort wahrnehmen, wo mit Pressepropagnda und Falschinformation und Angriffe aufs Internet also Mehrfachbedrohungen stattfinden. Und wir werden das jetzt unter der Führung von Herrn Staatssekretär Kerber annehmen, auch für Verteidigungsministerium und so weiter. Also hybride Bedrohung koordiniert im Innenministerium. Fundstelle hier im phoenix-Videomitschnitt ab Minute 59:08: Ähnliche Beiträge Spezial: Berlin Foreign Policy Forum – Außen-Blick auf Deutschland und das Buzzword Europa-Armee 29. November 2018 in Podcast Folge 19: Wer macht deutsche Sicherheitspolitik? und: Afrika 2. November 2019 in Afrika Podcast Syrien Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende 9. April 2022 in Allgemein Veröffentlicht in Cyberwar, Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
