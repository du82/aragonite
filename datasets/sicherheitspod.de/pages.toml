full_description = "Folge #68 Balkan Briefing: Status Quo und Zukunft der Schlüsselregion 6. Februar 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 68 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Jakov Devčić und René Schlee über die Lage auf dem Westbalkan. Es geht nicht nur um den jüngsten Konflikt zwischen Serbien und dem Kosovo (Stichwort: Nummernschilder), sondern auch um den Namensstreit in Sachen Nordmazedonien sowie die Rolle der EU, Russlands und nicht zuletzt Chinas in der Region. Die beiden Gäste helfen den vier Podcastern dabei, die Gegebenheiten in dieser Region besser zu verstehen, die kompliziert und auf Anhieb nicht leicht zu durchdringen ist. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einer japanischen Zeitenwende, sinkendem Vertrauen in die Bundeswehr, dem immer schwierigeren Einsatz in Mali – und, natürlich, dem abgeschossenen Ballon. Popp. Balkan: 00:01:30 Sicherheitshinweise: 01:00:20 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema: Balkan Unsere Gäste: Jakov Devčić, Leiter des Auslandsbüros Serbien / Montenegro der Konrad-Adenauer-Stiftung, Twitter: @devcic_jakov René Schlee, Leiter des Büros Nordmazedonien/Kosovo der Friedrich-Ebert-Stiftung, @i_AM_Schlee WDR 5 Europamagazin 28.01.2023. Kosovo-Konflikt: Serbiens neue Kompromissbereitschaft Kosovos Regierungschef verlangt mehr Nato-Soldaten in seinem Land, Spiegel, 1. Januar 2023 Serbien versetzt Armee in Alarmbereitschaft, Spiegel, 27.12.2022 Blame, Hate and License Plates in a Divided Kosovo Town, New York Times,