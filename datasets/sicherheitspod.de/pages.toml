full_description = "Folge 13: Iran-Kriegsgefahr und Europäischer Verteidigungsfonds 8. Juni 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 13 diskutieren Ulrike Franke, Carlo Masala, Frank Sauer und Thomas Wiegold über die aktuelle Krise rund um den Iran und das vom Scheitern bedrohte Nuklearabkommen. Droht ein Krieg zwischen den USA und dem Iran? Als zweites Thema beleuchten wir Sinn und Zweck des neuen Europäischen Verteidigungsfonds und hinterfragen, ob er wirklich so sehr zum transatlantischen Spaltpilz taugt wie die Trump-Administration behauptet. Am Ende steht wie immer der „Sicherheitshinweis“, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu Neutralität in Europa (Hallo, Österreich!), chinesischen Fischerbooten und Blendlaser-Verbot, dem aktuell erschienenen Friedensgutachten sowie der Verlegeübung für die Very High Readiness Joint Task Force (VJTF). Iran: 00:02:33 Europäischer Verteidigungsfonds: 00:38:44 Sicherheitshinweis: 01:00:50 Unser Shop ist online: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Kriegsgefahr zwischen den USA und dem Iran? John R. Bolton_ To Stop Iran’s Bomb, Bomb Iran, New York Times, March 26, 2015, https://www.nytimes.com/2015/03/26/opinion/to-stop-irans-bomb-bomb-iran.html?smid=nytcore-ios-share Colin Kahl: This is how easily the U.S. and Iran could blunder into war, Washington Post, 23 May 2019, https://www.washingtonpost.com/outlook/this-is-how-easily-the-us-and-iran-could-blunder-into-war/2019/05/23/40dbbcae-7c07-11e9-8ede-f4abf521ef17_story.html?utm_term=.79b50a66fb0a Oliver Meier und Azadeh Zamirirad: Was Europa jetzt noch tun kann, um das Atomabkommen mit Iran zu retten, SWP “Kurz Gesagt”, 9. Mai 2019, https://www.swp-berlin.org/kurz-gesagt/2019/was-europa-jetzt-noch-tun-kann-um-das-atomab