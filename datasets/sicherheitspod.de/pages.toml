full_description = "Folge 16: Militarisierung des Weltraums und Marinemissionen in der Straße von Hormuz 15. August 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 16 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold zunächst über die zunehmende Militarisierung des Weltraums, also die jüngsten Entwicklungen in Sachen Anti-Satelliten-Waffen, Weltraumlaser und Präsident Trumps “Space Force”, aber auch über den Weltraumvertrag von 1967 und die Gefahren für die Raumfahrt durch Weltraumschrott. Im zweiten Teil beschäftigen wir uns mit der verfahrenen Situation in der Straße von Hormuz: Soll Deutschlands Marine dort Geleitschutz für zivile Schiffe leisten? Sind überhaupt die militärischen Kapazitäten und die rechtlichen Rahmenbedingungen dafür gegeben – und in welchem Rahmen (VN, EU, NATO, “Koalition der Willigen”..?) könnte und müsste solch eine Mission stattfinden? Am Ende steht wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zur neuen Reserve der Bundeswehr, dem offenkundig fehlgeschlagenen Test eines nuklear angetriebenen russischen Marschflugkörpers, der Übung der russischen Marine in der Ostsee und Hinweisen auf telefonische Drohungen gegen die Angehörigen niederländischer Piloten, die beim Baltic Air Policing Dienst tun. Thema #1: Militarisierung des Weltraums: 00:04:26 Thema #2: Straße von Hormus: 00:31:52 Sicherheitshinweise: 01:03:51 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ (Vom 17. – 21. August gibt es im Shop 15% Rabatt. Code: SUMMERLOVIN) Erwähnte und weiterführende Interviews, Literatur und Dokumente: Hinweis: Ausschreibung John McCain Dissertation Award, Münchner Sicherheitskonferenz https://www.securityconference.de/fileadmin/MSC_/2019/Ausschreibungen_2020/190807_MSC2020_McCainAward_CallForNominations.pdf Thema 1 – Militarisi