full_description = "Folge #87 Ist Rüstung bei uns extra-teuer (und wenn ja, warum)? NATO-Brigaden: Wunsch vs. Wirklichkeit 19. Oktober 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 87 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über Geld. Und zwar das Geld, das der deutsche Staat für Rüstung ausgibt. Funktioniert das – Stichwort: Zeitenwende – inzwischen alles besser? Bekommen wir also schneller und günstiger das, was in den Streitkräften gebraucht wird? Und: Ist es wirklich so, dass Frankreich und Großbritannien genau so viel ausgeben wie Deutschland, aber viel mehr dafür bekommen (inklusive Flugzeugträger und Nuklearwaffen)? Über all das reden die vier Podcaster mit Prof. Michael Eßig, auch bekannt als “der Beschaffungs-Papst”. Im zweiten Teil stehen die deutschen Zusagen zur NATO im Fokus. Hat die Bundeswehr denn all diese Brigaden, die da versprochen wurden? Und wenn nein, kann sie diese in naher Zukunft aufstellen? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Selenskyjs Siegesplan, nordkoreanischer Unterstützung für Russland, aufwachsenden russischen Streitkräften und Neuigkeiten zu den US-Mittelstreckenwaffen, die 2026 nach Deutschland kommen sollen, Beschaffung: 00:01:51 NATO Force Model: 01:10:20 Fazit: 01:31:10 Sicherheitshinweise: 01:33:24 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Beschaffung bei der Bundeswehr … mit Gast: Univ.-Prof. Dr. rer. pol. Michael Eßig Europäische Ausschreibungen, Datenbank Michael Radunski, Schießbaumwolle: Warum Europa ausgerechnet China für mehr Munition braucht, Table Media, 21. August 2024 Benedetta Girardi, Irina Patrahau, Giovanni Cisco, Michel Rademaker, Strategic raw materials for defence, The Hague Centre for Strategic Studies, January 10, 2023 Trevor Taylor, Defence Committee’s Report on UK Defence Procurement: A Missed Opportunity RUSI, 4 August 2023 Thema 2: NATO Fähigkeitsforderungen – 6 neue Brigaden für die Bundeswehr? Thorsten Jungholt, Nato fordert 49 weitere Kampftruppen-Brigaden WELT, 06.10.2024 Sabine Siebold, Matthias Williams, NATO finds gaping holes in Europe’s defences, Reuters, July 24, 2024 Bundeswehr Nachgefragt, „Wenn Russland die NATO North Atlantic Treaty Organization angreifen würde, werden wir einen anderen Krieg sehen“, 28.06.2024 John R. Deni 2024, The new NATO Force Model: ready for launch?, in: NATO Defense College War Series No. 4. Sicherheitshinweise: Carlo: Selenskyjs „Siegesplan“ Frank: Kämpft Nordkoreas Militär auf Seiten Russlands? Rike: Die Russischen Streitkräfte sollen auf 1.5 Millionen Soldaten anwachsen Thomas: US-Mittelstreckenwaffen für Deutschland – geht’s ein bisschen kleiner? Social Media Gedöns: Sicherheitspod Twitter: @Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Blue Sky: @sicherheitspod.bsky.social Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Skeet: @rikefranke.bsky.social Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Skeet: @drfranksauer.bsky.social Carlo Tweet: @CarloMasala1 Skeet: @carlomasala1.bsky.social Carlo tröötet nicht. Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Skeet: @twiegold.bsky.social Ähnliche Beiträge Folge #88 Axis of upheaval, Ukraine … sind wir schon im Weltordnungskonflikt? | Privatkapital für Rüstung? 5. November 2024 in Allgemein Folge #83 LIVE „Was wäre, wenn…“ – Trump, die NATO und europäische Atomwaffen. Wie wehrhaft sind wir? 21. April 2024 in Allgemein Folge #80 Ist die NATO-Osterweiterung Schuld an Russlands Krieg gegen die Ukraine? 31. Januar 2024 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von