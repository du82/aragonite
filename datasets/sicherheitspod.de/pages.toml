full_description = "Folge 27: Nukleare Teilhabe 7. Mai 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 27 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold aus aktuellem Anlass ausnahmsweise mal nur über ein Thema: die nukleare Teilhabe. Um die ist in der Großen Koalition – und innerhalb der SPD – ein erheblicher Streit entbrannt. Soll Deutschland aus der nuklearen Teilhabe aussteigen? Was genau ist eigentlich diese nukleare Teilhabe? Welche Bedeutung haben die in Deutschland stationierten US-Atomwaffen aus militärischer, welche aus politischer Sicht? Was hat das Dauerthema Tornado-Nachfolge mit der ganzen Sache zu tun? Rikes traditionelles Fazit und die Sicherheitshinweise entfallen diesmal. Aber schon nächste Woche kommt Sicherheitshalber in gewohnter Form mit einer regulären Folge zurück. Vorbemerkungen (#GOA20): 00:00:39 Militärische Aspekte der NT: 00:05:24 Politische Aspekte der NT: 00:36:35 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop Erwähnte und weiterführende Interviews, Literatur und Dokumente: Pia Fuhrhop, Ulrich Kühn und Oliver Meier, Welchen Sinn haben deutsche Atombomber?, Spiegel Online, 30.4.2020 https://www.spiegel.de/politik/deutschland/f-18-welchen-sinn-haben-deutsche-atombomber-a-63ccf36e-afb6-499e-97bc-c33bc9360ec6?sara_ecid=soci_upd_KsBF0AFjflf0DZCxpPYDCQgO1dEMph Rafael Loss, Germany, the Tornado, and the future of NATO, ECFR, 30.4.2020 https://www.ecfr.eu/article/commentary_germany_the_tornado_and_the_future_of_nato „Es wird Zeit, dass Deutschland die Stationierung zukünftig ausschließt“ – Interview mit SPD-Fraktionschef Rolf Mützenich, Tagesspiegel 3.5.2020 https://www.tagesspiegel.de/politik/spd-fordert-abzug-aller-us-atomwaffen-aus-deutschland-es-wird-zeit-dass-deutschland-die-stationierung-zukuenftig-ausschliesst/25794070.html „Unsere Außen- und Sicherheitspolitik darf nie ein deutscher Sonderweg sein“,