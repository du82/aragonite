full_description = "Folge #69 Wehrpflicht, Dienstpflicht, Reserve: Müssen jetzt alle ran? | Zahlen zum globalen Waffenhandel 14. März 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 69 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über die ausgesetzte Wehrpflicht und ob (und wie) sie wieder eingesetzt werden soll, kann, darf. Außerdem darüber, ob eine Dienstpflicht eine Alternative sein kann. Und nicht zuletzt sprechen die vier Podcaster über die Reserve. Wie funktioniert die eigentlich? Im zweiten Teil stehen die aktuellen Zahlen zum globalen Waffenhandel vom schwedischen Friedensforschungsinstitut SIPRI zur Diskussion. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Großmachtpolitik rund um Saudi Arabien, das ausbleibende Cyber-Armageddon in der Ukraine, Bundeswehr-Erdbeben-Hilfe für die Türkei und Rikes letzter Depesche aus London – zu den Falkland Inseln und der neuen Sicherheitsstrategie. Wehrpflicht: 00:04:46 Waffenhandel: 01:04:53 Fazit: 01:15:12 Sicherheitshinweise: 01:17:49 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod ++++++++++++++++++++++++++++++++++++++++++++++++++++++++ Sicherheitshalber Live, Do., 13.4., Akademie der Künste, Hanseatenweg 10, Berlin Sicherheitshalber Live ist zurück in Berlin! Thomas Wiegold, Frank Sauer, Ulrike Franke und Carlo Masala diskutieren live und in Farbe aktuelle Fragen der Sicherheits- und Verteidigungspolitik. Und Phoenix TV ist wie immer mit dabei. Jetzt Ticket sichern: https://adk.eventim-inhouse.de/webshop/webticket/shop?event=17792 An alle Patrons, die schon mindestens 1 Jahr mit mindestens 5 EUR dabei sind: Schreibt 