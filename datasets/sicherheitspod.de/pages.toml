full_description = "Sicherheitshalber aktuell: Was bedeutet die Wahl des künftigen US-Präsidenten Biden für die (deutsche) Sicherheitspolitik? 8. November 202017. Februar 2025 ~ sicherheitspod Die Stimmen in den USA sind gezählt. Auch wenn das amtliche Ergebnis noch nicht vorliegt, Joe Biden ist wohl president-elect der Vereinigten Staaten.Was bedeutet das für die Sicherheitspolitik und Deutschland? Die Crew kommentiert in 4×90 Sekunden: Carlo: Deutschland und Europa muss sich auf eine neue Konstellation in der internationalen Politik einstellen, und Seite beziehen. Auch für die NATO könnte eine neue Situation entstehen. Frank: ist vorsichtig optimistisch, was die (nukleare) Rüstungskontrolle unter president-elect Biden angeht. Rike: erwartet keine grundlegende Veränderung der amerikanischen Drohnenpolitik. Mehr Transparenz, aber nicht unbedingt signifikant weniger Drohnenoperationen – zumindest erstmal. Thomas: Wahrscheinlich am relevantesten für Deutschland: was ist mit dem angekündigten US-Truppenabzug und der Forderung nach der so genannten NATO-Quote, zwei Prozent des Bruttoinlandsprodukts, für Verteidigung? Ähnliche Beiträge Folge 48: Nicht-tödliche Waffen: Eine gute Idee? | Merde! Crikey! Der U-Boot-Streit und was er bedeutet 25. September 2021 in Allgemein Folge 41: Bidens Außenpolitik: Is America Back? | Operation Neuland: Die Bundeswehr in den sozialen Medien 15. März 2021 in Allgemein Folge 28: Die (alte/neue) Debatte um bewaffnete Drohnen für die Bundeswehr 13. Mai 2020 in DroneWatch Podcast Veröffentlicht in Sicherheitshalber aktuell Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
