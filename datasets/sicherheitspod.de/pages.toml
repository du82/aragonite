full_description = "Folge #54 Putins Angriffskrieg gegen die Ukraine: Zeitenwende in der deutschen Sicherheitspolitik 27. Februar 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. Nach krankheitsbedingter Zwangspause finden sich in Folge 54 Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala spontan zusammen, um kurz auf die aktuellen Entwicklungen zu reagieren. Nach einem ganz kurzen Abriss der ersten Tage des Krieges gegen die Ukraine bewerten die vier Podcaster die Bedeutung der heutigen Sondersitzung des Bundestages und der Regierungserklärung. Außerdem reflektieren sie über die Implikationen der “Zeitenwende” für die Zukunft Deutschlands und Europas. Diesmal keine Sicherheitshinweise. Aber dafür die Enthüllung eines weiteren Grundes für die Zwangspause: Rike ist Mama geworden! 🙂 Sicherheitshalber kommt mit einer ausführlichen und strukturierten Folge zurück, wenn alle vier gesund sind – und Rikes kleiner Sohn mal zwei Stunden am Stück schläft. Krieg: 00:03:30 Regierungserklärung: 00:06:40 Implikationen der Zeitenwende: 00:25:53 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Diesmal keine Shownotes. Ähnliche Beiträge Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte 23. Juli 2022 in Allgemein Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende 9. April 2022 in Allgemein Folge #80 Ist die NATO-Osterweiterung Schuld an Russlands Krieg gegen die Ukraine? 31. Januar 2024 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
