["https://sicherheitspod.de/2018/10/09/sicherheitshalber-der-podcast-folge-5"]
title = "Folge 5: Zukunft der liberalen Weltordnung & Zustand der Bundeswehr – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 5: Zukunft der liberalen Weltordnung & Zustand der Bundeswehr 9. Oktober 201817. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt, Folge 4: Wieder mit Ulrike Franke vom European Council on Foreign Relations (ECFR), Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold. Diesmal diskutieren wir in der Ko-Produktion von ECFR und Augen geradeaus! zuerst mit der aus Washington zugeschalteten Constanze Stelzenmüller von der Brookings Institution über die Zukunft der liberalen Weltordnung. Danach verlässt die Sicherheitshalber-Crew die Flughöhe von 30.000 Fuß, um sich in die Niederungen der deutschen Verteidigungslandschaft zu begeben und die Bundeswehr, genauer: die Situation bei Personal und Material sowie die angekündigten Trendwenden, in den Blick zu nehmen. Bei der Technik müssen wir um Entschuldigung bitten: wie in anderen Bereichen auch schon mal hat es bei der transatlantischen Verbindung mit Constanze in Washington bisweilen gehakt – und ein paar Aussetzer konnten wir nicht reparieren. Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Zukunft der liberalen Weltordnung (mit Constanze Stelzenmüller) Constanze Stelzenmüller 2018: Es sind nicht nur weiße Männer, die hinter Trump stehen, in: Süddeutsche Zeitung, 17. Februar 2018, www.sueddeutsche.de/politik/gastbei…tehen-1.3869163 Constanze Stelzenmüller 2018: “America first” means America alone, in: The Security Times, February, 2018, www.the-security-times.com/america-fir…rica-alone/ Constanze Stelzenmüller 2018: John Bolton is wrong to attack International Criminal Court, in: Brookings’ Order From Chaos Blog, September 13, 2018, www.brookings.edu/blog/order-from-…-criminal-court/ Dokumentation der im Gespräch erwähnten Rede von Donald Trump in Warschau im Juli 2017: Dokumentation: Trump in Polen – Bekenntnis zur kollektiven Verteidigung augengeradeaus