title = "Folge #75 Ukraine-Update samt Carlos Reisebericht | Verteidigungshaushalt und Sonderver…druss – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #75 Ukraine-Update samt Carlos Reisebericht | Verteidigungshaushalt und Sonderver…druss 14. September 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 75, der ersten Folge nach der Sommerpause, sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die aktuelle Lage mit Blick auf den russischen Krieg gegen die Ukraine. Es geht um 1) den Stand der ukrainischen Gegenoffensive und deren Perspektiven, 2) die Rolle westlicher Waffenlieferungen und 3) die drängende Frage nach Verhandlungen. Im zweiten Teil sprechen die vier Podcaster über den Verteidigungshaushalt, das Sondervermögen für die Bundeswehr und die berühmten 2% BIP-Anteil im Rahmen der NATO. Spoiler: Deutschland fährt da weiter auf Sicht. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit China, Taiwan und der Chipfrage, einer irren Himars-Bestellung aus Polen, dem schwedischen Verteidigungsbudget und einem Run auf IRIS-T. Ukraine: 00:01:35 Sondervermögen: 00:55:38 Fazit: 01:19:31 Sicherheitshinweise: 01:21:00 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Ukraine Jack Watling and Nick Reynolds. Stormbreak: Fighting Through Russian Defences in Ukraine’s 2023 Offensive, RUSI, 04.09.2023 Michael Kofman and Rob Lee. Perseverance and Adaption: Ukraine’s Counteroffensive at three months, War on the Rocks, 04.09.2023 Igor Kossov. New brigade bears heavy brunt of Russia’s onslaught in Kharkiv Oblast, Kyiv Independent, Ulrike Franke and Jenny Soederstroem. Star tech enterprise: Emerging technologies in Russia’s war on Ukraine, ECFR, 05.09.2023 Thema 2: Sondervermögen Bundesrechnungshof warnt Ampel vor Rechtsbruch, Spiegel, 05.09.2023 Fraktionen bewerten Verteidigungsetat unterschiedlich, Bundestag, 06.09.2023 Helge Braun (CDU) im Interview: „Über zwei Prozent“, Das Parlament, 08.09.2023 Sicherheitshinweise: Frank: USA, China, Taiwan, die Niederlande und die Chipfrage, https://www.heise.de/news/China-produziert-konkurrenzfaehige-7-Nanometer-Chips-9294225.html Carlo: Polen kauft … bitte wie viele Himars?, https://defence-blog.com/poland-to-receive-486-more-rocket-launchers/ Rike: Schweden erhöht Verteidigungsbudget, https://on.ft.com/3ECFb7D Thomas: Alle wollen IRIS-T, https://www.diehl.com/defence/en/press-and-media/news/estonia-and-latvia-sign-with-germany-for-essi-and-also-with-diehl-defence-for-iris-t-slm/ Social Media Gedöns: Sicherheitspod Twitter: @Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Blue Sky: @sicherheitspod.bsky.social Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Skeet: @rikefranke.bsky.social Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Skeet: @drfranksauer.bsky.social Carlo Tweet: @CarloMasala1 Skeet: @carlomasala1.bsky.social Carlo tröötet nicht. Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Skeet: @twiegold.bsky.social Ähnliche Beiträge Folge #79 Kriegsberichterstattung: Warum? Wo? Wie? | Russischer Krieg in der Ukraine: Lage und Ausblick(e) 17. Dezember 2023 in Allgemein Folge #76 Wie wir auf die Sahelzone blicken (sollten) | Musk, Starlink, Ukraine: Was ist los im Weltraum? 5. Oktober 2023 in Allgemein Folge #88 Axis of upheaval, Ukraine … sind wir schon im Weltordnungskonflikt? | Privatkapital für Rüstung? 5. November 2024 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
