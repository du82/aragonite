full_description = "Folge #76 Wie wir auf die Sahelzone blicken (sollten) | Musk, Starlink, Ukraine: Was ist los im Weltraum? 5. Oktober 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 76 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst mit Issio Ehrich, der gerade von einer Recherchereise aus dem Niger zurückgekommen ist. Die Putsche in Mali und Niger und der geplante Abzug der Bundeswehr bilden den Ausgangspunkt des Gesprächs. Aber es geht auch um die Rolle anderer externer Akteure in der Region – insbesondere natürlich die ehemalige Kolonialmacht Frankreich, aber auch Russland, die Türkei oder China -, sowie den Einfluss des Jihadismus, Armut, enttäuschte Hoffnungen auf Demokratie, die Auswirkungen der Klimakrise und weitere Aspekte. Im zweiten Teil nehmen die vier Podcaster das Brimborium rund um Elons Musks Einflussnahme auf den Krieg in der Ukraine hinsichtlich der Rolle von Starlink zum Anlass, mal über einige aktuelle Entwicklungen mit Blick auf den Weltraum zu sprechen. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Russlands Projekt für einen atomar angetriebenen Marschflugkörper, dem gewaltsamen Ende von Berg-Karabach, der angespannten Lage zwischen dem Kosovo und Serbien und einer angezapften Militär-Pipeline. Sahel: 00:02:03 Weltraum: 01:00:31 Fazit: 01:29:28 Sicherheitshinweise: 01:30:56 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Sahel Unser Gesprächspartner: Issio Ehrich, Journalist. Twitter/X: @IssioEhrich La France et le Sahel, de la Françafrique aux coups d’État, Collimateur Podcast, 29.8.2023 Laura Kayali and Clea Caulcutt, France’s Niger debacle mar