full_description = "Folge #89 LIVE Amerika first, Europa unter Druck: Sicherheitspolitik mit und ohne Trump 24. November 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 89 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala live auf der Buchmesse in Wien über Trump und die europäische Sicherheit. Was bedeutet die Trump-Wiederwahl für die Ukraine? Was sind die Implikationen für die NATO, und was kommt auf die EU zu? Vor welchen Herausforderungen wird die neue deutsche Regierung stehen? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einer neuen europäischen Luftverteidigungsinitiative, einem Haftbefehl für den israelischen Ministerpräsidenten Netanjahu, chinesischen Drohnen in der Ukraine und neuen russischen nuklearen Drohgebärden. Trump reloaded: 00:02:43 Sicherheitshinweise: 00:56:30 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema: Trump reloaded Economist, What Trump’s picks suggest about how his presidency will go, 13.11.2024 SWP Podcast, US-Präsidentschaftswahl 2024: Worauf müssen sich Europa und die Welt nach Trumps Sieg einstellen?, 14.11.2024 Camille Grand, Defending Europe with less America , ECFR, 03.07.2024 Steve Beynon, Drew F. Lawrence, Konstantin Toropin, Thousands of Women Serve in Combat Roles. Pentagon Nominee Hegseth Says They Shouldn’t, Military.com, 18.11.2024 Gustav Gressel, Der Untergang: As Trump returns, Putin will reap the rewards of Europe’s inaction on Ukraine, ECFR, 15.11.2024 Economist, China is the big winner from Biden’s foreign policy, say Michael Waltz and Matthew Kroenig, 02.11.2024 Sicherheitshinweise: Thomas: JAMIE – Joint Air Missile Defence Initiativ