full_description = "Folge 24: Covid-19-Pandemie und Gesundheitssicherheit; Huawei und 5G 21. März 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 24, unserer bislang längsten, sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold über den Zusammenhang von Gesundheitspolitik und Sicherheitspolitik – dazu haben wir einen kompetenten Gast. Unser zweites Thema ist der Mobilfunkstandard 5G und die Sicherheitspolitik. Mit der Politikwissenschaftlerin Daniela Braun erörtern wir nicht nur die aktuelle Covid-19-Pandemie aus verschiedenen Blickwinkeln, sondern lernen darüber hinaus viel über die weltweiten Bestrebungen im Kampf gegen Gesundheitsrisiken, etwa durch die Weltgesundheitsorganisation (WHO). Und auch die Frage, ob es in Deutschland oder anderen Staaten eine Militarisierung im Kampf gegen das Virus gibt, spielt eine Rolle. Beim zweiten Thema steht der Streit um den chinesischen Technologiekonzern Huawei und den neuen Mobilfunkstandard 5G im Mittelpunkt. Was sind die sicherheitspolitischen und geopolitischen Implikationen beim Aufbau dieser neuen kritischen Infrastruktur? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zur britischen Verteidigungsplanung, mit Tipps für sowohl einen Roman als auch frei verfügbare Fachliteratur und zu den deutschen Verteidigungsausgaben. Covid-19-Pandemie und Gesundheitssicherheit: 00:02:03 Huawei und 5G: 01:13:08 Sicherheitshinweise: 01:45:04 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Neue Produkte und Preise! Bald wieder verfügbar: Unser Kuschelteddy gegen Einsamkeit! Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Covid-19-Pandemie und Gesundheitssicherheit mit Expertin Daniela Braun Daniela Braun, Konrad Adenauer Stiftung Twitter: @braun_daniela Web: https://www.kas.de/de/mitarbeiter/detail/-/content/daniela-braun +++ Frage #1: Was ist exponentielles Wachstum und wie hilft physische Distanz zu anderen Menschen, “die Kurve” abzuflachen (#FlattenTheCurve)? Eine Visualisierung der Washington Post: https://wapo.st/2U9Ymhk Frage #2: Was sind die Lehren aus Italien und warum erscheinen heute “exzessiv” anmutende Maßnahmen (wie Ausgangssperren) morgen, in der Rückschau, richtig (weil sie das Gesundheitssystem entlasten und somit Leben retten) – Bericht im Boston Globe: https://www.bostonglobe.com/2020/03/13/opinion/coronavirus-cautionary-tale-italy-dont-do-what-we-did/ +++ Daniela Braun, “Pandemien, wie gut ist die EU vorbereitet?” KAS Auslandsinformationen, 4.7.2019, https://www.kas.de/de/web/auslandsinformationen/artikel/detail/-/content/pandemien-wie-gut-ist-die-eu-vorbereitet-1 Daniela Braun “Unsichtbare Gegner. Warum Viren und Bakterien ein Thema für die Sicherheitspolitik sind” KAS Auslandsinformationen 4 Juli 2018, https://www.kas.de/de/web/auslandsinformationen/artikel/detail/-/content/unsichtbare-gegner Daniela Braun “Von Zika und Ebola, Was wir aus Gesundheitskrisen lernen sollten”, KAS Analysen und Argumente, 01.2017 https://www.kas.de/de/analysen-und-argumente/detail/-/content/von-zika-und-ebola-was-wir-aus-gesundheitskrisen-lernen-sollten Adam Rogers, Singapore Was Ready for Covid-19 – Other Countries, Take Note, Wired.com, 12.03.2020, https://www.wired.com/story/singapore-was-ready-for-covid-19-other-countries-take-note/ Nina Weber, Jeder Tag zählt, SPIEGEL, 11.03.2020, https://www.spiegel.de/wissenschaft/medizin/coronavirus-kampf-gegen-ausbreitung-von-covid-19-jeder-tag-zaehlt-a-9c56b511-a31a-4bc8-bf0f-5a6e58b33bbc Peter-Philipp Schmitt, „Viele verlieren ihren Geruchssinn“ – Interview mit dem Virologen Hendrik Streeck, FAZ, 17.03.2020, https://zeitung.faz.net/faz/deutschland-und-die-welt/2020-03-17/b6e6f7f8bc06d4891f67739a4afb61ae/?GEPC=s1 Ivan Krastev“Seven early lessons from the coronavirus”, ECFR 18 03 2020 https://www.ecfr.eu/article/commentary_seven_early_lessons_from_the_coronavirus Foreign Affairs: The Coming Coronavirus Recession And the Uncharted Territory Beyond, 17.3.2020 https://www.foreignaffairs.com/articles/2020-03-17/coming-coronavirus-recession Foreign Affairs: Will the Coronavirus End Globalization as We Know It?, 16.3.2020 https://www.foreignaffairs.com/articles/2020-03-16/will-coronavirus-end-globalization-we-know-it History Will View Coronavirus as China’s Chernobyl, According to U.S. Political Scientist – Newsweek, 13.2.2020 https://www.newsweek.com/china-coronavirus-chernobyl-political-scientist-1487170 The Atlantic, China Is Avoiding Blame by Trolling the World, 19.3.2020 https://www.theatlantic.com/ideas/archive/2020/03/china-trolling-world-and-avoiding-blame/608332/ Unterrichtung durch die Bundesregierung: Bericht zur Risikoanalyse im Bevölkerungsschutz 2012, Bundestagsdrucksache 17/12051, 3.1.2013 https://dipbt.bundestag.de/dip21/btd/17/120/1712051.pdf Thema 2 – Huawei und der Streit um den neuen 5G-Mobilfunk Torsten Benner, Huawei soll draußen bleiben, Zeit online, 29.01.2020 https://www.zeit.de/wirtschaft/2020-01/huawei-netzausbau-5g-sicherheit-risiken-internet Stefan Krempl, Strahlenschutzkommission: 5G ist nicht gefährlich, heise.de, 13.03.2020, https://www.heise.de/newsticker/meldung/UN-Strahlenschutzkommission-5G-ist-nicht-gefaehrlich-4682787.html Ankit Panda and Prashanth Parameswaran, 5G and Risk Mitigation: Asia’s Huawei Conundrum, The Diplomat Podcast, 30.01.2020, https://thediplomat.com/2020/01/5g-and-risk-mitigation-asias-huawei-conundrum/ Julianne Smith, Um welche Werte geht es hier eigentlich? SZ, 13.2.2020, https://www.sueddeutsche.de/politik/5g-china-usa-meinung-1.4796321 Daniel Voelsen, 5G, Huawei und die Sicherheit unserer Kommunikationsnetze, SWP Aktuell 2019/A 05, Februar 2019, https://www.swp-berlin.org/10.18449/2019A05/ Sicherheitshinweise Rike: UK Integrated Security, Defence and Foreign Policy Review, Douglas Barrie, “UK defence review: repent at leisure”, IISS, 31.1.2020, https://www.iiss.org/blogs/military-balance/2020/01/uk-defence-review Frank: Buchtipp: “The Municipalists” bzw. “Der Metropolist”, Roman von Seth Fried & https://foldingathome.org/ – Verteiltes Rechnen für die Proteinforschung Carlo: Fachliteratur leichter verfügbar (für die Arbeit im Home Office) http://www.universitytimes.ie/2020/03/jstor-makes-database-accessible-to-the-public/ Thomas: Verteidigungshaushalt soll steigen Thomas Wiegold, “Verteidigungshaushalt soll stärker steigen als geplant – aber unter Corona-Vorbehalt”, Augen geradeaus!, 16.3.2020 https://augengeradeaus.net/2020/03/verteidigungshaushalt-soll-staerker-steigen-als-geplant-aber-unter-corona-vorbehalt/ Bundesministerium der Verteidigung, “Bundesregierung: weiter steigende Verteidigungsausgaben”, 18.3.2020 https://www.bmvg.de/de/aktuelles/bundesregierung-steigende-verteidigungsausgaben-bundeshaushalt-224840 (Hinweis in eigener Sache: Auf Augen geradeaus! finden Links zu deutschen Verlagswebseiten angesichts des Verlegerverhaltens im Streit um das so genannte Leistungsschutzrecht in der Regel nicht statt. In diesem Fall weiche ich davon ab, weil es um die gemeinsamen Shownotes des Sicherheitshalber-Podcasts geht. Sollten die Verleger ihr Verhalten verschärfen und, wie teilweise gefordert, auch die Angabe von Überschriften vergütungspflichtig machen wollen, fliegen alle diese Verlags-Links hier raus.) Ähnliche Beiträge Folge 25: Globale Machtverschiebungen durch Corona? und: Abzug aus Afghanistan 7. April 2020 in Podcast Folge 26: Russlands sicherheitspolitische Fähigkeiten & Ambitionen 24. April 2020 in Podcast Folge 35: Drohnenkrieg um Bergkarabach: Ist das die Zukunft? | Bundeswehr im Inneren: alles Corona oder was? 24. Oktober 2020 in Allgemein Veröffentlicht in Podcast CoronavirusCovid-19SARS-COV2 Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
