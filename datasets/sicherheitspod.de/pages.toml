full_description = "Folge 8: Macht, Recht, Völkerrecht; Auslandseinsätze und neu: der Sicherheitshinweis 11. Januar 201917. Februar 2025 ~ sicherheitspod **Sicherheitshalber ist für den Podcastpreis nominiert – und die Hörerinnen und Hörer können hier abstimmen (und das täglich, bis zum zum 15. Februar – mit drei Stimmen)** Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 8 nehmen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zunächst Deutschlands nichtständigen Sitz im UN-Sicherheitsrat zum Anlass, mit unserem Gast Carl-Philipp Sassenrath etwas grundlegender über das Verhältnis von Macht und Recht in der internationalen Politik nachzudenken. Thema des zweiten Teils ist die Bilanz der deutschen Auslandseinsätze der vergangenen Jahre. Am Ende dieser ersten Folge im neuen Jahr 2019 erwartet die HörerInnen eine neue Rubrik: Im Sicherheitshinweis greifen wir kurz und knapp die sicherheitspolitischen Themen auf, die interessant, kurios oder erwähnenswert sind, aber noch nicht als eigenständiges Thema in den Podcast passen (und sei es nur aus Zeitgründen). Die Zeitangaben zu den einzelnen Themen: Völkerrecht ab 00:07:55 Auslandseinsätze ab 00:43:50 Sicherheitshinweis ab 01:09:35 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Deutschland im UN-Sicherheitsrat: Macht und Recht in der internationalen Politik Carl-Philipp Sassenrath 2018: Frieden durch Recht?, in: Civis mit Sonde 3/2018, S. 62-68. http://www.civis-mit-sonde.de/portfolio/civis-2018-3/ Hannah Birkenkötter, Deutschland als Retter der „regelbasierten internationalen Ordnung“?, CIVIS mit Sonde 2/2018, S. 64 http://www.civis-mit-sonde.de/portfolio/civis-2018-2/ Christoph Heusgen 2018: Wir sind gefordert, CIVIS mit Sonde 2/2018, S. 58 http://www.civis-mit-sonde.de/portfolio/civis-2018-2/ (zu den deutschen Zielen im UN-Sicherheitsrat) Helmut Aust 2018: Völkerrechtswidrigkeit benennen: Warum die Bundesregierung ihre Verbündeten für den Syrien-Luftangriff kritisieren sollte, Verfassungsblog, 16.04.2018 https://verfassungsblog.de/voelkerrechtswidrigkeit-benennen-warum-die-bundesregierung-ihre-verbuendeten-fuer-den-syrien-luftangriff-kritisieren-sollte/ Helmut Aust und Mehrdad Payandeh 2018: Praxis und Protest im Völkerrecht: Erosionserscheinungen des völkerrechtlichen Gewaltverbots und die Verantwortung der Bundesrepublik im Syrien-Konflikt, JuristenZeitung 2018, S. 633 https://www.ingentaconnect.com/contentone/mohr/jz/2018/00000073/00000013/art00001 (Englische Version: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3267208) Stefan Talmon 2018: Changing Views on the Use of Force: The German Position, Baltic Yearbook of International Law 2005, S. 41 http://users.ox.ac.uk/~sann2029/Baltic%20Yearbook%205%20(2005),%2041-76.pdf Andreas Rinke 2018: UN-Sicherheitsrat als Testfall: Deutschlands Sitz stellt die Handlungsfähigkeit der Koalition auf die Probe, in: Internationale Politik 6, November-Dezember 2018, S. 86-91. https://zeitschrift-ip.dgap.org/de/ip-die-zeitschrift/archiv/jahrgang-2018/november-dezember-2018/un-sicherheitsrat-als-testfall Thema 2 – Bilanz der deutschen Auslandseinsätze Tabellen und eine interaktive Weltkarte zu deutschen Auslandseinsätzen seit 1991: https://www.bpb.de/politik/grundfragen/deutsche-verteidigungspolitik/243585/weltkarte-auslandseinsaetze “Unterrichtung der Öffentlichkeit” (UdÖ), wöchentliche Übersicht zur Lage in den Auslandseinsätzen: “Die aktuelle Lage in den Einsatzgebieten der Bundeswehr” (einsatz.bundeswehr.de) http://www.bundeswehr.de/portal/poc/bwde?uri=ci:bw.bwde.einsaetze.ueberblick.lage Archiv der UdÖ auf Augen geradeaus!: https://augengeradeaus.net/udoe/ Carlo Masala, An den Aufgaben gewachsen, Internationale Politik, 31. August 2018 https://zeitschrift-ip.dgap.org/de/ip-die-zeitschrift/archiv/jahrgang-2018/september-oktober-2018/den-aufgaben-gewachsen Sebastian Enskat und Carlo Masala 2015: Einsatzarmee Bundeswehr. Fortsetzung der deu