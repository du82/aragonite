full_description = "Folge 4: Autonomie in Waffensystemen und die Frage nach einer Syrien-Intervention 18. September 201817. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt, Folge 4: Wieder mit Ulrike Franke vom European Council on Foreign Relations (ECFR), Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold. Diesmal diskutieren wir in der Ko-Produktion von ECFR und Augen geradeaus!: • Killer-Roboter oder unvermeidbare künstliche Intelligenz in Waffensystemen? Was sind autonome Waffen, wo liegen die Chancen und Risiken, und wie steht es um die Bemühungen um eine Rüstungskontrolle? • Ab Minute 34:00: Seit gut einer Woche gibt es die sehr kontroverse Debatte, ob sich Deutschland im Falle eines Giftgaseinsatzes des Assad-Regimes in Syrien an einem Militärschlag dagegen beteiligen? Was ist die richtige rechtliche und moralische Abwägung mit Blick auf “Chemiewaffentabu vs. Interventionsverbot”? (Es gab, nun, ein paar Probleme mit der Tonqualität, die wir trotz aller technischen Bemühungen nicht ganz wegbekommen haben – das bitten wir zu entschuldigen.) Die Shownotes: Thema 1 – Autonomie in Waffensystemen: Interview (Langfassung) mit Frank Sauer von Andreas Flocken für Streitkräfte und Strategien: “Verbot autonomer Waffen ohne Chance?”, Sendung vom 08.09.2018, https://www.ndr.de/info/sendungen/streitkraefte_und_strategien/Verbot-autonomer-Waffen-ohne-Chance,streitkraefte508.html Interview mit Frank Sauer von Hans-Arthur Marsiske für heise online: “Missing Link: Erfolglose Gespräche über Killerroboter”, https://www.heise.de/newsticker/meldung/Missing-Link-Erfolglose-Gespraeche-ueber-Killerroboter-Wir-muessen-mehr-machen-4157480.html?seite=all Ulrike Franke 2018: Laws on LAWS? Germany’s place in the ‘killer robot’ debate, in: ECFR: https://www.ecfr.eu/article/commentary_laws_on_laws_germanys_place_in_the_killer_robot_debate Ulrike Frankes Vortrag vor dem Security and Defence Committee des Europäischen Parlaments: http://www.europarl.europa.eu/ep-live/en/committees/video?event=20180906-0900-COMMITTEE-SEDE Paul Scharre 2018: Army of None: Autonomous Weapons and the Future of War, W. W. Norton & Co., https://www.amazon.com/Army-None-Autonomous-Weapons-Future/dp/0393608980 Thema 2 – Syrien-Intervention: Caroline Fehl 2018: Assad könnte in Idlib wieder Giftgas einsetzen – doch eine militärische Antwort wäre falsch, in: PRIF Blog: https://blog.prif.org/2018/09/13/assad-koennte-in-idlib-wieder-giftgas-einsetzen/ Jana Puglierin, Rolle rückwärts, Internationale Politik zeitschrift-ip.dgap.org/de/ip-die-zei…e-rueckwaerts Jörg Lau, Kriegsverweigerung, Die Zeit www.zeit.de/2018/38/syrien-gift…ge-baschar-al-assad Augen geradeaus!: West-Reaktion auf möglichen Chemiewaffeneinsatz in Syrien: Diesmal mit Bundeswehr? Augen geradeaus!: Bundesregierung lässt deutsche Beteiligung an möglichem US-Luftangriff auf Syrien offen Augen geradeaus!: Deutsche Beteiligung an Angriff auf Syrien: „Völkerrechts- und verfassungswidrig“ Nachtrag: Von HörerInnen wurde zurecht bemängelt, dass der Ton sehr hallig klingt. Eine wesentliche Ursache ist, dass wir ein einem Besprechungsraum zusammensaßen, und dort ist die Akustik nicht wirklich auf solche Aufnahmen ausgelegt… Ähnliche Beiträge Folge 28: Die (alte/neue) Debatte um bewaffnete Drohnen für die Bundeswehr 13. Mai 2020 in DroneWatch Podcast Folge 18: Türkei in Nord-Syrien und KI fürs Militär 14. Oktober 2019 in Podcast Folge 8: Macht, Recht, Völkerrecht; Auslandseinsätze und neu: der Sicherheitshinweis 11. Januar 2019 in Podcast Veröffentlicht in Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
