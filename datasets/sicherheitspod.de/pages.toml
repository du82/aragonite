title = "Folge 32: Gas-Streit (und mehr) im Mittelmeer | Österreich: Schwerter zu Schneepflügen? – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 32: Gas-Streit (und mehr) im Mittelmeer | Österreich: Schwerter zu Schneepflügen? 20. August 202017. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 32 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über die verfahrene Situation im Mittelmeer. Anlass ist natürlich der Gas-Streit zwischen der Türkei und Griechenland – aber die vier Podcaster stellen schnell fest, dass die Zahl der Akteure viel größer und die Lage deutlich komplizierter ist. Kurz: Genau das richtige, um die Stirn in bedeutungsschwere Falten zu legen, während man im Urlaub die Füße ins Mittelmeer taucht. Im zweiten Teil geht es – endlich – um Österreich. Im lang ersehnten Austria-Sondersegment geht es um die Reform des Bundesheeres sowie Österreichs “Neutralität”. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit der amerikanischen Space Force-Doktrin, einem simulierten Luftkampf zwischen Mensch und Maschine, der angekündigten Rehabilitierung homosexueller SoldatInnen der Bundeswehr sowie dem Bundeswehr-Dauerbrenner taktische Luftabwehr… äh… taktische Luftverteidigung. Sicherheitshalber · #32 Gas-Streit (und mehr) im Mittelmeer | Österreich: Schwerter zu Schneepflügen? Mittelmeer: 00:02:10 Österreichisches Bundesheer: 00:39:04 Sicherheitshinweise: 01:02:53 Hausmitteilungen: 01:10:03 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Gas-Streit und die komplizierte Lage im Mittelmeer Thomas Seibert, Gas-Streit im Mittelmeer: Vermittler dringend gesucht, Deutschlandfunk, 23.07.2020, https://www.deutschlandfunk.de/gas-streit-im-mittelmeer-vermittler-dringend-gesucht.724.de.html?dram:article_id=481111 J