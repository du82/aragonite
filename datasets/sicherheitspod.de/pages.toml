title = "Folge #61 Bio- und Chemiewaffen: Vom Killerkaninchen zum Radieschen im Weltall – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #61 Bio- und Chemiewaffen: Vom Killerkaninchen zum Radieschen im Weltall 18. August 202217. Februar 2025 ~ sicherheitspod Mir wurde gesagt, ich soll fetzigere Titel machen… “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 61 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Jan van Aken über Bio- und Chemiewaffen. Es ist ein erster großer Rundumschlag zu zwei Themenfeldern, die, anders als Nuklearwaffen, im Podcast bisher kaum diskutiert wurden: Wann wird etwas zur Biowaffe? Wo liegen die Unterschiede zu Chemiewaffen? Wie steht es um die Rüstungskontrolle und die Abrüstung in diesen Feldern (vom Kalten Krieg bis heute)? Wie wird man denn bitte VN-Biowaffeninspekteur – und was macht man da? Wie groß ist das Risiko, dass solche Waffen aktuell zum Einsatz kommen (in der Ukraine)? Darum, und vieles mehr, geht es in dieser Ein-Themen-Episode. Abschließend dann wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu den Angriffen auf das ukrainische Atomkraftwerk Saporischschja, einer neuen israelischen Drohnenpolitik, der deutschen Luftwaffe in Australien und dem französischen Abzug aus Mali. Bio- und Chemiewaffen: 00:01:30 Sicherheitshinweise: 01:00:52 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema: Bio- und Chemiewaffen Unser Gesprächspartner: Dr. Jan van Aken Programmleiter, Rosa Luxemburg Stiftung, promovierter Biologe, ehem. Biowaffeninspekteur für die Vereinten Nationen, Twitter: @jan_vanaken Webseite der Vereinten Nationen zur Biowaffenkonvention Biowaffenkonvention. Übereinkommen über das Verbot der Entwicklung, Herstellung und Lagerung bakteriologischer (biologischer) Waffen und von Toxinwaffen sowie über die Vernichtung solcher Waffen, deutsche Fassung Chemiewaffenkonvention. Übereinkommen über das Verbot der Entwicklung, Herstellung, Lagerung und des Einsatzes chemischer Waffen und über die Vernichtung solcher Waffen, deutsche Fassung EU Non-Proliferation and Disarmament Consortium. EU Non-Proliferation and Disarmament eLearning Course on Biological Weapons EU Non-Proliferation and Disarmament Consortium. EU Non-Proliferation and Disarmament eLearning Course on Chemical Weapons Global Public Policy Institute (GPPi). 2022. Nowhere to Hide. Podcast on the use of chemical weapons in the Syrian war Global Public Policy Institute (GPPi). 2022. The Specter of Chemical Weapons Use in Syria. Website U.S. State Department. 2021. Adherence to and Compliance With Arms Control, Nonproliferation, and Disarmament Agreements and Commitments. (PART V: OTHER STATES’ COMPLIANCE…) Biowaffen-Vorwürfe Russlands im Ukraine-Krieg – auch gegen Deutschland: gegen das Bernhard-Nocht-Institut für Tropenkrankheiten, Hamburg gegen die Bundeswehr Michael Worobey, Joshua I. Levy, Lorena Malpica Serrano et al. 2022. The Huanan Seafood Wholesale Market in Wuhan was the early epicenter of the COVID-19 pandemic. Science: first release 26.06.2022 Glenn A. Cross. 2022. The long, cloudy history of Moscow’s BW program, The Nonproliferation Review, DOI: 10.1080/10736700.2022.2075642 Sicherheitshinweise: Frank: Russische Angriffe auf ukrainisches Atomkraftwerk Saporischschja https://www.wsj.com/articles/russia-goal-ukraine-nuclear-plant-take-electricity-11660505601 Rike: Israelische Drohnenkommunikationspolitik https://www.timesofisrael.com/israel-says-idfs-armed-drones-can-now-be-talked-about-unless-its-to-sell-them/ Carlo: Pacific Response 2022 Dem Twitter-Account @teamluftwaffe für Informationen folgen Thomas: Französische Truppen haben Mali verlassen https://twitter.com/EtatMajorFR/status/1559163773411332097 Ähnliche Beiträge Folge 48: Nicht-tödliche Waffen: Eine