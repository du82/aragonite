title = "Folge #79 Kriegsberichterstattung: Warum? Wo? Wie? | Russischer Krieg in der Ukraine: Lage und Ausblick(e) – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #79 Kriegsberichterstattung: Warum? Wo? Wie? | Russischer Krieg in der Ukraine: Lage und Ausblick(e) 17. Dezember 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 79 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst mit Fred Pleitgen von CNN über seine Arbeit, die ihn in die Krisen- und Kriegsgebiete der Welt führt. Warum überhaupt noch traditionelle Fernseh-Kriegsberichterstattung in Zeiten des Internet? Wie entscheidet CNN, von wo berichtet wird? Und wie gewährleistet Fred seine eigene Sicherheit? Auch über die aktuelle Situation in der Ukraine und seine Eindrücke von der Front sprechen die vier Podcaster mit Fred. Im zweiten Teil wird diese Analyse vertieft. Vor allem wird in mögliche Zukünfte geblickt: Wie stehen die Chancen für Waffenstillstand, Verhandlungen, Frieden? Was, wenn Putins Russland die Oberhand gewinnt? Welche Szenarien ergeben sich mit Blick auf die zukünftige Sicherheit in Europa? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Unruhen im Roten Meer, noch mehr chinesischen Nuklearwaffen als gedacht, einer “Trump-Sicherung” für die NATO und Irlands Botschaft an den Weihnachtsmann. Das war’s für 2023. Der Sicherheitspod kommt 2024 wieder, sagt für dieses Jahr ein ganz herzliches Danke fürs Zuhören und wünscht allen Hörerinnen und Hörern frohe Feiertage und einen guten Start in ein (hoffentlich) friedlicheres Jahr. Bleibt gesund oder werdet es, wir hören uns bald wieder. Kriegsberichterstattung: 00:01:40 Ukraine Ausblick(e): 00:47:31 Fazit: 01:33:57 Sicherheitshinweise: 01:37:25 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Kriegsberichterstattung Unser Gesprächspartner: Frederik Pleitgen, CNN Senior International Correspondent and Anchor, X/Twitter: @fpleitgenCNN Katharina Zwins, Laut „Bild“-Reporter gab es keinen Greenscreen bei Gaza-Berichterstattung. AFP Factcheck. Thema 2: Ukraine Jens Plötner, Andriy Yermak. Germany stands with Ukraine in its existential struggle. Politico. 15.12.2023 Martin Schulze Wessel, Claudia Major, Norbert Röttgen. Aufruf: Wir müssen mehr tun. Die Zeit. 14.12.2023 Sebastian Gierke. Electronic warfare – Das große Problem der Ukraine. SZ. 14.12.2023 Gerry Doyle, Mariano Zafra. The air war over Ukraine. Reuters. 14.12.2023 SIPRI. Russia’s new budget law signals determination to see the war in Ukraine through, according to new SIPRI analysis. 13.12.2023 Interview. We’ll Be at Each Others’ Throats’: Fiona Hill on What Happens If Putin Wins. Politico. 12.12.2023 Nico Lange, Carlo Masala. Was, wenn Russland gewinnt? Die Zeit. 19.11.2023 Richard Haas, Charles Kupchan. Redefining Success in Ukraine. A New Strategy Must Balance Means and Ends. Foreign Affairs. 17.11.2023 Interview mit General Valery Zaluzhny. Ukraine’s commander-in-chief on the breakthrough he needs to beat Russia. Economist. 01.11.2023 Podcast mit Rike (in französischer Sprache): Le Collimateur, Soutenir l’Ukraine, jusqu’où ? [Le Casque et la Plume #1] mardi 5 décembre 2023 Sicherheitshinweise: Thomas: Unruhe im Roten Meer https://augengeradeaus.net/2023/12/merkposten-rotes-meer/ Frank: Wird Chinas rascher nuklearer Aufwuchs sogar noch systematisch unterschätzt https://www.realcleardefense.com/articles/2023/12/06/the_congressional_strategic_posture_commissions_report_and_the_chinese_nuclear_threat_997085.html Rike: US-Kongress macht Trump den NATO-Austritt schwerer https://thehill.com/homenews/4360407-congress-approves-bill-barring-president-withdrawing-nato/ und https://www.rollingstone.com/politics/politics-features/donald-trump-u-s-leave-nato-1234860016/ Carlo: Audio-Lametta: Weihnachten ist gerettet ht