title = "Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte 23. Juli 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt…. und inzwischen schon vier Jahre alt! Aus diesem besonderen Anlass wurde diese Geburtstagsfolge am 20.07.2022 live via Zoom aufgezeichnet. Deswegen ist diesmal alles ein wenig anders. Im ersten Teil gibt’s erstmal Kritik (und Lob). Denn weil es zur Zeitenwende gehört, alles kritisch zu hinterfragen, haben sich die vier Podcaster eine Politikerin, einen Journalisten und eine Wissenschaftlerin eingeladen, die im ersten Teil Kritik aus Sicht ihrer jeweiligen Felder üben – was macht der Sicherheitspod gut, wo hapert es? Agnieszka Brugger, Andreas Krobok und Elvira Rosert lesen dem Sicherheitspod die Leviten. Im zweiten Teil geht es dann um die vor fünf Monaten von Bundeskanzler Scholz im Bundestag … ja, was eigentlich: ausgerufene? erwähnte? beschriebene? … Zeitenwende. Wo steht Deutschland denn da jetzt? Wird das überhaupt was? Und wenn ja, was? Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala diskutieren – sowohl miteinander als auch mit den ZuhörerInnen im Publikum, die viel mehr Fragen hatten als die vier beantworten konnten. Danke an alle, die live dabei waren – und sowieso an alle, die sich den Sicherheitspod regelmäßig auf die Ohren tun. Sicherheitshalber kommt Mitte August in gewohnter Manier mit sicherheitspolitischen Inhalten aus der Sommerpause 2022 zurück – und zwar gleich zum Auftakt mit einem interessanten Gast und einem sehr brisanten Thema. Sicherheitshalber · Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte Podcast-Kritik: 00:04:14 Zeitenwende: 00:43:31 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Podcast-Kritik aus politischer, journalistischer und wissenschaftlicher Sicht mit… Agnieszka Brugger Stellvertretende Fraktionsvorsitzende von Bündnis 90/Die Grünen im Bundestag Twitter: @agnieszka_mdb Andreas Krobok Leiter Audio/Video bei, F.A.Z. Podcast für Deutschland Twitter: @akrobok Prof. Dr. Elvira Rosert Juniorprofessorin für Politikwissenschaft, insbesondere Internationale Beziehungen an der Universität Hamburg und am Institut für Friedensforschung und Sicherheitspolitik (IFSH) Twitter: @elvira_rosert Thema 2 – Ist die Zeitenwende schon vergeigt? Olaf Scholz: Abgabe einer Regierungserklärung durch den Bundeskanzler zur aktuellen Lage [Bundestagsrede als Video], 27.02.2022 Plenarprotokoll des Deutschen Bundestages, 27.02.2022 Die Aussagen des Bundeskanzlers zur Bundeswehr nach dem (vorab veröffentlichten) Text der Regierungserklärung Olaf Scholz: Gastbeitrag des Kanzlers in der FAZ: Nach der Zeitenwende, 18.06.2022 Lars Klingbeil: Zeitenwende – der Beginn einer neuen Ära, Rede bei der FES Tiergartenkonferenz 2022, 21.06.2022 Uli Hauck und Kai Küstner: Warum der Ringtausch nicht funktioniert, 20.07.2022 Ralf Neukirch, Momentan nur Mitläufer, Spiegel, 30.06.2022 Ähnliche Beiträge Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende 9. April 2022 in Allgemein Sicherheitshalber Spezial ***5. Geburtstag*** Live online: Ernste Themen Streumunition & NATO-Gipfel 22. Juli 2023 in Allgemein Folge #70 Tāningupointo: Zeitenwende auf japanisch 5. April 2023 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
