full_description = "Folge 22 LIVE : USA vs. Iran und Kampfflugzeug der Zukunft 28. Januar 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 22 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold – erstmals live und vor großem Publikum im Humboldt-Saal in der Urania Berlin – über die Tötung Qasem Soleimanis per US-Drohnenschlag und die sich daraus ergebenden Konsequenzen für die Beziehungen zwischen den USA und dem Iran, das Kriegsbild der Zukunft, das Völkerrecht und die iranischen Nuklearambitionen. Als zweites diskutieren wir über das Future Combat Air System (FCAS), eine, um einen Anglizismus zu vermeiden, fliegende Kampfwolke, die Deutschland, Frankreich und Spanien bis 2040 gemeinsam entwickeln wollen – und die am Ende um die 100 Milliarden Euro kosten soll. Am Ende steht wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zur Libyenkonferenz in Berlin, den Gefahren der automatischen Gesichtserkennung, KI-Exportkontrollen und den unklaren Cyberproblemen zahlreicher deutscher Verwaltungen. Diese Folge kommt ein bisschen später als geplant – in einer Vorbemerkung erläutern wir, warum. Sicherheitshalber ist für den deutschen Podcastpreis nominiert! www.deutscher-podcastpreis.de/podcasts/s…itshalber/ Unser Shop: shop.spreadshirt.de/sicherheitshalbershop/ Thema #1: USA vs Iran: 4:36 Thema #2: FCAS: 46:37 Sicherheitshinweise: 1:07:37 Erwähnte und weiterführende Literatur: Thema 1 – USA vs. Iran=3. Weltkrieg? David Barno and Nora Bensahel, The drone beats of war: The US vulnerability to targeted killings, War on the rocks, 21 January 2020, warontherocks.com/2020/01/the-dron…rgeted-killings/ „Das Völkerrecht wird zurechtgebogen“, Jurist Talmon im Interview, tagesschau.de, www.tagesschau.de/ausland/voelkerr…terview-101.html Augengeradeaus, Bundesregierung vermeidet Bewertung von tödlichem US-Angriff auf iranischen General, 3.1.2020 augengeradeaus.net/2020/01/bundesr…ischen-general/ Thema 2 – Deutsch-französisches 100-Milliardenprojekt Future Combat Air System (FCAS) FAZ, Ein Kampfflugzeug für 100 Milliarden Euro, 21.1.2020 www.faz.net/aktuell/politik/inl…-euro-16593549.html FAZ, Europas künftiges Kampfflugzeug nimmt Formen an, 17.6.2019 www.faz.net/aktuell/wirtschaft/…en-an-16241407.html Sicherheitshinweise Carlo: Libyen-Konferenz Views from the capitals: The Libya conference in Berlin, ECFR, 23 January 2020, www.ecfr.eu/article/commentary_…onference_in_berlin Frank: Automatische Gesichtserkennung The Secretive Company That Might End Privacy as We Know It, New York Times, 18 January 2020 www.nytimes.com/2020/01/18/techno…-recognition.html. Seehofer verzichtet auf Software zur Gesichtserkennung, Der Spiegel, 24. Januar 2020 www.spiegel.de/politik/deutschla…80ce-2642b420bd55 Rike: KI-Exportkontrollen US announces AI software export restrictions, The Verge, 5 January 2020 www.theverge.com/2020/1/5/2105050…spatial-analysis Thomas: “Cyberattack” oder “Cybercrime”? „Ungereimtheiten“ im Netzwerk, Stadt Potsdam schaltet ihre Server ab, Der Spiegel, 23. Januar 2020, www.spiegel.de/netzwelt/web/stad…8a32-cff6ad593da7 Podcast-Tipps von Rike und Frank (aus der Frage-Antwort-Runde mit dem Publikum) Rike: Bombshell Future Limited Conversations with Tyler Le Collimateur Frank: Lage der Nation Arms Control Wonk Podcast NDR Info Streitkräfte und Strategien (kein Podcast im eigentlichen Sinne) (Foto: Bernhard Ludewig) Ähnliche Beiträge Folge 13: Iran-Kriegsgefahr und Europäischer Verteidigungsfonds 8. Juni 2019 in Podcast Folge 29: „Die Welt ist fertig!“ Endet die Hegemonie der USA? | Frieden und/oder Sicherheit? 5. Juni 2020 in Podcast Folge #68 Balkan Briefing: Status Quo und Zukunft der Schlüsselregion 6. Februar 2023 in Allgemein Veröffentlicht in Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
