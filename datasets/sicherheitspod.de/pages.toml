full_description = "Folge #70 Tāningupointo: Zeitenwende auf japanisch 5. April 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 70 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit der Japan-Kennerin und -Forscherin Alexandra Sakaki. Alexandra erklärt, welche Zeitenwende sich in Japan gerade vollzieht – denn auch dort wird sicherheitspolitisch gerade gezwungenermaßen massiv umgedacht. Von einer Verdopplung der Verteidigungsausgaben ist die Rede. Alexandra analysiert für die vier vom Sicherheitspod, was die Hintergründe und Implikationen sind und wie wahrscheinlich es eigentlich ist, dass das alles wirklich so kommt. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem neuen Auslandseinsatz der Bundeswehr im Niger, den durchgesickerten Umbauplänen für das Bundesverteidigungsministerium, Neuigkeiten vom AUKUS Deal sowie womöglich bald russischen Nuklearwaffen in Belarus. Sicherheitshalber · #70 Tāningupointo: Zeitenwende auf japanisch Japan 00:02.36 Sicherheitshinweise: 00:58:26 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Sicherheitshalber Live, Do., 13.4., Akademie der Künste, Hanseatenweg 10, Berlin Sicherheitshalber Live ist zurück in Berlin! Thomas Wiegold, Frank Sauer, Ulrike Franke und Carlo Masala diskutieren live und in Farbe aktuelle Fragen der Sicherheits- und Verteidigungspolitik. Und Phoenix TV ist wie immer mit dabei. Jetzt Ticket sichern: https://adk.eventim-inhouse.de/webshop/webticket/shop?event=17792 An alle Patrons, die schon mindestens 1 Jahr mit mindestens 5 EUR dabei sind: Schreibt eine formlose Email an sicherheitspod@gmail.com – dann gibt es die euch zustehende Freikarte und ihr seid “In Sicherheit”. Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema Japan Unser Gast:Dr. phil. Alexandra Sakaki, Stellvertretende Forschungsgruppenleiterin der Forschungsgruppe Asien, Stiftung Wissenschaft und Politik (SWP), Twitter: @SakakiAlexandra »Die Zweifel an der Aufrüstung sind teilweise größer als in Deutschland«, Interview mit Alexandra Sakaki, Spiegel, 26.03.2023 Janani Mohan: Nuclear weapons gaffe in South Korea is a warning to leaders everywhere,Bulletin of the Atomic Scientists, 15.03.2023 Japans sicherheitspolitische Fähigkeiten und Ambitionen, Sicherheitshalber Folge 50, 04.11.2021 Sicherheitshinweise: Carlo: Pistorius räumt auf (vielleicht) https://www.businessinsider.de/politik/deutschland/historisch-so-stark-will-pistorius-die-bundeswehr-spitze-umbauen/ Frank: Russische Nuklearwaffen in Belarus https://www.furche.at/international/muenchner-sicherheitsexperte-frank-sauer-zu-putins-ankuendigung-atomwaffen-in-belarus-zu-stationieren-10645423 Thomas: Neue Bundeswehrmission in Niger, “strukturiertes Ende” für MINUSMA-Beteiligung https://www.consilium.europa.eu/de/press/press-releases/2022/12/12/niger-eu-establishes-a-military-partnership-mission-to-support-the-country-in-its-fight-against-terrorism/ Rike: AUKUS – Die U-Boot-Planungen für Australienhttps://podcasts.apple.com/gb/podcast/net-assessment/id1437812041?i=1000604252580 Unsere Twitter- und Mastodon-Handles: RikeTweet: @RikeFrankeTrööt: bagarrosphere.fr/@rikefranke FrankTweet: @drfranksauerTrööt: mastodontech.de/@drfranksauerCarloTweet: @CarloMasala1 ThomasTweet: @thomas_wiegoldTrööt: berlin.social/@twiegold Ähnliche Beiträge Folge 50: Japans sicherheitspolitische Fähigkeiten und Ambitionen 4. November 2021 in Allgemein Folge 51: “Hybride Kriegsführung” & “Migration als Waffe” – schwierig! | Der neue Ampel-Koalitionsvertrag 27. November 2021 in Allgemein Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine 