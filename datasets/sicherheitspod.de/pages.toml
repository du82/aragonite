full_description = "Folge 31: Posttraumatische Belastungsstörung (PTBS) | Nord Stream 2: Die politisierte Problem-Pipeline 28. Juli 202017. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 31 ist Frank Eggen bei Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zu Gast. Er setzt sich schon seit 2007 für im Einsatz traumatisierte SoldatInnen ein. Frank (E.) erläutert den vier Podcastern die Hintergründe und Symptome der im Zuge von Auslandseinsätzen bei einigen SoldatInnen auftretenden posttraumatischen Belastungsstörungen und wie die Bundeswehr sich – inzwischen – auf diese Realität eingestellt hat. Im zweiten Teil steht Nord Stream 2 im Zentrum der Diskussion. Nur irgendeine Gas-Pipeline? Ha! Mitnichten! Das Projekt hat sich längst zu einem großen geo-, energie- und klimapolitischen Zankapfel entwickelt, inklusive US-Sanktionen und veritablem transatlantischem Streit. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit russischer Einflussnahme beim Brexit, russischen Anti-Satellitenwaffen, der hitzigen Diskussion um Marcel Bohnert und Neuigkeiten aus der russischen Marine. Nu schto, wypjem schtoli, drusja!* (der kuriose Russland-Schwerpunkt ist Zufall – wir sprechen das vorher nicht untereinander ab). * “Also Freunde, trinken wir oder was?” (Schreibweise von Russland-Expertin abgesegnet!) PTBS: 00:05:22Nord Stream 2: 00:43:55Sicherheitshinweise: 01:10:50 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – PTBS Gast: Frank Eggen, Vorsitzender des Vereins Angriff auf die Seele – Psychosoziale Hilfe für Angehörige der Bundeswehr e.V.https://angriff-auf-die-seele.de/ Wittchen et al.: Traumatische Ereignisse und posttraumatische Belastungsstörungen bei im Ausland eingesetzten Soldaten: Wie hoch ist die Dunkelziffer?, Deutsches Ärzteblatt 2012 (109), S. 35-36.https://www.aerzteblatt.de/archiv/128483/Traumatische-Ereignisse-und-posttraumatische-Belastungsstoerungen-bei-im-Ausland-eingesetzten-Soldaten NDR Podcast “Killed in Action” https://www.ndr.de/nachrichten/info/sendungen/podcast4574.html Immer mehr Einsatzsoldaten der Bundeswehr mit PTBS?, 19 Feb 2020, https://www.bundeswehr-journal.de/2020/immer-mehr-einsatzsoldaten-der-bundeswehr-mit-ptbs/#:~:text=In%20einem%20Onlinebeitrag%20der%20Bundeswehr,Erkrankungen%20als%20Teil%20der%20Neuerkrankungen.&text=2018%20waren%20von%20den%20279%20registrierten%20Neuerkrankungen%20182%20PTBS-Fälle. Statistik der Bundeswehr: https://www.bundeswehr.de/de/betreuung-fuersorge/ptbs-hilfe/trauma-ptbs/statistik Thema 2 – Nord Stream 2 Anne Neumann, Leonard Göke, Franziska Holz, Claudia Kemfert, Christian von Hirschhausen: Erdgasversorgung: Weitere Ostsee-Pipeline ist überflüssig. Deutsches Institut für Wirtschaftsforschung Berlin, DIW Wochenbericht 27/2018, S. 589–597 https://www.diw.de/documents/publikationen/73/diw_01.c.593445.de/18-27-1.pdf Pavel Lokshin: Der drohende Showdown in der Ostsee, Die Welt, 22.07.2020,https://www.welt.de/politik/ausland/article211978687/Nord-Stream-2-Der-drohende-Showdown-in-der-Ostsee.html Daniel Wetzel: USA drohen deutschen Auftragnehmern von Nord Stream 2, Die Welt, 25.07.2020,https://www.welt.de/wirtschaft/article212234259/Nord-Stream-2-USA-drohen-deutschen-Auftragnehmern.html Nord Stream 2: ECFR opinions, 20 Dez. 2019 https://www.ecfr.eu/article/commentary_nord_stream_2_ecfr_opinions Gustav Gressel, Negative energy: Berlin’s Trumpian turn on Nord Stream 2, ECFR, 27th February, 2019 https://www.ecfr.eu/article/commentary_negative_energy_berlins_trumpian_turn_on_nord_stream_2 Énergie et puissance, Le Collimateur Podcast, 15.07.2020https://www.irsem.fr/le-collimateur/energie-et-puissance-15-07-2020.html Michael Thumann: Nord Stream 2 bleibt das Problem der Deutschen, Die Zeit, 01.07.2020,https://www.zeit.de/politik/2020-07/gerhard-schroeder-wirtschaftsausschuss-nordstream-2-ostsee-pipeline Markus Wehner: Linke und Ostausschuss gegen Amerikas Sanktionen, FAZ, 16.06.2020,https://www.faz.net/aktuell/politik/streit-ueber-nord-stream-2-eine-seltene-allianz-16818013.html Sicherheitshinweise Rike: Britischer Parlamentsbericht zur Russischen Einflussnahme in Brexit Referendumhttps://www.theguardian.com/world/2020/jul/21/russia-report-reveals-uk-government-failed-to-address-kremlin-interference-scottish-referendum-brexit https://www.theguardian.com/commentisfree/2020/jul/26/the-russia-report-shows-we-have-a-security-problem-he-lives-in-no-10 Frank: Test einer russischen Anti-Satellitenwaffe?https://www.heise.de/news/Projektil-abgefeuert-USA-wirft-Russland-Test-einer-Anti-Satellitenwaffe-vor-4851644.html Thomas: Vorwürfe gegen Marcel Bohnert von der Social Media-Abteilung der Bundeswehrhttp://bendler-blog.de/2020/07/23/in-der-oeffentlichen-arena/ Carlo: Putins Rede beim Tag der Marine in Russlandhttps://www.zdf.de/nachrichten/heute-journal/neue-waffen-fuer-russische-marine-100.html http://en.kremlin.ru/events/president/news/63753 Ähnliche Beiträge Folge #53 Zur geopolitischen Bedeutung von Energie: Ukraine, Russland, Nord Stream 2, Kasachstan… 20. Januar 2022 in Allgemein Folge 18: Türkei in Nord-Syrien und KI fürs Militär 14. Oktober 2019 in Podcast Folge 35: Drohnenkrieg um Bergkarabach: Ist das die Zukunft? | Bundeswehr im Inneren: alles Corona oder was? 24. Oktober 2020 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
