title = "Folge #55 Krieg gegen die Ukraine: Überraschungen, Handlungsoptionen, Implikationen und “Realpolitik” – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #55 Krieg gegen die Ukraine: Überraschungen, Handlungsoptionen, Implikationen und “Realpolitik” 18. März 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 55 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala erneut ausschließlich über den russischen Angriffskrieg gegen die Ukraine. Ihre Diskussion hat fünf Schwerpunkte: 1. Was hat die vier Podcaster überrascht, bzw. was ist ihnen in den ersten drei Wochen des Krieges aufgefallen (auch mit Blick auf Russlands nukleare Drohungen)? 2. Was können wir – der (sog.) “Westen”, die NATO, die EU – noch tun mit Blick auf die militärische Situation (Waffenlieferungen); und was sollten wir unterlassen (Flugverbotszonen)? 3. Welche Rolle (als Vermittler?) spielen Akteure wie China, Israel oder die Türkei? 4. Was sind die globalen Implikationen dieses Kriegs, etwa mit Blick auf Nahrungsmittelpreise und Lieferketten? 5. Auf vielfachen Hörerwunsch: Wovon reden selbsternannte “Realpolitiker”, wenn sie NATO (eine Teil-)Schuld am Krieg zuschreiben und Vorschläge unterbreiten wie etwa die Ukraine (gegen ihren Willen) zu einem neutralen Pufferstaat zwischen Russland und der NATO zu machen? Vorstellung: 00:00:51Russischer Angriffskrieg: 00:05:27Fazit: 01:13:55 Web: sicherheitspod.de/Shop: sicherheitshalbershop.myspreadshop.de/Twitter: twitter.com/SicherheitspodPatreon: www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema – Putins Krieg gegen die Ukraine Richard K. Ashley: The Poverty of Neorealism, in: International Organization 38:2, 225-286. Justin Bronk: Is the Russian Air Force Actually Incapable of Complex Air Operations?. RUSI, 04.03.2022. Gustav Gressel: Combined farces: Russia’s early military failures in Ukraine. ECFR, 15.03.2022. Malcolm Jorgensen: The Weaponisation of International Law in Ukraine. Völkerrechtsblog, 15.03.2022 Daan Kayser: Increasing Autonomy in Weapons Systems: 10 Examples that can inform thinking. Pax, Dezember 2021 (weil wir über “Switchblade” (US), “KUB” (RUS) etc. gesprochen hatten). Peter W. Singer: Opinion | How Ukraine Won The #LikeWar. Politico, 14.03.2022. Paul Strobel: Der Online-Spähtrupp: Soziale Medien, der Krieg in der Ukraine und der militärische Nutzen, Augen geradeaus!, 16.03.2022 . SWR2 Forum: Wehrhaft mit Wehretat – Was macht die Bundeswehr mit den Milliarden?, 14.03.2022. Joint Statement of the Russian Federation and the People’s Republic of China on the International Relations Entering a New Era and the Global Sustainable Development, 4.02.2022. Sicherheitspod Folge #26 zu Russlands sicherheitspolitischen Fähigkeiten und Ambitionen mit Gustav Gressel Sicherheitspod Folge #35 zu Drohnenkrieg um Bergkarabach Ähnliche Beiträge Folge #80 Ist die NATO-Osterweiterung Schuld an Russlands Krieg gegen die Ukraine? 31. Januar 2024 in Allgemein Folge #62 Krieg in der Ukraine: Was heißt eigentlich “gewinnen”? | Landminen: welche warum verboten sind 15. September 2022 in Allgemein Folge #64 Sechs falsche Lehren aus dem Ukraine-Krieg | Frische strategische Buchstabensuppe aus den USA 7. November 2022 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
