full_description = "Folge 2: Drohnen, KdB und die deutsche Bombe 9. August 201817. Februar 2025 ~ sicherheitspod Und hier ist sie, die zweite Folge von Sicherheitshalber, dem deutschsprachigen Podcast zur Sicherheitspolitik. Wieder mit Ulrike Franke vom European Council on Foreign Relations (ECFR), Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold – eine Ko-Produktion von ECFR und Augen geradeaus! Unsere Themen diesmal (und gleich mit Angabe der Zeit – denn nach wie vor haben wir die Technik noch nicht so völlig im Griff, und die gesetzten Kapitelmarken sind wieder verschwunden… wir geloben Besserung!): Bewaffnungsfähige Drohnen für die Bundeswehr: 2:27 Konzeption der Bundeswehr (KdB) und Ad-hoc-Koalitionen: 30:22 Deutsche/europäische Atombombe: 46:40 Fazit: 1:02:43 Feedback zu Folge 1: 1:03:53 Erwähnte Literatur und Dokumente: Thema 1: Drohnen für die Bundeswehr Ulrike Franke 2018: Killerroboter? Es geht auch anders, in: Die Zeit, 14. April 2018. www.zeit.de/politik/ausland/201…e-spd-union-debatte Thomas Wiegold & Kai Biermann 2015: Drohnen: Chancen und Gefahren einer neuen Technik, Ch. Links Verlag. http://www.christoph-links-verlag.de/index.cfm?view=3&titel_nr=818 Grunts in the Sky (20min-Dokumentation zur A-10 Warthog und Luftnahunterstützung), in: www.realcleardefense.com/2018/01/05/0…_299417.html Beauchamp, Zack, and Julian Savulescu. “Robot Guardians: Teleoperated Combat Vehicles in Humanitarian Military Intervention.” In Killing by Remote Control: The Ethics of an Unmanned Military. Edited by Bradley Jay Strawser, 106–125. Oxford: Oxford University Press, 2013. Thema 2: Konzeption der Bundeswehr Bundesministerium der Verteidigung 2018: Die Konzeption der Bundeswehr www.bmvg.de/resource/blob/26544…bundeswehr-data.pdf Einsatz in der Koalition der Willigen: Auf dem Weg zum neuen Normalfall?, Augen geradeaus! 2.8.2018 augengeradeaus.net/2018/08/einsatz-in-der-koalition-der-willigen-auf-dem-weg-zum-neuen-normalfall/ Carlo Masala 2018: Weltunordnung: Die globalen Krisen und das Versagen des Westens, C.H. Beck, 2. Aufl. www.amazon.de/dp/B079T4R5L2/ref=…pa_i_H0yABbD345674 Thema 3: Deutsche Nuklearwaffen? Christian Hacke 2018: Der Elefant im Raum, in: Welt am Sonntag. 29.7.2018, S. 4. Wolfgang Ischinger 2018: Ein atomares Deutschland wäre verhängnisvoll, in: Die Welt. 30.07.2018 www.welt.de/debatte/kommentare/…in-Verhaengnis.html Wissenschaftlicher Dienst des Bundestags 2017: Völkerrechtliche Verpflichtungen Deutschlands beim Umgang mit Kernwaffen: Deutsche und europäische Ko-Finanzierung ausländischer Nuklearwaffenpotentiale, Sachstand WD 2 – 3000 – 013/17 www.bundestag.de/blob/513080/c9a9…-17-pdf-data.pdf Gunther Hellmann, Carlo Masala, Frank Sauer und Reinhard Wolf 2016: Deutschland braucht keine Atomwaffen, in: SPIEGEL ONLINE. 11.12.2016 www.spiegel.de/politik/deutschla…en-a-1125247.html Ulrich Kühn/Tristan Volpe 2017: Keine Atombombe, Bitte. Why Germany Should Not Go Nuclear, in: Foreign Affairs: July/August, 103–112. www.foreignaffairs.com/articles/germ…ombombe-bitte Maximilian Terhalle, “Fuer eine europäische Atommacht, Frankfurter Allgemeine 13.11.2017 twitter.com/IRmt74/status/1024318775045369856 Sauer, Frank 2015: Atomic Anxiety. Deterrence, Taboo and the Non-Use of U.S. Nuclear Weapons, Palgrave Macmillan, London. www.palgrave.com/de/book/9781137533739 Die Technik ist noch nicht ganz ausgereift, aber wir sind bei Folge 2… Kapitelmarken, evtl. immer noch vorhandene Probleme mit der Tonqualität und weiteres stehen ganz oben auf dem Zettel. iTunes incl. Abonnierfunktion müsste inzwischen klappen. Wir arbeiten dran – erst mal, so hoffen wir, habt ihr Spaß und Erkenntnisgewinn mit dieser neuen Folge. (Auf Augen geradeaus! werden i.d.R. deutsche Verlagswebseiten nicht verlinkt. In diesem Fall ist wohl eine Ausnahme nötig…) (Folge 1 hier) Ähnliche Beiträge Folge 28: Die (alte/neue) Debatte um bewaffnete Drohnen für die Bundeswehr 13. Mai 2020 in DroneWatch Podcast Folge 8: Macht, Recht, Völkerrecht; Auslandseinsätze und neu: der Sicherheitshinweis 11. Januar 2019 in Podcast Sicherheitshalber aktuell: Was bedeutet die Wahl des künftigen US-Präsidenten Biden für die (deutsche) Sicherheitspolitik? 8. November 2020 in Sicherheitshalber aktuell Veröffentlicht in Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
