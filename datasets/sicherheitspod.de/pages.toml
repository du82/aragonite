description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 50: Japans sicherheitspolitische Fähigkeiten und Ambitionen 4. November 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 50 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Katja Freistein über Japan. Wir beleuchten die historischen Hintergründe des japanischen Pazifismus und der besonderen Verfassung des Landes. Achtung, Schmankerl für PolitikwissenschaftlerInnen in diesem Zusammenhang: Carlo bringt das Konzept der “Zivilmacht” ins Spiel. Ein kurzer Blick auf die Verteidigungsausgaben (lustig: japanische 1%-Grenze vs. deutsches 2%-Ziel) zeigt darüber hinaus, dass Japan und Deutschland ungefähr gleich viel aufwenden – aber lässt sich darauf aufbauend auch ein sinnvoller Vergleich der Streitkräfte ziehen? Hier stehen unter anderem Japans besondere geostrategische Lage, seine verteidigungspolitische Ausrichtung, seine enge Allianz mit den USA und die Bedrohungsperzeptionen in der Region – Stichwort China – im Fokus des Gesprächs. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem offenen Brief in Sachen Autonomie in Waffensystemen, russischen “Sorgen” um den Konflikt in der Ostukraine, sozialdemokratischen Überlegungen zur nuklearen Teilhabe und chinesischen orbitalen Bombardierungssystemen, die keinen Sputnik-Moment markieren. Sicherheitshalber · #50 Japans sicherheitspolitische Fähigkeiten und Ambitionen Japan: 00:04:12 Sicherheitshinweise: 00:49:05 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema – Japan Unsere Gesprächspartnerin: Dr. Katja Freistein Twitter: @k_freistein Web: https://www.gcr21.org/de/das-kolleg/team-gcr21/mitglieder/dr-katja-freistein 