["https://sicherheitspod.de/2024/04/11/folge-82-neutralitat-in-europa-ein-auslaufmodell-afghanistan-werden-wir-die-richtigen-lehren-ziehen"]
title = "Folge #82 Neutralität in Europa: Ein Auslaufmodell? | Afghanistan: Werden wir die richtigen Lehren ziehen? – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #82 Neutralität in Europa: Ein Auslaufmodell? | Afghanistan: Werden wir die richtigen Lehren ziehen? 11. April 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 82 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über neutrale Staaten in Europa. Mit Schweden und Finnland sind zwei Staaten, die sich zuvor als bündnisfrei oder neutral bezeichnet hatten, kürzlich der NATO beigetreten. Aber es bleiben ja noch andere neutrale EU Mitgliedstaaten, wie etwa Österreich. Warum sind Staaten neutral? Welche Vorteile, welche Nachteile sind damit verbunden – für wen? Im zweiten Teil berichtet Carlo aus der Enquete-Kommission „Lehren aus Afghanistan für das künftige vernetzte Engagement Deutschlands“, deren Mitglied er ist. Die Kommission hat jüngst ihren Zwischenbericht vorgelegt. Was ging alles schief in 20 Jahren Afghanistan? Wirklich … alles? Und welche Lehren ziehen wir daraus? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit dem inzwischen ausgegebenen Bundeswehr-Sondervermögen, der Litauen-Brigade, die auch nochmal Geld kostet, der Rückkehr der Wehrerfassung sowie einem besorgniserregenden Bericht dazu, wie Israel Künstliche Intelligenz in den Streitkräften nutzt. Neutralität: 00:01:18 Afghanistan: 00:41:01 Fazit: 01:15:06 Sicherheitshinweise: 01:16:38 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1) Neutralität Neutralität, Sicherheit & Ukraine: Österreich dürfte eigentlich mehr tun Ulrike Franke, Clara Cramer. Ambiguous alliance: Neutrality, opt-outs, and European defence. ECFR. 28.06.2021 Michael Stellwag. Neutralität, Sicherheit & Ukraine: Österreich dürfte eigentlich mehr tun. Ponto. 15.05.2023. Shane Harrison. Ukraine: Ireland’s military neutrality sparks public debate. BBC. 09.03.2022. Government announces move to transform the Defence Forces and the largest increase in the Defence budget in the history of the State. Government of Ireland. July 2022. Patrick Bury and David Murphy. No Time to Hide: The Future of Irish Defense and Security War on the Rocks. March 2023. Siobhán Geets und Clemens Neuhold. Ist die Neutralität noch zeitgemäß? Ein Streitgespräch zwischen Heinz Fischer und Johannes Kopf. Profil.at. 03.06.2022. Andrea Caruana. Neutrality is an elegant umbrella that is blown away the moment it starts raining – Giovanni Bonello, Independent. 07.04.2024. Ralph Janik. Sky Shield und Neutralität. 03.07.2023. Wolfgang Schüssel. Die Neutralität bietet keinen Schutz. Der Pragmaticus, 10.03.2024. Christoph Schwarz, Adam Urosevic. Österreichs Neutralität – Rolle und Optionen in einer sich verändernden Weltordnung. Austria Institut für Europa- und Sicherheitspolitik. 08.09.2023. Erklär mir die Welt Podcast #295. Erklär mir das Bundesheer, Franz-Stefan Gady. 02.04.2024. Thema 2) Afghanistan Zwischenbericht der Enquete-Kommission Lehren aus Afghanistan für das künftige vernetzte Engagement Deutschlands. Deutscher Bundestag. Drucksache 20/10400. 20. Wahlperiode. 19.02.2024. Sicherheitshinweise: Frank: Gute Neuigkeiten (oder sind das schlechte Neuigkeiten?): Das Sondervermögen ist fast weg: https://www.faz.net/aktuell/wirtschaft/mehr-wirtschaft/nach-verbrauch-von-sondervermoegen-wie-soll-die-bundeswehr-finanziert-werden-19641487.html Carlo: Litauen Brigade – Planlos Brigade? https://www.welt.de/politik/deutschland/plus250946882/Litauen-Einsatz-Wenn-Pistorius-die-Planlos-Brigade-schickt-und-ein-Oberst-zum-Abruecken-raet.html?ticket=ST-A-216508-QnDAKz193ryyvVZX3jMG-sso-signin-server Thomas: Mit neuer Bundeswehrstruktur kommt auch die Rückkehr der Wehrerfassung: https://augengeradeaus.net/2024/03/neue-struktur-fuer-die-bundeswehr-