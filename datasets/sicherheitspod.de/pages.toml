title = "Folge 45: Taiwan: Kriegsgefahr zwischen China und den USA? | Zehn Jahre Aussetzung der Wehrpflicht – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 45: Taiwan: Kriegsgefahr zwischen China und den USA? | Zehn Jahre Aussetzung der Wehrpflicht 30. Juni 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 45 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die Situation rund um Taiwan. Das aggressive chinesische Vorgehen gegen Hongkong legt die Frage nahe, ob die Republik China auf Taiwan, deren politischer Status umstritten ist, womöglich ein ähnliches Schicksal droht. Könnte China gar versuchen, sich den selbsterklärten demokratischen Inselstaat mit militärischen Mitteln einzuverleiben? Greifen dann die USA ein? Welche Konsequenzen hätte das – und kann Europa etwas tun? Im zweiten Teil begrüßen die vier Podcaster Frau Oberstarzt Dr. Stephanie Krause als Gast und wenden sich im Gespräch mit ihr der 2011 ausgesetzten Wehrpflicht zu. Haben die letzten zehn Jahre die Bundeswehr verändert? Und wenn ja, wie? Ist eine Freiwilligen-Bundeswehr mehr Profi-Truppe als die Wehrpflichtarmee? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit neuen Gesprächen zur strategischen Stabilität zwischen den USA und Russland, dem “HMS Defender-Vorfall” vor der Insel Krim, einem von Drohnen begleiteten Eurofighter sowie langfristigen Finanzierungszusagen für Rüstungsprojekte. Taiwan: 00:02:30 Wehrpflicht: 00:43:14 Fazit: 01:28:27 Sicherheitshinweise: 01:29:51 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Taiwan Eric Cheung/Will Ripley, Taiwan’s foreign minister says ‚we need to prepare‘ for military conflict with China, CNN, 25.6.2021, https://edition.cnn.com/2021/06/24/asia/taiwan-foreign-minister-china-intl-hnk/index.html Martine Bulard, Kommt eine pazifische Nato?, Le Monde diplomatique, 10.6.2021, https://monde-diplomatique.de/artikel/!5769766 Carina Rother/Andre Zantow, Militärmacht China: Aufrüsten für eine neue Weltordnung?, DLF Hintergrund, 25.4.2021, https://www.deutschlandfunk.de/militaermacht-china-aufruesten-fuer-eine-neue-weltordnung.724.de.html?dram:article_id=496171 NATO Gipfel Communiqué 2021, https://www.nato.int/cps/en/natohq/news_185000.htm?selectedLocale=en Antoine Bondaz/Bruno Tertrais, Europe Can Play a Role in a Conflict Over Taiwan. Will It?, World Politics Review, 23.3.2021, https://www.worldpoliticsreview.com/articles/29515/europe-can-help-prevent-a-taiwan-war Peter Beinart, Biden’s Taiwan Policy Is Truly, Deeply Reckless, New York Times, 5.5.2021, https://www.nytimes.com/2021/05/05/opinion/biden-taiwan-china.html?searchResultPosition=21 Be it resolved: There is no credible military defence of Taiwan in the face of Chinese aggression,The Munk Debates Podcast, https://podcasts.apple.com/gb/podcast/be-it-resolved-there-is-no-credible-military-defence/id1486184902?i=1000515129803 Franz-Stefan Gady, Emerging Technologies and Future Conflict in the Asia-Pacific, in: Asia-Pacific Regional Security Assessment 2021, IISS, 171-190, https://www.iiss.org/publications/strategic-dossiers/asia-pacific-regional-security-assessment-2021 Philip Anstrén, Why Europe’s future is on the line in the Taiwan Strait, New Atlanticist, 24.3.2021, https://www.atlanticcouncil.org/blogs/new-atlanticist/why-europes-future-is-on-the-line-in-the-taiwan-strait/ Chris Miller, Biden Opens Sneaky New Front in Trade War Against China, Foreign Policy, 22.6.2021, https://foreignpolicy.com/2021/06/22/biden-semiconductors-south-korea-china-trade-war/ Michael Beckley, America Is Not Ready for a War With China, Foreign Affairs, 10.6.2021, https://www.foreignaffairs.com/articles/united-states/2021-06-10/america-not-ready-war-china?utm_source=twitter_posts&utm_medium=social&utm_campaign=tw_daily_s