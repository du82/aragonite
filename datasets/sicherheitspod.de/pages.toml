full_description = "Folge 6: Trident Juncture, Waffen für die Saudis & (noch mal) INF-Vertrag 5. November 201817. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt, Folge 6: Wieder mit Ulrike Franke vom European Council on Foreign Relations (ECFR), Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold. Diesmal diskutieren wir in der Ko-Produktion von ECFR und Augen geradeaus! drei Themen: Die derzeit laufende NATO-Großübung Trident Juncture, die Debatte über deutsche Waffenlieferungen an Saudi-Arabien und, erneut, das Gezerre um den INF-Rüstungskontrollvertrag. Ist das nukleare Arsenal Chinas tatsächlich ein stichhaltiges Argument, um den von den USA angekündigten Rückzug vom INF-Vertrag zu begründen? Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Trident Juncture NATO Übung in Norwegen NATO Trident Juncture 2018 www.nato.int/cps/en/natohq/157833.htm Bundeswehr.de Sonderseite zu Trident Juncture www.bundeswehr.de/portal/poc/bwde?…01|B49DQP971DIBR Norwegische Streitkräfte: Trident Juncture 18 forsvaret.no/en/exercise-and-op…nato-exercise-2018 Augen geradeaus!: Es geht nicht nur um den Kampf um die Brücke von Telneset augengeradeaus.net/2018/10/trident…e-von-telneset/ Augen geradeaus!: Andere Anforderungen als im Kalten Krieg augengeradeaus.net/2018/10/trident…m-kalten-krieg/ Augen geradeaus!: Ein Blick vom deutschen ‚Senior National Representative‘ augengeradeaus.net/2018/10/trident…representative/ Augen geradeaus!: Trident Juncture: Bildersammler augengeradeaus.net/2018/11/trident…-bildersammler/ “reporter” NATO Großmanöver: Soldaten der Bundeswehr trainieren Krieg youtu.be/EdaLQQrjGLI Ulrike im Interview mit der Deutschen Welle zu Trident Juncture: “Inside Europe: Tanks and troops versus high-tech warfare” www.dw.com/en/inside-europe-ta…warfare/av-46122577 FAZ Glaubwürdige Abschreckung www.faz.net/aktuell/politik/aus…le=tru