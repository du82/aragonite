full_description = "Folge 42: Der große europäische Strategievergleich: Frankreich. Großbritannien. Deutschland? 10. April 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. Folge 42 ist ein ganz wenig anders als sonst üblich. Sie beginnt zunächst mit einer kurzen Beschreibung der Lage an der Grenze zwischen Russland und der Ukraine. Für eine Analyse, finden zumindest Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala, die alle vier mit Sorge auf diese Situation blicken, ist aber es aktuell noch zu früh. Deswegen reden die vier Podcaster danach dann (ausschließlich!) über das eigentlich geplante Thema, nämlich die neue “Integrated Review” Großbritanniens und das “Strategic Update” Frankreichs. Welche Bedrohungswahrnehmungen, welches Selbstverständnis, welche militärischen Überleungen und Ambitionen kommen in diesen Strategiepapieren zum Ausdruck? Und was und wie wird in Deutschland eigentlich strategisch gedacht? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu abgefangenen russischen Flugzeugen, abgezogenen amerikanischen Nuklearwaffen, abgelehnten(?) französischen Einladungen und dieser TLVS-Geschichte, bei der die Bundeswehr mal eben 13 Milliarden Euro gespart hat. Sicherheitshalber · #42 Der große europäische Strategievergleich: Frankreich. Großbritannien. Deutschland? Ukraine/Russland: 00:01:45 Strategievergleich: 00:06:21 Sicherheitshinweise: 01:00:53 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod *** Schenkt uns eure Stimme beim Deutschen Podcastpreis 2021! https://www.deutscher-podcastpreis.de/podcasts/sicherheitshalber-2/ *** Erwähnte und weiterführende Interviews, Literatur und Dokumente: Zur Lage: Ukraine/Russland Fighting Escalates in Eastern Ukraine, Signaling t