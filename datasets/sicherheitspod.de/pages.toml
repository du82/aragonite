full_description = "Folge 12: Hyperschallgleiter und multinationale Integration 6. Mai 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt: In Folge 12 diskutieren Ulrike Franke, Carlo Masala, Frank Sauer und Thomas Wiegold über Hyperschallgleiter als neue Waffensysteme und ihre mögliche Auswirkung auf das globale strategische Gleichgewicht. Zweites Thema ist die bi- und multinationale Zusammearbeit und Integration von Truppen anderer Nationen in die Bundeswehr. Am Ende steht wie immer der „Sicherheitshinweis“, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zur Datenlage mit Blick auf die Situation in Afghanistan, zu den sicherheitspolitischen Programmen der Parteien zur Europawahl, zu Trumps Rückzug vom internationalen Waffenhandelsvertrag sowie zum Fahrradbeschaffungsprogramm der Bundeswehr. Hyperschallwaffen und strategische Stabilität: 00:03:41 Bundeswehr und multinationale Kooperationen: 00:39:20 Sicherheitshinweis: 00:58:05 Unser Shop: shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Literatur: Thema 1 – Hyperschallwaffen und strategische Stabilität James M. Acton: Silver Bullet? Asking the Right Questions About Conventional Prompt Global Strike, Carnegie Endowment for International Peace, September 3rd, 2013, https://carnegieendowment.org/files/cpgs.pdf Janosch Delcker: China leads research into hypersonic technology: report, Politico.eu, Feburary 8, 2019, https://www.politico.eu/article/china-leads-research-into-hypersonic-technology-report/ Mark Gubrud: Going too fast: Time to ban hypersonic missile tests?, Bulletin of the Atomic Scientists, 71:5, September 2015, 1-4, DOI: 10.1177/0096340215599771 https://thebulletin.org/2015/09/going-too-fast-time-to-ban-hypersonic-missile-tests-a-us-response/ Ankit Panda: Russia Conducts Successful Flight-Test of Avangard Hypersonic Glide Vehicle, The Diplomat, December 27, 2018, https://thediplomat.com/2018/12/russia-conducts-successful-flight-test-of-avangard-hypersonic-glide-vehicle/ Torben Schütz: Hypersonic Weapon Systems Will Decrease Global Strategic Stability – and Current Control Regimes Won’t Do, DGAP Kompakt, 14. März 2019, https://ssl-vg03.met.vgwort.de/na/4a9a346c2cdd49b38862bca0d5ce6f37?l=https://dgap.org/de/article/getFullPDF/32167 Thema 2 – Bundeswehr und multinationale Kooperationen Björn Müller: Das Rahmennationenkonzept Dossier Deutsche Verteidigungspolitik, Bundeszentrale für politische Bildung, 2. Mai 2019 http://www.bpb.de/politik/grundfragen/deutsche-verteidigungspolitik/290423/rahmennationenkonzept Thomas Wiegold: Deutsch-Niederländische Heeresgemeinschaft: Noch keine Panzer, aber viel Hoffnung Augen geradeaus!, 17. März 2016 https://augengeradeaus.net/2016/03/deutsch-niederlaendische-heeresgemeinschaft-noch-keine-panzer-aber-viel-hoffnung/ Thomas Wiegold: Deutsch-französische Hercules-Staffel: Bundeswehr-Zugriff auch auf französische Maschinen Augen geradeaus!, 28. März 2017 https://augengeradeaus.net/2017/03/deutsch-franzoesische-hercules-staffel-bundeswehr-zugriff-auch-auf-franzoesische-maschinen/#more-26779 Andreas Schockenhoff/Roderich Kiesewetter:Impulse für europas Sicherheitspolitik. Die Zeit zum Handeln ist gekommen, in: Internationale Politik 5, September/ Oktober 2012, S. 88-97, https://zeitschrift-ip.dgap.org/de/ip-die-zeitschrift/archiv/jahrgang-2012/september-oktober/impulse-f%C3%BCr-europas-sicherheitspolitik Sicherheitshinweise Thomas: Schlechtere Datenlage mit Blick auf Afghanistan https://www.militarytimes.com/news/your-military/2019/05/01/us-military-cuts-back-on-afghanistan-war-data/ Frank: USA ziehen Unterschrift zum ATT zurück https://warontherocks.com/2019/05/trump-unsigns-the-arms-trade-treaty-how-did-we-get-here/ Rike: Europawahl und die sicherheitspolitischen Programme der Parteien https://www.ndr.de/info/sendungen/streitkraefte_und_strategien/Europawahl-Parteien-zur-Ve