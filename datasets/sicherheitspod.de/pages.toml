full_description = "Folge #78 LIVE Panda-Diplomatie und Nuklearwaffen. Chinas Rolle im 21. Jahrhundert 26. November 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 78 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala live vor Publikum im WDR Sendesaal in Köln über ein Thema, das – gemessen an der Zahl der Zuschriften – trotz aller anderen Krisen, Konflikte und Kriege viele Sicherheitspod-HörerInnen aktuelle sehr umtreibt: China. Welche politischen Ambitionen hat China – regional und global? Wie entwickeln sich seine wirtschaftlichen, diplomatischen und militärischen Fähigkeiten? Wie wahrscheinlich ist ein militärischer Konflikt um Taiwan – und was wären die Konsequenzen für globale Lieferketten, insbesondere mit Blick auf Halbleiter. Und zu guter Letzt: Was heißt das alles für Deutschland und die Zeitenwende? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit den Auswirkungen von Kriegserfahrungen im Kindesalter, sich verschlechternden Beziehungen zwischen Nord- und Südkorea, den neuen deutschen verteidigungspolitischen Richtlinien und der neuen “Task Force” für Kleindrohnen der Bundeswehr. China: 0:03:20 Sicherheitshinweise: 0:58:47 Die TV-Aufzeichnung: 1h Diskussion, keine Sicherheitshinweise: https://youtube.com/watch?v=6VcouJgvzDM%3Fsi%3DKoTa3nYTHrLxTIU4 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema: China Paul Scharre: Decoupling Wastes U.S. Leverage on China: Keeping Chinese firms dependent on Western chips is a better strategy. Foreign Policy, 13.01.2023. Ana Swanson: U.S. Tightens China’s Access to Advanced Chips for Artificial Intelligence. New York Times, 17.10.2023 Jeffrey Di