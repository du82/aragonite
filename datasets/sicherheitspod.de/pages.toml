full_description = "Sicherheitshalber Online Live Spezial Weihnachten 2020 10. Dezember 202017. Februar 2025 ~ sicherheitspod Montag, 14. Dezember 2020, 19.45 Uhr: Das Sicherheitshalber Online Live zu Weihnachten! Hört einer Livefolge zu und diskutiert mit! Es gibt Themen, bei denen können wir uns einfach nicht darauf einigen, sie in voller Länge im Podcast zu besprechen. Deswegen machen wir das jetzt einmalig live, in Farbe, auf Zoom, und zwar mit euch zusammen. Das sicherheitspolitisch Abseitige rückt in den Mittelpunkt – nutzt die Gelegenheit, denn wir veröffentlichen diese Folge nicht als Podcast. Das große „Sicherheitshalber Online Live Weihnachtsspezial“ wird einfach in den Zoom-Äther rein- und damit weggesendet. Entweder man war dabei oder eben nicht. Wir freuen uns, wenn ihr zahlreich erscheint, fragt, mitdiskutiert, blödelt und mit uns eine lustige und vielleicht auch informative Zeit verbringt. Jetzt anmelden – die Platzzahl ist begrenzt! Die Logindaten für den Zoom-call schicken wir vor dem Event über Email. Weitere Informationen hier und auf Twitter @sicherheitspod. https://www.eventbrite.de/e/sicherheitshalber-online-live-weihnachtsspezial-tickets-132381914871 Ähnliche Beiträge Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte 23. Juli 2022 in Allgemein Sicherheitshalber Spezial ***5. Geburtstag*** Live online: Ernste Themen Streumunition & NATO-Gipfel 22. Juli 2023 in Allgemein Folge 21: Abschreckung, Vorausschau 2020 – und Buchtipps 20. Dezember 2019 in Podcast Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
