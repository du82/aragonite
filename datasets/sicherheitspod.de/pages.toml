full_description = "Spezial zur Münchner Sicherheitskonferenz #2: 4****Gespräch mit Bundeswehr-GI Zorn 16. Februar 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In diesem ersten von insgesamt gleich zwei Sicherheitshalber Spezial – aufgenommen im Rahmen der Münchner Sicherheitskonferenz (MSC 2020) – sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold mit Bundeswehr-Generalinspekteur Eberhard Zorn über die folgenden Fragen: 00:01:20 – Generalinspekteur (GI) der Bundeswehr? Was ist das und was macht er oder sie? 00:02:26 – Wie wird man GI und wie sieht der Arbeitsalltag aus? 00:06:20 – Wie übernimmt Deutschland gemäß “Münchner Konsens” mehr Verantwortung? 00:11:13 – Hat sich in Deutschland die sicherheitspolitische Diskussionskultur verändert? 00:15:11 – Welche Rolle spielt der Klimawandel für die Bundeswehr? 00:18:30 – Wo steht die Bundeswehr in Sachen Einsatzbereitschaft und Ausrüstung? 00:29:00 – Was bedeutet “Ability to Act”? 00:39:16 – Hat Deutschland die richtigen Lehren aus dem Afghanistaneinsatz gezogen? 00:48:55 – Wird genug getan gegen Rechtsextremismus in der Bundeswehr? 00:54:00 – Was war das Highlight der Münchner Sicherheitskonferenz? Wie bei jedem Sicherheitshalber Spezial entfallen auch hier das Fazit und der sonst übliche “Sicherheitshinweis”. Die erste der beiden Sicherheitshalber MSC2020 Spezial-Folgen ist ebenfalls bereits verfügbar. In ihr sprechen die vier Podcaster mit der Geschäftsführerin des Zentrums für Internationale Friedenseinsätze, Dr. Almut Wieland-Karimi, und ziehen ein ausführlicheres Fazit der diesjährigen MSC. Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Erwähnte und weiterführende Interviews, Literatur und Dokumente: General Eberhard Zorn, Generalinspekteur der Bundeswehr, auf Twitter: https://twitter.com/bundeswehrgi?lang=de MSC: Munich Security Report 2020: Westlessness https://securityconference.org/publikationen/munich-security-report-2020/ „Die Achillesferse ist und bleibt das Material“ – Interview mit Jörg Vollmer, Süddeutsche Zeitung, 12. Februar 2020 https://www.sueddeutsche.de/politik/bundeswehr-joerg-vollmer-interview-1.4793533 Thomas Wiegold: Wehrbeauftragter legt erneuten Mangelbericht vor – und fordert „Trendwende Mentalität“, Augen geradeaus!, 28.01.2020 https://augengeradeaus.net/2020/01/wehrbeauftragter-legt-erneuten-mangelbericht-vor-und-fordert-trendwende-mentalitaet/ Alle Berichte des Wehrbeauftragten https://www.bundestag.de/parlament/wehrbeauftragter Tobias Bunde: Die liberale Ordnung muss neu begründet werden, Tagesspiegel, 12.02.2020, https://www.tagesspiegel.de/politik/was-ist-der-westen-die-liberale-ordnung-muss-neu-begruendet-werden/25539112.html Klaus Remme: Vor der Münchner Sicherheitskonferenz: Weniger Westen war nie. Deutschlandfunk Hintergrund, 12.02.2020 https://www.deutschlandfunk.de/vor-der-muenchner-sicherheitskonferenz-weniger-westen-war.724.de.html?dram:article_id=470108 Ähnliche Beiträge Spezial zur Münchner Sicherheitskonferenz #1: Nachlese mit Almut Wieland-Karimi 16. Februar 2020 in Podcast Sicherheitshalber Spezial Münchner Sicherheitskonferenz: #MSC2024-Nachlese mit Jana Puglierin 18. Februar 2024 in Allgemein Spezial: Münchner Sicherheitskonferenz 17. Februar 2019 in Podcast Veröffentlicht in Podcast Eberhard ZornGeneralinspekteurMSCMünchner SicherheitskonferenzMunich Security Conference Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
