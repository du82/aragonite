full_description = "Sicherheitshalber Live – Berlin 14. März 202317. Februar 2025 ~ sicherheitspod Sicherheitshalber Live ist zurück in Berlin! Thomas Wiegold, Frank Sauer, Ulrike Franke und Carlo Masala diskutieren live und in Farbe in der Akademie der Künste (Hanseatenweg 10) aktuelle Fragen der Sicherheits- und Verteidigungspolitik. Und Phoenix TV ist wie immer mit dabei. Donnerstag, 13. April. Einlass: ab 19 Uhr. Beginn der Aufzeichnung: 19:30. Hier klicken für Tickets: https://adk.eventim-inhouse.de/webshop/webticket/shop?event=17792 Wir freuen uns! Bis bald in Berlin Ein Abend mit Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala – live dabei sein, zuschauen und mitdiskutieren. Bitte beachten: 1) Die Veranstaltung wird von Phoenix TV aufgezeichnet und im Anschluss im Fernsehen ausgestrahlt sowie im Internet und in Sozialen Medien zur Verfügung gestellt. BesucherInnen der Veranstaltung erklären sich damit einverstanden, dass ihr Bild und Ton für diesen Zweck verwendet wird. 2) An alle allen aktiven Patrons, deren laufende Unterstützung zum Zeitpunkt des Events per Unterstützungsvariante #2 („In Sicherheit“) schon mindestens 12 Monate zurückreicht (kurz: alle, die schon mindestens 1 Jahr mit mindestens 5 EUR dabei sind): Schreibt eine formlose Email an sicherheitspod@gmail.com – dann gibt es die euch zustehende Freikarte und ihr seid “In Sicherheit”. P.S. Bitte habt Verständnis dafür, dass wir dieses Angebot nicht bis zum 13.4. aufrechterhalten können und Restkarten einige Tage vor dem Event in den freien Verkauf gehen. Ähnliche Beiträge Spezial: Berlin Foreign Policy Forum – Außen-Blick auf Deutschland und das Buzzword Europa-Armee 29. November 2018 in Podcast Sicherheitshalber Live – Köln 10. Oktober 2023 in Allgemein Folge #69 Wehrpflicht, Dienstpflicht, Reserve: Müssen jetzt alle ran? | Zahlen zum globalen Waffenhandel 14. März 2023 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
