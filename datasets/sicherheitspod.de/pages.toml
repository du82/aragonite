full_description = "Folge #58 Der 9. Mai und Putins Rede: Alle Optionen bleiben offen | Finnland und Schweden: NATO-Beitritt? 10. Mai 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 58 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über die Rede Wladimir Putins anlässlich der Militärparade, mit der Russland am 9. Mai den Sieg über Nazideutschland feiert. Es wurde seitens Russlands kein Sieg über die Ukraine verkündet; aber eine Generalmobilmachung wurde, wie von vielen befürchtet, auch nicht erklärt. Wie also soll man Putins Ansprache interpretieren? Im zweiten Teil wenden die vier Podcaster sich Finnland und Schweden zu – den beiden besten NATO-Allianzpartnern, die die NATO-Allianz (noch) nicht hat. Alle Zeichen stehen auf einen baldigen Beitritt. Die Diskussion diskutiert die Ursachen des schwedischen und finnischen Sinneswandels und erörtert mögliche geopolitische Konsequenzen. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem Rekurs auf das Datum 9. Mai aus deutscher Sicht, neuen nordkoreanischen Raketen, Chinas Annäherung an die Solomonen (über die Australien “not happy” ist) sowie der (weiterhin) extrem komplizierten Lage in Mali. Putinrede: 00:01:25 NATO: 00:26:41 Fazit: 01:01:01 Sicherheitshinweise: 01:01:53 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Russlands Krieg, der 9. Mai 2022 und Putins Rede Wladimir Putin, Rede zum Jahrestag des Siegs über Nazi-Deutschland, Moskau, 09.05.2022 Russische Originalfassung; offizielle englische Übersetzung, inoffizielle deutsche Übersetzung Interview mit Claudia Major, „Interessant, was er nicht gesagt hat“, tagesschau.de, 09.05.2022 Thema 2 – Finnland und Schweden vor dem NATO-Beitritt? Inching Closer Toward NATO with Mika Aaltola and Anna Wieslander, Brussels Sprouts Podcast, 11.04.2022 Anders Fogh Rasmussen, Putin Is Pushing Finland and Sweden Into NATO’s Arms, New York Times, 25.04.2022 Hans von der Burchard, Finland and Sweden ‘can count’ on Germany for protection and NATO membership support, Politico, 03.05.2022 Anne-Marie Slaughter, Expanding Nato will deepen east-west fissure, FT, 05.05.2022 Thomas Wiegold, Wir machen Soldaten: Finnlands Reservistenarmee als Abschreckungsinstrument, Augen geradeaus!, 31.08.2019 Heljä Ossa & Tommi Koivula, What Would Finland Bring to the Table for NATO?, War on the Rocks, 09.05.2022 Sicherheitshinweise: Carlo: Deutschlands NATO-Beitritt 1955 https://www.swr.de/swr2/wissen/archivradio/die-bundesrepublik-tritt-1955-der-nato-bei-100.html Frank: Nordkorea testet U-Boot-gestützte Rakete https://www.nytimes.com/2022/05/07/world/asia/north-korea-missile-submarine.html Rike: Chinas Sicherheitsvertrag mit den Salomonen https://www.iiss.org/blogs/analysis/2022/05/china-solomon-islands Thomas: Der Einsatz der Bundeswehr in Mali steht vor der Fortsetzung https://augengeradeaus.net/2022/05/bundeswehreinsatz-in-mali-weniger-mandat-mehr-soldaten-geplant-ein-ueberblick/ Ähnliche Beiträge Folge #54 Putins Angriffskrieg gegen die Ukraine: Zeitenwende in der deutschen Sicherheitspolitik 27. Februar 2022 in Allgemein Folge #69 Wehrpflicht, Dienstpflicht, Reserve: Müssen jetzt alle ran? | Zahlen zum globalen Waffenhandel 14. März 2023 in Allgemein Folge 34: Militärische Nutzung von Neurotechnologie | Die NATO-2%, oder: Wieviel Prozent hätten sie denn gern? 1. Oktober 2020 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
