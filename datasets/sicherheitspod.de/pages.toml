["https://sicherheitspod.de/2020/07/18/sicherheitshalber-spezial-2-geburtstag-patches-website-patreon-qa-buchtipps"]
title = "Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Website! Patreon! Q&A! Buchtipps! (Update) – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Website! Patreon! Q&A! Buchtipps! (Update) 18. Juli 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber wird 2 Jahre alt! Bald werden wir die Windeln los. „Sicherheitshalber“ ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt – normalerweise. Als Ablenkung vom Coronakrisen-Sommer 2020 reden Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala in dieser Folge anlässlich ihres zweiten Podcast-Geburtstags aber mal wieder über alles außer Sicherheit. Zu Beginn gibt es, nachdem Rike ihre Gin-Schildkrötengeschichte erzählt hat, eine ganze Reihe von Ankündigungen und Neuigkeiten: Patches! Website! Patreon! Dann beantworten die vier Podcaster zahlreiche Fragen von Hörerinnen und Hörern, unter anderem danach, wie wir den Podcast produzieren, welchen Einfluß dieser (nicht) hat, ob wir bei der Bundeswehr waren, Hunde haben, und ob “Pizza Hawaii” vielleicht unser safe word ist. Carlo erzählt als Rausschmeißer einen Schwank zu der Frage, warum es eigentlich kaum sicherheitspolitische Studiengänge in Deutschland gibt – die Protagonisten sind Ernst-Otto Czempiel, Werner Link und Franz Josef Strauß! Abschließend dann eine Reihe von Buchtipps (nichts mit Sicherheitspolitik, nur Unterhaltungslektüre, versteht sich). Thomas und Carlo kabbeln sich die ganze Zeit. Niemand weiß, wieso. Sicherheitshalber kommt schon in ein paar Tagen mit den gewohnten sicherheitspolitischen Inhalten zurück. Sicherheitshalber · Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Website! Patreon! Q&A! Buchtipps! Neuigkeiten: 00:04:20 Hörerfragen: 00:17:30 Buchtipps: 01:13:33 Die im Podcast angesprochene Folge zu unserem 1. Geburtstag ist hier zu finden: Darin ziehen wir Résumé nach dem ersten Jahr und beantworten zahlreiche Fragen von Hörerinnen und Hörern, unter anderem die danach, woher wir vier uns eigentlich kennen und wie das Projekt “Podcast Sicherheitshalber” aus der Taufe gehoben wurde. Unsere wunderschöne neue Website: https://sicherheitspod.de/ Unser neuer Account bei Patreon: https://www.patreon.com/sicherheitspod Unser – altbekannter – Shop: https://shop.spreadshirt.de/sicherheitshalbershop/Unsere Patch-Aktion: Das Sicherheitshalber-Logo gibt es jetzt auch als Patch, in einer limitierten Auflage von 150 Stück. Als gesticktes Abzeichen mit 8 cm Durchmesser und mit Klett auf der Rückseite, für den Rucksack oder wo es sonst passen könnte… https://augengeradeaus.net/wp-content/uploads/2020/07/20200719_SHH_Patch_rucksack_crop.jpg Update 22. Juli: Das ging schnell – schon nach zwei (Bankarbeits)Tagen sind alle 150 Patches weg-bestellt (und bezahlt). Der Versand kommt, wie angekündigt, im August. Und angesichts des Interesses denken wir dann mal über eine Neuauflage nach – später. Wenn wir erst mal alle versandt haben… Das Ganze ist ein Versuch, mal schauen, ob und wie das klappt. Wir verdienen ein wenig an jedem Patch (wenn wir unsere Arbeit für den Versand nicht mitrechnen); das stecken wir in den Betrieb des Podcasts. Buchtipps Rike: Omar El Akkad: American War Frank: Nora Bossong: Schutzzone & Don Winslow: Satori Carlo: Carlo rät ab von … John Bolton: The Room Where It Happened und empfiehlt stattdessen… Jospeh Mitchell: Zwischen den Flüssen Thomas: Tacitus, Historiae (für die Hardcore-Fans im lateinischen Original. Sonst gibt es z.B. eine englische Übersetzung als gemeinfreies EBook bei WikiSource:https://en.wikisource.org/wiki/The_Histories_(Tacitus)) Ähnliche Beiträge Sicherheitshalber Spezial ***3. Geburtstag*** Patches & Tassen: “dark edition”! Q&A! Buchtipps! 19. Juli 2021 in Allgemein Sicherheitshalber Spezial ***6. Geburtstag*** Der deutsche Diskurs, raketenmäßig. Außerdem: Patches! 19. Juli 2024 in Allgemein Spezial: 1. Geburtstag! Dank, HörerInnenfragen, Rückblick und Ausblick, Buchtipps 19. Juli 2019 in Podcast Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
