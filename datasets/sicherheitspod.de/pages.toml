full_description = "Folge #59 Was macht eigentlich China? Ukraine-Krieg beobachten, Russland stützen, Systemkonflikt forcieren 31. Mai 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 59 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Janka Oertel über China. Natürlich steht dabei zunächst Chinas Verhalten gegenüber Russland und mit Blick auf den Krieg in der Ukraine im Zentrum, gefolgt von der Frage, ob und wie die westlichen Sanktionen das Verhältnis zwischen China und Russland verändern werden – die Stichworte lauten: Militär- und Technologiekooperation! Auch die größeren geopolitischen Implikationen und die Taiwan-Frage erörtert Janka mit den vier Podcastern. Zudem werden Chinas wirtschaftliche Entwicklung, seine politische Stabilität, die möglichen Auswirkungen der Corona-Pandemie, Lieferketten und wechselseitige Abhängigkeiten, die Tücken der Wissenschaftskooperation und natürlich die brutale Unterdrückung der Uiguren diskutiert. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu VW in Xinjiang, russischen Informationsoperationen auf Twitter, Dänemarks Reaktion auf den Ukraine-Krieg sowie dem Durchbruch bei den … *Trommelwirbel* … 100 Mrd. Euro Sondervermögen. Sicherheitshalber · #59 Was macht eigentlich China? Ukraine-Krieg beobachten, Russland stützen, Systemkonflikt forcieren China: 00:03:14 Sicherheitshinweise: 00:58:06 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – China Unsere Gesprächspartnerin: Dr. Janka Oertel Director, Asia programme & Senior Policy Fellow, European Council on Foreign Relations (ECFR). Twitter: @oertel_j