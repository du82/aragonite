["https://sicherheitspod.de/2019/07/19/ein-jahr-sicherheitshalber-der-podcast-die-jubilaeumsfolge"]
title = "Spezial: 1. Geburtstag! Dank, HörerInnenfragen, Rückblick und Ausblick, Buchtipps – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Spezial: 1. Geburtstag! Dank, HörerInnenfragen, Rückblick und Ausblick, Buchtipps 19. Juli 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber hat Geburtstag! Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt – normalerweise. In dieser von unterdurchschnittlicher sicherheitspolitischer Eindringtiefe, aber weit überdurchschnittlicher Albernheit gekennzeichneten Spezialfolge feiern Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold den ersten Geburtstag des „Sicherheitspod“. Wir ziehen Résumé (Resümee?) nach dem ersten Jahr, beantworten Fragen von Hörerinnen und Hörern, denken laut über zukünftige Live Podcast-Abenteuer nach und geben eine Reihe von Buchtipps (nichts mit Sicherheitspolitik, nur Unterhaltungslektüre, versteht sich). Diese Folge ist als Dank an unsere treuen Hörerinnen und Hörer bzw. als Tippquelle für die womöglich noch zu organisierende Strandlektüre zu verstehen: Keine regulären Themen, keine Sicherheitshinweise, kein Fazit von Rike – und noch weniger Seriosität als sonst! Sicherheitshalber kehrt dann im gewohnt launig-informativ-halbseriösen Format nach der Sommerpause im August zurück. Rückschau und Dank: 00:03:10 Hörerfragen: 00:07:48 Live Show: 00:44:30 Buchtipps: 00:49:25 Das Tollste/Doofste: 01:00:03 Unser Shop ist online: https://shop.spreadshirt.de/sicherheitshalbershop/ Buchtipps: Thomas: William Gibson: Neuromancer (und weitere) Interview mit William Gibson, Zeit Magazin, 11. Januar 2017: “Ich hoffe, wir sind nicht in negativen Utopien gefangen”, https://www.zeit.de/zeit-magazin/leben/2017-01/william-gibson-science-fiction-neuromancer-cyberspace-futurist Frank: Martha Wells: The Murderbot Diaries (All Systems Red, Artificial Condition, Rogue Protocol, Exit Strategy) Rike: Neal Stephenson: Seveneves Carlo: Don Winslow: Die Kartell-Saga (Tage der Toten, Das Kartell, Jahre des Jägers) Ähnliche Beiträge Sicherheitshalber Spezial ***2. Geburtstag*** Patches! Web