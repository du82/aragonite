full_description = "Folge 33: Feministische Außenpolitik | Flugabwehr gegen Drohnen (Fähigkeitslücke “short range air defense”) 7. September 202017. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 33 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Nina Bernarding vom Centre for Feminist Foreign Policy. Die vier Podcaster lernen, was die Kerngehalte feministischer Außenpolitik sind und steigen mit Nina in eine ebenso interessante wie intensive Diskussion darüber ein. Der zweite Teil beleuchtet am Beispiel von Drohnen die Bemühungen zahlreicher Militärs weltweit – inklusive der Bundeswehr – Luftverteidigungssysteme für die Nahdistanz zu entwickeln (Laser for short range air defense!? PEW PEW PEW!). Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit der neuen Strategie Deutschlands für den indo-pazifischen Raum, dem Abtritt des japanischen Premiers Abe, der Covidifizierung der VN-Rüstungskontrolle und dem Gezerre um neuen Korvetten für die Marine. Sicherheitshalber · #33 Feministische Außenpolitik| Flugabwehr gegen Drohnen (Fähigkeitslücke “short range air defense”) Feministische Außenpolitik: 00:01:37SHORAD Flugabwehr : 00:45:02Sicherheitshinweise: 01:12:29Web: https://sicherheitspod.de/Shop: https://shop.spreadshirt.de/sicherheitshalbershopPatreon: https://www.patreon.com/sicherheitspodErwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Feministische AußenpolitikNina Bernarding, Ko-Direktorin des Centre for Feminist Foreign Policy.Twitter: @NinaBernardingWeb: https://centreforfeministforeignpolicy.org/Kristina Lunz, „Wir haben seit Jahrhunderten eine Männerquote“, Interview, Spiegel Online, 02.08.2020,https://www.spiegel.de/politik/deutschland/feminismus-in-der-politik-wir-haben-seit-jahrhunderten-eine-maennerquote-a-5043