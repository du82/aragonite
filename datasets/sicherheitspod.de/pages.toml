full_description = "Folge #85 Was ist Gesamtverteidigung & braucht man dafür Wehrpflicht? | Zeitenwende im Katastrophenschutz? 7. September 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 85 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über Gesamtverteidigung und ordnen die Begriffe und Konzepte. Dann diskutieren sie die Frage, ob man für zivile Verteidigung, Zivilschutz und Katastrophenschutz – anders gesagt das, was man gesellschaftliche Resilienz nennt – vielleicht doch mehr Leute und Strukturen braucht als wir sie in Deutschland gegenwärtig haben. Denn, den unwahrscheinlichen und unbedingt zu vermeidenden Fall eines Krieges mal außen vor lassend, die fortschreitende Klimakrise wird ja fortan regelmäßig katastrophale Extremwetter-”Jahrhundertereignisse” mit sich bringen. Im zweiten Teil unterhalten die vier Podcaster sich dann mit Albrecht Broemme, dem ehemaligen Präsidenten des Technischen Hilfswerks, um ein besseres Bild vom Stand der Dinge in Sachen Katastrophenschutz zu bekommen. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit russischer Desinformation, russischen Nuklearwaffen, Schweizer Neutralität sowie Kampfjets, die auf finnischen Landstraßen landen. Gesamtverteidigung: 00:01:49 Katastrophenschutz, mit unserem Gast Albrecht Broemme: 00:50:26 Fazit: 01:21:59 Sicherheitshinweise: 01:23:50 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Gesamtverteidigung BMI – Rahmenrichtlinien für die Gesamtverteidigung – Gesamtverteidigungsrichtlinien – (RRGV), Juni 2024 Vivian Wang, China to Its People: Spies Are Everywhere, Help Us Catch Them – The New York Times, 02.09.202