full_description = "Folge 26: Russlands sicherheitspolitische Fähigkeiten & Ambitionen 24. April 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 26 sprechen Ulrike Franke, Frank Sauer und Carlo Masala und Thomas Wiegold mit unserem Gast Gustav Gressel nur über ein Thema: Russland! Was kann Russland? Was will Russland? (Und außerdem freuen wir uns riesig: Sicherheitshalber ist für den Grimme Online Award nominiert – aber das haben wir erst nach der Aufzeichnung erfahren…) Ähnlich wie in Folge #15 zum Thema China lassen wir uns diesmal vom Russlandexperten Gustav, der als Senior Policy Fellow beim European Council on Foreign Relations arbeitet, zuerst die Modernisierungsprogramme und die Fähigkeiten des russischen Militärs erklären (aufgepasst, da wird es auch mal nerdig). Im Anschluss diskutieren wir die sicherheitspolitische Einordnung des Gelernten und erörtern in diesem Zuge gegenseitige Bedrohungswahrnehmungen sowie zukünftige Entwicklungen. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem Blick auf den sinkenden Ölpreis, drohende Hungersnöte, womöglich sinkende Verteidigungsausgaben sowie die vom Sicherheitspod schon lange begleitete Frage der Tornado-Nachfolge – als Rausschmeißer reden wir aus diesem Anlass übrigens auch nochmal kurz über die nukleare Teilhabe. Vorstellung Gustav und Österreichisches Militär: 00:01:51 Russlands sicherheitspolitische Fähigkeiten und Ambitionen: 00:05:18 Sicherheitshinweise: 01:08:50 Nachfrage zur nuklearen Teilhabe: 01:17:53 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop Erwähnte und weiterführende Interviews, Literatur und Dokumente: Russlands sicherheitspolitische Fähigkeiten und Ambitionen Gustav Gressel, European Council on Foreign Relations https://www.ecfr.eu/profile/C346/ Twitter: @GresselGustav David A. Shlapak, Michael Johnson, Reinforcing Deterrence on NATO’s Eastern Flank Wargaming the Defense of the Baltics, RAND Corporation 2016 https://www.rand.org/pubs/research_reports/RR1253.html Gustav Gressel, Russia’s Quiet Military Revolution, and what it means for Europe, ECFR, 10.2015 https://www.ecfr.eu/page/-/Russias_Quiet_Military_Revolution.pdf Gustav Gressel, Lessons from Russia’s intervention in Syria, ECFR, 5.2.2016 https://www.ecfr.eu/article/commentary_lessons_from_russias_intervention_in_syria5085 Nicu Popescu, Hiski Haukkal (ed.) Russian Futures: Horizon 2025, IISS, 07.4.2016 https://www.iss.europa.eu/content/russian-futures-horizon-2025 Richard A. Bitzinger, Nicu Popescu, Defence Industries in Russia and China: Players and Strategies, IISS, 6.12.2017 https://www.iss.europa.eu/content/defence-industries-russia-and-china-players-and-strategies Dmitry Adamsky, Cross-Domain Coercion, The Current Russian Art of Strategy, IFRI, 2015 https://www.ifri.org/sites/default/files/atoms/files/pp54adamsky.pdf Hannah Roberts, Moscow’s coronavirus offensive, Politico, 22.4.2020, https://www.politico.eu/article/moscow-coronavirus-offensive-vladimir-putin/ Gustav Gressel, Under the gun: Rearmament for arms control in Europe, 28.11.2018, https://www.ecfr.eu/publications/summary/under_the_gun_rearmament_for_arms_control_in_europe Michael Kofman, Anya Fink, Jeffrey Edmonds, Russian Strategy for Escalation Management: Evolution of Key Concepts, CNA, 4.2020 https://www.cna.org/CNA_files/PDF/DRM-2019-U-022455-1Rev.pdf Anya Fink and Michael Kofman, Russian Strategy for Escalation Management: Key Debates and Players in Military Thought, CNA, 4.2020 https://www.cna.org/CNA_files/PDF/DIM-2020-U-026101-Final.pdf Gustav Gressel, The sanctions straitjacket on Russia’s defence sector, ECFR, 13.2.2020 https://www.ecfr.eu/article/commentary_the_sanctions_straitjacket_on_russias_defence_sector Gustav Gressel, The authoritarian entente: Sino-Russian security cooperation, ECFR, 17.10