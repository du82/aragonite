title = "Folge #60 Atomkriegs-Risiko und Sicherheit in Europa: Funktioniert Abschreckung? | Brennpunkt Kaliningrad – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #60 Atomkriegs-Risiko und Sicherheit in Europa: Funktioniert Abschreckung? | Brennpunkt Kaliningrad 28. Juni 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 60 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über die besorgniserregende neue Sicherheitslage in Europa nach dem russischen Angriffskrieg auf die Ukraine. Zunächst geht es um die Angst vor einem möglichen Atomkrieg – wie groß ist das Risiko wirklich? Wann funktioniert – und wann versagt – die nukleare Abschreckung? Welche anderen Faktoren sind im Spiel? Und was sind die eigentlich die geopolitischen Implikationen dieses Krieges in Europa, etwa mit Blick auf die Weiterverbreitung von Nuklearwaffen? Im zweiten Teil schauen die vier Podcaster genauer auf Kaliningrad, den sogenannten Suwalki-Korridor und die Umstellung im Bereich der konventionellen Abschreckung in Europa. Die baltischen Staaten haben stets gewarnt – hatten sie schlicht und einfach richtig und verdienen jetzt, im Extremfall verteidigt und nicht nur als “Stolperdraht” benutzt zu werden? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zu Waffenlieferungen und Pazifismus, Deep Fakes, raffinierten Öl-Deals und der EU-Mission Althea in Bosnien und Herzegowina. Sicherheitshalber · #60Atomkriegs-Risiko und Sicherheit in Europa: Funktioniert Abschreckung? | Brennpunkt Kaliningrad Nukleares Risiko: 00:01:02 Kaliningrad und Baltikum: 00:57:00 Fazit 01:22:52 Sicherheitshinweise: 01:23:55 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Hier geht’s zur Anmeldung zum SicherheitshalberSuperSommerSpezial anlässlich des 4. Geburtstags des Sicherheitspod – LIVE auf Zoom am 20. Juli u