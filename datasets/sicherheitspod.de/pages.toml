full_description = "Sicherheitshalber Spezial Münchner Sicherheitskonferenz: #MSC2023-Nachlese mit Claudia Major 19. Februar 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In dieser Folge sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Claudia Major über die diesjährige Münchner Sicherheitskonferenz, die erste Sicherheitskonferenz “in einer neuen Ära, für die wir noch keinen Namen haben” (wie Frank aus der New York Times geklaut hat). Es war der letzte Tag der Konferenz, morgens früh um 8 Uhr. Man merkt’s! Das ist mal wieder eine Spezial-Folge. Kein Fazit, keine Sicherheitshinweise. Die nächste reguläre Episode kommt bald. Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Unser Gast: Dr. Claudia Major, Leiterin der Forschungsgruppe Sicherheitspolitik, Stiftung Wissenschaft und Politik, Twitter: @ClaudMajor Thema: MSC2023 Münchner Sicherheitskonferenz: Ergreifende Szene bei der Eröffnung der Münchner Sicherheitskonferenz Anna Clara Arndt, Liviu Horovitz: Eine Chronologie der nuklearen Anspielungen Moskaus im Krieg gegen die Ukraine, SWP Forschungsgruppe Sicherheitspolitik, Arbeitspapier 2022/Nr. 2, Mai 2022. Münchner Sicherheitskonferenz: Ukraine plädiert für Einsatz von Streumunition, Stand: 18.02.2023 20:39 Uhr Unsere Twitter- und Mastodon-Handles: Rike: Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Frank: Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Carlo: Tweet: @CarloMasala1 Thomas: Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Ähnliche Beiträge Sicherheitshalber Spezial Münchner Sicherheitskonferenz: #MSC2024-Nachlese mit Jana Puglierin 18. Februar 2024 in Allgemein Spezial zur Münch