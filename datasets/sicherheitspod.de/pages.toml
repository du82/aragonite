title = "Folge 48: Nicht-tödliche Waffen: Eine gute Idee? | Merde! Crikey! Der U-Boot-Streit und was er bedeutet – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge 48: Nicht-tödliche Waffen: Eine gute Idee? | Merde! Crikey! Der U-Boot-Streit und was er bedeutet 25. September 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 48 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst mit Elisabeth Hoffberger-Pippan über nicht-tödliche Waffen. Die Expertin von der Stiftung Wissenschaft und Politik in Berlin erklärt, was es genau mit diesen Waffen auf sich hat, welche neuen – teils kuriosen (Kotzstrahler und Klebeschaum!?) – Entwicklungen sich in dem Feld beobachten lassen und wo die Fallstricke lauern. Im zweiten Teil wenden die Podcaster sich dem geplatzten U-Boot-Deal zwischen Frankreich und Australien und der neuen indopazifischen Sicherheitsallianz “AUKUS” zu. Was sind die geopolitischen Implikationen, und was bedeutet diese ganze Aufregung für das transatlantische Verhältnis? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit allerlei U-Boot-Parkplätzen, Raketen-Wettläufen, russischen Söldnern in Mali und der Frage, ob wir vor einem hybriden Energiekrieg stehen. Sicherheitshalber · #48 Nicht-tödliche Waffen: Eine gute Idee? | Merde! Crikey! Der U-Boot-Streit und was er bedeutet Nicht-tödliche Waffen: 00:02:44 U-Boot-Streit: 00:42:07 Fazit: 01:22:35 Sicherheitshinweise: 01:24:02 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Nicht-tödliche Waffen mit Elisabeth Hoffberger-Pippan, SWP, Twitter: @EHoffbergerP Neil Davison, ‘Non-Lethal’ Weapons, Palgrave Macmillan, 2009. Eva Massingham, Conflict without casualties … a note of caution: non-lethal weapons and international humanitarian law, International Review of the Red Cross, 94 (886), 2012, https://international-review.icrc.org/articles/conflict-without-casualties-note-caution-non-lethal-weapons-and-international-humanitarian Michael Crowley and Malcolm Dando, The incapacitating chemical agents loophole, The Bulletin of Atomic Scientists, 22.10.2014, https://thebulletin.org/2014/10/the-incapacitating-chemical-agents-loophole/ Elisabeth Hoffberger-Pippan, Less-Lethal Weapons under International Law: A Three-Dimensional Perspective, Cambridge University Press, 2021. Thema 2 – U-Boot-Streit Max Bergman, The Biden Administration needs to act fast to reset the relations with France, War on the Rocks, 21.09.2021, https://warontherocks.com/2021/09/the-biden-administration-needs-to-act-fast-to-reset-relations-with-france/ Walter Russel Mead, America Should Be Frank With France, Wall Street Journal, 20.09.2021, https://www.wsj.com/articles/america-france-aukus-nuclear-submarines-australia-britain-ambassador-indo-pacific-11632166702?mod=opinion_lead_pos10 Australiens künftige Atom-U-Boote – und der transatlantische Graben, Augen geradeaus!, 21.09.2021 (mit Material aus der Pressekonferenz des australischen Premierministers; Aussagen des französischen Verteidigungsministeriums) https://augengeradeaus.net/2021/09/australiens-kuenftige-atom-u-boote-und-der-transatlantische-graben/ Was steckt hinter dem U-Boot-Streit? Interview mit Jana Puglierin (ECFR), Deutschlandfunk, 18.09.2021, https://srv.deutschlandradio.de/dlf-audiothek-audio-teilen.3265.de.html?mdm:audio_id=958877 Stephen M. Walt, The AUKUS Dominoes Are Just Starting to Fall, Foreign Policy, 18.09.2021, https://foreignpolicy.com/2021/09/18/aukus-australia-united-states-submarines-china-really-means/ Ian J. Stewart, The Australian submarine agreement: Turning nuclear cooperation upside down, Bulletin of Atomic Scientists, 17.09.2021, https://thebulletin.org/2021/09/the-australian-submarine-agreement-turning-nuclear-cooperation-upside-down/?utm_source=Newsletter&utm_medium=Email&utm_campaign=MondayNewsletter09202021&utm_content=NuclearRisk_AUKUS_09172021 Tariq Rauf, Australia’s Nuclear-Powered Submarines Will Risk Opening a Pandora’s Box of Proliferation, Atomic Reporters, 19.09.2021, https://www.atomicreporters.com/2021/09/opinion-australias-nuclear-powered-submarines-will-risk-opening-a-pandoras-box-of-proliferation/ Rana Mitter, The Aukus pact is a sign of a new global order, Guardian, 17.09.2021, https://www.theguardian.com/commentisfree/2021/sep/17/aukus-pact-china-us-european-security-nato Quelques heures avant la rupture du contrat des sous-marins, les Australiens envoyaient à Paris un courrier « satisfait », selon l’armée, Le Monde, 21.09.2021, https://www.lemonde.fr/international/article/2021/09/21/sous-marins-selon-l-armee-les-australiens-s-etaient-dits-satisfaits-du-sous-marin-quelques-heures-avant-de-rompre-le-contrat_6095508_3210.html Tara Varma, After AUKUS: The uncertain future of American and European cooperation in the Indo-Pacific, ECFR 22.9.21 https://ecfr.eu/article/after-aukus-the-uncertain-future-of-american-and-european-cooperation-in-the-indo-pacific/ Nach der Aufzeichnung des Podcasts veröffentlicht:Joint Statement on the Phone Call between President Biden and President Macron, The White House, 22.09.2021 https://www.whitehouse.gov/briefing-room/statements-releases/2021/09/22/joint-statement-on-the-phone-call-between-president-biden-and-president-macron/ Sylvie Kauffmann, No Wonder the French Are Angry, New York Times Sept. 22, 2021, https://www.nytimes.com/2021/09/22/opinion/france-us-china-submarines.html Sicherheitshinweise Rike: Wo stationiert England seine Atom-Uboote, wenn Schottland unabhängig wird? https://www.ft.com/content/2e73ab9d-772b-4112-871a-24207f0e982a Frank: Koreanischer Raketen-Rüstungswettlauf https://www.armscontrolwonk.com/archive/1213451/all-aboard-the-missile-train/ Carlo: Russische Söldner Wagner in Mali https://twitter.com/BMVg_Bundeswehr/status/1438095871397220362?s=20 https://www.theafricareport.c