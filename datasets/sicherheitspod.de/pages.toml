full_description = "Folge 21: Abschreckung, Vorausschau 2020 – und Buchtipps 20. Dezember 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 21 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold zuerst über die Rückkehr und die Rolle der militärischen Abschreckung in Europa – und zwar ganz konkret am Beispiel des Beitrags der Bundeswehr zur NATO enhanced Forward Presence (eFP) in Litauen. Als zweites wagen wir eine sicherheitspolitische Vorausschau auf das Jahr 2020 und darüber hinaus. Es wird eher düster, so viel sei verraten. Abschließend diesmal ausnahmsweise kein Sicherheitshinweis, sondern wie immer vor Weihnachten (also zum zweiten Mal) unsere Buchtipps – diesmal mit vielen Sachbüchern und Romanen in deutscher und englischer Sprache zum Lesen und Verschenken in den kommenden Tagen. Sicherheitshalber kommt 2020 zurück – und zwar LIVE, am 23. Januar in der Urania in Berlin! Am besten gleich jetzt hier ganz fix (das womöglich letzte) Ticket sichern: https://www.urania.de/sicherheitshalber-der-podcast-zur-sicherheitspolitischen-lage Bis dahin wünschen Rike, Frank, Carlo und ich allen Hörerinnen und Hörern schöne Feiertage und einen guten Start ins neue Jahr. Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Thema #1 – Abschreckung: 02:31 Thema #2 – Vorausschau 2020+: 45:15 Buchtipps: 1:15:05 Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Konventionelle Abschreckung in Europa (am Beispiel Baltikum) Abschlusserklärung des NATO-Gipfels in Warschau, 9. Juli 2016 https://www.nato.int/cps/en/natohq/official_texts_133169.htm Punkt 40: “We have decided to establish an enhanced forward presence in Estonia, Latvia, Lithuania and Poland to unambiguously demonstrate, as part of our overall posture, Allies‘ solidarity, determination, and ability to act by triggering an immediate Allied response to any aggression.” Augen g