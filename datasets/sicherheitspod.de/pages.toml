full_description = "Sicherheitshalber Spezial ***5. Geburtstag*** Live online: Ernste Themen Streumunition & NATO-Gipfel 22. Juli 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der – inzwischen 5 Jahre alte! – Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In der Vergangenheit waren Geburtstage stets Anlass zu allerlei Faxen sowie zur Verkostung des einen oder anderen alkoholhaltigen Kaltgetränks. Dieses Jahr war den vier Podcastern aber nicht nach Jux und Dollerei. Außerdem wurden in den letzten Tagen so viele brandaktuelle Themen an den Sicherheitspod herangetragen, dass der Geburtstag am 19. Juli kurzerhand live, in Form eines Twitter Space, stattfand, um auch mit den Hörerinnen und Hörern ins Gespräch kommen zu können. Es geht also zu Beginn kurz um das von Russland aufgekündigte Getreideabkommen und dann um die kontroverse Lieferung von Streumunition an die Ukraine sowie die Implikationen des NATO-Gipfels in Vilnius. Das ist der Mitschnitt des Twitter Space (ohne das Q&A-Segment mit den ZuhörerInnen) – für die deswegen leider schlechtere Tonqualität bittet die Crew des Sicherheitspod inständig um Nachsicht. Die nächste reguläre Folge kommt schon nächste Woche! Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Streumunition Elvira Rosert, Frank Sauer. Dilemma mit Streuwirkung. taz. 22.07.2023 Will Wright. Dissecting the Debate on Cluster Munitions. Völkerrechtsblog. 21.07.2023 Ulrike Franke. Streumunition aus den USA wird für die Nato, aber auch die Ukraine zum Problem. Focus online. 11.07.2023 Elvira Rosert, Frank Sauer, Hendrik Simon. Beyond Black and White: Normative Ambiguities and the Delivery of Cluster Bombs: An Interview with Elvira Rosert and Frank Sauer. Völkerrechtsblog. 12.07.2023, doi: 10.17176/20230712-230947-0 Thema 2: NATO Gipfel NATO. Vilnius Summit Communiqué. 11.07.2023 Unsere Twitter- und Mastodon-Handles: Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Carlo Tweet: @CarloMasala1 Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Ähnliche Beiträge Sicherheitshalber Spezial ***4. Geburtstag*** Live online: Podcast-Kritik und Zeitenwende-Debatte 23. Juli 2022 in Allgemein Sicherheitshalber Online Live Spezial Weihnachten 2020 10. Dezember 2020 in Allgemein Sicherheitshalber Spezial Münchner Sicherheitskonferenz: #MSC2023-Nachlese mit Claudia Major 19. Februar 2023 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
