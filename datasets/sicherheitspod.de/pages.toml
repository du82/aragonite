full_description = "Folge #83 LIVE „Was wäre, wenn…“ – Trump, die NATO und europäische Atomwaffen. Wie wehrhaft sind wir? 21. April 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 83 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala live vor Publikum im Kupfersaal in Leipzig über sicherheitspolitische Zukunftsszenarien. Was, wenn Russland den Krieg gegen die Ukraine gewinnt? Was, wenn Donald Trump im November die US-Präsidentschaftswahlen gewinnt? Was, wenn es zum befürchteten “Flächenbrand” im Nahe Osten kommt? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Automatisierung der ‘kill chain’, Polens Beitritt zum European Sky Shield, Argentiniens Beitritt zur NATO global partnership und der Rückkehr der Heeresflugabwehr. Was wäre, wenn… …Russland gewinnt: 00:02:20 …Trump gewählt wird: 00:26:05 …der Nahe Osten weiter eskaliert: 00:51:43 Sicherheitshinweise: 01:01:21 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1) Was wäre, wenn … Jamie Dettmer. Ukraine is heading for defeat. Politico. 17.04.2024 Samuel Charap, Sergey Radchenko. The Talks That Could Have Ended the War in Ukraine. Foreign Affairs 16.04.2024. Mykola Bielieskov. Western fear of escalation will hand Putin an historic victory in Ukraine. Atlantic Council. 16.04.2024. Nico Lange, Carlo Masala. Was, wenn Russland gewinnt?, Die ZEIT. 19.11.2023. Simon Kuper. What if Russia wins. Financial Times. 21.12.2023. Mark Leonard, Ivan Krastev. Wars and elections: How European leaders can maintain public support for Ukraine. ECFR 21. Februar 2024. Would you really die for your country?. The Economist. 17.04.2024. Sicherheitshinweise: Fr