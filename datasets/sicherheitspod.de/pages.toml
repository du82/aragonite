full_description = "Folge #67 Was ist “Wehrhaftigkeit”? | Was hält uns nachts wach, wird übersehen, wird positiv überraschend? 11. Januar 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 67 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über “Wehrhaftigkeit” – viele PoltikerInnen führen dieses Wort seit dem russischen Angriffskrieg auf die Ukraine im Mund. Deutschland und Europa sollen “wehrhafter” werden, heißt es dauernd. Aber was soll das bedeuten? Was hat das mit der berühmt-berüchtigten Zeitenwende zu tun? Und droht, wenn wir nicht aufpassen, am Ende gar die Militarisierung der Gesellschaft? Im zweiten Teil wagen die vier vom Sicherheitspod die ganz große Vorausschau aufs Jahr 2023: Was macht ihnen Sorge oder hält sie gar nachts wach? Was wird gerne übersehen? Wovon könnten wir (vielleicht, hoffentlich) alle sogar positiv überrascht werden? Abschließend – ausnahmsweise – mal keine “Sicherheitshinweise”. Die Folge ist so schon lange genug! Sicherheitshalber · #67 Was ist “Wehrhaftigkeit”? | Was hält uns nachts wach, wird übersehen, wird positiv überraschend? Was ist “Wehrhaftigkeit”: 00:02:24 Vorausschau 2023: 55:31 Fazit: 01:18:20 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Wehrhaftigkeit Interview mit Annalena Baerbock, „Die Welt ist kein Wunschkonzert“, Table Media, 04.01.2023 Ernst-Wolfgang Böckenförde: „Die Entstehung des Staates als Vorgang der Säkularisation“ 1967 Bundeswehr.de, Zeitenwende im verteidigungspolitischen Meinungsbild, 11.10.2022 Lars Klingbeil, Zeitenwende – Der Beginn einer neuen Ära. Rede von Lars Klingbeil bei der Tiergartenkonferenz 2022 der Friedrich-Ebert-Stiftung, 22