full_description = "Über uns (c) Bernhard Ludewig (c) Bernhard Ludewig (c) Bernhard Ludewig Ulrike Franke Rike aka Dr. Drone ist Thinktankerin (oder Denkfabrikantin?) beim European Council on Foreign Relations in Paris. Sie spricht fließend deutsch, englisch, französisch und technisch. Rike hat das ansteckendste Lachen der Welt. BlueSky: @rikefranke.bsky.social X/Twitter @rikefranke Thomas Wiegold Thomas ist Journalist und das deutsche Blogging-Urgestein zu sicherheitspolitischen Themen im Allgemeinen und der Bundeswehr im Speziellen. An augengeradeaus.net führt kein Weg vorbei. Thomas ist in Fachkreisen zudem als der Barry White der deutschen Podcast-Szene bekannt. BlueSky: @wiegold.bsky.social X/Twitter: @thomas_wiegold Carlo Masala Carlo ist Politikwissenschaftler an der Universität der Bundeswehr München. Er ist für die ganz großen, professoralen Linien zuständig – ach, und für die NATO natürlich. Rike hat auf Carlos Sicherheitspott „Gepanzertes Einhorn“ drucken lassen. BlueSky: @carlomasala1.bsky.social X/Twitter: @CarloMasala1 Frank Sauer Frank aka Dr. Doom ist ebenfalls Politikwissenschaftler an der Universität der Bundeswehr München. Irgendwo zwischen Technik, Ethik und Völkerrecht liegt thematisch seine Podcast-Komfortzone. Rike hat auf Franks Sicherheitspott „Peacenik“ drucken lassen. BlueSky: @drfranksauer.bsky.social X/Twitter: @drfranksauer Fotos: (c) Daniela Nickmann (Buch Wien)"
