full_description = "Folge 28: Die (alte/neue) Debatte um bewaffnete Drohnen für die Bundeswehr 13. Mai 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 28 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold über die Frage, ob die Bundeswehr bewaffnete Drohnen bekommen soll oder nicht. Da vor der entsprechenden Beschaffungsentscheidung im Bundestag eine breite gesellschaftliche Debatte geführt werden soll, schlüsseln wir die entscheidenden Argumente pro und contra systematisch auf, in der Hoffnung, dass die Hörer*innen sich so schneller eine eigene fundierte Meinung bilden können. Abschließend dann wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit neuen Zahlen zu weltweiten Rüstungsausgaben, neuen Entwicklungen mit Blick auf 5G in Deutschland, neuen Kampfhandlungen in Kaschmir und der neuen Wehrbeauftragten des Deutschen Bundestages. Bewaffnete Drohnen für die Bundeswehr: 00:03:17 Erhöhen bewaffnete Drohnen den Schutz eigener Soldaten? 00:13:19 Gibt es höhere Kollateralschäden durch bewaffnete Drohnen? 00:19.54 Verursacht die Beschaffung bewaffneter Drohnen eine Aufrüstungsspirale/ein globales Wettrüsten? 00:32:37 Sinkt durch bewaffnete Drohnen die Hemmschwelle zur Anwendung militärischer Gewalt? Werden durch die Existenz bewaffneter Drohnen Konflikte wahrscheinlicher? 00:41:52 Entmenschlicht die Steuerung von Drohnen den Piloten? 00:47:10 Rechtliche Fragen: 00:53:55 Verstößt der Einsatz bewaffneter Drohnen gegen Völkerrecht? Gilt der Parlamentsvorbehalt auch bei Drohneneinsätzen? Ist es ethisch vertretbar Menschen mittels bewaffneter Drohnen zu töten? 01:04:30 Sind Drohnen der erste Schritt zu autonomer Kriegsführung? 01:13:16 Sicherheitshinweise: 01:22:12 Grimme Online Award Publikumspreis: https://w1.grimme-online-award.de/goa/voting/ext_voting.pl Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop Erwähnte und weiterführende Interviews, Literatur und Dokumente: Die (alte/neue) Debatte um bewaffnete Drohnen für die Bundeswehr Dokumentation: Drohnendebatte im BMVg, Augen geradeaus!, 11.05.2020 https://augengeradeaus.net/2020/05/dokumentation-drohnendebatte-im-bmvg/ New America Foundation – World of Drones https://www.newamerica.org/international-security/reports/world-drones/ Ulrike Franke, Killerroboter? Es geht auch anders, Die Zeit, 14.4. 2018, https://www.zeit.de/politik/ausland/2018-04/kampfdrohnen-luftwaffe-spd-union-debatte Thomas Wiegold, Kai Biermann, “Drohnen – Chancen und Gefahren einer neuen Technik”, Ch. Links Verlag, 2015 https://www.christoph-links-verlag.de/index.cfm?view=3&titel_nr=818 Frank Sauer, Einstiegsdrohnen: Zur deutschen Diskussion um bewaffnete unbemannte Luftfahrzeuge, Zeitschrift für Außen- und Sicherheitspolitik 3/2014 https://www.springerprofessional.de/einstiegsdrohnen-zur-deutschen-diskussion-um-bewaffnete-unbemann/6061512 Thomas Wiegold, Union eröffnet neue Debatte über Bundeswehr-Kampfdrohnen, Augen geradeaus!, 4.12.2019 https://augengeradeaus.net/2019/12/dronewatch-union-eroeffnet-neue-debatte-ueber-bundeswehr-kampfdrohnen/ Thomas Wiegold, Franzosen starten mit bewaffneten Drohnen im Sahel, deutsche Debatte stockt, Augen geradeaus!, 20.12.2019 https://augengeradeaus.net/2019/12/dronewatch-franzosen-starten-mit-bewaffneten-drohnen-im-sahel-deutsche-debatte-stockt/ Thomas Wiegold, Bundeswehr beginnt Ausbildung für neue Drohne, Augen geradeaus!, 28.1.2019 https://augengeradeaus.net/2019/01/dronewatch-bundeswehr-beginnt-ausbildung-fuer-neue-bewaffnungsfaehige-drohne/ Thomas Wiegold, Bundestag billigt neue Bundeswehr-Drohnen – und setzt neue Hürden für Bewaffnung, Augen geradeaus!, 13.6.2018 https://augengeradeaus.net/2018/06/dronewatch-bundestag-billigt-neue-bundeswehr-drohnen-und-setzt-neue-huerden-fuer-bewaffnung/ Thomas Wiegold, GroKo-Verhandlungen: SPD zu Beschaffung von H