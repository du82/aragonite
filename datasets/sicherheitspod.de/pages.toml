full_description = "Folge 1: Sicherheitspolitik für die Ohren – ein Podcast auf Deutsch 19. Juli 201817. Februar 2025 ~ sicherheitspod Podcasts gibt es in diesen Tagen immer mehr.Podcasts zur Sicherheitspolitik gibt es – überwiegend auf Englisch. Aber ein deutsprachiger Podcast zur Sicherheitspolitik? Wir haben einen begonnen: In Zusammenarbeit von Augen geradeaus! und dem European Council on Foreign Relations (ECFR) ist hier: Sicherheitshalber Und die erste Folge ist online – zum NATO-Gipfel in der vergangenen Woche, zum Treffen von US-Präsident Donald Trump mit dem russischen Präsidenten Wladimir Putin und natürlich zur Debatte über den deutschen Verteidigungshaushalt. Bei Sicherheitshalber diskutieren Ulrike Franke vom ECFR, Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold von Augen geradeaus! Wir sind sehr gespannt, wie das neue Format ankommt – Kommentare, Kritik und wenn nötig auch ein bisschen Lob gerne hier in den Kommentaren oder bei Soundcloud. (Es ist alles noch am Anfang, und wir basteln noch an so Dingen wie Shownotes, Links zur Folge und ähnlichem – lasst uns da ein bisschen Zeit.) Nachtrag: Der RSS-Feed dazu: http://feeds.soundcloud.com/users/soundcloud:users:479331222/sounds.rss iTunes ist noch in der Mache. Ähnliche Beiträge Sicherheitshalber aktuell: Was bedeutet die Wahl des künftigen US-Präsidenten Biden für die (deutsche) Sicherheitspolitik? 8. November 2020 in Sicherheitshalber aktuell Folge 10: Sicherheitspolitik als weiterer Spaltpilz für die Groko? & Bundeswehr in Mali 9. März 2019 in Podcast Spezial: Deutsch-Amerikanische Beziehungen 3. Oktober 2019 in Podcast Veröffentlicht in Blogthings, Podcast Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
