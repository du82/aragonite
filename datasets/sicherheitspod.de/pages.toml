title = "Folge #86 Realismus und Realität – wozu Theorien gut sind | War die ganze Rüstungskontrolle fürn Arsch? – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #86 Realismus und Realität – wozu Theorien gut sind | War die ganze Rüstungskontrolle fürn Arsch? 2. Oktober 202417. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 86 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über Theorie und Praxis. Was können politikwissenschaftliche Theorien der Internationalen Beziehungen leisten, was nicht? Welche Perspektiven eröffnen sie auf den russischen Krieg gegen die Ukraine? Warum ist es auch für Nicht-WissenschaftlerInnen vielleicht ganz praktisch, von verschiedenen theoretisch informierten Perspektiven schon mal gehört zu haben, um sich in Debatten besser zurechtzufinden? Im zweiten Segment fragen sich die vier Podcaster, ob das mit der Rüstungskontrolle vielleicht alles ein naives Unterfangen und ein Selbstbetrug war. Warum wird Rüstungskontrolle gemacht – und welche Ziele werden mit ihr verbunden? Welche Bedingungen müssen für Rüstungskontrolle gegeben sein? Wie und wann geht’s mit ihr weiter? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Wahlen in Österreich, Drohnenregeln in der Bundeswehr, der Marine im Mittelmeer und einer Nukleardoktrinänderung in Russland. Feedback zur letzten Folge: 00:02:14 Theorie: 00:13:00 Rüstungskontrolle: 00:47:46 Fazit: 01:30:17 Sicherheitshinweise: 01:33:10 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Theorie und Praxis Gert Krell 2023: Theorien in den Internationalen Beziehungen, in: Staack, Michael: Einführung in die Internationale Politik – Studienbuch, DrGruyter, 27-76. (Abschnitt 2: Der Krieg Russlands gegen die Ukraine aus der Sicht der IB-Theorie, 55-69). Stephen Walt 1998: International Relations: One World, Many Theories, in: Foreign Policy Nr. 110, 29-34. Sabine Fischer 2023: Die chauvinistische Bedrohung: Russlands Kriege und Europas Antworten. Econ. Janice Gross Stein 2023: Escalation Management in Ukraine: “Learning by Doing” in Response to the “Threat that Leaves Something to Chance”, in: Texas National Security Review 6 (3), 29-50. Richard Ned Lebow 2022: International Relations Theory and the Ukrainian War, in: Analyse&Kritik 44 (1), 111-135. Joseph S. Nye Jr. 2008: International Relations: the Relevance of Theory to Practice, in: Christian Reus-Smit and Duncan Snidal (Hrsg.): Oxford Handbook of International Relations. Oxford University Press, 648-660. Alexander Wendt 1992: Anarchy is what States Make of it: The Social Construction of Power Politics, in: International Organization 46 (2), 391-425. Thema 2: Rüstungskontrolle Gustav Gressel, Under the gun: Rearmament for arms control in Europe, ECFR, 28 November 2018 Rosert, Elvira/Sauer, Frank 2023: Dilemma mit Streuwirkung, in: die tageszeitung, No. 37, 22.07.2023, 15. Rosert, Elvira/Sauer, Frank 2021: How (not) to stop the killer robots: A comparative analysis of humanitarian disarmament campaign strategies, in: Contemporary Security Policy 42 (1): 4-29. Sauer, Frank 2020: Konventionelle Rüstungskontrolle und neue Technologien, in: Metis Studien Nr. 19, September 2020. Thomas C. Schelling and Morton H. Halperin 2014 (1961): Strategy and Arms Control. Thomas C. Schelling 1966: Arms and Influence, New Haven, CT. Thomas C. Schelling 1979 (1960): The Strategy of Conflict, Cambridge, MA. Justinas Žilinskas, When Security Prevails: Lithuania Votes to Withdraw from the Convention on Cluster Munitions, Lieber Institute, West Point, 13.08.2024. Auswaertiges Amt, Bericht der Bundesregierung zum Stand der Bemühungen um Rüstungskontrolle, Abrüstung und Nichtverbreitung sowie über die Entwicklung der Streitkräftepotenziale für das Jahr 2023 (Jahresabrüstungsbericht 2023). Sicherheitshinweise: Carlo: Steigt Österreich aus dem ESSI aus? Frank: Russland ändert seine Nukleardoktrin, http://kremlin.ru/events/president/news/75182 Rike: Einsatzgrundsätze für Drohnen? Fehlanzeige, https://augengeradeaus.net/2022/04/parlamentarier-billigen-drohnen-bewaffnung-fuer-die-bundeswehr-unter-strengen-auflagen/ Thomas: Deutsche Fregatte ‚Hamburg‘ im Mittelmeer im Einsatz mit US-Docklandungsschiff Social Media Gedöns: Sicherheitspod Twitter: @Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Blue Sky: @sicherheitspod.bsky.social Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Skeet: @rikefranke.bsky.social Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Skeet: @drfranksauer.bsky.social Carlo Tweet: @CarloMasala1 Skeet: @carlomasala1.bsky.social Carlo tröötet nicht. Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Skeet: @twiegold.bsky.social Ähnliche Beiträge Folge 3: Nukleare Rüstungskontrolle, europäische Verteidigung 29. August 2018 in Podcast Folge #83 LIVE „Was wäre, wenn…“ – Trump, die NATO und europäische Atomwaffen. Wie wehrhaft sind wir? 21. April 2024 in Allgemein Folge #66 Wozu gibt es Militärseelsorge? | Ukraine: Der 2023-Vorausschau-Versuch | Buchempfehlungen 21. Dezember 2022 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
