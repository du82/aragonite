full_description = "Folge 47: Das Afghanistan-Desaster: Wie konnte das passieren? Wie weiter mit Deutschlands und Europas Verantwortung? 26. August 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 47 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala natürlich nur über die aktuellen Entwicklungen in Afghanistan. Die Diskussion der vier Podcaster orientiert sich dabei an vier Fragen: Wie kam es zur chaotischen Situation am Flughafen von Kabul? Könnte Europa ohne die USA dort eigentlich überhaupt (weiter) operieren? Was beudetet das Debakel für zukünftige Einsätze der Bundeswehr? Was bedeutet es für die Glaubwürdigkeit des Westens und die Geopolitik in der Region? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit neuer besorgniserregender Instabilität in Nordafrika, Corona-Impflicht bei US-Streitkräften und Bundeswehr, neuen Überwachungsballons und – mal wieder – dem nuklear angetriebenen Marschflugkörper Russlands. Afghanistan: 00:02:53 Sicherheitshinweise: 00:59:42 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema – Afghanistan: Operation Enduring Clusterfuck Folge #43 Afghanistan – was bleibt? https://sicherheitspod.de/2021/05/09/folge-43-afghanistan-was-bleibt-zukunftige-auslandseinsatze-koalitionen-der-willigen-keine-option/ Special Inspector General for AfghanistanReconstruction, Berichte: https://www.sigar.mil/ Helene Bubrowski und Peter Carstens, Die vielen Schichten der Wahrheit, FAZ, 25.08.2021, https://www.faz.net/aktuell/politik/inland/kritik-am-bnd-die-vielen-schichten-der-wahrheit-17501340.html Sami Sadat, I Commanded Afghan Troops This Year. We Were Betrayed, New York Times, 25.