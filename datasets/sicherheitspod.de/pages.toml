full_description = "Folge 29: „Die Welt ist fertig!“ Endet die Hegemonie der USA? | Frieden und/oder Sicherheit? 5. Juni 202017. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 29 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold über die Vormachtstellung der USA im internationalen sicherheitspolitischen Gefüge, die aktuellen Anzeichen für Wandel und die Konsequenzen für Europa. Im zweiten Teil diskutieren wir den Unterschied zwischen Friedens- und Sicherheitslogik und fragen sich, ob Sicherheitshalber ein bisschen mehr Friedenshalber gut tun würde. Abschließend dann wie immer der Sicherheitshinweis, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem Buch- und einem Serientipp (ja, die Zeiten schreien nach Ablenkung), dem Aufstand der Anständigen (Militärangehörigen) in den USA und der Verschärfung des Soldatengesetzes in Deutschland. Sicherheitshalber · #29 „Die Welt ist fertig!“ Endet die Hegemonie der USA? | Frieden und/oder Sicherheit? Thema 1: „Die Welt ist fertig!“, oder: Endet die Hegemonie der USA? 00:03:11 Thema 2: Frieden und/oder Sicherheit 00:45:00 Sicherheitshinweise: 01:08:18 Grimme Online Award Publikumspreis: https://w1.grimme-online-award.de/goa/voting/ext_voting.pl Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – „Die Welt ist fertig!“, oder: Endet die Hegemonie der USA? Deichkind: Die Welt ist fertig (aus dem Album “Niveau Weshalb Warum”) https://www.youtube.com/watch?v=N3152Ji61WU SIPRI Daten zu weltweiten Militaerausgaben https://www.sipri.org/media/press-release/2020/global-military-expenditure-sees-largest-annual-increase-decade-says-sipri-reaching-1917-billion IISS Military Balance https://www.iiss.org/publications/the-military-balance New York Times, Pentagon Eyes Africa Drawdown as