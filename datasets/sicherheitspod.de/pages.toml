["https://sicherheitspod.de/2022/09/15/folge-62-krieg-in-der-ukraine-was-heist-eigentlich-gewinnen-landminen-welche-warum-verboten-sind"]
title = "Folge #62 Krieg in der Ukraine: Was heißt eigentlich “gewinnen”? | Landminen: welche warum verboten sind – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #62 Krieg in der Ukraine: Was heißt eigentlich “gewinnen”? | Landminen: welche warum verboten sind 15. September 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 62 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zunächst über den Krieg in der Ukraine. Schon lange vor den erstaunlichen militärischen Erfolgen der Ukraine vom Wochenende entstand eine Diskussion darum, dass – oder ob – die Ukraine “gewinnen” müsse. Aber was heißt das eigentlich – “gewinnen”? Welche Szenarien sind aktuell vorstellbar, und welche Variablen sind ausschlaggebend? Auch die Möglichkeit, dass die westliche Unterstützung nachlässt, weil die Ukraine womöglich “zu erfolgreich” ist und Putin “gedemütigt” werden könnte, kommt zur Diskussion. Im zweiten Teil wenden die vier Podcaster sich dem Thema Landminen zu. Diese sollen in der Ukraine unter anderem mit deutscher Hilfe gesucht und entfernt werden. Aber welche Minen gibt es eigentlich – und warum sind manche verboten, andere aber nicht? Abschließend dann wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit traurigen royalen Nachrichten (#StreitkräfteUndKönigshäuser), einer neuen nordkoreanischen Nukleardoktrin, einem Ausblick auf die italienischen Wahlen und den aktuellen Irrungen und Wirrungen in Mali. “Gewinnen”: 00:04:10 Landminen: 00.54:35 Fazit: 01:11:16 Sicherheitshinweise: 01:12:55 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Was heißt “gewinnen”? Interview mit Bundeskanzler Olaf Scholz in den Tagesthemen, ARD, 31.5.2022 Interview mit Friedrich Merz, Welt, 17.06.2022 Interview mit Carlo (Video), Jung & Naiv, 05.09.2022 Interview mit Bundeskanzler Olaf Scholz in der FAZ, bundesregierung.de, 07.09.2022 Interview mit Dr. Claudia Major, Spiegel, 08.09.2022 Interview mit Frank, stern, 09.09.2022 Marc A. Thiessen. Biden is not fighting to win in Ukraine. Washington Post, 31.3.22 Francis Fukyama. Why Ukraine Will Win, Journal of Democracy, September 2022. Gustav Gressel, Rafael Loss, Jana Puglierin. The Leopard plan: How European tanks can help Ukraine take back its territory, ECFR, 09.09.2022 Thema 2 – Landminen Human Rights Watch. Background Briefing on Landmine Use in Ukraine, 15.06.2022 Auswärtiges Amt. VN-Waffenübereinkommen Convention on Certain Conventional Weapons (CCW): Antifahrzeugminen (Mines Other Than Anti-Personnel Mines, MOTAPM) Auswärtiges Amt. Ottawa Übereinkommen (ENG/DEU). Elvira Rosert, Frank Sauer. 2020. How (not) to stop the killer robots: A comparative analysis of humanitarian disarmament campaign strategies. Contemporary Security Policy 42:1, 4-29. Thomas Wiegold, USA kehren zum Verbot von Anti-Personen-Minen zurück (außer in Korea), Augen geradeaus!, 21.06.2022 Thomas Wiegold, Trump verfügt Rückkehr der Anti-Personen-Minen, Augen geradeaus!, 01.02.2020 Thomas Wiegold, Claymore goodbye? USA verzichten auf neue Antipersonen-Minen, Augen geradeaus!, 27.06.2014 Landmine and Cluster Munition Monitor (Monitoring progress in eliminating landmines, cluster munitions, and other explosive remnants of war) “Hero Rats” – Ratten in der Landminen-Suche Sicherheitshinweise: Rike: Neue Premierministerin und ein neuer König im Vereinigten Königreich. Frank: Nordkoreas neue Nukleardoktrin https://www.nytimes.com/2022/09/09/world/asia/north-korea-kim-weapons-law.html Carlo: Neuwahlen in italien (25. September 2022) https://foreignpolicy.com/2022/08/10/italy-election-russia-ukraine-nato-war-putin-salvini-meloni-berlusconi-populist-right/ Thomas: Situation in Mali – Weiter Spannungen zwischen Regierung in Bamako und Nachbarländern, dem Westen und MINUSMA absehbar