full_description = "Folge 37: Atomwaffen jetzt verboten – oder nicht? | Materiallage der Bundeswehr: No bang for your buck? 12. Dezember 202017. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 37 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über den neuen Atomwaffenverbotsvertrag, der am 22. Januar 2021 in Kraft treten wird. Was der neue Vertrag bezweckt, wie er sich zum bestehenden nuklearen Nichtverbreitungsregime verhält, was er mittel- und langfristig bewirken kann – all diese Fragen stehen zur Debatte. Und es herrscht zwischen den vier Podcastern natürlich (oh Wunder!) keine Einigkeit. Im zweiten Teil widmen diese sich der ewigen Beschaffungsmisere bei der Bundeswehr. Sollte nicht, jetzt da mehr Geld ausgegeben wird, so langsam bei den Flugzeugen, Hubschraubern, Schiffen und Fahrrädern mal alles besser werden? Denkste! Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit einem Pleite gegangenen deutschen Drohnenhersteller, der Rolle rückwärts der SPD in Sachen Drohnenbewaffnung, dem neuen designierten US-Verteidigungsminister und einem IT-Sicherheits-Plädoyer gegen das Horten von Software-Schwachstellen und das Aufweichen von Verschlüsselung. Sicherheitshalber · #37 Atomwaffen jetzt verboten – oder nicht? | Materiallage der Bundeswehr: No bang for your buck? Atomwaffenverbotsvertrag: 00:02:30 Beschaffung bei der Bundeswehr: 00:54.10 Sicherheitshinweise: 01:28:48 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Atomwaffenverbotsvertrag Rede von Präsident Obama in Prag 2009 https://obamawhitehouse.archives.gov/the-press-office/remarks-president-barack-obama-prague-delivered Frank Saue