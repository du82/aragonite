full_description = "Empfehlungen Wir werden immer mal wieder gefragt, welche thematisch einschlägigen Podcasts wir selbst so hören. Außerdem ist es inzwischen fast gute Tradition bei uns, ab und an Bücher (und zwar nicht zwingend thematisch einschlägig und sowohl Unterhaltungslektüre als auch Sachbücher) zu benennen, die wir den HörerInnen empfehlen möchten. Rike war so nett, das hier mal initial zusammenzutragen. Wir aktualisieren das fortlaufend. Bücher Rike Fiction Anais Llobet: Au café de la ville perdue Sylvain Neuvel: A history of what comes next Ada Palmer: Too Like the Lightning, 2016 Omar El Akkad: American War Kathleen McInnes, The Heart of war: Misadventures in the Pentagon Robert Heinlein: The Moon is a harsh Mistress (… in verschiedenen deutschen Übersetzungen erschienen: Revolte auf Luna. Heyne, 1969, Mondspuren. Heyne, 2014) Tom Hillenbrand: Drohnenland & Hologrammatica Neal Stephenson: Seveneves Non-Fiction Tracy Walder: The Unexpected Spy, 2021 Sarah Brockmeier und Philipp Rotmann: Krieg vor der Haustür. Die Gewalt in Europas Nachbarschaft und was wir dagegen tun können Sarah E. Kreps: Drones: What Everyone Needs to Know Joseph de Weck: Emmanuel Macron: Der revolutionäre Präsident Frank Fiction Kim Stanley Robinson: New York 2140 Andy Weir: The Martian & Project Hail Mary Nora Bossong: Schutzzone Don Winslow: Satori Marc-Uwe Kling: QualityLand Jeffrey Lewis: The 2020 Commission Report on the North Korean Nuclear Attacks Against the United States: A Speculative Novel Martha Wells: The Murderbot Diaries (All Systems Red, Artificial Condition, Rogue Protocol, Exit Strategy) Non-Fiction Anil Seth 2021: Being You: A New Science of Consciousness. David Graeber, David Wengrow: The Dawn of Everything: A New History of Humanity, 2021 Stuart Russell: Human Compatible: Artificial Intelligence and the Problem of Control Paul Scharre: Army of None: Autonomous Weapons and the Future of War Carlo Fiction Don Winslow: City on Fire, Harper Collins 2022 S.A. Cosby: B