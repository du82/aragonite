full_description = "Folge #74 Auch wenn es weh tut: Wir müssen unseren nuklearen IQ erhöhen | Bunker: Äh, brauchen wir die? 25. Juli 202317. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 74 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst über Nuklearwaffen: Welche Länder haben welche – und wie viele? Was macht Nuklearwaffen so besonders? Wie und wann funktioniert nukleare Abschreckung? Was ist das nukleare Tabu? Wie steht es um die nukleare Rüstungskontrolle? Welche Rolle spielen diese Waffen mit Blick auf Russlands Krieg gegen die Ukraine? Welche zukünftigen Entwicklungen zeichnen sich ab? Alles, was in dieser “Druckbetankung” nicht vorkommt – etwa ein genauerer Blick auf den neuen Atomwaffenverbotsvertrag und auf die nukleare Teilhabe – war in vorangegangenen Episoden bereits Thema. Die entsprechenden Links dazu finden sich in den Shownotes (siehe unten). Im zweiten Teil sprechen die vier Podcaster mit Mirko Krumm – aka Bunkerratte – über Bunker und Schutzräume. Was gab es im Kalten Krieg? Wie sinnvoll war das überhaupt? Was wäre heute nötig, auch mit Blick auf Zivilschutz bei Katastrophenlagen durch Blackouts oder Extremwetterereignisse? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit dem Export türkischer Bayraktar-Drohnen, der Bundeswehr-Beteiligung an einer Übung in Australien, der Misere rund um afghanische Ortskräfte sowie, erstmals, einer Diskussion zum Thema KI im VN-Sicherheitsrat. Der Sicherheitspod geht damit in die wohlverdiente Sommerpause! Nuklearer IQ: 00:03:07 Bunker: 00:54:20 Fazit: 01:18:55 Sicherheitshinweise: 01:20:16 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Mastodon: mastodontech.de/@Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1: Nuklearer IQ Bulletin of the Atomic Scientists. Nuclear Notebook. 2023 Frank Sauer. Nukleare Abschreckung Theorie, Grenzen und Kritik. Bundeszentrale für politische Bildung, 06.05.2022 Frank Sauer. Atomic Anxiety – Deterrence, Taboo and the Non-Use of U.S. Nuclear Weapons. Palgrave Macmillan. 2015 Future of Life Institute. Artificial Escalation. Youtube. 2023 Sicherheitshalber… nochmal nachhören: Folge 27: Nukleare Teilhabe Folge 37: Atomwaffen jetzt verboten – oder nicht? Thema 2: Bunker Unser Gast: Mirko Krumm, Vorsitzender des Vereins Warnamt II e.V. , Twitter: @bunkerratte Zur Geschichte und Bedeutung der Warnämter Das ODL-Messnetz des Bundesamtes für Strahlenschutz Sicherheitshinweise: Carlo: Teilnahme Deutsches Heer an einer US-Australischen Übung in Australien – https://twitter.com/bundeswehrinfo/status/1683025453924139010?s=61&t=FwabSP2PnOlBbUXe8Ab5HQ Thomas: Patenschaftsnetzwerk afghanische Ortskräfte – https://www.patenschaftsnetzwerk.de/ Frank: Der VN-Sicherheitsrat debattiert erstmals Künstliche Intelligenz – https://press.un.org/en/2023/sc15359.doc.htm Rike: Türkische Bayraktar TB2 Drohnen verkaufen sich weltweit – https://www.reuters.com/business/aerospace-defense/kosovo-buys-turkish-bayraktar-drones-2023-07-16/ Unsere Twitter- und Mastodon-Handles: Rike Tweet: @RikeFranke Trööt: bagarrosphere.fr/@rikefranke Frank Tweet: @drfranksauer Trööt: mastodontech.de/@drfranksauer Carlo Tweet: @CarloMasala1 Thomas Tweet: @thomas_wiegold Trööt: berlin.social/@twiegold Ähnliche Beiträge Folge 52: Die Ukraine-Krise und ihr Kontext | Dieses “FCAS”… äh, brauchen wir das? | Buchempfehlungen 31. Dezember 2021 in Allgemein Folge #83 LIVE „Was wäre, wenn…“ – Trump, die NATO und europäische Atomwaffen. Wie wehrhaft sind wir? 21. April 2024 in Allgemein Folge 49: Mali, wir müssen reden | US-Nuklearwaffen und “sole purpose”: Politikwechsel mit Auswirkungen? 13. Oktober 2021 in Allgemein Veröffentlicht in Allgemein Veröffentlicht von sicherheitspod Zeige alle Beiträge von sicherheitspod"
