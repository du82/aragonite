description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #57 Die überschätzten russischen Streitkräfte: Fehlersuche | Waffenlieferungen: Pro & Contra 23. April 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 57 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala mit Gustav Gressel, dem ersten “returning guest”. Er ist Senior Policy Fellow am ECFR und war in Folge #26 schon mal im Podcast, um über die Modernisierung der russischen Streitkräfte zu sprechen. Seit Kriegsbeginn in der Ukraine wissen wir, dass die russischen Streitkräfte deutlich weniger leistungsfähig sind als erwartet. Sicherheitshalber Fehlersuche! Wie haben wir uns so täuschen können? Im zweiten Teil wenden die vier Podcaster sich der seit Tagen die Schlagzeilen beherrschenden Diskussion um die Lieferung “schwerer Waffen” in die Ukraine zu. Sie prüfen systematisch die wesentlichen Argumente und fragen: Will Deutschland nicht? Oder kann Deutschland nicht? Oder beides? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit französischen Artillerielieferungen in die Ukraine, einer neuen Drohne bzw. “loitering munition”, einem echten IT-Sicherheitshinweis für alle, die ein Lenovo-Notebook besitzen und Desinformation mit Blick auf Mali. Sicherheitshalber · #57 Die überschätzten russischen Streitkräfte: Fehlersuche | Waffenlieferungen: Pro & Contra Russlands Streitkräfte: 00:03:08 Waffenlieferungen: 00:40:13 Fazit: 01:11:32 Sicherheitshinweise: 01:12:34 Web: https://sicherheitspod.de/ Shop: https://sicherheitshalbershop.myspreadshop.de/ Twitter: https://twitter.com/Sicherheitspod Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Russlands Streitkräfte Unser Gesprächspartner: Dr. Gustav GresselSenior Policy Fellow, European Council on Foreign Relat