full_description = "Folge 39: Die (umstrittene) Rolle privater Militärdienstleister | Zivilklauseln an Universitäten: Pro&Con 30. Januar 202117. Februar 2025 ~ sicherheitspod „Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 39 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala über private Sicherheits- und Militärdienstleister. Wieso und womit werden diese Unternehmen beauftragt? Wo liegen die Probleme? Im zweiten Teil diskutieren die vier Podcaster die sogenannte Zivilklausel, mit denen zahlreiche deutsche Universitäten sicherstellen wollen, dass Forschung allein friedlichen Zwecken dient. Wissenschaft jedweder Art muss ihrer gesellschaftlichen Verantwortung stellen – aber sind Zivilklauseln das richtige Instrument dafür? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit Neuigkeiten zum Abzug der USA aus Afghanistan, zur Finanzierung des FCAS-Projektes, zur Verlängerung des NewSTART Rüstungskontrollvertrags sowie zum “Update” der französischen nationalen Sicherheitsstrategie. Sicherheitshalber · #39 Die (umstrittene) Rolle privater Militärdienstleister | Zivilklauseln an Universitäten: Pro&Con Private Militärdienstleister: 00:01:48Zivilklausel: 00:40:12Sicherheitshinweise: 01:05:56 Web: https://sicherheitspod.de/Shop: https://shop.spreadshirt.de/sicherheitshalbershopPatreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – PMCs Troop levels are down, but US says over 18,000 contractors remain in Afghanistan, Stars&Stripes, 19.01.2021,https://www.stripes.com/news/middle-east/troop-levels-are-down-but-us-says-over-18-000-contractors-remain-in-afghanistan-1.659040 Blackwater’s Bullets Scarred Iraqis. Trump’s Pardon Renewed the Pain, New York Times, 23.12.2020,https://www.nytimes.com/2020/12/23/world/middleeast/blackwa