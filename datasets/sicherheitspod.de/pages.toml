full_description = "Folge 20: Raketen, Raketen, Raketen, und Macron, AKK und NATO 21. November 201917. Februar 2025 ~ sicherheitspod Sicherheitshalber ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 20 sprechen Ulrike Franke, Frank Sauer, Carlo Masala und Thomas Wiegold zuerst mit dem aus Kalifornien zugeschalteten Fabian Hinz, der Politikwissenschaft mit Islamwissenschaft zu Raketenwissenschaft kombiniert und am Beispiel des Iran erläutert, wie Raketen und dazugehörige Technologie sich verbreiten und warum das sicherheitspolitisch brisant ist. Danach wenden die vier Podcaster sich dem aktuellen Trubel rund um die NATO zu – Carlo und Rike streiten sich hingebungsvoll über Macrons “Hirntod”-Diagnose und Frank kann zum Schluss nur mit Mühe das Gespräch doch nochmal in Richtung AKKs Grundsatzrede lenken. (Ich bin während all dem übrigens ganz dolle krank.) Am Ende steht wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit neuen Drohnen, alten UN-Debatten, dem GI auf Twitter und Störungen des GPS-Signals. Thema #1: 00:02:00 Thema #2: 00:36:57 Sicherheitshinweise: 01:10:00 Unser Shop: https://shop.spreadshirt.de/sicherheitshalbershop/ Und natürlich: Sicherheitshalber LIVE in der Urania in Berlin am 23. Januar 2020 – Karten hier Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Iranisches Raketengeflüster (mit Gast Fabian Hinz) Fabian Hinz, Research Associate, James Martin Center for Nonproliferation Studies (CNS), Middlebury Institute of International Studies (Monterey, CA) Twitter: @fab_hinz Web: https://www.nonproliferation.org/experts/fabian-hinz/ Arms Control Wonk Podcast: https://www.armscontrolwonk.com/ Raniah Salloum: Deutscher Praktikant entdeckt geheimes Raketenprogramm, in: Der Spiegel, 06. Juli 2018 https://www.spiegel.de/plus/iran-deutscher-praktikant-entdeckt-geheimes-raketenprogramm-a-00000000-0002