full_description = "Folge 40: Flugzeugträger: Braucht man sowas noch? | Deutschland im UN-Sicherheitsrat: Eine Bilanz 21. Februar 202117. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 40 klären Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zuerst, was eigentlich ein Flugzeugträger – Verzeihung, eine Flugzeugträgerkampfgruppe! – ist, um sich daraufhin zu fragen: Braucht man die noch oder können die weg? Im zweiten Teil ziehen die vier Podcaster Bilanz mit Blick auf den Sitz im UN-Sicherheitsrat, den Deutschland in den letzten zwei Jahren innehatte. Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal zum Knirschen im FCAS-Gebälk, zu unter Trump nicht beförderten US-Generalinnen, zum Afghanistanabzug und zu einem französischen U-Boot. Flugzeugträger: 00:03:54 Sicherheitsrat: 00:44:24 Fazit: 01:13:56 Sicherheitshinweise: 01:16:00 Web: https://sicherheitspod.de/ Shop: https://shop.spreadshirt.de/sicherheitshalbershop Patreon: https://www.patreon.com/sicherheitspod Erwähnte und weiterführende Interviews, Literatur und Dokumente: Thema 1 – Flugzeugträger KORREKTUR: Uns ist bei diesem Thema ein Fehler unterlaufen, auf den uns aufmerksame Hörer hingewiesen haben: Wir hatten gesagt, dass europäische Staaten in den vergangenen 30 Jahren keine Flugzeugträger in Kampfoperationen eingesetzt hätten. Tatsächlich hatte Frankreich im Kampf gegen die Terrororganisation IS zwischen Dezember 2015 und Februar 2016 den Flugzeugträger Charles de Gaulle in den Persischen Golf entsandt; von diesem Schiff wurden Einsätze gegen den IS geflogen. Teil des Trägerverbandes war damals die deutsche Fregatte Augsburg:https://augengeradeaus.net/2015/12/kampf-gegen-isis-charles-de-gaulle-und-augsburg-im-persischen-golf/ Michaela Wiegel, Frankreichs 42.000 Tonnen Diplomatie, FAZ, 02.02.2021 https://www.faz.net/aktuell/politik/ausland/besuch-auf-franzoesischem-flugzeugtraeger-charles-de-gaulle-17171577.html Jonathan Beale, The UK’s giant aircraft carriers, BBC https://www.bbc.co.uk/news/resources/idt-sh/UK_aircraft_carriers Thomas Newdick, All You Need To Know About Italy’s F-35 Carrier That Just Arrived In The US, The War Zone, 15.02.2021, https://www.thedrive.com/the-war-zone/39262/all-you-need-to-know-about-italys-f-35-carrier-that-just-arrived-in-the-us Annegret Kramp-Karrenbauer, Europa richtig machen, Welt am Sonntag, 10.03.2019 (AKK schlägt Europäischen Flugzeugträger vor), https://www.cdu.de/artikel/europa-richtig-machen-getting-europe-right Augen geradeaus!: AKKs Antwort auf Macron: Für einen europäischen Flugzeugträger (m. Merkel-Zitat), 11.03.2019, https://augengeradeaus.net/2019/03/akks-antwort-auf-macron-fuer-einen-europaeischen-flugzeugtraeger/comment-page-1/ Brock Vergakis, Navy Installs First Drone Command Center aboard Aircraft Carrier, Military.com, 22.04.2016. https://www.military.com/daily-news/2016/04/22/navy-installs-first-drone-command-center-aircraft-carrier.html Björn Müller, Militärmacht auf dem Weg ins Abseits, FAZ, 30.07.2017, https://www.faz.net/aktuell/politik/ausland/grossbritanniens-armee-plaene-militaermacht-auf-dem-weg-ins-abseits-15124514-p2.html Björn Müller, Schwenk nach Asien: Europäische Flugzeugträger im Pazifik, FAZ, 28.01.2019, https://www.faz.net/aktuell/politik/ausland/europaeische-flugzeugtraeger-im-pazifik-schwenk-nach-asien-16007724.html?printPagedArticle=true#pageIndex_2 Loren Thompson, Ten Reasons A U.S. Navy Aircraft Carrier Is One Of The Safest Places To Be In A War, 21.05.2019, https://www.forbes.com/sites/lorenthompson/2019/05/21/ten-reasons-a-u-s-navy-aircraft-carrier-is-one-of-the-safest-places-to-be-in-a-war/?sh=349500f82f7a Günther Stiller, Das Zielfoto, das einen US-Admiral wütend machte, Hamburger Abendblatt, 08.08.2007, https://www.abendblatt.de/politik/ausland/article107314674/Das-Zielfoto-das-einen-US-Admiral-wuetend-machte.html Christopher McFadden, Will Aircraft Carriers Soon Be a Technology of the Past?, 04.10.2020, https://interestingengineering.com/will-aircraft-carriers-soon-be-a-technology-of-the-past David Ottenheimer, The Future-Future of Aircraft Carriers, 01.02.2021, https://securityboulevard.com/2021/02/the-future-future-of-aircraft-carriers/ Vergleichsdiagramm Flugzeugträger: https://en.wikipedia.org/wiki/File:World_Navy_Aircraft_carries_chart.svg Thema 2 – Sicherheitsrat Auswärtiges Amt, Über 100 Resolutionen später: Rückblick auf zwei Jahre im UN-Sicherheitsrat, 23.12.2020, https://www.auswaertiges-amt.de/de/aussenpolitik/internationale-organisationen/uno/07_Sicherheitsra Auswärtiges Amt, Resolution 2467: Sexuelle Gewalt in Konflikten beenden, 24.04.2019, https://www.auswaertiges-amt.de/de/aussenpolitik/internationale-organisationen/uno/resolution-2467/2212904 Interview mit Botschafter Christoph Heusgen, Tagesschau: Deutschland im UN-Sicherheitsrat „Mühsam, Veränderungen reinzubringen“, 30.12.2020, https://www.tagesschau.de/ausland/un-sicherheitsrat-deutschland-103.html Johannes Leithäuser, Das ist Deutschlands Bilanz im Sicherheitsrat, FAZ, 25.12.2020, https://www.faz.net/aktuell/politik/ausland/deutschland-und-un-fleisskaertchen-im-sicherheitsrat-17115004.html Deutschland.de, Engagement für Verständigung, 10.12.2020, https://www.deutschland.de/de/topic/politik/un-sicherheitsrat-und-deutschland-aussenminister-zieht-bilanz Julian Borger, Curtains opened on UN security council for first time since attack on Che Guevara, 05.04.2019, Guardian, https://www.theguardian.com/world/2019/apr/04/un-security-council-curtains-germany-che-guevara Richard Gowan, Schlaglicht: Deutschlands Amtszeit im UN-Sicherheitsrat 2019/20, FES, 07.01.2021 https://www.fes.de/themenportal-die-welt-gerecht-gestalten/artikel-in-die-welt-gerecht-gestalten/schlaglicht-deutschlands-amtszeit-im-un-sicherheitsrat-2019-20 Sicherheitshinweise Frank: Bei FCAS knirscht es https://w