title = "Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende – Sicherheitspod"
description = "Der Podcast zur Sicherheitspolitik"
full_description = "Folge #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende 9. April 202217. Februar 2025 ~ sicherheitspod “Sicherheitshalber” ist der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt. In Folge 56 sprechen Thomas Wiegold, Ulrike Franke, Frank Sauer und Carlo Masala zunächst mit Rüdiger Bachmann. Er ist Ökonom an der University of Notre Dame (Indiana, US) und hat jüngst mit acht KollegInnen ein Papier verfasst, das für einiges Aufsehen gesorgt hat. Es argumentiert, ein sofortiger Importstopp für russische Energie sei für die deutsche Volkswirtschaft verkraftbar. Nicht zuletzt Bundeskanzler Olaf Scholz war nicht amüsiert. Die Diskussion mit Rudi berührt nicht nur die Chancen und Herausforderungen beim Modellieren volkswirtschaftlicher Prozesse, sondern auch die ökologischen Folgekosten und politischen Aspekte der “Gasfrage”. Außerdem die Frage, ob und wie die Sanktionen gegen Russland eigentlich wirken. Im zweiten Teil wenden die vier Podcaster sich der Zeitenwende mit Blick auf die Bundeswehr zu. Wofür und wie gibt man die 100 Mrd. EUR effektiv aus (sofern der Bundestag das Sondervermögen denn wirklich beschließt)? Welche Beschaffungsprozesse und -strukturen müssen reformiert werden? Und ist “Zeitenwende” nicht noch viel mehr als nur ein steigender Wehretat? Abschließend wie immer der “Sicherheitshinweis”, der kurze Fingerzeig auf aktuelle, sicherheitspolitisch einschlägige Themen und Entwicklungen – diesmal mit dem wohl bevorstehenden Beitritt Finnlands und Schwedens zur NATO, russischen Cyberoperationen zu Beginn des Ukraine-Krieges, der Lage in Mali und *TROMMELWIRBEL* bewaffneten Drohnen für die Bundeswehr. Außerdem: Neugeborene Babys sind sehr klein! Sicherheitshalber · #56 Die Gasfrage: Importstopp für russische Energie jetzt? | Die Ukraine und die Zeitenwende Gas: 00:03:19 Zeitenwende: 00:57:55 Fazit: 01:31:45 Sicherheitshinweise: 01:32:44 Web: https://sicherheitspod.de/ Shop