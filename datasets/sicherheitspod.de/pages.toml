full_description = "Folge 3: Nukleare Rüstungskontrolle, europäische Verteidigung 29. August 201817. Februar 2025 ~ sicherheitspod Sicherheitshalber, der Podcast zur sicherheitspolitischen Lage in Deutschland, Europa und der Welt, mit Folge 3: Ulrike Franke vom European Council on Foreign Relations (ECFR), Carlo Masala und Frank Sauer von der Universität der Bundeswehr München und Thomas Wiegold diskutieren in der Ko-Produktion von ECFR und Augen geradeaus! diesmal zwei grundsätzliche Themen: • Wie sieht es derzeit aus mit der Rüstungskontrolle der Nuklearwaffen (Spoiler: nicht so gut) und was bedeutet das für die deutsche und europäische Sicherheit? • Ab Minute 40:50: Wie steht es um die europäische Verteidigung und was soll die viel beschworene “strategische Autonomie” Europas eigentlich sein? In der Diskussion erwähnte und weiterführende Literatur und Dokumente: Nukleare Rüstungskontrolle Hans M. Kristensen & Robert S. Norris (2018) United States nuclear forces, Bulletin of the Atomic Scientists, 74:2, 120-131, doi.org/10.1080/00963402.2018.1438219 Hans M. Kristensen & Robert S. Norris (2018) Russian nuclear forces, Bulletin of the Atomic Scientists, 74:3, 185-195, doi.org/10.1080/00963402.2018.1462912 Oliver Meier (2017) Die Zukunft der nuklearen Abrüstung, Rüstungskontrolle und Nichtverbreitung: Was kommt nach Obamas Ordnungsversuch? in: Hanns Maull (Hg.) Auflösung oder Ablösung? Die internationale Ordnung im Umbruch, S. 35-54, www.swp-berlin.org/fileadmin/conte…_hg.pdf#page=37 Oliver Meier (2017) Vereinte Nationen beschließen Atomwaffenverbot. Ein neuer Vertrag spaltet die Staatenwelt, bietet aber auch Chancen zur Abrüstung, SWP-Aktuell 2017/A 54, www.swp-berlin.org/fileadmin/conte…2017A54_mro.pdf Arms Control Wonk Blog (www.armscontrolwonk.com/) & Arms Control Wonk Podcast (itunes.apple.com/us/podcast/arms-…id872594726?mt=2) Strategische Autonomie & Europäische Verteidigung Heiko Maas (2018) Für eine balancierte transatlantische Partnerschaft, Handelsblatt, 2