["https://sideways-view.com/2018/08/25/solving-avalon-with-whispering"]
title = "Solving Avalon with whispering – The sideways view"
description = "I've been playing some Avalon recently, and became curious about winning probabilities under perfect play.  (Avalon is the most common variant of The Resistance, rules are here, this post probably won't be interesting if you haven't played.) In this post I consider the version of the game where players are able to send secret messages…"
full_description = "Solving Avalon with whispering Posted on August 25, 2018September 19, 2018 by paulfchristiano I’ve been playing some Avalon recently, and became curious about winning probabilities under perfect play. (Avalon is the most common variant of The Resistance, rules are here, this post probably won’t be interesting if you haven’t played.) In this post I consider the version of the game where players are able to send secret messages to one another (“whisper”). Most groups I’ve played with use rules such that whispering possible if players are sufficiently determined and patient. Some groups make whispering overtly legal and a smaller number have strict norms against things like winking. With whispering and Merlin, I show that the good team can always pass 3 quests without leaking any information about Merlin. Without Merlin, I show that whispering doesn’t matter and compute all the victory probabilities. I don’t consider Mordred or the lady of the lake (other roles don’t affect the analysis). For groups that make whispering possible but difficult, this implies that the whole game hinges on the question “can you successfully whisper?” For players who don’t enjoy this aspect of the game, it may be worth either allowing whispering explicitly (and making the game more difficult for good players by adding other roles) or disallowing whispering altogether (and making the game easier for good players). For players who do enjoy this aspect of the game, they could also consider the following simpler game between Alice, Bob, and Eve: Alice has a secret, she wants Bob to learn it without leaking it to Eve. It’s a classic. You can play this game under whatever informal rules about whispering you normally play Avalon, and if Alice and Bob can reliably win at this game then they can reliably win at Avalon using modestly more time. The version of Avalon with no private communication of any kind is more complex. I originally expected that if Merlin used any private information and evil players reasoned optimally, then Merlin would reveal too much about their identity. But that turns out to be false—Evan Chen found a simple strategy for 5 players where the good players win 23.7% of the time (while they only win 20% of the time if Merlin doesn’t use their private information). What does “solving” mean? A “strategy” for the good team specifies what each player would do if they are good. A strategy for the evil team specifies what each player would do if they are evil. We say the good players win with probability p if: There is a strategy for the good players that wins with probability at least p for all evil strategies. There is a strategy for the evil players that wins with probability at least (1-p) for all good strategies. Each player knows what they would have done if they had been assigned a different role (since they can just imagine receiving that role). So we allow a player’s strategy as an evil player to depend on what they would have done if they had been good—that is, we allow the evil players’ strategy to use an oracle for the good players’ strategies. This allows the evil players to do things like “Do exactly what you would have done if you were good, until event X occurs,” which is important—it prevents the good players from e.g. using a secret passphrase known only to good players. Similarly, we allow the good players to use an oracle for the evil players’ strategies. To prove that games have a unique value, we use a fixed point argument. (Though we can still define “the good players win with probability > p” without using fixed points, just based on the existence of an oracle strategy for good players that wins for all concrete strategies of the evil players.) I. Solving The Resistance (no Merlin) Without Merlin, the game is relatively straightforward. Understanding this setting is important because it will allow us to significantly simplify the full game. Victory probabilities are: 5 players: 30% 6 players: 33% 7 players: 26% 8 players: 16% 9 players: 29% 10 players: 17% Simplifying the structure of the game The simplified game: Consider the 3 largest quests. (Ignoring * quests that require two failures—these are strictly easier than a smaller quest, and so effectively are never amongst the 3 hardest quests to pass.) We will define a simplified meta-game where a single good meta-player chooses a group for each of the 3 largest quests, without having any information at all. They win if one of their 3 choices contains no evil players. Let p be the probability that the meta-player wins the simplified game. We now prove two claims: that the good players can guarantee a win with probability p, and that the evil players can guarantee a win with probability 1-p. Note that the meta-player might as well be deterministic, since we can just choose whatever random seed has the highest winning probability. Strategy for good players: Every good player simulates the meta-player internally to guess 3 groups. We initially mark each guess as “live.” In each round, we choose the smallest “live” group that and send it on the quest—i.e., all good players propose that group, and approve a proposal iff it is that group. If a quest fails, we mark the corresponding guess as “dead.” Our first claim is that until we’ve failed three times, there is always a live group that is large enough to go on the next quest. This is true because we always choose the smallest “live” group and our 3 guesses correspond to the 3 largest groups. Our second claim is that the good players always successfully select a group. This is true because the number of proposals allowed before automatic failure is always larger than the number of evil players, and any good player will make the unique proposal that would be accepted by the good majority. The final claim is that if one of our 3 guesses consists of only good players, we won’t fail 3 missions. This is true because each failure marks a “live” guess as “dead,” and the group of good players will never be marked as “dead.” So the good players end up winning with at least the probability that the meta-player successfully guesses a good set, regardless of what the evil players do. Strategy for evil players: The evil players behave exactly as if they were good players, unless one of them is selected to go on one of the 3 hardest quests. At that point, if a quest contains an evil player exactly one of them fails the quest (for example, they can decide to have the first evil player clockwise from the initial king fail). If the good players are able to win with probability p against this strategy for the evil players, we can construct a meta-player for the simplified game that also wins with probability at least p. The meta-player simply runs a simulation of 5 honest players, assumes that all hard quests fail and all easy quests pass, and outputs the teams selected for the 3 hardest missions. If the meta-player loses, then the honest players will also lose in the original game against the strategy we’ve described for the evil players. So the good players win with at most whatever probability the meta-player can win, regardless of what they do. Winning probabilities in the simplified game The simplified game is very simple. The strategy for the meta-player is simply to pick three guesses such that at most one of them can possibly succeed. To compute the probabilities, we verify that it’s possible to find 3 incompatible guesses, for each guess we can count the number of “possible worlds” (subsets of players who are evil) for which that guess is correct, add up these three numbers. That gives us the number of possible worlds in which the good team wins. We divide this by the total number of possible worlds to get the win probability. If picking a team of size X when there are Y good players and Z total players, the number of worlds in which it wins is simply (Z-X) choose (Y-X), i.e. all the ways to pick the remaining good players. 5 players. Quests are 3/3/3, out of 5 good players. They win with probability (1+1+1)/10 = 30%. 6 players: Quests are 3/4/4, out of 4 honest players. They win with probability (3+1+1)/15 = 33%. (At most one of {ABCD, CDEF, AEF} can be all good.) 7 players: Quests are 3/3/4, out of 4 honest players. They win with probability (4+4+1)/35 = 26%. (At most one of {ABC, DEF, ABDE} can be all good.) 8 players: Quests are 4/4/5, out of 5 honest players. They win with probability (4+4+1)/56 = 16%. (At most one of {ABCD, EFGH, ABCGH} can be all good.) 9 players: Quests are 4/4/5 out of 6 honest players. They win with probability (10+10+4)/84 = 29%. (At most one of {ABCDE, FGHI, ABHI} can be all good.) 10 players: Quests are 4/4/5 out of 6 honest players. They win with probability (15+15+5)/210 = 17%. (At most one {ABCDE, DEFG, GHIJ} can be all good.) II. On “whispering” We can modify Avalon by allowing “whispering,” private communication from one player to another. (It’s not important whether other players can observe that a pair is whispering—we will show that with whispering the good players can always win, even if the evil players are able to observe when whispering occurs but the good players are not.) In this section, I’ll argue that whispering is likely to be possible, unless we adopt rules specifically designed to prevent it. For N>6 players our strategies only require Merlin to whisper to the other good players who is good, and then for the good players to whisper to each other who claimed to be Merlin. To perfectly preserve anonymity, this requires each player to whisper (or pretend to whisper) N bits to each other player—only the whispers between Merlin and good players matter, but everyone else needs to whisper to provide cover. For N=5 players we use a strategy that involves more whispering (order N² log(N) bits between every pair of players). This strategy is combinatorially simpler (and I could have used a similar idea to give simple strategies for N>6 players), but it would be hard to implement in normal Avalon without looking like you are breaking the spirit of the game. There is a single case with N=7 players that requires additional whispering. Step 1: Exploiting limitations The first step is to use players’ limitations to send a message that some but not all players can detect: Limited perception. I can’t see everything that everyone is doing simultaneously. If someone winks, gestures with one hand, taps their foot, or shrugs a shoulder, I will sometimes not notice. Even if I’m looking at one person intently I probably can’t notice every possible signal they could send, and it’s even more hopeless to monitor multiple people simultaneously. Limited information. Any given pair of people are likely to have some knowledge in common that at least some other players lack. For example, if I choose a random trivia fact of an appropriate level of difficulty, I might assume each good player has at least a 10% chance of knowing that fact while each evil player has at most an 20% chance of knowing the fact. Or I may have common context with particular other players (from shared experiences or past games). Limited computation. Merkle’s puzzles. Suppose I have a type of puzzle that’s easier to construct than to solve (like an anagram). I can construct a large number of puzzles and broadcast them. Someone who wants to communicate with me can choose one puzzle and solve it, and then broadcast an opaque hint about which one they solved (that’s only obvious to someone who already knows the solution). Then we have a shared secret, namely the solution to that puzzle. An eavesdropper needs to solve a large fraction of the puzzles to have a good chance of recovering that secret. For example, if I can make anagrams in 2 seconds and they take 3 minutes to solve, then I can broadcast 90 anagrams, you can pick one to solve (and give an opaque hint like “it’s a noun, changing the second letter makes it a verb”). Each of us spent 3 minutes and we end up with a shared secret, but it would take more than 2 hours on average for someone to recover our secret. Public key cryptography. If no holds are barred, I can publicly announce the product two large primes and go crazy. I think the other forms of whispering have realistic analogs in normal conversation, but this one doesn’t. Limited memory. Memory puzzles. We can all agree on 10 different functions of a list of numbers—sum of x, sum of x^2, sum of x where you reverse the digits, the sum of concatenations of pairs of consecutive numbers, etc. Then one player can quickly read a list of 30 numbers. Everyone else can pick a single function and keep track of the value of that function. After the stream of numbers is done, everyone reveals which function they were keeping track of. If two people were keeping track of the same function, then they have a shared secret. The eavesdroppers can only recover it if they are able to remember all of the numbers, or compute all of the functions online, or get lucky and pick the same function. If there are 4 good players and 2 evil players, good players can compute one number and evil players can compute 2, then doing this process once gets you one shared secret between good players and the eavesdroppers only have a 40% chance of knowing it. Long-term memories. If a player remembers lots of information that other players don’t know, and its hard for other players to quickly commit new information to memory, then we can improve on the previous scheme. One player can choose a string they remember (e.g. digits of pi, a poem, the periodic table of the elements…) and can recite that string. Another player can choose a function, e.g. “the total number of letters in words that start with e,” and compute that function as the first player recites. Then the receiver can reveal the function, and the sender can compute the value of that function by repeating the string in their head. Physical props. If we allow non-trivial physical props then signaling usually becomes easy. As an example, suppose that players are allowed to cast anonymous ballots, each writing down the name of a player, putting those names in the center of the table, then shuffling them and revealing how many votes each player received (but not who voted for them). This can be used to generate shared secrets: (i) each player votes randomly, (ii) one player who submitted a unique vote A chooses another unique vote B, and announces “I voted for either A or B,” (iii) the player who voted for B also says “I voted for either A or B.” Then those two players know who voted for whom, but no one else knows anything. (It’s a bit complicated to analyze what happens if an evil player lies to try to mess up the process, but it turns out to be fine.) Some of these measures sound pretty weird, but I think they mostly have innocuous-looking versions, many of which occur routinely in games: Limited perception is frequently used (often e.g. between two evil players subtly indicating which one should f"
