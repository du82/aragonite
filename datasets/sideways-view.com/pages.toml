title = "Analyzing divestment – The sideways view"
description = "Suppose that I'm considering investing $1 in EvilCo (ticker EVL), but decide I don't like the company's activities so I refrain. Or maybe I decide to short EVL. Is this effective in reducing EvilCo's activities? In this post I'll argue: Divestment can be reasonably effective, despite replaceability. My best guess: I can often sacrifice <$1…"
full_description = "Analyzing divestment Posted on May 25, 2019May 25, 2019 by paulfchristiano Suppose that I’m considering investing $1 in EvilCo (ticker EVL), but decide I don’t like the company’s activities so I refrain. Or maybe I decide to short EVL. Is this effective in reducing EvilCo’s activities? In this post I’ll argue: Divestment can be reasonably effective, despite replaceability. My best guess: I can often sacrifice <$1 to reduce EvilCo’s output by >$5. This contrasts with the received wisdom amongst people I know, that divestment is only symbolic. The first dollar of divestment is extremely effective, probably more than an order of magnitude better, such that it’s likely that many people should divest a little bit. Optimized long/short divestment funds could make divestment much easier and more effective. I’m not very confident in these conclusions—this is a complicated analysis with lots of room for conceptual or empirical errors—but it’s my best guess. I’d love to get feedback about how this picture is wrong. I also don’t engage very much with the existing literature. Consider this an independent attempt to figure out what’s going on with divestment. I. The effects of divestment Suppose that I’m $1 short EVL. What does that mean, and what happens? In the purest case, EvilCo was going to sell a share of EVL to Alice for $1. Then I swoop in and sell a share of EVL to Alice for $1 instead (which I’ve borrowed from some other current shareholder Bob). If EvilCo want to sell that share of EVL they’ll have to find a new buyer. In general the new buyer will be willing to pay less—Alice was the person willing to pay the most money for EVL, and so they need to go to the next person down the line. (If you’re skeptical about equity, you can consider the roughly-equivalent case of debt—Alice was about to lend $1 to EvilCo, in return for a constant stream of interest payments. Instead I stepped in, and said “Alice, I’ll take your $1, and if EvilCo successfully pays off its other investors then I’ll pay you as much as they would have.” Then EvilCo will need to find another lender, who will demand a marginally higher rate of return.) At the reduced price / raised interest, EvilCo is less excited about selling shares / borrowing money. So EvilCo will do less Evil™. At the same time, the new price makes other investors more willing to invest. The sum of these two effects—other investors investing more, and EvilCo doing less—will add up to exactly $1, offsetting the $1 that Alice would have invested but didn’t. I’m going to do this analysis in the fictional efficient-market-land. I think this is more reasonable than it looks because criticisms of divestment usually come from an analysis based on market efficiency. In reality I suspect the story will be if anything a bit more favorable to divestment, but that’s also something to think about. One relevant fact about efficient market-land: if EvilCo’s activity had no risk, then the returns would converge to the risk-free rate, investors would make no premium, and divestment woud a zero effect and zero cost. In efficient market land, all of the action comes from uncertainty about EvilCo’s returns. IA. Elasticity of Evil A key question is how much less Evil™ EvilCo will in fact do. This is a complicated empirical question, but here’s a simple way to get an intuition: Suppose the price of EVL (or cost of EvilCo bonds) goes down by 1%. That raises EVL’s capital costs by 1% per unit of Evil™. (They’ll substitute to less capital-intensive processes, but to first order that doesn’t change the calculation.) Capital costs were just one component of EvilCo’s cost. I think a typical value is 20% of costs (say 10% profit and 10% interest payments). If costs go up by 1%, then EvilCo will do less stuff. I think a plausible response is 1:1—after a 1% cost increase a company can spend the same amount of money to do 1% less stuff. Note that EvilCo is likely to pass these costs onto consumers (especially in a competitive market) and so changes in quantity largerly reflect decisions by consumers, not EvilCo itself. If capital is 20% of costs and elasticity is 1:1, then a 1% decrease in the price of EVL leads to 1% * 20% * 1 = 0.2% reduction in EvilCo’s activity. Throughout the rest of the post I’ll call this number K: a 1% decrease in the price of EVL leads to a K% reduction in EvilCo’s output. I think that 0.2 is a plausible value for K but you could certainly make a better estimate with some empirical research. Note that this is an ongoing reduction in activity, as long as the change in capital costs persists. IB. Elasticity of investor demand As EVL becomes cheaper, other investors will buy more of it. This will soften the effect of divestment, but how much? Utility-maximizing investors will generally hold just enough EVL that they are indifferent between holding more and holding less—the extra risk from holding more EVL exactly offsets the extra returns. (Otherwise they would increase or decrease their holdings until equality is attained.) I’ll informally define the “excess returns” of EVL as the returns a risk-free asset would need to receive, in order to be as attractive as EVL on the margin for a portfolio that doesn’t yet contain any EVL. Write r̃ for these returns. Roughly speaking, this is the return to EVL, minus the risk-free rate, minus the cost of the correlation between EVL and the rest of the portfolio. Put another way, r̃ measures how much a rational investor would be willing to pay to be able to include the first $1 of EVL in their portfolio. For example, if EVL has no risk, r̃ is the difference between its returns and the risk-free rate. If EVL’s return is a sum of a term that behaves just like the rest of the market and another uncorrelated term, then r̃ is the expected return of the uncorrelated part. So what is the effect of lowering the price of EVL by 1%? If we increase r̃ by 1%, then a utility-maximizing investor will increase their holding of EVL until the risk from marginal holdings also increases by 1%. That requires increasing holdings by exactly 1%. (They’ll also change their other holdings and how much they want to invest, but to first order that doesn’t change this calculation.) I think this is a key claim, and it’s kind of counter-intuitive, so I’ll go through an example in the appendix. A 1% decrease in EVL leads to a 1% increase in the returns r (not a 1 percentage point increase), which corresponds to more than a 1% increase in excess returns, by a factor of r / r̃. For example, if EVL cost $1 and returned $0.05 per year, it has a return of 5%/year. If the risk-free rate is 3%/year and EVL is uncorrelated with the market, then the excess return is 2%. If the price of EVL falls to $0.99, the earnings of $0.05 are now 5.05%/year, i.e. the return has gone up 1%. But the excess return is now 5.05%-3% = 2.05%/year, so the excess returns have gone up by 2.5%; the ratio 2.5%/1% is precisely r / r̃. The factor r/r̃ measures what fraction of EVL’s returns are excess returns. You can probably estimate this quantity from public financial information. I’ll use 10 as a representative value, but I think it will vary a lot from industry to industry, whether EVL represents a single company or a whole sector, levels of idiosyncratic risk, etc. Note that this is also an ongoing change in other investor’s positions, as long as the price change persists. IC. The net effect So suppose I divest, selling $1 of EVL. This will increase the return by some unknown proportion x. That will in turn decrease EvilCo’s outstanding equity+debt by Kx * (current level), and increase other investment by (r/r̃)x * (current level). Those two terms will add up to $1. Moreover, current levels of equity+debt = current levels of investment, so that the net effect is to decrease EvilCo’s outstanding equity+debt by K / (K + r/r̃). That tells us how much outstanding debt changes, but what about output? Write O for the ratio of output/(debt+equity). If we shrink debt+equity while holding fixed capital-intensity, then a $1 change in debt+equity leads to an $O change in output. O is roughly the inverse of (Enterprise Value / Sales), a ratio sometimes analyzed in finance. A typical value of O in the US is about 0.3-2/year, with a median of 0.75 (Table 20.1, note that the average is very different from the median). I expect companies with higher values of O to (all else equal) have lower values of K. On the margin, my divestment decreases EvilCo’s output by: K / (K + r/r̃) * O So, if K = 0.2, r/r̃ = 10, O = 0.75/year, then me divesting $1 will decrease EvilCo’s output by $1 * 0.2 / 10.2 * 0.75/year = $0.015/year. II. The cost of divestment This may not sound good, but note that the cost of divesting $1 is (much) less than $1/year. How costly is it? If I divest completely, my last unit of divestment costs me r̃—by definition, r̃ is precisely the excess returns from including the first unit of EVL in a portfolio. So the actual cost of complete divestment is typically quite low. r itself is probably more like 5%/year, and if r/r̃ = 10 then r̃ ~ 0.5%, and so me forgoing one dollar of investment returns actually decreases EvilCo’s activities by several dollars. But before I’ve divested at all, when I’m holding an optimal portfolio, the first unit of divestment actually has a cost of zero: I’m holding enough EVL that the costs from holding more (in terms of increased risk) exactly offset the benefits (of better returns than the risk free rate), so I’m exactly indifferent between investing in EVL or investing in government debt (or anything else for that matter). So the first unit of divestment is free, and the last unit costs r̃. In between the cost scales up linearly until I reach full divestment (and then goes on increasing linearly as I take out increasingly large short positions). The average cost for complete divestment is r̃/2. If divesting costs me r̃, and decreases output OK/(K+r/r̃), then the cost-effectiveness depends on which of K and r/r̃ is larger: In the typical case where (r/r̃) >> K, then the impact is OKr̃/r, and the cost is roughly r̃. So $1 of cost to me decreases EvilCo output by about OK/r. For example, if K = 0.2, O=0.75/year, and r = 5%/year (the S&P 500 P/E ratio is 20), then divesting $1 decreases EvilCo’s output by about $3. K could be larger than (r/r̃) if almost all of the returns are excess returns (e.g. if EvilCo is basically uncorrelated with the market) and K > 1 (e.g. if EvilCo behavior is very sensitive to costs). In this case, my bang for my buck is O/r̃. For example, if O=0.75 and r̃=0.1, then $1 of cost to me decreases EvilCo output by about $7.50. (This could also happen if r is actually much smaller than r̃, which can happen if EVL’s returns are significantly anticorrelated with the market. That’s a bad situation for a divestor.) If K and r/r̃ are comparable, then these two estimates are equal, and my actual cost-effectiveness is about half of that. These numbers are the cost-effectiveness of the final unit of divestment, where I completely remove EVL from my portfolio. The average effectiveness of totally divesting is twice this high. If I divest a fraction x of my portfolio, then my marginal bang-for-my-buck is 1/x larger than this (and the average bang-for-my-buck is 2/x larger). To know how much I should rationally divest, I need to know both this bang-for-my-buck and how much I care about reducing EvilCo’s spending. For example, if my bang-for-my-buck is 3, and I’d be willing to pay $0.10 to reduce EvilCo spending by $1, then I should divest 30% of the way—since then the marginal bang for my buck is $3/30% = 10, and the average bang-for-my-buck is 20. If my bang-for-my-buck is 10 and I’m willing to pay $1 to reduce EvilCo spending by $1, then I should divest 1000% of the way, i.e. if I’d previously held 10 shares of EVL, I should now be short 90 shares. III. Many divestors The previous analysis considered a single divestor, whose effect is marginal. How does the picture change if many people divest? My overall summary is that divestment probably becomes slightly less impactful when there are many divestors, but that divestors would need to be having a very large impact on stock prices (think cutting the price 2x) before this effect becomes significant. The most obvious (but mild) effect is that as the number of divestors grows, the excess returns r̃ for the first unit of EVL increase—it becomes an increasingly cheap stock, and divestors are making a larger and larger sacrifice. This has a surprisingly mild effect on the impact of divestment: As long as the elasticity of investment to interest rates K is smaller than 1, divestment increases both r̃ and r, and so (r/r̃) remains much larger than K and the term K/(K+r/r̃) will be approximately equal to Kr̃/r. In this regime the divestors’ bang-for-their-buck is K/r. So the efficacy of investment decreases linearly as the interest rate for EvilCo increases. If you had enough divestment to double the interest rate, it would only decrease the cost-effectiveness of divestment by a factor of 2. I think that’s a much higher level of divestment than is likely in any industry in the short term, so I think the presence of other divestors won’t decrease the impact of divesting by very much through this channel. A less obvious effect is that as people divest from EVL, the optimal portfolio involves larger and larger investments in EVL. This offsetting effect is factored into the cost benefit analysis—that’s why we had to divide by (K+r/r̃). This introduces a divergence between the market portfolio—what you get if you index—and the optimal portfolio—what you’d do to optimize profit. In other words, once some people are divesting, anyone using a broad market index to invest is effectively divesting by the “average” amount. (The index also reflects all of the overweight investments in targeted industries, but that doesn’t change this picture—that’s already taken into account with the analysis above.) This has two effects: Divestment is amplified by roughly 1/(1 – indexing fraction). E.g. if a third of investors index (my best guess), then divestment is 50% more effective. Indexes make the average level of divestment a strong default; and more broadly people who want to avoid divesting need to actively decide to overweight EVL. I think for some investors there is a relevant act-omission distinction that makes them feel bad about this even if they wouldn’t have divested themselves (I’m a consequentialist, but don’t consider this unreasonable—I think it’s relevantly uncooperative to reap profit by deliberately offsetting soeone else’s divestment). Overall I expect the impact of divestment to be amplified by 1.5-2x based on this kind of factor. As someone who is considering divestment, I need to be aware that I may already be doing the “average” level of divestment simply by not overweighting EVL. So if there are many EvilCo divestors, then I’m no longe"
