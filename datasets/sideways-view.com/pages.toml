full_description = "Self-driving car bets July 29, 2023 This month I lost a bunch of bets. Back in early 2016 I bet at even odds that self-driving ride sharing would be available in 10 US cities by July 2023. Then I made similar bets a dozen times because everyone disagreed with me. The first deployment to potentially meet our bar was Phoenix in … More Self-driving car bets Leave a comment Self-driving car bets Three reasons to cooperate December 24, 2022 In this post I’ll discuss three reasons to cooperate in a truly one-shot prisoner’s dilemma: Kindness makes common sense, but correlation and reciprocity are often lumped together under “weird acausal stuff.” I think they are worth distinguishing because they work quite differently. I’ll talk about details of correlation and reciprocity, and then argue that most … More Three reasons to cooperate Leave a comment Three reasons to cooperate Decision theory and dynamic inconsistency July 3, 2022 Here is my current take on decision theory: When making a decision after observing X, we should condition (or causally intervene) on statements like “My decision algorithm outputs Y after observing X.” Updating seems like a description of something you do when making good decisions in this way, not part of defining what a good … More Decision theory and dynamic inconsistency 1 Comment Decision theory and dynamic inconsistency What is causality to an evidential decision theorist? April 17, 2022 (Subsumed by: Timeless Decision Theory, EDT=CDT) People sometimes object to evidential decision theory by saying: “It seems like the distinction between correlation and causation is really important to making good decisions in practice. So how can a theory like EDT, with no role for causality, possibly be right?” Long-time readers probably know my answer, but … More What is causality to an evidential decision theorist? 3 Comments What is causality to an evidential decision theorist? EDT with updating double counts October 12, 2021 I recen