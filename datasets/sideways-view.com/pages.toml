["https://sideways-view.com/2016/12/09/the-comet-king"]
title = "The Comet King – The sideways view"
description = "(If you read one post from my blog, it shouldn't be this one. Also, serious Unsong spoilers.) Unsong's Comet King is something of an indulgent caricature, implausibly determined and noble and capable. But if I put aside the desire to be respectable, I enjoy indulgent caricatures. This post presents some Unsong excerpts that touch on the Comet King's character and fate, in chronological…"
full_description = "The Comet King Posted on December 9, 2016October 24, 2018 by paulfchristiano (If you read one post from my blog, it shouldn’t be this one. Also, serious Unsong spoilers.) Unsong’s Comet King is something of an indulgent caricature, implausibly determined and noble and capable. But if I put aside the desire to be respectable, I enjoy indulgent caricatures. This post presents some Unsong excerpts that touch on the Comet King’s character and fate, in chronological order. For background: Thamiel is the facet of God that governs Hell. In the Unsong universe, Hell is straightforwardly evil and horrifying. Jalaketu, the Comet King, is the son of Archangel Raziel. Excerpts As a child, proposing to confront the demons marching across the American west [ch. 29]: “Jala, this is unsafe!” “Yes, Uncle. We must make it safe.” “Why us?” “Somebody has to and no one else will.” Upon meeting Thamiel shortly later [ch. 29]: “If this were a story,” Jalaketu continued, “and you were challenged by just one boy, wielding a sword made from a fallen star, here because he wouldn’t abandon his homeland – do you think it would end well for you? For the demon?” “Are you going to ask for my surrender?” snarled Thamiel. “No,” said Jala. “There is no surrender I can accept. If you left Colorado, I would follow you. If you left America, I would hunt you down. Even if you left the world entirely and returned to Hell, I could not allow this.” Discussing a controversial plan with his advisors [ch. 35]: “Proper?” asked the Comet King. “I come to you with a plan to fight off Hell and save the world, and you tell me it isn’t proper?” Vihaan stared at the priest, as if begging him to step in. “I swear,” said Father Ellis, “it’s like explaining the nature of virtue to a rock”. “Do you know,” interrupted Jalaketu, “that whenever it’s quiet, and I listen hard, I can hear them? The screams of everybody suffering. In Hell, around the world, anywhere. I think it is a power of the angels which I inherited from my father.” He spoke calmly, without emotion. “I think I can hear them right now.” Ellis’ eyes opened wide. “Really?” he asked. “I’m sorry. I didn’t…” “No,” said the Comet King. “Not really.” They looked at him, confused. “No, I do not really hear the screams of everyone suffering in Hell. But I thought to myself, ‘I suppose if I tell them now that I have the magic power to hear the screams of the suffering in Hell, then they will go quiet, and become sympathetic, and act as if that changes something.’ Even though it changes nothing. Who cares if you can hear the screams, as long as you know that they are there? So maybe what I said was not fully wrong. Maybe it is a magic power granted only to the Comet King. Not the power to hear the screams. But the power not to have to.” Speaking with Thamiel [ch. 43]: “If humanity was good, if even the tiniest, most miniscule fraction of humanity was good, God would have saved Sodom. Abraham asked Him that, and He agreed, because He knew it was the easiest bargain He’d ever make. A bet without risk.” “Lot was good,” said the Comet King. “One man!” “One man whose name means ‘a multitude’. That is the kabbalistic lesson: a single good man is equivalent to a multitude of good men. Because he can convince others, set up incentives, build institutions, drag the rest of the world kicking and screaming. If I had been with Abraham, I would not have stopped at ten people. I would have told God to save the city for the sake of one righteous man, and God would have done it, because one man can be a great multitude when kabbalistically necessary.” “And then what? Fine. You convince God to save Sodom. And what do you get? A city full of Sodomites. The scum of the earth. Worms and maggots infesting the world. And now they’ll never stop, because you showed them they’ll never face punishment for their crimes. They’re all yours. What does it gain you?” “I keep them from you,” said Jalaketu. “I’m telling the truth when I say I don’t like you,” said Thamiel. “Please don’t believe this is one of those times where the Devil always lies and you can’t trust him. I really don’t like you and I am really looking forward to the part a few years from now where God gives me the advantage over you and you end up wholly in my power. Remember that.” “I remember,” said the Comet King. Responding to his future wife’s marriage proposal [ch. 47]: “I accept,” said the Comet King. “My uncle Vihaan is in the third floor library. He manages my schedule. Ask him when a good time for the wedding would be.” Without a word, Robin got up from the table and headed towards the stairwell. Jalaketu toyed with his olive for another moment, then popped it in his mouth and walked out the door into the atrium. Father Ellis saw him and rose to his feet in a rage. “SEVEN MINUTES, JALA. THAT WAS SEVEN MINUTES AND FOURTEEN SECONDS. YOU PROMISED ME TEN. I WANT YOU TO GO BACK IN THERE AND…” “Father, I need your help.” The anger evaporated from the priest’s face. “What’s wrong, Jala?” “The girl. Robin. She told me that marriage and relationships were a waste of the time I should be spending planning my war against Hell. She offered to marry me, serve as my public face, and leave me alone completely in order to free me from the burden. I said yes. She and Vihaan will plan the wedding. You’ll need to officiate, of course. “God damn it, Jala! I wanted to humanize you, and instead you found somebody just as defective as yourself. You’ll get nothing out of it, she’ll get nothing out of it, and you’re going to miss your chance at something natural and important just to get someone who will pose for photo ops once in a while.” “No, Father, I need your help.” “Why? What is it?” “Father, I think I’m in love.” Speaking to his daughter Sohu, trying and failing to take her home from danger [ch. 36]: “Sohu,” said the Comet King, “before you and your sisters and brother were born, I thought of you as strategic assets. I told Father Ellis I would make an army of you. He said that was wrong. Then – your eldest sister, Nathanda. She was the first. When I saw her, I…Father Ellis talks of goodness as something burning and beautiful. I told him he was wrong, that goodness was something cold and crystalline. But when I saw Nathanda, for the first time I understood what it meant to see goodness the way that Father Ellis did. Terribly hot, and too bright to look upon directly. Then I knew as long as she was alive I did not need to worry any further about staying human. I had caught humanity and wrapped it around me tightly like a mantle. All thoughts of sending you off as an army vanished. You’re not a pawn – or at least you’re not only a pawn – you’re my daughter. And I will not let any harm come to you.” “But Father. You’re always telling us that we need to think of what’s best for the world.” “Yes,” said the Comet King. “So consider this: If anyone harms you, even the littlest cut or scrape, I will come against them as fire and night. I will destroy them and their people, uproot everything they have built, wipe them utterly from the Earth. […] What is best for the world is that I not do that. That is why I am taking you home, Sohu.” Counseling the Archangel Uriel, who maintains the physical world [ch. 36]: “No one keeps winning forever. And when I break, I’ll do what comets do. Shatter into fragments, but stay locked on the same path, so that only the most careful astronomers can even tell they’re broken. And that’s what you need to do, Uriel. We need your help.” “WE?” “Humanity.” “HUMANS DON’T LIKE ME.” “Humans dislike many things humanity needs.” “I AM NOT GOOD AT ANYTHING.” “You are good at one thing. You run the universe. That is enough. We need a universe. No one has to be good at everything.” “YOU ARE GOOD AT EVERYTHING.” “Not everything. I cannot run the universe. That is where you come in. And my daughter.” “SHE IS VERY GOOD. SHE IS LEARNING QUICKLY.” “So I’ve heard.” “I WILL NOT HURT HER.” “No, I don’t think you will.” He sighed. “But you need to be more careful. Both of you. Uriel, stay away from humans. They are ungrateful. They are foolish. They are cannibalistic. You and I, we are similar. Too similar. We take the straight paths. Try to do things right, damn the consequences. Humans are not like that. They manipulate the social world, the world of popularity and offense and status, with the same ease that you manipulate the world of nature. But not to the same end. There is no goal for them, nothing to be maintained, just the endless twittering of I’m-better-than-you and how-dare-you-say-that. You are no good at that, and you will never be any good at that, and if you were good at that you would not be good at what you need to be good at. We are similar, Uriel, deep down, but leave humans to me. That is my burden. The world is yours. The world, and training my daughter.” Discussion with Sohu shortly later [ch. 36]: “You lied to him, Father” “I told him the truth. His part is to remain strong and do his duty. If he fails, I will remain strong and do mine. You will do no less.” “That’s not what I mean. You told him you could break quietly. But you told me that if someone hurt me, you would go nuclear on them.” “I told both of you the truth. I will destroy anyone who hurts you. But not because I would be broken. Because I would remain intact.” Searching for Metatron, the highest archangel [ch. 22]: Five years ago, the Comet King had set out to find God. Not in the way where you live a life of humility and prayer. In the way where you need a really fast boat. It was the height of his power, the age when he held sway over the whole American West and parts of Mexico. His ambitions soared to the conquest of Hell itself, to break the power of the Devil and release his victims from their eternal torture. But defeating Hell would take more than mortal weapons. It would take the Shem haMephorash, the true explicit Name of God, the Name which allowed the speaker to destroy and remake worlds. It was the Name that God had spoken during the Creation, the Name that would blare from the Last Trumpet […] The Comet King sought Metatron. High above the world, his spy satellites sought the telltale golden sails of his boat. From sea to shining sea, his submarines and destroyers kept watch. Nothing. So he decided he was doing things wrong. Finding God wasn’t the sort of thing you did with a spy satellite or a submarine. It was the sort of thing you did on a quest. So he built himself a ship. A superfast yacht with seven sails, six from the colors of the rainbow and one jet-black. Every beam and mast built with strange magics only he knew. He called it All Your Heart, because it is written in Jeremiah: “You will seek God and find Him when you seek with all your heart.” Then he left the kingdom in the hands of his daughter Nathanda and left from Puerto Penasco in search of Metatron. Six months later, he returned. When they asked if he had found Metatron, he said yes. When they asked if he had learned the Name, he said yes. When they asked for details, he said no. Before beginning the march to Hell [ch. 54]: “The astronomers used to say comets are unpredictable,” said Robin. “That everything in the heavens keeps its own orbit except the comet. Which follows no rules, knows no path.” “They are earthbound,” said the Comet King. “Seen from Earth, a comet is a prodigy, coming out of the void for no reason, returning to the void for no reason. They call it unpredictable because they cannot predict it. From the comet’s own point of view, nothing could be simpler. It starts in the outer darkness, aims directly at the sun, and never stops till it gets there. Everything else spins in its same orbit forever. The comet heads for the source. They call it crooked because it is too straight. They call it unpredictable because it is too fixed. They call it chaotic because it is too linear.” He hesitated for a moment. “That is why I love you, you know. In a world of circles, you are something linear.” She said nothing, just kept tracing patterns on his chest. “A few months to reach Yakutsk,” he said. “A few months to get back. The work itself shouldn’t take more than a few moments. I will see you again by the winter.” Sleep came to them there, together, for the last time. Upon realizing that he cannot destroy Hell [ch. 55]: “Why would God do that? Why would He make a universe where the one thing it is absolutely one hundred percent morally obligatory to do is totally impossible, even if you do everything right, even if you get a weapon capable of destroying worlds themselves, who does that sort of thing?” “GOD,” said Uriel. “HE DOES MANY THINGS THAT ARE HARD TO EXPLAIN. I AM SURPRISED YOU HAVE NOT REALIZED THIS BY NOW.” “Who creates suffering that can never end? Who makes people, tells them to do the right thing, then pulls the rug out from under them when they try? I was supposed to be His sword, Uriel! I was Moshiach! He forged me, He and my father, put me through all of those trials so I could be worthy to be here today. Who forges a weapon like that and then keeps it sheathed? Why would God do that?” […] “I AM GOING TO TAKE YOU OUT OF HERE NOW. I AM SURE YOU CAN FIGHT ME OFF IF YOU WANTED TO BUT I WOULD REALLY APPRECIATE IT IF YOU DID NOT TRY.” The archangel reached out a gigantic hand and grabbed the Comet King. Then he rocketed upwards, fiery sword outstretched above him, clearing the smoke from their path. The darkness began to thin. A sense of orientation returned. At last a rush of information hit all of Jalaketu’s senses at once and he realized he was out of the pit, back above the earthly Lake Baikal. His men started to cheer. Some of them blew horns. A few started singing verses from the Battle Hymn. His heart sank. They think I succeeded, he thought to himself. Of course they think I succeeded. I’m the Comet King, here I am shooting out of the Abyss alive, being carried by an archangel, of course they think I succeeded. “No!” he shouted at the armies. “Stop! I failed! I couldn’t do it! I couldn’t destroy Hell! You brought me all this way, you trusted me, and I couldn’t do it! It’s all gone wrong! Stop singing! Stop singing! Stop!” Most of them couldn’t hear him, but a few caught the gist of his message. One by one, the songs wavered, but they didn’t die, his men still singing, sure that there must be something worth singing about. A few cried out, or raised banners, or started cheering on general principle. “Don’t bring me back to them,” the Comet King said, almost sobbing. “Take me somewhere else…can’t face them, just now.” Upon returning home and learning his wife has given her soul to Thamiel [ch. 68]: An hour and forty minutes later, Thamiel swaggered through the big spruce wood door with a gigantic grin on his tiny face, “Well!” he said, “It looks like we…” The Comet King had his hands around the demon’s neck in an instant. “Listen,” he said. “I know the rules as well as you do. Take her. But as God is"
