["https://sideways-view.com/2016/11/03/the-best-kind-of-discrimination"]
title = "The best kind of discrimination – The sideways view"
description = "Summary: I argue that we'd be better off if we had more and more efficient price discrimination, and suggest a simple scheme the IRS could use to enable it. This probably isn't a good idea. Also, I just learned that Buck proposed exactly the same thing 2 months ago, I guess something is in the air but I'm not…"
full_description = "The best kind of discrimination Posted on November 3, 2016November 11, 2016 by paulfchristiano Summary: I argue that we’d be better off if we had more and more efficient price discrimination, and suggest a simple scheme the IRS could use to enable it. This probably isn’t a good idea. Also, I just learned that Buck proposed exactly the same thing 2 months ago, I guess something is in the air but I’m not sure what. Suppose I’ve made a drug and am deciding at what price to sell it; or that I’m Adobe deciding what price to charge for Photoshop; or that I’ve built a private road and am deciding what toll to charge (when there is no congestion). If it costs me $2 to make a pill, and someone isn’t willing to pay $2 (e.g. because they don’t want it at all), then I shouldn’t give them the pill. If they are willing to pay $2, then it would be socially efficient to give it to them, and the only question is what the price should be. Different potential customers are willing to pay different amounts for my product. We might summarize the situation with a graph: on the x axis are people, on the y axis are prices, and the blue curve represents willingness to pay, the highest markup at which the customer would be willing to buy my product. If I charge more money, I will get fewer customers but make more per customer. If I want to pick the single price that maximizes profit, I’m basically trying to inscribe the rectangle of maximal area under this graph: Where the markup I’m charging is the height of the green rectangle. There are two problems with this situation: first, a bunch of people aren’t getting the product even though it would be socially efficient (that’s the deadweight loss). From a distributional perspective this is especially annoying because those people will tend to have less money to start with. Second, I’m not getting paid enough for producing the product (that’s the consumer surplus), and so it will tend to get underproduced. You may not be used to seeing the consumer surplus described as a “problem,” but that’s the kind of guy I am. (Also: this is the discussion for a single seller, if we step back to consider the entire market then the whole point is to generate surplus.) Price discrimination I would really like to charge higher prices to the people who are willing to pay a lot, and lower prices to the people who aren’t willing to pay a lot; this is called “price discrimination.” It potentially fixes the problem with some people not getting the product even though they should, and it also means that the compensation for making a product is closer to the social value it creates. You can’t directly observe how much a customer is willing to pay, but you can try to effectively charge different prices for different groups anyway. For example: You could provide a crappier version of the product and offer it more cheaply. For example, you could sell books and movies more cheaply after they’d been on the market for a while, or take out some software features that are especially important to high-paying customers. You could make the cheap version of the product visually distinctive in the hopes that wealthier customers won’t want to send a bad signal by purchasing it. You can make the cheap version harder to purchase, for example by requiring it to be bought as part of a larger bundle (commuter transit passes), or by requiring it to be bought further in advance (plane tickets for vacations, in the bad old days), or by requiring the customer to spend some time to get it (clipping coupons, shopping around sales) All of these measures potentially increase efficiency by facilitating price discrimination. They also directly lower efficiency, by placing artificial restrictions or imposing artificial costs on customers. Some forms of price discrimination mostly avoid these negative effects: if we can predict that students or children or families or seniors are willing to pay less, then we can just directly offer them a lower price. This is an especially great form of price discrimination. The proposal A wide variety of factors determine someone’s willingness to pay for a product. But one extremely important and nearly universal factor is how much money they have. One of the purest forms of price discrimination is to charge a lower price to poorer customers. Wealth-based price discrimination is often implemented by making discounts available to customers who pay non-monetary costs that wealthy people wouldn’t pay (since they don’t care as much about the discount). These measures don’t seem super effective, and as an added drawback they impose random and socially unnecessary costs on low-income families. As it turns out, the government already monitors how much money everyone makes. So here’s a possibly-more-efficient alternative: When you pay income taxes, the IRS notes your income. At any time you can go to an IRS website, verify your identity and specify an amount $X, and then immediately receive a verifiable digital certificate saying “Your income last year was less than $X.” If you wanted to, you could show this certificate to anyone. You could potentially also get certificates establishing bounds on household income per adult, capital gains, average income over the last decade, and so on. You cannot use this system to provide any verifiable lower bounds on income, only upper bounds. Some goods or services could be sold at different prices based on the customer’s income. This is precisely analogous to claiming a student discount or redeeming a coupon. Ideally it would be pushed as late as possible in the purchase process and be as discrete as possible. Prices might adjust continuously based on the purchaser’s income, or there could just be one or two discounts based on thresholds. For example, a web service subscription could cost 1/1,000 of your income; or a service might usually cost $10/month but be reduced to $4/month if you make less than $40,000/year. I expect this proposal to seem objectionable to lots of people, but as far as I can tell it would significantly increase efficiency and have positive distributional effects–at least if we ignore the costs of implementing it. Distributional effects etc. This proposal would reduce prices for poor consumers and increase prices for rich consumers. As a society we already pay costs to take money from rich consumers and give it to poor consumers, so we should be happy to get some extra redistribution in for free. Moreover, this proposal doesn’t involve any expansion of the government, is economically efficient, and is good for business, so this should be an unusually palatable form of redistribution to people on the right. If adopted widely, it would also increase the effective marginal tax rate on everyone (since earning more money forces you to pay higher prices). But as far as I can tell, this is an unavoidable artifact of any form of redistribution, so this scheme isn’t making the negative incentives per unit of redistribution any worse. In aggregate this scheme transfers value from consumers to producers. For the most part I think that’s not a big deal–most of the benefits eventually flow back to consumers in the form of wages, returns on capital, and more goods being produced. It does potentially have upwards-redistributive effects, if high-income workers and capital-holders are involved in more production relative to consumption. But these effects seem to be more-than-cancelled out by increased prices for high-income workers and capital-holders. Some logistics The actual implementation would probably not be by showing certificates to sellers. I imagine that people like credit card providers or PayPal would offer special accounts; they would check your income, and then would certify it to sellers during the payment processes. Or you might use a certificate to prove eligibility for a special Amazon account. Or discounts would be claimed as rebates. I’m not sure. This could all be built by the private sector after the fact. Sellers would hopefully not be involved in directly setting prices. Instead this information could be used by services like Freshplum, who are essentially charged with setting prices in order to maximize income, using whatever information they can find. Ideally, from the seller’s perspective this would be integrated with their payment processing infrastructure, and would only require specifying a small amount of additional data (e.g. a “basic” price that they would have charged absent price discrimination, perhaps a marginal cost, and a few other details). This would also be built by the private sector. Last-year’s income is not a great proxy for being cash-strapped, which is what we really want to estimate. I’m not sure how great a proxy you can actually construct using tax info. It seems like you can probably make a pretty good one by using a few years of income, looking at capital gains, and considering dependency status. Ideally the authorities would offer a wide range of possible certifications, and the market would decide which combinations were most useful for price discrimination. The incentives of the sellers and middlefolk seem to be basically aligned with social welfare, though I might be overlooking a bunch of details. All of those services might take time to built up, and they might never be built at all. But if it takes a while or never gets done, it’s not a really big deal. The IRS’ role in the proposal would hopefully be offensively simple. A minimal implementation might be: you can receive a special code by the same channel that you receive your tax refunds. By providing this code + your SSN/TIN at a government portal, you can make requests for verifiable certificates. These certificates are signed by the government, and specify your identifying information (or whatever subset you request) along with the requested claims about your income, dependency status, etc. The entire thing could be much easier if all of the data about income was simply published where anyone could see it, and sellers could use it to set prices without any coordination with buyers. I have a feeling that would be a deeply and inherently problematic proposal though. (And that the mere problem of people losing their codes due to phishing attacks will already be enough to scare everyone away.) The stakes (Warning: these numbers are pretty made up. Please feel free to criticize them.) I don’t know how much value is actually on the table here. In principle the total value to be gained from perfect price discrimination is basically the same as the value to be gained from this proposal. I might eyeball the total deadweight loss (in America) at ~$1T/year, or $3,000 per consumer, though it could easily be much higher or lower. I expect that having perfect access to people’s income would allow you to capture a modest but non-negligible share of that total value, perhaps 10% at the outside. Government certificates of income would allow you to capture a modest but non-negligible share of that, perhaps 30-50%, even in the case where everything went incredibly well. And there are a bunch of frictions and annoyances that would claw back costs. So overall I’d be very surprised if you could capture more than perhaps 1-4% of the total value being currently left on the table. Even 1% would be a big success. If the total value per consumer is $30/year, that’s basically not enough to justify forcing people to have to think about one extra thing. I could be really underestimating the total value on the table. Really I would need to have way more insight into the actual situation of low-income consumers in order to really estimate the value up for grabs, this kind of Fermi estimate is totally irresponsible. Given how messy life is, it seems more likely that I’m overestimating the goodness than that I’m underestimating it. To be clear, I still think this is relatively robust and is overall more promising than most of the wacky institutions proposed on the internet. It’s just not something that should be seriously compared to e.g. raising tolls on the bay bridge, which I think would probably make the world substantially better. Conclusion I think it would be nice if the world had more price discrimination; we would produce more goods, and those goods would be available to more people. As a society we could enable price discrimination by providing more high-quality signals to be used by price discriminators. The IRS is in a particularly attractive position to offer such signals since income is a particularly useful signal. But realistically I think that such a proposal would require coordination in order to get consumers’ consent to make the data available (and to ensure that only upper bounds were available); the total gains are probably not large enough to justify the amount of coordination and complexity that is required."
