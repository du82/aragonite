["https://signal.org/hr"]
title = "Signal >> Naslovnica"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Dobro došli u drugačije iskustvo razmjene poruka. Neočekivan fokus na privatnosti u kombinaciji sa svim značajkama koje očekujete. Vrhunsko sveobuhvatno šifriranje (koje pokreće Signalov protokol otvorenog kȏda) čini vaše razgovore sigurnima. Ni mi, ni itko drugi ne može čitati vaše poruke niti slušati vaše pozive. Privatnost nije opcija — to je način na koji Signal funkcionira. U svakoj poruci, svakom pozivu, svaki put. Besplatno dijelite tekst, glasovne poruke, fotografije, videozapise, GIF-ove i datoteke. Signal koristi podatkovnu vezu vašeg mobilnog uređaja kako biste izbjegli SMS i MMS naknade. Uputite glasovne i video pozive vrhunske kvalitete ljudima koji žive na drugoj strani grada ili svijeta, bez troškova poziva na veće udaljenosti. Dodajte novi način izražavanja u svoje razgovore pomoću šifriranih naljepnica. Možete stvoriti i dijeliti i vlastite pakete naljepnica. Bez oglasa, bez partnera oglašivača i bez jezivog praćenja u Signalu. Ostaje vam samo da se usredotočite na dijeljenje važnih trenutaka s bitnim osobama. Signal je neovisna, neprofitna organizacija. Nismo vezani ni za jednu veću tehnološku tvrtku i nijedna od njih nas ne može preuzeti. Razvoj podržavaju donacije ljudi poput vas. Donirajte Signalu"
