["https://signal.org/cs"]
title = "Signal >> Hlavní stránka"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Přivítejte jiný způsob zasílání zpráv. Nečekaný důraz na ochranu soukromí v kombinaci se všemi funkcemi, na které jste zvyklí. Prohlédněte si následující informace a zjistěte, proč je Signal jednoduchý, výkonný a bezpečný nástroj pro zasílání zpráv Špičkové koncové šifrování (založené na open source protokolu Signal) zajišťuje bezpečnost vašich konverzací. Nemůžeme číst vaše zprávy ani poslouchat vaše hovory, a stejně tak to nemůže dělat nikdo jiný. Ochrana soukromí není volitelný nadstandard – Signal tak prostě funguje. Každá zpráva, každý hovor, pokaždé. Sdílejte textové a hlasové zprávy, fotografie, videa, GIFy a soubory zdarma. Signal využívá datové připojení telefonu, takže se vyhnete poplatkům za SMS a MMS. Uskutečňujte křišťálově čisté hlasové a video hovory s lidmi, kteří žijí na druhém konci města nebo za oceánem, bez mezistátních poplatků. Dodejte svým konverzacím nový styl v podobě šifrovaných nálepek. Vytvářet a sdílet můžete také vlastní balíčky nálepek. Díky skupinovým konverzacím můžete snadno zůstat ve spojení s rodinou, přáteli a spolupracovníky. V aplikaci Signal nejsou žádné reklamy, žádný smluvní marketing ani žádné nepříjemné sledování. Můžete se tak plně věnovat sdílení důležitých okamžiků s lidmi, na kterých vám záleží. Signal je nezávislá nezisková organizace. Nejsme vázáni na žádnou velkou technologickou společnost a ani nás žádná z nich nemůže nikdy získat. Vývoj je podporován granty a finančními příspěvky od lidí, jako jste vy. Podpořte Signal finančně"
