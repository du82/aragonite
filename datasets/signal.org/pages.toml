["https://signal.org/fr"]
title = "Signal >> Accueil"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Ici commence une expérience de messagerie vraiment différente. Entrez dans un monde où la confidentialité et la protection de la vie privée sont de véritables priorités. Retrouvez toutes les fonctionnalités que vous attendez et découvrez celles dont vous ne pourrez bientôt plus vous passer. Simplicité. Puissance. Sécurité. Découvrez ce qui fait de Signal une messagerie vraiment à part. Nous avons développé une méthode de chiffrement de bout en bout ultramoderne, qui s’appuie sur notre protocole open source pour assurer la sécurité de vos conversations. Nous ne pouvons ni lire vos messages, ni écouter vos appels. En clair : vous seul y avez accès. Et personne d’autre. La confidentialité n’est pas une option facultative : elle fait partie de notre ADN. Intégrée au cœur de Signal dès sa conception, elle s’applique à tous les messages, à tous les appels, tout le temps. Partagez gratuitement des messages texte, des messages vocaux, des photos, des vidéos et des GIF. Signal utilise la connexion de données de votre téléphone, ce qui vous épargne les coûts liés à l’envoi de SMS et de MMS. Passez des appels vocaux et vidéo de très grande qualité, que vos interlocuteurs se trouvent à l’autre bout de la ville ou à l’autre bout du monde. Le tout, gratuitement. Avec nos stickers chiffrés, exprimez-vous encore plus librement. Vous êtes même libre de créer et de partager vos propres packs de stickers. Avec les conversations de groupe, garder le contact avec votre famille, vos amis et vos collègues n’a jamais été aussi simple. Ici, aucune publicité, aucune affiliation marketing, zéro cookie de suivi dystopique. Respirez... Et ne pensez qu’à l’essentiel : partager de précieux moments avec ceux et celles qui comptent pour vous. Signal est un organisme indépendant à but non lucratif. Nous ne sommes liés à aucune grande entreprise technologique et ne serons jamais achetés par l’une d’elles. Pour continuer à développer notre application, nous dépendons des subventions, mais aussi des dons de personnes comme vous. Faire un don à Signal"
