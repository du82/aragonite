["https://signal.org/gl"]
title = "Signal >> Inicio"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Dálle a benvida a unha nova experiencia de mensaxería. Un enfoque nunca visto na privacidade, en combinación con todas as funcións que esperas. Bota unha ollada para aprender por que Signal é unha aplicación de mensaxería sinxela, segura e potente A encriptación vangardista de extremo a extremo (grazas ao código aberto Signal Protocol) mantén seguras as conversas. Non podemos ler as túas mensaxes ou escoitar as chamadas, e ninguén máis pode facelo. A privacidade non é un modo opcional para nós, así é como funciona Signal. Cada mensaxe, cada chamada, para sempre. Comparte mensaxes de texto e voz, fotos, vídeos, gifs e arquivos de balde. Signal emprega a túa conexión a Internet para que evites as tarifas de SMS e MMS. Fai chamadas de vídeo e manda mensaxes de voz na maior resolución tanto con persoas que viven na mesma cidade coma coas que viven noutro continente, sen cargos adicionais. Engade unha dimensión máis ás túas conversas con stickers encriptados. Tamén podes crear e compartir os teus propios paquetes de stickers. As conversas de grupo facilitan a comunicación entre a familia, os amigos e os compañeiros de traballo. En Signal non hai anuncios, non hai vendedores afiliados e non hai ningún tipo de seguimento. Só tes que centrarte en compartir os momentos máis importantes coas persoas que máis che importan. Signal é una organización independente sen ánimo de lucro. Non temos relacións con ningunha grande empresa de tecnoloxía, e tampouco nos poden comprar. O desenvolvemento persiste gracias a subvencións e doazóns de xente coma ti. Doar a Signal"
