["https://signal.org/hu"]
title = "Signal >> Kezdőlap"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Éld át az üzenetküldés új élményét! Meglepően nagy hangsúlyt fektettünk az adatvédelemre, miközben az összes megszokott funkciót elérhetővé tettük. Fedezd fel, hogy mi teszi a Signalt egy igazán egyszerű, nagytudású és biztonságos üzenetküldővé A legkorszerűbb végpontok közötti titkosítás (amit a nyílt forrású Signal protokoll biztosít) gondoskodik arról, hogy beszélgetéseid biztonságban legyenek. Nem tudjuk elolvasni üzenteidet, sem belehallgatni hívásaidba, ahogy senki más sem. Az adatvédelem nem egy választható üzemmód — egyszerűen így működik a Signal. Minden egyes üzenet elküldésekor, az összes hívás során, mindig. Ossz meg szöveges tartalmat, hangüzeneteket, fotókat, videókat, GIF-eket és más típusú fájlokat ingyenesen. A Signal a telefonod adatforgalmát használja, így elkerülheted az SMS és MMS díjakat. Indíts kristálytiszta hang- vagy videohívásokat a város vagy akár az óceán túloldalán élők irányába távolsági díjak nélkül. Tedd színesebbé beszélgetéseidet a titkosított matricák használatával! Létrehozhatsz és megoszthatsz saját matrica-csomagokat is. A csoportos beszélgetések könnyebbé teszik a kapcsolattartást családtagjaiddal, barátaiddal és munkatársaiddal. A Signalban nincsenek reklámok, nincsenek jutalékért hirdetett szolgáltatások, sem hátborzongató nyomkövetés. Fókuszálj a valóban fontos pillanatok megosztására azokkal, akik fontosak számodra! A Signal egy független nonprofit szervezet. Nem kötődik egyetlen nagyobb technológiai vállalathoz sem, és később sem fognak felvásárolni minket. A fejlesztés a hozzád hasonló hétköznapi emberek adományaiból és támogatásaiból történik. Adomány a Signal számára"
