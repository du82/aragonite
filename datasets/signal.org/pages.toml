title = "Signal >> Casa"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Dona la benvinguda a una experiència de missatgeria diferent, inesperadament centrada en la privacitat, però amb totes les funcions que esperes. El xifratge d'extrem a extrem d’última generació (basat en el protocol de codi obert del Signal) manté les converses segures. No podem llegir els teus missatges ni escoltar les teves trucades, i ningú més no ho pot fer. La privacitat no és un mode opcional, sinó la manera de funcionar per defecte de Signal. En cada missatge, en cada trucada, en tot moment. Comparteix texts, missatges de veu, fotografies, vídeos, GIF i fitxers gratuïtament. Signal utilitza la connexió de dades del telèfon perquè puguis evitar les tarifes d’SMS i MMS. Fes trucades de veu i de vídeo ben clares a persones que viuen tant a l'altre costat de la ciutat com de l’oceà, sense despeses de llarga distància. Afegeix un nivell d'expressivitat nou a les converses amb els adhesius xifrats. També pots crear i compartir els teus paquets d’adhesius. Els xats de grup faciliten la possibilitat de mantenir-se connectat amb la família, amistats i companys de feina. No hi ha anuncis, ni tècnics en màrqueting afiliats ni cap rastreig sinistre a Signal. D'aquesta manera, pots dedicar-te a compartir els moments que importen amb les persones que t'importen. Signal és una organització independent i sense ànim de lucre. No estem lligats a cap de les grans empreses tecnològiques i tampoc ens podrà adquirir una. El desenvolupament compta amb ajuts i donacions de persones com tu. Fes una donació a Signal"
