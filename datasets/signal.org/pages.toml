["https://signal.org/fa"]
title = "Signal >> خانه"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "به یک تجربه پیام‌رسانی متفاوت «سلام» کنید. تمرکزی بی‌سابقه بر حریم خصوصی، همراه با تمام امکانات مورد انتظار شما. موارد زیر را مرور کنید تا ببینید چرا سیگنال یک پیام‌رسان ساده، قدرتمند و امن است آخرین فناوری رمزگذاری سرتاسری پیشرفته (قدرت گرفته از پروتکل متن‌باز سیگنال) گفتگوهای شما را امن نگه می‌دارد. نه ما و نه هیچ‌کس دیگر قادر به شنیدن تماس‌ها یا خواندن پیام‌های شما نیستیم. حریم خصوصی یک حالت اختیاری نیست — اساس کار سیگنال بر این است. در همه پیام‌ها، همه تماس‌ها، همیشه. پیام‌های متنی و صوتی، عکس‌ها، ویدئوها، گیف‌ها و فایل‌های خود را به‌صورت رایگان به اشتراک بگذارید. سیگنال از اتصال اینترنت گوشی شما برای اجتناب از هزینه‌های پیامک و پیام چندرسانه‌ای استفاده می‌کند. با افرادی که آن‌سوی شهر یا آن‌سوی اقیانوس زندگی می‌کنند تماس صوتی و تصویری با وضوح بالا برقرار کنید، بدون هزینه‌های تماس راه دور. با استیکر‌های رمزگذاری‌شده، سطح جدیدی از بیان را به مکالمه‌های خود اضافه کنید. می‌توانید بسته‌های استیکر خود را ایجاد کنید و به اشتراک بگذارید. گفتگوهای گروهی ارتباط با خانواده، دوستان و همکاران را آسان می‌کنند. هیچ‌گونه آگهی، بازاریابی وابسته و ردیابی موذیانه‌ای در سیگنال وجود ندارد. پس فقط به هم‌رسانی لحظه‌های مهم خود با عزیزانتان فکر کنید."
