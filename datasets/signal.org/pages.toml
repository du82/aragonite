["https://signal.org/id"]
title = "Signal >> Beranda"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Sambut pengalaman berbagi pesan yang berbeda. Fokus tak terduga pada privasi, dipadukan dengan semua fitur yang Anda harapkan. Pelajari di bawah ini untuk mengetahui alasan Signal disebut sebagai aplikasi berbagi pesan yang sederhana, kuat, dan aman Enkripsi ujung-ke-ujung yang canggih (dipersembahkan oleh Protokol Signal yang bersumber terbuka) menjaga percakapan Anda tetap aman. Kami dan orang lain siapa pun itu tidak dapat membaca pesan Anda atau mendengar panggilan Anda. Privasi bukan pilihan — itulah cara kerja Signal. Keamanan untuk setiap pesan, setiap panggilan, setiap saat. Berbagi teks, pesan suara, foto, video, GIF dan file secara gratis. Signal menggunakan koneksi data ponsel sehingga Anda dapat bebas dari biaya SMS dan MMS. Lakukan panggilan suara dan video sejernih kristal ke orang yang tinggal di seberang kota, ataupun seberang pulau, tanpa biaya panggilan jarak jauh. Tambahkan lapisan ekspresi baru dalam percakapan Anda dengan stiker terenkripsi. Anda juga dapat membuat dan membagikan paket stiker Anda sendiri. Tidak ada iklan, pemasaran yang terhubung, dan pengintaian mengerikan di Signal. Jadi fokuslah berbagi momen berharga dengan orang yang berarti untuk Anda. Signal adalah organisasi nirlaba independen. Kami tidak terikat dan dimiliki oleh perusahaan teknologi besar mana pun. Pengembangan Signal didukung hibah dan donasi dari orang-orang seperti Anda. Donasi ke Signal"
