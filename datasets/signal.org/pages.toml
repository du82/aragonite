["https://signal.org/et"]
title = "Signal >> Avaleht"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Tere tulemast teistsugusesse suhtluselamusse. Eriliselt suur rõhk on privaatsusel, mis on kombineeritud kõigi tavafunktsioonidega. Kõrgetasemeline otspunktkrüptimine (mis kasutab avatud lähtekoodiga Signali Protocoli) hoiab sinu vestlused turvalisena. Me ei saa sinu sõnumeid lugeda ega sinu kõnesid kuulata ning seda ei saa teha ka keegi teine. Privaatsus ei ole valikuline – see on Signali lahutamatu osa. Iga sõnumi ja iga kõne puhul, alati. Saada tasuta tekstsõnumeid, häälsõnumeid, fotosid, videoid, GIFe ja faile. Signal kasutab sinu telefoni andmesideühendust, nii väldid SMS- ja MMS-teenustasusid. Tee teises linnas või teisel pool ookeani elavate sõpradega kristallselgeid hääl- ja videokõnesid, ilma kaugekõnetasudeta. Lisa krüptitud kleebiste abil oma vestlustele uus väljenduskiht. Samuti saad ise luua ja jagada kleebisepakke. Signalis pole ei reklaame, vahendusturustajaid ega hirmuäratavat jälgimist. Nii et keskendu oluliste hetkede jagamisele sulle oluliste inimestega. Signal on sõltumatu mittetulundusühing. Me ei ole seotud ühegi suure tehnoloogiaettevõttega ja mitte ükski neist ei saa meid ka tulevikus ära osta. Tarkvaraarendust toetatakse toetuste ja annetuste kaudu inimestelt nagu sina. Anneta Signalile"
