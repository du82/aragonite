title = "Signal >> Home"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = '''Mag-"hello" sa kakaibang messaging experience. Isang hindi inaasahang focus sa privacy, kasama ang lahat ng features na inaasahan mo. State-of-the-art end-to-end encryption (powered ng open source Signal Protocol) na nagpapanatiling ligtas ang lahat ng conversations mo. Hindi namin mababasa ang iyong messages o mapakikinggan ang mga tawag mo, at hindi rin ito magagawa ng iba. Hindi optional ang iyong privacy — ganyan gumagana ang Signal. Bawat message, bawat tawag, anumang oras. Mag-share ng text, voice messages, photos, videos, GIFs, at files nang libre. Ginagamit ng Signal ang iyong data connection para maiwasan mo ang SMS at MMS fees. I-enjoy ang crystal-clear voice at video calls sa mga taong malapit man o malayo sa'yo nang walang long-distance charges. Magdagdag ng bagong layer of expression sa iyong conversations gamit ang encrypted stickers. Pwede ka ring gumawa at mag-share ng sarili mong sticker packs. Walang ads, walang affiliate marketers, at walang creepy tracking dito sa Signal. Kaya makakapag-focus ka sa pag-share ng moments na mahalaga sa'yo at sa mga minamahal mo. Ang Signal ay isang independent nonprofit. Hindi kami nakatali sa anumang major tech companies, at hindi rin kami pwedeng i-acquire ng mga ito. Ang development ng Signal ay suportado ng mga donation mula sa mga taong kagaya mo. Mag-donate sa Signal'''
