title = "Signal >> Home"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Prova un'esperienza di comunicazione diversa dal solito: tutte le funzioni che ti servono con un livello di privacy insuperabile. Scopri qui sotto i motivi per cui Signal è un'applicazione di messaggistica sicura, semplice ed efficace Una crittografia avanzata end-to-end (sviluppata dal Protocollo Signal open source) mantiene le tue conversazioni al sicuro. Non possiamo leggere i tuoi messaggi o ascoltare le tue chiamate, e nessun'altra terza parte può farlo. La privacy non è un'opzione, ma il focus di ogni funzione di Signal. Privacy per ogni messaggio e ogni chiamata, sempre! Condividi messaggi scritti e vocali, fotografie, video, GIF e file gratuitamente. Signal usa la connessione dati del tuo telefono, così eviti costi legati a SMS e MMS. Effettua chiamate vocali e videochiamate di alta qualità con persone che vivono nella tua città o dall'altra parte del mondo, senza costi aggiuntivi per la lunga distanza. Esprimiti come preferisci, anche usando adesivi protetti dalla crittografia. Puoi anche creare e condividere il tuo pacchetto di adesivi con chi vuoi. Non ci sono annunci, nessun rivenditore affiliato né tracciamento invasivo in Signal. Così puoi dedicarti alla condivisione dei momenti che contano con le persone più vicine a te. Signal è indipendente e no profit. Non siamo legati o vincolati a nessuna grande compagnia tecnologica, e non saremo mai acquistati da altre società. Lo sviluppo è supportato da contributi e donazioni fatte proprio da persone come te. Dona a Signal"
