full_description = 'និយាយថា "សួស្តី" ជាការស្វាគមន៍ចំពោះបទពិសោធន៍ផ្ញើសារបែបថ្មី។ ការយកចិត្តទុកដាក់ជាពិសេសលើឯកជនភាព រួមផ្សំជាមួយនឹងមុខងារទាំងអស់ដែលអ្នករំពឹងទុក។ ស្វែងយល់ខាងក្រោមដើម្បីដឹងថាហេតុអ្វីបានជា Signal គឺជាកម្មវិធីផ្ញើសារដ៏ងាយស្រួល អស្ចារ្យ និងមានសុវត្ថិភាព មុខងារអ៊ីនគ្រីបសងខាងដ៏ទំនើបបំផុត (ដំណើរការដោយពិធីសារ Signal កូដចំហ) រក្សាការសន្ទនារបស់អ្នកឲ្យមានសុវត្ថិភាព។ គ្មាននរណាម្នាក់អាចអានសារ ឬស្តាប់ការហៅទូរសព្ទរបស់អ្នកបានទេ សូម្បីតែយើងក៏ដោយ។ ឯកជនភាពមិនមែនជាមុខងារស្រេចចិត្តនោះទេ តែវាជាគោលការណ៍សម្រាប់ដំណើរការ Signal។ សម្រាប់គ្រប់សារ គ្រប់ការហៅចេញ និងគ្រប់ពេលវេលា។ ចែករំលែកអត្ថបទ សារជាសំឡេង រូបថត វីដេអូ រូបចលនា និងឯកសារដោយឥតគិតថ្លៃ។ Signal ប្រើសេវាពីការភ្ជាប់ទិន្នន័យរបស់ទូរសព្ទអ្នក ដើម្បីកុំឲ្យអ្នកបង់ថ្លៃសេវាផ្ញើសារជាអក្សរ និងសារពហុមេឌៀ។'
