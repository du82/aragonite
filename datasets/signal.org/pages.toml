title = "Signal >> Aloitus"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Tervehdi uudenlaista viestintävaihtoehtoa. Se tarjoaa kaikki odottamasi ominaisuudet ja suojelee lisäksi tehokkaasti yksityisyyttäsi. Huippuluokan päästä päähän -salaus (pohjautuu avoimen lähdekoodin Signal-protokollaan) suojaa keskustelusi. Me emme voi lukea viestejäsi tai kuunnella puheluitasi, eivätkä muutkaan. Yksityisyys ei ole valinnaista – se on Signalin toimintaperiaate. Kaikki viestit ja puhelut salataan joka hetki. Jaa tekstiä, ääniviestejä, kuvia, videoita, GIF-tiedostoja ja muita tiedostoja ilmaiseksi. Signal käyttää puhelimesi verkkoyhteyttä, joten vältät tekstiviesti- ja multimediamaksut. Kristallinkirkkaat ääni- ja videopuhelut kaupungin tai valtameren toisella puolella asuville onnistuvat ilman kaukopuhelumaksuja. Lisää ilmeikkyyttä keskusteluihin salatuilla tarroilla. Voit myös luoda ja jakaa omia tarrakokoelmia. Signalissa ei ole mainoksia, eikä Signal käytä markkinointikumppaneita tai seurantaevästeitä. Voit keskittyä jakamaan tärkeät hetket sinulle tärkeiden ihmisten kanssa. Signal on yksityinen voittoa tavoittelematon taho. Emme ole sidoksissa suuriin teknologiayrityksiin emmekä voi päätyä sellaisen haltuun. Kehitystä tuetaan apurahoin ja kaltaistesi ihmisten lahjoituksilla. Lahjoita Signalille"
