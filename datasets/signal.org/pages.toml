["https://signal.org/ja"]
title = "Signal >> 自宅"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "他のものとは違うメッセンジャーアプリを使ってみませんか。いまだかつてないレベルでプライバシーを保護しつつ、メッセンジャーアプリに求められるすべての機能をご利用いただけます。 Signal がシンプルで、強力で、安全なメッセンジャーである理由を説明します。 オープンソースの Signal Protocol を利用した最先端のエンドツーエンド暗号化により、会話の安全性を確保します。Signal の運営サイドを含む他の誰も、あなたのメッセージを盗み読んだり通話を傍受したりすることはできません。プライバシーはオプション設定ではありません。Signal では、すべてのメッセージと通話が常に暗号化されます。 テキスト、音声メッセージ、写真、動画、GIF、ファイル等を無料で共有できます。Signal では、端末のデータ通信を使用して通信が行われるため、SMS や MMS の料金はかかりません。 町の向こう側に住んでいる人、または海の向こう側に住んでいる人と、電話料金なしでクリアな音声通話とビデオ通話が可能です。 暗号化されたステッカーで会話の表現の幅を広げましょう。また、独自のステッカーパックを作成したり、共有したりもできます。 グループチャットを使えば、家族、友人、同僚と簡単に連絡を取り合うことができます。 Signal には、広告も、アフィリエイトマーケティングも、不気味なトラッキングもありません。なので、大切な人と、大切な瞬間を共有することに集中できます。 Signal は独立非営利団体です。私たちは大手 IT 企業の傘下ではありませんし、どこかの企業に買収されることもありません。 Signal の開発は、皆さまからの支援や寄付によって支えられています。 Signalへの寄付"
