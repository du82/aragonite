full_description = 'Esan "kaixo" mezularitza-esperientzia ezberdin bati. Beste inork ez bezala zaintzen du pribatutasuna, espero dituzun funtzio guztiak alde batera utzi gabe. Puntako muturretik muturrerako enkriptatzeari esker (zeina Signal-en kode irekiko protokoloen teknologian oinarrituta baitago), elkarrizketak seguru mantentzen dira. Ezin ditugu irakurri zure mezuak, ez eta zure deiak entzun ere; ez guk, ez beste inork. Pribatutasuna ez da aukerako modu bat; Signal-ek funtzionatzen duen modua da. Mezu eta dei bakoitzean. Salbuespenik gabe. Partekatu testuak, ahots-mezuak, argazkiak, bideoak, GIFak eta fitxategiak doan. Signal-ek telefonoaren datu-konexioa erabiltzen du, SMS eta MMSen kostuak ordaindu behar ez izateko. Egin ahots-deiak eta bideodei garbi-garbiak, dela zure herrian bizi den norbaitekin, edo dela beste herrialde batean bizi den norbaitekin, distantzia luzeko deien kargurik ordaindu gabe. Gehitu adierazpen-geruza berri bat elkarrizketei eranskailu enkriptatuekin. Zeure eranskailu-paketeak sortu eta parteka ditzakezu, baita ere. Signal-en ez dago iragarkirik, ez dugu merkaturatzaile afiliaturik, eta inork ez dizu egingo jarraipen arrarorik. Beraz, jarri arreta gauza garrantzitsuetan, eta parteka itzazu pertsona garrantzitsuekin. Signal irabazi-asmorik gabeko erakunde independente bat da. Ez gaude teknologia-enpresa handiekin lotuta, eta halako enpresek ez gaituzte inoiz erosiko. Zu bezalako pertsonen diru-laguntza eta dohaintzei esker da posible Signal-en garapena. Egin dohaintza Signal-i'
