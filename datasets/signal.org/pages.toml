full_description = "Башкача жол менен баарлашыңыз. Купуялыкка басым жасаган бардык керектүү функциялар бар. Сүйлөшүүлөрүңүздүн купуялыгын камсыз кылуу үчүн Signal баштапкы коду ачык протоколго негизделген заманбап баштан-аяк шифрлөө ыкмасын колдонот. Жазышканыңар же чалышканыңар эч кимге көрүнбөйт да, угулбайт. Жада калса, бизге дагы. Купуялык — кошумча режим эмес, Signal кызматынын иштөө принциби. Ар бир билдирүү, ар бир чалуу, ар убакта корголот. Текст түрүндө, үн менен, сүрөттөр, видеолор жана башка файлдар аркылуу акысыз баарлашыңыз. Signal мобилдик Интернетти колдонгондуктан, SMS жана MMS үчүн акы төлөбөйсүз. Башка шаардагы же океандын аркы жагындагы адамдар менен аудио жана видео режиминде дапдаана сүйлөшө аласыңар. Эл аралык байланыш үчүн акы төлөбөйсүз. Оюңуздагы нерсени шифрленген стикерлер менен таасын жеткире аласыз. Өзүңүздүн жеке стикерлериңизди түзүп алсаңыз болот. Үй-бүлөңүз, досторуңуз жана кесиптештериңиз менен топтошуп алып сүйлөшсөңүз болот. Signal'да жарнамалар жана өнөктөш соодагерлер жок. Эч ким көз салбайт. Андыктан жакындарыңыз менен баалуу нерселериңизди коркпой эле бөлүшө бериңиз."
