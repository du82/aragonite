["https://signal.org/lt"]
title = "Signal >> Pagrindinis"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Nerk į kitokią žinučių siuntimo patirtį – visos funkcijos, kurių tu tikiesi, plius netikėtas, bet didelis dėmesys privatumui. Toliau paaiškinsime, kodėl „Signal“ yra paprasta, efektyvi ir saugi susirašinėjimo programėlė Pažangus ištisinis šifravimas (pagrįstas atvirojo šaltinio „Signal“ protokolu) užtikrina pokalbių saugumą. Nei mes, nei kas kitas negali skaityti tavo žinučių ar klausytis pokalbių. Privatumas nėra papildoma funkcija – tai neatsiejama „Signal“ savybė. Su kiekvienu skambučiu ir kiekviena žinute, visada. Nemokamai bendrink teksto ir balso žinutes, nuotraukas, vaizdo įrašus, GIF vaizdus ir failus. „Signal“ naudoja telefono duomenų ryšį, kad nebūtų SMS bei MMS mokesčių. Itin kokybiški balso ir vaizdo skambučiai ir į tą patį miestą, ir už vandenyno, be tarptautinių skambučių tarifų. Suteik pokalbiams daugiau išraiškingumo su užšifruotais lipdukais. Gali netgi kurti ir bendrinti nuosavus lipdukų paketus. Programėlėje „Signal“ nėra reklamų, rinkodaros pasiūlymų ir sekimo. Tad galvok tik apie svarbius dalykus, kuriais nori pasidalinti su tau svarbiais žmonėmis. „Signal“ yra nepriklausoma pelno nesiekianti organizacija. Nesame susieti su jokia technologijų milžine ir niekas niekada mūsų nenupirks. Kūrimą išlaiko dotacijos ir parama, kurią skiria tokie žmonės kaip tu. Paremk programėlę „Signal“"
