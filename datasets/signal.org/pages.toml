["https://signal.org/bs"]
title = "Signal >> Početna stranica"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Pozdravite drugačije iskustvo slanja poruka. Neočekivani fokus na privatnost, u kombinaciji sa svim očekivanim funkcijama. Istražite u nastavku da vidite zašto je Signal jednostavna, moćna i sigurna platforma za razmjenu poruka Najmodernije sveobuhvatno šifriranje (pokreće se protokolom otvorenog koda Signala) osigurava vaše razgovore. Ne možemo čitati vaše poruke niti slušati vaše pozive, a ne može ni niko drugi. Privatnost nije opcionalni način rada – to je samo način na koji Signal funkcionira. Svaka poruka, svaki poziv, svaki put. Besplatno dijelite tekst, glasovne poruke, fotografije, video zapise, GIF-ove i datoteke. Signal koristi vezu za prijenos podataka vašeg telefona da možete izbjeći naknade za SMS i MMS. Upućujte jasne glasovne i video pozive ljudima koji žive u drugom dijelu grada ili preko okeana, bez troškova poziva na veće udaljenosti. Dodajte novi sloj izražavanja svojim razgovorima pomoću šifriranih naljepnica. Također možete kreirati i dijeliti vlastite pakete naljepnica. Grupni razgovori olakšavaju da ostanete povezani sa svojom porodicom, prijateljima i kolegama na poslu. U Signalu nema reklama, razmjene reklama i jezivog praćenja. Zato se fokusirajte na dijeljenje važnih trenutaka s osobama koje su vam važne. Signal je nezavisna neprofitna organizacija. Nismo vezani ni za jednu veliku tehnološku kompaniju, a ni jedna nas nikada ne može kupiti. Razvoj je podržan grantovima i donacijama ljudi poput vas. Donirajte za Signal"
