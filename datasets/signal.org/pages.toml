["https://signal.org/da"]
title = "Signal >> Hjem"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = '''Sig "hej" til en anderledes beskedoplevelse. Et uventet fokus på databeskyttelse kombineret med alle de funktioner, du forventer. Avanceret E2E-kryptering (drevet af Signals open source-protokol) holder dine samtaler sikre. Vi kan ikke læse dine beskeder eller lytte til dine opkald, og det kan andre heller ikke. Databeskyttelse er ikke en valgfri indstilling – det er måden, Signal fungerer på. Hver besked, hvert opkald, hver gang. Del tekst, talebeskeder, billeder, videoer, GIF'er og filer gratis. Signal bruger din telefons dataforbindelse, så du kan undgå sms- og mms-gebyrer. Foretag krystalklare tale- og videoopkald med folk, der bor på tværs af byen eller endda på den anden side af verden uden at skulle betale ekstra for udlandstelefoni. Føj et nyt udtryk til dine samtaler med krypterede klistermærker. Du kan også oprette og dele dine egne klistermærkepakker. Der er ingen reklamer, ingen tilknyttede marketingsfolk og ingen væmmelige trackere i Signal. Så fokusér på at dele de øjeblikke der virkelig betyder noget, med de mennesker, der betyder noget for dig. Signal er drevet uafhængigt og uden profit for øje. Vi er ikke bundet til nogen større teknologivirksomheder, og vi kan heller aldrig blive opkøbt af nogen. Udviklingen støttes af tilskud og donationer fra folk som dig. Donér til Signal'''
