["https://signal.org/ar"]
title = "Signal >> الصفحة الرئيسية"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "رحبوا بتجربة جديدة مع التراسل الفوري. التركيز أساسًا على الخصوصية، إضافة إلى كل الميزات التي تتوقعونها. تحمي أحدث وسائل التعمية التواصل من طرف إلى طرف (المدعومة بواسطة بروتوكول Signal المفتوح المصدر) مُحادثاتكم. لا نستطيع قراءة رسائلكم ولا التنصت على مكالماتكم، ولن يتمكّن أحد من فعل ذلك أيضًا. الخصوصية ليست خيارًا — إنها طريقة اشتغال Signal في كل رسالة، وفي كل مكالمة، وطول الوقت. شاركوا النصوص والرسائل الصوتية والصور والفيديوهات والصور المتحركة والملفات مجانًا. يستخدم Signal بيانات اتصال هاتفك المحمول لتفادي رسوم إضافية على الرسائل القصيرة ورسائل الوسائط المتعددة. قوموا بإجراء المكالمات بالصوت والصورة بوضوح كالشمس مع أشخاص يعيشون في الضفة المقابلة من المدينة، أو في الجانب الآخر من المُحيط، وذلك دون دفع أي نفقات عن الاتصالات الدولية. إضافة شكل جديد من التعابير إلى مُحادثاتكم باستخدام ملصقات مُعمَّاة. يمكنكم أيضًا إنشاء ومشاركة حزمتكم الخاصة من الملصقات. تسمح لكم المحادثات الجماعية بالتواصل مع العائلة والأصدقاء والزملاء. لا يحتوي Signal على أي إعلانات ولا ينتمي لأي مروّج لتسويق المنتجات، ولا على أي أداة تعقب. لذا ركزوا فقط على مشاركة اللحظات التي تهمكم مع الأشخاص الذين يهمونكم. إن Signal مؤسسة مستقلة وغير ربحية. لسنا مرتبطين بأي شركة تكنولوجيا، ولن يجري الاستحواذ علينا أبدًا من أي منها. يجري دعم التطوير بواسطة التبرعات والهبات من أشخاص مثلك. تبرَّع لـ Signal"
