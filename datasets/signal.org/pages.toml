title = "Signal >> Sākums"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = "Iepazīstiet citādu ziņapmaiņu. Pārsteidzoši augsts privātuma līmenis apvienojumā ar visām ierastajām funkcijām. Skatiet tālāk norādīto informāciju, lai noskaidrotu, kāpēc Signal ir vienkārša, efektīva un droša ziņapmaiņas lietotne. Moderna pilnīga šifrēšana (ko nodrošina atvērtā koda Signal protokols) nozīmē, ka jūsu sarunas būs drošas. Mēs neveram izlasīt jūsu ziņas vai noklausīties jūsu sarunas, un to nevarēs arī neviens cits. Privātums nav izvēles režīms — tas ir veids, kādā Signal darbojas. Visi ziņojumi, visi zvani, vienmēr. Bez maksas kopīgojiet tekstu, balss ziņas, fotoattēlus, video, GIF un failus. Lietotne Signal izmanto tālruņa datu savienojumu, lai jums nebūtu jāmaksā par īsziņām (SMS) un multiziņām (MMS). Bez maksas veiciet kristālskaidrus balss un video zvanus cilvēkiem, kuri dzīvo otrpus pilsētai vai okeānam — vairs nekādas tālsarunu maksas. Piešķiriet savām sarunām jaunu ekspresivitātes slāni, izmantojot šifrētas uzlīmes. Varat arī izveidot savus uzlīmju komplektus, kā arī tos kopīgot. Lietotnē Signal nav reklāmu, nav tirdzniecības aģentu un nav šermuļus uzdzenošas izsekošanas. Tādēļ visu savu uzmanību varat veltīt kopīgam laikam ar jums svarīgiem cilvēkiem. Signal ir neatkarīga bezpeļņas lietotne. Mēs neesam piesaistīti nevienam lielam tehnoloģiju uzņēmumam, kā arī šādi uzņēmumi mūs nekad nepārņems. Izstrādi ar dāvinājumiem un ziedojumiem finansiāli atbalsta tādi cilvēki kā jūs. Ziedot Signal"
