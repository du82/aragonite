["https://signal.org/blog/blur-tools"]
title = "Signal >> Blog >> Blur tools for Signal"
description = "Right now, people around the world are marching and protesting against racism and police brutality, outraged by the most recent police murders of George Floyd and Breonna Taylor. At Signal, we support the people who have gone into the streets to make their voices heard. We believe that something ..."
full_description = "Blur tools for Signal moxie0 on 03 Jun 2020Right now, people around the world are marching and protesting against racism and police brutality, outraged by the most recent police murders of George Floyd and Breonna Taylor. At Signal, we support the people who have gone into the streets to make their voices heard. We believe that something in America needs to change, and even if we don’t know exactly how, we support and trust in the people who are self-organizing around the country to figure it out.Many of the people and groups who are organizing for that change are using Signal to communicate, and we’re working hard to keep up with the increased traffic. We’ve also been working to figure out additional ways we can support everyone in the street right now.One immediate thing seems clear: 2020 is a pretty good year to cover your face.The latest version of Signal for Android and iOS introduces a new blur feature in the image editor that can help protect the privacy of the people in the photos you share. Now it’s easy to give every face a hiding place, or draw a fuzzy trace over something you want to erase. Simply tap on the new blur tool icon to get started.This update has already been submitted to the app stores, and it will begin rolling out as soon as possible.Blurring the linesThe new blur feature leverages the latest system and platform-level libraries for Android and iOS. In order to maintain your privacy, all of the processing happens locally on your own device.These system libraries are not perfect. They don’t detect every face 100% of the time, and these flaws and potential biases meant that it was important to extend their default functionality so that you can always draw with the blur brush to manually obscure additional faces or areas in a photo.Encrypt your faceWe want to do something outside of the app too, so we’ll be distributing versatile face coverings to the community free of charge. We’ve been working to find a manufacturer capable of producing high volumes of face coverings in the current global circumstances. We’re finalizing a few remaining details and will provide more information soon.Speak freely. Stay safe. Send a message. Tweet FacebookDon't have Signal? Give it a try!"
