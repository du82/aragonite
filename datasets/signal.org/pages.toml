title = "Signal >> Signal Brand Assets"
description = 'Say "hello" to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'
full_description = '''Welcome to Signal's Brand Assets site. Here you'll find brand guidelines and downloadable assets as well as information on obtaining permission to use Signal Brand Assets in your own work. Signal's "Brand Assets" refer to the Signal word mark, Signal Logo, Signal design marks, Signal app icon, and other artwork and design elements associated with Signal. We developed this guide to outline the Do's and Don'ts of using Signal's Brand Resources. Spell and capitalize the Signal Trademarks exactly as they are shown on the Signal Trademarks page. Use the Signal Trademarks as an adjective; do not use the Signal Trademarks as a noun or verb, or in a way that suggests a common, descriptive, or generic meaning. Only use the official Signal Logo that is available from the Signal Brand Assets website. Do not alter or modify the logo in any way other than scaling proportionally. Keep in mind the following guidelines for using the Signal Logo: When placing the Signal Logo near other elements, utilize a clear space of at least half (0.5x) the size of the logo around it. A minimum size ensures that the impact and legibility of the glyph is not compromised in application. Always maintain their set proportions and never show the glyph smaller than 26x26 pixels. You may not use Signal logos or images in your TV show, film, book, play, or visual media without explicit written permission from Signal. To request permission to use Signal's brand assets please contact us at [email protected], and we will review your request. You will be asked a few questions to help us determine your intended use of Signal's brand assets. We are happy to see developers leverage Signal's open source to create privacy preserving applications and technology. You may use Signal's open source under the terms of the AGPLv3 license. You are required to publish any modifications back to the open source community and provide attribution that Signal's code was used. You may not use Signal's trademark in connection with your service — i.e. it must be clear that you own and operate your service, product or application, not Signal.'''
