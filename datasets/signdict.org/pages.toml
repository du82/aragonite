full_description = 'Willkommen Danke, das du eine neue Gebärde zu "aber" aufnehmen willst. Damit die Aufnahme gut wird, gibt es ein paar Kleinigkeiten zu beachten. Lese am besten den unten stehen Text durch, bevor du das erste mal eine Aufnahme probierst. Wenn du schon weißt, wie das ganze funktioniert, kannst du auch direkt mit der Aufnahme starten mit Klick auf den Button: <p class="sc-alert sc-alert--success" role="alert"> Du musst Javascript aktivieren für diese Funktion. </p> Neue Gebärde aufnehmen Allgemeines Für die Aufnahme werden wir deine Webcam benutzen. Du brauchst also keine teure Videokamera. Falls nötig, schließe deine Webcam jetzt an deinen Computer an bevor du weiter machst. Damit die Aufnahme reibungslos funktioniert, musst du einen modernen Browser wie Chrome oder Firefox benutzen. Neutralität Bitte versuche, die Gebärde so neutral wie möglich aufzunehmen. Lachen, Weinen oder übertriebene Bewegungen solltest du vermeiden. Hintergrund Achte darauf, das sich nichts im Hintergrund bewegt. Am besten nimmst du die Gebärden vor einer einfarbigen Wand auf, damit nichts von der eigentlichen Gebärde ablenkt. Beleuchtung Für die Aufnahme solltest du gut ausgeleuchtet sein. Wenn es zu dunkel ist, sind deine Hände nicht gut zu erkennen. Filme nicht gegen die Sonne oder mit einer Lampe die direkt in die Webcam leuchtet. Position Falls möglich solltest du für die Aufnahme stehen. Die Kamera sollte dich von deinem Kopf bis zur Hüfte aufnehmen. Länge Nachdem du das Video aufgenommen hast, wirst du die Möglichkeit haben, den Beginn und das Ende zu schneiden. Bitte kürze das Video so, das es nur die eigentliche Gebärde zeigt und keine langen Pausen davor/danach hat. Beispiel Ein gutes Beispiel für ein Video findest du hier. Kann es los gehen? Dann klicke hier: <p class="sc-alert sc-alert--success" role="alert"> Du musst Javascript aktivieren für diese Funktion. </p> Neue Gebärde aufnehmen'
