full_description = "Was ist SignDict? SignDict ist offenes Gebärdensprach-Wörterbuch zum Mitmachen. Fehlt eine Gebärde oder gibt es andere Varianten? Dann kann diese einfach mit einem Klick aufgenommen und hinzugefügt werden. Alles was du dazu brauchst ist deine Webcam. Der Name SignDict setzt sich zusammen aus Sign, dem englischen Wort für Gebärde, und Dictionary, dem englischen Wort für Wörterbuch. Dieses Projekt wird durch den Prototype Fund gefördert. Entwicklungsbeginn war der 1. März 2017. Für wen wird das gebaut? Dieses Wörterbuch richtet sich an Gebärdende und an Personen, die diese Sprache erlernen wollen. Es soll als Nachschlagewerk und Lernhilfe dienen und die Sichtbarkeit der Gebärdensprache im öffentlichen Raum erhöhen. Wieso wird SignDict benötigt? Das Ziel ist es, das erste interaktive Gebärdensprach-Wörterbuch im Internet aufzubauen, bei dem jede:r ohne technisches Vorwissen mitmachen kann. Wenn du nach Gebärdensprach-Wörterbüchern im Internet suchst, wirst du einige finden. Leider haben die meisten nur ein paar hundert Gebärden und erlauben es nicht, weitere Gebärden hinzuzufügen. Dazu kommt, dass in der deutschen Gebärdensprache eine große Anzahl an Variationen für ein Wort existiert. In Wörterbüchern wird allerdings oft nur eine Variante angezeigt. Ich möchte versuchen, bei SignDict möglichst viele Gebärden-Varianten eines Wortes zu sammeln. Daher kam die Idee, ein gemeinsames Wörterbuch aufzubauen: Jede:r kann mitmachen und Gebärden hinzufügen. Viele Computer haben heutzutage eine Webcam mit der du ganz einfach eine Gebärde aufnehmen und hinzufügen kannst. So bauen wir zusammen als Gebärdensprach-Community ein interaktives Nachschlagewerk auf, das so viele Gebärden wie möglich in mehreren Gebärdensprachen enthält. Den Anfang machen wir mit der deutschen Gebärdensprache (DGS). Warum baue ich diese Seite? (Foto von Carolin Weinkopf) Ich bin ein CODA, meine Eltern sind gehörlos, und ich träume schon seit dem ersten Auftauchen von Videos im Internet von genau so einem Wörterbuch. 2013 habe ich zusammen mit einigen weiteren Menschen in einem Programmierwettbewerb die Machbarkeit getestet. Leider musste ich damals feststellen, dass es technisch noch nicht ohne weiteres möglich war, dieses Projekt nach meinen Vorstellungen umzusetzen. Zum Glück sind diese Probleme nun gelöst und unserem gemeinsamen Gebärdensprach-Wörterbuch steht nichts mehr im Weg. OpenSource Die Videos werden unter einer Creative Commons Lizenz und der Quelltext unter die MPL gestellt. Finanzierung Dieses Projekt war Teilnehmer der 1. Runde des Prototype Fund und wurde durch das Bundesministerium für Bildung und Forschung gefördert. Danke an die Jury für die Auswahl meines Projektes für den Prototype Fund. SignDict ist nicht kommerziell. Dank der Unterstützung von vielen Menschen und Firmen können wir die Kosten für den Server und das Video-Hosting decken. Alle Einnahmen die über diese Kosten hinaus gehen, werden gespendet."
author = "SignDict"
year_published = 2025
