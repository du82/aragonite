title = "SigOpt Open Source Solutions"
full_description = "SigOpt has always been designed with customer privacy in mind. With the release of our self-hosted server solution, SigOpt users can run SigOpt in whatever environment they want, and without any data leaving their servers. >> git clone https://github.com/sigopt/sigopt-server.git Self-hosted documentation SigOpt usage documentation In addition to our self-hosted SigOpt server, we also have released a version of SigOpt’s core module that can be run in-memory. Running >> pip install 'sigopt[lite]' lets you use the standard SigOpt connection to power a SigOpt experiment with SigOpt’s computation running locally. Core module documentation SigOpt-Lite documentation"
