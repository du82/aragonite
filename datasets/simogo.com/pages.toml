full_description = "Year Walk Wii U Trailer To promote the Wii U version of Year Walk, we wanted to show off all the new features. In the usual Simogo Do-It-Yourself spirit we built a small shooting studio inside our office, using black fabric, plastic bags and a party tent. Gordon went out into the woods to collect branches, which he painted white, and we bought a lot of small spotlights to light the scene. Magnus Eriksson, who had built the puzzle box used in photos in the game, built a horse head mask. We asked the tallest guy we know, Stig Schöpzinsky Nielsen, to play the part of the horse-man and filmed the entire trailer using iPhones in a few hours. About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
