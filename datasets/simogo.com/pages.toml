["https://simogo.com/work/loreleiandthelasereyes/linnea-olsson-about-lorelei-and-the-laser-eyes"]
title = "Linnea Olsson about Lorelei and the Laser Eyes – Simogo"
description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "Linnea Olsson about the music in Lorelei and the Laser Eyes Simon sent a long text, about references and inspiration they had. I got to see some early still images and videos. It felt a lot of fun to be involved in creating music in such an early stage of the game. It was a dynamic process that made the music and the game grow together. From what I saw and read, I was immediately put into a mysterious and slightly mad feeling. I wanted the music to be beautiful, but also have elements that didn’t feel quite right. We quickly realized that Daniel would be the one to put mine and his songs together into a unified soundscape. I sent files across the Atlantic to him, and he put his touch on my pieces. Working with Daniel is easy and fun and I’m very happy with how everything has been tied together. About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
