["https://simogo.com/device-6-posters"]
title = "DEVICE 6 – Posters – Simogo"
description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "DEVICE 6 Posters After finishing DEVICE 6, we had fallen in love with vintage Nancy Drew covers, and we got the idea that it would be fun to create a piece of promotional art in this style. Simon created some very crude collage mockup, before sending it to the talented illustrator Junkboy, who agreed to help us out. The promotional art would eventually become a poster for sale at Fangamer. The Island Mystery at The Twin CastlesA 18″ x 24″ reproduction of a cover for an unreleased paperback, found in large quantities in several boxes at an abandoned printing shop in Sheffield. The back cover describes the adventure of a cunning woman named Anna who wakes up on a remote island. A list of other titles such as “The Clue in the Stuffed Crocodile” and “The Talking Mannequin Cipher”, suggest that there were several “Interactive Mysteries” produced in what appear to be called the “HAT series”. To create an aura of mystery and expand on the story of HAT, we decided to create another poster, and give each of them a back story. This also gave us the opportunity to fix an error in the game. In the second chapter, the east castle is called the west castle, and the west castle is called east. We came up with a story for this error. The map poster was printed on really thick matte paper, which gave it a very authentic look. It also featured what looked like smudge from other prints, which further expanded the lore surrounding HAT. Simulation Area 1 & 2 Area PlansWe uncovered these curious 24″ x 18″ plans printed on natural matte paper onboard of Lily Christine, a fishing boat that mysteriously sailed ashore unmanned at Port Denison, December 2013. We’re not quite certain what purpose these plans serve, but they seem to outline some sort of operation by an organisation named HAT, and includes detailed floor plans and history for locations known as the Bear Bridge, West and East Castle. While the plans themselves appear to be new, the history described hark back to the early 20th century, and one Arkwright family. About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
year_published = 2025
