["https://simogo.com/work/year-walk/bedtime-stories-for-awful-children"]
title = "Bedtime Stories for Awful Children – Simogo"
description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "Bedtime Stories for Awful Children In the summer of 2015, we decided that we wanted to celebrate the upcoming release of Year Walk for Wii U in a special way. We had been talking to Jonas, writer on Year Walk, for a while about doing something Year Walk-related, that wasn’t a game. The idea of doing a collection of new folk tales came up quickly. Inspired by the stories told in the past in our cold side of the world, and the grim cautionary storybook Der Struwwelpeter, we created a small e-book called “Year Walk Bedtime Stories for Awful Children”. In this collection of stories designed to haunt both children and their parents, we revisited all the creatures from Year Walk and gave them one story each, with wonderful illustrations by Johanna Meijer, who had previously made the airprint illustrations for The Sailor’s Dream. Downloads Bedtime Stories for Awful Children (English) Contes du soir pour Vilains Enfants (Français) Cuentos para dormir para niños horribles (Español) Gutenachtgeschichten für unartige Kinder (Deutsch) Favole della Buonanotte per Bambini Tremendi (Italiano) About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
