["https://simogo.com/work/spl-t/spl-t-2"]
title = "SPL-T 2 – Simogo"
description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "SPL-T 2 Hidden in Lorelei and the Laser Eyes, is the only sequel we’ve made: SPL-T 2. We didn’t plan for the sequel to be better than SPL-T. On the contrary, it became clear to us early that it would be hard to improve on SPL-T, so instead we took the opportunity to provoke thoughts on the ideas of sequels in media overall; even when adding more elements, they often end up feeling inferior, sometimes even leaving you with the strange sensation of lessening your opinion on the predecessor. For a game like Lorelei and the Laser Eyes, a game that presents so many opinions and thoughts about art and entertainment, it felt like a good match. About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
