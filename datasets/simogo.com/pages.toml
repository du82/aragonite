["https://simogo.com/work/beat-sneak-bandit/rollovski"]
title = "Rollovski – Simogo"
description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "Rollovski, the 3DS Concept After finishing Beat Sneak Bandit back in 2012, we began to work on two prototypes. One would eventually become the game Year Walk, while the other one never got past the prototype stage. At the time, we were keen on doing something for the 3DS, so we decided to spend some time on concepting ideas with the hardware features in mind. Throughout a week or so, we went through ideas called The Great Ziorawski Acrobats, Common Sense Police, My Triangle Friend, Observe Agents and Inverto Maze, but only one would leave the idea stage and become a playable PC prototype. It was called Rollovski. A stealth game about a small limbless round detective, who must infiltrate a strange hotel with only circular rooms. As you can probably tell, it shares a lot of ideas with Beat Sneak Bandit, and we actually did imagine that this game took place in the same universe. It also shares one of its main ideas with Bumpy Road, as you don’t directly control the actual character, but rather the environments. The concept focused on two features of the Nintendo 3DS: the circle pad and the stereoscopic screen. In short, we imagined a game where circle pad being directly connected to a flat surface displayed on the 3D screen, so that they would “physically” move around, 1:1 to your thumb movements. We came up with the idea of having several surfaces layered in 3D, and having a ball rolling between them. The ball eventually became a round little detective and so the character Rollovski was born. The prototype was created in under two weeks, and as such it’s very basic and just presents the core concepts of the game. We have also uploaded an early concept PDF, which presents the project a little more in detail. The prototype has support for Xbox 360 controllers (you can download unofficial drivers for Mac here), but is playable with the arrow keys and space on a keyboard too (although it’s not as good). It doesn’t have any sound effects. This prototype was only created for PC and Mac, and was never playable on actual 3DS hardware. We did however produce two 3D screenshots of the game, to get a feel for how it would look in 3D. You can place these on your 3DS’ SD card, or view them in the browser on 3DS. Downloads Rollovski Prototype (PC)Rollovski Prototype (Mac)Rollovski 3D Screenshot 1Rollovski 3D Screenshot 2 Prototype Credits Art & designSimon Flesser Programming & designMagnus “Gordon” Gardebäck MusicDaniel Olsén About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
