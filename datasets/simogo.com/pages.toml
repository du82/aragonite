description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "SPL-T Rules When developing SPL-T, we discovered that changing the rules just slightly, resulted in very different playstyles and high scores. It quickly became apparent to us that having to rebuild the game each time we wanted to try out new rules was time consuming. Therefore, we made an in-game debug editor, in which we were able to totally tweak the game. The menu itself was enjoyable to use, and we considered releasing the game with it so players themselves could change the rules, but ultimately decided against it to keep the experience as pure as possible. It would also make comparing high scores too complex, and we had already decided to not include online leaderboards, to enthuse interactions and discussion about techniques between players, instead of just comparing numbers. When the game was released, a lot of players wondered if there was a definite solution to SPL-T. About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
