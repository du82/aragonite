["https://simogo.com/work/the-sailors-dream/the-early-sailors-dream-prototype"]
title = "The Early Sailor’s Dream Prototype – Simogo"
description = "Welcome to Simogo! We are a small videogame developer in Malmö, Sweden. We’re driven by the curiosity to explore interesting and surprising ideas. We create all kinds of games, for all kinds of platforms."
full_description = "The Early Sailor’s Dream Prototype In early 2014, we made a prototype for the idea which would become The Sailor’s Dream. The prototype was very basic. In fact, the only thing you could do was rotate the ship’s wheel, to control a little boat on a map. We imagined the structure to be close to The Legend of Zelda or Metroid, and the actual gameplay like a much more relaxed Steel Diver, only displaying the map, and having visits to harbors, islands and towns be driven by text. These visits would lead to be able to acquire new gadgets and parts for your boat, and hiring new crew members, to overcome different obstacles around the ocean. As we started writing small test stories, we abandoned this idea, as our focus shifted more towards the story. We thought this gameplay focused idea would contrast too much with the story. About Privacy Policy Bluesky Instagram Youtube © Simogo 2024"
