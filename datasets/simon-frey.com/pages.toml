["https://simon-frey.com/blog/wifionice-not-working-on-linux"]
title = "WIFIonICE not working on Linux - Blog by Simon Frey"
description = "The docker subnet interferes with the Deutsche Bahn Wifi and it makes WIFIonICE not working on Linux. Learn how to solve this problem."
full_description = '''WIFIonICE not working on Linux By Simon Frey Last updated: 2019-11-162024-01-19 show table of contents Solutions Temporary: Disable docker Permanently: Change docker0 subnet If you are reading this post and are currently suffering from Deutsche Bahn WIFIonICE not working on your Linux laptop ask yourself “Is docker running on my laptop?”. If not or you don’t know what docker is, I am sorry that this blog post will not help you. So you have docker running on your machine. The problem with WIFIonICE on Linux and docker is, that they use the same subnets for giving you IPs. A subnetwork or subnet is a logical subdivision of an IP network The practice of dividing a network into two or more networks is called subnetting.Wikipedia Solutions As you can not change the router of the train you need to fix/circumvent the issue on your laptop.: Temporary: Disable docker If you do not have work with docker during your train ride, the simplest option is to disable docker and the problem will be gone. Nicolas Kuttler build a neat little script to do that for your. Get it on his website: kuttler.eu/code/ice-wlan-linux-docker/Just execute the script with sh [your saved scripname].sh on to stop docker (weird that he uses the keyword on for actually shutting docker off :D)After you trainride you can reenable docker with sh [your saved scripname].sh off Permanently: Change docker0 subnet Searching trough the net I found several solutions on how to do that, involving iptables and stuff. But these solutions are all not permanent and take quite some steps. Easiest solution I found. Add a startup parameter to /etc/docker/daemon.json: { "bip": "172.17.77.1/24" } Which will tell the docker daemon on startup to use that certain subnet.Just restart your machine and the WIFIonICE should be working from now on. To never miss an article subscribe to my newsletter Join No ads. One click unsubscribe. Thank you for entering your email adress! Please now open your email Inbox and confirm your subscription .pulse { animation: pulse-animation 2s infinite; } @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(0, 0, 0, 0.2); } 100% { box-shadow: 0 0 0 20px rgba(0, 0, 0, 0); } } async function sendNewsletterForm(e,form){ const button = form.querySelector("button") e.preventDefault(); button.classList.add("pulse"); button.setAttribute("disabled", true); // Send form const res = await fetch(form.action, {method:'post', body: new FormData(form)}); button.classList.remove("pulse"); button.setAttribute("disabled", false); // Show sucess message if form worked if (res.url.includes("/success")){ // Load email open button const email = form.querySelector("input[type='email']").value.split("@"); if (email.length == 2){ const emailDomain = email[1] document.querySelector("sniper-link").setAttribute("recipient","@"+emailDomain); } form.querySelector(".newsletterInput").style.display="none"; form.querySelector(".newsletterSuccess").style.display="block"; } } Posted in Linux Tagged docker, linux, startup, website'''
