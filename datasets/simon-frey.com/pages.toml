title = "TabSub - Offline Javascript PubSub between browser tabs using local storage"
full_description = "TabSub offers you an easy to use Javascript PubSub via local storage. No server is required as all messages are shared via the browser built in local storage. Is this safe for a lot of concurrent writes? To be honest I have no clue. I tried to break it with 10 concurrent writers and everything worked as expected: No message got lost and the messages where in correct order. No warranty here, use at your own risk 😅 As TabSub uses local store this only works on the same domain, as the browser separates the local storage by domains as security measure. Start one of the two songs and than open this site in a second tab. You will see that the playing song time syncs and if you start the other song that the first one stops. Publish new message. The message can be of any type. Your callback in subscribe has to handle it correctly. TabSub does not take care about that. Get the current (static) state of a topic. Returns the current data in the local storage for this topic"
