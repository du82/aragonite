["https://simon-frey.com/blog/ai-super-powers-book-review"]
title = "Why China's AI companies are Kicking Our Ass - Blog by Simon Frey"
description = '''Most of what you think you know about AI is probably wrong. Dead wrong. And I'm not talking about the "robots-taking-over-the-world" kind of wrong (though that's wrong too). I'm talking about the fundamental "who's-winning-and-why" kind of wrong.'''
full_description = '''Why China’s AI companies are Kicking Our Ass By Simon Frey Last updated: 2025-01-272025-01-27 Look, I’m going to be straight with you: Most of what you think you know about AI is probably wrong. Dead wrong. And I’m not talking about the “robots-taking-over-the-world” kind of wrong (though that’s wrong too). I’m talking about the fundamental “who’s-winning-and-why” kind of wrong. I just finished reading Kai-Fu Lee’s “AI Superpowers,” and holy shit, we need to talk about this. This post was re-written with Claude and the prompt “Write it in the style of Mark Manson“ and if find it hilarious to read 😅 BUT if you want are more dialed down version, expand this. The Evolution and Current State of AI The journey of AI has been marked by two distinct approaches: expert systems and neural networks. While early AI development tried to encode human expertise into rule-based systems, today’s AI breakthroughs primarily build upon deep learning foundations. What’s particularly interesting is that recent AI achievements aren’t fundamental breakthroughs but rather clever applications of existing technology across various industries. The New Currency: Data, Not Just Talent One of the most striking revelations is how the AI landscape has shifted from being talent-driven to data-driven. While having brilliant researchers is important, the volume and quality of data have become the decisive factors in AI success. This creates a natural tendency toward monopolization, as companies with more data can create better products, attract more users, and gather even more data – creating an almost unbreakable cycle of dominance. The China Factor: A Different Approach to Innovation The book provides fascinating insights into China’s unique tech ecosystem. Unlike Silicon Valley’s mission-driven approach, Chinese entrepreneurs embrace a market-focused mindset, leading to intense competition and rapid iteration. The Chinese tech scene’s “colosseum” environment, where thousands of competitors fight for survival, has created some of the world’s most resilient business leaders. Silicon Valley’s Blind Spots Lee highlights several crucial weaknesses in Silicon Valley’s approach to global markets. Many U.S. companies fail internationally due to their rigid, one-size-fits-all strategy and their reluctance to adapt to local conditions. This is particularly evident in their treatment of international talent, where artificial ceilings often push ambitious professionals toward local competitors. The Real-World Advantage Unlike their Silicon Valley counterparts, Chinese tech companies have been forced to build complex operational infrastructures rather than remaining pure software platforms. While this approach requires more capital and effort, it has positioned them advantageously in the AI era by generating vast amounts of real-world data. The Future of Work and Society Perhaps the most thought-provoking aspects of the book concern the future of employment and society. Contrary to common belief, AI might automate white-collar knowledge work before many manual jobs, due to the relative ease of deploying software compared to developing complex robotics. This raises important questions about economic inequality and social stability. Lee criticizes the tech elite’s simplistic approach to these challenges, particularly their embrace of Universal Basic Income as a convenient solution that absolves them of deeper social responsibility. Conclusion “AI Superpowers” offers more than just a comparison of two tech ecosystems; it provides a crucial framework for understanding how AI will reshape our world. The book suggests that success in the AI era will require more than just technical excellence – it demands a nuanced understanding of data, markets, and human factors. As we move forward, the lessons from this book become increasingly relevant. Whether we’re entrepreneurs, policymakers, or simply citizens of an AI-powered world, understanding these dynamics will be crucial for navigating the challenges and opportunities ahead. Okay, now back to the Mark Manson version 😛 The Brutal Truth About Today’s AI First off, let’s cut the bullshit about AI “breakthroughs.” You know all those fancy headlines about AI beating humans at [insert impressive thing here]? Yeah, that’s not actually new AI. It’s just people getting better at using the same deep learning tech we’ve had for years. It’s like thinking you’ve invented a new kind of car because you painted it a different color. Why Having the Smartest People Doesn’t Mean Jack Anymore Here’s something that’ll piss off every Silicon Valley CEO: Having the best AI researchers doesn’t matter as much as they think it does. You know what matters? Data. Sweet, sweet data. Tons of it. It’s like having the world’s best chef won’t help you win a cooking competition if all you have is a single potato and some salt. The Chinese Tech Scene is a Bloodbath (And That’s Why They’re Winning) While Silicon Valley bros were sipping kombucha and talking about “changing the world,” Chinese entrepreneurs were engaging in digital gladiatorial combat. We’re talking thousands of companies literally copying each other to death until only the strongest survived. It’s like if you took capitalism, injected it with steroids, and then made it fight itself. Silicon Valley’s Head-Up-Its-Ass Problem Speaking of Silicon Valley, let’s talk about their spectacular face-plants in international markets. These companies strut into countries like China with their “we know best” attitude, refuse to adapt their precious business models, and then act surprised when they get their asses handed to them by local competitors. It’s like bringing a knife to a gunfight and then complaining that the rules aren’t fair. The Real Mind-F*ck: The Future of Work Ready for the really fun part? All those fancy white-collar jobs everyone’s parents wanted them to have? Yeah, those might be the first to go. Turns out, it’s easier to replace a tax accountant with AI than it is to build a robot that can clean your toilet. Let that sink in for a moment. The Tech Elite’s Cop-Out Solution And here’s where it gets really rich: The Silicon Valley solution to this impending job apocalypse? Universal Basic Income. It’s basically them saying, “Here’s some pocket change, now leave us alone to keep making billions.” It’s the technological equivalent of “let them eat cake.” The Bottom Line Look, here’s the truth: We’re not just facing a shift in technology; we’re facing a fundamental restructuring of how society works. And if you think that sounds dramatic, you’re not paying attention. China isn’t winning because they’re smarter or work harder (though they do work their asses off). They’re winning because they understood something we didn’t: In the AI age, data is king, and the messiness of reality is where the real value lies. The question isn’t whether AI will change everything – it will. The question is whether we’re going to get our shit together and deal with it like adults, or keep pretending that our old ways of doing things will somehow magically work in this new world. What Now? If you’re feeling uncomfortable after reading this, good. You should be. But don’t mistake discomfort for helplessness. Understanding these shifts is the first step toward adapting to them. And hey, if nothing else, at least you now know why your job might be replaced by an algorithm before your plumber’s. The world’s changing, folks. Time to pay attention. To never miss an article subscribe to my newsletter Join No ads. One click unsubscribe. Thank you for entering your email adress! Please now open your email Inbox and confirm your subscription .pulse { animation: pulse-animation 2s infinite; } @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(0, 0, 0, 0.2); } 100% { box-shadow: 0 0 0 20px rgba(0, 0, 0, 0); } } async function sendNewsletterForm(e,form){ const button = form.querySelector("button") e.preventDefault(); button.classList.add("pulse"); button.setAttribute("disabled", true); // Send form const res = await fetch(form.action, {method:'post', body: new FormData(form)}); button.classList.remove("pulse"); button.setAttribute("disabled", false); // Show sucess message if form worked if (res.url.includes("/success")){ // Load email open button const email = form.querySelector("input[type='email']").value.split("@"); if (email.length == 2){ const emailDomain = email[1] document.querySelector("sniper-link").setAttribute("recipient","@"+emailDomain); } form.querySelector(".newsletterInput").style.display="none"; form.querySelector(".newsletterSuccess").style.display="block"; } } Posted in Books'''
