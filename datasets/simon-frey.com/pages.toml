full_description = '''I Indeed Want It Enough By Simon Frey Last updated: 2025-02-102025-02-10 This is a thought I struggle with a lot: Do I want it enough? With “it,” I mean being a founder, wanting startup success and actually the idea of “deserving success.” I have these thoughts especially on the weekends and evenings, you know, when I’m NOT working. I might be watching a movie, hanging with my friends or my partner.In these moments I often hear this voice in the back of my mind: “you don’t want it enough. If you would, you would get up…walk into the office and FUCKING WORK”… But the realization I’m coming to, or at least trying to get into my head: Yes, I DO want it enough. Yes, I AM working enough. Heck, I’m working 10-hour days, 5 times a week and sometimes indeed do some stuff on the weekends as well. I gave up my highly paid job for this. I’ve been living off savings for quite a while already, savings that I could have bought a nice car from or gone on a world trip. I didn’t. I took that money and I’m burning/investing it to do this. To get this company off the ground. Why? I honestly can’t fully tell you. I want it. Apparently I want it bad enough to do this. So this goes to the little voice in my head: Fuck you, yes, I want it enough. And after all I’m trying to build a company that allows me to live a good life, and that includes regularly NOT working. I am good. To never miss an article subscribe to my newsletter Join No ads. One click unsubscribe. Thank you for entering your email adress! Please now open your email Inbox and confirm your subscription .pulse { animation: pulse-animation 2s infinite; } @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(0, 0, 0, 0.2); } 100% { box-shadow: 0 0 0 20px rgba(0, 0, 0, 0); } } async function sendNewsletterForm(e,form){ const button = form.querySelector("button") e.preventDefault(); button.classList.add("pulse"); button.setAttribute("disabled", true); // Send form const res = await fetch(form.action, {method:'post', body: new FormData(form)}); button.classList.remove("pulse"); button.setAttribute("disabled", false); // Show sucess message if form worked if (res.url.includes("/success")){ // Load email open button const email = form.querySelector("input[type='email']").value.split("@"); if (email.length == 2){ const emailDomain = email[1] document.querySelector("sniper-link").setAttribute("recipient","@"+emailDomain); } form.querySelector(".newsletterInput").style.display="none"; form.querySelector(".newsletterSuccess").style.display="block"; } } Posted in Rant, Startup'''
