["https://simon-frey.com/blog/tor-js-minimal-javascript-library-to-check-if-your-visitors-are-tor-users"]
title = "tor.js - Minimal JavaScript library to check if your visitors are TOR users - Blog by Simon Frey"
description = "Show custom content to visitors of your page using TOR"
full_description = '''tor.js – Minimal JavaScript library to check if your visitors are TOR users By Simon Frey Last updated: 2019-11-142024-01-19 If you don’t know that yet. The TOR browser is a privacy protecting web browser defending you against tracking and surveillance and helps to circumvent censorship. Visiting the NYTimes via the TOR browser it annoyed me, that they are not automatically redirecting me to their .onion service. So I checked out, if it is possible to check if the person currently visiting your website is a TOR user and if so redirect them to your .onion address? As the TOR project offers a list with all currently active exit nodes, it was actually quite easy to build. This super small project downloads the list and checks if the IP of the current request is in that list. The generated JavaScript file contains a global variable telling if current visitor is using TOR. There are also a few convenient functions included, so you could archive the bespoken automatically redirect with 2 line of code. If you offer special services to TOR users or if you just wondering how many of your traffic come from TOR give this tiny library a go. The library documentation can be found on simon-frey.com/torjs/ and as the Project is Licensed Public Domain you are happily invited to host the PHP backend part yourself. Checkout the github repo for more information on that. To never miss an article subscribe to my newsletter Join No ads. One click unsubscribe. Thank you for entering your email adress! Please now open your email Inbox and confirm your subscription .pulse { animation: pulse-animation 2s infinite; } @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(0, 0, 0, 0.2); } 100% { box-shadow: 0 0 0 20px rgba(0, 0, 0, 0); } } async function sendNewsletterForm(e,form){ const button = form.querySelector("button") e.preventDefault(); button.classList.add("pulse"); button.setAttribute("disabled", true); // Send form const res = await fetch(form.action, {method:'post', body: new FormData(form)}); button.classList.remove("pulse"); button.setAttribute("disabled", false); // Show sucess message if form worked if (res.url.includes("/success")){ // Load email open button const email = form.querySelector("input[type='email']").value.split("@"); if (email.length == 2){ const emailDomain = email[1] document.querySelector("sniper-link").setAttribute("recipient","@"+emailDomain); } form.querySelector(".newsletterInput").style.display="none"; form.querySelector(".newsletterSuccess").style.display="block"; } } Posted in Project Tagged go, Privacy, website'''
