["https://simon-frey.com/blog/digitale-schutzmasnahmen-fur-die-teilnahme-an-einer-demo-digital-security-for-protesters"]
title = "Digitale Schutzmaßnahmen für die Teilnahme an einer Demo / Digital Security for Protesters - Blog by Simon Frey"
description = "Protect your digital life while attending a protest"
full_description = '''Digitale Schutzmaßnahmen für die Teilnahme an einer Demo / Digital Security for Protesters By Simon Frey Last updated: 2019-09-172024-01-19 show table of contents Vor der Demonstration Smartphone zu Hause lassen Ein anderes Smartphone nutzen Richtet eine Vollverschlüsselung eurer Geräte ein Entsperren mittels Fingerabdruck/FaceID entfernen Sichert die Daten eures Smartphones Spezial Berlin: Tragt euch in das Funkzellen Transparenz System ein Während der Demonstration Mit dem Fahrrad oder zu Fuß zum Protest kommen Schaltet euer Smartphone in den Flugzeugmodus Videos/Bilder aufnehmen Bilder aus dem Sperrbildschirm machen Mehr Metadaten für Bilder sammeln In heiklen Situationen Noch mehr Bilder und Videos sammeln um die eigene Situation beweisen zu können Informationen versenden Bei Konfiszierung Widersprecht allen Maßnahmen und lasst das Protokollieren Smartphone vor Konfiszierung ausschalten Ihr müsst das Smartphone nicht entsperren Nach Konfiszierung Remote aus allen Accounts ausloggen Daten löschen This blog post is in german and it is heavily based on two EFF articles Attending a protest (CC-BY) and Digital Security Tips for Protesters (CC-BY). Please refer to these sources for getting the information in english. Egal um welches Thema es geht, vom Erhalt der Bäume in der Nachbarschaft, dem Aufstand gegen extreme Gesinnungen, bis zum Arbeitskampf, wir befinden und im digitale Zeitalter und ihr müsst euch auch digital auf eine Demonstration/Protest vorbereiten. (Ganz besonders, falls ihr den Weg des zivilen Ungehorsams wählen möchtet) Speziell Demonstranten werden aufgrund ihres politischen Einsatzes oftmals intensiver überwacht und wenn ihr auf der Demonstration (aus welchem Grund auch immer) festgenommen werdet, ist es gut zu wissen, dass euer digitales Leben entsprechend abgesichert ist. Das Hauptszenario, auf welches ich euch mit diesem Artikel vorbereiten möchte ist das Abhanden kommen eures Smartphones. Dieses Abhanden kommen kann entweder unabsichtlich (verlieren im Gedränge einer Demo) oder forciert (Konfiszierung durch Sicherheitskräfte) passieren. Beide Fälle sind äquivalent zu betrachten, da das Ergebnis die gleiche Nicht-Verfügbarkeit ist. Bitte behaltet im Kopf, dass die Tipps die ich hier niederschreibe keine rechtlich verbindlichen Empfehlungen sind und ihr im Zweifel nochmals mit einer auf eure Situation spezialisierten Anwältin sprechen solltet. Vor der Demonstration Smartphone zu Hause lassen Euer Smartphone sammelt und enthält viele wichtigen Daten: Euren StandortverlaufBilder/VideosNachrichtenPasswörter und Zugängen zu Kommunikationsplattformen (z.B. Facebook App)Browser Historie… Denkt darüber nach, ob ihr es riskieren wollt, das diese Daten in die falschen Hände gelangen.Der einfachste Schutz dieser Daten und eures Smartphones ist es gar nicht mit auf die Demo zu nehmen. Ein anderes Smartphone nutzen Wenn ihr ein Telefon mitnehmen wollt, nutzt im besten Fall nicht euer Alltags-Smartphone, sondern ein anderes. Hierfür könnt ihr euch ein günstiges Telefon bei den meisten Discounter kaufen. Oder vielleicht habt ihr noch ein älteres Smartphone zu Hause herumliegen.Wenn ihr dieses noch mit einer billigen Prepaid SIM-Karte (<10€ bei den meisten Discountern) ausstattet habt ihr schon den größten Schritt zum Schutz eurer Daten gemacht. Für das Kommunizieren reicht dieses alte Telefon allemal und es bringt euch den Vorteil, dass es euch nicht wirklich stört, wenn es konfisziert wird. (Denn euer Haupttelefon liegt ja sicher zu Hause) Als weiteren Schutz solltet ihr das Telefon vor jeder Demonstration auf Werkseinstellungen zurücksetzen, damit euch Daten von der letzten Demonstration nicht zum Verhängnis werden. Richtet eine Vollverschlüsselung eurer Geräte ein Ihr nutzt also nun entweder euer Hauptsmartphone oder ein zweites Handy. Damit eure Daten auf dem Gerät sicherer sind, solltet ihr die Vollverschlüsselung eures Geräts einstellen. Eine Vollverschlüsselung stellt sicher, dass all die Dateien auf eurem Gerät verschlüsselt sind. Wenn das Gerät also aus ist, ist es sehr schwer an eure Daten ohne den zugehörigen Code zu gelangen. Bitte bedenkt, das ein sicheres Passwort das A & O für eine sichere Verschlüsselung ist. Denn, wenn dieses zu kurz ist, kann es leicht geknackt werden und die Verschlüsselung ist damit hinfällig. Nutzt ein Passwort mit mindestens acht Stellen, Buchstaben sowie Zahlen. (Wie so ein sicheres Passwort aussehen könnte: simon-frey.eu/pw.html) Wenn es euch das Passwort zu kompliziert für den Alltag ist, könnt ihr es nach der Demonstration wieder ändern. Achtung: Ihr müsst euch das Password unbedingt merken und dürft es nicht irgendwo aufschreiben und diese Notiz dann mit euch führen. Damit würde das gesamte Sicherheitsmodell in sich zusammen fallen, da die Notiz mit konfisziert werden kann! Entsperren mittels Fingerabdruck/FaceID entfernen Es ist eine sehr bequeme Methode euer Smartphone mittels Fingerabdruck/FaceID zu entsperren, doch gerade bei Demonstrationen solltet ihr diese Funktion ausschalten. Denn mit eingeschaltetem Fingerabdruck Code kann euer Smartphone immer durch physische Gewalt entsperrt werden: Man nimmt euren Finger und presst ihn auf den Senor bzw. hält euch das Smartphone vor euer Gesicht. Wenn diese Funktion deaktiviert ist, kennt nur ihr den Entsperrcode und ein physische Entsperren ist nicht möglich. Sichert die Daten eures Smartphones Der größte Wert eures Smartphones sind die Daten, die darauf gespeichert sind. Ihr müsst diese sichern! Durch das Sichern der Daten habt ihr weniger Probleme, wenn das Smartphone auf der Demonstration verloren geht oder konfisziert wird. Denn dann habt ihr immer noch euer Backup zu Hause und könnt die Daten auf einem anderen Smartphone wiederherstellen. Bedenkt: Es kann Monate dauern, bis ihr euer Gerät wieder zurückbekommt. Spezial Berlin: Tragt euch in das Funkzellen Transparenz System ein Die Strafverfolgungsbehörden nutzen immer häufiger die Möglichkeit der Funkzellenabfrage um (auch auf Demos) zu erkennen welche Geräte sich im Umfeld aufgehalten haben. Das FTS informiert euch, falls eure Telefonnummer in einer solchen Suche mit gefunden wird. Während der Demonstration Mit dem Fahrrad oder zu Fuß zum Protest kommen Auch in Deutschland wird die Videoüberwachung im öffentlichen Raum immer weiter ausgebaut. (Seht euch dazu die Weltkarte der Überwachung an) Am besten könnt ihr dieser Videoüberwachung entgehen, indem ihr das Auto und die öffentlichen Verkehrsmittel meidet. Mit dem Fahrrad oder zu Fuß könnt ihr euch an den Überwachungspunkten vorbeischlängeln. Obendrein müsst ihr euch nicht über überfüllten U-Bahnen oder Staus ärgern 😉 Schaltet euer Smartphone in den Flugzeugmodus Euer Smartphone sendet die ganze Zeit verschiedenste Daten mit deren Hilfe ihr erkannt werden könnt. Allein dadurch das ihr euch in einem Funknetz befindet, ist es den Strafverfolgungsbehörden möglich zu erkennen, das euer Smartphone (und damit vermutlich auch ihr als Person) sich im Umfeld einer Aktion aufgehalten hat. Um dieses Vorgehen einzudämmen, gibt es drei Möglichkeiten (nach absteigender Effektivität sortiert): Lasst das Smartphone zuhauseSchaltet das Smartphone aus und entnehmt den AkkuAktiviert den Flugmodus Der Flugmodus bietet sich dann an, wenn ihr euer Smartphone auf der Demonstration aktiv einsetzen möchtet z.B. um Aufnahmen zu machen oder Nachrichten auszutauschen. Videos/Bilder aufnehmen Wenn ihr euer Telefon dabei habt und es nutzen möchtet, dann macht viele Bilder und Videos. Einerseits können diese im Nachhinein eine schöne Erinnerung und auch Werbematerial sein, andererseits schafft ihr damit Beweise um den Hergang von Situationen im Nachhinein nachstellen zu können. Bilder aus dem Sperrbildschirm machen Damit ihr nicht für jedes Foto/Video wieder euren langen Entsperrcode eingeben müsst, solltet ihr die Funktion aktivieren, dass ihr auch bei gesperrtem Handy Bilder machen könnt. Somit müsst ihr das Smartphone nicht entsichern, um Bilder zu machen und könnt noch schneller auf sich verändernde Situationen reagieren. Mehr Metadaten für Bilder sammeln Um Bilder zu erstellen, die zusätzliche Daten enthalten, welche beweisen, dass die Bilder von euch sind, hilft euch die App CameraV des Guardian Projekts. Diese Android App reichert eure Bilder mit Metadaten an .(z.B. Wann und Wo das Bild aufgenommen wurde) Weiter können diese Daten auch helfen die Echtheit eurer Bilder zu beweisen. In heiklen Situationen Noch mehr Bilder und Videos sammeln um die eigene Situation beweisen zu können Informationen versenden Dieser Tipp widerspricht den vorherigen, denn ihr müsst sowohl euer Smartphone dabei haben als auch den Flugmodus deaktivieren. Speziell wenn Situationen heikel werden, kann es ratsam sein Beweismaterial an Freunde/Bekannte zu verschicken. Somit können diese (und damit auch ihr) weiterhin auf die Daten zugreifen, selbst wenn euer Telefon nicht mehr greifbar ist. Bei Konfiszierung Wichtig: Wenn ihr euch in einer solchen Situation befindet, konsultiert einen Anwalt und belastet euch bis dahin nicht selbst. Ihr solltet die ganze Zeit schweigen und die Aussage verweigern bis euch euer Anwalt etwas anderes rät. Widersprecht allen Maßnahmen und lasst das Protokollieren Oftmals versuchen euch gewitzte Beamte dazu zu bringen euch eure Daten und Geräte freiwillig (im rechtlichen Sinne) auszuhändigen. Wenn ihr eurer Gerät auf die freundliche Nachfrage “Würden sie mir ihr Smartphone aushändigen” hergebt, kann es so ausgelegt werden das ihr euer Gerät freiwillig hergegeben habt. Fragt nach, ob ihr zur Herausgabe gezwungen seid und widersprecht deutlich das diese Herausgabe gegen euren Willen geschieht. Lest auch in der Hitze des Gefechts die euch zum Unterzeichnen gegeben Texte und macht auch in diesen Protokollen klar, das die Herausgabe nicht freiwillig passiert ist. Lasst euch eine Kopie der Dokumente geben. Smartphone vor Konfiszierung ausschalten Sollte euch eine Konfiszierung eures Handys kurz bevor stehen, schaltet es aus. Damit wird die Vollverschlüsselung (die ihr hoffentlich vorher eingerichtet habt) aktiv und eure Daten sind geschützt. Das Ausschalten ist besonders wichtig für diejenigen unter euch die den Fingerabdrucksensor nicht deaktiviert haben. Durch das Ausschalten wird beim Start wieder das Verschlüsselungspasswort abgefragt und es reicht nicht nur euren Finger auf den Sensor zu pressen. Ihr müsst das Smartphone nicht entsperren Gebt euer Passwort nicht heraus! Ohne richterliche Anordnung müsst ihr die Daten auf eurem Smartphone nicht preisgeben. Selbiges gilt auch für euren Email Account o.ä. Nach Konfiszierung Remote aus allen Accounts ausloggen Euer Smartphone enthält oftmals auch die Zugänge zu verschiedensten Accounts (z.B. Facebook, Twitter Apps). Ihr wollte natürlich nicht das der/diejenige im jetzigen Besitz eures Geräts auf diese Accounts zugreifen kann. Die meisten dieser Netzwerke bieten euch die Möglichkeit euch aus allen verbundenen Geräten auszuloggen. Sucht hierzu auf der Webseite nach der Option. Falls es diese Option nicht gibt, hilft es auch einfach das Passwort für diesen Account zu ändern, damit werdet ihr aus den Apps auf dem konfiszierten Smartphone auch ausgeloggt. Daten löschen Manche Anbieter bieten euch die Möglichkeit eure Daten remote zu löschen. Dies könnt ihr ggf. aktivieren, damit falls das Gerät entsperrt wird die Daten entfernt werden. Achtung: Speziell bei dieser Option solltet ihr eine Anwältin konsultieren, ob ihr das dürft. Bitte handelt hier nicht vorschnell, da es euch später rechtliche Probleme bereiten könnte! Hoffentlich konnte ich euch mit diesem Artikel ein paar Hinweise geben, damit ihr euch in unserem digitalen Zeitalter angemessen auf eure nächste Demonstration vorbereiten könnt. Fragen? Feedback? Verbesserungsvorschläge? [email protected] To never miss an article subscribe to my newsletter Join No ads. One click unsubscribe. Thank you for entering your email adress! Please now open your email Inbox and confirm your subscription .pulse { animation: pulse-animation 2s infinite; } @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(0, 0, 0, 0.2); } 100% { box-shadow: 0 0 0 20px rgba(0, 0, 0, 0); } } async function sendNewsletterForm(e,form){ const button = form.querySelector("button") e.preventDefault(); button.classList.add("pulse"); button.setAttribute("disabled", true); // Send form const res = await fetch(form.action, {method:'post', body: new FormData(form)}); button.classList.remove("pulse"); button.setAttribute("disabled", false); // Show sucess message if form worked if (res.url.includes("/success")){ // Load email open button const email = form.querySelector("input[type='email']").value.split("@"); if (email.length == 2){ const emailDomain = email[1] document.querySelector("sniper-link").setAttribute("recipient","@"+emailDomain); } form.querySelector(".newsletterInput").style.display="none"; form.querySelector(".newsletterSuccess").style.display="block"; } } Posted in Privacy Tagged backup, Demonstration, german, protest, security'''
