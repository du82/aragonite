["https://simon-frey.com/blog/brotli-vs-gzip"]
title = "Brotli VS GZIP || Which Of These Will Make Your Website Faster?"
description = "Brotli and GZIP are two different compression algorithms you can use to speed up your website. Find out which of them is faster."
full_description = "Brotli VS GZIP || Which Of These Will Make Your Website Faster? By Simon Frey Last updated: 2022-08-012024-01-19 show table of contents What Is GZIP? What Is Brotli? Brotli Browser support. Important Terms To Note. 1. Compression Ratio: 2. Compression Speed: What Are The Differences Between GZIP And Brotli? 1. Compression Levels: GZIP Compression Levels: Brotli Compression Levels: 2. Their Development: GZIP Development: Brotli Development: 3. Compression Speed: 4. Content Type Compression: Compression Comparison: GZIP and Brotli. Which Should You Use For Better Website Speed; GZIP or Brotli? How To Enable GZIP Compression. Enable GZIP In Your Server: 1. Apache || Enabling GZIP Compression In Apache: 2. Nginx || Enabling GZIP compression in Nginx: Enable GZIP With A CDN: Enable GZIP With A Plugin (For WordPress Users): How To Enable Brotli Compression. Enable Brotli in your Server: 1. Apache || Enabling Brotli Compression In Apache: 2. Nginx Plus || Enabling Brotli Compression In Nginx Plus: Enable Brotli with a CDN: How To Test Your GZIP and Brotli Compression. Conclusion: The compression of your HTTP content is one way to improve the performance of your website, and when it comes to compressing HTTP content, there are two major algorithms used for this today: Brotli and GZIP. As of the time of writing this article, according to W3Techs, 88.2% of all the websites on the web compress their HTTP content, and 59.8% of these websites use GZIP while 41.9% use Brotli. The question now is which of these two algorithms is better; which one can make your website faster, Brotli or GZIP? Here is my short answer to this: Brotli has proven to be a superior file compression algorithm to GZIP, and yes, it can make your website faster because the smaller your HTTP content size, the faster it will be transferred over a network. But, to use Brotli, you might have to adjust the settings a bit, especially for your dynamic content. To justify my answer to this question, I would like to explain these two compression algorithms so you can see why I gave that answer. So let’s start with an in-depth view of GZIP and Brotli. What Is GZIP? GZIP, which stands for GNU zip, is a file format that uses an open source compression algorithm, DEFLATE, to compress files like HTTP contents. GZIP was first developed to replace the compress program used in the early version of Unix systems, but now it does more than that. Its first version was released in 1992 by the creators, Jean-Loup Gailly and Mark Adler. GZIP was specified in RFC 2616 as one of the three standard formats for HTTP compression. As I stated earlier, 59.8% of websites that compress their HTTP content use GZIP. When using GZIP to compress your website content in your server, you have 9 different settings to choose from, referred to as Compression Levels. I will explain what compression levels mean later on in this article, but for now, just know that the compression level you make use of will determine the result you will get from your HTTP compression both in size (Compression Ratio) and how fast it will occur (Compression Speed). What Is Brotli? Brotli is a lossless data compression algorithm developed based on the combination of a modern variant of the LZ77 compression algorithm, Huffman coding, and second-order context modelling. It makes use of this combination to compress and decompress files. Brotli was developed by two Google Engineers, Jyrki Alakuijala and Zoltan Szabadka, when they had issues with the transmissions of Web Open Font Format (WOFF) and needed to compress their size. They released the early version of Brotli in 2013, and it was used for offline web font compression. They spent about three years completing the Brotli specification. During this period, the engineers had to fix many things, which led to the improvement of Brotli from just compressing web fonts to compressing streams of data. br is the content encoding type Brotli uses, and a browser that supports Brotli will have br as its content encoding type in the HTTP request sent to a server. When using Brotli to compress your website content, you have 11 different settings to choose from, referred to as Compression Levels. Each level provides a different Compression Ratio and Compression Speed. Brotli Browser support. At the time Brotli was developed, all web servers and browsers supported GZIP in compressing and decompressing HTTP payloads/content since it was developed earlier in 1992. It took a while before Brotli was adapted to the web. Today Brotli is supported in most web servers and modern browsers, including Chrome, Edge, Firefox Safari, and so on. Alright, you know what Brotli and GZIP are and what they are used for (file compression), let’s take a look at the differences between Brotli and GZIP, but before we get to that, I would like to explain a few terms I did use earlier and will use later in this article. Important Terms To Note. Compression Ratio.Compression Speed. 1. Compression Ratio: The Compression Ratio is the ratio of the file size savings of a compression process to the size of the original file before compression. For an HTTP content of size 2 MB, if this is compressed with either Brotli or GZIP and the output is of size 1 MB, the Compression Ratio, in this case, is 0.5; this can also be given in percentage as 50%. Generally, the greater the Compression ratio, the better, and this is because files with lesser weight will spend less time being transferred from a server to a browser. 2. Compression Speed: Compression Speed shows how long it takes for a compression algorithm to compress a given file. It is reported in MB/s, so it is calculated by dividing the file’s total size before compression by the time taken to compress it. The faster a compression algorithm can compress a file, the better for you and your user’s experience. You don’t want anything to slow down your website, not even a compression process, especially on dynamic content (I will explain this better later in this article). Now let’s get to the major difference between GZIP and Brotli. What Are The Differences Between GZIP And Brotli? GZIP and Brotli are two different compression algorithms, and here are some of the major differences between the two: Compression Levels.Their Development.Compression Speed.Content Type Compression. 1. Compression Levels: Compression level is a measure of compression quality. It is always represented with a range of values, and each value performs differently in terms of its compression ratio and compression speed. Brotli and GZIP have different numbers of compression levels. GZIP Compression Levels: GZIP has 9 compression levels. The 9th level gives you the maximum compression possible with GZIP (large file size savings), while level 1 gives you the minimum compression (small file size savings), but when you compare the speed between compression level 1 and 9 for GZIP, level 1 is much faster than level 9. This difference in speed occurs because GZIP uses more CPU at level 9 to provide a much smaller output than at level 1. So the higher the file savings, the higher the compression speed, and the lower the file savings, the lower the compression speed. The default compression level for GZIP is Level 6 in Apache. This is because GZIP offers a good compromise between compression speed and file size savings at level 6. This is the level used in most web servers today, except the user did make some adjustments. Brotli Compression Levels: Brotli has 11 compression levels (2 levels more than that of GZIP), and just like GZIP, level 11 gives you the maximum compression while level 1 gives you the minimum compression and is much faster than level 11. The default compression level for Brotli is Level 5 in Apache, which is what most websites use in compressing their HTTP content. Brotli has so many features which enable it to compress files better than GZIP, and one of these features is the built-in static dictionary which is only implemented from levels 5 to 11 due to the high CPU cost. 2. Their Development: The GZIP and Brotli algorithm were developed differently, and this is one of the major differences between these two compression algorithms. GZIP Development: As mentioned earlier, GZIP was developed based on an open-source compression algorithm called DEFLATE. This algorithm is a combination of the LZ77 compression algorithm and Huffman coding. LZ77 Compression Algorithm compresses files by maintaining a sliding window during the compression period. This is why it is sometimes called Sliding-Window Compression; the compressed data are held in a sliding window structure. When a browser wants to decompress the data (HTTP content), it starts from the beginning of the input in the sliding window. LZ77 also compresses a file by replacing data that occur multiple times with reference to just one copy of the data. During the decompression process, a browser uses that reference to decompress the data. Huffman Coding is the process of finding a commonly used prefix code for lossless data compression. Huffman coding works in compressing a file by using specific methods to choose a representation for every symbol in the file, resulting in prefix code. In Huffman coding, a code word represents each symbol in a file (alphabet or numbers). For example, the symbol a can have a code word 010; when decompressing a file, a browser replaces all the code words with their corresponding values/symbol. GZIP compression process involves Huffman coding and LZ77 compression, and it works with both to compress your HTTP Content. Brotli Development: Like GZIP, Brotli was developed based on the LZ77 compression algorithm and Huffman coding but came with one feature that GZIP does not have: Second Order Context Modelling. The Second Order Context Modelling works in compressing data by providing a frequency distribution for each pair of characters in the order 2 case. These frequency distributions form the basis of an arithmetic code used to map the characters into code bits. The Second Order Context Modelling enables Brotli to determine literals and copy distances within the file it is compressing. Brotli also uses a static pre-defined dictionary which contains over 13000 common words from large resources of text and HTML documents. Studies have shown that Brotli compresses files faster when the file it is compressing contains the common words in its static dictionary, but as I mentioned earlier, the static dictionary is only implemented from level 5 to 11 due to the high CPU cost. In general, the Brotli compression algorithm can be viewed as an improvement to GZIP compression algorithm. 3. Compression Speed: As I said earlier, Compression Speed is a measure of how fast a compression algorithm can compress a file and the faster the Compression Speed, the lesser the file size savings. On average, GZIP is said to be faster than Brotli when compressing the same file. Well, this depends on the compression level you use on both algorithms. When compressing with Brotli level 11 and GZIP level 9 (the highest level on both algorithms), GZIP will be faster than Brotli, but you should know that the output from Brotli compression will have a lesser file size than GZIP. I will show you some examples of compressions done with Brotli and GZIP, and we will compare their compression ratio (file size savings) but know that GZIP is faster at compressing a file than Brotli. It is also essential to know that you can work around the default setting of Brotli to make it compete with GZIP compression speed. Changing the compression level would help, but this will cost you the large file size savings Brotli should have offered, and you would also have to try out different levels. Some developers report that they did find a good spot at Brotli compression level 4 as the compression output size was much less than that of GZIP level 9, and the speed was fairly close to GZIP level 9. I believe this is partly because the built-in static dictionary in Brotli is not implemented at level 4. 4. Content Type Compression: Due to the difference in the compression speed of Brotli and GZIP, they are best used in compressing different HTTP content types. Brotli is best for compressing static contents, while GZIP is best for compressing dynamic contents. I will explain why this is so, but first, what are static and dynamic contents? Static contents are files that are not updated frequently. They can be compressed once and stored in a server or cache, and when users’ browsers request the files, the compressed file is served immediately if the browser supports the format (br or gzip).’ For dynamic content, the case is different as they are constantly updated frequently. So you cannot compress a version of this file and store it because when a user browser requests for that file, the compressed version might not be the required one, and for this, dynamic contents are always compressed only when a browser requests it. Since static contents can be compressed once, stored and served to browsers without any issue, it makes sense to compress them with Brotli (level 11 if you can) to get as many file size savings as possible. This will take more time and CPU cost, but you only have to do this once and store the compressed files. For dynamic content, they can only be compressed when there is a request. To improve your user experience, you wouldn’t want anything to slow down the delivery of your content to the user, so you need the compression to be done as fast as possible. GZIP is the best for this as it would compress the file faster. But remember I told you that Brotli compression at level 4 could compete closely with GZIP level 9 speed, but still, GZIP is faster. Now that we have covered the difference between Brotli and GZIP, I know you are getting to see the reason behind the short answer I gave you early, but before we conclude, I would like to show you the result of the compression of different files types with GZIP and Brotli so we can compare them. Compression Comparison: GZIP and Brotli. To compare the result of the compression of files with Brotli and GZIP, we will be taking a look at the experiments conducted by some developers and draw our conclusion from that. First, let’s look at the test done by Bitsrc.io, where they compressed two JavaScript files with Brotli and GZIP. Here is the result they got from this: FileUncompressed File SizeGZIP Compressed File Size Brotli Compressed File SizeFile 1: main.js319 KB89.3 KB81.7 KBFile 2: main.js419B318B224B With the first file, GZIP compression ratio is about 72%, while Brotli is around 74%. For the second file, the GZIP compression ratio is about 24%, and that of Brotli is around 46%. With this result, it is clear that Brotli compression algorithms win when it comes to the comparison between their compression ratio. Although I don’t know the compression level used for this, I believe it is the default one. The t"
