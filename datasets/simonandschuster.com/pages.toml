description = "Two unlikely friends hatch an extraordinary scheme to expose the theater world in this wildly entertaining and sharply observed debut novel exploring perception, redemption, and how success shapes us all."
full_description = "Two unlikely friends hatch an extraordinary scheme to expose the theater world in this wildly entertaining and sharply observed debut novel exploring perception, redemption, and how success shapes us all. Hollywood Wives meets A Visit from the Goon Squad in this emotional debut novel from Variety chief correspondent and a moderator of the Actors on Actors series about a group of actresses confronting their careers, their secrets, and each other throughout one turbulent awards season. In this follow-up to the USA TODAY bestselling “utterly charming mystery” (Robyn Harding, author The Party) The Antique Hunter’s Guide to Murder, Freya Lockwood and Aunt Carole are on the hunt once again to return priceless stolen antiques and catch a dangerous criminal abord a cruise ship. From the legendary author and creator of Drizzt Do’Urden comes the next installment in the New York Times bestselling DemonWars fantasy series, about the traitorous invasion by the Xoconai of the eastern realms of Corona. However, the heroes of the last war against their demon god may be forgotten, but they are not powerless. The highly anticipated follow-up to Peyton Corinne’s “unputdownable and unforgettable” (Bal Khabra, author of Collide) TikTok sensation Unsteady follows hopeless romantic Ro and player—on and off the ice—Freddy as they forge an unexpected bond that slowly turns into a life lesson in self-worth and the healing quality of love. The Seven Husbands of Evelyn Hugo meets First Lie Wins in this electric, voice-driven debut novel about an elusive bestselling author who decides to finally confess her true identity after years of hiding from her past. “Stunning.” —People * “Dazzling yet devastating...Tóibín is simply one of the world’s best living literary writers.” —The Boston Globe * “Momentous and hugely affecting.” —The Wall Street Journal * From the beloved, critically acclaimed, bestselling author comes a spectacularly moving novel featuring Eilis Lacey, the comp