description = "Jason Reynolds is a #1 New York Times bestselling author, recipient of the MacArthur Genius Grant, a Newbery Award Honoree, a Printz Award Honoree, a two-time National Book Award finalist, a 2024 MacArthur Fellow, a Kirkus Award winner, a UK Carnegie Medal winner, a two-time Walter Dean Myers Award winner, an NAACP Image Award Winner, an Odyssey Award Winner and two-time honoree, and the recipient of multiple Coretta Scott King honors, a Coretta Scott King Author Award, and the Margaret A. Edwards Award. He was also the 2020–2022 National Ambassador for Young People’s Literature. His many books include All American Boys (cowritten with Brendan Kiely); When I Was the Greatest; The Boy in the Black Suit; Stamped; As Brave as You; For Every One; the Track series (Ghost, Patina, Sunny, Lu, and Coach); Look Both Ways; Stuntboy, in the Meantime; Stuntboy, In-Between Time; Miles Morales Suspended; Ain’t Burned All the Bright (recipient of the Caldecott Honor) and My Name Is Jason. Mine Too. (both cowritten with Jason Griffin); Twenty-Four Seconds from Now...; and Long Way Down, which received a Newbery Honor, a Printz Honor, and a Coretta Scott King Honor. His debut picture book, There Was a Party for Langston, won a Caldecott Honor and a Coretta Scott King Illustrator Honor. He lives in Washington, DC. You can find his ramblings at JasonWritesBooks.com."
