full_description = "From Hell’s Belles BookTok sensation Jaysea Lynn comes a hotter-than-hell romantasy about forbidden love, dark magic, and a young woman’s fiery adventure in the Afterlife, perfect for fans of Sarah A. Parker and Callie Hart.They told her to go to Hell. She went, but on her own terms. Lily isn’t exactly thrilled with her arrival in the Afterlife, but what awaits her there is more fantastical than she ever could have imagined: Deities wait in line at the coffee shop. Fae flit between realms. Souls find ways to make death a beginning. As she explores the many corners of the Afterlife, Lily finds herself surprisingly drawn to a place most people would avoid at all costs: Hell. Armed with years of customer service experience and pent-up sarcasm, Lily carves a job out for herself amongst Hell’s demons, sending souls to their rightful circles with more than a hint of sass. Lily’s expectations are subverted every day in Hell—especially by Bel, a demon general with a distractingly sexy voice. The two meet by chance and form an immediate, deeply healing friendship, but the undeniable heat between them threatens to combust. Meanwhile, something stirs beyond the boundaries of their world, threatening to destroy everything they’ve known and everything that could be…unless they fight like Hell to stop it.This debut novel from BookTok sensation Jaysea Lynn invites you to lose yourself in a world where love ignites in the unlikeliest of places, magic defies the rules, and the Afterlife proves more thrilling than anyone could imagine."
