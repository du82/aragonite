["https://www.simonandschuster.com/books/Daybreak/Matt-Gallagher/9781501177866"]
title = "Daybreak | Book by Matt Gallagher | Official Publisher Page | Simon & Schuster"
description = "Daybreak by Matt Gallagher - In this “vital novel that arrives at a perilous time” (Elliot Ackerman, New York Times bestselling author), a disillusioned Amer..."
full_description = "In this “vital novel that arrives at a perilous time” (Elliot Ackerman, New York Times bestselling author), a disillusioned American veteran volunteers for the war in Ukraine to reconnect with a woman from his past.Thirty-three-year-old Luke “Pax” Paxton has been out of the military for almost a decade, adrift in an America he no longer understands, haunted by a mistake made in an unforgiving moment of combat. When an old army friend suggests they travel to Ukraine to help fight against the Russian invasion, he agrees, and together they cross an ocean to Lviv, the City of Lions. But Pax isn’t merely going out of the goodness of his heart. He carries with him the address of a former love, a Ukrainian woman named Svitlana whom he had known as a young soldier and has been unable to forget. His feverish journey through Lviv takes him down winding and missile-cratered streets as he forms surprising connections with everyone from humanitarian volunteers to displaced Ukrainians and ordinary citizens trying to survive. And when Pax gets the chance to save someone dear to Svitlana, he just might be able to correct the wrongs that have wracked him with guilt for so many years. Inspired by the author’s time in Ukraine, “Matt Gallagher has written the first great military-inspired novel of this post-Global War on Terror era” (Bill McCloud, author of What Should We Tell Our Children About Vietnam?)."
