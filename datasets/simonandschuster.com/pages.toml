["https://www.simonandschuster.com/books/Awake/Jen-Hatmaker/9781668083680"]
title = "Awake | Book by Jen Hatmaker | Official Publisher Page | Simon & Schuster"
description = "Awake by Jen Hatmaker - From Jen Hatmaker—beloved New York Times bestselling author and host of the For the Love podcast—a brutally honest, funny, and reveal..."
full_description = "From Jen Hatmaker—beloved New York Times bestselling author and host of the For the Love podcast—a brutally honest, funny, and revealing memoir about the traumatic end of her twenty-six-year-long marriage, and the beginning of a different kind of love story. At 2:30 a.m. on July 11th, 2020, Jen Hatmaker woke up to her husband of twenty-six years whispering in his phone to another woman from their bed. It was the end of life as she knew it. In the months that followed, she went from being a shiny, funny, popular leader, to a divorced wreck on antidepressants and anti-anxiety meds parenting five kids alone with no clue about her own bank accounts. Having led millions of women for over a decade—urging them to embrace authenticity, find radical agency, and create healthy relationships—this seemed nothing less than total failure. In Awake, Jen shares for the first time what happened when she found herself completely lost at sea—and how she made it to shore. In candid, surprisingly funny vignettes spanning forty years of girlhood, marriage, and parenting, Jen lays bare the disorienting upheaval of midlife—the implosion of a marriage, the unraveling of religious and cultural systems, and the grief that accompanies change you didn’t ask for. And, drawing on all her resources—from without and from within—Jen dares to question the systems beneath the whole house of cards, and to reckon with the myths, half-truths, and lies that brought her to this point. More than one woman’s story, Awake is a critical analysis of the story given to all of us: the story of gender limitations, religious subservience, body shame, self-erasure. With refreshing candor, Jen explores a Midlife Renaissance—grieving what’s lost, cherishing possibility, and entering the second half of life wide awake."
year_published = 2025
