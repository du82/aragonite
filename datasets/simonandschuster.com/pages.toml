["https://simonandschuster.com/p/must-read-romance"]
title = "Must-Read Romance: Stories to Love | Simon & Schuster"
description = "The third installment in the #BookTok sensation and New York Times bestselling series that started with Spark of the Everflame—now in a collectible hardcover edition featuring gorgeous full-color endpapers, an exclusive designed hardcover case, and a never-before-seen bonus chapter."
full_description = "The third installment in the #BookTok sensation and New York Times bestselling series that started with Spark of the Everflame—now in a collectible hardcover edition featuring gorgeous full-color endpapers, an exclusive designed hardcover case, and a never-before-seen bonus chapter. The highly anticipated follow-up to Peyton Corinne’s “unputdownable and unforgettable” (Bal Khabra, author of Collide) TikTok sensation Unsteady follows hopeless romantic Ro and player—on and off the ice—Freddy as they forge an unexpected bond that slowly turns into a life lesson in self-worth and the healing quality of love. A spicy small-town, brother’s best friend, sports romance “packed with sizzling tension, heat, and sweet, swoon-worthy moments” (Peyton Corinne, author of TikTok sensation Unsteady) between a college football coach and the one that got away that you’ll want to devour in one sitting. The New York Times bestselling author of In Five Years and One Italian Summer returns with “a romantic gem” (Laura Dave, New York Times bestselling author) about a young woman who decides to finally live for herself rather than rely on the universe for answers. Now featuring bonus content! In this “masterpiece from the queens of romance” (Ali Hazelwood, New York Times bestselling author) Christina Lauren, the buttoned-up heir of a grocery chain and his free-spirited artist ex convince his snobby family their marriage of convenience is real, or lose a massive inheritance. “A witty, charming, delight of a book!” —Evie Dunmore, USA TODAY bestselling author A tart young woman and an arrogant lord collide in this flirty, sexy, and remarkably modern historical romance, perfect for fans of Bridgerton."
