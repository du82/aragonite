description = "“Stirring and mysterious…fires directly at the human heart and hits the mark.” —Delia Owens, New York Times bestselling author of Where the Crawdads Sing  A love triangle unearths dangerous, deadly secrets from the past in this thrilling tale perfect for fans of The Paper Palace and Where the Crawdads Sing."
full_description = "“Stirring and mysterious…fires directly at the human heart and hits the mark.” —Delia Owens, New York Times bestselling author of Where the Crawdads Sing A love triangle unearths dangerous, deadly secrets from the past in this thrilling tale perfect for fans of The Paper Palace and Where the Crawdads Sing. Inspired by a true literary mystery, New York Times bestselling author of the mesmerizing The Secret Book of Flora Lea returns with the sweeping story of a legendary book, a lost mother, and a daughter’s search for them both. “It’s a knockout.” —Publishers Weekly (starred review) From RuPaul’s Drag Race winner, Traitors contestant, and host of HBO’s We’re Here comes an inventive, wondrous novel about American hero Harriet Tubman that remixes history into a fresh, dynamic novel about love, freedom, salvation, and hip-hop. A darkly funny, life-affirming debut novel following five women from a once illustrious Iranian family as they grapple with revolutions personal and political. Set over the course of one day, a heart-racing debut about a woman facing the unimaginable, determined to find safety. Gen X icon Ione Skye bares all in an achingly vulnerable coming-of-age memoir about chasing fame, desire, and true love in the shadow of her famous, absent father. From eldest daughter Shari Franke, the shocking true story behind the viral 8 Passengers family vlog and the hidden abuse she suffered at the hands of her mother, and how, in the face of unimaginable pain, she found freedom and healing. In 1970s Dublin, all forms of contraception are strictly forbidden, but an intrepid group of women will risk everything to change that in this sweeping, timely novel inspired by a remarkable and little-known true story. The Light Between Oceans meets The Snow Child in this novel set in a Scottish village in the weeks after a young boy mysteriously washes up on shore, causing the buried secrets of the insular community to come to light and rekindling an old love story."
