description = "A Traitorous Heart by Erin Cotter - A noblewoman in the scandalous French court finds herself under the dangerous and watchful eye of the Parisian royalty wh..."
full_description = "A noblewoman in the scandalous French court finds herself under the dangerous and watchful eye of the Parisian royalty when she falls in love with the handsome king who is betrothed to her former lover in this bisexual The Three Musketeers by way of Bridgerton and F.T. Lukens.Paris, 1572. Seventeen-year-old Jacqueline “Jac” d’Argenson-Aunis is lady-in-waiting to her best friend and former lover, the French Princess Marguerite “Margot” de Valois, but she dreams of more. If Jac plays her cards right, one day, she’ll become a full member of the Societas Solis, a secret society of spies—just like her uncle and guardian, Viscount Gabriel d’Argenson-Aunis. But it’s hard to think about her own ambitions while France is on the brink of war, and the only thing that might save the country is an alliance—a marriage between the Catholic Princess Margot and Henry, the awful son of the Huguenot queen. Who would be the perfect person to play matchmaker? Jac, of course. Jac resents lying to her best friend almost as much as she resents the brazen and arrogant King Henry, but it’s her one chance to prove to the Societas Solis that she belongs among their ranks before her uncle can marry her off or worse. The more time Jac spends in the French Court’s clandestine corners, though, the more she starts to wonder if Henry is…not as terrible as she once believed. And the Societas Solis may not be what they seem. Politics. Spies. Chaos in the French court. Perhaps even witchcraft? Everything’s more dangerous when love is involved."
