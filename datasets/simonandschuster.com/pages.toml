title = "Star Trek Books | Simon & Schuster"
description = "Simon & Schuster's dedicated site for Star Trek Books with the latest releases and fan favorites. Engage!"
full_description = "A thrilling new Star Trek “movie era” novel from New York Times bestselling author Greg Cox! Three Eras. Three Mysteries. One Ancient Enemy? The first novel based on the thrilling Paramount+ TV series Star Trek: Strange New Worlds! When an experimental shuttlecraft fails, Captain Christopher discovers the very principles on which Starfleet bases its technology have simply stopped functioning. He and his crewmates Una Chin-Riley, Spock, and Nyota Uhura are forced to abandon ship in a dangerous maneuver that scatters them across the strangest new world they’ve ever encountered. Setting out to find his crewmates, Pike encounters a surprising face from his past—and realizes that one people’s utopia might be someone else’s purgatory. Now he must lead an exodus—or risk a calamity of galactic proportions that even the Starship Enterprise is powerless to stop... A thrilling prequel adventure based on the acclaimed TV series Star Trek: Picard! Two years after the USS Voyager’s return from the Delta Quadrant, Seven of Nine finds herself rejected for a position in Starfleet…and instead finds a new home with the interstellar rogue law enforcement corps known as the Fenris Rangers. The Rangers seem like an ideal fit for Seven—but to embrace this new destiny, she must leave behind all she’s ever known, and risk losing the most important thing in her life: her friendship with Admiral Kathryn Janeway. A thrilling new Star Trek: The Next Generation and Deep Space Nine adventure from New York Times bestselling author Dayton Ward!2369: Shortly after Starfleet thwarts a Cardassian attack on a Federation star system, the Cardassian government orders an end to its fifty-year occupation of the planet Bajor. As a result, a newly installed Bajoran government requests immediate assistance from the Federation to mediate how the withdrawal will proceed and what recompense, if any, Bajorans are owed from their brutal oppressors. Captain Jean-Luc Picard is ordered by Starfleet Command to oversee these tense negotiations on Terok Nor, the massive Cardassian space station still orbiting Bajor, even as he still deals with his own recent trauma as a prisoner held and tortured by a Cardassian interrogator. As these critical peace talks get underway, Ensign Ro Laren receives a call for help from a friend thought long dead, exposing an insidious secret from inside Cardassian space. Now, Picard and the crew of the Starship Enterprise must act to prevent an interstellar incident from reigniting deadly hostilities between the Federation and the Cardassians, and shattering any hope of justice for the Bajoran people… TM & © 2023 CBS Studios Inc. Star Trek and related marks and logos are trademarks of CBS Studios Inc. All Rights Reserved."
