["https://simonwillison.net/2024/Dec/7/prompts-js"]
title = "Prompts.js"
description = "I’ve been putting the new o1 model from OpenAI through its paces, in particular for code. I’m very impressed—it feels like it’s giving me a similar code quality to Claude …"
full_description = '''I’ve been putting the new o1 model from OpenAI through its paces, in particular for code. I’m very impressed—it feels like it’s giving me a similar code quality to Claude 3.5 Sonnet, at least for Python and JavaScript and Bash... but it’s returning output noticeably faster. I decided to try building a library I’ve had in mind for a while—an await ... based alternative implementation of the browser’s built-in alert(), confirm() and prompt() functions. In the past every time I’ve used it in Python or JavaScript I’ve had an expectation that the thing I’m awaiting is going to return as quickly as possible—that I’m really just using this as a performance hack to unblock the event loop and allow it to do something else while I’m waiting for an operation to complete. That’s not actually necessary at all! There’s no reason not to use await for operations that could take a long time to complete, such as a user interacting with a modal dialog. Having LLMs around to help prototype this kind of library idea is really fun. This is another example of something I probably wouldn’t have bothered exploring without a model to do most of the code writing work for me. I didn’t quite get it with a single prompt, but after a little bit of back-and-forth with o1 I got what I wanted—the main thing missing at first was sensible keyboard support (in particular the Enter and Escape keys). await Prompts.alert("hi there"); -> displays a modal with a message and waits for you to click OK on it await Prompts.confirm("Are you sure") -> an OK and cancel option, returns true or false<br> await Prompts.prompt("What is your name?") -> a form asking the user's name, an OK button and cancel - if cancel returns null otherwise returns a string These are equivalent to the browser builtin alert() and confirm() and prompt() - but I want them to work as async functions and to implement their own thing where they dull out the screen and show as a nicely styled modal I then got Google’s new gemini-exp-1206 model to write the first draft of the README, this time via my LLM tool:'''
author = "Simon Willison"
year_published = 2024
clearnet = "https://simonwillison.net/2024/Dec/7/prompts-js"
