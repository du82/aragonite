["https://simonwillison.net/2024/Dec/22/link-blog"]
title = "My approach to running a link blog"
description = "I started running a basic link blog on this domain back in November 2003—publishing links (which I called “blogmarks”) with a title, URL, short snippet of commentary and a “via” …"
full_description = "I started running a basic link blog on this domain back in November 2003—publishing links (which I called “blogmarks”) with a title, URL, short snippet of commentary and a “via” link where appropriate. In April of this year I finally upgraded my link blog to support Markdown, allowing me to expand my link blog into something with a lot more room. The way I use my link blog has evolved substantially in the eight months since then. I’m going to describe the informal set of guidelines I’ve set myself for how I link blog, in the hope that it might encourage other people to give this a try themselves. The point of that article was to emphasize that blogging doesn’t have to be about unique insights. The value is in writing frequently and having something to show for it over time—worthwhile even if you don’t attract much of an audience (or any audience at all). In that article I proposed two categories of content that are low stakes and high value: things I learned and descriptions of my projects. I realize now that link blogging deserves to be included a third category of low stakes, high value writing. We could think of that category as things I’ve found. That’s the purpose of my link blog: it’s an ongoing log of things I’ve found—effectively a combination of public bookmarks and my own thoughts and commentary on why those things are interesting. When I first started link blogging I would often post a link with a one sentence summary of the linked content, and maybe a tiny piece of opinionated commentary. After I upgraded my link blog to support additional markup (links, images, quotations) I decided to be more ambitious. Here are some of the things I try to do: There are a lot of great link blogs out there, but the one that has influenced me the most in how I approach my own is John Gruber’s Daring Fireball. I really like the way he mixes commentary, quotations and value-added relevant information. The technology behind my link blog is probably the least interesting thing about it. It’s part of my simonwillisonblog Django application—the main model is called Blogmark and it inherits from a BaseModel defining things like tags and draft modes that are shared across my other types of content (entries and quotations)."
author = "Simon Willison"
year_published = 2024
clearnet = "https://simonwillison.net/2024/Dec/22/link-blog"
