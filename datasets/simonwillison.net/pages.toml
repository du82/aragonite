["https://simonwillison.net/2002/Aug/14/bulletinBoardSpam"]
title = "Bulletin board spam"
description = "My friend Tim recently received a spam from a company called TrafficBBS, who specialise in bulk submissions to 50,000 search engines and 120,000+ BBS (web based bulletin boards). A quick …"
full_description = "My friend Tim recently received a spam from a company called TrafficBBS, who specialise in bulk submissions to 50,000 search engines and 120,000+ BBS (web based bulletin boards). A quick look at their list of targetted forums reveals that they are spidering and spamming a whole bunch of simple web based forum scripts that don’t require user authentication, such as WWWBoard. This is a form of spam I wasn’t aware of until now. It’s scary to think how easily the system could be expanded to automatically register on more advanced widespread forum systems such as vBulletin. Incidentally, their crawler (or one of them) identifies itself as PHP/4.2.1 and uses the IP address 211.101.236.142."
