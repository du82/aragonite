["https://simonwillison.net/2022/Mar/14/shot-scraper-template"]
title = "Instantly create a GitHub repository to take screenshots of a web page"
description = "I just released shot-scraper-template, a GitHub repository template that helps you start taking automated screenshots of a web page by filling out a form. shot-scraper is my command line tool …"
full_description = "I just released shot-scraper-template, a GitHub repository template that helps you start taking automated screenshots of a web page by filling out a form. shot-scraper is my command line tool for taking screenshots of web pages and scraping data from them using JavaScript. One of its uses is to help create and maintain screenshots for documentation, making it easy to update them to include changes to the design of the underlying pages. To make this as easy as possible, I’ve created a GitHub repository template that automates the process of setting up shot-scraper to run against a URL. Pick a name for your new repository and paste the URL of the page you want to screenshot into the description field. That’s it! Your new repository will be created, a GitHub Actions automation script will run for a few seconds and your new screenshot will be added to the repository as a file called shot.png. Here’s an example repository I created using the template: simonw/simonwillison-net-shot—and here’s the shot.png file from that repo: You can re-take the screenshot any time you want by clicking the “Run workflow” button in the Actions tab: You can edit that file to change the settings that apply to your screenshot, or to add further URLs to take shots of like this: The workflow triggers when a change is made to the repository (including edits to the shots.yml file) or when the user manually clicks “Run workflow”. This is the trick that makes everything else work, which I picked up from Bruno Rocha last year. It ensures that this workflow job only runs on copies of the template, not on the initial template repository itself. This is necessary because a later step creates a file in the repository if it doesn’t yet exist based on the description URL provided by the user. This is boilerplate that I use in most of my GitHub Actions workflows: it sets up Python 3.10, and also configures a cache such that Python requirements in a requirements.txt file persist from one invocation to another without having to be re-downloaded from PyPI."
author = "Simon Willison"
year_published = 2022
clearnet = "https://simonwillison.net/2022/Mar/14/shot-scraper-template"
