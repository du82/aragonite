["https://simonwillison.net/2024/Nov/16/civic-band"]
title = "Project: Civic Band—scraping and searching PDF meeting minutes from hundreds of municipalities"
description = "I interviewed Philip James about Civic Band, his “slowly growing collection of databases of the minutes from civic governments”. Philip demonstrated the site and talked through his pipeline for scraping …"
full_description = "I interviewed Philip James about Civic Band, his “slowly growing collection of databases of the minutes from civic governments”. Philip demonstrated the site and talked through his pipeline for scraping and indexing meeting minutes from many different local government authorities around the USA. Philip was inspired to start thinking more about local government after the 2016 US election. He realised that there was a huge amount of information about decisions made by local authorities tucked away in their meeting minutes,but that information was hidden away in thousands of PDF files across many different websites. There was this massive backlog of basically every decision that had ever been made by one of these bodies. But it was almost impossible to discover because it lives in these systems where the method of exchange is a PDF. Philip lives in Alameda, which makes its minutes available via this portal powered by Legistar. It turns out there are a small number of vendors that provide this kind of software tool, so once you’ve written a scraper for one it’s likely to work for many others as well. It’s running the datasette-search-all plugin and has both tables configured for full-text search. Here’s a search for housing: The public Civic Band sites all run using Datasette in Docker Containers—one container per municipality. They’re hosted on a single Hetzner machine. The ingestion pipeline runs separately from the main hosting environment, using a Mac Mini on Philp’s desk at home. OCR works by breaking each PDF up into images and then running Tesseract OCR against them directly on the Mac Mini. This processes in the order of 10,000 or less new pages of documents a day. Philip treats PDF as a normalization target, because the pipeline is designed around documents with pages of text. In the rare event that a municipality publishes documents in another format such as .docx he converts them to PDF before processing. PNG images of the PDF pages are served via a CDN, and the OCRd text is written to SQLite database files—one per municipality. SQLite FTS provides full-text search."
author = "Simon Willison"
year_published = 2024
year_updated = 2024
clearnet = "https://simonwillison.net/2024/Nov/16/civic-band"
tags = ["articles", "band", "band—scraping", "civic", "data-journalism        52", "datasette        431", "hundreds", "meeting", "minutes", "municipalities"]
