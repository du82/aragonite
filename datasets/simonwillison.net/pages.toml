["https://simonwillison.net/2024/Dec/4/amazon-nova"]
title = "First impressions of the new Amazon Nova LLMs (via a new llm-bedrock plugin)"
description = "Amazon released three new Large Language Models yesterday at their AWS re:Invent conference. The new model family is called Amazon Nova and comes in three sizes: Micro, Lite and Pro. …"
full_description = "Amazon released three new Large Language Models yesterday at their AWS re:Invent conference. The new model family is called Amazon Nova and comes in three sizes: Micro, Lite and Pro. I built a new LLM plugin called llm-bedrock for accessing the models in the terminal via boto3 and the Amazon Bedrock API. My initial impressions from trying out the models are that they’re mainly competitive with the Google Gemini family. They are extremely inexpensive—Nova Micro slightly undercuts even previously cheapest model Gemini 1.5 Flash-8B—can handle quite large context and the two larger models can handle images, video and PDFs. Amazon list their pricing in price per 1,000 input tokens. Almost everyone else uses price per million, so I’ve done the conversion. As you can see, Nova Micro is .25 of a cent cheaper on input and 1 cent cheaper on output than previous champion Gemini 1.5 Flash-8B. So Nova Pro isn’t priced the same as those top-tier models, in fact it’s priced about the same as Claude 3.5 Haiku (after their new 20% price drop). Amazon Nova Premier – Our most capable multimodal model for complex reasoning tasks and for use as the best teacher for distilling custom models. Amazon Nova Premier is still in training. We’re targeting availability in early 2025. Comparing models based on token pricing doesn’t capture the entire picture because models use different tokenizers and hence may use up different numbers of tokens for the same input, especially with images and video added to the mix. I’d like to implement a good way to compare those counts in the future. In terms of capabilities: all of the above models can handle image inputs now, with the exception of Amazon Nova Micro and o1-mini and o1-preview which are text only. Video support is currently unique to the Gemini and Nova models—Anthropic and OpenAI don’t have any that handle video yet. See Amazon Nova video understanding limitations for more details. Nova models can’t handle audio, and in fact ignore audio in video that they analyze (treating it as a sequence of images). Gemini models have audio input, as does OpenAI’s gpt-4o-audio-preview model ($100/$200 for input/output of those audio tokens)."
author = "Simon Willison"
year_published = 2024
clearnet = "https://simonwillison.net/2024/Dec/4/amazon-nova"
