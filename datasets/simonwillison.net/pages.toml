["https://simonwillison.net/2024/Nov/9/visualizing-local-election-results"]
title = "Visualizing local election results with Datasette, Observable and MapLibre GL"
description = "Alex Garcia and myself hosted the first Datasette Open Office Hours on Friday—a live-streamed video session where we hacked on a project together and took questions and tips from community …"
full_description = "Alex Garcia and myself hosted the first Datasette Open Office Hours on Friday—a live-streamed video session where we hacked on a project together and took questions and tips from community members on Discord. We didn’t record this one (surprisingly not a feature that Discord offers) but we hope to do more of these and record them in the future. Every county appears to handle counting and publishing election results differently. For San Mateo County the results are published on this page, and detailed per-precinct and per-candidate breakdowns are made available as a CSV file. (I optimistically set up a Git scraper for these results in simonw/scrape-san-mateo-county-election-results-2024 only to learn that the CSV is updated just once a day, not continually as the ballots are counted.) I’m particularly invested in the results of the Granada Community Services District board member elections. Our little town of El Granada is in “unincorporated San Mateo County” which means we don’t have a mayor or any local officials, so the closest we get to hyper-local government is the officials that run our local sewage and parks organization! My partner Natalie ran the candidate forum event (effectively the debate) featuring three of the four candidates running for the two open places on the board. I started by using the pre-configured datasette-import plugin to import the data from the CSV file into a fresh table: The table imported cleanly, but all of the columns from the CSV were still being treated as text. I used the datasette-edit-schema plugin to switch the relevant columns to integers so that we could run sums and sorts against them. The resulting 15,589 rows represent counts from individual precincts around the county for each of the races and measures on the ballot, with a row per precinct per candidate/choice per race. Since I’m interested in the Granada Community Services District election, I applied a facet on “Contest_title” and then used that to select that specific race."
author = "Simon Willison"
year_published = 2024
