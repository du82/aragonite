full_description = "First, choose the map you want to install HTML5 World Map HTML5 US Map HTML5 Canada Map HTML5 North America Map HTML5 County Map HTML5 Congress Map HTML5 State Map HTML5 Custom Map HTML5 Europe Map HTML5 UK Map HTML5 Australia Map HTML5 Country Map Host your map files on SimpleMaps.com (detailed instructions). Note: You could also self-host the map files by uploading the mapdata.js and worldmap.js files to your server over FTP. However, it is simpler to use our hosting. By default, the Joomla editor will strip out any <script> tags that you paste into an Article. So, we need to temporarily turn off the Joomla editor. To do this, click System Global Configuration. It's now possible to paste the embedding code from Step 4 into an Article and the map will appear. Feel free to do this if you just want to quickly verify the map will work. However, if you ever re-enable the editor and make changes to your Article, the embedding code will be removed and the map will disappear. Therefore, we recommend adding the map as a Module. Then, you can re-enable the editor, add the map Module to your Article, and still be able to edit the Article without losing the map. Give the module a Title of Map. Paste the embedding code from Step 4 into the text box. Finally, Save your changes. Finally, we can add the map to an article. Go to Content Articles and edit an existing Article or create a new one. These docs are for version 4.5+.Older versions: 4.4, 4.3, 4.1, 4.0, 3.9, 3.8 Already a customer and need to update? Home | License | Privacy | Releases | Testimonials | Resources | Documentation | Order Lookup | All Maps | FAQs Formerly FlashUSAmap.com and FlashWorldMap.com SimpleMaps.com is a product of Pareto Software, LLC. © 2010-2025."
