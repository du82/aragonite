["https://simplemaps.com/docs/responsive-map"]
title = """
Make your Map Responsive - HTML5/JavaScript Interactive Map Documentation
 | Simplemaps.com"""
description = "Instructions on how to your interactive HTML5 map responsive to work well with both mobile devices and desktop computers."
full_description = 'With the advent of tablets and smart phones, webmasters can no longer safely assume that their visitors are using a desktop computer with a popular screen resolution. This has led to the popularity of responsive web design: the effort to make a web page accessible across a wide range of devices. If you are using our online customization tool: go to the "Settings" tab and give the Map Width a value of responsive: If you are editing the mapdata.js file in a text editor: give the width in the main_settings a value of responsive. This will make the map expand or contract to fit the width of its parent div. The map will resize itself if the browser is resized or the orientation of a mobile device switches between portrait and landscape. The state of the map will remain constant as the map scales. For example, if a user is zoomed in on "South America" and the map is resized, the user will not be zoomed out like he/she would be if the map was reloaded. Make sure that you are using a responsive web design! The map can only expand to fill the space available to it. If it is contained in a div with the CSS attribute max-width: 400px; the map will never exceed this size. These docs are for version 4.5+.Older versions: 4.4, 4.3, 4.1, 4.0, 3.9, 3.8 Already a customer and need to update? Home | License | Privacy | Releases | Testimonials | Resources | Documentation | Order Lookup | All Maps | FAQs Formerly FlashUSAmap.com and FlashWorldMap.com SimpleMaps.com is a product of Pareto Software, LLC. © 2010-2025.'
