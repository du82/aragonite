["https://simplenote.com/2021/10/05/widgets-on-ios"]
title = "Widgets on iOS – Simplenote"
description = "Prepare for your life to get easier: Simplenote widgets are coming to iOS. As of v4.45, anyone with Simplenote on their iPhone or iPad will be able to add our widgets directly to their device’s home screen. There are three widgets to choose from, in a range of sizes. New Note A big, blue shortcut—that’s…"
full_description = "Widgets on iOS Posted bySylvester WilmottOctober 5, 2021Posted inUncategorizedTags:iOS, widget Prepare for your life to get easier: Simplenote widgets are coming to iOS. As of v4.45, anyone with Simplenote on their iPhone or iPad will be able to add our widgets directly to their device’s home screen. There are three widgets to choose from, in a range of sizes. New Note A big, blue shortcut—that’s all you have to click on to create a new note. One tap takes you straight to the editor in the Simplenote app, so you can start taking notes instantly. This widget is available in the small size only. Note Is there a particular note you access frequently? This widget lets you jump right back into it, without having to search. The widget displays your most recent note by default. You can also long-press the widget and select “Edit Widget” to change which note is displayed. This widget is available in small and medium sizes. Note List With this widget, you’ve got options: It can display your “All Notes” list or the list of notes associated with one of your tags. Whatever you choose, you can tap one of the notes to open it in the app’s editor. If you display the list of notes with a particular tag, tapping the blue new note icon in the top right will automatically apply that tag to your new note. In this widget, notes are ordered according to your sorting settings in the app. It is available in medium and large sizes. We hope you enjoy using our new Widgets. Got feedback? Don’t hesitate to tell us what you think. Get The App Download Simplenote on the App Store We hope you enjoy using widgets, and happy noting! – The Simplenote Team Share this:TwitterFacebookLike Loading... Posted bySylvester WilmottOctober 5, 2021Posted inUncategorizedTags:iOS, widget Published by Sylvester Wilmott Mobile designer @ Automattic View more posts"
