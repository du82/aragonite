["https://simplenote.com/2024/09/09/log-in-with-email-and-advanced-shortcuts-now-available"]
title = "Log in with Email and Advanced Shortcuts Now Available – Simplenote"
description = "Hello, Simplenoters! We’re thrilled to introduce some exciting new features now available in Simplenote. Let’s dive in. Log in with Email We’ve made logging in even easier and more secure. Now, you can sign in to Simplenote using a code sent directly to your email. Just enter your account email, and we’ll send you a…"
full_description = "Log in with Email and Advanced Shortcuts Now Available Posted byDanSeptember 9, 2024Posted inUncategorized Hello, Simplenoters! We’re thrilled to introduce some exciting new features now available in Simplenote. Let’s dive in. Log in with Email We’ve made logging in even easier and more secure. Now, you can sign in to Simplenote using a code sent directly to your email. Just enter your account email, and we’ll send you a login code. On certain platforms, you can even tap a button in the email to be signed in automatically. Prefer using your password? No problem! After entering your email, simply tap “Enter password” to log in the traditional way. Currently, the Log in with Email feature is available on all apps except for Windows and Linux. We’re putting the final touches on those versions and will roll them out in the coming weeks. New iOS and MacOS Shortcuts Shortcuts on iOS and macOS make it easier to interact with your favorite apps. Simplenote has had basic shortcuts for creating and managing notes, but we’ve now expanded this functionality to give you even more control and automation possibilities. Here’s a list of the new shortcuts: Open New Note – Open Simplenote and start a new note. Open Note – Open Simplenote and go to a selected note. Append to Note – Enter some text and append it to the end of one of your existing notes. Create New Note with Content – Enter some text and append it to the end of a new note in Simplenote. Copy Note Content – Copy all of the content of a selected note. Find Note – Search through your notes by searching note content. Find Note with Tag – Find a note by filtering them using a selected tag. Individually, these shortcuts are powerful, but when combined with others, they can transform how you use Simplenote. For example, you could create a shortcut that finds a note, copies its content, and pastes it into another app—all without ever opening Simplenote. Here’s an example of a simple shortcut that appends to a shopping list note using speech-to-text: You can also combine “Find Note” and “Append to Note.” This allows you to copy text from any app, run the shortcut, find a note, and add the text to the end of that note—all without leaving the app you’re using. You can find these new options in the Apple Shortcuts app. That’s all for now. We hope you enjoy these new features! Happy Noting,The Simplenote Team Share this:TwitterFacebookLike Loading... Posted byDanSeptember 9, 2024Posted inUncategorized Published by Dan Pokémon Trainer at Automattic, Inc. View more posts"
