["https://simplenote.com/2019/01/16/blogging-with-simplenote"]
title = "Blogging with Simplenote – Simplenote"
description = "Simplenote is powered by Automattic, which also runs WordPress.com — so as you can imagine, we love blogging. I've written for a few different sites, some using WordPress and some not. No matter where I publish my posts, I have a great, consistent writing experience by drafting in Simplenote first. I use Simplenote from the…"
full_description = "Blogging with Simplenote Posted byMelissa SJanuary 16, 2019Posted inSimplenote, Tips Simplenote is powered by Automattic, which also runs WordPress.com — so as you can imagine, we love blogging. I’ve written for a few different sites, some using WordPress and some not. No matter where I publish my posts, I have a great, consistent writing experience by drafting in Simplenote first. I use Simplenote from the moment I think of an idea, by opening up a new note and adding a title. Later, I can check those notes and start writing more. Because it’s in Simplenote and synced to all my devices, I can do this from anywhere I happen to be! If I think of a great opening line for a post while I’m out having coffee, I can open up Simplenote on my phone and jot that down. That way, it’s always waiting for me when I get back to my computer and ready to flesh things out. If the site will take formatting and reproduce it, like the new WordPress Editor, I turn on Markdown to write the blog post. When I’m done, I copy the full text of the note. Pasting that into the editor preserves all the formatting and splits it into the appropriate blocks. It will do this whether you copy the text from the Edit view showing the Markdown, or from the Preview option displaying the actual formatting. It’s like magic! This saves some time, since I can type the formatting easily in Markdown while I’m taking my notes. It even loads the image from the URL provided in the image Markdown! Some tips: Add titles to your notes right away so you know where to look later.Use Markdown to bold and italicize text, create headers, and add lists.Focus mode on the desktop apps is a great way to write with less distraction (pictured in the gif above).Publish the note from the Simplenote app to share it with a friend or editor first. Do you have any tips for Blogging with Simplenote? What do you use Simplenote for? Written in Simplenote, edited and posted with the new WordPress Editor Share this:TwitterFacebookLike Loading... Posted byMelissa SJanuary 16, 2019Posted inSimplenote, Tips Published by Melissa S Bio Goes Here View more posts"
year_published = 2019
year_updated = 2019
