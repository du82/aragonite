["https://simplenote.com/2019/02/06/a-better-way-to-keep-track-of-your-tasks-check"]
title = "A Better Way to Keep Track of Your Tasks? Check! – Simplenote"
description = "Simplenote is great for keeping your life organized without getting in your way. Now, it gives you a whole new way to stay on top of your tasks: Checklists! Here's one in action: Adding a checklist in the macOS app. On our mobile apps, you'll find a new button in the editor toolbar to add…"
full_description = "A Better Way to Keep Track of Your Tasks? Check! Posted byDanFebruary 6, 2019Posted inAndroid, iOS, Linux, macOS, Releases, Simplenote, Windows Simplenote is great for keeping your life organized without getting in your way. Now, it gives you a whole new way to stay on top of your tasks: Checklists! Here’s one in action: Adding a checklist in the macOS app. On our mobile apps, you’ll find a new button in the editor toolbar to add a checklist. On Desktop, head to Format → Insert Checklist. Nested Checklists are also supported, in case you need an extra level of organization. A nested checklist in the iOS app. Checklists are compatible with the GitHub task lists markdown syntax, so Markdown users will see their existing lists automatically transform to checkable lists in the app! You can see this in action by typing “- [ ]” in a note. And as always, every update to your checklists will get synced with all of your devices, for free. Collaborate on a Checklist Did you know you can collaborate on a note with other Simplenote users? With checklists that becomes even more powerful — use shared notes to working with others on shopping lists, to-dos, and more. To share a note with another user, add their Simplenote account email address to the tags field of the note, or use the Sharing menu in the app. Get the App New to Simplenote? It’s free, and you can download it here. We really hope you enjoy using Checklists, and happy noting! – The Simplenote Team Share this:TwitterFacebookLike Loading... Posted byDanFebruary 6, 2019Posted inAndroid, iOS, Linux, macOS, Releases, Simplenote, Windows Published by Dan Pokémon Trainer at Automattic, Inc. View more posts RDL says: February 6, 2019 at 10:24 am It’s a really nice feature, and one that helps it compar to other tools. Lists are useful for simple shopping, ingredients, and todos, but they also can let you use notes as GTD projects with tasks as subcomponent. What I really want is end-to-end encryption. That’s a modern must have. Simplenote can be hacked, and all notes are wide open. You can’t even encrypt a set of notes, say with a special “Encrypted” tag, let alone have everything protected. I’ve stopped using the service because it isn’t trustworthy, and without encryption it’s claims are compromised. Shame. Great service otherwise."
