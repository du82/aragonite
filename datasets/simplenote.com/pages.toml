["https://simplenote.com/2020/03/24/search-is-getting-searchier"]
title = "Search Is Getting… Searchier – Simplenote"
description = "We want you to be able to find your notes more easily so you can spend less time locating and more time note-taking. Enter: advanced search. Download the latest version of Simplenote and you’ll be able to search your tags, search notes by tag or – if you’re a legendary note tagger† – combine multiple…"
full_description = "Search Is Getting… Searchier Posted bySylvester WilmottMarch 24, 2020March 23, 2020Posted inAndroid, iOS, Simplenote We want you to be able to find your notes more easily so you can spend less time locating and more time note-taking. Enter: advanced search. Download the latest version of Simplenote and you’ll be able to search your tags, search notes by tag or – if you’re a legendary note tagger† – combine multiple tags in one search. We’ll also be adding sorting options directly to search, so you can find that one note you made in February 2011, or maybe it was in April 2013 that you’re sure you used the word “astronauts” and contained something important. To start using the new search features, make sure you’re running the latest version of the Simplenote app. Then just start searching and you’ll get tag suggestions based on what you type. Currently available on iOS and Android, if you don’t see the new search yet, keep your app updated – it will be with you soon! Got feedback? Don’t hesitate to tell us what you think. Get the App New to Simplenote? It’s free, and you can download it here. We hope you enjoy using Search, and happy noting! – The Simplenote Team † How many tags do you have in Simplenote? Tell us in the comments. The person with the most tags gets to feel good about their exemplary organizational skills. Share this:TwitterFacebookLike Loading... Posted bySylvester WilmottMarch 24, 2020March 23, 2020Posted inAndroid, iOS, Simplenote Published by Sylvester Wilmott Mobile designer @ Automattic View more posts Mac says: March 24, 2020 at 9:54 am Searchier Search on iOS v4.16 also has a glaring flaw for someone with a lot of notes. Typing in the first letter brings the app to a halt while it finds every iteration of that letter, up to twenty seconds in some cases. This was not a problem in earlier iterations of the app. somebody says: March 28, 2020 at 2:26 pm You just lost my writing. The stuff I wrote doesn’t exist even locally, on my Android phone. History was unrecoverable. I had to restart the app. It only shows me old history. I’ve had a lot of trouble with your app recently, weird duplicated sentences. But data loss has always been a problem. It’s not the first time you erased my writing. It’s just the first time I’m not able to recover at all. Because there is no history of what I wrote. At. All. It’s unacceptable that an app with NO SAVE BUTTON, that handles saves automatically, doesn’t actually save sometimes. I’m a Ctrl+S freak and I never lose data. In any regular app, that allows ME to be in control and decide when and what to save. It was a mistake to use your SIMPLE note."
year_published = 2020
year_updated = 2020
