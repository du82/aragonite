lso combine “Find Note” and “Append to Note.” This allows you to copy text from any app, run the shortcut, find a note, and add the text to the end of that note—all without leaving the app you’re using. You can find these new options in the Apple Shortcuts app. That’s all for now. We hope you enjoy these new features! Happy Noting,The Simplenote Team Posted byDanSeptember 9, 2024Posted inUncategorized"
