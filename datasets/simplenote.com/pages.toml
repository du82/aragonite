title = "Bring All Your Notes Home with the New Importer – Simplenote"
description = "We're pleased to announce that we've added note importing to our desktop app for Windows, Linux, and macOS: now it's super-easy to import notes from other services, including Evernote, so all your ideas and links and snippets are in one place. Importing notes into the Linux App. (A quick note, Mac users! To use the…"
full_description = "Bring All Your Notes Home with the New Importer Posted byDanNovember 29, 2018Posted inLinux, macOS, Releases, Simplenote, Windows We’re pleased to announce that we’ve added note importing to our desktop app for Windows, Linux, and macOS: now it’s super-easy to import notes from other services, including Evernote, so all your ideas and links and snippets are in one place. Importing notes into the Linux App. (A quick note, Mac users! To use the importer, make sure you’re using the Electron version of the app, available here. The standard version of the app available in the Mac App Store doesn’t support importing yet.) To get started, select File → Import Notes from the app menu, then pick the type of notes you’ll be importing. The options are: Evernote (.enex) exportsSimplenote (.json) exportsPlain text files (.txt) (Not sure how to get your stuff out of Evernote? Here are the instructions on exporting.) You can browse to the notes you want to import or drag and drop a file into the import window, and the app takes care of the rest. If you’re importing notes with Markdown and you’d like to keep them that way, check the Enable Markdown on all notes box and they’ll be automatically configured as a Markdown note in Simplenote. This release also adds a lot of great enhancements and bug fixes. For more details, check out the release notes on GitHub. We hope you enjoy this update, and happy noting (and importing!). – The Simplenote Team Share this:TwitterFacebookLike Loading... Posted byDanNovember 29, 2018Posted inLinux, macOS, Releases, Simplenote, Windows Published by Dan Pokémon Trainer at Automattic, Inc. View more posts"
