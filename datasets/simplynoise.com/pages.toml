title = "Press + Accolades – SimplyNoise"
description = "Press + Accolades"
full_description = "The Wall Street Journal – Listening to Shhhh in the City CNet – Tune out co-workers, other sounds with SimplyNoise LifeHacker – SimplyNoise Generates White Noise in Your Browser ADDitude – Quiet the Riot: Blocking out ADHD Distractions “The site is cleanly designed, and you don’t need a degree in sound engineering to use it. If you have trouble shutting out the world when you need to study, write, paint, spark creativity, sleep, or get down to business at work, this free service is perfect for your needs. ” -Douglas Cootey, ADDitudemag “White noise can be helpful for everything from aiding sleep to blocking distraction … SimplyNoise is a no-nonsense application that does just that.”-Adam Pash, LifeHacker “I was able to concentrate more deeply while writing a paper; and it cured my eye strain headache. If you’re tired of background noise distracting your work, or have headaches you’re tired of overmedicating give SimplyNoise a try, it can only help!”-Cam Norton, WXUT “An easy-to-use white-noise generator that blocks out distractions and creates a quiet, workable atmosphere. Used properly, Simply Noise can give your classroom the kind noise it needs.”-Aaron Fowles, Intructify “You are a terrific resource for many of our patients. Thank you for making this available.”-Billy Martin, Director OHSU Tinnitus Clinic “I often write and translate in an office environment, which can be distracting. Sometimes people talk around me or work together on something, and sometimes noise from outside breaks my concentration. When I need to just focus, I find myself turning time and again to SimplyNoise.”-Erez Zuckerman, AOL / DownloadSquad “If you’re at work and your co-workers won’t stop chatting … can’t seem to get over the concentration hump of focusing with music blaring, there’s SimplyNoise, a white noise generator that runs right in your browser.”-Josh Lowensohn, CNET News"
