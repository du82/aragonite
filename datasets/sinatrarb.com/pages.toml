title = "Sinatra: The Blog"
full_description = "Sinatra v2.1.0 Posted by Kunpei Sakai on Monday, September 05, 2020 # Today we would like to inform you that we have released Sinatra v2.1.0. It’s a big milestore for us and contains some bug fixes and new features. Read more… Happy new year & Sinatra 2.0.8! Posted by Kunpei Sakai on Wednesday, January 01, 2020 # We would like to inform you that we have released Sinatra v2.0.8. Read more… A new maintainer and Sinatra 2.0.6! Posted by Kunpei Sakai on Monday, August 21, 2019 # We would like to inform you that we have released Sinatra v2.0.6. Not only that, but we also have a great news for us! Read more… Sinatra 2.0.5 Posted by Kunpei Sakai on Sunday, December 23, 2018 # We would like to inform you that we have released Sinatra v2.0.5. Read more… Sinatra 2.0.2 and 2.0.3 are out Posted by Kunpei Sakai on Saturday, June 9, 2018 # We would like to inform you that we have released Sinatra v2.0.2 and v2.0.3. Read more… Rack::Protection v1.5.5 is out Posted by Kunpei Sakai on Thursday, March 8, 2018 # I have just released Rack Protection v1.5.5 for backporting security fix. Read more… Sinatra 2.0.1 is out! Posted by Kunpei Sakai on Monday, February 19, 2018 # I have just released Sinatra v2.0.1 and Mustermann v1.0.2. Read more… Sinatra Two Point Oh! Posted by zzak on Monday, May 15, 2017 # Today, I’m pleased to FINALLY announce that Sinatra 2.0 was released! Read more… Sinatra 1.4.0, 1.3.6, 1.2.9 released! Posted by Konstantin Haase on Friday, March 15, 2013 # I’ve just released Sinatra 1.4.0, 1.3.6 and 1.2.9. Read more… New feature release, Contrib and Recipes Posted by Konstantin Haase on Friday, September 30, 2011 # We’re proud to announce two new releases today: 1.3.0 and 1.2.7. We’re also simultaneously releasing sinatra-contrib and would like to officially announce the recently launched Sinatra Recipes project. Read on for more goodness! Read more… Sinatra Loves Dancer Posted by Konstantin Haase on Thursday, July 21, 2011 # “The only cool PR is provided by one’s enemies. They toil incessantly and for free.” - Marshall McLuhan Read more… What's New in Sinatra 1.2? Posted by Konstantin Haase on Thursday, March 3, 2011 # As announced on the mailing list, we have just released Sinatra 1.2.0. Let’s have a closer look at the new features. Read more… Blog revived Posted by Konstantin Haase on Thursday, March 3, 2011 # It has been quiet on this blog recently. Announcements, like the 1.0 and 1.1 releases, have only been made on the mailing list. Plans are to change this and accompany mailing list announcements with in-depth articles about new feature releases. Read more… We Have a FAQ Now Posted by Ryan Tomayko on Thursday, January 29, 2009 # Just getting started with Sinatra and wondering how to do something that should be obvious? Check out The FAQ. We culled a few weeks worth of IRC logs and mailing list threads to compile the initial set of entries and we’ll be adding to the list considerably over the coming weeks. Read more… What's New in Sinatra 0.9.0 Posted by Ryan Tomayko on Sunday, January 18, 2009 # This is the first in a series of 0.9.x releases designed to move Sinatra toward a rock solid 1.0. While we were able to add a touch of new hotness in this release, the major focus has been on getting the codebase shaped up for future development. Many longstanding bugs and minor annoyances were corrected along the way. Read more…"
