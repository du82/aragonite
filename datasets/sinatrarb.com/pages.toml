["https://sinatrarb.com/2018/12/23/sinatra-2.0.5.html"]
title = "Sinatra 2.0.5"
full_description = "Sinatra 2.0.5 By Kunpei Sakai on Sunday, December 23, 2018 We would like to inform you that we have released Sinatra v2.0.5. Before we begin, I want to thank everyone who contributed, and continued to use and support the project. Releases This release includes the release of the following gems: sinatra: v2.0.5 sinatra-contrib: v2.0.5 rack-protection: v2.0.5 Erubi Support We officially began supporting Erubi. Please report something when combining Sinatra and Erubi if there is something wrong. Thanks for the suggestion, @tkmru! Changes Find out what’s new in v2.0.5 in CHANGELOG Thank you Thank you everyone who has contributed over the years to this project, and continues to ensure it lives on. In addition, want to give a special thanks to the key contributors for this release: @jkowens, @tkmru Join us We are currently working on discussing the release cycle and activating the community to make Sinatra development better. Sinatra has a lot of issues. Please join us if you’re interested in our development. Sinatra: Contributing"
