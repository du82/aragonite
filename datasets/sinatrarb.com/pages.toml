title = "Sinatra in The Wild"
full_description = "NOTE: Feel free to fork Sinatra’s website on GitHub and add your own entry to the wild.markdown file. Just push and send a pull request. We’ll take care of the rest. Applications SequenceServer An easy-to-setup BLAST sequence search server Marley the blog engine without <textareas> Postview a simple blog-engine that render text files written in Markdown. Scanty an even more minimalist blogging engine Scanty using CouchDB Haze a lightweight and minimalist blogging engine using flat text files. Wind HTML5 blog engine focused in a easy, extensible and fast admin. git-wiki - a git-powered wiki Wordnatra an interface to Princeton’s WordNet lexical dictionary GitHub-FogBuz logs your GitHub commits with FogBuz Notable listens on Jabber to take your notes and then displays them back to you Dash Sinatra provides a Ruby API to push metrics from an app to the Giftsmas Gift Tracking Website using Sinatra, Sequel, and Scaffolding Extensions Toopaste Pastebin site created with Sinatra and DataMapper Columnlog Tiny feed fetching app Kapow Comics on your iPhone Knapsack Pack pages into data URIs Thumblmonks Delayed HTTP Requests weaky a basic CouchDB wiki Amnesia an app that presents memcached server stats So Nice is a Small web interface to control iTunes, Rhythmbox or MPD sinatra-rubygems A complete reimplementation of the gem server command as a Sinatra application Nesta is an SEO oriented CMS/blog for developers Hancock A Single Sign On provider based on OpenID Hancock Client Rack middleware client for the Hancock server, written in Sinatra JubiGems Custom RubyGems server. Sinatra Saucer JRuby web application frontend for Flying Saucer, which converts XHTML into a PDF WineAdds micro-app that calculates common additions to wine Jaconda A simple team collaboration service that allows you to create chat rooms for groups through Gtalk/Jabber protocol. REST API is written in Sinatra Picky - a fast & clever semantic search engine. GitHub High Scores - A fun way to rank GitHub repository contributors in a 8-bit, 80’s-tastic aracdey viewing environment. Git-Webby - Git Smart HTTP Ruby/Sinatra implementation with useful features. Trudy - A Nabaztag server. Markdown Tree - Serve a Hierarchy of Markdown files simply (like mksite or other site generators, only dynamic) streetart.io streetart.io allows you to share and discover interesting street art, public art and sculptures around you and your city. API is powered by Sinatra and Redis. TaskwarriorWeb - A Sinatra-based web interface for the Taskwarrior todo application. Because being a neck-beard is only fun sometimes. Travis CI - Free Hosted Continuous Integration Platform for the Open Source Community VDGB - Subscription based online video training platform for schools and teachers Metaflop An easy to use web application for generating and modulating your own fonts. puresong - A lightweight responsive application with PureCSS and SQLite and Sequel. Gleis PaaS - The Swiss Ruby on Rails Platform as a Service for your web apps Stardew Valley Crop Assistant - The go-to application for planning seasonal crops in the game Stardew Valley. Onetime secret - Secure secret sharing of sensitive content CuttingEdge - Dependency monitoring for projects in multiple languages, including shiny badges and e-mail notifications. Gollum - Gollum is a wiki system that uses git for storage. It supports a variety of markup languages. Libraries and extensions Sinatra::SimpleNavigation Easy creation of navigations (with multiple levels) with sinatra and the simple-navigation gem sinatra_more Library with agnostic generators, form builders, named route mappings, easy mailer support, and more. Sinatra’s Hat Mount models as web services in Sinatra with ease Classy Resources Think resources controller, except for sinatra Sinatra Ditties A collection of plugins and useful helpers Chicago runtime and testing helpers, extensions, and macros commonly used by Thumblemonks Capinatra Quickly deploy Sinatra apps to Passenger. Frankie Easy creation of Facebook applications with Sinatra and the Facebook gem Sinatra Application Template Base app with DataMapper, Haml and RSpec. Fork and build. Sinatra OAuth Provider an OAuth provider implemented with Sinatra Spork Executes some aynchronous code using Sinatra running under Passenger Retweet Create Twitter apps like tweetdreams.org with ease Rack Flash Simple flash hash implementation for Rack with extra sugar for Sinatra. Sinatra-REST generates RESTful routes for your models (ActiveRecord, DataMapper, Stone) url_for Construct absolute paths and full URLs for current application. content_for Rails-like content_for helper for your views (supports ERB and Haml.) Sinatra Effigy Sinatra extension for Effigy (HTML in .html files, Ruby in .rb files) views. Sinatra Mongoid Sinatra extension for Mongoid (MongoDB ORM). Haml::More Adds more functionality to Haml and Sass Sinatra::AdvancedRoutes Makes routes first class objects Sinatra::Compass Integrates the Compass stylesheet framework Sinatra::ConfigFile Adds YAML config file support Sinatra::MoreServer Adds support for more web servers to Sinatra::Base#run! Sinatra::Namespace Adds namespaces, allows namespaces to have local helpers. Sinatra::Reloader Advanced and fast code reloader Sinatra::Static Cache-smart serving of static assets for Sinatra. Sinatra::Sugar Extensions for Sinatra’s standard methods, like #set or #register Sinatra::TestHelper Adds helper methods and better integration for various testing frameworks Sinatra::WebInspector Allows you to inspect a running app Yard::Sinatra Displays Sinatra routes (including comments) in YARD output BigBand Pre-configured replacement for Sinatra::Base setting up useful extensions Sinatra::Jsonp JSONP output helper for Sinatra. Bowtie Admin generator for DataMapper models, on Sinatra. Sinatra::Kittens Random kitten pictures for Sinatra not_found pages. Sinatra::FuzzyLayout Extension for enabling or disabling layout template for views using regex. Sinatra::Param Parameter Validation & Type Coercion for Sinatra. SinatraLogger Provides logging functionaly to Sinatra application. Sinja RESTful, {json:api}-compliant web services in Sinatra React::Sinatra React on Sinatra Integration Sinatra::StrongParams Parameter filtering implementation for Sinatra. Websites CrowdfundHQ Create your own Crowdfunding site, no coding required. LinkedIn is a social network for business contacts I Shoot Film presents Funkaoshi’s film photography posted to Flickr organized by film rolls – on GitHub. Speed of Animals: imagine being a spotted hyena… Fabulously40 Mobile Sinatra powered mobile site of Fabulously40 UploadBooth Sinatra powered Upload Service PasteBooth Sinatra powered multi-lingual Paste Service ShrinkBooth Sinatra powered multi-lingual URL shortening Service Gusg.us Blog - Ridding the long bus Deleanotes themoviedb.org The name says it all :) columnlog Tiny feed fetching app IronRuby Watch their great stats here MooURL The web’s cutest URL shortening service FlexCode iPhone development California PATH program - UC Berkley In-vehicle applications on their Vehicle-Infrastructure Integration server TweepDiff Compare friends/followers of two Twitter users Effectif Development Chirp-chirp Write a Sinatra-based Twitter clone in 200 lines of Ruby code Rdoc.info Auto-generate and host Ruby library documentation using GitHub web hooks All Sorts An aggregator for novel collective nouns, driven by Twitter Scholas Social file-sharing for academics. Gemcutter Awesome gem hosting. The Setup The setup is a bunch of nerdy interviews (Source) A Good Company An awesome little portfolio for a great design company. dbpedia lite takes some of the structured data in Wikipedia and presents it as Linked Data (Source). Evan Lecklider Website showing off work, code examples and experiments built with Sinatra and Compass. DarkArts Studios Projects and source code of Clive Crous Conker Software Micro-company of Tom Philip that makes Web, Android and Boxee apps. Similander extracts keywords from a given URL to find similar pages (Source). Sombras de Papel Website of a pop-rock band from Barcelona (Spain) entirely made using Sinatra + HTML5. There’s also an automatic mobile site. Scrum Primer - A short introduction to Scrum. The code is at Scrum Primer @ Github. Also uses r18n for Sinatra hike.io - The best place to find beautiful hikes online. Hike.io is free, open source, and anyone can make an edit. (Source) Goodnot.es - Listen to the 5 most popular songs of any artist of band. (Source) PC & Network Monitoring - Network/PC monitoring site backed with URL shortening service. Companies using Sinatra Heroku GitHub Apple BBC LinkedIn National Security Agency Agency Rainford Curbed Network Solutious Centro Apartment Therapy Inventive Labs ENTP Engine Yard Citrusbyte Lomographic Society International Nth Metal Interactive Osborne Brook Robot Mode thoughtbot Forward WyeWorks Idealist Digital A Good Company Ylastic Fork Ant genomics database - Fourmidable Mu Dynamics Scribble Squad Stanford Hiboux PentesterLab Animoto Red Hat Travis CI Clearhaus Odd-e Digital Deployment Icicle - Ruby Development Company Robocat Planet Argon Green Touch towards Ondokuz Mayıs University Alumni OnBoard - a web interface to manage Linux-based network appliances Tweeps - conference app to aggregate tweets by attendees Rank Captain - Keyword based mass landing page generator with live template editor Sum - an email-based budgeting application Bloor and Lansdowne is Blansdowne - a photoblog about a neighbourhood in Toronto NYLS Upload Tool - Web-based replacement of FTP Calendar About Nothing - Seinfeld calendar for hackers Congrelate - Congress data mashup visualization tool. SavvyFranchises - Franchise Search + Discovery for the Savvy Entrepreneur. happens.co.za - Add countdown times for any “happening” or event and share it with others"
