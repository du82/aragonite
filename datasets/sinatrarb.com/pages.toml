["https://sinatrarb.com/2011/07/21/sinatra-loves-dancer.html"]
title = "Sinatra Loves Dancer"
full_description = "Sinatra Loves Dancer By Konstantin Haase on Thursday, July 21, 2011 “The only cool PR is provided by one’s enemies. They toil incessantly and for free.” - Marshall McLuhan There are a lot of frameworks out there inspired by Sinatra. One of them is Dancer. Some unknown individual or group was posing as different members of the Sinatra core team on CPAN ratings, a website to comment on the quality of Perl libraries. Those comments were extremely rude and do not represent the opinion of any of the Sinatra developers. Quite the opposite, we love how Sinatra inspired so many of the libraries and are even proud to see Dancer being adopted by Perl developers. We do not know what the agenda of this one individual is, and honestly, we do not care. The harm done by this person to the Dancer project, the Sinatra project and the people he posed as is unacceptable. The incident has been reported to the CPAN ratings team and we hope that those comments will be removed in due time. If you are a Perl developer, we suggest you check out Dancer."
