full_description = "This is our simple policy: your data is none of our business. Our business is selling software and consultancy, not mining your personal information. If you contact us for support we will naturally receive your email address, or Twitter handle, depending on your means of communication, and any information you provide voluntarily. This information is collected solely to help resolve your support inquiry. We retain support emails indefinitely in order to have context from previous interactions which may help us answer your future questions more quickly. If you would like support emails you have sent to be removed, contact: info@sintraworks.com. Apple may collect crash logs if the privacy settings of your device allow it. These reports do not contain your private data. The logs collected by Apple may be made available to us, but will not contain personally identifiable data."
