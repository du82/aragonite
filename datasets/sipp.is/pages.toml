["https://sipp.is/hardcover-paras-palvelu-luettuen-kirjojen-seurantaan-ja-vaihtoehto-goodreadsille"]
title = "Hardcover, paras palvelu kirjojen seurantaan ja vaihtoehto Goodreadsille | Timi Wahalahti"
description = "English version below ↓. Post contains Hardcover referral links, which give me one free month of better features for every two new users. Loma tuntuu aina olevan sellainen hetki kun päädyn etsimään…"
full_description = "Hardcover, paras palvelu kirjojen seurantaan ja vaihtoehto Goodreadsille Posted bysippis 2025-01-082025-01-08 Leave a comment on Hardcover, paras palvelu kirjojen seurantaan ja vaihtoehto Goodreadsille English version below ↓.Post contains Hardcover referral links, which give me one free month of better features for every two new users. Loma tuntuu aina olevan sellainen hetki kun päädyn etsimään, tutkimaan ja testaamaan erilaisia sovelluksia sekä verkkopalveluita. Juuri pääsin vasta vaihtamasta RSS lukijan Feedlystä Feedbiniin. Tällä kertaa innostuin miettimään palvelua luettujen kirjojen seuraamiseen sekä lukujonojen hallitsemiseen. Eräs ilta meni ihan mukavasti testaillessa eri palveluita, kaivellessa tietoa niistä ja tehdessä vertailuja. Työkaverit ja kumppani ainkin tietää, että tähän asti olen pitänyt kirjaston Finna-moottorin lainaushistoriaa sekä varauksia aivan riittävänä. Varauksia kun voi jäädyttää tiettyyn päivään asti, joten sinne voi kerryttää haluamiaan kirjoja vaikka kuinka. Ja jos olen onnistunut, sähköpostiin kilahtaa saapumisilmoitus juuri kun edellinen kirja on loppumassa. Jotenkin kuitenkin takaraivossa on kalvanut hetken aikaa se fakta, että kirjaston lainahistoria alkaa vasta vuodesta 2021. Aivan satavarmasti olen lainannut ja lukenut ennen sitä. Eikö Finnassa vaan ollut päällä historian ikuinen säilyttäminen vai mitä on käynyt? En tiedä, mutta harmittaa koska olen aivan umpisurkea muistamaan asioita kuten lukemani kirjat, hyvät artistit tai biisit. Luotan kaikissa näissä asioissa listoihin. Harmittaa myös siksi, että kuunneltuja biisejä on tullut scrobblattua last.fmään vuodesta 2009 mutta kirjoja ei laitettua mihinkään ylös. Finnan käyttöliittymän karmeus ja kankeus on sekin jäytänyt enemmän tai vähemmän. Etenkin tuo lukujonon ylläpito varauksissa on käynyt hankalammaksi, mitä enemmän siinä on kirjoja. Varauksia ei vaan saa järjestettyä järkevästi tätä käyttötarkoitusta varten. Oli siis tosiaan aika etsiä sovellus tai palvelu kirjoja varten. Goodreadsia on tullut koitettua joskus. Aivan perkeleen antiikkinen käyttöliittymä, eikä muutenkaan oikeen kiinnosta Bezoksen imperiumin tukeminen omalla datalla. The StoryGraph tuntuu olevan kovassa nosteessa, ja sovellus oli mukavan intuitiivinen käyttää vaikkain hieman insinöörivibainen. Käyttöliittymä ei siis ollut antiikkinen eikä mitenkään erityisen huono, mutta kuitenkin jotenkin… blaah. Testaillessa aivan erityisesti kuitenkin nakersi se, miten huonosti StoryGraph löysi kirjoja vaikka sille syötti ISBN numeron jonka perusteella kirja piti pystyä lisäämään heidän tietokantaan. Ei vaan yksinkertaisesti löytänyt hieman “harvinaisempia” kotimaisia teoksia, kuten mainio Laukku-Leena : Naiskulkurin tarina tai Exit. Manuaalisesti olisit voinut lisätä nämä kirjat kaikkine tietoineen, mutta kenellä on aikaa tai jaksamista sellaiseen – varsinkin kun näitä löytämättömiä kirjoja alkoi kertyä useamman käden sormilla laskettava määrä. Jossain kohtaa vastaan tuli Hardcover tyylikkäine ja moderneine käyttöliittymineen. Palvelu näyttää ja tuntuu laadukkaalle. Sille, että sitä kehitetään intohimosta kirjoihin ja laadukkaan palvelun tekemiseen. Hardcover myös löysi jokaisen, siis aivan jokaisen, kirjan onnistuneesti ISBN lisäystyökalun kautta. Eikä uuden kirjan lisäystä laitettu johonkin jonoon josta tulee sitten joskus notifikaatio jos kirjaa ei löydy (StoryGraph ei ole kertonut vieläkään yhdestäkään löytyneestä kirjasta), vaan kirja löytyi aina tuossa tuokiossa odotellessa. Okei, joihinkin näihin harvinaisempiin kirjoihin Hardcover on hakenut väärän kannen ja Kari Haakanan Välitön uhka sekä Tapa hänet ensin on sen mielestä saman kirjan eri versioita. Nämä olen liputtanut palvelun kirjastonhoitajille korjattavaksi. Mistä päästäänkin seuraavaan asiaan johon ihastuin Hardcoverissa. Siinä missä StoryGraphilla ei ole blogia ja muutenkin todella niukasti taustatietoa tarjolla, Hardcover on aivan vastakohta ja pyrkii rakentamaan yhteisöä. Hardcoverilla on avoin Discord sekä innokkaista vapaaehtoisista kerätty kirjastonhoitajien joukko, joka pitää huolen kirjadatasta. Julkaisevat kerran kuussa, inhimillisellä otteella kirjoitettua, raporttia siitä miten palvelulla menee ja mitä on työn alla. Puhuvat avoimesti siitä paljonko rahaa tulee sisään kuukausimaksujen kautta, kuinka paljon on käyttäjiä ja oikeastaan kaikesta muustakin. Palvelun perustajien taustat tulee selville ja ovat avanneet rahoitusmallinsa (tällä hetkellä pyrkivät kattamaan kulut, yhdellä perustajista on syvät taskut). Ja nörttinä tykkään siitä, että Hardcoverilla on avoin rajapinta jota voin käyttää (shame on you Goodreads sekä StoryGraph). Itseasiassa, viritinkin jo etusivulle statistiikkaa vähän samaan tyyliin kuin podcasteista on ollut jo pidemmän aikaa. Ovat myös aikeissa pian julkaista koodin avoimena lähdekoodina, joka lämmittää kaltaistani avoimeen lähdekoodiin uskovaa idealistia paljon. Huonoakin toki löytyy. Toisinaan Hardcoverin käyttöliittymä on aivan tolkuttoman hidas. Ovat vissiin parantamassa tilannetta, kun Next.js toteutus korvataan Ruby on Rails uudelleenkirjoituksella aivan lähiaikoina. Muuta huonoa en ole kyllä keksinyt. Singautappa siis sisään Hardcoveriin, hyvä alku on vaikka tsekata meikän profiili ja singahtamisen jälkeen alkaa seuraamaan niin saat itsellesi kanssa ainakin yhden seuraajan. In English It seems like holidays are always the perfect moment to search for, explore, and test out various apps and online services. I just recently switched RSS reader from Feedly to Feedbin. This time, I got excited about finding a service to track books I’ve read and manage my reading queues. My coworkers and partner know that so far, I’ve found the library’s Finna system (with its loan history and reservation system) to be entirely sufficient. You can freeze reservations until a specific date, which allows you to pile up as many books as you want. And if everything works out, you’ll get an email notification just when your previous book is running out. However, it’s been nagging me for a while that the library’s loan history only goes back to 2021. I’m absolutely certain I borrowed and read books before that. Was the history retention setting not enabled in Finna, or what happened? I don’t know, but it annoys me because I’m terrible at remembering things like the books I’ve read, good artists, or songs. I rely on lists for all these. It’s also frustrating because I’ve been scrobbling music to Last.fm since 2009, but I’ve never kept track of the books I’ve read. Finna’s terrible and clunky user interface has also been a constant irritation. Maintaining a reading queue in the reservations list has become increasingly cumbersome as the number of books grows. The reservations can’t be organized in a way that makes sense for my use. So, it was clearly time to look for an app or service dedicated to books. I’ve tried Goodreads in the past. Its interface is utterly ancient, and I’m not particularly interested in supporting Bezos’s empire with my data. The StoryGraph seems to be gaining traction, and the app was pleasantly intuitive to use, though it gave off a slightly “engineer-y” vibe. The interface wasn’t ancient or particularly bad, but it still felt kind of… meh. During testing, what really bothered me was how poorly StoryGraph found books, even when I fed it an ISBN number, which should have allowed it to add the book to its database. It simply couldn’t locate some “less common” Finnish titles. You could manually add those books with all their details, but who has the time or energy for that – especially when the list of missing books grows into double digits? At some point, I came across Hardcover with its sleek and modern interface. The service looks and feels high-quality, as if it’s developed by people passionate about books and creating an excellent platform. Hardcover successfully found every single book I tried to add via the ISBN tool. If a book wasn’t found (unlike StoryGraph, which still hasn’t notified me about any missing books), Hardcover located it instantly. Okay, for some of the rarer books, Hardcover did pull the wrong cover art, and it thought Kari Haakana’s Välitön uhka and Tapa hänet ensin were different versions of the same book. I flagged these issues for their library team to correct. And this brings me to another aspect of Hardcover that I loved. Unlike StoryGraph, which has no blog and offers very little background information, Hardcover is the complete opposite and strives to build a community. It has an open Discord server and a group of enthusiastic volunteer librarians who maintain the book database. They publish monthly reports, written with a personal touch, on how the service is doing and what they’re working on. They openly discuss their revenue from subscriptions, user numbers, and practically everything else. You can learn about the founders’ backgrounds and funding model (right now, they’re just trying to cover costs, and one of the founders have enogh money in the pockets). As a nerd, I love that Hardcover has an open API that I can use (shame on you Goodreads and StoryGraph). In fact, I’ve already set up some statistics on the homepage in a similar style to what I’ve had for podcasts for quite some time. They’re also planning to release the code as open source soon, which really warms the heart of an open-source-believing idealist like me. Of course, there are some downsides. At times, Hardcover’s user interface is ridiculously slow. Apparently, they’re working on improving this by replacing the Next.js implementation with a Ruby on Rails rewrite in the near future. Other than that, I haven’t found much to complain about. So go ahead and sign up for Hardcover; a good start would be to check out my profile and follow me after signing up, so you’ll at least have one follower right away! Posted bysippis2025-01-082025-01-08Posted inUncategorized"
