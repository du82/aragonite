["https://sippey.com/1996/01/22/managed-risk.html"]
title = "Managed risk - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "In this week’s issue of the New Yorker (dated 1/22/96) writer Malcom Gladwell examines the Challenger disaster from a new perspective, in an article rather tactlessly titled “Blowup.” In it, Gladwell debunks the traditional “ritual of reassurance, “ whereby we sift through the remnants of a disaster, piece together the clues, and hope that by learning what happened we can avoid it in the future. Gladwell argues that in the case of the Challenger disaster, the massive search for evidence and clues was really all for naught. Because no one thing was at fault. Rather, the nature of complex systems (like the shuttle) and the culture of large organizations (like NASA) are to blame. I don’t know much about the technical issues surrounding the failure of the O-rings. And I don’t work at NASA, so I’m not familiar with their culture. But Gladwell’s argument is compelling. A system like the space shuttle (or a nuclear power plant, or an operating system, for that matter) is very, very complex. And to build complex things, you need some level of “managed risk.” In Out of Control, Kevin Kelly writes about how it is nearly impossible to build a complex system that is error free. In a complex piece of software, for example, 10% of the code would actually be doing the work that the software was intended to do. The other 90% would be searching for errors, trapping them, and making sure that they don’t affect the crucial 10% that’s doing the real work. Not very efficient, for sure, and you’d never ship (or launch) anything built that way, because it would take too long to build. The answer, Kelly argues, is to build complex systems from the bottom up, out of simpler, more independent pieces that interact with one another in a way that “breeds” complexity. Kelly, of course, cites the Internet as a perfect example of a complex system that’s built from the bottom up. TCP/IP is a set of relatively simple rules about how computers should communicate with one another. It works well whether there are two computers involved, two hundred, or two million. But you knew that."
author = "Michael Sippey"
year_published = 1996
