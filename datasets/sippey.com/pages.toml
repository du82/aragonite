["https://sippey.com/2024/11/01/in-this-mythic-time-of-madness.html"]
title = "In this mythic time of madness - Michael Sippey"
description = "Craig Mod votes from Japan"
full_description = "I slammed my ballot down and shoved it into an EMS international airmail envelope and gleefully paid thirty freggin’ bucks or so to get that sucker to my utterly blue state knowing damn well that that vote won’t tip the scales in any meaningful way. And yet. And yet — AND. YET. — I wanna be on that ledger. Goddamn, you bet I want to be on that ledger. What else is there but the ledger in a moment like this? Pull the lever, cast your tiny pebble into it all and hope things add up. De minimis? Hell no. At the very least, you’ll be present on the cosmic scale, a little number at the end of a bigger number — one that wouldn’t have been quite as big without you. That’s not nothing, and when your grandkids asked what you did right now — in this mythic time of madness and infinite resources all seemingly used in the wrong ways, facing the wrong directions, directed at the wrong people — you can at least say you were present, doing the smallest of things you could in whatever way you could. Tick."
