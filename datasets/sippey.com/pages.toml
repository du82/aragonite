["https://sippey.com/2024/12/03/sally-rooney-on-the-passing-of-time.html"]
title = "Sally Rooney on the passing of time - Michael Sippey"
description = "Storing that time in a jar"
full_description = "I’m hesitant to get into my own psychology, but I’m aware that for me, writing novels is a way of preventing or being in denial about the passing of time. The years I spent on this book passed, and I can never have them back, but I do have the book. It’s like I’ve stored that time in a jar, like it can never quite get away from me, because it’s in there. There is a sense of pouring life into the novels and feeling like I get to live the lives of my characters. It does give me a doorway out of the world where time passes, as it does for all of us, into a world where I get to control the passing of time."
