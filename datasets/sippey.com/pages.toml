["https://sippey.com/1996/07/22/cultcha.html"]
title = "Cultcha? On the web? - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "I spent a few hours this weekend in Serendipity, a vast used bookstore on University Avenue in Berkeley. While it may not be the largest or most popular used bookstore in the world (The Strand in New York City – miles and miles of books – comes to mind), it redefines the notion of encyclopedic. Room after room of floor-to-15-foot-ceiling bookshelves, filled with first edition literary fiction (four copies of Kosinski’s Being There, for example), hardcover pulp detective novels (spines that read “No part of this book ever appeared in any magazine!”), volumes of Virginia Woolf criticism, and one leather bound 18th century Bible. But the beauty of Serendipity is its (dis)organization. It’s dizzying at first, because you can’t orient yourself to anything that resembles alphabetically arranged shelves, much less recognizable categories like “Fiction” or “Non-Fiction.” After negotiating pile after pile of newly arrived books, the first shelf I found myself in front of was an entire wall full of European bibliographies; not just books, mind you, but books listing more books. Which pretty much set the tone for the afternoon. After wandering the stacks, I realized that Serendipity has no (apparent) order, only clusters of books that seem to belong together (Roth, Bellow, Barth & Kosinski on one wall, Updike, Cheever & Irving on another). And then when I thought I had a handle on the grand scheme, it crumbled, because before me was a rack of 1950’s botany texts next to a group of tomes on abnormal sexual behavior. I walked out thinking that if I could map the logic of Serendipity, I could unlock some hidden, parallel theory in quantum physics. The beauty of Serendipity is that is represents what reading is all about for me. The sheer physical nature of books (paper, ink, type, bindings, glue, dust), the mythical theory that connects every book and every book that came before it (the theory that happens to keep university English departments flush with PhD candidates), and the realization that there are millions more to read after you put down the one in your hands."
