["https://sippey.com/1996/08/19/funding-the-grist-for-the-mill.html"]
title = "Funding the grist for the mill - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Remember the deluge? It began with Netscape Navigator 1.1, when Netscape hijacked the HTML standards and implemented tags that the other browser makers didn’t have. I’m not talking about the deluge of people rushing to Netscape’s FTP site to download the latest and greatest. I’m talking about the deluge of free advertising that Netscape garnered around the web: “This site is optimized for Netscape Navigator.” Netscape caught on quickly and encouraged this behavior, by placing nice postage-stamp sized logos on their web site screaming “Netscape Now!” These little GIFs were ripe for the picking by web producers looking to put a little corporate cachet on their site. And soon Netscape had their name, their corporate identity and (usually) a link to their site all over the web. Netscape continued to add support for useful features for web designers into their browser (background colors, font colors & sizes, frames, animated GIFs, Java, etc.), and web sites took advantage of them. Meanwhile, the gap between the Netscape-haves and the Netscape have-nots widened. Netscape gained market- and mind- share, while other browsers languished in obscurity. Netscape’s strategy seemed to be just as much content driven as it was browser driven. If the major (and minor) web sites were including tags which only displayed in Netscape browers, then more people would use Navigator. In a way, it was very grass roots – let the web designers “sell” your software with a little extra code they could use (does the center tag come to mind?) to improve the look of their site. The problem with this strategy is that the foundation upon which the web is built is relatively open. The official specs for HTML are managed by the W3C, and Java virtual machine technology is easily licensed from Sun. Thus, when the “sleeping giant” in Redmond awoke and went “hard core” about the Internet, it didn’t take long for them to catch up. Last week, Internet Explorer was officially released, and it’s the first browser to challenge Navigator. IE supports frames and cascading style sheets, loads pages and compiles Java content very quickly, and has support for Microsoft’s new brand of interactive web content – Active X (which is really just another way to spell OLE)."
