["https://sippey.com/2024/12/12/see-you-on-mozi.html"]
title = "See you on Mozi - Michael Sippey"
description = "Ev Williams on making social social again."
full_description = "A lot has changed for me in the last couple years. I made a lot of new friendships and rebuilt old ones. I did a lot of growth and healing work. I now have a robust network of friends from coast to coast. Not because of an app, but because I prioritized relationships and invested the time. I don’t think technology is the answer to our most human needs. But it would be silly not to use the tools at our fingertips to serve those needs. I love seeing when I will be in the same place as people I care about via Mozi."
