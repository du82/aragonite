["https://sippey.com/1996/03/25/transparent-computer.html"]
title = "Give me a transparent computer - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Sherry Turkle is the academic of the moment. Her new book, Life on the Screen: Identity in the Age of the Internet has landed her on the cover of Wired, in the halls of cnet’s digerati, and in the vacuum tube of the Sucksters. I picked up the book, and am about 100 pages into it. It’s good reading, especially if you’ve had at least a marginal dose of French literary theory. (You see, I spent a couple of years entertaining the notion of an M.A. in English Lit, and accordingly stocked up on my Derrida, Eco, Eagleton and Foucault.) If you’re not keen on deconstructing, well, you’re just going to have to trust Turkle’s assertion that the Internet’s “story of constructing identity in the culture of simulation” is really part of a larger context, that of “the eroding boundary between the unitary and the multiple self.” Anyway, it’s the first chapter of the book, “A Tale of Two Aesthetics” that’s got me thinking. In it, Turkle frames the age-old debate of IBM vs. Macintosh in terms of “transparent” vs. “opaque” computing. As she puts it, the big blue DOS way of the world is “transparent,” where you can directly interact with the file system, the command structure, the allocation tables. It is transparent in that there is no barrier between the user and the machine itself. The IBM PC was the modernist’s dream – everything reducible to its component parts. The Macintosh, on the other hand, introduced “opaqueness,” where the workings of the machine are hidden behind an iconic interface, and tinkerers be damned. The Mac is all about the desktop, the surface, simulation, post-modernism. Turkle acknowledges that this characterization of the IBM vs. Mac debate is anachronistic, given the overwhelming popularity of Microsoft’s Windows. And she also recognizes that the transparent vs. opaque debate has been flipped on its ear as more and more people have come to the computer not as boys in love with their toys (as they did in the 1980s), but as “users” looking to their machines as tools for work, thought and connectivity."
