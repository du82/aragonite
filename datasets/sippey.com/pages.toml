["https://sippey.com/1996/07/15/should-one-browser-fit-all.html"]
title = "Should one browser fit all? - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Navigator vs. Internet Explorer. Like the Energizer Bunny, the battle just keeps going. On and on and on. Providing grist for the mill of multiple Ziff Davis articles, cnet reviews, and ponderous musings from wannabe web pundits. The features of the two browsers are in a virtual lockstep: if one company adds a new feature, the other quickly follows. Netscape adds JavaScript, Microsoft gives us VB Scripting. Microsoft figures out how to load pages faster, Netscape follows with their own speed enhancements. Netscape develops the plug-in architecture, Microsoft follows suit, promising to support Netscape plug-ins. And on and on. Given the feature equality of the two browsers, from what I can tell the browser decision is now based people’s feelings about Bill: But the Netscape v. Microsoft debate is pointless. We should be looking for a product that changes our perception of what browsers can be. Autodesk, one of the top ten software companies that Microsoft doesn’t compete with, produces design software. They brought computer aided design to the PC platform, no small feat. But looking to sustain their growth, they’ve expanded from the software business – into the publishing business. Autodesk found that they were in a perfect position to connect creators of building components with consumers of building components. Why? Because both of those sets of people had something in common: they both use AutoCAD. Autodesk had the resources and the technical knowhow to publish a subscription-based CDROM catalogs for the construction industry. It’s called DesignBlocks. And because of their market dominance, Autodesk was able to leverage the common design file formats used by the creators and consumers of parts and building supplies, AutoCAD’s .DWG format. Each item in the catalog is published in its native AutoCAD (.DWG) format, and the catalog is “browsed” by a combination of the CD-ROM software, and AutoCAD itself. Architects, designers, builders, etc., can use the design environment they’re familiar with, AutoCAD, to browse the catalog, and virtually “try out” building components."
author = "Michael Sippey"
year_published = 1996
