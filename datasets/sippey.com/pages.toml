["https://sippey.com/2024/11/08/i-dont-need-these-psychodramas.html"]
title = "I don't need these psychodramas - Michael Sippey"
description = "Oliver Burkeman's advice"
full_description = "Oliver Burkeman, author of the self-help productivity philosophy book Four Thousand Weeks, Time Management for Mortals, in his newsletter today: I don’t need these people’s psychodramas in my head anymore. The closest thing to a political point I want to make is that I’ve dedicated far too much brain-space, in recent years, to marinating in the psyches of the angry, cynical and damaged men currently ascendant in our politics – which is basically what you’re doing when you spend time on Twitter, idly surf online media, or consume most TV news. I’m not talking about people in general here. We’ve lots of work ahead to try to understand how large swathes of the population – people like us, in so many ways, who love their kids, and so on – could embrace viewpoints we find so bewilderingly abhorrent. And we’re going to have to be willing to accept the possibility that some of the failings might be, at least partly, on us. But these tasks won’t be aided in any way by remaining addicted to the feuds and fragile egos of the demagogues at the top, or their hangers-on in the commentariat, and the shocking things they say for attention and money. We can’t ignore the deep societal problems that have fueled their rise. But we absolutely can choose to excise from our lives all their distracting psychodramas, their whiny podium speeches, social media bloviating and related bullshit (which includes, by the way, the output of many of those building media empires by railing against them, too)."
