["https://sippey.com/1995/12/25/1995-the-obligatory-list.html"]
title = "1995. The obligatory list. - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "So, by now you’ve probably leafed your way through the Newsweek article claiming 1995 to be “The Year of the Internet.” The drill is pretty familiar by now. Another dumbed down Steven Levy article introducing everyone to HTTP, URLs and MUDs. (Oh, Steven, what happened to your intellient writing on Artificial Life, or the Insanely Great Macintosh? Why are you schlocking for Newsweek?) Another tale of how Jim Clark attracted Mark Andreesen and started the tidal wave that is Netscape. And yet another list of cool people on the Net. Sure, you could read the Newsweek article. But who needs it. It’s been a crazy year, and here’s my list of terribly important “stuff” in 1995. So you get to the end of the list, and say “I knew all that.” OK, fine. This is called “Stating the Obvious” after all. But next week will be different. Tune in next Monday for a look ahead at 1996…"
