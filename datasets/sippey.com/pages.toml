["https://sippey.com/1996/02/19/spare-me-the-theme-song-dave.html"]
title = "Spare me the theme song, Dave - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Editor’s note: consider this week’s piece my contribution to the “24 Hours of Democracy” thing. A couple of Thursdays ago, Clinton signed into law the “sweeping” Telecommunications Bill, which pretty much deregulated the entire telecom industry. Phone companies can now sell me cable television. Woo hoo. Oh, and in case you hadn’t heard, they also passed the Communications Decency Act, which makes it illegal for anyone to transmit “indecent” materials to minors over the net. And then the blue ribbons and black pages appeared. Damn, was it fun. The Obvious jumped on the bandwagon – I’ve got one of those nifty blue ribbons, and I went black for a couple days. It felt good to “do something.” As the Sucksters said, “it was almost as exciting as signing the petition to get a cig machine installed into the high school cafeteria.” To keep the “protests” rolling, and in response to the stillborn (and politically lifeless) “24 Hours in Cyberspace” project, Dave Winer has gone and organized “24 Hours of Democracy.” You see, everyone’s supposed to take time out of their busy schedules surfing the web for X-Files plot summaries to write an essay about what democracy means to them, what their hopes and dreams are for the internet, share their ideas, spread good cheer, etc. And then put them up on the web on February 22nd, George Washington’s birthday. Cooooooool, Dave. You’re zoooooooming. Dig you must. Whatever. OK, fine. A grass roots response to “24 Hours in Cyberspace.” Very bottom up. Let everyone state their peace with the world. Let all the people on the web tell each other how great we all are and how much we love democracy and freedom of speech and how the government should get off our backs and bla bla bla. Dave Winer has a tendency to get a bit, shall we say, overfocused. In one of his pieces last week, I realized how out of control this whole thing has become. He wrote… Where are the creative people of the music industry on this stuff? I wish Jerry were here! We need a theme song. Who wants to write it? We need something to dance to!"
author = "Michael Sippey"
year_published = 1996
