["https://sippey.com/1996/01/08/magic-tricks.html"]
title = "Magic Tricks - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Back near the beginning of December, and with little fanfare, General Magic announced the availability of Magic Cap for Windows – a port of their “state-of-the-art communication software” to the Windows platform. This is pretty damn interesting news, considering that they are giving away the pre-release version of the system on their web site. It looks (and acts) just like the version that’s running on Sony’s Magic Link, albeit with some color thrown in for good measure. It’s got a great user-interface (complete with a desk, an office, file cabinets, hallways, bookshelves, etc.), an easy-to-use PIM, and online help which is much, much more than “user manual shovelware.” But the real story is in the communications features. Magic Cap is built to talk to AT&T’s PersonaLink service for email, faxes, etc. Magic Cap gives you a nice, user-friendly way to create and send outgoing messages, and a rule-based filtering system for dealing with incoming messages. They could have expanded the screen size a bit (it still looks like it belongs on a Magic Link), and the friendliness can be too friendly at times, but it’s a very intelligently designed piece of software. I was doing some surfing to prep for this piece, and came across some interesting news. It seems that on Thursday the 4th, the New York Times reported that in addition to laying off tens of thousands of workers, AT&T is dropping its investment in General Magic… AT&T bought Easylink, an electronic-mail service, from Western Union in 1989 and then upgraded it with highly touted technology that was supposed to link ordinary computers with pagers and hand-held computers. But PersonalLink, as it was renamed, never took off. AT&T has abandoned its investment in the company that developed the technology, General Magic, Inc. of Sunnyvale, Calif. Of course, this doesn’t mean that AT&T is dropping the PersonaLink service quite yet. But it doesn’t look good. Especially after AT&T announced last week that they’re dropping the Interchange online service and focus efforts on a web-based Business Network."
