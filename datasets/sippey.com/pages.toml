["https://sippey.com/1995/12/18/look-junior.html"]
title = 'Look, junior! A "network computer!" - Michael Sippey'
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "As I write this it’s the first night of Hanukkah, and only seven shopping days left until Christmas. I spent two of the past three days in downtown San Francisco, living the season, going with the flow of the crowds, and contributing to the retail economy. I spent a good deal of time in a couple of software stores, picking out gifts for my newly-wired parents. The crowds there were asking the usual questions (just more of them). “Do you have Myst?” or “Where are the Carmen Sandiego discs?” or “This year, we’re gonna get our act together. Where’s Quicken?” or (the mother of all questions) “Should we buy Windows 95?” Next year’s holiday landscape could be completely different, if Larry Ellison or Lou Gerstner have their way. The big guns from Oracle and IBM are hoping that their “Network Computer” ideas will take the world by storm, and that we’ll all find $500 diskless terminals under our trees next year. If all goes according to plan, we’ll unwrap the gifts, recycle the box and the wrapping paper, plug ‘em in, hook ‘em up to the phone line, and BOOM! Look junior – we’re surfing the Web, just like on TV! We’re sending email to your Aunt June! We’re playing tic-tac-toe against the computer!! It’ll all be great, until…. “Hey, Dad! Billy across the street got Rebel Assault IV on CD-ROM! Can we play that on our NC?” “Ah, no.” “Hey, Mom! Let’s download some shareware and give it a whirl!” “Sorry, hunny. Can’t do that. Our NC doesn’t have a hard drive.” “Hey, Aunt Jill. Is there anything else on the Web besides shopping and recycled magazine articles?” “Ah, not really.” A network computer would make sense, if the content that would feed it were more compelling. I’m not sure if reading Pathfinder on the TV screen or playing games written in Java are enough to make a $500 investment in what is essentially a dumb terminal. Not to mention the fact that the bandwidth needed to make these things really hum (like ISDN or cable modems) are a long way away for the majority of American households."
