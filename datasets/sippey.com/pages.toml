["https://sippey.com/1996/07/29/better-tools.html"]
title = "I want better tools - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Editor’s note: This week, I kvetch. So if you’re not interested in hearing me kvetch, well, then, tough. Also, even though I own a Mac, I use my Windows machine to build my site. So all of the comments here are based on the things I want for the Wintel platform. So there, you’ve been warned. As you can probably imagine, I have a Sunday night ritual. I boot up the PC, hog the phone line for a few hours connected to the net, tap away in my HTML editor, check the results my browser, and eventually publish (useless) nuggets of information for an adoring fan-base of screaming teenagers. Or something like that. It looks simple, and it is simple. My content changes weekly, not daily or hourly like most of the high traffic sites. And even though I’m coming up on my one year Obvious anniversary, I only have about 50 files all told; I’m not managing a 500 or 1,000 or 50,000 page site. And the last time I checked my entire site takes up something like 500kb. But it’s still a mess. Most of the process of writing, tagging and managing the Obvious is manual. When I redesigned and rearchitected my site a few weeks ago, I had to manually change each page, making sure that the internal links pointed to the right places, and that the tables flowed correctly. Even with the small number of pages I have, it took half a day of mind numbing work. It happens that some major (and not so major) companies on the web are trying to solve these problems – to make it easy to create, manage and update a site. On Friday, The Wall Street Journal reported that NetObjects, a startup with some impressive backing from IBM and UUNET, will introduce “Fusion” today (the 29th), a “fill-in-the-blank” web site builder. As I write this, NetObjects’ web site is just a big tease: “You used to think HTML was cool. You spent 12 hours building tables. YOU KNOW there must be a better solution. Come back on the 29th and find out the rest of the story.” The big story – Netscape is planning on co-marketing the product on their web site, as an easy way for corporations to hang the proverbial shingle on the infobahn."
