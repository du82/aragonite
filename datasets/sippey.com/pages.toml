["https://sippey.com/1996/06/24/confusing-the-word-with-the-web.html"]
title = "Confusing the word with the web - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "I need a vacation from my vacation. Returning from two weeks away from the office, I find my snail mailbox stuffed to the gills with PC Weeks, Web Weeks, junk mail, more junk mail and a host of conference and trade show announcements. (Strangest piece of mail: an unsolicited cardboard envelope from Microsoft containing a single CD-ROM – the Windows NT 4.0 Beta 2. With an airtight license agreement, but without documentation. Of course.) The electronic inbox was stuffed as well – mailing list digests, news headlines, stock recaps, and messages from confused Obvious readers (“where are you?”). But sitting on my desk at work was a red file folder, with a yellow post-it note attached: “Required Reading.” You see, for all the agent technology out there, for all the content personalization that is promised by the Affinicasts of the world, the best content filtering happens between friends. (“So, have you seen the new Schwarzenegger movie? It sucked.”) And, of course, I looked through that red folder before anything else. In it: a Doonesbury comic, a New Yorker article, and an essay re. the web from the New York Times Book Review. In an essay titled “The Word and the Web,” Edward Mendelson discusses the connection between the web and the Bible…a connection that is not limited to the home page of your local church or synagogue. According to Mendelson, “medieval manuscripts of the Bible were the first books to be interconnected by a system of cross-references – marginal notes that directed a reader from one biblical passage to another, perhaps to a passage written at a distance of hundreds of years from the first.” As “systems,” Mendelson puts the Bible and the Web on equal footing. “The marginal references to the Bible and the hyperlinks of the World Wide Web may be the only two systems ever invented that give concrete expression to the idea that everything in the world holds together, that every event, every fact, every datum is connected to every other.”"
author = "Michael Sippey"
year_published = 1996
