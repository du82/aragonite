["https://sippey.com/1996/03/18/california.html"]
title = "California, land of hyperreality - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "As I write this I’m sitting in the kitchen of a rented house, overlooking the vast blue expanse of Lake Tahoe, made more dramatic by the snow-capped mountains which ring the shore. Three hundred and sixty degrees of pure vastness; overwhelming beauty. Friday morning we leave early, a 6:30 a.m. ride out of San Francisco. We cross the Bay Bridge, past the vertical towers of downtown, punctuated by a pyramid. When we hit the other side, we marvel at the early rush hour traffic headed into the city. “The metering lights are on,” says the radio, and we stare at the lines and lines of cars, waiting their turn. Being a city dweller, I am removed from the ritual of the morning commute. A four hour drive, climbing up into the Sierras. As the altitude gets higher, the temperature drops; eventually we see snow. The view becomes magnificient; white peaks, grey mountain faces, acre upon acre of pine trees. It’s astounding, this state I live in. Into Squaw Valley, and I strap on a snowboard for the first time. I’m 27 years old, and I can’t remember the last time I learned a new sport. It’s exhilarating, but frustrating. Falling hurts, but the feeling of making a true ess curve on the board is worth all the pain. Going up the chairlift I look for talented snowboarders; to see “how it’s done.” To marvel in the grace of a clean turn across the fall-line. Friday night we cross the state line and drive into Reno. Coming down out of the mountains we see the orange glow, the bright lights, the neon. We hit a few casinos. It’s my first time. And though I know, instinctively, that this isn’t anything close to Vegas, it is still overwhelming. We pay $13 for an all-you-can-eat buffet. Piles of shrimp cocktail. Unending bowls of caesar salad. Chicken breasts. Lamb. Pork chops. Cherry pie. Cheesecake. Meatloaf. Crab salad. Roast beef. And you can gamble while you eat, of course, because an unending game of Keno runs in the dining room. I play the nickel slots, and find a rhythm in feeding the machine my money. Every seven seconds or so, another nickel. Cha ching. Cha ching. Cha ching. I hit on some, and then a few minutes will go by without hitting. I run out of nickels, and take a walk around. I watch a woman smoke a long brown cigarette and feed the dollar slots at the same rate I fed the nickels. Every seven seconds, another dollar. A woman in a polyester tuxedo brings me a free beer. I watch the blackjack table, amazed by the fluid motions of the dealer, the constant banter, the pure green felt. Craps is too complicated; it takes four employees to work the table. All to roll the dice. Roulette spins, red and black, and in the two rounds I watched everyone lose."
author = "Michael Sippey"
year_published = 1996
