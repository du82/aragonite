["https://sippey.com/1996/02/05/doppelganger-in-a-box.html"]
title = "Doppelganger in a box - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Yea, OK, so my hard drive crashed. I lost all my data. Three years of work – memos, spreadsheets, outlines, presentations. A few megs of classic email archives. Two years of journal entries. Letters to Mom. Classic hand-drawn bitmaps from co-workers. A soundbite from a friend’s Grandmother. Eh, whatever. Information is cheap, right? Data’s even cheaper. “The real knowledge is in your head,” say my friends, consoling me. “I wouldn’t worry about it.” So, I started over. New hard drive. Clean installs of Win95, MSOffice, Netscape, Eudora, etc. Back up and running, hooked into the LAN at work, and into the Net at large. And then yesterday I did the obvious… I went out and bought a Ditto drive from Iomega. Nice machine. Small. Quick. Cheap. Backed up 320 megs in 30 minutes. I’ve got a nice little tape at home, sitting snug in its case, holding my stuff. A copy of my newly formed electronic life. A doppelganger in a box. Hmmm… interesting. The box is the other half of me – the half I can’t keep in my head, the half that I need to have, but don’t need to remember…the stuff I could just keep as an endless succession of one’s and zeros. Really cheap. Just point your browser to Yahoo or to Galt. See that Reuters newsfeed? See that 15-minute delayed quote? Do you realize how much that would have cost you to have on your desktop five, ten, fifteen years ago? I take this “democracy of information” for granted. I check stock prices all day long, but don’t bother to find what the company behind the ticker symbol is doing for its customers. I read Reuters headlines, and thank God I don’t live in Sarajevo. I hear audio clips of Steve Forbes rambling about his flat tax, without bothering with what a flat tax would mean for anyone besides Steve Forbes. All of the information out there has turned me into a cut-and-paste artist. I rarely stop to think, to make connections. There’s no reason to understand, to figure it out, or even to remember what happens – because, hey, I’ll just bookmark it. Why have an idea of my own when I can point to someone else’s?"
