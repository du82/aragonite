["https://sippey.com/2024/10/22/the-distinct-midjourney-aesthetic.html"]
title = "The distinct Midjourney aesthetic - Michael Sippey"
description = "even if it's real it's fake"
full_description = "The images of Trump’s McDonald’s stunt—in which he jiggled the fryer and handed burgers out of a window yesterday—are uncanny. There’s Trump, face contorted in the appearance of deep concentration, tilting a fry basket to the heavens; Trump hanging two-thirds of the way out a drive-through window, waving like a beleaguered Norman Rockwell character; Trump, mouth agape, appearing to yell into the middle distance of a fast-food parking lot. The shadows of the McDonald’s kitchen, the interplay between the sheen of the stainless steel and the cast of the nugget-warming lights, give the very real photos a distinct Midjourney aesthetic. … In his own way, Trump has shown us all the limits of artificial intelligence. Computers, at least for now, cannot quite capture the crushing surreality and maddening absurdity of modern electoral politics."
