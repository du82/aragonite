["https://sippey.com/1996/08/01/an-astral-theory-of-rock.html"]
title = "An Astral Theory of Rock - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "In the music industry there is life before Soundscan, and life after Soundscan. Life on the Billboard charts before Soundscan was a prototypical Scorsese movie, dominated by the sleazy triumvirate of radio programmers, record chain executives, and Casey Kasem. Life after Soundscan is blissfully bit-driven, with record sales instantly beamed through the ether from record stores straight to some air-conditioned, Halon gas-protected computer room. Like any new technology is bound to do, Soundscan has spawned a new job category at every major label - specially-trained spreadsheet jocks crunching the raw album sales numbers to tweak market share here, mind share there, and wallet share everywhere else. Their ultimate goal: maximize the lifetime value of any particular artist.The result? Reconstituted adult rock masquerading as hip hop. But I’m going to put all of those data-massaging monkeys out of business. Not with any new harebrained tracking scheme or business model, but with an entirely new methodology of b(r)and scenario planning. Think of it as the place where David Geffen meets Carl Sagan. It’s the new Astral Theory of Rock. During literally days of research, I’ve discovered that the life cycle of a star mimics that of, well, a star. This flash of brilliance has led me to believe that those Excel worker bees could someday be replaced by a few, highly-paid quantum physicists, or at least some folks who took Physics for Poets at the local community college. In order to predict the lifetime value of a star, they’ll just need to follow the easy-to-remember, five-step life cycle of a true celestial body: Birth, Radiation, Exhaustion, Collapse, Black Hole.The Birth of the star is easy to predict, and shouldn’t concern our new breed of record industry knowledge workers. They should be focused on future record sales, not how the star got there in the first place. All A&R schleps worth their salt know that some combination of bloodthirsty local fans (“I knew them first!”), sleazy record producers (“Sure, pal. Full creative control. Whatever you say.”), and alcoholic managers (“But I landed you your first paying gig, asshole.”), mixed together in a crowded, humid club in some Godforsaken part of town, usually creates enough pressure and mass to form the infant star. The new science of star tracking, however, will prove that what happens “before” a star is born is irrelevant, since “before” is merely a temporal concept, and has no discernible effect on future record sales."
