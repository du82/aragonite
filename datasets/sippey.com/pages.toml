["https://sippey.com/2024/11/21/we-are-supposed-to-be-inconvenienced-by-one-another.html"]
title = "We are supposed to be inconvenienced by one another - Michael Sippey"
description = "That's what it means to live in a functioning society."
full_description = "I worry sometimes that we forget we are supposed to be inconvenienced by one another; that’s what it means to live in a functioning society. We’re meant to take turns bearing the burden so that others show up for us when we need it — and that means that we have to show up, even when we don’t feel like it. Maybe especially when we don’t feel like it. … Living in A Society means bumping up against other people who are different from you and learning how to get along well enough. It’s messy. It’s inconvenient. It means we’ve got to give each other a lot of grace when our ideas for how to achieve a common goal don’t totally align. It means we have to look within ourselves and ask if we are putting our own comfort above someone else’s right to live."
