["https://sippey.com/1995/12/04/if-you-build-it.html"]
title = "If you build it, will they come? - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "If you read Wired’s recently published history of Java, you know its origins. Some folks at Sun wanted to build a language for consumer electronic applicances (a.k.a. Personal Digital Assistants), that would enable content providers to distribute applications (and the data that drives them) over wireless networks. They wanted it to be a “simple, object-oriented, distributed, interpreted, robust, secure, architecture neutral, portable, high-performance, multithreaded, and dynamic language.” Dizzy yet? Well, to make a long story short, Sun saw the bottom fall out of the PDA market. And basically had nowhere to go with Java, and no clue about the WWW, even though most of it was running on Sun workstations. Until (BANG!!!) all of a sudden Sun woke up, got the net.religion in a big way, and Java was pronounced our savior. Now, there’s been a good deal of hype about Java over the past several months. The Wired article is just the tip of the iceberg. Business Week’s cover story on the “coming software revolution” featured Java, and described it as a Microsoft killer. George Gilder praised Java in a recent Forbes ASAP article, calling it a “fundamental shift in the history of technology.” For Gilder, Java is another step in the inevitable “hollowing out of the PC.” People “in the know” say Java will be everywhere, and soon. Netscape has licensed Java technology to include in version 2.0 of their Navigator. And since Netscape has the browser market locked up (so the argument goes), users will start screaming for Java apps to run on it. Right? OK, reality check. I downloaded Hot Java (and Netscape 2.0). And I played with some Java apps. And it usually works. And it’s usually pretty cool. You get animation (cool). And you get “ticker tape” (cool). And you get neat text effects (cool). And you get calculators and rudimentary spreadsheets and 3d molecular models you can drag around on your screen (cool, cool, cool). But Sun is going to need to have a LOT of patience if they want to really see the PC get hallowed out (and Bill Gates topple in the process). Because Java (at least right now) ain’t nearly as addictive as the stuff it gets its name from."
