["https://sippey.com/1996/04/01/let-your-fingers-do-the-walking.html"]
title = "Let your fingers do the walking - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Why is it that every content provider on the web seems to have the same business model? Give away everything under the sun to the consumer, and hope to drive the hit count to a point where advertisers feel that you’re worthy of their banners and ad dollars. It’s being repeated time and time again. I figure that everyone just immediately caved when John Perry Barlow said that “information wants to be free.” This isn’t a new model, of course, the phone company has been doing it for years. Not with your long distance charges, of course, but with the yellow pages. Every year, thump, a new set arrives on your doorstep. Loads of content, free to the consumer, supported by ad dollars. So, the yellow pages and the web – a match made in heaven, right? Hey, it looks promising on the surface… A nationwide directory of 11 million businesses. A quick search algorithm. The ability for businesses to link their listing to their home page, or use BigBook’s forms to create one on the fly. Integrated locator maps. And that’s just the beginning. They’re planning on adding a database of user-supplied ratings of businesses, in-depth reviews, and third-party recommendations. And coupons, of course. Lots and lots of coupons. Their goal? To be the über-source of business information in the United States. To be the place everyone goes to when they’re looking for a neighborhood Chinese restaurant that delivers. OK, wait a minute. I spend a lot of time on the web, but am I going to boot up the machine, dial into the net, launch Netscape, connect to BigBook and do a search for local Chinese restaurants? No. I’m going to reach for the (hard copy) yellow pages, or, better yet, ask a friend if they know of a decent egg roll in the area. I’m not faulting BigBook for trying. They probably are imagining that through an enormous phone book, a T1 line, some electronic maps, a nice Informix database and a bunch CGI scripts that they can change the nature of purchase decisions. But I have a feeling that the medium is too young to support this type of effort. The web isn’t ubiquitous enough for people to skip their hard copy yellow pages for the soft copy. And there aren’t just enough people online to create the bottom-up swell of added-value information that BigBook is counting on."
author = "Michael Sippey"
year_published = 1996
