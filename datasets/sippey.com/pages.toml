["https://sippey.com/1996/01/15/real-world-web.html"]
title = "Real world web - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "This week’s “obvious” may not be so obvious. It also may be a bit confused, but I’m gonna try to make sense of some stuff that hit me all at once yesterday, from many different directions. So bear with me… Trina and I did the “art thing” this weekend, hitting a few galleries and the SFMOMA. Which is incidental, but crucial. You see, I’m just gonna use some (hyper)text to try to make sense of the stuff we saw, and the stuff it made me think of. But that’s not the point, really. The point really, is that there is no one point. It’s all a bunch of interconnected points. On Saturday morning, we hit Crown Point Press to see a collection of prints by Christopher Brown, for whom “the question was, and is, how to create a visual analog for memory.” Besides the beautiful surfaces of his images, what I love about Brown is his ability to pull the strings of popular culture to let flow emotions that are buried deep within this American psyche. Some of his best work is a series of five prints based on images from the Zapruder film. A brief glimpse of the president’s limousine, with the blurred red and white of the American flag in stark contrast to the black and chrome metal. Jackie reaching across the back of the limousine. A man with a camera. Two women on the grassy knoll in shock. Later that day, Refusalon, a gallery in the same building as Crown Point. On display, sculpture and video work by Patrick Tierney. Tierney’s wall-mounted pieces started on one side of the gallery as fairly realistic-looking explosive devices, made up of beat up metal boxes, electricians tape, portable phone batteries, torn apart digital watches. As we moved along the wall, the pieces got a bit more fantastic. The metal boxes morphed into random found objects or even just balled up newspaper. What had been realistic red, green and yellow electrical wire was now a single extension cord leading nowhere. And by the time we reached the end of the wall, the pieces had become completely allegorical. The “bombs” were now discarded teddy bears wrapped in dozens of layers of saran wrap, with wiring made out of coaxial cable. The bomb is reduced to a banal image, wrapped in a banal substance, with a tail made of the stuff that brings us our daily dose of entertainment. Because as we all learned in Philosophy 101, a bomb that doesn’t get to explode isn’t really a bomb at all. It’s just potential energy."
