["https://sippey.com/2024/09/11/david-allen-green-on-the-swift-endorsement.html"]
title = "David Allen Green on the Swift endorsement - Michael Sippey"
description = "Close reading."
full_description = "Via Werd.io, David Allen Green of The Law and Policy Blog does a close reading of Taylor Swift’s endorsement. In essence: this endorsement is a masterpiece of practical written advocacy, and many law schools would do well to put it before their students. … Like any good advocate, Swift is careful to make the listener or reader feel that it is their own decision to make, and again this is skilfully done: “I’ve done my research, and I’ve made my choice. Your research is all yours to do, and the choice is yours to make.” The most effective persuasion is often to lead the listener or reader to making their own decision – and to make them feel they are making their own decision."
