["https://sippey.com/1996/07/08/the-road-to-xanadu.html"]
title = "The road to Xanadu - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Before the plugin, before the browser wars, before the web, there was Xanadu. The dream of Ted Nelson – coiner of the term “hypertext” – Xanadu was to be the ultimate computer program – a single system which would store all the world’s information in a dense latticework of links and references. As a “product,” Xanadu never saw the light of day (or the marketplace), despite significant funding from Autodesk founder John Walker and others. But as a concept, nothing even comes close. As Gary Wolf wrote in his Wired history of the project, “Xanadu was meant to be a universal library, a worldwide hypertext publishing tool, a system to resolve copyright disputes, and a meritocratic forum for discussion and debate…. And, on the very hackerish assumption that global catastrophes are caused by ignorance, stupidity, and communication failures, Xanadu was supposed to save the world.” The web we live with is a long way from Nelson’s Xanadu. Many of the issues we’re struggling with related to copyrights, hypertext reference tracking, and micropayments for intellectual property would have been “solved” with Xanadu. Of course, Xanadu never made it to market, and you’re reading this on the real WWW – so which one is better? Paul Haeberli, editor of SGI’s Grafica Obscura (and it’s outpost), has written a CGI script which accomplishes one of the main goals of Ted Nelson’s Xanadu project – transclusion. Transclusion is the act of “quoting” another document on the network, without having to actually “copy and paste” content. With transclusion, an author can quote original source material on the web, from the server on which it resides. For example, I could quote from an article on Hotwired, and instead of storing the text and layout on theobvious.com, I could just have my document reference a portion of their document (stored on their server). It’s more than a simple hypertext link, the actual document returned to the user would include both my HTML and the quoted text (or image or sound or video clip). The user experience would be seamless – one document, only pulled from two (or more) servers."
author = "Michael Sippey"
year_published = 1996
year_updated = 1996
