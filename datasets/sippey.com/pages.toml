["https://sippey.com/2025/01/06/an-attack-on-congress-not-the-capitol.html"]
title = "An attack on Congress, not the Capitol - Michael Sippey"
description = "Gas masks underneath the seats"
full_description = "Jeffries: The moment that probably crystallized that we were entering into a very different space was when a Nancy Pelosi, who was on the rostrum as the speaker, was suddenly and expeditiously removed and the sergeant at arms or someone from the sergeant at arms, the staff interrupted the debate and then says that the mob has breached the Capitol. They’re on the second floor. There are a few steps away from the House chamber. Be prepared to hit the ground and secure the gas masks that are underneath your seats. I’ll never forget those words because I never thought that I would hear them. And I didn’t even know that there were gas masks underneath each seat in the House of Representatives. Four years on, the framing of January 6th that resonates with me is from Jason Kottke: “this was not an attack on the Capitol Building. This was an attack on Congress, the United States Government, and elected members of our government. It was a coup attempt."
