["https://sippey.com/1996/03/04/fighting-the-good-fight.html"]
title = "Fighting the good fight - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Editor’s note: I never tire of writing about the ongoing battle between Microsoft and Netscape. Many of you, however, may be tired of reading about it. Get over yourselves. The web was chock-full of FTP traffic last week, thanks to two enormous pieces of software that people just had to have. Microsoft’s Internet Information Server and Netscape’s official release of Navigator 2.0. It was a great battle: whose freeware could cause the most delays in packets carrying Spotmate diary entries. The jury is still out on that one. But we know for sure that big bad Bill’s Internet Information Server (IIS) brought www.microsoft.com to its knees, keeping web surfers from their support notes and personalized MSN home pages. The word on the web site is that every 30 seconds someone downloads a copy of IIS. 21,000 people in just over a week. Microsoft obviously wants to bump Netscape off the server throne, and they’re playing rough. Microsoft responded to a Netscape white paper with one of their own. In an example of corporate doublespeak which would be frightening if it weren’t so damn amusing, Microsoft actually had the audacity to attack Netscape on platform. “Netscape ships pieces of their product line across a confusing array of operating system platforms,” states Microsoft. Hmmmm…to Windows-drenched Bill and company it looks like any number greater than one is a “confusing array.” You’d think that the First Amendment would be free from NSCP v. MSFT clashes. Nope. The Communications Decency Act was just another battleground for Bill. You see, on February 8th, Netscape took their site black and painted themselves in blue. It was elegant – an empty black page, one blue ribbon. And a leader sentence on their home page which said “Netscape supports open standards, including First Amendment rights to free speech.” (I love it – freedom of speech as an open standard. What next – an amendment to the constitution guaranteeing everyone equal access under the law to TCP/IP?)"
