["https://sippey.com/1995/10/30/ascii-nostalgia.html"]
title = "ASCII nostalgia - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Last week I talked about how the ‘net’s nature of instant publishing is the perfect platform for navel-gazing (where we are now) and prognosticating (where are we going). My friend Sarah responded that the third category should be nostalgia, or where we’ve been. I’m in a nostalgia phase. I’ve been playing on this network for about three years now. Which doesn’t seem like very long, but in “Internet-years” (where time is very wide) it’s a long, long time. Three years ago, there was no web. Netscape didn’t exist, Mosaic was just a glint in Andreesen’s eye. There were no background images, no ad banners, no jpegs. Just ASCII. Lots and lots of ASCII. When I first logged on, I dove into The Well at 2400 baud. Email, gopher, usenet, the beast that is picospan (the Well’s conferencing system), MUDs, etc. All in glorious ASCII text. Black on white. When I upgraded my modem to 9600 baud I thought it couldn’t get any better! When all you’re looking at is text, there’s not much need for anything faster."
