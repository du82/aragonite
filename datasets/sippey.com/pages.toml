["https://sippey.com/2025/01/06/spencer-wright-on-christopher-payne.html"]
title = "Spencer Wright on Christopher Payne - Michael Sippey"
description = "The Honorable Parts"
full_description = "In Scope of Work, Spencer Wright rides along with New York Times photographer Christopher Payne, on his visits to the MTA’s repair shops. The factories he visits are complicated, complex, kludgy. Factories take knowledge away from craftspeople and turn it into bureaucracy and institutional anxiety. Factories pollute our waterways. Factories take razor-sharp lathe swarf and try to convince us it’s jewelry; factories enlist workers to help someone else fulfill their dreams. But then Christopher Payne comes in, and he crawls around for a few months, and he finds parts of the factory that we can be purely and unabashedly proud of. I don’t think that Payne’s work is asking questions at all; he’s just taking something messy, and pointing a spotlight on the honorable parts."
