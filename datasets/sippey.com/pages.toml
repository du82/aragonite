["https://sippey.com/page/2"]
title = "- page 2 - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "The images of Trump’s McDonald’s stunt—in which he jiggled the fryer and handed burgers out of a window yesterday—are uncanny. There’s Trump, face contorted in the appearance of deep concentration, tilting a fry basket to the heavens; Trump hanging two-thirds of the way out a drive-through window, waving like a beleaguered Norman Rockwell character; Trump, mouth agape, appearing to yell into the middle distance of a fast-food parking lot. The shadows of the McDonald’s kitchen, the interplay between the sheen of the stainless steel and the cast of the nugget-warming lights, give the very real photos a distinct Midjourney aesthetic. … In his own way, Trump has shown us all the limits of artificial intelligence. Computers, at least for now, cannot quite capture the crushing surreality and maddening absurdity of modern electoral politics. I finally got around to reading Mandy Brown’s excellent Coming Home. There’s a lot in here that I’m chewing on, including the feeling that she describes in the lede… I’ve written before about the restlessness inherent to screens, the inability to ever linger or pause or catch your breath. It’s a strangely disembodied experience, a sense of ceaseless, rustling motion when nothing is moving at all: electrical pulses flash and gasp beneath the oceans, your mind strains to catch up, your body remains still save for a few twitching digits, the shell that’s left behind when your spirit evacuates for the mirage of higher ground. We become as smooth and reflective as the screen itself, all glassy surfaces and metallic edges obscuring the hollowness within. No need to fantasize about what it might be like to upload your consciousness to the machine – most of us are already there. But another way to see despair, in secular terms, is as a profoundly counter-adaptive philosophical position. Having no hope puts a living being in a terminal state. Why eat, if you have no hope of satiety? Why see people, if you have no hope of love or friendship? Why bathe or see the sun, if you have no hope for health? Why do anything but dull the pain and wither?"
