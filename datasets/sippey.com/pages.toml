["https://sippey.com/1996/04/22/search-me.html"]
title = "How much are they worth? Search me. - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "An obvious note: several of the companies I write about this week actually have exclamation points as part of their names. In the spirit of reasoned discourse, I had to remove them. Forgive me. Otherwise we’d be yelling every third word. This is not going to be news to anyone. But Yahoo is overvalued. So are Lycos and Excite. But they’ve gone public, socked some money in the bank, and their founders must be laughing all the way home. All of these sites are operating on similar business plans. Create a large database of web sites for cataloging, subset some of those into a hierarchical directory, and provide reviews of even fewer “selected” sites. Create a brand name for yourself (preferably using an exclamation point in your name), boost the hit counts by “partnering” with other high-traffic sites, and crank up the ad revenue. Of course, behind the scenes, each of them struggles to maintain a technological edge – whether it be in their database structure, their surfing bots, their search algorithm, or their ability to customize experiences for advertisers. But technology will not win or lose it for any of these folks. Because all of them (or most of them) are doomed. It’s fairly obvious that they’ll each face one or more of the following roadblocks… Exploding Web Sites. By some estimates, there are currently some 50,000,000 individual pages on the web. Lycos is currently indexing around 37 million; Alta Vista around 33 million. So what happened to the other 13 to 17 million pages? And what happens when there are literally billions of web sites, and those search engines run out of processing power to keep up with the growth? Inktomi is reportedly using some interesting technology to scale their database/search engine with the growth of the web. Don’t get me wrong. I find search engines useful, to a point. If I’m looking for a very particular piece of information, like all the references on the web to a long lost friend, then they’ll do me just fine. But try to find anything useful related to broad topic, like snowboarding, and they’re a mess. How in the world am I going to find my way through 4,325 finds?"
author = "Michael Sippey"
year_published = 1996
