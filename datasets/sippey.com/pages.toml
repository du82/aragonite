["https://sippey.com/1996/04/29/atome-to-bits.html"]
title = "Atoms to bits at the New Main - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "I spent Sunday afternoon in the “New Main,” San Francisco-speak for the recently completed new home of the San Francisco Public Library. I walked the staircases, I wandered the stacks. I thumbed through periodicals, I smelled the books. I admired the new Nayland Blake sculpture which scales the five story atrium, illuminating the names of 160 authors – a new canon in fiber optics. Like most modern libraries, the New Main has replaced their card catalog with an electronic database, accessible through dumb terminals throughout the building. No more thumbing through dog-eared cards (like taking a virtual tour through the stacks), but rather a precise keyword search, instant screens of results, and no serendipity. The library isn’t just for books anymore. It’s an “information warehouse.” In the process of moving to the new building, the New Main didn’t entirely dispose of the card catalog, however. Artists Ann Chamberlin and Ann Hamilton spearheaded an enormous effort to take thousands of cards, match them up with the books they represented, and pay members of the public $1 to read the book and write a few sentences of reaction on the card itself. The results of that project are now mounted, floor to ceiling, on walls throughout the building. A life-size reminder of the physical nature of the printed word. Nicholson Baker, author of a now-famous New Yorker essay denouncing the demise of the card catalog, had a violent reaction to the New Main’s catalog project. “It’s heartbreaking to a person of my generation: The card catalog really did stand for the library as a smaller, visible, hefty thing. It stood for the books that were in this larger structure….It just feels to me an act of hostility toward the whole printed past, in a way, to throw out the crucial self-published document.” The library pushes ahead nonetheless, replacing its physical doppelganger with a new electronic one; the cards becoming the latest casualty in the transformation of knowledge from atoms to bits."
author = "Michael Sippey"
year_published = 1996
