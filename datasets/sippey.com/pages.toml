["https://sippey.com/1996/05/20/slate-spoon.html"]
title = "Slate, just another spoon - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Slate, the new online venture of Microsoft and Michael Kinsley, launches in June. A “weekly” net.rag of about 25,000 words, Slate will most likely strive to provide that healthy dose of serious political journalism that Kinsley feels the net lacks. In a May 13, 1996 New Yorker piece on Slate, Ken Auletta leads us behind the scenes at Microsoft, where Kinsley is readying for the launch. We learn about Kinsley’s office on “the campus,” his new apartment in Seattle, and his now famous khakis. And while Auletta describes Kinsley’s discovery of hypertext, clickable maps and discussion threads, we’re treated to gems from the mouth of Michael like “one of the bad things about email is that it’s too easy to reach your congressman!” According to Auletta, Slate “will try to navigate between becoming a data bank, as are many Web sites, and a hip, dripping-with-irony magazine where people write faster than they think.” (Hmmm, I’ve been told that I type faster than I think…has Auletta seen the obvious?) Furthermore, “Kinsley is an unabashed elitist, dismissive of the tell-me-what-you-think Zeitgest of the Web.” I have nothing against elitism. Without it, we wouldn’t have the authoritative voice of the New York Times, the galleries at the Met, or even the dismissive voice of Suck. And I have nothing against the particular brand of elitism that Kinsley practiced as editor of The New Republic. I enjoyed reading TRB, because Kinsely worked well on the page. When I was reading TRB regularly, I was fresh from college, and new to the Big City. I would catch up on the ever-thin New Republic while riding the bus or taking my lunch hour – soaking in his brand of intelligent liberalism laced with a nice streak of libertarianism. “Finally,” I thought, “a Democrat with a sense of irony.” When Kinsley left The New Republic for CNN’s Crossfire, the irony was sucked dry, and our love affair was over. Typically perched against Pat Buchanan or John Sununu, Kinsley was the left’s patsy, tossing up lobs for the other side to bash back. Crossfire did nothing more than reflect television’s take on politics: you’re either left, right, or don’t belong on TV."
author = "Michael Sippey"
year_published = 2019
clearnet = "https://sippey.com/1996/05/20/slate-spoon.html"
tags = ["another", "slate,", "spoon"]
