["https://sippey.com/1996/03/11/here-i-am.html"]
title = "Here I am v. here is what I think - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "A couple of weeks ago I had an interesting email land in my inbox. It was from an obvious reader, though he didn’t really identify himself as such. He just dove right into the topic at hand… as each of us develops and leaves a trail of ideas on this net it amazes me how quickly it is becoming less the self-indulgent “here I am” and more the “here is what I think.” that and commerce - the ads proliferate. At first, I was flattered. “Finally,” I thought. “Stating the Obvious has found a kindred soul… One who sees my weekly musings as a light in the darkness, guiding him away from the unwashed, self-indulgent masses.” Well, maybe that’s going a bit far. Maybe I was just happy to be thought of as one in a “trail of ideas.” But then something hit me. Why the hell is here I am considered to be more self-indulgent than here is what I think? And when it’s so damn easy to publish on the web, and considering that hardly anyone out there is operating under an editor’s benevolent knife, is there really a difference between here I am and this is what I think? I’ve been reading a good deal of here I am type sites lately. Maybe it’s just because the “trail of ideas” can be completely mind-numbing; opinion after opinion after opinion. It’s the here I am sites that leave more than a trail of ideas – they’re proof that there is a trail of people out there behind the addresses. Not to mention lots of personal dirt to satisfy any voyeur’s cravings… Justin Hall turned links from the underground into www.links.net, the home page of which is a daily free form poem on the state of his life at Swarthmore College. Right now, Justin seems to be enduring a spring break trip to Florida. But the writing continues unabated, with stories of night time on the Daytona strip. There’s a site, though, that continues to confound. And that, of course, is Suck. Joey Annuff and Carl Steadman seem to live simultaneously at the two extremes of here I am!!! and this is what I think."
author = "Michael Sippey"
year_published = 1996
