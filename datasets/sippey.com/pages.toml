["https://sippey.com/1996/02/12/live-or-memorex.html"]
title = "Live or Memorex? - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "The San Francisco Chronicle fell for it. Hook, line and sinker. In the November 13, 1995 “Legal Grounds” column, they ran a story on the “Solomon Project,” an artificial intelligence experiment at NYU. It was beautiful… Think juries are biased and incompetent? Do judges annoy you with their imperious nonsense about procedure and decorum? Researchers at New York University Law School have a solution: Get rid of them. For seven years, lawyers and computer scientists have been working on the Solomon Project – a computer program that can review a case, apply the law and spit out a decision. The Chronicle went on, explaining how the computer program uses some combination of admissible evidence, lie detector tests, databases of law, “ethical rules” and “factual precedents” to come to its verdicts. It even quoted a letter from the project’s director, Joseph Bonuso: “Due process and equal justice are served immediately based on unbiased evaluation of facts and law. Justice is swift and blind, with minimum cost.” Bonuso and the Solomon project got a lot of press. The New York Times. CNN. The Wall Street Journal. Appearances on “Sonya Live” and “Good Morning America.” And why not? The O.J. verdict had come about a month before… Do you think the Chronicle usually describes juries as “biased” and “incompetent?” If you haven’t heard already, the Solomon Project was a hoax. Pure and simple. Perpetrated by possibly the greatest media jammer of all time – Joey Skaggs. Skaggs posed as Bonuso, found a friendly sucker at NYU, and was off and running. The Solomon Project was just the latest in a series of scams on the national media pulled by Skaggs. And Skaggs played them to the hilt. CNN ran a nice little piece on their web site about the hoax, admitting that they had been turned into Skaggs’s “puppet.” Skaggs has been enjoying the last laugh for quite a while, now. In 1976 there was the “Cathouse for Dogs,” a bordello for your horny mutt. Then “Walk Right!,” some sort of grass roots effort to improve sidewalk etiquette. Then the “Fat Squad,” whose members would come to your house and physically restrain you from the trip to the refrigerator during commercial breaks. And then in 1992, “Sexonics,” a company exhibiting at a Toronoto trade show promising full-on virtual sex. All of these hoaxes got pretty serious attention from the wire services and national media."
author = "Michael Sippey"
year_published = 1996
