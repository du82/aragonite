["https://sippey.com/1996/06/04/find-your-own-road.html"]
title = "Find your own road - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "I have a dream. A dream of mythic proportions. A dream that began with the first kill file I ever wrote. A dream of declaring myself independent of this so-called “online community.” I want to become one of the Freemen of the Internet. That particular group of Montanans have proven themselves to be masters of viewpoint inbreeding. Nothing matters to them except what matters to them. It’s brilliant, really. But I’m going to give them a run for their money. While the Freemen have the jump on the news coverage, I’ve got something the Freemen don’t. Venture capital. Dozens of VCs are indirectly funding my experiments in filtering information, personalizing content, and tweaking my signal-to-noise ratio. Companies strewn across the Valley are helping me whittle down the bitstream into something manageable. They understand that I no longer have a need for the shared experience. They know I’ve moved to my compound in virtual Montana. And that it’s a place where I’m completely in touch. With myself. I took down my website. Sure, my friends are getting 404s, but it was generating hits from people I’d never heard of. All of whom usually felt the need to write and tell me what they think. Like I care. I’ve replaced my site with a personal workspace at Netscape. It’s an exercise in net.minimalism. No scanned photos. No lists of links. No self-righteous opinions. In fact, no content whatsoever. Just one single, solitary link: Affinicast. I filled out their survey, answered the question “What style of Web site do you prefer: unconventional or trustworthy?” and now surf only to sites that match my “individual media preferences.” And mine only. The websites that Affinicast recommends I Freeload. While I sleep, dreaming of cable modem bandwidth, Freeloader downloads complete sites to my hard drive. In the morning, I surf locally, the “contacting host” message a thing of the past. And since I’m not connected, I no longer feel the need to follow the distracting hypertext. I know full well that all those links are full of useless propaganda."
author = "Michael Sippey"
year_published = 1996
