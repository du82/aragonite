["https://sippey.com/1996/04/15/life-beyond-the-browser.html"]
title = "Life beyond the browser - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "As part of my job, I’ve been leading some fairly informal “Internet training” sessions, spending about an hour or so every few days with a different group of 20-30 folks, feeding them the religion. It’s an interesting challenge, introducing the the overwhelming sprawl of the net to newcomers in under sixty minutes. The most frequently asked question I get is “What’s the difference between the Internet and the World Wide Web?” And I explain it like this… Like millions of other businesses, we run a local area network in our office. The LAN consists of file servers, some routing hardware and some cabling. And on that LAN runs an email system, some corporate databases, and a small amount of groupware. It’s easy for folks to distinguish between the LAN itself and the applications that run on it. So, I tell ‘em that the Internet is “just another network,” albeit one that’s cross-platform, distributed, built from the bottom up, etc. And that they should consider email, FTP, IRC and the web just applications that use the network. This starts to open people’s eyes a bit. Because they start to realize that the web is not the be-all end-all of the Internet. When you can look beyond the useless corporate web sites, and view the Internet as “just another global network,” the possibilites start opening up before you. Because if you can build a client/server application that uses the ‘net as the conduit, there are opportunitites to distribute information in a graphically rich environment. An environment where the limits of what can be accomplished with HTML and CGI scripting disappear. Pointcast Network’s screen-saver-slash-news-viewer seems to be on everyone’s desktop lately. It’s a resource-hogging Windows app which downloads news stories, stock quotes, weather maps, horoscopes and lottery numbers and displays them in either an animated screen saver or a graphics-heavy application. Oh, and did I mention the ads? Yes, it’s ad-supported. Like everything else."
author = "Michael Sippey"
year_published = 1996
