title = "CAH v. Space X - Michael Sippey"
full_description = "Seven years ago, 150,000 people paid us $15 to protect a pristine parcel of land on the US-Mexico border from racist billionaire Donald Trump’s very stupid wall. Unfortunately, an even richer, more racist billionaire – Elon Musk – snuck up on us from behind and completely fucked that land with gravel, tractors, and space garbage. SpaceX and/or its contractors entered the Property and, after erecting posts to mark the property line, proceeded to ignore any distinction based upon property ownership. The site was cleared of vegetation, and the soil was compacted with gravel or other substance to allow SpaceX and its contractors to run and park its vehicles all over the Property. Generators were brought in to run equipment and lights while work was being performed before and after daylight. An enormous mound of gravel was unloaded onto the Property; the gravel is being stored and used for the construction of buildings by SpaceX’s contractors along the road. Large pieces of construction equipment and numerous construction-related vehicles are utilized and stored on the Property continuously. And, of course, workers are present performing construction work and staging materials and vehicles for work to be performed on other tracts. And I know this is just boilerplate, but after you read the whole complaint it’s really satisfying to read this:"
