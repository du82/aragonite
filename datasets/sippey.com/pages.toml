["https://sippey.com/page/3"]
title = "- page 3 - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "You’ve heard of the stories of sucessful founder because they’ve become famous (or infamous). However, the majority of start-ups fail. No one tells and retells the stories of these companies because they never launch. No one became rich or famous. It is their defining characteristic. In his recent essay, Paul Graham talks about the successful founders. However, it’s not “Founder Mode,” it’s “Successful Founder Mode.” Lumping all Founders together would mean we should — statistically and more descriptively — call this “Failing Founder Mode,” which is neither clever nor inspirational. As a person deeply in love with naming things, I like the framing of Founder and Manager Mode because it’s clever and instantly useful. If you’ve been reading me over the years, you’ve noted I’ve begun to detest the term manager for some of the reasons Graham highlights: unfamiliar with the details management at a distance, lousy hiring, and siloed decision-making. I’ve gravitated towards the word leader both because I want to make it clear any motivated human can execute the skills of a good manager — leadership comes from everywhere — and, more importantly, I believe managers tell you where you are. Leaders tell you where you are going. It’s a philosophy thing. Hi I’m Paul Graham and I’m here to talk to you about the unfathomable wisdom of sampling on the dependent variable. If you disagree with me this is itself evidence that you are incapable of thinking in Founder Mode. I loved The Interview with Will Ferrell and Harper Steele, about their friendship, their upcoming road trip documentary, Steele’s transition, and their collaboration at SNL: Ferrell: My last year on the show, we would have blue notecards of sketch ideas and it’d be like: “Harper, you have to write a sketch called ‘Taco Time.’ Go!” Steele: You’re forgetting a key element that speaks to this perfectly. “Taco Time” is a perfect example, or “Unicorn Mountain.” I would write the first half and then hand it to Will. So I don’t know what he’s gonna do with the sketch. It was always a left turn."
