["https://sippey.com/1996/03/08/does-it-all-want-to-be-free.html"]
title = "Does it all want to be free? - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "Last’s week piece drew more mail than I’ve had in a long time. My rant on BigBook drew comments from readers on both sides of the fence of whether the web is an appropriate medium for a telephone directory. And I heard from a few friends who had been recruited by BigBook, only to question its business model the same way I had. But the sentence “Isn’t anyone producing content that’s worth paying for?” drew the most fire. I think I’ve touched a nerve… Several readers were upset by the thought of paying for content. “I pay enough for access to the web; I can’t imagine paying for access to individual web sites,” remarked one. Another argued that instead of paying for content, “good citizens” of the web should provide content of their own for others to consume. Hmmmm, the web as an enormous cooperative. I’m sure that’s how Time Warner operates their business. But I did hear from a few folks who believe the current model (give it away to the user, drive the hit count and charge for advertising), is in danger of collapsing. That if this trend continues, web sites will focus on creating content that exists only to drive hit counts. When the web was young (like a year ago), the hit count model worked fairly well. The user “community” of the web was pretty easy to define – relatively young, predominately male, well educated, and flush with disposable income. Computer geeks. But as the net.population increases, this assumption has to be thrown out the window. As more and more folks jack in, the demographics necessarily will migrate more toward the national average, more toward the lowest common demoninator. More toward what the average television viewer looks like. And we all know what the average television viewer likes to watch. Contrary to popular belief, the barriers-to-entry for creating a high-impact, high-traffic web site are not low. Sure, I can publish “Stating the Obvious” every week with a couple of hours of free time and a text editor. But I’m not generating the content (or the hit counts, or the advertiser revenue) like HotWired or Word or Salon. Great-looking (and sounding and moving and jumping) web-sites, with compelling content takes people. Bright people, educated people, literate people, net.aware people. And those type of people are expensive. Very expensive."
