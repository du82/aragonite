["https://sippey.com/1996/02/26/turn-up-the-heat.html"]
title = "Turn up the heat - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "“We’re moving to Canada,” screamed several friends of mine last week, after learning that Pat Buchanan won the New Hampshire primary. “It’s a sign,” opined one, “that this country is out of control.” Well, maybe so. But I live in San Francisco, and tend to take such dire screams of liberal doom and gloom with a healthy dose of salt. Don’t get me wrong, I’m the furthest thing from being a fan of the racist, populist, anti-semitic, demagogic former talk show host. But I don’t take Buchanan’s victory in New Hampshire as a sign of the apocalypse. New Hampshire doesn’t come close to representing America as a whole. New Hampshire is overwhelmingly rural, 98% white, disproporionately conservative and very, very cold. With Tuesday’s election, Buchanan proved his ability to play on their fear and distrust. Fear of “immigrants.” Distrust of “big government,” and “corporate greed.” And just barely under the surface, it seems to me, fear and distrust of diversity, free thought; fear of what they don’t know. In Thursday’s New York Times, Joyce Purnick lamented the fact that none of the candidates in New Hampshire dealt with any issues that had anything to do with urban life. She wrote… It would have been nice if just one Republican candidate in New Hampshire had at least mentioned the word “city.” … Or even acknowledged that cities existed – other than the mythical “shining city on a hill.” A friend of mine who used to work in the Clinton administration (but now lives in New York) says I shouldn’t be surprised about this. She wrote me this week saying… If you look at all of the Republican hot-button issues (welfare reform, anti-immigrant rhetoric, taxes, state’s rights, etc.) all of these things are geared towards non-city voters who think that people on welfare are lazy, “foreigners” are taking American jobs away, their tax money should not be spent educating or feeding someone else’s kids, and big government is bad for the little guy."
