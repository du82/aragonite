["https://sippey.com/1996/08/05/global-v-local.html"]
title = "Global v. local - Michael Sippey"
description = "Michael Sippey's blog, published semi-regularly since 1995."
full_description = "What’s the web? On the one hand, it’s a global information superhypeway, letting us trade bits across borders without running into glorified crossing guards. On the other hand, it’s a small little town where everybody knows your name. Remember Intenet 101? Where you learned that the Internet is really a network of smaller networks? Key concept, because try as they might, the BigBooks of the world will fail. It seems that local directories of things, well, local, are turning up all over the web. Where I live, I have access to gobs and gobs of localized web content. The Digital Lantern. San FranZiskGo. Television and radio stations. Of course, the fact that the self-described “epicenter” of the web happens to be 100 yards from where I work probably has something to do with this. But while programming guides from your local classic rock outlet are one thing, entire local web directories are another. In the “looking for somewhere to invest our IPO dollars” category is Yahoo! San Francisco Bay Area. With a nice colorful home page graphic, some message boards and a restructured content tree, they’ve created “the ultimate, ultra-current guide to Bay Area living.” Case in point: they have a link on the front page to 20-minute delayed quotes on the “Internet 25.” Now all those Bay Area knowledge workers can watch their fortunes rise and fall. Yahoo cheated. With a little database programming and their existing treasure trove of links, they were able to create a “guide” to Bay Area living. It obviously doesn’t matter that Yahoo’s a local company; they’ve gone ahead and created Yahoo! Canada and Yahoo! Japan. Yahoo’s primary motivation is not to build local communities around localized Yahoos. It’s to open up more opportunities for advertising revenue. (Not that there’s anything wrong with that.) It’s hard to sell a spot to the San Francisco Giants at Yahoo proper’s ad rates. And don’t they realize that the great thing about Yahoo! is that it can point you to a page on Algeria just as easily as a page on Alameda?"
