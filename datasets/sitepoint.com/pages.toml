["https://sitepoint.com/ai-tips-for-web-developers-and-their-careers"]
title = "8 AI Tips for Web Developers (and Their Careers) — SitePoint"
description = "Read 8 AI Tips for Web Developers (and Their Careers) and learn AI with SitePoint. Our web development and design tutorials, courses, and books will teach you HTML, CSS, JavaScript, PHP, Python, and more."
full_description = "Blog/AI/8 AI Tips for Web Developers (and Their Careers)8 AI Tips for Web Developers (and Their Careers)Jens Oliver MeiertPublished inAI·Web·Oct 09, 2024·Updated: Jan 20, 2025Share this articleSitePoint PremiumStay Relevant and Grow Your Career in TechPremium ResultsPublish articles on SitePointDaily curated jobsLearning PathsDiscounts to dev toolsStart Free Trial7 Day Free Trial. Cancel Anytime. For better or for worse, AI is coming everywhere. In web development, we’re not at but close to the epicenter of the AI earthquake. What does it mean for our work? If you’re like me, you haven’t jumped at this the instant the first AI tools came out, years ago. Knowing about some of the issues with AI and appreciating the craft of our field, you may not have used it much even today. If you aren’t using AI in web development yet, I think that’s a mistake. Let me share some ideas and tips from my observations going all in on AI over the last few months. The following recommendations apply to web developers in their individual capacity. (I am working on sharing my perspective on AI in web development teams, too.) That assumes that you do have your own projects (including, hopefully, your own website). 1. Do It Use AI. If you haven’t yet, start today. If you don’t, your company may be going to throw you under the very same bus they’re driving and had put you on. I’m not joking (or, well, I’m not optimistic). AI is bad for our environment, it’s bad for our craft, but it’s pointless to argue with reality. (There are some things we can and should do about both, but these are conversations to be had elsewhere.) We have also been seeing a lot more layoffs over the years. No matter what “great place to work” they pride themselves to be and, therefore, how hypocritical companies may then appear, actions speak louder than words. In tech companies, we reached the time to assume the worst. 2. Set Yourself Up With an AI Assistant When we’re talking AI here, we’re talking about development-related AI. All-purpose AI like ChatGPT can help, but for our work, we need specialized tooling. The most prominent choice here is probably GitHub Copilot, though I also like JetBrains’ AI Assistant. Get the license(s). Try what works for you. Most importantly, but we’ll cover more of this, use it. 3. Get Your Commit Messages Auto-Generated One big time saver is to AI-generate commit messages. (I go through about 1,000 every month.) JetBrains’ AI Assistant makes that easy in JetBrains IDEs. Here’s the prompt I’m using, based on the default, making use of Conventional Commits and marking every commit message as AI-generated: Avoid overly verbose descriptions or unnecessary details. Start with a short sentence in imperative form, no more than 50 characters long. Use Conventional Commits style. Then leave an empty line and continue with a more detailed explanation. Write only one sentence for the first part, and two or three sentences at most for the detailed explanation. For anything in the repository […], make the commit message just the following: “chore: include automated changes” End every commit message with the following message on a separate line: “(This commit message was AI-generated.)” It works well, it saves time, and the quality is as good (if not better) as when I write the message. The following seems important though: It’s still a good skill to be able to write decent commit messages, in a standardized fashion. That is, if you’re a junior developer and haven’t yet developed a solid skill and routine around documenting your changes, I’d recommend to develop that first, then use AI for support. It’s crucial to be able to handle the basics, as it’s at the core of your professional credibility. 4. Get Your Code AI-Reviewed Unless you’re contributing to other people’s work, you likely don’t get reviews for your code. Yet if you’re developing code for and within an organization, you may encounter all sorts of code review styles and processes—with some reviewers who wave everything through, others who will discuss tabs vs. spaces in every single file; with cases in which you get feedback right away, and cases in which you need manager support to finally get that review from the other team. In both cases, AI code reviews can help. They are super-useful if you need the second opinion you just can’t get right now, and they can speed up and harmonize code reviews within organizations. What tool could you use? I’m still evaluating more options, but my favorite code review helper so far is CodeRabbit. It has correctly identified issues I may not have noticed otherwise, and I do like to fall back on it on more complex changes in my own projects. Note that I’m not saying to solely rely on AI code reviews. While we may need to for our individual work, that’s different in organizations. Here we can include AI in the process, then make adjustments based on our expectations and experience. 5. Use AI to Refactor Your Code If you’re like other developers (or like me), you use to-do comments to mark things that could be cleaned up 🙂 (Or do you 🙃) One great use case for your AI assistant or editor is to refactor these places. JetBrains, for example, has an excellent refactoring option (its best AI feature apart from commit messages, I think), allowing to request refactoring suggestions for such code. Try it out on your own code. While the solution may not be “perfect,” it may still be better than what was there before. (If not, you can always slap another “to-do” comment on the code—or roll back.) Refactorings are where AI can shine—I suggest to use it for them. 6. Work Through Five Test Projects …and do that now: Write down your biggest pain points at the moment, the recurring tasks most annoying to you, the projects you always wanted to do. If you have time and are set up already, ask your AI code assistant to give you the scaffolding or script for your needed solution or envisioned project. Allow to be dragged into it. Build it. Make five, make more of these projects happen. If you can handle the extra work (cf. the “AI paradox”), document, ship, and announce them. The point is to develop a muscle for AI development work, and sharpening your sense for where it helps (and where it doesn’t). 7. Regularly Explore AI Tools In a professional and personal capacity, keep trying AI solutions. Yes, everyone is shipping something AI, but the point here is to be on the lookout for AI solutions in your niche, and to make it a habit to test them (for me, recurring reminders help with this). Here are some solutions I’ve been evaluating or planning to evaluate: Amazon Q Developer Bito Codacy Codepeer CodeScene CodiumAI Cursor Grit Figstack Mutable.ai PullRequest Reviewable Sourcegraph Cody Tabnine Once that’s done, you and I could both move on to explore a number of “awesome lists” for AI. For example, Mahsima Dastan’s Awesome AI Tools, or James Murdza’s Awesome AI-Powered Developer Tools. 8. Decide Where You Will Not Use AI I’ve already suggested to wait with AI commit messages until you’ve formed a good habit around them, something most of you will have. It’s part of a bigger topic—being or becoming aware of what work you can delegate to AI and what maybe you cannot hand over. Here is where I think this gets delicate: You can draw a line and say that you don’t use AI in your main area of expertise. I, for example, don’t use AI to produce HTML and CSS, something I have many reasons to do myself (if you don’t so far, consider following my work!). But it still makes sense to test AI and check on where it can make you more efficient—or obsolete. That looks like bad news, sure—but you want to learn it this way before someone else tells you. It will enable you to adopt and adjust, to a) incorporate AI in your own work, and b) develop your non-AI profile, identifying and shaping an area that can benefit from you and your talents and experience, and not yet from AI. If you learn to use AI so that you also know where AI cannot be used, you’ll be right at the spot where we as professionals will be needed in the future. If you don’t do this, the work you’re doing is likely to be AI’ed and automated away. Summary AI is an energy hog and we urgently need to figure out how to make it consume fewer resources, more and then all of them renewable. AI makes us dumb if we aren’t critical, keep learning, and develop a sense for when not to use AI. As developers, not just in web development, we need to incorporate AI in our work. There are enough companies who don’t care much about people, so if we don’t adapt, we’ll be out. (This is a disaster and needs change, yes.) Incorporating AI in our work starts with an AI IDE or an IDE with an AI code assistant. AI-generating commit messages is a good AI use case. AI-supported code reviews are a mandatory AI use case. (I’m absolutely bullish on this one.) AI-supported refactorings are a great AI use case. We can build experience and a strong sense for AI by using it to resolve pain points and implement smaller projects. We benefit from keeping an eye on the AI landscape, by regularly exploring AI tools. We must know AI so well that we also know its shortcomings as they relate to our work—and we must use this knowledge to keep redefining ourselves as professionals. I believe that’s where we are and what we can do right now, when it comes to AI in web development. Many thanks to Kevin Khaw for reviewing this post. Jens Oliver MeiertJens Oliver Meiert is a frontend engineering leader (e.g., Google, Miro) and tech author/publisher (O’Reilly, Frontend Dogma). He’s an expert in web development, specializing in HTML and CSS optimization and maintainability. Jens contributes to technical standards and regularly writes about his work and research, particularly on his website, meiert.com.Share this articleRelated articlesUsing Java Bean Validation for Method Parameters and Return ValuesPublished in·Java·June 1, 2017SitePoint PremiumSta