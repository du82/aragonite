title = "API Works on Swagger but Failed on Web Page - JavaScript - SitePoint Forums | Web Development & Design Community"
description = "Using Swagger my  API successfully uploads an image from my computer to a folder in my project in Visual Studio . However when I tried uploading an image from my computer to my project folder using the upload button on my web page, I got the error code 400 bad request. I understand that this means my request is malformed among other things. I checked the API URL and it is the exact same URL I used on Swagger and I’ve already cleared my browser cache. I’m not sure what else I need to check as the..."
full_description = '''API Works on Swagger but Failed on Web Page JavaScript liagapi555 February 24, 2025, 5:34pm 1 Using Swagger my API successfully uploads an image from my computer to a folder in my project in Visual Studio . However when I tried uploading an image from my computer to my project folder using the upload button on my web page, I got the error code 400 bad request. I understand that this means my request is malformed among other things. I checked the API URL and it is the exact same URL I used on Swagger and I’ve already cleared my browser cache. I’m not sure what else I need to check as the error is very vague. The following are my markup and script. <form class="form" id="myForm"> <input type="file" id="inpFile" /><br/> <button type="submit">Submit</button> </form> const myForm = document.querySelector("#myForm"); const inpFile = document.querySelector("#inpFile"); myForm.addEventListener("submit", (e) => { e.preventDefault(); const endpoint = 'https://localhost:7209/api/Main/UploadFile'; const formData = new FormData(); formData.append("inpFile", inpFile.files[0]); fetch(endpoint, { method: "post", body: formData }).catch(console.error); }) DaveMaxwell February 24, 2025, 6:20pm 2 liagapi555: const endpoint = 'https://localhost:7209/api/Main/UploadFile'; This line is wrong. It wouldn’t be localhost on your server. liagapi555 February 24, 2025, 6:56pm 3 Hi thanks for replying. The project is still on my local machine and not yet deployed to a server. So localhost is the server. DaveMaxwell February 24, 2025, 7:24pm 4 Then check the path and check the port. Do you have a SSL cert running on localhost (even if self-signed)? If you enter the URL in the browser, does it find it? I’d guess not. m_hutley February 24, 2025, 9:48pm 5 why are we sending just part of the file input? why does the file input not have a name? why are we manually constructing FormData for an actual form? Zensei February 25, 2025, 2:07am 6 Your client code is correct, I just checked the same code again my server, and I can upload files. I would have done it like this, but your code is fine <form method=post action="/api/Main/UploadFile" enctype=multipart/form-data> <input type=file name=inpFile> <input type=submit value=Upload> </form> I suspect something, but before I can say anything can you put your swagger code here?. liagapi555 February 26, 2025, 8:37pm 7 Hi, in command prompt I CDed into my solution folder which contains two projects a dotnet core web API project and a dotnet core web project containing only a static web page. Then I created a self signed ssl cert using the following command dotnet dev-certs https --trust Unfortunately I still get the 400 bad request error. Also when I pasted the web api endpoint into the browser I got the error This site can’t be reached **localhost** refused to connect. I think it only works using IISExpress or some other server. liagapi555 February 26, 2025, 8:44pm 8 I think the name is added when you pass it in as an argument to the FormData append method like this formData.append(“inpFile”, inpFile.files[0]) DaveMaxwell February 27, 2025, 1:09pm 9 liagapi555: Also when I pasted the web api endpoint into the browser I got the error That means the port is blocked in IIS. You need to enable it for it to work. But if you’re running iisexpress and not a windows instance which includes IIS, that is probably your issue. You’ll need to deploy it to hosting (and change the URL since it will no longer be localhost) and try it there. liagapi555 February 27, 2025, 6:17pm 10 IISExpress is in Visual Studio and when I run a web page in Visual Studio which makes a post request to the Web API it should just work like it did in past versions but I’m not sure what I need to configure in the version that I’m using. One thing I also don’t understand is if the port I’m using is blocked in IIS how come I was able to successfully upload an image using the API in Swagger which is built into Visual Studio. I’m really frustrated as I can’t even do my development work and test my code. DaveMaxwell February 27, 2025, 6:36pm 11 IIS and IIE Express are not the same thing. IIS express is a “dumbed down” version of IIS, which means things like security and such are ignored. Related topics Topic Replies Views Activity Help please if you know how to upload a file! .NET 2 1108 October 8, 2014 Help! please! I'm really stumped with uploading an image file - decent challenge:) Get Started 1 463 October 8, 2014 I'm trying to upload a file in ASP.NET C# .NET 9 24083 October 8, 2014 PHP Help! action.php HTTP 400 Bad Request - What 'am I missing? PHP 6 2420 October 8, 2014 Trying to add xml example of response in swagger but it doesn`t show JavaScript 2 757 April 16, 2020'''
author = "liagapi555"
year_published = 2025
