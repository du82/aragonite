<li> Grouping Elements (main, div, p, hr, ul, ol, li, figure, pre)</li>
<li> Text Level (a, em, strong, span, br)</li>
</ul>
</li>

<li><strong> CSS Fundamentals</strong>
<ul>
<li> Adding CSS (Inline, Internal and External)</li>
<li> Syntax: selectors, declaration block, properties, declared value</li>
<li> CSS Selectors (universal, type, class, id, attribute)</li>
<li> Cascade and Specificity</li>
<li> Box Model</li>
<li> Sizing (padding, margin, width, height and border)</li>
