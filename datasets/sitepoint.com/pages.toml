full_description = "Teijin Automotive Technologies is an innovative and full-service Tier One supplier with a global presence and emphasis in development for lightweight technologies. Teijin Automotive offers employees the opportunity to join a leading edge company within the composite material industry and enjoy the benefits offered by a growing company in North America and internationally. Oversee and direct quality activities in the area of capability studies, dimensional checks, material testing, product inspection, print changes, process and product documentation in order to obtain optimum productivity and quality levels while complying with customer specifications. The primary responsibility will be to achieve premium levels of customer satisfaction for product and service supplied by the plant through operator awareness, appropriate inspection, audit programs and continuous improvements and customer visits to the plants for monitoring and feedback. In addition, the Quality Engineer will be responsible for achieving product target cost, efficiency, and quality for existing products. Also, this position will be responsible to lead the plant in customer satisfaction, PPM reduction, and quality system development. The Quality Engineer will report directly to the Quality Manager, but will also be an active member of the Launch team."
