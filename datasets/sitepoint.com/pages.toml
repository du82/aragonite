["https://sitepoint.com/write-for-us"]
title = "Become a writer at SitePoint"
description = "We're looking for developers and designers to write about web technologies. Find out how to pitch us and what we're looking for."
full_description = "Table of ContentsA Few Tips for Technical Content BeginnersPitches We’re Looking ForWhat We Offer Our ContributorsReady to Write for Us?Blog/Blogs/Write for SitePointTable of ContentsA Few Tips for Technical Content BeginnersPitches We’re Looking ForWhat We Offer Our ContributorsReady to Write for Us?Write for SitePointSitePoint TeamPublished inBlogs·Jan 01, 2020·Updated: Jan 30, 2024Share this articleSitePoint PremiumStay Relevant and Grow Your Career in TechPremium ResultsPublish articles on SitePointDaily curated jobsLearning PathsDiscounts to dev toolsStart Free Trial7 Day Free Trial. Cancel Anytime.Do you want to share your knowledge with the world and get paid to do it? SitePoint is always looking for talented writers to contribute their insights on technology. Our audience includes developers of all levels, as well as designers. We’re interested in hearing from you if you want to write about JavaScript, Python, Rust, WebAssembly, React, Figma, and Tailwind CSS. If you’re not a writer but are passionate about technology, we’d still love to hear from you! Can you submit drafts in fluent English and share valuable knowledge with other developers? Great. We’re happy to work with you on your piece (and help you learn the ropes of technical content along the way). We’re always looking for talented people to contribute. Pitch us and let us know what you’re passionate about! A Few Tips for Technical Content Beginners If you’re new to technical content writing, you should keep a few things in mind. First, your article should be well researched and accurate. You should be able to back up your claims with concrete evidence. Second, it should be clear and concise—our readers are busy people, so they appreciate articles that get to the point. Third, it’s important to be able to explain complex concepts in layman’s terms. And to put them together in a way that helps the reader click. And lastly, remember that a little humor goes a long way! We want our readers to enjoy your article, even if it is about a dry subject. If you can keep these things in mind, you’re on your way to becoming a SitePoint contributor! We look forward to reading your pitches. Pitches We’re Looking For We’re always interested in hearing from developers, designers, content creators, and digital makers who want to write about the latest and most impactful technologies. Some of the topics we’ve written about recently include: Front-end architecture Web performance and accessibility JavaScript topics from beginner to advanced Frameworks like React, Vue, Svelte, Solid.js, Next.js, Gatsby, and runtimes like Node and Deno Python — from data science to Django Rust, the rise of WebAssembly, and serverless computing Tailwind CSS, Figma, and Webflow Notion, Airtable, and Zapier Articfical intelligence, machine learning, LLMs No matter what your level of expertise is, we want to hear from you! We’re interested in articles for beginner, intermediate, and advanced audiences. Our core areas are: Web Development and Design JavaScript, HTML and CSS Python PHP WordPress, Ghost, and other content management systems User experience design and design tools like Figma Entrepreneurship & Digital Marketing SEO, content marketing, and social media Productivity tips for freelancers and solopreneurs Web hosting & development tools The business of web development and design Freelancing and running a web-based business Growth Hacking No-Code & Low-Code Tools Workflows and integrations with apps like Notion, Airtable, Zapier App builders like Webflow, Bubble, and AppSheet Marketing automation tools like HubSpot, ActiveCampaign, ConvertKit Development Tools & Environments Site builders Text editors, code playgrounds, and collaboration tools Code testing & debugging tools Package managers & dependency management tools What We Offer Our Contributors We’ll pay for the best content. We have a rigorous editorial process to ensure that your article is the best it can be before it goes live on the site. Our editors will work with you to make sure your article is clear, concise, and well researched. And of course, we’ll promote your article on our social media channels and newsletter to help you get the most exposure for your work. Ready to Write for Us? If you’re interested in becoming a SitePoint contributor, the first step is to fill out our pitch form. If we like your pitch, we’ll get back to you. Please note: if you pitch is something we’ve already covered on SitePoint, we likely won’t accept it, unless you can clearly show how your article will be an improvement. So please use search to check before submitting your pitch. Please note we don’t accept “guest posts” designed to promote a product or service. We’re looking forward to hearing from you! SitePoint TeamSharing our passion for building incredible internet things.technical editorweb writingwrite for sitepointwritersShare this articleRelated articlesAI-Assisted Coding for iOS Development: CursorAI and Upcoming Swift AssistPublished in·AI·iOS·February 18, 2025Meeting European Accessibility Act (EAA) Standards: A Developer’s ChecklistPublished in·Accessibility·Design & UX·Web·February 18, 202510 Common Web Development Mistakes to Avoid Right NowPublished in·Web·February 17, 2025Best Payment Gateways in France for 2025Published in·Blockchain·Business·February 17, 2025Random Forest Algorithm in Machine LearningPublished in·AI·January 27, 2025What Is Cloud Computing?Published in·Cloud·Web·January 26, 2025Collections in JavaPublished in·Java·January 24, 2025ZEISS Demonstrates the Power of Scalable Workflows with Ampere Altra and SpinKubePublished in·Web·January 23, 2025SitePoint PremiumStay Relevant and Grow Your Career in TechPremium ResultsPublish articles on SitePointDaily curated jobsLearning PathsDiscounts to dev toolsStart Free Trial7 Day Free Trial. Cancel Anytime."
