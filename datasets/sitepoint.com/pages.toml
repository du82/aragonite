["https://sitepoint.com/community/t/dealing-with-clipboard-data/472529"]
title = "Dealing with Clipboard Data - JavaScript - SitePoint Forums | Web Development & Design Community"
description = "I have the following code  where I’m copying and then pasting some stuff like the following in the text area. I have it setup this way because when I paste the following three lines, the cursor stays right after the last line HIJ123 and not below HIJ123.  ABC123 DEF123 HIJ123  I want to achieve the following while copying and pasting.  1.After pasting the above three lines in the text area, if I want to paste the same thing (ideally it’s going to be different lines of text similar to above)again..."
full_description = '''Dealing with Clipboard Data JavaScript Jack_Tauson_Sr February 28, 2025, 9:45am 1 I have the following code where I’m copying and then pasting some stuff like the following in the text area. I have it setup this way because when I paste the following three lines, the cursor stays right after the last line HIJ123 and not below HIJ123. ABC123 DEF123 HIJ123 I want to achieve the following while copying and pasting. 1.After pasting the above three lines in the text area, if I want to paste the same thing (ideally it’s going to be different lines of text similar to above)again in the text area, let’s say after pressing enter after ABC123, the next three lines get pasted after HIJ123 as shown in the image below,even though the cursor was after ABC123 after pressing enter after ABC123. Is it possible to get it pasted where I am looking for - after ABC123 in above scenario? image235×184 1.2 KB 2.Is there a way I could clear the clipboard data after pasting the contents? I was trying to achieve something using the Clear Data! button, but it doesn’t seem to work and throws Uncaught TypeError: element.value.clearData is not a function when I click on Clear Data button. Here is my JsFiddle demonstrating the same. I’m using both Chrome and Firefox browsers if that matters. m_hutley February 28, 2025, 10:20am 2 Didn’t we cover #1 in the last iteration of this thread, Jack? I could have sworn we did… Jack_Tauson_Sr: Uncaught TypeError: element.value.clearData is not a function clearData is a function of the Event.clipboardData object. In your code, the Event would whatever parameter you put into the event listener (currently you have no parameter specified; compare and contrast line 3, where you specify e as that parameter). basically, addEventListener((e) => e.clipboardData.DoStuff Jack_Tauson_Sr February 28, 2025, 11:09am 3 Yup, found our old thread. How do I handle the new line resulting from pasting from spreadsheet JavaScript I didn’t quite understand it properly. Could you elaborate a little bit more? Thanks! I am gonna give it a try and ask questions here, as that one is closed. 1 Like Jack_Tauson_Sr February 28, 2025, 11:20am 4 m_hutley: basically, addEventListener((e) => e.clipboardData.DoStuff On this part, were you recommending like this? document.getElementById('clear-button').addEventListener('click', (e) => { console.log("What is element here?"); console.log(element); e.clipboardData.clearData(); }); This still gives me an error Uncaught TypeError: Cannot read properties of undefined (reading 'clearData')" m_hutley February 28, 2025, 11:36am 5 Oh, apologies, I should have read the MDN a little clearer. clipboardData only exists for Events of the Clipboard type (paste, copy, cut), and it wouldnt… effect the user’s clipboard directly? (because that would make sense, Marc. Security is a thing.) What you could do instead is write to the user’s clipboard a blank string, which would effectively ‘empty’ the clipboard without trying to modify the clipboard history. navigator.clipboard.writeText(""); Jack_Tauson_Sr February 28, 2025, 3:07pm 6 No problem. Could you check if this is how it should be written then? This doesn’t seem to clearing the textarea. It didn’t throw any error as well. I’m testing it on Chrome browser. document.getElementById('clear-button').addEventListener('click', function () { console.log("What is element here?"); console.log(element); navigator.clipboard.writeText(""); }); m_hutley February 28, 2025, 3:08pm 7 Jack_Tauson_Sr: This doesn’t seem to clearing the textarea Are you trying to clear the textarea, or the clipboard? You dont have any code in that block that would erase the textarea. Jack_Tauson_Sr February 28, 2025, 3:11pm 8 m_hutley: Are you trying to clear the textarea, or the clipboard? Both. Such that user could copy new one and paste it. m_hutley February 28, 2025, 3:15pm 9 element.value = ""; (add, dont replace, obviously) Jack_Tauson_Sr February 28, 2025, 4:10pm 10 Thanks. This worked: document.getElementById('clear-button').addEventListener('click', function () { console.log("What is element here?"); console.log(element); navigator.clipboard.writeText(""); element.value = ""; }); Now looking into the first part. Related topics Topic Replies Views Activity How do I handle the new line resulting from pasting from spreadsheet JavaScript 27 3165 August 17, 2024 Highlight and paste javascript problem JavaScript 0 769 July 5, 2010 Remove lines when pasting? JavaScript 1 429 January 29, 2011 Copy data to clipboard after sorting JavaScript jquery 5 1577 July 11, 2024 Why on paste it saves on second input? JavaScript jquery 9 986 December 28, 2018'''
