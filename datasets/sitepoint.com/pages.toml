description = "My B2B website https://www.platformexecutive.com is large, and has 20,000 pages of unique, high quality content, yet is suffering from declining rankings on Google. It has no manual actions, etc, a DA of 55, and a decent link profile.  I cannot, for the life of me figure out why Google rankings have dropped off a cliff.  It now gets 5X more traffic from Bing and Chat GPT than it does from Google, which seems strange, compared to my other websites. Luckily, it doesn’t rely too much on Google."
full_description = "Any tips for optimising my (large) website for Google? HTML & CSS seo rphillips21 February 26, 2025, 11:24pm 1 My B2B website https://www.platformexecutive.com is large, and has 20,000 pages of unique, high quality content, yet is suffering from declining rankings on Google. It has no manual actions, etc, a DA of 55, and a decent link profile. I cannot, for the life of me figure out why Google rankings have dropped off a cliff. It now gets 5X more traffic from Bing and Chat GPT than it does from Google, which seems strange, compared to my other websites. Luckily, it doesn’t rely too much on Google. 1 Like m_hutley February 27, 2025, 12:22am 2 rphillips21: Luckily, it doesn’t rely too much on Google. Think perhaps you may have self-diagnosed why your google ranking has dropped off… Also i’m not sure a DA score of 55 out of 100 is something to be crowing about? Not that anyone actually uses DA, it’s a Mozilla metric, not a search engine one. rphillips21 February 27, 2025, 12:53am 3 Thanks for the reply! Perhaps I am being a bit stupid here, but how is not being too reliant on Google an issue? I do want better SERP’s. I’d love 1,000X the traffic from Google. Yes, DA55 is a Moz metric determining (approximately) the link profile. I mention this purely to explain that it does have a link profile to speak of. I agree, i’m not sure the DA score is 100% relevant, but just trying to find some specific understanding I may be missing. m_hutley February 27, 2025, 2:01am 4 If your statement is Luckily you dont depend on Google, you are inherently expressing a disinterest in appealing to that engine. So I would surmise that youve not invested the effort into Google of late, which in turn will lead your ranking in Google to fall away. Though how exactly you measure a “ranking” on a personalized search result custom to each individual searcher is… questionable at best. Theres no such thing as a generic quantifyable “Google ranking”. I assume youre asserting that based on a drop in traffic from Google? rphillips21 February 27, 2025, 2:36am 5 Certainly interested in appealing to Google. I admit, I have never really concentrated on appealing to them for this site though. I’ve just created content, built links, tried to increase the sites discoverability, etc over the last decade. Trying to keep things natural. Over the past 6 months its has gone from 1,000 clicks per day from Google (organic) to less than 30, whilst the Bing, et al have gone the opposite direction. No issue with the other sites, just this one. m_hutley February 27, 2025, 9:24am 6 okay. So i wouldnt necessarily call a 6 month decline ‘off a cliff’, which would imply a much more rapid fall. It’s entirely possible that 6 months ago, Google made changes to their algorithm or valuation metrics, and your site has simply been adjusted correspondingly. Off the top of my head, about 6 months ago didnt Google push out the final migration to GA4, and shut down the last vestiges of UA? Have you reviewed your Google Analytics since that time? Is anything like Lighthouse indicating problems for your site? Related topics Topic Replies Views Activity I Need Your Experience With These Topics: Site Size and New Website Marketing 3 541 September 30, 2014 Seo tips needed for my site Marketing seo 3 2329 January 22, 2022 Things don't add up with this website Marketing 7 787 October 19, 2014 Why isn't my site ranking well? Marketing 23 1259 April 8, 2012 What are the best online tool for complete site or page over-optimized seo Get Started 6 1550 August 20, 2016"
