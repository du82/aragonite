<li> Images and video resizing</li>
<li> Different viewports</li>
<li> Media queries</li>
</ul>
</li>

<li><strong> Layouts</strong>
<ul>
<li> Flexbox</li>
<li> CSS Grids</li>
</ul>
</li>

<li><strong> Advanced</strong>
<ul>
<li> Variables</li>
