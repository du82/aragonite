<li><strong> Website Deployment</strong></li>
</ol>

<p><strong>Why this course?</strong></p>
<ul>
<li>The entire course is focused on a <strong>project-building approach</strong></li>
<li>Learn all the important concepts in the simplest possible way, with many <strong>examples</strong>.</li>
<li><strong>No previous programming</strong> or coding experience is required, we will cover everything <strong>step-by-step from the basics</strong>.</li>

<p> All course materials are <a href="https://unwiredlearning.com/resource/html-css" target="_blank">here</a></p>'''
