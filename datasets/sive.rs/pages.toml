["https://sive.rs/book"]
title = "book notes | Derek Sivers"
full_description = "Books I’ve read Tiny summary but detailed notes for each. Use the ISBN number to find it from your local library or anywhere else. This page will constantly update as I read more, so bookmark it if you want to check back in a few months. Sorted with my top recommendations up top. Sort by title, newest, or best. And please read this FAQ page about these notes, if you have any questions. You can also email me. You Can Negotiate Anything - by Herb Cohen Date read: 2023-08-02. How strongly I recommend it: 10/10 Everything is negotiable. Challenge authority. You have the power in any situation. This is how to realize it and use it. A must-read classic from 1980 from a master negotiator. My notes here aren’t enough because the little book is filled with so many memorable stories — examples of great day-to-day moments of negotiation that will stick in your head for when you need them. (I especially loved the one about the power of the prisoner in solitary confinement.) So go buy and read the book. I’m giving it a 10/10 rating even though the second half of the book loses steam, because the first half is so crucial. Read my notes, or go to the Amazon page for details and reviews. The Listening Book - by W.A. Mathieu Date read: 2021-09-03. How strongly I recommend it: 10/10 Everyone should read this book of little essays about listening. It teaches your ears to pay more attention. It calls your attention to sounds you hadn’t noticed. It’s beautifully written, and makes your life better. I read it twice, 24 years ago, and reading it again this week, it was even better than I remembered. Read my notes, or go to the Amazon page for details and reviews. The Courage to Be Disliked - by Ichiro Kishimi and Fumitake Koga Date read: 2018-07-25. How strongly I recommend it: 10/10 Wow. A profound little philosophy book from Japan, communicating the psychology of Alfred Adler - a rival of Freud. Told as a conversation between an angry student and a patient teacher. A little book so good that I rushed home from other activities to keep reading it, and finished in a day. A surprisingly fresh perspective on how to live. (The “disliked” part is not the point, so don’t let the title distract you.) Read my notes, or go to the Amazon page for details and reviews. Sum: Forty Tales from the Afterlives - by David Eagleman Date read: 2017-09-27. How strongly I recommend it: 10/10 Awesomely creative think-piece. 40 very short fictional stories about what happens when you die. The framework is inspiring for anyone: coming up with 40 different answers to any one question. But they’re also just brilliant ideas and powerful little fables. I just read it a 2nd time and love it even more now. Read my notes, or go to the Amazon page for details and reviews. The Gardener and the Carpenter - by Alison Gopnik Date read: 2016-08-10. How strongly I recommend it: 10/10 Great philosophy of parenting, from a grandmother who is a wise professor of philosophy and a developmental psychologist. Such a beautiful mindset and outlook. Required reading for every parent. Re-read it often as a necessary reminder. Read my notes, or go to the Amazon page for details and reviews. Playful Parenting - by Lawrence Cohen Date read: 2016-06-05. How strongly I recommend it: 10/10 I’ve read many books on parenting, but this one is the best. It’s genius. My top recommendation for everyone with a kid age 1-13. Its point is that children communicate through play. So, to reach them: play! Anything can be done through play: teaching, emotional connection, processing difficult situations, and even discipline can be made playful. Read the whole book instead of just my notes, since my little take-away ideas are just reminders of the spirit of the book. I re-read these notes almost every week to remind me how to be a great parent. My kid is always thankful (communicated through giddy laughter) when I remember and use this approach. Read my notes, or go to the Amazon page for details and reviews. On Writing Well - by William Zinsser Date read: 2015-08-01. How strongly I recommend it: 10/10 Great blunt advice about writing better non-fiction. So inspiring. Read my notes, or go to the Amazon page for details and reviews. The War of Art - by Steven Pressfield Date read: 2012-01-05. How strongly I recommend it: 10/10 Have you experienced a vision of the person you might become, the work you could accomplish, the realized being you were meant to be? Are you a writer who doesn’t write, a painter who doesn’t paint, an entrepreneur who never starts a venture? Then you know what “Resistance” is. This book is about that. Read it. Read my notes, or go to the Amazon page for details and reviews. Stumbling on Happiness - by Daniel Gilbert Date read: 2007-07-11. How strongly I recommend it: 10/10 Not at all new-agey, as the title might suggest. Harvard professor of psychology has studied happiness for years, and shares factual findings that will change the way you look at the world. Read my notes, or go to the Amazon page for details and reviews. E-Myth Revisited - by Michael Gerber Date read: 2004-02-26. How strongly I recommend it: 10/10 Absolutely everyone who is an entrepreneur or wants to be one needs to read this book. I first read it after 10 years of successfully running my company, and was still blown away and totally humbled by its wisdom. Re-reading it today, I'm amazed how my view of business was completely changed by this one little book. See my notes for examples, but definitely read the book itself to get the real impact. Read my notes, or go to the Amazon page for details and reviews. The Invention of the Jewish People - by Shlomo Sand Date read: 2024-10-10. How strongly I recommend it: 9/10 Fascinating subject. Countries are made of stories. Kings didn’t need their subjects to agree, but nations do. So to build a nation, they need to make a story that helps people feel a shared identity, nationalism, and what distinguishes them from their neighbors. Back-creating a history. Founders of Israel did this brilliantly. Read my notes, or go to the Amazon page for details and reviews. Between Us: How Cultures Create Emotions - by Batja Mesquita Date read: 2024-04-05. How strongly I recommend it: 9/10 Cultural psychology, studying emotions through the lens of culture. Your emotions are created by your culture. You should not be too sure that you share the emotional experiences of individuals from other cultures. Culture and emotion make each other up. Great insights! Read my notes, or go to the Amazon page for details and reviews. Arabs - by Tim Mackintosh-Smith Date read: 2024-02-03. How strongly I recommend it: 9/10 3000 years of factual Arab history, and personal insights from this Oxford Brit who lived in Yemen for 37 years, translates classical Arabic, and clearly cares a lot. Huge and thorough but really wonderful for those with the interest. I loved his writing style and poetic asides. Read my notes here for a taste. What a great book. Read my notes, or go to the Amazon page for details and reviews. The Vagabond’s Way - by Rolf Potts Date read: 2023-11-15. How strongly I recommend it: 9/10 Best travel book I’ve ever read! Shook my soul many times. Tiny “daily meditation” format, with lots of quotes from others, but wow what wonderful insights. They make me yearn to travel again. Love love love these ideas and perspectives so much. Read my notes, or go to the Amazon page for details and reviews. Finite and Infinite Games - by James P. Carse Date read: 2023-10-10. How strongly I recommend it: 9/10 So abstract. Maybe the most abstract book you’ll ever read. Compares “finite” games with rules and winners, versus “infinite” games without winners where we can play with the game itself. Is it about a job versus a calling? Religion versus spirituality? A story versus story-telling? Who knows. Thought-provoking if you can apply the metaphor to whatever concerns you. Read my notes, or go to the Amazon page for details and reviews. Israel: A Simple Guide to the Most Misunderstood Country on Earth - by Noa Tishby Date read: 2023-08-20. How strongly I recommend it: 9/10 History of modern country of Israel, written by someone whose grandparents were part of its founding. Unapologetically pro-Israel, but also pro-Palestine and anti-Hamas. Well-written though the occasional unnecessary adjectives (“horrific” / “brave”) remind you that it’s clearly biased and personal. Despite that, it’s really a great history book, riveting throughout. Read my notes, or go to the Amazon page for details and reviews. How Minds Change - by David McRaney Date read: 2023-07-30. How strongly I recommend it: 9/10 The psychology of how and why we believe. How we learn and change. The craft of doubt and persuasion. Insights into the social definition of truth. Epistemology. Certainty is a feeling not based on facts. Well-written with a nice balance of story-telling and deeper dives. Read my notes, or go to the Amazon page for details and reviews. How Religion Evolved - by Robin Dunbar Date read: 2023-07-20. How strongly I recommend it: 9/10 Great anthropology! So many insights into religions, tribes, friendships, organizations, the evolution of minds, superstition, and more. Got me thinking most about friendships. Read my notes, or go to the Amazon page for details and reviews. Nothing & Everything - by Val N. Tine Date read: 2023-06-22. How strongly I recommend it: 9/10 I love this book so much. It's the joy of nihilism. Nothing is true. Everything is permitted. I agree completely. I would give it a 10-out-of-10 rating but I disliked the whole second half of the book. So just read the first half. See my notes here. If you like my book “Useful Not True”, you should read this. Read my notes, or go to the Amazon page for details and reviews. You Look Like a Thing and I Love You - by Janelle Shane Date read: 2023-06-18. How strongly I recommend it: 9/10 A funny book explaining the basics of AI! The subtitle is How Artificial Intelligence Works and Why It's Making the World a Weirder Place. A great introduction to AI. With a cute cartoon mascot. The title is from her training an AI to write romantic greeting cards. Read my notes, or go to the Amazon page for details and reviews. City of Gold: Dubai - by Jim Krane Date read: 2023-06-17. How strongly I recommend it: 9/10 So well-written! Absolutely fascinating history of Dubai. An exciting page-turner. It gave me so much admiration for the city and its visionaries. Read my notes, or go to the Amazon page for details and reviews. The Righteous Mind - by Jonathan Haidt Date read: 2023-05-28. How strongly I recommend it: 9/10 Brilliant insights into human nature. Moral reasoning, inventing victims, emotional reactions, the elephant (emotions) and its rider (explanations). Intuition reacts then logic confabulates a reason. Survival of the fittest applied to groups. Understanding religion and tradition. Great from start to finish. Read my notes, or go to the Amazon page for details and reviews. Write Useful Books - by Rob Fitzpatrick Date read: 2022-09-25. How strongly I recommend it: 9/10 How to write a non-fiction book so useful to people that they recommend it to others. A great step-by-step methodology from someone experienced, who’s done it successfully a few times already. Read my notes, or go to the Amazon page for details and reviews. Wild Problems - by Russ Roberts Date read: 2022-09-12. How strongly I recommend it: 9/10 How to improve your HUGE major life decisions, like whether/who to marry, whether to have kids, where to live, career paths, and such — where you can’t use the usual checklist/data approach. This economist addresses self-identity, “deepest self”, and “something I was meant to do”. You can’t use a pro/con checklist with an item that says “lose respect for myself”. Read my notes, or go to the Amazon page for details and reviews. Relationship Handbook - by George Pransky Date read: 2022-08-16. How strongly I recommend it: 9/10 Best philosophy of love relationships I’ve ever found. Like meditation teaches you that moods pass, this experienced marriage counselor says this applies to relationship communication as well. When angry or insecure, don’t vent, don’t share that. Let the feeling pass. Your anger doesn’t reveal some real truth. Everyone in a romantic relationship should read this. Read my notes, or go to the Amazon page for details and reviews. Awaken the Giant Within - by Tony Robbins Date read: 2022-06-22. How strongly I recommend it: 9/10 This 1992 book changed everything about my life. It’s my Bible. Most of my beliefs come from it. I read it many times at a formative age, but re-read it now 30 years later, taking notes. It’s not a perfect book. It’s too verbose and full of expired American references. But its core messages are the wisest, most effective life philosophy I’ve ever encountered. You choose how you feel. Your emotions come from you, not events or others. Doesn’t matter what’s true, but what empowers you. You adopted beliefs randomly from circumstance, but you can rewire your mind to believe whatever helps you be who you want to be. You have absolute control over your internal world. If you think, “I can’t help the way I feel”, you need this book. Read my notes, or go to the Amazon page for details and reviews. How Buildings Learn - by Stewart Brand Date read: 2021-08-02. How strongly I recommend it: 9/10 I’ve read this book three times since 1999, and gifted it many times to others. It’s changed the way I look at buildings. I read it again now because I’m building a new house. Its main idea is that all buildings are predictions, and all predictions are wrong, so design to make them easy to change. I think of it metaphorically in life: assuming my predictions about what I want will probably be wrong, so make my life easy to change. Get the paper book because the photos are crucial. Read my notes, or go to the Amazon page for details and reviews. Getting Things Done - by David Allen Date read: 2021-04-30. How strongly I recommend it: 9/10 Classic book with near-cult following. How to manage every last itty bitty tiny thing in your life. Keep your inbox empty. Re-read 16 years later. Still great. Read my notes, or go to the Amazon page for details and reviews. Several Short Sentences About Writing - by Verlyn Klinkenborg Date read: 2021-03-28. How strongly I recommend it: 9/10 The 2nd-best and most-radical book about great writing. It tells you to focus entirely on the sentence, an approach that was already my favorite, which is why I bought this book. It recommends you boldly eliminate transitions and conjunctions, split compound sentences, don't save your point for the end, and revise by deleting. This is the first book I've seen printed as one sentence per line — a way I've been writing for many years, and now printed in my book “How to Live”. Read my notes, or go to the Amazon page for details and reviews. Skin in the Game - by Nassim Nichol"
