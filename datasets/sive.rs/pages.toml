title = "How to Live | Derek Sivers"
full_description = '''How to Live 27 conflicting answers and one weird conclusion Not quite non-fiction, not quite self-help. It’s a work of art about conflicting philosophies. Many books believe they know how you should live. But each book disagrees with the next. In “How to Live”, each chapter believes it knows how you should live. And each chapter disagrees with the next. One chapter makes a compelling argument for why you should be completely independent, keeping all options open. The next chapter argues why you should commit to one career, one place, and one person. One chapter persuades you to be fully present, and experience each moment. The next, to delay gratification and invest for the future. Which one is right? Which does the author believe? All of them. It's a philosophy of conflicting philosophies. A very unique and thought-provoking book. Meant for reflection as much as instruction. 113 incredibly succinct pages of profound insights. No philosophers are quoted. No -isms are named. Only actionable directives. The end result feels more like poetry than prose. $15 : ebook, audiobook, and all digital formats forever (epub, mobi, pdf, mp3, html, etc. No DRM.) $19 : paper book includes all digital formats (really just $4 for the paper, so only $4 for each additional copy) Print length: 115 pages Publication date: 2021-05-28 Hardcover ISBN: 978-1-99-115230-5 Paperback ISBN: 978-1-99-115231-2 Audiobook ISBN: 978-1-99-115237-4 Kindle ISBN: 978-1-99-115235-0 Preview the audiobook: Highlights: Editorial reviews: “Always brilliant and succinct, I guarantee you have not read a book like this before. 27 life philosophies on how to live a good life, each feeling profound and incredibly true, yet somehow they all manage to contradict each other… you know, like life. Derek is brilliant. He’s full of pithy wisdom and quirky ideas. I love his brain and love his books. If you want something different, yet still readable, check it out.” — Mark Manson, author, The Subtle Art of Not Giving a F*ck “Derek Sivers is one of my favorite humans, and I call him often for advice. Think of him as a philosopher-king programmer, master teacher, and merry prankster. I might need to do a second volume of my next book 100% dedicated to the knowledge bombs of Derek Sivers. So much good stuff. Hard to cut.” — Tim Ferriss, author, 4-Hour Workweek “One thing ‘How To Live’ doesn’t do is tell you how to live. Yet, after reading it, you might be closer to answering that question for yourself. Half self-help and half art, it beautifully transcends its genre. Seriously one of my favorite books.” — Johannes Wilke “A thrilling, exhilarating, life-affirming, daring, psychedelic roller-coaster ride in a hall of mirrors through the wisdom of the ages. I initially began to highlight some phrases, but I soon realized my entire ebook was yellow. How To Live is the most unique book I’ve ever read and surely one of the best. And if any of this sounds like hyperbole, the book is better than anything I just said.” — Michael Colucci, theater founder and director “Brilliant. Derek’s best book yet, and for me possibly one of the best books ever. Brilliant format, actionable directives, and provides the best possible answer to the loaded question of how to live. Every chapter and every sentence is thought provoking, so much to ruminate on. Pure substance, 0% fluff, which is so rare.” — Diego Montejo “‘How to Live’ is an absolute piece of art. I started hoping that it would teach me the secrets of how to live. But no, in the middle the conflicting messages led me to the real message: that there is no right way to live. There are pieces of life that we gather from everyone, to build ours. I’ve been re-reading almost every single day and the message keeps getting clearer, like a good wine. It is a big inspiration.” — Lucas Vilela, developer “I absolutely LOVE this book. I’ve read thousands of books and I think it’s my favorite. I was planning to highlight, but every sentence is so well-thought-out and important, it would just end up being a yellow book!” — Matt Wickstrom “Magnificently succinct. So elegantly terse that it feels utterly complete. The sheer craftsmanship/sculpting of the language is just breathtaking. I read a LOT, and my mind is bending at the sheer discipline, effort and ruthlessness it must have taken to whittle this down. Rather than lose substance it actually gains body/mass and impact. Un-frickin’-believable. Really outstanding.” — Zubin Pratap, founder “It’s deep, really deep. Just like a Buddhist koan, the more you meditate on it the more you uncover within your own mind, the more you understand. If I said any more I would spoil it. What should be a relatively simple premise made me think more, and deeper, than I have in a while. What more could you want from a book?” — Colin Walker, writer “In ancient Greece, various schools (Stoics, Epicurians, Hedonists, etc.) each offered their own philosophy for how to live your life. This book is the closest thing I’ve found to a modern version of that. Each of the 27 short chapters makes a different argument for the right way to live. The chapters blatantly contradict each other and while your instinct is to ask, “so which one’s right?” the book’s ending gives you a better way to look at it. (I won’t give it away!) I ended up buying the ebook and reading it slowly over the course of several months, taking dozens of pages of notes along the way. I felt like I was trying on each philosophy like an article of clothing to see how it fits. It was a lovely exercise, and one I’d recommend to anyone.” — Bryan Braun, developer “This is the ultimate self-help book. By that, I mean it’s the last one you'll ever need to read. After this, every other equivalent will seem one dimensional by comparison. It destroys an entire genre.” — Rowan Simpson, investor “How To Live is probably THE most remarkable book I’ve owned and read and gifted. Never, never, have I been so engaged and challenged by someone’s writing and perspective on the topic of day to day living. This book is, without doubt, the one that has had the most profound effect on me. EVERYONE, but everyone, should read this. But be prepared for the book to sit close by at all times. It’s vital reading to constantly ensure that we genuinely connect with our true intentions in life. This book is a 21st Century Masterpiece.” — Chris Craker, producer “Reading it. Reflecting on it. Pausing after reading a few sentences. Arguing with it. Agreeing. Re-thinking. Arguing again. It’s the best thing ever written about living. I love every atom of it. A masterpiece. And a truly useful life handbook. It’s the book I will keep revisiting over and over again — the book I will gift to my loved ones.” — Jade Panugan, Craftdeology “The most powerful art piece I read this year. Read it in order, slow and focused. Don’t skip to the conclusion earlier. It will change you. Every time I read it I discover something new.” — Mihai Hly Hlodec, developer “WOW I loved ‘How to Live’! I’ve recommended it to a few of my close friends and I tell them honestly that it’s one of the most unique books I’ve read. It’s not really fiction or nonfiction, it’s a meditation.” — Michael Poyatt, musician Contents: Be independent. Commit. Fill your senses. Do nothing. Think super-long-term. Intertwine with the world. Make memories. Master something. Let randomness rule. Pursue pain. Do whatever you want now. Be a famous pioneer. Chase the future. Value only what has endured. Learn. Follow the great book. Laugh at life. Prepare for the worst. Live for others. Get rich. Reinvent yourself regularly. Love. Create. Don’t die. Make a million mistakes. Make change. Balance everything. Conclusion $15 : ebook, audiobook, and all digital formats forever (epub, mobi, pdf, mp3, html, etc. No DRM.) $19 : paper book includes all digital formats (really just $4 for the paper, so only $4 for each additional copy) Reviews: “How to Live” is an absolute piece of art.I started hoping that it would teach me the secrets of how to live. But no, in the middle the conflicting messages led me to the real message: that there is no right way to live. There are pieces of life that we gather from everyone, to build ours.Some insights are phenomenal — like “marriage is for when you’re not in love” — took me like a punch.It changed my way to think about people, I see as everyone is a chapter and we get better at seeing the chapter about others, therefore understanding them better, not judging and only taking what resonates with us.I've been re-reading almost every single day and the message keeps getting clearer, like a good wine.I'm about to become a dad and I can say that I will be a better guide to my daughter, providing inspiration, not instructions.A lot of hours and a lot of knowledge were put into this book and I'm very grateful to have access to it.Every chapter seems to be written by a different person, a wise grampa, a dad, a psychologist, and a banker.It is a big inspiration. — Lucas Vilela One thing How To Live doesn't do is tell you how to live. Yet, after reading it, you might be closer to answering that question for yourself. Half self-help and half art, it beautifully transcends its genre. Seriously one of my favorite books. — Johannes Wilke How To Live has a provocative subtitle that becomes clear very early. The subtitle is: 27 Conflicting Answers and One Weird ConclusionTurns out, the subtitle is perfect for the content of the book. I loved How To Live, in all its glorious contradictions…and perhaps because of them. After all, those very contradictions make it clear that we are all required to process and embrace conflicting thoughts, feelings, ideas, and goals. Every day. That’s life.On every page, How To Live defies the conventional wisdom that there are no new ideas under the sun. And yet, those new ideas paradoxically illuminate the archetypal wisdom of the collective unconscious. How To Live oxygenates ancient bedrock wisdom and supercharges it with post-modern enlightenment. It is a sui generis prescription for the next evolution of our species in some undiscovered country. I would put How To Live among the list of great books mentioned in the “Follow the Great Book” chapter.How To Live defies description and is impossible to summarize, because the key takeaway is the feeling you get while reading it. Typically, I share what this book or that book said. How To Live is different. I feel compelled to share my experience, my feelings while reading it:It is a thrilling, exhilarating, life-affirming, daring, psychedelic roller-coaster ride in a hall of mirrors through the wisdom of the ages compressed into a laser beam of passion for life and love for humanity.I initially felt I was reading something outside the box, but I soon realized there wasn’t a box within light years.I initially began to highlight some phrases, but I soon realized my entire PDF was yellow.This is not merely a self-improvement book, it is a riveting novel about living life in which the protagonist—yep, that means you—becomes a superhero in a whirlpool of ecstasy about being alive…and getting better every day. How To Live is the most unique book I’ve ever read…and surely one of the best. And if any of this sounds like hyperbole, the book is better than anything I just said.Thank you, Derek. — Michael Colucci This book is infuriating because diametrically opposed ideas make perfect sense and I can pull examples from my own life for both extremes.This book is stimulating in forcing me to recognize the fundamental contradictions in my life and helping to navigate them.This book is difficult to read because it's so concentrated that I need to stop and think about every sentence.This book is practical in helping me fit my own decisions to different approaches to life.This book has no stories.This book helps me to understand and rewrite my own stories.This book is eternal. I'll be re-reading chosen in random chapters to see how they fit my changing moods, circumstances, and decisions. — Victoria Fineberg How to Live is one of those books that feels like a ride in a theme park. The kind that goes through different themes, you have no idea what to expect and even if you do, you leave each theme with a different impression. This is short-lived because immediately after, you have a completely new adventure waiting for you.Each chapter takes you to different corners of your own beliefs or misbeliefs. It challenges us to reshuffle our thoughts to a new conclusion.This is what happened to me with the very first chapter, Be Independent. These two words surfaced certain ideas and feelings but as you go through line by line, your thoughts travel through agreeing that dependency is bad, to being ok with a little dependency, cheering for independency, and then being not so sure of it all. It's not clear what the author actually believes on these topics. The voice in the book is neutral, crisp, and unemotional, because instead of trying to impose a point of view is thinking aloud and trying to make sense of what life means and how to live it best.As the book surveys a wide range of topics that cover all different areas of life, a curation that is carefully handpicked, we land towards the last third of the book, On Love. It's a beautifully written poem to love; not the kind that we read about or see in movies, but the love that is lived and experienced. The love that we grow to love. I felt that every single line was nuanced, perfectly relatable, and written out of first-hand real experience. No sugar-coating, no downplaying, no cliches. This chapter speaks with so much truth and authority and it was the most relatable piece on love I've read in a long while.The book is a collection of 27 independent pieces. And just like hopscotch depending on what you read first your perception on the content might change. It is a book to read, re-read, and experience. One of those living pieces that speak to you in different ways depending on your day.The abrupt conclusion at the end feels less like a plot twist and more like a friendly nudge. The book is meant to be an experiment. It invites you to change your view. The voice is less transparent about what "it" actually thinks. Instead, it wants us to reach to the conclusion ourselves, that there is not one way to live life and it's up to us to make it what we want it to be. How freeing and terrifying that is. Enjoy the ride! — Monica Lim This book elicited many emotions and thoughts for me, which at times seemed contradictory. At times I found it exciting then frustrating, open-minded then dogmatic, obtuse and then insightful. As I continued to read, I realized that I was taking it literally, while (in my opinion) it isn't meant to be taken literally. That allowed me to step back from focusing on the specific "recommendations" (I use quotes here deliberately), and instead think about the juxtaposition of the different--and often contradictory'''
