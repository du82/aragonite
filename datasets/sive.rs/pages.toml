title = "Anything You Want | Derek Sivers"
full_description = "Anything You Want 40 lessons for a new kind of entrepreneur My tales of starting, building, and selling CD Baby, compressed into an entertaining and useful one-hour read. You started a business. But why? Entrepreneurs often lose sight of what matters. Are you helping people? Are they happy? Are you happy? Are you profitable? Isn't that enough? Derek Sivers accidentally started a business by helping musicians sell their music. It became the largest online seller of independent music with over 150,000 musicians and $100M in sales. After ten years, he sold the company for $22 million and gave all the money to charity. In “Anything You Want” he shares 40 powerful lessons, in a book you can read in about an hour. Points include: When you make a company, you make your utopia — your perfect world. Business is not about money. It’s about making dreams come true for others and for yourself. Starting with no money is an advantage. You don’t need money to start helping people. Your business plan is moot. You don’t know what people really want until you launch. Don’t pursue business just for your own gain. Only answer the calls for help. By focusing entirely on thrilling your customers - even at an occasional loss - you ultimately profit more, because of the loyalty and word-of-mouth marketing that comes only when you place your customer’s needs over your own. The book’s most memorable stories are from his horrible mistakes, like why saving ten minutes cost him $3.3 million dollars, and how he was attacked by Steve Jobs. “Anything You Want” was first published by Seth Godin in 2011, then by Penguin/Portfolio in 2015. This third edition for 2022 was improved with eight new chapters. Its surprisingly humanist approach to business, focusing on generosity and happiness more than profits, has helped thousands of entrepreneurs to re-focus on what matters and find their own path to success. $15 : ebook, audiobook, and all digital formats forever (epub, mobi, pdf, mp3, html, etc.) $19 : paper book includes all digital formats (really just $4 for the paper, so only $4 for each additional copy) Print length: 83 pages Publication date: 2022-04-04 Hardcover ISBN: 978-1-99-115238-1 Paperback ISBN: 978-1-99-115239-8 Audiobook ISBN: 978-1-99-115335-7 Kindle ISBN: 978-1-99-115333-3 Listen to the audiobook: Highlights: Editorial Reviews “Anything You Want is a business book like no other. Derek Sivers built a business a different way, a human way. He did it with no investment and a series of apparently crazy principles. And they work. They worked for him and they might work for you. A brilliant book.” — Seth Godin, author of This Is Marketing “I love this book! Derek is the entrepreneur’s entrepreneur. Just as important, perhaps more so: he is a phenomenal teacher. Whether detailing the fascinating rise of CD Baby, explaining catastrophic (but common) founder mistakes, or teaching me about relational databases in two minutes using analogies, he makes the complex simple. Moreover, he makes it all actionable. If you want a true manifesto, a guidebook with clear signposts, and a fun ride you’ll return to again and again, you have it here in this book. I hope you enjoy it as much as I did.” ― Tim Ferriss, author of The 4-Hour Workweek “One of the last music business folk heroes. Derek Sivers is changing the way music is bought and sold.” — Esquire magazine Contents: Ten years of experience in one hour What’s your compass? Just selling my CD Make a dream come true A business model with only two numbers This ain’t no revolution If it’s not a hit, switch No “yes.” Either “HELL YEAH!” or “no.” Just like that, my plan completely changed The advantage of no funding Start now. No funding needed. The co-op business model: share whatever you’ve got Ideas are just a multiplier of execution Formalities play on fear. Bravely refuse. The strength of many little customers Proudly exclude people Why no advertising? And if only 1% of those people… This is just one of many options You don’t need a plan or a vision How do you grade yourself? I miss the mob You can afford to be generous Care about your customers more than about yourself Like you don’t need the money Customer service is everything Every interaction is your moment to shine Lose every fight Don’t punish everyone for one person’s mistake A real person, a lot like you You should feel pain when unclear The most successful email I ever wrote Little things make all the difference Delegate or die: the self-employed trap. It’s OK to be casual Naïve Quitting Don’t add your two cents Prepare to double It’s about being, not having The day Steve Jobs dissed me in a keynote My $3.3M mistake Make it anything you want Trust, but verify Delegate, but don’t abdicate How I knew I was done with my company Why I gave my company to charity Why you need your own company You make your perfect world $15 : ebook, audiobook, and all digital formats forever (epub, mobi, pdf, mp3, html, etc.) $19 : paper book includes all digital formats (really just $4 for the paper, so only $4 for each additional copy)"
