["https://sive.rs/comfort"]
title = "Push, push, push. Expanding your comfort zone. | Derek Sivers"
full_description = "Articles: Push, push, push. Expanding your comfort zone. 2012-08-13 I’m 40 meters underwater. It’s getting cold and dark. It’s only the third dive in my life, but I’m taking the advanced scuba course, and the Caribbean teacher was a little reckless, dashing ahead, leaving me alone. The next day I’m in a government office, answering an interview, raising my right hand, becoming a citizen of Dominica. I’m backstage at the TED Conference, about to go on, but I can’t remember my lines. In the audience are Bill Gates, Al Gore, Peter Gabriel, and a few hundred other intimidating geniuses. Heart pounding so fast and hard, I think I’m going to explode. They call my name. Ack! I still can’t remember my lines! But I hit the stage anyway. I’m alone on a bicycle in a forest in Sweden. I left Stockholm six hours ago, headed south, with only 50 kronor, and I’m getting hungry. I don’t know the way back. I’m in a filthy dorm-room apartment in Guilin, China, studying at the local university. At the local grocery store, I choose from a bin of live frogs. The India Embassy official hands me a pseudo-passport that says I am now officially an Overseas Citizen of India. I’m in the back of a truck in Cambodia, soaking wet, hitching a ride back to Phnom Penh after an all day bike ride. The roads were flooded but we rode our bikes through anyway, Mekong River water waist-high. That week I speak at four conferences in Cambodia, Singapore, Brunei, and Indonesia. By the fourth one, my American accent has started to morph into something kind of Asian. We’re in a hospital in Singapore, having a baby. It’s a boy, which means he’ll serve in the Singapore military in the year 2030. The birth certificate says his race is Eurasian, a word I’ve never heard. I’m on a diplomatic mission in Mongolia with the Singapore Business Federation, talking with the Mongolian government’s head of business development, walking with the next mayor of Ulaanbaatar. I have to laugh at the ridiculousless of this situation. I’m just a musician from California! What the hell am I doing here? But that feeling lets me know I’m on the right track. This is exactly what I wanted. Some people push themselves physically, to see how far they can go. I’ve been doing the same thing culturally, trying to expand my California-boy perspective. I love that when we push push push, we expand our comfort zone. Things that used to feel intimidating now are as comfortable as home. I remember how scary New York City felt when I moved there in 1990, just 20 years old. Two years later it was “my” city — my comfort zone. I’d love to keep repeating that process — to eventually move to Berlin, Rio, Beijing, Lagos, and Mumbai — to feel overwhelmed when I arrive, but stay until it feels like home. After years of stage fright, performing over a thousand shows, I have a strong case of “stage comfort”. Being the lead singer or speaker on stage is now my comfort zone. A lot of my musician friends feel this when playing on stage with their legendary heroes. You push push push, then one day find yourself on the very stage you used to dream about. And it feels so natural — almost relaxing. It’s your new comfort zone. What scares you now? What’s intimidating? What’s the great unknown? I keep using those questions to guide my next move. (click for a picture of me at last week’s diplomatic mission in Mongolia) © 2012 Derek Sivers. Copy & share: sive.rs/comfort"
