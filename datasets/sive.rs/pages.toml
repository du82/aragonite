full_description = "Me in 10 seconds I’ve been a musician, circus performer, entrepreneur, and speaker. I’m a slow thinker, explorer, xenophile, and I love a different point of view. California native, I now live in New Zealand. Me in 10 minutes? See my “about” page. What am I doing now? See my “now” page. Contact me I love meeting new people, and I reply to every email, so say hello. Search this site Go to the search page to search for any word or phrase. section#mybooks figure { clear: both; overflow: auto; margin-bottom: 2em } section#mybooks figure img { float: left; margin-right: 1em; max-width: 50% } section#mybooks figcaption { overflow: auto } section#mybooks figcaption h3 { margin-top: 0 } Books Useful Not True (2024) Doubt everything. No beliefs are true. Adopt what works for you now. How to Live (2021) My masterpiece. Best thing I’ve ever made. My soul in a book. Hell Yeah or No (2020) Useful wisdom. Simple profound mental models to guide your decisions. Your Music and People (2020) Get your work to the world by being creative, considerate, resourceful, and connected. Anything You Want (2011 → 2022) 40 lessons for a new kind of entrepreneur. My tales of starting, building, and selling CD Baby. See the foreign publishers of my translated books. Newest Articles see all Why did I move to New Zealand? How to listen to Ulysses the birth and reverb of friendship a relationship that ended, not failed Have I been married? Why are my best friends Jewish? Popular Articles see all Parenting : Who is it really for? You don’t have to be local First Follower: Leadership Lessons from a Dancing Guy Projects Conversations in… when I travel, I meet with people who have emailed me Books that reference me excerpts from books that have written about me Tech Independence step-by-step instructions to set up your own server and break dependency on the cloud Book Notes detailed notes from the last 360+ books I’ve read Now Now Now a collection of sites that have a “what I’m doing now” page Inchword tools to help people translate books MusicThoughts inspiring quotes about music, translated into Español, Français, Deutsch, Italiano, Português, Русский, العربية, 日本語, and 中文 Tools I use? See my “uses” page. Videos TED (ted.com) 3 short talks from the TED Conference. Anything You Want 7 short animations from my book “Anything You Want”. Uncommon Sense Entrepreneur lessons learned from starting, building, and selling CD Baby. Conference Presentations Talks from other conferences, all subjects. Interviews You can listen to over 80 hours of interviews, where I’m the guest. Each one has an MP3 you can download, or a transcript if you prefer to read. Photos (click for big) AI usage? Everything here is written by me, personally, not an AI."
