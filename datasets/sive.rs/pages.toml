title = "About | Derek Sivers"
full_description = "About: This is just one big page where I can write all about myself, without feeling the need for it to be useful. And some day this site will be all that’s left of me, so I might as well write my own mini autobiography. Last updated: 2024-02-27 Time line for context: 1969: born in Berkeley, California 1971: moved to Chicago 1973: moved to Menlo Park, California 1975: moved to Abingdon, England 1976: moved to Hinsdale, Illinois 1977: started playing piano, viola, and clarinet 1979: got a TRS-80 computer and dove deep into programming in BASIC 1983: started playing guitar, decided I wanted to be a successful musician 1987: moved to Boston for Berklee College of Music 1988: joined a circus, as ringleader/MC musician 1990: graduated college, moved to New York City, got a job at Warner/Chappell Music 1992: quit my job, and toured Japan as Ryuichi Sakamoto’s guitarist 1993: lived alone on the Oregon coast for 7 months, writing and recording music full-time, in a town with a population of 2 1994: played around New York and universities with my band “Hit Me”, and the Professional Pests 1995: started a record label, booking agency, and recording studio 1996: recorded and released my album 1997: started CD Baby 1998: quit the circus, after 10 years and about 1000 shows 1999: started HostBaby 2000: moved to Portland, Oregon 2002: moved to Santa Monica, California 2007: rough year, moved to London, decided to quit my company 2008: moved to San Francisco, sold CD Baby and HostBaby 2009: moved to New York City, started writing and speaking more 2010: spoke at TED three times in a year, moved to Singapore 2011: published “Anything You Want” book about my CD Baby days, started Wood Egg 2012: had a baby 2013: moved to New Zealand to raise him in nature and be a mostly-full-time dad 2014 to 2018: sabbatical, but answered 92,354 emails from 33,776 people 2017: started writing “How to Live” 2019: moved to Oxford, England 2020: moved back to New Zealand, released “Your Music and People” and “Hell Yeah or No” 2021: finished and released the best thing I’ve ever written: “How to Live” 2023-: writing “Useful Not True”, travelling again About me: I’m ambitiously focused on creating More than anything, I want to make lots of stuff. I want to make articles, books, websites, music, companies, systems, apps, and especially new ideas. This shapes most of my life decisions. Saying no to almost everything, so I can have lots of time for making. At the age of 14, I decided I wanted to be a successful musician. Knowing it’s something that millions want, but only one-in-a-million achieve, I knew I’d have to be fiercely focused, persistent, savvy, and work like an Olympic athlete in training. In other words, not casual. I was single-focused obsessed with being a successful musician from age 14 to 29 — crucial years when many of my friends were feeling lost. It had me waking up early to practice, staying up late to write, saying no to all distractions, and reading whatever I could to improve. Then, at age 29, I accidentally started a company, so I was narrow-focused on creating that for 10 years, through the age of 39. I also want to learn lots of stuff, especially different approaches to thinking and living. That’s why I read so much non-fiction, and want to keep moving around the world. I connect with those who stretch, strive, and grow. I can’t relate to those who chill, hang out, watch TV, party, etc. I’ve optimized my life for creating and learning. I’ve cut out most things from my life that most normal people do — (like hanging out or media consumption) — in pursuit of my bigger goal. My life philosophy I’ve always had an uncommon approach to life, mostly shaped by my ambition. But when I read a book on Stoicism I realized I wasn’t so unique. My own self-created philosophy lined up almost exactly with this ancient philosophy. Especially the point about strengthening yourself for a more difficult future. But I’m also very skeptical, and was surprised to find that’s also a philosophy. Meaning: for almost anything on this page, the opposite may also be true. I don’t trust what I tell myself. It’s not a lie — it’s my truth at the time. But an opposite point of view can replace it when I shift my perspective. (I sometimes do this intentionally: do the opposite of my beliefs, just for a different perspective.) So, actually, the book that best contains my life philosophy is “How to Live”. The title is ironic. It doesn’t tell you how to live. Buy one from me and you’ll see. I don’t work for money Some might say I’m retired, because I haven’t earned (hardly) any money since 2008. And in some sense it’s true: I don’t want any more money than I’ve already got. And I don’t want more fame, recognition, or anything external. So in that sense, I’m done. Retired. No longer working for money. Now my ambitions are entirely intrinsic and intellectual. I work as hard as ever, but just for my own learning, creating, and giving. I love to work alone 12+ hours a day I love days where I just work uninterrupted from 6am to 10pm, stopping just for a little exercise. These are my favorite days, and always have been. The more of these 16-hour workdays I have, the happier I am. I use the term “work”, because it’s more understood, but really it’s “me time” — doing what I love. Writing, learning, improving, and creating. Whether it’s creating music, websites, books, or companies, it’s all just creating. The word “workaholic” would apply, except it’s play, not work. It’s completely intrinsic — just following my own interests. I’ve found what I love, and do it as much as possible. I prefer this as a solo pursuit. Being around other people drains me, and I don’t want to compromise this side of my life. It’s a very personal pursuit. It’s not business — it’s more like art. The rewards are internal. Nobody gives a novelist shit for writing alone. But an entrepreneur, programmer, or musician is expected to collaborate. I disagree, for me. I prefer the life of a novelist, whether I’m writing code, music, or systems. Long-term, 12 hours a day works best for me, about 6 days a week. It’s good to break the gravity one day a week, and force myself to do something else. I resist it at first, but appreciate it afterwards. Besides my “work”, I write in my journal up to three hours a day. Reflecting, daydreaming, planning. Asking myself questions, and trying different answers. It feels like all my learning happens here. I’m American I didn’t realize, until I left America at age 40, that in the big spectrum of cultural norms, I’m very stereotypical American. Well, west-coast American. Meaning: very individualist live-to-work nomadic with weak family ties averse to traditions my meals usually last just a few minutes quick to open up emotionally seeking new ideas and people always smiling and finding the bright side ☺ I’m an expat / world citizen The first six years of my life, we moved to a new distant place every year. (It was for my dad’s work.) This felt normal to me, so I remember how sad it was when it stopped. When I was six, we moved to Chicago, and I asked my mom how long we would stay. She said, “Maybe 5-10 years. Maybe the rest of your life.” I started sobbing. That was the saddest thought to me: to stop moving. Still is. I bounced around America for my first 40 years, moving every year or two. Berkeley, Chicago, Boston, New York, Woodstock, Portland, Santa Monica, San Francisco. Then I realized I was like a fly in a jar. It was time to open the lid, and explore the rest of the world. I had spent the first 40 years of my life in America, so I wanted to spend the next 40 out. My original mission was to live all around the world, everywhere for 6-12 months each, for the next 40 years. I wanted to get embedded into each place until it felt like home, then move and do it again. But as soon as it began, I had a kid with someone who didn’t like that plan, so plans changed. Instead, I’ve been spending a few years in places — becoming a legal resident or citizen of Singapore, India, Belgium, New Zealand, England, and Portugal. Each one feels like home, in a way. I’d love to slowly expand my sense of home until it covers the corners of all continents. My kid feels this is normal, as I did. No matter how much I feel “I love it here! I want to stay forever!”, my actions prove that I love moving every year or two. I should never buy a house. I prefer talking on the phone to hanging in person I might sound like a total recluse by now, but I’m not. Most people who meet me think I’m a total extrovert, because I’m a real conversationalist, and absolutely love talking one-on-one. But I have a social window of about 2-3 hours. After that I’m drained, and want to be alone again. Because of this, I’m not into hanging out all day or night, just passing time. Phone calls seem to be more focused. More ideas per hour. A better use of time. You’re undistracted by surroundings, and focus on the quality of the conversation. And when the conversation dwindles, you say goodbye and talk again another day. Also, I love voices. Some people need to look into someone’s eyes to know them well. Not me. For me, it’s all about the voice. Two of my best friends right now, I’ve never seen in-person. One lives in Hong Kong. One lives in Lithuania. We’ve been talking on the phone for years, but never met in-person. We don’t even video-chat. Just voice. That’s all I need. (Because of this, I loved the movie “Her”.) As usual, my kid is the exception to this rule. He and I hang out about 30 hours a week, and will putter in one place for six hours at a time. But that’s a different thing. I’m a minimalist I hate waste. I don’t like the feeling of having more than I need. It feels like clutter. Yes this means I only own one pair of pants, have only two plates in my little apartment, and my computer is a 7-year-old clunky laptop that works fine. But it also applies to tech: removing every line of website code that isn’t necessary, and hand-writing a site with no framework or libraries. And it applies to my writing: spending 12 hours writing an article, saying everything on my mind, then editing it down to the few words that are really needed. I’m tech-independent I got online in 1994, so I watched many companies — companies that people were completely dependent on — go out of business, and watched everyone’s uploaded stuff just disappear. So I don’t trust companies, I avoid the cloud, and run everything myself on my own server. I don’t depend on tech that’s not truly open source and non-profit, because otherwise I don’t trust that their long-term incentives are aligned with mine. My main tools are the Vim text editor, OpenBSD operating system, PostgreSQL database, Ruby language, and Firefox browser. I don’t use any apps on my phone, for this same reason. I don’t want to depend on apps for productivity. Actually I tend to avoid my phone, in general. I just use it for calling friends, or for GPS. No email. No social media. It sits in airplane mode much of the time, then I completely power it off an hour before bed, and turn it back on after I’m done writing in the morning. All of my current creative and learning goals can be achieved with these existing tools, so I avoid that time-sinking habit of looking for new ones. Friends and family I don’t subscribe to that “blood is thicker than water” metaphor. I feel pretty equally connected to everyone. (We’re all cousins, anyway.) I don’t feel more bound or obligated to my immediate family than I do to strangers. In fact, because of my ambitious exploring nature, I’d rather focus on the unknown, and push further out into the world. I make friends easily. They come and go based on life circumstances. Proximity and interests spark friendships, but proximity and interests change. Best friends become old distant friends. New friends become best friends. Some people get married and stop calling. Some people get divorced and re-appear. I still love them all, whether we talk or not. I’m very attached to my kid, but I don’t expect him to be attached to me. I don’t want him to feel more tied to some people than others. I hope he ventures out into the world, makes new bonds, and feels no obligation to me. He doesn’t owe me anything. His life is his own. He didn’t ask to be born, and has no debts. 30+ hours a week with my boy Since he was born, 12 years ago, I’ve spent at least 30 hours per week giving my son my full undivided attention. That means over 19,000 hours so far. No devices. No other people. Just me and him, with him leading the way. My friend pointed out this is very unusual, so I guess it’s a defining thing worth mentioning here. It’s the circumstances of him being an only child, me being a single parent, and technically retired. I’ve never been this close with anyone, or spent this much time with any other person in my life. We talk talk talk so openly about everything, and do everything together. He’s definitely the love of my life. Music I don’t like live music. (I know that is a very despicable opinion.) I love great recordings. Like my preference for one-on-one conversations, my relationship to a piece of music is personal — it’s between me and the music. I don’t want to have a bunch of other people around, and don’t want to be distracted with other things when listening. Ideally, instead of a one-to-one relationship between listener and musician, it would be one-to-zero, where I can’t even know who the musician is. Then I could focus just on the music itself, and not be distracted by any personal information about the musician. Most of my interest in music has been as a music-maker. I’m fluent in that language. I graduated from Berklee College of Music. I know almost too much music theory. I ran a recording studio for 12 years, and produced and engineered hundreds of recordings, often playing all the instruments myself. When listening to a piece of music, I’m usually too analytical. If you play something for me and ask, “What do you think?”, I’m almost always thinking about what I would have done differently if I had written it. I’m not bragging about this. It kinda sucks. It makes me incompatible with most music situations. So what do I like? Innovative arrangements. I love a unique combination and intersection of instruments. New sounds I’ve never heard before. It’s hard to listen to yet another guitar-bass-drums rock band. I need more creativity than that. Song craft. I admire it like a carpenter admires a well-made table. I worked hard for 15 years to write the best songs I could, trying to learn everything about that craft, and so appreciate a good one. Great recordings, for the same reason. After years recording music, I so appreciate something well-produced and well-engineered. New ideas. I’m unimpressed by emoting, because emotions are not impressive. I’ve heard all the regular wailing with the same-old palette of sounds and words. I have to be hit with a new idea, a n"
