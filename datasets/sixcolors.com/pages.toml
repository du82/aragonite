["https://sixcolors.com/post/2020/12/20-macs-for-2020-3-macintosh-128k"]
title = "20 Macs for 2020: #3 – Macintosh 128K – Six Colors"
description = "My friend John Siracusa is disappointed in me because I didn’t put the Macintosh 128K–the original Macintosh–at number one in this list of the 20 most notable Macs of all time. I …"
full_description = "My friend John Siracusa is disappointed in me because I didn’t put the Macintosh 128K—the original Macintosh—at number one in this list of the 20 most notable Macs of all time. I certainly considered it. The original Macintosh changed the computer world forever. Without its presence, this series couldn’t exist. It is a seminal product in the history of technology. Putting it at number one felt a bit obvious, though. And there’s this: While it came first, it had a lot of drawbacks—so many, in fact, that it was revised within a year. It was a remarkable first attempt, but for my money the Mac didn’t really settle down as a platform until the Mac SE arrived in 1987. You think you know the story. (And if you don’t, please read Stephen Levy’s Insanely Great and Andy Hertzfeld’s Revolution in the Valley.) A team of pirates and rebels at Apple came up with something new, something never seen before in the personal-computer world, and it changed everything—eventually. But first, on a day in January in the early 1980s, Apple introduced a revolutionary new computer, driven by an unusual input device called a mouse, and featuring a novel graphical interface. Except this isn’t the year you’re thinking of. It’s January 1983, and the computer is called the Lisa. We never talk about the Lisa, because the Mac went on to spawn an industry that continues to this day. But the Lisa was built by a lot of the same people, and in many ways was more advanced. It came with a hard drive, while the Mac relied only on floppy disks. It had more memory, as well as an advanced operating system featuring protected memory. Unfortunately, the Lisa also cost nearly $10,000—the equivalent of about $26,000 in today’s dollars—and was targeted at a business market that wasn’t interested. Meanwhile, Steve Jobs got kicked off the Lisa team, took over the Mac, and aimed that computer more at the masses. Compared to Lisa, the $2,495 Mac was almost a bargain, but in broader terms it was still pricey1 when introduced a year later."
