["https://sixcolors.com/post/2020/10/20-macs-for-2020-9-imac-g4"]
title = "20 Macs for 2020: #9 – iMac G4 – Six Colors"
description = "The original iMac was defined by the shape of the CRT display at its heart. Fairly early on in the process of designing it, Apple decided to set aside an alternative version that used a laptop-styl…"
full_description = "The original iMac was defined by the shape of the CRT display at its heart. Fairly early on in the process of designing it, Apple decided to set aside an alternative version that used a laptop-style flat-panel display as being too expensive and impractical. But four years later, flat-screen technology was finally ready to reach the mainstream, and the giant tube inside the six million iMacs Apple had sold felt like outmoded technology. The designers behind the original iMac set about reinventing the iMac for an era where the flat screen was at the forefront. What they came up with bore no resemblance to the biggest hit the Mac had ever had. Just sticking a motherboard on the back of a flat screen? That was no good. It would ruin the thinness of the display. Optical drives couldn’t spin fast enough in an upright configuration. It would force all the ports to the sides, rather than hiding them in the back to reduce clutter. No, Apple wasn’t going to take the easy way out. Instead, the iMac G4 was all about that flat screen, floating on air, held aloft by a chromed stainless-steel arm, kept stable by the computer hardware in its white dome of a base. It was beautiful. A triumph of industrial design. A perfect match of form and function. A creation that deserves its place in museums, truly. Steve Jobs certainly thought so. In launching the iMac G4 at Macworld Expo in 2002, he called it “the opportunity of the decade to reshape desktop computers,” with “beauty and grace…that is going to last the next decade.” And that’s the funny thing about the iMac G4. It’s undoubtedly, inarguably one of the best designs that the team of Jobs and Ive ever came up with. But while it wasn’t exactly a flop, it only lasted two years. It was replaced with the real design that would define the iMac for more than a decade—the very design Apple had tried to avoid. The goal of the iMac G4’s design, Jobs said on stage, was to “let each element be true to itself.” That’s a statement that goes way beyond one computer: I believe it to be the core of Jonathan Ive’s design philosophy. Try to find the truth about whatever technological component is required for the product—and then allow it to be the perfect representation of what it is, rather than trying to be something it’s not."
year_published = 2020
year_updated = 2020
