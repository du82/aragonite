["https://sixcolors.com/feed/podcast"]
title = "Six Colors – Apple, technology, and other stuff by Jason Snell & Dan Moren"
description = "Apple, technology, and other stuff by Jason Snell & Dan Moren"
full_description = "With Jason away, Six Colors contributor Joe Rosensteel joins Dan to talk about his exploration of Apple Music alternatives. [More Colors and Backstage members also get an extra 20+ minutes discussing AI apps.] At Apple, we understand that sacrifices must be made in the name of progress. Over the last few weeks, we’ve proved this time and time again. But we also know that maybe you just see us as a faceless corporation, so we want to take this opportunity to share with you some of those sacrifices. Take for example, the new iPhone 16e. We agonized over how to make the best possible iPhone for our price-conscious customers while still maintaining our meager 47 percent profit margins. Did we want to remove MagSafe? Of course not! Would we love to include ProMotion? Absolutely. But we all need to make sacrifices. Just, mostly for you. Not so much us. Even then, it hurt us—physically hurt us—to price the 16e at just $599, but those are the kinds of sacrifices that we make for our customers, who we love and appreciate more than anything in this world, except for money.… It’s the end of an era. Microsoft is shutting down Skype in May and replacing it with the free version of Microsoft Teams for consumers. Existing Skype users will be able to log in to the Microsoft Teams app and have their message history, group chats, and contacts all automatically available without having to create another account, or they can choose to export their data instead. Microsoft is also phasing out support for calling domestic or international numbers. The writing has long been on the wall for Skype, which has struggled to remain relevant in the days of Zoom, Teams, Slack, FaceTime, and a million other VoIP solutions. But there was a time when Skype was a revolution: free, good sounding voice calls across the Internet. Not to mention the ability to make cheap actual phone calls internationally, in a day and age when that was usually ridiculously expensive. In particular, Skype was a boon to the early age of podcasting, especially once Ecamm’s excellent Call Recorder for Skype hit the scene; it made recording your podcast as simple as clicking a button."
year_published = 2025
year_updated = 2025
