["https://sixcolors.com/post/2020/11/20-macs-for-2020-7-ibook"]
title = "20 Macs for 2020: #7 – iBook – Six Colors"
description = "Among the many important elements Steve Jobs brought to Apple’s culture when he returned in the late 90s was a focus on the theater of product announcements. Unlike many of Apple’s comp…"
full_description = "Among the many important elements Steve Jobs brought to Apple’s culture when he returned in the late 90s was a focus on the theater of product announcements. Unlike many of Apple’s competitors, which liked to stake out ground by pre-announcing products and vague product directions without having anything ready to ship, under Jobs Apple became focused on product secrecy, not just for competitive reasons, but because Jobs was so good at the Big Reveal. Yes, there have been precious few Apple product-launch events in the intervening two decades that haven’t been preceded by a bunch of leaks that gave away some, if not all, of the story. And yet Apple has always retained enough mystery to gather the attention of the world’s media for its product unveilings. Still, Apple is not above teasing us all from time to time. Tim Cook famously referred to the wrist as “interesting” a little more than a year before he stood on a stage in Cupertino and unveiled the Apple Watch. But my favorite tease of all time was done by the master, Steve Jobs, and it was done on stage. In explaining his desperately needed simplification of the Mac product line, he drew a box divided in four. The top half were desktop computers, the bottom half were laptops. The left were consumer products, the right were Macs for professionals. In unveiling the Blue and White Power Mac G3, Jobs showed off the box with the iMac in the upper left corner, the new Power Mac in the upper right, and the latest PowerBook G3 in the bottom right. And as for the bottom left… there was nothing there but a promise to address it later that year. How tantalizing! A consumer laptop from Apple… what would that be? The PowerBook line was well established at this point. This tease suggested that Apple was going to make the iMac of laptops, a more affordable and crowd-pleasing device. And that’s exactly what Apple did. It created a brightly colored polycarbonate laptop that was just as unusual as its desktop counterpart. And like the original iMac, the iBook ended up being more of an outlier than a harbinger of the future of its product category."
