["https://sixcolors.com/link/2025/01/25-years-since-the-docks-debut"]
title = "25 years since the Dock’s debut – Six Colors"
description = "Sunday marks the 25th anniversary of the unveiling of Mac OS X, and yeah, I wrote the cover story for Macworld. While I was working on a forthcoming piece celebrating that anniversary, I asked my f…"
full_description = "Sunday marks the 25th anniversary of the unveiling of Mac OS X, and yeah, I wrote the cover story for Macworld. While I was working on a forthcoming piece celebrating that anniversary, I asked my friend James Thomson if he had a good link about his time working on the Dock, which was unveiled as a part of that event. The version [Steve] showed was quite different to what actually ended up shipping, with square boxes around the icons, and an actual “Dock” folder in your user’s home folder that contained aliases to the items stored. I should know – I had spent the previous 18 months or so as the main engineer working away on it. At that very moment, I was watching from a cubicle in Apple Cork, in Ireland. For the second time in my short Apple career, I said a quiet prayer to the gods of demos, hoping that things didn’t break. For context, I was in my twenties at this point and scared witless. The timeline is interesting. James wrote his classic Mac utility DragThing before working at Apple, then was hired by Apple, then ended up working on the Dock, and then left Apple… to resume working on DragThing. Also: James’s story about Apple trying to hide James’s location from Steve Jobs is an all-time classic."
