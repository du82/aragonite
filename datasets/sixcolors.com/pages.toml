["https://sixcolors.com/post/2020/09/20-macs-for-2020-15-daystar-genesis-mp"]
title = "20 Macs For 2020: #15 – DayStar Genesis MP – Six Colors"
description = "DayStar Genesis MP (from Macworld magazine). Today, the chips that drive all of Apple’s products have multiple processing cores, able to do work in parallel. The iPhone 11 has six. My iMac Pr…"
full_description = "Today, the chips that drive all of Apple’s products have multiple processing cores, able to do work in parallel. The iPhone 11 has six. My iMac Pro has eight. But there was a time when the only Mac that supported multiprocessing wasn’t a Mac at all, but an extremely expensive workstation from a small town in northeastern Georgia. Don’t call it a clone. It was much, much more than that. We refer to the era of Apple’s ill-fated attempt at licensing Mac OS to outside hardware companies as “the Mac clone era,” but that word—clone—can give a mistaken impression. If you didn’t live through the mid-90s as a Mac user, you might assume that it was an era in which Apple farmed out its hardware design to a bunch of boring PC cloners who undercut Apple’s Mac prices with a series of underwhelming, mediocre knockoffs. But that’s not quite right, because there was a lot of innovation in the Mac clone world. Power Computing was probably the most well-known Mac clone maker, but the biggest single innovation from all the Mac cloners came from a place that isn’t well known: Flowery Branch, Georgia, a small town northeast of Atlanta that now serves as the summer training-camp home of the Atlanta Falcons. Flowery Branch was the home of DayStar Digital, a company that made upgrades for Macs that were focused on wringing the fastest speeds out of the available hardware. As a result, the company gained a following with people who desperately needed as much power as they could get—pros in the graphics and video industries. When Apple announced that it was going to be licensing Mac OS to other PC makers, DayStar essentially bet its business on converting from being a manufacturer of high-end upgrades for Apple-built Macs to being a manufacturer of high-end Mac clones. DayStar’s clone was the Genesis MP, and the MP stood for multiprocessing. It was the very first Mac to combine the work of multiple processors toward a common goal. The problem: Classic Mac OS wasn’t built for multiple processor cores. The operating system knew about its processor, and it used it, and that was it. But the engineers at DayStar had been working on something novel for its high-end audience."
year_published = 2020
year_updated = 2020
