full_description = "Chance Miller of 9to5Mac reports that in the latest iOS 18.3 betas, Apple has changed how it handles summaries, presumably in response to criticism of inaccurate headline summaries: Additionally, notification summaries have been temporarily disabled entirely for the News & Entertainment category of apps. Turning off summaries for an entire category is a quick fix, though it doesn’t address the larger long-term problem of inaccuracy. Empowering users to turn things off more easily is good, and styling them differently from regular notifications is important. In short, this seems like a good bit of damage control, but there’s much more work to be done here—and these features should all have been in iOS 18 to begin with."
