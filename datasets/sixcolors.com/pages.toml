["https://sixcolors.com/link/2024/12/the-iphone-as-computer-experience"]
title = "The iPhone-as-computer experience – Six Colors"
description = "So many words spent handwringing on whether you can do “real work” on an iPad and yet nobody ever stops to ask the actual question: can you do real work on an iPhone? Nobody except for …"
full_description = "So many words spent handwringing on whether you can do “real work” on an iPad and yet nobody ever stops to ask the actual question: can you do real work on an iPhone? Nobody except for Ars Technica’s Scharon Harding anyway, who’s put together a fun little story about just that. There’s something liberating about traveling without your computer. Your load is lighter, your battery needs are fewer, and you don’t have to risk damaging or losing one of your most important and expensive devices. Besides, most of us are already carrying around a pretty powerful and conveniently compact computer 24/7: our smartphones. This does make me think a bit about the future of something like the Vision Pro. After all, as Harding points out, our iPhones are already tremendously powerful. Something like the Vision Pro’s Mac Virtual Display mode that could offer a larger version of your phone? I dunno, maybe there’s something there. As Jason’s recent laptop conversion makes clear, there is something to be said for having a single device with all your stuff on it."
