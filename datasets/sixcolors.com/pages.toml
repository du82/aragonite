["https://sixcolors.com/post/2025/02/one-year-with-the-vision-pro"]
title = "One year with the Vision Pro – Six Colors"
description = "It’s been a year since the Vision Pro arrived, and its impact on the world has been nearly nonexistent. Is this a surprise? At the time, I wrote that it was “speculative and impractical…"
full_description = "It’s been a year since the Vision Pro arrived, and its impact on the world has been nearly nonexistent. Is this a surprise? At the time, I wrote that it was “speculative and impractical.” That judgment still stands. The Vision Pro is simultaneously one of the most impressive and impractical products Apple has ever developed. A year on, I can’t in good conscience recommend that anyone buy one. It’s a glimpse of a potential future and a developer kit for potential future Apple platforms, but that’s about it. Since the Vision Pro is a product about the future, let’s talk about the future, then. Where is this thing going, if anywhere? But first, it’s worth also considering how we got here. I’ve got plenty of complaints about how Apple has handled the Vision Pro rollout. There was too much hype for a product like this, it hasn’t produced enough immersive video content despite immersive video being the product’s most eye-popping feature, and in general it has failed to attract enough eager developers ready to build the next big thing. However, I have to compliment Apple on doggedly improving the product itself. VisionOS offered a bunch of improvements, including new environments, useful new gestures, and keyboard breakthrough. Apple also added spatial personas, which are perhaps the product’s most astounding feature. Personas were, when the product shipped, kind of a disaster. But after a bunch of upgrades and the introduction of free-floating personas in a 3-D space in FaceTime, they’ve gone from being a joke to being brilliant. Another great feature, Mac Virtual Display, also got a major update with the addition of support for virtual widescreen views that let you use a Mac with an enormous virtual monitor wherever you go. Over the last year, visionOS has felt like a platform that is moving forward… slowly, but still moving. That’s good, because there’s much more to be done. Vision Pro is a tremendous video player. I’ve watched college football games on enormous floating TV screens while in a tiny hotel room. I’ve watched 3-D movies in environments superior to any dimly-lit 3-D screening room. I’ve watched Star Trek episodes playing on a virtual television sitting on a table as if it were a real object. And I’ve watched every single second of immersive video Apple has released."
