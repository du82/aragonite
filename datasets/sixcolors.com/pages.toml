["https://sixcolors.com/post/2020/10/20-macs-for-2020-10-power-computing"]
title = "20 Macs for 2020: #10 — Power Computing – Six Colors"
description = "A recurring theme in this series is that the middle of the 1990s was not Apple’s best era. With Windows 95 on the march and Apple’s market share waning, the company made a series of que…"
full_description = "A recurring theme in this series is that the middle of the 1990s was not Apple’s best era. With Windows 95 on the march and Apple’s market share waning, the company made a series of questionable decisions as it struggled to find a way to stabilize and grow its business. For years, Apple had to justify itself as an outlier in its own industry. Everyone from journalists to investors would look at Apple and compare it to every other PC maker,wondering why it couldn’t just choose a path. Why couldn’t Apple settle on being either Microsoft or Dell? Why couldn’t it become a software company and license its stuff to a collection of hardware makers and let the money roll in? Why couldn’t it focus on making hardware that ran Windows like everyone else? This was a fundamental misunderstanding of what even confused, beleaguered mid-’90s Apple was. Apple always went its own way, building the hardware and software together—and that’s what made it notable. But for far too many people, any company that can’t be easily compared to another company has to be weird or broken or wrong. The saddest thing? At some point in the mid-90s, some powerful people inside Apple seemed to believe this misunderstanding was true, at least a little bit. And that’s how Apple decided to try to save its business by allowing outside companies to make officially licensed Mac clones. It wasn’t Steve Kahng’s fault that Apple was dazed and confused. He was a computer engineer who had made millions in the PC clone business, and he saw an opportunity to apply the hard-earned lessons of a ruthless PC clone maker to a soft market entirely unaccustomed to real competition. Kahng founded Power Computing, the first, and by far the most important, Mac clone maker. He hired a bunch of disaffected Power Mac hardware engineers away from Apple. He set up a factory in Austin, Texas that would use the same build-to-order manufacturing techniques innovated by Power’s Austin neighbor, Dell. And for a brief couple of years in the mid-1990s, Power Computing changed the face of the Mac world."
year_published = 2020
year_updated = 2020
