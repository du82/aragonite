["https://sixcolors.com/post/2020/10/20-macs-for-2020-11-macintosh-portable"]
title = "20 Macs for 2020: #11 – Macintosh Portable – Six Colors"
description = "In the 1980s, using a computer was all about sitting at a desk. Mobility in computing meant putting your files on a disk and taking the disk to a different (but compatible) computer. When I was in …"
full_description = "In the 1980s, using a computer was all about sitting at a desk. Mobility in computing meant putting your files on a disk and taking the disk to a different (but compatible) computer. When I was in college, I bought a big padded case that was designed to fit any classic Mac, so I could carry my computer home with me for holidays. The luxury! It made my 17-pound Mac SE a “portable” computer. There were early portable computers available that ran all sorts of operating systems, but for the Mac, the padded carrying case was as portable as things got until the fall of 1989, when Apple introduced a Mac that was slightly more amenable to be moved from place to place than my Mac SE—the Macintosh Portable. The Macintosh Portable was groundbreaking, while also being a colossal misfire. In many ways, it illustrated all the decisions that a company like Apple had to make in those days when it came to building a portable computer—and many of those decisions were simply the wrong ones. If this seems like criticism that comes from the privileged position of being an observer three decades in the future, I’ll point out that in the Mac Portable’s launch cover story in Macworld, writer Bruce F. Webster summoned up the courage to write that the Mac Portable “certainly isn’t a failure.” Damned with the faintest of praise. From an engineering standpoint, the Mac Portable is fascinating. Apple essentially jammed an entire Mac SE, including pretty much every port—yes, even the enormous floppy and SCSI ports—into a polycarbonate enclosure. There was also a lead-acid battery, a full-sized keyboard, a trackball, and a 640×400 active-matrix LCD screen. As a result, the thing was enormous—15 inches by 15 inches, and four inches thick (tapering to two inches at the narrow end), and weighed 16 pounds. At the press launch event for the product, Apple was careful to refer to it as a portable, not as a laptop—because (truth in advertising) this thing was not going to sit on anyone’s lap. It was immediately dubbed a “luggable” in the press. It was more portable than my SE in its carrying case, but not by much. (It also cost $7,300, or more than $15,000 in today’s dollars!)"
year_published = 2020
year_updated = 2020
