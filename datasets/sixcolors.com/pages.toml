["https://sixcolors.com/post/2020/11/20-macs-for-2020-6-macintosh-se-30"]
title = "20 Macs for 2020: #6 – Macintosh SE/30 – Six Colors"
description = "Photo by Stephen Hackett. What is the best Mac ever? It’s a nigh-unanswerable question, because it begs for qualifiers. The best one ever made up to now? The one that lasted the longest? The …"
full_description = "It’s a nigh-unanswerable question, because it begs for qualifiers. The best one ever made up to now? The one that lasted the longest? The one that towered the furthest above the other Macs that existed when it was released? The one you loved the most? There’s a reason this series ranks its Macs in order of notability, because it’s very hard to pick a “best” Mac that isn’t one of the current generation, thanks to the relentless advance of technology. What would I rather do my work on today, a Mac from 2020 or one from 1990? Nostalgia is great, but I’ll take today’s wireless networking, fast processors, massive storage, and on and on. But if you leave the march of technology out of it and try to equalize the playing field, as you might if you were in the business of comparing baseball players from different eras, you might well end up deciding that the best Mac ever was released in 1989. And while it looked like every other unassuming compact Mac of the era, the Macintosh SE/30 was much more than that. If a Mac is known by the company it keeps, the SE/30 is in the finest company. Three of the most engaged, long-time Mac lovers I know consider the SE/30 to be the finest example of the species. Back in 2009, we put together a special issue of Macworld for the Mac’s 25th anniversary. A part of that package was a segment about the Best Mac Ever, and three of the five people we asked gave the same answer: the Mac SE/30. “The Macintosh SE/30 was the pinnacle of the original Mac hardware design,” wrote John Gruber. “It [was] the first all-in-one Mac where the software could really sing… But like any great Mac, the SE/30 wasn’t a terrific system just when it debuted; it remained eminently usable for years to come.” “The Macintosh SE/30… represent[ed] the apex of the original Macintosh form factor,” wrote John Siracusa. “Though future models with the original upright shape were released, they were all tagged with the derisive moniker ‘Classic.’ The SE/30 bore no such shame. It was and is the undisputed king of the original, iconic Macs and, therefore, of all Macs for all time.”"
