["https://sixcolors.com/link/2024/11/apple-buys-pixelmator"]
title = "Apple buys Pixelmator – Six Colors"
description = "Pixelmator Team, announcing a shocker: Pixelmator has signed an agreement to be acquired by Apple, subject to regulatory approval. There will be no material changes to the Pixelmator Pro, Pixelmato…"
full_description = "Pixelmator has signed an agreement to be acquired by Apple, subject to regulatory approval. There will be no material changes to the Pixelmator Pro, Pixelmator for iOS, and Photomator apps at this time. Stay tuned for exciting updates to come. Pixelmator is great. Photomator is great. This team has been making great image-editing apps for years, and apparently now… they work at Apple? I don’t know what this means for the future of Apple’s apps—though I hope it means Photos is going to get a serious infusion of new talent and functionality! If you’re a Pixelmator Pro or Photomator user, this has to be a bit of a bummer, but there’s some good news: It will probably take a few years for Apple to fully integrate the team into whatever is happening next, and the existing apps will probably still be around until then."
