["https://sixcolors.com/post/2020/08/20-macs-for-2020-19-powerbook-duo"]
title = "20 Macs for 2020: #19 – PowerBook Duo – Six Colors"
description = "Most of Apple’s early laptops were, like today’s MacBooks, complete Macs. The premise was: “Let’s engineer a Mac that’s like the one on your desk, but put it in a single pac…"
full_description = "Most of Apple’s early laptops were, like today’s MacBooks, complete Macs. The premise was: “Let’s engineer a Mac that’s like the one on your desk, but put it in a single package with screen, keyboard, pointing device, and battery.” My first laptop was a PowerBook 160 and it did everything my old Mac SE did (and much, much more). The PowerBook Duo was different. It wasn’t trying to be the Mac on your desk. Introduced in 1992,1 it was the MacBook Air or one-port MacBook of its time—all compromise in a quest to be as thin and light as possible. If you wanted the absolutely smallest, lightest Mac laptop you could find, you got a PowerBook Duo and dealt with the weirdness. How small and how light? By today’s standards the PowerBook Duo was laughably large, but 1992 was a different time. My first PowerBook weighed seven pounds; the first PowerBook Duo weighed four. It was also 1.4 inches thick—more than an inch thinner than my PowerBook. But it wasn’t a complete Mac. It had a shrunken-down keyboard and trackball, and only a single standard port. (Sound familiar, MacBook fans?) There was no support for floppy drives, external hard drives or monitors. For all of that stuff, you needed to connect it to a docking station. Today we don’t flinch at the idea of a computer without a built-in floppy drive, but back in the mid-90s, floppies were the currency of the realm. Even six years later, people screamed bloody murder when the original iMac was released lacking a floppy drive. The Duo? Nope. (If you needed access to floppies, you’d need to buy an external disk drive.) It also didn’t have a headphone jack! This one seems completely bananas now—I can’t imagine working on a laptop out in public without plugging in headphones. But back then, we didn’t really play music on our computers—this was the Walkman era—so Apple got away with shaving that port off. The only standard port on the Duo, hiding behind a little door that you could rotate and turn into a foot to help angle the keyboard perfectly for carpal tunnel syndrome2, was a single Mac serial port. That wasn’t nothing, because you could use it to connect to a modem (if you didn’t pay for the optional internal modem) or a printer or even a very slow local-area network via LocalTalk. But, that was it."
