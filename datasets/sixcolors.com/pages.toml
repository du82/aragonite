["https://sixcolors.com/post/2020/12/20-macs-for-2020-4-macbook-air-second-generation"]
title = "20 Macs for 2020: #4 – MacBook Air (2nd generation) – Six Colors"
description = "Apple’s first attempt at the thin, light laptop of the future happened a couple of years too soon. In early 2008, Apple introduced the original MacBook Air, a deeply compromised product. It w…"
full_description = "In early 2008, Apple introduced the original MacBook Air, a deeply compromised product. It was expensive (the base price was $1799), yet also the slowest Mac, sporting a pokey iPod-class hard drive. (A 64GB solid-state drive, a first on a Mac, was offered as an option—but at $999, it was eye-meltingly expensive.) The Air didn’t have an optical drive or FireWire port or Ethernet jack, just a single USB port hidden behind an awkward drop-down door. Its cooling system was so inadequate that the Air’s dual-core processor would stop working effectively in a warm room.1 Its advantages were clear, though. The MacBook Air weighed only three pounds. That made it a full two pounds (40 percent!) lighter than the next-lightest Mac laptop sold at the time, and more than a pound lighter than any previous Mac laptop. And it was impossibly thin, a 0.16 inch wedge at the front widening out to 0.76 inches in the rear. In other words, the original Air’s heart was in the right place—but the technology just wasn’t good enough yet. Two years later, Apple took another swing, and this time they got it right. The new MacBook Air resided at the bottom of Apple’s laptop price list rather than the top—thereby ensuring it would be the laptop of choice for most people. The new model kept the thinness and lightness of its predecessor, but offered a full array of ports and a perfectly capable Intel processor. And perhaps best of all, it came in two different versions—a 13-inch model that was roughly the size of the original model, and a tiny 11-inch model for people who wanted the absolute smallest Mac laptop in existence. “It’s like nothing we’ve ever created before,”2 Apple CEO Steve Jobs said when introducing the new MacBook Air models. “We think it’s the future of notebooks.” Apple often proclaims that it’s creating the future. Rarely has it been as right. Just before the advent of the MacBook Air, many PC makers were creating Netbooks, a category of ultra-cheap ($200-$300!), ultra-small laptops that ran Windows and were powered by new, low-end Intel processors. Apple execs were constantly asked why the company wasn’t making a Netbook."
year_published = 2020
year_updated = 2020
