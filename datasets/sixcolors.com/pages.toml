["https://sixcolors.com/post/2020/09/20-macs-for-2020-12-twentieth-anniversary-macintosh"]
title = "20 Macs for 2020: #12 – Twentieth Anniversary Macintosh – Six Colors"
description = "Photos by Stephen Hackett. People who came to Apple in the 21st century don’t understand just how different 1990s Apple was. Imagine an Apple that openly shared concept designs from out of it…"
full_description = "People who came to Apple in the 21st century don’t understand just how different 1990s Apple was. Imagine an Apple that openly shared concept designs from out of its product-design lab. Consider an Apple that would hand over pre-production models of new Macs to journalists so far in advance that they hadn’t even been given a final name! Those were things end-stage 90s Apple did, in the fleeting moments before it bought NeXT, Steve Jobs returned to Apple, and everything changed. In many ways, the Twentieth Anniversary Macintosh is the perfect product to describe 90s Apple. It was a concept car that escaped into the real world, a high-priced, limited edition (fewer than 20,000 made!) computer that originally cost $9,000. That’s $14,000 in 2020 dollars. (For the record, at that time you could buy a top-of-the-line Power Mac 9500 for less than $4,500.) Most people working on the product knew it should never have shipped, and tried to do everything in their power to kill it. But Apple CEO Gil Amelio, desperate to leave his mark on the legendary company he led, insisted that the Twentieth Anniversary Macintosh be released. And yet, this product that was arguably an exemplar of the worst of Apple’s mid-1990s excess was also a representative of Apple’s future, just a little bit early. It was an all-in-one computer that leveraged laptop technology. It had an aggressive design, including some novel uses of aluminum. Enthusiastic young Apple designer Jonathan Ive would extoll its virtues in a promotional video. Yes, the Twentieth Anniversary Macintosh was ridiculous. But at the same time, it was a preview of Apple’s decade of resurgence. In late 1996, many months before the Twentieth Anniversary Macintosh would be released, I saw one for the first time. It was unboxed and assembled in the MacUser lab, just around the corner from my cubicle in our cramped new offices in downtown San Francisco. Apple had loaned us a preproduction model to use, write about, photograph, and put on the cover of the magazine. They were still hesitant to commit to a name for the thing, too, and though it was code-named Spartacus, everyone called it “the twentieth anniversary Mac” and apparently that name stuck."
