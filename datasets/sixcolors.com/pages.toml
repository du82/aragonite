["https://sixcolors.com/link/2025/02/dr-drang-solves-my-problem"]
title = "Dr. Drang solves my problem – Six Colors"
description = "I had a problem. I wanted to put a stray E-Ink device, which I had sort of given up on, back into action. It has a color screen, but my attempts to write out color graphics were coming up empty. I …"
full_description = "I had a problem. I wanted to put a stray E-Ink device, which I had sort of given up on, back into action. It has a color screen, but my attempts to write out color graphics were coming up empty. I turned to the Internet’s Dr. Drang for help: A week or so ago, Jason Snell asked if I could help with a problem he was having using the Python Imaging Library (PIL) . He wanted to update his e-ink status board with color images, as he now has the color e-ink display that Dan Moren uses. But he couldn’t get consistent results as he tried to use PIL to change the color of black pixels to different colors in a set of GIF images that were overlaid on his calendar background. Related: Dr. Drang also wrote a piece about my approach to financial charts, based on my interview with Allison Sheridan last week. I enjoyed reading the judgment of someone far more versed in charting than I am."
