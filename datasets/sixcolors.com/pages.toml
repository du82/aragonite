["https://sixcolors.com/post/2021/05/kobo-libra-h2o-liberated-from-amazon"]
title = "Kobo Libra H2O: Liberated from Amazon? – Six Colors"
description = "The Kobo Libra H2O is $100 less than the similar Kindle Oasis. This past year I’ve been spending more time reading books on a Kobo ereader, rather than on my Kindle. The Kobo, a 2016-vintage …"
full_description = "This past year I’ve been spending more time reading books on a Kobo ereader, rather than on my Kindle. The Kobo, a 2016-vintage Aura One, offered a few features that the Kindle didn’t, and I liked the idea of putting a mostly-unloved device to work at something it was good at. At some point I noticed a big gouge in the screen, probably a legacy of a school trip my daughter took a few years ago. I kept staring at it. And that was when—as you do—I popped over to Kobo’s website to see what their current crop of ereaders looked like. It was just idle checking, I swear, and that’s why it took a couple of weeks for me to buy a Kobo Libra H2O. After reading a few books on the Kobo, I’m prepared to declare that I actually prefer the Kobo to the Kindle. And while the Libra H2O is made of less premium materials than my old favorite, the Kindle Oasis, it also costs $100 less. I’ve been using Kindles since the beginning, and the pace of Kindle software innovation is quite slow, though it’s actually shown a bit of improvement over the last few years. Still, how is it possible that the Kindle didn’t let you use the cover of the book you’re currently reading as the screen saver image until April 2021?! The software on the Kobo is, as you might expect, quite similar to that on the Kindle. But in a few areas, it’s clearly superior. Many libraries will let you borrow ebooks using Overdrive, a service that’s a part of the same company that owns Kobo. Unsurprisingly, Kobo connects well with Overdrive, allowing me to browse and check out books directly on the device. If I’ve checked out a book elsewhere—say, via the excellent Libby app, the book will download automatically the next time the device syncs to the network. You can see your Overdrive queue and return books, all from the device itself. While Kindles will work with Overdrive, it’s a circuitous process. You need to check out a book on the web or in Libby, then click to send the book to Amazon.com, then click on Amazon.com to send the book to your Kindle. There’s no Overdrive interface on the Kindle itself. If you check out ebooks from the library, or might consider doing so, the Kobo’s simply better. Using Libby got me using library ebooks once in a while, but using a Kobo has made it a regular habit."
year_published = 2021
year_updated = 2021
