title = "About Jason Snell – Six Colors"
description = "Jason Snell (photo by Ben Rice McCarthy) Jason is the founder and editor of Six Colors, a website about Apple and related technologies. He’s also the founder of The Incomparable, a pop-cultur…"
full_description = "Jason is the founder and editor of Six Colors, a website about Apple and related technologies. He’s also the founder of The Incomparable, a pop-culture podcast network, a columnist at Macworld, the author of Take Control of Photos, and the host of numerous podcasts (see below). He and his family live in Mill Valley, California. Jason was the lead editor for Macworld for more than a decade. During his time there, he covered every major Apple product release, including every version of OS X, the iPod, iPhone, and iPad, and much more. He’s won awards for editorials, interviewed Steve Jobs and numerous other Apple executives, and plenty more. Jason left Macworld’s parent company IDG in 2014 and founded Six Colors. The Incomparable Mothership: A pop-culture podcast Jason hosts with a variety of guest panelists. It’s the flagship of the Incomparable Radio Network, which Jason runs. There are also a few seasonal episodic TV podcasts, covering new Star Trek, Doctor Who, For All Mankind, and a random walk through the original Magnum, p.i.."
