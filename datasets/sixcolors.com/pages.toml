["https://sixcolors.com/link/2025/01/reading-newsletters-via-an-rss-reader-is-still-great"]
title = "Reading newsletters via an RSS reader is still great – Six Colors"
description = "Reading the California Sun in Readkit. About four years ago I wrote about how I caught up with all my email newsletters by routing them into an RSS reader: I love newsletters, but checking email is…"
full_description = "About four years ago I wrote about how I caught up with all my email newsletters by routing them into an RSS reader: I love newsletters, but checking email is a drag—and reading long emails an even bigger one… My newsletter consumption has shot up as a result, and those mornings reading in bed while drinking my tea have become that much more pleasant. I’m happy to report that I still do this—all of my newsletters either get sent directly to Feedbin or are forwarded to Feedbin via an email rule—and reading RSS and newsletters together is still as much of my morning routine as that tea is. A couple of things have changed: First, I’ve been using ReadKit as my RSS reading app of choice for a few years now, and I love it. I keep it parked in Today view —just links from the last day—99% of the time. And last year Feedbin introduced custom newsletter addresses, so now I can create unique email addresses for different newsletters. I am slowly upgrading all of my newsletters to use unique email addresses, which Feedbin lets me turn on and off at will. If you’re frustrated by your newsletters ending up in all sorts of different places, I highly recommend this approach—especially if you also have some favorite sites that offer RSS feeds. [Update: If your RSS provider of choice doesn’t offer an email-to-RSS feature, Reader Chris suggests Kill the Newsletter, which does the same thing and works with any reader that supports Atom feeds.]"
year_published = 2025
year_updated = 2025
