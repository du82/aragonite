["https://sixcolors.com/link/2025/01/golden-apple-awards-celebrate-apps-for-blind-and-visually-impaired-users"]
title = "Golden Apple Awards celebrate apps for blind and visually impaired users – Six Colors"
description = "AppleVis has announced its 13th Golden Apple Awards, recognizing apps and games designed for (or useful to) people who are blind or visually impaired. The awards also honored a developer and includ…"
full_description = "AppleVis has announced its 13th Golden Apple Awards, recognizing apps and games designed for (or useful to) people who are blind or visually impaired. The awards also honored a developer and included a new award for ongoing achievement. Jienfeng Wu took Developer of the Year honors for his resurrection of Soundscape, an app initially developed by Microsoft, and later dropped. Now called VoiceVista, the app allows blind users to understand their surroundings by using sound at various pitches and frequencies. A new award, named for the founder of AppleVis, recognizes a developer who has made ongoing contributions to accessibility. The David Goodwin Award recognizes a developer who has made an outstanding and lasting impact for people who are blind, deaf/blind, or who have low vision over a minimum of the last three years. The inaugural award went to Envision Technologies, whose EnvisionAI uses AI to process visual information and provide it to blind users through an app or via the company’s smart glasses. Honorable mentions for the Goodwin Award went to Weather Gods Ltd (Weather Gods), and Aira Tech Corp (Aira Explorer) Nominees for the Golden Apples were made by a committee of writers and podcasters (disclosure: yours truly included), and accessibility experts. The nominees were then voted on by AppleVis community members."
year_published = 2025
