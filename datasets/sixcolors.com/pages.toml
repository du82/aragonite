["https://sixcolors.com/post/2024/02/apple-vision-pro-review-eyes-on-the-future"]
title = "Apple Vision Pro review: Eyes on the future – Six Colors"
description = "It’s been a very long time since Apple released a product as speculative and impractical as the Vision Pro, its $3499 first-generation “spatial computing” headset. Led by Apple, t…"
full_description = "It’s been a very long time since Apple released a product as speculative and impractical as the Vision Pro, its $3499 first-generation “spatial computing” headset. Led by Apple, today’s technology industry sells billions and billions of dollars worth of technology to a grateful public that uses our smartphones, laptops, and other devices in nearly every aspect of our lives. It wasn’t always this way. When I was a kid, personal computers were just beginning to arrive in homes and schools. As I anticipated the arrival of the Vision Pro, I kept remembering the earliest days of the PC, the days when Apple IIs, TRS-80s, and Commodore PETs ruled. In those days, computer technology wasn’t practical. You’d spend the equivalent of $5000 in today’s money on a computer, bring it home, and be immediately confronted with the big question: “Well, now what?” And yet people bought them, mostly because they got the sense that this was the first step into a new era. Being a Gen X’er means that you were probably told at some point in your young life that “computers are the future”—a meaningless statement that nonetheless turned out to be absolutely true. People didn’t know just what it all meant, but it was new and clearly where the world was headed, and for some adventurous souls (or those who broke down and listened to the begging from their kids), that was all that was required. I first learned what buyer’s remorse felt like about 12 hours after coming home with a new computer. New computers were exciting, but then what? There was very little software available, and the suggestions your computer salesperson would give to adults were impractical things like keeping a recipe database or balancing your checkbook. As for me, I’ll just say there was a lot of 10 PRINT “JASON IS GREAT” 20 GOTO 10 in those days. This moment very much reminds me of that moment. Like those early computers, the Vision Pro is an expensive piece of cutting-edge technology that strongly suggests a possible future. (Is it really the future? That, we don’t know.) There are very few use cases for which I can say that, yes, the Vision Pro is a smart investment at $3499. Getting a taste of the future isn’t cheap, and it’s not especially practical, but it’s such a rare opportunity that it can sometimes be worth it anyway."
year_published = 2024
year_updated = 2024
