title = "About Six Colors – Six Colors"
description = "Six Colors provides daily coverage of Apple, other technology companies, and the intersection of technology and culture. Its founder and editor in chief is Jason Snell. Its East Coast Bureau Chief …"
full_description = "Six Colors provides daily coverage of Apple, other technology companies, and the intersection of technology and culture. Its founder and editor in chief is Jason Snell. Its East Coast Bureau Chief and co-author is Dan Moren. Greg Knauss is the Six Colors system administrator. He does things with servers you wouldn’t believe. Learn more about his many powers at Extra Moon. Christa Mrgan designed the site. Jay Fanelli of Cotton Bureau came up with the “6C” logo during a back-and-forth while we were talking about making a Six Colors t-shirt. Ste Grainer designed our membership pages. Back in the olden days, Apple’s logo featured a rainbow of six colors. Longtime Apple fans and employees used to say that if you cut them, they would “bleed six colors.” Steve Jobs described his return to Apple in this way: I had expected that all of the good people would have left. And I found these miraculous people… I tried to ask this as tactfully as I could, “Why are you still here?” And a lot of them had this little phrase, “Because I bleed in six colors.” Which was the old six-color Apple logo. And that was code for, “because I love what this place stands for.” I’ve been using Apple’s products since I was in elementary school. And it has defined my professional life, too, since I’ve been writing about it for two decades. Apple will always be a part of me. I am one of those people who bleeds in six colors. My career—not just in tech journalism, but also in my side projects focused on entertainment and pop culture—has shown that I believe you can love something while still considering it critically. I may not be Hypercritical, but I believe that we better appreciate the world by analyzing it. Jason Snell doesn’t own any technology-industry stock, including Apple, nor has he ever. He may hold investments in technology companies as a part of his 401(k) retirement fund, but if he does, he actually has no idea what they are or what the mutual funds are doing with them. Jason has never been employed by any technology company in any form."
