["https://sixcolors.com/post/2020/09/20-macs-for-2020-13-mac-iicx-and-iici"]
title = "20 Macs for 2020: #13 – Mac IIcx and IIci – Six Colors"
description = "Thanks to reader David for sending me this IIci earlier this year. The original Macintosh was a squat, cute beige box with a little black-and-white screen and tiny keyboard. For a couple of decades…"
full_description = "The original Macintosh was a squat, cute beige box with a little black-and-white screen and tiny keyboard. For a couple of decades, It was immortalized in the icon, designed by Susan Kare, that appeared when you turned on any Mac. Almost nobody remembers the sequel. But there was one, a computer called the Macintosh II. It was unveiled three years after the original Mac, and it was a traditional PC in a whole lot of ways the original Mac wasn’t. Instead of a cute, compact, and closed single box, it was an enormous slab of a computer that you could open up and stick expansion cards into. You had to attach an external monitor—a color monitor, even. (Although color support came to the Mac early in its lifespan, the Mac was very clearly a system designed for monochrome. If you used a color Mac in the late 80s or early 90s, the appearance of color anywhere tended to come as a shock. Color effects in classic Mac OS felt like they were painted over the original, black-and-white interface. Though color kept seeping in over the years, it wasn’t until the Aqua interface of Mac OS X that it felt like an essential part of the interface.) The Mac II was huge—nearly 19 inches wide, 14.5 inches deep, and 5.5 inches high, weighing in at 24 pounds. And so, in 1989, Apple unveiled a much smaller box (shaving off seven inches of width and more than ten pounds) that still had room for internal expansion and supported external monitors. It was the Mac IIcx. In the fall of that year I started working at my college newspaper, and the paper’s IIcx was the Mac that everyone coveted. Three of us would lay out pages in Aldus PageMaker on Mac SEs outfitted with external full-page portrait displays. It was slow going, and unless you were zoomed in all the way, you couldn’t even read the text of your articles—it was just lines of gray rectangles, in order to speed up the graphics. But the fourth editor, the lucky one who had managed to commandeer the Mac IIcx, got to navigate a two-page display powered by that magical little gray box. You could read the text without zooming in incredibly far. It was also the only Mac hooked up to our printer, so if you wanted to print your page for proofing, you had to load your PageMaker file onto a floppy disk, walk it over to the Mac IIcx1, insert it, and then print. (Within six months I had convinced the paper’s business manager to buy a bunch of adapters and some software so we could put every Mac in the office on a LocalTalk network. Then we could share files and print from any Mac in the office. And play NetTrek, too, sure.)"
