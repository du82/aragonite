["https://sixcolors.com/post/2024/10/submerged-brings-immersive-narrative-to-vision-pro"]
title = "“Submerged” brings immersive narrative to Vision Pro – Six Colors"
description = "I just watched “Submerged,” the new immersive short film directed by “All Quiet on the Western Front” director Edward Berger, on the Apple Vision Pro. It’s the first s…"
full_description = "I just watched “Submerged,” the new immersive short film directed by “All Quiet on the Western Front” director Edward Berger, on the Apple Vision Pro. It’s the first scripted, narrative-driven piece of immersive video on the platform, and after the failure of Apple’s MLS video highlights, I was curious to see what choices Berger would make in using a medium with a very different grammar than traditional filmmaking. By the time I was done with “Submerged,” I was convinced that Berger is a very talented director who knows how to adapt his skills to a different format. There are no quick takes in “Submerged”—I’d wager the average length of a shot is multiple times longer than your regular 2024 blockbuster—because quick takes are disorienting in the immersive format. Instead, Berger allows shots to linger, occasionally toggling between one shot and its reverse angle, which allows a perspective shift without a complete loss of the understanding of the scene’s geography. In a format that can’t really use century-old tricks for focusing a viewer’s attention—like focus shifts and zooms and pans and close-up cuts—Berger tries a few different approaches to focus our attention. I was struck by his use of extreme close-ups, which get us very close to the actors a few times—and make it impossible to look at anything else. There’s also a lot of short depth of field, allowing the out-of-focus background to drop away from our attention—or even to entice us without distracting us. I wondered if “Submerged” would be a series of static shots or if the director would find a way to be a little more dynamic, and Berger seems to have figured out that pushing in or pulling back (on a smooth track) is not as likely to trigger motion sickness as a completely handheld shakycam would. (I will admit to feeling a little bit of vertigo during one shot, which was a very fast-paced pull-back down a corridor.) Still, most of the shots are more static, and seeing actors performing in those shots reminded me much more of a live theater performance than a film. This is not a bad thing, but it sure felt different. It was all on the performer, in those moments, and on me as the viewer to observe their performance. Similarly, the sets in “Submerged” are intricate and beautiful—and because of the immersive nature of the project, I think that was a necessity. It felt like looking at an amusement park experience, with detail in every corner you look."
year_published = 2024
year_updated = 2024
