["https://sixcolors.com/post/2020/12/20-macs-for-2020-1-imac-g3"]
title = "20 Macs for 2020: #1 – iMac G3 – Six Colors"
description = "You can divide Mac history in a bunch of different ways. But perhaps the clearest line of demarcation is the mid-1998 release of the original iMac. The first era of the Mac, begun in 1984, was endi…"
full_description = "You can divide Mac history in a bunch of different ways. But perhaps the clearest line of demarcation is the mid-1998 release of the original iMac. The first era of the Mac, begun in 1984, was ending as Steve Jobs returned to Apple. The Apple of the mid-1990s licensed the Mac to clonemakers and even allowed them to invent key technology. Its product design lab created wild and creative prototypes that occasionally escaped, but most shipping products were so beige they were begging for reinvention. The Mac OS itself was also foundering. It needed to be replaced, and the arrival of Windows 95 had accelerated the Mac’s rapid fade into oblivion. But Apple had failed in multiple attempts to reinvent Mac OS, and ultimately had to turn to outside companies to provide it with an answer. Imagine that sad state of affairs: Apple, a company that prided itself on an expert fusion of hardware and software engineering, was talking to Microsoft about licensing the Windows NT kernel, or to former employee Jean-Louis Gasseé about buying his upstart BeOS, or (in the most unlikely and yet dramatically obvious move) founder Steve Jobs about buying his post-Apple company. Meanwhile, it was being stalked by other tech companies, with a serious report suggesting that Sun Microsystems was close to swallowing Apple whole. In the end, as we all know, Steve Jobs returned to Apple and brought NextStep with him. That operating system became the foundation of the Mac’s renaissance and the basis of the iPhone, as well. But Mac OS X wouldn’t ship for another two years, and it would be a painful years-long transition away from the classic Mac OS. In the meantime Apple needed to start making money again, needed that infusion of cash that would allow Jobs to turn over the Mac product line and let Mac OS X come to fruition. Sure, what it really needed was stability, but a hit wouldn’t hurt. A lot of the technical pieces that would become the iMac G3 were floating around Apple for a while. You don’t invent an entirely new computer in a matter of months—and it was only ten months between Jobs replacing Gil Amelio as Apple CEO and the announcement of the iMac. (You think Steve Jobs didn’t understand the urgency of Apple’s situation?)"
