["https://sixcolors.com/post/2017/04/clips-review-creative-fun-amidst-idiosyncrasies"]
title = "Clips Review: Creative fun amidst idiosyncrasies – Six Colors"
description = "Clips is a clever app, but at times it’s also a bit of a head-scratcher. Apple’s new lightweight video-editing app, which was first announced with little fanfare a few weeks back, actua…"
full_description = "Clips is a clever app, but at times it’s also a bit of a head-scratcher. Apple’s new lightweight video-editing app, which was first announced with little fanfare a few weeks back, actually has some surprising power behind it. The company’s harnessed a lot of the technology it’s developed for video and photo editing over the years, and dropped it into an app that is very direct as to its purpose: create videos to share on social media.1 In and of itself, it’s a well made app that can be pretty fun to use, though it is at times hampered with its somewhat idiosyncratic user interface choices. The big question is whether it can capture users’ valuable time and attention and become something more than a fleeting novelty. Probably the most impressive part of Clips is the number of powerful tools it puts at your disposal. While it doesn’t have the stickers and interactive “lenses” that, say, Snapchat has, it does provide a few filters—of which Comic Book and Ink are probably the most striking; some text overlays, including the current time, date, location, and word and thought bubbles; a handful of animated title cards; and, perhaps the most lauded feature, automatic Live Title captions provided by Apple’s Dictation feature. But the most significant thing is the malleability of all those elements. As in Photos, for example, all of the filters are non-destructive: you can add or remove them at any time, including after you’ve recorded a video.2 If you add a text callout box, you can move, delete, or even edit the text in that box at any point. In fact, all of the text in the overlays and title cards is completely editable, which I didn’t realize until after I’d put a few clips together. You can even add those automatic captions or change their style after you’ve recorded a clip. That’s a heck of a lot of power; it’s one of those features that feels like “shouldn’t it always have been this way?” while triggering a bit of a mind-boggling feeling for those of us who are old enough to remember endless rendering times for changing a letter of text here or there."
