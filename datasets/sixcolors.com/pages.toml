["https://sixcolors.com/dan"]
title = "About Dan Moren – Six Colors"
description = "Dan Moren (photo by Kat Benesh) Dan is the East Coast Bureau Chief of Six Colors, where he covers Apple and other technology companies. You can also read his novels, find him writing the Stay Fooli…"
full_description = "Dan is the East Coast Bureau Chief of Six Colors, where he covers Apple and other technology companies. You can also read his novels, find him writing the Stay Foolish column at Macworld every week, or hear him on a wide variety of podcasts about technology and pop culture. He lives in Somerville, Massachusetts with his family and a lot of books. Prior to Six Colors, Dan was a senior editor at Macworld, a publication he worked at for the better part of a decade. He covered a ton of Apple events, reviewed several versions of iOS, and looked at way too many iPod cases. Since 2014, he’s been a freelance technology journalist, author, and podcaster. You can email him at dan@sixcolors.com, or find him on social media sites like Mastodon, Threads, or Bluesky as @dmoren. In addition to covering tech, Dan’s written several books, including the supernatural detective novel, All Souls Lost, in which spiritual consultant Mike Lucifer returns to his home city of Boston to investigate shady goings-on at a big tech company. Dan’s other novels include the Galactic Cold War series. Set a few hundred years in the future, it follows a team of covert operatives embroiled in espionage and intrigue against the backdrop of a cold war between two galactic superpowers. The Caledonian Gambit: A covert operative and a washed-up pilot team up to track down a mysterious superweapon before it catapults the galaxy into open war. The Bayern Agenda: When the Illyrican Empire takes an interest in the galaxy’s biggest bank, a team of Commonwealth covert operatives tries to stop a cold war from turning hot. The Aleph Extraction: Aboard a notorious criminal syndicate’s luxurious starliner, Simon Kovalic and his team race to steal a mysterious artifact that could shift the balance of war. The Rebound: Dan, Lex Friedman, and John Moltz talk about tech topics (sometimes) with an irreverent bent. Clockwise: A weekly tech roundtable hosted by Dan and Mikah Sargent, where two guests join to discuss four tech topics."
