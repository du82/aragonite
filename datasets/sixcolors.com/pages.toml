["https://sixcolors.com/post/2020/08/20-macs-for-2020-16-blue-and-white-power-mac-g3"]
title = "20 Macs for 2020: #16 – Blue-and-White Power Mac G3 – Six Colors"
description = "I’m not sure there’s a more emblematic example of the transformation of Apple from its mid-90s blahs to the excitement of the Steve Jobs-Jony Ive era than what happened to Apple’s…"
full_description = "I’m not sure there’s a more emblematic example of the transformation of Apple from its mid-90s blahs to the excitement of the Steve Jobs-Jony Ive era than what happened to Apple’s flagship Mac tower, the Power Mac G3. Today we colloquially refer to the original Power Mac G3, introduced in late 1997, as the “beige G3.” It was old-school Apple, a boring beige tower—but with a teeny triangle of green translucent plastic as a hint of what was to come. A little more than a year later, in January 1999, Apple introduced a new Power Mac G3. It had the same name as the tower it replaced, but they looked nothing alike. Bye bye, beige. iMac style design had finally reached the pro desktop. This computer was wrapped in blue and white polycarbonate reminiscent of the iMac, with an enormous “G3” silkscreened on the metal shell beneath. It was the computer defined by its color scheme: The Blue and White Power Mac G3. This computer is notable in so many ways, it’s practically a box of Apple-themed Trivial Pursuit questions. It was the first Mac with FireWire. (“FireWire is going to explode,” Steve Jobs boasted.) The first Power Mac to ditch the longstanding SCSI peripheral interface. The final Mac to ever be released with an ADB port, the old Apple Desktop Bus that was used to connect keyboards and mice for more than a decade on the Mac. These were the days of the awful iMac hockey-puck mouse, so being able to keep using your ADB devices a little while longer was a major selling point. Many people were still hanging on to their old excellent Apple Extended Keyboards, too. (Me? I used an ADB Kensington Turbo Mouse—a gigantic trackball, in beige—for way too long.) As you might expect, Mac users didn’t react well to a Power Mac that ditched some old technologies. “How many high-end users don’t have a significant investment in SCSI peripherals? This makes no sense,” one prepress specialist complained to MacWEEK. “It’s frustrating, being Steve Jobs’ guinea pigs,” another design manager said."
