["https://sixcolors.com/link/2025/02/you-can-finally-merge-apple-accounts"]
title = "You can finally merge Apple Accounts – Six Colors"
description = "I didn’t want this one to pass unremarked upon, especially given that Stephen Hackett recently discussed this issue on Connected: Apple has finally unveiled a tool to merge Apple Accounts: Yo…"
full_description = "I didn’t want this one to pass unremarked upon, especially given that Stephen Hackett recently discussed this issue on Connected: Apple has finally unveiled a tool to merge Apple Accounts: You can choose to migrate apps, music, and other content you’ve purchased from Apple on a secondary Apple Account to a primary Apple Account. The secondary Apple Account might be an account that’s used only for purchases. You’ll need access to the primary email address or phone number and password for both accounts, and neither account should be shared with anyone else. Learn more about how to migrate purchases. There are a surprising number of people out there—Stephen Hackett and John Gruber among them—who ended up collecting a lot of iTunes and App Store purchases under one account, while separately using a different account for everything else. In Stephen’s case, this led to a weird situation where he had issues purchasing extra storage for his iCloud family account. (His solution was to add his older account to his iCloud family.) Presumably in order to protect from shenanigans, Apple says that the transferred-from accounts “can no longer be used for Media & Purchases” after the transfer is complete."
