["https://sixcolors.com/post/2020/08/20-macs-for-2020-18-xserve"]
title = "20 Macs for 2020: #18 – Xserve – Six Colors"
description = "It’s 2020, and Apple is shipping a rack-mountable Mac Pro. It’s the latest chapter in a decades-long flirtation between Apple and the machines that dwell in the server closet. Even thou…"
full_description = "It’s 2020, and Apple is shipping a rack-mountable Mac Pro. It’s the latest chapter in a decades-long flirtation between Apple and the machines that dwell in the server closet. Even though the Mac Pro is rack-mountable, Apple can’t quite see it as a server—you can’t buy it without a mouse and keyboard. Instead, the company seems content to let individual users and dedicated third parties like MacStadium do the work of taking Mac workstations and treating them like they belong in a server rack. This is a subject that’s close to my heart. I’ve only had my name on a single printed book and it was called “Providing Internet Services via the Mac OS,” and told you everything you needed to know to turn a Mac running Classic Mac OS into a server. (Yes, that was a thing that we did back then.) From the mid-90s through the early 2000s, I had a series of Macs running classic Mac OS in my closet that acted as web, email, FTP, and database servers. Here’s to the crazy ones, I guess. Apple has always been a consumer hardware company through and through, not a company that makes servers or speaks to an audience of IT people and network managers. But that hasn’t stopped it from trying. In the ’90s, Apple would rebadge Power Macs as Apple Workgroup Servers, bundling them with extra hardware and software. I started covering Apple in the mid-90s, and let me tell you, that particular version of Apple was extremely weird, as epitomized by the Apple Network Server, code-named Shiner. Shiner was not a Mac. Shiner was a PowerPC-based server that cost between $11,000 and $15,000, and ran IBM’s version of UNIX known as AIX—which you needed to buy separately, for an additional $1,600. It was delayed several times, as its competitive advantage over PCs running Novell NetWare continued to dissipate. Robert Hess of MacWEEK wrote in 1995 that Apple had “missed its window of opportunity.” Reviews were positive, but tempered with a skepticism (later proven right) that Apple would actually commit to making a line of Unix-based servers."
