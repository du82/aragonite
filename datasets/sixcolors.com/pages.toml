["https://sixcolors.com/post/2025/01/indie-ebooks-biggest-obstacles-are-big-publishers-and-big-tech"]
title = "Indie ebooks’ biggest obstacles are big publishers and big tech – Six Colors"
description = "Existing in my weird in-between status as a tech journalist and an author, I was intrigued by the announcement this week from Bookshop.org that it would now be selling ebooks. I like Bookshop.org; …"
full_description = "Existing in my weird in-between status as a tech journalist and an author, I was intrigued by the announcement this week from Bookshop.org that it would now be selling ebooks. I like Bookshop.org; while I haven’t worked with them directly, most of my books are available through them, and I’ve pointed customers to them in the past (as well as their partner Indiebound, who now uses Bookshop.org for sales). That’s because the heart of their mission is working with local independent bookstores; Bookshop.org essentially serves as a portal for online sales for those indie stores, many of whom don’t have the money or infrastructure to create their own online marketplaces. By banding together, the hope is, they can compete with the Goliaths like, well, Amazon. Previously, Bookshop.org focused on physical books. If you wanted to buy the paperback of the latest Galactic Cold War novel1, for example, you could search for it on Bookshop.org, then choose your local bookstore, and the full 30% profit from the sale would go to the store. If you don’t choose a bookstore, Bookshop.org still contributes a (smaller) percentage to a pool divided amongst its indie bookshop partners. Adding ebooks is a smart move in theory. After all, you can’t exactly walk into your local indie bookstore and ask for an ebook. So there are a lot of people who love reading and would no doubt love to support their local indie bookstore instead of a big chain, but just can’t or don’t buy physical books. I’m rooting for Bookshop.org because of all this. Amazon continues to control the bulk of the book market—not a great position for authors, publishers, or readers—roughly in that order, though. However, there are two major technological barriers that I think will hamper broad adoption of Bookshop.org’s ebook sales—and unfortunately, they’re both out of Bookshop’s control. One is due to the current status quo of the publishing industry when it comes to technology, and the other is…drumroll…Apple."
