["https://sixcolors.com/post/2025/01/apples-reports-record-revenue-for-q1-2025"]
title = "Apple’s reports record revenue for Q1 2025 (with charts) – Six Colors"
description = "Apple reported its financial results on Thursday for its first fiscal quarter of 2025, which covers the last three months of 2024. As expected, it was an all-time revenue record at $124.3 billion, …"
full_description = "Apple reported its financial results on Thursday for its first fiscal quarter of 2025, which covers the last three months of 2024. As expected, it was an all-time revenue record at $124.3 billion, up 4% from the year-ago quarter and beating the record set three years ago. Probably most notable is that iPhone revenue was down 1% from the year-ago quarter, which will certainly upset some analysts and investors, given that the iPhone is more than half of Apple’s total revenue. But the Mac jumped 16%, the iPad was up 15%, and services was up 14%. The recently sluggish Wearables, Home, and Accessories category was down 2%. See also: our transcript of Apple’s call with financial analysts. And we went live on YouTube for some chart analysis. If you appreciate articles like this one, support us by becoming a Six Colors subscriber. Subscribers get access to an exclusive podcast, members-only stories, and a special community."
