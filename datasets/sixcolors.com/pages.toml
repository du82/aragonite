["https://sixcolors.com/offsite/2019/07/apple-buys-intels-modem-business-for-1b-heres-why"]
title = "Apple buys Intel’s modem business for $1B – here’s why – Six Colors"
description = "So many stories in the tech world are of the you-couldn’t-predict-it variety, but not the news that Apple is spending $1 billion to buy Intel’s cellular modem business. In the aftermath…"
full_description = "So many stories in the tech world are of the you-couldn’t-predict-it variety, but not the news that Apple is spending $1 billion to buy Intel’s cellular modem business. In the aftermath of Apple abandoning Intel for Qualcomm and Intel announcing its plan to get out of the modem business, this move felt almost inevitable since rumors of a deal first surfaced earlier this week. Apple’s agreement to take on Intel’s intellectual property and 2,200 employees has its roots in the late ’90s and Steve Jobs’ return to Apple. It goes to the core of everything that makes Apple such a formidable force today."
