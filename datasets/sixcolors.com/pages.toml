["https://sixcolors.com/post/2025/02/apple-in-2024-the-six-colors-report-card"]
title = "Apple in 2024: The Six Colors report card – Six Colors"
description = "It’s time for our annual look back on Apple’s performance during the past year, as seen through the eyes of writers, editors, developers, podcasters, and other people who spend an awful lot of time…"
full_description = "It’s time for our annual look back on Apple’s performance during the past year, as seen through the eyes of writers, editors, developers, podcasters, and other people who spend an awful lot of time thinking about Apple. The whole idea here is to get a broad sense of sentiment—the “vibe in the room”—regarding the past year. (And by looking at previous survey results, we can even see how that sentiment has drifted over the course of an entire decade.) This is the tenth year that I’ve presented this survey to my hand-selected group. They were prompted with 14 different Apple-related subjects, and asked to rate them on a scale from 1 (worst) to 5 (best) and optionally provide text commentary per category. As is only fitting for the survery’s tenth year, I’ve made a few adjustments to the questions I asked: I’ve broken the former Software quality category into two separate, connected categories: Apple OS quality and Apple app quality. I felt that the old category tended to cause OS releases to swamp anything else that Apple did during the year in the realm of the many apps it develops alongside its platforms. Finally, the old Environmental/Social impact category has been renamed World impact. In my mind, this category represents an opportunity to judge how Apple’s deeds live up to its philosophical words about making the world a better place. Panelists are free to define it however they’d like… and, believe me, they always do. Since most of the survey categories are the same as in previous years, I was able to track the change in my panel’s consensus opinion. The net changes between 2023 and 2024 are displayed below: Read on for category-by-category grades, trends, and select commentary from the panelists. (You can also read the entirety of panelist commentary—all 32,000 words—if you like.) The panel was very positive about the Mac, with many praising Apple’s continued hardware advancements in the Apple Silicon era, nost notably the M4 chip and the redesigned Mac mini. The move to 16GB of RAM as the new baseline for entry-level models was widely welcomed. However, there are lingering concerns about the lack of updates for high-end machines like the Mac Studio and Mac Pro."
year_published = 2025
year_updated = 2025
