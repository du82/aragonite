["https://sixcolors.com/post/2020/08/20-macs-for-2020-17-powerbook-500-5300"]
title = "20 Macs for 2020: #17 – PowerBook 500 & 5300 – Six Colors"
description = "The star-crossed PowerBook 5300. People who think that the butterfly keyboard is the biggest black eye in the history of Apple’s laptops don’t remember the mid-1990s. Apple’s fina…"
full_description = "People who think that the butterfly keyboard is the biggest black eye in the history of Apple’s laptops don’t remember the mid-1990s. Apple’s final near-death experience and subsequent revival has wiped away a lot of memories of the darkest era in Apple history. Apple introduced the PowerBook 500 series to replace the original PowerBooks, and the original laptops proved to be a tough act to follow. It got worse during the transition to PowerPC processors, when the new PowerBook 5300 arrived—and erased all the goodwill Apple had built up over the years. The PowerBook 500 series was code-named Blackbird, and while they look boxy by today’s standards, they were much curvier than the original PowerBooks, made of lighter-weight plastics and with a redesigned keyboard that added a row of function keys (and a properly placed escape key). They were also, unfortunately, a lot heavier. Most notably, Blackbird replaced the trackball of the original PowerBook line with a completely new sort of device. It’s so easy to point and laugh now, like watching cave people discover fire, but at the time the little spinning trackball of the PowerBook was one of the device’s most iconic features. Explaining what was replacing it took a little bit of effort. It was “what Apple calls a trackpad, a slightly recessed rectangle of black composite material,” according to MacUser. Most MacUser editors who tried it preferred it to the trackball. A rectangular, high-resolution touch pad that controls the pointer. Called Midas TouchPad, it reportedly uses special tracking software to increase the distance the mouse travels across the screen the faster a user’s finger moves on the touch pad’s glass. Sources said Midas takes some getting used to, but it is both more reliable and accurate than a trackball. Blackbird was modular, too: it had two battery bays, but you could remove one of the batteries and instead replace it with other accessories that could be directly plugged into the PowerBook’s processor. The $199 PowerBook Expansion Module let you use PCMCIA expansion cards, which were becoming common on PC laptops. But the module was wonky and Mac support for PC Cards was almost nonexistent and the module didn’t even quite meet the actual PCMCIA standard so some stuff just… didn’t work."
year_published = 2020
year_updated = 2020
