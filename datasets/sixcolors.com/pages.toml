["https://sixcolors.com/post/2024/09/ten"]
title = "Ten. – Six Colors"
description = "Flying home. Taken with an iPhone 6, a few hours before Six Colors launched. Ten years sure seems like a long time. Ten years ago the iPhone got physically big for the first time. (In the ensuing d…"
full_description = "Ten years ago the iPhone got physically big for the first time. (In the ensuing decade, iPhone revenue has doubled.) Ten years ago Apple announced the Apple Watch. After leaving IDG (which, along with two predecessor companies, had offered me continuous employment for more than 20 years), I really should have taken some time off. But in their infinite wisdom, IDG’s bosses decided that the right day to lay off a huge chunk of staff was the day after an Apple event. (Well, technically they wanted to lay people off the day of the event, but I helped convince them that it would be a stupendously terrible idea.) The iPhone event was then, as it is now, the biggest single Apple event of the year. And after it was all over, after we crammed into the Flint Center in Cupertino, and saw Bono touch Tim Cook’s finger as they gifted a U2 album to everyone whether they wanted it or not, and went out into the temporary building where Stephen Fry—Stephen Fry!—was admiring new Apple stuff, I was summoned into a back room and Apple’s PR folks gave me an iPhone 6 briefing and handed me review units under embargo. “So, there’s something I need to tell you,” I said to my Apple PR contact. She knew immediately, and very kindly expressed shock and dismay. I told her we’d work something out and the phones would get reviewed somehow, and in the end I made a deal with the editors back at IDG to write them a review so long as they’d link to my first post at Six Colors, which was a supplement to the review. Apple got the Macworld review they expected, and I got promotion for my new thing. But what it meant was that there was no way I was going to take time off. The truth is, the best time in the Apple sphere to launch anything new is probably iPhone time, because it’s the peak of attention for the entire year. So I took the phones, wrote reviews, recorded the first episode of Upgrade, went off to the XOXO Festival, and flew back home on September 16, 2014 to wish my wife a happy birthday and press the button that put Six Colors, the site I’d been working on in the background for about a month, into the world. (The next day, my past and future collaborator Dan Moren made his first post.)"
