["https://sixcolors.com/link/2024/10/choose-your-coding-font"]
title = "Choose your coding font – Six Colors"
description = "Over on Mastodon, I was embroiled in a whole conversation about fonts we use for writing. I write exclusively using monospaced fonts, and have done so for decades now. Anyway, I shared my favorites…"
full_description = "Over on Mastodon, I was embroiled in a whole conversation about fonts we use for writing. I write exclusively using monospaced fonts, and have done so for decades now. Anyway, I shared my favorites: JetBrains Mono is my current go-to. Craig Hockenberry likes the old-school flavor of IBM Plex Mono. John Gruber uses Consolas in BBEdit’s dark mode, Source Code Pro in MarsEdit’s light mode, and Berkeley Mono in the Terminal. And for the record: I write in light mode in BBEdit, MarsEdit, and (on iPad) 1Writer, but when I’m editing code in BBEdit or Nova I try to do that in dark mode. Similarly, my Terminal is eternally dark, with bright green letters, because I like to pretend I’m a cyberspace cowboy. A couple weeks back on MacBreak Weekly, Leo Laporte pointed me to the very clever site Coding Font, which lets you step through a tournament-style bracket of monospace fonts to find the one you like the best. Unfortunately it’s lacking a bunch of the options mentioned above, but if you’ve ever been curious about switching up your terminal font, it’s worth a go."
