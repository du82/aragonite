["https://sixcolors.com/post/2020/11/20-macs-for-2020-8-power-mac-g4-cube"]
title = "20 Macs for 2020: #8 – Power Mac G4 Cube – Six Colors"
description = "It’s July 18, 2000, and the Macworld staff has assembled in New York City for the next day’s kickoff of Macworld Expo. We’ve got plans for online coverage as Apple makes its produ…"
full_description = "It’s July 18, 2000, and the Macworld staff has assembled in New York City for the next day’s kickoff of Macworld Expo. We’ve got plans for online coverage as Apple makes its product announcements, followed by the team fanning out onto the trade show floor to cover every new product on display, from Apple and all the other companies that attend the show. That evening, our boss, Macworld Editor-in-Chief Andy Gore, calls an emergency meeting in his hotel suite. In his possession is a manila folder full of documents. In fact, it’s the entire Apple press kit for the next day’s keynote. Some source at Apple has handed Macworld the crown jewels—on the condition that we not post anything until the products are announced. It was a sort of unofficial embargo. That’s how I met the Power Mac G4 Cube: a spec sheet and a press release. My colleagues and I spent the next 12 hours writing, so that the very second that Apple announced the Cube (and a new palette of G3 iMacs), we could drop detailed stories on the web, as if we had known what was coming all along. Because we did. Later on keynote day I got a chance to see the Cube in person for the first time. It was just as unusual as I had imagined. For years now I’ve talked about something I call Jobs’s Law, which is that laptops need to get thinner and lighter over time. That’s one design principle that it’s possible to intuit by observing the classic Steve Jobs/Jony Ive design collaboration from a distance. There are others. One of them is what you might call the ideal of the Black Box. Apple’s designs frequently attempt to create small, dense objects that are packed with as much technology as possible—including technology that exists specifically to make that density work. Wrap that small object in a pleasant exterior (or if you’re NeXT, a literal black box) and you’ve created a bit of magic technology. Don’t look inside, or you’ll spoil the surprise. There are plenty of examples of this in Apple history, such as the Apple TV, the Mac mini, the 2013 Mac Pro, and the base of the iMac G4. And you could argue that Apple’s black-box ideals positioned it perfectly for the mobile revolution and devices like the iPod, iPhone, and iPad."
