title = "Watch Duty, the crucial wildfire tracking app – Six Colors"
description = "The Verge’s Abigail Bassett profiles Watch Duty, the remarkable nonprofit app that’s become a must-download utility during the Los Angeles fires: Watch Duty is unique in the tech world …"
full_description = "The Verge’s Abigail Bassett profiles Watch Duty, the remarkable nonprofit app that’s become a must-download utility during the Los Angeles fires: Watch Duty is unique in the tech world in that it doesn’t care about user engagement, time spent, or ad sales. The 501(c)(3) nonprofit behind it only cares about the accuracy of the information it provides and the speed with which the service can deliver that information. The app itself has taken off, rocketing to the top of Apple’s and Google’s app stores. Over 1 million people have downloaded it over the last few days alone. The reasons we’re appreciating Watch Duty right now are tragic, but how great is it that this app exists?"
