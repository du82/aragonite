["https://sixcolors.com/post/2020/09/20-macs-for-2020-14-mac-mini"]
title = "20 Macs for 2020: #14 – Mac mini – Six Colors"
description = "Most evidence suggests that birds, as unlikely as it seems, are the only surviving descendants of the dinosaurs. I’d argue that the Mac has its own analog to this unlikely relationship, a fam…"
full_description = "Most evidence suggests that birds, as unlikely as it seems, are the only surviving descendants of the dinosaurs. I’d argue that the Mac has its own analog to this unlikely relationship, a famous-in-death ancestor who ultimately inspired a common, almost boring descendant that’s with us to this day. Because it’s hard not to look at the Mac mini and consider it the rightful heir of the famous, beloved failure that was the Power Mac G4 Cube. Less than five years after the Cube left the scene, Steve Jobs took another crack at creating a Mac that defied the narrow definitions of the PC industry. The Mac mini fit in 85 cubic inches, at 6.5 inches square and two inches high—one-fifth the height of the Cube. Apple’s hardware designers learned their lesson, however—the Mac mini wasn’t floating in a clear, easy-to-crack outer shell. It was just a solid lump of densely-packed computer. Like the iPod, the Mac mini was a product that was engineered to fit in as small a space as possible. (Constrained, of course, by the physical size of its CD/DVD drive.) If you popped a Mac mini open and looked inside, you could marvel at the internal design. I must’ve opened one up at least 50 times, whether to upgrade hardware or to shoot photos. (The March and April 2005 issues of Macworld both feature multiple photos of a Mac mini I opened using the official method of inserting a putty knife into the bottom edges of the case until all the retaining clips gave way and allowed the top cover to slide off.) With a meager base RAM configuration of 256MB, a lot of people ended up buying third-party RAM, finding or buying a putty knife, and doing their own memory upgrades. The rest of the Mac mini was harder to take apart, since it was a series of layers of intertwined ribbon cables and interconnect boards. If you weren’t careful, you’d fail to reconnect the Bluetooth or Wi-Fi antenna and have to get the putty knife out again. The Mac mini wasn’t just smaller than the G4 Cube, though—it was also cheaper. The Cube’s original base price was $1,799—and people complained mightily that it was overpriced for what it offered in terms of specs and performance. The Mac mini, on the other hand, was offered for a groundbreaking price: $499."
