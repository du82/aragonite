["https://sixcolors.com/link/2024/11/sill-gives-a-nuzzel-vibe-to-mastodon-and-bluesky-links"]
title = "Sill gives a Nuzzel vibe to Mastodon and Bluesky links – Six Colors"
description = "Journalist and developer Tyler Fisher, on his personal blog: Today I’m excited to launch the public beta of Sill, my new social media tool. Sill connects to your Bluesky and Mastodon accounts and a…"
full_description = "Today I’m excited to launch the public beta of Sill, my new social media tool. Sill connects to your Bluesky and Mastodon accounts and aggregates the most popular links in your network. (Yes, a little like Nuzzel.) Nuzzel was an all-time great service, and I still miss it. Sill is meant to be an open-source replacement of a sort, trawling your social-media feeds (it currently supports Mastodon and Bluesky) for popular links and aggregating them in a single place. I’ve been using Sill for a few days, receiving a daily email with highlights from my social feeds at a time of my choosing (sent to my Feedbin account), and it’s extremely promising. Even better, some of the things it’s obviously missing—like support for lists, which are really popping off on my Bluesky feed these days—are in the plan for the future."
