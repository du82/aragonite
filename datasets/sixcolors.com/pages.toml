["https://sixcolors.com/link/2024/11/ipads-being-used-on-college-football-sidelines"]
title = "iPads being used on college football sidelines – Six Colors"
description = "You may remember Aaron Rodgers throwing a Surface on an NFL sideline, but this year football teams in three college conferences are using iPads, as detailed in this feature from Apple Newsroom: “Ha…"
full_description = "You may remember Aaron Rodgers throwing a Surface on an NFL sideline, but this year football teams in three college conferences are using iPads, as detailed in this feature from Apple Newsroom: “Having iPad on the sidelines makes coaching way more effective in-game,” says Mike Saffell, University of California, Berkeley’s tight ends coach. “Live feedback enables the players and coaches to correct quickly. It also makes the game more competitive since both teams are able to fix issues on game day.” Cal’s starting quarterback, Fernando Mendoza, agrees. “Before, there were a lot of things that we couldn’t see until after the game, so it’s great to have that coaching on the sideline. When you’re on the field, football is the same football. But when you’re off the field, now you can go with the coaches, make adjustments, get coached up, and then go back in the game, which has helped young players’ development a lot,” he says. Tim Cook promoted this story on social media by mentioning his Auburn Tigers, but as for me, this is probably just an excuse for me to post pictures and quotes from my beloved Cal Bears. Who, by the way, beat Tim’s team this year. Roll On You Bears!"
