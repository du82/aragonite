["https://sixcolors.com/post/2025/02/some-first-thoughts-about-the-iphone-16e"]
title = "Some first thoughts about the iPhone 16e – Six Colors"
description = "On Wednesday, Apple unveiled the iPhone 16e, the replacement for the iPhone SE. (The iPhone SE and iPhone 14 were removed from the Apple price list.) Here are a few things that strike me about this…"
full_description = "On Wednesday, Apple unveiled the iPhone 16e, the replacement for the iPhone SE. (The iPhone SE and iPhone 14 were removed from the Apple price list.) Here are a few things that strike me about this announcement. So much for a “low-cost” iPhone. At $599, the iPhone 16e is the cheapest new iPhone you can buy, but its starting price is 40 percent higher than the $429 iPhone SE. There’s been a lot of talk about the iPhone SE being an important phone for Apple to use in emerging markets that are much more price sensitive, but after this move, it’s hard to imagine that such a strategy is still in effect. Using older models and this new 16e, Apple now sells iPhones at $599, $699, $799, $899, $999, and $1199. Apple has generally resisted raising its base prices despite the recent bout of inflation. But this indicates that, on its most important product, it is unwilling to sacrifice margin just to offer a bargain-basement phone in emerging markets. I’m also reminded of the classic “good-better-best” marketing strategy. In this case, this might suggest that the iPhone 16e allows Apple to say the iPhone 16 lineup starts at $599… but once they get you in the store, they quickly convince you that the $799 iPhone 16 is a better buy for the money. After all, why buy good when you can buy better? A curious collection of features. Speaking of the differences between the 16e and the standard 16, they’re fascinating. The iPhone 16 is colorful, but the iPhone 16e comes in only black and white. Both have A18 processors that support Apple Intelligence, but the 16e uses a binned version with one fewer GPU. The 16e has an Action Button but doesn’t have Camera Control. It’s got a 48MP camera, but not the additional ultrawide. Portrait mode, Photographic Styles, and the Ceramic Shield glass coating on the front are all a generation older than on the 16. And the display is notched, rather than having a Dynamic Island. Most surprisingly, there’s no support for MagSafe, though there is support for Qi wireless charging."
year_published = 2025
year_updated = 2025
