["https://sixcolors.com/link/2024/12/festivitas-hangs-holiday-lights-on-your-mac"]
title = "Festivitas hangs holiday lights on your Mac – Six Colors"
description = "Developer Simon Støvring (Scriptable, Runestone) has just released a fun new app for the holidays called Festivitas: Festivitas automatically adds festive lights to your menu bar and dock upon laun…"
full_description = "Developer Simon Støvring (Scriptable, Runestone) has just released a fun new app for the holidays called Festivitas: Festivitas automatically adds festive lights to your menu bar and dock upon launch and you can tweak their appearance to match your preferences ✨ That’s it—that’s the app. It hangs holiday lights off your menu bar and on your Dock. (You can choose to have lights in both places or just one.) It’s a well executed app that’s got the flavor of the fun early Mac era. It reminds me of classic Mac apps like Underware and more modern takes like Notchmeister. Perhaps the most impressive thing about Festivitas is that it’s so customizable. For the Menu Bar and the Dock you can choose the size of the lights, the cable thickness, the distance between lights, the color of the lights, and the pattern the lights use to move (or not move, as the case may be). I immediately set mine in the six Apple rainbow colors, for obvious reasons."
