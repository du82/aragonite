["https://sixcolors.com/post/2020/12/20-macs-for-2020-2-the-original-powerbooks"]
title = "20 Macs for 2020: #2 — The original PowerBooks – Six Colors"
description = "In the early days, using a computer was something you did in a space dedicated for that task. You went to the computer lab. You sat at a computer desk. You had to get back to the office to write up…"
full_description = "In the early days, using a computer was something you did in a space dedicated for that task. You went to the computer lab. You sat at a computer desk. You had to get back to the office to write up that memo or story at the computer. Long after the earliest computers filled large rooms, personal computers were large boxes, usually with large displays set atop them, anchored to a desk or a table. It should have been obvious from the very beginning that the final form of the personal computer would need to be portable. Why go to a designated computer location when you could do those things wherever it was convenient? The drive toward portable computers started relatively early in the life of the PC, and by the early 1990s 13 percent of PC sales were laptops. PCs were at the beginning of a long, slow transition that would transform them from devices anchored at desks to ones that could travel wherever the user would take them. In the fall of 1991, that transition was spurred on by a new line of portables from Apple: the PowerBooks. Apple was late to the mobile computing scene in 1989, offering a “luggable”—the Macintosh Portable—just as the makers of PCs were shifting to thinner, lighter models. The Mac Portable was a flop, but from its ashes rose one of Apple’s greatest triumphs ever. Apple faced a challenge with its laptop design that PC makers didn’t. The Mac’s mouse-driven interface required a pointing device, while PCs of this era largely ran DOS and only required a keyboard. For the Mac Portable, Apple decided that the right approach to adding a pointing device was to flip the mouse upside-down and offer a trackball, so a user could push the cursor around on the Mac screen. It worked well, but placing the trackball to the side of the Mac Portable’s full-sized keyboard was one contributor to the device’s enormous size. Apple gave the problem a bit more thought the second time around, and came up with a winner. The trackball was effective and could stay1, but it needed to move somewhere else. The PC laptops of this era kept their footprints small by building around their keyboards; the edges of a laptop keyboard went to the sides, and the bottom of the keyboard was at the front edge."
