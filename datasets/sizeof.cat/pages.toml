["https://sizeof.cat/post/ibook-g4-software"]
title = "My Apple iBook G4 - software - sizeof(cat)"
description = "This is the second part of the 'My Apple iBook G4' series of articles, and it's all about the software you can run on your iBook G4, under Mac OS X 10.5.8 Leopard."
full_description = '''My Apple iBook G4 - softwareJanuary 30, 2025Article3762 words18 mins readApple iBook G4ContentsMacPortsOpenVPNTorEncryptionWeb browsersEmail clientsAperture 21. Download2. Install3. Update4. PatchiMovie ‘091. Download2. Install3. Update4. PatchVirtualPC 7Autodesk Maya 8.5AdobeLazarus IDEPanic appsOmnigroup appsFTP clientsIRCTextMateMAMP and MAMP ProThis is the second part of the “My Apple iBook G4” series of articles, and it’s all about the software you can run on your iBook G4, under Mac OS X 10.5.8 Leopard.I’ll try to link to the original sites or Archive.org copies first, for a bit of safety.If you want to use an external screen, Screen Spanning Doctor by Rute Moeller is a must-have. iBooks can’t display an extended desktop on external screens (only clone screen), this function is locked in the firmware so you (actually your parents) bought the more expensive PowerBooks. But the function is available and your iBook can extend the desktop on an external screen once you use Screen Spanning Doctor to unlock it.I will absolutely no way pay for 20 years-old software. Period.1Password 3.5.9Apple Aperture 2 (with 2.1.4 update)Adium 1.3.10Apple iLife ‘09 (with 9.0.4 update)Apple iWork ‘09 (with 9.0.5 update)Apple Xcode 3.1.4Adobe Creative Suite 4 (CS4)Adobe Lightroom 2.7Adobe Reader 9.5.5Arduino IDE 1.0.4Autodesk Maya 8.5Blender 2.63aCalibre 0.7.28Coda 1.7.5Colloquy 2.3DEVONthink Pro 2.3.5DOSBox 0.74Eclipse IDE JunoFetch 5.6FileMaker Pro 11.0.4.401Filezilla 3.7.3Flux 1.1ForkLift 1.7.8IntelliJ IDEA 8.0iTerm2 2.0KeePassX 0.4.3LibreOffice 5.1.0Little Snitch 2.5.4MacPorts 2.10.5MAMP 1.9.6.1Microsoft Office 2004Microsoft Office 2008Microsoft Virtual PC 7 (with 7.0.3 update)NetBeans IDE 6.8NetNewsWire 3.1.7Pacifist 3.0.10Pixelmator 1.5.1ScummVM 2.9.0SheepShaver 2.4Stone Create 14.4.1TextMate 1.5.10The Unarchiver 3.2Toast Titanium 10.0.9Transmit 4.2Transmission 2.22TrueCrypt 7.1aVLC 2.0.10Wireshark 1.9.2For more software, browse the PowerPC Software Archive, Macintosh Garden, Macintosh Repository, Macintosh Garden Archive and other similar websites.In this section I will show you how to “crack” the trial protection and various other protections, so a basic understanding of UNIX commands should be a must-have. You definitely shouldn’t be copying and pasting commands from the Internet into your Terminal (looking at you, Homebrew and oh-my-zsh), or downloading and running random executables. Keep that in mind.MacPortsA special section for MacPorts, since this is your gateway to all the GNU tools (and not only), including GCC 14. Download the last version of MacPorts for Mac OS 10.5 Leopard, install it, place your iBook somewhere chilly and run in OS X’s Terminal app:$ sudo port install gcc14 This part will take between 2 and 3 days, depending on the speed of your iBook’s CPU. I’m not joking.This is the point where I noticed the power of Noctua’s thermal paste (no, this is not an ad): when I ran the install on the initial hardware (256MB RAM, 30GB HDD, old thermal pads) the temperature was steady at 70 degrees Celsius (for three days) and the fan ran non-stop. After I replaced the old thermal pads with new thermal paste, on the new hardware (1.256GB RAM, 256GB SSD, Noctua paste), the temperature was oscillating between 50 and 55 degrees Celsius, and the fan never started. Nice, eh? Actually, the only time the fan started by now is after Leopard’s install, when Spotlight’s indexing ran amok for a few hours.After gcc 14 is compiled and activated, you can install everything (almost everything) from MacPorts’ archive (tmux, irssi, coreutils, grep, htop, git, gnupg, neofetch, jq, etc). The reason it takes so long is that MacPorts first compiles and installs a gcc 10 bootstrap and uses that to compile gcc 14.OpenVPNYou can use Tunnelblick 3.5.25 to connect to an OpenVPN server, the problem is the built-in OpenVPN version is way too old (it’s 2.3.18, and doesn’t have support for the AES-256-GCM cypher), so you will need to compile a newer version using MacPorts.$ sudo port install openvpn2 This will compile OpenVPN 2.6.12 with OpenSSL 3.4.0 support built in, and install it in /opt/local/sbin/openvpn2. Next, replace the OpenVPN executable inside Tunnelblick.app with the one you just compiled:$ sudo rm /Applications/Tunnelblick.app/Contents/Resources/openvpn/openvpn-2.3.18/openvpn $ sudo cp /opt/local/sbin/openvpn2 /Applications/Tunnelblick.app/Contents/Resources/openvpn/openvpn-2.3.18/openvpn Tunnelblick will complain about package integrity, but now you can import OpenVPN profiles into Tunnelblick and connect to VPN servers as desired.Or, you can skip Tunnelblick and use just its tun/tap kernel extensions. For connecting use openvpn2 from MacPorts.$ sudo kextload /Applications/Tunnelblick.app/Contents/Resources/tun-20111101.kext $ sudo kextload /Applications/Tunnelblick.app/Contents/Resources/tap-20111101.kext $ sudo openvpn2 <PATH_TO_OPENVPN_FILE> If you go this path, copy the Tunnelblick tap and tun kexts to /System/Library/Extensions and upon system reboot you can ditch Tunnelblick and delete it.$ sudo mv /Applications/Tunnelblick.app/Contents/Resources/tun-20111101.kext /System/Library/Extensions/ $ sudo mv /Applications/Tunnelblick.app/Contents/Resources/tap-20111101.kext /System/Library/Extensions/ $ sudo chown -R root:wheel /System/Library/Extensions/tun-20111101.kext $ sudo chown -R root:wheel /System/Library/Extensions/tap-20111101.kext You only need to do this once and the kexts will be automatically loaded on system restart. You can also load just the kext that’s needed for your network configuration (usually tun).TorYou can build and install latest version of tor from MacPorts, it will work just fine. If you want a GUI for tor, use Vidalia from the same MacPorts, but be aware of the fact that it’s unmaintained.EncryptionDon’t forget to turn on Filevault 1 encryption, it only encrypts your user directory but it’s better than nothing.TrueCrypt 7.1a work great for encrypting volumes, and if it’s paired with VeraCrypt 1.25.9 you can use both to encrypt and decrypt volumes between the old and a newer OS (a volume created by TrueCrypt 7.1a can be opened and written with VeraCrypt 1.25.9, and vice versa). VeraCrypt 1.25.9 is the last version that supports TrueCrypt.Web browsersAnother special section, because this is what interests most people: browsing the web. And the situation is grim.Aquafox is the most modern version, based on Firefox 128.6 ESR, last version is 2.1. You will want uBlock Origin version 1.16.4.30 or uMatrix 1.4.4.TenFourFox is no longer updated, last version is FPR32.5 based on Firefox 78 ESR.Safari 5.0.6, Apple’s official web browser for Leopard, useless on anything modern. No modern cryptography.OmniWeb 5.11.2, beautiful but useless on anything modern.Old web browsers: Amaya 11.3.1, Camino 2.1.2, Firefox 3.6.28, Netscape Navigator 9.0.0.6, NetSurf 2.7, Opera 10.63, SeaMonkey 2.26, but as you can probably guess they are mostly unusable on the modern Internet.You can’t browse the “new” GitHub with them, but you can download releases from any GitHub project if you change the URL. Let’s say you want to download Aquafox, but the release page will never work in a web browser on your iBook. This page does though, so al you need to do is add expanded_assets/ after releases/ but before version number. Basicallyhttps://github.com/BlackBirdLC/Aquafox/releases/v2.1 becomeshttps://github.com/BlackBirdLC/Aquafox/releases/expanded_assets/v2.1 This works for any GitHub project that has releases.If you want to add more Search providers, you can manually add the OpenSearch endpoint (by pasting the line below into Aquafox’s console):Yandex: window.external.AddSearchProvider('https://yandex.com/opensearch.xml');Brave Search: window.external.AddSearchProvider('https://cdn.search.brave.com/serp/v2/_app/immutable/assets/opensearch.BqerUIGT.xml');Startpage: window.external.AddSearchProvider('https://www.startpage.com/sp/cdn/opensearch/en/opensearch.xml');Ecosia: window.external.AddSearchProvider('https://www.ecosia.org/static/opensearch.xml');Baidu: window.external.AddSearchProvider('https://www.baidu.com/content-search.xml');Sogou: window.external.AddSearchProvider('https://www.sogou.com/content-search.xml');Another useful addon is UserAgent Switcher by Chris Pederick, together with my useragents list. Overbite brings back Gopher support to Firefox.Email clientsYou know I said the web browser situation is grim? The email client situation is worse, you can choose between Apple Mail, Mozilla Thunderbird (3.1.20) and TenFourBird (38.9.0).From Macports you can build and install Sylpheed too, and that will be your best email client unless you’re a fan of mutt. TenFourBird has support for Enigmail too, so you can send encrypted emails. Sylpheed can do that too by default.Aperture 2Aperture version 2 has some requirements that cannot be fulfilled by an iBook G4 (higher CPU freq, specific GPU), so in order to install and run it you need to alter those.1. DownloadDownload a DVD image and convert it to a read/write DVD image using Disk Utility (so you can modify files on the image).2. InstallRemoving the requirements checks is done inside the Aperture.mpkg/Contents/Aperture.dist file on the read/write image after mounting it in Finder, either by editing it inside a text editor and removing all lines between 79 and 124, including, or by overwriting the file with this one that already has the requirements check removed. For full transparency, the lines to be removed are this ones: if ( !isIntel() ) { // Allow install on all Intel machines // Allow install if G5 1.6 GHz or better // Allow install if PowerBook G4 1.25 GHz or better if (!checkCPUFrequency(1590000000)) { var model = system.sysctl('hw.model'); var regexp = /PowerBook/; if (!checkCPUFrequency(1240000000)) { my.result.message = system.localizedString('ERROR_INCOMPATCPU'); my.result.type = 'Fatal'; return false; } if (!regexp.test(model)) { my.result.message = system.localizedString('ERROR_INCOMPATCPU'); my.result.type = 'Fatal'; return false; } } // All intel machines have sufficient graphics cards if(0 != system.runOnce("DetectGraphicsCard")) { my.result.message = system.localizedString('ERROR_INCOMPATVIDEO'); my.result.type = 'Fatal'; return false; } var badCards = new Array("GeForce FX Go5200"); var agpDevices = system.ioregistry.matchingClass("IOAGPDevice"); for(i=0;i&lt;agpDevices.length;i++) { for(j=0;j&lt;badCards.length;j++) { if ( badCards[j] == agpDevices[i].model ) { my.result.message = system.localizedString('ERROR_INCOMPATVIDEO'); my.result.type = 'Fatal'; return false; } } } } Once the file is edited and saved, or replaced, you can start the install by doubleclicking on the Aperture.mpkg file.3. UpdateDon’t start Aperture when the install is finished, download and install the 2.1.4 update.4. PatchIf you run Aperture now it will still bitch that your system is below the minimum requirements, as there is one requirements check inside the application executable too, and we need to remove that. The entry point is the function performRequirementsCheck and that needs to be patch out.Function that needs to be patchedOpen Terminal.app or iTerm2 and enter the commands below:$ cd /Applications/Aperture.app/Contents/MacOS $ cp Aperture Aperture_backup $ echo 006f9A80: 70 65 72 66 6F 72 6D 4C 69 63 65 6E 73 65 43 68 | xxd -r - Aperture $ echo 006f9A90: 65 63 6B 00 00 00 00 00 | xxd -r - Aperture performRequirementsCheck patched with a call to performLicenseCheckThe MD5 hash of the original file (Aperture_backup) should be 943c7b93890f132a125475d67719e6d3, and the MD5 of the modified file should be 24fdb347f1a801f88c980746531fe66c. If it’s not, you did something wrong. Keep in mind that those changes are for version 2.1.4 (which you already installed, didn’t you?), and not the original Aperture 2 (for that version, the offset is 006D21B0 but you’re on your own). The Aperture_backup file is just a backup in case something goes wrong, you can copy it back over the original file:$ cd /Applications/Aperture.app/Contents/MacOS $ cp Aperture_backup Aperture Aperture If everything goes well and you can run Aperture without complaining about system requirements, you can delete the backup file:$ rm -f /Applications/Aperture.app/Contents/MacOS/Aperture_backup Checking the MD5 of a file can be done using the md5 utility:$ cd /Applications/Aperture.app/Contents/MacOS $ md5 -q Aperture_backup 943c7b93890f132a125475d67719e6d3 $ md5 -q Aperture 24fdb347f1a801f88c980746531fe66c If you want to do everything in one go, here is a small script by yours trully that checks the MD5 of the original executable, and if it’s correct it patches the Aperture executable. But you should be aware that downloading and executing files off the Internet is not a really smart idea.#!/bin/bash cd "/Applications/Aperture.app/Contents/MacOS" || exit md5 -q Aperture | grep -i "943c7b93890f132a125475d67719e6d3" || exit cp Aperture Aperture_backup echo 006f9A80: 70 65 72 66 6F 72 6D 4C 69 63 65 6E 73 65 43 68 | xxd -r - Aperture echo 006f9A90: 65 63 6B 00 00 00 00 00 | xxd -r - Aperture iMovie ‘09If you try to install iLife ‘09, iMovie will be unavailable to install because it “requires” a G5 CPU, which the iBook doesn’t have. But we can patch that requirement the same way we did with Aperture 2 before, first we need to install iMovie from iLife ‘09, then install the 8.0.6 iMovie update, and in the end patch the iMovie executable.Make sure you don’t skip any steps: download iLife, install (whole iLife suite or just iMovie), update iMovie, patch iMovie.1. DownloadNothing special here.2. InstallThere are two ways to install iMovie: one with iLife by patching the iLife '09.mpkg/Contents/Distribution.dist file and another by installing iMovie manually.First method is to open the iLife DVD image and convert it to a read/write DVD image using Disk Utility (so you can modify files on the image). Mount the new image, open iLife '09.mpkg/Contents/Distribution.dist in a text editor, find line 538 and change it from: <choice id="iMovie" title="TITLE_IMOVIE" description='DESCRIPTION_IMOVIE' enabled="canHasiMovie() &amp;&amp; shouldAllowiMovieChoice()" start_selected="canHasiMovie() &amp;&amp; shouldAllowiMovieChoice()"> to <choice id="iMovie" title="TITLE_IMOVIE" description='DESCRIPTION_IMOVIE' enabled="true" start_selected="true"> Save the file and install iLife normally, ignore the warning that iMovie won’t be installed, and make sure iMovie is selected (it should be).The second way to install just iMovie is by mounting the iLife DVD and copying the file iLife '09.mpkg/Contents/Installers/iMovie.pkg somewhere (for example your Downloads directory). Right click the iMovie.pkg file you just copied and click on “Show Package Contents”. Navigate inside the Contents directory and open iMovie.dist file in a text editor. Replace everything inside the installationCheck() function (lines 17-23 included) with a single return true line: funct'''
