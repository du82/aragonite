title = "Series - sizeof(cat)"
description = "This is the third part of the “My Apple iBook G4” series of articles, and it’s all about the video games you can run on your iBook G4, under Mac OS X 10.5.8 Leopard.Well, it’s pretty simple: if you’re into retro games, think 1995-2009, there is a big chance that it will work on an Apple iBook G4 laptop. Its GPU is an ATI Radeon Mobility 9200 @ 200MHz with 32 MB of SDRAM @ 230MHz and the CPU is a PowerPC G4 @ 1.2 GHz, with 64KB L1 and 512KB L2 cache, 133MHz FSB. And 1.256 GB RAM @ 266MHz (not one thousand GB, 1GB + 256MB).I tested some of my favorite games and it seems as if everything works just great with very good performance, but then again I don’t really play games newer than 2010, Oxygen Not Included is the only new video game I currently play."
full_description = 'My Apple iBook G4 - gamesFebruary 15, 2025Article739 words4 mins readApple iBook G4This is the third part of the “My Apple iBook G4” series of articles, and it’s all about the video games you can run on your iBook G4, under Mac OS X 10.5.8 Leopard.Well, it’s pretty simple: if you’re into retro games, think 1995-2009, there is a big chance that it will work on an Apple iBook G4 laptop. Its GPU is an ATI Radeon Mobility 9200 @ 200MHz with 32 MB of SDRAM @ 230MHz and the CPU is a PowerPC G4 @ 1.2 GHz, with 64KB L1 and 512KB L2 cache, 133MHz FSB. And 1.256 GB RAM @ 266MHz (not one thousand GB, 1GB + 256MB).I tested some of my favorite games and it seems as if everything works just great with very good performance, but then again I don’t really play games newer than 2010, Oxygen Not Included is the only new video game I currently play.Read more ... My Apple iBook G4 - softwareJanuary 30, 2025Article3762 words18 mins readApple iBook G4This is the second part of the “My Apple iBook G4” series of articles, and it’s all about the software you can run on your iBook G4, under Mac OS X 10.5.8 Leopard.I’ll try to link to the original sites or Archive.org copies first, for a bit of safety.If you want to use an external screen, Screen Spanning Doctor by Rute Moeller is a must-have. iBooks can’t display an extended desktop on external screens (only clone screen), this function is locked in the firmware so you (actually your parents) bought the more expensive PowerBooks. But the function is available and your iBook can extend the desktop on an external screen once you use Screen Spanning Doctor to unlock it.Read more ... My Apple iBook G4January 20, 2025Article3163 words15 mins readApple iBook G4Made from ultratough polycarbonate plastic — the same high-grade material used in bulletproof glass — the iBook’s sleek white case resists impact. While that measure alone might have allowed iBook to comfortably survive everyday use and abuse, Apple engineers took the idea of protecting your investment quite seriously. Inside, a sturdy magnesium frame provides superior strength, while reducing the weight of the iBook G4 to well below that of other full-featured PC notebooks. Rubber mounted for added bump tolerance, the iBook’s hard disk drive lets you store all of your digital goodies and still enjoy peace of mind. What’s more, the iBook has no I/O doors or protruding elements — and no optical drive tray, either — to break or snap off when tucked into a backpack or briefcase. Apple websiteMy machine is an Apple iBook 12" 1.2GHz/256/30G/Combo/APX (at least that’s what the sticker behind the keyboard is trying to tell me), which means it has a 1.2GHz PowerPC CPU that cannot be replaced (unless you replace the whole mainboard, or logic board as Apple likes to call it), 256MB of RAM onboard, a 30G HDD, a Combo CD reader/DVD reader/CD writer unit (no DVD writer, I think that’s called a SuperDrive and it used to cost extra) and an Airport Extreme WiFi card. Basically, except the aforementioned SuperDrive and the Bluetooth module, everything is perfect (the last and best iBook G4 had a 1.42GHz CPU and 512MB of RAM built-in, but the difference is small and I’m not too fussed about it).Read more ...'
