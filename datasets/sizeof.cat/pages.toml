full_description = "ExploreWhen you are inquisitive, Jane, you always make me smile. You open your eyes like an eager bird, and make every now and then a restless movement, as if answers in speech did not flow fast enough for you, and you wanted to read the tablet of one’s heart. Charlotte Brontë, Jane EyreThe point of this page is to ease up the discovery of the several “hidden” pages on this website. There may or may not be secret pages, secret images and various easter eggs.At a quick glanceThe website is quite big and has a lot of content to discover, though you might be interested in several things I have written.You want to know who I am, what I do, how you can contact me, what software and hardware I am using, which are my favorite movies or my favorite color?I have a huge links page that I maintain, you might want to take a look at it.Maybe you have a Nokia Booklet 3G and you want to make a retrobook out of it? Or a Nokia 808 PureView? As you can see, I’m a big Nokia fan.Are you playing World of Warcraft and getting bored of it? Try an XP-locked character. Though I stopped playing WoW a while ago, the journey still remains.Are you into cyberpunk? Me too! Are you interested in the largest cyberpunk media repository?Bored? How about a game of Pome? Maybe Cupcakes? Or Snek? Sapper?This website is OpenSearch-enabled, and if you right click the web browser address bar you can choose the Add “sizeof(cat)” option to add sizeof.cat into your normal browser search options.SpecialRandom - navigate to a random page from this website.Archive - all website posts, including bookmarks, guest posts and reviews, excluding notes.Notes - minimal notes, back-links, photos, music, videos, random thoughts; basically micro-blogging.Updated - last 30 recently updated articles and/or pages on this website.Statistics - detailed website statistics.Ideas - a one-page compilation of all notes tagged with #ideas.Snippets - various code snippets.Privacy policy - as the name says, it’s the privacy policy page.Uses - stuff I am using.Feedlist - an outline of the blogs that I follow, as an .opml file.FeedsAtomRSSOPMLSitemapNotes RSSListsInternet Radio - list of Internet Radio websites.Cyberpunk - huge list of Cyberpunk resources.Films - a list of my favorite films.Books - a list of recommended books (not maintained for now).Games - same thing as the movie list but for video games.Links - huge list of links from various domains.Data leaks - magnets for miscellaneous data leaks.The Library - an archive of various files, mostly linked from my articles and mirrored here for posterity.Tags#4chan21 #albums33 #analysis31 #android93 #apple30 #cve64 #cyberpunk121 #demo25 #dfir21 #dystopia173 #exploits20 #france23 #funny128 #games102 #general19 #guides27 #hacking19 #hardware184 #hoshi13 #html525 #humanism14 #ideas521 #idiots13 #internet21 #ios21 #italy16 #japan22 #javascript44 #kernel13 #leaks48 #linux30 #lists24 #macos20 #malware84 #microsoft23 #midjourney29 #mobile39 #movies327 #mozilla14 #music156 #network14 #nokia17 #opinions264 #osint21 #pentesting59 #personal100 #philosophy30 #pornlitics32 #privacy43 #projects91 #quotes40 #radio14 #rce18 #retro148 #reversing18 #russia70 #security304 #sickness24 #source16 #tips42 #tizen13 #tools137 #tor13 #videos85 #visualisation25 #vulnerability107 #website55 #windows72 #wow32Article seriesAges of Man - 5 articlesApple iBook G4 - 3 articlesHoshi operating system - 2 articlesNokia Booklet 3G - 7 articlesTizen operating system - 10 articlesauthor sizeof(cat)permalink https://sizeof.cat/sitemap/section Pagecreated July 14, 2019updated February 26, 2025words 570tags #website, #sitemapThis page is also translated into the following languages:Català ➝ Mapa"
