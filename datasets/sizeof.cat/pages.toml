full_description = '''Sobre miTaula de contingutsPer què sizeof(cat)?Clau PGPComunicacióIdentitatsDonacióPromocionalASCIIImatgesMolt pocs som el que semblam. Agatha Christie, The Man in the MistNo dubteu a navegar per aquí i tindreu una bona idea de què es tracta. Escric sobre seguretat, privacitat, vulnerabilitats i explotacions, computació retro, música, diversos llenguatges de programació, els meus projectes i coses generals que em creuen. Assegureu-vos que utilitzeu el correu xifrat en enviar-me una informació sensible.No sóc un pirata, sinó un corsari.Llegiu la política de privadesa, subscriviu-te al canal RSS 2.0 o al canal Atom.Aquí hi ha alguns gossos que corren.Per què sizeof(cat)?Perquè s’ha pres +++ATH0.Clau PGPDescarregueu la clau pública.Empremta digital 4ED4 000C 9038 2C23 D417 8CB9 EC61 D381 F273 5495.La clau hauria de caducar-se June 2, 2027.ComunicacióSi us plau, envieu-me correus xifrats si és possible (vegeu la meva clau pública més amunt). Cada tros de trànsit xifrat augmenta el soroll de fons xifrat i, per tant, fa més difícil distingir entre trànsit important i sense importància.Si és possible, un de:$ gpg --keyserver hkps://keys.openpgp.org --recv-key 4ED4000C90382C23D4178CB9EC61D381F2735495 $ curl -sf https://sizeof.cat/sizeofcat.asc | gpg --import I envieu-me un correu electrònic.M’encanta especialment els correus electrònics que demanen si sóc realment un gat (no, no sóc un gat, però si és important que parleu amb un gat estic segur que podem treballar alguna cosa, la meva adreça Monero està a continuació) o si puc descarregar aquest fitxer PDF d’aquest lloc web totalment legítim (segur, per què no, què podria anar malament)./* Let's do this in JavaScript because everybody knows JS. */ const domain = "riseup.net"; let email = "sizeofcat" + '@' + domain; /* Yes, that's my email address. */ Potser t’agrada més la consola.$ printf "%s@%s.%s\n" sizeofcat riseup net No és un programador JavaScript i / o no es pot entendre? Clica aquí.IdentitatsLa meva llista d’identitats en línia.sizeof.catsizeofaex6zgovemvemn2g3jfmgujievmxxxbcgnbrnmgcjcjpiiprqd.onion a Tor.Email me for my Ricochet handle.GoT (not Game of Thrones, Gopher over Tor)DonacióEt sents ric avui? Arreglem-ho.Monero és una criptomoneda de codi obert que se centra en la privadesa, la descentralització i l’escalabilitat. A diferència de moltes criptomonedes que són derivades de Bitcoin, Monero es basa en el protocol CryptoNote i posseeix diferències algorítmiques significatives relatives a l’ofuscació de la cadena de blocs.83Z6NrUiydMUU7LRy7T78Wb8ZVMhVKsT3A65XwZQwB7chQFziDJiup7Uk2ukqcZ8fp69KtXvZkteGNZ9YdRbqVFHRwoJNjZPromocionalASCII o8o .o88o. .o . o. `"' 888 `" .8' .o8 `8. .oooo.o oooo oooooooo .ooooo. .ooooo. o888oo .8' .ooooo. .oooo. .o888oo `8. d88( "8 `888 d'""7d8P d88' `88b d88' `88b 888 88 d88' `"Y8 `P )88b 888 88 `"Y88b. 888 .d8P' 888ooo888 888 888 888 88 888 .oP"888 888 88 o. )88b 888 .d8P' .P 888 .o 888 888 888 `8. 888 .o8 d8( 888 888 . .8' 8""888P' o888o d8888888P `Y8bod8P' `Y8bod8P' o888o `8. `Y8bod8P' `Y888""8o "888" .8' `" "' ImatgesTotes les imatges es comprimeixen amb una qualitat sense pèrdues amb les metadades eliminades, no les modifiqueu si les col·loqueu al vostre lloc web. Hauríeu de baixar-los i col·locar-los al vostre servidor (per motius de seguretat) en comptes d’enllaçar-los, però utilitzar-los com creieu adequat.GIF (240x60) amb fons blanc/negre<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-black.gif" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-white.gif" alt="sizeof(cat)" /></a>JPEG (240x60) amb fons blanc/negre<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-black.jpg" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-white.jpg" alt="sizeof(cat)" /></a>JPEG (88x31) am