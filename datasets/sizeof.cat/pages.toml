description = "Feel free to browse around and you'll have a pretty good idea of what this is about. I write about security, privacy, vulnerabilities and exploits, retro computing, music, various programming languages, projects and general stuff that crosses my mind."
full_description = '''AboutContentsWhy sizeof(cat)?Why not typeof(cat)?Why not typedef?PGP keyCommunicationWhere?DonationsWebsiteTesticlemonialsPromotionalASCIIImagesVery few of us are what we seem. Agatha Christie, The Man in the MistFeel free to browse around and you’ll have a pretty good idea of what this is about. I write about security, privacy, vulnerabilities and exploits, retro computing, music, various programming languages, personal projects and general stuff that crosses my mind. Cinephiliac. I use older (retro? vintage?) computer hardware and I am a firm believer in computer minimalism.I never owned a desktop computer.Make sure you use encrypted email when sending me any sensitive info.My website is a playground for ideas, a place to aggregate personal logs, a compendium of knowledge and useful resources, and a fun place of the Internet. sizeof.cat is my own digital garden, it grows as I grow, it will die with me, and only stands for what I stand for.My website is not part of the IndieWeb or Indie Web or SmallWeb or SmolWeb or WhateverWeb or FuckOffWeb, it stands alone like a shining beacon of light and normality in a swamp of mental sickness and dreadful soul deformities.You can check out the privacy policy and/or subscribe to the RSS 2.0 or Atom feeds.Why sizeof(cat)?Because +++ATH0 was taken.Why not typeof(cat)?Because.Why not typedef?Grrr.PGP keyDownload my public key.The key’s fingerprint is 4ED4 000C 9038 2C23 D417 8CB9 EC61 D381 F273 5495.The key should expire on June 2, 2027.CommunicationPlease send me encrypted mails if possible (see my public key above). Every bit of encrypted traffic increases the encrypted background noise and thus makes it harder to distinguish between important and unimportant traffic.If possible, one of:$ gpg --keyserver hkps://keys.openpgp.org --recv-key 4ED4000C90382C23D4178CB9EC61D381F2735495 $ curl -sf https://sizeof.cat/sizeofcat.asc | gpg --import And send me an email.I especially love the emails asking if I am really a cat (no, i’m not a cat but if it’s important for you to talk to one I’m pretty sure we can work something out, my Monero address is here), or if I can download this PDF file from this totally legit website (sure, why not, what could go wrong) ¯\_(ツ)_/¯. I’m still searching for my Nigerian uncle./* Let's do this in JavaScript because everybody knows JS. */ const domain = "riseup.net"; let email = "sizeofcat" + '@' + domain; /* Yes, that's my email address. */ Maybe you like the console more.$ printf "%s@%s.%s\n" sizeofcat riseup net Not a JavaScript programmer and/or can’t figure it out? Click here.Honestly, write anything you want to me, send me a movie/song recommendation, something you wrote, a cool website you found, or just to say hi. I won’t bite. Promise.Where?sizeof.catsizeofaex6zgovemvemn2g3jfmgujievmxxxbcgnbrnmgcjcjpiiprqd.onion on the Tor network.Email me for my Ricochet handle.Nothing else except those, I don’t have a Facebook, a Discord, an ExpertSEXchange, a MySpace, a Gitlab, a GetHobo, a Masto-something, a Twitter, a Twatter, a Swatter, a Fatter, a Squatter, a Platter or whatever is the latest fad nowadays. If somebody claims to be me, chances are it’s not actually me.I don’t use social media. At all.DonationsIf you like the work I do and would like to support it I’d appreciate contributions via Monero (you can send Monero to sizeof.cat in an OpenAlias compatible wallet).Monero is an open-source cryptocurrency that focuses on privacy, decentralisation and scalability. Unlike many cryptocurrencies that are derivatives of Bitcoin, Monero is based on the CryptoNote protocol and possesses significant algorithmic differences relating to blockchain obfuscation.83Z6NrUiydMUU7LRy7T78Wb8ZVMhVKsT3A65XwZQwB7chQFziDJiup7Uk2ukqcZ8fp69KtXvZkteGNZ9YdRbqVFHRwoJNjZWebsiteI started this website (not a blog, this is a website, if you call my website a blog I will punch you in the throat) in 2015 (as you can see from the archive) and managed to piss off quite a few companies corporations along the way (looking at you Twitch/Amazon, Samsung and Apple), which has to be a bonus, I mean who doesn’t want more friends? The website is powered by Hugo (and some Bash + Python scripts behind) with a custom theme based on the Even theme by olOwOlo, custom theme which I am also releasing for free. Free is always good.The access logs are disabled, so there is absolutely no trace of any of the visitors of this website but if you want a number, I’d say over 100k unique monthly visitors and over 300k monthly requests.If you want to make me an irresistible offer to promote (read: shill) your product, make sure you use the email subject IRRESISTIBLE OFFER, all in caps, so my email client can pick it up and mark it as spam.TesticlemonialsSometimes I feel like I don’t even know who sizeof(cat) is. But then I remember sizeof(char) is always 1 and my brain relaxes. TwitterUser967_Totally_not_b0tsizeof(cat) is my idol. Nagoor Babu, Weapon of DurgasoftI have no fucking idea who sizeof(cat) is. Abdul Lateef Jandalisizeof(cat) once broke into the Octagon servers using nothing but a bottle opener, sauerkraut and the famous left-handed Latvian Rotator Torture. Doug Snowmensizeof(cat) is not a meaningful question in itself because cat is not a data type or a variable. In programming, the sizeof operator is used to determine the size in bytes of a data type or a variable. For example, sizeof (int) would return the size in bytes of an integer variable. If you are asking about the size of a domestic cat, the answer would depend on the specific breed and individual cat. Generally, cats can weigh anywhere from a few pounds to over 20 pounds, with an average weight of around 9-10 pounds. Chat GeppettoPromotionalASCII o8o .o88o. .o . o. `"' 888 `" .8' .o8 `8. .oooo.o oooo oooooooo .ooooo. .ooooo. o888oo .8' .ooooo. .oooo. .o888oo `8. d88( "8 `888 d'""7d8P d88' `88b d88' `88b 888 88 d88' `"Y8 `P )88b 888 88 `"Y88b. 888 .d8P' 888ooo888 888 888 888 88 888 .oP"888 888 88 o. )88b 888 .d8P' .P 888 .o 888 888 888 `8. 888 .o8 d8( 888 888 . .8' 8""888P' o888o d8888888P `Y8bod8P' `Y8bod8P' o888o `8. `Y8bod8P' `Y888""8o "888" .8' `" "' ImagesIf you’re wondering about the meaning of the logo, it’s very simple: the text is my handwriting and the “cat” image was hand-drawn by a dear friend who is no longer among us.All images are compressed to lossless quality with metadata removed, if you place them on your website please make no changes to the actual images. You should download and serve the images from your server (for security reasons) instead of hot-linking, but use them however you see fit.The URL is <PROTOCOL>://<DOMAIN>/img/sizeofcat-<SIZE_X>x<SIZE_Y>-<BACKGROUND_COLOR>.<IMAGE_FORMAT>. So, for a standard small banner image size (88x31) JPEG, you will always find it on the clearnet at the URL http://sizeof.cat/img/sizeofcat-88x31-black.jpg. Same image, in PNG format, can be found on the Tor network at http://sizeofaex6zgovemvemn2g3jfmgujievmxxxbcgnbrnmgcjcjpiiprqd.onion/img/sizeofcat-88x31-black.png.CurrentGIF (240x60) with black or white background<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-black.gif" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-white.gif" alt="sizeof(cat)" /></a>JPEG or PNG (240x60) with black or white background<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-black.jpg" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-white.jpg" alt="sizeof(cat)" /></a>JPEG or PNG (88x31) with black or white background<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-88x31-black.jpg" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-88x31-white.jpg" alt="sizeof(cat)" /></a>PNG (240x60) with transparent background and black or white text<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-transparent-black.png" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-240x60-transparent-white.png" alt="sizeof(cat)" /></a>PNG avatar image with various sizes (32x32, 64x64, 128x128 and 256x256)<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-avatar-32x32.png" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-avatar-64x64.png" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-avatar-128x128.png" alt="sizeof(cat)" /></a><a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat-avatar-256x256.png" alt="sizeof(cat)" /></a>SVG image (100% width, automatically fills the container)<a title="sizeof(cat)" href="https://sizeof.cat/"><img src="https://sizeof.cat/img/sizeofcat.svg" alt="sizeof(cat)" /></a>HistoricalI replaced the “cat” in my website’s logo over the years, for various reasons I considered important. Below are those variants, you shouldn’t link to them because they’re just historical artefacts.SVG image (200x60), for the 2024 HalloweenSVG image (200x60), for the website’s 9th Anniversaryauthor sizeof(cat)permalink https://sizeof.cat/about/section Pagecreated May 10, 2019updated February 20, 2025words 1317tags #website, #personalThis page is also translated into the following languages:Català ➝ Sobre mi'''
