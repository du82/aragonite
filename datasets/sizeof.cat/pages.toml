title = "sizeof(cat)"
description = """
My World of Warcraft chapter might be closed, but from the ashes of the old days (and nights), here is video of one of my many Julak-Doom solo kills. Music is Bauklötze by Hiroyuki Sawano, voice is Mika Kobayashi and I’ve chosen this song because at a point in the timeline, Julak-Doom really felt like a flesh Titan. His Massive Shockwave attack would one-shot my demon hunter if caught in its area-of-effect, and 5 seconds spent inside a Black Breath pool would be enough to meet Illidan, again. Constant movement was key, as well as careful management of abilities.
Sorry, your browser doesn't support HTML5 video. Here is a link to the video instead.Cover image “design” in Adobe Photoshop CS4, video editing was done on my iBook G4 in Apple Final Cut Pro 6 and transcoded using Handbrake on the same machine; it really took a long time but was worth every min…hour of it. Happy this 20-years-old notebook is still useful in this age.Enjoy."""
full_description = '''World of Warcraft video - Julak-Doom solo killJanuary 27, 2025Article167 words1 min readMy World of Warcraft chapter might be closed, but from the ashes of the old days (and nights), here is video of one of my many Julak-Doom solo kills. Music is Bauklötze by Hiroyuki Sawano, voice is Mika Kobayashi and I’ve chosen this song because at a point in the timeline, Julak-Doom really felt like a flesh Titan. His Massive Shockwave attack would one-shot my demon hunter if caught in its area-of-effect, and 5 seconds spent inside a Black Breath pool would be enough to meet Illidan, again. Constant movement was key, as well as careful management of abilities. Sorry, your browser doesn't support HTML5 video. Here is a link to the video instead.Cover image “design” in Adobe Photoshop CS4, video editing was done on my iBook G4 in Apple Final Cut Pro 6 and transcoded using Handbrake on the same machine; it really took a long time but was worth every min…hour of it. Happy this 20-years-old notebook is still useful in this age.Enjoy.Read more ... My Apple iBook G4January 20, 2025Article3163 words15 mins readApple iBook G4Made from ultratough polycarbonate plastic — the same high-grade material used in bulletproof glass — the iBook’s sleek white case resists impact. While that measure alone might have allowed iBook to comfortably survive everyday use and abuse, Apple engineers took the idea of protecting your investment quite seriously. Inside, a sturdy magnesium frame provides superior strength, while reducing the weight of the iBook G4 to well below that of other full-featured PC notebooks. Rubber mounted for added bump tolerance, the iBook’s hard disk drive lets you store all of your digital goodies and still enjoy peace of mind. What’s more, the iBook has no I/O doors or protruding elements — and no optical drive tray, either — to break or snap off when tucked into a backpack or briefcase. Apple websiteMy machine is an Apple iBook 12" 1.2GHz/256/30G/Combo/APX (at least that’s what the sticker behind the keyboard is trying to tell me), which means it has a 1.2GHz PowerPC CPU that cannot be replaced (unless you replace the whole mainboard, or logic board as Apple likes to call it), 256MB of RAM onboard, a 30G HDD, a Combo CD reader/DVD reader/CD writer unit (no DVD writer, I think that’s called a SuperDrive and it used to cost extra) and an Airport Extreme WiFi card. Basically, except the aforementioned SuperDrive and the Bluetooth module, everything is perfect (the last and best iBook G4 had a 1.42GHz CPU and 512MB of RAM built-in, but the difference is small and I’m not too fussed about it).Read more ...'''
