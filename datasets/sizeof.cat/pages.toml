full_description = "InflativeLoadingDynamically convert an unmanaged EXE or DLL file to PIC shellcode by prepending a shellcode stub. InflativeLoadingFebruary 26, 2025#security ▪ #malware ▪ #windows FindGPPPasswords - find and decrypt Group Policy Preferences passwordsA cross-platforms tool to find and decrypt Group Policy Preferences passwords from the SYSVOL share using low-privileged domain accounts. FindGPPPasswordsFebruary 26, 2025#tools ▪ #security ▪ #windows One. Two. Three.LaptopRetrobookServerThat’s all. You need more?February 26, 2025#personal ▪ #hardware The day laughter diedA long, long time agoI can still remember how that comicUsed to make me smile.And I knew if I had my chanceThat I could make those people laughAnd maybe they’d be happy for a while.But August made me shiverWith every paper I’d deliverBad news on the doorstepI couldn’t take one more step.I can’t remember if I criedWhen I read about his widowed brideBut something touched me deep insideThe day the laughter died.Still miss you, Robin.February 25, 2025#opinions ▪ #remembrance Late night talk showsDamn, I nearly forgot late night talk shows used to be about comedy and entertainment rather than government-funded propaganda.February 25, 2025#dystopia ▪ #ideas Eclipse IDE for Mac OS X LeopardIt took me 4 (fünf) hours to find the perfect Eclipse IDE version for Mac OS X Leopard/PowerPC (it’s Juno), as well as all the proper plugins to have Javascript/PHP/CSS/C support, because the marketplace can’t be accessed by the old Eclipse version, so I needed to dig around the huge Eclipse website and smash bits together. Unless you want to have separate installs for Java/C/Java EE/PHP/Javascript/Mobile, you need to do this part. Eclipse Juno PDT is not available to download, for some strange reason (was it even released?). Archiving is for the weak, right?At least now I have a fully functioning Eclipse IDE install on my iBook.February 24, 2025#powerpc ▪ #eclipse Evil Does Not Exist, 2023While the symbolism strong this one is in (to quote Yoda), the snoredom is just as strong. First 20 minutes of the movie, some dude is carrying water through a forest. Not joking, swear to Allah. The kind of movie you watch in a room in Cannes so you can smell your own farts and think “this is it, I finally made it”. But what you really made is a steaming pile of crap.Spoiler, evil really exists, it’s called boredom. Skip this one unless you like the smell of Japanese farts. Or your own farts. Or if you’re Japanese, the smell of your own Japanese farts.I will stay. It will be my last task.February 21, 2025 #movies ▪ #japan"
