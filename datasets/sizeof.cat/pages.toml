full_description = "Website themeThe theme of this website, for Hugo, based on the Even theme by olOwOlo (forked in 2017 so it should be quite different from the latest Even version).LanguageHTML + CSS + JSLicenseGPLv3Version9.0.0Release dateApril 4, 2023Downloadzip archiveSHA-256447eaf4e76bd4d98ae3a29c9c26a4b3c06d48af0910ae007e2b898c3efeb220eFeaturesMultilingual.Dark and light mode.Clean, no external JavaScript, stylesheets or Google fonts.Simple and minimalistic, ultra-fast.Has webmentions.Syntax highlighting.Has mobile menu support and lightbox.UsageConfigure your config.toml. Feel free to copy the demo config.toml and some content from the exampleSite folder. Build your site with hugo serve and enjoy the result at http://localhost:1313.Make sure you replace all occurrences of sizeof.cat with your website address (or http://localhost:1313/).ConfigurationJust look into the config.toml file, there are way too many configuration options to list them all here.NotesAll the dates are normalized to UTC. If you don’t want that, look into archetypes/*.md files (though you might want not to expose your timezone).The server-side encryption is not public and will never be. Don’t ask.All the static files are in the static directory and you will need to manually cleanup it; I left the files there so you can figure out the site structure.Section indexes are disabled for music, review and photo sections.The HTML files might look funny because of the SVG images but keep in mind that text can be easily compressed by the web server.There are probably lots of unused options and files around, the archive is exported via an automatic deploy script and it’s up to you to decide what files to keep and what not.If you’re stuck, contact me, I’m always happy to help.LicenseThis theme is written by sizeof(cat) and released under GPLv3.This program is free software: you can redistribute it and/or modify it under the terms of the GNU General Public License as published by the Free Software Foundation, either version 3 of the License, or (at your option) any later version. This program is distributed in the hope that it will be useful, but WITHOUT ANY WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU General Public License for more details. You should have received a copy of the GNU General Public License along with this program. If not, see <https://www.gnu.org/licenses/>. author sizeof(cat)permalink https://sizeof.cat/project/sizeofcat-website-theme/section Projectcreated April 21, 2017updated April 4, 2023words 395tags #projects, #hugo, #website, #theme"
