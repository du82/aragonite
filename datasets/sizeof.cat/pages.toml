full_description = "Internet Radio - the listFebruary 26, 2025Article81110 words381 mins readIt’s time for another huge list, and today it’s a list of Internet Radio websites! Listen in your favorite web browser, music application or iTunes. Some of the websites might be down, temporarily or for good.If you want the list (6057 entries) in CSV, XML, JSON or HTML format, I got you covered.table tr td:first-child{width:200px!important}table tr td{padding:5px!important}Adult Contemporary▪ Alternative Rock▪ Ambient▪ Blues▪ Classic Rock▪ Classical▪ College/University▪ Comedy▪ Country▪ Eclectic▪ Electronica▪ Golden Oldies▪ Hard Rock / Metal▪ Hip Hop / Rap▪ International / World▪ Jazz▪ News / Talk Radio▪ Reggae▪ Religious▪ RnB / Soul▪ Sports Radio▪ Top 40 / Pop▪ ’70s Retro▪ ’80s Flashback▪ ’90s HitsRead more ... My Apple iBook G4 - gamesFebruary 15, 2025Article739 words4 mins readApple iBook G4This is the third part of the “My Apple iBook G4” series of articles, and it’s all about the video games you can run on your iBook G4, under Mac OS X 10.5.8 Leopard.Well, it’s pretty simple: if you’re into retro games, think 1995-2009, there is a big chance that it will work on an Apple iBook G4 laptop. Its GPU is an ATI Radeon Mobility 9200 @ 200MHz with 32 MB of SDRAM @ 230MHz and the CPU is a PowerPC G4 @ 1.2 GHz, with 64KB L1 and 512KB L2 cache, 133MHz FSB. And 1.256 GB RAM @ 266MHz (not one thousand GB, 1GB + 256MB).I tested some of my favorite games and it seems as if everything works just great with very good performance, but then again I don’t really play games newer than 2010, Oxygen Not Included is the only new video game I currently play.Read more ... We are destroying softwareFebruary 14, 2025Bookmark1 min readhttps://antirez.com/news/145We are destroying software with complex build systems.We are destroying software with an absurd chain of dependencies, making everything bloated and fragile.We are destroying software telling new programmers: “Don’t reinvent the wheel!”. But, reinventing the wheel is how you learn how things work, and is the first step to make new, different wheels.[…]We are destroying software, and what will be left will no longer give us the joy of hacking.antirez"
