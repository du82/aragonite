You can turn …"""
full_description = 'Documentation Installing Skaffold Installing Skaffold Note To keep Skaffold up to date, update checks are made to Google servers to see if a new version of Skaffold is available. You can turn this update check off by following these instructions. To help prioritize features and work on improving Skaffold, we collect anonymized Skaffold usage data. You can opt out of data collection by following these instructions. Your use of this software is subject to the Google Privacy Policy Managed IDE Cloud Code provides a managed experience of using Skaffold in supported IDEs. You can install the Cloud Code extension for Visual Studio Code or the plugin for JetBrains IDEs. It manages and keeps Skaffold up-to-date, along with other common dependencies, and works with any kubernetes cluster. Google Cloud Platform’s Cloud Shell provides a free browser-based terminal/CLI and editor with Skaffold, Minikube, and Docker pre-installed. (Requires a Google Account.) Cloud Shell is a great way to try Skaffold out. Standalone binary The latest stable binaries can be found here: Linux x86_64 (amd64): https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 Linux ARMv8 (arm64): https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-arm64 Simply download the appropriate binary and add it to your PATH. Or, copy+paste one of the following commands in your terminal: # For Linux x86_64 (amd64) curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && \ sudo install skaffold /usr/local/bin/ # For Linux ARMv8 (arm64) curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-arm64 && \ sudo install skaffold /usr/local/bin/ We also release a bleeding edge build, built from the latest commit: Linux x86_64 (amd64): https://storage.googleapis.com/skaffold/builds/latest/skaffold-linux-amd64 Linux ARMv8 (arm64): https://storage.googleapis.com/skaffold/builds/latest/skaffold-linux-arm64 # For Linux on x86_64 (amd64) curl -Lo skaffold https://storage.googleapis.com/skaffold/builds/latest/skaffold-linux-amd64 && \ sudo install skaffold /usr/local/bin/ # For Linux on ARMv8 (arm64) curl -Lo skaffold https://storage.googleapis.com/skaffold/builds/latest/skaffold-linux-arm64 && \ sudo install skaffold /usr/local/bin/ The latest stable binaries can be found here: Darwin x86_64 (amd64): https://storage.googleapis.com/skaffold/releases/latest/skaffold-darwin-amd64 Darwin ARMv8 (arm64): https://storage.googleapis.com/skaffold/releases/latest/skaffold-darwin-arm64 Simply download the appropriate binary and add it to your PATH. Or, copy+paste one of the following commands in your terminal: # For macOS on x86_64 (amd64) curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-darwin-amd64 && \ sudo install skaffold /usr/local/bin/ # For macOS on ARMv8 (arm64) curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-darwin-arm64 && \ sudo install skaffold /usr/local/bin/ We also release a bleeding edge build, built from the latest commit: Darwin x86_64 (amd64): https://storage.googleapis.com/skaffold/builds/latest/skaffold-darwin-amd64 Darwin ARMv8 (arm64): https://storage.googleapis.com/skaffold/builds/latest/skaffold-darwin-arm64 # For macOS on x86_64 (amd64) curl -Lo skaffold https://storage.googleapis.com/skaffold/builds/latest/skaffold-darwin-amd64 && \ sudo install skaffold /usr/local/bin/ # For macOS on ARMv8 (arm64) curl -Lo skaffold https://storage.googleapis.com/skaffold/builds/latest/skaffold-darwin-arm64 && \ sudo install skaffold /usr/local/bin/ Skaffold is also kept up to date on a few central package managers: Homebrew brew install skaffold MacPorts sudo port install skaffold The latest stable release binary can be found here: https://storage.googleapis.com/skaffold/releases/latest/skaffold-windows-amd64.exe Simply download it and place it in your PATH as skaffold.exe. We also release a bleeding edge build, built from the latest commit: https://storage.googleapis.com/skaffold/builds/latest/skaffold-windows-amd64.exe Scoop Skaffold can be installed using the Scoop package manager from the extras bucket. This package is not maintained by the Skaffold team. scoop bucket add extras scoop install skaffold Chocolatey Skaffold can be installed using the Chocolatey package manager. This package is not maintained by the Skaffold team. Caution Chocolatey’s installation mechanism interferes with Ctrl+C handling and prevents Skaffold from cleaning up deployments. This cannot be fixed by Skaffold. For more information about this defect see chocolatey/shimgen#32. choco install -y skaffold If you have the Google Cloud SDK installed on your machine, you can quickly install Skaffold as a bundled component. Make sure your gcloud installation and the components are up to date: gcloud components update Then, install Skaffold: gcloud components install skaffold Stable binary For the latest stable release, you can use: docker run gcr.io/k8s-skaffold/skaffold:latest skaffold <command> Bleeding edge binary For the latest bleeding edge build: docker run gcr.io/k8s-skaffold/skaffold:edge skaffold <command> Last modified January 23, 2025: release: v2.14.0 (#9668) (f132ab25)'
year_published = 2025
