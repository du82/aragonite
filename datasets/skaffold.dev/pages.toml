full_description = "Documentation References skaffold.yaml skaffold.yaml 💡 Tip The Cloud Code IDE extensions (see install options) provide authoring assistance for skaffold.yaml files in the form of schema based validation, diagnostics, quick documentation, code completions, and snippets, that can make it easier to create and edit these files. You can now navigate the skaffold.yaml reference from an inner element to its upper levels using the tooltip that appears on hover, clicking on the parent element you want to go: Note YAML anchors Anchors can be defined by having top-level keys starting with a dot, e.g. .common_stuff: &alias_name. You can then reuse the value using *alias_name. Organizing multiple configurations Multiple configurations can define dependencies on each other to construct an arbitrarily nested tree of project component dependencies. Management of multiple configurations can be simplified by grouping them together in the same file (separated by --- in YAML). Last modified January 23, 2025: release: v2.14.0 (#9668) (f132ab25)"
