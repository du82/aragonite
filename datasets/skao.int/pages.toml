full_description = "Construction The journey to build a mega-science project Latest news UN meeting features satellites’ impact on astronomy February 2025 Introduction A key UN body has been discussing the impact of satellite constellations on astronomy, including the issue on its agenda... Sweden signs SKAO Convention to join Observatory January 2025 Introduction Sweden will soon join the SKA Observatory as a member following the signing of the SKA Observatory Convention at an... SKAO Africa Programme to broaden human capital development efforts November 2024 Introduction The SKAO has signed a memorandum of understanding with the UK Science and Technology Facilities Council (STFC) with the goal... All news Our telescopes We are building the two largest radio telescope arrays in the world, located in Australia and South Africa, supported by institutions and facilities around the globe. Learn more about the SKA telescopes SKAO science goals The SKA telescopes will transform our understanding of the Universe, tackling some of the most fundamental scientific questions of our time. Discover our scientific mission Women in STEM Diversity and inclusion are foundational values at the SKAO. We want to break down stereotypes about working in science, technology, engineering and maths, and ensure women's contributions in these fields are celebrated. Meet some of Team SKA's women in STEM Big Data Tackling the ultimate Big Data challenge Sustainability Building a sustainable observatory Impact How is the SKAO benefitting society? Explore our impact map Our magazine Contact covers the broad range of SKA-related activities taking place around the world, from science breakthroughs and technology innovations, to construction milestones, policy developments and outreach efforts. Read it and subscribe here"
