["https://skao.int/en/547/alice-pellegrini"]
title = "Dr Alice Pellegrini | SKAO"
description = "Dr Alice Pellegrini is an radio frequency antenna domain specialist and team lead at the UK Global Headquarters."
full_description = 'Explore Opportunities Resources Partners News & Events Science Users SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs Dr Alice Pellegrini Dr Alice Pellegrini is an radio frequency antenna domain specialist and team lead at the UK Global Headquarters. Scroll down for video transcriptTell us a bit about your early life, Alice.I am originally from Rome, Italy. I have been drawn to maths since I was a kid and enjoyed hands on work, building things and seeing them working. My grandad was a source of inspiration with his ham radio shed!How did you get to the SKAO?Passion for numbers and wireless communication is what led me to follow a path in applied electromagnetism. I graduated from the University of Pisa in Italy followed by a PhD and postdoc in antennas and numerical methods. Before joining the SKAO I worked in several companies covering various roles from antenna design to systems engineering for large ground satellite communication systems.What do you enjoy about engineering?I like the curious and inquisitive thinking, the scientific approach to problem solving and its applicability to everyday life.How has working for the SKAO given you new experiences, challenges and aided your career?Radio astronomy is perhaps the most challenging application for an antenna. I have learnt a lot about system complexity and those fine technical details that are important when trying to sense faint signals from the far reaches of space. This year’s INWED theme is “enhanced by engineering”, how do you feel your work is developing and enhancing the wider world?I like to think that I am part of a change that will have worldwide impact. On a technical side I feel that my work is contributing to building something that will enhance our knowledge about the universe, as well as our origins. I’m proud of the impact all this will have on future generations and understanding of our surroundings.Throughout my career I have witnessed the positive changes that the STEM world is going through. There is still a lot of work to be done but there is an increasing trend of inclusion. Video transcript"I have been drawn to maths since I was a kid and enjoyed hands on work, building things and seeing them working. My grandad was a source of inspiration with his ham radio shed!""With engineering I like the curious and inquisitive thinking, the scientific approach to problem solving and its applicability to everyday life.""I feel that my work is contributing to building something that will enhance our knowledge about the universe," Last modified on 20 June 2024'
