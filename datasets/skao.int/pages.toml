["https://www.skao.int/en/science-users/skao-science-meeting-2025/583/gorlitz"]
title = "Görlitz | SKAO"
description = "How to get there, where to stay and other local information."
full_description = "Abstract submission Registration Görlitz Our partners Programme Organising committees Key dates Contact information Görlitz How to get there, where to stay and other local information. Görlitz, our host town, is one of the most popular tourist destinations in the east German state of Saxony. Located right on the Neisse river, which forms the border with Poland, it is Germany's easternmost town and headquarters of the DZA. It is renowned for its architectural treasures spanning different eras. The setting of the old town has led to it featuring as a backdrop to many well-known films - so much so that it now has the nickname 'Görli-wood'. Right on the edge of eastern Germany, Görlitz has good connections into Poland and Czech Republic, as well as a local rail line to Dresden. Getting thereUnusually for German towns, two airports in neighbouring countries feature high up the list for options for those seeking nearby flights to Görlitz. Distance to Dresden Airport: 103 km Distance to Copernicus (Wroclaw) Airport: 173 km Distance to Vaclev Havel (Prague) Airport: 179 km Distance to Berlin Brandenberg Airport: 195 km Distance to Leipzig/Halle Airport: 226 kmDistance to Munich Airport: 542 kmDistance to Frankfurt Airport: 567 kmThe airport in Dresden is still the closest and most convenient if suitable flights are available. The airport at Wroclaw in Poland is a hub for low-cost airlines, while Vaclev Havel airport near Prague has a range of flights suiting the capital of the Czech Republic. The airports at Berlin, Munich and Frankfurt are international hubs and offer numerous daily connecting flights to Dresden Airport, which has direct train transfers to Görlitz. Train station in Görlitz The Görlitz train station is around a 10-minute walk from the old town (slightly longer down to the river). It is at the end of a regional line from Dresden and the services are operated by a private company Trilex (who offer cheaper day tickets than the more common Sachsen Ticket if travelling on this route). There are also regular services from Berlin via Cottbus and a train runs between Dresden and Wroclaw (Breslau in German) in Poland three times a day. For further information regarding the various train options, please visit the 'Deutsche Bahn' page: https://int.bahn.de/en Group transport from the airport - we are considering the possibility of providing a coach from the main airports to travel to Gorlitz. Please let us know if you’d be interested in booking a seat on a coach by ticking the box of the registration form, an additional fee will apply. Where to stayGörlitz is a popular tourist destination and, as such, has a good range of accommodation for visitors. Many of the hotels are in the old town and the area down towards the river and the Polish border, although a few are situated in the area closer to the train station. We have secured preferential rates at the following hotels and are holding block bookings until 31st March 2025. Please book your accommodation directly using the information below as soon as possible before our agreements expire. Alternatively you can find accommodation through agents such as booking.com, Airbnb or alike. Accommodation options - please quote ‘SKAO’ when calling to make bookings. Name of hotel Rate/details Booking details Parkhotel Bolko-von-Hochberg-Straße 2 ehemals, Uferstraße 17 f, 02826 Görlitz, Germany 4* rated, 900 metres away from historical centre Single room 88,50 € Double room 108,50 € +49 3581 6620 Hotel websiteHotel Tuchmacher Peterstraße 8, 02826 Görlitz, Germany 4* rated, historical hotel in centre, option to upgrade and extend for the weekend Single room 100,80 € Double room 149,70 € +49 3581 47310 Hotel websiteHotel BörseUntermarkt 16, 02826 Görlitz, GermanyHistorical hotel, located in the central UntermarktSingle room 60 - 97 € Double room 111 € +49 3581 76420Hotel websiteHotel Europa Berliner Str. 2, 02826 Görlitz, Germany 3* rated, located in the city centre Single room 79 € +49 3581 4235 Hotel websiteAm Goldenen Strauss HotelStruvestraße 1, 02826 Görlitz, Germany 3* rated, located in the city centre Single room 79 € Double room 99 € +49 3581 4281810 Hotel website Other useful websites to help with your accommodation booking: https://www.germansights.com/goerlitz/ Görlitz booking and accommodation https://www.visit-goerlitz.com/Tourismus.html Things to do and toursGörlitz offers more than 4,000 listed and original preserved buildings and lets you experience times long past. The easternmost city in Germany is one of the culturally and historically most important sights in Central Europe. From the typical Gothic Hall houses and the stately Renaissance and Baroque buildings to the attractive Wilhelminian quarters, you will find a cross-section through the entire history of German architecture. Why not discover the history and traditions of this unique city by booking onto an organised tour during your stay. On Wednesday 18th June there will be some free time away from the conference giving you the opportunity to take a break and possibly enjoy a walk and tour around Görlitz. We will shortly be updating this page with details of ‘SKAO Science Meeting’ group tour codes, which will provide special rates to book. Meanwhile, here is a link to the tourist office with details of further available tours. https://www.visit-goerlitz.com/Guided-tours.html On this page Last modified on 25 February 2025"
