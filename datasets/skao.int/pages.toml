["https://skao.int/en/news/567/skao-african-partners-collaborate"]
title = "SKAO and African partners strengthen collaboration on human capital development | SKAO"
description = "The SKAO has signed memoranda of understanding with the South African Radio Astronomy Observatory (SARAO) and the African Astronomical Society (AfAS) focused on collaborating on human capital development programmes."
full_description = 'Show details Target audience Academics Educational Community Government Officials Media Policy-Makers Topic Impact Country South Africa Date 05 September 2024 Last modified 05 September 2024 SKAO and African partners strengthen collaboration on human capital development News on 05 September 2024 The SKAO has signed memoranda of understanding with the South African Radio Astronomy Observatory (SARAO) and the African Astronomical Society (AfAS) focused on collaborating on human capital development programmes. The agreements, establishing cooperation for the next five years, were signed during the International Astronomical Union’s General Assembly in Cape Town, South Africa – the first to be held on the African continent – where the SKAO had a major presence. “It is central to the SKAO’s mission to not only deliver exceptional science, but also to make a broader positive impact on society,” said SKAO Director-General Prof. Philip Diamond.“The Observatory’s footprint is already significant in South Africa, with the construction of the SKA-Mid telescope taking place in the Northern Cape. These agreements with our partners AfAS and SARAO are an important step towards delivering opportunities for the next generation of students and scientists across Africa. Our member countries globally will also benefit from the exchanges of ideas and knowledge that such programmes bring.”Under the memorandum of understanding between the SKAO and SARAO, the organisations will work together to provide opportunities for African students to study and train at leading universities in SKAO member countries, and provide opportunities for African students to participate in skills development interventions and programmes. Prof. Phil Diamond, Director-General of the SKAO, and Pontsho Maruping, Managing Director of SARAO, sign a memoranda of understanding. Credit: SKAO Prof. Phil Diamond, Director-General of the SKAO, and Prof. Thebe Rodney Medupe, President of AfAS, shaking hands. Credit: SKAO SARAO, a National Facility of the National Research Foundation, is the SKAO’s collaboration partner in delivering the SKA-Mid telescope. It has long-standing bursary programmes for South African students and those from the SKA African partner countries (Botswana, Ghana, Kenya, Madagascar, Mauritius, Mozambique, Namibia and Zambia) to study astronomy, engineering, computer science and other related fields in South Africa.“This partnership will build on the tremendous advancements already achieved through SARAO’s existing programs that support the development of radio astronomy capacity on the African continent” says Pontsho Maruping, Managing Director of SARAO. “Broadening the collaboration establishes a sustainable approach to skills development that continues to unlock Africa’s potential.The memorandum of understanding between the SKAO and AfAS establishes a determination to work together to develop programmes promoting radio astronomy, multi-wavelength and multi-messenger astronomy, and associated sciences on the African continent, using these activities as a tool for social and economic development in Africa.This builds on existing collaborations between the two organisations, which includes a recent agreement for the SKAO to provide a standing sponsorship for the AfAS annual meeting. As the pan-African society for professional astronomers, headquartered in South Africa, AfAS aims to contribute to addressing the challenges faced in Africa through the promotion and advancement of astronomy. Its key objective is to develop astronomy and human capacity throughout Africa.“Astronomy is about two things: knowledge and people. This creates an automatic synergy between the SKAO and AfAS,” said AfAS President Prof. Thebe Rodney Medupe during the signing at the IAU General Assembly."We host excellent astronomical facilities in African countries but we need human capital development to make sure that these instruments do not only produce data, but also produce science. Our cooperation with the SKAO will help Africa to become a knowledge-producing continent.”'
year_published = 2024
year_updated = 2025
