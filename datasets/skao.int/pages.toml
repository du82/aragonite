["https://skao.int/en/science-users/science-working-groups/111/hi-galaxy-science"]
title = "HI Galaxy Science | SKAO"
description = "This working group is focused on the history of gas in our universe through the study of atomic HI line emission and absorption, mainly at redshifts from ~0 to ~1.5."
full_description = 'Cosmology Cradle of Life Epoch of Reionization Extragalactic Continuum Extragalactic Spectral Line Gravitational Waves High Energy Cosmic Particles HI Galaxy Science HI Galaxy Science SWG members Magnetism Our Galaxy Pulsars Solar, Heliospheric & Ionospheric Physics Transients VLBI SWG Monthly Updates HI Galaxy Science This working group is focused on the history of gas in our universe through the study of atomic HI line emission and absorption, mainly at redshifts from ~0 to ~1.5. HI Galaxy Science Working Group Introduction The HI Galaxy Science Working Group is focused on studying the formation and evolution of galaxies by mapping the 21-cm spectral line of neutral atomic hydrogen (HI) in absorption and emission, over cosmic time. Using SKA we will conduct deep HI observations of millions of galaxies out to redshift z>1. Our primary goals are to investigate the structure and dynamics of cold gas in and around galaxies, explore the gas-halo interface, discover plumes and streams of intergalactic gas, as well as map large-scale galaxy structures and their peculiar motions. Working Group MembershipMembers of the the HI Galaxy Science Working group can be found here.We actively encourage interested researchers to participate in the working group.If you are interested in joining the group, please complete this form.The current co-chairs are:Betsey Adams (ASTRON, Netherlands), adams@astron.nlNeeraj Gupta (IUCAA, India), ngupta@iucaa.inGuidelines on who can join the group can be found here.The SKAO Project Scientist liaison is Philippa Hartley (contact details here). HI Galaxy Science Working Group Documentation Download the HI banner here The HI chapters from "Advancing Astrophysics with the SKA" (2015) can be found here Previous ChairsBarbara Catinella (2021-2023)Paolo Serra (2020-2022)Sarah Blyth (2017-2021)Lourdes Verdes-Montenegro (2017-2019)Erwin de Blok (2015-2017)Martin Meyer (2015-2017)Lister Staveley-Smith (2013-2015)Tom Oosterloo (2013-2015) Last modified on 11 September 2024'
