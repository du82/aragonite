tions of the Tribunal. The IET applies the Rules of Procedure as set out as annex to the IET Regulations. The Tribunal may amend its Rules of Procedure. The Judges: The Independent Employment Tribunal Judges are experienced legal professionals: qualified as lawyers with a minimum of 10 years standing or jurisconsults of recognised competence. The current Judges are: Chris de Cooker, President of the IET (Dutch national) Kieran Bradley, Vice-President of the IET (British and Irish national) Sarah Christie (British and South African national) Eva Gröniger-Voss (German national) Margie Tannock (Australian national) Ming Wu (Chinese national) Contact: The IET secretariat provide administrative services to the IET. A copy of the IET Regulations and Rules, and forms for submission of a claim, can be obtained by contacting the secretariat by email: IETsecretariat@skao.int Please note the secretariat does not provide legal or employment advice. Last modified on 04 August 2023"
