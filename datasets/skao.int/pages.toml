description = "This is the listing of the (non-HI) Extragalactic Spectral Line Science Working Group, addressing spectral line work not covered by the HI Science Working Group or the Our Galaxy Science Working Group."
full_description = 'Cosmology Cradle of Life Epoch of Reionization Extragalactic Continuum Extragalactic Spectral Line Extragalactic Spectral Line SWG members Gravitational Waves High Energy Cosmic Particles HI Galaxy Science Magnetism Our Galaxy Pulsars Solar, Heliospheric & Ionospheric Physics Transients VLBI SWG Monthly Updates Extragalactic Spectral Line This is the listing of the (non-HI) Extragalactic Spectral Line Science Working Group, addressing spectral line work not covered by the HI Science Working Group or the Our Galaxy Science Working Group. Extragalactic Spectral Lines Working Group Introduction The Extragalactic Spectral Lines science working group focusses on the many astrophysically important lines besides the HI 21 cm line. With its unique sensitivity, SKA opens up the study of redshifted lines from distant galaxies or intrinsically weak lines from nearby galaxies, allowing us to trace material and various environments from the local to the distant Universe. In a pan-chromatic multi-messenger astronomy era, the SKA will complement and be operated along with other existing facilities such as ALMA, or instruments being built like the ELT, matching their angular resolution in the low frequency domain. The science case for extragalactic spectral lines strongly advocates for an increase in coverage toward high frequencies (>15 GHz, SKA1 upgrade or SKA2). Working Group MembershipMembers of the (Non-HI) Extragalactic Spectral Line Working group can be found here.We actively encourage interested researchers to participate in the working group.If you are interested in joining the group, please complete this form.The current co-chairs are:Viviana Casasola (INAF – IRA Bologna, Italy), viviana.casasola@inaf.itJacco van Loon (Keele University, UK), j.t.van.loon@keele.ac.ukGuidelines on who can join the group can be found here.The SKAO Project Scientist liaison is Tyler Bourke (contact details here). Extragalactic Spectral Line Working Group Documentation Download the Extragalactic Spectral Line banner here The Extragalactic Spectral Line chapters from "Advancing Astrophysics with the SKA" (2015) can be found here Previous ChairsSebastien Muller (2018-2024)Francoise Combes (2017-2023)John Conway (2014-2017)Rob Beswick (2014-2018) Last modified on 05 August 2024'
