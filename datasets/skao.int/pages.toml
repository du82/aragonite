full_description = "News Find all our news articles in reverse chronological order, or filter them by the year published, subject (advocacy or construction, for example), or country involved. Filters reset all 2025 (2) 2024 (19) 2023 (17) 2022 (19) 2021 (20) 2020 (15) 2019 (27) 2018 (14) Facet Date Advocacy (14) Construction (20) Events (17) Governance (19) Impact (8) Internal (7) Membership (32) Outreach (3) Science (37) Facet Topic Australia (18) Canada (7) China (10) France (6) Germany (6) India (4) Italy (8) Japan (1) Netherlands (8) New Zealand (1) Portugal (4) South Africa (22) South Korea (1) Spain (3) Sweden (4) Switzerland (4) Thailand (1) United Kingdom (21) Facet Location 133 results UN meeting features satellites’ impact on astronomy February 2025 Introduction A key UN body has been discussing the impact of satellite constellations on astronomy, including the issue on its agenda... Sweden signs SKAO Convention to join Observatory January 2025 Introduction Sweden will soon join the SKA Observatory as a member following the signing of the SKA Observatory Convention at an... SKAO Africa Programme to broaden human capital development efforts November 2024 Introduction The SKAO has signed a memorandum of understanding with the UK Science and Technology Facilities Council (STFC) with the goal... India celebrates SKAO membership at Pune event November 2024 Introduction India’s membership of the SKA Observatory has been marked at an event in Pune attended by senior government officials, including... Filippo Zerbi elected as chairperson of the SKAO Council from 2025 November 2024 Introduction Italian astrophysicist Dr Filippo Zerbi has been elected as the next chairperson of the SKA Observatory Council, the intergovernmental organisation’s... Germany becomes the SKAO’s newest member November 2024 Introduction The SKA Observatory has welcomed Germany as its newest member state. Tianlai becomes newest member of SKA pathfinder family October 2024 Introduction The Ch