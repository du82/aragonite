["https://skao.int/en/partners/skao-members"]
title = "SKAO Members | SKAO"
full_description = "A truly global enterprise The SKAO will consist of one global observatory, operating two telescopes, across three sites, for the worldwide scientific community. The SKAO is achieved through the committed collaboration of its participating Member States and institutions. Only through this combined capacity in resources, knowledge, and experience (industrial, technical, scientific and at policy level) will the SKA project be realised. The SKAO was established as an inter-governmental organisation in early 2021. It will undertake the construction, operation and maintenance of the SKA telescopes. The Observatory has a global footprint and will consist of the SKAO Global Headquarters in the UK, the two SKA telescopes at radio-quiet sites in South Africa and Australia, and the associated data processing facilities. SKAO Partners are located on five continents and in both hemispheres under a unique partnership of nations. Australia Canada China Germany India Italy The Netherlands Portugal South Africa Spain Switzerland United Kingdom"
