full_description = "Industry liaison officers Industry liaison officers Industrial liaison officers (ILOs) are nominated representatives of an SKAO member state responsible for ensuring the efficient flow of information between the SKAO and suppliers in the ILO’s own country. Industrial entities interested in learning more about participating in the SKA project at either Tier 1, Tier 2 or as valued suppliers should contact their nominated ILO below and register on the SKAO Supplier Portal. Your SKA ILO has been fully briefed around the various SKA work packages that have been allocated to your country and timescales for procurement. Industry contact points in member and observer countriesAustralia: Pete Wheeler – pete.wheeler@industry.gov.au Canada: Suzanne Morrison – Suzanne.Morrison@nrc-cnrc.gc.caChina: Liu Shuang and Liu Yiliang, Ministry of Science and Technology – liushuang@nrscc.gov.cn and liuyiliang@nrscc.gov.cnFrance: Pascal Chevrot - pascal.chevrot@cnrs.fr Germany: Jürgen Besold – juergen.besold@dzastro.deIndia: Prof Yashwant Gupta, National Centre for Radio Astrophysics – ygupta@ncra.tifr.res.inItaly: Dr Corrado Perna, INAF – perna@inaf.itJapan: Noriyuki Kawaguchi, NAOJ – Kawagu.nori@nao.ac.jpMalta: Kristian Zarb Adami, University of Malta – kris.za@gmail.comNetherlands: Michiel Van Haarlem, ASTRON – haarlem@astron.nlPortugal: Luis Serina and Marta Goncalves, Portugal Space – luis.serina@ptspace.pt and marta.goncalves@ptspace.ptSouth Africa: Adrian Tiplady, SARAO – atiplady@ska.ac.za or atiplady@sarao.ac.zaSpain: Javier Echavarri Delmas, CDTI – javier.echavarri@cdti.esSweden: Paul Häyhanen – Paul.hayhanen@chalmersindustriteknik.seSwitzerland: Michel Hübner, Ecole Polytechnique Fédérale de Lausanne – michel.hubner@epfl.chUnited Kingdom: Carol Watts, UKRI-STFC – carol.watts@stfc.ukri.org, TENDEROPPORTUNITIES@stfc.ukri.org Last modified on 10 January 2025"
