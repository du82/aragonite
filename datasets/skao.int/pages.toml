["https://skao.int/en/about-us/governance/100/skao-council"]
title = "SKAO Council | SKAO"
description = "The SKAO Council (the Council) is the governing body of the SKAO. The Council held their first meeting in February 2021, shortly after the entry-into-force of the SKA Observatory as an intergovernmental organisation on 15 January 2021. The Council represents the SKAO Member States, with Member Voting Representatives and their Advisors attending meetings."
full_description = "Explore Opportunities Resources Partners News & Events Science Users SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs SKAO Council The SKAO Council (the Council) is the governing body of the SKAO. The Council held their first meeting in February 2021, shortly after the entry-into-force of the SKA Observatory as an intergovernmental organisation on 15 January 2021. The Council represents the SKAO Member States, with Member Voting Representatives and their Advisors attending meetings. Hybrid SKAO Council meeting in Kimberley, South Africa, November 2024 Governance The Council is responsible for “the overall strategic and scientific direction of the SKAO, its good governance, and the attainment of its purposes”. The Council’s authority is set out in its Convention, and how it must behave is described in the Rules of Procedure. The Council is supported by two committees: Finance Committee – to ensure “sound financial management, efficiency, transparency and accountability”. The Finance Committee has three sub-committees. Science and Engineering Advisory Committee – which is made up of representatives who “act as individual experts and do not represent any Members’ views” to advise on a wide range of scientific matters including construction, technology, and engineering. MembershipThe Council Chairperson and Vice-Chairperson are independent, and do not represent any country. Each Member may designate a voting representative and an advisor.SKAO Council Chairperson: Dr Filippo ZerbiSKAO Council Vice-Chairperson: Ms Inmaculada FigueroaMembers (November 2024) RepresentativesCountryMember since:Mr Anthony McGregor (voting)Dr Douglas BockAustralia2021Dr Michael Rupen (voting)Dr Luc SimardCanada2024Prof. Zhao Jing (voting)Ms Wang XiaoChina2021Mr Patrick Hartmann (voting)Prof. Michael KramerGermany2024Prof. Roberto Ragazzoni (voting) Italy2021Mr Sunil Ganju (voting)Prof Yashwant GuptaIndia2024Ms Judith Vermeer (voting)Dr Jessica DempseyNetherlands2021Mr Ricardo Conde (voting)Mr Luis SerinaPortugal2021Mr Daan du Toit (voting)Ms Pontsho Maruping South Africa2021Ms Inmaculada Figueroa Rojas (voting)Dr Lourdes Verdes-MontenegroSpain2023Dr Simon Berger (voting)Prof. Jean-Paul KneibSwitzerland 2022Ms Felicity Howe (voting)Prof. Mark ThomsonUnited Kingdom2021ObserversThe Council also allows Observer representatives from countries or institutions who have either (a) signed an Accession Agreement and are moving towards their full membership, or (b) signed a Cooperation Agreements to provide resources, or (c) who are discussing their potential membership with the SKAO. These are (November 2024): the Republic of France, the National Astronomical Observatory of Japan (NAOJ), the Korea Astronomy and Space Science Institute (KASI), and Chalmers University of Technology (Sweden). Rules and Regulations The Council must follow: The Council Convention: which explains the high-level scope of the project, its purpose, definitions, membership rights, and how the SKAO is governed. It also outlines the SKAO’s Financial Protocols, and what has been agreed by the Members about what ‘Privileges are allowed. The Council Rules of Procedure: these state the composition of the Council, rules relating to conduct and attendance, and how meetings work e.g. voting and subsidiary committees. The Council Schedule of Delegation: which confirms what authority can (or not) be delegated - who can approve what e.g. the Council must approve the SKAO budget. Last modified on 07 February 2025"
