["https://skao.int/en/549/louisa-quartermaine"]
title = "Louisa Quartermaine | SKAO"
description = "Louisa Quartermaine is the SKA-Low site reliability engineering manager working for CSIRO and the SKAO in Western Australia."
full_description = '''Explore Opportunities Resources Partners News & Events Science Users SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs Louisa Quartermaine Louisa Quartermaine is the SKA-Low site reliability engineering manager working for CSIRO and the SKAO in Western Australia. Scroll down for video transcriptWhere did you grow up Louisa?I come from Perth, Australia and my initial interest was in architecture which is more aligned with civil engineering. From there, I started to develop an appreciation and interest for how systems, and systems of systems, are built to work together in cohesion – for example, a structure, a car, and now telescopes. So, I studied for a bachelor of interdisciplinary systems engineering and a bachelor of Asian studies (Japanese), because I like languages, at the Australian National University (ANU).How has your career brought you to the SKAO?In my final years at ANU, I specialised in digital telecommunications which lead to an undergraduate thesis being conducted with the then-Motorola Australia Research Labs and subsequently entered the Motorola Australia Software Centre working as a software engineer on Motorola mobile phone SMS and MMS software – does everyone remember the RAZR flip-phone? After some time, I transitioned into the role of project lead/junior project manager, managing software engineering projects. After Motorola, I worked in the field of IT and technology for a grain handler and marketer in Western Australia – this is where I first experienced enterprise IT and infrastructure management and support. After this I joined the International Centre for Radio Astronomy Research ICRAR) at the UWA node in the Data Intensive Astronomy Department contributing as a project manager to the development of the SKA science data processor.What do you enjoy about engineering?Figuring out how things work, using logic and creativity as well as maths and science to solve problems. For systems engineering specifically it’s understanding and making all the constituent parts work together in harmony.Has working for the SKAO developed your engineering skills, and given you new experiences and challenges?The SKAO has given me exposure to different types of engineering and roles within those fields. My new role, site reliability engineering manager, is a new field of engineering for me providing exposure into network engineering, infrastructure/platform and compute system engineering. It is allowing me to develop a more holistic understanding of how different types of engineering come together to deliver the SKAO. This year’s INWED theme is “enhanced by engineering”, how do you feel your work develop and enhancing the wider world?The SKAO consists of a diverse group of people from different backgrounds and disciplines all contributing to constructing the world’s largest radio astronomy observatory. We each contribute in our own individual way, facing challenges, and overcoming them collectively to design, build, test and deliver the observatory that will enhance society's understanding of our universe. This is motivational, working with great people and feeling part of a greater good – it provides value and purpose to what I do each day at the office to help, in my own capacity, to make the telescope a reality! Video transcript"With engineering I like figuring out how things work, using logic and creativity as well as maths and science to solve problems.""My role is allowing me to develop a more holistic understanding of how different types of engineering come together to deliver the SKAO.""The SKAO consists of a diverse group of people from different backgrounds and disciplines all contributing to constructing the world’s largest radio astronomy observatory.""We each contribute in our own individual way, facing challenges, and overcoming them collectively to design, build, test and deliver the observatory that will enhance society's understanding of our universe." Last modified on 20 June 2024'''
year_published = 2025
