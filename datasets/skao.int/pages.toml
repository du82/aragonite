["https://skao.int/en/science-users/118/ska-telescope-specifications"]
title = "SKA Telescope Specifications | SKAO"
description = "The detailed design and scientific requirements of the first phase of the SKA project (historically called SKA1) were finalised in 2013 and 2014 with the publication of the Baseline Design and the Science Requirements. This design has been modified in the intervening years and the telescopes now being constructed are briefly described below."
full_description = '''SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs SKA Telescope Specifications The detailed design and scientific requirements of the first phase of the SKA project (historically called SKA1) were finalised in 2013 and 2014 with the publication of the Baseline Design and the Science Requirements. This design has been modified in the intervening years and the telescopes now being constructed are briefly described below. The SKA designThe SKA in its first phase will consist of two telescopes: SKA-Low and SKA-Mid.SKA-Low will cover the frequencies 50-350 MHz, using log-periodic dipole antennas grouped into stations (aperture arrays), and SKA-Mid will cover 0.35-15.4 GHz, using offset Gregorian dishes.Each telescope consists of a dense core of ~1-2 km in size containing ~50% of stations/dishes, with the remaining receptors placed logarithmically along 3 spiral arms. The dense core provides excellent sensitivity to extended regions of low brightness and for pulsar and transient observations, while the 3-arm spiral provides a scale-free distribution of baselines, and so uniform sensitivity over a range of angular scales and excellent (u,v) coverage. The station/dish locations are fixed and so are not re-configurable. The details of the overall system design of the SKA telescopes is captured in the Design Baseline Description, while the required science performance is captured in the Level 0 Science Requirements. Further details, including projected performance, telescope roll-out and observing milestones, and tools for observation planning, can be found on the Documents, Scientific Timeline, and Tools webpages respectively. Array Layouts SKA-LowSKA-Low will consist of 131,072 log-periodic dipole antennas distributed across 512 aperture array stations of 256 antennas each. It will be located in the Murchison radio-Astronomy Observatory (Inyarrimanha Ilgari Bundara), Western Australia. Around 50% of the stations will be located within a 1 km diameter core, with the remaining stations organised in clusters of 6 stations spaced logarithmically on three spiral arms. The maximum baseline length will be around 75 km. Layout of the inner core of SKA-Low. The figure show the core and the first few clusters of stations of the spiral arms. The dots represent individual stations, each comprising 256 antennas. SKA-Low full array layout. The black dots represent station clusters. Each cluster consists of 6 stations, and each station consists of 256 antennas SKA-MidSKA-Mid will consist of 133 15-m SKA dishes and 64 13.5-m Meerkat dishes at the Karoo Radio Astronomy Reserve in the Northern Cape of South Africa. The core will be composed of around 50% of the dishes, randomly distributed within 2 km. The remaining dishes are spaced logarithmically on three spiral arms providing baselines out to 150 km. Layout of the inner core of SKA-Mid. The figure show the core and the first few dishes in the spiral arms. The dots represent individual dishes. SKA-Mid full array layout. The black dots represent individual dishes Frequency BandsSKA-Low has a single frequency band, while SKA-Mid initially has 4 frequency bands deployed ("first generation", Bands 1, 2, 5a, 5b). For SKA-Mid, Bands 3 and 4 are part of the Design Baseline, but won't be deployed until funding becomes available.TelescopeBandFrequency Range (MHz)Available Bandwidth (MHz)Notes (MHz)SKA1-LowN/A50 - 350300(1)SKA1-Mid1350 - 1050700(1) 2950 - 1760810(1) 31650 - 30501400(2) 42800 - 51802380(2) 5a4600 - 85003900(1) 5b8300 - 154002 x 2500(1)Footnotes: (1) Deployed as a first generation receiver: (2) Deployed when funding become available.Further, SKA-Mid is designed to work up to frequencies of 20 GHz, with a requirement on aperture efficiency at that frequency. The actual performance of the Mid dishes at 20 GHz remains to be determined (surface, pointing). If the dishes perform as expected, then a potential upgrade is the deployment of a frequency band for frequencies > 15 GHz is possible ("Band 6"), as part of a future Observatory Development Programme. The initial science case for observations at > 15 GHz can be found here. The useful highest operating frequency is still to be determined. SKA anticipated science performanceThe anticipated performance of SKA is captured in the plots below of sensitivity and survey speed as a function of frequency, compared with existing radio telescopes. Details can be found in the Anticipated Science Performance paper (undergoing revision - October 2024). The anticipated performance can also be explored via the SKA Tools. SKA1 sensitivity compared to existing facilities at similar frequencies SKA1 survey speed compared to existing facilities at similar frequencies The full SKA visionWhile the current focus is to deliver the SKA phase 1 (SKA1) as per the design baseline described above and in the linked documents, the SKAO keeps the vision of a much larger SKA alive. Such vision is sometimes referred to as SKA2 (i.e. the second phase of the SKA project), consisting in increasing both the number of receptors (stations/dishes) and baseline lengths for each telescope (extending to other African countries in the case of SKA-Mid), and perhaps the addition of other telescopes (survey dish array, mid-frequency aperture array). This major expansion is in addition to upgrades envisioned as part of the Observatory Development Program, which will primarily be aimed at improving the performance of the as-built SKA phase 1. While the actual scope of SKA2 is not fully defined the expansion may result in:4-10 x SKA1 sensitivity in the frequency range of 50 – 350 MHz10 x SKA1 sensitivity in the frequency range of 350 MHz – 15 GHz (including full frequency coverage)20 x SKA1 Field-of-View in the frequency range of 350 MHz – 1.5 GHz Increased Field-of-View at frequencies > 1.5 GHz Increase in the high frequency range of SKA-Mid to 25 GHz or higher20 x SKA1 maximum angular resolution On this page Last modified on 17 October 2024'''
year_published = 2025
