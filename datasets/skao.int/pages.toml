full_description = "Australia Canada China Germany Italy India The Netherlands Portugal South Africa Spain Switzerland United Kingdom Germany Germany joined the SKAO as a member in November 2024, having previously been an observer on the SKAO Council. The German SKA activities are organised and coordinated by the Verein für datenintensive Radioastronomie e.V. (VdR). The group links the German astronomical community with the SKA community in general and with industrial and political partners who are interested in the SKA. Its membership includes: Prof. Dr. Hermann Heßling (HTW Berlin, VdR chair) Prof. Dr. Karl Mannheim (University of Würzburg, VdR vice chair) Alexander Kappes (Max-Planck-Institut für Radioastronomie, Bonn, VdR head of office) German scientists represent the fourth largest contributors to the SKA science case. During the pre-construction phase, Germany was involved in 6 of the 11 design consortia, including the Central Signal Processor, Dish, Low Frequency Aperture Array, Science Data Processor, Telescope Manager and Wideband Single Pixel Feed consortia. News listing Germany becomes the SKAO’s newest member November 2024 Introduction The SKA Observatory has welcomed Germany as its newest member state. EU ambassadors welcomed to SKA-Mid telescope site April 2024 Introduction The SKAO and its South African partners have hosted a major diplomatic visit at the SKA-Mid telescope site in the... SKA-Mid prototype dish creates first light image January 2024 Introduction The first prototype dish of the SKA-Mid telescope constructed on site in South Africa has achieved first light. All news Last modified on 06 December 2024"
