["https://skao.int/en/opportunities/careers-opportunities"]
title = "Careers & Opportunities | SKAO"
full_description = "Careers and Opportunities We’re working on one of the biggest international scientific endeavours of the 21st century. Would you like to join us? To deliver our mission and realise our ambitious vision, we employ some of the world’s finest scientists, engineers, policy makers and specialists in many other fields, collaborating in a dynamic, inclusive environment. The SKAO is a place where everyone is treated with fairness and respect, where Equality, Diversity and Inclusion (EDI) is embedded within the DNA of the Observatory and its staff, where new ideas are allowed to thrive, and collaborations with global partners, local stakeholders, and other scientific facilities are embraced. We are a fast-growing organisation with international scope, working with partners in over 20 countries around the world. SKAO staff represent more than 23 different nationalities and we pride ourselves on fostering a friendly work atmosphere where national traditions are celebrated. Our staff enjoy a high degree of responsibility, flexibility and independence, and many undertake international travel (dependent on role and the global travel situation). We actively support continuous professional development, through providing interesting, challenging roles and opportunities. Recruitment portal Click here to see current job vacancies at the SKAO and with our partners Our values Our values are at the heart of who we are and what we stand for Our locations Discover our global footprint Team SKA Meet people from across our global partnership"
