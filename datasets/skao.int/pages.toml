title = "Science and Engineering Advisory Committee (SEAC) | SKAO"
description = "The Science and Engineering Advisory Committee (SEAC) is a key independent advisory body to the SKAO Council and the SKAO Director-General, established in accordance with Article 8(13) of the SKAO Convention (the governance framework). It has up to 21 science and engineering experts (May 2023) from the SKAO’s member countries and beyond. SEAC members are highly regarded specialists in topics of relevance to the SKAO and appointed for three years."
full_description = "Explore Opportunities Resources Partners News & Events Science Users SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs Science and Engineering Advisory Committee (SEAC) The Science and Engineering Advisory Committee (SEAC) is a key independent advisory body to the SKAO Council and the SKAO Director-General, established in accordance with Article 8(13) of the SKAO Convention (the governance framework). It has up to 21 science and engineering experts (May 2023) from the SKAO’s member countries and beyond. SEAC members are highly regarded specialists in topics of relevance to the SKAO and appointed for three years. SEAC including site visit in Australia, September 2024 MembershipMembers are appointed by the Council and include:a representative for each SKAO Member - appointed as independent experts who do not represent the Member’s interestsup to seven representatives-at-large, proposed to the Council by the Director-General to provide specialist expertise, and who may be from countries beyond the Observatory’s membershiprepresentatives from countries with Observer status at the SKAO CouncilThe Committee’s advice is based on the consensus view of the Committee. A Science and Engineering Advisory Committee also existed under the Observatory’s forerunner, the SKA Organisation.The membership of the SEAC is (April 2024):RepresentativeAffiliationCountry (SKAO Member)Prof. Naomi McClure-Griffiths (Chair)Australian National UniversityAustraliaProf. Kristine Spekkens (Vice-Chair)Queen's University in CanadaCanadaProf. Di LiFive hundred meter Aperture Spherical TelescopeChinaDr Gundolf WiechingMax Planck Institute for Radio AstronomyGermanyProf. Uday ShankarRaman Research InstituteIndiaDr Gianfranco BrunettiIstituto di Radioastronomia, BolognaItalyDr Wim van CappellenASTRONThe NetherlandsMs Marta GonçalvesPortuguese Space AgencyPortugalMr Tyrone van BallaSARAOSouth AfricaDr Antxon AlberdiInstituto de Astrofísica de AndalucíaSpainProf. André CsillaghyUniversity of Applied Sciences and Arts SwitzerlandDr Laura WolzUniversity of ManchesterUnited Kingdom RepresentativeAffiliationAt-large membersMr Brian Glendenning NRAO (USA) Dr Dale FrailNRAO (USA) Prof. Simon GarringtonUniversity of Manchester Dr Adrian RussellEuropean Southern Observatory Dr Gillian WrightUKATC (UK) Dr Liz HumphreysEuropean Southern Observatory ObserversRepresentativeAffiliationCountry (Observer/ Future Member)Dr Cherry Ng-GuiheneufCNRSFrance (SKAO future Member)Prof. Garrelt MellemaStockholm UniversitySweden (SKAO Observer) Rules and Regulations The Science and Engineering Committee must follow the SEAC Remit and Rules of Procedure: which explain the actions which the SEAC can take, and state the composition of the SEAC, rules relating to conduct and attendance, and how meetings work e.g. voting. Last modified on 20 February 2025"
