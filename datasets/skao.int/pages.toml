["https://skao.int/en/299/finance-committee"]
title = "Finance Committee | SKAO"
description = "The Finance Committee is a key advisory body to the SKAO Council (the Council) and is established in accordance with Article 8(13) of the SKAO Convention. Article 2 of the Financial Protocol of the SKAO states that the Finance Committee is expected to provide governance and oversight to make sure that SKAO follows the principles of sound financial management, efficiency, transparency and accountability in the planning and management of the financial resources (of the SKAO)."
full_description = "Explore Opportunities Resources Partners News & Events Science Users SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs Finance Committee The Finance Committee is a key advisory body to the SKAO Council (the Council) and is established in accordance with Article 8(13) of the SKAO Convention. Article 2 of the Financial Protocol of the SKAO states that the Finance Committee is expected to provide governance and oversight to make sure that SKAO follows the principles of sound financial management, efficiency, transparency and accountability in the planning and management of the financial resources (of the SKAO). Hybrid Finance Committee meeting at SKA HQ, September 2023 MembershipThese include:an independent Chairperson appointed by the Council in rotation from the members of the Finance Committeea representative for each SKAO Member appointed by their State or international organisation (voting)representatives from countries with observer status at the Council (no vote)Chairperson (independent): Mr Bishen Singh (NRF, South Africa)Member Representatives (November 2024)CountryRepresentativeAffiliationAustraliaMs Natalie WeddellDepartment of Industry, Science, Energy and Resources (DISER)CanadaMr Morrick VincentNational Research Council, Canada (NRC)ChinaMs Sun XiaoyunNational Remote Sensing Center of China (NRSCC)GermanyMs Julia RuchaMax-Planck-Gesellschaft (MPG)IndiaMs Arjit SagarDepartment of Atomic Energy (DAE)ItalyMr Vincenzo LozitoMinistero dell'Economia e delle Finanze (MEF)NetherlandsMr Jeroen ArtsMinisterie van Onderwijs, Cultuur en Wetenschap (MinOCW)PortugalMs Carolina Rego CostaFundação para a Ciência e Tecnologia (FCT)South AfricaMr Shawn BassonSouth African Radio Astronomy Observatory (SARAO)SpainMs Esther Martin MalagonMinisterio de Ciencia e Innovación (CIENCIA)SwitzerlandDr Francesca StockerState Secretariat for Education, Research and Innovation (SERI)United KingdomMs Sarah ChambersUK Research & Innovation (UKRI)ObserversCountryRepresentativeAffiliationFranceMs Stephanie Le VanLe Centre National de la Recherche Scientifique (CNRS)JapanDr Takuya AkahoriNational Astronomical Observatory of Japan (NAO)South KoreaProf. Bong Won SohnKorea Astronomy and Space Science Institute (KASI)SubcommitteesThe Finance Committee has three supporting subcommittees for scrutiny, advice and recommendations to the Council. Each Member of the SKAO (State or international organisation) appoints their own representative to the Subcommittee. Associate Members of SKAO can appoint a representative to observe at the meetings. Each subcommittee has delegated responsibility from the Finance Committee for oversight of the SKAO of:Administration Subcommittee: administration management including, but not limited to, review of staff remuneration and amendments to the SKAO Staff Regulations.In-Kind Subcommittee: in-kind procurement processes. In-Kind contributions are non-financial (such as providing staff for a project), and the Subcommittee evaluate, review and approve a cost-book value of the In-Kind contributions.Tender Subcommittee: procurement processes. Rules and Regulations The Finance Committee follow: Finance Committee Terms of Reference: which explains what the Committee must review including: financial management - budgets, payment schedules and member contributions, auditing and risk management, and annual accounts finance planning and policy – rules and regulations, long-term planning, valuing assets and assessing participation in phases either for later development or outside the SKA project Observatory membership – related financial contributions, conditions and liabilities Administrative oversight - review of SKAO staff remuneration and related policies and regulations Procurement – contract awards – both competitive and single/sole source, and in-kind contracts, or any Country-of-Origin issues Finance Committee Rules of Procedure: which explain the composition of the Committee, rules relating to conduct and attendance, and how meetings work e.g. voting. the Financial Protocols (Annex B to the SKAO Convention): which states that the SKAO must follow principles of sound financial management and explains how the Funding Schedule (how much each member pays) is reviewed and managed. High level details are also provided on methods of budget approval, assets provided by host countries, and loans and liabilities. Last modified on 12 November 2024"
