title = "SKAO Science Contacts | SKAO"
description = "Scientists at SKAO are primarily members of the Science Team and the Science-Operations Team, although they can be found within other teams depending on their primary role in the observatory. In addition to their observatory roles, they are actively engaged in their own personal scientific research"
full_description = "SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs SKAO Science Contacts Scientists at SKAO are primarily members of the Science Team and the Science-Operations Team, although they can be found within other teams depending on their primary role in the observatory. In addition to their observatory roles, they are actively engaged in their own personal scientific research SKAO Science TeamThe SKAO Science Team are the main channel through which the science community engages with the Observatory. The team provides regular updates to the community on the current design, construction progress, and potential future upgrades. The team safeguards and champions the scientific capabilities of the telescopes and the accomplishments of the Observatory. They are active scientists undertaking independent research.NamePositionResearch AreasDr Robert BraunDirector of Science Dr Anna BonaldiSenior Scientist Dr Tyler BourkeSenior ScientistGalactic star formation (low-mass dense cores/protostars; magnetic fields; outflows and jets)Dr Philippa HartleyScientist Dr Wendy WilliamsScientist The science team are available to give colloquia/seminars. Please email any requests to: science@skao.intIndividual team members can be contacted at first.last @ skao.int Former Science Team Members: Dr Hao “Harry” Qiu , Dr Simon Purser, Dr Jeff Wagg, Dr Jimi Green , Dr Evan Keane , Dr Joseph Lazio, Dr Minh Huynh SKAO Science Working GroupsThe Science Working Groups (SWGs) are scientific advisory bodies that provide input to the SKAO on issues related to the design, construction, and future operations of the SKA that are likely to affect the Observatory’s scientific capability, productivity and user relations. They provide forums for the science community to interact on specific SKA science areas, including planning for observing with the SKA.More information, including descriptions of the individual SWGs and their membership, is available here.If you are interested in participating in the SKAO Science Working Groups, please complete this form. Last modified on 26 February 2025"
