title = "United Kingdom | SKAO"
description = "The UK is home to the SKA Observatory’s international headquarters at the Jodrell Bank site in North West England. As well as hosting the HQ, the UK is also making a major commitment to the construction and operation of the SKAO's telescopes. The UK is contributing 15% of the cost of constructing the SKAO from 2021 to 2030 and is the largest contributor to the observatory. In addition, UK engineers, technologists and astronomers will be at the forefront of making the SKA project a success. Scientists and engineers at UK universities and institutions are involved right across the design of the SKAO including from the Universities of Manchester, Oxford and Cambridge and from the UKRI STFC’s Daresbury Laboratory, STFC’s Rutherford Appleton Laboratory and STFC’s UK Astronomy Technology Centre."
full_description = "Australia Canada China Germany Italy India The Netherlands Portugal South Africa Spain Switzerland United Kingdom United Kingdom The UK is home to the SKA Observatory’s international headquarters at the Jodrell Bank site in North West England. As well as hosting the HQ, the UK is also making a major commitment to the construction and operation of the SKAO's telescopes. The UK is contributing 15% of the cost of constructing the SKAO from 2021 to 2030 and is the largest contributor to the observatory. In addition, UK engineers, technologists and astronomers will be at the forefront of making the SKA project a success. Scientists and engineers at UK universities and institutions are involved right across the design of the SKAO including from the Universities of Manchester, Oxford and Cambridge and from the UKRI STFC’s Daresbury Laboratory, STFC’s Rutherford Appleton Laboratory and STFC’s UK Astronomy Technology Centre. UK’s contribution at a glance The UK’s research organisation the Science and Technology Facilities Council (STFC) coordinates the UK interests in the SKAO, working with the academic and industrial community and the UK government’s Department for Business, Energy & Industrial Strategy (BEIS). The £20m expansion of the Jodrell Bank site to create the SKAO global HQ was co-funded by BEIS. This was through: The STFC The University of Manchester Cheshire East Council. Jodrell Bank was recognised as a United Nations Educational, Scientific and Cultural Organisation (UNESCO) World Heritage Site in 2019 for its contributions to radio astronomy. Jodrell is also the central hub of the UK’s e-Multi-Element Radio Linked Interferometer Network (e-MERLIN) national facility – a network of seven radio telescopes spread across the UK, including the iconic 76m Lovell Telescope, that together form one of the SKA's pathfinder instruments. Designed and delivered by the UKThe STFC has already awarded more than £15m to UK institutions to deliver key elements during the construction phase of the project. In addition, SKAO has awarded several contracts to UK industry worth £15.5m.UK institutions involved in design and construction phases include:University of CambridgeUniversity of ManchesterUniversity of OxfordUK industrySTFC Daresbury LaboratorySTFC Rutherford Appleton LaboratorySTFC UK Astronomy Technology Centre.The UK has been leading some of the most important elements of the SKAO:Signal and Data Transport (SADT): The University of Manchester led the design of the three data transport networks that will be the backbone of the SKA telescope, it will play a consultant type role during construction to SKAO and UK industry. It also hosts the SKA HQ at its historic Jodrell Bank Observatory. https://www.jodrellbank.manchester.ac.uk/research/groups/square-kilometre-array/Science Data Handling and Processing (SDHP): An international group of scientists led by the University of Cambridge designed the “brains” of the SKA-Low and SKA-Mid telescopes. Through UK industry and university groups, including Cambridge, Oxford and Manchester, the UK is leading the delivery of the SDHP – the high-performance computing element of the SKAO. This includes the software and algorithms responsible for producing science-ready data.Observatory Management and Control (OMC): Through UK industry and university groups, the UK is playing a critical role in the delivery of OMC, responsible for the near real-time monitoring and control of the telescopes and associated hardware, as well as the management of the science proposals and observations.Cryostats: UK industry will lead the construction of cryostats – the essential cooling components – for the feed for Band 3, 4 & 5 for the SKA-Mid dishes. https://www.physics.ox.ac.uk/research/group/square-kilometre-array-skaSKA-Low Signal Processing System (SPS): The University of Oxford and RAL TD will lead on the firmware and rack integration required for Low SPS, a critical complex element of the Low telescope and to which the ultimate performance of the Low telescope depends on.SKA-Low antenna and array design: The University of Cambridge led the design of the wideband log periodic antenna and low-noise amplifier for SKA-Low from its conception until the completion of the Low Frequency Aperture Array (LFAA) design phase in 2018. This included leading the design of antennas used in the very first SKA-Low full prototype station in Western Australia, known as AAVS1. Currently, Cambridge continues to support the construction of SKA-Low with contributions to the array layout analysis and design, the electromagnetic modelling of the stations and Low science predictions. Read more in this feature article on the SKA-Low design process. The UK plays a leading role in the SKAO and the development of its telescopes. With the skills and expertise of our researchers and colleagues in industry, the UK will deliver the computing brain and nervous system of the telescopes to enable the observations and unlock the science. Author of quote:Professor Mark ThomsonExecutive Chair of STFC and member of the SKAO Council Tendering to SKAOAs the UK is an SKAO member, SKAO assists the UK in achieving return on investment through contracts placed with UK companies. The STFC coordinates and manages the UK’s involvement and subscription with SKAO, and as part of this STFC’s Business Opportunities Team acts as the UK industrial liaison office. The team supports UK companies interested in working with SKAO.The work allocated to the UK to date includes:software development, managed using SAFe Agile methodologycomputer hardware for the SKA-Mid and SKA-Low central processing facilitySKA-Mid cryosystemSKA-Mid band 5 cryogenic receiverssynchronisation and timingSKA-Low antenna assembly (includes dual polarised log-periodic antennas, single-ended low noise amplifiers (LNA), and radio frequency (RF) coaxial cables)SKA-Low signal processing system cabinets (includes racks, rack management boards, firmware and other components). In kind work Some of the construction work has been allocated to UK national laboratories at STFC and UK universities which have developed detailed knowledge and expertise during the design phase. SKAO may issue additional tenders from time to time which are expected to be competed for by some or all members. This may include opportunities to provide catering services, facilities management and banking services. How UK companies can access opportunities at the SKAO: https://www.ukri.org/about-us/stfc/stfc-business-opportunities/tendering-to-skao/ News from the UK SKAO Africa Programme to broaden human capital development efforts November 2024 Introduction The SKAO has signed a memorandum of understanding with the UK Science and Technology Facilities Council (STFC) with the goal... EU ambassadors welcomed to SKA-Mid telescope site April 2024 Introduction The SKAO and its South African partners have hosted a major diplomatic visit at the SKA-Mid telescope site in the... SKAO Director-General recognised in UK New Year Honours January 2024 Introduction Prof. Philip Diamond has been awarded a Commander of the British Empire (CBE) medal in recognition of his services to... All news Contact George Madden – Head of SKA Project Office Telephone: 01793 442075 Simon Haynes – SKA Project Office Telephone: 01793 442127 On this page Last modified on 11 December 2024"
