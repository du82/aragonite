full_description = "SKAO News & Events This is a one-stop portal for all SKA Observatory media activities, including our latest news articles, publications, and events. We encourage journalists and the public to use the SKAO media kit in their news releases, features, blogs or websites, and simply request that the material is properly credited as indicated in the material. If no indication is provided, please simply credit the SKA Observatory. You can refer to the copyright notice for full terms of use. News Read about scientific, technical, and organisational developments as they happen, as well as important milestones the SKA Observatory has reached. Events We regularly attend events or conferences to increase awareness of the SKAO's scientific objectives and progress among scientists, policymakers, industry, educational establishments, local communities, and the general public. Contact magazine Contact is the SKAO's magazine. A public-friendly publication produced by SKAO’s Communications team, it covers the broad range of SKA-related activities taking place around the world in a single publication. Contact is published via the electronic publishing platform Issuu, and is optimised for mobile viewing. Print files are also available to print the magazine locally. Contact: The SKAO Magazine Read the latest issue here"
