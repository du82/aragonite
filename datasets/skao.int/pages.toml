["https://skao.int/en/science-users/science-working-groups/106/epoch-reionization"]
title = "Epoch of Reionization | SKAO"
description = "The first of the working groups addressing the history of our universe, looking at the furthest cosmological distances, redshift range ~6 to ~25."
full_description = 'Cosmology Cradle of Life Epoch of Reionization Epoch of Reionization SWG members Extragalactic Continuum Extragalactic Spectral Line Gravitational Waves High Energy Cosmic Particles HI Galaxy Science Magnetism Our Galaxy Pulsars Solar, Heliospheric & Ionospheric Physics Transients VLBI SWG Monthly Updates Epoch of Reionization The first of the working groups addressing the history of our universe, looking at the furthest cosmological distances, redshift range ~6 to ~25. Epoch of Reionization Working Group Introduction When did the first generations of galaxies form? What were their properties? How did they interact with each other? What is the structure of the intergalactic medium during the first billion years? What is the thermal and ionization history of the baryons? The footprint of these processes is imprinted in the Hydrogen gas the major constituent of the intergalactic medium) and can be probed by observations of its hyperfine spectral line transition (occurring at the rest frequency of 21-cm). We plan to use the SKA to carry out the deepest observations of the diffuse neutral Hydrogen gas to trace the evolution of cosmic structure in the 6 < z < 30 range, unveiling the epoch when the very first luminous structure were born and how their growth ionized the intergalactic medium. Working Group MembershipMembers of the the Epoch of Reionization Working group can be found here.We actively encourage interested researchers to participate in the working group.If you are interested in joining the group, please complete this form.The current co-chairs are:Adrian Liu (McGill University, Canada), adrian.liu2 AT mcgill.caCath Trott (ICRAR – Curtin University), Cathryn.Trot AT curtin.edu.auGuidelines on who can join the group can be found here.The SKAO Project Scientist liaison is Anna Bonaldi (contact details here). EoR Working Group Documentation Download the EoR banner here The EoR chapters from "Advancing Astrophysics with the SKA" (2015) can be found here Previous ChairsAbhirup Datta (2019-2024)Andrei Mesinger (2019-2024)Gianni Bernardi (2017-2019)Garrelt Mellema (2017-2019)Jonathan Pritchard (2015-2017)Leon Koopmans (2013-2015) Last modified on 05 August 2024'
