["https://skao.int/en/science-users/557/advancing-astrophysics-ii"]
title = "Advancing Astrophysics II | SKAO"
description = "The international science community is invited to contribute to the new, updated book documenting the full breadth of science to be addressed by the SKA telescopes."
full_description = "SKAO Science Meeting 2025 Advancing Astrophysics II SKA Telescope Specifications Scientific Timeline Science Working Groups Science Meetings SKA Tools Data Challenges Relevant Documents SKA Regional Centres SKAO Science Contacts Science Users FAQs Advancing Astrophysics II The international science community is invited to contribute to the new, updated book documenting the full breadth of science to be addressed by the SKA telescopes. For all the latest information about the Science Meeting taking place in Görlitz in June 2025, including the programme, registration details, and updates, please visit our dedicated webpage here. Stay informed and plan your participation in this event! Next year will mark a full decade since the publication of Advancing Astrophysics with the Square Kilometre Array: the updated volume of the book written by the science community to document the scientific advances that will be enabled by the SKA telescopes. In the intervening years, designs have reached maturity, construction has begun, and the SKA Organisation has transitioned into an Observatory and intergovernmental organisation spanning five continents and both hemispheres. Meanwhile, observations made using SKA precursor and pathfinder telescopes have shed new light on existing scientific conundrums, and uncovered brand new phenomena. The SKAO is now poised to begin the commissioning of its first test array and observing activity will ramp up quickly, with the first science verification data to be made publicly available to the community in 2027 and early operations beginning in 2029. At this exciting moment in time we invite the community to contribute to a new version of the SKAO science book, with the aim of providing an up-to-date coverage of the science questions that will be addressed by the SKA telescopes. The updated book will be written against a mature set of telescope specifications with a suite of tools and documents based on detailed design work and site characteristics of the SKA telescopes. It will capture both updates to existing science cases and brand new ideas. Book chapters will be coordinated through the SKAO Science Working Groups (SWGs), the set of scientific advisory groups that provide input to the SKAO from the perspective of potential users. Membership of the SWGs is open to any actively publishing researcher with a scientific interest in the SKAO. Please use this form if you would like to apply for membership of one or more SWGs. Expressions of Interest in book chaptersThe call for Expressions of Interest has now closed. We thank the scientific community for such a wide and enthusiastic response. Expressions of interest are under review by the chairs of the associated SWG(s). All viable science ideas will be invited to be prepared as chapters for the book. Chapter submissions will be due in September 2025, when a peer review round will take place. Full Instructions to Authors and a LaTeX template can be found here and here.For all enquiries about the new SKAO science book please contact us at advancingastrophysicsii@skao.int.Goal of individual science chaptersEach chapter will be a self-contained description of a science application of the SKA telescopes, and is to include background and motivation. Main focus of a chapterDemonstrate the science outcomes that are enabled by the capabilities of a particular component of the SKA design baseline, Array Assembly 4 (AA4).Supplementary focia) Document the extent to which scientific outcomes might be achieved by the end of staged delivery (AA*); b) Document the types of enhancements beyond the design baseline that could further support the science goals. Also to considerHighlight synergies with other instruments and commensalities with other science cases.Current and past editions of the SKA Science BookAdvancing Astrophysics with the Square Kilometre Array (Bourke et al., 2015)Science with the SKA (Carilli and Rawlings, 2004) Last modified on 13 February 2025"
