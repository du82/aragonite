["https://skao.int/en/science-users/science-working-groups/104/cosmology"]
title = "Cosmology | SKAO"
description = "The Cosmology Science Working Group addresses the history of our universe at redshifts of ~0.5 to ~6."
full_description = '''Cosmology Cosmology SWG members Cradle of Life Epoch of Reionization Extragalactic Continuum Extragalactic Spectral Line Gravitational Waves High Energy Cosmic Particles HI Galaxy Science Magnetism Our Galaxy Pulsars Solar, Heliospheric & Ionospheric Physics Transients VLBI SWG Monthly Updates Cosmology The Cosmology Science Working Group addresses the history of our universe at redshifts of ~0.5 to ~6. Cosmology Working Group Introduction The SKA will enable pioneering cosmological surveys, probing immense volumes of the Universe which to date have been unexplored at radio wavelengths. This will be done by observing emission in both radio continuum and the 21 cm spectral line of neutral hydrogen (HI). The position in the radio sky of million of galaxies, and intensity maps made by their collective HI emission, trace the large-scale structure of the Universe, which can reveal the form and growth of dark matter structures over time. Light travelling from distant galaxies is bent by the intervening dark matter, thus creating small shape distortions (weak gravitational lensing) that can be measured to detect this otherwise invisible component. These surveys will enhance our understanding of various aspects of cosmic history, including the faint imprints of the primordial period of inflation, the early stages of galaxy formation, as well as the nature of gravity, dark energy and dark matter which determine the growth of late time large-scale structure. Working Group MembershipMembers of the the Cosmology Working group can be found here.We actively encourage interested researchers to participate in the working group.If you are interested in joining the group, please complete this form.The current co-chairs are:Ian Harrison (University of Cardiff, UK), harrisoni@cardiff.ac.ukMarta Spinelli (Observatoire de la Côte d'Azur, France), spinemart@gmail.comGuidelines on who can join the group can be found here.The SKAO Project Scientist liaison is Anna Bonaldi (contact details here). Cosmology Working Group Documentation Download the Cosmology banner here The Cosmology chapters from "Advancing Astrophysics with the SKA" (2015) can be found here The "Cosmology with SKA1 Red Book" (2018) can be found here Previous ChairsStefano Camera (2019-2023)Laura Wolz (2017-2021)Richard Battye (2017-2019)Mario Santos (2015-2017)Xuelei Chen (2015-2017)Roy Maartens (2013-2015) Last modified on 05 August 2024'''
