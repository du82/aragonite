full_description = "My (emotional) interview with Tommaso Di Bartolo, the Web3 expert who made me start my blog September 8, 2022September 8, 2022 by Skarredghost Today I publish a very special article. You know that one month ago my blog made its 6th birthday and I promised some special article about it. Well, today I fulfill that promise by interviewing Tommaso Di Bartolo, serial entrepreneur, marketing expert, and mentor, who during the summer of 2016 suggested me to start a blog to promote my startup of that time, Immotionar. We never saw again after that moment, we didn’t even have a real opportunity to speak or to connect in any way. He didn’t even know what positive effect he had caused on me. I recently saw that he joined us in the metaverse field, and so I asked him to speak with him for an interview, because that day, with just two sentences, he changed my life, and I wanted just to say thank you to him. It’s also beautiful that he also joined my same field now, and so I thought that it could have been great to speak with him also about his current work with immersive realities and Web3. The interview is, as usual, provided both in video and in (slightly edited) transcripted version. Towards the end of the video, you can see the moment where I, with much emotion, tell him the story of how we met and he gave me that advice, and I can say it has been one of the deepest and most emotional moments of my blogging life. It’s a short-circuit between now and then, with many things that have actually happened in the middle. I thank a lot Tommaso for the time he dedicated to me despite his busy life, and I hope you will enjoy this interview: Hello, Tommaso! Antony, nice to meet you. Thanks for having me. For me, this is a bit of an emotional moment because as you will discover during the interview, Tommaso is the person that made me start my blog six years ago. One month ago, for the 6th birthday of my blog, I really wanted to reconnect with him. It’s like six years we don’t have a conversation with each other. It’s like a magical moment for me. I’m happy to be here with you, Tommaso. For the people that don’t know you, why don’t you introduce yourself a bit? Antony, first of all, I’m super humbled to reconnect. The fact that you announced that this is a special moment for you, it’s a special moment also for me. Roughly six years ago, when we met in the progress of you building and learning how to start up, I vaguely remember that I might have dropped something like, “Content is important,” or maybe, “Sharing with others what you’re doing is important.” I’m glad to see that you followed the advice and that it makes you happy because ultimately, all we seek as human beings is to be happy in what we do because as a reaction and a result of that you’ll be successful within and then outside of you. Tommaso Di Bartolo (Image from Forbes) About myself… real quick. I’m, as most of you might have guessed, based on my name, an Italian citizen who graduated then in Germany. I lived in Germany for almost two decades. I traveled through London on my quest and my adventure to seek the crazy land and the land of opportunity, which is then ultimately Silicon Valley. I moved here almost 12 years ago. That’s the geographical side of things. On the business side of things, I’m a typical Silicon Valley guy. I started in tech in ’98. I started then my first company, roughly around the dotcom burst 2000, 2001. Fast forward, I did four startups with two exits. Actually, for those who might follow me online, I just started my fifth startup after six years of being apart. It’s a metaverse that connects the physical world with the digital world and takes basically the engagement limitation of web2 into a more immersive, and to a more rewarding world. Anyhow, that’s my fifth startup that I’m creating right now. I’m part of UC Berkeley, where I teach entrepreneurship focused on the metaverse and web3. I’m a two times author, and the most recent book is Navigating the Metaverse, which I’m humbled that Wiley published in May this year, which is within the top one, two, three books globally about the metaverse. I do invest in startups. I’m part of a couple of startups in the metaverse. That’s about myself in a nutshell. It’s good because when we met each other, of course, I was already working in VR, while you were in other fields, and now we reconnect here, thanks to the metaverse. Why have you decided to enter this metaverse field with both a startup and a book? Where do you see its full potential? My entire life has never been an active decision, but more a result of curiosity. As an entrepreneur, what should lead you is curiosity. You should be always curious about things, because I believe very strongly, Antony, that curiosity leads to execution, and action. You’re curious about everything, you can re-invent anything… and then it takes you to action. Once you start executing, you start understanding if the thing that you’re executing is connecting with you. That’s what I call the moment of you discovering your talents. This is what led me in my now over 20 years, two decades of being an entrepreneur through several topics, such as the topic that I had. My previous one was mobile, before that was cloud computing, and then it was security. Now basically, the metaverse is the consequence of learning. The first time that I got involved in crypto was really in 2012, 2013, when I was doing my third startup. It was through a business partner of mine, who actually gave me a hint about this digital currency. To be honest, I totally diminished that. I said, “Well, this doesn’t sound very legit.” Then fast-forward, I got invited to give a class at UC Berkeley about go-to-market in the space of blockchain. This was 2017. I got more and more involved, so stay tuned on what’s going on. I joined as a retail investor, obviously in the alternative coins and the general, Bitcoin and Etherium space, which then matured me into early 2020 digging into this immersive world, this world of ownership, this world of decentralization. I started observing that this provides a new engagement level that is changing human behavior, a new engagement level that is groundbreaking compared to what web2 could empower. That’s kind of in a nutshell, Antony, how I got involved into the world of metaverse and web3. I had the early suggestion to start writing a book with Cathy Hackl and Dirk Lueth, which are my co-authors of the book called Navigating the Metaverse. Cathy Hackl is known as the “godmother of the metaverse”. By the way, I always used to joke with her because I say, you know, “As a Sicilian, I cannot say I’m the godfather of the metaverse because it doesn’t sound right.” [laughs] Anyhow, that’s about how I got into this. The book Navigating The Metaverse (Image by Wiley) Yes, it’s fun. I also love Cathy, I met her a few times at some XR event. She’s amazing. She is. I know about this book, but why don’t you tell us what’s inside? I mean, what are the greatest lessons that people can get from it? Well, the subtitle of the book is “a guide to limitless possibilities in Web3”. First of all, we introduce kind of the framework and the ecosystem of this web3 world. We answer the questions “how do I understand web3? What are the components of web3?” I would say, it’s not a technical perspective, but it’s almost a non-technical perspective. Really, people that are not in tech, but maybe in charge of either entrepreneurs or executives or managers, they want to dig into this topic. It’s a light way of you getting into the ecosystem, then understanding how to start out. The importance and definition of why economy within the metaverse is fundamental. We dig into the topic of NFTs and the relation between NFT and the metaverse. Why NFTs and NFTs in the metaverse? I designed there a commercialization quadrant, which explains for the target audience how you should plan out a strategy when you’re thinking about distributing or commercializing NFTs throughout the various distribution channels out there. We have a chapter in which we describe how to measure success in the metaverse. In there, I specifically dig into the topic of the difference between advertisement and the future of advertisement, which I coined as Joint Value Creation, JVC, which gives you basically an understanding of how to create value within the metaverse. Definitely, a book that you don’t need to be an engineer to understand, but it guides you and it gives you a better perspective of the opportunities, what you could do, how you can start. Tommaso on Stage as a keynote speaker. He is always very energetic Very cool. The book can be bought on Amazon, by the way. But I want to get some advice for free for our readers, since you are an entrepreneur and an expert also in marketing. There are lots of people now entering the metaverse/web3 hype… how can someone create now a company that can survive all the buzz, all the competition in the metaverse field? From an entrepreneurial perspective, I would say that this is most probably the most exciting time that we have ever had. When I started my company after the dotcom burst, my first company, I always had the kind of this crying, because I had missed the opportunity as an intrapreneur. I was there in tech already because I started in ’98 but not as an entrepreneur. I kind of said, “Oh shoot, I missed this big wave. This initial wave.” Ultimately I had no reason to cry because two decades into it, I actually came to the very intriguing phase which was the phase post the hype. To entrepreneurs I say: “In what phase are we in?” We are in a phase in which humankind is changing its behavior. Every time that we have friction and behavioral change, there are tons of immense opportunities. Step number one, stay curious. Don’t say, “I don’t know”. You always know based on what you dig in, based on what you read. Keep yourself active. Then start to understand one thing: every time that you do a startup, the main principles are always the same. The number one is what problem are you solving and for whom. The way that you are then solving this problem is the what. The fact that we have now Web3 underlaying with ownership, traceability, visibility, and potentially unique digital assets… it’s just the how you’re doing it. What problem are you solving? Why are you solving this problem? It’s fundamental. Keep yourself curious, dear entrepreneurs. Start to understanding a fundamental problem, and then connect, obviously, with things that are more inclined to the most recent needs of humankind… which is what? We have been asking for traceability. We have been asking for visibility. We have been asking to co-create things. We have been asking that we were overwhelmed with information. We have been asking that ads are broken, because we don’t want to be bombarded. These are all signals that we as an entrepreneur need to understand. Then the question is, “What throughout those signals can I solve? Then how can I solve it with web3 technologies?” That’s in a nutshell, Antony, what I would suggest to any of your listeners. Since many of my listeners are like me, come from the tech world and we totally suck at marketing, to be honest, do you have also some advice on how to do marketing? Is there a different way to market a web3 company from a traditional company? Do you have some piece of advice for us? The main fundamental difference is that in Web2, what we all were trying to achieve is to have followers. Actually, let me zoom out a second. In Web1, we were basically creating websites in order to invite people to visit your information in your product. This is when it started to say, “Visit our website, www I don’t know .com.” This actually then matured because we had more and more websites and people were proactively seeking information and products. Then the technological advancement with the mobile phones and then the social media said, “Why do we make those people look for something? Why don’t we give them information in the palm of their hands?” That’s basically was enabled through the push notifications that were pushed to your mobile phones. That’s when social media started really becoming strong. As fundamental to the social media, we have the business model of the ads and the advertisement. We went from www– “Visit our website,” to, “Follow us on Twitter, Instagram,” and so on. Then we started understanding that we were overwhelmed with information. That the way that we were creating ads was broken because we did not really engage. This moved then also together with, not only with the needs, but with the technology advancement, to a point that we are today with web3, with the blockchain, visibility, and ownership that allows us now to create immersive experiences. Instead of saying, “Visit our website or follow us on…” The future will be, “Experience us in…” An experience means that you will for the very first time, we will for the very first time, no longer be bombarded with outside in content, but we will be having immersive, dedicated experience that will touch upon all of our senses, not just our eyes, but eventually our smell, our kinetics, so that we can focus on what we are looking at, so that every content piece is actually an experience. It’s an event if you so want. At the center of all this, we will be having an economy, a supply and demand of digital assets that are also unique. This digital economy will so surpass then the economy, the GDPR of every single country that we are seeing because there is more opportunity to do in the digital than in the physical world. As Mr. President says, the metaverse expands the current internet (Image by Alvin Wang Graylin) I want to finish this topic of the metaverse asking what’s Tommaso Di Bartolo’s vision of the metaverse in 10, 15 years from now? I have a very clear vision, a very clear belief on where this entire metaverse realm is going, and by the way, I finalize that in my book. I finalized that in my course. Before I get into vision, for those non-technical professionals, who would like to actually learn more about the metaverse on how to metaverse, what risks and what metaverses are out there, you can go on almameta.xyz and sign up on a course, which is a course that I was asked to run outside UC Berkeley, so that everybody as a non-technical professional would have it available. There are three visions, if I reverse engineer my vision of the metaverse. Number one of the metaverse is that we, the humankind, within the next years, will have and switch the entire educational system into an immersive way. The reason for that is that the current educational system is broken. Not only it is expensive and it’s exclusive, but it’s also very fragmented and no longer meets our needs of learning with content. The metaverse will allow through its immersiveness to create micro contents. Those micro contents, we will be able to track them and for tha"
