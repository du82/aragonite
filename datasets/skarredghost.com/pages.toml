full_description = "Should you attend XR events? Pros and cons of going to exhibitions December 19, 2024December 19, 2024 by Skarredghost It’s the end of the year, and like every December, it is the time to make a balance about how the past year went. There is a particular aspect of my professional year I want to tell you about and it is the attendance at XR events. This year, since my main job vanished and so I had more time, I decided to attend more XR-related events and see what outcomes I could obtain from these opportunities. I’ve traveled really a lot, visiting countries like Italy (my country), China, the USA, Finland, England, Germany, and the Czech Republic, to name a few. It’s been an interesting experience, where I felt like a rockstar doing a world tour. Now that my 2024 world tour is finished, and I am preparing for my next year (that starts with a new trip to CES), it is the right time to take stock of all these trips and all the events I attended and examine what I invested to go there and what I obtained in exchange. Since I always like to share the knowledge I get with you, I’m writing for you the result of this thorough analysis I did, listing what I think are the pros and cons of attending our industry events, and adding some personal pieces of advice to help you in deciding what to attend and what not. Attending events: the Pros Me trying the Vive Focus Vision at Match XR Let me give you a list of the reasons why you should go to XR events. Enlarging the network One of the most important reasons why we go to physical events is to enlarge our network of people we know in our field. For sure creating connections on social media is important, but when you are in a place where there are thousands of people all operating in XR, it is very easy to make many new XR friends. There are also some people that are not very reactive on social media or who get too many connection requests and so are blocking most people (have you ever had a connection request blocked on Linkedin because you were asked the email of the other person?), so it’s hard to socialize with them online, but if you are in front of them in real life, it is easy to get a connection. There are some opportunities to meet people in a physical event that are just unbeatable. Events also invite important speakers, who are totally out of your league, but you may have a chance to meet when you are there. For instance, thanks to AWE US I have made a picture with the previous Unity CEO John Riccitiello (there is also a fun story associated with him), and with the father of modern VR Palmer Luckey. After 10 years, I managed to meet him! It was a magical moment for me I always say that the network of people you know is one of the most precious assets you have in your professional life, so it’s very valuable to go to physical events to enlarge it. Sometimes just one person that you have met during an event can be a revolution for your working life for the upcoming years. For instance, I met the game designer Max Ariani at a Global Game Jam event, and around one year later, we together created our consultancy agency New Technology Walkers, and a few years later, our mixed reality game HitMotion: Reloaded. Deeper connections It’s not that you only make many connections, but you also manage to create deeper and more meaningful connections. Social media interactions are usually snackable, but when you are in person, you manage to spend even a long time with other people, and do interesting activities or have profound conversations. I love social media, I love XR, but nothing beats meeting in person yet. When you meet in person, sometimes you can also create a deep connection with someone very quickly and then this bond remains for many years later. I have some nice examples of this happening to me in recent years. One of them is Christian Steiner that I met at the XRCC in Berlin around 6 months ago: we got along so well in the three days of the event that we are still very connected now. But there are many other examples, like a person I met at AWE US in Los Angeles, or another one I met in China almost two years ago. Christian Steiner was one of the mentors of the XRCC event, so we had the occasion to spend a long time together (Image by XRCC) A deep connection with someone is more valuable than 10 shallow connections. A person you are friends with is a person that enriches your life, at first personally, and then also professionally. If you need some help with your work, this person is for sure willing to help you, while the other guy you just met and exchanged business cards with is not going to care. Be careful that you can’t force a strong connection with someone, you just have to be a fit. But I strongly suggest you look for this kind of meaningful connection during your trips: if I look back at my many trips in 2024, this is the most valuable thing I got from them. The fun Christian Steiner and me during the XRCC party: work hard, play hard they say… Every event has some sort of after party, or dinner together, or just moments with people going around the city and chill. Every event has some fun moments: some are more hardcore, others are more relaxed, but all of them have it. And they are all fantastic: there’s nothing better than just spending some fun moments with the people of the VR communities! Fun is good for the spirit because it lets you vent away the stress and feel happier. But it is also good to create the deeper connections I was mentioning you above. I usually say that the day of the event is when you exchange the business cards, and then the evening is when you truly become friends with people. The business opportunities A selfie with me, AWE’s head Ori Inbar, and Pico’s Heitor Bravi. There is also the nape of SyncReality’s Cyril Tuschi Of course, you want to go to events also to meet people to have business with. You may be seeking partners or customers, and at tech events, you can meet both of them. Many people from many companies participate in the biggest XR events: if you do your homework and organize some meaningful meetings before departing, you can have opportunities you wouldn’t have had by staying at home. Sometimes, if people do not answer on social media to your meeting request, you can even just wait for them to go off the stage if they are speakers, and have a chance to speak with them. I myself have discussed many business opportunities at VR events: for instance, when I was at AWE US, one of the main reasons for me to be there was to talk in person with people of a certain company to evaluate collaborations related to the development of VR applications. We are in 2024, and all of us are used to Zoom, Teams, Meet, and all these pieces of software. I have signed my contracts remotely, but the trust that you get by meeting someone in person is still incomparable. And if you are good at selling, also in person you have more opportunities to “convince” the other person to collaborate with you (unluckily I’m not a great sales guy, though…). The reputation gain Me on the AWE EU stage talking about Mixed Reality (Thanks Maud Clavier for the photo) Being the guy that attends many events around the world is always cool. And it sounds even cooler if you are a speaker at those events. Especially if the events are well-known and they feature very important speakers: saying “oh, I’m speaking at the same event of the CEO of Unity” makes you look immediately important. Then of course you don’t mention that the CEO of Unity was speaking in the main room in front of 500 people, while you had your talk in the toilets with just the janitor listening to you… Hands-on innovative XR hardware and software Me trying XPANCEO contact lense VR events have been beneficial the most for my job as a VR blogger. This is because usually at them you can try the latest XR headsets and glasses, the latest games, some new innovative prototypes, and so on. Sometimes you can even try some future devices behind closed doors and get exclusive demos. I don’t have a Vision Pro at home because it is too expensive, but I tried it multiple times at XR events around the world. The same for the Shiftall MeganeX 8K, the Pico 4 Ultra, and the Somnium VR1: these are all devices I have been able to try only because of this year’s trips. I have also been able to try very futuristic gadgets like smart contact lenses. When I show people the photo of me going hands-on with Mojo Lens contact lenses, everyone looks at me as if I was coming from Mars. At XR events, you can try present and future XR gadgets and have a better understanding of the overall solution in the market and the future perspectives. The overall perception of the space Me, happily trying Vitruvian VR at AWE Europe in Lisbon I think that when you go to an important XR event (e.g. AWE US) and you try the latest hardware, you speak with people in private, maybe you also get some confidential information and try some future product under NDA, in a few days you get a better grasp of what is the real situation of the XR ecosystem. On social media, there are many things people do not say publicly: for instance, on LinkedIn, we all brag about the success we are having, but we mostly hide the failures. Or there are some secret things that people do not trust writing in chats, but that feel more confident in telling you by voice because they leave no traces. I got to know a few industry secrets at XR events, of course, always keeping them for me if I was requested to do so. Going to XR events is a good way to scout for information by speaking with the people who operate in the space. And this knowledge can be very useful for your job, especially if you work in XR, or in innovation in general. Seeing the world (a bit) Beautiful view of Qingdao (China) at night When you travel, you see many different countries, and you discover wonderful new places, new types of food, and new cultures. This is amazing and it is personally enriching and worth the hassle of traveling alone. For instance, this year, on my last trip to Finland, I was also able to visit a bit of the Lapland, see a reindeer farm, speak with the people there, and learn how life is for them. I was also able to pet some reindeer like a Disney princess, and that was cool. Me giving food to some reindeers. I have a new job I would like to do if I fail as a VR developer… But it’s also true that not all business trips end with a true visit of the place where you go: I attended XRCC in Berlin, but I have seen nothing of Berling, if not the airport, my hostel, the LIDL supermarket, and the hotel venue. It is frustrating when you go to a place but you’ve not truly gone there. Expecting the unexpected Every trip is a surprise, and sometimes the unexpected happens. It may be good things, it may be bad things, but traveling it’s always adventurous. Maud Clavier and I at SXSW 2022. No, it was not a BDSM party, but the MR concert by Miroshot The craziest event experience I had was at SXSW in 2022: I started every day with a plan, which was respected for like 2 hours, and then just life happened and I was brought by people to other places, to chat, eat, or to party in a totally unexpected way. I literally woke up every day not knowing how I would have ended doing that day. But it was incredibly good: I had fun and I obtained remarkably work-related results, too! Other times, the unexpected happens later. I remember interviewing an important person at a small event a few years ago and giving him my business card. I thought he was going to use it to even the legs of his table (it’s too thick for toilet paper), but actually like 3-4 years after he, out of the blue, wrote an email to me saying that he had been reading my blog this whole time and wanted to ask me a question about a thing. I was incredibly happy and surprised about this happening! If you stay at home, unless aliens decide to enter your window, it’s hard that something unexpected happens (and when it happens, it’s always something negative like the toilet breaking and squirting shit everywhere). Go outside and see what happens! A selfie with a giant chicken if for sure something I was not expecting to have this year! Attending events: the Cons Going to VR events is not all sunshine and roses: there are also many good reasons not to go and stay the whole time at home. More competitors than customers A nice dinner with VR people at AWE Europe 2024 As I’ve written in this (popular) article about AWE EU, the business problem of VR-specific events is that they are full of VR people. This is a great thing if you are looking for partnerships, or for friends, but it’s terrible if you are looking for customers. Unless your customers are VR people (e.g. you sell an SDK, a VR headset, etc…), the other professionals in the field that you meet are mostly potential competitors that do a similar job to yours. I’m currently a VR consultant (hire me!) and It’s hard for me to start a collaboration with someone when I introduce myself by saying “Hey, I can develop XR applications” and the other person replies “Hey, I can develop XR applications, too!”. Events that are hybrid and not only VR-related are better if you are looking for customers. Next year I will try to reduce a bit the VR-only events I’ll attend to make more room for more general tech events: in January, in fact, I’ll go to CES, which is one of the biggest tech events in the world. The stillness of the VR space Let’s be honest: XR is growing much slower than we all hope for. I’m not saying it is not growing: we had some moments over the years where the ecosystem made a big step forward, like the launch of the Quest 2 or Facebook’s renaming to Meta. But most of the time, it is a slow growth, and especially the last two years have been pretty static. This means that at XR events you mostly see always the same faces (mine included). Don’t misunderstand me: they are amazing faces, people I love to meet and to spend my time with, but at the end of the day you keep meeting always the same people, which invalidates the initial mission of enlarging your network. Sometimes I have the impression that if I go to 10 XR events or 5 is mostly the same because the people I meet are always mostly the same. The price to pay via GIPHY Traveling is fucking expensive. If I want to know new people from a specific company on Linkedin, I can invest one hour searching and sending some cold outreach messages, or asking someone for an introduction. Usually, I manage to obtain something this way, without even having to move from my desk. When I travel, I have instead to invest a lot of money and time to get the same connections. My upcoming trip to CES is going to cost me, just for the plane tickets and the hotel, more than the average Italian monthly salary. And I’m going to stay in Vegas for just 4 days. Planes, hotels, food, gifts to buy for friends, dinners for networking… these are all big expenses. Inter"
