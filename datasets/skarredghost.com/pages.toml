ng in my body was hurting, but I was happy nonetheless. It’s been great going there from all points of view: as a blogger, enthusiast, and entrepreneur… all […] January 15, 2025January 15, 2025 by Skarredghost Leave a Comment on The XR Week Peek (2025.01.15): Many XR devices were at CES, Quest 3S is the most sold console of 2024, and more!"
