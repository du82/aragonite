full_description = "How to properly contact a VR blogger or influencer You know, I’m a VR blogger (or at least I do my best to seem it), a VR consultant (don’t forget to contact me if you may need an XR consultancy!) and it seems that I’m also a VR influencer. Every day, I get contacted by various people that try to obtain something from me: […] May 19, 2018 by Skarredghost 10 Comments on How to properly contact a VR blogger or influencer Top 50 Virtual Reality influencers of 2017 “Influencer”: it is actually a world that I hate. Some people say that their job is being an influencer, but IMHO it means nothing. If your job is influencing people minds and opinions, I immediately assume that in your life you are a hypnotist, a magician or something like that :). Furthermore, this word is […] October 6, 2017October 6, 2017 by Skarredghost 2 Comments on Top 50 Virtual Reality influencers of 2017 My experience in answering AR/VR questions on Quora Two months ago I subscribed to Quora, the most famous platform for questions & answers. Why did I do this? Well, I could say that I did it because my heart was driven by the passion of helping others, but the sad reality is that I did that because every marketer suggests to go on […] July 26, 2017 by Skarredghost augmented reality virtual reality week peek The XR Week Peek (2025.02.04): Meta had a record Q4 2024, Apple still finding its way to AR glasses, and more! February 6, 2025February 6, 2025 augmented reality virtual reality week peek The XR Week Peek (2025.01.29): Google acquires HTC engineers, Meta plans to release Oakley smartglasses, and more! January 29, 2025January 29, 2025 augmented reality virtual reality week peek The XR Week Peek (2025.01.21): The XR autumn continues, Windows 11 update kills WMR, and more! January 21, 2025January 21, 2025 reviews virtual reality Roto VR hands-on: make your chair rotate in VR! January 20, 2025January 20, 2025 Best articles tutorials virtual reality Getting started with Oculus Touc