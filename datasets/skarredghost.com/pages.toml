["https://skarredghost.com/2018/09/29/oculus-connect-5-mega-round-up-all-you-need-to-know-about-oculus-quest-and-the-other-announcements"]
title = "Oculus Connect 5 mega round-up: all you need to know about Oculus Quest and the other announcements! - The Ghost Howls"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Oculus Connect 5 mega round-up: all you need to know about Oculus Quest and the other announcements! September 29, 2018October 3, 2018 by Skarredghost As it is tradition of this little blog, I will write a full round-up of the Oculus Connect 5, the very important Oculus event that has been held in San Jose on 26th and 27th of September (2018). I have not been there, but I have read an enormous amount of sources and now I will try to provide you all the most important announcements and news from that event, included a lot stuff on Oculus Quest. If you are afraid of having missed something from the event or you have some questions on the new Oculus Quest, keep reading and let me explain everything! Oculus Quest Oculus Quest has been the rockstar of this event. While there have been many other news from the Oculus Connect 5, this has been the most important one and the one about which every worldwide VR magazine has talked about. Oculus has announced its first 6 DOF standalone headset with 6 DOF controllers and its name is Oculus Quest. If in the past two years you have heard the name “Santa Cruz”, well, it is exactly that headset, but with a name more in line with standard Oculus naming (all devices’ names have one word only: Go, Rift, GearVR). It is basically like a completely standalone Rift, meaning that you buy it, start it and use it without having to rely on a phone or computer. It is completely 6 DOF, so you can move wherever you want and move your hands however you want (well, more or less, as I’ll detail later on) and inside VR, everything will be coherent with what you do. With other standalone devices, like the Mirage Solo, you have only one 3 DOF controller, meaning you have only a remote you can rotate, while with Santa Cruz you have two controllers that are like the ones of the Rift, that is it will be like having your hands inside VR. Oculus Quest and controllers inside a stand (Image by Ars Technica) Specifications This is everything I have been able to find on specifications: Snapdragon 835 VR reference design; Same high-quality lenses of Oculus Go; FOV around 95°-100°; 1600×1440 per eye resolution; 72 FPS; Adjustable IPD; 4 GB ram 64 GB memory in its base $399 version; Integrated audio (with better bass than Oculus Go integrated audio); 2 3.5mm jack to use your headphones; 6 DOF inside-out tracking of headset thanks to 4 integrated cameras (you will need to setup no external cameras in your room); 6 DOF tracking of both controllers thanks to the cameras of your headset; USB, Wi-fi, bluetooth connection. USB should have OTG enabled. Appearence The headset is more or less like the Rift, with some improvements on comfort and design. It seems very well made and the design and the quality of the materials feel great. The audio is integrated inside the lateral bands of the device, exactly as in the Go. On the right of the headset there is the button to turn it on, with a light that, when the headset is on, indicates the status of the battery (it turns red when the battery level is below 30%). There is also a 3.5mm jack for earphones. Zoom on the lateral led that showcases the battery status of Oculus Quest (Image by Adi Robertson / The Verge) On the front there are the four cameras used to track the position of the device and the controllers. These cameras are put at the four corners of the faceplate, even if the two lower ones are a bit closer to the center. In the middle top position of the faceplate there is a led that turns on when the four cameras are on: this is like the light of the webcam of a laptop and shows if the cameras are in use. Another cool view of the Quest (Image by Road To VR) On the left side there is the USB-C port of the device. There is also another 3.5mm jack for earphones. On the bottom there are two things: the volume adjustment buttons and the IPD adjustment lever. Close view of the Quest controller. Notice how the butons layout is slightly different from PC version (Image by Upload VR) The controllers instead are very similar to the Oculus Touch and have more or less the same design, with very subtle differences and a big difference: the ring has been moved to the upper part of the controllers, to make the tracking easier and better. The buttons are exactly the same of the ones of the Touch: index trigger, middle trigger, A-B buttons, one thumbstick and one menu button. Since they are almost identical, even these controllers are called Touch controllers. Side view of controllers (Image by Upload VR) Comfort Back view of the Quest. As you can see the headstrap is made in rubber and has a larger “Vive logo” on its back (image by Ars Tecnica) All people having tried it reported a very comfortable headset, as all headsets by Oculus. It feels slightly heavier than the Go, especially on the forehead and it is also heavier than Rift: since the headset has to contain all the processing units and the batteries, of course it has to be heavier than the Rift. Anyway, no one felt it uncomfortable. Furthermore, the headset felt firm even when people moved a lot in the Dead&Buried multiplayer demo. The headset has to fit to your head with a mechanism that is similar to the one of the Rift (those terrible lateral and top straps… I wonder when Oculus will switchto the comfortable knob of other devices…). Someone has tried it with glasses as well and went ok with it. The controllers are almost like Touch, but they are not exactly like the Touch… they feel different. Ben Lang of Road To VR reported that he felt that they are a bit less comfortable, also because there is not the area where you can left your thumb to rest. So, they are great, but a bit less than the Rift’s Touch. Back view of controllers (Image by Upload VR) Optics The screen is a pentile OLED, featuring 1600×1440 per eye resolution. We are at the same level of Vive Focus or Vive Pro… probably the display is the same made by Samsung. Mura and contrast are at high-quality levels and the images feel crisp. SDE is noticeable, but much less than Rift and Go. The visuals will use a new feature developed by Carmack that will help in reducing the chromatic aberration caused by lenses with almost no little computational cost. No words have been told on FOV, but we can estimate it around 95°-100°. Framerate is locked at 72Hz, even if somewhere I read that Carmack told that there is even the possibility that they will choose to adopt a choice similar to the one of Go (60Hz and 72Hz mode depending on the apps). Lenses are great, because they are the ones of Oculus Go, so less godrays than Vive ones. The IPD is adjustable and the sweet spot is quite big: I haven’t read any compliant on this. Audio The Quest features high-quality integrated audio, meaning that you won’t need to wear earphones to hear the sounds in VR, but you will listen directly to it thanks to speakers integrated in the lateral parts of the device. This has been made because with GearVR Oculus engineers noticed that people were often too lazy to wear earphones and enjoyed VR without audio. The speakers have better quality than the ones of Go, especially for what concerns the bass frequencies, that now are more audible. During the confusion of the event, people could hear the audio well, so the speakers have great quality and power. If you want some privacy (for… cough cough porn…cough cough), you can exploit the 3.5mm audio jacks. There is one for each side of the device and you can plug your headphones in any one of them to be able to use your own audio headset with the Quest. When interviewed by TESTED guys, Oculus refused to answer to why there are two audio jacks, but hinted that a particular audio solution will be released in the future. I bet on special headphones, comprised of two separated earphones, and every one of them will be attached to its own socket on the headest, so removing and wearing the device, especially in exhibitions, gets easier. Horsepower Oculus Quest and controllers (Image by Oculus) Quest runs on a Snapdragon 835 SoC. This is the same chip of the Samsung S8 and it is not the latest available for VR: Qualcomm has already released the 845 VR reference design. This choice of using a previous-gen processor has been due to the will of keeping the price low, I guess. Anyway, how does the Quest’s horsepower compare with the ones of Rift and Go? Regarding Rift, there is no comparison that can be made: the Rift runs attached to a PC where you could have installed the latest RTX 2080 Ti graphics card, that is a beast able to perform an insane amount of operations per second, while the Quest is basically a mobile phone. There’s no way a game with complex and photorealistic graphics can run on Quest. NO WAY. This is a mobile headset… if you want high-quality VR, you have to use a PC. Anyway, a game made for PC could be ported for Quest by performing a lot of optimizations: low poly environments, less lights, less drawcalls, texture atlas, and all the various optimizations stuff that, if you have developed for Gear VR, already know well. In a session, the developers of Dead and Buried have made people see the difference in visual quality of the version made for PC and for Quest. Looking at the video, you may notice that the two games looks both very very good. This could make you imagine that so all games on Quest may appear almost as on the Rift, but don’t be excited too fast: we are talking about a showcase game, where for sure Oculus engineers have worked hard to ultra-optimize the appearences for a lot of time… I don’t expect all games to have this kind of quality. But this means that we’ll have some official portings that will feel somewhat close to the game for PC. A bit like what happened with Henry ported from PC to Oculus Go by John Carmack: he used a special encoding of 5K 360 video and the experience is similar to the realtime UE4 experience on PC, even if at the same time it is completely different. Regarding the comparison with the Go, well, the difference is the one that there is between Snapdragon 821 and Snapdragon 835, that can be summarized by this benchmark table: Comparison of performances between Snapdragon 821 and 835 chipset (Image from reddit) Anyway, keep in mind that Oculus Quest has to use part of the power to track the environment and the controllers, so actually the gain is a bit less…. So, the Quest will be more powerful than the Go, but won’t offer performances THAT bigger than the Go. UPDATE: a redditor made me notice that the Snapdragon 835 VR has a chip dedicated for 6 DOF tracking, so the inside-out tracking doesn’t weigh too much on the GPU performances of the device. As Qualcomm says: “6DoF motion tracking is done at a fast 800Hz rate using the integrated Hexagon™ DSP. This leaves the Snapdragon CPU and Adreno™ GPU free for computing and graphics processing. “ John Carmack said that we are at PS3 or Xbox 360 levels in terms of computational power, but again, you won’t be able to see here the same level of graphical beauty of games for PS3. The reason is simple: titles on console run at 1280 x 720 at 30 Hz, while in this headset, the game runs at 3200×1440 at 72 Hz, with high-end anti-aliasing effects (there is like a factor of 8.5x pixels that have to be rendered on the Quest). Furthermore, the console runs with 500W of power, while this little toy at 5W. This means that we are very far away from running console-like quality games on the Oculus Quest. So, summarizing: the computational power will allow for great games on Quest, but not for games with astonishing graphics. Tracking The tracking system of Oculus Quest is called Insights and it is an inside-out tracking technology, that is it doesn’t need any kind of external hardware or setup to work. On the device there are four cameras that analyze the environment and understand the position and orientation of the device and controllers. This is done by extracting some features from the four camera streams of the environment, mixing these data together and creating a sparse point cloud of the space around the device. The four cameras performing the tracking (Image by Techcrunch) This tracking technology can theoretically work in spaces with whatever dimension (Oculus let people play a multiplayer game in a 4000 square foot arena), but the reccommended play area will be around 5m x 5m. The tracking has been optimized to work in whatever conditions, but having tried various inside-out tracked headsets, I am sure that in some conditions (low light, monochrome environments, etc…) the tracking won’t perform well. Anyway, people trying it at the OC5 were overall satisfied by the tracking, that felt like the one of the Rift. Someone reported little glitches in some particular situations (like the headset too close to a surface), but overall it performed good. It has to be noticed that Oculus has of course decorated all the enironments with textures that made the tracking work well (there were no monochrome textureless surface at all) and has set the right lighting… we have to see how the device tracking will work in the wild. Oculus Quest insight tracking extracts some notable features from the environment and use them to track the position of the headset (Image by Oculus) While reading the reviews of the Vive Focus on Engadget, for instance, I’ve read the journalists talking about a stable tracking with no problems at all, but then experimenting with it in the office, I noticed that there are particular conditions where the tracking gets lost, for instance when I look at a completely white wall. In this case, the headset just sees all white and can’t understand anything of the environment. So, I want to test it myself to see how much the tracking is actually reliable. For sure having four cameras with a wide FOV helps (to lose tracking you should have a very big portion of monochrome environment around you). The tracking of the controllers is very good as well and from reviews, I got that it is slightly better than the one of WMR controllers. Anyway, it is not at the same level of the one of Rift or Vive. There are situations when the tracking becomes problematic: for instance when the controllers are too close to the headset, when they are turned completely down (this has been reported by Ian Hamilton), or when they go behind you. If we exclude these corners situations, anyway, they perform very well. Since the tracking FOV is high, you can somewhat also play archery games or other games that require you to move for some time your hand behind your head to get something. https://twitter.com/machenmusik/status/1045516702845300736 Anyway, some problems still remain because of inside-out tracking… games must be designed to take in count that the system can’t track hands that are behind the head of the user. I’ll make two examples: You are in a shooting game. You spread your arms to shoot contemporarily to left and right: since the headset has high tracking FOV, everything works"
