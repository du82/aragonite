full_description = "Visit the Principality of Monaco in VR with DWorld! When some weeks ago I wrote in the newsletter I was being very busy, many people asked me what I was working on, and today finally I can unveil it to you: we of New Technology Walkers were working on an interesting project of a startup called DWorld, that aims at making you visit virtually […] May 7, 2021May 7, 2021 by Skarredghost The epic journey of The Unity Cube Some weeks ago, I’ve launched on App Lab “The Unity Cube”, a VR experience for Quest, with just… a cube and nothing more. I want to tell you the incredible story of this crazy launch, and how things have gone until now. It will be the occasion to tell you a happy story, to have […] April 30, 2021April 30, 2021 by Skarredghost Experimenting with Unity instant remote preview on the Vive Focus These days I’m playing a bit with the two standalone devices that I have in the office: the Vive Focus and the Oculus Go. I like these two toys… they offer easy to use virtual reality. But there is one thing that I hate about developing for standalone headsets: the deploy time. May 11, 2018 by Skarredghost 9 Comments on Experimenting with Unity instant remote preview on the Vive Focus Devlog: The Annoying Apple, Week #3-4 Another episode of my devlog, where I talk about my adventure in trying to develop a little game with my game designer Max (if you missed last episode, you can find it here). Today is like the last episode, I’ll tell you why. Max has come to my office and has tried by himself the […] June 18, 2017June 16, 2017 by Skarredghost Devlog: The Annoying Apple, Week #2 Welcome to the third episode of my devlog, where I talk about my adventure in developing a little zero-budget VR game in my free time, with game designer Max Ariani (if you missed last episode, you can find it here). Last time we understood we wanted to make a game having color as the main […] June 2, 2017 by Skarredghost Devlog: The Annoying Apple, Week #1 Welcome back to