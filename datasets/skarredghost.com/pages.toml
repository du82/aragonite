title = "Vive announces Tracker (and Audio Strap) at CES 2017 - The Ghost Howls"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = '''Vive announces Tracker (and Audio Strap) at CES 2017 January 5, 2017May 5, 2017 by Skarredghost This is the week of CES, so, after Christmas vacations were there has not been even a single news about VR, we’re being flooded by super-interesting news. We were all waiting for Vive announcements and HTC is not disappointing us at all. There will be no Vive 2, but 2 big things have been announced today: the Deluxe Audio Strap and the Vive Tracker. Deluxe Audio Strap is a beautiful name because saying “that things that transforms your Vive in a copy of the Rift” was a bit too long. It’s a gadget that adds integrated audio to your Vive headset and has a design that resembles too much the Oculus Rift one. This way Vive is planning to fill one of the gaps that it suffers against Oculus: Rift integrated audio set is very comfortable and practical and we all love it. The second announcement has been the release of Vive Tracker. The Vive Tracker is a disc containing sensors that are tracked by the Lighthouse system. That is, you have a device whose position and rotation in space can be detected by Vive system and retrieved via software through SteamVR API. Since this device seems a hockey puck, it has already been re-names as “the puck” 🙂 . The Vive Puck is powered by batteries and Vive guys say that battery can last even six hours. Its dimensions are like the ones of a kid’s hand palm. The Vive Tracker, in all its magnificency (Image by HTC) What the heck is it useful to? Well, from a consumer standpoint it is almost useless. Consumer simply want to play games with headsets and controllers. And I think most games will not support Pucks. From a hacker/maker standpoint they’re awesome. You can attach a Puck to an object, then have the position and orientation of that object in space. Let’s make an example: you attach your Vive Tracker to a baseball bat. Since you know the form factor of the bat and you know exactly where you attached the puck to it and you know the rotation and position of the puck, you could reconstruct in your game exactly the bat pose. So you can track any rigid object and integrate it in your SteamVR application. This is awesome! It opens the world to a lot of new VR interaction possibilities and applications! Soon….@htcvive pic.twitter.com/Q1jvXxyoaX — Robert McGregor (@ID_R_McGregor) January 5, 2017 Considering that they will release all mechanical and electrical specs… I think that makers will love them really a lot, I’m sure. the interface spec, both mechanical and electrical will be released so you can make your own things to attach it to. — Alan Yates (@vk2zay) January 5, 2017 Even business applications are huge: for training, for example, Pucks are great. You can attach one of them to a real fire extinguisher and then use it to train people in fire emergency situations. Or to tools and let people try to fix ultra-precious machinery in VR before doing it in real life. Of course you have to do your job well in the application… otherwise this is what happens… Seems to me that we will need a clever way to accurately define the geometry of whatever the @htcvive Tracker is tracking. Or else… pic.twitter.com/hIv4CqT841 — Robert McGregor (@ID_R_McGregor) January 5, 2017 As a full body VR developer, I also think at making full body suits using Vive Trackers… something like PrioVR suits: you just put some trackers on feet and knees, do some maths and you have something that resembles full body VR tracking (mmmh… we could implement this in our ImmotionRoom suite!). We still don’t know how much it will cost, but you can remain updated on HTC dedicated shop page! (My guess is 49$, we’ll see) As you can see, as I predicted (I am a magician!) Vive is not announcing a Vive 2, but it’s releasing a lot of upgrades and accessories for its Vive 1 that will make it supercool and interesting! Someone calls this Vive 1.5. Oculus has not a stand at CES this year so can’t reply to this Vive announcements, but I think they will make their move soon… (Header image by HTC) Disclaimer: this blog contains advertisement and affiliate links to sustain itself. If you click on an affiliate link, I'll be very happy because I'll earn a small commission on your purchase. You can find my boring full disclosure here. amzn_assoc_placement = "adunit0"; amzn_assoc_tracking_id = "skarredghost-20"; amzn_assoc_ad_mode = "search"; amzn_assoc_ad_type = "smart"; amzn_assoc_marketplace = "amazon"; amzn_assoc_region = "US"; amzn_assoc_default_search_phrase = "oculus"; amzn_assoc_default_category = "All"; amzn_assoc_linkid = "19e7147ab95952a7bb2f1d2f518b1a33"; amzn_assoc_search_bar = "true"; amzn_assoc_search_bar_position = "top"; amzn_assoc_title = "Shop Related Products"; Share this with other innovatorsClick to share on X (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Reddit (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Telegram (Opens in new window)Click to share on Pocket (Opens in new window) Related'''
