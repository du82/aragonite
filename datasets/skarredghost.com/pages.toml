full_description = "Advertising The Ghost Howls is a blog focused on AR and VR that has been running since August 2016. In these years I have invested a lot of time in this project and I have been able to gain a very good reputation in the field: I was honored to see my name many times in the classification of the top worldwide XR influencers. This platform has also attracted a good number of followers, and the cumulative views over the years are in the order of magnitude of the millions. Most of my public is comprised of AR and VR enthusiasts: some of them are gamers, others are makers and some others are in the business world. If you are running an outreach campaign for your AR and VR product, either hardware or software, you may consider collaborating with me to promote it. There are a few ways I can help you. Ad banners There are a few ad units in this blog on the right sidebar. You can use them to point to a webpage related to your XR product and enjoy the fact that the audience of this blog is mostly AR/VR people. The ad units are sold on a monthly basis and there are discounts if you buy the service for multiple months. The CPM is inferior to most AR/VR outlets because I am interested in helping you in succeeding with your products. If you are interested in this possibility, contact me now and let’s discuss the best advertisement solution for your needs. Roundup mentions Every week, I write a roundup of the most interesting AR/VR news of the week, called “The XR Week Peek”. This column is now beyond its 350th edition, and it has become pretty popular among the key players in the industry. When I go to industry events, many people from well-known XR companies thank me because my summary of organized news helps them be updated about what happens in the field. In this roundup of news (you can see an example here) there is a dedicated part for Sponsors, which can be purchased to give visibility to your product or to flag that you are looking to hire specific professional figures in your company. Whatever you want to put in front of the eyes of relevant people in our industry, I can help you with that. Just let me know, and we can decide together how to put your product under the spotlight. Sponsored posts There is also the possibility that I write a high-quality post about your product and/or company. The posts I write on The Ghost Howls are always balanced and informative and the sponsored ones are no exceptions to me. I also always disclose when a post is the result of a paid collaboration to be transparent with my readers. You can read this post I made together with NVIDIA to have an idea of the high standards I have when writing a sponsored article. I only write sponsored posts when I find companies that are interested in sharing this vision about writing informative content more than a simple commercial post. If you share my same ideas, we can talk about a sponsored collaboration at this e-mail address."
