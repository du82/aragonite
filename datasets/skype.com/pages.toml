["https://skype.com/en/blogs"]
title = "What’s new in Skype | Skype Blog"
description = "Stay up to date on Skype news. The latest features and video call technology keeping you connected with the people that matter most."
full_description = '''@media (max-width: 1023px) { .heroSection .content .col1{ background-color: #ffffffe0; }} From Text to Emotion: Skype’s New Tone Selection Feature ‘The right tone’ do matter the most! Conveying the right tone and intent through text-based messages have always been a challenge to many of us. But not anymore! Meet Skype’s new feature, the “Tone Selection” which is to assist you to put your intent just right with the perfect tone to your recipient, for your every message. Read more  Recent blog posts21/05/2024 | Team Skype | Skype Messaging ​​Talk to yourself, an intelligent way with Skype! Meet Skype's self-messaging – a feature that's as practical as pockets on a t-shirt. This simple yet powerful tool can revolutionize the way you manage your tasks, ideas, and daily activities. Read more  21/05/2024 | Team Skype | Skype Messaging ​​Transforming Your Imagination into Stunning Visuals with Just a Click Creating images with Skype AI is now commonplace. But what's truly extraordinary is the our new Skype Designer feature, who let you craft images with a level of detail and precision akin to painting with your hand. Read more  16/02/2024 | Team Skype | Skype Messaging ​​Your Chat, Reimagined: Meet Skype Messaging 2.0 We are thrilled to take you on a trip around our new version of Skype messaging. Brace yourself for a complete revamp that promises to redefine your messaging experience. From a modernized Context Menu to a sleek UI redesign, file sharing innovations to a media heaven - we've got it all covered. Read more  19/12/2023 | Team Skype | Skype Third Party Bots ​​Skype Thirds Party Bots are back! Ladies and Gentlemen, Entrepreneurs, and Developers, we have some exciting news to share. We are thrilled to announce that we are rekindling our support for third-party bots, boosted by AI capabilities with contextual responses and powered the experience with Adaptive cards. Read more  28/09/2023 | Team Skype | Skype 20 Anniversary Skype: Celebrating 2 Decades of Bridging Time and Distance with Skype I'll Skype you. It is the most ushered common phrase for us. The name “Skype” is not just a communication tool anymore but now infused with our emotions. Technically, a verb, a testament to our place in the digital dictionary, which is a dream of two decades. Read more  22/02/2023 | Team Skype | Skype & Bing Get social with the new Bing in Skype Microsoft is excited to announce integration of the new AI-powered Bing into Skype chat. This new experience is designed to provide you with a comprehensive and creative source of information, inspiration and answers to your questions, all through a simple chat interface. Bing is also great to chat with friends and family because it can provide useful information, fun quizzes, suggestions. Read more  25/01/2023 | Team Skype | Skype performance ​​Skype: Lightning-Fast on Apple M1 Mac! Skype for Apple M1 Mac is now 3X faster! Enjoy lightning-fast performance, crystal-clear audio and video quality. Optimized for Apple Silicon M1 chip, Skype delivers reliable call connections and seamless communication. Download the Skype Insider app for early access or wait for general availability on the Skype app. Read more  14/12/2022 | Team Skype | Modern Skype Translator Introducing Real-Time Translations with Your Personal Voice! Skype introduces real-time translations in video calls using AI and your natural voice. The technology automatically detects and translates different languages in real-time, using a combination of speech recognition and natural language processing. Users can activate their natural voice to personalize the translation and the feature is available for multiple languages. Read more  14/12/2022 | Team Skype | Modern Skype messaging Skype visual update announcement is here! Skype is getting a major visual update with new illustrations, themes, and colors, making it more delightful and modern. Say hello to the animated clouds and classic emoticons, plus customizable headers and message bubbles in chats. Optimization and modernization, especially for mobile, will also be a big part of this update, with more UI features to come! Read more  ​ 14/12/2022 | Team Skype | Modern Skype The Skype you love and... so much more! Skype has been redesigned with new illustrations, emoticons, performance improvements, and bug fixes. New themes and colors are available, as well as improved accessibility. The new mobile Skype calling experience includes light themes and improved video call performance. The "Today" tab on Skype integrates personalized articles and news stories. Real-time language translation is available during Skype calls. Sharing profiles and finding friends has been made easier with a QR code feature. Read more  24/08/2022 | Team Skype | Android app ​​Don't lose a single connection! Missed Skype notifications on Android? This may be due to battery optimization settings. To fix it, go to battery and device care settings, add Skype to "Never sleeping apps," or disable the toggle. On Huawei, Xiaomi, and Samsung devices, add Skype to the list of allowed apps in security settings. Now, receive all Skype notifications and never miss an important chat or call. Read more  19/04/2022 | Team Skype | Android ​​Pay for your subscriptions with Google Play! Get ready for a smoother and more convenient experience with Skype on your Android device! With the new update, purchasing and managing your Skype subscriptions has never been easier. From Skype-to-Phone, Skype Numbers, to Skype Credit, you can now manage all your subscriptions directly within the app, making it fast and convenient. Read more  08/03/2022 | Team Skype | Skype Universal Translator ​​Phone Call subtitles and translations made easy With Skype’s Universal Translator feature, you can have a seamless conversation with real time translation in 42 different languages. Call on Skype to try out call subtitles or make a regular phone call with subtitles. For free! Read more  12/01/2022 | Team Skype | Background replace ​​​Want to be the hero on your next call? 🦸 Did you know Skype Bing mashup happened? Here are the results - a unique high-quality background images in your Skype calls! And that's not all, you can now kill time by searching up the image and exploring more about the beautiful scenery and places you see on your background! Read more  21/12/2021 | Team Skype | Zoom-in feature ​​Skype has zoom now! 🥳 You can quickly zoom in with your mouse or with the handy controls on the screen. That way, you can always adjust the shared screen to exactly the size you need. Get a closer look at a shared screen at any time, so you never miss a detail. Read more  27/10/2021 | Team Skype | Modern Messaging ​​Your chats are about to get much better, Skype's new and improved messaging is here! Ready to see what Skype’s new and improved messaging has in store for you? Let's take it from the top – or if you’d rather experience it first-hand, go download latest Skype version (8.77) now to see it for yourself. Read more  25/10/2021 | Team Skype | Skype wedding ​How Skype became the link between two college sweethearts From marathon video calls to wedding bells, this couple relied on Skype to stay connected while living thousands of miles apart. Now, they’re live-streaming their wedding for guests on the other side of the world. Read more  18/10/2021 | Team Skype | Stay Connected ​With Skype, staying connected to your fellow humans has never been easier — or more important ​​ Over the past 18 months, our world has changed in unpredictable and unexpected ways — but what hasn’t changed is our human need for connection. As citizens of the world were faced with the question of how to navigate these challenging times, they looked to technology to find inventive ways to stay connected. Read more  27/09/2021 | Team Skype | Modern Skype The future of Skype: Fast, playful, delightful & buttery smooth​ Read on to see our plans for an improved, faster, reliable, and super modern-looking Skype. We've been listening closely to your feedback, and many of the changes come directly from your suggestions. Check out some of the highlights we will bring to you over the next few months. Read more  31/08/2021 | Team Skype | Schang Chi Make your next Skype call epic with Marvel Studios’ Shang-Chi and The Legend of The Ten Rings ​ Break the ice on your next Skype call by showing off your favorite Super Hero. We’re joining forces with Marvel Studios’ Shang-Chi and The Legend of The Ten Rings to turn your video calls into epic adventures. Read more  01/07/2021 | Team Skype | Together Mode Coffee shop meetings and family vacations are back — virtually — with Together mode in Skype Our brand-new digital environments take virtual get-togethers to a whole new level, so you can travel the world without ever leaving home. Read more  28/06/2021 | Team Skype | Space Jam: A New Legacy Skype and Space Jam: A New Legacy team up to make your next video call a slam dunk Get ready to JAM on your next Skype call with new emoticons, Call Reactions, and backgrounds featuring LeBron James, Bugs Bunny and the rest of the Tune Squad — available only for a limited time. Read more  08/06/2021 | Team Skype | Calling Be In Control of Your Skype Call Whether it’s a virtual lesson, an important work meeting, or a Friday night PJ party with your besties, you can easily lock or unlock your call according to your needs. Read more  07/05/2021 | Team Skype | Messaging Give your next Skype call a little flair with a custom name and icon Video calls just got a whole lot more fun with our new Name Your Call feature. Whether you’re hosting a remote birthday party or virtual wedding, now you can personalize your calls with customized titles, emoticons, stickers and more. Read more  19/03/2021 | Team Skype | 100 participants & Large Grid Skype calls for up to 100 people at once - keeping big groups connected for free Our fun new features help you stay connected on a massive scale. Large Grid means you can keep an eye on 49 participants at a time — plus, Skype audio and video calls now support up to 100 users. Read more  05/03/2021 | Team Skype | International Women's Day Let's unite on Skype this International Women’s Day International Women's Day is a reminder to celebrate women's achievements and strive for change. With Skype's Meet Now, you can connect with the women that inspire you with just one click. Meet some of our female colleagues in Skype who inspire us. Read more  22/02/2021 | Team Skype | Noise suppression Noisy distractions aren’t much fun when you’re on a video call. Skype’s new noise suppression feature can knock it out! Whether it’s people talking, kids playing, the construction workers next door, or your pet dog scaring that imaginary monster away from the front porch, background noise can be really distracting when you’re trying to talk on Skype. Read more  27/01/2021 | Team Skype | Meet Now Skype's Meet Now available from Windows 10 taskbar, Outlook, and more Free video calls with one click, no sign ups, no downloads, no passwords. With Meet Now in the Windows 10 taskbar, Outlook, and more, it’s the easiest way to connect online with friends and family! Read more  24/12/2020 | Team Skype | Holidays on Skype Get into the Holiday Spirit on Skype It’s that time of year again! We’ve holidified Skype with some of your favorite seasonal emojis, expressions and new background designs to help make it a magical, memorable season. Read more  19/10/2020 | Team Skype | Raise Hand Raise your hand in Skype The Skype team has added the ability to Raise Hand during a group call, with 8.65 release. Learn how to utilise this feature for your best Skype experience. Read more  19/09/2020 | Team Skype | Custom Reactions Custom Reactions in Skype The Skype team has worked hard and we have added the possibility to Custom your reactions, with 8.64 release. Learn how to add your favourite emojis and customise your reactions. Read more  17/06/2020 | Team Skype | Background Replace Introducing Background Replace in Skype To elevate your experience we've added the ability to replace your background. This way you can keep doing what you love but with that extra bit of privacy you might need. Read more  15/01/2019 | Team Skype | Meet Now Simple, hassle free meetings on Skype! We are proud to bring you Meet Now experience on Skype! Set up your call and invite both Skype and external users in as little as 2 clicks. Read more  29/08/2019 | Team Skype | Split screen Split view in Skype again! A few months back, we announced the launch of split window for Windows 10, which lets you put your contact list in one window, and each conversation you open in separate windows. Read more  04/06/2019 | Team Skype | Screen sharing Screen sharing goes mobile Starting today, we’re launching screen sharing on Android and iOS along with multiple improvements to our mobile calling experience. Read more  04/04/2019 | Team Skype | Group video call Call up to 50 people at once with Skype You can now call and have up to 50 people in a call, all at once. Whether you’re catching up with your friends, having a team status update, or a conference in one place… Read more  07/03/2019 | Team Skype | Call capacity The new Skype for Web is here Enjoy our latest features on the new Skype for Web using the most current versions of Microsoft Edge or Google Chrome. Read more  06/02/2019 | Team Skype | Background blur Introducing background blur in Skype Take the stress out of turning on your video and put the focus where it belongs - on you! Background blur in Skype uses artificial intelligence (AI)… Read more  03/12/2018 | Team Skype | Live captions Now live captions & subtitles in Skype Live captions & subtitles in Skype enables you to have a captioned experience in calls made or answered through Skype. Read more  04/09/2018 | Team Skype | Call recording You can now capture, save, and share special moments With call recording you can capture special moments in a Skype call with your loved ones or record important meetings with colleagues. Read more '''
