["https://www.skype.com/en/about"]
title = "About Skype | Contact | What is Skype"
description = "Skype is part of Microsoft. You can make video and audio calls, exchange chat messages and do much more using Skype application."
full_description = "@media (min-width: 767px){ .colDef1 { padding-right: 10%; padding-left: 10%; } } @media (min-width: 1200px){ .colDef1 { padding-right: 15%; padding-left: 15%; } } @media (max-width: 767px){ .colDef1 { padding-right: 10px; padding-left: 10px; } .image { height: 100%; width: 100%; } .emoticon { height: 10%; width: 10%; } .colDef1 .col1 { text-align: left !important;} } What is Skype? Skype is for connecting with the people that matter most in your life and work. It's built for both one-on-one and group conversations and works wherever you are – via mobile, PC and Alexa. Skype messaging and HD voice and video calling will help you share experiences and get things done with others. With Skype, you can have meetings and create great things with your workgroup, share a story or celebrate a birthday with friends and family, and learn a new skill or hobby with a teacher. It’s free to use Skype – to send messages and have audio and video calls with groups of up to 100 people! If you pay a little, you can do more things, in more ways, with more people – like call phones or SMS messages. You can pay as you go or buy a subscription, whatever works for you. Try Skype out today and start adding your friends, family and colleagues. They won’t be hard to find; hundreds of millions of people are already using Skype to do all sorts of things together. Contact Founded in 2003 and headquartered in Luxembourg, Skype is a division of Microsoft Corp. (NASDAQ: MSFT). Skype Communications SARL 23-29 Rives de Clausen L-2165 Luxembourg Company No: R.C.S. Luxembourg B100.468 VAT: LU 20981643 Visit support Job opportunities We are Skype! Skype is hiring! View all job opportunities Blogs Read and see the latest news and discussions about Skype. Join the conversation Facebook Twitter YouTube Blogs Limited emergency calling Skype is not a replacement for your telephone and has limited emergency calling capabilities depending on your country. Learn more about emergency calling supporting."
