["https://www.skype.com/en/blogs/2019-02-background-blur"]
title = "Introducing background blur in Skype | Skype"
description = "There are plenty of life’s moments that can get in the way of you being the focus in every video call—and that’s why we’re introducing background blur in Skype video calls."
full_description = "@media (min-width: 767px){ .colDef1 { padding-right: 10%; padding-left: 10%; } } @media (min-width: 1200px){ .colDef1 { padding-right: 15%; padding-left: 15%; } } @media (max-width: 767px){ img { height: 100%; width: 100%; } .colDef1 .col1 { text-align: left !important;} } Introducing background blur in Skype 06/02/2019 | Skype Blogs | Background blur We’ve all had those moments: You’re about to video call your parents and your laundry is all over the place, or you’re about to have a meeting with a potential investor and your business plan is on a whiteboard behind you, or you’re being interviewed on live television and your adorable child comes marching into the room. There are plenty of life’s moments that can get in the way of you being the focus in every video call—and that’s why we’re introducing background blur in Skype video calls. Background blur in Skype is similar to background blur in Microsoft Teams. It takes the stress out of turning on your video and puts the focus where it belongs—on you! With a simple toggle, right-click, or even through your Skype settings, your background will be instantly and subtly blurred, leaving just you as the only focal point.* Background blur in Skype and Teams uses artificial intelligence (AI)—trained in human form detection—to keep you in focus during your call. This technology is also trained to detect your hair, hands, and arms, making a call with background blur just as relaxed and easy as a regular video call. Background blur is available on most desktops and laptops with the latest version of Skype. For more questions about background blur in Skype, read our support article. We also love to hear from you on the Skype Community, where millions of Skype users have registered to share their expertise, feedback, and Skype stories. *We do our best to make sure that your background is always blurred, but we cannot guarantee that your background will always be blurred. << Previous article Skype blog Next article >>"
