["https://www.skype.com/en/blogs/2019-04-group-video-calling"]
title = "Call up to 50 people at once with Skype! | Skype"
description = "Skype is doubling the amount of people that can simultaneously be on a video or audio group call. You can now call and have up to 50 people in a call, all at once."
full_description = "@media (min-width: 767px){ .colDef1 { padding-right: 10%; padding-left: 10%; } } @media (min-width: 1200px){ .colDef1 { padding-right: 15%; padding-left: 15%; } } @media (max-width: 767px){ img { height: 100%; width: 100%; } .colDef1 .col1 { text-align: left !important;} } Call up to 50 people at once with Skype! 04/04/2019 | Skype Blogs | Group video calls Starting today, Skype is doubling the amount of people that can simultaneously be on a video or audio group call. You can now call and have up to 50 people in a call, all at once. Whether you’re catching up with your friends, having a team status update, or a conference call with speakers based all around the globe, Skype makes it easy to get everyone in one place. Every Skype group with up to 50 people now supports calling, whether you’re ringing just your best friend or 45 coworkers. Group call notifications With the increase in the number of participants, we also made a few changes to how these larger calls start. We added a notification to replace the ringing as the default, allowing every member of the group to receive a quick ping to join the call. These notifications are a simple, unobtrusive way to get your calls and meetings (be it between family, friends, podcast guests, or coworkers) started. If the notification of starting a call is not enough, you can select individual members to ring, or if your group is less than 25 participants, you can ring the entire group. Skype made it easier for you to get together with a larger group of people. Large group calling is available on the latest version of Skype. For more questions about group calls and our new notifications, read our support article. We also love to hear from you on the Skype Community, where millions of Skype users have registered to share their expertise, feedback, and Skype stories. << Previous article Skype blog Next article >> Facebook Twitter YouTube Blogs Limited emergency calling Skype is not a replacement for your telephone and has limited emergency calling capabilities depending on your country. Learn more about emergency calling supporting."
