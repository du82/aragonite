["https://www.skype.com/en/blogs/2019-08-split-view-in-skype"]
title = "Split view in Skype again! | Skype"
description = "A few months back, we announced the launch of split window for Windows 10, which lets you put your contact list in one window, and each conversation you open in separate windows. We’re pleased to say that this feature is now available for all versions of Windows, Mac, and Linux on the latest version of Skype."
full_description = "@media (min-width: 767px){ .colDef1 { padding-right: 10%; padding-left: 10%; } } @media (min-width: 1200px){ .colDef1 { padding-right: 15%; padding-left: 15%; } } @media (max-width: 767px){ img { height: 100%; width: 100%; } .colDef1 .col1 { text-align: left !important;} } Split view in Skype again! 29/08/2019 | Skype Blogs | Split view A few months back, we announced the launch of split window for Windows 10, which lets you put your contact list in one window, and each conversation you open in separate windows. We’re pleased to say that this feature is now available for all versions of Windows, Mac, and Linux on the latest version of Skype.* You can drag your contact, and conversation windows anywhere on your screen to really personalize the way you use Skype. Never mix up conversations in Skype again and have power over which window you interact with. How to enable split screen mode: Select the more ... menu. Select Enable split view mode. How do I open multiple conversation screens? Double click on an existing conversation in your chats list, or start a new chat to open it in a new screen. To learn more about how to use the split window view, visit our FAQs. Note: Split window view is not available on mobile or web. << Previous article Skype blog Next article >> Facebook Twitter YouTube Blogs Limited emergency calling Skype is not a replacement for your telephone and has limited emergency calling capabilities depending on your country. Learn more about emergency calling supporting."
