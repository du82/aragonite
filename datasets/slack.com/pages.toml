full_description = "ChangelogIf you’re curious about what’s new in Slack — and what’s changed — you’re in the right place.Getting StartedIntro to Slack Get started: admins Get started: usersRoles & permissionsUsing SlackChannelsDirect messagesFormat & style messagesMessage features & toolsAudio & videoShare files & conversationsSearch in SlackKeyboard shortcuts & accessibilityYour ProfileManage your accountAdjust your notificationsChange your settings & preferencesGet troubleshooting tipsConnect ToolsConnect tools from the Slack App DirectoryAutomate tasks with Workflow BuilderExplore apps in the Slack App DirectoryCreate custom appsAdministrationManage membersManage channelsManage billing, payments & plansWorkspace settings & permissionsWorkspace customizationEnterprise Grid settings & permissionsManage apps & workflowsConfigure access & securitySlack data & analyticsTutorials & videosTutorials Videos Discover moreNextPreviousActions,activity,access logs,accessibility,add,add an app,Add members,Add to Slack,administrators,all passwords,analytics,android,announcement,announcements,App Directory,app icon,Apple Watch,approving apps,archive,Asana,Atlassian,Automation apps,badge,billing details,billing,Bitbucket,bot user,box,browse,calls,Calls:,cancel,changes,channels,channel instantly,channel management,channel notification,channel suggestions,claim domains,close,company culture,compliance exports,compose,computers,conversations,convert,connect,connected accounts,connection,connecting,copy messages,create,customization,customize,custom SAML,custom,customer support teams,data exports,data security,deactivate,default channels,delete,deletion,deploy slack,desktop,direct messages,directory,disable,discover and join,Discovery APIs,display name,DMs,Do Not Disturb,domain,domains,downgrade,dropbox,duplicate accounts,edit,editing,education,email address,email,emoji,emoticons,Enterprise Grid,Enterprise Mobility Management,executives,export,failed payments,Fair Billing,faqs,finding,format,formatting,framework for apps,free trials,general,getting started,giphy,github integration,github organization,github,glossary,google apps,google calendar,google drive,guests,highlights,hipchat,human resources,IFTTT,import,Incoming WebHooks,integrations,ios,invite,IT teams,JIRA,join,Keep up,keyboard layout,keyboard shortcuts,Keychain Access,keyword notifications,language,languages,leave,link previews,loading,limits,links,linux,mac,manage a workspace,manage apps,manage members,marketing,mention,merge,message actions,messages are displayed,message display,microsoft products,mobile,mobile push,move channels,moving workspaces,multiple,mute,name,names,noise,nonprofits,notify,OneDrive,onboard,owners,password,payment,payments,permissions,phones,pin,plan,plans,plus plan,polls,primary ownership,privacy policies,prioritize tasks,private,private channel,private notes and files,project management,public channel,purpose,Quick Switcher,quote,reactivate,read,recruitment,referrer information,reminder,remove,rename,retention,Request a new workspace,role,roles,RSS,sales,Salesforce,SAML,SCIM,SCIM provisioning,screen reader,search,send,session duration,share messages,share,shared channel,shared channels,sidebar,sign in,sign out,signup mode,single sign-on,Slack Day,Slack for Teams,Slack notifications,Save notes and files,Service Level Agreements,ServiceNow,sign up,slack status,slackbot,slash commands,snippet,snooze,software developers,star,statistics,Stride,sync,tablets,tax,threads,time zone,tips,to-do lists,topic,triage channels,Terms of Service,Trello,troubleshoot,trouble receiving,tour,twitter,two-factor authentication,unread messages,updates,upgrade,upload,username,user groups,URL,vacation,Vendor and remittance,video,voice call,voice,what is,what's important,whitelisting,windows phone,windows,working in,workspace apps,workspace creation requests,workspace discovery,workspace's settings,wunderlist,your actions,Zapier,zoom,features,#general,File storage,posts,dark mode,theme,Workflow Builder,Voice,video,screen sharing,workflows,Outlook Calendar,Invited members,Transfer ownership,Whitelist,Enterprise Key Management,Transport Layer Security,Strong customer authentication,CSV,text file,work hours,Search for “[term]”See [n]+ more results →Slack Help CenterChangelogRecent updatesSlack updates and changesSlack updates and changesSee what's new in Slack and what we're gradually rolling out. ✨ February 2025 Add Slack actions to Agentforce agents Agentforce builders can now choose from a set of five Slack actions when creating an agent in Salesforce. Agents can create a canvas, send a direct message, and more. Copy a workflow step to use it again From Workflow Builder, hover over a workflow step and click the duplicate icon to copy it. Automated responses to anomaly events When certain anomaly events are detected in the audit logs on Enterprise Grid, Slack will automatically end the acting user’s sessions. You can manage anomaly event responses to decide which events end a user’s sessions and which admins are notified. Other news Org Owners and Admins can use the external people dashboard to disconnect external people from their organization and end all Slack Connect conversations. On Enterprise Grid, Org Owners and Admins can export a summary of their org’s security settings as a CSV. We’ve released some new tools for content flagging on Enterprise Grid: Org Owners can enable profile content flagging for their organization. Members can flag content from external people in Slack Connect conversations to the external organization for review, provided they’ve also enabled content flagging. Admins who have been assigned flagged content for review can now be notified with a Slackbot message. You can now remove all external people from Slack Connect channels, regardless of whether they have permission only to post, or permission to post, invite, and more. January 2025 Agentforce in Slack Add Agentforce agents to your workspace or Enterprise Grid organization so members can work alongside autonomous agents in Slack. To get started with Agentforce, you’ll need a paid Slack plan and a Salesforce Agentforce license. To learn more, visit the Slack blog. Version history for lists View previous versions of a list or detailed history of an individual item for a record of what’s changed over time. For step-by-step instructions, visit Use lists in Slack. Other news Archive individual items or entire views in a list to make room for new information. Invitations to join a Slack workspace now expire after 30 days. Need more time? Owners and admins can resend invitations to give pending members a chance to accept. Delegate app management in your Enterprise Grid organization by assigning certain members the Integrations Admin system role. Slack AI is now available with support for German and Portuguese. December 2024 Share a canvas wherever you need to View a canvas outside of Slack by printing it, or saving it as a PDF. New admin settings for developer sandboxes Org Owners and Admins on Enterprise Grid can now manage invitations, request automation, and Slack Connect settings for their developer sandboxes. Other news DLP Admins can specify the types of conversations — public channels, private channels, or direct messages — they’d like a Slack DLP rule to apply to. When building a workflow, format the drop-down options in forms as mentions so that users can be notified when their name is selected as a form response. On Enterprise Grid, you can now set specific workflow usage permissions for external organizations to decide who can use workflows in Slack Connect conversations. November 2024 Let Slack AI summarize files Get caught up on new files quickly with automatic AI file summaries. Create custom list templates Convert any list to a template and share it with members of your workspace or Enterprise Grid organization. Deploy Slack at scale with the MSIX installer You can now install Slack on Windows at scale using a new MSIX installer package for ARM and 64-bit architectures. Add people as VIPs Prioritize your notifications by adding people to your VIP list. Notifications from your VIPs can override your Do Not Disturb settings, and will appear at the top of your Activity feed. Submit a workspace migration request Org Owners can now start and manage the process of migrating a workspace into their Enterprise Grid organization from the admin dashboard. Other news You can now add emoji reactions to the text in a canvas. When creating a Salesforce channel, choose to convert an existing Slack channel instead of starting from scratch. October 2024 Limit canvas and list sharing with a new setting When you limit sharing on a canvas or list, only the owner can grant others view or edit access. Owners and admins can also enable limited sharing for all canvases and lists by default. Keep your sidebar tidy on the go You can now create, edit, and delete custom sidebar sections on the Slack mobile apps. Power up your channels with templates Slack templates bundle pre-configured tools — like canvases, lists, and workflows — together to get any job done in Slack. Rather than starting a new process or project from scratch, choose a template, create the channel, and be on your way. Configure Salesforce access in Slack Set up a connection with Salesforce to easily manage access to Sales Elevate and Salesforce channels. Recent Slack Sales Elevate updates We've made the following improvements to Slack Sales Elevate for a better experience: Search for Salesforce records in Slack Add Salesforce lists as tabs in any channel Manage Salesforce record previews Other news When reviewing flagged content, Org Owners and Content Admins can now claim or assign outstanding reports and leave comments for other reviewers. Keep track of items in a list by setting reminders to receive a notification at a date and time you specify. When adding a connector step to a workflow, you’ll be prompted to authenticate your third-party account before you can proceed with configuring the step. Delegate management of custom emoji and Slackbot responses in your Enterprise Grid organization with the Customizations Manager system role. To make it easier to multitask, workflow details now open on the right side of Slack instead of in a separate window. We’ve updated the .GPG key to verify Slack for Linux (beta) package signatures for versions 4.41 and above. Canvases that you add as a tab in a conversation will now send an update message when someone makes an edit. September 2024 Data residency now available in Singapore Data residency for Slack allows organizations to choose where certain types of customer data are stored. Choose a new font for Slack Change the font in Slack to customize how text and messages appear for you. Premium workflows no longer cost extra On September 25, 2024, we ended usage-based billing for workflows in Slack, so workflows with two (or more) connector steps or custom steps no longer cost extra. After October 31, 2024, the existing permissions determining who can build standard and premium workflows will be combined into a single permission. To ensure the right people can continue creating workflows, they need access to Publish all workflows, including premium. Bring customer data into Slack with Salesforce channels Salesforce channels are a centralized space in Slack for the conversations, data, and information about Salesforce records like Accounts or Opportunities. When you create a Salesforce channel, you’ll see tabs for Messages, Record details, Related records, and more. Salesforce channels are now available for customers who have purchased Slack Sales Elevate. The Slack App Directory is now Slack Marketplace New name, same great selection — discover and add apps (including those with new AI features) to Slack from the Slack Marketplace. Chat with third-party AI Agents and Assistants in Slack Apps built for Slack can now include an AI Agent, making it possible to chat with third-party AI right in Slack. Visit the Slack Marketplace to browse the latest selection of apps with an AI agent or assistant. Use Slack AI to build a workflow Write a prompt describing a process you'd like to automate. Slack AI will automatically create a workflow for you to customize and publish. Let Slack AI take notes in a huddle Use Slack AI to take notes in a huddle so your team can focus on the conversation. After your huddle, Slack AI will automatically create a canvas with meeting highlights, action items, and more. Improvements to workflow buttons Build more flexible workflows with new button options: Multi-clickAllow more than one click (by one or multiple people) on the same button in a workflow step. PermissionsDecide who can click a workflow button. ExpirationChoose how long a button should be active. Automate approvals for Slack Connect invitations on Enterprise Grid Org Owners and Admins can use a set of Slack Connect APIs to create automation rules that automatically approve, deny, or request admin review for Slack Connect invitations based on criteria you define. Conversations now include tabs A new conversation layout introduces tabs to the top of all channels and direct messages, making it easier than ever to access messages, pins, bookmarks, workflows, and more. Other news With Sales Elevate, Sales Admins can now configure deal celebrations to appear on members’ profiles when they close a deal. Anyone using Slack AI and Workflow Builder can add a Summarize channel step to workflows. Mac desktop app installation builds for mass distribution are now available as a PKG file. Right-click a field in a list and select Wrap field to enable text wrapping for items in that field. You can now view and restore deleted canvases within 24 hours of deleting them. Sales Admins can now control what channel types Slack Sales Elevate notifications can be sent to. August 2024 Slack AI search results now include files To provide better answers to your questions, Slack AI search answers can now include information found in files and documents shared in Slack. New workflow templates in the Automations gallery We’ve added several new workflow templates to make automating everyday tasks even simpler. Updates to lists in Slack Owners and admins can now manage whether people can create lists in Slack. You can now view and restore lists that you deleted within the last 24 hours. Upload a file from your computer into a list by creating a field for Files. Keep track of canvases in a list by creating a field for Canvases. Other news Content Admins will see new settings when configuring Flagged content review for their Enterprise Grid organization. Set a reminder to be alerted when a date in a canvas approaches or arrives. Gain insight into how your members use workflows with a new Enterprise Grid org dashboard for Workflow Builder. Visit View your Slack analytics dashboard to learn more. Owners and admins can manage canvas update messages for their workspace or E"
