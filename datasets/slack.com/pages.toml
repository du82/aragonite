["https://slack.com/document-sharing"]
title = "Secure File & Document Sharing for Business | Slack"
description = "Integrate conversations with files in Slack for seamless collaboration. Secure document sharing and communication channels streamline business projects."
full_description = "Document SharingDiscover collaborative document and File SharingBring your files and the conversations surrounding them together in Slack. It's like show and tell, but at work.Get startedTalk to salesShare files at the right place and timeWhen you share files and documents within a conversation, you can add the critical details and context you don't get while browsing folders.A sample conversation in SlackAcme SitesChannelsannouncementscs-marketingcs-salesfeedbackproductproj-billingproj-couponsteam-csDirect MessagesSlackbotZoe MaxwellHarry BooneSara ParrasMatt Brewerproj-billingZoe Maxwell12:35 PMOkay, I have some projections about how the new billing structure could affect revenue. This is based on the discussion between @Matt Brewer and @Sara Parras.Billing Update ModelGSuite Spreadsheetuploaded this file: Billing Update Model👀1Zoe Maxwell12:35 PMHappy to field any questions about this.Matt Brewer12:35 PMGreat work, @florence. I'd like to share this at the next board meeting, if possible.Message #proj-billingDeliver documents from anywhereFiles, documents, photos, and videos can be shared from your computer, device or cloud storage service of choice, all without switching tabs or windows.See the Slack MarketplaceMystery AppFile ManagementMystery AppFile ManagementMystery AppFile ManagementMystery AppFile ManagementCollaborate on large filesSometimes big files have pieces and parts that span across different software or departments. Discuss the bigger picture and finesse the final product together with in-line file and document sharing.A sample Troops app integration usagesales-ebookLisa Zhang3:24 PMThe infographic on page 15 is almost complete. Waiting on the final numbers...Lisa Dawson3:24 PMI have the numbers! Located on the third sheet:Sales Results.xls298kb Excel Spreadsheetuploaded this file: Sales Results.xls🙌1Message #sales-ebookFile sharing, meet channelsIn Slack, files and conversations flow in organized, searchable spaces called channels. Channels make it easier to share files and the context around them with the right people — and find those files later on.Integrated file sharingFrom drag-and-drop to quickly adding documents from services like Google Drive, sharing files is as much a part of Slack as typing and sending messages.How to add files to SlackYour files: safe and secureWe take security seriously, including secure file and document sharing. When you share files in private channels or messages, only the included people can see those files or find them in search.Different devices, same documentsAs you go about your day and switch from one device to the next, Slack automatically and instantly syncs the messages, files and documents in all your channels and messages.Download the Slack appTake a closer look at file sharing in SlackLink may open in new tabBlogA bevy of ways to work with your files in SlackRead storyLink may open in new tabSlack TipsUpload and share filesLearn moreLink may open in new tabBlogSlack Essentials: A step-by-step approach to gathering feedbackRead storyLink may open in new tabBlogA bevy of ways to work with your files in SlackRead storyLink may open in new tabSlack TipsUpload and share filesLearn moreLink may open in new tabBlogSlack Essentials: A step-by-step approach to gathering feedbackRead storyFrequently asked questionsWhat types of files can I share in Slack?You can share just about any file type up to 1GB in size in Slack from your device, or add them from a file management app like Box, Dropbox, Google Drive, or OneDrive.How do I pin a document in Slack?Pinning files and messages is a great way to keep important information handy for easy reference. Just hover over the message you’d like to pin, click the ••• three dots icon to see more actions you can take, then select the option to pin the message. Voila!Does Slack integrate with Box, Dropbox, Google Docs, etc.?Yes, you can connect many of the most popular file sharing and document management apps for business. Explore the Slack Marketplace for a complete list and start sharing access to your decks, docs, and more — right from Slack.Is Slack a secure file-sharing platform?Yes. We take security seriously, including the safety and privacy of your files. Data at rest in Slack’s production network is encrypted using FIPS 140-2 compliant encryption standards, which applies to all types of data at rest within Slack’s systems, including relational databases, file stores and database backups. For data in transit, Slack supports the latest recommended secure cipher suites to encrypt all traffic in transit, including use of TLS 1.2 protocols, AES-256 encryption and SHA-2 signatures, whenever supported by the clients. To ensure that only the right people and approved devices can access your company’s information in Slack, we also offer many built-in security features, such as single sign-on. You can learn more about these on our Security page.Please note: Slack does not control the nature of the data submitted to Slack workspaces. The customer is the controller of customer data, which is defined as messages, files or other content submitted through Services accounts. Please see Slack’s Privacy Policy section on “Information we collect and receive” for more details on the data elements, including any personal data elements defined as “other information” that are controlled by Slack.What are the limits for file storage?Great question! Your team's access to uploaded files varies by plan: • Free plan: 90-day access to files • All other plans: Unlimited access to files Files include things like audio and video clips, PDFs, documents, images, and screenshots. 90-day and unlimited file access lets people upload all the files teams need to collaborate and get work done. Slack is a productivity platform and is not intended for use as a file or log storage repository.Choose a better way to workGet startedTalk to sales"
