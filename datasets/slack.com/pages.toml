full_description = "AgentsAgentic productivity for every employee in Slack.Agents become teammates, with Agentforce in Slack. Powered by relevant conversations in Slack and your trusted enterprise data, Agentforce will suggest and take action right in the flow of work.Talk to salesRead blogWatch videoUnlock conversational context for every agent.Conversational data makes agents more contextually relevant, insightful, and accurate. Give them access to tap into your organization’s public conversation data in Slack, and you make your agents more precise and powerful.Learn how to make agents more intelligent80%of enterprise data is unstructured.Source: MIT Sloan School of Management, “Tapping into the power of unstructured data,” Tam Harbert, 2021Turn agents into teammates. As employees discover new agents and their skill sets, they can seamlessly interact with them in channels, DMs, and threads, just like any other member of the team.Learn how to work alongside agents in Slack47%of Slack users experience an increase in productivity.Source: Slack Customer Survey, 2024Automate Slack actions through Agentforce.Give your agents the ability to create channels, update canvases, send a DM, and more in Slack. You set the rules around the actions they can take to keep them on track.Learn how agents can take Slack-specific actions44%of early generative AI adopters reported revenue increases across all functions.Source: McKinsey, “The state of AI in early 2024: Gen AI adoption spikes and starts to generate value,” 2024Agentforce Hub Agentforce Hub is a repository for Agentforce within your company’s workspace. Explore agents based on skill set to find one most relevant to your task.Slack Agent TemplatesSlack Agent Templates, available on the AgentExchange, provide a set of prebuilt yet customizable actions and skills, enabling teams to deploy employee-facing agents even faster.Agentforce InteractionsEngage with Agentforce like any other teammate through direct messages in Slack. Select from suggested prompts or ask a question directly to the agent.Agentforce Hub Agentforce Hub is a repository for Agentforce within your company’s workspace. Explore agents based on skill set to find one most relevant to your task.Slack Agent TemplatesSlack Agent Templates, available on the AgentExchange, provide a set of prebuilt yet customizable actions and skills, enabling teams to deploy employee-facing agents even faster.Agentforce InteractionsEngage with Agentforce like any other teammate through direct messages in Slack. Select from suggested prompts or ask a question directly to the agent.Generative AI will unlock massive potential for companies today.60%budget on human capital1Most of your budget is spent on people. Empower them with AI agents to maximize your investment.40%increase in performance2Employees can experience a major lift in performance with the help of generative AI in Slack.4.4Tin potential profits3Gen AI holds the potential for massive amounts of value creation due to increased employee productivity.Agents empower every employee, in every role.HR AgentSupport employees during onboarding, help with benefits inquiries, and provide guidance on career development questionsIT AgentAddress issues as they arise, like resolving help-desk tickets and running incident communicationsService Agent Identify experts and surface historical knowledge to solve customer issuesSales AgentPrepare executive briefings, create proposals, and proactively reach out to customersMarketing AgentWork with agents to optimize campaigns, generate content, create plans, and moreLegal AgentSimplify and automate compliance processes and approvals with agentsProduct and Engineering AgentBring more agility to teams as agents help plan, design, develop, and ensure qualitySupply Chain Management AgentManage suppliers, automate warehouse operations, enhance demand forecasting, and moreAgents empower every employee, in every role.HR AgentSupport employees during onboarding, help with benefits inquiries, and provide guidance on career development questionsIT AgentAddress issues as they arise, like resolving help-desk tickets and running incident communicationsService Agent Identify experts and surface historical knowledge to solve customer issuesSales AgentPrepare executive briefings, create proposals, and proactively reach out to customersMarketing AgentWork with agents to optimize campaigns, generate content, create plans, and moreLegal AgentSimplify and automate compliance processes and approvals with agentsProduct and Engineering AgentBring more agility to teams as agents help plan, design, develop, and ensure qualitySupply Chain Management AgentManage suppliers, automate warehouse operations, enhance demand forecasting, and moreAll types of agents for achieving success.Slack is a central hub for all your agents and assistants. Bring your own custom Slack AI assistants or tap into third-party AI assistants to drive actions that move work forward.Build your own custom Slack AI assistants.The Slack API unlocks a new conversational experience for the custom assistants you build with your own tools and favorite LLM.Discover third-party AI assistants.Extend your AI assistant library with third-party apps from the Slack Marketplace for faster, more focused workdays.“We've developed IT support agents for a client to manage tier-one questions in a Slack channel, reducing the volume of human touchpoints and increasing the overall speed to resolution.”Stephanie SadowskiSenior Managing Director and Lead of Salesforce Business Group, Accenture“At Writer, we understand that embedding agents in the flow of work will transform employee productivity. Slack’s conversational data, combined with structured enterprise data, adds context that makes agents more intelligent and better at taking action.”Kevin Chung Chief Strategy Officer, Writer.ai“You go to a single, conversational interface in Slack and you can interact with humans and AI. Agents are doing the work, and we’ve dreamt of that for decades in computing and now we’re finally seeing it.”Aaron LevieCEO, BoxExplore more about working in Slack.Link may open in new tabWebinarUnlock Agentic Productivity for Every EmployeeWatch NowLink may open in new tabBlogAgentforce 2.0: Agentforce Arrives in SlackRead NowLink may open in new tabBlogAgentforce: Now Powered by Slack Data and Slack ActionsRead NowLink may open in new tabSalesforce BlogLLMs and Copilots Alone Won’t Save You: Why You’re Doing Enterprise AI WrongRead moreLink may open in new tabWebinarUnlock Agentic Productivity for Every EmployeeWatch NowLink may open in new tabBlogAgentforce 2.0: Agentforce Arrives in SlackRead NowLink may open in new tabBlogAgentforce: Now Powered by Slack Data and Slack ActionsRead NowLink may open in new tabSalesforce BlogLLMs and Copilots Alone Won’t Save You: Why You’re Doing Enterprise AI WrongRead moreFrequently asked questionsWhat is an AI agent?An AI agent is an intelligent system that can handle customer questions all on its own, no humans needed. It uses machine learning and natural language processing to tackle everything from easy questions to tricky problems, and it can even juggle multiple tasks at once. AI agents can learn and get better over time, which is different from traditional AI that needs humans to step in for certain tasks. AI agents can take action on behalf of employees.Why should I use AI agents and assistants in Slack?Slack data across channels, threads, canvases and conversations compliments and enriches your connected, enterprise data sources, resulting in more effective agent responses and actions.Every Slack workspace is a wealth of institutional knowledge — it’s the long-term memory bank of your company. For AI to be useful, it needs access to data, not just the data in one app or system, but across all your systems, including the unstructured data in team conversations. This contextual data is the key to high-quality, relevant AI outputs and adjusting to new contextual clues in real time.Every company’s untapped, unstructured data — including user-generated content, natural language text, audio and video files, and more — enhances agent reasoning and decisioning for better relevance. When you add agents to Slack, customers can give them permission to tap into the public conversational data in your organization's Slack instance, making them precise and powerful. Because your data is never our product, customers control what data agents can access in Slack. We never train any LLMs on customer data; instead, we use advanced Retrieval-Augmented Generation (RAG) techniques on the unstructured conversational data to give agents the context they need, just at the moment they need it, to support their human counterparts.What types of AI agents and assistants can I use in Slack, and what is available today?There are three types of agents and assistants that you can use in Slack:1. Agentforce (available Jan. 2025 in Slack): Powered by the most relevant conversational data in Slack and your trusted enterprise data, Agentforce suggests and automates actions on your behalf. Build custom agents that bring agentic productivity to employees right in the flow of work. From human resources to IT, services and sales, and beyond, Agentforce can take actions in Slack like creating and updating channels, lists, and canvases. Agentforce in Slack will be available soon; talk to sales to learn more.2. Your custom-built AI Assistants brought to the Slack platform: Right from a dedicated UI in Slack, you can embed AI Assistants that you build using purpose-built APIs. You can build these custom AI Assistants to work the same way you do, so you can offload tasks — from tickets to requests and more — and focus on the important work that needs to get done. These APIs are available today in the Slack Developer Center.3. Third-party AI Assistants: Talk to third-party AI Assistants to get help with drafting content, surfacing market research, or retrieving and summarizing files. Today we have several out-of-the-box AI apps ready to use and download from the Slack Marketplace, such as Adobe Express and Cohere.Are these agents and assistants safe and secure to use?For third-party AI Assistants, Slack provides guidelines and/or reviews on quality and security before these are published to the Slack Marketplace. Companies building third-party AI Assistants for the Slack Marketplace must agree to abide by Slack’s app guidelines, which include prohibitions on using customer Slack data to train LLMs, and require companies to share important security and compliance details about their apps. Additionally, Slack owners and admins can control which agent apps can be added to their workspaces.Salesforce’s Einstein Trust Layer was built to help you safely deploy AI across your business. For every Agentforce interaction, the Einstein Trust Layer is working behind the scenes to protect the privacy and security of your data and to promote the safety and accuracy of every response. Customer data: we never use customer data to train LLMs. Agent guardrails: Customers are in control of what data agents can access in Slack, and create guardrails that keep agents on task and prevent unwanted behavior. Secure LLM gateways: Use foundational LLMs safely by preventing third-party LLMs from retaining or monitoring your customer and enterprise data. Zero data retention: After the LLM generates a response and sends it back to Agentforce, it forgets all of that data thanks to our zero data retention agreements, because your data is not our product. Our data masking techniques prevent the LLM from seeing or processing sensitive data, like the names of companies and people. AI monitoring: Agentforce will constantly monitor, analyze, and detect harmful language embedded in responses. We’re running toxicity scoring models in the background to identify potentially toxic, or harmful, content. 1 Source: Deloitte LaborWise, “A powerful lens for unlocking hidden sources of labor overspend” 2 Source: Harvard Business School, “Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality,” 2024 3 Source: McKinsey Global Institute, “The economic potential of generative AI: The next productivity frontier,” 2023 Choose a better way to workTalk to sales"
