title = "Search Employee Profiles & Organization Charts | Slack Atlas"
description = "Connection starts with Slack Atlas—rich user profiles and organizational charts with comprehensive context about colleagues that help teams collaborate better."
full_description = "Employee ProfilesComprehensive user profiles and org charts with AtlasHelp teams understand who they’re working with, with Slack Atlas—a reimagined employee directory that provides people with valuable context about colleagues.Talk to salesWatch Demo Help your teams understand who they’re working with When teammates share a deeper understanding about each other, they build trust and work faster together. From displaying user affiliations and skills to a dynamic, interactive org chart, Slack Atlas helps teammates get up to speed about who’s on the other end of their working relationships. “Atlas’ rich user profiles and dynamic org charts are playing a critical role in helping us facilitate better connections in a hybrid world.”Emily GuerinHead Of Communications, Flatiron Health Enterprise-scale profile management Enterprise systems, including HRIS, populate key profile information via SCIM, ensuring employee profiles remain accurate and up-to-date. Administrators can also allow certain profile information to be customized by employees. The right context, right within reach With Slack Atlas, rich, searchable profile information and a dynamic org chart are just a click away. People can easily discover the colleagues they need to collaborate with—without switching tools or leaving Slack. More than a directory Slack Atlas is more than names and faces—it also provides contextual information that everyone can use to work together effectively.Customizable user profiles People can add their interests, key projects and team goals to provide context and connect with each other.A trusted source for employee information Synchronized profile data means that Atlas is a source of truth for organizational structure and reporting relationships.A complete organizational portrait Slack users can see profile information for anyone at their organization, even for those who aren’t yet on Slack.Learn more about digital-first ways to workLink may open in new tabResourceThe digital-first toolkitRead moreLink may open in new tabWebinarReinventing Work: building the new employee experienceWatch nowLink may open in new tabResourceTeam Collaboration: The Foundation for a Digital-First WorkplaceLearn moreLink may open in new tabResourceThe digital-first toolkitRead moreLink may open in new tabWebinarReinventing Work: building the new employee experienceWatch nowLink may open in new tabResourceTeam Collaboration: The Foundation for a Digital-First WorkplaceLearn moreFrequently asked questionsHow much does Slack Atlas cost?For pricing information, please reach out to your Slack account executive, or contact sales. For more information about Slack paid plans, visit our pricing page.Can Slack Atlas be used with any Slack Plan? Slack Atlas is included in the Enterprise Grid plan at no additional cost. Slack Atlas is also available as a paid add-on to the Business+ plans.Will Slack Atlas work if everyone in my company isn’t using Slack? Yes. Slack Atlas is ideal for enterprise organizations, and can be configured to incorporate data from enterprise systems and create rich profiles for those using Slack, and view-only profiles for everyone else at the organization. Slack users will be able to see, search and access those view-only profiles in Slack. However, features that enable profile customization and custom field creation will not be available for employees with view-only profiles.Is Slack Atlas secure?Yes. Slack Atlas is fully integrated with Slack and uses the same enterprise-grade security and identity-management capabilities that are core to the Slack platform and included via third-party integrations.Is Slack Atlas offered in my market?Slack Atlas is available in all markets and all languages supported by Slack.Start using Slack AtlasTalk to salesSee pricing"
