full_description = "Make work life simpler, more pleasant and more productive.Slack is the AI-powered platform for work bringing all of your conversations, apps, and customers together in one place. Around the world, Slack is helping businesses of all sizes grow and send productivity through the roof.Slack was acquired by Salesforce in 2021.200k+paidcustomers77of the Fortune 100use Slack150+countries havedaily active users in SlackBuilding the digital-first ecosystem for workConnect your conversations with the tools and services that you use to get the job done. With over 2,500+ apps and a robust API, the Slack platform team works with partners and developers globally to build apps and integrations that streamline your work, automate mundane tasks and bring context into your conversations in Slack.Our Partners include the world's largest SaaS companies and 1000+ products that are shaping the future of work.The Slack Marketplace gives you access to thousands of apps that can extend the capabilities of your Slack team.The Slack Fund is a venture capital fund that invests in and collaborates with entrepreneurs creating the next great software companies.Who we are and how to join usWe live by our mission, and improving people’s working life starts with our own company. We’re building a platform and products we believe in — as well as a strong, diverse team of curious, creative people who want to do the best work of their lives and support each other in the process.Careers at Slack offer all kinds of opportunities and a simpler, more pleasant, more productive working life.Slack for Good is aiming to increase the number of historically underrepresented individuals in the technology industry.Global officesWe work in Slack and from Salesforce offices around the world! To see all of the Salesforce offices, please visit Salesforce.com.News from SlackFor more company news please visit our NewsroomLink may open in new tabBlogAgentforce: Now Powered by Slack Data and Slack Actio