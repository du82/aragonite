full_description = "176569755 submission Submission + - AMD Reveals RDNA 4 GPU Architecture Powering Next Gen Radeon RX 9070 Cards (hothardware.com) Submitted by MojoKid on Friday February 28, 2025 @09:14AM MojoKid writes: AMD took the wraps of its next gen RDNA 4 consumer graphics architecture today, which was designed to enhance efficiency over the previous generation, while also optimizing performance for today's more-taxing ray traced gaming and AI workloads. RDNA 4 features next generation Ray Tracing engines, dedicated hardware for AI and ML workloads, better bandwidth utilization, and multimedia improvements for both gaming and content creation. AMD's 3rd generation Ray Accelerators in RDNA offer 2x the peak throughput of RDNA 3 and add support for a new feature called Oriented Bounding Boxes, that results in more efficient GPU utilization. 3rd Generation Matrix Accelerators are also present, which offer improved performance, along with support for 8-bit float data types, with structured sparsity. The first cards featuring RDNA 4, the Radeon RX 9070 and 9070 XT go on sale next week, with very competitive MSRPs below $600, and are expected to do battle with NVIDIA's GeForce RTX 5070-class GPUs 176025817 submission Submission + - DECLASSIFICATION OF RECORDS CONCERNING THE ASSASSINATIONS OF JFK, RFK and MLK (whitehouse.gov) 4 Submitted by schwit1 on Thursday January 23, 2025 @09:11PM schwit1 writes: By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:Section 1. Policy and Purpose. More than 50 years after the assassinations of President John F. Kennedy, Senator Robert F. Kennedy, and the Reverend Dr. Martin Luther King, Jr., the Federal Government has not released to the public all of its records related to those events. Their families and the American people deserve transparency and truth. It is in the national interest to finally release all records related to these assassinations without delay."
