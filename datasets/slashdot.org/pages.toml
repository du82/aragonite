full_description = '''176573475 story Intel Delays $28 Billion Ohio Chip Factory To 2030 (dispatch.com) 29 Posted by BeauHD on Friday February 28, 2025 @05:10PM from the remains-in-flux dept. According to The Columbia Dispatch, Intel's promised $28 billion semiconductor project in central Ohio has been delayed again until 2030, with operations beginning sometime shortly thereafter in either 2030 or 2031. From the report: By the time it opens, Intel's first factory will have faced at least five or six years of delays, as it was originally scheduled to begin operating in 2025. Intel's second Ohio factory won't be completed until at least 2031 and will begin running in 2032, according to the company. The new timeline comes as Intel continues to struggle financially, which was a key factor in the latest delay for the company's Ohio factories. The company was alerting its employees of the delays in a message Friday. The changes were made so Intel can align its factory operation with market demand and better "manage our capital responsibly," Naga Chandrasekaran, executive vice president, chief global operations officer and general manager of Intel Foundry Manufacturing wrote in a message to workers. The changes will ensure Intel's Ohio fabs will be finished in a "financially responsible manner that sets up Ohio One for success," Chandrasekaran wrote. "I wanted to be upfront and transparent with you all about our current plan. In no way does this diminish our long-term commitment to Ohio," Chandrasekaran wrote. "(W)e will continue to scale our hiring as we approach our operational dates. Intel is proud to call Ohio home, and we remain excited about our future here." ← Related Links → Commercials Are Still Too Loud, Say 'Thousands' of Recent FCC Complaints Intel Reveals Plans for Massive New Ohio Factory, Fighting the Chip Shortage StatesideIntel Delays $20 Billion Ohio Project, Citing Slow Chip Market (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); An Appeals Court May Kill a GNU GPL Software License'''
