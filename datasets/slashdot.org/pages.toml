hat TCL's high end sets have excellent colour reproduction and brightness for HDR, as well as great anti-glare coatings and extremely low latency for gaming, even at 4k. They also support high refresh rates.Perhaps even more interesting is that their mid range models have most of the same features as the high end ones, they are just a little less bright (but still more than adequate for most uses). A lot of Chinese brands do that, TP Link being another good example. Even the low end models get all the software features, they don't disable them just to differentiate the product tiers even when the hardware is capable."
