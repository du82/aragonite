full_description = '''176574929 story 3D Software Company Autodesk Cuts 1,350 Jobs To Boost AI Investment 19 Posted by BeauHD on Friday February 28, 2025 @08:30PM from the AI-revolution dept. Autodesk said it would cut 1,350 employees, or about 9% of its workforce, as part of a pivot to the cloud and artificial intelligence. Fast Company reports: Companies across sectors such as architecture, engineering, construction, and product design are making extensive use of Autodesk's 3D design solutions, with the software maker's artificial intelligence and machine learning capabilities further driving spending on its products. Autodesk saw a 23% jump in total billings to $2.11 billion in the fourth quarter ended January 31. The company's international operations have particularly shown strength, while analysts have also noted that the company was outpacing peers in the manufacturing sector, driven by the performance of its "Fusion" design software. ← You may like to read: → Apple Accused of Misleading Consumers With Apple Watch 'Carbon Neutral' Claims Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Google's Taara Hopes To Usher in a New Era of Internet Powered by Light'''
