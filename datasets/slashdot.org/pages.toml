description = '''king*jojo shares a report from The Register: The Opera web browser now boasts "agentic AI," meaning users can ask an onboard AI model to perform tasks that require a series of in-browser actions. The AI agent, referred to as the Browser Operator, can, for example, find 12 pairs of men's size 10 Nike...'''
full_description = '''176616149 story Opera Adds an Automated AI Agent To Its Browser (theregister.com) 23 Posted by BeauHD on Tuesday March 04, 2025 @06:40PM from the built-in-assistants dept. king*jojo shares a report from The Register: The Opera web browser now boasts "agentic AI," meaning users can ask an onboard AI model to perform tasks that require a series of in-browser actions. The AI agent, referred to as the Browser Operator, can, for example, find 12 pairs of men's size 10 Nike socks that you can buy. This is demonstrated in an Opera-made video of the process, running intermittently at 6x time, which shows the user has to type out the request for the undergarments rather than click around some webpages. The AI, in the given example, works its way through eight steps in its browser chat sidebar, clicking and navigating on your behalf in the web display pane, to arrive at a Walmart checkout page with two six-packs of socks added to the user's shopping cart, ready for payment. [...] Other tasks such as finding specific concert tickets and booking flight tickets from Oslo to Newcastle are also depicted, accelerated at times from 4x to 10x, with the user left to authorize the actual purchase. Browser Operator runs more slowly than shown in the video, though that's actually helpful for a semi-capable assistant. A more casual pace allows the user to intervene at any point and take over. ← You may like to read: → Brother Accused of Locking Down Third-Party Printer Ink Cartridges Via Forced Firmware Updates Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Submission: AI agent now lurks within Opera browser, for the lazy (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) {