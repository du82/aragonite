title = "sciencehabit - Slashdot User"
full_description = "176569765 submission Submission + - First petawatt electron beam arrives, ready to rip apart matter and space (science.org) 1 Submitted by sciencehabit on Friday February 28, 2025 @09:16AM sciencehabit writes: By squeezing a packet of laser light into a tiny sliver of a second, physicists can produce superintense pulses that, if only for an instant, deliver as much power as 1 million nuclear plants. Such petawatt lasers have enabled scientists to manipulate materials in new ways, emulate the conditions inside planets, and even split atoms. Now, accelerator physicists have matched that feat, producing petawatt pulses of electrons that could also have spectacular applications.Superintense electron bunches might someday even probe the nature of empty space. They produce a hugely intense electric field, so if one of them were to collide with an ultraintense laser pulse, which also contains a huge electric field, it would expose space to an incredibly strong electrical polarization, D’Arcy notes. If that field is strong enough, it should begin to rip particle-antiparticle pairs out of the vacuum, a phenomenon predicted by quantum physics but never observed.That’s still a distant goal, but researchers might get within shouting distance of it if they could make the electron pulses 10 times shorter. Researchers plan to do just that, making the additional chirp even more dramatic by replacing the laser with a more complex scheme involving a cell of plasma. “We generated 100-kiloamp beams, now the next step is getting to mega-amp beams.” 176062157 submission Submission + - 'Ghost' that haunts South Carolina rail line may be caused by tiny earthquakes (science.org) Submitted by sciencehabit on Tuesday January 28, 2025 @10:34AM sciencehabit writes: Legend has it that if you walk along Old Light Road in Summerville, South Carolina, you might see an eerie glow hovering over an abandoned rail line in the nearby woods. Old-timers will tell you it’s a spectral lantern held by the apparition of a woman searching for her decapitated husband’s head. Susan Hough has proposed a scientific explanation that is far more plausible, however. A seismologist with the U.S. Geological Survey, she believes the so-called Summerville Light could represent a rare natural phenomenon: earthquake lights.Sparks from steel rail tracks could ignite radon or other gases released from the ground by seismic shaking, Hough explains:In Summerville, I think it’s the railroad tracks that matter. I’ve crawled around tracks during my fieldwork in South Carolina. Historically, when [rail companies] replaced tracks, they didn’t always haul the old track away. So, you’ve got heaps of steel out there. Sparks might be part of the story. And maybe the railroads are important for another reason. They may naturally follow fault lines that have carved corridors through the landscape."
