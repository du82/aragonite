title = "itwbennett - Slashdot User"
full_description = '''175220153 submission Submission + - The .io top level domain may be headed for extinction (computerworld.com) Submitted by itwbennett on Wednesday October 09, 2024 @09:43AM itwbennett writes: A move announced last week by the new Labour government in the UK could mean the estimated 1.6 million organizations that use .io domain names may have to eventually replace that ccTLD, according to a report in Computerworld. As part of a diplomatic deal, the UK will hand over the Chagos Islands to Mauritius and in so doing will eliminate the region represented by the .io domain. 175178727 submission Submission + - FCC Orders T-Mobile to Deliver Better Cybersecurity (csoonline.com) Submitted by itwbennett on Wednesday October 02, 2024 @09:34AM itwbennett writes: According to a consent decree published on Monday by the US Federal Communications Commission, T-Mobile must pay a $15.75 million penalty and invest the an equal amount 'to strengthen its cybersecurity program, and develop and implement a compliance plan to protect consumers against similar data breaches in the future.' The settlement stems from FCC investigations ‘focused on three major T-Mobile data breaches in 2021, 2022, and 2023, which impacted millions of its customers,’ writes Evan Schuman for CSOonline.com. ‘Implementing these practices will require significant — and long overdue — investments. To do so at T-Mobile’s scale will likely require expenditures an order of magnitude greater than the civil penalty here,’ the consent decree said. Notes Schuman: ‘One order of magnitude greater than the $15.75 million penalty would be $157.5 million.’ 175130857 submission Submission + - Internet-exposed fuel gauges vulnerable to attack (csoonline.com) Submitted by itwbennett on Wednesday September 25, 2024 @10:03AM itwbennett writes: BitSight security researchers have discovered 11 critical and high-severity vulnerabilities in six automatic tank gauge (ATG) models from five different manufacturers. The flaws, which CISA has issued an advisory for, included OS command injection, hardcoded credentials, authentication bypasses, cross-site scripting, SQL injection, arbitrary file reads, and privilege escalation. These systems "are used to monitor the fuel level, pressure, and temperature inside fuel tanks and are also designed to detect potential leaks and trigger countermeasures," explains CSOonline's Lucian Constantin. These systems have a history of being insecure. "The vulnerability of ATG systems has been known since before 2015 when a Trend Micro investigation set up the GasPots Experiment using honeypot systems to lure attackers, investigate their methods, and assess weaknesses," writes Constantin.'''
