["https://slashdot.org/story/25/02/27/015210/tokyo-is-turning-to-a-4-day-workweek-to-shed-worlds-oldest-population-title"]
title = "Tokyo Is Turning To a 4-Day Workweek To Shed 'World's Oldest Population' Title - Slashdot"
description = '''An anonymous reader quotes a report from Fortune: Starting in April, the Tokyo Metropolitan government, one of the country's largest employers, is set to allow its employees to work only four days a week. It is also adding a new "childcare partial leave" policy, which will allow some employees to wo...'''
full_description = '''176554665 story Tokyo Is Turning To a 4-Day Workweek To Shed 'World's Oldest Population' Title (yahoo.com) 77 Posted by BeauHD on Wednesday February 26, 2025 @10:30PM from the what-to-expect dept. An anonymous reader quotes a report from Fortune: Starting in April, the Tokyo Metropolitan government, one of the country's largest employers, is set to allow its employees to work only four days a week. It is also adding a new "childcare partial leave" policy, which will allow some employees to work two fewer hours per day. The goal is to help employees who are parents balance childcare and work, said Tokyo Gov. Yuriko Koike. "We will continue to review work styles flexibly to ensure that women do not have to sacrifice their careers due to life events such as childbirth or child-rearing," Koike said in a speech during the Tokyo Metropolitan Assembly's regular session, the Japan Times reported. Moving to a four-day workweek could help address some of the core issues associated with Japan's heavy work culture, which can especially weigh on working women. The gap between men and women when it comes to housework is one of the largest among OECD countries, with women in Japan engaging in five times more unpaid work, such as childcare and elder care, than men, according to the International Monetary Fund. More than half of women who had fewer children than they would have preferred said they had fewer children because of the increased housework that another child would bring, according to the IMF. In some cases, moving to a four-day workweek has been shown to improve housework equity. Men reported spending 22% more time on childcare and 23% more time on housework during a four-day workweek trial conducted across six countries by 4 Day Week Global, which advocates for the issue. It would take a major societal change for the four-day workweek to catch on more broadly, but years of experiments have shown that working one day less a week improves employee productivity and well-being, said Peter Miscovich, the global future of work leader at real estate services company JLL. "The upside from all of that has been less stress, less burnout, better rest, better sleep, less cost to the employee, higher levels of focus and concentration during the working hours, and in some cases, greater commitment to the organization as a result," Miscovich told Fortune. ← You may like to read: → Lucid CEO Steps Down As EV Maker Plans To Double Production Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Submission: Tokyo Is Turning To a 4-Day Workweek To Shed 'World's Oldest Population' Title (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); German Startup Wins Accolade For Its Fusion Reactor Design'''
