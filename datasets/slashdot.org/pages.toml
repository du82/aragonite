["https://slashdot.org/~eldavojohn"]
title = "eldavojohn - Slashdot User"
full_description = '''100545606 comment Comment Roblimo (Score 1) 344 by eldavojohn on Thursday May 24, 2018 @02:23PM (#56668012) Attached to: Robin "Roblimo" Miller, a Long-Time Voice of the Linux Community, Has Passed Away Not a lot of great reasons to log into Slashdot these days but honoring Roblimo is unquestionably one of them. The man and his editing calculations will be forever missed ... 83233133 comment Comment The Missing Post (Score 5, Informative) 133 by eldavojohn on Thursday May 05, 2016 @09:05AM (#52052195) Attached to: Bitcoin 'Creator' Reneges On Promise To Provide More Proof, Says He's Sorry He posted a blog post yesterday and it's currently cached but essentially he promises to move BTC from early blocks to do the final verification. This was up yesterday before his stupid wah wah redirect went up. I'm reposting it here in case it's ever removed from google cache (I hate scammers):Extraordinary Claims Require Extraordinary Proof May 3, 2016 ExtraordinaryClaims Yesterday, Andreas Antonopoulos posted a fantastic piece on Reddit. Andreas said something critically important and it bears repeating: “I think the identity of Satoshi Nakamoto does not matter”. He’s absolutely right. It doesn’t – and shouldn’t – matter to the Bitcoin community. I cannot deny that my interest in bringing the origins of Bitcoin into the light is ultimately and undeniably a selfish one – the only person to whom this should matter is me. In the wake of the articles last December in which I was ‘outed’, I still believed that I could remain silent. I still believed that I could retreat into anonymity, sever contact, go quiet, and that the storm would eventually pass and life would return to normal. I was right and wrong. The story did eventually retreat, but not before it ‘turned’ and the allegations of fraud and hoax (not to mention personal threats and slurs against me and my family) clung to me. I now know that I can never go back. So, I must go through to go forward. Mr. Antonopoulos’ post also notes that if Satoshi wants to prove identity, “they don’t need an “authority” to do so. They can do it in a public, open manner.” This is absolutely true, but not necessarily complete. I can prove access to the early keys and I can and will do so by moving bitcoin, but this should be a necessary, but not sufficient, condition for such an extraordinary claim. And this is why I wanted to speak with Gavin weeks ago. Gavin was in a unique position as we dealt with each other directly while we nurtured Bitcoin to life in 2010. I knew that Gavin would remember the content of those messages and discussions, and would recall our arguments and early interactions. I wanted to speak with Gavin first, not to appeal to his authority, but because I wanted him to know. I owed him that. It was important to me that we could re-establish our relationship. Simply signing messages or moving bitcoin would never be enough for Gavin. And it should not be enough for anyone else. So, over the coming days, I will be posting a series of pieces that will lay the foundations for this extraordinary claim, which will include posting independently-verifiable documents and evidence addressing some of the false allegations that have been levelled, and transferring bitcoin from an early block. For some there is no burden of proof high enough, no evidence that cannot be dismissed as fabrication or manipulation. This is the nature of belief and swimming against this current would be futile. You should be sceptical. You should question. I would. I will present what I believe to be “extraordinary proof” and ask only that it be independently validated. Ultimately, I can do no more than that.'''
