full_description = '176618751 submission Submission + - Space Ghost voice actor dies (yahoo.com) 2 Submitted by invisik on Tuesday March 04, 2025 @10:59PM invisik writes: Space Ghost was a parody of talk shows with live-action celebrity guests, hosted by the Hanna Barbera character Space Ghost, which aired from 1994 to 1999 on Cartoon Network. The show later returned in 2001, airing on Adult Swim’s late-night programming block until 2004, Deadline reported.Deadline noted that Lowe also voiced Space Ghost in the "Space Ghost Coast to Coast" spinoff "Cartoon Planet," "Aqua Teen Hunger Force Colon Movie Film for Theaters, "and "The Brak Show," where Lowe also was a regular on the program as the voice of Dad, and Robot Chicken, and others. In February 2024, Lowe voiced Space Ghost in an episode of Max’s "Jellystone." 176618671 submission Submission + - A Massive "X" Will Appear on the Moon over North America This Thursday (msn.com) 3 Submitted by invisik on Tuesday March 04, 2025 @10:44PM invisik writes: If you look up at the Moon on Thursday, March 6, you might catch a glimpse of something strange—two letters, “X” and “V,” temporarily appearing on the lunar surface.No, the Moon isn’t sending us coded messages. This fascinating optical illusion is the result of sunlight casting shadows along the lunar terminator, the line that separates the Moon’s day side from its night side.For a brief period, these shadows create an unmistakable X and V, which are visible through binoculars or a small telescope. Here’s how you can spot them and why they appear in the first place. 176618257 submission Submission + - Microsoft Publisher Being Discontinued Next Year (microsoft.com) Submitted by josmar52789 on Tuesday March 04, 2025 @09:46PM josmar52789 writes: In October 2026, Microsoft Publisher will reach its end of life. After that time, it will no longer be included in Microsoft 365 and existing on-premises suites will no longer be supported. Microsoft 365 subscribers will no longer be able to open or edit Publisher files in Publisher.'
