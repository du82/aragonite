["https://slashdot.org/~Nerval's+Lobster"]
title = "Nerval's Lobster - Slashdot User"
full_description = "82101927 submission Submission + - How Much Do Tech Bosses Really Earn? (dice.com) Submitted by Nerval's Lobster on Tuesday March 15, 2016 @10:27AM Nerval's Lobster writes: Everybody knows that tech's top figures, such as Google CEO Larry Page or Facebook co-founder Mark Zuckerberg, are worth billions of dollars thanks to stock options. But how much do everyday tech executives — the CIOs, Chief Data Officers, and so on — earn? Generally between $150,000 and $175,000, not counting possible perks such as stock options, according to a new analysis. That's based on national data, although anyone who works in tech knows that, in high-demand areas such as Silicon Valley, salaries can skyrocket far higher for those with highly specialized skillsets and the right mix of experience. It's a good time to be a Pointy-Haired Boss... but then again, when isn't it? 80605511 submission Submission + - Tech Salaries Had Biggest Year-Over-Year Leap in 2015 (dice.com) Submitted by Nerval's Lobster on Tuesday January 26, 2016 @09:53AM Nerval's Lobster writes: Average technology salaries in the U.S. saw the biggest year-over-year leap ever, up 7.7 percent to $96,370 annually, according to Dice's new survey data. Bonuses and contract rates also rose from 2014, and tech salaries in seven metro areas reached six-figures for the first time since the survey began more than a decade ago. Contract workers saw a rise (5%) in hourly compensation, with contractors earning $70.26 per hour. Other Websites have shown similarly high salaries for tech professionals; Glassdoor, for example, called data scientist the best job in America, with an average salary of $116,840 and bountiful job prospects. But while everything might seem great on a macro level, that doesn't mean tech workers don't face their share of stagnant salaries, brutal workplaces, and annoying managers. 80446659 submission Submission + - The Most Popular Bad Passwords of 2015 (dice.com) Submitted by Nerval's Lobster on Wednesday January 20, 2016 @08:34AM Nerval's Lobster writes: For years, security experts have told people they need better passwords protecting their online accounts: no more '123456' or 'qwerty' or 'password.' Based on SplashData’s fifth annual list of the 25 most common passwords, however, it’s clear that relatively few people are listening to that advice (Dice link). The firm based its list on more than 2 million leaked passwords during the year. The most popular, as in 2014, was '123456,' followed by 'password' and the ingenious, uncrackable '12345678.' One new entry on this ignoble list: 'starwars' in 25th place, no doubt thanks in part to the popularity of 'The Force Awakens' and the accompanying marketing campaign. Seems like a lot of people have forgotten (or never learned) that, while it’s a pain to create (much less remember) a complicated password with lots of numbers and special characters, it’s nothing compared to the pain of having your online accounts compromised. Maybe, as some have proposed, we could someday kill passwords for most services."
year_published = 2016
