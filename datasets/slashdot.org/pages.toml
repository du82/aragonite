full_description = '''176602541 story Former Intel CEO Barrett Calls for Board Dismissal and Gelsinger's Return (fortune.com) 22 Posted by msmash on Monday March 03, 2025 @04:30PM from the how-about-that dept. Former Intel CEO Craig Barrett urged the rehiring of Pat Gelsinger, who was abruptly fired two months ago, arguing he should "finish the job he has aptly handled over the past few years." "Pat Gelsinger did a great job resuscitating the technology development team," Barrett wrote, criticizing the company's current leadership under "a CFO and a product manager." He suggested firing the Intel board rather than splitting the company. Barrett's comments come in response to proposals from four former board members advocating for Intel's separation into design and manufacturing businesses. Barrett dismissed these board members as "two academics and two former government bureaucrats" lacking semiconductor industry expertise. The former CEO praised Intel's technological resurgence under Gelsinger, noting its capabilities now match industry leader TSMC's 2nm technology, with additional advances in imaging technology and backside power delivery to complex chips. "Intel is backâ"from a technology point of view," Barrett wrote, arguing the best path forward is building on current momentum rather than organizational restructuring that would disrupt the company's 100,000-plus employees across multiple continents. ← Related Links → Call Centers Using AI To 'Whiten' Indian Accents Intel CEO Gelsinger Exits as Chip Pioneer's Turnaround Falters (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); TSMC Pledges To Spend $100 Billion On US Chip Facilities'''
