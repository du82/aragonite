["https://slashdot.org/story/25/02/26/2154238/satya-nadella-argues-ais-true-value-will-come-when-it-finds-killer-app-akin-to-email-or-excel"]
title = "Satya Nadella Argues AI's True Value Will Come When It Finds Killer App Akin To Email or Excel - Slashdot"
description = '''Microsoft CEO Satya Nadella argues that AI's success should be measured by its impact on economic growth rather than achieving artificial general intelligence (AGI), emphasizing that true progress will come when AI finds a transformative application akin to email or Excel. The Register reports:  "Us...'''
full_description = '''176553575 story Satya Nadella Argues AI's True Value Will Come When It Finds Killer App Akin To Email or Excel 95 Posted by BeauHD on Wednesday February 26, 2025 @06:00PM from the thought-leadership dept. Microsoft CEO Satya Nadella argues that AI's success should be measured by its impact on economic growth rather than achieving artificial general intelligence (AGI), emphasizing that true progress will come when AI finds a transformative application akin to email or Excel. The Register reports: "Us self-claiming some AGI milestone, that's just nonsensical benchmark hacking," the chief executive said during an appearance on podcaster Dwarkesh Patel's YouTube show this month. Nadella thinks a better benchmark for AI's success should be its ability to boost a country's gross domestic product. "When we say: 'Oh, this is like the industrial revolution,' let's have that industrial revolution type of growth. That means to me, 10 percent, seven percent for the developed world. Inflation adjusted, growing at five percent, that's the real marker." Nadella suggested that growth hasn't eventuated because it's going to take time before folks understand how to use AI effectively, assuming they find a use for it -- just as it took some years for the personal computer to find its feet. "Just imagine how a multinational corporation like us did forecasts pre-PC, and email, and spreadsheets. Faxes went around, somebody then got those faxes and then did an inter-office memo that then went around, and people entered numbers, and then ultimately a forecast came out maybe just in time for the next quarter," Nadella explained. "Then somebody said: 'Hey, I'm just going to take an Excel spreadsheet, put it in an email, send it around, people will go edit it, and I'll have a forecast.' The entire forecasting business process changed because the work artifact and the workflow changed. That is what needs to happen with AI being introduced into knowledge work," the CEO said. [...] "Don't conflate knowledge worker with knowledge work," he said. "The knowledge work of today could probably be automated, [but] who said my life's goal is to triage my email?" Instead, he argues AI agents will allow workers to focus on higher-value tasks. Whether this is actually how it'll play out, or whether enterprises will take this as an opportunity to reduce costs by cutting staff remains to be seen. ... "Today, you cannot deploy these intelligences unless and until there's someone indemnifying it as a human," he said. ← You may like to read: → Google Is Making It Easier To Remove Personal Info On Search Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Amazon Uses Quantum 'Cat States' With Error Correction'''
