"We're investigating an issue in which users may be unable to access Outlook features and services," Microsoft 365 Status, the official Microsoft account for 365 service incidents, sa...'''
full_description = '''176583199 story Microsoft Outage Leaves Tens of Thousands Unable to Access Email and Other Apps (cnbc.com) 39 Posted by EditorDavid on Saturday March 01, 2025 @06:51PM from the return-to-Office dept. "Tens of thousands of users were unable to access various Microsoft programs on Saturday afternoon," reports CNBC: "We're investigating an issue in which users may be unable to access Outlook features and services," Microsoft 365 Status, the official Microsoft account for 365 service incidents, said in a post on X... The number of reports that services such as Microsoft Outlook, Microsoft Exchange, Microsoft Teams, Microsoft 365 and Microsoft Azure were down spiked after 3:30 p.m. ET. More than 37,000 individuals reported an Outlook outage and roughly 24,000 reported an outage in the tech company's 365 service, according to Downdetector, while roughly 150 users reported their Teams accounts were down. One hour ago Microsoft posted on X.com that "We've identified a potential cause of impact and have reverted the suspected code to alleviate impact. We're monitoring telemetry to confirm recovery..." Minutes later they added that "Our telemetry indicates that a majority of impacted services are recovering following our change. We'll keep monitoring until impact has been resolved for all services." And the official status page for Microsoft Office says "We've confirmed that reverting the impacting service update has returned the service to a healthy state. We've entered a period of extended monitoring to ensure that the service remains stable, and to address any outstanding impact to other Microsoft 365 services." ← You may like to read: → AMD Reveals RDNA 4 GPU Architecture Powering Next Gen Radeon RX 9070 Cards Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Utah Could Become America's First State To Ban Fluoride In Public Water'''
