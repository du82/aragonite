description = "An anonymous reader quotes a report from TechCrunch: OpenAI intends to eventually integrate its AI video generation tool, Sora, directly into its popular consumer chatbot app, ChatGPT, company leaders said during a Friday office hours session on Discord. Today, Sora is only available through a dedic..."
full_description = '''176573733 story OpenAI Plans To Integrate Sora's Video Generator Into ChatGPT (techcrunch.com) 4 Posted by BeauHD on Friday February 28, 2025 @06:30PM from the what-to-expect dept. An anonymous reader quotes a report from TechCrunch: OpenAI intends to eventually integrate its AI video generation tool, Sora, directly into its popular consumer chatbot app, ChatGPT, company leaders said during a Friday office hours session on Discord. Today, Sora is only available through a dedicated web app OpenAI launched in December, which lets users access the AI video model of the same name to generate up to twenty-second-long cinematic clips. However, OpenAI's product lead for Sora, Rohan Sahai, said the company has plans to put Sora in more places, and expand what Sora can create. [...] OpenAI may be trying to attract users to ChatGPT by letting them generate Sora videos from the chatbot. Putting Sora in ChatGPT could also incentivize users to upgrade to ChatGPT's premium subscription tiers, which may offer higher video generation limits. One of the reasons OpenAI launched Sora as a separate web app was to maintain ChatGPT's simplicity, Sahai explained during the office hours. Since its launch, OpenAI has expanded Sora's web experience, creating more ways for users to browse Sora-generated videos from the community. Sahai also said OpenAI "would love to build" a standalone mobile app for Sora, noting that the Sora team is actively looking for mobile engineers. OpenAI also plans to expand Sora's generation capabilities to images, letting users create more photorealistic images than what's currently possible with OpenAI's DALL-E3 model. ← You may like to read: → An Appeals Court May Kill a GNU GPL Software License Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Usi