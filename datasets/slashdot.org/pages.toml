full_description = '''176616017 story Automattic CEO Matt Mullenweg Talks Succession - 'I Don't Want To Pass It To a Committee' (techcrunch.com) 7 Posted by msmash on Tuesday March 04, 2025 @05:20PM from the up-next dept. WordPress co-founder Matt Mullenweg said on a podcast he aims to eventually hand over leadership to a single successor rather than "a committee," amid growing calls for him to step down following his legal battle with hosting company WP Engine. On a recent episode of Lenny's Podcast, Mullenweg discussed his succession strategy for Automattic, the parent company of WordPress.com, WooCommerce and Tumblr. "I want to pass it to someone else who could have a role similar to mine, and really sort of try to be a steward," Mullenweg said, comparing the position to "being like a mayor than a CEO" as the leader would remain accountable to users and contributors. ← You may like to read: → Judges Are Fed Up With Lawyers Using AI That Hallucinate Court Cases Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Brother Accused of Locking Down Third-Party Printer Ink Cartridges Via Forced Firmware Updates'''
