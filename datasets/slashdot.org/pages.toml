["https://slashdot.org/faq"]
title = "FAQ - Slashdot"
full_description = '''This is Slashdot, a website based on and running the Slashdot-Like Automated Story-Telling Homepage software. You're reading the FAQ. Slashdot is the oldest tech news and discussion site on the web. Slashdot is also one of the largest business software comparison and review websites in the world, with over 100,000 business software products. Millions of people visit Slashdot every month to find and compare the best business software. Slashdot was created in 1997 by Rob "CmdrTaco" Malda. Today it's owned by Slashdot Media. Slashdot is run primarily by a handful of editors and coders, with the help of many others. The editors are Beau ("BeauHD") Hamilton, Manish ("manishs") Singh, David ("EditorDavid"), and Logan ("whipslash") Abbott. "Slashdot" is an intentionally obnoxious URL. When Rob registered the domain http://slashdot.org, he wanted a URL that was confusing when read aloud. (Try it!) To submit stories, corrections, or updates, please use the submissions form. Submit corrections or updates just as if you were submitting any other news item, by using the web submission form. Please include a link to the story you're updating or correcting, and explain what the trouble is. Use the same submissions form; just make clear that you're asking a question. (A good way is to title your submission starting with "Ask Slashdot.") We often edit submissions for reasons of spelling, grammar, or clarity, or to format them for visual consistency. We're happy when a story submission comes in with no changes needed, but most stories get at least a tweak or two. Sometimes we'll shorten a submission to emphasize its key points or points, remove links not relevant or central to the story posted, swap anchor text to make links easier to read, or substitute a better link for one that may be broken, expired or paywalled (or not the best link for some other reason). When two submissions offer different sources, we may combine them into a single story. Sometimes, too, we may fold links to relevant previous Slashdot stories into the text, or add these links separately. Though we do so in good faith, we apologize in advance and strive to correct any errors that this tweaking introduces.'''
