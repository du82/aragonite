["https://slashdot.org/blog"]
title = "Slashdot: News for nerds, stuff that matters"
description = "Slashdot: News for nerds, stuff that matters. Timely news source for technology related news with a heavy slant towards Linux and Open Source issues."
full_description = '''82104991 journal Journal The State of Slashdot: Https, Poll Changes, Auto-Refresh, Videos, and More 10 Journal by slashdotblog on Tuesday March 15, 2016 @01:33PM As of yesterday, Slashdot now serves over https. In addition, the polls have been moved exclusively to the right rail, and will not show up with the other stories any longer. We've also disabled auto-refresh, and fixed various issues with search and other features. In the last few weeks, we've also discontinued videos, and removed the "Jobs" section of the site. 81376385 journal Journal Follow Slashdot on Google+ Journal by slashdotblog on Friday February 19, 2016 @01:43PM Slashdot is finally back on Google+. Follow us if you're interested in keeping up with new posts via Google+. The old page was lost a couple of years ago by the previous ownership, but we are back and every post on Slashdot will appear on our Google+ page. 81347255 journal Journal Videos on Slashdot have been discontinued 1 Journal by slashdotblog on Thursday February 18, 2016 @04:20PM In our most recent Slashdot poll, an overwhelming 91% of users voted to kill Slashdot videos. Thus, we are discontinuing Slashdot videos effective immediately. While there are pluses and minuses to video content, the current iteration of videos on Slashdot was not appealing to the majority of users, and were taking up real estate on the home page, right rail, and main navigation. Starting today, you won't see these videos any more. 75941155 journal Journal What's the Story With These Ads on Slashdot? 46 Journal by slashdotblog on Thursday September 03, 2015 @01:36PM Since 1997, Slashdot has been slinging News for Nerds, and Stuff That Matters (and most importantly hosting discussion for that news and those nerds). Since 1998, we've been able to that because of paid advertising from the companies whose ads you see on our page. There's a new variety of advertising we're introducing, which you'll notice on our front page soon. These advertisements are labeled, and presented with a different color than are Slashdot stories; they're just sharing the same text-scrolling area. This new form is an evolution of the kind of display space for which advertisers can pay. The advertisers who make the site possible would certainly like you to be intrigued by their ads enough to read them, and then to order their products in triplicate, forever. You're free to skim over the ads, read them deeply, or just ignore them. Note: it's very important to us that it's always clear whether an item you see on our page is an advertisement, whatever spot it appears in. (Please let us know if you find a particular advertisement to be other than clearly labeled, so we can fix it.) Can advertisers just buy stories on Slashdot? No; that's precisely why you'll see these advertisements distinguished from Slashdot stories by color and text. The reader-contributed / editor-selected story process isn't affected by this; the stories that the editors have selected from reader submissions or found around the Web aren't changing. The difference is that advertisers can now buy display space on our page for these text-based ads. (If you are interested in buying such a space, the editorial team is gratified but uninvolved; please instead contact the advertising department.) But why? We like putting stories on Slashdot, and reading the resulting conversations; advertising makes that possible. We hope this style of ad presentation will help us rely less on other, more obtrusive forms of advertising, and keep the page streamlined, too: these ads won't blare sound, pop-up a dialog box, or make the page move while you're reading something, and they're simple: Yes, the advertisers want to persuade you to investigate further, or persuade you to somehow change your mind, and that's why any advertiser purchases ad space, but we like that they're using the written word to attempt that persuasion. The kind of ads that show up this way are likely to have actually interesting content, too, because they'll likely be from companies with technology you use or might later consider. Questions? Leave 'em below, or send us email!'''
