title = "Microsoft Unveils New Voice-Activated AI Assistant For Doctors - Slashdot"
description = "Microsoft has introduced Dragon Copilot, a voice-activated AI assistant for doctors that integrates dictation and ambient listening tools to automate clinical documentation, including notes, referrals, and post-visit summaries. The tool is set to launch in May in the U.S. and Canada. CNBC reports:  ..."
full_description = '''176603383 story Microsoft Unveils New Voice-Activated AI Assistant For Doctors 18 Posted by BeauHD on Monday March 03, 2025 @05:50PM from the Dr-GPT dept. Microsoft has introduced Dragon Copilot, a voice-activated AI assistant for doctors that integrates dictation and ambient listening tools to automate clinical documentation, including notes, referrals, and post-visit summaries. The tool is set to launch in May in the U.S. and Canada. CNBC reports: Microsoft acquired Nuance Communications, the company behind Dragon Medical One and DAX Copilot, for about $16 billion in 2021. As a result, Microsoft has become a major player in the fiercely competitive AI scribing market, which has exploded in popularity as health systems have been looking for tools to help address burnout. AI scribes like DAX Copilot allow doctors to draft clinical notes in real time as they consensually record their visits with patients. DAX Copilot has been used in more than 3 million patient visits across 600 health-care organizations in the last month, Microsoft said. Dragon Copilot is accessible through a mobile app, browser or desktop, and it integrates directly with several different electronic health records, the company said. Clinicians will still be able to draft clinical notes with the assistant like they could with DAX Copilot, but they'll be able to use natural language to edit their documentation and prompt it further, Kenn Harper, general manager of Dragon products at Microsoft, told reporters on the call. For instance, a doctor could ask questions like, "Was the patient experiencing ear pain?" or "Can you add the ICD-10 codes to the assessment and plan?" Physicians can also ask broader treatment-related queries such as, "Should this patient be screened for lung cancer?" and get an answer with links to resources like the Centers for Disease Control and Prevention. [...] ← You may like to read: → TSMC Pledges To Spend $100 Billion On US Chip Facilities Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Driverless Race Car Sets a New Autonomous Speed Record'''
