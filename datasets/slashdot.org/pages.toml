title = "pickens - Slashdot User"
full_description = '''18831562 comment Comment Quibbles (Score 2) 2254 by pickens on Wednesday January 26, 2011 @01:44AM (#35005128) Attached to: Slashdot Launches Re-Design All in all, the look is good but there are some minor tweeks the new slashdot could use:1. Not enough contrast in the links in stories for them to be easily visible. That makes a big difference to old guys with deteriotating eyesight (like me).2. No way for a story submitter to attach a link or email address to his username when he/she submits a story.3. The story box is too small when making a story submission and makes it difficult to submit stories from an ipad.4. When I look at popular in the firehose, I don't see the colors indicating their popularity anymore. This was really useful.5. Please bring back the story rejected/accepted page that used to show up when you submitted a story.6. The good - that you have retained the ability from the classic view to look at stories nested, flat, back to front etc. 18828166 submission Submission + - DOJ Seeks Mandatory Data Retention for ISP's 3 Submitted by Hugh Pickens on Tuesday January 25, 2011 @10:16PM Hugh Pickens writes: "Computerworld reports that in testimony before Congress the US Department of Justice renewed its call for legislation mandating Internet Service Providers (ISP) retain customer usage data for up to two years because law enforcement authorities are coming up empty-handed in their efforts to go after online predators and other criminals because of the unavailability of data relating to their online activities. "There is no doubt among public safety officials that the gaps between providers' retention policies and law enforcement agencies' needs, can be extremely harmful to the agencies' investigations" says Jason Weinstein, deputy assistant attorney general at the Justice Department adding that data retention is crucial to fighting Internet crimes, especially online child pornography (PDF). Weinstein admits that a data retention policy raises valid privacy concerns however, such concerns need to be addressed and balanced against the need for law enforcement to have access to the data. "Denying law enforcement that evidence prevents law enforcement from identifying those who victimize others online," concludes Weinstein."'''
