["https://slashdot.org/~theodp"]
title = "theodp - Slashdot User"
full_description = '''176582645 submission Submission + - Would You Accept or Decline a Free Space Ride from Blue Origin, SpaceX, Boeing? Submitted by theodp on Saturday March 01, 2025 @05:21PM theodp writes: There's eating your company's dogfood. Then there's REALLY eating your company's dogfood. It's one thing for Microsoft to boast that they dare to use Outlook instead of Gmail. But it took a whole other level of commitment for Jeff Bezos to join his brother Mark aboard Blue Origin's first passenger-carrying mission in July 2021. So, while Bezos is unhesitant about sending himself and other celebrities and loved ones into space aboard Blue Origin, how confident are you about the current state of space travel safety? If offered a free ride into space from Bezos's Blue Origin, Elon Musk's SpaceX, or aboard Boeing's Starliner, would you accept or decline it? Do you pay heed to Sheryl Sandburg's 2012 advice ("If you're offered a seat on a rocket ship [Sandburg was referring to a Google job offer], you don't ask what seat. You just get on.")? Or to David Bowie's 1969 Space Oddity ("Ground Control to Major Tom / Your circuit's dead, there's something wrong / Can you hear me, Major Tom?")? 176357951 comment Comment Re:Weekly recaps is overhead (Score 1) 4 by theodp on Sunday February 23, 2025 @02:18PM (#65189429) Attached to: Aside From That You're-Fired Part, Isn't Musk's Ask for Weekly Recaps Sensible? Maybe the construction industry has it right - you see the foremen reviewing plans together over breakfast early each morning in a diner near the construction site and those buildings get built! 176357259 submission Submission + - Aside From That You're-Fired Part, Isn't Musk's Ask for Weekly Recaps Sensible? 4 Submitted by theodp on Sunday February 23, 2025 @12:40PM theodp writes: In the context of an anything-you-say-can-and-will-be-used-against-you witch hunt to inform DOGE's mass firings (possibly AI-assisted), it's hardly a surprise to see all the outcry over Elon Musk's ultimatum for all government employees to provide a list of their past week's accomplishments within 48 hours or face termination. But in a non-adversarial working environment, wouldn't producing an end-of-week one-page-or-less bullet list recap showing what you had planned for the week, what blockers or new tasks came up, what you worked on and got done, and what you have planned for the next week just make sense? Or at least as much or more sense than sitting through Agile rituals and ceremonies day-after-day?'''
