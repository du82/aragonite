full_description = '''176564685 story OpenAI Rolls Out GPT-4.5 (openai.com) 23 Posted by msmash on Thursday February 27, 2025 @03:25PM from the pushing-the-limits dept. OpenAI released an early version of its new AI model GPT-4.5 to select users on Thursday, following development challenges that delayed the project last year. The Microsoft-backed startup said the new model responds better to subtle cues in written prompts and excels at chatting, writing and coding. OpenAI expects it will produce fewer fabricated responses than previous versions. Initially available as a "research preview," access is limited to software developers and users who pay $200 monthly for ChatGPT Pro subscriptions. The company plans to gather feedback before wider distribution. According to OpenAI's blog post, GPT-4.5 will be the company's last model that doesn't use additional computing power to analyze queries before responding. Future releases will incorporate the reasoning approach already used in its newer models like o1 and o3. ← Related Links → Automattic's 'Nuclear War' Over WordPress Access Sparks Potential Class Action OpenAI Sam Altman Says the Company Is 'Out of GPUs' (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); More Than 100,000 African Seeds Put in Svalbard Vault For Safekeeping'''
