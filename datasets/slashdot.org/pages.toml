["https://slashdot.org/faq/bookreviews.shtml"]
title = "Book Review Guidelines - FAQ - Slashdot"
full_description = '''Book Review Guidelines Slashdot welcomes readers' book reviews. In particular, we're interested in reviews of books on programming, computer security, the history of technology and anything else (including Science Fiction, cyberpunk, etc.) that fits under the "News for Nerds" umbrella. Pick your poison: Slashdot reviews cover a wide range of topics and genres. Please use Slashdot's search engine to see whether the book you'd like to review has already been covered. Unless you have a special reason for doing so, don't choose a book which has already been reviewed on Slashdot. (Searching for the "$Booktitle + Slashdot" on Google is your best bet). If multiple reviewers submit reviews of the same book, we may run more than one, or excerpt from several to present elements of both. Choose books that are either timely (Programming In Perl 7, when it comes out) or timeless (underappreciated or unknown classic science fiction, say). Be cautious about submitting reviews of popular books which have been reviewed extensively in mainstream media. If you review an older book, your review has a greater burden to bear, because it has to be compelling enough to justify running compared to previously existing reviews. That is, please don't review Neuromancer. On the other hand, feel free to review Neuromancer: A 25-Year Retrospective (including DVD of unreleased sit-com pilot based on the book, and a sample of William Gibson's DNA)* on its own merits. Special editions, annotated versions, re-issues, retrospectives, etc. can make an older book worth reviewing -- but take into account both the differences or improvements and the context, not just the bare original text. *Note, not a real book. Don't worry. Think and sketch: Take notes on the book you're dissecting, and decide how you want to approach your review. Remember that things which may be clear with the book in front of you won't necessarily be obvious to a reader who has only the review to go on. Here are some questions which may help you formulate a non-fiction review: What is the book about? What is the scope? How gracefully do you expect the content to age? If reviewing an updated / revised book (and you have access to the previous edition), in what ways do the revisions add to or detract from the book? Is the title accurate? (i.e. Does Introduction to BingoWidgets For Novices serve as an adequate explanation of BingoWidgets to the average reader with no experience? Or do you find that in actuality, a working acquaintance is practically necessary to understand even the introduction?) This is usually worth noting only if the title is for some reason not a good match for the text -- for instance, if it seriously under- or overstates the book's content. What level of experience is needed to well use the information in the book? Who will find it most useful? Is there an existing, canonical book which already covers the same ground? Is the book readable as well as technically accurate? Is the language stilted, or natural? Are examples easy to follow? Is the book illustrated? Are the illustrations appropriate and well executed? Do any extras come with the book, like a CD-ROM of additional information or code samples? How helpful are they? What's missing from the book? Would it benefit from illustrations, a better index, a final chapter on practical applications? If reviewing a computer book, begin by introducing things gently. What is a Relational Database Applications Framework Management System Defrobnobdicator, and what does one eat? Don't dive straight into jargon and buzzwords without stopping to say what they mean, or linking to good explanations on a site like WikiPedia if appropriate. Likewise, avoid eccentric spelling and capitalization unless there is a compelling reason to use it. What hardware and software does the author assume readers will be dealing with? (If this book is about software, what operating systems are dealt with? If it's about hacking into a proprietary video game console, will it work only with certain production runs' output?) Don't assume that everyone is running Microsoft Windows on an Intel-based desktop computer, or Debian GNU/Linux on a solar-powered home-brewed wristwatch -- be as specific as makes sense. If the book is about software, under what license or licenses is the software released? How much does it cost? (And are licensing and pricing consistent among supported platforms?) Another thing to remember when reviewing software books: remember that Slashdot readers are interested in Free and Open Source software as well as the proprietary kind; be sure to address both of these domains. If your review covers a book about an expensive software package, mention at least in passing whether there are cheaper alternatives, especially Free / Open Source ones, and how well the expensive package justifies its price. For any book, make a point of explaining why you're reviewing it, your background in the topic or genre, and where else people might want to look if they are interested in the basic area the book addresses. Explaining your expectations going in will help ground your review; an OS X book "for newbies" could be perceived very differently by an OS X expert than by a genuine newbie, so don't praise or pan a book without specifying your context and expectations. Did you like previous works from the same author, publisher, or series? Do you have a pressing workplace need for a certain type of computer system, and you bought an introductory book to help you implement it? Did someone recommend the book to you? For a work of fiction, here are some starting points: Where and when does the story take place? Does it cover an alternate universe, the present day, a span of thousands of years, a single day? Is this book part of a series or otherwise tied to an existing fictional universe? Is there an identifiable central conflict, or a complex of conflicts? What is the tone and style of the narrative? Is it frightening? Clinical? Amusing? Scattered? Do you like the characters? What about them makes them believeable or phoney, dynamic or static? From whose viewpoint is the story told, and how does that affect the narrative? Is the pace satisfying? Did you have to slog through any portion of the story? Does the book remind you (or remind you too much) of others by the same author, or in the same genre? Do any twists particularly inspire? Are there major gaps in the plot or storyline? How satisfying is the ending? (Don't give away too much, of course.) Write away: Once you've read the book and taken notes, writing a review may be the easiest part (providing you've read the instructions below on mechanics and style). Writing a Slashdot review should be fun -- and reading it should be, too. Write conversationally but seriously, as you might in a topical letter to an acquaintance who's asked you to send your impressions of a book. At the same time, please be sure to write a review, not just a summary. Do explain the content of the book, but don't stop there: the whole point of a review is to offer insight on a book's worth, not just whether it has a chapter on interfacing with MySQL. Compare it to other books, explain whether this one met your expectations, criticize, parse. By the same token, don't feel obligated to defend a poor book for its faultless page numbering and clean, unobstructed margins, or stretch to play up faults in a book you think is excellent in order to appear objective. A reader should know from your review your general impression of the book, and have an idea whether it's one they would benefit from or enjoy. So write away. Fill your coffee mug, tea cup, or caffeine IV, tap out your review and submit: we assume book review submissions are intended for publication, and reserve the right to edit and publish them (as outlined below). Here are some notes on style, mechanics, legalities, etc. to bear in mind -- this isn't as short a list as we'd like it to be, but reading these guidelines completely before you start writing will make it far more likely your review will run; reviews which ignore these guidelines may be declined without explanation. First, an important one: by submitting your review to Slashdot, you represent that the review is your own work, that it is original to Slashdot, and that it is unencumbered by any existing or anticipated contractual relationship; further, you are granting Slashdot permission to publish your review, including any editing the Slashdot editorial team finds necessary and appropriate. (Major edits will involve consultation by email or other means.) If you've reviewed the book elsewhere anywhere besides a personal home page (for instance, on Amazon) please be sure that your review for Slashdot is substantially different. We can't publish original material without knowing a working email address for the submitter -- please supply your email address and phone number along with any other contact information you feel appropriate. (The URL to your homepage is not sufficient.) If you are on IRC or an instant-messaging system, and don't mind being contacted that way, it's appreciated if you supply that sort of information too. (Like "I'm frequently using IRC on EFnet, my nick is 'hamburglar,' and I can also be reached by shouting from the base of the redwood tree in which I reside / protest.") Please indicate your preference with regard to email privacy, too: do you want your email to appear publically? Appear, but obfuscated? Not appear at all? Feel free to include a note like [EDITORS, PLEASE NOTE -- Please only print my obfuscated address!] and we'll do our best to honor your wishes. If you'd like to be on our list for occasional free books for review, include a U.S. mailing address as well. Important: If you have a relationship (other than as an ordinary reader) to the author or publisher of a book you're reviewing, disclose that relationship. This means not only cases like "My brother, the author, has given me a million dollars to type this review, and is holding me at gunpoint, while dictating to me from the Amazon review he himself wrote," but also "I used to work at this book's publisher, and was a technical reviewer for this book's three chapters on networking," or "The author is a good friend of mine." Better to disclose more than you think necessary (it can always be edited out if sensible; we'll let you know if we think there's an inappropriate conflict of interest) than less than actually necessary. If in doubt, please speak up. Plan to write a review of 800-1200 words. There is no formal length requirement, but reviews of much less than this frequently don't have enough information to let a reader know if a book is even worth investigating. (We ask many more submitter to lengthen their reviews than to shorten them.) You're free to write more than 1200 words, too -- some books demand it -- but be cautious that a longer review means more and better information, not just a higher word count. In the end, the book you're reviewing needs to be the guide. Remember, most readers will have less knowledge than you do in your area of expertise -- take some time to bring them up to speed. Write in complete sentences, and use logically connected paragraphs; avoid making your review a list of annotated chapter titles. Don't feel obliged to give each chapter or section equal space in your review; group logically to avoid a formulaic plodding-through ("Chapter 1 covers X, while chapter 2 delves into Z, followed the the 3rd chapter on Q ..."). Address chapters in the way you feel most comfortable, but stepping duly through the Table of Contents is often not the best approach. Which chapters are most important? Are there chapters which are not adjacent but which cover similar topics? Remember, the body of your review should not resemble a bulleted list. (Also, don't include the book's Table of Contents with your review; if it's available online and particularly informative, feel free to include a hyperlink to it, though.) Strive for correct spelling, grammar and punctuation in your review (and proofread with these in mind) but don't agonize over minutia. (Please run your review through a spell-checker before submitting, though.) If you're a hesitant writer, or if English is not your first language, it's a good idea to enlist a friend for advice and initial editing. One of the most common shortfalls in Slashdot reviews as submitted is a scarcity of commas to offset parenthetical phrases; don't be shy with commas. There are excellent style guides online; my favorite at the moment is Jack Lynch's Guide to Grammar and Style. If he contradicts me, go with him! Strunk and White's The Elements of Style is my favorite in-print book, and can be downright amusing. If extensive revisions are necessary, they can be handled by email, but the Web form is the right way to get the stories into Slashdot's system. Try not to sound like a marketing campaign. That means: Avoid cliches (this book, which is better than sliced bread, cuts through the clutter to break down to the nuts and bolts of the real brass tacks at the heart of the matter). Write plainly. Go easy on the exclamation marks and glib hyperbole ("This book belongs on every developer's desk!" sounds too much like "You're not going to pay a lot for this muffler!") Be cautious in general about suprelatives and strong adjectives. Don't say a book is "unsurpassed" or "the best available" on a given topic without doing some actual comparisons to likely contenders. Some other words of praise or derision are often used with too little backing evidence: rather than just calling a book "excellent," "sloppy," "boring," etc., provide concrete examples from the text that demonstrate these qualities. Watch your background. Even if each one is sensible by itself, too many adjectives in a sentence (or a review) makes it look like adjective soup. In particular, intensifiers like "very" and "extremely" in most cases can be excised to everyone's benefit. Rhetorical questions are fine in small doses, but not large ones. More than a few rhetorical questions in a review can make it sound breathless and silly. Please use simple HTML to write your review. Use <p> tags to separate paragraphs, not <br> tags or doubled <br> tags. Use <cite> tags to distinguish book titles (Great Escapes: How I Made It Through Zelda Alive), including around abbreviated versions of the title (Escapes), rather than <i> tags, quotation marks, underlining, asterices, or other means. Use quotation marks around chapter and section titles; remember that the title of chapter 5 could be "Applying Bingo to Wingo," but it's not "Chapter 5: Bingto to Wingo." Word processors or Web-page creation programs frequently create incompatibilities which may not be apparent while submitting, like using "smart" (curly) quotes not all browsers can render, or inserting spaces without being told to. Suggestion: use a simple text edito'''
