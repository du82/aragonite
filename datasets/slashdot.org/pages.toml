title = "Bruce66423 - Slashdot User"
full_description = "176622965 comment Comment Jail time? A little harsh? Nah - spot on (Score 1) 64 by Bruce66423 on Wednesday March 05, 2025 @10:16AM (#65212569) Attached to: Judges Are Fed Up With Lawyers Using AI That Hallucinate Court Cases Great suggestion! Just a week the first time - but doubling on every subsequent offence(!) 176621099 submission Submission + - Energy Transfer is trying to bankrupt Greenpeace (telegraph.co.uk) Submitted by Bruce66423 on Wednesday March 05, 2025 @06:08AM Bruce66423 writes: Aiming to get $300m for the damage it is trying to hold Greenpeace responsible for. 'Mandan, North Dakota's unprepossessing courthouse, a zealous oil billionaire is taking on Greenpeace. It’s Trump-supporting Goliath versus tree-loving David, in a case that could have far-reaching implications for both climate activism and free speech worldwide.'A Texas-based pipeline company, Energy Transfer, is suing arguably the world’s most famous environmental group for $300m (£235m). Greenpeace says an unfavourable ruling in the case – expected to run for several weeks yet – could bankrupt its United States branch, ending more than five decades of campaigning.'Meanwhile in the Netherlands 'Greenpeace International filed an anti-intimidation suit in the District Court of Amsterdam against Energy Transfer. They argue the company has acted wrongfully and should pay costs and damages incurred by Greenpeace from its “meritless”, repeat litigation.'It is an early test of new European laws against Slapp suits, introduced last year. Attempts to introduce bipartisan federal anti-Slapp legislation in the US have been unsuccessful.“The Greenpeace claim relying on the new EU anti-Slapps legislation re-globalises the debate,” says Hilson. “It provides a reinvigorated political window. It’s not just a matter of a pipeline, but EU visions of free speech versus current American ones, particularly in relation to climate change.”'A set of fascinating questions here; the reality that protestors do cause massive damage and are seldom made to compensate their victims is being set against the right to free speech. And, of course, Greenpeace's attempts to avoid responsibility are remarkably similar to the efforts of megacorps to avoid responsibility for their behaviour..."
