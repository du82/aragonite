full_description = "176569823 story Microsoft To Shut Down Skype in May, Shift Users To Teams (xda-developers.com) 99 Posted by msmash on Friday February 28, 2025 @09:40AM from the hanging-up dept. Microsoft said Friday it will shut down its Skype messaging service on May 5, replacing it with the free version of Microsoft Teams for consumers. Existing Skype users will have approximately 60 days to decide whether to migrate to Teams, where their message history, group chats and contacts will automatically transfer, or export their data including photos and conversation history. The company will discontinue Skype's telephony features for calling domestic and international numbers, though it will honor existing Skype credits and subscriptions inside Teams until users' next renewal period. Skype Number users will need to port their numbers to other providers. Microsoft acquired Skype for $8.5 billion in 2011. The shutdown will not result in immediate job cuts. ← Related Links → Citigroup Erroneously Credited Client Account With $81 Trillion in 'Near Miss' Microsoft Finalizes Skype Acquisition (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Google Tweak Creates Crisis for Product-Review Sites"
