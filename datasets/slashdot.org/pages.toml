title = "BrianFagioli - Slashdot User"
full_description = '176565889 submission Submission + - MTA uses Google Pixel smartphones and AI to detect subway track defects (betanews.com) Submitted by BrianFagioli on Thursday February 27, 2025 @06:35PM BrianFagioli writes: The subway in NYC has received a huge upgrade, but itâ(TM)s probably not at all what youâ(TM)d expect. No, it is not coming in the form of new trains or renovations to stations (even though that would be great). Actually, the MTA is testing a system that effectively transforms Google Pixel Android smartphones into powerful diagnostic tools for tracking rail defects!The project, called âoeTrackInspect,â attaches Google Pixel phones to subway cars. Then, by using the Android devicesâ(TM) built-in microphones and motion sensors, it detects vibrations and sound patterns. These sounds can indicate areas of track that may need maintenance. 175988953 submission Submission + - Wine 10.0 uncorks smoother support for running Windows apps on Linux (betanews.com) Submitted by BrianFagioli on Tuesday January 21, 2025 @01:00PM BrianFagioli writes: The Wine team has officially released Wine 10.0, marking a full year of extensive development with over 6,000 changes. This stable release introduces major updates designed to enhance performance, compatibility, and visual experience when running Windows applications on Linux and other non-Windows platforms. 175859583 submission Submission + - Linux Foundation launches Supporters of Chromium-Based Browsers initiative with (betanews.com) Submitted by BrianFagioli on Thursday January 09, 2025 @12:00PM BrianFagioli writes: The Linux Foundation has announced the launch of "Supporters of Chromium-Based Browsers," an initiative aimed at funding and supporting open development within the Chromium ecosystem. The purpose of this effort is to provide resources and foster collaboration among developers, academia, and tech companies to drive the sustainability and innovation of Chromium projects. 175834399 submission Submission + - Millions of Windows 10 PCs face security disaster as Microsoft ends support (betanews.com) Submitted by BrianFagioli on Sunday January 05, 2025 @04:27PM BrianFagioli writes: Millions of computers are heading towards a security crisis as Microsoft plans to end support for Windows 10 on October 14, 2025. Despite this impending deadline, 32 million devices — roughly 65 percent of household computers in Germany — are still running the aging operating system. In the DACH region, including Austria and Switzerland, over 35 million systems rely on Windows 10, leaving millions of users exposed to potential cyberattacks once updates stop. By contrast, only about 33 percent of German devices have transitioned to Windows 11, and over a million are still running even older systems like Windows 8, 7, or XP.Thorsten Urbanski, an IT security expert at ESET, is sounding the alarm. âoeItâ(TM)s five minutes to midnight to prevent a security fiasco in 2025. We strongly urge users not to wait until October. Upgrade to Windows 11 now or choose an alternative operating system if your device cannot support the latest version. Otherwise, users are exposing themselves to significant security risks, including dangerous cyberattacks and data breaches.â'
year_published = 2025
