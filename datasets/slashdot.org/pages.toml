full_description = '''176614413 comment Comment Apple needs a UK egress plan or a poison pill (Score 2) 23 by schwit1 on Tuesday March 04, 2025 @01:38PM (#65210513) Attached to: Apple Launches Legal Challenge To UK 'Back Door' Order The poison pill would involve turning off all Apple accounts of UK government people and a week later their families if they don't back off. 176579561 submission Submission + - 9th Circuit says Terms of Service forced arbitration has a loophole Submitted by schwit1 on Saturday March 01, 2025 @08:56AM schwit1 writes: You know those terms of service that nobody reads when you get an online account? Well, turns out if you lie (like we all do) and say you've "read" them—but weren't forced to actually view their text—that's different than the website forcing you to scroll through them before you lie. So says the Ninth Circuit (over a dissent), ruling a California woman, and her class, doesn't have to go to arbitration over the automatic renewal of her gym subscription and therefore "eludes the Gordian knot that Ross Geller and Chandler Bing struggled against." 176550789 comment Comment UK has become an island of Sheep (Score 1, Informative) 98 by schwit1 on Wednesday February 26, 2025 @09:29AM (#65196259) Attached to: UK Users Show Little Concern as Apple Removes iCloud Encryption https://www.dailymail.co.uk/ne...Next they are coming for ewe. 176545953 comment Comment How does this affect future non-phones? (Score 1) 19 by schwit1 on Tuesday February 25, 2025 @07:43PM (#65195319) Attached to: Google, Qualcomm Will Support 8 Years of Android Updates I have a Sony TV running Android. Can Google mandate to Sony that if we are providing OS updates you must pass those updates along to your device?Will this incentivize IOT makers to use Android? 176444923 comment Comment She should have gotten life (Score 1) 93 by schwit1 on Monday February 24, 2025 @08:13PM (#65192843) Attached to: Theranos Founder Elizabeth Holmes' Fraud Convictions Upheld She put people's lives at risk all to make a buck.'''
