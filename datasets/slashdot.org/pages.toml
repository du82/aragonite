full_description = '''176551273 story Amazon Revamps Alexa With Generative AI After Year-Long Delay (theverge.com) 17 Posted by msmash on Wednesday February 26, 2025 @11:00AM from the second-time-is-the-charm dept. Amazon has launched a comprehensive AI overhaul of Alexa, representing the voice assistant's most significant update since its 2014 debut. The new "Alexa Plus" enables multi-turn conversations without repeating wake words, replacing the previous command-response interaction model. The system now handles complex tasks including booking concert tickets, making restaurant reservations via Yelp integration, and creating smart home routines autonomously. Technical capabilities include image analysis, content-aware movie navigation, and semantic music search that processes vague descriptors rather than exact titles. Originally announced in September 2023 for early 2024 release, the update faced prolonged delays as Amazon engineers struggled with technical challenges. Internal testing revealed the new AI-powered assistant performed inconsistently against OpenAI's ChatGPT and suffered from verbose responses. Amazon's legacy architecture -- designed to retrieve predefined answers rather than generate responses dynamically -- complicated the transition to generative AI models. The launch represents a critical test for Devices & Services chief Panos Panay, who replaced Dave Limp amid reorganization following layoffs that affected the division. ← You may like to read: → Surge in UK University Students Using AI To Complete Work Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds BP Shuns Renewables in Return To Oil and Gas'''
