full_description = "176600431 story Nvidia and Broadcom Testing Chips on Intel Manufacturing Process (reuters.com) 14 Posted by msmash on Monday March 03, 2025 @11:05AM from the fighting-for-relevance dept. Nvidia and Broadcom are conducting manufacturing tests using Intel's advanced 18A chip production process, according to Reuters, signaling potential confidence in the struggling chipmaker's contract manufacturing ambitions. The previously unreported tests could lead to significant manufacturing contracts for Intel, whose foundry business has suffered delays and lacks major chip designer customers. AMD is also evaluating Intel's 18A technology, which competes with Taiwan's dominant TSMC, according to the report. The current tests focus on determining capabilities of Intel's process rather than running complete chip designs. Intel faces additional setbacks, with qualification of critical intellectual property for 18A taking longer than expected, potentially delaying some customer chip production until mid-2026. ← You may like to read: → Lenovo's ThinkBook Flip Puts an Extra-Tall Folding Display On a Laptop Musk Predicts AI Will Overtake Human Intelligence Next Year Elon Musk Says AI Could Eliminate Our Need to Work at Jobs Airlines Are Coming for Your Carry-Ons Microsoft AI Chief Says Conversational AI Will Replace Web Browsers Very Few People Are Using 'Much Hyped' AI Products Like ChatGPT, Survey Finds Graduates From Top MBA Programs Are Struggling To Land Jobs"
