["https://slate.com/human-interest/2023/08/parenting-advice-in-laws-trying-to-perform-religious-ritual-on-baby.html"]
title = "Parenting advice: In-laws trying to perform religious ritual on baby."
description = "Why do they keep trying to get her alone?"
full_description = "Care and Feeding I Think My In-Laws Are Trying to Perform a Religious Ritual on My Baby in Secret Why do they keep trying to get her alone? Advice by Doyin Richards Aug 08, 20239:00 AM Photo illustration by Slate. Photo by sezer66/iStock/Getty Images Plus. Tweet Share Share Comment Slate Plus members get more Care and Feeding every week. Have a question about kids, parenting, or family life? Submit it here! Dear Care and Feeding, I need help with my in-laws! I am the mother of a bright and wonderful 14-month-old daughter. My husband and I love her dearly, and she is the only grandchild in both of our families. My in-laws have been overbearing since the start. (They suggested my husband take my 60-hour old new born daughter away from me hours after we were released from the hospital so that my husband and our daughter could drive to greet them at the airport; luckily our family nurse backed me up with a firm “No! The baby isn’t going anywhere away from her mother for at least three weeks and also what are you thinking!?) There are too many instances to count. Now, the big problem is they have become possessive of my daughter, often referring to her as “their” baby, and being beyond doting and obsessive. I handle it as best I can and appreciate how many people love her, but even outsiders comment on how possessive they are when they yank the baby from my own arms when they see me look at the TV or multitask by trying to open a door or anything. The straw that has broken the camel’s back is this: This week, on an overseas trip, they insisted that my daughter would have “alone time” with her great grandfather that she and I had never met. I said I wasn’t comfortable with that and why would she need to be alone with a 94-year-old man? They said, fine, my husband’s mother would be with the two of them. I said I still wasn’t comfortable with that, as I’d never met this man, or been in his house, and why did my daughter need to be without me? No one could give me a straight answer. I ultimately said no, probably a thousand times, but happily agreed to visit the great grandfather together as a family. My husband’s parents insisted I go to the store during our visit, and they demanded I leave my daughter behind alone. I said no, again. I said I would either not go to the store or take her with me. They all got very angry and even got in my face about it, saying I needed to go and just leave her. I seriously felt ill. I had such a bad feeling about why they needed my daughter alone without me. They said it was the wish of a dying old man to have as much quality time as possible with his only great grandchild, yet I said that 30 min at the store with her mother while we were there together another 4 hours shouldn’t be an issue. I took her to the store with me while they all shouted after me. My husband’s family is enraged, saying I’m selfish and need to “share” “the baby,” as if she’s a communal possession and not a young child. They so desperately wanted me away from her that I physically had to hold her tight in my arms and run out the door. When I came back, things were very tense and my father-in-law told me how much I had disappointed his dying father. I am creeped out. I don’t think it’s normal to demand and intimidate for alone time with a young child, especially in a foreign place and a foreign country. I want nothing to do with them ever again. I told my husband I’m willing to divorce over this, and I am. They’re very religious, particularly the great grandfather, and my gut tells me there was some sort of ceremony perhaps they wanted to do without me there. It all feels so wrong. I am so upset still, days later. My question is, what can I do? Can I legally block them from my and my daughter’s lives? My husband’s parents live in the states, but this happened overseas. My husband thinks I am overreacting and that they just want as much time with our daughter as possible, but it seemed much more sinister than that when I experienced it. I am very afraid of what they may be planning as this entire trip was planned well in advance. I am scared. —Get Them Away From Her Dear Get Them Away, I am 100 percent on your side; what your in-laws are doing is beyond creepy and weird. You should dig your heels in and remind yourself that you are the mother here. No one can gain access to your child without your consent, and you sure as hell shouldn’t sign off on an old man you haven’t met spending time alone with your daughter. The caveat, of course, is your husband also has equal rights to your child, and if he wants to take your daughter to meet his parents, he can do that. However, that doesn’t mean you shouldn’t be very clear about your boundaries in terms of your in-laws. Recently in Care & Feeding This Content is Available for Slate Plus members only My Mom Only Has Limited Time Left Before She Dies. Her Sister’s Behavior Is Making Everything So Much Worse. My Teen Just Blew Up at Me Over His “Right to Privacy.” Excuse Me? This Content is Available for Slate Plus members only My 8-Year-Old Is Taking Out Her Feelings About My Divorce in a Very Upsetting Way I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. For example, they can’t come to your home and snatch your child out of your arms. They can’t disrespect you by calling you selfish because you’re doing what any good mom would do in terms of protecting your child. They can’t demand time with “the baby” as if she’s community property, as you said earlier. Your husband should be onboard with all of the aforementioned points, but if he looks at you as a “drama queen” or someone who needs to “calm down and stop being so emotional,” then you will have a serious decision to make. I’m not saying you should serve him divorce papers right away, but I wouldn’t fault you one bit if you decided to walk away from the marriage if you do everything in your power to express how traumatizing this experience is for you and he simply ignores it. Hopefully, through deep conversations and marriage counseling, it won’t come to divorce and your husband will stand up to his parents, but you should be prepared for everything. In doing so, I’d suggest consulting with a family law attorney to see what the laws are in your area regarding visitation by grandparents. No matter what you decide about your husband, you should know that without a doubt you’re doing the right thing by standing up to your in-laws. —Doyin More Advice From Slate I’ve been married for a little under five years. My problem is that over the years I have lost a lot of respect for him and have recently come to realize that I don’t love him at all. What should I do? Tweet Share Share Comment Advice Family Parenting Slate Plus"
