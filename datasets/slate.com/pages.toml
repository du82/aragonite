title = '''Family advice: My sister's husband committed the ultimate betrayal. She's still determined to be a "good wife."'''
description = "I can't watch this happen."
full_description = "Dear Prudence Help! My Sister’s Husband Has Committed the Ultimate Betrayal. And She’s Still Hellbent on Being a “Good Wife.” I can’t watch this happen. Advice by Delia Cai Feb 19, 20256:00 AM Photo illustration by Slate. Photo by PeopleImages/Getty Images Plus. Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, Watching my sister degrade herself for a walking testosterone overdose is making me physically ill. Her so-called husband, who is nothing but an overgrown caveman, cheated, knocked up another woman, and still expects her to play the devoted little wife. And she’s actually doing it. Any woman with an ounce of self-respect would have dumped his sorry carcass on the curb, but not my sister. He is the absolute worst kind of man. He thinks his mere presence is a gift to the world. He reeks of unchecked masculinity, the kind that poisons everything it touches. He has spent their entire marriage treating my sister like a maid with benefits, and now, after humiliating her in the most public, irreversible way, he’s got her thanking him for the privilege of staying. She’s convinced that this is her failure to overcome. She’s been so thoroughly conditioned to see herself as an extension of a man’s will that she mistakes degradation for devotion. She insists it’s her choice to stay, as if that’s some grand feminist statement rather than the final stage of patriarchal brain rot. She actually believes she’s being strong, that her endurance is noble, and that her willingness to absorb his filth somehow makes her a better person. I can’t watch this. I won’t watch this. If she wants to live as this man’s personal footstool, that’s on her, but I refuse to nod along like this is anything but repulsive. And, of course, that makes me the bad guy. Because in this world, calling out misogyny is “harsh,” but licking the boot that kicks you is apparently a virtue. I told my sister that I’m done with her, that she is acting like a dutiful handmaid and that I want nothing to do with her or her disgusting husband. Am I wrong for cutting her off? Or has she drowned so completely in this cesspool of toxic masculinity that she’s beyond saving? —Fed-Up in Florida Dear Fed-Up, The essential question of your letter is one that is central to so many people: How can you continue to support and care for a loved one if they’re making choices you don’t respect? It’s clear from your letter that you’re extremely upset about your sister’s choice to stay in her marriage, and that, as a result of her marital choices, you don’t respect her very much. That is a tough position to conduct a relationship from; it’s very hard to connect with someone you don’t respect. So it sounds like you need some distance from your sister until you can calm down and gain some perspective on whether any kind of relationship with her is worth the frustration. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. But cutting her off totally is, in my view, a bit extreme—especially because she may be in a position in the future where she may change her mind and need your help. Do you want to be around for her if that situation ever arises? Do you feel comfortable with the possibility that one day, she might need your help, but she’ll be too humiliated and ashamed to ask you? I’m not saying that will be the case, but I want you to consider how horrible it may feel if your anger and judgment toward her ends up making things worse, or preventing her from coming to you for help. I would apologize to your sister, ideally as soon as possible, about specifically the threat of cutting her off. Explain that you are deeply angry with her decision, even though you know she’s an adult who has the right to do what she wants. You can say something like, “Look, I love you, and I want the best for you, and that means I don’t have to agree with your choices. Sometimes I get really upset about how much I don’t agree with them. But I will always be here if you need me. In the meantime, I’m going to back away from our relationship for a while so I can deal with my anger, and that will make me a better sister to you in the long run.” —Delia Classic Prudie My boyfriend of five years said his ex-wife’s dad had a massive heart attack. He needed to fly to his hometown to take care of his 12-year-old daughter. A week later he messaged me saying he owed me a long conversation when he had his head on straight. More than a week after that, I haven’t heard anything more from him. Tweet Share Share Comment Advice Dear Prudence Slate Plus"
