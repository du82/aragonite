title = "Neighbor advice: Our new neighbor claimed she was “getting her life together.” Then we saw the camera footage."
description = "We can’t let her get away with this, can we?"
full_description = '''Dear Prudence Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. We can’t let her get away with this, can we? Advice by Delia Cai Feb 27, 20251:43 PM Photo illustration by Slate. Photo by Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My husband and I could use some serious help regarding a situation in our neighborhood that we feel has gotten out of control. We are proud homeowners in a cul-de-sac we’ve grown very fond of. The neighborhood is a mix of long-time owners and renters, and several months ago a young woman I’ll call “Kelsey” moved into one of the houses in our cul-de-sac that was available for rent, with her two pitbulls. I love dogs and have a rescue pit mix myself, so my husband and I struck up a conversation with her one day while she was walking the dogs to welcome her to the neighborhood. She seemed friendly and told me how excited she was to be living there—she said she was evicted from her previous apartment because of her dogs and had been living in her car on and off and was ready to “get her life together.” (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); She started doing some yard work for our elderly neighbors, and when I suggested to my husband that we could use some help with our yard as well, he broached concerns he had about her—namely that he suspected that she had a history of using drugs and believed she might still be using based off of her appearance, mannerisms, and desire for cash-in-hand work. At first, I thought he was being too harsh on her, but he has far more experience with this than I do—his cousin is a recovered drug addict, and he has volunteered at a methadone clinic. Recently, our neighbor “Barry” (who is a friend of my husband’s and comes over regularly) showed us some distressing ring camera footage. A package of his was stolen off their front porch late at night, clearly by Kelsey! He considered calling the police but opted to go to her house the next day to confront her directly. She immediately denied it and grew flustered and agitated before changing her story and telling him she thought it was hers before giving it back to him—and it had already been opened! Barry agrees with my husband that she is most likely using and told her that he would call the police if it happened again; and lo and behold, it happened again about a week later, this time to his roommate. Advertisement Advertisement Advertisement Advertisement Barry was ready to call the police, but his roommate “Aaron” was adamantly opposed to that—he said that she’s had a hard life compared to the both of them, and that if she was caught with any drugs and potentially arrested it would only send her back into a cycle of homelessness and addiction. He suggested that they just get their packages delivered elsewhere, which we all think is absolute nonsense. When Barry pushed back and said he was going to call the police regardless, Aaron told him that he was so opposed to that he would try to get him evicted, which he could most likely do because his dad is the owner of the house in which Barry rents a room! My husband, Barry, and I are all extremely distressed by this—Barry loves his living arrangement, but we are all increasingly concerned about Kelsey’s presence in the neighborhood if there are no consequences for her unacceptable behavior. I am also concerned for our elderly neighbors who she has been helping—she has started helping them with house cleaning and I’m worried that she might be stealing from them. I told Barry that we would be happy to report her ourselves and make it abundantly clear to Aaron that we did it and that Barry wasn’t involved, but he is worried that Aaron won’t care and would try to get him evicted anyways since he knows that we are friends with him. What on earth can we do about this? We’re worried about her actions escalating, and Barry feels held hostage. Please help! —Cul-de-sac Conundrum Dear Cul-de-sac Conundrum, Advertisement Advertisement Well, Barry definitely needs to get out of that living situation. If his roommate, AKA his landlord’s son, is threatening him with eviction in order to get him to act a certain way, that’s an issue that has nothing to do with Kelsey. As Barry’s neighbor, I think you can communicate your concern for his toxic roommate relationship, but otherwise, there’s nothing else you can do to involve yourself in that particular dynamic. Advertisement One can relate to Barry’s wish for Kelsey to face some kind of formal consequences for stealing the packages, but I personally don’t think involving the police will be helpful for anyone in this situation. Whatever your own views on policing might be, it’s safe to say that calling the cops on a neighbor will only escalate tensions for the entire neighborhood, to put it mildly. As for the issue of Kelsey, it may be helpful for you to build out whatever existing relationship you have with those elderly neighbors. Give them a drop-in and say hi a few times, and see if you can get a sense for how they feel about Kelsey’s help. I don’t think it’s crossing the line if you share with them what happened with Kelsey and the other house’s packages, and you can express concern that Kelsey might not be the most reliable source of help. But otherwise, if your suspicions about her substance abuse remain strictly suspicions, it would be unfair to spread what might be an unjustifiable rumor. The goal here is not to try to sniff out whether Kelsey is abusing drugs or stealing from more people, but more so to make yourself clearly available as a friendly neighbor and a potential source of help should anyone in the neighborhood need it. Advertisement Advertisement Advertisement Dear Prudence, I’m thinking of going no-contact with my mother, but some things are holding me back. We had built a strong bond before things went downhill, but it has definitely gotten worse since my grandma passed almost three years ago. The worst part of the situation is that I get yelled at almost every single day if not multiple times a day. She’s gotten to a point where she’ll talk negatively about me or even my boyfriend, even though he’s often picking up after her messes. Advertisement Her going from yelling at me, gaslighting me, and tearing me down to being all fine and dandy the next minute is seriously causing my head to explode! She always makes me feel like a burden or that I’m the problem and she’s the victim, when in reality it’s the complete opposite. So I don’t know how to try and fix it, but I also don’t know how to just break this bond and leave forever, which could potentially cause her to self-harm. I just want it all to stop so I can live my twenties as happy and amazing as possible. What should I do? —The Depressed Burden Daughter Dear Depressed, Advertisement Advertisement It definitely sounds like you are ready for some distance from your mother. Dealing with a volatile, verbally abusive parent tends to be a lifelong challenge, but all you have to do right now is make a decision for what’s best for your near future—by which I mean six months to a year. Thinking in terms of smaller time windows like that, I think, will be helpful for both you and your mother, because I don’t think either of you are ready to consider total and permanent estrangement yet (for one thing, such an extreme threat is what’s likely to provoke extreme responses). It’s not going to be an easy conversation (and you may find it safer to conduct over text or email), but you need to communicate this boundary to your mother in terms of “this is what’s going to better for our relationship in the long run.” Tell her that you feel hurt and upset by her treatment. Explain that you want to spend six months (or a year, whatever you want) on your own thinking about how to make your relationship with her work better for everyone, and set a specific date for when you will get back in touch (ideally around a holiday or a birthday). This way, you’re communicating your need for distance without making it feel like a total abandonment. Advertisement Advertisement Advertisement Advertisement She won’t love it, but this is the kindest way to go about setting boundaries. When the deadline nears, you can evaluate whether you’d like to extend it for another period of time, but you don’t have to worry about that right now. Instead, focus on getting your life out from under your mother’s shadow, and seek guidance, if possible, from a good therapist who can help you untangle a lifetime’s worth of mom stuff and help you figure out what’s realistic for the future of your relationship with her. Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, I’ve recently exited a relationship with an abusive partner. We lived together for two years, and he covered most of the rent, so it wasn’t an easy decision to make emotionally nor financially. Perhaps I was too quick to take an offer from a casual friend, who asked for partial rent in exchange for sitting her cats while she’s away for a month. But Prudie—she left me a really dirty house! I couldn’t even sleep there, the stench from the litter and the garbage combined were just awful. I’ve been cleaning the house in stages, but I’m really resenting my friend right now. Is it worth asking her to hire a cleaner? Should I say anything at all or shut up and be grateful? —Not a Beggar, Nor a Chooser Dear Not a Beggar, Advertisement Advertisement You are definitely allowed to say something, but you have to be extremely direct. Something like, “Hey, it’s kind of a mess here. Can we have a professional cleaner visit?” There’s no need to over-explain or cast judgment. I would hope that if your friend is kind enough to offer you a place to stay (well, with some strings attached) during a difficult period of your life, she would be considerate enough to take you for your word and send help. But if she’s weird about it in any way, you can just say, “I’m so sorry, but I’m going to stay somewhere else.” There’s no reason you have to stay anywhere (or with anyone) you’re not comfortable. Advertisement Want more Prudie? Slate Plus members get an additional column each week. Sign up for Slate Plus now. Dear Prudence, I’m a language teacher. I had a long-time student who studied with me for a couple of years. Unfortunately, we had a falling-out last year, which partly was my fault, and from that day on, he stopped attending our sessions. I tried reaching out three times: once, to sincerely apologize and twice to gently ask if he would still continue. Although the messages were read, I never got any reply. Advertisement Advertisement Advertisement Since then, I never bothered him anymore and just prayed that one day we will make peace with each other. Surprisingly, last December, after nine months, my student reached out to greet me with a happy birthday and after a week, he reached out again to ask how I’ve been. I took it as a sign that things are now okay on my student’s end. We exchanged a few lines, some holiday greetings and said that we will keep each other posted. I was really thankful that our communication line has once again been opened. Well, it’s been a month since my student reached out and I haven’t heard from him again. This is now my burden: This student has paid for his course two years in advance. Because of our falling out and his nonresponse last year, the money is still with me sitting on my PayPal. I feel that our situation still hangs. I somehow have this conviction to return his unused money. Prudence, there are two things I am considering doing. One is to ask him in a gentle way what he wants to do with his advance payment. However, I’m apprehensive because I feel that the timing is not right, especially since we’ve just reconnected. Mentioning money might push him away again, or he might think that I’m insinuating something like “I want him back.” The second thing I’m thinking is to just wait till the end of March, which is exactly one year since he stopped. If there are no signs that he will return, I’ll refund the money and just write a note. Advertisement Advertisement Advertisement In my heart, I wish he would just resume so I don’t have to go through this dilemma, and I could also somehow make up for the offense I’ve caused him. But I will never ask, chase, or force my student because I’d like him to return in his own pace and volition. What do you think is the safest and best thing to do? —Time Heals Dear Time Heals, I think it’s fine to simply return the money with a note whenever you’re ready; you don’t have to wait until March. It’s encouraging that this student reached out of his own volition to say hi, but the fact that he hasn’t directly addressed your apology from months ago (or the conflict itself) suggests to me that he doesn’t really know what he wants from this formal relationship going forward. If I were you, I wouldn’t want the stress of having to figure out what he wants or trying to read his mind. If he wants to continue the lessons or doesn’t want the money back, he can be a big boy and tell you himself. In the meantime, I’d encourage you to move on from this as best as you can. You didn’t elaborate on what the original “offense” was, but by the sound of your letter, you seem quite emotionally involved with this student. People drop classes all the time, or fade out of years-long relationships with trainers, tutors, etc. without much thought; you’re taking the dissolution of your relationship with this student personally when in all likelihood, it’s not. Advertisement Advertisement Advertisement Get Even More Advice From the Dear Prudence Podcast <div class="slate-megaphone__slot"></div> View Transcript Dear Prudence, I am a senior in high school, starting college in the fall. I’m an introvert with a tendency to self-isolate and I’m worried that, once I’m away from home, I’ll struggle to keep any friends I’m able to make. I’m also worried that I’ll overcorrect, go too hard on socializing, and burn out. Do you have any advice on how to manage that balance? —Solitary Student to Be Dear Solitary, Advertisement You’'''
