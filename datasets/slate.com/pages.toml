full_description = '''Dear Prudence Help! I Figured Out the Shocking Reason My Husband is Mourning His Co-worker’s Death. All I want to do is yell at him. By Emily Yoffe and Margo Howard Feb 16, 20255:55 AM Photo illustration by Slate. Photos by Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Our advice columnists have heard it all over the years—so we’re diving into the Dear Prudence archives to share classic letters with our readers. Submit your own questions to Prudie here. Dear Prudence, Three months ago, the woman who was having an affair with my husband died suddenly from an accident. I found out about the affair only two days after her funeral. I thought she was simply a co-worker and I was wondering why my husband was so disturbed and emotional. He quit his job, saying it was too traumatic to go to work. She was in the early weeks of pregnancy when she died and my husband doesn’t know whether he or her husband was the father. So, on top of everything, he’s also grieving for a baby which may or may not have been his. I find it extremely difficult to be emotionally supportive when he wakes up at 3 A.M. crying and trembling—yet I don’t have the heart to yell at him like I want to. He says she’s dead, so there’s no reason for me to feel jealous or threatened, and asks for my understanding as he grieves. We’ve barely talked these last weeks because I don’t know how to respond to my husband when he cries and says he misses her and wishes she were here, then also how much he loves me and that he never intended to leave me. I asked him to visit a marriage therapist together and he said he’s “not ready” to work on our marriage, and thinks he needs to see a grief therapist instead. Do I need to give him time to mourn the loss of his mistress? Or should I demand he focus on our marriage? —My Husband Is Mourning His Dead Mistress (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Related From Slate Laura Helmuth My Co-Worker Wears Very Tight Pants. I Suspect That It’s for a Nefarious Reason. Read More Dear My Husband is Mourning, You cannot impose a schedule on someone else’s grief. So I think you should let your husband fully experience his—alone. If you are being asked to be an understanding source of solace while he mourns the loss of his mistress, a woman who was possibly the mother of his child, then that is an emotional burden that’s simply outside the bounds of what one spouse can ask of another. He’s told you flat out he can’t work on his marriage because he’s too torn up about the death of the woman he loved. So I think you should tell him to move out while you each figure out what you want out of your marriage and life. In addition, I hope he is independently wealthy, or has fantastically in-demand professional skills, because quitting his job over her death indicates he’s gone off the deep end. I can’t imagine how he’s going to explain that departure to potential employers. Of course you’re reeling over these events, so if he won’t see a counselor with you, consider going alone. And you’ve left us all wondering: Does the grieving widower have any idea what his wife was up to? —Emily Yoffe From: My Husband’s Mistress. (February 26th, 2013) Advertisement Advertisement Advertisement Advertisement Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, How can we let our new neighbor know that everyone on the block can see through her windows? She keeps curtains over them, but when the light hits just right they are virtually see-through. There are a lot of children around and it has been a topic amongst them that you can see “Ms. Smith” naked most evenings. We don’t want to embarrass her, but it certainly needs to be brought to her attention. —Naked Neighbor Dear Naked Neighbor, You’re all living an update of Hitchcock’s Rear Window, one that could be called, Rear End Window. I’ll admit that as teenagers my sister and I spent many hours spying on our neighbors. We didn’t have as much fun as your community’s kids because our greatest titillation was watching the neighbors pass the Cheetos as they sat on the couch staring at the TV. I imagine that as the word spread in your neighborhood, a few of the husbands have found themselves suddenly armed with bottles of Windex and a desire to make sure the windows are sparkling. However illuminating all this is, the curtain has to come down on Ms. Smith. This is a case for which the anonymous note was made. Send one to her explaining that her sheers are not providing the coverage she needs. If she doesn’t quickly install black-out shades, then she’s getting a thrill by providing a peep show. —E.Y. From: The Nudist Next Door. (September 6th, 2011) Advertisement Dear Prudence, I am 25, and my husband and I have just moved into a cozy house in Beverly Hills. One afternoon when I was sunning outside, I heard a whistle from across the street. I looked up, and to my surprise it was closer than I thought, and there was an attractive, tanned, probably 19-year-old guy. I felt quite embarrassed about it, but we talked and soon got to know each other. He asked me out for coffee one night, and I accepted. I didn’t think it would be such a big deal since my husband has female social friends. After the coffee, I got so caught up in the moment that the next thing I knew, we were at his house having wild, passionate sex! The strange thing is that I felt no guilt—and I am married! Advertisement I enjoyed it, and when I left, he said, “Let’s keep it our little secret.” I don’t know what to do. Is there something wrong with me for feeling no guilt? I haven’t told my husband because I love him and I am afraid of his reaction. What should I do? —Confused Dear Con, Advertisement Advertisement Advertisement The next thing you knew, after coffee with the whistler, you were having sex?! Did you just levitate onto the bed? Three things occur to Prudie: 1) You are given to acting with very little thought about your actions; 2) times and mores have really changed since Prudie was 25; or 3) this is a gag. But let’s assume your scenario is on the level. (Which it may be. Prudie knew a woman who left a pretty good marriage because a man said to her at a beach club, “You are gorgeous.”) Obviously, you don’t think this situation is all right, or you wouldn’t be writing about what to do. Guilt is a very individual thing, having to do with many emotional factors; different people have different triggers for guilt. If you think your “little secret” will not complicate your life, then you have no problem. It is interesting that you worry about your husband’s reaction, however. That should tell you something. Perhaps you can make headway with your dilemma by imagining how you would feel if a teen-age neighbor seduced your husband and suggested the relationship be their “little secret.” Life is choices, my dear, and you have a big one to make. —Margo Howard From: Oops! … I Slept With a Stranger. (April 19, 2001) Advertisement Dear Prudence, Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I am engaged to be married to a wonderful man. He is kind and considerate and has many of the other qualities I admire in a human being. However, and it’s a big however, our sex life leaves a lot to be desired. I have tried talking about it, but he just doesn’t seem to “get it.” My responsibility in this scenario is that I have “faked it” too many times. You know the old saying: It’s too late to close the barn door once the horse is out. I really want to work this out but don’t know how. Also, since I am older than he, I am from the school that says “good women” don’t make a big deal about this and definitely don’t talk about it. I need your help. —Waiting to Exhale Dear Waiting, Advertisement Prudie is betting you have quite a bit of company in the faking-it department, though it may be somewhat unusual that after all the “performances,” the “actress” would like to rewrite the play. So … here are a couple approaches. You could say that you have somehow, uh, lost your orgasmic capabilities, and then kind of begin again, together. Or you could be absolutely honest and confess that, out of deference to his ego, you’ve been faking it … but you would now like to have a more fulfilling experience. Advertisement Advertisement Advertisement When you say you’ve brought the subject up but he “doesn’t get it,” this suggests you may need either books or a sex therapist … though it’s a little unclear to Prudie how you tried to improve the situation while at the same time pretending to be satisfied by him. Bottom line, it is Prudie’s belief that most loving men are willing to receive a pointer or two. Or three. —M.H. From: Over Sex. (November 2nd, 2000). More Sex Advice From Slate I am a 38-year-old woman, and I get regular massages. A few months ago, I started booking with a male massage therapist, and have been going to him consistently. I find him attractive—and at first, the massages definitely felt more personal and a bit suggestive, but not overtly sexual. Well, last session turned into an erotic massage and then some. I was definitely receptive to it … Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Dear Prudence Prudence Classics Advertisement'''
