full_description = "Who We Are Slate’s staff. Hillary Frey is Slate’s editor in chief. Previously, she was executive editor of HuffPost, editorial director of news at NBC News, media and culture editor at the New York Observer, and way back in the past, an editor at the Nation and Lingua Franca magazines (with a few other gigs in between). She is a graduate of the Executive Program in News Innovation and Leadership at the Newmark School of Journalism at CUNY and lives in Brooklyn with her daughter. Dan Check is chief executive officer of Slate. He previously served as director of technology. Before joining Slate, he managed the data warehouse at Catalist, a political data vendor. He is a graduate of Pomona College and currently lives in Washington. Charlie Kammerer is president of Slate, where he focuses on developing ways for brands to tap into Slate’s audience through editorial content, podcasting, video, and custom programs. Kammerer joined Slate in 2017 after spending 20 years at Time Inc., where he was a brand builder and revenue generator across a diverse portfolio of brands, including Real Simple, Fortune, Food and Wine, Cooking Light, Golf, and This Old House. He’s based out of Slate’s Brooklyn office. Staff and Contributor Biographies Sam Adams is a Slate senior editor. He was previously the editor of Criticwire, Indiewire’s film and TV criticism blog, and has written for the Los Angeles Times, Rolling Stone, and the Philadelphia Inquirer. He lives in Philadelphia. Shirin Ali is an associate writer of news and politics at Slate. She was previously a staff writer at the Hill and before that worked at CNN as a news associate. A graduate of Northwestern University, she currently lives in Chicago. Holly Allen is a Slate designer. A graduate of the University of Georgia, Allen lives in Colorado with her husband, Tripper, and their twin boys, Alex and Max. Rosemary Belson is an associate podcast producer at Slate, working on Mom and Dad Are Fighting, How To!, and Spoiler Specials. She graduated from the Missouri School of Journalism and lives in D.C. Jeffrey Bloomer is Slate’s editorial director. Before Slate, he worked at Nerve, Paste, and Film at Lincoln Center. He is a graduate of the University of Michigan. Sara Burningham is a podcast and audio documentary producer, editor, and writer. She is senior producer of Slate’s Amicus podcast with Dahlia Lithwick and founding editor of the Making Gay History podcast. Evan Campbell is the senior producer on What Next: TBD. When he’s not working, he’s spending time with his cat, making music, or in despair over the Dallas Mavericks. He previously worked at the Ringer and CQ Roll Call. Christina Cauterucci is a Slate senior writer and host of Outward, Slate’s podcast on LGBTQ+ life. She also hosted the ninth season of Slow Burn. The former arts editor of Washington City Paper, Cauterucci lives in Washington, D.C. Evan Chung is a senior podcast editor and producer at Slate. Previously, he was a producer for CNN, PRI’s Studio 360, and WBEZ’s Sound Opinions. He is a graduate of the University of Chicago. Originally from Chicago, he now lives in Brooklyn. Alexandra Cohl is Slate’s senior audience development editor for podcasts. She has a B.A. and M.A. in English literature and previously led the PR and marketing campaigns of over 30 podcasts, including award-winning shows like Father Wants Us Dead, Immigrantly, Admissible: Shreds of Evidence, and Sandcastles. She also writes the culture and women in podcasting newsletter Podcasting by the Moon and lives in Queens. Jenée Desmond-Harris is a Slate staff writer and editor. She writes the Dear Prudence advice column and previously worked at the New York Times, Vox.com, and the Root. Paola de Varona is a Slate senior editor, focusing on advice. Before joining Slate, she edited news at Verywell Health. Her work has appeared in places like the Outline, the Cut, and Bustle. Cameron Drews is a podcast producer at Slate. Previously, he worked on a variety of podcasts for Panoply, and before that, he produced daily news segments at WNYC in New York and KUOW in Seattle. Madeline Ducharme is a producer for What Next. She also worked on Slow Burn: David Duke and One Year. When she needs a break from staring at Pro Tools, she writes about science, culture, and LGBTQ+ life. A proud graduate of Barnard College, she now lives in Washington. Andrew Dunn joined Death, Sex & Money in August 2015, where he produces, scores, and mixes episodes of the show. He also co-created the Webby honoree podcast Bookable and has worked on episodes of Reply All, The Daily, Freakonomics, The Rachel Maddow Show, On the Media, Startup, Here’s the Thing With Alec Baldwin, Note to Self, and many, many more. Outside the world of podcasts he performs, records, produces, and mixes music. Dunn received a degree in film studies and music from Emory University in his hometown of Atlanta. Patrick Fort is a senior podcast producer at Slate. Fort joined Slate in 2023 after many years in public radio. Fort is the co-creator of the James Beard Award-winning food podcast Dish City. Fort is also an avid hockey fan and is a college hockey referee on the weekends. A Slate colleague once referred to Fort as a “podcast producer by day, [and] ice zebra by night.” Max Freedman is a producer on the podcast Decoder Ring. Before coming to Slate, he worked on podcasts at National Public Radio, including All the Only Ones, Code Switch, and Planet Money. He also co-created two critically acclaimed independent podcasts, School Colors and Unsettled. He grew up in Los Angeles and lives with his family in Brooklyn. Nadira Goffe is a staff writer of culture at Slate. Before Slate, she graduated from Temple University and the University of Leeds. When she’s not making podcasts, lying to herself about the serving size of doughnuts, or rewatching something for the 15th time, she’s writing in her closet-sized Brooklyn apartment. Braden Goyette is a news editor at Slate. She previously worked at the Appeal, CNN, and the Los Angeles Times, among other outlets. Henry Grabar is a staff writer at Slate. He likes buildings, trains, and maps. Rob Gunther is a senior producer for What Next. Previously, he worked as an audio journalist and podcast producer for WNYC New York Public Radio, Insider, and Apple News. Before journalism, he served as a public health volunteer in Ecuador with the Peace Corps. Mary Harris is the host and managing editor of What Next, Slate’s new daily news podcast. For the past decade, she has reported throughout the public radio system, for NPR, Marketplace, and WNYC. Her curiosity has taken her to needle exchanges and influenza laboratories; she’s even reported on her own treatments for breast cancer. Before working in public radio, she was a producer at ABC News. Aymann Ismail is a Slate staff writer. Previously, he was the host of the Slate podcast Man Up and created the award-winning Slate video series Who’s Afraid of Aymann Ismail? Before joining Slate, he worked for Animal New York. Derreck Johnson is a Slate web designer. He is a graduate of LIU Post and a born-and-bred New Yorker (currently residing in Los Angeles). Prior to Slate, he held a position as a web production designer at Time Inc. for Essence.com and Essence Festival. Fred Kaplan writes the War Stories column for Slate as well as occasional pieces on culture and consumer electronics. He is the author of The Bomb: Presidents, Generals, and the Secret History of Nuclear War, the novel A Capital Calamity, Dark Territory: The Secret History of Cyber War, The Insurgents: David Petraeus and the Plot to Change the American Way of War (which was a Pulitzer Prize finalist), 1959: The Year Everything Changed (2009), Daydream Believers: How a Few Grand Ideas Wrecked American Power (2008), and The Wizards of Armageddon (1983), as well as a former staff reporter for the Boston Globe, having been its military correspondent, Moscow bureau chief, and New York bureau chief. A regular writer on jazz and hi-fi for Stereophile, he has also written on a variety of subjects for the New York Times, New York Magazine, Atlantic Monthly, the New Yorker, Scientific American, and others. A long time ago, he was the foreign and defense policy adviser to Rep. Les Aspin. He graduated from Oberlin College and has a Ph.D. in political science from MIT. He lives in Brooklyn. Isabelle Kohn is a senior editor for Slate’s Life and Human Interest sections. Once a staff writer and senior editor at Mel, her work has also appeared in Vice, Playboy, Harper’s Bazaar, InStyle, and more. She graduated from the University of Colorado at Denver with a degree in public health, which she’s used exactly zero times. Her work focuses on all the little things that make you feel good. Dan Kois is a writer at Slate. He’s the author of five books: Hampton Heights, Vintage Contemporaries, How to Be a Family, The World Only Spins Forward (with Isaac Butler), and Facing Future. Scaachi Koul is a Slate senior writer. She’s also the co-host of the Ambie Award–winning podcast Scamfluencers and the Emmy-nominated Netflix series Follow This. Katie Krzaczek is a senior editor for Slate’s business section. Before Slate, she worked at the Philadelphia Inquirer, Business Insider, and Yahoo Finance, which is where she learned the difference between a bull and a bear market. She enjoys stories that reveal something weird about our collective humanity and believes that anything can be a business story if you dig deep enough. Josh Levin is the editorial director of the Slow Burn and One Year podcasts. He is the host of One Year and Season 4 of Slow Burn and co-hosts the sports podcast Hang Up and Listen. He is the author of The Queen: The Forgotten Life Behind an American Myth. Before coming to Slate, he wrote for the Washington City Paper. Levin, a native of New Orleans, graduated from Brown University. Candice Lim is the co-host of ICYMI, Slate’s podcast about internet culture. She comes to Slate from NPR, where she was an assistant producer and occasional panelist on Pop Culture Happy Hour. She graduated from Boston University and hails from Orange County, California. Dahlia Lithwick is a senior editor at Slate and the host of the podcast Amicus. She writes Supreme Court Dispatches and has covered the Microsoft trial and other legal issues for Slate. Before joining Slate as a freelancer in 1999, she worked for a family law firm in Reno, Nevada. Her work has appeared in the New Republic, Elle, the Ottawa Citizen, and the Washington Post. She is the author of Lady Justice: Women, the Law, and the Battle to Save America and co-author of Me v. Everybody: Absurd Contracts for an Absurd World, a legal humor book. She is a graduate of Yale University and Stanford Law School. Bryan Lowder is a Slate associate editor and co-host of the Outward LGBTQ podcast. He covers life, culture, advice, and queer issues. Ben Mathis-Lilley is a Slate senior writer. His prior employers include New York magazine, BuzzFeed, and Taco Bell. Susan Matthews is Slate’s executive editor. She has edited the science and jurisprudence sections of the magazine, and she hosted the seventh season of Slow Burn, on Roe v. Wade. Before joining Slate, she launched and edited Audubon.org. Natalie Matthews-Ramo is a web and interactive designer for Slate. She is a graduate of Rhode Island School of Design. Seth Maxon is a Slate senior editor. Previously, he was a producer for WNYC’s The Takeaway and has written for the Atlantic, NPR’s Planet Money, the Columbia Journalism Review, In These Times, and others. He is a graduate of the Columbia University Graduate School of Journalism and the University of Chicago. Abby McIntyre is Slate’s managing editor. Before Slate, she was an editor at Politico and is a graduate of Smith College. She lives in Michigan. Laura Miller is a books and culture columnist for Slate. She was a co-founder of Salon.com, where she was the New York editorial director and a staff writer. Her work has appeared in the New Yorker, Harper’s, the Guardian and the New York Times Magazine, as well as the New York Times Book Review, where she wrote the “Last Word” column for two years. She is the author of The Magician’s Book: A Skeptic’s Adventures in Narnia. Joel Meyer is a senior editor and producer for Slate’s narrative podcasts Slow Burn, Decoder Ring, and One Year. He previously worked for WNYC Studios, WBEZ, Pushkin Industries, and Freakonomics Radio. His credits include an acclaimed origin story (Making Oprah), a soccer meltdown (American Fiasco), and a track and field shocker (Legacy of Speed). Meyer was born in an Oldsmobile on Interstate 35W in his hometown, Minneapolis. Jim Newell is Slate’s senior politics writer. He previously served on the staffs of Salon, Gawker, and Wonkette, and his freelance work has been featured in numerous publications including Bookforum, the Guardian, the New Republic, the Baffler, the American Prospect, and the Daily Beast. A graduate of the University of Pennsylvania, Newell lives in Washington. Lizzie O’Leary is the host of What Next: TBD, Slate’s podcast about tech, power, and the future. Previously, she created and hosted Marketplace Weekend and, before that, was a correspondent for CNN and Bloomberg News. She is also a columnist for Wealthsimple Magazine. Molly Olmstead is a Slate staff writer. She is a graduate of the Missouri School of Journalism and lives in Washington. Rebecca Onion is a Slate senior editor and the author of Innocent Experiments. Her writing has also appeared in Aeon Magazine, the Virginia Quarterly Review, the Atlantic online, and the Boston Globe’s Ideas section. A graduate of Yale University, she holds a Ph.D. in American studies from the University of Texas at Austin, and lives in Athens, Ohio. Paige Osburn comes to Slate and What Next from the world of public radio, where she produced and reported for NPR, WAMU, and KPCC, among others. Most recently, she was the managing editor for 1A, covering everything from the 2020 election, to video games, to cottagecore. Her work has taken her from Normal, Illinois, to Los Angeles, California, to (finally) the East Coast and D.C. She lives in Petworth with her husband and her 9-year-old German Shepherd, who hates everyone. Nitish Pahwa is a Slate staff writer. He graduated from Michigan State University and lives in New York. Shannon Palus is Slate’s features editor. Her work has appeared many other places including Popular Science, Scientific American, the Atlantic, and Wirecutter. Willa Paskin is the host of the Decoder Ring podcast. She previously worked at Salon and Vulture, among other places. She is a graduate of the University of Chicago. Narda Pérez is Slate’s senior audience engagement editor. In her past lives, she worked on the audience teams at Wirecutter and the Dallas Morning News. She’s a graduate of the University of Texas at Arlington and lives in Dallas, where she was born and raised. Ben Richmon"
