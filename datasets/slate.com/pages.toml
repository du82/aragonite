["https://slate.com/advice/2025/02/millions-dollars-retire-early-how-to-money-advice.html"]
title = "Early retirement advice: My husband and I might be set for life, money wise. But every financial planner we talk to has a vexing question."
description = "We feel a little dumb that we don't have an answer."
full_description = '''Pay Dirt My Husband and I Might Be Set for Life, Moneywise. But Every Financial Planner We Talk to Has a Vexing Question. We feel a little dumb that we don’t have an answer. Advice by Kristin Wong Feb 26, 20254:43 PM Photo illustration by Slate. Photo by EpicStockMedia/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Pay Dirt is Slate’s money advice column. Have a question? Send it to Kristin and Ilyce here. (It’s anonymous!) Dear Pay Dirt, My husband and I, both in our 40s, are high-earners with a healthy amount of money saved—around $2 million in our retirement funds, and nearly that much in investment and savings accounts as well. We think we might have enough money that we could afford to retire early. But … we just don’t know. Every financial planner we’ve talked to about retiring early has asked us to start by providing them with our monthly budget, which they then use to make projections and calculations. But we have no idea what our real budget is. Our monthly expenditures are currently bloated with convenience-spending: a housecleaner, paid yard work, frequent takeout, frequent Ubers, etc—all things that we use to keep our house running smoothly while we work long hours at the aforementioned six-figure jobs. I’d like to assume that our monthly food budget would halve itself if we were meal-planning and cooking from scratch rather than eating out, but I don’t have a way to road-test that budget, because … I don’t have time to cook from scratch right now. Similarly, our mortgage could be a lot less if we moved out of our major metropolitan area, which we’re totally willing to do, but which we can’t do now because our jobs are here. How do we estimate or simulate a lower cost of living lifestyle, moneywise, when we can’t afford to actually have that lifestyle now, timewise? —Kind of Rich, Kind of Dumb (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Related From Slate Nicole Chung I Just Discovered My Husband’s Secret Punishment Method for Our Toddler. I’m Appalled. Read More Dear Kind of Rich, I wouldn’t call your situation dumb—no one can predict the future, much less come up with a budget that’s totally accurate for it. You can, however, make some estimations about your future expenses. One way to do this is to go through your expenses and separate out the costs that are tied to your current working life. You could call these “work life” costs, and they might include things like Uber rides, yard work, takeout, and so on. Separate these costs from those you’d still have in retirement —a mortgage, utilities, and insurance for example. To get a better idea of those numbers, research potential living costs of any new places where you’d consider relocating. There are online calculators that can help you do this and give you estimates for housing, taxes, and other expenses. From there, come up with a hypothetical monthly budget. Advertisement Advertisement Advertisement Then compare that to a sustainable withdrawal rate from your current savings—a good rule of thumb is to aim to withdraw 4 percent annually from your portfolio. Here’s another calculator that can help you with that. The problem with this is that you run the risk of underestimating how much your lifestyle will cost in retirement. In other words, yes, your cost of living might be a lot lower if you retire early, move to a cheaper city, and cut the convenience spending. But what if you retire and take on a really expensive hobby? Or decide that you want to travel a lot more? What if a health issue arises? What if you decide to move onto a large property in a rural area where your mortgage is low, but you end up needing more paid help with yard work than you do now? Advertisement The reason your financial planners are probably asking you to provide them with your monthly budget now is that even if it’s a little high, well then, you’ll get a safer estimate about whether or not you can afford to retire early. It’s so much better to think you need more money than you really do to retire. You don’t want to retire early, then realize you don’t have the funds to do all the things you want to do, and feel constrained to a tight budget for the rest of your life. The point is, there are a lot of “what ifs” regarding the future that you just won’t know until you get there. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Teen Just Blew Up at Me Over His “Right to Privacy.” Excuse Me? You can, however, try to gather more data—by doing the hard thing, and really trying to simulate your future lifestyle. Cut back on the Ubers for a month, and see how it goes. And then the takeout. Cook meals at home and see how much your grocery spending compares to your takeout spending. (And how much, convenience aside, you really just miss the ability to order pizza.) Try your best to live on that simulated retirement budget for a little while and see how manageable it is. Advertisement Advertisement You’ll still be working while you do this, so it’s not a perfect experiment, but it will give you an idea of what your expenses will be like down the road. You can also think about what expenses you’d like to add in retirement: make a bucket-list of activities you’d like to do, and places you’d like to see, and think about how much money you’d need annually to cover those expenses (or subtract the cost of a cruise to Antarctica from your overall assets). In general, I would err on the side of overestimating how much you’ll need. That way, you can retire early without constantly worrying about money, which is not much more fun than working for a living. —Kristin Advertisement Advertisement More Advice From Slate My wife is extremely ambitious and career-minded; she graduated high school with a two-year degree and is now in a management position at a big software company, which is amazing for her age. I have always wanted to be a stay-at-home dad. I love kids and have always wanted to partake in the amazing journey that is helping a little person navigate the world. This was discussed at length before we got married and especially before we decided to get pregnant. But now that our daughter is 6 months old, my wife has changed her mind entirely. Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Personal Finance Slate Plus Advertisement'''
