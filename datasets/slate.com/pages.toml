full_description = "Slate’s Privacy Policy Our data-collection practices. Last updated: July 8, 2024 The Slate Group LLC (“Slate,” “we,” or “us”) is committed to bringing you information tailored to your individual needs. This Privacy Policy describes how we collect, use, and disclose information through the websites, mobile applications, and other online services and products that link to or post this Privacy Policy (collectively, the “Services”). Please read the entire Privacy Policy before using our Services. By using the Services, you consent to the terms of this Privacy Policy and our Terms of Service. We may sell or share your Personal Information as further described below. If you are located in the United States, including in California, Colorado, Connecticut, Nevada, Virginia or Utah, and would like to opt-out of the sale or sharing of your personal information click here, the button below, or email us at privacy@slate.com. Cookie Preference Center (JavaScript Required) Please see Your State Privacy Rights for more information on how we respond to consumer requests. You do not need to create an account with us to exercise your opt-out rights. We will only use and retain personal information provided in an opt-out request to review and comply with the request. 1. Information Collection A. Information You Provide. We collect personal information from you when you use the Services. “Personal information” means information that identifies, relates to, describes, is reasonably capable of being associated with, or could reasonably be linked, directly or indirectly, with a particular consumer or household. • Contact information, such as name, e-mail address, postal address, and telephone number;• User name, display name, and password;• Demographic information, such as age, race, and gender;• Payment information, such as credit card number and expiration date, through a third-party payment processor*;• Communications preferences;• Search queries;• Stories, comments, photos, and other information posted in our interactive online features;• Correspondence and other information that you send to us; and• Additional information as otherwise described to you at the point of collection or pursuant to your consent. *If you use the Site to make purchases, we will also collect certain payment information, such as payment card, PayPal, Square, or other financial account information, and billing address. A third-party payment processor collects that information; we do not store your credit card information. Personal Information once “de-identified” is not subject to this Privacy Policy and we may treat it as non-Personal Information and use it without obligation to you except as prohibited by applicable law. B. Information Automatically Collected. We also collect certain information automatically when you visit the Services (“Usage Information”), including: • Your browser type and operating system;• Your Internet Protocol (IP) address, which is the number automatically assigned to your computer whenever you access the Internet and that can sometimes be used to derive your general geographic area;• Geolocation information, including precise information;• Transaction data on items you purchase on our site or through our partners;• Other unique identifiers, including mobile device identification numbers;• Sites or mobile apps you used before and after using the Services;• Pages you view and links you click on within the Services;• Information collected through cookies, web beacons, and other technologies;• Information about your interactions with e-mail messages, such as the links clicked on and whether the messages were opened or forwarded; and• Standard Server Log Information. We may use cookies, pixel tags, and other technologies to automatically collect Usage Information: o Cookies and Pixel Tags Cookies are small bits of information that are stored by your computer’s web browser. You can decide if and how your computer will accept a cookie by configuring your preferences or options in your browser. However, if you choose to reject cookies, you may not be able to use certain online products, services or features on the Services. Pixel tags are very small images or small pieces of data embedded in images, also known as “web beacons” or “clear GIFs,” that can recognize cookies, the time and date a page is viewed, a description of the page where the pixel tag is placed, and similar information from your computer or device. o Embedded Scripts An embedded script is programming code designed to collect information about your interactions with the Services. It is temporarily downloaded onto your device from our web server or a third party with whom we work, is active only while you are connected to the Services, and deleted or deactivated thereafter. o Location-identifying Technologies GPS (global positioning systems) software, geo-filtering, and other location-aware technologies locate (sometimes precisely) you for purposes such as verifying your location, understanding the geographic distribution of our users, and delivering or restricting relevant content based on your location. o Device Fingerprinting Device fingerprinting is the process of analyzing and combining sets of information elements from your device’s browser, such as JavaScript objects and installed fonts, in order to create a “fingerprint” of your device and uniquely identify your device and applications. o In-App Tracking Methods There are a variety of tracking technologies that may be included in mobile applications, and these are not browser-based like cookies and cannot be controlled by browser settings. Some use device identifier, or other identifiers such as “Ad IDs” to associate app user activity to a particular app and to track user activity across apps. You can stop all collection of information via our mobile applications by uninstalling them. Also, you may be able to exercise specific privacy choices, such as enabling or disabling certain location-based services, by adjusting the permissions in your mobile device and/or Slate’s iOS or Android mobile applications. For further information on tracking technologies and your choices regarding them, please see Section 6 below. o Analytics and Advertising Tracking Technologies. We allow outside entities to place and read their own cookies, web beacons, and other technologies to collect information through the Services. For example, our vendors may use these technologies to collect information (i) that helps us with traffic measurement, research, and analytics, and (ii) that is used to serve advertisements on our Services and across the Internet and on other apps tailored to your apparent interests. To the extent we combine information from outside services with Personal Information we collect directly from you on the Services, we will treat the combined information as Personal Information under this Privacy Policy. Otherwise, the information collected and stored by outside entities remains subject to their policies and practices, including whether they continue to share information with us, the types of information shared, and your choices on what is visible to others on third party services. We use various analytics services that may use cookies or other tracking technologies to help us analyze how users interact with and use the website, compile reports on the website’s activity, and provide other services related to website activity and usage. These technologies may collect information such as your IP address, time of visit, whether you are a return visitor, and any referring website. The information generated by these providers will be transmitted to and stored by them and will be subject to their privacy policies. For a full list of third party partners with links to their privacy policies and opt-out options, including analytics services, see our Third Party Partners page. You may choose whether to receive interest-based advertising by submitting opt-outs. Some of the advertisers and service providers that perform advertising-related services for us and our partners may participate in the Digital Advertising Alliance (“DAA”) Self-Regulatory Program for Online Behavioral Advertising. To learn more about how you can exercise certain choices regarding Interest-based Advertising, visit http://www.aboutads.info/choices, and http://www.aboutads.info/appchoices for information on the DAA’s opt-out program for mobile apps. Some of these companies may also be members of the Network Advertising Initiative (“NAI”). To learn more about the NAI and your opt-out options for their members, see http://www.networkadvertising.org/choices/. You can also opt out of interest-based advertising within mobile apps based on advertising identifiers on your device (for example, through cross-app tracking). See the Advertising and Privacy options under your device’s Settings for more information. Please be aware that, even if you are able to opt out of certain kinds of interest-based advertising, you may continue to receive other types of ads. Opting out only means that those selected members should no longer deliver certain interest-based advertising to you, but does not mean you will no longer receive any targeted content and/or ads (e.g., from other ad networks). Slate is not responsible for effectiveness of, or compliance with, any third-parties’ opt-out options or programs or the accuracy of their statements regarding their programs. Choices About How We Use and Disclose Your Information and Do Not Track Disclosures. Some web browsers may transmit signals such as “do-not-track” (DNT) or Global Privacy Control (GPC) to the websites with which the user communicates. Because of differences in how web browsers incorporate and activate this feature, it is not always clear (especially with DNT), whether users intend for these signals to be transmitted, or whether they even are aware of them. Slate will endeavor to take action in response to these signals. Globally, Slate will interpret the browser “do-not-track” signal as an opt-out signal of the Sale of Personal Information to the US Privacy API. For more information on “do-not-track” and Global Privacy Control, visit http://www.allaboutdnt.com and https://globalprivacycontrol.org/. Residents of the United Statues, including in California, Colorado, Connecticut, Virginia or Utah may have additional personal information rights and choices. Please see Your State Privacy Rights for more information. To exercise this right, please visit our “Do Not Sell or Share My Personal Information” webpage. C. Information from Other Sources We obtain information about you from other sources, including service providers (as defined under the California Consumer Privacy Act) and third party services, and combine such information with information we have collected about you. To the extent we combine such information from outside sources with Personal Information we have collected about you on the Services, we will treat the combined information as Personal Information under this Privacy Policy. We are not responsible for the accuracy of any information provided by outside sources. 2. Use and Retention of Information We use and retain information that we collect through the Services for a variety of purposes, including to: • Provide you with the products, promotions, services, newsletters, and information you request and respond to correspondence that we receive from you;• Customize and personalize your use of the Services;• Provide Slate Plus users with premium content, products, promotions, and information;• Contact you via email and otherwise about products, services, and events that we think might be of interest to you;• Contact you with surveys, legal notices, and other information that may be relevant to your use of the Services;• Maintain or administer the Services, perform business analyses, or for other internal purposes to improve the quality of our business, the Services, and other products and services we offer;• Publish stories, comments, and other information posted in our interactive online features;• Process employment applications and inquiries;• Create articles and other content;• Detect, investigate, and prevent activities that may violate our policies or may be fraudulent or illegal;• Deliver advertising, including interest-based advertising, to show you relevant ads both on our Services and elsewhere, and measure the effectiveness and reach of ads; and• As otherwise described to you at the point of collection or pursuant to your consent. 3. Sharing of Information We want you to understand when and with whom we may share the information we collect. We share information that we collect through the Services as follows: • Corporate Parents, Affiliates, and Subsidiaries. We share your information with our corporate parents, subsidiaries, and other affiliated entities as needed to process your questions or respond to your requests. • Service Providers. We share your information with our agents and service providers that perform certain functions or services on our behalf, such as to host the Services, manage databases, host a store or other e-commerce platform, perform analyses, conduct surveys, place Slate-branded content on third-party websites, or send communications and newsletters for us. • Select Business Partners. We share your information with select business partners so that they can provide you with special offers, promotional materials, advertisements and other materials that may be of interest to you. Residents of the United States, including in California, Colorado, Connecticut, Virginia or Utah, may have additional personal information rights and choices. Please see Your State Privacy Rights for more information. To exercise this right, please visit our do not sell or share my information webpage. • Other Parties When Required By Law or as Necessary to Protect the Services. We will disclose your information to outside entities in order to protect the legal rights, safety, and security of Slate, our corporate parents, affiliates, and subsidiaries, and the users of our Services; enforce our Terms of Service; prevent fraud (or for risk management purposes); and comply with or respond to law enforcement or legal process or a request for cooperation by a government or other entity, whether or not legally required. • In Connection With a Transfer of Assets. If we sell all or part of our business, or make a sale or transfer of assets, or are otherwise involved in a merger or business transfer, or in the event of bankruptcy, we may transfer your information to one or more third parties as part of that transaction. • Other Parties With Your Consent. We share information about you when you consent to such sharing, including when you post information to a user profile or a public area of the Services, such as a chat room, forum, blog, or other community tool. • Aggregate Information. We disclose to th"
