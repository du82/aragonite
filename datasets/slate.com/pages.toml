title = "Parenting advice: The teacher called to say my son needed to be picked up. I could never have guessed the reason why."
description = "I don't want to make him feel bad about any of this!"
full_description = '''Care and Feeding The Teacher Called to Say My Son Needed to Be Picked Up. I Could Never Have Guessed the Reason Why. I don’t want to make him feel bad about any of this! Advice by Ben Mathis-Lilley Feb 26, 20255:34 PM Photo illustration by Slate. Photo by Deagreez/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Care and Feeding is Slate’s parenting advice column. Have a question for Care and Feeding? Submit it here. Dear Care and Feeding, This is my son’s first year of full-day school and his first year where he has to walk down a hallway to a bathroom with multiple stalls, instead of having a bathroom with a single toilet accessible from the classroom. He’s terrified to go and he simply refuses, insisting to his teacher that he doesn’t need to. He goes by himself at home so it’s not a matter of not knowing the process. We have made some progress with him peeing at school (he has done it a handful of times now). But pooping is absolutely off the table. This came to a head last week when the teacher told me at pick up that he’d been crying for two hours but all he could tell her was he missed me. Turns out he needed to go very badly, but didn’t want to, and we had an accident on the walk home because of it. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); I obviously don’t want to make him feel bad about any of this—I mostly try to use rewards to encourage him. The teacher is aware of the issue and is doing what she can to help (encouraging him to go and offering to let a friend walk to the bathroom with him) but we just aren’t making much headway. He loves school and his teacher and we aren’t having issues other than the bathroom. How can I help him not be scared of pooping in the bathroom at school? —I Can’t Hold It! Dear Hold It, First off, thank you for welcoming me to my first Care and Feeding column in the most appropriate way possible: With an invitation to talk about kids going to the bathroom. I’m a politics writer at Slate, and as the father of three children eight years old and younger, this is of course a topic I spend a great deal of time thinking about. My wife and I have even encountered your particular problem with our middle child—except that she didn’t want to go anywhere, including at home. Advertisement Advertisement Advertisement My first reflex is simply to note that it is very cute that your son’s way of expressing that he doesn’t want to go to the bathroom is to say that he misses his mom. How special, to be so integral to someone’s sense of comfort and companionship that he cries when he thinks about performing the most private of bodily functions without your immediate physical presence! One of those things that we will eventually remember fondly during the Independent Teenager phase. Advertisement Related From Slate Nicole Chung I Just Discovered My Husband’s Secret Punishment Method for Our Toddler. I’m Appalled. Read More As to how you should respond, I suspect that the most timeless piece of young-child parenting advice applies here first: reassure yourself that this is a very common—and even natural —problem which will likely resolve itself as your child grows and realizes himself that pooping at school is no big deal. I agree with your instinct that tough talk is probably not going to help here. I’m someone who does think that parents should use Scary Voice sometimes, but the problem is that he’s already too scared of something that he doesn’t need to be scared of! But a straightforward candy-toy type reward is probably not going to work because it’s too abstract for him in the moment of crisis. So my best idea is probably to make it a self-rewarded reward, if you will: Conveying to him that this is something he can do to make himself be a Big Kid, perhaps something that he might be excited to show his teacher he can do—maybe with his teacher, and a favorite school toy or animal, as witnesses and observers? When it comes to kids and bathrooms, sometimes it takes a village. Advertisement Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Care and Feeding,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Care and Feeding following up) Submit Dear Care and Feeding, I’m struggling with how to respond to my 5 year old when he wastes food (and makes a mess in the process). Like, this morning he requested an egg sandwich on a particular kind of bread that he ate yesterday and liked. But then, he picked the bread into a ton of pieces, not really eating it, and scattering crumbs everywhere, and ate maybe half of the egg from the inside of the sandwich. Advertisement That’s just the latest example. It’s aggravating because I see it was wasting food, money spent on the food, and my time prepping something that he doesn’t actually eat. My wife is able to let this roll off her in a way I just can’t (won’t?) so it’s up to me to propose solutions, and nothing I’ve tried has worked. What should I do? —Waste Not, Want Not Dear Waste Not, The picking food apart thing! It’s crazy, isn’t it? Why do they do it? The urge to just see what happens when you turn something into something else with a different structure—especially when that thing is as tactile and dynamic as a combination of foods—is simply too strong, apparently. Advertisement Advertisement Advertisement I should admit that adherence to the norms of food consumption has not been something that I have been especially strong in cultivating in my children. They largely reject most of the world’s flavors, finish their food either much too slowly or much too quickly, and have a habit of standing up while eating to wander into other rooms, sometimes leaving their meal behind, and sometimes bringing it to a place where its crumbs will later create a “mouse situation.” Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I do think I’ve been making some progress on this lately, though, in a way that might be useful to you to consider. I’ve accepted that getting the kids to simply “eat normal” is one of those things that you can’t expect and demand immediate adherence to, in the manner of rules about things like “not running in parking lots” or “not hitting your siblings.” For whatever reason, the food habits just take longer to sink in, and as soon as your head is turned, your kids will stop adhering to them. So what I’ve been doing is just sitting with them while they’re eating, staying extravagantly patient, and reminding them in a helpful-question voice (“How do we sit when we eat? Do we play with our food or eat it?”) every time they stray. The repetitiveness, it seems, is having a positive effect. Advertisement Advertisement Advertisement The other thing I’ve heard you can do about this is to eat meals with your kids so that they see you modeling the right behaviors. You could try this, but it’s not on the table for me. Sorry, I am not having my last meal of the day at 5 p.m. while being constantly interrupted by someone who needs help moving a noodle into their mouth from one foot away. Non-starter! —Ben More Advice From Slate I need help with my in-laws! I am the mother of a bright and wonderful 14-month-old daughter. My husband and I love her dearly, and she is the only grandchild in both of our families. But my in-laws have been overbearing since the start. Now, they have started referring to her as “their” baby. That’s not all. Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Child Care Family Advertisement'''
