full_description = '''Dear Prudence Help! My Mom Buys “Gifts” Deliberately Meant to Sabotage Me. She needs to stop. Advice by Delia Cai Feb 24, 202510:59 AM Photo illustration by Slate. Photo by valiantsin suprunovich/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My mother keeps giving me underhanded gifts. It’s happened for years. As an example, I have a badly scarred spine from scoliosis surgery, and she bought me a backless dress. I’m allergic to nuts, but she buys me peanut butter truffles. I’m recovering from body-image issues (which she caused by calling me fat throughout my childhood), and she sends me high-calorie foods. I’m 18 now, but she still sends me these underhanded gifts every single holiday. I’ve tried talking about it but she just plays the victim (i.e., “You don’t like what I bought you? Why do you hate your mother! I’m just trying my best!”) and I don’t know how to say, “Just stop giving me these insults covered in wrapping paper!” without hurting her feelings, because then she’ll cry to my dad, her parents, and my sisters that I hate her, and then I’m fighting with the entire family. How can I make her stop? —Tired in Texas Dear Texas, (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); While it’s difficult to deny the urge to play armchair psychologist and wonder at your mother’s passive-aggressiveness (not to mention her inability to take feedback without making it about her), I think it’s a better use of everyone’s time if you simply establish a blanket “No gifts” rule from the entire family for a while. Say that you’re trying to be less materialistic, and that you’d like to redirect any gifting efforts to your favorite charity. If the rule applies to the entire family, your mother can’t make it about her. Hopefully this way, you can finally enjoy trips to the mail room without dreading what barbed insult might be waiting for you. If your mother continues to foist these loaded gifts onto you via mail, I give you permission to hand over the packages to a willing friend without even opening them—or ask the post office to return the package to sender. The second option may open up the conversation you’re trying to avoid, but you might be better off talking about the issue than skirting around it forever. Advertisement Advertisement Advertisement Get advice from Prudie—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, My 25-year-old kid, “Alex,” lives with me. Alex is a talented visual artist and my ex-husband and I have all supported their endeavors in that regard, including some significant financial sacrifices. Alex seems to be suffering from the classic case of failure to launch, but that isn’t really why I’m writing. My issue is with Alex is lack of ability to care for their health. I believe they have an unaddressed eating disorder. Alex was a skinny child, and in their last two years of high school, carried around just a few extra pounds, but was active and had good eating habits. Alex was in their second year of college when COVID hit. Around that time, Alex started on antidepressants, and fell and cracked their pelvis. They were suddenly stuck alone in a three-story walk up having food and groceries delivered. They put on 100 pounds in three months. I don’t talk to Alex about the weight. I believe Alex lies to their doctor about their eating habits and hasn’t been honest about their overeating. Advertisement Now that Alex has moved back in with me, as a mother, I’m finding it becoming impossible to watch them eat less than one vegetable a day, and make many, many other poor food choices that their long-term health is going to pay for in major ways. It isn’t even really the weight I’m worried about, at least not so much as the fact that Alexis barreling toward major health issues, including adult diabetes, for which there is much precedent on both sides of the family. The final straw for me came yesterday when I told them I was getting a non-prescription blood sugar monitor for myself and offered to get one for them. They shut me down hard and fast so I know I touched a nerve. I want to kick them out of the house for my own sanity. It is too hard for me to watch. I do see signs of maturity kicking in ever since they got their first job six months ago, so maybe it’s time. Am I wrong to kick them out? How do I do that? —Body Conscious Dear Body Conscious, Advertisement Advertisement Part of becoming an adult involves learning how to tend to your health, but I can’t imagine that the pandemic (or Alex’s other mental and physical health concerns) made that easy. I would encourage you to have a little more compassion regarding this extraordinarily hellish and isolating period for your child during a stage of their life that would already be confusing and overwhelming under normal circumstances. It sounds like they did the best they could. Advertisement And in my experience, it’s not uncommon for people to spend their entire 20s (and 30s!) figuring out how to establish and maintain a healthy lifestyle. That’s all to say that while I don’t think Alex’s lifestyle habits are necessarily ideal, they’re certainly not out of the ordinary for someone of their age or generation. It sounds like Alex has specific feelings about their health and their weight, so they’re not totally oblivious to your concerns. But this is a journey they have to navigate on their own; at that age, no one wants to listen to what their parents think they should do with their bodies. Of course, as Alex’s mother, you can’t help but worry. I think you can use that as the real reason for motivating Alex to move out. First, apologize for offering the unsolicited blood sugar monitor. Explain to Alex that, as their mother, it’s been your job for the past 25 years to be fussy and “annoying” about their well-being. Now that they’re a grown adult, you can understand theoretically that it’s no longer your job to nag them about things like vegetables or food choices (which is true), but that it will still be difficult to curb the motherly impulse, especially when Alex is still living under your roof. You can say something like, “Listen, I don’t have to agree with the choices you’re making, but when we’re living in such close proximity, I can’t help worrying or judging those choices.” Advertisement Advertisement Advertisement Advertisement Ideally, Alex should get the hint here, which is: If they continue to stay in your house, you’re going to continue to nag. And that’s not going to be fun for either of you, or your relationship. Talk about how some much-needed space will be better for everyone, especially since it’ll get you off their back. Send Us Your Questions About the Workplace! The columnists behind our new advice column, Good Job, want to help you navigate your social dynamics at work. Does your colleague constantly bug you after hours? Has an ill-advised work romance gone awry? Ask us your question here! Dear Prudence, I have a friend who identifies as a vegetarian. I’ve never seen him eat meat and have no reason to doubt his commitment to a plant-based lifestyle. But on several recent occasions, he enthusiastically ordered and ate a Caesar salad. Now, I’m a vegetarian too—and so I happen to know that Caesar dressing almost always contains anchovies. (There are vegan alternatives, but they weren’t listed on the menu.) On occasions when I’ve seen him eating it, though, I have refrained from telling my friend that he was likely eating fish products. Advertisement Advertisement My question: Should I have told him? And should I tell him now, so he knows in the future? If so, how do I bring it up? It feels a little rude to say, “Hey, you actually can’t eat that thing you obviously enjoy.” Although I’m a vegetarian, I, of course, believe people should be able to decide for themselves what to eat. What if he already knows that Caesar dressing contains anchovies and has simply decided his vegetarian principles are flexible enough to allow it? I don’t want to come across as shaming him for being an insufficiently committed vegetarian! —Fishy Situation Dear Fishy Situation, Advertisement As long as you broach the subject from a place of non-judgment and genuine concern, it’ll be hard for you to go wrong here. Next time he reaches for that dish, all you have to say is: “Hey, since I know you’re vegetarian, I just wanted to double-check that you know the deal about Caesar salad.” But you could also make a comment next time along the lines of, “Wow, I used to really love an anchovy-heavy Caesar salad. How is it here?” Dear Prudence, My girlfriend calls herself an introvert, but I think it’s more accurate to say she’s an extrovert who hates the company of pretty much everyone but me. Because of this, all of her extroverted energy is directed toward me. I’m extremely introverted and need alone time to decompress, which she doesn’t understand and takes as a personal rejection. We moved in together this past summer, and we’re both teachers in the same school district, so there are no times when she’s at work and I’m at home. So there are no breaks from the togetherness and interaction. Shopping trips, yard work, and meetups with friends are all couples activities. Advertisement Advertisement Advertisement I’ve tried to gently suggest that my need for a few hours to read, listen to music, or whatever in an empty house is not a rejection of her, but it’s just not getting through. I’ve tried to push her to go out with friends alone, but she claims to dislike them and their vibes. She’s a wonderful person in every other way and I genuinely love her, and it seems weird to consider breaking up over this, but the thought of 50 or more years of this makes my anxiety spiral out of control. Is there a solution I’m missing? —Please Leave Me Be Dear Please, Advertisement Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Introverts or not, that’s a lot of togetherness for a couple. I would suggest that you raise this issue with her as a matter of relationship styles and possible codependency. Have a talk where you both share your views on what an ideal week might look like in terms of time shared as a couple versus time spent doing your own thing. She will likely not see the problem with doing everything together all the time, which is where you can discuss your concerns about growing too codependent (every couple, of course, is a little codependent. It’s kind of the point!). Advertisement Advertisement Ask open, curious questions about what your girlfriend needs to feel safe and secure in the relationship, and then see if you can bring the conversation to a place where you both can negotiate over how best to address each others’ needs. If you can agree to schedule a bonding activity for the two of you after a block of alone time, would that make her feel more secure? Ultimately, you may find out that your girlfriend wants to be that codependent, and that may be a difference in relationship preferences that will have long-term implications. But first, find out from her perspective why it feels so important to have so much togetherness in the first place. —Delia Classic Prudie My older brother lost his wife suddenly when he was 28. She was literally the girl next door and they’d been together since they were 14. It was devastating and I don’t think he has ever really gotten over her loss despite grief counseling and time. He briefly tried dating about five years after she’d passed but said it felt empty and hollow and he didn’t enjoy it. Fast forward 14 years and he is a successful businessman with a lot of hobbies. His life is pretty full but he gets lonely sometimes and wants human connection, but not a commitment. With the popularity of hook up apps, he is able to have his sexual needs met and when he wants to go out to dinner or have companionship on a date, he hires an escort. Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Dear Prudence Advertisement'''
