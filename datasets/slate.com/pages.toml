["https://slate.com/culture/2025/02/gymnastics-frederick-richard-uniform-mens-winter-cup.html"]
title = "Men’s gymnastics: Fred Richard’s new uniform at the 2025 Winter Cup has a clear mission."
description = "He’s too classy to say what their problem is. But I’m not."
full_description = '''Sports Men’s Gymnastics Uniforms Leave Nothing to the Imagination. One Olympian Is Trying to Change That. Fred Richard is waging a battle of the bulge. By Rebecca Schuman Feb 27, 20255:45 AM The new threads in action. Photo illustration by Slate. Photo by Instagram/frederickflips. Tweet Share Share Comment Tweet Share Share Comment Winter Cup, an elite gymnastics competition that takes place at the end of February, is normally a sleepy event, garnering the attention only of hardcore fans. Last weekend, however, the traditional opening meet of the 2025 American season broke out of the “gymternet” and into regular-person news—for its men’s competition, even! Is this because Pommel Horse Guy is back on his Superman game? Amazingly, no. Instead, coverage centered on University of Michigan junior Frederick Richard—whom some in the gymnastics media (ahem) have called the future of the sport—and his one-man protest against its antiquated apparel standards. Allow me to explain. Or, rather, allow Mr. Richard to explain. In the lead-up to the competition, Richard, who is known for his savvy social media presence and community outreach, dropped several teasers on his numerous feeds in which he explained that the regulation men’s uniform required by the International Gymnastics Federation is deeply unpleasant for him to wear, and as such, he doesn’t want to wear it anymore. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); View this post on Instagram A post shared by Frederick“Flips” Richard (@frederickflips) The Olympic and World medalist has used a lot of descriptive, if elusive, language—restricted; uncomfortable; goofy—to describe the status quo, which, unlike its women’s counterpart, has remained largely unchanged since the sport was competed in the out-of-doors on straight-up sod. “Pommel horse pants,” Richard explained, are basically footed tights, and the singlet, or the unitard the men wear under said pants on most events (or their teeny-tiny shorts on floor exercise and vault), goes “up your crotch and everything.” And so, Richard explained, though he would incur a deduction in his scores for it—one deduction of 0.3 for each day of Winter Cup competition—he was going to debut a new look. But what would it be? Don’t worry: People had opinions before they even laid eyes upon said togs. In one post, Richard made a brief comment about how, when he was a young man, his peers would deride gymnastics as a “girls’ sport” (a common misconception to this day!), which set off murmurs of either internalized or original-recipe homophobia. There’s a lot to unpack here: Why are “tights” inherently sexualized when they are supposed to be functional apparel, and why is male seminudity of this variety often immediately associated with queerness and thus “femininity,” and, cogito ergo sum, why is being associated with girls … bad? Should the men instead be encouraged to reclaim the current uniform as an empowered iteration of multifaceted nonsexual masculinity? Such was the nature of certain corners of the gymternet’s discussion over Richard’s protest. Advertisement Advertisement Advertisement Advertisement I don’t know Fred Richard’s heart, and I can’t read his mind, so I’m not going to put words into his unfailingly polite mouth about what, even more specifically, he (especially his “10-year-old self”) finds objectionable about the men’s uniform. But I do know one thing. I know what he and other male gymnasts (and everyone but me, an intellectual) are too classy to say on camera: The current regulation clothes leave absolutely nothing to the imagination. Though the sport itself has changed immensely since it was named by the Ancient Greeks to mean “exercising naked”—to showcase a perfect male physique in a society that had different conceptions of both masculinity and nudity—its required outfit still shows, well, everything. Richard’s euphemistic language about wanting to feel comfortable elides something I feel safe to assume that nobody in the sport wants to say out loud: Everyone who has ever watched men’s gymnastics has essentially been sent a nude against their will. The current singlet/tights combo showcases, front and center, the bulge and prominent outline of a gentleman’s junk. I’m not a pervert; I’m a journalist who reports what I see. And everyone who watches this sport sees it. Advertisement Advertisement While men in the elite and professional standing have, in public at least, come to terms with this level of exposure, think about how many pubescent boys enjoy putting their bodies on such display. Very few! And, indeed, most boys and young men practice in baggier shorts for exactly this reason. (By all means, let’s unpack standards of masculinity and nonsexual nudity to a current room of middle school boys and see how that goes! You go first.) I can also tell you that gymnastics’ level of body exposure has been felt, and often disliked, on the women’s side—and the women have enacted regulation changes. For example, members of the German national team have already incorporated full-length unitards into their kit, flipping around gorgeously in shoulder-to-ankle Swarovskis with nary a wedgie in sight. Advertisement So shouldn’t the men also have the choice not to parade their package in front of TV cameras when they’re just trying to mind their business and land a triple flip? Well, rather than insisting that men compete seminude for fun, the current apparel regulations do have a point: They nominally exist because looser garments have a small chance of catching on apparatuses, and they allegedly showcase what we in the gymnastics world call “the line,” aka the gymnast’s body positioning and form. (Not for nothing, by the way, but pommel horse pants famously hide small form breaks due to being skintight only in the pelvic region and are somehow baggy everywhere else.) Advertisement Advertisement Advertisement But I agree with Richard that the standard men’s uniform could indeed use a revamp for all sorts of reasons. (At press time, neither USA Gymnastics nor the International Gymnastics Federation, or FIG, has made official comments.) Beyond the embarrassment of teens (and possibly adults), it deserves a 21st-century update that blends function and comfort with a contemporary style that grown athletes like and that younger ones want to emulate. (See, for example, the popular replicas of the women’s Olympic leotards that delight little girls everywhere.) Related From Slate Alex Kirshner Hockey’s Thrilling Experiment Should Inspire Every Other Pro Sports League Read More To this end, Richard says, he hired a designer, asked teammates for pointers, and came up with a Michigan-branded prototype for himself that he finds comfortable and freeing. (He mentioned that feedback from fellow Winter Cup competitors was positive, and that college teams may be able to adopt a looser style sooner because the NCAA is not bound by FIG rules.) He also told NBC that he spoke to officials prior to the debut, who recommended he wear the new uniform, incur the deductions, then take feedback regarding safety and form. This, of course, brings us to the clothes. Finally! What did Richard’s controversial new take on gymnastics masculinity even look like? The answer is: kind of like the ’95 Chicago Bulls practicing outside on a cold day. Advertisement Advertisement View this post on Instagram A post shared by Gymnastics Now (@gymnastics__now) A basketball nod in the design was not a surprise—in his teaser videos, Richard has recalled Michael Jordan’s infamous $5,000 sneaker fines for inspiration—but the leggings he donned underneath his shorts have been polarizing. On Winter Cup’s second day of competition, the leggings were dark and, in this humble fashionista’s opinion, looked a lot better; I think the lighter ones probably would have looked great in Michigan Maize. But nobody asked me, a lady! Richard, the important one here, loved competing in the uniform and released numerous videos to that effect. But how did he do? Did he win? In the end, Richard ended up finishing second to Riley Loos, but not because of the six-tenths he lost in apparel deductions. He was runner-up because of the many tenths of a point he lost in major breaks and falls. He is a great gymnast, but gymnastics is hard and dangerous, and he’s been out of the gym to take part in Simone Biles’ “GOAT” tour and is only beginning to train seriously again. Recently in Sports It’s Abundantly Clear Why an Olympic Gymnast Wants Men’s Uniforms to Change Hockey’s Thrilling Experiment Should Inspire Every Other Pro Sports League Trump’s Trans Sports Ban Is Already Doing Tremendous Damage I Covered Serena Williams Closely When Drake Was Following Her Around. It’s Clear Why She Showed Up at the Super Bowl. As one does when one has a prominent social media presence, Richard hyped up his showcase at Winter Cup a lot, and so the second-place finish could be thought of as a disappointment. But I prefer to see it as the opening salvo of a discussion. Does Men’s Uniform 2.0™ (Now With 100 Percent Less Ding-Dong!) possibly need to go back to the lab, to look a little bit less like peak Jordan and a little bit more like peak Fred Richard doing his own thing? I’m not an apparel designer nor a male gymnast, but the point of a prototype is to tinker, and I’m sure he will find the right balance between comfort, modesty, safety, and the all-important “lines” of his form. For now, while taking in feedback, Richard has said he will continue to compete in regulation apparel anytime he is representing a team. Advertisement Advertisement Advertisement Advertisement Regardless of how this particular prototype looks, and wherever one alights in the discourse, here’s the important part: This is a grown man who now possesses enough influence and gravitas in his sport that, not unlike the GOAT herself, he can rebel against the norms and actually be heard. (Biles closed the infamous Karolyi ranch with a single tweet.) And this man no longer wishes to compete in a serious, dangerous sport (at a crucial crossroads in popularity) feeling uncomfortable, either physically or mentally. Richard and other male gymnasts may be too polite to say it, but I’m not. Gymnastics no longer means “to exercise naked,” and gymnasts deserve to compete without their private parts on blast. Get the best of culture Get the best of movies, TV, books, music, and more. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Culture newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Olympics Gymnastics College Sports Advertisement'''
