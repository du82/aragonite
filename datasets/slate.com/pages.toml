title = "Stepchildren advice: My wife insisted I had no say in raising her daughter. Now she’s come at me with a truly wild demand."
description = "She can’t be serious."
full_description = '''Dear Prudence Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. She can’t be serious. Advice by Delia Cai March 01, 20258:00 AM Photo illustration by Slate. Photo by syntika/Getty Images Plus and EyeEm Mobile GmbH/Getty Images Plus. Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My wife has a 24-year-old daughter from a previous relationship, and we have a 10-year-old adopted son. When we got married, my wife made it clear that she and her ex were parenting her daughter and I was to have a hands-off stance. My stepdaughter was a good kid and we mostly got along, but there were several parenting choices that I really didn’t agree with. She had little in the way of funds for higher education, was a bright student but not full college ride material, and skipped most of the opportunities her school offered her (dual credit, community college courses, and AP tests). My wife and her ex ignored all of this, and I was told to butt out when I brought it up. The end result was my stepdaughter took out a ton of college loans and hasn’t managed to find a full-time job she likes since she graduated. She has lived with family or friends and is very frustrated. Recently, I finally got into a management position and have access to some very good bonuses. We’ve been able to upgrade the house, buy new cars, and put more money away for our son. Then my wife came at me with something I could not believe. She wanted me to pay off her daughter’s loans. This was not a discussion, it was a demand. When I balked, she went straight to the emotional manipulation about how I favor our son and don’t treat my stepdaughter the same. I told her of course I don’t—she made it that way from day one, I don’t get an opinion. I pointed out all the wasted potential in the past and the fact that my stepdaughter job-hops the minute she gets dissatisfied. My wife claimed that wasn’t fair. I said she can’t have it both ways, especially after this long! (We’ve been married eight years and together 12.) This is a huge wedge between us now. I offered the compromise that my stepdaughter move home, get whatever job she can find, and pay us market rent. We would save the money and I would match it if possible and we would then give it to her. My wife refused and called the compromise “controlling.” At this point, I am ready to throw in the towel and tell my wife to go get a second job if she wants to pay for these loans. This is souring what should be a special occasion—we never got a honeymoon, so I wanted to take all four of us to Hawaii (my wife, me, my stepdaughter, and our son) this summer. Now I am waiting for the argument that of we go, the money was wasted and if we don’t, I am being petty and controlling. I am just at the end of my rope here. —Not the Bonus Dad, Just Step Dear Bonus Dad, What strikes me about your conundrum is that it doesn’t really have to do with the step-daughter at all. That’s more so the “surface-level” conflict here: You don’t approve of the step-daughter’s choices (or the choices your wife and her ex made to parent her), but it’s been made clear that it isn’t your business to judge, anyway. The deeper conflict is the one between you and your wife, and it concerns the question of how to spend your income, and primarily, who gets to decide—an age-old marital stressor. It sounds like you’re the primary breadwinner and have been for a while, so I would be curious how you’ve worked through versions of this conflict before. For example, when it came to the new house or the vacation destination, how did you make those decisions with your wife? Do you both refer to your income as “my paycheck” or is it “our household income?” If there’s an existing precedent in your household where the breadwinner is the one who makes all of the big financial decisions, it’s logical to put your foot down. But it’s possible that such a precedent would breed a certain degree of resentment, which may be why your wife is reacting to this particular issue in this way. If she’s calling you “controlling” for withholding money for something she cares about—and this is how you’ve been conducting the finances of marriage historically—it’s not completely off base for her to be angry. I think you should do some thinking on your own about the expectations you may consciously and subconsciously have about your status as the family breadwinner, and then have a conversation with your wife about hers. If you’re not able to reconcile those expectations, it may be time to seriously consider the remaining feasibility of a marriage where you cannot come to an agreement about money. Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, How do you gently let someone know you’re not interested in them? For that matter, how do you pluck up the courage to say anything at all? I’m a 21-year-old woman and was recently asked out on a date by a guy at my church—which came as quite a shock to me, as I had no idea the guy was interested in me like that at all, though we had talked a few times. I said yes, and we had the date today, going out for lunch. It was nice, and he’s a genuinely interesting person. But I don’t think I’m interested in pursuing a relationship. We have a five year or so age gap (I graduated school the year he started his PhD) and we’re just not at the same life stage. I also just don’t feel I know him that well! He’s very much interested in me, and I know I don’t share that same level of admiration for him. I’m also a very inexperienced dater—that date was, I would say, probably my first ever official date. I have no idea what I’m meant to be feeling, and I’ve been questioning lately whether I might be somewhere on the aromantic/asexual spectrum. Overall the whole situation is just stressing me out. I’m autistic and terrified of doing something wrong or hurting his feelings, though of course I know that’s inevitable. To make matters worse, I know I’ll have to see him at church from time to time too! The door is currently still open for another date, and he’s enthusiastic about the idea, but I don’t want to go on another date and lead him on, as that seems cruel. I’m already really busy in my last year as an undergrad student, and this is an extra layer of stress. Am I overthinking this? —Dating Rookie Dear Dating Rookie, For what it’s worth, even very experienced daters have trouble with letting someone down, especially if it’s someone who’s a genuinely nice person. But all you have to do is tell this guy—via text is fine!—something along these lines: “It was nice getting to know you over lunch. I enjoyed our date, but I think we’re better as friends. See you at church?” You don’t have to explain why (and if he presses for a reason, you can just say something like, “We’re looking for different things.”) Keep it breezy and short, and then make a point to wave or say hi at church the next time you see each other, so that you’ve established a precedent for how neither of you needs to feel awkward about the lunch date. Rejection is not inherently cruel unless you make it so; just be honest and polite and thank your date for a nice way to spend a lunch. Get Even More Advice From the Dear Prudence Podcast <div class="slate-megaphone__slot"></div> View Transcript Dear Prudence, During the pandemic, I established a good relationship with the neighbors to the back of me. They offered to let me use their pool, and I let them park the RV their in-laws were driving because I have a long, curved driveway that is mostly hidden. (Our HOA doesn’t allow RVs on the street or to be visible.) This has worked out well until recently. The in-laws lost their home due to a natural disaster and have been parked in my driveway for over two months. At first, it was only going to be a few weeks until they sorted things out with the insurance. Now they were making themselves at home and make vague excuses about when they were going to get going. I essentially have lost my entire backyard and personal privacy here. The grandkids are constantly coming and going. I caught the grandfather trying to use my water and power (he stopped the first after I reminded him I have cameras). Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I hit my limit when my cameras caught the couple letting themselves into my garage because I forgot to lock the side door. They claimed they just needed to do laundry and forgot to ask me. I was furious, and the argument with my neighbors ended with me saying the RV had to be gone by Sunday or I was calling the cops and our HOA. The RV left, but my relationship with my neighbors is nil. I’m wondering now if it is worth trying to repair or just let it go. I never thought it would get this far. —Good Fences Dear Good Fences, Give it some time. I’m sure it wasn’t an easy time for your neighbors to put up their in-laws for so long; it’s safe to say that everyone’s nerves are probably frazzled, leaving no one in much of a reconciliatory mood. Obviously, things got out of control, those in-laws were not behaving at their best, and your goodwill was exhausted, but as your letter notes, these were slightly extraordinary circumstances for those in-laws. Take a few months to cool off fully, and then see if you feel up for inviting your neighbors over for coffee to revisit the ordeal and smooth your relations over. —Delia Catch up on this week’s Prudie. More Advice From Slate My sister is a young, successful woman who is dating in a major city. She is specifically dating for relationships—while she enjoys hooking up with the guys she dates, she’s not looking for situationships but for something lasting. Her hook-up habits have caused friction with our mom, who will say things like “I didn’t think girls like you did that” (spend the night at a guy’s house after the second date) or “I didn’t raise you to be one of those fast girls.” The problem is, I don’t think my mom’s completely wrong. Tweet Share Share Comment Advice Dear Prudence Slate Plus'''
