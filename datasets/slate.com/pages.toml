title = "Teen advice: My daughter has become addicted to something called “smellmaxing.”"
description = "My in-laws actually told her she stank like a brothel."
full_description = '''Dear Prudence Help! My Teen Has Become Addicted to Something Called “Smellmaxing.” Oh God. My in-laws actually told her she stank like a brothel. Advice by Delia Cai Feb 13, 20256:09 AM Photo illustration by Slate. Photo by Prostock-Studio/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My teenage daughter has become addicted to “smellmaxing,” a fashionable trend of drenching oneself in vast quantities of cologne. I’ve been trying gently to communicate to her that it’s unpleasant to be around, but she’s very sensitive and I was treading carefully. That blew up in my face over Christmas when we went to stay with my husband’s family. My in-laws are delightfully direct, to the point of open rudeness, and did not hold back. Comments varied from, “Oh my God, did a skunk die in here” to “Peeeeeeeeughhh, girl, you stink like a Texas brothel” and they just kept coming. My daughter was incredibly distressed but my husband and his family have largely dismissed that, arguing that she needs to toughen up. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Meanwhile, my daughter has barely said a word to me since and is blaming me for “not telling her” that she reeked and letting her “make a fool of herself.” How do I explain to my in-laws that bullying a teenager is completely unacceptable when they clearly feel no guilt? And how do I explain to my daughter that sometimes you need to rely on people that love you to share some hard truths, even if they don’t do it in the best possible way? —Stinkbomb Mom Dear Mom, There’re a few layers to this, and my impulse is to make a numbered list of things to address. First, you don’t need to “explain” to your in-laws that it’s unacceptable to bully a teenager. You simply need to state that their behavior was unacceptable, and (if you want to go nuclear) that you’re going to [insert consequence here, such as abstaining from family gatherings for a while] until someone offers your daughter an apology. Advertisement Advertisement Advertisement But your real priority is tending to your daughter. One day, you both will laugh very hard over this entire smellmaxing fiasco, but for now, you need to communicate three things to her: One, validate her feelings. Don’t tell her that she needs to toughen up: When she feels hurt about someone making fun of her, she is absolutely allowed to feel hurt. Two: Tell her that it was not OK for your in-laws to be so rude, and that they owe her an apology. Three: Home in on the opportunity this presents for your dynamic together. Explain that you support her experiments with self-expression, and that you think it’s generally better for your relationship to not cast judgment on her choices (olfactory or otherwise). Advertisement But offer to come up with a code word for future situations like this, where you want her to know that you’re not being judgy—you’re just trying to look out for her. Think of the code word as an agreement where you can voice your opinions without coming off too harshly, and where she can choose whether to disregard your advice or not. Reaffirm that you’re always going to be on her side, even if it involves some questionable smells. Dear Prudence, I have an old work friend who invites me to his house a few times a year, along with many other old friends and colleagues. Several years ago, he married a woman from another country and culture. My friend’s wife doesn’t work outside the home and has a very small social circle. Last time I visited, she took me aside, told me about her struggle with making friends, and asked me if I would regularly stop by to hang out with her. I was caught off guard and mumbled something like, “sure, if I have time.” Since then, I’ve turned down my friend’s invitations. I don’t know how to respond if his wife presses me about my supposed “promise.” I have nothing in common with her and we have never gone beyond small talk. I feel for her. I can see that she’s lonely, but I also feel put on the spot to fill the role of her companion. I haven’t told my friend about his wife’s request, and I don’t want to lose contact with him. How do I manage the pressure to become the wife’s friend and still maintain contact with my old colleague? —Too Old for Playdates Dear Playdates, Advertisement Advertisement Advertisement Advertisement There’s nothing worse than feeling pressured into friendship. I think that if you enjoy hanging out with your old work friend, you should keep that relationship up as you have in the past. You just need to have a canned response at the ready in case of another awkward encounter with his wife. Something like, “You seem really great, but if I’m being honest, my life is a little crazy, and I’m not at my most reliable.” Worst case scenario, you can ask your old work friend if it’s OK to meet for lunch or dinner—somewhere not at his home—though this will probably raise some eyebrows on his end. The reason I think you should opt for being kind and direct with the wife, rather than avoidant, is that there’s a chance she’s already discussed this encounter with your friend, which means that they might know why you’re being so evasive. Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, I am lucky enough that I have a fairly large close-friend group that has known each other since University. Somewhere along the line, I have become the secret keeper, as my friends realized that I gave solid advice but more importantly, I never shared anything they asked me not. I have made it clear to my friends that if they share anything about infidelity or something that concerns me about their wellbeing that I would share it and get help from within or outside of the group Advertisement Advertisement Well, recently two female friends confided in me that they are dating and have been for the past six months. They only just shared the news more widely, and now one friend is acting like I committed the biggest betrayal by not outing the relationship. As far as everyone knew (me included), they were straight. Somehow, she has managed to convince two others that I was wrong not to share this as we are such a close-knit group. Advertisement I know it is not my place to say anything, so am I living in the twilight zone that I didn’t share this? It is causing arguments and bad feeling in the group. I feel disgusted by their behavior and want to go nuclear and cut off anyone who wants to associate with them. Is this even worth another conversation to try and salvage the friendships? —Mind Your Business Dear Business, I think it’s worth giving the friends who are upset about your discretion some tough love: Tell them that you understand they’re upset about feeling “left out” of an important conversation and that they might be questioning the strength of their relationship with the two friends who are dating. But they’re taking that hurt and sense of betrayal out on you, and it’s both unfair and misplaced. In general, friends who feel like they somehow “deserve” to know each other’s’ secrets instead of working to earn that trust aren’t terribly worth hanging onto; give them some time to cool off, and take pride in being a worthy confidante. Advertisement Advertisement Advertisement Want more Prudie? Slate Plus members get an additional column each week. Sign up for Slate Plus now. Dear Prudence, I grew up in a tumultuous household with volatile parents. Both had substance abuse problems, and my mother suffered from severe depression. As a young girl (I’m now 41), I failed out of a prestigious college due to undiagnosed mental health issues, alcoholism, general immaturity, and irresponsibility. After my father died in 2020 and left me a little bit of money, I decided to return to school full time. I also had a daughter, Betty, during this period, who is now almost 3. I started out at a community college and then transferred to an Ivy with a program for non-traditional students. I will be graduating (I think with honors) and plan to walk with the class of 2025 spring. This is a big deal to me—I carried around a lot of shame about my academic failures for a long time, and I’m proud of this second act I’ve undertaken. Advertisement My question is about whether or not to invite my mother to the graduation ceremony. I hate to admit it, but we are semi-estranged at the moment. She has a pattern of not showing up to things. For example, my sister had a bachelorette party in Vegas when Betty was 7 months old, and I had to leave Betty for several days for the first time. I asked my mother to come to NYC to help Betty’s father, and she agreed (she does not have a steady job and generally enjoys traveling). However, as the day approached, she began postponing her trip, insisting for several days that she would be “on the next flight.” Ultimately, she did not show up at all, and I had to scramble to find a sitter to help Betty’s father while I was gone. Advertisement Advertisement She has repeated this behavior several times over the past couple of years, with the final straw being this last Christmas. She was supposed to come spend Christmas with Betty, my sister, and me, but did not show up. Several days after she was supposed to arrive, she asked if she could still come, and I said no. She then flipped the script on me and said she was “heartbroken.” I told her she’d had three days to show up, and if her heart was broken she’d done it to herself. She sent me a New Year’s text saying she loved Betty and me, and I didn’t respond. We haven’t spoken since. Initially, I thought her reluctance to come see me and/or Betty was maybe rooted in anxiety and depression. She has been to treatment for trauma twice over the last few years, mainly to deal with the significant abuse she suffered at the hands of my father and her own mother. However, she doesn’t seem to have a problem traveling otherwise— she frequently flies overseas and goes on cruises with her fiancé. I am hurt and confused by her apparent lack of interest in my life and her granddaughter. Advertisement Advertisement Advertisement Advertisement That said, part of me wants to mend the relationship so Betty can get to know her and have a connection to her roots. I feel like an invite to my upcoming graduation could be an olive branch. But I’m also afraid I’d be setting myself up for further disappointment. If she doesn’t come, I will still be supported by my sisters and friends. But I think the kid in me still wants her to be there.Please tell me what you think! —Old School Dear Old School, First, congratulations are in order. An impending graduation would be an impressive achievement in any context, but it sounds like you have moved heaven and earth to get yourself to this point. You deserve to celebrate, and I think you should honor the part of you—your inner child, let’s say—that wishes to do so with your mother, despite everything that’s happened. I’m of the opinion you should invite your mother to the ceremony. You’re certainly putting yourself at risk for disappointment, but I think that if you choose not to invite her, you’ll still end up spending a lot of time between now and the spring either worrying about whether you actually should or wondering what would have happened if you did. That’s not to say that inviting your mother, who has failed to show up for you multiple times, is necessarily going to equate with total peace of mind. You’ll have to put a lot of thought into how you extend the invitation—and how you communicate your expectations to her. Advertisement Advertisement One thing I think you should keep in mind is your mother’s reasons for her record of flakiness. She might be so wracked with guilt and shame over the past that she’s genuinely afraid of spending time with you, or disappointing you again. (Going on a vacation with her fiancé, in comparison, is a much easier task than offering to help with caregiving duties, for example.) It seems clear to everyone here that she isn’t able to show up for you in the way that you need, and this likely makes her feel ashamed and embarrassed. While you’re waiting for her to make proactive amends, she’s probably told herself a version of these events where she thinks you’re better off without her, or that she’ll never be able to make you happy. Even if she did show up, your mother likely believes (maybe correctly) that you’d be too angry with her about her previous behavior for it to be enjoyable for anyone. Advertisement I don’t know your mother, of course, but it sounds to me that she genuinely does want a connection with you—she just isn’t sure how to hold up her end of it. As a result, you will have to be crystal clear with what you want from her (and what you don’t). Tell her why it’s important for her to come to your graduation, what it would look like if she came (i.e. would you have lunch together one-on-one? Is her fiancé invited?) and give her a deadline for making a decision. In the same breath, I would try to lower the pressure a bit—think of it as offering a (temporary) truce: I’d say something like, “I know we’ve had our difficulties, but I do not plan on using this occasion to fight or argue or talk about the past. It would simply make me happy to see you at the ceremony and to share a meal. That’s all I’m asking for.” Advertisement Advertisement Advertisement Give her a deadline to decide (I wouldn’t call it that to her—just say: “I need to know your decision by May 1”) that leaves you some buffer time to feel the full spectrum of emotions if she’s not able to come through this time. There’s no way of predicting how she’ll respond, but I think that even if you end up disappointed, there will be a sense of satisfaction in knowing you’ve done everything you could to reconnect. It may be painful, but you didn’t get this far in life because you were afraid of doing things the hard way, did you? Get Even More Advice From the Dear Prudence Podcast <div class="slate-megaphone__slot"></div> View Transcript Dear Prudence, Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at'''
