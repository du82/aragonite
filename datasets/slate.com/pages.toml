title = "Family advice: My dad is a reckless driver—with a habit that could cost him his life."
description = "Nothing gets through to him."
full_description = '''Dear Prudence Help! My Dad Is a Reckless Driver—With a Habit That Could Cost Him His Life. Nothing gets through to him. Advice by Delia Cai Feb 11, 20256:00 AM Photo illustration by Slate. Photos by LINESOL/Getty Images Plus and bernardbodo/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, For my whole life, my dad has refused to wear a seatbelt. His excuse when I was a kid was, “We didn’t grow up with seatbelts and we turned out OK” and now he says, “It’ll be fine, I’m a safe driver” (he is not) or, “I just don’t like it.” His car has an automatic beep to alert you, but he’ll buckle it behind his back. I’ve shown him videos of crash test dummies becoming projectiles. Last year, my close friend died in a vehicle crash and I’ve become extremely anxious, especially when he texts me while driving. His partner doesn’t seem to mind, nor did my late mom. I live out of town. How do I get him to wear it? —Safe Driver Dear Driver, (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); People generally don’t change their minds, especially a lifelong habit, based on reason—so it’s time to make an emotional appeal. Tell your dad that his decision to not wear a seatbelt (or drive safely) is so important to you that it’s affecting your relationship with him. You can even say, “I know you don’t think it’s a big deal, but it is to me. I’m asking you to do this as a favor to me. When you wear a seatbelt, it makes me feel like you care about me and my worries.” You might share that your friend’s accident has heightened your anxiety—and him buckling up would be one small way he could help you get through this difficult time. Parents, especially adult ones, tend to respond well when given parent-like “tasks” where they feel like they’re the ones taking care of you. So hopefully, this will reframe the request as a matter of your relationship together, rather than as a matter of whether he’s being careful “enough.” And one last thing: if you know he’s behind the wheel when he’s texting you, don’t give him messages to respond to. He can give you a call when he reaches his destination. Advertisement Advertisement Advertisement Advertisement Dear Prudence, How do you get peace around family and politics? I live in Europe and I know Americans are familiar with this problem. I’m 37 and nonbinary. I am estranged from a lot of my family after abuse by my mother. I am in contact with my father (who is divorced) and my aunt, I love them both dearly and they have helped me a great deal in my life. They both vocally refuse to vote left even as a means to block the far right. When I try to understand/explain, I am told we should not discuss politics because it makes people angry. I try to remain calm, but they become defensive and shout at me. I try to ask questions, to explain my point of view, but there is a wall on the other side. I feel completely abandoned. I’m queer, I’m autistic, and my wife is a teacher and an immigrant. They think politics is this theoretical thing we shouldn’t care about too much. But it changes my life in big ways. Every time the subject comes up, I have a knot in my stomach for days. I have arguments with them in my head for hours and I can’t sleep. I am losing respect for the people I love, even though I know they are not directly to blame. How do I find peace? Do I let go of the possibility of peace ever existing again? —Alone Dear Alone, Advertisement Advertisement What you’re asking is the central question of how society functions: How do we get along with people who hold different, often threatening beliefs? Is it possible to coexist peacefully with those who we believe are in the wrong, or should we dedicate ourselves to “correcting” or “convincing” them to come over to our side? History tells us that rational appeals can only be so persuasive: People simply do not like being told that they are wrong, or that their belief systems are inferior. The key to understanding this—and those whom we don’t agree with—is being curious about what role these beliefs play in someone’s life. We often construct belief systems based on our deepest fears and our resulting desire for control and belonging. Everyone is scared of something, and the sum total of our coping mechanisms for life’s uncertainty crystallize into our politics. Advertisement That’s a lot of abstract talk, but what I want you to consider is whether you can find a way to be open-minded and curious about your father and aunt’s politics. You can find them reprehensible (and personally threatening), but until it’s clear what is driving their views (i.e. what their fears and motivations are), it will be impossible to simply argue them into submission. That said, it can be a heavy emotional burden to take on. But I want you to envision your family members clinging to their beliefs like a life raft. It’s a shoddy, unreliable one, but it’s the only one they’ve had—and they won’t even think about relaxing their grip on it until they feel safe enough to tread water (or to grab onto something sturdier). I’m saying all this not because I think you should feel sorry for your dad and your aunt, but because letting go of your own anger and cultivating even a tiny flame of sympathy will be critical to your own well-being here and to the health of your family relationships in the long run. Advertisement Advertisement Advertisement It will take a lot of time and patience (and self-care) to get to a place where you can sit down with your dad and your aunt and express said curiosity and open-mindedness about their views. In the meantime, I think it’s in all of your best interests to instill a “no politics” rule at family gatherings—and perhaps, to keep those gatherings centered around activities that don’t require much talking at all. Tend to the personal side of your relationships with your dad and aunt by finding small things that you have in common and “safe” topics of conversation. Acknowledge that it’s OK for now that you don’t all agree, and find a way to coexist without judging each others’ choices (I would guess that they’re as scared of you judging them as you are of their judgment). Build a foundation of care and consideration, where everyone feels safe, and then start gently opening the door on what’s going on under the surface. Again, this won’t be a short process, and you’ll inevitably find limits on what you can and can’t sympathize with. But until you regard your family members as potential allies—as misguided as they seem—instead of antagonists, it will be very hard to feel any kind of connection at all. Advertisement Advertisement Send Us Your Questions About the Workplace! The columnists behind our new advice column, Good Job, want to help you navigate your social dynamics at work. Does your colleague constantly bug you after hours? Has an ill-advised work romance gone awry? Ask us your question here! Dear Prudence, I’m 66 years old and I have nine siblings—five sisters and four brothers. My oldest sister’s husband has been acting inappropriately with me. He stuck his hand up my dress once in the presence of my sister. I told her but she dropped her head as if she didn’t hear. Most recently, as I was getting his car to go to the gym, he grabbed my behind as if he were my man. I have been seeing a counselor for over a year now and I filed a police report. The police have not acted at all. In the meantime, I am the one being ostracized by my family. I’m so lost. What should I do? —Can’t Pretend to Be Strong Anymore! Dear Strong, When a group decides that the pain of one individual member isn’t worth threatening the overall peace of mind of everyone else, they will do their best to minimize (or completely ignore) your needs. It’s cruel and cowardly—and it sounds like what your family is doing. Are all nine siblings united behind this charade, or is there maybe one or two siblings who seem ambivalent, and who might be worth having a conversation with? Advertisement Advertisement Advertisement If not, I think it’s in your best interest to distance yourself from these people. They have betrayed you by deciding that your violation doesn’t matter. In my opinion, it’s better to be on your own or with your chosen family than to count anyone like that as “family.” Advertisement Dear Prudence, My wife has probably the worst case of imposter syndrome that I have ever seen or experienced, mainly in relation to her job, but it permeates many other aspects of her life. Her job is the main problem. It gets to a point where she can’t do anything at all. She refuses to get any type of professional help, and when she comes to me for advice and insight, she dismisses nearly everything we talk about. She does take advice and help from friends and acts on it, even when it is the same/similar advice we talked about together. This has happened during our entire relationship. After 20 years, I’m at the point where I don’t know how to help her or handle how it affects me. I am in therapy, but unfortunately, the solution that seems to keep making itself apparent is to give her an ultimatum: either get professional help or I’m leaving. Is it too drastic too to think that divorce is now an option? I hate that it has come to that, but it’s having a major impact on every part of our lives. —Spinning in Circles Dear Spinning, Advertisement Advertisement I don’t think that’s drastic. At the most fundamental level, it sounds like this is the kind of relationship problem where one person has changed (i.e. you now find it hard to tolerate your wife’s imposter syndrome where once you were able to accept it) and the other person will need to choose whether they can change, too. Your wife will need to decide if she wants to try to work on her self-esteem and coping skills, or not. It’s not easy asking anyone to evolve, of course. But it also usually doesn’t happen without putting something big on the line. —Delia Classic Prudie I am getting married this fall, although my partner and I got legally married five years ago after he was diagnosed with cancer so that he could benefit from my health insurance. We went to City Hall, only told close friends and family, and explained that once things calmed down we’d have a formal ceremony and party. My partner is now three years in remission, and we’re very happily planning our “public” wedding. Everyone’s been happy for us except for my sister—she’s apoplectic. Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Dear Prudence Advertisement'''
