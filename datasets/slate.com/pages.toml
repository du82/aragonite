title = "Season 3 White Lotus: How one cast member got caught in the nepo-baby bear trap."
description = "Aww, Patrick Schwarzenegger thinks he got the White Lotus role because he took acting classes."
full_description = '''Fame Patrick Schwarzenegger Is the Latest Casualty in the Nepo-Baby Bear Trap Aww, he thinks he got the White Lotus role because he took acting classes. By David Mack Feb 26, 20252:27 PM Patrick Schwarzenegger attends the Bangkok premiere of the third season of The White Lotus on Feb. 14. Billy H.C. Kwok/Getty Images for HBO Tweet Share Share Comment Tweet Share Share Comment Sign up for the Slatest to get the most insightful analysis, criticism, and advice out there, delivered to your inbox daily. It’s probably not very hard to guess who Patrick Schwarzenegger’s dad is. The 31-year-old former fraternity member is the son of Arnold Schwarzenegger, the former California governor and Terminator star, and Maria Shriver, the news-anchor niece of President John F. Kennedy. He’s also an actor, currently starring in this latest season of HBO’s The White Lotus, in which he plays Saxon, the cocky and spoiled frat-boy son of a wealthy and powerful family led by a father said to be descended from a political dynasty and in whose steps the son is desperate to follow. Life imitates art, evidently. The young Schwarzenegger has been blessed with good looks, but not, it seems, with good PR skills. In an interview with the Sunday Times that was published last weekend, he seemed to bristle when the subject of his famous family came up (a topic that was so sensitive that his publicists had reportedly asked the reporter not to broach it). “I know there are people who’ll say I only got this role because of who my dad is,” he told the newspaper. “They’re not seeing that I’ve had 10 years of acting classes, put on [high] school plays every week, worked on my characters for hours on end or the hundreds of rejected auditions I’ve been on.” (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); And although he said he was grateful for his parents’ influence in his life, he admitted, “Of course, it’s frustrating and you can get boxed in and you think at that moment, I wish I didn’t have my last name.” Cue the immediate backlash to what immediately seemed like yet another “nepo baby” failing to read the room. The Daily Beast declared Schwarzenegger had “belly flopped” into nepotism discourse with his comments, which were dubbed “controversial” over at Yahoo. On social media, reactions were also withering. “Patrick Schwarzenegger didn’t get the role on White Lotus just because his dad is Arnold Schwarzenegger,” comedian Guy Branum tweeted. “He got it because his dad is Arnold Schwarzenegger AND because his mom is Maria Shriver.” Look, there’s no doubt from his work in The White Lotus and The Staircase (2022) that Schwarzenegger is talented. As Saxon, he’s been particularly effective at making viewers’ skin crawl as he plays toxic masculinity personified. And it may well be, as Patrick and Arnold told the Los Angeles Times in 2018, that the young actor was so determined to forge his own path that he turned down his dad’s offer to introduce him to agents and managers. But let’s also be real here: While the name Schwarzenegger may not have gotten him parts, it no doubt got him in the room where people were casting those parts, which is more than can be said for most aspiring actors. And sure, like many trying to hone their craft, Schwarzenegger took acting classes, but his were private lessons with the acting coach of Margot Robbie and Chris Pine. This isn’t just some “normal guy” we’re talking about here—this is a dude who used to date Miley Cyrus. Advertisement Advertisement Advertisement Advertisement Ever since New York Magazine published a story in 2022 that popularized the term “nepo baby” (after a viral tweet about Maude Apatow), star after star with famous parents has chafed at the label being thrust upon them. Zoë Kravitz said it was “completely normal for people to be in the family business,” while Ben Platt pointedly refused to answer any questions about it. Jamie Lee Curtis said she believed the conversation around nepo babies was “just designed to try to diminish and denigrate and hurt,” while Maya Hawke said she’d decided she was ultimately “comfortable with not deserving it and doing it anyway.” “Maybe you get your foot in the door, but you still just have your foot in the door. There’s a lot of work that comes after that,” Lily-Rose Depp said. “It’s weird to me to reduce somebody to the idea that they’re only there because it’s a generational thing. It just doesn’t make any sense.” Evidently, what these celebrities consistently seem unable to grasp—or, at least, what their publicists keep failing to train them on—is that the public is not out for blood here. We don’t like these stars’ work any less or view them as less talented because of who gave birth to them. We also understand that parents in the entertainment business are likely to produce kids who want to get into the family business. We just want them all to state the obvious: They’ve had advantages that other people did not. They’ve picked up skills and connections because, without even realizing it, they’ve come up in a world that others can only dream of entering. Schwarzenegger literally grew up visiting movie sets! Does he really believe that actors without famous parents aren’t also taking lessons, studying their characters, and hustling their asses off, too? Advertisement Advertisement Advertisement “All that people are looking for is an acknowledgment that it’s not a level playing field,” Girls and M3gan star (and daughter of news anchor Brian Williams) Allison Williams told Vulture in 2023 in a response that set the standard for nepo babies everywhere. “It’s just unfair. Period, end of the story, and no one’s really working that hard to make it fair. To not acknowledge that me getting started as an actress versus someone with zero connections isn’t the same—it’s ludicrous.” At the time, Williams’ response felt exceedingly obvious but also stunningly refreshing. She managed to display a keen sense of social privilege, inequality, and self-awareness while still showing pride in her career. “It doesn’t take anything away from the work that I’ve done,” Williams had said. “It just means that it’s not as fun to root for me.” Related From Slate Scaachi Koul Brad Pitt Has Shown Us Who He Is. Why Do We Refuse to See It? Read More Popular in Life Why Michelle Trachtenberg’s Death Has Prompted Such an Intense Reaction We Live in a Big City. When I Let My 12-Year-Old Go Out Without Me, We Learned an Unfortunate Lesson. Well, We Have Barron Trump’s First College Scandal How Trump’s Proposed NIH Cuts Expose One of the Worst-Kept Secrets in Academia Williams had also evidently blazed a trail for other nepo babies with good PR training to follow. Speaking to the Daily Beast the following year, Companion actor Jack Quaid (son of Dennis Quaid and Meg Ryan, who had initially defended her son during the nepo-baby discourse) said he was inclined to agree that he was, indeed, one. But that has also made him work to prove that he deserves to be there. “I knew the door was open for me in a lot of ways that it’s just not for a lot of actors, and I’ve just tried to work as hard as I possibly can to prove that I deserve to walk through that door,” he said. Look, if we and the tabloids are lucky, good-looking Hollywood couples are going to continue to have good-looking Hollywood kids and keep us all entertained and enthralled for years to come. But every now and then, even Hollywood needs to acknowledge reality. And as a few nepo babies have shown, doing so in the right way can actually be rather endearing. Hell, it’s a lot easier to spell out than “Schwarzenegger.” Get the best of news and politics Sign up for Slate’s evening newsletter. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the The Slatest newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Celebrities Internet Culture The White Lotus Advertisement'''
