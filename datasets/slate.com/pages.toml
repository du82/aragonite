["https://slate.com/life/2025/02/michelle-trachtenberg-death-cause-liver-buffy-gossip-girl.html"]
title = "Why Michelle Trachtenberg’s death has sparked such an explosive reaction online."
description = "She was never the most famous teen actress. The reaction to her death still makes perfect sense."
full_description = '''Fame Why Michelle Trachtenberg’s Death Has Prompted Such an Intense Reaction By Heather Schwedel Feb 27, 20251:41 PM Michelle Trachtenberg in 2005. Carlo Allegri/Getty Images Tweet Share Share Comment Tweet Share Share Comment Sign up for the Slatest to get the most insightful analysis, criticism, and advice out there, delivered to your inbox daily. When Elizabeth Taylor died, in 2011, Mindy Kaling memorialized her by writing, “The coolest thing about Elizabeth Taylor is that she lived life PRECISELY as I would’ve if I’d been born so f’ing gorgeous.” I thought of that quote when the actress Michelle Trachtenberg died on Wednesday at just 39, because, although her career was cut short before it could span seven decades—not to mention seven husbands—it did represent its own sort of ideal for millennial women like me. As a kid looking on, I couldn’t have imagined a cooler trajectory than going from Harriet the Spy to Buffy the Vampire Slayer to Gossip Girl—generational touchstones all. Trachtenberg was like Parker Posey hopscotching her way from one indie film director to another, only she was going from one young adult wish-fulfillment scenario to the next. Other important boxes on the ’90s girl checklist the young actress actualized included playing a figure skater in one movie and flirting with Zac Efron in another. In other words, she lived life PRECISELY as I would’ve if my 10-year-old self’s unchecked id were running the show. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Though Trachtenberg was never the most famous actress of her cohort—I was shocked to note, while writing this, her apparent absence from Vanity Fair’s famous 2003 “It’s Raining Teens” spread—she left a mark nonetheless. She did it mostly by playing heroines, not just in the sense that they were female main characters—because, notably, many of her most memorable parts weren’t the leads—but heroines in the sense of lovable, plucky girls and women you end up rooting for, some of whom walked straight out of the kids’ section of the library. Her first big acting gig was on Nickelodeon’s beloved Adventures of Pete & Pete, a show so surreal it’s hard to believe that it aired on a mainstream kids’ television network. She matched its oddball energy perfectly. She had big shoes to fill, stepping into the role of Harriet M. Welsch, the sixth grade spy in Louise Fitzhugh’s classic book, but despite having, at the time of shooting, a face so cute she looks as if Pixar designed her, Trachtenberg is so much more than an adorable moppet in the film adaptation; she played the part as someone who took her spycraft and herself seriously. Advertisement Advertisement Advertisement Advertisement One hopes Trachtenberg was able to summon similar inner fortitude when she arrived on the Buffy set, where she had her work cut out for her playing a character that frequently found herself in a very opinionated fandom’s crosshairs. (Some eventually came around. Trachtenberg also hinted over the years that it wasn’t just the fans but the creator of the show himself who conspired to make it a difficult environment for her.) But it was her villain turn, as Georgina on Gossip Girl, that many in my demographic consider to be Trachtenberg’s finest work. Though she was a guest star rather than a series regular, she won over fans by playing gloriously against type as a scheming baddie. She revived the role in HBO Max’s Gossip Girl reboot a few years ago, but it proved short-lived. Though of course not all her work is remembered so fondly, Trachtenberg’s hit rate was uncommon: It’s rare to be associated with one media property that’s considered a stone-cold classic; she was in three, at the very least. Given all this, I find it a little surprising how little I knew about Trachtenberg’s personal life. Though I remember admiring her red-carpet style over the years (and her aughts looks remain evocative time capsules of an era of chunky highlights and low-rise-jeans supremacy), I couldn’t, for instance, name anyone she had dated. Yet when I heard she had died, I had to text an old friend about it. I suspect that a lot of people my age felt similarly, having more or less grown up with Trachtenberg too. None of us ever met her, but that didn’t stop her from taking on the role of our collective mutual childhood friend. Advertisement Advertisement Popular in Life Why Michelle Trachtenberg’s Death Has Prompted Such an Intense Reaction We Live in a Big City. When I Let My 12-Year-Old Go Out Without Me, We Learned an Unfortunate Lesson. Well, We Have Barron Trump’s First College Scandal How Trump’s Proposed NIH Cuts Expose One of the Worst-Kept Secrets in Academia The Nickelodeon ecosystem she came out of was particularly good at fostering that sentiment, once upon a time. On Instagram, fellow Nickelodeon alum Kenan Thompson, settling into his role as millennial elder statesman, paid tribute to Trachtenberg by writing, “Our first Nick movie star has departed us!!” (I suppose it depends where you fall in the Nickelodeon generational divide whether you consider her the actual first, but still.) This is the kind of grim distinction I’m glad never occurred to me would one day exist back when I was watching the network, but it does help get at something about Trachtenberg’s fame and why she may have seemed particularly invincible. When I said earlier that she had precisely the career my childhood self dreamed of, the obvious caveat is that I never imagined it ending so sadly and so soon. Think how wonderful, and natural, it would have felt to see her pop up on an episode of Yellowjackets or to receive the news that she was cast in the next season of The White Lotus. Trachtenberg will no doubt continue to occupy my imagination, but I’ll miss her on screen. Get the best of news and politics Sign up for Slate’s evening newsletter. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the The Slatest newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Celebrities Movies Obits TV Death Advertisement'''
