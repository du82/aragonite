title = "Rumors at work: My male co-workers are spreading a risky rumor about myself and my closest work friend"
description = "She's my closest friend!"
full_description = '''Good Job All the Guys at Work Are Spreading an Unseemly Rumor About Myself and a Female Co-Worker She’s my closest friend! Advice by Laura Helmuth Feb 27, 20256:00 AM Photo illustration by Slate. Photos by PeopleImages/Getty Images Plus, Yuliia Kaveshnikova/iStock/Getty Images Plus, LightFieldStudios/Getty Images Plus, and Minerva Studio/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Good Job is Slate’s new advice column on work. Read about our new columnists and mission here. Have a workplace problem big or small? Send it to Laura Helmuth and Doree Shafrir here. It’s anonymous! Dear Good Job, I am a guy in his early 40s who has worked for the same small to medium-sized organization of about 100 employees for almost 20 years. I have stayed here so long because, generally speaking, the culture is great and almost feels more like a community or family than a workplace. About six years ago, Rose (now in her mid-30s) started working with us. Starting in early 2020, we were assigned to work on the same project and worked closely together during our time of remote work, which was a very isolating experience for both of us. Rose, her husband, my wife, and my kids all became very close during this time and we supported each other through many challenges. It is not an exaggeration to say that having Rose and her husband around kept everything together for me during a tough time. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Fast forward to today: Rose is my closest friend and most trusted colleague. The problem is that some of our co-workers have started talking about “our relationship” as being more than just friends. Some of my male colleagues have recently told me about many rumors involving our romantic or extramarital exploits with each other. Most of it is in the form of “good job dude” toxic masculinity garbage because Rose is a fairly attractive woman. As far as I know, Rose is unaware of these rumors and I know these rumors would upset her. Frankly, I find them childish and stupid but they do not impact my ability to do my job. I talked with my direct supervisor and he laughed it off. Basically, he said, “I know you and Rose are close but just friends. Those guys are just jealous because they want to be friends with Rose.” My wife also laughed this off as being stupid and ridiculous. Advertisement Advertisement Advertisement In my 20 years of professional work, this is a first for me. What do I do here? Do I tell Rose about the rumors? Do I tell these guys to cut it out? I could go to human resources, but that seems like a nuclear option that could easily backfire on both of us. Is this something I simply ignore because I know what the truth is and my supervisor has my back? —Relationship Status: Apparently Complicated? Dear Complicated, Advertisement You have an opportunity to squelch some of the sexist and juvenile attitudes in your workplace, and I’m so glad you’re looking for ways to do so. As a straight man with seniority and close working relationships, you have a lot of social capital that Rose and other women in the organization are unlikely to ever acquire. If a male colleague makes a hubba-hubba joke about Rose within your hearing, you can shut that down directly with a scornful comment: “Dude, what is wrong with you?” or “She’s a friend of mine, cut that out.” Or more lightly: “It’s great having women as friends. You should try it sometime!” To be generous, these guys might think that joking around about perceived office romances is funny and fine, since they’re not the only ones doing it and people do bond over gossip. In a less generous reading of this situation, they may be threatened by any work relationship that treats women as equal partners worthy of respect. Advertisement Encourage the male colleagues who talked to you about the rumors to do their part as well. If they’re hearing things, that means those dudes trust them and expect them to join in the fun of mocking or speculating about Rose (and to a lesser extent, you). Your trusted male colleagues can also shake their heads at the jokes, address them directly, and/or say that Rose is really good at her job and you’re all lucky to work with her. These conversations might feel awkward, but men have the power to set cultural expectations with other men that can make the workplace more humane for women. Advertisement Advertisement You’re right that human resources can’t do much and could make things worse. And I think you’re right to spare Rose the knowledge of the rumors—unless she brings it up. She has probably picked up on some of the speculation because anybody from a disempowered group tends to be fluent in implications and microaggressions. But if you or your male colleagues who came to you get any satisfying responses—“Sorry, you’re right, we were out of line”—you might bring it up with her just to assure her that it’s all sorted out. Advertisement Advertisement Send Your Questions to Good Job! Laura Helmuth and Doree Shafrir want to help you navigate your social dynamics at work. Does your colleague constantly bug you after hours? Has an ill-advised work romance gone awry? Ask us your question here! Dear Good Job, My boss recently invited me to be her guest at her squash club. But my boss is the extremely competitive sort. I played varsity squash in college and am not sure how well she will take it if I beat her in front of her friends. Should I throw some sets to allow her to save face? —Take a Dive? Dear Dive, Advertisement It’s a good rule of “managing up” (managing your manager) that you should never surprise your boss. Don’t hide problems or conflicts, and raise troubling questions with your boss early so they can help find answers. This kind of communication shows you’re trustworthy, attentive, and thinking ahead. And you should especially never surprise your boss in front of an audience. So talk to your boss before you visit their club. Casually jog their memory about your squash experience and say you’re looking forward to playing and meeting their friends at the club (to subtly remind your boss that there will be an audience). Find out if you’ll be playing with any other other club members, or just the two of you. Then ask explicitly if your boss and/or their friends would prefer an all-out contest or more of a friendly, let’s-match-our-skills sort of match. The boss might actually enjoy showing off your squash power in front of their friends. Advertisement Slate Plus members get more Good Job every week. Sign up now to read Laura Helmuth’s additional column this week. Dear Good Job, How do I stop hating my boss? I work at an accounting firm with a boss that I hate and don’t respect. They are disorganized, unprofessional, and unable to do their job well because they’re constantly overwhelmed. They’re one of those people who talked their way into higher-level management positions without ever doing the work. Therefore, they over-schedule meetings so they can perform work when we all know they don’t actually do their job. The climax of their incompetence happened when more than 50 percent of my team quit, and each person listed my boss as their number one reason. Advertisement Since they left, my boss has refused to take any accountability for how their mismanagement and problematic workplace behaviors negatively impacted my team and our work. I’m having a really hard time forgiving my boss and it’s manifested in us openly disagreeing with each other in meetings. It got to the point where I had a meeting with our CEO and they diplomatically said I needed to stop complaining because my boss was not going to change their ways or leave anytime soon. I felt embarrassed that I over-complained to the big boss. But I agree that my anger toward my boss is negatively affecting my work, relationships, and sleep. I can’t imagine how annoyed my family and friends are when I talk about my boss incessantly, and I do think I needed my boss’s boss to tell me to stop the hate. But how do I stop hating them? How do I choose to stop complaining, and fill my time with something more healthy for my energy? I know I could leave my job, but I actually like working here (with this one major exception). —Angry Max Dear Max, Advertisement Advertisement Advertisement It’s incredibly frustrating that so many organizations will let talented people walk out the door rather than fire or reassign the person who drove them away. This is a common problem. Good management is often undervalued and bad management is tolerated or ignored. Advertisement Congratulations on having an honest conversation with your boss’s boss about the problems you’re observing. A lot of people in your position don’t have the opportunity or courage to do so. It wasn’t a satisfying conversation, but at least you tried—and you learned some things, namely that the CEO isn’t going to fix the problem. It’s possible your boss is on some sort of performance improvement plan, or PIP, (which is often a precursor to being fired) or is being sent to a management training workshop and the CEO couldn’t discuss confidential personnel matters with you. But it ultimately sounds like the CEO told you to just stick a cork in it. It won’t be easy to control your hatred and contempt, but for your own blood pressure, career, and friendships, you’re right to try. Start by questioning some of your worst assumptions about your boss. It’s possible they talked their way into their position, as you say, but that’s pretty rare. They might have excelled in their previous role in ways you didn’t see, and that’s how they got promoted. You notice all the ways they’re failing today because failures are painful and visible, but they may be quietly accomplishing things in other parts of their job. You acknowledge that they’re overwhelmed, which is a good place to look for your compassion. Maybe your don’t-bother-me-with-pesky-problems CEO loaded your boss up with an impossible workload or hasn’t bothered to train them properly. Advertisement Advertisement Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Aside from adjusting your assumptions, there might be some practical solutions. Since half your team just left, you (and your boss) are probably taking on a lot of extra work. Even if the people who left have been replaced, it takes a while to train up newbies. Can you suggest ways to reduce the workload—are there any projects you could put off or decline? Are any meetings on your shared schedules just because they always have been, and could you ask to cancel them or reduce their frequency? Do you have to attend every one? Surely some of them could be emails instead. When so many people leave, it’s an opportunity to reprioritize. (“Reprioritize” is a corporate-speak way to say “stop doing needless, rut-stuck stuff.”) Also, think about how your persistent hatred is splashing onto your other colleagues. It must be stressful for them to witness you and your boss clash in meetings (and it might be triggering for some colleagues who grew up in hateful families). Try to shift some of your angry energy toward supporting your co-workers. Consider apologizing to them for losing your temper in meetings. Apologies can strengthen relationships, and that could open up a conversation about how your colleagues are coping. They’re probably also frazzled by the mass quitting and might have ideas for how to improve things at work. Advertisement Advertisement Advertisement Your firm probably has an employee assistance program, or EAP, that offers counseling. An anger-management class could help you prevent and control your frustration during meetings, and more intensive therapy might uncover whether there’s something aside from your boss that is fueling your hatred. —Laura Classic Prudie Ten years ago, my sister died and left her four children orphans. I had a preteen stepdaughter and a toddler in a small three-bedroom house. My husband and I did the best we could. But the choice was either separate the kids or look into foster care. We couldn’t do that. My stepdaughter ended up giving up her room to my nieces and moved back full-time with her mother. My husband came to every dance recital and every game even when I couldn’t. Recently, my stepdaughter and her girlfriend came over. We thought they were going to announce their engagement. Instead, my husband and I were subjected to a pretty polished essay about how awful we were to my stepdaughter growing up. Get the best of news and politics Sign up for Slate’s evening newsletter. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the The Slatest newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Workplace Jobs Advertisement'''
