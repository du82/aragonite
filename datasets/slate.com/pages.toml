title = "Marriage advice: I thought my wife had made peace with our decision not to have a baby. Well, turns out she lied."
description = "I feel like I'm living with a stranger."
full_description = '''Dear Prudence Help! I Thought My Wife Had Made Peace With Our Decision Not to Have a Baby. Well, Turns Out She Lied. I feel like I’m living with a stranger. Advice by Delia Cai Feb 25, 20256:00 AM Photo illustration by Slate. Photos by maroke/Getty Images Plus and wowwa/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My wife and I both had kids rather young so when we met, they were well into middle school. I got the snip right after my daughter was born and was upfront about not wanting more children. My wife was OK with this until around our second year of marriage. Then she became obsessed with having a baby that was “ours.” It nearly broke our marriage. I thought we had hit the lottery because our kids all got along and we had a successful blended family. I basically told my wife she had to choose what kind of life she wanted: what we had versus what she dreamed up. We went to therapy and we worked through it—or so I thought. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); We recently went through a crisis where one of our kids had an unplanned pregnancy and they chose to end it. We are lucky to live in a blue state but the situation was fraught. My wife’s reaction blindsided me. She was so angry and felt she had been “cheated again” because we would’ve raised the baby if they kept it. Luckily, she didn’t say this around our kids, but her reaction makes me think our marriage is not salvageable. She told me she regrets not pushing for another child and that I forced her to give up her dream. She didn’t want to be a single mom again. She later apologized but is the damage done? We are both pushing 50 and I thought we were happy. Is counseling even possible at this point? I feel like I am living with a stranger ever since she confessed. —No Baby Dear No Baby, Advertisement Advertisement Advertisement Sure, your wife may have been dishonest with you about her enduring desire to have kids—despite working through this years ago—but it’s also possible that the ordeal with the abortion triggered her former desires in a way that surprised everyone, including herself. Just because she’s made peace with your shared decision to not have a baby doesn’t mean that she can’t still mourn a version of a life that she once wanted. Advertisement I don’t think there’s an easy way to tell at this point which scenario applies here. I think it would be a good idea to revisit counseling, since that seemed helpful in giving you both some additional support when you were making the decision to not have a child the first time around. Your wife might simply need a space where her feelings of regret and grief feel validated, and you both might find it helpful to “review,” so to speak, the original decision and how its impacted your lives. I’m not suggesting you both revisit the decision itself, but just because it was made years ago doesn’t mean you can’t still talk about how it’s affected both of you. In fact, it’s probably healthier to look back at something so big with the perspective you’ve gained since. Get advice from Prudie—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, My partner and I got engaged this year. We’ve been together for over 10 years and live together so a lot of the traditional wedding trappings, like a shower, are not things that we need or are interested in. We’re also trying to be sensible with the budget for ourselves and our friends, which is part of the reasons we aren’t having wedding parties. However, the lack of a formal wedding party means it’s no one’s job to do things like the bachelorette party. I’m blessed to have a big community of wonderful adult friends (also part of why I didn’t want to choose a select group). I’d love to take advantage of a chance to spend quality time with them and indulge in some fun. But it’s no one’s job to throw me a party, and I can’t afford to pay to whisk folks away for a long weekend. Asking people to plan one for me feels sort of sad and needy AND I’d be worried folks would feel obligated. What’s an older bride to do? —(Not So) Blushing Bride Dear Blushing Bride, Advertisement Advertisement Plan your bachelorette party yourself! Think of this as an occasion akin to a birthday: Your friends are obviously excited to celebrate you, but they need a bit of guidance on what your exact vision is. Planning the bachelorette yourself means that you can prioritize stuff you actually like doing and also keep a tight control over the budget (which I think will be a relief to anyone who’s been terrorized by a power-hungry maid-of-honor). Advertisement Advertisement Remember that there’s no rule that a bachelorette party has to be an out-of-town weekend. It can be as casual as you’d like—a dinner party or an outing to a concert are great options, for example. You can delegate some of the planning by, say, enlisting one friend to pick the perfect bar for cocktails, or asking another if she’d be able to pick out some fun “bride-to-be” accessories from the party store. And since you’re all adults here, I think it’s safe to err on the side of being exceedingly clear about the potential costs involved. Everyone will be relieved to know what the expectations are, and then they can focus on celebrating you. Advertisement Send Us Your Questions About the Workplace! The columnists behind our new advice column, Good Job, want to help you navigate your social dynamics at work. Does your colleague constantly bug you after hours? Has an ill-advised work romance gone awry? Ask us your question here! Dear Prudence, I own a condo in a 20-plus unit complex with a homeowners association fee of $400/month, which comes with two parking spots. I use this condo as a second home if I have work events in the city and I don’t want to drive home to my family in the suburbs. Three months after buying and renovating my place, I got a knock on my door from a member of the HOA board who asked if he could use my second parking spot because his family bought a new car and they didn’t want to park it on the street until their insurance kicks in. His family has three cars and he claimed that the previous tenants of my unit let him park in their extra spot for free. I only have one car, so I said fine with the verbal contract that I wouldn’t charge him for it. Advertisement Advertisement Advertisement It’s been eight months since he asked and he still parks his car in my extra spot. To be honest, I’m not that pressed about it because I’m only here three days per month and he’s never put me out by taking both spots at once. However, I shared this with my friends, and they all reacted strongly in disgust because they thought I was being taken advantage of. At this point, do I: let him keep parking there for free, text him and say I’d like to start charging him for the spot ($100-$200/month), or use the spot as leverage for when I need a favor since he’s on the HOA board (I.e. I once lost my keys and he found them for me)? —Too Nice, Two Spots Dear Two Spots, Nothing breeds resentment like the faint possibility that you’re being taken advantage of, so now that your friends have raised the issue, I personally suspect it will be hard to let go of it. I would first ask your neighbor for an update on his use of the parking spot and whether he continues to need it, since he originally said it was just until “the insurance kicks in.” If he wants to continue using it, I’d recommend figuring out a monthly sum that feels fair to both of you. At the end of the day, offering a favor to a neighbor in exchange for some specific future leverage doesn’t really make it a favor anymore. If you expect an equal exchange of some kind for the spot, do yourself and your neighbor a favor and spell it out in a dollar amount. Advertisement Advertisement Advertisement Dear Prudence, Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. My wife and I recently bought a house, and I would like to have a housewarming party and invite my co-workers. The problem is there is one co-worker that I don’t like and would not want to invite. But I feel conflicted inviting other co-workers knowing that word might get around to the one who did not get invited. Surely, they would ask why they did not get invited. I don’t want to invite them because they came up with a nickname for my name that I told them to stop calling me, and they sometimes call me that nickname out the blue. So should I just not invite any of my co-workers to my housewarming, or invite who I want? If the uninvited co-worker finds out and ask why they did not receive an invitation should I tell them the truth, or come up with an excuse? —Conflicted Homeowner Dear Conflicted, Advertisement I think you should invite all of your co-workers to your housewarming, including the one who can’t seem to remember your real name. Use this as an opportunity to address the issue—or at least to figure out where this nickname habit stems from. Are they being disrespectful or simply forgetful? Advertisement Advertisement If they come to the housewarming and slip up with your name again, take them aside and express your frustration directly. You can say something like, “I’d really like you to call me ‘Andrew,’ not ‘Andy.’” Observe their reaction. If they’re truly flustered and apologetic, it’s likely that they’re just forgetful (or that they have an “Andy” in their own lives whose name is simply always on the tip of their tongues). If they’re defensive or weird about it, you can safely leave this co-worker uninvited to all future social events. —Delia More Advice From Slate My 10-year-old daughter is a horse girl. She’s outgrown her first pony, so we just bought her a new horse. This horse was priced right, he’s the perfect size, age, and temperament, and he’s trained in what she wants to do—we seriously could not have found her a better horse. Except for one thing. Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Dear Prudence Advertisement'''
