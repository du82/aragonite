description = "I'm a woman. He's a man. A gay one."
full_description = "How to Do It I’m About to Enter a Fantastically Rare Sexual Situation. I Need Some Pointers, Stat. There’s no blueprint for the type of sex I’m about to have. Advice by Rich Juzwiak March 01, 202512:00 PM Photo illustration by Slate. Photo by Sam Bassett/Getty Images Plus. Tweet Share Share Comment Slate Plus members get more How to Do It each week. How to Do It is Slate’s sex advice column. Have a question? Send it to Stoya and Rich here. It’s anonymous! Dear How to Do It, I’m a 50-year-old woman who’s very sexually experienced and confident. But, I’m about to enter a whole new playing field in terms of who I’m hooking up with. I’ll give you a hint: He’s gay. Or, at least he’s presented that way. He’s a lovely 40-year-old man who’s only been in gay relationships his whole life. He’s now come to terms with his bisexuality and is eager to explore. But he’s also nervous and self-conscious about his inexperience. What can I do to make this a better experience for him? —Late Bloomer Bi Dear Late Bloomer Bi, Your sexual experience and confidence will allow you to be a resource here, but tap into your expertise when it’s called upon. Move at your new guy’s pace and avoid overwhelming him with suggestions or information. Try to stay focused on his eagerness and what it means for your connection. What does he want to try? (I’m assuming here by the tone of your letter that you’re game for whatever, but of course, if you aren’t, it’s necessary to draw boundaries. Definitely affirm what you do want to explore with him.) I would also talk about power dynamics. The scenario could very well lead to you being the more dominant party in your coupling, even if you’re not necessarily kinky—you just have way more experience than he does. Is he cool with that? Does it make a natural sort of sense or should there be adjustments to your actual sex that match better with your respective sensibilities? Sorting this out ahead of time would probably be best, but don’t push it—this can also be cultivated in the moment. As with any partner, a conversation about what you’re into ahead of time will likely be useful. You may have to take a more hands-on role in guiding him here, given his inexperience, and positive reinforcement (when he achieves the goal of pleasuring you, for example) will also be an asset. Let him know when he’s doing well for the sake of encouraging him to continue. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. In general, you should take a light approach. Make yourself available, but don’t force conversations that he’s not comfortable with. A lot of men aren’t great at expressing themselves emotionally, thanks in no small part to the way people assigned male at birth tend to be socialized in our culture. He may shut down if the talk gets too heavy. This may be a tough balance to strike—to speak openly and frankly about what needs to be said, but not going so hard that nothing ends up said at all. That you are interested in doing this right (and asking the question in the first place) bodes well. Oh, and be extra sensitive about erectile issues. He hasn’t been in a relationship with a woman before, so there may be jitters, and nerves can affect performance. If he has any wood issues, take them in stride, and in the moment suggest something else that doesn’t involve his hard penis (like him performing oral on you or just cuddling/relaxing together). Understanding and a chill approach can do wonders for mitigating anxiety that exacerbates and results from temporary erectile dysfunction. Finally, for some well-articulated perspective from another bi guy who only had sex with men until his mid-40s, check out this essay Slate published last year, “Bye, Curious.” —Rich More Advice From Slate I used to date someone with two penises. It was, in short, the best sex I’ve ever had. But, since we parted ways, sex just isn’t satisfying anymore. I can count the number of times I’ve orgasmed on one hand. Nothing does it for me anymore. I’m stuck fantasizing about him, but he’s long gone. What should I do? Tweet Share Share Comment Advice Sex Slate Plus"
