title = "Marriage advice: I'm terrified that I'm squandering my good looks on my average, middle class fiancé."
description = "Am I missing out on true happiness?"
full_description = '''Dear Prudence Help! I’m Terrified That I’m Squandering My Good Looks on My Average, Middle Class Fiancé. My whole life people have told me that I can get any man I want. Advice by Emily Yoffe Feb 24, 20258:31 AM Photo illustration by Slate. Images via Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Our advice columnists have heard it all over the years—so we’re diving into the Dear Prudence archives to share classic letters with our readers. Submit your own questions to Prudie here. Dear Prudence, I’m recently engaged to the most honest, thoughtful, and loving man I’ve ever met. He has supported me through many hard times, including losing my job and being assaulted. Here’s the but about him: He makes no money. He has ambitions, and he’s smart, but will likely only bring a middle-class income at best. I have an OK job and I’m self-sufficient. Now here’s the but about me: I’m really, really pretty. My whole life people have told me I could get any man I want, meaning a rich man, and they are now shocked that I’m engaged to my fiancé, nice though he is. I’ve never dated a rich man, but it does make me curious. So part of me thinks I’m squandering my good looks on this poor man, and the other part of me thinks that I’m so shallow that I don’t even deserve him or anyone else. Am I a fool for thinking that a poor man can make me happy, or an idiot for believing a sexist fantasy? —Sincerely Shallow Dear Sincerely, (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); It’s a delicate thing to sing “I Feel Pretty” and keep the audience charmed. Many people will be repelled by your acknowledged superficiality and wish that a string of rich men use you, then dump you when you start to lose your looks. But surely your fiancé delights in the fact—and surely his friends have noted—that he’s nabbed one the prettiest girls in the room. When considering possible life partners, people should bluntly assess each other’s intangible and tangible qualities. Of course character is central, but if the person you’re dating is a wholly admirable person who doesn’t attract you physically, that’s a serious problem. So, too, is being with someone who gives you pleasure in and out of bed, but who’s hiding from creditors. You have asked an unattractive question about monetizing your beauty. But I think there’s a more accurate way to look at what’s troubling you. Advertisement Advertisement Advertisement Related From Slate Emily Yoffe and Margo Howard Help! I Figured Out the Shocking Reason My Husband is Mourning His Co-worker’s Death. Read More You’re really wondering whether you can be happy in the long run with a guy who treats you great, but who’ll never satisfy you financially. “Middle class” is a very elastic term, but I assume you mean that while you and your fiancé will be able to meet your basic needs, you’ll mostly be living paycheck to paycheck. You say he’s smart and ambitious, and I’m assuming you both are young, so you haven’t made it clear why these two qualities can’t propel him further professionally. Maybe he’s prone to pipe dreams the marketplace rewards with minimum wage. It’s fair to want a fully contributing partner in life, but if you think the bulk of a couple’s earning should come from the man, you either need to re-examine your assumptions, or clue in your fiancé. You and he need to discuss what kind of life you’d both like to lead and how each of you can map out career choices that will make this possible. Of course there are no guarantees of financial success, just as there are no guarantees that good looks will lure a guy with a bulging wallet (or that he’ll stick with you into middle-age). But if you’re filled with dread over the certainty that marrying your boyfriend will consign you to forever dreading when the bills come, this will tarnish your perception of his sterling qualities. You’re not a shallow fool for thinking that a life of scraping by won’t be so pretty. —Emily Yoffe From: Sexy and I Know It. (May 30th, 2013). Advertisement Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, My wonderful husband has this obsession with my boobs. After breast-feeding a few kids, they are not so discreet and tiny anymore, and frankly I’m not very happy with the new bulkier look. I used to be a small B, now I’m a solid C. My husband likes them like this, but I feel suffocated by his attention to them. Anything that is not a turtleneck gets the once-over and basically a passive-aggressive comment like, “You feel OK wearing that top?” At which point I generally say I do, sometimes asking him if he thinks it’s too flashy and he reassures me that it’s OK as long as I feel OK. At this point I go change because I don’t want him thinking I’m trying to flash his mom at the family lunch or something. What can I do to get him off my back—err, chest? I’m modest, but I’m getting fed up with feeling like I never manage to dress appropriately. —Fashion Problems Dear Fashion Problems, Advertisement So he’s thrilled with your expansion, but is also strangely unsupportive of it. If I’m understanding you right, it sounds as if he wants to keep your cup size a family secret (or two family secrets). A healthy interest in and pleasure in each other’s bodies is good for a marriage. An obsession over one body part isn’t. From now on, instead of slinking away and changing, stand firm. Explain you’re a grown woman and you don’t want to hear undermining commentary every time you wear an outfit that is two steps away from a burqa. I hope your change in attitude has him looking at you like a deer caught in the headlights. As for you, there are a lot of physical changes women undergo because of childbirth. But instead of bemoaning your enhanced state, accept that yours is a development many women would envy. —E.Y. From: Trophy Cups. (April 22, 2013) Advertisement Advertisement Advertisement Dear Prudence, Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I plan to be married soon. My fiancé and I don’t want a big to-do but would like to mark the occasion with a small ceremony and invite immediate family and a few close friends. This is a second marriage for both of us. My ex-husband and I remained civil to one another for the sake of our children. Once the hurt of our failed marriage had healed, we developed a friendship based on mutual interests and shared history. My fiancé and my ex get along well, and we occasionally socialize with him and his significant other. My ex is a judge and as such is able to perform weddings. My fiancé and I talked it over and would like to ask him to marry us. We haven’t asked him yet and aren’t sure he will agree, but we want to extend the invitation. The problem is that when I mentioned our plan to my sisters, they had a fit. They said it would be tacky and would make other family members uncomfortable to have my ex marry us. I know it’s an unusual situation, but it is also something we’d really like to do. Are our plans just too “out there”? — I Want My Ex to Officiate My Wedding Dear Ex to Officiate, Advertisement Advertisement Advertisement I’m all for formers getting along, especially when there are children involved. I’m also for intimate, low-key wedding ceremonies, especially when they are the second time around. But even if I disagree with your sisters throwing a fit, I agree with their point that it will take away from the sweetness of the moment if your loved ones are thinking that when your officiant gets to, “By the powers vested in me,” he might add, “it is with great relief that I say thank goodness she’s yours and not mine.” You do not want the moment that you two are being joined to be accompanied by mass eye-rolling and elbows to the ribs by those in attendance. It’s fine if your ex and his girlfriend attend the ceremony, but surely you and your fiancé can find a mutually agreeable person to preside over your wedding who does not also have carnal knowledge of either of you. —E.Y. From Ex-change of Vows. (March 11, 2013) More Advice From Slate Our son is getting married this fall. He and his fiancé are mad about each other, as you would hope for your child. Our future daughter-in-law is smart, cute and delightful—but only when she feels like it. For example, we threw a shower, and I wrapped in a keepsake box of mementos from my son’s childhood; art and trinkets that I have held over the years. It was, for me, a deeply sentimental gift. She opened it, and made a comment about making her hold on to all this stuff so I didn’t have to anymore. Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Dating and Relationships Marriage Advertisement'''
