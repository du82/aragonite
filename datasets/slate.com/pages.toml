["https://slate.com/advice/2025/02/work-advice-taking-credit-firing.html"]
title = "Work advice: I took credit for something I didn't do at work—and sabotaged my co-worker."
description = "I've created a mess."
full_description = "Good Job I Took Credit for Something I Didn’t Do at Work. It’s Coming Back to Haunt Me in the Worst Way. I’ve created a mess. Advice by Laura Helmuth Feb 27, 20256:00 AM Photo illustration by Slate. Photos by gradyreese/Getty Images Plus and Eder Paisan/Getty Images Plus. Tweet Share Share Comment Good Job is Slate’s new advice column on work. Read about our new columnists and mission here. Have a workplace problem big or small? Send it to Laura Helmuth and Doree Shafrir here. It’s anonymous! Dear Good Job, Recently, my superior praised me for a report I didn’t write. Instead of correcting her, I thanked her. Now she wants to get rid of the person who actually wrote the report (my assistant) on the grounds she isn’t pulling her weight at the company. What should I do? —Stepped in it Dear Stepped, This is a good reminder that it’s always better to share praise and credit (and not just because accepting too much credit can bite you on the ass). You have to fess up, but I think you can do it in a way that isn’t totally embarrassing. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Ask for a meeting with your superior, just the two of you, to discuss your assistant’s performance. You work most closely with Assistant, and it’s your responsibility as Assistant’s manager to share your observations, so this is a reasonable request. Acknowledge to your supervisor that you should have clarified earlier that Assistant wrote the report she praised. You presumably did have something to do with the report since you oversee Assistant’s work, so you could spell out who contributed what, and why the work surpassed expectations. (When you’re in a stressful work discussion, using corporate-speak like “surpassed expectations” shows that you’re taking the conversation seriously.) Bring in specific examples, beyond the report, of ways Assistant has contributed to your team’s work. If your supervisor gets suspicious and wonders if you’re having this meeting just to save Assistant’s job, it would be gracious to accept the blame for your supervisor’s limited impression of your assistant. Say that you took Assistant’s excellent work for granted and won’t do that in the future. —Laura Classic Prudie My husband and I were married seven years before he unexpectedly died. He was from overseas and told me he didn’t have much in the way of family since his parents died. He lied. Months after the funeral, I finally mustered up enough courage to go through his old boxes. In a box of books, I found photos, letters, and documents. Tweet Share Share Comment Advice Slate Plus Workplace Jobs"
