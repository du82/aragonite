full_description = 'Slate Books A roundup of recent books by Slate staff and contributors. Slate has relationships with various online retailers. If you buy something through our links, Slate may earn an affiliate commission. We update links when possible, but note that deals can expire and all prices are subject to change. All prices were up to date at the time of publication. Emily Bazelon is a co-host of the Slate Political Gabfest, New York Times Magazine staff writer, and former Slate senior editor. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/4ed48947-0b47-4c27-8474-22a8498b97dd.jpeg?crop&#x3D;800%2C800%2Cx193%2Cy0" alt="Sticks and Stones cover" width="800" height="800" /> Sticks and Stones: Defeating the Culture of Bullying and Rediscovering the Power of Character and Empathy By Emily Bazelon. Penguin Random House. $14 from Amazon Torie Bosch is the editor of Future Tense, a project of Slate, New America, and Arizona State that looks at the implications of new technologies. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/c219cd0d-fb49-4ed0-b959-3d8263f0ffbf.jpeg?crop&#x3D;1040%2C1040%2Cx260%2Cy0" alt="The cover of &quot;You Are Not Expected to Understand This.&quot;" width="1040" height="1040" /> “You Are Not Expected to Understand This”: How 26 Lines of Code Changed the World Edited by Torie Bosch. Princeton University Press. $17.99 from Amazon John Dickerson is co-host of the Slate Political Gabfest, host of the Whistlestop podcast, a contributing writer to the Atlantic, and a 60 Minutes correspondent. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/3292299b-0eb9-40d8-a8e7-b416a0abef8e.jpeg?crop&#x3D;800%2C800%2Cx195%2Cy0" alt="Whistlestop cover" width="800" height="800" /> Whistlestop: My Favorite Stories From Presidential Campaign History By John Dickerson. Twelve. $12.16 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/b1c9a275-f7c1-478e-8f16-4267c68cca16.jpeg?crop&#x3D;800%2C800%2Cx190%2Cy0" alt="On Her Trail cover" width="800" height="800" /> On Her Trail: My Mother, Nancy Dickerson, TV News’ First Woman Star By John Dickerson. Simon & Schuster. $10.83 from Amazon Charles Duhigg is host emeritus of How To! He is a Pulitzer Prize–winning journalist and writes for the New Yorker, the New York Times Magazine, and other publications. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/1359db92-d4fa-4b5b-9507-0d21e6ae0508.jpeg?crop&#x3D;800%2C800%2Cx203%2Cy0" alt="Smarter Faster Better cover" width="800" height="800" /> Smarter Faster Better: The Transformative Power of Real Productivity By Charles Duhigg. Random House. $13.50 from Amazon David Epstein is host emeritus of How To! He is a science writer who was previously an investigative reporter at ProPublica and senior writer at Sports Illustrated. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/9f529b0a-9e17-4cd4-b040-5352192c008f.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="The cover of Range." width="900" height="900" /> Range: Why Generalists Triumph in a Specialized World By David Epstein. Riverhead Books. $15.39 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/5c25243f-e913-477f-bee8-074ed04dc169.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="Cover of the Sports Gene." width="900" height="900" /> The Sports Gene: Inside the Science of Extraordinary Athletic Performance By David Epstein. Portfolio. $15.99 from Amazon Stefan Fatsis is co-host of Slate’s Hang Up and Listen. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/4d3e2440-9888-4abb-bd6d-eeb13749f456.jpeg?crop&#x3D;800%2C800%2Cx206%2Cy0" alt="A Few Seconds of Panic cover" width="800" height="800" /> A Few Seconds of Panic: A Sportswriter Plays in the NFL By Stefan Fatsis. Penguin. $16.47 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/99f62910-a0b2-4eb1-a0d0-50df877c5746.jpeg?crop&#x3D;800%2C800%2Cx204%2Cy0" alt="Word Freak cover" width="800" height="800" /> Word Freak: Heartbreak, Triumph, Genius, and Obsession in the World of Competitive Scrabble Players By Stefan Fatsis. Penguin. $12.99 from Amazon Every month, Future Tense publishes a new short story that imagines what tomorrow could look like. A partnership of Slate, New America, and Arizona State University, Future Tense explores how emerging technologies will change the way we live, in reality and fiction. Future Tense Fiction is a collection of original fiction commissioned by the partnership. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/c16566fb-3886-4902-a685-bee29741ac33.jpeg?crop&#x3D;800%2C800%2Cx192%2Cy0" alt="Future Tense Fiction cover" width="800" height="800" /> Future Tense Fiction: Stories of Tomorrow By various authors. The Unnamed Press. $24.49 from Amazon Henry Grabar is a staff writer for Slate’s Moneybox. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/a4a2d87e-3cf2-48bd-92d4-24042813f925.jpeg?crop&#x3D;799%2C799%2Cx198%2Cy1" alt="The Future of Transportation" width="799" height="799" /> ﻿The Future of Transportation: SOM Thinkers Series By Henry Grabar et al. Metropolis Books. $16.04 from Amazon Jack Hamilton is Slate’s pop critic and a professor at the University of Virginia. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/2ff33b91-7afb-45cc-8638-a1ae95262515.jpeg?crop&#x3D;800%2C800%2Cx191%2Cy0" alt="Just Around Midnight cover" width="800" height="800" /> Just Around Midnight: Rock and Roll and the Racial Imagination By Jack Hamilton. Harvard University Press. $20.47 from Amazon Michelle Herman is a Care and Feeding columnist. Her books include The Middle of Everything: Memoirs of Motherhood and an advice book for children, A Girl’s Guide to Life. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/8060abd9-3929-4458-b5dc-abbe354b7f95.jpeg?crop&#x3D;800%2C800%2Cx219%2Cy0" alt="The cover of Close-Up." width="800" height="800" /> Close-Up: A Novel By Michelle Herman. Scholarly Publishing Services. $24.95 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/d37395b1-e5e7-4b33-b92c-e0cc408203ba.jpeg?crop&#x3D;800%2C800%2Cx208%2Cy0" alt="The cover of A Girl&#x27;s Guide to Life." width="800" height="800" /> A Girl’s Guide to Life By Michelle Herman. Thought Catalog Books. $9.99 from Amazon Christopher Hitchens, who wrote the Fighting Words column until his death in 2011, is the author of many books, including the posthumously published Mortality. He also wrote Hitch-22: A Memoir; God Is Not Great: How Religion Poisons Everything; Thomas Jefferson: Author of America; Love, Poverty, and War: Journeys and Essays; Blood, Class, and Empire: The Enduring Anglo-American Relationship; A Long Short War: The Postponed Liberation of Iraq; and Why Orwell Matters. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/1c0d93c4-6b50-42b1-b074-36ad3a385b94.jpeg?crop&#x3D;800%2C800%2Cx192%2Cy0" alt="Hitch-22 cover" width="800" height="800" /> Hitch-22: A Memoir By Christopher Hitchens. Twelve. $10.79 from Amazon Fred Kaplan is Slate’s War Stories columnist and the author, most recently, of The Bomb and Dark Territory: The Secret History of Cyber War. He also wrote the Pulitzer Prize finalist and New York Times bestseller The Insurgents. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/ec849af5-839d-492d-bb8e-ede81e20ce32.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="The Bomb book cover." width="900" height="900" /> The Bomb: Presidents, Generals, and the Secret History of Nuclear War By Fred Kaplan. Simon & Schuster. $24.53 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/8a7aabe4-21a4-4dfc-8e63-13d21b3bfa74.jpeg?crop&#x3D;800%2C800%2Cx191%2Cy0" alt="The Insurgents cover" width="800" height="800" /> The Insurgents: David Petraeus and the Plot to Change the American Way of War By Fred Kaplan. Simon & Schuster. $12.21 from Amazon Dan Kois edits and writes for Slate’s human interest and culture departments and co-hosts the podcast Mom and Dad Are Fighting. He is a contributing writer at the New York Times Magazine and was the founding editor of New York magazine’s Vulture blog. He also wrote a book about the Hawaiian musician Israel Kamakawiwo’ole called Facing Future. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/f5448fa0-7b3f-428f-bd92-4ec257a24645.jpeg?crop&#x3D;800%2C800%2Cx208%2Cy0" alt="How to Be a Family cover" width="800" height="800" /> How to Be a Family: The Year I Dragged My Kids Around the World to Find a New Way to Be Together By Dan Kois. Little, Brown and Company. $16.29 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/0531e08f-cc4d-4c28-a33d-f21514471d2d.jpeg?crop&#x3D;800%2C800%2Cx196%2Cy0" alt="The World Only Spins Forward cover" width="800" height="800" /> The World Only Spins Forward: The Ascent of Angels in America By Isaac Butler and Dan Kois. Bloomsbury USA. $18.89 from Amazon Jason Johnson is the host of A Word. He is a political contributor at MSNBC, host at Sirius XM, politics writer at theGrio.com, and professor of politics and journalism at Morgan State University. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/d652afe5-21c2-4e59-be07-858dc8f8e468.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="Cover of Political Consultants and Campaigns." width="900" height="900" /> Political Consultants and Campaigns: One Day to Sell By Jason Johnson. Routledge. $50.95 from Amazon Danny M. Lavery is the host of the Big Mood, Little Mood podcast and previously wrote Slate’s Dear Prudence column. He is the author of Texts From Jane Eyre and The Merry Spinster. His third book, Something That May Shock and Discredit You, is out now. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/c27e5c1d-d6dd-496d-a730-ac0c3f01f992.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="The cover of Something That May Shock and Discredit You." width="900" height="900" /> Something That May Shock and Discredit You By Danny M. Lavery. Atria Books. $16.99 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/bfcd168e-a80a-4734-836c-9201e3a7c96d.jpeg?crop&#x3D;800%2C800%2Cx0%2Cy0" alt="Texts From Jane Eyre cover" width="800" height="800" /> Texts From Jane Eyre By Danny M. Lavery. Henry Holt. $16.41 from Amazon Josh Levin is Slate’s national editor and hosts the sports podcast Hang Up and Listen. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/c4ca9521-5352-4ce1-a706-ed01b7f01caf.jpeg?crop&#x3D;800%2C800%2Cx219%2Cy0" alt="The Queen cover" width="800" height="800" /> The Queen: The Forgotten Life Behind an American Myth By Josh Levin. Little, Brown and Company. $18.99 from Amazon Dahlia Lithwick writes about the courts and the law for Slate and hosts the podcast Amicus. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/af66a924-44b7-47ea-98a4-e38e8151a58b.jpeg?crop&#x3D;700%2C700%2Cx0%2Cy0" alt="The cover of Lady Justice." width="700" height="700" /> Lady Justice: Women, the Law, and the Battle to Save America By Dahlia Lithwick. Penguin Press. $24.49 from Amazon Laura Miller is a books and culture columnist for Slate and the author of The Magician’s Book: A Skeptic’s Adventures in Narnia. She also co-edited The Salon.com Reader’s Guide to Contemporary Authors with Adam Begley. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/1f3f6134-e28b-440a-a90a-52905f92bfba.jpeg?crop&#x3D;800%2C800%2Cx221%2Cy0" alt="The Magician&#x27;s Book cover" width="800" height="800" /> The Magician’s Book By Laura Miller. Back Bay Books. $13.49 from Amazon Rebecca Onion is a Slate staff writer. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/d44d50c8-77f1-4e50-becf-c42a61d84289.jpeg?crop&#x3D;800%2C800%2Cx198%2Cy0" alt="Innocent Experiments cover" width="800" height="800" /> Innocent Experiments: Childhood and the Culture of Popular Science in the United States By Rebecca Onion. University of North Carolina Press. $29.95 from Amazon Justin Peters is a Slate correspondent. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/2c26dc4b-50ae-419a-8953-a6328935556c.jpeg?crop&#x3D;800%2C800%2Cx207%2Cy0" alt="The Idealist cover" width="800" height="800" /> The Idealist: Aaron Swartz and the Rise of Free Culture on the Internet By Justin Peters. Scribner. $14.44 from Amazon David Plotz is the CEO of Atlas Obscura, host of the Political Gabfest, and former editor in chief of Slate. He is the author, most recently, of Good Book: The Bizarre, Hilarious, Disturbing, Marvelous, and Inspiring Things I Learned When I Read Every Single Word of the Bible, based on his “Blogging the Bible” series for Slate. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/a95bbdcf-e6f3-4ea9-95f6-72ddee9c8950.jpeg?crop&#x3D;800%2C800%2Cx185%2Cy0" alt="Cover of Good Book." width="800" height="800" /> Good Book: The Bizarre, Hilarious, Disturbing, Marvelous, and Inspiring Things I Learned When I Read Every Single Word of the Bible By David Plotz. Harper. $13.50 from Amazon Doyin Richards is a Care and Feeding columnist. He is a keynote speaker, a bestselling children’s author, founder of the Anti-Racism Fight Club, and a dad who focuses on making life easier for parents all over the world. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/1f69955b-ce7d-4a2c-9ae4-5725d6a81738.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="Cover of Watch Me." width="900" height="900" /> Watch Me By Doyin Richards. Feiwel & Friends. $13.39 from Amazon <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/16265f15-986d-4b21-a4eb-ab80f8dab4d3.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="Cover of What&#x27;s the Difference? " width="900" height="900" /> What’s the Difference? Being Different Is Amazing By Doyin Richards. Feiwel & Friends. $17.62 from Amazon Amanda Ripley is the host of How To! She is an investigative journalist and a New York Times bestselling author. Her previous books include The Unthinkable and The Smartest Kids in the World. She also writes for the Atlantic, Politico, the Washington Post, and other outlets. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/640d5438-f6be-4c10-8148-478ed13b1a83.jpeg?crop&#x3D;900%2C900%2Cx0%2Cy0" alt="The cover of High Conflict." width="900" height="900" /> High Conflict: Why We Get Trapped and How We Get Out By Amanda Ripley. Simon & Schuster. $17.99 from Amazon Mark Joseph Stern covers courts and the law for Slate. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/691ea6ee-d4b8-4dbc-8bed-af6'
