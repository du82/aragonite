["https://slate.com/advice/2025/02/dear-prudence-disney-trip-hell.html"]
title = "Family vacation advice: My mother-in-law is forcing us to go on the Disney trip from hell."
description = "The Mouse is not ready for this family’s disfunction."
full_description = "Dear Prudence Help! My Mother-in-Law Is Forcing Us to Go on the Disney Trip From Hell. The Mouse is not ready for this family’s disfunction. Advice by Delia Cai Feb 22, 20258:00 AM Photo illustration by Slate. Photos by Getty Images Plus. Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My husband and his brother have been almost entirely estranged since their father died more than three years ago. There was no will, so my husband was tasked with managing all the ins and outs of the estate. Their childhood home sold for much less than hoped (poor upkeep, and a surprise reverse mortgage that came to light in the 11th hour), and my brother-in-law blamed my husband for his subsequent financial woes. Fast forward to today: My mother-in-law is planning a joint family trip for us all. She wants to take all her grandkids to Disney World “before it’s too late.” That’s right - Disney. With all of us. BIL has said he’d “put differences aside” to make MIL happy, but … it all feels fake. It IS fake. I don’t think there’s any reality in which they can work out these “differences,” let alone in time for a vacation later this year. I know this trip is a bad idea, and general advice would be to avoid it altogether, to not spend time with people pretending everything is “OK…” But this trip is happening whether I like it or not. Sending the kids solo with grandma is not an option, so, how would you suggest I handle it all? What’s the best way to shield my kids on a trip that will likely include obvious fighting and drama? —Trip Trapped Dear Trapped, If I were in your shoes, I would strongly encourage your husband to have a one-on-one meeting (or phone call) with his brother before the family trip, because Disney World with the whole family in tow is not going to be the ideal setting for their first encounter. They do not have to magically reconcile all in one go; the two of them simply need to discuss some basic expectations for this trip truce (i.e. how long is it? Who’s paying for what? What conversation topics are off-limits for the trip or in front of the kids?). It’s in no one’s interest to start figuring all of this out once you’re surrounded by thousands of other families who are also barely getting along. Additionally, either with your husband or on your own, I would sit the kids down and tell them that it’s possible that Dad and Uncle “Joe” may not always be feeling their best during this trip, and when that happens, they might have to take breaks. And then I think you and your husband need to have a chat about how to best structure the trip so that he has those breaks, plus plenty of adult venting time. You also should have some time where you don’t have to play peacekeeper 24/7. Take it one day at a time, and rely on the “not feeling well” excuse when the tension is palpable. Kids pick up on that, and it’s better to take a break than to try to force through it with plastered smiles—there will already be enough of those around. Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, I have a friend who for the purposes of this letter I’ll call “Tim.” Tim and I have been friends for over four years now, and for the last year and a half at least, I’ve wished for some more distance from him—but I don’t know how to create that without being cruel. For some background: When we first met, Tim and I were fast friends and quickly fell into a big sibling/little sibling dynamic. I was very much the big sibling: I looked out for Tim, gave him advice, and found him really entertaining. This dynamic persisted for a while, and two years ago, I probably would have called Tim one of my best friends. Over time, though, the lopsidedness of our friendship started bothering me more and more. Tim really values my opinion and turns to me for support and guidance often; meanwhile, I see Tim as sweet but immature, and he’s not so high on the list of people I’d turn to with hard questions. Part of the issue is that I don’t think Tim has grown up very much in the years we’ve been friends, which has made the gap between us feel bigger. It also means the things I found fun and funny about him in the beginning—things that helped balance the scales of our relationship—strike me as a little juvenile now. Tim has also changed a fair amount in the years I’ve known him—he’s let go of certain passions that made him interesting to me when we met, and in general has become a more isolated person. One more thing: Tim came out as trans and has been transitioning in the time we’ve been friends (I’m using a name and pronouns that are consistent with his gender identity). I’ve been very supportive throughout the whole process, and have thought very hard about whether some internalized transphobia is contributing to how I’m feeling, but I’m certain now that it’s not. Still, I’m including this information just to say—he’s been going through something big! Which makes me feel all the worse about wanting distance from him. As I said, I’ve been feeling this way about our relationship for a year and a half now, and I still don’t know how to proceed. At this point, I see Tim about once a month (mainly when he initiates), but that’s still more time than I’d like to dedicate to a friendship that isn’t fulfilling right now. Still, I feel frozen between two kinds of guilt: the guilt of dodging Tim or otherwise not reciprocating his friendship, and the guilt of persisting in a friendship mainly out of obligation. Tim still considers me one of his best friends, and loves me very deeply—which makes all of this that much harder. What would you do? —Fair-Weather Friend Dear Fair-Weather friend, As someone who loves playing “Big Sibling” in many a friendship dynamic, I feel you. It’s fun until the imbalance starts to grate, and then it just sort of feels thankless and frustrating, especially when you both start growing apart—which is what seems to be happening for you and Tim. But I can imagine that the combination of Tim’s increased isolation and his experience with a major life change, i.e. his transition, makes it feel like you can’t really abandon him now. In situations like these where you want more distance in a friendship, it’s tempting to try to gently fade out, hoping that the other person gets the picture. But I think that’s actual abandonment. It’s much kinder to address the tension directly, because you can give some reassurance about what your desire for distance is really about (i.e. if you just start ghosting, he’ll start coming up with his own reasons why). I would get together with Tim one-on-one and say something along these lines: “Hey, I care about you, and I know that this is an important time in your life. But I also have to be honest about how I’ve been feeling like we’re growing apart for a while, and I was wondering if we could take a few months of space so that I can figure out some stuff going on with me, and what I would want from a friendship going forward.” This might read as a watered-down version of “It’s not you, it’s me,” but the sentiment is true: You want something different from this relationship, and you’re now asking for some time and space to figure it out. Maybe during these months apart, you find that you miss Tim and want to restore your friendship exactly as it was; maybe you’ll realize that what you really want is to change up the format of your hang-outs (i.e. less catching up, more activities). Or maybe you’ll just realize you’re better at supporting Tim from some distance until he grows up a little more. And that’s okay, too. The important thing is that you are honest with Tim about your needs, which keeps the bridge for any kind of future connection intact. Dear Prudence, I grew up in a small, tight-knit family—my parents immigrated to the U.S. as teens, but mostly maintained the values of their culture rather than assimilating to American culture. They never really discussed politics when I was growing up, however, they’ve increasingly become consumed by conservative politics, probably partially a side effect of the extremely white Republican community they’ve lived in for 20-plus years. I’m often left speechless by their points-of-view, which can feel like grab-quotes from Fox News and are downright bigoted and insensitive. There’s a lot I can’t talk about without them turning it into some conservative agenda, even though I avoid talking politics at all costs. It makes it difficult for me to share my life in any deep or meaningful way. I don’t feel like I know them anymore, not as I did in my youth. My parents are now in their 70s. I feel sad that we’ve drifted in this way, though I don’t think they even notice, and I have no idea how to cope. I text them every day, and I call them every so often. Usually the conversations are fine, but lack any substance or depth. I feel like I’m mourning them before I’ve even lost them, and I want to find some way to connect with them in their later years, knowing that I won’t have all the time in the world with them. But I have no idea how to. —Prematurely Missing My Parents Dear Missing My Parents, Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. You’re craving connection with your parents, but it seems like your current method of calling/texting to catch up isn’t getting you what you want. A lot of parents, no matter their age, aren’t terribly great with gabbing simply to gab—there needs to be a “third thing” in the room to talk about (i.e. the TV) or you need to be experiencing something together (which can be as simple as going for a walk and looking at stuff). Assuming that you don’t live in the same place as your parents where you can organize such activities, I think you have to get creative about figuring out a “third thing” to share—one that isn’t Fox News. (Because the real function of Fox News, or any other media, really, is to give people something to talk to each other about.) Are there existing hobbies or activities that your parents enjoy, such as cooking, sewing, gardening, bird-watching, or watching specific TV shows/movies that you could use to bond over? It doesn’t even have to be a big formal thing; my mother and I have primarily bonded in recent months over sending animal-related TikToks to each other. It’s not the ideal relationship I want with her, but after a few years of major conflict and resentment, it’s what we both need to rebuild a basic level of enjoyment and trust with each other. I think that’s what you need, too. You and your parents all need a shared “third thing” to establish a basic bond before everyone feels connected enough to have more conversations “of substance,” as you say. At the end of the day, feeling understood by your parents is certainly the goal, but giggling together (even over silly videos) still counts as time well spent. —Delia Catch up on this week’s Prudie. More Advice From Slate I live in a huge apartment complex with about 500 tenants. I happen to live on the back side of the complex, with a window facing the dumpster in the alleyway. Many of the maintenance workers hang out in that alley when they’re not working. I’ve been working from home for six months now, meaning I spend way more time overhearing their conversations than I used to. Tweet Share Share Comment Advice Dear Prudence Slate Plus"
