["https://slate.com/advice/2025/02/marriage-advice-circadian-rhythms-sex.html"]
title = "Marriage advice: My wife and I keep playing a game of Goldilocks when it's time to have sex. Enough."
description = "This all used to be so much easier."
full_description = "How to Do It My Wife and I Keep Playing a Game of Goldilocks When It’s Time to Have Sex. Enough. This all used to be so much easier. Advice by Rich Juzwiak Feb 26, 20253:57 PM Photo illustration by Slate. Photo by Prostock-Studio/Getty Images Plus. Tweet Share Share Comment How to Do It is Slate’s sex advice column. Have a question? Send it to Jessica and Rich here. It’s anonymous! Dear How to Do It, My wife and I have been together for about eight years. We love each other, and I’m very happy with her overall. We’ve had some great sex in that time. We’re pretty adventurous for a monogamous couple. However, we have descended into a bit of a difficult circadian rut. Our sex schedules are mutually exclusive. My wife loves sex, but only at the end of the day, or very first thing in the morning. It’s a “falling asleep” thing for her. Meanwhile, I’m the more active partner when it comes to sex, and I need more sleep. By the time my wife is ready to have a little fun, I’m half asleep, and in no state to be the playful, energetic partner that I want to be. Half the time, I’ll just help her get off so that we can both go to bed. The morning is just as bad. She’s awake and ready to go, and I’m too groggy to manage much more than a quickie… This dynamic leads to frustration on my part. We usually have one really great session per week, on Saturday when I’m not as tired. But I don’t feel completely fulfilled with this. We’ve tried scheduling sex during the day on occasion, but it’s definitely her doing me a favor, and if there’s any reason to cancel, it will be. I feel like it was easier to overcome on both our parts early in the relationship when everything was newer and fresher. I was more willing to stay up late to get what I wanted, and she was more willing to do it at times that didn’t match her ideal. With several years under our belts, that’s not the case as much anymore. We’ve also been pretty adventurous and explored most of what I think is fair game for us, so I don’t think there’s an easy way out there. How do we fight our natural rhythms, so that we can have better, more meaningful sex? —Circadian Challenges Dear Circadian Challenges, The first thing I would try to do is continue with the slight adjustments for the sake of compromise. So maybe you’re too groggy to do it first thing in the morning—what about an hour after waking? If this doesn’t align with your work (or other day-to-day) schedule, consider waking up earlier than usual in order to acclimate, so that by the time she’s ready to go, so are you. Similarly, could you try having sex slightly earlier at night? If not right before bed, then how about an hour or two before? Every body is different and endowed with its own proclivities, but relationships are fueled by compromise. It’s a constant balancing game of your needs with your partner’s. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. It’s important to make more time for each other. It might not be ideal, but meeting each other halfway is going to be key to your success. And you’re already doing it—you do her a solid when she wants it later at night, and she does you one when you are looking for a midday thing. It’s OK to not have mind-blowing sex every time, especially when the net positive yields more sexual contact and at least one of you is having a great time. Also, consider your sleep patterns. Are you getting eight hours? Do you ever experiment with naps? Waking up groggy is common, sure, but it could also indicate an underlying condition, including sleep apnea and bruxism (grinding/clenching teeth). If your grogginess is accompanied by other chronic symptoms, it could indicate other serious conditions (check out this list of concomitant symptoms with fatigue to see if any describe what you’re experiencing). This really could be just how you are, but if you aren’t on top of your health, your body could also be trying to tell you something. —Rich More Advice From Slate My husband “Cole” and I have been together for nearly 18 years, married for 15. We’ve never stepped out on one another. From the beginning, our sex life has been a sparkle, not an explosion—we are both “sides” so there is no anal intercourse. However, before Cole, I always had a boyfriend who enjoyed being scrogged on the daily. I enjoy topping and under the right conditions have dusted ceilings for the right guy. Cole and I haven’t had any sexual contact now for going on two years. He’s very wary of rejection, and the last time he tried to initiate some action with me I told him I wasn’t into it. It’s now two years later. Tweet Share Share Comment Advice Sex Slate Plus"
