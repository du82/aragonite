title = "Sex advice: My ex's sexual superpower was a medical marvel. It's ruined me."
description = "There was a certain magic to it."
full_description = "How to Do It My Ex’s Sexual Superpower Was a Medical Marvel. It’s Ruined Me. There was a certain magic to it. Advice by Jessica Stoya June 27, 20231:20 PM Photo illustration by Slate. Photo by Artem Tryhub/iStock/Getty Images Plus. Tweet Share Share Comment Slate Plus members get more How to Do It each week. How to Do It is Slate’s sex advice column. Have a question? Send it to Stoya and Rich here. It’s anonymous! Dear How to Do It, A few years ago, I was dating a guy and it was an absolutely magical experience. He had diphallia—and his two penises could independently become erect and were of slightly different sizes. Unfortunately, things didn’t work out, and we went our separate ways. Since then, I’ve never met a guy who could measure up. I’ve even tried a couple of threesomes with two guys, but it just isn’t the same. I can count the number of orgasms I’ve had since that day on one hand. I never used to have trouble before meeting him, so I know it’s psychosomatic in some way. But I can’t exactly forget that amazing experience or prevent myself from comparing subsequent sexual encounters to it. How do I get over my own problems here? —Spoiled Sexless Dear Spoiled Sexless, Our culture is seeped in messages about sexuality that focus exclusively on the body. Christine Emba’s Rethinking Sex: A Provocation critiques a number of the sites these messages stem from, including the way we order our lovers and porn up like pizzas from apps and tube sites. It can be easy to forget that there’s a whole person there, that so much more than physicality goes into sex—regardless of how much of a no-strings hook-up it is that we’re involved in—and that the brain is the most significant organ engaged during sex. Popular in Human Interest Slate Crossword: “Renaissance” Woman, to Fans (Three Letters) Are you sure it’s about the diphallia? This guy’s dicks were attached to the rest of him, and while you don’t say much about him and only focus on this one facet, I imagine there were other qualities you appreciated. It’s worth taking some time to consider what else you might be missing. What was your relationship like? What attracted you to him? What motivated you to develop a relationship? What felt like it was gone when the two of you parted ways? I hope you find what you’re looking for, whether that’s in a threesome or not. —Stoya More Advice From Slate I’m a woman in a wonderful, long-term relationship with a man. Our relationship is happy and easy, we communicate well, we have lots of common interests, and we also have a mutually satisfying sex life. It mainly takes the form of penetrative sex, occasional mutual masturbation, and me giving him blow jobs. While I really enjoy giving oral sex and my boyfriend really likes receiving it, he dislikes giving it, and I’m indifferent to receiving it. It’s not a turn-off, but it also doesn’t really do anything for me. Some of my friends insist that our oral preferences create an imbalance in our relationship… Tweet Share Share Comment Advice Sex Slate Plus"
