title = "Parenting advice: I thought my husband was a good stay-at-home dad. But now I’m not sure my toddler is safe."
description = "I’m not sure what to do here."
full_description = '''Care and Feeding I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. I’m not sure what to do here. Advice by Nicole Chung Feb 28, 20256:02 AM Photo illustration by Slate. Photos by Jacob Wackerhausen/iStock/Getty Images Plus and FotoDuets/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Care and Feeding, I am the mother of a very high-energy, spirited 4-year-old daughter, “Annie.” I work part-time, and my husband is her primary caregiver during the day, though she just started morning preschool. Annie can be challenging, as she is fully in the kicking/hitting/biting/ spitting/tantrum toddler phase, but according to her pediatrician, it’s nothing out of the ordinary for the age. We struggled a lot with potty training her. Sometimes she would tell us she had pooped her pants and giggle knowingly, which was infuriating. We would enforce potty sitting time and she would scream and flail about and we would basically hold her down on the potty long enough to back away and shut the door to give her privacy, because my husband couldn’t take her yelling and wailing. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Around this time, my husband started getting really frustrated and angry with her at times. He would sometimes grab her by the upper arms and set her down on the potty really hard. One time, last fall, my husband was mad at her for something and he grabbed her really hard by the arms—so hard it left red marks where his fingers had been. I was very angry and disturbed by this, but didn’t say anything at the time. Then a couple weeks later, it happened again, and this time I took my daughter to him with her shirt off, showed him the marks, and gave him a dressing down. He started to make excuses and I told him flatly that this was his problem and stormed off. He came to me soon after and apologized (he also apologized to our daughter), but told me that he didn’t know how to deal with this anger. I was troubled by this, for lots of reasons. Advertisement Advertisement Advertisement My husband is generally a very gentle, kind, thoughtful person who treats everyone with respect, doesn’t believe in violence, and has always made me feel safe. But I see another side to him with our daughter when he gets really mad. To be fair, she is an intense kid to parent, and I also struggle with getting angry and yelling at her. For my husband, I think part of it is that he is highly sensitive to loud noise and other stimulation. Her high-pitched voice and monotonous whining really put him on edge. I want to stress that this isn’t the only way he interacts with her—he is the stay-at-home parent and he is very engaged and caring with her, and they do a lot of fun things together. He is good at building her up with praise and teaching her things. He knows her really well and is very involved in parenting her. Advertisement Recently, Annie was watching one of her shows with her father (she was sick and mostly having screen time and resting) and kept kicking and whacking him. She is a very touchy-feely kid and frequently uses kicking and hitting to maintain touch with us even if we are right next to her. We don’t encourage this behavior, and typically use verbal warnings and then time-outs in response. My husband had fallen off a ladder and hurt his arm, and she hit his injured arm. He decided to whack her back on the leg, telling her that hitting hurts and she needed to stop it. When he told me this, my initial response was that we couldn’t do that and that it set a bad example for her, but then—because I am an internal processor—I let it go so I could think more on it. A couple of days later, after talking to Annie and asking her what happened, I confronted my husband about hitting her back. I told him that I was deeply concerned about his use of physical aggression with her, and that while I love him very much, I will do anything to protect my daughter. He said that he didn’t hurt her and demonstrated to me how hard he hit her, but he said that she was shocked and said, “You hit me!” He said she stopped hitting him after this, and so he feels what he did was effective. Advertisement Advertisement Advertisement We argued about this, with me telling him that neither I nor a lot of child psychiatrists think that any physical punishment is good for kids, and that he might as well spank her (he doesn’t believe in spanking; neither do I). He claims him whacking her was different from spanking because this was a direct and relevant consequence of her actions—he was showing her how her actions felt when returned. One time she bit him, and he bit her back, not very hard, in a similar bid to show her how it felt. I told him that I was starting to feel generally uneasy, not knowing what was happening when I was at work, and wondering if I could trust her with him. He got very offended. He pointed out that it was he who told me about hitting her in the first place, and that he would be open with me if it happened again. I reiterated that I didn’t want him to use physical force with her, and he said he disagreed with me because in this case it was a small act that didn’t hurt, and was controlled. He said he couldn’t promise me that he would never do something like that again. I pointed out that if he said that about hitting me, I would be out of here. He thinks this is a different situation because what he did wasn’t out of uncontrolled anger. He told me that he doesn’t want me to yell at her, which I agree is not OK. Then the argument devolved into a more typical argument about how the workload and childcare is being split, with each of us feeling the other’s characterization is unfair and inaccurate. Advertisement Advertisement Advertisement I need an objective perspective here. I had an abusive parent and a passive parent who never defended me, and I don’t want to be the latter. But I also have a form of OCD that makes me overthink and ruminate on everything, so I’m wondering if I am blowing this out of proportion. —Troubled Mom Dear Troubled, Advertisement To start, I am going to repeat something you said back to you: Your husband would not promise to refrain from hitting or using physical force with your child. That means that he will probably do it again. He was ready with a whole list of excuses for hitting her: She stopped hitting him, so it was “effective” (if all one cares about is compliance, any horrible treatment of a child that stops an unwanted behavior could be called “effective”; that obviously doesn’t make it OK). It was a direct consequence of her actions (this is essentially him telling you that your 4-year-old was asking for it). It’s not like he did it out of anger (there is absolutely no reason to believe this; you already know that he gets physical and manhandles her when he’s angry). It’s not like he hid it from you (abuse disclosed by the abuser is still abuse). Bottom line: Your child’s father is willing to hit and intimidate your daughter in the interest of controlling her, and he sees no problem with this. Advertisement Advertisement But you know that it’s wrong to hit or otherwise physically harm a child. You know that your daughter doesn’t deserve to be hit for typical little-kid behavior, for atypical little-kid behavior, for any reason whatsoever. And if I were you, I would be really worried about what your husband will do as parenting gets tougher and the emotional stakes get higher. Because as maddening as parenting a “spirited” 3- or 4-year-old can be, it’s honestly nothing compared to what’s ahead. He totally lost it over potty training—something undeniably frustrating, but also a thing every parent has to go through. We’ve all been there; we’ve all dealt with the stubbornness and the probably-on-purpose “accidents”; we’ve all wanted to scream. We haven’t all grabbed our kids hard enough to leave marks or bruises on their skin. We haven’t all decided that sometimes the only way to get our point across to a stubborn or boundary-pushing or downright rude kid is to hit them. Advertisement Talk with your daughter and make sure she knows that you want her to tell you if anything like this happens again. Document everything that has happened so far and everything going forward (you may one day need a court to take it into account). Make sure your husband understands that if he ever physically hurts your child, you won’t ignore it, excuse it, or cover it up—you’ll be reporting it. I know it’s difficult and perhaps not practically feasible, but I would also really be trying to limit the time he spends alone with her, since again, by his own admission, you can’t trust him not to hit her. (Is full-time preschool/aftercare an option? Babysitters when her morning preschool is over? Do you have any family who could help when you’re working?) I’m going to be honest and say that in your place, I’d also want to ask him to move out and get intensive therapy to try to deal with his issues, but by saying that I am not suggesting that’s an easy or straightforward step for you or anyone to take. At the very least, he should understand that will be the next step if he ever hits or manhandles your daughter again. And in case you ever want or need to talk with about your options, now or going forward, here’s a link to the Domestic Violence Hotline. You can also search to find organizations and resources near you. Advertisement Advertisement Advertisement Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. You might think that I’m overreacting now. I’m not. I know people who could have written parts of your letter. Their partners also didn’t believe they had done anything wrong when they got angry and lost control—it was always someone else’s fault for provoking them, or refusing to listen to “reason.” In pretty much all of those situations, things did not get better; they got worse. So no, you are not blowing this out of proportion, and neither am I. Please don’t second-guess the voice in your head telling you that this is wrong. Don’t let your husband derail or distract you with arguments about the division of labor or how you’re not a perfect parent, either, as if the standard is perfection. It doesn’t matter what sort of “point” he was trying to get across to your child when he hit or bit or grabbed her hard enough to leave marks. It doesn’t matter that he doesn’t “believe” in spanking, or how “kind” or “gentle” he acts at other times—he is not allowed to hit or physically hurt your child for any reason ever. Parents have to choose other ways to get our points across. Even when our kids don’t! Even when we are angrier than we have ever been! We are the adults. And so often, in so many ways, they are at our mercy. Advertisement Advertisement Advertisement I am truly sorry; I know all this is incredibly hard to think about, and you don’t want any of it to be happening. But it is, and as you already know, you have a responsibility to try to protect your child. Imagine what you’d say to a close friend who told you that her husband hit and grabbed and manhandled their kid, and then made excuses for it and refused to say he wouldn’t do it again. I think you’d probably tell her that wasn’t OK, encourage her to document what’s happened, support her however you could, and stand by her if she ever chose to leave. Listen to that advice. Please try to trust the instincts that told you your husband was wrong, because they are 100 percent correct. —Nicole Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Family Parenting Advertisement'''
