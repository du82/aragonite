["https://slate.com/culture/2025/02/the-10th-kingdom-tv-show-nbc-cast-scott-cohen-kimberly-williams-paisley-streaming.html"]
title = "The 10th Kingdom: The best bad fantasy show from 25 years ago."
description = "Before Once Upon a Time, there was The 10th Kingdom."
full_description = '''Television The 10th Kingdom Deserves Its Proper Due When the series premiered on NBC 25 years ago, it was expensive, buzzy, and frankly ridiculous. By Nadira Goffe Feb 27, 20252:28 PM Hallmark Entertainment Tweet Share Share Comment Tweet Share Share Comment “My name is Virginia, and I live on the edge of the forest,” is how the epic journey of NBC’s failson-turned-cult-classic fantasy miniseries, The 10th Kingdom, began 25 years ago to the day. But the forest isn’t the “forest,” exactly: It’s New York City’s Central Park, and, in the show’s intro, New York transforms into a fairy-tale land. Big structures become castles, skyscrapers become mountains, and famous bridges are stepped over by giants, metaphorically signifying the collision of the world as we know it with the world where all of our favorite tales actually happened. What follows is an Odyssean journey through a world of fractured fairy tales, experienced by characters who previously believed that Snow White, Little Bo Peep, trolls, and evil queens were all just the stuff of children’s stories. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); In the decades since The 10th Kingdom’s premiere, TV shows that blend the real world and the fairy-tale world have become accepted fixtures in the ever-growing genre of fantasy television. ABC’s Once Upon a Time, which aired from 2011 to 2018, was a massive hit and even resulted in a short-lived spinoff based on Lewis Carroll’s classic Alice’s Adventures in Wonderland. There was also NBC’s Grimm (2011–2017), in which creatures inspired by the Grimm Brothers’ tales really existed, and the CW’s reboot of the 1987 CBS series Beauty & the Beast (2012–2016). But, somehow, The 10th Kingdom, without which I couldn’t imagine Once Upon a Time or other later entries within the genre, has been unfairly banished to the realm of obscurity. Despite having won an Emmy (granted, for Outstanding Main Title Design), virtually no one I ask today has even heard of this series. Advertisement Advertisement Advertisement To reckon with why the show’s legacy has perished, we must first return to how it began. Back in 1996, after Gulliver’s Travels—a collaboration between Hallmark Entertainment (now known as Halcyon Studios) and NBC—proved a triumph with five Emmys, including Outstanding Miniseries, the network and the production company went all in on special-effects-loaded joint projects. The demand was high, resulting in a run of titles like 1997’s The Odyssey, 1998’s Merlin, and 1999’s Alice in Wonderland. Banking on this newfound formula for viewers and critical acclaim, NBC gave the writer behind Gulliver’s Travels, Simon Moore, a chance to try his hand at their biggest endeavor yet. Advertisement On Feb. 27, 2000, at the turn of the millennium, NBC’s The 10th Kingdom—which, having taken $44 million to make, seven months to film, and 10 years to write, was a massive investment—finally aired in a series of five two-hour episodes. The series had a lot going for it, including a cast full of big names. The 10th Kingdom follows Virginia (Kimberly Williams-Paisley, pre–According to Jim), a young woman who lives with her father, hapless janitor Tony (John Larroquette, post–Night Court). The two are thrust into the fantasy realm of the Nine Kingdoms, where the Evil Queen (Dianne Wiest), freshly broken out from Snow White Memorial Prison, has swapped the body of her stepson Prince Wendell (Daniel Lapaine) with that of a golden retriever, in an attempt to regain power before the prince’s upcoming coronation. But the dog flees with Virginia and Tony as they travel through the Nine Kingdoms to save the prince’s life and find a way to get back home to New York City (the titular 10th Kingdom, as dubbed by some confused trolls who briefly land there). Accompanying them is a carnivorous, homicidal, ridiculously horny half-wolf man, appropriately named Wolf, who is infatuated with Virginia and happens to be played by Scott Cohen, also known as the guy who played Max Medina in Gilmore Girls. (I struggle to relay just how deranged Cohen’s take on this character is, though I mean that as a compliment.) Our heroes are being chased by a group of trolls, commanded by Relish, the Troll King, who is played by none other than Ed O’Neill (pre–Modern Family, post–Married With Children), lavishly adorned in punk-rocker troll prosthetics and costuming. Rounding out this all-star cast are: perhaps the most famous Dutch actor of all time, Rutger Hauer, playing the Evil Queen’s Huntsman; famed Old Hollywood actress Ann-Margret playing an aging Cinderella; The Practice’s Camryn Manheim playing a different version of Snow White; Lucy Punch playing a descendant of Little Bo Peep; and the Warwick Davis playing Acorn the Dwarf. Advertisement Advertisement Advertisement I, a connoisseur of fractured fairy-tale media, first encountered this show a year ago when one of my best friends visited me in New York City, bringing with her a recommendation for the series based on a DVD set she had found in her parents’ basement. To her, as she explained to me then, the show lives on as the perfect media to watch after you’ve had an edible, when you’re trying to wind down. (We tried it: She is right.) Though we spent all of our time streaming the show and laughing at it, it was a welcome reprieve from television’s current slate of shows that, great or not, require so much damn thinking. Sure, I could spend hours on Reddit reading Severance theories, but I’d rather watch Larroquette yell, “What does that achieve?” at a frog (that has, for some reason, a vaguely Caribbean-patois accent) in rebuke of the famous door riddle from another fantasy cult classic, Labyrinth. Or watch Larroquette very animatedly lambaste the ridiculously high stakes of fairy-tales as a whole. From the beginning, the show has you in awe that a series this inelegant and saccharine was even made. And, because of this, it circles from bad all the way back around to good again, the way most objects of nostalgia do (or should). Advertisement Advertisement Advertisement But what really makes The 10th Kingdom so charming is its unmistakable identity as a product of its time. Nothing dates The 10th Kingdom as one of the last bastions of an idyllic, pre-9/11 fantasy more than the show’s highlighting of the World Trade Center’s twin towers, which not only star in the opening sweeping shots of New York City, but also take center stage in the show’s logo and promotional artwork. The delightfully cheesy artwork shows two worlds: a fantasy realm right side up from the horizon, and the New York City skyline (twin towers at center) reflected upside-down below. There’s a “gee-whiz” factor to the series’ special effects, as the New York Times’ Craig Tomashoff wrote in 2000. The intro’s depiction of the worlds colliding and New York transforming—guided by a roughly rendered fairy—looks quaint, almost silly, especially to eyes that have been subjected to the contemporary era’s assault of Marvel-grade CGI. One could imagine how seeing a man morph into a dog on screen could have been impressive in 2000, but it feels even more played for laughs when hilariously juxtaposed with the show’s depiction of magical “troll dust,” which can knock a character unconscious, and comes in the form of pink glitter, which the production team haphazardly dumps all over some poor body double or stand-in. It’s hard to relay the pitch-perfect corniness; all I can do is point you to contemporary trailers for your own satisfaction. Advertisement Advertisement <iframe class="youtube-player" type="text/html" src="https://www.youtube.com/embed/X9SDhW0lUgI?rel=0&enablejsapi=1" allowfullscreen frameborder="0"></iframe> But special effects alone aren’t enough to captivate an audience, as Larroquette himself theorized in the 2000 New York Times cover story about the series. Story is equally as important—a notion that Garth Ancier, then-president of NBC Entertainment (the guy who scheduled The West Wing and cast Law & Order: SVU, but who also, regrettably, canceled Freaks & Geeks), agreed with, claiming that his faith in the story is what helped him stand “solidly behind” the series, despite concerns over “giving over” so much of the network’s schedule to it. Though I wouldn’t go so far as Tomashoff in likening the show’s narrative to “the Grimm Brothers’ Greatest Hits, as interpreted by Woody Allen,” the core of it is compelling. The entire tale is a sort of late-bloomer coming-of-age story for Virginia, who remains emotionally stunted by her mother’s decision to abandon the family when she was a baby. In order to make it through the Kingdoms alive, she is forced to break out of her shell and find her bravery and confidence. And, of course, romance—specifically with Wolf, who also has a particularly endearing, though not not batshit, redemption arc. Then there’s the father-daughter relationship that grows when Tony, who feels eternally trod on and is always falling into schemes to get rich quick or elevate his station, has to evolve. Advertisement Advertisement Advertisement Advertisement But maybe the world wasn’t ready yet for a show where the trolls’ go-to expression of frustration is the elegant “Suck an elf!” Maybe having the wolf-man’s tail unsubtly pop out and wag every time he gets aroused by Virginia was too groundbreaking for puritanical audiences. Or maybe it really was all those corny-looking special effects. Well, whatever the reason, the show didn’t hit. Despite the big names and the money and the whimsy, and despite the show’s somewhat sizable premiere ratings, it couldn’t stick. Nowadays, the show’s mainstream recognition has mostly consisted of the occasional appearance on bloggy lists of oft-forgotten media. Related From Slate Laura Miller Detective Shows Are Great, but One Subgenre Is the Very Best Read More Popular in Culture Severance​’s Latest Episode Finally Gives Viewers What They’ve Been Waiting For It Was Watched by 14 Million. Its Influence Is Still With Us Today. It’s Hilariously Bad. It Was a Work of Staggering Genius—and a Sensation. Then It Went Away. What Happened? It’s Abundantly Clear Why an Olympic Gymnast Wants Men’s Uniforms to Change Somewhere out there, though, people are still watching. The 10th Kingdom, like so many other misunderstood or ill-appreciated works of film and TV, has become a card-carrying member of the club of cult classics. People go to bat hard for this series, like Collider’s Shawn Van Horn, who deemed it, still, the “best fairy tale show” in 2023, and Paste’s Clare Martin who, just last year, mounted an entire defense for the series, and Pajiba contributor Kate Hudson, who fully admits that the “cinematic achievement” made her such a fan of O’Neill that she penned multiple (unanswered) fan letters to the actor in 2000. Look on Reddit (the typical home for cult favorites) and you’ll find a number of threads celebrating the act of rediscovering the show and reveling in its most glorious moments, like its sheep-themed rendition of Queen’s “We Will Rock You.” Nine months ago, dozens of members of the subreddit r/ForgottenTV chimed in to hail The 10th Kingdom, agreeing that it “still holds up”; over on r/television, someone else wrote that they rewatched the show and found that their enjoyment of it wasn’t just “nostalgia,” but because it was actually a “solid” work of television. Fans continue to praise the show on its official subreddit r/the10thKingdom, where there is a standing post about a Change.org petition for a sequel, which, at the time of writing, has just under 18,000 signatures. (There have long been rumors of continuously dashed plans for a sequel—though, last year, a Cameo video of Cohen surfaced in which he claims they are working on making a sequel happen.) And the veneration doesn’t end there, with some notable YouTube essayists and TikTokkers also remembering the show fondly. Advertisement Advertisement Advertisement Twenty-five years later, the reigning question shouldn’t be what is The 10th Kingdom, but rather: Is it good? The answer is: No, not in the way the earlier seasons of Game of Thrones or The Witcher are. But the show feels good—it feels like stepping back into a time when things were brighter, more colorful, and more whimsical, when media wasn’t afraid to be deeply unserious. It may not be good, but it is, in its own way, great, and certainly deeply deserving of all its loyal fans’ reverence. What The 10th Kingdom did so well was extol the importance of joy and jest, even in the face of tragedy. Twenty-five years later, lovers of the series can continue to rejoice, reminisce, and await a maybe-never-coming sequel, knowing they were right all along. To all the haters, they say: Suck an elf. Get the best of culture Get the best of movies, TV, books, music, and more. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Culture newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment TV Fantasy Advertisement'''
