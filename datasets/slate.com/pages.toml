title = "Parent advice: My parents cut their trip suddenly short. That's when I found out what they really think of my husband."
description = "I wish I knew this a decade ago."
full_description = "Dear Prudence Help! My Parents Cut Their Trip Suddenly Short. That’s When I Found Out What They Really Think of My Husband. I wish I knew this a decade ago. Advice by Delia Cai Feb 26, 20256:00 AM Photo illustration by Slate. Photo by fizkes/iStock/Getty Images Plus. Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, Over Christmas, my parents visited me, my husband, and our two children from out of state for what we thought would be a multi-day visit. We even had some activities planned. They ended up arriving late Christmas Eve and leaving early morning on the 26th with little explanation. Two days later, my father informed me that they left because he doesn’t like my husband of nine-and-a-half years, and never has. He’s seemingly been upset by random one-off comments my husband has made but has never expressed his concerns before. During the conversation, I was too hurt to ask for a list of grievances but from what I know, these were benign things said in conversations over the years about money that rubbed my dad the wrong way. I left the conversation with my father deeply hurt and haven’t talked to him since (we used to talk multiple times per week and text). While no one is perfect, my husband is pretty close—he is a hardworking, wonderful, fun, engaged husband, father, and friend. My mom still wants to have a relationship with me and my children. She doesn’t think what my dad did was right but said she can’t change his mind. She’s been less open about whether she likes my husband or not. I used to call her regularly too and since the incident, I’ve texted her and let her FaceTime with my kids but am having a hard time wanting to talk to her. I’m at a loss because I love and miss my parents but my husband has done nothing truly wrong and I feel strongly about supporting him. He feels terrible about the situation too and said that he won’t keep me or the kids from my family but will support my decision either way. He is also willing to reach out to my dad to try and understand what happened, and apologize if it’s needed. He wished my dad would have come to him/us a decade ago so he could’ve understood the apparent concerns then and adjusted. Any advice about what to do and how to move forward? —Christmas Blues in February Dear Christmas Blues, How bizarre. Most parents aren’t exactly known for their communication skills, but I imagine that this was quite a shock. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I think you need to take some time to recover and cool off from this ordeal before repairing any relationships. Tell your parents (text or email is fine) that you’re (understandably) hurt, not only by this sudden revelation but also by the way they let their feelings about your husband affect your relationship with them (i.e. by cutting the Christmas visit short). The gist of your message should be something like: “It’s OK if you don’t like my husband, but if you aren’t able to work around those feelings (or resolve this mysterious conflict directly with my husband) for the sake of our relationship, then I’m not able to hold up my end of the relationship with you, either.” Tell them you’re going to take a few months to think and recover from the hurt feelings around this truncated Christmas. Then say you hope when you speak to them this fall, they’ll be ready to discuss how they plan to work around their dislike of your husband, assuming that they’d like to preserve their connection with you. —Delia Classic Prudie Around the time I got engaged, my aunt started making some very destructive (and very public) decisions. My mom and her other siblings reached out in various ways to help her and she was mostly very nasty to them, often resorting to personal attacks when they’d try to get her to face her actions and help her through the consequences. When it came time to send out wedding and bridal shower invites I decided, based on her past and current actions and her uncontrolled drinking, not to invite my aunt. Tweet Share Share Comment Advice Dear Prudence Slate Plus"
