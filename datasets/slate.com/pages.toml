title = "Pregnancy advice: My wife is over 20 weeks pregnant and still insists on keeping it a secret."
description = "I'm tired of hiding it."
full_description = '''Dear Prudence Help! My Wife Is Over 20 Weeks Pregnant and Still Insists on Keeping It a Secret. I’m tired of hiding it. Advice by Delia Cai Feb 18, 20251:05 PM Photo illustration by Slate. Photo by EyeEm Mobile GmbH/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, My wife and I can’t decide how to share the news of our pregnancy with friends. We’re more than halfway to term, and she is still treating it like a state secret. As a result, I feel like I’m holding a big part of my life back from everyone I catch up with. I understand her argument: Every pregnancy has risks, and what could be more personal? At the same time, the vow of silence is making me feel isolated. Where’s the middle ground? —Bun in the Oven Dear Bun in the Oven, Your wife’s anxieties about going public about the pregnancy are understandable, and there are a few ways other couples have handled this. Some couples pick a “low-stakes” friend—someone you trust, but also someone whom you don’t have major personal ties with—to “try out” what it feels like to share the news. Sometimes, couples will even tell random strangers first! (A co-worker once told me the news about his wife’s early pregnancy, and we both had a laugh about it because, as he explained, “Well, you’re kind of a rando!”) (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); So I think what would be a good middle ground for you and your wife is to each pick one person in your outer circle for each of you to confide in. In circumstances like these, outer circle friends/contacts are wonderful in how straightforward your relationships are; there aren’t any major expectations or emotional ties that would complicate what is simply joyful news. Good candidates include: long-distance friends, old friends from college or childhood whom you don’t see regularly, your work lunch buddy, and a medium friend from book club or the recreational soccer league. Ideally, your wife would pick someone who’s experienced pregnancy before, and you would pick someone who’s experienced parenthood before as well, so that you can both commiserate a little with your confidantes as the pregnancy progresses—it can be a lonely and nerve-wracking time for everyone. What your wife needs are some mom pals who know what she’s going through—so I would put that front and center when you pitch this idea to her. It’s not just about sharing big news, but about widening both of your circles of support. Advertisement Advertisement Advertisement Get advice from Prudie—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, I have had horrible experiences with guys in the past and it’s made it hard for me to keep steady friendships with them. Recently, I met a really great guy but I kept getting paranoid that he wanted something more, even though he told me twice that he understood I only wanted a friendship. This scared him and we talked about it in person afterward but he can’t be friends with me now. I feel like I am shutting down all the guy friends in my life and it’s really messing with me emotionally. What do I do? —Pushing Them Away Dear Away, Advertisement Your letter didn’t mention your age, but I’m operating under the assumption that you’re fairly young (mostly judging from your use of “messing with me”). Friendships between men and women can be fraught at any age (it’s even the central thesis of the iconic rom-com When Harry Met Sally), but I do think they can be especially tricky to figure out in your teens and 20s. As you get older, you just get a lot more practice setting boundaries with people and figuring out who seems genuinely interested in getting to know you, versus who’s “settling” for friendship when they actually have romantic intentions in mind. Advertisement If you’re in early adulthood, some of this will simply be a waiting game while everyone grows up a little. But also, regardless of age, I think the best solution for anyone in this situation is to get a lot of practice at taking friendships slowly. What I mean by that is: Be judicious about how much time you spend hanging out, how often you hang out, and under what circumstances (i.e. going to the bar versus having coffee). Avoid over-relying on these friends for support, and definitely avoid “trauma-dumping,” or getting too emotionally intimate about your personal life and past, especially if you have known someone for less than a year. Think of this stage of early friendship as a kind of audition or job interview: You want to make sure they can handle the basic stuff (showing up, respecting boundaries, bonding over shared interests) before they are granted access to the company secrets (more of your time, energy, or emotional intimacy). Advertisement Advertisement I think the reason you feel emotionally wrecked when a friend isn’t who they appear to be is because you’ve already gotten quite close to them at that point, so it messes with your mind. To prevent that, I think you just need to establish a basic measure of distance between yourself and any friendship that hasn’t yet earned your total trust. I don’t think you need to cut off all your male friends or stop making new ones entirely, but I do think you need to hold men (but also, any new friends) at an arm’s length until they’ve been able to prove that their intentions align with their actions. It’s not a “test,” but it is a screening process. Advertisement Advertisement Send Us Your Questions About the Workplace! The columnists behind our new advice column, Good Job, want to help you navigate your social dynamics at work. Does your colleague constantly bug you after hours? Has an ill-advised work romance gone awry? Ask us your question here! Dear Prudence, My husband and I are in our early 70s and have been pretty happily married for 40-plus years. We raised two lively, empathic, and bright children now in their late 30s. Our sweet and generous but emotionally reserved son is married to a lovely woman and their 4- year-old son is our adorable and adored grandson. We are normal-neurotic people, both with a good sense of humor and a spirit of community volunteer commitments and progressive political activism. My husband has depressive tendencies for which he has learned to take responsibility and I can be overly expressive, but I too am learning how to keep my counsel. We use therapy, exercise, reading, movies, and meditation to keep growing psychologically, spiritually, and intellectually and we have wonderful and devoted friends. Advertisement Advertisement Our daughter, a climate justice activist herself, often said, even through young adulthood, that she and I should lead mother-daughter good communication workshops. Yet this same daughter, a vivacious, loving, and talented woman, enforced a no-contact order with us beginning almost two years ago, over her perception that we are not empathic enough about her health challenges, which have been many and various over the past 12 years. We have supported many of her alternative therapies during that time, and have been generous financially on our own limited budget, but we have also leaked to her our suspicion that she might have some anxiety that could require medication, which has angered her. She is in therapy, as far as we know, and we even joined her when she invited us into a session with her six months ago, but it went nowhere. She has a good and responsible job and has raised and saved enough money to have an expensive private surgery to fully free her windpipe from a constraining jaw to support better sleep. (A local hospital’s reputable overnight sleep apnea test reported to her that she did not show signs of sleep apnea, and we never knew that she had trouble sleeping in all the years she lived with us until college.) Advertisement Advertisement We learned about her plans for this surgery through her brother, who is very annoyed with her and finds her estrangement wrong, but who doesn’t want to triangulate our relationships, and we agree with him. He is trying to keep her connected to family, and especially to our grandson, with whom she is wonderful. Our son is even contributing money for her surgery, about the necessity of which he has doubts, but he wants to signal loyalty. My husband and I have been heartbroken about this estrangement. I am wondering if the current apparent supportive communities for estrangement that include kids who have not been sexually, physically, or emotionally abused (or children of especially painful divorces where they had to take sides) are simply “victims” of well-intentioned necessarily flawed normal-neurotic parenting, in which everybody has to work hard to hang in and communicate, as in all loving relationships. If this is the case, then is it possible that this apparent uptick in estrangement of children from good-enough parents is another product of disaster capitalism? I am heartbroken, and wondering if the ugly politics of the moment aren’t dividing children from well-intentioned parents in addition to the obvious more clearly political divides getting all of the attention and interpretation. —Heartbroken and Wondering Dear Heartbroken and Wondering, Advertisement Advertisement Advertisement Advertisement I have a few reactions to your letter, and they all revolve around one sentiment, which is: You don’t know the full story. And I think that’s what you need to work on accepting for yourself. Of course, given our current culture of pop therapy-speak, there is going to be some level of misappropriation, misuse, or misunderstanding of certain pathologies and traumas. But I’m not sure that your own experience with your daughter necessarily means that the overall upward trend in family estrangement is necessarily bunk or misguided. In my limited experience writing this advice column for the last two months, I can tell you that simply reading the daily submissions has shifted my perspective on how just many people seem to encounter abuse and neglect within their family unit, even as fully grown adults. It’s possible that estrangement has become more common due to the general increased social isolation we’re experiencing as a society, but it’s just as possible that many people are now finding the tools and vocabulary they need to separate themselves from harmful parents and siblings. I certainly don’t know everyone’s full story here, and neither do you. Advertisement Advertisement I can sympathize with how heartbroken you feel. It’s possible to have done everything correctly as a parent, but to still wind up in a messy (or severed) relationship with your children once they start growing up and making their own decisions. I certainly can’t provide any kind of medical opinion concerning your daughter’s surgery or the necessity of it, but if she’s resorting to such a serious measure, it’s clear that something is going on with her, and that she doesn’t feel well. You can understand then why it might be so hurtful and invalidating to feel like her parents don’t believe her (even if you were expressing these doubts with the best intentions). I don’t think you know the full story about what’s going on with your daughter. Of course it doesn’t make sense to you right now, because she’s only expressed a small fraction of what’s likely happening under the surface. Advertisement Take heart in the fact that estrangements can be temporary. You may need to give your daughter some space for now—it’s a good thing that your son is a small bridge to her life nonetheless, so at least you know the basic facts of her life. Once you are feeling ready to put your preconceptions and judgments aside and simply be supportive of your daughter, whatever the state of her well-being or the rationality of her decision-making, I think you could express these thoughts in an email or a letter to her. But other than that, there’s not much you can do but let the passage of time untangle some of the anguish that everyone here feels. It’s not necessarily a permanent state, but you do have to give up some control, and let your daughter find her own way. Advertisement Advertisement Advertisement Dear Prudence, I feel so middle school with this, but I just found out in a weird way that my friends are hanging out without me. For reference, we’re all in college but living at home and dealing with strict parents. “Andrew,” “Jan,” “Melissa,” and I have been very close friends for a long time. Andrew and Jan have been dating for a couple of years and have tended to be wrapped up in their own world of being a couple. Melissa and her boyfriend (who I’m also on friendly terms with), Jan, and Andrew are all having a party and sleepover at Andrew’s to celebrate his birthday. I was not invited, but worse, I found out when Jan texted me asking if she could tell her mom I would be there (her strict mom likes me and would approve if she knew I was at the party). So I got a text basically saying that all my best friends are hanging out, and asking if they can pretend I’m there so that Jan could go. Advertisement I said yes because I don’t think her mom should be restricting her adult daughter’s activities like that, but I feel really insulted. I’m not great at reading social cues and my friends usually help me, but when it’s their cues, I don’t know what to think! My only guess is that it’s meant to be a double date type event, but seeing as how I’ve been individually friends with all of them since long before they dated, I feel left out. I don’t know if I should ask Jan why I wasn’t invited, take a hint and just not bother them, or how I should read the situation at all! —21-Year-Old Middle Schooler Dear Middle Schooler, Advertisement Advertisement Since these are your close friends, first give them the benefit of the doubt. Let’s assume they thought you’d be uncomfortable about fifth-wheeling a double date, or that for some reason, you wouldn’t want to be there. So, the next time you’re in a group, I would calmly bring up the issue of the birthday, and say something like, “Hey, just so you guys know, I would really love to be invited to these kinds of things next time, especially if you’re celebrating an important occasion. It ki'''
