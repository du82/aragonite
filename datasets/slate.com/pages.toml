title = "Family advice: My brother got a windfall, and gave me some of it. Now his wife is saying I need to give it back."
description = "Do I really have to?"
full_description = '''Pay Dirt My Brother Got a Windfall, and Gave Me Some Of It. Now His Wife is Saying I Need to Give It Back. Do I really have to? Advice by Kristin Wong Feb 26, 20255:15 PM Photo illustration by slate. Photo by Liudmila Chernetska/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Pay Dirt is Slate’s money advice column. Have a question? Send it to Kristin and Ilyce here. (It’s anonymous!) Dear Pay Dirt, My brother settled a lawsuit, netting him around $300,000 in a lump sum plus additional monthly payments for life. Out of the blue, he gifted me $5,000 from his settlement. Subsequently, we had a falling out, leading me to not attend his daughter’s wedding. His wife then texted me that they would prefer that I return their gift. I would be more comfortable burning the money than returning it. I do not foresee a reconciliation with my brother. Is there a moral argument in favor of me returning the gift? —Hanging By Attached String Related From Slate Emily Yoffe Help! I’m Terrified That I’m Squandering My Good Looks on My Average, Middle Class Fiancé. Read More Dear Hanging, In my book, a gift is a gift. You can’t place strings like this on a gift. If the family is upset because you, I don’t know, sabotaged the wedding with a swarm of killer bees, that might be a different story. But assuming that’s not the case, keep the money. It’s unfortunate that the two of you have had a falling out. If you feel you’ve done something terribly wrong, giving him the money back might be a good faith gesture. But it’s unlikely that a few thousand dollars will stand in the way of the two of you ever speaking again, if there is any chance of that happening. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Send a firm but polite response to his wife with something like, “I hope we can put this all behind us someday, but this was a gift, and I intend to keep it.” If that feels uncomfortable or you’re worried about them pushing the issue, you could tell them the money has already been put to use, and leave it at that. Whatever you do, don’t burn that money. And, hopefully, you won’t burn a permanent bridge with your brother, either. Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Pay Dirt,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Pay Dirt following up) Submit Dear Pay Dirt, I think my friend is obsessed with shopping and I’m worried about her. But I’m not really sure it’s my place to tell her anything. For context, she is constantly telling our group of friends about things she’s buying online and sending video “hauls” in the group chat. It’s new clothes, makeup, shoes, bags, what have you practically every week! She loves finding a “good deal” and I’m sure that thrill is probably filling in for more fulfilling hobbies. But I’m genuinely worried about how much money she must be spending on these things! It’s not like she works a particularly lucrative job and the economy doesn’t feel too great at the moment to potentially be saddling yourself up with debt over seemingly frivolous purchases. But is this even my place? I don’t want to overstep. —Price Tag Dear Price Tag, Advertisement Advertisement Advertisement Advertisement You sound like a good friend, and money is such a fraught topic that I can totally understand your confusion over how to deal with this. On the other hand, how she spends her money is ultimately her own business, so you want to respect that, too. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Maybe the topic will come up organically. If she confides in you about racking up credit card debt, for example, or struggling to pay rent, you could use that as an opportunity to address your concern. Even then, tread carefully with a statement that expresses concern rather than judgement. For example you could try something like, “I know it’s not my business, but do you think you have a handle on your spending? Are you looking for ways to manage it?” Rather than judgement, show her support and ask her questions. Tell her you’d be happy to send her some financial resources that you’ve found helpful. But if she says she’s not looking for advice, take her “no” at face value. For a more creative solution, could you suggest some kind of money club with your friend group? You could start a money book club, for example, where you and your friends read a personal finance book (ahem) each month, and discuss it at length together. There are plenty to choose from, and you could also use this as a platform to talk through your various money goals and struggles. This might feel like an indirect workaround, but it could also be a more palatable way to get her interested in getting her finances in order. Plus, it’s genuine—if you’re worried about how your friend is handling money, it seems like you’d be interested in learning more about budgeting and saving yourself. Advertisement Advertisement However you choose to address this, the key is to not be judgemental about it. Bring it up from a place of concern rather than criticism. You don’t always need to hammer a point home for someone to take it—start with a gentle nudge and see how she responds. —Kristin Advertisement More Advice From Slate I had a beautiful wedding, only to find my no-good husband screwing his ex in our bed less than six months later. I was able to have the marriage annulled, but have had a hard time putting the shattered pieces of my life back together. One of my issues is my wedding dress. I can’t look at it without feeling like I wasted not only money, but time and any sense of trust in myself. A friend suggested that I artistically destroy the dress while she takes professional pictures. I can replace my lies of wedding photos with a cathartic photo shoot. The thought honestly made me smile. However, my father and stepmother bought the dress for me. Both are upset at the idea. Then my stepsister opened her big mouth and told me to give the dress to her. Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Personal Finance Slate Plus Advertisement'''
