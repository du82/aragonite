title = "Family advice: My mother has fooled my brother into believing she’s a loving, sweet grandmother. I know the truth."
description = "I’ve tried to tell them…"
full_description = '''Care and Feeding My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Gramma. I Know the Truth. I’ve tried to tell them… Advice by Nicole Chung Feb 27, 20252:15 PM Photo illustration by Slate. Photos by Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Care and Feeding is Slate’s parenting advice column. Have a question for Care and Feeding? Submit it here. Dear Care and Feeding, My mom is the perfect mother-in-law and grandma to my brother’s kids. She never offers them advice unless asked. She never interferes in their marriage. She always defers to their parenting and never criticizes their kids. She constantly makes an effort to be close with my sister-in-law. Unfortunately, my husband, kids, and I never get the benefit of this side of my mother. She is the exact opposite with us. I once asked her why she treats me so differently, and she said, “SIL controls my access to my son and grandchildren. I could lose them at any moment. I’d be devastated. You’re my daughter for life, so it’s different. I can talk to you however I want.” (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Three years ago, my husband got sick of my mother’s constant criticism of me and interference in our parenting, and how undermined us in front of the kids. He said he didn’t have an issue if I stayed in contact, so long as I never left her alone with the kids, but he was done. I tried for a while, but she started blaming my kids for things my brother’s kids did that she didn’t approve of. The final blow came when we hired a cleaning service and my mom chastised me for “such a waste of money.” When I told her that my brother and SIL also have a cleaning service, she said, “That’s different. They work hard. You’re lazy.” I blocked her. Advertisement Advertisement Advertisement Two years have passed, and I regret nothing, but it still hurts. My mom has the ability to be a good mom, MIL, and grandma, but she wouldn’t do it for my family. It’s so personal, and I doubt she’s “devastated.” My brother and SIL never acknowledged this dynamic because “that hasn’t been our experience with her,” so we don’t see them anymore, either. Nothing and no one can fill this mom-sized hole in my life. How do I get over this? —One Mom, Two Faces Dear One Mom, Two Faces, Advertisement One thing to consider is what you mean when you say you want to “get over this.” Do you mean you want to feel no pain over it? That might not be possible. It may always hurt; you may always feel sad or angry about this estrangement and the ways your mother tore you down for years. Knowing that you made the best possible decision for yourself doesn’t necessarily make it hurt any less. But there’s a difference between acknowledging how you feel and figuring out how to live with that pain, and focusing on how much you wish your mother were different—wondering why she’s like this; questioning whether there is something you could have done to change her or the situation; wishing it could be otherwise. If the latter sounds familiar to you—if you find yourself kind of circling and circling all the ways your mother could have chosen to be a better parent to you, arguing with her or your brother and sister-in-law in your head—of course that’s natural. But it could also make it even harder for you to accept the painful reality. If you’re focused on wishing your mom were different, you may not be allowing yourself to accept that (unfortunately) this is how she’s chosen to be. Advertisement Advertisement Advertisement There’s no securing an alternate reality in which your mom behaved differently, and no avoiding the pain and hurt she has caused you. You need to find ways to acknowledge it without torturing yourself over what you or she could have done differently. And to be clear, none of it is your fault—your mother made her choices. You don’t have to like or approve of them, but you do have to try to accept the fact that it’s beyond your power to change her. Of course there is no replacing your mother, but there are other people in your life who love and appreciate you. Acknowledge the pain you feel, and also remember that you can and have a right to put your energy into relationships that nurture rather than deplete you. Get parenting and family advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Care and Feeding,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Care and Feeding following up) Submit Dear Care and Feeding, I have an 11-year-old daughter, Kate, who is in the fifth grade. Kate has autism, ADHD, and the fine motor skills deficit that often accompanies them. Kate’s handwriting has always been difficult to read. The school occupational therapist says she passed a handwriting test and that she is not eligible for school OT services. Back in second grade, we spent a year getting outside OT support for handwriting, but Kate’s handwriting did not improve. Even though her IEP says she should have access to a keyboard, her teacher, Mrs. B, is stuck on the handwriting. Advertisement Advertisement Advertisement First, two months into the school year, we found out that Mrs. B had been making Kate rewrite things due to sloppy handwriting. We promptly reached out to discuss using a computer to comply with the IEP. Just this week, Mrs. B. disclosed that she is still having Kate write manually and that due to how sloppy it is, she no longer reads Kate’s writing! In the moment I froze and just said, “can’t she use the computer for this?” I am shocked and horrified by Mrs. B’s attitude toward teaching Kate. And I need to bring this back to Mrs. B and the school in a way that will not end up hurting my daughter in the classroom. It’s clear that Mrs. B is not overly fond of Kate, and I’m worried about retaliation. I don’t know what to do or say to the school to move forward with this. Please help! —Hands Off Dear Hands Off, Advertisement What on earth is this teacher’s problem? (Rhetorical. I have known teachers like Mrs. B.) I’m not saying it’s not worth working on handwriting and fine motor skills, all the more so for kids who really need to. But by the time they were 11, both my kids were—like all their peers—typing most of their assignments on a school-issued Chromebook anyway. This is such a simple accommodation, and it’s already in Kate’s IEP. Her teacher, as you know, is not unilaterally empowered to withhold it from her. Advertisement Advertisement Since you have already tried talking with Mrs. B 1:1, I think you can now try moving on to Kate’s case manager at school. It’s their responsibility to make sure she is getting all the supports and accommodations in her IEP. If for some reason they can’t get Mrs. B in line, call an IEP meeting with the full committee. It should really be enough for you to simply tell the case manager and the school that they’re not complying with your child’s IEP—also known as breaking the law!—but you can also tell the school that you’ll report them to the district for noncompliance if they don’t correct this. If you want and are able to bring an educational consultant or a lawyer to help make that argument for you, go for it, but I really don’t think you should have to over something this straightforward. (Other options for assistance/advice: your state/local disability rights organization, and/or your closest Parent Training and Information Center or Community Parent Resource Center.) Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I hear that you are concerned about retaliation or backlash against Kate. I don’t want to tell you that’s silly, because of course it isn’t. But Kate’s case manager probably isn’t brand-new to the IEP process, nor is the school ignorant of their disabled students’ rights. They should be able to recognize that it is illegal to deny a student the supports and accommodations in their IEP, and that retaliation against that student is going to make them look even worse.Furthermore, if they let their staff be so unprofessional as to punish every student whose parent spoke firmly in an IEP meeting or insisted on IEP compliance, that would be happening all the time—because just about every parent whose child has an IEP will have to suit up and go toe to toe with a school at some point. Advertisement Advertisement Advertisement Advertisement If you do ever have reason to believe Mrs. B is retaliating against Kate, all because you spoke up for Kate’s educational rights, that’s another awkward but necessary conversation with the case manager and the school team. But I really hope it won’t come to that, because this isn’t personal—you aren’t starting a blood feud with the school; you are just asking them to provide the support your child is legally entitled to. And I suspect they will instruct Mrs. B to follow the damn law, because again this is a very easy accommodation on their end and schools really hate the thought of being sued. Start with the case manager and insist on Kate’s access to a laptop and the school’s compliance with her IEP. If you think it’s warranted, you can also think about pushing for in-school OT services again—it sounds like Mrs. B might have unwittingly helped you make the case for that. —Nicole More Advice From Slate My husband and I have always been pretty eco-friendly. We recycle, compost, bike instead of drive when we can, and a long list of other things. We had a small drought last year and tried to water our lawn much less than normal. Our neighbors, however, didn’t and that made me pretty mad. It infuriated my husband. Over the course of the past year, he has been working to redo our yard to incorporate many more flowers, plants, and native grasses that require little watering. Our yard has turned out great. My husband has taken this to mean that he should offer up his new found “services” to the neighbors. He literally wants to knock on their doors and say he can help people redo their lawns. Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Family Parenting Advertisement'''
