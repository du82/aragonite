title = "Infertility advice: My sister has had a difficult time having a baby. But what she just demanded left me stunned."
description = "I’m know she’s hurting, but this is beyond the pale."
full_description = "Care and Feeding My Sister Has Had a Difficult Time Having a Baby. But What She Just Demanded Left Me Stunned. I’m know she’s hurting, but this is beyond the pale. Advice by Nicole Chung Feb 27, 20253:30 PM Photo illustration by Slate. Photo by AntonioGuillem/iStock/Getty Images Plus. Tweet Share Share Comment Slate Plus members get more Care and Feeding every week. Have a question about kids, parenting, or family life? Submit it here! Dear Care and Feeding, My older sister “Anita” and her husband have been trying to have kids for the last four years, but unfortunately, each of the five pregnancies they achieved ended in miscarriage. Last week when my younger sister “Jada” and I went out to lunch with her, she made a stunning request. She asked us to promise her that neither of us would have a baby before she does. I got married last year; Jada has been with her boyfriend for the past two years. While I’m not in a hurry to have a baby in the immediate future, and it’s not even on the radar for Jada (as far as I know), I was very much taken aback, and so was she. We expressed our sympathy to Anita for what she has been going through, but we both said that this was not a reasonable ask and refused. Anita’s response was to break down crying and accuse us of being uncaring and cruel before she stormed out. Calls, texts, and emails to her have gone unanswered. Our mother suggested telling Anita that we will go along with what she wants “to keep the peace,” and if either of us ends up having a child before she does, to cross that bridge when or if we come to it. I’m not willing to do that. Having kids may not be on the horizon for me right now, but I do want a family eventually. Given her history, it’s not unrealistic to assume it may take Anita years to have a child—if she can even have one at all—and I won’t let her or anyone else dictate when I have kids. At the same time, I’m dreading her reaction if I or my younger sister has a child before she does. Jada feels the same way. I understand the last four years have been an emotional rollercoaster for Anita, and I want to be supportive, but she is being completely irrational and unreasonable. How are we supposed to walk this tightrope? —No False Promises Dear No False Promises, Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. I think you’re already doing it: You acknowledged Anita’s pain and grief while also asserting the fact that your reproductive choices are your own. If your sister were in a better place, I’m sure she’d realize that her demand was completely unfair. I can almost see why she’s desperately seeking to control something, when what she wants so much is beyond her control. It speaks to just how much pain she’s in, and I truly hope she seeks the help and support she needs. But she has no right to ask this of you or Jada, or your partners. I don’t agree with your mother’s suggestion to let Anita believe you will go along with her. Even if it brought her some small relief in the short term, it wouldn’t do a thing to help her in the long term, and it is also deeply dishonest. You shouldn’t make a promise you don’t really intend to keep. Think about how hurt and furious your sister would be if one or both of you broke your “promise” and got pregnant before her. There’s no way for you or Jada to spare Anita the pain or disappointment or grief she’s experiencing. All you can do is let her know that you love her and you are here for her. You’ll support her in any way you can, but that doesn’t include letting her decide if or when you become parents yourselves. —Nicole More Advice From Slate My mother has always had an unreasonable dislike for excess weight. She hardly eats and harangues her daughters and daughters-in-law each time they have a baby to lose the weight immediately. Three years ago, my eldest son brought home his bride-to-be, a sweet, lovely, voluptuous girl. My wife and I loved her instantly, but we worried about my mother’s reaction. Sure enough, she made some comments, to which my son calmly replied that if she was not polite to his beloved, she would not be invited to the wedding. My mother was furious, and my son ended up having a destination wedding to avoid the drama. Though we see my son and DIL regularly, he has not spoken to his grandmother since… Tweet Share Share Comment Advice Family Parenting Slate Plus"
