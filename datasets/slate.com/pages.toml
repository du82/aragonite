full_description = '''Supercommunicators with Charles Duhigg March 01, 20253:00 PM How to Communicate Without Words What we can learn about nonverbal cues from The Big Bang Theory. Tweet Share Share <div class="slate-megaphone__slot"></div> View Transcript Advertisement Listen & Subscribe Choose your preferred player: Apple Podcasts Spotify Amazon Music Pocket Casts For questions about subscriptions or your Slate Plus feed, check our FAQ. <p class="slate-notification--error podcast-how-to-listen__notification">Please enable javascript to get your Slate Plus feeds.</p> All Slate Plus Podcasts Get Your Slate Plus Podcast If you can't access your feeds, please contact customer support. Thanks! Check your phone for a link to finish setting up your feed. Please enter a 10-digit phone number. Listen on your phone:RECOMMENDED Enter your phone number and we'll text you a link to set up the podcast in your app: Text me the link! We'll only text you about setting up this podcast, no spam. Listen on your computer: Apple Podcasts will only work on MacOS operating systems since Catalina. We do not support Android apps on desktop at this time. Listen on your device:RECOMMENDED These links will only work if you're on the device you listen to podcasts on. Set up manually: How does this work? copy copied! We are showing you options for a computer but if you're on a phone or tablet We are showing you options for a phone or a tablet but if you're on a computer, click here. If you still have questions about subscriptions or your Slate Plus Feed, check our FAQ. Loading... We're sorry, but something went wrong while fetching your podcast feeds. Please contact us at plus@slate.com for help. Episode Notes Why is it that we can tell someone “I’m totally fine!” and they instantly know we’re not? Gestures, facial expressions, tone of voice, and other subtle nonverbal cues play a huge role in how we connect with one another. In this episode, host Charles Duhigg explores how we communicate without words, including a deep dive into the visual and tonal cues embedded in one of the biggest sitcoms of all time, The Big Bang Theory. He talks with Dr. Dustin York, a professor at Maryville University who studies nonverbal communication and worked in public relations for Barack Obama’s 2008 presidential campaign. He also sits down with Dave Goetsch, a co-executive producer and longtime writer for The Big Bang Theory, and journalist Jessica Radloff, who wrote an exhaustive book about the show. This Slate miniseries dives into the art and science of meaningful conversations, inspired byDuhigg’s bestselling book, Supercommunicators. Supercommunicators was produced by Sophie Summergrad and Derek John, who also did the sound design. Our technical director is Merritt Jacob and our supervising producer is Joel Meyer. Tweet Share Share Advertisement About the Show Why are some people able to talk with just about anyone—about almost anything? In this Slate miniseries, Charles Duhigg dives into conversations sparked by his acclaimed book Supercommunicators. With psychologists, social scientists, and even a Hollywood writer, he explores how to ask the right questions, communicate without words, and find meaningful connection in our lives. All episodes Host Charles Duhigg is a Pulitzer Prize–winning journalist and host emeritus of How To! He is also the author of bestsellers The Power of Habit and Smarter Faster Better, and writes for the New Yorker, the New York Times Magazine, and other publications.'''
