full_description = '''Dear Prudence Need Advice? Ask Prudie. June 02, 202110:58 AM Tweet Share Share Tweet Share Share Need help getting along with partners, relatives, co-workers, and people in general? Dear Prudence is Slate’s advice column, a fount of wisdom on manners, morals, and more since 1997. Submit your questions here. Jene´e Desmond-Harris is Slate’s fifth Dear Prudence columnist. She was previously an opinion editor at the New York Times, where she continues to write on race, politics, and the law. Jenée has also worked for such publications as Vox and the Root, where she’s been a writer, features editor, and advice columnist. The main column is published on Thursdays. Get Dear Prudence in Your Inbox Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Advice Dear Prudence Advertisement'''
