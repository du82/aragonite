["https://slate.com/culture/2025/02/merle-oberon-oscars-academy-awards-best-actress-indian-asian.html"]
title = "Oscars: Merle Oberon was the first Academy Award–nominated Asian actress. Few knew it at the time."
description = "History has effectively erased the achievements of Golden Age icon Merle Oberon."
full_description = 'Wide Angle Merle Oberon Was Hollywood’s First South Asian Star. It Came at a Cost. The first performer of color nominated for an Academy Award spent her life publicly passing as white. By Mayukh Sen Feb 26, 202511:00 AM Photo illustration by Slate. Photo by Ullstein Bild via Getty Images. Tweet Share Share Comment Tweet Share Share Comment This is excerpted from the book Love, Queenie: Merle Oberon, Hollywood’s First South Asian Star, by Mayukh Sen. Copyright © 2025 by the author and reprinted with permission of the publisher, W. W. Norton & Company, Inc. At the start of 1935, a year before she would become the first performer of color and Asian actress to be nominated for an Academy Award, Merle Oberon feared her Hollywood career was over. It had barely begun just a few months before, when she had arrived in America via England. The passenger records from her voyage across the Atlantic the previous November stated the facts clearly: She was 23, unwed, and born in the city then known as Bombay, India. She had already established herself as an actress of repute back in England under the aegis of Alexander Korda, head of the influential London Films. After signing a contract with the production company in 1932, she became its resident so-called exotic, playing foreign creatures conceived as stereotypes: Think castanet-clicking Spaniards and mysterious French noblewomen. Whenever questions arose about why her tan never seemed to fade, she parroted the cover story that the company invented for her: that she was born to well-heeled white parents on the Australian island of Tasmania. The suits at London Films, believing she was light-skinned enough to pass for white, willfully erased the fact that her mother was South Asian, and that Merle had grown up in poverty in what was then Calcutta. Back in Merle’s birth country, her tormentors had taunted her about her “chee-chee” accent, pejorative for Anglo-Indians, the subordinate racial category to which Merle belonged by dint of her mixed South Asian and white heritage. Her handlers banked on no one challenging the new biography they fabricated for her, and the British public took Merle at her word. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); But she didn’t have any such protections in America, where she was more or less alone for the first few months. Hollywood’s gossip columnists were far more vicious than those in England; upon her arrival, they began to print speculations that her mother was a “Hindu.” Hindu was a byword in the American vernacular for any South Asian, regardless of religious creed; it was also a distinct, government-sanctioned racial category as of the 1930 census. This was a time when the fear of the Hindu—sometimes spelled as “Hindoo”—ran riot in America. Earlier in the 20th century, anxieties about the “dusky peril” posed by South Asian immigrants threatening the sanctity of white labor gripped the American psyche, feeding a climate of bigotry that held steady in the years that followed. The Immigration Act of 1917 kept immigrants from South Asia (along with other parts of Asia belonging to what lawmakers termed a “Barred Zone”) from coming to America at all. Six years after the passage of that law, the Supreme Court ruled that any South Asian immigrants already residing in America’s borders would be ineligible for naturalization henceforward; the government also revoked the citizenship status of South Asians who had already become citizens, rendering them stateless. By the time Merle arrived in the States, Americans were content to imagine South Asians as turbaned mystics or uncivilized primitives. Yet, simmering beneath these romantic stereotypes was a xenophobic belief that they were fundamentally unassimilable. Advertisement Advertisement Advertisement Advertisement Making matters more dire, Merle also just happened to arrive in Hollywood the same year that the industry began rigid enforcement of the Production Code—colloquially called the Hays Code—a set of conservative axioms meant to tame an industry that political bluenosers saw as a playground for sin. The rulebook curbed the on-screen depiction of such perceived moral indignities as miscegenation—defined within the text of the Code as being between Black and white races, but interpreted broadly enough to apply to non-Black performers of color more generally. Had audiences known Merle was anything other than white, she would have been exiled to a career of playing temptresses and domestics, a supporting actress on a film’s narrative margins. So Merle moved surreptitiously in those first few months in Hollywood. She put herself through the miserable rigors of starring in an American musical, Folies Bergère de Paris, in which she’d play a French baroness. But the film’s makeup artists accentuated her amygdaloid eyes and taffy-pulled her hair to elongate her scalp. This ignited the abject disappointment, even disgust, of critics. “Miss Oberon, through most of her sequences, looks precisely like a Malaysian, which is just too bad,” the Washington Post moaned upon the film’s release in early 1935. Her appearance inspired further doubts about her purported white heritage. Hollywood’s homegrown sorority of actresses, all of them white, harbored mistrust about whether this brown vamp was really from Australia. As a result, Merle had little social life. Parties, when she managed to score invites to them, were dances of humiliation. She spent all of Christmas crying, thrown back into the seclusion of a childhood in India feeling unwanted because she thought no one wanted to be friends with a mixed-race girl. <img class="lazyloaded" loading="lazy" src="https://compote.slate.com/images/1a9ac1d3-e9e6-4d7d-9703-af2e3cba4a70.png?crop&#x3D;694%2C1040%2Cx433%2Cy0" alt="Book cover for Mayukh Sen&#x27;s Love Queenie: Merle Oberon, Hollywood&#x27;s First South Asian Star." width="694" height="1040" /> Love, Queenie: Merle Oberon, Hollywood’s First South Asian Star By Mayukh Sen. W. W. Norton & Company, Inc. $27.89 from Bookshop $19.99 from Amazon Slate receives a commission when you purchase items using the links on this page. Thank you for your support. Advertisement Advertisement Advertisement She was all but ready to leave town when she heard that the powerful producer Samuel Goldwyn was looking to cast the lead role in a remake of a 1925 film called The Dark Angel, a love triangle set in England during World War I. Merle knew that the principal role in that film, for an ivory-skinned and virginal English beauty named Kitty Vane, could, if she played her cards shrewdly, give her the chance to expunge the stain of Folies Bergère de Paris from public memory and thus revise her screen persona. A scrapper from her youth, Merle channeled her desperation into action. Goldwyn had a pineapple-blonde actress in mind for the part, Madeleine Carroll. Merle had known Carroll, the star of a 1931 British film, Fascination, in which Merle had a thankless one-scene role as a flower seller of dubious racial origin (“What an exotic-looking creature! Are you Egyptian?” one character chirped upon seeing her). So Merle’s crusade for Kitty Vane went into overdrive. She started to tell Goldwyn that watching the 1925 version of The Dark Angel as a girl in Calcutta had been one of her most formative moviegoing experiences, even saying it had been the first movie she ever saw. Others involved in production weren’t convinced of her fitness for the role: The attached director, Sidney Franklin, said she was “too Oriental.” United Artists officials said she was only fit to play a Hindu. But Merle doubled down on her efforts. “I would die if Carroll got part,” she cabled to Korda, her boss in England, in March 1935. Advertisement Advertisement Advertisement Goldwyn, an immigrant from Poland, was a parvenu to Hollywood like Merle. He was so charmed by her persistence that he didn’t listen to the naysayers when he rubber-stamped her as Kitty Vane that spring. Goldwyn believed so firmly in Merle’s potential that he even eked out a deal to share her with Korda in England, an arrangement that would have her straddling the cinemas of two countries, unusual for a star of that era. Goldwyn signed Merle with the full knowledge that she was South Asian. Should anyone threaten to reveal that secret, he was ready to muzzle them by paying them off. Advertisement Merle thus began to calcimine herself: Off came the greasepaint from her previous roles, the loud strokes of mascara that had been hiding her grape-green eyes. Though The Dark Angel would be made in black and white—which could cloak her from scrutiny about her heritage, and aid her in passing—Merle made the mistake of suntanning on the California beaches too much while shooting, buttering her brown skin. She could not fight what was in her blood. The studio made her go to a beauty salon and undergo skin-bleaching treatment for an entire day so that her complexion would lighten enough for the cameras. This was a painful trade-off, part of a punishing artistic process for a role that had the potential to make her a Hollywood star. But Merle’s command of her craft became so assiduous that she even trained herself to cry at will. Goldwyn’s magical promise to give Merle a goody-two-shoes makeover sparked press interest in the project, and she now had a firm answer for journalists who confronted her about being “Eurasian,” as they called it back then: “I detest ‘exotic’ women! They represent everything I’d hate to be and that I’m scared to death of becoming,” she told the Los Angeles Times that September. The efforts paid off: Critics were taken with Merle’s about-face when reviews started hitting papers that month. She had transformed herself from a coppery foreigner to the embodiment of Hays-era purity. And she could act. “Miss Oberon, abandoning the Javanese slant of the eyes for the occasion, plays with skill and feeling,” raved the New York Times critic Andre Sennwald. Advertisement Advertisement So praised was Merle’s performance that it would bring her to the pomp and glitter of the Biltmore Hotel on the night of March 5, 1936, for the eighth annual Academy Awards—a ceremony that had gained a new nickname that year, the Oscars—as a nominee for the Academy Award for Best Actress. Merle was far unlike her fellow nominees in terms of pedigree; two of the frontrunners, Bette Davis and Katharine Hepburn, were already proven quantities in Hollywood, and Hepburn already had gained an Oscar. Merle was quite young, too, having turned 25 just weeks before the ceremony. She was also South Asian, though most in the public—aside from those few who had their suspicions—saw Merle only as white. Prior to that point, the acting categories of the Academy Awards had been occupied exclusively by white performers. No performer of color had received such recognition before, certainly no Asian woman like herself. That night, she tangled her arms in those of Clark Gable, the suave star whom she was seeing casually, as they arrived to the applause of fans who’d swarmed outside the hotel. Her diaphanous gown fluttered around her 5-foot-2 frame, with a spindly band of pearls dangling from her neck. They sat next to Goldwyn and his wife, Frances, at a round table. The category in which she was nominated would be announced last. Advertisement Advertisement Advertisement Advertisement It was long past midnight when Merle heard the winner’s name: Bette Davis. Merle let the disappointment run through her as she lost her first, and final, Oscar nomination. So few people in that room knew the symbolic significance that her mere presence as a nominee would come to have in subsequent years. Within the Best Actress category, that pattern of nominating only white actresses would continue for nearly two more decades, Merle being the sole disruption until 1955. After her, it would take 87 years for another Asian woman—per the Census definition of the term, referring to those of East, Southeast, or South Asian descent—to receive a nomination, and eventually win, for Best Actress. Merle surely hadn’t dreamed that she would write herself into history that night, or that others would later try to erase what she had achieved. But the fact that Merle Oberon was Asian at all was a secret she guarded with her life. This was less a choice than a necessity, and it came at great psychic cost to her. When the klieg lights dimmed after a day’s work, her public performance ended, and the truth was hers to live with, alone. Advertisement She was unlike any star I’d ever seen. It wasn’t only her look, resembling no Crawford, Davis, or Garbo I recognized from that era: the inkjet hair, the charmingly crooked snaggletooth that would jut out whenever she smiled, the bronze skin that reminded me of my own. It was her voice. She spoke clipped and practiced English that, on occasion, would slip, revealing a hint of the city that had made her. I knew that accent well: It was the same I’d heard among my father’s Bengali family from Kolkata, the city where she’d grown up. This connection made my response to her feel more real, more true, than any I’d felt toward other performers from that period. Advertisement I was a teenager when I first came across Merle Oberon as Cathy in William Wyler’s Wuthering Heights (1939), the film for which she is arguably most remembered today. It was around 2009 or so, and I was a senior in high school in suburban New Jersey. By that point, she had been dead for three decades, but I felt bound to her by city and skin. I knew the broad contours of her biography: that she had been born into poverty as a mixed-race, Anglo-Indian girl in British India in the early 20th century. That, upon immigrating to London as a teenager, she ditched the name Queenie Thompson and within a matter of years reinvented herself as Merle Oberon, becoming a star of Anglo-American cinema under that name. That she concealed her maternal South Asian lineage and passed for white because the prejudices of the era demanded she do so, maintaining until her 1979 death the studio-constructed fiction that she’d been born to European parents in Tasmania. Advertisement Advertisement Advertisement As a teenager, I had enormous empathy for Merle Oberon’s struggle. Most gay boys I knew tended to fawn over other divas of the era, but my chosen idol was Merle: I understood, as a teen who was still coming to terms with his sexuality, what it meant to hide a part of yourself for your safety, to secure a life where you might want to make your dreams possible. Her ascent was also meaningful to me as a South Asian, for Merle found purchase in a world where our likes were rarely acknowledged. That alone made her so much more than her tragedy. I knew, even then, that projecting a per'
