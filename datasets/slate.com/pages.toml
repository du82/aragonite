title = "Dear Prudence: I moved home to rebuild my life. My family has other plans for me."
description = "I’m not just here “doing nothing.”"
full_description = "Dear Prudence Help! I Moved Home to Rebuild My Life. My Family Has Other Plans for Me. I’m not just here “doing nothing.” Advice by Jenée Desmond-Harris Nov 01, 20232:00 PM Photo illustration by Slate. Photo by nicoletaionescu/Getty Images Plus. Tweet Share Share Comment Every week, Dear Prudence answers additional questions from readers, just for Slate Plus members. Submit questions here. (It’s anonymous!) Dear Prudence, After a traumatic brush with death, I decided to take a long overdue look at my life. I quit my high-stress job and went to connect back to my roots. I moved home, have started seeing a counselor, and took up volunteering. My finances are large and stable. I have passive income from renting out my old home and living with my parents. Only my siblings seem to assume I only exist now to be the personal chauffeur for their children. I am doing “nothing,” so I can take my nephew to soccer, my niece to dance, and do all the school drop-off and pick-ups at the drop of a hat. Neither of my parents can drive well but get stressed if I refuse, and then tell my siblings they will do it instead. So I get guilted into going. My siblings know exactly what they are doing. They never asked our parents for all these rides until I moved in. I am trying to rebuild my life here, and my siblings are just trying to get something out of it. It is straining my relationships with my entire family. I feel I am talking to brick walls. —Where Is My Village Dear Village, Recently in Dear Prudence This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. Podcast Episode My Mom is Self-Centered. Am I, Too? Help! Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. This Content is Available for Slate Plus members only Help! My Parents Cut Their Trip Suddenly Short. That’s When I Found Out What They Really Think of My Husband. Since money isn’t an issue for you, one option would be to pay for a couple of hours a day of a local high school or college student’s time, and set a regular schedule for them to ferry the kids to and from activities. Of course, that’s above and beyond what anyone could reasonably expect of you, so if it doesn’t feel like a good solution, don’t do it. The next possibility is to simply say “No, I’m not available.” If you choose to give detail, you can explain your volunteering and therapy schedule. It will be difficult to deal with the feelings that follow—namely, your stress about your siblings’ negative reactions, and your concerns about your nieces and nephew’s safety in the car with your parents. I understand that won’t be easy. But look at it this way: You’re either going to be stressed while focusing on rebuilding your life in the way you planned (and setting the expectation for how you expect you to be treated) or stressed while doing what everyone else wants you to do. I’d choose the former. More Advice From Slate My husband is a man of excellent character. We don’t keep secrets from each other; we even share our passwords. We’ve been together four years and married for one. A month ago, my best friend, who is quite large-chested, stayed the night at our house. The three of us had quite a bit to drink. In the morning my husband sat me and my friend down and made a confession. He said he had put his phone in her bedroom hoping to make a video of her getting undressed, but he forgot to hit the record button. He said he was telling us because he felt so guilty and that he was sorry that what he intended to do was so super creepy. Tweet Share Share Comment Advice Dear Prudence Prudie Bonus Question Slate Plus"
