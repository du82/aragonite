["https://slate.com/human-interest/2023/01/dear-prudence-secret-second-family.html"]
title = "Dear Prudence: My dead husband had a secret second family."
description = "What do I do now?"
full_description = '''Dear Prudence Help! I Just Discovered My Dead Husband Had a Secret Second Family. What do I do now? Advice by Jenée Desmond-Harris Jan 12, 20235:58 AM Photo illustration by Slate. Photos by Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Submit questions here. Dear Prudence, My husband and I were married seven years before he unexpectedly died. He was from overseas and told me he didn’t have much in the way of family since his parents died. He lied. Months after the funeral, I finally mustered up enough courage to go through his old boxes. In a box of books, I found photos, letters, and documents. My husband had been married and then divorced in his home country. Worse, there were pictures of him with his five children. The man that I loved, that was trying to build a family with, left his five young kids behind without a look back. He never breathed a word about them to me. He certainly never financially supported them. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); The entire foundations of my world have been shaken. I haven’t told anyone yet. I don’t know how—not without answers. Is it wrong to go looking for his family? The oldest two children should be adults, and I have names and locations from some of the documents. I tell myself I could offer financial assistance, but I wonder if I am being selfish here. Please advise. — Questions Dear Questions, Put his family on the back burner for a second here. What about YOU? This is really difficult news to absorb. It throws into question everything you knew about the man you loved and the relationship you had, and you’ll never be able to confront him about it or get closure. That’s a lot! So, before you decide what to do with respect to his kids, take some time to simply sit with what you’ve learned (in a therapist’s office if at all possible). And please, tell a friend or two.You don’t need to have all the details before you open up to someone you trust about this earth-shattering revelation and the effect it’s having on you. Remember that you didn’t do anything wrong and you don’t have anything to be ashamed about. Don’t keep this secret. Advertisement Advertisement Advertisement Advertisement On to the children: You’re not obligated to do anything (again, you did nothing wrong), but I can see how you could be thinking “I had their father for seven years and they didn’t. I owe them.” Or maybe you just feel for these kids who grew up without a dad. You said you can offer financial assistance, so it sounds like you have enough money that you could easily part with some. If that is true— and, after taking the time to process this yourself, you still want to help them out—hire a private investigator to identify them and figure out a way to get them the cash anonymously. Do not, I repeat, do not, reach out and tell them about the life their father was living while ignoring them. I can’t imagine how this would be anything other than hurtful, and it may open you up to unpredictable entanglements that you don’t need right now. New Year, Same Problems For an upcoming special edition of Dear Prudence, we want to hear about the messy situations plaguing you that you’d like to shed in the new year. A mother-in-law who is slowly poisoning you? An underground diaper operation that’s driving you mad? A poorly named horse? Submit your questions anonymously here. (Questions may be edited for publication.) Advertisement Dear Prudence, My boyfriend, Alec, has friends who are big moochers. He made a few of these pals through work, and he has even invited them to his family’s vacation home. But since then, they’ve gotten very comfortable asking him to use the house for themselves. They’re not gracious about staying there, either: One of their girlfriends blatantly told Alec that they were only friends with him for the beach house! Another threw a party and left the place a mess. Advertisement I grew up in a working-class family of six, and I cannot imagine treating a friend like this. I told Alec that I find these people rude and entitled. The last straw, for me, was when we went on a group outing together. His friends ordered extras and only paid small fractions of the bill, walking out and leaving Alec and I with a tab of almost $300. (Two of them ignored my Venmo requests.) I have no desire to hang out with them again, but Alec is torn, and after all, they are his “friends.” How should we handle this? — Who Raised These People? Dear These People, This sounds really bad, and I wish Alec had better friends. The part of it that is your business is the part that involves getting stuck with a tab when the moochers walk out—who does that? Do not put yourself in a group dining situation with them again. Advertisement Advertisement Advertisement The part that is Alec’s business and nor yours is that part that involves people who told him they were using him. The phrase “sorry that won’t be possible this time” is available to him any time he wants to say no to a request to use the beach house. I don’t know what’s stopping him from using it—and the fact that he won’t stand up for himself here is something you should make a small note of as you decide whether to make your relationship with him any more serious than it is —but it’s not up to you. Get Dear Prudence in Your Inbox Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Dear Prudence, I am an elementary school teacher. I recently became aware that a mother and a father of two of my students are dating. A colleague is Facebook friends with the mother, Carrie, through a non-school-related connection, and pieced together that Carrie is in a newly (?) open marriage and dating the father, Tom, who is divorced. Their children, my students, are best friends, which is great in terms of their current situation, because they are all spending a lot of time together (sometimes with Carrie’s husband, sometimes not). What two consenting adults do in their personal lives is none of my business, and I’m not entirely sure what my students’ understanding of the situation is, but I imagine they know their parents are “special friends.” My concern is that this relationship will run its course and that my students will be forced to sever a close friendship due to the interpersonal politics of their parents. True, maybe they’ll make it as a throuple or whatever this is for years to come, but all adults involved seem somewhat volatile, so my hunch is that this will end, and likely not on good terms. Advertisement Advertisement Advertisement If things do get weird or bad, is there anything I can do to support my students (if they are still in my care at the time)? Or if their classmates find out that their parents are dating but Carrie still has a husband, which even for our fairly liberal area is a little out-there for young kids to rationalize? Normally, as long as children are safe and taken care of (which these students definitely are), I don’t pay any mind to home life quirks, but this situation feels like it has the potential to bleed into the classroom in a negative way. — Want to Mind My Business Dear Mind My Business, It’s sweet that you care about these kids so much. A teacher who is spending their free time trying to mind their business but worrying about how to soften the potential emotional blows in students’ futures is honestly what every child deserves. They’re lucky to have you. If things do get hard for them at some point, because of a parent breakup, or gossip, or teasing, or whatever, the best thing someone in your role can be is a trusted adult to talk to who is consistent and listens to them. Maybe you can set the stage for that now, and I actually have a practical idea about how to do so. Stop me if I’m just putting more work on your plate, or if this is impossible in the age of teaching to the standardized test. But when I was in third grade, each student had a little journal that we would write in (my entries were 100 percent about my pet rat, Peanut, and gymnastics class), and we would hand them to our teacher, Ms. Uyeda, and she would respond to what we said and ask us questions. It was a delight and it felt so special and validating to hear directly from a teacher. Could you start a practice like that—even if you only write back a couple of times a month? If you feel these kids are struggling, you could use your entries to affirm and encourage them. You can’t control what happens in their lives— which, again, I can only imagine is incredibly tough for you—but you can be one more person in their world who loves and cares about them and explicitly lets them know. Advertisement Advertisement Advertisement Advertisement How to Get Advice From Prudie Submit your questions anonymously here. (Questions may be edited for publication.) Join the live chat every Monday at noon (and submit your comments) here. Dear Prudence, Our 30-year-old son met a 25-year-old Russian woman via Instagram. Their only in-person interactions have been vacations in Serbia, Mexico, Istanbul, and London, for which he has paid. We met her in person at Christmas in London with our other two sons, daughter-in-law, and grandchild. She showed no interest in spending time with us. How best do we discuss our concerns with our son? — From Russia With Issues Dear From Russia With Issues, You don’t. It’s not that your concerns (which you haven’t really laid out explicitly, but which I assume are “she’s using him for his money and potentially citizenship”) are totally invalid. There’s just no world in which a man who is having a passionate international love affair with a beautiful woman is going to stop because his parents took him aside and mentioned that, from their perspective, the vibes are off. This might be an authentic relationship between two people from different continents, one of whom has more money and picks up the vacation tab.And it might be a 90 Day Fiancé-style disaster. Either way, I don’t see you having the power to change its course. Your ability to keep your son from dating people you don’t approve of ended when he was about 15, probably closer to 12. Which is hard, because your love and concern for him didn’t end then—I get it. Advertisement Advertisement So what you can do is to channel that love into simply being there for him; don’t attempt to guide his choices but just exist as a loving figure in his life. You can do that now, by being happy for him that he’s happy in his new relationship and remembering that it’s not her job to be interested in spending time with her boyfriend’s parents. And you can plan to continue to be there for him if (when?) the shit hits the fan, and he’s left broke and heartbroken. And hey, stay positive, the worst might never hit—they’ve met in person, so at least we know she’s not a catfish! Advertisement Dear Prudence Uncensored “You can’t talk anyone out of believing they’re in love.” Jenée Desmond-Harris and friends discuss a letter in this week’s Dear Prudence Uncensored—only for Slate Plus members. Dear Prudence, “Cheryl” and I are both writers who connected through the internet. We’ve never met in real life, but we have common interests and enjoy each other’s writing. However, recently, she sent me a piece that had some pretty major issues that I considered uncharacteristic of her. I sent her a long list of grievances I had with the piece, and perhaps I was a little less tactful than I could have been. She neither accepted the critique happily nor negatively, but merely sent me a curt note back acknowledging receipt. I feel incredibly awkward now. It would almost be preferable if she had called me a bitch and told me to go screw myself. I didn’t respond, as I’m completely caught off guard and have no idea how to move forward. Do I ask if everything’s OK? Change the subject and talk about something else entirely? Say nothing and wait for her to email me again? Help! — Kill Your Darlings Dear Kill Your Darlings, Advertisement Advertisement Advertisement Grievances?? You feel awkward … now? You didn’t feel awkward when you were typing up that email full of feedback that, at least as you frame it in your letter, she did not give a single indication she wanted from you? Come on! If I’m reading you correctly that feedback like this hasn’t been a norm in your correspondence, it sounds like she was kinder to you than you deserved. Also, you are killing me. None of the options you suggest include saying you’re sorry! How do you even function in the world dealing with people like this? Anyway, okay, I’m supposed to be giving you advice, not yelling at you. You should reach out and say this: Advertisement “I owe you an apology. I’m realizing I gave you feedback that you didn’t ask for, and it was probably insulting. I wouldn’t have wanted someone to treat me that way and honestly, I don’t even know why my critique would matter to you. I’m embarrassed and I don’t know why I did it. I would love to move forward and continue our friendship—with a commitment to be more thoughtful and sensitive, and less arrogant which I really need to work on—if you can accept my apology, but I will leave you alone if I don’t hear back from you.” Advertisement And then you really need to work on those things. Like, seriously. Or you’ll just find yourself in this kind of situation again, wondering why someone hasn’t responded well to your being a complete jerk to them. Give Prudie a Hand in “We’re Prudence” Sometimes even Prudence needs a little help. This week’s tricky situation is below. Join the conversation about it on Twitter with Jenée @jdesmondharris, and then look back for the final answer here on Friday. Dear Prudence I, my husband, and my childhood friend “Mia” are all in our early forties. Mia lives with and supports her niece “Hope,” who is in her mid-twenties. Hope has an IQ just slightly too high to qualify for disability, but for various reasons is unable to live independently. Hope was mostly raised by Mia’s parents (her grandparents), who are now dead. Her mother, Mia’s sister and only sibling, is also dead and her father’s whereabouts are unknown. Their family tends to have very poor health, and Mia already has the health and mobility of an elderly person. She’s worried what will happen to Hope when she dies, si'''
