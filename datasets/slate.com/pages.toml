["https://slate.com/advice/2025/02/divorce-big-feelings-care-and-feeding.html"]
title = "Divorce and kids advice: My 8-year-old is taking out her feelings about my divorce in a very upsetting way."
description = "I know she’s angry, but this is getting out of hand."
full_description = '''Care and Feeding My 8-Year-Old Is Taking Out Her Feelings About My Divorce in a Very Upsetting Way I know she’s angry, but this is getting out of hand. Advice by Jamilah Lemieux Feb 28, 202512:15 PM Photo illustration by Slate. Photo by Dima Berlin/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Slate Plus members get more Care and Feeding every week. Have a question about kids, parenting, or family life? Submit it here! Dear Care and Feeding, I am seven months through a divorce process (my state requires separation for a year) where we have 50/50 custody. However, my soon-to-be-ex went out to another state a month ago to help his father through an illness, and once his father passed, he stayed on to remodel the house his father lived in to rent it. He has no idea when he’ll be back. My 8-year-old daughter is taking this very badly. She didn’t like the divorce to begin with, but even on our off weeks, we each saw her every few days. She also thrives on certainty—she wants to know what time it is and how long things take, and hearing “I don’t know when I’ll be back, maybe next week” over and over makes her angry, and that’s becoming a big problem. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); Now, she’s taking that anger out on me. She has become exceedingly rude, is starting to actively flout house rules (going as far as throwing garbage on the floor instead of in the trash) and yells at me all the time. She’s in counseling and her therapist said to be firm about her tone but understanding about her anger. She’s not getting any better, no matter how many talks I have with her, how much screen time she loses, or any other consequence I can impart. She even starts her rudeness by saying, “I don’t care what you take away from me.” I’m about to lose my mind. And I’m beyond furious that my soon-to-be-ex was able to just take off with no return date and just assume I’d take on full-time parenting for the duration. What do I do? —I Didn’t Sign on for Solo Parenting Dear Solo Parenting, Advertisement Advertisement Advertisement Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Though it may be futile, make sure your ex knows just how much you are struggling and ask if there is any way for him to come back and relieve you of parenting duty more frequently. As far as your daughter goes, there’s no fix for this; this is a phase that you’re going to have to navigate. The best you can do is to be patient with her and with yourself as she works through these big emotions. Acknowledge what she’s going through and how hard it is on her. Let her know that you are struggling yourself. Encourage her to vent her frustrations to both you and her father; you shouldn’t be the only one to bear that load. Advertisement When your daughter acts up, point out the real reason for her misbehavior and offer her the chance to talk about it. If there are any other kids in your circles or family who have navigated a divorce, encourage her to talk with them about it. Follow your therapist’s advice and continue to be firm, no matter how flustered you may get. If you need to excuse yourself to the bathroom to calm down during one of your encounters, then do it. Advertisement Do everything you can to care for yourself during this difficult time. Prepare only meals that you enjoy. Binge a good show when your daughter goes to bed. Read during your lunch break. Take every available opportunity to prioritize your pleasure and peace of mind. Find a friend or family member that you speak to openly about your challenges. If you’re able to obtain therapy for yourself, do so. —Jamilah More Advice From Slate My husband is a human who farts a lot. I cannot stress enough how often and how loudly he farts. I’ve gotten used to it, but I grew up in one of those repressed households where girls (like myself) were supposed to feel shame and apologize for any passing of gas or burping. Our daughter is 6 and thinks farting is hilarious. Who can blame her? She farts a lot and with no shame or remorse. She’s started to get teased… Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Family Parenting Slate Plus Advertisement'''
