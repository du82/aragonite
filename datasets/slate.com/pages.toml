["https://slate.com/advice/2025/02/husband-toddler-cat-fights-marriage-advice.html"]
title = "Marriage advice: My husband neglected to monitor our toddler around the cat. Now, he's blaming the cat for what's gone wrong."
description = "He even went so far as to suggest we give up the cat to a shelter."
full_description = '''Care and Feeding My Husband Neglected to Monitor Our Toddler Around the Cat. Now, He’s Blaming the Cat for What’s Gone Wrong. He even went so far as to suggest we give up the cat to a shelter. Advice by Ben Mathis-Lilley Feb 26, 20255:46 PM Photo illustration by Slate. Photo by Dixi_/iStock/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Care and Feeding is Slate’s parenting advice column. Have a question for Care and Feeding? Submit it here. Dear Care and Feeding, My partner and I are at odds about the current conflict between our toddler (19 months old) and our cat (8 years). We’re currently working on teaching the toddler not to hit, grab, or throw things at the cat. Our efforts worked for a while. But for the last week or so, it feels like the main thing our child wants to do upon coming home from daycare is to chase and torment the cat. My husband and I don’t totally see eye-to-eye on how to handle the situation. I tend to monitor our child closely around the cat and intervene when he starts chasing or throwing toys at the cat, getting down in front of him and talking in a low, serious tone about how we do not hurt the cat, taking away whatever broom or blocks he’s been using to ‘play’ with the cat, and redirecting him to other activities. This works for a bit, and then the tormenting starts up again. I am fine with this; I know parenting is a long road, and consistency is key. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); My husband does not want to have to monitor this closely. He often ends up having to rush across the room to pull them apart only after the toddler has hit the cat in the face with a toy or grabbed his tail and pulled as hard as he can. More often than not, he resorts to locking the cat in his office, with food and litter—sometimes for hours at a time. The cat, unsurprisingly, has lightly bitten and scratched our son on more than one occasion, always when he’s being harassed and provoked. These have all been surface level injuries, the kind of warning scratches I’m used to getting from having grown up with a cat and learned when to leave one alone. But my husband is increasingly hysterical about these fights and injuries, and insists our son is being scarred and maimed, and that my violent cat is intentionally trying to take out our son’s eye. He even went so far as to suggest we give up the cat to a shelter. Advertisement Advertisement Advertisement I have had this cat since he was a kitten. I know he’s not the most cuddly or patient animal, but he is a basically friendly and good natured cat. My husband does not and has never liked my cat, and admits as much. He would rather not have any animals after this cat is gone. But the way he talks about the cat and the toddler’s fighting makes me feel like we’re living on different planets. Advertisement Am I really being too nonchalant about an actually dangerous situation, or is this run-of-the-mill toddler/cat fighting? Is it unreasonable for me to expect that he monitors the baby and cat more closely? Is this just a phase that all babies go through with pets? —Fighting Like Cats and Babies Related From Slate Michelle Herman I Moved in With My Parents. They Won’t Accept What Needs to Be Done to Their Dog. Read More Dear Fighting, Ha ha, oh boy. The cat argument … I know it well. I’m the pro-cat side of the dynamic in our household, and the problem is not scratching, but rather that the cat has some sort of permanent viral infection that results in a lot of cat snot getting on things. But it’s a similar situation, it sounds like. The first thing I’m going to do on the subject of how to address this is punt, because I’m not qualified to say whether the situation is dangerous. That sounds like a question that you would want to pose to your pediatrician and perhaps to your vet. Having third-party input and authority, especially from someone who is familiar with at least one of the small creatures in your household, could help make it a less fraught conversation maritally. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. The main thing I’ll say is that, to me, putting a cat in a room with food and water doesn’t really sound like that extreme a way to deal with the problem of having a cat and toddler getting on each other’s nerves. It’s a cat; it doesn’t need that much to be content. Does the room have a window and a cozy place to sleep? If so, seems fine to me. Spend time playing with the cat one-on-one, and have the cat out and about when you’re able to carefully supervise. I’m not a cat psychiatrist, but you would certainly be doing better by your pet than others have in situations with cats and kids. Advertisement Advertisement The cat having a certain amount of daily “alone time” does also seem like something you could concede by way of seeking a sustainable consensus. The way you’re addressing your toddler’s behavior strikes me as the right approach, and I would imagine he will grow out of the cat-bothering phase, hopefully into a cat-appreciating phase, as my kids have. Then you’ll be able to use your child’s emotional attachment as leverage in the ongoing fight with your husband, and isn’t that really what it’s all about? —Ben Have a question for Care and Feeding? Submit it here. Never miss new Advice columns The latest sex, parenting, and money advice from our columnists delivered to your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Advice newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Parenting Pets Slate Plus Advertisement'''
