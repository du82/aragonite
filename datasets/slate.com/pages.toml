is, that are really hard to explain. Elizabeth recommended the following resources: A Family Is A Family Is A Family by Sara O’Leary The Not So Friendly Friend: How to Set Boundaries for Healthy Friendships by Christina Furnival Adult Children of Emotionally Immature Parents by Lindsay Gibson The Estranged Heart And after that discussion, we’ll of course circle up for a round of triumphs and fails — and we’ll also share some amazing thoughts you shared about going to DC. Join us on Facebook and email us at careandfeedingpod@slate.com to ask us new questions, tell us what you thought of today’s show, and give us ideas about what we should talk about in future episodes. You can also call our phone line: (646) 357-9318. If you enjoy this show, please consider signing up for Slate Plus. Slate Plus members get to hang out with us on the Plus Playground every week for a whole additional grab-bag of content — and you’ll get an ad-free experience across the network. And you’ll also be supporting the work we do here on Care and Feeding. Sign up now at slate.com/careplus – or try it out on Apple Podcasts. Podcast produced by Maura Currie. Tweet Share Share Advice Kids Parenting Relationships Podcasts Advertisement About the Show Jamilah Lemieux, Lucy Lopez, Elizabeth Newcamp, and Zak Rosen share triumphs and fails and offer advice on parenting kids from toddler to teens. All episodes Hosts Zak Rosen is the host of The Best Advice Show. He also produces and edits How to Survive the End of the World. He lives in Detroit with his wife and two young kids (and very large dog, Rumi). Lucy Lopez is a writer, media personality, and host of the Mamacita Rica podcast. When she’s not co-hosting Care and Feeding, she’s slightly oversharing about what it’s like to be a mom of two girls in Miami at @thelucylopez. Elizabeth Newcamp is a co-host of Care and Feeding. She's a traveling mother of three boys who chronicles her misadventures at Dutch, Dutch, Goose.'''
