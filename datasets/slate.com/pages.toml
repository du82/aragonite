title = "My father-in-law just showed me some extremely revealing family photos. I’m in shock."
description = "What he then said about my fiancée is even worse."
full_description = '''Dear Prudence Help! My Father-in-Law Just Showed Me Some Extremely Revealing Family Photos. I’m in Shock. What he then said about my fiancée is even worse. Advice by Delia Cai Feb 15, 20258:00 AM Photo illustration by Slate. Photo by Ivan Burchak/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, I could use some perspective on a situation that happened over the holidays with my soon-to-be father-in-law. My fiancée and I have been together for about four years and got engaged six months ago. We do not see her parents frequently because they live across the country (I have visited them with her about once a year since we met). My fiancée has a good relationship with them and our visits have been free of conflict in the past, and according to her they are supportive of our engagement. This Christmas was the first time we have seen them since we got engaged, and one evening her father was showing us some family photo albums he had recently unearthed while cleaning out the basement. To my shock, on one page there were several old photos of a completely nude man lounging in a lawn chair with his legs spread. I was clearly caught off guard, which made her father chuckle heartily and share that that was his father and that there was a “long tradition of well-hung men in this family.” (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); He then said that he was so happy his daughter had met me and that he hoped I was “satisfying” her and would continue to for years to come, which made her burst out laughing. I tried to brush it off and didn’t bring it up with her, but the next night while helping set the table he asked if my hands were “big enough” to carry the multiple items I was bringing to the table. I had had enough, and that night I shared my concerns with my fiancée and told her how uncomfortable I was, but she said that’s just how he is and that it’s a sign that he’s comfortable around me and feels like he can be himself. After we returned home, I tried to forget about it, but I am finding myself having intrusive thoughts about it and am feeling increasingly offended. I would consider myself to be secure in my masculinity, but I’m starting to question her father’s impression of me. I genuinely do not want him making comments like this in the future, but I also worry that I’m reading into it too much and am making a big deal out of nothing. I’m thinking about asking my fiancée to bring it up with him, but I worry that it would strain my relationship with him and only make him more inclined to tease me in the future about various things, including other highly personal topics. I’m having worst case scenario thoughts about him making comments like this at our wedding, or even during a toast, and I don’t know how I could live that down. How should I approach this before it’s too late? —Insecure and Annoyed in Indiana Dear Annoyed, Advertisement Advertisement Advertisement Advertisement My read of this situation is that your fiancée’s father is prodding for a reaction. He’s either doing it out of insecurity (hoping you’ll validate his frankly gross sense of humor—and thereby prove a kind of “loyalty” or allyship with him) or out of an even more twisted need to “dominate” you (by making you out to be the melodramatic, uptight one who doesn’t go along with the joke). The trick here, I think, will be to stay as calm as possible and avoid giving him any of that satisfaction. Don’t get flustered, and don’t get visibly upset. Instead, treat this adult man the way you’d treat a juvenile younger cousin who won’t leave you alone. The next time he makes a joke about “satisfying” his daughter, use a neutral, almost bored tone and be as direct as possible: Say, “You seem very curious about our sex life,” or “Do you want to just come out and ask me about my penis size?” The vibe you want to give off is, “Why are you being so weird, dude?” You can even go for a shrug, “Oh, we don’t need to talk about that” and change the subject coolly. The key, I think, will be in showing that you’re not bothered in the slightest—nor are you amused. Advertisement Get advice—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, I am a 32-year-old woman who has started dating other women in the last three years.Recently, I have fallen in love with a brilliant, beautiful, kind, supportive woman who I consider to be my perfect match. We are very happy and we plan to build a life together. My question is about a friend. Let’s call her Jessica. Jessica has been one of my closest friends for 10 years; however, we have always had different worldviews. She is deeply Christian, and I am a lapsed Catholic. My current partner also used to be close to her until she expressed that she does not support gay marriage. I addressed this with Jessica, and she told me she supported my relationship with my female partner, but she did not know if she could be present at my (future, hypothetical) wedding, for religious reasons. I think she is being dishonest. Why would she support the relationship but not the marriage? I don’t think we can be close friends if she thinks my partnership is sinful. She thinks I am throwing away a 10-year friendship over a religious difference of opinion. Is this grounds for ending a friendship? How do I explain this to her compassionately? —Baffled Bisexual Dear Baffled, Advertisement Advertisement Advertisement Advertisement I’m not sure there’s any combination of words, compassionate or otherwise, that can convince someone to treat you as an equal if their belief system won’t allow for it. For Jessica, this is a “religious difference of opinion,” but for you, it’s a matter of whether she supports your present and future happiness—or not. Do you really want a friend who doesn’t? Dear Prudence, I’m neurodivergent and have some ways of speaking and acting that others find odd, so it’s hard for me to make friends. Luckily, I found a really nice and accepting friend group. Unfortunately, there’s this one guy. I’ve been very clear that I only want to be friends with him, nothing more, and I’ve turned down his multiple requests to swap numbers and socials. He doesn’t seem to understand this, and keeps trying to insert himself into my life. If I join a school organization, so does he. If I ask the group chat of anyone can walk me home after a late shift, he volunteers even when someone else already agreed. If I’m sitting anywhere with an open seat next to me, he’ll sit next to me no matter how many options he has. Advertisement Advertisement Thankfully, he stopped trying to hug me after I yelled and shoved him back. But nothing I do makes it clear to him that I’m not interested. Normally, I’d just avoid being where he is, but he’s deep in my friend group, and if I avoid him, I’ll have to avoid everyone. And as I mentioned, I’m really bad at making new friends, and this friend group is so good! What can I do? Is there a way to drop the creep and keep the friend group? —Just Want to Be Friends Dear Just, Advertisement The downside of most friend groups is that there’s always at least one off-putting individual who comes with the whole package. It’s hard to tell from your letter if this guy is actually a persistent creep, or if he just doesn’t understand how to conduct himself (though these are not mutually exclusive categories). Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Teen Just Blew Up at Me Over His “Right to Privacy.” Excuse Me? I think the best course of action for you is to first focus on cultivating a few individual friendships within the group with the people you most like. Having a group to hang out with is fun, but group dynamics can be fickle and overwhelming to manage as a whole; it’s often hard to get close to any one person. So, I would identify a few members of the group whose company you think you might enjoy and then ask them one on one (via text or maybe during a moment alone when the whole gang is together) if they’d like to get coffee or lunch sometime. Tell them that you’d like to get to know them better, and see where things go from there. Advertisement Advertisement Advertisement It may take some time to find a good “match” out of all the possible candidates in the group—but once you’ve found one or two people with whom you have your own rapport, you can then gently ask them about the troubling member and see if they have anything to say. Ideally, these new friends will be able to hear you out about how uncomfortable he’s making you feel and offer to help support you or stand up for you. If they’re not empathetic or insist that you simply must go along with the behavior for the good of the group, though, I would be wary of involving myself further. That’s why I think it’s important for you to start developing these one-on-one friendships, just in case you end up deciding that the bigger group dynamic isn’t worth dealing with this one pesky guy. —Delia Catch up on this week’s Prudie. More Advice From Slate I recently adopted a dog, and I’m experiencing extreme buyer’s (adopter’s?) remorse. He gives me a massive amount of anxiety. I spend all day worrying that he’s going to destroy my apartment. Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subscriptions at any time. You're already subscribed to the Dear Prudence newsletter. You can manage your newsletter subscriptions at any time. We encountered an issue signing you up. Please try again, or manage all your newsletter subscriptions here . <div class="slate-notification--error"> Please enable javascript to sign up for newsletters. </div> Email address: Send me updates about Slate special offers. By signing up, you agree to our Privacy Policy and Terms. Sign Up Tweet Share Share Comment Advice Dear Prudence Slate Plus Advertisement'''
