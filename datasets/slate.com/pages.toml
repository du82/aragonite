title = "Parenting advice: My son is extorting me for money—just like this mother."
description = "I can't do this again."
full_description = '''Dear Prudence Help! My Son Is Extorting Me for Money—Just Like His Mother. I can’t do this again. Advice by Delia Cai Feb 17, 202511:16 AM Photo illustration by Slate. Photo by Ivan Zastavetskyi/Getty Images Plus. Tweet Share Share Comment Tweet Share Share Comment Dear Prudence is Slate’s advice column. Delia Cai is filling in as Prudie for Jenée Desmond-Harris while she’s on parental leave. Submit questions here. Dear Prudence, After my son turned 18 last year, I really hoped that the financial abuse my ex put me through would end. Despite being divorced for a decade, my ex would constantly call and try to weasel more money out of me to pay her outrageous expenses (she liked living the high life) and then use the kids if she didn’t get it. It was always Dad’s fault if they were not going to Disneyland. My daughter wised up to her mother’s ways and rarely has anything to do with her. My son, however, got better at lying to me. I bought my son a car on the condition he paid for the insurance and didn’t let anyone else drive it—especially his mom. She had something like six wrecks in the last three years and lost her license. My son swore that it wouldn’t happened. Then he called me begging to get the car out of police impound. His mother got caught speeding and had enough warrants that she was immediately arrested. I told my son no. The immediate consequences of his lying was he was going to have to figure out to pay for the car himself or deal with hoofing it everywhere. He told me he has no savings after bailing out his mom from jail. He couldn’t just leave her there. I told him that was his choice to make and his consequences to deal with. Instead, he screamed about what a horrible parent I was and how he never wanted to talk to me again. (function(d,s,n){var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.className=n;js.src="//player.ex.co/player/8b7b2bed-5b69-4d70-82d5-aa335c8abe6c";fjs.parentNode.insertBefore(js,fjs);}(document,"script","exco-player")); I would have left it at that but he went around to other family members, including my disabled mother, to get the money. Now there is family pressure for me to cover the debt instead.I feel like I am banging my head against the wall. This is exactly the same kind of stunt my ex pulled back in the day. I love my son but I can’t deal with this again and again like before. Help! —Repeat Past Dear Repeat Past, Your son and his mother are both adults, and it’s time for them to deal with the consequences of their actions. I think it’s well within your rights to refuse any further financial assistance to either of them for the foreseeable future. Whatever is going on in their relationship sounds like a death spiral of chaos that you absolutely don’t need to be a part of. Tell any judgmental family members that you’re letting two adults handle their lives as they see fit, and that it’s no longer your job to interfere—and that none of them should feel obligated to pick up the bill either. Advertisement Advertisement Advertisement Get advice from Prudie—submit a question! Please keep questions short (<150 words), and don‘t submit the same question to multiple columns. We are unable to edit or remove questions after publication. Use pseudonyms to maintain anonymity. Your submission may be used in other Slate advice columns and may be edited for publication. Thanks! Your question has been submitted. Dear Prudence,* Your letter signoff Your pronouns Your email (optional and confidential—please include if you're open to Dear Prudence following up) Submit Dear Prudence, I’m wondering if my boyfriend’s recent behavior is a red flag or if I’m in the wrong. I semi-regularly get free things or discounts in stores and cafes. I’m pretty sure this isn’t because I’m wildly good-looking—I’m not conventionally attractive, though I like how I look. I just chat with people in customer service a lot and have been told I’m a very friendly and approachable person. I used to work in retail myself and often exchange funny stories with people about wild customer service experiences. It’s not rare for me to be given free coffee or a free pastry, extra stamps on a loyalty card, and the odd discount. I’ve never given it much thought, until now. Advertisement My boyfriend is convinced I’m “flirting” to get things. I pointed out that nine times out of 10 I’m given things by people very unlikely to be flirting with a 30-year-old woman—the grandmother of three at the coffee shop is not interested in me, nor is the 17-year-old at the pizza place! It’s very rare for a guy in my age range to be the person giving me discounts. I don’t think of chatting about the weather or remembering your baristas’ names as flirting, but he got truly angry the last three times it happened. He says I should stop accepting free things and “natter less” with strangers, that it’s flirtatious behavior and embarrasses him. I find this hurtful. We’ve been dating for a year and a half without many disagreements, but this one bothers me and feels possessive/controlling. Who do you think is right? Am I overreacting by holding off on moving in with him in light of this recurring fight? He walked out of our last coffee date because he said I “might as well be dating the barista” after I had a five-minute chat with her about her wedding planning! It was mortifying and, ironically, the barista was so embarrassed for me that she gave me my order free… —Friendly or Flirting Dear Friendly, Advertisement Advertisement Advertisement Honestly, I wouldn’t just hold off on moving in with your boyfriend—I would consider ending the relationship entirely. It doesn’t take much for me, a total stranger on the internet, to believe you when you say that you’re not flirting. So why can’t your boyfriend of a year and a half believe what you say? It sounds like you’re simply being friendly and outgoing. If that’s enough to prompt your boyfriend to throw tantrums or issue decrees about how you should act around other people, then I am very, very alarmed. I can’t tell if it’s more chilling that he doesn’t seem to know the difference between outright flirting versus friendliness, or that he thinks he can tell you what to do and whom to talk to. That’s textbook controlling behavior, and if you move in together, I guarantee that his behavior will only get worse. Send Us Your Questions About the Workplace! The columnists behind our new advice column, Good Job, want to help you navigate your social dynamics at work. Does your colleague constantly bug you after hours? Has an ill-advised work romance gone awry? Ask us your question here! Advertisement Advertisement Advertisement Dear Prudence, I’m the youngest of three, and have struggled to get my family to show up for me. I understand that my events aren’t as interesting, but I resented being dragged to all of their events, knowing I’d never get reciprocity. I got married when I was 33, and that was the first time my entire family showed up to an event of mine. When my brother had the first grandkids, they were all my parents could focus on. My mother flew halfway across the country to help my brother and sister-in-law every weekend for the first six months. My parents continued to make the even longer journey when my brother moved two additional time zones away. When I had kids, my parents were older and uninterested in traveling. I received zero support, and they’ve met my kids about three times in total. Both of my siblings have met my kids once. (My youngest is 8.) Initially, my husband and I would fly home, but it was a lot of effort only for my parents to turn on the TV and divide their attention between us. Our presence seemed to annoy them so I quit visiting. My husband and I didn’t want to waste more money trying the same thing with my siblings so we never attempted to visit them. Advertisement Advertisement Advertisement My sister announced she was pregnant. I assumed that since she would be the last child to reproduce she would get the same short end of the stick that I got. Nope! My mom is flying out to see her before she gives birth. I get to witness her rush of excitement over the upcoming grandchild. She’s attending my sister’s baby shower despite not attending mine! I will not be attending because I’m too busy. I’m following my therapist’s advice to only show up for people who show up for me or when I really want to. Well, much like my family members all these years with my events, I don’t want to show up, and I don’t want to make the time. In a twisted turn of events, my mom and sister (not my dad and brother) have now decided they’re interested in my life. They went from zero to 100 after I explained why I’d been so absent. Now they’re all supportive, and their schedules magically opened up. Not only do my mom and sister want to visit me, but they want to help after my husband recovers from major surgery next month. What? I don’t have the mental capacity to determine whether this new interest is sincere or an attempt to save face, but all of their behavior is ironically off-putting. I would have appreciated such grand gestures 30 years ago, but I mourned the family I never had and got over it. Besides, my in-laws and neighbors already stepped into those “village” roles, and I’m not interested in rejiggering things to cater to people who just woke up to the fact they haven’t treated me well. Plus I don’t trust them because they’ve flaked in the past. Advertisement Advertisement Advertisement Advertisement I’ve sat with my mom’s and sister’s change in behavior for a while, and I’m sorry to say that I still feel nothing. Was it years of selfish behavior and indifference? I don’t know. But how do I deal with their new-found insistence that they come visit me and help? I just want them to … go away. —It’s Too Late Dear Too Late, That’s quite an about-face from your family, and I don’t blame you for feeling resentful (or even distrustful) about it. I think you can be diplomatic to your family about how you don’t need the help that they’re offering because there’ll be “too many cooks in the kitchen,” that you “already have a system in place”, or that you’re simply not feeling up to being a good host. I can understand the desire to hold your family at arm’s length given their track record, but I also wonder if their desire to change their behavior should still be taken as an opportunity (however belated) to reconnect, if there’s any part of you that still wants that. If not, then feel free to stop reading right now. But if there’s even a tiny part that does, I would suggest experimenting with giving your family members small, low-lift “jobs” to do (i.e. if you don’t want them to visit during your husband’s surgery, could you suggest they send a care package instead?) in order to feel helpful. Advertisement Advertisement Because the annoying and deeply frustrating thing about families (especially parents) is that, as much as we want everyone to treat all members the same, people tend to subconsciously or very consciously favor the members whom they best understand and whom they can feel their most heroic, appreciated selves around. I’m not saying that as a way of excusing your parents’ favoritism, but to give you the cheat code for how most misguided parents operate: They want to feel appreciated, and if they don’t know what your deal is or even remotely like they’re not needed, they’re going to get defensive or back away. It might help to think of them as toddlers trying to “cook” Mom and Dad a breakfast in bed, and making a huge mess of the kitchen. It’s not really what you want or need, but they’re trying, aren’t they? Advertisement Dear Prudence, My brother has found religion and I’m happy for him. We were raised Jewish, but somehow he’s gotten super into Christianity and the Bible. He’s 21 and I’m pretty sure has some undiagnosed mental health stuff. I want him to ALSO find therapy, as I have (we are very similar people with a ton of anxiety and a tendency to spiral existentially) but I don’t want it to come across like I’m trying to yuck his yum. I’m not sure if religion will REALLY make him happy, and I guess part of me is offended that he sees no value in how we were raised. But I want to be supportive and help him find the way to contentment. What should I do? —Jew For Jesus-Brother Dear Jesus Brother, Advertisement Advertisement Advertisement Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Your brother has just begun his journey into adulthood and self-actualization, and he’s not always going to make choices you personally agree with. But—speaking with the long, tired exhale of a domineering older sister with a 23-year-old little brother—you simply have to let him, so to speak, wander around the desert and figure out what he’s going to figure out. Judgment will only drive him away and make it harder for him to trust you if he ever needs help or support. So for now, your job as an older sibling is to make yourself available as a neutral and patient sounding board. Resist the urge to tell him to get a therapist, and instead, express curiosity about these choices that he’s starting to make for himself. Invite him to share his beliefs and experiences with you, and offer to share some of your own experiences (especially from that age) in return—not as a way of expressing, “Here is the correct way to live,” but to show him evidence of the zig-zagging path you also took to become a fully formed adult. As much as we older siblings would love to simply download our hard-won wisdom into our baby siblings, we have to let them experience it for themselves. All we can do is reassure them that hey, honestly we don’t have it figured out either, but here’s what we tried. —Delia Advertisement Advertisement Advertisement Classic Prudie My partner and I have been essentially aunt and uncle to the two children of friends since their birth, and they are now young adults making their way in the world. One of them has a habit of dropping off communications radar—not responding to texts or messages—for fairly long periods of time, but popping up when they need advice, or a contact, or something from us. Those bits of advice or networking tips are sometimes used and sometimes not, occasionally leading to situations where professional contacts are asking, “Hey, you said Kevin was going to contact me about a job opportunity?” Don't miss what's new from Prudie Get advice on manners and morals in your inbox three times a week. Thanks for signing up! You can manage your newsletter subsc'''
