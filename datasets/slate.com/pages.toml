title = "Family advice: My mom is dying. Her sister's behavior is making everything so much worse."
description = "It can't keep on like this."
full_description = "Care and Feeding My Mom Only Has Limited Time Left Before She Dies. Her Sister’s Behavior Is Making Everything So Much Worse. It can’t keep on like this. Advice by Michelle Herman March 01, 20258:00 AM Photo illustration by Slate. Photo by Getty Images Plus. Tweet Share Share Comment Slate Plus members get more Care and Feeding every week. Have a question about kids, parenting, or family life? Submit it here! Dear Care and Feeding, Unfortunately, my mom is in the hospital. She has cancer, and it’s not likely that she’ll pull through: The doctors have given her “weeks to months” at best. My brother, my aunt, and I have a group chat to plan our visits with Mom, talk about medical updates, and so on. My brother is great—he generally only texts when there’s some important information to share—but my aunt just. can’t. stop. She calls me almost every day (on Sunday she called three times in less than nine hours, and the second and third calls were really not necessary) on top of messaging in the chat. I understand that she’s anxious and scared, and I know she finds comfort in talking with me, but it’s stressing me out. Every time the phone rings or I get a notification in the group chat I think something bad has happened. I obviously can’t mute the chat, and if I ignore my aunt’s call, she’ll leave a voicemail and often call back within an hour or two. I need her to calm down. I’ve already mentioned that it’s borderline exhausting, and she said she understood but hasn’t changed her behavior. Can you suggest some way to get her to hear me? I don’t want to hurt her feelings, but my nerves are really starting to fray. —Please Leave Me Alone Dear Alone, I am so sorry to hear about your mother. The prospect of losing one’s mother is an awful one. I understand completely how stressed, worn out, and tense you are. I feel for you. This aunt who’s constantly calling and texting: She’s your mother’s sister, right? And they’re close? And it’s just the three of you—you, your brother, and Mom’s sister; no other family (or at least none close enough to be involved in the day-to-day of what’s happening to your mother)? It sounds like she’s panicking. And the impending loss of a sibling is right up there with the impending loss of a parent (for an adult child). Take a moment to consider how sad, worried, and helpless she’s feeling. And then tell her that. Tell her you understand. Tell her how hard this is for both of you (your brother is keeping his own counsel; we all have our ways to cope). Then let her know—gently, lovingly—that it’s all you can do to hold it together yourself; you can’t be on call for her. If you know of anyone in her life whom she might be able to rely on for support, suggest she get in touch with that person. (If it’s someone you know well, you might go so far as to let them know that she could use some support right now and ask them to check in with her.) But even if she has no one else—and I hope with all my heart that this isn’t the case—let her know that you can’t continue this level of communication with her. It’s too much for you. Decide how much communication you can tolerate, and tell her what that looks like. If you don’t want to talk on the phone at all, make that clear. If you can handle talking every other day—or every third day—or once a week—tell her that. Go further than mentioning that right now you’re finding her communication is “borderline exhausting.” Be direct. Popular in Advice Help! Our New Neighbor Claimed She Was “Getting Her Life Together.” Then We Saw the Camera Footage. I Thought My Husband Was a Good Stay-at-Home Dad. But Now I’m Not Sure My Toddler Is Safe. This Content is Available for Slate Plus members only Help! My Wife Insisted I Had No Say in Raising Her Daughter. Now She’s Come at Me With a Truly Wild Demand. My Mother Has Fooled My Brother Into Believing She’s a Loving, Sweet Grandmother. I Know the Truth. Then stick to your guns. You don’t have to pick up the phone every time she calls. You don’t have to pick it up when she calls back an hour or two later. You don’t have to respond to every text. And you don’t have to read every text as soon as it comes in. (I am a fan of muting notifications on group texts and just looking at my phone regularly—at intervals I decide on—to make sure I don’t miss anything important. If you’re worried that you still might miss an emergency, let your brother know what’s going on and ask him to text or call you directly if a text from your aunt to the group chat rises to that level.) Take care of yourself. It’s not your responsibility to take care of your aunt. But it would be a kindness to her—and probably to your mother—to let your mom’s sister know that you feel for her. If you love her (you haven’t mentioned how you feel about her, or how you felt about her up to now), you might let her know that while right now you’re not available to be leaned on—you might confess that you’re barely holding yourself upright—you’ll be there for her in the long run. She’s about to lose her sister, after all. —Michelle More Advice From Slate I am a new father to a beautiful 10-month-old girl. My wife’s company has a generous maternity leave policy, and she has been at home with our daughter since the birth and is scheduled to go back to work just after her first birthday in January. She recently told me she doesn’t want to go back to her job and would like to be a stay-at-home parent instead. I asked her why, and she said she enjoys being a mother too much to leave our daughter to go back to work when she doesn’t need to. This is such a departure from our plans before the baby was born. Tweet Share Share Comment Advice Kids Parenting Slate Plus"
