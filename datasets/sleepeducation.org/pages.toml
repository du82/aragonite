title = "About Sleep Education - Sleep Education by the American Academy of Sleep Medicine"
description = "Sleep is essential to health. Along with a balanced diet and regular exercise, sleep is one of the pillars of a healthy lifestyle."
full_description = "About Sleep EducationJason Wilbanks2021-03-30T15:14:27+00:00 About Sleep Education .fusion-body .fusion-builder-column-0{width:100% !important;margin-top : 20px;margin-bottom : 20px;}.fusion-builder-column-0 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 1.92%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 1.92%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-0{width:100% !important;order : 0;}.fusion-builder-column-0 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:768px) {.fusion-body .fusion-builder-column-0{width:100% !important;order : 0;}.fusion-builder-column-0 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}.fusion-body .fusion-builder-column-1{width:50% !important;margin-top : 20px;margin-bottom : 20px;}.fusion-builder-column-1 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 3.84%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 3.84%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-1{width:50% !important;order : 0;}.fusion-builder-column-1 > .fusion-column-wrapper {margin-right : 3.84%;margin-left : 3.84%;}}@media only screen and (max-width:768px) {.fusion-body .fusion-builder-column-1{width:100% !important;order : 0;}.fusion-builder-column-1 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}Sleep is essential to health. Along with a balanced diet and regular exercise, sleep is one of the pillars of a healthy lifestyle. Sleep also provides a boost for your mood, alertness and energy. It enhances your memory, creativity and performance. Getting healthy sleep on a regular basis also helps keep you safe by promoting optimal alertness. However, many people have a sleep disorder that prevents them from getting the healthy sleep that they need. The American Academy of Sleep Medicine launched the Sleep Education website in 2005. The site has reliable information about sleep, sleep disorders, and treatment options. It is a valuable resource for patients who have sleep disorders. The site provides accurate medical and scientific insight in a concise manner that is easy to understand. It also provides facts that will be useful to anyone who wants to learn more about sleep. .fusion-body .fusion-builder-column-2{width:50% !important;margin-top : 20px;margin-bottom : 20px;}.fusion-builder-column-2 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 3.84%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 3.84%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-2{width:50% !important;order : 0;}.fusion-builder-column-2 > .fusion-column-wrapper {margin-right : 3.84%;margin-left : 3.84%;}}@media only screen and (max-width:768px) {.fusion-body .fusion-builder-column-2{width:100% !important;order : 0;}.fusion-builder-column-2 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}.fusion-body .fusion-flex-container.fusion-builder-row-1{ padding-top : 30px;margin-top : 0px;padding-right : 30px;padding-bottom : 30px;margin-bottom : 0px;padding-left : 30px;}About AASM .fusion-body .fusion-builder-column-3{width:33.3333333333% !important;margin-top : 20px;margin-bottom : 20px;}.fusion-builder-column-3 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 5.76%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 5.76%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-3{width:33.3333333333% !important;order : 0;}.fusion-builder-column-3 > .fusion-column-wrapper {margin-right : 5.76%;margin-left : 5.76%;}}@media only screen and (max-width:768px) {.fusion-body .fusion-builder-column-3{width:100% !important;order : 0;}.fusion-builder-column-3 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}Established in 1975, the AASM is a medical society for sleep medicine professionals. We have a combined membership of 11,000 accredited member sleep centers and individual members. These members include doctors, scientists, and other health care professionals. The AASM is advancing sleep care and enhancing sleep health to improve lives. We set standards for sleep care and provide professional education. The AASM accredits sleep centers to ensure that patients receive high-quality care. We also advocate for patients and providers. Learn more at aasm.org. .fusion-body .fusion-builder-column-4{width:66.6666666667% !important;margin-top : 20px;margin-bottom : 20px;}.fusion-builder-column-4 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 2.88%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 2.88%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-4{width:66.6666666667% !important;order : 0;}.fusion-builder-column-4 > .fusion-column-wrapper {margin-right : 2.88%;margin-left : 2.88%;}}@media only screen and (max-width:768px) {.fusion-body .fusion-builder-column-4{width:100% !important;order : 0;}.fusion-builder-column-4 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}.fusion-body .fusion-flex-container.fusion-builder-row-2{ padding-top : 30px;margin-top : 0px;padding-right : 30px;padding-bottom : 30px;margin-bottom : 0px;padding-left : 30px;}Contact Us To get medical help or advice for a sleep problem, you can contact an AASM-accredited sleep center. Use our sleep center directory to find one near you. Patients who have a sleep disorder can join our e-mail list to receive up-to-date information and news by contacting us at [email protected]. Companies that want to learn how to advertise on the Sleep Education website can contact [email protected]. American Academy of Sleep Medicine 2510 North Frontage Road Darien, IL 60561 (630) 737-9700 .fusion-body .fusion-builder-column-5{width:100% !important;margin-top : 20px;margin-bottom : 20px;}.fusion-builder-column-5 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 1.92%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 1.92%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-5{width:100% !important;order : 0;}.fusion-builder-column-5 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:768px) {.fusion-body .fusion-builder-column-5{width:100% !important;order : 0;}.fusion-builder-column-5 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}.fusion-body .fusion-flex-container.fusion-builder-row-3{ padding-top : 30px;margin-top : 0px;padding-right : 30px;padding-bottom : 30px;margin-bottom : 0px;padding-left : 30px;}"
