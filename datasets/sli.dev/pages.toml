["https://sli.dev/custom/config-mermaid"]
title = "Configure Mermaid | Slidev"
description = "Presentation slides for developers"
full_description = "Configure Mermaid ​ Environment: client This setup function will only run on client side. Make sure the browser compatibility when importing packages. Create ./setup/mermaid.ts with the following content:tsimport { defineMermaidSetup } from '@slidev/types' export default defineMermaidSetup(() => { return { theme: 'forest', } })The return value should be the custom configs for Mermaid. Refer to the Mermaid documentation or the type definition for the full config list.Custom theme/styles ​In case you want to create your custom Mermaid themes or styles, you can do this by defining themeVariables like in the following example:tsimport { defineMermaidSetup } from '@slidev/types' export default defineMermaidSetup(() => { return { theme: 'base', themeVariables: { // General theme variables noteBkgColor: '#181d29', noteTextColor: '#F3EFF5cc', noteBorderColor: '#404551', // Sequence diagram variables actorBkg: '#0E131F', actorBorder: '#44FFD2', actorTextColor: '#F3EFF5', actorLineColor: '#F3EFF5', signalColor: '#F3EFF5', signalTextColor: '#F3EFF5', } } })You can find all theme variables on the Mermaid Theme Configuration page."
