["https://sli.dev/features/recording"]
title = "Recording | Slidev"
description = "Record your presentation with the built-in camera view and recording feature."
full_description = "Recording ​Slidev comes with a built-in camera view and recording feature. They make it simple for you to record your presentation without having to switch between other recording tools while delivering a presentation.Camera View ​Click the button in the navigation bar to show your camera view in the presentation. You can drag it to move it, and use the handler on the right bottom corner to resize it. The size and position will persist across reloads.Start Recording ​Clicking the button in the navigation bar will bring up a dialog for you. Here you can choose to either record your camera output embedded in your slides or to separate them into two video files.This feature is powered by RecordRTC and uses the WebRTC API."
