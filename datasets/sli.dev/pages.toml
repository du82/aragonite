["https://sli.dev/guide/hosting"]
title = "Building and Hosting | Slidev"
description = "Presentation slides for developers"
full_description = '''Building and Hosting ​Slidev is designed to run as a web server when you are editing or presenting your slides. However, after the presentation, you may still want to share your interactive slides with others. This guide will show you how to build and host your slides.Build as a SPA ​You can build the slides into a static Single-page application (SPA) via the following command:bash$ slidev buildBy default, the generated files are placed in the dist folder. You can test the built version of you slides by running: npx vite preview or any other static server.Base Path ​To deploy your slides under sub-routes, you need to pass the --base option. The --base path must begin and end with a slash /. For example:bash$ slidev build --base /talks/my-cool-talk/Refer to Vite's documentation for more details.Output directory ​You can change the output directory using --out.bash$ slidev build --out my-build-folderMultiple Builds ​You can build multiple slide decks in one go by passing multiple markdown files as arguments:bash$ slidev build slides1.md slides2.mdOr if your shell supports it, you can use a glob pattern:bash$ slidev build *.mdIn this case, each input file will generate a folder containing the build in the output directory.Examples ​Here are a few examples of the exported SPA:Demo SlidesComposable Vue by Anthony FuMore in ShowcasesOptions ​✨ Generate PDF when Building✨ Bundle Remote AssetsHosting ​We recommend using npm init slidev@latest to scaffold your project, which contains the necessary configuration files for hosting services out-of-the-box.GitHub Pages ​To deploy your slides on GitHub Pages via GitHub Actions, follow these steps:In your repository, go to Settings > Pages. Under Build and deployment, select GitHub Actions. (Do not choose Deploy from a branch and upload the dist directory, which is not recommended.)Create .github/workflows/deploy.yml with the following content to deploy your slides to GitHub Pages via GitHub Actions.deploy.ymlyamlname: Deploy pages on: workflow_dispatch: push: branches: [main] permissions: contents: read pages: write id-token: write concurrency: group: pages cancel-in-progress: false jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-node@v4 with: node-version: 'lts/*' - name: Setup @antfu/ni run: npm i -g @antfu/ni - name: Install dependencies run: nci - name: Build run: nr build --base /${{github.event.repository.name}}/ - name: Setup Pages uses: actions/configure-pages@v4 - uses: actions/upload-pages-artifact@v3 with: path: dist deploy: environment: name: github-pages url: ${{ steps.deployment.outputs.page_url }} needs: build runs-on: ubuntu-latest name: Deploy steps: - name: Deploy to GitHub Pages id: deployment uses: actions/deploy-pages@v4Commit and push the changes to your repository. The GitHub Actions workflow will automatically deploy your slides to GitHub Pages every time you push to the main branch.You can access your slides at https://<username>.github.io/<repository-name>/.Netlify ​Create netlify.toml in your project root with the following content:netlify.tomltoml[build] publish = 'dist' command = 'npm run build' [build.environment] NODE_VERSION = '20' [[redirects]] from = '/*' to = '/index.html' status = 200Then go to your Netlify dashboard and create a new site with the repository.Vercel ​Create vercel.json in your project root with the following content:vercel.jsonjson{ "rewrites": [ { "source": "/(.*)", "destination": "/index.html" } ] }Then go to your Vercel dashboard and create a new site with the repository.Host on Docker ​If you need a rapid way to run a presentation with containers, you can use the prebuilt docker image maintained by tangramor, or build your own.Use the Docker ImageJust run the following command in your work folder:bashdocker run --name slidev --rm -it \ --user node \ -v ${PWD}:/slidev \ -p 3030:3030 \ -e NPM_MIRROR="https://registry.npmmirror.com" \ tangramor/slidev:latestNote: You can use NPM_MIRROR to specify a npm mirror to speed up the installation process.If your work folder is empty, it will generate a template slides.md and other related files under your work folder, and launch the server on port 3030.You can access your slides from http://localhost:3030/To create an Docker Image for your slides, you can use the following Dockerfile:DockerfileFROM tangramor/slidev:latest ADD . /slidevCreate the docker image: docker build -t myslides .And run the container: docker run --name myslides --rm --user node -p 3030:3030 myslidesYou can visit your slides at http://localhost:3030/'''
author = "Anthony Fu"
year_published = 2025
