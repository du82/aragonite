["https://sli.dev/guide/why"]
title = "Why Slidev | Slidev"
description = "Presentation slides for developers"
full_description = "Why Slidev ​There have been lots of feature-rich WYSIWYG slides makers like Microsoft PowerPoint and Apple Keynote (see Comparisons). They are intuitive and easy to learn. So why bother making Slidev?Slidev aims to provide flexibility and interactivity for developers to make their presentations much more interesting, expressive, and attractive by using technologies they are familiar with. Slidev is also open source with a strong community.Slidev is Markdown-based, which helps you focus on the content. Slidev is also Web-based, which means nothing is impossible - everything you can do in a web app can apply to your slides.Slidev is also progressive. You can start with a super simple Markdown file, and then use the built-in features when you need them without any configuration. There are also themes and addons you can optionally install to enhance your slides.Features ​📝 Markdown-based ​Slidev uses an extended Markdown format to organize your slides in a single plain text file. This helps you focus on the content while allowing you to use Git and any editor you like.Learn more: 📖 Syntax Guide.🧑‍💻 Developer Friendly ​Slidev provides first-class support for code snippets for developers. It uses Shiki to get the most accurate syntax highlighting. Slidev also supports ✨ Shiki Magic Move and ✨ TwoSlash Integration. These make Slidev the best choice for tech talks.🎨 Themable ​Themes for Slidev can be shared via npm packages. You apply a theme within one line of code.Check out the Theme Gallery for the beautiful themes made by the official team and the community.⚡ Fast ​Every change you make in the editor will be updated to your slides in the browser instantly without reloading, thanks to Vite's HMR feature.🤹 Interactive & Expressive ​You can write Vue components and use them in your slides, which you can then interact with during the presentation to express your idea in a more interesting and intuitive way.Slidev also has built-in support of ✨ Monaco Editor, which empowers you to do live coding in your presentation with auto-completion and hover messages.🎥 Recording Support ​Slidev provides built-in recording and camera view. You can share your presentation with your camera view inside, or record and save your screen and camera separately.Learn more: ✨ Recording.📤 Portable ​You can export your slides into PDF, PPTX, PNGs, or even a single-page application (SPA) via a single command. Then you can share or host it anywhere you like.Learn more: 📖 Exporting and 📖 Hosting.🛠 Hackable ​Because Slidev is web-based, everything that can be done in a normal web app can be applied to your slides. For example, WebGL, API requests, iframes, or even live sharing. It's up to your imagination!Learn more: Customization.Comparisons ​Slidev vs. Microsoft PowerPoint / Apple KeynoteMicrosoft PowerPoint and Apple Keynote are feature-rich WYSIWYG slides makers. They are intuitive and easy to learn, which makes them one of the best choices for non-developers.Compared to them, Slidev has the following advantages:Developer-friendly: Code snippets are first-class citizens in Slidev.Markdown-based: Focus on the content, and version control your slides with Git.Web-based: Everything you can do in a web app can apply to your slides.Hackable: Customize anything you like with web technologies.Open source: Slidev is completely open source, and has a strong community.Slidev vs. Reveal.jsReveal.js is a popular HTML presentation framework. It is also open source and supports Markdown.Compared to Reveal.js, Slidev has the following advantages:More concise: Slidev uses an extended Markdown format, while Reveal.js encourages you to write HTML to organize your slides.Vue support: You can use Vue components in Slidev to make your slides interactive.Vite-based: Slidev is built on top of Vite, which provides instant HMR and flexible plugin API.Atomatic CSS: You can UnoCSS out of the box to style your slides.Slidev vs. MarpMarp is a Markdown presentation tool that focuses on simplicity and portability. It is also open source and supports Markdown.Compared to Marp, Slidev has the following advantages:The same simplicity: Slidev's slides can start as simple as Marp's.More features: Slidev supports many features that Marp doesn't.Vue support: You can use Vue components in Slidev to make your slides interactive.Vite-based: Slidev is built on top of Vite, which provides instant HMR and flexible plugin API.Atomatic CSS: You can UnoCSS out of the box to style your slides.Give it a Try ​Playing around with Slidev will tell you more than thousands of words. Check the 📖 Getting Started guide to create your first Slidev project in one click or one command.Or you can have a quick preview of it:"
