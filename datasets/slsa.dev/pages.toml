["https://slsa.dev"]
title = "SLSA • Supply-chain Levels for Software Artifacts"
description = "SLSA is a security framework. It is a check-list of standards and controls to prevent tampering, improve integrity, and secure packages and infrastructure in your projects, businesses or enterprises. It’s how you get from safe enough to being as resilient as possible, at any link in the chain."
full_description = "“This is our chance to work with the industry, set a standard which we can all agree to, and work together to raise the collective bar.” Trishank Karthik Kuppusamy Staff Security Engineer at Datadog “Software supply chain visibility will become a cross-industry need to establish best practices and trusted evidence in each link.” Bruno Domingues CTO, Financial Services Industry, Intel “Having a common language and standard for objectively measuring our supply chain security is a must in order to even begin meeting EO 14028.” Trishank Karthik Kuppusamy Staff Security Engineer at Datadog “The threat to the software supply chain is real and growing, 650% from the last year. However, changing development process without slowing down is a major barrier.” Bruno Domingues CTO, Financial Services Industry, Intel “Regulated industries such as Financial Services are being more vocal on defining their responsibility on the software supply chain. Having control and traceability as a requirement is taking shape.” Bruno Domingues CTO, Financial Services Industry, Intel"
