["https://smartos.org/triton/compute"]
title = "SmartOS | Triton DataCenter"
description = "SmartOS is a purpose-built, container-native hypervisor and lightweight container host OS for secure, performant, and convenient container hosting in public and private clouds"
full_description = "Triton SmartOS combines the capabilities you get from a lightweight container OS, optimized to deliver containers, with the robust security, networking and storage capabilities you’ve come to expect and depend on from a hardware hypervisor. Triton SmartOS leverages Zones, a hardened container runtime environment that does not depend upon VM hosts for security. Patented resource protections insulate containers and ensure that each container gets its fair share of I/O. Triton SmartOS eliminates the complexities associated with VM host dependent solutions. Built-in networking offers each container one or more network interfaces, so each container has a full IP stack and is a full peer on the network, eliminating port conflicts and making network management easy. Triton SmartOS leverages ZFS to free container storage from VM host dependencies. ZFS storage virtualization makes secure storage management easy, while maximizing performance. ZFS’ flexible provisioning, copy-on-write, and data integrity checking are an ideal match for containers, while advanced caching techniques make even spinning disks perform as fast as SSDs. Hybrid, Modern and Open, Triton is engineered to run the world’s largest cloud native applications."
year_published = 2025
clearnet = "https://smartos.org/triton/compute"
