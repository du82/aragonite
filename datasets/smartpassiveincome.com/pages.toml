["https://smartpassiveincome.com/about"]
title = "About SPI | Smart Passive Income"
description = "Learn about SPI Media; from the history of Smart Passive Income and Winning Edits; to our mission, vision, and core values; and meet our team."
full_description = "Learn about SPI and the team here to help you SPI Media is dedicated to helping you become a stronger entrepreneur. Learn about our history and mission, and meet the team. About SPI Media SPI Media was born in 2020, the official marriage of two long-time businesses: Pat Flynn’s Smart Passive Income website and Matt Gartland’s Winning Edits creative agency. Want to learn more? Click below to read on. How Smart Passive Income and Winning Edits came together About Smart Passive Income Pat Flynn started Smart Passive Income in 2008 to share what he had learned in the process of building a popular blog for an architecture industry exam. Ethical advice on how to monetize a blog was hard to come by, and Pat wanted to share the lessons he learned. Transparency has always been at the heart of the SPI brand, with Pat becoming “the crash-test dummy of online business,” running experiments and sharing the results, whether they were positive or negative. Pat also began a monthly practice of publishing income reports, sharing totals for the income earned from each revenue stream, along with the expenses incurred to achieve that revenue. In an industry overrun with get-rich-quick schemes, Pat’s was a mission of radical transparency. Readers hoping to start an online business gained a realistic understanding of the work involved, as well as the time and investment required to get started. The income reports were one of the Smart Passive Income site’s most popular features and ran until 2017 when we determined that Pat’s business was no longer representative of our average reader’s business. The Smart Passive Income Podcast with Pat Flynn launched in 2010 and has consistently been one of the most popular business podcasts, with over 80 million downloads since. The podcast has been instrumental in helping us serve a worldwide audience with the most powerful online business strategies. Our north star at SPI has always been providing actionable, ethical business advice, whether through free content, books, courses, or now membership communities. About Winning Edits Matt Gartland started Winning Edits in 2011 as a creative agency for author entrepreneurs, specializing in all aspects of book production, including editing, design, and self-publishing support. Over time, the agency’s services grew to support a wide variety of content production, including blogs, podcasts, and online courses. Winning Edits long served as Smart Passive Income’s creative agency. Winning Edits has been the secret behind-the-scenes partner to many bestselling books and other transformational content in the entrepreneurial space. One of Matt’s true gifts is finding and developing talent, and Winning Edits grew to have a deep bench of creative, skilled staff. It was clear as time went on that for everyone on the Winning Edits team, Smart Passive Income was the favorite customer — a combination of enjoying Pat as a person, the commitment to ethical advice, and the wonderful Smart Passive Income audience. As Smart Passive Income grew, so too did the volume of its creative needs, setting the stage for the merger of these two organizations into a single brand: SPI Media. The latest news at SPI Newsroom | December 16, 2024 Smart Passive Income Unites Two Entrepreneurial Communities with a Tiered Membership Model The merger enhances access to high-quality resources, support, and connections for entrepreneurs at every stage of their journey.Continue Reading Newsroom | June 3, 2024 SPI Media Welcomes Award-Winning Author Pamela Slim to Its Experts in Residence Program Business expert, acclaimed author, and agency owner Pamela Slim levels up the Experts in Residence programContinue Reading Newsroom | June 3, 2024 SPI Media Welcomes Yasmine Salem Hamdan to Its Experts in Residence Program Yasmine Salem Hamdan is dedicated to modernizing legal education and protection for online businesses.Continue Reading Newsroom | June 3, 2024 Meet Expert in Residence Nausheen I. Chen Nausheen I. Chen joins the Experts in Residence program with a distinguished track record as a public speaker and public speaking coach.Continue Reading Newsroom | May 8, 2024 Amy Nelson Joins SPI Media’s Experts in Residence Program Amy Nelson brings her passion for amplifying the experiences of working women to SPI’s Experts in Residence Program.Continue Reading Newsroom | April 10, 2024 SPI Media Welcomes Filmmaker Caleb Wojcik to its Experts in Residence Program Caleb Wojcik’s acclaimed expertise in filmmaking enhances the Experts in Residence Program, offering entrepreneurs unparalleled insight and value.Continue Reading Newsroom | April 10, 2024 SPI Media Launches Groundbreaking Experts in Residence Program to Empower Entrepreneurs SPI Media’s innovative Experts in Residence Program redefines entrepreneurial education, offering comprehensive, world-class mentorship within the online SPI Pro Community.Continue Reading The values that underlie everything we do at SPI Mission A mission is a company’s north star. It establishes a reason for being — a “why” we exist. All of our work is guided by this simple, empowering, unifying statement. Our Mission: To guide new entrepreneurs from idea to income through education, feedback, and accountability. Vision A vision is a direction, not a current-state reality; it’s something we work to achieve. Our vision is informed by the mission and describes that mission in precise, actionable terms. Our Vision: We believe entrepreneurship is the best path to personal fulfillment, financial independence, and controlling your future. Core Values Be Kind, No Exceptions Give a Hoot Learn from Everything Bring together, stay together Deliver on Your Promises Meet Team SPI Pat Flynn Founder Matt Gartland President and Co-Founder Caleb Wojcik Chief Executive Officer Kristen Campbell Director of Operations Sandy Mann Director of Marketing Mindy Peters Head of Data and Technology Tali Leibowitz Community Team Manager Ashley Gore Education & Programming Specialist David Masnato Community Experience Specialist Kelsey Bressie Marketing Specialist Community is at the heart of everything we do Hey, hi, hello! We’re Pat and Matt, the two entrepreneurs behind SPI. To us, community is more than a buzzword. It’s our purpose and our business model. Pat created SPI back in 2009 — this was at the beginning of what we now call the “creator economy.” SPI quickly became one of the best places to learn the ropes of being an online entrepreneur. Since then, SPI has grown to an audience of over 130,000. Matt joined forces with Pat at the end of 2018. He led the charge to create SPI Pro — our first community, which launched in 2020. To date, we’re proud to serve and support over 1,200 entrepreneurs committed to finding success on their terms. We’ve lived the journey you’re on now. It’s thrilling. It’s hard. It’s worth it. Keep going. And if you like, let us (with our team and community of peers and experts) help you. We’re in this together."
