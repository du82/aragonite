title = "Email Marketing Magic | Smart Passive Income"
description = "The Email Marketing Magic course teaches you how to start and grow your email marketing program. Part of SPI All-Access Pass."
full_description = '''Email Marketing Magic Part of the SPI Community course library. Learn how to polish your email strategy to engage more readers, make more sales, and grow your brand. SEE WHAT YOU’LL LEARN ⤵ Learn about the course .wistia-modal-button a { text-decoration: none; } .wistia-modal-button { position: relative; overflow: hidden; pointer-events: all; transition: all 0.2s ease-in-out; } .wistia-modal-button a::before { content: ""; position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; transition: all 0.2s ease-in-out; cursor: pointer; pointer-events: all; z-index: 1; } .wistia-modal-button:hover { background-color: var(--wp--preset--color--primary)!important; } .wistia-modal-button:hover a { text-decoration: none; } .wistia_click_to_play { position: inherit!important; } Learn what to write and when to send it Do your email newsletters take a ton of time, give you a ton of anxiety, and honestly, don’t get many opens? Let’s change that. Pat Flynn will teach you exactly what emails to send, to whom, and at what time to help you get more engagement—and eventually more sales. Instead of worrying about unsubscribes and people who complain about you sending emails, you’re going to get thanked by your readers for sending them! Start at the beginning We start from the beginning to set you up for success. Even if you have an email list already, most people overlook some key items that affect how emails show up in people’s inboxes (or even if they show up at all). Clear action items At the end of each lesson, Pat gives you a very clear, very manageable action item—your assignment for the lesson. This makes sure that you are making steady, ongoing progress and that you start seeing results right away. Go beyond the basics Gain a professional-level understanding of who is on your list, and how to talk directly to them instead of just “blasting” messages to everyone. Pat will teach you which tools play a part in email marketing success, and then demonstrate step-by-step how to use them. You don’t have to be a great writer Don’t fret if your writing skills aren’t strong. We’ve included all kinds of email templates that you can use in different parts of your business. Just copy and paste so that you can move on. Easy-to-follow video tutorials Walk you through the entire process with step-by-step videos, so that even if you’re the most technologically challenged person in the world, you’ll be able to get things done. Learn what makes your audience happy Instead of worrying about unsubscribes and people who complain, you’ll learn how to send emails your audience actually WANTS to read, even if you’re selling something. Focus on simplicity over complication Email marketing can turn into a giant complicated nightmare, but that does no one any good. Learn to leverage the strategies that give you the biggest ROI with the least amount of overwhelm. This isn’t push-button easy, but we simplify and reduce the overwhelm as much as possible so that you can finally take action and make emails work for you. Advice that grows with you As your business expands, you can venture into the more advanced areas of the course, such as lessons on segmentation or how to use advanced tools like RightMessage, to help you take growth, monetization and automation to new levels. Ready to learn email marketing? The SPI Community has the education, support, and accountability you need to progress in your business. Join us now Learn to use Kit Kit (formerly called ConvertKit) is our favorite email service provider—it strikes a balance between intuitive usability and powerful automation. All step-by-step videos in the course use Kit. You don’t have to use Kit to succeed with this course, but we highly recommend it. [Full disclosure: SPI founder Pat Flynn is a compensated advisor and SPI Media is an affiliate for Kit.] Meet Your Course Instructor Hi, I’m Pat Flynn. If you’re an entrepreneur, podcaster, YouTuber, blogger, course instructor, consultant, coach, author or any other creator who is building an audience, I can help. Ever since I was let go from my architecture job in 2008, I’ve run my own businesses, and it didn’t take long for me to realize just how important email marketing was to the equation of building a successful business. In fact, I’ve gotten to become so obsessed with email, that I actually became an advisor to an email marketing company, Kit, in 2014. Since then, it’s become an even bigger focus of mine, and on SmartPassiveIncome.com, it’s no longer just me – I have a whole team of people whose focus is delivering value through email so that we can help the most people possible. I’ve generated a few million dollars online since 2008, and I can safely say that email marketing has had to do with almost all of that income. I’m excited to share with you what works, and what doesn’t, and help you finally get a grasp on this thing that most people try to avoid. It can make all the difference. Email Marketing Magic Course Outline Welcome, Students! Welcome! Watch This First Part 1 / Module 1: Setup and Foundation Lesson 01: Welcome! The Purpose of Email Lesson 02: Your (ESP) Email Service Provider Lesson 03: Quick Settings & A Professional Email Address Lesson 04: Basic Email Terms and Definitions (Overview) Lesson 05: The Design and Voice of Your Emails Part 1 / Module 2: Optimizing Entry Points Welcome to Module 2 Lesson 01: Create Forms that Convert Lesson 02: Build Great Landing Pages Lesson 03: Make Better Lead Magnets Lesson 04: Select Your “Signature Download” Lesson 05: Create Content Upgrades that Convert Lesson 06: Customizing Thank You Pages that Rock Part 1 / Module 3: Grow Your List Welcome to Module 3 Lesson 01: Audit Your Website Lesson 02: Collect Emails from a Podcast Lesson 03: Collect Emails from a YouTube Video Lesson 04: Earn Email Subscribers from Guest Appearances Lesson 05: Radically Grow Your List with Webinars Lesson 06: Create a Challenge that Moves People Lesson 07: 100 Emails Challenge Lesson 08: Recommendations and the Creator Network Part 1 / Module 4: What to Send Welcome to Module 4 Lesson 01: Broadcast Emails Lesson 02: Autoresponder Emails Lesson 03: Newsletters, Digests, and Nurture Sequences Lesson 04: The Email Template Bank Lesson 05: WHEN to Send Emails Part 1 / Module 5: Optimizing Your Emails Welcome to Module 5 Lesson 01: Increasing Open Rates Lesson 02: Increasing Click-Through Rates Lesson 03: Increasing Deliverability (Emails that Actually Reach the Inbox) Lesson 04: Cleaning Your List Lesson 05: Tagging and Segmentation (An Introduction) Lesson 06: What’s next? Part 2: The ABC Bank Autoresponder Bank Broadcast Bank Campaign Bank We believe in community-driven courses // Toggle Switch for Pricing Page document.addEventListener('DOMContentLoaded', function() { var checkboxes = document.querySelectorAll('.PricingToggleSwitch'); var targetElements = document.querySelectorAll('.PricingToggleTarget'); checkboxes.forEach(function(checkbox) { checkbox.addEventListener('change', function() { // Update the other checkboxes to match this one checkboxes.forEach(function(otherCheckbox) { otherCheckbox.checked = checkbox.checked; }); // Add or remove the class from target elements if(checkbox.checked) { targetElements.forEach(function(element) { element.classList.add('has-annual-pricing'); }); } else { targetElements.forEach(function(element) { element.classList.remove('has-annual-pricing'); }); } }); }); }); /* Toggle Switch */ .pricing-toggle { margin: auto; text-align: center; display: flex; } /** Switch -------------------------------------*/ .pricing-toggle-switch input { position: absolute; opacity: 0; } /** * 1. Adjust this to size */ .pricing-toggle-switch { display: inline-block; font-size: 16px; /* 1 */ height: 1em; width: 2em; background: #E7E9E9; border-radius: 2em; padding: 3px 4px; } .pricing-toggle-switch div { height: 1em; width: 1em; border-radius: 1em; background: #FFF; -webkit-transition: all 300ms; -moz-transition: all 300ms; transition: all 300ms; } .pricing-toggle-switch input:checked + div { -webkit-transform: translate3d(100%, 0, 0); -moz-transform: translate3d(100%, 0, 0); transform: translate3d(100%, 0, 0); background-color: #00853C; } .pricing-toggle-switch:has(input:checked) { background-color: #CCE7D8; } .PricingToggleTarget.has-annual-pricing .pricing-quarterly { display: none; } .PricingToggleTarget.has-annual-pricing .pricing-annual { display: block; } .pricing-quarterly { display: block; } .pricing-annual { display: none; } Save 16% with annual billing Start Do It Yourself $49 / month Billed quarterly for $147 $41 / month Billed annually for $490 Join Start As a Start member, you’ll have access to: A network of like-minded entrepreneurs through direct messaging and active community discussion channels SPI’s entire library of pre-recorded courses Live and recorded workshops Mini-courses Accelerate Do It Together $99 / month Billed quarterly for $297 $83 / month Billed annually for $990 Join Accelerate Everything in Start, plus: Exclusive office hours with Pat Flynn twice a month Live cohort-based course accelerators Monthly post-based quests Early access to new courses Member-led mastermind groups Thrive Vetted Entrepreneurs $149 / month Billed quarterly for $447 $125 / month Billed annually for $1490 Join the Waitlist Everything in Accelerate, plus: Full-Time Entrepreneur Playbook — filled with essential tools and templates for running a successful business Quarterly Sprints Mastermind groups led by Thrive community members Expert feedback during live Ask-Me-Anything events hosted by our Experts in Residence Advanced live office hours with Pat Flynn twice a month The Thrive tier is an application-based membership with quarterly enrollment. Doors are closed until May 2025.'''
