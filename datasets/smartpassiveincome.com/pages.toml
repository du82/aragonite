["https://www.smartpassiveincome.com/community/courses-accelerators/a-to-z-webinars"]
title = "A to Z Webinars | Smart Passive Income"
description = "The A to Z Webinars course teaches you how to start using webinars to grow your audience and sell more products. Part of SPI All-Access Pass."
full_description = '''A to Z Webinars Part of the SPI Community course library. Grow your list. Increase trust. Make more money. SEE WHAT YOU’LL LEARN ⤵ Learn about the course .wistia-modal-button a { text-decoration: none; } .wistia-modal-button { position: relative; overflow: hidden; pointer-events: all; transition: all 0.2s ease-in-out; } .wistia-modal-button a::before { content: ""; position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; transition: all 0.2s ease-in-out; cursor: pointer; pointer-events: all; z-index: 1; } .wistia-modal-button:hover { background-color: var(--wp--preset--color--primary)!important; } .wistia-modal-button:hover a { text-decoration: none; } .wistia_click_to_play { position: inherit!important; } Become a Webinar Rockstar with A to Z Webinars Introducing A to Z Webinars, a complete framework for creating, promoting, and delivering engaging webinars that help you grow your business. This course will not just help you run great webinars, but help you generate more revenue, too—even if you’re not good in front of the camera or afraid of selling. If we’ve learned anything from running SPI since 2008, it’s this: The success of your entire business depends on creating a genuine connection with your audience. People only buy from people they know, like, and trust, regardless of whether it’s online or in-person. But here’s the problem—it’s hard to create a genuine connection with your audience online! Most of the methods people use, like blogging, posting regularly on Instagram, or creating a YouTube channel, can work well, but they’re incredibly time-consuming, and they don’t always directly grow your business. So how do you build a relationship with your audience through the internet AND effectively grow your business at the same time? With webinars and virtual workshops. A to Z Webinars teaches you… The mindset to win at hosting webinars A successful webinar starts way before you go live. It starts right now, at the beginning. Getting into the right mindset and planning out your presentation will make all the difference when it’s time to go live. Learn to present in a way that’s compelling, engaging, and leaves your audience wanting more. A to Z Webinars teaches you… A technical tutorial for all stages Webinars aren’t push-button easy! I’ll show you the different equipment and software you need to run a smooth training that both you and your audience will enjoy. I’ll also walk you through my trusty pre-webinar tech checklist and show you my setup during the webinar. You’ll learn how to keep people engaged and how to deal with the unexpected. You’ll also learn how to “evergreen” the webinar, repurposing the content so that it can live on. A to Z Webinars teaches you… A plan for promotion and selling Your registration process matters. You’ll learn how to set up registration, as well as strategies for successfully promoting your webinar across your content platforms. During the webinar is one of your best opportunities for selling, but only if you treat your audience right. Learn how to weave your sales message throughout your presentation so it feels natural and compelling, without coming across pushy or too salesy. More than just a single course A to Z Webinars is part of SPI’s All-Access Pass, a supportive community of learners designed to help you actually do the work. We achieve this through our combination of exclusive live events designed to give you real-time help from and connection to other entrepreneurs, asynchronous messaging in the community, and access to our entire course library. Get your All-Access Pass Meet Your Course Instructor Hi, my name is Pat Flynn and my business runs on webinars and virtual meetings. But hosting webinars wasn’t always second nature. I didn’t know the first thing about teaching my knowledge online. I was flying blind, like so many of us are forced to do. But over the years, I’ve come to not only enjoy webinars (and get good at them) but also rely on them in my business. Hosting engaging, valuable, and compelling webinars has allowed me to build trust, grow my list, and sell my products without being sleazy or manipulative. In this brand new course, A to Z Webinars, I’ll teach you how to create, promote, and run webinars and virtual workshops that grow your list, increase trust, and help you make more money. I’ve created A to Z Webinars because I want to show you how everything I have learned, and how you can make webinars and virtual trainings can work for you, too. This isn’t a course about what worked for me years ago. I will show you exactly what I am doing TODAY in my business to get the results I want. A to Z Webinars Course Outline Welcome, Students! Welcome! Watch This First Office Hours Course Downloads Module 1: The Mindset to Win with Webinars Welcome to Module 1 Lesson 01: Why Webinars Work Lesson 02: 9 Ways to Use Webinars in Your Business and Brand Lesson 03: The #1 Mistake People Make When Starting Webinars Lesson 04: Planning Your Next Webinar Module 2: Equipment and Software Welcome to Module 2! Lesson 01: Video Equipment Lesson 02: Audio Equipment Lesson 03: Presentation Software Lesson 04: Webinar and Workshop Software Lesson 04.1 Demio Demo Lesson 04.2 Zoom Lesson 05: Email Marketing Software Module 3: Pre-Webinar Setup Welcome to Module 3! Lesson 01: What You Need Before You Setup Your Webinar Lesson 02: Setting Up a New Webinar on Demio Lesson 02.1 Setting Up a Webinar on Zoom Lesson 03: Customizing Your Webinar to Make It Great Lesson 04: Creating Reminder Emails Module 4: How to Promote Your Webinar Welcome to Module 4! Lesson 01: Your Registration Page and Share Link Lesson 02: Your Email List Lesson 02.1 Email Walkthrough Lesson 03: Your Content Platforms Lesson 04: Social Media Module 5: Preparing Your Presentation Welcome to the Recipe Book! Lesson 01: Where Do We Begin? Lesson 02: Outlining Your Presentation Lesson 03: Preparing Your Slides Lesson 04: Engagement Opportunities Module 6: Going Live—Everything You Need to Know Welcome to Module 6! Lesson 01: Tech Checklist Before Going Live Lesson 02: How to Start a Live Webinar Lesson 03: Tips to Keep People Watching Lesson 04: What to Expect During the Presentation Lesson 05: The Best Way to Practice Lesson 06: How to Record Your Webinars for Later Module 7: How to Sell on Your Webinar (WIthout Being Sleazy) Welcome to Module 7! Lesson 01: The Mindset of a Successful Selling Webinar Lesson 02: The First Five Minutes Lesson 03: The Middle of the Presentation Lesson 04: The Pitch at the End Lesson 05: Scarcity and Bonuses BONUS LESSON: The Power of Deadlines (Guest Interview) Module 8: How to Follow Up After a Webinar Is Over Welcome to Module 8! Lesson 01: Checking Your Analytics and What’s Important Lesson 02: Setting Up a Replay to Send Out Lesson 03: Email Follow-Up Sequence (No Selling) Lesson 04: Email Follow-Up Sequence (with Selling) Module 9: How to “Evergreen” Your Webinar Welcome to Module 9! Lesson 01: What Can You Do with Your Recording? Lesson 02: Where to Find Your Recording and Where to Put It Lesson 03: Including Your Webinar in an Automated Funnel with Urgency Module 10: Moving Forward A Final Message about Webinars BONUS Section: How to Use Facebook Ads to Promote Your Webinar Basics: Using Facebook to Get More Attendees Using Ads to Help Sell More (with Examples) We believe in community-driven courses // Toggle Switch for Pricing Page document.addEventListener('DOMContentLoaded', function() { var checkboxes = document.querySelectorAll('.PricingToggleSwitch'); var targetElements = document.querySelectorAll('.PricingToggleTarget'); checkboxes.forEach(function(checkbox) { checkbox.addEventListener('change', function() { // Update the other checkboxes to match this one checkboxes.forEach(function(otherCheckbox) { otherCheckbox.checked = checkbox.checked; }); // Add or remove the class from target elements if(checkbox.checked) { targetElements.forEach(function(element) { element.classList.add('has-annual-pricing'); }); } else { targetElements.forEach(function(element) { element.classList.remove('has-annual-pricing'); }); } }); }); }); /* Toggle Switch */ .pricing-toggle { margin: auto; text-align: center; display: flex; } /** Switch -------------------------------------*/ .pricing-toggle-switch input { position: absolute; opacity: 0; } /** * 1. Adjust this to size */ .pricing-toggle-switch { display: inline-block; font-size: 16px; /* 1 */ height: 1em; width: 2em; background: #E7E9E9; border-radius: 2em; padding: 3px 4px; } .pricing-toggle-switch div { height: 1em; width: 1em; border-radius: 1em; background: #FFF; -webkit-transition: all 300ms; -moz-transition: all 300ms; transition: all 300ms; } .pricing-toggle-switch input:checked + div { -webkit-transform: translate3d(100%, 0, 0); -moz-transform: translate3d(100%, 0, 0); transform: translate3d(100%, 0, 0); background-color: #00853C; } .pricing-toggle-switch:has(input:checked) { background-color: #CCE7D8; } .PricingToggleTarget.has-annual-pricing .pricing-quarterly { display: none; } .PricingToggleTarget.has-annual-pricing .pricing-annual { display: block; } .pricing-quarterly { display: block; } .pricing-annual { display: none; } Save 16% with annual billing Start Do It Yourself $49 / month Billed quarterly for $147 $41 / month Billed annually for $490 Join Start As a Start member, you’ll have access to: A network of like-minded entrepreneurs through direct messaging and active community discussion channels SPI’s entire library of pre-recorded courses Live and recorded workshops Mini-courses Accelerate Do It Together $99 / month Billed quarterly for $297 $83 / month Billed annually for $990 Join Accelerate Everything in Start, plus: Exclusive office hours with Pat Flynn twice a month Live cohort-based course accelerators Monthly post-based quests Early access to new courses Member-led mastermind groups Thrive Vetted Entrepreneurs $149 / month Billed quarterly for $447 $125 / month Billed annually for $1490 Join the Waitlist Everything in Accelerate, plus: Full-Time Entrepreneur Playbook — filled with essential tools and templates for running a successful business Quarterly Sprints Mastermind groups led by Thrive community members Expert feedback during live Ask-Me-Anything events hosted by our Experts in Residence Advanced live office hours with Pat Flynn twice a month The Thrive tier is an application-based membership with quarterly enrollment. Doors are closed until May 2025.'''
