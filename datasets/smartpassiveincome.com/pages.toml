title = "1•2•3 Affiliate Marketing | Smart Passive Income"
description = "1•2•3 Affiliate Marketing from SPI & Pat Flynn is part of the All-Access Pass library. Learn to generate more income w/ affiliate marketing."
full_description = '''1•2•3 Affiliate Marketing Part of the All-Access Pass course library. Learn to authentically generate more income with affiliate marketing. SEE WHAT YOU’LL LEARN ⤵ Learn about the course .wistia-modal-button a { text-decoration: none; } .wistia-modal-button { position: relative; overflow: hidden; pointer-events: all; transition: all 0.2s ease-in-out; } .wistia-modal-button a::before { content: ""; position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; transition: all 0.2s ease-in-out; cursor: pointer; pointer-events: all; z-index: 1; } .wistia-modal-button:hover { background-color: var(--wp--preset--color--primary)!important; } .wistia-modal-button:hover a { text-decoration: none; } .wistia_click_to_play { position: inherit!important; } Let SPI help you make more money (ethically) If you’re hoping to generate an income online, and you haven’t really taken the time to learn affiliate marketing, then you’re absolutely leaving money on the table. Chances are good that you’re facing an all-too common dilemma: how to “crack the code” of monetization and generate an income ethically from the audience you’ve been building. Maybe you’re not ready to create your own product from scratch (or you’re worried that it will make you look like you’re “selling out”) but you do know what your audience wants and needs. Affiliate marketing offers a great solution to these concerns. With affiliate marketing, you can generate an income by recommending market-tested products you already trust. Affiliate marketing is a time-tested income-generation strategy with two powerful benefits: it allows you to maintain and strengthen your audience’s hard-won trust in your brand, with no need to invest time and energy creating products of your own. Sadly, it’s easy to do affiliate marketing the wrong way—by putting money before your audience’s needs and trust, and damaging that relationship in the process. Get the All-Access Pass 1•2•3 Affiliate Marketing gives you… An action plan for getting started Step-by-step, expert instruction from affiliate marketing expert Pat Flynn. You’ll learn how to start using affiliate marketing in a way that supports your long-term goals, how to choose products for the best results, and both passive and active promotional strategies to drive sales. 1•2•3 Affiliate Marketing gives you… Video course content to walk you through the process With over four hours of video, you’ll learn about the fundamentals of an ethical affiliate marketing program, and then you’ll see, step by step, how to put it in place. All-Access Pass gives you… Ongoing help from Pat and the SPI community Ask questions at Pat’s weekly private Office Hours Zoom call, or post your question to other members of the All-Access Pass community. Get help with your questions and ask for feedback on your ideas. Meet Your Course Instructor Hi, I’m Pat Flynn, founder of SPI. Affiliate marketing changed my life. At first, I was too afraid to create my own products, and I didn’t know what to build. But over time I found that by sharing and recommending the products that had already been proven to help people, companies would pay me for sending new customers their way, and my audience would thank me for sharing those resources with them. Since 2010, when I started affiliate marketing, I’ve generated over $3.5 million from affiliate revenue alone. I even documented the details for the first ten years of my business in my monthly income reports over on smartpassiveincome.com. Affiliate marketing can be done the wrong way, or it can be done the right way. I’ve learned what works and what doesn’t, and I want to use that knowledge to teach you how to generate affiliate income ethically and effectively. If you’ve been struggling to generate an income online, and you’re not sure how to start monetizing, 1•2•3 Affiliate Marketing is for you. 1•2•3 Affiliate Marketing Course Outline Welcome, Students! Welcome! Watch This First Office Hours Course Downloads What You Need to Know Before You Begin Affiliate Marketing 101 The Mandatory Rules for Long-Term Success How to Use This Course Step 1: Choose the Right Product What Kinds of Products Work Best? Let’s Brainstorm! Choosing Your Next “Focus Product” What Is an Affiliate Link? How Do I Get an Affiliate Link? What if There’s No Affiliate Link? What Should You Do with Your Affiliate Link? Building a Relationship with the Affiliate Company Before We Begin Promoting Step 2: Passive Promotional Strategies What Are Passive Promotional Strategies? Adding Links to Your Archive Adding Links to Your New Content Setting Up Your Most Profitable Page Home Page Conversion Strategies A High-Performing Page You Likely Don’t Have Your Email Autoresponder Sequence Set Up Your Passive Promotional Strategies Step 3: Active Promotional Strategies What Are Active Promotional Strategies? The Top Tools Round-Up The Demo The Step-by-Step Process The Interview The Before and After Your Email Broadcasts Affiliate Bonuses Your First Affiliate Campaign Next Steps Affiliate Opportunities The Affiliate Marketing Recipe Book Welcome to the Recipe Book! Books Software Online Courses and Training We believe in community-driven courses // Toggle Switch for Pricing Page document.addEventListener('DOMContentLoaded', function() { var checkboxes = document.querySelectorAll('.PricingToggleSwitch'); var targetElements = document.querySelectorAll('.PricingToggleTarget'); checkboxes.forEach(function(checkbox) { checkbox.addEventListener('change', function() { // Update the other checkboxes to match this one checkboxes.forEach(function(otherCheckbox) { otherCheckbox.checked = checkbox.checked; }); // Add or remove the class from target elements if(checkbox.checked) { targetElements.forEach(function(element) { element.classList.add('has-annual-pricing'); }); } else { targetElements.forEach(function(element) { element.classList.remove('has-annual-pricing'); }); } }); }); }); /* Toggle Switch */ .pricing-toggle { margin: auto; text-align: center; display: flex; } /** Switch -------------------------------------*/ .pricing-toggle-switch input { position: absolute; opacity: 0; } /** * 1. Adjust this to size */ .pricing-toggle-switch { display: inline-block; font-size: 16px; /* 1 */ height: 1em; width: 2em; background: #E7E9E9; border-radius: 2em; padding: 3px 4px; } .pricing-toggle-switch div { height: 1em; width: 1em; border-radius: 1em; background: #FFF; -webkit-transition: all 300ms; -moz-transition: all 300ms; transition: all 300ms; } .pricing-toggle-switch input:checked + div { -webkit-transform: translate3d(100%, 0, 0); -moz-transform: translate3d(100%, 0, 0); transform: translate3d(100%, 0, 0); background-color: #00853C; } .pricing-toggle-switch:has(input:checked) { background-color: #CCE7D8; } .PricingToggleTarget.has-annual-pricing .pricing-quarterly { display: none; } .PricingToggleTarget.has-annual-pricing .pricing-annual { display: block; } .pricing-quarterly { display: block; } .pricing-annual { display: none; } Save 16% with annual billing Start Do It Yourself $49 / month Billed quarterly for $147 $41 / month Billed annually for $490 Join Start As a Start member, you’ll have access to: A network of like-minded entrepreneurs through direct messaging and active community discussion channels SPI’s entire library of pre-recorded courses Live and recorded workshops Mini-courses Accelerate Do It Together $99 / month Billed quarterly for $297 $83 / month Billed annually for $990 Join Accelerate Everything in Start, plus: Exclusive office hours with Pat Flynn twice a month Live cohort-based course accelerators Monthly post-based quests Early access to new courses Member-led mastermind groups Thrive Vetted Entrepreneurs $149 / month Billed quarterly for $447 $125 / month Billed annually for $1490 Join the Waitlist Everything in Accelerate, plus: Full-Time Entrepreneur Playbook — filled with essential tools and templates for running a successful business Quarterly Sprints Mastermind groups led by Thrive community members Expert feedback during live Ask-Me-Anything events hosted by our Experts in Residence Advanced live office hours with Pat Flynn twice a month The Thrive tier is an application-based membership with quarterly enrollment. Doors are closed until May 2025.'''
