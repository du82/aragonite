title = "Resources & Tools for Entrepreneurs | Smart Passive Income"
description = "The best tools for entrepreneurs, including apps, website plugins, business platforms, and editing software for marketing your business."
full_description = "Powerful tools of the trade for online entrepreneurs We only recommend online platforms that we use to manage and grow our own business. There’s no hype or fluff here — just the stuff we’ve found essential to our success. Over the years, we’ve worked hard testing dozens of online platforms to find the ones that can be real game-changers for your online business. Here are the critical few we believe in so much that we use them ourselves. Check out the Tools Explore Free Articles Important Disclosure: Please Read Before Proceeding We’re proud affiliates for some of these tools, meaning if you click a link for a tool and make a purchase, we earn a commission at no extra cost to you. Our recommendations are based on deep experience with and knowledge of these companies and their products. We recommend them because they are helpful and useful, not because of the commissions we may receive. Please do not spend any money on these products unless you believe they will help you achieve your goals. Affiliate links are marked with This is an affiliate link Looking for podcasts and articles instead? Smart Passive Income Podcast with Pat Flynn Weekly interviews and advice for building your online business the smart way. Listen to the Podcast Articles and Essays Enjoy in-depth guides, useful how-tos, revealing success stories, special announcements, and more published exclusively on our blog. Read the Blog Definitive Guides Our in-depth guides on essential online business skills are your fast track to learning the ropes of success as an online entrepreneur. Explore the Guides Our business runs on these platforms Try Circle This is an affiliate link 🚀 #1 Community Platform Circle The modern community platform for creators — and the easiest way to set up a premium community experience. That’s why we use it for SPI Pro and the All-Access Pass. Circle is powerful enough to support some of the largest and most successful online communities — while being easy to use for community builders who are just starting too. Circle is fully white-labeled so it can match and integrate with your brand. Your members stay looped into your community — increasing engagement, retention, and connection. Watch our video walkthrough of how you can use Circle to build your community. Already using Circle and need a little help? See our how-to tutorials here. Listen to an interview with Sid Yadav, Co-Founder and CEO at Circle. Try Kit This is an affiliate link 🚀 #1 For Building Email Lists Kit — formerly called ConvertKit Kit is the only email marketing platform we use. Kit is our #1 recommended email marketing platform because it has been built with care to the exact needs of creators building online businesses. Their user experience is very user-friendly. And segmenting our subscribers into focused groups so that we can deliver content specific to their needs has never been easier. We’re all in on Kit. Watch our walkthrough of Kit and hear why it’s our favorite email service provider. Already using Kit and need a little help? Check out our video tutorials here. Pat has talked with Nathan on the SPI Podcast several times over the years. Hear Nathan’s advice on bootstrapping a startup and the story behind why he started Kit. Sign up now This is a sponsored link Sponsored Recommendation Relay Your cash flow could be clearer with Relay Relay is small business banking that puts you in complete control of your cash flow. It’s an all-in-one money management platform with multiple checking accounts, team spend controls, no account fees, and more—so you can see what you’re earning, spending and saving. Don’t waste another day—or dollar—with traditional institutions that nickel and dime small businesses like yours, sign up for Relay today! Get $50 when you sign up and fund a Relay account Try Fusebox This is an affiliate link 🚀 #1 For Podcast Hosting Fusebox The official podcast player used by SPI! Fusebox provides your website visitors with a superior listening experience. From its powerful podcast hosting and analytics to the industry’s most elegant and responsive web players, Fusebox is a must-have tool for starting a podcast. Get three months free when you join using our affiliate link. Try Rockbase This is an affiliate link 🚀 #1 For Website Building Rockbase The smartpassiveincome.com website is built with Rockbase. We have always recommended WordPress as our website builder of choice because of how customizable the platform is, but designing an attractive WordPress website can be challenging. The Rockbase theme truly makes it easy to quickly create a WordPress website, using beautifully designed blocks that are easy to assemble. Created by talented creators for talented creators—just like you. Try Aura This is an affiliate link 🚀 #1 Security Solution Aura The tool to help keep you and your business secure. Combining financial, identity, network, and device protection, Aura offers antivirus software, VPN, password management, and more in one digital security solution. Read why identity theft is a problem and how Aura can help you stay protected. Try RightMessage This is an affiliate link 🚀 #1 For Marketing Optimization RightMessage RightMessage gives us the ability to communicate with our fans on their terms. It’s hard to get your messaging right, which harms your ability to motivate others to take a call-to-action. Thankfully, RightMessage is here to save the day. Their platform empowers you to dynamically display content and user experiences on your site tailored to individual audience types, which can dramatically boost your conversion rates. Listen to an interview with Brennan Dunn, the creator of RightMessage. Pat and Brennan discuss the power of segmentation for personalizing your customer’s journey. Use the affiliate link to get a 14-day free trial. Other cool tools we use across a variety of needs… Business Platforms Collaboration Technology Legal & Compliance Tools Marketing Platforms Podcasting Equipment & Tools Project Management Apps Sales Platforms Video Production Tools Website & Form Builders Business Platforms Aura The tool to help keep you and your business secure. Combining financial, identity, network, and device protection, Aura offers antivirus software, VPN, password management, and more all in one digital security solution. Read why identity theft is a problem and how Aura can help you stay protected. Try Aura This is an affiliate link Guideline We are so grateful that Guideline exists because without it we may never have rolled out a 401(k) plan to our team. It integrates beautifully with Gusto, which we use for payroll. And it keeps us compliant, which provides blissful peace of mind. Follow this link for three months off of your employer fees. Try Guideline This is an affiliate link Gusto Gusto makes running our SPI business a breeze. It starts with payroll, which is critical to get right for a growing business. We also use Gusto for PTO tracking, culture surveys, capturing important documents, and more. Oh, and their concierge team is dynamite. Try Gusto This is an affiliate link Help Scout There’s no way we could operate our customer care inboxes without Help Scout. We also rely on Help Scout as the home of knowledge base tutorial content for some of our offerings. It’s pure magic in the form of a software system made to delight. Try Help Scout This is an affiliate link ZenBusiness ZenBusiness provides the essential tools and guides entrepreneurs and small business owners need to create a successful business. Officially filing an LLC is a great first step… but that’s only the first step. ZenBusiness provides the ongoing education, support, and tools to quickly and easily set up and run a business on their platform. Try ZenBusiness This is an affiliate link Collaboration Technology Dropbox Dropbox is our cloud-based document storage system of choice that easily syncs with all of our team’s computers and provides simple access controls to third-party contributors. We also dabble with Dropbox Paper for elegant document creation. Try Dropbox This is an affiliate link HeySummit Make online events easy so you can spend less time building while using the tools that you already know and love. HeySummit can bring your audience together on your terms — offering integrations with popular web platforms, you can launch your first (or next) event within minutes! Try HeySummit This is an affiliate link SavvyCal SavvyCal makes scheduling easy by allowing your recipient to compare their calendar with yours to find availability. You can connect multiple calendars and offer different meeting types. Our link gets you your first paid month free after your 7-day trial. Try SavvyCal This is an affiliate link Slack Slack is our beloved digital HQ for all things SPI. We organize all of our communications in Slack using various channels tailored to unique projects, departments, and hierarchies. It’s made email almost a thing of the past, which is glorious for our productivity. Try Slack This is an affiliate link Legal & Compliance Tools Doola Doola, formerly Startpack.io, helps global online entrepreneurs form US LLCs, supporting customers through the incorporation process so they can confidently collect payments, build credibility, stay legal, and make more money. Try Doola This is an affiliate link HelloSign The document signing process can be a real hassle — emailing various PDFs back and forth, scanning hard copies, etc. Thankfully, there’s a much faster, easier, and more secure way — use HelloSign. We use it for all of our sensitive documents, and always will. Try HelloSign This is an affiliate link Iubenda Iubenda ensures that your website is compliant with the latest privacy laws. They have a variety of services, including policy and term generators, cookie management, and consent solutions. Of the solutions available, we’ve found this one easiest to use. Try Iubenda This is an affiliate link Marketing Platforms Bonjoro Bonjoro is a game-changing tool that lets you send personal videos to new leads and customers. Whether you’re in sales, marketing, or customer service, Bonjoro helps you get more engagement. Plus, it seamlessly integrates with CRMs and tools like Slack and Kit. We’ve been so impressed by how much engagement we’ve seen with Bonjoro! Try Bonjoro This is an affiliate link Kit Kit is the only email marketing platform we use, and will ever use. Kit is our #1 recommended email marketing platform because it has been built with care to the exact needs of creators building online businesses. Their user experience is very user-friendly. And segmenting our subscribers into focused groups so that we can deliver content specific to their needs has never been easier. We’re all in on Kit. Try Kit This is an affiliate link Copy.ai Write better copy and get past your writer’s block! CopyAI offers automated creativity tools to generate marketing copy in seconds. Built on top of the world’s most advanced AI language model, CopyAI is helping thousands of people turbo-charge their creativity. Try Copy.ai This is an affiliate link HubSpot HubSpot is an AI-powered customer platform that helps businesses of all sizes grow better by connecting their marketing, sales, and customer service operations. With over 228,000 customers across 135 countries, they provide powerful yet accessible tools that scale with your business from day one. Their integrated platform combines cutting-edge technology with practical resources and education, empowering companies to focus on what matters most: their customers. Try HubSpot This is a paid sponsor link RightMessage RightMessage gives us the ability to communicate with our fans on their terms. It’s hard to get your messaging right, which harms your ability to motivate others to take a call-to-action. Thankfully, RightMessage is here to save the day. Their platform empowers you to dynamically display content and user experiences on your site tailored to individual audience types, which can dramatically boost your conversion rates. Try RightMessage This is an affiliate link Stan Store Stan Store is the fastest, easiest way for entrepreneurs to launch their online businesses. It’s an all-in-one storefront where you can sell digital products, manage income, track analytics, and more — all in just a few clicks. Set up your Stan Store in 5 minutes and start monetizing your knowledge and passions today! Get started today with a 30 day free trial of Stan Store. Try Stan Store This is an affiliate link VideoAsk by Typeform Interact face-to-face with your audience and make gathering feedback and testimonials a breeze. From conditional logic jumps, to contact forms, or closed caption and transcription support, VideoAsk enhances conversations with your audience. Try VideoAsk This is an affiliate link Podcasting Equipment The gear lists referenced here come from this article on podcasting gear. The Frugal Kit See the Frugal Kit This is an affiliate link The Jetsetter Kit See the Jetsetter Kit This is an affiliate link The Audiophile Kit See the Audiophile Kit This is an affiliate link The In-Person Kit See the In-Person Kit This is an affiliate link The YouTuber Add-On Kit See the YouTuber Add-On This is an affiliate link Podcasting Tools Descript Descript offers simple and powerful collaborative tools to edit your audio and video just like a text document! Remove the tedious work that often stands between an idea and its expression and focus on developing your craft instead of getting side-tracked with platform fatigue. Try Descript This is an affiliate link Fusebox The official podcast player used by SPI! Fusebox provides your website visitors with a superior listening experience. From its powerful podcast hosting and analytics to the industry’s most elegant and responsive web players, Fusebox is a must-have tool for starting a podcast. Get three months free when you join using our affiliate link. Try Fusebox This is an affiliate link Podcast Hawk Take the work out of getting booked and experience a smarter way to get exposure. Podcast Hawk is the smartest way to get booked, using time-saving and cost-effective software. Guest appearances on podcasts are a great way to promote your brand and grow your business, but you don’t have to do it alone. Try Podcast Hawk This is an affiliate link Podpage The easiest way to create a turnkey website for your podcast, no coding knowledge required—and it automatically updates every time you publish a new episode. Upgrade to their Pro plan to add on even more features, like email address collection, voicemails, and importing reviews. Try Podpage This is an affiliate link Project Management Apps CoSchedule If you’re looking for a content-specific project management solution, then look no further than CoSchedule. It integrates seamlessly with your WordPress blog, allows you to create standardized editorial workflows, and centralizes all content creation tasks. Try CoSchedule Monday.com Monday.com "
