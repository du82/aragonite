["https://www.smartpassiveincome.com/affiliate-disclaimer"]
title = "Affiliate Disclaimer | Smart Passive Income"
description = "SPI Media is built on an ethos of transparency. This affiliate disclaimer outlines how we handle commissions from products and services."
full_description = "Hi. Pat Flynn, founder of SPI, here. I’ve always believed in transparency on the web and so I am disclosing that I’ve included certain products and links to those products on this site that SPI Media LLC will earn an affiliate commission for any purchases you make. My goal with the blog is to help educate you on the possibilities that exist for a blogger in practically any field, but please understand I am doing this as a for-profit business and, frankly, so should you with your site unless you have some charitable endeavor in mind. The site has grown so big at this point that it is nearly impossible to go back through and list each and every program that I have an affiliate agreement with. Given this, you should assume that any links leading you to products or services are affiliate links that SPI Media LLC will receive compensation from just to be safe. Having said that, there are millions of products and services on the web that relate to blogging and making money online. I only promote those products or services that I have investigated and truly feel deliver value to you. Examples would include the banners for Buzzsprout, Teachable, and Circle. I’m also an affiliate and advisor for companies such as Leadpages, ConvertKit, and Samcart. SmartPassiveIncome.com is also a participant in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means for sites to earn advertising fees by advertising and linking to Amazon.com. Please note that I have not been given any free products, services, or anything else by these companies in exchange for mentioning them on the site. The only consideration is in the form of affiliate commissions or compensation as an advisor for a few companies. If you have any questions regarding the above, please do not hesitate to contact me by using the contact page. It can be accessed on the menu above. Cheers and good luck! Pat Flynn"
