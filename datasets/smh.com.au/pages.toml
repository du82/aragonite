full_description = "Just inAdvertisementLatestExtreme weatherFeeling stressed about Cyclone Alfred? Here are some strategies to help you copeOne south-east mum says she’s “extremely anxious and terrified for my child”. But there are some stress-busting strategies to help you ride the storm.27 minutes agoby Neesha SinnyaUpdatedExtreme weatherCyclone Alfred: Everything Queensland and NSW residents need to knowCyclone Alfred is expected to make landfall late Thursday, or early Friday morning. What damage will it cause, and where will it flood? We answer your questions.1 hour agoby Marissa CalligerosUpdatedExtreme weatherCyclone Alfred slows, set to arrive later than expectedCyclone Alfred has slowed considerably as it moves towards the coast, and could now make landfall as late as Friday evening.1 hour agoby Cloe Read and Marissa CalligerosExtreme weather‘It can be quite intense’: What to expect when Cyclone Alfred strikesYetta Gurtner, who knows a thing or two about what it’s like to go through a cyclone, describes the noise, danger and fear, and offers strategies for staying safe.1 hour agoby Cameron AtfieldUpdatedExtreme weather‘Three natural disaster events in one’: Northern NSW braces for Cyclone AlfredEvacuation centres have been set up, flights cancelled and schools closed as the category 2 storm moves towards land.March 5, 2025by Riley Walter and Kayla OlayaAdvertisementExclusiveAustralia votesLabor tips $1.1 billion into pothole-ridden freewayPolitical support federal and state Labor has sunk in Victoria over the past 18 months, adding urgency to the case for new federal funding for Victorian roads.March 5, 2025by Paul SakkalExtreme weatherCyclone Alfred LIVE updates: BoM warn storm could become category 3 as south-east Queensland, northern NSW residents continue to brace for direct hitFor the first time in three decades, Brisbane is battening down for the arrival of a tropical cyclone. Follow us here for breaking news and advice throughout the day.March 5, 20