hich was seen as disrespectful of British soldiers.March 5, 2025by Rob HarrisUpdatedAntisemitismSydney nurse charged over antisemitic video, drugsAhmad Rashad Nadir is the second Bankstown Hospital nurse to be charged over the video shared by Israeli social media influencer Max VeiferMarch 5, 2025by Sally RawsthorneAnalysisAustralian cricket‘They’ve got to grow up’: India’s biggest advantage against Australia wasn’t what you thinkIndia’s coach Gautam Gambhir snapped at reporters amid suggestions of undue advantages for India at the Champions Trophy.March 5, 2025by Daniel BrettigTrump diplomacyThe Wi-Fi code is TrumpLovesYou - but no one is feeling itAliona Khrul went to Trump Pizza Station to get a coffee and a tuna sandwich on her lunch break. What she heard when she got there left her in tears.March 5, 2025by Kim BarkerAdvertisementAustralian TVIf you haven’t been paying attention, Sam Pang’s here to rescue the talk showThe popular comedian is preparing to take on one of the most recently cursed formats"
