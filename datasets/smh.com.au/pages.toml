["https://smh.com.au/business/markets/asx-set-to-fall-wall-street-dives-as-trump-sparks-trade-war-20250305-p5lgya.html"]
title = "Markets today: ASX posts lowest close of the year as trade war kicks off"
description = "The Australian sharemarket was awash with red on Wednesday as investors digest the impact of an escalating trade war between the US and its key trading partners."
full_description = 'UpdatedBusinessMarketsWorld markets{"@context":"http://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"https://www.smh.com.au/business","name":"Business"}},{"@type":"ListItem","position":2,"item":{"@id":"https://www.smh.com.au/business/markets","name":"Markets"}},{"@type":"ListItem","position":3,"item":{"@id":"https://www.smh.com.au/topic/world-markets-hvj","name":"World markets"}}]}ASX posts lowest close of the year as trade war kicks offBy Gemma Grant and Cindy YinUpdated March 5, 2025 — 5.47pmfirst published at 5.16amSaveLog in, register or subscribe to save articles for later.Save articles for laterAdd articles to your saved list and come back to them any time.Got itNormal text sizeLarger text sizeVery large text sizeAdvertisementWelcome to your five-minute recap of the trading day.The numbersThe Australian sharemarket extended its losses, posting its lowest close this year on Wednesday, as the escalating trade war between the US and its key trading partners triggered another sell-off on Wall Street overnight.The S&P/ASX200 plunged to 8097.8 points in midday trade and was unable to wind back losses throughout the day, closing 57 points, or 0.7 per cent, lower at 8141.1 points. Nine of the market’s 11 industry sectors declined, with losses led by consumer staples and energy stocks. The losses come after the local market lost 0.6 per cent on Tuesday.Wall Street fell across the board as investors digested the reality of Trump’s trade war..Credit: BloombergThe Australian dollar was 0.3 per cent weaker, fetching US62.56¢.The liftersSome respite for the day came from the mining giants. BHP (up 0.2 per cent) and Rio Tinto (up 0.3 per cent) both traded in the green, while gold miners Newmont gained 0.6 per cent amid a flight to safe haven assets such as gold.Tech stocks were buoyed by a 1.2 per cent lift for WiseTech. The embattled software maker announced on Wednesday that it would appoint a new director within a month to ensure that it fulfils all ASX requirements within its audit and risk committee.Australia’s largest listed operator and owner of data centres NextDC was also up 0.7 per cent.AdvertisementThe laggardsConsumer staples suffered the biggest falls, dragged down by supermarket giants Woolworths (down 3.9 per cent) and Coles (down 4.4 per cent). Penfolds maker Treasury Wine Estates (down 5.6 per cent) and bottle shop owner Endeavour Group (down 1.4 per cent) also posted a poor session.LoadingHaving largely defied the Trump slump on Tuesday, the market’s financial heavyweights also traded lower, with the big four banks all in the red. CBA, the nation’s biggest lender, fell 0.9 per cent. Westpac shed 1 per cent, NAB lost 1.4 per cent and ANZ Bank fell 0.9 per cent. Fintech Block – which owns point-of-sale systems Square, Cash App and Afterpay – dragged the financials sector down further with a 4.1 per cent slide. Insurance stocks had a mixed session amid rising concern about the potential damage from Cyclone Alfred, which is expected to make landfall as a category 2 storm near Brisbane at about 2am on Friday, and is forecast to bring with it up to 800 millimetres of rain over four days in parts of north-east NSW. QBE lost 1.5 per cent but IAG (up 1.4 per cent) and Suncorp (up 0.3 per cent) closed in the green.Energy stocks, which had led Tuesday’s falls, extended their losses as the uncertainty in global markets weighed on oil prices. West Texas Intermediate fell below $US68 a barrel after sliding 3 per cent over the past three sessions. Brent closed near $US71 on Tuesday. Oil and gas giant Woodside edged down 1.5 per cent, while Santos and refiner Ampol lost 1.6 per cent and 4.7 per cent, respectively.Wall Street suffered the worst two-day drop since December as President Donald Trump’s trade war added to worries about the world’s largest economy. The Trump administration on Tuesday imposed tariffs on imports from Canada and Mexico and doubled its levies on imports from China. All three countries announced retaliatory actions, sparking concern about global trade.Most traded shares on IG Markets, March 2025.Credit: IG Markets.The lowdownThe market slump extended further after data showed Australia’s economy accelerated in the final three months of last year, supporting the Reserve Bank’s cautious approach to further interest rate cuts. Gross domestic product advanced 0.6 per cent, in line with economists’ estimate and double the pace recorded in the third quarter, the Australian Bureau of Statistics said. On a per capita basis, GDP rose 0.1 per cent following seven consecutive quarters of falls.Although slightly better than expected, the December quarter GDP outcome can “hardly be described as a beautiful set of numbers,” said David Bassanese, chief economist at Betashares.Loading“The economy remains stuck in the slow lane, thanks to high interest rates bearing down on private demand,” Bassanese said. “A key takeaway is that household consumer spending remained subdued in final months of 2024 despite the mid-year tax cuts.“There’s also growing signs that the persistent weakness in consumer spending has started to take its toll on business investment, further dampening overall private demand. Today’s report suggests the risk of a strong bounce back in private demand – especially consumer spending – in the absence of lower interest rates seems low,” he said.In the US, the Nasdaq composite slipped 0.4 per cent on Tuesday. The tech-heavy index briefly reached a 10 per cent decline from its most recent closing high, which is what the market considers a correction, but gains for Nvidia, Microsoft and other tech heavyweights helped pare those losses.The recent decline in US stocks has wiped out all of the market’s gains since Trump’s election in November. That rally had been built largely on hopes for policies that would strengthen the US economy and businesses. Worries about tariffs raising consumer prices and reigniting inflation have been weighing on both the world’s largest economy and Wall Street.Tweet of the dayQuote of the dayThe narrative around Donald Trump’s return to office was that no matter whether you loathed or loved him, he was meant to be good for Wall Street. It’s early days, but you don’t hear Trump talking about the sharemarket any more as proof of his successful management of the US economy. Instead, we’re seeing the Trump slump as he continues to rattle the economy.That’s Elizabeth Knight on Trump and big business in the US. You can read more of the column here.With AP, BloombergThe Market Recap newsletter is a wrap of the day’s trading. Get it each weekday afternoon.SaveLog in, register or subscribe to save articles for later.World marketsSharesWall StreetGemma Grant is a reporter at The Age.Connect via email.Cindy Yin is a reporter at The Sydney Morning Herald.Connect via email.Most Viewed in BusinessLoadingFrom our partnersLoading 3rd party ad contentLoading 3rd party ad contentLoading 3rd party ad contentLoading 3rd party ad contentAdvertisement'
