title = "smithy.build | Nix CI"
full_description = "Forge ahead.Smithy doesn't just hammer out nix builds, Smithy makes your team faster with intelligent CI, reproducible builds, and fast binary distribution.Let's BuildEnter the URL of a public git repo and smithy will start building it right away.Trusted byAdvanced Nix CI made simple.Smithy is a continuous integration and binary cache service that understands the structure of your Nix project, integrates with all your favorite git services, and builds for multiple target platforms.Dig deep into your derivationsSmithy analyzes your Nix project and identifies everything it depends on (IFDs included!) giving you deep insight into what's working, what isn't, and why.Always up-to-dateSmithy monitors your repositories, builds every commit, and rebuilds PRs when either the source or target change.A trusted teamSmithy is brought to you by Obsidian Systems, a functional programming and product development consultancy, and a trusted name in Nix and Haskell since 2013.Dig deep into your derivationsSmithy analyzes your Nix project and identifies everything it depends on (IFDs included!) giving you deep insight into what's working, what isn't, and why.Always up-to-dateSmithy monitors your repositories, builds every commit, and rebuilds PRs when either the source or target change.A trusted teamSmithy is brought to you by Obsidian Systems, a functional programming and product development consultancy, and a trusted name in Nix and Haskell since 2013.Realize the benefits of NixSmithy takes the effort out of using Nix at scale, and immediately provides the benefits of parallelized builds and lightning-fast binary caching to your entire team.Auto-Provisioned Binary CacheLet Smithy do the heavy lifting and easily share its build products with your team.More platforms with fewer problemsSmithy supports multiple architectures out of the box, including Linux, macOS, x86, ARM, and more.We Speak GitSmithy supports multiple git providers, including GitHub, GitLab, and self-hosted Gitea, with support for more services on the way.Try it out todayEnter the URL of a public git repository that uses nix and watch smithy build it in real-time.Let's Build"
