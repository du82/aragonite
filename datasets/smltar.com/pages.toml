full_description = '''Chapter 6 Regression In this chapter, we will use machine learning to predict continuous values that are associated with text data. Like in all predictive modeling tasks, this chapter demonstrates how to use learning algorithms to find and model relationships between an outcome or target variable and other input features. What is unique about the focus of this book is that our features are created from text data following the techniques laid out in Chapters 1 through 5, and what is unique about the focus of this particular chapter is that our outcome is numeric and continuous. For example, let’s consider a sample of opinions from the United States Supreme Court, available in the scotus (Hvitfeldt 2019b) package. library(tidyverse) library(scotus) scotus_filtered %>% as_tibble() #> # A tibble: 10,000 × 5 #> year case_name docket_number id text #> <chr> <chr> <chr> <dbl> <chr> #> 1 1903 Clara Perry, Plff. In Err. v. Cornelius L. H… 16 80304 "No.… #> 2 1987 West v. Conrail 85-1804 96216 "No.… #> 3 1957 Roth v. United States 582 89930 "Nos… #> 4 1913 McDermott v. Wisconsin Nos. 112 and… 82218 "Nos… #> 5 1826 Wetzell v. Bussard <NA> 52899 "Feb… #> 6 1900 Forsyth v. Vehmeyer 180 79609 "No.… #> 7 1871 Reed v. United States <NA> 57846 "APP… #> 8 1833 United States v. Mills <NA> 53394 "CER… #> 9 1940 Puerto Rico v. Rubert Hermanos, Inc. 582 87714 "No.… #> 10 1910 Williams v. First Nat. Bank of Pauls Valley 130 81588 "No.… #> # … with 9,990 more rows This data set contains the entire text of each opinion in the text column, along with the case_name and docket_number. Notice that we also have the year that each case was decided by the Supreme Court; this is basically a continuous variable (rather than a group membership of discrete label). If we want to build a model to predict which court opinions were written in which years, we would build a regression model. A classification model predicts a class label or group membership. A regression model predicts a numeric or continuous value. In text modeling, we use text data (such as the text of the court opinions), sometimes combined with other structured, non-text data, to predict the continuous value of interest (such as year of the court opinion). The goal of predictive modeling with text input features and a continuous outcome is to learn and model the relationship between the input features and the numeric target (outcome). 6.1 A first regression model Let’s build our first regression model using this sample of Supreme Court opinions. Before we start, let’s check out how many opinions we have for each decade in Figure 6.1. scotus_filtered %>% mutate(year = as.numeric(year), year = 10 * (year %/% 10)) %>% count(year) %>% ggplot(aes(year, n)) + geom_col() + labs(x = "Year", y = "Number of opinions per decade") FIGURE 6.1: Supreme Court opinions per decade in sample This sample of opinions reflects the distribution over time of available opinions for analysis; there are many more opinions per year in this data set after about 1850 than before. This is an example of bias already in our data, as we discussed in the overview to these chapters, and we will need to account for that in choosing a model and understanding our results. 6.1.1 Building our first regression model Our first step in building a model is to split our data into training and testing sets. We use functions from tidymodels for this; we use initial_split() to set up how to split the data, and then we use the functions training() and testing() to create the data sets we need. Let’s also convert the year to a numeric value since it was originally stored as a character, and remove the ' character because of its effect on one of the models7 we want to try out. library(tidymodels) set.seed(1234) scotus_split <- scotus_filtered %>% mutate(year = as.numeric(year), text = str_remove_all(text, "'")) %>% initial_split() scotus_train <- training(scotus_split) scotus_test <- testing(scotus_split) Next, let’s preprocess our data to get it ready for modeling using a recipe. We’ll use both general preprocessing functions from tidymodels and specialized functions just for text from textrecipes in this preprocessing. The recipes package (Kuhn and Wickham 2021b) is part of tidymodels and provides functions for data preprocessing and feature engineering. The textrecipes package (Hvitfeldt 2020a) extends recipes by providing steps that create features for modeling from text, as we explored in the first five chapters of this book. What are the steps in creating this recipe? First, we must specify in our initial recipe() statement the form of our model (with the formula year ~ text, meaning we will predict the year of each opinion from the text of that opinion) and what our training data is. Then, we tokenize (Chapter 2) the text of the court opinions. Next, we filter to only keep the top 1000 tokens by term frequency. We filter out those less frequent words because we expect them to be too rare to be reliable, at least for our first attempt. (We are not removing stop words yet; we’ll explore removing them in Section 6.4.) The recipe step step_tfidf(), used with defaults here, weights each token frequency by the inverse document frequency. As a last step, we normalize (center and scale) these tf-idf values. This centering and scaling is needed because we’re going to use a support vector machine model. library(textrecipes) scotus_rec <- recipe(year ~ text, data = scotus_train) %>% step_tokenize(text) %>% step_tokenfilter(text, max_tokens = 1e3) %>% step_tfidf(text) %>% step_normalize(all_predictors()) scotus_rec #> Recipe #> #> Inputs: #> #> role #variables #> outcome 1 #> predictor 1 #> #> Operations: #> #> Tokenization for text #> Text filtering for text #> Term frequency-inverse document frequency with text #> Centering and scaling for all_predictors() Now that we have a full specification of the preprocessing recipe, we can prep() this recipe to estimate all the necessary parameters for each step using the training data and bake() it to apply the steps to data, like the training data (with new_data = NULL), testing data, or new data at prediction time. scotus_prep <- prep(scotus_rec) scotus_bake <- bake(scotus_prep, new_data = NULL) dim(scotus_bake) #> [1] 7500 1001 For most modeling tasks, you will not need to prep() or bake() your recipe directly; instead you can build up a tidymodels workflow() to bundle together your modeling components. In tidymodels, the workflows package (Vaughan 2021b) offers infrastructure for bundling model components. A model workflow is a convenient way to combine different modeling components (a preprocessor plus a model specification); when these are bundled explicitly, it can be easier to keep track of your modeling plan, as well as fit your model and predict on new data. Let’s create a workflow() to bundle together our recipe with any model specifications we may want to create later. First, let’s create an empty workflow() and then only add the data preprocessor scotus_rec to it. scotus_wf <- workflow() %>% add_recipe(scotus_rec) scotus_wf #> ══ Workflow ════════════════════════════════════════════════════════════════════ #> Preprocessor: Recipe #> Model: None #> #> ── Preprocessor ──────────────────────────────────────────────────────────────── #> 4 Recipe Steps #> #> • step_tokenize() #> • step_tokenfilter() #> • step_tfidf() #> • step_normalize() Notice that there is no model yet: Model: None. It’s time to specify the model we will use! Let’s build a support vector machine (SVM) model. While they don’t see widespread use in cutting-edge machine learning research today, they are frequently used in practice and have properties that make them well-suited for text classification (Joachims 1998) and can give good performance (Van-Tu and Anh-Cuong 2016). An SVM model can be used for either regression or classification, and linear SVMs often work well with text data. Even better, linear SVMs typically do not need to be tuned (see Section 7.4 for tuning model hyperparameters). Before fitting, we set up a model specification. There are three components to specifying a model using tidymodels: the model algorithm (a linear SVM here), the mode (typically either classification or regression), and the computational engine we are choosing to use. For our linear SVM, let’s use the LiblineaR engine (Helleputte 2021). svm_spec <- svm_linear() %>% set_mode("regression") %>% set_engine("LiblineaR") Everything is now ready for us to fit our model. Let’s add our model to the workflow with add_model() and fit to our training data scotus_train. svm_fit <- scotus_wf %>% add_model(svm_spec) %>% fit(data = scotus_train) We have successfully fit an SVM model to this data set of Supreme Court opinions. What does the result look like? We can access the fit using extract_fit_parsnip(), and even tidy() the model coefficient results into a convenient dataframe format. svm_fit %>% extract_fit_parsnip() %>% tidy() %>% arrange(-estimate) #> # A tibble: 1,001 × 2 #> term estimate #> <chr> <dbl> #> 1 Bias 1920. #> 2 tfidf_text_later 1.50 #> 3 tfidf_text_appeals 1.48 #> 4 tfidf_text_see 1.39 #> 5 tfidf_text_noted 1.38 #> 6 tfidf_text_example 1.27 #> 7 tfidf_text_petitioner 1.26 #> 8 tfidf_text_even 1.23 #> 9 tfidf_text_rather 1.21 #> 10 tfidf_text_including 1.13 #> # … with 991 more rows The term Bias here means the same thing as an intercept. We see here what terms contribute to a Supreme Court opinion being written more recently, like “appeals” and “petitioner.” What terms contribute to a Supreme Court opinion being written further in the past, for this first attempt at a model? svm_fit %>% extract_fit_parsnip() %>% tidy() %>% arrange(estimate) #> # A tibble: 1,001 × 2 #> term estimate #> <chr> <dbl> #> 1 tfidf_text_ought -2.77 #> 2 tfidf_text_1st -1.94 #> 3 tfidf_text_but -1.63 #> 4 tfidf_text_same -1.62 #> 5 tfidf_text_the -1.57 #> 6 tfidf_text_therefore -1.54 #> 7 tfidf_text_it -1.46 #> 8 tfidf_text_which -1.40 #> 9 tfidf_text_this -1.39 #> 10 tfidf_text_be -1.33 #> # … with 991 more rows Here we see words like “ought” and “therefore.” 6.1.2 Evaluation One option for evaluating our model is to predict one time on the testing set to measure performance. The testing set is extremely valuable data, however, and in real-world situations, we advise that you only use this precious resource one time (or at most, twice). The purpose of the testing data is to estimate how your final model will perform on new data; we set aside a proportion of the data available and pretend that it is not available to us for training the model so we can use it to estimate model performance on strictly out-of-sample data. Often during the process of modeling, we want to compare models or different model parameters. If we use the test set for these kinds of tasks, we risk fooling ourselves that we are doing better than we really are. Another option for evaluating models is to predict one time on the training set to measure performance. This is the same data that was used to train the model, however, and evaluating on the training data often results in performance estimates that are too optimistic. This is especially true for powerful machine learning algorithms that can learn subtle patterns from data; we risk overfitting to the training set. Yet another option for evaluating or comparing models is to use a separate validation set. In this situation, we split our data not into two sets (training and testing) but into three sets (testing, training, and validation). The validation set is used for computing performance metrics to compare models or model parameters. This can be a great option if you have enough data for it, but often we as machine learning practitioners are not so lucky. What are we to do, then, if we want to train multiple models and find the best one? Or compute a reliable estimate for how our model has performed without wasting the valuable testing set? We can use resampling. When we resample, we create new simulated data sets from the training set for the purpose of, for example, measuring model performance. Let’s estimate the performance of the linear SVM regression model we just fit. We can do this using resampled data sets built from the training set. In tidymodels, the package for data splitting and resampling is (Silge et al. 2021). Let’s create 10-fold cross-validation sets, and use these resampled sets for performance estimates. set.seed(123) scotus_folds <- vfold_cv(scotus_train) scotus_folds #> # 10-fold cross-validation #> # A tibble: 10 × 2 #> splits id #> <list> <chr> #> 1 <split [6750/750]> Fold01 #> 2 <split [6750/750]> Fold02 #> 3 <split [6750/750]> Fold03 #> 4 <split [6750/750]> Fold04 #> 5 <split [6750/750]> Fold05 #> 6 <split [6750/750]> Fold06 #> 7 <split [6750/750]> Fold07 #> 8 <split [6750/750]> Fold08 #> 9 <split [6750/750]> Fold09 #> 10 <split [6750/750]> Fold10 Each of these “splits” contains information about how to create cross-validation folds from the original training data. In this example, 90% of the training data is included in each fold for analysis and the other 10% is held out for assessment. Since we used cross-validation, each Supreme Court opinion appears in only one of these held-out assessment sets. In Section 6.1.1, we fit one time to the training data as a whole. Now, to estimate how well that model performs, let’s fit many times, once to each of these resampled folds, and then evaluate on the heldout part of each resampled fold. set.seed(123) svm_rs <- fit_resamples( scotus_wf %>% add_model(svm_spec), scotus_folds, control = control_resamples(save_pred = TRUE) ) svm_rs #> # Resampling results #> # 10-fold cross-validation #> # A tibble: 10 × 5 #> splits id .metrics .notes .predictions #> <list> <chr> <list> <list> <list> #> 1 <split [6750/750]> Fold01 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 2 <split [6750/750]> Fold02 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 3 <split [6750/750]> Fold03 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 4 <split [6750/750]> Fold04 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 5 <split [6750/750]> Fold05 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 6 <split [6750/750]> Fold06 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 7 <split [6750/750]> Fold07 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 8 <split [6750/750]> Fold08 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 9 <split [6750/750]> Fold09 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> #> 10 <split [6750/750]> Fold10 <tibble [2 × 4]> <tibble [0 × 3]> <tibble> These results look a lot like the resamples, but they have some additional columns, like the .metrics that we can use to measure how well this model performed and the .predictions we can use to explore that performance more deeply. What results do we see, in terms of performance metrics? collect_metrics(svm_rs) #> # A tibble: 2 × 6 #> .metric .estimator mean n std_err .config #> <chr> <chr> <dbl> <int> <dbl> <chr> #> 1 rmse standard 15.6 10 0.214 Preproces'''
