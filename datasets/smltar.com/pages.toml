full_description = 'Chapter 10 Convolutional neural networks The first neural networks we built in Chapter 8 did not have the capacity to learn much about structure, sequences, or long-range dependencies in our text data. The LSTM networks we trained in Chapter 9 were especially suited to learning long-range dependencies. In this final chapter, we will focus on convolutional neural network (CNN) architecture (Yoon Kim 2014), which can learn local, spatial structure within data. CNNs can be well-suited for modeling text data because text often contains quite a lot of local structure. A CNN does not learn long-range structure within a sequence like an LSTM, but instead detects local patterns. A CNN network layer takes data (like text) as input and then hopefully produces output that represents specific structures in the data. Let’s take more time with CNNs in this chapter to explore their construction, different features, and the hyperparameters we can tune. 10.1 What are CNNs? CNNs can work with data of different dimensions (like two-dimensional images or three-dimensional video), but for text modeling, we typically work in one dimension. The illustrations and explanations in this chapter use only one dimension to match the text use case. Figure 10.1 illustrates a typical CNN architecture. A convolutional filter slides along the sequence to produce a new, smaller sequence. This is repeated multiple times, typically with different parameters for each layer, until we are left with a small data cube that we can transform into our required output shape, a value between 0 and 1 in the case of binary classification. FIGURE 10.1: A template CNN architecture for one-dimensional input data. A sequence of consecutive CNN layers incremently reduces the size, ending with single output value. This figure isn’t entirely accurate because we technically don’t feed characters into a CNN, but instead use one-hot sequence encoding (Section 8.2.2) with a possible word embedding. Let’s talk about two of the most important CNN concepts, kernels and kernel size. 10.1.1 Kernel The kernel is a small vector that slides along the input. When it is sliding, it performs element-wise multiplication of the values in the input and its own weights, and then sums up the values to get a single value. Sometimes an activation function is applied as well. It is these weights that are trained via gradient descent to find the best fit. In Keras, the filters represent how many different kernels are trained in each layer. You typically start with fewer filters at the beginning of your network and then increase them as you go along. 10.1.2 Kernel size The most prominent hyperparameter is the kernel size. The kernel size is the length of the vector that contains the weights. A kernel of size 5 will have 5 weights. These kernels can capture local information similarly to how n-grams capture location patterns. Increasing the size of the kernel decreases the size of the output, as shown in Figure 10.2. FIGURE 10.2: The kernel size affects the size of the output. A kernel size of 3 uses the information from 3 values to compute 1 value. Larger kernels learn larger and less frequent patterns, while smaller kernels will find fine-grained features. Notice how the choice of token affects how we think about kernel size. For character tokenization, a kernel size of 5 will (in early layers) find patterns in subwords more often than patterns across words, since 5 characters will typically not span multiple words. By contrast, a kernel size of 5 with word tokenization will learn patterns within sentences instead. 10.2 A first CNN model We will be using the same data, which we examine in Sections 8.1 and B.4 and use throughout Chapters 8 and 9. This data set contains short text blurbs for prospective crowdfunding campaigns on Kickstarter, along with if they were successful. Our goal of this modeling is to predict successful campaigns from the text contained in the blurb. We will also use the same preprocessing and feature engineering recipe that we created and described in Sections 8.2.1 and 9.1. Our first CNN will look a lot like what is shown in Figure 10.1. We start with an embedding layer, followed by a single one-dimensional convolution layer layer_conv_1d(), then a global max pooling layer layer_global_max_pooling_1d(), a densely connected layer, and end with a dense layer with a sigmoid activation function to give us one value between 0 and 1 to use in our binary classification task. library(keras) simple_cnn_model <- keras_model_sequential() %>% layer_embedding(input_dim = max_words + 1, output_dim = 16, input_length = max_length) %>% layer_conv_1d(filter = 32, kernel_size = 5, activation = "relu") %>% layer_global_max_pooling_1d() %>% layer_dense(units = 64, activation = "relu") %>% layer_dense(units = 1, activation = "sigmoid") simple_cnn_model #> Model: "sequential" #> ________________________________________________________________________________ #> Layer (type) Output Shape Param # #> ================================================================================ #> embedding (Embedding) (None, 30, 16) 320016 #> ________________________________________________________________________________ #> conv1d (Conv1D) (None, 26, 32) 2592 #> ________________________________________________________________________________ #> global_max_pooling1d (GlobalMaxPool (None, 32) 0 #> ________________________________________________________________________________ #> dense_1 (Dense) (None, 64) 2112 #> ________________________________________________________________________________ #> dense (Dense) (None, 1) 65 #> ================================================================================ #> Total params: 324,785 #> Trainable params: 324,785 #> Non-trainable params: 0 #> ________________________________________________________________________________ We are using the same embedding layer with the same max_length as in the previous networks so there is nothing new there. The layer_global_max_pooling_1d() layer collapses the remaining CNN output into one dimension so we can finish it off with a densely connected layer and the sigmoid activation function. This might not end up being the best CNN configuration, but it is a good starting point. One of the challenges when working with CNNs is to ensure that we manage the dimensionality correctly. The length of the sequence decreases by (kernel_size - 1) for each layer. For this input, we have a sequence of length max_length = 30, which is decreased by (5 - 1) = 4 resulting in a sequence of 26, as shown in the printed output of simple_cnn_model. We could create seven layers with kernel_size = 5, since we would end with 30 - 4 - 4 - 4 - 4 - 4 - 4 - 4 = 2 elements in the resulting sequence. However, we would not be able to do a network with 3 layers of kernel_size = 7 followed by 3 layers of kernel_size = 5 since the resulting sequence would be 30 - 6 - 6 - 6 - 4 - 4 - 4 = 0 and we must have a positive length for our sequence. Remember that kernel_size is not the only argument that will change the length of the resulting sequence. Constructing a sequence layer by layer and using the print method from keras to check the configuration is a great way to make sure your architecture is valid. The compilation and fitting are the same as we have seen before, using a validation split created with tidymodels as shown in Sections 8.2.4 and 9.1.2. simple_cnn_model %>% compile( optimizer = "adam", loss = "binary_crossentropy", metrics = c("accuracy") ) cnn_history <- simple_cnn_model %>% fit( x = kick_analysis, y = state_analysis, batch_size = 512, epochs = 10, validation_data = list(kick_assess, state_assess) ) We are using the “adam” optimizer since it performs well for many kinds of models. You may have to experiment to find the optimizer that works best for your model and data. Now that the model is done fitting, we can evaluate it on the validation data set using the same keras_predict() function we created in Section 8.2.4 and used throughout Chapters 8 and 9. val_res <- keras_predict(simple_cnn_model, kick_assess, state_assess) val_res #> # A tibble: 50,524 × 3 #> .pred_1 .pred_class state #> <dbl> <fct> <fct> #> 1 0.0550 0 0 #> 2 0.00495 0 0 #> 3 0.000920 0 0 #> 4 0.252 0 0 #> 5 1 1 1 #> 6 0.999 1 1 #> 7 0.000249 0 0 #> 8 0.0217 0 0 #> 9 0.258 0 1 #> 10 1 1 1 #> # … with 50,514 more rows We can calculate some standard metrics with metrics(). metrics(val_res, state, .pred_class, .pred_1) #> # A tibble: 4 × 3 #> .metric .estimator .estimate #> <chr> <chr> <dbl> #> 1 accuracy binary 0.811 #> 2 kap binary 0.623 #> 3 mn_log_loss binary 0.936 #> 4 roc_auc binary 0.864 We already see improvement over the densely connected network from Chapter 8, our best performing model on the Kickstarter data so far. The heatmap in Figure 10.3 shows that the model performs about the same for the two classes, success and failure for the crowdfunding campaigns; we are getting fairly good results from a baseline CNN model! val_res %>% conf_mat(state, .pred_class) %>% autoplot(type = "heatmap") FIGURE 10.3: Confusion matrix for first CNN model predictions of Kickstarter campaign success The ROC curve in Figure 10.4 shows how the model performs at different thresholds. val_res %>% roc_curve(truth = state, .pred_1) %>% autoplot() + labs( title = "Receiver operator curve for Kickstarter blurbs" ) FIGURE 10.4: ROC curve for first CNN model predictions of Kickstarter campaign success 10.3 Case study: adding more layers Now that we know how our basic CNN performs, we can see what happens when we apply some common modifications to it. This case study will examine: how we can add additional convolutional layers to our base model and how additional dense layers can be added. Let’s start by adding another fully connected layer. We take the architecture we used in simple_cnn_model and add another layer_dense() after the first layer_dense() in the model. Increasing the depth of the model via the fully connected layers allows the model to find more complex patterns. There is, however, a trade-off. Adding more layers adds more weights to the model, making it more complex and harder to train. If you don’t have enough data or the patterns you are trying to classify aren’t that complex, then model performance will suffer since the model will start overfitting as it starts memorizing patterns in the training data that don’t generalize to new data. When working with CNNs, the different layers perform different tasks. A convolutional layer extracts local patterns as it slides along the sequences, while a fully connected layer finds global patterns. We can think of the convolutional layers as doing preprocessing on the text, which is then fed into the dense neural network that tries to fit the best curve. Adding more fully connected layers allows the network to create more intricate curves, and adding more convolutional layers creates richer features that are used when fitting the curves. Your job when constructing a CNN is to make the architecture just complex enough to match the data without overfitting. One ad-hoc rule to follow when refining your network architecture is to start small and keep adding layers until the validation error does not improve anymore. cnn_double_dense <- keras_model_sequential() %>% layer_embedding(input_dim = max_words + 1, output_dim = 16, input_length = max_length) %>% layer_conv_1d(filter = 32, kernel_size = 5, activation = "relu") %>% layer_global_max_pooling_1d() %>% layer_dense(units = 64, activation = "relu") %>% layer_dense(units = 64, activation = "relu") %>% layer_dense(units = 1, activation = "sigmoid") cnn_double_dense #> Model: "sequential_1" #> ________________________________________________________________________________ #> Layer (type) Output Shape Param # #> ================================================================================ #> embedding_1 (Embedding) (None, 30, 16) 320016 #> ________________________________________________________________________________ #> conv1d_1 (Conv1D) (None, 26, 32) 2592 #> ________________________________________________________________________________ #> global_max_pooling1d_1 (GlobalMaxPo (None, 32) 0 #> ________________________________________________________________________________ #> dense_4 (Dense) (None, 64) 2112 #> ________________________________________________________________________________ #> dense_3 (Dense) (None, 64) 4160 #> ________________________________________________________________________________ #> dense_2 (Dense) (None, 1) 65 #> ================================================================================ #> Total params: 328,945 #> Trainable params: 328,945 #> Non-trainable params: 0 #> ________________________________________________________________________________ We can compile and fit this new model. We will try to keep as much as we can constant as we compare the different models. cnn_double_dense %>% compile( optimizer = "adam", loss = "binary_crossentropy", metrics = c("accuracy") ) history <- cnn_double_dense %>% fit( x = kick_analysis, y = state_analysis, batch_size = 512, epochs = 10, validation_data = list(kick_assess, state_assess) ) val_res_double_dense <- keras_predict( cnn_double_dense, kick_assess, state_assess ) metrics(val_res_double_dense, state, .pred_class, .pred_1) #> # A tibble: 4 × 3 #> .metric .estimator .estimate #> <chr> <chr> <dbl> #> 1 accuracy binary 0.810 #> 2 kap binary 0.620 #> 3 mn_log_loss binary 1.01 #> 4 roc_auc binary 0.858 This model performs well, but it is not entirely clear that it is working much better than the first CNN model we tried. This could be an indication that the original model had enough fully connected layers for the amount of training data we have available. If we have two models with nearly identical performance, we should choose the less complex of the two, since it will have faster performance. We can also change the number of convolutional layers, by adding more such layers. cnn_double_conv <- keras_model_sequential() %>% layer_embedding(input_dim = max_words + 1, output_dim = 16, input_length = max_length) %>% layer_conv_1d(filter = 32, kernel_size = 5, activation = "relu") %>% layer_max_pooling_1d(pool_size = 2) %>% layer_conv_1d(filter = 64, kernel_size = 3, activation = "relu") %>% layer_global_max_pooling_1d() %>% layer_dense(units = 64, activation = "relu") %>% layer_dense(units = 1, activation = "sigmoid") cnn_double_conv #> Model: "sequential_2" #> ________________________________________________________________________________ #> Layer (type) Output Shape Param # #> ================================================================================ #> embedding_2 (Embedding) (None, 30, 16) 320016 #> ________________________________________________________________________________ #> conv1d_3 (Conv1D) (None, 26, 32) 2592 #> ________________________________________________________________________________ #> max_pooling1d'
