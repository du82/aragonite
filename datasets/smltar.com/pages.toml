full_description = 'Chapter 7 Classification In Chapter 6, we focused on modeling to predict continuous values for documents, such as what year a Supreme Court opinion was published. This is an example of a regression model. We can also use machine learning to predict labels on documents using a classification model. For both types of prediction questions, we develop a learner or model to describe the relationship between a target or outcome variable and our input features; what is different about a classification model is the nature of that outcome. A regression model predicts a numeric or continuous value. A classification model predicts a class label or group membership. For our classification example in this chapter, let’s consider the data set of consumer complaints submitted to the US Consumer Finance Protection Bureau. Let’s read in the complaint data (Section B.3) with read_csv(). library(tidyverse) complaints <- read_csv("data/complaints.csv.gz") We can start by taking a quick glimpse() at the data to see what we have to work with. This data set contains a text field with the complaint, along with information regarding what it was for, how and when it was filed, and the response from the bureau. glimpse(complaints) #> Rows: 117,214 #> Columns: 18 #> $ date_received <date> 2019-09-24, 2019-10-25, 2019-11-08, 2019… #> $ product <chr> "Debt collection", "Credit reporting, cre… #> $ sub_product <chr> "I do not know", "Credit reporting", "I d… #> $ issue <chr> "Attempts to collect debt not owed", "Inc… #> $ sub_issue <chr> "Debt is not yours", "Information belongs… #> $ consumer_complaint_narrative <chr> "transworld systems inc. \nis trying to c… #> $ company_public_response <chr> NA, "Company has responded to the consume… #> $ company <chr> "TRANSWORLD SYSTEMS INC", "TRANSUNION INT… #> $ state <chr> "FL", "CA", "NC", "RI", "FL", "TX", "SC",… #> $ zip_code <chr> "335XX", "937XX", "275XX", "029XX", "333X… #> $ tags <chr> NA, NA, NA, NA, NA, NA, NA, NA, NA, NA, N… #> $ consumer_consent_provided <chr> "Consent provided", "Consent provided", "… #> $ submitted_via <chr> "Web", "Web", "Web", "Web", "Web", "Web",… #> $ date_sent_to_company <date> 2019-09-24, 2019-10-25, 2019-11-08, 2019… #> $ company_response_to_consumer <chr> "Closed with explanation", "Closed with e… #> $ timely_response <chr> "Yes", "Yes", "Yes", "Yes", "Yes", "Yes",… #> $ consumer_disputed <chr> "N/A", "N/A", "N/A", "N/A", "N/A", "N/A",… #> $ complaint_id <dbl> 3384392, 3417821, 3433198, 3366475, 33853… In this chapter, we will build classification models to predict what type of financial product the complaints are referring to, i.e., a label or categorical variable. The goal of predictive modeling with text input features and a categorical outcome is to learn and model the relationship between those input features, typically created through steps as outlined in Chapters 1 through 5, and the class label or categorical outcome. Most classification models do predict the probability of a class (a numeric output), but the particular characteristics of this output make classification models different enough from regression models that we handle them differently. 7.1 A first classification model For our first model, let’s build a binary classification model to predict whether a submitted complaint is about “Credit reporting, credit repair services, or other personal consumer reports” or not. This kind of “yes or no” binary classification model is both common and useful in real-world text machine learning problems. The outcome variable product contains more categories than this, so we need to transform this variable to only contain the values “Credit reporting, credit repair services, or other personal consumer reports” and “Other.” It is always a good idea to look at your data! Here are the first six complaints: head(complaints$consumer_complaint_narrative) #> [1] "transworld systems inc. \nis trying to collect a debt that is not mine, not owed and is inaccurate." #> [2] "I would like to request the suppression of the following items from my credit report, which are the result of my falling victim to identity theft. This information does not relate to [ transactions that I have made/accounts that I have opened ], as the attached supporting documentation can attest. As such, it should be blocked from appearing on my credit report pursuant to section 605B of the Fair Credit Reporting Act." #> [3] "Over the past 2 weeks, I have been receiving excessive amounts of telephone calls from the company listed in this complaint. The calls occur between XXXX XXXX and XXXX XXXX to my cell and at my job. The company does not have the right to harass me at work and I want this to stop. It is extremely distracting to be told 5 times a day that I have a call from this collection agency while at work." #> [4] "I was sold access to an event digitally, of which I have all the screenshots to detail the transactions, transferred the money and was provided with only a fake of a ticket. I have reported this to paypal and it was for the amount of {$21.00} including a {$1.00} fee from paypal. \n\nThis occured on XX/XX/2019, by paypal user who gave two accounts : 1 ) XXXX 2 ) XXXX XXXX" #> [5] "While checking my credit report I noticed three collections by a company called ARS that i was unfamiliar with. I disputed these collections with XXXX, and XXXX and they both replied that they contacted the creditor and the creditor verified the debt so I asked for proof which both bureaus replied that they are not required to prove anything. I then mailed a certified letter to ARS requesting proof of the debts n the form of an original aggrement, or a proof of a right to the debt, or even so much as the process as to how the bill was calculated, to which I was simply replied a letter for each collection claim that listed my name an account number and an amount with no other information to verify the debts after I sent a clear notice to provide me evidence. Afterwards I recontacted both XXXX, and XXXX, to redispute on the premise that it is not my debt if evidence can not be drawn up, I feel as if I am being personally victimized by ARS on my credit report for debts that are not owed to them or any party for that matter, and I feel discouraged that the credit bureaus who control many aspects of my personal finances are so negligent about my information." #> [6] "I would like the credit bureau to correct my XXXX XXXX XXXX XXXX balance. My correct balance is XXXX" The complaint narratives contain many series of capital "X"’s. These strings (like “XX/XX” or “XXXX XXXX XXXX XXXX”) are used to to protect personally identifiable information (PII) in this publicly available data set. This is not a universal censoring mechanism; censoring and PII protection will vary from source to source. Hopefully you will be able to find information on PII censoring in a data dictionary, but you should always look at the data yourself to verify. We also see that monetary amounts are surrounded by curly brackets (like "{$21.00}"); this is another text preprocessing step that has been taken care of for us. We could craft a regular expression to extract all the dollar amounts. complaints$consumer_complaint_narrative %>% str_extract_all("\\{\\$[0-9\\.]*\\}") %>% compact() %>% head() #> [[1]] #> [1] "{$21.00}" "{$1.00}" #> #> [[2]] #> [1] "{$2300.00}" #> #> [[3]] #> [1] "{$200.00}" "{$5000.00}" "{$5000.00}" "{$770.00}" "{$800.00}" #> [6] "{$5000.00}" #> #> [[4]] #> [1] "{$15000.00}" "{$11000.00}" "{$420.00}" "{$15000.00}" #> #> [[5]] #> [1] "{$0.00}" "{$0.00}" "{$0.00}" "{$0.00}" #> #> [[6]] #> [1] "{$650.00}" In Section 7.9, we will use an approach like this for custom feature engineering from the text. 7.1.1 Building our first classification model This data set includes more possible predictors than the text alone, but for this first model we will only use the text variable consumer_complaint_narrative. Let’s create a factor outcome variable product with two levels, “Credit” and “Other.” Then, we split the data into training and testing data sets. We can use the initial_split() function from rsample to create this binary split of the data. The strata argument ensures that the distribution of product is similar in the training set and testing set. Since the split uses random sampling, we set a seed so we can reproduce our results. library(tidymodels) set.seed(1234) complaints2class <- complaints %>% mutate(product = factor(if_else( product == paste("Credit reporting, credit repair services,", "or other personal consumer reports"), "Credit", "Other" ))) complaints_split <- initial_split(complaints2class, strata = product) complaints_train <- training(complaints_split) complaints_test <- testing(complaints_split) The dimensions of the two splits show that this first step worked as we planned. dim(complaints_train) #> [1] 87910 18 dim(complaints_test) #> [1] 29304 18 Next we need to preprocess this data to prepare it for modeling; we have text data, and we need to build numeric features for machine learning from that text. The recipes package, part of tidymodels, allows us to create a specification of preprocessing steps we want to perform. These transformations are estimated (or “trained”) on the training set so that they can be applied in the same way on the testing set or new data at prediction time, without data leakage. We initialize our set of preprocessing transformations with the recipe() function, using a formula expression to specify the variables, our outcome plus our predictor, along with the data set. complaints_rec <- recipe(product ~ consumer_complaint_narrative, data = complaints_train) Now we add steps to process the text of the complaints; we use textrecipes to handle the consumer_complaint_narrative variable. First we tokenize the text to words with step_tokenize(). By default this uses tokenizers::tokenize_words(). Before we calculate tf-idf we use step_tokenfilter() to only keep the 1000 most frequent tokens, to avoid creating too many variables in our first model. To finish, we use step_tfidf() to compute tf-idf. library(textrecipes) complaints_rec <- complaints_rec %>% step_tokenize(consumer_complaint_narrative) %>% step_tokenfilter(consumer_complaint_narrative, max_tokens = 1e3) %>% step_tfidf(consumer_complaint_narrative) Now that we have a full specification of the preprocessing recipe, we can build up a tidymodels workflow() to bundle together our modeling components. complaint_wf <- workflow() %>% add_recipe(complaints_rec) Let’s start with a naive Bayes model (S. Kim et al. 2006; Kibriya et al. 2005; Frank and Bouckaert 2006), which is available in the tidymodels package discrim. One of the main advantages of a naive Bayes model is its ability to handle a large number of features, such as those we deal with when using word count methods. Here we have only kept the 1000 most frequent tokens, but we could have kept more tokens and a naive Bayes model would still be able to handle such predictors well. For now, we will limit the model to a moderate number of tokens. In tidymodels, the package for creating model specifications is parsnip (Kuhn and Vaughan 2021b). The parsnip package provides the functions for creating all the models we have used so far, but other extra packages provide more. The discrim package is an extension package for parsnip that contains model definitions for various discriminant analysis models, including naive Bayes. library(discrim) nb_spec <- naive_Bayes() %>% set_mode("classification") %>% set_engine("naivebayes") nb_spec #> Naive Bayes Model Specification (classification) #> #> Computational engine: naivebayes Now we have everything we need to fit our first classification model. We can add the naive Bayes model to our workflow, and then we can fit this workflow to our training data. nb_fit <- complaint_wf %>% add_model(nb_spec) %>% fit(data = complaints_train) We have trained our first classification model! 7.1.2 Evaluation Like we discussed in Section 6.1.2, we should not use the test set to compare models or different model parameters. The test set is a precious resource that should only be used at the end of the model training process to estimate performance on new data. Instead, we will use resampling methods to evaluate our model. Let’s use resampling to estimate the performance of the naive Bayes classification model we just fit. We can do this using resampled data sets built from the training set. Let’s create 10-fold cross-validation sets, and use these resampled sets for performance estimates. set.seed(234) complaints_folds <- vfold_cv(complaints_train) complaints_folds #> # 10-fold cross-validation #> # A tibble: 10 × 2 #> splits id #> <list> <chr> #> 1 <split [79119/8791]> Fold01 #> 2 <split [79119/8791]> Fold02 #> 3 <split [79119/8791]> Fold03 #> 4 <split [79119/8791]> Fold04 #> 5 <split [79119/8791]> Fold05 #> 6 <split [79119/8791]> Fold06 #> 7 <split [79119/8791]> Fold07 #> 8 <split [79119/8791]> Fold08 #> 9 <split [79119/8791]> Fold09 #> 10 <split [79119/8791]> Fold10 Each of these splits contains information about how to create cross-validation folds from the original training data. In this example, 90% of the training data is included in each fold, and the other 10% is held out for evaluation. For convenience, let’s again use a workflow() for our resampling estimates of performance. Using a workflow() isn’t required (you can fit or tune a model plus a preprocessor), but it can make your code easier to read and organize. nb_wf <- workflow() %>% add_recipe(complaints_rec) %>% add_model(nb_spec) nb_wf #> ══ Workflow ════════════════════════════════════════════════════════════════════ #> Preprocessor: Recipe #> Model: naive_Bayes() #> #> ── Preprocessor ──────────────────────────────────────────────────────────────── #> 3 Recipe Steps #> #> • step_tokenize() #> • step_tokenfilter() #> • step_tfidf() #> #> ── Model ─────────────────────────────────────────────────────────────────────── #> Naive Bayes Model Specification (classification) #> #> Computational engine: naivebayes In the last section, we fit one time to the training data as a whole. Now, to estimate how well that model performs, let’s fit the model many times, once to each of these resampled folds, and then evaluate on the heldout part of each resampled fold. nb_rs <- fit_resamples( nb_wf, complaints_folds, control = control_resamples(save_pred = TRUE) ) We can extract the relevant information using collect_metrics() and collect_predictions(). nb_rs_metrics <- collect_metrics(nb_rs) nb_rs_predictions <- collect_predictions(nb_rs) What results do we see, in terms of performance metrics? nb_rs_metrics #> # A tibble: 2 × 6 #> .metric .estimator mean n std_err .config #> <chr> <chr> <dbl> <int> <dbl> <chr> #> 1 accuracy binary 0.807 10 0.00469 Preprocessor1_Model1 #> 2 roc_auc binary 0.884 10 0.00177 Preprocessor1_Model1 The default performance parameters for binary classification are accuracy and ROC AUC (area '
