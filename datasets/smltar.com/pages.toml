full_description = '''Chapter 8 Dense neural networks Like we discussed in the previous overview, these three chapters on deep learning for text are organized by network architecture, rather than by outcome type as we did in Chapters 6 and 7. We’ll use Keras with its Tensorflow backend for these deep learning models; Keras is a well-established framework for deep learning with bindings in Python and, via reticulate (Ushey, Allaire, and Tang 2021), R. Keras provides an extensive, high-level API for creating and training many kinds of neural networks, but less support for resampling and preprocessing. Throughout this and the next chapters, we will demonstrate how to use tidymodels packages together with Keras to address these tasks. The tidymodels framework of R packages is modular, so we can use it for certain parts of our modeling analysis without committing to it entirely, when appropriate. This chapter explores one of the most straightforward configurations for a deep learning model, a densely connected neural network. This is typically not a model that will achieve the highest performance on text data, but it is a good place to start to understand the process of building and evaluating deep learning models for text. We can also use this type of network architecture as a bridge between the bag-of-words approaches we explored in detail in Chapters 6 and 7 to the approaches beyond bag-of-words we will use in Chapters 9 and 10. Deep learning allows us to incorporate not just word counts but also word sequences and positions. Figure 8.1 depicts a densely-connected neural network architecture feed-forward. The input comes in to the network all at once and is densely (in this case, fully) connected to the first hidden layer. A layer is “hidden” in the sense that it doesn’t connect to the outside world; the input and output layers take care of this. The neurons in any given layer are only connected to the next layer. The numbers of layers and nodes within each layer are variable and are hyperparameters of the model selected by the practitioner. FIGURE 8.1: A high-level diagram of a feed-forward neural network. The lines connecting the nodes are shaded differently to illustrate the different weights connecting units. Figure 8.1 shows the input units with words, but this is not an entirely accurate representation of a neural network. These words will in practice be represented by embedding vectors because these networks can only work with numeric variables. 8.1 Kickstarter data For all our chapters on deep learning, we will build binary classification models, much like we did in Chapter 7, but we will use neural networks instead of shallow learning models. As we discussed in the overview to these deep learning chapters, much of the overall model process will look the same, but we will use a different kind of algorithm. We will use a data set of descriptions or “blurbs” for campaigns from the crowdfunding platform Kickstarter. library(tidyverse) kickstarter <- read_csv("data/kickstarter.csv.gz") kickstarter #> # A tibble: 269,790 × 3 #> blurb state created_at #> <chr> <dbl> <date> #> 1 Exploring paint and its place in a digital world. 0 2015-03-17 #> 2 Mike Fassio wants a side-by-side photo of me and Hazel eati… 0 2014-07-11 #> 3 I need your help to get a nice graphics tablet and Photosho… 0 2014-07-30 #> 4 I want to create a Nature Photograph Series of photos of wi… 0 2015-05-08 #> 5 I want to bring colour to the world in my own artistic skil… 0 2015-02-01 #> 6 We start from some lovely pictures made by us and we decide… 0 2015-11-18 #> 7 Help me raise money to get a drawing tablet 0 2015-04-03 #> 8 I would like to share my art with the world and to do that … 0 2014-10-15 #> 9 Post Card don’t set out to simply decorate stories. Our goa… 0 2015-06-25 #> 10 My name is Siu Lon Liu and I am an illustrator seeking fund… 0 2014-07-19 #> # … with 269,780 more rows The state of each observation records whether the campaign was successful in its crowdfunding goal; a value of 1 means it was successful and a value of 0 means it was not successful. The texts for the campaign descriptions, contained in blurb, are short, less than a few hundred characters. What is the distribution of characters? kickstarter %>% ggplot(aes(nchar(blurb))) + geom_histogram(binwidth = 1, alpha = 0.8) + labs(x = "Number of characters per campaign blurb", y = "Number of campaign blurbs") FIGURE 8.2: Distribution of character count for Kickstarter campaign blurbs Figure 8.2 shows that the distribution of characters per blurb is right-skewed, with two thresholds. Individuals creating campaigns don’t have much space to make an impression, so most people choose to use most of it! There is an oddity in this chart, a steep drop somewhere between 130 and 140 with another threshold around 150 characters. Let’s investigate to see if we can find the reason. We can use count() to find the most common blurb length. kickstarter %>% count(nchar(blurb), sort = TRUE) #> # A tibble: 151 × 2 #> `nchar(blurb)` n #> <int> <int> #> 1 135 26827 #> 2 134 18726 #> 3 133 14913 #> 4 132 13559 #> 5 131 11320 #> 6 130 10085 #> 7 129 8786 #> 8 128 7874 #> 9 127 7239 #> 10 126 6590 #> # … with 141 more rows Let’s use our own eyes to see what happens around this cutoff point. We can use slice_sample() to draw a few random blurbs. Were the blurbs truncated at 135 characters? Let’s look at some blurbs with exactly 135 characters. set.seed(1) kickstarter %>% filter(nchar(blurb) == 135) %>% slice_sample(n = 5) %>% pull(blurb) #> [1] "A science fiction/drama about a young man and woman encountering beings not of this earth. Armed with only their minds to confront this" #> [2] "No, not my virginity. That was taken by a girl named Ramona the night of my senior prom. I'm talking about my novel, THE USE OF REGRET." #> [3] "In a city where the sun has stopped rising, the music never stops. Now only a man and his guitar can free the people from the Red King." #> [4] "First Interfaith & Community FM Radio Station needs transmitter in Menifee, CA Programs online, too CLICK PHOTO ABOVE FOR OUR CAT VIDEO" #> [5] "This documentary asks if the twenty-four hour news cycle has altered people's opinions of one another. We explore unity in one another." All of these blurbs appear coherent and some of them even end with a period to end the sentence. Let’s now look at blurbs with more than 135 characters to see if they are different. set.seed(1) kickstarter %>% filter(nchar(blurb) > 135) %>% slice_sample(n = 5) %>% pull(blurb) #> [1] "This is a puzzle game for the Atari 2600. The unique thing about this is that (some) of the cartridge cases will be made out of real wood, hand carved" #> [2] "Art supplies for 10 girls on the east side of Detroit to make drawings of their neighborhood, which is also home to LOVELAND's Plymouth microhood" #> [3] "Help us make a video for 'Never', one of the most popular songs on Songs To Wear Pants To and the lead single from Your Heart's upcoming album Autumn." #> [4] "Pyramid Cocoon is an interactive sculpture to be installed during the Burning Man Festival 2010. Users can rest, commune or cocoon in the piece" #> [5] "Back us to own, wear, or see a show of great student art we've collected from Artloop partner schools in NYC. The $ goes right back to art programs!" All of these blurbs also look fine so the strange distribution doesn’t seem like a data collection issue. The kickstarter data set also includes a created_at variable; let’s explore that next. Figure 8.3 is a heatmap of the lengths of blurbs and the time the campaign was posted. kickstarter %>% ggplot(aes(created_at, nchar(blurb))) + geom_bin2d() + labs(x = NULL, y = "Number of characters per campaign blurb") FIGURE 8.3: Distribution of character count for Kickstarter campaign blurbs over time That looks like the explanation! It appears that at the end of 2010 there was a policy change in the blurb length, shortening from 150 characters to 135 characters. kickstarter %>% filter(nchar(blurb) > 135) %>% summarise(max(created_at)) #> # A tibble: 1 × 1 #> `max(created_at)` #> <date> #> 1 2010-10-20 We can’t say for sure if the change happened on 2010-10-20, but that is the last day a campaign was launched with more than 135 characters. 8.2 A first deep learning model Like all our previous modeling, our first step is to split our data into training and testing sets. We will still use our training set to build models and save the testing set for a final estimate of how our model will perform on new data. It is very easy to overfit deep learning models, so an unbiased estimate of future performance from a test set is more important than ever. We use initial_split() to define the training and testing splits. We will focus on modeling the blurb alone in these deep learning chapters. Also, we will restrict our modeling analysis to only include blurbs with more than 15 characters, because the shortest blurbs tend to consist of uninformative single words. library(tidymodels) set.seed(1234) kickstarter_split <- kickstarter %>% filter(nchar(blurb) >= 15) %>% initial_split() kickstarter_train <- training(kickstarter_split) kickstarter_test <- testing(kickstarter_split) There are 202,092 blurbs in the training set and 67,365 in the testing set. 8.2.1 Preprocessing for deep learning Preprocessing for deep learning models is different from preprocessing for most other text models. These neural networks model sequences, so we have to choose the length of sequences we would like to include. Documents that are longer than this length are truncated (information is thrown away), and documents that are shorter than this length are padded with zeroes (an empty, non-informative value) to get to the chosen sequence length. This sequence length is a hyperparameter of the model, and we need to select this value such that we don’t: overshoot and introduce a lot of padded zeroes, which would make the model hard to train, or undershoot and cut off too much informative text from our documents. We can use the count_words() function from the tokenizers package to calculate the number of words and generate a histogram in Figure 8.4. Notice how we are only using the training data set to avoid data leakage when selecting this value. kickstarter_train %>% mutate(n_words = tokenizers::count_words(blurb)) %>% ggplot(aes(n_words)) + geom_bar() + labs(x = "Number of words per campaign blurb", y = "Number of campaign blurbs") FIGURE 8.4: Distribution of word count for Kickstarter campaign blurbs Given that we don’t have many words for this particular data set to begin with, let’s err on the side of longer sequences so we don’t lose valuable data. Let’s try 30 words for our threshold max_length, and let’s include 20,000 words in our vocabulary. We will use the recipes and textrecipes packages for data preprocessing and feature engineering for our deep learning models, just like we did for our models in Chapters 6 and 7. To use a recipe, we first specify it with the variables we want to include and the steps we want to use in feature engineering. library(textrecipes) max_words <- 2e4 max_length <- 30 kick_rec <- recipe(~ blurb, data = kickstarter_train) %>% step_tokenize(blurb) %>% step_tokenfilter(blurb, max_tokens = max_words) %>% step_sequence_onehot(blurb, sequence_length = max_length) kick_rec #> Recipe #> #> Inputs: #> #> role #variables #> predictor 1 #> #> Operations: #> #> Tokenization for blurb #> Text filtering for blurb #> Sequence 1 hot encoding for blurb The formula used to specify this recipe ~ blurb does not have an outcome, because we are using recipes and textrecipes functions on their own, outside of the rest of the tidymodels framework; we don’t need to know about the outcome here. This preprocessing recipe tokenizes our text (Chapter 2) and filters to keep only the top 20,000 words, but then it transforms the tokenized text in a new way to prepare for deep learning that we have not used in this book before, using step_sequence_onehot(). 8.2.2 One-hot sequence embedding of text The function step_sequence_onehot() transforms tokens into a numeric format appropriate for modeling, like step_tf() and step_tfidf(). However, it is different in that it takes into account the order of the tokens, unlike step_tf() and step_tfidf(), which do not take order into account. Steps like step_tf() and step_tfidf() are used for approaches called “bag of words,” meaning the words are treated like they are just thrown in a bag without attention paid to their order. Let’s take a closer look at how step_sequence_onehot() works and how its parameters will change the output. When we use step_sequence_onehot(), two things happen. First, each word is assigned an integer index. You can think of this as a key-value pair of the vocabulary. Next, the sequence of tokens is replaced with the corresponding indices; this sequence of integers makes up the final numeric representation. Let’s illustrate with a small example: small_data <- tibble( text = c("Adventure Dice Game", "Spooky Dice Game", "Illustrated Book of Monsters", "Monsters, Ghosts, Goblins, Me, Myself and I") ) small_spec <- recipe(~ text, data = small_data) %>% step_tokenize(text) %>% step_sequence_onehot(text, sequence_length = 6, prefix = "") prep(small_spec) #> Recipe #> #> Inputs: #> #> role #variables #> predictor 1 #> #> Training data contained 4 data points and no missing data. #> #> Operations: #> #> Tokenization for text [trained] #> Sequence 1 hot encoding for text [trained] What does the function prep() do? Before when we have used recipes, we put them in a workflow() that handles low-level processing. The prep() function will compute or estimate statistics from the training set; the output of prep() is a prepped recipe. Once we have the prepped recipe, we can tidy() it to extract the vocabulary, represented in the vocabulary and token columns10. prep(small_spec) %>% tidy(2) #> # A tibble: 14 × 4 #> terms vocabulary token id #> <chr> <int> <chr> <chr> #> 1 text 1 adventure sequence_onehot_9p9uj #> 2 text 2 and sequence_onehot_9p9uj #> 3 text 3 book sequence_onehot_9p9uj #> 4 text 4 dice sequence_onehot_9p9uj #> 5 text 5 game sequence_onehot_9p9uj #> 6 text 6 ghosts sequence_onehot_9p9uj #> 7 text 7 goblins sequence_onehot_9p9uj #> 8 text 8 i sequence_onehot_9p9uj #> 9 text 9 illustrated sequence_onehot_9p9uj #> 10 text 10 me sequence_onehot_9p9uj #> 11 text 11 monsters sequence_onehot_9p9uj #> 12 text 12 myself sequence_onehot_9p9uj #> 13 text 13 of sequence_onehot_9p9uj #> 14 text 14 spooky sequence_onehot_9p9uj If we take a look at the resulting matrix, we have one row per observation. The first row starts with some padded zeroes but then contains 1, 4, and 5, which we can use together with the vocabulary to construct the original sentence. prep(small_spec) %>% bake(new_data = NULL, composition = "matrix") #> _text_1 _text_2 _text_3 _text_4 _text_5 _text_6 #> [1,] 0 0 0 1 4 5 #> [2,] 0 0 0 14 4 5 #> [3,] 0 0 9 3 13 11'''
