full_description = '''Chapter 3 Stop words Once we have split text into tokens, it often becomes clear that not all words carry the same amount of information, if any information at all, for a predictive modeling task. Common words that carry little (or perhaps no) meaningful information are called stop words. It is common advice and practice to remove stop words for various NLP tasks, but the task of stop word removal is more nuanced than many resources may lead you to believe. In this chapter, we will investigate what a stop word list is, the differences between them, and the effects of using them in your preprocessing workflow. The concept of stop words has a long history with Hans Peter Luhn credited with coining the term in 1960 (Luhn 1960). Examples of these words in English are “a,” “the,” “of,” and “didn’t.” These words are very common and typically don’t add much to the meaning of a text but instead ensure the structure of a sentence is sound. Categorizing words as either informative or non-informative is limiting, and we prefer to consider words as having a more fluid or continuous amount of information associated with them. This informativeness is context-specific as well. In fact, stop words themselves are often important in genre or authorship identification. Historically, one of the main reasons for removing stop words was to decrease the computational time for text mining; it can be regarded as a dimensionality reduction of text data and was commonly-used in search engines to give better results (Huston and Croft 2010). Stop words can have different roles in a corpus. We generally categorize stop words into three groups: global, subject, and document stop words. Global stop words are words that are almost always low in meaning in a given language; these are words such as “of” and “and” in English that are needed to glue text together. These words are likely a safe bet for removal, but they are low in number. You can find some global stop words in pre-made stop word lists (Section 3.1). Next up are subject-specific stop words. These words are uninformative for a given subject area. Subjects can be broad like finance and medicine or can be more specific like obituaries, health code violations, and job listings for librarians in Kansas. Words like “bath,” “bedroom,” and “entryway” are generally not considered stop words in English, but they may not provide much information for differentiating suburban house listings and could be subject stop words for certain analysis. You will likely need to manually construct such a stop word list (Section 3.2). These kinds of stop words may improve your performance if you have the domain expertise to create a good list. Lastly, we have document-level stop words. These words do not provide any or much information for a given document. These are difficult to classify and won’t be worth the trouble to identify. Even if you can find document stop words, it is not obvious how to incorporate this kind of information in a regression or classification task. 3.1 Using premade stop word lists A quick option for using stop words is to get a list that has already been created. This is appealing because it is not difficult, but be aware that not all lists are created equal. Nothman, Qin, and Yurchak (2018) found some alarming results in a study of 52 stop word lists available in open-source software packages. Among some of the more grave issues were misspellings (“fify” instead of “fifty”), the inclusion of clearly informative words such as “computer” and “cry,” and internal inconsistencies, such as including the word “has” but not the word “does.” This is not to say that you should never use a stop word list that has been included in an open-source software project. However, you should always inspect and verify the list you are using, both to make sure it hasn’t changed since you used it last, and also to check that it is appropriate for your use case. There is a broad selection of stop word lists available today. For the purpose of this chapter, we will focus on three of the lists of English stop words provided by the stopwords package (Benoit, Muhr, and Watanabe 2021). The first is from the SMART (System for the Mechanical Analysis and Retrieval of Text) Information Retrieval System, an information retrieval system developed at Cornell University in the 1960s (Lewis et al. 2004). The second is the English Snowball stop word list (Porter 2001), and the last is the English list from the Stopwords ISO collection. These stop word lists are all considered general purpose and not domain-specific. The stopwords package contains a comprehensive collection of stop word lists in one place for ease of use in analysis and other packages. Before we start delving into the content inside the lists, let’s take a look at how many words are included in each. library(stopwords) length(stopwords(source = "smart")) length(stopwords(source = "snowball")) length(stopwords(source = "stopwords-iso")) #> [1] 571 #> [1] 175 #> [1] 1298 The lengths of these lists are quite different, with the longest list being over seven times longer than the shortest! Let’s examine the overlap of the words that appear in the three lists in an UpSet plot in Figure 3.1. An UpSet plot (Lex et al. 2014) visualizes intersections and aggregates of intersections of sets using a matrix layout, presenting the number of elements as well as summary statistics. FIGURE 3.1: Set intersections for three common stop word lists visualized as an UpSet plot The UpSet plot in Figure 3.1 shows us that these three lists are almost true subsets of each other. The only exception is a set of 10 words that appear in Snowball and ISO but not in the SMART list. What are those words? setdiff(stopwords(source = "snowball"), stopwords(source = "smart")) #> [1] "she's" "he'd" "she'd" "he'll" "she'll" "shan't" "mustn't" #> [8] "when's" "why's" "how's" All these words are contractions. This is not because the SMART lexicon doesn’t include contractions; if we look, there are almost 50 of them. str_subset(stopwords(source = "smart"), "'") #> [1] "a's" "ain't" "aren't" "c'mon" "c's" "can't" #> [7] "couldn't" "didn't" "doesn't" "don't" "hadn't" "hasn't" #> [13] "haven't" "he's" "here's" "i'd" "i'll" "i'm" #> [19] "i've" "isn't" "it'd" "it'll" "it's" "let's" #> [25] "shouldn't" "t's" "that's" "there's" "they'd" "they'll" #> [31] "they're" "they've" "wasn't" "we'd" "we'll" "we're" #> [37] "we've" "weren't" "what's" "where's" "who's" "won't" #> [43] "wouldn't" "you'd" "you'll" "you're" "you've" We seem to have stumbled upon an inconsistency: why does SMART include "he's" but not "she's"? It is hard to say, but this could be worth rectifying before applying these stop word lists to an analysis or model preprocessing. This stop word list was likely generated by selecting the most frequent words across a large corpus of text that had more representation for text about men than women. This is once again a reminder that we should always look carefully at any pre-made word list or another artifact we use to make sure it works well with our needs3. It is perfectly acceptable to start with a premade word list and remove or append additional words according to your particular use case. When you select a stop word list, it is important that you consider its size and breadth. Having a small and concise list of words can moderately reduce your token count while not having too great of an influence on your models, assuming that you picked appropriate words. As the size of your stop word list grows, each word added will have a diminishing positive effect with the increasing risk that a meaningful word has been placed on the list by mistake. In Section 6.4, we show the effects of different stop word lists on model training. 3.1.1 Stop word removal in R Now that we have seen stop word lists, we can move forward with removing these words. The particular way we remove stop words depends on the shape of our data. If you have your text in a tidy format with one word per row, you can use filter() from dplyr with a negated %in% if you have the stop words as a vector, or you can use anti_join() from dplyr if the stop words are in a tibble(). Like in our previous chapter, let’s examine the text of “The Fir-Tree” by Hans Christian Andersen, and use tidytext to tokenize the text into words. library(hcandersenr) library(tidyverse) library(tidytext) fir_tree <- hca_fairytales() %>% filter(book == "The fir tree", language == "English") tidy_fir_tree <- fir_tree %>% unnest_tokens(word, text) Let’s use the Snowball stop word list as an example. Since the stop words return from this function as a vector, we will use filter(). tidy_fir_tree %>% filter(!(word %in% stopwords(source = "snowball"))) #> # A tibble: 1,547 × 3 #> book language word #> <chr> <chr> <chr> #> 1 The fir tree English far #> 2 The fir tree English forest #> 3 The fir tree English warm #> 4 The fir tree English sun #> 5 The fir tree English fresh #> 6 The fir tree English air #> 7 The fir tree English made #> 8 The fir tree English sweet #> 9 The fir tree English resting #> 10 The fir tree English place #> # … with 1,537 more rows If we use the get_stopwords() function from tidytext instead, then we can use the anti_join() function. tidy_fir_tree %>% anti_join(get_stopwords(source = "snowball")) #> # A tibble: 1,547 × 3 #> book language word #> <chr> <chr> <chr> #> 1 The fir tree English far #> 2 The fir tree English forest #> 3 The fir tree English warm #> 4 The fir tree English sun #> 5 The fir tree English fresh #> 6 The fir tree English air #> 7 The fir tree English made #> 8 The fir tree English sweet #> 9 The fir tree English resting #> 10 The fir tree English place #> # … with 1,537 more rows The result of these two stop word removals is the same since we used the same stop word list in both cases. 3.2 Creating your own stop words list Another way to get a stop word list is to create one yourself. Let’s explore a few different ways to find appropriate words to use. We will use the tokenized data from “The Fir-Tree” as a first example. Let’s take the words and rank them by their count or frequency. 1: the 2: and 3: tree 4: it 5: a 6: in 7: of 8: to 9: i 10: was 11: they 12: fir 13: were 14: all 15: with 16: but 17: on 18: then 19: had 20: is 21: at 22: little 23: so 24: not 25: said 26: what 27: as 28: that 29: he 30: you 31: its 32: out 33: be 34: them 35: this 36: branches 37: came 38: for 39: now 40: one 41: story 42: would 43: forest 44: have 45: how 46: know 47: thought 48: mice 49: trees 50: we 51: been 52: down 53: oh 54: very 55: when 56: where 57: who 58: children 59: dumpty 60: humpty 61: or 62: shall 63: there 64: while 65: will 66: after 67: by 68: come 69: happy 70: my 71: old 72: only 73: their 74: which 75: again 76: am 77: are 78: beautiful 79: evening 80: him 81: like 82: me 83: more 84: about 85: christmas 86: do 87: fell 88: fresh 89: from 90: here 91: last 92: much 93: no 94: princess 95: tall 96: young 97: asked 98: can 99: could 100: cried 101: going 102: grew 103: if 104: large 105: looked 106: made 107: many 108: seen 109: stairs 110: think 111: too 112: up 113: yes 114: air 115: also 116: away 117: birds 118: corner 119: cut 120: did We recognize many of what we would consider stop words in the first column here, with three big exceptions. We see "tree" at 3, "fir" at 12, and "little" at 22. These words appear high on our list, but they do provide valuable information as they all reference the main character. What went wrong with this approach? Creating a stop word list using high-frequency words works best when it is created on a corpus of documents, not an individual document. This is because the words found in a single document will be document-specific and the overall pattern of words will not generalize that well. In NLP, a corpus is a set of texts or documents. The set of Hans Christian Andersen’s fairy tales can be considered a corpus, with each fairy tale a document within that corpus. The set of United States Supreme Court opinions can be considered a different corpus, with each written opinion being a document within that corpus. Both data sets are described in more detail in Appendix B. The word "tree" does seem important as it is about the main character, but it could also be appearing so often that it stops providing any information. Let’s try a different approach, extracting high-frequency words from the corpus of all English fairy tales by H.C. Andersen. 1: the 2: and 3: of 4: a 5: to 6: in 7: was 8: it 9: he 10: that 11: i 12: she 13: had 14: his 15: they 16: but 17: as 18: her 19: with 20: for 21: is 22: on 23: said 24: you 25: not 26: were 27: so 28: all 29: be 30: at 31: one 32: there 33: him 34: from 35: have 36: little 37: then 38: which 39: them 40: this 41: old 42: out 43: could 44: when 45: into 46: now 47: who 48: my 49: their 50: by 51: we 52: will 53: like 54: are 55: what 56: if 57: me 58: up 59: very 60: would 61: no 62: been 63: about 64: over 65: where 66: an 67: how 68: only 69: came 70: or 71: down 72: great 73: good 74: do 75: more 76: here 77: its 78: did 79: man 80: see 81: can 82: through 83: beautiful 84: must 85: has 86: away 87: thought 88: still 89: than 90: well 91: people 92: time 93: before 94: day 95: other 96: stood 97: too 98: went 99: come 100: never 101: much 102: house 103: know 104: every 105: looked 106: many 107: again 108: eyes 109: our 110: quite 111: young 112: even 113: shall 114: tree 115: go 116: your 117: long 118: upon 119: two 120: water This list is more appropriate for our concept of stop words, and now it is time for us to make some choices. How many do we want to include in our stop word list? Which words should we add and/or remove based on prior information? Selecting the number of words to remove is best done by a case-by-case basis as it can be difficult to determine a priori how many different “meaningless” words appear in a corpus. Our suggestion is to start with a low number like 20 and increase by 10 words until you get to words that are not appropriate as stop words for your analytical purpose. It is worth keeping in mind that such a list is not perfect. Depending on how your text was generated or processed, strange tokens can surface as possible stop words due to encoding or optical character recognition errors. Further, these results are based on the corpus of documents we have available, which is potentially biased. In our example here, all the fairy tales were written by the same European white man from the early 1800s. This bias can be minimized by removing words we would expect to be over-represented or to add words we expect to be under-represented. Easy examples are to include the complements to the words in the list if they are not already present. Include “big” if “small” is present, “old” if “young” is present. This example list has words associated with women often listed lower in rank than words associated with men. With "m'''
