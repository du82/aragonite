full_description = 'Chapter 5 Word Embeddings You shall know a word by the company it keeps. — John Rupert Firth So far in our discussion of natural language features, we have discussed preprocessing steps such as tokenization, removing stop words, and stemming in detail. We implement these types of preprocessing steps to be able to represent our text data in some data structure that is a good fit for modeling. 5.1 Motivating embeddings for sparse, high-dimensional data What kind of data structure might work well for typical text data? Perhaps, if we wanted to analyze or build a model for consumer complaints to the United States Consumer Financial Protection Bureau (CFPB), described in Section B.3, we would start with straightforward word counts. Let’s create a sparse matrix, where the matrix elements are the counts of words in each document. library(tidyverse) library(tidytext) library(SnowballC) complaints <- read_csv("data/complaints.csv.gz") complaints %>% unnest_tokens(word, consumer_complaint_narrative) %>% anti_join(get_stopwords(), by = "word") %>% mutate(stem = wordStem(word)) %>% count(complaint_id, stem) %>% cast_dfm(complaint_id, stem, n) #> Document-feature matrix of: 117,214 documents, 46,099 features (99.88% sparse) and 0 docvars. A sparse matrix is a matrix where most of the elements are zero. When working with text data, we say our data is “sparse” because most documents do not contain most words, resulting in a representation of mostly zeroes. There are special data structures and algorithms for dealing with sparse data that can take advantage of their structure. For example, an array can more efficiently store the locations and values of only the non-zero elements instead of all elements. The data set of consumer complaints used in this book has been filtered to those submitted to the CFPB since January 1, 2019 that include a consumer complaint narrative (i.e., some submitted text). Another way to represent our text data is to create a sparse matrix where the elements are weighted, rather than straightforward counts only. The term frequency of a word is how frequently a word occurs in a document, and the inverse document frequency of a word decreases the weight for commonly-used words and increases the weight for words that are not used often in a collection of documents. It is typically defined as: \[idf(\text{term}) = \ln{\left(\frac{n_{\text{documents}}}{n_{\text{documents containing term}}}\right)}\] These two quantities can be combined to calculate a term’s tf-idf (the two quantities multiplied together). This statistic measures the frequency of a term adjusted for how rarely it is used, and it is an example of a weighting scheme that can often work better than counts for predictive modeling with text features. complaints %>% unnest_tokens(word, consumer_complaint_narrative) %>% anti_join(get_stopwords(), by = "word") %>% mutate(stem = wordStem(word)) %>% count(complaint_id, stem) %>% bind_tf_idf(stem, complaint_id, n) %>% cast_dfm(complaint_id, stem, tf_idf) #> Document-feature matrix of: 117,214 documents, 46,099 features (99.88% sparse) and 0 docvars. Notice that, in either case, our final data structure is incredibly sparse and of high dimensionality with a huge number of features. Some modeling algorithms and the libraries that implement them can take advantage of the memory characteristics of sparse matrices for better performance; an example of this is regularized regression implemented in glmnet (Friedman, Hastie, and Tibshirani 2010). Some modeling algorithms, including tree-based algorithms, do not perform better with sparse input, and then some libraries are not built to take advantage of sparse data structures, even if it would improve performance for those algorithms. We have some computational tools to take advantage of sparsity, but they don’t always solve all the problems that come along with big text data sets. As the size of a corpus increases in terms of words or other tokens, both the sparsity and RAM required to hold the corpus in memory increase. Figure 5.1 shows how this works out; as the corpus grows, there are more words used just a few times included in the corpus. The sparsity increases and approaches 100%, but even more notably, the memory required to store the corpus increases with the square of the number of tokens. get_dfm <- function(frac) { complaints %>% sample_frac(frac) %>% unnest_tokens(word, consumer_complaint_narrative) %>% anti_join(get_stopwords(), by = "word") %>% mutate(stem = wordStem(word)) %>% count(complaint_id, stem) %>% cast_dfm(complaint_id, stem, n) } set.seed(123) tibble(frac = 2 ^ seq(-16, -6, 2)) %>% mutate(dfm = map(frac, get_dfm), words = map_dbl(dfm, quanteda::nfeat), sparsity = map_dbl(dfm, quanteda::sparsity), `RAM (in bytes)` = map_dbl(dfm, lobstr::obj_size)) %>% pivot_longer(sparsity:`RAM (in bytes)`, names_to = "measure") %>% ggplot(aes(words, value, color = measure)) + geom_line(size = 1.5, alpha = 0.5) + geom_point(size = 2) + facet_wrap(~measure, scales = "free_y") + scale_x_log10(labels = scales::label_comma()) + scale_y_continuous(labels = scales::label_comma()) + theme(legend.position = "none") + labs(x = "Number of unique words in corpus (log scale)", y = NULL) FIGURE 5.1: Memory requirements and sparsity increase with corpus size Linguists have long worked on vector models for language that can reduce the number of dimensions representing text data based on how people use language; the quote that opened this chapter dates to 1957. These kinds of dense word vectors are often called word embeddings. 5.2 Understand word embeddings by finding them yourself Word embeddings are a way to represent text data as vectors of numbers based on a huge corpus of text, capturing semantic meaning from words’ context. Modern word embeddings are based on a statistical approach to modeling language, rather than a linguistics or rules-based approach. We can determine these vectors for a corpus of text using word counts and matrix factorization, as outlined by Moody (2017). This approach is valuable because it allows practitioners to find word vectors for their own collections of text (with no need to rely on pre-trained vectors) using familiar techniques that are not difficult to understand. Let’s walk through how to do this using tidy data principles and sparse matrices, on the data set of CFPB complaints. First, let’s filter out words that are used only rarely in this data set and create a nested dataframe, with one row per complaint. tidy_complaints <- complaints %>% select(complaint_id, consumer_complaint_narrative) %>% unnest_tokens(word, consumer_complaint_narrative) %>% add_count(word) %>% filter(n >= 50) %>% select(-n) nested_words <- tidy_complaints %>% nest(words = c(word)) nested_words #> # A tibble: 117,170 × 2 #> complaint_id words #> <dbl> <list> #> 1 3384392 <tibble [18 × 1]> #> 2 3417821 <tibble [71 × 1]> #> 3 3433198 <tibble [77 × 1]> #> 4 3366475 <tibble [69 × 1]> #> 5 3385399 <tibble [213 × 1]> #> 6 3444592 <tibble [19 × 1]> #> 7 3379924 <tibble [121 × 1]> #> 8 3446975 <tibble [22 × 1]> #> 9 3214857 <tibble [64 × 1]> #> 10 3417374 <tibble [44 × 1]> #> # … with 117,160 more rows Next, let’s create a slide_windows() function, using the slide() function from the slider package (Vaughan 2021a) that implements fast sliding window computations written in C. Our new function identifies skipgram windows in order to calculate the skipgram probabilities, how often we find each word near each other word. We do this by defining a fixed-size moving window that centers around each word. Do we see word1 and word2 together within this window? We can calculate probabilities based on when we do or do not. One of the arguments to this function is the window_size, which determines the size of the sliding window that moves through the text, counting up words that we find within the window. The best choice for this window size depends on your analytical question because it determines what kind of semantic meaning the embeddings capture. A smaller window size, like three or four, focuses on how the word is used and learns what other words are functionally similar. A larger window size, like 10, captures more information about the domain or topic of each word, not constrained by how functionally similar the words are (Levy and Goldberg 2014). A smaller window size is also faster to compute. slide_windows <- function(tbl, window_size) { skipgrams <- slider::slide( tbl, ~.x, .after = window_size - 1, .step = 1, .complete = TRUE ) safe_mutate <- safely(mutate) out <- map2(skipgrams, 1:length(skipgrams), ~ safe_mutate(.x, window_id = .y)) out %>% transpose() %>% pluck("result") %>% compact() %>% bind_rows() } Now that we can find all the skipgram windows, we can calculate how often words occur on their own, and how often words occur together with other words. We do this using the point-wise mutual information (PMI), a measure of association that measures exactly what we described in the previous sentence; it’s the logarithm of the probability of finding two words together, normalized for the probability of finding each of the words alone. We use PMI to measure which words occur together more often than expected based on how often they occurred on their own. For this example, let’s use a window size of four. This next step is the computationally expensive part of finding word embeddings with this method, and can take a while to run. Fortunately, we can use the furrr package (Vaughan and Dancho 2021) to take advantage of parallel processing because identifying skipgram windows in one document is independent from all the other documents. library(widyr) library(furrr) plan(multisession) ## for parallel processing tidy_pmi <- nested_words %>% mutate(words = future_map(words, slide_windows, 4L)) %>% unnest(words) %>% unite(window_id, complaint_id, window_id) %>% pairwise_pmi(word, window_id) tidy_pmi #> # A tibble: 4,818,402 × 3 #> item1 item2 pmi #> <chr> <chr> <dbl> #> 1 systems transworld 7.09 #> 2 inc transworld 5.96 #> 3 is transworld -0.135 #> 4 trying transworld -0.107 #> 5 to transworld -0.00206 #> 6 collect transworld 1.07 #> 7 a transworld -0.516 #> 8 debt transworld 0.919 #> 9 that transworld -0.542 #> 10 not transworld -1.17 #> # … with 4,818,392 more rows When PMI is high, the two words are associated with each other, i.e., likely to occur together. When PMI is low, the two words are not associated with each other, unlikely to occur together. The step above used unite(), a function from tidyr that pastes multiple columns into one, to make a new column for window_id from the old window_id plus the complaint_id. This new column tells us which combination of window and complaint each word belongs to. We can next determine the word vectors from the PMI values using singular value decomposition (SVD). SVD is a method for dimensionality reduction via matrix factorization (Golub and Reinsch 1970) that works by taking our data and decomposing it onto special orthogonal axes. The first axis is chosen to capture as much of the variance as possible. Keeping that first axis fixed, the remaining orthogonal axes are rotated to maximize the variance in the second. This is repeated for all the remaining axes. In our application, we will use SVD to factor the PMI matrix into a set of smaller matrices containing the word embeddings with a size we get to choose. The embedding size is typically chosen to be in the low hundreds. Thus we get a matrix of dimension (n_vocabulary * n_dim) instead of dimension (n_vocabulary * n_vocabulary), which can be a vast reduction in size for large vocabularies. Let’s use the widely_svd() function in widyr (Robinson 2020), creating 100-dimensional word embeddings. This matrix factorization is much faster than the previous step of identifying the skipgram windows and calculating PMI. tidy_word_vectors <- tidy_pmi %>% widely_svd( item1, item2, pmi, nv = 100, maxit = 1000 ) tidy_word_vectors #> # A tibble: 747,500 × 3 #> item1 dimension value #> <chr> <int> <dbl> #> 1 systems 1 0.0165 #> 2 inc 1 0.0191 #> 3 is 1 0.0202 #> 4 trying 1 0.0423 #> 5 to 1 0.00904 #> 6 collect 1 0.0370 #> 7 a 1 0.0126 #> 8 debt 1 0.0430 #> 9 that 1 0.0136 #> 10 not 1 0.0213 #> # … with 747,490 more rows tidy_word_vectors is not drastically smaller than tidy_pmi since the vocabulary is not enormous and tidy_pmi is represented in a sparse format. We have now successfully found word embeddings, with clear and understandable code. This is a real benefit of this approach; this approach is based on counting, dividing, and matrix decomposition and is thus easier to understand and implement than options based on deep learning. Training word vectors or embeddings, even with this straightforward method, still requires a large data set (ideally, hundreds of thousands of documents or more) and a not insignificant investment of time and computational power. 5.3 Exploring CFPB word embeddings Now that we have determined word embeddings for the data set of CFPB complaints, let’s explore them and talk about how they are used in modeling. We have projected the sparse, high-dimensional set of word features into a more dense, 100-dimensional set of features. Each word can be represented as a numeric vector in this new feature space. A single word is mapped to only one vector, so be aware that all senses of a word are conflated in word embeddings. Because of this, word embeddings are limited for understanding lexical semantics. Which words are close to each other in this new feature space of word embeddings? Let’s create a simple function that will find the nearest words to any given example in using our newly created word embeddings. nearest_neighbors <- function(df, token) { df %>% widely( ~ { y <- .[rep(token, nrow(.)), ] res <- rowSums(. * y) / (sqrt(rowSums(. ^ 2)) * sqrt(sum(.[token, ] ^ 2))) matrix(res, ncol = 1, dimnames = list(x = names(res))) }, sort = TRUE )(item1, dimension, value) %>% select(-item2) } This function takes the tidy word embeddings as input, along with a word (or token, more strictly) as a string. It uses matrix multiplication and sums to calculate the cosine similarity between the word and all the words in the embedding to find which words are closer or farther to the input word, and returns a dataframe sorted by similarity. What words are closest to "error" in the data set of CFPB complaints, as determined by our word embeddings? tidy_word_vectors %>% nearest_neighbors("error") #> # A tibble: 7,475 × 2 #> item1 value #> <chr> <dbl> #> 1 error 1 #> 2 mistake 0.683 #> 3 clerical 0.627 #> 4 problem 0.582 #> 5 glitch 0.580 #> 6 errors 0.571 #> 7 miscommunication 0.512 #> 8 misunderstanding 0.486 #> 9 issue 0.478 #> 10 discrepancy 0.474 #> # … with 7,465 more rows Mistakes, problems, glitches – sounds bad! What is closest to the word "month"? tidy_word_vectors %>% nearest_neighbors("month") #> # A tibble: 7,475 × 2 #> item1 value #> <chr> <dbl> #> 1 month 1 #> 2 year 0.'
