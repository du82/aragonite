full_description = 'Chapter 9 Long short-term memory (LSTM) networks In Chapter 8, we trained our first deep learning models with straightforward dense network architectures that provide a bridge for our understanding as we move from shallow learning algorithms to more complex network architectures. Those first neural network architectures are not simple compared to the kinds of models we used in Chapters 6 and 7, but it is possible to build many more different and more complex kinds of networks for prediction with text data. This chapter will focus on the family of long short-term memory networks (LSTMs) (Hochreiter and Schmidhuber 1997). 9.1 A first LSTM model We will be using the same data from the previous chapter, described in Sections 8.1 and B.4. This data contains short text blurbs for prospective crowdfunding campaigns and whether those campaigns were successful. Our modeling goal is to predict whether a Kickstarter crowdfunding campaign was successful or not, based on the text blurb describing the campaign. Let’s start by splitting our data into training and testing sets. library(tidyverse) kickstarter <- read_csv("data/kickstarter.csv.gz") kickstarter #> # A tibble: 269,790 × 3 #> blurb state created_at #> <chr> <dbl> <date> #> 1 Exploring paint and its place in a digital world. 0 2015-03-17 #> 2 Mike Fassio wants a side-by-side photo of me and Hazel eati… 0 2014-07-11 #> 3 I need your help to get a nice graphics tablet and Photosho… 0 2014-07-30 #> 4 I want to create a Nature Photograph Series of photos of wi… 0 2015-05-08 #> 5 I want to bring colour to the world in my own artistic skil… 0 2015-02-01 #> 6 We start from some lovely pictures made by us and we decide… 0 2015-11-18 #> 7 Help me raise money to get a drawing tablet 0 2015-04-03 #> 8 I would like to share my art with the world and to do that … 0 2014-10-15 #> 9 Post Card don’t set out to simply decorate stories. Our goa… 0 2015-06-25 #> 10 My name is Siu Lon Liu and I am an illustrator seeking fund… 0 2014-07-19 #> # … with 269,780 more rows library(tidymodels) set.seed(1234) kickstarter_split <- kickstarter %>% filter(nchar(blurb) >= 15) %>% mutate(state = as.integer(state)) %>% initial_split() kickstarter_train <- training(kickstarter_split) kickstarter_test <- testing(kickstarter_split) Just as described in Chapter 8, the preprocessing needed for deep learning network architectures is somewhat different than for the models we used in Chapters 6 and 7. The first step is still to tokenize the text, as described in Chapter 2. After we tokenize, we filter to keep only how many words we’ll include in the analysis; step_tokenfilter() keeps the top tokens based on frequency in this data set. library(textrecipes) max_words <- 2e4 max_length <- 30 kick_rec <- recipe(~ blurb, data = kickstarter_train) %>% step_tokenize(blurb) %>% step_tokenfilter(blurb, max_tokens = max_words) %>% step_sequence_onehot(blurb, sequence_length = max_length) After tokenizing, the preprocessing is different. We use step_sequence_onehot() to encode the sequences of words as integers representing each token in the vocabulary of 20,000 words, as described in detail in Section 8.2.2. This is different than the representations we used in Chapters 6 and 7, mainly because information about word sequence is encoded in this representation. Using step_sequence_onehot() to preprocess text data records and encodes sequence information, unlike the document-term matrix and/or bag-of-tokens approaches we used in Chapters 7 and 6. There are 202,092 blurbs in the training set and 67,365 in the testing set. Like we discussed in the last chapter, we are using recipes and text-recipes for preprocessing before modeling. When we prep() a recipe, we compute or estimate statistics from the training set; the output of prep() is a recipe. When we bake() a recipe, we apply the preprocessing to a data set, either the training set that we started with or another set like the testing data or new data. The output of bake() is a data set like a tibble or a matrix. We could have applied these prep() and bake() functions to any preprocessing recipes throughout this book, but we typically didn’t need to because our modeling workflows automated these steps. kick_prep <- prep(kick_rec) kick_train <- bake(kick_prep, new_data = NULL, composition = "matrix") dim(kick_train) #> [1] 202092 30 Here we use composition = "matrix" because the Keras modeling functions operate on matrices, rather than a dataframe or tibble. 9.1.1 Building an LSTM An LSTM is a specific kind of network architecture with feedback loops that allow information to persist through steps14 and memory cells that can learn to “remember” and “forget” information through sequences. LSTMs are well-suited for text because of this ability to process text as a long sequence of words or characters, and can model structures within text like word dependencies. LSTMs are useful in text modeling because of this memory through long sequences; they are also used for time series, machine translation, and similar problems. Figure 9.1 depicts a high-level diagram of how the LSTM unit of a network works. In the diagram, part of the neural network, \(A\), operates on some of the input and outputs a value. During this process, some information is held inside \(A\) to make the network “remember” this updated network. Network \(A\) is then applied to the next input where it predicts new output and its memory is updated. FIGURE 9.1: High-level diagram of an unrolled recurrent neural network. The recurrent neural network is the backbone of LSTM networks. The exact shape and function of network \(A\) are beyond the reach of this book. For further study, Christopher Olah’s blog post “Understanding LSTM Networks” gives a more technical overview of how LSTM networks work. The Keras library has convenient functions for broadly-used architectures like LSTMs so we don’t have to build it from scratch using layers; we can instead use layer_lstm(). This comes after an embedding layer that makes dense vectors from our word sequences and before a densely-connected layer for output. library(keras) lstm_mod <- keras_model_sequential() %>% layer_embedding(input_dim = max_words + 1, output_dim = 32) %>% layer_lstm(units = 32) %>% layer_dense(units = 1, activation = "sigmoid") lstm_mod #> Model: "sequential" #> ________________________________________________________________________________ #> Layer (type) Output Shape Param # #> ================================================================================ #> embedding (Embedding) (None, None, 32) 640032 #> ________________________________________________________________________________ #> lstm (LSTM) (None, 32) 8320 #> ________________________________________________________________________________ #> dense (Dense) (None, 1) 33 #> ================================================================================ #> Total params: 648,385 #> Trainable params: 648,385 #> Non-trainable params: 0 #> ________________________________________________________________________________ Notice the number of parameters in this LSTM model, about twice as many as the dense neural networks in Chapter 8. It is easier to overfit an LSTM model, and it takes more time and memory to train, because of the large number of parameters. Because we are training a binary classification model, we use activation = "sigmoid" for the last layer; we want to fit and predict to class probabilities. Next we compile() the model, which configures the model for training with a specific optimizer and set of metrics. A good default optimizer for many problems is "adam" (Kingma and Ba 2017), and a good loss function for binary classification is "binary_crossentropy". lstm_mod %>% compile( optimizer = "adam", loss = "binary_crossentropy", metrics = c("accuracy") ) As we noted in Chapter 8, the neural network model is modified in place; the object lstm_mod is different after we compile it, even though we didn’t assign the object to anything. This is different from how most objects in R work, so pay special attention to the state of your model objects. After the model is compiled, we can fit it. The fit() method for Keras models has an argument validation_split that will set apart a fraction of the training data for evaluation and assessment. The performance metrics are evaluated on the validation set at the end of each epoch. lstm_history <- lstm_mod %>% fit( kick_train, kickstarter_train$state, epochs = 10, validation_split = 0.25, batch_size = 512, verbose = FALSE ) lstm_history #> #> Final epoch (plot to see history): #> loss: 0.2511 #> accuracy: 0.8816 #> val_loss: 0.7764 #> val_accuracy: 0.7571 The loss on the training data (called loss here) is much better than the loss on the validation data (val_loss), indicating that we are overfitting pretty dramatically. We can see this by plotting the history as well in Figure 9.2. plot(lstm_history) FIGURE 9.2: Training and validation metrics for LSTM Remember that lower loss indicates a better fitting model, and higher accuracy (closer to 1) indicates a better model. This model continues to improve epoch after epoch on the training data, but performs worse on the validation set than the training set after the first few epochs and eventually starts to exhibit worsening performance on the validation set as epochs pass, demonstrating how extremely it is overfitting to the training data. This is very common for powerful deep learning models, including LSTMs. 9.1.2 Evaluation We used some Keras defaults for model evaluation in the previous section, but just like we demonstrated in Section 8.2.4, we can take more control if we want or need to. Instead of using the validation_split argument, we can use the validation_data argument and send in our own validation set creating with rsample. set.seed(234) kick_val <- validation_split(kickstarter_train, strata = state) kick_val #> # Validation Set Split (0.75/0.25) using stratification #> # A tibble: 1 × 2 #> splits id #> <list> <chr> #> 1 <split [151568/50524]> validation We can access the two data sets specified by this split via the functions analysis() (the analog to training) and assessment() (the analog to testing). We need to apply our prepped preprocessing recipe kick_prep to both to transform this data to the appropriate format for our neural network architecture. kick_analysis <- bake(kick_prep, new_data = analysis(kick_val$splits[[1]]), composition = "matrix") dim(kick_analysis) #> [1] 151568 30 kick_assess <- bake(kick_prep, new_data = assessment(kick_val$splits[[1]]), composition = "matrix") dim(kick_assess) #> [1] 50524 30 These are each matrices appropriate for a Keras model. We will also need the outcome variables for both sets. state_analysis <- analysis(kick_val$splits[[1]]) %>% pull(state) state_assess <- assessment(kick_val$splits[[1]]) %>% pull(state) Let’s also think about our LSTM model architecture. We saw evidence for significant overfitting with our first LSTM, and we can counteract that by including dropout, both in the regular sense (dropout) and in the feedback loops (recurrent_dropout). When we include some dropout, we temporarily remove some units together with their connections from the network. The purpose of this is typically to reduce overfitting (Srivastava et al. 2014). Dropout is not exclusive to LSTM models, and can also be used in many other kinds of network architectures. Another way to add dropout to a network is with layer_dropout(). lstm_mod <- keras_model_sequential() %>% layer_embedding(input_dim = max_words + 1, output_dim = 32) %>% layer_lstm(units = 32, dropout = 0.4, recurrent_dropout = 0.4) %>% layer_dense(units = 1, activation = "sigmoid") lstm_mod %>% compile( optimizer = "adam", loss = "binary_crossentropy", metrics = c("accuracy") ) val_history <- lstm_mod %>% fit( kick_analysis, state_analysis, epochs = 10, validation_data = list(kick_assess, state_assess), batch_size = 512, verbose = FALSE ) val_history #> #> Final epoch (plot to see history): #> loss: 0.3737 #> accuracy: 0.8271 #> val_loss: 0.6137 #> val_accuracy: 0.7357 The overfitting has been reduced, and Figure 9.3 shows that the difference between our model’s performance on training and validation data is now smaller. plot(val_history) FIGURE 9.3: Training and validation metrics for LSTM with dropout Remember that this is specific validation data that we have chosen ahead of time, so we can evaluate metrics flexibly in any way we need to, for example, using yardstick functions. We can create a tibble with the true and predicted values for the validation set. val_res <- keras_predict(lstm_mod, kick_assess, state_assess) val_res %>% metrics(state, .pred_class, .pred_1) #> # A tibble: 4 × 3 #> .metric .estimator .estimate #> <chr> <chr> <dbl> #> 1 accuracy binary 0.736 #> 2 kap binary 0.470 #> 3 mn_log_loss binary 0.614 #> 4 roc_auc binary 0.805 A regularized linear model trained on this data set achieved results of accuracy of 0.686 and an AUC for the ROC curve of 0.752 (Appendix C). This first LSTM with dropout is already performing better than such a linear model. We can plot the ROC curve in Figure 9.4 to evaluate the performance across the range of thresholds. val_res %>% roc_curve(state, .pred_1) %>% autoplot() FIGURE 9.4: ROC curve for LSTM with dropout predictions of Kickstarter campaign success 9.2 Compare to a recurrent neural network An LSTM is actually a specific kind of recurrent neural network (RNN) (Elman 1990). Simple RNNs have feedback loops and hidden state that allow information to persist through steps but do not have memory cells like LSTMs. This difference between RNNs and LSTMs amounts to what happens in network \(A\) in Figure 9.1. RNNs tend to have a very simple structure, typically just a single tanh() layer, much simpler than what happens in LSTMs. Simple RNNs can only connect very recent information and structure in sequences, but LSTMS can learn long-range dependencies and broader context. Let’s train an RNN to see how it compares to the LSTM. rnn_mod <- keras_model_sequential() %>% layer_embedding(input_dim = max_words + 1, output_dim = 32) %>% layer_simple_rnn(units = 32, dropout = 0.4, recurrent_dropout = 0.4) %>% layer_dense(units = 1, activation = "sigmoid") rnn_mod %>% compile( optimizer = "adam", loss = "binary_crossentropy", metrics = c("accuracy") ) rnn_history <- rnn_mod %>% fit( kick_analysis, state_analysis, epochs = 10, validation_data = list(kick_assess, state_assess), batch_size = 512, verbose = FALSE ) rnn_history #> #> Final epoch (plot to see history): #> loss: 0.4997 #> accuracy: 0.7651 #> val_loss: 0.5935 #> val_accuracy: 0.7136 Looks like more overfitting! We can see this by plotting the history as well in Figure 9.5. plot(rnn_history) FIGURE 9.5: Training and validation metrics for RNN These results are pretty disappointing overall, with worse performance than our first LSTM. Simple RNNs like the ones in this section can be challenging to train wel'
