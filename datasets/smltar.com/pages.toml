full_description = 'Chapter 2 Tokenization To build features for supervised machine learning from natural language, we need some way of representing raw text as numbers so we can perform computation on them. Typically, one of the first steps in this transformation from natural language to feature, or any of kind of text analysis, is tokenization. Knowing what tokenization and tokens are, along with the related concept of an n-gram, is important for almost any natural language processing task. 2.1 What is a token? In R, text is typically represented with the character data type, similar to strings in other languages. Let’s explore text from fairy tales written by Hans Christian Andersen, available in the hcandersenr package (Hvitfeldt 2019a). This package stores text as lines such as those you would read in a book; this is just one way that you may find text data in the wild and does allow us to more easily read the text when doing analysis. If we look at the first paragraph of one story titled “The Fir-Tree,” we find the text of the story is in a character vector: a series of letters, spaces, and punctuation stored as a vector. The tidyverse is a collection of packages for data manipulation, exploration, and visualization. library(tokenizers) library(tidyverse) library(tidytext) library(hcandersenr) the_fir_tree <- hcandersen_en %>% filter(book == "The fir tree") %>% pull(text) head(the_fir_tree, 9) #> [1] "Far down in the forest, where the warm sun and the fresh air made a sweet" #> [2] "resting-place, grew a pretty little fir-tree; and yet it was not happy, it" #> [3] "wished so much to be tall like its companions– the pines and firs which grew" #> [4] "around it. The sun shone, and the soft air fluttered its leaves, and the" #> [5] "little peasant children passed by, prattling merrily, but the fir-tree heeded" #> [6] "them not. Sometimes the children would bring a large basket of raspberries or" #> [7] "strawberries, wreathed on a straw, and seat themselves near the fir-tree, and" #> [8] "say, \"Is it not a pretty little tree?\" which made it feel more unhappy than" #> [9] "before." The first nine lines stores the first paragraph of the story, each line consisting of a series of character symbols. These elements don’t contain any metadata or information to tell us which characters are words and which aren’t. Identifying these kinds of boundaries between words is where the process of tokenization comes in. In tokenization, we take an input (a string) and a token type (a meaningful unit of text, such as a word) and split the input into pieces (tokens) that correspond to the type (Manning, Raghavan, and Schütze 2008). Figure 2.1 outlines this process. FIGURE 2.1: A black box representation of a tokenizer. The text of these three example text fragments has been converted to lowercase and punctuation has been removed before the text is split. Most commonly, the meaningful unit or type of token that we want to split text into units of is a word. However, it is difficult to clearly define what a word is, for many or even most languages. Many languages, such as Chinese, do not use white space between words at all. Even languages that do use white space, including English, often have particular examples that are ambiguous (Bender 2013). Romance languages like Italian and French use pronouns and negation words that may better be considered prefixes with a space, and English contractions like “didn’t” may more accurately be considered two words with no space. To understand the process of tokenization, let’s start with a overly simple definition for a word: any selection of alphanumeric (letters and numbers) symbols. Let’s use some regular expressions (or regex for short, see Appendix A) with strsplit() to split the first two lines of “The Fir-Tree” by any characters that are not alphanumeric. strsplit(the_fir_tree[1:2], "[^a-zA-Z0-9]+") #> [[1]] #> [1] "Far" "down" "in" "the" "forest" "where" "the" "warm" #> [9] "sun" "and" "the" "fresh" "air" "made" "a" "sweet" #> #> [[2]] #> [1] "resting" "place" "grew" "a" "pretty" "little" "fir" #> [8] "tree" "and" "yet" "it" "was" "not" "happy" #> [15] "it" At first sight, this result looks pretty decent. However, we have lost all punctuation, which may or may not be helpful for our modeling goal, and the hero of this story ("fir-tree") was split in half. Already it is clear that tokenization is going to be quite complicated. Luckily for us, a lot of work has been invested in this process, and typically it is best to use these existing tools. For example, tokenizers (Mullen et al. 2018) and spaCy (Honnibal et al. 2020) implement fast, consistent tokenizers we can use. Let’s demonstrate with the tokenizers package. library(tokenizers) tokenize_words(the_fir_tree[1:2]) #> [[1]] #> [1] "far" "down" "in" "the" "forest" "where" "the" "warm" #> [9] "sun" "and" "the" "fresh" "air" "made" "a" "sweet" #> #> [[2]] #> [1] "resting" "place" "grew" "a" "pretty" "little" "fir" #> [8] "tree" "and" "yet" "it" "was" "not" "happy" #> [15] "it" We see sensible single-word results here; the tokenize_words() function uses the stringi package (Gagolewski 2020) and C++ under the hood, making it very fast. Word-level tokenization is done by finding word boundaries according to the specification from the International Components for Unicode (ICU). How does this word boundary algorithm work? It can be outlined as follows: Break at the start and end of text, unless the text is empty. Do not break within CRLF (new line characters). Otherwise, break before and after new lines (including CR and LF). Do not break within emoji zwj sequences. Keep horizontal whitespace together. Ignore Format and Extend characters, except after sot, CR, LF, and new lines. Do not break between most letters. Do not break letters across certain punctuation. Do not break within sequences of digits, or digits adjacent to letters (“3a,” or “A3”). Do not break within sequences, such as “3.2” or “3,456.789.” Do not break between Katakana. Do not break from extenders. Do not break within emoji flag sequences. Otherwise, break everywhere (including around ideographs). While we might not understand what each and every step in this algorithm is doing, we can appreciate that it is many times more sophisticated than our initial approach of splitting on non-alphanumeric characters. In most of this book, we will use the tokenizers package as a baseline tokenizer for reference. Your choice of tokenizer will influence your results, so don’t be afraid to experiment with different tokenizers or, if necessary, to write your own to fit your problem. 2.2 Types of tokens Thinking of a token as a word is a useful way to start understanding tokenization, even if it is hard to implement concretely in software. We can generalize the idea of a token beyond only a single word to other units of text. We can tokenize text at a variety of units including: characters, words, sentences, lines, paragraphs, and n-grams In the following sections, we will explore how to tokenize text using the tokenizers package. These functions take a character vector as the input and return lists of character vectors as output. This same tokenization can also be done using the tidytext (Silge and Robinson 2016) package, for workflows using tidy data principles where the input and output are both in a dataframe. sample_vector <- c("Far down in the forest", "grew a pretty little fir-tree") sample_tibble <- tibble(text = sample_vector) The tokenizers package offers fast, consistent tokenization in R for tokens such as words, letters, n-grams, lines, paragraphs, and more. The tokenization achieved by using tokenize_words() on sample_vector: tokenize_words(sample_vector) #> [[1]] #> [1] "far" "down" "in" "the" "forest" #> #> [[2]] #> [1] "grew" "a" "pretty" "little" "fir" "tree" will yield the same results as using unnest_tokens() on sample_tibble; the only difference is the data structure, and thus how we might use the result moving forward in our analysis. sample_tibble %>% unnest_tokens(word, text, token = "words") #> # A tibble: 11 × 1 #> word #> <chr> #> 1 far #> 2 down #> 3 in #> 4 the #> 5 forest #> 6 grew #> 7 a #> 8 pretty #> 9 little #> 10 fir #> 11 tree The tidytext package provides functions to transform text to and from tidy formats, allowing us to work seamlessly with other tidyverse tools. Arguments used in tokenize_words() can be passed through unnest_tokens() using the “the dots”, .... sample_tibble %>% unnest_tokens(word, text, token = "words", strip_punct = FALSE) #> # A tibble: 12 × 1 #> word #> <chr> #> 1 far #> 2 down #> 3 in #> 4 the #> 5 forest #> 6 grew #> 7 a #> 8 pretty #> 9 little #> 10 fir #> 11 - #> 12 tree 2.2.1 Character tokens Perhaps the simplest tokenization is character tokenization, which splits texts into characters. Let’s use tokenize_characters() with its default parameters; this function has arguments to convert to lowercase and to strip all non-alphanumeric characters. These defaults will reduce the number of different tokens that are returned. The tokenize_*() functions by default return a list of character vectors, one character vector for each string in the input. tft_token_characters <- tokenize_characters(x = the_fir_tree, lowercase = TRUE, strip_non_alphanum = TRUE, simplify = FALSE) What do we see if we take a look? head(tft_token_characters) %>% glimpse() #> List of 6 #> $ : chr [1:57] "f" "a" "r" "d" ... #> $ : chr [1:57] "r" "e" "s" "t" ... #> $ : chr [1:61] "w" "i" "s" "h" ... #> $ : chr [1:56] "a" "r" "o" "u" ... #> $ : chr [1:64] "l" "i" "t" "t" ... #> $ : chr [1:64] "t" "h" "e" "m" ... We don’t have to stick with the defaults. We can keep the punctuation and spaces by setting strip_non_alphanum = FALSE, and now we see that spaces and punctuation are included in the results too. tokenize_characters(x = the_fir_tree, strip_non_alphanum = FALSE) %>% head() %>% glimpse() #> List of 6 #> $ : chr [1:73] "f" "a" "r" " " ... #> $ : chr [1:74] "r" "e" "s" "t" ... #> $ : chr [1:76] "w" "i" "s" "h" ... #> $ : chr [1:72] "a" "r" "o" "u" ... #> $ : chr [1:77] "l" "i" "t" "t" ... #> $ : chr [1:77] "t" "h" "e" "m" ... The results have more elements because the spaces and punctuation have not been removed. Depending on the format you have your text data in, it might contain ligatures. Ligatures are when multiple graphemes or letters are combined as a single character The graphemes “f” and “l” are combined into “ﬂ,” or “f” and “f” into “ff.” When we apply normal tokenization rules the ligatures will not be split up. tokenize_characters("ﬂowers") #> [[1]] #> [1] "ﬂ" "o" "w" "e" "r" "s" We might want to have these ligatures separated back into separate characters, but first, we need to consider a couple of things. First, we need to consider if the presence of ligatures is a meaningful feature to the question we are trying to answer. Second, there are two main types of ligatures: stylistic and functional. Stylistic ligatures are when two characters are combined because the spacing between the characters has been deemed unpleasant. Functional ligatures like the German Eszett (also called the scharfes S, meaning sharp s) ß, is an official letter of the German alphabet. It is described as a long S and Z and historically has never gotten an uppercase character. This has led the typesetters to use SZ or SS as a replacement when writing a word in uppercase. Additionally, ß is omitted entirely in German writing in Switzerland and is replaced with ss. Other examples include the “W” in the Latin alphabet (two “v” or two “u” joined together), and æ, ø, and å in the Nordic languages. Some place names for historical reasons use the old spelling “aa” instead of å. In Section 6.7.1 we will discuss text normalization approaches to deal with ligatures. 2.2.2 Word tokens Tokenizing at the word level is perhaps the most common and widely used tokenization. We started our discussion in this chapter with this kind of tokenization, and as we described before, this is the procedure of splitting text into words. To do this, let’s use the tokenize_words() function. tft_token_words <- tokenize_words(x = the_fir_tree, lowercase = TRUE, stopwords = NULL, strip_punct = TRUE, strip_numeric = FALSE) The results show us the input text split into individual words. head(tft_token_words) %>% glimpse() #> List of 6 #> $ : chr [1:16] "far" "down" "in" "the" ... #> $ : chr [1:15] "resting" "place" "grew" "a" ... #> $ : chr [1:15] "wished" "so" "much" "to" ... #> $ : chr [1:14] "around" "it" "the" "sun" ... #> $ : chr [1:12] "little" "peasant" "children" "passed" ... #> $ : chr [1:13] "them" "not" "sometimes" "the" ... We have already seen lowercase = TRUE, and strip_punct = TRUE and strip_numeric = FALSE control whether we remove punctuation and numeric characters, respectively. We also have stopwords = NULL, which we will talk about in more depth in Chapter 3. Let’s create a tibble with two fairy tales, “The Fir-Tree” and “The Little Mermaid.” Then we can use unnest_tokens() together with some dplyr verbs to find the most commonly used words in each. hcandersen_en %>% filter(book %in% c("The fir tree", "The little mermaid")) %>% unnest_tokens(word, text) %>% count(book, word) %>% group_by(book) %>% arrange(desc(n)) %>% slice(1:5) #> # A tibble: 10 × 3 #> # Groups: book [2] #> book word n #> <chr> <chr> <int> #> 1 The fir tree the 278 #> 2 The fir tree and 161 #> 3 The fir tree tree 76 #> 4 The fir tree it 66 #> 5 The fir tree a 56 #> 6 The little mermaid the 817 #> 7 The little mermaid and 398 #> 8 The little mermaid of 252 #> 9 The little mermaid she 240 #> 10 The little mermaid to 199 The five most common words in each fairy tale are fairly uninformative, with the exception being "tree" in the “The Fir-Tree.” These uninformative words are called stop words and will be explored in-depth in Chapter 3. 2.2.3 Tokenizing by n-grams An n-gram (sometimes written “ngram”) is a term in linguistics for a contiguous sequence of \(n\) items from a given sequence of text or speech. The item can be phonemes, syllables, letters, or words depending on the application, but when most people talk about n-grams, they mean a group of \(n\) words. In this book, we will use n-gram to denote word n-grams unless otherwise stated. We use Latin prefixes so that a 1-gram is called a unigram, a 2-gram is called a bigram, a 3-gram called a trigram, and so on. Some example n-grams are: unigram: “Hello,” “day,” “my,” “little” bigram: “fir tree,” “fresh air,” “to be,” “Robin Hood” trigram: “You and I,” “please let go,” “no time like,” “the little mermaid” The benefit of using n-grams compared to words is that n-grams capture word order that would otherwise be lost. Similarly, when we use character n-grams, we can model the beginning and end of words, because a space will be located at the end of an n-gram for the end of a word and at the beginning of an n-gram of the beginning of a word. To split text into word n-grams, we can use the fu'
