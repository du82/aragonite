title = "About Snaps | Snapcraft"
description = "Snaps are app packages for desktop, cloud and IoT that are easy to install, secure, cross‐platform and dependency‐free."
full_description = "Snaps are app packages for desktop, cloud and IoT that are easy to install, secure, cross‐platform and dependency‐free. Snaps are discoverable and installable from the Snap Store, the app store for Linux with an audience of millions. A snap is a bundle of an app and its dependencies that works without modification across Linux distributions. The Snap Store provides a place to upload snaps, and for users to browse and install the software they want. Snaps work across Linux on many distributions and versions. Bundle your dependencies and assets, to simplify installs to a single standard command. Whether your project is hosted on GitHub or not, you can leverage our build system to both build and release to the edge channel, ensuring users always stay up‐to‐date. With channels users can find their preferred balance between stability and the latest features. Though nothing is enforced, users expect the “Stable” channel to be well tested and updated less frequently, whereas the “Edge” channel is where they’ll get the latest release as soon as it’s available. If you build proprietary software you can use the “Proprietary” license. For open source projects we support SPDX expressions so you can let your users know exactly what license your project uses. © 2025 Canonical Ltd. Ubuntu and Canonical are registered trademarks of Canonical Ltd. Powered by Charmed Kubernetes"
