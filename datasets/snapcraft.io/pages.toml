full_description = "Start by creating a repo and pushing your code to GitHub. Make sure that your repo includes a snapcraft.yaml file. Register a name on Snapcraft and attach it to your repo to start building. Your snap will be built automatically for all distros. Release your snap to your users. From here on, all the updates you do to your code will trigger automatic builds. Start by creating a repo and pushing your code to GitHub. Make sure that your repo includes a snapcraft.yaml file. Register a name on Snapcraft and attach it to your repo to start building. Your snap will be built automatically for all distros. Release your snap to your users. From here on, all the updates you do to your code will trigger automatic builds. Whenever you commit a change in your code on GitHub, Snapcraft will trigger a new build automatically for all the distros you choose. When you are ready, these builds will be available for you to share with your users. We created the possibility to start building your snaps from a Github repo so that you can focus on the things that matter, using the tools you know. Snaps work across Linux on any distribution or version. Bundle your dependencies and assets, simplifying installs to a single standard command. © 2025 Canonical Ltd. Ubuntu and Canonical are registered trademarks of Canonical Ltd. Powered by Charmed Kubernetes"
