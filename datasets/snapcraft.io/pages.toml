full_description = "Snaps are Linux app packages for desktop, cloud and IoT that are self-contained, simple to install, secure, cross-platform, and dependency-free. They update automatically and typically run within a confined and transaction-based environment. Security and robustness are their key features, alongside being easy to install, easy to maintain and easy to upgrade. Snaps help desktop users effortlessly install and run apps like Spotify or Slack. They help sysadmins run servers like NextCloud, developers to package and distribute their work to the global Snap Store, and they help everyone build and deploy IoT devices running Ubuntu Core. From Linux and maker space tinkerers, to the robotics, automotive and signage industries; from your desktop to a deployment of thousands, snap can handle it. In this documentation Tutorials Get started - a hands-on introduction to using snap packages for new users How-to guides Step-by-step guides covering key operations and common tasks Explanation Concepts - discussion and clarification of key topics Reference Technical information - specifications, APIs, architecture Project and community Snap and Snapcraft are members of the Ubuntu family. They’re both open source projects that welcome community involvement, contributions, suggestions, fixes and constructive feedback. Our Code of Conduct Get support Join the Discourse forum Interactive chat on Matrix.org Contribute to our documentation Roadmap Thinking about using snap for your next project? Get in touch! Last updated 13 hours ago. Help improve this document in the forum."
