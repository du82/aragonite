["https://snarky.ca/setting-expectations-for-open-source-participation"]
title = "Setting expectations for open source participation"
description = """
(If you would prefer to watch a 30 minute talk on this same content, you can
watch my Python US 2018 keynote [https://youtu.be/tzFWz5fiVKU?t=48m55s])

Who am I? [1]
To start, I want to provide my bonafides so you know I'm not some crank spouting
some armchair"""
full_description = '''06 Sep 2018 26 min read open source Setting expectations for open source participation (If you would prefer to watch a 30 minute talk on this same content, you can watch my Python US 2018 keynote) Who am I? [1] To start, I want to provide my bonafides so you know I'm not some crank spouting some armchair advice with nothing to back up their opinion other than having an internet connection. For a day job I am the dev lead for the Python extension for Visual Studio Code. Originally the extension was an open source, personal project, but then Microsoft decided it would be a good idea to support the most popular extension for VS Code, so we hired its creator (Don Jayamanne), put me on the team, and then we re-launched the extension as an official open source project from Microsoft (and now we are a team of four developers and a product manager). So I participate in what I would call corporate open source for a living because even if we never received a single outside contribution ever again, the extension's development will continue thanks to Microsoft. One day a week for a day job plus plenty of spare time I'm also a core developer on the Python programming language. I have had commit privileges to Python since April 18, 2003, so over 15 years at the time of writing this. So I also participate in community open source where if people who weren't paid to work on Python stopped contributing, the project would collapse (I'm considered extremely lucky to get a day/week of paid work time to spend on Python, so if it weren't for volunteers there would be no Python programming language). I've also been lucky enough to have contributed a patch in some form to around 90 projects (depending on how you count). Now a lot of those are documentation changes where I probably fixed a spelling or grammar mistake, but the key point is that I have been exposed to a lot of open source teams. So, to summarize: I contribute to and manage a corporate open source project for a living, I have been actively contributing to a major open source project for over 15 years, and I have contributed to about 90 other projects. I would like to think I know a little bit about how open source works. 😉 Hopefully that means what I am about to say comes from an informed place and you don't view me as a total crank. What is the purpose of open source? [2] When you first release open source code to the world, it's a code dump. With zero participation from others you're essentially setting the code free into the world, but it's very much a monologue. But the instant you get that first contribution to your code, it becomes an open source project with an open source community of two (if you have users who are just providing feedback then it's still a community of users, it just isn't driven by open source yet). And once you get over that initial hurdle of your first external contribution, your project grows in purpose from being a way to share code with the world to being about two things: Collaborating on the maintenance of the project Having fun Going forward, your open source project is about balancing those two things. If you're not collaborating with others then you're back to a code dump in which case you don't have to care about collaborating. And if you're not having fun then you will find yourself wanting to do something else, which means you will no longer want to participate. In both cases, though, bit rot can very easily set in. While participating in an open source project ebbs and flows can occur between these two goals, if you ever lack in one of them then the project will collapse. How do you sustain open source? [3] Now that we know that the purpose of an open source project and community is to sustain the project and have fun, how do you accomplish that? First, you need people. Initially your project is going to be very small, so getting more people to help out is great simply because every little bit helps. But as the project grows you also need to attract new people in order to replace people who have left the project. People have children, suffer from burn-out, change jobs, or die. There are various reasons people stop contributing to open source, but it happens and so if you don't bring new people in then your project's participants will eventually dwindle down to zero. But you also can't forget about those that already participate. Retaining folks must also be considered as people build up knowledge and unique skills for a project. If all of the preexisting participants left en masse then it would take awhile to bring new participants to the same level as those that left. The trick is balancing both of these needs. For instance, existing participants probably like the way the current workflow works. But then new participants might want some newer approach that the project has not taken on yet. Do you keep things as-is to satisfy current participants or do you change things to try to attract new participants? In case it wasn't obvious, making sure open source works is hard. 😉 So what's the goal (and why are we failing at it)? [4] For me, the overall goal of open source is to attract and retain people to help maintain an open source project while enjoying the experience. I don't think this is a radical or controversial perspective of what the purpose of OSS is. We all want open source to be sustainable and that requires people who enjoy doing open source. If we don't have this then there simply won't be people willing to work on open source because the enjoyment has been sucked out of the experience for them. Unfortunately we are failing at meeting this laudable goal of making open source sustainable through keeping it enjoyable to do so. An example I like to give is a tweet written by Cory Benfield when he was the maintainer of hyper-h2, urllib3, and requests: First, I hope everyone who reads that feels somewhat disturbed by the fact that trying to do a nice thing by working on open source has led someone to becoming a worse person. That is not a reasonable thing to ask of anyone and is definitely not sustainable as it doesn't exactly make one happy to work on open source. Look at it from the perspective of Cory's partner. By letting him spend time on open source she has ended up with a worse partner in life. How is that a reasonable trade-off? As a community we drove Cory into a position where his partner could very reasonably say "it's either open source or me", and I suspect Cory's partner would win (and rightfully so). It is simply not acceptable that Cory could even conceivably be put in that position due to him trying to do a nice thing by maintaining some open source project(s). And this is not an isolated case. I had to take the entire month of October off in 2016 to prevent burn-out from open source. I actually now take a full month off annually from volunteering as an "open source detox" to fight off any potential burnout. I also take at least one day off every weekend from open source work to guarantee that I at least get one day a week that isn't impacted by open source. So how have we ended up in this position where we are failing at meeting this reasonable goal of making open source sustainable by keeping it fun to do? Why are volunteers or people paid by someone other than ourselves actually disliking working on open source to the point of it making them worse people? Why do I have to take one day off a week from open source to make sure it doesn't ruin every day of my life? It all comes down to how people treat each other in open source. Now I don't think everyone who treats someone else poorly does it on purpose. I think a large part of the problem is most people have not stopped and thought about what open source is and how that should guide how they interact with others involved in it. Open source is more than just some free source code; there are real people involved here and that simple fact cannot be ignored. Unfortunately, I think a decent amount of people do forget this by not thinking about two key details. EVERYTHING in open source has a cost [5] While open source, by definition, is monetarily free, that does not mean that the production of it is free. Even when someone volunteers their time, there is a cost of their time and effort. Every time I spend work time on open source that's my employer choosing to donate my time. But it's also my choice to work for an employer that lets me put any effort into open source. If I'm not enjoying that work then that's unpleasurable effort which makes me either want to change my job or quit (just like any other job you don't enjoy doing). And whenever I volunteer my time for open source, that is me choosing to divert my personal time from doing something else. Whether that's spending time with family, friends or doing something else that I find fun and entertaining, by spending my personal time on open source I am giving up time that I could have spent on other things. I am literally choosing open source over everything else in my life when I choose to work on it in my spare time. And I only have so much time to give. Not only am I not spending time with my wife and cat when I contribute to open source in my spare time, but I'm choosing to give up a part of the finite time I have to be alive on top of it. While I haven't quite hit the midpoint of my expected lifespan, I will eventually die and so choosing to spend what personal time I have left being alive probably shouldn't be squandered doing something that I do not enjoy. And this is why whenever anyone says something is "just" a quick fix is not taking into consideration what they are truly asking someone to give up for their benefit. The cost of asking someone to do something for you is disproportionate to the cost of what you're asking the other person to give up on your behalf. And this applies to everything, including email where the cost of you sending an email has a huge cost on the world's time as you're potentially asking hundreds of people to spend what little time they have to be alive to read what you have written. You have to always consider whether what you're asking of others is reasonable. To reiterate, just because open source software is free for you doesn't mean someone else hasn't paid some price on your behalf to get you that code. Everything in open source should be a series of kindnesses [6] Since open source is paid for by others in effort and time, that would suggest that there really shouldn't be any expectations on your part from what you get out of an open source project that you choose to use. You could view everything in OSS as a kindness that someone has done for you and others. Putting things into that perspective takes away the feeling of expectation and entitlement. This frames open source participation as someone doing something nice for the community and project, as someone having done a kindness for you. As soon as you start demanding or expecting something from open source you have stopped viewing it as it was intended, and that distortion can be poisonous. When I choose to donate my precious time to open source I do it voluntarily as a nice thing that I enjoy doing. I didn't do it because someone demanded it of me, and the instant I feel that my time is not appropriately appreciated as the gift that it is, I stop enjoying doing open source. And when someone stops enjoying their contributions to open source, they burn out and quit. Taking the altruistic view of open source keeps things grounded and healthy. Viewing open source as a kindness someone else has done for you gives the appropriate perspective that this is something nice and no one has any expectations from it. It's like when I hold the door open for someone. Ultimately I don't expect anything in return (although a "thanks" is always appreciated). And the person passing through the door doesn't expect anything else from me either. But when someone in open source makes demands it's like the person passing through the door criticizing how I held the door open. It's pointless and simply leads to people no longer being willing to hold open doors for others. To reiterate, you should view open source as a series of kind acts people have done altruistically. That means you cannot make any demands or hold any expectations of an open source project. Or as Evan Czaplicki, the creator of Elm, put it, "Remember that people do free work because it is fun, not to get stressed by strangers". Typical scenarios in open source [7] Knowing that open source always has a cost and should be viewed as a series of kindnesses, I want to go through some typical scenarios that occur in open source to point out how people accidentally stop viewing open source as kindnesses. I'm going to talk from the perspective of me as an OSS project maintainer, and that of Stuart, an external participant to a project (and who happens to be the person who gave me the idea of framing these examples in this fashion). I will signal who is doing a kindness for whom using arrows, e.g. "Stuart → Brett" signifies that Stuart did a favour for me. Using open source [8] Brett → Stuart It can be like someone leaving out a pamphlet you find offensive. When I release open source, I'm doing a favour for you. I obviously didn't have to release any source code that I produced for others to use for free, but I do it as a kindness for you so you can benefit from what I have already done (later on we will see how Stuart can give back by doing me a kindness by helping with the project). For the longest time I didn't think giving away source code could really go badly. But then when a large open source project had a scandal break out about a tasteless joke made in their docs I realized that open source projects can be hurtful, discriminatory, etc. from something as simple as their documentation. Luckily this does not seem to be common, but when a project explicitly tries to exclude or is hurtful towards others then it's no longer being released as a kindness. Providing feedback [9] Stuart → Brett It can be like someone telling you, "you're stupid". Any piece of positive feedback is a wonderful kindness to receive. I'm always elated when someone tells me that they enjoy using Python, how it made things easier for them, etc. Positive feedback is always welcome (and unfortunately can be somewhat of a rarity). There's also constructive feedback. That is also an appreciated kindness as that leads to improvement. The key here, though, is that the feedback must be constructive, not negative. If you don't have feedback that can help improve the project then your other option is to simply admit the project doesn't meet your needs. But negative feedback is never necessary. If you called a project stupid it helps no one. It doesn't help me because I can't act on being called stupid. And it isn't a kindness because you could have simply said that my project wasn't helpful to you for whatever reason'''
year_published = 2018
year_updated = 2019
