full_description = "24 Dec 2023 Python State of standardized lock files: December 2023 Back in October, I released mousebender 2023.2. The biggest change was adding support for PEP 714 (which unless you're running a package index you don't need to know about it). The other small thing was adding ProjectFileDetails as a union of typed dicts to make it easier to write typed code that processes individual files found on a package index. This means mousebender now supports all the standards around package indexes.All of this was to support my work towards implementing a resolver since it needs to be able to find out what files are available. I'm still slowly plugging away at implementing the abstract API of resolvelib's provider API, but it's slow going and thus why this update is a bit light compared to the August one."
