["https://sno.phy.queensu.ca/andre"]
title = "Andre Hamer"
full_description = '''An Educational Trust Fund has been established by the collaboration for Andre's children. Donations can be sent to The following is a eulogy for Andre presented by Art McDonald at Andre's funeral on behalf of the collaboration and a "Lives Lived" obituary for Andre. Andre was very good at experimental science. I have often described him to colleagues as a "100% person". Everything he did was done to completion, starting with innovative concepts and continuing to the really finished product that did its intended job... 100% and nothing less. He was also a leader - a person recognized by his colleagues as someone whose infectious enthusiasm and strong example should be followed. He approached every project completely, organized the work and led the team by example, with the most difficult tasks done enthusiastically by him because he really loved what he was doing. Andre got things done in whatever way was necessary. Christian Nally, a student with him at Sudbury, sent a note to Rosalie that described affectionately a discussion he had with Andre in a Canadian Tire Store as they sought parts for an experimental repair. With characteristic wit Andre said "The two most important tools of the experimental physicist are the car and the cell phone." Andre developed the central calibration device for the SNO experiment for his doctoral thesis and carried out major analyses essential for SNO's success as a Post Doctoral Fellow. His legacy in science will go on as his contributions are used every day by his colleagues at SNO who remember him fondly and miss him greatly. A 100% person in all things: as a scientist, a colleague, a friend, a father, a husband and a family man. Andre came from a family who created an environment where education came naturally. He was raised in a stimulating environment, by loving parents who fostered his natural curiosity and provided him with ample learning opportunities. He was very advanced for his age and by age 17, Kant and Nietzsche were his bedtime favourites. Andre was very proud of his Belgian ancestry and visited his family's homeland many times. He and his sister loved to travel and shared experiences during his teenage years ... from visiting the top of the Alps to the dismantling of the Berlin Wall.'''
year_published = 2025
