["https://sno.phy.queensu.ca/sno/sno2.html"]
title = "The SNO Detector"
full_description = "The Sudbury Neutrino Observatory (SNO) is a new facility that has been constructed in Canada by a team of scientists from Canada, the United States and Britain. SNO will measure the flux, energy and direction of electron-neutrinos produced in the sun. The observatory will also be able to detect the other two types of neutrinos (muon-neutrinos and tau-neutrinos) which, if detected, would significantly alter our present understanding of neutrinos, the sun and the evolution of the entire Universe. The image to the right is an aerial view of #9 shaft head at Creighton mine, where the SNO detector is located. In the early 1980s, progress in theories of Grand Unification prompted the construction of several proton decay experiments. Grand Unified Theories (GUTs) hold that at a sufficiently high energy the three forces of nature would unify into one fully symmetric force. A consequence of this is that the proton (previously thought to be stable) would decay, but with a very long half-life. The search for proton decay, and in fact the search for any naturally occurring exotic event, must be done in large detectors deep underground. The large size of the detector compensates for the rareness of the events, while the location deep underground shields from the high energy cosmic ray background. A proposal was made in 1983 for the construction of such a laboratory in INCO's Creighton mine near Sudbury, Ontario, which was selected due to the stability of the rock, the available infrastructure and the willingness of INCO management to consider the project. Several ideas were considered for the experimental program at the Sudbury site. In 1984, Herb Chen at the University of California at Irvine presented a paper at the Homestake conference pointing out the advantages of using heavy water as a neutrino detector. Following discussions in Ottawa in September 1984 the SNO Collaboration was formed to develop a proposal to build a solar neutrino detector using some of Canada's large reserves of heavy water. The deuterium in heavy water enables the detection of all three types of neutrinos which might yield a solution to the Solar Neutrino Problem (SNP). Atomic Energy of Canada Limited (AECL) indicated that they would be willing to loan 1000 tonnes of heavy water while it was not required for new CANDU reactors. This would be an international Canada-U.S. project located in Canada, with spokesmen Herb Chen, UC Irvine and George Ewan, Queen's University."
