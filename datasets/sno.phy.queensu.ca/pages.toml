["https://sno.phy.queensu.ca/sno/first_results"]
title = "SNO First Results"
full_description = '''Neutrinos are elementary particles of matter with no electric charge and very little mass. There are three types: the electron-neutrino, the muon-neutrino and the tau-neutrino. Electron-neutrinos, which are associated with the familiar electron, are emitted in vast numbers by the nuclear reactions that fuel the Sun. Since the early 1970s, several experiments have detected neutrinos arriving on Earth, but they have found only a fraction of the number expected from detailed theories of energy production in the Sun. This meant there was something wrong with either the theories of the Sun, or the understanding of neutrinos. "We now have high confidence that the discrepancy is not caused by problems with the models of the Sun but by changes in the neutrinos themselves as they travel from the core of the Sun to the earth," says Dr. Art McDonald, SNO Project Director and Professor of Physics at Queen's University in Kingston, Ontario. "Earlier measurements had been unable to provide definitive results showing that this transformation from solar electron neutrinos to other types occurs. The new results from SNO, combined with previous work, now reveal this transformation clearly, and show that the total number of electron neutrinos produced in the Sun are just as predicted by detailed solar models." The SNO scientists present their first results today in a paper submitted to Physical Review Letters and in presentations at the Canadian Association of Physicists Annual Conference at Victoria, B.C. and at SNO Institutions in the U.S. and the U.K. "It is incredibly exciting, after all the years spent by so many people building SNO, to see such intriguing results coming out of our first data analysis - with so much more to come." says UK Co-spokesman Prof. David Wark of the Rutherford/Appleton Laboratory and the University of Sussex. The determination that the electron neutrinos from the Sun transform into neutrinos of another type is very important for a full understanding of the Universe at the most microscopic level. This transformation of neutrino types is not allowed in the Standard Model of elementary particles. Theoreticians will be seeking the best way to incorporate this new information about neutrinos into more comprehensive theories.'''
year_published = 2025
clearnet = "https://sno.phy.queensu.ca/sno/first_results"
