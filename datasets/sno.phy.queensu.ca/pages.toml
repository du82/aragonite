["https://sno.phy.queensu.ca/results_04_02"]
title = "New Results Apr 20, 2002"
full_description = '''A team of scientists from Canada, the United States and the United Kingdom today announced the results of a unique new measurement of the total number of neutrinos of all known types reaching the Earth from the Sun. Using data entirely from the Sudbury Neutrino Observatory (SNO) in Canada they are also able to determine that the observed number of electron neutrinos (the type produced by the Sun) is only a fraction of the total number. This shows with great certainty that neutrinos from the Sun change from one type to another before reaching the Earth. Says SNO Project Director Art McDonald of Queen's University, "These new results show in a clear, simple and accurate way that solar neutrinos change their type. The total number of neutrinos we observe is also in excellent agreement with calculations of the nuclear reactions powering the Sun. The SNO team is really excited because these measurements enable neutrino properties such as mass to be specified with much greater certainty for fundamental theories of elementary particles." Neutrinos are particles with no electric charge and very little mass. They are known to exist in three types related to three different charged particles - the electron and its lesser known relatives the muon and the tau. The Sun emits electron-neutrinos, which are created in the thermonuclear reactions in the solar core. Previous experiments have found fewer electron-neutrinos than suggested by calculations based on how the Sun burns - the famous "solar neutrino problem". SNO uses the unique properties of heavy water - where the hydrogen has an extra neutron in its nucleus - to detect not only electron-neutrinos through one type of reaction, but also all three known neutrino types through a different reaction. The results presented today at the Joint American Physical Society/American Astronomical Society meetings in Albuquerque, New Mexico, show that the number of electron-neutrinos observed is only about one third of the total number reaching the Earth. This shows unambiguously that electron-neutrinos emitted by the Sun have changed to muon- or tau-neutrinos before they reach Earth.'''
year_published = 2025
clearnet = "https://sno.phy.queensu.ca/results_04_02"
