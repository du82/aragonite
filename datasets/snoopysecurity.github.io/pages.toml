t is up (0.057s latency). PORT STATE SERVICE 389/tcp open ldap | ldap-rootdse: | LDAP Results | <ROOT> | currentTime: 20190622205142.0Z | subschemaSubentry: CN=Aggregate,CN=Schema,CN=Configuration,DC=active,DC=htb | dsServiceName: CN=NTDS Settings,CN=DC,CN=Servers,CN=Default-First-Site-Name,CN=Sites,CN=Configuration,DC=active,DC=htb | namingContexts: DC=active,DC=htb | namingContexts: CN=Configuration,DC=active,DC=htb | namingContexts: CN=Schema,CN=Configuration,DC=active,DC=htb | namingContexts: DC=DomainDnsZones,DC=active,DC=htb | namingContexts: DC=ForestDnsZones,DC=active,DC=htb | defaultNamingContext: DC=active,DC=htb | schemaNamingContext: CN=Schema,CN=Configuration,DC=active,DC=htb | configurationNamingContext: CN=Configuration,DC=active,DC=htb | rootDomainNamingContext: DC=active,DC=htb | supportedControl: 1.2.840.113556.1.4.319 | supportedControl: 1.2.840.113556.1.4.801 | supportedControl: 1.2.840.113556.1.4.473 | supportedControl: 1.2.840.113556.1.4.528 | supportedControl: 1.2.840.113556.1.4.417 | supportedControl: 1.2.840.113556.1.4.619 | supportedControl: 1.2.840.113556.1.4.841 | supportedControl: 1.2.840.113556.1.4.529 | supportedControl: 1.2.840.113556.1.4.805 | supportedControl: 1.2.840.113556.1.4.521 | supportedControl: 1.2.840.113556.1.4.970 | supportedControl: 1.2.840.113556.1.4.1338 | supportedControl: 1.2.840.113556.1.4.474 | supportedControl: 1.2.840.113556.1.4.1339 | supportedControl: 1.2.840.113556.1.4.1340 | supportedControl: 1.2.840.113556.1.4.1413 | supportedControl: 2.16.840.1.113730.3.4.9 | supportedControl: 2.16.840.1.113730.3.4.10 | supportedControl: 1.2.840.113556.1.4.1504 | supportedControl: 1.2.840.113556.1.4.1852 | supportedControl: 1.2.840.113556.1.4.802 | supportedControl: 1.2.840.113556.1.4.1907 | supportedControl: 1.2.840.113556.1.4.1948 | supportedControl: 1.2.840.113556.1.4.1974 | supportedControl: 1.2.840.113556.1.4.1341 | supportedControl: 1.2.840.113556.1.4.2026 | supportedControl: 1.2.840.113556.1.4.2064 | supportedControl