title = "Beleggingsrekening - hoe werkt het? - SNS Bank"
description = "Wil je beleggen? Dan heb je een beleggingsrekening nodig. Hoe dat werkt lees je hier."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Wat is een beleggingsrekening?Om te kunnen beleggen heb je een beleggingsrekening nodig, ook wel een effectenrekening of beleggersrekening genoemd. Een beleggingsrekening is een speciale bankrekening waarmee je beleggingsfondsen en/of aandelen en andere soorten beleggingen kunt kopen. Een belangrijk verschil met een gewone bankrekening is dat je geen geld kunt overboeken naar rekeningen van andere mensen of bedrijven. Je kunt je beleggingsrekening dus niet gebruiken als betaalrekening. Geldrekening en portefeuilleWil je beleggen bij ons? Dan openen we eerst een beleggingsrekening voor je. Deze bestaat uit 2 delen: een geldrekening en de portefeuille. Wanneer je aankopen wilt doen met je beleggingsrekening moet je vanaf je betaalrekening geld storten op de geldrekening van je beleggingsrekening. Heb je geld staan op het geldrekening deel van je beleggingsrekening, dan kun je dit geld gebruiken om een aankoop te doen. Je aankoop zie je dan terug in portefeuille, dit is je belegd vermogen.Beleggingen aankopen met SNS DoelbeleggenBeleggingen aankopen met SNS BeleggingsrekeningMet je beleggingsrekening participaties kopenVanaf je betaalrekening kun je een bedrag overmaken naar je beleggingsrekening. Vervolgens geef je opdracht om van dat geld op het gelddeel van je beleggingsrekening participaties te kopen van een fonds. In het deel waar je beleggingsportefeuille staat, zie je een overzicht van je participaties. Goed om te weten: Je tegenrekening hoeft geen betaalrekening bij SNS te zijn. Het kan ook een betaalrekening bij een andere Nederlandse bank zijn. Geld van je beleggingsrekening overboeken naar je betaalrekening Je kunt van het rekeningdeel geld overboeken naar je eigen betaalrekening die je als vaste tegenrekening hebt opgegeven. Je moet er dan wel voor zorgen dat het op te nemen bedrag op de geldrekening staat. Misschien moet je hiervoor eerst participaties verkopen uit je portefeuille. Hoe werkt geld opnemen van je beleggingsrekeningKosten beleggingsrekeningAls je bij ons wilt gaan beleggen in een fonds, openen we eerst een beleggingsrekening voor je. Voor deze beleggingsrekening betaal je geen extra kosten. Voor beleggen betaal je wel servicekosten en fondskosten. Lees hier meer over de kosten van beleggen bij SNS. Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips Meer over de SNS Beleggingsrekening Je kunt voor 1 of meer duurzame beleggingsfondsen kiezen. Zo stel je zelf je eigen portefeuille samen. SNS Beleggingsrekening"
