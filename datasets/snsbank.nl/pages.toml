title = "ASN Duurzaam Small & Midcapfonds - SNS Bank"
description = "Met het ASN Duurzaam Small- en Midcapfonds streef je naar een hoog rendement. Je bent ook bereid hier een bovengemiddeld risico voor te nemen."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen. Het ASN Duurzaam Small- en Midcapfonds in 't kortJe streeft naar een hoog rendement en begrijpt dat je hiermee een bovengemiddeld risico loopt.Je belegt in Europese kleine en middelgrote ondernemingen met een duurzame visie.De bedrijven in het fonds zijn over het algemeen wendbaarder dan grote bedrijven. Wanneer kiezen voor ASN Duurzaam Small- en Midcapfonds?Wil je beleggen in bedrijven die onder meer werken aan de duurzaamheid in de samenleving? Dan kun je kiezen voor het ASN Duurzaam Small- en Midcapfonds. Door de duurzame visie zijn de ondernemingen goed voorbereid op de toekomst en dat biedt financiële kansen. Je streeft met dit fonds dan ook naar een hoog rendement. Maar: vergeleken met een fonds dat belegt in grote bedrijven, neem je wel een bovengemiddeld risico. Beleg in dit fonds Bekijk fondsdocumenten https://www.afm.nl/eid Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 43,71**Dit is de meest recente afgiftekoers van het fonds die bij ons bekend is. Is er een nieuwe afgiftekoers beschikbaar? Dan updaten we de koers hier ook. Dat is elke beursdag rond 10.30 uur. Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 3 Jaar 5 Jaar 10 Jaar 1 Maand 3 Maand 1 Jaar 3 Jaar 5 Jaar 10 Jaar Bron: Infront Financial Technology Rendement ASN Duurzaam Small- en Midcapfonds?Nettorendement 3 jaar: -6,71%**Nettorendement 5 jaar: 1,05%****Deze nettorendementen zijn de gemiddelde nettorendementen per jaar t/m 31 juli 2024, na aftrek van de kosten van het fonds.De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Nettorendement na aftrek van de kosten van het fonds t/m 31 juli 2024 Vanaf de start 10 jaar* 5 jaar* 3 jaar* Dit jaar Fonds 4,47% 4,47% 1,05% -6,71% 1,77% RendementDe fondsbeheerder heeft als doel voor dit fonds het realiseren van vermogensgroei op de lange termijn.RisicoBij het ASN Small- en Midcapfonds hoort een bovengemiddeld risico. Het fonds belegt vooral in kleine en middelgrote Europese bedrijven. Vergeleken met een fonds dat belegt in grote bedrijven ga je voor een hoog rendement. Maar je neemt ook een bovengemiddeld risico.KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan ons betaalt. Bekijk alle kosten Hoe is het fonds opgebouwd?Het fonds is een sectorfonds. Je belegt in ongeveer 30 duurzame kleine- en middelgrote Europese bedrijven. Je belegt dan met name in maakbedrijven en bedrijven die zich richten op vastgoed, zakelijke dienstverlening en IT. In het fonds worden alleen bedrijven opgenomen die het belang van hun medewerkers voorop zetten en zuiniger omgaan met grondstoffen en energie. Bijvoorbeeld door te recyclen. Een greep uit de bedrijven die zijn goedgekeurd voor het beleggingsuniversum van het ASN Duurzaam Small- en Midcapfonds: IpsosPremier FoodsBasic-Fit FondsmanagementDit fonds is een subfonds van ASN Beleggingsfondsen AIF N.V. Dit fonds wordt beheerd door ASN Beleggingsinstellingen Beheer B.V. (ABB). Lees ook de prospectus en bekijk de fondsinformatie op de website van ASN Impact Investors.Belangrijke documentenLees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval het Essentiële-informatiedocument van de fondsen die je overweegt te kopen. Essentiële-informatiedocument ASN Duurzaam Small & Midcapfonds (pdf) 177,85 KB Factsheet ASN Duurzaam Small & Midcapfonds (pdf) 251,34 KB Maandbericht ASN Duurzaam Small & Midcapfonds Beleg in dit fondsBekijk en vergelijk alle themafondsenLiever een fonds met een ander risiconiveau, thema of samenstelling? Bekijk al onze beleggingsfondsen. Of ve