full_description = "Over SNS SNS wordt ASN Bank Misschien las of hoorde je er al iets over in de media: de Volksbank is bezig met een transformatie. SNS is onderdeel van de Volksbank. Op deze pagina vind je altijd de laatste informatie over de transformatie. Bekijk meer Financiële kennis Gebrek aan deskundig advies vergroot risico op financiële ongelijkheid Uit ons nieuwste onderzoek blijkt dat bijna twee derde van de Nederlanders tussen de 18-24 jaar graag persoonlijk advies wil. Maar 52% weet niet de route naar een expert van hun bank niet. Bekijk meer Financiële kennis Prinsjesdag 2024 Wat verandert er voor jouw portemonnee? Ingewikkeld? Wij vertellen je op een begrijpelijke manier wat er voor jouw portemonnee verandert als de plannen doorgaan. Bekijk meer Kansengelijkheid Raad van Toekomst geeft jongvolwassenen opnieuw een stem SNS heeft vorig jaar de Raad van Toekomst in het leven geroepen om jongvolwassenen nadrukkelijker bij haar beleid en bedrijfsvoering te betrekken. Na een succesvol 1e jaar start SNS deze week met een nieuw raadsjaar. Bekijk meer Financiële kennis Warm welkom voor studenten in Groningen Collega’s van SNS Groningen gaven eerstejaars studenten (wo, hbo én mbo) een warm welkom op de introductieweken. Op verschillende manieren voerden ze het belangrijke gesprek over geld. Bekijk meer Kansengelijkheid Finale Student Company of the Year 2024 Op de finaledag barstte de strijd los tussen de beste mbo- en hbo-studenten. Zij pitchen hun onderneming aan het publiek en de jury voor de titel ‘Student Company of the Year 2024’. Bekijk meer Gelijke groeikansen SNS biedt traineeships aan bij FinFuture Op zoek naar een traineeship binnen de financiële sector? SNS Schagen, Den Helder & Heerhugowaard, biedt traineeships aan Mbo-studenten bij FinFuture Bekijk meer Over SNS SNS 3e plaats 'Klantvriendelijkste bank van Nederland' Supermooi nieuws: we zijn gekozen als de 3e klantvriendelijkste bank van Nederland. Daar zijn we trots op! Bekijk meer Kansengelijkheid Terugblik SNS-paviljoen op Skills The Finals In ons eigen paviljoen kwamen honderden scholieren, studenten, ouders, docenten, jongerenvertegenwoordigers en ondernemers gingen in gesprek over gezonde geldkeuzes. Bekijk meer 1 2 paging_next paging_last"
