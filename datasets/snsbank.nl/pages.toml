full_description = "Je eerste huis? er kan vaak meer dan je denkt. Lees verder Waar kunnen we je mee helpen? Zoek naar ... Zoeken Hypotheek berekenen Betaalrekening openen Beginnen met beleggen SNS maakt overstappen makkelijkWil je je geldzaken bij ons regelen? Fijn! Met wat extra hulp van ons overstapteam is 't een fluitje van een cent.Overstappen van bank Bij ons draait het om jou Alle aandacht voor jou Het draait om jouw belang Voor jou: ons partnernetwerk Jouw ontwikkeling: ons doel Ontdek onze 4 beloften Eerst de mens. Dan het geld. Wij zijn de bank die jou op de eerste plek zet. Daarom zeggen we 'Eerst de mens. Dan het geld'. Bij ons draait het om jou Wat zijn jouw dromen en ambities? Wil je een huis kopen? Of eerder stoppen met werken? Bij ons draait het om jou en het bereiken van je doelen. Meer over onze manier van werken Transformatie SNS: wat gaat er gebeuren?Misschien las of hoorde je er al iets over in de media: de Volksbank is bezig met een transformatie. SNS is onderdeel van de Volksbank en dit geldt dus ook voor ons. Op deze pagina vind je de laatste informatie.Lees verder Onze klantvriendelijkheid weer bekroondSNS is trots op een plek in de top 3 van de ranglijst 'Klantvriendelijkste bank van Nederland'. Een groot onafhankelijk onderzoek onder consumenten door MarketResponse.Lees verder Webinar: Herken en voorkom online fraudeInternetcriminelen worden steeds sluwer, maar jij kunt ze een stap voor blijven. Tijdens ons gratis webinar ontdek je de meest gebruikte trucs van oplichters. En leer je hoe je je bankzaken veilig houdt.Lees verder"
