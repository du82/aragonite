full_description = "Eerst de mens. Dan het geld.Het draait bij ons niet om geld. Het draait om jou. Weten waarom en hoe we dat doen?Lees er meer over SNS Nieuwsberichten Hier vind je het laatste nieuws, persberichten, interviews en informatie over recente acties van SNS. SNS nieuws Onze maatschappelijke impactWij vinden dat iedereen de kans moet krijgen om te groeien in het leven. Daarom werken we aan oplossingen voor zaken die jouw groei in de weg kunnen staan.Lees er meer over Kom eens kennismakenWe leren je graag kennen. Loop je ’n keer bij ons binnen? De koffie staat klaar. Met bijna 200 SNS Winkels zitten we zeker ook vlak bij jou in de buurt. Meer weten SNS Historische filmBij SNS zetten we de mens voorop. Dat doen we al meer dan 200 jaar. In onze historische film zie je hoe SNS ooit is gestartBekijk de film Onderdeel van de VolksbankSNS hoort bij de Volksbank. Net als ASN Bank, BLG Wonen en RegioBank. We hebben allemaal de missie: bankieren met de menselijke maat.Meer over de Volksbank Werken bij SNSWil je graag bij ons werken of een eigen SNS Winkel openen? Bekijk onze vacatures en voel je welkom!Werken bij SNS Voor journalistenBen je op zoek naar persberichten, een contactpersoon of nieuws over SNS?Voor journalisten Future Money TalksWe willen allemaal vooruit in het leven. Maar voor jongeren wordt ‘t er niet makkelijker op. Met Future Money Talks helpen je we met tips en handige video’s en kijken we naar wat er wél kan.Lees verder SNS Raad van ToekomstDe Raad van Toekomst adviseert 1 jaar lang over onderwerpen die hen bezighouden. Op die manier krijgt de nieuwe generatie een stem in het beleid en de organisatie van de bank.Lees verder GroeikansendebatIn het groeikansendebat op 28 november gingen ruim 80 jongvolwassenen, maatschappelijke bestuurders en politici gingen met elkaar in gesprek over gelijke groeikansen onder jongeren.Lees het verslag"
