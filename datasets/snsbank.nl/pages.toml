title = "De risico's van beleggen - SNS Bank"
description = "Ga je beleggen of beleg je? Dan is het belangrijk dat je de risico’s van beleggen begrijpt en dat je weet hoe je er grip op krijgt."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen.Het risico van beleggen in het kortBeleggingen koop je tegen een bepaalde koers: de koers van het moment dat je instapt. Het geld krijg je pas als je verkoopt. De waarde van je beleggingen kan op het moment dat je verkoopt lager of hoger zijn dan toen je instapte. Met andere woorden: je kunt geld verliezen. Of je geld wordt meer waard.Verkoop je je participaties op een moment dat de koers hoger is dan je aankoopkoers? En je houdt na aftrek van de kosten meer over dan je inleg? Dan maak je winst. Maar verkoop je de participaties wanneer de koers lager ligt dan je aankoopkoers? Dan raak je een deel van je inleg kwijt. Dat geldt ook als je belegt in aandelen of obligaties. Dat is het risico van beleggen. Het risico van koersschommelingenStel, je koopt participaties voor bedrijf X voor € 25 per stuk. De koers wordt elke dag opnieuw vastgesteld en kan schommelen: naar boven, of naar beneden. Een paar dagen later kunnen de participaties dus bijvoorbeeld € 24,50 of € 25,50 waard zijn. Gebeurt er iets heftigs, dan kan het zomaar zijn dat de participaties ineens maar € 9 waard zijn. Herstelt het vertrouwen, dan kan de koers weer omhoog gaan. Zo kan het zijn dat in een periode van 20 jaar de waarde schommelt van bijvoorbeeld € 25 naar € 9 naar € 20 naar € 40 naar € 28. Verkoop je op het moment dat je participaties € 9 waard zijn per stuk, dan lijd je natuurlijk een flink verlies – je had immers € 25 per stuk betaald. Maar verkoop je op het moment dat ze € 40 waard zijn, dan ontvang je meer dan je hebt ingelegd. Dan maak je flinke winst. De risico's verschillen per type beleggingDe schommelingen in de koersen worden veroorzaakt door ontwikkelingen bij de aandelen of obligaties waarin je belegt, of waarin jouw beleggingsfonds belegt. Niet altijd gaat het met zulke grote schommelingen als in het voorbeeld hierboven. De risico’s verschillen bovendien per type belegging: Risico’s van beleggen in aandelen Beleg je in aandelen, dan ben je voor een stukje eigenaar van het bedrijf dat de aandelen uitgeeft. Het risico van je belegging wordt dan beïnvloed door: Bedrijfsspecifieke risico's Bedrijfsspecifieke risico’s gelden voor één bedrijf. Denk aan bijvoorbeeld de kwaliteit van de werknemers en of de strategie effectief is. Zijn de kwaliteit en de strategie goed op orde, dan is dat goed voor de koers. Sectorspecifieke risico's Sectorspecifieke risico’s horen bij de sector waarin het bedrijf actief is. Hoe goed het bedrijf het ook doet, de ontwikkelingen in de sector beïnvloeden de resultaten. Marktrisico's Marktrisico’s gelden voor bedrijven uit verschillende sectoren. Daalt de economische groei, dan dalen ook de koersen van bijna alle aandelen. Worden beleggers bang en gaan ze tegelijkertijd hun aandelen verkopen, dan kunnen veel aandelen tijdelijk in waarde dalen. Dan spreken we van een negatief beurssentiment. Valutarisico's Valutarisico loop je als je belegt in een aandeel met een koers in een andere valuta dan de euro. Daalt de koers van de andere valuta, dan daalt ook de waarde van je belegging omgerekend in euro’s. Risico’s van beleggen in obligaties Beleg je in obligaties, dan leen je geld aan een overheid of bedrijf tegen een vaste rente. Het risico van je belegging wordt beïnvloed door: Renterisico Stijgt de kapitaalmarktrente, dan dalen de koersen van veel bestaande obligaties. Andersom stijgen de koersen van veel obligaties als de kapitaalmarktrente daalt. Bij obligaties met een lange looptijd is dit effect sterker dan bij obligaties met een korte looptijd. Kredietrisico De overheid of onderneming die de obligatie uitgeeft, heeft een verplichting om rente te vergoeden en uiteindelijk de obligatie terug te betalen. Is het spannend of de overheid of onderneming daar wel aan kan voldoen? Dan daalt de koers van de obligatie. Valutarisico Valutarisico loop je als je belegt in een obligatie met een koers in een andere valuta dan de euro. Daalt de koers van de andere valuta, dan daalt ook de waarde van je belegging omgerekend in euro’s. De risico's begrijpen geeft houvastBeleggen zonder risico bestaat dus niet. Als je dat weet en dat begrijpt, dan kun je er meer grip op krijgen. Hoe je meer grip krijgt, lees je in:Veilig beleggenTot slot: kies het risiconiveau dat bij je pastDe een neemt meer risico dan de ander. Bij beleggen geldt doorgaans de regel: hoe meer risico je durft te nemen, hoe groter je kans op een hoger rendement. Kun je het risico lopen om veel geld kwijt te raken, dan kun je gaan voor een offensief profiel met een hoger risico. Kan of wil je dat risico niet lopen, ga dan voor een defensief profiel met een lager risico. Dan kun je nog steeds winst maken. Wanneer zou je kunnen kiezen voor een hoger risico? Je kunt je geld voor langere tijd missen. Het liefst 5 jaar of langer. Je vindt het acceptabel dat de waarde van je belegging in die tijd flink naar boven en naar beneden kan gaan. Wanneer zou je kunnen kiezen voor een lager risico? Je kunt je geld voor een kortere tijd missen. Maar houd er voor beleggingen rekening mee dat dit toch wel 3 jaar moet zijn. Anders kun je misschien beter sparen. Je vindt het fijn dat de waarde van je belegging in de tussentijd niet te veel schommelt. Je begint met beleggen, waardoor je de risico’s misschien nog niet goed kunt overzien. Gebruik de risico-indicatorDe risico-indicator is een handig hulpmiddel om de risico’s van beleggingsfondsen in te zien én te vergelijken. Met de risico-indicator kun je het risico van een beleggingsfonds inschatten. En vergelijk hiermee ook beleggingsfondsen van verschillende aanbieders met elkaar. Voorbeeld risico-indicator: Bij ons kun je kiezen uit een overzichtelijk aantal duurzame beleggingsfondsen. Per fonds staat de risico-indicator vermeld. In het te downloaden Essentiële-informatiedocument (Eid) vind je er meer informatie over. Naar de fondsen 5 misverstanden over beleggen Kun je alleen beleggen als je al een groot vermogen hebt? Lees hier 5 misverstanden over beleggen. Meer weten Mogelijk rendement berekenen Weten wat beleggen kan opleveren? Bereken het mogelijk rendement van beleggen en welke inleg je daarvoor nodig hebt. Rendement berekenen"
