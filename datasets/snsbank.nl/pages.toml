title = "Een creditcard aanvragen bij je bankrekening - SNS Bank"
description = "Met een SNS Creditcard kun je makkelijk online en in binnen- en buitenland in winkels betalen. Creditcard aanvragen? Of meer informatie? Je vindt het hier."
full_description = "Let op: Visa en Mastercard hebben besloten dat hun creditcards niet meer in Rusland gebruikt kunnen worden. Dat geldt dus ook voor je SNS Creditcard. Meer informatie vind je op de website van ICS .De SNS Creditcard van VisaInternational Card Services (ICS) geeft onze creditcards uit. Deze zijn van VISA. ICS is de grootste uitgever van creditcards in Nederland. Goed om te weten: De SNS Creditcard is van Visa en wordt uitgegeven door International Card Services (ICS). Handig voor in het buitenland De SNS Creditcard is een Visa Card. Hiermee kun je in de hele wereld betalen en contant geld opnemen. Je hebt zo altijd de juiste ‘muntsoort’ op zak. Online betalen Betalen met je SNS Creditcard op internet is makkelijk als je iets wilt kopen in een webwinkel. Je kunt je creditcard extra beveiligen met Visa Secure. Dat is een zelfgekozen wachtwoord. Je kunt ook een betaalopdracht goedkeuren via de ICS App. Je aankopen zijn verzekerd Extra voordeel van je SNS Creditcard: de meeste spullen die je ermee koopt zijn automatisch 180 dagen verzekerd tegen verlies, diefstal en beschadiging. En koop je iets online, maar wordt het artikel niet geleverd? Dan kun je gebruikmaken van de Aflevergarantie van ICS. Aanvullende reisverzekering Betaal je een reis met je SNS Creditcard? Dan ben je wereldwijd verzekerd bij vlucht- en bagagevertraging, hulpverlening en reisongevallen. Een mooie aanvulling op je eigen reisverzekering. Lees meer over de aanvullende reisverzekering Goed om te weten voor je 'm aanvraagt:In Nederland wordt je betaalpas overal geaccepteerd, waardoor een creditcard niet altijd nodig is.Als je met een creditcard euro's opneemt bij een geldautomaat, betaal je 4% van het opgenomen bedrag extra. Als je andere valuta opneemt, betaal je daarbovenop nog eens 2% wisselkoersopslag.De extra bestedingsruimte op je creditcard kan er ook voor zorgen dat je te veel uitgeeft, zodat je het bedrag niet meer terug kunt betalen. Let er dus op dat je niet in financiële problemen komt. Hoe werkt dat, zo'n creditcard? International Card Services (ICS) biedt onze creditcards aan. Je krijgt je kaart dus van hen. ICS checkt of je een creditcard financieel kunt dragen en of je een SNS Betaalrekening hebt. Je kunt een limiet aanvragen vanaf € 1.000. Je hebt een maandelijks netto inkomen nodig van minimaal € 1.150. Ben je student en heb je elke maand een netto vast inkomen tussen de € 500 en € 1.150? Dan kun je een limiet krijgen van maximaal € 500. Je mag geen negatieve BKR registratie hebben. Er staat elke maand een online rekeningoverzicht voor je klaar. Betalen aan ICS doe je met een automatische incasso, via iDeal of met een overboeking. In Mijn ICS en in de ICS App zie je je creditcarduitgaven, bestedingslimiet en bestedingsruimte. De gegevens die je erin ziet, zijn altijd actueel. Lees meer over betalen met je creditcard Extra creditcard aanvragenJe kunt een extra creditcard aanvragen, bijvoorbeeld voor je partner of een volwassen gezinslid. Op het rekeningoverzicht staat precies wat met welke creditcard is betaald. Wel zo overzichtelijk. Let op: je totale bestedingslimiet blijft hetzelfde met een extra kaart. Je vraagt hem aan via Mijn ICS. De kosten van een SNS CreditcardVoor het aanbieden van de SNS Creditcard door ICS betaal je elk jaar € 35. Een extra creditcard kost ook € 35 per jaar. Heb je een SNS Jongeren- of Studentenrekening? Dan betaal je € 25 per jaar. Alle kosten van je creditcardWereldwijd betaalgemakMet je SNS Creditcard kun je over de hele wereld betalen op meer dan 38 miljoen plaatsen en contant geld opnemen bij 2 miljoen geldautomaten die Visa accepteren. Vragen over je SNS Creditcard?Heb je een vraag over je creditcard? Dan kun je terecht bij ICS. Telefoonnumer: 020 - 660 01 88 icscards.nl/klantenservice De voorwaarden van de SNS CreditcardVoor de SNS Creditcard gelden de Algemene Card Voorwaarden Banken van ICS. Daarin lees je wat je van ze kunt verwachten. Maar ook wat zij van jou verwachten. Er zijn ook voorwaarden voor de verzekeringen die horen bij je kaart. Lees ze allemaal goed door voordat je een creditcard aanvraagt. Algemene Card Voorwaarden Banken ICS (pdf) 117,22 KB Voorwaarden aankoopverzekering ICS (pdf) 294,25 KB Voorwaarden Aanvullende Reisverzekering ICS (pdf) 984,37 KB SNS Creditcard aanvragenMet een SNS Creditcard kun je wereldwijd en online betalen én contant geld opnemen.Nu aanvragen bij ICS SNS Creditcard voor studenten Speciaal voor jou als je een studentenrekening bij ons hebt. Nu aanvragen bij ICS"
