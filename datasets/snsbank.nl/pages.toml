title = "SNS wordt ASN Bank - SNS Bank"
description = "De Volksbank is bezig met een transformatie. SNS is onderdeel van de Volksbank. Op deze pagina vind je altijd de laatste informatie over de transformatie."
full_description = "SNS wordt ASN Bank Bijgewerkt op 05 februari 2025 SNS is onderdeel van de Volksbank, net als ASN Bank en RegioBank. Achter de schermen werken we al veel samen. Nu zetten we de volgende stap en gaan we allemaal verder als 1 sterk merk: ASN Bank. Op deze pagina vind je altijd de laatste informatie, plus veelgestelde vragen. Een vooruitstrevende bank Met deze nieuwe stap, bundelen we onze krachten en kunnen we je nog beter van dienst zijn. ASN Bank is een vooruitstrevende bank die zich inzet voor mens, dier en natuur. Dat vinden wij belangrijk. Net als onze persoonlijke aanpak. Dat mag je van ons blijven verwachten. Je blijft dus gewoon welkom in onze winkels, óók als we straks ASN Bank zijn. Goed om te wetenSNS en ASN Bank hebben veel met elkaar gemeen. Zo staan we allebei in de top 3 van de klantvriendelijkste banken van Nederland. Winkels samenvoegenOp dit moment hebben SNS en RegioBank samen zo’n 600 winkels. Op sommige plekken zitten deze dicht bij elkaar. Waar dat zo is, gaan we ze samenvoegen. Zo werken we aan een netwerk waarin onze winkels goed verspreid zijn over heel Nederland. In februari wordt de SNS Winkel aan de Croeselaan in Utrecht als eerste omgebouwd tot ASN Winkel. De andere winkels volgen later. Veelgestelde vragenWe kunnen ons voorstellen dat je vragen hebt. Deze beantwoorden we hieronder zo goed mogelijk. 1. Je bankzaken Blijven mijn rekeningen bestaan? Of veranderen ze? Je betaal- en spaarrekening blijven gewoon bestaan. Dat geldt ook voor hypotheken, verzekeringen, beleggingsrekeningen of andere producten die je bij ons hebt afgesloten. Of er op de lange termijn iets verandert, zoals de naam van een product, dat weten we nu nog niet. Mocht er in de toekomst wel iets voor je veranderen, dan krijg je daar vanzelf persoonlijk bericht over. Wordt mijn rekening duurder door het duurzamere beleid van ASN Bank? Goed om te weten dat alle merken van de Volksbank, dus ook SNS, al sinds 2017 hetzelfde duurzaamheidsbeleid hebben. Op dat gebied verandert er dit moment dus niets voor je. Verandert er daarin iets voor jou? Dan krijg je vanzelf bericht. Kan ik mijn betaalpas blijven gebruiken? Ja, die kun je gewoon nog gebruiken. Je regelt je bankzaken voorlopig zoals je gewend bent. Verandert er iets? Dan krijg je daar vooraf natuurlijk vanzelf persoonlijk bericht over. Kan ik Mijn SNS en de SNS App nog gebruiken? Ja, die kun je gewoon nog gebruiken. Je regelt je bankzaken voorlopig zoals je gewend bent. Verandert er iets? Dan krijg je daar vooraf natuurlijk vanzelf persoonlijk bericht over. Wat gebeurt er met mijn rekeningnummer (IBAN)? Je rekeningen blijven gewoon bestaan. Als er iets gaat veranderen, bijvoorbeeld een rekeningnummer, dan krijg je daar vanzelf persoonlijk bericht over. Kan ik nog nieuwe producten afsluiten bij SNS? Ja, voorlopig verandert daar nog niets in. Blijven jullie dezelfde producten en diensten aanbieden? Ja, voorlopig bieden we nog dezelfde producten en diensten aan. Ook staan we gewoon voor je klaar in de SNS Winkels. 2. Veiligheid Hoe weet ik of een bericht over de transformatie echt van jullie komt? Krijg je de vraag om je pas op te sturen, geld over te boeken of persoonlijke gegevens, zoals je pincode, te delen? Let op! Dit vragen wij je nooit. Krijg je een bericht of word je gebeld namens de bank en vertrouw je het niet? Bel dan zelf je bank op het nummer dat je hier op de site vindt en check het. Dat vinden onze medewerkers geen probleem. Lees meer over het herkennen van bankhelpdeskfraude. Hoe zit het met de Depositogarantie? Daar verandert niets in. Met de Nederlandse Depositogarantie krijg je je geld tot € 100.000 terug als een bank failliet gaat. De Volksbank heeft nu een bankvergunning voor alle merken samen. Dus heb je nu een rekening bij ons en ook rekening bij een van de andere merken? Dan geldt het maximum van € 100.000 voor deze rekeningen samen. Is het geld op mijn SNS (spaar)rekening nog wel gegarandeerd? Jazeker. Met de Nederlandse Depositogarantie krijg je je geld tot € 100.000 terug als een bank failliet gaat. Lees meer over de Nederlandse Depositogarantie. 3. SNS Winkels Verdwijnen er winkels? Ja en nee. De Volksbank heeft op dit moment zo’n 600 vestigingen met SNS Winkels en RegioBank-kantoren. Dit worden over een tijd allemaal ASN-vestigingen. Maar op sommige plekken zitten die vestigingen dichtbij elkaar. Waar dat zo is, gaan we ze samenvoegen. Het kan dus inderdaad zijn dat een winkel bij jou in de buurt binnenkort haar deuren moet sluiten, maar óók dat er op termijn juist een vestiging in de buurt bijkomt. Blijft mijn winkel in de buurt bestaan? Persoonlijke aandacht voor onze klanten blijft voorop staan. En daar horen ook winkels bij, verspreid over heel Nederland. De Volksbank heeft op dit moment zo’n 600 vestigingen met SNS Winkels en RegioBank-kantoren. Op sommige plekken zitten die vestigingen dichtbij elkaar. Waar dat zo is, gaan we ze samenvoegen. De komende tijd bekijken we om welke vestigingen het gaat. Heeft dit gevolgen voor een winkel bij jou in de buurt? Dan krijg je daar vanzelf bericht over. Kan ik straks ook terecht bij een ASN Winkel? Ja, dat kan. De komende tijd worden SNS Winkels langzaam maar zeker omgebouwd tot ASN Winkel. De winkels krijgen dan een nieuw jasje, maar verder blijft alles zoals je gewend bent: de service, de medewerkers en je kunt nog steeds gewoon binnenlopen met een vraag over je SNS-bankzaken. 4. Overig Waarom deze verandering? Bij de Volksbank regelen we voor alle merken al zoveel mogelijk op dezelfde manier. Nu gaan we nog een stap verder: alle merken bundelen hun krachten en we gaan verder als 1 bankmerk. Daarmee krijgt de bank een eenvoudigere structuur en kunnen we efficiënter werken. Zo zijn we klaar voor de toekomst en blijven we ook op de lange termijn financieel gezond. Wat betekent dit nu voor mij? Op dit moment verandert er nog niks. Alles wordt nog zorgvuldig uitgedacht en dat kost tijd. Dus regel je je bankzaken zoals je gewend bent. En is er meer duidelijk? Dan laten we je dat zo snel mogelijk met een persoonlijk bericht weten. Moet ik mij zorgen maken over mijn bank? Nee, de merken van de Volksbank zijn op dit moment allemaal financieel gezonde banken. Door onze krachten te bundelen bereiden we ons voor op de toekomst, en zorgen we dat we ook op de lange termijn sterk blijven. Hoe lang duurt het voordat SNS ASN Bank wordt? De overgang naar 1 merk gaat stap voor stap. Alles moet zorgvuldig geregeld worden en dat kost tijd. Uiteindelijk zal het meerdere jaren duren voor alle winkels, kantoren en klanten zijn overgezet naar ASN Bank. Een andere vraag?Staat je vraag er niet tussen? Bekijk hoe je contact met ons kunt opnemen. Meer nieuws Bekijk ons laatste nieuws, onze acties en campagnes. Meer nieuws"
