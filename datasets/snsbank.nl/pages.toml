full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen. Het Biodiversiteitsfonds in 't kortHet eerste Nederlandse fonds dat wereldwijd investeert in herstel en bescherming van biodiversiteit Je belegt onder meer in regeneratieve (bos)landbouw en duurzame visserijJe streeft naar vermogensgroei op lange termijn en bent bereid hier een bovengemiddeld risico voor te nemen. Wanneer kiezen voor ASN Biodiversiteitsfonds?Kies je voor het ASN Biodiversiteitsfonds, dan investeer je in het herstel van de balans tussen mens en natuur. De fondsbeheerder selecteert ondernemingen die zich richten op herstel en bescherming van de biodiversiteit. Zo wordt er belegd in regeneratieve (bos)landbouw, gezonde bossen, ecotoerisme en duurzame visserij. Na de toetsing op impact op biodiversiteit vindt de financiële beoordeling plaats. Beleg in dit fonds Bekijk fondsdocumenten Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); https://www.afm.nl/eid Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 23,01**Dit is de meest recente afgiftekoers van het fonds die bij ons bekend is. Is er een nieuwe afgiftekoers beschikbaar? Dan updaten we de koers hier ook. Dat is elke beursdag rond 10.30 uur. Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 1 Maand 3 Maand 1 Jaar Bron: Infront Financial Technology RendementHet ASN Biodiversiteitsfonds investeert in projecten, aandelen en in onderhandse leningen aan bedrijven. Sommige van deze projecten en bedrijven waren voorheen alleen toegankelijk voor o.a. professionele beleggers zoals pensioenfondsen en verzekeraars. Het fonds richt zich op vier sectoren: duurzame bosbouw, duurzame boslandbouw, duurzame zeeën en visserijen en ecotoerisme. Tegelijkertijd staat het ASN Biodiversiteitsfonds voor nieuwe ‘groene’ werkgelegenheid, die niet ten koste gaat van de natuur en bijdraagt aan lokale welvaart. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Nettorendement na aftrek van de kosten van het fonds t/m Vanaf de start* 10 jaar* 5 jaar* 3 jaar* Dit jaar Fonds -3,04% -3,10% 0,22% *Gemiddeld per jaarRisicoHet ASN Biodiversiteitsfonds investeert in vier verschillende sectoren. Omdat het fonds belegt in nieuwe sectoren waarover nog weinig bekend is, wordt het risico nu als bovengemiddeld ingeschaald. Het fonds spreidt de beleggingsrisico’s zoveel mogelijk door te spreiden over verschillende sectoren, bedrijven en regio’s.KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan SNS betaalt. Bekijk alle kosten Hoe is het fonds opgebouwd?De werkwijze bij het ASN Biodiversiteitsfonds is anders dan bij klassieke beleggingsfondsen. Klassieke fondsen bepalen vaak als eerste de verhouding tussen aandelen, obligaties en andere beleggingscategorieën. Het ASN Biodiversiteitsfonds kijkt eerst welke sectoren een goede kans hebben om de biodiversiteit te versterken. De ene keer investeert de fondsmanager in aandelen van een bedrijf, de andere keer in onderhandse leningen. Een greep uit de grootste investeringen van het fonds: Aqua-SparkForest Climate Solutions FundSLM Silva Europe Fund FondsmanagementHet ASN Biodiversiteitsfonds is een bij de AFM geregistreerd subfonds van ASN Biodiversiteitsfonds N.V. ASN Impact Investors (een handelsnaam van ASN Beleggingsinstellingen Beheer B.V.) is de beheerder en beschikt over een vergunning als beheerder van beleggingsinstellingen zoals bedoeld in art. 2:69b van de Wft. De koers van het ASN Biodiversiteitsfonds is afhankelijk van de waarde van de beleggingen binnen het fonds. Daardoor kan je belegging meer, maar ook minder waard worden.Meer weten over het duurzaamheidsbeleid van fondsbeheerder ASN Impact Impact InvestorsBelangrijke documenten Lees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval het Essentiële-informatiedocument van de fondsen die je overweegt te kopen. Essentiële-informatiedocument ASN Biodiversiteitsfonds (pdf) 145 KB Factsheet ASN Biodiversitetsfonds (pdf) 301,78 KB Kwartaalbericht ASN BiodiversiteitsfondsBeleg in dit fondsBekijk en vergelijk alle themafondsenLiever een fonds met een ander risiconiveau, thema of samenstelling? Bekijk alle beleggingsfondsen. Of vergelijk alle fondsen eenvoudig met de fondsvergelijker. Met deze handige tool vergelijk je eenvoudig de verschillende duurzame beleggingsfondsen, de bijbehorende risico’s en mogelijke rendementen. Fondsvergelijker Vergelijk het mogelijke rendement en risico per fonds. Naar de fondsvergelijker Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
