title = "Beleggen in obligaties - SNS Bank"
description = "Wat zijn obligaties? En hoe werken ze? Hier kom je meer te weten over obligaties, obligatiekoersen en obligaties kopen."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen. Wat zijn obligaties?Een obligatie is een schuldbewijs, een deel van een lening aan een land, overheidsinstelling of onderneming. Een obligatie heeft vaste looptijd die meestal ligt tussen de vijf en de dertig jaar. Ieder jaar krijg je een vast of variabel rentebedrag uitgekeerd (couponrente). Aan het eind van de looptijd wordt de obligatie weer afgelost. Soms mag een obligatie vervroegd afgelost worden door de uitgevende instelling.Hoe werkt een obligatie?De kenmerken van obligaties in het kort: Nominale waarde: dat is het bedrag van de lening (of restant). Couponrente: hoe hoger het risico hoe hoger de rente. Looptijd: hoe langer de looptijd hoe groter het risico en dus hoe hoger de couponrente. Tussentijds verkopen: als de obligaties via de beurs verhandelbaar zijn, kun je ze tussentijds verkopen. Rendement obligatiesVoor een obligatie geldt: couponrente + koerswinst = rendement.Couponrentede marktrente: deze wordt vastgesteld door de Europese Centrale Bankde looptijd van de lening: hoe langer de looptijd van de obligatie, hoe hoger de rente· de kredietwaardigheid van het bedrijf.Koerswinst Met obligaties loop je een risico, net als bij elke vorm van beleggen. Een stijging van de rente, die momenteel historisch laag is, kan bijvoorbeeld een flinke klap toebrengen aan obligatiehouders. Ook kan de uitgevende partij (bedrijf, overheidsinstelling of land) in de problemen komen of zelfs failliet gaan. In dat geval zal jouw investering minder waard worden, of zelfs zijn waarde verliezen.Obligaties kopenZelf obligaties kopenObligaties koop je op de beurs via een handelaar (broker). De coupures gaan in eenheden van € 1.000 of een veelvoud daarvan. Onderhands (buiten de beurs om) kan ook: je schrijft dan in op een lening. Voor- en nadelen van zelf obligaties kopenHet voordeel van zelf obligaties kopen, is dat het iets goedkoper is dan wanneer je dat via een beleggingsfonds doet. Je betaalt in het laatste geval immers fondskosten.Daartegenover staat dat je bij het zelf kopen van obligaties meer geld beschikbaar moet hebben om een gezonde spreiding te kunnen bereiken. Beleggen in obligaties via een fondsJe kunt ook participaties kopen in een obligatiefonds. De beheerder van dat fonds verzamelt geld van deelnemers om obligaties aan te kopen. Je kunt kiezen voor een fonds dat uitsluitend obligaties koopt, of voor een fonds met een mix van bijvoorbeeld aandelen en obligaties. Goed om te weten: Bij ons kun je alleen in duurzame mixfondsen beleggen. Deze bestaan uit een combinatie van aandelen, obligaties en microkredieten. Voor- en nadelenVoordeel is dat er vaak obligaties van meerdere bedrijven in verschillende landen worden gekocht, waardoor je een goede risicospreiding hebt. En de beheerder doet het werk voor jou. Je kunt al met 10 euro per maand meedoen in een fonds.Nadeel is dat er kosten aan verbonden zijn.Lees ook over beleggen in fondsen Meer of minder risico? Met de risico-indicator kun je het risico van een beleggingsfonds inschatten en met elkaar vergelijken. Hoe hoger het cijfer, hoe harder de koersen van de belegging stijgen en dalen, dus: hoe groter het risico. 5 misverstanden over beleggen Kun je alleen beleggen als je al een groot vermogen hebt? Lees hier 5 misverstanden over beleggen. Meer weten Beleg in 1 van de 5 mixfondsen Ieder mixfonds heeft zijn rendement- en risicoprofiel. Meer weten? Meer weten"
