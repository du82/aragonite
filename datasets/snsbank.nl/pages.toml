["https://snsbank.nl/particulier/beleggen/beleggingsfondsen/asn-microkredietfonds.html"]
title = "ASN Microkredietfonds  - SNS Bank"
description = "Met het ASN Microkredietfonds streef je naar een mooi rendement. Je bent bereid hier weinig risico voor te nemen."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Het ASN Microkredietfonds in 't kortHet fonds bestaat al sinds 1996 en heeft veel ervaring met het investeren in microfinancieringen.Een microkredietfonds kan zorgen voor een betere spreiding van je portefeuille.Een belegging van € 5.000 helpt gemiddeld 5 ondernemers aan een microkrediet. Waarom kiezen voor ASN Microkredietfonds ? Met het ASN Microkredietfonds kun je een laag risico combineren met rendement. Dit rendement komt vooral uit de rente die mensen over hun microkrediet betalen. Kies je voor het ASN Microkredietfonds, dan beleg je in ambities van kleine ondernemers in ontwikkelingslanden. Met een microkrediet krijgen ze toegang tot financiële diensten. Het helpt ze bijvoorbeeld bij een bedrijf opzetten of uitbreiden. Beleg je al in aandelen- of obligatiefondsen? Dan kan het toevoegen van het ASN Microkredietfonds een goede manier zijn om je portefeuille beter te spreiden. Dat komt doordat het fonds minder meebeweegt met de ups en downs van de financiële markten. Beleg in dit fonds Bekijk fondsdocumenten https://www.afm.nl/nl-nl/sector/themas/dienstverlening-aan-consumenten/informatieverstrekking/essentiele-informatiedocument-eid Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 54,15**Dit is de meest recente afgiftekoers van het fonds die bij ons bekend is. Is er een nieuwe afgiftekoers beschikbaar? Dan updaten we de koers hier ook. Dat is elke beursdag rond 10.30 uur. Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 3 Jaar 5 Jaar 10 Jaar 1 Maand 3 Maand 1 Jaar 3 Jaar 5 Jaar 10 Jaar Bron: Infront Financial Technology RendementHet ASN Microkredietfonds belegt je geld via onderhandse leningen en aandelenparticipaties in verschillende microfinancieringsinstellingen (MFI’s). Deze instellingen verstrekken de microkredieten aan de ondernemers. De renteopbrengsten van deze leningen zijn het belangrijkste deel van het rendement van het fonds. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. RisicoHet ASN Microkredietfonds spreidt je geld over 87 MFI’s in 42 verschillende landen. Samen bereiken de MFI’s meer dan 16 miljoen mensen. Deze spreiding zorgt voor een lager risico. Ook hebben de onderhandse leningen van het fonds vaak een korte looptijd. De ontwikkeling van de rentestand op de kapitaalmarkten heeft relatief weinig invloed op de waarde van het fonds. Meer weten over de impact die dit fonds maakt? Bekijk dan het ASN Impact Investors Report. KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan SNS betaalt.Bekijk alle kosten Hoe is het fonds opgebouwd?In ontwikkelingslanden is de toegang tot financiële diensten vaak beperkt, met name op het platteland. De MFI’s streven ernaar om microkredieten voor iedereen toegankelijk te maken: mannen en vrouwen, mensen uit de stad en van het platteland. Het is belangrijk om vrouwen te bereiken met de leningen, omdat dit vaak voordelen oplevert voor het hele gezin. Inmiddels is 82% van de leningnemers vrouw. Een greep uit goedgekeurde microkredieten van het fonds: Leningen voor apparaten en machines, zoals tweedehands naaimachinesLeningen voor het opzetten van webshopsBedrijfsleningen voor kleinschalige boeren FondsmanagementDit fonds is een subfonds van de beleggingsinstelling ASN Beleggingsfondsen AIF N.V. De beheerder is ASN Impact Investors, de handelsnaam van ASN Beleggingsinstellingen Beheer B.V. die beschikt over een vergunning als bedoeld in artikel 2:65 van de Wft. ASN Impact Investors en ASN Beleggingsfondsen AIF N.V. zijn ingeschreven in het register van de Autoriteit Financiële Markten. De waarde van uw belegging kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst.Meer weten over het duurzaamheidsbeleid van fondsbeheerder ASN Impact Impact InvestorsBelangrijke documenten Lees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval de Essentiële Beleggersinformatie van de fondsen die je overweegt te kopen. Essentiële-informatiedocument Essentiële-informatiedocument ASN Microkredietfonds (pdf) 176,33 KB Factsheet ASN Microkredietfonds (pdf) 107,78 KB Impact Report 2023 ASN Impact Investors (pdf) 3,15 MB Kwartaalbericht ASN Microkredietfonds Beleg in dit fondsBekijk en vergelijk alle themafondsen Liever een fonds met een ander risiconiveau, thema of samenstelling? Bekijk alle beleggingsfondsen. Of vergelijk alle fondsen eenvoudig met de fondsvergelijker. Met deze handige tool vergelijk je eenvoudig de verschillende duurzame beleggingsfondsen, de bijbehorende risico’s en mogelijke rendementen. Fondsvergelijker Vergelijk het mogelijke rendement en risico per fonds. Naar de fondsvergelijker Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
