full_description = "Waarom samen een rekening?Op-en-top romantiek natuurlijk. En er zijn meer voordelen.Eén rekeningnummer voor al jullie vaste lasten en incasso’s is niet alleen handig, maar geeft je ook overzicht. Zo zie je goed wat jullie uitgeven en waaraan. En je hoeft achteraf niet meer uit te rekenen wie wat heeft betaald. Heb je al een betaalrekening bij ons en wil je deze graag delen? Geen probleem. Een extra rekeninghouder toevoegen is zo geregeldMederekeninghouder nu toevoegen Samenwonen: samen een rekening openen?Ga je samenwonen? Lees waar je dan allemaal aan moet denken, zodat je deze gebeurtenis niet alleen romantisch maakt, maar het ook financieel handig regelt.Meer informatie Kenmerken SNS Basis en SNS Compleet SNS Basis SNS Compleet Kosten aanhouden betaalrekening € 3,45 per maand* € 4,45 per maand* Internetbankieren/mobiele app 1e betaalpas Extra betaalpas + € 0,75 per maand* Veel aankopen de eerste 30 dagen verzekerd X 3 dagen rood staan zonder rente te betalen** X 0,01% rente over je saldo tot € 5.000 X OpenenMeer informatie OpenenMeer informatie Alle kosten voor het gebruik van een betaalrekening op een rij * Dit zijn de vaste maandelijkse kosten. Er kunnen kosten bijkomen, bijvoorbeeld als je buiten de EER geld opneemt of daar betaalt met je betaalpas. De kosten voor de SNS EU Betaalrekening en de SNS Basis Privérekening vind je in de tarievenwijzer. Een overzicht van alle kosten vind je in de Tarievenwijzer Betalen. Tarievenwijzer Betalen (pdf) 267,19 KB **Deze rente is variabel en kan dus veranderen. Gezamenlijke rekening in je SNS AppMeteen de kosten delen tijdens een etentje? Of tijdens het winkelen je saldo checken? Makkelijk gedaan met de SNS App. Want daarmee heb je je gezamenlijke betaalrekening altijd op zak.Fijne bonus: financieel overzichtVaste lasten, benzine, boodschappen – al je uitgaven kun je met ons online huishoudboekje in aparte potjes onderbrengen. Zo weet je dus precies wat je waar aan uitgeeft. Tip: Stel een maximum per potje in. Dan weet je het als je over je budget heengaat. Of je partner. Meer informatie *Rood staan op de en/of rekening Op beide betaalrekeningen kun je rood staan aanvragen tot € 2.500. Je moet wel 1 keer in de 90 dagen een positief saldo hebben. Of en hoeveel je rood mag staan hangt af van onder andere je inkomen.Je betaalt rente over het bedrag dat je rood staat. Bij SNS Basis is dat al op de eerste dag dat je rood staat. Bij SNS Compleet kun je iedere maand 3 dagen tot maximaal € 2.500 rood staan, zonder dat je daar rente voor moet betalen. Na die 3 dagen betaal je wel rente over het bedrag dat je rood staat. De rente is variabel en kan dus veranderen.Meer over rood staan Handig bij je gezamenlijke betaalrekening Vraag een creditcard aan. De SNS Creditcard wordt aangeboden door International Card Services (ICS) voor € 24 per jaar.Ontvang een sms of e-mail als bijvoorbeeld je salaris binnenkomt. Combineer je betaalrekening met een hypotheek en krijg SNS Combinatievoordeel. Bankieren op je tablet, mobiel of pc Bij SNS Basis en SNS Compleet regelen jullie gezamenlijk online je geldzaken. In Mijn SNS, jullie eigen online bankomgeving, zien jullie waar jullie je geld aan uitgeven. En met de SNS Mobiel Bankieren app op jullie eigen telefoon of tablet hebben jullie je en/of- betaalrekening altijd bij de hand. In mijn SNS en de app zijn je bankzaken veilig. Lees hoe wij daarvoor zorgen en wat je zelf kunt doen om veilig te bankieren. De voorwaarden en kosten In de voorwaarden lees je wat je van ons kan verwachten. Maar ook wat wij van jullie verwachten. Lees ze goed door voor jullie een betaalrekening openen.In de tabel staan de kosten voor het aanhouden van de betaalrekening per maand. Er kunnen kosten bijkomen, bijvoorbeeld als je buiten de EU of in vreemde valuta geld opneemt of daar betaalt met je betaalpas. .Overzicht van alle kosten voor SNS Basis en SNS CompleetVoorwaarden SNS BasisVoorwaarden SNS Compleet Wij kiezen voor SNS Basis Open de betaalrekening SNS Basis: een goede basis voor je bankzaken. Nu samen openen Wij kiezen voor SNS Compleet Open nu SNS Compleet: de betaalrekening met extra’s waar je écht wat aan hebt. Nu samen openen"
