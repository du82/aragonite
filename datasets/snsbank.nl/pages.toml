title = "Raad van Toekomst   - SNS Bank"
description = "Als lid van de Raad krijg je de kans om jouw generatie een stem te geven in het bestuur en de organisatie van SNS. Doe je mee?"
full_description = "Als nieuw adviesorgaan worden we op verschillende manieren betrokken bij het beleid en de bedrijfsvoering van SNS. Zo schuiven we aan bij de directie, verschillende klantreisteams en hebben we ook de vrijheid om zelf thema’s aan te dragen om binnen de bank te bediscussiëren. Lees het manifest van de Raad van ToekomstMaak kennis met de Raad van Toekomst v.l.n.r: Jeroen, Roshni, Roy, Xiara, Tara, Kelly, Laurens, Maud, Mehmet, RickDe leden van de Raad van Toekomst zijn zorgvuldig geselecteerd uit 250 aanmeldingen en zijn niet in dienst bij SNS. Ze vertellen zelf wie ze zijn, wat hen bezighoudt en hoe ze tegen geldzaken aankijken. Klik op de namen om hun profielen te lezen. Jeroen Steegmans Kelly van den Bosch Maud Stamsnijder Mehmet Basar Rick Rosevink Roshni van Zeijst Roy Postma Tara Bakker Xiara Esseboom Brede samenstellingDe Raad van Toekomst heeft een brede samenstelling, waarin regio, leeftijd en opleidingstype van de leden zorgvuldig zijn afgewogen. Met leden uit onder meer Ede, Zwaag en Nijland is de regionale spreiding gewaarborgd. Ook zijn verschillende leeftijdscategorieën tussen 18 en 35 jaar gelijkmatig vertegenwoordigd. Qua opleidingsachtergrond variëren de leden van praktisch tot theoretisch en alles wat daartussen zit. De man-vrouwverhouding is 50/50. Begeleiding vanuit SNS SNS begeleidt de Raad van Toekomst door het plannen, voorbereiden en faciliteren van bijeenkomsten, het coachen van de leden en het communiceren over de bevindingen van de Raad. Zonne Zeevalk (adviseur maatschappelijke impact) is inhoudelijk verantwoordelijk voor de Raad. Zij is ook aanspreekpunt voor externe partijen en media.‘Honderd procent de toekomst’Als bank willen we beter inzicht krijgen in wat er speelt onder jongvolwassenen, en hen een stem geven in het beleid van de bank. Waarom? Omdat jongvolwassenen de toekomst van Nederland zijn. En omdat zij door allerlei factoren belemmerd worden in hun groei. Wij willen samen met hen naar oplossingen zoeken. Zo maken we samen een sterker Nederland. SNS-directeur Angela Eijlander hoopt dat andere organisaties het voorbeeld van de Raad van Toekomst zullen volgen: 'Jongvolwassenen vormen misschien twintig procent van de bevolking, ze hebben honderd procent de toekomst. Met de Raad van Toekomst geven we deze generatie bij SNS een plek aan tafel en betrekken we hen actief bij ons beleid. Hopelijk inspireren we andere bedrijven om hetzelfde te doen.' Manifest Raad van Toekomst De Raad van Toekomst roept de politiek en de financiële sector op om te luisteren naar jongvolwassenen. Lees het manifest SNS Jongerenboard Hoe staan jongvolwassenen in het leven? Hoe kijken ze naar zaken als wonen, leren en werken? Luisteren naar jongeren"
