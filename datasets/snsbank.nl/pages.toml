full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen. Het ASN Duurzaam Aandelenfonds in 't kortJe streeft naar een hoger rendement en begrijpt dat je hiermee een bovengemiddeld risico loopt.Je belegt gespreid in een duurzaam aandelenfonds.Je belegt wereldwijd in ondernemingen die geselecteerd zijn op financiële vooruitzichten. Wanneer kiezen voor het ASN Duurzaam Aandelenfonds?Kies je voor het Duurzaam Aandelenfonds, dan beleg je wereldwijd in aandelen van grote ondernemingen die goede financiële vooruitzichten hebben. De fondsbeheerder selecteert bovendien ondernemingen die vooruitkijken en koploper zijn in duurzame ontwikkeling. Een prettige gedachte dat je vermogen zou kunnen groeien, terwijl je geld niet belegd wordt in bedrijven die zich bezighouden met wapens, fossiele brandstoffen of kinderarbeid. Het Duurzaam Aandelenfonds is opgericht in 1993 en is daarmee een van de oudste duurzame beleggingsfondsen in Nederland.Beleg in dit fonds Bekijk fondsdocumenten https://www.afm.nl/eid Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 171,98**Dit is de meest recente afgiftekoers van het fonds die bij ons bekend is. Is er een nieuwe afgiftekoers beschikbaar? Dan updaten we de koers hier ook. Dat is elke beursdag rond 10.30 uur. Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 3 Jaar 5 Jaar 10 Jaar 1 Maand 3 Maand 1 Jaar 3 Jaar 5 Jaar 10 Jaar Bron: Infront Financial Technology Rendement ASN Duurzaam AandelenfondsNettorendement 3 jaar: 7,63%**Nettorendement 5 jaar: 7,92%****Deze nettorendementen zijn de gemiddelde nettorendementen per jaar t/m 31 juli 2024, na aftrek van de kosten van het fonds.De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Nettorendement na aftrek van de kosten van het fonds t/m 31 juli 2024 Vanaf de start 10 jaar* 5 jaar* 3 jaar* Dit jaar Fonds 8,13% 8,04% 7,92% 7,63% 3,51% RendementDe fondsbeheerder heeft als doel voor dit fonds het realiseren van vermogensgroei op de lange termijn.RisicoHet Duurzaam Aandelenfonds is een goed gespreid fonds waarmee je volledig in aandelen belegt. Je neemt daarmee een bovengemiddeld risico, terwijl je ook streeft naar een relatief hoger rendement. KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan ons betaalt. Bekijk alle kosten Hoe is het fonds opgebouwd?Het fonds belegt wereldwijd in aandelen van beursgenoteerde bedrijven. Hierbij worden bedrijven eerst geselecteerd op duurzaamheid en vervolgens op financiële vooruitzichten. Een greep uit de bedrijven die zijn goedgekeurd voor het beleggingsuniversum van het Duurzaam Aandelenfonds: ASMLBeiersdorfNovo Nordisk FondsmanagementASN Impact Investors is de handelsnaam van ASN Beleggingsinstellingen Beheer B.V. (ABB). ASN Impact Investors is beheerder van beleggingsinstellingen en beheerder van instellingen voor collectieve belegging in effecten (icbe’s) zoals bedoeld in de Wet op het financieel toezicht. Het [fondsnaam] is een subfonds van ASN Beleggingsfondsen UCITS N.V. / ASN Beleggingsfondsen AIF N.V. / ASN Biodiversiteitsfonds N.V. De koers van het Duurzaam Aandelenfonds is afhankelijk van de waarde van de beleggingen binnen het fonds. Daardoor kan je belegging meer, maar ook minder waard worden.Meer weten over het duurzaamheidsbeleid van fondsbeheerder ASN Impact Impact InvestorsBelangrijke documenten Lees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval het Essentiële-informatiedocument van de fondsen die je overweegt te kopen. Essentiële-informatiedocument ASN Duurzaam Aandelenfonds (pdf) 174,32 KB Factsheet ASN Duurzaam Aandelenfonds (pdf) 252,1