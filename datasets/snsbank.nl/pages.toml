["https://snsbank.nl/particulier/pensioen/pensioen-aanvullen.html"]
title = "Pensioen aanvullen: 5 manieren voor extra pensioen - SNS Bank"
description = "Wil je straks extra inkomsten hebben naast je AOW en je werknemerspensioen? Wij geven je 5 manieren waarmee je extra pensioen opbouwt. Lees ze hier."
full_description = "Je pensioen aanvullen?Hoe zit het ook alweer? Even een opfrisser: je pensioenuitkering is opgebouwd uit AOW én het pensioen dat je mogelijk als werknemer hebt opgebouwd.Wist je dat je naast deze pensioenpotjes ook zelf vermogen voor je pensioen kan aanvullen? Dit is belangrijk omdat het pensioeninkomen vaak lager is dan je salaris of inkomen uit eigen onderneming. Daarnaast is de kans groot dat je uitgaven bij pensionering veranderen: je hebt namelijk meer vrije tijd. Als je pensioeninkomen minder is dan wat je nodig hebt, dan heb je een pensioengat.1. Start met sparen of beleggen voor aanvullend pensioenJe kunt zelf sparen of beleggen om je pensioen mee aan te vullen. Bereken hier wat maandelijks geld opzij zetten je oplevert. Zelf sparenJe kunt geld opzij zetten op een aparte spaarrekening. Bijvoorbeeld als je geld over hebt kun je periodiek of eenmalig een bedrag inleggen. De hoogte van de spaarrente speelt hierin een belangrijke rol. Voordeel van zelf sparen is dat je het geld in eigen beheer houdt. Heb je het dus eerder nodig? Dan kun je er gewoon bij. Dan moet je uiteraard wel weer opnieuw geld sparen of meer geld inleggen om je doel te behalen. Zelf beleggenJe kunt ook zelf beleggen om je pensioen aan te vullen. Het voordeel ten opzichte van sparen is dat de kans op een hoger rendement groter is. Het nadeel is dat je bij beleggen meer risico loopt: je geld kan (flink) in waarde schommelen. Het hangt onder andere af van hoe je belegt. Je maakt daarnaast ook kosten voor het beleggen. Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Goed om te weten:Over je spaargeld en beleggingen betaal je elk jaar belasting in box 3. Deze belasting betaal je als je vermogen boven een bepaalde drempel uitkomt. Hoeveel vermogensbelasting je betaalt, hangt af van hoe groot je vermogen is. 2. Vul je pensioen aan met lijfrenteMet SNS Lijfrente leg je eenmalig of periodiek een bedrag in. Je inleg kun je onder bepaalde voorwaarden van de belasting aftrekken. Zo bouw je kapitaal op voor een aanvullend pensioen. Dat kapitaal laat je dan later periodiek uitkeren. Tijdens de periode dat je kapitaal opbouwt, betaal je geen vermogensbelasting. Bij het uitkeren van je opgebouwde kapitaal, bijvoorbeeld via SNS Lijfrentenieren, betaal je wel belasting.Benieuwd naar de mogelijkheden voor jouw situatie? Ga dan eens in gesprek met één van onze SNS Adviseurs. Tijdens een vrijblijvend orientatiegesprek van 30 minuten nemen we jouw situatie onder de loep.Plan vrijblijvend oriëntatiegesprek3. Verlaag je lastenEen andere mogelijkheid kan zijn om je maandelijkse lasten te verlagen. Bijvoorbeeld door je hypotheek af te lossen als je een eigen huis hebt. Per jaar mag je 10% of in sommige gevallen 20% boetevrij aflossen. Bij SNS mag je met eigen geld zelfs 100% boetevrij aflossen.Zo verlaag je je woonlasten als je met pensioen bent en heb je minder inkomen nodig. Over het bedrag dat je aflost, betaal je geen rente meer. Het geld dat je overhoudt, kun je opzij zetten voor wanneer je met pensioen gaat. Als je huis in de afgelopen jaren in waarde is gestegen, kan misschien de hypotheekrente omlaag. Lees ook: het aanpassen van je woningwaarde voor een lagere rente. 4. Blijf werken naast je pensioenAls je toch niet voldoende inkomen hebt, kun je ook (blijven) werken na je pensioen. Dat heeft geen gevolgen voor je andere inkomsten, maar kan wel effect hebben op je belastingen en eventuele toeslagen..5. Verzilver de overwaarde van je huisAls je koophuis meer waard is dan je hypotheekschuld kun je overwegen om je huis te verkopen. Je krijgt dan de overwaarde tot je beschikking. Dat geld kun je gebruiken om je pensioeninkomen aan te vullen. Weten wat bij jouw persoonlijke situatie past? Bespreek het met een SNS Adviseur Wil jij je pensioen aanvullen? Of doe je dit al, maar wil je advies of heb je vragen? Onze adviseurs zijn er voor jou. Ook als je nog geen klant bij ons bent.Plan vrijblijvend oriëntatiegesprek Pensioen: dit kun je doen Of je nou jong bent, bijna met pensioen of al niet meer werkt: lees onze artikelen over pensioen. Naar het overzicht Banksparen bij SNS Banksparen is sparen voor later op een geblokkeerde spaarrekening. Meer over banksparen Pagina laatst gecheckt: 1 november 2023"
