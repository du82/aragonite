["https://snsbank.nl/particulier/beleggen/beleggen-voor-beginners/zelf-beleggen.html"]
title = "Zelf beleggen - SNS Bank"
description = "Beleggen: je kunt het zelf doen of laten doen. Wat past bij jou?"
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Er bestaan 3 verschillende soorten dienstverlening rondom beleggen. Voordat je begint met beleggen, is het verstandig om te bepalen op welke manier je wil beleggen. Wil je alles uit hadnen We zetten ze hieronder voor je op een rijtje. 1. Individueel vermogensbeheerVermogensbeheerders krijgen van jou opdracht om voor jou alle transacties te doen. De transacties moeten bij je persoonlijke situatie passen: je beleggersprofiel. Het werk wordt je uit handen genomen. Maar je betaalt wel een vergoeding. Meestal een bepaald percentage van je beleggingen. De naam zegt het eigenlijk al, voor vermogensbeheer heb je meestal al een aardig vermogen nodig. 2. Beleggingsadvies Met beleggingsadvies, wordt je door beleggingsexperts geadviseerd over mogelijke aankopen, verkopen en/of marktontwikkelingen. Je krijgt dan aan de hand van je beleggersprofiel adviezen om transacties te doen. Je beslist zelf of je het advies opvolgt. Meestal betaal je kosten voor dit beleggingsadvies. Ook beleggingsadvies is vaak pas mogelijk vanaf een bepaald vermogen of inleg.3. Execution onlyTot slot bestaat er ook nog execution only beleggen. Kies je voor execution only, dan beleg je zelfstandig zonder advies, meestal bij een bank. Je kunt hier dus zelf bepalen waarin je belegt, voor hoeveel en hoevaak je inlegt. Hier staat wel tegenover dat de meeste aanbieders van execution only geen beleggersprofiel voor je opstellen. Met behulp van bijvoorbeeld de kennis- en ervaringsvragen kun je zelf je risicobereidheid en strategie bepalen. Ook is het verstandig om het essentiële-informatiedocument (Eid) te bekijken. Hierin staat de belangrijkste informatie van een beleggingsinstrument. Omdat je geen beleggingsadvies krijgt of actief vermogensbeheer hebt, zijn de kosten voor execution only meestal een stuk lager dan bij vermogensbeheer of beleggingsadvies. Beleggen bij SNSBeleg je via SNS, dan beleg je in duurzame beleggingsfondsen. Beleggen via ons valt onder execution only beleggen. Het fonds waarin je belegt heeft een bepaalde verhouding tussen risico en rendement. Dat bekijk je van tevoren. Welk fonds bij jou past, bepaal je zelf, dus zonder advies.Wat is een beleggingsfonds en hoe werkt het?Kies je voor beleggen bij SNS, dan kun je met SNS Doelbeleggen kiezen uit 5 verschillende mixfondsen, ieder met een eigen verhouding tussen risico en rendement. Wil je naast mixfondsen ook beleggen in themafondsen, of meerdere fondsen combineren? Dan hebben we ook de SNS Beleggingsrekening. Wat je ook kiest, de fondsbeheerder zorgt voor de spreiding en is verantwoordelijk voor een goede verhouding tussen risico en rendement. Benieuwd of beleggen iets voor jou is? Met onze handige keuzehulp kom je er in 3 vragen achter. Ook zie je meteen welk beleggingsproduct van SNS goed bij jouw wensen zou kunnen passen.Doe de keuzehulp Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips Beleggen keuzehulp Ben je benieuwd of beleggen iets voor jou is? Check het met onze handige keuzehulp. Doe de keuzehulp"
