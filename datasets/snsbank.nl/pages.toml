title = "Beleggingsfondsen - SNS Bank"
description = "Bij SNS kun je kiezen uit 12 beleggingsfondsen, van laag risico tot hoog risico. Allemaal duurzaam. Bekijk ze allemaal."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. In 't kort: Wat zijn beleggingsfondsen?Je kiest je risiconiveau en hoe je wilt spreiden: beleggen in aandelen, obligaties en/of microkredieten. Je kiest een themafonds of je gaat voor een mixfonds: een combinatie op basis van het risico dat je wilt nemen. Inleggen kan met kleine en grotere bedragen, je inleg wordt automatisch gespreid over over meerdere beleggingen.De fondsmanager is verantwoordelijk voor het maximaliseren van rendement en het beperken van de risico’s voor het fondsJe kunt bij ons alleen beleggen in duurzame ASN Beleggingsfondsen. Koersen van de fondsen Klik op de naam van de afzonderlijke fondsen voor meer informatie over de kenmerken, kosten, rendementen en risiconiveaus van de fondsen. * Het verschil in de tabel is de koers ten opzichte van de voorgaande beursdag. Fonds Koers € Verschil Datum ASN Duurzaam Aandelenfonds 171.98 -2.23 (-1.28%) 28-02-2025 ASN Duurzaam Obligatiefonds 25.29 0.02 (0.08%) 28-02-2025 ASN Milieu & Waterfonds 49.35 -0.46 (-0.92%) 28-02-2025 ASN Duurzaam Small & Midcap Fonds 43.71 -0.74 (-1.66%) 28-02-2025 ASN Groenprojectenfonds 24.81 0.03 (0.12%) 28-02-2025 ASN Microkredietfonds 54.15 -0.16 (-0.29%) 28-02-2025 ASN Mixfonds Zeer Defensief 50.60 -0.05 (-0.10%) 28-02-2025 ASN Mixfonds Defensief 55.97 -0.15 (-0.27%) 28-02-2025 ASN Mixfonds Neutraal 63.13 -0.30 (-0.47%) 28-02-2025 ASN Mixfonds Offensief 74.24 -0.56 (-0.75%) 28-02-2025 ASN Mixfonds Zeer Offensief 82.84 -0.82 (-0.98%) 28-02-2025 ASN Biodiversiteitsfonds 23.01 0.37 (1.63%) 28-02-2025 Goed om te weten: De koersen hangen af van de waarde van de beleggingen binnen het fonds. Je belegging kan meer, maar ook minder waard worden. Je leest meer over de kenmerken en risico’s van de individuele beleggingsfondsen In het Essentiële-informatiedocument. Risiconiveaus van de beleggingsfondsen https://www.afm.nl/eid Risico-indicator niveau 2ASN Duurzaam ObligatiefondsASN GroenprojectenfondsASN MicrokredietfondsASN Duurzaam Mixfonds DefensiefASN Duurzaam Mixfonds Zeer Defensief https://www.afm.nl/eid Risico-indicator niveau 3ASN Duurzaam Mixfonds NeutraalASN Duurzaam Mixfonds Offensief https://www.afm.nl/eid Risico-indicator niveau 4ASN Duurzaam aandelenfondsASN Milieu & WaterfondsASN Duurzaam small & midcapfondsASN BiodiversiteitsfondsASN Duurzaam Mixfonds Zeer Offensief Beleggingsfondsen vergelijkenElk beleggingsfonds dat wij aanbieden is duurzaam, maar heeft een eigen risiconiveau, eigen koersen én eigen mogelijke rendementen. Met onze fondsenvergelijker ontdek je eenvoudig wat jouw inleg zou kunnen doen in de verschillende duurzame fondsen. Vergelijk het verwachte verschil in rendement en risico en bekijk hoe jouw inleg per fonds zou kunnen ontwikkelen. Fondsen vergelijkenKosten Voor het aanhouden van de SNS Beleggingsrekening en/of SNS Doelbeleggen betaal je niets. Wel betaal je servicekosten aan ons en fondskosten aan de fondsbeheerder. De fondskosten zijn verwerkt in de koers van het fonds. Alle beleggingskosten op een rij Waarom kiezen voor de SNS Beleggingsrekening? Je kunt zelf de verdeling van je portefeuille kiezen. Bijvoorbeeld fondsen met veel aandelen, of juist veel obligaties, of microkredieten. Je kunt met de SNS Beleggingsrekening ook uit de mixfondsen kiezen. De experts beleggen het geld volgens de doelstelling en de risicoverdeling die bij het fonds hoort. Zo haal je mogelijk rendement met de fondsen die jou aanspreken, met het gemak dat de experts je geld voor je beleggen. Meer over de SNS Beleggingsrekening Waarom kiezen voor SNS Doelbeleggen? Je kiest het mixfonds met het risiconiveau en het te verwachten rendement dat bij je wensen past. De Doelplanner kan je daarbij helpen. Het mixfonds zorgt voor de spreiding van je inleg die past bij jouw risiconiveau. Zo haal je mogelijk rendement dat past bij het risico dat jij wilt nemen, met het gemak dat de experts je geld voor je beleggen. Meer over SNS Doelbeleggen Beleggen voor de lange termijn Lees meer over de kracht van beleggen voor de lange termijn. Meer weten SNS Doelbeleggen openen Ontdek hoe het is om zelf te beleggen. Open SNS Doelbeleggen en ga aan de slag. SNS Doelbeleggen openen"
