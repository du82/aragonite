title = "Klantvriendelijkheid SNS weer bekroond - SNS Bank"
description = "SNS heeft in 2024 de 3e plek behaald in de jaarlijkse ranglijst van een groot onafhankelijk onderzoek onder consumenten door MarketResponse."
full_description = "Klantvriendelijkheid SNS weer bekroond 15 mei 2024 SNS heeft de award ontvangen voor de derde plek in de ranglijst voor ‘Klantvriendelijkste bank van Nederland’. Dit werd bekend gemaakt door MarketResponse, die jaarlijks een groot onafhankelijk onderzoek uitvoert waarvan de resultaten gisteren zijn gepresenteerd. Waardering voor onze persoonlijke aanpakVoor Lonneke Hendrix, die bij SNS verantwoordelijk is voor het versterken van de klantrelaties, is dit een geweldige erkenning. Ze vertelt: 'We vinden het fantastisch om te zien dat klanten onze aandacht en persoonlijke aanpak waarderen. Bij SNS staat het contact met onze klanten altijd voorop, dat zit gewoon in ons DNA. Deze prijs laat zien dat deze aanpak werkt en gewaardeerd wordt.' Drie Volksbankmerken op het podiumOok ASN en RegioBank, die net als SNS onder de Volksbank vallen, doen het goed in het onderzoek. Met maar liefst 3 merken in de top 3 toont en bewijst de Volksbank haar sterke focus op klantrelaties. Marinka van der Meer, Chief Customer Officer van de Volksbank, is trots op deze prestatie en benadrukt het belang van de persoonlijke aanpak voor klanten.Grootschalig onafhankelijk onderzoekHet onderzoek van MarketResponse verzamelt jaarlijks zo'n 50.000 klantbeoordelingen over verschillende branches, waaronder de bankensector. Deze ranglijst bevestigt het belang dat klanten hechten aan zowel digitale dienstverlening als persoonlijk contact en advies bij hun bank. Meer nieuws Bekijk ons laatste nieuws, onze acties en campagnes. Meer nieuws"
