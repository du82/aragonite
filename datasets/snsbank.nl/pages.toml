["https://snsbank.nl/particulier/lenen/lenen-en-het-bkr.html"]
title = "Geld lenen met BKR-registratie - SNS Bank"
description = "Als je geld wilt lenen, kijken we of je de lening kunt betalen. En of je een BKR-registratie hebt. Daarbij gebruiken we info van Bureau Kredietregistratie (BKR)."
full_description = "Verantwoord geld lenen (BKR)Voordat je geld leent, wordt bekeken of dat wel verantwoord is. Daarbij wordt rekening gehouden met je inkomsten en uitgaven. Bijvoorbeeld hoeveel je aan huur of hypotheek kwijt bent en hoeveel je partner verdient. We vragen informatie op bij het Bureau Krediet Registratie (BKR) over mogelijke andere leningen die je hebt. Dit wordt ook wel een BKR-registratie genoemd. Wat doet het BKR?Het Bureau Krediet Registratie (BKR) registreert alle leningen van meer dan € 250 en met een looptijd langer dan een maand. Bijvoorbeeld je creditcard met gespreide betaling, doorlopend krediet en roodstand. Als je een betaalachterstand hebt op een al bestaande lening, bijvoorbeeld je hypotheek, dan is dat ook bekend bij het BKR. Welke leningen worden gemeld bij het BKR?Positieve BKR-registratieLeen je meer dan € 250? Dan wordt dat doorgegeven aan het BKR. Dat gebeurt ook als je de lening helemaal niet gebruikt. Als je bijvoorbeeld € 500 rood kunt staan op je betaalrekening, melden we dat bij BKR. Het BKR noemt dat een positieve kredietregistratie.Negatieve BKR-registratieHeb je een betaalachterstand? Dan krijg je eerst herinneringen. Betaal je niet, dan wordt er contact met je opgenomen om je situatie te bekijken. Kun je de achterstand echt niet inlopen? Dan wordt dat gemeld bij het BKR. Het BKR noemt dat een negatieve kredietregistratie. Veelgestelde vragen over lenen en BKR Is een positieve BKR-registratie erg? Nee, een positieve BKR-registratie is niet erg. Iedereen met een lening van meer dan € 250 is bekend bij het BKR. 7,4 miljoen Nederlanders hebben een BKR-registratie en het overgrote deel (95%) betaalt zijn rekeningen op tijd. (Bron BKR) Is een negatieve BKR-registratie erg? Als je een betaalachterstand hebt, kun je een negatieve BKR-registratie krijgen. Het kan daardoor moeilijker zijn om een nieuwe lening af te sluiten. Heb je een lening via SNS en een negatieve registratie op een lening van een andere aanbieder? Neem dan contact met ons op Hoe kan ik mijn gegevens opvragen bij het BKR? Je kunt opvragen hoe je staat geregistreerd via de website van het BKR . BKR en je hypotheek Hoeveel je kunt lenen voor een huis hangt af van je inkomsten en uitgaven. Daarom vragen we informatie bij het BKR op als je een hypotheek wilt afsluiten.Lees meer over BKR en je hypotheek Hulp bij betalingsproblemen Ben je bang dat je je lening niet meer kunt betalen. Laat het ons weten. We helpen je graag. Betalingsproblemen hypotheek Betalingsachterstand voorkomen? Verandert je situatie? Je raakt je baan bijvoorbeeld kwijt of je gaat scheiden. Neem dan contact op. Hulp bij afbetalen"
