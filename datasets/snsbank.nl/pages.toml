full_description = "Waarom overstappen naar SNS?We snappen dat je van een bank meer verwacht dan alleen een betaalrekening, spaarrekening of hypotheek. Bij ons gaat het niet alleen om het geld, maar vooral om persoonlijke aandacht. We houden onze deuren open zodat je altijd even kunt binnenlopen als je vragen hebt. Jij staat bij ons voorop. Daarom zeggen we: Eerst de mens. Dan het geld. Met de Overstapservice draait het ook om jou: we maken het je zo makkelijk mogelijk en nemen je veel werk uit handen. Zo stap je over Open een betaalrekening Kies de betaalrekening die bij je past. En regel je geldzaken gemakkelijk online en met de app. Goed om te weten: Heb je al een betaalrekening bij ons? Dan kun je meteen door naar stap 2. SNS Compleet Inclusief aankoopverzekeringKosteloos 3 dagen rood staan per maandVanaf 18 jaarExtra betaalpas zonder extra kosten€ 4,45 per maand voor het aanhouden van de betaalrekeningApple Pay/Mobiel betalenEen handige app, met spaarpotjes Meer informatieOpenen SNS Basis Vanaf 18 jaarExtra betaalpas + € 0,75 per maand € 3,45 per maand voor het aanhouden van de betaalrekeningApple Pay/Mobiel betalenEen handige app, met spaarpotjes Meer informatieOpenen Vraag de Overstapservice aan Lopen je betalingen nu nog bij een andere bank? Vraag dan de Overstapservice aan. Wij zorgen er vervolgens voor dat je al je incasso’s en overschrijvingen van je ‘oude’ bank overgaan naar je betaalrekening bij ons.Inloggen en overstappen Dit doen wij / dit regel je zelf Dit zijn de belangrijkste dingen die wij doen: Je incasso’s lopen meteen via je nieuwe betaalrekening bij onsAlle af- en bijschrijvingen van je oude rekening worden 13 maanden naar je SNS-rekening doorgeleid1 maand na de start van de Overstapservice bellen we je om te kijken of alles goed verloopt Dit zijn de belangrijkste dingen die je zelf regelt: De overstapservice geeft je rekeningnummer aan veel mensen en organisaties door, maar deze moet je zelf doen: 1) je werkgever, de belastingdienst of andere organisaties waar je geld van krijgt. 2) Familie en vrienden. 3) Buitenlandse bedrijven zoals Netflix en Spotify.Stel periodieke overschrijvingen opnieuw in voor je nieuwe betaalrekening. In de app of Mijn SNS regel je dat makkelijk zelf.Zodra je bericht hebt dat de Overstapservice is gestart, kun je je oude betaalrekening opzeggen. Voor alle details: bekijk het complete overzicht en de handige checklist. Zo werkt de Overstapservice Al je betalingen van je andere bank overzetten naar je rekening bij ons? Met de gratis Overstapservice nemen we je veel werk uit handen. Zo werkt overstappen Overstappen als je al een rekening hebt Je vraagt de Overstapservice heel gemakkelijk online aan. Log in op Mijn SNS en de rest wijst zich vanzelf. Inloggen en overstappen"
