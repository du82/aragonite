title = "SNS Jongerenpakket: bankrekening voor je kind - SNS Bank"
description = "Het SNS Jongerenpakket: een eigen betaal- en spaarrekening voor je kind waarmee die stap voor stap leert omgaan met geld."
full_description = "Zo werkt het SNS Jongerenpakket Het SNS Jongerenpakket is voor kinderen van 0 tot 18 jaar. Het pakket groeit met je kind mee. Je kind krijgt stapsgewijs extra mogelijkheden die bij de leeftijd van je kind passen. Dat betekent steeds wat meer verantwoordelijkheid en je kind kan steeds meer in de SNS App en Mijn SNS. Open je een SNS Jongerenpakket voor een kind jonger dan 6 jaar? Dan krijgt je kind alleen een spaarrekening: SNS Jongeren Sparen. Vanaf 6 jaar krijgt je kind er een betaalrekening bij: SNS Jongeren Betalen. Na de 18e verjaardag zetten we de betaalrekening om naar een SNS Studentenrekening en de spaarrekening naar SNS Internet Sparen. Voor deze rekeningen gelden andere voorwaarden. Jij en je kind krijgen 2 maanden van tevoren bericht. Jij bent na de 18e verjaardag geen wettelijk vertegenwoordiger meer op de rekening. Zo groeit SNS Jongerenpakket met je kind mee 0 jaarBeginnen met sparenMeer dan een spaarrekening heeft je kind in het begin niet nodig. Een handig digitaal spaarpotje waar opa en oma bijvoorbeeld een extraatje op kunnen zetten. 6 jaarBetaalrekening + JeugdpasDe betaalrekening komt erbij. Met Jeugdpas: een betaalpas met een weeklimiet van € 50 voor geld opnemen en betalen. Ook mag je kind geld overmaken tussen de eigen betaal- en spaarrekening. 12 jaarBetaalpas + online betalen De Jeugdpas kun je vervangen door een SNS Betaalpas, met standaardlimieten. Ook kan je kind nu betaalverzoeken sturen, geld overmaken naar anderen en met iDEAL betalen. 16 jaarMobiel betalen Betalen met je telefoon – lekker makkelijk! Vanaf 16 jaar kan je kind beginnen met mobiel betalen. Dit kan met Google Pay of Apple Pay. Geld opnemen van een kinderrekening Na de 6e verjaardag kan je kind met het SNS Jongerenpakket ook geld overmaken of geld opnemen van de rekening. Dat kan op deze manieren: Jeugdpas Vanaf 6 jaar krijgt je kind de Jeugdpas. Met deze betaalpas kan je kind elke week tot € 50 met de betaalpas (contactloos) betalen en maximaal € 50 contant geld opnemen bij een betaalautomaat. Vind je dat nog wat veel? Dan kun je deze limiet zelf verlagen. Tip: Je kind kan de Jeugdpas zelf ontwerpen met een leuke foto of tekening. Betaalpas Vanaf 12 jaar kun je als wettelijk vertegenwoordiger een nieuwe betaalpas voor je kind aanvragen: de SNS Betaalpas. Deze pas heeft een hogere limiet. Handig voor een dagje shoppen bijvoorbeeld, of als je kind van zijn gespaarde geld een eigen telefoon of PlayStation wil kopen. Vind je deze limieten nog te hoog? Dan pas je ze eenvoudig aan in Mijn SNS of de SNS App. Check de actuele limieten Tip: Met een leuke foto tovert je kind die saaie SNS Betaalpas om tot een persoonlijke pas. Internetbankieren Van 6-12 jaar kan je kind in de SNS App en Mijn SNS zelf de rekeningen bekijken én oefenen met geld overmaken tussen de eigen betaal- en spaarrekening. Wordt je kind 12 jaar? Dan breiden we het pakket weer wat verder uit. Je tiener kan dan zelf online betalingen doen, bijvoorbeeld met iDeal. Ook kan je kind geld overboeken naar anderen en betaalverzoekjes maken. Jij houdt eenvoudig de bij- en afschrijvingen in de gaten in de SNS App en Mijn SNS. Ook kun je handige seintjes instellen. Bijvoorbeeld als het saldo van je kind onder of juist boven een bepaald bedrag komt. Zo houd jij grip, terwijl je kind steeds zelfstandiger met geld leert omgaan. Mobiel betalen Vanaf 16 jaar mag je kind mobiel betalen. Dit kan met Google Pay of Apple Pay. Meer over mobiel betalen Rood staan op een kinderrekening Bij SNS Jongerenpakket mag je kind niet rood staan. Staat er niets op de rekening? Dan kan je kind niet betalen of pinnen. Sparen met SNS JongerenpakketOver het spaargeld krijgt je kind rente. Dat is een variabele rente van 1,9% op jaarbasis over de eerste gespaarde €25.000 en deze wordt maandelijks verrekend. De rente kan dus wijzigen. Bekijk de meest actuele rente voor spaarrekeningen. Spaart je kind voor iets moois? Dan kan ie spaarpotjes maken op de spaarrekening. Zo leert je kind stap voor stap met geld omgaan. Goed om te weten: De spaarrekening SNS Jongeren Sparen staat op naam van je kind en die kan vanaf 6 jaar ook bij dat spaargeld. SNS Jongerenpakket is dus in principe niet bedoeld om te sparen ‘voor later’. Daarvoor kun je voor je kind SNS Internet Sparen of SNS Deposito openen of gaan beleggen bij SNS. Sparen voor laterWil je zelf ook sparen voor bijvoorbeeld de studie van je kind of gewoon ‘voor later’? Dan zijn er diverse rekeningen waaruit je kunt kiezen. Meer informatie over welke spaarrekening past bij jou . Handige tipsOpen je SNS Jongerenpakket voor je kind? Dan krijg je van ons ieder jaar een e-mail met financiële tips die passen bij de leeftijd van je kind. Zoals leuke oefeningen om de waarde van geld te leren kennen, maar ook wat een goede leeftijd is om met zakgeld te beginnen. En hoeveel je dan geeft.Voor kinderen van 6-12 jaar: Kijk ook eens op ‘Monnie Wijs’: daar vind je handige tips om je kind te leren omgaan met geld. Voor kinderen van 12 tot 17 jaar vind je op ‘Je puber en geld’ praktische informatie om je kind op een leuke manier financieel zelfstandiger te maken. Jij houdt controle op de rekeningSNS Jongerenpakket is voor kinderen onder de 18 jaar. Je bent als wettelijk vertegenwoordiger daarom verplicht om toezicht te houden op het gebruik van de rekeningen. Jij bepaalt wanneer je kind toe is aan de volgende stap en wanneer je je kind de inloggegevens voor Mijn SNS en de SNS App geeft. In de SNS App of Mijn SNS kun je bovendien eenvoudig alle bij- en afschrijvingen zien. Ook kun je handige seintjes instellen. Bijvoorbeeld als het saldo van je kind onder of juist boven een bepaald bedrag komt. Ook kun je andere zaken regelen: wijzigingen doorgeven, bijvoorbeeld een nieuw adresde betaalpas activerende betaalpas en het inlogmiddel voor Mijn SNS blokkerenbetalen buiten Europa aanzettende dag- of weeklimiet van de betaalpas aanpassenSNS Jongerenpakket opzeggen Goed om te weten: Meestal is de ouder wettelijk vertegenwoordiger, maar het kan bijvoorbeeld ook een voogd of pleegouder zijn. Wanneer past SNS Jongerenpakket bij jou en je kind? Als je jouw kind op een verantwoorde manier wilt leren omgaan met een eigen betaal- en spaarrekening. Als je een pakket zoekt dat met je kind meegroeit. Wanneer past SNS Jongerenpakket niet bij jullie? Als je de spaarrekening wilt gebruiken om op te sparen ‘voor later’. Bijvoorbeeld voor een rijbewijs of studie. Als je niet wil dat je kind de rekeningen zelf kan gebruiken. Als je alleen een betaal- of spaarrekening wilt voor je kind. Je kunt ze niet los van elkaar openen of opzeggen. Kosten SNS JongerenpakketTot 18 jaar betaalt je kind geen maandelijkse kosten voor het aanhouden van SNS Jongerenpakket. Goed om te weten: Soms betaalt je kind kosten voor het gebruik van de rekening. Bijvoorbeeld als je in het buitenland geld opneemt of daar betaalt met de betaalpas. VoorwaardenWil je een SNS Jongerenpakket voor je kind openen? Lees dan eerst de voorwaarden. Goed om te weten: je hoeft zelf geen rekening bij ons te hebben en je kunt 1 SNS Jongerenpakket per kind openen. SNS Jongerenpakket openen Je bent al klant bij ons Dan kun je het SNS Jongerenpakket eenvoudig openen via Mijn SNS of de SNS App. Log in en ga naar Zelf regelen -> Product toevoegen. Of kom langs in de winkel.Inloggen en openen Je bent geen klant bij onsBen je nog geen klant bij ons of heb je alleen een verzekering? Via onderstaande button open je SNS Jongerenpakket. Of kom langs in de winkel.Jongerenpakket openen"
