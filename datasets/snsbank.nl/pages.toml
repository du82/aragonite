title = "Kosten beleggen SNS - SNS Bank"
description = "Bekijk welke kosten je maakt als je gaat beleggen bij SNS met SNS Doelbeleggen of de SNS Beleggingsrekening."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen.Servicekosten Je betaalt servicekosten voor de administratie van je beleggingsportefeuille, gebruik van de Doelplanner, Mijn SNS en de app, en voor het doen van aan- en verkopen in de ASN Duurzame fondsen. Servicekosten per jaar vanaf 1 april 2021:0,30% tot en met € 100.0000,15% over het meerdere tot en met € 500.0000,07% over het meerdere boven € 500.000 Goed om te weten:We schrijven de servicekosten per kwartaal achteraf af van de geldrekening van je beleggingsrekening: begin januari, april, juli en oktober. Zorg dus dat er genoeg geld op je beleggingsrekening staat. Ontstaat er hierdoor een roodstand? Dan verkopen we de volgende beursdag een klein gedeelte van je beleggingen om zo de roodstand op te heffen. Fondskosten en transactiekostenJe betaalt ook kosten aan het fonds waarin je belegt: fondskosten en transactiekosten in fonds. Fondskosten zijn doorlopende kosten die je betaalt aan de fondsbeheerder om voor jou te beleggen. De transactiekosten zijn kosten die de fondsbeheerder maakt voor het aan- en verkopen van beleggingen. Deze kosten zijn verwerkt in de koers van het fonds. Dit wordt onder andere besteed aan de kosten voor de vermogensbeheerders van het fonds, operationele kosten en aan duurzaamheidsonderzoek. Deze kosten zijn ook verwerkt in de koers van het fonds.Op- en afslag op de koersBij een aantal fondsen kan er een op- of afslag op de koers van toepassing zijn. Op- en afslag zijn kosten die het fonds maakt om beleggers in en uit te laten stappen. Je betaalt ze via een opslag of afslag op de koers. De koers wordt dan iets hoger of lager dan de werkelijke waarde van het fonds. Naam fonds Fondskosten Transactiekosten Opslag Afslag ASN Duurzaam Aandelenfonds 0,85% 0,18% 0,100% -0,05% ASN Duurzaam Obligatiefonds 0,45% 0,04% 0,025% -0,025% ASN Milieu & Waterfonds 1,00% 0,08% 0,100% -0,100% ASN Duurzaam Small & Midcapfonds 1,20% 0,08% 0,350% -0,300% ASN Groenprojectenfonds 1,00% 0% n.v.t. n.v.t. ASN Microkredietfonds 2,30% 0% n.v.t. n.v.t. ASN Biodiversiteitsfonds 2,82% 0% n.v.t n.v.t. Naam fonds Fondskosten Transactiekosten ASN Duurzaam Mixfonds Zeer Defensief 0,90% 0,02% ASN Duurzaam Mixfonds Defensief 0,90% 0,03% ASN Duurzaam Mixfonds Neutraal 0,90% 0,06% ASN Duurzaam Mixfonds Offensief 0,90% 0,09% ASN Duurzaam Mixfonds Zeer Offensief 0,90% 0,11% Laatste update: 25 maart 2024. De kosten van de fondsbeheerder kunnen veranderen. Kostenoverzicht met rekenvoorbeelden In de kostenoverzichten staan alle kosten op een rij. Je vindt er ook rekenvoorbeelden, zodat je kunt zien wat de percentages in praktijk kunnen betekenen. In het kostenoverzicht maken we een inschatting van de kosten die het fonds berekent. Elk jaar in februari ontvang je digitaal een persoonlijk kostenoverzicht. Daarin zie je precies welk rendement je hebt behaald en welke kosten je daarvoor betaalde. Kostenoverzicht SNS Doelbeleggen (pdf) 157,5 KB Kostenoverzicht SNS Beleggingsrekening (pdf) 189,91 KB Meer over SNS Doelbeleggen Je kunt uit 5 goed gespreide mixfondsen kiezen. Je kiest het risico dat bij je past. De Doelplanner kan je daarbij helpen. Meer over SNS Doelbeleggen Meer over de SNS Beleggingsrekening Je kunt voor 1 of meer duurzame beleggingsfondsen kiezen. Zo stel je zelf je eigen portefeuille samen. SNS Beleggingsrekening"
