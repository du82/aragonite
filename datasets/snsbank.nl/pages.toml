["https://snsbank.nl/particulier/beleggen/zo-werkt-een-beleggingsfonds.html"]
title = "Zo werkt een beleggingsfonds - SNS Bank"
description = "Een beleggingsfonds belegt geld van een grote groep beleggers. We vertellen je graag hoe het werkt."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen. Wat is een beleggingfonds en hoe werkt het? Koop je als belegger aandelen van 1 bedrijf, dan loop je het risico dat de koers daalt. Dit koersrisico is kleiner als je aandelen van meerdere bedrijven koopt. Je spreidt dan het risico. Gaat het slecht met bedrijf 1 en daalt die koers? Dan gaat het misschien wel goed met bedrijf 2 en stijgt die koers.RisicospreidingBeleg je in een beleggingsfonds? Dan kun je het risico nog veel meer spreiden. Beleggingsfondsen investeren namelijk geld van een groep beleggers in veel bedrijven, vaak van over de hele wereld. Een beleggingsfonds met aandelen van meer dan 100 bedrijven is heel normaal.Lees ook: Beleggen voor beginners Wat zijn participaties?Aandelen in een beleggingsfonds heten participaties. Als je gaat beleggen in een beleggingsfonds koop je dus participaties. Een voorbeeld: Stel je legt € 10.000 in en de koers van het fonds is € 25. Dan krijg je 400 participaties. Nog een voorbeeld: Stel dat je aan het eind van elke maand € 100 stort. De koers staat eind januari op € 25 en een maand later op € 30. Dan krijg je de eerste keer 4 participaties en de tweede keer 3,3 participaties. Soorten beleggingsfondsenJe kunt beleggen in verschillende soorten beleggingsfondsen. Dit zijn de belangrijkste:Aandelenfonds: belegt alleen in aandelenObligatiefonds: belegt in obligaties van bedrijven en de overheidGeldmarktfonds: belegt in deposito’s en zeer kortlopende obligatiesVastgoedfonds: belegt in vastgoed of in vastgoedfondsenMixfonds: belegt in een mix van onder andere aandelen en obligatiesBeleggen bij SNSBij ons kun je beleggen op 2 manieren: Met SNS Doelbeleggen of met de SNS Beleggingsrekening. Met SNS Doelbeleggen kun je kiezen uit 1 van de 5 duurzame mixfondsen, van zeer defensief tot aan zeer offensief. Kies je voor de SNS Beleggingsrekening, dan kun je zelf je portefeuille samenstellen uit de duurzame mixfondsen en verschillende duurzame themafondsen.Bekijk alle duurzame beleggingsfondsen Periodiek beleggen Met periodiek beleggen bepaal je zelf hoeveel je inlegt en wanneer. Lees meer over de kracht van periodiek beleggen. Meer weten Mogelijk rendement berekenen Weten wat beleggen kan opleveren? Bereken het mogelijk rendement van beleggen en welke inleg je daarvoor nodig hebt. Rendement berekenen"
