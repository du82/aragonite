title = "Eerst de mens. Dan het geld. - SNS Bank"
description = "Vind je het raar dat een bank niet geld op 1 heeft staan? Wij niet. Want wij vinden mensen belangrijker. Hoe kunnen we jou verder helpen? Kom bij ons langs."
full_description = '''Oeps! Geen video Je kunt de video over dit onderwerp niet kijken omdat je een vereiste cookie hebt uitgeschakeld. Toch zien? Kies een andere cookie-instelling Of kijk deze video op youtube.com document.querySelectorAll(".openYoutube").forEach((element)=> { element.addEventListener("click", ()=> { window.open('https://www.youtube.com/embed/7v1zhTJFmgM?rel=0&showinfo=1&controls=1&modestbranding=1&enablejsapi=1&autoplay=0', '_blank', 'noopener'); return false; }); }) Persoonlijke aandacht voor jou We geloven niet in kantoren sluiten. Wel in deuren open houden.In tegenstelling tot andere banken die veel kantoren sluiten, hebben wij winkels waar je gewoon kunt binnenlopen. Want soms is het fijn om even persoonlijk met iemand te overleggen. Met een expert die een flinke dosis kennis heeft en die in gewone mensentaal aan je uitlegt. We kijken naar jou en je plannen, niet alleen naar je salaris. Bij ons draait het om jou en jouw wensen. Wat wil je bereiken? En wat staat je misschien in de weg om je dromen waar te maken? We helpen je met doelen stellen en pakken samen met jou de uitdagingen aan die je tegenkomt. Dat is toch veel leuker dan alleen over geld praten? We geloven in een speciale behandeling voor iedereen. Bij ons is iedereen welkom. Je hoeft geen enorm vermogen te hebben om onze aandacht te krijgen. Bij ons krijgt iedereen evenveel aandacht. We luisteren naar je en maken samen met jou een plan om je wensen werkelijkheid te laten worden. Persoonlijke aandacht wanneer jou dat uitkomt.Heb je een concrete vraag over je bankzaken? Dan weet je dat waarschijnlijk wel zelf op te zoeken. En iets praktisch regelen kan prima via de telefoon of app. Maar leg een chatbot maar eens uit waar je van droomt in je leven. Bij ons kies je zelf wanneer je persoonlijke aandacht van ons nodig hebt. Over persoonlijke aandacht Onze beloften aan jou.Dat het bij ons in de eerste plaats om jou gaat, zie je ook terug in onze 4 klantbeloften: Je krijgt bij ons persoonlijke aandacht Het draait om jouw belang Ons partnernetwerk staat voor je klaar Jouw ontwikkeling is ons doel Onze beloften'''
