title = "Fonds­vergelijker - SNS Bank"
full_description = "Hoe vergelijk je de beleggingsfondsen?Met onze handige fondsenvergelijker kun je alle duurzame beleggingsfondsen die wij aanbieden met elkaar vergelijken. Je kunt de fondsen vergelijken op het verwachtte mogelijk rendement van jouw inleg. Welke beleggingsfondsen je uiteindelijk kiest om in te beleggen, hangt af van 2 dingen:Jouw wensen en mogelijkheden, bijvoorbeeld hoeveel risico je wilt nemen. Je beleggingsproduct. Bij SNS Doelbeleggen horen andere fondsen dan bij SNS Beleggingsrekening. Hieronder lees je welke fondsen bij welk product horen. Vergelijk de verschillende beleggingsfondsenKies je voor een van de themafondsen? Dan worden je beleggingen geïnvesteerd in sectoren die bij een bepaald thema horen, zoals ‘Water & Milieu’. Kies je liever een fonds op basis van de verhouding tussen risico en rendement? Dan past een mixfonds beter bij je wensen. De mixfondsen zijn samengesteld uit de verschillende themafondsen.Fondsenvergelijker Uitleg over de resultaten Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. De waarde van je belegging kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Meer over de risiconiveaus Bij beleggen neem je altijd een risico. Je kiest zelf hoe hoog dat risico voor jou mag zijn. Als uitgangspunt in de berekening gebruiken we de risiconiveaus van de duurzame mixfondsen:Zeer Slecht: dit is het verwacht resultaat bij een zeer slecht scenario. Je hebt ongeveer 2,5% kans op een nog lager eindbedrag.Gemiddeld: dit is het verwacht resultaat bij een gemiddeld scenario. Je hebt ongeveer 50% kans op een hoger eindbedrag en ook ongeveer 50% kans op een lager eindbedrag.Zeer Goed: dit is het verwacht resultaat bij een zeer goed scenario. Je hebt ongeveer 2,5% kans op een nog hoger eindbedrag. Wie berekent de verwachte resultaten? De verschillende scenario’s in de grafiek zijn berekend door Ortec Finance. Deze internationale organisatie is gespecialiseerd in het meten en beheren van risico’s en rendementen op het gebied van vermogensbeheer. Bij berekeningen neemt Ortec Finance ook de historische rendementen mee. Daarnaast kijkt de organisatie naar de uitkomsten van verschillende economische scenario’s en schat daarmee toekomstige ontwikkelingen in. Welke fondsen horen bij welk product? Bij SNS kun je alleen kiezen uit duurzame beleggingsfondsen. Gaat je voorkeur uit naar een mixfonds? Dan past SNS Doelbeleggen hier goed bij. Liever één of meerdere ASN Themafondsen (en ASN Mixfondsen) combineren? Kies dan voor SNS Beleggingsrekening. Fondsen van SNS DoelbeleggenMet SNS Doelbeleggen beleg je in 1 van de 5 ASN Duurzame Mixfondsen. Elk fonds heeft een eigen verhouding tussen risico en rendement: ASN Mixfonds Zeer DefensiefASN Mixfonds DefensiefASN Mixfonds NeutraalASN Mixfonds OffensiefASN Mixfonds Zeer Offensief Fondsen van SNS BeleggingsrekeningMet SNS Beleggingsrekening heb je keuze uit 7 duurzame themafondsen en de 5 duurzame mixfondsen. In totaal kun je dus 12 fondsen combineren met SNS Beleggingsrekening. ASN Duurzaam AandelenfondsASN Duurzaam ObligatiefondsASN Milieu & WaterfondsASN Duurzaam Small & Midcap FondsASN GroenprojectenfondsASN MicrokredietfondsASN BiodiversiteitsfondsASN Mixfonds Zeer DefensiefASN Mixfonds DefensiefASN Mixfonds NeutraalASN Mixfonds OffensiefASN Mixfonds Zeer Offensief Keuzehulp beleggen: welk product past bij jou?Je hebt nu meer inzicht in onze fondsen, check. Twijfel je nog welk beleggingsproduct iets voor jou is? Met onze keuzehulp kom je er in 3 vragen achter welk beleggingsproduct van SNS goed bij jouw wensen zou kunnen passen.Doe de keuzehulp SNS Doelbeleggen openen Ontdek hoe het is om zelf te beleggen. Open SNS Doelbeleggen en ga aan de slag. SNS Doelbeleggen openen SNS Beleggingsrekening openen Kies uit een overzichtelijk aantal beleggingsfondsen, elk met een eigen thema. SNS Beleggingsrekening openen"
