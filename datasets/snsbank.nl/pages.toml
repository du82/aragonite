["https://snsbank.nl/particulier/hypotheken/maximale-hypotheek-berekenen.html"]
title = "Bereken gratis je maximale hypotheek - 2025 - SNS Bank"
description = "Bereken online in een paar stappen je maximale hypotheek. Zo ontdek je  hoeveel je ongeveer bij ons kunt lenen. Hoe meer je invult, hoe preciezer het bedrag."
full_description = "Bereken je maximale hypotheek Het bedrag dat je straks ziet, geeft je een idee van hoeveel hypotheek je ongeveer kunt krijgen. Wil je preciezer je hypotheek berekenen? Of verandert je werksituatie binnenkort? Maak dan een afspraak met een SNS Adviseur. Over de hypotheekberekeningJe vult hier je inkomen in en ziet meteen hoeveel je kunt lenen. Dat is wel een schatting. Daarna ga je het bedrag nauwkeuriger maken. Want hoe meer we weten, hoe beter we het bedrag kunnen benaderen dat je maximaal kunt lenen. Stap 1: Verbeter je resultaat Vul ook je andere gegevens in. Heb je financiële verplichtingen? En hoeveel kosten die per maand? Want hoe meer financiële verplichtingen, hoe lager je maximale hypotheek. Tip 1: Kijk of je je financiële verplichtingen kunt verminderen. Los bijvoorbeeld je studieschuld, roodstand en creditcardschuld af, als dat kan. Je kunt meer lenen als je dit soort kredieten hebt stopgezet en als ze zijn afgemeld bij BKR. Tip 2: Ben je al klant bij ons en sta je rood op je betaalrekening? Je kunt je kredietlimiet makkelijk verlagen in Mijn SNS. Of je een nieuw huis op het oog hebt, is belangrijk omdat we willen weten met welk energielabel we kunnen rekenen. Hoe beter je energielabel, hoe lager je rente. Heb je een huis op het oog? Dan vul je het bedrag in waarvoor je het denkt te gaan kopen. Zo weten we hoeveel eigen geld je ongeveer nodig hebt. Tip 3: Denk eens na over hoe energiezuinig je (nieuwe) huis is. Kan dat beter? Dan is het goed om te weten dat je meer kunt lenen als je gaat verduurzamen. Als je in de afgelopen 3 jaar een huis hebt verkocht, dan weten we of je te maken hebt met overwaarde of restschuld. Dat is ook belangrijk voor het berekenen van je eigen geld. Heb je overwaarde? Dan gaan we ervan uit dat je dit gebruikt voor je nieuwe huis. Dat doen we omdat je anders te maken krijgt met de bijleenregeling. Stap 2: Doe ’m nog een keer Je ziet dat je op veel dingen zelf invloed hebt. Bijvoorbeeld op je financiële verplichtingen. Vul je gegevens nog eens in en pas aan wat je misschien kunt veranderen. Je ziet meteen wat dat doet met je maximale hypotheek en maandlasten. Dit kan een SNS Adviseur doen Met een online berekening kun je nooit precies uitrekenen hoeveel je maximaal kunt lenen. Een SNS Adviseur kan dat wel. Want een adviseur brengt je hele persoonlijke situatie in kaart. Wil je weten wat je mogelijkheden precies zijn? Maak dan een afspraak met een SNS Adviseur. Ook als je nog geen huis op het oog hebt. Je weet dan van tevoren waar je aan toe bent. Goed om te weten: Het 1e gesprek is gratis en je zit nergens aan vast. Maak een afspraak Ook belangrijk voor je maximale hypotheek Als je een hypotheek afsluit, dan moet je een paar keuzes maken die ook invloed hebben op hoeveel je kunt lenen. Hypotheekvorm Voor je hypotheek betaal je elke maand een bedrag. Daarin zit rente en/of aflossing. Hoe je aflost, hangt af van de hypotheekvorm die je kiest. Onze hypotheekvormen Rentevaste periode Je kiest hoe lang je je rente vast wil zetten. Hoe langer je rente vastzet, hoe hoger die rente meestal is. Onze actuele hypotheekrentes Schuld-marktwaardeverhouding Bij je hypotheek horen zogenaamde tariefgroepen. Bij elke tariefgroep hoort een rentepercentage. Om te bepalen in welke groep je hypotheek valt, kijken we naar je schuld-marktwaardeverhouding. Hoe hoger je hypotheek in vergelijking met de waarde van je huis, hoe meer risico we lopen en hoe hoger je rente. Maar andersom werkt het ook: hoe lager je schuld-marktwaardeverhouding, hoe lager ons risico. Je betaalt dan vaak een lagere rente. Tariefgroepen en hypotheekrente Energielabel Check altijd het energielabel van het huis dat je wil kopen. Vooral als je kiest voor een SNS Bespaarhypotheek. Want een goed energielabel kan je een lagere rente en dus lagere maandlasten opleveren. Ga je je (nieuwe) huis verduurzamen? Dan kun je meer lenen. Tot 106% van de waarde van het huis, in plaats van 100%. Meer over het energielabel Hypotheekvoorwaarden Een SNS Adviseur zoekt ook voor je uit welke hypotheekaanbieder de beste voorwaarden voor jou heeft. Want we adviseren niet alleen hypotheken van onszelf. Bij ons kun je kiezen uit meerdere aanbieders. Zo vinden we altijd een hypotheek die bij je past. Alle hypotheekaanbieders Veelgestelde vragen Hoe hebben jullie mijn maximale hypotheek berekend? We hebben jouw ingevulde gegevens gebruikt en daarnaast een paar keuzes gemaakt om je maximale hypotheek uit te rekenen. Zo zijn we ervan uitgegaan dat je een rentevaste periode van 10 jaar kiest. We hebben nog meer uitgangspunten gebruikt. Je ziet ze allemaal in deze pdf: Uitgangspunten voor de berekening van de maximale hypotheek (pdf) 123,66 KB Wat komt er kijken bij het kopen van een huis? Als je op zoek gaat naar een koophuis, dan moet je aan veel dingen denken. Wat precies? We hebben het voor je op een rij gezet in een handig stappenplan. Stappenplan 1e huis kopen Heeft mijn studieschuld invloed op mijn maximale hypotheek? Met een studieschuld kun je vaak gewoon een hypotheek afsluiten. Het maximale bedrag dat je kunt lenen, is dan wel lager. Je studieschuld en een hypotheek Met welke kosten krijg ik te maken als ik een huis koop? Je kunt meestal tot 100% van de waarde van het huis lenen. Maar dan ben je er nog niet. Je krijgt ook te maken met andere kosten. Zoals voor de notaris, bouwkundige keuring en misschien overdrachtsbelasting. Die kosten vallen onder de kosten koper en moet je uit eigen zak betalen. Het is dus belangrijk dat je genoeg eigen geld daarvoor hebt. Bekijk de kosten koper Kan ik een hypotheek met NHG krijgen? Je kunt Nationale Hypotheek Garantie (NHG) krijgen als je een huis koopt voor een prijs onder een bepaalde grens. Die grens is elk jaar anders. Zo werkt NHG Wat betaal ik voor hypotheekadvies? Je komt eerst bij ons langs voor een gratis en vrijblijvend oriëntatiegesprek. Ga je daarna een hypotheek afsluiten? Dan krijg je hypotheekadvies en daar betaal je voor. Dat is altijd een vast bedrag. Je betaalt ook kosten voor het afsluiten van je hypotheek. Via de link hieronder zie je onze advieskosten. Bij ‘Begeleiden en uitvoeren’ staan onze afsluitkosten. De kosten voor een hypotheekadvies Kan ik een hypotheek krijgen zonder vast contract? Dat kan. Je kunt een hypotheek krijgen als je een tijdelijk contract hebt, zzp’er bent of uitzendkracht. We berekenen je maximale hypotheek dan wel op een andere manier. En we hebben andere informatie van je nodig.Als je geen vast contract hebt Kan ik mijn hypotheek meenemen als ik verhuis? Je kunt je SNS Hypotheek, SNS Bespaarhypotheek of andere hypotheek die je via ons hebt afgesloten meeverhuizen. Dat betekent dat je je rente-afspraken meeneemt. Soms is dat gunstig. Je hypotheek meenemen"
