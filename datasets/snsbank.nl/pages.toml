title = "Rood staan aanvragen - SNS Bank"
description = "Tijdelijk meer geld nodig? Dan kun je een kredietlimiet op je betaalrekening aanvragen."
full_description = "Rood staan aanvragen Heb je even meer geld nodig? Dan is het handig als je tijdelijk rood kunt staan. Rood staan kost wel geld. Vraag je dus steeds goed af of het echt nodig is om rood te staan. Rood staan kan vanaf € 500 tot maximaal € 2.500. Dit hangt af van je situatie.Heb je SNS Compleet? Dan mag je 3 dagen tot je limiet rood staan zonder dat je rente hoeft te betalen. Rood staan aanvragen:Werk je in loondienst? Dan heb je een contract voor onbepaalde tijd nodig of een tijdelijk contract met een einddatum over minimaal 6 maanden of een intentieverklaring voor onbepaalde tijd.Je inkomen is de afgelopen 3 maanden binnengekomen op de rekening waarop je roodstand aanvraagt (zelf doorboeken van een andere rekening is niet toegestaan).Het is mogelijk om het inkomen van je partner mee te nemen, wel moet je partner dan ook rekeninghouder zijn en wonen jullie beide op hetzelfde adres in Nederland.Het is langer dan 3 maanden geleden dat je roodstand hebt aangevraagd of verhoogd. Hoeveel mag je rood staan?Hoeveel je rood mag staan is afhankelijk van je inkomen en je uitgaven. Je mag nooit meer rood staan dan een netto maandsalaris en het maximum is altijd € 2.500 per rekening. Belangrijk om te wetenJe hebt minimaal 1 dag per 90 dagen een positief saldo. Als dit niet lukt trekken we de limiet in. Natuurlijk krijg je van ons eerst enkele berichten om je hieraan te herinneren.Mag je al rood staan bij een andere bank? Dan is dat geen garantie dat je dat bij ons ook kan. En kan je limiet bij je andere bank worden ingetrokken als daar onvoldoende inkomen op binnen komt. Roodstaan is een vorm van lenen. Daarom zijn we wettelijk verplicht je gegevens bij het Bureau Krediet Registratie (BKR) te toetsen en je een aantal vragen te stellen over je persoonlijke en financiële situatie. Wat kost rood staan?Rood staan kost geld. Je betaalt rente over het bedrag dat je rood staat. Lees hoeveel rood staan kost op jouw rekening.Kosten SNS Basis Je betaalt 11% debetrente over het bedrag dat je rood staat. Deze rente is variabel en op jaarbasis vanaf 20 februari 2025. Dat betekent dat hij kan veranderen. Je betaalt de rente een keer per maand. In het rekenvoorbeeld zie je wat je betaalt als je 90 dagen rood staat. Totale krediet-bedrag Variabele debet-rentevoet Jaarlijks kosten-percentage (JKP) Totalen kosten (duur 90 dagen) € 500 11,00% 20,38% € 523,66 € 750 11,00% 17,17% € 780,27 € 1.000 11,00% 15,60% € 1.036,87 € 1.500 11,00% 14,05% € 1.550,09 € 2.000 11,00% 13,28% € 2.063,31 € 2.500 11,00% 12,82% € 2.576,52 Hoe hebben we dit berekend?Kosten SNS Compleet Je betaalt 11% debetrente over het bedrag dat je rood staat. Deze rente is variabel en op jaarbasis vanaf 20 februari 2025. Dat betekent dat hij kan veranderen. Je betaalt de rente een keer per maand. In het rekenvoorbeeld zie je wat je betaalt als je 90 dagen rood staat. Totale krediet-bedrag Variabele debet-rentevoet Jaarlijks kosten-percentage (JKP) Totalen kosten (duur 90 dagen) € 500 11,00% 21,97% € 525,33 € 750 11,00% 17,80% € 781,27 € 1.000 11,00% 15,76% € 1.037,21 € 1.500 11,00% 13,76% € 1.549,09 € 2.000 11,00% 12,77% € 2.060,97 € 2.500 11,00% 12,18% € 2.572,85 Hoe hebben we dit berekend?Je kredietlimiet verlagen of opzeggenWil je je limiet verlagen of opzeggen? Je regelt het in Mijn SNS. Lees hoe het werkt Overige informatie Welk inkomen telt mee bij het aanvragen van Roodstand? Verantwoorde kredietverlening vereist een bestendig inkomen. Onder bestendig inkomen verstaan wij:een vast dienstverband, ook bij de eigen BV.Tijdelijk dienstverband, met een einddatum over minimaal 6 maanden of een intentieverklaring voor onbepaalde tijd. Inkomen uit pensioen, VUT-uitkering en/of AOW.Inkomen uit WAO, IVA en Wajong.Inkomen uit een eigen onderneming, bijvoorbeeld: zzp-er, eenmanszaak, v.o.f., commanditaire vennootschap en maatschap. NB: vakantiegeld en vaste toeslagen worden meegenomen als netto inkomen. Moet ik documenten uploaden om Roodstand aan te vragen? Ja, wij hebben documenten nodig voor de verplichte controle van je inkomsten en lasten. Denk hierbij aan je loonstrook of pensioenoverzicht, bankafschriften en mogelijk een overzicht van je studieschuld bij DUO. Mag ik bijzondere persoonsgegevens onleesbaar maken? Uit bijzondere persoonsgegevens blijkt bijvoorbeeld iemands ras of etnische afkomst, politieke opvattingen, religie, lidmaatschap vakbond, informatie over gezondheid, seksueel gedrag of seksuele gerichtheid.Wij vragen je om documenten te uploaden omdat wij verplicht zijn de opgegeven inkomsten en lasten te controleren. Vanwege de privacy mogen bijzondere persoonsgegevens onleesbaar worden gemaakt in de documenten die worden geüpload.Wat mag je onleesbaar maken bij een afboeking met bijzondere persoonsgegevens:de omschrijving; enhet tegenrekeningnummer.De overige gegevens moeten leesbaar blijven. Om overkreditering te voorkomen moeten wij bij (deels) onleesbaar gemaakte afboekingen de uitgaven meenemen als lasten. Tips om je saldo goed in de gaten te houden Je hebt bij ons verschillende mogelijkheden om je saldo op je betaalrekening in de gaten te houden. Zo voorkom je dat je onnodig rood staat.Bekijk de tips Word je geregistreerd bij het BKR als je rood staat? Je nieuwe limiet voor Roodstand moeten we melden bij het BKR. Het maakt niet uit of je er gebruik van maakt of niet. Het gaat dan om een positieve registratie. Maak je er gebruik van en is je saldo op tijd positief? Dan blijft de registratie positief en is er niks aan de hand. Vraag je een nieuw krediet aan, dan zien we direct dat je verantwoord geld kunt lenen. Lukt het niet om je saldo op tijd positief te krijgen? Als het moeilijker is dan gedacht om je saldo op tijd positief te krijgen, dan denken we graag met je mee. Bel ons op 030-633 30 00. Dan kijken we naar de mogelijkheden om ervoor te zorgen dat je dit wel kunt. VoorwaardenIn de productwijzer lees je meer over rood staan op je betaalrekening. In ‘Consumptief krediet informatie’ vind je alle informatie over de kredietovereenkomst die je met ons sluit. In de voorwaarden lees je meer over rood staan op je betaalrekening. En in de tarievenwijzer vind je een overzicht van alle kosten. Productwijzer Rood staan SNS Basis (pdf) 168,57 KB Productwijzer Rood staan SNS Compleet (pdf) 169,37 KB Consumptief Krediet Informatie SNS Basis (pdf) 232,11 KB Consumptief Krediet Informatie SNS Compleet (pdf) 231,71 KB SNS Voorwaarden Roodstand (pdf) 138,06 KB Tarievenwijzer Betalen (pdf) 267,19 KB Je kredietlimiet wijzigen? Wil je je limiet verhogen of verlagen? Geef je wijziging aan ons door. We kijken dan wat mogelijk is. Limiet wijzigen Rood staan aanvragen Vraag rood staan aan voor je betaalrekening. Rood staan aanvragen"
