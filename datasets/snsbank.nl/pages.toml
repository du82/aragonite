["https://snsbank.nl/particulier/hypotheken/verhuurhypotheek.html"]
title = "Verhuurhypotheek - SNS Bank"
description = "Met de verhuurhypotheek biedt uitkomst wanneer je een huis koopt om te verhuren. Door je huis te verhuren heb je extra inkomen."
full_description = "Zo zit het met belastingenJe kunt de verhuurhypotheek alleen afsluiten voor huizen die belast worden als inkomsten uit sparen en beleggen in box 3. En je moet 10,4% overdrachts-belasting betalen. Wil je meer weten over de verhuurhypotheek en de belastingen? Laat je hierover adviseren door een belastingadviseur. Verhuurhypotheek Koop je een huis om te verhuren? Of heb je al zo’n huis? En wil je de huuropbrengst gebruiken voor extra inkomen of voor later? Dat kan met de verhuurhypotheek. De verhuurhypotheek in 't kort Lenen van € 75.000 tot € 500.000. Tot 80% van de marktwaarde in verhuurde staat financieren. Energielabel C? Of heb je al een SNS Hypotheek. Dan kun je tot 90% financieren. Lineair aflossen in maximaal 30 jaar. Rente vastzetten voor minimaal 1 en maximaal 15 jaar. Wil je meer weten? Maak een afspraak voor een gratis en vrijblijvend oriëntatiegesprek. Bel 030 - 633 30 00 Voordelen van verhuren Extra inkomen Door de huurindexatie nemen je huurinkomsten meestal toe. En omdat je lineair aflost, worden je maandlasten elke maand lager. Je huuropbrengst wordt dus steeds hoger. Vermogen opbouwen Je lost lineair af en daardoor daalt je schuld. Als de waarde van je huis stijgt, dan neemt ook je vermogen toe. Hoger rendement dan sparen In het begin zal je rendement nog niet zo hoog zijn. Misschien zelfs negatief. Maar omdat de huur stijgt en je hypotheeklasten dalen, neemt je rendement toe. Nadelen van verhuren Tegenvallende huurinkomsten Stopt je huurder met betalen? Of wordt de huur opgezegd? Dan vallen je huurinkomsten weg. Maar je moet wel nog steeds je maandlasten betalen. Verplichtingen Je huurder verwacht dat je het huis goed onderhoudt. Dat betekent bijvoorbeeld dat je reparaties op tijd uitvoert. De kosten hiervan mag je in principe niet aan de huurder doorberekenen. Wetten en regels Je huuropbrengst valt nu niet in box 3. Maar dat kan veranderen. De overheid maakt ook allerlei regels om het kopen en verkopen van huizen voor de verhuur moeilijker maken. Verdiep je van tevoren goed in de actuele regels. Maar houd ook in de gaten wat er in de politiek gebeurt. Waarde van het huis kan dalen Als de waarde van het huis daalt, dan kan je vermogen dalen. Misschien houd je een restschuld over als je het huis verkoopt. De verhuurhypotheek: iets voor jou?De verhuurhypotheek is er voor: Als je een huis wil kopen voor de verhuur. Of als je al een huis hebt dat je verhuurt of wil gaan verhuren. Als je niet meer dan 4 panden voor de verhuur hebt, samen met het pand waarvoor je de verhuurhypotheek nodig hebt. Als je wil verhuren aan een particuliere huurder voor permanente bewoning. Je bent zelf ook een particulier. Je moet wel genoeg eigen geld hebben, omdat je maar tot 80% (en soms tot 90%) van de waarde in verhuurde staat kunt lenen. Maar ook omdat je de lasten van de verhuurhypotheek en die voor je eigen huis moet kunnen betalen. Goed om te weten: Je mag het huis niet gebruiken voor kamerverhuur. Onderverhuur mag ook niet. Heb je al een hypotheek die je wil omzetten of herfinancieren? Dan is het bedrag dat je leent met de verhuurhypotheek nooit hoger dan het nog openstaande bedrag van de hypotheek die je al had. Zoveel huur mag je vragenWe vinden het belangrijk dat huurhuizen in Nederland betaalbaar zijn. Daarom kun je de verhuurhypotheek alleen afsluiten als je een redelijke huur vraagt. Om dat te bepalen, gebruiken we het Woningwaardestelsel (WWS) voor huizen tot en met 250 punten. Zo werkt het Woningwaardestelsel (WWS)Een huis krijgt punten voor bijvoorbeeld:oppervlakte ligging WOZ energielabelafwerking Bij het puntentotaal hoort een maximale huurprijs. In de wet is er een maximale huur die je mag vragen voor huizen tot 145 punten. Omdat we duurhuur willen voorkomen, gebruiken we een hogere grens: 250 punten. Om de verhuurhypotheek aan te kunnen vragen, mag je huur niet hoger zijn dan de huur die hoort bij het puntentotaal. Heeft het huis meer dan 250 punten? Dan mag je samen met je huurder een huurprijs bepalen. Goed om te weten: Meestal worden huren elk jaar verhoogd. Voor zo’n verhoging kunnen voorwaarden gelden. Daar moet je aan blijven voldoen als je de verhuurhypotheek hebt afgesloten. Voorwaarden voor het huurhuisHet gaat om zelfstandige woonruimte in Nederland. En je hebt toestemming om het te verhuren aan consumenten voor permanente bewoning. Het woonoppervlakte is minimaal 30 m2 en het huis is niet te verplaatsen (zoals een woonboot). Het mag geen recreatiewoning zijn. Erfpacht is toegestaan maar moet wel voldoen aan bepaalde voorwaarden. Het huis mag horen bij een Vereniging van Eigenaren (VVE), maar alleen als er geld beschikbaar is voor onderhoud. Dit onderhoud staat in het meerjarig onderhoudsplan en er is een reservepot. Het huis ligt niet op een handels- of industrieterrein. Zo zit het met belastingenJe kunt de verhuurhypotheek alleen afsluiten voor huizen die belast worden als inkomsten uit sparen en beleggen in box 3. En je moet 10,4% overdrachts-belasting betalen. Wil je meer weten over de verhuurhypotheek en de belastingen? Laat je hierover adviseren door een belastingadviseur. Kosten en rente Voor de verhuurhypotheek betaal je elke maand rente en je lost elke maand een vast bedrag af. Hoeveel je elke maand betaalt, zie je in het renteaanbod en in de offerte die je van ons krijgt. De rente die je betaalt, hangt af van de rentevaste periode die je met ons afspreekt. Je kunt kiezen uit een periode van 1, 2, 3, 4, 5, 6, 10, 12 of 15 jaar. Je rente hangt ook af van hoeveel je leent en de zogenaamde schuld-marktwaardeverhouding. Dit betekent: hoe lager je schuld vergeleken met de waarde van het huis (in verhuurde staat), hoe lager de rente. Naar de actuele rentes voor een hypotheek Goed om te weten: Wil je tijdens je rentevaste periode de marktwaarde van het huis laten aanpassen? Dan moet je je rentecontract openbreken. En betaal je misschien een vergoeding voor ons renteverlies. Afsluitkosten Wil je weten of de verhuurhypotheek iets voor je is? Dan kom je eerst langs voor een gratis en vrijblijvend oriëntatiegesprek. Wil je de verhuurhypotheek daarna aanvragen? Dan betaal je afsluitkosten. Van tevoren hoor je hoe hoog die kosten precies zijn. Maak een afspraakWil je weten of de verhuurhypotheek iets voor je is? Bel 030 - 633 30 00 om een afspraak te maken voor een gratis en vrijblijvend oriëntatiegesprek. Eerder of extra aflossen Eerder aflossen kan elk jaar kosteloos tot 10% van het totale hypotheekbedrag. Wil je meer dan 10% aflossen? Of ga je het huis verkopen voor de rentevaste periode afloopt? Dan betaal je een vergoeding voor ons renteverlies. Hoeveel dat is, zie je op de aflosnota die je eerst bij ons kunt aanvragen. Belangrijke kenmerken en voorwaarden Op deze pagina lees je een paar belangrijke kenmerken en voorwaarden van de verhuurhypotheek. Je vindt ze allemaal in de informatiewijzer. Plus: informatie over de verhuurhypotheek en de belastingen. SNS Informatiewijzer Verhuurhypotheek (pdf) 280,94 KB Check je rente Hoeveel rente ga je betalen voor de verhuurhypotheek? Actuele rentes Maak een afspraak Laat je gegevens achter en we bellen je om een afspraak te maken. Gratis oriëntatiegesprek"
