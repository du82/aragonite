ASN Duurzaam Mixfonds Offensief is afhankelijk van de waarde van de beleggingen binnen het fonds. Daardoor kan je belegging meer, maar ook minder waard worden.Belangrijke documenten Lees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval het Essentiële-informatiedocument van de fondsen die je overweegt te kopen. Essentiële-informatiedocument ASN Duurzaam Mixfonds Offensief (pdf) 186,32 KB Factsheet ASN Duurzaam Mixfonds Offensief (pdf) 246,26 KB Kwartaalbericht ASN Duurzaam Mixfonds OffensiefBeleg in dit fondsBekijk en vergelijk alle mixfondsenLiever een mixfonds met een ander risiconiveau of een themafonds? Bekijk al onze beleggingsfondsen. Of vergelijk al onze fondsen eenvoudig met de Fondsvergelijker. Met deze handige tool vergelijk je eenvoudig de verschillende duurzame beleggingsfondsen, de bijbehorende risico’s en mogelijke rendementen. Fondsvergelijker Vergelijk het mogelijke rendement en risico per fonds. Naar de fondsvergelijker Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
