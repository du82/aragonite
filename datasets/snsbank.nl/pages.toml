["https://snsbank.nl/particulier/beleggen/sns-doelbeleggen.html"]
title = "SNS Doelbeleggen - SNS Bank"
description = "Met SNS Doelbeleggen kies je zelf welk risico je wilt nemen en hoe vaak je inlegt. En inleggen kan al met een klein bedrag. Zo wordt zelfstandig beleggen wel heel eenvoudig."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. SNS Doelbeleggen in 't kortWil je gaan beleggen, dan is het verstandig om ook te sparen. Met SNS Doelbeleggen kun je sparen én beleggen, op één rekening. Als je geld stort op je SNS Doelbeleggen, bepaal je zelf in welke verhouding je wilt sparen en beleggen. We zetten de voordelen van SNS Doelbeleggen voor je op een rijtje: Geen minimale inleg of startbedrag, je kunt al beleggen met een klein bedragKeuze uit 1 van de 5 duurzame mixfondsen, ieder met een eigen risiconiveauBeleggen met gemak, Jij kiest waarin je belegt, de fondsbeheerder zorgt voor een zo goed mogelijke spreiding binnen je gekozen fonds(en) Goed om te weten: Je hoeft geen betaalrekening bij ons te hebben om SNS Doelbeleggen te openen. Hoe werkt SNS Doelbeleggen? Open SNS Doelbeleggen Met SNS Doelbeleggen open je een beleggingsrekening waarmee je duurzame mixfondsen kunt aan- en verkopen. Deze fondsen zie je terug in je portefeuille. Over het gelddeel van je SNS Doelbeleggen rekening ontvang je rente. SNS Doelbeleggen Openen Tip: Heb je een concreet beleggingsdoel? Dan kun je dat na het openen invullen in de Doelplanner. Flexibel inleggen en opnemen Met SNS Doelbeleggen kun je al beleggen met een klein bedrag. Jij kiest hoeveel, maar ook hoe vaak je wilt inleggen. Wil je er niet steeds zelf aan hoeven denken? Dan kun je periodiek inleggen eenvoudig aanzetten. Je koopt dan automatisch en op een vast moment fondsen aan. Goed om te weten: Je kunt altijd een deel van je beleggingen verkopen. Dit doe je tegen de koers die dan geldt. Kies en beleg in 1 van de 5 duurzame mixfondsen Je belegt in een van de 5 duurzame mixfondsen. Mixfondsen zijn beleggingsfondsen en beleggen in zowel aandelen als in obligaties. Deze combinatie zorgt voor meer spreiding van je risico en belegd vermogen. Elk mixfonds van SNS Doelbeleggen heeft een eigen verhouding tussen risico en rendement, jij bepaalt zelf welk duurzaam ASN Mixfonds je kiest. Beleggen met gemak Doordat je met SNS Doelbeleggen belegt via een beleggingsfonds, zorgt de fondsbeheerder voor de spreiding en de expertise. Lekker makkelijk, hoef jij het niet meer zelf te doen. Ook kun je met SNS Doelbeleggen gebruik maken van de Doelplanner. De Doelplanner helpt je uit te rekenen hoe je bij jouw doelbedrag kunt komen en geeft je inzicht in hoe de rendementen zouden kunnen verlopen. Rente en rendement van SNS Doelbeleggen Je SNS Doelbeleggen-beleggingsrekening bestaat uit een gelddeel en je belegd vermogen. Over het gelddeel van je beleggingsrekening ontvang je een variabele rente. Ben je benieuwd wat SNS Doelbeleggen jou mogelijk zou kunnen opleveren? Bereken het eenvoudig en snel met onze handige rekentool.Nu berekenen Saldoklasse Variabele rente € 0 - € 25.000 1,80% € 25.000 - € 100.000 1,60% Saldo boven € 100.000 0,60% Voor alle rentes geldt: variabele rente over je positieve saldo op het gelddeel van je beleggingsrekening op jaarbasis vanaf 16 oktober 2023. Rentewijzigingen voorbehouden. Blijf op koers met de Doelplanner in de App en Mijn SNS Kies je voor SNS Doelbeleggen? Dan kun je gebruik maken van de Doelplanner. Met de Doelplanner kun je:Je doelplan maken zodat je steeds kunt zien of je (nog) op koers ligt voor jouw beleggingsdoel.Berekenen welk bedrag je bij elkaar kunt krijgen met jouw inlegInstellen welk deel van je inleg je wilt sparen en en hoeveel je wilt beleggenZo gebruik je de Doelplanner in Mijn SNS SNS Doelbeleggen is geschikt als je: Zelfstandig wilt beleggen in duurzame beleggingsfondsen, zonder advies.Sparen en beleggen graag wilt combineren op één rekening.Bereid bent om beleggingsrisico te lopen.Minimaal 3 jaar lang je geld wilt beleggen.SNS Doelbeleggen is niet geschikt als je: Losse aandelen of obligaties wilt aankopen op de beurs.Geen beleggingsrisico wilt lopen.In meerdere ASN Mixfondsen of de ASN Themafondsen wilt beleggen.Wilt beleggen met geld dat je binnen 3 jaar nodig hebt. Wat betaal je voor SNS Doelbeleggen?Voor het aanhouden van SNS Doelbeleggen betaal je niets. Wel betaal je servicekosten aan ons en fondskosten aan de fondsbeheerder.De servicekosten zijn 0,3% per jaar. Alle kosten van beleggen op een rijtjeDe voorwaardenIn de voorwaarden lees je wat je van ons kunt verwachten. Maar ook wat wij van jou verwachten. Lees ze goed door voor je SNS Doelbeleggen aanvraagt.Liever verschillende fonds(en) combineren?Wil je liever zelf verschillende fonds(en) kiezen of verschillende fondsen combineren? Dan is de SNS Beleggingsrekening beter geschikt voor jouw wensen.Doelbeleggen vergelijken met de beleggingsrekening Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips SNS Beleggingsrekening openen Kies uit een overzichtelijk aantal beleggingsfondsen, elk met een eigen thema. SNS Beleggingsrekening openen"
