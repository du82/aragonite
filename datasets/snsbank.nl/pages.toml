title = "SNS Lijfrente - SNS Bank"
description = "Wil je geld opzij zetten voor een aanvulling op je pensioen en/of AOW? Dan kun je fiscaal vriendelijk sparen met SNS Lijfrente."
full_description = "De kenmerken van SNS Lijfrente Geblokkeerde rekening (niet tussentijds opnemen). Kiezen uit variabele of vaste rente. Beleggen is mogelijk. Zelf bepalen hoe lang je je geld opzij zet (binnen fiscale grenzen). Uitkeren in termijnen met een lijfrente-uitkeringsproduct, bijvoorbeeld SNS Lijfrentenieren. Vrijblijvend oriëntatiegesprek Zo werkt fiscaal vriendelijk geld opzij zettenHet bedrag dat je inlegt, kun je aftrekken in je aangifte inkomstenbelasting in box 1. Er zit wel een maximum aan hoeveel je in een jaar mag inleggen. Dat noemen we jaarruimte. Op de website van de Belastingdienst reken je uit wat jouw jaarruimte is. Goed om te weten: Zolang het geld op je SNS Lijfrente staat, hoef je er geen belasting in box 3 over te betalen.Bereken je jaarruimte bij de BelastingdienstDit zijn de regels als je laat uitkerenJe betaalt pas belasting in box 1 als je het geld in termijnen laat uitkeren. Bijvoorbeeld met SNS Lijfrentenieren. Op de uitkeringen van SNS Lijfrentenieren houden we alvast loonheffing in en die dragen we af aan de Belastingdienst.Meer over deze fiscale regel en een rekenvoorbeeld Goed om te weten: Vanaf je AOW-leeftijd betaal je vaak minder inkomstenbelasting. Je betaalt dan dus misschien minder belasting dan als je geld daarvoor laat uitkeren. Variabele of vaste renteJe krijgt bij SNS Lijfrente standaard een variabele rente. Deze keren we elke maand uit. Maar je kunt ook kiezen voor een vaste rente met een bepaalde looptijd. Daarvoor is er SNS Lijfrente Deposito. Je krijgt de rente jaarlijks bijgeschreven op je deposito. Je krijgt dus altijd rente op rente.Meer over SNS Lijfrente DepositoJe geld beleggenMet het geld dat op SNS Lijfrente staat, kun je ook beleggen in 5 ASN Duurzame Mixfondsen. Je bepaalt zelf in welk beleggingsfonds je belegt. Je krijgt dus geen beleggingsadvies van een adviseur. Met een handige rekentool, zie je wat je beleggingskeuze kan opleveren. Je kunt deze vinden op onze site. Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen.Beleggen met een SNS Lijfrente is geschikt voor je als je: minimaal 5 jaar je geld kunt en wilt beleggen de uitkering niet nodig hebt voor je basiskosten, zoals vaste lasten en boodschappen zelfstandig kunt en wil beleggen in beleggingsfondsen bereid bent om beleggingsrisico te lopen Beleggen met een SNS Lijfrente is niet geschikt voor je als je: belegt met geld dat je nu of later echt niet kunt missen; geen beleggingsrisico wilt lopen; geen internet hebt. Waarin kun je beleggen met SNS Lijfrente?Kies je voor beleggen met SNS Lijfrente? Dan kun je beleggen in één van de 5 duurzame ASN beleggingsfondsen: ASN Duurzaam Mixfonds Zeer Defensief ASN Duurzaam Mixfonds Defensief ASN Duurzaam Mixfonds Neutraal ASN Duurzaam Mixfonds Offensief ASN Duurzaam Mixfonds Zeer Offensief Onderaan deze pagina’s vind je het Essentiële-informatiedocument (Eid). Lees die goed door voor je begint met beleggen. Er staat belangrijke informatie in over het rendement en de risico’s die bij de fondsen horen.Beginnen met beleggenHeb je al een SNS Lijfrente waarmee je spaart? En wil je beginnen met beleggen? Vul dan dit formulier in: Aanvragen beleggen bij banksparen SNS Lijfrente (pdf) 598,68 KB Kosten voor beleggenVoor beleggen met SNS Lijfrente betaal je servicekosten aan ons en fondskosten aan de fondsbeheerder. De servicekosten zijn maximaal 0,3% per jaar. De fondskosten zijn verwerkt in de koers van het fonds. Lees meer over beleggingskostenKosten en afsluiten SNS Lijfrente Hoe kun je SNS Lijfrente aanvragen Omschrijving Kosten Met volledig advies Weet je niks of niet genoeg van producten zoals SNS Lijfrente? Dan kun je dit product alleen afsluiten als je een volledig advies van een SNS Adviseur hebt gekregen. Die kijkt dan goed naar je financiële situatie nu en je wensen voor de toekomst. € 150 per uur Met deeladvies Deeladvies is een verkort advies. Je checkt samen met een adviseur aan de hand van een aantal punten of SNS Lijfrente bij jou past. € 800 Zonder advies Je krijgt informatie van ons over het product en hulp bij je aanvraag. Je krijgt geen advies en daarom moet je slagen voor een kennis- en ervaringstoets. € 250 Als je tussentijds wilt beëindigenWil je met je SNS Lijfrente overstappen naar een andere bank of verzekeraar? Dan betaal je ons € 150 voor het overboeken van je saldo. We houden dit bedrag in van het geld dat op je SNS Lijfrente staat. Wil jij SNS Lijfrente tussentijds beëindigen en gebruik je het saldo niet voor een ander lijfrente-product? Dan moet je over het opgenomen bedrag inkomstenbelasting betalen en waarschijnlijk ook revisierente (een soort boete). Je leest er meer over in de voorwaarden.Als je SNS Lijfrente beëindigt, dan moet je eerst je eventuele beleggingen verkopen. Heb je dit zelf nog niet gedaan? Dan doen wij dit voor je.Heb je een SNS Lijfrente Deposito? Dan betaal je opnamekosten als je deze voor het einde van de afgesproken looptijd wilt beëindigen. Hoeveel je betaalt, hangt af van de periode dat het geld nog vast zou staan in je deposito. Meer over SNS Lijfrente DepositoDe voorwaardenIn de voorwaarden lees je wat je van ons kunt verwachten. Maar ook wat wij van jou verwachten. Lees ze goed door. Zo werkt SNS Lijfrente Lees meer over de inleg, looptijd en uitkering van SNS Lijfrente. Zo werkt het SNS Lijfrente aanvragen Meer weten of SNS Lijfrente aanvragen? Meer over aanvragen"
