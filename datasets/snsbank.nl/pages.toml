title = "Beleggen voor de lange termijn - SNS Bank"
description = "Lees meer over de kracht van beleggen voor de lange termijn."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Beleggen op de langere termijn, een slimme keuze?Met welke reden je ook belegt, het is verstandig om te beleggen voor de langere termijn. Wil je volgend jaar een auto of een huis kopen, of plan je een verre reis? Dan is beleggen misschien een minder slimme keuze en kun je bijvoorbeeld beter voor sparen kiezen. Koersschommelingen kunnen namelijk invloed hebben op je rendement en dus ook je belegd vermogen. Wil je bouwen aan een solide, financiële basis, waardoor je in de toekomst bijvoorbeeld wat minder kan gaan werken? Of misschien heb je de ambitie om in het buitenland te wonen en werken? Dan kan beleggen een goede manier zijn om naar deze doelen op een langere termijn toe te werken. De rust van beleggen voor de lange termijnBeleggen voor de langere termijn geeft je mogelijk rust. Als je belegt voor de lange termijn hoef je je niet druk te maken over het dagelijkse nieuws zoals koersschommelingen, nieuwe records, rode cijfers en winstwaarschuwingen. Ook economische en politieke ontwikkelingen kunnen invloed hebben op de beurs. En dus ook op je beleggingen. Beleggen op de lange termijn kan dus een stabielere basis zijn. Tip: Beleg altijd met geld dat je niet direct nodig hebt. Zo kun je het de tijd geven om te groeien en voorkom je dat je je inleg plotseling of op een ongunstig moment moet verkopen. Bereken wat je kunt verwachten op de lange termijnBen je benieuwd wat jouw beleggingen je op de lange termijn mogelijk kunnen opleveren? Bereken het hieronder eenvoudig en snel met onze handige rekentool. Zo kom je er nu achter wat je later mogelijk kunt verwachten met jouw beleggingen op de lange termijn. Bron: Ortec Finance Uitleg over de berekening Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Het verwachte rendement Je ziet in de rekentool wat het verwachte rendement én risico is van het gekozen beleggingsfonds voor een gemiddeld, goed en slecht jaar. Ook de verwachte rendementen voor sparen staan erbij als je hebt gekozen om (met een deel) van je inleg te sparen.De duurzame mixfondsen verschillen van ‘zeer defensief’ tot ‘zeer offensief’. Bij een zeer offensief fonds, is het gemiddelde verwachte rendement hoog. Maar de verschillen tussen slechte en goede jaren zijn ook groter. Beleg je een langere periode? Dan heb je langer de tijd om een slecht jaar te compenseren. En om dichter bij je verwachte rendement per jaar uit te komen. Meer over de scenario's In de grafiek zie je het verwachte resultaat bij verschillende scenario’s als je belegt. We rekenen met 3 scenario’s:Slecht: dit is het verwachte resultaat bij een slecht scenario. Je hebt ongeveer 10% kans op een lager eindbedrag.Gemiddeld: dit is het verwachte resultaat bij een gemiddeld scenario. Je hebt ongeveer 50% kans op een hoger of een lager eindbedrag.Goed: dit is het verwachte resultaat bij een goed scenario. Je hebt ongeveer 10% kans op een hoger eindbedrag. Wie berekent de verwachte resultaten? De verschillende scenario’s in de grafiek zijn berekend door Ortec Finance. Deze internationale organisatie is gespecialiseerd in het meten en beheren van risico's en rendementen op het gebied van vermogensbeheer. Bij de berekeningen neemt Ortec Finance ook de historische rendementen mee. Daarnaast kijkt de organisatie naar de uitkomsten van verschillende economische scenario’s en schat daarmee toekomstige ontwikkelingen in. Goed om te weten De rekentool is bedoeld als hulpmiddel, het is geen beleggingsadvies. De uitkomst is met zorg samengesteld en gebaseerd op betrouwbare informatiebronnen, maar is geen garantie voor de juistheid of volledigheid van de informatie. Aan de uitkomsten van de tool kunnen geen rechten worden ontleend. Het einde van je beleggingsperiodeAl voor het einde van je beleggingsperiode moet je nadenken wat je wilt gaan doen. Want het is een risico als je ineens op een ongunstig moment moet verkopen. Het is dan handig om te weten wat jouw belegde bedrag ongeveer gaat worden. Je kunt ervoor kiezen om de eventuele risico’s te verminderen. Of om met steeds minder risico te gaan beleggen. Bijvoorbeeld door steeds een deel van je beleggingen om te zetten naar defensievere fondsen of obligaties. Of je verkoopt steeds een deel en zet het bedrag op je spaarrekening. Zo heb je sneller duidelijkheid over het uiteindelijke bedrag rond het einde van je beleggingsperiode. Periodiek beleggen Met periodiek beleggen bepaal je zelf hoeveel je inlegt en wanneer. Lees meer over de kracht van periodiek beleggen. Meer weten Maandbedrag sparen of beleggen Ben je benieuwd naar vermogensgroei? Bereken het rendement van beleggen en de rente van sparen. Berekenen"
