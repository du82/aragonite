["https://snsbank.nl/particulier/beleggen/beleggen-voor-beginners/wat-is-beleggen.html"]
title = "Wat is beleggen? - SNS Bank"
description = "Laten we even bij het begin beginnen: wat is beleggen eigenlijk? We leggen het je uit"
full_description = '''Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Wat is beleggen?Wil je werken aan vermogen opbouwen, dan kun je gaan beleggen. Maar voordat je begint aan beleggen, moet je begrijpen wat beleggen eigenlijk is. We leggen het je hier uit. Oeps! Geen video Je kunt de video over dit onderwerp niet kijken omdat je een vereiste cookie hebt uitgeschakeld. Toch zien? Kies een andere cookie-instelling Of kijk deze video op youtube.com document.querySelectorAll(".openYoutube").forEach((element)=> { element.addEventListener("click", ()=> { window.open('https://www.youtube.com/embed/TZHRFsTwYS4??rel=1&showinfo=1&controls=1&modestbranding=1&enablejsapi=1&autoplay=0', '_blank', 'noopener'); return false; }); }) Beleggen is investerenAls je belegt, investeer je geld met het idee dat het meer waard wordt. Je kunt bijvoorbeeld een stukje van een bedrijf kopen. Doet dit bedrijf vervolgens goede zaken? Dan kan het stukje dat jij kocht meer waard worden, omdat nu meer mensen een stukje van dit bedrijf willen kopen. Rendement, heet dat. Gaat het juist niet zo goed met het bedrijf? Dan kan de waarde van jouw gekochte stukje dalen, omdat minder mensen het aantrekkelijk vinden om ook een stukje te kopen. Hoe langer je belegt, hoe groter de kans op een mooi rendement omdat je je geld de tijd geeft om te groeien. Ook heb je de tijd om een eventueel verlies na een koersdaling weer goed te maken.Meer over beleggen voor de lange termijnBeleggen of speculeren?Denk je aan investeren, dan kun je beleggen of speculeren. Als je belegt, dan doe je dat voor de lange termijn, ten minste voor 3 jaar. Je investeert in aandelen en obligaties van onder andere bedrijven. Je rendement behaal je doordat het bedrijf waarin je investeert goede zaken doet. De waarde van jouw aandelen groeit dan mee met de waarde van de bedrijven waarin je belegt. Met beleggen loop je altijd risico, maar je bepaalt zelf of je weinig (defensief), gemiddeld (neutraal) of veel risico (offensief) wilt nemen. Als je speculeert, dan is je doel om op korte termijn zoveel mogelijk winst te maken als gevolg van koersschommelingen. Dat kan bijvoorbeeld met crypto’s, opties maar ook met aandelen. Eventuele winst behaal je door de markt te slim af te zijn, of door meer geluk te hebben dan andere speculanten. Speculeren wordt daarom vaak vergeleken met gokken: sommigen winnen veel, en veel anderen zijn hun geld kwijt. Je neemt met speculeren altijd een hoog risico. Benieuwd of speculeren of beleggen iets voor jou is? Check het met onze handige keuzehulp. Waarin kun je beleggen?Beleggen kan op verschillende manieren. Dit zijn de bekendste:Beleggen in bedrijven of beleggingsfondsen. Je koopt dan zogenaamde effecten – dat zijn onder andere aandelen en obligaties.Beleggen in vastgoed. Bijvoorbeeld door een tweede huis te kopen, of een bedrijfspand.Investeren in materialen of grondstoffen zoals goud of kunst. Beleggen in een beleggingsfondsBeleg je in bedrijven? Dan kan het slim zijn om je inleg te spreiden over meerdere bedrijven. Bijvoorbeeld door te beleggen in een beleggingsfonds. Zij combineren aandelen en obligaties – effecten dus. Een beleggingsfonds kan beleggen in meer dan honderd verschillende bedrijven over de hele wereld. En heeft een bedrijf in dat fonds een tegenvaller? Dan heb je ook nog beleggingen in andere bedrijven. Zo spreidt een beleggingsfonds het risico op een tegenvallend rendement. Als je via ons belegt, beleg je altijd in een van de duurzame beleggingsfondsen van ASN Impact Investors. Meer over beleggen in een beleggingsfonds Wat zijn indexfondsen en ETF's?Misschien heb je ook weleens iets gehoord over beleggen in indexfondsen. Dat soort fondsen noemen we ook wel ETF’s of trackers. Een ETF is ook een soort fonds dat op de beurs verhandeld kan worden. Als je belegt in ETF's, koop je bijvoorbeeld het indexfonds van de AEX. Je belegt dan in de 25 grootste bedrijven van Nederland. Je hoeft daarna eigenlijk niks meer te doen en volgt dus passief de index. Bij ETF’s is er geen fondsmanager die voor je aan- of verkoopt. Je doet het simpelweg zo goed of slecht als de index het doet. Goed om te weten: via ons kun je niet beleggen in indexfondsen, omdat er geen indexfondsen bestaan die voldoen aan de duurzaamheidseisen van ASN Impact Investors. Investeren in vastgoed Je kunt ook beleggen in vastgoed, bijvoorbeeld door een tweede huis te kopen. Het idee is dan dat het huis uiteindelijk meer waard wordt en je zo vermogen opbouwt. Investeren in vastgoed kan op de lange termijn zeker rendement opleveren, maar er zijn ook risico’s: Het huis dat je hebt gekocht, wordt minder waard. Bijvoorbeeld door veranderingen op de woningmarkt, maar ook andere omstandigheden kunnen invloed hebben op de waarde. Zo kan de buurt achteruit gaan of de omgeving veranderen.Je kunt niet zomaar bij je geld. Als je je geld nodig hebt, moet je eerst het pand verkopen.Als je voor het eerst belegt in vastgoed, zit een groot deel van je vermogen in 1 pand. Je hebt je risico dan niet gespreid.De rente kan dalen of juist stijgen. Is je rentevaste periode afgelopen en wil je verlengen? Dan loop je het risico dat je een hogere rente krijgt en je maandlasten hoger worden.Overweeg je om te investeren in vastgoed? Lees je dan in en laat je altijd goed adviseren. Investeren in materialen of grondstoffen Je kunt ook investeren in grondstoffen en materialen, zoals goud of koper. De bedoeling is dat de grondstof uiteindelijk meer waard wordt. Ook investeren mensen soms in grondstoffen omdat het hun beleggingsportefeuille in balans kan brengen. Dat klinkt ingewikkeld, maar zit zo: de waarde van grondstoffen beweegt niet mee met de koersschommelingen van de aandelenmarkt. Soms doet het zelfs het tegenovergestelde. Dus stort de aandelenmarkt in? Dan kan je investering in een grondstof de schade voor jou beperken. Dat kan goed uitpakken, maar er zitten ook nadelen en risico’s aan vast:Je hebt geen tussentijdse inkomsten uit je investering, zoals je bij aandelen of vastgoed wel kunt hebben.De waarden van grondstoffen zijn onvoorspelbaar en grillig. Het schuurt zelfs tegen speculeren aan. Investeren in verzamelobjecten Een bijzondere vorm van investeren in materialen, is beleggen in verzamelobjecten. Dit kan bijvoorbeeld in kunst, sneakers of stripboeken. Er kunnen natuurlijk liefhebbers en kenners zijn aan wie je jouw object voor méér kunt verkopen, maar weet dat deze manier van investeren heel onzeker is. Denk maar aan de postzegel: ooit waren veel mensen én bedrijven ervan overtuigd dat postzegels alleen maar in waarde zouden stijgen. Een tijd lang was dat ook zo, maar uiteindelijk kelderde de waarde enorm. Goed om te weten: De onvoorspelbaarheid is de belangrijkste reden dat je via ons niet kunt investeren in materialen, verzamelobjecten of grondstoffen. Benieuwd of beleggen bij jouw wensen past? Benieuwd of beleggen iets voor jou is? Met onze keuzehulp kom je er in 3 vragen eenvoudig en snel achter.Doe de keuzehulp Terugkijken: webinar 'Starten met beleggen' Denk je erover om te beginnen met beleggen, maar heb je nog wat vragen? Dit webinar helpt je op weg. Nu bekijken Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips'''
