title = "SNS Persoonlijke lening - SNS Bank"
description = "Een persoonlijke lening: wat is de rente, hoeveel kun je lenen en wat kost het je per maand? Bereken het gemakkelijk online."
full_description = "Lees ook de onderstaande informatie en de voorwaarden voordat je een SNS Persoonlijke Lening aanvraagt. Kenmerken SNS Persoonlijke Lening Lening die je in 1 keer opneemt Lening met vaste rente en looptijd Je betaalt iedere maand een vast bedrag terug: voor een deel aflossing en een deel rente Afgeloste bedragen kun je niet opnieuw opnemen Je kunt extra/versneld aflossen zonder extra kosten Waarom een persoonlijke lening?Een auto, zonnepanelen, opleiding of andere grote aankoop… Als je het nu nodig hebt, maar je spaargeld daarvoor niet wilt gebruiken? Hoe financier je dat dan? Een persoonlijke lening kan dan een oplossing zijn. Zo werkt 'tJe leent eenmalig een bedrag en begint meteen met het terugbetalen ervan. Iedere maand een vast bedrag. Jij bepaalt hoelang je erover wilt doen om de persoonlijke lening terug te betalen. Al gelden wel een minimum en maximum looptijd: ten minste 6 maanden en hooguit 10 jaar, afhankelijk van waarvoor je leent. Zo spreid je je kosten. Maar bedenk wel: over het bedrag dat je (nog) niet hebt terugbetaald, betaal je iedere maand rente. Dus hoe langer jij erover doet, hoe duurder lenen is. Goed om te weten:Minimumbedrag dat je kunt lenen: € 2.500 maximum: € 75.000. Hoeveel je kunt lenen hangt onder andere af van het leendoel, je inkomsten en vaste lasten. Bij ons weet je van tevoren waar je aan toe bent Sluit je bij ons een lening af? Dan weet je van tevoren al precies hoeveel rente je gaat betalen. Dus geen verrassingen achteraf. Dat zit zo: als je een lening afsluit, betaal je rente. Een deel van deze rente betaal je omdat een bank altijd risico loopt dat de lening niet terugbetaalt kan worden. ‘Risico-opslag’, noemen we dat. Risico-opslag kun je op 2 manieren berekenen: Door te kijken naar degene die een lening aanvraagt. Er wordt dan per persoon ingeschat wat de risico’s zijn en welke opslag daarbij past. Bijvoorbeeld door te kijken naar je leeftijd. Iemand van 28 kan dan een andere rente betalen dan iemand van 58. Door te kijken naar het leendoel, dus waarvoor je de lening aanvraagt. De bank gebruikt hierbij een gemiddelde risico-opslag, dat past bij dit leendoel. Dit staat al vast, dus daarom weet je meteen waar je aan toe bent.Wij berekenen je risico-opslag aan de hand van je leendoel, bij ons zie je dus meteen hoeveel rente je gaat betalen. Tip: Vergelijk je leningen bij verschillende aanbieders? Vraag of check dan altijd goed hoe zij de rente berekenen. Als de rente per persoon berekend wordt, staat er vaak bij dat het een ‘vanaf’-rente is. Voor wie is een persoonlijke lening?Je kunt bij ons een SNS Persoonlijke Lening aanvragen als je: al klant bij ons bent je tussen 21 en 69 jaar oud bent tijdelijk een lening wilt voor een specifiek doel een vast inkomen hebt en/of een tijdelijk inkomen uit loondienst hebt in Nederland woont en werkt voldoende inkomen hebt om de lening iedere maand te kunnen terugbetalen (wij toetsen dat) geen negatieve BKR-registratie hebt Let op:Om de lening met je partner af te kunnen sluiten moet je partner: ook klant zijn van SNS Mijn SNS hebben op hetzelfde adres wonen als jij Voor wie is de SNS Persoonlijke Lening niet geschikt? De SNS Persoonlijke Lening kun je niet aanvragen als je niet voldoet aan een van bovenstaande punten. De SNS Persoonlijke Lening mag je niet zakelijk gebruiken. Meer informatie over zakelijk lenen Ben je op zoek naar een flexibele lening waarbij je gedane aflossingen opnieuw kunt opnemen, zoals bij bijvoorbeeld een doorlopend krediet? Dan is de SNS Persoonlijke Lening niet het juiste product voor je. Persoonlijke lening berekenenWaarvoor wil je lenen? Hoeveel wil je lenen? En hoe snel wil je het geleende bedrag terugbetalen? Je volgt een paar stappen waarin we checken of de lening voor jou verantwoord is. Je ziet meteen: of je het gewenste bedrag kunt lenen in hoeveel maanden je het terug kunt betalen wat je iedere maand betaalt voor de lening Daarna kun je meteen een offerte voor de persoonlijke lening zoals je ’m hebt berekend aanvragen. Deze offerte is maximaal 14 dagen geldig. Leendoel kiezen en berekenen Rente persoonlijke lening Rentetarieven van de SNS Persoonlijke Lening bij een looptijd van 1 tot 10 jaar en een leenbedrag van minimaal € 2.500 en maximaal € 75.000. Leenbedrag SNS Regulier SNS Verduurzaming € 2.500 tot € 10.000 9,4% 8,9% € 10.000 tot € 15.000 7,9% 7,4% € 15.000 tot € 75.000 6,7% 6,2% Rentepercentage geldig per 13 december 2024 We checken het leendoelWe vinden het belangrijk dat de looptijd van de lening past bij het leendoel om te voorkomen dat je nog betaalt voor iets wat geen waarde meer heeft. Daarom vragen we soms facturen op om achteraf het leendoel te controleren.Heb je aangegeven dat je leent voor het verduurzamen van je koopwoning? Dan moet je bij de aanvraag een offerte van de verduurzamingsmaatregelen aanleveren. Als na verstrekken van de lening blijkt dat het geld niet is besteed aan verduurzaming, passen we de rente aan. Je persoonlijke lening aflossenJe betaalt per maand een vast bedrag. Dit bedrag schrijven we automatisch van je betaalrekening af. Dat doen we op de 1e van de maand. Kunnen we het bedrag niet van je rekening afschrijven? Bijvoorbeeld omdat er niet genoeg geld op je rekening staat? Als je niet op tijd betaalt, betaal je een vertragingsvergoeding. Je leest er meer over in de voorwaarden van de SNS Persoonlijke LeningExtra aflossen op je persoonlijke leningWil je extra aflossen? Dat kan zonder kosten. Je regelt het makkelijk zelf in de SNS App en Mijn SNS. Ga naar je persoonlijke lening, kies ‘Extra aflossen’ en volg de stappen.Kosten Persoonlijke LeningHoeveel een Persoonlijke Lening kost hangt af van het leenbedrag, de rente en de looptijd. De looptijd van een Persoonlijke Lening is minimaal 6 maanden en maximaal 120 maanden.Los je de lening sneller af? Dan wordt de totale prijs van de lening lager. Hieronder zie je 2 voorbeelden met de actuele rentes.Regulier Krediet bedrag Maand bedrag* Vaste debet- rente** Jaarlijks kosten perc