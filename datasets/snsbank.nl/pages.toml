full_description = '''Onze 4 beloften Je krijgt bij ons persoonlijke aandacht Het draait om jouw belang Ons partnernetwerk staat voor je klaar Jouw ontwikkeling is ons doel Zo maken we onze beloften waar Je krijgt bij ons persoonlijke aandacht Je doet ’t liefst zoveel mogelijk zelf. Maar kom je er niet uit? Dan zijn onze mensen er voor je. Op de manier die jij wilt: via WhatsApp, (video)bellen of in de winkel. Persoonlijk en altijd binnen handbereik.Alle contactmogelijkheden op een rij Het draait om jouw belangJij wilt er op vooruit gaan, daarom denken we mee in jouw belang. Zo bieden we niet alleen producten van onszelf. Maar ook van andere partijen als dit beter bij je past. Zo vind je bij ons ook hypotheken van andere aanbieders. Je krijgt ook handige seintjes. Bijvoorbeeld als je salaris gestort is, of als we op het punt staan om een incasso af te schrijven. Of als je hypotheekrente misschien omlaag kan. Ons partnernetwerk staat voor je klaarNaast je gewone bankzaken bieden we je handige aanvullende diensten en producten. Zodat je alles makkelijk in 1 keer regelt. Wil je bijvoorbeeld gaan verhuizen of je huis verduurzamen? Of hulp bij je belastingaangifte? Via je financieel coach vind je gemakkelijk de juiste aanbieders. Of we dat nu zelf zijn of daarvoor samenwerken met een vertrouwde partner. Je financieel coach helpt je ook om je geldzaken daarvoor slim te regelen. Jouw ontwikkeling is ons doelDe wereld om ons heen verandert snel. We vinden het belangrijk dat jij daarin kunt blijven groeien. Of ’t nu gaat om groei in je werk, je persoonlijke leven of je vermogen. Wij denken met je mee, nu en in de toekomst. Zo kun je bij ons voor verschillende levensfases passende (online) trainingen en workshops volgen. Bijvoorbeeld in ondernemerschap, vermogensopbouw en geld voor nu en later. Oeps! Geen video Je kunt de video over dit onderwerp niet kijken omdat je een vereiste cookie hebt uitgeschakeld. Toch zien? Kies een andere cookie-instelling Of kijk deze video op you