["https://snsbank.nl/particulier/beleggen/beleggen-voor-beginners/beleggen-in-aandelen.html"]
title = "Beleggen in aandelen - SNS Bank"
description = "Wat zijn aandelen? En hoe werken ze? Hier kom je meer te weten over aandelen, aandelenkoersen en aandelen kopen."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Wat zijn aandelen? Aandelen zijn eigendomsbewijzen. Een aandeel is een waardepapier waarmee je voor een stukje eigenaar wordt van een bedrijf. Hoe werken aandelen? Als bedrijven geld nodig hebben kunnen ze een lening aangaan bij de bank maar ze kunnen ook aandelen uitgeven. Als je zo’n aandeel koopt, stel je jouw geld ter beschikking en in ruil daarvoor word je voor een deel eigenaar van dat bedrijf. In Nederland vindt de handel in hoofdfondsen (aandelen van grote beursgenoteerde ondernemingen) plaats op de effectenbeurs van Euronext Amsterdam: de AEX. De koers van een aandeel (de waarde) is afhankelijk van vraag en aanbod. De mogelijkheid bestaat dat je aandelen in waarde stijgen. Maar het is ook mogelijk dat je aandelen weinig tot niets opleveren. En dat je inleg bij een ongunstig koersverloop geheel of gedeeltelijk verloren gaat. Aandelen kopenJe kunt niet zelf aandelen kopen op de beurs. Dit doe je via een broker of bank waar je een effectenrekening opent. Wanneer je aandelen koopt, is het belangrijk om je in het bedrijf te verdiepen en de cijfers goed na te gaan. Goed om te weten: een broker of bank rekent kosten.Rendement op aandelenEr zijn 2 manieren waarmee je winst kunt maken met aandelen: koerswinst en dividend. Goed om te weten: niet alle aandelen kennen koerswinst of keren dividend uit, je bent dus nooit verzekerd van een positief rendement. We zetten de manieren van winst met aandelen voor je op een rijtje:Koerswinst bij aandelenDe aandelenkoers is de prijs waarvoor je het aandeel kunt kopen of verkopen. Wanneer je je aandelen een tijdje vasthoudt en de koers stijgt, verdien je geld als je ze verkoopt. Aandelen zijn verhandelbaar en hierdoor ontstaat er automatisch vraag en aanbod naar het aandeel. Voorbeeld rendement door koersstijgingen:Je koopt aandelen voor een bedrag van 800 euro. Wanneer de waarde van deze aandelen over een periode van 5 jaar stijgt naar 1.000 euro en je besluit deze te verkopen, Heb je rendement behaald. Je hebt dan een rendement van 200 euro, oftewel 25% (5% op jaarbasis). Dividend bij aandelenDividend is een zogenaamde winstuitkering. Het bedrijf kan zelf vaststellen hoeveel procent van de winst als dividend wordt uitgekeerd. Sommige bedrijven betalen nooit dividend uit, terwijl er ook bedrijven zijn die meerdere procenten aan dividend uitbetalen op jaarbasis.Het dividend kan op 2 manieren worden uitgekeerd: in geld (cash dividend) en in aandelen (stock dividend). Bij sommige ondernemingen mag de aandeelhouder kiezen tussen geld en aandelen. Dat noemen we keuzedividend.Beleggen in aandelen via een fondsJe kunt participaties kopen in een aandelenfonds. De beheerder van dat fonds verzamelt geld van deelnemers om aandelen van bedrijven aan te kopen. Je kunt kiezen voor een fonds dat uitsluitend aandelen koopt, of voor een fonds met een mix van bijvoorbeeld aandelen en obligaties. Beleggen in beleggingsfondsen heeft als voordeel dat de fondsbeheerder zorgt voor een spreiding van het risico. Deze spreiding zit 'm in de hoeveelheid bedrijven, sectoren en landen waarin een fonds belegt. Als het minder gaat met één bedrijf in het fonds, zijn er nog andere bedrijven in het fonds die dit kunnen opvangen. Beleggen in beleggingsfondsen kent ook nadelen. Zo zijn de kosten van een beleggingsfonds vaak hoger omdat de fondsen actief beheerd worden door de fondsmanager. Daarnaast kan een participatie van een beleggingsfonds vaak maximaal één keer per dag verhandeld worden.Meer weten over beleggen in beleggingsfondsen Goed om te weten: Bij ons kun je alleen in duurzame beleggingsfondsen beleggen. Meer of minder risico?Met de risico-indicator kun je het risico van een beleggingsfonds inschatten en met elkaar vergelijken. Hoe hoger het getal, hoe harder de koersen van het beleggingsfonds kunnen stijgen en dalen, dus: hoe groter het risico. Een fonds met voornamelijk aandelen zal over het algemeen sneller en harder stijgen en dalen dan bijvoorbeeld een obligatiefonds. 5 misverstanden over beleggen Kun je alleen beleggen als je al een groot vermogen hebt? Lees hier 5 misverstanden over beleggen. Meer weten Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
