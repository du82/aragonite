description = "Beleggen voor studenten of jongeren? Kan een goed idee zijn. Maar kan ook fout gaan. Lees je in! Tips."
full_description = '''met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Ben je jong en geïnteresseerd in beleggen? We geven je wat voordelen van jong zijn. Oeps! Geen video Je kunt de video over dit onderwerp niet kijken omdat je een vereiste cookie hebt uitgeschakeld. Toch zien? Kies een andere cookie-instelling Of kijk deze video op youtube.com document.querySelectorAll(".openYoutube").forEach((element)=> { element.addEventListener("click", ()=> { window.open('https://www.youtube.com/embed/2ThilBzZhHE?rel=0&showinfo=1&controls=1&modestbranding=1&enablejsapi=1&autoplay=0', '_blank', 'noopener'); return false; }); }) Beleggingstips voor studenten en jongeren Regelmatig inleggen Leg eens in de zoveel tijd (bijvoorbeeld per maand) een bedrag in. Dit heet periodiek inleggen. Zo loop je over lange tijd minder risico dat je op een slecht moment koopt en je rendement is mogelijk hoger. Stel een beleggingsplan en beleggingsdoel op Wil je beginnen met beleggen? het kan helpen om haalbare en concrete doelen te stellen of een plan te maken. Bijvoorbeeld: Ik begin met een eenmalige inleg van € 1.000 en leg daarna elke maand € 50 in, op welk bedrag kom ik dan uit?Beleggingsdoel berekenen Beleg met geld dat je kunt missen Heb je schulden? Los die dan eerst af voordat je gaat beleggen. Beleg ook alleen als je ook een spaarbuffer hebt. Een buffer is geld dat je niet direct nodig hebt maar misschien wel binnenkort omdat je telefoon ineens stuk gaat. Spreid je beleggingen Spreid je beleggingen. Dat betekent: zet niet al je geld op maar één soort belegging, in één sector of op één markt. Door je beleggingen te spreiden, spreidt je ook het risico dat je loopt. De risico's van beleggen voor jongeren Tips zijn handig, maar het is ook belangrijk om je bewust te zijn van de risico's. Beleggen is namelijk niet zonder risico, ook niet als je jong bent. We zetten een paar risico's voor jongeren en studenten voor je op een rij. Beleggen met geld dat je eigenlijk nodig hebt Het is niet verstandig om te beleggen met geld dat je eigenlijk niet kunt missen. Bijvoorbeeld omdat je niets achter de hand hebt voor als je laptop stuk gaat of je telefoon. Beleggen werkt niet zoals een spaarrekening. Grote kans dat de waarde van je beleggingen op het moment dat jij het geld nodig hebt lager is dan toen je inlegde. Je moet dus echt eerst wel een spaarbuffer opbouwen voordat je met beleggen begint. Beleggen met je studielening Het is nooit verstandig om te beleggen met geld dat je geleend hebt, ook niet met het geld voor je studie. Je moet dit geld ooit terugbetalen. Als je net op dat moment met tegenslag kampt in je beleggingen, dan kun je in de problemen komen. Beleg dus alleen met geld dat je niet terug hoeft te betalen of niet op korte termijn nodig hebt. Alles inzetten op 1 soort belegging Niet doen, je kunt beter niet wedden op 1 paard. Spreid je geld juist over verschillende soorten beleggingen. Zo maak je het risico kleiner dat al je geld plotseling veel minder waard wordt. Want als één van je beleggingen dan slecht gaat, kan het bij een andere misschien juist goed gaan. Of minder slecht. Handig: Door te beleggen in fondsen heb je automatisch al meer spreiding. Meer weten over hoe een beleggingsfonds werkt Snel winst willen halen Hoe meer tijd je neemt om te beleggen, hoe groter de kans dat je winst maakt. Beleggingen schommelen altijd wel. Als je de tijd neemt, is het niet zo erg als de beurs omlaag gaat. Je kunt dan namelijk wachten tot het weer beter gaat. Al is ook daar nooit een garantie op.Meer weten over beleggen op de lange termijn Test je beleggingskennisDe antwoorden van de kennisvragen vind je hieronder. Niet spieken!Kennisvraag 1: Investeren in aandelen is net zo risicovol als investeren in crypto.A. Klopt. Het risico is gelijk. En de kans dat je met cryptocurrency sneller veel geld verdient is bovendien groter. B. Klopt niet. Cryptocurrency is vooral speculatief en volledig gebaseerd op vraag en aanbod. Daardoor loop je meer risico met crypto dan met beleggen in aandelen. Het is geen gereguleerde markt, er is mede daardoor kans op diefstal, verlies en fraude.Wat is de volatiliteit van een effect?A. De volatiliteit is de beweeglijkheid van het effect. Hoe lager de volatiliteit, hoe stabieler het effect. En dus minder risicovol.B. De mix die je kiest tussen aandelen en obligaties.Wat is het prospectus van een effect?A. Een inschatting van het kredietrisico van een bedrijf of een overheid. B. Een verplicht document met informatie over het gekozen beleggingsfonds, aandeel of obligatie.B. Een verplicht document met informatie over het gekozen beleggingsfonds, aandeel of obligatie. Test je beleggingskennis - de antwoordenHier vind je de antwoorden op de vragen hierboven. Heb je niet alle 3 de vragen goed? Of heb je lopen gokken? Dan moet je je, voordat je gaat beleggen, toch echt eerst wat verder gaan verdiepen in wat er bij beleggen komt kijken. Vraag 1. Antwoord B is juist. Beleggen in aandelen heeft zeker ook risico’s, maar je kunt je in ieder geval verdiepen in de richtlijnen. Die geven je inzicht in waar een prijs naartoe kan gaan. Bij cryptocurrency ontbreekt die mogelijkheid. Het is dus veel risicovoller. Je kunt snel geld verdienen en snel al je geld kwijtraken.Vraag 2. Antwoord A is juist.Aan de hand van onder meer de volatiliteit kies je effecten die risicovol zijn of net niet.Vraag 3. Antwoord B is juist.Als je gaat beleggen, wil je er zeker van zijn dat je beschikt over alle relevante informatie over een onderneming. Als je goed geïnformeerd bent, kun je waarschijnlijk een betere beleggingsbeslissing nemen. Alle relevante informatie en risico’s over een onderneming vind je daarom in het prospectus. Bedrijven en overheden waar je in kunt investeren zijn verplicht deze informatie in het prospectus op te nemen. Mogelijk rendement berekenen Bereken wat beleggen je mogelijk kan opleveren en welke inleg je daarvoor nodig hebt. Rendement berekenen Welk beleggingsproduct kies je? Bekijk hoe je wilt beleggen: met SNS Doelbeleggen of de SNS Beleggingsrekening. Vergelijk'''
