full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Wat is duurzaam beleggen?Duurzaam beleggen is investeren in ondernemingen die hun maatschappelijke verantwoordelijkheid nemen. Bij duurzaam beleggen spelen de effecten van het ondernemen op milieu en maatschappij een belangrijke rol. Bij SNS kun je beleggen in 12 duurzame beleggingsfondsen. Wil je weten wat duurzaam beleggen via SNS nou precies betekent? Bekijk dan het duurzaamheidsbeleid van de fondsbeheerder ASN Impact Investors. Wat is groen beleggen?Groen beleggen is een vorm van duurzaam beleggen. Groene beleggingen zijn beleggingen in fondsen die deelnemen in projecten voor milieubescherming. Daar kun je fiscaal voordeel mee behalen. Meer informatie over de fiscale voordelen van groene beleggingen vind je hier.Is duurzaam beleggen wat voor jou?Wil je dat bedrijven, overheden en projecten waarin je belegt rekening houden met mens, dier en natuur? Dan kan duurzaam beleggen interessant zijn voor jou. Want zo stimuleer je met je beleggingsgeld duurzame bedrijven, landen en projecten. Je laat je geld werken voor een duurzamere wereld, waar mensen prettig kunnen leven en de natuur beschermd wordt. De positieve impact van duurzaam beleggenBeleg je duurzaam, dan investeer je in bedrijven met een duurzame strategie. Een duurzame strategie kan verschillende dingen betekenen:Respecteren van mensenrechten - dus ook de rechten van hun medewerkers. Duurzame bedrijven zetten zich graag in voor een organisatie met een mensgericht personeelsbeleid. Respecteren van de rechten van hun klanten - Denk hierbij bijvoorbeeld aan telecombedrijven die het recht op privacy respecteren of voedingsbedrijven die maatregelen nemen om obesitas te verminderen. Respecteren van klimaat- en milieudoelen - Omdat duurzame bedrijven het klimaat en milieu belangrijk vinden is de kans op een milieuschandaal – met alle negatieve publiciteit van dien – kleiner. Uitstoot en energieverbruik - Doordat duurzame bedrijven moeite doen om minder uitstoot, energie, en water te gebruiken, maken zij ook minder kosten. Bijvoorbeeld doordat deze bedrijven minder afval produceren en zuiniger omgaan met grondstoffen, onder meer door recycling. Duurzaamheid kan op de langere termijn een positief effect op de bedrijfsresultaten. Dat levert dan financieel rendement én een betere wereld op. Redenen om duurzaam te beleggen Beleggen in goed presterende bedrijven die vooruitkijken Beleggen in microfinanciering en duurzame overheden Zerotolerancebeleid ten aanzien van wapens Geen beleggingen in fossiele energie zoals olie- en gasbedrijven Wist je dat ASN Impact Investors, de fondsbeheerder van de beleggingsfondsen die wij aanbieden al 2 jaar op rij is verkozen tot beste aanbieder van duurzame beleggingsproducten? Goed om te weten:De cashcow award is een initiatief van onder andere cashcow.nl, een multimediaal platform voor particuliere beleggers in Nederland. https://www.cashcowawards.nl/ https://www.cashcowawards.nl/ Periodiek beleggen Met periodiek beleggen bepaal je zelf hoeveel je inlegt en wanneer. Lees meer over de kracht van periodiek beleggen. Meer weten Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
