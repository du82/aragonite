title = "Dividend bij SNS - SNS Bank"
description = "Beleg je bij ons? Dan wil je natuurlijk weten hoeveel dividend dat oplevert. Bekijk de meest recente dividenduitkeringen per fonds hier."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Hoeveel dividend krijg je bij SNS?In de tabellen zie je hoeveel dividend de fondsen per participatie de afgelopen jaren hebben uitgekeerd. De bedragen zijn voor aftrek van 15% dividendbelasting. Overweeg je om een ander fonds aan te kopen dan je nu hebt? Lees je dan goed in. Bekijk het Essentiële Informatie Document (EID) en de fondspagina. Op 26 april 2024 zijn de eerste dividendbedragen van de ASN Beleggingsfondsen goedgekeurd door de Algemene Vergadering van Aandeelhouders (AvA). Deze fondsen keren uit op 7 mei 2024. Beleggingsfondsen die uitkeren op 7 mei 2024 Naam beleggingsfonds Dividend per participatie in 2022 Dividend per participatie in 2023 ASN Duurzaam Aandelenfonds € 3,00 € 3,00 ASN Duurzaam Obligatiefonds € 0,10 € 0,20 ASN Milieu & Waterfonds € 0,60 € 0,55 ASN Duurzaam Small & Midcapfonds € 1,00 € 0,85 Beleggingsfondsen die uitkeren op 12 juni 2024 Naam beleggingsfonds Dividend per participatie in 2022 Dividend per participatie in 2023 ASN Duurzaam Mixfonds Zeer Defensief € 0,85 € 0,40 ASN Duurzaam Mixfonds Defensief € 0,95 € 0,60 ASN Duurzaam Mixfonds Neutraal € 1,00 € 0,80 ASN Duurzaam Mixfonds Offensief € 1,15 € 1,00 ASN Duurzaam Mixfonds Zeer Offensief € 1,25 € 1,30 ASN Groenprojectenfonds € 0,05 € 0,05 ASN Microkredietfonds € 0,40 € 1,60 ASN Biodiversiteitsfonds Geen dividend Geen dividend Dividend laten uitkerenJe uitgekeerde dividend wordt automatisch herbelegd, tenzij je dit zelf anders hebt ingesteld. Wil je je dividend liever laten uitkeren? Je kunt dit zelf eenvoudig aanpassen:Log in bij de SNS App of in Mijn SNSGa naar 'Beheer'Kies bij 'Dividend' voor 'Uitkeren op rekening'Sla je aanpassingen opLet op: als je je dividend wilt laten uitkeren, zorg er dan voor dat je dit op tijd aangeeft in Mijn SNS of de SNS app:Krijg je dividend op 7 mei? Pas het dan vóór 6 mei 15 uur aan.Krijg je dividend op 12 juni? Pas het dan vóór 11 juni 15 uur aan. 2023: een roerig jaar met een positief eindeHet was een zeer beweeglijk jaar voor de aandelenmarkten. Zo waren er zorgen om de inflatie en beleidsrentes die steeds hoger werden. In het eerste halfjaar leek de inflatie langzaam maar zeker te dalen, waardoor de verwachting was dat de renteverhogingen al op hun einde liepen. Maar de centrale banken bleven hun rentes nog langer opschroeven. Hier kwam in november verandering in: de inflatiecijfers waren lager dan verwacht en het sentiment op de markten werd daarop veel positiever. Ook vielen de bedrijfsresultaten wederom mee én laten de macro-economische indicatoren voorzichtig een beter beeld zien. Zo werd het jaar toch met flinke koerswinsten afgesloten.Uitleg over het dividend per fonds Lees hieronder meer over het dividend dat wordt uitgekeerd per fonds. Beleggingsfondsen die uitkeren op 7 mei ASN Duurzaam Aandelenfonds De hoogte van het dividend hangt onder andere af van de dividenden die zijn uitgekeerd door de bedrijven waarin het fonds belegt. Die bedrijven bepalen zelf wat ze doen met hun winst: in kas houden, herinvesteren in het bedrijf, uitkeren als dividend , of een combinatie hiervan. Goed om te weten: Een fondsmanager beoordeelt of een bedrijf waarde toevoegt en of het in de portefeuille past. Wat een bedrijf met zijn winst doet, weegt minder zwaar. De duurzaamheidsselectie gaat vooraf aan dat oordeel. https://www.afm.nl/eid ASN Duurzaam Obligatiefonds Obligatiemarkten lieten over 2023 gemiddeld een positief rendement zien. Dit positieve rendement kwam vooral doordat de kapitaalmarktrente vanaf eind oktober daalde. Ook de kleinere renteverschillen tussen landen droegen hieraan bij. Dat zorgde voor een hogere waardering van de meeste obligaties in het ASN Duurzaam Obligatiefonds. Het dividend dat dit fonds kan uitkeren, wordt vooral bepaald door de couponrente die het fonds ontvangt op de leningen waar het in belegt. In 2023 is die rente toegenomen. Daardoor is het dividend ook hoger dan over 2022. https://www.afm.nl/eid ASN Milieu- en Waterfonds De hoogte van het dividend van het ASN Milieu & Waterfonds hangt onder andere af van de dividenden die zijn uitgekeerd door de bedrijven waarin het fonds belegt. Die bedrijven bepalen zelf wat ze doen met hun winst: in kas houden, herinvesteren in het bedrijf, uitkeren als dividend, of een combinatie hiervan.Het ASN Milieu & Waterfonds belegt vooral in bedrijven die volop bezig zijn met innovatie op het gebied van milieutechnologie. Die bevinden zich vaak nog in de opbouwfase. Daarom kiezen ze er vaak voor om de winst van het bedrijf te herinvesteren om verdere groei en innovatie mogelijk te maken. Ook dit keer kiezen veel bedrijven voor deze optie. Hierdoor pakt het dividend over 2023 lager uit dan het dividend over 2022. Een fondsmanager beoordeelt of een bedrijf waarde toevoegt en of het in de portefeuille past. Wat een bedrijf met zijn winst doet, weegt minder zwaar. De duurzaamheidsselectie gaat vooraf aan dat oordeel. https://www.afm.nl/eid ASN Duurzaam Small & Midcapfonds De hoogte van het dividend van het ASN Duurzaam Small & Midcapfonds hangt onder andere af van de dividenden die zijn uitgekeerd door de bedrijven waarin het fonds belegt. Die bedrijven bepalen zelf wat ze doen met hun winst: in kas houden, herinvesteren in het bedrijf, uitkeren als dividend, of een combinatie hiervan. Een fondsmanager beoordeelt of een bedrijf waarde toevoegt en of het in de portefeuille past. Wat een bedrijf met zijn winst doet, weegt minder zwaar. De duurzaamheidsselectie gaat vooraf aan dat oordeel. https://www.afm.nl/eid Beleggingsfondsen die uitkeren op 12 juni ASN Duurzame Mixfondsen Hieronder vallen: ASN Duurzaam Mixfonds Zeer Defensief / Defensief / Neutraal / Offensief / Zeer Offensief.De dividenduitkering van de mixfondsen hangt onder andere af van de dividenduitkeringen van de ASN Beleggingsfondsen. De mixfondsen beleggen namelijk hierin. Hoeveel dividend er precies wordt uitgekeerd, wordt bepaald door de fondsbeheerder en hangt onder andere af van het dividend dat de mixfondsen zelf ontvingen in 2023. ASN Biodiversiteitsfonds Het ASN Biodiversiteitsfonds is opgericht eind 2021. Het fonds is daardoor nog te nieuw om dividendinkomsten om uit te keren. Ook sloot het fonds 2023 af met een negatief jaarrendement. Het fonds had met name last van de dalende US dollar ten opzichte van de euro. Voor de lange termijn blijft de fondsbeheerder echter positief over de waardeontwikkeling van het biodiversiteitsfonds. https://www.afm.nl/eid ASN Groenprojectenfonds Het dividend van het ASN Groenprojectenfonds over 2023 is een positief, maar bescheiden bedrag geworden. Dit komt door een daling van de kapitaalmarktrente. Hierdoor ging de waardering van de leningen omhoog en steeg de afgiftekoers. Goed om te weten: de dividendbelasting geldt niet voor het ASN Groenprojectfonds. https://www.afm.nl/eid ASN Microkredietfonds Het resultaat van ASN Microkredietfonds was in 2023 positief. Dit komt vooral door de rente-inkomsten van de leningenportefeuille. De financiële markten waren in 2023 rustiger dan het jaar ervoor. Het fonds had nog steeds last van valutaontwikkelingen, maar wel minder dan in 2022. https://www.afm.nl/eid Vragen over dividend Lees wat andere klanten ons vroegen over dividend. Met uiteraard de antwoorden. Naar de vragen Beleggen voor de lange termijn Lees meer over de kracht van beleggen voor de lange termijn. Meer weten"
