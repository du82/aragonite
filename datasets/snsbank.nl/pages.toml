title = "SNS Keuzehulp - SNS Bank"
description = "Benieuwd of beleggen iets voor jou is? Met onze keuzehulp kom je er in 3 vragen en slechts 1 minuut eenvoudig achter. Check de SNS Keuzehulp beleggen."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Keuzehulp beleggen: Ontdek of het bij je pastBen jij benieuwd of beleggen bij jouw wensen past? Met onze handige keuzehulp ontdek je het met 3 eenvoudige vragen. Je ziet ook gelijk welke vorm van beleggen bij SNS bij jouw antwoorden past. De keuzehulp mag niet worden aangemerkt als beleggingsadvies. Keuzehulp beleggen Vraag 1. Wil je beleggen of speculeren? Met beleggen op de lange termijn verhoog je je kans op een goed rendement. Met ‘lange termijn’ bedoelen we 3 jaar of langer. Kies je voor speculeren, zoals crypto’s en opties? Dan wil je vaak op korte termijn kans maken op een hoog rendement, maar neem je ook veel risico. Ik kies voor lange termijn beleggen. Ik kies voor korte termijn speculeren. Bij ons vind je geen beleggingsvorm om te speculeren. Kies je voor beleggen bij ons, dan kies je voor duurzaam beleggen in een beleggingsfonds. Met ‘lange termijn’ bedoelen we 3 jaar of langer. Vraag 2. Het is verstandig om te beleggen met geld dat je voor langere tijd kunt missen. Heb je geld ‘over’ om te beleggen? We kunnen het niet mooier maken dan het is: je geld beleggen zonder risico bestaat niet. Beleg daarom met geld dat je langere tijd kunt missen. Met een goede spaarbuffer hoef je bij koersdalingen je beleggingen niet te verkopen, kun je het de tijd geven om te groeien, en vergroot je de kans op een goed rendement. Heb je je geld waarschijnlijk binnen 3 jaar nodig, dan kan sparen een beter alternatief zijn. Ik heb geld vrij beschikbaar voor 3 jaar of langer. Ik heb mogelijk mijn geld binnen 3 jaar nodig. Het zou goed kunnen dat sparen beter bij jou past dan beleggen. Lees meer over de afweging tussen sparen of beleggen. Vraag 3.Wil je in één mixfonds beleggen of meerdere fondsen kunnen combineren? Bij SNS kun je kiezen uit twee beleggingsproducten: SNS Doelbeleggen of de SNS Beleggingsrekening. Bij SNS Doelbeleggen kies je voor één van de vijf mixfondsen waarin je gespreid belegt. Kies je voor de SNS Beleggingsrekening? Dan kun je zelf combineren tussen onze mix- en themafondsen. Ik wil in één mixfonds beleggen Ik wil zelf fondsen kunnen combineren Dit past bij jouw antwoorden: SNS Beleggingsrekening Met de SNS Beleggingsrekening beleg je in 1 of meerdere van onze duurzame fondsen. Je kunt hier zelf combineren tussen mixfondsen en themafondsen. Dit doe je op basis van wat jij belangrijk vindt, je gewenste rendement en het risico dat bij je wensen past. Beleggen in één of meerdere van onze duurzame fondsen. Je kunt zelf fondsen combineren. Geen minimale of maximale inleg, jij bepaalt. Periodiek beleggen of inleggen wanneer het jou uitkomt. 24/7 inzicht in jouw beleggingen via Mijn SNS en de App Dit past bij jouw antwoorden: SNS Doelbeleggen Met SNS Doelbeleggen kies je uit een van onze 5 duurzame mixfondsen. De fondsen variëren van zeer defensief tot zeer offensief. Beleggen in één van onze vijf duurzame mixfondsen. Geen minimale of maximale inleg, jij bepaalt Periodiek beleggen of inleggen wanneer het jou uitkomt. Handige doelplanner waar je eenvoudig je doelbedrag, maandbedrag of fonds aanpast 24/7 inzicht in je rendement via Mijn SNS en de App Mogelijk rendement berekenen Weten wat beleggen kan opleveren? Bereken het mogelijk rendement van beleggen en welke inleg je daarvoor nodig hebt. Rendement berekenen Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
