title = "Beleggen voor je kind met een beleggingsrekening van SNS - SNS Bank"
description = "Geef je kind een goede financiële start en ontdek de voordelen van sparen én beleggen."
full_description = '''Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Beleggen voor je kind in 't kort Jij bepaalt of je op eigen naam of op naam van je kind belegt.Je belegt in 1 van de 5 duurzame Mixfondsen.Handig: de fondsbeheerder zorgt voor een goede spreiding binnen je gekozen fonds. Waarom beleggen voor je kind?Sparen is nog altijd een veilige manier om geld opzij te zetten. Maar kies je alleen voor sparen? Dan kan je geld door de inflatie en lagere spaarrente uiteindelijk minder waard worden. Met beleggen voor je kind kan het verwachte rendement hoger zijn dan bij sparen. Door te sparen én beleggen, profiteer je dus van de zekerheid van sparen en kun je tegelijkertijd naar een mooi bedrag toewerken. Zeker als je voor een langere periode periodiek kunt beleggen. Zo kun je je kind later een vliegende start geven, bijvoorbeeld voor rijlessen, studie of een mooie reis. Juist daarom kiezen steeds meer ouders voor de combinatie van sparen en beleggen. Goed om te weten: ook als je nog geen klant bij ons bent, kun je een beleggingsrekening bij SNS openen. Beleggen voor de lange termijn Het is slim om te beginnen met beleggen als je kind nog jong is. Dan geef je je inleg tijd om te groeien, ook als het even een minder goed beursjaar is. Je kunt dan bijvoorbeeld ook een paar jaar voordat je het geld wilt gebruiken minder risicovol gaan beleggen of overstappen op sparen. Oeps! Geen video Je kunt de video over dit onderwerp niet kijken omdat je een vereiste cookie hebt uitgeschakeld. Toch zien? Kies een andere cookie-instelling Of kijk deze video op youtube.com document.querySelectorAll(".openYoutube").forEach((element)=> { element.addEventListener("click", ()=> { window.open('https://www.youtube.com/embed/k1epkmMtAHg?rel=0&showinfo=1&controls=1&modestbranding=1&enablejsapi=1&autoplay=0', '_blank', 'noopener'); return false; }); }) Wat kan beleggen voor je kind opleveren? Bron: Ortec finance Uitleg over de resultaten Met beleggen loop je risico en maak je kosten. Je kunt je inleg of een deel daarvan verliezen. De waarde van uw beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Het verwachte rendement Je ziet in de rekentool wat het verwachte rendement én risico is van het gekozen beleggingsfonds voor een gemiddeld, goed en slecht jaar. Ook de verwachte rendementen voor sparen staan erbij als je hebt gekozen om (met een deel) van je inleg te sparen.De duurzame mixfondsen verschillen van ‘zeer defensief’ tot ‘zeer offensief’. Bij een zeer offensief fonds, is het gemiddelde verwachte rendement hoog. Maar de verschillen tussen slechte en goede jaren zijn ook groter. Beleg je een langere periode? Dan heb je langer de tijd om een slecht jaar te compenseren. En om dichter bij je verwachte rendement per jaar uit te komen. Meer over de scenario's In de grafiek zie je het verwachte resultaat bij verschillende scenario’s als je belegt. We rekenen met 3 scenario’s: Slecht: dit is het verwachte resultaat bij een slecht scenario. Je hebt ongeveer 10% kans op een lager eindbedrag. Gemiddeld: dit is het verwachte resultaat bij een gemiddeld scenario. Je hebt ongeveer 50% kans op een hoger of een lager eindbedrag. Goed: dit is het verwachte resultaat bij een goed scenario. Je hebt ongeveer 10% kans op een hoger eindbedrag. Wie berekent de verwachte resultaten? De verschillende scenario’s in de grafiek zijn berekend door Ortec Finance. Deze internationale organisatie is gespecialiseerd in het meten en beheren van risico's en rendementen op het gebied van vermogensbeheer. Bij de berekeningen neemt Ortec Finance ook de historische rendementen mee. Daarnaast kijkt de organisatie naar de uitkomsten van verschillende economische scenario’s en schat daarmee toekomstige ontwikkelingen in. Risico's van beleggen Beleggen zonder risico bestaat niet. Ga je beleggen? Zorg er dan voor dat je eerst de risico’s goed begrijpt. Goed om te weten De rekentool is bedoeld als hulpmiddel, het is geen beleggingsadvies. De uitkomst is met zorg samengesteld en gebaseerd op betrouwbare informatiebronnen, maar is geen garantie voor de juistheid of volledigheid van de informatie. Aan de uitkomsten van de tool kunnen geen rechten worden ontleend. Zo werkt beleggen voor je kindBeleggen voor je kind kan met SNS Doelbeleggen. Dat is een beleggingsrekening waarmee je belegt in een van de 5 duurzame mixfondsen. Mixfondsen zijn beleggingsfondsen waarmee je belegt in zowel aandelen als in obligaties. Elk mixfonds van SNS Doelbeleggen heeft een eigen verhouding tussen risico en rendement, jij kiest in welk mixfonds je wilt beleggen.Het gemak van een fondsbeheerderEen beleggingsfonds kan beleggen in meer dan honderd verschillende bedrijven over de hele wereld. En heeft een bedrijf een tegenvaller? Dan heb je ook nog beleggingen in andere bedrijven. Bij ons beleg je via een actieve fondsbeheerder. Deze expert zorgt voor een goede verdeling binnen het beleggingsfonds, . Lekker makkelijk, dan hoef je dat niet zelf te doen.Jij bepaalt je inlegMet SNS Doelbeleggen bepaal je zelf hoeveel en hoe vaak je wilt inleggen. Wil je er niet steeds zelf aan hoeven denken? Dan kun je periodiek inleggen. Je koopt dan automatisch en op een vast moment fondsen aan. En komt het een keer niet uit, dan kun je je periodieke inleg tijdelijk pauzeren. Meer weten over hoe doelbeleggen werkt?Beleggen op naam van je kind of op eigen naam?Je kiest zelf of je de beleggingsrekening op naam van je kind opent of op je eigen naam: Op eigen naam Jij beheert de rekening en bepaalt wat er met het geld gebeurt, ook als je kind 18 wordt.Je inleg wordt niet gezien als schenking, je hoeft hier dus geen schenkingsbelasting over te balen.Je kunt het opgebouwde vermogen in delen of in 1 keer schenken aan je kind. Tot een bepaald bedrag kan dit belastingvrij. Meer weten Op naam van je kind Na de 18e verjaardag staat de rekening op naam van je kind en heb jij er geen zeggenschap meer over.Je inleg telt als schenking. Je kunt hierbij wel gebruik maken van de jaarlijkse schenkingsvrijstelling.Met beleggen op naam van je kind hoef je geen schenkingsbelasting te betalen als het opgebouwde bedrag naar je kind gaat. Meer weten Goed om te weten: Of je nou op eigen naam of op naam van je kind belegt, je betaalt als ouder altijd vermogensrendementsheffing over het opgebouwde bedrag. Beleg je voor het eerst bij ons?Heb je nog geen ervaring met beleggen bij ons? Geen zorgen, nadat je SNS Doelbeleggen hebt geopend, leggen we je precies uit hoe je rekening werkt. Bijvoorbeeld hoe je je eerste fonds aankoopt. Belastingvrij schenken aan je (klein)kindDe precieze schenkingsregelingen vind je op belastingdienst.nl en kunnen elk jaar veranderen. In 2023 kunnen ouders samen tot € 6.035 belastingvrij schenken aan hun kind. Goed om te weten: Ook opa's en oma's kunnen elk jaar belastingvrij schenken aan kleinkinderen. In 2023 kan dit tot € 2.418. Veelgestelde vragen over beleggen op naam van je kindHeb je nog vragen over beleggen voor je kind? We geven antwoord op de meest gestelde vragen over dit onderwerp, denk bijvoorbeeld aan:Wat moet ik allemaal regelen als ik ga beleggen voor mijn kind?Hoe werkt het met de belasting en de beleggingen voor mijn kind?Wat als mijn kind bijna 18 is, maar misschien nog niet klaar is om met een groot bedrag om te gaan? Meer weten Wat betaal je voor SNS Doelbeleggen?Voor SNS Doelbeleggen betaal je servicekosten aan ons en fondskosten aan de fondsbeheerder. De servicekosten zijn 0,3% per jaar. Fondskosten zijn doorlopende kosten die je betaalt aan de fondsbeheerder om voor jou te beleggen. Deze kosten zijn verwerkt in de koers van het fonds.Alle kosten van beleggen op een rijtjeVoor wie is SNS Doelbeleggen?Met SNS Doelbeleggen beleg je zelfstandig, zonder beleggingsadvies. Je weet dat je met beleggen risico loopt en dat je inleg meer of juist minder waard kan worden. Bij SNS Doelbeleggen kun je zelf bepalen welke verhouding tussen risico en rendement je wilt. Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips SNS Beleggingsrekening openen Kies uit een overzichtelijk aantal beleggingsfondsen, elk met een eigen thema. SNS Beleggingsrekening openen'''
