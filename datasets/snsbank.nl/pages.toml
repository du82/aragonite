luctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Nettorendement na aftrek van de kosten van het fonds t/m 31 juli 2024 Vanaf de start 10 jaar* 5 jaar* 3 jaar* Dit jaar Fonds 3,54% 8,06% 7,41% 1,83% 1,41% * Gemiddeld per jaar ** Benchmark: FTSE Environmental Technologies 100 Index RisicoBij het ASN Milieu- & Waterfonds hoort een bovengemiddeld risico. Het fonds belegt vooral in jonge ondernemingen die nieuwe technieken ontwikkelen. De koersen van deze ondernemingen schommelen vaak meer dan van bedrijven die al langer bestaan. Bovendien spreidt het fonds zijn beleggingen over een beperkt aantal sectoren. Bij een lagere spreiding hoort een hoger risico. KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan ons betaalt. Bekijk alle kosten Waarin belegt het ASN Milieu- en Waterfonds opgebouwd?Het ASN Milieu- en Waterfonds is een sectorfonds. Het belegt wereldwijd in aandelen van veelbelovende, beursgenoteerde bedrijven met een duidelijke focus: de ontwikkeling, productie en verkoop van technologieën en systemen die milieuproblemen helpen oplossen. De veelal jonge ondernemingen in het fonds investeren hun winst meestal in de ontwikkeling van nieuwe technologieën en keren hierdoor weinig of geen dividend uit. Een greep uit de bedrijven die zijn goedgekeurd voor het beleggingsuniversum van het ASN Milieu- en Waterfonds: RenewiASMLSignify FondsmanagementDe fondsbeheerder probeert op lange termijn (langer dan 5 jaar) een rendement te behalen dat vergelijkbaar is met de niet-duurzame benchmark. Op de kortere termijn kan het rendement afwijken van de benchmark, zowel positief als negatief. Dat komt doordat dit fonds alleen in bedrijven belegt die voldoen aan dan het duurzaamheidsbeleid van de fondsbeheerder ASN Impact Investors. Hierdoor is de samenstelling van de portefeuille soms anders dan die van de benchmark. Dit fonds is een subfonds van ASN Beleggingsfondsen UCITS N.V. Di