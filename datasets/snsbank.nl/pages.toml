["https://snsbank.nl/particulier/beleggen/beleggen-voor-beginners/waarin-beleg-je-bij-sns.html"]
title = "Waarin beleg je bij SNS? - SNS Bank"
description = "Waarin beleg je als je via SNS belegt? We laten je kennismaken met een paar bedrijven waarin belegd mag worden volgens ons duurzaamheidsbeleid."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Je belegt niet zomaar in bedrijven bij SNSBeleg je bij SNS? Dan beleg je in bedrijven die moeten voldoen aan het duurzaamheidsbeleid van onze fondsbeheerder ASN Impact InvestorsDit betekent dat er niet belegd mag worden in wapens, fossiele brandstoffen en bont. Ook bedrijven waarbij er vermoedens van kinderarbeid of schending van mensenrechten zijn, worden afgekeurd. Zo wegen een goed personeelsbeleid, gedragscodes en een eerlijke beloning zwaar mee in de beoordeling. De bedrijven worden elke 4 jaar opnieuw gecheckt door onze duurzaamheidsonderzoekers. Benieuwd naar bedrijven die door onze duurzaamheidsonderzoekers zijn goedgekeurd om in te beleggen? We lichten er een aantal voor je toe. ASML Holding N.V. ASML ontwikkelt, produceert en verkoopt apparatuur voor de productie van halfgeleiders. Met een marktaandeel van 85% in de lithografie is ASML een grote speler. ASML heeft haar hoofdkantoor in Nederland en productievestigingen in Nederland, de Verenigde Staten en Taiwan. Een van de redenen om ASML goed te keuren, is het ethiekprogramma om ethisch gedrag te bevorderen en medewerkers daarin op te leiden. Het bedrijf hecht veel waarde aan de gedragscode en duurzame doelstellingen. Zo koppelt ASML de beloningen van bestuursleden aan de duurzaamheidsprestaties van het bedrijf JCDecaux Op elk vliegveld, metrostation, bushalte en stadscentrum kom je ze tegen: de buitenreclamezuilen van JCDecaux. Het Franse bedrijf JCDecaux is in 1964 opgericht en wordt nog steeds geleid door de zoons van oprichter Jean-Claude Decaux. Inmiddels zijn de buitenreclamezuilen van JCDecaux te vinden in wel 75 landen, verspreid over 5 continenten. Een belangrijke pro is het uitgebreide mensenrechtenbeleid van het bedrijf. Zo hechten ze veel waarde aan vakbondsvrijheid, en hanteren ze een verbod op kinderarbeid, dwangarbeid en discriminatie. De ethische commissie van JCDecaux ziet erop toe dat gevoelige vormen van advertenties die het bedrijf plaatst voldoen aan wetten en ethische regels. Ook hecht het bedrijf veel waarde aan het milieu. LG Electronics LG Electronics is het vlaggenschip van de LG Groep, een van de grootste bedrijven ter wereld. Met wereldwijd 75 dochterondernemingen die televisies, huishoudelijke apparaten en telecommunicatieapparaten ontwerpen en fabriceren.LG Electronics heeft een duidelijk beleid om ethisch handelen te bevorderen en corruptie tegen te gaan. Het bedrijf voert actief beleid tegen kinderarbeid, dwangarbeid en discriminatie. Ook wil LG Electronics conflictgrondstoffen uitbannen. Dat zijn grondstoffen waarvan de handel en verkoop bijdraagt aan gewapende conflicten. Denk aan tropisch hardhout, kobalt, diamanten en coltan. Die laatste wordt veel gebruikt in onder meer mobiele telefoons. Natura HoldingBij de naam Natura Holding gaat er misschien niet direct een belletje rinkelen. Maar dit Braziliaanse cosmeticabedrijf is bekend van merken als The Body Shop en Aesop. Natura Holding past prima in het rijtje ‘goedgekeurd voor belegging’ van ASN Impact Investors. Onder andere omdat alle producten van uitsluitend natuurlijke ingrediënten zijn gemaakt. Natura maakt bovendien geen gebruik van dierproeven. Het gebruikt geen fossiele olie en dierlijke ingrediënten. De palmolie uit de producten komt van een plantage waar slechts 35% is beplant met palmbomen. De rest wordt gebruikt om het ecosysteem in stand te houden. Een goed voorbeeld van een duurzame belegging dus.Tot slot heeft Natura heldere gedragsregels: omkoping, fraude en corruptie zijn niet toegestaan. Ze voeren actief beleid tegen kinderarbeid, gedwongen arbeid en discriminatie. Unilever Het wereldwijd bekende merk Unilever is vooral bekend van merken als Lipton, Knorr, Unox, Dove, Axe, OMO, Andrélon, Blue Band, Ben & Jerry’s en Conimex. Unilever heeft een aantal belangrijke doelstellingen waardoor er in dit bedrijf belegd mag worden door ASN Impact Investors. Zo is een van hun doelen om meer dan een miljard mensen te helpen hun gezondheid en welzijn te verbeteren. Bovendien voert Unilever actief beleid over zaken als kinderarbeid, gedwongen arbeid, vakbondsvrijheid, anti-discriminatie en landrechten.Meer weten?Ben je benieuwd naar de volledige lijst van bedrijven en landen waarin belegd mag worden volgens het duurzaamheidsbeleid van ASN Impact Investors? Bekijk dan de beleggingsuniversa van ASN Impact Investors of Lees meer over duurzaam beleggen Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
