description = "Met het ASN Duurzaam Mixfonds Neutraal ga je voor een gemiddeld rendement. Je bent bereid hier een gemiddeld beleggingsrisico voor te nemen."
full_description = "Het ASN Duurzaam Mixfonds Neutraal in ’t kortJe gaat voor een gemiddeld rendement en je begrijpt dat je hiermee een gemiddeld beleggingsrisico looptJe belegt vooral in aandelen en obligaties, en slechts een klein deel in microkredietenProfiteer van de kennis en ervaring van de fondsbeheerders. Wanneer kiezen voor ASN Duurzaam Mixfonds Neutraal?Met een neutraal fonds ga je voor een gemiddeld rendement, en je bent bereid daarvoor een gemiddeld beleggingsrisico te lopen. Dus wil je vermogen opbouwen op de langere termijn, maar wil je daarvoor geen bovengemiddeld risico lopen? Dan kun je kiezen voor het ASN Duurzaam Mixfonds Neutraal. Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 63,13*Beleg in dit fonds Bekijk fondsdocumenten Goed om te weten: Welk fonds je ook kiest, je geld wordt via SNS altijd duurzaam belegd. Het gaat dus niet naar bedrijven die handelen in bijvoorbeeld wapens of fossiele brandstoffen.*Dit is de meest recente afgiftekoers van het fonds die bij ons bekend is. Is er een nieuwe afgiftekoers beschikbaar? Dan updaten we de koers hier ook. Dat is elke beursdag rond 10.30 uur. Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 3 Jaar 5 Jaar 10 Jaar 1 Maand 3 Maand 1 Jaar 3 Jaar 5 Jaar 10 Jaar Bron: Infront Financial Technology In de afbeelding ‘Mogelijke rendementen’ zie je de verhouding tussen de verwachte rendementen en risico’s bij een goed, gemiddeld en slecht jaar. Deze verwachte rendementen zijn berekend door Ortec Finance.RisicoHet ASN Duurzaam Mixfonds Neutraal is een goed gespreid mixfonds met een gemiddeld risico. Het mixfonds streeft naar een goede verdeling tussen rendement en risico en zorgt voor een afgewogen spreiding.KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan ons betaalt. Bekijk alle kosten BeleggingsfondsrendementenNettorendement 3 jaar: 2,06%**Nettorendement 5 jaar: 2,95%** De getoonde nettorendementen zijn de gemiddelde rendementen per jaar per 31 juli 2024, na aftrek van de kosten van het fonds. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Mogelijke rendementen Extra uitleg berekening verwacht rendement De rendementen uit de bovenstaande grafiek zijn de verwachte nettorendementen in een gemiddeld, goed of slecht jaar na aftrek van fondskosten. Verwacht, omdat het werkelijke rendement anders kan zijn. Je kunt een rendement niet met zekerheid voorspellen. De ondergrens en bovengrens zijn dus ook niet gegarandeerd. De risico’s en rendementen zijn berekend door Ortec Finance. Er is in een willekeurig jaar een grote kans (80%) dat het rendement uitkomt tussen de grenzen van een goed en een slecht jaar. Maar het kan ook dat het rendement lager is dan wat je bij het slechte jaar ziet (10% kans). Deze berekening is gemaakt met gegevens die kunnen veranderen. Beleg je over een langere periode, dan kun je er langer over doen om een slecht jaar te compenseren. Zo is de kans groter dat je dichter bij het verwachte rendement per jaar uitkomt. Verhouding beleggingen binnen mixfonds Hoe is het fonds opgebouwd?Het mixfonds belegt vooral in aandelen en obligaties, en ook voor een klein deel in microkredieten. Hierbij worden bedrijven eerst geselecteerd op duurzaamheid en vervolgens op financiële vooruitzichten. Een greep uit de bedrijven die zijn goedgekeurd voor het beleggingsuniversum van het ASN Mixfonds Neutraal: Novo NordiskASMLBeiersdorf FondsmanagementDit fonds is een subfonds van ASN Beleggingsfondsen AIF N.V. Dit fonds wordt beheerd door ASN Beleggingsinstellingen Beheer B.V. (ABB). Lees ook de prospectus en bekijk de fondsinformatie op de website van ASN Impact Investors.De koers van het ASN Duurzaam Mixfonds Neutraal i