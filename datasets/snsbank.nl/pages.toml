title = "ASN Duurzaam Obligatiefonds - SNS Bank"
description = "Met het ASN Duurzaam Obligatiefonds streef je naar een gespreid obligatiefonds gevuld met overheden met een gezonde financiële huishouding."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Het ASN Duurzaam Obligatiefonds in 't kortJe gaat voor een gematigd rendement en neemt daarbij een beperkt beleggingsrisico.Het fonds spreidt je beleggingen grotendeels over obligaties van (semi-)overheden met een gezonde financiële huishouding.Je belegt dan in onder andere in obligaties die op een duurzame manier zorgen voor basisbehoeften zoals wonen, onderwijs en gezondheidszorg. Wanneer kiezen voor het ASN Duurzaam Obligatiefonds?Met een obligatiefonds kies je voor een beperkt beleggingsrisico en je accepteert dat je daarmee ook voor een gematigd rendement gaat.Beleg in dit fonds Bekijk fondsdocumenten https://www.afm.nl/eid Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 25,29**Dit is de meest recente afgiftekoers van het fonds die bij ons bekend is. Is er een nieuwe afgiftekoers beschikbaar? Dan updaten we de koers hier ook. Dat is elke beursdag rond 10:30. Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 3 Jaar 5 Jaar 10 Jaar 1 Maand 3 Maand 3 Jaar 1 Jaar 5 Jaar 10 Jaar Bron: Infront Financial Technology Rendement ASN Duurzaam ObligatiefondsNettorendement 3 jaar: -2,01 %**Nettorendement 5 jaar: -1,67 %**** Deze nettorendementen zijn de gemiddelde nettorendementen per jaar t/m 31 juli 2024, na aftrek van de kosten van het fonds.De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Nettorendement na aftrek van de kosten van het fonds t/m 31 juli 2024 Vanaf de start 10 jaar* 5 jaar* 3 jaar* Dit jaar Fonds 2,42% -0,36% -1,67% -2,01% -0,28% * Gemiddeld per jaar RendementDe fondsbeheerder heeft als doel voor dit fonds het realiseren van vermogensgroei op de lange termijn.RisicoJe loopt met dit obligatiefonds minder risico dan met een gemiddeld, wereldwijd obligatiefonds. Dat komt onder andere doordat de fondsbeheerder overheden beoordeelt op basis van de terugbetaalcapaciteit. Dat is de verhouding tussen de belastinginkomsten en de renteverplichtingen van een land. Je belegt daardoor niet veel in obligaties van landen met relatief veel schulden.KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan ons betaalt. Bekijk alle kosten Hoe is het fonds opgebouwd?Het obligatiefonds financiert (semi-)overheden die mensenrechten beschermen en een ambitieus klimaatbeleid voeren. Om de beleggingsdoelstellingen te halen, wordt er minstens 70% belegd in staatsobligaties en hooguit 30% in groene en sociale obligaties. De landen waarin het fonds belegt, worden elke 2 jaar opnieuw beoordeeld op hun duurzaamheid. FondsmanagementDit fonds is een subfonds van ASN Beleggingsfondsen AIF N.V. Dit fonds wordt beheerd door ASN Beleggingsinstellingen Beheer B.V. (ABB). De koers van het Duurzaam Obligatiefonds is afhankelijk van de waarde van de beleggingen binnen het fonds. Daardoor kan je belegging meer, maar ook minder waard worden. Lees ook de prospectus en bekijk de fondsinformatie op de website van ASN Impact Investors.Belangrijke documenten Lees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval het Essentiële-informatiedocument van de fondsen die je overweegt te kopen. Essentiële-informatiedocument ASN Duurzaam Obligatiefonds (pdf) 178,52 KB Factsheet ASN Duurzaam Obligatiefonds (pdf) 238,54 KB Maandupdate ASN Duurzaam ObligatiefondsBeleg in dit fondsBekijk en vergelijk alle themafondsenLiever een fonds met een ander risiconiveau, thema of samenstelling? Bekijk al onze beleggingsfondsen. Of vergelijk al onze fondsen eenvoudig met de Fondsvergelijker. Met deze handige tool vergelijk je eenvoudig de verschillende duurzame beleggingsfondsen, de bijbehorende risico’s en mogelijke rendementen. Fondsvergelijker Vergelijk het mogelijke rendement en risico per fonds. Naar de fondsvergelijker Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
