title = "ASN Groenprojectenfonds - SNS Bank"
description = "Met het ASN Groenprojectenfonds kies je voor een beperkt beleggingsrisico en ga je ook voor een gematigd verwacht rendement."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen.Het ASN Groenprojecten gaat vanaf 5 maart 2025 verder als het ASN Energie & Innovatiefonds met een andere beleggingsstrategie. De groen vrijstelling geldt daarom niet meer voor het belastingjaar 2026 maar nog wel voor het belastingjaar 2025. Dit geldt alleen voor participaties in het fonds die je bezat op 1 januari 2025. Het ASN Groenprojectenfonds in 't kortJe gaat voor een gematigd rendement en neemt daarbij een beperkt beleggingsrisico. Je draagt bij aan oplossingen voor een beter klimaat, milieu en natuur. Je belegt in groenprojecten die door de overheid zijn erkent. Hierdoor krijg je soms belastingvoordeel in box 3 Wanneer kiezen voor ASN Groenprojectenfonds?Wil je beleggen in groenprojecten die bijdragen aan de verbetering van het klimaat, het milieu en de natuur? Dan kun je kiezen voor het ASN Groenprojectenfonds. Je geld wordt belegd in groenprojecten die door de overheid zijn erkend, daardoor kun je in aanmerking komen voor box 3 belastingvoordeel. Met het ASN Groenprojectenfonds kies je voor een beperkt beleggingsrisico en je accepteert dat je daarmee ook voor een gematigd rendement gaat.Beleg in dit fonds Bekijk fondsdocumenten https://www.afm.nl/eid Step 1 $('.wmpform.hidden').prev().attr('style','display: none'); $('.wmpform.hidden').attr('style','display: none'); $('.wcbPanel .wmpform.hidden').attr('style','display: block'); Koers 28-02-2025 € 24,81**Dit is de laatste bekende afgiftekoers van het fonds. Zodra er een nieuwe afgiftekoers beschikbaar is (rond 10:30 op beursdagen) wordt deze koers geactualiseerd Rendement, risico en kosten Step 1 Rendementsontwikkeling (groei per €100) Getoonde periode: 1 Maand 3 Maanden 1 Jaar 3 Jaar 5 Jaar 10 Jaar 1 Maand 3 Maand 1 Jaar 3 Jaar 5 Jaar 10 Jaar Bron: Infront Financial Technology BeleggingsfondsrendementenNettorendement 3 jaar: 0,05%**Nettorendement 5 jaar: -0,21%** **De getoonde nettorendementen zijn de gemiddelde rendement per jaar per, na aftrek van de kosten van het fonds. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Nettorendement na aftrek van de kosten van het fonds t/m 31 juli 2024 Vanaf de start 10 jaar* 5 jaar* 3 jaar* Dit jaar Fonds 2,11% 0,07% -0,21% 0,05% 0,08% * Gemiddeld per jaar MSCI Europe Small Cap Total Return Net Index RendementHet rendement van dit fonds bestaat vooral uit de renteopbrengsten van leningen. De rentestand op de kapitaalmarkten heeft daarom invloed op de fondswaarde. Hoe langer de gemiddelde resterende looptijd van de leningen, hoe groter het renterisico. De gemiddelde looptijd van de leningen in de portefeuille is daarom 5 jaar.RisicoMet het ASN Groenprojectenfonds kies je voor een beperkt beleggingsrisico en je accepteert dat je daarmee ook voor een gematigd rendement gaat.BelastingvoordeelBoven een bepaald bedrag betaal je belasting over je beleggingen. Voor het ASN Groenprojectenfonds is er echter een extra vrijstelling. Ook heb je recht op extra heffingskorting. Voor fiscale partners geldt een dubbele vrijstelling. Let op: Op 1 januari 2025 wordt de vrijstelling voor groene beleggingen verlaagd naar € 26.312 per persoon. Lees meer over dit mogelijke belastingvoordeel op Belastingdienst.nl. KostenDe kosten van je belegging in het fonds bestaan uit de kosten van het fonds zelf en de servicekosten die je aan ons betaalt. Bekijk alle kosten Hoe is het fonds opgebouwdHet ASN Groenprojectenfonds leent geld aan groenprojecten die goedgekeurd zijn door de overheid. Dit zijn projecten van ondernemingen, overheden, instellingen en non-profit organisaties in Nederland en het buitenland. Het rendement bestaat voor een groot deel uit de renteopbrengsten van de leningen. Het fonds spreidt je geld over verschillende sectoren. Denk aan duurzaam bouwen, duurzame wind- en zonne-energie, en decentrale energievoorzieningen in ruim 125 erkende groenprojecten. Een greep uit de projecten die zijn goedgekeurd voor het ASN Groenprojectenfonds: Windpark Krammer B.V. ZuyderzonZonnepark Pv3 B.V. FondsmanagementDit fonds is een subfonds van ASN Beleggingsfondsen AIF N.V. Dit fonds wordt beheerd door ASN Impact Investors. Lees ook de prospectus en bekijk de fondsinformatie op de website van ASN Impact Investors.Soms tijdelijk geen aan- of verkopenHet ASN Groenprojectenfonds kan soms tijdelijk dichtgaan voor aan- en verkopen. Dat zit zo: er moet altijd voor 70% in groenprojecten belegd worden die door de overheid zijn goedgekeurd, anders kunnen beleggers geen gebruik maken van het fiscale voordeel. Er bestaan alleen niet heel veel van dit soort projecten. Als er te veel beleggers tegelijk instromen, kan het percentage onder de 70% komen. Er komt dan meer geld bij het fonds binnen dan dat er groene projecten zijn om in te investeren. Op zo’n moment gaat het fonds dus even dicht voor aankopen. Bij teveel uitstroom kan het fonds ook tijdelijk gesloten worden. Houd daar dus rekening mee als je dit fonds wilt aankopen. Belangrijke documenten Lees de belangrijke documenten voor je gaat beleggen. Als je de risico’s per fonds wilt vergelijken, lees dan in elk geval het Essentiële-informatiedocument van de fondsen die je overweegt te kopen. Essentiële-informatiedocument ASN Groenprojectenfonds (pdf) 175,91 KB Factsheet ASN Groenprojectenfonds (pdf) 133,98 KB Maandbericht ASN GroenprojectenfondsBekijk en vergelijk alle themafondsenLiever een fonds met een ander risiconiveau, thema of samenstelling? Bekijk al onze beleggingsfondsen. Of vergelijk al onze fondsen eenvoudig met de Fondsvergelijker. Met deze handige tool vergelijk je eenvoudig de verschillende duurzame beleggingsfondsen, de bijbehorende risico’s en mogelijke rendementen. Fondsvergelijker Vergelijk het mogelijke rendement en risico per fonds. Naar de fondsvergelijker Overzicht beleggingsfondsen Benieuwd naar onze andere beleggingsfondsen? Bekijk de fondsen"
