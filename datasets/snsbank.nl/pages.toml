full_description = "Voor jezelfJe bent meerderjarig en je opent een SNS Beleggingsrekening voor jezelf of op jouw naam voor je kind. Het is zo geregeld.Nu openen Voor ons samenJe deelt de SNS Beleggingsrekening met een mederekeninghouder. Jullie hebben allebei dezelfde rechten.Nu openen Voor een kindJe belegt op naam van je kind. Open SNS Beleggingsrekening en werk aan een vliegende start voor later.Nu openen Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. De SNS Beleggingsrekening in ’t kort Kies je voor de SNS Beleggingsrekening? Dan stel je zelf je portefeuille samen. De SNS Beleggingsrekening in een notendop: Stel zelf je beleggingen samen met ruime keuze uit duurzame themafondsen en mixfondsenGeen minimale inleg, je kunt al beleggen met een klein bedragJij kiest waarin je belegt, de fondsbeheerder zorgt voor een zo goed mogelijke spreiding binnen je gekozen fonds(en). Zo heb jij daar geen werk aan. Goed om te weten: Je hoeft geen betaalrekening bij ons te hebben om een SNS Beleggingsrekening te openen. Zo werkt SNS Beleggingsrekening Open je eigen beleggingsrekening Met een SNS beleggingsrekening open je een beleggingsrekening waarmee je fondsen kunt aan- en verkopen. Deze fondsen zie je terug in je portefeuille. Flexibel inleggen en opnemen Met een SNS beleggingsrekening kun je al beleggen met een klein bedrag. Jij kiest hoeveel, maar ook hoe vaak je wilt inleggen. Wil je er niet steeds zelf aan hoeven denken? Dan kun je periodiek inleggen. Je koopt dan automatisch en op een vast moment fondsen aan. Stel zelf je portefeuille samen Jij kiest zelf 1 of meer beleggingsfondsen waarin je wilt beleggen en stelt zo zelf je portefeuille samen. Je kunt kiezen uit de themafondsen maar ook uit de mixfondsen waarmee je zowel in aandelen als in obligaties belegt. Elk fonds heeft een eigen verhouding tussen risico en rendement, jij bepaalt welk risiconiveau bij je past en in welke fondsen je belegt. Gemak van een fondsbeheerder Je profiteert van de kennis en ervaring van de fondsbeheerders. Zij kiezen de bedrijven en overheden en zorgen voor een goede spreiding binnen hun fonds. Ook het handelen op de beurs laat je aan hen over. Lekker makkelijk, hoef jij dat niet zelf te doen. Voor jezelfJe bent meerderjarig en je opent een SNS Beleggingsrekening voor jezelf of op jouw naam voor je kind. Het is zo geregeld.Nu openen Voor ons samenJe deelt de SNS Beleggingsrekening met een mederekeninghouder. Jullie hebben allebei dezelfde rechten.Nu openen Voor een kindJe belegt op naam van je kind. Open SNS Beleggingsrekening en werk aan een vliegende start voor later.Nu openen Wat kan beleggen met een SNS Beleggingsrekening je opleveren? Uitleg over de berekening Benieuwd hoe de mogelijke resultaten zijn berekend? we leggen het je hier uit. De waarde van je beleggingen kan fluctueren. In het verleden behaalde resultaten bieden geen garantie voor de toekomst. Meer over de scenario's Bij de verwachte resultaten zie je de door jou gekozen mix tussen sparen en beleggen bij een scenario. We rekenen met 3 scenario’s:Slecht: dit is het verwachte resultaat bij een slecht scenario. Je hebt ongeveer 10% kans op een lager eindbedrag.Gemiddeld: dit is het verwachte resultaat bij een gemiddeld scenario. Je hebt ongeveer 50% kans op een hoger of een lager eindbedrag.Goed: dit is het verwachte resultaat bij een goed scenario. Je hebt ongeveer 10% kans op een hoger eindbedrag. Wie berekent de verwachte resultaten? De verschillende scenario’s in de grafiek zijn berekend door Ortec Finance. Deze internationale organisatie is gespecialiseerd in het meten en beheren van risico's en rendementen op het gebied van vermogensbeheer. Bij de berekeningen neemt Ortec Finance ook de historische rendementen mee. Daarnaast kijkt de organisatie naar de uitkomsten van verschillende economische scenario’s en schat daarmee toekomstige ontwikkelingen in. Risico's van beleggen Beleggen zonder risico bestaat niet. Ga je beleggen? Zorg er dan voor dat je eerst de risico’s goed begrijpt. Jij bepaalt zelf hoeveel risico je wilt nemen om kans te maken op een hoger rendement. Ook kun je ervoor kiezen om een deel van het bedrag op je SNS Beleggingsrekening rekening te sparen. Je kiest zelf het fonds dat bij jouw wensen past. Wat zijn de kosten van SNS Beleggingsrekening?Voor het aanhouden van SNS Beleggingsrekening betaal je niets. Wel betaal je servicekosten aan ons en fondskosten aan de fondsbeheerder.De servicekosten zijn 0,3% per jaar. Alle kosten van beleggen op een rijtje De SNS Beleggingsrekening is geschikt als: je zelfstandig zonder beleggingsadvies wil beleggen in duurzame beleggingsfondsen.je vermogen wil opbouwen en bereid bent om hier beleggingsrisico voor te lopen.je verschillende beleggingsfondsen wil combineren of zelf je beleggingsporteuille wil samenstellen.je minimaal 3 jaar je geld wil beleggen. De SNS Beleggingsrekening is niet geschikt als: Je geen beleggingsrisico wil lopen.Je wil beleggen met advies.Je wil beleggen met geld dat je mogelijk binnen 3 jaar nodig hebt.Je zelf je aandelen, obligaties, opties etc. wil aan- en verkopen op de beurs.Je geboren bent of (tijdelijk) in de Verenigde Staten woont. Je kunt dan geen SNS Beleggingsrekening openen. SNS Beleggingsrekening openenDe voorwaardenIn de voorwaarden lees je wat je van ons kunt verwachten. Maar ook wat wij van jou verwachten. Lees ze goed door voor je SNS Doelbeleggen aanvraagt.Heb je een concreet beleggingsdoel waar je naartoe wilt werken?Wil je liever beleggen op basis van risiconiveau en heb je een beleggingsdoel waar je naartoe wil werken? Bijvoorbeeld vervroegd pensioen, een mooie wereldreis of de toekomstige studie van je kind? Dan past SNS Doelbeleggen misschien beter bij je. Met SNS Doelbeleggen kun je namelijk gebruik maken van de handige doelplanner. Beleggen voor beginners Benieuwd naar beleggen, maar geen idee waar te beginnen? Bekijk onze tips. Bekijk de tips SNS Beleggingsrekening openen Kies uit een overzichtelijk aantal beleggingsfondsen, elk met een eigen thema. SNS Beleggingsrekening openen"
