title = "Banksparen bij SNS - SNS Bank"
description = "Heb je een bankspaarproduct en wil je overstappen naar SNS? Of wil je weten welke alternatieven er zijn voor banksparen?"
full_description = "Banksparen bij SNS Banksparen is sparen voor later op een geblokkeerde spaarrekening. Banksparen kun je gebruiken voor je aanvullend pensioen, voor het uitkeren van een gouden handdruk of voor de aflossing van je hypotheek 1. Banksparen voor je pensioenBij SNS kun je banksparen om je pensioen en/of AOW aan te vullen. Banksparen werkt over het algemeen in 2 fases. Je bouwt eerst een bedrag op op een geblokkeerde spaar- of beleggingsrekening. En dat laat je later periodiek uitkeren.Banksparen met SNS LijfrenteMet SNS Lijfrente kun je flexibel geld opzijzetten voor een aanvulling op je pensioen. Je kunt sparen met een variabele rente. Ook kun je (een deel van) je geld op een SNS Lijfrente Deposito zetten tegen een vaste looptijd en rente. Of je kiest ervoor (een deel) te beleggen.Meer over SNS Lijfrente Banksparen: uitkeren met SNS LijfrentenierenMet SNS Lijfrentenieren stort je eenmalig een bedrag op een geblokkeerde spaarrekening. Je kunt het bedrag storten wat je hebt opgebouwd met een lijfrente-opbouwproduct, zoals SNS Lijfrente. Maar het maakt niet uit of je dat bij SNS of bij een andere bank of verzekeraar hebt gedaan.Vanaf deze rekening krijg je vervolgens een maandelijkse uitkering als je met pensioen bent. Over de uitkeringen betaal je belasting. Over het bedrag dat nog niet is uitgekeerd, krijg je een vaste rente. Meer over SNS LijfrentenierenSNS Uitgesteld Lijfrentenieren (niet meer af te sluiten)SNS Uitgesteld Lijfrentenieren was een gecombineerde spaar- en uitkeringsrekening, maar deze kun je niet meer openen.Meer over SNS Uitgesteld Lijfrentenieren2. Banksparen bij ontslag SNS Gouden Handdruk (niet meer af te sluiten)Met SNS Gouden Handdruk kon je je ontslagvergoeding of gouden handdruk opzij zetten. Door veranderde wetgeving kun je SNS Gouden Handdruk niet meer afsluiten. Heb je al een SNS Gouden Handdruk? Dan kun je je geld gewoon laten staan tegen een variabele rente. Ook kun je (een deel van) je geld op een SNS Gouden Handdruk Deposito zetten tegen een vast looptijd en rente. Of je kiest ervoor (een deel) te beleggen.Meer over SNS Gouden HanddrukSNS Gouden Handdruk InkomenSNS Gouden Handdruk Inkomen is een geblokkeerde rekening waarmee je je ontslagvergoeding maandelijks laat uitkeren. Zo heb je een aanvulling op je inkomen of pensioen. Over het bedrag dat nog niet is uitgekeerd, krijg je een vaste rente. Over de uitkeringen betaal je belasting. SNS Gouden Handdruk Inkomen kun je alleen afsluiten als je ontslagvergoeding al op een SNS Gouden Handdruk staat of op een vergelijkbare rekening bij een andere aanbieder.Meer over SNS Gouden Handdruk Inkomen3. Banksparen met je hypotheekSNS Spaarhypotheek (niet meer af te sluiten)Met een bankspaarhypotheek spaar je voor je aflossing en heb je lage maandlasten. Sinds 2013 kun je geen nieuwe bankspaarhypotheek meer afsluiten. Als je al een bankspaarhypotheek hebt, kun je die gewoon laten doorlopen. Ook kun je het geld overdragen van een andere aanbieder naar SNS of andersom.Meer over de SNS SpaarhypotheekAdvies nodig?Heb je een bankspaarproduct en wil je overstappen naar SNS? Of wil je weten welke alternatieven er zijn voor banksparen? Vraag dan om een persoonlijk advies. We brengen je huidige financiële situatie en wensen in kaart. Ook leggen we uit hoe we werken en maken we afspraken over wat we voor je gaan doen. Een kennismakingsgesprek is gratis en vrijblijvend. SNS Adviseur Een SNS Adviseur adviseert je graag zodat jij de juiste keuze kunt maken. Dit kun je verwachten. Over advies Afspraak met een adviseur Wil je met iemand praten over sparen voor later? We kunnen je goed helpen en adviseren. Maak een afspraak"
