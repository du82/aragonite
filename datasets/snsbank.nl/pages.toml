title = "Beleggen en de belasting - SNS Bank"
description = "Als je veel geld belegd hebt, betaal je over een deel van je vermogen belasting. Dat heet vermogensrendementsheffing."
full_description = "Met beleggen loop je risico en maak je kosten. Je kunt je inleg (deels) verliezen. Beleggingen tellen mee als vermogenAls je in Nederland woont, telt geld op je spaar-, beleg- en betaalrekeningen mee als vermogen voor de inkomstenbelasting. Je vermogen valt in box 3 van de belasting. Uit je vermogen kun je bepaalde inkomsten halen, denk aan rendement en spaarrente. Komt je vermogen boven een bepaalde grens uit? Dan betaal je belasting. Dit heet vermogensrendementsheffing. Doe je over 2024 aangifte? Dan kijkt de Belastingdienst naar je vermogen op 1 januari 2024. Waarover betaal je belasting en hoeveel?Om je rendement te berekenen, kijkt de Belastingdienst naar je echte verdeling over sparen en beleggen. Per categorie gaat de Belastingdienst uit van een fictief rendementspercentage. Over het fictieve rendement op je beleggingen betaal je in 2024 36% belasting. Lees meer over de werking en de percentages op de website van de Belastingdienst . Goed om te weten: De Belastingdienst gaat bij spaargeld uit van een lager fictief rendement. Maar als je vóór 1 januari je beleggingen verkoopt en de opbrengst op een spaarrekening zet, zorgt dit er niet voor dat je minder vermogensrendementsheffing betaalt. Dat komt doordat de Belastingdienst over een langere periode kijkt hoe je je vermogen verdeeld hebt. Op de website van de Belastingdienst lees je hoe ze dit doen. Wat als je echte rendement lager is dan het fictieve rendement? Onlangs deed de hoge raad hier een uitspraak over. In dat geval moet de Belastingdienst je werkelijke rendement belasten, en niet het fictieve rendement. Als jij hiervoor in aanmerking komt, krijg je vanzelf een brief van de Belastingdienst waarin ze uitleggen wat je kunt en moet doen. Je leest er nu alvast meer over op de site van de Belastingdienst. Heffingvrij vermogenOver het 1e deel van je vermogen hoef je geen belasting te betalen. Dit is het heffingsvrij vermogen. Als je begin 2025 over 2024 aangifte doet, is het heffingsvrij vermogen € 57.000 voor iemand die alleenstaand is. Voor fiscaal partners is dat het dubbele: € 114.000. Goed om te weten: Bij het bepalen van je vermogen mag je van de Belastingdienst alleen schulden boven € 3.700 van je bezittingen aftrekken. Voor fiscaal partners is de grens € 7.400. Vermogen van minderjarige kinderen Minderjarige kinderen hoeven niet zelfstandig belasting af te dragen voor het vermogen in box 3. De waarde van hun vermogen wordt bij dat van hun ouder of ouders geteld. Dividendbelasting Krijg je dividend? Dan moet het beleggingsfonds van wie je dit krijgt, dividendbelasting inhouden. Soms kun je deze dividendbelasting verrekenen met je inkomstenbelasting. Dat doe je als je aangifte doet voor de inkomstenbelasting. Groene beleggingen en vrijstelling Voor groene beleggingen geldt een vrijstelling. Dat betekent dat je alleen belasting hoeft te betalen als de waarde van deze beleggingen boven een bepaald bedrag uitkomen. Je betaalt dan belasting over het verschil tussen het bedrag van de vrijstelling en de waarde van je groene beleggingen. Het ASN Groenprojectenfonds is een voorbeeld van zo’n groene belegging. Hieronder vind je in een tabel het overzicht van vrijstelling groene beleggingen zonder en met fiscaal partner. Jaar Zonder fiscale partner Met fiscale partner 2024 € 71.251 € 142.502 2023 € 65.072 € 130.144 2022 € 61.215 € 122.430 2021 € 60.429 € 120.858 Periodiek beleggen Met periodiek beleggen bepaal je zelf hoeveel je inlegt en wanneer. Lees meer over de kracht van periodiek beleggen. Meer weten Vragen over dividend Lees wat andere klanten ons vroegen over dividend. Met uiteraard de antwoorden. Naar de vragen"
