["https://soakedindreams.com/2022/06/11/review-the-gunpowder-plot"]
title = "Review: The Gunpowder Plot – Soaked in Dreams"
description = "Style: Museum-led promenadeWhere: Tower Vaults, Tower of LondonBooking: https://gunpowderimmersive.com/ Rating: 3/5 stars There is much promise to The Gunpowder Plot, but as yet, much of it remains unfulfilled. As a lover of immersive theatre, this was not nearly as interactive as I felt it was sold as. It ressembles most the immerisve War of the Worlds -…"
full_description = "Review: The Gunpowder Plot emmaburnell758 Uncategorized June 11, 2022 1 Minute Style: Museum-led promenadeWhere: Tower Vaults, Tower of LondonBooking: https://gunpowderimmersive.com/ Rating: 3/5 stars There is much promise to The Gunpowder Plot, but as yet, much of it remains unfulfilled. As a lover of immersive theatre, this was not nearly as interactive as I felt it was sold as. It ressembles most the immerisve War of the Worlds – which was a great experience but wasn’t marketed as something you could have a great deal of influence over. Here you are told you will be involved in foiling (or perhaps furthering) the gunpowder plot. But the choices you make are minimal and don’t really seem to much afffect the outcome. In choosing to have a famous actor (Tom Felton) ‘play’ Guy Fawkes, they have also made the final live action scenes feel really quite weird in ways I can’t really explain without spoiling them. Overall the acting of the show is good and the cast guide you well through the experience. And that is what it is – it is an experience, not an immersive theatre show. Judged on those criteria, it is reasonably fun and I expect it comes as a really fun addition to a day out at the Tower of London. It’s isn’t designed for immersive snobs like me. But were my nephew and neiece a little younger I culd imagine this being an enormously fun way to engage with learning about an important period of our history. The final problem with the show is that, like so many other things like it, the VR just doesn’t work very well. I had trouble with two out of the three VR experiences. I am continually surprised that big shows like this opt to rely so much on this seemingly still deeply unreliable technology. Overall, I had fun. But ironically, I wasn’t blown away. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f59a6ae48', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f59a6af1d', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related Published by emmaburnell758 View all posts by emmaburnell758 Published June 11, 2022"
