title = "About Us - The Sociable"
description = "Brains Byte Back interviews startups, entrepreneurs, and industry leaders that tap into how our brains work. We explore how knowledge & technology intersect to build a better, more sustainable future for humanity. If you’re interested in ideas that push the needle, and future-proofing yourself for the new information age, join us every Friday. Brains Byte Back guests include founders, CEOs, and other influential individuals making a big difference in society, with past guest speakers such as New York Times journalists, MIT Professors, and C-suite executives of Fortune 500 companies."
full_description = "2 Government and Policy Blair Institute gives blueprint for a digital ID-linked National Data Library... About Us The Sociable, dissecting technology’s relationship with society. The Sociable is a technology news publication that picks apart how technology transforms society and vice versa. We delve deep into how technology is used by governments, businesses, and citizens of the world while analyzing its ethical, social, and philosophical implications. Our mission is to discern truths, wherever they lie. We not only inform what is being done with technology but to empower a conscious and curious public by showing how and why technology is being implemented and whether these policies align with the values of a free society. “What is eternal is circular, and what is circular is eternal.” – Aristotle The Sociable was founded by Darren McCarra and Piers Scott in September 2010. It quickly became one of the most popular technology websites in Ireland, winning the Best Technology Site at the 2012 Irish Web Awards and Best Technology Blog at the 2013 Blog Awards Ireland. Today, the publication is headed by Editor Tim Hinchliffe and has expanded to include coverage of technology-related issues in the United States and across the globe. For more information please visit our Contact Page. Sociable's Podcast Brains Byte BackBrains Byte Back interviews startups, entrepreneurs, and industry leaders that tap into how our brains work. We explore how knowledge & technology intersect to build a better, more sustainable future for humanity. If you’re interested in ideas that push the needle, and future-proofing yourself for the new information age, join us every Friday. Brains Byte Back guests include founders, CEOs, and other influential individuals making a big difference in society, with past guest speakers such as New York Times journalists, MIT Professors, and C-suite executives of Fortune 500 companies. The Unintended Consequences of AI: Are Marketers Relying Too Much on It?byThe SociableIt’s really hard to think of an industry out there that doesn't leverage AI. For marketers, it’s become a revolutionary tool that cuts cost, increases productivity, and uses data to enhance personalization. But we’re not here to talk about why it’s great. There are thousands of articles online that will do that for you. Instead, in this episode of Brain Byte Back we shift gears today and ask: Is it possible for marketers to overuse AI? And if so, what are the results? Basically, can AI be “too much of a good thing”?We sit down with marketing expert Usman Amjad to explore the unintended consequences of AI in marketing. We dive into the risks of over-relying on AI-generated content, how SEO is shifting in response to AI-driven searches, and whether hyper-personalized ads are getting a little too good at knowing what we want. If you’re currently using AI as a marketing tool for your business, this one’s for you.Find out more about Usman Amjad hereBrains Byte Back:Reach out to today's host, Erick Espinosa (Linkedin) – linkedin.com/in/erick-espinosaGet the latest on tech news – https://sociable.co/ Leave an iTunes review – https://rb.gy/ampk26Follow us on your favourite podcast platform: https://link.chtbl.com/rN3x4ecYSearch EpisodesClear Search The Unintended Consequences of AI: Are Marketers Relying Too Much on It? March 5, 2025 The Sociable Relief Through Innovation: The Young Inventor Changing Lives January 15, 2025 The Sociable Over-Tourism Reimagined: How Regenerative Travel Can Address Today’s Environmental Challenges December 2, 2024 The Sociable Prioritizing Time to Grieve Over Paperwork: How Ribbon is Streamlining the Inheritance Process October 29, 2024 The Sociable The Vacation He Couldn’t Return Home From: A Venezuelan CEO’s Inspiring Journey to Growth Hacking Success October 8, 2024 The Sociable Wearable Tech That Measures Product Effects: The AI Neurotech Company Revolutionizing Product Testing September 19, 2024 The Sociable