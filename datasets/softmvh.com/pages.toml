title = "Garanti ve İptal İade Koşulları"
description = "SoftMvh üzerinden satın aldığınız ürünlerin garanti sürelerini,ayrıca iptal ve iade koşullarını öğrenebileceğiniz sayfa."
full_description = "Tüm ürünler aksi belirtilmediği sürece, üretici firmaların garantisi altındadır. Garanti koşullarının geçerli olabilmesi için kargo teslimatı esnasında ürünü mutlaka kontrol ediniz. Herhangi bir hasar gördüğünüzde kargo görevlisine tutanak tutturarak ürünü teslim almayınız. Ürün üzerinde yapılan değişiklikler, ürünün deforme olması ya da ürünün orijinal dizayn / kutu veya ambalajının bozulması garanti kapsamı dışındadır. ALICI,Soft Mvh ‘dan satın alacağı ürünlerin kendisine veya gösterdiği adresteki kişi/kuruluşa tesliminden itibaren 7 gün içinde cayma hakkına sahiptir. Cayma hakkının kullanılması için bu süre içinde SATICI’ya faks, email veya telefon ile bildirimde bulunulması ve ürünün kullanılmamış olması şarttır. Bu hakkın kullanılması halinde, 3. kişiye veya ALICI’ya teslim edilen ürünün SATICI’ya gönderildiğine ilişkin kargo teslim tutanağı örneği ile fatura aslının iadesi zorunludur. Bu belgelerin ulaşmasını takip eden 7 gün içinde ürün bedeli ALICI’ya iade edilir. Fatura aslı gönderilmez ise KDV ve varsa sair yasal yükümlülükler iade edilemez. Yazılım ürünlerinde Soft Mvh siparis ödemesi sonrasi tüketici haklari yasasi geregi herhangi bir sebep belirterek/belirtmeyerek cayma hakki kullanimina dolayisi ile lisans iptali ve ücret geri ödemesine tabi degildir. (Lisans alindiktan sonra cayma hakki kullanilamaz). Ilgili tüketici haklari yasasi maddesi (Cayma Hakki Madde 8): Elektronik ortamda aninda ifa edilen hizmetler ve tüketiciye aninda teslim edilen mallara iliskin sözlesmeler cayma hakki ve kullanimina iliskin hükümlere tabi degildir. Soft Mvh elektronik ortamda müsterilerimize teslim edilen bir hizmet/yazılım oldugu için fiziksel olarak iadesi mümkün degildir. Müsterilerimiz yazılıma bir kez sahip olduklarinda yazılımın kopyasini bilgimiz disinda saklayabilecekleri için fiziksel bir iade dolayisi ile cayma hakki söz konusu olamaz."
