full_description = "By These tuning guides were designed for people who are already familiar with the workload and are looking for system settings that will improve performance. They provide BIOS, operating system, and workload settings to get the most out of Intel platforms with server workloads. Developers and systems integrators can use them as a launching point for further tuning. 4th Gen Intel® Xeon® Scalable Processor and Intel® Xeon® CPU Max Series Tuning Guides PDF AI BERT-based AI inference with Intel® AMX Deep Learning Optimization Download Chinese Databases ClickHouse with Intel® IAA and Intel® AVX512 RocksDB Compression and Decompression with Intel® IAA SQL Server OLAP SQL Server OLTP HPC Intel® Xeon® CPU Max Series Tuning Guide Download Chinese Media Media Processing Basics Download Chinese Networking Open vSwitch with DPDK User Space Network Stack Acceleration with Intel ® DSA 3rd Gen Intel® Xeon® Processors Tuning Guides PDF AI Deep Learning Optimization Download English Download Chinese OpenVINO™ Download Data Analytics Apache Spark* Download Databases MongoDB* Download Open Source Database Tuning (MySQL, PostgreSQL) Download Redis* Download English Download Chinese RocksDB* Download English Download Chinese RocksDB* db_bench Download Microsoft* SQL Server Download HPC HPC Cluster Tuning Download Genomics Analytics Download NAMD Download LAMMPS Download Relion* Download Media Scalable Video / HEVC Transcode Download Data Compression Download Web-Tier NGINX* - Crypto Download English Download Chinese NGINX* - QAT Download English Download Chinese WordPress* Download Java* Developer Guide Download Virtualization Linux KVM* Download AI workloads TensorFlow* Maximize TensorFlow* Performance on CPU: Considerations and Recommendations for Inference Workloads Guide to TensorFlow* Runtime optimizations for CPU Getting Started with Intel® Optimization for MXNet* Code Sample: Intel® Deep Learning Boost New Deep Learning Instruction bfloat16 - Intrinsic Functions General Intel® Architecture tuning guides Intel Architecture Reference Manuals Automated SKU Selection for Intel® Xeon® Processors through Machine Learning Additional resources Technical Overview of the 4th Gen Intel® Xeon® Scalable processor family Build an Intel®-Based Cluster with OpenHPC* 2.0 on CentOS* 8 1"
