raphics The first generation of Intel® Arc™ graphics feature hardware-based ray tracing, AI-driven super sampling, and offer full support for Microsoft DirectX* 12 Ultimate. Learn More Intel® Core™ Processor Family This next-generation client architecture is Intel's first performance hybrid architecture that combines two core types: performance (P-cores) and efficiency (E-cores). Intel® Processor Graphics with Xᵉ-LP API Developer and Optimization Guide Deployment of AI Workloads in a Windows* Environment Intel® Data Center GPU Max Series Drive breakthrough acceleration for HPC and AI workloads with the combined power of Intel® Data Center GPU Max Series and Intel® Xeon® Scalable processors—powered by oneAPI and Intel® AI developer tools. Tools, Libraries, and AI Workflows Intel vPro® Platform for Business This integrated platform delivers the latest PC technologies in one validated solution and brings together performance, hardware-enhanced security features, modern remote manageability, and more. Explore Manageability and Security Development Game Development Create games faster using Intel® tools, libraries, and tutorials. Plus, learn how Intel collaborates with leading game and game engine developers to create spectacular new gaming experiences. Get Started Creators When you're in the creative flow, the last thing you want is to be distracted by technology issues. The best computers for creatives let you focus on achieving the colors, images, sounds, motion, and magic that bring your ideas to life. Explore Cloud to PC Get optimal performance for cloud-native applications—from bridging Windows and Linux* for AI development to progressive web applications. Latest on Web Application Development Technical Resources & Documentation Browse our top resources to help you develop for Windows, Chrome OS*, Linux, and Android*. Technical Library INTEL = window.INTEL || {}; INTEL.I18n = window.INTEL.I18n ||{}; INTEL.I18n["category_grdc.technicallibrary.detailsLabel"] = "Detai