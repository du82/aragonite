 unit (SKU) code at the self-checkout station. Loss Prevention Retail Reference Implementation This reference implementation recognizes SKU codes based on the object, text, and barcode, which you can use to validate the product to reduce the probability of theft at checkout. Get Started SOFTWARE SAMPLE AI Connect for Scientific Data AI Connect for Scientific Data (AiCSD) is an open source software sample that connects data from scientific instruments to applicable AI pipelines and runs workloads at the network edge. With this software sample, you can automate AI capabilities for scientific data to deliver faster insights, connect machine learning models and pipelines from their training environment to the edge, and integrate AI pipelines into edge computing solutions. Learn More RESOURCE Industrial Automation Explore reference implementations, learn about the tools, and see the developer kits that enable vision capabilities for industrial automation. See All All Tools Quickly deploy your AI and machine learning applications at the edge for various markets using Intel tools and libraries. Explore Be Part of the Community Join this expanding community of over three million developers who are driving innovation at the edge. Learn More window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Learn Access webinars, videos, and courses that demonstrate the use of Intel technologies for edge solutions. See All Latest Resources View All INTEL = window.INTEL || {}; INTEL.I18n = window.INTEL.I18n ||{}; INTEL.I18n["category_components.contenttable.archivedLabel"] = "Archived"; INTEL.I18n["category_components.contenttable.lddTooltip"] = "This material is tailored for a tech savvy audience and therefore is not suitable for end user messaging. Each slide must include the label \u2018Limited Distribution \u2013 not for End Users\u2018"; INTEL.I18n["category_components.contenttable.documentNumber"] = "Content ID"; INTEL.I18n["c