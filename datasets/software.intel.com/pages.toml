["https://software.intel.com/content/www/us/en/developer/learn/overview.html"]
title = "Developer Training"
description = """
Intel® Rendering Toolkit (Render Kit) Essentials 
Learn the basis of Render Kit components that include Intel® OSPRay, Intel® Embree, Intel® Open Volume Kernel Library, Intel® Open Image Denoise, and Intel® OSPRay Studio."""
full_description = 'Learn Programs Tools Documentation Learn Topics & Technologies Community & Events Get Help Developer Training Live workshops, on-demand training, code walkthroughs, and more. Intel® Rendering Toolkit (Render Kit) Essentials Learn the basis of Render Kit components that include Intel® OSPRay, Intel® Embree, Intel® Open Volume Kernel Library, Intel® Open Image Denoise, and Intel® OSPRay Studio. Intel® oneAPI Training Gain mastery with toolkit trainings, code walkthroughs, and optimization materials. Explore the complete catalog. Essentials of SYCL* Learning Plans and Paths Learn programming in heterogeneous environments where CPUs, GPUs, field-programmable gate arrays (FPGAs), and accelerators can work together or in isolation. Intel® OSPRay Essentials Learning Plans and Paths Use the Intel OSPRay renderer and API to create high-fidelity, photorealistic images and scenes using simple geometries. OpenMP* Offload Basics Learning Plans and Paths Use these offload directives to target GPUs through hands-on practice in this guided-learning path. Intel® DPC++ Compatibility Tool How-To Training Learn how to migrate your CUDA* program to DPC++. Intel® oneAPI Math Kernel Library Essentials Learning Plans and Paths Learn key functions of this popular library to create performant applications and speed up computations using low-level math routines. oneAPI Basics Training Series How-To Training Learn the basics of oneAPI in this ongoing series of YouTube* videos. Intel® oneAPI Academic Program Access materials for research and student ambassadors. Featured IoT & Edge Training Explore a sampling of the many courses available. See all IoT and edge training. Intel® Distribution of OpenVINO™ Toolkit On-Demand Training Explore capabilities, key components, and features through this self-paced foundation course. Self-Paced Training for the OpenVINO™ Toolkit On-Demand Training Developers can learn how to create AI applications with the OpenVINO™ toolkit. Intel® Edge AI Fundamentals On-Demand Training Advance your deep learning and computer vision skills with edge AI in this month-long free course from Udacity*. Intel® Edge Insights for Industrial On-Demand Training Learn to deploy Intel® Edge Insights for Industrial by exploring its features, key components, and installation through this self-paced course. Develop Deep Learning Applications On-Demand Training Learn to create deep learning applications with a streamlined development workflow. Training delivered by CloudxLab. Intel® FPGA Technical Training Access beginner to advanced training on Intel® FPGA technology. Explore the complete catalog. FPGA Instructor-Led Class Schedule Attend free, comprehensive classes in a virtual classroom environment. Learn from a subject-matter expert and work lab exercises with a remote computer and board. Beginner Workshop for Intel FPGAs Instructor-Led Class Learn how to use software to develop an FPGA from initial design to device programming. Basics of Programmable Logic: FPGA Architecture On-Demand Training Get a basic introduction to the architecture of a modern FPGA. Intel® FPGA Academic Program Access materials for university instructors and classes. 5G Digital Transformation Take a sampling of 5G courses available to members of Intel® Network Builders. Explore the program. Explore the complete catalog Drivers for Service Providers On-Demand Training Experience the Intel® Network Academy and get an overview of the transformation that 5G and IoT bring to communications. Impact of 5G Use Cases on Network Architecture On-Demand Training Learn how to allocate network resources using network-slicing techniques. Core Network Elements On-Demand Training Explore how 5G impacts core network elements such as Evolved Packet Core and IP Multimedia Subsystem. Communication Service Provider On-Demand Training Learn how networks are transforming with smart devices, from the core network to the cloud via network functions virtualization. Communication Service Providers—Edge Transformation Use Cases On-Demand Training Explore network use cases and changes that 5G and the edge bring to customer-premises equipment. Visual Cloud On-Demand Training Study the definition of visual cloud and use cases such as online gaming, video analytics, and media processing. Featured Training for Partners and Members of Intel® Network Builders Get advanced training for partners and solution providers. Intel® Partner University Live and On-Demand Training Experience specialized training on advanced technologies, competency programs, and rewards for learning. Edge Security in IoT On-Demand Training Identify common threats and common practices to protect edge security in IoT. Intel Network Builders University On-Demand Training Get beginner to advanced training on multiple networking topics, including 5G, DPDK*, security, and cloud networking, with more than 300 online courses. .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/241216/intel/clientlibs/pages/get-help.min.css" type="text/css">'
