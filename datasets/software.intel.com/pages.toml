full_description = '''var l3_epmid = "98836"; var intelTypeSite="/content/www/us/en/products/compare.html?productIds="; var comparePagePattern ="products/compare"; var sndTypeSite='/content/www/us/en/products/sndcompare.html?productIds='; Quartus® Prime Design Software The intuitive high-performance design environment. From design entry and synthesis to optimization, verification, and simulation, Quartus® Prime Design Software unlocks increased capabilities on devices with multi-million logic elements, providing designers with the ideal platform to meet next-generation design opportunities. var intel = intel || {}; intel.label = intel.label || {}; intel.label.carousel = { previous: "Reveal previous panel", next: "Reveal next panel", revealPhoto: "Reveal full-sized photo: ", revealVideo: "Reveal video: " }; Overview Documentation Features Downloads Videos What's New in Version 24.3 Read the latest release notes Agilex Device Support Added support for Agilex 5 FPGA D-Series devices Additional support for Agilex 5 FPGA E-Series devices Additional device support for Agilex 7 FPGAs F, I, and M-Series Enhancements Enhanced the node-finder search filters to include various interface types for faster search queries Enhanced the NoC view in Interface Planner, including: More accurate architecture display Visualization of links, switches, and congestion Enhancements to Nios V Processor: Branch prediction support in Nios V/g core Lockstep support in Nios V/g core ECC Full support in Nios V/g core Improved performance numbers of Dhrystone and Coremark benchmarks Reduced resource utilization of Nios V/m & Nios V/c core Enhancements to Advanced Link Analyzer: Updated F-Tile FHT and FGT transceiver support. Enhanced Platform/Simulation Engine Other Features and Improvements Machine-learning-based estimation of post-synthesis area Extended no-cost licensing for various IP, including Nios V. Includes auto-fetch from within Quartus Cycle-accurate models for simulation of NoC (HBM only) Extension of pre-compiled components with pre-compiled simulation libraries, reducing compile time Compile time, memory, and runtime improvements Board IP Presets for DisplayPort, PCIe+PIO, and HBM+NoC Improvements to Quartus Exploration Dashboard Quartus GitHub integration with many new example designs Beta Docker Container Support What's New for FPGA IPs in Version 24.3 Agilex™ 5 FPGA D-Series IP Features Video and Vision Processing: VVP Textbox IP for real-time adjustments in visual data processing MIPI D-PHY and MIPI CSI-2 support up to 3.5G MIPI D-PHY with 4K video support for advanced imaging systems Compute Interconnect: PCI Express Gen4 x8 protocol stack with VirtIO and SR-IOV for low-latency, high-performance computing External Memory Interface: Support for DDR4/5 and LPDDR4/5 memory for fast data processing Communications Interconnect: JESD204B/C for high-speed data conversion up to 17G, CPRI, and eCPRI with MAC capability enhancing communication efficiency Agilex™ 7 FPGA IP Features Compute Interconnect (PCI Express and CXL): In-system PCIe Eye Scan feature for real-time diagnostics without JTAG MCDMA IP Improvements CXL 2.0 with Global Persistent Flush and RAS support for robust data management and access control Network Interconnect: Introduction of High-Speed FHT Equalization Tool. Mixed FHT and FGT topology for efficient networking. New example designs for PTP 1588 and Serial Lite IV with deterministic latency (up to 12 lanes). Communications Interconnect: Apollo board support for JESD204 IP, enabling high-speed data conversions for military applications. Three Quartus Prime Editions to Meet Your Requirements Compare the editions Ready to Download and Start Designing Go to download window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Everything You Need to Design for Altera® FPGAs, SoCs, and CPLDs Watch how you can design with Quartus Prime Design Software. window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $(document).ready(function(){ intel.bcLazyLoader.addPlayer({ elementID: "brightcovePlayer_1", playerID: "734546229001", playerKey: "default", videoID: "6090768037001", muted: false, looped: false, autoStart: false, placeholderID: "1", poster: "", captionLocale: "en" }); });}},100);})();}); window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $.ajax({url: "//players.brightcove.net/734546229001/default_default/index.min.js", dataType: "script", cache: true}) .done(function(){ $(document).trigger("intel:brightcove:bcScriptLoaded"); });}},100);})();}); Additional Resources Download Get the complete suite of Altera® FPGA design tools. Licensing Find out how to get a license file, set up a license, solve license problems, or change license information. Buy Find local distributors that can help you in purchasing Altera® FPGA Software. Training This page lists all the online and instructor-led courses currently available. Frequently Asked Questions About Quartus® Prime Design Software What is Quartus® Prime Design Software? Quartus® Prime Software enables a fast path to turning Altera® FPGA, SoC, and CPLD designs into reality. It provides tools and features needed to help with every step from design entry and synthesis to optimization, verification, and simulation. Check out the Quartus Prime Software brochure for more details. How is Quartus® Prime Design Software licensed? Quartus® Prime Pro Edition Software and Quartus® Prime Standard Edition Software require a paid license, but Quartus® Prime Lite Edition Software is license-free. A fixed-node subscription supports access to the Pro Edition and Standard Edition, was well as the Questa*-Altera® FPGA Edition with one year of maintenance. To obtain a license, go to the Intel® FPGA Licensing Support Center. How do I download Quartus® Prime Design Software? If you are ready to purchase a license or need advanced FPGA and SoC features—such as support for Agilex® 7, Stratix® 10, Arria® 10, and Cyclone® 10 LP device families—first purchase a paid license from the Intel® FPGA Licensing Support Center. To get started with the free version of Quartus® Prime Lite Edition Software or to download a licensed version, go to Quartus Prime Software downloads. {"mainEntity":[{"@type":"Question","name":"What is Quartus® Prime Design Software?","acceptedAnswer":{"@type":"Answer","text":"<p>Quartus® Prime Software enables a fast path to turning Altera® FPGA, SoC, and CPLD designs into reality. It provides tools and features needed to help with every step from design entry and synthesis to optimization, verification, and simulation. Check out the <a href=\"https:\/\/www.intel.com\/content\/dam\/www\/central-libraries\/us\/en\/documents\/quartus-prime-software-brochure.pdf\">Quartus Prime Software brochure<\/a> for more details.<\/p>\r\n"}},{"@type":"Question","name":"How is Quartus® Prime Design Software licensed?","acceptedAnswer":{"@type":"Answer","text":"<p>Quartus® Prime Pro Edition Software and Quartus® Prime Standard Edition Software require a paid license, but Quartus® Prime Lite Edition Software is license-free. A fixed-node subscription supports access to the Pro Edition and Standard Edition, was well as the Questa*-Altera® FPGA Edition with one year of maintenance. To obtain a license, go to the <a href=\"https:\/\/www.intel.com\/content\/www\/us\/en\/support\/programmable\/licensing\/support-center.html\">Intel® FPGA Licensing Support Center<\/a>.<\/p>\r\n"}},{"@type":"Question","name":"How do I download Quartus® Prime Design Software?","acceptedAnswer":{"@type":"Answer","text":"<p>If you are ready to purchase a license or need advanced FPGA and SoC features\u2014such as support for Agilex® 7, Stratix® 10, Arria® 10, and Cyclone® 10 LP device families\u2014first purchase a paid license from the <a href=\"https:\/\/www.intel.com\/content\/www\/us\/en\/support\/programmable\/licensing\/support-center.html\">Intel® FPGA Licensing Support Center<\/a>. To get started with the free version of Quartus® Prime Lite Edition Software or to download a licensed version, go to <a href=\"https:\/\/www.intel.com\/content\/www\/us\/en\/products\/details\/fpga\/development-tools\/quartus-prime\/resource.html\">Quartus Prime Software downloads<\/a>.<\/p>\r\n"}}],"type":"FAQPage","@context":"https:\/\/schema.org"} Compare Products { "@context": "https://schema.org/", "@type": "WebPage", "name": "Quartus® Prime Design Software", "speakable": { "@type": "SpeakableSpecification", "xpath": [ "/html/head/title", "/html/head/meta[@name='description']/@content" ] }, "url": "https://www.intel.com/content/www/us/en/products/details/fpga/development-tools/quartus-prime.html" } Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/250114/intel/clientlibs/pages/get-help.min.css" type="text/css">'''
