full_description = '''var intel = intel || {}; intel.globalMasthead = { campaignPath: '', allTeasers: '' }; Expand All #ssi-content{ position: absolute; right: 0; z-index:999; } #ssi-content.stickbutton { position: fixed; top: 98px; } @media screen and (min-width: 768px){ #ssi-content.stickbutton { top: 120px; } } function defer(method){ if(window.jQuery){ method(); } else { setTimeout(function(){defer(method)}, 50); } } defer(function(){ /*$(".jumplinks").append($("#ssi-content"));*/ $("#toggle-sections").click(function(e){ e.preventDefault(); if($(this).hasClass("open")){ $(this).removeClass("open").text("Collapse All"); $(".faq-link-toggle.collapsed").trigger("click"); //only toggle closed items $(".faq-link-toggle").addClass("opened"); //add class to all open and closed items for easy closing } else { $(this).addClass("open").text("Expand All"); if($(".faq-link-toggle.collapsed.opened").length){ $(".faq-link-toggle.collapsed.opened").removeClass("opened"); //prevent manually closed items from opening } $(".faq-link-toggle.opened").removeClass("opened").trigger("click"); //only toggle opened items } }); // When the user scrolls the page, execute myFunction window.onscroll = function() {myFunction()}; // Get the navbar var navbar = document.getElementById("ssi-content"); // Get the offset position of the navbar var sticky = navbar.offsetTop; // Add the sticky class to the navbar when you reach its scroll position. Remove "sticky" when you leave the scroll position function myFunction() { if (window.pageYOffset >= sticky) { navbar.classList.add("stickbutton") } else { navbar.classList.remove("stickbutton"); } } }); Last Revised: August 31, 2023 Privacy and Your Information Intel’s business brings technology to businesses, consumers, and society in a way that makes amazing experiences possible but doesn’t come at the expense of your privacy. We believe in innovation and performance that supports your privacy rights and in technology designed with those rights in mind. This Privacy Notice describes how we use your personal information and respect your privacy rights. In particular, this Privacy Notice explains how our products, services and, technologies use your personal information. It applies to our use of personal information across our websites, products, online services, software, apps, tools, and other services and functionality we provide, both online and offline (collectively referred to as “Intel® Services”), unless a separate, or supplementary, privacy notice is offered. See here Candidate Notice, Intel® Active Management Technology Notice for additional information posted for specific Intel® Services. Additional Privacy Notices & Supplements The following privacy supplements, policies, notices, and statements are incorporated by reference into this Privacy Notice: • Privacy Notice Supplement for Residents of Certain States • Candidate Notice • Intel® Active Management Technology Notice • Privacy Notice Supplement for Users in the Republic of Korea • Privacy Notice Supplement for Users in the People’s Republic of China (English, Simplified Chinese) What Kinds of Information Do We Collect? Intel collects information as part of its business operations, to provide services, to respond to requests and offer customer support, to fulfill legal and contractual obligations and to build its innovative products. You provide some of this data directly, such as when you order an Intel product, contact customer support, or register for an Intel event or publication. We also collect information through your interaction with Intel® Services and our website, for example, using embedded product technologies and cookies. We also obtain data from third parties. Expand the sections below to learn more. Information You Provide to Intel Voluntarily When you subscribe to a newsletter, create an account, make a purchase or request information from Intel, we will ask for things like contact, billing, shipping and communication information, payment card or financial account data, and account ID or credentials in order to fulfill your request. If you visit one of our stores or locations, attend a trade show or event, or otherwise contact us, you may also voluntarily provide similar information. Interactive features in some Intel® Services may allow you to invite friends, follow others, comment on or make unique posts, or share photos, video or other personal content. When you affirmatively share this content, we may collect and use it in accordance with this Notice. Additionally, by way of your social engagement, we may receive information about you from another user, such as when your friend posts content that includes you. From time to time we engage in research, analysis, historical and scientific studies either alone or with partners. As part of such efforts we invite individuals to participate and voluntarily share information through an informed consent process. When we receive personal information from a third party for the purpose of such research we undertake processes to validate that the personal information has been collected in a responsible and lawful manner. If you submit any personal information about other people to us or to our service providers, you are responsible for making sure that you have the authority to do so and to allow us to use their personal information in accordance with this Privacy Notice (for example, by your asking for their consent). {"mainEntity":[{"@type":"Question","name":"Information You Provide to Intel Voluntarily","acceptedAnswer":{"@type":"Answer","text":"<p>When you subscribe to a newsletter, create an account, make a purchase or request information from Intel, we will ask for things like contact, billing, shipping and communication information, payment card or financial account data, and account ID or credentials in order to fulfill your request. If you visit one of our stores or locations, attend a trade show or event, or otherwise contact us, you may also voluntarily provide similar information.<\/p>\r\n<p>Interactive features in some Intel® Services may allow you to invite friends, follow others, comment on or make unique posts, or share photos, video or other personal content. When you affirmatively share this content, we may collect and use it in accordance with this Notice. Additionally, by way of your social engagement, we may receive information about you from another user, such as when your friend posts content that includes you.<\/p>\r\n<p>From time to time we engage in research, analysis, historical and scientific studies either alone or with partners. As part of such efforts we invite individuals to participate and voluntarily share information through an informed consent process. When we receive personal information from a third party for the purpose of such research we undertake processes to validate that the personal information has been collected in a responsible and lawful manner.<\/p>\r\n<p>If you submit any personal information about other people to us or to our service providers, you are responsible for making sure that you have the authority to do so and to allow us to use their personal information in accordance with this Privacy Notice (for example, by your asking for their consent).<\/p>\r\n"}}],"type":"FAQPage","@context":"https:\/\/schema.org"} Device and Product Operation If you download and use certain Intel® Service like software or an app, we may track and collect usage data, such as when the software or app accesses our servers, what information and files have been downloaded through the use of the software or app, and how you interact with the software or app during use. Some of this data may be protected as personal information under applicable data protection laws. We collect this information to understand how you interact with Intel® Services and provide you the best experiences. We may also use this information for security purposes. We may associate the information we collect from more than one device that you use with other information that we have collected about you or your other devices. In addition, most computing devices include embedded technology like processing chips that collect information about how the device is operating. This information may include: · Type and version of operating system, hardware version, device settings, software types, battery and signal strength, screen resolution, device manufacturer and model, language, and Internet browser type and version. The name and version of any Intel® Services (such as the app) you are using is also collected. · Geographic locations, such as through GPS, Bluetooth, or WiFi signals. · Connection information such as the name of your mobile operator or ISP, browser type, language and time zone, mobile phone number and IP address. Access to this information by other applications and transmission of this information from the device to Intel or other service providers may be controlled by the operating system or other software running on the device. In some instances Intel technology is used within a product or device that may collect personal information, which is not shared with Intel. This information may be collected by the manufacturer of the product or device and you will need to read the privacy notice, privacy policy, or related terms published by that manufacturer to understand how they use your information. Some Intel® Services may allow you to use biometric information for identification or authentication or to take advantage of specific features. Biometric data may include your fingerprint, facial features, voice or similar unique physical characteristics. Intel® Services can also collect geographic location information, such as location inferred from your IP address or GPS, and information about how you engage with and use Intel® Services, for example where you have chosen to activate location-enabled services on the device with which you access these services. When Intel® Services use more sensitive categories of your personal information, such as biometrics for identification or authentication, or precise geographic location, Intel will honor the preferences you set in accompanying menus and settings. We collect information from and about a wide variety of technologies where Intel® Services are used. The kind of information collected depends on the technology, the use, and the device and personal settings. Examples of these technologies might include computers, phones and tablets, but also interactive wearables, connected technologies in the home, drones or other vehicles. Where we provide technology for drones and autonomous vehicles, these may capture audio, video and photographs that unintentionally or incidentally capture people, for example workers in a field or pedestrians crossing a street. Where appropriate, we use technical and organizational controls to prevent it from being used improperly, but this information is important to help improve algorithms for product functionality and safety, including features such as mapping topography, obstacles, traffic and the like. Information from Third Parties We obtain information through partners, vendors, suppliers and other third parties. The parties from whom we obtain information are typically corporate enterprises (although some may also be educational or public enterprises) and they may be located in any of the locations in which we do business. These enterprises largely fall into the following categories: Advertising and marketing companies, data set and information vendors, public database providers, social media platforms, partners, providers of products or services, hosts or vendors at events or trade shows, research partners, enterprises that deploy the Intel® Services or third party offerings that include Intel® Services. We take steps to confirm that information we receive from these third parties has been collected with your consent or that these parties are otherwise legally permitted to disclose your personal information to us. We might also obtain information through a partner, or co-create datasets with a partner, as part of our business operations. This kind of data is used for work like improving algorithms and data models, product testing and improvement, enhancing existing products and developing new capabilities and features. In some cases we combine personal information about individuals that we receive from multiple sources, including directly collected from you or through your use of the Intel® Services. Through our Website & Services We collect information about how you interact with our website and some Intel® Services through the use of cookies, pixel tags, and similar technologies. Please view our Intel Cookies and Similar Technologies Notice for more information on our use of cookies and similar technologies, how you can manage cookies and how we respond to Do Not Track signals. How We Use Information We use information that we collect for lawful purposes associated with the growth, maintenance and management of our business while also respecting your privacy. These uses include our internal operations and administration, communicating with you and fulfilling your requests for the Intel® Services, for advertising and marketing, to monitor and maintain functionality and security of Intel® Services and to improve, develop, enhance and otherwise provide the Intel® Services. Expand the sections below to learn more. To Communicate We use contact information to send messages; to ship products and process payments; to respond to customer service requests; to provide alerts such as security updates or changes in our policies or about subscriptions that are ending; and to send marketing or informational materials like newsletters or white papers, in accordance with your communication preferences. We occasionally conduct surveys, offer contests or sweepstakes or do focused research or studies which may require you to voluntarily share personal information in order to participate. These activities typically have additional notices that provide more information about the use of your personal information and to which you may be asked to consent. Some Intel® Services may allow you to send messages to a “friend” or other contacts you provide or to “like” or post on social media. For information about managing the use of your contact data and to manage subscriptions and promotional communications, please visit the Your Choices & Rights section of this Notice. For Business Operations We use information to operate our business; for example, to perform accounting, auditing, billing, reconciliation, and collection activities. Other business purposes that depend on use of your personal information include crime or fraud monitoring and prevention, protecting our legal rights, and performing contractual obligations. We also use personal information to contact you to advertise, market and sell Intel® Services in accordance with your commun'''
