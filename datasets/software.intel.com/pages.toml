full_description = '''Develop and Scale Your Code with Confidence Highly productive development stack for AI and open, accelerated computing. Get the Toolkits About oneAPI | What's New .content-table-container .content-table-content-panel-container div.content-table-content-top-bar { display: none; } .content-table-container .content-table-content-panel-container .content-table-list .content-table-list-top-bar { display: none; } .content-table-container .content-table-content-panel-container .content-table-list .content-table-banner-top-bar { display:none; } .content-table-container.card-view .content-table-content-panel-container .content-table-list .content-table-list-item__card-view-icons-section { display:none; } .content-table-container .content-table-content-panel-container .content-table-pagination { display: none; } .content-table-container .content-table-content-panel-container .content-table-list .content-table-list-item__headers__header__title { padding-bottom: 0px; } .content-table-container .content-table-content-panel-container .content-table-list .content-table-banner-top-bar-rdc { display: none; } @media screen and (min-width: 768px){ .content-table-container div.content-table-content-panel-container { margin: auto; width: 750px; } } @media screen and (min-width: 992px){ .content-table-container div.content-table-content-panel-container { margin: auto; width: 970px; } } @media screen and (min-width: 1200px){ .content-table-container div.content-table-content-panel-container { margin: auto; width: 1170px; } } @media screen and (min-width: 1650px){ .content-table-container div.content-table-content-panel-container { margin: auto; width: 1610px; } } @media screen and (min-width: 600px){ .content-table-container.card-view .content-table-content-panel-container .content-table-list div.content-table-list-item { -ms-flex-preferred-size: 48%; flex-basis: 48%; margin: 1% 1% 2% 1%; max-width: 48%; } } @media screen and (min-width: 768px){ .content-table-container.card-view .content-table-content-panel-container .content-table-list div.content-table-list-item { -ms-flex-preferred-size: 48%; flex-basis: 48%; margin: 1% 1% 2% 1%; max-width: 48%; } } @media screen and (min-width: 992px){ .content-table-container.card-view .content-table-content-panel-container .content-table-list div.content-table-list-item { -ms-flex-preferred-size: 23%; flex-basis: 23%; margin: 0 1% 2% 1%; max-width: 23%; } } @media screen and (min-width: 768px){ .content-table-container.card-view .content-table-content-panel-container .content-table-list div.content-table-list-item:nth-child(3n+1) { margin-left: 1%; } } @media screen and (min-width: 768px){ .content-table-container.card-view .content-table-content-panel-container .content-table-list div.content-table-list-item:nth-child(3n) { margin-right: 1%; } } @media screen and (min-width: 1400px){ /* HC - Fix margin issue on 2nd row of UAT */ .content-table-container.card-view .content-table-content-panel-container .content-table-list div.content-table-list-item:nth-child(4n) { margin-left: 0; margin-bottom: 25px; } } /* This css file makes the default SVG thumbnails full width.*/ .content-table-container.card-view .content-table-content-panel-container div.content-table-list-item__media { background: black; border-bottom: 0px; } .content-table-component-react img { vertical-align: middle; border-style: none; object-fit: cover; width: 100%; height: 165px; } .content-table-container.card-view .content-table-content-panel-container div.content-table-list-item__media-wrapper { height: 165px; background-color: white; } .content-table-container .content-table-content-panel-container .content-table-list .content-table-list-item__headers__header__title__main__label { font-weight: 600; } @media screen and (min-width: 1200px){ .content-table-container .content-table-content-panel-container .content-table-list div.content-table-list-item__body__container { max-width: 100%;} } h2{font-size: 1.75rem !important;} .h4{font-size: 1.75rem !important; font-weight: 300 !important;} Celebrate the 5th Anniversary of oneAPI with the 2025.0 Release of Intel® Software Development Tools Developers continue to get the most from the latest Intel platforms using this open, standards-based, multivendor programming model that delivers increased performance for AI and HPC applications and hardware choice across CPU, GPU, and other accelerators. window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); How It Works The Fast Path to Performant, Production-Ready AI Developers can more easily deliver production-ready multiarchitecture, high-performance applications faster and with improved reliability and increased hardware choice. Intel oneAPI and AI tools are based on open standards with broad coverage for C++, Fortran, Python*, PyTorch*, SYCL*, OpenMP*, and MPI. The 2025.0 release is optimized for Intel® Xeon® 6 processors with P-cores and Intel® Core™ Ultra processors with integrated GPU and NPU. Meet your programming and workload needs by combining these integratable, cross-disciplinary tools, libraries, and popular frameworks—based on and powered by oneAPI. Explore Toolkits | Stand-Alone Tools What Is oneAPI Open Industry Initiative Tools Powered by oneAPI A Vision of Developer Freedom for the Future of Accelerated Compute oneAPI provides a comprehensive set of libraries, open source repositories, SYCL-based C++ language extensions, and optimized reference implementations to accelerate the following goals: Define a common, unified, and open multiarchitecture and multivendor software platform. Ensure functional code portability and performance portability across hardware vendors and accelerator technologies. Enable an extensive set of specifications and library APIs to cover programming domain needs across industries and compute as well as AI use cases. Meet the needs of modern software applications that merge high-end computational needs and AI. Provide a developer community and open forum to drive a unified API for a unified industry-wide multiarchitecture software development platform. Encourage ecosystem collaboration on the oneAPI specification and compatible oneAPI implementations. A Commitment to Open, Scalable Acceleration Freeing the Developer Ecosystem from the Chains of Proprietary Software The oneAPI open source software platform is a major ingredient of the UXL, which is: A cross-industry group committed to delivering an open-standard accelerator programming model that simplifies the development of performant, cross-platform applications. Hosted by the Linux* Foundation's Joint Development Foundation, which brings together ecosystem participants to establish an open standard for developing applications that deliver performance across a wide range of architectures. An evolution of the oneAPI software platform with its specification as its core, oneAPI and UXL use SYCL (from The Khronos Group*) as the ISO C++ extension and abstraction layer to provide the multivendor and multiarchitecture freedom of choice at the center of their philosophy. UXL Foundation oneAPI Specification UXL Foundation/Khronos Group Announcement of SYCL for AI, HPC, and Safety-Critical Systems A Flexible, Comprehensive, Open Software Stack that Fits Your Needs Intel® Software Development Tools and AI Frameworks Intel offers its own Intel-optimized binary distribution of development tools, powered by oneAPI. Some highlights include: oneAPI library and specification-element implementations featuring the latest optimizations and support for Intel® CPUs, GPUs, and other accelerators Intel® oneAPI DPC++/C++ Compiler and Intel® Fortran Compiler Intel® Distribution for Python* Intel® DPC++ Compatibility Tool for CUDA*-to-SYCL migration AI tools, optimized frameworks, and the Intel® Distribution of OpenVINO™ toolkit Explore All of the Tools Learn More about Software Development for AI Developing and deploying AI for production applications should fit your requirements, workflows, and available resources. Intel tools, powered by oneAPI, are purpose-built and optimized to deliver exactly that—for generative AI (GenAI), edge deployment, and classical machine learning. Get Started Building, Deploying and Scaling AI Solutions Reviews and Testimonials – Celebrating oneAPI's 5th Anniversary The 5th anniversary of oneAPI is an opportunity to recognize both the technical depth of the ecosystem, which enables applications to run on different hardware, and how it succeeds in forming a community around HPC, AI, API standards, and portable applications. – Dr. Hartwig Anzt, chair of Computational Mathematics oneAPI has revolutionized the way we approach heterogeneous computing by enabling seamless development across architectures. Its open, unified programming model has accelerated innovation in fields from AI to HPC, unlocking new potential for researchers and developers alike. Happy 5th anniversary to oneAPI! – Dr. Gal Oren, assistant professor, Department of Computer Science Intel's commitment to their oneAPI software stack is testament to their developer-focused, open-standards commitment. As oneAPI celebrates its 5th anniversary, it provides comprehensive and performant implementations of OpenMP and SYCL for CPUs and GPUs, bolstered by an ecosystem of library and tools to make the most of Intel processors. – Dr. Tom Deakin, senior lecturer, head of Advanced HPC Research Group Celebrating five years of oneAPI. In ExaHyPE, oneAPI has been instrumental in implementing the numerical compute kernels for hyperbolic equation systems, making a huge difference in performance with SYCL providing the ideal abstraction and agnosticism for exploring these variations. This versatility enabled our team, together with Intel engineers, to publish three distinct design paradigms for our kernels. – Dr. Tobias Weinzierl, director, Institute for Data Science Happy 5th anniversary, oneAPI! We've been partners since the private beta program in 2019. We are currently exploring energy-efficient solutions for simulations in material science and data analysis in bioinformatics with different accelerators. For that, the components of oneAPI, its compilers with back ends for various GPUs and FPGAs, oneMKL, and the performance tools VTune Profiler and Advisor are absolutely critical. – Dr. Thomas Steinke, head of the Supercomputing Department GROMACS was an early adopter of SYCL as a performance-portability back end, leveraging it to run on multivendor GPUs. Over the years, we've observed significant improvements in the SYCL standard and the growth of its community. This underscores the importance of open standards in computational research to drive innovation and collaboration. We look forward to continued SYCL development, which will enable enhancements in software performance and increase programmer productivity. – Andrey Alekseenko, researcher, Department of Applied Physics Using the Intel® oneAPI Base Toolkit, [GE HealthCare] successfully migrated code, which requires heavy processing and is extensively used in ultrasound diagnostics solutions, to SYCL. This is a big step forward on the way to a single, open, standards-based programming model for heterogeneous computing. The migrated code efficiently runs on different GPU platforms and achieves competitive performance. – Arcady Kempinsky, senior lead software architect Show more Show less Introducing Intel® Tiber™ AI Cloud¹ A New Name. Expanded Production-Level AI Compute. Intel's developer cloud is now called Intel® Tiber™ AI Cloud. Part of the Intel® Tiber™ Cloud Services portfolio, the new name reflects Intel’s commitment to deliver computing and software accessibility at scale for AI deployments, developer ecosystem support, and benchmark testing. Get Access (or Sign In) Explore the Details 1 Formerly Intel® Tiber™ Developer Cloud window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $(document).ready(function(){ intel.bcLazyLoader.addPlayer({ elementID: "brightcovePlayer_1", playerID: "734546229001", playerKey: "default", videoID: "6362841094112", muted: true, looped: true, autoStart: false, placeholderID: "1", poster: "", captionLocale: "en" }); });}},100);})();}); window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $.ajax({url: "//players.brightcove.net/734546229001/default_default/index.min.js", dataType: "script", cache: true}) .done(function(){ $(document).trigger("intel:brightcove:bcScriptLoaded"); });}},100);})();}); Latest Tech Insights See All /* Removes the padding on the top and bottom.*/ .rwd .column-layout-container { padding-bottom: 0rem !important; padding-top: 0rem !important; } @media screen and (min-width: 768px){ .rwd .two-column.seventyfive .col-1 { width: 95% !important; } .rwd .two-column.seventyfive .col-2 { width: 5% !important; } } Does DeepSeek* Solve the Small Scale Model Performance Puzzle? Learn how the DeepSeek-R1 distilled reasoning model performs and see how it works on Intel hardware. Fast Sub-Stream Parallelization for oneMKL MRG32k3a RNG MRG32k3a is a widely used algorithm for generating pseudo-random numbers for complex math operations. This article introduces how to improve its performance even more by increasing its parallelism level. Be Ready for Post-Quantum Security—A Future-Proof Solution Cryptography researchers are on a mission to develop new types of encryption/decryption-based security that even quantum computers can’t break. Intel Cryptography Primitives Library is part of the solution. Create an AI Avatar Talking Bot with PyTorch* and OPEA Learn how to use the Open Platform for Enterprise AI (OPEA), a robust framework of composable building blocks for GenAI systems, to create an AI Avatar Chatbot on Intel® Xeon® Scalable processors and Intel® Gaudi® AI accelerators and then accelerate it with PyTorch. Faster Core-to-Core Communications In heavily threaded applications, end-to-end latency for short messages can lead to performance degradation. This article discusses an approach to using a modified pointer ring buffer for read-write operation optimization. How Intel AI Solutions Support Llama 3.2 Models See how Intel AI hardware platforms, from edge and client devices to enterprise-level data centers, support Llama 3.2 models, including 1B and 3B text-only LLMs and 11B and 90B vision models. Includes performance data. A Field Guide for AI Developers in the Cloud This collection of practical tips can help you better navigate the world of AI development in the cloud, both the challenges and opportunities. A Data Scientist's GenAI Survival Guide Data scientists are pivotal to ensuring GenAI systems are built on solid, data-driven foundations, enabling full potential performance. This guide offers a collection of steps and video resources to set up data scientists for success. Explore the Latest C'''
