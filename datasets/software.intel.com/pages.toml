full_description = 'Developer Zone Programs Tools Documentation Learn Topics & Technologies Community & Events Get Help h2{font-size: 1.75rem !important;} .h4{font-size: 1.75rem !important; font-weight: 300 !important;} .rwd .column-layout-container-content .atomImage, .rwd .column-layout-container-content .atomVideo { margin-bottom: 0rem !important; } .rwd .atom-color-block.tile-version { margin-top: 0rem !important; margin-bottom: 1rem; } .rwd .column-layout-container { padding-bottom: 0rem !important; padding-top: 2rem !important; } Topics & Technologies Explore All AI & Machine Learning Client Cloud Edge Computing Game Development HPC Featured Software Tools Intel® Distribution of OpenVINO™ Toolkit Run AI inferencing, optimize models, and deploy across multiple platforms. Intel® oneAPI Toolkits Heterogeneous architecture enables one programming model for all platforms. Intel® Graphics Performance Analyzers Identify and troubleshoot performance issues in games using system, trace, and frame analyzers. Intel® Quartus® Prime Design Software Design for Intel® FPGAs, SoCs, and complex programmable logic devices (CPLD) from design entry and synthesis to optimization, verification, and simulation. Show more Show less Get Your Software & Development Products Try, buy, or download directly from Intel and popular repositories. Intel® Developer Catalog View a catalog of available software with multiple configuration options. Intel® Tiber™ AI Cloud Accelerate and scale AI with the latest hardware and software innovations. FPGA Software Get FPGA software and kits for your project. Download Drivers Access new and previously released drivers for Intel hardware. Distributors & Resellers Choose development kits and software from retailers and third parties. Product Support Forums Get answers and help in the forums. Documentation Get started with these key categories. Explore the complete library. Installation Guides Programming Guides Product Specifications FPGA Documentation Tu