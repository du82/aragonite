title = "Intel Global Human Rights Principles and Approach"
description = """
Intel Global Human Rights Principles and Approach                                                                    Human rights are the fundamental rights, freedoms, and standards of treatment to which all people are entitled. Respect for human rights is rooted in our values and applies wherever we do business. Intel’s Global Human Rights Principles and Approach formalizes our commitment to respect human rights and embodies common principles reflected in the UN Guiding Principles on Business and Human Rights,                                                 the eight core International Labour Organization Conventions, the Organization for Economic Co-operation and Development Guidelines for Multinational Enterprises, and the laws of the countries in which we operate. At Intel, we are committed to maintaining and improving systems and processes to avoid causing or contributing to adverse human rights impacts in our own operations, our supply chain, and our products. We engage with and listen to people whose human rights we may affect, continuously seeking to implement our Principles and Approach, and assess our business practices for alignment with respect for internationally recognized human rights."""
