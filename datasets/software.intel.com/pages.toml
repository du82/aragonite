title = "Intel® Tiber™ AI Cloud"
description = "Accelerate AI development using Intel®-optimized software on the latest Intel® Xeon® processors and GPU compute."
full_description = 'Intel® Tiber™ AI Cloud Speed up AI development using Intel®-optimized software on the latest Intel® Core™ Ultra processor, Intel® Xeon® processor, Intel® Gaudi® AI Accelerator, and GPU compute. Sign Up Already a Member? Sign In Get Started with Intel Get hands-on experience with the latest Intel® products. Empower your AI skills with Intel. Early Technology Access Evaluate prerelease Intel platforms and associated Intel-optimized software stacks. Deploy AI at Scale Speed up AI deployments with the latest machine learning toolkits from Intel and libraries hosted on Intel® Tiber™ AI Cloud. Available Software Intel® Toolkits and Libraries Intel® oneAPI Base Toolkit Intel® Rendering Toolkit Intel® HPC Toolkit AI Tools Intel® Quantum SDK AI Frameworks and Tooling Intel® Distribution of OpenVINO™ Toolkit Intel® Optimization for PyTorch* Intel® Optimization for TensorFlow* SynapseAI* Software Suite Intel® Extension for Scikit-learn* Intel® Extension for DeepSpeed* Intel® oneAPI Collective Communications Library (oneCCL) AI Foundation Models Technology Innovation Institute* (TII) Falcon LLM MosaicML* MPT HuggingFace* Bloom Stability.AI Stable Diffusion* Meta AI* Llama 2 Databricks* Dolly Available Intel Hardware Resources Get Started Learn the fundamentals to get the most out of the Intel Tiber Developer Cloud. What’s New Learn about the latest products and services. Free Training Access free digital courses to improve your skills. Intel Tiber AI Cloud Customers Service Tiers Standard - Free Explore and evaluate the latest Intel® AI products plus: Develop AI skills. Access cutting-edge learning resources. Get support from the Intel community. Premium - Pay as You Go Get single-user access to the latest Intel products, Standard tier benefits, plus: Early prerelease hardware AI and machine learning software toolkits Intel Premium support Enterprise - Team Access In addition to Premium level benefits, an Enterprise subscription includes discounts and team access to the latest Intel products. Billed subscription for teams Deploy inference on your own infrastructure Use CPU, GPU, and AI accelerators 24 x 7 Intel premium plus support Get Started Frequently Asked Questions Expand All Collapse All How much does Intel Tiber AI Cloud cost? Is there a service fee? Enterprise customers work with Intel to establish the optimal set of hardware needed to support the customer goals. Fees vary. Developers participating in training events may be able to use cloud credits for paid-for cloud services offered. Intel will continue to evolve the service structure and share more details with new releases. Can production workloads be deployed on Intel Tiber AI Cloud? Yes. Intel Tiber AI Cloud provides Premium and Enterprise tiers to run your production workloads. {"mainEntity":[{"@type":"Question","name":"How much does Intel Tiber AI Cloud cost? Is there a service fee?","acceptedAnswer":{"@type":"Answer","text":"<p>Enterprise customers work with Intel to establish the optimal set of hardware needed to support the customer goals. Fees vary. Developers participating in training events may be able to use cloud credits for paid-for cloud services offered. Intel will continue to evolve the service structure and share more details with new releases.<\/p>\r\n"}},{"@type":"Question","name":"Can production workloads be deployed on Intel Tiber AI Cloud?","acceptedAnswer":{"@type":"Answer","text":"<p>Yes. Intel Tiber AI Cloud provides Premium and Enterprise tiers to run your production workloads.<\/p>\r\n"}}],"type":"FAQPage","@context":"https:\/\/schema.org"} .rwd .brandy .partner-logos h2 { font-size: 1.875em; margin: 35px 0 0px !important; padding-bottom: 0px; } .h2 { font-size: 1.875em !important; } .rwd .intel-ws.link-default a.btn-tertiary { padding-top: 10px; } .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Software Platforms Resources Customers Sign Up Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/250114/intel/clientlibs/pages/get-help.min.css" type="text/css">'
