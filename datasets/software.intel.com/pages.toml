title = "Intel® NUC, Compute Stick, and Compute Card Recycling"
description = "Instructions for recycling Intel&reg; NUCs, Intel&reg; Compute Sticks, and Intel&reg; Compute Cards in select states within the United States"
full_description = 'BUILT IN - ARTICLE INTRO SECOND COMPONENT x Close Window INTEL = window.INTEL || {}; INTEL.SupportSettings = window.INTEL.SupportSettings ||{}; INTEL.SupportSettings["category_virtual_assistant.vaContextMessages.exitqueue"] = "Exit Queue"; INTEL.SupportSettings["category_virtual_assistant.vaContextMessages.waitingforliveagent"] = "Waiting for live agent"; INTEL.SupportSettings["geoattributes.articleLocalesForModal"] = "\/cn\/zh\/,\/tw\/zh\/,\/jp\/ja\/,\/kr\/ko\/,\/de\/de\/,\/fr\/fr\/,\/it\/it\/,\/br\/pt\/,\/ru\/ru\/,\/xl\/es\/,\/es\/es\/,\/ca\/fr\/,\/tr\/tr\/,\/th\/th\/,\/vn\/vi\/,\/id\/id\/,\/pl\/pl\/"; INTEL.SupportSettings["category_virtual_assistant.vaContextMessages.chattingwithliveagent"] = "Chatting with a live agent"; INTEL.SupportSettings["category_virtual_assistant.vaContextMessages.endChat"] = "End Chat"; INTEL.SupportSettings["category_virtual_assistant.vaContextMessages.linkAltText"] = "Live Chat and Virtual Assistant"; Summary Instructions for recycling Intel® NUCs, Intel® Compute Sticks, and Intel® Compute Cards in select states within the United States Description Does Intel offer any recycling service? Resolution In the US, Intel offers its customers residing in Michigan, Missouri, New York, North Carolina, or Utah a free mail-back recycling program for Intel® NUC, Intel® Compute Stick, and Intel® Compute Card products through Reverse Logistics Group (RLG). To participate and receive a free shipping label, follow the instructions below. When you receive the shipping label, pack the covered electronic device, affix the label, and send it in for responsible recycling. Go to the Request a mail-back label from RLG link.Follow the instructions for how to recycle your device. Once you have sent the device for recycling, it is no longer secure. You should reset devices to their factory settings and clear your data before recycling. Instructions for most devices are available online. Your local recycling facility can give you more information. {"@context": "https://schema.org","@type": "FAQPage","mainEntity": [{"@type": "Question","name": "<p>Does Intel offer any recycling service?</p>","acceptedAnswer": {"@type": "Answer","text": "<p>In the US, Intel offers its customers residing in Michigan, Missouri, New York, North Carolina, or Utah a free mail-back recycling program for Intel® NUC, Intel® Compute Stick, and Intel® Compute Card products through Reverse Logistics Group (RLG). To participate and receive a free shipping label, follow the instructions below. When you receive the shipping label, pack the covered electronic device, affix the label, and send it in for responsible recycling.</p> <ol><li><strong>Go</strong> <strong>to </strong>the <a href="https://portal.rlgamericas.com/TRCS/RequestMailback.aspx?f=180346" target="_blank">Request a mail-back label from RLG</a> link.</li><li><strong>Follow</strong> the instructions for how to recycle your device.</li></ol> <p>Once you have sent the device for recycling, it is no longer secure. You should reset devices to their factory settings and clear your data before recycling. Instructions for most devices are available online. Your local recycling facility can give you more information.</p>"}},]} Additional information For New York residents: In New York State, Intel is a member of the RLG Collective Electronic Waste Acceptance Program registered with the State Department of Environmental Conservation and in compliance with the New York State Electronic Equipment Recycling and Reuse Act. This program provides convenient methods for consumers of Covered Electronic Equipment to return their products at end of life for environmentally sound recycling. Learn more about the RLG Collective Electronic Waste Acceptance Program Summary Description Resolution Additional information'
