ackground: #f7f7f7;} .content-table-component-react {background-color: #F7F7F7 !important;} /*fix disclaimer padding */ div.disclaimer.parbase {padding-bottom: 0em !important;} /*fix cta index value */ .atomCta {z-index: 1 !important;} /*Item List Blade lessen top padding*/ .rwd .item-list-blade .blade-list.ws-comp-v-padding { padding-top: 1rem; padding-bottom: 1rem; } /*fix multi-asset multi buttons*/ .button-blue-light { position: relative; border-radius: 0; padding: 0.625rem 1.5rem; font-size: 1rem; line-height: 1.25; border-width: 0; white-space: normal; color: #fff; background-color: #0068b5; } /*not sure*/ .owl-stage-outer {padding-bottom: 0px;} /*bullet normalize*/ .rwd .promotions .blade-item-content ul { padding-inline-start: 16px; } ul { padding-inline-start: 16px; } /*color block margin fix*/ .rwd .atom-color-block .marquee-content{ margin-left: 0px !important; margin-right: 0px !important; } /*one column half-style*/ .rwd .one-column.half-fill .container-fluid { padding: 80px 0; width: 70%; } .syndication-container { background-color: #f7f7f7 !important; padding-top: 0 !important; padding-bottom: 0 !important; window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Unleash Growth with the Power of AI through Distributed Computing To harness the power of data, organizations require intelligent systems built on the latest edge-to-cloud architecture and using integrated silicon, software, and system components. Such a system should enable the distribution of workloads across compute resources in different locations, from the edge to the cloud and the networks that connect them. This flexibility allows organizations to process and use data where and when they need it, unlocking the full potential of insights at their disposal. Learn More What's New Get the latest information and news directly from Intel. INTEL = window.INTEL || {}; INTEL.I18n = window.INTEL.I18n ||{}; INTEL.I18n["category_grdc.technicallibrary.detailsLabel"] = "Details"; INTEL.I18n["category_grdc.technicallibrary.viewAllDocumentsLabel"] = "View all documents"; INTEL.I18n["category_grdc.technicallibrary.bookmarkThisItemLabel"] = "Bookmark this item"; View All Tools Training and Certification Guided by industry experts, Intel® Cloud.University (Intel® Cloud.U) provides user-focused, interactive training that goes beyond tactical cloud services to deliver broad cloud skills and knowledge. View All Cloud Training & Certification Cloud Technical Professional Certification Gain the technical knowledge, skills, and expertise you need to design, implement, and manage cloud-based solutions that are scalable, secure, and cost-effective. Download the Course Catalog Cloud Solutions Architect Certification Completion of this curriculum equips you with expert-level knowledge of cloud instance details, topics, and solutions. This curriculum is optimized for cloud solution architects with at least two years of experience implementing solutions in the cloud. Download the Course Catalog Cloud Development Competencies Expand your industry knowledge and gain technical expertise on specific products, business segments, and technologies. These focused courses take between three to seven hours to complete, and you'll be awarded a digital badge that you can use to show your expertise in the topic. Enroll Now Show more Show less INTEL = window.INTEL || {}; INTEL.I18n = window.INTEL.I18n ||{}; INTEL.I18n["category_grdc.technicallibrary.detailsLabel"] = "Details"; INTEL.I18n["category_grdc.technicallibrary.viewAllDocumentsLabel"] = "View all documents"; INTEL.I18n["category_grdc.technicallibrary.bookmarkThisItemLabel"] = "Bookmark this item"; Community Intel Tiber AI Cloud Forum GitHub* Docker* .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Products What's New Tools Training Documentation Community Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/