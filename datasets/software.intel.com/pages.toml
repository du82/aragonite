["https://software.intel.com/content/www/us/en/privacy/intel-cookie-notice.html"]
title = "Intel Cookies and Similar Technologies Notice"
description = "Outlines the use of cookies and similar practices by Intel, partners, and third parties on Intel web sites, including options regarding cookies."
full_description = '''var intel = intel || {}; intel.globalMasthead = { campaignPath: '', allTeasers: '' }; Intel Privacy Notice Intel Cookies Notice Contact Us Binding Corporate Rules LAST UPDATED: September 2023 This Notice updates and supersedes previous versions. We may change this Notice at any time, effective when we make the updated Notice available via the Sites (as defined below). Our Sites use Cookies and Similar Technologies (as defined below) for various purposes, including to ensure that we give our visitors the best possible experience by providing you with personalized content, remembering your marketing preferences, and helping you to obtain the right information on our Sites. You can find out more about Cookies and Similar Technologies, how we use them as well as your rights to control our use of them below. You can manage your preferences in relation to Cookies and Similar Technologies used on our Sites by using the Manage Cookie Settings tool. What are Cookies? Cookies are small files—usually consisting of letters and numbers—placed on your computer, tablet, phone, or similar device, when you use that device to visit a web site. Cookies are widely used by website owners to make their web sites operate, work more efficiently, and provide analytic information. Cookies may be placed on your device by Intel and third parties. We recommend using the Manage Cookie Setting tool to express your cookie choices. Use of Cookies and Similar Technologies This Notice describes how Intel, our vendors, and other third parties on our behalf use Cookies and Similar Technologies (such as pixel tags, web beacons, clear GIFs, JavaScript, and local storage) ("Cookies") in connection with communications sent by Intel or on our behalf and the websites (including mobile websites and apps) owned and controlled by Intel (the “Sites”). The Intel Privacy Notice will apply in addition to this Notice where we collect and use personal information through the Cookies. Listed below are the different categories of Cookies that Intel and vendors on our behalf may use on our Sites. Strictly Necessary Cookies. These technologies are necessary for the Intel experience to function and cannot be switched off in our systems. The technology is usually only set in response to actions made by the device owner which amount to a request for services, such as setting privacy preferences, logging in, filling in forms, maintaining secure login areas, maintaining state across pages (remembering items in a shopping basket), and server load balancing. The device owner can set their preference to block or alert Intel about these technologies, but some parts of the Intel experience will not work. These technologies do not store any personally identifiable information. Analytics Cookies. These technologies allow Intel to count device visits and traffic sources, so Intel can measure and improve the performance of our experiences. The technology helps Intel to know which experiences are the most and least popular and see how device owners interact with the experience. All information these technologies collect is aggregated. If the device owner does not allow these technologies, then Intel will not know when the device owner visited or how the device owner interacted with our experiences. Functional Cookies. These technologies enable the Intel experience to provide enhanced functionality and personalization. The technology may be set by Intel or by third-party providers whose services Intel have added to our experiences. If the device owner does not allow these technologies, then some or all of these services may not function properly for the device owner. Ad Targeting Cookies. These technologies may be set through our Intel experience or by our advertising partners. The technology may be used to build a profile of the device owner’s interests and show the device owner relevant advertisements on other experiences. The technology does not store directly personal information on the device, but the technology is based on uniquely identifying the device. If the device owner does not allow these technologies, then the device owner will experience less targeted advertising. How Long do Cookies Stay on My Device? Some Cookies operate from the time you visit a Site until the end of that particular browsing session. These "session" Cookies expire and are automatically deleted when you close your Internet browser. Some Cookies stay on your device between browsing sessions—these "persistent" Cookies do not expire when you close your browser. The length of time a persistent Cookie stays on your device varies from Cookie to Cookie. How does Intel Provide Online and Mobile Advertising? We and our vendors, and our other third parties, engage in interest-based advertising to deliver advertisements and personalized content that we and other advertisers believe will be of interest to you. Third party vendors will be responsible for their own use of personal information collected through the Cookies. Advertisements may be delivered to you based on your online or mobile behavior (on Intel Sites and non-Intel sites), your search activity, your responses to one of our advertisements or communications, the pages you visit, your general geographic location, or other information. These ads may appear on our Sites or on third party websites. The vendors with whom we work to help us conduct interest-based advertising may be members of self-regulatory associations such as the Network Advertising Initiative (NAI) and the Digital Advertising Alliance (DAA). For Sites directed at persons located in the European Union, we may work with vendors who are members of the European Digital Advertising Alliance (eDAA). You may also see advertisements for third parties on Intel Sites or other websites or properties, based on your visits to, and activities on, Intel Sites and other sites. See "How do I Manage Cookies?" below for information on how to opt out of advertising cookies. How do I Manage Cookies? You can decide whether or not to accept Cookies. One way you can do this is through your Internet browser’s settings. Most Internet browsers allow some control of Cookies through the browser settings. If you use your browser settings to block all Cookies you may not be able to access parts of our Sites. The following links take you to information on how to manage the Cookies settings on some popular browsers: Apple Safari Google Chrome Microsoft Internet Explorer and Microsoft Edge Mozilla Firefox You can manage your preferences in relation to Cookies and Similar Technologies served on our Sites using the Manage Cookie Settings tool. You can also use a browser plug-in such as Ghostery from Cliqz International GmbH to turn off Cookies. You can opt out of the use of Cookies to tailor content or advertising to you by visiting the links below. Note that if you choose to opt out, you won’t necessarily see fewer ads. However, the ads you see may be less relevant to your interests. http://www.networkadvertising.org/managing/opt_out.asp http://www.aboutads.info/choices What about Similar Tracking Technologies? Cookies are not the only way to recognize or track visitors to a website. Intel may use other, similar technologies from time to time, like web beacons (sometimes called "tracking pixels" or "clear gifs"). These are tiny graphics files that contain a unique identifier that enable us to recognize when someone has visited our Sites or opened a communication that we have sent them. This enables us to assess the effectiveness of communications. In many instances, these technologies are reliant on cookies to function properly, and so declining cookies will impair their functioning. How does Intel respond to privacy-preference signals? If you visit an Intel Site or service using a device with a United States IP address and a privacy-preference signal enabled (e.g., Do Not Track, Global Privacy Control), Intel will not collect device information for the purpose of Ad Targeting uses. If you have more than one device, you will need to configure all devices with your privacy-preferences. For more information, you can visit the Ad Targeting category found in the Manage Cookie Setting tool and review your Ad Targeting and Sharing Choices. Privacy at Intel Intel is committed to privacy. For more information about Intel's approach to privacy see our Intel Privacy Notice and the Intel Code of Conduct. How to Contact Us If you have any questions about how Intel uses Cookies, you can contact us by using the Contact Us form or send a letter to the mailing address below. Please include your contact information, the name or hyperlink of the Intel Site or service, and a description of your Cookie request. Intel Corporation ATTN: Privacy M/S RNB4-145 2200 Mission College Blvd. Santa Clara, CA 95054 USA Privacy Notice Links Candidate Notice Intel® Active Management Technology Notice .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/250114/intel/clientlibs/pages/get-help.min.css" type="text/css">'''
