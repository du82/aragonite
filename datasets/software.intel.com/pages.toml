title = "Work and Life at Intel"
description = "Darryl Adams’ mission to make a more accessible PC started with an epiphany in the Intel cafeteria in 2007. Adams was meeting his colleague to discuss a new passion project: a device that would scan printed text and read it out loud for those with severe dyslexia, like his colleague, or visual impairment, like Adams."
full_description = '''window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); var intel = intel || {}; intel.globalMasthead = { campaignPath: '', allTeasers: '' }; Discover your place in our world-changing work At Intel, we innovate, we inspire, and we lead by bringing people together from across the globe, united in pushing the boundaries of technology. To us, those boundaries are opportunities. Opportunities to show what we’re capable of. Opportunities to develop life-altering breakthroughs. Opportunities for us to shine, to keep learning, and to further our careers. Menu Career Paths Benefits Corporate Social Responsibility We Are Intel Blog Your registration cannot proceed. The materials on this site are subject to U.S. and other applicable export control laws and are not accessible from all locations. Work you can be proud of Work you can be proud of Anshul Sonak, Principal Engineer A culture of support A culture of support Payal Patel, Digital Marketing Specialist Abundant opportunities to grow Abundant opportunities to grow Brea Watts, Communications Manager window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $(document).ready(function(){ intel.bcLazyLoader.addPlayer({ elementID: "brightcovePlayer_1", playerID: "734546229001", playerKey: "default", videoID: "6337372406112", muted: false, looped: false, autoStart: false, placeholderID: "1", poster: "", captionLocale: "en" }); });}},100);})();}); window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $.ajax({url: "//players.brightcove.net/734546229001/default_default/index.min.js", dataType: "script", cache: true}) .done(function(){ $(document).trigger("intel:brightcove:bcScriptLoaded"); });}},100);})();}); window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $(document).ready(function(){ intel.bcLazyLoader.addPlayer({ elementID: "brightcovePlayer_2", playerID: "734546229001", playerKey: "default", videoID: "6337371512112", muted: false, looped: false, autoStart: false, placeholderID: "2", poster: "", captionLocale: "en" }); });}},100);})();}); window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Love your job. Live your life. Here, your life-life is just as important as your work-life. A career at Intel comes with benefits and programs that support your physical, mental, and financial well-being. In other words, we go all in so you can do the same. Company Overview window.addEventListener('load', function() {(function(){var id=setInterval(function(){if(intel.bcLazyLoader){clearInterval(id); $(document).ready(function(){ intel.bcLazyLoader.addPlayer({ elementID: "brightcovePlayer_3", playerID: "734546229001", playerKey: "default", videoID: "6336339657112", muted: false, looped: false, autoStart: false, placeholderID: "3", poster: "", captionLocale: "en" }); });}},100);})();}); Inclusive, Welcoming Environment We’ve created a place where you can grow and evolve, alongside inspiring teams. Find Community Challenging and Rewarding Work Solve challenging problems and help develop technology that changes the world. Explore Careers Supportive Benefits and Programs Our flexible work options are here to meet your needs both at work and home. Learn Benefits Join Us What better place to build your future than with the team creating it? Search Locations Championing Inclusive PC Design Darryl Adams’ mission to make a more accessible PC started with an epiphany in the Intel cafeteria in 2007. Adams was meeting his colleague to discuss a new passion project: a device that would scan printed text and read it out loud for those with severe dyslexia, like his colleague, or visual impairment, like Adams. Learn more Choosing My Rotation A two-year program, the Sales and Marketing Rotation Program is an invaluable experience for early professionals just graduating or looking to explore new experiences. “It allowed me to kickstart my career with integration into prominent teams and established high-impact relationships.” Learn more Mastering the AI Frontier From California to Bangalore, from student to executive leader, Srinivas is an industry veteran and inspiration to many. We recently met him to understand what kept him motivated for more than two decades and his reason for believing in Intel regaining its tech leadership. Learn more Saving the Desert with Drones Watch how Intel volunteers are using drones and AI to help the McDowell Sonoran Conservancy eliminate an environmental threat that causes wildfires and chokes native plants in the Arizona desert. Learn more Follow #IAmIntel Stay up to date on the latest employee features from around the world on @WeAreIntel channels. Amy's Leadership, USA Olga's Active Wellness, Germany Technician's Work-Life Balance, Costa Rica Safety Lab's Innovation, Taiwan Vanessa's Internship, USA Intel Vitality's Community, India Intel Involved's Creativity, Malaysia Tal's Team Spirit, Israel Intel Involved's Impact, India Show more Show less .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Why Intel? Join Us Our Voices Follow #IAmIntel Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/250114/intel/clientlibs/pages/get-help.min.css" type="text/css">'''
