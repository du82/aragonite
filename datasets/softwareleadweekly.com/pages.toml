title = "SoftwareLeadWeekly: A free weekly email for curious humans who want to build better teams and companies."
description = "A free weekly email for busy people who care about people, culture, management and leadership. For managers and technical leads who do not want to appear on the next Dilbert issue."
full_description = '''Need a sneak peek? Check out the latest issue or browse the archive. What Our Readers Say Join 31,020 people who enjoy receiving our weekly email "SWLW is one of the only currated emails re: entrepreneurship, engineering & getting things done that I don't have the urgency to delete. So much great stuff in a single mailing makes it worthwhile." Eden Shochat ( @eden) Equal Partner at Aleph VC. "If you already understand that Software Development is actually about Culture and People, you'll really enjoy reading softwareleadweekly.com" Uri Nativ ( @unativ) VP Engineering at Klarna. "Every week, softwareleadweekly.com makes me think - how can I be a better team leader. #WIN" Aviel Lazar ( @aviellazar) Mobile Team Lead at Chegg. "If you are in a leading position (or want to be in one) softwareleadweekly.com is a great place to read about culture and leadership." Aviran Mordo ( @aviranm) Server Group Manager at Wix. "Software Lead Weekly is an excellent source of interesting leadership and management stories, with content for the small team leads to the large enterprise managers." Ran Tavory ( @rantav) CTO at Social Studios TV. "I read softwareleadweekly every week and really enjoy and learn from it. As someone who leads HR, I know how important it is to be pay extra attention to people and culture. Thanks for sharing such a great newsletter!" Daphna Michaeli Sr. Director of HR at Outbrain. "Software Lead Weekly is invaluable. Fantastic weekly email about people, culture and leadership. Highly recommended." Brian Wang ( @brianmwang) CEO at FITOCRACY. "The weekly leadership newsletter from @orenellenbogen saves me so much time-all great links about mgmtt in one email. http://softwareleadweekly.com/" Alexander Grosse ( @klangberater) VP Engineering at SoundCloud. "Becoming big fan of @orenellenbogen's softwareleadweekly.com. Too few tools out there for those trying to become a better tech lead/manager." Ben Kamens ( @kamens) Lead dev at Khan Academy. "I’ve been getting Software Lead Weekly for a few weeks now. Excellent content. h/t @orenellenbogen" Michele Titolo ( @micheletitolo) Funemployed iOS Lead, WomenWhoCode CTO at Speaker. "Software Lead Weekly is the best-curated and most consistently excellent mailing list I've been on. I was a somewhat new manager when I subscribed, so it really helped expand my notions of management and find my personal style." Bill Hewitt Engineering Manager at Yelp. "If you build software and work with people, I strongly recommend following @orenellenbogen and subscribing to http://softwareleadweekly.com/" Darragh Curran ( @darraghcurran) VP Engineering at Intercom. You deserve a beautiful t-shirt! Wear it to your next meeting at work, people will love it. Shop now!'''
