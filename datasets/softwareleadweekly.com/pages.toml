["https://softwareleadweekly.com/about"]
title = "About - Software Lead Weekly"
description = "A free weekly email for busy people who care about people, culture, management and leadership. For managers and technical leads who do not want to appear on the next Dilbert issue."
full_description = '''The Story Behind SWLW Like many other great ideas, it came up while drinking beers with my good friend Aviel Lazar, exchanging our favorite weekly (techie) newsletters. It suddenly came to me that creating a newsletter focused on software leadership and management, could be of value to like-minded professionals, passionate about such challenges. It was probably the beer talking, but hey, this is something I'm truly in to and I'm reading 50+ articles every week anyway, so why not pick the very best and send it to my peers? One hour of ruthless, alcohol driven development later, using AppHarbor & MailChimp, and everything was up and running! My goal? save you precious time by delivering high quality content directly to your inbox, every week. Follow @orenellenbogen About Oren Ellenbogen Currently serving a great team as the VP Engineering at Forter. Previously worked at Commerce Sciences (acquired by Taboola), Delver (acquired by Sears), Mercury (acquired by HP), Israeli Air Force and various small startups as freelancer (ages 16 to 18, before joining the army). Trying to share what I've learned so far... Author of Leading Snowflakes, the Engineering Manager Handbook – Practical tools and techniques for programmers who want to lead. Writing a blog about engineering, culture, leadership, management & startups. Lecturing about "The Leadership Role @ the Agile era" (at Outbrain, Google and ILTechTalks). Lecturing about "12 Leadership Hacks For Building Great Teams" (at Conduit and ILTechTalks). Helping out on Quora (e.g. What are good ways of quantifying code quality?, As a manager, how do you handle low morale in your team?, How do you fire someone everybody likes?). Subscribe now & join our community! Subscribe Oh and don't worry, this whole thing has a 0% forecast of spam.'''
author = "Oren Ellenbogen"
year_published = 2025
clearnet = "https://softwareleadweekly.com/about"
tags = ["behind", "community!", "culture", "ellenbogen", "far...", "i've", "join", "lead", "leadership", "learned"]
language = "en"
