["https://solana.com/docs/intro/installation"]
title = "Install the Solana CLI and Anchor | Solana"
description = "A guide to setting up your local Solana development environment. Learn how to install Rust, the Solana CLI, and Anchor Framework on Windows (WSL), Linux, and Mac."
full_description = '''Solana DocumentationInstallationThis section covers the steps to set up your local environment for Solana development. Quick Installation On Mac and Linux, run this single command to install all dependencies. Terminal$ curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/solana-developers/solana-install/main/install.sh | bashCopy Windows Users: You must first install WSL (see Install Dependencies). Then run the command above in the Ubuntu (Linux) terminal. After installation, you should see output similar to the following: Installed Versions: Rust: rustc 1.85.0 (4d91de4e4 2025-02-17) Solana CLI: solana-cli 2.1.14 (src:3ad46824; feat:3271415109, client:Agave) Anchor CLI: anchor-cli 0.30.1 Node.js: v23.8.0 Yarn: 1.22.1 If the quick installation command above doesn't work, please refer to the Install Dependencies section below for instructions to install each dependency individually.If the quick install command runs successfully, skip to the Solana CLI Basics and Anchor CLI Basics sections below. Install Dependencies The instructions below will guide you through installing each dependency individually. Windows users must first install WSL (Windows subsystem for Linux) and then install the dependencies specified in the Linux section below. Linux users should first install the dependencies specified in the Linux section below. Mac users should start with the Rust installation instructions below. Windows Subsystem for Linux (WSL)Linux Install RustSolana programs are written in the Rust programming language.The recommended installation method for Rust is rustup.Run the following command to install Rust:Terminal$ curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -yCopyYou should see the following message after the installation completes:Successful Rust Install MessageRun the following command to reload your PATH environment variable to include Cargo's bin directory:Terminal$ . "$HOME/.cargo/env"CopyTo verify that the installation was successful, check the Rust version:Terminal$ rustc --versionCopyYou should see output similar to the following:rustc 1.84.1 (e71f9a9a9 2025-01-27)Install the Solana CLIThe Solana CLI provides all the tools required to build and deploy Solana programs.Install the Solana CLI tool suite using the official install command:Terminal$ sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"CopyYou can replace stable with the release tag matching the software version of your desired release (i.e. v2.0.3), or use one of the three symbolic channel names: stable, beta, or edge.If it is your first time installing the Solana CLI, you may see the following message prompting you to add a PATH environment variable:Close and reopen your terminal to apply the PATH changes or run the following in your existing shell: export PATH="/Users/test/.local/share/solana/install/active_release/bin:$PATH"LinuxMacIf you are using a Linux or WSL terminal, you can add the PATH environment variable to your shell configuration file by running the command logged from the installation or by restarting your terminal.Terminal$ export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"CopyTo verify that the installation was successful, check the Solana CLI version:Terminal$ solana --versionCopyYou should see output similar to the following:solana-cli 2.0.26 (src:3dccb3e7; feat:607245837, client:Agave)You can view all available versions on the Agave Github repo.Agave is the validator client from Anza, formerly known as Solana Labs validator client.To later update the Solana CLI to the latest version, you can use the following command:Terminal$ agave-install updateCopyInstall Anchor CLIAnchor is a framework for developing Solana programs. The Anchor framework leverages Rust macros to simplify the process of writing Solana programs.There are two ways to install the Anchor CLI and tooling: Anchor Version Manager (AVM) - Recommended installation method Without AVM - Install directly from GitHub AVMWithout AVMThe Anchor version manager (AVM) allows you to install and manage different Anchor versions on your system and easily update Anchor versions in the future.Install AVM with the following command:Terminal$ cargo install --git https://github.com/coral-xyz/anchor avm --forceCopyCheck that AVM was installed successfully:Terminal$ avm --versionCopyInstall the latest version of Anchor CLI using AVM:Terminal$ avm install latest Copy$ avm use latestCopyAlternatively, you can install a specific version of Anchor CLI by specifying the version number:Terminal$ avm install 0.30.1 Copy$ avm use 0.30.1CopyDon't forget to run the avm use command to declare which Anchor CLI version should be used on your system. If you installed the latest version, run avm use latest. If you installed the version 0.30.1, run avm use 0.30.1. To verify that the installation was successful, check the Anchor CLI version:Terminal$ anchor --versionCopyYou should see output similar to the following:anchor-cli 0.30.1When installing the Anchor CLI on Linux or WSL, you may encounter this error:error: could not exec the linker cc = note: Permission denied (os error 13)If you see this error message: Install the dependencies listed in the Linux section at the top of this page. Retry installing the Anchor CLI. Node.js and YarnNode.js and Yarn are required to run the default Anchor project test file (TypeScript) created with the anchor init command. (Rust test template is also available using anchor init --test-template rust)Node InstallationYarn InstallationWhen running anchor build, if you encounter the following errors:error: not a directorylock file version 4 requires `-Znext-lockfile-bumpAfter applying the solution above, attempt to run anchor build again.When running anchor test after creating a new Anchor project on Linux or WSL, you may encounter the following errors if Node.js or Yarn are not installed:Permission denied (os error 13)No such file or directory (os error 2) Solana CLI Basics This section will walk through some common Solana CLI commands to get you started. Solana ConfigTo see your current config:Terminal$ solana config getCopyYou should see output similar to the following:Config File: /Users/test/.config/solana/cli/config.yml RPC URL: https://api.mainnet-beta.solana.com WebSocket URL: wss://api.mainnet-beta.solana.com/ (computed) Keypair Path: /Users/test/.config/solana/id.json Commitment: confirmedThe RPC URL and Websocket URL specify the Solana cluster the CLI will make requests to. By default this will be mainnet-beta.You can update the Solana CLI cluster using the following commands:Terminal$ solana config set --url mainnet-beta Copy$ solana config set --url devnet Copy$ solana config set --url localhost Copy$ solana config set --url testnetCopyYou can also use the following short options:Terminal$ solana config set -um # For mainnet-beta Copy$ solana config set -ud # For devnet Copy$ solana config set -ul # For localhost Copy$ solana config set -ut # For testnetCopyThe Keypair Path points to the default Solana wallet (keypair) used by the Solana CLI to pay transaction fees and deploy programs. By default, this file is stored at ~/.config/solana/id.json.Create WalletTo send transactions using the Solana CLI, you need a Solana wallet funded with SOL.To generate a keypair at the default Keypair Path, run the following command:Terminal$ solana-keygen newCopyYou should see output similar to the following:Generating a new keypair For added security, enter a BIP39 passphrase NOTE! This passphrase improves security of the recovery seed phrase NOT the keypair file itself, which is stored as insecure plain text BIP39 Passphrase (empty for none): Wrote new keypair to /Users/test/.config/solana/id.json =========================================================================== pubkey: 8dBTPrjnkXyuQK3KDt9wrZBfizEZijmmUQXVHpFbVwGT =========================================================================== Save this seed phrase and your BIP39 passphrase to recover your new keypair: cream bleak tortoise ocean nasty game gift forget fancy salon mimic amazing ===========================================================================If you already have a file system wallet saved at the default location, this command will NOT override it unless you explicitly force override using the --force flag.To view your wallet's address (public key), run:Terminal$ solana addressCopyAirdrop SOLRequest an airdrop of SOL to your wallet to pay for transactions and program deployments.Set your cluster to the devnet:Terminal$ solana config set -udCopyThen request an airdrop of devnet SOL:Terminal$ solana airdrop 2CopyDevnet airdrops are limited to 5 SOL per request. If you hit rate limits or encounter errors, try using the Web Faucet instead.To check your wallet's SOL balance, run the following command:Terminal$ solana balanceCopyRun Local ValidatorThe Solana CLI includes a built-in test validator for local development.In a separate terminal, run the following command to start a local validator:Terminal$ solana-test-validatorCopyRemember to also update your CLI to use localhost before running Solana CLI commands:Terminal$ solana config set -ulCopy Anchor CLI Basics This section will walk through some common Anchor CLI commands to get you started. For more information on the Anchor CLI, see the Anchor documentation. Initialize ProjectTo create a new Anchor project, run the following command:Terminal$ anchor init <project-name>CopyFor example, to create a project called my-project, run:Terminal$ anchor init my-projectCopyThis command creates a new directory with the project name and initializes a new Anchor project with a basic Rust program and TypeScript test template.Navigate to the project directory:Terminal$ cd <project-name>CopySee the Anchor project's file structure.Build ProgramTo build your project, run the following command:Terminal$ anchor buildCopyThe compiled program can be found in the /target/deploy directory.Deploy ProgramTo deploy your project, run the following command:Terminal$ anchor deployCopyThis command will deploy your program to the cluster specified in the Anchor.toml file.Test ProgramTo test your project, run the following command:Terminal$ anchor testCopyThis command builds, deploys, and runs the tests for your project.When using localnet as the cluster in Anchor.toml, Anchor automatically starts a local validator, deploys your program, runs tests, and then stops the validator.PreviousComposing Multiple ProgramsNextCore Concepts'''
year_published = 2025
clearnet = "https://solana.com/docs/intro/installation"
