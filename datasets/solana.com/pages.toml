full_description = 'Brand & PressWelcome to Solana Brand & Marketing pageFollow these guidelines when promoting Solana in marketing communications, including advertising, articles, websites, and printed promotions.For full brand guidelines please see Solana Foundation Brand Guidelines.Solana BrandLogotypeSolana’s wordmark is constructed from custom-built, modular type. The angular and uniform lettering takes cues from 1980s tech aesthetics, updated to feel fresh and futuristic. The logomark is created by stacking three identical parallelograms. It conveys speed and celebrates the concept of building.ClearspaceA certain amount of space is needed around the logomark to prevent it from becoming cluttered by surrounding artwork, images, or the edge of a page. Below are the minimum spacings for both logomark and wordmark.<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fspacing.f0b480df.png&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fspacing.f0b480df.png&amp;w=3840&amp;q=75"/>Logo Dont’sHere are some things you should never do with the Solana logomark.Don’t add shadows behind the logoDon’t add outlines to the logoDon’t stretch the logoDon’t apply logo in low resolutionDon’t use logo as a frame for imageryDon’t place on low contrast colorsColorssolana gradientPNG<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="gradient" srcSet="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2FsolanaGradient.a3ffa3d4.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image?url=%2F_next%2Fstatic%2Fmedia%2FsolanaGradient.a3ffa3d4.jpg&amp;w=3840&amp;q=75"/>solana purple#9945FFsolana green#14F195AssetsDownload assetsMain logotypePNGSVGLogomarkPNGSVGWordmarkPNGSVGVertical lockupPNGSVGFoundation logotypePNGSVGPress inquiriesPlease direct inquiries to press@solana.org.ContentsBrand guidelinesAsset downloadsPress inquiries'
