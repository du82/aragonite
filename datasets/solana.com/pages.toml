n prioritiesHow to Optimize Compute RequestedJavaScriptImprove transaction efficiencyOffline TransactionsJavaScriptHandle offline operations Account Management Learn how to manage Solana accounts effectively. GuideClientDescriptionHow to Create an AccountJavaScriptCreate new Solana accountsHow to Calculate Account Creation CostJavaScriptEstimate account costsHow to Create a PDA's AccountJavaScript, RustWork with PDAsHow to Sign with a PDA's AccountRustPDA signing operationsHow to Close an AccountRustRemove accountsHow to Get Account BalanceJavaScriptCheck account balances Program Development Develop Solana programs with these comprehensive guides. GuideClientDescriptionHow to Transfer SOL in a Solana ProgramRustProgram-based SOL transfersHow to Get Clock in a ProgramRustAccess program clockHow to Change Account SizeRustModify account sizesHow to Do Cross Program InvocationRustCPI operationsHow to Create a Program Derived AddressRustGenerate PDAsHow to Read Accounts in a ProgramRustAccount data accessReading Multiple InstructionsRustHandle multiple instructionsHow to Verify Accounts in a Solana ProgramRustAccount verification Token Operations Comprehensive guides for working with tokens on Solana. GuideClientDescriptionHow to Create a TokenJavaScriptCreate new tokensHow to Get a Token MintJavaScriptAccess token mintsHow to Create a Token AccountJavaScriptSet up token accountsHow to Get a Token AccountJavaScriptRetrieve token accountsHow to Get a Token Account's BalanceJavaScript, RustCheck token balancesHow to Mint TokensJavaScriptCreate new tokensHow to Transfer TokensJavaScriptMove tokens between accountsHow to Burn TokensJavaScriptRemove tokens from circulationHow to Close Token AccountsJavaScriptClean up token accountsHow to Set Authority on Token Accounts or MintsJavaScriptManage token permissionsHow to Delegate Token AccountsJavaScriptSet up token delegationHow to Revoke a Token DelegateJavaScriptRemove delegatesHow to Use Wrapped SOLJavaScriptWork with wrapped