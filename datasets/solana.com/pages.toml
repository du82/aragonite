["https://solana.com/news/case-study-boba-guys"]
title = "Case Study: Boba Guys Build Loyalty with Blockchain | Solana"
description = "Passport, a loyalty program built on the Solana network from Boba Guys, saw an 800% return on investment."
full_description = '''.css-h47494{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}.css-eb7wpp.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-6r6a89.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;background-color:rgba(20,203,241,0.17);padding-top:20px;padding-left:20px;padding-right:20px;padding-bottom:20px;opacity:1;border-radius:20px;}HighlightsIn 2023, tea retailer Boba Guys developed "Passport," a blockchain-based loyalty program that goes beyond traditional models, featuring gamification, exclusive rewards and digital collectibles.The Passport program relies on Solana’s fast transaction-processing capabilities, which enable it to manage high-volume, small-scale transactions in retail settings.The Passport program saw 15,000 users join in its first 80 days, with at least one Boba Guys location now reporting as many as 70% of orders made through the program since its launch.A pilot of the program was a success for Boba Guys — a 67% increase in monthly visits, a 65% increase in monthly spending, and an 800% return on investment..css-bo33vx.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;padding-top:20px;}When you think of retail rewards programs, you might envision stale punch cards or confusing airline points lacking in real incentives. However, the innovative approach taken by Boba Guys with the Solana blockchain paints a different picture of what’s possible.Founded 12 years ago, Boba Guys is a primarily brick-and-mortar business with 20 locations across the Bay Area, Los Angeles and New York. The company is known for its innovation and customer-focused approach in the industry — so when it was time for the company to launch a loyalty program in 2023, founders Bin Chen and Andrew Chau wanted to transcend the conventional models they were tired of seeing. "We always felt like the traditional loyalty programs out there were just basically glorified digital punch cards,” said Chen. By building on Solana, the Boba Guys Passport program can do a lot more. The program rewards participating customers in interactive ways, earning them points for every visit, along with gamified features like loot boxes and loyalty tiers that unlock secret menu items — all improved by using blockchain technology.Improving the retail rewards experience with Solana.css-42wmhm.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;}.css-1fuo4gk{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;}@media (max-width:991px){.css-1fuo4gk{-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}}.css-1qvjcwz{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;line-height:normal;width:calc(50% - 15px);margin-left:0;}.css-1qvjcwz > .builder-blocks{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}@media (max-width:991px){.css-1qvjcwz{width:100%;margin-left:0;}}While traditional loyalty programs unlock rewards for frequent customers, doing so on the blockchain gives users an advantage. Rewards that a customer earns are first and foremost owned by the customer themselves — no need to worry about lost physical cards or an app shutting down. This also means that users can do what they want with their rewards — they can redeem them, hold onto them, or even sell them on the open market.Building on the blockchain could also unlock interoperability, or the ability for users to interact with other programs using the same chain without any friction — eventually opening up new benefits for Boba Guys customers beyond a free drink. But while interoperability as a concept exists across blockchain networks, Solana has an advantage in that it operates in a single, global state — not as separate layers or networks. That means that any loyalty program built on Solana has a much broader ecosystem to interact with, from NFT projects to real world infrastructure and more. The opportunities are endless..css-li9dfz{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;line-height:normal;width:calc(50% - 15px);margin-left:30px;}.css-li9dfz > .builder-blocks{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}@media (max-width:991px){.css-li9dfz{width:100%;margin-left:0;}}.css-13dfbrw.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;width:100%;min-height:20px;min-width:20px;overflow:hidden;max-width:498px;margin-left:auto;margin-right:auto;margin-top:auto;}.css-12153wi{opacity:1;-webkit-transition:opacity 0.2s ease-in-out;transition:opacity 0.2s ease-in-out;object-fit:cover;object-position:center;position:absolute;height:100%;width:100%;left:0;top:0;}.css-10ytbmo{width:100%;padding-top:66.7%;pointer-events:none;font-size:0;} .css-19h04n.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-bottom:auto;margin-left:auto;margin-right:auto;padding-top:20px;padding-left:20px;padding-right:20px;} Drinks from Boba Guys at an event during NFT NYC, 2023. Photo courtesy of the Solana Foundation. “What’s particularly powerful is Solana’s interoperability and composability. Systems can talk and settle seamlessly, enabling collaboration and sharing benefits across various platforms," said Chen. “To me, the hallmark of any good ecosystem is not just excitement but actual building and shipping.”That, alongside the Solana network’s ability to quickly and reliably process transactions and low transaction fees make it a viable choice for the numerous small-scale transactions typical in a cafe setting. "The transaction fees with Solana are just a fraction of a fraction,” said Chen. “This is crucial, especially when you consider our level of activity. Solana stands out because other ecosystems were just too expensive for real-time, high-frequency business use cases like ours. We needed something with low latency that is cost-effective, and that's where Solana excelled.”Integrating blockchain with point-of-sale retail technologyTo make Passport a success, Chen and Chau knew the team’s choice of blockchain would have to seamlessly integrate with Boba Guys' existing POS system and enhance customer checkout flow. “Because we built a Square integration, we were able to onboard customers right at the register,” Chen said in a recent interview with the Solana Foundation. Rather than asking users to navigate an unwieldy, modern web3 onboarding process, customers can join the program with a simple QR code scan during their transaction. Surprisingly, Chen reports this approach appeals to customers of all ages and is not exclusive to digitally native Gen Z shoppers. "The most eye-opening thing for us has been successfully attracting guests of all ages,” he said. “It's one thing to engage with Gen Z, who intuitively understand technology, but we're a cafe serving a diverse clientele. Some are tech-savvy, others are not. The real test was introducing blockchain technology in a way that's almost invisible to our customers.” A customer using a QR code to purchase drinks from Boba Guys at an NFT NYC event, 2023. Photo courtesy of the Solana Foundation. The rewards are immediate upon signing up, Chen notes: "Customers can sign up very, very quickly and verify with their phone. Immediately they get a welcome reward.”Passport can be added to a person’s Apple Wallet, making it effortless to both pay and accrue rewards with a smartphone through tap-to-pay. "We basically live on a lot of people's Apple Wallets," Chen states, emphasizing the strategic placement. Rapid adoption and an increase in user engagementThe Passport program saw rapid adoption with significant user engagement, with 15,000 new users onboarded in the first 80 days. The first 10,000 Passport users received a digital collectible as a thank-you, with more benefits to follow in future collaborations. As a brick-and-mortar store, Chen says it can be challenging for Boba Guys to reach guests tangibly, but with the Passport program, the team has a method to deliver items and incentives directly to their customers on demand. And it seems to be working: At Boba Guys’ most popular location in Oakland, CA, Chen notes that 70% of orders were made through the Passport program in 2023. The added user engagement also led to higher sales, with Boba Guys seeing significant increases in purchases per month, higher average order values and monthly spends among loyalty program members, as seen in the results of a 2023 pilot program.Boba Guys 'Passport' Pilot Program ResultsAs of Nov. 1, 2023:67%Increase in monthly visits, per customer65%Increase in monthly spending, per customer800%ROILooking ahead, there seems to be an even greater appetite among customers to advance in loyalty tiers, Chen says, with many customers aiming for the highest reward level."The excitement in our program really peaks with the Boba Connoisseur level,” he said. “To qualify, customers need to spend about $400 at Boba Guys annually.”According to Chen, there’s already a “double-digit” number of customers who have reached this coveted status. “For them, we offer secret menus, exclusive merch and air-dropped digital collectibles,” he said.This immensely powerful approach is what Chen considers to be a key factor in mainstreaming web3 and blockchain technology.Looking towards the future of retail with blockchainSo what are the implications for brick-and-mortar retail establishments across the nation? Chen sees them leveraging the blockchain for even more decentralized infrastructure solutions in the future. Chen views the Passport program as both a loyalty program and a stepping stone towards normalizing blockchain technology as a standard item in the retail owner’s toolkit. He also mentions the potential future benefits of blockchain technology, like decentralization, which could offer solutions to common retail problems, such as POS system downtimes.“I think there's something to be said about this idea of decentralization,” he said, alluding to the imperfect nature of centralized financial service providers. “We've had Square go down in the past, and it's extremely disruptive to not be able to take a transaction in our stores and be held kind of hostage to that.”He adds that he doesn’t think web3 payments is “a world that we're going to jump into immediately,” but that it's “prudential” for retail companies to “at least know what's out there.”“Own your own destiny and protect yourself,” he advises.For businesses considering a blockchain rewards program, Chen recommends giving Solana a hard look due to its speed, composability and active ecosystem. He emphasizes the importance of shipping real, usable products rather than getting caught in hype cycles.“Solana's ecosystem is deep and broad, with new products and projects launching almost every week that are genuinely useful in real-world settings,” said Chen. “This constant development is what makes Solana stand out.”Frictionless — and permissionless.Take advantage of the suite of Solana tooling to build better payments rails.Learn more.css-1mvsfya.builder-block{height:0;width:0;display:inline-block;opacity:0;overflow:hidden;pointer-events:none;}'''
