title = "Case Study: Hivemapper decentralizes mapping with better real-time data and community incentives | Solana"
description = "Hivemapper takes advantage of Solana’s scalability to create a community-powered, incentive-driven map."
full_description = '''.css-h47494{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}.css-96q1si.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:20px;}.css-qa2zan.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:0px;padding-left:20px;padding-right:20px;padding-top:20px;padding-bottom:20px;min-height:100px;background-color:rgba(2,2,2,1);border-radius:25px;}.css-c7v8zh{width:100%;-webkit-align-self:stretch;-ms-flex-item-align:stretch;align-self:stretch;-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;box-sizing:border-box;max-width:1200px;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;margin-left:auto;margin-right:auto;}.css-6r6a89.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;background-color:rgba(20,203,241,0.17);padding-top:20px;padding-left:20px;padding-right:20px;padding-bottom:20px;opacity:1;border-radius:20px;}Highlights:﻿Hivemapper uses the Solana blockchain to create a community-powered, incentive-driven online map.Hivemapper takes advantage of state compression technology on Solana to bring fees down significantly and maintain the rewards cycle.Decentralized physical infrastructure networks, powered by the blockchain, are finding a home on Solana..css-eb7wpp.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}Ariel Seidman first fell in love with maps in 2004, when he started work as a Director of Product Management for Yahoo! Maps. “Maps are that rare combination of art and utility,” he wrote in a recent blog post. “They are both incredibly beautiful and useful. Billions of people rely on maps every day of their lives.”“Through the ups and downs, my mission has always been the same: Build the world’s best map,” he wrote. With Hivemapper, he’s using web3 to make it happen. “We’re a team of builders who are focused on utility and actually building something for the real world and for real people. Our mission is to build the world’s freshest decentralized map with transparent and aligned incentives at a fraction of the cost.”Seidman first founded Hivemapper in 2015 with an eye toward using drones to build better maps, then pivoted to using dash cams instead. In November 2022, the company launched the Hivemapper Network: a user-driven global mapping network built on the Solana blockchain. Hivemapper’s users capture street-level imagery with the help of the company’s tailor-made dash cams, receiving HONEY tokens to incentivize data collection as they drive (and soon as they bike). Hivemapper turns that crowdsourced data into a world map — one that’s constantly expanding and updating thanks to the flow of fresh data. Users can also earn tokens for providing quality assurance checks on routes mapped by others. In April, Hivemapper launched a simple game designed to help train map AI to better recognize objects within images, providing another avenue for users to earn tokens. The network has already charted more than 2.4 million miles of unique roads. “In the past, companies like Google have spent up to half a million dollars on dedicated mapping vehicles,” says Hivemapper’s Head of Operations Gabe Nelson. “It’s really expensive, and it’s also very centralized. The places that have good maps are determined by where those companies are willing to invest their resources. Meanwhile, people and businesses are relying on that data to make decisions, even when it’s really out of date.” Hello! Use the editor to add your copy!.css-1397u6m.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:-1px;}.css-1fuo4gk{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;}@media (max-width:991px){.css-1fuo4gk{-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}}.css-l0gyrq{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;line-height:normal;width:calc(33.333333% - 6.666666600000001px);margin-left:0;}.css-l0gyrq > .builder-blocks{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}@media (max-width:991px){.css-l0gyrq{width:100%;margin-left:0;}}.css-9f7tx5.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:auto;margin-bottom:auto;}Hivemapper has tens of thousands — and soon, they hope, millions — of users who simply take images of the world as they drive around. And the recently announced state compression capabilities on Solana are crucial for managing users at that scale, Nelson says.“The inspiration of Hivemapper was to apply the principles of web3 and decentralization to the way that maps are collected,” Nelson says. “There are billions of people who travel throughout the world every day on cars, trucks, bikes, and motorcycles. And all of those people have the potential to collect data on the exact, current condition of all those roads. If a community wants a better map, they can go out and build it." “The inspiration of Hivemapper was to apply the principles of web3 and decentralization to the way that maps are collected,” Nelson says. “There are billions of people who travel throughout the world every day on cars, trucks, bikes, and motorcycles. And all of those people have the potential to collect data on the exact, current condition of all those roads. If a community wants a better map, they can go out and build it." .css-w169wd{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;line-height:normal;width:calc(66.666666% - 13.333333200000002px);margin-left:20px;}.css-w169wd > .builder-blocks{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}@media (max-width:991px){.css-w169wd{width:100%;margin-left:0;}}.css-12vq22c.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:auto;padding-right:0px;padding-bottom:0px;margin-bottom:auto;}On the left is Google and the right is @Hivemapper .~10 yrs apart in Romania. pic.twitter.com/VofBM91hZg— ariel seidman (@aseidman) April 11, 2023 The Hivemapper marketplace rewards contributors for collecting data and doing QA to confirm images collected by others. It then offers its data to consumers as an alternative to Google Maps API. Millions of companies rely on Google Maps API to power their location data, and the service’s prices have increased substantially in recent years. Hivemapper’s first target clients are large entities that can integrate multiple sources of road data — logistics and mapping companies who can use Hivemapper’s growing database to improve the coverage and freshness of their existing data. Once the network gets close to 100 percent coverage, Nelson says, they’ll be able to compete directly with existing map products — first for apps that use Google Maps API, and then for individuals. (While a Waze-esque consumer product is certainly a long-term goal, Nelson says, Hivemapper’s current focus is business to business.) “There’s a lot of frustration with the with the high cost and the low freshness of the incumbent solutions in the market, and we see a real opportunity to use the power of decentralization to come into the market with something that really hits on the Achilles heel of those incumbent solutions, something that has lower collection costs and has higher freshness,” Nelson says. Using Solana to build community-powered infrastructureHivemapper is part of a larger Decentralized Physical Infrastructure Networks (DePIN) movement, which aims to replace the many monopolies and centralized institutions that have become fixtures of industrialized society with more communal solutions..css-co8sai.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:0px;padding-left:20px;padding-right:20px;padding-top:20px;padding-bottom:20px;min-height:100px;}.css-1y6p72u.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:20px;width:100%;min-height:20px;min-width:20px;overflow:hidden;}.css-12153wi{opacity:1;-webkit-transition:opacity 0.2s ease-in-out;transition:opacity 0.2s ease-in-out;object-fit:cover;object-position:center;position:absolute;height:100%;width:100%;left:0;top:0;}.css-q3mx0u{width:100%;padding-top:64.3%;pointer-events:none;font-size:0;} .css-tbb3ka.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:20px;line-height:normal;height:auto;font-size:16px;color:rgba(155,155,155,1);}.css-1qggkls{outline:none;}.css-1qggkls p:first-of-type,.css-1qggkls .builder-paragraph:first-of-type{margin:0;}.css-1qggkls > p,.css-1qggkls .builder-paragraph{color:inherit;line-height:inherit;-webkit-letter-spacing:inherit;-moz-letter-spacing:inherit;-ms-letter-spacing:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit;text-align:inherit;font-family:inherit;}The Hivemapper Dashcam S. Courtesy: Hivemapper“Decentralized infrastructure is basically a broad category of projects that are attempting to build real physical infrastructure networks, and are using token incentives in the blockchain to help get that going,” explains Kuleen Nikmar, an ecosystem development lead at the Solana Foundation. “If you’re trying to do something like build a new map, and you’re starting from zero, that’s going to take a huge amount of money and time and effort across the globe. A project like Hivemapper can say hey, set up some hardware and help us do this, and we’ll reward you. It’s proven to be pretty effective, and it’s a really compelling way to get over that cold start problem.”One of the best known DePIN projects is Helium, which uses a decentralized global network of Hotspots to connect Internet of Things (IoT) devices. But other startups are working on decentralizing everything from the cloud to the power grid. In addition to being easier to get off the ground, Nikmar explains, DePIN projects have the potential to reward everyday people for helping to build the infrastructure they rely upon.“If you think about maps as a concept, we’re literally talking about the world we all live in,” Nikmar says. “It seems really fitting to me that we should all contribute to our understanding of the world we live in collectively—and that if I contribute, then I should also get rewarded.”In the four months since launching the network, Hivemapper has done more than 11 million transactions to reward users for map improvement and to burn tokens spent by companies that use the map data. Because QA testers can sign up from anywhere without participating in the dash cam data collection, the company has seen exponential growth in the scale of transactions. To do this, Hivemapper takes advantage of state compression, which uses Merkle trees to "compress" the verification of a data tree into a hash or fingerprint of its current state. “The ability to compress those transactions with Merkle trees has been a huge enabler for us in terms of the cost and speed of maintaining that reward cycle,” Nelson says. Companies wishing to use Hivemapper’s maps will have to burn HONEY tokens, he explains, which will drive up their value and further incentivize dash cam users and QA testers to improve the map’s freshness. “If we together can build an incredibly powerful map product for those end users, then those tokens are in high demand,” Nelson says. “It’s super early days. We've made amazing progress with more than three million miles of mapping, but we've got something like 40 million to go. We’ve got a long road ahead of us, but we’re focused on doing maps better than anyone has done them before."Keep up to date.Hear about the latest news in the Solana ecosystem. Sign up for the Solana Community Update.Sign Up.css-1mvsfya.builder-block{height:0;width:0;display:inline-block;opacity:0;overflow:hidden;pointer-events:none;}'''
