description = "Solana Privacy Policy"
full_description = '.css-h47494{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}.css-eb7wpp.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}Solana Privacy Policy.css-1qqe5yv.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-left:auto;margin-right:auto;width:100%;max-width:1200px;}@media only screen and (max-width:991px){.css-1qqe5yv.builder-block{padding-left:20px;padding-right:20px;}}@media only screen and (max-width:640px){.css-1qqe5yv.builder-block{width:100%;}}.css-1fx7xc9.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;line-height:normal;height:auto;padding-bottom:20px;}.css-1qggkls{outline:none;}.css-1qggkls p:first-of-type,.css-1qggkls .builder-paragraph:first-of-type{margin:0;}.css-1qggkls > p,.css-1qggkls .builder-paragraph{color:inherit;line-height:inherit;-webkit-letter-spacing:inherit;-moz-letter-spacing:inherit;-ms-letter-spacing:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit;text-align:inherit;font-family:inherit;}Last modified date: October 11, 2023This privacy policy ("Privacy Policy") explains how Solana Foundation ("Solana," "our," "we," or "us") collects, uses, and discloses information about you. This Privacy Policy applies when you use www.solana.com (the "Website"), contact our customer service team, engage with us on social media, or otherwise interact with us.We may change this Privacy Policy from time to time. If we make changes, we will notify you by revising the date at the top of this policy and, in some cases, we may provide you with additional notice (such as adding a statement to our Website or sending you a notification). We encourage you to review this Privacy Policy regularly to stay informed about our information practices and the choices available to you.CONTENTSCollection of InformationUse of InformationSharing of InformationAnalyticsTransfer of Information to the United States and Other CountriesYour ChoicesYour California Privacy RightsAdditional Disclosures for Individuals in EuropeContact UsCOLLECTION OF INFORMATIONInformation You Provide to UsWe collect information you provide directly to us. For example, you share information directly with us when you fill out a form, make a purchase, communicate with us via third-party platforms, participate in a contest or promotion, request customer support, or otherwise communicate with us. The types of personal information we may collect include your name, email address, postal address, phone number, credit card and other payment information, and any other information you choose to provide.Information We Collect Automatically When You Interact with UsWhen you access or use our Website or otherwise transact business with us, we automatically collect certain information, including:Transactional Information:When you make a purchase or return, we collect information about the transaction, such as product details, purchase price, and the date and location of the transaction.Device and Usage Information:We collect information about how you access our Website, including data about the device and network you use, such as your hardware model, operating system version, mobile network, IP address, unique device identifiers, browser type, and app version. We also collect information about your activity on our Website, such as access times, pages viewed, links clicked, and the page you visited before navigating to our Website.Location Information:In accordance with your device permissions, we may collect information about the precise location of your device. You may stop the collection of precise location information at any time (see the Your Choices section below for details).Information Collected by Cookies and Similar Tracking Technologies:We (and our service providers) use tracking technologies, such as cookies and web beacons, to collect information about you. Cookies are small data files stored on your hard drive or in device memory that help us improve our Website and your experience, see which areas and features of our Website are popular, and count visits. Web beacons (also known as "pixel tags" or "clear GIFs") are electronic images that we use on our Website and in our emails to help deliver cookies, count visits, and understand usage and campaign effectiveness. For more information about cookies and how to disable them, the Your Choices section below.Information We Collect from Other SourcesWe obtain information from third-party sources. For example, we may collect information about you from identity verification services, data analytics providers, and mailing list providers (if applicable).USE OF INFORMATIONWe use the information we collect to:Provide, maintain, and improve our products and services;Process transactions and send you related information, including confirmations, receipts, invoices, customer experience surveys, and recall notices;Personalize and improve your experience on our Website;Send you technical notices, security alerts, and support and administrative messages;Respond to your comments and questions and provide customer service;Communicate with you about products, services, and events offered by Solana and others and provide news and information that we think will interest you (see the Your Choices section below for information about how to opt out of these communications at any time);Monitor and analyze trends, usage, and activities in connection with our Website;Facilitate contests, sweepstakes, and promotions and process and deliver entries and rewards;Detect, investigate, and prevent security incidents and other malicious, deceptive, fraudulent, or illegal activity and protect the rights and property of Solana and others;Debug to identify and repair errors in our Website;Comply with our legal and financial obligations; andCarry out any other purpose described to you at the time the information was collected.SHARING OF INFORMATIONWe share personal information in the following circumstances or as otherwise described in this policy:We share personal information with vendors, service providers, and consultants that need access to personal information in order to perform services for us, such as companies that assist us with web hosting, shipping and delivery, payment processing, fraud prevention, customer service, and marketing and advertising.We may disclose personal information if we believe that disclosure is in accordance with, or required by, any applicable law or legal process, including lawful requests by public authorities to meet national security or law enforcement requirements.We may share personal information if we believe that your actions are inconsistent with our user agreements or policies, if we believe that you have violated the law, or if we believe it is necessary to protect the rights, property, and safety of Solana, our users, the public, or others.We share personal information with our lawyers and other professional advisors where necessary to obtain advice or otherwise protect and manage our business interests.We may share personal information in connection with, or during negotiations concerning, any merger, sale of company assets, financing, or acquisition of all or a portion of our business by another company.We share personal information with your consent or at your direction.We also share aggregated or de-identified information that cannot reasonably be used to identify you.ANALYTICSWe allow others to provide analytics services on our behalf across the web and in mobile apps. These entities may use cookies, web beacons, device identifiers, and other technologies to collect information about your use of our Website and other websites and applications, including your IP address, web browser, mobile network information, pages viewed, time spent on pages or in mobile apps, links clicked, and conversion information. This information may be used by Solana and others to, among other things, research, analyze and track data, determine the popularity of certain content, and better understand your online activity. However, if you have deleted and disabled cookies, these uses will not be possible to the extent they are based on cookie information. We use Google Analytics to analyze traffic. You can find out more information about Google Analytics cookies by visiting the following location provided: https://developers.google.com/analytics/devguides/collection/analyticsjs/cookie-usage. To opt out of Google Analytics relating to your use of our site, you can download and install the Browser Plugin available by visiting the following location provided: https://tools.google.com/dlpage/gaoptout?hl=en.TRANSFER OF INFORMATION TO THE UNITED STATES AND OTHER COUNTRIESSolana operates and engages service providers in various jurisdictions. Therefore, we and our service providers may transfer your personal information to, or store or access it in, jurisdictions that may not provide levels of data protection that are equivalent to those of your home jurisdiction. By using our site, you acknowledge and agree to such transfers and processing, including to and in the United States. We will take steps to ensure that your personal information receives an adequate level of protection in the jurisdictions in which we process it.YOUR CHOICESCookiesMost browsers are set to accept cookies by default. If you prefer, you can usually set your browser to disable cookies, or to alert you when cookies are being sent. Likewise, most mobile devices allow you to disable the ability for geolocation information to be collected from your mobile device. The help function on most browsers and mobile devices contains instructions on how to set your browser to notify you before accepting cookies, disable cookies entirely, or disable the collection of geolocation data. You need to set each browser, on each device you use to surf the Web. Thus, if you use multiple browsers (e.g., Chrome, Safari, Internet Explorer, Firefox, etc.), you should repeat this procedure with each one. Similarly, if you connect to the Web from multiple devices (e.g., work and home), you need to set each browser on each device. Depending on your jurisdiction, you may be able to utilize additional cookie management tools. Please note that removing or rejecting cookies could affect the availability and functionality of our Website.Communications PreferencesYou may opt out of receiving newsletters from Solana by following the instructions in those communications.YOUR CALIFORNIA PRIVACY RIGHTSThe California Consumer Privacy Act or "CCPA" (Cal. Civ. Code § 1798.100 et seq.) affords consumers residing in California certain rights with respect to their personal information. If you are a California resident, this section applies to you.California Consumer Privacy ActIn the preceding 12 months, we have collected the following categories of personal information: identifiers, financial information, biometric information, internet or electric network activity information, and geolocation data. For details about the precise data points we collect and the categories of sources of such collection, please see the Collection of Information section above. We collect personal information for the business and commercial purposes described in the Use of Information section above. In the preceding 12 months, we have disclosed the following categories of personal information for business purposes to the following categories of recipients:Category of Personal InformationFinancial InformationCategories of RecipientsPayment providerThird-party logistics providersSolana does not sell your personal information.Subject to certain limitations, you have the right to (1) request to know more about the categories and specific pieces of personal information we collect, use, and disclose, (2) request deletion of your personal information, and (3) not be discriminated against for exercising these rights. You may make these requests by contacting us at operations@solana.com. We will verify your request by asking you to provide information related to your recent interactions with us. We will not discriminate against you if you exercise your rights under the CCPA.ADDITIONAL DISCLOSURES FOR INDIVIDUALS IN EUROPEIf you are located in the European Economic Area ("EEA"), the United Kingdom, or Switzerland, you have certain rights and protections under the law regarding the processing of your personal data, and this section applies to you.Legal Basis for ProcessingWhen we process your personal data, we will do so in reliance on the following lawful bases:To perform our responsibilities under our contract with you (e.g., processing payments for and providing the products and services you requested).When we have a legitimate interest in processing your personal data to operate our business or protect our interests (e.g., to provide, maintain, and improve our products and services, conduct data analytics, and communicate with you).To comply with our legal obligations (e.g., to maintain a record of your consents and track those who have opted out of communications).When we have your consent to do so (e.g., when you opt in to receive communications from us). When consent is the legal basis for our processing your personal data, you may withdraw such consent at any time.Data RetentionWe store other personal data for as long as necessary to carry out the purposes for which we originally collected it and for other legitimate business purposes, including to meet our legal, regulatory, or other compliance obligations.Data Subject RequestsSubject to certain limitations, you have the right to request access to the personal data we hold about you and to receive your data in a portable format, the right to ask that your personal data be corrected or erased, and the right to object to, or request that we restrict, certain processing. If you would like to exercise any of these rights, please contact us at operations@solana.com.Questions or ComplaintsIf you have a concern about our processing of personal data that we are not able to resolve, you have the right to lodge a complaint with the Data Protection Authority where you reside. Contact details for your Data Protection Authority c'
