t:0;top:0;}.css-qjm9kp{width:100%;padding-top:75%;pointer-events:none;font-size:0;} .css-1stxo0m.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:20px;line-height:normal;height:auto;font-size:16px;color:rgba(155,155,155,1);margin-left:auto;margin-right:auto;}@media only screen and (max-width:640px){.css-1stxo0m.builder-block{text-align:center;}}.css-1qggkls{outline:none;}.css-1qggkls p:first-of-type,.css-1qggkls .builder-paragraph:first-of-type{margin:0;}.css-1qggkls > p,.css-1qggkls .builder-paragraph{color:inherit;line-height:inherit;-webkit-letter-spacing:inherit;-moz-letter-spacing:inherit;-ms-letter-spacing:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit;text-align:inherit;font-family:inherit;}The first house, in McAllen Texas. Courtesy Homebase."Real estate is an important to financial freedom,” says Homebase co-founder and CEO Domingo Valadez. “The gap now between median income and median home price is the highest it's ever been. What can we do to make real-estate investing more attainable for people?"Three months after its first sale, the company pulled off another successful sale of a similarly priced home in the same area. The second time, another 38 investors shared ownership of a $176,100 home, with an average check size of $4,638.The intricacies of the Homebase processHomebase's journey to this achievement wasn’t a straightforward path. Valadez revealed in an article in Blockworks that the team spent seven months solely on legal and compliance preparations.According to Valadez, the team faced a challenging choice between quick execution and thorough groundwork. While they knew the idea would be a slam-dunk, they wanted to make sure it could also stand up legally. The platform opted for a more cautious route, focusing on developing the right regulatory structure. Homebase partnered with the law firm Hunton Andrews Kurth to build a previously non-existent token wrapper that would allow for certain oversight measures. Using the Metaplex protocol, the team created the wrapper to modify non-fungible tokens (NFTs), giving Homebase the ability to step in as a third party and freeze, burn and reissue tokens as needed. The wrapper also enforces KYC requirements and a mechanism to escrow funds upon property purchase, with the release of funds contingent upon reaching the crowdsourced funding goal. Finally, the wrapper also encodes a one-year lockup period that would restrict trading within this initial timeframe, designed for compliance with Regulation D.Choosing the right blockchainThe decision-making process for the blockchain on which to build the Homebase infrastructure was somewhat arduous, says Valadez — particularly because the majority of Homebase’s early investors were not familiar with digital assets.“As you can imagine, we came in with a thesis that crypto-native people really wanted something like Homebase, but we learned that actually this is an everyone problem, not just a crypto problem,” Valadez said. In the March 2023 sale, for instance, 15 of the 38 buyers created their first Solana wallet specifically for the purchase of the Homebase NFT.A fractionalized homeownership solution (and its user experience) therefore has to be as seamless as logging into any familiar website, such as a bank portal. Challenges like gas fee fluctuations and technical challenges in other blockchain ecosystems led Homebase to seek a different option.“Bridging from a Layer 2 blockchain is actually quite complex,” Valadez said. “And there's a period of time in which your money just disappears as it’s transitioning from one blockchain to the other.” Not so great for investor confidence.Solana emerged as the ideal choice due to its user-friendly interface supporting USDC, which ensured a hassle-free property tokenization process. The suite of tools available within the Solana ecosystem have also provided easy-enough solutions that the Homebase team could walk its early investors through the process. “We do all rental distributions in USDC,” Valadez said, adding that the team has partnered with stablecoin issuer Circle to do so. Then there’s the process of on- and off-ramp. To keep the fiat-to-crypto exchange process all inside the Homebase platform, the team integrated with onboarding solution CoinFlow. “We integrated the on-ramps and off-ramps in the same platform,” explained Valadez. “So you as a non-web3 native withdraw your portion of the property’s monthly rent into your bank account when you’re ready.”When owners are ready to sell their portion of the property, they can also do that within the Homebase platform. Here, the use of blockchain technology offers significant advantages. With traditional real estate investments among friends, selling involves complex agreements and permissions. In contrast, Homebase employs tokens representing ownership in the property's holding LLC. This means selling doesn't require approval from other LLC members; it's simply facilitated on the platform. When an owner does want to buy, Homebase matches sellers with interested buyers, streamlining the process with online documentation via DocuSign, reducing the typical hurdles found in private real estate markets.Such ease of use is paramount, says Valadez, who strives to engender confidence in new investors who may not have otherwise considered themselves as players in the real estate game..css-1nhnson{width:100%;padding-top:56.2%;pointer-events:none;font-size:0;} .css-b6u5kq.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;margin-top:20px;line-height:normal;height:auto;font-size:16px;color:rgba(155,155,155,1);margin-left:auto;margin-right:auto;}The second house, in McAllen Texas. Courtesy Homebase.‘An amazing experience’Quietly, at the southern tip of the Rio Grande Valley, Homebase’s venture into tokenized real estate is creating a seismic shift in the industry. Its cautious approach is laying a robust compliance foundation, setting them apart in a market entangled with legal complexities and providing some precedent that we can all learn from.The decision to build on Solana was clear given Homebase prioritizes user-friendliness, scalability and mainstream adoption. User experience is crucial for attracting investors unfamiliar with digital assets — which are the ones Homebase is best positioned to serve with its product. Solana’s stability, interface, and support for USDC made property tokenization hassle-free and helped the company abstract away the friction from investors’ line of sight.“I like building on Solana, even in the toughest of winter or bear markets,” said Valadez. “It gave everyone who stuck around really high conviction in the environment, with the other teams building and in the foundation holistically. To be a part of that has just been an amazing experience.”Building on this foundation, Homebase is now applying its expertise to the commercial sector. The team is now offering back office software for real estate syndicators like EmpireDAO to make commercial real estate investment more accessible. Using blockchain technology and Solana's capabilities, Homebase aims to establish liquidity pools that enable easier trading of real estate assets, potentially transforming how commercial real estate is bought and sold.Homebase’s aim is clear: making commercial real estate accessible and dynamic while instilling confidence in new investors. It’s not just new tech; it's a gateway to financial inclusivity.Built for what's possible.See how teams like Helium, Decaf, and more are taking advantage of the Solana tech stack to build a fast, secure, scalable, and user-friendly future.LEARN MORE.css-1mvsfya.builder-block{height:0;width:0;display:inline-block;opacity:0;overflow:hidden;pointer-events:none;}'''
