title = "Case Study: XP Tackles 'the Ticketmaster Problem' | Solana"
description = "XP, an independent blockchain ticketing platform, uses the Tamperproof protocol to offer a more transparent way to buy and sell live event tickets."
full_description = ".css-h47494{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}.css-eb7wpp.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-6r6a89.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;background-color:rgba(20,203,241,0.17);padding-top:20px;padding-left:20px;padding-right:20px;padding-bottom:20px;opacity:1;border-radius:20px;}HighlightsXP is a blockchain-based ticket marketplace offering secure and transparent ticket transactions using XP’s proprietary Tamperproof protocol.It enables the encryption of ticket codes as NFTs, allowing seamless ticket trading on its platform.XP’s marketplace hosts 34 million tickets from more than 110,000 live events in the United States and Canada, including concerts, sports, comedy, and more. Solana's significantly lower fees make it financially viable to eliminate the dreaded 'junk fees' that have long plagued ticket buyers.Instantaneous, real-time settlements on Solana help XP foster a more direct connection between buyers and sellers.Solana’s speed and high throughput is essential for building a scalable ticketing platform with the potential to service millions of high user traffic. .css-bo33vx.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;padding-top:20px;}The ticket industry is broken, and its number-one issue can be summed up as the “Ticketmaster problem.” It sounds familiar: A musical artist comes to town, and you decide to buy tickets online. The venue advertises the price of admission as $55, but upon adding the ticket to your online shopping card and clicking “buy now,” at least three unique types of fees pop up — service fees, processing fees and delivery fees — bringing the final price to $80, a 37% markup from face value.Then there’s the lack of transparency. You don’t know who gets a cut of these fees, whether Ticketmaster or its now-parent company, Live Nation. But you do know one thing: Artists and performers won’t receive a portion of those extra fees, even though they frequently pay Ticketmaster-affiliated vendors a slice of their merch sales and split revenue from ticket sales. In fact, the issue is so problematic that the U.S. Senate held a hearing in January 2023 to question why some 70% of tickets are sold through a single vendor.XP solves the ‘Ticketmaster problem’ using SolanaThe so-called “Ticketmaster problem” could be solved through decentralized technology. XP, an independent blockchain ticketing platform, uses the Tamperproof protocol to offer a more transparent, efficient, and cost-effective way to buy and sell tickets. Behind the scenes, XP's transactions use Solana's blockchain, denominated in USDC, to help buyers easily make the switch and rival the user experience (UX) of incumbent vendors — just without the junk fees. XP encrypts ticket codes as nonfungible tokens (NFTs), allowing for the seamless exchange between buyers and sellers, who can see when a ticket is redeemed.The Tamperproof protocol has the ability to encrypt or “seal” ticket claim codes within a special type of NFT known as “Tamperproof NFTs” (tpNFTs). This ensures they remain inaccessible until the holder decides to break the seal. This unique sealing feature addresses the need for security and authenticity, both major concerns when selling any kind of real-world asset on a secondary marketplace. Transactions are secure, transparent and verifiable, thanks to the public visibility of the blockchain and instantaneous updates of a tpNFT’s sealed or unsealed status on the Solana public ledger.At the time of publication, XP has an inventory of roughly 34 million tickets, spanning over 110,000 events — a wide selection for prospective attendees. .css-1fuo4gk{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;}@media (max-width:991px){.css-1fuo4gk{-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}}.css-roqzn4{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;line-height:normal;width:calc(100% - 0px);margin-left:0;}.css-roqzn4 > .builder-blocks{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}@media (max-width:991px){.css-roqzn4{width:100%;margin-left:0;}}Sealed vs. UnsealedEnsuring authenticityTickets on XP are more than just digital passes; they are Tamperproof NFTs. This innovative approach to ticket encryption means buyers and sellers can confidently engage in transactions, knowing that their tickets are secure and their value is preserved.Sealed ticketsThe protocol recognizes that sealed tickets contain an unused code and therefore not redeemed yet. The automation in the protocol makes this secure.Unsealed ticketsOnce unsealed, these tickets are ready to be transferred to the end user. Why Solana? The strategic choiceChoosing Solana for XP was a deliberate decision, says Michael Saunders, CEO of XP. The decision was driven by the need for efficiency and cost-effectiveness.“I found Ethereum back in 2017,” he said, “but using it with anything for anything real with gas fees being as high as it was just seemed unscalable.” While searching for the blockchain for his company to build the protocol, it became clear that Solana’s low transaction fees and high-throughput capabilities provided a major competitive advantage.XP leverages Solana’s blockchain technology in a few different ways.Tokenized tickets: The protocol encrypts and seals secret ticket codes in the form of “Tamperproof nonfungible tokens” (tpNFTs), ensuring their integrity and redeemability.Composable oracle services: Any company or independent ticket vendor can use the platform to sell tickets at market value, with real-world data encoding the price of the ticket into its NFT. Cost effectiveness: Solana enables XP to offer cheaper ticketing and user-friendly payment methods (credit card, USDC). Transparency: XP's tpNFTs maintain their sealed or unsealed status publicly, visible in the NFT metadata on the Solana public ledger. This transparency ensures that sealed tpNFTs contain an unused code.Transaction volume and community-building at scale: While cost savings is one of the primary benefits of using the Solana network, its high-throughput design makes it possible for artists, entertainers and vendors to form communities for their ticket buyers. Saunders believes this feature will lend itself to VIP experiences, fan clubs and more.Security with Tamperproof Protocol: Authenticity is coded into the ticket, critical for establishing user verifiability.Industry disruption: XP challenges the high fees and lack of transparency in the traditional ticketing industry.The benefit to customers For now, says Saunders, the benefit to customers is cost savings. “We are 20% to 30% cheaper than StubHub, Vivid or Seat Geek, and we are safer than Reddit or Facebook Marketplace,” he said. But that’s just the beginning, he expects. “We are built on top of Solana, and because of that there are different types of experiences beyond just a ticket,” he explained, highlighting the infinite potential when speed, scalability and cost are not adding friction.XP's platform is also designed with user experience in mind, offering a familiar and comfortable interface for purchasing tickets. Users can sign up with a phone number and purchase tickets with a credit card, without needing to understand or interact with cryptocurrency directly — making it accessible to audiences outside of web3.The platform aims to be a discovery tool for events as well as a secondary marketplace, providing users with access to a wide range of tickets at competitive prices. Saunders envisions XP as a community where users can access wholesale prices on tickets, benefiting from being part of the XP user base.Overall, XP represents an innovative approach to ticketing, combining traditional marketplace features with the benefits of blockchain technology to offer a more user-friendly, secure, and cost-effective ticket buying experience. Join the new art world.Hear about the latest news, tools, and events for creatives using Solana.Sign Up.css-1mvsfya.builder-block{height:0;width:0;display:inline-block;opacity:0;overflow:hidden;pointer-events:none;}"
