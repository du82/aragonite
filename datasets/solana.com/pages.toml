full_description = '''.css-h47494{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}.css-eb7wpp.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}.css-6r6a89.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;background-color:rgba(20,203,241,0.17);padding-top:20px;padding-left:20px;padding-right:20px;padding-bottom:20px;opacity:1;border-radius:20px;}HighlightsHomebase, leveraging the Solana blockchain, successfully tokenized a $235,000 single-family rental property in South Texas in March 2023.The platform raised $246,800 in just two weeks from 38 investors through the sale of NFTs tied to the physical real estate asset.The Homebase model is meant to broaden participation in real estate investments. Of Homebase’s 76 total investors between both homes, roughly 78% are non-institutional. There was a minimum $500 threshold to invest and the average check size was between $4,000 and $5,000.Concerns over fees and technical limitations steered Homebase to building on Solana. Solana’s user-friendly USDC payments through Circle support allowed seamless property tokenization, crucial for investor confidence and accessibility.Homebase is now focusing on bringing its learnings to the commercial real estate market..css-1fuo4gk{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;}@media (max-width:991px){.css-1fuo4gk{-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;}}.css-1qvjcwz{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;line-height:normal;width:calc(50% - 15px);margin-left:0;}.css-1qvjcwz > .builder-blocks{-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;}@media (max-width:991px){.css-1qvjcwz{width:100%;margin-left:0;}}.css-bo33vx.builder-block{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;padding-top:20px;}Homebase, a pioneering startup in real estate tokenization, made a significant breakthrough when it sold a single-family home in McAllen, Texas to 38 investors — 30 of them non-institutional. Unlike traditional real estate investing, which is focused on commercial or multi-family buildings, Homebase tokenized a single family building. The property was valued at $235,000. Homebase raised $246,800 in capital in two weeks, putting aside the extra $11,800 of the total raised for potential maintenance, like any good real estate investor. The deal, a collective agreement between strangers (some of whom hadn't previously been excited about crypto before — or had even opened a crypto wallet), speaks volumes about the market's confidence in this model. Yet innovation isn’t the company’s only motivation; it’s also motivated by financial accessibility and inclusion..css-li9dfz{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;-webkit-box-a