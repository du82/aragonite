full_description = '''some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Friday, February 28, 2025 Pine River and Lone Peak I've been looking in this 1991 anthology for any interesting landscape-related poems that Peter H. Lee didn't include in The Columbia Anthology of Traditional Korean Poetry, a book I discussed here nineteen years ago. I soon found one - the first poem in the book is a 1580 kasa by Chŏng Ch'ŏl (1537-94) which Lee calls The Wanderings (1580). Its Korean title is Kwandong pyŏlgok* - sometimes rendered as the Song of Diamond Mountain or Song of the East Coast. Kwangdong is the name of the region that contains the spectacular Diamond Mountains (Geumgangsan), which I have discussed here before in relation to the artists they inspired. Chŏng Ch'ŏl's poem begins in Seoul where the king appoints him governor. He heads north and endures a sleepless night at Chorwon, a town which is now right on the North Korean border. After encountering magpies chattering on an old royal tomb (at least metaphorically), he sets off for the mountains, letting 'my staff lead me'. He walks through Hundred Rivers Canyon to Myriad Falls Grotto, and admires the falling water: 'there silver rainbows, / dragons with jade tails, / turning and coiling, spurt cataracts.' In an ideal world someone would have written an illustrated guide to the Diamond Mountains, detailing all the most famous scenic spots, arranged alphabetically or geographically, and illustrating them with literary quotations, paintings and contemporary photographs. One reason my ideal library contains no such volume is that it would be a little hard to write this now, since many of the beauty spots are in North Korea. And, of course, while the mountains and sea might have been familiar to Chŏng Ch'ŏl, specific sites he visited have gone. Early in the poem he passes through Pyohunsa Temple which is still there, but it is the only one of the Diamond Mountains' four great temples that survived the Korean War - American bombers destroyed Singyesa, Jangansa and Changansa. Another temple, Naksansa, was devestated by fire in 2005, although most of its buildings only dated from the fifties, when it was rebuilt after having been reduced to rubble in the war. Chŏng Ch'ŏl visited Naksana, where he got up at dawn to watch the sun rise over the sea. Naksana is one of the Gwandong Palgyeong, eight scenic spots along the eastern coast of Korea which became famous in the sixteenth century. Gim Hongdo, Lake Samilpo from an album of late 18th century Landscapes Around Mt. Geumgangsan Source: Google ArtLake Samilpo is another famous landscape. It sounds lovely but is now inaccessible, north of the border. Chŏng Ch'ŏl visited and found six red letters on a cliff commemorating the four knights of Silla. 'After three days here / where did they go?' Legend has it that these four Hwarang stayed for three days and nights because they were captivated by the beautiful scenery (Samilpo means Three Days Cove). The Hwarang were Korea's elite male warriors, the 'flowering youth' schooled in Buddhism who visited mountains to train and try to receive supernatural guidance. They flourished as fighters between the mid-6th and mid-7th centuries, after which they became more of a social elite (they feature in later poems like the mid-8th century 'Ode to Knight Kipa': 'Knight, you are the towering pine / That scorns frost, ignores snow.') These four had been in the Diamond Mountains and were on their way down the coast to take part in a martial arts competition. Chŏng Ch'ŏl wonders where the four would have stayed next: 'Were they sitting at Clear Torrent Arbor / or on Myriad View Terrace?' Peter H. Lee discusses Chŏng Ch'ŏl's poem in his History of Korean Literature. He says 'the reader feasts on a continuous unfolding of scenes described from various perspectives, encompassing both the sky and sea, and engaging all the senses ... Chŏng’s bold descriptions show great skill in conveying a magnificent scene of nature in simple but carefully chosen words.' I will end here with the poet's description of Mirror Cove, which is northeast of Gangnung and was another of the Eight Scenes of Gwandong. Behind the old pines rimming like hedgesI scan a ten-mile long beachlike ironed and stretched white silk; the water is calm and clear, I can count the grains of sand. Read more » Posted by Plinius at 12:05 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: lakes, shores, waterfalls Location: Gangneung-si Friday, February 07, 2025 Maps of Other Possibilities Yesterday I went to a wonderful event at Tate Britain devoted to the Bow Gamelan Ensemble. There were three short films and then a conversation between Louisa Buck and the two remaining members, Anne Bean and Richard Wilson. It was probably one of the best artist talks I've ever been to - they were so engaging, articulate and inspiring. Paul Burwell died in 2007 but his thoughts were captured in one of the films, framed by retrospective questions from Bean. His Guardian obituary described the time when, 'memorably for those who were there, Burwell engaged the leader of the famous Kodo Drummers in a drum battle that traversed the entire harbour area of Sado Island, Japan.' Bean reminisced about this experience, recalling how it had ended with the Japanese drummer bowing in respect. I have mentioned the Bow Gamelan Ensemble before on this blog, as the highlight of a 2013 exhibition about the Thames. 'Most enjoyable of all, there is footage of The Bow Gamelan Ensemble from 1985, performing 51º 29'.9"North - 0º11' East, Rainham Barges, bashing out music from makeshift instruments at the river's edge as the tide rises and night falls.' You can read more about this performance on the Ensemble's website: 'they were filmed for over ten hours as the tide ebbed and flowed capturing the massive energy of this amount of incoming water and the ways one could harness this power to shift and shape sound. As the huge resonant chambers of the barges filled up, they deepened the sounds of the metal reinforcing bars sticking out as they were played with sticks and beaters. Passing vessels obliged by blasting their horns, adding to the Bow Gamelan’s own array of foghorns, sirens and hooters.'Regrettably I never saw them perform and the old footage of them staging events on derelict land by the river is increasingly hard to relate to what you experience in the modern city. They talked about how cheap it was to live in Butler's Wharf when they first met in the seventies. It sounds like a magical time, with Anne Bean's studio the venue for art world parties that included key figures from the punk movement. From the perspective of this blog, I'm interested in the way they worked at scale and transformed whole cityscapes - Simon Reynolds called them 'the missing link between Test Dept’s metal-bashing clangour and the Land Art of figures like Robert Smithson'. One of their most striking ideas was a concert for cranes, making use of the fact that Docklands was a permanent building site, with instruments picked up and moved around in three dimensions. Their use of pyrotechnics would not be possible now, although apparently they did get away with breaking the rules recently. Back in 1993 Burwell and Bean staged a spectacular event at Bankside power station (an image can be seen in my photo above). The woman who organised it was in the audience last night and she said they were only allowed to do it if they insured the building, but nobody knew what it was worth. So she got a quote from a local insurance company and it set them back £375. A few years later Bankside had become Tate Modern. Posted by Plinius at 11:14 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: industry, rivers Location: Bow, London, UK Friday, January 31, 2025 An Outcrop in the Campagna Frederic Leighton, A Nile View, 1868'The keynote of this landscape is a soft, variant, fawn-coloured brown, than which nothing could take more gratefully the warm glow of sunlight or the cool purple mystery of shadow; the latter perhaps especially, deep and powerful near the eye (the local brown slightly overruling the violet), but fading as it receded into tints exquisitely vague, and so faint that they seem rather to belong to the sky than to the earth. At this time of year the broad coffee-coloured sweep of the river is bordered on either side by a fillet of green of the most extraordinary vivacity, but redeemed from any hint of crudity by the golden light which inundates it.' - Leighton's travel journal, October 1868This panorama is one of the highlights of Leighton and Landscape: Impressions from Nature, an exhibition of oil sketches which we saw at Leighton House last month. It was painted on the first of three trips he made to Egypt - Leighton was a lifelong traveller and, having grown up on the continent, was fluent in several languages. A wealthy bachelor, he was also extremely well connected and for this trip was provided with a steamer to take him up the Nile. He evidently took pleasure in making oil sketches but didn't do them on every trip, or at least so it appears - we don't have a record of them all and he mainly kept them private, only showing some of them late in his career. His modesty about them can be explained in terms of his self-image as President of the Royal Academy, engaged in the highest-regarded genre of history painting, but it still seems extraordinary.There is an excellent catalogue which apart from anything else smells delightful (mine still has that fresh paper new book aroma!) The main author is Pola Durajska who did a PhD at York on Leighton's landscapes. She and the other authors point out some interesting features of his sketches:He experimented with different shapes of canvas (cutting them to size himself) and varied his technique from impasto to thin wash-like effects. He looked for interesting light effects at different times of day and studied the intense shadows and bright white buildings of north Africa. His interest in architecture influenced his choice of landscapes, with castles and towns blending into their surroundings and rock formations shaped like ruins.He rarely included figures or local colour and did not record where the sketches were done, making the locations of some of them hard to pin down.He also avoided the obvious, painting unregarded corners of cities like Venice and Jerusalem, or framing famous vistas differently to earlier artists. I'll end here with one of the Gere Collection paintings normally on display at the National Gallery. The wall text at Leighton House says that 'it is not easy to understand exactly what attracted Leighton to paint this particular grassy, hillside slope in Italy. Without any discernible focal point or distinctive feature, other than a flash of yellow sandy soil in the foreground, perhaps its appeal was in the simple combination of the green mass of the landforms against the deep blue of the sky. This apparently unpromising combination of elements typifies Leighton's approach to finding a subject.' Frederic Leighton, An Outcrop in the Campagna, probably 1866 Posted by Plinius at 6:08 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: light, plein air, rivers Location: Rome Sunday, January 12, 2025 Architecton Here are J. M. W. Turner's The Fall of an Avalanche in the Grisons (1810) and an explosive rock fall in Victor Kossakovsky's new essay film Architecton. I watched the latter from the safety of my cinema seat, immersed in the noise and right up close to the violence of rocks crashing down and smashing into themselves. As Burke said of the Sublime, where you are not at risk of destruction, such experiences produce 'a sort of delightful horror, a sort of tranquility tinged with terror; which, as it belongs to self-preservation, is one of the strongest of all the passions.' Landscape drone footage may now be a cliché in movies, but I did feel watching this that the technology has given us a new way of experiencing delightful horror. Architecton is good on the life cycle of stone, from quarrying, to building to destruction, but its structure is confusing - you only really understand where in the world the rockfall happened towards the end. A prologue shot in Ukraine feels a bit tacked on. Personally I didn’t care for the music or some of the black and white footage. However, I did warm to the film's central figure, an amiable old Italian architect-designer called Michele De Lucchi. He wanders round Baalbek's Roman ruins, admiring the lovely old stone (no ugly concrete) and marveling at how they cut it with such precision. Back at his idyllic-looking family home in Italy, we see him direct two workmen to build a circular stone garden feature. You worry he is going to catch pneumonia standing out in the snow while it takes shape, although maybe this inclement day was chosen by the director. The result is reminiscent of a Richard Long circle and it becomes clear he aims to let the interior grow naturally, like herman de vries's meadow. In Peter Bradshaw's review he says that despite some faults, the film 'is so striking, especially on the big screen, almost itself a kind of land art.' Posted by Plinius at 9:22 am 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: J. M. W. Turner, ruins, stones Location: Baalbek, Lebanon Monday, December 30, 2024 His shade protects the plains, his head the hills commands "The Oak," observes Mr. Gilpin, "is confessedly the most picturesque tree in itself, and the most accommodating in composition. It refuses no subject, either in natural, or in artificial landscape. It is suited to the grandest, and may with propriety be introduced into the most pastoral. It adds new dignity to the ruined tower, and Gothic arch; it throws its arms with propriety over the mantling pool, and may be happily introduced even in the lowest scene."From Sylvan sketches; or, A companion to the parks and the shrobbery: with illustrations from the works of the poets (1825) by Elizabeth KentThis quote about landscape by William Gilpin, influential eighteenth century writer on the Picturesque, is an excuse to mention two books by Elizabeth Kent. This one, Sylvan Sketches, is a guide to trees and it was her follow-up to Flora domestica, or, The portable flower-garden: with directions for the treatment of plants in pots and illustrations from the works of the poets (1823). I've always loved the idea of plant dictionaries based on quotes from poetry and years ago tried to compile one myself, in a vain attempt to lodge in my brain botanical knowledge that would enliven family walks and impress my wife when we visited garden centres. Sadly it failed, as I was always more interested in the poets than the p'''
