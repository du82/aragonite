full_description = '''some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Tuesday, April 04, 2006 Clear breeze and bright moon The cycle of the seasons is celebrated in The Angler’s Calendar (1651), forty songs by the Korean sijo poet Yun Sondo (1587-1671). The spring section begins in early morning with fog on the stream and sunlight illuminating the black hills. The fisherman delights in the cries of cuckoos and the sight of blue willows on the riverbank and peach blossoms floating on the water. These petals remind him of the Chinese story of the Peach Blossom Spring, far away from earthly cares. This theme of joy and escape is maintained to the end of the poem, where winter’s clouds screen the poet from the world and roaring waves drown out its sounds. Another evocation of spring in The Columbia Anthology of Traditional Korean Poetry is In Praise of Spring by Chong Kugin (1401-1481), translated by Peter H. Lee. Here again, petals on a stream suggest to the poet that he is near the source of the Peach Blossom Spring. He climbs between the pine trees to a hilltop and surveys the landscape of scattered villages, with mist glowing in the sunlight and spring colours covering the fields. Although he is without fame and rank, the poet is happy to have friends in “the clear breeze and bright moon.” Posted by Plinius at 9:14 pm Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: seasons Location: Seoul, South Korea No comments: Post a Comment Newer Post Older Post Home Subscribe to: Post Comments (Atom) My book Frozen Air .image { width: 100%; } About this site Plinius This blog explores landscape through the arts: painting, installation, photography, literature, music, film... I've also on occasion covered the creation or alteration of landscapes by architects, artists and garden designers. For the first year I did several short entries each week; since then I have reduced the frequency and some posts are a bit longer. In naming this site 'Some Landscapes' initially I just saw it as a few modest notes and didn't know if I'd keep it up. Of course it will always only cover 'some' landscapes, even though I occasionally like to think of it as an expanding cultural gazetteer. There are some maps and a chronology of posts that I did a while back but the best way of exploring is through the search function, labels or just browsing old posts. I started writing this blog using the name 'Plinius' (a little tribute to the younger and older Plinys) and am now rather attached to it as a 'nom de blog'. Comments are very welcome but are moderated to prevent spam. I used to post landscape stuff on Twitter but now use Bluesky: @andrew-ray.bsky.social. View my complete profile Selected labels aerial landscapes annotated landscapes bridges castles ceramics cities clouds dawn deserts echoes embroidered landscapes food forests gardens giant figures homes and haunts ice industry lakes language light locus amoenus maps marshes mists mountains night orchards panoramas pastoral place names plein air postcards psychogeography rivers roads ruins scenery seas shores snow soundscapes springs stones storms sunsets the body the moon trees viewing points volcanoes war landscapes waterfalls wind window views Followers window.followersIframe = null; function followersIframeOpen(url) { gapi.load("gapi.iframes", function() { if (gapi.iframes && gapi.iframes.getContext) { window.followersIframe = gapi.iframes.getContext().openChild({ url: url, where: document.getElementById("followers-iframe-container"), messageHandlersFilter: gapi.iframes.CROSS_ORIGIN_IFRAMES_FILTER, messageHandlers: { '_ready': function(obj) { window.followersIframe.getIframeEl().height = obj.height; }, 'reset': function() { window.followersIframe.close(); followersIframeOpen("https://www.blogger.com/followers/frame/19151341?colors\x3dCgt0cmFuc3BhcmVudBILdHJh