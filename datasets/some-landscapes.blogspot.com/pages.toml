full_description = "some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Thursday, August 31, 2006 Red Arch Mountain, Utah In Berlin Childhood around 1900 Walter Benjamin relates his childhood immersion in watercolours to the story of an old Chinese painter. The old man invited friends around to see his most recent picture. They were shown a landscape with a footpath leading along a stream and through a grove to a small cottage. When they turned around and looked for the painter, he had gone. They saw that he had entered the picture and was walking up the path to the door, where he paused ‘quite still, turned, smiled and disappeared through the narrow opening.’ Reading Benjamin’s book it is difficult not to reflect on one’s own childhood memories. Benjamin describes the streets, parks and monuments of Berlin but he also dwells on the landscapes of furniture and household objects that a child negotiates. He remembers the power of postcards and the old Imperial Panorama where ‘one afternoon, while seated before a transparency of Aix, I tried to persuade myself that, once upon a time, I must have played on the patch of pavement that is guarded by the old plane trees of the Cours Mirabeau.’ On reading this I went down to our cellar and found my father’s old stereoscope which had enchanted me as a child. The image below, for example, is Red Arch Mountain, Utah, probably photographed in about 1947 (some of the discs have this date). An anonymous photographer’s tiny image in Kodachrome “natural colour”, it now has the time capsule qualities of a miniature landscape in a Book of Hours. What seemed a strange, distant mountain to me as a child is now potentially accessible, but the world that produced the stereoscope is irretrievable, along with the imaginative space of childhood. Posted by Plinius at 9:21 am 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: memory, panoramas, postcards, Walter Benjamin Location: Red Arch Mountain Wednesday, August 30, 2006 150 ft Seaskape, Largiebeg Bruce McLean designed the café-bar at the newly refurbished Arnolfini gallery in Bristol. It is bright and colourful, like his paintings and prints. Not really my cup of tea (although the coffee they serve is good!) It seems a far cry from the late sixties when McLean was dabbling in a kind of land art. For 150 ft Seaskape, Largiebeg (1969) he laid a huge sheet of sensitised paper on the shore hoping for an indexical print of the landscape, but it floated out to sea. Another piece, 2 Rock and Shoreskapes, Largieberg (1969) required only 33 ft of white paper, laid on a rocky shore and covered with watercolour paint, leaving the landscape to tear and stain its presence onto the work. The Arnolfini is one of the sites in Bristol currently hosting the sixth British Art Show. One of the works on show at the Bristol City Museum and Art Gallery, created by Juneau/Projects/, seems to update McLean’s attempts to record the landscape directly: a scanner was pulled along the ground and the resulting images pinned to the gallery wall. However, it is clear from the artists’ installation that the intention here was not simply to facilitate a work of landscape art in which nature is the creator. Their focus is on technology (other works involve microphones, walkmans etc.), the idea being to take them outside and let natural forces demolish them. The British Art Show notes explain that ‘in good morning captain (2004) a scanner is dragged along a forest floor, documenting its own destruction with a series of blurred scans.’ Nevertheless, artists will no doubt continue to seek ways to allow landscape itself to create or adapt their work: kinetic sculpture, sound art or variations on photography (“the pencil of nature”). Outside the art world, simple indexical signs like weather vanes and sun dials let nature signify something (time, wind direction), whilst the landscape itself is full of natural signs that can be read by animals. However, as we know from modernism, art need not point in this way to something specific; signs that give a general sense of an actual landscape may turn out to be more interesting. Posted by Plinius at 8:06 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: seas Location: Isle of Arran Monday, August 28, 2006 Þer as claterande fro þe crest þe colde borne rennez In Sir Gawain and the Green Knight (c1380), the poet describes the landscape through which the hero rides with sufficient detail that R.W.V. Elliott has been able to situate the story in the area of Leek in Staffordshire. Here are lines describing the increasingly inhospitable conditions as winter draws in: For werre wrathed hym not so much þat wynter nas wors, When þe colde cler water fro þe cloudez schadde, And fres er hit falle my3t to þe fale erþe; Ner slayn wyth þe slete he sleped in his yrnes Mo ny3tez þen innoghe in naked rokkez, Þer as claterande fro þe crest þe colde borne rennez, And henged he3e ouer his hede in hard iisse-ikkles. In Bernard O’Donoghue’s new translation for Penguin, the second and third lines relate that ‘ice-cold water poured from the clouds / and froze before it hit the grey ground’. And Gawain is described sleeping in the naked rocks ‘where cold streams clattered down from the heights / or hung over his head in hard spears of ice.’ Simon Armitage is also currently working on a translation, due from Faber in 2007. However, an extract has already been included in Wild Reckoning: An anthology provoked by Rachel Carson’s ‘Silent Spring’ (2004). Armitage has ‘clouds shed their cargo of crystallized rain / which froze as it fell to the frost-glazed earth’ and describes Gawain ‘bivouacked in the blackness’, ‘where melt-water crashed from the snow-capped peaks and high overhead hung chandeliers of ice.’ Posted by Plinius at 10:21 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: ice, Simon Armitage Location: Leek Sunday, August 27, 2006 Hyperborea The National Maritime Museum is showing three sets of photographs by Dan Holdsworth: At the Edge of Space (1999), The Gregorian (2005) and Hyperborea (2006). Images can be seen at the artist’s website. For me the most impressive were the last of these, a series of photographs of the Northern Lights taken in Reykjavik and the Andoya Rocket Range above the Arctic Circle in Norway. The eerie light that dominates these images casts strange colours on the snow: often a sort of faintly luminous grey-green, here and there a quartz-like pink. The rocks and ice lie inert, looking almost unreal beneath these lurid pulsing skies, although in a few of the images an orange glow seems to emanate from the ground from some artificial light sources. Holdsworth’s long exposures leave traces of stars: arcs of varying intensities in delicate shades of turquoise or orange-green. Rather than isolate views, these photographs manage to convey a sense of planetary motion and connect the landscape with a wider view of space and time. Posted by Plinius at 8:22 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: light, snow Location: Andøya, Norway Saturday, August 26, 2006 Scattered Stones at Nikko Yesterday I came upon a blog which reproduced the Hamish Fulton work we have hanging above our computer: The Life of Scattered Stones: Seven One Day Walks in the Rain, Nikko, Japan April 1990. The difficulties of reproduction are at the heart of Hamish Fulton’s work. Our Hamish Fulton print is a record of his walks, but cannot reproduce the experience. It is number 9 of 250 and I sometimes wonder who has the other 249 and what Fulton would think of us all. We bought the print partly in memory of a special day spent at Nikko in 1998, when the old stones and mossy trees glistened in the mist just as they do in Fulton’s rain-washed photograph. Fulton made his walks at Nikko in April, the same month Basho passed through on his Narrow Road to the Deep North, three hundred and one years earlier. Basho felt wary of writing too much about the temple at Nikko and instead recorded his simple awe at seeing green leaves shining brightly in the sun. There is monument to Basho which is away from the main tourist area and therefore possible to enjoy in solitude. Nikko, August 1998 Posted by Plinius at 8:24 am 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Hamish Fulton, Matsuo Basho, stones Wednesday, August 23, 2006 A view of Çatalhöyük An article in the June issue of Natural History magazine explains how excavations at the Neolothic site of Çatalhöyük in Turkey during the early 1960s revealed a wall painting that seems to show a town with a double-peaked volcano in the background. Archaeologist James Mellaart drew a reconstruction to convey more clearly what the painting depicts; the town may be Çatalhöyük itself and the volcano may Hasan Dağ. I suppose this might be described as an 8,500 year old landscape painting… Posted by Plinius at 8:23 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: volcanoes Tuesday, August 22, 2006 The Tatsuta River in Autumn In the Shotetsu monogatari, Shotetsu (1381-1459) wrote ‘If someone asks you in which of the provinces Yoshino may be found, you should answer this way: When I write my poems I simply remember that for blossoms one goes to Yoshino, for red leaves to Tatsuta. Whether those places are in Ise or wherever is not my concern.’ (trans. Steven D. Carter in The Road to Kamatsubara). As this quotation shows, knowledge of poetic geography and the associations of Famous Places were essential for Japanese poets, but familiarity with the real locations was quite unnecessary. As Steven D. Carter puts it, ‘the essence (hon’i) of any Famous Place is defined in terms of a history of poetic treatment; such places occupy poetic rather than physical space’. There is a song Sasa no Tsuyu composed by Kikuoka Kengyo (1791-1847) which includes the words ‘Yoshino blossoms and Tatsuta leaves - without sake they would be ordinary places.’ Despite this, Yoshino and Tatsuta Park still promote themselves as ideal locations for viewing cherry blossoms and red maple leaves. Hokusai included a print of the Tatsuta River in Autumn from his series One Hundred Poems (1835-6). The print illustrates a poem by Ariwara no Narihira (825-80) which states that even in ancient days, when the gods held sway, no water shone red like Tatsuta. (Ariwara no Narihira was a contemporary of Minamoto no Toru, whom Hokusai had depicted, talking in the landscape garden he had designed to resemble Shiogama Bay, in his series A True Miror of Chinese and Japanese Poems). One of the stories told about Hokusai is that when ‘told to paint red maple leaves floating on the Tatsuta River, Hokusai supposedly drew a few blue lines on a long sheet of paper and then, dipping the feet of a chicken in red paint, chased it across the scroll, making the bird's red footprints his maple leaves.’ (Sandy Kita and Takako Kobayashi). This story features in a 1983 poem by the Czech writer Jan Skácel. Posted by Plinius at 10:02 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Katsushika Hokusai, rivers Saturday, August 19, 2006 The Bay of Shiogama Katsushika Hokusai, The Minister Toru, c. 1833-4 Among the miniature landscapes reproduced in Japanese gardens, one of the more elaborate was created in the late ninth century by Minamoto no Toru (822-95), Minister of the Left and a son of Emperor Saga. His Kyoto garden recreated the Bay of Shiogama and even included a salt kiln because the famous kiln at Shiogama was believed to be the first place salt had been made in Japan. As Ivan Morris describes it in his book The World of the Shining Prince, the Minister ‘ordered gallons of water to be brought daily from the coast and, while it was being boiled, he and his friends would sit and imagine themselves in the far-of northern region – a region which, of course, nothing short of a ukase would have induced them to visit in person.’ Royall Tyler also describes the creation of this garden. Why was Toru admired, to the extent that a No play was written about him by Zeami? Tyler thinks there are two reasons: (1) he transmuted the raw landscape into an aesthetic object, bringing the hinterland into the capital; (2) his gesture was at the same time respectful and transmitted recognition back onto the original landscape. Posted by Plinius at 5:59 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: gardens, Katsushika Hokusai, Zeami Location: The Bay of Shiogama Friday, August 18, 2006 The Springs of Clitumnus Sometimes there’s nothing more pleasurable than the lucid prose of a scholar of the old school. A particular favourite of mine is Gilbert Highet’s Poets in a Landscape (1957) which brings alive the Roman poets through vivid translations and an imaginative evocation of their environment. There is, for example, Sextus Propertius, one of whose elegies includes the line among the woods where the Clitumnus hides its lovely springs, and white oxen bathe in the cool stream Highet gets underneath this brief description by quoting other writings by Virgil and Pliny the younger; Pliny says in a letter to his friend Romanus: ‘There is a fair-sized hill, dark with ancient cypress-woods. Beneath this the spring rises, gushing out in several veins of unequal size. After the initial flow has smoothed out, it spreads into a broad pool, pure and clear as glass, so that you can count the coins that have been thrown into it and the pebbles glittering at the bottom.’ Highet himself provides his own description of the site, as he follows in the footsteps of the Roman writers: ‘the springs are about three feet deep. Their bed is creamy white gravel mixed with fine sand. Even in the smallest inlet, a pool the size of a little table, the gravel is constantly stirring, and the surface quivers every fifteen seconds with a tiny explosion of water… All water in motion is wonderful. Cool copious fresh water, absolutely clean, rising out of dry earth under a hot sun, is very wonderful…Willows hang over the wells, gazing into them with a soft narcissus melancholy. Poplar trees, lifting heads and arms to the sky, disdain their own reflections. Between their trunks we see the glinting sides of white oxen, and the timbre of church bells drifts faintly over the water. There is no noise: but there is, in the water and in the air, a ceaseless happy whisper, as though kind spirits inhabited the place.’ He is glad the springs are off the tourist trail and thus little-frequented, ‘… even so it was depressing to see, in one of the fountain-beds, half a dozen Coca-Cola bottles set to cool for possible sale to tourists. Only the charm and quiet of"
