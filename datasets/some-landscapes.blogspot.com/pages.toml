full_description = '''some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Friday, June 30, 2006 Dutch fields Hollandse Velden (Dutch Fields), Hans Van Der Meer’s collection of photographs of Dutch football, includes several poignant landscapes. The photographs are discussed in David Winner’s engaging book about the ‘neurotic genius of Dutch football’, Brilliant Orange, in which he links the spatial awareness of Dutch teams to national creativity in land use and landscape. For example, with the birth of Total Football in the late sixties: ‘just as Cornelis Lely in the nineteenth century conceived and executed the idea of creating giant new polders and altering the physical dimensions of Holland by dyke-building and exploiting the new technology of steam, so Rinus Michels and Johan Cruyff exploited the new breed of players to change the dimensions of the football field.’ In seeking connections between the spatial awareness of footballers and artists, Winner talks to Rudi Fuchs, then director of the Stedelijk Modern Art Museum in Amsterdam. Fuchs argues that the Dutch have a natural instinct for measuring distance and selecting details – something that can be seen in their landscape painting and football. He says “there is a Dutch way of seeing space, the landscape. Cruyff sees in that Dutch way and he is admired for his innate understanding of the geometry and order of the pitch.” Of course this may seem rather far-fetched, particularly given the Dutch team’s recent exit from the World Cup in an ill-tempered game that demonstrated little Dutch artistry (in Brilliant Orange Rudi Fuchs likened Marco Van Basten to Jan Vermeer – but that was Van Basten as a player, not a coach). Nevertheless this kind of argument reminds me of the way Michael Baxandall, for example, has sought to explain the art of Piero della Francesco in relation to the relatively sophisticated understanding of volume among the people of fifteenth century Florence. In his career as director of the Stedelijk Rudi Fuchs was known for making interesting juxtapositions (as this article explains), so was no doubt open to the idea of considering Cruyff alongside other Dutch artists. Fuchs is also, incidentally, the author of a book about Richard Long, an artist whose straight-line approach I am tempted to compare to some of England’s “route one” play when they seem too nervous to pass the ball around and use space creatively. Posted by Plinius at 9:19 am 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Location: Amsterdam Arena Thursday, June 29, 2006 Thicket No. 1 Tate Modern’s re-hang includes their Roni Horn piece, Thicket No. 1 (1989-90), an aluminium slab which incorporates a line from Simone Weil’s Gravity and Grace: ‘To see a landscape as it is when I’m not there’. What you first see is a minimalist object with some black bar-code markings on two sides. Inspection of these reveals the text on the sides of the slab, text which was there all along but not visible, like a landscape when you are not there. As Roni Horn has said in an interview with Jan Howard in 1994, “Thicket No. 1 gives the viewer an inkling of not being present. The contradiction lies in the instinctive weighing of that inkling against the reality, the certainty, of one’s physical presence in that same moment.” Roni Horn also used this quotation in her book To Place – Book I: Bluff Life (1990) which featured drawings made at Dyrhólaey in Iceland. There she was trying “to be present and to be a part of a place without changing it” whilst knowing that “such a desire can only be thwarted”. It may be literally impossible, but somehow to see a landscape as it is when we are not there seems a valid motivation for landscape art in a world where our presence is increasingly felt everywhere. [Incidentally, Thicket No. 1 was presented to Tate Modern by art collector Janet Wolfson de Botton, wife of the late Gilbert de Botton, the wealthy chairman of Global Asset Management, whose hobbies apparently included an attempt to ‘recreate the private library of the French philosopher Montaigne, tracking down and acquiring the books that were dispersed after his death in 1592’ (Paul Lewis in The New York Times, August 30, 2000, as mentioned here).] Posted by Plinius at 10:20 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Roni Horn Wednesday, June 28, 2006 Landscape with Red Spots The title of Tate Modern’s new exhibition Kandinsky: The Path to Abstraction indicates the direction in which we are encouraged to read his paintings. For example, after seeing some colourful works depicting Murnau in the Bavarian Alps, we arrive at Landscape with Red Spots (1913), a more abstract work that retains elements of the landscape at Murnau but no longer explicitly refers to it. Stopping before the referent disappears altogether and looking back at Kandinsky’s early paintings we see landscapes infused with Russia’s folklore and Asiatic culture (a fashionable concern, but Kandinsky had actually studied the Komi people in his brief period as an anthropologist in 1889). In mood these earlier works recall turn of the century symbolist landscapes. However, to get a sense of how far Kandinsky had already travelled one might compare his Boat Trip (1910) with Nesterov’s Silence (1903) (one of the most memorable paintings in the National Gallery’s recent ‘Russian landscape in he age of Tolstoy’ exhibition). Kandinsky (1866-1944) and Nesterov (1862-1942) were almost exact contemporaries but took different paths. Mikhail Nesterov, Silence (1903) (Kandinsky's painting are still in copyright) Posted by Plinius at 7:52 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Location: Murnau am Staffelsee, Germany Monday, June 26, 2006 Egdon Heath “A Saturday afternoon in November was approaching the time of twilight, and the vast tract of unenclosed wild known as Egdon Heath embrowned itself moment by moment. Overhead the hollow stretch of whitish cloud shutting out the sky was as a tent which had the whole heath for its floor…” Thus begins Thomas Hardy’s The Return of the Native (1878). In his short 1895 preface to the novel, Hardy wrote “Under the general name of "Egdon Heath," which has been given to the sombre scene of the story, are united or typified heaths of various real names, to the number of at least a dozen; these being virtually one in character and aspect, though their original unity, or partial unity, is now somewhat disguised by intrusive strips and slices brought under the plough with varying degrees of success, or planted to woodland. It is pleasant to dream that some spot in the extensive tract whose southwestern quarter is here described, may be the heath of that traditionary King of Wessex—Lear.” The fictional landscape of Egdon Heath can be experienced in a multitude of ways. There are Hardy’s own descriptions and the sketch map he made in 1878. Hardy’s friend, the photographer Herman Lea, provided a photograph of the fictional landscape as the frontispiece for the 1912 re-issue of The Return of the Native. There are more recent illustrations and media adaptations of the novel (Catherine Zeta-Jones once took the role of Eustacia Vye). One can visit the remains of the real landscape that inspired Hardy (being preserved in the Hardy’s Egdon Heath Project). Or one can turn to works inspired by the idea of Egdon Heath, most obviously Gustav Holst’s 1927 composition. An Edwin Evans article from 1934 available on-line in the Musical Times archive speculated on why Egdon Heath had not yet then been sufficiently appreciated. “Its chromaticism verges on the atonal – there are many passages to which it is difficult to assign a definite tonality. Yet the effect is not vague in the musical sense. It is the emotion that sets the ear guessing. It is one more frequently expressed by painters. One is reminded of those landscapes which at the first glance present a flat, monochrome surface and come to life gradually as the eye probes into them.” Of course there are many different recordings of Holst’s Egdon Heath, further multiplying the variations on Hardy’s landscape. The one constant is Holst’s score, the original manuscript version of which might be compared to Hardy’s original sketch map. However, in the article by Evans just quoted, he complains “I have little patience with those who profess inability to arrive at an opinion of a piece of music until they have studied the score. It is the ear, not the eye, that is the arbiter on matters of sound… Musically ‘Egdon Heath’ is not intricate, but its mood is elusive, remote, and an audience that has spent all the hours of the day in the turmoil of modern life is not attuned to it.” Posted by Plinius at 9:52 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Location: Heathland, Dorset Sunday, June 25, 2006 Many thousand views I was recently given a reproduction of an ‘Endless Landscape’ ‘closely based on one published in Leipzig in the 1830s’. This is an example of a myriorama, a pack of cards depicting slices of landscape which can be rearranged to create different panoramic views. The word myriorama derives from Greek myrias, “ten thousand”, and refers to the different combinations possible with a relatively small number of cards. The myriorama was invented in 1802 by Jean-Pierre Brés (1760-1834) and developed in England by John H. Clark (1771-1863). Stephan Oettermann’s comprehensive book on the Panorama includes the advertisement for Clark’s myriorama that was published in the brochure for the Regent’s Park Diorama in 1825: Picturesque Scenery / Just Published, The Myriorama; or, many Thousand Views, Designed by Mr. Clark. The Myriorama is a movable Picture, consisting of numerous Cards, on which Fragments of Landscapes, neatly coloured, and so ingeniously contrived that any two, or more, placed together, will form a pleasing View; or if the whole are put on a table at once, will admit the astonishing Number of 20,922,789,888,000 Variations: it is therefore certain, that if a person were occupied night and day, making one change every minute, he could not finish the task in less than 39,807,888 years, and 330 days. The cards are fitted up in an elegant box, price 15s. The Myriorama (second Series) consisting entirely of Italian Scenery, Designed by Mr Clark. The Second Series is capable of even greater variation thn the First, as the number of cards is increased from 16 to 24. The changes or variations which may be produced by the 24 Cards, amount to the astounding and almost incredible number of 640,448,401,733,239,360,000. Price 1 L. 4s. in an Elegant Box. There is a photograph of a myriorama at the Bill Dougas Centre site. The term myriorama later came to be used for moving panoramas – Poole’s Myriorama is mentioned in the ‘Penelope’ chapter of Joyce’s Ulysses. The concept of a myriorama could be adapted to contemporary art in various ways: one example on-line is this installation by the Australian artist Tony Clark. Posted by Plinius at 12:54 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: panoramas Location: Leipzig, Germany Saturday, June 24, 2006 Under a beech tree Virgil’s first Eclogue opens with the farmer Meiliboeus addressing Tityrus, who is reclining under a sheltering beech tree, playing his reed pipe. Meliboeus is envious of Tityrus, who has the leisure to sit in the shade and teach the woods to repeat his song ‘Fair Amaryllis’ and is amazed that Tityrus can be so relaxed when the countryside is full of troubles (the land confiscations following the Battle of Philippi). But Tityrus has recently been granted his freedom by Augustus and can afford to sing of love and celebrate the pastoral scene. Tityrus takes pity on Meliboeus and invites him to stay the night for a meal of apple, cheese and chestnuts. Tityrus reappears in Paul Valéry’s ‘Dialogue of the Tree’ (1943), this time in conversation with the philosopher-poet Lucretius, author of On the Nature of the Universe. Valéry contrasts the desire of Tityrus to celebrate a simple unreflective idea of nature, with Lucretius’s search for a more profound underlying truth. Lucretius finds Tityrus gazing at the beech tree, drawn upward to the ‘leaf-woven air’ and inspired to give this beautiful moment a musical form. Tityrus only wants to know the tree in its ‘happy moments’ and fuse its fleeting nature and the voices of leaves, birds and animals into a single form. Lucretius by contrast seeks the Nature of Things and has a more profound understanding of the tree. He feels that Tityrus only loves his own song, not the true beech tree that is its source. Lucretius sees through fleeting appearance to the hard wood of a thirsty plant, gripping its rock and drawing sustenance from the earth. In meditating on the natural order, Lucretius goes so far as to liken himself to the tree it in its structured growth and natural rhythms. Tityrus sings of the tree, but for Lucretius the tree itself is a song. They feel the cool of evening approaching and part with Lucretius lost in radiant rapture. Lucretius might be seen in this guise as reflecting some of the attitudes of modern post-pastoral poetry. And yet at the end of the dialogue there is something almost too serious and profound in his words, and the reader feels like leaving Lucretius under the tree to follow the modest shepherd Tityrus, as he goes to gather his flock. Incidentally, the beech tree that Tityrus sits under in both dialogues was native to north Italy, where Virgil was born. It was not known in Greece and therefore it had no established poetic resonances when Virgil was writing: beech trees were mentioned by Catullus but do not appear in Greek poetry like Virgil’s model, the Idylls of Theocritus. It would seem that Virgil drew it from his own landscape experience. After the Eclogues the beech tree would often be associated with the artificial landscape of pastoral poetry. As in Valéry’s dialogue, the beech tree can seem real or poetic, depending on the poet. Posted by Plinius at 3:03 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Arcadia, pastoral, Virgil Friday, June 23, 2006 Waking in the marram grass The photograph here shows some silver marram grass we saw on the island of Bryher a couple of summers ago. It was swaying invitingly and reminded me of Thomas A. Clark’s short poem on falling asleep in marram grass, a poem that can be seen on his website. As the Scottish poetry library site’s page on him explains, Clark runs the Cairn gallery which has recently re-located to Pittenweem. I have not visited the new version, but the earlier gallery in Nailsworth was a special place with the feeling of a sanctuary: above an old post office, quiet, white rooms hu'''
