full_description = '''some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Monday, January 30, 2006 The New Station of Naito at Yotsuya Ando Hiroshige, Maple Leaves and the Tekona Shrine and Bridge at Mama, 1856-9 Ando Hiroshige’s landscape prints often employ traditional Chinese or Japanese techniques, such as the use of mist to separate distant forms and a spatial arrangement where the nearest objects are in the lowest part of the image. However, as Matthi Forrer has written (‘The Art of Hiroshige’), when Hiroshige designed One Hundred Views of Edo (1856-8) he often used Western artists’ repoussoir device of placing large objects in the foreground. For example, in Maple Leaves and the Tekona Shrine and Bridge at Mama the view is framed by tree branches, whilst the Kinryuzan Temple at Asakusa is seen from a doorway with an overhanging lantern. However, it has to be said that the technique was not always successful. There is too much bridge in Nihon Bridge and Edo Bridge and the hanging turtle does not seem to add much to Mannen Bridge and the Fukagawa District. The presence of a large horse’s bottom and droppings in The New Station of Naito at Yotsuya are particularly unfortunate... Ando Hiroshige, The New Station of Naito at Yotsuya, 1856-9 The links here are all to images on a beautiful website, The Woodblock Prints of Ando Hiroshige. I came upon the Hiroshige site by following a link on the excellent Pruned blog. [These images are now more widely available, e.g. on Wikimedia Commons, so I have added two subsequently to this post] Posted by Plinius at 10:12 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Ando Hiroshige, bridges Location: Yotsuya, Tokyo Saturday, January 28, 2006 The road to Cap d'Antibes In contrast to John Rewald, whose search for the sites painted by Cézanne I described in yesterday's post, the young art critic and painter Patrick Heron (1920-1999) did not go to southern France in 1949 in pursuit of landscapes – he had hoped to meet Henri Matisse in person. In the event, as Heron recalled in his essay ‘Late Matisse’, the artist was too busy to see visitors, but on Heron’s return from Matisse’s villa he came upon a familiar view and recognised the place from which Matisse had painted Route du Cap d’Antibes – Le Grand Pin (1926). Heron took a photograph, standing in the position he thought the pine trees had been seen from in the original picture. As he did this, glancing to his right, he saw “a gleam of red amongst the mosses and lichens in the wall” and after clearing them away he found a tangible trace of the artist’s painting, oxidised palette scrapings of “ultramarine, violet, emerald green and scarlet”… Posted by Plinius at 9:16 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: roads, viewing points Location: Cap d'Antibes Friday, January 27, 2006 Millstone in the Park of Château Noir John Rewald (1912–1994) was the author of the classic study Cézanne: A Biography (1986), a book that had its origins fifty years earlier in research for his prize-winning thesis Cézanne et Zola (1936). Rewald’s efforts were not appreciated by his Sorbonne professor, who ‘felt that Cézanne was not yet “ripe”’, but he received support from various people who had known the artist and when it came to the public defence of Rewald’s thesis, Zola’s daughter and son-in law sat in the front row of the amphitheatre. One of the pleasures of the subsequent book is the inclusion of photographs taken at the site’s of Cézanne’s landscapes (often labelled “c1935”, as Rewald presumably took no precise record of the dates in his wonderings round Provence). These are obviously a valuable historical record of places that have changed, but they have their own beauty. Although the photographs are composed as precisely framed documents, they distil a powerful sense of nostalgia, both for the artist and his times and now, more generally, for that lost idyllic pre-War rural France. Like Cézanne’s paintings, they seem to reflect both the transience of Impressionism and the timeless forms of rocks, trees, mountain. They are also moving mementos of a time when it was still possible for a young researcher to visit Provence and learn about Cézanne by talking to his son Paul and elderly artists like Signac and Denis. The photographs are now owned by the National Gallery of Art in Washington (which is holding a centenary exhibition of ‘Cézanne in Provence’). A few small images can be seen here, for example Mont Sainte Victoire seen from Les Lauves, which was the subject of a painting of 1904-6. However, the ideal way to look at these photographs is in the context of Rewald’s book. I have just been looking at it again and became lost in thought over the Millstone in the Park of Château Noir, a photograph that catches the original painting’s slanting summer light and shows the millstone just as it lies in Cézanne’s landscape, an abandoned object returning to nature. Paul Cézanne, Mont Sainte-Victoire Seen from Les Lauves, 1904-6 Source Wikimedia Commons Posted by Plinius at 9:31 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Paul Cezanne, ruins, viewing points Location: Cézanne's Provence Tuesday, January 24, 2006 Tintern Abbey J. M. W. Turner, Tintern Abbey, c. 1794 Source: Wikimedia Commons The BBC is showing a three part Peter Ackroyd series on ‘The Romantics’. Their site contains a few free MP3 poetry readings, including William Wordsworth’s ‘Lines Written A Few Miles Above Tintern Abbey, On Revisiting The Banks of the Wye During A Tour, July 13, 1798’, a poem describing the redemptive powers of Nature and the consolations that can be had from landscapes held in the memory: …let the moon Shine on thee in thy solitary walk; And let the misty mountain winds be free To blow against thee: and in after years, When these wild ecstasies shall be matured Into a sober pleasure, when thy mind Shall be a mansion for all lovely forms, Thy memory be as a dwelling-place For all sweet sounds and harmonies… If you want to hear the BBC’s recording of John Clare’s ‘Remembrances’ you will have to be quick. As the site says “unfortunately Remembrances will only be available for 7 days due to copyright.” Those not familiar with this sorry situation can read all about the ongoing copyright dispute on this John Clare site. Posted by Plinius at 8:53 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: memory, ruins Location: Tintern Abbey Sunday, January 22, 2006 The Nook at Hardt ‘The Nook at Hardt’ is Michael Hamburger’s translation of ‘Der Winkel von Hahrdt’, Friedrich Hölderlin’s short poem of 1803: Der Winkel von Hahrdt Hinunter sinket der Wald, Und Knospen ähnlich, hängen Einwärts die Blätter, denen Blüht unten auf ein Grund, Nicht gar unmündig. Da nämlich ist Ulrich Gegangen; oft sinnt, über den Fußtritt, Ein groß Schicksal Bereit, an übrigem Orte. The poem describes a ‘nook’ or ‘shelter’ of trees. The ground is covered with flowers and is “able to speak for itself” - here ‘Ulrich’ once walked, giving the site a sense of destiny. The Ulrich referred to is Duke Ulrich of Württemberg, who hid in the forest in 1519. He had finally been driven from Württemberg four years after killing a knight whose wife he had fallen in love with (an act illustrated in the contemporary woodcut below). According to Theodor Adorno in Aesthetic Theory, the forest in this poem is only beautiful because it bears the mark of a past event. Otherwise it would just be some trees. Adorno felt that it is only possible to distinguish beauty in nature to the extent that a landscape is eloquent and conveys more than is literally there. This poem depicts an eloquent place that is, in effect, a spectacle. For Adorno, "natural beauty is suspended history" and therefore "artworks that resonate with this moment of suspension are those that are justly said to have a feeling for nature.” (p71, translation by Robert Hullor-Kentor). Posted by Plinius at 11:22 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: forests Location: Hardt, Germany Friday, January 20, 2006 Thermal Photograph reproduced on the wall of the Science Museum, London In paintings like Thermal (1960) Peter Lanyon fused the roles of glider pilot and landscape painter. However, he was by no means the first painter to take to the air. One could go back to the stories of flying experiments by Leonardo da Vinci, or another polymath and painter, Paolo Guidotti. And in the twentieth century Italian Futurists were among many artists considering the implications of powered flight. However, long before Marinetti wrote his Manifesto dell Aeropittura (1929), a precursor to Lanyon was building some of the earliest successful gliders. José Weiss (1859-1919) was a Paris-born landscape painter who lived in England. Just as Lanyon drew inspiration from watching the seagulls flying around the cliffs of Cornwall, Weiss had a lifelong interest in birds, as is evident from his designs for gliders. Photographs show them to be beautiful constructions (and, incidentally, more reminiscent of the sculptures Lanyon later made than the streamlined post-war gliders Lanyon flew). The combination of scientific understanding and artistic flair has led aviation historians to liken Weiss to Leonardo (see the comments here for example). But how did Weiss’s researches into flight affect his painting? Unsurprisingly perhaps, hardly at all. His landscapes reflected prevailing trends, influenced by the Barbizon school and Impressionism. Here are some links to images currently on-line: Barbizon Lakeside Landscape with Path, The Stream and Barbizon Landscape. Posted by Plinius at 10:40 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: aerial landscapes, Leonardo da Vinci, Peter Lanyon Location: Barbizon, France Tuesday, January 17, 2006 Morning Giuseppe Ungaretti’s poem ‘Mattina’ (‘Morning’) may be the shortest great poem of the last century: M’illuminoD’immenso As Alistair Reid says in his anthology Italian Landscape Poems, this is ‘a landscape poem with no landscape in it, no history, and no person but the narrator’. Ungaretti began his career as Italy’s poet of the Great War, and ‘Mattina’ reflects the poet’s feelings after surviving another dangerous night (for more information, in Italian, see this Ungaretti site). Alistair Reid tried out several English versions of the poem in an attempt to capture its many possible meanings, but perhaps it hardly needs to be translated. Patrick Creagh made no attempt in the Penguin Modern Poets edition of Ungaretti’s verse (1971), saying that ‘Mattina’ is untranslatable. Nor does it feature among the more recent Carcanet Selected Poems translated by Andrew Frisadi, although Frisadi does have a stab at it in the introduction. Posted by Plinius at 8:39 pm 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Sunday, January 15, 2006 Ocean Rain For rock albums, iconic images of the band/artist have usually been so important that any landscapes are relegated to something like the Renaissance parergon, a secondary feature. To the extent that rock is the ‘sound of the city’, rural or wild landscapes would normally be inappropriate. However, one band who specialised in landscape settings were Echo and the Bunnymen (see for example the images on Villiers Terrace.com). The covers of their albums Crocodiles and Ocean Rain retain a theatrical quality, with colourfully lit landscapes serving as backdrops for the band. But Heaven Up Here and Porcupine are dominated by sublime landscapes: the windswept beach and the frozen glacier. The band actually recorded their video for ‘The Cutter’ in Iceland and embarked on a tour in 1983 taking in Iceland, Denmark and the Isles of Skye and Lewis. In his book Rip it up and Start Again: Post Punk 1978 – 1984, Simon Reynolds notes that the Bunnymen were not alone in using dramatic landscape imagery. The Blue Orchids, who toured with the Bunnymen, eschewed a band photograph in favour of a simple sunset on their album The Greatest Hit. And in the early eighties many British bands were using rather nebulous elemental lyrics: ‘Under a Blood Red Sky’, ‘The Whole of the Moon’, ‘Fields of Fire (400 Miles)’. Perhaps it was in part a reaction to the bleak urban imagery that had dominated songs by The Clash, The Fall and Joy Division. Posted by Plinius at 9:39 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Location: Gullfoss, Iceland Saturday, January 14, 2006 Black Ripple How can a contemporary artist paint a landscape without making it ironic? To take just one of artist wrestling with this issue, consider Kate Bright, who paints mountain landscapes and images of water using acrylics and glitter, like Black Ripple (2001). In an interview on the British council site she says The glitter, from the moment I picked it up, was screaming to be sunshine on water. It was like water in my hand. I earnestly want to capture that in a painting. In a way, it's about the impossible notion of possessing the sublime. I seem to be trying to make these contemporary landscape paintings that aren't really to do with anything that has been done in landscape painting before. Apart perhaps, from Christmas cards painted by people with their feet, which unfortunately, you can't find anymore. There is always this thing with glitter, all the references to kitsch and camp, which those Christmas cards had. But at the same time they are genuinely endearing, in an 'old lady-ish' way. There is a sweetness to them. As a kid it became the Christmas card, loosely painted with a splash of glitter on, the epitome of Christmas. But in my work, the same language doesn't apply. This is always something I have to mention about my work - that it's not about kitsch or irony. It's completely. I want to say heartfelt, but heartfelt is still so kitsch. Perhaps they are romantic, or dare I say genuine. Irony is like saying 'look at me, I am crying, but not really. These are not real tears, I am being quite clever (fake crying) and you have to pat me on the back for that'! But the paintings are not like that at all. They try to be like beautiful mountains and lovely sunshine on water. They really are trying to be like that. I know they don't really achieve it, they are never quite what I want them to be. I have this idea in my head that I want them to be a certain way and something happens in the process so they end up different. Have I failed or not? They surprise you. Or perhaps I surprise myself. I was always thinking that my paintings might be seen as someone painting in vain. Is it impossible to capture that moment when, awe struck, you witness some natural phenomena? '''
