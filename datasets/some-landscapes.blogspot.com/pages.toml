full_description = "some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Sunday, April 30, 2006 Lit dew shimmers Poet and Chinese scholar David Hinton has specialised in translations from the Chinese rivers-and-mountains tradition. He has been well served by publishers – the books are beautifully produced, as can be seen on the David Hinton website. As I write this I am looking at the Archipelago Books edition of The Mountain Poems of Meng Hao-jan, printed on “60lb Mohawk Vellum” paper, with its imagistic poems spaced elegantly on each page. The Mountain Poems of Meng Hao-jan is the first English book devoted completely to the High T’ang poet Meng Hao-jan (689-740). The introduction quotes poems by Li Po and Wang Wei to give a sense of how these better known poets revered Meng, and a later poem by Po Chü-i in which ‘Meng himself disappears into landscape while his poems survive as landscape’. Rather than become a bureaucrat or monk, Meng lived a simple life in the mountains of Hsiang-yang. His surviving body of work is not large; ‘it is said that Meng’s practice was to destroy poems after writing them because they inevitably failed to render experience at that absolute level that lies beyond words.’ There are a few sample poems on Hinton’s site which demonstrate the way Meng rendered experience: “My thatch hut grows still. At the bottom stair, in bunchgrass, lit dew shimmers.” In one of these poems, Meng climbs Long-View Mountain to survey the landscape, clouded in mists and blossoms. In another, Meng writes from his ‘bamboo-leaf gardens’ to Ch'ao, the ‘Palace Reviser’ – while Ch’ao toils in the library, Meng lives close to nature, where words start to be forgotten. Posted by Plinius at 8:01 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: huts, light, Meng Hao-jan Saturday, April 29, 2006 Earthrise There is currently a trend for uncovering documentary photographs and considering them in the context of landscape art practices and conventions - a recent example is the book Record Pictures: Photographs from the Archives of the Institution of Civil Engineers by Michael Collins. Perhaps the most spectacular set of documentary photographs recovered in this way is Michael Lite’s reprints from the NASA archive. His Full Moon site has some of these images. Most of the best lunar landscapes were photographed from orbiting spacecraft, e.g. a view of Rima Ariadaeus, a terraced wall crater, and a lunar rille, all photographed by the Apollo 10 astronauts in May of 1969. The best known lunar landscape is one in which the moon is merely the frame: Earthrise (above) photographed by William A. Anders on Christmas Eve 1968 from Apollo 8. For the story of how the photograph came to be taken, see the account by Robert Zimmerman. The ABC site has the black and white image by Apollo 8’s commander Frank Borman, and the famous colour image rotated to the orientation Anders originally saw through the viewfinder. Is there a danger in aestheticising these photographs? Landscape often gives rise to questions about the overlap between scientific observation and art. The status of these Apollo photographs might be likened to the paintings of John Russell (1745-1806), who made meticulous studies of the moon’s surface using a telescope, like this one. Posted by Plinius at 10:00 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: the moon Friday, April 28, 2006 Scottish streams John Millais, Portrait of John Ruskin, 1853-4 In this memorable passage, John Ruskin observes the acoustic qualities of Scottish streams: 'I know no other waters to be compared with them; - such streams can only exist under very subtle concurrence of rock and climate. There must be much soft rain, not (habitually) tearing the hills down with floods; and the rocks must break irregularly and jaggedly. Our English Yorkshire shales and limestones merely form – carpenter-like – tables and shelves for the rivers to drip and leap from; while the Cumberland and Welsh rocks break too boldly, and lose the multiplied chords of musical sound. Farther, the loosely-breaking rock must contain hard pebbles, to give the level shore of white shingle, through which the brown water may stray wide, in rippling threads. The fords even of English rivers have given the names to half our prettiest towns and villages – (the difference between ford and bridge curiously – if one may let one’s fancy loose for a moment – characterizing the difference between the baptism of literature, and the edification of mathematics, in our two great universities); but the pure crystal of the Scottish pebbles, giving the stream is gradations of amber to the edge, and the sound as of ‘ravishing division to the lute,’ make the Scottish fords the happiest pieces of all one’s day walk.' From Fors Clavigera, Letter XXXII, August 1873, Section 14 Posted by Plinius at 4:08 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: John Ruskin, rivers Monday, April 24, 2006 Vague snow descending A John Clare poem gives its title to a new anthology of ‘poems for the planet’, The Thunder Mutters, edited by Alice Oswald, author of Dart. Clare’s biographer Jonathan Bate has reviewed it in The Guardian. Clare is also represented among Oswald’s 101 choices by a transcription of a nightingale song and a prose description of a woodman working in a winter forest. These examples convey her aim in the anthology to highlight poems that enter directly into the natural world through close observation or labour (Oswald herself worked as a gardener). As she says in the introduction, “no prospect, pastorals or nostalgic poems are in here…” So in a way this is an anthology about poets in the landscape rather than ‘landscape poems’. Nevertheless, one poem in The Thunder Mutters is simply called ‘Landscape’. The poem didn’t have this title in French (frustratingly there is no information about any of the poems apart from some incomplete acknowledgements, so it is unclear to the reader when or in what form this poem, or others like ‘The Thunder Matters’, were first written or published). ‘Landscape’ is a translation by C.F. Macintyre of Paul Verlaine’s ‘Dans l’interminable ennui de la plaine’ (1874). This poem concerns neither nature nor outdoor work - it is a landscape of the mind, a ‘flat land’ with ‘vague snow descending’ and woods where misty grey oaks twist like clouds: Dans l'interminable Ennui de la plaine La neige incertaine Luit comme du sable.Le ciel est de cuivre Sans lueur aucune On croirait voir vivre Et mourir la lune. Comme des nuées Flottent gris les chênes Des forêts prochaines Parmi les buées… Alice Oswald places this ‘Landscape’ opposite ‘Mississippi Bo Weavil Blues’ by blues singer Charlie Patton, which gives an indication of the anthology’s range. It is a strength of the book that her selections are quirky and personal – she includes a poem by her husband and local epitaphs from Bideford and Great Torrington churches. The combination of famous poems by writers like Marianne Moore, Seamus Heaney, Robert Frost and Walt Whitman interspersed with fragments of oral and experimental poetry make The Thunder Mutters a very enjoyable collection. Posted by Plinius at 4:52 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Alice Oswald, John Clare, snow Location: Great Torrington, Devon Saturday, April 22, 2006 Swordy Well There is a good John Clare blog which combine extracts from the poems and prose with appropriate images. Some recent posts have been on Clare’s poem ‘The Lament for Swordy Well’ – site of a quarry near Clare’s home which has recently been saved from developers by the Langdyke Trust. Swordy Well is one of Clare’s special places… it seems inappropriate to use the term ‘landscape’ in connection with poetry so immersed in its subject. In Edwin Paxton Hood’s book The Literature of Labour, published in 1851 when Clare was still living in the Northampton Asylum, it is noted that ‘other poets select a river, or a mountain, and individualise it, but to Clare all are but parts of the same lovely Home, and as every part of the home is endeared – the chair, the shelf, the lattice, the wreathing flower, the fire-place, the table – so is every object in Nature a beloved object, because the whole is beloved.’ One telling example of the way Clare goes beyond other poets in his relationship with the natural world is provided by R. K .R. Thornton, in his introduction to a short anthology of Clare’s verse published by Everyman (1997). Clare is ‘the only poet I know of who would be able to describe the changes in trees not by descriptions of the leaves, not by accounts of the blossom or berries, but by describing changes in the bark.’ Thornton cites as an example ‘Pleasures of Spring’ in which Clare describes the bark of blackthorn darkening, hazels shoots regaining bright freckles and ‘foulroyce’ (dogwood) twigs shining red as ‘stockdoves’ claws.’ Posted by Plinius at 3:12 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: John Clare Wednesday, April 19, 2006 Small woods, and here and there a voide place The OED is allowing free access to its online edition this week. Here are four definitions of the word ‘landscape’ along with some illustrative quotations from the seventeenth century. A picture representing natural inland scenery, as distinguished from a sea picture, a portrait, etc: 1605 Ben Jonson in The Masque of Blackness, “First, for the Scene, was drawne a Landtschap, consisting of small woods...” The background of scenery in a portrait or figure-painting (obsolete): 1656 Thomas Blount in Glossographia, “All that which in a Picture is not of the body or argument thereof is Landskip, Parergon, or by-work.” A view or prospect of natural inland scenery, such as can be taken in at a glance from one point of view; a piece of country scenery: 1632 John Milton in L’Allegro, “Streit mine eye has caught new pleasures Whilst the Lantskip round it measures.” In a generalized sense, inland natural scenery, or its representation in painting: 1606 Thomas Dekker in The seuen deadly sinnes of London, “A Drollerie (or Dutch peece of Lantskop).” The first of these references, The Masque of Blackness, was Ben Jonson’s first masque, performed for Queen Anne at Whitehall Palace on 6 January 1606. It is usually discussed in relation to issues of race and gender, but the artificial landscape scenery is interesting as it was part of an early Inigo Jones design. Here is the full description from which the OED's quotation above is taken: First, for the Scene, was drawne a Landtschape, consisting of small woods, and here and there a voide place filld with huntings; which falling, an artificiall Sea was seene to shoote forth, as if it flowed to the land, raised with waues, which seemed to moue, and in some places the billow to breake, as imitating that orderly disorder, which is common in nature. Posted by Plinius at 10:24 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: John Milton Location: Whitehall Monday, April 17, 2006 Mountains and clouds, reflected Charles Tomlinson, a poet who has always drawn inspiration from landscapes and landscape painting, once wrote a review (Modern Painters Spring 1989) in which he described his discovery of Cézanne through books. This intellectual journey began during the war, when it was not possible to view any actual paintings, with a tiny black and white illustration of a view of Gardanne in Eric Newton’s European Painting and Sculpture. However, the first significant book was Adrian Stokes’ Cézanne, which Tomlinson read in 1948. Stokes likened Cézanne’s treatment of form to ‘trees reflected by slightly undulating water’, a metaphor that Tomlinson links to these lines of Wordsworth (The Prelude Book IV) that, like the paintings, focus our attention on the process of perception itself: As one who hangs down-bending from the sideOf a slow-moving boat, upon the breastOf a still water, solacing himselfWith such discoveries as his eye can makeBeneath him in the bottom of the deep,Sees many beauteous sights--weeds, fishes, flowers,Grots, pebbles, roots of trees, and fancies more,Yet often is perplexed, and cannot partThe shadow from the substance, rocks and sky,Mountains and clouds, reflected in the depthOf the clear flood, from things which there abideIn their true dwelling… Who else did Tomlinson go on to read? Merleau-Ponty’s 1948 essay Le Doute de Cézanne is described quite rightly as a ‘wonderful fifteen pages’. Tomlinson was also stimulated by the discussion of Cézanne’s painting The Abandoned House in André Breton’s L’Amour Fou. Then there were the writings of William Rubin (‘Cézanne and the beginnings of Cubism’, 1977), Theodore Reff (‘Painting and Theory in the Final Decade’, 1978) and Meyer Shapiro (various books). However, Tomlinson ends the review recommending the ‘necessary’ book, Cézanne: A Biography by John Rewald. A postscript to this list was a letter Tomlinson wrote in the next issue explaining that he regretted having had to exclude Kurt Badt’s ‘remarkable’ The Art of Cézanne (1965), as well as D.H. Lawrence’s ‘Introduction to these Paintings’ (1929), Rilke’s letters on Cézanne and Charles Biederman’s The New Cézanne (1958)… So, to summarise, here were Tomlinson’s favourite Cézanne writers, 17 years ago: Stokes, Merleau-Ponty, Breton, Rubin, Reff, Shapiro, Rewald, Badt, Lawrence, Rilke and Biederman.Tomlinson mentions the Modern Painters piece on Cézanne in a 1991 interview with David Morley in The North. For more on Tomlinson see The Charles Tomlinson Resource Centre. His new book Cracks in the Universe appears next month. Posted by Plinius at 1:56 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Charles Tomlinson, clouds, Paul Cezanne, William Wordsworth Sunday, April 16, 2006 The Wall, Dymchurch On the centenary of the birth of Paul Nash (1889-1946) there was an exhibition of his art called 'Paul Nash: Places' which focused on seven key landscapes in his career. These landscapes were: Iver Heath, where his family bought a house in 1900; The Wittenham Clumps, strange chalk hills with a group of beech trees at the summit; The Chilterns, where Nash lived immediately after the First World War; the bleak coastal landscape of Dymchurch; Avebury with its prehistoric stones; Monster Field in Gloucestershire, a site where Nash drew and photographed surreal tree forms; and Boar's Hill near Oxford, home of Nash's friend Hilda Harrisson, where he stayed in the early 1940s. Paul Nash, The Wall, Dymchurch, c. 1923 Source: Tate Gallery - public domain (image added 2017) The paintings, lithographs and wood engravings Nash made at Dymchurch are particularly compe"
