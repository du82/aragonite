full_description = "some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Friday, March 31, 2006 Splice garden In Anne Whiston Spirn’s book The Language of Landscape there is an entertaining chapter in which she thinks up landscape equivalents for figures of speech: alliteration, anachronism, cliché, euphemism, litotes, metonym, synecdoche etc. etc. Some are more obvious than others. Looking for the more obscure figures of speech I was interested in her discussion of meiosis. Meiosis is defined here as a “reference to something with a name disproportionately lesser than its nature”, and their example, in Monty Python and the Holy Grail, is the Black Knight’s dismissal of the loss of both his arms in a fight with King Arthur as “just a flesh wound”. In landscape design, Spirn associates this kind of belittling understatement with the work of Martha Schwartz. Schwartz’s playful, conceptual gardens reject the ‘Nature Fantasy’ that underlies traditional landscape design. She aroused fierce criticism when Landscape Architecture Magazine featured her Bagel Garden on its cover in January 1980 and she remains a controversial figure. In a recent article by Tim Richardson in the Telegraph, for example, he says “it is surprising what fury Schwartz's work arouses among some horticulturists - in the past weeks, several contributors to this newspaper have told me they think that Schwartz is a trickster.” The designs of Martha Schwartz can also be used to illustrate other figures of speech. Spirn discusses her Splice Garden (Cambridge Massachusetts) as an exemplification of paradox, oxymoron and conceit. This rooftop space (the location itself to some extent paradoxical) includes plastic flowers and witty juxtapositions, like a formal French clipped tree encircled by the raked gravel of a Zen garden. Update 2015: Since writing this a lot more material has become available online and it has become possible to embed video clips in blog posts, so here is a Martha Schwartz lecture from Vimeo.. Posted by Plinius at 8:11 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: gardens, language Tuesday, March 28, 2006 Utah Beach It is now fifty years ago that J.G. Ballard published his first short stories. Rereading one of these, ‘Prima Belladonna’, recently I was surprised how much of the story is rooted in the form of fifties British SF, forgetting how much his work and the issues he writes about have changed, even though his preoccupation with surreal landscapes has always been there. Ballard’s vision of Vermillion Sands, the near future desert resort populated by idle dilettantes, first described in ‘Prima Belladonna’ remains pertinent, although perhaps its location would now have shifted to Dubai. Another constant in Ballard’s work is his interest in landscapes transformed by military technology. In The Guardian last week, he was describing the strange Modernist structures of Utah Beach, which resemble those blockhouses of a nuclear testing site that feature in his story ‘The Terminal Beach’ (1964). Ballard implies in his article that few tourists visit Utah Beach, although surely it is only a matter of time before there are guide books to such sites, following the example of Robert Smithson’s essay ‘A Tour of the Monuments of Passaic’. There is already a J.G. Ballard group on Flickr, where seekers of the Modernist picturesque can view and deposit photographs of decaying military installations, abandoned hotels, failed utopias and entropic ruins. Posted by Plinius at 9:41 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: J. G. Ballard, shores Location: Utah Beach, France Sunday, March 26, 2006 Wooden boulder There is an interview with David Nash in Sculpture Magazine where he says “I think Andy Goldsworthy and I, and Richard Long, and most of the British artists’ collectives associated with Land art would have been landscape painters a hundred years ago. But we don’t want to make portraits of the landscape. A landscape picture is a portrait. We don’t want that. We want to be in the land.” From a landscape perspective, one of Nash’s most interesting works is Wooden Boulder. This 25 year project is the subject of a documentary film, Boulder, by Pete Telfe, and various photographs and drawings by Nash. It began in 1978 when Nash was asked to fell an oak tree, for safety reasons, that overhung a cottage at Bronturnor, North Wales. Nash cut part of the tree into a large wooden ‘boulder’ with the aim of taking it back to his studio as a wood ‘quarry’. However, he decided instead to push it into the nearby stream, where it became wedged between rocks beneath a waterfall. This, Nash felt, was the right place for it. However, the wooden boulder’s journey had only just begun and in March 1979 it was washed into the pool beneath the waterfall. Nash then decided to give it a helping hand, pushing it over the next waterfall to another pool, where it rested eight years, taking on the appearance of a real boulder. What had originally been intended as the source of a sculpture had become a work of environmental art. The boulder remained in the stream whilst the landscape changed around it, but it continued to move intermittently when the river swelled. By 1994, Wooden Boulder was resting below the road bridge just before the stream meets the river Dwyryd. David Nash has described the subsequent course of the boulder (see the Annely Juda Fine Art site): “I did not expect it to move into the Dwyryd river in my lifetime. Then in November 2002 it was gone. The ‘goneness’ was palpable. The storm propelled the boulder 5 kilometres, stopping on a sandbank in the Dwyryd estuary. Now tidal, it became very mobile…. The wooden boulder was last seen in June 2003 on a sandbank near Ynys Giftan. All creeks and marshes have been searched so it can only be assumed it has made its way to the sea. It is not lost. It is wherever it is.” Posted by Plinius at 1:37 pm 7 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: David Nash, rivers Saturday, March 25, 2006 Dry and verdant branches In the July 2005 edition of Apollo Magazine, Clovis Whitfield describes the Arcadian landscapes of Francesco Cozza (1605-82). Whitfield is an expert on this period and a dealer in Old Masters (Whitfield Fine Art). The article reflects the connoisseurial importance of identifying Cozza’s landscapes and distinguishing them from more famous contemporaries and influences such as Claude, Poussin, Gaspar Dughet and Domenichino. For example, in discussing two paintings in the style of Claude, Whitfield says that “it is the figures in particular that suggest Cozza’s authorship, but the definition of the trees and foliage also reveals his handwriting.” From a landscape perspective it is perhaps these small differences in the natural elements that are most interesting. It is tempting to imagine that even fairly derivative work can hide a distinctive view of nature, even though Cozza’s trees and foliage are more likely simply to reflect his method of applying paint in the pursuit of idealised landscapes.Here is a description of the way Cozza paints nature, in Clovis Whitfield’s discussion of a painting in the Rijksmuseum: “the dry and verdant branches of the trees, crossed trunks and sprouting mullein-like foliage on a dry and stony ground in the Amsterdam Hagar and Ishmael are a distinctive language. The trunks of the trees criss-cross the canvas in a way that recalls Poussin in his so-called ‘Silver Birch’ phase, with a dappled light catching the uneven bark. The branches seem to be laid out flat, like fern fronds, while it is the colouring that gives the foliage variety of appearance and depth.” Cozza’s landscape sounds caught between art and nature, both lifeless and alive, like those “dry and verdant branches”, or the “sprouting foliage on a dry and stony ground”. Francesco Cozza, Hagar and Ishmael in the Wilderness, 1665 Source: Wikimedia Commons Posted by Plinius at 11:39 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Tuesday, March 21, 2006 Singing sands Landscapes can be more or less musical. Desert sands have been known to sing and beaches that are silent when wet, can sound underfoot like Japanese koto music. David Toop mentions these phenomena in his book Ocean of Sound (1995). He refers to the researches of Shigeo Miwa into the gradual disappearance of singing sands across the world. A sample from Pensacola Beach in Florida was restored to voice by being boiled in water for 40 minutes to remove the pollutants. The sample is now in the Nima Sand Museum in Japan. Since David Toop’s book there has been further research into the phenomenon of singing sounds. New Scientist reported last year that ‘Stéphane Douady of the French national research agency CNRS and his colleagues shipped sand from Moroccan singing dunes back to his lab to investigate. They found that they could play notes by pushing the sand by hand, or with a metal handle.’ You can hear impressive sounds of sands recorded by Doady at his website. Singing sands are now being utilised by composers like Pippa Murphy (‘Voix du Sable’). The most famous British site for singing sands is on the Isle of Eigg. My only experience of a sand soundscape was Squeaky Beach, Wilson’s Promontory, Australia: the photograph below was taken there in 1996. Posted by Plinius at 9:28 pm 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: shores, soundscapes Location: Wilson's Promontory Sunday, March 19, 2006 Deer in snow Ronald Hepburn’s essay ‘Trivial and Serious in the Aesthetic Appreciation of Nature’, argues that whilst it is ‘trivial’ to engage in an unreflective superficial reading of a landscape, it is just as trivial to resort to an ‘ironical, anti-Romantic, belittling, levelling reaction’ to the idea that landscapes can be beautiful. There is a balance to be struck. Nature needs to be respected and seen on its own terms, but this does not mean that only a detailed or objective ‘scientific’ reaction is acceptable. It is valid to appreciate natural landscapes in terms of metaphor, as long as we do not simply fall back on dead metaphors. Aesthetic appreciation of a landscape will involve the viewer in shaping the disparate elements into a unified whole, but serious appreciation means at the same time not losing site of the arbitrariness and otherness of nature.In another essay reprinted in The Reach of the Aesthetic (2001), ‘Data and Theory in Aesthetics’ Hepburn continues this theme. He uses the example of a view of deer moving across a hillside in the snow. Here it is not essential to keep in mind the facts of ‘forestry as commerce or animals as food’ but, it is necessary to attend to the reality of this natural event rather than automatically experience it selectively according to pre-existing aesthetic criteria. Must an awareness of environmental concerns colour our appreciation of nature? “Certainly our cherishing of aesthetic experience must not be allowed to displace practical efforts to reduce environmental threats and dangers. But neither do these dangers have to dominate all our approaches to nature. There is room – and great need – for both.”Hepburn also disagrees with Stan Godlovitch, who has argued for an aesthetic appreciation that recognises the categorical otherness of nature, implying a sense of being outside oneself. For Hepburn we do belong in nature and therefore the partial understanding we possess, conditioned by our culture, is a legitimate starting point for aesthetic appreciation. This appreciation should be is a synthesis that simultaneously encompasses nature’s mutability and stability, the landscape’s present appearance infused with a sense of its past. Posted by Plinius at 3:32 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: snow Saturday, March 18, 2006 Somerset Place, Bath There is a good essay by Julian Stallabrass, originally published in New Left Review, available on-line at the Courtauld Institute site, ‘Success and Failure of Peter Fuller’. Stallabrass says “for most of his career Fuller was beyond the pale of the art establishment; initially for his materialism, then for the accessibility of his writing, which at points threatened to puncture art's divine, money-spinning mystery, and later for his conservative debunking of the avant-garde. There was however a period in the mid to late eighties when it seemed as though Fuller might actually succeed in his task of turning the tide in favour of a conservative, specifically English art.” Fuller promoted painters of the School of London and an interest in neo-Romantics like John Piper. Piper was interviewed in the second edition of Fuller’s magazine Modern Painters (Summer 1988). Fuller starts the article with a discussion of the post-war fate of Bath, whose ruins were bombed and painted by Piper, e.g. in Somerset Place, Bath (1942). He sees the possible re-birth of art after Modernism paralleled in the gradual healing of Bath after the horrors visited upon it by insensitive sixties architects. Fuller views Piper as a progressive force and argues that Piper’s work had actually been at its weakest when it tried to accommodate modernism and the influence of contemporary artists like Richard Hamilton (a friend of Piper’s). It is interesting now to look back at the sort of artists Fuller praised. Later in the same issue of Modern Painters, Fuller reviews and defends the work of two landscape painters, Paul Hempton, who is “not nostalgic”, and Michael Williams, who is “not ashamed” to be a water-colourist. Fuller writes that the current (1988) “remarkable revival” of landscape painting may eventually be recognised as “one of the most significant developments in British art of the current decade”. I think it’s safe to say that this recognition hasn’t happened yet… Posted by Plinius at 7:57 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: John Piper Friday, March 17, 2006 Corsons Inlet A. R. Ammons’ ‘Corsons Inlet’ is one of the best known twentieth century landscape poems and has generated much discussion about poetic form since its publication in 1965. The poem evokes the movement of a walk in its shapes and rhythms. Here, for example, are the opening lines I went for a walk over the dunes again this morning to the sea, then turned right along the surf rounded a naked headland and returned along the inlet shore: There are a series of critical reflections on the poem in the useful Modern American Poetry site. Five examples: Richard Grey (in American Poetry of the Twentieth Century) discusses the form of the poem as a field rather than a closed object, “There are, Ammons suggests, 'no / ... changeless shapes': the poe"
