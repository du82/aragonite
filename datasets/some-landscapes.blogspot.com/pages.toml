full_description = '''some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Sunday, July 30, 2006 A View of the Boulevards of Paris The early photographers framed landscape views but ended up provided images that highlight the small un-regarded details of nature and modern life. For example, in ‘The Apse of Notre-Dame, 8 December 1852’, one of the photographs in Album photographique de l’artiste et de l’amateur (produced by the firm of Blanquart Évrard in 1852), the eye is drawn not to the cathedral but to the row of delivery carts in the foreground. As Ian Jeffrey points out in his book Photography, ‘the anonymous photographer intent on Notre-Dame has ended up with evidence of routine commercial life in the city’. Looking at this image, my eye glances over the familiar shape of the cathedral and I am moved instead by the punctum created by those carts, a particular transitory detail of life in nineteenth century Paris. William Fox Talbot, A View of the Boulevards at Paris, 1844 Even at the time, William Henry Fox Talbot was fascinated by this chance aspect of photography, describing such mundane details in his book The Pencil of Nature (1844). For example, in presenting ‘A View of the Boulevards at Paris’ to the reader he describes the pattern of water on the road surface and the proliferation of chimneys: ‘The weather is hot and dusty, and they have just been watering the road, which has produced two broad bands of shade upon it, which unite in the foreground because, the road, being partially under repair (as is seen from the two wheelbarrows, etc. etc.), the watering machines have been compelled to cross to the other side. By the roadside a row of cittadines and cabriolets are waiting, and single carriage stands at a distance a long way to the right. A whole forest of chimneys borders the horizon: for, the instrument chronicles whatever it sees, and certainly would delineate a chimney-pot or a chimney-sweeper with the same impartiality as it would the Apollo Belvedere.’ Posted by Plinius at 8:02 am 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: cities, viewing points Location: Paris Saturday, July 29, 2006 The drifting white downy clouds There are a growing number of blogs based on the journals of old, out of copyright authors. From a landscape perspective, the Henry David Thoreau blog is of obvious interest and in fact I would go further and highly recommend it. As you would expect, the entries are poetic and insightful, and they range from specific observations of plants and animals to general reflections, like this extract from the entry for 24 June 1852: The drifting white downy clouds are to the landsman what sails on the sea are to him that dwells by the shore,—objects of a large, diffusive interest. When the laborer lies on the grass or in the shade for rest, they do not much tax or weary his attention. They are unobtrusive. I have not heard that white clouds, like white houses, made any one’s eyes ache. They are the flitting sails in that ocean whose bound no man has visited. They are like all great themes, always at hand to be considered, or they float over us unregarded. Far away they float in the serene sky, the most inoffensive of objects, or, near and low, they smite us with their lightnings and deafen us with their thunder. We know no Ternate nor Tidore grand enough whither we can imagine them bound. There are many mare’s-tails to-day, if that is the name. What would a man learn by watching the clouds? The objects which go over our heads unobserved are vast and indefinite. Even those clouds which have the most distinct and interesting outlines are commonly below the zenith, somewhat low in the heavens, and seen on one side. They are among the most glorious objects in nature. A sky without clouds is a meadow without flowers, a sea without sails On reading this passage today, we are perhaps less likely to think about the clouds, which drift on as they ever did, than of the disappearance of white sails from the coastal landscape. Posted by Plinius at 1:57 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: clouds, Henry David Thoreau, seas Monday, July 24, 2006 The Mountain Where Hui-pao Meditated Wang An-shih Speculation on the future role of Tony Blair has not so far considered the option of his retiring from public life to compose exquisite four-line landscape poems. This was the course followed by Wang An-shih (1021-1086), who resigned from the role of Chinese prime minister in 1074. Wang An-shih had devised an extensive social reform programme which formed the basis of the New Laws (Hsin-fa) instituted by Emperor Shen-tsung in 1069. However, opposed by both conservatives and pragmatists, he eventually lost the support of the emperor. Leaving office disappointed, he retired to the countryside near Chiang-ning on the south shore of the Yangtze, devoting himself to Ch’an Buddhism and writing short poems, many of them in the rivers-and-mountains genre. Interestingly there is a description written by the young Wang-An-shih in 1054, of an expedition to a cave at the Mountain Where Hui-pao Meditated (Hui-pao was a seventh century Buddhist monk), which seems to prefigure symbolically his thwarted future plans as prime minister. On entering the cave, ‘the deeper we advanced, the more difficult our progress, but the more fantastic the sights’. Unfortunately, ‘one person grew tired’ so the party decided to go back. Reflecting on this later, Wang An-shih writes that ‘the most unique magnificent, fabulous, strange, and extraordinary scenery in the world is usually found in these dangerous and distant places that people rarely reach. Therefore only those with ambition can reach them… However, he who exhausts his ambition, even if he cannot go further, can still be without regrets. Who could ridicule him then? This is the insight I obtained from this journey.’ (Richard E. Strassberg’s translation in his anthology Incribed Landscapes: Travel Writing from Imperial China). Posted by Plinius at 9:21 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: caves, mountains Location: Jiangsu, China Saturday, July 22, 2006 Surfacing on the Thames The Canadian experimental filmmaker and photographer David Rimmer made his name with works relating to the contemplation of landscape, most obviously Landscape (1969), which compressed compresses 15 hours of footage into eight minutes of sea, mountains, and sky, but also Surfacing on the Thames (1970), Seashore (1971), Canadian Pacific (1974) and others. Surfacing on the Thames has been described by Donald Richie as ‘a beautiful, mysterious yet satisfying optical illusion…celebrates the early passing of a steam on the Thames. Using freeze-frame techniques, elaborate dissolves, and most of the resources on the optical table, this picture is, amongst other things, a Turner come to life. Rimmer’s concern with the surface nature of the film is most evident in this work which, in spite of its filmic complexity, is incredibly simple.’ In his essay ‘David Rimmer: A Critical Analysis’, Al Razutis writes that ‘Surfacing presented the viewer with a completely unique view of what a cine-landscape could be.’ Happily, Surfacing the Thames (1970) can be downloaded from Ubuweb... but sadly the AVI file doesn’t seem to work on my PC (no picture), so I would be interested to know if anyone else can view it. Postscript: the film is now available on Vimeo: Surfacing on the Thames (1970) by David Rimmer by Ubuweb by Mark Toscano (2015) Posted by Plinius at 3:39 pm 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: rivers Location: The Thames Friday, July 21, 2006 Before Storm The approach taken in paintings like Ying Yu-Chien’s ‘A Mountain Village in Clearing Mist’ has sometimes been compared to the method proposed by Alexander Cozens in A New Method of Assisting the Invention in Drawing Original Compositions of Landscape (1785). Cozens showed how, for example, an almost random collection of marks could be converted into a mountain landscape composition. There is no need to posit a connection between Cozens and Chinese art (Cozens did grow up in Russia, where his father worked for Peter the Great, but eighteenth century Russia was hardly Song dynasty China). The idea that random blots might resemble landscapes had, after all, already occurred to Leonardo da Vinci, who wrote ‘you should look at certain walls stained with damp, or at stones of uneven colour. If you have to invent some backgrounds you will be able to see in these the likeness of divine landscapes, adorned with mountains, ruins, rocks, woods, great plains, hills and valleys in great variety…’ (quoted from Ernst Gombrich’s Art and Illusion). Alexander Cozens. Plate 2, 'Blot' Landscapes for A New Method of Assisting the Invention in Drawing Original Compositions of Landscape, 1785 In a 1997 article in ‘Art Bulletin’ (which can be found on-line) Charles A. Cramer notes how the temptation to view the blots as proto-Romantic or proto-Expressionist makes it hard to locate Cozens in the world he actually inhabited, the world of Reynolds and the Royal Academy. However, Cramer argues that the main aims of Cozens’ technique are rooted in eighteenth century classical landscape ideas. Rather than naturalistic description or artistic expression, the painter uses the blots to suggest new ways of designing landscapes that convey the general principles of nature. The blot is only the starting point and requires "embellishment and consolidation". Far from being a window to the unconscious, the blots were, for Cozens, a means of training the eye to see the general rather than the particular. This can be seen in some of Cozens’ paintings, like Tate’s Before Storm (c1770-80), which does not show any particular landscape. And yet, it has to be said, a painting like this is still very easy to see as an early work of Romanticism. Posted by Plinius at 10:04 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: storms Wednesday, July 19, 2006 A Mountain Village in Clearing Mist One of the most mysterious images reproduced in Michael Sullivan’s book Symbols of Eternity: The Art of Landscape Painting in China is one of the thirteenth century monk Ying Yu-chien’s eight views of Hsiao and Hsiang (subject matter discussed in this earlier posting). Sullivan calls the particular view ‘Returning Fishermen’, although as far as I can see a more common title is ‘A Mountain Village in Clearing Mist’. Yu-Chien created the effect of a landscape dissolving in the haze by ‘smearing and splashing ink onto the paper in a state of high excitement and then, like the late T’ang eccentrics, adding a few deft touches with the brush that not only transformed his gestures into a picture of countrymen coming home to their village at dusk but also created a marvellous pictorial analogy to the Zen experience in which form is manifest out of the formless, unifying Void.’ The ‘late T’ang eccentrics’ were earlier painters whose approach Sullivan likens to that of the New York Action Painters. Although none of these T’ang eccentrics’ work survives, there are accounts of them dipping their hair in ink, painting while dancing to music, or using the brush whilst facing away from their work. ‘A T’ang text tells of Ink Wang, who would get drunk and then, laughing and singing, spatter ink onto the silk and stamp it with his feet and smear it with his hands.’ Having created these abstract patterns, the T’ang painters would take a few strokes of ink to turn them into landscapes. Incidentally, similar stories are told about the finishing touches added by Turner at the Royal Academies varnishing days prior to their exhibitions. There is some discussion of Yu-Chien’s ‘A Mountain Village in Clearing Mist’ in the context of Zen (Ch’an) Buddhism on-line in Aspen magazine. Posted by Plinius at 10:05 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: mists Location: Hsiao (Xiao) River Sunday, July 16, 2006 Studies by the Sea One of the pleasures of reading Charlotte Smith’s landscape poetry comes in consulting her endnotes, which give the Latin names of the flora and fauna she mentions and convey a sense of her intellectual engagement with nature. Here for example are two stanzas from the posthumously published poem ‘Studies by the Sea’ (1807) – these lines follow a description of the hushed beauty of a calm sea at sunset. ‘Forgotten then, the thundering break Of waves, that in the tempest rise, The falling cliff, the shatter'd wreck, The howling blast, the sufferer's cries; For soft the breeze of evening sighs, And murmuring seems in Fancy's ear (1) To whisper fairy lullabies, That tributary waters bear From precipices, dark with piny woods, And inland rocks, and heathy solitudes. The vast encircling seas within, What endless swarms of creatures hide , Of burnish'd scale, and spiny fin ! These providential instincts guide, And bid them know the annual tide, When, from unfathom'd waves that swell, (2) Beyond Fuego's stormy side, They come, to cheer the tribes that dwell In Boreal climes; and thro' his half year's night Give to the Lapland savage, food and light.’ And here are the two endnotes, which almost give a sense of someone straining against her own poetic diction to convey a clear picture of nature: ‘(1) Whoever has listened on a still summer or autumnal evening, to the murmurs of the small waves, just breaking on the shingles, and remarked the low sounds reechoed by the distant rocks, will understand this. (2) The course of those wonderful swarms of fishes that take their annual journey is, I believe, less understood than the emigration of birds. I suppose them, without having any particular ground for my conjecture, to begin their voyage from beyond the extreme point of the southern continent of America. Many of the northern nations live almost entirely on fish. Their light, during the long night of an arctic winter, is supplied by the oil of marine animals.’ There are of course many other examples that could be cited, as can be seen from the e-text of her collection Beachy Head: With Other Poems, which includes ‘Studies by the Sea’. Posted by Plinius at 10:21 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: seas Thursday, July 13, 2006 A painstaking description of the Grampian Hills In Three Men on the Bummel (1900), the sequel to Three Men in a Boat (1889), Jerome K. Jerome avoids describing the landscape of Germany through which his three men cycle because ‘Nothing is easier to write than scenery; nothing more difficult and unnecessary to read. When Gibbon had to trust to travellers’ tales for a description of the Hellespont, and the Rhine was c'''
