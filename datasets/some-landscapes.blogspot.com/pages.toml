full_description = "some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Monday, February 27, 2006 The Waterfall on Lu Mountain In his poem ‘The Waterfall on Lu Mountain’, Li Po (Li Bai) likened the sight of the ceaseless flow of water to stars falling from the sky. In Arthur Cooper’s 1971 translation it reads: “At first I feared Milky Way had dropped / And sprinkled stars, falling through the clouds!’ Cooper noted that the Chinese words that he renders as ‘sprinkled’ and ‘falling’, ‘sa’ and ‘lo’, are the first syllables of a word that some have suggested as the original for the mysterious term sharawadgy, used by Sir William Temple in his Gardens of Epicurus (1685) to refer to a quality of naturalness. This is what Temple wrote of Chinese gardeners: “But their greatest reach of imagination is employed in contriving figures, where the beauty shall be great, and strike the eye, but without any order or disposition of parts that shall be commonly or easily observed: and, though we have hardly any notion of this sort of beauty, yet they have a particular word to express it, and, where they find it hit their eye at first sight, they say the sharawadgi is fine or is admirable, or any such expression of esteem.” According to Arthur Cooper, the sa-lo in Li Po’s poem relates to the notion of Heraclitus: ‘the ever changing yet never-changing waterfall as the symbol of nature; a reason for the special importance of waterfalls in Chinese paintings.’ Whilst these speculations may not pass academic scrutiny, I think they offer a stimulating chain of connections and associations: Li Po – Temple – Heraclitus… Incidentally, the Poetry Library archive has an old review of the Arthur Cooper translations which is not very complimentary. But I would still recommend the book for the pleasure of the notes and introduction. Illustration: Li Bai watching a Waterfall by Okutani Shūseki (1871-1936) Source: Wikimedia Commons Posted by Plinius at 9:27 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Li Po, waterfalls Location: Lushan, China Saturday, February 25, 2006 Parking lot Ed Ruscha’s Thirty-Four Parking Lots (1967) used aerial photography to turn banal, functional urban landscapes into abstract designs. Looking at these images it is easy to forget the reality of Los Angeles, city of cars, and perceive the parking lots as earthworks designed for aesthetic purposes. There are currently examples on-line here, here, here and here. Yves Alain Bois discussed one of these photographs in the book he wrote with Rosalind Krauss, Formless. He notes that after Ruscha captured these parking lots one early morning before the cars arrived, it was possible to see them as “a machine for the production of oil-spots”. The spots appear to be part of the design, a dynamic feature which grow and then are erased when the lots are asphalted over again. They convey some of the entropic quality of urban space that fascinated artists in the sixties and seventies. Posted by Plinius at 8:25 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: aerial landscapes, Ed Ruscha Location: Los Angeles Friday, February 24, 2006 The green hills of Casentino In Dante’s Inferno the landscape of Hell is carefully described and is sometimes instrumental in the punishment of souls. Examples include the Wrathful, mired beneath the swamp-like river Styx, Userers squatting on fiery sand, and Grafters sunk within a ditch of burning pitch. In the Wood of Suicides, the dead are actually part of the landscape: Dante breaks off a branch and the tree starts to bleed (the tree is the soul of Pier Delle Vigne, chief counsellor of Frederick II of Sicily). But there is a different kind of landscape torture in Canto XXX. Here, the poet encounters Master Adam, a counterfeiter, who explains that he is permanently thirsty and that his punishment comes from the memory of “the little brooks which down from the green hills of Casentino splash towads the Arno”, an unattainable landscape that hangs continually before him. Posted by Plinius at 11:34 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Location: Casentino, Italy Wednesday, February 22, 2006 The Valley of the Princes In Dante’s Purgatory (Canto VII), the shade of Sordello leads his fellow poets Dante and Virgil to the Valley of the Princes. This is the description of what they see there, taken from the 1815 Henry Cary translation that is freely available on Project Gutenberg: Betwixt the steep and plain a crooked path Led us traverse into the ridge's side, Where more than half the sloping edge expires. Refulgent gold, and silver thrice refin'd, And scarlet grain and ceruse, Indian wood Of lucid dye serene, fresh emeralds But newly broken, by the herbs and flowers Plac'd in that fair recess, in color all Had been surpass'd, as great surpasses less. Nor nature only there lavish'd her hues, But of the sweetness of a thousand smells A rare and undistinguish'd fragrance made. According to Mark Musa, Dante creates a locus amoenus here that is unique in classical and medieval literature. Such a place would normally be described to the reader in terms of its natural features and living creatures, but here the valley is likened to precious stones, metals, dyes and pigments. As Musa says, “thanks to the list of metaphors, we are offered artificial opulent beauty, not the pure beauty of nature” (see notes to Musa’s translation). It is a fitting place for the souls of Negligent Rulers and contrasts strongly with the Garden of Eden which Dante reaches at the top of Mount Purgatory. Musa notes that John Ruskin thought the description of Eden in Canto XXVIII “the sweetest passage of wood description which exists in literature”. Musa’s translation is indeed striking and makes it easy to understand why Ruskin thought this (the Cary version with its ornate English is less easy to appreciate, although the atmosphere is well conveyed by Gustave Doré’s 1867 illustration). For more about Ruskin’s reflections on Purgatory in his book Modern Painters see the Victorian Web. Posted by Plinius at 7:30 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: John Ruskin, locus amoenus Monday, February 20, 2006 The Stiperstones The legendary origin of Shropshire’s Stiperstones is related in Frederick Grice’s collection, Folk Tales of the West Midlands. This range of hills was once used as a resting place for the Devil in his travels between England and Ireland. One day he decided to fill in the valley that lay between the Stiperstones and the Long Mynd. He made himself a special apron from the hides of slaughtered cattle and carried in it a load of rocks from Ireland. However, the apron frayed in the heat and the Devil dropped them all over the hillside. Another landscape myth from Sussex on the origin of Devil’s Dyke is retold on the South Downs Way site: “The story goes that the Devil was angry at the conversion of the Sussex people to Christianity, and resolved to cut through the Downs to the sea to let in the salt water and drown them all. As he dug away by night, an old woman saw what he was up to. She lit a candle and woke her rooster, so that the light and the crowing made him think daybreak was coming. The Devil fled, leaving the Dyke unfinished, and so it remains today.” Clearly landforms attached to ‘the Devil’ are likely to correspond to those strange rock forms, desolate mountains, deep ravines and so on that people regarded as abhorrent before cultural values changed during the eighteenth century. It would be interesting to consider any specific aspects that are more prevalent than others – perhaps the Stiperstones is an example of a type in which the landform looks as if something destructive has happened. However the naming of landforms after the Devil has not always simply reflected a fusion of folklore and geomorphology. Use of the Devil’s name by European settlers in parts of North America reflected anxiety about the unknown dangers of a new world, including fears about the original inhabitants they were displacing. Posted by Plinius at 8:49 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: stones Sunday, February 19, 2006 Black Mountain Main Building of the former Black Mountain College Source: Wikimedia Commons At the Kettle’s Yard exhibition ‘Starting at Zero: Black Mountain College 1933-57’ yesterday I was struck by how little the landscape of Black Mountain seemed to impinge on the art works created there. Brochures for the college highlight its location: see for example some of the photographs on display at the North Carolina state archives. Outdoor pursuits were part of college life: hiking trips after morning classes, physical activity in farming and architectural projects. However, the only quotation in the exhibition that directly addressed the positive impact of the landscape was from Julia and Lyonel Feininger: “the location of the college was in itself important to us: pretty high up in the mountains, on the shores of a small lake in a wide valley… The mornings especially were fraught with magic. Vapors steaming from the lake, mists enveloping the world around, and when slowly rising revealing the contours of trees and the mountains, the very element of light appearing as something mysterious and new’ (quoted in the catalogue, from Design, 1946 vol. 7 no 48). The absence of landscape art partly reflects the interests of those associated with the college – Josef Albers, Charles Olson, Merce Cunningham, Buckminster Fuller, Willem de Kooning etc. – who were developing different modes of abstraction, expressionism, and interdisciplinary experimentation. The rural location of the college seemed to serve more as a sanctuary and a space for developing ideas with like minded faculty and students. Robert Motherwell, for example, enjoyed teaching the summer schools as “a way of getting a break from New York” but also felt that the college was partly doomed because of its location so far from the centres of avant garde practice, in a place (and time) that viewed the activities at Black Mountain with deep suspicion (see the Smithsonian Archive interview with Motherwell). Posted by Plinius at 11:30 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: mountains Location: Black Mountain Friday, February 17, 2006 By a pine-shaded stream The first of Wallace Stevens’ ‘Six Significant Landscapes’ depicts an old man in China, sensing the wind blowing a pine tree, blue and white larkspur and his own beard, their movement like water running over weeds. According to Zhaoming Qian, Stevens’ poem is reminiscent of landscape painting from the Ma-Xia school, named after Ma Yuan (active ca. 1189-1225) and Xia Gui (active ca. 1180-1224). For example, Ma Yuan’s Watching the Deer by a Pine-shaded Stream has a scholar gazing at a landscape in which pine trees wave and water streams over rocks. Stevens may not have had a specific painting in mind, but he was certainly influenced by Chinese painting he had read about and seen in exhibitions. In 1909 Stevens had been captivated by the Chinese paintings he saw in New York and wrote to his fiancée Elsie about them, compiling a “private exhibition” from their colours: pale orange, green and crimson, and white, and gold, and brown; deep lapis-lazuli and orange, and opaque green, fawn-color, black, and gold; lapis blue and vermilion, white, and gold and green. In Stevens’ exhibition Chinese handscrolls have been distilled into abstract landscapes of pure colour. This is an approach that would be taken by many Western painters later in the century. Posted by Plinius at 12:02 pm 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Ma Yuan Location: New York Monday, February 13, 2006 Rocks at Ploumenac’h, Brittany Surrealist painter Eileen Agar visited Brittany in 1936 with her husband. Inspired by the rock formations and the example of her friend Paul Nash, who had photographed the stones at Avebury and Stonehenge, Agar bought a Rolleiflex and began taking tightly framed images of the rocks. According to Tacita Dean, these photographs “deny the landscape” but trap the rocks’ “creatural intensity” (see the catalogue to Dean’s exhibition An Aside). Whilst it is possible to see the Rocks at Ploumenac’h, Brittany as beautiful abstract shapes, it is equally open to follow the Surrealists in re-imagining the landscape by thinking up identities or associations for these strange stones. So when is it OK to anthropomorphise the landscape? Perhaps when the artist doesn’t do it explicitly, but the work invites this kind of response from the viewer. There is an informative ‘Tate Papers’ essay on the photographs by Ian Walker, ‘The 'Comic Sublime': Eileen Agar at Ploumanac'h’. Walker draws parallels between these natural rock forms and both the sculptures of Henry Moore and the Surrealist landscape art of Graham Sutherland. However, he also notes a possible influence from the continental artists who had exhibited with Agar in the International Surrealist Exhibition in London that year: Yves Tanguy, who had spent childhood summers in Brittany, and Salvador Dali, who was inspired by the coastal scenery of Cadaqués. Agar’s photographs may in turn have inspired artists she showed them to, including Paul Nash himself, e.g. in his photograph Monster Field. Finally, in 1985 Agar herself used the images as source material for a series of paintings called Objects from a Landscape. Paul Nash Monster Field, 1938 Source: Tate Gallery - public domain (image added 2017) Posted by Plinius at 8:04 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Paul Nash, stones, Tacita Dean Location: Ploumanac'h Sunday, February 12, 2006 Piute Creek In ‘Ripples on the Surface’, the last poem of Gary Snyder’s No Nature (a selection of his poetry up to 1992) he says that “Nature is not a book, but a performance, a high old culture” of “ever-fresh events”. Snyder has always thought about the relationship between books and landscape. In the very first poem of No Nature, ‘Mid-August at Sourdough Mountain Lookout’, the young poet had written of being immersed in nature, miles above the cities, able to say “I cannot remember things I once read.” Two other poems in his first published collection Riprap talk about books. In ‘Milton by Firelight’ (written at Piute Creek in August 1955) he rejects Paradise Lost, a “silly story”: once the fire is down, it is too dark to read, but he can still hear the sound of a bell-mare, reminding him of a day’s work in the summer heat. And in ‘Piute Creek’, looking up at the “sky over endless mountains” the poet finds “words and books / Like a small creek over a ledge / "
