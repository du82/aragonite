description = "Landscape in art, music, literature, film and other art forms."
full_description = '''some LANDSCAPES Landscape in the arts Chronology Map of recent post locations Earlier locations map 1 Earlier locations map 2 Earlier locations map 3 Earlier locations map 4 Saturday, December 31, 2005 Water and windmills Richard Holmes’ anthology of Samuel Taylor Coleridge poems is notable for its inspired thematic arrangement and the inclusion of some of Coleridge’s more obscure but intriguing verse and fragments. These lines were written in 1828 when Coleridge, reconciled with Wordsworth, toured through Germany and Holland with him: Water and windmills, greenness, Islets green; -Willows whose Trunks beside the shadows stoodOf their own higher half, and willowy swamp: -Farmhouses that at anchor seem’d – in the inland skyThe fog-transfixing Spires – The MS. contains two more lines, which appear to be the false start of a second stanza, “Water, wide water, greeness and green banks…” Holmes thinks “this fragment of Dutch landscape is an almost perfect imagist poem”. This is interesting given the Imagists’ dislike of Romantic poetry; it is true that Coleridge’s poem achieves a direct treatment of the Dutch landscape and has none of the “magnificent and sonorous” generalisations that Imagism rejected. The Imagists were interested in the idea of fragments (as in Sappho for example) and here it feels as if the poem's incompleteness preserves Coleridge’s experience of the landscape intact, giving it a similar modern appeal to that of the vivid oil sketches made by contemporaries like Pierre-Henri de Valenciennes and Thomas Jones. Posted by Plinius at 10:25 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Richard Holmes, Samuel Taylor Coleridge, windmills Thursday, December 29, 2005 Meadowland Here is one of Gerhard Richter’s ‘romantic’ landscape paintings, Meadowland (1985). Source: Mark Harden Do such images offer the viewer any consolation in the beauty of nature? Richter acknowledges the influence of Caspar David Friedrich, as Michele Light says in an on-line article about Richter: ‘The contrast between Friedrich's brittle, sharply focused views and Richter's diffused portrayals of landscape, (without a stand-in for the viewer), are nevertheless linked by Richter's need to express his right to paint as he wishes, like Fredrich if necessary, and to prepare to re-interpret the type of landscape painting which he has revived. Richter plainly states opinions which ring with Romantic sentiments: "I believe that art has a kind of rightness, as in music, when we hear whether or not a note is false. And that's why classical pictures, which are right in their own terms, are so necessary for me. In addition to that there's nature which also has this 'rightness.'" Characteristically, Richter also stresses an awareness of the "wrongness" of nature (unlike the great Romantics whose focus was harmony) of nature, with its utter disregard for human needs, wants and fears. Bucolic "Barn," (1984, Collection Massimo Martino Fine Arts and Projects, Mendrisioo, Switzerland) and "Meadowland," (1985, The Museum of Modern Art, New York), are beautiful, but they shut the viewer or the admirer of nature out. The longing to merge harmoniously with Richter's scenes will never be fulfilled; they are not intended as "retreats" into the sublime, or escapes. His paintings make it clear that these nirvanas exist only in the "longing" mind of the viewer: "My landscapes are not only beautiful, or nostalgic, with a Romantic or classical suggestion of lost Paradises, but above all 'untruthful.' By 'untruthful,' I mean the glorifying way we look at Nature. Nature, which in all its forms is always against us, because it knows no meaning, no pity, no sympathy, because it knows nothing and is absolutely mindless, the total antithesis of ourselves." Richter also notes matter-of-factly that his landscapes lack the spiritual basis that underpinned Romantic painting but they offer solace to those who still yearn for the comfort of nature, even those who do not believe in an omnipresent God.’ Despite that last statement it seems clear that there is little comfort to be had in these highly artificial paintings, based on photographs or picture postcards. In a journal entry (18/2/86) (which the article extract above draws upon) Richter explained that our ‘untruthful’ (verlogen) projection of beauty onto a landscape can always be switched off, so that we become aware of the terrible unfeeling reality underneath. Posted by Plinius at 7:23 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Caspar David Friedrich, Gerhard Richter, postcards Wednesday, December 28, 2005 Sycharth Castle Source: Wikimedia Commons One of the simplest manifestations of landscape and power is the description of a landscape as property. An interesting early example is the description of Owain Glyn Dwr's castle at Sycharth by his court poet Iolo Goch (1320-98), encompassing not only the building but the surrounding landscape. This landscape includes a rabbit warren, deer park, meadows and hayfields, a mill on a "smooth-flowing stream" and a fish pond abounding in "pike and splendid whiting" (see O.H.Creighton's Castles and Landscapes). These features were not only useful, they had aesthetic appeal and symbolised the Prince's authority. The orderly landscape may be an expression of the gentry poet Iolo Goch's conservative outlook (as noted in in this Welsh literature site). Although some of the poet's description may be idealised, there is some archaeological evidence of the mill and the fishponds (a relevant BBC news report is here). Posted by Plinius at 5:07 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: castles Location: Sycharth castle Monday, December 26, 2005 Bodiam castle O. H. Creighton's Castles and Landscapes notes that the study of medieval ornamental landscapes is "still in its infancy", with numerous difficulties in interpreting sites that have been altered extensively over time. However, progress has been made at several locations, for example in understanding the extent to which the grounds of Bodiam castle in Sussex (illustrated with my photographs here) could have been designed for aesthetic effect. The castle is at the centre of a series of small lakes which give the approaching visitor a sequence of imposing views. It may be that the 'Gun Garden' on a 300m high ridge was used as a viewpoint. The castle, licensed in 1385, was later abandoned as a principle residence and thus has retained its general layout. It is now sometimes seen as the ideal of a picturesque castle. The evidence at Bodiam and at the castles of Kenilworth (with extensive waterworks), Hereford (with a detached water garden) and Ravensworth (with diverse evidence of landscaping) suggest a medieval attitude to landscape that is more often associated with the eighteenth century aristocracy. Creighton concludes by posing three questions for future research. First, how far back in time were castles associated with landscapes designed for pleasure? Second, to what extent would aesthetic considerations have helped determine the siting of a castle? And finally, how widespread was the phenomenon? Posted by Plinius at 10:06 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: castles, gardens Saturday, December 24, 2005 Holloways One of the landscape features discussed in Oliver Rackham's book A History of the Countryside is the holloway. Holloways are sunken shady lanes, overhung with trees, "their cavernous shade the home of delicate plants like hart's tongue fern, shining cranesbill and moschatel." In Anglo Saxon charters they are recorded as hola weg (hollow path). Whilst a few holloways have been built in ravines (the grundles of East Anglia for example), most are the result of centuries of erosion. Rackham thinks a well-developed holloway requires at least 300 years' erosion - he has noted an incipient holloway in Massachussetts that has experienced only 200 years of traffic so far... Examples of holloways in England are near Flatford Mill in Essex (the site made famous by John Constable), Midhurst in Sussex and in the Lower Greensand of Urchfont in Wiltshire. There are canyon-like holloways in the loess of Kaiserstuhl in Germany. At the other extreme there are examples of foot holloways created purely from walking, like the coast path north of Cadgwith in Cornwall. Postscript, 2015 When I wrote this brief early post I was not yet sure where to draw the boundaries and thought of the blog as a kind of notebook where I might put brief entries on different landforms. Instead I have focused on landscape and the arts. Now there exist a whole cluster of writings on holloways stemming from the walk Robert Macfarlane and Roger Deakin made in July 2005. I will therefore add here Robert's description of what they found, published in Orion Magazine and adapted from The Wild Places (2008), and then a Youtube clip of the recent film inspired by Holloway (2013). 'DOWN IN THE HOLLOWAY, the bright hot surface world was forgotten. So close was the latticework of leaves and branches, and so tall the sides of the holloway, that light penetrated its depths only in thin lances. Roger and I moved slowly up the bed of the roadway, forcing a way through the undergrowth, through clumps of chest-high nettles, past big strongholds of bramble, and over hawthorns that had grown together, enmeshing across the roadbed. Occasionally we came to small clearings in the holloway, where light fell and grass grew. From thorn thickets, there was the scuttle of unseen creatures. Any noise we made thudded into the banks and was lost. A person might hide out undetected in such a place for weeks or months, I thought. Lines of spider’s silk crisscrossed the air in their scores, and light ran like drops of bright liquid down them when we moved. In the windless warm air, groups of black flies bobbed and weaved, each dancing around a fixed point, like vibrating atoms held in a matrix. I had the sense of being in the nave of a church: the joined vaulting of the trees above, the stone sides of the cutting that were cold when I laid a hand against them, the spindles of sunlight, the incantations of the flies.' o Posted by Plinius at 4:17 pm No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Robert Macfarlane, Roger Deakin Location: Chideock Wednesday, December 21, 2005 Heidelberg castle Source: Wikimedia Commons Walter Benjamin writes of Heidelberg Castle in One Way Street: “Ruins jutting into the sky can appear doubly beautiful on clear days when, in their windows or above their contours, the gaze meets passing clouds. Through the transient spectacle it opens in the sky, destruction reaffirms the eternity of these fallen stones.” One might compare the effect of the statues of the apostles, lining the façade of St Peter’s Basilica in Rome. As I remember it, the vast blue sky renders them life-like, stepping out of time, with nothing to connect them to the modern city beneath. In contrast the ruined walls of Heidelberg and the passing clouds seen by Benjamin signal the presence of time, slow and fleeting. Stone and sky: both statues and ruins are temporary transformations of stone, but the sky itself, ever-changing, represents the fullness of time. Posted by Plinius at 10:14 pm 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: castles, ruins, Walter Benjamin Location: Heidelberg Castle Sunday, December 18, 2005 Locus amoenus The Latin poet Tiberianus, who flourished about 335, composed a nature poem, ‘Amnis ibat inter arua ualle fusus frigida…” Called in English by various titles (‘A Woodland Scene’, ‘The River’) it is a classic depiction of the locus amoenus, a pleasant place. Its components are a broad river, flower-sprinkled grass, mossy caves, a shady grove, singing birds and a soft zephyr, all of which, the poet says, would delight whoever strayed there. The poem is given in Latin below. There is a translation in The Penguin Book of Latin Verse (ed. Frederick Brittain) - unfortunately out of print. I would have a go myself but sadly, despite calling myself Plinius here, I know no Latin. AMNIS ibat inter arua ualle fusus frigida, luce ridens calculorum, flore pictus herbido.caerulas superne laurus et uirecta myrtea leniter motabat aura blandiente sibilo. subter autem molle gramen flore adulto creuerat: et croco solum rubebat et lucebat liliis et nemus fragrabat omne uiolarum suspiritu. inter ista dona ueris gemmeasque gratias omnium regina odorum uel colorum Lucifer auriflora praeminebat, flamma Diones, rosa. roscidum nemus rigebat inter uda gramina: fonte crebro murmurabant hinc et inde riuuli,antra muscus et uirentes intus myrtus uinxerant, qua fluenta labibunda guttis ibant lucidis. has per umbras omnis ales plus canora quam putes cantibus uernis strepebat et susurris dulcibus; hic loquentis murmur amnis concinebat frondibus, quis melos uocalis aurae musa zephyri mouerat. sic euntem per uirecta pulcra odora et musica ales amnis aura lucus flos et umbra iuuerat. This ideal landscape is simply described: the poem has no gods, no singing shepherds, no wandering poet. Rather than provide an empty stage for us to project imaginary actions and encounters, it sketches a natural objective correlative for a sense of peacefulness and perfect happiness. As far as I know there is still little biographical information about the poet Tiberianus. The Oxford Book of Latin Verse (1912) had five verses ascribed to him. Posted by Plinius at 10:58 am 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: locus amoenus Saturday, December 17, 2005 The rising of the wind The landscapes of the enigmatic Portuguese poet Alberto Caeiro (1889-1915) are non-specific. He talks of the sun, wind and rain, of flowers and stars, the flight of birds, a pebble in a brook. Several critics have noted the Zen quality of Caeiro’s poetry, the desire to live at ease in the world without imposing ideas on nature. Many of his poems caution against the pathetic fallacy: he enjoys a stone simply for being a stone and thanks God that flowers are merely flowers. In poem 31 of his collection The Keeper of Flocks, he acknowledges that he might say that a flower “smiles” but explains that such expressions are directed at those who cannot understand nature’s real language, which is no language. Octavio Paz described him as “a man reconciled to nature”, someone free of the “ghosts and cobwebs of culture.” Caeiro wrote that his poems were natural “like the rising of the wind.” Posted by Plinius at 7:14 am No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: wind Friday, December 16, 2005 Cook's Shipyard Christopher Wood’s book In Ruins elegantly describes the various ways in which ruins have been appreciated. What could ha'''
