full_description = "Grimoire Posted Mar 1, 2025 By Natalie Somersall 2 min read Grimoire Contents Grimoire An always-changing collection of notes, links, tables, and other such goodies! 💝 Note pages Chainguard command line tools - chainctl, melange, and other public tools Container stuff - Kubernetes, Docker, Helm, and other container things Finding things - noisy ways to learn stuff - enumeration, mapping, dynamic analysis, etc. Git functions and aliases - make git easier GraphQL queries and mutations - tricky bits that I always need to find quickly Linux commands - mostly evergreen sysadmin things MacOS commands - functions and more for MacOS Miscellaneous - little bits of shell code that have no other home Nmap - scripts, commands, flags, and other things that I need often OpenSSL cheatsheet - tl;dr commands for OpenSSL 🔒 Raspberry Pi stuff - various commands and notes and more Reverse shells - a little list of reverse shells Static analysis tools - mostly things I keep forgetting about static code analysis tooling Windows things - Windows, Office, PowerShell, Active Directory, etc. Tools awk.js for testing awk commands online crontab.guru is cron scheduling for humans CyberChef , the magic multi-tool for data decoding and deobfuscation Draw.io makes flowcharts and diagrams, exportable as images or XML Excalidraw for easy and quick whiteboard-style drawings jq play for testing jq commands online JSONcrack makes JSON human friendly Markdown table generator Mermaid JS diagram live editor Party-ify emoji generator because sometimes you need a party sed.js for testing sed commands online Tree generator for creating file tree diagrams 1-on-1 questions - a random selection of questions from 101 questions to get unstuck 🧙🏻‍♀️ A grimoire is a book of magic spells and invocations. Many of the folks I started working with kept and shared collections of their useful regex/shell/perl code, which I am still tremendously grateful for. Instead of my own little stash spreading across a bunch of different places without context, such as my dotfiles repo and gists and other untracked files, I’m collecting those little bits here to share. This post is licensed under CC BY 4.0 by the author. Share"
