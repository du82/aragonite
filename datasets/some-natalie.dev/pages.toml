description = "This is not a food blog. I don’t want to be a food blogger. 👩🏻‍🍳"
full_description = "Recipes Posted Mar 1, 2025 By Natalie Somersall 11 min read Recipes Contents Recipes This is not a food blog. I don’t want to be a food blogger. 👩🏻‍🍳 I would like to make some family recipes publicly accessible without vendor lock-in or asking friends and family to make yet another account on a random “recipe keeper” service. It’s hard to do better than markdown and a git repo for platform neutrality, so this is as good of a place as any. Mix lists BBQ sauce Compound butters Marinades Seasoning blends Stocks and broths Tea blends Recipe list Alfredo sauce - Simple sauce, lots of variations and cheese BBQ beans - Tangy and smokey mustard BBQ beans Baked beans - Beans baked with molasses and salt pork Baked donuts - Simple donuts that come together in under an hour, made from scratch and baked. 🍩 Banana bread - Everyone’s favorite way to use up brown bananas 🍌 Banana pancakes - Yet another way to use up brown bananas Black bean burgers - Spicy burgers for grilling 🌶️🍔 Black beans - Big pot of black beans for soup, tacos, over rice, or a million other ways. Bourbon mac and cheese - It’s bacon and booze in your mac and cheese, great BBQ side dish. Bread machine bread - Whole wheat bread for the bread machine 🍞 Buttermilk drop biscuits - Fast whole-grain drop biscuits Buttermilk fried chicken bites - The deep fryer comes out of the pantry about once a year and this is why. 🍗 Caramelized onion jam - Spread on sandwiches, top on crusty bread, serve on a cheese board, and more. Carnitas - Easy oven carnitas Cashew chicken - Quick weeknight meal with extra veggies! Delicious without the chicken too. Cassoulet - Brothy beans and tender meats in a big pot, but not traditional. Cheddar, bacon, and chives skillet bread - Savory breakfast skillet bread (or scones) Chex mix - Homemade party snack - nuts optional Chicken and mushroom pasta - Chicken and cremini mushrooms in a cream reduction sauce. Not “rigatoni d” from a nice Italian restaurant. Chicken marsala - Simple chicken marsala Chicken pot pie - Freezer-friendly meal with tons of veggies from a rotisserie chicken Chocolate mouse-y cookies - Holiday cookie for the cookie jar Chocolate mousse - the family recipe Christmas pecans - Nana’s handwritten recipe for the spiced pecans she’d make at Christmas Cinnamon rolls - Bake right away or freeze until you’re ready, as individual rolls or a giant single roll for brunch Coffee cake - Crumbly cinnamon coffee cake Confetti cake - Vanilla cake with sprinkles inside and on top! 🍰 Cornbread stuffing - The side dish that goes with all the holiday meals, (mostly) from scratch Country bread - A simple daily boule of flour, yeast, water, and salt. Start the night before, then bake around lunch. 🥖 Crepes - Traditional crepes, fill with fruit or vegetables or cheese or any other number of tasty things. Dark chocolate ice cream - As dark as you’d like it Dinner rolls - Fast yeasty dinner rolls in a dutch oven. Enchilada sauce - Red enchilada sauce. Granola - Slow-cooker granola Grasshopper cheesecake - Creme de menthe and cocoa cheesecake in a chocolate cookie crust Grilled bread - Grilled no-knead focaccia bread Hudson Bay bread - Shelf-stable high-energy trail snack Jambalaya - Needs no introduction, just time Kernel corn spoonbread - Sweet corn spoonbread from family gatherings Manicotti - (or lasagna if you’d rather) Mocha truffles - Christmas-time chocolates with just a hint of coffee to balance it all out Monster cookies - Cookies to feed the entire scouting troop for a whole trip Peppermint bark - Holiday candy Pie crust - Simple crust for most pies Pizza sauce - Big batch of pizza sauce 🍕 Potato and white bean soup - Golden potatoes and white beans make a simple, hearty soup Potato salad - The mother-in-law’s potato salad Pumpkin bread - It’s only cake if you frost it, right? 🎃 Pumpkin pie - The Thanksgiving dessert Pumpkin spice muffins - When making pie is too much and muffins are just easier. Quiche - Easy breakfasts made in advance, tons of variations. Red beans and rice - 🫘 Classic Cajun dish, served over hot rice. Refried beans - Easier, healthier, and tastier from scratch Rice pilaf - An easy side dish Rock candy - A kid favorite Roux - Thicken your soup/sauce/whatever Saffron rice - Yellow rice, but better and with real saffron. Sausage gravy - Easy breakfast gravy Semolina gnocchi - Make-ahead sheet pan semolina gnocchi Semolina pasta - Homemade pasta for rolling, cutting, and other tasty shapes. Sicilian artichokes - Sicilian stuffed artichokes and pasta (cacocciula) Skillet corn - Serve (or preserve) fresh corn as a sweet or savory side. 🌽 Skillet pastas - One-pan skillet pasta variations Soda bread - Whole grain fast bread Sourdough bread - Lazy sourdough bread using the discard Sourdough pancakes - Overnight whole-grain pancakes using the discard Spice cake - Warm fall spices in a rich buttermilk cake Spiced apple blackberry jam - Holiday cheer in a jar Spiced lemon ham - Ditch the glaze packet, use this instead. Summer crab soup - Fresh summer crab and seasonal corn on the cob in a creamy soup. Goes great in a bread bowl. More of a chowder or bisque for consistency, but the family calls it soup. 🦀 Sunday sauce - Pasta with red sauce is good any day of the week. Meat optional. 🍝 Sweet pickles - Nana’s handwritten recipe for sweet pickles. They take about 2 weeks to make, then 6 to cure. Taco rice - Rice for tacos, from scratch. Three bean chili - As meaty (or vegetarian or vegan) as you’d like. As spicy as you want it. In the oven or on the stove top. It’s chili, don’t make it complicated. White beans and rice - A hearty pot of beans as spicy as you’d like, served over hot rice. Whole grain pancake mix - Make-ahead, shelf-stable pancake mix 🥞 Drink list Apple sangria - Warm fall days in a simple pitcher cocktail Bourbon slushy - Summer porch sipper Butterscotch syrup - Simple butterscotch for coffee, desserts, and more. Cassis sangria - Easy summer pitcher cocktail Fruit syrups - Simple syrup with fruits and herbs for desserts and drinks Infused bourbons - What to do when you try one you don’t like 🥃 Midnight mint syrup - Dark chocolate and mint syrup for ice cream, coffee, and more. Simple syrups - All the simple syrups to put in teas and coffees and cocktails Strawberry basil tea - Summer iced tea to use up extra strawberries and fresh basil Salad dressings Name Ratios Citrus - 1 small shallot, minced- 0.75 cup olive oil- 0.25 cup Champagne vinegar- 3 Tbsp lemon juice + 0.5 tsp zest- 2 Tbsp orange juice- salt, pepper to taste Jam - 2 tbsp jam- 0.25 cup acid- 0.5 cup fat- herbs, to taste Buttermilk - 0.5 cup buttermilk- 0.25 cup acid- 2 tsp honey- 0.25 cup fresh herbs- salt, pepper, dried herbs to taste Maple - 0.25 cup maple syrup- 3 tbsp apple cider vinegar- 2 tbsp olive oil- 2 tsp poppy seeds- 2 shallots, minced- 2 tsp Dijon Spicy tahini - 0.5 cup soy sauce- 0.5 cup tahini- 0.25 cup rice vinegar- 3 Tbsp honey- 2 Tbsp lime juice- 1 Tbsp ginger paste (or grated)- 1 Tbsp minced garlic- 1Tbsp sriracha, to taste- 1 tsp black pepper Salad ratios Name Ratios Brussels sprouts - 10 sprouts, shaved- 1 small apple, finely diced- 0.25 cup seeds or nuts- 0.25 cup dried fruits- 0.25 cup crumbly cheese (optional) Baking time chart Time and temp combinations that work well. What Temp Time Notes Bacon 400°F 30 mins fridge, warm on skillet Beef prime rib 175°F550°F Until 120°F inside (5-6 hours)8-10 minutes rest tented until ready to serve Brussels sprouts 500°F 20 mins start on skillet, flip all halves down Ham 275°F450°F 20 mins/pound10 mins reheat coveredfinish w/ glaze uncovered Pork ribs 550°F325°F 20 mins2 hrs start uncovered in sheet traycover tightly in foil to finish Smashed potatoes 450°F 30 mins boil first, use thin tray in oven Any crock pot “low” meal 225°F same as recipe crack lid for evaporation, stir sometimes 🍳 To apply seasoning to cast iron: Put a baking sheet on the lowest rack, then preheat oven to 500°F. Apply a thin layer of vegetable oil, removing excess. Bake for an hour, then cool before storage. Repeat as necessary. Sous vide time chart This is all completely opinionated - just wanted to write down the combination that goes over well. Cut Temp Time Notes Bacon 145°F / 63°C 24 ± 12 hours finish on skillet Beef brisket 155°F / 68°C 30 hours add 1-2 drops liquid smoke, a pinch of pink curing salt finish in oven at 300 °F / 149 °C for 1-2 hours for bark Beef prime rib 132°F / 55°C 6 hours finish in oven at 425 °F / 218 °C for 10-15 minutes before serving Beef steak (most cuts) 129°F / 54°C 2-4 hours sear before serving Beef tri-tip roast 134°F / 57°C 2 ± 2 hours sear before serving Burgers 124°F / 51°C 1.5-2 hours finish on pan or grill Dulce de Leche 185°F / 85°C 12 hours 1 can sweetened condensed milk, that’s it! Egg bites 172°F / 78°C 1 hour - 6 eggs- 0.25 cup cream cheese- 0.5 cup cheese- other mix ins Hard boiled eggs 194°F / 90°C 20 minutes finish in ice bath to halt cooking Oatmeal 140°F / 60°C overnight in 2 half-pint jars - 0.33 cup rolled oats- 0.33 cup steel-cut oats- 0.67 cups cream or milk- 1 cup water (ish)- dried fruit, sweeteners, to taste Poached pears or apples 176°F / 80°C 1 hour - 2 cups white wine- 2 cups water- 1 cup maple syrup- 4 pears or apples Pork shoulder 185°F / 85°C 12 ± 4 hours shred, broil for 5-10 minutes at end Salmon 120°F / 49°C 45 ± 15 minutesbased on thickness add fat and some aromatics to bag Toasted cream 180°F / 82°C 24 hours add pinch of baking soda per pint for browning Stand mixer speed chart Recommended stand mixer speed for each attachment. I lost the manuals to these years ago. Pasta rolling set attachment speed pasta roller 2 fettuccine cutter 5 spaghetti cutter 7 Pasta extruder attachment speed spaghetti plate 10 bucatini plate 10 rigatoni plate 6 fusilli plate 2 - 4 large macaroni 6 small macaroni 6 Spiralizer attachment speed fine blade 4 medium blade 6 slicing blade (small core) 4 slicing blade (large core) 6 peeling blade 4 Other attachments attachment speed ice cream machine STIR food grinder 4 sausage stuffer 4 shredder/slicer (all blades) 4 This post is licensed under CC BY 4.0 by the author. Share"
