full_description = "Somehow Manage Osman (Ozzie) Osman Hi! I’m Osman, most people call me Ozzie (or Oz or O). I build products and teams that build products (and occasionally, teams that build teams that build products). TOP POSTSYou get to know people best by seeing how they think, and I think most clearly when I write. Here are some of the pieces I’m most proud of: Is Revenue Model More Important Than Culture?Disrespectful Design—Users Aren’t Lazy or StupidHire people you believe in—believe in people you hireYou Don’t Have to Manage, But You Still Have to LeadThings to do Before and After You Write Code ABOUT ME I’ve been building software for 30 years—I started with QuickBASIC when I was 10.I’ve started (or helped start) multiple software/product companies, two of which have been acquired.I invest or advise startups when I find the founders or the product engaging and care about its mission and impact.I’ve written a book on hiring software engineers (the Holloway Guide to Technical Recruiting and Hiring).I grew up in Cairo, Egypt but have spent big chunks of my life in Boston, MA and the San Francisco Bay Area.Son of Ahmed and Hala, husband to Dina, father to Ahmed and Aziz. GET IN TOUCH Find me on LinkedIn or Twitter below. Twitter LinkedIn Share this:TwitterFacebook"
