title = "I Buy A New Washer: June 2014"
description = """
I started this blog the day I finally fixed a tap for the first time.  The sense of triumph gave me the feeling that I could also master the complexities of setting up a blog.  Clearly not, however, as I had intended calling the first post, not the whole blog, I Buy a New Washer. By the time I worked out  how to change the blog title, it was too late.  

I dwell on whatever has caught my attention in the day."""
full_description = '''I Buy A New Washer I started this blog the day I finally fixed a tap for the first time. The sense of triumph gave me the feeling that I could also master the complexities of setting up a blog. Clearly not, however, as I had intended calling the first post, not the whole blog, I Buy a New Washer. By the time I worked out how to change the blog title, it was too late. I dwell on whatever has caught my attention in the day. Saturday, 21 June 2014 I Lose My Way I don't often go into town on a Friday night, but last night was the badminton club social so I made an exception. We met in a nightspot, or was it a club, or a bar? I'm not sure. I'd never been there before. Because the drinks were paid for out of the kitty, I drank too much. My Protestant upbringing has taught me two things: to drink in moderation and never to miss a bargain. In a situation where these two things are in conflict, I've learnt that the latter imperative has moral superiority. I tried to leave the bar / club / nightspot at about 11.30 pm, an hour after my usual bedtime. Due to the lateness of the hour, I was confused and couldn't find the exit. I ended up on what I can only think was some kind of dance floor, because within seconds I found myself swaying from foot to foot opposite a man who looked far too young. "How old are you?" I shouted. "Forty-five," he lied. I felt claustrophobic and scanned the glass walls, looking for a way out. I spotted the exit. "Got to go to the toilet," I said. I made it to the cool air outside and walked home through silent streets, relieved and giggling. Posted by Liz Lefroy at 06:16 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: bar, dance floor, drink, exit, Protestant, social Location: Western Europe Sunday, 15 June 2014 I Pitch My Tent Last week, I camped on the Lleyn Peninsula, overlooking Bardsey Island. I was with Helen, my longest-serving friend: separate tents. It's our secret of great camping: 2 x two-person tents. My tent does not have plug socket, Wi-Fi or shower. My tent has a library, a cellar, a wardrobe, a narrow bed. When, in the morning, I let out the body fug of my night's breathing, it has infinite space: cubic yards of the stuff, all the way up to the sun, and all the way to the moon which rose each night through strands of cloud, growing to fullness by the week's end. Camping transforms cooking, washing and dressing to play. We walked the coast path in the day and in the evenings, drunk on air, played house, played at dressing up, played with water. We cooked risotto for nights in a row with decreasing ingredients and increasing imagination. We wore tea towels on our heads to keep off the sun, tattooed our arms with dragons and anchors, called each other names, rolled Welsh place names and old stories around our mouths, and, laughing serious, made plans about dancing to ward intruders off our sacred territory. Posted by Liz Lefroy at 21:18 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Bardsey Island, camping, friend, Lleyn Peninsula, risotto, tattoos, tent Thursday, 5 June 2014 I Squash A Banana When I emptied my rucksack this evening, I found a blackened banana at the bottom. I put it in this morning firm, bright and yellow, intending to eat it with my lunch. Montaigne advised that we mustn't regret, only reflect. I have squashed bananas before, and reflected on them. I have considered buying a yellow plastic banana-shaped case to protect my in transit bananas. When I've squashed more than one banana at a time, I've made cake from them, counted my good fortune. But try as I might, looking at this squashed banana: its skin split, its flesh oozing out, its smell tainting everything that had been in my rucksack: my purse, my pack of tissues, my Patti Smith CD, my umbrella, my book about lemons, it's regret that I feel. Posted by Liz Lefroy at 23:21 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: banana, cake, Montaigne, reflect, regret Wednesday, 4 June 2014 I Start A New Poem Somewhere, this flight ended It comes back to what I can’t work out: when exactly did I lose control over the Atlantic? You give me no explanation and I don’t think I've given you anything that amounts to a reason, yet something unnamed has been lost though there is no evidence except in my body which is scattered with messages (I have come to understand they will never be read). I sorrow this sorrow though I am not insensitive. I believe the lives of the disappeared have an infinite significance. And this? This is just love, love, which I've always feared - and you've known - has a trajectory. Posted by Liz Lefroy at 23:23 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: love. Sunday, 1 June 2014 I Question My Identity I went swimming earlier and I swam faster than the swimmer in the lane next to me. At first I thought I'd made a mistake, that I was much slower, that he'd been lapping me. I swam breaststroke for two lengths with my head out of the water to check what was going on. At certain times of day there are three lanes in the pool marked: Fast, Steady and Plodder. I used to choose Plodder every time. Labelling theory says that our identities are influenced by the terms used describe them, and that words like Fast, Steady and Plodder can become self-fulfilling prophecies. Another of the ways in which we construct our identities is to notice the ways we are similar to and different from each other. That's why our identities shift depending on the context we're in. When I went swimming with Lucy last week, we chose the Fast lane, because I felt more daring in her company and didn't worry what people would think about my relative speed. All the time I was in the fast lane with Lucy, I felt fast because, though she has to rein herself in when we go walking, we're well-matched in the water. On the way out of the pool today I looked at myself in the mirror. I was wearing my swimming costume with its go faster stripes. Posted by Liz Lefroy at 17:15 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: identity, labelling, swimming Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search This Blog About Me Liz Lefroy View my complete profile Blog Archive ► 2025 (3) ► February (1) ► January (2) ► 2024 (13) ► December (2) ► November (1) ► September (1) ► July (1) ► June (1) ► May (2) ► April (2) ► February (2) ► January (1) ► 2023 (13) ► December (1) ► November (1) ► September (2) ► August (1) ► July (1) ► June (2) ► May (1) ► April (1) ► March (1) ► February (2) ► 2022 (11) ► December (3) ► October (3) ► September (1) ► August (1) ► June (1) ► May (1) ► February (1) ► 2021 (15) ► December (1) ► September (1) ► August (2) ► July (1) ► June (1) ► May (2) ► March (2) ► February (3) ► January (2) ► 2020 (24) ► December (3) ► November (3) ► October (1) ► September (1) ► August (3) ► July (1) ► June (3) ► May (1) ► April (3) ► March (3) ► February (1) ► January (1) ► 2019 (21) ► December (2) ► November (3) ► October (1) ► September (1) ► August (1) ► July (1) ► June (2) ► May (1) ► April (3) ► March (2) ► February (1) ► January (3) ► 2018 (36) ► December (3) ► November (3) ► October (3) ► September (3) ► August (3) ► July (3) ► June (3) ► May (3) ► April (3) ► March (3) ► February (3) ► January (3) ► 2017 (35) ► December (4) ► November (2) ► October (4) ► September (3) ► August (1) ► July (3) ► June (2) ► May (4) ► April (2) ► March (4) ► February (5) ► January (1) ► 2016 (37) ► December (5) ► November (3) ► October (5) ► September (3) ► August (3) ► July (2) ► June (3) ► May (4) ► April (2) ► March (4) ► January (3) ► 2015 (38) ► December (2) ► November (2) ► October (6) ► September (6) ► August (3) ► July (3) ► June (2) ► May (4) ► April (2) ► March (4) ► February (2) ► January (2) ▼ 2014 (59) ► December (4) ► November (2) ► October (5) ► September (6) ► 