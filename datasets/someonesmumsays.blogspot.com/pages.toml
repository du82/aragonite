full_description = '''I Buy A New Washer I started this blog the day I finally fixed a tap for the first time. The sense of triumph gave me the feeling that I could also master the complexities of setting up a blog. Clearly not, however, as I had intended calling the first post, not the whole blog, I Buy a New Washer. By the time I worked out how to change the blog title, it was too late. I dwell on whatever has caught my attention in the day. Saturday, 21 November 2015 I Embrace A Plank Meet Plankie. This is a head and shoulders shot, but he extends down quite a long way. Plankie was my son J's childhood creation and friend and we came across him again this afternoon when his big brother, G, needed something longer than a ruler. I gave him a long overdue hug. Seeing Plankie again made me come over all warm. Warmth was a feeling I also experienced at The Land Of Lost Content in Craven Arms last Saturday. This museum is dedicated - unashamedly, extravagantly and recklessly - to nostalgia, much of it tat but none of it worthless. I recommend that if you visit you go, as I did, with a close friend of similar age with whom you feel able to utter, without embarrassment, over and over again, "Oh, I remember this / that / those!" whether you're referring to stuffed budgies in cages, electric typewriters, Donny Osmond mannequins or Zoom lollies. J's determination to love Plankie against the odds for all these years moves me. Back when Plankie was new, he made a rigid bedfellow and a reluctant traveller. Planks, even ones with faces, don't easily sit upright in cars. Much of the content in the LOLC is also rigid, yellow and slightly off-centre, but my companion and I were determined to embrace the unlikely experience of it all, and if you get the chance, you must go (though it's closed in December and January). Although older and a good deal taller than Plankie now, J's affection for him is still clear. I like this loyalty to the absurd, to fun, to the apparently worthless. I will always relish ability of those who can find joy in anything - who can draw a lopsided smile onto any day of the week. http://www.lolc.org.uk/ Posted by Liz Lefroy at 18:40 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Land of Lost Content; plank; Plankie; Donny Osmond; joy Sunday, 8 November 2015 I Keep The Score No one was more surprised than me when I won 4-1 at badminton today. Admittedly, for three of the games, J only used backhand shots. This was because Malcolm from the Tuesday club set this for him as homework. This Malcolm-imposed limitation gave me a considerable advantage, one I exploited by placing shots to J's forehand. Long-gone are the days when I held back from using the full panoply of tactics learned over 40 years at the net. At 6'3", J doesn't need any favours from me. Usually our scores creep up fairly evenly. 1-0, 2-0, 2-1, 2-2, 2-3, etc. When we get into the higher numbers, I add an extra challenge to our game by turning some of our scores into dates. 18-15, for example, is the date of the Battle of Waterloo. Or, as I've recently discovered, the date of publication of the first geological map. 12-15, Magna Carta, is topical in this its 800th anniversary year, as is 14-15, Agincourt. 18-12 is our favourite score: "Overture," we chorus whenever it occurs. "Battle of Borodino," I sometimes add. We are too evenly matched to have scored the Battle of Trafalgar (18-05), but today, thanks to Malcolm, we hit a new range of dates in addition to old favourites. Here are some of them: 10-16 - King Cnut begins his reign 12-04 - Capture of Constantinople by the 4th Crusaders 13-07 - Wm Tell supposedly shoots the apple off his son's head (another chance to shout, "Overture!") 16-19 - First Thanksgiving, Virginia 19-15 - Sinking of the Lusitania 20-12 - 'lympics Posted by Liz Lefroy at 22:38 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: anniversary, Cnut, Constantinople, dates, scores, Trafalgar, Waterloo Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search This Blog About Me Liz Lefroy View my complete profile Blog Archive ► 2025 (3) ► February (1) ► January (2) ► 2024 (13) ► December (2) ► November (1) ► September (1) ► July (1) ► June (1) ► May (2) ► April (2) ► February (2) ► January (1) ► 2023 (13) ► December (1) ► November (1) ► September (2) ► August (1) ► July (1) ► June (2) ► May (1) ► April (1) ► March (1) ► February (2) ► 2022 (11) ► December (3) ► October (3) ► September (1) ► August (1) ► June (1) ► May (1) ► February (1) ► 2021 (15) ► December (1) ► September (1) ► August (2) ► July (1) ► June (1) ► May (2) ► March (2) ► February (3) ► January (2) ► 2020 (24) ► December (3) ► November (3) ► October (1) ► September (1) ► August (3) ► July (1) ► June (3) ► May (1) ► April (3) ► March (3) ► February (1) ► January (1) ► 2019 (21) ► December (2) ► November (3) ► October (1) ► September (1) ► August (1) ► July (1) ► June (2) ► May (1) ► April (3) ► March (2) ► February (1) ► January (3) ► 2018 (36) ► December (3) ► November (3) ► October (3) ► September (3) ► August (3) ► July (3) ► June (3) ► May (3) ► April (3) ► March (3) ► February (3) ► January (3) ► 2017 (35) ► December (4) ► November (2) ► October (4) ► September (3) ► August (1) ► July (3) ► June (2) ► May (4) ► April (2) ► March (4) ► February (5) ► January (1) ► 2016 (37) ► December (5) ► November (3) ► October (5) ► September (3) ► August (3) ► July (2) ► June (3) ► May (4) ► April (2) ► March (4) ► January (3) ▼ 2015 (38) ► December (2) ▼ November (2) I Embrace A Plank I Keep The Score ► October (6) ► September (6) ► August (3) ► July (3) ► June (2) ► May (4) ► April (2) ► March (4) ► February (2) ► January (2) ► 2014 (59) ► December (4) ► November (2) ► October (5) ► September (6) ► August (5) ► July (7) ► June (5) ► May (5) ► April (6) ► March (8) ► February (6) Picture Window theme. Powered by Blogger.'''
