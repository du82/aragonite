full_description = '''I Buy A New Washer I started this blog the day I finally fixed a tap for the first time. The sense of triumph gave me the feeling that I could also master the complexities of setting up a blog. Clearly not, however, as I had intended calling the first post, not the whole blog, I Buy a New Washer. By the time I worked out how to change the blog title, it was too late. I dwell on whatever has caught my attention in the day. Friday, 23 December 2016 I Discover Happiness I found happiness two weeks ago, and it was on the inside of my birthday card. In response to my list - One Hundred Words for Sad - (I Bare My Psyche), my longest-serving friend had written: Have another fun fantastic creative fulfilling happy loved loving lovable joyous amazing carefree triumphant beatific felicitous propitious blessed euphoric ecstatic exultant rapturous jocund gladsome merry bright auspicious elated laugh-inducing cheerful blissful cheery thrillful congenial delightful convivial enchanted wonderful gleeful chocolatey fizzing vivifying affirming wanton brave empowered empowering fruitful vibrant poetic lyrical confident convivial uninhibited hang-up-free rhapsodic inspiring inspirational sparkling wondrous magnificent awe-filled tremendous terrific heavenly divine guilt-free unparalleled rewarding enriching visionary dynamic beamish radiant starry exuberant gay jocular buoyant bonny blithe light-hearted exhilarating exuberant energised intoxicated playful upbeat mirthful tickled pink-ful celebratory unshackled untrammelled free champion top great emboldened powerful jubilant sorted perfect year. There have been many hard things about the past year and I don't need to, won't, spell them out; enough to say that at times, one hundred words for sad didn't seem enough. My LSF's list offers hope, and it offers a specific insight in its repetition of the word convivial (34 51) and in word number 85. I have found much happiness this year in the convivial company of those, like her, who want to live life with clarity and courage; to live without pretence; to live with hope despite everything that's been going on around and in us; to live to grow; to live to play with words, with paint, with dancing, with fire, with food, with music, with motorbikes, with running, with trying out different hats. Thank you, all of you. I wish you my LSF's hundred words, well 99, for happiness for Christmas and the New Year. Posted by Liz Lefroy at 07:41 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: #happiness, #happynewyear Wednesday, 21 December 2016 I Don My (Christmas) Onesie Getting back from work yesterday, I made the miscalculation of thinking I'd have a quick bath before going out to the pub with the badminton club. Quick Bath is an oxymoron. Like Cool Polyester, or (if not in Switzerland or some other exotic place) Reliable Public Transport. Or Exotic Switzerland. So, my bath wasn't quick and just as I got out, Jonathan phoned to say that they'd nearly finished drinking. This surprised me, as by that time I was planning to be only an hour or two late, and the club has something of a reputation for stamina. But as we chatted, I confessed to extreme end-of-term tiredness and opted out, stayed in. It made perfect sense to get straight into my Christmas onesie for the first time this year. People have different markers for when the Christmas season begins. For some it seems to be August, and the start of Christmas shopping. For others, it's the January sales, when reduced Christmas cards encourage preparation for the following year. I suppose for these people, Christmas is never really over but exists as a background to everything else. For me for a while, it was my sons' primary school nativity plays - those afternoons snatched from work to sit on tiny chairs in a hot and crowded hall watching hundreds of children have their individual moments of glory and disappointment. Even longer ago, it was Christmas Eve afternoon, stopping for a moment to listen to Nine Lessons and Carols from King's College, Cambridge. Once, when I was gloriously 13 for a moment, and in awe of adulthood, it was being in King's Chapel for the advent service. It was absolutely possible to believe in a virgin birth under that fan-vaulting, resonant with the sounds of angels. Nowadays, my Christmas begins when the autumn term properly ends for me, as it did yesterday. The term which is the best and worst of everything in teaching: the one which starts with high expectations and goes on forever, and which descends from the vigour of a fresh autumn into the overwork of 'getting everything done by Christmas'. Putting on my onesie yesterday evening meant succumbing, at last, to rest. To not getting everything done. To lack of any attempt at dignity or style. To lying on the sofa, enjoying that reckless and blissful thing - an evening snooze in the hopeful light of my Christmas tree, and then getting up, heedless of the time, to make marzipan. Posted by Liz Lefroy at 08:41 9 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: #Christmas Thursday, 15 December 2016 I Do It Again You wait a long time to see Malvolio when you're watching The Tempest. I discovered this a week ago when the tormented, cross-gartered antagonist failed to appear in the wrong play. And he did not appear because he could not. Discussing my confusion (I Muddle My Shakespeares) whilst pulling crackers over blueberry and banana pancakes at a friend's house last Sunday, I saw that what fell out of my cracker, in addition to a joke and a paper crown, was a packet containing the three nails of the crucifixion: This incident, coming so soon after my Twelth Night / Tempest confusion, set me thinking again about how we see what we think we are going to see and how, even after years of excellent therapy and an ever-increasing experience of freedom, I still carry some hard-wired expectation that what might fall out of a cracker is a punishment. After thinking and thinking about both these happenings, I've begun to realise that my muddle-up over plays is a gift of a metaphor for understanding life. For so long, you see, I was trying to act in the wrong play (though I hope never as Malvolio), and now I've ditched the old scripts, I can get on with being the character I really am. To say I'm rather pleased about this is an understatement, and I'm pretty certain that my finally making it into the right script (an improvised one) does not include me deciding, on the basis of owning three golf tees, to take up golf. Posted by Liz Lefroy at 23:27 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: crucifixion, Malvolio, nails, The Tempest, Twelfth Night Saturday, 10 December 2016 I Muddle My Shakespeares Wendy Cope's lines from Serious Concerns came back to me yesterday as I was trying to work out why I'd muddled up my Shakespeares so badly: Jesus, in His goodness and grace, Jesus found me a parking space In a very convenient place. Sound the horn and praise Him If you see life through one lens (in this case a fixation on the apparent concern of a man who died two millennia ago for the irritating details of contemporary life - a paradigm very familiar to me from childhood) events can only make one kind of sense. On Thursday, for my birthday treat, my longest-serving friend took me to see Twelfth Night at the Donmar. We'd been to their excellent production of Julius Caesar a couple of years ago. I was looking forward to it, but tired after a full-on time at work. In the warm dark of the theatre I began to unwind, drift: I felt sleepy, dreamy. The production was interesting - set, like the Caesar, in a women's prison, with minimal staging and props, an all-female cast in grey track suits. I thought the introduction of Ariel into Twelfth Night a little avant garde, admittedly, but was committed to my view. The mention of Caliban, however, was a bucket of cold water, and I woke up to reality. All at once, I knew I was entirely in the wrong play. I took an embarrassed leap into The Tempest. And from thereon, everything made a much better and more substantial kind of sense. "It's like that game in I'm Sorry I Haven't A Clue - one song to the time of another," said my L-S-F when I confessed my confusion to her over lunch yesterday. "It's a question of hermeneutics," said our companion. I'm glad I cleared things up in my head before I'd gone too far into the play, and that I have such kind and forgiving friends. And I'm glad that I have a second chance at seeing things for what they are, and that I've found everything's so much more interesting than what I was led to expect. Posted by Liz Lefroy at 10:48 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Thursday, 1 December 2016 I Admire A Teacher It's afternoon, already after dark, and I'm sitting in the corner of a small music room. I keep my coat on, though it's warm. The radiator's providing a background swish of moving water. I'm pretending to be passing through, waiting to take my son home, popping in to sit in on the end of his lesson, but in reality, I've arrived far too early and I'm audience. The teacher knows this, and is kind: extends the allotted time into evening. What I see, what I hear is this: a teacher giving of himself, of his years of accumulated technical skill and musicianship, boundless in his generosity. He's passing on wisdom, understanding, compassion, diligence, and all this across several decades to my young son who sits, guitar propped classically on his left knee, as they chat in-between playing. This talking is as much as the practice in these lessons. I watch them draw meaning out of their age-differences, their common passion, their acknowledgement of what joins and separates them. For now they're discussing the various means of plucking the strings in order to achieve the warmth needed for Villa Lobos. This is a master class. I'm watching what it is to teach by drawing out the knowledge of what makes truth beautiful from all that's available: the music itself, the instrument, his own experience and expertise and my son's unique and forming understanding of the world. And he does this with the tender authority of one who knows himself and his art, who desires above all that his pupil finds as much joy in its pursuit as he does. Posted by Liz Lefroy at 08:22 5 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: guitar, master class, teaching, Villa Lobos Monday, 21 November 2016 I Bare My Psyche I've been tidying my desk. Something to do with jogging the Park Run has made me think I can achieve other impossible feats. I've been tidying my desk and I came across a list. I jogged five or so years ago as a way of trying to defeat sadness. Sadness won, so I went to therapy. "How do you feel?" my therapist, TP, asked each week. "Sad," I replied, each week. "What does it feel like, this sadness?" TP persisted. "Well .... sort of .... sad." "For a poet," TP stated, never one to hold back from the necessary truth, "you're remarkably inarticulate about emotions." What the sadness felt like was a weight I'd been carrying since Upper 3 Biology with Miss Beynon. I could tell you about how I was working hard, copying a diagram of a radish from the board, labelling tap roots and leaves, wanting her approval. But the point is that in the middle of recording and analysing life according to someone else's prescription, I realised everything was meaningless. And I realised Miss Beynon preferred plants to children. I was 11 and the afternoon sun was making things too hot in the lab, and I had a home-made haircut, and a home-made skirt and a home-made God-given attitude, and I didn't know what to do with this feeling. These feelings. I tried re-thinking things in History, and found a bit of relief in hearing about the Battle of Waterloo, but after that, the weight never left me. Never one to take the truth or an insult lying down, I prepared myself for therapy, and TP's next knowing provocation, and started a list, took it as a script to my next session. That'll learn you. We ended up laughing, a lot. And I found out that the point of everything, for me, is to know how, exactly, to go about, and around and about, naming things. One Hundred Words For Sad 1. inadequate 2. sorrowful 3. leaden 4. ruined 5. desolate 6. despairing 7. depressed 8. deflated 9. damaged 10. dead 11. dreadful 12. desperate 13. anxious 14. lonely 15. overwhelmed 16. vulnerable 17. weak 18. flat 19. heavy 20. sombre 21. tired 22. lost 23. apathetic 24. bitter 25. resentful 26. gloomy 27. grumpy 28. dumb 29. condemned 30. pathetic 31. hurt 32. judged 33. disheartened 34. shrivelled 35. trapped 36. frozen 37. absent 38. melancholy 39. distressed 40. unhappy 41. discomforted 42. glum 43. afraid 44. wounded 45. stressed 46. guilty 47. insecure 48. paranoid 49. marginalised 50. miserable 51. disillusioned 52. deserted 53. failed 54. bereft 55. abandoned 56. forlorn 57. barren 58. low 59. blue 60. misunderstood 61. purposeless 62. aimless 63. dreary 64. hapless 65. useless 66. pathetic 67. morose 68. fatalistic 69. trapped 70. resigned 71. disappointing 72. disappointed 73. dissatisfied 74. fearful 75. pained 76. careworn 77. weary 78. defeated 79. helpless 80. hopeless 81. friendless 82. alone 83. redundant 84. insignificant 85. doomed 86. destroyed 87. pointless 88. fucked up 89. scattered 90. fractured 91. splintered 92. fragmented 93. bruised 94. down 95. negative 96. sullen 97. weighted 98. weighty 99. hollow Posted by Liz Lefroy at 23:01 6 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: sad; therapy; radishes Saturday, 19 November 2016 I Jog The Park Run This morning, I completed my third Park Run in beautiful early winter sunshine. I set myself a goal this week which was not to fall over on the icy paths. Falling over from a great height is no fun. Garrison Keillor, of Lake Woebegone Days, describes seeing a tall person falling as like watching timber being felled. When I first re-started playing badminton four years ago, I wore a pair of my son's trainers that he'd outgrown. My feet hadn't grown for a while and they were a bit too big for me. Whilst going for a tricky shot, I tripped over and fell hard on my bottom, which led to me sleeping on a bag of frozen peas. The Park Run is a 5K route and in Shrewsbury it goes through the magnificent Quarry Park: 29 acres of grass, mature trees and paths sloping down towards the River Severn. It's the best thing about the town. I mentioned to my brother I've been doing the Park Run and he told me to look ahead, not down, and to buy some decent trainers. He didn't mention anything about peas, but he did talk about joints and so I went out and bought these: It was hard to look ahead at 9am, the orange sun still low in the sky. So I looked up, saw three swans flying the Seve'''
