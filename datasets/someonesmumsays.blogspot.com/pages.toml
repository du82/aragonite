full_description = '''I Buy A New Washer I started this blog the day I finally fixed a tap for the first time. The sense of triumph gave me the feeling that I could also master the complexities of setting up a blog. Clearly not, however, as I had intended calling the first post, not the whole blog, I Buy a New Washer. By the time I worked out how to change the blog title, it was too late. I dwell on whatever has caught my attention in the day. Sunday, 19 April 2015 I Solve Most Of My Problems I was chatting on the phone to a friend (one of my best) this weekend, and she was telling me how she'd failed in a situation she was describing involving the unexpected arrival of a More-Than-Annoying-Person. "Did you lose it?" I asked. "Did you run around screaming? No? Under the circumstances, you did well not to break the law." The problem is, we concluded at the end of laughing, that we both routinely set ourselves standards which are not only unattainable, but also unnecessary. According to Wikipedia, a source I can now (having resolved to lower my standards) consult without shame, perfectionism is a personality trait characterised by a person's striving for flawlessness and setting excessively high performance standards, accompanied by overly critical self-evaluations and .... [yawn]. The next sentence says something about unattainable ideals. Well stuff that. "So," I said to my friend, with the conviction unique to hypocrisy, "your standards are far too high. Lower them. If, say, your benchmark was in this instance, 'Deal With Annoying Person Whilst Avoiding Criminal Activity', you'd have reached it with, dare I say it, room to spare. Instead of feeling like a failure, you should be proud of yourself." She had to agree. Taking my own advice, I am spending this evening with a glass of wine, busily lowering my standards all round. Posted by Liz Lefroy at 22:18 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: perfectionism, standards Friday, 17 April 2015 I Review A Performance I’ve been to Rome – did I tell you? It amazed me. Whilst I was there, I mislaid my duties for a while – it wouldn’t have been a holiday otherwise. I missed doing several loads of washing, I missed quite a few meetings, and I missed April’s Shrewsbury Poetry @ Eat Up which included one of the few available performances of Standing for a Seat featuring the Triumvirate of Paul Francis, Ian Lakin and Steve Harrison. So this evening, after a day of meetings at work, and dressed in cleanish clothes, I popped down to Much Wenlock for a showing at the Priory Hall. Standing for a Seat opens with Steve’s poignant poem in which he recollects ‘the first time’ (that he cast his vote). He’s right. It’s a big moment – a coming of age, a rite of passage, a transition into adulthood which only makes sense in the remembering, with the benefit of hindsight. Next we were teased with the non-appearance of Dave C. before Paul’s satirical tribute to Russell Brand – Russell is a movie star, and we’re his backing band. The musical theme was made a reality by Ian and his first song, with its lyrical nod to Bob Dylan – Hard times, they are a-changin', was sung in his rich and easy-on-the-ear voice. What then followed was a well-informed tour in five parts through some familiar and less familiar political history and commentary. For me, the highlights of the 45 or so minutes of poetry and song included Steve’s vivid imagery – his idea of our ballot paper Xs as penciled kisses hadn't struck me before, and the thought of my folded ballot paper amongst many, poured out like fish to be counted and sorted into species is simply beautiful. Ian’s songs are lyrical and feature interesting chord transitions for the discerning musical palate. I particularly enjoyed his anti-London-focus song which recommended: Let’s all move to Birmingham, it’s really quite large, They’re building a John Lewis, there’s no congestion charge. Paul’s sharp commentary also took me to new places – the real split in politics, he argues, is not between parties, but between those who are daft enough to give a toss, and those who aren't. The thought of A little touch of Tony at the polls sent a shiver down my spine whilst his Verity poem, delivered without script, is a tour de force. I know from speaking to university students that there are many political virgins out there who have never used their hard-won right to vote. They would do well to see Standing for a Seat. It might prompt them to make this May 7th, however confusing an experience it might be, their first time. Next Show - Victoria Hall, Broseley, Friday May 1st 7.30pm Posted by Liz Lefroy at 23:20 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search This Blog About Me Liz Lefroy View my complete profile Blog Archive ► 2025 (3) ► February (1) ► January (2) ► 2024 (13) ► December (2) ► November (1) ► September (1) ► July (1) ► June (1) ► May (2) ► April (2) ► February (2) ► January (1) ► 2023 (13) ► December (1) ► November (1) ► September (2) ► August (1) ► July (1) ► June (2) ► May (1) ► April (1) ► March (1) ► February (2) ► 2022 (11) ► December (3) ► October (3) ► September (1) ► August (1) ► June (1) ► May (1) ► February (1) ► 2021 (15) ► December (1) ► September (1) ► August (2) ► July (1) ► June (1) ► May (2) ► March (2) ► February (3) ► January (2) ► 2020 (24) ► December (3) ► November (3) ► October (1) ► September (1) ► August (3) ► July (1) ► June (3) ► May (1) ► April (3) ► March (3) ► February (1) ► January (1) ► 2019 (21) ► December (2) ► November (3) ► October (1) ► September (1) ► August (1) ► July (1) ► June (2) ► May (1) ► April (3) ► March (2) ► February (1) ► January (3) ► 2018 (36) ► December (3) ► November (3) ► October (3) ► September (3) ► August (3) ► July (3) ► June (3) ► May (3) ► April (3) ► March (3) ► February (3) ► January (3) ► 2017 (35) ► December (4) ► November (2) ► Oc