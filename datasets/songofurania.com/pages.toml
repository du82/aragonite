title = "The Song of Urania Podcast"
description = "After briefly examining the astronomy of Timocharis and Aristyllus, who developed the first known stellar catalog, we turn our attention to Hipparchus, who I claim was the greatest astronomer of ancient times. Hipparchus made major developments in virtually every area of astronomy known to him. His measurement of the lengths of the year and month were of unprecedented accuracy, he measured the distance to the Moon, and he developed a star catalog that was an order of magnitude larger than the earlier catalog of Timocharis and Aristyllus, which he was able to use to discover the precession of the equinoxes."
full_description = "Episode 21: Hipparchus the GOAT September 12, 2022 After briefly examining the astronomy of Timocharis and Aristyllus, who developed the first known stellar catalog, we turn our attention to Hipparchus, who I claim was the greatest astronomer of ancient times. Hipparchus made major developments in virtually every area of astronomy known to him. His measurement of the lengths of the year and month were of unprecedented accuracy, he measured the distance to the Moon, and he developed a star catalog that was an order of magnitude larger than the earlier catalog of Timocharis and Aristyllus, which he was able to use to discover the precession of the equinoxes. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well at the end of the last episode I said that there was just one more major astronomer of the Hellenistic Era, Hipparchus, and that I would devote an entire episode to him. But it seems that once again I have bamboozled the poor listeners of this podcast. Because as I was researching this episode I felt that I just could not avoid mentioning two other earlier astronomers of the era, Timocharis and Aristyllus. Never fear, the main focus of this episode will still be Hipparchus, and I still stand by the claim that he was the greatest astronomer of the ancient world. But he will have to share the spotlight, at least briefly, this episode. So who are these two interlopers to this episode, Timocharis and Aristyllus? Well as with all the other obscure astronomers of the ancient world, there is not very much that we do know about the two. The years of their birth and death are unknown, all we know is that they were active and doing their astronomy early in the 3rd century BC in Alexandria, so this puts them as being roughly contemporaneous with Aristarchus. It is believed that Aristyllus was the student of Timocharis, so he was probably about one generation younger, but apart from that, that is all we can say about their biographical details. In fact, since the only records of Aristyllus and Timocharis survive to us through Ptolemy’s great treatise, the Almagest, the only reason we can place the approximate years of their work is by from the astronomical events that they observed. Ptolemy writes in the Almagest that in the thirteenth year of Philadelphos and on the 17th day of the month of Mesore in the Egyptian calendar at around midnight Timocharis observed Venus to pass in front of a star in the constellation Virgo. In our modern calendar, this works out to be the evening of the 11th of October, 272 BC. Ptolemy describes the star that Venus occults as “the star opposite Vindemiatrix.” This is a somewhat vague designation, but Vindemiamtrix is a star in the constellation Virgo, more formally called epsilon Virginis since it is the fifth brightest star in that constellation. Based on modern calculations we can see that the star in question is today called eta Virginis, the seventh brightest star in Virgo. Now, I’ve been saying that Timocharis observed an occultation of this star by Venus, and that’s how the original Greek word “kateilephos” is usually translated — Venus passing in front of the star. But planets and stars are small enough on the sky that it’s fairly rare for a planet to actually pass directly in front of a bright star and block out its light. On average this happens around once or twice a decade and even still won’t be visible from everywhere on the Earth. At the time that I am recording this podcast in 2022, the next occultation of a relatively bright star will be in 13 years, in February of 2035 when Venus will pass in front of Pi Sagittarii, the 16th brightest star in the constellation Sagittarius. In fact, we can see from modern calculations that in 272 BC, Venus only passed very close to the star eta Virginis, getting within about 12 arcminutes south of it, but did not pass right in front of it. At any rate, Timocharis’s observation of this event at least places him to being active in the year 272 BC. Ptolemy also records that Timocharis observed four occultations of background stars by the Moon in the years between 295 and 283 BC, two of which were of Spica, one was of Acrab, and the last of which was of part of the Pleiades. These are the first observations of occultations that we have records of in Greek astronomy and it raises a natural question — why did anyone care? Why did Ptolemy preserve these observations in the Almagest and why did Timocharis make these observations in the first place? The former question has a straightforward answer which we will get to in much more detail later on in the episode — Ptolemy includes Timocharis’s observations in the Almagest because they were critical data points to demonstrate the existence of the precession of the equinoxes. But Timocharis didn’t know about precession, so why did he bother to record these observations? Well, here we end up more in the realm of speculation since we’re attempting to delve into the mental state of an astronomer whose only traces are a few lines in a work written three centuries after his death. But that is not enough to deter the intrepid historian of science, and two historians of science in particular Bernard Goldstein and Alan Bowen couldn’t help but be struck by the similarity of these observations with the kind of observations that are recorded in the astronomical diaries of the Babylonians that I talked about way back in Episode 4. Given that the Greeks had previously demonstrated no interest in recording things like occultations or planetary positions, at least as far as we can tell from the surviving records, the sudden interest in making these observations during the Hellenistic Era has been taken to be evidence that around this time the Greeks must have come into contact with the astronomical records of the Babylonians and started to reproduce the kinds of observations that the Babylonians had been making for centuries. At least in the view of Goldstein and Bowen, Timocharis probably wasn’t merely aping the observations of the Babylonians, but may have been inspired by this new type of observation to make a more precise measurement of something that had long interested Greek astronomers, the length of the sidereal month, that is, the time it takes the Moon to rotate a full 360 degrees around the Earth and return to the same position with respect to the background stars. To this end, he was probably trying to track the position of the Moon as precisely as possible relative to the background stars. Well, all these occultations aside, what history has principally remembered Timocharis and Aristyllus for, even if only marginally, is having created the first known star catalog. Now, as I’m sure you’ve come to expect from these obscure Greek astronomers, the catalog itself does not survive directly, but Ptolemy included their measurements of the positions of 18 stars in the Almagest. As we’ll get to in a little bit, the reason Ptolemy did this was that he was comparing the positions of stars recorded by Timocharis and Aristyllus with the positions of those same stars as they were measured by Hipparchus to show how they had shifted over the centuries due to the precession of the equinoxes. But because he only needed the positions of a handful of stars to demonstrate this phenomenon, he had no reason to include their complete catalog in his work, so the entire list of stars in their catalog has been lost to time. Well with that we can now turn to the astronomer who really is the only reason why Timocharis and Aristyllus have been remembered at all, Hipparchus, who was, I will once again claim, perhaps the greatest astronomer in all of antiquity. He was born in the city of Nicea which was in northwestern Anatolia. His birthplace is probably most famous today for hosting a series of councils of the bishops of the early Christian Church several centuries later, or if you happen to be an Arian, infamous for hosting those councils since the main item on the agenda was to denounce Arianism as a heresy. We don’t really know very much at all about Hipparchus’s life since most of our sources about him come through Ptolemy who was a fairly no-nonsense kind of guy and just presented Hipparchus’s measurements without any of the frippery about his biographical details. A few other details about his work come to us through Strabo’s Geography and Pliny’s Natural History, but again not much in terms of his life. In fact, as with Timocharis and Aristyllus, our estimates of the years of his birth and death are just based on the dates of the observations he made. So his death is assumed to be not too long after his last recorded observation in 127 BC, and his birth is assumed to be some 20 or 30 years before his first observation. Now unfortunately, the earliest observation we can definitively attribute to him is one recorded in Ptolemy’s Almagest in 147 BC, but it’s believed that there are even earlier observations due to him going back to 162 BC, so his birth is usually given as being around 190 BC and his death around 120 BC, but we cannot really say anything definitive except that he was certainly active between 147 and 127 BC. Likewise with where he lived, all we can say for sure is that he was born in Nicea and later in life moved to Rhodes because at least some of his observations recorded in Ptolemy’s Almagest are stated to have been taken at Rhodes. Since by the end of the Hellenistic Era Rhodes was an extremely prosperous city, it’s usually assumed that Hipparchus moved there in his youth and spent the rest of his life there, though really this is still just an educated guess based on the scant data we do have. Nevertheless, it is worth saying a few words about Hipparchus’s purported home of Rhodes because it was one of the more dynamic cities of the Mediterranean during the Hellenistic Era and was a focal point for the geopolitics of the region. You may recall from Episode 19 that after Alexander the Great died, his sprawling empire immediately splintered with his various generals seizing what regions they could for themselves. In the eastern Mediterranean there ended up being three main players in this war of succession. One was the general Ptolemy Soter, who later was also called Ptolemy I, who seized Egypt, which was at the time one of the richest regions in the known world, both in trade and agriculture, and had the cultural prestige of being heir to the most ancient civilization known. After all, at that time, some of the Pyramids were older to the people of the Hellenistic Era as the people of the Hellenistic Era are to us today. The second major player in the region was Antigonus Monophthalmus, whose name literally means the “one-eyed.” The reason for the moniker is pretty self explanatory, and according to Plutarch he lost an eye in his late 30s during the Siege of Perinthos, though sadly for him it was all for nought as the siege failed. After Alexander’s death, Antigonus Monophthalmus managed to seize Alexander’s original territory, the areas around Greece with Cyprus to boot. And the last mover and shaker in the region was Seleucus, who took the eastern portions of Alexander’s empire: Syria, Mesopotamia, and parts of Persia. Seleucus’s territory ultimately became the Seleucid Empire and lasted about two and a half centuries. Well, Hipparchus’s adopted home of Rhodes is an island in the Mediterranean just off the coast of southwestern Anatolia, so if you look at in on a map it’s basically right where these three powers meet. And, rather remarkably, like a radio broadcast antenna can stay upright when three support wires are pulling it in three different directions, Rhodes managed to maintain its independence as a republic by sitting right in the middle of these three great powers. Now, of course, this was not some agreed-upon zone of neutrality, all the powers were constantly vying to take Rhodes into their own empires, but by deftly playing one empire against the other, the Rhodesians managed to maintain their independence, and even beyond that managed to retain some elements of democratic governance. Now, I don’t want to overstate the neutrality of Rhodes too much. Although Rhodes was an independent republic, through the Hellenistic Era they were generally most closely aligned with Ptolemaic Egypt. Thanks to their unique position, Rhodes in effect controlled access to the Aegean Sea and as a consequence became a hub for trade and commerce in the eastern Mediterranean over the 3rd century BC. Thanks to this flourishing economy, Rhodes was able to support a vibrant intellectual culture. Not quite as vibrant as Alexandria or Athens a century or two earlier, but nevertheless nothing to sneeze at. One of the great sculptors of the ancient world, Agesander, worked at Rhodes around this time, though as with Homer there is some debate among the scholars as to whether or not he was a single individual or several. But certainly the most visible symbol of the city’s worldly success and cultural relevance was its enormous statue of the sun god Helios, commonly known as the Colossus of Rhodes. It was about as large as the Statue of Liberty and was so impressive that the Greek poet Antipater of Sidon listed it among his seven wonders of the ancient world. The statue came about after Antigonus Monophthalmus staged a siege of Rhodes which failed, just as his siege of Perinthos failed where he had lost his eye all those years before. To celebrate their victory, the Rhodesians took all the siege equipment that had been left behind by the Macedonians and sold it and used the money to fund a gigantic statue to their patron god. The statue lasted about 50 years, but in 226 BC, so about 30 years before Hipparchus’s birth, Rhodes was hit by an earthquake and according to the author Strabo, the statue broke at the knees and fell to its side. As a gesture of goodwill, Ptolemy III in Egypt offered to pay for its reconstruction, but Strabo writes that, “in accordance with a certain oracle, the people did not raise it again.” So by the time of Hipparchus’s birth and throughout his life, the great Colossus of Rhodes would have been broken and lying on its side, where it would remain until the 7th century AD, at which point the ruins were sold off for scrap metal by Islamic invaders. But enough with the sights of the city where Hipparchus worked, let’s turn to something about Hipparchus that we actually do have some real knowledge of — his science. Now I think we are quite fortunate to know as much about Hipparchus’s work as we do because although he wrote a great deal, at least 14 works, only one of them survives directly. You may recall from back in Episode 16 that Eudoxus had written two works, the Mirror and the Phaenomena and later on a poet by the name of Aratus had written a poetic rendition of t"
