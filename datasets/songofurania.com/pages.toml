full_description = "Episode 2: The Stars over Babylon February 28, 2021 What are the earliest records of constellations? How did the ancient Babylonians keep track of their progress through the year? And how do we know what we know about Babylonia? Transcript Good evening, and welcome to The Song of Urania, a podcast about the history of astronomy with new episodes every full moon. My name is Joe Antognini. Tonight we will be embarking on our journey through the history of astronomy and starting with the earliest civilization that left detailed written astronomical records — the ancient Babylonians. But before we start describing exactly what the ancient Babylonians discovered, and how, we should start by taking a more general look at the attitude of the ancient peoples towards the heavens. Because the ancient peoples looked at the heavens differently than we moderners do today. The main difference is — they actually looked. Almost every person listening to this today, is living in a city that is incomprehensibly larger than the cities of the ancient world. Even a modest town by the standards of the twenty-first century world would be at least an order of magnitude larger than the largest metropolises four thousand years ago. And it is not simply the population that is important. Today’s cities differ from their ancient forbears in the quantity and quality of their illumination. Around the early nineteenth century, cities began illuminating streets during the night for the safety of their citizens. With the invention of the automobile, nighttime illumination became an even more pressing issue of safety and good government. Today anyone who has traveled by plane knows that you are getting close to landing at night when you start to see more and more lights out the window. We can viscerally see the lack of development in North Korea relative to its southern neighbor just by looking at satellite photographs of the two countries at night. But these city lights don’t simply illuminate the streets below them. They reflect up off of the streets and then scatter in the atmosphere. This illuminates not only the street, but the sky above it, and washes out the stars. In a twenty-first century city it is possible to see some stars, but not many. In a way, this is more unfortunate than losing the stars altogether. If we couldn’t see any stars at all, we would at least know that we had lost something. But because we can see a few stars, we don’t realize how much richer the sky is without the ambient light from the city. Well it was not so in the ancient world. Without the profusion of artificial light, the nighttime sky was far richer even in the center of the world’s largest cities than most moderners realize. We moderners must make a concerted effort to view the sky as it was seen by our ancient forbears. We must travel hundreds of miles away from the nearest outpost of civilization to escape the illuminated skies we’ve created for ourselves. And even then, hundreds of miles away from the nearest city, its glow can usually still be seen on the horizon. But most of us moderners have never gotten this far from civilization and have never seen what a really dark sky looks like with our own eyes. And even those of us who have gone camping or otherwise escaped to the wilderness and seen with our own eyes the richness of the truly dark sky are missing something. Because those of us who see it when we are camping, only see it when we are camping. What is qualitatively different about the ancient world is that the richest, darkest sky we have ever seen, is what the sky always looked like for everyone, every night of their lives. When we see the shapes of the constellations and think that they don’t look anything like what they’re supposed to and you’d need to have a pretty good imagination to think that that cluster of stars looks like a dog or a lion, what we fail to understand is that the ancients didn’t see that group of stars every once in a while, when they could escape from it all. They saw those stars every night from birth to death. It takes some effort for us moderners to recognize the constellations, but to any of our ancient forbears, knowing the sky intimately was the most natural thing in the world. How early did humanity recognize the stars of the sky? We can only imagine it dates back to the very dawn of humanity, tens of thousands of years ago. But unfortunately we have little conclusive evidence for much of anything about the way of life of early humanity, nevertheless the astronomy of the earliest peoples. Which is a shame really, because some 90% of all people ever to have lived, lived during this prehistoric period, so it would be nice to know more about them than we do. But as they did not leave much evidence for us to go off of, it’s hard to rigorously conclude much about them. In a future episode we will spend some time doing some discussion, mostly speculative, about the astronomy of prehistoric peoples. But for the time being we will stay on more solid ground. So we have to imagine that the forbears of the ancient Babylonians had created constellations and associated myths with those constellations. Just as has every culture that has walked this Earth as far as we know. And we can actually find some circumstantial evidence for constellations going quite far back — possibly as far as 20 or 30 thousand years in the past. But the further we go back, the sketchier the evidence gets. So we will start a little bit later than that, sometime after writing had been developed in Mesopotamia, with an inscription in a temple constructed by King Gudea, sometime around 2130 BC. This inscription describes King Gudea’s inspiration for building the temple. It reads, quote: “My shepherd,” said the goddess, “I shall read for you your dream. The man whose stature filled sky and earth, whose crown proclaimed him a god, and whose side was the Imdugud bird; storm at his feet, and to right and left two lions, was the god, my brother, Ningirsu. His command to you was to build his temple Eninnu. Now, the sun that rose from the earth before you was your guardian god, Ningizzida: like a sun, his serpent form rises from the earth. The woman holding a stylus and tablet of constellations, rapt as it were in thought , was the goddess, my sister Nisaba, showing to you the auspicious star for your building of the temple. The second man, a warrior, with lapis lazuli tablet, was the god Nin-dub, designing for you the temple’s structure. And the ass, laden, at the right of the king: that was yourself, ready for your task. The description of this auspicious star tells us that the heavens were of astrological importance right back to the very first records we have of the stars. But even more interestingly, the description of the woman holding a tablet of constellations, seems to suggest that a fixed set of constellations had been developed in Mesopotamia by this point. An important source of evidence comes from cylinder seals. We have, from later records during the Neo-Assyrian Empire, more than a thousand years later, around 900 to 600 BC, much more detailed descriptions of the constellations of this region from a variety of textual sources. But in addition to those sources, we have cylinder seals from that era which depict the constellations described in these other documents. Cylinder seals are small cylinders, usually around an inch or so high, with engraved images around its side. The cylinder could then be rolled onto a surface of wet clay to imprint an image. Cylinder seals were used for a variety of purposes, artistic and religious, but were also an early form of signature. By the time of the Neo-Assyrian Empire, there is abundant evidence that the gods were associated with various celestial objects, particularly the planets. From these associations we can start to match certain figures seen on cylinder seals to the corresponding celestial object. Some of these are fairly obvious — a lunar crescent represents the Moon, seven dots represent the Pleiades. A less obvious symbol — but one which other documents make clear — is the goddess Inanna-Ishtar for the planet Venus and a lion for the Sun. In some cylinder seals, Inanna-Ishtar is depicted seated on a throne with a lion on a leash, representing the observed fact that Venus is never far from the Sun. One might suspect that this is reading into the symbolism a little too much, but some of these seals are really quite replete with astronomical symbolism. Not only is Inanna-Ishtar pictured with a lion, the Sun, but a lunar crescent as well, along with the god Adad standing on a bull, Taurus, and a creature half-man-half-scorpion, representing the constellation Scorpius. Other seals contain a second lion next to a pair of objects, sometimes date palms, which represents the constellation Leo next to the constellation Gemini. (Sticklers may object that this skips over the constellation Cancer, but Cancer is a much fainter constellation and was likely identified later once astronomy had developed enough to recognize the importance of the zodiac.) The interesting thing about these cylinders, is that although the written corroborations of these astronomical interpretations are more recent, cylinder seals with very similar symbolism go back much further, before we have any real written records of the specific nature of the constellations. So it is plausible that by 2000 BC, the Babylonians had identified a set of constellations, many of which are similar to constellations we identify today. Now, of course, we must always remain open to the possibility that the stars identified with these constellations changed over this period of a thousand years. We don’t exactly know what constellations the Babylonians of 2000 BC had identified, we only have some evidence that they had identified some constellations. But it is certainly plausible that the constellations remained fairly static over this time period. The eye is naturally drawn to certain groupings of stars on the sky. We see that cultures across the globe have independently associated the same groups of stars together into constellations. The Big Dipper, Taurus, Scorpius, and other constellations have been variously recognized as distinct constellations by cultures as far flung as the ancient Babylonians, the Javanese, and Hawaiians. In some cases, disparate cultures have even independently associated those constellations with the same mythic creature. The ancient Greeks identified Orion as a great hunter, as did the Seri of northwest Mexico. Moreover, the motion of the Moon naturally enhances the importance of other groups of stars. The Moon changes its position on the sky over the course of a month, but it doesn’t just move randomly around the sky. Its motions are constrained to lie within a fairly narrow band of constellations on the sky. In fact, it doesn’t take too much observation to realize that this is true of all the planets and the Sun, to boot. No matter where they move, they all appear against the background of this narrow band of constellations. Today we call this band of constellations the zodiac, meaning “the circle of the little animals”, the reason being that most of these constellations are animals. Historically, for reasons we’ll go into in a future episode, the zodiac contained twelve constellations, but today, strictly speaking, a thirteenth constellation, Ophiuchus, actually overlaps with the zodiac as well. But even prior to the systematization of the zodiac, the ancient Babylonians recognized the regular path of the Moon across a certain set of stars. Since a month is approximately 28 days, they identified 28 small groupings of stars, approximately equally spaced across the Moon’s path, that they could use to trace the Moon’s progression through the month. This way, in addition to simply counting the days since the last new moon, ancient Babylonian astronomers could determine which grouping the Moon was closest to to figure out how far into the month they were. This is much more accurate than trying to estimate by eye how close to full the Moon is. These groupings of stars are variously known as “moon stations”, “moon houses”, or “moon mansions”. And it is not clear that these moon stations were originally developed by the ancient Babylonians. The concept of moon stations was also present in Indian and Chinese astronomy, and these three cultures identified almost exactly the same moon stations as each other. It’s unknown whether one of these cultures developed it first and the concept spread from there to the others, or if they identified the moon stations independently and happened to come up with the same groupings. After all, they were all looking at the same Moon and observing the same stars. Now, if you have looked at the sky with some attention, and of course you would have if you were living in the ancient world, you would have noticed that in addition to the motion of the Moon, the sky itself slowly changes over the course of a year. The constellations that are visible to you change from season to season. Someone in the northern hemisphere, say around the city of Babylon, who looked straight up after a sunset in the early summer, would be looking at the modern constellation of Bootes, the herdsman. But by early fall, Bootes would no longer be straight above, but low on the western horizon. Instead straight above you would be Cygnus, the Swan. By early winter, Bootes would no longer be visible at all. By the time spring came around, Bootes would now start to be visible low on the eastern horizon shortly before sunrise. Ancient peoples were well aware of this gradual, annual change of the constellations. And they would look at specific stars and use them to keep track of the seasons. At one point during the year, a star would be observed directly overhead right after sunset. Over the course of the night it would then sink towards the west around midnight. But with each passing day, right after sunset, it would be seen to be slightly lower towards the western horizon. It would then be visible for a slightly shorter period of time. After several months, it would only be briefly visible low on the western horizon shortly after sunset before following the Sun below the horizon. Then it would disappear entirely for some time, usually several months. Eventually, it would be briefly visible on the eastern horizon, just before sunrise until the Sun rose along with it and washed it out in the sky. As more time passed, the star would rise earlier and earlier in the morning until it was once again overhead at sunset, completing the annual cycle. The day of the year on which the star was first visible after the months-long period of having disappeared from the night sky was of crucial importance to the ancient peoples. It was so important that we give this event its own name: the heliacal rising. By looking for the heliacal risings of various star"
