title = "The Song of Urania Podcast"
description = "After the Median invasion, the Ionian philosopher Xenophanes, a student of the Anaximander, was forced to flee to Elea in Magna Graecia and brought the philosophy of the Ionians to the Eleans. His student, Parmenides, then founded the Eleatic School which was skeptical of the senses, and argued that despite its appearance to the contrary, the Earth was round. Parmenides's student, Zeno, in turn developed his famous paradoxes to prove his teacher's assertion that motion was an illusion."
full_description = "Episode 12: The Eleatic School & the Way of Truthiness December 20, 2021 After the Median invasion, the Ionian philosopher Xenophanes, a student of the Anaximander, was forced to flee to Elea in Magna Graecia and brought the philosophy of the Ionians to the Eleans. His student, Parmenides, then founded the Eleatic School which was skeptical of the senses, and argued that despite its appearance to the contrary, the Earth was round. Parmenides's student, Zeno, in turn developed his famous paradoxes to prove his teacher's assertion that motion was an illusion. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Before we begin I wanted to mention that if any of you dear listeners are going to be at the winter meeting of the American Astronomical Society coming up in January 2022 in Salt Lake City, you can hear me live, although I will not be talking much about the history of astronomy. I will be on a panel during the NSF Astronomy and Astrophysics Postdoctoral Fellowship session to provide what advice I can about getting a permanent job inside or outside astronomy. As I have never had a permanent job inside astronomy, my advice will mostly be focused on getting a permanent job outside astronomy, specifically in tech, machine learning, data science, that sort of thing. If that is something you would enjoy, I hope you will attend. I suspect we will all learn something. Well, on to the show. Our last episode on Pythagoras and the Pythagoreans, or as Aristotle called them, the so-called Pythagoreans was a little divergent from the overall chronological narrative I’ve been developing as we’ve learned about the astronomy of ancient Greece. Pythagoras himself was contemporaneous with some of the philosophers of the Ionian School, in particular Anaximenes, who came after Anaximander and before Heraclitus. But the Pythagorean School persisted for several centuries, and thanks to the secrecy of the school, it is very difficult to determine when exactly different ideas came about. So most of our knowledge of the astronomy of the Pythagorean school comes to us through an author named Philolaus, who was active about a century after Pythagoras. So now we are going to have to turn back the clock somewhat and revisit Greek philosophy around the time of Pythagoras once again. The episode on the Pythagoreans was also something of a digression from the main thread of Greek astronomy because the Pythagoreans really did stand apart from the other Greek philosophical schools. They were, as I tried to emphasize, highly secretive, and in many ways almost cult-like relative to other philosophical schools of the day. Of course, ancient philosophy was very different than modern-day philosophy in that there was a much stronger emphasis on how to live properly — what constituted a good life, well lived? Many modern philosophers regard this as being more the domain of self-help books than serious philosophy which is interested more in thorny questions about the nature of consciousness, language, ethics, and so forth. So, while we don’t see many contemporary philosophers providing their students with extensive instructions as to how they ought to live their lives, the ancient philosophers felt no such compunction. Nevertheless, even relative to that standard, the Pythagoreans certainly took it to another level. But in this episode we will turn towards a school that was more in line with the typical philosophical schools of ancient Greece, the Eleatic School, so named because its two most notable members, Parmenides and Zeno, were both from the town of Elea in southern Italy, or, as it was known at the time, Magna Graecia. Now, as with the Ionian School, the name “the Eleatic School” was not a formal kind of school and is just a label that historians of philosophy have slapped on after the fact to try to group together some philosophers from a similar part of the world who were interested in similar questions. By contrast the Academy of Plato and the Lyceum of Aristotle developed into more formal institutions whose purpose was to provide a forum for philosophical discourse, both by lectures from senior members, and dialogues between members. But we are not there yet. At this point in Greek intellectual life, philosophy was a more informal affair, with philosophers attracting a group of students who would learn what they could at the feet of the master. Now, I mentioned that the two most well known of the Eleatics were Parmenides and Zeno. But we will start with another philosopher who is closely associated with the Eleatics and had a pronounced influence on them, but is not always included in the group — this is a philosopher by the name of Xenophanes. Xenophanes was almost exactly contemporaneous with Pythagoras, both were born around 570 BC, but Xenophanes lived about a decade longer than Pythagoras, dying around the age of 90, sometime between 480 and 475 BC. Xenophanes forms the point of connection between the earlier Ionian School and the later Eleatic School. Xenophanes was born in the city of Colophon in Ionia, which was just a little bit north of Miletus, just a few days travel. Like Miletus, Colophon was a wealthy town, and in those days was considered the literary capital of Ionia. In his youth he seems to have moved to Miletus and become a student of the great astronomer Anaximander, whom we talked about in Episode 9 on the Ionian School. But Anaximander died when Xenophanes was 24 years old, and the following year, 545 BC, was the year of the Median invasion of Ionia and Xenophanes was forced to flee his home and he never returned. Heraclitus writes that from that point on, the next 67 years “tossed his care-worn soul up and down the land of Hellas.” Herodotus has an account of the Median invasion and the subsequent migration that it precipitated. The invasion was led by the Median general Harpagus. Now, Harpagus played a crucial role in the fall of the Median empire and the rise of the Persian empire. Now, you may remember a few episodes back to the Battle of the Eclipse, in which there was a total solar eclipse, supposedly predicted by Thales, that occurred during a battle between the Medians and the Lydians. These hostilities had been brought about because the Scythians had killed a Median boy and fed him to the Median king Cyaxares. Well, a little bit after this battle, Cyaxares died and was succeeded by his son, King Astyages. Herodotus then tells a story about King Astyages that is somewhat reminiscent of the tale of Perseus’s birth. According to the story, King Astyages dreams that his daughter will bear a son who will destroy his empire. Naturally, after his daughter bears a son, Cyrus, who later becomes known to history as Cyrus the Great, which maybe foreshadows where this story will go, King Astyages orders his top general, Harpagus, to kill the child. But Harpagus recognized that the child was royalty, and did not wish to bring the wrath of the gods upon himself by killing a royal child, so he disobeyed his orders and found a shepherd whose wife had just given birth to a stillborn child. So he swapped the infant Cyrus with the stillborn child and presented the shepherd’s stillborn child to King Astyages to prove that he had killed Cyrus, and in reality Cyrus was raised by the shepherd. Now, Herodotus does not make clear how exactly this happens, but ten years later, the boy Cyrus was playing king of the hill, apparently just as much a game in the ancient world as it is today, and was discovered, somehow, to be the grandson of the king. When King Astyages learns of this, he, naturally, is not pleased. To punish Harpagus for disobeying his orders he prepares a banquet for Harpagus, kills Harpagus’s son, and then serves the son as the main course of the feast. So this is the second time that a cannibal feast shows up in the ancient Greek history of Media. And, in fact, these are not the only ones, yet another cannibal feast shows up in the myth of Thyestes. So, given these parallels, these details from Herodotus, who after all, was as much interested in spinning a good yarn as capturing accurate history, might be taken with a grain of salt. Well, in this particular story, the general Harpagus collects the remains of his son from the plates to be buried. King Astyages then has the question of what he should do about his still-living grandson Cyrus. So he consults his magi who tell him that because the child was discovered while playing king of the hill, he had already fulfilled the prophecy by becoming a king, so the child was now of no threat. Harpagus, as you might imagine, is none too thrilled with King Astyages after he killed his son and cooked him for a feast. So while he remains in the court, he secretly starts to plot against the king, turning the favor of nobles against him and building his relationship with Cyrus. When Cyrus is old enough, Harpagus sends a message to Cyrus in the belly of a rabbit to encourage him to revolt against the king. Cyrus builds an army and attacks King Astyages, so King Astyages commands Harpagus to fend off the attack and destroy the upstart’s army. But in the battlefield, Harpagus defects, and orders his soldiers to join with the soldiers of Cyrus and kill the king. From this betrayal, the Median Empire fell, fulfilling the prophecy, and the first Persian Empire, or the Achaemenid Empire, began. As you might recall, I discussed some of the later exploits of Cyrus at some length. After his conquest of the Median Empire he later conquered the Neo-Babylonian Empire and is generally very favorably received in the Hebrew Bible because after the destruction of the Neo-Babylonian Empire he restores the Israelites to their land, ending the Babylonian Exile. But, as this long-winded story concerns the Greek philosopher Xenophanes, after Cyrus had defeated his grandfather and destroyed the Median Empire, but before he conquered the Neo-Babylonian Empire, he continued to push west into the Lydian empire, which he also conquered. Now, Lydia was just east of Ionia, basically encompassing the western part of modern day Turkey, whereas Ionia lay just along the western coast and some of the nearby islands. So naturally after conquering Lydia, Cyrus continued to push right to the coast into Ionia and attacked the city of Phocaea, which was very close to Colophon, Xenophanes’s native city. The city of Phocaea was well defended, but did not have the resources to fight back against the enormous armies of Cyrus the Great, so the city was put under siege. Nevertheless, Phocaea was on the coast and Cyrus had no control over the seas. So the inhabitants of the city vowed to abandon the city and flee west. They traveled in some 60 boats to the island of Chios a few miles off the coast and beseeched the inhabitants to allow them to purchase one of their uninhabited islands. The inhabitants of Chios refused, however, so after a time the Phocaeans returned to their city. But by this point Cyrus had already plundered the city and moved on, leaving only a small garrison which the Phocaeans were able to destroy. But here there was division among the people. Although they had sworn an oath to stay together as a people, almost half of them preferred to stay in their home city, but the other half felt that they were on borrowed time, and it was only a matter of time before Cyrus returned to conquer their city once again. So, based on an omen, half of the residents sailed west to the island of Corsica, and then, after treating their neighbors poorly, departed again for Magna Graecia where they founded the city of Elea. So it may well have been the case that through this migration, Xenophanes traveled from Ionia to Elea. In fact, when recounting this story about the exile of the Phocaeans, Herodotus may have had Xenophanes in mind. At any rate, the main consequence of this event was that, although it permanently exiled Xenophanes, it ultimately brought the Ionian philosophical tradition to the inhabitants of Elea, which later developed into the Eleatic School. While this might be some small consolation for Xenophanes, it was clear that he missed his native land. Towards the end of his life, at the age of 92, Xenophanes penned a poem, a fragment of which has survived: Sixty-seven years it is now that the burden of life I am dragging to and fro through the regions of Greece. Counting the years from the day of my birth, I was then twenty-five — If I still correctly remember This is the stuff one best talks about by the fire in winter, Comfortably inclined, sipping sweet wine and nibbling some nuts: ‘Tell me, who are you, my friend, and where do you come from? How old are you, my dear, and what was your age At the time of the Median invasion? Well, as for the philosophy itself that Xenophanes brought to Elea, this, too, he wrote in verse. Some of it has survived, but only in fragments. His principal interests are what we today might call theology and epistemology. He is interested in the nature of the god — and, to be clear, he is interested in the nature of god, singular — and he is interested in the nature of knowledge. What does man know, how does man know it, what can man hope to know? The theology of Xenophanes is really quite radical for its time and place. It sounds almost like it could have been written by the prophet Jeremiah. Xenophanes completely breaks from the polytheistic tradition of ancient Greece. Like any educated Greek he was intimately familiar with the poems and the implicit theology of the bards Hesiod and Homer. But he rejects this picture of divinity. After all, the gods and goddesses of the Greek pantheon are remarkably human. They are adulterers, they harbor jealousies, steal, and lie. The only reason they’re not killing each other is because they are immortal. Xenophanes attempted to bring an element of rationality into the religion of his day, but found that he could not reconcile any sort of rationality with the myths of ancient Greece, and as such they had to be rejected. Instead he argued that the gods and goddesses depicted by Hesiod and Homer were simply tales about humans who had superhuman powers. He writes The Aethiopians say that their gods are flat-nosed and black While the Thracians say that theirs have blue eyes and red hair. Yet if cattle or horses or lions had hands and could draw And could sculpt like men, then the horses would draw their gods Like horses, and cattle like cattle, and each would then shape Bodies of gods in the likeness, each kind, of its own. To Xenophanes, the divine had to transcend all this, and to him the only way this could happen was if there was a single true, omnipotent God without form that encompassed all things. He writes: One God alone among gods and alone among men is the greatest. Neither in mind nor in body does he "
