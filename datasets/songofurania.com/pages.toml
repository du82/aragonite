title = "The Song of Urania Podcast"
description = "We turn the clock back to the astronomy of the Paleolithic and Neolithic.  Clues about humanity's interest in the heavens during the Paleolithic can be seen in linguistic, mythological, and archaeological evidence.  In the Neolithic, groups of people constructed tens of thousands of megaliths across Europe, many of which had astronomical connections."
full_description = "Episode 28: The Stars in Stone April 6, 2023 We turn the clock back to the astronomy of the Paleolithic and Neolithic. Clues about humanity's interest in the heavens during the Paleolithic can be seen in linguistic, mythological, and archaeological evidence. In the Neolithic, groups of people constructed tens of thousands of megaliths across Europe, many of which had astronomical connections. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well, as you can perhaps gather from the title of this month’s episode, I am afraid that I have once more bamboozled the poor listeners of this podcast. Despite my promise from the end of last episode, this episode will not be about Egyptian astronomy. As I was researching it, I found that most of the book length treatments are fairly old at this point, going back to the 50s and 60s. However, one of the leading experts on Egyptian astronomy, Juan Antonio Belmonte has a new book coming out on Egyptian astronomy at the beginning of May. So I figured it would be worth postponing my episode on Egyptian astronomy for a few months to wait for his book to come out so I can use the latest research and so that you, dear listeners, can get the most up-to-date story. So what will I be talking about instead? This month I wanted to talk about the oldest astronomy we are aware of, the astronomy of the Paleolithic and Neolithic. But before we really get into it I want to take a step back and give you a high level outline of where I’m planning on going over the course of this podcast. So far we’ve looked at the astronomy of the cultures of the ancient near east and Mediterranean: the Babylonians, the Greeks, and the Romans. And as I mentioned, we’ll get to the Egyptians in due time. But what I would like to do next is cover the rest of the ancient world. My plan is to very loosely follow expansion of mankind out of Africa. So after learning about Paleolithic and Neolithic astronomy in this episode, we’ll then look at the astronomy of sub-Saharan Africa, followed by the astronomy of India, then the astronomy of China and east Asia. Then we’ll move south to the astronomy of southeast Asia, followed by the astronomy of Oceania. After that we’ll cross the Bering strait and look at the astronomy of the pre-Colombian Americas, in particular the Mayans, whose astronomy was one of the most sophisticated of all the ancient cultures. And by now, of course, wise listeners of this podcast should know to take any grand plans that I lay out with a grain of salt. So we’ll see what actually happens. But that’s the plan for now. In terms of chronology, these episodes will flit back and forth across the centuries much more than we may have become accustomed to. In my treatment of Greek astronomy we were able to go roughly chronologically from the Archaic period starting around the 8th century BC up to Ptolemy in the Roman period in the 3rd century AD. But across the globe different cultures flourished at different times, so we’ll be ranging from the prehistory of 100 thousand years ago to the 16th century AD and on occasion somewhat beyond. One other caveat I should mention is that while I would like to devote as much time to each one of these cultures as I did to Greek astronomy, it may not be possible in most cases. I may be able to come closer for some than others. But unfortunately whether or not a culture developed writing makes a tremendous difference in the amount of surviving material available to discuss. We saw that even with the Greeks, who left behind a tremendous written record, we had to do a lot of speculation and cross correlation to make up for the huge number of missing texts. When studying cultures that left no written record at all, our understanding necessarily becomes much, much more speculative. Once we’ve worked our way around the globe, we’ll pick up the thread to modern astronomy once more by transitioning from the end of antiquity to the early middle ages with the rise of Islam in Arabia in the 8th century. From there on, our focus will be largely Western, at least until we get to the 20th century, when cultural contacts between the West and the rest of the globe deepen to the point that the forefront of astronomical research becomes a global rather than a purely Western project. Needless to say, this whole affair should keep us all occupied for the next few years to come. Okay, with that broad overview of where I want to take the podcast, let’s get back to the topic of this episode. This month I want to explore the very earliest evidence we have for mankind’s interest in the heavens during the Paleolithic era, and then we’ll see how later on in the Neolithic this interest was articulated with the megalithic structures that dot western Europe. Now before we get into any of the concrete evidence we have for early humanity’s interest in astronomy, it’s worth outlining how we know what we know about it, as little and speculative as it is. Prehistoric peoples are exceptionally difficult to study because by definition they lack writing, so they never just told us all about themselves in the same way that the ancient Greeks, or Egyptians, or Chinese, or Mayans did. But there are other ways that ancient cultures leave a record that we can learn from. The most direct means is from archaeology. This can be in the form of the impressive monuments that some cultures built like the pyramids of Egypt or Stonehenge in Britain. But smaller, more quotidian artifacts like pottery, arrowheads, axes, and so forth are an extremely valuable record. By looking at how artifacts with similar styles spread across continents we can trace how groups of people migrated over the millennia and where they settled. Another means by which we can trace the movements of people is through genetic analysis since the relics of these movements persist in our genes right down to this day. Most people throughout history never really moved more than a few dozen miles from where they were born, and this is still true today, though the majority is somewhat smaller than it was centuries ago. Since genetic patterns drift at a rate that can be fairly well determined, by comparing the genetic similarity of two populations you can figure out when the two populations diverged from each other. The genes of modern day people act as a kind of living fossil of their earlier migration histories. These kinds of genetic studies show, for instance, that modern Europeans are largely a mixture of three waves of people: Western Hunter-Gatherers, who were originally present in Europe at the end of the Ice Age around 10,000 BC; a group called the Early European Farmers, who originated in Anatolia around 20,000 years ago and then spread into Europe between 10,000 and 4000 BC; and a third group called the Western Steppe Herders who probably originated in the area around modern day Ukraine, southwest Russia, and Armenia and who rapidly spread across Eurasia between 3000 and 1000 BC, reaching as far as western Europe, Persia, India, and central Asia. In addition to archaeology and genetic studies, there is yet another, older way to trace population movements. In the same way that we inherit genes from our parents with some number of mutations, we also generally inherit our parents’ language, and will change it very slightly. By comparing the languages of neighboring groups, historical linguists can also trace migration patterns. Languages don’t evolve totally randomly. Linguistic change tends to follow certain patterns. Certain pairs of phonemes are more likely to be substituted for each other, some phonemes in particular clusters are likely to be dropped over time. A shift in the sound of one vowel has a predictable effect on the sounds of other vowels. And these forces of random drift act more strongly on some parts of language than others. We are liable to change rarer words more quickly than more frequently used words. A small set of words that are very fundamental to the human experience change only very slowly. Words like “mother,” “tree,” or “bird,” maintain similarities across centuries, if not millennia. The word for “mother” in Punjabi, which is very distantly related to English, but is in the same language family, is “māṁ.” Just as our genes are a kind of living fossil we store in our bodies of earlier migration patterns, the languages we speak are a kind of fossil we store in our minds. In fact, the first evidence for the migration of the Western Steppe Herders from Europe to India came long before Gregor Mendel founded the study of genetics in the mid 19th century. Philologists in the early 19th century noticed linguistic commonalities across European, Iranian, and Indian languages and hypothesized that these hundreds of languages must have derived from some common language. Today, we call this language Proto-Indo-European, and associate it with the language of the Western Steppe Herders. Historically, people have tended to treat linguistic evidence of population movements a bit suspiciously. It’s always been a kind of ugly stepchild next to genetic studies, which is the gold standard. Historical linguistics tends not to have same level of rigorous mathematical modeling that genetic studies do. You just sort of imagine a linguistics department being a long corridor of offices with a professor in each one going “ga ga ga, ta ta ta, la la la” to themselves all day long and then writing up a paper on how Hungarians originated from western Siberia and split from that group in the 4th millennium BC. Being married to a linguist, I can tell you that, while I’m being slightly facetious, this conception is not too far off the mark. But nevertheless, linguistic methods seem to work. Most of the major population migrations were initially proposed from linguistic evidence and only later confirmed through genetic studies. It’s from linguistic evidence in the Proto-Indo-European language that we can see some of the early interest in astronomy of the Western Steppe Herders. I mentioned in an earlier episode that in English the word “month” is etymologically connected to the word “moon,” and “menstruation.” But this connection is not unique to English. It appears generally throughout the Indo-European language family. This suggests that the identification of a time period associated with the cycle of the Moon, and a connection between the length of this cycle and the menstrual cycle goes all the way back to the Western Steppe Herders of the Neolithic Era. In other words, Neolithic people were observing the heavens and connecting what they saw above to what they experienced on the Earth. There’s a yet more abstract way that cultural memories persist through the centuries, and this is through folklore and mythology. In the same way that linguists have systematically categorized the sounds of languages and studied how phonemes tend to drift, ethnographers have collected and categorized folk tales across different peoples and measured their similarities. Here we are yet another step away from mathematical rigor, but there is nevertheless very compelling evidence that, like language, folktales tend not to change very quickly. One folktale, really more a family of similar folktales, called the Smith and the Devil, has variants across the Indo-European languages, and has been traced back to be at least 6000 years old. Well, one of the richest sources of mythology is, of course, the heavens. In the Western canon the myths associated with the constellations all derive from Greek culture, but every culture has mythological stories associated with the heavens. This on its own is highly notable. Human cultures vary wildly across the globe, so much so that any kind of cross-cultural universals are rather rare and must tell us something that is more fundamental about humanity. So, taking an interest in the heavens appears to be a universal of the human condition. And there is some very intriguing evidence that this interest goes back very far back into humanity’s past. One of the most remarkable features on the sky is the Pleiades star cluster. The Pleiades is an open star cluster somewhat close to the celestial equator, so it is visible to every people on the planet and being visually impressive, virtually every culture has a myth associated with this object. In Western astronomy, this myth is Greek in origin and tells of how there were seven sisters, born from the god Atlas. After Atlas was condemned to carry the vault of heaven on his shoulders, these catch the eye of Orion. Being unprotected by their father, Orion pursues them and they ultimately commit suicide, whereupon Zeus placed them in the heavens. But later on, one of the seven, Electra, became so distressed after seeing the destruction of Troy, she let down her hair in mourning and became invisible, or in other tellings, a comet that then fell from the sky. Among several Aboriginal groups in Australia there is a similar story. The Wirangu people of southwest Australia identify Orion as a hunter named Tgilby. Tgilby falls in love with seven sisters and chases them. Among the Cheyenne in North America, the daughter of a chief was visited by a strange man, who turned out to be a dog in human form. She later gave birth to seven puppies who were placed into the heavens. Across the globe, these stories have a common feature. A large majority of them identify the stars with seven things — seven sisters, seven puppies, seven boys, seven chickens and so forth. But there is a problem. If you go outside and actually count the Pleiades, there are only six of them. The cluster itself has many more stars, of course, but you can only see six with your naked eye. So why do most cultures have a myth in which there are seven Pleiades? What is especially intriguing is that many cultures have a story in which there were originally seven, but one of them got lost along the way somehow, like in the Greek myth with Electra. Another example comes from the Cherokee who say that there were once seven boys who only wanted to play and would not do their chores. One day they were running around in a circle and they spun around so fast that they all rose up into the sky. But as they were rising, one of the boys was too slow and fell back down to the Earth. Now, as it happens today there are two bright stars in the Pleiades which are very close together, so we cannot distinguish them by eye. By eye, they appear to be one star. But stars all have random motions, called proper motions, and if you reverse the motions of the stars in the Pleiades you find that about 100,000 years in the past these two stars were far enough apart to be distinguished and people would have counted seven stars in the Pleiades. If this is the real origin of the preponderance of myths in which the Pleiades is identified"
