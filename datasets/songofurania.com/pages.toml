description = "We turn to the astronomy of Mesoamerica, with a particular focus on the Maya and Aztec. The central feature of their astronomy was a pair of interlocking calendars which regulated all aspects of life. The surviving Maya manuscripts also deal extensively with the motion of Venus, which may also have driven decisions to go to war. We also look at the famous Aztec Sun Stone, the 2012 phenomenon, and the fall of the Itzá Kingdom.  NOTE: The Song of Urania will be going on hiatus and will return on the first full moon of 2026."
full_description = "Episode 47: Clock Around the Rock November 2, 2024 We turn to the astronomy of Mesoamerica, with a particular focus on the Maya and Aztec. The central feature of their astronomy was a pair of interlocking calendars which regulated all aspects of life. The surviving Maya manuscripts also deal extensively with the motion of Venus, which may also have driven decisions to go to war. We also look at the famous Aztec Sun Stone, the 2012 phenomenon, and the fall of the Itzá Kingdom. NOTE: The Song of Urania will be going on hiatus and will return on the first full moon of 2026. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon, usually. Last month we learned how the Polynesians used astronomy to voyage across the Pacific. This month we will cross the Pacific ourselves and spend some time with one of the great astronomical civilizations the ancient world has produced: the civilizations of Mesoamerica, particularly the Maya and the Aztec. But, as we’ll see, although the civilizations of this region are often reduced to the Maya and the Aztec, there was a large family of similar cultures that inhabited Mesoamerica over the millennia. But, as always, we will start with the geography. In modern terms, the area we’ll be focusing on in this episode is today occupied by central Mexico through northern Guatemala. If you start from northern Mexico and go south, the country starts to narrow like a funnel and bend towards the east. After you have passed by Mexico City in central Mexico the country continues to narrow and at some point has bent entirely to the east. It then narrows to a region called the Isthmus of Tehuantepec where the Gulf of Mexico to the north is separated from the Pacific Ocean to the south by only 137 miles. As you move further east the land widens again, mostly due to a large peninsula that juts out northeast into the Gulf of Mexico, called the Yucatán peninsula. The entire region of Mesoamerica sits within the tropics, but the Isthmus of Tehuantepec forms one of the main geographical divisions. To the west and north of the isthmus the geography is characterized by highlands and tends to be arid, especially the further north and west you go. To the east of the isthmus the geography is characterized by lowlands and very dense jungle. Now, ordinarily when I talk about the geography that a culture inhabited, it’s with an eye toward explaining how the geography influenced the astronomy. But in Mesoamerica it’s a rare case where it also works the other way around. Astronomy influenced the geography. Sixty-six million years ago an enormous asteroid ten kilometers in diameter impacted the Earth right off the coast of what is now the Yucatán peninsula. This impact, of course, had major consequences for life on Earth. This event is the leading theory as to why the dinosaurs died out, which then made space for mammals to evolve into more ecological niches, and eventually, for humans to evolve and start doing astronomy. But more relevant specifically to the astronomy of Mesoamerica, this asteroid impact created a very large crater. And, in fact, most Maya archaeological sites sit on top of this crater. The asteroid impact seems to have created a large sedimentary basin, which then led to the creation of aquifers. Sources of water in Mesoamerica are otherwise rather scarce, especially in the north, so the creation of these large aquifers probably facilitated human settlement of the region. Well, the timeline of the original human settlement of Mesoamerica is not especially well understood. At some point in millennia past humans crossed over from eastern Siberia into what is now Alaska. You may recall from Episode 45 on Aboriginal Australian astronomy that the settlement of Australia was facilitated by the Last Glacial Maximum, or more colloquially, the Last Ice Age. During this period sea levels were around 110 meters lower than they are today. You may not be surprised to learn then that this period also facilitated human migration into the Americas. Instead of Siberia and Alaska being separated by the Bering Strait, they formed a continuous landmass called Beringia. Now, although we more or less know when these two continents were connected, unfortunately the timeline of human migration into the Americas is notoriously uncertain. There’s good evidence that there was a large scale migration into the Americas around 16,000 years ago. But there is also some evidence, along with a lot of arguments as to how seriously it should be believed, that there may have also been an even earlier wave of settlement 30,000 to 40,000 years ago. Either way, these new populations began to expand into the Americas. Here, again, though, there’s a lot of uncertainty as to how this migration proceeded. One theory is that these populations first moved south along the Pacific coast and only later began to migrate inland. But the theory is difficult to test because with the lower sea levels, the shoreline was much further to the west than it is today, and any archaeological sites they would have left would now be under about 100 meters of water. However it happened, the later wave of migration (or only, depending on your preferred theory) very quickly expanded throughout North and South America. Within around two to three thousand years these populations had expanded from Alaska to the southernmost tip of Chile. This might sound like they were practically sprinting across two continents, and in some sense they really were, but it works out to be an average migration rate of just a couple of miles per year. At any rate, by about 14,000 years ago Mesoamerica had become populated. Whether it was settled much earlier than that is not known. And whether the original settlers were the ancestors of the Maya or whether the ancestors of the Maya displaced an earlier group is also not known. For many millennia the peoples of Mesoamerica were hunter gatherers, but between 8000 and 2000 BC agriculture began to develop in the region with corn being the principal grain. This corn, incidentally, was originally nothing like the big, fat cobs of corn that we’re used to today. The original plant produced only a single ear of corn that was maybe a few inches long and about as wide as your pinky finger. Only after many centuries of selective breeding did the plant start to resemble what we think of today when we think of corn. Well, Maya civilization proper really shows up around 1200 BC. Now, for convenience, we talk about “Maya civilization,” and “Mesoamerican culture,” but it wasn’t a monolithic thing. It’s similar in many ways to the idea of Mesopotamian culture. Mesopotamian culture was made up of a variety of cultures and states who all shared cultural and linguistic patterns. Likewise there were dozens of states that made up Maya civilization, and over the centuries some of these waxed in power and then waned. And likewise there were cultures that were a part of Mesoamerica more broadly and shared many cultural traits with the Maya, but didn’t speak Mayan languages. Again, these other Mesoamerican civilizations variously waxed and waned in power over the centuries with the Aztec becoming the most powerful by the time that the Spanish arrived in the early 1500s. Now, interestingly, although there were huge commonalities across the various Mesoamerican cultures in terms of language, writing, religion, and even sport, there did not seem to be any self-conception that they formed a unique culture the way that, say, the Greeks did. The Greeks also had dozens of independent city states, and various dialects of the Greek language, but they all recognized that they formed a cohesive culture that spoke one unique language. Despite their mutual rivalries, the Greeks nevertheless divided the world into the Greeks who spoke Greek, and the barbarians who spoke anything else. But there was no similar kind of recognition of the similarities of their cultures among the Mesoamericans. In this way they were again more like the Mesopotamians, who, despite a great deal of cultural similarities with each other, also never really subscribed to the idea that they belonged to some common Mesopotamian identity. In the case of the Mesoamericans this can probably be explained by the fact that they had no barbarians around, so to speak. Until the arrival of the Spanish, they just had each other, so the ways that they behaved were just the ways that humans behaved. They was no need for some special Mesoamerican identity to unify them. Well, around 1200 BC the first true Mesoamerican civilization emerges, called the Olmec, near the northern point of the Isthmus of Tehuantepec. The Olmec are considered to be the mother culture of Mesoamerica, because many of the common features of Mesoamerican civilizations first appear among them, from the agricultural crops to the artistic styles to the religion, and, importantly for us, the calendar. As agriculture became more sophisticated, we start to see the transition from villages ruled by isolated chiefs, to kings, who can exercise much more power over a much larger number of people. With the emergence of kings you start to see the concentration of wealth, and the kings could then use they wealth they accumulated to commission grand monuments and artworks to extol their grandeur. It’s in this earliest ceremonial artwork that we see the first hints of Mesoamerican astronomy where the art draws a connection between cosmological symbols and political power. In this way, early Mesoamerican art resembles the Hawaiian creation myth of the Kumulipo that I talked about in the last episode, where the story legitimizes the king’s rule by delineating his genealogy, from recent ancestors in living memory back through mythic heroes of yore, and then further back to the gods who created the universe. Well, some four or five hundred years after the earliest artifacts from the Olmec appear, writing develops in the region, at around 800 to 700 BC. This is quite a remarkable thing since it’s generally believed that writing independently developed only four times in humanity’s history: once among the Babylonians, once again among the Egyptians, once among the Chinese, and once here among the Olmec in Mesoamerica. It’s kind of interesting to note, too, that although these writing systems all began with pictographic symbols, they evolved into quite distinctive styles. Although the Egyptians and Mesoamericans both used hieroglyphs you’d never confuse one for the other. The Maya glyphs are written in a characteristic rectangle with rounded corners. At any rate, to continue our brief overview of the pre-Columbian history of Mesoamerica, it’s a few centuries after writing develops that the Zapotec civilization emerges southwest of the Olmec in the Valley of Oaxaca. The Zapotecs were a relatively militaristic culture and many of their relief carvings depict their military victories and the various ways in which they would torture their captives. Now, the Zapotec civilization actually survived all the way until the arrival of Hernán Cortés, but it came to be eclipsed by other Mesoamerican civilizations after a few centuries, between 100 BC and 200 AD. By the 1100 AD or so it underwent a political decay and ultimately ended up getting folded into the Aztec empire. And this kind of story is fairly common in the region. One of the features of Mesoamerican history is that there really isn’t much in the way of a single empire that arises and conquers everyone else in the region, at least until you get to the Aztec. Instead you have kingdoms in various corners of the region that at various times grow in power, maybe expand somewhat and conquer some of their neighbors, shift the center of gravity of cultural development, but then over time become less powerful and shrink. The first period of Maya civilization, called the preclassic period has this happen with the Olmec and then the Zapotec. But from 200 AD until 900 we enter into the Classic period of Maya civilization. During this period many more kingdoms wax and wane across the region. The most important of these was in many ways the most mysterious, a city-state called Teotihuacan. Teotihuacan was located just to the northeast of modern day Mexico City, so it was actually a fair ways away from the Olmec in the cradle of Mesoamerican civilization at the Isthmus of Tehuantepec. Teotihuacan emerges around 100 BC and underwent some three centuries of construction. The city that its people built was simply massive. From its founding until 600 AD it was the largest city in all of the Americas, and towards the end of this period it was among the largest cities in the entire world with a population of around 200,000. Teotihuacan was evidently highly organized. The whole city was built on a regular grid of streets and there was a main avenue about a mile long which ended in two massive pyramids, today called the Pyramids of the Sun and the Moon. At the time they were constructed these pyramids were one of the largest structures in the world. In addition to just being an impressive city on its own terms, Teotihuacan also seems to have been hugely important to Mesoamerica more broadly. It had a large trade network across the entire region and seems to have culturally influenced the rest of Mesoamerica. But despite its importance really very little is known at all about Teotihuacan. We don’t even really know the basics like who its rulers were, what its social structure looked like, or even what language they spoke. I mentioned that the two massive pyramids they constructed are today called the Pyramids of the Sun and Moon, but they’re just called that because we don’t know what they were originally called. Teotihuacan seems to have made some excursions to the east to try to conquer the Maya in the 4th and 5th centuries, but these invasions went poorly. By 500–600 AD Teotihuacan went into decline. It seems this happened the same way that Hemingway described going broke, first gradually, then suddenly. Towards the end the city was essentially abandoned, and its residents scattered across Mesoamerica. Centuries later the area was occupied by the Aztec who, rather like medieval Romans or Greeks, were somewhat in awe of this great ancient civilization whose ruins they occupied. Given how little we know about Teotihuacan at its peak it will perhaps be no surprise to you that we also don’t really know what caused its collapse. Over to the east on the Yucatán peninsula, the Maya also saw something of a golden age during the Classic period. There were various shifts in regional power centers over the years, but the period from 200 to 800 AD sees a huge amount of ceremonial monuments and art built. This Maya golden age lasted a little while longer than Teotihuacan did, but it, too, eventually saw a collapse in the 9th century. It’s "
