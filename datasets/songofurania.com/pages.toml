title = "The Song of Urania Podcast"
description = "Two philosophers, Leucippus and Democritus, attempted to synthesize the monist theories of the earlier natural philosophers with the pluralist theories of Empedocles and Anaxagoras.  To do this, they proposed a revolutionary idea — that all matter is made of atoms."
full_description = "Episode 14: The Atomic Philosophers February 16, 2022 Two philosophers, Leucippus and Democritus, attempted to synthesize the monist theories of the earlier natural philosophers with the pluralist theories of Empedocles and Anaxagoras. To do this, they proposed a revolutionary idea — that all matter is made of atoms. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. Over the past half year we have been getting to know the various ancient Greek natural philosophers who are rather scandalously lumped together as the pre-Socratics, and now we are very close to rounding them all out. But in the overall arc of the development of this natural philosophy, we had a real shocker in the last episode. Up until Empedocles and Anaxagoras, the natural philosophers all operated under the broad framework of monism. That is, they believed that, despite appearances to the contrary, all matter was fundamentally the same, or at least had its origin in the same thing. This overall framework then naturally presented to philosophers of the age two fundamental problems which needed to be solved: Firstly, what is that substance. And secondly, how does that substance produce the matter we see in the universe. Because we do see that things are not all the same. There are a lot of different kinds of matter, there’s air, there’s water, there’s rock and metal and fire. How does a single substance manifest itself in such a way that it becomes all the diversity of matter in the universe? But after the efforts of a succession of the most brilliant natural philosophers of the day, from Thales, who you’ll recall was so famous that plebeians were graffitiing his name in public lavatories centuries later, to Pythagoras, who generated a cultlike following that persisted for centuries, to Zeno, whose paradoxes are still discussed to this day, it seems that after all of the efforts of these brilliant philosophers, no one was any closer to definitively answering either of these questions. Each philosopher had his own unique preference for what the fundamental substance was, and none of the explanations were very convincing for how that substance produced the manifold diversity of matter we see around us. By the time we arrive at the Eleatic School, we see that Parmenides has taken monism to its logical conclusion. All things are, indeed, one and anything that says anything to the contrary, like, for example, your senses, is deceiving you. But in the last episode, this paradigm of monism was completely upended by two philosophers: Empedocles, who broke from monism in a seemingly tentative way by saying that there were four fundamental elements: earth, fire, water, and air, but conceptually was a huge break from monism. And then Anaxagoras who broke from monism in a more quantitatively substantial way by arguing that there were myriads of fundamental elements, and that every bit of matter contained all of them, just in different proportions. Now, some listeners may be a little bit disgruntled that I have been spending so much time over the past several episodes on this monism-pluralism distinction. After all, this just concerns the nature of matter, and isn’t that just plain old physics? This is nominally a podcast about the history of astronomy. What do these ideas about the nature of matter have to do with astronomy? With apologies to Tertullian, we might ask, “What has Miletus to do with Greenwich?” Well, I would like to ensure that all my listeners are fully gruntled. To take this question on its face, of course one of the central problems of astronomy is that of cosmogony — we see the heavens above us, the stars, sun, moon, and planets. How did they all come to be? What are they made of? Are they made of the same things as we have on Earth? All these are astronomical questions and need an answer to the question of what the fundamental nature of matter is. If all things are of a single substance, when the universe was formed, how did a multiplicity of substances come to be? How did the Sun and the Moon come to be and be different from the Earth? But to take this question of why I’ve been spending so much time on the monism/pluralism distinction at a somewhat deeper level, you may recall all the way back to the first episode when I tried to outline some of my goals in this podcast. One of these was to take the astronomers of history holistically and on their own terms, and not try to pick out bits and pieces of their philosophy that happen to neatly fall into our modern categories of astronomy. The people of this era who had the most to say about astronomy were the natural philosophers we’ve been talking about and they were intensely interested in the fundamental nature of matter, so it is something we ought to consider carefully when talking about them. And we should do this is not just out of a sense of a sort of intellectual respect, but these sorts of philosophical ideas in many ways motivated the approach they took to answering astronomical questions. And not just the approach they took to answering those questions, but these philosophical foundations were what determined what questions they thought to ask. This idea of monism is a good example of what the philosopher of science Thomas Kuhn called a scientific paradigm. It was a sort of background assumption that pervaded and directed the work of the scientists of the time. In this case, the more or less unstated assumption was that there should be only a single kind of substance that makes up all matter, and this naturally led the great philosophers of the day to those two all-important questions: what was that substance, and how did it produce the great variety of things that we see. Because they were working within a monist paradigm it was essentially guaranteed that these philosophers would spend most of their energies answering these two questions. But, in Kuhn’s theory of scientific inquiry, as scientists continue working within a paradigm, they accumulate results which are in tension with each other, and eventually it becomes apparent that they are in tension with the paradigm itself. Then a breaking point arrives and at some point the paradigm itself has to be discarded and a new one established. We can see how the development of Greek natural philosophy from monism to pluralism fits rather neatly into this pattern. Over time, various philosophers had argued in favor of different elements as being the arche, the fundamental substance, and they had made arguments for their own view. But they could not all be right. If Thales was correct that the arche was water, then necessarily anyone who said it was anything else was wrong. And that was, after all, everyone else. So no matter how persuasive their reasoning was, they could not all be right. And in its limit, Parmenides along with his student Zeno had made a very compelling argument that not only were all things were one, but that this implied that motion was impossible. The paradigm of monism had reached a breaking point and new philosophers had to step in and propose another paradigm. Now, the way I’ve told this story to you is rather pat, and I doubt that any of the philosophers involved in this story was thinking about monism or paradigms in quite these terms. And really this kind of story doesn’t fit exactly into Kuhn’s structure of science because in Kuhn’s conception, the tension that develops within a scientific paradigm has more to do with observations or experiments whose results conflict with theory or at any rate are very difficult to explain within the existing paradigm. But at this stage of Greek natural philosophy, at any rate, there is very little in the way of observation or experimentation. I had mentioned two episodes ago how Xenophanes had pointed to the existence of fossils of seashells up in mountains as evidence that water must have covered the Earth at one point. But the reason I had mentioned it was because that it was the exception and not the rule. The only real observation that was in tension with the monist paradigm was just the simple fact that there are different kinds of things in the world. Nevertheless, that one observation was enough to cause all sorts of trouble for monism. Well, the point of all this is that I have been spending quite a lot of time on the monism/pluralism distinction because these paradigms informed how the natural philosophers approached their astronomy. Any monist theory of the world had to explain how the variety of matter in the world came about from the one fundamental substance, and that meant that they had to develop a theory of how the entire universe began, both the earth and the heavens. This then meant that they had to say something about what the heavens were made of. Today, of course, we naturally think that astronomy should say something about what the stars are made of. But that is just because it is a question that naturally fits into the modern paradigm of astrophysics. Depending on your paradigm it is not necessarily an obvious question to ask. As far as we know the Babylonians were never interested in that question despite being intensely interested in astronomy. Later on in the early modern period to the early 1800s we see occasional speculation about the nature of stars, but not a lot of debate about the question relative to other scientific questions of the age. It’s always important to understand the philosophical underpinnings of an era, because those ideas, even though they may be largely tacit, are what direct the efforts of the scientists of the age. Okay, so we have seen how monism had some fundamental difficulties and led to a reaction by Empedocles and Anaxagoras in which they abandoned monism and proposed pluralism instead — there was no single fundamental substance, but instead several fundamental substances. But this viewpoint also had difficulties which two subsequent philosophers identified and tried to resolve with a new way of explaining matter. These two philosophers were Leucippus and Democritus. Now, Democritus is certainly the more famous of the two. But at least in the ancient sources, the two of them are almost inseparable. It seems that by the time the sources start to survive it had been long enough that the authors were no longer able to distinguish between the contributions of Leucippus and Democritus. It is very rare that one is mentioned without the other. Nevertheless, as classicists are wont to do, from these few occasions they try to glean what differences they can between the two philosophers. The general conclusion from these kinds of readings is that Leucippus probably had the original idea for atomic theory and Democritus, as his student, enthusiastically took the theory up and expanded upon it. Well, despite the fact that Leucippus and Democritus are nearly always lumped together, in this podcast I will take them one at a time. But do take heed that there is a fair amount of conjecture when saying that this or that idea is due exclusively to one or the other. Now, of the two, Leucippus was almost certainly the older one, but that’s really all we can say for sure about his biographical details. Even still at this stage of Greek history, just entering the Classical Era, our knowledge of births and deaths can still be pretty spotty. For Leucippus, in particular, we have very little idea as to when he was born. We just know that he was active during the 5th century BC. He was contemporaneous with Anaxagoras, so may have been born roughly at the beginning of the 5th century BC. He was most likely born in Miletus, which of course was still the intellectual capital of Greece around the time of his birth. Or maybe he wasn’t born there. Maybe he was instead born in the city of Abdera in Thrace, which for those of you less familiar with Greek geography is on the coast at the northernmost part of the Aegean Sea, right where Greece sort of hooks over next to modern day Turkey. Or maybe he was born all the way over in Italy in Elea. Or maybe he was not born anywhere. Epicurus claims that Leucippus never even existed at all. But this may have just been due to some professional jealousy. At any rate, other writers like Aristotle and Theophrastus are quite definite that Leucippus was the originator of atomic theory. Based on the patchy and sometimes contradictory statements in the ancient literature about Leucippus’s life perhaps the most plausible reconstruction of his life was that he may have been born a little after 500 BC in Miletus. Now, you’ll remember from the last episode that during the early 5th century BC Miletus was a tumultuous time to be politically. The Greeks were expelling the Persians from the land during the Greco-Persian Wars, and by the 470s, the Greeks, or, more properly, an alliance of Greek city-states led by Athens, were driving the Persians out from Ionia. So by the middle of the 5th century BC, Miletus was an independent Greek city-state once again. Sort of. Over the course of the 5th century after their victory in the Greco-Persian Wars, Athens came to grow into a place of hegemony in the region. And so while Miletus was nominally independent, it was heavily influenced by Athens at the time. In 451 or 450 BC, it seems that there was a revolt in Miletus and the oligarchs who ruled the city attempted to break free from Athenian control. But in 450, Athens sent a garrison to Miletus to replace the oligarchs with a democratic government. Now, in this particular instance Athens was not especially interested in making the world safe for democracy. They simply wanted to install a government that would be more amenable to their control, and naturally, this democratic government would be overseen by a commission of five Athenian rulers called archons. At any rate, it is conjectured that Leucippus may have emigrated from Miletus during the upheaval of 450 BC. He then may have travelled to Elea where he picked up the ideas of the Eleatics, and finally travelled to Abdera at the end of his life. Well, I am starting to feel somewhat unsettled with all this conjecture so let’s move to more solid ground. As for Leucippus’s philosophy itself, his central idea was the one that both he and Democritus were best known for both in his day and in our own: his theory of atoms, that all matter is composed of atoms, which, by definition are indivisible, “atom” literally meaning “uncuttable” in Greek. Thus matter cannot be divided indefinitely into smaller and smaller pieces. There are fundamental components that simply cannot be split. Now, with our modern perspective, we can see this as being a truly revolutionary idea. No less than Richard Feynman claimed that if all human knowledge were lost in a great catastrophe except for a single idea, the idea that would carry with it the most important founda"
