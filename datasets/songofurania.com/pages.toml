description = "In working on the problem of doubling the cube, Plato's friend Archytas devised an ingenious solution that involved a three dimensional curve determined by the intersection of a torus with a cylinder. Archytas's student Eudoxus then seems to have been inspired by this solution to develop the first serious model of planetary motions in ancient Greece, his theory of homocentric spheres."
full_description = "Episode 16: The Homocentric Spheres of Eudoxus April 18, 2022 In working on the problem of doubling the cube, Plato's friend Archytas devised an ingenious solution that involved a three dimensional curve determined by the intersection of a torus with a cylinder. Archytas's student Eudoxus then seems to have been inspired by this solution to develop the first serious model of planetary motions in ancient Greece, his theory of homocentric spheres. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. We left off last month on yet another cliffhanger. Plato, after disparaging the use of grubby data for astronomy in his earlier works, had, by the end of his life, seemed to recognize the importance of developing a model for the planetary motions. This may have been partly for quasi-theological reasons. Recall that the Athenian Stranger in the Laws had argued that the word “planet” was blasphemous, because its literal meaning, “wanderer”, implied that the gods were just moving about willy-nilly on the sky. In Plato’s philosophy, such arbitrariness was anathema. Plato felt that these motions had to have some deeper logic behind them, even if this logic eluded the casual observer. Now, Plato’s model of the Solar System could explain some of these motions. He could explain the daily rising and setting of the stars and planets, and, by placing the planets on additional spheres with a much slower rotation in the opposite direction from the stars, he could explain their slow eastward drift relative to the background stars. But Plato seems to have recognized that his model was fairly limited. His spheres rotated at a constant speed, so he could not explain the fact that their motion was not observed to be constant. Even worse, sometimes the planets appeared to stop their usual west-to-east drift relative to the background stars and go backwards, in what is called retrograde motion. So Plato knew that there had to be more to the story and called upon his students to see if anyone would rise to the challenge of explaining the planetary motions. And one of them did — a man by the name of Eudoxus. So that’s the cliffhanger we left off on from last episode, but I’m afraid you’re going to get another bait and switch at this point, because before we can talk about Eudoxus we need to talk about another philosopher who taught Eudoxus — the philosopher Archytas. Now, if you’ve been paying close attention, you may actually recognize the name Archytas because I briefly mentioned him in last month’s episode on Plato. He was the fellow who generously bought Plato out of slavery when things went pear shaped for him over in Syracuse. But Archytas was really one of the more remarkable figures in ancient Greece and deserves a more thorough treatment than just being the guy who bailed out Plato, not least for his influence on Eudoxus. Archytas was contemporaneous with Plato, so probably born around 435 BC, though possibly as much as 25 years later. Archytas was born over in Magna Graecia in the city of Tarentum, which is today known as Taranto in southern Italy. At the time, Tarentum was one of the most important cities in Magna Graecia. It had been founded centuries earlier as a Spartan colony and had an excellent natural port, so it became a crucial commercial hub for trade between Magna Graecia and the rest of Greece. However, we hear from two sources, Herodotus and Aristotle, that in 473 BC, about 50 years before Archytas was born, the Tarantines were routed in a battle with the Iapygian tribes to the north. The two had been neighbors for centuries and had been enemies the entire time, periodically skirmishing. As befitted a thalassocratic civilization like Greece, the Greeks in the area basically only controlled narrow strips of land along the coast. If you imagine Italy as a boot, Tarentum basically sits right where the inner part of the heel of the boot comes up and attaches to the sole, nestled in that corner. The heel itself is called the Salentine peninsula, or Salento today, and was prime real estate. Naturally the Greeks attempted to expand from Tarentum down into this peninsula and ran into the Iapygians as they did so. At any rate, their centuries old conflict erupted once again in 473 BC during the Battle of Kailia. I mention this because Herodotus notes that this was the “greatest slaughter of Greeks ever known.” Apparently nearly the entire aristocracy of Tarentum was wiped out in this one battle. This ended up having dramatic political implications, because while there had been a popular movement to establish democracy for some time, the democrats could never achieve much success. Tarentum was, after all, a Spartan colony, and the Spartans had always been suspicious of democracy. But with the aristocracy all dead, the commoners could finally take control of the reins of power and establish democratic rule over the city. So by the time of Archytas, Tarentum had been a democracy for about 50 years. I go into all this detail about the broader political atmosphere of Archytas’s hometown because, rather unusually for a man of his intellectual stature, having made major contributions to geometry, mechanics, and philosophy, Archytas was also a prominent political figure in Tarentum. His role in the political life of Tarentum has been compared by many historians to be similar to that of Pericles in Athens. The two were both indispensable men for their respective city-states and played an outsized role in shaping their city-states in their images. In Archytas’s case, we have records that he was elected to the position of strategos, which was essentially the commander-in-chief, seven years in a row. Not only was his seven year command apparently unprecedented, it was unconstitutional as well. The law of Tarentum forbade any man from holding the office of strategos two years in a row, so the Tarentines had have held Archytas in extremely high regard to willingly depart from this prohibition six times in a row. Beyond this, it seems that later on he had acquired even more power for himself and become an autokrator. As this is where we derive the modern word autocrat, you might correctly surmise that it involves a single individual holding quite a lot of power. In ancient Greece an autokrator would not merely command the military, but also be entrusted with the general power to engage in war and diplomacy without needing to consult the assembly. An autokrator did not have unlimited power, and it was generally understood that he would need to get the approval of the assembly after the fact, in contrast to the more powerful role of dictator who could more or less do what he wanted for a specified period of time, usually a year. Nevertheless, all this is to say that Archytas was a big man. In fact, given that Plato not only knew Archytas but was friends with him, it has been speculated that Plato’s fixation on the idea of the philosopher-king may have been inspired by Archytas’s own life. Here was the ideal philosopher-king in the flesh, a man who could make advances in geometry and use the wisdom gained thereof to rule his state justly. Plato seems to have met Archytas during his travels around the Mediterranean in his 40s after the death of Socrates. During this time Plato had been exposed to the Pythagoreanism that was present throughout Magna Graecia and generally liked what he saw. Archytas was typically classified by later writers as a Pythagorean himself, but because we don’t know a great deal about his philosophy, we don’t really have much independent evidence that he was a true Pythagorean. It also seems to be the case that later authors in antiquity just assumed that any philosopher from Italy was a Pythagorean. Well, we don’t know much more about his life, but it is speculated that Archytas died in a shipwreck. The only evidence for this, however, is somewhat oblique. In Horace’s Odes, the poet writes: The sea, the earth, the innumerable sand, Archytas, thou couldst measure; now, alas! A little dust on Matine shore has spann’d That soaring spirit; vain it was to pass The gates of heaven, and send thy soul in quest O’er air’s wide realms; for thou hadst yet to die. The poem in full describes a sailor coming upon the shipwrecked body of Archytas on the shore of Matine and three times sprinkling sand on the corpse to fulfill the requirement that the body be buried, for without a proper burial, a soul would be condemned to wander the Earth for a hundred years before being permitted to enter Hades. But, this is a poem written by a poet some three centuries later and it is not obvious that it is based on a literal event in the philosopher Archytas’s life. But it does speak to his stature in the ancient world that a Roman poet would feature him in one of his odes centuries later. Well, during his remarkable life Archytas wrote some works, but we don’t actually know how many. To further impress on you his status in the ancient world, the main problem we have with Archytas is that too many works are attributed to him, and almost all of them are spurious. Today there are only four fragments that are generally regarded as authentic, though, as always in the classics, you can make a name for yourself by disputing the received wisdom and arguing that this or that work is, in fact, counterfeit. Two of the fragments come from a work called Harmonics which dealt with the geometric theory of proportions and apparently an application of this theory to acoustics. Another comes from a work called On Sciences. The fragment we have is somewhat more philosophical in character and muses on the value of mathematics and the sciences and tries to determine the role they should play in a just society. The last fragment comes from a work called the Discourses and argues that logic is the superior form of mathematics. Now, again, as a reminder from the last episode, the word “logic” in this context is not the logic we think of today, but something closer to arithmetic. Really I should have used the more literal translation “logistic” to distinguish the two, but it is too late for the last episode so we’re just going to be stuck with it now. His rationale for this argument was that there were certain proofs which could be made using logistic or numbers more broadly, which could not be made with geometry. But overall it is rather difficult to assess the strength of this argument for the plain reason that much of it just doesn’t survive. When he says that logistic is the highest of the sciences, we unfortunately don’t know what exactly he meant by that. Mostly we have to turn to Plato’s writings and assume that Plato is using the term in the same way that Archytas was. The general premise of the argument, though, that the philosopher should consider the various forms of knowledge and determine which of them is highest, has some similarities to the passage in Plato’s Republic that we talked about in the last episode. And in fact, Plato may have been inspired to write that passage in response to Archytas and to demonstrate that the highest form of knowledge was not logistic, but astronomy. And the overall set of fields of knowledge that Archytas identified in his argument here: logistic or arithmetic, geometry, astronomy, and music, were by the Middle Ages codified as the “Quadrivium,” the fields of knowledge that any man would need to master before he could begin to study the highest forms of knowledge: philosophy and theology. Well, as I have alluded to, in addition to his public accomplishments, in the intellectual life, Archytas was renowned principally for his advancements in mechanics and geometry. He was apparently the first Greek philosopher to make a serious attempt at formulating a theory of optics and mechanics, but unfortunately, what exactly he did in these fields has not survived. But his achievements in geometry have survived, or at least enough of them have to justify his reputation as a great geometer. He seems to have been largely responsible for the results in Book VIII of Euclid’s Elements. These deal with the theory of proportions. For example, from Proposition 22, we have that if three numbers are in continued proportion and the first is a square, then the third will be a square as well. So, as an example, if we start with the number 9, which is a perfect square, and then we double it, we get 18, and then if we double that again, we get 36, which is again, indeed, a perfect square. Perhaps his greatest mathematical triumph, though, was the so-called Delian problem. The Delian problem goes like this. Suppose I give you a cube. How can you construct another cube that has twice the volume of the cube I have given you. The name comes from a little tale about how the inhabitants of the island of Delos, who were suffering from a plague and went to the Oracle of Delphi. Evidently the Oracle pitied them because unlike the usual cryptic responses, the response given by the Oracle in this case was apparently rather straightforward. The Oracle told them that the problem was that their altar was too small and needed to be twice as large. If they built this new altar, the plague would go away. Now, the altar was a large stone cube, so the first idea the Delians had was to construct a second cube identical to the first and then just stack the second on top of the first or next to it. But this was clearly no good as no matter which place they put it the plague did not go away. Evidently they needed to maintain the cubic shape. So on their second try, they constructed a stone cube whose sides were twice the length of the original. But the plague persisted and so they realized that this solution was no good because even though the sides were twice as long, the volume was eight times as much. Clearly the Oracle was looking for a cube with twice the volume. At this, the Delians were stumped. They did not know how to construct a cube that was twice the volume of the original and went to Plato for help, who posed the problem to Archytas among others and gave it the name the “Delian problem.” Well, much later, in the 19th century AD, the French mathematician Pierre Wantzel proved that this problem is, in fact, impossible to solve using the traditional tools of geometry, the straightedge and the compass, that had been codified by our old friend Oenopides. Incidentally Wantzel in the same paper also proved the impossibility of solving another ancient problem in geometry that had bedeviled mathematicians for centuries: that of trisecting an angle. And he published these results at the age of 23, which is fortunate because he died a mere ten years later at the age of 33. The last classic open problem from geometry, how to construct a square with the same area as a given circle, was not proved impossible for another 45 years. So the "
