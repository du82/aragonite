description = "We start to explore the relationship between the heavens and the Earth in Ancient China, along with the role of astronomers. One of the most important concepts in Chinese political thought to emerge from this was the Mandate of Heaven. Finally, we look at the oldest record of Chinese astronomy, the story of the astronomers Xi and Ho."
full_description = "Episode 37: The Mandate of Heaven January 1, 2024 We start to explore the relationship between the heavens and the Earth in Ancient China, along with the role of astronomers. One of the most important concepts in Chinese political thought to emerge from this was the Mandate of Heaven. Finally, we look at the oldest record of Chinese astronomy, the story of the astronomers Xi and Ho. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well last month we wrapped up our tour of the astronomy of ancient India and this month, as promised, we will cross the Himalayas and begin our journey of the astronomy of ancient China. And, as with the other civilizations we have looked at, I think it is best to start by looking at the structure of the land before the people arrived. I’ve generally been following this pattern with the other civilizations we’ve looked at, but I think China is somewhat unusual in this regard. In the case of many of the other ancient civilizations the geography really screams out the borders of the civilization and how it will influence the people who reside there. In Egypt, for instance, we have a narrow strip of fertile land along the Nile surrounded by desert. Naturally, Egyptian civilization dominated this strip of land. From time to time it extended out to the northeast into the Levant, but really its core was this one river valley. In the case of India, the subcontinent was hemmed in by the Himalayas and was really only somewhat accessible through the northwest. In both cases you could look at the geography and reasonably guess which cities would fall within the modern day boundaries of Egypt or India, and which would be outside. In the case of China it’s a little harder to infer from the geography of the region that the modern day borders would form a unified political entity. And, to be sure, particularly as you go to the west of the country, there are a substantial number of ethnic minorities. Over 90% of China is ethnically Han, but the Chinese government recognizes 55 minority ethnicities, among them the Tibetans, Uyghurs, Mongols, Manchu, and Kazakhs. Geographically, China has always been a little bit of a fuzzy concept, without really clear natural boundaries in the way that, say, India had. There are, of course, the Himalayas which provide a hard border to the southwest, but other than that the sphere of influence of Chinese civilization sort of petered out the further you got away from the heart of the country without there being any other real natural boundaries. The terrain is in general relatively hilly, particularly in the west of the country. In the southeast of the country the climate is more tropical and the terrain is dominated by dense jungle. All this meant that China was never really inaccessible from the south, but it was a difficult trek to make, and so contact tended to be limited. In particular, the difficulty of travel to the south and west meant that small convoys could make the occasional journey, which made trade and the exchange of ideas possible. But it was much harder for large migrations or invading armies to come from that direction. The north, however, was a different story. Again, the terrain is generally hilly, but there is a point of contact with the great steppes to the north. The Asian steppe, or really the Eurasian steppe, is a truly vast region of flat grassland that extends all the way from Hungary in the west, through Ukraine above the Black sea, north above the Caspian sea, then east across southern Siberia and Kazakhstan, and extending through Mongolia. This region has been populated since the paleolithic and is probably where the Indo-European language family originated out of, including, as we learned a few episodes back, the Aryans who ultimately settled in India. And, thanks to the vast, flat, grassy expanse, the region was well suited to a nomadic, pastoralist lifestyle. For China, the main consequence of its connection to the eastern steppe in its north was that over the centuries it suffered from episodic waves of invasions of nomadic warriors from this direction. The most significant of these were, of course, the invasions of Genghis Khan and Kublai Khan who managed to take control of the country and set up the Yuan dynasty at the end of the 13th century, but these kinds of invasions were a constant feature of Chinese history. Now, as with India, these invasions did not have a huge impact on Chinese culture more broadly since the invaders were nomadic pastoralists and were very few in number relative to the agricultural society they invaded. So when these invasions did occur, they tended to wipe out the top of the ruling class and establish themselves in power in their place. And over time, through intermarriage with local nobility and the gradual process of acculturation, they became assimilated into Chinese culture. But for those at the top it was a big threat and was what motivated the construction of the famous Great Wall since China has no natural border to its north. So, to the southwest there are the Himalayas, to the southeast is dense jungle, to the east, of course, is the Pacific ocean, the west was hilly and protected by several deserts, most notably the Gobi desert. And the north was unprotected from the Asian steppe. Within China itself, the main feature that spurred the development of agricultural civilization is three river systems, all of which ran largely west to east. The most important, particularly in early Chinese history, was along the Yellow River, which is the northernmost of the three. The mouth of the Yellow River runs through the Dongying, which is a relatively modest city by Chinese standards, with only 2 million people in it. But the much more import city of Beijing is within this river system, about 200 miles NNW of Dongying. To the south is the Yangtze river whose mouth runs through the city of Shanghai. And lastly the southernmost river system in the Xi river whose mouth is at Shenzhen and Hong Kong. Broadly speaking, political power coalesced first in the north and then diffused to the south throughout Chinese history. Now, I plan on saving a more methodical walk through the history of Chinese astronomy until the next episode. In this first episode I wanted to focus more on the earliest astronomy which is intermingled with myth and talk about some of the general characteristics of this ancient Chinese astronomy. But before we can get to this it would be helpful to have at least a coarse framework to talk about Chinese history, because it is truly vast. As with other civilizations that span millennia, historians need a way of breaking these large stretches of time into smaller, more manageable periods. So, very broadly, Chinese history is divided into four eras: the prehistoric era, which stretches from the first arrival of humans during the paleolithic until around 2000 BC. This is then followed by Ancient China, which develops around 2000 BC as agriculture has become the dominant mode of food production and large scale political organization emerges in the form of kingdoms. 221 BC then marks the transition from Ancient China to Imperial China when the Qin state conquered the five other rival states in China and unified China under a single political entity. This state of affairs lasted until 1912 AD when the Qing dynasty was overthrown and a republic was established in its place. This, then marks the transition to the final era in Chinese history, the modern era. So, there are these four broad eras, the prehistoric, ancient, Imperial, and Modern eras. Our focus, at least for the time being, will be on Ancient and Imperial China. But this is still a lot of time. Each of these eras spans around two millennia. So the next level of subdivision is to look at dynastic lines, which tended to last for a few centuries or so. Broadly speaking, Chinese history is characterized by a kind of cycle where a series of strong emperors consolidate and centralize power over a wide area, but as the centuries go by the imperial bureaucracy became more and more sclerotic, nobles in the hinterlands begin to assert their interests more forcefully, and the empire fragments and eventually a new claimant to the imperial throne replaces the old dynasty. A wonderfully poetic description of this cycle comes from the famous opening line of the Romance of the Three Kingdoms, written in the 14th century AD: “the empire, long divided, must unite; long united, must divide. Thus it has ever been.” The Ancient period traditionally has three dynasties, though the first of these, the Xia dynasty, may have been legendary since the first references to it appear much later in Chinese history. The first dynasty that has a definite historical record is the Shang dynasty which emerges around 1600 BC. The Shang dynasty lasted about five and a half centuries until it was supplanted by the Zhou dynasty in 1045 BC which lasts about seven and a half centuries. Now, today, it’s easy to just scan over a list of the names and dates of the various dynasties of ancient and Imperial China and just think, ho-hum, empires rise, empires fall, sic transit gloria mundi and so on. But in particular this first dynastic transition, at least the first one that we have records for, had an enormous impact on the way that the ancient Chinese conceptualized the state and its relationship to the broader cosmos. Never before in Chinese history had a hereditary ruler been deposed and replaced with an entirely new dynastic line. How could such a thing be justified? Now, right from the outset the general answer to this question had a definite correct answer, at least for any scholar who valued his head remaining attached to his body. Since the new guys were now in charge, you had to come up with some justification for why it was okay for them to have done what they did. But you had to be careful about your reasoning for this justification. After all, if it was legitimate for you as a plucky upstart to overthrow the old guard, what was to stop the next plucky upstart from overthrowing you? It couldn’t be too easy. It’s in this transition from the Shang to the Zhou dynasty that the concept of the Mandate of Heaven enters Chinese political thought. The idea was that the emperor’s right to rule was not granted solely by virtue of his birth. Ultimately his right to rule was granted by Heaven, and he ruled so as to keep the Earth in harmony with Heaven. So long as he ruled justly and maintained this harmony he remained the legitimate ruler. But if he ruled poorly and there was strife and injustice in the land, Heaven might revoke its mandate and invest it in a new claimant to the throne. How would you know that this new claimant indeed had the Mandate of Heaven? Well, if he was successful of course. If he managed to overthrow the old emperor and install himself on the throne, evidently he must have had the Mandate of Heaven. If his rebellion failed, then clearly he did not. Now this is an awfully convenient way for a new emperor to post facto claim that his rebellion was indeed justified, but when one dynasty replaced another the mythology would often go somewhat further to make Heaven’s approval of the new claimant more explicit. In the case of this first transition from the Shang to the Zhou dynasty, in the twilight of the Shang dynasty one of the vassal states was the kingdom of Zhou, which, at the time, was ruled by a man named King Wen. King Wen had noticed the decline in quality of the Shang emperors and spied an opportunity to break free from the yoke of the Shang emperor and possibly conquer the empire for himself. As he was plotting this rebellion he noticed two signs in the heavens in 1059 BC. The first was a rare conjunction of the five planets in the constellation of Cancer. A few months later, a comet appeared in the sky, now known to be Halley’s Comet. King Wen interpreted these signs as an indication that he had secured the favor of Heaven in his scheme to overthrow the emperor and install himself in its place. Now, although King Wen’s rebellions were generally successful, he himself died in battle before he was able to achieve complete victory, so it was his son, King Wu, who became the first emperor of the new Zhou dynasty. But this concept of the Mandate of Heaven that emerged in this dynastic transition was to play a central role in Chinese history as a check against the power of the emperor. And as we can see from the founding mythology of the Zhou dynasty, this idea had a very literal link to the heavens themselves, being revealed as an astronomical sign in the sky. Well, before I can talk more about the way that the ancient Chinese thought about astronomy during the Shang and Zhou dynasties, I have to say a little more about what ancient Chinese society looked like. Of course, in the very earliest periods when humans first arrived in the area, societies were likely fairly egalitarian as most hunter-gatherer societies are. But as people settled in the river valleys and turned toward a sedentary agricultural lifestyle their society became much more unequal. Relatively early on, certainly by the time of the transition from Paleolithic to Ancient China around 2000 BC, power had consolidated into a relatively small landowning nobility who controlled a vast mass of peasants who worked the land. This is usually characterized as a feudal society, though officially, Chinese communist histories go even further and assert that life in this period was really a “slavery society” and that true feudalism only started during the Imperial era since peasants during this time could be bought and sold. Either way, as in other feudal or slavery societies a different set of laws applied to the nobility and the peasants. Peasants, for instance, would be subject to corporeal punishment for various crimes whereas the nobility were not, unless the crime were sufficiently serious like some form of treason or rebellion. So, life in Ancient China was highly stratified. And like other such societies, say, Ancient Egypt as another example, it’s important to remember that what we know about their astronomy, and most of what we know about their culture more broadly, was really only the astronomy and culture of a very small elite. Basically nothing survives about the ways that the vast mass of peasants conceived of the heavens. Even practices like ancestor worship, which later on were broadly performed by the people as a whole, seem to have initially been confined only to the nobility in the earliest times. As with other societies that engaged in ancestor worship, again Ancient Egypt is a good parallel, it was probably believed early on that relatively few people had an afterlife at all. Only the great rulers survived into the afterlife and could be worshiped a"
