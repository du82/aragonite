description = "We delve into the contents of the Vedanga Jyotisha, the earliest Indian text to deal explicitly with astronomy. Then we turn to early Hindu cosmology and their explanations for various celestial phenomena, from the phases of the Moon to solar eclipses. Lastly, we briefly cover the unique cosmology of the Jains."
full_description = "Episode 35: The Vedanga Jyotisha & Beyond November 3, 2023 We delve into the contents of the Vedanga Jyotisha, the earliest Indian text to deal explicitly with astronomy. Then we turn to early Hindu cosmology and their explanations for various celestial phenomena, from the phases of the Moon to solar eclipses. Lastly, we briefly cover the unique cosmology of the Jains. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon, or thereabouts. My name is Joe Antognini. Well last month we went through some of the early history of India, the Harappan civilization, the Aryan invasion, and the subsequent rise of Hinduism in the region. Now, as I mentioned last month, Hinduism has a large body of sacred texts, but the most important are four texts known as the Vedas. The oldest of these, the Rigveda, actually contains a number of astronomical references and is therefore our primary window into the earliest astronomy of India after the Aryan invasion. But, of course, the Rigveda, and the other Vedas for that matter, are not the only texts to come out of early Indian civilization, even if they are among the earliest. I mentioned in the last episode that there are, in particular, a set of six texts called the Vedanga, which act as a kind of preparatory guide to the Vedas, each one teaching a different skill needed if you are to fully understand the Vedas. These six texts are collectively called the Vedanga, which literally translates to “the limbs of the Vedas.” I briefly listed the topics of the six Vedanga in the last episode, but they cover things like grammar, poetic meters, and the rubrics for performing the Vedic rituals. But for our purposes the most important of the six Vedanga is the last one, called the Jyotisha, since the topic of the Jyotisha is astronomy. The Jyotisha is believed to have been written sometime in the middle of the first millennium BC and is attributed to an author by the name of Lagadha. But as with many of the ancient Indian texts, this is probably only when the contents were codified and formally written down. The ideas presented in the text were probably developed far earlier by many different people over the course of generations. The Jyotisha makes some comments, for instance, on the positions of the solstices with respect to the ecliptic. Because the positions of the solstices gradually change due to the precession of the equinoxes, the positions implied in the Jyotisha can be used to roughly date when the techniques were originally developed, and this points to an origin maybe around 1200 BC, plus or minus maybe a century or two. So probably these techniques were in use for more than half a millennium before they were formally written down in the Jyotisha. One thing I should mention, too, is that when the Jyotisha was written down, it was written down in slightly different ways in different parts. There are two major recensions or versions of the text that exists and are associated with different Vedic schools. But at least in terms of the astronomical content they are fairly similar. Either way the Jyotisha forms the basis of Indian astronomy up until around the 3rd or 4th century AD, at which point a number of newer texts improve the state of the art. Now, as I mentioned earlier, the purpose of the Vedanga was to instruct the reader in how to properly understand the Vedas and carry out the rituals they prescribe. The reason that the reader had to learn astronomy in the Jyotisha was that astronomy formed the basis for understanding and marking the calendar, and the calendar, in turn, set the times to perform various rituals throughout the year. How could you perform the right rituals on the right days if you didn’t know what day it was? And the Jyotisha is quite explicit that that is its purpose. The opening line reads: Making obeisance with bent head to God Prajāpati, who is the supervisor of the 5-year yuga, and has day, season, half year and month as his limbs, I, being purified (śuci), shall describe systematically the correct movement of heavenly bodies, which is accepted by highest Brahmans, for the sake of the determination of the proper time of sacrifices. And if that were not clear enough, later on the text states: The Vedas are revealed for the purpose of performing sacrificial rites; these rites are laid down in order of time. Therefore, he who is versed in astronomy, the science of the reckoning of time, knows the sacrifices. So, given that this is its purpose it’s perhaps no surprise that the main focus of the Jyotisha’s astronomy is on how to keep the calendar. The overall system that the Jyotisha presents is based around a five year cycle called the “yuga.” They divided this period in a number of different ways. One way was the sidereal lunar year, which had either 12 or 13 lunar months of 27 days apiece. They also tracked the synodic lunar year, which consisted of 12 synodic lunar months, or periods from full moon to full moon. This synodic lunar year was 354 days long. Since the time from full moon to full moon is fairly close to 29 and a half days, a synodic lunar year would have six months of 29 days and six months of 30 days, so that on average the synodic month was 29 and a half days long. In one 5-year yuga, there would be 3 normal years of 12 lunar months, and 2 years of 13 lunar months interspersed between the other three. If that was not enough, there was lastly the savana, or civil year, which was similar to the year in the Egyptian calendar — it was 12 months, each of which had exactly 30 days, so it bore no relation to the position of the moon. Since this made for a year of 360 days, the calendar also requires the addition of a kind of leap year, called the pseudo-solsticial year, where every 3 years they would add 18 days to the savana year. This would bring the average length of the year to 366 days per year. Now, this is still a bit large. The year is close to 365 and a quarter days long, so the average length of the savana year was too long by 3/4 of a day. If that were all there was to it, there would be a problem, because a discrepancy of 3/4 of a day rapidly adds up. Over the course of 100 years, this would be a drift of 75 days, or about two and a half months. It seems that to address this problem there was also a system of intercalating with 21 days once every four years, which had the effect of producing an average year of 365 and a quarter days. But the main advantage of the savana year of 360 or 378 days was that on the normal cycle, one yuga consisting of five average years of 366 days was 1830 days long, and this corresponded to exactly 62 synodic lunar months and 67 sidereal lunar months. So this system was well synchronized between the lunar and solar cycles. Synchronization between the lunar and solar cycles was especially important in the Jyotisha because some of the rituals correspond to the solstices, and others correspond to the full and new moons, so the calendar had to be arranged in a way that these features would regularly line up on the calendar. Of the various kinds of years that the Jyotisha recognizes, the most important were the savana and the synodic lunar years because the schedules for most rituals were tied to your position in one of these two calendars. Well, the year itself was divided into two halves, called “ayanas,” a bright half corresponding to the half of the year from the winter to the summer solstice when the sun is moving northward and the days are getting longer, and a dark half corresponding to the time from the summer to the winter solstice when the sun is moving southward and the days are getting shorter. Each ayana is, in turn, divided into three seasons, making six seasons in all during the year. Like the year, the synodic month was also divided into two halves: sukla, the light half, from new moon to full moon, and krishna, the dark half, from full moon to new moon. Now, as I mentioned earlier, early Hindu astronomy kept track of several different kinds of months: the sidereal month, which is the time it takes the moon to return to the same background stars on the sky; synodic months, which is the time from full moon to full moon; and the savana month, which was a standard 30 days. But because there were sacrifices and rituals tied to full moon and new moon, the synodic month was the most important. Several days of the synodic month got their own names due to their connection to particular sacrifice. So we have “Kuhu,” which is New moon and “Raka,” which is full moon, but also “Sinivali,” which is the day before the new moon, and “Anumati,” which is the day before the full moon. One of the unique features of Indian astronomy is that there was no universal standard for what constituted the beginning of the month. There were instead two separate systems which were in use in different regions. One of these is called the “Amanta” system and begins the month at the new moon, and tended to dominate in the south. The other system is called the “Purnimanta” system and begins the new month at the full moon, and tended to dominate in the North, particularly in the Ganges river plain. Finally, there were the days. And as with the months, the Jyotisha recognizes several different kinds of day. The most basic kind of day was the savana day, which is the period from sunrise to sunrise. Now, it seems that this was something of a later innovation. Hints from the Vedas suggest that originally the day was marked from sunset to sunset, similar to the way the Mesopotamians did it. But at least for astronomical purposes, later on the mark changed from sunset to sunrise, and even later, some astronomers also started to mark the day from midnight to midnight. Now this savana day was the one that was most commonly used, but for timekeeping purposes, astronomers also tracked two other kinds of day. One is the lunar day, or “tithi,” and consists of 1/30 of a lunation, or about 23 hours and 37 minutes. The tithi is something of a distinctive feature of the Jyotisha, but it was not much developed in later astronomical works in India, so after a few centuries it seems that it had fallen out of favor as a unit. The other was the solar day, which is exactly 1/360 of a year. This unit of time is hinted at in the Jyotisha, but doesn’t appear very explicitly, and it’s not until the early 6th century AD that it appears definitively in the Indian astronomical literature. Finally, the day itself was divided into five parts: Udyan surya, meaning “rising sun;” Samgava, meaning “gathering of the cows;” Madhyam-din, which is mid-day; Aparahna, which is afternoon; and lastly Astam-yan, which is sunset. In addition to the various divisions of time in the calendar, the Jyotisha also speaks of some of the properties of the solstices. The yearly cycle was taken to begin at the winter solstice, after which the Sun would move northward for six months during the first ayana of the year. Then it would turn around and start moving southward after the summer solstice. The summer solstice marked an important point in the year called the Vaishuvatiya, and was celebrated by hymns that were chanted for 21 days, 10 days before the solstice, 10 days after, and then the day of the solstice itself. These 21 days of chants surrounding the summer solstice has been interpreted as implying that the Sun was perceived to remain fixed for those 21 days around the solstice. The texts make clear that the cause of the annual cycle we see of days getting longer leading up to the summer solstice and days getting shorter leading up to the winter solstice was well understood. Another text called the Kaushitaki Brahmana says: The sun indeed rests on the new moon day of Magha, being about to turn towards the north. Thus they rest who are about to perform the rites of the prayaniya atiratra…. He goes for six months towards the north; they follow him with the ascending celebrations of six days each. He having gone six months towards the north stands still, being about to turn towards the south. Thus they stop, being about to perform the rites of the Vaishuvatiya day. Thus they reach him for the second time. He goes six months towards the south. They follow him with the returning celebrations of six days each. Having gone six months towards the south he stands still, being about to turn towards the north. Thus they stop, being about to perform the rites of the Mahavratiya day. … About this there is sung a sacrificial stanza: ‘Arranging the days and nights like a wise spider; six months always towards the south and six months towards the north wanders the Sun.’ The Jyotisha not only describes this general phenomenon of the days getting longer and shorter but also describes it quantitatively. According to the Jyotisha, the ratio between the length of day and night on the summer solstice is 3:2, the same ratio that the Babylonians used. Given that the Babylonians had almost certainly developed this ratio first, some scholars have wondered whether or not the appearance of this ratio in the Jyotisha was an import from Mesopotamia, but the evidence for this hypothesis is pretty minimal. It’s more likely that it was developed independently and happened to get the same ratio by coincidence. The Jyotisha goes even further and also describes the rate at which the days get longer as the solstice approaches. One line reads: The increase of daytime and decrease of nighttime is [the time equivalent of] one prastha of water [in the clepsydra per day] during the northward course [of the sun]. They are in reverse during the southward course. [The total difference is] 6 muhūrtas during a half year. The “prastha” referred to in this line was a unit of measurement for an amount of water coming from a clepsydra, and you may recall from the last episode that a muhurta was 1/30 of a day. Later on the Jyotisha says: [The number of days] elapsed in the northward course or remaining in the southward course is doubled, divided by 61, and added to 12. The result is the length of daytime [in terms of muhūtras]. So the Jyotisha is part of a rather small and exclusive group of astronomical texts from the ancient world that explicitly provides a mathematical model of the length of day over the course of the year. Similar to the Babylonians they modeled it as a zig-zag function, with each day getting longer at a constant rate until the summer solstice arrives, at which point it reverses and the days get shorter at the same constant rate until the winter solstice. Now, in reality, the change in daylight is more of a sinusoid at these latitudes, but the slope of the line that the Jyotisha mentions was probably measured around the equinoxes, since this is when the change in the amount of daylight is most noticeable. An interesting consequence of this is that from this slope we can estimate the latitude that the J"
