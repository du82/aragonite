description = "After the fall of the Mongol Yuan Dynasty, the Ming Dynasty drove the few small Nestorian Christian communities in China underground and largely closed China off to foreigners.  Only in the 16th century with the arrival of Portuguese traders did contacts with the West begin to be revived. The newly founded Jesuit order organized a mission to China led by Matteo Ricci. After finding his efforts at establishing a presence in the country stymied by the government, Ricci discovered that the key to securing a permanent Jesuit presence in China was his knowledge of Western astronomy."
full_description = "Episode 43: When the Saint Comes Marching In June 25, 2024 After the fall of the Mongol Yuan Dynasty, the Ming Dynasty drove the few small Nestorian Christian communities in China underground and largely closed China off to foreigners. Only in the 16th century with the arrival of Portuguese traders did contacts with the West begin to be revived. The newly founded Jesuit order organized a mission to China led by Matteo Ricci. After finding his efforts at establishing a presence in the country stymied by the government, Ricci discovered that the key to securing a permanent Jesuit presence in China was his knowledge of Western astronomy. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy, from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. Well, we have spent the last six episodes peering into various aspects of the astronomy of ancient and Imperial China. By and large this astronomical tradition was indigenous to China, though as I mentioned when we were talking about the hsiu, or lunar mansions, there was certainly some cultural contact between India and China, particularly in the latter part of the first millennium AD. In this episode I wanted to chronicle another period of rather remarkable cultural contact in China — the arrival of the Jesuits in the 16th century. The ability of the Jesuit missionaries to leverage their knowledge of European astronomy to gain permanent access to the highest echelons of power in Chinese society is rather unparalleled. And, thanks to the copious documents that both Chinese scholars and Jesuit missionaries produced, we have a tremendous view into what all sides were thinking during this period. Now, in some ways this episode is coming a bit out of order from the main narrative. The reason that the Jesuits had so much success in China was that quite a lot had happened in astronomy between the last time we checked in on Europe during the late Roman Empire and this period, the 16th century when the scientific revolution was well underway. I’ll mention some of the specific developments that occurred as they are relevant, but we’ll have to save a deep dive on these topics for future episodes. That being said, the developments of the scientific revolution that are the most famous and which you probably already know something about, like Copernicus’s heliocentric theory and Kepler’s laws, really weren’t very relevant at all to the Jesuits in China, at least directly, and they hardly mentioned them to their Chinese counterparts. The more relevant developments in European science were more obscure things like the Alfonsine Tables and later the Rudolphine Tables. But I am getting ahead of myself. Even on the Chinese side, quite a lot had taken place since the last episode, where we talked about the early Song Dynasty in the 11th century. Now, in the first episode on Chinese astronomy I quoted the famous opening line of the Romance of the Three Kingdoms. This work was written in this intervening period and begins “the empire, long divided, must unite; long united, must divide.” After we’ve now spent a few episodes looking at the sweep of Chinese history across millennia you can see how apt the line is. There were periods of strong, centralized government, followed by periods of fragmentation. The early Song Dynasty where we spent the last episode was a period of increasing centralization, but over the centuries, it, too, could not avoid the internal and external forces of decay to which earlier dynasties had also succumbed. Now, in many earlier dynasties, like the Earlier Han Dynasty, the internal forces of decay had been the predominant factor in the fall of the dynasty. The Song Dynasty, however, whatever its internal dysfunctions, felt much stronger external pressures than many of the earlier dynasties, particularly in the north. I had mentioned in the last episode how Emperor Shenzong had made conquest of the north the primary goal of his reign. This wasn’t simply naked imperial ambition, though I’m sure there was a fair bit of that. It was also a foreign security policy. I talked a little bit about the geography of China in the first episode on Chinese astronomy and how China is fairly well protected to the south and west by a combination of mountains, deserts, and jungles. But the country is quite vulnerable to the north. The plains of the major river valleys connect in the north to the vast Eurasian steppe. Now, throughout the Song Dynasty, the major threat from this direction came from Manchuria, the region in the northeast of modern day China along with parts of the far east of modern day Russia. In the period we were discussing in the last episode this area was controlled by the Liao dynasty, but in 1125 it was toppled by a client kingdom and became the Jin dynasty. Either way the region remained a threat to the Song Dynasty. And, in fact, the Jurchens, as the subjects of the Jin dynasty were known, were able to invade far south enough to take control of the capital city of Kaifeng and the imperial court was forced to retreat to the south of the country and establish a new capital at Hangzhou. Well, after these events, it is perhaps no surprise that the Song rulers began to adopt a policy that the enemy of my enemy is my friend, and they began to build an alliance with another rising kingdom that had started to harass the Jin dynasty, the Mongols. The only precedent of the explosive growth of the Mongol Empire in the 13th century is really the rise of the Macedonian Empire under Philip II and Alexander the Great that we talked about back in Episode eighteen. But even that was outdone by the Mongols. In their attacks on the Jin Dynasty they were able to recruit large numbers of disaffected Han who still lived in the area, as well as being able to marshal resources provided by the Song Emperor. But, after the Mongols had successfully conquered the former lands of the Song Dynasty, including the old capital, they went more or less overnight from being allies of convenience to foes. And, in this newly adversarial relationship, the Mongols were able to get the better of the Song rulers. In the early days, the Song generals were able to fairly easily reconquer Kaifeng, along with a number of other cities of historical importance to them. But in doing so they effectively declared outright war on the Mongol Empire, and the Mongols turned out to be a formidable foe. The Mongols were able to easily retake these lands and then proceeded to try to push their way south. The next four decades saw a series of attempts from the Mongols to bring the Song Dynasty under their heel. Now, these invasion efforts by the Mongols were at times paused due to other matters they had to attend to in their rapidly expanding empire. By the 1270s the empire’s extent reached from the tip of the Korean peninsula in the east to as far west as the Levant and Hungary. So, from time to time, their attention was naturally focused elsewhere. But in 1258, the Great Khan, Möngke, one of the grandsons of Genghis Khan, put his younger brother, Kublai Khan, in charge of the east, and he had a particular focus on conquering the remnants of the Song Dynasty in southern China. Now, during this time period, the Song Dynasty was naturally under significant internal pressures as well. In order to support this continual war against an enemy that was growing stronger by the day, the Song Emperor was forced to resort to levying punishingly high taxes and confiscating lands from the aristocracy. Kublai Khan was sensitive enough to internal Chinese politics to use these developments to his advantage. He encouraged merchants and aristocrats to defect to his rule where the taxes would be lower and they would have their land back. Whereas punishments in the collapsing Song Dynasty had become capricious, Kublai Khan made a great show of his generosity and mercy as a ruler. Throughout this period, Kublai Khan saw a series of victories, and by the late 1270s he had defeated the remaining dregs of the Song army. Rather than keeping the Song rulers around to run a client state, Kublai Khan set himself up as the ruler of all of China, and thereby established the new Yuan Dynasty. Now, this development was quite important in the history of Chinese astronomy. The Mongol Empire now extended from China all the way to the Middle East. Again, we are going somewhat out of order, but in the intervening time, quite a lot had happened in astronomy in the Middle East during the Islamic Golden Age. Among his various reforms, Kublai Khan brought in Muslim astronomers to add their expertise to the Astronomical Bureau in China. To minimize friction between the established Chinese astronomers and the foreign newcomers, Kublai Khan divided the astronomers into two separate schools which would carry out their activities in parallel: the Chinese school and the Islamic School. The two schools would use their different traditions to make their predictions and these could then be compared against each other. The most important astronomer in this effort was Jamal ad-Din Bukhari, who was one of the founding members of the Islamic Astronomical School. When he traveled from Bukhara in modern-day Uzbekistan, he brought with him seven astronomical instruments, some of which, like the Persian astrolabe, were new to China. Among these was one of special note, it was a globe. As I discussed in Episode 38, the more traditional cosmology in China, the Kai Thien theory, held that the Earth was essentially flat, square in shape, and curved somewhat down towards its edges. Although later models like the Hun Thien model held that the Earth was spherical, they were never developed to the point that anyone had constructed a globe. The Chinese had a long history of cartography — I mentioned in the last episode how Shen Kuo was able to get his sentence reduced by producing an atlas for the Emperor. But the maps were always two dimensional. This was the first three dimensional representation of the Earth. At any rate, over time the Yuan Dynasty established by Kublai Khan suffered the fate of all the dynasties that had come before. Like the Macedonian Empire, the cohesion of the Mongol Empire after its rapid expansion had been due to small number of charismatic leaders. After their deaths the sprawling Mongol empire began to fragment into four main pieces, of which China was one. So by the turn of the 14th century the Mongol Empire was falling apart, but the dynasty Kublai Khan had founded in China was able to operate more or less independently. Nevertheless, without military reinforcements from the north, the Yuan Dynasty’s situation became more precarious. The Mongol rulers instituted privileges for those of Mongol ethnicity and this naturally bred resentment among the Han majority. Within a century the Han Chinese were able to organize under a peasant rebel named Zhu Yuanzhang and overthrow the Yuan Dynasty. In 1368 Zhu Yuanzhang claimed the Imperial throne as the first emperor of the newly founded Ming Dynasty. But the Islamic Astronomical School that Kublai Khan had established stuck around through this transition. Well, at this stage it’s worth taking a look at the development of contacts between China and the West. Now, trade between China and other lands across Asia and beyond had been taking place for centuries. In the earliest days this trade took place as a kind of daisy chain between neighboring lands, but even so Chinese goods were able to have a long reach. Chinese silk has been found in ancient Egypt dating back to the late 2nd millennium BC. In Imperial Rome, Seneca the Younger inveighed in the Senate against the decadence of Chinese silk. In time, these trading routes across central Asia became formalized into the famous Silk Road, or, to use the more accurate modern terminology, Silk Routes since there was more of a network of routes across both land and sea rather than a single road. As these trading routes became more established, merchants could make longer journeys and remove some of the links of the daisy chain. Now, one source from the 4th century AD claims that Christian missionaries had reached a land called Serica, which was the Latin term for northern China. Incidentally, this name is etymologically related to the English word silk. But the first good evidence of the arrival of Christian missionaries to China was in the 6th century AD. A pair of monks who had been preaching the gospel in India made their way to China and learned of the silkworms that produced the famed Chinese silk. In fact, the Chinese emperor had long maintained a tight monopoly on silk production. Anyone caught leaving the country with live silkworms or silkworm eggs was subject to death. Now, I’ve been saying Chinese silk, but for the Romans out in the Far West, they just knew it as silk. Because of the daisy chain of trade, they had no idea where it came from and generally assumed that their silk came from India. The monks conveyed this critical information that silk was produced in China to the Byzantine emperor Justinian. Justinian responded favorably and promised great rewards if the monks could bring him several silkworms. By some surreptitious means which have not survived to history, these two monks were able to smuggle silkworms out of China all the way back to the Byzantine Empire where an independent silk industry thrived for some six centuries. Well, this initial expedition of Christian missionaries into China had more benefits in the temporal realm than the spiritual realm. But over the centuries contacts between China and the West continued to increase and these contacts lead to the establishment of a small Christian minority in the country. Like other minority or peasant religions like Buddhism and Zoroastrianism, its adherents suffered from imperial persecutions from time to time. But being so few in numbers, Christians in the country were usually just swept up in persecutions of the much more numerous Buddhists rather than targeted specifically. Well, during the Song Dynasty there was a community of Armenian merchants living permanently in China, but after the Mongol invasions the size and nature of the Christian community in China changed rather dramatically. Because the Mongol Empire extended so far to the West, there were many more contacts with Christendom and Christianity was not uncommon among the Mongol people, even up to the highest echelons of power. And what’s more, unlike in China, the Mongol leaders were relatively tolerant of Christianity. Now, at this stage it’s worth noting that the Christianity that was present within the Mongol Empire and which was imported into China during Kublai Khan’s invasions, was rather distinct from the Christianity we are more familiar with in the West. You may be familiar with the Great Schism of 1054 in which the Eastern Orthodox Church an"
