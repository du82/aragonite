["https://songofurania.com/episode/023"]
title = "The Song of Urania Podcast"
description = "During the half millennium of the Roman Era in Ancient Greece, only two astronomers made any major advances. At the beginning of the Roman Era, Posidonius measured the size of the Earth and discovered the relationship between the Moon and the tides. But the triumph of Greek astronomy came 300 years later with the intricate planetary model of Ptolemy, which stood unchallenged for some 1400 years."
full_description = "Episode 23: The Culmination of Ancient Greek Astronomy November 10, 2022 During the half millennium of the Roman Era in Ancient Greece, only two astronomers made any major advances. At the beginning of the Roman Era, Posidonius measured the size of the Earth and discovered the relationship between the Moon and the tides. But the triumph of Greek astronomy came 300 years later with the intricate planetary model of Ptolemy, which stood unchallenged for some 1400 years. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon, or thereabouts. My name is Joe Antognini. Last month we took a little detour from the overall narrative of ancient Greek astronomy and looked at one of the most remarkable artifacts from antiquity, the Antikythera Mechanism. But prior to that digression, we had left off talking about Hipparchus and all the wonderful discoveries he made in the 2nd century BC. So I will pick things up from right where we left them. But believe it or not, after Hipparchus’s work in the 2nd century BC, we can more or less skip over the next 300 years. In all that time, there were essentially no new developments in astronomy. Not so long ago, back in the Classical Era, it seemed that there was someone of note to talk about every decade or two, but now Greek civilization has been brought to such a low point that three centuries can pass without really making a mark on the oldest science. If this were a shorter series on the history of astronomy, I would be justified in skipping straight ahead from Hipparchus to Ptolemy. But devoted listeners to this podcast should know by now that it is not in the character of this podcast to skip over 300 years without saying at least a little about what happened in between and why there is so little to talk about from this period. But before we really get into that particular puzzle there are a couple of loose ends I want to tie up in Hellenistic Era astronomy. In particular I wanted to mention Conon of Samos and Aglaonice. I should have mentioned Conon of Samos a few episodes back because he lived right through the middle of the 3rd century BC, so he predated Apollonius of Perga by about 50 years and was probably a little younger than Aristarchus. His serious astronomical work was in a series of seven books called De Astrologica, but, in a tale you are by now well familiar with, it does not survive. All we know is that he wrote about solar eclipses, possibly by collecting Egyptian records and possibly observing some himself. But the reason I bring up Conon of Samos is that he is also the subject of a rather charming story about the constellation Coma Berenices, and how it got its name, and I just couldn’t pass it up. As his name implies Conon of Samos was born in Samos, but just like a great number of his countrymen like Pythagoras and Aristarchus, he ultimately moved away and set up shop in a more vibrant intellectual climate, in his case, Alexandria. Conon must have had quite a strong reputation as an astronomer because he was appointed to the position of court astronomer in Ptolemy III’s court. Now I talked a little bit about the great power politics in the region two episodes ago when I was talking about the geopolitical situation of the city of Rhodes. You may recall that after Alexander the Great had died, his empire fractured and his generals seized whatever regions they could and set up their own splinter states of larger or smaller sizes. Around the eastern Mediterranean there were three main players: the Ptolemaic dynasty in Egypt, the Seleucid Empire in the east, and the Antigonid dynasty in Macedonia. In the centuries after Alexander’s death, these empires were at each other’s throats and went to war on a regular basis. During the time that Conon of Samos was the court astronomer to Ptolemy III, the Ptolemaic Kingdom once again went to war with the Seleucid Empire in what is called the Third Syrian War, and, though they didn’t know it at the time, at this point they were only halfway through the total of six Syrian Wars that these two empires fought. Ptolemy III was married to a woman named Berenice II, which gets anglicized to Berenice. They were technically related, her grandmother married Ptolemy III’s grandfather, which would make them second cousins, but only by marriage, not by blood. Later, more salacious stories had it that they were brother and sister, though either way, Egyptian high society was fairly sanguine about consanguinity. At any rate, the marriage of Berenice II to Ptolemy III was evidently a happy one, which was a historical rarity among the powerful. When Ptolemy III had to ship off to war in Syria, Berenice II was so distraught at the prospect of her husband being in harm’s way that she made a sacrifice to the gods. But rather than making the usual sacrifice of bulls she decided to make a more radical offering. She cut off her hair, apparently shaving herself bald, and placed her hair in the temple to Arsinoe Aphrodite to beseech the gods for her husband’s safe return. Now the stories of what happened next differ in their timing, some say it was the next day, others say it was a good while later, but at some point, the queen’s hair disappeared from the temple. Furious not only that it was embarrassing that someone had apparently stolen the queen’s hair, but also that this might ruin the offering she had made and put her husband in peril, the queen brought together all the court officials and demanded answers for what had happened. Among them was the court astronomer Conon of Samos. Probably to the great relief of everyone else in the room, Conon was quick on his feet and immediately explained that Aphrodite had been so pleased with the queen’s offering that she had taken it and placed it in the sky to be honored through the ages. Henceforth, a patch of stars between Boötes and Leo has been known as Coma Berenices, or Berenice’s hair. This story was quite popular in the ancient world, and it was almost certainly encouraged by the Egyptian state as a kind of propaganda as it made Berenices II look quite good. It emphasized the devotion of the queen to her husband, her piety, and, above all, her favor with the gods. Official depictions of Berenices II often represented her with a shaved head to allude to this story, and later Roman poets set the story in verse which is how it has survived to us today. A moral we might take from the story today is that sometimes it is not sufficient for an astronomer to know astronomy. Sometimes an astronomer must have a certain, shall we say, creativity as well. So that is Conon of Samos. The last astronomer of the Hellenistic Era I wanted to briefly mention, and then I promise we will move on to the Roman Era for real, is Aglaonice, who was active in the late 2nd century or early 1st century BC. She is remarkable for being one of the very few astronomers of the ancient world who was a she. Over the course of our tour of Greek astronomy, we’ve come across a couple of philosophers who thought it worthwhile to teach philosophy to women, Pythagoras and Epicurus being some of the more prominent, but even then their female students by and large went unnamed, or at least the few that are named have nowhere near the prominence as some of their male students do. Now it seems that historical records of Aglaonice’s work have been rather colored by the fact that she was a woman, which makes it unfortunately hard to get at what it was exactly that she did. Many of the representations make her out to be a kind of witch and she was in particular known for her ability to make the moon disappear from the sky. But a more realistic interpretation of this is that she may have been able to predict the occurrence of lunar eclipses, which was certainly possible to do given the state of Greek astronomy at that point. But it’s not known to what extent the more magical elements of her work were embraced by her or imposed on her by authors writing about her. As I’ll talk about later in this episode when I get to Ptolemy, the modern rigorous separation between the sciences like astronomy, physics, and chemistry, and sorcery, divination and magic, did not exist in the ancient world. So while we would think it strange that someone would go about hard-headed astronomical predictions of lunar eclipses on the one hand and then try their hand at sorcery on the other, the ancients had no such hang-ups. Well with that I promise you that we are officially finished with the astronomy of the Hellenistic Era of Ancient Greece. Way back when we started our journey through Greek astronomy I said that historians generally divide the history of ancient Greece into five periods: The Greek Dark Ages, the Archaic period, the Classical period, the Hellenistic period, and last of all the Roman period. Now this growing civilization of Rome has been making a few appearances in the last couple of episodes. They had been one out of a number of civilizations over in Italy for many centuries, but around the second century BC, their dominion really started to take off after their defeat of the Carthaginians in the Punic Wars and they subsequently began encroaching on the kingdoms that had been spun out of Alexander the Great’s empire, most notably the Macedonian Kingdom. The canonical end to the Hellenistic Age and the start of the Roman Age is 146 BC, when Rome sacked Corinth and took control of the Greek mainland, but as always, the edges between the eras are a little fuzzy and it would take more than a century before Rome brought Ptolemaic Egypt under its heel. The main feature of Greek astronomy during the Roman Era is really just the lack of it. There are really only two figures of note in the whole half millennium of the Roman Era, Posidonius, and, of course, Ptolemy. Posidonius was born at the beginning of the Roman Era, about a decade after the sack of Corinth. Posidonius was born in the city of Apamea in Syria. Apamea was a bit of an odd town, it had been founded by one of Alexander the Great’s generals, Seleucus, the originator of the Seleucid Empire. Seleucus’s purpose in founding the city was as a way to give land to his veterans. In the ancient world, to secure the loyalty of their troops, generals would often promise their soldiers a plot of land that they could call their own if they served in the army for the requisite number of years. If you were born into a poor, landless family in the ancient world, joining up was really your only realistic route to property ownership. This strategy later ended up proving to be a major systematic problem for Rome because it needed to acquire vast amounts of land to provide to its vast armies. This required it to conquer vast territories, which meant that it needed to raise ever larger armies whose troops would, in turn, require even more land. Well that was centuries to come and at the moment Seleucus did not have quite as serious a problem as Rome did, but to give his soldiers land he had to found a number of cities and Apamea was one. But because he was plopping down a bunch of Greek soldiers in some conquered territory, the surrounding culture was not really Greek. This was not unusual, of course, the Greeks had colonies all throughout the Mediterranean. Alexandria, the main center of Greek intellectual life during the late Hellenistic Era, was really just a small Greek dot in the otherwise culturally foreign country of Egypt. It seems that from his upbringing in a Greek town surrounded by barbarians, Posidonius became interested in the cultural practices of foreign peoples. Now, the standards of cultural anthropology in his day were not quite what they are today so he was unabashedly ethnocentric. He thought, for example, that the way that the peoples of the Levant went to battle was just ridiculous. He wrote that they go “clutching knives on their belts and filthy, rusting spears. They drag behind them donkeys piled high with all manner of wine, food, flutes, and musical instruments — prepared for a party rather than a battle.” Well Posidonius was very smart and in his youth moved to Athens to learn at the philosophical schools there, and found that the Stoic school was most to his liking. But sometime when he was in his 30s he began to travel extensively through the Mediterranean and documented the customs of the peoples he encountered. His writings have become one of the most important sources we have on the society of the Celts since they were an illiterate people and didn’t write anything down about themselves. And, of course, if you can’t write anything down about yourself and have to rely on foreigners to describe your society, the descriptions that get handed down through history can end up full of exaggerations. Posidonius, for example, thought that Gaulish women were very beautiful, and remarked on their height — the average Gaulish woman was as tall as the average Greek man, but he felt that the beauty of the Gaulish women was wasted on the Gaulish men since he wrote “the Gaulish men prefer to have sex with each other. They often sleep on top of animal skins surrounded by other males and roll around together on the ground. The young men are unconcerned about proper behavior and will offer their bodies to anyone—and they are highly offended when anyone turns them down.” There is perhaps a story there that Posidonius isn’t telling us. Well, Posidonius also remarked on the Celtic practice of head hunting and how everywhere you looked in a Celtic settlement there seemed to be the severed heads of their enemies on display. He writes “The Gauls cut off the heads of the enemies they kill in battle and hang them around their horses’ necks. Then, singing a song of victory, they take the bloody weapons from their fallen foes and give them to their servants to carry home. The weapons they hang on their walls like hunting trophies, but the heads they preserve in cedar oil, storing them away carefully in chests.” Now it’s easy to read this has being your typical Greek exaggeration about the barbarities of the barbarians, but modern archaeology seems to suggest that Posidonius may have downplayed the extent of it if anything. We now know from excavations that Celtic temples have the skeletal remains of severed heads and put the heads on display in prominent places. Some have altars made of the bones of thousands of enemy warriors. One of these temples had a structure that supported upright the decapitated bodies of 80 slain warriors, all positioned holding their shields and swords as if ready for battle. The missing heads were undoubtedly displayed somewhere else. The historian Philip Freeman points out the contrasting attitudes of the Greeks and the Celts in their treatment of the dead. To the Greeks burial of the dead was an absolute necessity. Only a barbarian, literally or figuratively, would let a dead b"
