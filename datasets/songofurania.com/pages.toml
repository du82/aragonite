title = "The Song of Urania Podcast"
description = """
How should we approach the history of astronomy?  How have the questions
that astronomers have asked changed through the ages?  We look at some of
these questions and sketch out the broad arc of this field from antiquity
to the present day."""
full_description = "Episode 1: The Heavens & History January 29, 2021 How should we approach the history of astronomy? How have the questions that astronomers have asked changed through the ages? We look at some of these questions and sketch out the broad arc of this field from antiquity to the present day. Transcript Hello, and welcome to The Song of Urania. My name is Joe Antognini. This is a podcast about the history of astronomy with new episodes every full moon. Astronomy has the distinction of being the oldest of the sciences. All civilizations had some knowledge of astronomy to one degree or another. In many of these civilizations, knowledge of the heavens held an exalted place and was considered among the subtlest kind of knowledge. Even societies that left behind no written records for us to study left evidence of their astronomy in their buildings and monuments. The first records that are definitively astronomical in nature are more than 3000 years old. Naturally astronomy has changed quite a lot in that time! The goal of this podcast is to trace the history of this subject through the millennia. I want to explore how astronomers have thought, how they have worked, and how astronomy has changed over these three thousand years. A bit about myself. I am an astronomer by academic training. I have a PhD in the field. I am not a historian. However I want to avoid what I see as a common trap that many astronomers fall into when talking about the history of astronomy. Most astronomers present version of history that could perhaps be called “folk history” in analogy with folk etymology or folk medicine. (I don’t mean this in the Marxist sense that sometimes gets used of a history of the lives of the common people.) What I mean by a “folk history” is the version of history that a group of people tells themselves. Some folk histories (think of George Washington and the cherry tree) were invented out of whole cloth. Others, (think of Paul Revere’s midnight ride, or more relevant to our subject, the Galileo Affair) have some bearing in reality, but have birthed myths that live in the popular imagination and for which the actual, more complicated, story has been ignored. One of my hopes in this podcast is to separate out the folk history from the real history — to the extent that the real history can ever be discovered or worked into a single narrative. But I don’t want to completely ignore the folk history either — while the stories of folk history are usually not literally accurate, they do convey real information about how the group of people see themselves and what they value. As we trace the development of the science of astronomy, we will encounter people, ideas, and cultures which are really quite different from the people and ideas we’re familiar with in our modern culture. Even the giants of science from just a few centuries ago thought in ways that we today would consider to be profoundly unscientific. But what I want to do is to really take their ideas seriously, on their own terms — not just the ones that happened to work out and are given a few sentences in a modern textbook, but also the ones that modern astronomers have forgotten. If we simply limit ourselves to those discoveries that meet the bar of our modern scientific criteria, we will be ignoring almost all the work that some of the smartest people ever alive thought was important. We’ll be failing to really understand how this knowledge was actually gained, and how the science evolved over the centuries. There’s an analogy I quite like due to Prof. Lawrence Principe. One day an American decides he wants to see more of the world and decides to go visit Japan. After landing in Tokyo, he starts to wander around the city and take in its sights. Eventually he gets hungry and after searching for food for a while, stumbles across a McDonald’s. To his delight, he finds that this McDonald’s serves Big Macs, and they taste just as good as the ones at home. The next day he continues his trip, seeing the sights of the city. Once again he gets hungry and goes off in search of food. It takes him a while, but eventually he finds another McDonald’s and enjoys another Bic Mac. And so it goes every day of his trip. He gets hungry, goes off in search of a McDonald’s, and with some considerable effort, eventually finds one. Eventually our tourist’s trip comes to a close and he flies back home, and when he gets back home he concludes that the food in Japan is exactly like the food in America, there’s just less of it. As we dive into the history of astronomy, we don’t want to make the same mistake as our poor, benighted tourist. We don’t want to assume that astronomers of the past thought the same way as modern scientists, approached problems exactly the same way as modern scientists, or even had a general worldview that could plausibly be called scientific. In short, we don’t want to simply assume that astronomy in the past was exactly the same as modern astronomy and that there was just less of it. As we dive into the history of astronomy throughout this series, I really want to understand all of it. Not just the astronomy that has survived into the textbooks of today, but all the theories that didn’t make it, even the ideas that we don’t consider scientific today. I don’t want to simply touch on the theory of epicycles as a pit stop on the way to Copernicus’s heliocentric theory, but really understand the details and motivations of a scientific theory that survived for more than a millennium. And yes, we will even explore astrology in great depth as well. There is simply no way to understand the history of astronomy without understanding the history of astrology. The two are twin sisters joined from birth at the hip. Another facet that I want to cover over this series is the relationship between astronomers and the broader society. Today many of us think of astronomy as an esoteric subject, untethered from the banalities of everyday life. This remove from normal life drives much of the allure of astronomy — it connects us to the transcendent in ways that few other things can. The only other subjects that have the same grasp on us are perhaps music and religion, and for many of us moderns, not even those. It is perhaps no coincidence that astronomy has been associated with music and religion from the time of antiquity. Today astronomy does not really serve a practical purpose, or at least, to whatever extent it produces practical results is entirely incidental. But it was not always so. The relationship between astronomy and the state has changed considerably over time. In some places and eras astronomy operated as it did today — at some remove from the state maybe depending on it for financial support or maybe not in a sort of system of benign neglect. But in other eras and places such as ancient China or Babylonia astronomy and the state were much more tightly coupled and like the planets in the sky, their interests sometimes aligned, and sometimes collided. And in many, perhaps most societies, the study of astronomy was extremely practical — states depended on astronomy and astronomers to mark calendars, facilitate navigation, and perhaps most important of all, cast horoscopes. Kings, queens, and nobles depended on astronomy to decide when to go to battle, when to sue for peace, and when to take medicine, and when to marry. So over the course of this series we are going to dive deep into the way that astronomy was done throughout history. In order to prepare ourselves for this journey, I want to spend the rest of this episode giving a very broad sketch of the history of astronomy from antiquity to modernity to bring forward some of the themes and questions that will arise over the course of this series. To help frame the overall evolution of the science I think it is helpful to divide the history into three broad eras, which, to avoid any controversy, I will give very boring names: early astronomy lasting until the 1600s or so, early modern astronomy lasting from the 1600s to the mid 1800s, and modern astronomy, which begins in the mid 1800s and lasts to the present day. I break these eras up based on the problems that astronomy was attempting to solve, and the methods it used to solve them. The astronomy of antiquity was founded in solving a problem that we don’t really consider today to be astronomical at all — how do we keep time? Ancient peoples noticed the regularity of the heavens and found them to be the most accurate way of setting calendars. And there’s no real surprise here. The heavens are extremely regular compared to terrestrial phenomena, and any agricultural society needs to track the course of the year in order to determine when to sow and when to reap. And as societies grew to be larger, more complex, and more interconnected, keeping the society in sync with itself required greater precision in timekeeping. And the heavens, quite considerately, present to us three very obvious cycles to keep track of: the diurnal cycle, that is, one day. Every day the Sun rises in the east, rises to some peak in the sky, and then sinks in the west, at which point it becomes night, and then after night, the whole cycle repeats itself. There is, of course, the year. Over the annual cycle, the days get longer, the Sun gets higher in the sky, and the weather gets warmer, the plants grow, and then cycle reverses: the days get shorter, the Sun becomes lower in the sky, and the weather gets cooler, and the plants die. After one year, the cycle repeats itself. But how many days are there in a year? Well, we enlightened moderners would say, that’s easy, there are 365. Unless it’s a leap year, in which it’s 366. But when is a leap year? Easy, that’s every four years. Unless the year is divisible by 100, in which case there’s no leap year. Except if the year is divisible by 400, in which case there is a leap year after all. Arriving at this convoluted scheme was one of the central problems of astronomy for millennia. The principle issue is that there are not an even number of days in a year. It’s not terribly difficult to determine how long a year is to within a day or so, but if you want your calendar to work over centuries or millennia, you need to know how long a year is to within much less than a year — minutes, even seconds. If your measurement is off, the inaccuracies will compound over time, and the seasons will start to drift until after long enough winter is in June and summer is in December and everything is a mess. A further wrinkle that ancient astronomers wrestled with was the third cycle that is readily apparent in the night sky — the phases of the moon. Over the course of a month or so, the moon waxes from a barely visible crescent just after sunset to a full, and very bright orb that is visible throughout the entire night, and then wanes into a crescent that is only briefly visible just before sunrise before starting the cycle over again. The lunar cycle is very convenient for human societies because the month is a nice intermediate duration between a day and a year. A day is very short, a year is very long, but a month — a month is something you can work with. Consequently many societies used the moon as an additional way to keep time. But again there’s a problem — the length of the month does not neatly divide the length of the year. Nor does the length of the day neatly divide the length of the month. And what’s worse, the month is not exactly regular — some months are slightly shorter, others slightly longer. As we are going to see, much of the earliest astronomy was concerned with this thorny problem of how long a month lasts. So astronomy had its roots in timekeeping. But this was not the only question that ancient astronomy was interested in. There were two other issues that occupied the astronomers of antiquity. The next issue was the motion of the planets. If you watch the heavens regularly, as you must if you’re determining how long a month is, you’ll notice that the stars generally maintain the same positions relative to each other. They form recognizable constellations. However, there are five conspicuous exceptions. There are five mysterious stars which seem to move about the heavens over time. Sometimes they appear in one constellation, but over time they drift into other constellations. But this drift is not regular — at least not obviously. Determining where the planets would be over time was the second question that occupied ancient astronomers. The final question arose later and was more philosophical in nature — what are the heavens made of? The ancients did not have the means of answering this question in a way that we moderners would consider scientific or even plausible, but that did not stop them from asking the question. And this question begat a further, natural question — what is the relationship between the heavens and the Earth? It is clear that there is some relationship here — the Sun affects the weather and the plants, it was well known that the moon affects the tides. It is plausible that other planets would have subtler effects on the terrestrial realm. What was the extent of this relationship? This is what we would today call astrology, but the ancient world did not recognize the same distinction between astronomy and astrology that we moderners do. So these three questions occupied astronomers for millennia: how to keep time, how the planets move, and what the heavens are made of. Now most histories of astronomy will define one era as being the astronomy of antiquity, followed by medieval astronomy after the fall of Rome. And then they will demarcate the boundary between medieval astronomy and early modern astronomy with the heliocentric theory of Nicolaus Copernicus. But in my idiosyncratic division of the history of astronomy, where we have just three periods: the early, early modern, and modern, I view the work of Copernicus (and Brahe and Kepler) as more of a culmination of early astronomy than a radical break away from it. This is not in any way to minimize the work of Copernicus, it was of singular importance in the history of astronomy. The reason I do this is that in my idiosyncratic division the eras are distinguished by the problems that astronomers were solving and the methods they used to solve those problems. And the problems Copernicus was solving were the same as Ptolemy. Copernicus proposed a different solution, to be sure, but a different solution to the same problem of modeling the motions of the planets. Of course any breaking up of a continuous history into discrete eras is a bit of a semantic game, but these semantic games can sometimes reveal some interesting developments in the history of thought. To my mind, the transition to a distinctly new era of astronomy was marked by the work of two astronomers. And, of course, because history in the real world is not a neat narrative, these two figures lived some 80 years apar"
