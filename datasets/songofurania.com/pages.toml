description = "This month we turn to the astronomy of China in the early Imperial Era. We look at the way that the Emperor's astronomers were organized within the imperial bureaucracy and then walk through the three significant cosmological theories of the era."
full_description = "Episode 38: The Organization of Heaven & Earth January 29, 2024 This month we turn to the astronomy of China in the early Imperial Era. We look at the way that the Emperor's astronomers were organized within the imperial bureaucracy and then walk through the three significant cosmological theories of the era. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Last month we started our tour of the astronomy of ancient China by looking at the place of astronomy in Chinese society, particularly elite society, and then turned to the oldest written record of astronomical activity we have in China, the story of Hsi and Ho. This month I wanted to turn to the cosmological systems that developed in the early Imperial period along with some general characteristics of the calendars, which were, after all, one of the main reasons that astronomers commanded such a high rank in the Chinese state. But before we do get into these early cosmological systems, I wanted to say just a few more words about how the role of astronomy in Chinese society evolved during the Imperial period. Now, in last month’s episode I talked at some length how astronomy in China was intimately tied to the state. The emperor funded a coterie of astronomers and gave them a mandate to observe the heavens. As a civilized activity it flowed forth from the emperor, just like all the other fruits of civilization. This relationship between astronomy and the state goes back to as far as we can tell in Chinese history. By the time the earliest relevant records start to appear in the Chou Dynasty this relationship not only exists, but seems to have been regarded as an ancient practice. But in the ancient period, emperors were on the whole pretty weak, and Chinese political theory still hadn’t come to a consensus, whether voluntarily or not, as to what the role of the emperor should be. But after Ying Zheng conquered the other five kingdoms of China and thereby brought about the start of the Imperial Era, over the centuries, with some ups and downs, the Emperor’s Court expanded and became more formalized. Now, in the two millennia that Imperial China spanned, the precise details of the organization of the astronomers within the imperial bureaucracy varied. The name of the unit in the imperial org chart for the astronomers changed fairly regularly for instance, but often had a fairly literal name, something that might translate as “Astronomical Bureau” or “Astronomical Directorate.” But there were a few common features of the organization that generally persisted over all these years. The first was that being within the Emperor’s Astronomical Bureau was always a high status position, especially so for those at the head. A corollary of this was that during the reign of most of the emperors this organization was independent of any other departments within the bureaucracy. The head of the Astronomical Bureau, or whatever its name of the day was, would report directly to the emperor, rather than being managed by some intermediary. The 19th century Austrian sinologist Franz Kühnert wrote tongue in cheek, Probably another reason why many Europeans consider the Chinese such barbarians is on account of the support they give to their astronomers — people regarded by our cultivated Western mortals as completely useless. Yet there they rank with Heads of Departments and Secretaries of State. What frightful barbarism! The department itself was headed up by two individuals. The more important of the two had the title of “Feng Hsiang Shih,” which is usually translated as “Imperial astronomer.” The Imperial astronomer was ultimately responsible for reporting on the state of the heavens and setting the calendar, which included marking the divisions of the four seasons by measuring the solstices and equinoxes. This was the most prestigious position and was generally a hereditary office, passed down from father to son. The book the Chou Li, which translates to “Record of the Rites of the Chou,” written around the 2nd century BC, describes the duties of the imperial astronomer as follows: He concerns himself with the [the sidereal revolution of Jupiter], the twelve months, the [hours of the day], the [week], and the positions of the [lunar mansions]. He distinguishes them and orders them so that he can make a general plan of the state of the heavens. He takes observations of the sun at the winter and summer solstices, and of the moon at the spring and autumn equinoxes, in order to determine the succession of the four seasons. The second most important position in the astronomical bureaucracy held the title of “Pao Chang Shih,” which is usually translated as “Imperial Astrologer.” As the name implies, the Imperial Astrologer’s role was more focused on divining the implications that changes in the heavens had for matters of state on earth, though, somewhat more prosaically, another major responsibility of the Imperial Astrologer was to keep the astronomical records. The Chou Li describes his role like this: He concerns himself with the stars in the heavens, keeping a record of the changes and movements of the planets, the sun and the moon, in order to examine the movements of the terrestrial world, with the object of [prognosticating] good and bad fortune. He divides the territories of the nine regions of the empire in accordance with their dependence on particular celestial bodies. All the fiefs and principalities are connected with distinct stars, and from this their prosperity or misfortune can be ascertained. He makes prognostications, according to the twelve years (of the Jupiter cycle), of good and evil in the terrestrial world. From the colours of the five kinds of clouds,d he determines the coming of floods or drought, abundance or famine. From the twelve winds he draws conclusions about the state of harmony of heaven and earth, and takes note of the good or bad signs which result from their accord or disaccord. In general he concerns himself with the five kinds of phenomena, so as to warn the emperor to come to the aid of the government, and to allow for variations in the ceremonies according to the circumstances. In addition to these two chief positions there were a couple of other roles of note within the Astronomical Bureau. There was the Shih Chen, which we might translate to something like Imperial Meteorologist, whose focus was more on keeping track of weather patterns, although this use of the term “meteorological” somewhat resembles Aristotle’s since it included other transient phenomena in the heavens like comets or even eclipses. There was also the Chhieh Hu Shih, which we might translate to Imperial Timekeeper, and was responsible for managing the water clocks. To support all of this work, the Astronomical Bureau employed a staff of hundreds of astronomers who specialized in various tasks, from being the ones to actually make the observations to timekeeping, marking the calendar, doing mathematical calculations, or making instruments. Additionally the Astronomical Bureau could make use of an observatory. And what’s more, throughout much of Imperial China, the astronomers had not just one, but two observatories at their disposal. One of these observatories was located within the imperial palace, and the other was some distance outside. To ensure that the data that the astronomers collected was trustworthy, data collected from each observatory would be compared to the other, and only if the two observations agreed would the data be recorded. So we see from a relatively early time that some amount of skepticism was applied to observational data in Chinese science. Now, while this was a good way to structure the data collection process to reduce the chances of mistakes, like any system it was not infallible, particularly when scientific fraud was involved. By the 11th century AD the standards within the Astronomical Bureau had become, shall we say, lax. An astronomer named Pheng Chheng was appointed to the post of Imperial Astronomer, and was apparently the first Imperial Astronomer in some time to take his job as an actual astronomer seriously. As Pheng Chheng was taking stock of the procedures of the astronomers he was now responsible for he became alarmed at what he saw. Apparently, rather than checking to see if the observations between the two observatories agreed and rejecting data that did not, the two observatories were just copying each others’ records. To make matters worse, they generally did not even bother to make any observations at all. To record the positions of the planets they would just use a rough algorithm to calculate where the planet should be, rather than observing it for themselves. After taking over, Pheng Chheng had six astronomers punished and tried to instill better standards in the remaining astronomers, but apparently felt that he did not make much progress. His successor, Shen Kua, was another capable astronomer and bemoaned the poor quality of the astronomers that were under him. To try to find astronomers who knew more about astronomy, he tried to get the entrance exam to the imperial bureaucracy to incorporate more astronomy. He did indeed succeeded in getting more astronomy questions added to the exam, but to his dismay, the examiners themselves knew nothing about astronomy, so they just graded the candidates on the quality of their prose rather than whether or not their answers made any sense. Now, one thing which should be mentioned is that while astronomy was a prestigious occupation in Imperial China, probably more so than most other cultures throughout history, it was by no means the most prestigious place you could be in the Chinese bureaucracy. From the early 1st century AD onward, the top school for aspiring bureaucrats to study at was the Taixue, which is usually translated to Imperial Academy. Initially the Taixue offered only two degrees, both in the classics, but around seven centuries later the university had expanded and began to offer four more degrees. One of these, called Ming Suan, was in mathematics, and was the most relevant course of study for anyone hoping to become an astronomer. But the Ming Suan degree was by far the least popular of the degrees offered at the Taixue, because students judged that it was the least likely to lead to a high position in the bureaucracy. After all, even though the emperor employed hundreds of astronomers, the imperial bureaucracy was vast, and the Astronomical Bureau was just a tiny sliver of the overall organization. That said, astronomy was not the only way that a graduate who held a degree in Ming Suan could use their knowledge of mathematics. Mathematics was needed for the design of public works and in military engineering. Merchants, of course, needed some amount of mathematics, too. But none of these occupations were as prestigious as that of astronomer, and there were, in turn, many more prestigious occupations than that which required no knowledge of mathematics at all. Now, a perhaps ironic consequence of the high status that astronomy held in Chinese society throughout its long history is that it ended up limiting our knowledge of it. Thanks to its proximity to the Emperor and its importance for assessing the state of the world and making predictions of what was to come in matters of state, knowledge of astronomy was held as a state secret. In fact, the fundamental role that astronomers had in setting the calendar was seen as one of the essential symbols of imperial power. The nearest analog to this in Western civilization is maybe the authority to mint coins with the image of the monarch. Just as a new Roman emperor would begin replacing the old coins that bore the image of the face of his predecessor with new coins that had his own visage on it, when there was dynastic upheaval in China and a new dynastic line was established, one of the first things that the new emperor would do to assert his authority would be to issue a new calendar. If you recall back to Episode 26 when I talked about the relationship between astrology and the Roman state, there are some parallels between the role that astronomy played in both societies. Particular omens could be seized upon by rebels to rally support for their cause. Due to this sensitivity, astronomical knowledge was kept as a closely guarded secret. A 10th century history called the Chiu Thang Shu, or Old Book of Tang, described one of the orders that an emperor issued to ensure that his astronomers would maintain appropriate secrecy: In the twelfth month of the 5th year of the Khai-Chhéng reign-period (+840) an imperial edict was issued ordering that the observers in the imperial observatory should keep their business secret. ‘If we hear’, it said, ‘of any intercourse between the astronomical officials or their subordinates and officials of other government departments or miscellaneous common people, it will be regarded as a violation of security regulations which should be strictly adhered to. From now onwards, therefore, the astronomical officials are on no account to mix with civil servants and common people in general. Let the Censorate look to it.’ So in certain periods not only were astronomers forbidden from sharing knowledge of astronomy with anyone outside the Astronomical Bureau, they were not allowed to interact with them at all. This secrecy has unfortunately limited our present day understanding of what China’s astronomers were up to for all those centuries. Astronomical texts and records were generally restricted to government archives, and because only a relatively small number of people needed to access them, there tended to be very few copies of these works. So, when there were accidents, or, more commonly purges after a dynastic change, it was unfortunately easy for astronomical works to get lost or destroyed. By contrast the field of mathematics was much less sensitive. The knowledge was more widespread and there were many more copies of the relevant works. Consequently, despite its lower status, the textual history of Chinese mathematics is much more complete than it is for astronomy. But one of the more important texts for the early history of Chinese astronomy that did survive is called the Lushi Chunqiu, or Master Lu’s Spring and Autumn Annals. The work was an attempt to compile a comprehensive collection of all the knowledge of the day and is unusually long relative to the other Chinese classics, totaling more than 100,000 words. The work was written shortly before the end of the Warring States Period and the establishment of the Qin Dynasty. You may recall from last episode that the first emperor of the Qin Dynasty, Qin Shi Huang, was an ardent believer in the political power of ideas and wanted intellectual life to be under his control. As part of his project to c"
