title = "The Song of Urania Podcast"
description = "The oldest plausible astronomical artifacts known are African, as are many of the oldest megaliths, around 10,000 of which dot the Sahara and whose orientations are astronomical in character. We then briefly survey some of the creation stories and sky myths from a number of the peoples of sub-Saharan Africa. Finally, we turn to a few of the more unique calendars in the region."
full_description = "Episode 29: The Astronomy of Saharan and Sub-Saharan Africa May 10, 2023 The oldest plausible astronomical artifacts known are African, as are many of the oldest megaliths, around 10,000 of which dot the Sahara and whose orientations are astronomical in character. We then briefly survey some of the creation stories and sky myths from a number of the peoples of sub-Saharan Africa. Finally, we turn to a few of the more unique calendars in the region. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon, or thereabouts. My name is Joe Antognini. Well last episode we started our grand tour of the astronomy of the globe with the astronomy of prehistoric Europe. In this episode we’ll now travel south of the Mediterranean and take a look at the astronomy of Africa. If I were starting this podcast all over again I’d probably begin here rather starting with the astronomy of ancient Mesopotamia. After all, humanity originated in Africa so unsurprisingly the oldest astronomy is African. But as we saw last episode in the astronomy of prehistoric Europe, the longer back in time we look, the more speculative our knowledge becomes. So we will begin with some of the oldest and most tentative connections to astronomy and then see how various modern groups practice astronomy, at least around the time of colonization when more definitive records start to survive. But before we get into the astronomy proper, it would be worth spending a little bit of time getting familiar with the geography and population history of Africa. Africa sits rather symmetrically about the equator and so its climate going north to south exhibits a certain symmetry about the equator. Going from north to south, the northernmost strip of Africa is really quite distinct from the rest of the continent. I titled this episode the astronomy of Saharan and Sub-Saharan Africa because culturally North Africa bears more of a connection to other Mediterranean cultures along with the cultures of Arabia. South of this strip is the vast Sahara desert, which is a bit of a redundant name since Sahara simply means “desert” in Arabic. Technically the Sahara is only the world’s third largest desert, but that is only because Antarctica and the Arctic both count as deserts. But of the hot deserts the Sahara is by far the largest, being more than three times larger than the next largest desert in Australia. The Sahara is probably the most important geographical feature of Africa, at least in terms of the histories of the people who have lived on the continent, because it severely limited the extent of cross-cultural connections between Africa and the rest of the Eurasian landmass. The Sahara sits at around 30 degrees of latitude which is where the Hadley convection cells in the atmosphere at tropical latitudes meet with the Ferrel cells at the temperate latitudes. Where they meet are the so-called “horse latitudes,” and there is little large scale atmospheric activity there. Consequently these latitudes tend to be characterized by low wind and low precipitation. Now, the Sahara is not totally inhospitable. Since ancient times there has been a network of trade routes that have criss-crossed the desert. But to make the trek worth it, only very high value goods would be moved across the desert, and historically the major ones were gold, salt, and slaves. Just south of the Sahara is a band of temperate climates called the Sahel, and here agriculture is possible. Unlike the Mediterranean climate to the north, the Sahel sees its big rains during the summer rather than the winter, so crops that do well in the Mediterranean tend to fare poorly in the Sahel and vice versa. Moving further south is a band centering on the equator where the climate is, unsurprisingly tropical and is characterized by dense rainforests. Then moving further south still there is a similar pattern of climates but roughly in reverse. South of the rainforests the climate becomes more temperate with the famous African savannas. At around 30 degrees latitude south of the equator you hit the horse latitudes again and there is another large desert, the Kalahari desert, Kalahari deriving from the Tswana word for “great thirst.” And the southernmost strip of the continent once again has a Mediterranean climate. Apart from this north-south variation in climate, geologically there is a substantial east-west variation, sweeping from around Namibia in the southwest, and then north and to the east up through Ethiopia. The northwestern half of the continent is geologically older, relatively flat and low-lying. The eastern half is younger, more geologically active and generally at higher elevations. On the eastern side of the continent is where the African plate meets another tectonic plate, the Somali plate. These two plates are separating from each other, the African plate drifting west and the Somali plate east. The long boundary between the two forms the so called Great Rift Valley, and along this strip running north to south on the eastern side of the continent there is a string of large lakes, called, uncreatively, the Great Lakes. This geography played an important role in determining how Africa has the population distribution that it does today. Now Africa is very large and very diverse, there are more than a billion people who live there and some 2000 languages. But the populations of Africa can be grouped into five very broad families, largely based on their language families, but also from genetic and cultural markers as well. The first of these are those who speak languages from the Afroasiatic family. This population is distributed throughout North Africa, the Sahara and to some extent the Sahel, and northeastern Africa. For those of us with a Western background, the best known branch of the Afroasiatic languages would probably be the Semitic languages, Hebrew, Aramaic, Akkadian, and so on. But around half of the Semitic languages are African and in fact the Semitic languages are actually the only branch of the Afroasiatic family that extended out of Africa. The second major family is the Niger-Congo language family. This family developed in West Africa and saw a rather remarkable expansion. Around 4000 BC or so agriculture was independently developed in West Africa by people who spoke Niger-Congo languages. This may have been by peoples who spoke languages from the Bantu branch in particular, or perhaps their neighbors. But either way, not too long after, thanks to this new technology speakers of the Bantu branch of the Niger-Congo family then were able to rapidly expand from around modern day Cameroon to almost the entire continent, to the Indian ocean in the east and all the way down south to the Cape of Good Hope. Today almost everybody south of the equator in Africa are descendants from this Bantu expansion. In this process of expansion, the Bantu peoples encountered and largely overwhelmed two other groups, who were hunter-gatherers. At the equatorial latitudes there’s the Pygmies. These groups were heavily fragmented by the Bantu expansion and unfortunately their indigenous languages mostly died out, apart from loanwords which persisted into the Bantu languages that they now speak. The other group is indigenous to the southern latitudes. Anthropologists broadly call this group the Khoisan because the group consists of two main parts, the Khoikhoi, who are pastoralists, and the San, who are hunter-gatherers. Now a word about nomenclature. The words for these two groups, the Pygmies and the Khoisan are not great. In the case of the Pygmies they generally consider the term to be pejorative, and in the case of the San, the word derives from a Khoikhoi term which is pejorative in that language. But these groups have only native words for their individual ethnic groups like the Mbuti and Twa among the Pygmies or the Kung and Ju’hoansi among the San. Because they have no word that refers to the collection of these groups there hasn’t been any obvious alternatives, so the terms have persisted in the literature. At any rate I will follow the lead of the anthropologists here and refer to them by the standard terms Pygmy and Khoisan. As an aside, the Khoisan is a particularly fascinating group linguistically. The Khoisan languages are unique for including a wide variety of clicks as phonemes. And in some cases some members even speak a second language consisting entirely of clicks which are used for hunting since those sounds are less likely to alert their prey to their presence. Khoisan languages influenced some of the Bantu languages in southern Africa like Xhosa, which adopted some of the click phonemes in Khoisan languages. The Khoisan and Pygmies are also particularly notable for their genetic diversity. Roughly speaking, if you were to look solely at people’s genomes, you would divide the human population into three broad categories: one group with extremely high genetic diversity, another group with moderate genetic diversity, and a third group with relatively little genetic diversity. Of these three groups the third is by far the largest. Everybody whose recent ancestors originated outside of Africa, some 7 billion people, have relatively low genetic diversity. The second group, those of moderate genetic diversity, consists of the vast majority of the roughly one billion people whose recent ancestors originated in Africa. The last group, those with high genetic diversity, number only about a million and consist of members of the Pygmy and Khoisan. The scale of this difference is really rather astonishing. If you were to take two people at random from the low diversity group halfway around the world from each other, say a Norwegian and a Navajo or an Indonesian and a Spaniard, and you compared the similarity of their DNA, and then you did the same for two Khoisan people living 100 miles apart, you would find that the DNA between the two Khoisan people has 20% more differences than the DNA between the Norwegian and the Navajo or the Indonesian and the Spaniard. Most of the human population descended from a group that underwent two major population bottlenecks, one of which seems to have been particularly severe. During this bottleneck, the population that expanded out of Africa seems to have been reduced at one point to a few tens of thousands of individuals, or possibly even as few as a few thousand. Another, less severe, bottleneck seems to have occurred somewhat earlier when humanity was still in Africa and accounts for the reduced genetic diversity of most of the African population. What exactly these events were has been the subject of some speculation. A leading theory of some time was that most of humanity died off in the aftermath of an eruption of a supervolcano in Indonesia 75,000 years ago, though more recent evidence has cast doubt on this hypothesis. But at any rate both these events occurred after the Pygmies and Khoisan split from the rest of humanity likely more than 100,000 years ago, so these groups have retained a much higher genetic diversity. Well, I told you that there are five language families in Africa, and we’ve now seen the Afroasiatic, Niger-Congo, Pygmy, and Khoisan. But there is one more which we will not look at until a later episode. This is the Indonesian language family which is present in Madagascar. Perhaps surprisingly, the people of Madagascar are a mix of native Africans and Indonesians who 1500 years ago migrated some 5000 miles west. As Jared Diamond put it, it’s as surprising as if Christopher Columbus had crossed the ocean blue and when he got to the Bahamas, he had discovered that Swedes had been living there for a millennium. As such, culturally the astronomy of Madagascar belongs more properly with the astronomy of Oceania which I’ll cover in a later episode. Okay, so with that survey of the geography and people of Africa we can now dive into the astronomy proper a little bit more. As I mentioned at the outset, the history of the oldest astronomy is necessarily a history of African astronomy, so it should be no surprise that the oldest artifact which is plausibly astronomical in character is African. This is a bone found in modern day Eswatini called the Lebombo bone. The Lebombo bone dates back around 43 to 44 thousand years ago and is what is called a tally stick. Tally sticks are some of the oldest human artifacts around and are bones with a series of notches in them that appear to have been used, as the name implies, as an aid for counting. Tally sticks have fairly regular notches grooved into them, suggesting that they were made deliberately, rather than just random notches that might have come about when someone was carving up some meat. The Lebombo bone is the oldest definite tally stick and it has 29 notches grooved into it. A careful analysis of these notches suggests that the notches were made with different tools, which in turn implies that they were probably made at different times rather than all at once. As I mentioned in the last episode, anytime you see an artifact with the number 29 it’s maybe not definitive evidence that the artifact is astronomical in nature, but it is certainly wriggling its eyebrows suggestively since this is roughly the number of days from new moon to new moon. There is a younger, perhaps more sophisticated artifact, called the Ishango bone, that was discovered in the modern day Democratic Republic of Congo. This tally stick is about 20,000 years old and has three columns of tally marks, one with 48 tallies, and the other two with 60 tallies apiece. The columns then seem to be grouped into a series of smaller subdivisions, but what the meaning of these divisions is is not obvious. Some scholars have pointed to the number 60 that appears twice as being evidence of an astronomical connection since this is roughly the number of days in two lunar months, but at least to me the connection seems forced. Others have pointed to the groupings of the tallies in the third row, which are 19, 17, 13, and 11, which are all the prime numbers between 10 and 20. But this seems to be the sort of artifact that a sufficiently motivated scholar can massage whatever explanation they want to fit the data. Almost certainly the original purpose of this artifact has been lost to time. Well the next oldest examples of interest in the heavens in Africa comes from the rock art of the Khoisan, the oldest examples of which dates back around 26,000 years, long enough ago that Polaris was once again the north star. These paintings generally depict groups of people, usually drawn in a highly elongated way, along with animals. But among some of these paintings there are celestial bodies, particularly the Sun and Moon. And some even appear to depict comets or meteors, drawn with a dot surrounded by a halo and possessing a long tail. Though as always wit"
