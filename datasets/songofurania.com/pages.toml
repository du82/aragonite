title = "The Song of Urania Podcast"
description = "India developed one of the most advanced astronomies of any of the ancient cultures, even rivaling European astronomy in its accuracy by the 18th century. We look at how the geography of India influenced its history and then turn briefly to the little we know about the astronomy of the Harappan Civilization. Finally we end with the astronomy of the Rigveda."
full_description = "Episode 34: What Happened in Harappa September 30, 2023 India developed one of the most advanced astronomies of any of the ancient cultures, even rivaling European astronomy in its accuracy by the 18th century. We look at how the geography of India influenced its history and then turn briefly to the little we know about the astronomy of the Harappan Civilization. Finally we end with the astronomy of the Rigveda. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini Well last month we took a bit of a detour in the overall narrative of the podcast in honor of the first blue moon this podcast has seen, at least according to one definition of blue moon. But now we’re back to a normal full moon, a harvest moon, specifically, so it’s time to jump back into it. But before I do, I did want to issue a mea culpa. I had actually meant to do this in the last episode, but I got so carried away with the blue moon that it slipped my mind. Two episodes ago, in the last episode on Egyptian astronomy, I told you that the Egyptians used a ratio of 7:6 for the length of the night between the winter solstice and summer solstice. That part was correct, but I then compared them to the Babylonians and told you that the Babylonians used a ratio of 2:1. I’m afraid that I rather threw the Babylonians under the bus here, because in fact they used the ratio 3:2, which is still way off, so my point still stands, but isn’t quite as egregiously wrong as 2:1. My apologies. With that embarrassing start out of the way, in the next few episodes we’ll take a look at the astronomy of ancient India. As you may know by now, when I’m starting to learn about a civilization, I like to start with the geography of the land it inhabited because, while geography doesn’t determine everything, it still determines a heck of a lot. It tells you where people tend to live, which neighbors they tend to interact with, and which neighbors they don’t, what they eat, what kinds of things they can build, and on and on. And, of course, as with everywhere else, geography is important to understand India. Probably the most notable feature of Indian geography is that although it’s attached to the Eurasian landmass, it’s nevertheless relatively isolated from the rest of it. And, in fact, the reason for this is that that’s the way it was originally. What we call the Indian subcontinent was originally an isolated, island landmass a hundred million years ago. But, thanks to the inextricable work of plate tectonics, about 55 million years ago, 10 million years after the extinction of the dinosaurs, the Indian subcontinent collided with Eurasia. This collision formed the Himalayas and is still ongoing, pushing these mountains yet higher, by about half a centimeter per year, or about half a meter per century. So, certainly the most important geographical fact about India is that almost its entire northern perimeter is bounded by what is perhaps the most formidable mountain range in the world. At the eastern edge of the Himalayas there is a gap between the Himalayas and the Bay of Bengal, but this area has a lesser mountain range called the Arakan Mountains, and it’s also carpeted in dense jungle which makes passing through it difficult. So the main point of contact between India and the rest of Eurasia has been from its northwest, though even here the route is beset by desert and highlands. The main consequence of all this is that over the centuries, India was mostly, but not completely, isolated from the other civilizations on the continent. It was safe from invasion from the north and east, but suffered from invasions from the west every now and again. Within India itself the two most prominent features are again thanks to the Himalayas. The weather from the Indian Ocean brings moist air across the subcontinent, and when it hits the Himalayas it rises up, condenses, and precipitates as snow. Later on this snow melts and runs down the mountains. The runoff bifurcates, with runoff from the western range ultimately draining into the Gulf of Arabia, and the runoff from the eastern range ultimately draining into the Bay of Bengal. But in this process they form two large river valleys: the Indus in the west and the Ganges in the east, which are together known as the Indo-Gangetic Plain and form a kind of inverted “v” to the south of the Himalayas with the two separated by the Thar desert to the east of the Indus river valley. Historically, the bulk of India’s population and the center of power has resided in these two river valleys in the north of the country under the shadow of the Himalayas. The Himalayas have impacted India in other ways as well. If you look at the latitude of these river valleys, they’re not quite tropical. Delhi, for instance, sits on the western edge of the plain associated with the Ganges river, and its latitude is 28 degrees, roughly the same latitude as Orlando, Florida. But India’s weather tends to be far more tropical than you would expect from the latitude alone because the Himalayas block winds from the north from bringing in cool air, and simultaneously trap moist air from the south. South of the Indo-Gangetic plain, the terrain is more rugged with a rocky highlands called the Deccan Plateau and which is itself surrounded by a number of lesser mountain ranges, the Vindhyas and Satpuras to the north, the Western Ghats to the west, and the Eastern Ghats to the east, the two of which nearly meet at the southern tip of the subcontinent. The main consequence of this is that travel in south of the country has historically been more difficult. Not impossible, just slower, so the south of the country is culturally and linguistically quite distinct from the north. But, to see how these cultural and linguistic distinctions developed, we’ll now have to turn to the history of the people of India itself. And here, again, probably thanks to its geography that limited contact with the outside world, India is rather unique among large-scale civilizations in that in several fundamental ways, there is a strong continuity between the India of 1500 BC and the India of 2000 AD, particularly in the rural areas. There are only a couple of other large civilizations that can make a plausible claim to that kind of continuity over the millennia, with China being the other main example. By contrast, if we look at some of the civilizations we’ve already covered, there really isn’t too much of a resemblance between the Egypt of 1500 BC with modern day Egypt apart from the fact that the two civilizations lived in the same spot. The language changed, the religion changed, the social structures changed, and on and on. Same with the Babylonians. Apart from living along the Tigris and Euphrates, they don’t really share anything in common with modern-day Iraqis, and even here, the land that the Babylonians worked was quite different from modern day Iraq, it was much more fertile 4000 years ago. Modern day Greeks at least speak the same language as their ancient forebears, but of course none of them are worshipping Zeus and Hera. But if we look back to ancient India, we see a culture that is quite recognizable to the culture of today. Now, India was first populated quite early on, probably sometime between 80,000 and 40,000 years ago, though possibly even earlier. But as with everywhere else on the globe, during the paleolithic these original inhabitants were hunter-gatherers. The first agricultural civilization to develop in the region formed in the Indus river valley, and has come to be called the Harappan Civilization, after one of its major cities, Harappa, though it also goes by the more generic name, the Indus Valley Civilization. The Harappan Civilization started to coalesce around 3300 BC, and as with the development of Egyptian civilization along the Nile, its suspected that one of the main drivers of migration into the river valley was desiccation of the surrounding regions. The Harappans seem to have learned from their neighbors to the west in the kingdom of Elam who in turn had learned from their western neighbors in Mesopotamia. As an aside, you may remember from the earlier episodes on Mesopotamia that to the Babylonians, Elam represented the farthest known land in the east. Nevertheless, even though the Babylonians didn’t know about the Harappans and vice versa, through this kind of daisy chain, agricultural innovations in the fertile crescent were able to spread into India. Now, while the Harappans were happy to have learned some things from the Mesopotamians, they came up with a few tricks of their own. One of the more important of these was the invention of fired brick. The Mesopotamians built their structures out of mud bricks, which are made by mixing clay-rich earth with water to make mud, and usually adding in something like straw to help bind it together. You then form the mud into the shape you want, and leave it out to dry in the sun for a few days and then you have your brick. Now, this worked well enough for the Mesopotamians, but mud bricks have a few problems. The first is that, as far as bricks go, they are relatively brittle. But the other issue is that it really works best in hot, dry climates, where the Sun can really do its work to dry it out. But the Indus Valley is somewhat more humid, so drying bricks in the Sun was more challenging. The Harappans figured out that if they dried their bricks in an oven, not only did they solve their problem with humidity, the bricks also became much stronger as a result. This allowed them to engage in durable large scale construction in a region that lacked stone. The Harappans really started building around 2600 BC or so, and the cities they built were really quite impressive for the Bronze Age. Harappa and Mahenjo-Daro are the two largest cities they built and are estimated to have housed between 30,000 to 60,000 people. There was evidently also some sort of large scale governance among the Harappans, because the cities are also remarkably ordered. The roads were clearly planned, with wide avenues forming orderly grids. Perhaps the highest sign of the sophistication of their civilization is that on many streets nearly every home had an indoor bathroom that connected to the municipal sanitation system. Now, unfortunately there is quite a bit that we don’t know about the Harappans, and this includes virtually everything about their astronomy. Really there is only one thing we can say about it for certain, but before I can mention that I’ll have to talk about its decline. Harappan civilization flourished for around 600 years, and then starts to disappear around 1800 BC. The cause is not known for certain, but two major developments almost certainly contributed. The first is climate change in the region. A common problem for many river valley civilizations is that rivers carry silt from upstream and deposit it downstream. Over the centuries this silt buildup causes the river bed to become more shallow, which leads to more frequent flooding. So there is some evidence that floods along the Indus river became a problem for the Harappans towards the end. Along with flooding, the Harappans also seem to have caused some trouble for themselves by overlogging the surrounding forests, and this deforestation was probably exacerbated by increasing desiccation. But beyond the climate related problems, the Harappans also had to deal with a more man-made threat, the arrival of a new people, generally referred to as the Aryans. Now, if we’re being pedantic, the term Aryan isn’t really an ethnic term so much as a linguistic term in the same way that Indo-European really refers to a language family rather than a group of ethnicities. But technicalities aside, the people that show up on India’s doorstep around 1750 BC are almost universally referred to as the Aryans. The Aryans are the people that largely populate modern day India, particularly in the north. Not as much is known about the origins of the Aryans as we would like, but what is known is that they originated in Central Asia in the southern Eurasian steppe. The Aryans were probably originally associated with a culture known as the Sintasha culture who were located around the border between modern day Kazakhstan and Russia. They were a pastoral people and, at least based on the archaeological remains, quite warlike. In fact, these predecessors of the Aryans have a strong claim for being the inventors of the chariot since the oldest known artifacts of chariots come from Sintasha sites. Well, as pastoralists, they were naturally fairly migratory, and maybe around 2000 BC or a bit later, a group of them split off and began to migrate south. During this period of migration, they passed through another culture, designated the Bactria-Margiana culture in a part of central Asia that is modern Uzbekistan and Turkmenistan. They appear to have assimilated a few religious practices from the Bactria-Margiana peoples, and continued their migration. Some of them split to the west, and eventually made their way to all the way to Syria where they formed the Mitanni kingdom, which was a rather obscure Mesopotamian kingdom, unless you’re really deep into Mesopotamian history. But the other branch of the Aryans migrated south and east, through what is modern day Iran, Pakistan, and ultimately into India. Now, what the arrival of this wave of newcomers looked like in India is not entirely certain. We can imagine that it may have involved a lot of bloodshed, but the evidence is more circumstantial than we would like. Some scholars, for instance, pointed to the discovery of skeletons in the streets of the city of Mohenjo-Daro that appear to have trauma. But later analysis found that the skeletons were put there long after the cities had been abandoned, and the trauma on the skulls was due to erosion rather than from battle. Some of the passages of the Rigveda, about which I’ll have more to say in a bit, also describe invasion and conquest, and if you squint it’s possible that certain details may be referring to Harappan cities. But all we can say for sure is that the Harappan civilization collapsed by around 1600 BC, and around that time the Aryans have shown up. For what it’s worth, the original inhabitants don’t seem to have died out entirely, and today it’s believed that their descendants make up a group called the Adivasi, which in Sanskrit literally means “original inhabitant.” That said, the poverty and low social status of the modern day Adivasi suggests that the people of the Harappan civilization seem to have gotten the worse end of things upon the arrival of the Aryans, because once things shook out, it was the Aryans who were on top, and early on a set of rules emerged which codified these social stratifications, in what evolved into the caste system. In fac"
