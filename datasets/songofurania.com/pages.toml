description = "Before leaving the world of the Pre-Socratics, we look briefly at the astronomy of Oenopides, which had a more observational character than many of his contemporaries. Then we turn to Plato, the first of the great astronomers in the Socratic tradition, whose astronomy synthesized the best ideas of his predecessors."
full_description = "Episode 15: On Plato's Broad Shoulders March 22, 2022 Before leaving the world of the Pre-Socratics, we look briefly at the astronomy of Oenopides, which had a more observational character than many of his contemporaries. Then we turn to Plato, the first of the great astronomers in the Socratic tradition, whose astronomy synthesized the best ideas of his predecessors. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well, over the last eight episodes, I have tried to lead you, dear listener, through the development of Greek astronomical thought, starting with the mythological and poetic cosmologies expressed by Homer and Hesiod, along with the variety of Greek myths, and then moving through the philosophers of the first philosophical school in ancient Greece, the Ionian School. As Miletus came to occupy a more important position in Greek culture, the ideas of the Ionian philosophers came to spread to other Greek colonies and we traced the development of other schools of philosophy, the Pythagoreans, the Eleatics, and, in the last episode, the atomists. These are all philosophers which have been scandalously lumped together as the “pre-Socratics”, but, despite the title of this episode, there is one last pre-Socratic astronomer whom I would be remiss to omit before we make that irreversible leap out of the realm of the pre-Socratics. So, my apologies for the bait and switch, but before we get to the main subject of this episode, Plato, I want to talk briefly about an astronomer by the name of Oenopides of Chios. Oenopides doesn’t neatly fit into any of the schools that we’ve followed in the past eight episodes, so at least in this telling, he is something of an appendix to the broader narrative. But, he made several important discoveries and was influential among ancient Greek astronomers so it is worth spending a few minutes to recount his greatest hits. We don’t know very much about Oenopides’s life, basically just that he was active in the middle of the fifth century BC, probably living from around 490 to 420 BC, so roughly contemporaneous with Anaxagoras and Leucippus and living right during the time that Athens was becoming a political and cultural powerhouse in ancient Greece. Oenopides was born on the island of Chios, but not much is known for certain about his subsequent whereabouts. There is a tale which by know I’m sure you’re familiar with that he traveled to Egypt and there learned the secrets of astronomy and mathematics from the Egyptian priests. And he probably spent some time in Athens as well. But apart from that there is really nothing more to say about his life. So all that does survive are his astronomical and mathematical discoveries. Of his astronomical discoveries there are two of note that have come down to us. The first of these is the “discovery” of what is called the obliquity of the ecliptic. Now, one of the disadvantages of conveying this information in podcast form is that you cannot see the air quotes around the word “discovery.” Because the obliquity of the ecliptic was at this time well known to the Babylonians, as well as the Indians and Chinese, and, in fact, later on the Egyptian priests, apparently anxious to maintain their priority in this discovery, claimed that Oenopides had learned of the obliquity of the ecliptic from them. But he was the first of the Greeks to notice this. The phrase “obliquity of the ecliptic” will come up again and again over the course of this podcast series so we had better get to know it, but it’s just an overly fancy way of saying that the ecliptic, the path that the Sun takes across the background stars over the course of a year, is tilted with respect to the direction that the stars rotate every night. In our modern model of the solar system this is at root due to the fact that the Earth’s axis of rotation is tilted with respect to its orbit around the Sun by an angle of about 23 and a half degrees. This tilt gives us the seasons since the Sun is higher in the sky in the northern latitudes during the summer and lower in the sky during the winter. Now, on the one hand if you are tracking the positions of the Sun and planets with any sort of attention, this is not an especially difficult observation to make. Measuring the exact angle of the ecliptic with respect to the motion of the background stars is a little more difficult, but just noticing that there is an angle doesn’t take too much work. But that said, at this point in the podcast, nine episodes into Greek astronomy, you will probably have noticed that Greek astronomers up to now were not all that interested in anything more than a cursory observation of the heavens. They got their kicks debating with each other about the fundamental nature of matter and how the universe was created. I specifically tried to highlight occasions where they pointed to physical evidence, like Xenophanes noticing that there were seashells up on mountains, because these were the exception rather than the rule. But, unlike many of his contemporaries, Oenopides bothered to look up at the heavens and note carefully what he saw. We could plausibly make the case that he was the first observational astronomer of ancient Greece. Now, it seems that Oenopides did not really go any further with this discovery than noticing that the ecliptic was inclined with respect to the celestial equator. There isn’t any evidence that he went so far as to actually measure what that angle was. But, later authors, who are the only ones who preserved Oenopides’s work for posterity, stated that other astronomers, unnamed of course, had later gone and measured this angle and found it to be 24 degrees. Actually, these authors did not put things in a way that is quite so clear to us moderners. What they really said was that this angle was given by the angle subtended by the side of a regular pentadecagon inscribed in a circle, and this angle happens to be 24 degrees. In fact, if you read Euclid’s Elements, Book 4 goes through methods to construct various regular polygons. Euclid demonstrates a method to construct a square, a four sided polygon; a pentagon, a five-sided polygon; and a hexagon, a six-sided polygon. Then he jumps all the way up to the pentadecagon, a 15-sided polygon and that’s the last polygon he shows you how to construct. It’s speculated here that Euclid highlights the construction of the pentadecagon in particular due to its importance for astronomy since its internal angle of 24 degrees approximated the observed obliquity of the ecliptic. Oenopides was also noted for one other result which is his measurement of the Great Year. Now, a great Year has various meanings in astronomy and so is pretty context dependent, but the underlying idea is that the motions of the Sun, Moon, planets, and stars all repeat with different periods, and over long enough times these cycles all eventually repeat themselves. So, you could make the case that the Saros Cycle that the Babylonians discovered is a sort of Great Year. You might recall that this is a period of about 18 years after which eclipses roughly recur. Well Oenopides’s Great Year was 59 regular years. Unfortunately the later authors who recorded Oenopides’s work didn’t actually explain why he arrived at 59 years, so modern historians of astronomy have had to do some reverse engineering to work out what this number was supposed to represent. The basic idea is that if you assume a year to be 365 days and a lunar month to be 29 1/2 days, both of which are decent approximations, then you will find that 59 years is exactly 720 lunar months. So this is the smallest amount of time it takes to get an integer number of lunar months to fit in an integer number of years. After a Great Year you’ll find that the same lunar phases happen at the same time of the year. Now, it seems that Oenopides went a little further than this, too, and tried to use his Great Year to measure the length of the regular year more accurately. To get at his initial guess of the Great Year he started with the assumption that the year is exactly 365 days. But of course we know that it’s closer to 365 and a quarter which is why we add leap days once every four years, or almost every four years anyway. So Oenopides very likely looked at calendrical data to see how many months had actually occurred in 59 years since new months happened at the new moons. From this he found that in this 59 year period, there had been 21,557 days instead of the 21,535 days which you would have gotten if the year were exactly 365 days long. Then he just divided that number of days by 59 and concluded that the year was 365 days and 22/59 of a day, or about 365.37 days long. This is a bit of an overestimate, but is closer to the true value of about 365.24 days than 365 was exactly. Now I’ll qualify this once more by saying that this is all reverse engineered. We know that he said that the Great Year is 59 years and that the length of the year is 365 days and 22/59ths. But the methodology is essentially reverse engineered to figure out how he could have arrived at those numbers. Well, Oenopides’s work wasn’t limited to astronomy. He was apparently a very talented geometer as well. It’s believed that two proofs in Euclid’s Elements were first discovered by him. One of these is Proposition 12 which asks how to draw a line that is perpendicular to a given line and passes through a given point. And, probably even more influential than that was his rule that the only instruments allowed in geometry were the straightedge and compass. So you could draw a line between two points and draw a circle around a point, but you could not do anything else like break out a ruler or a protractor when trying to square a circle or trisect an angle. This rule became codified in the axioms of Euclid’s Elements, and from thereon, for millennia, geometry became synonymous with straightedge and compass constructions. Well, those are, in sum, the highlights of Oenopides’s professional work. And we can see that his work is really quite different in its overall character from the other Greek philosophers I’ve discussed to date. Rather than being the last of the pre-Socratics, as I’ve presented him here, he really fits in more as a herald of the astronomy to come about a century later. Rather than speculating on the nature of matter and telling tales about how the universe was formed, Oenopides’s astronomy feels rather more hard-headed and a bit closer to what we call science today. He was observing things and making calculations. Now, I don’t want to get too carried away here and claim that Oenopides was the first true scientist or something like that. He retained some of the mythological character of the astronomy of his day. He posed an explanation of the Milky Way that the Sun originally moved through the Milky Way. But, then there happens an event that involves yet another figure, in this case Atreus, killing someone’s sons, and then serving them during a feast to the unsuspecting father, in this case Thyestes. After seeing this, the Sun became so appalled that it changed its path in the sky, leaving the Milky Way as a remnant of where it had once gone. So in this history of Greek astronomy we now have come across cannibal feasts on three separate occasions. I will leave it to a Freudian psychologist to attempt to comment on what it says about the Greek psyche that this kind of story shows up with this frequency in Greek history and mythology. Anyhow, all this is to say that while the flavor of Oenopides’s astronomy is overall more rigorous than the astronomy that came before it, we should not imagine him to have been a 21st century astronomer plucked from modernity and transplanted into ancient Greece. Like those that came before him he had thoughts about the nature of the arche for example, he thought that it was fire and air, but he at the same time was more interested in measuring periodicities in the heavens and in observing what was going on in the heavens than his predecessors generally were. So he is very much a transitional figure in that regard. Well, at long last we have done it. We have exhausted the pre-Socratics. But hopefully we are not exhausted as well. Because now it’s time to move beyond to the Socratics. But before we do, one thing I do want to make clear is that the term pre-Socratic isn’t exactly a chronological classification. Of course the vast majority of the pre-Socratics were active before the time of Socrates which is why they get their name, but as a term it really also has much do with the kind of philosophy that they were interested in rather than a strict chronology. So there are later pre-Socratics who were active after the time of Socrates, some of whom we’ve already talked about, like Philolaus the Pythagorean. But a major feature of pre-Socratic philosophy is the subjects we’ve been talking about up to now. Their interest in natural philosophy, cosmology, cosmogony and so on. Of course this wasn’t all they were interested in, many of them had things to say about ethics and epistemology and how to live the good life and we saw some of that in our exploration of them. But, now that we have said as much as I want to say about the pre-Socratics it’s naturally time to move on to the broad grouping of the Socratic philosophers. And the first of these that we’ll look at is none other than Plato. Now, it admittedly feels a little odd for me to make this leap from the pre-Socratic into the Socratic philosophers and in so doing just casually hop right over the man of the hour, the great Socrates himself. But there are two problems with Socrates from our perspective, if I can be so bold. The first is that we don’t know of anything he said about astronomy, so his realm of inquiry was somewhat tangential to ours. And, as by now I’m sure you’re aware, I like to keep this podcast laser focused on the history of astronomy. The second problem is somewhat related to the first. The reason we don’t know of anything that Socrates had to say about astronomy is that it’s actually very difficult to divine what he said about anything at all. Socrates wrote nothing down and his personality is only conveyed to us through the writings of contemporaries, particularly Xenophon, Aristophanes, and, above all, Plato. But Socrates was apparently such a signal figure that these authors mixed in their own philosophy into the words they put in his mouth so separating out what is Plato, what is Xenophon, and what is Socrates is very difficult. Now you may be objecting that plenty of the earlier philosophers I talked about also wrote nothing down and yet that didn’t stop me from squinting through copies of quotations of bits and bobs that students of theirs had written down centuries later in an effort to understand what, say, Thales "
