description = """
We look at how the Babylonians associated the heavens with their gods and
how Mesopotamian astrology developed after the Assyrian conquest. We hear
some examples of astrological omens and see how Babylonians handled the
most malevolent of omens, the lunar eclipse."""
full_description = "Episode 3: When the Moon Disappears March 28, 2021 We look at how the Babylonians associated the heavens with their gods and how Mesopotamian astrology developed after the Assyrian conquest. We hear some examples of astrological omens and see how Babylonians handled the most malevolent of omens, the lunar eclipse. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy with new episodes every full moon. My name is Joe Antognini. In the last episode we began to look at the astronomy of ancient Babylonia and the fundamental problem of the calendar — namely that the month does not evenly divide the year. Tonight we will take a more mystical turn and look a little more carefully at how astrology developed in parallel with the astronomy of ancient Mesopotamia. The evidence we have from both ancient Mesopotamia and other cultures around the world suggest that astronomy originally developed for what we moderners might call “secular” purposes. Calling those purposes scientific might be going too far, but perhaps the earliest astronomy could fairly be called a form of engineering. The motions of the heavens were the best means the ancients had of regulating agriculture, as it must be, because of course the motion of the Sun is inseparable from the progression of the seasons. So astronomy originally developed to set the calendar. But of course nothing is clean in history, and from the start people have also associated the heavens with the gods as well. As I discussed in the last episode, the earliest records we have of the constellations associate them with various gods. But it is some time before what we might call true astrology develops. The development was gradual and may have occurred in parallel with the development of the local religions in ancient Mesopotamia. Of course from the start various constellations are associated with various gods. But early on, the constellations get grouped into three realms: a northern realm, which is associated with the God Enlil; a middle realm that straddles the celestial equator, which is associated with Anu; and a southern realm below the equator, associated with Enki. These divisions were such that the Sun, Moon, and planets, all spent one third of their time in each realm. Now the gods Enlil, Anu, and Ea were no ordinary gods. Anu, for instance, was the prime mover — the god who created all things, from whom divinity itself had its source. In fact the divine power that all gods possessed was called “anutu”, in reference to the fact that they derived their godly authority from Anu. And his name is actually synonymous with the sky and the heavens themselves, which can make things a little confusing. Anu comes closest to the monotheistic conception of God. Anu was unique in that he had no creation story. He simply always was and always will be, much like the god of Abraham and Moses. More relevant to human affairs, at least originally, was Enlil, the god of the northern sky. While Anu creates all things, it is Enlil who separates the heavens from the Earth and is enthroned as chief of the gods, at least until Babylonia came to dominate its neighbors in Mesopotamia by around 1600 BC when its local god, Marduk, came to occupy the rank of chief of the gods, and then displaced Enlil to a more ethereal position like Anu. To analogize with Greek mythology, Anu occupies a position similar to Gaia, who is the source of all other gods in Greek mythology, but who otherwise does not much interact with humanity. Enlil, and later Marduk, occupies a role closer to Zeus as both are viewed as leaders of the gods and occupy themselves frequently in human affairs. Lastly Enki, also called Ea, the god of the southern skies, is another of the great gods that form the so-called “triad of heaven” in Mesopotamian mythology. Enki was the god of the waters. One might identify him loosely with Poseidon in Greek mythology, but unlike Poseidon, Enki was not so much identified with the oceans, but instead a more fundamental kind of water — namely the water beneath the Earth, on which the Earth was supported. In the cosmology of the ancient Mesopotamians (also shared by the ancient Israelites), the world was flat, with the dome of heaven above it, and was supported underneath by an ocean. You could of course look out and see that the world was flat and look up to see the dome of heaven. But the waters underneath the Earth were also obvious enough to the residents of the fertile crescent — they had to dig wells for their water, and knew that if you dug deep enough water would eventually flow forth. Enki’s domain was identified with this more fundamental water than the ocean of Poseidon. And because this life-giving water springs forth after persistent digging, Enki also became associated with wisdom and the magical arts. So we have a division of the world into three parts, the waters, the Earth, and the heavens. And this division is itself reflected in the heavens as well, with each star becoming associated with one of the gods of the triad of heaven. But of course the Babylonian pantheon contains far more than three gods. In fact, over most of the recorded history of ancient Mesopotamia, other gods played a more integral role in human affairs. I have already mentioned one, Marduk, and mentioned another in the last episode, Inanna. But there were many others. The most important of these more immediate gods were associated with the planets. This is really quite natural. The heavens themselves are vast, and largely static and unchanging. They form the celestial backdrop against which the planets move, and likewise the gods associated with them form the theological backdrop against which the gods closer to human affairs act. Marduk, who eventually becomes chief of the gods, is associated with Jupiter, who is, of course also the chief god of the Roman pantheon. And Inanna, a goddess of love and beauty, becomes associated with Venus, just as in the Roman pantheon. But Mars was associated with the Babylonian god Nergal, who is the god of pestilence, unlike in the Greek and Roman pantheons, where Mars is associated with the god of war. Nevertheless, in both cases Mars is viewed as an unlucky planet, almost certainly due to its distinct reddish hue. But like Venus and Jupiter, Mercury and Saturn both line up fairly well with the Babylonian associations as well. Mercury is associated with Nabu, who is the god of scribes and messengers, and Saturn is associated with Ninib, the god of agriculture. Given that Mercury quickly flits to either side of the Sun, it is not all that much of a surprise that it gets associated with messengers across several cultures. As for the association between Saturn and agriculture, I can only speculate that because it is the slowest of the visible planets, it might represent the slow but steady work of the Earth in producing vegetation for people to eat. But that is pure speculation on my part. Of these, Inanna, who later becomes known as Ishtar, occupies a particularly special place. The planet Venus seems to have had an outsized position in Babylonian astrology and was considered to be of astrological importance closer to the Sun and the Moon than the other four planets. Records of the appearance and disappearance of Venus in the evening and morning skies appear far earlier than records of any of the other planets. Now, early on we do not have much evidence for any sort of systematic astrology other than this loose association between the heavens and various gods. But one significant change came sometime after the Assyrian conquest of 911 BC. For this we will have to look at Mesopotamian writing, called cuneiform. One of the features of cuneiform text is what is called a determinative. This is a character that precedes a word and specifies the general category the word belongs to. Determinatives are common to languages which use ideograms. Egyptian hieroglyphs, Chinese characters, and signs in American sign language all have some form of determinatives. These determinatives are not pronounced, but help to disambiguate written texts. In cuneiform texts, the categories represented by its determinatives were fairly broad. One determinative represented buildings, another represented trees and anything made of wood. There was one for countries and another for birds. And up until the Assyrian conquest, the determinative used for the planets was called “mul”, which just means star. Every star name was preceded by this determinative, “mul”. In fact the Pleiades star cluster was simply called “mulmul”, which literally translates to “star star”. Fairly appropriate. At any rate, originally the planets were considered to be a particular kind of star. But after the Assyrian conquest, something changes in the cuneiform. The determinative changes to “dinger”, which means “god”. From this point forward, the planets are no longer viewed as a kind of star, but as a kind of god. It is in this Assyrian period that astrology becomes more complex. The Babylonians had been recording omens based on the heavens, but their omens were limited to the motions of the moon — years that needed extra months were bad — and the motions of Venus, which was perceived at the time not so much to be a planet, but more like the Sun and the Moon. But by this period, Babylonian astronomers begin recording the positions of the other planets in addition to the position of the Sun and the Moon. And the positions of the planets were a fertile source of interpretation to predict what was to come in the future. As civilization developed and the world grew to be more complex, it is perhaps no surprise that people in turn developed ever more complex means to understand what was happening in the world around them and how they should act. The general practice of foretelling future events by interpreting patterns in the natural world is called “divination”, and the ancient Mesopotamians used many different forms of divination. It was a common enough practice in the ancient Near East that divination is explicitly forbidden in not just one, but two of the books of the Torah: the Book of Leviticus, and the Book of Deuteronomy. In ancient Babylonia common divination techniques included examining the livers of sacrificed animals and studying the flights of birds. In addition to these practices of divination was the art of interpreting “omens” which were more irregular events than divination. A priest could perform divination whenever he so chose by sacrificing an animal and examining its liver, or looking for splotches on its lung. But omens simply presented themselves whenever the gods decided to present them to humanity. An omen could take the form of minor earthquakes, unusual births, say of two sheep fused at the spine. But a principal source of divination and omens came from the heavens. The configuration of the heavens on any given night could be interpreted by the priests. And the heavens also presented irregular omens that could be interpreted as well — meteors, eclipses, haloes, and more. But I would like to make it clear that this distinction I am drawing between divination and omens is a modern distinction. When writing about the meaning of the positions of the planets, Babylonian astronomers always used the same term, today translated as “omen”. One of the advantages of studying the positions of the planets was that their motions appeared fairly irregular. While they generally drifted west to east relative to the background stars, sometimes they moved faster, other times slower. Sometimes the stopped and went backwards. Sometimes the got brighter and sometimes they dimmed. While we know that these motions are, in fact, quite regular, detecting these patterns appears to have taken the Babylonians many centuries because the periodicity of their motions is many decades. Now as I warned you on the first episode, we will spend a fair amount of time discussing astrology on this podcast, so it’s important to understand some of the qualities of astrology in the ancient world. Today when we think of astrology we normally think of the horoscopes in the newspaper next to the word jumble or crossword puzzle, at least for those of us of a certain age who grew up when people still regularly subscribed to a physical newspaper. (Or perhaps Walter Mercado’s television show if you grew up in Puerto Rico.) Well it doesn’t take too much thought to realize that there are some pretty big problems with this kind of astrology. After all, there are only twelve horoscopes printed, one for each sign. So if those horoscopes were valid, you would have to believe that you could break the entire population of the world into 12 groups, and essentially the same things would happen to everyone in each of those 12 groups. Obviously any predictions you could make that would apply to such a vast population would have to be hopelessly vague. Now this argument is not entirely fair to astrology, because someone who is really deep into astrology will know that other factors aside from your sign are important when constructing a horoscope, and of course we will get into all this in much more detail in later episodes when we look at the astronomy and astrology of the middle ages. But this kind of astrology, what we think of as astrology today, is what can be characterized as “personal astrology”. In personal astrology the motions of the heavens reveal secrets about your personal destiny, both over the course of your life, and right now, today. Personal astrology in the West is really a development during the Medieval period. We have no evidence for personal astrology in ancient Mesopotamia, and very little evidence for it in general in the ancient world. The concern of ancient astrology was instead what might be termed “Judicial astrology”, though this gets a slightly different meaning when applied to astrology in the middle ages. Here the heavens are not concerned with an individual’s day, week, or even life. Instead they are only interested in the grandest of events — wars between nations, famines, plagues, deaths of kings. The only individual who warrants any attention whatsoever from the heavens is the king, and even then only on matters of life or death. So what do these omens say? Let’s read a few to get a feel for them. One reads: Mars is visible in Duzu; it is dim. When Mars culminates indistinctly and becomes brilliant, the king of Elam will die. When god Nergal in its disappearing grows smaller, like the stars of heaven is very indistinct, he will have mercy on Akkad…. When Mars is dim, it is lucky, when bright, unlucky. When Mars follows Jupiter, that year will be lucky. Every detail of the configuration of the planets was important when interpreting an omen. The constellation that the planet was in, how bright it was, its relationship to other planets. These details would have implications for the meaning of the omen. The "
