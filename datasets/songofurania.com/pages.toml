description = '''Before getting back into Egyptian astronomy proper, we start by looking at Nabta Playa, a site of megalithic activity in the Nubian desert during the late neolithic. Then we turn to the megaliths the Egyptians are best known for \u2014 the pyramids. The pyramids have remarkably precise alignments to the cardinal directions and the techniques the Egyptians used to set these alignments remains a mystery. Finally, we look at the largest of the pyramids, Khufu's pyramid, whose so-called ventilation shafts have a possible astronomical connection.'''
full_description = '''Episode 31: We Need to Talk About Khufu July 5, 2023 Before getting back into Egyptian astronomy proper, we start by looking at Nabta Playa, a site of megalithic activity in the Nubian desert during the late neolithic. Then we turn to the megaliths the Egyptians are best known for \u2014 the pyramids. The pyramids have remarkably precise alignments to the cardinal directions and the techniques the Egyptians used to set these alignments remains a mystery. Finally, we look at the largest of the pyramids, Khufu's pyramid, whose so-called ventilation shafts have a possible astronomical connection. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well last month we took a fairly broad overview of Egyptian history and geography and started to get into the astronomy of ancient Egypt by looking at their cosmology and the ideas they had about the beginning and end of the universe. This month we’ll continue to dive into Egyptian astronomy, but before we really get into it I wanted to talk about a topic that I perhaps should have discussed last episode just before getting to Egypt itself. This is a site called Nabta Playa and it’s one of the more remarkable megalithic sites not only in the Sahara but in entire world. Now, Nabta Playa is a little ways south of the city of Aswan which sits on the first cataract of the Nile, so strictly speaking, it’s really a Nubian monument rather than Egyptian, so if I were very strict about policing the boundaries of the subjects of each episode, it wouldn’t quite fit in to an episode on Egyptian astronomy. But there’s decent evidence that at least some of the people who built the monuments at this site later migrated north into Egypt proper, so when we’re going this far back in time, these distinctions are a little arbitrary. Now, unlike a monument like, say, Newgrange, which we discussed back in Episode 28, Nabta Playa isn’t a single megalithic structure. Rather it’s a site that was the center of megalithic activity for about two millennia, starting around 5500 BC and lasting until around 3400 BC. This range of time might ring a bell from back in Episode 29 when I was talking about the megaliths of the Saharan desert, because this range lines up with the time frame that other megaliths were constructed in the Sahara, which in turn corresponds with the period over which the Sahara dried out and was transformed from arid grasslands to desert. This region was inhabited by a people who are generically known as the Cattle Herders, and one of the first clues that the Cattle Herders considered this a special place is the fact that they buried cattle there. Nabta Playa has the largest density of cattle bones anywhere in the Nubian desert. What makes this particularly unusual is that the neolithic Cattle Herders did not, as a rule, slaughter their cattle, much like the pastoralists of the region today. Cows were much too valuable to be slaughtered and eaten for their meat — instead they were kept alive for as long as possible for their milk and their blood. Getting the milk is straightforward enough, but for the blood roughly once a month they would cut a cow’s vein, fill up a vessel with the blood, and then patch up the wound, at least if modern day Maasai practices are any indication of how it was done in the neolithic. But the cattle bones at Nabta Playa indicate that the animals there were slaughtered, which would have been a rather significant affair. In fact, the oldest tumulus at Nabta Playa, dating back to around 5300 BC, contains the skeleton of an entire young cow, which was an exceedingly valuable sacrifice for a pastoralist to make. Archaeologists haven’t only found the bones of cows at Nabta Playa. There are also a number of human skeletons buried there as well, all of which were placed on their sides in a crouching position, oriented with their heads towards the west and facing south. Based on these skeletons archaeologists have been able to infer that the people who lived in this region during the Neolithic were generally of good health, especially when compared to the skeletons of the later sedentary Egyptians. Well the Nabta Playa site contains about 30 megaliths, but three in particular stand out. The best known is a megalith called Calendar Circle. Now, calling this structure a megalith is maybe overstating things a bit. Perhaps it’s more appropriate to just call it a lith. It’s a circular arrangement of stones only about 4 meters across and the stones that make it up aren’t all that large, they’re all about 20 to 70 centimeters in length, so you could hold them in your hand quite easily. Several of these stones were put standing on their end. In fact, setting aside any astronomical connections, one of the most remarkable things about Calendar Circle is how well it stayed intact for nearly seven thousand years. With something like Stonehenge you can see how it stayed up over the years. The stones are just huge! You’d have to be really motivated to tear part of it down, or there would have to be some truly apocalyptic weather event to really impact the structure. But with Calendar Circle anyone could just come along and kick it over. It’s a testament to the isolation and geological stability of the region that when Calendar Circle was discovered in the early 1990s, eight of the standing stones were in their original locations, and another six had just fallen over. In fact, seven millennia of exposure to the natural elements was nothing compared to just a few years of exposure to people. After its discovery, visitors to the site kept adding random stones of their own, so after a few years the powers that be decided it would be safer to remove the stones from their original site altogether and reconstruct the original arrangement in a nearby museum. Well, I’ve been saying that the structure is about 7 millennia old, but because it’s simply an arrangement of stones, there’s no direct way to date them. But there was a nearby hearth and the organic material in the hearth can be dated using carbon-14 to around 4800 BC. The circle itself consists of a series of mostly flat stones embedded in the ground. There are eight exceptions, however, eight stones which aren’t flat, but are rather narrow and were placed upright. These come in four pairs, and each pair sits on the opposite side of the circle from another pair. These pairs then form a set of so-called “gates,” or entry points into the circle. Then in the interior of the circle, the line going from one gate to the gate on the opposite side is tracked by a line of pairs of upright rocks. These gates mark two alignments for the structure. Now, because the whole thing is rather small, the alignments are not extremely precise, but one of them traces the north-south axis, and the other is in the direction of sunrise on the summer solstice, or equivalently, sunset on the winter solstice. The way that this probably would have worked is that an individual would stand between the two rocks on the eastern gate at sunrise. When their shadow fell between the rocks on the opposite gate it would be the solstice, or at least around the solstice since there was probably a range of few days when this would happen. In fact, on occasion the Bedouin peoples of northern Africa continue to construct similar kinds of calendar circles to this day and that is way that they use them. The second axis of the Calendar circle, the north-south axis, is somewhat more remarkable because obtaining the direction of north with some precision is, well, maybe not the most difficult task, but at least isn’t completely trivial, particularly since at the time when the Calendar Circle was constructed there was no north star. Well, about half a kilometer to the west is another structure, named Ring Hill, which is one of the newest structures in the complex, dating to around 3500–3200 BC, so just prior to the first dynasty of Egypt. It’s quite a bit larger than Calendar Circle, about 17 meters in diameter and contains a grave with the skull of a three year old boy. The structure consists of rings of stones, of which the innermost ring is somewhat asymmetric and points towards the east. The last structure of particular note in Nabta Playa is to me the most remarkable, but of the three structures I’ve talked about it was given the most generic name: Complex Structure A. The builders of this particular monument dug a pit into the ground about two and a half meters deep. There they seem to have discovered a rather large rock made of quartzitic sandstone, about 3 and a half meters by 2 and a half meters in size. The rock probably had a rather flat top to begin with, but the builders went to extra effort to smooth the top of this stone. Then they filled the pit back up with sand, and as they did so, they suspended a second rock above the table rock in the sand. This second rock is known as the “cow stone,” because it was shaped in a way that vaguely resembles a cow, with a projecting bulge that looks like its head. Then, with the cow stone suspended above of the table stone, they completely filled the pit with sand burying both the stones and added several large stones on top above ground. How the builders discovered this particular rock is something of a mystery. They would have had to have gone to some effort to dig deep enough to find it, and the area is not conducive to groundwater, so it’s unlikely that they would have happened to have been digging wells in the area and accidentally stumbled upon it. But this structure seems to have been of some significance for the people who built it not only because of the effort they clearly went to to construct it, but due to its relationship with the surrounding structures. Many of the other megaliths at Nabta Playa were built along three lines that radiate out from this structure. What is rather intriguing about these three radial lines is that they don’t correspond to any of the usual axes we see in megalithic structures like east-west, north-south, or the solstice sunrise and sunsets. However, if the structures were built in the range of 4300–4100 BC, which is consistent with the available evidence, then the first axis lines up with the point on the horizon where the star Arcturus rises, which is the brightest star in the northern hemisphere. The second lines up with the location where the stars of Orion’s belt rise, and the third with the location where Sirius and Alpha Centauri rise, the brightest and third brightest stars in the night sky, respectively. Well, the ceremonial center at Nabta Playa appears to have been abandoned around the middle of the 4th millennium BC, which, perhaps not coincidentally, is when the desiccation process of the Sahara largely finished and the peoples of the Sahara appear to have moved into more permanent settlements in the Nile river valley, and recorded Egyptian history begins just a few centuries later. So then, let’s get back to the history of astronomy in Egypt proper. The oldest plausible reference to an astronomer in Egypt is a reference to none other than Imhotep, one of the more remarkable of the earliest Egyptians, all the more so since he wasn’t a pharaoh. Imhotep was a high official of the pharaoh Djoser, of the 3rd dynasty, so he was kicking around very early on in Egyptian history. Over the centuries, Imhotep became revered for his wisdom and acquired something of a mythical status in Egyptian religion, eventually to the point of deification. Now, Imhotep was credited with being wise in matters of astronomy, but these references are a little late and somewhat more dubious, so I can’t really speak too much about his direct influence on Egyptian astronomy. Instead, Imhotep was principally known for his abilities as a physician and architect. Of his abilities as physician the records that survive are purely legendary, but his record as an architect can be seen much more tangibly as he is credited with constructing the first pyramid. Now, up until the time of the Pharaoh Djoser, the pharaohs were entombed in a kind of structure that is today called a “mastaba,” but in ancient Egyptian was called a “per-djet,” which literally translates to “house of eternity.” You might recognize that last part of the word, “djet,” from our last episode, as being one of the ancient Egyptian words for time, with the connotation of a linear, immutable eternity that describes the end of the world. Well a mastaba is a somewhat simple structure. There were two chambers underground, one of which was the tomb of the late pharaoh, and the other of which contained offerings for the deceased so that he could live in luxury in the afterlife: clothing, jewelry, food, beer, and so forth. Above ground, the tomb was covered with a rectangular slab made of mudbricks, a few meters tall. The main characteristic of the mastaba was that the sides of the mastaba were not vertical, but sloped inwards a little bit. Imhotep’s main architectural innovation, which then set off a construction frenzy that produced one of Egypt’s principal legacies, was to stack a number of mastabas on top of each other, each somewhat smaller than the last. This transformed the tomb from a rectangular shape, to the first step pyramid in ancient Egypt. After Imhotep, later pharaohs took this design and refined it, or probably more precisely, their unnamed architects took this design and refined it. Although it’s not too hard to see the stacked mastaba structure of Djoser’s pyramid once you know to look for it, after a few generations, the architects ditched this connection to their roots and the pyramids started to be built towards the Platonic ideal of the pyramid shape that we all know and love. The pyramids are without a doubt the most prominent relic of ancient Egypt in the popular consciousness, so I should probably say a few words about their astronomical connections. Now, one of the things to say about them is that they are very, very old. The Pyramids all date to the beginning of the Old Kingdom. The vast majority of them were constructed during the fourth dynasty, around 2600–2500 BC and by the end of the sixth dynasty pharaohs had essentially stopped constructing pyramids. So although pyramids are the first thing we think of when we think of ancient Egypt, there was actually a only relatively short period of time in Egypt’s long history when they built them. Part of the reason for their construction being rather short lived in the long sweep of Egyptian history is that they were in some ways victims of their own prominence. The early pyramids at Giza were constructed not too far away from the capital of Memphis where Upper Egypt and Lower Egypt meet, and they are just tremendously large. You really can’t miss them. And, of course, in keeping with ancient Egyptian beliefs about the afterworld, these huge py'''
