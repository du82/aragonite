description = "Thales was the first of the Greek astronomers and became known as one of the Seven Sages of Greece. Over the centuries many astronomical discoveries were attributed to him, but what was the reality and what was the hyperbole?"
full_description = "Episode 9: Thales, through a Glass Darkly September 21, 2021 Thales was the first of the Greek astronomers and became known as one of the Seven Sages of Greece. Over the centuries many astronomical discoveries were attributed to him, but what was the reality and what was the hyperbole? Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. In the last two episodes we’ve been introduced to what we might call the folk astronomy of the ancient Greeks. We looked at how they interpreted the heavens through the lens of mythology. And we saw how the implicit cosmological and astronomical ideas of the Greeks made their way into the works of Homer and Hesiod. But now, and for the foreseeable future, the character of the astronomy we’ll be looking at will change from what we’ve seen in the past eight episodes of this podcast. The history of astronomy as I will be telling it, will change from a history in broad strokes, a history of the astronomy of civilizations and empires, evolving slowly over the centuries, to a personalized kind of astronomy. I’ve mentioned only a few astronomers by name in the narrative up until this point: Berossus and Kidinnu in particular. And many of the astronomical diaries of the Babylonians were signed by the astronomers who wrote them. But it isn’t clear what those particular astronomers contributed to the development of their field, if anything. And in the last episode I talked about Hesiod and Homer, but they were not astronomers and did not develop any new astronomical ideas or techniques themselves. They were poets who happened to convey the astronomical ideas floating about in their culture in their poetry. But starting with Thales of Miletus, we for the first time can finally start to see the contributions of individual astronomers to the field of astronomy. From time to time I will try to zoom out a little bit and describe the evolution of astronomical thought in Greece and elsewhere in broader strokes. But at least until we finish with ancient Greece, we at long last have the luxury of knowing who it was who developed the astronomy of the culture. At least to an extent. In this episode we’ll be focusing on the first known Greek astronomer, Thales of Miletus. But as we’ll see, even though we know the name Thales and that he came from the city of Miletus on the western coast of Anatolia, and that he lived from sometime around the late 600s to the mid 500s BC, and we know that this man was considered to be a great astronomer, beyond that we unfortunately have very little solid evidence to go on as to what specifically he believed and discovered, and this was true of all of the earliest Greek scientists. Now, I don’t want to downplay this. Having very little solid evidence still means you have a great deal more solid evidence than absolutely no solid evidence or no evidence whatsoever, solid or otherwise, which is all we have to go on prior to this. Nevertheless, I do want to set some realistic expectations here for how completely we can really understand the science of these earliest Greek figures whose names we know. So before I go ahead and tell you what Thales of Miletus was said to have done and thought, and before I tell you what he may have actually discovered and thought, it would be wise to ask ourselves how we know what we know about ancient Greek astronomy and the earliest Greek astronomers. Now, Greece was a relatively literate society by the standards of the ancient world. In many of the other great civilizations of the ancient world that developed a system of writing, the Egyptians, Babylonians, Chinese, literacy was largely confined to a small class of priests and scribes. But Greece never developed a specialized class of scribes, perhaps because of the highly decentralized nature of its politics. The earlier Mycenaeans had developed a system of writing known today as Linear A and Linear B, but records in Linear B stop after the Late Bronze Age Collapse, and apparently literacy in the region declined during the Greek Dark Ages. But as the ancient near east began to recover from the Late Bronze Age Collapse, the nearby growing civilization of the Phoenicians came up with an interesting innovation. Rather than a hieroglyphic or pictographic system like the Egyptians and Chinese, where each word has a unique character associated with it, and unlike the cuneiform of the Babylonians and Assyrians, or the earlier Linear B script of the Mycenaeans, where each character represented either a word or a syllable, the writing that the Phoenicians developed was a true alphabet, where each symbol represented a particular phoneme. This innovation was to become extremely popular because it was enormously flexible. Characters tied to individual words and syllables were closely tied to the original language that they were developed for. Now, this doesn’t mean that you can’t adopt a logographic script from one language to another. In fact the Japanese did just that with Chinese logograms and still use them today in what is called Kanji. Today kanji tends to be used mostly for what are called “content words,” things that tend to be more concrete in meaning, rather than function words, which are used more for syntactical purposes and tend to vary much more widely between languages. Content words can oftentimes translate relatively more or less directly between languages but this is much more difficult for function words. Consequently, it’s easier to adopt a logographic system from another language for your content words, but a lot harder to do that for your function words. So Japanese writing today uses kanji, the Chinese logographs, for their content words, and falls back on a separate writing system which is syllabic, called Kana, for the function words. Well, of course millions of people today can read Japanese, but because of its origins as a borrowed logographic script, Japanese orthography is notorious for its complexity. By contrast, if the characters of your script simply represent phonemes, that is, individual consonants and vowels, the script can translate relatively easily from one language to another. It doesn’t matter what the content or meaning of the word is, all you need to do is sound it out, and write down the sounds. Now, you can run into some problems if your language has sounds that the first language doesn’t. But this issue can be circumvented fairly easily just by switching around the sounds associated with the various characters, or adding a new character or two to represent the new sounds. Once you’ve hit upon the basic idea that each character represents a sound, making some tweaks here and there isn’t all that hard by comparison. Now, to be clear, the Phoenician script did not develop in a vacuum here. It evolved from an earlier Proto-Sinaitic script from the late Bronze age and also actually incorporated some elements from Egyptian hieroglyphs along the way. As I mentioned last episode, the Phoenicians were a thalassocratic civilization and developed an extensive trading network across the Mediterranean. In fact, centuries later, one of their major settlements, Carthage, eventually became a major nuisance for the Romans as the Romans started embarking on their quest for world domination. All this is to say that the Phoenicians contacted many civilizations across the Mediterranean and many of these civilizations encountered Phoenician writing and saw its advantages. The Greeks were one of these. In fact, both the Greek script and our modern day Latin script derive from the Phoenician alphabet. Writing in Greece starts to be reintroduced into the historical record in the early 8th century BC in the form of graffiti on pottery at gravesites, probably from relatives inscribing either the name of the deceased or their own names. Because the vases and pots were sealed in the tomb, the date of the writing can be established as being roughly contemporaneous with the date that the pottery was made and Greek pottery can be reliably dated based on the artistic style. How did archaeologists figure out the dates of the various artistic styles in the first place? A rough chronological order can be determined at certain sites based on relative depths in the soil. But the more conclusive evidence is if there happens to be organic remains near the pottery like bones or charcoal, in which case radiocarbon dating can be used to get a date perhaps to within a few decades. It only takes a relatively small number of archaeological sites that happen to have the necessary organic material together with the pottery in order to tie distinct artistic and technical styles to different eras. Well, it seems that writing was present in Greece relatively early on in the archaic period, but its use was fairly limited, at least based on the records we have available to us. The writing we see is almost entirely names scratched onto funerary vases, though there are two notable exceptions. There is a wine jug called an oenochoe dating from around 740 BC that has an inscription in hexametric verse, “Whoever of all the dancers now dances most daintily, of him this…” and then the text becomes unclear but maybe reads pot. Then there is an artifact known as “Nestor’s cup”, which is a wine cup called a skyphos from perhaps the late 700s with a three line inscription that reads: I am the cup of Nestor good for drinking. Whoever drinks from this cup, desire for beautifully crowned Aphrodite will seize him instantly. But given the paucity of written records from the early archaic period, especially compared to the more detailed records we have in Linear B from the Mycenaean civilization, it is clear that literacy was not widespread in Archaic Greece and the society was predominantly oral. In fact there is only a single reference to writing in The Iliad in Book 6, in which Homer takes a small digression, much like this podcast is wont to do, and tells a small story about the hero Bellerophon, who you may remember from Episode 6 as being the true companion of the winged horse Pegasus. Well, in Homer’s telling, Bellerophon happened to be in Tiryns, where Proetus was king. The queen Anteia fell in love with Bellerophon and made advances on him, but Bellerophon kept his honor and rebuffed her. Then — well, why should I tell this story, let’s let Homer do it: That strong king Proetus now drove Bellerophon out of Argos this because Anteia, the queen, lusted to couple with him secretly, but he was honorable, she could not lure him, and in the king’s ear hissed a lie: ‘Oh Proetus I wish that you may die unless you kill Bellerophon — he desired to take me in lust against my will.’ Rage filled the king over her slander, but being scrupulous he shrank from killing him. So into Lykia he sent him, charged to bear a deadly cipher, magical marks Proitos engraved and hid in folded tablets. He commanded him to show these to his father-in-law, thinking in this way he should meet his end. Guided by gods he sailed, and came to Lykia, high country, crossed by Xanthos’s running stream; and Lykia’s lord received him well. Nine days he honored him, nine revels led with consecrated beasts. When Dawn was rosy fingers eastward made the tenth day bright, he questioned him, and asked at length to see what sign he brought him from his son-in-law. When he had read the deadly cipher, changing, he gave his first command: his guest should fight and quell a foaming monster, the Chimera, of ghastly and inhuman origin, her forepart lionish, her tail a snake’s a she-goat in between. So the king Proitus wanted to kill Bellerophon for supposedly having attempted to rape his wife, but Proitus couldn’t do this himself because Bellerophon was his guest, and to kill a guest was to invite the wrath of the furies. So he had written a coded letter to his father-in-law telling him that Bellerophon had attempted to rape his wife, or his father-in-law’s daughter, and had Bellerophon transport the letter, expecting that his father-in-law would execute the man. But his father-in-law received Bellerophon as a guest before he read the letter and so couldn’t kill Bellerophon without inviting the wrath of the furies as well. So instead he attempted to kill the hero the way that most kings tried to kill seemingly invincible heroes — he sent him on what he believed to be an impossible quest to kill a terrifying monster. At any rate, the interesting bit here is that Homer describes the writing as “magical marks”, or in another translation, “baneful signs”, which seems to indicate that writing was very rare at the time and held special significance. Well, based on the available archaeological evidence, it seems that writing spread slowly throughout Greece during the Archaic period. By around 600 BC, around the time when Thales of Miletus was coming of age it is estimated that the number of literate men in the larger cities may have numbered in the hundreds, and that more modestly sized Greek cities may have had a few dozen literate men. We have less evidence as to the number of literate women, but it was certainly considerably smaller, although literate women were not unheard of, the poetess Sappho being a principal example. But Sappho was born to a very wealthy family and was exceptional in many ways, not simply on account of her literacy. At any rate, during the sixth century, literacy seems to have spread more rapidly throughout Greece. By the middle of the 6th century, the philosopher Pherecydes had developed a new cosmogony and wrote it down in a text called Pentemychos, meaning the five recesses. The cosmogony itself is still highly mythological in character, but what is notable about the text is that Pherecydes wrote it down in prose rather than verse. This is one of the early indications that written text was starting to take primacy over oral transmission in Greek civilization. This isn’t the only evidence of this, either. Particularly in the later half of the 6th century BC as tyrannies began to wane in favor of nascent forms of democracy, cities began to inscribe their laws in public places. Of course, it was certainly not the case that everyone could read those inscriptions, or even that most people could, but it does suggest that there was a large enough literate population to make it worth their while. And more fundamentally it again established the primacy of written text over oral transmission. One of the later Athenian tyrants was a man by the name of Hipparchus, not to be confused with the astronomer named Hipparchus from the second century BC whom we’ll talk about in a future episode. Hipparchus constructed a series of monuments called herms along the roads in the countryside leading to Athens. A herm is a kind of interesting piece of sculpture. It’s a square pillar, about human height, with a bust of a head on top, o"
