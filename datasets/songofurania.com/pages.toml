title = "The Song of Urania Podcast"
description = "As Rome expanded to the East, the cultural influence of the Greeks deepened, and this included a strong interest in astrology. Despite resistance from conservative Romans, by the Imperial Era, astrology played a critical role in Roman politics, both as a tool to support conspirators attempting to assassinate emperors, and wielded by emperors as a way to eliminate challenges to their power."
full_description = "Episode 26: Matters of Life & Death in Roman Astrology February 9, 2023 As Rome expanded to the East, the cultural influence of the Greeks deepened, and this included a strong interest in astrology. Despite resistance from conservative Romans, by the Imperial Era, astrology played a critical role in Roman politics, both as a tool to support conspirators attempting to assassinate emperors, and wielded by emperors as a way to eliminate challenges to their power. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon, or thereabouts. My name is Joe Antognini. We took a bit of a detour in the last episode to look at an astronomical event or astrological sign that appeared in the obscure corner of Judea in the Roman Empire around the turn of the millennium. But in this episode we’ll return to the center of the action in our look at Roman astronomy. Or really, I should say Roman astrology, because the Romans cared little for what we would call astronomy today. The Romans, as has often been said, were an intensely practical people. Unlike those Greeks, who would fritter away their days debating the finer points of philosophy, the Romans had no interest in knowledge for its own sake. They wanted something they could use. Modeling the motions of the planets through the heavens was only so much nonsense to them. But if you could use that to tell you something interesting, say, when the next emperor would die, or more prosaically whether or not a boxer you wanted to bet on would win an upcoming fight, well that was an entirely different story. The Romans were extremely interested in that. That intense interest meant that astrology was a potent political tool, in a way that is maybe hard for those of us in the modern world to grasp. Consequently, astrology was highly regulated in ancient Rome and astrologers often acted as a power behind the throne or were key in aiding conspiracies. But before diving straight into the influences of astrology on Roman politics, it’s worth backing up a little bit to understand how Rome got to that point in the first place, because astrology did not always play such a, forgive the pun, starring role in Roman culture. The Romans, of course, had always been superstitious, but in Rome’s early days the superstitions were largely homegrown and consisted of divination by looking for omens in the natural world, say, the flight of birds, or the entrails of sacrificed animals. The origins of Roman astrology lay far to the East, ultimately with the Babylonians. In the first few episodes of this podcast we saw how the Babylonians interpreted the motions of the planets through the skies to portend victories or calamities for kings and nations. And this astrology was old. Very old. It far predated the civilization of the Romans. So, by the time the Hellenistic Era rolled around in the late 300s BC, the Babylonian astrologers had acquired a reputation in Greece for their ancient and mysterious skills. Indeed, when Alexander the Great was marching on Babylon, the astrologers of the city met him outside and warned him against entering the city walls. The astrologers told him that they had seen an omen in the stars that a king would die in Babylon. It was really for his own safety, you see, that he should stay away. But that was not all, they had also discovered that Alexander could avert this danger if he rebuilt a tomb to one of their gods and entered the city along a particular route. Now, the ancient accounts suggest that Alexander probably thought that this was all hokum and just a ruse to keep him out of their city for a little while longer. But nevertheless he had heard enough of their skills that he thought it was probably better to be on the safe side and he did acquiesce to the astrologers’ requests. The reputation of the Babylonian astrologers seems to have been further burnished by a few incidents in the wars of the Diodochi after Alexander’s death. In the aftermath, one of Alexander’s officers, Seleucus ended up as the governor of Babylonia under the general Antigonus Monophthalmus, whom you might remember from Episode 21 because name meant one-eyed because, well, he had one eye. One of Antigonus’s officers committed some offense or other in Babylonia and Seleucus punished the officer without obtaining permission from Antigonus. Antigonus then demanded tribute from Babylonia which Seleucus refused to pay. Seeing which way the winds were blowing, Seleucus decided to flee to Egypt, far from any reprisals from Antigonus. When Antigonus arrived at Babylon to deal with Seleucus, he learned that Seleucus had fled. And what’s more, the city’s astrologers then warned him that if Seleucus escaped his grasp, all of Asia would fall to Seleucus’s rule and Seleucus would kill Antigonus to boot. Now Antigonus generally did not take diviners seriously, but in the end, Seleucus did manage to flee to Egypt and in due time killed Antigonus in battle and founded the Seleucid Empire which ruled much of the east for centuries. There was another story involving Seleucus and the astrologers once again about a decade later. Seleucus then was founding a new city on the Tigris River, modestly named Seleucia. Learning from the lesson of Antigonus that it was wise to heed the astrologers, he consulted with them to find out the most propitious time to lay the cornerstone of the city. For unclear reasons, Seleucus’s relationship with the astrologers had soured by this point and the astrologers decided to deceive him. Instead of giving him the time that was most propitious to lay the cornerstone, they gave him a time that was not propitious at all. They then watched as the workers went about laying the foundations of the city. But to the amazement of everyone watching, and for perhaps the only time in history, the workers began working inexplicably quickly and could not be slowed even when the foremen tried to stop them. Against their orders, the cornerstone was laid at a different time, which happened to be precisely the most auspicious of all. The astrologers were then called before Seleucus to explain what he had just witnessed. They managed to obtain a promise of mercy and then told him of their deception and how the cornerstone had nevertheless been laid at the most auspicious time. Evidently the city was fated to be one of the greatest in history and the fate of the city could not be changed, even by wily astrologers. Now, of course, it is unlikely that these two events did in fact occur in history, but the later historians who told these tales did so to impress on the reader the prodigious abilities of the Chaldean astrologers and that to ignore them was to do so at your own peril. Now, up until the Hellenistic Era, it seems that the Greeks were aware of this tremendous reputation that the Chaldean astrologers enjoyed. But there was little interaction between Greeks to the west and the astrologers themselves. And this makes sense, the Chaldean astrologers were a valuable source of state power. They weren’t about to be allowed to just roam to the four corners of the earth and spill their secrets. But after Alexander’s conquests, these cultural contacts became far deeper and over the years a stream of Chaldean astrologers made their way west and shared the methods of Babylonian astrology with the Greeks. The first we have record of was Berossus, whom I mentioned all the way back in Episode 4, who moved to the Greek island of Cos probably in the early third century. About a generation later a Chaldean astrologer by the name of Sudines moved to Pergamum, which by that point was an important place of scholarship and had a tremendous library, rivaled only by that in Alexandria. He seems to have made some contributions to astronomy proper by producing some astronomical tables and measuring the length of the year. But some of his most novel contributions were in writing about the astrological properties of gemstones. During the Hellenistic era, many of these Chaldean astrologers didn’t only travel to Greek areas but went to Egypt as well, and from there these ideas transferred from Egypt to Greece thanks to the close cultural connection of those two lands. Throughout our long tour of Greek astronomy every Tom, Dick, and Harry I told you about had at some point in their youth traveled to Egypt and learned the secrets of astronomy and geometry from the priests there. So, much of the influence of Babylonian astrology was mediated through the Egyptians. In fact, over the 20th century there was quite a lot of debate as to whether or not Egyptian or Babylonian astrology came first and which one influenced the other. These days the debate seems to be fairly settled on the precedence of Babylonian astrology. But the ties between the two were quite strong, and in turn, both of them strongly influenced Greek astrology. Well, the Greeks had about one and a half centuries for the astrological ideas of the Babylonians to percolate in their culture. But during the 2nd century the Romans swept in and what had once been a collection of independent kingdoms and city-states became subsumed into the rapidly growing Roman Republic. So it’s about in the middle of the 2nd century BC that we start seeing Greek philosophers in turn traveling west and spreading their ideas in Rome. In particular, if we could point to one moment where the Romans began to be interested in Greek thought, it was the year 155 BC. Without getting too deep into the backstory, Athens, which was then under Roman rule, had attacked the town of Oropus and as punishment, Rome had levied a fine on Athens of 500 talents, a prodigious sum of money. In an attempt to wriggle out of the fine, Athens sent three philosophers to Rome as ambassadors to try to negotiate the fine lower. These were Carneades of Cyrene, Diogenes the Babylonian, and Critolaus. Their reputations seem to have preceded them and they were met with good humor by the Romans. There is a story that Aulus Albinus, a Roman praetor at the time, was speaking with Carneades and Diogenes, Carneades being a member of the Skeptical School and Diogenes being a Stoic. Albinus said to Carneades, “In your view, Carneades, I am not a real praetor, nor is this a real city.” Carneades responded, “In the opinion of our Stoic friend here, you are not real.” With time to kill in Rome, the three philosophers began doing what they did best — teaching philosophy. Carneades, in particular, seems to have had an oratorical flair and one day went out into the streets and expounded a passionate and eloquent lecture on the value of Roman justice. But the next day, now having attracted an even larger crowd, he expounded an equally passionate and eloquent lecture which rebutted each of the arguments he had made the previous day. Then to his stunned audience he made the argument that justice itself was not a well defined concept. Well, out in the crowd was a senator named Cato the Elder, and he recognized how subversive these arguments were. Cato persuaded the Senate to expel Carneades back to Athens where he couldn’t corrupt the minds of the Roman youth. But Carneades was just one of many Greek philosophers who spread their ideas in Rome at the time. A few years earlier, the philosopher Crates of Mallus also spent some time in Rome as an ambassador, though the sources conflict as to which city he was representing. Unfortunately for Crates during his stay in Rome he fell into an open sewer and broke his leg, so he ended up staying in Rome quite a while longer than he originally intended. But while he was laid up in bed, he made productive use of his time corrupting the minds of the Roman youth by teaching them philosophy. Now, the Greek philosophers that came over to Rome in the middle of the second century were actually pretty skeptical about astrology on the whole. Carneades in particular had voiced the most strenuous arguments against the discipline that was starting to gain popularity in Rome at the time. Carneades levied five main arguments against astrology, though these arguments were by no means unique to him. To start off, Carneades argued that even if there was some merit to astrology, it would be of no use to us, because in general no one could measure the positions of the planets in the sky precisely enough at the exact time of an individual’s birth. So as a practical matter astrology as a tool for determining the fate of an individual was dead on arrival. But Carneades went further and added a few more arguments against the validity of astrology. His next argument was that anyone can see that people are influenced by their environment. People born in Athens exhibit one set of customs, and people born in Egypt exhibit another, even though the people in Athens were born at all different times. Furthermore, if the stars were truly influencing events here on Earth, why would their effects be limited to humans? After all, the Sun’s influence is borne by everything on Earth. It affects planets and animals just as much as humans. So should it not be the case that an astrological omen in the heavens should apply equally well to an animal as to a man? If the stars display the sign of the birth of a great leader, would that mean that a dog born that day is destined to be the leader of all dogs? But probably the strongest argument against astrology levied not only by Carneades, but many skeptics of astrology of the time, was the argument of twins. Twins are born under exactly the same stars. Yet they very frequently have radically different lives. One lives long, the other dies young. One acquires great wealth, the other falls into poverty. If the stars are responsible for setting their destinies, how can you explain even a single case where one twin meets a different destiny than their counterpart? Another argument against the merits of astrology of the time, not due to Carneades specifically, was that the premise of the associations didn’t make any sense to begin with. For example, someone born under the sign of Leo, the Lion, is assumed to have the qualities of a lion — strength and courage. But you wouldn’t expect that someone literally born next to a real, physical lion would have those qualities. So why should being born under its astrological sign bear those qualities? In the end though, these kinds of philosophical arguments were no match for the waves of astrologers who made their way west to Rome during the 2nd century BC. During this century, Romans of the upper classes became more and more taken by Greek culture, and that included an interest in astrology. Now, as in any society, these kinds of social trends never include everybody. Cato the Elder was famously opposed to the influence of Greek culture in Rome. Cato was of the opinion that astrology was a permissible if perhaps distasteful belief for plebeians or slaves, but wa"
