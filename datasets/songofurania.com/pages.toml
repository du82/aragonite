description = "After Wang Mang deposed the Han Dynasty and instituted his new Xin Dynasty, he needed to promulgate a new calendar to mark the occasion. One of his court astronomers, Liu Xin, developed a new calendar that integrated the lunar and solar cycles with the planetary cycles and imbued it with numerological significance. We then talk about how Huan Tan, another astronomer of the era, would have gone about measuring the lunar mansions."
full_description = "Episode 41: Liu Xin's Theory of Everything April 25, 2024 After Wang Mang deposed the Han Dynasty and instituted his new Xin Dynasty, he needed to promulgate a new calendar to mark the occasion. One of his court astronomers, Liu Xin, developed a new calendar that integrated the lunar and solar cycles with the planetary cycles and imbued it with numerological significance. We then talk about how Huan Tan, another astronomer of the era, would have gone about measuring the lunar mansions. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well, last month I tried to give a fuller picture of what a calendar reform looked like in early Imperial China by chronicling the events of more than a century that led up to the calendar reform of 104 BC. In earlier episodes I had tried to emphasize the importance of setting the calendar as a symbol of Imperial authority. This month we’ll look at the subsequent calendar reform that was instituted at the start of the short-lived Xin dynasty and introduced the so-called Triple Concordance system of Liu Xin. Then we’ll turn to one of the most important features of Chinese astronomy, the system of hsiu, or lunar mansions. As with the earlier calendar reform of 104 BC, the events that led up to the calendar reform under the Xin Dynasty began with a period of political dysfunction and fecklessness followed by a coup from a more capable leader. But in this case, the timeline of events that led to the establishment of the Triple Concordance system was accelerated relative to the earlier calendar reform. So in this episode we can begin our story just a few decades before the main event rather than a century before as we did in the last episode. Now, in the last episode we talked about the establishment of the Han dynasty, the second imperial dynasty in China, and walked through the first few emperors until we got to Emperor Wu, who established the new calendar for the Han dynasty in 104 BC. The early Han dynasty was a relatively successful period in the history of China in part because the empire was fortunate enough to have a string of emperors who were competent administrators. This bout of good luck lasted for another half century or so, and the middle of 1st century BC under the reign of Emperor Xuan is generally considered to be the high water mark of the Earlier Han Dynasty. But all good things must come to an end, and after the death of Emperor Xuan there was a sequence of progressively less and less capable emperors. The first few of these were not exactly malevolent in the way that, say, an Emperor Nero or Caligula was in the Roman Empire. They just did not quite seem to be up to the task. They were generally indecisive and, more importantly, didn’t have strong control over their bureaucracy. So, over the decades factionalism became more pronounced, and, even worse, corruption started to get out of control. Towards the end of the 1st century BC, the Emperor Cheng died, yet another ineffectual emperor in what was by now a long line of ineffectual emperors. Emperor Cheng, however, died suddenly, and relatively young, at the age of 44, and left no obvious heirs. He had had two sons with concubines, but his consort, Zhao Hede, had had both them and their mothers killed with the Emperor’s tacit consent, one by suffocation and the other by starvation. It’s around this time that a man named Wang Mang enters the picture. The Wang clan had been on a meteoric ascent in just a generation or two. Now, this wasn’t exactly a rags-to-riches story, the Wang clan had always been well off. But Wang Mang’s aunt was a woman named Wang Zhengjun and she had been born in 71 BC as the second daughter of the Minister of Justice. This was a high position in Chinese society, to be sure, but it was still some ways away from the top. The Minister of Justice was one of nine ministers, who in turn reported to the Three Councillors of State, who, in turn, reported to the Emperor himself. Well, sometime around 55 BC, the consort of the Crown Prince Liu Shi died. Inconsolable, the prince wanted to have nothing to do with the other concubines in his harem. After some time, to try to get him out of his funk, his father, the Emperor Xuan, arranged for his son to meet a new set of women that he could choose from. Wang Zhengjun was one of the six women who went to meet the Crown Prince. Of these, the prince selected her to be his new consort, apparently for no other reason than that she happened to be sitting closest to him. Nevertheless, this happenstance arrangement was the breakthrough that the Wang clan needed. In time, Wang Zhengjun gave birth to a son, in fact, Liu Shi’s first son. And a few years later the Emperor died and Liu Shi ascended to the throne, taking the name Emperor Yuan, which meant that Wang Zhengjun went from being the second daughter of the Minister of Justice to an Empress of China. Well, with this turn of events the Wang clan had an inside track in court politics. According to the histories, most of the members of the family parlayed their family position for high living. But Wang Mang was different. He didn’t seem to be attracted to wealth and dressed in the refined, but modest outfit of a Confucian scholar and used his considerable means to support a gaggle of Confucian scholars around him. Rather than living off on a grand estate out in the country, he lived within the palace complex. This unassuming demeanor was key to his growing stature. He was quietly competent in a time when each emperor was more incompetent than the next, and, being in the heart of the Imperial machinery, he was in a position to exert some influence. With his lavish support of Confucian scholars, he brought this powerful faction of the court lockstep behind him. So, to get back to the original thread, when Emperor Cheng died in 7 BC and left no obvious heirs, Wang Mang was in an exceptional position to influence the selection of the next emperor, and more importantly, to influence the next emperor himself if he was sufficiently pliant. Now whether or not he had conceived of any plans for ultimate power at this point isn’t really clear, and if he did, it didn’t quite work out for him in the near term. The next emperor, Emperor Ai, ascended to the throne at the age of 20, but ended up falling almost completely under the control of his step grandmother, the Empress Dowager Wang. Wang Mang clashed with the Empress Dowager on a few occasions but was soon forced to resign from his position as commander of the army. Well, Emperor Ai had always been sickly. What exactly his illness was is not clear, but whatever it was, he died from it six years after ascending to the throne. This put his step grandmother, the Empress Dowager Wang in an awkward position. While Emperor Ai had technically been married, he was fairly open about his homosexuality, and his real partner was a minor official named Dong Xian. Later chroniclers described their relationship as the “passion of the cut sleeve,” in reference to a story in which the two had fallen asleep in each others arms. Upon waking and finding the sleeve to his Imperial robe still trapped under Dong Xian, the Emperor cut his own sleeve off rather than wake his lover. Well, over the six years of his rule, Emperor Ai lavished Dong Xian with ever higher offices, and by the time of Emperor Ai’s death, Dong Xian had become one of the most powerful men in the Chinese court and a rival to the Empress Dowager. In fact, on his deathbed Emperor Ai had pronounced Dong Xian to be his successor. So the Empress Dowager Wang put aside her differences with Wang Mang and joined forces with him to box out Dong Xian from having any role in the subsequent reign. Together, they planted an eight-year-old boy named Liu Jizi on the throne, where he adopted the name Emperor Ping. Being too young to rule in his own right, the Empress Dowager appointed Wang Mang to be regent. To further consolidate his grip on power Wang Mang then arranged for his daughter to be married to the emperor. This was a successful strategy for a few years, but once the emperor became a teenager, Wang Mang began to worry that the boy would get thoughts of his own. To make matters worse, an awkward episode had occurred a few years earlier. Wang Mang’s son, along with several of the emperor’s uncles, had attempted a coup to wrest power away from the increasingly dominant Wang Mang. They had been discovered and Wang Mang had them all put to death, including his own son. But as Emperor Ping got older, Wang Mang worried that he might not be too happy about the fact that Wang Mang had killed all of his uncles. So he nipped this problem in the bud by poisoning the Emperor. At this point Wang Mang had become so powerful that he essentially had free reign in choosing the next emperor. The last few emperors had all died so young that they had no heirs and so the closest candidates for succession were all quite distant in the imperial line. Wang Mang settled on Ruzi Ying, who, conveniently enough, was only one year old, and so wouldn’t cause any trouble for quite some time. At this stage, Wang Mang’s long game of bringing the court scholars and officials onto his side began to pay off. Over the next three years a series of auspicious omens started to trickle in, and a chorus of officials in court began to propose, first obliquely, and later loudly, that he assume the title of emperor. Finally, in 9 AD, Wang Mang held a formal ceremony, in which he and the four-year-old Emperor stood before the Imperial Court together. Wang Mang held the child’s hand and performatively wept before the child “for a long time.” He then explained to the child before the whole court that the Han Dynasty had been blessed by the Mandate of Heaven for many years, but that the great Han Dynasty had come to an end. Now the Mandate of Heaven had fallen to him. According to the Han Shu, he said Oh Emperor Ying! Formerly August Heaven supported your Great Ancestor [Liu Bang, the founder of the Han], so his descendants succeeded for twelve generations, and possessed the state for two hundred and ten years, [but now] the sequence of reckonings rests on my person. This last phrase, the “sequence of reckonings,” is “li shu,” and in essence referred to the authority to set the calendar. Shortly after taking the throne, Wang Mang created seven high ministers and associated each one with one of the planets, with the exception of Saturn, instead substituting in the Big Dipper. For example: Jupiter has charge of conscientiousness; [under its patronage] the Grand Master of the Eastern Peak sees to it that timely rain comes about, and by its cerulean brilliance he promotes peace, examining the shadow using a gnomon. Each of these ministers was not only associated with a planet, but also an astronomical measurement. In this case it was measuring the shadow from a gnomon. The minister associated with Mercury was tasked with the keeping of the water clocks and the minister associated with the Sun was associated with the compass — the kind you draw circles with, not the kind you find north with. Well, having at long last formalized his de facto rule, Wang Mang took much less time adopting the ritualistic symbols of a new dynasty than the Han dynasty had two centuries before. Now, you may recall from the last episode and the one before that, that an important feature of Chinese semiotics was the “wuxing” system in which the five fundamental elements of earth, metal, wood, water, and fire existed in various relationships to each other. Each dynasty had been associated with an element. Now, traditionally, the elements associated with subsequent dynasties had been assigned to the so-called destructive or conquest cycle. So, since the Zhou dynasty had been associated with fire, the following dynasty, the Qin dynasty, should be associated with water, since water extinguishes fire. This seems natural. But in the century leading up to this new Xin dynasty, a new line of thought started to become more popular among the scholars. As you may have intuited by this point, particularly among Confucian factions, continuity with the past was highly prized. Even when a rebel king or an ambitious official effectively seized absolute power for himself, he was very slow to formally adopt the title of Emperor and would do so only after years of laying the appropriate groundwork and at the urging of the court. In the case of the Han dynasty the first Han Emperor had to be persuaded into the role and it took about a century for the Han Emperors to formally declare themselves to be a new dynasty. With the Xin dynasty we just saw how the new Emperor stood before the court with the former emperor to emphasize this continuity with the past. Given this attitude, scholars of the time wondered whether the destructive or conquest cycle of the wuxing was really appropriate to describe dynastic successions. After all it has connotations of violence, conquest, and, well destruction. But wasn’t it really more appropriate that these dynastic successions be associated with the more peaceful generating cycle instead? There was a change, yes, from one dynasty to the next, but each dynasty grew out of the one that came before, rather than destroying it and replacing it with something new. So, over the course of the Han dynasty, some time after the calendar reform, the idea started to become popular that the true element associated with the Han dynasty was not Earth, as had been previously assumed, but Fire. Scholars went all the way back to Shang dynasty, which had been associated with the element of metal. But in the generating cycle, metal is followed by water, since water condenses onto metal. The Zhou dynasty was thus associated with water. Then the Qin dynasty was associated with wood, since water nourishes wood. And thus the Han dynasty was associated with fire, since wood feeds fire. This meant that when Wang Mang established his new Xin dynasty, it was associated with Earth, since fire produces ash. Well if you can remember all the way back to the beginning of this episode, my point in talking about all this was to talk about the system that Liu Xin implemented. Liu Xin was an esteemed scholar and astronomer and was a friend and staunch supporter of Wang Mang. Liu Xin had been among those who laid the political and intellectual groundwork for Wang Mang to take the imperial title. When Wang Mang finally established his new dynasty, Liu Xin was intimately involved in setting the new calendar. Now, if you remember from the last episode, in the calendar reform of 104 BC, the idea had been to set as the starting point of the new calendar the winter solstice of 105 BC because this day happened to not only be the winter solstice, but it was also the first day of the month, or in other wor"
