description = "In his second attempt, Matteo Ricci was able to gain access to the Forbidden City. Over the next century, the Jesuits came to surprising influence in China through their knowledge of European astronomy, though this journey was not without its perils."
full_description = "Episode 44: Ad Maiorem Dei Gloriam Per Astra July 20, 2024 In his second attempt, Matteo Ricci was able to gain access to the Forbidden City. Over the next century, the Jesuits came to surprising influence in China through their knowledge of European astronomy, though this journey was not without its perils. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. Last month I started to tell the story of the arrival of the Jesuit missionaries to China and I left you on something of a cliffhanger. The principal missionary, and for many of the early years, really the only missionary, was Matteo Ricci. His overriding goal was to travel to the capital city of Beijing, ingratiate himself to the most powerful officials, and ideally the emperor himself, and gain the permission the Jesuits needed to evangelize in this country that had been closed to outsiders for centuries. And after 18 years in China, having once tried to visit Beijing and been kicked out within just 24 hours, in 1600 Ricci finally felt that he had accumulated enough credibility to try his luck at visiting the capital once again. Now, up until this point I’ve basically implied that the whole operation of the Jesuit mission was just Ricci. And, to be fair, for many years, that really wasn’t too off from the mark. Michele Ruggieri had been with him at the beginning, but he had gone back to Italy and had ended up dying there. And from time to time new priests would arrive to join the mission, but many of them died either on the long journey or shortly after arriving. But by 1600, Ricci had managed to gather a small coterie of missionaries around him. There were eight Jesuits in China all together, two of whom were Chinese. Ricci made his journey to Beijing with these two, along with Diego de Pantoja, who was a Spaniard who had arrived in the country three years earlier. Ricci had also developed a good relationship with a court eunuch in Nanjing, and the eunuch agreed to assist Ricci in his journey. Despite all this, this was still a risky endeavor. By law, as a foreigner, Ricci was not allowed to enter the capital city unless he was delivering tribute to the emperor on behalf of a vassal state. And indeed, when he got to the outskirts of Beijing he and his entire party were arrested. During his arrest his mathematical and astronomical books, in particular, were confiscated. As I mentioned in Episode 38, astronomical knowledge was treated in Chinese society as a state secret. So naturally these especially sensitive documents were seized. But already, Ricci’s work from the past few years at cultivating his reputation with court officials had started to pay off. News of his arrest reached the emperor himself, and the emperor had heard enough stories floating through his court about this curious figure that he ordered Ricci and his party to be released and granted them permission to visit Beijing. In exchange, when Ricci arrived at court, he offered the Emperor several oil paintings and a pendulum clock. Ricci’s gift of the clock was something of a stroke of genius on his part. On the surface it was a very appropriate gift that highlighted the new, technical knowledge he was bringing to China. As I described in Episode 41, the court astronomers in China had been using water clocks to make their observations for millennia and they were very interested in precision timekeeping. Here was a clock that functioned by an entirely different mechanism. This gift was a tangible indication of the value of the knowledge he was bringing, of which this was just the start. But Ricci had an ulterior motive for giving this gift in particular. The clock was displayed in a prominent place in court, but the mechanical clocks of the day were finicky and required regular adjustments and the weights would periodically have to be reset. This gave Ricci and his colleagues an excuse to frequently visit the court, where they might happen upon various officials and could strike up conversation with them. Ricci found that court officials in Beijing were just as eager to meet with him as they had been back in Nanjing and he had a constant stream of visitors. One of his early claims to fame was in providing a proof that the Sun is larger than the Earth and that the Moon is smaller than the Earth. What evidence he presented isn’t recorded, but it seems to have made an impression at court. That said, Ricci did not only attract attention based on his knowledge of Western science. A healthy dose of exoticism seemed to help, too. In particular, Ricci’s Spanish companion, Diego de Pantoja, had blue eyes, and apparently that alone was reason for a number of curious officials to drop by. Pantoja wrote, “The Chinese find [my eyes] very mysterious, and normally say that my eyes spy where to find precious stones and the like…claiming even that they have characters written inside them.” Ricci even managed to obtain a residence outside of the usual quarters that were reserved for foreign delegations. And Ricci’s growing renown within Chinese high society at long last started to pay dividends for the Jesuit mission as a whole. Now, when the Jesuit superiors sent missionaries to other parts of the country, they could declare their association with Ricci. If they got in trouble with local officials, word would eventually come down from the Imperial court to leave the Jesuits alone. With the fame of the Jesuits growing, these other missionaries started to have more success at converting government officials. As I mentioned at the end of the last episode, one of the major impediments to an official’s conversion was that he would have to give up his concubines. And any official of stature would have a number of concubines in his household as a sign of his high status. So generally the missionaries had more success with very old retired officials, who no longer needed to engage in the rat race, or young men who had not yet taken the imperial examination and who had no concubines to give up. But even still, from time to time they would score an important official and convince him to convert to the faith. And what’s more, typically when this happened, he would bring his entire household along with him. So convincing an important official to be baptised could result in the conversion of some twenty or thirty souls. Sadly, though, the imperial policy of frequently rotating officials through the provinces posed an issue. Oftentimes, a couple of years after converting, an official would be ordered to move to some distant province, along with his entire household. And because the Jesuits only had a handful of missionaries placed in a couple of strategic places throughout this vast country, the official was likely to end up somewhere without a priest and was liable to drift away from the faith. And even still, the numbers were relatively small. By 1605, the Jesuits estimated that they had no more than a thousand converts, compared with more than two hundred thousand over in Japan. So it was still hard to convince their superiors to send more resources or missionaries to China. And, what’s more, around this time, persecutions of Christians in Japan were starting to ramp up. In 1597 26 Christians had been crucified, and this was just the start. To a fervent young Jesuit who was asked to decide between going to China or Japan, the choice was obvious — the allure of potential martyrdom was hard to resist. So, despite their slow but steady progress, the Chinese mission continued to be chronically understaffed. At any rate, back in Beijing, two of the most important converts that Ricci obtained were Xu Guangqi and Li Zhizao, who were both very high ranking officials. Xu Guangqi eventually became the Grand Secretary, and both had a deep interest in mathematics and astronomy. They worked on Chinese translations of Euclid’s Elements and Aristotle’s On the Heavens. But more importantly, they were the key to the mission’s staying power, because the mission was about to face its most uncertain period. One of the key roles they played came after Matteo Ricci died in 1610. With their help, the Jesuits obtained permission for Ricci to be buried in a cemetery just outside of Beijing, and the Emperor even issued a proclamation eulogizing him. This was a major coup, at least in the Jesuits’ view. With Ricci’s burial plot in Beijing, the Jesuits would have a perpetual justification for being there — they could point to the Confucian duty of honoring an ancestor’s tomb. João Rodrigues wrote that Ricci had “[done] more with his death than with his life.” Now, the Jesuits may have been overstating things a bit. It was not uncommon for the Emperor to grant permission for foreign ambassadors who had died in the capital to be buried nearby. After all, just from the logistics, in those days you couldn’t transport a cadaver all that far before it started to decompose pretty heavily anyway. But the Jesuits were happy to seize on whatever excuse they could to stay in the country, and more importantly, near the capital. After Matteo Ricci’s death, the Jesuit mission in China was led by Nicolò Longobardo. Longobardo felt that Ricci had put the mission on a solid footing and reported that in his estimation the Jesuits had ensconced themselves in China for good. Ricci had managed to obtain a salary from the imperial government, and even after his death, the Jesuits continued to receive these payments. The imperial court valued their mathematical and astronomical knowledge. And, he believed that now that they had seen the inside of the Forbidden City for so many years, the Chinese emperor was unlikely to allow them to leave and take the secrets they had seen within his walls with them. In fact, as precedent, in western China, if Muslim merchants stayed in China for nine years, they were forbidden from ever leaving. But, as unimpeachable as Longobardo’s reasoning was, it turned out to be wrong. Although they didn’t know it, at this point they were in the twilight years of the Ming Dynasty. The current emperor, called the Wanli emperor, had been emperor for quite some time, forty years at this point. His own ability and interest in ruling had been in decline for a while. Throughout his reign he had struggled to tame the various factions that warred amongst themselves in his court. And as the decades passed, he seems to have just grown fed up with the court politics and after he failed to push through a reform in 1606, he essentially withdrew from governance and gave his underlings free reign. In the broader society this was also an interesting time. There was a huge increase in manufacturing activity and trade in the private sector, but simultaneously there was a decline in institutional capacity, since without leadership from the emperor, the bureaucracy essentially turned inward on itself and engaged in infighting. This seems to have produced a general kind of anxiety, at least among the literate classes, that channeled itself into what we might broadly identify as a religious revival. This ended up taking several different forms in different places. Among a very small minority, this led them to this new religion of Christianity. But more commonly, it led to an increase in fervor among Buddhists and Taoists or, on the other side, it led to a return to a stricter Confucianism. Now, initially, court officials were all too happy to have the Jesuits on their side against the Buddhists. The Jesuits wrote a number of tracts vigorously condemning various aspects of Buddhism and court officials were eager to attach their own names to these tracts by writing introductions to them. But a strategy of the enemy of my enemy is my friend is not completely stable. Over the years a faction of more hardcore Confucians came to distrust the Jesuits. The anti-Jesuit faction, which the Jesuits internally referred to as the “ministers of Satan,” was led by an official based out of Nanjing named Shen Que. One of the sources of tension was of a more temporal than spiritual nature. Early on Ricci had attempted to move away from the Portuguese trading colony at Macau so that the Jesuit mission wouldn’t be tarnished with the poor reputation of the Portuguese merchants anytime they stirred up local ire. Nevertheless, even in Beijing and Nanjing the Jesuits couldn’t completely escape this association. At some level it was inescapable that many officials would paint all westerners with the same brush. But the Jesuits and any funds supporting them also had to travel through Macau to interact with their superiors who were in charge of the overall mission in Asia. To try to stave off these associations in the early 1610s, Longobardo managed to get the Chinese mission to become organizationally independent of the overall Asian mission in order to reduce the frequency that missionaries would have to pass through Macau. But this distancing was not enough and there were many other, more spiritual or religious reasons for the orthodox Confucians to oppose the presence of the Jesuits. So in 1616 Shen Que published a series of memorials attacking the Jesuits. Shen Que alleged a whole litany of crimes that the Jesuits had committed: the words “Heaven” and “Great” were reserved for the emperor, yet the Jesuits appropriated those words for their own God; they were spies for the Portuguese; they illegally dressed as Confucian scholars despite being barbarians; they bribed the Chinese to convert to their religion; they were alchemists. But to Shen Que, the biggest crime that the Jesuits had committed in this long rap sheet was that their foreign astronomical theories were corrupting traditional Confucian teachings on the heavens. The other crimes that the Jesuits had committed were bad, of course, but could be solved easily enough by expelling them. But, once introduced, these new astronomical ideas would be much harder to expel. And if some pillars of traditional Chinese thought were to collapse, what was to prevent the other pillars from collapsing in the future? Had this happened 15 years earlier, that might have been the end of it. Shen Que would have published his memorials, but at the time the emperor clearly was intrigued enough by the foreigners knowledge that he wanted to keep them around. But in 1616 there effectively was no emperor running things. Shen Que got his companion at the Beijing Ministry of Rites to sign off on the memorial and then ordered the arrest and expulsion of all the Jesuits from China. Shortly thereafter, six Jesuit priests in Beijing and Nanjing were arrested, locked into wooden cages, and transported back to Macau and ultimately back to Europe. Twenty-three Christians were also arrested. Once word got out of the arrests the remaining fourteen Jesuit priests throughout the country, including Longobardo, went underground. The Je"
