description = "In the year 1900 a team of sea sponge divers stumbled upon a shipwreck from the late Hellenistic Era. Among the statues, coins, and jewellery, the salvage crew pulled out a small box covered in moss. Initially ignored, the contents of this box proved to be the most sophisticated mechanical device that survives from the ancient world. The Antikythera mechanism computed all the known motions of the heavens and its complexity was described by one scholar as"
full_description = '''Episode 22: The Antikythera Mechanism & Friends October 9, 2022 In the year 1900 a team of sea sponge divers stumbled upon a shipwreck from the late Hellenistic Era. Among the statues, coins, and jewellery, the salvage crew pulled out a small box covered in moss. Initially ignored, the contents of this box proved to be the most sophisticated mechanical device that survives from the ancient world. The Antikythera mechanism computed all the known motions of the heavens and its complexity was described by one scholar as "like finding a jet engine in King Tut's tomb." Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. At the end of the last episode I promised a little break in the general narrative I’ve been taking through Greek astronomy. Generally speaking, the last dozen episodes have been largely biographical in nature. Starting with Thales we’ve looked at the ideas and contributions of various individuals to Greek astronomy over the centuries up until Hipparchus in the late Hellenistic Era. But at this point, before rounding out Greek astronomy with the work of Ptolemy, I wanted to spend a bit of time talking about Greek instrumentation, and in particular the remarkable device known as the Antikythera Mechanism. So, I promised you a shorter episode on that subject. Well, as you can see from the show length, I have proven myself untrustworthy once more. My intentions were genuine, I really wanted a shorter show on different instruments in Greek antiquity. But as I was researching the show, I realized I had more or less already talked about the different instruments like the diopter and the gnomon in past episodes, so there wasn’t really a lot new for me to say. And at the same time I started reading about the Antikythera mechanism, and reading about it and reading about it, and I realized that I had chosen a subject about which there was a lot more to say than I had originally anticipated. So there you go. This episode will have a typical length and it ill be exclusively on the Antikythera mechanism. So let’s get into it. The Antikythera mechanism is undoubtedly the most sophisticated computational device of the ancient world, and the natural place to start talking about it is, of course, hygiene practices in 19th century Europe. Now today, we keep things clean with sponges, but strictly speaking, the sponges you use to clean your dishes are not true sponges but artificial sponges. They are made of polyester and polyurethane usually, materials which weren’t invented until the 1940s and 1950s. So the kinds of sponges we use to clean things today didn’t exist until the mid 20th century and earlier generations had to use other materials. At least around the Mediterranean, a popular choice was a true sponge, that is to say, a sea sponge, a living creature with a soft, well, spongy texture. Sea sponges are animals, but really only barely. Evolutionarily, they branched off from the rest of the animals before any other kind of animal. As it happens, the waters around the eastern Mediterranean are nice and warm and are quite conducive to the growth of sea sponges. So, for millennia, the islands around Greece had supported an industry of sea sponge harvesting. This isn’t the first time we’ve encountered sea sponges in this podcast, I mentioned them in Episode 9 when I was talking about the graffiti in the public lavatory in Ostia Antica since one of them used the term xylospongium, which was a sea sponge attached to a stick with which you could wipe your bottom after going to the bathroom. At any rate, back before the invention of toilet paper in the late 19th century, having a sponge around was a useful thing if you were into hygiene. But getting these sponges was no easy feat. They don’t really swim around so you can’t just drop a fishing line or cast a net and hope to catch them the same way you can catch fish. The traditional means of harvesting sea sponges was for divers to use a technique called skandalopetra. The idea was that the diver would be naked and use a rope to tie a stone around his ankle. The stone, in turn, would be tied by a long line back to the ship. The diver would jump out of the ship and quickly sink to the depths thanks to the rock tied to his ankle. Then he would spend as long as he could looking for and collecting sponges at the seabed, and once his breath started to run out, he would cut the rock from his ankle and climb up the rope back to the boat. Then the rock could be hoisted up as well, and after the diver had recovered, the whole process could start all over again. This technique, centuries old, allowed an experienced diver to get to depths of about 50 meters or so, but it was limited by how long the diver could hold his breath, about one and a half to two minutes. Given the amount of time it took to dive down and resurface, he would have between 30 seconds and a minute at the bottom to find and collect any sea sponges. Given how grueling this feat was, along with all the preparation that went into securing and recovering the rock, an experienced diver could only make about 10 dives per day. So up until the late 19th century, sea sponges were certainly available in the Mediterranean cultures, but nevertheless not especially cheap. But this ancient industry changed dramatically in the second half of the 19th century. The 19th century had seen huge advances in diving equipment, and, in particular, by the end of the century, what is called standard diving dress had become fairly practical. Standard diving dress, which was called skafandro in Greek, is basically what you would imagine in your head when you think of an old-timey diver. The diver wore a thick canvas suit with a bronze globe on their head with little circular glass portholes on the front and the sides. Then they were connected to the surface with a long tube so they could breathe. Greek sponge divers were not precious about the old ways of doing things, and as soon as this new technology came about they became enthusiastic early adopters. The skafandro allowed the divers to attain depths of 70 m instead of the 50 m that had been possible previously, but more importantly, it hugely extended the amount of time a diver could spend at the seabed. Rather than spending barely a minute at a time looking for sponges, they could spend 25 minutes at a time. Even though with the bulky equipment they only could do two dives a day, that still allowed for five times as much gathering time as they had available previously. Now, this was still not a job for the risk averse, perhaps even more so than before. Decompression sickness was not well understood until the early 20th century, so frequently divers would die from this mysterious syndrome. Nevertheless the economic opportunity of harvesting sea sponges was so much that by the year 1900 there were about 50 teams of divers operating throughout the eastern Mediterranean, almost all of them Greek, though quite a few of these Greek crews were based out of the Ottoman Empire. Well, in the year 1900 a crew of six or seven sponge divers captained by Dimitrios Kontos had been working off the island of Symi. As was typical they had two boats, a mother ship that contained supplies and the sponge harvest, and a smaller diving boat that would make excursions during the day. The diving season lasted from April to October and when the season ended they headed back to their home port in Tunisia. But, just as in any good Greek tale, in the course of their travels a storm blew them off course. They found themselves at the island of Antikythera, where they sheltered for a few days. Now before I go on, I would do well to talk about the island of Antikythera itself a little bit since it lends its name to the famous mechanism that was discovered there. The name Antikythera is actually a fairly modern one. In antiquity the island was called Aigila. It’s not a big place, about 8 square miles, so it could never really support too many people. Its reputation in antiquity was for being a base for pirates. The island is strategically situated across from the island of Kythera — Antikythera just meaning opposite from Kythera, and the strait between the two is the most direct path to go from the Aegean sea to the rest of the Mediterranean. Naturally this was a convenient path for merchant ships to sail and so the island became a natural location for pirates to hang out and wait for their prey. Well Rhodes had tried unsuccessfully to rid the area of pirates for many decades, and the rise of Rome led to a further increase in piracy in the region. You see, in 167 BC, Rome was able to force the port of Delos to be duty free — any goods passing through it would be untaxed. This, naturally, made Delos an extremely attractive harbor to stop at relative to Rhodes which did have a tax. After this happened, the income Rhodes generated from its harbor tax dropped by some 85% and consequently Rhodes was unable to fund its anti-piracy operations in the region and piracy started to become a much bigger problem. Since Rome had effectively kneecapped the anti-piracy task force of Rhodes, by the mid first century BC Rome realized that if someone was going to do something about the pirates it would have to be them. Although Rome was not especially known for being a naval power, it nevertheless raised a navy and around 67 BC eradicated the pirate menace in their typically brutal fashion. Well a few years after that a merchant ship was traveling from the Aegean Sea towards the western Mediterranean. It probably departed from one of the major ports, either Rhodes or Pergamon, and at any rate was carrying goods which had originated from a variety of locations. Where it was going we don’t exactly know, but it probably would have stopped at a number of ports and its cargo would then be passed at those major ports to a smaller ships onward to a variety of final destinations. Since the threat of pirates was gone the ship could take the more direct path near the islands Kythera and Antikythera. But tragically the ship was likely caught in a storm. Being heavily laden with cargo it quickly sank not too far off of the coast of Antikythera. We know that at least two men and one woman died, along with a fourth individual whose gender can’t be determined from its skeletal remains. Now an older theory has it that this was a ship containing loot for a triumphal procession of Julius Caesar since the ship contained so many valuable artifacts from so many different locations. But as modern scholarship has learned more about the ancient maritime trade, the consensus is that this ship is consistent with being more or less an ordinary merchant vessel of the time. At any rate, centuries passed and by the late middle ages, after the 4th Crusade, the island came under the rule of the Republic of Venice where it acquired the name Cerigotto to distinguish it from the island opposite it which got the Italian name Cerigo. It remained a possession of the Republic of Venice of frankly not much value up until the Napoleonic Wars in the early 1800s. After the chaos of Napoleon had shaken out, the island ended up in the hands of the British government where by 1815 it had been spun out as a part of an autonomous protectorate called the United States of the Ionian Islands. Now, politically, this region was starting to get pretty restive as the 1800s progressed. By this time the Greeks had not had a state of their own for some 2000 years since the Hellenistic Era. They had by turns been governed by the Romans and the Byzantines and the Ottomans. And now some of them felt that it was high time that they govern themselves. Being fairly remote, the island of Cerigotto became a hotbed for Greek patriots who needed to get out of dodge for a little while. Being full of patriotic fervor they had no use for an Italian name for the island so they Hellenized it, turning Cerigo into Kythera, and hence the island opposite it, Antikythera. Now in the 1820s, the Greeks had revolted against Ottoman rule. These kinds of revolts had occurred sporadically over the centuries and had always been put down by the Ottomans, and as this one progressed, it looked like the story would end the same way. But the great powers of Europe of the day, Britain, France, and Russia, spied an opportunity. In the 18th century the Ottoman Empire had been a thorn in the eastern side of Europe, so, hoping to take it down a peg, they provided major support for the Greek revolt as it was dying out and with their help they managed to turn things around for the Greeks and carve out a small independent Greek state. In a conference in London in 1830, Britain, France, and Russia created a government for this new state — the Greeks themselves would have no say of course — and settled upon a monarchy. Since they needed to preserve the balance of power between each other, they agreed that the monarch of Greece would not be of British, French, or Russian extraction. So they settled on a royal from the Bavarian line who was friendly with them all, a man who became King Otto of Greece. Now, King Otto was not very popular with the Greeks. He imposed high taxes and as we would say today, he was not a good culture fit. He was Catholic and had no desire to convert to Greek Orthodoxy. He managed to rule for some 30 years, but his unpopularity ultimately caught up to him and in 1862 he was overthrown. At this point, the Greek elite started searching around for a replacement. Monarchy was still in favor and the Greeks understood that their small state was vulnerable and that they needed to maintain the support of the great powers if they wanted to survive as a state neighboring the much larger and more powerful Ottoman Empire. So they wanted a European royal to replace King Otto and they had a particular man in mind — Prince Alfred, a member of the British royal family and the Duke of Edinburgh. If they could get a Brit on board, not only would they automatically have the continued support of one of the greatest powers in Europe, they could grow the Greek territory by subsuming the United States of the Ionian Islands that Britain possessed. The Greeks harkened back to their ancient democratic roots and held a plebiscite in which 240,000 people voted to express their preference for their next king, and Prince Alfred got a stonking 95% of the vote. But sadly this plan was a no go. The London Conference had held that the Greek crown could not pass to British royalty, or French or Russian royalty for that matter. So after scrounging around the Greeks settled on an alternative, Prince Wilhelm of Denmark, who was friendly with the British royal family and took the name King George. But all is well that ends well and the Greeks got what they were hoping for all along. As a coronation gift, Britain c'''
