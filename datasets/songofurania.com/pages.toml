description = "Miletus became a wealthy Greek city during the Archaic Period and developed a thriving intellectual culture which included many of the most important pre-Socratic astronomers. We looked at Thales in the last episode and now we try to understand the astronomy of other members of the Ionian School --- Anaximander, Anaximenes, and Heraclitus. What did their astronomy have in common with each other and what are the connections between their ideas and the ideas of modern physics?"
full_description = "Episode 10: The Ionian School October 19, 2021 Miletus became a wealthy Greek city during the Archaic Period and developed a thriving intellectual culture which included many of the most important pre-Socratic astronomers. We looked at Thales in the last episode and now we try to understand the astronomy of other members of the Ionian School --- Anaximander, Anaximenes, and Heraclitus. What did their astronomy have in common with each other and what are the connections between their ideas and the ideas of modern physics? Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. In the last episode we explored the ideas and discoveries attributed to the first named Greek astronomer, Thales of Miletus. Our picture of Thales was somewhat vague for two reasons: firstly, he never wrote anything down, and secondly, even if he had written anything down, nearly all texts from his time and the subsequent few centuries were lost. So we have to go on later authors describing what earlier thinkers like Thales believed, and sometimes these later surviving sources were several times removed from the original philosophers, quoting texts which quoted texts, which quoted the original work. So we unfortunately have to be somewhat imprecise about what Thales thought, and unfortunately this lack of precision will continue to be with us for the other early Greek natural philosophers. Now as his name, will tell you, Thales of Miletus was from a town called Miletus. The town of Miletus is essentially just a set of ruins today, but during the latter part of the Archaic period of ancient Greece, around the sixth century BC, Miletus was one of the richest cities in Greece or indeed the ancient Mediterranean. Miletus was on the western coast of Asia Minor and was ideally situated between Greece to the west, Babylonia to the east, and Egypt to the south. As a lynchpin of international trade in its day, grew wealthy and became capable of supporting a rich intellectual life, both because of the material wealth that the city saw, but also as a nexus for Greek, Mesopotamian, and Egyptian ideas to mix. Many of the earliest known Greek philosophers either hailed from Miletus or its environs, or came to Miletus to make their name. This early intellectual revolution was termed the Ionian Enlightenment by the late American physicist John Freely, Ionia being the region of Greece in western Anatolia where Miletus was situated. In due time the intellectual center of gravity in ancient Greece shifted from Miletus to the better known city of Athens, but during the Archaic period, Miletus was where it was all happening. Miletus continued to be an important city for many centuries to come — it’s even mentioned in the Acts of the Apostles as one of the cities to which St. Paul travels — but over time environmental degradation led to the decay of the city. The harbor accumulated silt, nearby pastures were overgrazed, the land was deforested, and by the 15th century AD the city was abandoned. Well we heard extensively about the best known Milesian in the last episodes, Thales. But Thales was not the only astronomer to come from Miletus. In this episode, we will cover three others: Anaximander, Anaximenes, and Heraclitus. These three, together with Thales, make up what we today call the Ionian school of philosophy, or sometimes the Milesian school. So let’s start with the first of these, Anaximander. It seems that Anaximander was slightly younger than Thales. Whereas Thales lived from around 623 to 545 BC, Anaximander lived from around 610 to 546 BC. So Anaximander was perhaps 10 to 15 years younger than Thales. For this reason, it is generally thought that Anaximander was a pupil of Thales, though it is entirely possible that Anaximander came to philosophy independently of Thales and the two were peers. As I mentioned in the previous episode, unlike Thales, Anaximander actually wrote his ideas down in a work we today call On Nature, although we don’t actually know what he himself titled it because, like almost all works of the time, it was lost to history. According to Diogenes Laërtius, Anaximander wrote this text very late in life, at the age of 64, which if you do the math, is only four years or so before he died. Though, as you may recall, Diogenes Laërtius is a rather dodgy source. Well, you may remember from the last episode that one of the few things we know for certain about the natural philosophy of Thales was that he believed that water was the source of all things. Anaximander was also interested in this question of metaphysics. Unlike Thales, though, Anaximander did not believe that the source of the material world was any particular form of matter. Instead he posited that material things came from what he called the “apeiron” which could be translated as the “Infinite.” Anaximander argued that the material world in all its variety, and in particular its sets of opposing pairs: hot and cold, wet and dry, could not have come from any single material substance since any single substance would have particular qualities and would be unable to generate its own opposite. Thales said that all matter comes ultimately from water: the Earth and atmosphere separated out from the water, but the Earth was dry. Anaximander asked how this could be possible. You would need some substance which was already or inherently dry that could dry out the water and precipitate earth. But if all was water in the beginning no such substance existed. So there had to be something else, something which contained in itself all pairs of opposites. Well, I am riffing a little bit on these ideas, again, we only have fragments of Anaximander’s original texts so we have to guess a little bit about why he thought the way that he did by trying to piece together a coherent thread of argumentation from the various mentions of his philosophy here and there by other authors. But an idea that was central to Anaximander was that this apeiron, this Infinite, contained opposites and that these opposites were dynamically, continually created from the Infinite and continually returning to the Infinite. In Anaximander’s world, everything was in motion and motion was eternal. Because of this Anaximander believed that there were a multitude of worlds — an infinite number, in fact. The text is a bit ambiguous as to what exactly he meant here. It is possible that he meant that there were a multitude of worlds continually springing into being and a multitude of worlds continually being destroyed, so that at any given time there were an infinite number of worlds in various stages of existence. Or it is possible that he believed that at any given time only a single world existed, but after it died away a new one would be born in its place. One of the few lines we seem to have direct from Anaximander can be found in Simplicius’s work Physics. Simplicius writes: Anaximander of Miletus, son of Praxiades, who was the successor and pupil of Thales, said that the first principle (or material cause) and element of existing things is the Infinite, and he was the first to introduce this name for the first principle. He maintains that it is neither water nor any other of the so-called elements, but another sort of substance, which is infinite, and from which all the heavens and the worlds in them are produced; and into that from which existent things arise they pass away once more, “as is ordained; for they must pay the penalty and make reparation to one another for the injustice they have committed, according to the sequence of time” as he says in these somewhat poetical terms. And this eternal cycle of generation and destruction was not limited to entire worlds, but Anaximander argued that we saw it in smaller form through the course of seasons and days and in the weather as the Earth and heavens continually exchanged heat and cold, light and dark, wet and dry. This dynamic, cyclical picture of the universe in which pairs of opposites are continually generated, exchanged, and destroyed back into the apeiron in fact has some parallels to the modern picture of quantum field theory which developed in the middle part of the 20th century AD. In this picture the vacuum of space is not so much a void, but has something of the infinite to it and sees an eternal dynamically changing landscape of pairs of virtual particles and anti-particles springing from the vacuum, lasting a short while, and then collapsing back in on themselves, annihilating each other in the process. Indeed, in the latter part of Werner Heisenberg’s life in the 1950s and 1960s, he, like many other physicists of that era, was searching for a unified field theory, a theory of physics that would encompass all known physical forces. And he came to believe that ultimately, the various elementary particles that we observe are not distinct, but must be particular stable solutions to an underlying, indeterminate form of matter, in a similar way to how the six Platonic solids, the cube, pyramid, icosahedron, and so on, are various manifestations of the underlying concept of a three dimensional solid with equal faces. The physicist Max Born saw the similarity of this underlying substance to the apeiron of Anaximander and began to call it such. Well, ultimately Heisenberg was not able to work out a complete and consistent unified field theory before his death, but it is apparently a very tricky problem. Physicists have now been attempting to find a unified field theory, or more generally a grand unified theory, for half a century now without success. Well, although Anaximander’s metaphysical idea of apeiron, the Infinite primordial substance, may be somewhat back in fashion today, we cannot say the same of some of his other ideas. According to Pseudo-Plutarch, you’ll remember him as the unknown author who tried to pass of his writings as those of the more famous author Plutarch, he wrote about Anaximander’s cosmogony, …that which is capable of begetting the hot and the cold out of the eternal was separated off during the coming into being of our world, and from this there was produced a sort of sphere of flame which grew round the air about the earth as the bark round a tree; then this sphere was torn off and became enclosed in certain circles or rings, and thus were formed the sun, the moon, and the stars. Like Thales, Anaximander also had a cosmology — a model of the structure of the universe. Anaximander agreed with Thales that the Earth was a short cylinder. However, Anaximander went further than Thales and actually specified the proportions of the cylinder — he claimed that the diameter of the cylinder was three times as large as its height. Unfortunately only this claim survives, we don’t actually know how he arrived at this assertion. Pseudo-Plutarch simply writes that The earth [Anaximander] says, is cylinder-shaped, and its depth is such as to have a ratio of one-third to its breadth. And that is all there is to that. So it would appear from his cosmology that we do not see any especially sophisticated ideas. But there is an interesting detail in his cosmology that is actually remarkably sophisticated and would have important implications through the history of physics right down to today. And this is that unlike Thales, who posited that the cylinder of the Earth was floating in a vast ocean, Anaximander posited that the cylinder of the Earth was actually suspended in air. Well how is this possible? How could the Earth maintain itself suspended in air when gravity, it would seem, should pull it down? When Aristotle was explaining the ideas of Anaximander in his work on physics Aristotle presented the argument that this was possible because the Earth was equidistant from all the other heavenly bodies. Specifically, Aristotle says, for that which is located in the center and is similarly situated with reference to the extremities can no more suitably move up than down or laterally, and it is impossible that it should move in opposite directions at the same time, so that it must necessarily remain at rest. In essence, because the Earth is in the center of all things, it cannot arbitrarily pick out some direction to go and move toward it. So it stays in one place, at rest. Aristotle rightly describes this argument as ingenious. Centuries later Isaac Newton invoked a similar argument. As we’ll discuss in depth in a much later episode, one of Newton’s crowning achievements was the discovery of the force of gravity, the attraction of all masses in the universe for each other. This discovery beautifully explained the observed motions of the planets, but it presented some serious cosmological issues as Newton started to think about it more deeply. Some time earlier, the chemist Robert Boyle, after his death, had left some money in an endowment to fund an annual series of lectures to combat atheism, a dangerous idea that God did not exist and which was starting to spread alarmingly in the intellectually raucous London coffeehouses of the late 17th century. In 1692 a theologian named Richard Bentley was selected to give the first of these lectures, and he decided to use the modern scientific ideas of Newton to demonstrate the error of the atheists’ notions by demonstrating that the known laws of physics necessitated divine intervention. Newton, being a strong, though unorthodox, theist, readily approved of Bentley’s idea. Bentley wanted to make sure he had the science correct and the two sent a number of letters back and forth with Bentley asking points of clarification and Newton responding. In particular, what Bentley wanted to know was what would happen if the universe were finite, and what would happen if it were infinite? Because it would seem that if the universe were finite in extent, then the mutual attractive force of gravitation would pull all the matter together and it would all collapse in on itself. Newton agreed that all matter would “fall down to the middle” and “compose one great spherical mass.” But if the universe were infinite, Newton assured Bentley that the universe could not collapse in on itself because the force of gravity would pull equally in all directions and the matter would not know which way to fall. Since we observe that the universe was not one great spherical mass, this meant that the universe was necessarily infinite in extent, which was invoked in the lecture as evidence of God’s infinite power and majesty. This sort of argument from symmetry, that the Universe could not simply arbitrarily choose between two equal things, grew in importance in physics over the following centuries and became a centerpiece of 20th and 21st century physics. By the 20th century, physicists were frequently invoking various kinds of symmetries to place constraints on the various possible form of physical laws. Of co"
