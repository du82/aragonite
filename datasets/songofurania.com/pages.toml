full_description = "Episode 7: Greek Tales of Ancient Nights & Days July 24, 2021 As we start to examine the astronomy of Ancient Greece we hear of the myth cycles of Theseus and Perseus, episodes from both of which appear in the night sky. These myth cycles help us to understand the conception the ancient Greeks had to the civilizations that came before them, the Minoans and the Mycenaeans and prepare us for the early cosmology of ancient Greece. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well in the last five episodes our focus has been on the astronomy of the Babylonians and we’ve followed its development from the earliest inscriptions we have around 2000 BC up until its pinnacle in the last few centuries BC when it was under the rule of the Persians and the Macedonians. There is still quite a bit that I’ve had to leave out about the Babylonians in the interest of time, and here and there I’ll briefly make mention of other aspects of their astronomy that I left out because, by virtue of having the most sophisticated astronomy of the ancient world, they had a strong influence on the astronomy of nearby cultures, particularly the Greeks. But if this series ever has a hope of getting to the present day as the tagline promises, we need to move along. So, now our attention turns to the civilization that built upon the astronomy of the Babylonians and ultimately developed a cosmological model which would hold sway in the West for some fifteen centuries — the Greeks. Now, in order to understand the development and unique characteristics of Greek astronomy we are going to have to back up in time a little bit. When we finished with the Babylonians we had made it to the last few centuries BC. After the death of Alexander the Great, Babylon was squabbled over by Alexander’s generals in what have come to be called the Wars of the Diadochi, diadochi roughly meaning successor. These wars were hard on the citizens of Babylon and many of them left the city. Finally, in 275, one of the diadochi named Seleucus forced the residents of Babylon to move to his newly constructed capital city some 40 miles north, which he modestly named Seleucia. But a remnant of priests remained at the Babylonian temple because astronomical records continue for some time, with the last record we have dating to around 100 AD. We will one day return to these events from the Greek perspective, but by 300 BC quite a lot has already happened over in Greece, so now we need to back up quite a few centuries. Now you may recall from Episode 4 that one of the defining events in the history of the ancient world was the Late Bronze Age Collapse during the 12th century BC. All across the region, from the eastern Mediterranean to North Africa, to the Levant and Near East, civilizations suddenly collapsed over the course of just a few decades. The Kassite Empire in Babylonia collapsed, along with the Hittite Empire in Anatolia, or modern day Turkey, and the Amorite states in the Levant. The kingdom of Egypt survived the collapse, but was drastically weakened, both in terms of territory controlled and overall economic power. And the late bronze age collapse did not spare the region we are now going to turn our attention to, where modern day Greece resides. During the Bronze Age, this part of the world hosted two notable civilizations, the Minoans and the Mycenaeans. The Minoans were the older of the two and built a vibrant kingdom that emerged very early on the island of Crete around 3000 BC and developed for some 15 centuries before beginning a gradual decline around the 16th century BC and then suddenly disappearing during the Late Bronze Age Collapse around 1100 BC. Later in the series we may talk about the astronomy of the Minoans, but for now the relevance of the Minoans to our story of the Greeks is that they built their civilization on land that the Greeks later occupied and this civilization persisted in the cultural memories of the Greeks through their mythical founder, King Minos. According to the myth, King Minos had a son named Androgeus who regularly competed in the Olympic Games every four years. Androgeus was a skilled athlete and excelled in the games. At the time, Aegeus was the king of Athens and had a brother named Pallas, who was apparently an extraordinarily prodigious man and had fifty sons, collectively called the Pallantides. Now, as we’ll see throughout our discussion of ancient Greece, there is no canonical form of the Greek myths in the same way that there is, for example, a canonical telling of the stories of the Hebrew Bible. In the Greek myths details or even major plot points can vary widely between different authors. In one telling of the story, the Pallantides became jealous of Androgeus’s athletic prowess and assassinated him. In another version of the story, they became good friends with Androgeus, which made King Aegeus nervous. King Aegeus feared that Pallas might use his sons’ friendship with Androgeus to conspire with King Minos to assassinate him and usurp the throne, and so King Aegeus preemptively killed Androgeus. Whatever the details, Androgeus winds up murdered in Athens and King Minos is understandably upset. He sends the entire Cretan fleet to Athens to demand satisfaction from King Aegeus. King Aegeus either does not know who the assassin was or, perhaps, was himself responsible for the murder and so he puts the entire city of Athens at the mercy of King Minos. King Minos then exacts a terrible tribute from Athens. Every seven years the city would have to send the seven most courageous young men and the seven most beautiful maidens in the city to Knossos, the capital city of Crete, where they would be thrown into a terrifying structure called the labyrinth. Now, apologies if this story is about as winding as the labyrinth itself, but Greek myths are a fairly intricately constructed web which makes it hard to tell one story in isolation of all the others. At any rate, Minos and his two brothers, Sarpedon and Rhadamanthus, were all demi-gods, sons of the god Zeus and the mortal Phoenician princess Europa. And many years prior, before Minos had ascended the throne, he and his two brothers had been adopted as stepchildren of King Astorion, the second king of Crete, whose father had been the first king to sail to the island. After the death of King Astorion, the three brothers fought amongst themselves for the right to rule the island. Minos was victorious and banished his brothers. Sarpedon fled to Asia Minor in a region called Lycia where he founded a city called Miletus, which as we will see, later became an important city for astronomy. Incidentally, in some tellings, Miletus was a fair boy whom Minos and Sarpedon both fell in love with and was the origin of the quarrel between the two brothers after Miletus chose Sarpedon over Minos. The other brother, Rhadamanthus, ended up in Boeotia in central Greece, but also apparently was associated with the other islands of the Aegean. All this is to say that King Minos had won the throne, but did not feel especially secure in his right to rule. So he prayed to Poseidon, the god of the sea, to send him a sign. And Poseidon answered his prayers and sent him a snow white bull, known today as the Cretan Bull. Now, something to know about relations between gods and mortals was that they were heavily dependent on sacrifice. When Poseidon sent King Minos the snow white bull, he expected King Minos to sacrifice the bull to him as a gesture of gratitude for the divine favor. But the bull was so beautiful that King Minos was loathe to give it up so he sacrificed an ordinary bull instead. This ingratitude enraged Poseidon, who then enlisted Aphrodite, the goddess of love, to cause King Minos’s wife, Queen Pasiphaë, to fall madly in love with the bull. In order to consummate her love, she ordered Daedalus, the finest craftsman in the land, to construct a hollow wooden cow that she could occupy. Daedalus then covered the wooden cow in a real cow hide so as to attract the Cretan bull. Queen Pasiphaë then, shall we say, came to know the bull in the Biblical sense, and gave birth to a half-man, half-bull creature which she named Astorion II, after its grandfather, but it became more commonly known as the Minotaur. King Minos was, naturally, horrified by this development and so he ordered Daedalus to construct an intricate prison called the Labyrinth in which the passageways twisted and turned, opening one upon the other, so that even the wiliest of prisoners could not find an exit. The maze was so subtle that after constructing it, Daedalus himself was hardly able to escape his own creation. King Minos then imprisoned the Minotaur in the center of the Labyrinth where it would find and devour any unfortunate prisoners who were thrown in the Labyrinth with it. Now, if I can briefly pause in the mythical narrative and turn back to the actual Minoans, the most impressive cultural artifacts that they produced were five extraordinary palaces across the island of Crete. By far the largest of these palaces is in the capital city of Knossos and was discovered by the archaeologist Arthur Evans in the year 1900. This palace is an enormous complex containing more than 1000 rooms, all connecting to one other in a complicated layout. Minoan artists also covered many of the walls in beautiful frescoes, a substantial fraction of which depict bulls, which apparently had special religious significance for the Minoans. On this basis Arthur Evans speculated that the palace of Knossos may have been the source of the ancient Greek myth of the labyrinth. Of course, in archaeology, as in astronomy, it is often difficult to find conclusive evidence and so there are other candidates for the historical source of the Labyrinth. In particular, there is a complex of caves near the city of Gortyn in the southern part of Crete which were expanded by humans. Or it is entirely possible that the mythical Labyrinth had no historical counterpart at all and was invented out of whole cloth by the ancient Greeks. One other note here, while we’re talking about the actual Minoans, is that the Kingdom of Minoa was not the name they had for themselves. The name Minoa was actually bestowed on them by Arthur Evans himself who speculated on the connection between the ancient civilization and the Greek myth of King Minos. Well, to return to the mythic narrative, recall that many years later, after the death of his son Androgeus, King Minos had extracted a tribute of seven young men and seven young women from Athens. Every seven years Athens sent their most courageous young men and their fairest maidens to Crete where King Minos threw them into the Labyrinth to be devoured by the Minotaur. And so things had proceeded for many years and during all this time, King Aegeus, the king of Athens, had had no children. Naturally he wanted an heir, so he did what all great Greek heroes did when they came at a crossroads in life — he went to visit the Oracle of Delphi. Then the Oracle of Delphi did what she did best — she provided a cryptic reply that invariably the hearer would not understand until it was too late and had come to pass. In this case, the Oracle told King Aegeus, “Loosen not the bulging neck of the wineskin great chief of the people, until you have reached the height of Athens, lest you die of grief.” King Aegeus could not understand the meaning of the prophecy and on his journey home stopped at the palace of King Pittheus in Troezen who was renowned for his erudition and wisdom. During dinner, King Aegeus recounted the prophecy to King Pittheus who immediately understood its meaning. But King Pittheus did not tell King Aegeus. Instead, over the course of the dinner, Pittheus plied Aegeus with unmixed wine. As a slight digression here, in ancient Greece wine was consumed copiously, but the Greeks almost exclusively diluted their wine with water, or sometimes snow for cold drinks. Drinking wine at full strength as we do today was seen has barbaric and potentially deadly. The Greek chronicler Pausanius tells in the second century AD in his book Description of Greece, that the Gallic chieftain Brennus had committed suicide by drinking undiluted wine. And Herodotus writes that the Spartan king Cleomenes I had adopted the practice of drinking wine undiluted from the barbaric Scythians and was subsequently driven insane. So when we see that Pittheus plied Aegeus with unmixed wine we are meant to understand that Aegeus was made well, truly, and hopelessly sloshed. King Pittheus then made his daughter Aethra sleep with the drunken King Aegeus. Later that night, as she was sleeping Athena, the goddess of wisdom, came to Aethra in a dream and instructed Aethra to waken, and quickly go to the neighboring island of Sphaeria. (Incidentally, this detail comes to us from the same Pausanius who warned us about the deadly effects of drinking unmixed wine in his Description of Greece.) In Sphaeria she was to pour out a libation to summon Poseidon and lay with him as well. The resulting child, named Theseus, was thus the son of both Poseidon and Aegeus and, like the hero Herecles, was demigod — half human and half divine. After King Aegeus woke up the next day, undoubtedly with a terrific hangover, he learned what he had done and it was not long before he discovered that Aethra was pregnant. King Aegeus needed to return to his kingdom, so he removed his sandals and sword and placed an enormous boulder on top of them. He then told Aethra that his son would be ready to come to his kingdom when he could remove the boulder and retrieve the items. Well sixteen years passed and Theseus grew in strength until one day he was able to move the rock and claim his father’s sandals and sword. Theseus then set out to meet his father in the kingdom of Athens. Theseus had the option of traveling to Athens by boat or over land, and being a young, scrappy hero in search of adventure and glory, he decides that the passage by land will be the more dangerous of the two journeys and opts for that. And indeed, in his travels along the bandit-infested roads he encounters six monsters, known as the Six Labors of Theseus. The first and last were the most well known. Theseus’s first labor was his encounter with the giant Periphetes, who wielded and enormous iron club. After Theseus defeats Periphetes he takes the club for himself and is often depicted holding it in art. In his sixth and final labor he encounters Procrustes who had a home in which he would invite weary travelers to rest. When he put them in his bed he would ensure that they fit exactly. If they were too tall, he would amputate the excess length from their body, and if they were too short he would stretch them out until they were precisely long enough. When Theseus passed by, Procrustes m"
