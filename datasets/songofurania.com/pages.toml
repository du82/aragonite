full_description = "Episode 5: A System of Weights & Measures May 27, 2021 We look at how the Babylonians represented information in their astronomical tablets by examining their number system and the unit system. Then we dive into the Babylonian discovery of the Saros cycle, which was a deep regularity in the pattern of lunar eclipses. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy with new episodes every full moon. My name is Joe Antognini. Before we begin I have to take care of a bit of housekeeping. The show now has a website with a real domain name: www.songofurania.com. If you are an early listener to the show and are listening to this episode around the time it originally came out on April 26, 2021, you likely are subscribed to an RSS feed from a libsyn.com domain name. I recommend that you switch your feed to the new domain name, songofurania.com/rss. The old Libsyn feed will continue to work for a little while, but the new domain name will be the permanent location of the podcast feed, so if you want to keep getting new episodes every full moon, I recommend that you make the switch. If you are a later listener to this show and are going through the back catalog, you are almost certainly already subscribed to the new songofurania.com domain name and have nothing to worry about. In the last episode we started talking more systematically about the Babylonian astronomical tablets we have available to us. We looked at the older tablets like the Enuma Anu Enlil, the Mul.Apin and the Astronomical Diaries. Then we started getting into the later, more mathematical, astronomical tablets that started appearing during the Neo-Babylonian Empire and especially after the Persian Conquest, but we only had time to talk about the Goal Year texts. You may recall that the idea of the goal year text was to make an ephemeris — a prediction of where a planet would be at a certain point in time. Now Babylonian astronomers weren’t interested in predicting the location of a planet on an some arbitrary date. Instead they limited their ephemerides to determining when and where certain important phenomena happened in the planet’s motion, for example, the first stationary point, where the planet stopped drifting eastward in the sky relative to the background stars, and entered into retrograde motion and started drifting westward. Opposition was another important point in the planet’s motion, when it was on the exact opposite side of the sky from the Sun. The principle of the goal year text was pretty simple. The Babylonians had kept meticulous records of the observed dates and locations of these phenomena for centuries. And since the motions of the planets are periodic, once the Babylonians had figured out what the periods of different planetary phenomena were, if they wanted to make new predictions about when and where these phenomena would occur next, all they had to do was consult their records and then copy the observed locations that these phenomena had been seen to happen at however many years in the past that the period was. Now this technique, simple as it is, actually works pretty well. But it was far from being the limit of what the Babylonians figured out about the heavens. Soon enough we will dive into the deep end of the more sophisticated techniques that the Babylonians developed, creatively called System A and System B, but before we can get to that, we should take a look at some of the nuts and bolts of how the Babylonian astronomical worked and what they looked like. The first thing we need to know is how Babylonian numbers worked. The Babylonian number system was really quite logical and stands today as one of the most elegant number systems devised by any civilization. Even more remarkably, much like Athena sprung from the head of Zeus fully formed, the Babylonian number system appears in the earliest tablets in complete form and underwent little evolution. It is not all that surprising that numbers appear very frequently in Mesopotamian tablets since many of them were astronomical in nature or were contracts, both of which tend to contain a great deal of numbers. And even in the earliest of these tablets, which date back to around 2000 BC, we see the Babylonian number system is essentially the same as it appeared two thousand years later in the sophisticated mathematical astronomy tablets. It just made that much sense. So what did Babylonian numbers look like? Well this is one of those instances where describing this in a podcast makes things a little tricky because I can’t show you an image. Perhaps in due time I will add some images to the website that you can look at to get a better idea. But for now we’ll just have to use our imagination. As I mentioned in previous episodes, ancient Mesopotamian records were written in cuneiform, which literally means “wedge-shaped” from the Latin word “cuneus”. Over the millennia a number of different wedge shapes were used in cuneiform, but for their numbers, the Babylonians used just two shapes: the vertical wedge and the corner wedge. The vertical wedge looks like a vertical line with a little upside-down triangle on top, sort of like a martini glass without the base. The corner wedge looks like a less-than sign with a little vertical line drawn near the corner to make a little triangle. Now you may have heard that the Babylonian number system was sexagesimal, that is, base 60. And indeed it was. But it also had elements of a decimal system built into it. The way it worked was that the number “one” was represented by a single vertical wedge. Makes sense. If you wanted to represent the number “two”, you’d just put two vertical wedges next to each other. Easy enough. So it would continue with the number three. Then when you got to four, you’d put the fourth wedge underneath the first three. For five, you now have three vertical wedges on top, two on the bottom. By the time you get to seven, you put the seventh wedge underneath two rows of three. And so you sort of fill up this little 3x3 grid with vertical wedges. So far so good. Now when you get to 10 things change. Now you represent the 10 with a corner wedge. Eleven is a corner wedge followed by a vertical wedge. Twelve is a corner wedge followed by two vertical wedges, and so on all the way up to twenty. For twenty you just put two corner wedges next to each other. Thirty is three corner wedges next to each other. Once you get to forty, the corner wedges are arranged in a little triangle shape, and once you get to fifty, the corner wedges get arranged in a sort of diamond shape. By the time you get to fifty-nine you now have five corner wedges in a little diamond next to nine vertical wedges in a square. When want to write down larger numbers, you just start all over again one place over to the left. The number seventy-one is a vertical wedge followed by a corner wedge followed by a vertical wedge. The leftmost vertical wedge represents the number sixty, the corner wedge represents ten, and the rightmost vertical wedge represents the number one. Add them all together and you get seventy-one. Similarly, 131 is two vertical wedges followed by a corner wedge followed by a vertical wedge. The first two wedges represent two sixties, so 120, and the second two represent the number 11, so 131 in all. So with just two digits this lets you write down numbers all the way up to 3600, which is pretty good for most use cases in the ancient world. And with three digits you’re already at 216,000, which is really larger than anything I personally can conceive of. So with just two shapes they managed to logically and compactly represent arbitrarily large numbers. Beautiful! Now, you may have noticed that I skipped over the number sixty, which is a bit strange, because sixty really is the number in this whole system. But we actually have a bit of a problem with the number sixty. Because sixty is just a single vertical wedge, which is exactly the same as the representation of the number one. Well if we see a single vertical wedge somewhere in a tablet, how do we know if this number is one or sixty? We cannot. Without a numeral zero, it is impossible for us to distinguish these two numbers except by context. This was the major shortcoming with the Babylonian number system, and indeed, all numeral systems until the development of the Hindu-Arabic numeral system around the seventh century AD. Now it wasn’t all bad for the Babylonians. They did have a sort of medial zero. If they had three digits in a row and the middle one would have been a zero, they left some space between the two. This spacing allowed them to distinguish between two, which was two vertical wedges connected to each other, 61, which was two vertical wedges next to each other but not connected, and 3601, which was two vertical wedges with some space in between. But they did not or maybe more precisely could not add that extra space at the end of the number to distinguish between sixty and one. By the year 300 BC the medial zero began to be written explicitly with its own separate character — this was the only major development in the Babylonian numeral system in its two thousand year history. But it wasn’t a true zero because they didn’t put it at the end of numbers to distinguish between one and sixty — it only went between other numbers. Now this wasn’t all there was to the Babylonian number system, because, like our number system, they also had decimals as well. And just like the rest of their number system, the decimals weren’t really decimals but rather sexagesimals — they were all base sixty. They would write their decimals as fractions of the number sixty. So for example the number 1.5 would be written as a vertical wedge representing a one followed by three corner wedges, representing thirty. Thirty is one half of sixty, so this gives you 1.5. But again we have a problem because if you see a vertical wedge followed by three corner wedges, you don’t know if that’s the number 1.5 or the number 90. Both are represented the same way. You have to figure it out from context. Most of the time it’s pretty obvious. For whatever reason the Babylonians only used fractions as intermediate steps in calculations, never as the final result. Nevertheless, when it comes to numbers you’d really rather there be absolutely no ambiguous cases rather than very few ambiguous cases. But maybe I’m being a little harsh — the Babylonian number system was after all among the most sophisticated number systems in the ancient world and it wasn’t until the development of the Hindu-Arabic number system in India around 700 AD, the predecessor of our modern number system, that a number system appears anywhere that is unequivocally superior to the Babylonian number system. Understanding the Babylonian number system is important if you want to understand the mathematical astronomical tablets because those tablets were chock full of numbers. But numbers alone aren’t enough to do scientific calculations. Suppose you ask me to calculate the radius of the Earth and I go off for a little bit and later come back and confidently tell you that I’ve calculated it to be 3209. Well, you will say 3209 what? 3209 meters? Miles? Kilometers? Furlongs? You have to provide a unit. Without a unit, the number is meaningless. So the quantities in the mathematical tablets generally have units associated with them as well. The Babylonian tablets have three types of units. The first of these are units of time. The principal unit here is, unsurprisingly, the day. The day is then divided into 12 intervals called a beru, which is equivalent to two hours. Then each beru is divided into 30 ush, each of which is four minutes long. Then the ush is divided into 60 ninda, each of which is four seconds long. This unit system is actually a little surprising. You may have heard that our system of hours, minutes, and seconds is a relic of the base-60 Babylonian number system. And it is true that it is thanks to the influence of the Babylonian obsession with the number sixty that we divide our hours into sixty minutes, but the Babylonians themselves actually did not do this for their own timekeeping system! The division of an hour into sixty minutes came much later in the 10th century AD during the Islamic Golden Age by the Iranian astronomer Al-Biruni. The second type of unit that shows up in the astronomical tablets is length. Only one unit shows up, the cubit. The cubit also appears throughout the Hebrew Bible, most famously as the dimensions of Noah’s Ark. Now, systems of weights and measures were not particularly standardized in the ancient world, and really weren’t standardized across large regions in the Western world in general until perhaps the 18th century, so how long a cubit really was is hard to say and almost certainly varied from place to place and time to time. But it would have been somewhere around half a meter. Cubits generally show up in the astronomical tablets in reference to the lengths of shadows. At noon on the summer solstice the length of the shadow cast by a stick would be shortest and on the winter solstice the length of the shadow would be longest. The texts would provide ways to calculate how long the shadow would be at different times throughout the day at different times of the year. This, in effect, provided the Babylonians a way to measure and calculate the elevation of the Sun at different times of the day throughout the year. The final type of unit that we see in the astronomical tablets is weight. It’s pretty easy to see how units of time show up in astronomical tablets — so-and-so star rises this many hours after that star, etc. And as we just saw, units of length were used to measure the elevation of the Sun. But it’s a bit strange that weight would come up in an astronomical text. It turns out that units of weight end up effectively being a unit of time as well because the Babylonians used water clocks to measure time. Unfortunately no Babylonian water clocks survive, so we have to go off of descriptions of the devices in tablets. But water clocks are in principle pretty simple. You basically take a jug with a small hole in the bottom and then fill it up with water. Time is measured by how long it takes for the water to drain from the jug, basically like an hourglass but with water instead of sand. Since a certain amount of elapsed time corresponded to a certain weight of water, we see why the Babylonians sometimes measured time in terms of weight. Water clocks were used by many civilizations throughout the ancient world, but while the Babylonians were ahead of the curve on their astronomy, it seems their water clocks were quite rudimentary. The Egyptians figured out that by adding gradations in the jug they could read out intermediate times without needing to wait for the entire jug to empty. The Chinese and Greeks developed much more sophisticated water clocks wh"
