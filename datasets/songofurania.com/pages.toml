full_description = "Episode 8: The Bards Sing of the Skies August 23, 2021 We outline the early development of Greek civilization after the Late Bronze Age Collapse and how the unique geography of Greece influenced its culture, and ultimately, its astronomy. Then we explore the cosmology, cosmogony, and astronomy of the earliest Greeks based on the works of Homer and Hesiod. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. In the last episode we took a winding tour of a series of myths that the ancient Greeks had associated with the two notable civilizations that had preceded them: the Minoans and the Mycenaeans, the Minoans being the civilization that lived on the island of Crete, and the Mycenaeans being the civilization that occupied what is today mainland Greece. These myths were intertwined with the constellations in the heavens, some more directly some more loosely. The Greeks, like all other peoples across the globe, associated the patterns they saw in the sky with objects, some deriving from Mesopotamian influence, others being original to the Greeks. They then associated those objects with stories which explained their significance. The heavens were typically an exalted realm, with the gods bestowing a place among the stars for heroes of especial esteem like Perseus, Orion, or Heracles, or objects associated with them, like the Lyre of Orpheus or Corona Borealis, the crown of Ariadne that we heard about last episode. Though in some instances placement among the stars carried with it some punishment as well as in the case of Cassiopeia, who was placed close to the north star so that during some portion of the night she would be upside down as a lesson in humility. And, of course, many monstrous creatures roam the Greek night sky as well, the dragon Draco in the north, Serpens, the snake being wrangled by Ophiuchus near the zodiac, and the sea monster Cetus to the south, whom we also heard about last month in connection with the story of Andromeda. So while the heavens were often a place of honor, they were not exclusively so — they were more broadly a place of note, and there were lessons to be learned from studying the stories that the heavens told. Another important feature of these myths was that they took place once upon a time, a long time ago, at some indeterminate point in the past when giants walked the Earth. The Greeks had a sense that they were not living in the first age of the Earth, that other peoples, greater than their own, had come before them. The Greek poet Hesiod, whom we’ll talk about in more detail later this episode, divided history into five ages: the Golden Age, the Silver Age, the Bronze Age, the Heroic Age, and the Iron Age. From their names you can infer what Hesiod thought about how the character of man changed over time. In the Golden Age, the Titans rule the heavens and the Earth, with the god Chronos in charge. It is perpetually spring on Earth and god and man coexist in harmony, sitting down and sharing meals together every day. War is unknown and from the Earth spring forth all kinds of delectable foods without any labor on the part of man. The rivers flowed with wine and honey dripped from the trunks of oaks. After the rebellion of the children of the Titans, the Olympian gods, in a 10 year war called the Titanomachy, there followed the Silver Age. Zeus, the new ruler of the heavens, now instituted seasons on Earth. With winter and summer, man had to build shelter. The Earth no longer yielded its fruit without work and man had to plant crops to grow food. Man’s span on Earth was fixed to a hundred years, although he spent this time in perpetual youth, ruled by matriarchs, and died peacefully in his sleep. There then followed the Bronze Age. Man began to turn from good and grew wicked, children did not respect their parents, people learn to lie, and conflict spread through the land. Over time, one by one, the gods begin to leave Earth for Mount Olympus due to the wickedness of the people, each one following the path along the Milky Way. The last of all to leave was the goddess Astraea, the goddess of innocence, purity, and justice. When she left the Earth, she found a new home in the stars as the constellation Virgo. Hesiod gives more space to this constellation than other in the sky. A somewhat lengthy excerpt from his poem reads: Once on earth She made abode, and deigned to dwell with mortals, In those old times, never of men or dames She shunned the converse; but sat with the rest Immortal as she was. They call her justice. Gathering the elders in the public forum Or in the open highway, earnestly She chanted forth laws for the general weal, Nor yet was known contention mischievous, Nor fierce recrimination, nor uproar. So lived they. Far off rolled the surly sea, No ship yet from a distance brought supplies But ploughs and oxen brought them. Queen of the nations, Justice herself poured all just gifts on man. As long as earth still nursed a golden race There walked she; but consorted with the silver Rarely, and with reserves, nor always ready; Demanding the old customs back again. Nor yet that silver race she quite forsook. At evening twilight, from the echoing mountains, She came alone. No gracious words fell from her But when the people filled the heights around She threatened and rebuked their wickedness, refusing though besought to appear again; “How have your golden fathers left a race Degenerate! But you shall breed a worse And then shall wars, and then shall hateful bloodshed Be among men; and grief press hard on crime.” This said, she sought the mountains, and the people Whose eyes still strained upon her, left for ever. And when these also died, those others sprang, A brazen race, more wicked than the last. These first the sword, that roadside malefactor, Forged; these first fed upon the ploughing oxen. And Justice then, hating that generation, Flew heavenward, and inhabited that spot Where now at night may still be seen the virgin. Reading that entire passage may have been something of an indulgence, but, in my defense, this entire podcast is an indulgence. At any rate, over time Zeus became increasingly unhappy with the conduct of man during the Bronze Age. According to one story, the final deed that set Zeus off was due to the king of Arcadia named Lycaon. Zeus had been invited to dine with King Lycaon, but King Lycaon wanted to know whether Zeus was truly omniscient. So, as any well adjusted mythological king would do, he decided that the best way to test this hypothesis was to murder his own son, cook him, and serve him as a dish to Zeus, to see if Zeus could tell what it was that he was eating. Well Zeus was omniscient and could tell what it was that he was served and flew into a rage and resolved to destroy the whole human species. He proceeded to blanket the Earth in lightening to burn it up. But as the fires grew, he became worried that the conflagration would engulf the heavens as well. So he abandoned his plan and decided to cover the Earth with a flood instead. He unleashed torrential rains and persuaded Poseidon to raise the seas until the entire Earth was covered, with the exception of Mount Parnassus. There happened to live on Mount Paranassus a Titan named Deucalion, son of his better known father Prometheus, and Deucalion’s wife, the demi-goddess Pyrrha. These two were just, upstanding, and worshipped the gods with reverence. Seeing that these were the only two left, Zeus relented and let the waters recede from the Earth. When Deucalion and Pyrrha saw that nothing remained of the Earth, they went to consult the Oracle of Themis as to what to do. The oracle, as all great oracles do, gave a suitably cryptic answer. She said, “Depart with veiled head and unbound garments, and cast behind you the bones of your mother.” Deucalion and Pyrrha were taken aback with this command because they did not dare to profane the bones of their parents. But as they pondered these words, Pyrrha finally understood their true meaning. Their mother was Gaia, the Earth itself, and its bones were the rocks before them. So Deucalion took some rocks and cast them behind him, which then grew into men, and Pyrrha cast behind her rocks which grew into women. This then began the Heroic Age, during which most of the familiar tales of Greek mythology take place: the Iliad, the Odyssey, the labors of Heracles, Jason and the Golden Fleece, and all the charming tales of Perseus and Theseus I told you last month. The Heroic Age was the only age in which the general moral character and quality of man improves upon his past self. But, as always in Hesiod’s telling, the degeneration of man is inevitable, and over the ages, the heroes of yore devolved into a weaker and more despicable kind of man during the Iron Age, which was the present day during Hesiod’s writing. Well, these myths were a story that the Greeks themselves had of what came before them. But we moderners are no longer satisfied with these kinds of mythical stories of how things came to be. Nevertheless, as humans, we still need a story to tell ourselves. So what is our story of what came before the Greeks and how the Greeks came to be? Hesiod’s notion that there was an era before his own in which the grass was greener, people were nobler, and things were all around better, may have been a vague remnant of cultural memory of the great Minoan and Mycenaean civilizations that had preceded them before the late bronze age collapse. Or it may have simply been an expression of a general, deeply rooted human belief that things juts aren’t like they were in the good old days, and they don’t make them like they used to, and the world is going to hell in a handbasket and kids don’t respect their elders like they did in my day. But we do know that there were indeed two great civilizations in the region that fairly suddenly collapsed around the year 1200 BC. Or, if we are to quibble, by that point the Minoans had more or less been subsumed by the Mycenaeans, so perhaps one great civilization had collapsed, but either way, the earliest Greeks were correct in thinking that something better had existed in the distant past. It is possible that the peoples that became known as the Greeks were not the same as the Mycenaeans before them, but instead originated from a little farther north on the mainland, closer to where Macedonia is, and started to migrate to the south in the centuries following the late Bronze Age collapse in what are called the Iron Age Greek Migrations. Ancient Greek historians wrote of an event called the Return of the Heracleidae, which in the modern world has been termed the so-called Dorian Invasion, during which the prevailing dialect spoken throughout Peloponnesus in southern Greece changed from Mycenaean Greek to Dorian Greek. In modern times, particularly during the late 19th century and early 20th centuries, the concept of the Dorian Invasion accrued an unfortunate racialized purpose as a number of Northern European historians and philologists attempted to demonstrate that the Greeks of classical antiquity were not of the same race as modern-day Greeks, but in fact had originated from the so-called Nordic race, particularly Germanic peoples who had migrated south during these Dorian Invasions. This allowed the Nazis to claim the achievements of the classical Greeks as achievements of their self-professed Aryan race and formed part of the racial justification for the Nazi occupation of Greece during World War II. In the eyes of Nazi officers, they were simply reclaiming land for the Dorian race that they belonged to and who had occupied it millennia earlier. Of course, there is no evidence at all of any migrations from any of the so-called Nordic races to Greece during the Greek Dark Ages. Even the evidence for migrations from Macedonia is not conclusive. There is some linguistic evidence that some migrations took place and ancient Greek historians like Herodotus wrote of such migrations, but as always, ancient historians are not entirely reliable sources and archaeological evidence, which is what you’d really want, is scant. At any rate, over the course of two centuries or so, the Greeks spread throughout the region, blanketing mainland Greece, Crete, Cyprus, various other islands in the Aegean, and the western coast of Anatolia, or modern-day Turkey. Memory of these migrations persisted in the Greek cultural memory as the nations and city-states founded by mythic figures like Perseus founding Mycenae, or Heracles founding Sardinia. History is inextricably linked to geography, and the Greek mainland is not especially fertile. It is largely rocky and hilly and the only fertile regions are along the coasts and in alluvial plains along rivers. This geography of the mainland, and the profusion of islands across the Aegean Sea, led the Greeks to turn outwards to the sea rather than spend a great deal of effort expanding throughout the infertile mainland. As a consequence of this, Greece became a heavily seafaring civilization. As the population grew in its various cities over the centuries, the scarcity of viable farmland meant that the inhabitants couldn’t simply expand into the neighboring countryside. Instead, when the population grew to a point where the need for new farmland became necessary or other political tensions had become acute, a portion of the city’s population would form an expedition and sail across the Aegean or Mediterranean Sea, to found a colony in a new location. The process of Greek colonization throughout the Mediterranean and Near East was a remarkably organized endeavor compared to the earlier Iron Age Greek Migration that had come before, and indeed, most migrations generally throughout human history. Different city-states had different rituals and procedures, but in broad strokes, when it was decided that it would be necessary to establish a colony, the citizens would consult an oracle to obtain the advice of the gods. They would nominate a leader of the expedition. In some cases, every household in the city that had multiple sons would have to select a son by lot to leave his homeland and travel to unknown lands to found a new city. The colony retained close ties with the mother city. The constitution would usually be adopted from the mother city, as would the patron gods. The voyagers would often transport a ceremonial fire from the public hearth of the mother city to the colony and keep the sacred fire alive in the new city. Incidentally, a modern homage to these ceremonial fires persists today in the Olympic flame rituals. In Ancient Greece the Olympic games were marked with the ignition of a ceremonial fire and the modern games continue this tradition, though with the addition of the Olympic torch relay. A few months prior to the opening of every Olympic compe"
