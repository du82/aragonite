description = "We turn to the enigmatic, charismatic philosopher Pythagoras and the following that he inspired. Though Pythagoras is today associated with the Pythagorean theorem, he developed a school whose secrets were jealously guarded. The Pythagoreans studied astronomy, mathematics, and music, but also developed a unique philosophy centering around numbers that heavily influenced Plato."
full_description = "Episode 11: The So-Called Pythagoreans November 23, 2021 We turn to the enigmatic, charismatic philosopher Pythagoras and the following that he inspired. Though Pythagoras is today associated with the Pythagorean theorem, he developed a school whose secrets were jealously guarded. The Pythagoreans studied astronomy, mathematics, and music, but also developed a unique philosophy centering around numbers that heavily influenced Plato. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. Or close to the full moon anyway, this episode is a few days late and I apologize to everyone who has been nervously glancing out their window every night wondering if their eyes were deceiving them. But it turns out that I had more to say about the Pythagoreans than I expected. In the last episode we explored the philosophers of the Ionian School, a group of individuals who were active around Miletus on the western coast of Anatolia during the 6th century BC. To keep the episode at least nominally related to astronomy, I skipped over a few of these philosophers who did not have so much to say about astronomy or the nature of the world like Hecataeus of Miletus, who improved on the map of the world produced by Anaximander. Or philosophers who did have things to say about cosmology like Archelaus, who sort of combined the idea of Anaximander that the Infinite was the origin of all matter and the idea of Anaximenes that air was the origin of all matter into the idea that infinite air was the origin of all matter. But not much of his work survived. But there was another philosopher from the region who was of tremendous influence: Pythagoras. But his philosophy was so radically different from that of the his compatriots in Ionia, that he in no way can be lumped together with the philosophers of the Ionian School. These philosophers, with Thales as the intellectual godfather of them all, were also, appropriately, called the natural philosophers. They were very much interested in explaining the physical world around them. Now, this was not their exclusive remit, and some of them, like Heraclitus, were more interested in explaining the follies of man, war, and ontology than the physical world. But especially relative to the later Greek philosophers, who were more interested in political philosophy, moral philosophy, epistemology, and other branches of what we traditionally think of as philosophy today, the philosophers of the Ionian School were far more focused on studying natural philosophy, or the nature of the physical world, how it came about, and the processes that went on within it like rainbows and meteors. Pythagoras, however, cannot neatly be fit into the tendencies of this particular school, and his influence was so pervasive that we really have on choice but to treat him separately. Now today, we think of Pythagoras as “the triangle guy”. His name is most closely associated with the Pythagorean Theorem, which states that the sum of the squares of the lengths of the two sides of a right triangle are equal to the square of the length of the hypotenuse. So from this, in modern times most people, to the extent they have heard of Pythagoras, tend to associate him with mathematics and think of him as an early mathematician. And this association is not entirely wrong because numbers played a central role in Pythagoras’s philosophy. But his life encompassed far more than mathematics alone. In the centuries after his death, Pythagoras acquired an almost mythical status. And the philosophical school he cultivated, a group of individuals called the Pythagoreans, was not really comparable to the other philosophical schools that sprang up around ancient Greece, but might be seen as something closer to a cult today. Pythagoras could plausibly be called a mathematician. But he could also plausibly be called a philosopher, a mystic, or a cult leader. The classicist Walter Burkert described Pythagoras’s position this way: “The material seems to fall into the pattern each inquirer is looking for. The historian of science rediscovers Pythagoras the scientist; the religiously minded show us Pythagoras the mystic; … the anthropologist finds “shamanism”; and the philological scholar may play off against one another the contraction of the tradition, so that critical virtuosity may sparkle over a bog of uncertainty. Pythagoreanism is thus reduced to an impalpable will-o-the-wisp, which existed everywhere and nowhere.” Now, as I have been saying somewhat monomaniacally is that one of the main difficulties in understanding the thought of the oldest Greek philosophers is that for the most part they wrote nothing down, and Pythagoras is no exception. There is some very tenuous circumstantial evidence that perhaps he may have written some treatise, but even if he did, it was lost and no fragments survive anywhere. So everything we know about Pythagoras comes to us secondhand or even third-hand or more through other sources. And here, the tremendous influence that Pythagoras had is both a curse and a blessing. It is, of course, a blessing in that because he influenced so many other thinkers his ideas were transmitted down the ages through a variety of sources. But it is simultaneously a curse in that through his influence on other thinkers it can be hard to understand where his ideas end and the ideas of others begin. Nowhere is this problem more acute than with Platonism. One of the most important sources we have for the ideas of Pythagoras and the Pythagoreans is Aristotle, who was writing maybe 150 to 200 years after Pythagoras. But of course, Aristotle was taught by Plato, and Plato was so heavily influenced by Pythagorean thought that many of the foundations of Platonism may have come originally from Pythagoras, but been so natural to Aristotle that he attributed them to Plato. Aristotle spends a great deal of time in his work Metaphysics trying to explain the ideas of Pythagoras and Plato and distinguish the two. But one of the central problems in the study of ancient philosophy is disentangling the contributions of Plato from the contributions of Pythagoras. To make getting at Pythagoras the man even trickier, Aristotle himself never actually refers to Pythagoras. Instead he exclusively refers to the Pythagoreans. And in many instances he uses a phrasing that is usually translated as “the so-called Pythagoreans.” Now in modern English we interpret this phrasing as putting scare quotes around Pythagoreans, which may not be quite the same sense that Aristotle intended, but there is no doubt that he was attempting at the very least to put some rhetorical distance between the ideas he was attributing to the Pythagoreans and Pythagoras the man. If things had played out differently in history, we might know more about this from Aristotle. One of the rather depressing things about the classics is that in so many cases we know what we do not know. It would be one thing to be blissfully unaware that some ancient author had written a critical treatise. But in this case, we actually know that Aristotle wrote two texts specifically on Pythagoreanism, one called “On the Pythagoreans”, and the other called “A Reply to the Pythagoreans”. But with the exception of a few fragmentary quotations, these have been lost, so we can only dream about what might be contained in them. Well, Aristotle is not the only source of writings about Pythagoreanism. One of the earliest references to Pythagoras is due to Heraclitus, the somewhat grouchy philosopher we learned about in the last episode. As you might expect, Heraclitus was not very impressed with Pythagoras. He writes: Pythagoras, the son of Mnesarchus, practiced inquiry most of all men; he made a selection of these writings and created his own wisdom — much learning, artful knavery. This is an interesting fragment because the formal introduction of “Pythagoras, the son of Mnesarchus”, tells us that this is the first time Heraclitus is writing about Pythagoras in the document, sort of like how today we might introduce a figure by their full name but then refer to their last name throughout the rest of the document. The statement that he “made a selection of these writings and created his own wisdom” implies that Heraclitus believed that Pythagoras didn’t have any original ideas but passed off other ideas as his own. A very small number of Pythagoreans wrote their own philosophical treatises, but this should ipso facto make us somewhat suspicious because the Pythagoreans were notorious for their secrecy. What makes things even harder, too, is that it is easy to assume that the ideas that these later Pythagoreans wrote down, sometimes writing centuries later, were identical to the ideas of Pythagoras. But it is hard to believe that a philosophical school that had persisted for centuries would have had no new ideas in that time. So it seems very likely that later Pythagoreans developed new doctrines, but what did the later Pythagoreans say and what did Pythagoras himself say? It’s also entirely possible that Pythagoras was himself influenced by the ideas of some of his followers. One of the more important sources here is from a Pythagorean named Philolaus. In the late fifth century BC, about 100 years after Pythagoras, Philolaus wrote extensively about astronomy among other things, so much of what we know about the astronomy of the Pythagoreans comes to us through him. As we get more distanced from Pythagoras we also start seeing more works about the figure, and a particularly important one shows up in the late third century or early fourth century AD by a philosopher named Iamblichus who wrote a biography of Pythagoras that survives to today. But we see by this point the legends surrounding Pythagoras had fully flowered. Some of these stories point to a sort of superhuman intellect, such as Pythagoras predicting an earthquake in the city of Metapontum three days in advance. Although we know today that this is not possible, or at least, we in the 21st century AD have no idea how something like this could be done, in the ancient world this probably would have been seen as an intellectual feat not too dissimilar from Thales predicting a solar eclipse. But other legends surrounding Pythagoras are more miraculous, or religious in nature for lack of a better term. Some of these tales indicate that Pythagoras had a special closeness with the gods. In ancient Greece natural features like rivers and springs were not simply physical entities, but had deities associated with them, and there is a tale of Pythagoras crossing a river and the river replying to him, “Good morning, Pythagoras!” Many of the legends associated with Pythagoras have parallels to other religious figures. Like some Christian saints and mystics in India, some claimed that Pythagoras possessed the power of bilocation, being in two places at the same time. And like St. Francis of Assisi, Pythagoras was reputed to be able to communicate specially with animals. There is a tale of a bear that had been causing havoc in a town. Pythagoras approached the bear, patted it, gave it some barley and fruit, and then told it not to harm any living creature. The bear ambled off into the mountains and never harmed another soul again. Another story tells of an ox that had been trampling on a farmer’s beans. Pythagoras advised the farmer to tell the ox not to step on the beans. The farmer mocked Pythagoras and said that he did not know how to speak oxish. So Pythagoras went and talked to the ox and the ox never again touched any beans. Implausible as these stories may seem, they are not entirely arbitrary and in fact are consistent with certain aspects of Pythagoras’s philosophy. In particular, Pythagoras taught a doctrine of reincarnation which was later adopted by Plato as the idea of the “transmigration of souls.” People could be reincarnated as animals, so it was not implausible to suppose that to Pythagoras, who understood these things, the soul could still communicate with even if it was cloaked in another animal’s body. The story of the ox trampling on beans also points to the special relationship that the Pythagoreans had with beans, which we’ll talk about in more detail in a little bit. One of the really fascinating things about Iamblichus’s biography is that certain elements parallel Christianity. Now, as I mentioned, Iamblichus was writing in the late 3rd century or early fourth century AD, long after the Gospels had been written, so it is more likely that he was influenced by Christianity rather than Christianity being influenced by Pythagoras. But it is clear that Iamblichus felt the need to cloak Pythagoras in the religious imagery available in his time. Christianity had been heavily Hellenized by this point, so it is not entirely surprising that Iamblichus would have reached for elements of the life of Jesus when telling his story of the life of Pythagoras. Pythagoras was not simply a philosopher of the natural world, but was such a well known mystic that philosophers were writing these hagiographies some seven centuries later. One of these similarities is that Pythagoras meets some fishermen who have just pulled in a large catch of fish. They say that if Pythagoras can guess the number of fish caught they will do whatever he says. Pythagoras correctly states the number of fish they have caught and then tells them to return the fish to the sea. In his biography, Iamblichus tells this as one of the very first stories about Pythagoras which maps neatly onto the Gospel of Luke where one of the very first things Jesus does in his public ministry is cause Simon Peter, James, and John to catch a large number of fish after they had been fishing unsuccessfully all day. Moreover in the Gospel of John there is another story towards the end in which Jesus causes Simon Peter to pull in a large catch of fish and the exact number of fish caught is actually specified to be exactly 153. Now, it is almost always the case that anytime you see a number in a biblical text that there is numerological significance, and I think this is true independent of your interpretation of the Bible. In a secular reading it is no surprise that the authors of these texts would have constructed them in such a way as to imbue the numbers within them with special significance. But even if you take a highly literal reading, where the historical Jesus caused Simon Peter to pull exactly 153 fish from the sea, the number would still have numerological significance because if the Son of God did cause this miracle to occur, surely He would have chosen the number of fish to be caught to be of special cosmic significance, He would not have picked some number at random. After all, God does not play dice with the universe Now, there is no generally accepted numerological interpretation of this particular "
