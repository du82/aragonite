title = "The Song of Urania Podcast"
description = "This month we tour the astronomers of ancient Egypt from the Old Kingdom to the last native Pharaoh of Egypt just prior to Alexander's conquest. We look at how astronomers fulfilled their primary responsibility of keeping track of time during the night so that the priests could perform the appropriate rituals in the temple. Finally, we end our journey through Egypt with their calendar, arguably the most reasonable calendar any civilization has ever used."
full_description = "Episode 32: All Along the Watchers of the Hour August 5, 2023 This month we tour the astronomers of ancient Egypt from the Old Kingdom to the last native Pharaoh of Egypt just prior to Alexander's conquest. We look at how astronomers fulfilled their primary responsibility of keeping track of time during the night so that the priests could perform the appropriate rituals in the temple. Finally, we end our journey through Egypt with their calendar, arguably the most reasonable calendar any civilization has ever used. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well so far in our journey through Ancient Egyptian astronomy we’ve delved into Egyptian ideas about cosmology, the creation of the world, the end of the world, and some of the astronomical connections of Ancient Egypt’s most famous artifacts, the Pyramids. But the Pyramids date back to very nearly the beginning of Egyptian history, and Egypt lasted for quite a while after that. So this month I’d like to go through what exactly the Egyptian astronomers were up to all those years. Now as I mentioned in the last episode, the first person whose name survives that could plausibly be claimed to be an astronomer is the great Imhotep, who designed the first of Egypt’s many pyramids, the step pyramid of Djoser. But Imhotep was really first and foremost remembered as an architect and physician, and the claim that he was also an astronomer is a little more tenuous. The first really definitive record we have of an astronomer in ancient Egypt is a man named Tjenti, who lived sometime around 2300 BC, in the middle of the 6th Dynasty, so right when the Pyramid building fad was winding down. Above the entrance to his tomb are listed his most important titles, “Great of the Seers, Grand vizier, superior lector priest, sole companion, scribe of the divine book, superior of the secret of the sky, who sees the secret of the sky.” The last title, “superior of the secret of the sky, who sees the secret of the sky” is clearly astronomical in nature. But the first title, “Great of the Seers” may also have been a title reserved for astronomers, “seer” being taken rather literally as someone who sees the sky and understands it. Another possibility, though, is that the word referred to mining as someone who went out and sought metal. Incidentally, this title, “Great of the Seers” is also given to Imhotep and is one of the circumstantial pieces of evidence we have that he was also involved with astronomy. Well, not too much more survives about Tjenti, all we can really conclude from him is that very early on in Egyptian history the Egyptian state was interested in the heavens and appointed officials to high positions to study it. After Tjenti we’ll skip all the way across the first intermediate period, the middle kingdom, and the second intermediate period until we get to the next astronomer at the beginning of the New Kingdom. This is not to say that there aren’t any astronomers over all these centuries, but again all we have are some names and titles, and in many cases the titles are only suggestive rather than definitively known to be astronomical. One such title is “watcher on the terrace,” and another is the formidable title “superior of the darkness.” By the time we get to the New Kingdom the artifacts that survive are somewhat more substantial. The first is a statue built in honor of a priest and astronomer by the name of Aanen in the 18th dynasty. The statue depicts the man clothed in a panther skin decorated with stars. The back of the statue has an inscription that states that he is a “lector-priest who knows the behavior of heaven.” To understand what this position actually entailed it’s worth becoming a bit more familiar with the hierarchy of the ancient Egyptian priesthood. One of the features of Ancient Egyptian religion that is perhaps somewhat foreign to us in the modern world is the elaborate hierarchy of the priesthood. And really, this was not unique to Ancient Egypt, many of the more complex ancient civilizations like the Babylonians, Jews, Romans, and so on also had more hierarchy in their religious org charts than we are used to today. Most modern religions have a fairly flat organizational structure. In many of the Protestant faiths, for instance, you have your pastor, and that is pretty much it. Or if you are Jewish you will have your rabbi, or if you are Muslim you will have your imam. Your pastor or rabbi or imam might on occasion go to a conference with other pastors or rabbis, and certain sects might recognize some overall leader or group of leaders, but that is essentially where the hierarchy ends. The closest analog to the ancient religious structure that persists in the modern world is perhaps the Roman Catholic Church with its various ranks of deacons, priests, bishops, cardinals, and all headed up by the pope. But even this staid institution abolished many of the more obscure ranks after the Second Vatican Council, like the minor orders of acolyte, exorcist, lector, and porter, and, more recently, the position of monsignor. But if you want to imagine what the structure of Egyptian or Babylonian religion was like in the 2nd millennium BC, think of something like the Catholic Church in the late 19th century. In the case of Ancient Egypt, at least during the New Kingdom, the head of the religion was the High Priest of Amun. Under him was the Second Priest of Amun, followed by the Third Priest of Amun and then the Fourth Priest of Amun. These roles are also sometimes called the High Prophet of Amun, Second Prophet of Amun, and so on. The Second Priest of Amun seems to have had more logistical responsibilities and to put it in more modern corporate terms, may have effectively been the chief operating officer of the temple, and was responsible for administering the property, managing the staff, and so forth. Despite the name, though, the Second Priest of Amun was not the second ranking priest in the hierarchy under the High Priest. That role fell to a priestess who was given the title God’s Wife of Amun, and she was explicitly ranked above the Second Priest. Initially this role was just ceremonial and was given to one of the female members of the Pharaoh’s family, either his mother, wife, or his oldest daughter. But over time the position of God’s Wife of Amun began to acquire real duties and more substantial power. As the role became more powerful, the pool of women who were eligible for the title became more restricted. The Pharaoh’s mother or wife were no longer eligible and eligibility was limited to his sisters or daughters who, in turn, had to remain celibate in order to prevent a new center of dynastic power from emerging. Incidentally, one of the records we have of the role of God’s Wife of Amun relates to a secondary title she held, called God’s Hand. You may recall from two episodes back when I described the Egyptian cosmogony, that Amun “put his hand into his fist and made orgasm with it.” It seems that this creation event was ritually recreated with God’s Wife of Amun playing the role of God’s Hand, though just how literally the temple ritual reproduced this act we cannot say. Well, below these highest ranks of priests and priestesses was the lector priest, which is what Aanen’s statue says he was. Though, as it happens, this statue may have been cast earlier in his career, because he apparently later rose to the rank of Second Priest of Amun, at least according to his mother’s tomb. The lector priest was responsible for, as the name suggests, reading, in particular reading the spells and hymns of the temple rituals. The spells and hymns that the lector recited were not simply for the benefit of those listening. In the ancient Egyptian religion, the recitation of these words by the lector priest had what is variously transcribed as “heka,” or “hu,” and referred to an authoritative utterance or “creative command.” In other words, by reading these spells, the lector priest was not merely wishing for their effect to take place, or beseeching the gods for their effect to take place, but by the act of his reading them this caused their effect to take place. Incidentally, the lector priest was the only role in the priesthood which was apparently reserved for men. There are records of women serving in all other roles, including Second Priest and High Priest, though in that case the position was merged with God’s Wife. But there are no records of a woman ever serving as lector priest. Below the lector priest there were a variety of more specialized roles. The sem priests performed funeral services, and were generally well respected because, after all, they held the power of the afterlife in their hands. Only by their saying the spells correctly after a person’s death could the deceased enter into the afterlife, so you would want to be on their good side. That said, sem priests were also responsible for preparing the body for mummification, and after handling the dead body they would become ritually unclean for a period, during which the priest who did the dirty deed was ritually insulted. There were also doctor priests who were responsible for healing, and ka-priests who would perform offerings to the dead at their tomb. Of special interest to us are the hour priests, who were responsible for keeping the time and ensuring that the various rituals were conducted at the appropriate hours, and I’ll have more to say about them later. At the bottom of the hierarchy were the “wab” priests, who were more or less there to do odd jobs. But the hierarchy does not end there. Below the wab priests was a role that has been called the “pastophoroi.” The pastophoroi were not priests, and were definitely not allowed to call themselves priests. Their official role was as doorkeeper and they worked in the courtyard area of the temple that was open to the general public. They would stand guard at the threshold of the temple and raise and lower the door curtains for those entering or leaving. But the pastophoroi had other, unofficial roles in Egyptian religion, and had a particular reputation for having the ability to interpret dreams. They probably also had duties in tending to the needs of the general public. Another feature of ancient Egyptian religion, and many other religions of the ancient world, that might be somewhat surprising to us in the modern era is that the rituals that the priests conducted involved the general public very little. Today, almost by definition, we associate a religious ceremony with the presence of a congregation of some kind, the people coming together and collectively worshiping their god. But in the ancient world, not just among the ancient Egyptians, but among the ancient Greeks, Jews, Babylonians, too, in general the priests performed their rituals in private, and this was especially true for the most important rituals, where even ordinary priests were not permitted to take part, they were conducted only by the high priest. Of all these different kinds of priests, only the high priests were full-time jobs. The rest performed their duties on a part-time basis. Every four months they were obliged to serve in their priestly role for one month. During this month they lived at the temple and had to maintain ritual cleanliness. The other three months they went back to their ordinary life. One of the better descriptions of the array of priestly roles comes to us from the Hellenistic author Clement of Alexandria who described a ritual called the Procession of Osiris in the late 1st century or early 2nd century AD. The procession was lead by a singer, followed by the horoskopos. Later comes the horologion, or the hour-priest who holds what is called the “astronomical palm leaf,” which are probably the two instruments associated with Egyptian astronomers, the bay and the merkhet which I’ll describe in more detail later on. Clement writes, “He must have the astrological books of Hermes, which are four in number, always in his mouth. Of these, one is about the order of the fixed stars that are visible, and another about the conjunctions and luminous appearances of the sun and moon; and the rest respecting their risings.” Further along in the procession is the Sacred Scribe, who wears wings on his head and carries a book, ink, and a reed. Knowledge of astronomy was also a requirement for the Sacred Scribe, who had to be fluent in hieroglyphics and be able to notate the position of the sun, moon, and five planets. Well, even after the end of the New Kingdom there are a number of surviving references to various Egyptian astronomers. A man named Amun Ankhefenkhounsu carved his titles into the doorway of his house, and these included “who explains the ‘snt’ of the two gates of heaven.” What is the ‘snt’ you ask? Lots of people have asked that and no one has an answer. The precise definition is unclear, but the word is definitely associated with astronomy and may have referred to astronomical records that the priests kept. Later on a monument records that when the Kushite king Tanutamun visited the temple complex of Karnak, he was received by a “priest of the great snt” and the “astronomers of the temple of Amun-Re, who know the secrets of Nut.” Others get titles like “inspector of the astronomers, the one who knows the heliacal rising of Sirius,” “Chief of the astronomers,” “superior of the secret in the sky, the earth and the Duat,” “he who opens the two gates of heaven in Karnak.” Not to belabor the point, but we can see that there was a strong connection between astronomy and the temple priesthood in ancient Egypt. Probably the astronomer with the most extensive surviving description is maybe unsurprisingly one of the later ones, a man named Horkhebi who lived in the 30th dynasty, right before Alexander’s conquest. He had a statue made of himself which has a description of his skills running down the back: He is the one who announces the risings and settings at their time, with the gods who predict the future, for which he has purified himself on their heliacal risings, when the decan is next to Benu above them, so that he can satisfy them with his predictions; the one who observes the culmination of every star in the sky …, the one who announces the heliacal rising of Sirius at the beginning of the year and observes her on her first day of the festival, having calculated her course …, the one who observes what she does every day, so that everything she has planned is in his charge; the one who knows what goes to the north and south of the solar disc, making known all its omens and predictions, so that he can say what they cause when they arrive at their time; the one who divides the hours of the day and the night without making mistakes during the night …, one who is wise in every phenomenon observed in th"
