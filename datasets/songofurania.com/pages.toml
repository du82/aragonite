description = "We learn about the political events and omens that led to the calendar reform of 104 BC."
full_description = "Episode 40: Emperor Wu's Woo March 29, 2024 We learn about the political events and omens that led to the calendar reform of 104 BC. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well, last month we looked at the famous “guest stars” in Chinese astronomy, along with the place of eclipses and the planets. As with the month before that, I promised at the end that we would wrap up our tour of Chinese astronomy in the following episode by skipping ahead to the 17th century with the arrival of Jesuit astronomers in China. But I am afraid that I have deceived the loyal listeners of this podcast on yet another occasion. The history of Chinese astronomy has turned out to be such a bounty of delights that I simply have to dwell on the topic a little while longer. So the Jesuits will have to wait until another month. Now, I also mentioned at the end of the last episode that I would talk about the hsiu, or lunar mansions, and unfortunately I lied on that front as well. I wanted to lead into the hsiu rather gradually, and it turned out as I was writing the episode that I led into the hsiu a bit too gradually and never quite got to them by the end. So that, too, will have to wait for the next episode. Instead, we’ll start with some backstory before we get to the hsiu and talk about an event in the history of Chinese astronomy that I mentioned only in passing two episodes back — the calendar reform of 104 BC. Now, I’ve mentioned in previous episodes the historical importance of setting the calendar in Chinese political society. Setting the calendar was one of the paradigmatic activities of the Emperor — it was simply one of the things that defined him as Emperor — he was the one who regulated time. And the Emperor was the link between Heaven and Earth. The emperor sat at the center of the Earth, right at its pivot point, about which the Heavens turned. When he acted in harmony with Heaven, all was right in the world — the harvests were bountiful, the weather was pleasant, the omens were auspicious, and the calendar marked the time properly. When the Emperor acted rashly, imposed unjust laws, and punished people unfairly, there was disharmony with Heaven, and this manifested itself in famine, plague, storms, ominous omens, and the calendar would drift from the seasons. A court official named Cai Yong, who must have had an uncommon courage, warned the Emperor in 178 AD that his behavior needed to change, writing: Since Your Majesty ascended the throne, there has been a succession of natural calamities, with several years being marked by solar eclipses and earthquakes…. You should rectify matters concerning your sacred person, giving careful thought to self-restraint — that will save the situation. Now, for what it is worth, the surrounding context shows that Cai Yong was not exactly criticizing the Emperor’s conduct per se, but rather the conduct of the eunuchs in the court, who were opposed to Cai Yong’s program of restoring the ancient rituals. But nevertheless, his recommendation that the Emperor change his position with respect to the eunuchs only hardened their opposition to him, and he soon found himself in the position of needing to flee the court and spent the next 12 years in a self-imposed exile in the south of the country. At any rate, I mentioned this two episodes back, but it is worth repeating: the authority of the emperor setting the calendar in Chinese society was analogous to the authority of the emperor to mint coins with his image on it in Western society. And if the calendar drifted, people would notice, and this was a bad signal of the Emperor’s competence. It might be an early sign that the Mandate of Heaven was slipping away from him. The Zuo Zhuan mentions what might happen if the intercalations were done incorrectly: In the 12th month during winter there were grasshoppers. Jisun asked Confucius about this unseasonable event. Confucius said, ‘I have heard that insects are all in hibernation after Antares has heliacally set. But Antares is still sinking in the west. This is a mistake by those in charge of the calendar.’ So, the calendar was clearly important in Chinese society, more so than in perhaps any other society, which is really saying something. But what precisely did the calendar regulate? Now, as with most other societies the calendar regulated the things that you would expect it to — when to plant, when to harvest, when certain festivals were to be celebrated and so on. But one of the interesting things about the Chinese archaeological record is that we actually have some quite detailed descriptions of what was to happen at various points throughout the year, and one of the surprising things about these descriptions is just how much the activities of the peasants were micromanaged by the calendar. There is a document from 5 AD that was displayed in a public place, visible to all, though presumably it was only meant for the local officials since the peasants could not read. The document was a decree from the Imperial Court reminding the local officials as to how they were to direct the activities of the local population throughout the year. Some of the directives detailed in this document were meant for the officials alone. One, for instance, tells them to end the year with a set of rituals: In the last month of winter, command the responsible officials to carry out the great exorcism and the directional sacrifice and make the clay ox to send off the cold wind. But many of these directives were intended to govern the activities of the people themselves. For instance, it was common for the local officials to press gang the locals into build or repair the town’s infrastructure. But the decree instructs the officials, “In the first month of spring, do not assemble large groups.” So in the first month of spring, these large-scale repairs or construction projects would not be performed, presumably to give the peasants enough time to plant their crops. Another line says “In the third month of spring, do not shoot birds with pellets, spread nets, or use other techniques to capture them.” Later, “In the second month of autumn, exhort the people to plant wheat. Do not permit them to miss the proper season; if they miss the proper season, carry out the punishment without a doubt.” One of the more remarkable directives governs behavior during the equinoxes: When day and night are equal, then thunder will make its sound and start the lightning. Three days before the thunder, ring the bell to command the people, saying: When there is thunder, do not become pregnant. Those who do not control their comportment will give birth to imperfect children and are sure to suffer calamity. So the calendar not only regulated when people planted crops and hunted game, but it also instructed them as to when it was permissible or not to have sex. Another feature of the calendar that governed behavior were the Fan Zhi days. These were days that the calendar spirit “shen sha” was active and were considered to be of ill portent. Consequently, in the early imperial era officials would often take these days off, though this practice seems to have been curtailed by the Emperor Ming in the middle of the first century AD. The author Wang Fu wrote a century later about an occasion on which the Emperor Ming asked his officials why the common people had presented no petitions to him at his usual dawn audience. The officials responded that it was because it was a Fan Zhi day, so the Bureau of Complaints had been closed. The Emperor chastised them and said that the people had abandoned their farm work and traveled from afar to the capital to present their petitions to him. When the officials then arbitrarily stop their work, this amounts to nothing less than stealing a day from the people. He then decreed that the Bureau of Complaints should receive petitions even on Fan Zhi days. From what we can tell, these structures were not imposed on an entirely unwilling people. During the early Imperial period a new genre of written work appears called the “rishu,” which is generally translated as “daybook.” These daybooks were not used by the high officials of the Imperial Court, but were intended instead for the lower classes. Probably not so low as the peasants since in the early Imperial period they mostly couldn’t read. But the daybooks seem to have been taken up by the next step up: petty officials, merchants, and so forth, who at least had some minimum of education. And it may be that they conveyed the relevant contents of the daybooks to the illiterate peasants as well. The daybooks were in a sense a kind of almanac. They would specify which days you should or should not do various activities. But a qualitative difference between a western almanac and the Chinese daybook was that a western almanac will simply inform you as to the propitious days to do various things, or conversely unlucky days that you should avoid. But the choice was yours to make. If you wanted to clip your fingernails on an unlucky day, well, it was your funeral. The Chinese daybook, by contrast, was written much more with a prescriptive attitude, from a sense of authority. It simply told you what the correct days to do certain activities would be. And the proscriptions varied based on your profession. If you were a good petty official, you would follow the prescriptions provided by the text. One of the surviving daybooks sets out the specific days that a petty official could carry out his official duties, or when he could invite commoners into his home. But the rules can get quite specific. One rule says that if your home is robbed on a particular day, the thief will have had a moustache and black moles on his face. These daybooks are also illuminating for another reason. They were discovered relatively late, in the 1970s. Archaeological excavations recovered a few surviving examples of these texts from some tombs. But combing through the extensive official literature from Imperial China, you would really have no idea that these texts were floating around. So an almost complete absence of any mention of these texts in the official literature is indicative of the kind of disconnect between the highest rungs of Chinese society, about which we know quite a lot, and the lowest, about which we know considerably less. As far as we can tell, the rules set forth in the daybooks were not an imperial edict. Who exactly wrote them is unclear, but they seem to have been useful enough, providing structure to people’s lives, that people adopted the daybooks voluntarily. So, to sum all this up, as I have tried to make clear in the past few episodes, the calendar was a really big deal in ancient China. And it wasn’t simply important for regulating day-to-day life, but it had political implications as well. I mentioned in Episode 38 how after a dynastic upheaval, one of the first things that a new emperor would typically do would be to proclaim a new calendar to assert his authority. And this leads us to the calendar reform of 104 BC. Now, as we talked about in Episode 37, the Imperial Era of Chinese history begins with the establishment of the Qin Dynasty, canonically held to be in 221 BC. The king of the Qin state managed to subdue the other six states, bring an end to the Warring States Period, and establish himself as the emperor of all of China. Now, we discussed at some length the consequences of this development on intellectual life in China in past episodes. But despite its influence, the Qin Dynasty was really quite short lived. After just 15 years the Qin dynasty had fallen to the new Han dynasty. And these 15 years were not exactly a peaceful time. In addition to a steady drumbeat of rebellions across the empire, there were several assassination attempts on the first emperor of the Qin Dynasty Qin Shi Huang, one of which we discussed in the last episode when we talked about Zhang Liang. Even though none of these attempts succeeded in killing the Emperor, they did succeed in driving him to paranoia, and as he became older he became obsessed with finding the fabled elixir of life that would confer immortality upon him and he went to tremendous lengths to find this potent potable. As we will see shortly, he was not the last Emperor to be beguiled by this mythical potion. One year before he was to die, the heavens sent him an ominous sign. A meteor fell in the lower Yellow River valley and it was inscribed with the words “The First Emperor will die and his land will be divided.” The Qin Emperor assumed, or at least hoped, that some treasonous individual had written these words on the stone, but no one would confess to the deed. Nevertheless, just to be sure, Emperor Qin Shi Huang executed everybody who lived nearby and had the stone destroyed. Soon after this event the Emperor went on a journey to the east in search of the elixir of life, but either the journey was too difficult for his weakened spirit, or perhaps he found some elixir that was made of mercury or some other toxin and it poisoned him. Whatever the details, the first emperor of the Qin dynasty died during this journey. Now, similar to the empire of Alexander the Great, the Chinese Empire under the Qin Dynasty was essentially just held together by the sheer force of will of a single man, and when he was gone, it immediately began to fragment. There were a few claimants to the throne who jockeyed for power, but none had the competence of Qin Shi Huang, and the many enemies that he had created across the empire exploited this opportunity to rise up and seize power for themselves. This led to a chaotic four year period called the Chu-Han contention, but when the dust had settled in 202 BC, the ruler of the Han state, Liu Bang, found himself on top and established himself as the new emperor of all of China. Now this was quite unprecedented in Chinese history. The Qin dynasty had been the first true Imperial dynasty in China, so how was Imperial succession from one dynasty to another supposed to work? It seems that Liu Bang was initially somewhat reluctant to claim the imperial throne and preferred to simply rule an independent Han state, but he was persuaded by his court to establish his own dynasty. But this whole sequence of events was messy and chaotic. The empire as a concept had only been around for about twenty years, and during much of that time it was fending off attacks from all sides. When the new rulers fell into this role they had to frantically build up the machinery of an imperial state. The historian Sima Qian, who is one of the most important sources we have for this time period, wrote: At that time, the empire had only just been settled, and they were only just about to knit together the foundational structures; when later the High Empress ruled though a wo"
