description = "The most important application of astronomy in Polynesian societies was oceanic navigation. Polynesian navigators regularly traversed from one small island to another across hundreds of miles of open sea. To accomplish these feats of seafaring, they relied on an intimate knowledge of the night sky."
full_description = "Episode 46: The Stars from Starboard September 27, 2024 The most important application of astronomy in Polynesian societies was oceanic navigation. Polynesian navigators regularly traversed from one small island to another across hundreds of miles of open sea. To accomplish these feats of seafaring, they relied on an intimate knowledge of the night sky. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Last month we looked at a number of the astronomical practices among the Aboriginal Australians. In this episode we will remain in Oceania but we will put out farther to sea and look at the astronomical practices of Polynesia, along with Micronesia and Melanesia. In some ways the people of Polynesia are the mirror image of the Aboriginal Australians. The Aboriginal Australians largely inhabited a single landmass, the Australian continent, with the important exceptions of Tasmania and a number of islands in the north. But in this one landmass there was a huge diversity of languages and cultures. I mentioned in the last episode that there were some 30 separate language families, which is really quite incredible when you consider that in Eurasia, a single language family, the Indo-European language family, stretches from India all the way through Iran, to Armenia, Russia, Poland, Greece, Germany, France, Spain and Portugal, with many other countries besides. The huge diversity of languages in Australia came about from the relative isolation of Aboriginal Australians for tens of thousands of years. And in this time the Aboriginal Australians learned how to traverse large distances across inhospitable terrain. By contrast the Polynesians spread out over a far larger area, around 6% of the Earth’s surface. But all share the same language family. One archaeoastronomer, William Liller, visited Easter Island once and was surprised to find that an elder reported that he was able to understand the Samoans he had encountered without any need for a translator. And whereas the Aboriginal Australians had inhabited their continent for tens of thousands of years, parts of Polynesia were inhabited relatively recently. Hawaii was settled around a millennium ago or possibly a little earlier and the Maori first settled in New Zealand less than 700 years ago. Like the Aboriginal Australians, the Polynesians had to learn how to traverse vast distances across an inhospitable environment, but in their case they had to learn how to travel over open sea rather than land. Well, before we get into the astronomy we will, as always, start with the geography. With the Polynesians, the connection between their astronomy and the geography is straightforward. Since the region consists of some 1000 islands scattered across a vast area of the Pacific Ocean, Polynesian culture naturally centered around seafaring, and Polynesian astronomy was developed largely in service of their seafaring needs. Now, I’ve been saying Polynesia for simplicity, but actually much of what I’ll be talking about in this episode also applies to Micronesia and Melanesia. The fact that these regions all have different names suggests that there are hard and fast boundaries between them, but in reality it’s more of a convenient way to subdivide the region rather than a set of mutually exclusive cultures. Cultural practices between the three regions all bleed into each other, and if you were traveling from one island to the next you’d be hard pressed to pinpoint where exactly Micronesia ended and Polynesia began. Well, the whole region more or less owes its existence to the so called Ring of Fire. Almost the entire Pacific ocean sits on top of a single gigantic continental plate, called, appropriately enough, the Pacific Plate. All around its edges, its interactions with neighboring tectonic plates causes a great deal of geological activity. Where I sit recording this podcast in Los Angeles, California, the Pacific Plate to my west is slowly moving southeast with respect to the North American plate that I am on top of, forming the San Andreas fault. This fault line has caused no shortage of big earthquakes for us Californians and, in fact we are overdue for the big one now. Hopefully it comes after I finish with this series so that it doesn’t interrupt the podcast schedule for all of you listeners. The Pacific plate continues up northwest along the North American coast, and then curves around under Alaska. Its thanks to its actions up there that you have the Aleutian islands, that chain of volcanically active islands in the southwest of Alaska. Then the Pacific plate moves down, butting up against Japan, where its motion is responsible for the major earthquakes that that country sees. Then it moves south right up to New Guinea, where it starts to move southeast. Then it swings southward, passing through New Zealand. To the west is the Australian plate, and at many points, the Pacific plate is subducting under the Australian plate, and the interaction between these two tectonic plates has created mountain ranges. But, because the Pacific plate is so low, being under a huge amount of water, what we actually see is not an impressive mountain range, but an archipelago of islands. The main exception to this is the island chain of Hawaii, which sits pretty well near the center of the Pacific plate. This island chain was created by what is called a “hotspot” in geology, a place where for whatever reason the mantle happens to rise up through the crust to create a volcano. In fact, Hawaii gets its characteristic arc of islands to the northwest due to the fact that the Pacific plate is moving to the northwest over this hotspot. Over the course of millions of years, magma would emerge through the hotspot to form a volcanic island. But over time, tectonic motion would move this island to the northwest so that it wasn’t over the hotspot anymore. Then the activity of the hotspot would create a new volcanic island and the process would continue again. Over time the older islands to the northwest would erode away, and so the chain has a characteristic pattern where the largest island is the one that is currently over the hotspot and contains an active volcano, and then the islands get smaller and less volcanically active as you move to the northwest. The shape of the island chain essentially traces the motion of the Pacific plate over the last 30 million years or so. Well, following the border of the Pacific plate down south along its western edge, we run into the area known as Micronesia. Micronesia extends just to the east of the Philippines and to the north of New Guinea, and as its name implies, it consists mostly of small islands. There are four main archipelagos in Micronesia: the Caroline Islands, which extend east-west, the Mariana islands, which extend north-south, the Marshall islands in the northeast, and the Gilbert Islands in the southeast. To the south of Micronesia is Melanesia, which extends from New Guinea to the south and east. Here the main archipelagos are the Solomon islands which extend south and east of New Guinea, New Caledonia, in the south, and Fiji in the east. Melanesia gets its name from the fact that 19th century anthropologists perceived that the peoples in Melanesia had darker skin than in Micronesia or Polynesia. But in both Micronesia and Melanesia there is quite a diversity of ethnicities and languages. Polynesia, by contrast, is relatively homogeneous ethnically and linguistically, which is due to the fact that the islands of Polynesia were settled much more recently. Polynesia is traditionally bounded by the so called Polynesian triangle which stretches from New Zealand in the southwest, up to Hawaii in the north, and Easter Island far in the east. In addition to these three corners, one of the most important archipelagos was Tonga, which sits at the western border of Polynesia with Melanesia. To the north of Tonga closer to the point where Polynesia, Melanesia, and Micronesia meet is Samoa. And near the center of the Polynesian triangle are the Cook Islands and the Society Islands, of which Tahiti is the most important. Now, we generally speak of the Polynesian triangle because all of the islands of Polynesia fall within this triangle between Hawaii, Easter Island, and New Zealand when you plot them on a map. But the Polynesians themselves tended to conceive of the shape of their world as more of an octopus, with the head of the octopus centered near Tahiti, and its various tentacles stretching out through the ocean to other archipelagos along the sea routes they would take. Now, it’s important at this point to emphasize just how vastly separated the islands in Polynesia are. As I mentioned earlier, the Polynesian triangle makes up around 6% of the Earth’s surface, but less than 0.2% of this area is land, and the majority of that is New Zealand alone. Out in eastern Polynesia, the typical distance between islands is on the order of hundreds of miles. This meant that if you were going to travel from one island to another, you really had to know what you were doing and where you were going. On the open sea, you can see out to a distance of about three miles or so. If the island you’re aiming towards has tall palm trees you can see it a little ways further than that, maybe about ten miles away or so. In fact, a handy rule of thumb is that a rough estimate of the distance to the horizon in miles is the square root of the height of the observer in feet. If you want to be somewhat more accurate, bump this number up by 20%. So, for a person standing on a boat, maybe about six feet above water, they will be able to see out to a bit more than the square root of six miles, which works out to be just under three miles. If the island has a palm tree of around 60 to 70 feet, then it will be visible at a distance of square root of 64, or 8 miles, bumped up by 20%, gives you nearly 10 miles. At any rate, if you’re making a voyage to an island some 300 miles away, but you can only see it if you get within 10 miles of it, in good conditions, you can see how this is a very tricky navigational problem. If you’re off in your bearings a little bit and drift just 10° away from where you were aiming, you’ll miss the island completely. If you keep going, there’s no telling where you might end up. The next landmass might be several thousand miles away. This, of course, raises the important question of how people ended up on these islands at all in the first place. An early hypothesis was that these islands were essentially discovered accidentally through random drifts. Some hapless voyagers missed their targets, or got blown off course, drifted around aimlessly at sea and eventually they happened to get lucky and drift to some remote island. Now, it can’t be ruled out that maybe a couple of islands were discovered this way. But there’s really no way that the furthest flung Polynesian islands like Hawaii or Easter Island could have been discovered in this manner. The main problem is that the prevailing currents in the Pacific Ocean go east to west. So if you get blown off course and start to randomly drift around, you will end up in Micronesia, and eventually hit the Asian landmass. You would never get to Hawaii or Easter Island that way. In fact, during the 1600s when the Spanish were beginning to colonize the Philippines there are records of Polynesian sailors drifting ashore. One missionary named Father Serrano noted that he had spent 37 years in the Philippines and in that time he saw eight Polynesian crews drift ashore. But he was astonished to find that in the following year, 1664, he saw 30 ships drift ashore, presumably because that year was exceptionally stormy. Now, how the most distant islands in Polynesia were first discovered remains an open question, but the overall timeline of settlement across Micronesia, Melanesia, and Polynesia is by this point fairly well established. The western parts of Micronesia and Melanesia were first settled very early on, at least 50,000 years ago, in the same population expansion that settled Australia. These first groups were ethnically distinct from the later Polynesians and remained hunter gatherers. They never developed many of the necessary technologies to make the long voyages over the open sea that would allow the settlement of distant lands: pottery, animal domestication, sophisticated shipbuilding, to name a few. But sometime during the fourth millennium BC, these technologies emerged in Taiwan. It seems that these early seafarers got their practice traversing the Taiwan Strait to the Chinese mainland, which is a distance of about 80 miles. These early inhabitants of Taiwan developed the so called Dapenkeng cultural package, which included domesticated pigs and chickens and a tool called a bark beater. In the absence of sheep, cotton, or other sources of fiber, the bark beater was used to pound the bark of a native tree into clothing and rope. Another important development here was a tool called an adze which was used to hollow out tree trunks to make canoes or make flat planks of wood. A few centuries later, this cultural package made its way south to the Philippines and by about 2000 BC it had gotten to Indonesia. Over the next millennium the tools and techniques needed for long ocean voyages became highly refined and the Austronesian people began to expand across Micronesia and Melanesia, in many cases displacing the earlier inhabitants. Now, at this point it’s worth pausing to talk a little bit about the kinds of boats that these peoples were using as they began their expansion across Oceania. The earliest kind of boat that appears is called a dugout canoe. It’s a simple thing to build, at least in principle, even if it’s maybe somewhat tedious. You take a large tree trunk, lie it on the ground, chop off the top, and hollow out the insides. Then you taper the ends to make it more hydrodynamic. This works, but it’s a bit precarious even in relatively calm inland waterways like lakes or streams. If you get just the slightest bit off balance, the whole thing is liable to roll over and capsize. Because of this, dugout canoes were never suitable for navigating on the open ocean. Eventually, coastal peoples hit upon a solution to this problem called the outrigger. The idea is that you take two logs and fasten them a few yards out on either side of your canoe. This makes the boat far more stable. If it starts to roll in one direction, the outrigger in that direction will start to submerge, and the buoyancy force will keep it from sinking too far, and the canoe won’t capsize. The development of double outrigger canoes is what made it possible for the Austronesian people of Taiwan to travel to mainland China and later south to the Philippines and beyond. But the original Polynesians who made the"
