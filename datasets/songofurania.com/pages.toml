description = "Two of Plato's students were notable astronomers. We looked at one of them, Eudoxus, in the last two episodes. In this episode we turn to Plato's other student, Aristotle. Aristotle embellished Eudoxus's model of planetary motion, but also developed a comprehensive physics and cosmology that ultimately became the standard model of the universe during the High Middle Ages."
full_description = "Episode 18: Aristotle, Plato's Other Student June 14, 2022 Two of Plato's students were notable astronomers. We looked at one of them, Eudoxus, in the last two episodes. In this episode we turn to Plato's other student, Aristotle. Aristotle embellished Eudoxus's model of planetary motion, but also developed a comprehensive physics and cosmology that ultimately became the standard model of the universe during the High Middle Ages. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Two episodes ago we learned about one of Plato’s students, a man by the name of Eudoxus who developed the first sophisticated model of planetary motion, an idea that today goes by the name “the theory of homocentric spheres” because all the spheres in this model were centered on a single place, the center of the Earth. And towards the end of the last episode we learned about how Callippus, one of the students of Eudoxus, had modified this theory of homocentric spheres. Callippus was probably too young to have learned from Eudoxus directly, but was taught from Eudoxus’s other students and then developed the model further by adding in more spheres to fix some of the deficiencies that Eudoxus’s model had, particularly when describing the orbits of Mars and Venus. In this episode we’ll turn to another student of Plato’s who also added his own embellishments onto Eudoxus’s theory, but had a lot of ideas on a lot of things to boot. As you will have seen from reading the show’s title, this man was, of course, Aristotle. It’s quite hard to overstate the influence of Aristotle on the western intellectual tradition, and in some ways the history of western philosophy can be viewed through the lens of an eternal competition between Plato and Aristotle’s philosophical visions. But before we get to these lofty matters, I think we should spend some time with the man himself and the broader culture he was working in. Aristotle was born in 384 BC, so was about 40 years younger than his teacher Plato, and born about twenty years after all the turmoil that resulted when Sparta beat Athens in the Second Peloponnesian War and had installed the Thirty Tyrants who instigated a reign of terror. He was born in a small town called Stagira which was located in a relatively unimportant region in the north of Greece called Macedonia. Or at least, at the time of Aristotle’s birth, the Kingdom of Macedonia was of no real importance. It had existed for several centuries as one out of the multitudes of Greek statelets and around the time of Aristotle’s birth was more or less struggling for its survival and was being harassed on all sides by its neighbors. But Aristotle’s life coincided almost perfectly with the unbelievable rise of this podunk kingdom in northern Greece to the largest empire the world had seen to that point. Aristotle died just one year after Alexander the Great, who by his death at age 32 had expanded his empire all the way east to India. You may recall from Episode 8 that the history of ancient Greece is traditionally divided into five eras: the Dark Ages, the Archaic period, the Classical period, the Hellenistic period, and the Roman period. The death of Alexander the Great in 323 BC is the canonical demarcation between the Classical period and the Hellenistic period, so Aristotle’s life came at the tail end of the Classical period. Now, Aristotle wasn’t just any old Macedonian, he had close connections to the Macedonian royalty. His father, a man named Nichomacus, was the personal physician to the Macedonian king Amyntas III. We have some evidence that as a child he probably helped his father out in his work which may help to explain his later particular fascination with biology. But he did not have the opportunity to learn too much from his father because both his parents died at the time he was 13. He stayed in Macedon for the remainder of his childhood, but when he came of age at 17, he travelled south to Athens where he joined Plato’s Academy. And there he stayed for the next 19 years of his life. We don’t really know too much about this rather substantial chunk of his life. From his later writings it seems that he entered the Academy as an enthusiastic disciple of Plato, but over the years began to have certain doubts about some of the fundamental principles of Plato’s philosophy. But this all is a bit of conjecture because none of his surviving works are thought to have been written during this two decade long span. At least as an author, Aristotle apparently got a rather late start. We do know for certain that Aristotle admired his teacher tremendously. He wrote that Plato “was a man whom the bad have not even the right to praise — the only man, or the first, to show clearly by his own life and by the reasonings of his discourses, that to be happy is to be good.” Well, after Plato died in 348 BC, Aristotle left Athens for the city of Assos in northwestern Anatolia. There are a few guesses about his motives in leaving Athens. One possible reason for his departure is that he was not happy with the new head of the Academy, a philosopher named Speusippus. Speusippus seems to have deviated from Plato’s teachings, especially on Plato’s theory of forms, but this doesn’t really seem to be a good enough reason for Aristotle to have become so upset as to leave since by this point Aristotle himself was almost certainly also having his own doubts about Plato’s theory of forms. So it is conjectured that perhaps he was upset with more prosaic aspects of Speussipus’s management of the day-to-day life in the Academy. But another possible reason that Aristotle may have thought it was prudent for him to put some distance with Athens was a rise in anti-Macedonian sentiment in the city around that time. Now, to understand why resentment had been building in Athens against what had up to now been a marginal kingdom in a marginal region of Greece, I’m going to momentarily pause the biography of Aristotle and take a detour towards what had been going on in Macedonia at the time that took it from being irrelevant to a military juggernaut in just a few decades. So, to rewind the clock back to the time of Aristotle’s birth in 384 BC, at this point Macedonia was not in a good way. I mentioned earlier that it had existed as a small kingdom for centuries, but wasn’t really of too much importance in the larger geopolitics of ancient Greece. It was in the northern part of Greece, sort of nestled in where the country starts to hooks east over the Aegean Sea. Surrounding Macedonia to the north and the east was the region of Thrace, and to the south was the region of Thessaly, maybe today best known for St. Paul’s two rather apocalyptic letters to the Thessalonians. Further south was a region of mountainous terrain that was difficult to navigate with the exception of the crucial pass at Thermopylae. And even further south of that, separated geographically, was the real center of Greek culture and politics: the cities of Athens, Thebes, and Sparta. Now more than a hundred years earlier had been the first invasion of Greece by the Persians under King Darius. In the eyes of the rest of Greece, or at least in the eyes of Athens and Sparta which had formed the backbone of resistance to the Persians, Macedonia had not exactly covered itself in glory in this conflict. They capitulated to the Persians almost instantly and for the next century or so acted as enthusiastic lackeys for the Persian government. Their royalty intermarried with high ranking Persians, and they took advantage of their good relations to borrow the Persian military from time to time to try to expand their borders into neighboring Greek kingdoms. And during the second Persian invasion of Greece, they actively fought on the side of the Persians against Athens and Sparta. I mentioned in an earlier episode that in popular consciousness we often think of the Greeks as heroically resisting the invading Persians, but in reality most Greek city-states were neutral in the conflict and a large number of them actively fought on the side of the Persians, and Macedonia was one of these. It’s no surprise then, that in Athens, opinions of Macedonians were not exactly high. After the Persians were expelled from Greece in 480 BC, a century before Aristotle’s birth, Macedonia, rather sheepishly, went to Athens and asked for friendly relations. Athens did not feel especially magnanimous in the moment and more or less told them to pound sand. So, over the course of the 5th century, as Athens’s power in Greece grew, Macedonia found itself in a progressively weaker and weaker position. Various kings in neighboring kingdoms tried to grab territory, Athens encouraged settlers to colonize regions in Macedonia, and Athens provided military support to anyone at all who wanted to revolt and challenge the Macedonian king’s right to the throne. So, over the course of the 5th century, Macedonia lurched from crisis to crisis. To try to find some friends with some influence, they tried allying themselves with Athens’s archrival Sparta. But during the Battle of Lynketis the Macedonian army ran away before the battle even began after they got spooked when they saw the size of the opposing army. After seeing the Macedonians scatter without even giving an appearance of putting up a fight, the honor-obsessed Spartans lost all respect for the Macedonians and decided to steal their supplies after the Macedonians retreated. So in the end the Spartans saw the Macedonians as cowards and the Macedonians were angry at the Spartans for stealing all their stuff. The next century did not start off much better. In 399 BC the King of Macedonia of the time, Archelaus I, was assassinated and the kingdom fell into civil war for the next six years. Now around this time Macedonia’s old enemy Athens was now losing influence after its defeat in the Peloponnesian War. So, over the next thirty years or so, Thebes started to rise as the main player in Greek affairs. Thebes warred against, and eventually defeated Sparta, and during this time started to project its power north as well, into Macedonia. At one point, around the time of Aristotle’s birth, the king of Macedonia, Amyntas III was forced to flee to escape an invasion. Ultimately Macedonia became essentially a vassal state and was forced to provide royal hostages to Thebes as collateral to ensure that they didn’t get any bright ideas. One of these hostages was a brother to the king named Philip II. Now, I’m really racing over centuries of history because, after all, this is a podcast about the history of astronomy, so you’ll have to forgive me for skimming over all the details in the remarkable turn of events that then occurred after the death of King Alexander II. Another brother of Alexander II succeeded him to the throne, named Perdicas III, but Perdicas died in battle. The throne then fell to Perdicas’s son, Amyntas IV, but he was an infant at the time, so Perdicas’s brother, Philip II, usurped the throne in 359 BC, around the time that Aristotle had been in Athens studying at Plato’s Academy for about five years. And this is where the fortunes of Macedonia really start to turn around. At this point the fact that Aristotle was a Macedonian was probably seen as a somewhat shameful quality in a man, but ultimately harmless. What was the worst that a Macedonian going to do to you — run away from you in battle? Now, when he ascended the throne, Philip had been a hostage in Thebes for many years and an upside of his captivity was that he had had the opportunity to see how things were done in a city-state that wasn’t a complete disaster. He may have been a hostage of Thebes, but he was noble so it’s not as though he was thrown into a dungeon. The Thebans just wanted him around so that if his relatives back home did something to upset Thebes, Thebes could exert a little, ah leverage. So when Philip acquired the throne and was permitted to return home, he had gotten a few ideas for reforms to make from his time in Thebes. He first started with his military. He instituted rewards and promotion for good service, generally good policy in any organization, and he introduced a new set of tactics. You may recall from many episodes back I talked a little bit about the hoplite as being the foundation of the Greek military. Hoplites were freemen who could afford the necessary equipment to join the military. The two most important pieces of kit were the spear and the shield. A hoplite held his shield with his left hand, and his arm went through a strap in the center of the shield and gripped a strap at its rightmost edge. Because the shield tended to cover only his left half, he relied on his neighbor to the right to protect his right side. Then with his right hand he held a spear about nine feet long. Philip’s innovation, inspired by what he saw in Thebes, was to give his soldiers spears that were about twice as long as the standard spear, so around 18 feet long. But because of their length, they were much heavier than the usual spear and had to be held with both hands. This meant that they couldn’t hold a shield, so instead they just hung their shields from their neck, making it more like body armor. But because their spears were twice as long as those of their opponents, their opponents had a hard time getting close enough so that they could take advantage of the smaller shields. To make matters worse, or better if you were a Macedonian, because the spears were longer, spears from ranks further back in the phalanx would extend past the front, which essentially doubled the effective number of speartips exposed to the enemy. This innovation turned out to be extraordinarily effective for Macedonia and was a big reason that they were the dominant military tactic for about 150 years until it was displaced by the development of the Roman legion. Well, the military couldn’t turn itself around overnight, so Philip II made a number of deft diplomatic moves to give the military the time it needed to train for this new way of fighting. Philip essentially bought off his neighbors to bribe them into not invading him, at least for a little while. But within a year he took his shiny new army for a test drive against a contingent of Athenian mercenaries in the Battle of Methone. The Macedonians won handily which surely brought up morale since it was the first time in a long time that anything good had happened to them on the battlefield. Soon enough he started attacking his neighbors one by one in quick succession so that they didn’t have time join up and combine their much larger forces against him. Now, I mentioned earlier that Athens had been sending settlers up into Macedonia and several cities in the region were allied with Athens. In his effort to gain control over the region Philip II was able"
