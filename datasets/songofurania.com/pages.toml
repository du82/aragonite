</p>"""
full_description = "Episode 13: Ex Uno, Plura January 19, 2022 As we transition from the Archaic Period of Greece to the Classical Period, two philosophers, Empedocles and Anaxagoras, rebel against the prevailing dogma of monism and present a new idea — that matter consists of mixtures of multiple fundamental elements. Thanks to William Little of Ohio State for help with the Latin to get the opposite of E Pluribus Unum for the title. If you would like to register for the Stellar Spectacles symposium that I mentioned at the beginning of the episode, go to www.asxsociety.com. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. Before we begin, a listener from the University of Toronto, Adam Lam, asked me to plug an astronomy symposium he is helping to organize. From what I’ve seen of it, it looks quite interesting, so if you happen to be in the Toronto area from February 10–12, I encourage you to check it out. The title is Stellar Spectacles and there will be a number of astronomers speaking about advances in detector technology, including LIGO and JWST. You can learn more and register at asxsociety.com. Well, I’m afraid I have to start this episode by telling you that I have done a bit of a bait and switch. I ended the last episode with a tantalizing segue into the atomic theory of Democritus. But before we get there, we’ll need to develop another critical intellectual development that preceded atomic theory. This was the pluralism of Empedocles and Anaxagoras. To recap where we’ve been, in the last four episodes, we’ve been wending our way through a number of the pre-Socratic philosophers, at least those who had a particular interest in natural philosophy. We started with Thales of Miletus, who is the first Greek natural philosopher we know of and who was active in the early 500s BC. We then looked at the later members of the philosophical tradition that Thales founded, which is usually called the Milesian or Ionian school. These were Anaximander, Anaximenes, and Heraclitus. Then we followed Pythagoras from Ionia to Magna Graecia, where he founded his own unique secretive, one might say cult-like, philosophical tradition. And in the last episode, we looked at anther tradition that was heavily influenced by both the Ionian school and the Pythagoreans — the Eleatic School of Parmenides and Zeno. Now, in all the philosophies of the various thinkers I talked about, there is a common thread through them all. One of the questions that particularly interested these philosophers was the ultimate origin of all things. Karl Popper argued that the question of cosmogony, how the universe came to be, is really the origin of all philosophy. And given the attention that the earliest of the philosophers gave to it, Popper may have been on to something here. Well, starting from Thales all the way to the last philosopher I mentioned in the previous episode, Zeno, these philosophers all approached this question in the same way. They all held to some form of monism — some more loosely than others. But for all of them a foundational component of their philosophy was that the ultimate nature of the world was a single substance. What exactly this substance was varied among the philosophers, but the idea that there was one thing that undergirded all matter was common to all of them. To briefly retrace how these ideas developed, we started with Thales, who held that all things had their origin in water. Now, this has a certain plausibility to it. Although Thales himself didn’t point to it, there was some evidence from fossils of fish in mountains that water had once covered the Earth. But his student Anaximander, in a prelude of things to come, found it too hard to understand how one kind of matter could produce the variety of matter we see around us. So he instead proposed that this fundamental substance was not any kind of ordinary matter, but was a new kind of substance which he called the “apeiron”, or the Infinite. Now, this in a way sidestepped the crucial question of how different kinds of matter could come from a single kind of matter — the fundamental substance was infinite, after all, so why not. But at the same time it does seem to be a bit too convenient. No one had ever seen the apeiron, no one had felt it — how could we know that it really existed? Anaximander’s student, Anaximenes rejected the idea of this mysterious substance and claimed that it was the air instead. Now, to some of us, this may seem like something of a regression, but Anaximenes’s idea had a certain logic to it. After all, unlike the other basic kinds of matter, air was compressible. Anaximenes reasoned that perhaps under sufficient compression, the air could condense out other forms of matter like water and Earth. And finally, Heraclitus had proposed that the source of all matter was fire. Heraclitus’s system also had a certain logic to it, because Heraclitus emphasized the constantly changing nature of the universe. All things, from a leaf burning in a fire to even the seemingly most permanent rock are always changing, perhaps quickly perhaps slowly, but always changing nonetheless. Moreover, these changes manifested themselves by continual exchanges from what he called the upward path and the downward path. And fire was the purest manifestation of this transfer between the upward path like the smoke rising up and the downward path with the ash falling to the ground. Now these philosophers, who formed the core of the Ionian School, brought the idea of monism to prominence — the idea that matter is, fundamentally, all the same. But even among the Ionians, monism was already showing itself to be a philosophy with some rickety foundations. Anaximander could only reconcile himself to the position with this mysterious unobserved apeiron. And Heraclitus’s stress on the upward and downward path seemed to point more towards dualism with the fire acting as more of a mediator between two fundamentally different kinds of matter. The Pythagoreans then took monism in a more mystical direction by claiming that the fundamental source of all things was not any physical matter, but was, instead number. Now, the Pythagoreans probably had a more concrete conception of what number was than the more abstract idea that we do today, so this for them was not just the source of matter in some vague sense like “the laws of physics obey mathematical laws”, but that there was a thing, and groupings of those things in different numbers, produced different kinds of matter. But finally, the Eleatics took the ideas of monism to their logical extreme. Parmenides couldn’t explain how a single substance could produce the observed variety of the world so he was forced to argue that the world as we see it just didn’t exist — it’s all an illusion. The universe is a solid, uniform block, completely static and ever-unchanging. This was the conclusion of centuries of development of monist ideas Now, to give monism its due, monism was only popular for as long as it was because it does have certain things to recommend it as an approach to natural philosophy. Monist systems can be very attractive because the mind is naturally looking for patterns across the things of the universe, commonalities across what we see so that we can explain the whole of nature. In monist systems, we can explain the whole variety of nature with a single, unified concept. But as always seems to be the case in philosophy, one philosopher’s feature is another philosopher’s bug. The idea that you can explain everything with a single substance that makes monism so attractive also presents some tough philosophical problems. In particular, the question naturally arises: Well, okay, sure, suppose everything really is a single substance, say water or air or number or apeiron. The fact of the matter is is that I actually do in practice see different things. Thales claims that all things have their origin in water, but I see things that are not water. So what is going on there? We can argue that perhaps some things do not appear to be water because its true watery nature is somehow “hidden” from us. But at the same time we do see things in the world that do appear to us to be water. So why does some water look like water to us and other water does not look like water to us? If the things that don’t look like water are a sort of “hidden” water, what exactly is hiding the water? Can it really just be more water? This problem can be put more pithily with the following argument. The monists claim that all things are really one substance. But we observe that there are, in fact, many substances. Now, if two things are different from each other, they must be different in quantity or quality. Now, if two things in this world are different only in terms of quantity, then monism cannot explain the variety of substances we see in the world. Because if we just add more water to water, we don’t get earth or air or fire. We just get more water. Likewise adding fire to fire just produces more fire, not water. But if the things are different in terms of quality, then by definition monism is necessarily incorrect. At root, the main problem with monism is this: if everything is one thing, how do you get anything else out of that? Parmenides and the Eleatics took this argument to its logical conclusion and stated that, in fact, everything is one, and that the variety we observe is nothing more than an illusion. Well, by the middle of the 5th century BC, an alternative system began to appear, and this was due to two philosophers who were roughly contemporaneous: Empedocles and Anaxagoras. Now, Empedocles is really the first of the philosophers we’ve looked at who really doesn’t seem to have any predecessors in his vicinity. All the others were either from Ionia, taught by philosophers who themselves had traveled from Ionia, or had been taught by someone who had been taught by someone who had traveled from Ionia. But Empedocles came from way out in the boonies of Magna Graecia in Sicily and didn’t really have any connections to the mainstream of Greek intellectual life until he traveled, probably to Italy where he likely met some Pythagoreans and then later in his life to Athens. Like pretty much all the philosophers of the time he was both wealthy and noble. Empedocles has the distinction of being the last natural philosopher to write in verse. After this, philosophers wrote their treatises exclusively in prose. Unfortunately the work itself doesn’t survive in its entirety, but we do have fragments which total several hundred lines, which by comparison to many other philosophers of the time, is pretty good. Well, perhaps his most enduring innovation was his claim that all matter consisted of four elements: these were earth, water, air, and fire. The variety of matter we see in the universe is, ultimately, these four fundamental elements mixed together in different proportions. This idea, what came to be known as the four classical elements, was later enthusiastically taken up by Aristotle and from there became the foundation of natural philosophy in the West for some two thousand years, not just in physics and astronomy, but in alchemy and medicine as well. In later episodes we will see how this idea of the four classical elements formed the cornerstone of a sort of grand unified theory of medieval science. But for our story for now, the main innovation of Empedocles’s system of four elements was that it was the first decisive break in natural philosophy from the clutches of monism. What exactly led Empedocles to a pluralistic system is not entirely, clear. Perhaps it’s a consequence of him being a relative outsider to the other natural philosophers of his day, but one thought experiment does survive. Empedocles had noted that if you take a cup and you submerge it upside down in a pail of water, the water does not fill the cup. There will be a little pocket of air that gets trapped in the cup. You can stick a dry leaf to bottom of the cup and it will never get wet. Now, it was well understood at the time that air was compressible. But Empedocles reasoned that if Thales was correct that all things were water, if you compressed air, it should turn back into water. So the air in the cup should turn into water and wet the leaf. But this does not happen. So Empedocles concluded that air was fundamentally of a different nature than water. Now Empedocles’s system also had a number of features that did not survive for two thousand years. In his system, there were two other forces in the world, which he called Love and Strife. The force of Love is what drew matter together and the force of Strife is what broke it apart. So by combining the four elements with these two forces, Empedocles hoped to explain not just the nature of matter in a static universe, but in a dynamic universe as well — how things in the universe seem to change. To Empedocles, the complex behavior of life required a balance between love and strife. If matter is dominated by strife, the result is chaos, and life cannot persist. But equally well if matter is dominated by love, the result is perfect harmony, absolute order. This can produce the orderly behavior of the heavens or a crystal, but also cannot sustain life. Life must inhabit a regime balanced between the two, on the edge between love and strife, order and chaos. This idea of eternal competition between the forces of love and strife did not take on quite as well as the four classical elements. But the general framework has some parallels with chaos theory, which developed in the second half of the twentieth century AD. Around this time, electrical computers were developing to the point where it was becoming feasible for mathematicians and physicists to study non-linear dynamical systems. These kinds of systems are generally very difficult to study analytically, with pen and paper, so in many cases the only way to make much progress is numerically, do just do brute force calculations over and over and over again to obtain approximate solutions. But some of the early researchers in the field like Benoît Mandelbrot and Mitchell Feigenbaum were surprised to find that systems with apparently simple non-linear equations produced exceedingly intricate dynamics. For example, a pendulum is a system with extremely predictable dynamics. The pendulum simply swings back and forth at an exactly predictable interval. But if you take a pendulum and add a hinge in the middle, this produces what is called a double pendulum. If you start this pendulum swinging by just a small amount, once again the pendulum has very simple, predictable dynamics. But if you start it out by raising it through a critical angle of about 70 degrees, suddenly the dynamics become chaotic. The pendulum starts swinging every which way and it becomes in p"
