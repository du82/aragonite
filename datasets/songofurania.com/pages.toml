title = "The Song of Urania Podcast"
description = "Rome, the great empire of the Mediterranean, is not known for its astronomy. But while it lagged behind other civilizations, it is a mistake to think that they were entirely uninterested in the subject. Astronomical references permeated the Roman calendar and one of Rome's longest lasting contributions to Western civilization, the Julian calendar, was devised by the Roman astronomer Sosigenes."
full_description = "Episode 24: Etruscan & Roman Astronomy December 8, 2022 Rome, the great empire of the Mediterranean, is not known for its astronomy. But while it lagged behind other civilizations, it is a mistake to think that they were entirely uninterested in the subject. Astronomical references permeated the Roman calendar and one of Rome's longest lasting contributions to Western civilization, the Julian calendar, was devised by the Roman astronomer Sosigenes. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well at long last we have wrapped up our extensive tour through Greek astronomy, starting in the Archaic Age and landing all the way in the Roman Era some nine centuries later. So at this point we have encountered the astronomy of two cultures of antiquity: Greece and Babylonia. In this episode we’ll turn to the culture that came to dominate the Mediterranean — Rome. Now, at times I’ve rather put down the Romans for their astronomy, or lack thereof, and made snide remarks about them, saying things like “their astronomy or lack thereof.” Well, I’m being a bit unfair by saying things like that and you should know that I say it tongue in cheek. It’s easy to say something like, “the Romans had no astronomy” or “the Romans had no interest in astronomy,” but of course this just isn’t true. The Romans certainly did have an astronomy. It’s just that, relative to its neighbors, and eventual subjects, to the East, Roman astronomy was pretty paltry. And, while this comparison is a little unfair since Greek astronomy was really quite remarkable among the cultures of antiquity for its sophistication, if we broaden our horizons and look at cultures across the globe, compared to basically everyone else, from the Egyptians to the Indians, the Chinese to the Mayans, for a civilization of its staggering size, complexity, and longevity, Roman astronomy was undoubtedly at the bottom of the pack. But again, bottom of the pack doesn’t mean that they had no astronomy at all, so in this episode we’ll look at how the Romans viewed the heavens and how these views influenced the lives of the citizens of Rome, particularly in the earlier years of the civilization. Now, since we’re dealing with a new culture here, I think it’s helpful before diving right in to the astronomy, to just give a broad overview of the arc of the rise and fall of Rome. Of course if you want more detail about the history of Rome, you’ll have to look elsewhere, but I do hear that there is a good podcast on the subject. At the highest level, Roman history can be divided into three periods: the Roman kingdom, which emerged around the 8th century BC and lasted until the end of the 6th century, 509 BC to be specific, followed by the Roman Republic which lasts from 509 BC until 27 BC, which marks the transition to the Roman Empire, which everyone agrees lasts a long while, but sort of fizzles out at some point. The traditional end date is 476 BC when the Western Empire fell to German barbarians, but you could make the case that some form of the Roman Empire persisted in the East all the way until 1453 when Constantinople fell to the Ottomans. During this last era, as Rome subsumed the various Hellenistic empires in the East, the astronomy of Rome effectively became subsumed by the much more sophisticated astronomy of those cultures, so, in a way, we’ve already gotten to know what Roman astronomy of this time period looked like. In this episode I want to focus more on the astronomy of early Rome, when it was smaller and more isolated from the strains of Greek thought, though, as we’ll see, it was never fully independent from it. Now when we look at early Rome, we’re looking at a frankly unimpressive civilization. If, sometime in, say, the 7th century, you collected all the civilizations of the Mediterranean and I told you that one of these civilizations would grow to be the largest empire the world had ever seen and would dominate the whole of Europe and the Mediterranean, you would look at the lot of them and say that it was probably going to be the Egyptians with the Babylonians as strong runners-up. The Greeks would have been a bit of a dark horse at that point but not an entirely unreasonable bet. If I had then clarified that this civilization would come out of the Italian peninsula you would have been shocked, but then probably would have concluded that it must have been the Etruscans that, against the odds, somehow had risen to this lofty position, and, failing that, maybe the Samnites. But you’d be forgiven for laughing when I told you that it was, in fact, the Romans who managed this feat. For the first several centuries of its existence, the Kingdom of Rome occupied a little sliver of land on the western coast of the Italian peninsula and was no more than just one city state among the dozens and dozens of city states that dotted the Mediterranean. During the Roman Kingdom, the dominant culture on the Italian peninsula was that of the Etruscans to the north. The various groups on the peninsula, including the Romans and the Etruscans, warred and skirmished with each other over the centuries, but when Rome ultimately won out over the Etruscans, one of the great masterstrokes of Roman politics was in assimilating this conquered group into its own political order. The Roman aristocracy managed to arrange things so that they did, of course, stay on top; but the conquered Etruscan aristocrats found themselves with a surprising amount of influence for a conquered nation. Consequently much of what we think of as “Roman culture” is in fact of Etruscan origin and only comes to us by way of the Romans. Their very region, Tuscany, still bears the name of this ancient civilization. Now, up and down the centuries, from Roman times to the present, there has been debate about the origin of the Etruscan peoples. Among the ancient historians, there is a persistent trope that they migrated from the East, somewhere in Greece, maybe Tyrrhenus, maybe Lydia, maybe somewhere else, and there are some intriguing linguistic connections between the Etruscan language and civilizations to the East, even with some connections as far East as Persia. But modern genetic studies have concluded that the Etruscans were indigenous to the Italian peninsula. Now, oftentimes human migrations have been discovered first through linguistic analysis and were only later verified through genetic studies, but the Etruscans seem to be an exception where the linguistic and genetic analyses have disagreed with each other. For those of us interested in the history of astronomy, this question is really of the highest interest. There are certain features that show up fairly early on in Roman astronomy which had existed in the Greek and Babylonian civilizations to the East, the pentagram symbol for Venus and the octaeteris for instance, so it is natural to wonder whether or not the Romans had hit upon these commonalities independently, or if there had been some knowledge transfer from east to west, and, if there had been, how did it happen and when? Now unfortunately for us today trying to understand the early days of Roman civilization, no written records from this time survive, so the earliest days of Rome are steeped in legend. According to the founding myth of Rome, it all began when one day the god Mars happened upon the mortal Rhea Silvia who was a vestal virgin and was collecting water in Mars’s sacred grove to bring to his temple. Upon seeing her, Mars raped her and for that duration of this time there was a solar eclipse. Rhea Silvia then became pregnant with twins, but as a vestal virgin, she was forbidden to have intercourse, so when the twins Romulus and Remus were born, they were to be drowned. But the servant who was tasked with this grim assignment took pity on the infants and put them in a basket and set them adrift on the Tiber. Washing up ashore downriver, they were taken in by a she-wolf who raised them until they were discovered by a shepherd name Faustulus. Once the twins had come of age, they resolved to establish a new city, but they couldn’t agree on where the city should be founded. Remus wanted to found the city on the Apenine Hill, whereas Romulus wanted to found it on the Palatine Hill. So, they decided to consult the gods for a sign. After a short while, Remus saw six birds, which was a favorable sign. But a little while after that, Romulus saw twelve birds. Remus claimed that the gods had favored him since his omen appeared first, but Romulus claimed that the gods had favored him since he saw more birds. Their argument escalated, became physical and ultimately, Romulus killed Remus. Now there is much that could be said and has been said about this founding myth, but I will say that given that the Romans identified the founding of their civilization with the rape of a woman followed by the murder of one of her sons by the other, I can’t help but be reminded of a sketch by the comedy duo Mitchell and Webb. In the sketch, the two play Nazi soldiers during WWII. One of them realizes that they have been wearing hats with skulls on them this whole time and plaintively asks his companion, “Hans, are we the baddies?” Surely some young Roman, learning the tale of his civilization’s origin for the first time must have had a similar thought. Of course, this isn’t the only fratricide in founding mythology, early on in the Book of Genesis, Cain kills his his brother Abel. But at least the Jewish myth has the good sense to make Cain pay for his actions. After murdering Remus, Romulus is rewarded by founding the most powerful empire the world had known. But this does, I think, reveal something important about the nature of the Roman relationship to power and morality. They were ardent believers of Herodotus’s observation that “the strong do what they will; the weak suffer what they must.” But beyond what this founding myth says about the Roman psyche more broadly, it does also indicate that the Romans were not uninterested in astronomy, contrary to what I may have led you to believe. After all, the foundational event of the conception of Romulus, the first king of Rome, takes place during a solar eclipse. And this detail is probably more than just a little supernatural flourish sprinkled on top of the tale, but had some deeper symbolic significance. The rape of Rhea Silvia by Mars was a physical conjunction of a god and a mortal on Earth, and for the duration of the rape, there was a celestial conjunction between the Sun and the Moon. In Roman mythology the Sun represented Apollo, a male god and the Moon represented, variously Diana or Fortuna, but either way a female goddess. Moreover, to symbolically commemorate the birth of their civilization, the new year was observed in March, the month associated with Mars. So the founding myth seems to have had an astrological significance in which a conjunction of a god and a mortal on Earth is paralleled by a conjunction of a god with the goddess of destiny in the heavens. Now, one thing I do want to make clear is that these myths were written down much later, by Romans during the late Republic or during the Imperial Era. So these tales almost certainly tell us more about the cultural zeitgeist of that later era than they are telling us anything about the very earliest days of Rome. Unfortunately the very early history of Rome only survived through oral histories and became commingled with myth over the centuries. Well, that is the legend of the founding of Rome, and that, of course, makes Romulus the first king of Rome. The second king of Rome was just as legendary, both in the sense that the creation of many of Rome’s social and political institutions were attributed to him, and he was legendary in the sense that it’s not clear whether or not he existed at all. This second king was Numa Pompilius, or King Numa. Now Numa did a lot of important things for Rome, he is credited with founding the office of Pontifex Maximus, the highest priest, and in fact this title is still claimed to this day by an inhabitant of Rome, though this particular inhabitant, who also goes by the more popular title, “the Pope,” professes a rather different religion than Numa did 2700 years ago. But for our purposes the most relevant contribution of Numa was to reform the Roman calendar. The very earliest Roman calendar is completely shrouded in mystery and legend, but is usually given the title the “Romulan calendar,” because, well, there was only one king prior to Numa, so there was no one else to attribute it to. But almost certainly this primordial calendar had been used by the forerunners of the Romans for centuries before they settled on the banks of the Tiber River. Now, the general narrative is that this calendar had only ten months. To commemorate the conception of Remus and Romulus by Mars, the new year was celebrated in March, or, in Latin, Martius. This was followed by Aprilis, then Maius, Iunius, and then Quintilis, Sextilis, September, October, November, and December. You’ll notice that there is a pretty close correspondence between the original months of the calendar and the modern day months. The only exceptions are Quintilis and Sextilis, which just meant “fifth month” and “sixth month”. The fact that the Romans observed the new year in March explains the otherwise perplexing feature of the modern day calendar where September, which seems to be telling you it’s the seventh month with the root “sept-“, is actually the ninth month, and October is the tenth month even though with the root “oct-“ it seems like it should be the eighth, and so on with November and December. The Romans were just starting their years from a point two months later than we do, so it all made sense to them. But, in a tale that will have to be saved for a much later episode, from around 1400 to 1750, various parts of Europe switched the date of the New Year from March to January, and consequently the names of the months no longer matched their order in the calendar. Well, the strangest feature of this primordial calendar of Rome, at least if later sources are to be believed is that it only had 10 months. So once they got to December they were done and there were no more months until the new year started again in March. Consequently, a period of about 50 days during winter just didn’t exist in the calendar and wasn’t tracked. Now, it’s not clear whether or not we can trust the later sources who claim this, and they generally contradict each other about the details of how this actually worked in practice, but as ridiculous as it might sound to us today, the idea is not entirely implausible. Rome in its very earliest days was not some great geopolitical power that needed to organize large armies of people across vast distances of time and space — it was a small rabble o"
