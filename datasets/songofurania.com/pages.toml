description = "We take a break from the main narrative in honor of this month's blue moon and turn to a somewhat more frivolous topic — how the term"
full_description = '''Episode 33: How the Moon Became Blue September 1, 2023 We take a break from the main narrative in honor of this month's blue moon and turn to a somewhat more frivolous topic — how the term "blue moon" came to mean the second full moon in a calendar month. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well, when I originally set out to do this podcast, I had a plan. I wanted to put out an episode every full moon, but I also knew that putting together an episode was a fair amount of work, so I wanted to give myself some wiggle room for a little break every now and again. Not very often, just once in a blue moon. Quite literally. My original idea was to skip any months that had a blue moon to give myself a month off. Well, I’ve been doing this podcast now for about two and a half years, and at long last, this episode is the first time that it falls on a blue moon. Sort of. I’ll get to that in a moment. But here we are with a new episode coming out right on schedule, or at least as close to on schedule as I normally am. So why have I broken this promise to myself of rest and relaxation? Well, the whole plan fell apart when I noticed something. Some podcast apps have a feature where they will tell you how often new episodes of the podcast come out. Some do this fairly approximately, and will say if it’s daily, weekly, monthly, and so on. But some will actually calculate the average number of days between episodes right down to the first decimal place. Well the neat thing about this podcast, at least to me, is that even though as you may have inferred, I am not always precisely on time with each episode, I do eventually get around to putting out an episode for every full moon. And as a consequence, my variation in the exact time that each episode gets released all gets averaged out. So if you look at the average length between episodes of this podcast, it is now really quite close to the synodic period of the moon. Excluding this episode, since I’m not sure exactly when it’ll be done and posted, so far the average time between episodes is 29 days and 15 hours, whereas the synodic period of the Moon is 29 days and 12 hours. Not too bad given all my irregularities! The interesting thing about this is that if we’re just looking at the average time between episodes, it doesn’t really matter how far off I am from actually posting on the full moon, all that matters is that I have the same number of episodes as there were full moons over that time period, and that the first and last episodes roughly correspond with a full moon. Any other variation just gets eliminated in the averaging. So, the longer this podcast goes on for, the more accurately you can figure out the synodic period of the moon just from the average time between episodes, which some apps will helpfully tell you. Now, I think that’s kind of neat in itself, but more relevant to the history of astronomy, it’s a nice demonstration of how early astronomers could measure the period of the Moon’s orbit to a precision that seems surprising to us today. The Babylonian astronomers, for instance, knew this period to within a second. But to do this they didn’t need to have invented a clock with a second hand or even need to have a way of determining exactly when the Moon was full or new. All they had to do was to count the number of full moons they saw for a very long period of time, and then let the averaging sort out the variation. Well, all this is to say that now I’m in this for good, because if I ever skip an episode, this will all be ruined. Nevertheless, I have been going for a while now, so as a compromise to myself, this episode will be on the shorter side, and I’m granting myself the liberty of stepping outside the overall narrative to do an episode on a somewhat more frivolous topic. And as a bonus to both me and you, this will give me more time to read about Indian astronomy before I have to really say something of substance about it, so hopefully it will make for a better informed episode when it comes out. As for what the frivolous topic is, what could be more appropriate for the podcast’s first blue moon than the history of the blue moon? Now, today, when someone says that there will be a “blue moon” they almost always mean that there will be two full moons in one month, the second of which gets designated the “blue moo”n. But this meaning of the term “blue moon” is actually quite recent. It sounds like it is some archaic astronomical or astrological term, like so many others that litter the field, but at least in popular usage, this meaning of “blue moon” only started to become common in the late 1980s, and the story of how this came to pass is a bit surprising, so I thought I would devote this episode to telling that story. The research on this topic was begun by the folklorist Philip Hiscock in the early 1990s, who wrote an article where he tried to track down where the definition of a blue moon as the second full moon in a calendar month came from. A few years later, a trio of scholars, Donald Olson, Richard Fienberg, and Roger Sinnott traced the definition back to its origins and wrote an article of their own, so this episode is largely based off of the work they presented in those two articles. Well, although the modern technical meaning of a “blue moon” is quite recent, if you comb through the English literature looking for this phrase you actually find that the first reference goes back a rather long ways, almost half a millennium. In 1528, one year after Henry VIII got the ball rolling on the English Reformation by petitioning the pope for an annulment, two Anglican friars and polemicists named Jerome Barlowe and William Roy authored an anti-clerical pamphlet entitled “Rede me and be not wrothe, for I say no thynge but trothe.” The whole thing is about 180 pages long, and roughly half of it consists of a dialog between two priests named Watkin and Jeffrey. Towards the end of the dialog, Jeffrey makes the first written reference to a blue moon, and says: O churche men are wyly foxes More crafty than iuggler’s boxes. To play ligier du mayne teached. Yt is not for nought they fayne That the two sweardes to them pertayne Both spretuall and temporall Wherwith they playe on both hondes Most tyrannously in their bondes Holdynge the world universall. Against god they are so stubbourne That scripture they toss and tourne After their own imaginacion If they saye the mone is belewe We must beleve that it is true Admittynge their interpretacion. Now there are two superficially plausible ways to read this line. One sense would be astronomically, that the church men say that the moon is blue because they are responsible for fixing the calendar, and some years have an extra full moon, making one of these moons “blue.” After all, if there’s one thing you’ve gotten from listening to this podcast, it’s that throughout history, astronomy has been tied up with determining calendars for religious rituals, so astronomy has historically been associated with a culture’s priesthood, and early modern Europe was no exception. But this sense doesn’t really fit in with the overall context. The more probable interpretation is that Jerome Barlowe and William Roy were just saying a thing that was utterly ridiculous that the churchmen were making you believe, much like the other tenets of the papal cult. This reading fits in with other early usages of the phrase “blue moon.” The term didn’t really start to be used with some frequency until the 19th century, and even then the usage is almost exclusively in the sense of the modern colloquial meaning, of “once in a blue moon,” or something that happens very rarely, if at all. And since time immemorial, mankind has had need for absurdist phrases to describe things that will seemingly never come to pass, like getting your money back from your cousin Tony. Now, whether or not Barlowe and Roy coined the term “blue moon” themselves or if they were just the first to commit it to writing is unknown. But there are many other such phrases that show up around the time, for instance, Nevermass, or “In the reign of Queen Dick.” One phrase that had particular staying power developed about a century later and was “Tibb’s Eve.” If you wanted to say that something was unlikely to happen, you said that it would happen on Tibb’s Eve. In the early 17th century, English plays started to feature a stock character named Tib who was a woman of loose morals that provided comic relief. To speak of Tibb’s Eve then was to imply that there would be a St. Tibb’s Day, which meant that there must be a St. Tibb, and hence that this wayward woman had become canonized as a saint. If a child asked when exactly was Tibb’s Eve, people would say that it was neither before nor after Christmas, or that it falls between the old and the new year. But these things have a funny way of leaping into reality. In the first part of the 20th century in Newfoundland and Labrador people in the province began to put Tibb’s Eve on a specific day, December 23. Although Tibb’s Eve was originally fictitious, it had always been associated with the Christmas season since Tib tended to show up in the plays that were popular around Christmastime. Historically, Advent, the four weeks before Christmas, was a time of penance, a sort of mini-Lent, so people often abstained from tipple. But as it began to look a lot like Christmas everywhere you went, waiting to break open the Christmas liquor just became unbearable, and Newfoundlanders used the excuse of Tibb’s Eve on December 23 to get into the Christmas spirit a little early. For the more learned, they would use the phrase “at the Greek calends” to speak of something that you shouldn’t bet would happen. I am pleased to say that if you’ve listened to Episode 24, you can now count yourself among this elect group, because in that episode we learned of the concept of the “calends” in the Roman calendar, which was the first day of the Roman month and literally meant “register of debts” since this is when payments on debts were due and is where we derive the word “calendar” today. But the Greek calendar had no calends, so “at the Greek calends” meant never. Well, the idea of a blue moon is not, in fact, quite as ridiculous a concept as Jerome Barlowe and William Roy may have thought when they put pen to paper. On rare occasions, typically after some volcano eruptions or wildfires, the moon can appear faintly blue on the sky. This was reported in 1883 after the eruption of Mt. Krakatoa, in 1927 after a monsoon in India, and in 1951 in Alberta after a wildfire, among other cases. The reason that this can happen is essentially the same physics that causes the sky to be blue, but in reverse. When you were in first grade and asked your teacher why the sky was blue, your teacher probably told you all about Maxwell’s equations and Rayleigh scattering. That was probably a while ago for most of you listening, so I’ll forgive you if you’ve forgotten the details, and as a refresher, the basic idea is that the atmosphere is full of particles, mostly molecules like diatomic nitrogen and oxygen, but also sulfates and larger particles. To first order, we can treat them all as little spheres of different sizes. As light from the Sun passes through the atmosphere, it interacts with these little spheres. Now, the wavelength of visible light is in the range of 400 to 700 nanometers or so whereas the molecules in the atmosphere are generally of order a nanometer or less, so the molecules are much smaller than the wavelength of the light. Under these conditions, the molecule basically sees the light that’s passing through it as a slowly varying electric field. As the electric field starts to build up in one direction, it generates a dipole moment in the molecule. So if the electric field from the light wave is pointing, say, to the right, then the electrons in the molecule will tend to bunch up on the left side of the molecule. As the light wave passes through the molecule and the electric field is now pointing to the left, the electrons will have tended to bunch up on the right side. So the passing light wave will generate an oscillation of the charge in the molecule, and an oscillating charge, of course, emits its own electromagnetic radiation. So even though the impinging light wave was travelling in one direction at first, after interacting with the molecule, there will now be a small component that is travelling in other directions as well, so there is a kind of scattering of the light wave going on. And specifically, we call this phenomenon Rayleigh scattering. Now, how strongly the light wave gets scattered will depend on a number of factors, but the most important are the size of the particle and the wavelength of the light. There will be an overall factor based on the radius of the particle squared, since this is just the geometric cross section of the particle, just the area of the particle in space as seen by the light wave. But there is another factor which is the ratio of the radius of the particle to the wavelength of light to the fourth power. In other words, if you have a light wave of some frequency, the larger the particle is, the more strongly it will scatter light. This makes sense because a bigger particle can create a larger dipole moment, and so it will radiate more as it oscillates. But we can turn this around — for a fixed particle size, shorter wavelengths of light will scatter more strongly, to the fourth power. So this is why, if the weather is good, the sky is blue. Blue light has a wavelength which is about half the wavelength of red light, so it scatters 16 times more strongly. Well, wait a second. Why is the sky blue and not violet? After all, violet has an even shorter wavelength, so shouldn’t it scatter the most and make the sky violet? The reason is that while the Sun produces light at all wavelengths across the visible spectrum, the peak of its spectrum is around green, and at shorter wavelengths the spectrum of the Sun gets exponentially cut off. In other words, at wavelengths somewhat shorter than green, as you go to even shorter wavelengths, the amount of light the Sun produces gets exponentially smaller. So sky blue turns out to be the sweet spot where it gets strongly scattered, but the Sun also produces a lot of light of that wavelength. So, or something like, is probably what your first grade teacher told you all those years ago when you asked why the sky is blue. But while Rayleigh scattering tells us what the sky looks like when the weather is good, it can’t tell us what the sky looks like when the weather is bad. Rayleigh scattering isn’t the whole story of how light interacts with molecules, it’s only valid if the particles are much smaller than the wavelengths of light. Rayleigh'''
