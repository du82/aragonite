title = "The Song of Urania Podcast"
description = "We turn to ancient Egypt, one of the oldest and most beguiling of the ancient civilizations. Egypt is particularly notable for the sheer conservatism of its civilization and changed little in more than two millennia. After a brief overview of its geography, history, and textual sources, we look at Egyptian conceptions of the creation, structure, and end of the universe."
full_description = "Episode 30: Egypt in a Nut-Shell June 5, 2023 We turn to ancient Egypt, one of the oldest and most beguiling of the ancient civilizations. Egypt is particularly notable for the sheer conservatism of its civilization and changed little in more than two millennia. After a brief overview of its geography, history, and textual sources, we look at Egyptian conceptions of the creation, structure, and end of the universe. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well this month I hope to make good on the promise I made to you, dear listeners, two months ago and start to look at the astronomy of one of the oldest and most beguiling civilizations of the ancient world — Ancient Egypt. Now I think it is fair to say that in recent years ancient Egypt has enjoyed something of a revitalization in appreciation for it by historians of astronomy. Or even maybe not so much a revitalization as just a vitalization. If I were making this podcast fifty years ago, I would not have too much to say on the topic. Historians of science would only bring up the astronomy of Egypt just to point out how little of it there was. One of the sources I’ve found tremendously useful in the past episodes on Babylonian and Greek astronomy is a book by Antonie Pannekoek from 1951 called A History of Astronomy. Pannekoek devoted some 75 pages of his 500 page book to Greek astronomy and about 60 pages to Babylonian astronomy. But when it came to Egyptian astronomy he fit everything he had to say on the subject in under three pages. And to really twist the knife he concludes this chapter with the line, “Egypt can show us how little a science of the stars is fostered even by an ever brilliant sky unless that science finds a practical basis in human life and activity.” One of the great historians of astronomy, Otto Neugebauer, whom I’ve mentioned several times over the course of this podcast put it a bit more bluntly and in the late 60s wrote, “Astronomy played a uniformly insignificant role in all periods of Egyptian history.” Today I think it is fair to say that the scholarship on Egyptian astronomy is still rather limited compared to the scale and historical influence of Egyptian civilization, but the greater appreciation that modern historians of astronomy have for Egypt can be attributed to two things. The first is just that Egypt, despite being one of the great civilizations of antiquity, is relatively inaccessible compared to, say, the artifacts left behind by ancient Greece, and as the decades passed, historians have uncovered more and more of the depth of Egyptian astronomy. The other factor is that over the past few decades the umbrella of historical astronomy has broadened somewhat and historians of astronomy have developed interests in topics that were ignored by earlier historians. To earlier generations of historians like Neugebauer and Pannekoek, ancient astronomy was practically synonymous with keeping a calendar and observing and modeling the planetary motions. Naturally, when viewed from this lens, the only ancient civilizations with an astronomy to speak of were the ancient Babylonians and Greeks. And, to be fair, in the overall historical development of astronomy to its modern-day form, modeling planetary motions played an unrivaled role. So these aspects of astronomy really were especially critical in the development of the field. But historians of astronomy today are not only interested in those developments in astronomy where we can draw a more or less straight line from antiquity to the present day. They are also interested in an astronomy understood in a culture’s own terms, not just bits and pieces of it that later cultures found corresponded with their own interests. So today we might spend more effort understanding things like the culture’s cosmological structure, how they read the skies, whether any individuals specialized in watching the skies, and if so, what precisely they were looking for. So if we limit our astronomy to the motion of the planets and maybe the basics of the calendar we can say everything we need to say in three pages flat like Antonie Pannekoek did. But with a broader understanding of astronomy there’s enough material in ancient Egypt to fill a 600 page book, as Juan Belmonte and José Lull recently did. Well, before we can really get into the astronomy proper, broadly defined or not, it would be good to get better acquainted with the broader cultural and historical context of ancient Egypt. Now if you have been listening to the podcast for some time, you may have noticed by now that I tend to be partial to the idea that civilizations are shaped by the geography that they inhabit, and so I like to spend a bit of time describing that geography and how it may have influenced that civilization’s history. Well, nowhere is this more true than in ancient Egypt, whose culture and activities were all molded by the central feature of Egyptian geography: the Nile. Almost all the inhabited territory of ancient Egypt was a narrow strip of land along the Nile and a fan of marshy territory at the Nile delta, the few exceptions being five oases to the west, the most important of which was the Kharga Oasis. This valley along the Nile is not very wide at all, it’s only 12 miles across at the widest point. But it is long. The Nile is the longest river in Africa, and close to being the longest river in the world as well, just a bit shorter than the Amazon. Egypt was only ever in control of the parts of the river farthest downstream, but that was still enough territory to make it a formidable civilization of the ancient world. There are a couple of major sets of landmarks along the Nile that demarcate the major political boundaries. Starting at the mouth of the river into the Mediterranean and working our way upstream, the first of these is the Nile delta, where the river splinters into a fan of distributaries that empty into the Mediterranean Sea. The first major split produces the Damietta distributary to the east and the Rosetta distributary to the west, Damietta and Rosetta also being the port cities on the Mediterranean that these distributaries empty out to. The location where the Nile first split into the Rosetta and Damietta and the Nile delta began was an extremely important point in the geography of Egypt. One of the main capitals of ancient Egypt, the city of Memphis, sat just upstream of this location, as does the modern capital of Egypt, Cairo. And this was also roughly the location of Heliopolis, one of the most important religious complexes in ancient Egypt. This point also marked the division between the two main regions of ancient Egypt: upper Egypt and lower Egypt. Upper Egypt referred to the region upstream of the Nile and was topographically higher than Lower Egypt, which consisted of the Nile delta. So if you look at it on an ordinary map with north pointing up you’ll find that upper Egypt is below lower Egypt. The second major set of landmarks are called the six cataracts of the Nile. The cataracts are points where the Nile is shallower and the flow of the river is interrupted by boulders to produce whitewater rapids. These cataracts impede navigation by boat and form natural boundaries along the Nile, so the traditional southernmost border for upper Egypt was at the first cataract, at the city of Aswan, about 500 miles away from the Mediterranean. South of the first cataract was a region called Nubia that was occupied by several empires over the centuries, the most powerful of which was the Kingdom of Kush. Nubia extended south to the final landmark along the Nile at the modern day city of Khartoum, where the Nile splits into two major tributaries, the Blue Nile, which meanders to the east and the White Nile, which continues to travel largely south. These two tributaries get their names from the colors of the water — the White Nile carries a larger amount of sediment which makes it appear lighter in color, whereas the water carried by the Blue Nile is clearer. The White Nile ultimately finds its source some 2300 miles south at Lake Victoria, although hairsplitters will point out that actually the source of the White Nile is a downstream lake, Lake No, since the Nile then splits into two, the Bahr al Jabal and Bahr el Ghazel rivers, which later join up again at Lake Victoria. But for the history of ancient Egypt, the Blue Nile was far more important, though the Egyptians probably weren’t directly aware of it. I mentioned in the last episode that the eastern half of the African continent is geologically younger and at higher elevations, and the place where this is most pronounced is in northern and central Ethiopia, which forms the Ethiopian highlands. Here, being at high elevation and not too far from the Indian Ocean, the highlands catch the weather patterns from the Indian Ocean, and in particular are subject to the summer monsoons of the Asia-Australian weather system. Consequently, starting in June or so, the highlands begin to receive a tremendous amount of precipitation that lasts through the summer until about September. Much of this precipitation is carried away by the Blue Nile and downstream this causes the Nile to flood every year. This annual flooding was the central event of the Egyptian year and was what the entire agricultural system, and by extension the entire culture, depended on. After all, Egypt gets very little rain. It is not unusual for the southern parts of Upper Egypt to go a full decade without seeing any rain at all. But the annual floods of the Nile would form a marsh along the valley bed that would soak the soil. Once the floodwaters had receded, the soil would retain enough moisture to permit crops to grow without any rainfall being necessary. Because the Egyptians depended critically on the floodwaters from the Nile for their food, sophisticated irrigation and floodwater management was of paramount importance for the civilization and seems to have been what drove the development of the Egyptian state in the first place. The region had been sparsely inhabited by hunter-gatherers since the paleolithic, but the main spur to development seems to have started around 6000 BC, when the Sahara began to transform from grasslands to a desert. The increasing desiccation of the Sahara forced more and more people into the Nile valley who then turned from a nomadic hunter-gatherer lifestyle to a sedentary agricultural lifestyle, perhaps out of necessity due to the limited space, or perhaps because it was simply more convenient. Either way, around 3600 BC the inhabitants of the Nile valley were subsisting on domesticated crops and animals, and over the next few centuries the increasing population density necessitated larger scale organization to handle the periodic flooding from the Nile. As in other parts of the world, this seems to have begun with the development of city-states, but the period of independent city-states was relatively short-lived in Egypt. Fairly rapidly, neighboring city-states coalesced into three kingdoms in Upper Egypt, and one in Lower Egypt, and by about 3200 BC the three kingdoms of Upper Egypt had coalesced into a single kingdom as well. The official start of ancient Egypt, though, is taken to be around 3150 BC when, at least according to Egyptian tradition, the king of Upper Egypt, named Menes, succeeded in conquering Lower Egypt and managed to unify Egypt into a single political entity. Now over the centuries Menes became more legendary than historical. He became a divine figure in Egyptian mythology but some king from Upper Egypt did indeed conquer Lower Egypt, and modern historians believe that it was probably a king named Narmer. Nevertheless, we can see the importance that managing the annual flooding had for the state from the fact that the earliest depiction of King Menes shows him building an irrigation canal. But even after this unification by the legendary King Menes, Upper Egypt and Lower retained a nominal sense of independent identities. For about a millennium after its unification, the Pharaoh would wear two crowns to represent the separate kingdoms of Upper and Lower Egypt, and when the Pharaoh died he would be buried twice, once in Upper Egypt and then again in Lower Egypt. And as an aside here, using the word Pharaoh to describe these ancient kings is common, but strictly speaking is something of an anachronism. During this early period, the word “pharaoh” referred to the court and palace where the king ruled from, rather than the man himself. It’s only after a millennium or so that the word pharaoh came to be identified with the person of the king. But it’s such a nice word that most people tend to use it to refer to the Egyptian king throughout all periods of Egyptian history, and that’s what I’m going to do. Now, traditionally, the history of ancient Egypt as a unified, independent state is divided into three main periods called the Old Kingdom, the Middle Kingdom, and the New Kingdom, and these three periods are interspersed with two so-called Intermediate periods, each about a century or two long, which were more chaotic times when the Egyptian state fragmented either from internal or external forces. Now, it’s worth pointing out at this stage that the history and culture of ancient Egypt, including its astronomy, is almost exclusively a culture of the elites. Relative to other ancient civilizations, Egypt was extremely centralized. Part of the reason for this was that Egypt never had a long tradition of strong, independent city-states in the same way that Mesopotamia, or especially Greece did. Many of the Egyptian cities were either little more than glorified markets where commoners would occasionally coalesce to buy and sell things they needed, or, in the case of the capitals, essentially large palace complexes. True urban environments were not a large part of the Egyptian culture. Egyptian society was characterized first and foremost by the pharaoh and then his court of officials and priests. Below them was a vast mass of peasants who factor very little into any of the surviving artifacts of Egyptian culture, apart from the obvious fact that it was their hands that built Egypt’s great monuments. Because of this, the surviving artifacts we have really only give us a view into Egyptian society from the perspective of the elite. We can see this bias, for instance, in these so-called Intermediate periods, which histories of Egypt will normally characterize as being chaotic periods that produced little culture. And indeed it was so for the Egyptian elite. But some fragments suggest that the common people may have viewed things a little differently. One author writing during the First Intermediate Period commented that after the disintegration of the unified Egyptian state, “the high born are ful"
