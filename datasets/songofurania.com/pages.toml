title = "The Song of Urania Podcast"
description = "This month the full moon falls on Three Kings' Day, traditionally a day that celebrates the adoration of the magi, so we investigate the famous Star of Bethlehem story. Through the centuries there have been dozens of astronomical and astrological theories put forward as to what the Star of Bethlehem was. We look at a few of the more prominent theories and their shortcomings, finishing with what is plausibly the leading candidate, the astrological theory of Michael Molnar, though as we'll see, this explanation, too, is not without its problems."
full_description = "Episode 25: The Stars of Bethlehem January 6, 2023 This month the full moon falls on Three Kings' Day, traditionally a day that celebrates the adoration of the magi, so we investigate the famous Star of Bethlehem story. Through the centuries there have been dozens of astronomical and astrological theories put forward as to what the Star of Bethlehem was. We look at a few of the more prominent theories and their shortcomings, finishing with what is plausibly the leading candidate, the astrological theory of Michael Molnar, though as we'll see, this explanation, too, is not without its problems. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well this month the full moon happens to fall on January 6, which in the Roman Catholic Church is a holiday called Epiphany, but is sometimes colloquially referred to as Three Kings’ Day. These days Three Kings’ Day isn’t such a big holiday in the United States. Of course Catholics continue to observe it, but there isn’t much of a hullabaloo in the broader culture in the way there is for, say, Christmas. But throughout much of Latin America Three Kings’ Days is still just as big a holiday as Christmas. And even in the Anglosphere, back in the days of yore it was a much bigger holiday than it is today. Shakespeare wrote his play Twelfth Night as entertainment for the eve of the holiday, which is, not by coincidence, also called Twelfth Night. In fact, if you’ve ever wondered about that song that enumerates the twelve gifts for the twelve days of Christmas, in the Catholic liturgical calendar there is a period called Christmastide, which begins on Christmas Day and lasts twelve days, ending on January 6, or Three Kings’ Day, which commemorates the adoration of Jesus by the Magi. But historically the popularity of the holiday probably had more to do with the fact that Three Kings’ Day was your last chance to get in your Christmas fun before Christmas was officially over and you had to wait a whole other year for it to come around again. At any rate, seeing as how today is Three Kings’ Day and in the last episode we talked about Roman astronomy up until around the turn of the millennium, it’s as good a time as any to talk about a rather unusual astronomical reference in the ancient literature that appears in the Roman Empire around this time — the so-called Star of Bethlehem that marks the birth of Jesus. Now if there are any fellow astronomers listening to this who do planetarium shows, you’ll know that it’s obligatory to at least say something about the Star of Bethlehem in any show during December no matter how little one has to say on the subject. And so the Star of Bethlehem story has acquired the unfortunate acronym the SOB story. But I can assure you that I found working on this episode to be a delight, just as with any other episode. So this month I’ll walk through the documentary evidence we have for this story, and then go through the various hypotheses that have been proposed over the centuries to explain it. Now just as a warning, this episode is somewhat fraught in a way that earlier episodes haven’t been. When I was talking about the astronomical diaries of the Babylonians or the planetary theories of Eudoxus, I’d like to think that the subjects were interesting at least from an intellectual standpoint, but, let’s be honest, at the end of the day, no one really cares. No one is going to get up in arms, literally or figuratively, about how to correctly interpret the Enuma Anu Enlil. But when we’re talking about the Star of Bethlehem, we’re now relying on texts which are today taken to be Holy Scripture by around one billion people, and that naturally invites a lot of strong opinions. And these come on both sides, from biblical fundamentalists who insist that every word of the Bible is literally true, but also from more militant atheists who assert that anything written in the Bible can be automatically dismissed as a fairy tale. But, regardless of your religious convictions, the Biblical texts are historical documents — maybe not historical documents quite like any other, though of course every document is unique in its own way. But just as with any historical document, it was written by a particular author in a particular place at a particular point in time and for a particular audience. If we understand that context we can hopefully understand which details in the narrative are more likely to have been real historical events, and which are less likely. And in the interest of full transparency on this topic, I’ll mention that I am a practicing Catholic, so take that for what it’s worth when assessing what I have to say about the topic. But needless to say, there has been a lot of flimflam written about this subject so we have to be careful when assessing sources. Now there are four main texts which describe the life of Jesus, known collectively as the Gospels. One is attributed to St. Matthew, one to St. Mark, one to St. Luke, and one to St. John. Now, in all four gospels the primary focus of the text is on the torture and crucifixion of Jesus and his subsequent resurrection, so much so that the gospels are sometimes described as passion narratives with long introductions. Only two of them deal with Jesus’s infancy at all, the Gospels of Luke and Matthew, and both are relatively brief on the subject. Of these two, only the Gospel of Matthew describes the Star of Bethlehem. As I’ll get to later, the infancy narratives of Matthew and Luke are fairly complementary though in certain parts contradictory, and resolving these contradictions has bedevilled Christian scholars down the centuries. Now today you can walk into any bookstore and choose from dozens of Bibles or go to thousands upon thousands of websites to read the Gospels in hundreds of different translations, from the old school Douay-Rheims or King James versions up to the Message, which translated the Bible into 1990s era American slang. But the ease with which you can look up any verse from any book of the Bible belies the fuzziness of the underlying texts. You’ll remember when I was talking about Greek astronomy, particularly early Greek astronomy, there was a tremendous difficulty in understanding what anyone thought because virtually all of the original texts had been lost. In the case of the Gospels we aren’t in quite as dire a situation, relatively speaking, but the word relatively there is doing a lot of work. The unfortunate problem we have with the Gospels is that, although they are among the most important texts in Western civilization, the original texts do not survive. Nor do copies of the original texts survive. Nor do copies of copies of the original texts survive. It’s believed that the earliest surviving manuscripts are third order copies, that is, copies of copies of copies of the original, and were written at least a century after the originals, and even these are pretty fragmentary. Now this might not be a huge problem on its own, but unfortunately the copies were not perfect and so there is quite a lot of variation between the oldest versions, and this has led to a tremendous effort on the part of Biblical scholars to try to reconcile these differences. After all, if you are to believe that the Gospel represents the inerrant word of God, it is rather important that you figure out what exactly the text says. Now it should be pointed out that while a lot of us would find this to be a rather self-evident proposition, this kind of obsessing over discrepancies between various manuscripts is in fact more of a modern concern. Up until the 17th century or so no one seems to have been much bothered by the discrepancies in the various Gospel manuscripts. For centuries, Bibles were produced by hand, almost exclusively by monks in monasteries. They would take an existing manuscript they had on hand and copy it out to make a second. Every now and again they’d make mistakes, but the copy would be a fairly close reproduction of whatever the original manuscript was. But this process was time consuming and expensive so Bibles were rare, and it was hard to get a whole bunch of manuscripts together to systematically assess their differences. But with the development of the printing press in the 15th century, Bibles started to be produced in much larger quantities. Initially, publishers would basically follow the same procedure that monks did, just at a larger scale. They’d take an existing manuscript, typeset it, and then make a bunch of copies. But in the 17th century, the Church of England commissioned the King James Bible, which was meant to be an authoritative translation of the Bible into English from the original sources, rather than from the Latin Vulgate which St. Jerome had produced back in the 4th century. But to come up with an authoritative version they had to make choices about what to print when the manuscripts disagreed with each other. Now the scholars working on the King James version were on a timeline so they had to make their choices quickly, but later in the century scholars like John Mill started to systematically try to assess the differences between the hundreds of known manuscripts. Now the vast majority of the time these differences were minor. Sometimes you see manuscripts where the order of two words has been swapped, but it doesn’t change the meaning of the sentence, or other times there’s an obvious misspelling. But even then, there is, one apparent misspelling that has had a rather outsized impact. You may have heard the famous line from Matthew 19:24 in which Jesus says that “it is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.” The Greek word for camel is kamêlos. But it’s believed that this verse is actually a misspelling in the early manuscripts of the word kamilos, where the e has been substituted for an i, and which means a thick rope or cable like you’d use to anchor a ship, and that makes a lot more sense in context. But the image of a camel trying to walk through the eye of a needle is just so vivid that it seems to have stuck. Now again, the vast majority of discrepancies are minor, but there are still a couple of places where they would seem to be a pretty honking big deal. One of the better known scenes in the whole of the gospels is of Jesus with the woman caught in adultery which appears in the Gospel of John. The Pharisees bring the woman before Him and ask what should be done with her. The Mosaic law says that she must be stoned. Will Jesus condemn the woman to death, or will He contradict the law of Moses? Instead Jesus wriggles His way out of the trap and says to let he who is without sin cast the first stone. But popular though the story is, it did not appear in the original Gospel of John, it seems to have been accreted onto it a few centuries later. At any rate, all this is to say that the texts of the Gospels, and indeed the rest of the Bible, are somewhat more fluid than we might otherwise believe. And the infancy narrative in Matthew where the story of the Star of Bethlehem appears is no exception. Well, bearing all that in mind it’s probably best if I just read the relevant passage from the Gospel of Matthew that describes the mysterious star. In past episodes when I’ve had occasion to quote from the Bible I’ve generally used the more poetic Douay-Rheims version, but given that the Douay-Rheims version was written in the early 17th century, it can be a little hard to understand and being a fairly literal translation of the Latin Vulgate, it has some translation issues to boot. So I’ll use the Revised Standard Version Catholic Edition instead. So, here goes: Now when Jesus was born in Bethlehem of Judea in the days of Herod the king, behold, wise men from the East came to Jerusalem, saying, “Where is he who has been born king of the Jews? For we have seen his star in the East, and have come to worship him.” When Herod the king heard this, he was troubled, and all Jerusalem with him; and assembling all the chief priests and scribes of the people, he inquired of them where the Christ was to be born. They told him, “In Bethlehem of Judea; for so it is written by the prophet: ‘And you, O Bethlehem, in the land of Judah, are by no means least among the rulers of Judah; for from you shall come a ruler who will govern my people Israel.’” Then Herod summoned the wise men secretly and ascertained from them what time the star appeared; and he sent them to Bethlehem, saying, “Go and search diligently for the child, and when you have found him bring me word, that I too may come and worship him.” When they had heard the king they went their way; and lo, the star which they had seen in the East went before them, till it came to rest over the place where the child was. When they saw the star, they rejoiced exceedingly with great joy; and going into the house they saw the child with Mary his mother, and they fell down and worshiped him. Then, opening their treasures, they offered him gifts, gold and frankincense and myrrh. And being warned in a dream not to return to Herod, they departed to their own country by another way. Now this is not the only ancient account of the Star of Bethlehem. Although it doesn’t appear in any of the other canonical texts of the Bible, there are also dozens and dozens of Christian texts written in the centuries after Jesus which purported to be scripture, but which did not make it into the canonical Bible. These texts are generically referred to as apocrypha. Many of these texts had a particular theological axe to grind and were closely associated with sects like the gnostics that were later deemed heretical by the orthodox church. Others had no particular theological issues, but were rejected essentially because they were written by randos. The Church limited the canonical texts of the New Testament either to texts written by the apostles themselves, or by authors who were closely associated with one of the apostles. So the authorship of the Gospel of Matthew is, of course, traditionally attributed to the apostle Matthew, although modern scholars believe that Matthew himself did not write the text and that the author was an anonymous 1st century Jew. Although Luke was not an apostle he was a companion of St. Paul who was, so his text is effectively coming from Paul and made the cut. At any rate there is another text called the Gospel of James which did not make it into the Biblical canon. Naturally it was attributed to the apostle James, but scholars of the early Church were not having it and decided that its authorship was inauthentic and they didn’t include it when they were compiling the Bible in the 4th century. Nevertheless, Christians of all centuries have been intensely interested in what the early life of Jesus was like, but the canonic"
