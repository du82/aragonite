full_description = "Episode 6: System of a B June 24, 2021 We dive into the most sophisticated model of planetary and lunar motions that the Babylonians developed: System A and System B and see how the Babylonians used this method to predict eclipses, the length of months, and even measure the precession of the perihelion. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy with new episodes every full moon. My name is Joe Antognini. We’ve been diving into the history of Babylonian astronomy for the last few episodes and have more or less traced its development from the earliest records we have from around 2000 BC to the much more numerous records that appear in the last five or so centuries BC. But I have held off on describing the pinnacle of Babylonian astronomy, two techniques today called System A and System B. But no more. It is high time we dive into the best that the Babylonians have to offer us. To reorient ourselves in the broader history of the Near East, after centuries under the rule of the Assyrians, in the late 600s BC, Babylonia had finally regained its independence and formed what is today called the Neo-Babylonian Empire, to distinguish it from earlier Babylonian empires prior to the conquest of the Assyrians. The fortunes of the Babylonians turned very quickly as they went from centuries of subjugation to conquering most of the land in the fertile crescent within just a few decades. At this time the city of Babylon was a center of trade in the region and very wealthy. In fact, the prophet Ezekiel describes the conquest of Judea by the Babylonians and the exile of the Jews in metaphorical terms. He writes of a great eagle who came to Lebanon and broke off twigs from the top of a cedar and carried them to land of trade and set in a city of many merchants. The eagle was long a symbol of Babylonia, and the land of trade and city of merchants was none other than the city of Babylon. But as another biblical author writes, those who live by the sword die by the sword, and the Neo-Babylonian empire fell to the Persian empire of Cyril the Great in 539 BC, and the Babylonians never regained independence after that. But while the Persian conquest was a disaster for Babylonian self-rule, it wasn’t so bad for astronomy. Babylonian astronomy really thrived during the period under Persian rule. It is in this period that Systems A and B develop. As we discussed in episode 4, there were a number of different types of astronomical tablets that appear in Babylonian history: astronomical diaries, astronomical omens, goal year texts, and so on. But the most sophisticated of these are the tables that calculate ephemerides for the locations of the planets, moon, and the Sun using System A and System B. It is a little unclear when Systems A and B were originally developed. It’s actually not known with certainty which of the two came first. System A is a little simpler so it’s usually assumed that it was developed first, but the earliest tablets with System A appear later than the earliest tablets with System B. But the evidence suggests that these two methods of calculating planetary positions show up around 400 BC. Now the Babylonian astronomers were mostly anonymous. The one main exception was the letters astronomers wrote to the king interpreting astronomical omens, which could be signed. And I mentioned in episode 4 the astronomer Berossus who recorded the story of the Persian conquest of Babylonia. Berossus is known today for the historical texts he wrote around the early 200s BC, but in his day he was known as an astronomer. Unfortunately none of his astronomical works survive, only the historical texts. But one of the few other Babylonian astronomers whose name we know is an astronomer by the name of Kidinnu who lived during the 4th century BC. According to later texts, Kidinnu was recognized as the inventor of System A and System B. Kidinnu is a bit of a quasi-mythical figure, probably a real person, but also shrouded in a bit of legend. In this way he is a somewhat like the Greek poet Homer — just as there probably was some Greek poet by the name of Homer, there probably also was some Babylonian astronomer by the name of Kidinnu, but just as it’s hard to say whether this poet named Homer wrote everything that was later attributed to him like the Iliad and Odyssey, it is hard to say whether or not Kidinnu himself developed everything that was later attributed to him. Unfortunately nearly all the surviving texts that mention him were written centuries later and many of them were written by Greek astronomers. The only apparently contemporaneous mention of Kidinnu was an astronomical diary which mentions that someone named “Kidinnu” was “killed by the sword” on a date which works out to be the 14th of August 330 BC, less than a year after Alexander the Great took Babylon from the Persians. So what did Kidinnu do, according to this tradition? Well when we started talking about Babylonian astronomy I described the essential problem of Babylonian civilization as being how to figure out how long a month is and how many of them there are in a year since each month starts when you first see a crescent after the new moon, but the length of each month is variable, and the length of the month does not neatly divide the length of a year. Along the way, the Babylonians created a bunch of new problems for themselves like when lunar eclipses happen and where the planets will be. System A and System B solved all these problems. In order to start getting into this, we’ll begin with the planetary predictions since they’re somewhat simpler than the lunar predictions. Now you may remember that the Babylonians weren’t really interested in where the planets were in general. Today when we make planetary predictions, we generally want to know where a planet will be at some particular time. But the Babylonians only cared about knowing when and where certain special events occurred like opposition or the first stationary point, when the planet entered into retrograde motion. Now, specifying when this will happen is easy. You just need to say what day it happens on. Calculating that day might be difficult, but what it is you want to calculate is pretty straightforward. In fact, because the period of planetary motion is so long, it’s actually fairly hard to measure the time that something like the first stationary point occurs to within a day. You are basically trying to observe, by eye, when the location of a planet stops drifting eastward and starts drifting westward. But when the planet is close to its stationary point it’s hardly moving at all, so this is a very difficult measurement to make. Centuries later Ptolemy complained about the Babylonian predilection with only recording these special events in a planet’s orbit because it’s hard to measure exactly when they occur. In fact today we can go back through Babylonian records and determine that Babylonian observations of these events tended to be biased slightly early. So measuring when these events occurred was tricky, but what it was that you wanted to measure, namely the date, was obvious. But you also want to know where the event occurred. And how do you measure that? For this you need a coordinate system. You need some way to connect a location on the sky with a pair of numbers. Now the simplest coordinate for the sky is what is called the system of altitude and azimuth, or an alt-az coordinate system for short. Here if you want to record the position of a planet on the sky, you measure its altitude as the angle above the horizon that the planet makes. And the azimuth is the angle the star makes relative to north. The advantage of the alt-az system is that it’s really easy to measure the altitude and azimuth of a planet or star and if someone tells you that there’s something spectacular going on at some altitude and azimuth, it’s also really easy to figure out where in the sky to look. But the alt-az system has a big problem. Because the altitude and azimuth of a planet or star is not constant. Every night, stars rise in the east, culminate across the meridian, and then set in the west before doing the same thing all over again the next night. Well when the star rises in the east, its altitude is 0 degrees because it’s on the horizon. Then it will climb in the sky and its altitude will increase and its azimuth increase until it crosses the meridian, at which point its altitude starts decreasing while its azimuth continues to increase. So if you want to record the altitude and azimuth of a star or planet, it really only tells you anything useful right now. After a few hours those numbers will be completely different. So the system of altitude and azimuth has some conveniences, but also has some major shortcomings as well. But there is an alternative that avoids these problems. For any astronomers listening to this show, you probably already have a guess as to what this alternative is — the famous system of right ascension and declination. But you would be wrong. The system of right ascension and declination is a relatively modern innovation and was unknown in the ancient world. If you don’t know what right ascension and declination are that’s okay — I’ll describe it in detail when it first appears in the history of astronomy in the 18th century. But at the rate we’re going, that will be many moons from now. So check back in maybe the year 2031 when we finally get to Enlightenment era astronomy. Instead the system that the Babylonians developed is the system of ecliptic latitude and longitude. The idea here is that rather than reference the location of a star or planet with respect to the horizon, since that location is constantly changing, we’ll reference the location of the star or planet with respect to other stars on the sky. Since the stars themselves are fixed and the planets change their locations only very slowly, this gives us a way of saying where a star is that’s much less dependent on the exact time you made the measurement. And, to be complete, it also doesn’t depend on your exact location on Earth, although this wasn’t so much of an issue for the Babylonians since they pretty much did all of their astronomy from one location, namely Babylon. Okay, so we want to reference the location of a star relative to other stars on the sky. Now how do we do that? The system that the Babylonians used was to pick out the ecliptic as being a special point of reference on the sky. Remember that the ecliptic is the path that the Sun traces out against the background stars over the course of a year. Then they measured how high a star or planet was above the ecliptic, called the ecliptic latitude, and, if you went down to the ecliptic, where the star or planet was along the ecliptic. In other words, what constellation of the zodiac was the object in and where would it be in that constellation if you did that projection. This is a very convenient coordinate system for measuring the locations of the planets because all the planets move very close to the ecliptic. They only wander a few degrees away from the ecliptic. The Moon gets the farthest, but even the Moon never gets more than about five degrees away from the ecliptic. So most of the motion of the planets is along ecliptic longitude, with some small variation in ecliptic latitude superimposed on the longitudinal motion. So, to put this all together, the location of a star or planet could be given by the ecliptic latitude, which was the angle above the ecliptic, and the ecliptic longitude, which was how far along the ecliptic it was. The ecliptic latitude was just measured in degrees, but the ecliptic longitude was a little different. The Babylonians divided the ecliptic into twelve signs of the zodiac, each sign being 30 degrees across. Then to specify the ecliptic longitude of an object they would just say which sign the object was in, and how many degrees the object was from the beginning of the sign from 0 to 30. Based on the accuracy of the measurements of the Babylonian astronomers it seems likely that they weren’t doing it by eye and that they must have had some sort of equipment to help them measure these angles accurately. But unfortunately, as with so much else in the ancient world, none of these instruments survive and they made no records of these instruments in any of the tablets we have today. So we don’t know exactly how these measurements were taken. Okay, so we now have a coordinate system where we can nicely represent the positions of the planets at different points in time. Let’s now start by taking a look at how the Babylonians would use System A to calculate, say, the time and location when Jupiter would be at opposition. In the completed tablet there would be one column with a set of years and a second column with a set of months and days. Now these days weren’t actual days, but a sort of formal astronomical day called a “tithi”, which was defined to be exactly equal to 1/30 of a month to make the calculations easier. But this formal tithi was always within half a day of some real day that could be computed later, taking into account which months had 30 days and which had 29 days and which years had extra months and all the rest. In between these two columns there was another column that had the difference in time from one opposition to the next, though by convention they subtracted off one year from this. This is because the period of opposition for a planet like Jupiter is always about a year and a bit, so to save space they just wrote down the extra bit. Finally, in a fourth column, they listed the longitude opposition would occur at. So how did they figure out these values? The key is to look at how the longitudes change over time. By this point the Babylonians had realized that the planets don’t always move at the same velocity. Sometimes they move faster relative to the background stars and other times slower. If you just assumed that the planet Jupiter moved the same amount from one year to the next, you would find that your predictions for when opposition would be would be systematically too early and other times systematically too late. The modern day explanation for this is that Jupiter’s orbit is elliptical. Not very elliptical, but elliptical enough that when it is closest to the Sun at perihelion, it moves noticeably faster than when it is farthest from the Sun at aphelion. If Jupiter is passing through perihelion and is moving quickly, it will take longer to reach opposition because the Earth will need to move further to catch up. But if Jupiter is passing through aphelion and is moving slowly, it won’t take as long to reach opposition because it hasn’t moved as far. So what the Babylonians did is break the ecliptic into two arcs: a fast arc and a slow arc. If Jupiter was in the fast arc, they would add 36 degrees to the previous longitude of opposition to determine"
