description = "Aboriginal Australian societies are believed to be among the oldest continuous cultures on the planet. Some of their oral traditions appear to preserve a cultural memory of celestial events from multiple millennia in the past. Aboriginal Australians were also keen observers of the heavens and recognized phenomena both common and rare, from the solstices, to solar eclipses, to auroral sounds, and stellar variability."
full_description = "Episode 45: Looking Up Down Under August 23, 2024 Aboriginal Australian societies are believed to be among the oldest continuous cultures on the planet. Some of their oral traditions appear to preserve a cultural memory of celestial events from multiple millennia in the past. Aboriginal Australians were also keen observers of the heavens and recognized phenomena both common and rare, from the solstices, to solar eclipses, to auroral sounds, and stellar variability. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Last month we at long last wrapped up our tour of Chinese astronomy so it’s now time to turn elsewhere. Now, I am afraid that I am going to do something of a disservice to the rest of east Asia because there have been many cultures besides China in the region that have a long history of astronomy: Japan, Korea, Vietnam, Thailand, and others besides. And in fact I’ve already had occasion to briefly mention Japanese astronomy in connection with some of the supernova records in Episode 39. But while these cultures have all had their unique astronomical traditions, due to their proximity to their much more powerful neighbor, these traditions were heavily influenced by Chinese astronomy. And given that the tagline of this podcast promises that it will be a history up until the present day, I’m going to have to cut a few corners if we’re going to reach the present millennium before this century is out. So this month I wanted to move on to a region with a very distinct astronomical tradition — that of Oceania. Oceania is, of course, a gigantic region, encompassing Australia, Melanesia, Micronesia, and Polynesia. So in this episode we will focus on the largest landmass in the region: Australia. But even here, much like Episode 29 on the astronomy of Subsaharan Africa, the treatment is necessarily going to be somewhat impressionistic. Australia is home to hundreds of different Aboriginal groups, all of which have their own unique astronomical traditions, and most of these have not been documented by Western scholarship. And even among those groups whose astronomy has been documented have generally only had a small fraction of their tradition has been written down. So I’ll have to give the disclaimer that this can by no means be a comprehensive treatment. Well, as longtime listeners will know I always like to start our exploration of the astronomy of a new culture by looking at the underlying geography since the geography invariably influences where and how its inhabitants live. Australia may be the world’s smallest continent, but it is nevertheless still an entire continent and it has a diversity of climates. Geologically Australia is fairly unique in that much of it is quite old. The western half of the continent is a feature known in geology as a “shield,” which is an extensive area where molten rock cooled and solidified. This part of the continent formed more than two billion years ago and among the oldest known rocks are found in this area. Due to this feature the western half of Australia is fairly flat. The elevation is generally highest near the western coast and then gradually falls off towards the center of the continent. The western sliver along the coast around the city of Perth has a Mediterranean climate, but as you move inland the climate quickly transitions to desert. Without any mountains to break up airflow and trigger precipitation, the center of the continent gets very little rain. The different regions have different characteristics and so get different names like the Gibson Desert, the Tanami Desert, the Simpson Desert, the Great Victoria Desert and so on, but collectively they form the Central Australia Deserts. These deserts support very little human habitation. Although the various deserts make up some three quarters of Australia by land, fewer than five percent of the population resides there. But as we’ll see later, these areas have all been continuously inhabited by Aboriginal Australians. As you start to get to the eastern end of the continent you run into the Great Dividing Range, where the relatively flat topography from the shield gets broken up a younger geology with mountains and hills. These then can collect precipitation and feed the river systems in the east of the country. Because of this geology most of Australia’s present day population is along its eastern and southeastern coast. These mountainous features are most prominent in the very southeast of the country with a mountain range called the Australian Alps. And just south of that, across a body of water called the Bass Strait, is the island of Tasmania, which is the most temperate part of Australia. The north of the country starts to get into tropical latitudes. And around the northeast of Australia there is a peninsula called Cape York which reaches up into the Torres Strait across from which, less than a hundred miles away, is Papua New Guinea. The Torres Strait is dotted with nearly three hundred islands. This region of Australia is impacted by a monsoon system which hits Indonesia and Papua New Guinea and receives by far the most rainfall in Australia. For this reason this region has historically had the largest population of Aboriginal Australians. So, to sum it all up, Australia pretty much has it all, deserts, rainforests, temperate coastal plains, mountains, you name it, but the vast majority of the area is quite inhospitable. Nevertheless, Aboriginal Australians have lived in all corners of the continent and have had to adapt to these radically different climates. The first Aboriginal Australians arrived in Australia very early on. Genetic studies indicate that their ancestors left Africa perhaps around 75,000 years ago and arrived in Australia around 60,000 years ago. Though, to be precise, this was long enough ago that when they arrived the continent of Australia as we know it did not exist. This was in the midst of the Last Glacial Period, or more informally, the Ice Age. At the time that the Aboriginal Australians began to populate what is today Australia, sea levels were around 110 meters lower than at present day. To put this in context, the worst case projection for sea level rise due to climate change by 2100 is around two meters. So the coastlines in low lying areas looked very different then than it does today. In particular, at the time Australia and New Guinea were not separated by water, nor was Tasmania. They instead formed a continuous landmass called Sahul. Similarly, many of the islands of Indonesia were connected by land to Asia and they formed a landmass Sunda. The lower sea level made migration from the Asian mainland across the islands that today make up Indonesia and then on to Sahul much easier. The Last Glacial Period reached its maximum around 26,000 years ago and the Earth began warming. But around 12,000 years ago this warming accelerated quite rapidly and over the course of a few millennia sea levels rose to nearly their present day level. By 6500 BC Australia had become disconnected from New Guinea and Tasmania had become disconnected from the Australian mainland. The Bass Strait, in particular, is wide enough that it’s believed that Aboriginal Australians on Tasmania never had any further contact with the mainland until the arrival of European voyagers in the late 18th century. Well, even after the rising sea levels separated Australia from New Guinea, the islands across the Torres Strait are numerous enough and close enough to each other that the Torres Strait Islanders could maintain contact with Aboriginal Australians on the mainland as well as the indigenous Austronesian peoples of New Guinea. It seems that around 4000 years ago this contact led to the introduction of the dingo, and possibly some intermarriage. Nevertheless, these contacts were rare enough that for all practical purposes the Aboriginal Australians on the mainland were culturally isolated from the rest of the world until the arrival of Europeans in the late 18th century. Over the millennia that the Aboriginal Australians inhabited the continent, they fanned out and over time fragmented into around 500 distinct cultural groups with about 300 unique languages. And even these languages can be quite distinct from each other with around 30 language families and perhaps a dozen or so isolates which are not related to any other language on the continent. The long isolation also promoted the evolution of genetic adaptations to the harsh climate. Aboriginal Australians who reside in the Central Deserts have a mutation in the genes which regulate thyroxine, which is used by the body to maintain its internal temperature. These mutations allow carriers to maintain a higher internal body temperature without the typical metabolic damage caused by a fever. Well, given the wide diversity of climates and cultures in Australia there is not a tremendous amount that one can say that applies generally to all of these groups. But there are a few practices which many Aboriginal Australian groups share. One of these is avoidance relationships. The most common, and typically the strongest of these, is between a man and his mother-in-law. In many groups the two people may not speak to each other, refer to each other by name, or even see each other. One hypothesis for this practice is that it was common in many Aboriginal Australian groups for women to marry not long after puberty, whereas men typically would not get married until much later in life. So it would often be the case that a man and his mother-in-law would be roughly the same age and might be attracted to each other. These kinds of avoidance relationships may have served to prevent any affairs from developing. Similarly, many cultures practiced avoidance relationships between brothers and sisters. In childhood brothers and sisters would grow up and play together, but once a boy went through a rite of passage and was considered a man, he ceased communication with his sister. Here it’s been hypothesized that this practice evolved to prevent the development of incestuous relationships. There is another common practice among many Aboriginal groups that may also be a mechanism to promote genetic diversity and prevent inbreeding. Many groups have a concept which is called a “skin group” in Aboriginal Australian English. Skin groups might be thought of as somewhat akin to clans in other cultures, but they are typically more formalized and complicated. In its most basic structure, the people that make up an Aboriginal group might be divided into, say eight or sixteen skin groups. Your skin group would be determined by the skin group of one or both of your parents. You would not be permitted to marry any member from your own skin group, even if you shared no familial relationship. However in some groups there can be a typing that extends horizontally across generations rather than vertically through different generations, and the type would alternate between generations. In this case, you might only be able to marry an individual with the same generational typing as you — so, someone from your generation and not from your parents, though marriage to someone from your grandparents’ generation would be acceptable as well. Aboriginal Australian societies were very frequently polygynous, and in some cases extremely so. Among the Tiwi off the coast of North Australia, some men may have twenty or even thirty wives. But these marriage relationships are not necessarily sexual. Being able to support a wife is a sign of social status, and the more you have the better. It’s expensive to support a wife, so a man might not marry his first wife until he is in his late thirties. By contrast, among the Tiwi, women were always married, from the moment they are born until the time they die. If a man is lucky, his first wife will be an elder woman who can help show him the ropes in his new role. It may be many more years before he marries a woman who is of reproductive age. Another common practice is a taboo on speaking the name of a person after their death. The amount of time that the name may not be spoken varies depending on the group and the status of the individual who died, but is typically between one and a few years. A general belief among Aboriginal Australians is that a person’s spirit travels to a spirit-world after their death, also translated as the sky-world, although this isn’t taken to mean that they are literally in the sky. If a person’s name is spoken, or among some groups if their photograph is shown, this could impair their journey to the spirit world and recall them back to the Earth where they might cause destruction. Anyone who wants to refer to a recently deceased person has to do so in a roundabout way. One theory on the relatively high diversity of languages on the continent is that language development may have been accelerated by the fact that words frequently had to be replaced with circumlocutions to avoid violating the naming taboo. Well, the spirit world from which people’s spirits came and to which they returned after death is connected to another fundamental concept across many Aboriginal cultures: the Dreamtime, or the Dreaming. The Dreamtime really lies at the heart of the Aboriginal Australian worldview, so it’s somewhat difficult to summarize. Like my earlier summary of Confucianism back in Episode 37, this description will necessarily be inadequate. But at its core the idea of the Dreamtime is that there is some central, eternal source of all things. The great spirits and ancestors and all people today originated in the Dreamtime. But the Dreamtime is not limited to being just a kind of place from which things spring out of — it is at all times and connected to all places. In this view it has alternately been translated as the “everywhen.” But again, the Dreaming is not just some vague, fuzzy feeling of oneness that all things share. It also encompasses a kind of right action and behavior that is in harmony with the group and with the land. One of the consequences of the Dreamtime, and one of the reasons that I am spending so much time describing various cultural practices and beliefs of Aboriginal Australians is that there is a very deep connection between the sky and everything else. There is a motto that originates in Western Medieval astrology that goes “As above, so below.” The idea is that there are correspondences between the macrocosmos and the microcosmos — what happens in the heavens is reflected on Earth, and what happens on Earth is reflected in the heavens. And this idea is very consonant with Aboriginal Australian conceptions of the heavens. So the ways that Aboriginal Australians read the skies are closely tied to the seasonal rhythms of their activities on the ground. From a Western perspective it is tempt"
