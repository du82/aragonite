description = """
We step back and look at Babylon's broader political history and see how
Babylonian astronomy changes during the rise of the Neo-Babylonian Empire
and the Persian Conquest. Then we look at some of the types of astronomical
records the Babylonians produced, particularly the Astronomical Diaries,
the longest continuous research program of any society in history."""
full_description = "Episode 4: The Astronomical Diaries April 27, 2021 We step back and look at Babylon's broader political history and see how Babylonian astronomy changes during the rise of the Neo-Babylonian Empire and the Persian Conquest. Then we look at some of the types of astronomical records the Babylonians produced, particularly the Astronomical Diaries, the longest continuous research program of any society in history. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy with new episodes every full moon. My name is Joe Antognini. We’ve been talking about the astronomy of Babylonia for a couple of episodes now and I’ve tried to convey to you a feel for the kinds of problems that Babylonian astronomers were trying to solve, the phenomena they were interested in, and some of the methods they used to solve these problems. We looked at some of the ways that they determined how many months would be in a year, how many days were in a month, when lunar eclipses would happen, and we looked at how astronomical phenomena were used as a source of omens. But our examination of Babylonian astronomy has been generally limited to older periods of Babylonian history. In fact, 626 BC, specifically is the year that I will use to demarcate our discussion of the older Babylonian astronomy in previous episodes with the Babylonian astronomy we will discuss in this and future episodes. It is a somewhat arbitrary cutoff for the astronomy of the time, but is a good choice based on the larger political events in the region. At this point I want to take a step back and become a little more familiar with the broader geopolitical situation in ancient Mesopotamia, because the astronomy broadly changes around this time, or at least our modern perception of it does, as does the political situation of Babylon. Now we have to remember that Babylon always existed in the context of a fairly integrated Mesopotamian world. The political landscape of the near east was largely driven by the so-called fertile crescent. This was, as its name implies, a crescent-shaped swath of land that started with the Nile in the southwest, extended up along the Nile, along the Mediterranean coast through the Levant in modern-day Israel and Lebanon, turned east across the southern border of modern-day Turkey, and then traced its way southeast along the Tigris and Euphrates rivers in modern-day Iraq until it terminated at the Persian Gulf. This area of land was a more-or-less unbroken region with easily available water surrounded by otherwise arid lands. Because of this continuous stretch of land with relatively accessible water, and good soil, civilizations in this region could easily travel between each other to trade, exchange cultural ideas, and, frequently, fight with each other. Indeed the Hebrew Bible is full of stories of conquest and defeat between the ancient Israelites and dozens of different peoples of the region: Hittites, Canaanites, Kushites, Kassites, Amorites, Babylonians, Assyrians. The list goes on. But the cultures of the region had many similarities as well due to their frequent contact among one another. The city of Babylon was built along the Euphrates river, perhaps sometime in the late 2200s BC. Sometime in the 1800s BC Babylon gained its independence from neighboring city-states, built walls, and became a city-state in its own right. This began the Old Babylonian Empire, whose most famous ruler was King Hammurabi. As I discussed in Episode 2, our dates for kings during this period are still uncertain with the different chronologies being separated by the 64 year periodicity of the recorded phenomena of Venus. Around 1600 BC the Old Babylonian Empire was defeated by the Hittite Empire. The Hittites originated in modern-day Turkey, however, and were not able to maintain control over so distant a land. A group originated from the mountains that today border Iraq and Iran, just east of the Tigris river, the Kassites, subsequently took control and reigned for about 400 years. So we had independence for Babylon for a few centuries with the Old Babylonian Empire, followed by about 400 years of Kassite rule. Then came the Late Bronze Age Collapse. Sometime around 1200 BC, for mysterious reasons, catastrophe struck in the Babylonian Period. Within a span of a few decades, kingdoms all across the fertile crescent collapsed. Sophisticated city economies were replaced seemingly overnight by small, local village economies. This collapse appears to have been more sudden and more thorough than the collapse of the Roman Empire some 1500 years later. Perhaps in part because of this event it is very hard to know much detail about civilizations prior to this. We do have some astronomical records prior to the Late Bronze Age Collapse, some of which I described in earlier episodes, but there are not many. This event may be the origin of the myths of a past golden age described by the Greek writer Hesiod and lost cities and peoples like Atlantis. Well, the Kassites were among the victims of the Late Bronze Age Collapse. Whatever the cause of the collapse, the native Akkadian peoples were once again able to reassert control over Babylon. But the recovery from the Late Bronze Age collapse was slow and the kingdoms of this Middle Babylonian period were weak. Finally, in 911 BC the Assyrians conquered the lands and Babylon became subject to the Neo-Assyrian Empire. While the chronologies prior to the Late Bronze Age Collapse are uncertain, by the time we get to the Neo-Assyrian empire, the chronology becomes much more secure. Well Babylon managed to throw off the yoke of its oppressors once more in 626 BC. After three centuries of subjugation, a native Babylonian king succeeded in rebelling against the foreign rulers and establishing a Babylonian kingdom at long last, known as the Neo-Babylonian Empire. Under its second king, Nebuchadnezzar II, the Neo-Babylonian Empire conquered a swath of land along the fertile crescent up to Egypt. Among these lands, were of course, the lands of ancient Judea. The Babylonian conquest of Judea features prominently throughout various books of the Hebrew Bible. During the Babylonian captivity, the Temple of Solomon was destroyed, Jerusalem was sacked, and the Jews were driven from their lands. Understandably, Nebuchadnezzar does not come out looking all that great in the Bible. The heroic king of one people is the arch-villain of another. But the Neo-Babylonian Empire was not to be an empire for the ages. The Neo-Babylonian Empire lasted only about 100 years before the Persian King Cyrus the Great conquered Babylon. Persia had been growing rapidly under King Cyrus. Cyrus had expanded out of modern-day Iran, capturing lands up to modern-day India, Afghanistan, and then swept north above the Neo-Babylonian empire to capture land in Armenia and modern-day Turkey, all the way up to Greece. Cyrus essentially had the Neo-Babylonian empire surrounded on the north, east, and west, and the lands to the south were all desert. So Babylon was not at all in a good position. The tale of its capture is disputed in the historical sources. The Babylonian accounts of this capture are fairly non-eventful. A relatively contemporaneous Babylonian account, the so-called Nabonidus Chronicle, states that Cyrus defeated the Babylonian armies on the banks of the Tigris River at the Battle of Opis and then took several cities without any additional struggle, Babylon being among them. According to an account written several centuries later by the Babylonian astronomer Berossus, actually one of the few Babylonian astronomers whose name we know, the Babylonian king fled, but soon surrendered to Cyrus who apparently took kindly to a peaceful surrender and gave the deposed king an estate in the country where he lived out the rest of his days. Granted, that estate was in Persia, presumably where Cyrus could keep a closer eye on him, but nevertheless, it appears to be a more generous fate than one might have expected. The Greek tales of the capture of Babylon are considerably more interesting. In the Greek accounts, after defeating the Babylonian forces at the Battle of Opis, Cyrus faces a problem when he then tries to take Babylon and finds himself confronted with the impenetrable walls of the city. Well, of course the Euphrates river runs through the city to supply it with water. Now the Babylonians were well aware that this was a potential vulnerability, so they had constructed a metal grate that went below the river to prevent anyone from entering the city via the river. But Cyrus had an idea. Cyrus had his troops dig a canal upriver to divert enough water out of the Euphrates to lower the water level so that his troops could pass under the metal grate and into the city. Cyrus had chosen to implement his plan during a festival when the city was distracted so that his forces could enter unnoticed and took the city without much resistance. Now, modern historians regard the Greek version as fiction, perhaps drawn from folk tales in the region. Nevertheless, one point of contact between the Greek histories and the Babylonian histories was their broadly moralizing character. And this was not limited to these two groups. The ancient Israelite histories are moralizing in the same way, as are later Roman histories. Moral history was the predominant, perhaps exclusive mode of historical writing throughout the ancient world. In moral history, the point of telling the historical story is to convey a moral lesson to the reader. If, for example, you read the historical books of the Old Testament, the Book of Kings, Chronicles, and so forth, you’ll find that how good a Jewish king was depended on how faithful he was to God and the law. If he was faithful and upheld the law, Israel prospered — battles were won, enemies were slain. If he was unfaithful and worshipped other gods, Israel grew weak and lost lands. And if this infidelity went on for too long, Jerusalem itself would inevitably fall, by none other than the Babylonians as it happened. Well if you read the Babylonian histories you see the same story but in reverse. When the Babylonian king is faithful to Marduk, Babylonia suffers no defeat and rules victorious over all. But when kings are not faithful to Marduk, Babylon grows weak and falls prey to foreign invaders. Well evidently King Nabonidus was not faithful to Marduk because he was defeated by the Persian King Cyrus in 626 BC and Babylon lost its independence. Now you might have expected that the foreign conquest of Babylon would have been bad for Babylonian astronomy. It certainly had the potential for catastrophe. But nothing of the sort happened under King Cyrus the Great. To the contrary, Babylonian astronomy under Cyrus the Great flourished. Why this is is not exactly clear. The Persian Empire was not particularly interested in Babylonian astronomy and didn’t subsidize or support it in any direct way. After all, a large part of Babylonian astronomy was concerned with diving the intentions of the gods Marduk, Ishtar, and Nergal. What did the Persians care what the local gods of the Babylonians had to say? And this went the other way — without a Mesopotamian king to interpret omens for, what was the point of Babylonian astrology? During this period the influence of astrology wanes relative to the more scientific astronomical observations, using the anachronistic term “scientific”. Mesopotamian astrology loses some of its judicial character and develops a more personal flavor. This actually presents a bit of conundrum — why bother keeping these detailed astronomical records if you couldn’t do any valuable astrology with them? Perhaps the priests were carrying on their tradition for a time when a Babylonian king would reign once again. Well at any rate, King Cyrus was a remarkably pluralistic kind of king. Unlike the Babylonians, he did not care what gods his subjects worshiped as long as they paid him tribute and sent him their quota of conscripts to fill his armies. He permitted a large degree of local autonomy, including religious freedom, throughout his empire. It was thanks to this broad religious tolerance that the Jews were permitted to return to Judea, rebuild the temple, and begin worshiping the god of Abraham according to their traditional rites once again. Like the Babylonian conqueror Nebuchadnezzar, King Cyrus, too, appears in several places in the Hebrew Bible, but unlike Nebuchadnezzar, he gets a much better treatment. By the time of his death, the Persian Empire under King Cyrus had become the largest the world had yet seen. Such a vast empire necessitated a new kind of governance, and Cyrus was highly adept at appropriating local customs and institutions to build a decentralized empire that he could manage from the distance of his capital in Pasargadae. One of the most remarkable artifacts from the period is the Cyrus Cylinder, discovered in 1879. It was traditional for Babylonian kings to begin their reign with a public declaration of the reasons for their legitimacy and to perform certain rituals. Among these was a practice of burying their declaration in a new building’s foundation. This practice had no analog in Persia, but Cyrus nevertheless found it useful to appropriate in order to rule Babylon. In his declaration, written on a cylinder now called the Cyrus Cylinder, he states that the previous Babylonian king, Nabonidus, had been unfaithful to Marduk, and that Marduk had smiled upon Cyrus, and used Cyrus to smite the unfaithful Babylonian king. Quote: Nabonidus brought the daily offerings to a halt; he interfered with the rites instituted within the sanctuaries. In his mind, reverential fear of Marduk, king of the gods, came to an end. He did yet more evil to the city every day. He brought ruin on them all by a yoke without relief. Enlil-of-the-gods became extremely angry at their complaints. Exalted Marduk, Enlil-of-the-gods, relented. He changed his mind about all the settlements whose sanctuaries were in ruins, and the population of the land of Sumer and Akkad who had become like corpses, and took pity on them. He inspected and checked all the countries, seeking for the upright king of his choice. He took the hand of Cyrus, king of the city of Anshan, and called him by his name, proclaiming him aloud for the kingship over all of everything. Now Cyrus, of course, as a Persian, did not care in the least what the Babylonian god Marduk thought of him or Nabonidus for that matter. But Marduk could be invoked as a useful bit of propaganda to establish the legitimacy of his rule in the eyes of the Babylonians. Well, nothing in this world is permanent, and the Persian empire was no exception. But Babylon was never to regain its independence after Cyrus’s conquest. Babylon remained under Persian control for another two hundred years until 331 BC, when Alexander the Great swept in and exiled many of the resid"
