description = "At the dawn of the Hellenistic Age, two Greek astronomers developed radical new cosmologies. Heraclides of Pontica proposed that the Earth rotated on its axis and that Mercury and Venus revolved around the Sun instead of the Earth. Aristarchus of Samos went further and proposed that all the planets, including the Earth, revolved around the Sun. In addition, Aristarchus made the first quantitative measurement of the distances to the Sun and the Moon, along with their sizes."
full_description = "Episode 19: The Forerunners of Copernicus July 13, 2022 At the dawn of the Hellenistic Age, two Greek astronomers developed radical new cosmologies. Heraclides of Pontica proposed that the Earth rotated on its axis and that Mercury and Venus revolved around the Sun instead of the Earth. Aristarchus of Samos went further and proposed that all the planets, including the Earth, revolved around the Sun. In addition, Aristarchus made the first quantitative measurement of the distances to the Sun and the Moon, along with their sizes. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. In the last episode we examined Aristotle, a figure who really stands at the culmination of Classical Greek thought. In his works, Aristotle presented the ideas from all the great intellectuals ancient Greece had to offer, and examined them all critically. He adopted the ideas he thought made sense, and, more often than not, when he thought their ideas did not make sense, he explained why. And beyond just summing up the state of knowledge in Classical Greece, he then went on and synthesized it all into a remarkably intuitive and self-consistent description of the physical world. This physical framework was so compelling that it stood more or less unchallenged for centuries in Western Europe after his works were reintroduced from Arabia during the High Middle Ages. Now, part of the reason for Aristotle’s towering reputation as the capstone of Classical Greek thought is due to unusually good fortune. Thanks to the vagaries of historical chance, much of Aristotle’s work happened to survive whereas we are left with bits and bobs from the works of various other philosophers of his era. So our understanding of his philosophy is unusually complete. Nevertheless, what he had to offer later cultures was compelling enough that they took him to be among the greatest authorities on the natural sciences. Well, as we learned last episode, Aristotle died within a year of Alexander the Great, and Alexander’s death traditionally marks the transition from Classical Greece to Hellenistic Greece. Thanks to Alexander’s conquests to the east, Greek culture during this period began to receive a stronger influence from the various Mesopotamian cultures, in particular the Babylonians and Egyptians, and the Greeks, in turn, exerted more cultural influence in Egypt and the Near East. The center of gravity of intellectual life in the region started to shift away from Athens in Attica, to Alexandria in Egypt, and to a lesser degree, Antioch in Syria. Now, it is something of an understatement to say that when Alexander the Great died, he did not leave much of a succession plan. The famous story, of course, is that as he was dying from whatever illness or poison it was that had befallen him, his generals asked him to whom he would leave his empire, if, heaven forbid, he should die. Alexander replied, “to the strongest.” A story as good as this means it is likely to be apocryphal, but, again, to many of the ancient historians, whether or not the events they were describing literally happened as they described them was of lesser importance than it is to us in the modern era — what was more important was whether or not they were accurately describing the spirit and moral lessons of those events. And, in this case, Alexander’s wish that his empire go “to the strongest,” did, in fact, accurately describe the events that unfolded afterwards. Now, some have speculated that this dying wish of Alexander the Great may have also been a willful mishearing of his true intention. In the Greek, Alexander’s statement “to the strongest” is rendered “toi kratistoi.” But Alexander also had a general named Craterus, at least in the Anglicized version of his name, and if Alexander had left his empire to him, the statement would have been “toi Krateroi,” not too far off from “toi kratistoi.” And according to other authors Alexander had, in fact, nominated another of his generals named Perdiccas to take over after his death. But whatever Alexander’s wishes were, the extremely rapid expansion of the Macedonian Empire under his command led to its extremely rapid fragmentation after his death. There hadn’t been time to institute any sort of stable political or bureaucratic infrastructure to unify the sprawling empire. So immediately after Alexander’s death, his various generals began snatching whatever provinces of the empire they could, and fighting with each other for the rest in what became known as the Wars of the Diadochi, diadochi being the plural of “diadochus,” which means “successor.” These wars lasted more or less continuously for the next forty years. So, now that we have officially left the Classical Age and entered into the Hellenistic Age, in this episode we’ll now turn to the astronomers of this new era. But before we really get into this in earnest and looking at the stars of this show, Heraclides and Aristarchus, it would be prudent for us to take a moment and see how our old friends, the Pythagoreans, have been doing this whole time. It’s been eight episodes since the episode on Pythagoras and the Pythagorean school now, and, of course, Pythagoras himself founded his school many centuries earlier, in the 6th century BC, in the middle of the Archaic Age. But his school, or cult, was highly influential and persisted for centuries. For astronomy, the most influential Pythagorean was certainly Philolaus who was more or less contemporaneous with Socrates. Most of what we learned about Pythagorean cosmology in Episode 11 came to us from Philolaus. But by the Hellenistic Age, Pythagoreanism as an intellectual movement really starts to peter out. You may recall from that episode that during the Classical Era, the Pythagoreans started to splinter into two traditions: one was the akousmatikoi, who were primarily interested in the religious rituals and the strict rules of life of Pythagoreanism. The other group was the mathematikoi, who were more interested in Pythagoras’s intellectual program of scholarship, learning, and debate in philosophy and mathematics. Now, Plato found much of Pythagoras’s philosophy compelling, and he was not ashamed to appropriate the elements of their philosophy that he liked, which turned out to be a lot of them. So after the establishment of Plato’s Academy, many of the mathematikoi, who, by and large, were not as interested in the religious trappings of their philosophical school, migrated into Platonism. One other motivation for the collapse of the mathematikoi sect of Pythagoreanism around the transition to the Hellenistic Era is that Alexander the Great’s conquests to the east had posed a big problem for Pythagorean cosmology. Now you may remember that Pythagorean cosmology was a little unusual in that it rejected geocentrism. But it wasn’t a heliocentric cosmology either. Rather than placing the Earth or the Sun at the center of the universe, they, or at least Philolaus, placed an object he called the Central Fire, which is what provided light and life to all things. The Sun, in this cosmology, merely reflected the light of the Central Fire. The Pythagoreans had also posited the existence of another planet, called the Counter-Earth, which was on the other side of the Central Fire to balance out the Earth’s weight and keep the universe symmetric. But of course we don’t see the Central Fire. And we don’t see the Counter-Earth either. But this was no problem for the Pythagoreans. They just said that this is because the Earth rotates around the Central Fire in such a way that one direction always points towards it, and we happen to be on the side of the Earth facing outwards, away from the Central Fire. So we never see it, just like we never see the far side of the Moon. But as we learned in last month’s episode on Aristotle, by this point Greek astronomers had quite compelling evidence from a variety of observations that the Earth was spherical in shape, and, more importantly, that it wasn’t all that large. Alexander’s empire stretched all the way from Greece to India, which was a distance that covered a substantial fraction of the Earth’s known circumference. Yet even in far-off India the Central Fire of the Pythagoreans was not observed. So the collapse of the Pythagorean theory of the Central Fire in the wake of Alexander the Great’s conquests was probably another factor in the dissipation of the mathematikoi sect of the Pythagoreans. A smaller contingent of the other sect, the akousmatikoi, ambled along for another several centuries, but by the close of the Classical Era, individuals drawn to a rigorous, ascetic way of life had other options to choose from besides the Pythagoreans, in particular the trendier Cynics. A few centuries later the philosopher Epictetus poked fun at those who thought they could just throw on an old cloak and grab a staff, the traditional garb of the Cynic, and then start calling themselves a philosopher, just as today wags might poke fun at young undergraduates who throw on a beret and start smoking cigarettes and call themselves Existentialists. But, just before Pythagoreanism as an intellectual force is nearly extinguished, there are two, rather obscure Pythagoreans that had some influence on astronomy in the movement’s dying days. These two are Ecphantus and Hicetas. We don’t know much about either of these figures, but they were apparently both from Syracuse in Sicily and lived during the 4th century BC, so were roughly contemporaneous with Aristotle. Both were atomists, which already separated them to some extent from the dogma of Pythagoreanism, though their atomism differed from that of Democritus and their physics was different from Aristotle’s. They held that the atoms moved by the nous, that is, by the intellect of God. Aristotle, by contrast, though he wasn’t an atomist, held that movements in the universe were due to percussion — one thing hitting another. Recall that according to Aristotle, if I throw a ball, it travels through the air because the air continually pushes it forward. But to Ecphantus and Hicetas the motions of atoms are simply guided by nous. But the atomism of Ecphantus and Hicetas is really less interesting than their major innovation — they held that the Earth rotated. We appear to see the sphere of the fixed stars rotate above us once every day, but according to them, this is but an illusion. Really it is us who move on top of the Earth, and the fixed stars live up to their name and are truly fixed — they just appear to move by virtue of our own rotation on the Earth. Now unfortunately there’s not much more to say about the views of these late Pythagoreans because hardly anything more about them survives. Ecphantus was referenced by Aëtius and St. Hippolytus, and Hicetas is referenced in a work of Cicero that ultimately draws from Theophrastus’s History of Physics. In fact, there is some debate as to whether or not Ecphantus even existed. Ecphantus’s views are in rather remarkable agreement with those of Heraclides, about whom I’ll have much more say in a moment. So some scholars have speculated that Heraclides may have fabricated Ecphantus as an authority he could point to when he himself was proposing that the Earth rotates, and thereby siphon off some of the aura of the Pythagoreans for his own idea. Hicetas’s claim to significance took even longer to bear fruit, but was certainly even more consequential for the history of astronomy. Some 2000 years later, Nicolaus Copernicus cited Hicetas as an ancient authority who claimed that the Earth rotated when Copernicus posited that the Earth rotated about the Sun. This citation of Copernicus points to an interesting way in which the science of today differs from the science of the early modern period. Today, the emphasis in science is on novelty — coming up with an idea that no one else has thought of. Of course, you’re expected to cite prior work, but the quality of your work is inextricably tied up in its originality. But Copernicus found it helpful to cite an ancient authority who held to a similar view in order to emphasize the continuity of his ideas with those of the past, and downplay its novelty. So what Ecphantus and Hicetas lacked in surviving works, they made up for in influence. Well, I’ve already referenced one of the two astronomers who are the focus of this month’s episode — Heraclides of Pontica. Now I opened this episode with a whole soliloquy about how we are now transitioning from the astronomy of the Greek Classical Era to the Hellenistic Era. But I might have misled you a little bit, because Heraclides lived from around 388 to 315 BC, or so, so was more or less exactly contemporaneous with Aristotle, who, of course stands at the culmination of the Classical Era. But even though Heraclides’s life just barely peaks into the beginning of the Hellenistic Era, I think it’s fair to associate him more with the astronomy of this period than with the astronomy of the Classical Era. In particular, I’ve argued that Aristotle’s work acted as a sort of culmination of Greek philosophy of the Classical Era. But although Heraclides was contemporaneous with Aristotle and must have been known to him, Aristotle doesn’t have anything to say about Heraclides’s thought, at least in any surviving work. Why there is this omission is hard to say — maybe Aristotle didn’t feel he was familiar enough with Heraclides’s ideas, perhaps because they were so new, or maybe he just had a low opinion of them and didn’t think that they were worth discussing. Or maybe he did write about them, but those works just didn’t survive. At any rate, Heraclides of Pontica was born in the unsurprising location of Heraclea Pontica, which was a Greek colony on the southern coast of the Black Sea. Like almost everyone else we’ve talked about in Greek astronomy, he was born into a wealthy and noble family. As a young man, probably in his early twenties, he travelled to Athens to learn at Plato’s Academy, and at least according to Diogenes Laërtius, he also studied with the Pythagoreans. Like Aristotle, he stayed in Plato’s Academy for quite a long time and rose to a position of some prominence in the school. You may recall from Episode 15 that towards the end of his life, Plato had a series of misadventures trying to tutor a couple of tyrants over in Sicily. Well, during Plato’s absence, Heraclides was chosen to run the Academy. After Plato died another philosopher named Speusippus took over, but after Speusippus’s death, Heraclides was apparently in the running to run the school once again. But, sadly for him, Xenocrates beat him out. You may remember him as Aristotle’s companion when he travelled to Assos. Whether out of sour grapes or whether he just felt it was the time to retire, after this defeat Heraclides then left Athens and retu"
