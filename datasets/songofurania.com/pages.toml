full_description = '''Episode 39: The Guest Stars February 29, 2024 We turn to the ways that the Chinese Emperor's astronomers predicted and interpreted eclipses, as well as the so-called "guest stars" that they occasionally reported observing in the skies. Then we discuss the role of the planets, particularly Jupiter. Towards the end we hear a few examples of astronomy in Chinese folklore. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Last month we looked at the three major cosmological theories in China that emerged during the early Imperial period. This month I wanted to focus on some of the other pillars of Chinese astronomy: eclipses, records of the guest stars, and the planets. Then towards the end I wanted to give a flavor of astronomy in Chinese folklore. But, before we can get to the folktales, I have to start with the official stuff. Now, as I have been at pains to convey in the last two episodes, Chinese astronomy was intimately associated with the Emperor. Chinese astronomers, at least the most significant of them, were employed by the Emperor and held high positions in the Imperial Court. And more fundamentally, it was conceived as flowing from the Emperor just like all the other fruits of civilization. As one of the great early scholars of Chinese astronomy, Léopold de Saussure wrote, While among the Greeks, the astronomer was a private person, a philosopher, a lover of the truth (as Ptolemy said of Hipparchus), as often as not on uncertain terms with the priests of his city; in China, on the contrary, he was intimately connected with the sovereign pontificate of the Son of Heaven, part of an official government service, and ritually accommodated within the very walls of the imperial palace. Nowhere was the importance of the astronomers to the Chinese state more apparent than in the study of eclipses. As in every society, eclipses were seen as perhaps the most astrologically significant phenomenon. And they did not portend anything good. After all, when the very sun or moon is blotted out from the sky, a kind of apocalyptic feeling is only natural. And, if you have ever seen a total solar eclipse in person, you’ll know that feeling, since the Sun doesn’t just go away the same way it does during a sunset. As the sun sets in the evening it’s always low on the sky, and as such, its light is passing through a lot of atmosphere. As I talked about back in Episode 33 on the history of blue moons, the shorter wavelengths of light scatter in the atmosphere much more strongly than the longer wavelengths do, so when the sun’s light passes through that much atmosphere, the color of the light changes quite dramatically, with the reds, oranges, and yellows becoming much more prominent. This is why the hour before sunset is known as the Golden Hour in photography. Well, during a solar eclipse, the Sun’s light also dims, but because the Sun is still high in the sky, there is no corresponding change to the color. So it gets dark, but the light is still quite blue, which produces an exceedingly eerie effect. Well, at any rate, in China, as with everywhere else, a lunar or solar eclipse was perceived as a harbinger of doom. But, there was a way out. If the eclipse was predicted in advance it was not seen as being a necessarily bad omen — it could be interpreted through a variety astrological techniques to mean a lot of different things. But if there was an unexpected eclipse that was quite different. This was an indication of great discord between heaven and Earth — and because the Emperor was at the center of the Earth, that meant great trouble for the emperor. The connection between the state of the heavens and the emperor was described in the I Ching like this: The character of the great man is identical to that of Heaven and Earth; his brilliance is identical with that of the sun and the moon; his order is identical with that of the four seasons, and his good and evil fortunes are identical with those of spiritual beings. So one of the principal jobs of Chinese astronomers up and down the ages was to predict lunar and solar eclipses. Now, fortunately for them, the standards of a successful prediction were somewhat lax, at least relative to what you might expect, especially in the early days. In general it was okay if the astronomers predicted an eclipse and it didn’t happen. That might simply have signified that the emperor had heard the warning from heaven, corrected his course, and averted the impending disaster. And as prediction techniques became more sophisticated it was also acceptable for eclipse predictions to be within a particular cycle. In practice this meant that the date could be off by 5 or 6 months or 11 or 12 months, though dates that were in separate cycles, like a date that was off by, say 2 or 4 months, would be counted as an incorrect prediction. Now, until contact with Western astronomy in the 17th century, Chinese methods to predict eclipses were fundamentally phenomenological. They had extensive records of observed eclipses and identified patterns in those records. Over the centuries the patterns they identified became more sophisticated, but it was never connected quantitatively to an underlying theory of eclipses. One of the rather surprising features of Chinese eclipse theory is that although they became fairly successful at predicting eclipses, they never made use of the Saros cycle of around 19 years, as did many other civilizations. Instead, by the 1st century BC they had hit upon a 135 month cycle during which 23 eclipses would occur. By the 3rd century AD they had an improved understanding of the Moon’s orbit called the Nine Roads of the Moon, which I’ll discuss in more detail a little later. From this Chinese astronomers estimated that the Moon’s orbit was inclined to the ecliptic at an angle of about 6° and by the late 4th century an astronomer named Chiang Chi was making predictions about the extent of totality of an eclipse. By the early 7th century the techniques had become sophisticated enough that Chinese astronomers were making predictions about the time of first and last contact of an eclipse as well as the position in the heavens. Chinese eclipse prediction methods appear to have reached their zenith perhaps in the early Song dynasty around the 10th or 11th centuries. As I mentioned in the last episode, a kind of bureaucratic rot set in in the Astronomical Bureau in the later Song dynasty, despite the efforts of some quite capable astronomers to fix it. We have a reference to an eclipse in the 13th century AD where apparently a private individual predicted a different time for some solar eclipse than the royal astronomers. The royal astronomers predicted that the eclipse was to happen at night, and thus would not be seen, but the private individual predicted it would happen during the day. And indeed the eclipse did in fact happen during the day. The citizen scientist was correct and the royal astronomers were wrong. As a consequence we read in the reference that the head of the Astronomical Bureau, along with several of his officials were put on trial for negligence, found guilty, and severely punished. Throughout the later Ming dynasty from the 14th to 17th centuries the quality of the state astronomers fell even further and this was reflected in a decline in the accuracy of the eclipse predictions. And as we’ll see in the next episode, the newly arrived Jesuit astronomers were able to exploit this decline to integrate themselves into the Imperial Court. But I am getting ahead of myself. Perhaps one contributing factor for this decline was that by the time of the Song dynasty observation and prediction had become organizationally separated from each other. The astronomers who made predictions of future eclipses were housed in an entirely separate department from the astronomers who made observations of them. Now, throughout the history of science there has always been some division of labor between theorists and experimentalists. But it has often been the case that anytime theorists and observers are brought to work more closely together there have been more discoveries, and when they have been more decoupled there has been more stagnation, at least as far as such a general rule can go. And this may have also been the case during the Song dynasty. As for the records themselves of the eclipses, it’s perhaps no surprise that they go back quite a long way for a civilization as ancient as China’s. The earliest records are rather sporadic, but there are some oracle bones from the Shang dynasty in the 2nd millennium BC that indicate the observation of an eclipse. More systematic records begin during the Spring and Autumn Period starting in the 8th century BC. One of the commentaries on the canonical history of the era, the Spring and Autumn Annals, called the Zuo Zhuan, or Commentary of Zuo, preserves the records of solar eclipses from this period. The text describes the period from 721–468 BC and during this period 37 solar eclipses were recorded. Interestingly, the first solar eclipse in this work was recorded as taking place in 720 BC, which is just one year after the first eclipse recorded in the Almagest in the West in 721 BC. During the Han Dynasty, records of solar eclipses were preserved in the Han Shu, or Book of Han, which has 55 solar eclipses. Now, one of the neat things about these records is that with modern astronomical techniques we can go back and check their accuracy. And generally the records are indeed quite accurate, at least in the sense that nearly all of the recorded eclipses did in fact occur. But the records were by no means complete. The Zuo Zhuan recorded 21 so-called “striking” solar eclipses, which were either total, annular, or very nearly total, and so were unlikely to be missed. But there were 14 other striking solar eclipses that occurred during this period that were not recorded. The completeness of the Book of Han is even worse, 12 striking eclipses were recorded whereas 28 were missed. Now, one possible explanation for these omissions is that they were simply missed due to the weather. It was cloudy, say, and they couldn’t be seen. The problem with this explanation is that if you look at the distribution of when the missed eclipses occurred during the year, they’re all evenly distributed throughout. If the eclipses had just been missed due to the weather you’d expect more of them to have been missed during the winter when it’s cloudier. But that doesn’t seem to have been the case. What seems to have been going on instead is that these eclipses were probably in fact observed by the imperial astronomers, or most of them anyway, maybe a few really were missed because of bad weather. But most of the missing eclipses appear to have been omitted from the historical record for political reasons. In general, the sparsity of the eclipse record seems to correlate with the popularity of the emperor at the time. During the reigns of popular emperors very few eclipses are recorded, whereas the astronomers seem to have been more diligent at recording for posterity the occurrence of eclipses during the reigns of unpopular emperors. Now, it should be said here, that when I say the popularity of an emperor, I really mean the popularity among the elite class of scholar-officials in Chinese society, since it’s their records that we are going off of. Some of these unpopular emperors may have been quite popular with the masses, but due to who was writing the texts it’s hard to say with great confidence what the real feelings of the masses were. That said, probably many of the unpopular emperors were really just all around bad guys, unpopular with everyone and for good reason. Now, despite the fact that Chinese astronomers were somewhat selective in their recordings of eclipses, this selection effect largely went only one way. If there had been an eclipse, it may or may not have been recorded. But it was very rare for them to fabricate an eclipse into the record that never occurred in reality. That said, very rare is not never. After the death of the Emperor Gaozu in the early 2nd century BC, his widow, the Empress Lu effectively took control of the state by ruling in the name of her teenaged son once he nominally took the title of Emperor. In no time at all she poisoned another son that the late emperor had had with a concubine. Then to really drive the point home she apparently chopped off the limbs of the concubine, gouged out her eyes, cut off her tongue, nose, and ears, and threw her in a pigsty. So, for these deeds among others, Empress Lu evidently merited a made-up eclipse during her reign. Well, as for a theory of eclipses, as I mentioned earlier, when it came to prediction the techniques were largely empirical. But when it came to an explanation of what caused the eclipse, there were a few competing theories. One of these theories is already familiar to us from our tour of Indian astronomy. During the Han dynasty, contact with India increased, and brought with it, most importantly, Buddhism to China. But other Indian ideas came into China during this period as well. One of these was the Rahu and Ketu theory of eclipses. The basic idea was that there were two invisible planets, named Rahu and Ketu, at the nodes of the Moon’s orbit, where it intersects with the ecliptic. When the Sun and Moon passed through the nodes, these invisible planets would swallow up the Sun or Moon, causing the eclipse. More mythologically Rahu and Ketu were conceived of as snakes, literally devouring the Sun or Moon and subsequently disgorging them. As we’ll see a little bit later, this wasn’t the only instance of invisible planets in Chinese astronomy, there was also a theory that there was an invisible counter-Jupiter. The earliest record of eclipses being due to the shadow of the Earth or the Moon is in 20 BC by the astronomer Liu Hsiang. By a century later this theory seems to have become more popular. One reference gave a fairly complete description. It said that the Sun is like fire and the Moon and planets like water — the fire produces the light and the water reflects it. If the Earth came between the Sun and the Moon the shadow from Earth onto the Moon produced a lunar eclipse. If the Moon came between the Earth and the Sun it produced a solar eclipse. And the same could happen with planets as well. If a planet passed between the Earth and a star, it would produce an occultation, or likewise if the Moon passed between the Earth and a star. However, these two theories were not the only theories of eclipses at the time. Another, more astrological, theory held that the Moon was influenced by other heavenly bodies. The planets and even stars like Arcturus and Antares could, through their astrological influence, cause an eclipse and temporarily exting'''
