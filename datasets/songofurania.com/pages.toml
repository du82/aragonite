description = "In our final episode on ancient Indian astronomy, we tour the five astronomical Siddhantas, and then meet some of the astronomers whose names and works survive to us, most importantly, the great Aryabhata."
full_description = "Episode 36: Aryabhata & the Siddhantas November 30, 2023 In our final episode on ancient Indian astronomy, we tour the five astronomical Siddhantas, and then meet some of the astronomers whose names and works survive to us, most importantly, the great Aryabhata. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Well last month we dived into the astronomy of the late Vedic period in India, which culminated in a text called the Vedanga Jyotisha. The text itself was written probably in the middle of the first millennium BC, but many of the astronomical techniques it presented were probably centuries older than that. Regardless, the astronomy of the Jyotisha held sway as the state of the art of Indian astronomy for centuries after it was formalized, well into the first millennium AD. Over all these years, however, certain flaws in the Jyotisha came to be harder to ignore. Of course, the big one is setting the length of the year to 366 days, but other periods of time were also slightly inaccurate, and over the years these inaccuracies grew and grew and became more apparent. Furthermore, the Jyotisha was also fairly limited in its scope. It was explicitly written as an aid in calculating the appropriate times to perform the requisite rituals in the Vedic calendar, and so it just didn’t have anything to say about other aspects of astronomy like the motion of the planets or how to predict when eclipses would occur. It’s also in these first few centuries of the first millennium AD that contact with the west began to expand, and knowledge of new techniques in the astronomy of Greece and Babylonia starts to reach India. One of the earliest indications of this change is from the astronomer Vrddha Garga, who was probably active early in the first century AD around the turn of the millennium. Incidentally, this Vrddha Garga is not to be confused with a sage who composed one of the hymns of the Rigveda and is simply known as Garga. Vrddha Garga is mostly remembered for a text that is attributed to him, which is usually called the Gargiya-Jyotisha. As with the other texts from this era and earlier, we still can’t definitively attribute this work to a single individual, and it was more likely to have been composed from the writings of a number of astronomers over several generations and then ascribed to one individual. But the book contains several references to the Greeks. Now, during the explosive expansion of the Macedonian empire under Alexander the Great in the late 4th century BC, Alexander famously claimed to have conquered the known world out to India. Now, this was perhaps a bit of propaganda. Alexander made it some of the way into the Indus river valley, and it should be noted that he made it further than Persia had ever managed. But it was nevertheless essentially a toehold on the subcontinent and didn’t even reach to the modern-day borders of India. But, Alexander’s conquests began to strengthen trade networks between India and the West, and ultimately facilitated the exchanged of information between east and west. Well, based on some of the references to the Greeks in the Gargiya-Jyotisha, it seems that the invasion of the Greeks was a fresh experience for at least one of the astronomers who contributed to it. But Vrddha Garga himself seems to have been quite admiring of the Greeks, at least scientifically. He wrote: The Greeks are indeed barbarians, but amongst them this science of astronomy is well established; therefore even they are honored as rishis [sages]. A more comprehensive piece of evidence for the influence of Greek astronomy on Indian astronomy came in the next few centuries with a work called the Yavanajakata. This was a work that was directly based on a Greek text that several Indian astronomers translated into Sanskrit and converted into verse. The original work was probably written in Alexandria in the early 2nd century AD and was first translated and versified just a few decades later. The text is almost entirely astrological and taught the reader how to read horoscopes since by this point in time, that is what Hellenistic and Roman society was almost exclusively interested in in their astronomy. The name itself, Yavanajakata, comes from the Yavana kingdom, which is also known as the Indo-Greek kingdom. This was a kingdom of mostly Greek people in what would today be modern-day Pakistan. You may recall from the early episodes on Greece that Greece underwent a period of expansion, where groups of Greeks would travel to distant lands and establish colonies there, over time spreading from the Iberian peninsula in the west all the way out to the Black Sea. Well, some of these settlers traveled east to Persia, but the Persian state was generally not happy to see the growth of foreign settlements in their empire. So periodically the Persians would forcibly relocate the Greeks to the eastern side of their empire. Eventually, Alexander’s conquests extended Greek rule out to these peripheries and reconnected these Greek settlements to the broader Hellenistic world. After Alexander’s death, his short lived empire fragmented, and eventually the Greco-Bactrian kingdom developed out of the eastern portion, and later on the eastern portion of that developed into the Indo-Greek kingdom, which lasted from about 200 BC until the turn of the millennium. But the older name for this kingdom, the Yavana kingdom, derives from the word “Ionian.” At any rate, despite the fact that modern day Greece and India are really quite far apart, in Hellenistic times, Greek culture was right at India’s doorstep, so the major influence of Greek astronomy on Indian astronomy is perhaps more plausible than it might at first glance seem. Well, as new developments in astronomy from Greece made their way into India, Indian astronomers could no longer ignore the shortcomings of the Vedanga Jyotisha. A few centuries into the first millennium it was clear that a new approach to astronomy was needed. So by around the 4th and 5th centuries AD we start to see a new series of works produced that codified these new developments. These works are called “siddhantas.” The term “siddhanta” translates from Sanskrit as something like “settled doctrine,” or “final conclusion,” so it was meant to be a kind of summing up of the centuries of studies on a particular topic. The siddhantas as a genre are not exclusively astronomical, in fact, only a few of them deal with astronomy. Traditionally there were 18 of these Siddhantas, but as with the texts of ancient Greece, most of these were lost, and also similar to ancient Greece, in many cases later authors impersonated the famous sages of yore who wrote the original texts in order to steal a bit of prestige for their own works. Most of the siddhantas deal with topics in theology and philosophy in Hinduism and Buddhism, but five of them deal with astronomy. One of the general features of the astronomical siddhantas is that the astronomy has by this point clearly become more sophisticated, and more than that, it has become interested in a much wider range of phenomena than the Jyotisha. Which, to be fair, was not terribly difficult to do since the Jyotisha was pretty short and couldn’t cover too much material. The first of these five Siddhantas is called the Paitamaha Siddhanta and isn’t really of too much interest except to show that despite advances in other astronomical schools, there was still a contingent of astronomers who held to the ways outlined in the Vedanga Jyotisha. The astronomy of the Paitamaha-siddhanta is more or less identical to the astronomy of the Jyotisha and has the same focus on the calendar and bases its calendrical system on the same yuga of 5 years. A kind of intermediate work is the Vasishtha-siddhanta, which was named after the ancient sage Vasishtha, one of the authors of the Rigveda. The Vasishtha-siddhanta has a number of real developments over the Jyotisha, but compared to the next three siddhantas it’s the most inaccurate. The first really new feature we see in it reflects the influence of Babylonia and Greece on Indian astronomy by this point. The Vasishtha-siddhanta introduces the 12 signs of the zodiac as a way to measure ecliptic longitude, and divides each of these signs into degrees and minutes just as the Babylonians and Greeks did. Now, the Vasishtha-siddhanta really only does this as a supplement to the more traditional Indian system of 27 or 28 nakshatras that I described in the last episode, but we see that by this point Indian astronomers were no longer developing their ideas in isolation from the western world. In addition to this obviously western influence, the Vasishtha-siddhanta expands the scope of the astronomy it’s interested in relative to the Jyotisha. The Vasishtha-siddhanta describes the concept of the anomalistic month, which is the time it takes the moon to go from perigee to perigee. The moon’s orbit is slightly elliptical, so when it is closest to earth at perigee, it moves faster than average, and when it’s farthest from the earth at apogee, it moves more slowly than average. This variation in its speed over the course of the orbit is called the anomaly, and so the time it takes the moon to go from its maximum apparent speed to maximum apparent speed on the sky is called the anomalistic month. The Vasishtha-siddhanta actually gives two separate lengths for the length of the anomalistic month. The first is somewhat simpler, 248 / 9 days, or 27.555 days, which is off by about 1 and a half minutes. But in another place it gives another, more accurate value of 3031 / 110 days, which works out to be 27 days 13 hours 18 minutes and 32.7 seconds and is off by just half a second. The last development of the Vasishtha Siddhanta that I’ll mention is its description of the planets. The treatment isn’t terribly sophisticated, but it’s nevertheless a fairly monumental development just by sheer virtue of being there at all. The text names the five planets and describes their motions both qualitatively and quantitatively. It says that the planets in general have a prograde motion from west to east, but that they undergo periods of retrograde motion as well, with stationary points in between. And then it gives the values for the synodic periods of the five planets, along with the ratio between the sidereal period and the synodic period. Well, the next two siddhantas seem to have been of a more explicitly western origin. The first of these is called the Paulisa Siddhanta, and it’s believed that the name, Paulisa, refers to a Greek astronomer whose name was some variant of “Paul.” During the Islamic Era, a Muslim astronomer named Al-Biruni was more specific and wrote that this author was a Greek from some city called “Saintra,” that Al-Biruni was not himself familiar with. But he speculated that the this “Saintra” have have been a Sanskrit version of the city Alexandria. Now, one thing I should mention at this point is that by the time that the siddhantas had been written in the middle of the first millennium, Indian astronomy had evolved to become heavily mathematical. In fact, as in ancient Greece, there wasn’t a strong distinction between mathematics and astronomy. Mathematics was simply a part of doing astronomy, and many of the great Indian astronomers were also the great Indian mathematicians. If you were to listen to a podcast on the history of mathematics, the episode on Indian mathematics would turn up mostly the same list of names and texts. So with the Paulisa Siddhanta many of the new developments are from a conceptual standpoint, rather unremarkable. But from a technical standpoint, they represented a huge advance in the mathematical techniques of the astronomers of this period. The Paulisa Siddhanta gives you, for instance, methods to calculate the position of the Sun and Moon. First by calculating the position of the mean Sun and mean Moon, and then applying the corrections you need to make to account for the fact that the orbits are elliptical, so the Sun and Moon do not move uniformly on the sky — sometimes they move faster, and sometimes they move slower. This technique for correcting for the anomaly was called the “kendra,” and unfortunately the text just gives the steps that you need to do to perform the calculation but it doesn’t actually show how this method was derived. In another place, the Paulisa Siddhanta has an equation which is today called the “sunrise equation,” because it can be used to figure out when sunrise and sunset will be, and from that the length of day and night. Rather than the simple linear zig-zag function that the Vedanga Jyotisha used, along with the ancient Babylonians and Egyptians, where each day gets longer by a constant amount until the summer solstice, and then gets shorter by a constant amount until the winter solstice, the method in the Paulisa Siddhanta is actually trigonometric, and accounts for the spherical geometry of the Earth. To make these kinds of trigonometric calculations possible, the text also includes sine tables, which list out the values of the various trigonometric functions at different angles. The other Siddhanta with a clear western influence was called the Romaka Siddhanta, the name “Romaka” being a Sanskritization of the word “Roman.” Traditionally it was attributed to an author named “Srisena,” but later scholarship has found that he compiled the work from earlier sources, and apparently did so rather poorly. Even not too long after the work was written, there were those who doubted Srisena’s competence. The astronomer Brahmagupta, about whom I’ll have more to say later, wrote that Srisena had “taken a heap of jewels and turned it into a patched rag.” At any rate, the astronomy of the Romaka Siddhanta is quite similar to the astronomy of Ptolemy, and many of the measurements it presents are very close to the Ptolemaic values. Now this could, on the one hand, simply be a coincidence because the Ptolemaic values were fairly accurate, but they seem to be too similar to just be a coincidence. That said, the numbers aren’t identical either, which suggests that the Indian astronomers had taken Ptolemy’s techniques and used them to make their own measurements rather than copying his numbers wholesale. And, it should be said, as a reminder here of episodes 21 and 23, that when I say Ptolemy’s numbers and Ptolemy’s techniques, it’s really Hipparchus’s numbers and Hipparchus’s techniques and Ptolemy was mostly recording Hipparchus’s work for posterity. So, for example, in the Romaka Siddhanta, the length of the tropical year is given to be 365 days, 5 hours 55 minutes and 12 seconds, whereas Hipparchus had gotten a value of 365 days, 5 hours, 55 minutes and 15.8 seconds. So, these two measurements were within 4 seconds of each other, but they were both about 6"
