description = "In the Hellenistic Era the astronomer Apollonius of Perga (maybe) developed the model of epicycles and deferents that was to dominate Western astronomy for more than 1500 years. Around the same time, Eratosthenes, who was the head librarian at the Library of Alexandria, developed a novel technique to measure the circumference of the Earth and arrived at a suspiciously accurate result."
full_description = "Episode 20: The Theory of Epicycles & Deferents August 13, 2022 In the Hellenistic Era the astronomer Apollonius of Perga (maybe) developed the model of epicycles and deferents that was to dominate Western astronomy for more than 1500 years. Around the same time, Eratosthenes, who was the head librarian at the Library of Alexandria, developed a novel technique to measure the circumference of the Earth and arrived at a suspiciously accurate result. Transcript Good evening and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. Well in the last episode we finally made that irreversible plunge into the astronomy of the Hellenistic Era of Ancient Greece. At least kind of for Heraclides of Pontica, who technically did make it into the Hellenistic Era, but just barely. But Aristarchus of Samos was well and truly in the Hellenistic Era so now we’re stuck here. As we entered this era, you might have noticed one way that the podcast suddenly changed — that word, the “sources,” suddenly made a reprise to the show. When I first started talking about the astronomy of ancient Greece with Thales and Anaximander and Anaximenes, almost every other word out of my mouth was a caveat about how we don’t really know what they thought and we’re just making educated guesses because the sources are very poor. Nothing from the time survives and so we’re relying on summaries of quotations of excerpts from lost histories. But as we made our way through the centuries, those caveats got fewer and fewer until we got to Aristotle. To our good fortune, many works of Aristotle survive — and to our chagrin not all of them do, but we have enough that we can be pretty confident in the structure of his philosophy, including the structure of his astronomy. So things were looking pretty good. But then we got to Heraclides and Aristarchus and suddenly all that stopped. Now, to be clear, it’s not quite as bad as it was for the very earliest Greek astronomers like Thales. But we were once again back to closely reading quotations of fragments. So what happened here? It would make for a nice story if there was some catastrophe I could point to around this time, a war or fire or something that destroyed all the works from this time. But there wasn’t one, and if you think about it it wouldn’t be a very compelling explanation even if it were true because if that catastrophe destroyed the works from an astronomer in the early Hellenistic Age, why did it not destroy the earlier works of the astronomers in the late Classical Age? Instead it seems a big reason that it suddenly becomes harder to understand the astronomy of the early Hellenistic Age is that one of the most important sources for the earlier astronomers was a work by Theophrastus that I’ve referenced a few times, his History of Physics. The work itself didn’t survive, but it was influential enough that many later authors pulled from big sections of it so that we have a reasonably complete understanding of what it contained. But Theophrastus was a student of Aristotle and unfortunately, being a mere mortal, he was unable to include in his history any of the astronomers who lived after he did. So now that we have passed Theophrastus chronologically, we’re once again stuck with rather sub par sources for a little bit. Two of the major sources we have to use are a bit dicey. There is some work by an astronomer named Geminus who lived in the first century BC, and then another by the name of Cleomedes, whom we know so little about that he could have lived anywhere from the first century BC to 400 AD, so we can’t even place him to less than 450 years or so. So, with all that in mind, we’ll just dive right in to the next two most significant astronomers of the Hellenistic Age: Apollonius of Perga and Eratosthenes. Given that I’ve been harping on the lack of sources we have it won’t be too much of a surprise to you that we know basically nothing about Apollonius’s life. There is a brief biography from an author named Eutocius, who, in turn, was relying on an author named Heraclius, and we know absolutely nothing about this Heraclius except that he was someone called Heraclius. According to Eutocius, Apollonius was born during the reign of Ptolemy III, also called Ptolemy Euergetes. This places his birth sometime between 246 and 221 BC. Another author, Ptolemaeus Chennus, says that a famous astronomer named Apollonius lived during the reign of Ptolemy IV, known as Ptolemy Philopater, who reigned from 221 – 205 BC. Since he had to be at least in his twenties, and probably closer to his forties to be considered a famous astronomer by this point, this means that Apollonius was probably born pretty early on in Ptolemy III’s reign, so most scholars place his birth at around 240 BC, about 80 years after the death of Alexander and Aristotle. As his name implies, Apollonius of Perga was born in Perga, which is on the southern coast of Anatolia, but like most of the other philosophers of the time it’s assumed that he left his hometown when he came of age to study. Where he went we don’t exactly know, but it’s thought that he lived and worked in Ephesus, Pergamum, and Alexandria. Since Alexandria was the major intellectual center by this point it’s generally assumed that he spent most of his time in the city, but again we don’t really know for sure. The mathematician Pappus does say, however, that he studied in Alexandria. By this point Euclid had founded his famous mathematical school in Alexandria and Apollonius learned mathematics at this school. Pappus writes, “Apollonius spent a very long time with the pupils of Euclid at Alexandria, and it was thus that he acquired such a scientific habit of thought.” Now as an aside, this might sound like a nice thing of Pappus to say about Apollonius, but the surrounding context in Pappus’s text is a lot less generous. In the broader context Pappus is criticizing Apollonius for not giving Euclid sufficient credit in solving a particular mathematical problem. Petty academic disputes over credit are by no means unique to the modern age. Apollonius was as much a mathematician as he was an astronomer, if not more so, and his surviving works are all on mathematics. We’ve seen this pattern before with Aristarchus and Archimedes, who both had interests in mathematics and astronomy, and we will see this again in the future, too. The considerable overlap between astronomy and mathematics goes right back to Plato, who considered astronomy to simply be the highest form of mathematics. Just as plane geometry is the mathematics of two dimensions and solid geometry was the mathematics of three dimensions, astronomy was the mathematics of four dimensions, how solid objects move through time. By far and away Apollonius’s most important work was a text called Conica which was about conic sections. The book is a detailed exploration of a special class of curves that are generated by the intersection of a flat plane with a right cone. If the plane intersects the cone parallel to one of the edges, for example, you get a parabola; but if it instead intersects it at an oblique angle you get an ellipse; if it intersects perpendicularly to the axis of the cone you get a circle; and if it intersects it at a more extreme angle you get a hyperbola. Apollonius’s work firstly demonstrated a way to generate these various curves, but more importantly, showed how, despite their various shapes, they were all intimately related through this geometrical construction. Today we tend to think of these curves in algebraic terms where the connection is more obvious, namely that they are a family of curves that are quadratic in their x and y variables, but Apollonius was the first to see that they were connected at all, even if in geometric terms rather than algebraic terms. This work, Conica, turned out to be tremendously influential in the West. It was highly influential in Greek mathematics, but it was a very intimidating text, very dense and at the cutting edge of what was possible with the mathematics of the day, so by the Roman Era, it had become a text that was more admired than read, maybe with something like the status of Newton’s Principia or Darwin’s On the Origin of Species. Everyone had heard of it, but hardly anyone had actually read it. As we’ll get to when we talk about the astronomy of Rome, or lack thereof, the Romans did not have a very intellectual culture, so there wasn’t demand for a high octane book like this. The Romans more preferred the ancient equivalent of Reader’s Digest versions of Greek philosophy. In modern terms, they were big on pop science, not so big on actual science textbooks. The Islamic scholars of the Islamic Golden Age, by contrast, were a much more sophisticated bunch, and were very interested in pursuing advanced mathematics, so they translated Conica into Arabic and it was through them that the work survived out of antiquity. Now, conic sections are of more than purely mathematical interest. It will be many episodes before we arrive at this revelation in the chronology of the history of astronomy, but it turns out that the orbits of celestial bodies under gravitational attraction are all conic sections. We’re most familiar with the planetary orbits, which are ellipses. This is what is called the bound case because the two objects are gravitationally bound to each other. They don’t have enough energy to escape out to infinity. But if a celestial body does have enough energy that it can escape to infinity, its trajectory is described by a hyperbola, one of the other conic sections. And in the intermediate case where an object is just barely unbound, where in theory it would escape out to infinity but asymptotically approach zero velocity, its trajectory is described by a parabola, yet another conic section. It’s therefore maybe not too shocking that the man who popularized Apollonius’s Conica in the West was an astronomer. In the early 1700s, Edmond Halley, who we all know and love from Halley’s comet, had found copies of the Arabic translation of Apollonius’s Conica at the Bodlein Library at Oxford and took it upon himself to learn how to read Arabic so that he could translate the work into Latin and make it accessible to Western scholars. Incidentally, you may recall from last month that we heard about how both Aristarchus and Archimedes developed methods to write down very large numbers, and along these same lines, Apollonius also wrote a work, unfortunately lost, which presented another method of representing large numbers, and what’s more, he demonstrated a technique to multiply them. Now these days, of course, we learn how to multiply numbers of arbitrary size in elementary school this may seem like no big thing, but the Arabic numeral system that we use does quite a lot of the heavy lifting for us. Figuring out how to do this in a numbering system that lacks a zero is not quite as trivial. Well as far as his astronomy goes, Apollonius is generally credited with developing the system of deferents and epicycles, though as I mentioned in the last episode, the evidence is somewhat ambiguous and a case can be made that the model had been developed earlier and was simply refined by Apollonius. Nevertheless since Apollonius is the figure most closely associated with epicycles, now is as good a time as any to go into a little more detail about how this model worked. The theory of epicycles is famously a geocentric model of the Solar System. So the Earth is at the center of the universe, and the Sun, Moon, and all five of the classical planets all revolve around the Earth. Now, the simplest model you can make is to suppose that the planets revolve around the Earth in perfect circles moving at a constant speed. This more or less works since over time you see the planets drifting through the constellations of the zodiac, some, like Mars, doing so relatively rapidly, taking a bit less than two years to move through a full 360 degrees, and others like Saturn taking their time at a rate of nearly 30 years to do so. But if you look more carefully, this simple model of perfect circular motion cannot explain the observed motions of the planets. The planets don’t move at a constant speed through the zodiac. Sometimes they move faster and sometimes they move slower. And, in fact, sometimes they even slow to a stop and start moving in the other direction. Now, Eudoxus had tried to model this phenomenon as a superposition of the motions of two spheres centered on the Earth. This worked to produce the qualitative behavior of retrograde motion, and really worked quite well for the more distant planets like Jupiter and Saturn whose retrograde motion is somewhat minimal, but for the closer planets with more extreme retrograde motion it did not do a very good job and his successor Callippus had to fix this by superimposing the motions of even more spheres, which produced an extremely complicated motion. The model of deferents and epicycles tries to explain the variable motion of the planets another way. Rather than directly revolving in a circle around the Earth, a planet revolves in a little circle around an invisible point in space. This little circle is called an epicycle and its center is called the deferent. The deferent, in turn, revolves in a circle around the Earth. The motion along the epicycle is in the same sense as the motion of the deferent. So if one is counterclockwise, the other will be counterclockwise as well. The period of revolution of the deferent is just the sidereal period of the planet, the time it takes to journey 360 degrees through the zodiac. So, for Mars that’s a bit less than two years and for Saturn it’s close to 30 years. Simultaneously, the planet also travels around its epicycle once per year. Or, at least, that’s how we’d describe it today. In modern terms we would say that the planet rotates around its epicycle once per year. But the ancient Greeks defined one revolution a little differently. The way we would do it is with respect to absolute space. So, how long does it take the planet to move 360 degrees in its epicycle around the deferent. But the Greeks defined a single revolution to be when the planet goes from its most distant point from the Earth back to its most distant point from the Earth. Since the center of the epicycle, the deferent, is moving as the planet revolves around its epicycle, it has to travel a little farther than it otherwise would to get back to its most distant point from Earth. So according to the Greeks, the period of a planet’s motion around the epicycle is what is called the synodic period, which is the time from opposition to opposition. For the more distant planets, this isn’t really a very big difference from a year because the deferent moves so slowly that the planet doesn’t have to move much farther to return to i"
