title = "The Song of Urania Podcast"
description = "We turn back the clock and see how a variety of Greek astronomers over the centuries contributed to the Greek calendar, and how Greek politicians ignored their developments. Then we see how the discovery that the seasons are not of equal lengths posed a problem for Eudoxus's theory of planetary motion."
full_description = "Episode 17: The Attic Calendar and its Discontents May 16, 2022 We turn back the clock and see how a variety of Greek astronomers over the centuries contributed to the Greek calendar, and how Greek politicians ignored their developments. Then we see how the discovery that the seasons are not of equal lengths posed a problem for Eudoxus's theory of planetary motion. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present, with new episodes every full moon. My name is Joe Antognini. Well I’m afraid that I have to open this episode with an erratum. Last month the star of the show was the astronomer Eudoxus. Or at least, that is what I led you to believe. But I was mispronouncing his name the entire episode like some sort of rube. In fact his name is properly pronounced Eudoxus. The correct order of operations when it comes to Greek names is to first look up the pronunciation and then say it, but in this case I did it backwards. Mea culpa. Well, in the grand narrative of the Greek astronomy we’ve been following so far, the early astronomy began with what we might call cosmological speculations. The questions that the earliest Greek astronomers were trying to answer were: what is the structure of the universe, what’s the shape of the Earth, how are the planets arranged, and, above all, what is the arche, the fundamental nature of matter? Over the centuries there had been a lot of thought that went into answering these questions, but from a modern scientific perspective, there was not too much to show for it. But in Eudoxus, our star of the last episode, we see something really different — the first serious attempt at a mathematical model of planetary motions. Now, this episode is going to be a little unusual in that we will spend some time seeing how students of Eudoxus’s school developed his model of homocentric spheres, but I also want to go back and fill in a few gaps before we do. In studying Greek astronomy, we are like the drunk searching for his keys under the street lamp. As I’ve tried to emphasize, not too much of early Greek intellectual life survives, and almost all of what does is filtered through summaries of quotations of later authors. So our picture of what ancient Greek astronomy was like is inevitably colored by the interests of these later authors. Now, one of the things that these later authors were interested in was questions about the fundamental nature of matter and the structure of the universe. Because they hadn’t really made much progress in answering these questions, the viewpoints of the ancient philosophers going all the way back to the Ionian School and Thales were still relevant to them — those philosophers might have something to teach them, so they listened to what they had to say. But when it came to modeling planetary motions, things were a little different. Those later astronomers were also interested in modeling the motions of the planets, but their later models were far more accurate than those of Eudoxus, so they really didn’t have much use for Eudoxus’s model. It was just obsolete. Fortunately for those of us interested in the history of astronomy the basic outline of the model survived, but only just barely. As I discussed in last month’s episode, there are only a few references to it, and it wasn’t until the late 1800s AD that anyone reconstructed it in detail. Well, there is another important use for astronomy that I have almost completely neglected until now. When I was talking about Babylonian astronomy I went into great detail about how important astronomy was for their calendar. But I haven’t really talked about the Greek calendar at all. You might be forgiven for assuming that Greek astronomers just weren’t interested in timekeeping. And, really, if you read through the surviving texts, you might still come to that conclusion. But, like any good astronomer, we have to beware of selection biases. Later astronomers didn’t really have any interest in the calendars from centuries before, so the work of earlier astronomers around timekeeping makes hardly a trace in the surviving literature. But that doesn’t mean that it didn’t exist. There are enough oblique references, maybe only a single sentence for some astronomers, that we can at least be sure that the work on using astronomy for timekeeping was a part of Greek astronomy even if we can’t know nearly as much about it as we would like. So, at this point we’re going to turn the clock back considerably. When we left off last episode, we had finished up with Eudoxus, which had brought us to the middle of the 4th century BC — the 350s, or so, when Eudoxus died. We’ll start by going back a bit more than 150 years, to the late 6th century BC. Now, Greek society, like many others across the globe, found the Moon to be extremely convenient for timekeeping. Way back in the second episode I talked about the three natural clocks that we have available to us: the daily rising and setting of the Sun, the phases of the Moon, and the annual change of the seasons. In the course of ordinary life in an agricultural society it’s necessary to keep track of the days — you have to be up when the Sun is up and without cheap lighting, there wasn’t much that could be done after it was down. So then, to a much greater degree than today, the Sun’s daily rising and setting regulated human activity. Then of course it was necessary to keep track of the years. Different crops needed to be sown and harvested at different times of the year. So the annual change of the seasons also regulated human activity. But what about the Moon? Why keep track of the phases of the Moon? Well, one good reason is that the Moon tracked a regular rhythm for half of all humans. After all, by a remarkable coincidence the 29 and a half day period of the Moon’s phases corresponds fairly closely to the average length of the menstrual cycle. In fact the word menstruation has the same etymological root as the word Moon, as does the word month. It’s perhaps no surprise then, that lunar deities were feminine in most cultures across the world, the Greeks being no exception, though the Babylonians were one of the minority cultures who had a male lunar deity. And as an aside, the close correspondence between the cycles seen in the heavens and the rhythms on Earth was one of the reasons that astrology was so attractive in the ancient world. Clearly the position of the Sun on the sky had an effect on our daily life, as did the Moon. Is it really so preposterous to suppose that the other features of the sky might affect us, too? The planets were fainter, so presumably the effects were weaker, but perhaps with careful study the learned astrologer could understand what those effects were and what that would mean for the affairs of Earth. I haven’t said much about Greek astrology yet, but that’s not to say that it didn’t exist. It certainly did, and I’ll have a lot more to say about the Greeks and astrology in a few episodes once we get to Ptolemy, because although today he’s known for his sophisticated planetary model, in his own time and throughout the Middle Ages, he was better known for his astrology But to get back to the original topic, why a society would bother with keeping track of the cycles of the Moon, one reason to do this was that it seemed to more or less regulate one of the rhythms of human activity, the menstrual cycle. But beyond that, the monthly changes in the Moon’s phases is just blindingly obvious. It is easy for those of us in the modern world to live as though the night sky doesn’t exist. We can go weeks without really looking at it and just forget that it’s even there. We spend most of our time indoors, we live in cities — even those of us who live in small towns would be living in the equivalent of a metropolis in the ancient world. And our cities are filled with artificial lighting. If we ever do bother to look up, there’s just not a lot to see. But it wasn’t so in the ancient world. The only artificial lighting came from fires and was expensive and limited. Unless you’ve been in a really dark site, it’s hard to describe just how prominent the Moon is in a truly dark sky. A full moon can actually feel blinding. So one reason to keep track of the phases of the Moon is for the simple reason that that you really couldn’t help it. So, if you lived in an ancient society and you want to keep track of time, turning to the phases of the Moon was an obvious choice. Of course you’ll keep track of days as well, but there are really no other obvious units of time. Sure there’s the year as well, but the year is not a very precise unit of time. You can generally tell if you’re in the middle of summer or winter, but figuring out exactly how many days are in the year is not trivial. It requires very careful observation of the locations of sunrises or sunsets or solar elevations, and even then it’s easy to get off by a day or two. But the phases of the Moon are very easy to observe. So if you want any coarser unit of time than a day you’re stuck with months. Now, another option would be to just come up with some arbitrary grouping of days — say, every twelve days or every ten days, or any other random number like seven. A seven day grouping is actually a bit more natural than it would initially appear, since it’s about the length of a single phase of the Moon and one fourth of a month. But for the next several centuries the concept of a seven day grouping would be confined to Near East. And different cultures chose different groupings. The Etruscans used an eight day week, the Aztecs and Mayans used 13 day weeks, the Javanese used a five day week, and the Egyptians used a 10 day week. At any rate, all this is to say that really the only principled choice of timekeeping in the ancient world was the month, governed by the lunar cycle. And the Greeks were no different than other societies in this regard. They kept track of the months. Now, as I said perhaps ad nauseum when I was talking about Babylonian astronomy, really the fundamental problem in astronomy that societies had to deal with was the fact that the length of the month does not neatly divide the length of the year. So you keep track of the months, but over time the months that used to be in summer start to drift earlier and earlier in the year and start to come during spring. The usual solution to this problem is called intercalation, which is a fancy way of saying that every now and again you stick an extra 13th month into the year, and this pushes the months back to where they’re supposed to be with respect to the seasons. Well, with all that prelude we can start to look at some of the astronomers that we have hitherto neglected during our journey through ancient Greece. The first of these is Cleostratus of Tenedos. Now, going back to the drunk searching under the streetlight, part of the reason that these astronomers are neglected by modern historians of astronomy is that they were neglected by early historians of astronomy, so we really just don’t have that much to say about them. In the case of Cleostratus, we know that he lived during the early 5th century BC, so at the beginning of the Classical period of Ancient Greece, roughly contemporaneous with Anaxagoras. Pliny the Elder stated that he was the first to specify the signs of the zodiac. And just to remind you, the signs of the zodiac are distinct from the constellations of the zodiac. The constellations of the zodiac are nice to look at, but they’re kind of useless for astronomy because they’re of all different sizes. But as a way to observe the progression of the planets along the ecliptic, it’s useful to divide up the ecliptic into 12 equal regions of 30 degrees. These regions roughly match up with the corresponding constellation in the zodiac, but all else being equal each planet spends an equal amount of time progressing through each sign since they’re all 30 degrees wide. This idea was not original to the Greeks, the Babylonians did this as well, as did other cultures like the Chinese which we’ll discuss in future episodes. But whether or not Cleostratus developed this idea independently or got the idea from the Babylonians we don’t know. Cleostratus apparently also made observations of the solstices from Mount Ida, which is in northwestern Anatolia. Now this is an interesting thing to know because the reason you would do this is to figure out when the solstice was, and this would allow you to figure out how long the year was. So Cleostratus was probably the first Greek astronomer to make the crucial measurement of the length of a year. Cleostratus’s major innovation, though, was a cycle called the octaeteris, which was an intercalation cycle of eight years. This was really the first attempt to solve the fundamental problem of practical astronomy, how to figure out how many months there would be in a year. Cleostratus had found that over eight years there are about 2922 days, and this is very close to 99 lunar months. There are 2923 and a half days in those 99 months, so there is only a one and a half day difference between the two. This worked out very nicely with the Greek system of Olympiads, as well. So you would add one extra month in the first Olympiad, giving you 49 months, and then you would add two extra months in the following Olympiad, giving you 50 months. Then the cycle would repeat. So by the early Classical Period, we have some evidence that Greek astronomers were attempting to quantify the durations of months and years and determine how to make these two periods commensurate with each other. Sometime around the end of Cleostratus’s life there came of age another, even shadowier astronomer, by the name of Phaeinos. We have no evidence that Phaeinos interacted with Cleostratus at all, but like Cleostratus he took measurements of the solstices from a mountain, although in his case it was Mt. Lycabettus instead of Mt. Ida. For those of you not up on your Greek geography, Mt. Lycabettus is a big hill in the center of Athens, calling it Mt. Lycabettus is maybe a bit of an overstatement. But at any rate, Phaeinos lived in Athens though he was not actually an Athenian citizen. He was what was called a metic, or a foreign resident of Athens. Now, this does not necessarily mean he wasn’t born in Athens. In ancient Greece citizenship was inherited rather than determined by your place of birth, so a metic could have moved to Athens a few months ago, or could be the descendent of a family of metics who had lived in Athens for generations. Well, in the case of Phaeinos we really can’t say because exactly one line survives about his life. But that line from Theophrastus tells us that he was a metic who measured the solstices on Mt. Lycabettus, and importantly, taught Meton of a particular cycle. So Phaeinos managed to escape consignment to historical oblivion by the skin of his te"
