description = "After Wang Mang had usurped the Imperial throne, a disastrous series of reforms led to the collapse of his dynasty. The reestablishment of the Han Dynasty called for yet another calendar reform. About a millennium later, a group of officials, including the astronomer Shen Kuo, instigated a treacherous period in court politics by pressing for a radical set of reforms called the New Policies."
full_description = "Episode 42: A Tale of Two Reforms May 29, 2024 After Wang Mang had usurped the Imperial throne, a disastrous series of reforms led to the collapse of his dynasty. The reestablishment of the Han Dynasty called for yet another calendar reform. About a millennium later, a group of officials, including the astronomer Shen Kuo, instigated a treacherous period in court politics by pressing for a radical set of reforms called the New Policies. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon, or thereabouts. My name is Joe Antognini. To start off with, my apologies that this episode is a little later than normal. I was all set to record right on schedule, but I ended up contracting a cold the day before I was supposed to record. So I took an extra couple of days to wait for my voice to get at least somewhat back to normal. But now it is and so the show must go on. Well, last month we looked at some of the astronomical developments that happened around the rise of the Xin dynasty in the early 1st century AD. In particular, the establishment of a new imperial dynasty demanded the promulgation of a new calendar. And the astronomer Liu Xin was up to the task and created a calendar called the Triple Concordance system that wove numerological significance into the lengths of the seasons, months, and planetary motions. Now, the new emperor, Wang Mang, had certainly hoped that the new dynasty he inaugurated would outshine the great Han Dynasty in glory and stretch across the centuries. But it was not to be. Wang Mang had lined things up for his usurpation of the throne quite nicely in the palace. He had aligned important factions with him, in particular the Confucian court scholars. But outside the palace his standing was dicier. At first it seems to have been the minor officials who had misgivings. Wang Mang was a die-hard Confucian, and the Confucians, as a rule, tended to romanticize the Zhou Dynasty. Confucius, of course, lived during the Zhou Dynasty and scholars believed that the Zhou Dynasty most properly embodied Confucian ideals. So, as Wang Mang was setting up his dynasty and overhauling the government, he wanted things done right. He wanted them done the Confucian way. But the true Confucian way hadn’t been done for many centuries, so what exactly it was wasn’t clear. Wang Mang employed an army of scholars to scour the ancient texts for clues about the proper mechanism for deciding this or that. And, in the end, not much got decided, and what did get decided took a long time to happen. It did not help matters that Wang Mang was a quintessential micromanager. So officials out in the country were unable to do anything about the problems they had until they got an answer from the emperor himself, and the emperor was taking a long time to come to any answer at all. Now this in itself may not have been that big of a problem for the officials. I’m sure many officials throughout history would have been quite happy to sit around doing nothing for years and protest that they were just waiting for word from the emperor before they could get to work. But one of the projects that was on Emperor Wang’s plate was to revamp the compensation scheme, and as a consequence of this, until it was completed, none of the officials got paid, and this lasted years. To support themselves, these officials started to demand bribes, and this, in turn, started to breed resentment among the common folk. But, after a few years Wang Mang’s work restoring a Confucian system of government based on his understanding of Zhou dynasty practices started to yield fruit, and these policies began to be implemented. But unfortunately, to continue the metaphor, the fruit these policies bore was not as good as he had hoped. A representative debacle was a series of reforms that introduced a new system of coinage. During the Han Dynasty, the vast majority of coins were made of bronze and were called qian, or cash coins in English. They were round with a square hole in the middle. You could then keep your money organized by threading a string through a stack of these coins. Typically coins would be strung together in groups of a thousand, and this was a standard monetary unit that merchants would do business with. Well, based on Zhou Dynasty practices, Wang Mang introduced a rather baroque coinage system consisting of 18 different kinds of coins, with varying shapes, materials, and denominations. Some of these were made of tortoise shells and cowrie shells. And some were quite easy to forge. Use of the earlier Han Dynasty coins was outlawed. These diktats were so heavy handed that trade almost completely collapsed over the next few years. Another even more catastrophic policy was the introduction, or reintroduction in Wang Mang’s eyes, of an old farming system called the well-field system. Under this system Wang Mang effectively nationalized all land ownership overnight. Private land ownership became forbidden. Eight families would be assigned to work on a square plot of land. The land was divided up into a 3x3 grid, and each family would get one of the eight divisions on the periphery of the grid. These divisions would be around 20 acres or so. Anything the families grew on their own land they could keep. The central plot in the middle was assigned to the state, and the eight families were to work on the middle plot collectively and hand over all produce from that plot to the state. Naturally, instituting this system was a tremendous upheaval to the commoners and the big land owning aristocracy was none too happy with losing all of their land. In the end this system survived only three years. But this wasn’t the end of Wang Mang’s disastrous interventions into his country’s economy. He declared a state monopoly on salt, fishing, timber, and worst of all, alcohol. He imposed a so-called sloth tax which taxed the unemployed. Consequently many poor urbanites and people living in marginal lands were forced into slavery to pay the tax. He imposed the first income tax in China at a mind boggling rate of 10 percent. All this is to say that while Wang Mang had the Confucian scholars firmly behind him, over a decade he had turned essentially everyone else in the country against him. As the years passed, revolts began to pop up in various corners of the country, usually minor officials who rallied large numbers of disaffected peasants. The first few of these did not pose a serious threat to Wang Mang’s rule, but in time the revolts grew in scale. These culminated in the Red Eyebrows movement, so called because the participants painted their eyebrows red so that they could distinguish themselves from the Emperor’s forces. Ultimately the Red Eyebrows managed to sack the capital city and beheaded Wang Mang. Apparently the peasants kicked his head around like a soccer ball and someone even cut out the late emperor’s tongue and ate it. Well, after this turn of events there was a chaotic period of a few years as a number of members of the old Han family claimed the imperial throne only to be quickly deposed. But ultimately one of them, Liu Xiu, the great-great-great-great grandson of Emperor Jing, came out on top. In 25 AD he had more or less won control of the Han Kingdom and put forward his claim to rule the entire empire, and after another 12 years of hard fighting he managed to subdue the entire empire under his rule, beginning the second half of the Han Dynasty, known as the Later Han, or Eastern Han because the new emperor shifted the capital from the sacked city of Chang’an to the eastern city of Luoyang. Well, despite the chaos of the broader political context, the astronomers seem to have kept right on doing their work throughout all of this. In 32 AD, when Liu Xiu was well on his way to gaining control over the entire empire but still had a good five years to go, astronomers began to note that their observations were not matching their predictions. They had been using the new Triple Concordance system that we talked about in the last episode, that was inaugurated by the new Xin Dynasty. But the moon’s actual position was ahead of its predicted position by about a day. The astronomers brought their concerns to the new Emperor, but understandably the Emperor felt he had more pressing matters to attend to at the moment, so the issues with the calendar were set aside for the time being. Over the next half century the predictions from the official calendar continued to lag. During this period some of the astronomers appear to have rebelled against the official timekeeping system and unofficially developed an alternative system that was more in line with their observations, called the Quarter Remainder system. But until the emperor officially instituted a new calendar, these alternative predictions were simply for the astronomers’ private enjoyment. The issues with the old Triple Concordance system from the defunct Xin dynasty continued to fester until 85 AD. By this point two things had happened: first, the discrepancies had become too large to sweep under the rug, and second, things had settled down in the empire. The emperor of the time, Emperor Zhang, was the third emperor of the Later Han Dynasty and his reign is regarded as being one of the high points of the era. The emperor asked his astronomers why their predictions were so poor. The astronomers protested that they knew that the predictions were poor, but the calendar was the calendar and it wasn’t in their power to change it. But if the emperor so wished, it was, of course, within his prerogative to change it. Having now reestablished the Han Dynasty on firm footing, it did seem to be an appropriate time to promulgate a new calendar, so the emperor ordered that it be done. Fortunately for the astronomers, the work involved in this calendar reform seems to have been rather limited since they had essentially already developed the new calendar years before and had just been using it unofficially. So this particular calendar reform was quite fast. Within a few months of the emperor hauling the astronomers before him to account for their errors he was giving his blessing to the new Quarter Remainder calendar. It’s at this point, shortly after this latest calendar reform of 85 AD that reestablishes the Han Dynasty, that the astronomer Jia Kui enters the picture. Jia Kui was a respected astronomer, but he wasn’t among those tapped to lead the calendar reform. Not long after it had been promulgated, he was, however, brought in to review a peculiarity of the new calendar. In general, the months alternated between short months of 29 days and long months of 30 days. In this new calendar, the first month in the overall cycle was assigned to be a full month of 30 days rather than a short month of 29 days as had been customary. With a team of 10 astronomers Jia Kui was able to determine that the traditional practice of starting the cycle with a short month was correct. It seems that in the course of his review, however, Jia Kui discovered some more fundamental problems with the Quarter Remainder system. The issue he discovered is that a calendar that predicts things like the solstices or phases of the moon essentially has two components: the period of the phenomenon, and then the origin, or the starting point. So, in modern terms, the calendar might specify that the time from new moon to new moon was, say, 29.53085 days as it was in the Quarter Remainder system. And then the calendar would also specify that, for example, midnight of December 25, 162 BC was a new moon. Then, to predict the date of the new moon in future, you would, in effect, just add repeatedly add 29.53085 days to the start date of December 25, 162 BC. This would then enumerate all of the full moons in your calendar. Now, this meant that your calendar could be inaccurate in two ways: the period could be off, or the origin point could be off. If the period is off, then the calendar might start out making good predictions, but over time the predictions will get worse and worse as the errors from the incorrect period accumulate. If the origin is incorrect but the period is correct, then there will always just be a systematic error in your predictions. You’ll always be off by the same amount and it won’t get any better or worse over time. What Jia Kui figured out was that although the new Quarter Remainder system was making better predictions than the old Triple Concordance system, it basically got there by accident. The new Quarter Remainder system actually had a worse estimate of the period of the moon’s orbit, but it happened to also choose a more inaccurate origin point and these two errors had essentially cancelled out in the late first century. But because the period was worse, this happy state of affairs couldn’t last, and eventually the new calendar would start making worse predictions than the old one. So, how did Jia Kui know that the origin point for the new Quarter Remainder system was wrong? After all, its origin was in 162 BC and of course Jia Kui was not around then. And at any rate, any recorded observations from that time were also available to Liu Xin when he developed the previous Triple Concordance system. Jia Kui’s main innovation was that he realized that new moons and solar eclipses were not independent events. Generally speaking, determining when the new moon is is very difficult because the moon passes very close to the Sun and can’t be seen. So you have to infer it from other observations at different times. But this means that recordings of new moons in past records were not all that accurate, and in fact most of the recorded new moons were not real measurements but just dates that the calendar of the time said was a new moon. The one exception is if there happens to be a solar eclipse. If you observe a solar eclipse, total or partial, you know precisely when the new moon is. Prior to this point in Chinese astronomy there hadn’t really been any connection between eclipses and phases of the moon. In fact past records had a clear systematic bias where solar eclipses almost always were noted as happening on the last day of the month or sometimes even the day before that, which of course, was impossible. But at the time no one seemed to notice that this was an issue. As I mentioned a few episodes back, at the time there were a few different theories of eclipses floating around and the idea that the eclipse is caused by one celestial body shadowing another hadn’t become widely accepted. In more astrological theories the idea was simply that the moon would sap energy from the Sun when it shared the same lunar mansion. So observing a solar eclipse a day before the new moon wasn’t necessarily a contradictory observation in those terms. But with Jia Kui’s insight that solar eclipses could only happen on new moons, he could use the s"
