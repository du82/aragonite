description = "In this episode we examine the work of two Roman astrologers to see how Roman astrology worked in practice: Marcus Manilius, who wrote Astronomica, and Firmicus Maternus, who wrote the Matheseos."
full_description = "Episode 27: Astronomica March 10, 2023 In this episode we examine the work of two Roman astrologers to see how Roman astrology worked in practice: Marcus Manilius, who wrote Astronomica, and Firmicus Maternus, who wrote the Matheseos. Transcript Good evening, and welcome to the Song of Urania, a podcast about the history of astronomy from antiquity to the present with new episodes every full moon. My name is Joe Antognini. Last month we got a taste of the rather extensive political dimensions of astrology in ancient Rome. But the episode was focused mostly on why astrology was so influential in Rome and how the state tried to regulate this influence. But I had little to say on what the astrology of ancient Rome actually consisted of. In this month’s episode I’m going to try to remedy that by talking about one of the earlier and more complete descriptions of Roman astrology that comes to us through a work by a first century astrologer named Marcus Manilius entitled Astronomica. Now, I normally like to start these kinds of discussions by putting the person first and saying a little bit about their life. But in this case it’s very hard to do because as with so many figures from the ancient world we know basically nothing about Manilius’s life. The only thing that survives of him is just this work. No other Roman author even so much as mentions him. The only way we can even date the work is thanks to a couple of references to contemporary events that Manilius makes in the Astronomica. The most important one is a reference to the Battle of Teutoberg Forest of 9 AD. This was a catastrophic defeat for the Roman Army in which three full legions were ambushed and slaughtered by a coalition of Germanic tribes, and it’s hard to overstate the effect of this defeat on the Roman psyche. It was not only an enormous loss in terms of the sheer number of soldiers lost, but to the proud Romans it was a humiliating defeat as well, and it shattered the Roman’s sense of invincibility and set the northern bound of the Roman empire at the Rhine. At any rate, some small sense of the impact of this event in Rome can be seen by the mere fact that it’s referenced in a work on astrology. But for our purposes the main importance of Manilius mentioning the Battle of Teutoberg is that we can be sure that the work must have been written sometime after 9 AD. The second reference in the work that helps us to date it is a reference to the emperor. Unfortunately the emperor is simply referred to as “Caesar,” which is what all emperors were called in Rome, and so on its own isn’t especially helpful. But from the surrounding context it is probably referring to Augustus. Since Augustus died in 16 AD, the work is usually dated to sometime in the second decade of the first century. But it’s also possible that Manilius wrote the text after Augustus had died and was simply referring to the deceased emperor, or possibly that he was referring to his successor Tiberius. So that is really all we can say with some certainty about Manilius’s biography. There is even some dispute as to whether or not Manilius was actually Roman at all. Historians have periodically suggested that he was perhaps an educated Greek slave. The main motivation for this theory is that over the centuries literary critics have generally derided the quality of Manilius’s poetry, and this led to the supposition that perhaps his poetry was so bad because Latin was not his native tongue. And furthermore, despite my earlier assertion that no other Roman authors mention Manilius, there is in fact one passing reference by Pliny the Elder to an individual that might have been Manilius. Pliny was writing a kind of encyclopedia called the Natural History in the mid first century AD, and in this work he was talking about chalk, and in particular he went into the details about the kind of chalk that was used to color the feet of slaves when they went up for sale. In this discussion he mentions one such slave, named “Mannilius Antiochus” who he says is an astrological writer. But Pliny states that this individual was active in the mid first century BC, which is far too early since we know from the reference to the Battle of Teutoberg Forest that Manilius must have been writing after 9 AD. It’s possible that Pliny was just way off on when he thought Manilius was kicking around, but given that the Astronomica had only been written about 40 or 50 years earlier, it seems like a big mistake to make. It would be like someone today talking about how Steven Hawking was thinking about black holes in the 1890s. So the most probable interpretation is that there were just two astrologers over the years in Rome who both happened to have the name “Manilius.” So, there’s not much hard evidence to support the idea that Manilius was in fact a Greek slave. And on the other side, there are a few aspects of his writing which seem to support the idea that he was a native-born Roman. While it’s true that Manilius had his fair share of critics, there have also been defenders of his poetic style. His Latin might be a little inelegant, sure, but it’s oftentimes complex, which you might not necessarily expect of a non-native speaker. And more importantly, the overall viewpoint he presents in the text is very Roman-centric. He talks of himself as being the first to write about this “foreign” subject of astrology, which seems to imply that he is the first Roman to do so. He refers to Latin as “our” language, calls Rome, “the greatest of all things,” and generally shows a lot of rah-rah Roman pride. He identifies the constellation Libra as the symbol of Rome because it represents justice and empire. And when he talks about the Milky Way he says that the multitude of stars it contains are the souls of great men who have ascended to the heavens. He acknowledges that, yes, of course there are men of all nationalities up there, but most of them are Romans. Now, as I mentioned earlier, other than that one dubious reference by Pliny, Manilius’s name appears nowhere in the ancient literature. The Astronomica just stands alone as a completely independent work. So, for this reason, it’s hard to say whether or not the Astronomica is the best exemplar of first century Roman astrology. At least from what we have, it seems as though this work had no impact whatsoever and was totally ignored by the author’s contemporaries and all the rest of the Romans down the ages. Now, it’s possible that this is not true — perhaps many people read it and just never felt the need to cite it explicitly. Or maybe some people did, but their works were lost. As with so many things in the ancient world it is hard to say. But at least as a point of comparison we can look back to the poem Phaenomena of Aratus that I mentioned back in Episode 16. We know that this work was enormously popular because it was widely referenced throughout the Hellenistic and Roman world, and some of these references state that it was actually used as an astronomy textbook for schoolchildren. But nothing of the sort exists for the Astronomica of Marcus Manilius, so it’s very hard to say how well received this work was, except that we can be pretty sure it wasn’t a blockbuster in the same way that Aratus’s Phaenomena was. Because it seems to have been a fairly obscure work, its textual history is a bit interesting. It seems to have survived in various monasteries over the centuries and went unnoticed until 1417, when an Italian scholar named Poggio Bracciolini found it in some library or other, either in France, Germany, or Switzerland, he didn’t say. Bracciolini couldn’t take the original back home to Italy with him of course, that was out of the question, so he hired a scribe to make a copy of the document. But he seems to have done a poor job choosing his scribe because the copy his scribe made was terrible, riddled with errors, and he complained that his scribe was “ignornantissimus omnium viventium,” the most ignorant of all the living. Well, even after its discovery in the 15th century, the text was still basically ignored until the early 20th century when the great classicist A.E. Housman devoted much of his scholarly life to translating and annotating the text. Housman’s decision to expend so much effort on this one text bewildered his fellow scholars, and the bewilderment continues right down to this day. In his time, Housman was considered to be one of the most knowledgeable classicists of all time, a true giant in the field. Now, the Astronomica is an okay work and all, but let’s face it, Greek and Roman literature have a lot more to offer. So seeing this great figure spend so much of his life on such a middling work has long been a disappointment to classicists. To make a perhaps unfair analogy it would be a little as though the young Jimi Hendrix, rather than picking up the guitar, decided to spend his life learning to play the kazoo. I’m sure he would have been a great kazoo player, but the rest of the world would have wondered what could have been if he had chosen an instrument worthier of his talent. Okay, so that’s the little we know about the man who wrote the text and how we came to be aware of it. So let’s turn now to the text itself. One thing to mention right off the bat is the title of the work, “Astronomica.” In modern terms the text is about astrology, but in the ancient world, there was no real distinction between the terms astrology and astronomy. The ancient Greeks and Romans did recognize a distinction in the subject matter between what we today call astronomy and astrology — Ptolemy, for example devoted his Almagest to astronomy and put his astrological material in the Tetrabiblos. But there weren’t separate terms used to label these two subjects. Ancient authors used the terms astronomia and astrologia more or less interchangeably to refer to the generic study of the stars. If one were to force a distinction, astrologia was perhaps the more general term whereas astronomia was associated more with Plato and his school and could be more esoteric. So, although from a modern perspective a book entitled Astronomica would purport to be about astronomy, it was a largely astrological work. Manilius divided the Astronomica into five books. At a high level, the first book presents a description of the universe, and especially describes the constellations. The second and third books focus on the zodiac, the band of constellations along the ecliptic, the path of the Sun in the sky. These first three books form the astronomical foundation. The fourth book then dives into the real meat of the astrology and describes the influence of the zodiac on Earth. The fifth book then presents some cutting edge astrological research and talks about the influence of constellations that are not in the zodiac on the Earth. Astronomica shares a common feature of other treatises on astrology from the era and opens with a defense of the value of the study of astrology. Manilius opens by saying: By song I undertake to draw down from heaven the divine arts and the stars, knowledgeable of fate, which govern the diverse fortunes of men, a work of divine reason. Now as I mentioned earlier, while the ancient Greeks and Romans didn’t use different terms to distinguish astronomy and astrology, they recognized that the two were distinct subjects, and Manilius argues that astronomy is a beautiful subject, but nevertheless it is only the foundation of a much more beautiful subject, namely astrology, to use the modern terms. Of astronomy he says: It is pleasing to walk through the air itself and live strolling in the immense sky and to learn about the constellations and the contrary movements of the planets. But then goes on to say: It is more pleasing to know in depth the very heart of the universe and to see how it governs and brings forth living beings by means of its signs and to speak of it in verse, with Phoebus providing the tune. In other words, astronomy is wonderful and all, but in the end astrology is the higher subject. Nevertheless, Manilius cautions the reader that it is necessary to learn the foundations of astronomy before proceeding to astrology: And since the song descends from high heaven and the fixed order of fate comes to Earth, I first must sing of the shape of nature and fashion the image of the entire universe. And so he spends the first book doing just that. Now, nothing in his overview of the fundamentals of astronomy will be especially novel to us now that we are intimately familiar with ancient Greek astronomy, but it is a good summary of what we might call the standard model of the universe in ancient Greece and Rome that educated people all more or less had in their heads. The model is basically the same one that Aristotle had proposed three centuries earlier with a few modifications. The universe consists of two spheres: a hollow outer sphere made of fire, which constituted the heavens, and an solid inner sphere made of Earth which constituted, you guessed it, the Earth. Manilius even rehearses the usual arguments for the roundness of the Earth. He makes the philosophical argument that the sphere is the most divine shape, and therefore most worthy of the universe. And he answers the objection about why the Earth does not fall down by reviving Anaximander’s argument from five centuries earlier that the Earth does not fall due to symmetry — it is equidistant from all other points in the universe so it cannot chose a direction to move. Then he goes on to the empirical arguments with varying degrees of success. He makes the point that if the Earth were flat, we would be able to see all the constellations at once, but some constellations are only visible in summer, and others are only visible in winter. So far so good. Then he brings up lunar eclipses as another argument for the Earth being round, but unfortunately here he mangles the argument. Manilius says that we can tell that the Earth is round because lunar eclipses are not visible everywhere on Earth. But in fact, lunar eclipses are visible everywhere on Earth, at least everywhere that it is night, and either way this doesn’t really have any bearing on whether or not the Earth is round. The real argument is that the shadow the Earth casts on the moon is always curved no matter where on the sky the eclipse occurs. But Manilius seems to have not understood this argument. As an aside, Manilius also makes a number of other rather basic errors about astronomy in the work which has led to some speculation that he may not have primarily been an astrologer but was first and foremost a poet who happened to be somewhat learned on matters of astrology, somewhat like Aratus. Now Manilius does not give any indication as to the size of the universe, but he does point out that the distance from the Earth to the heavens is equal to the length of two signs of the zodiac. Since each sign is 30 degrees across, this means that he has ef"
