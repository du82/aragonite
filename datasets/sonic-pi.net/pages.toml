title = "Sonic Pi - The Live Coding Music Synth for Everyone"
description = "Sonic Pi is a new kind of instrument for a new generation of musicians. It is simple to learn, powerful enough for live performances and free to download."
full_description = "Sonic Pi Experience the sound of code. Sonic Pi is your free code-based music creation and performance tool. Powerful for professional musicians and DJs. Expressive for composition and performance. Accessible for blind and partially sighted people. Simple for computing and music lessons. Learn to code creatively by composing or performing music in an incredible range of styles from Classical & Jazz to Hip hop & EDM. Free for everyone with a friendly tutorial. Brought to you by Sam Aaron and the Sonic Pi Core Team. Windows macOS Raspberry Pi OS Live Code Everything Sonic Pi lets you use simple code to turn your computer into a fully networked live coding music studio: Multi Channel Audio In/Out Well-timed MIDI In/Out Well-timed OSC (Open Sound Control) In/Out Ableton's Link network metronome built-in Take the Course Sonic Pi Creator Sam Aaron has created a series of tutorial courses that will kick-start your live coding journey. Free Lesson Preview 4. Exploring Synths Learn how to trigger expressive synth sounds with simple code Sonic Pi - Introduction Join Sonic Pi's creator Sam Aaron and learn to express yourself with code. This course will teach you the basics of live coding your own performances and compositions using the powerful live coding software Sonic Pi. Buy now Sponsors The following organisations are kindly supporting Sonic Pi's mission of lowering the many barriers to entry for creative experiences with code: Please consider asking your employer to sponsor Sonic Pi. Community Support Please consider joining our wonderful community of supporters helping to keep Sonic Pi free for everyone. Support via Patreon Support via GitHub Sponsors Code. Music. Live. Sonic Pi is a new kind of musical instrument. Watch how you can use it for live performances from ambient sets to dance music in nightclubs.... Array by DJ_Dave Sonic Pi Band - Sam Aaron & Ben Smith Reeled - Jylda & Sam Aaron Daft Punk - Aerodynamiccoded by Sébastien Rannou Welcome to our Community Join the friendly Sonic Pi community and share your ideas and thoughts with other educators, musicians and live coders... Come and join the conversation..."
