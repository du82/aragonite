["https://sonicvisualiser.org/sonic-lineup/doc/reference/1.0/en/index.html"]
title = "Sonic Lineup: A Brief Reference"
full_description = 'Sonic Lineup is an application for comparative visualisation and alignment of related audio recordings. This is a brief reference manual explaining the concepts used in Sonic Lineup and how to use it. This manual describes Sonic Lineup version 1.0. This document is Copyright 2019 Queen Mary, University of London. You may modify and redistribute it under the terms of the Creative Commons Attribution-ShareAlike 2.5 License. See http://creativecommons.org/licenses/by-sa/2.5/ for details. Sonic Lineup is intended for visualisation and inspection of multiple audio files which are related by way of representing the same "source material". This could mean they are recordings of different performances of the same work; different recordings of the same performance; different "takes" of parts in a studio session; or perhaps recordings of variant works or cover songs, so long as they are broadly structurally similar. With multiple such audio files loaded, Sonic Lineup will attempt to align them in time, based on an analysis of their audio content, so that you can navigate them in sync with one another in terms of the common musical content they represent. A number of different visualisation modes are provided, and switching modes takes effect for all loaded files at once. Sonic Lineup is not designed for editing, annotation, precision measurement, or any custom analysis of audio. No editing facilities are included, no adjustable parameters for the visualisation modes are provided, and it is not possible to save or export any kind of annotation or session information. In contrast to Sonic Visualiser, Sonic Lineup is intended for "quick" comparative analysis, rather than for intensive study. Most of the Sonic Lineup window is taken up with views of each of the audio files that you have opened, each in a different colour. In the very centre of each view is the aligned playback position line, a solid white line. The translucent white lines snaking down across the views are the salient feature layer mappings.'
