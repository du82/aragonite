["https://sonicvisualiser.org/doc/tutorial/en/selections-inspection.html"]
title = "Sonic Visualiser: Using selections when studying sections of a piece"
full_description = '''For this task we will be referring to this excerpt from the fourth movement of Prokofiev's Scythian Suite (D�sir� Defauw / Chicago Symphony Orchestra 1945, transferred from RCA Victor 78 by Bill Anderson). Playing this piece from the start, you'll notice there are three "humps" visible on the waveform at around 11, 12.5 and 16.5 seconds that correspond to repetitions of a short wind motif. We'll take a closer look at the first of these. Scroll so that the first hump is visible, and zoom in a few times using the mouse wheel or Up cursor key. Then switch to the Select tool by clicking the arrow button on the toolbar, and drag to select an area approximately from the start of the first hump to shortly before the second. As you see, the program is telling us that this selection covers a range from 10.617 seconds up to 12.498 seconds, or 1.88 seconds later. Your exact figures will probably vary, of course. You can adjust the extents of the selection after having initially selected it. Just click-and-drag the left or right edge of the purple selection region (first making sure you have the Select tool active). Let's listen to the selected area. Click the toolbar button, and then play. If the current playback point is in the middle of the selection, Sonic Visualiser will play from it to the end of the selection; if you then Play again, you'll hear the whole selection and nothing else. Adding a spectrogram view will give us another way to look at what's being played here. Use Pane -> Add Peak Frequency Spectrogram: Here we've changed the Bin Display property from Frequencies to All Bins, changed the Colour Scale from Linear to Meter, switched off Normalize Columns, and increased the Gain dial to make quieter regions more distinguishable (at the cost of blowing-out the loud red areas). We also dragged the spectrogram pane downwards to admit a slightly higher frequency range. (If you want to do that, first switch back to the Navigate tool on the toolbar so that you can drag around the spectrogram without disturbing the selection.)'''
