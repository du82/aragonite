["https://sonicvisualiser.org/doc/reference/5.0.1/en"]
title = "Sonic Visualiser: A Brief Reference"
full_description = '''Sonic Visualiser is an application for viewing and analysing the contents of music audio files. This is a brief reference manual explaining the concepts used in Sonic Visualiser and how to use it. This manual describes Sonic Visualiser version 5.0.1. This document is Copyright 2006-2024 Chris Cannam and Queen Mary, University of London. You may modify and redistribute it under the terms of the Creative Commons Attribution-ShareAlike 2.5 License. See http://creativecommons.org/licenses/by-sa/2.5/ for details. Sonic Visualiser's user interface is structured around panes and layers. A pane is a horizontally scrollable area of window like a drawing canvas; a layer is one of a set of things that can be shown on a pane, such as a waveform, a line graph of measurements, or a subdivision of the horizontal axis into differently coloured segments. You can stack any number of panes above one another vertically: a scrollbar will appear if you have too many to fit in the window. The horizontal axis of each pane corresponds to time in audio sample frames, and all of the stacked panes will be aligned to the same sample frame at their centre points. Each pane can then display any number of layers, which are conceptually stacked on top of one another like layers in a graphics application. So for example, you may have a spectrogram layer "at the back", with line data, onset positions and notes displayed in separate layers "in front", i.e. drawn over the top of it. There are several different kinds of layer, which differ in the types of data they can represent: instants, curves (time-value plots), and so on. Layers that are stacked on the same pane will always share the same magnification (or zoom) and alignment on the x (time) axis. However, they do not have to have identical scales on the y axis — although Sonic Visualiser will attempt to align them vertically by default if their scale units match. One pane is always the "active" pane, and this one is marked with a black vertical bar to its left, like the one by this paragraph. The front layer on that pane is the active layer. Any menu or keyboard function in Sonic Visualiser that works on a single layer will always operate on the active layer.'''
