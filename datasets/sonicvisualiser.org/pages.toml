title = "Sonic Lineup"
description = "Sonic Lineup is a program for quick time-aligned comparative visualisation of related audio recordings."
full_description = '''Sonic Lineup is a free, open-source application for Windows, Linux, and Mac, designed for rapid visualisation of multiple audio files containing versions of the same source material. It's useful for comparing different recordings of the same performance; recordings of different performances of the same work; different "takes" of parts in a recording session or mix; or even recordings of variant works or cover songs, so long as they are structurally similar to one another. Sonic Lineup is not designed for editing, annotation, precision measurement, or any custom analysis of audio. In fact you might use it for only a few minutes at a time, as an assistance to listening, or an accessory to annotation done elsewhere.'''
