title = "*** · Rafał Pastuszak"
description = "Rafał Pastuszak is an experienced startup consultant specialised in web, mobile, emerging technologies and human-centred design. Click to find out more."
full_description = '''May 29, 2023***I remember the first time I drew a face. It looked like this:I was sitting on the slope of a hill overlooking my house, together with my older cousin. It was a late summer afternoon: still warm, with the grass still golden, but slowly turning red, the air smelling like honey and beeswax. He drew first. I followed.That's how I draw faces now:I also remember the first letter I ever wrote! It looked like this:I drew it on a wooden plank with a flat red carpenter's pencil. The shape of the lead and the texture of the wood made it hard to draw curves. You had to go in straight lines and press just a little bit so the lead didn't sink into the pulp.I drew it in the room where all of us slept and watched TV. The light was crisp (with the shadows freshly chiseled) and the air smelled of spring and tobacco. My dad wrote first. Then I followed. This is how I write now:Hello! says the impostor syndrome (nihilism kicks in): I'm none of the things I wanted to be between then and now. I still draw the same face and I still write the same «ر».Still, none of the faces I draw look like this:(Click to continue)There was an error, that's ok. Try again or find a mirror.Don't worry, I can't see you.And, none of the notes I write look like this:Calligraphy (written with a reed pen)Or this:Calligraphy (written with a reed)But then, I draw a little face on a rock and you smile.I write you a card and you read my name, rolling your Rs.[hidden] > * { display: none; } .cannot-see-you-message { position: absolute; bottom: 0; z-index: 1; left: 50%; translate: -50% 0; font-size: 1.25rem; } .preview-container { --aspect-ratio: 3/4; background-size: contain; position: relative; aspect-ratio: var(--aspect-ratio); margin-left: calc(var(--page-margin) * -1); width: calc(100% + calc(var(--page-margin) * 2)); animation: preview-container--enter 1s ease-in-out; } @keyframes preview-container--enter { from {opacity: 0;} to {opacity: 1;} } .preview-container::before { content: '.'; position: absolute; top: 50%; left: 50%; translate: -50% -50%; animation: preview-container--loading 1s linear infinite; font-size: 3rem; } @keyframes preview-container--loading { 0% {content: '.';} 20% {content: '..';} 40% {content: '...';} 60% {content: '....';} 80% {content: '.....';} } .preview-container::after { content: ''; display: block; position: absolute; inset: 0; background: url('/images/face/mirror-vertical.webp'); background-size: contain; pointer-events: none; } @media (min-aspect-ratio: 1) { .preview-container { --aspect-ratio: 4/3; } .preview-container::after { background-image: url('/images/face/mirror.webp'); } } .preview-container .error-message { position: absolute; left: 50%; top: 50%; translate: -50% -50%; background: white; color: black; padding: 2rem; font-size: 2rem; text-align: center; border: 2px solid black; visibility: hidden; } .preview-container .error-message button { background: black; color: white; border: none; font-size: 2rem; padding: 0 0.5rem; cursor: pointer; border-radius: 0.5rem; box-shadow: 0 0 0 0.2rem black; line-height: 1.3; cursor: pointer; } .preview-container button:hover { opacity: 0.8; } .preview-container .embed { width: 100%; height: 100%; position: relative; opacity: 0; transition: opacity 1s; } .preview-container .embed.is-active { opacity: 1; } .preview-container video { position: absolute; inset: 10%; width: 80%; height: 80%; visibility: hidden; object-fit: cover; filter: brightness(1.4) contrast(4.3) saturate(0); transform: rotateY(180deg); } .preview-container-video-overlay { position: absolute; inset: 0; background: var(--color-bg); mix-blend-mode: multiply; opacity: .3; } .preview-container__spacer { width: 100%; height: 100vh; }const umami = window.umami || { trackEvent: () => {}, } const previewContainerEl = document.querySelector(".preview-container"); const ctaEl = document.querySelector(".preview-container-cta"); const retryButtonEl = document.querySelector(".retry-button"); const videoEl = document.querySelector(".preview-container-video"); const errorMessageEl = document.querySelector(".error-message"); let hasPlayedOnce = false; document.querySelectorAll(".next-step-button").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); e.target.hidden = true; }) ); const getVideoStream = () => { if (!videoEl.paused) return; return navigator.mediaDevices .getUserMedia({ video: true, }) .then((stream) => { videoEl.srcObject = stream; return videoEl.play(); }); }; const requestVideoInput = async () => { try { errorMessageEl.style.visibility = "hidden"; await getVideoStream(); const embedEl = document.querySelector(".preview-container .embed"); embedEl.classList.add("is-active"); if(hasPlayedOnce) return hasPlayedOnce = true; umami.trackEvent('mirror-play'); } catch (error) { umami.trackEvent('mirror-error', {error: error.message}); errorMessageEl.style.visibility = "visible"; } // pause the video when videoEl is not in view const observer = new IntersectionObserver( (entries) => { entries.forEach((entry) => { if (entry.isIntersecting) { getVideoStream(); } else { if(!videoEl.paused) { videoEl.pause(); //unload the video stream from the element videoEl.srcObject.getTracks().forEach((track) => track.stop()); } } }); }, { threshold: 0.5 } ); observer.observe(videoEl); }; const handleCTAClick = (e) => { e.preventDefault(); previewContainerEl.hidden = false; document.querySelector(".faces__step-1").hidden = false; videoEl.style.visibility = "visible"; ctaEl.style.display = "none"; previewContainerEl.scrollIntoView({ behavior: "smooth", block: "center", }); setTimeout( () => { requestVideoInput(e); document.querySelector(".preview-container__spacer").remove(); } ) }; retryButtonEl.addEventListener("click", (e) => { umami.trackEvent('mirror-retry-click') handleCTAClick(e); }); ctaEl.addEventListener("click", (e) => { umami.trackEvent('mirror-click') handleCTAClick(e) });'''
