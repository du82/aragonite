["https://sonnet.io/posts/hummingbirds"]
title = "Hummingbirds are Evil! Procrastination, Laziness and Play · Rafał Pastuszak"
description = "Rafał Pastuszak is an experienced startup consultant specialised in web, mobile, emerging technologies and human-centred design. Click to find out more."
full_description = "Mar 7, 2023Hummingbirds are Evil! Procrastination, Laziness and PlayToday I want to talk about three of my favourite spicy words: procrastination, laziness, and play. Hopefully by the time you’ve finished reading, you’ll see them in a more useful light. And, if I do my job right, you’ll leave this post a little bit lazier, and slightly more playful.Along the way, I will also try to smuggle in some tips on how to work with yourself when tackling a design problem.This is by no means a prescriptive guide and, in keeping with the article’s theme, I hope to leave you with more questions rather than strict answers. I’ll try to keep it low on jargon, and relatively high on personal introspection. Here’s why: we learn more efficiently through stories, and from people who communicate by setting an example. With that out of the way, let’s get started!TODOWhen it comes to personal projects or any work where I have more control over my time, my process looks sometimes like this:Work on something importantProcrastinateWork on something less important, but something I care aboutOnce I get the kick from doing 3., go back to 1., rinse and repeat…I had mixed feelings writing down this list. It’s hard to avoid judgement when talking about procrastination, especially because we tend to equate it with “laziness” or apathy. But procrastination is an avoidance mechanism and a form of self sabotage, and laziness does not exist.ProcrastinationResearch on procrastination contradicts the common belief that it's a symptom of “poor conscientiousness” and laziness. Instead, as it turns out, procrastination has everything to do with emotional regulation .So, why and how do we procrastinate? We might be afraid of failure or (more likely) of how daunting and complicated a particular task might look, so we keep postponing our work, and trade temporary relief for increased difficulty in the future. Or, we might be unable to manage (or even accept) the way a certain task makes us feel, leading us to search for endless distractions instead. This is where the emotional regulation issue comes in—we’d do anything to avoid feeling our painful, complicated emotions. Even if that means doom-scrolling to the bottom of Twitter or the Orange Website as our work inbox fills up.But this is, of course, counterproductive and every time we avoid facing this little monster, we feed it a bit, and make it stronger.This gets worse if you have a tendency for perfectionism, a term which, thankfully we’ve mostly grown out of in a professional context. Perfectionism, by definition, is all or nothing. And, since all or nothing is a pretty high bar, this is also where self-sabotage comes into play.Self-sabotage happens when instead of facing the problem, we put ourselves in a situation where we’re unlikely to succeed. Let me illustrate this with an example:A long time ago, when Sun was god and people still spoke in ActionScript, I was taking exams to determine which uni would have me. My grades were OK and with a bit of work I could get where I wanted, so naturally I took 2.5x as many exams as I needed, which in fact reduced my chances of getting anywhere. I did it purely because I couldn’t stand the idea of failing at the “normal” level. This is obvious in hindsight, and obviously nonsense.Self-sabotage allows us to say: we’ve failed not because of us, but because of the world around us. It’s not us who are inherently broken.“New Yorker humour”Laziness, or, why hummingbirds are evilLaziness is a huge subject, involving evolutionary biology, neuroscience, psychology, religion, politics, and make-believe. Naturally, I can’t do it justice in a few paragraphs. So, instead of getting bogged down in the details, let’s play a round of Laziness Bingo™.OK, here are the results: it seems like 90s kids with ADHD, people with mental illness, the homeless, people in their 30s, and immigrants are all lazy. Laziness is an umbrella term we apply to things and behaviours we don’t—or don’t want to—understand.Can you think of a single example of a real and truly lazy person you know? By that I mean, someone who’s inherently lazy, without any extenuating circumstances like mental illness. A good heuristic for answering this question usually looks like this:Rephrase your sentence as a news headline: Is <placeholder> lazy?Apply Betteridge's law of headlinesAnother useful tool for this is Emotive Conjugation, which predicts that we’re more charitable when explaining our own behaviour vs. the behaviours of others.And then there’s also a darker, more manipulative aspect to the concept of laziness, the ability to other anything it touches. That’s how immigrants can somehow be both lazy and out to steal all the jobs, depending on which side of the imaginary line in the sand you stand.Anyway, so why are hummingbirds evil? Because despite their ridiculously high energy demands, they still do fuck all once they’re satiated. And, as you know Idle hands are the devil's workshop (Proverbs 16:27).Hail SatanJust sit down and get to work (or YMMV)You might’ve heard about Sitzfleisch—the ability to just sit down on your butt and keep going. There’s no doubt that it’s an important skill, especially now, when we're bombarded with distractions and our attention spans are getting shorter and shorter.However, in my case, it’s more of a red herring, a Sitzfisch if you will. Once I finally start working on something, I find it relatively easy to stay focused or to push myself, sometimes for hours, but it doesn’t always mean I get more done this way. On the contrary, the mistake I often make is overcorrecting for Sitzfleisch by spending too much time on a single task, and getting burned out.It seems a bit like the opposite of the self-sabotage example from above, but in fact it’s a very similar mechanism: I do it so I can tell myself I did my best. If you’re reading my blog chances are you can relate.Work and playI cringe a bit when I hear someone using the verb play in a work context. The reason for that is twofold:First, it’s a bit sinister. In corpo-newspeak words like this are used to manipulate people into working harder than they should, or working on something they wouldn’t otherwise want to work on. This form of fake playfulness, even infantilization, is usually directly proportional to how much VC money is poured into the business and inversely proportional to the actual value it creates.Here’s an example:We might be selling ads, but you, pal, you’re #deliveringwow. Now pass me the nerf gun and let’s head to the Clubhouse! unnamed, but real, employee of a London ad tech companyThis also makes for a much more interesting story when your friends or family (or you) ask yourself what you do for a living. You’re not working, you’re just having good old fun™. You must be special. Have a cookie.The last paragraph is particularly important here. Just like with laziness, our definition of play doesn’t hold up to scrutiny once we stop and apply critical thinking.First, playing to many of us means doing something inherently useless, and perhaps this is why play can seem counterproductive from an evolutionary standpoint. But is it inherently useless? For most of what we call “the West” (and most of this planet, believe me or not, is not West-centric) the answer might not be that obvious.In fact, playing is a universal behaviour shared by humans and animals, serving a plethora of different purposes ranging from improving motor coordination, practice, bonding, managing stress, developing and improving cognitive skills, reinforcing or organising social structures. (This does not apply to seals. Seals, unlike hummingbirds, are actually evil.)Predictably irrationalA broken clock once said: we’re irrational creatures, but the beautiful part is that we’re predictably irrational. Know your flaws and set up systems to help account for them. In other words: it’s not your fault that you feel a certain way, but it’s your responsibility to act when you can.For instance, the answer for me, sometimes, is this: If you can, work on something you care about. If that’s hard, try to find something smaller to care about and don’t worry if it seems a bit trivial. Still nothing? Look for something even smaller you can fit in your schedule.Intrinsic motivation always trumps external motivation when it comes to creative work. When you care about something, it’s easier to push yourself out of your comfort zone, e.g. message someone with a crappy demo of your project asking them for feedback, pick up a new piece of tech or learn about my personal nemesis: marketing. Intrinsic motivation makes it easier to think in terms of what’s possible vs. what could go wrong.I am terrible at working on things I don’t give a shit about. Luckily, the list gets longer every year. But I realised very late how much stress I was causing myself by brute-forcing the problem instead of trying to understand it better.If you grew up without financial security or under pressure to perform better than your peers, you can probably relate.The key here is balance: if I recognise that I’m getting bored and it’s hard to focus when working on Number 1. (the important thing on our list), I try to work on Number 3. (the thing I care about), instead, reducing my chances of falling into the familiar procrastination-self-doubt-apathy cycle.This is hard and doesn’t always work, but that’s still perfectly fine since every failure is a stepping stone if we take time to reflect on it. Accepting that is a part of work. When my amygdala is screaming danger, you’ll fail! I still have to remind myself that my choices are not motivated by defeatism, but patience.The balancing act is a skill like any other – just like learning a new language, playing an instrument or juggling.Closing wordsWe gonna turn frustration into inspirationWhatever demons are there, we gonna set them free Gogol Bordello, Tribal ConnectionOnce we stop for a second and approach these behaviours without being distracted by judgement statements, we can work around them. Or, even better, we can work with them .In my case, this took the form of attending therapy, swapping social media time for daily writing, building mental health friendly tools like Sit., or Ensō, and spending more time with my family and friends. You’ve read lists like this 100s of times, and the reason they don’t work is the same reason they exist: the way you build yours will be different from the way I built mine.So, here’s my only piece of advice:Learn to recognise your patterns.Consider self-judgement a warning signal that your perspective might be flawed.With the above in mind, let’s fix our list!Work (on something important)Rest (get bored)Play (with something you care about… or not!)Rinse and repeat…I hope you’ll be able to set those demons free. Trust me, I was a middle-school satanist.PS. Alexandra Ciufudean edited and translated this article into human."
year_published = 2023
