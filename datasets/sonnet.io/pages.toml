full_description = "Sit.December 2022Sit down and do nothing.We spend so much time building things that steal attention & extract value from users. Sit. does the opposite: it gives you back your time.Please share with a friend who needs to sit the fuck down or enjoy the experience yourself.Open ButterMay 2023Butter is a browser extension that skips sponsored content in YouTube videos by watching them before you do. Because you deserve butter.Open EnsōDecember 2018Ensō is a writing tool that helps you enter a state of flow.It does this by separating writing from editing and thus making it harder for you to edit yourself.Although the app is 100% private and we offer feature-parity between paid and free versions, we have a regular stream of new, paying users.The user base is small and diverse, including neurodivergent individuals, budding writers, those using Ensō to process and understand their emotions, and people trying to improve their language fluency.Personally, I'm just really happy that 1,000,000 written words later, I still come back to it every single morning.Open"
