["https://sonnet.io/posts/wip"]
title = "Short: WiP · Rafał Pastuszak"
description = "Practical tips on applying divergent and convergent modes of thinking in your work, sponsored by W. Herzog and 2 particularly smart rodents."
full_description = '''Feb 20, 2023Short: WiP“Are you pondering what I’m pondering?”“I think so Brain, but I still don’t understand why commit messages would matter?” Unaired episode of Pinky and the BrainFor reasons beyond the scope of this post, I spent a possibly unhealthy amount of time watching Pinky and the Brain as a kid. It wasn’t too bad. ORF, the main Austrian broadcaster also aired the German version of Teletubbies shortly before, which I consider my first psychedelic, although unpleasantly so, experience. Wait, where was I… Ah, yes, here are some quick, practical tips on how we can apply two different modes of thinking when iterating and committing our code, sponsored by ACME.Commit often when you’re exploring the problem (divergent thinking) but use structure when you know where you’re heading (convergent thinking). When you diverge you want to prioritise quantity over quality, make mistakes cheap, and fun.Pinky is our divergent process, Brain is the convergence. Let's see how we can apply this to our work.BrainConsider using Conventional Commits and a commit message linter. In tandem, these tools force you to adhere to a relatively strict format of commit messages, including:the type of the change (“feat”, “fix”, “chore”, “wip”) and,a terse description of the change itself.So, no more cryptic messages like “cosmetics”, “typo”, “cleaned” in your history1, but “feat(sign-up): add the CTA”, “fix: remove typos in the header”, “chore: update leftpad”. Your colleagues and the future You will thank you. Small improvements like this go a long way.These tools reduce the number of things you’ll need to care about when saving your work, play nicely with semantic release, and provide some uniform structure in shared codebases.But, what I like about them the most is that if you can’t come up with a good commit message, it’s probably a signal that the changes are either too broad or not focused enough.This is why I follow the Conventional Commits style for all of my projects, even the ones small enough where installing the tooling would be an overkill.Key takeaway:Impose limitations and repetition to keep focus. Make your code rhyme.PinkyAt the same time, when the chunk of work is really tiny and doesn’t merit a description or I’m just exploring different solutions, I commit and push my changes every few minutes.The process often looks like this:draft some changes, add a bunch of smaller wip commitsdeploy to a test env or re-run a local build, rinse and repeat…once the code looks good, and the tests pass, squash all wip commits and push to productionDisclaimer: For more complex, serious work, I replace step #3 with removing all code and writing it from scratch using TDD. Check GeePaw Hill’s Intro to Spikes for details.Key takeaways:prioritise short feedback loopsquantity > qualityWith that in mind, I don’t want to spend half of that time crafting my perfect commit message, so I made myself this little snippet: wip () { git commit --no-verify -m "wip: $*" }Here’s how I use it: $ ga . # stage working changes $ wip yak shaving # commit as wip: yak shavingHow to install it:Either paste it in your .zshrc or add it to your PATH environment variable. Feel free to copy it from my custom dotfile .SummaryUnderstand the two different modes of thinking when exploring and narrowing down the solution. Either automate or use repetition to the point where you can just run things on autopilot. Keep the feedback loops short and make mistakes fun. Brain works, but Pinky plays.PS. Alexandra Ciufudean edited and translated this article into human. She also came up with the idea of using my childhood trauma one of my favourite cartoons as a metaphor.Footnotes These are real examples found after spending less than a minute sampling the commit history of a randomly selected project.'''
