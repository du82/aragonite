["https://sonnet.io/posts/ulysses"]
title = "Ensō · Rafał Pastuszak"
description = "Ensō is a writing tool that helps you enter a state of flow."
full_description = "Dec 1, 2019EnsōEnsō is a writing tool that helps you enter a state of flow.It does this by separating writing from editing and thus making it harder for you to edit yourself.The rules of the game:you can't select textyou can edit only a character at a timeonly a few last lines are visible as you type, fading away and losing their importanceyou can download and review your text when you’re done writingI created Ensō to help me improve my writing habit and find a moment in my day to spend some time with my own thoughts. Editing in Ensō is hard, so writing can be easier. Generally, as I use it, the annoying bits of the UX quickly fade and since the only thing I could do is to write, I’m focused enough to think about something in depth. For me, it is a freeing experience.You might use Ensō to:develop your writing habitimprove fluency in your native language, or when learning a new onethink aloud (but quietly, so just think I guess?)You may keep it on the side of your screen during the day and jot down your thoughts as impromptu notes—you know, the ones you'll never bother reading again, but write down anyway, so you can retain and organise information, or just clear your head.At least this is how I use it. You might find it limiting to the point of annoyance or freeing and somewhat addictive, as I have. Give it a try and let me know what you think!"
