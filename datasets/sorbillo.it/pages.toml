title = "Qualità degli ingredienti - Gino Sorbillo Pizzerie Napoletane"
description = "Qualità degli ingredienti La nuova frontiera di Gino Sorbillo è l’utilizzo di ingredienti ricercati di prima qualità come le farine di agricoltura biologica, verdure, ortaggi ed aromi. Approfittando delle tante materie prime che la terra campana regala in ogni periodo dell’anno e continuando costantemente nella ricerca delle migliori eccellenze gastronomiche italiane. L’integrazione tra gli ingredienti"
full_description = "Qualità degli ingredienti La nuova frontiera di Gino Sorbillo è l’utilizzo di ingredienti ricercati di prima qualità come le farine di agricoltura biologica, verdure, ortaggi ed aromi.Approfittando delle tante materie prime che la terra campana regala in ogni periodo dell’anno e continuando costantemente nella ricerca delle migliori eccellenze gastronomiche italiane.L’integrazione tra gli ingredienti ed il loro mixaggio sulla pizza consente a Gino Sorbillo la creazione di nuove proposte ed un continuo aggiornamento del menù. Birra Nastro Azzurro Farina Biologica Molino Caputo Salamino di Faicchio Tomaso Salumi Consorzio di tutela dei Vini del Sannio Tarallificio Leopoldo Formaggi ai 4 Latti Sogni di Latte Pomodori Biologici Gustarosso Pesto F.lli Rossi di Roberto Panizza Latticini Caseificio Il Casolare Salumi e Formaggi Italiani Valsana Il Giusto della Mozzarella Libera Terra San Benedetto Acqua MineralePomodorini Gialli del Vesuvio Formaggi I Filadelfi 1828 Salumi Villani dessert Sal De Riso Olio Terre Francescane Azienda agricola Sapori Vesuviani Acqua San Pellegrino Pastificio dei Campi Ferrarelle Pastificio Garofalo Artigiano della Nduja Tonno Colimena Agricola Gaia Pastificio Felicetti Birra Baladin Formaggi Malandrone"
