full_description = '''Cookie Policy (UE)Questa politica sui cookie è stata aggiornata l'ultima volta il 26 Ottobre 2023 e si applica ai cittadini e ai residenti permanenti legali dello Spazio Economico Europeo e della Svizzera.1. IntroduzioneIl nostro sito web,https://www.sorbillo.it (di seguito: "il sito web") utilizza i cookie e altre tecnologie correlate (per comodità tutte le tecnologie sono definite "cookie"). I cookie vengono anche inseriti da terze parti che abbiamo ingaggiato. Nel documento sottostante ti informiamo sull'uso dei cookie sul nostro sito web.2. Cosa sono i cookie?I cookie sono dei semplici file spediti assieme alle pagine di questo sito e salvati dal tuo browser sul disco rigido del tuo computer o altri dispositivi. Le informazioni raccolte in essi possono venire rispediti ai nostri server oppure ai server di terze parti durante la prossima visita.3. Cosa sono gli script?Uno script è un pezzo di codice usato per far funzionare correttamente ed interattivamente il nostro sito. Questo codice viene eseguito sui nostri server o sul tuo dispositivo.4. Cos'è un web beacon?Un web beacon (o pixel tag) è un piccolo, invisibile pezzo di testo o immagine su un sito che viene usato per monitorare il traffico di un sito web. Per fare questo, diversi dati su di te vengono conservati utilizzando dei web beacon.5. Cookie5.1 Cookie tecnici o funzionaliAlcuni cookie assicurano il corretto funzionamento del sito e che le tue preferenze rimangano valide. Piazzando cookie funzionali, rendiamo più facile per te visitare il nostro sito web. In questo modo non devi inserire ripetutamente le stesse informazioni quando visiti il nostro sito web, per esempio, l'oggetto rimane nel tuo carrello finché non hai pagato. Possiamo piazzare questi cookie senza il tuo consenso.5.2 Cookie statisticiUtilizziamo i cookie statistici per ottimizzare l'esperienza del sito web per i nostri utenti. Con questi cookie statistici otteniamo approfondimenti sull'uso del nostro sito web. Chiediamo il tuo permesso per piazzare cookie statistici.5.3 Cookie di marketing/tracciamentoI cookie di marketing/tracciamento sono cookie o qualsiasi altra forma di memorizzazione locale, utilizzati per creare profili utente per visualizzare pubblicità o per tracciare l'utente su questo sito web o su diversi siti web per scopi di marketing simili.6. Cookie presenti ElementorStatistiche (anonimo) Consent to service elementor UtilizzoUsiamo Elementor per creazione di contenuti. AltroCondivisione dei datiQuesti dati non sono condivisi con terze parti.Statistiche (anonimo)NomeelementorScadenzapersistenteFunzioneSalvare le azioni compiute dall'utente sul sito web Google reCAPTCHAFunzionale, Pubblicità/Tracciamento Consent to service google-recaptcha UtilizzoUsiamo Google reCAPTCHA per prevenzione dello spam. AltroCondivisione dei datiPer ulteriori informazioni, si prega di leggere Google reCAPTCHA Dichiarazione sulla Privacy.FunzionaleNome_grecaptchaScadenza6 mesiFunzioneFornisce protezione spamPubblicità/TracciamentoNomerc::cScadenzasessioneFunzioneFiltra richieste dei botNomerc::bScadenzasessioneFunzioneFiltra richieste dei botNomerc::aScadenzapersistenteFunzioneFiltra richieste dei bot WordPressFunzionale Consent to service wordpress UtilizzoUsiamo WordPress per sviluppo del sito web. AltroCondivisione dei datiQuesti dati non sono condivisi con terze parti.FunzionaleNomewp-settings-*ScadenzapersistenteFunzioneSalvare le preferenze utenteNomewp-settings-time-*Scadenza1 annoFunzioneSalvare le preferenze utenteNomewordpress_test_cookieScadenzasessioneFunzioneControlla se i cookie possono essere piazzatiNomewordpress_logged_in_*ScadenzapersistenteFunzioneMantieni l'accesso degli utentiNomewpEmojiSettingsSupportsScadenzasessioneFunzioneSalvare i dettagli del browser Google AnalyticsStatistiche Consent to service google-analytics UtilizzoUsiamo Google Analytics per statistiche del sito web. AltroCondivisione dei datiPer ulteriori informazioni, si prega di leggere Google Analyt