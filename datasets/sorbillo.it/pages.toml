["https://www.sorbillo.it/tradizione"]
title = "Tradizione - Gino Sorbillo Pizzerie Napoletane"
description = "Tradizione Gino Sorbillo appartiene ad una delle famiglie di pizzaioli più antiche di Napoli.I suoi nonni, Luigi Sorbillo e Carolina Esposito, fondarono la prima pizzeria nel 1935 su via dei Tribunali, definita da molti la “Via della Pizza Napoletana” nel centro antico della città.I coniugi Sorbillo misero al mondo 21 figli, diventati poi, tutti pizzaioli.Il"
full_description = "Tradizione Gino Sorbillo appartiene ad una delle famiglie di pizzaioli più antiche di Napoli.I suoi nonni, Luigi Sorbillo e Carolina Esposito, fondarono la prima pizzeria nel 1935 su via dei Tribunali, definita da molti la “Via della Pizza Napoletana” nel centro antico della città.I coniugi Sorbillo misero al mondo 21 figli, diventati poi, tutti pizzaioli.Il papà di Gino, Salvatore, è il diciannovesimo dei ventuno figli.Gino cresce nella pizzeria di famiglia e ben presto impara i segreti della vera pizza napoletana che lui ama precisare “quella dei vicoli poveri della città” cioè più grande, generosa e accessibile a tutti.Ben presto Gino manifesta il suo stile e la sua impronta; il mestiere di famiglia abbinato ad una sua spiccata e naturale vena artistica gli consentono di comunicare attraverso le sue creazioni.La centenaria tradizione viene così proposta in chiave contemporanea contribuendo ad uno dei più grandi cambiamenti avvenuti nel mondo della pizza negli ultimi decenni.Numerosi sono i servizi giornalistici e televisivi nazionali ed internazionali che si sono occupati di Gino e della sua Pizza.Frequenti sono le sue partecipazioni al palinsesto televisivo, pizzaiolo di Masterchef per tre edizioni, giudice per la gara di pizza tra i giudici di Masterchef Israele, Menù di Benedetta, Alice TV, e da cinque anni alla rubrica “Pizza” de La Prova del Cuoco su Rai 1 e sul suo magazine mensile. Inoltre è stato protagonista di molti documentari e docufiction su Napoli e sulla Pizza prodotti e mandati in onda in tutto il mondo da Discovery, National Geographic e Arkè.INNOVAZIONECon Gino Sorbillo la Pizza Napoletana arriva per la prima volta allo Chef Congress Identità Golose nel gennaio 2011. Anche a Festa a Vico, Le Strade della Mozzarella, Taste, Witaly, Gusto in Scena è continua la sua partecipazione. Assieme a suo fratello minore Toto, Gino ha aperto altre sei sedi: Lievito Madre al Mare, Lievito Madre al Duomo, Antica Pizza Fritta da Zia Esterina Sorbillo (quest’ultima in tre luoghi distinti della città e a Milano).Oggi Gino Sorbillo è anche il fondatore della Casa della Pizza, luogo che nasce nel centro storico di Napoli, a pochi passi dalla pizzeria, in quella che fu l’abitazione della zia Esterina, donna simbolo della Pizza Fritta Napoletana, la prima dei 21 figli della famiglia Sorbillo.La Casa della Pizza, aperta non solo ai pizzaioli, ma a tutti gli amanti della pizza, si propone come luogo di confronto, di scambio, di incontri e dibattiti sul piatto napoletano più famoso e amato al mondo. Questo luogo, già sede dell’Accademia della Pizza, accoglie, come la pizzeria, anche numerose opere di artisti ed artigiani napoletani, al fine di promuovere sempre più le varie arti partenopee.Nel giugno del 2016 è stato insignito dalla Scuola Internazionale di Cucina Italiana ALMA Maestro di Arte e Mestieri, unico della categoria dei Piazzaioli, alla presenza del ministero dei beni culturali e del Presidente della Repubblica Mattarella.La nuova frontiera di Gino è l’utilizzo di farine di agricoltura biologica e l’aggiornamento continuo dei propri menù data la continua e costante ricerca delle migliori eccellenze gastronomiche italiane da proporre sulla pizza e da far conoscere attraverso la pizza."
