["https://www.sorbillo.it/dichiarazione-sulla-privacy-ue"]
title = "Dichiarazione sulla Privacy (UE) - Gino Sorbillo Pizzerie Napoletane"
description = "L'archiviazione tecnica o l'accesso sono strettamente necessari al fine legittimo di consentire l'uso di un servizio specifico esplicitamente richiesto dall'abbonato o dall'utente, o al solo scopo di effettuare la trasmissione di una comunicazione su una rete di comunicazione elettronica."
full_description = "Dichiarazione sulla Privacy (UE)Questa dichiarazione sulla privacy è stata aggiornata l'ultima volta il 26 Ottobre 2023 e si applica ai cittadini e ai residenti permanenti legali dello Spazio Economico Europeo e della Svizzera.In questa dichiarazione sulla privacy, spieghiamo cosa facciamo con i tuoi dati che otteniamo attraverso https://www.sorbillo.it. Ti consigliamo di leggere attentamente la dichiarazione. Durante l'elaborazione rispettiamo i requisiti della legislazione sulla privacy. Ciò significa, tra le altre cose, che:comunichiamo chiaramente il motivo per il quale processiamo dati personali. Facciamo questo per mezzo di questa dichiarazione sulla privacy;miriamo a limitare la raccolta di dati personali solo ai dati personali richiesti per scopi legittimi;prima chiediamo il tuo esplicito consenso per processare i tuoi dati personali nei casi che richiedono il tuo consenso;adottiamo misure di sicurezza appropriate per proteggere i tuoi dati personali e lo richiediamo anche da parti che elaborano dati personali per nostro conto;rispettiamo il tuo diritto di accesso ai tuoi dati personali o di averli corretti o cancellati, su tua richiesta.Se hai domande o vuoi sapere esattamente quali dati conserviamo, contattaci.1. Scopo, dati e periodo di conservazionePossiamo raccogliere o ricevere informazioni personali per una serie di scopi legati alle nostre operazioni commerciali che possono includere quanto segue: (clicca per espandere)1.1 Contatto - Tramite telefono, posta, email e/o moduli webPer questo scopo usiamo i seguenti dati:Un nome e cognomeUn indirizzo emailUn numero di telefonoLa base con la quale processiamo i dati è:Su disposizione del consenso.Periodo di conservazioneConserviamo questi dati al termine del servizio per il seguente numero di mesi: il titolare può conservare i dati personali sino a quando detto consenso non venga revocato.1.2 Per supportare servizi o prodotti che un cliente vogliono o hanno compratoPer questo scopo usiamo i seguenti dati:Un nome e cognomeUn indirizzo emailUn numero di telefonoLa base con la quale processiamo i dati è:Su disposizione del consenso.Periodo di conservazioneConserviamo questi dati al termine del servizio per il seguente numero di mesi: il titolare può conservare i dati personali sino a quando detto consenso non venga revocato.1.3 Per essere in grado di rispettare gli obblighi legaliPer questo scopo usiamo i seguenti dati:Indirizzo IPInformazione attività internet, incluso ma senza limitarsi ad essi, cronologia navigazione, cronologia ricerche, ed informazioni riguardo l'interazione di un utente con un sito web internet, applicazioni o pubblicitàDati geolocalizzazioneLa base con la quale processiamo i dati è:Per il rispetto di un obbligo legale o regolamentare.Periodo di conservazioneDeterminiamo il periodo di conservazione in base a criteri oggettivi fissi: Il titolare può conservare i dati personali sino a quando detto consenso non venga revocato. Il titolare potrebbe essere obbligato a conservare i dati personali per un periodo più lungo in ottemperanza ad un obbligo di legge.1.4 Compilazione ed analisi di statistiche per migliore il sito.Per questo scopo usiamo i seguenti dati:Indirizzo IPInformazione attività internet, incluso ma senza limitarsi ad essi, cronologia navigazione, cronologia ricerche, ed informazioni riguardo l'interazione di un utente con un sito web internet, applicazioni o pubblicitàDati geolocalizzazioneLa base con la quale processiamo i dati è:Su disposizione del consenso.Periodo di conservazioneConserviamo questi dati al termine del servizio per il seguente numero di mesi: Il titolare può conservare i dati personali sino a quando detto consenso non venga revocato. Il titolare potrebbe essere obbligato a conservare i dati personali per un periodo più lungo in ottemperanza ad un obbligo di legge.2. Condivisione con altre partiCondividiamo questi dati solo con i processori e con altre terze parti per le quali è necessario ottenere il consenso.ProcessoriNome: Google Ireland Limited Paese: Irlanda Scopo: Analisi Statistiche3. CookieIl nostro sito web usa cookie. Per ulteriori informazioni riguardo i cookie, per favore fai riferimento alla nostra Cookie Policy. 4. Pratiche di divulgazioneComunichiamo informazioni personali se ci viene richiesto dalla legge o da un ordine del tribunale, in risposta a un'autorità incaricata dell'applicazione della legge, nella misura consentita da altre disposizioni di legge, per fornire informazioni o per un'indagine su una questione relativa alla sicurezza pubblica.Se il nostro sito Web o organizzazione viene rilevato, venduto o coinvolto in una fusione o acquisizione, i tuoi dati potrebbero essere divulgati ai nostri consulenti e a eventuali potenziali acquirenti e saranno trasmessi ai nuovi proprietari.Abbiamo concluso un accordo di elaborazione dei dati con Google.Google non può utilizzare i dati per altri servizi di Google.L'inclusione di indirizzi IP interi è bloccato da noi.5. SicurezzaCi impegniamo per la sicurezza dei dati personali. Prendiamo adeguate misure di sicurezza per limitare l'abuso e l'accesso non autorizzato ai dati personali. Ciò garantisce che solo le persone necessarie abbiano accesso ai tuoi dati, che l'accesso ai dati sia protetto e che le nostre misure di sicurezza vengano regolarmente riviste.6. Siti web di terze partiQuesta dichiarazione sulla privacy non si applica ai siti web di terzi collegati tramite link sul nostro sito web. Non possiamo garantire che queste terze parti gestiscano i vostri dati personali in modo affidabile e sicuro. Vi consigliamo di leggere le dichiarazioni sulla privacy di questi siti web prima di utilizzarli.7. Ammende riguardo questa dichiarazione della privacyCi riserviamo il diritto di apportare modifiche alla presente dichiarazione sulla privacy. Si raccomanda di consultare regolarmente questa dichiarazione sulla privacy per essere a conoscenza di eventuali modifiche. Inoltre, ti informeremo attivamente laddove possibile.8. Accesso e modifica dei tuoi datiSe hai domande o vuoi sapere esattamente quali tuoi dati sono in nostro possesso, contattaci. Potrai contattarci usando le informazioni presenti qui sotto. Hai i seguenti diritti:Hai il diritto di sapere quando i tuoi dati personali sono necessari, cosa succede ad essi, quanto a lungo verranno mantenuti.Diritto di accesso: hai il diritto ad accedere ai tuoi dati personali dei quali siamo a conoscenza.Diritto di rettifica: hai il diritto di completare, correggere, cancellare o bloccare i tuoi dati personali quando lo desideri.Se hai domande o problemi relativi al accessibilità del sito web, per favore non esitare a contattarci.Diritto di trasferire i tuoi dati: hai il diritto di richiedere tutti i tuoi dati dal controllore e trasferirli tutti quanti ad un altro controllore.Diritto di obiezione: hai il diritto di obiezione verso il processo dei tuoi dati. Noi rispetteremo questa scelta, a meno che non ci siano delle basi valide per il processo.Assicurati di segnalare sempre in modo chiaro chi sei, così da essere certi di non cancellare o modificare i dati di un una persona sbagliata.9. Invio di un reclamoSe non sei soddisfatto di come gestiamo (una lamentela su) il processo dei tuoi dati personali, hai il diritto di spedire un reclamo al Garante per la protezione dei dati personali.10. Dettagli contattiDOMUS PIZZA CONSULTING S.R.L. P.Iva 10070441216 VIALE MICHELANGELO 33 80129 NAPOLI (NA) Italia Sito web: https://www.sorbillo.it Email: info@sorbillo.it AnnessoComplianz | The Privacy Suite for WordPress Questo sito web utilizza la Privacy Suite per WordPress di Complianz per raccogliere record di consenso. Per questa funzionalità il tuo indirizzo IP è reso anonimo e memorizzato nel nostro database. Per ulteriori informazioni, vedere la Dichiarazione sulla Privacy di Complianz.Slider RevolutionIn case you’re using Google Web Fonts (default) or playing videos or sounds via YouTube or Vimeo in Slider Revolution we recommend to add the corresponding text phrase to your privacy police:YouTube Our website uses plugins from YouTube, which is operated by Google. The operator of the pages is YouTube LLC, 901 Cherry Ave., San Bruno, CA 94066, USA. If you visit one of our pages featuring a YouTube plugin, a connection to the YouTube servers is established. Here the YouTube server is informed about which of our pages you have visited. If you're logged in to your YouTube account, YouTube allows you to associate your browsing behavior directly with your personal profile. You can prevent this by logging out of your YouTube account. YouTube is used to help make our website appealing. This constitutes a justified interest pursuant to Art. 6 (1) (f) DSGVO. Further information about handling user data, can be found in the data protection declaration of YouTube under https://www.google.de/intl/de/policies/privacy.Vimeo Our website uses features provided by the Vimeo video portal. This service is provided by Vimeo Inc., 555 West 18th Street, New York, New York 10011, USA. If you visit one of our pages featuring a Vimeo plugin, a connection to the Vimeo servers is established. Here the Vimeo server is informed about which of our pages you have visited. In addition, Vimeo will receive your IP address. This also applies if you are not logged in to Vimeo when you visit our plugin or do not have a Vimeo account. The information is transmitted to a Vimeo server in the US, where it is stored. If you are logged in to your Vimeo account, Vimeo allows you to associate your browsing behavior directly with your personal profile. You can prevent this by logging out of your Vimeo account. For more information on how to handle user data, please refer to the Vimeo Privacy Policy at https://vimeo.com/privacy.Google Web Fonts For uniform representation of fonts, this page uses web fonts provided by Google. When you open a page, your browser loads the required web fonts into your browser cache to display texts and fonts correctly. For this purpose your browser has to establish a direct connection to Google servers. Google thus becomes aware that our web page was accessed via your IP address. The use of Google Web fonts is done in the interest of a uniform and attractive presentation of our plugin. This constitutes a justified interest pursuant to Art. 6 (1) (f) DSGVO. If your browser does not support web fonts, a standard font is used by your computer. Further information about handling user data, can be found at https://developers.google.com/fonts/faq and in Google's privacy policy at https://www.google.com/policies/privacy/.SoundCloud On our pages, plugins of the SoundCloud social network (SoundCloud Limited, Berners House, 47-48 Berners Street, London W1T 3NF, UK) may be integrated. The SoundCloud plugins can be recognized by the SoundCloud logo on our site. When you visit our site, a direct connection between your browser and the SoundCloud server is established via the plugin. This enables SoundCloud to receive information that you have visited our site from your IP address. If you click on the “Like” or “Share” buttons while you are logged into your SoundCloud account, you can link the content of our pages to your SoundCloud profile. This means that SoundCloud can associate visits to our pages with your user account. We would like to point out that, as the provider of these pages, we have no knowledge of the content of the data transmitted or how it will be used by SoundCloud. For more information on SoundCloud’s privacy policy, please go to https://soundcloud.com/pages/privacy. If you do not want SoundCloud to associate your visit to our site with your SoundCloud account, please log out of your SoundCloud account.Akismet Raccogliamo informazioni sui visitatori che commentano il sito e che usano il nostro servizio Akismet anti-spam. Le informazioni raccolte dipendono da come l'utente ha impostato Akismet, ma normalmente le informazioni includono l'indirizzo IP di chi commenta, lo user agent, il referrer, e l'URL del sito (insieme ad altre informazioni fornite direttamente dall'utente che commenta, come nome, username, indirizzo email, e il testo stesso del commento).Complianz | The Privacy Suite for WordPress Questo sito web utilizza la Privacy Suite per WordPress di Complianz per raccogliere record di consenso. Per questa funzionalità il tuo indirizzo IP è reso anonimo e memorizzato nel nostro database. Per ulteriori informazioni, vedere la Dichiarazione sulla Privacy di Complianz.Akismet Raccogliamo informazioni sui visitatori che commentano il sito e che usano il nostro servizio Akismet anti-spam. Le informazioni raccolte dipendono da come l'utente ha impostato Akismet, ma normalmente le informazioni includono l'indirizzo IP di chi commenta, lo user agent, il referrer, e l'URL del sito (insieme ad altre informazioni fornite direttamente dall'utente che commenta, come nome, username, indirizzo email, e il testo stesso del commento).Complianz | The Privacy Suite for WordPress Questo sito web utilizza la Privacy Suite per WordPress di Complianz per raccogliere record di consenso. Per questa funzionalità il tuo indirizzo IP è reso anonimo e memorizzato nel nostro database. Per ulteriori informazioni, vedere la Dichiarazione sulla Privacy di Complianz.Akismet We collect information about visitors who comment on Sites that use our Akismet Anti-spam service. The information we collect depends on how the User sets up Akismet for the Site, but typically includes the commenter's IP address, user agent, referrer, and Site URL (along with other information directly provided by the commenter such as their name, username, email address, and the comment itself)."
