title = "Home - Gino Sorbillo Pizzerie Napoletane"
description = 'Previous slide Next slide Previous slide Next slide PIZZERIE SORBILLO LE PIZZERIE La pizza napoletana di Gino Sorbillo si può degustare in Napoli nella storica sede in Via dei Tribunali e in Piazza Vanvitelli, in Amalfi (SA) "La Locanda della Canonica", Roma, Genova, Bologna, Padova, Milano, Torino, Tokyo (Giappone).Imperdibili le pizze fritte con insegna "Antica'
full_description = "PIZZERIE SORBILLO LE PIZZERIE La pizza napoletana di Gino Sorbillo si può degustare in Napoli nella storica sede in Via dei Tribunali e in Piazza Vanvitelli, in Amalfi (SA) “La Locanda della Canonica”, Roma, Genova, Bologna, Padova, Milano, Torino, Tokyo (Giappone).Imperdibili le pizze fritte con insegna “Antica Pizza Fritta da Zia Esterina Sorbillo” con sedi in Napoli e Milano. leggi... LA TRADIZIONE E L'INNOVAZIONE Gino Sorbillo appartiene ad una delle famiglie di pizzaioli più antiche di Napoli. cresce nella pizzeria di famiglia e ben presto impara i segreti della vera pizza napoletana.Con Gino Sorbillo la Pizza Napoletana è giunta a livelli qualitativi altissimi e si è guadagnata di diritto spazio tra le migliori eccellenze gastronomiche italiane. leggi... LA QUALITÀ DEGLI INGREDIENTI La nuova frontiera di Gino è l’utilizzo di farine di agricoltura biologica e l’aggiornamento continuo dei propri menù data la continua e costante ricerca delle migliori eccellenze gastronomiche italiane da proporre sulla pizza e da far conoscere attraverso la pizza… leggi..."
