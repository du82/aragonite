full_description = "31 Jan 2007 Site Upgraded to DNN4.4.1 by bronwenz@gmail.com | posted in: Uncategorized | 0 I upgraded our site to the latest version of Dotnetnuke today. I have been playing with the new DNN4.4 recently and it does perform better. I’m a little confused by a couple of things. The error logs have changed xml format … Continued 22 Jan 2007 In 50 years can storage get THAT much smaller? by bronwenz@gmail.com | posted in: Uncategorized | 0 My dad sent me the photo bellow the other day. It’s a 5MB hdd from 1956. When you look at that pic, it’s SCARY how small memory storage has become in 50 years. As a comparison….below is a photo of … Continued 21 Jan 2007 JasJam – Manuafacturing fault with the Micro SD card slot by bronwenz@gmail.com | posted in: Uncategorized | 0 Broke the Jas Jam already 🙁 Got my new 2GB micro SD card for the JasJam this morning. Put it in, and it just kept going…couldn’t click it back out! Of course John’s was fine (I always get the duds). … Continued 17 Jan 2007 We’ve turned 100 by bronwenz@gmail.com | posted in: Uncategorized | 0 We’ve turned 100 . Well not 100 in years, but in blog posts. Since the 6th August 2006 we’ve now done 100 blog posts. No match for someone like Frank, and we kinda cheated cause there’s 2 of us blogging…but … Continued 17 Jan 2007 Stop Email spam – I’m sick of it how hard could it be? by bronwenz@gmail.com | posted in: Uncategorized | 0 I’m sure many of you are in the same boat with email spam. The latest attack here is spam pretending to be a mail returned message. Well I think i have a simple idea to put an end to it. Currently … Continued 15 Jan 2007 SQL 2005 help has gone – try this instead by bronwenz@gmail.com | posted in: Uncategorized | 0 For some reason SQL 2005 help is showing “help on help”. Very frustrating. What i need is a simple reference of the correct function names like ROUND() etc. Anyway this is the best i could find from MSDN: http://msdn2.microsoft.com/en-us/library/ms174318.aspx"
