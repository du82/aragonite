description = "Yesterday we mentioned Parnter Maps had been released with Virtual Earth support.  Check out a few other people who have been blogging about it: http://blogs.msdn.com/nickmayhew/archive/2007/08/30/new-find-a-partner-site-virtual-earth-enabled.aspx http://blogs.msdn.com/angus_logan/archive/2007/08/30/find-a-partner-in-australia-with-virtual-earth.aspx http://blog.sbsfaq.com/Lists/Posts/Post.aspx?List=269e4081%2Dac58%2D42a6%2D9a54%2D383a6a3fb0d8&ID=11 http://blogs.msdn.com/sbsc_australia/archive/2007/09/13/new-find-a-partner-website.aspx http://blogs.msdn.com/ausptsiw/archive/2007/09/12/partner-finder-tool.aspx"
