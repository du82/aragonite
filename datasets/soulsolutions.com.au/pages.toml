ista sidebar too, download them from here: http://gallery.live.com/liveItemDetail.aspx?li=558b2088-0106-422c-8b67-da067db2360a&bt=1&pl=1 http://gallery.live.com/liveItemDetail.aspx?li=fd7fd7af-32e4-43b9-bbf3-3cf9233f0117&bt=1&pl=1 They are dead simple to edit also"
