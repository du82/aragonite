0 Manage a group of associated data in a .NET Framework application by using collections. (Refer System.Collections namespace) • ArrayList class – implements IList• Collection interfaces ICollection – defines size, enumerators, and syncronisation of collections IComparer – used with Array.Sort and Array.BinarySearch. Allows customisation of … Continued"
