full_description = "28 May 2007 Impulse buys… by bronwenz@gmail.com | posted in: Uncategorized | 0 I was surfing on graysonline yesterday and came across an auction for boxes of 250 stress builing block (like lego). I saw these at Tech Ed last year and they are pretty cool as you can build stuff out of … Continued 25 May 2007 Article exploring the custom styles for the info box in Virtual Earth V5 by bronwenz@gmail.com | posted in: Uncategorized | 0 While working on my migration to Version 5 of Virtual Earth I side track to look at the new method to customise the info box (pin popup) and find 2 showstopping issues. View the article here. 25 May 2007 First play with Popfly by bronwenz@gmail.com | posted in: Uncategorized | 0 I got access to the alpha of popfly today and have been dragging and dropping mashups together all morning. This is simply hooking up the rss feed from Bronwens best of thailiand photos to a photo sphere control The … Continued 23 May 2007 #4 the new 3 by bronwenz@gmail.com | posted in: Uncategorized | 0 Well it seems that 4 is the number of 2007. For those who’ve seen my IM tags for the last few months. We ordered a new bed from Forty Winks 4 months ago! Today, after having 3 broken beds delivered, our 4th … Continued 15 May 2007 The parking challenge by bronwenz@gmail.com | posted in: Uncategorized | 0 Always hate trying to park in town and today remembered why. Had a meeting at 10:30 in town today…thought getting there at 10:10 would give me heaps of time to find a park… I drive round a few streets and … Continued 14 May 2007 Back to work – without a job! by bronwenz@gmail.com | posted in: Uncategorized | 0 My contract with Faces expired the day before we went on holidays..and I went away with them discussing my contract renewal terms. Yesterday..still no written confirmation on renewal so I asked for confirmation before doing any work. This worked out … Continued 13 May 2007 Thailand trip pics available… by bronwenz@gmail.com | posted in: Unc