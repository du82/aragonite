["https://soundiiz.com/about"]
title = "About Us - Soundiiz"
description = "At Soundiiz, we work hard to provide the best solution as possible to help you to handle your online music collection."
full_description = "As music streaming was all the rage through some music platforms existing at the time, the concept of Soundiiz quickly found its audience. As streaming market was increasing, Soundiiz managed to adapt and progress proposing still more supported platforms and functions to help users handle their online music library. In less than a few years, Soundiiz became THE solution to transfer music data online. It’s also the main tool of playlists management for many labels, majors, curators and influencers. Unlike the economic strategy of the startups of these days, we decided not to make any fundraising for our development and the team is still composed of its two founders. Why ? Simply because we consider that when it’s possible (which is the case right now), it’s better to be self-financing rather than to be dependent on an investor. We are lucky to have the technical knowledge and to manage to gather other skills when necessary. This also allows us to keep an attractive price offer (no big team to pay or investors to satisfy !) and to ensure a closer and more direct relation with the customers. It all started in 2013. Two friends from Nantes (France) were eager to create the best service ever to manage their online music collection. They invented Soundiiz. As a co-founder, Thomas is the Back-End expert of the team. He deals with the technical partners’ relationship as well as the financial and commercial aspects of Soundiiz. As a co-founder, Benoit is rather the Front-End expert of the team. He is in charge of the different interfaces of Soundiiz, attentive to ensure the most efficient experience for the user. Proud to belong to the FrenchTech and the online music industry, Soundiiz could rely on the support of the French as well as the international streaming platforms. We could work in close collaboration with the music online actors for all these years, as much for their launch, as to attract new users or to propose to easily and quickly export music data. Now known as the reference solution around the world for inter-compatibility of online music data, Soundiiz keeps growing and reaching a larger audience, day after day."
