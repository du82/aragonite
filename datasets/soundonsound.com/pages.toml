full_description = "You are hereHome Free Replica Digital Magazine Access The SOS REPLICA Monthly Browser Edition LOG IN & click the 'Access My Free Magazine' RED BUTTON at the bottom of this page, if you are already registered with the SOS website. Or REGISTER by completing the form — then click the RED BUTTON to open/view the latest REPLICA edition and access Replica Back Issues. If REPLICA Edition is FREE - Why buy a DIGITAL Sub? Paid-up SOS Digital Subscribers are the lifeblood of the publication, and benefit from so much more than FREE users. For example: Paying for a Subscription helps SOS continue to offer valuable free services like the SOS Forum and SOS Readers' Adverts FREE for every site visitor's benefit. Digital Subscribers get a Monthly Full Issue PDF added by us to your My Account > Downloads area. Unlock Web articles from the latest issue and all previous articles (plus any Bonus online-only content). Print the magazine Web articles - no printing is allowed for REPLICA free readers. 4 different ways to instantly access the magazine article content and advertisements across iOS, Android and Desktop without waiting for the print magazine to arrive in the post. 5 Device Installs - Digital Subscribers can install the SOS Mobile & Tablet App on a maximum of 5 devices (any mixture of iOS/Android). The Replica edition is not compatible with Mobile usage (the paid-for DIGITAL SUB is). Interested? Click and SUBSCRIBE TODAY. It costs a lot less than you might think! SOS REPLICA The page-flip browser version of SOUND ON SOUND, known as the REPLICA, was created during the pandemic in 2020 to enable our global non-subscriber readers, who could not visit their local newsagent/bookstore during lockdowns, to continue reading their most-loved music recording techology 'source of truth' every month. Over 12,000 readers instantly signed up, and many contacted us and told SOS they loved reading the magazine this way (on large desktop monitors or tablets the REPLICA is a gorgeous experience). So, we have chosen to continue offering this REPLICA — it's a great introduction to the magazine for newbies discovering the market leading influencer, or anyone living in parts of the world where SOS is not sold in physical form. REPLICA also has the added benefit of boosting advertising coverage for our loyal, supportive Advertisers whose patronage allows us to exist. Login or Register as a New UserYou must have an account with us in order to access the free Digital Magazine.Please LOGIN NOW if you are already registered, otherwise please register here. ?Choose a UsernameSpaces and numbers are allowed. Also periods . (full stops), hyphens - , apostrophes ' and underscores _ (minimum 2, maximum 30 characters). ?E-mail addressA valid e-mail address. All e-mails from the system will be sent to this address. The e-mail address is not made public and will only be used if you wish to receive a new password or wish to receive certain news or notifications by e-mail. Time zone Africa/Abidjan: Sunday, March 2, 2025 - 05:46 +0000Africa/Accra: Sunday, March 2, 2025 - 05:46 +0000Africa/Addis Ababa: Sunday, March 2, 2025 - 08:46 +0300Africa/Algiers: Sunday, March 2, 2025 - 06:46 +0100Africa/Asmara: Sunday, March 2, 2025 - 08:46 +0300Africa/Bamako: Sunday, March 2, 2025 - 05:46 +0000Africa/Bangui: Sunday, March 2, 2025 - 06:46 +0100Africa/Banjul: Sunday, March 2, 2025 - 05:46 +0000Africa/Bissau: Sunday, March 2, 2025 - 05:46 +0000Africa/Blantyre: Sunday, March 2, 2025 - 07:46 +0200Africa/Brazzaville: Sunday, March 2, 2025 - 06:46 +0100Africa/Bujumbura: Sunday, March 2, 2025 - 07:46 +0200Africa/Cairo: Sunday, March 2, 2025 - 07:46 +0200Africa/Casablanca: Sunday, March 2, 2025 - 05:46 +0000Africa/Ceuta: Sunday, March 2, 2025 - 06:46 +0100Africa/Conakry: Sunday, March 2, 2025 - 05:46 +0000Africa/Dakar: Sunday, March 2, 2025 - 05:46 +0000Africa/Dar es Salaam: Sunday, March 2, 2025 - 08:46 +0300Africa/Djibouti: Sunday, March 2, 2025 - 08:46 +0300Africa/Douala: