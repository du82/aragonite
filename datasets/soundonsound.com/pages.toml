["https://soundonsound.com/news/strymons-new-ec-1-tape-echo-pedal"]
title = "Strymon’s new EC-1 tape echo pedal"
description = "Strymon's latest pedal is said to combine the sound of classic tape echo units with the richness of their accompanying valve preamps."
full_description = "Published 28/2/25 Inspired by legendary Echoplex unit Guitar effects experts Strymon have announced the launch of a new pedal that is said to combine the sound of classic tape echo units with the richness of their accompanying valve preamps. The EC-1 has been built around the single-moving-head algorithm employed by the company’s El Capistan pedal, and also draws inspiration from different variations of the legendary Echoplex. The pedal features a high-impedance, low-noise Class-A JFET preamp stage that offers true stereo operation with independent processing of the left and right input channels. Users are able to choose between two authentically reproduced preamp circuits: the first is based on the Echoplex EP-2, and features a high-frequency boost well suited to humbucker-equipped instruments; the second delivers a warmer, more balanced response based on a modified EP-2 that Strymon studied during the new pedal’s development. A dTape dial introduces a delay that meticulously recreates the behaviour of a physical tape echo, replicating its moving head, the condition of the tape and its bias setting, along with sonic irregularities introduced by its mechanical elements. A three-position Rec Level toggle switch then offers Low, Med and High signal levels, allowing users to choose how much saturation is applied by the modelled circuitry. The delay time is governed by a Repeats knob, while Tape Age and Mechanics controls make it possible to simulate the effect of using older tape and introduce some wow and flutter. The EC-1 also boasts some extensive MIDI capabilities, and is capable of communicating either via USB-C or its EXP/MIDI connection — the latter requires an optional adapter cable. The pedal is capable of storing up to 300 presets, with users able to toggle between them via Program Change messages, and all of its parameters can be controlled using CC messages; it will also synchronise its delay time to incoming MIDI Clock signals. Stereo input and output connections are provided by a pair of quarter-inch TRS sockets, and the pedal requires a minimum current of 250mA from a 9V DC supply. Pricing & Availability The EC-1 is available now, priced at $279£279.99 including VAT. www.strymon.net/product/ec-1"
year_published = 2025
year_updated = 2025
