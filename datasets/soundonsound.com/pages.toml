["https://soundonsound.com/news/grace-designs-upcoming-m701-interface"]
title = "Grace Design's upcoming m701 interface"
description = "Grace Design's new m701 inteface aims to offer a high-quality solution for everything from simple ‘in the box’ systems to large hybrid studio setups."
full_description = "Published 26/2/25 Up to 64 analogue and 202 digital channels At the NAMM Show 2025, Grace Design revealed an upcoming modular audio interface aimed at professional and commercial recording facilities. Leaning on the company’s expertise in designing high-end A-D/D-A converters, the m701 aims to offer a high-quality solution for everything from simple ‘in the box’ systems to large hybrid studio setups. The m701 base unit occupies a 2U rackmount chassis with a dual-redundant power supply and can be fitted with up to eight I/O modules, allowing users to configure the system to meet their specific needs. Each unit is fitted with a selection of digital connections as standard (eight ADAT, eight AES3 and two S/PDIF) with a range of optional modules offering an array of additional analogue and digital I/O options — fully loaded, the system is capable of handling 64 analogue channels and a whopping 202 digital channels. On the analogue side of things, users are able to choose from eight-channel line-level A-D or D-A modules, as well as an option that brings together four of Grace Design’s high-quality mic preamps — the unit also boasts integrated control over the company’s m108 preamps. Digital options include DigiLink for compatibility with Avid’s HDX systems, Dante, Ravenna/AES67/ST2110, a 24-channel AES3 module, and the company will soon be introducing a 32x32 USB2 option. The m701 can be fitted with up to eight I/O cards, allowing users to configure the system to suit their particular needs. Configuration and operation can be carried out directly from the unit’s front panel — which also provides metering for all inputs and outputs — or remotely using GraceNet, the company’s web-based control software; the software is compatible with any web browser, and does not require users to install or update any software before it can be used. There’s a built-in 32x8 mixer that allows users to create multiple low-latency cue mixes, with artists able to control their own mixes by loading up GraceNet on their phone or tablet. Pricing & Availability The M701 is expected to be shipping by Spring 2025, with the base unit priced at $2995£3150 including VAT. Pricing for the modules is yet to be announced. gracedesign.com/products/m701-audio-interface"
year_published = 2025
year_updated = 2025
