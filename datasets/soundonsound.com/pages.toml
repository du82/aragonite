description = "Download Sound On Sound Media Packs and learn who to contact on Team SOS if you wish to advertise in our UK/EU/World or North America print editions, tablet/mobile Apps, or on our highly-trafficked website."
full_description = "Download Sound On Sound Media Packs and learn who to contact on Team SOS if you wish to advertise in our UK/EU/World or North America print editions, tablet/mobile Apps, or on our highly-trafficked website. ➡️ North America Edition ➡️ UK / Europe / Rest Of World Edition 🇬🇧 Sound On Sound UK, Europe & Rest of World Edition The original flagship edition of the world's best recording technology magazine, launched in 1985 — Sound On Sound is the undisputed leader in its field, with a 39+ years heritage and more readers enjoying more editorial depth than any other magazine of its kind throughout the UK, Europe and Australasia. Published in A4 size with typically over 144 pages of must-read content every month, supported with online audio and video. For UK print and web advertising rates please contact: UK Media Sales Manager | Guy Meredith Tel: (+44) 07506 197 114 [please leave a voicemail] Email Guy via our Contact page ➡️ CLICK to Download our FREE example Full Issue PDF: UK/EU/ROW edition BONUS COVERAGE: if you advertise in the UK print magazine, your advertisement is automatically included in our popular iOS/Android Tablet/Mobile App, as well as in our monthly Full Issue PDF (UK/EU/World) and in the page-turning Replica edition — ALL currently at no extra charge. Here are the first 56 pages of our UK/World September 2024 magazine. 🇬🇧 🆘 UK EDITION - MEDIA PACK & SCHEDULES Download UK/EU/World Advertiser Information below: (Note: North America edition details are different and can be found further down this page.) Download UK/EU/World — Sound On Sound Advertising FULL MEDIA PACK — PDF sos-uk-2025-production-schedule.pdf — UK/EU/World — 2025 Advertising Schedule — PDF sos-web-uk.pdf WEB Banner Specs — Sizes and Formats — PDF Download Specifications - UK/EU/World PRINT Advertisement — PDF sos-eblast-guidelines.pdf eBlast Email Guidelines — PDF 🇺🇸 Sound On Sound North America Edition For over 23 years, the North America edition of Sound On Sound has set exemplary standards in publishing Stateside, with more printed editorial pages each issue than many of the other US titles in this sector combined! Whilst other publications have shrunk to mere pamphlets, SOS has remained rock solid, thanks to its independence and agility in adapting to changing market trends. Distributed monthly via subscription, bookstores and music tech retailers in the US, Canada and Americas, this is your access to the biggest market in the world. Printed in the USA in standard US format/size. For USD$ print and web advertising rates, contact: Sales Manager - North America | Dan Brown Tel: 323.528-4200 mobile. Email via our Contact page Regional Sales Manager - North America | David Carson Tel: 615-491-5810 Email via our Contact page ➡️ CLICK HERE to Download our FREE example Full Issue PDF: North America edition ADDED-VALUE COVERAGE: if you advertise in our North America print magazine, your advertisement is automatically included in our popular iOS/Android Tablet/Mobile Apps, as well as in our monthly Full Issue PDF and in the page-turning Replica edition — ALL currently at no extra charge. Here are the first 56 pages of our North America September 2024 magazine. 🇺🇸 🆘 North America EDITION - MEDIA KIT & SCHEDULES Download North America Advertiser Information below: Download North America SOS Advertising FULL MEDIA KIT — PDF sos-na-2025-production-schedule.pdf — Advertising Schedule Deadlines 2025 — PDF sos-web-na.pdf WEB Banner Specs — Sizes and Formats — PDF sos-editorial-na-info.pdf Editorial Information — PDF Download North America PRINT Advertisement Specifications — PDF sos-e-newsletter-na-guidelines.pdf eBlast Email Guidelines — PDF Global Advertising Campaigns Please discuss your requirements with Nick Humbert, International Business Development Director. Email via our Contact page. Repurposing SOS content for your Marketing? We encourage this, but please visit our Guidelines page to find out what is and is not permitted."
