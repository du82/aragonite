["https://soundonsound.com/news/gems-song-athletics-boro"]
title = "Gems from Song Athletics & BORO"
description = "Song Athletics’ latest project has been developed in collaboration with BORO, a Montréal- based creative sound studio led by composer and sound artist Noah Cedar Sherrin."
full_description = "Published 27/2/25 Five free virtual instruments announced Song Athletics’ latest project has been developed in collaboration with BORO, a Montréal- based creative sound studio led by composer and sound artist Noah Cedar Sherrin. Gems provides users with a collection of five experimental virtual instruments, and is being offered as a free download. Prioritising accessibility and intuition, BORO say that they hand-make tools and resources for artists with the aim of inspiring their personal journeys through sound. The virtual instruments developed for Gems have been created based on the studio’s ongoing research and development in digital lutherie, and are said to offer an eccentric palette of new colours for your music. As well as being free themselves, the instruments are presented in the Decent Sampler format, meaning they don’t require any paid software to run. What’s Included? Gems is made up of the following five instruments: Lamplit: Soft guitar cloud creator Hala: Auric tape pad Ferro: Warm electro-mechanical piano Vaila: Fragile voice constellations Hecate: Fractured bandoneon drones Compatibility Gems runs in the free Decent Sampler plug-in (version 1.10.0 or later), which is supported on Windows, macOS and Linux systems. More information can be found here. The instruments require 1.42GB of free disk space. Pricing & Availability Gems is available now, and is free for anyone to download. songathletics.com/products/gems"
