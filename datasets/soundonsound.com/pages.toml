["https://soundonsound.com/news/austrian-audio-preview-oc-s10-reference-recording-microphone"]
title = "Austrian Audio preview OC-S10 Reference Recording Microphone"
description = "Taking pride of place on Austrian Audio’s booth at the 2025 NAMM Show was the OC-S10, a new large-diaphragm capacitor mic that the company say offers exceptional versatility and will suit any recording scenario."
full_description = "Published 31/1/25 New flagship mic incoming Taking pride of place on Austrian Audio’s booth at the 2025 NAMM Show was the OC-S10, a new large-diaphragm capacitor mic that the company say offers exceptional versatility and will suit any recording scenario. As well as offering a choice of five polar patterns, the new flagship mic boasts the same dual-output feature as the OC-818, allowing users to alter the pattern after recording. The OC-S10 employs Austrian Audio’s acclaimed CKR12 capsule, which features a free-floating design and utilises the company’s Open Acoustics Technology, an approach that has been designed to capture sounds as naturally as possible with minimal obstructions from the mic’s physical properties. It also employs an all-new electronics design, which is said to result in a remarkably low noise floor. Three rotating sections on the mic’s housing offer access to a pad (0, -10 and -20 dB), high-pass filter (off, 40, 80, 160 Hz), and five polar patterns (omni, wide cardioid, cardioid, hypercardioid, figure-of-eight). Helpfully, the OC-S10's shockmount features a ball-and-socket mechanism that makes quick work of getting the mic into the ideal position. Thanks to the OC-S10’s dual-output design, it’s possible to record a signal from each side of the mic’s capsule, meaning its possible to change the polar pattern after recording. Both outputs are provided on XLR connectors — the company have implemented a mechanism that prevents users from inadvertently connecting the wrong output when using the mic in its ‘standard’ mode — and post-recording changes can be made using Austrian Audio’s PolarDesigner plug-in. “Austrian Audio was born from a legacy of legendary, high-end recording microphones, so naturally it is a logical step for us to develop something of our own that can move that legacy forward. The OC-S10 brings a unique, modern voice to this category which is designed to inspire artists and performers to capture their own personal perfect performance — be it by voice or by instrument. We’re very humbled by how quickly our microphones have found prominent places in the studios of artists and engineers around the world. The OC-S10 was designed specifically with these creatives in mind — an inspiring, modern take on a classic recording paradigm, but with a modern approach to sound and workmanship that pushes us into the future.” - Martin Seidl, CEO, Austrian Audio Video of Austrian Audio OC-S10: Reference Recording Microphone | NAMM 25 Key Specs Polar patterns: Omni, Wide Cardioid, Cardioid, Hypercardioid, Figure-of-Eight Frequency response: 20Hz – 20kHz Sensitivity (all directions): 14 mV/Pa Equivalent noise level: 8dB (A-weighted) Max SPL: 147dB Weight: 690g Dimensions: 63mm x 63mm x 205mm Accessories: Shockmount, Frameless Pop-Filter, Wooden Microphone Box Pricing & Availability The OC-S10 will be priced at $2999£2450 including VAT, with shipping dates to be confirmed. austrian.audio/product/oc-s10"
year_published = 2025
year_updated = 2025
