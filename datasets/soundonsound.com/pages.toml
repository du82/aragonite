["https://soundonsound.com/news/hit-factory-plugins-release-hitverb"]
title = "Hit Factory Plugins release HitVerb"
description = "The Hit Factory are giving DAW users access to a collection of reverbs that capture the sound of some of their most sought-after live rooms."
full_description = "Published 26/2/25 Reverb plug-in captures 12 iconic studio spaces The Hit Factory is one of the world’s most iconic recording studios, having played host to a huge range of legendary artists over the last five decades. There have been a total of 26 studios across seven Hit Factory locations since 1975, and now, under the name of Hit Factory Plugins, the facility are giving DAW users access to a collection of reverbs that capture the sound of some of the most sought-after rooms. Developed in collaboration with The Hit Factory Studio’s CEO, Troy Germano, HitVerb comes loaded with 12 impulse responses that capture a range of unique room sounds, including the legendary New York and London locations. The plug-in includes presets created by top engineers, and of course, allows users to craft and save their own. Each of the rooms included are accompanied by detailed descriptions, including a list of the albums they’ve played a part in. Users are provided with a choice of three microphone options: Neumann U67s, Coles 4038s and Sennheiser MKH 800 Twins, along with detailed control over their positioning and spacing. A Mixer module equipped with Mix, Early Reflection and Tail dials is joined by a Shape section that offers low- and high-pass filters and control over the reverb’s tail length, and there’s even an option to add or remove a carpet to alter the amount of floor reflections present in the reverb signal. Compatibility HitVerb is supported on PCs running Windows 10 or higher, and Macs running macOS 10.15 and above. VST3, AU and AAX plug-in versions are available. Authorisation is taken care of by PACE’s iLok system, and supports either iLok Cloud sessions or an iLok USB dongle. Pricing & Availability HitVerb is available now, priced at $199. hitfactoryplugins.com/en/products/hitverb"
year_published = 2025
year_updated = 2025
