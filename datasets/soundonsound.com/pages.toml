["https://soundonsound.com/news/meris-launch-enzo-x-synth-pedal"]
title = "Meris to launch Enzo X synth pedal"
description = "The new Enzo X greatly expands on its predecessor, the Enzo, combining five different synth modes with a collection of onboard reverb, delay and modulation effects."
full_description = "Published 27/2/25 Offers polyphonic tracking with standard guitar pickups Meris have announced the upcoming launch of what they say is the possibly the most powerful synth pedal ever created. The new Enzo X greatly expands on its predecessor (reviewed here in SOS January 2019), combining five different synth modes with a collection of onboard reverb, delay and modulation effects. The new and improved pedal adopts both the form factor and UI of Meris’ LVX and MercuryX offerings, and introduces a whole host of features that greatly extend its capabilities. It can be played either via a MIDI keyboard or via its instrument input — the device will accept both instrument and line-level sources, and features a full stereo signal path — and boasts polyphonic pitch-detection that will work with standard guitar pickups. Its five synth modes include a six-voice polysynth along with monophonic and dry processing modes, while configurable oscillator and filter types allow the instrument to cover a huge sonic range. Each of the Enzo X’s voices features two oscillators and a filter, along with ADSR envelope controls for both its filter and amplifier sections. Sawtooth, triangle and square waves can be selected on a per-oscillator basis, while a Deep Modifier section allows users to assign control signals to the pedal’s processing parameters. There's plenty of MIDI control on offer, too, with the device supporting Program Change and CC messages for preset switching and parameter control, as well as being able to synchronise to an incoming MIDI Clock signal. Given the other products in the Meris line-up, it’s no surprise that the pedal comes equipped with a comprehensive selection of built-in effects. There are three reverbs derived from the Mercury X’s Prism algorithm, as well as choice of five drives, five modulation effects and a stereo 2.5-second delay — the drive and modulation effects can be routed to a parallel bus. The Enzo X will accept instrument and line-level signals, and can also be played from a MIDI keyboard. As for connectivity, the Enzo X offers a stereo input and output on four quarter-inch TRS sockets, with a fifth allowing users to connect an expression pedal for hands-free control of multiple parameters. MIDI I/O is provided on five-pin DIN sockets, while a USB-C port allows the pedal to be connected to a computer to receive firmware updates. It requires a 9V DC power supply, and will draw 300mA of current. “Enzo X is an evolution of sound. From the oscillators to the filters to the envelopes and more, I evolved and enhanced every aspect of the original Enzo to unlock the synth sounds living in your imagination.” - Angelo Mazzocco, DSP Engineer and VP, Meris Video of NEW: Meris Enzo X Overview (Official) 4k Pricing & Availability The Enzo-X is available for pre-order now, priced at $599£619 including VAT, and is due to ship in early March 2025. www.meris.us/product/enzo-x"
year_published = 2025
year_updated = 2025
