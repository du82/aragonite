["https://soundonsound.com/news/addac-system-reveal-power-starvation-rev02"]
title = "ADDAC System reveal Power Starvation Rev.02"
description = "The ADDAC300 Rev.02 provides users with a way to intentionally ‘starve’ their other modules of power, leading to unconventional effects and “unruly sonic behaviour”."
full_description = "Published 28/2/25 Popular Eurorack module design updated Lisbon-based Eurorackers ADDAC System have announced an update to one of their popular module designs. The ADDAC300 Rev.02, or Power Starvation, provides users with a way to intentionally ‘starve’ their other modules of power, leading to unconventional effects and “unruly sonic behaviour”. The simple utility module provides a simple way to reduce the voltage being delivered to other modules, allowing them to be powered with less than the standard ±12V DC supply outlined by the Eurorack standard. The popular technique can produce a range of interesting side-effects, especially so in the case of analogue filters, delays and mixers. While the original version of the module housed a simple circuit with a potentiometer working as a voltage divider, Rev.02 features an upgraded design that uses a DC–DC converter, which receives its input from the +12V power rail and outputs a bipolar 15V supply, as well as offering short-circuit and overcurrent protection. The ±15V lines are then sent through variable analogue voltage regulators that can deliver a range of 2.5 – 13.5V. ADDAC Systems’ Disclaimer The company state that customers use the module at their own risk, and have issued the following safety disclaimer: “While the ADDAC300 should be safe for use with any module, there may be specific modules where its use may not be advised. ADDAC System is not responsible for issues that may arise while using the ADDAC300 Power Starvation.” Pricing & Availability The ADDAC300 Rev.02 is available now, priced at €130. www.addacsystem.com/en/products/modules/addac300-series/addac300-rev02"
year_published = 2025
year_updated = 2025
