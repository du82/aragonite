title = "Latest News"
full_description = "link Marshal Brass from The Crow Hill Company Sample library combines the sound of a flugelhorn and three euphoniums, adding a unique character compared to more typical brass ensembles. Published 1/3/25 News link Zynaptiq announce Balance adaptive EQ Due for full release on 3 March, Balance offers fresh and uncomplicated multi-channel processing. Published 28/2/25 News link ADDAC System reveal Power Starvation Rev.02 The ADDAC300 Rev.02 provides users with a way to intentionally ‘starve’ their other modules of power, leading to unconventional effects and “unruly sonic behaviour”. Published 28/2/25 News link Strymon’s new EC-1 tape echo pedal Strymon's latest pedal is said to combine the sound of classic tape echo units with the richness of their accompanying valve preamps. Published 28/2/25 News link Gems from Song Athletics & BORO Song Athletics’ latest project has been developed in collaboration with BORO, a Montréal- based creative sound studio led by composer and sound artist Noah Cedar Sherrin. Published 27/2/25 News link Machina Bristronica 2025 Join Sound On Sound at Machina Bristronica 2025 Bristol on 27-28th September for a weekend of world class live... Published 27/2/25 News link Meris to launch Enzo X synth pedal The new Enzo X greatly expands on its predecessor, the Enzo, combining five different synth modes with a collection of onboard reverb, delay and modulation effects. Published 27/2/25 News link Hit Factory Plugins release HitVerb The Hit Factory are giving DAW users access to a collection of reverbs that capture the sound of some of their most sought-after live rooms. Published 26/2/25 News link Grace Design's upcoming m701 interface Grace Design's new m701 inteface aims to offer a high-quality solution for everything from simple ‘in the box’ systems to large hybrid studio setups. Published 26/2/25 News link Arturia’s Winter Sale Arturia’s Winter Sale is running until 11 March, with everything available exclusively via the company’s website and the Arturia Software Centre. Published 26/2/25 News"
