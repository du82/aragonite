full_description = "Contact SOS Contact Staff — use this form to send your emails directly to SOS personnel or departments. Sound On Sound Advertising — your Sales Team contacts + media packs. ✅ Website Traffic — how many people visited soundonsound.com last month? ✅ Social Media & YouTube statistics - this is how many readers Follow SOS across our social channels. About SOS ➡️ SOS LOGOS & GRAPHICS — for use in adverts/marketing or linking to our site. SOS Content Licensing Enquiries SOS CONTENT: Repurposing Guidelines — for help with Review Quotes you wish to use in adverts/marketing. Publication Dates — when are the UK/World and North America Magazine and Tablet/Mobile/Replica editions published each month? My Account This is the hub of your personal soundonsound.com account (and SOS subscription, if you have one). You access it by clicking on the red My Account link at the top-left of any SOS web page. MY ACCOUNT — the command centre of your online SOS account (also controls Tablet/Mobile and Website subscription logins). Change My Password Change My Username — request the SOS Support Team change your SOS account username (this affects and controls your Sub, Website and Forum login) and cannot be reset by you. My Subscription — find out when your SOS Sub will need renewing and what sub type you have. My Shop Orders — see all Orders you've placed and download PDF (VAT) Tax Invoice receipts. My SOS Newsletter Email Lists — opt in/out of a range of SOS eBlasts. My Downloads — access your Single Article & Full Issue PDFs here. Sound On Sound Magazine & PDFs REPLICA — FREE page-turning, browser-based, monthly SOS Digital magazine (looks identical to Print issue; see User Interface shown below). Magazine — web versions of Latest Issue and Past Issue articles. FULL ISSUE PDF — try our FREE SAMPLE PDF ISSUE Download (no sign-up needed). Full Issue PDF Explained — our popular digital download of the monthly magazine. Competitions — WIN high-value monthly Prizes in SOS Competitions! Better odds than any Lottery on the planet! Back Issues — purchase Print copies or Full Issue PDF instant downloads. Magazine Feedback Write For SOS — Author Guidelines. GLOSSARY OF TERMS SOS Awards SOS CONTENT: Repurposing Guidelines March 2025 Print+Digital Issue Subscriptions - Print+Digital or Digital Subscribe — Print+Digital (Tablet+Web+Full Issue PDF) or Digital-only. Buy direct from SOS and install our App on upto 5 iOS/Android devices. DIGITAL Subscription: Price & Benefits — Compare prices of SOS DIGITAL sub to newsstand Print vs single article PDFs vs Full Issue PDF. See how much you save!!! How to access your DIGITAL Sub Renew / Upgrade your Subscription Gift Subscription ✅ Education Digital Sub — all Students/Tutors/Lecturers can apply for a FREE Digital subscription. ✅ Audio Industry Digital Sub — industry members who qualify can apply for a FREE Digital subscription. FAQ Print Edition FAQ Web Edition FAQ Tablet/Mobile Edition App FAQ iPad Edition FAQ Android Edition SOS Forum - over 144,000 members (and still rising!) Consider DONATION to SOS if you have ever been helped by free advice from our massive community of SOS readers and Mod Team: Forum Index — join the discussions/debates! Ask questions, get sound advice. Latest Forum Posts SOS READERS ADS — the new home for posting your FREE For Sale/Wanted/Services reader adverts. Forum Rules & Etiquette SOS YouTube channel - over 210,000 subscribers SOS TV - our YouTube Channel — join over 210,000 subscribers (and growing daily) to get notified about all the new Product | Interviews | Tutorial videos that we post on the popular SOS TV YouTube channel [speak to the Sales Team for video sponsorship opportunities]. SOS Podcasts - 3 Channels SOS Podcasts — 3 podcast Channels launched on 21 May 2020 and gaining terrific traction with global listeners across Apple Music, Amazon Music, Spotify and other podcast platforms. Take a listen and ask our Sales Team about early-bird Audio advertising slots within them. SOS offers 3 dedicated Podcast Channels with monthly content in all. Over 150 episodes have been 'aired' across all major Podcast platforms: Apple Music, Amazon Music, Spotify and many more. Information Website Terms Of Use Cookies & Site Security Privacy Policy Ad Blockers Explained Readers' Ads | BUY & SELL Your Gear/Software View all Gear For Sale/Wanted Ads SOS Shop Shop Departments Terms & Conditions SOS Search Search Our Site RECORDING TECHNOLOGY: Basics & Beyond Claim your FREE 170-page digital publication from the makers of Sound On Sound — CLICK HERE"
