["https://soup.agnescameron.info/2025/01/10/satellite.html"]
title = "things from the room in the back"
description = "writeup of Bellingcat Technical Writing fellowship project"
full_description = "tracking mining with multispectral satellite imagery This is a writeup of research into using satellite imagery to track mining operations, funded as part of Bellingcat’s 2024 Technical Writing Fellowship, and is a more in-depth version of a short guide published on their online platform. The accompanying Multispectral Satellite Imagery Explorer tool is available here. This guide is intended as an overview of my research, and a starting point for these techniques. a false colour satellite image of bauxite mines (yellow, with white centres) and palm oil plantations (green-brown grids) near the Kapuas river, West Kalimantan (Google Earth Engine / Landsat 8) Satellite images we encounter on platforms like Google Earth are typically rendered in ‘true colour’, which emulates how a scene might look when viewed with the naked eye. This rendering mode is natural, and is useful for producing images where the contents are easily recognisable. true-colour satellite image of the Yorkshire Dales, taken from Google Maps However, satellite imaging sensors also typically capture infrared light, which is beyond what the human eye can normally perceive. This is known as ‘multispectral imaging’. This outside-of-visible-range information is particularly useful in understanding the environmental context of a scene, giving information about the geology, vegetation, the presence and quality of water, air quality, crop varieties and even building materials and techniques. This is a guide to using multispectral satellite imaging to investigate mining operations, using contrasts between different parts of the light spectrum to highlight differences in mineral and chemical composition. While mining is chosen as the example, this kind of analysis can be used more broadly to understand geopolitical events through the lens of accelerating ecological change. For an example of how multispectral information can be used in this way, this 2021 investigation into the role of water stress into conflict on the Kyrgyzstan/Tajikistan border uses thermal, vegetation and moisture indices to contextualise the analysis of a nominally unrelated dispute about security cameras. vegetation health during the Summer 2023 drought in the UK, taken from the FAO’s Earth Observation tool. The metrics used to create these images are calculated by combining visible and infrared light collected by the AVHRR sensor on board the Metop satellite. To accompany this guide, I have developed a tool that gives a ‘tour’ of these different multispectral imaging techniques, linked to existing investigations into the mining industry. Both the tool, and the images used in this guide use imagery from the Landsat 8 Satellite imagery dataset, which contains data from 2013 to the present day. (there’s a couple of images from the recently-retired Landsat 7 satellite to show pre-2013 analysis, these will be indicated). This guide is intended as an overview of the use of multispectral imagery in OSINT, and not a detailed guide to writing code. For this, Ollie Ballinger’s Remote Sensing for OSINT guide is a fantastic resource, and covers many of the techniques used here, and is a good intro to writing a similar tool. A note on language: the terms ‘satellite imaging’ and ‘remote sensing’ are often used interchangeably, the latter describing the broader collection of data from a distance, whether through satellites, aircraft or drones, while the former describes images taken using satellites specifically. For clarity, I will use the term ‘satellite imaging’ throughout this guide. the electromagnetic spectrum Before understanding how a satellite image is constructed, it’s worth looking at how we perceive light. All of the light that we see is part of a much larger range of radiation known as the ‘electromagnetic spectrum’. Electromagnetic radiation travels in waves, and includes forms of radiation like X-rays and infrared radiation, that humans cannot see but can be detected through other means. The electromagnetic spectrum is ordered by the ‘wavelength’ of the radiation, a property that changes the way that light interacts with different materials. ‘Visible light’ – e.g. light that can be seen with the human eye – ranges between the infrared light (which has a longer wavelength) and ultraviolet light (which has a shorter wavelength) on the electromagnetic spectrum. the chlorophyll in healthy plant leaves absorbs blue and red light – when this breaks down in the Autumn, leaves stop absorbing red light, causing green and red to be reflected and changing the leaves to orange. (Wikipedia) All substances either reflect or absorb different wavelengths of electromagnetic radiation in some combination, and by examining how radiation interacts with a particular material, it’s possible to make some inferences about what that material is. Satellite imaging datasets will often describe what they measure as ‘surface reflectance’. This literally means, measuring the different wavelengths of light that are reflected, rather than absorbed, by whatever is on that part of the Earth’s surface. Consider plants – when we see an area of deep green on a ‘true colour’ satellite image, we typically associate that with vegetation. This green colour is due to the presence of chlorophyll in plant leaves, which reflects green light waves. Interestingly, there is a second kind of light that healthy plants reflect that isn’t visible to the human eye. This other wavelength falls in the shortwave infrared range, where the light waves are too long for the human eye to see, but can be picked up by some animals, and, crucially, by satellite imaging sensors. This extra information becomes important for differentiating between healthy and unhealthy vegetation, and making inferences about the type of crops in a region. Notably, it’s also invaluable for differentiating between astroturf and real grass… a true-colour timelapse of spreading Bauxite mines in St Ann Parish, Jamaica (Google Earth Engine/Landsat 7) ways of seeing There’s a nice line from the information theorist Gregory Bateson, which describes information as ‘the difference which makes a difference’ – in other words, much of our ability to sense and act in the world rests on noticing discontinuities – in time, form, colour, and through other sensory means. Often, visual forms of investigative work involve highlighting a difference so as to make it more visible – picture a ‘before and after’ image, or a clip that shows the shrinking of a lake or the expansion of a construction site – to draw inferences about higher-order events. One key form of difference available to human perception is the ratio of the red (R), green (G) and blue (B) light in an image. Most peoples’ eyes distinguish between these colours very effectivelymany people suffer from colourblindness, which can make the differentiation between different parts of the light spectrum more difficult, and give us a form of vision that is distinct from other animals – a dog, for example, has only two different kinds of photoreceptors in its eyes, resulting in a form of vision that consists of yellows, blues and greys. note: satellite imaging dataset structure Just as a digital camera image captures red, green, and blue data in different layers, a satellite image contains layers called ‘bands’, each with information from a specific segment of the electromagnetic spectrum. Different satellite datasets will vary in the number, width (e.g. what range of wavelengths a band contains) and distribution of bands, with commonly-used datasets such as Landsat, Sentinel and MODIS having around 8-9. table of bands captured by Landsat 8, by the OLI and TIRS sensors respectively (Wikipedia) the spectral placement of different Landsat bands, mapped against the atmospheric absorption spectrum (image credit: Wikimedia) For each image of the earth’s surface captured, each ‘band’ in the dataset will consist of a black-and-white image representing the intensity of surface reflectance in that band. The brighter the pixels, the more light is being reflected in that part of the spectrum. Combined together, these bands can be used to reconstruct colour images. In different satellite image datasets, the numbering of the bands will correspond to different parts of the spectrum. In this guide we will use Landsat 8 band numbering, however diagram of the OLI sensor on board Landsat 8 (Wikipedia) One important thing to note is that sensors (the things that actually capture the data) normally have different names to the satellites themselves, and one satellite may have many sensors on board. Thus, you might often see Landsat 7’s dataset referred to as ‘ETM+’ (Enhanced Thermal Mapping), or Landsat 8 (which contains two different sensors) as OLI (Optical Light Instrument) and TIRS (Thermal Infrared Sensor). seeing more with band comparisons Multispectral satellite imaging techniques use differences between light reflected in different bands to reveal information about a scene. Consider the following example, a satellite image of lakes around the American town of Sandersville, Georgia, surrounded by a series of white patches. This first image is a typical ‘true colour’ satellite image, like you’d see on Google Earth. This image has been composed by taking the R, G and B bands separately, and displaying the R band with the red pixels of your computer screen, the G band with the green pixels, and the B band with the blue pixels. (Google Earth Engine/Landsat 8) To get a different perspective on the scene, we can use a ‘band combination’ – a false colour image that makes use of out-of-visible range information to highlight different features of the scene. Shown below is the classic ‘vegetation’ band combination, which uses the Near Infrared (NIR) 5 band in the ‘R’ slot, with ‘R’ information in the G slot and G in the B slot (Landsat 8 bands 5, 4 and 3 respectively)why this order? Within Earth Observation (EO) there are conventions as to what bands go into which ‘slot’ of the image, normally in descending order – though you would still be able to see differences by swapping them around.. In areas with large amounts of vegetation, this will produce a very bright red image. The darker red indicates areas where the vegetation is healthy – lighter red indicates sparser vegetation. for comparison to the NIR image of Sandersville, shown here is the same band combination (5, 4, 3) applied to the Nile Valley in Egypt (Google Earth Engine/Landsat 8) Note that the same chalky-white patches have appeared in all of the images so far, meaning that whatever substance is there is reflecting all incident radiation of the wavelengths we’ve been looking at, including this Near Infrared band. However, in this next image, we can see that some of the patches are no longer white. This image was generated using the 7, 6, 4 band comparison, also sometimes called the Shortwave Infrared comparison, which is also used to monitor soil health. Now, around half of the white areas from the previous image are now cyan in colour, and there’s a much greater degree of contrast and variation in those areas. (Google Earth Engine/Landsat 8) What we are looking at are lakes with high deposits of kaolinite – a clay mineral – in Sandersville, Georgia. Kaolin clay is mined in large open-cast mines for use in the paper, ceramics and coatings industry. It’s part of a geological feature that passes diagonally through Georgia, known as the ‘fall line’, that separates two tectonic plates. Hundreds of tons of kaolin clay are extracted each year from this area of Georgia, from large open pit mines. graph showing the spectral signature of blue sky, showing high reflectance in the blue part of the light spectrum (Wikipedia) In order to match up what we’re seeing in the satellite image to the material we are interested in, we want to look at what’s called the ‘spectral signature’ of kaolinite. A spectral signature is a graph that shows, for a particular material, what proportion of different wavelengths of light you would expect to be reflected. For example, the ‘spectral signature’ of ‘blue sky’ reflects a lot of light around the ‘blue light’ wavelength. Light that isn’t blue gets absorbed, meaning that when you are looking at the sky, it’s blue light that’s reaching your eyes – resulting in a blue colour. Below is the reflectance spectrum of kaolinite, marked in red, with the relevant Landsat bands marked in navy blue overlaid. This image was made using the USGS Spectral Characteristics Viewer, which allows you to map the reflectance spectrum of a mineral of interest against the bands of different satellite sensors, including the Landsat and Sentinel satellites. The reason that kaolinite looks white in the first two images is that bands 2, 3, 4, 5 and 6 all have a high reflectance – so when those bands are slotted into the R,G,B channels of an image, they are all uniformly bright. However, we can see that the reflectance dips around 1.4μm, and that it drops off sharply after a wavelength of 2μm. Thus – much less light is reflected in band 7 (SWIR 2), meaning that in the 7, 6, 4 image, the G and B channels are bright but R is dark, hence cyan. band ratios As you might have noticed, the band comparisons are a bit of a blunt tool. We have to make images with several different bands before we notice the difference between them. This brings us to the next technique: band ratios. Band ratios are a type of index, a way of combining different bands together to highlight things like vegetation, moisture and different rock types. Typically, the word ‘ratio’ refers to a measure determined by dividing one satellite imaging band by another, in order to highlight materials whose reflectance is most different in those bands. As shown in the previous example, kaolin clay reflects the most amount of light in the NIR band (5) and absorbs most light in the SWIR-2 band (7). We can look for the contrast between those bands using the 5/7 band ratio. By applying this band ratio, anything reflecting a lot of light in band 5 but absorbing a lot of light in band 7 will appear very bright, with materials with other absorption spectra appearing dark. This band ratio highlights a number of bright white spots in the images. (Google Earth Engine/Landsat 8) It would be tempting to conclude that this is where the kaolin mines are, but checking the location of active mining pits against the location of the white spots, it seems that, while they contain some bright patches, the mining areas are not the brightest parts of the image. (Google Earth Engine/Landsat 8) If we zoom into one of these mining areas – marked as Southeastern Performance Minerals LLC on Google Maps – we can see in detail what is being highlighted. Note that the two Google Earth Engine images appear pixellated at this scale, but the Google Maps image on the right is much higher resolution. That’s because Google Maps uses a bunch of different data, included private data"
