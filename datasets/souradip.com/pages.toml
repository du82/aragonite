20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20class%3D%22icon%22%20fill%3D%22%23E0245E%22%20d%3D%22M12%2021.638h-.014C9.403%2021.59%201.95%2014.856%201.95%208.478c0-3.064%202.525-5.754%205.403-5.754%202.29%200%203.83%201.58%204.646%202.73.813-1.148%202.353-2.73%204.644-2.73%202.88%200%205.404%202.69%205.404%205.755%200%206.375-7.454%2013.11-10.037%2013.156H12zM7.354%204.225c-2.08%200-3.903%201.988-3.903%204.255%200%205.74%207.035%2011.596%208.55%2011.658%201.52-.062%208.55-5.917%208.55-11.658%200-2.267-1.822-4.255-3.902-4.255-2.528%200-3.94%202.936-3.952%202.965-.23.562-1.156.562-1.387%200-.015-.03-1.426-2.965-3.955-2.965z%22%2F%3E%3C%2Fsvg%3E)}Souradip Mookerjee @souramooclinical medicine starter pack 2021: *gulp*#COVID19 #Lockdown #MedTwitter #medstudenttwitter15 11:28 PM · Jan 4, 2021That's right! I started on infectious diseases, and since then it's been a whistle-stop tour through everything from oncology, through to cardiology and respiratory medicine. I've been at the Royal Papworth hospital this last week and the teaching was incredibly well organised. I had the chance to see some truly cutting-edge treatments from pulmonary endarterectomies through to ECMO! I even got the chance to intubate someone under supervision before an open heart operation.I felt like a real medical student, turning up to the wards with a friend, looking over patient notes and results, figuring out a management plan and getting taught from the junior doctors on the ward. I've also been added to the staff bank at the hospital to cover shifts because they're really struggling with having enough people to run a safe service.My nameCOVID has meant we have to wear quite strict PPE everywhere in the hospital. But in a way it feels somewhat dehumanising. It's really hard to talk with an FFP3 mask on. This has become a problem because it's hard to introduce myself as I normally would. Not only is my face covered up (and so it's easy to just become anonymous, with nobody recognising me between days, making building long-term rapport with other staff hard), but this is a conversation I've had a lot with other healthcare staff:"Hello, I'm Souradip and I'm a medical student here""Hi, sorry, what did you say your name was?""Souradip""So- who?""Souradip, S-O-U-R-A-D-I-P""...""It's like sour dip with an a in the middle" (my go-to joke to lighten the mood)"What?"Not only is it hard for people to know my face, they can't even know my name! And humour doesn't seem to translate well when they can't hear half of the joke. And the best way to kill a joke is to keep repeating it again and again...I quickly threw together an app so that I can pull out my phone to skip that conversation:The worries and the deathsI pulled a shift in ICU while I was at Papworth, and I attended a cardiac arrest call (someone's heart had stopped). It was on a COVID ward, so I PPE'd up and turned up. It was a man who was around the same age as my dad and also from a BAME background. I don't normally notice a pa'''
