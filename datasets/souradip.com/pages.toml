["https://souradip.com/blog/nhs-bursary-guide-for-medical-students"]
title = "NHS Bursary: A Complete Guide for Medical Students · Souradip Mookerjee"
description = "I am about to return to Clinical School. The NHS Bursary Scheme pays for tuition in our fifth and si..."
full_description = '''Souradip MookerjeeBack to article listHome / Blog / NHS Bursary: A Complete Guide for Medical StudentsNHS Bursary: A Complete Guide for Medical StudentsPermalink to postPublished on 17 Jun 2020 · 9 mins readmedicinemed-schoolI am about to return to Clinical School. The NHS Bursary Scheme pays for tuition in our fifth and sixth years of medical school, and it's the time where we need to apply to be ready for the coming academic year. The information to make a successful application, however, is scattered all over the place! I had to call their support line on a few different occasions (they are very helpful - 0300 330 1345!)..tweet-card{background:#fff;margin:15px 0;padding:20px;background-color:#fff;border:1px solid #e1e8ed;border-radius:5px;font-size:16px;line-height:1.4;font-family:Helvetica,Roboto,"Segoe UI",Calibri,sans-serif;color:#1c2022;max-width:500px;text-align:left}.tweet-card:hover{border-color:#ccd6dd}.tweet-card a{color:#2b7bb9;text-decoration:none}.tweet-card a:hover{color:#3b94d9}.tweet-header{display:flex}.tweet-header .tweet-profile{margin-right:9px;flex-shrink:0}.tweet-header .tweet-profile img{border-radius:50%;height:36px;width:36px}.tweet-header .tweet-author{display:flex;flex-direction:column;flex-grow:1}.tweet-header .tweet-author-name{font-weight:700;color:#1c2022;line-height:1.3}.tweet-header .tweet-author-name:hover{color:#3b94d9}.tweet-header .tweet-author-handle{color:#697882;font-size:14px;line-height:1}.tweet-header .tweet-bird{margin-left:20px}.tweet-images img{width:100%;max-height:250px;object-fit:cover;margin-bottom:10px;border-radius:4px}.tweet-footer{display:flex;align-items:center}.tweet-card .tweet-footer a{color:#697882;font-size:14px}.tweet-footer .tweet-date:hover{color:#2b7bb9}.tweet-footer .tweet-like{margin-right:15px;font-size:15px;display:flex;align-items:center}.tweet-footer .tweet-like:hover{color:#e0245e}.tweet-footer .tweet-like-count{margin-left:4px}.tweet-footer .tweet-like-icon{filter:grayscale(1) brightness(1.4);transition:filter}.tweet-footer .tweet-like:hover .tweet-like-icon{filter:none}.tweet-bird-icon,.tweet-like-icon{display:inline-block;width:1.25em;height:1.25em;background-size:contain;background-repeat:no-repeat;vertical-align:text-bottom}.tweet-bird-icon{background-image:url(data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2072%2072%22%3E%3Cpath%20fill%3D%22none%22%20d%3D%22M0%200h72v72H0z%22%2F%3E%3Cpath%20class%3D%22icon%22%20fill%3D%22%231da1f2%22%20d%3D%22M68.812%2015.14c-2.348%201.04-4.87%201.744-7.52%202.06%202.704-1.62%204.78-4.186%205.757-7.243-2.53%201.5-5.33%202.592-8.314%203.176C56.35%2010.59%2052.948%209%2049.182%209c-7.23%200-13.092%205.86-13.092%2013.093%200%201.026.118%202.02.338%202.98C25.543%2024.527%2015.9%2019.318%209.44%2011.396c-1.125%201.936-1.77%204.184-1.77%206.58%200%204.543%202.312%208.552%205.824%2010.9-2.146-.07-4.165-.658-5.93-1.64-.002.056-.002.11-.002.163%200%206.345%204.513%2011.638%2010.504%2012.84-1.1.298-2.256.457-3.45.457-.845%200-1.666-.078-2.464-.23%201.667%205.2%206.5%208.985%2012.23%209.09-4.482%203.51-10.13%205.605-16.26%205.605-1.055%200-2.096-.06-3.122-.184%205.794%203.717%2012.676%205.882%2020.067%205.882%2024.083%200%2037.25-19.95%2037.25-37.25%200-.565-.013-1.133-.038-1.693%202.558-1.847%204.778-4.15%206.532-6.774z%22%2F%3E%3C%2Fsvg%3E)}.tweet-like-icon{background-image:url(data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20class%3D%22icon%22%20fill%3D%22%23E0245E%22%20d%3D%22M12%2021.638h-.014C9.403%2021.59%201.95%2014.856%201.95%208.478c0-3.064%202.525-5.754%205.403-5.754%202.29%200%203.83%201.58%204.646%202.73.813-1.148%202.353-2.73%204.644-2.73%202.88%200%205.404%202.69%205.404%205.755%200%206.375-7.454%2013.11-10.037%2013.156H12zM7.354%204.225c-2.08%200-3.903%201.988-3.903%204.255%200%205.74%207.035%2011.596%208.55%2011.658%201.52-.062%208.55-5.917%208.55-11.658%200-2.267-1.822-4.255-3.902-4.255-2.528%200-3.94%202.936-3.952%202.965-.23.562-1.156.562-1.387%200-.015-.03-1.426-2.965-3.955-2.965z%22%2F%3E%3C%2Fsvg%3E)}Gemma Wren @gnwrenI don't know why people complain about the NHS bursary application process. I mean, all I have to do is find my original birth certificate (which was lost in France in 1996), post them my passport, my parents' decree nisi, and a vial of my own blood collected during a full moon.359 08:01 PM · May 29, 2020I thought it would be helpful for anyone applying in the future to have all the information in one place, from submitting the application online to sending in evidence (and the specific type of Royal Mail envelopes you'll need) through to how long you can expect it to take.The timeframeThere is a suggested timescale posted at NHSBSA - but they advised me to start earlier rather than later because posting evidence to them and getting it back can take a while. They recommended I start even if the "application window" hasn't opened just yet.For this year:Date your course beginsApplications openApplication deadlineJune / July 20202 March 202029 May 2020August 20206 April 202026 June 2020September / October 20204 May 202031 July 2020The Online ApplicationThis is probably where there is the most guidance available. They have a step-by-step guide over here.You can manage this all online through BOSS.For my situation (if you're an MB/PhD student, this gets somewhat confusing) I had to fill out my form for course details as follows:Filling out income as a medical student with a part-time jobFor the income section, they stateIf you are a full-time student, you should exclude earnings for work done in the evenings, at weekends or during holidays whilst you are attending your course. Only declare these earnings if you are a part-time student.So if you're a full-time medical student like me, even if you have a job, everything here should be 0.All expenses should also be filled out as 0:If you are not declaring any income in this section, please do not declare any expenses e.g. your rent. This is because we do not take into account your expenses when you have no income to offset against them. This will also save you time, as we will not need you to send us evidence of this e.g. a rent agreement.Financial independence status for MB/PhDsFor the Student Award section, MB/PhDs do not sadly fit the criteria for being an "independent student" by default (despite being financially independent from my parents from a research grant for 3 years) and thus eligible for means-testing based on our current income.The criteria for this is you have supported yourself out of your own earnings (including any benefits) before the first academic year of your course for a total of 36 months? which is likely not the case since the start of my course was when I was 18.There are however exceptions if you meet any of the other criteria, e.g. if you are married/divorced/widowed, parents are deceased/irreconcilably estranged, if you have a child, etc, none of which I have thankfully managed yet by 25!Posting evidenceI was not applying for the means-tested portion, only the tuition fees. Even so, I was requested to submit evidence of my identity and proof I am on a medical course:Please provide your most recent local authority (LA) or student finance award letter.Please provide two forms of identification. This must include your birth certificate AND one form of the following photo identity:Passport (current and valid)Driving Licence (photo card)So I had to send in my original birth certificate and passport, as well as my latest student finance letter AND their student coversheet from my application.These are not things I want to get lost in the post. They recommend:Please send your NHS Bursary supporting evidence and student coversheet by Special Delivery post to:(Your unique SBA reference number) NHS Student BursariesRidgway HouseNorthgate CloseMiddlebrookHorwichBoltonBL6 6PQSpecial Delivery post will enable you to track the delivery of your documents. We will email you once we have scanned your documents but please note that this may be up to five working days after we receive them.We do not offer appointments or accept walk ins to have your evidence scanned (any walk ins we do receive will be turned away) so post your supporting evidence to us at the address above.But my local post office was adamant you cannot "pre-pay" for special delivery. They were happy to give me these grey envelopes for free though, to be paid once it's ready to be posted, price dependant on weight.To get around this, you need to ask for Special Delivery stamps x2 (which are valid for envelopes <500g) as well as the grey special delivery envelopes x2. Yes they are cheap thin plastic. You can ask for A4 envelopes which are a better fit for paper than the A5 ones they have.Fill out one envelope with your home address (that they will send it back in) and take a photo of the barcode sticker on the envelope (e.g. SF847997909GB) - this is the tracking code for your return envelope that you can use at Royal Mail Track and Trace.Then you must fill out the other envelope with the SBA number found at the top of BOSS after logging in followed by the address above. Take a note of the barcode sticker on this too (the SF....GB number) to track its progress to NHSBSA. Finally, put the envelope with your return address on it inside of the envelope to send to them, along with the rest of the evidence they request. Then tape it shut.If you do not provide a return envelope, they said that they will post it back by standard second class mail.Wait to hear backYou can track when they receive your evidence, but this may take up to 15 working days when I called them up. Nothing will update on BOSS until they have processed it all. My evidence arrived on 2nd June, heard nothing after that. I called them up to make sure they had in fact received my package, and they confirmed receipt over phone. I got an email saying my application had been approved on 17th June and my passport/birth certificate/etc arrived back on the very same day.Fill out BOSS again, this time with bank detailsNow that the application has been approved, you will need to log into BOSS again, and this time go to "Update Bank Details" to fill out where they should pay the non-means-tested (and means-tested if applicable) grant to. You may also need to contact your medical school to submit a proof of enrolment:Dear Souradip,Thank you for your application for an NHS Bursary.I have calculated and approved your bursary award, however, I am unable to release payments until we receive official written confirmation from your university that you are eligible for an NHS bursary. This is known as a BUR99 (confirmation of eligibility) formIf you have now started back onto your course, please check with your university that they have arranged to send a BUR99 to us.ConclusionIt takes persistence to make it this far and can't be left to the last minute. It is well-worth it though, to be able to finally stop adding to the £60k+ debt already incurred through student finance for our medical degrees! Follow me on Twitter for more updates @souramoo!Liked this? Please share: Share TweetIn this post...The timeframeThe Online ApplicationFilling out income as a medical student with a part-time jobFinancial independence status for MB/PhDsPosting evidenceWait to hear backFill out BOSS again, this time with bank detailsConclusion'''
