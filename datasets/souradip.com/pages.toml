full_description = '''Souradip MookerjeeBack to article listHome / Blog / MB/PhD Symposium 2019MB/PhD Symposium 2019Permalink to postPublished on 21 Nov 2019 · 8 mins readsciencemedicineBeing the final year of my PhD, I was asked to present a 20 minute talk at this year's annual MB/PhD Symposium here in Cambridge. The talk was very well received! It was also a special year, being the 20th anniversary of the Cambridge MB/PhD Programme. In this post I want to report on all of the other exciting science being done by my colleagues, after the great introduction by the programme director, Professor Stefan Marciniak.Elizabeth Le - Machine Learning to Predict Stroke RiskThe very first talk of the day! Elizabeth gave a wonderful talk on her work in using supervised machine learning on CT scan data from carotid arteries, and how CNNs (convolutional neural networks) can be used to classify plaques that have a high probability of going on to cause disease vs benign plaques. Hopefully this can one day help us prevent strokes in at-risk patient groups! 🤖.tweet-card{background:#fff;margin:15px 0;padding:20px;background-color:#fff;border:1px solid #e1e8ed;border-radius:5px;font-size:16px;line-height:1.4;font-family:Helvetica,Roboto,"Segoe UI",Calibri,sans-serif;color:#1c2022;max-width:500px;text-align:left}.tweet-card:hover{border-color:#ccd6dd}.tweet-card a{color:#2b7bb9;text-decoration:none}.tweet-card a:hover{color:#3b94d9}.tweet-header{display:flex}.tweet-header .tweet-profile{margin-right:9px;flex-shrink:0}.tweet-header .tweet-profile img{border-radius:50%;height:36px;width:36px}.tweet-header .tweet-author{display:flex;flex-direction:column;flex-grow:1}.tweet-header .tweet-author-name{font-weight:700;color:#1c2022;line-height:1.3}.tweet-header .tweet-author-name:hover{color:#3b94d9}.tweet-header .tweet-author-handle{color:#697882;font-size:14px;line-height:1}.tweet-header .tweet-bird{margin-left:20px}.tweet-images img{width:100%;max-height:250px;object-fit:cover;margin-bottom