["https://souradip.com/projects/falls"]
title = "Acoustic Fall Detector 👂 · Souradip Mookerjee"
description = "A fall detector for elderly people using sound. IoT on-device deep learning."
full_description = "A medical IoT Device that uses on-board embedded deep learning (making this privacy-conscious, saving on internet usage and increasing the speed of response) to listen for the sound of elderly people falling over, and calls for help on their behalf. This solution is fast (real-time), supports swarming (multiple units in different rooms, e.g. in care homes), two-way communication, other forms of passive non-invasive monitoring and is cheap to manufacture. Currently being validated in care homes to more effectively use existing limited staffing resources to look after larger numbers of elderly people as well as being field-tested for direct-to-consumer sales."
author = "Souradip Mookerjee"
