full_description = "I'm Souradip. I have a PhD and a medical degree as part of the MB/PhD programme at the University of Cambridge. My research interests are in stem cells, genetic engineering, genomics and deep learning applied to medicine. I publish papers in academic journals. I also write lots of code and get involved with startups. I taught myself to code in 2006, eventually helping set a Linux society in my school by 2009. I have been a contributor to open source software ever since. I've also been working in medical research labs since I was 15. In 2012, I taught myself to get 3 A*s at A-Level just in Maths (alongside my other ones, ending up with 5A*s and 2As). I was in the top 24 in the country at the Chemistry Olympiad. In 2013, I arrived at St Catharine's College, University of Cambridge to read Medicine. Since then I have won best-in-class awards for my projects and writing. I'll be there until 2022, having won a grant to fund a PhD in the middle of my medical degree. I am combining my love of medicine, computer science and research to build the healthcare technologies of tomorrow."
