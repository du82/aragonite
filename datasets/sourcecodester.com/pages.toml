full_description = '''Android Covid-19 Mobile Tracker App (Coronavirus Tracker 2020) Covid-19 Mobile Tracker App (Coronavirus Tracker 2020) Submitted by donbermoy on Monday, April 27, 2020 - 07:59. Operating System Android (adsbygoogle = window.adsbygoogle || []).push({}); Since Google Playstore and IOS Appstore prohibited from putting an app with regards to coronavirus updates because of misinformation. Today, I was able to finish my creation with this Corona Tracker Mobile app that will keep us updated with the current cases of Covid-19 around the world and also to our beloved country. The app uses an API of the World Health Organization, so all of the Covid-19 instances around the globe are in real-time, and this will avoid misinformation. The app also uses graphs to keep track the history of the virus in all different countries affected by the Covid-19 Pandemic. It will be a great help even for statisticians and researchers to interpret the graph. Features of the app: (adsbygoogle = window.adsbygoogle || []).push({}); Can determine the world cases of coronavirus pandemic Search a specific country Display the real-time confirmed cases, active cases, deaths, recoveries, mortality rate of each country History of the previous number of cases in each country Display a graph with the curve to determine if the cases are flattened or not You can download the code here in my post/site or go to: Covid-19 Tracker App Features (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); VIEW DEMO (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); Best regards, Engr. Lyndon R. Bermoy IT Instructor/System Developer/Android Developer Mobile: 09079373999 Telephone: 826-9296 E-mail:[email protected] Visit and like my page on Facebook at: https://www.facebook.com/BermzISware (adsbygoogle = window.adsbygoogle || []).push({}); Subscribe at my YouTube Channel at: Ser Bermz (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); Note: Due to the size or complexity of this submission, the author has submitted it as a .zip file to shorten your download time. After downloading it, you will need a program like Winzip to decompress it. Virus note: All files are scanned once-a-day by SourceCodester.com for viruses, but new viruses come out every day, so no prevention program can catch 100% of them. FOR YOUR OWN SAFETY, PLEASE: 1. Re-scan downloaded files using your personal virus checker before using it. 2. NEVER, EVER run compiled files (.exe's, .ocx's, .dll's etc.)--only run source code. Tags coronavirus app covid-19 app covid-19 tracker covid-19 mobile app coronavirus mobile tracker app (adsbygoogle = window.adsbygoogle || []).push({}); Add new comment Your name Comment Text format Filtered HTMLFull HTML 1 About text formats Subject Save Preview 10918 views Share Source Code or Tutorial Do you have source code, articles, tutorials or thesis to share? Submit it here by clicking the link below Submit now... (adsbygoogle = window.adsbygoogle || []).push({}); Popular Source Code Free and Open Source inventory management system php source code Online Voting System using PHP Free Source Code E-Learning System Using PHP/MySQLi with Source Code Online Hotel Reservation System in PHP/MySQLi with Source Code QR Code Attendance System Using PHP and MySQL with Source Code Free school management software Sales and Inventory Management Software Microsoft Access (VBA) Stock Management System in PHP/OOP with Source Code Online Quiz System Using PHP with Source Code Budget and Expense Tracker System in PHP Free Source Code User account menu Log in Book navigation SQL Tutorial PHP Tutorial CodeIgniter Tutorial Android Tutorial Visual Basic Tutorial C# Tutorial CSS Tutorial Learn 