["https://sourcecodester.com/book/4810/codeigniter-tutorial.html"]
title = "CodeIgniter Tutorial | SourceCodester"
description = "What is CodeIgniter? CodeIgniter is a PHP Framework and is lightweight compared to other framework. Its purpose is to help you code faster and teach you how to apply MVC (Model–View–Controller) architecture to separate code from design. What are the advantages of CodeIgniter? I can’t tell you all the advantages of using CodeIgniter but the following are most common features of using a framework."
full_description = '''Submitted by Anonymous (not verified) on Thu, 03/21/2013 - 21:43 baby i love you so much............. Reply Submitted by Anonymous (not verified) on Fri, 05/24/2013 - 13:55 Need alerts @ more updates Hi , i need alerts for addition of more code snippet. Reply Submitted by odewumi Joshua on Wed, 09/05/2018 - 01:44 Codeigniter Working Project I need a functioning Codeigniter project that i can learn with. Reply CodeIgniter Tutorial Submitted by admin on Friday, November 9, 2012 - 22:46. (adsbygoogle = window.adsbygoogle || []).push({}); What is CodeIgniter? CodeIgniter is a PHP Framework and is lightweight compared to other framework. Its purpose is to help you code faster and teach you how to apply MVC (Model–View–Controller) architecture to separate code from design. What are the advantages of CodeIgniter? I can’t tell you all the advantages of using CodeIgniter but the following are most common features of using a framework. Speed up development Easy to learn than standard PHP Use existing code rather than starting from scratch Well documented Prevent XSS or CSRF exploit Prevent SQL Injection Separate code from design Built in shopping cart, etc. Support multiple databases (MySQL, postgre, odbc, mssql, sqlite, oci8) Form validation Handle session securely CodeIgniter is small, fast, and simple PHP framework compare to other competitor. Because it is well documented, the majority of PHP programmers prefer CodeIgniter. Self-Experience After coding online hotel reservation, I realize that my code (Standard PHP) is not ready for known vulnerabilities like SQL injection. With this in mind, I tried to modify the code from MySQL to MySQLi. But still I was not convinced because there’s a lot of issue that I need to consider and converting it would require another time. But after deciding of using CodeIgniter, I was able to finish the coding from scratch (functionalities of online hotel reservation) within 2 weeks. By studying a framework, all you need is to understand on how MVC works. And besides, working with MVC is much easier than standard PHP. One example is using the redirect function. Since CodeIgniter is using and MVC framework, it’s easy to redirect one page to another page. In this Book, I will teach you all the techniques of using CodeIgniter. So stay tuned while I prepare a tutorial for this. Getting Started With CodeIgniter How I build User Registration and Form Validation Using CodeIgniter How to Display Error Message in CodeIgniter Page Navigation using CodeIgniter Pagination Populate Birth Date Dropdown List Using CodeIgniter Populate Dropdown List Using CodeIgniter Book traversal links for CodeIgniter Tutorial Getting Started With CodeIgniter › (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); Comments Submitted by Anonymous (not verified) on Thu, 03/21/2013 - 21:43 baby i love you so much............. Reply Submitted by Anonymous (not verified) on Fri, 05/24/2013 - 13:55 Need alerts @ more updates Hi , i need alerts for addition of more code snippet. Reply Submitted by odewumi Joshua on Wed, 09/05/2018 - 01:44 Codeigniter Working Project I need a functioning Codeigniter project that i can learn with. Reply Submitted by Phemehboy on Thu, 11/21/2019 - 15:54 Codeigniter Thanks for the tutorial Reply Add new comment Your name Comment Text format Filtered HTMLFull HTML 1 About text formats Subject Save Preview Add new comment9141 views Share Source Code or Tutorial Do you have source code, articles, tutorials or thesis to share? Submit it here by clicking the link below Submit now... (adsbygoogle = window.adsbygoogle || []).push({}); Popular Source Code Free and Open Source inventory management system php source code Online Voting System using PHP Free Source Code E-Learning System Using PHP/MySQLi with Source Code Online Hotel Reservation System in PHP/MySQLi with Source Code QR Code Attendance System Using PHP and MySQL with Source Code Free scho