title = "SQL DELETE Statement | SourceCodester"
description = "When you insert data into your table you may need to update it sometimes. Not so often we inserted or updated a wrong data. That’s why there is a Delete statement. To delete some record from the database tables we use the SQL Delete statement, the Delete Statement deletes the data row from the table which meets the condition specified in the where clause. The delete command has the following syntax:"
full_description = '''Submitted by Anonymous (not verified) on Sun, 08/14/2011 - 15:55 vb6 I don't know how to usethe delete code...! can u help me...? Reply SQL Tutorial SQL DELETE Statement SQL DELETE Statement Submitted by admin on Tuesday, March 1, 2011 - 23:23. (adsbygoogle = window.adsbygoogle || []).push({}); When you insert data into your table you may need to update it sometimes. Not so often we inserted or updated a wrong data. That’s why there is a Delete statement. To delete some record from the database tables we use the SQL Delete statement, the Delete Statement deletes the data row from the table which meets the condition specified in the where clause. The delete command has the following syntax: DELETE FROM TABLE_NAME WHERE COLUMN= VALUE Consider that we want to delete all the users from the table who are married, and then the delete statement will be like: DELETE FROM users WHERE martialstatus=”married” The resulting data of users table will be as Users: Firstname Lastname Age Maritalstatus Country Bill Steve 20 Single Usa Steve Hills 30 Single france Tom Jerry 20 Single USA Similarly we can delete some row with multiple conditions. Say we want to delete users who are from france and are single then the SQL delete statement will be like: DELETE FROM users WHERE (Maritalstatus=”Single” AND Country=”france”) The resulting data will be like: Firstname Lastname Age Maritalstatus Country Bill Steve 20 Single Usa Tom Jerry 20 Single USA Never ever forget to write the where clause in the delete command, if you accidently forgot to include the where clause in the delete command then all the data of the table will be flushed (wiped away). Consider this example: DELETE FROM users Then all data will be erase. Firstname Lastname Age Maritalstatus Country So, you can simply exclude the where clause if you wish to erase all the data from the table. (adsbygoogle = window.adsbygoogle || []).push({}); Tags sql tutorial delete statement (adsbygoogle = window.adsbygoogle || []).push({}); Comments Submitted by Anonymous (not verified) on Sun, 08/14/2011 - 15:55 vb6 I don't know how to usethe delete code...! can u help me...? Reply Add new comment Your name Comment Text format Filtered HTMLFull HTML 1 About text formats Subject Save Preview Add new comment139 views Share Source Code or Tutorial Do you have source code, articles, tutorials or thesis to share? Submit it here by clicking the link below Submit now... (adsbygoogle = window.adsbygoogle || []).push({}); Popular Source Code Free and Open Source inventory management system php source code Online Voting System using PHP Free Source Code E-Learning System Using PHP/MySQLi with Source Code Online Hotel Reservation System in PHP/MySQLi with Source Code QR Code Attendance System Using PHP and MySQL with Source Code Free school management software Sales and Inventory Management Software Microsoft Access (VBA) Stock Management System in PHP/OOP with Source Code Online Quiz System Using PHP with Source Code Budget and Expense Tracker System in PHP Free Source Code User account menu Log in Book navigation SQL Tutorial SQL intro SQL Syntax SQL SELECT Statement SQL INSERT Statement SQL UPDATE Statement SQL DELETE Statement SQL WHERE Clause SQL ORDER BY Clause SQL GROUP BY Clause SQL HAVING Clause SQL DISTINCT Clause SQL AND / OR Operator SQL BETWEEN Operator SQL LIKE Operator SQL IN Operator SQL AVG() Function SQL DEFAULT Constraint SQL DROP Statement SQL FIRST Function SQL MID() Function SQL Max() Function SQL Data Types SQL TOP Clause SQL Wildcards SQL Alias SQL Joins SQL INNER JOIN Keyword SQL LEFT JOIN Keyword SQL RIGHT JOIN Keyword SQL FULL JOIN Keyword SQL Union Operator SQL Create Database Statement SQL CREATE TABLE Statement SQL ALTER TABLE Statement SQL AUTO INCREMENT Field SQL COUNT() Function SQL FOREIGN KEY Constraint SQL FORMAT Function SQL LEN() Function SQL Min() Function SQL NOW() Function SQL PRIMARY KEY Constraint SQL SUM() Function SQL UNIQUE Contraints PHP Tutoria