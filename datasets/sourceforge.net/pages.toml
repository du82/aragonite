elds, and labels In addition to simple search, an advanced search syntax is available. Favorite searches can be saved for frequent use. Threaded discussion on tickets Subscribe to tracker updates through email or rss Links and backlinks to other artifacts throughout SourceForge (all of our tools have this)"
