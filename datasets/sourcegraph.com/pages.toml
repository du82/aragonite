full_description = '''ChangelogThe latest updates to the Sourcegraph platform.TopicsCodyVS CodeJetBrainsEnterpriseCody WebCode SearchVisual StudioAutocompleteChatCode MonitorsEclipseThank you! Your submission has been received!Oops! Something went wrong while submitting the form.Subscribe for the latest code AI news and product updates hbspt.forms.create({ portalId: "2762526", formId: "6b6eaaf8-c6ec-410c-9a2b-2e93761cb453" }); .hs-form { display: block; } February 17, 2025Autocomplete now available for Visual Studiov0.2.0Kelvin YapAutocomplete is now available in the latest experimental version of Cody for Visual Studio, including single and multi-line autocomplete suggestions.February 17, 2025o3-mini high available to Enterprise customersv6.1Kelvin YapOpenAI’s latest cost-efficient reasoning model is available to Sourcegraph Enterprise customers.February 17, 2025Prompt template UI changesv6.1Kelvin YapThe prompt templates editor UI has been updated to move all context under one menu.February 17, 2025Updates to model availability for Codyv6.1Kelvin YapWe are deprecating and removing models available for Cody based on usage, feedback, and the introduction of newer models.February 5, 2025Enterprise Starter plan now availablev6.0Kelvin YapEnterprise Starter is a new plan designed for teams of up to 50 developers, giving them access to powerful code search, AI chat, multi-repo context, and more.February 5, 2025Introducing a unified UI for chat and searchv6.0Kelvin YapSourcegraph 6.0 introduces a unified UI for searching, understanding, and creating code, making it the first place devs can go to find what they need about their codebase.January 29, 2025The future of enterprise software: Sourcegraph’s AI agentsv6.0Kelvin YapSourcegraph’s AI agents automate repetitive tasks in enterprise software development, helping teams scale efficiency, improve code quality, and accelerate progress across complex codebases.January 29, 2025Cody Analytics is now Sourcegraph Analyticsv6.0Kelvin YapSourcegraph Analytics provides customers with aggregate and product-specific metrics for Code Search, Batch Changes, and Code Insights, in addition to the Cody metrics they can view today.January 28, 2025Auto-edit: An automated, non-linear coding experience for Codyv7.12v6.0Kelvin YapAuto-edit brings context-aware, non-linear code suggestions to Cody, helping developers seamlessly update and refactor code across their codebase.January 28, 2025Agentic chat: Smarter, context-aware responsesv6.0v7.12v1.64Kelvin YapCody’s new agentic chat autonomously gathers and refines context from your codebase, terminal, and the web to deliver precise, high-quality responses.January 28, 2025Preconfigure context in saved promptsv6.0Kelvin YapEmbed files, repositories, and more into prompts saved in the Prompt Library, creating precise, context-rich prompts tailored to specific teams and use cases.December 18, 2024Gemini 2.0 Flash Experimental available for Cody chatv5.11Kelvin YapCody now supports Gemini 2.0 Flash Experimental for chat, Google’s model that outperforms Gemini 1.5 Pro on key benchmarks with promising improvements across developer-related benchmarks.‍December 18, 2024Categorize prompts with tagsv5.11Kelvin YapCody Enterprise users can now tag prompts they create, making it easier to group, organize, and filter prompts for easier discovery in the Prompt Library.‍November 27, 2024Experimental support for Cody in Eclipse IDEv0.4.16Alex IskenCody is now available for the Eclipse IDE as an experimental plugin. We’d love your feedback!November 25, 2024Enterprise model selection is now generally availablev5.10Alex IskenCody Enterprise users can now swap between multiple model options from their IDE, and admins can define available models.November 25, 2024Postgres 16 upgrade for customers using the Sourcegraph Postgres imagev5.10Jacob PleinessSelf-hosted customers using the provided Sourcegraph Postgres image will be upgraded to Postgres 16.November 25, 2024Accelerate your work with the new Prompt Libraryv5.10Kevin ChenThe new Prompt Library lets Cody users build and share custom prompts, accelerating your everyday work with reusable building blocks.November 25, 2024Cody Enterprise admins can now configure pre-instructions for user promptingv5.10Alex IskenYou can now define standardized pre-instructions for Cody to determine how it answers questions or which questions it will answer.November 13, 2024Improved Cody release updatesv1.42Kalan ChanCody releases will now have more thorough and detailed release notes.November 11, 2024New Claude 3.5 Sonnet and Claude 3.5 Haiku models are available in Codyv5.9Alex IskenCody now supports the updated Claude 3.5 Sonnet and Claude 3.5 Haiku models across all plans.October 30, 2024Updated Prompts interface available for Cody Enterprise and JetBrainsv5.9Kelvin YapPrompt and command use and discovery has been simplified in JetBrains and for Cody Enterprise users, and the chat window has been tidied up so that only Prompt drafts you own will appear in the UI.October 30, 2024The new search experience is now on by defaultv5.9Kelvin YapThe new search experience launched in August is now the default experience for users, with the option to opt out back to the old view. The new search experience brings improvements in speed and simplifies the search and navigation process.October 30, 2024IP-based permissions support for Perforcev5.9Kelvin YapPreviously, Sourcegraph only supported enforcing username-based restrictions to individual files and folders based on the Perforce protections table. In this release, Sourcegraph now supports access control based on a user's IP address as well.October 30, 2024Experimental support for Visual Studio IDEv0.1.0Kelvin YapWe now have an experimental version of Cody available for Visual Studio, allowing users access to Cody chat. This is the first step in the journey towards general availability and we'd love to hear your feedback.October 30, 2024Promoted Prompts for VS Code and Cody Webv5.9Kelvin YapPrompts can now be promoted to show at the top of the Prompts list, allowing organizations to highlight specific Prompts that encourage best practices or are recommended to use.October 15, 2024New, sleeker Prompts interfacev1.38Alex IskenCody has a new interface for quickly selecting Prompts and commands from the sidebar.October 14, 2024Improved chat performance & autocomplete provider updatev1.38Beatrix WooCody v1.38 brings significant improvements to chat performance and updates to the autocomplete provider.October 7, 2024Improved context fetching from @-mentioned repos for Cody Enterprise Cloudv5.8Kelvin YapIn the latest Sourcegraph release for Enterprise Cloud customers we've made improvements to the context fetched from @-mentioned repos, providing greater precision and increasing the likelihood Cody returns higher quality responses.October 7, 2024Removal of multiple job pods for Kubernetes Executorsv5.8Kelvin YapSingle job pods for native Kubernetes Executors have been the default method for the past couple of releases, and based off positive feedback we are now removing multiple job pod configurations as a configuration option.October 7, 2024Autocomplete improvements for DeepSeek-V2v5.8Kelvin YapDeepSeek-V2 was recently introduced as the default autocomplete model for Cody Enterprise customers, and we have implemented optimizations to prompt caching and direct routing that have resulted in improved latency and quality for both single-line and multi-line completions.October 2, 2024Execute terminal commands with Smart Applyv1.36Kelvin YapSmart Apply now supports the executing of commands in the terminal, allowing users to execute a suggestion Cody provides with the simple click of a button.October 2, 2024Join the waitlist to use OpenAI o1 with Codyv1.36Alex IskenOpenAI just unveiled its latest models, 01-preview and o1-mini, which offer enhanced reasoning capabilities for tackling complex tasks. Both models are now available in Cody as a limited release.October 2, 2024Sunsetting the experimental Cody Ignore featurev1.36Alex IskenWe are sunsetting Cody Ignore in this release. Cody Ignore was an experimental feature that was off by default for all users, only enabled via the experimental feature setting in the Cody extension. It lets users specify files or folders in a .cody/ignore file which were then ignored by Cody and disregarded from context.September 4, 2024New default models for enterprise: DeepSeek-V2 and Claude 3.5 Sonnetv5.7Kelvin YapCody is built on model interoperability and we aim to provide access to the best and latest models, and today we’re making an update to the default models offered to Enterprise customers: DeepSeek-V2 is the recommended default for autocomplete, while Claude 3.5 Sonnet is now the recommended default for chat and prompts.September 4, 2024@-mention directories for Cody Web and Enterprisev5.7Kelvin YapAlongside files and repos Cody now lets developers @-mention directories as context, making it easier for users working with larger, more complex repos like monorepos to ensure they're including the best context with their prompts.September 4, 2024Search Jobs now generally availablev5.7Kelvin YapSearch Jobs are now generally available, allowing for search queries to be run across your entire codebase where completeness is prioritized over quick response times and results ranking.September 4, 2024Cody Web is now generally availablev5.7Kelvin YapThe core experience of using Cody is alongside your code in your IDE of choice, but there are often times when you want to interact with Cody via the web. It can be particularly helpful as part of a workflow where you’re performing a search via Code Search and need help from Cody, or if you’re on your mobile device and want to ask it a question. We’re happy to announce that Cody Web is now generally available and includes numerous improvements to make the web experience better and more consistent.September 4, 2024Code Monitor Webhooks generally availablev5.7Kelvin YapWebhooks for Code Monitors are now generally available, alerting users whenever a new search result or change appears via a webhook receiver.September 4, 2024Smart Apply available in JetBrainsv7.0Kelvin YapSmart Apply is now available for JetBrains, allowing users to take suggestions from the Cody chat window and near-instantly turning them into diffs in your code.September 4, 2024New JetBrains side panelv7.0Kelvin YapIn our quest for consistency across how you use Cody, JetBrains users now get the same side panel experience found in Cody for VS Code and on the web. Chat lives in the side panel, there are now dedicated tabs for easier navigation, and prompts are now easier to discover and use.August 21, 2024Accept and reject block-level diffs for granular controlv1.32Alex IskenYou can now control which parts of a multi-line edit to accept with more granularity. When you ask Cody to edit a block of code, the presented diff will be split into discrete code blocks, and you can accept or reject each diff separately.August 21, 2024Chat now uses the full sidebar width in VS Codev1.32Alex IskenYou can now control which parts of a multi-line edit to accept with more granularity. When you ask Cody to edit a block of code, the presented diff will be split into discrete code blocks, and you can accept or reject each diff separately.August 21, 2024Ask Cody to Fix, now on Windows in JetBrainsv6.0.26Alex IskenYou can now control which parts of a multi-line edit to accept with more granularity. When you ask Cody to edit a block of code, the presented diff will be split into discrete code blocks, and you can accept or reject each diff separately.August 21, 2024Dynamically insert code from Cody chat into your files with Smart Applyv1.32Alex IskenChat-Oriented Programming (CHOP) allows users to interact with AI to solve problems and write code directly through chat. The new Smart Apply feature enables quick conversion of AI suggestions into code diffs. By pressing Apply, Cody intelligently inserts suggested code directly into code files, streamlining the process from chat to implementation.August 21, 2024Faster, more accurate autocomplete with VS Codev1.32Alex IskenAutocomplete has been improved with faster performance and greater accuracy, including a 350-millisecond reduction in latency and a 4% increase in completion acceptance rate. The update features the new DeepSeek-V2 model and is available to Free and Pro users, with full rollout to Enterprise users coming soon.Subscribe for the latest code AI news and product updatesBy submitting, I agree to Sourcegraph's Terms of Service and Privacy Policy. hbspt.forms.create({ portalId: "2762526", formId: "6b6eaaf8-c6ec-410c-9a2b-2e93761cb453" }); .hs-form { display: block; } Accelerating how software is builtFeaturesAI Editor AssistantCode SearchAgentsBatch ChangesResourcesDocumentationResource LibraryBlogChangelogCase StudiesCommunitySupport ForumCompanyAboutCareersContactHandbookBrand GuidePricing© 2025 Sourcegraph, Inc.System statusTerms of servicePrivacy policyVisual StudioEclipse5.9.0AutocompleteCody WebJetbrainsVS CodeEnterpriseBlogSourcegraphCode AICodyCode Search'''
