["https://sourcegraph.com/features"]
title = "Features"
full_description = '''FeaturesSearch, navigate, and automate code faster.ChatPromptsAutocompleteSearchChatChat directly with AI to ask questions about your code, generate code, and edit code. Cody has context of your open file and repository by default, and you can use '@' to add context on specific files, symbols, remote repositories, or other non-code artifacts.Ask about your codeUse "@" + a repository, file, line range, or symbol to ask questions about your codebase. Generate code using context @-mention files or symbols to use that code as context. Cody will use it to generate contextually relevant code.Smart ApplyWhen Cody suggests code in chat, hit "Apply" to make those changes directly in your files.Inline editsHighlight code, hit the edit hotkey, and describe a change. Cody will generate a diff for the change in seconds.Choose your favorite modelChoose from model options optimized for speed versus accuracy.Reference development artifacts and the web@-mention web URLs to pull live information like docs. You can also connect Cody to OpenCtx to @-mention non-code artifacts like Google Docs, Notion pages, Jira tickets, and Linear issues.Run offline (Experimental)Connect to Ollama to run entirely offline. You can even code using AI on an airplane.PromptsAutomate key tasks in your workflow with premade and customizable prompts. Any common query or task can be built into a prompt to save and share with your team.‍Generate unit testsGenerate unit tests for your code selection, adding to your existing test file or creating a new one, with consideration for your existing tests and test framework.Document codeGenerate documentation for any selection of code (from symbols to entire files), even for legacy code you didn't write yourself.Find code smellsAnalyze a code selection and provide suggestions for improving readability, maintainability, performance, or security.Prompt libraryCreate and save prompts for reuse, then share them with your teammates via the Prompt Library.Inline editsHighlight code, hit the edit hotkey, and describe a change. Cody will generate a diff for the change in seconds.Choose your favorite modelChoose from model options optimized for speed versus accuracy.AutocompleteSourcegraph predicts what you're trying to write before you type it. It makes single-line and multi-line suggestions as you type, using the context of the code around your cursor to make accurate suggestions.Smart predictionsCody predicts your next move as you type, suggesting code (like function arguments) without needing to look them up.Natural language code generationType out a comment in natural language. Cody will suggest how to implement what you commented.SearchSearch all of your code in one place. Sourcegraph indexes all your code hosts to a single server that you can search and navigate from the web.Multi-repo, multi-code host searchSee your code from a single search bar, across every repository and every code host.Shareable web linksShare exact files and lines of code with teammates using shareable web URLs.Branch searchSearch across all repositories, branches, forks, and even archived repositories.Diff and commit searchUse diff and commit searches to find specific changes to your codebase. Filter by author and date.Search jobsRun exhaustive searches in the background for sensitive tasks like finding tokens & secrets.Code monitoringProactively monitor changes to your codebase. Get notified via Slack, email, or webhook.Get Cody for yourselfUse Cody for free in your IDE, no credit card required.Download Cody for freeDownload Cody for freeDownload Cody for freeGet Cody for your teamCody Enterprise provides additional security, scalability, and control for your organization. Unlimited usage and context search for your entire codebase.Book a demoBook a demoBook a demoSee pricingSee pricingSee pricingAccelerating how software is builtFeaturesAI Editor AssistantCode SearchAgentsBatch ChangesResourcesDocumentationResource LibraryBlogChangelogCase StudiesCommunitySupport ForumCompanyAboutCareersContactHandbookBrand GuidePricing© 2025 Sourcegraph, Inc.System statusTerms of servicePrivacy policy'''
