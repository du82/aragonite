full_description = '''Let's build the future togetherWe're developing the world's most advanced code intelligence platform with brilliant dreamers around the globe.Explore our open rolesExplore our open rolesExplore our open roles{ "items": [], "group": "" }{ "items": [], "group": "" }{ "items": [], "group": "" }{ "items": [], "group": "" }{ "items": [], "group": "" } Happy, healthy, and always in the flow.Our teammates are our most valuable resource. That's why we provide total rewards that are highly competitive and allow you to thrive both personally and professionally.‍Learn more in our handbook.‍Work fully remoteAnywhere and at anytimeUnlimited PTO....with a 30 day minimumWellness budgetTake care of yourself on our dimeGenerous travel budgetsMeet your team across the globeFamily planning benefits$25K, because family comes firstCompetitive pay + equitySo you can live your best lifeProfessional developmentFind your thing and we pay for itOffice budgetCreate a space where you thriveMedical, dental, and visionGot you covered 100% (US only)Global talent, local gatheringsSourcegraph has embraced a remote-first culture since our earliest days, attracting some of the world's brightest minds from San Francisco to Sydney, Tokyo to Oslo, and countless cities in between. Our global team thrives on collaboration without borders powered by a “document it or it didn't happen” mentality.We also know face-to-face interactions strengthen connections, spark creativity, and solve the toughest challenges for our customers. That's why we regularly bring our global team together through many in-person gatherings, like our twice yearly all-company offsite, frequent week-long hackathons, team meetups, community events, and more.{ "items": [], "group": "" }{ "items": [], "group": "" }{ "items": [], "group": "" }A sales team retreat, a hackathon in Krakow, and the design team’s offsite at Figma Config in San Francisco.We value...Being direct & transparentWe communicate directly and operate transparently by default, which helps us move fast and make good decisions. We proactively give and receive candid feedback out of respect for each other.Winning togetherToo little collaboration causes chaos and brings disappointing results. Too much collaboration crushes ownership and dulls outcomes. We speak up when something is wrong (even when it’s hard) and help create an environment where we respectfully consider every voice.High-agencyIf everyone else at Sourcegraph were stranded on a desert island without internet access for a month, you'd be able to figure it out and keep Sourcegraph running. Everyone here has a high degree of autonomy, which requires hard work, responsibility, fast iteration, and optimism in the face of challenges.Dev loveEverything we do is ultimately for devs (anyone who codes). All Sourcegraph teammates code to better understand our users and customers and to do their job better. Our long-term mission is to make it so everyone codes, not just the 0.1% of the world’s population who are devs.Our employees say we're a Great Place to Work™Our employees have spoken! Our company culture is amazing and our Great Place to Work Certification™ proves it.Interested in working at Sourcegraph?We are actively hiring for various roles.Explore our open rolesExplore our open rolesExplore our open rolesAccelerating how software is builtFeaturesAI Editor AssistantCode SearchAgentsBatch ChangesResourcesDocumentationResource LibraryBlogChangelogCase StudiesCommunitySupport ForumCompanyAboutCareersContactHandbookBrand GuidePricing© 2025 Sourcegraph, Inc.System statusTerms of servicePrivacy policy'''
