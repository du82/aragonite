xperimental) VS Code, JetBrains IDEs, Visual Studio (Experimental), Eclipse (Experimental) VS Code, JetBrains IDEs, Visual Studio (Experimental), Eclipse (Experimental)Human languages Many human languages, dependent on the LLM used Many human languages, dependent on the LLM used Many human languages, dependent on the LLM usedCoding languages All popular coding languages All popular coding languages All popular coding languagesSupportSupport level Community support Community support Enterprise supportDedicated TA support - - Add-onPremium Support - - Add-onFrequently asked questionsGot a question you don’t see here? Contact us.What's the difference between Free, Enterprise Starter, and Enterprise plans? Free is best for individuals working on hobby projects.Enterprise Starter is for growing organizations who want Sourcegraph’s AI & search experience hosted on our cloud.Enterprise is for organizations who want AI and search across the SDLC with enterprise-level security, scalability, and flexible deployment..How are autocompletions counted for the Cody Free plan? Cody autocompletions are counted based on the number of suggestions that are served to the user in their IDE as ghost text. This includes all suggestions whether or not they are accepted by the user.How does Sourcegraph's context and personalization work? Cody can retrieve codebase context to personalize responses in a number of ways. For Free and Pro users, context is retrieved from their local repositories.The Enterprise Starter and Enterprise plans use Sourcegraph's search backend to retrieve context. This method pulls context from a team's full codebase at any scale.What forms of support are available for paid plans? Email and web portal support is available to both Enterprise Starter and Enterprise customers, and you can read more about our SLAs. Premium support with enhanced SLAs is also available as an add-on for Enterprise customers.Can I upgrade or downgrade my plan? Users can upgrade or downgrade between Free and Pro within their account settings at any time. For Pro users upgrading to Enterprise Starter is also possible, but doing so currently does not cancel your subscription and you must cancel it yourself.To upgrade to Enterprise, please contact our Sales team.What's the difference between "flexible LLM options" and "bring your own LLM key"? Flexible LLM options: Users can select from multiple options to use for chat.Bring your own LLM key: Enterprise customers can optionally provide their own LLM API key for supported LLMs (including for LLM services such as Azure OpenAI and Amazon Bedrock). In this scenario, customers pay for their own LLM consumption and we provide a pricing discount with your plan.Does Sourcegraph use my code to improve the models used by other people? For Enterprise and Enterprise Starter customers, Sourcegraph will not train on your company's data unless your instance admin enables fine-tuning, which would customize an existing model exclusively for your use. For Free and Pro users, Sourcegraph will use your data to fine-tune the model you are accessing unless you disable this feature.Can Sourcegraph be run fully self-hosted? Sourcegraph requires cloud-based services to power its AI features. For customers looking for a fully self-hosted or air-gapped solution, please Contact us.Is an annual contract required for any of the plans? Pro and Enterprise Starter plans are billed on a monthly basis and can be paid with a credit card.How are active users counted and billed? Note: this only applies to Enterprise contracts. Pro and Enterprise Starter users pay for a seat every month, regardless of usage.‍A billable user is one who is signed in to their Enterprise account and actively interacts with the product (e.g. they see suggested autocompletions, they run commands or chat with Cody, they start new discussions, clear chat history, or copy text from chats, they change settings, and more). Simply having Cody installed is not enough to be considered a billable user.‍See a more comprehensive list of user actions that are included in our docs.Is my data secure when connected to Code Search? Sourcegraph has security and reliability controls built for the most demanding enterprises. To learn more, see our Security page.What if I want AI or Code Search Enterprise only? You can purchase Enterprise plans for AI or Code Search only. Contact us to learn more.Which code hosts is the Enterprise Starter plan compatible with? The Enterprise Starter plan is currently compatible with GitHub, with a limit of indexing up to 100 repositories for search and context.What are the limits of the Enterprise Starter plan? The Enterprise Starter plan supports up to 50 developers, and alongside a limit of 100 repositories for search and context, also includes 5Gb of storage. Adding additional seats gives you 1GB of additional storage per seat, for a maximum total of 10GB.Accelerating how software is builtFeaturesAI Editor AssistantCode SearchAgentsBatch ChangesResourcesDocumentationResource LibraryBlogChangelogCase StudiesCommunitySupport ForumCompanyAboutCareersContactHandbookBrand GuidePricing© 2025 Sourcegraph, Inc.System statusTerms of servicePrivacy policy'''
