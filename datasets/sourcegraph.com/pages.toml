full_description = '''CodyThe enterprise AI code assistantSourcegraph goes beyond individual dev productivity, helping enterprises achieve consistency and quality at scale with AI.Download for freeDownload for freeDownload for freeTrusted by the world’s best software teamsAccelerate development in complex codebasesChoosing between speed, quality, or consistency? With Cody you can get all 3. Share and reuse prompts to automate tasks and promote quality and best practices for all of your devs.IDE SupportWorks with your favorite toolsUse Cody with the IDEs you use today. Get AI chat, autocomplete, and inline edit without changing your workflow.VS CodeVisual Studio(experimental)Eclipse(experimental)IntelliJPyCharmGoLandRubyMineWebstormPhpStormRiderCLionDataGripRustRoverAquaDataspellChatWhere every answer beginsDesigned to simplify and accelerate developer workflows, Cody uses a combination of search, AI chat, and prompts in a single interface to streamline how you explore, understand, and generate code.“Engineers are saving roughly 5-6 hours per week using AI code assistant tools like Cody, and writing code 2x faster than without it.”Roderick RandolphPrincipal Engineer, CoinbaseThe best contextBuilt for teams, not just individualsWhen tools focus solely on individual productivity, teams face inconsistent and poor-quality results. Sourcegraph focuses on team productivity using whole codebase context and shared prompts to ensure quality and consistency across your enterprise.Context beyond codeCody integrates with Notion, Linear, Prometheus, and other non-code tools to gather context like the rest of your human team does.The best modelsNever settle for second-best Sourcegraph gives you access to the best and latest LLMs. Choose for your use case, or optimize for speed or power.Available Models Claude 3.5 SonnetClaude 3.5 HaikuGPT-4oGemini 2.0 ProOpenAI o1-previewOpenAI o3-miniGemini 2.0 FlashSee why developers love using Sourcegraph"I'm loving Cody! Got Pro after 15 minut