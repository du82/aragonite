["https://sourcehut.org/blog/2021-09-15-whats-cooking-september-2021"]
title = "What's cooking on SourceHut? September 2021"
description = "sourcehut is a network of useful open source tools for software project maintainers and collaborators, including git repos, bug tracking, continuous integration, and mailing lists."
full_description = "Another month passes us by, recording further progress on the road to the sr.ht beta. Joining us on this journey are another 448 new souls, bringing our total number to 24,552. As always, I’m depending on you to show them kindness and patience as they learn how to use SourceHut. This month’s Mumble meeting will take place on the tomorrow, September 16th, at 10:00 UTC. We’ll be on voice.mnus.de, port 64738, in the sourcehut room. General news SourceHut put out a job posting (now closed) a few weeks ago, and we have received many excellent applications. We are planning on making an offer to one of these candidates, and the details will be announced in the next status update. We have also spoken with NLnet, who may be interested in funding some additional contributors to work on SourceHut. Exciting stuff! Also, as of this month, SourceHut is a bronze sponsor of the OpenStreetMap Foundation. We are proud to support a critical resource for free software and open data. GraphQL Following the deployment of the first implementation of GraphQL-native webhooks for meta.sr.ht, our GraphQL completion chart has a new column: meta.sr.ht ✓ read ✓ write ✓ webhooks git.sr.ht ✓ read ✓ write ✗ webhooks hg.sr.ht ✗ read ✗ write ✗ webhooks todo.sr.ht ✓ read ✗ write ✗ webhooks builds.sr.ht ✓ read ✓ write ✗ webhooks lists.sr.ht ✓ read ✓ write ✗ webhooks hub.sr.ht ✗ read ✗ write ✗ webhooks paste.sr.ht ✗ read ✗ write ✗ webhooks pages.sr.ht ✓ read ✓ write ✗ webhooks Additionally, we deployed write support for lists.sr.ht this week. You can find the updated schema here: lists.sr.ht schema.graphqls. I have written up a draft for the paste.sr.ht GraphQL API design here: paste.sr.ht schema.graphqls, which I intend to flesh out with an implemenation in the coming weeks (and also add GQL webhooks — it’s simple enough that we should be able to ship a complete GQL implementation in the first iteration). Ludovic and co. have also been hard at work on the first round of GraphQL support for hg.sr.ht, which is likely to ship in the foreseeable future. Following these, I would like to either implement a read-only hub.sr.ht GQL API, or add write support to todo.sr.ht, either of which is a considerable effort in their own right. todo.sr.ht Thanks to Ivan Habunek’s work, you can now specify the sort order of results on todo.sr.ht searches. Thanks Ivan! builds.sr.ht Image updates: Rocky Linux is now available (thanks Haowen Liu!) debian/bookworm is now available, and stretch has been removed ubuntu/xenial has been removed Tanguy Fardet also sent in their first patch this month, adding a “go to top” button on the build logs page. Thanks Tanguy!"
