["https://sourcehut.org/blog/2024-01-16-sourcehut-outage"]
title = "Information regarding the SourceHut outage"
description = "sourcehut is a network of useful open source tools for software project maintainers and collaborators, including git repos, bug tracking, continuous integration, and mailing lists."
full_description = "SourceHut is currently experiencing an extended outage due to a distributed denial-of-service (DDoS) attack. We have been hard at work restoring service to our users, and expect the remaining services to come online this week. Thank you for your patience and words of support, we appreciate it very much. Once we have finished handling the majority of the work associated with the outage mitigations, we will be publishing a full post-mortem. For up-to-date information regarding the status of the outage and work associated with it, please consult status.sr.ht. The billing system has been disabled for the duration of the outage: you will not be charged until we have fully restored service. Once restored, we will credit paid users with service for the duration of the outage. The current service status is as follows: Service Status sr.ht (project hub) Full service meta.sr.ht Full service git.sr.ht Full service1 hg.sr.ht Full service1 lists.sr.ht Full service todo.sr.ht Full service man.sr.ht Full service paste.sr.ht Full service builds.sr.ht Full service chat.sr.ht Full service pages.sr.ht Degraded performance2 1 We have restored git and hg from backups which were several hours old at the time the outage began, and manually imported changes which took place between the time of the last backup and the start of the outage. If your repository is still out-of-date, please take the following steps: If you have access to the up-to-date repository locally, please git push or hg push your changes to bring the online version up-to-date. If you do not have access to your repository locally, please contact support for assistance. 2 pages.sr.ht is online for full service, with the following caveats: Publish operations are working with degraded performance Manual intervention is required for users using custom domains with apex records (e.g. example.org rather than subdomain.example.org) For users with apex records, please update your apex record as follows: @ IN A 46.23.81.157 This IP address is available on a temporary basis. Make sure your email address on file is up-to-date; we will email you if and when it changes to notify you of the steps required to update your website."
