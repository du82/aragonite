["https://sourcetonuts.wordpress.com/2012/06/15/764"]
title = "WPF Splash Screen | Source to Nuts"
description = "Before today, somehow I never had to develop a WPF splash screen. yeah, I've inherited some and most of them were quite complex and nasty with background threads and such. So what did I do when I had to start one from scratch? Well yeah, I googled 'WPF Splash Screen' and found this MSDN link…"
full_description = '''WPF Splash Screen 15 June 2012 Before today, somehow I never had to develop a WPF splash screen. yeah, I’ve inherited some and most of them were quite complex and nasty with background threads and such. So what did I do when I had to start one from scratch? Well yeah, I googled ‘WPF Splash Screen’ and found this MSDN link near/at the top of the results. Wow, what a lot of work and code I could have saved in the past! I can’t believe how easy it is to develop a simple WPF splash screen. Just in case that link breaks, here are the simple steps: – Create or find an image that you want to use for the splash screen. You can use any image format that is supported by the Windows Imaging Component (WIC). For example, you can use the BMP, GIF, JPEG, PNG, or TIFF format. – Add the image file to the WPF Application project. – In Solution Explorer, select the image and its properties. – Select SplashScreen from the Build Action drop-down list. – Done, F5 run. Wow, that was easy! __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0f8c8135', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0f8c816f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Related Posted by sourcetonuts Filed in .net, software Leave a Comment » Leave a comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. « Facebook to buy Nokia? Where can we find incremental quality today? »'''
