description = "Your partner in development"
full_description = "Scary threat from within 2 October 2014 This government intrusion on us has to stop. Kenny Like Loading... Posted by sourcetonuts Filed in Uncategorized Leave a Comment » Creativity while sleeping 7 August 2014 I’ve always told people I do my best thinking in my sleep, sometimes toward my work as I’ve blogged. Sleeping == Create Turns out there’s a book backing this up notion called Becoming a Writer (amazon), that talks about a technique of waking yourself 30 minutes before your normal wake cycle and just write and ideas flow on those delta waves. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0e23a3ca', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0e23a460', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in Uncategorized Leave a Comment » Welcome to programming 30 April 2014 To my fellow programmers or those that wonder how our minds work. This article is brilliant. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in Uncategorized Leave a Comment » We’re going mobile 25 March 2014 Our first promo app, called MagikAteBall. The app is mostly to promote our mobile application development service. Source to Nuts is going mobile. It’s a really clean and simple app that shows a few features of mobile platforms shake gesture, location, search, phone dial, directions, paid click ads, and more. Get in touch if you have an app to develop! Download it here. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in .net, software Leave a Comment » Manufacturing Boom Next 21 December 2013 Manufacturing Boom Next The energy boom is here, now it’s time for entrepreneurs and bankers to invest in business that can utilize this business advantage. Low cost natural gas can power our roads and more. Can our business leaders see the vision? Can the politicians break down barriers to success and fuel the required infrastructure changes? Is this regional prosperity coming for all? Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion 1 Comment » Neglect 23 September 2013 I’ve been neglect at writing here. I’ve been busy with personal and family issues and moving coasts as part of that. Here’s a really good article about crazy complication or kludge for our systems. Perhaps the root cause of cost escalation in the US? Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Sad state of our affairs 9 August 2013 I haven’t been writing enough lately. I’ve been too busy planning and executing my move back west. This post makes me sad and angry and wishing I was saying more. Today, I’m only an echo. Damn the 4th amendment any how. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Need a baby name? 7 June 2013 Was just reading Seth this morning on the long tail of baby names and I had to look up my daughters Xenja and Kaia. The Feds actually track this if you need name. It’s a bigger download than I thought it would be with every name >5 occurrences in a year since somewhere in the 1800s. Xenja is graduating high school, but didn’t make the cut in any year, though there are some more normal spellings of Xenia and Xenya. Kaia is much more popular and more so than I actually thought. Sure shows how big the long tail is. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » equal not marriage 27 March 2013 Justice Scalia asks if the issue(s) before the court is about changing the definition of marriage. I think he has the right thought, but about the wrong word. For me, the real question is are we going to change the definition of equal. I’m pretty sure that there isn’t anything about marriage in the Constitution, though equality is central. How many kinds of equal do we want to have? Is marriage a special right applied to only some couples? Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Hospice 20 March 2013 My Mom passed late Monday night in hospice. Hospice was a wonderful and peaceful place in her last few days and weeks. Serendipitously, I came upon Jon Udell’s piece about this article that’s a good read on dying that perhaps something we’re missing as a society. I’ll miss my mom, but I’m so thankful for her stay at hospice and the wonderful people there. For those interested, we’ll be having a celebration of her life on April 6th at her home. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion 1 Comment » « Older Entries Newer Entries »"
