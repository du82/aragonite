full_description = "USB Serial Device on a Mac/OSX 31 May 2010 Getting serial on my Mac has been something I’ve wanted to get going for awhile, but like my blog and my time…. How to get a serial port up and running on my OSX laptop? Most USB serial devices are exactly the same or at least they are built up from FTDI or compatible chips that you can find here at ftdichip.com. In fact, that’s a great site to buy exactly what you need, though I bought my locally. Therefore drivers for pretty much any of the sources are the same or similar. I have seen bad performing devices, so perhaps there are some low-level firmware tricks, but mostly one doesn’t need to know about those hardware/firmware implementation details and just find a good and fast device. I have a device that is manufactured by Tripplite that looks and is typical to ones from other manufacturers. “PL2303 USB to Serial Driver for Mac OS X. It supports different manufacturers of PL2303 based USB to serial dongles like ATEN, IOData, Elcom, Itegno, Ma620, Ratoc, Tripp, Radioshack, Dcu10, SiteCom, Alcatel, Samsung, Siemens, Syntech, Nokia, MS3303H” So was it hard to get running on OSX? No. Knowing some tricks is helpful, or really only one trick. Connect pins 2 and 3 of the serial port device which connects the RX and TX pins (aka receive/data-in and transmit/data-out serial) to test it out. Here are the steps: Download the device installer of an OSX open source driver from sourceforge.org (http://sourceforge.net/projects/osx-pl2303/). Run it. You can ignore the network configuration depending on your intended use or at least to test your device/install. Find the device name by opening up a Terminal window and typing ‘ls /dev/tty.’ to see all of the serial ports available. Hopefully, there are many and it’s obvious which is likely. Once you have the name and pins 2 & 3 connected you can open up port with ‘screen your-device-name-here 9600’. The 9600 is for 9600 baud. Start typing in that window and you should see the characters type echo on the screen, disconnect the pins 2 & 3 and the characters will stop, since the TX pin is no longer sending them back into the RX pin. If that works, you’re up and running. If not, make sure you didn’t make any mistakes and try again. Try another USB port (your device name will likely change). One can also try the device on a Windows machine with Hyperterminal, just to make sure it works. Kenny __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f10989c9b', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, software 2 Comments » The isLate 9 January 2010 So, the iSlate! What is it other than perhaps an isLate. A big iTouch? Wow, not a big deal. An e-reader? which after CES this week will be just another yawner. A tablet computer, hmmm that’s not so new, right!? Perhaps it’s a coffee table computer, or a mini handheld desktop. What’s ‘the new’ though? Steve doesn’t do what-has-been-done. Could he be merging the iTV, iTouch and reading machine? Steve saved the music industry, hasn’t yet saved the movie industry, nor books. Everything think its a platform to save them all. Hopefully the stock will go down since my covered call’s at 190. Kenny __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f1098ab59', { sectionId: '370373', format: 'inread' }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, review Leave a Comment » Startups… 27 October 2009 I’m going to read this in more detail, but on first brush, I find it interesting. http://www.paulgraham.com/really.html Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, review, software Leave a Comment » OSX keyboard shortcut rant, alt-tab 13 January 2009 As you know I’m a keyboard shortcut guy and I try avoid the mouse at all costs. How does one alt-tab through ‘windows’ as I did on Windows? It has been frustrating me for a while. It seems that you can’t basically. You can go through windows within an application with cmd-~, you can switch between open windows but you have to use the function keys cmd-F4, and you can switch between applications with cmd-tab. But you can’t get to what alt-tab on Windows gives you. I miss that. I used it a lot and I think it is what I miss most. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx Leave a Comment » Kicking and screaming at the keyboard. 6 January 2009 I’m a keyboard guy. So, why did I get a Mac? Dunno, sometimes. I’m still having trouble with memorizing all of the shortcuts for OSX and I especially miss the right-click context menus (including its keyboard shortcut on windows) which don’t seem as popular on OSX. The only place where I like to use a mouse, or combo mouse-keyboard really, is browsing the web browsing in Firefox. On Windows, I was pretty successful using the keyboard almost exclusively and Launchy made it even easier, love Launchy. I think I read somewhere once, that Launchy was inspired by Quicksilver on the Mac, but QS never quite worked with my mind. Yes, it could be my defective version, or my lazy learning ways, or … who cares really, right? Today, I download Google Desktop for the Mac and it is already working better for me. Hit the apple-key twice and mmmmmm love it! Hopefully, GD learns from my choices like Launchy does. I even hate that silly Apple keyboard that came with the Mac. I’ve replaced that with a DAS Keyboard, which while loud is really nice to type on. The only thing, I miss from the actual Apple keyboard is the special buttons. Does any know how to map keyboard key combinations on OSX to things like: vol+, vol-, mute, etc…? Should I start about the Apple mouse and mousing-strategy or is that a religious war? Do we really need another now? Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, review Leave a Comment »"
