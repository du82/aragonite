full_description = '''Findamatic Mobile App Where do I go to lunch? Findamatic is a new cross platform mobile application that is a rework of our Magik Ate Ball and developed to run on Windows, Apple and Google devices. Finamatic solves that where is a ____ with voice entered keywords you can find any type of business with Yelp presence near by. It’s takes the choice out of the situation and picks a random pick that meets our distance and rating thresholds. It’s quick and easy powered by Yelp and provides links to call, get directions or the full review.Have fun and thanks for trying! Taking the decision out of where to eat! Currently available on: Windows Phone Apple App Store (coming soon) Android Play Store (coming soon for Glass, Wear, Phones and Tablets) It’s published and in beta on most of the platforms. If you want to try it, please contact me. Contact us to develop an app for your company or idea. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0af2fa96', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0af2faf2', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... One Response to “Findamatic Mobile App” Apple approval of Findamatic | Source to Nuts Says: 23 October 2014 at 7:18 am […] I mentioned in my previous post, we have an app Findamatic that we have developed forthe 5 of the major mobile platforms: […] Leave a comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'''
