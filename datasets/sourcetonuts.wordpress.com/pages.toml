ght on with any my friends is the social part of GR where you share or publish interesting things you find. Here is my list (call me 16867871631588463335….um how about my gmail address?), which nobody likely cares much about except me. That’s what makes it interesting because it describes the perhaps hidden me into the ‘social me.’ On the social thing-a-ma-goo. Twitters sounds interesting, but also sounds like a BIG time sink given my experience with GR. Facebook and MySpace, while my kids and some friends are into them, they don’t interest me. I don’t totally get ot social network fad yet, but I have a few business ideas about that are brewing in my head, mostly about Jabber uses. One of the concepts, though not my idea, integrating social networking concepts is the startup I’m at carefulproducts.com. CarefulProducts aims to bring social connectivity and medical compliance to senior care via in-home monitoring. I have severeal other ideas, but those are baking or waiting for someone else to do them ;>(. The only social tools I really use are linkedin.com (nice RESTful link BTW:, but I think I had to reserve it) and my sourcetonuts.com blog. Others might not consider it a social tool, but my feelings about what stackoverflow.com should be but it is, though not trying to be (just call me 3226 please….um what’s wrong with the just the kenny/username already in there?). More about this stuff later, since this is about GR. I love Google Reader and you should too! Kenny __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0efaf3b2', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0efaf3fa', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Related Posted by sourcetonuts Filed in review, software Tags: too