["https://sourcetonuts.wordpress.com/category/review"]
title = "review | Source to Nuts"
description = "Posts about review written by sourcetonuts"
full_description = "The isLate 9 January 2010 So, the iSlate! What is it other than perhaps an isLate. A big iTouch? Wow, not a big deal. An e-reader? which after CES this week will be just another yawner. A tablet computer, hmmm that’s not so new, right!? Perhaps it’s a coffee table computer, or a mini handheld desktop. What’s ‘the new’ though? Steve doesn’t do what-has-been-done. Could he be merging the iTV, iTouch and reading machine? Steve saved the music industry, hasn’t yet saved the movie industry, nor books. Everything think its a platform to save them all. Hopefully the stock will go down since my covered call’s at 190. Kenny __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f10f04002', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, review Leave a Comment » Startups… 27 October 2009 I’m going to read this in more detail, but on first brush, I find it interesting. http://www.paulgraham.com/really.html Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, review, software Leave a Comment » Oh The Tools I Use… 29 March 2009 This is my first posting from an on-going series where I’ll describe the software tools I use. The first tool I want to describe is my RSS reader. Like a lot of my tools, I read about them for awhile before I understood the benefit fully. This tool, of all my tools is the one takes a lot of time of my time, sometimes to much time. It also changed the way I use the Internet more than any other tool including search! I tried several downloaded podcast/RSS reader applications, but those never worked well for me and my mind. I don’t remember the names, so please don’t ask. I also work at multiple locations, and often with different computers, so off-line tools don’t work well for me in general. I do love working in the cloud, where Google pretty much owns me (more on that soon). I’ve been an online email only guy for 8 years starting with Yahoo Mail, which has an amazing GUI for online, but GMail’s thread discussion own me now. More on those later… Initially for RSS, I used Yahoo or specifically My Yahoo. For a while, hooking up those to RSS feeds worked OK for me. I’m not sure when Google Reader (GR) came out and not to long after I tried it, I was hooked. Like many, GR changed the way I use the web completly. I don’t web surf anymore and I pretty much only read my feeds, search/lookup something, email, some minor social networking and not much more. I don’t just click around and surf ever anymore, because so much interesting stuff comes through my feeds than I have time to read about, listen to or watch (isn’t video on the web incredible?). Most of the sites I subscribe too, I found from another site I’m already subscribed to. Over time I manage these sites and weed out the ones that are mostly echo chambers. One thing GR gives me is a way to communicate with friends and colleagues when I find something that I know would interest them, I forward it to them. Another one of my favorite parts, but hasn’t seem to caught on with any my friends is the social part of GR where you share or publish interesting things you find. Here is my list (call me 16867871631588463335….um how about my gmail address?), which nobody likely cares much about except me. That’s what makes it interesting because it describes the perhaps hidden me into the ‘social me.’ On the social thing-a-ma-goo. Twitters sounds interesting, but also sounds like a BIG time sink given my experience with GR. Facebook and MySpace, while my kids and some friends are into them, they don’t interest me. I don’t totally get ot social network fad yet, but I have a few business ideas about that are brewing in my head, mostly about Jabber uses. One of the concepts, though not my idea, integrating social networking concepts is the startup I’m at carefulproducts.com. CarefulProducts aims to bring social connectivity and medical compliance to senior care via in-home monitoring. I have severeal other ideas, but those are baking or waiting for someone else to do them ;>(. The only social tools I really use are linkedin.com (nice RESTful link BTW:, but I think I had to reserve it) and my sourcetonuts.com blog. Others might not consider it a social tool, but my feelings about what stackoverflow.com should be but it is, though not trying to be (just call me 3226 please….um what’s wrong with the just the kenny/username already in there?). More about this stuff later, since this is about GR. I love Google Reader and you should too! Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in review, software Tags: tools Leave a Comment » Maps on maps 12 January 2009 Just a quick link to what I found to be a very cool google map’s mashup of NOAA charts. Enjoy, Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in fun, review 2 Comments » Kicking and screaming at the keyboard. 6 January 2009 I’m a keyboard guy. So, why did I get a Mac? Dunno, sometimes. I’m still having trouble with memorizing all of the shortcuts for OSX and I especially miss the right-click context menus (including its keyboard shortcut on windows) which don’t seem as popular on OSX. The only place where I like to use a mouse, or combo mouse-keyboard really, is browsing the web browsing in Firefox. On Windows, I was pretty successful using the keyboard almost exclusively and Launchy made it even easier, love Launchy. I think I read somewhere once, that Launchy was inspired by Quicksilver on the Mac, but QS never quite worked with my mind. Yes, it could be my defective version, or my lazy learning ways, or … who cares really, right? Today, I download Google Desktop for the Mac and it is already working better for me. Hit the apple-key twice and mmmmmm love it! Hopefully, GD learns from my choices like Launchy does. I even hate that silly Apple keyboard that came with the Mac. I’ve replaced that with a DAS Keyboard, which while loud is really nice to type on. The only thing, I miss from the actual Apple keyboard is the special buttons. Does any know how to map keyboard key combinations on OSX to things like: vol+, vol-, mute, etc…? Should I start about the Apple mouse and mousing-strategy or is that a religious war? Do we really need another now? Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in osx, review Leave a Comment » For the Apple fan boys 6 January 2009 This is really cool, don’t you need one too? Apple Introduces Revolutionary New Laptop With No Keyboard Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in fun, review Leave a Comment » Animoto.com 3 January 2009 Trying out animoto.com… Pretty fun! Here’s a little Holiday Card e-video that Liz and I did pretty quickly. [clearspring_widget title=”Animoto.com” wid=”46928cc51133af17″ pid=”495f885843889c5d” width=”432″ height=”260″ domain=”widgets.clearspring.com”] Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in fun, review, software Leave a Comment » The phone I want… 9 December 2008 I’m looking for a new phone, again. Actually, I’ve been looking for a long time because I haven’t been happy with my choices from Verizon. It’s been 2 years since my last contract was signed, so I’m now free from their network shackles. Many, many years ago, I had a Verizon Kyocera Palm phone that I liked, but all of the new ‘smartphones’ have keypads that are for midgets. I have pretty big hands, so for me, all of them have been unacceptable or not a phone. I have to be able to open the phone and dial a phone number with only one hand without mistakes. In my opinion, that is job one for a phone. The second thing I need is to be able to have as real buttons as possible. You know what I mean, buttons that you can feel and actually press down. Thirdly, I want it have good connection/reception, long battery and/or yup just a phone. Lately, the phones I’ve been buying have barely or not lasted the length of my 2 year contract (what’s with that?). All of these phones have been just phones and light thumbing or what others call texting. I do miss reading my emails especially to remove/ignore the junk before actually sending and responding to it at my laptop or desktop. Since we’re pretty far into the future, I could see value in a new phone with: integrated GPS and mapping. going to the web would be useful and I’ve been somewhat jealous of ATT users and their iphones. I went to Verizon and tried out the new Blackberry Storm and right away, it seemed awkward and slow. Much more so than my limited use of an iphone. If it seems slow on day 0, it is really going to be frustrating. Mostly, I’ve been happy with Verizon since I usually get reception in situations where I see other phone networks fail. Perhaps the new phone will be Android. Maybe I’ll switch networks to ATT and get an IPhone. But what I really want is something like an EeePC laptop that when open, it’s a tablet/notebook on a 3G internet connection and when closed, it becomes a 3G phone. It would have Bluetooth to hookup to a headset for making and receiving calls. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion, review 2 Comments »"
