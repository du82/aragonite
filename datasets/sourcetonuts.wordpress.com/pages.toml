full_description = '''Mobile App – Findamatic 17 October 2014 We are releasing a new mobile app, Findamatic, on 5 platforms! Apple iPhones iPads Android Phones Tablets Wear (watch) Glass (Google eyeglasses) Windows Phone All of the code is written in C# and Xamarin and over 95% is common between the Phone and Tablet platforms. Google Wear and Glass are different due to the platforms being very different. This is a simple app much like but different from Magic Ate Ball we did for Android. Currently only the Windows Phone is available on the store, but the others are on the way with approvals, beta process etc.. For the 2 of you that have a Windows phone you can try the app here. Contract me if you want to beta one of them. With mobile getting the code working is only a small part of the problem. Xamarin is pretty good at cross platform, but interacting with the stores is a lot of work and takes persistence. More news soon. We hope to have other apps online shortly and we have some customer non-store apps as well. Kenny __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0ce98416', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0ce9844d', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Related Posted by sourcetonuts Filed in Uncategorized Leave a Comment » Leave a comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. « About My Daughter Apple approval of Findamatic »'''
