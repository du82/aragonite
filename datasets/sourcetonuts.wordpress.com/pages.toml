["https://sourcetonuts.wordpress.com/2012/09/05/code-or-pornography"]
title = "Code or Pornography  | Source to Nuts"
description = '''"It's probably because our profession is to work with computers is what leads us to want to program human systems the same way that we program computers - despite the fact that they are so different." via RigorousAgile. A good comment stating how hard it is to map rigid processes to writing software. Code is a battle, it's…'''
full_description = '''Code or Pornography 5 September 2012 “It’s probably because our profession is to work with computers is what leads us to want to program human systems the same way that we program computers – despite the fact that they are so different.” via RigorousAgile. A good comment stating how hard it is to map rigid processes to writing software. Code is a battle, it’s ugly, it’s shitty, it’s dirty grimy work that has to get down. The only thing you have to do today, is procrastinate. Code is a band-aid, the final thing added to the system, it has to address all of the bad design decisions, all of the bad things that happen and often take best guesses at the thoughts in the heads of millions of users. We often joke about how bad it can be, but it’s almost an impossible task to ‘do right’. Agile is an answer that is throwing up it’s hands or just saying no to rigid process development for human processes. Does agile mean anything really? It’s just saying this is closer to reality of what can be achieved by a the endeavor of software development. It may be bad, but it’s better. Either way, we only know it when we see it. Kenny __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0fb93a3d', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0fb93a7b', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Related Posted by sourcetonuts Filed in software Leave a Comment » Leave a comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. « How big is too big to fail? Can the conversation at least start? »'''
