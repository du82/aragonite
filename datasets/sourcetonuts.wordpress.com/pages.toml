description = "Your partner in development"
full_description = "Thanks Mom 16 March 2013 After seeing her last night at hospice, I came to think of what she’s given me and what I’m lucky to have. Pride My Mom was proud. She did everything she put her mind to. If someone told her that she couldn’t do something; that made her try harder, achieve and accel at it. Everything she did, she did well or as best she could. She showed us how and didn’t brag about it. Doing it, enough said. Fearless My Mom was always comfortable in her own clothes. She was the square peg that did fit into the round hole or the round hole had to change. She wasn’t afraid of being the one, the only one that did or supported something, somebody, … She broke new ground and made it seem expected, normal, right. Traditions My Mom was traditional. She taught us about heritage and the things that tied us to our past. We understood where we came from and the little things that made us a little different, those things make us each unique. Other peoples traditions, they could become ours too. Pick up the little stones in life and make them home. Helpful Being helpful to others is something my Mom did. Empathy, helping out and being there when someone, anyone needed something. Going beyond what you need today and giving time to someone else. Dropping everything that you are doing to help and assist. Other stuff can wait. Equality Treating everyone the same unconditionally. It doesn’t matter who you are, where you come from, what you have or if you have anything. There was no hierarchy for my Mom. The bottom and the top are the same and we share it all. I love you Mom and thanks! Kenny __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f162e7210', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion 1 Comment » What? No!! 13 March 2013 What am I going to do now? Official Google Reader Blog: Powering Down Google Reader. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » I do my best programming in my sleep 28 February 2013 This article is excellent advice Don’t slog away at the end of the day. What Dave discusses is what I callprogramming in my sleep. In addition to letting the problem rest for awhile, I also find that walking away from the problem or changing locations that I do my work can help too (e.g. coffee shop). Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion 1 Comment » Only 2%, wow! 15 February 2013 According to The Future of Money, only 2% of all currency transactions or exchanges are related to the exchange of goods and services. All the rest, or basically ALL transactions, are currency gambling. Now that the banks are bigger and even less able to let fail, is there a way to put a fee on these bets and not on normal trade? Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » A spending problem?!?! 13 February 2013 From the press reporting and the political banter one would think so. This link is to an interesting display of the path of government spending. All of this DC bull really misses the point. Yes, we have some important cost containment problems, but they aren’t typically what’s discussed. Changing social security spending to not go broke in the future, perhaps by means testing or raising the benefit age slightly over time Cost management of medical services that’s rising faster than inflation, perhaps by providing coverage of all basic and a limited set medical services and letting people self-fund anything beyond that out of pocket or with supplemental insurance. Downsize the scope of our military to protecting our borders and not the world as a whole. Time for the Euros and others to stand on their own lack of oil, since soon we’ll have our own in excess. I’m sure there are many other things that can be cut. For more government savings, I propose that we put a small % of any savings up to $100K into the pocket of the government employee with the idea to save money on their job. Open the savings idea box now. The only real problem is how to get the confidence back and invest in a growing economy. Now that’s a hard problem, but anyone in government needs to see that they’ve ‘created’ the angst. Get to work. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » I know it when I see it 29 January 2013 The Mull of Kintyre test of when a film is pornography. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Let the arguments begin 18 January 2013 The REAL 20 most influential beers of all time | Zythophile. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Winer with another idea on making content time proof 16 January 2013 Another thought from Dave Winer on how fragil the internet is. As a grey beard too, I don’t think the next generation cares much about this. They’ve grown up with change is ‘eh whatever move on’. History is a story as remembered, what will happen to our digital footprints? Scripting News: We should retire Aarons number. Totally tagent, but it’s sad that my government’s action scared a good guy to take his own life for a pretty minor offense all in all. Aaron was one who by 18 did more for society and freedom of information that most of us ever do. Kudos to Aaron and his legacy. The rest of us need to watch our backs and the sky for drones. Maybe a little over the top… I hope. Kenny Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Promises, promises 3 January 2013 Good riddance to the past do-nothing Congress, though I don’t have high hopes for the next one. RE: the Fiscal Crunch The Democrats promised us that there would be no deal that raised taxes on the middle class. Fail. The Republicans promised us that there would be no deal that didn’t contain spending. Fail. We the people got the worst of both worlds and the promise that they do this to us again next month. Nice. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » Fiscal Pain 1 January 2013 The Congress hasn’t voted yet, but I wonder if the party breakdown of the roll call will be as close to unanimous as the Senate with only 8 Senators voting against it with 3 of those Democrats. Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Posted by sourcetonuts Filed in opinion Leave a Comment » « Older Entries Newer Entries »"
