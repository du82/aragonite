full_description = '''equal not marriage 27 March 2013 Justice Scalia asks if the issue(s) before the court is about changing the definition of marriage. I think he has the right thought, but about the wrong word. For me, the real question is are we going to change the definition of equal. I’m pretty sure that there isn’t anything about marriage in the Constitution, though equality is central. How many kinds of equal do we want to have? Is marriage a special right applied to only some couples? __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f13e4062c', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f13e40662', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:ShareLinkedInTwitterEmailFacebookLike Loading... Related Posted by sourcetonuts Filed in opinion Leave a Comment » Leave a comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. « Hospice Need a baby name? »'''
