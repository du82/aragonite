["https://sourceware.org/news.html"]
title = "News:  After hacking late into the evening, we dish up the latest developments.  Drop by this page to find out the most recent schtuff"
description = "Sourceware free software"
full_description = '''This also frees up the other container builders to do more automated jobs like the recently added autotools generated files checker for gcc, binutils and gdb. Please contact the builder project if you want to run some automated jobs. If you also want to help Sourceware please become a Conservancy Sustainer or donate directly by mentioning Sourceware as comment or on the memo line. For now, very little. We thought about "conducting a process of re-engineering and re-branding with the aim of integrating our free software community outreach programs into our corporate objectives". But then we said "naah, let's just continue to have a great site to develop free software and work on making it even better". In particular, we plan to be careful about changing the host name sourceware.cygnus.com or anything else which may require you to update your habits, CVS/Root files, etc. The name will have to change but before we go changing things around we'd kind of like to at least have a plausible guess about what we are going to change them to :-). We don't want you to have to switch over twice. Sign up for the sourceware-announce@sourceware.org mailing list if you'd like to see occasional announcements about this site or the projects contained herein. Enter your e-mail address down below:'''
