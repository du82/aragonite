["https://sourceware.org/sourceware-25-roadmap.html"]
title = "Sourceware 25 Roadmap"
description = "Sourceware free software"
full_description = "Sourceware has been running for almost 25 years, providing a worry-free, developer friendly home for Free Software core toolchain and developer tool communities. And we would like to keep providing that for the next 25 years. That is why in the last couple of years we have started to diversify our hardware partners, setup new services using containers and isolated VMs, investigated secure supply chain issues, added redundant mirrors, created a non-profit home, collected funds, invested in open communication, open office hours and introduced community oversight by a Sourceware Project Leadership Committee with the help from the Software Freedom Conservancy. Please participate and let us know what more we (and you!) can do to make Sourceware and all hosted projects a success for the next 25 years. Almost 25 years ago, on 6 September 1998, Sourceware came online. Then called sourceware.cygnus.org. The first project being hosted was GCJ (GNU Compiler for the Java programming language). Soon followed by Cygwin and eCos. Many of the early hosted projects were part of the GNU Toolchain. Automake, autoconf, libstdc++, gsl, gdb, binutils, glibc, guile. And in October 1999 they were joined by GCC, which had been running its own server setup for the EGCS project. This is why the Sourceware project is also often referred to as the GNU Toolchain Infrastructure. But there were also lots of non-GNU projects joining in these early days. Like mauve, newlib, libffi, xconq, docbook-tools, insight and bzip2. At the start Cygnus made clear that it believed the important thing was having a diverse community participate in Sourceware (an alternative term for Free Software or Open Source) infrastructure and projects. Cygnus believes that software infrastructure should be free ... Participation of organizations and individuals around the world is critical. ... Over time, we will be hosting additional technologies and driving new initiatives. And what we call infrastructure today will continue to grow. Thanks for participating in this community."
author = "Jason Molenda, International Man Of Mystery"
