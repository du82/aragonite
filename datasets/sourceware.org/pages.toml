title = "libabigail: The ABI Generic Analysis and Instrumentation Library"
full_description = "This project aims at providing a C++ library for constructing, manipulating, serializing and de-serializing ABI-relevant artifacts. The set of artifacts that we are interested in is made of constructions like types, variables, functions and declarations of a given library or program. For a given program or library, this set of constructions is called an ABI corpus. Thus the project aims at providing a library to manipulate ABI corpora, compare them, provide detailed information about their differences and help build tools to infer interesting conclusions about these differences. To hang out with libabigail developers and users, you can chat with us via IRC at irc://irc.oftc.net#libabigail. To send us patches or just drop by to say Hi, please send an email to our mailing list at the address 'libabigail <at> sourceware <dot> org'. The archives of the mailing list can be read online. To send us an email, you first need to register to the mailing list by feeling this form. You can download compressed tarballs containing the source code of Libabigail at http://mirrors.kernel.org/sourceware/libabigail. The latest released version of is source code is http://mirrors.kernel.org/sourceware/libabigail/libabigail-2.6.tar.xz. To compile libabigail, you first need to install its dependencies. At the moment the dependencies are the following Free Software packages: Once you've downloaded the tarball, please extract its content to a directory of your choice. To extract the tarball on GNU/Linux, please type: The commands above should have built libabigail and its associated tools, and installed them under /where/you/want/to/install/libabigail. Note that built objects are under the build sub-directory of the source tree of Libabigail which you extracted from the tarball. Go to your local libabigail.git directory where the source code you've checked out lies and create a 'build' directory that will receive the binaries resulting from the compilation: Generate the relevant build-system-related information needed to configure the package for compilation, by typing:"
