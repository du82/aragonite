["https://sourceware.org/binutils"]
title = "GNU Binutils"
full_description = "Most of these programs use BFD, the Binary File Descriptor library, to do low-level manipulation. Many of them also use the opcodes library to assemble and disassemble machine instructions. The binutils have been ported to most major Unix variants as well as Wintel systems, and their main reason for existence is to give the GNU system (and GNU/Linux) the facility to compile and link programs. The latest release of GNU binutils is 2.43.1. The various NEWS files (binutils, gas, and ld) have details of what has changed in this release. See the SOFTWARE page for information on obtaining releases of GNU binutils and other GNU software. The current release can be downloaded from https://ftp.gnu.org/gnu/binutils or https://sourceware.org/pub/binutils/releases/ If you plan to do active work on GNU binutils, you can access the development source tree by anonymous git: Snapshots of the sources are taken after every commit and are made available as compressed tar files from https://snapshots.sourceware.org/binutils/trunk/. Releases are made from branches in the repository, and commits are often made to the branches even after the release has gone out. The branches are named binutils-M_NN-branch where M is the major component of the version number and NN is the minor component. So the 2.43 and 2.34.1 release for example was taken from a branch called binutils-2_43-branch. When a release is imminent a pre-release tarball is created in order to allow users a change to preview the changes before they become official. These are available from here: https://sourceware.org/pub/binutils/snapshots/. Releases and branches are tagged as well. The point where a branch was created is tagged as binutils-M_NN-branchpoint and the point where a release was created is tagged as binutils-M_NN. So for example the 2.43 release branch was split from the master branch at the binutils-2_43-branchpoint tag and the 2.43 release was made from that release at the binutils-2_43 tag. Due to an unfortunate mistake the tag for the 2.41 release was not set to the correct location. Since this mistake was only discovered after the release had gone out we decided not to move the tag, but instead create a new one. Hence for the 2.41 release only, the release tag is called binutils-2_41-official-release."
