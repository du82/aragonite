["https://sourceware.org/cygwin"]
title = "Cygwin"
full_description = '''The Cygwin DLL currently works with all recent, commercially released x86_64 versions of Windows, starting with Windows 8.1. For more information see the FAQ. Cygwin 3.4.10 was the last Cygwin version supporting Windows 7, Windows 8, Windows Server 2008 R2 and Windows Server 2012. It will stay available via the Cygwin installer for a while, but there's no guarantee that updated Cygwin packages will still run on these systems. If you need Cygwin on these or even older systems, consider using the Cygwin Time Machine. Keep in mind that individual packages in the distribution are updated separately from the DLL so the Cygwin DLL version is not useful as a general Cygwin distribution release number. For all Cygwin-related questions, observations, suggestions and bug reports, please check the resources available at this site, such as the FAQ, the User's Guide and the mailing list archives. If you've exhausted these resources then please send email to the appropriate mailing list. Please send notification of technical problems (bad html, broken links) concerning these web pages to the Cygwin mailing list. Please do not send personal email with "quick questions" to individual Cygwin contributors. The Cygwin mailing lists are the places for all questions. Really. I mean it. The Cygwin DLL and utilities are Copyright © Cygwin authors. Other packages have other copyrights. UNIX ® is a registered trademark of the Open Group in the United States and other countries.'''
