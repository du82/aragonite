["https://sourceware.org/lists.html"]
title = "Mailing lists archived on sourceware.org"
description = "Sourceware free software"
full_description = "All of the messages you send to these mailing lists will be archived. If you include sensitive information in your message it will be viewable by anyone. That includes email addresses, phone numbers, addresses, etc. Site policy is to not edit the archives except, possibly to remove viruses. This means that your information will be viewable by posterity, so be careful. So, you've discovered the fact that the mailing lists are archived, eh? That's a common internet practice. Where have you been? If you sent email to a mailing list and put your email address in clear text, it will show up in the archives that way. Ditto for your phone number, social security number, and dental records. In fact, not only will this information show up on this web site, it will be archived on other sites around the web, too. So, there's little you can do once you've sent this information out over the vast tubes of the internets. We do not normally edit the content of the archives except to remove viruses. So, if you do not want something read by vast numbers of people do not hit the send key. First of all, always use the automated unsubscription mechanism available by clicking on one of the mailing list links above referenced above for sourceware.org, gcc.gnu.org, and cygwin.com. This is the most reliable way to unsubscribe since none of us wants to do work that can be easily handled by computers. If you can't find what you want in the those lists, the List-Unsubscribe and Delivered-To fields in the header of messages provide you with the information needed for unsubscribing, e.g: Alteratively, you can send email to the list server using the address given in the mailto: above, making sure that your From matches the Delivered-To field in the header since that how the mailing list identifies you. Remember that your message is being interpreted by a computer not by a person so please use a empty content in your message to reduce the risk of your unsubscribe attempt being interpreted as spam."
