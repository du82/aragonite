title = "gprofng - BINUTILS Wiki"
full_description = "The gprofng Application Profiling Tool Work in progress Contents What is gprofng? The main features of gprofng The gprofng tools A first set of examples About the example program How to get a basic profile A first example of customization Display source code and assembly listings Scripting Support for multithreading Hardware event counters What are hardware event counters? How to select the events to be monitored How does the data collection work? Tips and tricks Build gprofng for 32 bit profiling Frequently Asked Questions (FAQ) Known Limitations 1. What is gprofng? Gprofng is a next generation application profiling tool. It supports the profiling of programs written in C, C++, Java, or Scala running on systems using processors from Intel, AMD, or Arm. The extent of the support is processor dependent, but the basic views are always available. Two distinct steps are needed to produce a profile. In the first phase, the performance data is collected. This information is stored in a directory called the experiment directory. Several tools are available to display and analyze the information stored in the directory. 2. The main features of gprofng These are some of the features: Existing executables can be profiled, even if source code is not available. Show where the time is spent at the function, source code and instruction level. The controls that define the display(s) can be specified on the command line, and/or in a file. The user can select the performance metrics to be displayed. Transparent support for multithreaded applications parallelized using Pthreads, OpenMP, or Java Threads. The results can be viewed while the profile job is still running. Multiple experiments may be loaded simultaneously. By default, the data is aggregated. Using two or more experiments, instead of aggregating the results, the data may also be compared. On selected processors, profile hardware event counters (e.g. cache misses). Filters allow the user to select one or more threads, a window in time, and/or call stacks. 3. The gprofng tools Several tools, or commands, are part of the gprofng suite. All gprofng tools start with the gprofng keyword, followed by an action, optional additional keywords and the executable command to be profiled. For example, this is how to collect performance data on an executable called a.out that takes the -p demo option: $ gprofng collect app ./a.out -p demoThis is a one line summary that describes the functionality supported: gprofng collect app collect the performance data gprofng display text display the performance results in ASCII format gprofng display html generate an html structure to be navigated in a browser gprofng display src display the source code interleaved with the instructions gprofng archive archive an experiment directory 4. A first set of examples 4.1. About the example program This program is written in C and uses Pthreads to parallelize a matrix-vector algorithm, multiplying an m x n matrix with a vector of length n. The program supports the -m and -n options to set the matrix sizes. The -t option sets the number of threads and -h prints a usage overview. The algorithm is executed repeatedly in order to increase the timings. This repeat count can be adjusted using the -r option. The -v option enables verbose mode. All options have defaults, so the program can be executed without any options. This is an example how to run the program. A 5000 x 4000 matrix is used and the thread count is set to 2. The program prints a single line with the execution status, the matrix sizes and number of threads used: $ ./mxv-pthreads -m 5000 -n 4000 -t 2 mxv: error check passed - rows = 5000 columns = 4000 threads = 2 $Clearly, everything went well and the next step is to make a profile of this job. 4.2. How to get a basic profile We now want to make a profile in order to see where the time was spent. The only thing that needs to be done in order to collect the performance information is to run the same job, but now under control of gprofng. To this end, we use the gprofng collect app command: $ gprofng collect app ./mxv-pthreads -m 5000 -n 4000 -t 2 Creating experiment directory test.1.er (Process ID: 2607338) ... mxv: error check passed - rows = 5000 columns = 4000 threads = 2The second line shown above is printed by gprofng. It tells us that an experiment directory with the name test.1.er has been created. It also shows the process id. This line is followed by the program output. The experiment directory is a regular Linux directory and contains the information that was generated while the program was running. The name test.1.er is a default name. On a subsequent profiling run, a directory called test.2.er will be created, and so on. In the second step, we can extract the information stored in the experiment directory using the gprofng display text command. If invoked without additional commands, the interpreter is launched and the user can issue commands within this interactive environment: $ gprofng display text test.1.er Warning: History and command editing is not supported on this system. (gp-display-text) quit $Although it is perfectly valid to use this feature, in practice it is probably easier to add one or more additional commands, or as we shall see later, put the commands in a script file. This is an example how to extract information from the experiment directory. The -functions command displays a table with the functions executed and the values for the metrics. By default, the total CPU time is shown: $ gprofng display text -functions test.1.er Functions sorted by metric: Exclusive Total CPU Time Excl. Total Incl. Total Name CPU CPU sec. % sec. % 5.554 100.00 5.554 100.00 <Total> 5.274 94.95 5.274 94.95 mxv_core 0.140 2.52 0.270 4.86 init_data 0.090 1.62 0.110 1.98 erand48_r 0.020 0.36 0.020 0.36 __drand48_iterate 0.020 0.36 0.130 2.34 drand48 0.010 0.18 0.010 0.18 _int_malloc 0. 0. 0.280 5.05 __libc_start_main 0. 0. 0.010 0.18 allocate_data 0. 0. 5.274 94.95 collector_root 0. 0. 5.274 94.95 driver_mxv 0. 0. 0.280 5.05 main 0. 0. 0.010 0.18 malloc 0. 0. 5.274 94.95 start_threadWe see 5 columns. In the first and second column, the exclusive total CPU time is shown, both as a number and a percentage. The next two columns contain the values for the inclusive total CPU time. The function names are in the last column. The first line in the table shows the values for <Total>. This is a pseudo function, generated by gprofng. The total value(s) for the metric(s) are shown here. The percentages are relative to this number. Note that the very first line above shows the metric used to sort the data. By default, the metric displayed in the first column is used in the sort, but this is one of things that can be modified. 4.3. A first example of customization While the example shown above works perfectly fine, some customization is desired. For example, the default name for the experiment directory is not very descriptive. There are two options to do this, but regardless of the choice, in both cases the name of an experiment directory has to end with .er. With the -o option, the name of the experiment directory can be defined, but a directory with the same name will not be overwritten. This is a safety net to prevent accidental removal of experiment data. This is different if the -O option is used: an experiment directory with the same name will be silently overwritten. A new directory with the specific name is created before the data collection starts. In our case, we prefer to use the -O option to give the experiment a more meaningful name. Before we show the results of this run, there is another thing we want to change. This is a short running job. Each call to the matrix-vector function is very short and the default sampling rate may be too coarse grained. This is why we use the -p option to change the sampling rate and we set it to high. This is the command that uses -O mxv.thr.2.er to specify the experiment directory name and increase the sampling rate through the -p high option: $ gprofng collect app -O mxv.2.thr.er -p high ./mxv-pthreads -m 5000 -n 4000 -t 2 Creating experiment directory mxv.2.thr.er (Process ID: 2607361) ... mxv: error check passed - rows = 5000 columns = 4000 threads = 2The output confirms that the experiment directory is indeed set to mxv.2.thr.er. The next step is to use the gprofng display text tool to get the profile on the screen. Also here we would like to customize the settings and use the -limit 10 command to restrict the output of the function overview to 10 lines: $ gprofng display text -limit 10 -functions mxv.2.thr.er Print limit set to 10 Functions sorted by metric: Exclusive Total CPU Time Excl. Total Incl. Total Name CPU CPU sec. % sec. % 5.775 100.00 5.775 100.00 <Total> 5.494 95.15 5.494 95.15 mxv_core 0.126 2.18 0.267 4.63 init_data 0.068 1.17 0.104 1.80 erand48_r 0.038 0.66 0.142 2.45 drand48 0.036 0.62 0.036 0.62 __drand48_iterate 0.008 0.14 0.013 0.22 _int_malloc 0.003 0.05 0.005 0.09 sysmalloc 0.002 0.03 0.002 0.03 brk 0. 0. 0.002 0.03 __default_morecoreThe output confirms that the limit has been set to 10. Note that the pseudo function <Total> counts as a function too and therefore the statistics for 9 of the functions that were executed during this run are shown. We would like to conclude this section with some additional customization. By default, the exclusive times are shown first and the name of the function is shown last. In the next example it is shown how to display the function name first, followed by the inclusive and exclusive metrics, and sorted by the exclusive total CPU time. First, we need to know the name of the metrics that are available. Some of these are actually not necessarily shown by default. The -metric_list command shows the metrics that have been recorded and are available to be displayed. The current selection and the metric used to sort the data is shown as well: $ gprofng display text -metric_list mxv.2.thr.er Current metrics: e.%totalcpu:i.%totalcpu:name Current Sort Metric: Exclusive Total CPU Time ( e.%totalcpu ) Available metrics: Exclusive Total CPU Time: e.%totalcpu Inclusive Total CPU Time: i.%totalcpu Size: size PC Address: address Name: nameTo change the default metrics, the -metrics command needs to be used. For our purpose we set it to the following: -metrics name:i.%totalcpu:e.%totalcpuWith this definition, for each function executed, the name, plus the inclusive and exclusive total CPU times, as well as the percentages, are shown. Putting this altogether, we get the following command to display a table with the metrics and order desired: $ gprofng display text -metrics name:i.%totalcpu:e.%totalcpu -limit 10 -functions mxv.2.thr.er Current metrics: name:i.%totalcpu:e.%totalcpu Current Sort Metric: Exclusive Total CPU Time ( e.%totalcpu ) Print limit set to 10 Functions sorted by metric: Exclusive Total CPU Time Name Incl. Total Excl. Total CPU CPU sec. % sec. % <Total> 5.775 100.00 5.775 100.00 mxv_core 5.494 95.15 5.494 95.15 init_data 0.267 4.63 0.126 2.18 erand48_r 0.104 1.80 0.068 1.17 drand48 0.142 2.45 0.038 0.66 __drand48_iterate 0.036 0.62 0.036 0.62 _int_malloc 0.013 0.22 0.008 0.14 sysmalloc 0.005 0.09 0.003 0.05 brk 0.002 0.03 0.002 0.03 __default_morecore 0.002 0.03 0. 0.When using the commands that control the information displayed, be aware that they are order dependent. For example, the -limit command needs to be used before the -functions command. Otherwise, the limit will not have any effect. The -sort command overrides the default metric used to sort the data. Any of the metrics recorded in the experiment can be used for this. For example, the following command sorts the function overview by name: $ gprofng display text -metrics name:i.%totalcpu:e.%totalcpu -sort name -limit 10 -functions mxv.2.thr.er Current metrics: name:i.%totalcpu:e.%totalcpu Current Sort Metric: Exclusive Total CPU Time ( e.%totalcpu ) Current Sort Metric: Name ( name ) Print limit set to 10 Functions sorted by metric: Name Name Incl. Total Excl. Total CPU CPU sec. % sec. % <Total> 5.775 100.00 5.775 100.00 __default_morecore 0.002 0.03 0. 0. __drand48_iterate 0.036 0.62 0.036 0.62 __libc_start_main 0.280 4.85 0. 0. _int_malloc 0.013 0.22 0.008 0.14 allocate_data 0.013 0.22 0. 0. brk 0.002 0.03 0.002 0.03 collector_root 5.494 95.15 0. 0. drand48 0.142 2.45 0.038 0.66 driver_mxv 5.494 95.15 0. 0. 5. Display source code and assembly listings So far we have focused on the function level overview, but gprofng can go deeper than that and show the performance information at the source and disassembly level. Source code listings are shown using the -source command. The listing is annotated with the performance metrics on a line by line basis. Below an example that shows how to get the source level information for function mxv_core. Since the source code of this function is part of a larger source file, we only show the relevant part. The full output contains the information for all source lines executed. We define the metric to be the exclusive total CPU time (more on this choice in section Known limitations). $ gprofng display text -metrics e.totalcpu -source mxv_core mxv.2.thr.er Current metrics: e.totalcpu:name Current Sort Metric: Exclusive Total CPU Time ( e.totalcpu ) Source file: /home/demo/mxv-pthreads/src/mxv.c Object file: mxv-pthreads (found as mxv.2.thr.er/archives/mxv-pthreads_OttVjvQz3cb) Load Object: mxv-pthreads (found as mxv.2.thr.er/archives/mxv-pthreads_OttVjvQz3cb) Excl. Total CPU sec. <lines omitted> <Function: mxv_core> 0. 35. void __attribute__ ((noinline)) mxv_core (int64_t row_index_start, 36. int64_t row_index_end, 37. int64_t m, int64_t n, 38. double **restrict A, 39. double *restrict b, 40. double *restrict c) 0. 41. { 0. 42. for (int64_t i=row_index_start; i<=row_index_end; i++) 43. { 0. 44. double row_sum = 0.0; ## 3.018 45. for (int64_t j=0; j<n; j++) ## 2.477 46. row_sum += A[i][j] * b[j]; 0. 47. c[i] = row_sum; 48. } 0. 49. }The output echoes the settings for the metric(s) selected and the metric used to sort the data. There is also information where the object comes from, followed by the annotated source lines. From this, it is clear that the time is spent in the for-loop spanning lines 45-46. Similar information can be obtained at the instruction/disassembly level by using the -disasm command. This displays the instructions with the source code lines interleaved. Each instruction shown here has the [<n>] marker with the source line number where the instruction originates from. If a line number is not known, a question mark (?) will be shown. This may happen in the case of (external) library function, or if the source has not been compiled with the -g} option. $ gprofng display text -metrics e.totalcpu -disasm mxv_core mxv.2.thr.er Current metrics: e.totalcpu:name Current Sort Metric: Exclusive Total CPU Time ( e.totalcpu ) Source file: /home/demo/mxv-pthreads/src/mxv.c Object file: mxv-pthre"
