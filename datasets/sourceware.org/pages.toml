["https://sourceware.org/sourceware-security-vision.html"]
title = "Sourceware infrastructure security"
description = "Sourceware free software"
full_description = "Worry-free, friendly, secure, independent infrastructure for core toolchain and developer tool communities. Projects like Cygwin, a UNIX API for Win32 systems, the GNU Toolchain, including GCC, the GNU Compiler Collection, two C libraries, glibc and newlib, binary tools, binutils and elfutils, debuggers and profilers, GDB, systemtap and valgrind. Sourceware also hosts standards groups like the gnu-gabi and the DWARF Debugging Standard committee. The 25+ hosted projects (with 350+ active developers and more than 1000 contributors) are at the heart of the Free Software supply chain, providing the core toolchain and developer tools of all GNU/Linux distributions. Free Software needs Free Infrastructure. Standard services Sourceware provides hosted projects include websites, mailing lists, git hosting, job automation, bug tracking, patch tracking, continuous integration testing, snapshots, wikis, release hosting and mirroring. Sourceware's goal is to offer a worry-free, friendly, secure, independent home for Free Software projects at community scale. The purpose of Sourceware is Free Software hosting of projects that produce, distribute, document, and improve software and/or documentation that can be freely copied, modified and redistributed and for which modified versions can also be redistributed (“Free Software”), and to facilitate and organize its production, improvement and ease of use. Sourceware provides the infrastructure for many widely used and essential software projects that are relied on by the software industry at large. The Sourceware Project Leadership Committee, eight representatives from the various hosted projects and (former) Overseers, coordinate with SFC staff, all stakeholders and the developer community to make decisions on how to allocate budget for infrastructure and services support. The daily support is in the hands of the Overseers volunteers, helped by payed staff of the organizations providing hardware resources, and various project admins, maintainers and release managers. Every month there is a public office hour for all stakeholders and every quarter Sourceware publishes infrastructure community updates."
