title = "bzip2 : Home"
description = "Official Home Page for bzip2, the high-quality, open-source data compressor. The current stable version is bzip2 1.0.8."
full_description = "bzip2 is a freely available, patent free (see below), high-quality data compressor. It typically compresses files to within 10% to 15% of the best available techniques (the PPM family of statistical compressors), whilst being around twice as fast at compression and six times faster at decompression. To subscribe to the bzip2 development list send email to bzip2-devel-subscribe@sourceware.org. You do not have to be subscribed to sent messages to the list. The code is organised as a library with a programming interface. The bzip2 program itself is a client of the library. You can use the library in your own programs, to directly read and write .bz2 files, or even just to compress data in memory using the bzip2 algorithms."
