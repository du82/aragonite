full_description = "Sourceware is run by volunteers who can be contacted on the public overseers@sourceware.org mailinglist [inbox]. There is also an irc channel #overseers on irc.libera.chat. Overseers Open Office hours take place in the same irc channel every second Friday of the month at UTC 16:00. For issues with your sourceware, cygwin, gcc, account, please contact the private mailinglist admin-requests@sourceware.org. Sourceware is a Software Freedom Conservancy member project. Conservancy is a not-for-profit organization that provides Sourceware financial and administrative assistance, handling (US) tax-deductible, earmarked donations, asset stewardship, contract negotiation and execution, basic legal advice and services, fundraising assistance, leadership mentoring, advice and guidance. Conservancy handles all non-profit administrivia for Sourceware. Sourceware interacts with Conservancy through the Sourceware Project Leadership Committee, currently composed of the following members: To support the Software Freedom Conservancy, please become a sustainer. You can also donate directly to Sourceware. The following individuals, corporations and organisations provide hardware, bandwidth and services to Sourceware:"
