title = "Suggestions!  We love 'em!  We eagerly await 'em!  Send 'em!"
description = "Sourceware free software"
full_description = "I'd have about twenty cents. Despite the delusions of grandeur that we suffer from, as well as the annoying pluralization that we use in regard to ourself, we do occasionally make mistakes. We made almost four mistakes in 1998--a really shocking number. If you think you see a mistake or even if you find yourself morally outraged by a hidden agenda that you think you perceive lurking beneath the snappy prose on this site, please let us know. Our only agenda is free software. We want you to have it. We want you to use it. We want this site to facilitate your having it and using it. We want you to roll in it, gambol in it, part your hair with it, and brush your teeth with it. So, if, for some reason, there is an impediment to your using this site, whether psychological, moral, technical, or political, please let us know."
