title = "Writers, Artists and Creatives - South Downs National Park Authority"
description = "Through song, poetry, art, novels and plays, some of the world’s most respected and well-regarded writers, storytellers and creatives have been inspired by the chalk ridges and wooded heaths of the South Downs National Park. You can follow in the footsteps of these creative pioneers and see how they were inspired by the landscape."
full_description = 'Writers, Artists and Creatives Through song, poetry, art, novels and plays, some of the world’s most respected and well-regarded writers, storytellers and creatives have been inspired by the chalk ridges and wooded heaths of the South Downs National Park. You can follow in the footsteps of these creative pioneers and see how they were inspired by the landscape. Print Writers, Artists and Creatives Home Culture & Heritage Writers, Artists and Creatives In this section ‘Shifting the Gaze’ writing bursary programme Writers and the Downs Artists and the South Downs Writers, Artists and Creatives Through song, poetry, art, novels and plays, some of the world’s most respected and well-regarded writers, storytellers and creatives have been inspired by the chalk ridges and wooded heaths of the South Downs National Park. You can follow in the footsteps of these creative pioneers and see how they were inspired by the landscape. Print "The Downs...too much for one pair of eyes, enough to float a whole population in happiness."'
