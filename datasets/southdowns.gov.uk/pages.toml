["https://www.southdowns.gov.uk/all-abilities/inclusive-equipment-for-hire"]
title = "Inclusive Equipment for Hire - South Downs National Park Authority"
description = "Inclusive equipment is available for hire at several venues across the South Downs National Park, including a fleet of electric mobility scooters. This equipment has been made available thanks to Defra’s Access for All fund. East Sussex Seven Sisters Country Park Seven Sisters Visitor Centre The Seven Sisters Country Park Visitor Centre offers the free […]"
full_description = "Inclusive Equipment for Hire Inclusive equipment is available for hire at several venues across the South Downs National Park, including a fleet of electric mobility scooters. This equipment has been made available thanks to Defra’s Access for All fund. East Sussex Seven Sisters Country Park Seven Sisters Visitor Centre The Seven Sisters Country Park Visitor Centre offers the free use of two mobility scooters to enable more people to explore and enjoy Seven Sisters Country Park. You can book for yourself or for another person to use. Please either pop in or call the Visitor Centre on 01730 819341 between 10am and 4pm. You can also email us: sevensisters@southdowns.gov.uk Your booking entitles you to a two hour session, but you can return the scooter before then. Choose between either 10am-12pm and 1pm – 3pm (subject to availability). Find out more about the scooters. Cuckmere Cycle Company Cuckmere Cycle Co., located near the Seven Sisters Visitor Centre, will soon be offering hire of several bikes for those with additional mobility needs, as well as their existing e-bikes. Check with Cuckmere Cycle Co. on what bikes are available for hire. Buzz Active Buzz Active Cuckmere team deliver kayak, open canoe, paddleboard, improvised rafting, Katakanu and XL SUP activities. From Spring 2023, paddleboard equipment and guided sessions will be available to help people with additional needs get out on the water. Check with Buzz Active on equipment available and sessions. Hampshire Hogmoor Inclosure, Bordon Our heathlands are home to a rich array of wildlife, including sand lizards and several groundnesting birds. Managed by the Deadwater Valley Trust, a mobility scooter will be available to hire for those wishing to explore the site. Go to Deadwater Valley Trust’s website to find out more. Queen Elizabeth Country Park Mobility scooters are available to hire at Queen Elizabeth Country Park in Hampshire. Contact Queen Elizabeth Country Park visitor centre to book on 02392 595040 or email qecp.enquiries@hants.gov.uk West Sussex Cadence Cycle Cafe, Cocking Based at an old dairy farm right next to the South Downs Way, Cadence in Cocking will be offering a scooter for hire to allow people with additional mobility needs to explore the South Downs Way. Find out more on how to hire on the Cadence website. RSPB Pulborough Brooks Scooter hire is available at RSPB Pulborough Brooks, a stunning wetland and heathland habitat and, one of the best places for bird watching in the South Downs. Go to the RSPB Pulborough Brooks website to find out more on how to hire the equipment. Print"
year_published = 2025
year_updated = 2023
