["https://www.southdowns.gov.uk/getting-here/public-transport"]
title = "Public Transport - South Downs National Park Authority"
description = "Because of the National Park’s close proximity to London and a number of major urban centres including Brighton and Portsmouth, public transport is the ideal way to travel around the National Park.  You can use the Traveline journey planner to find the best way to get to the National Park from your door. Train Train […]"
full_description = "Public Transport Because of the National Park’s close proximity to London and a number of major urban centres including Brighton and Portsmouth, public transport is the ideal way to travel around the National Park. You can use the Traveline journey planner to find the best way to get to the National Park from your door. Train Train is the easiest, quickest way to get to the South Downs National Park. With regular trains departing from London Waterloo and London Victoria, it takes 60 – 90 minutes to get into the National Park. Check National Rail for times, fares and locations. Alternatively, you can use Trainline to book fares for rail and coach. By bus There’s also a good network of bus routes which links stations, villages and local visitor attractions. You can buy a Discovery ticket for individuals or for families, and have unlimited travel for the day across the South Downs National Park. Brighton and Hove Buses also run a ‘Breeze’ service from the city centre to parts of the National Park. You can find the latest timetable here. Print"
