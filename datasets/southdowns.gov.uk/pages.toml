he South Downs National Park: a landscape brimming with romance From Jane Austen to Tennyson, the beauty of the South Downs has never failed to inspire tales of romance and passion. The golden chalk hills, immense views and twinkly star-studded... The fascinating story of flint in the South Downs The story of South Downs flint and its pivotal role in human civilisation has been uncovered in a fascinating new book. Diana Jones penned “Flint Story” after carrying out an... "The Downs...too much for one pair of eyes, enough to float a whole population in happiness."'''
