description = "25% of the South Downs is managed for nature - we want to increase this to 33% by 2030. Play your part to help nature #ReNature."
full_description = '''Have your say on the Local Plan Review! Consultation ends on Monday 17 March Find out more! discover the park Writers, Artists and Creatives Find out more South Downs Way Find out more Get to know the amazing history, species and communities of the South Downs Why do we need to ReNature the South Downs? Find out more Beginner’s guide to stargazing Find out more Supporting Biodiversity Find out more History of the South Downs Find out more Key Facts Find out more Get Active Find out more things to do Vineyards, Breweries and Distilleries Find out more Rare and unexpected species Find out more Family Activities Find out more Whether it's running, cycling or trying something new, there's something for everyone Miles Without Stiles Find out more Delicious Days Out Find out more Relax in Nature Find out more caring for the park Partnership Management Plan Find out more Nature Recovery: information for delivery partners Find out more Find out about the work we do to conserve and enhance the South Downs What does ReNaturing in the South Downs look like? Find out more South Downs Youth Action Find out more South Downs Learning Resources Find out more Buy ReNature Credits Find out more Latest news Email Newsletter Subscribe Time running out to have your say on National Park’s Local Plan Review People are being urged to have their say as the clock counts down to the deadline for a major public consultation on the future of the National Park. The Local... Somewhere over the rainbow lies the South Downs… A dreamy image of golden fields at the end of a rainbow has won one storm-chasing photographer the “People’s Choice” crown in the National Park’s photo competition. Almost 800 people... Breathtaking photos capture beauty of South Downs National Park’s Dark Skies A dazzling display of the Milky Way at Cuckmere Haven and a hauntingly beautiful shot of the legendary Chanctonbury Ring are among the winners of this year’s astrophotography competition. This... The South Downs National Park: a landscape brimming with romance From Jane Austen to Tennyson, the beauty of the South Downs has never failed to inspire tales of romance and passion. The golden chalk hills, immense views and twinkly star-studded... The fascinating story of flint in the South Downs The story of South Downs flint and its pivotal role in human civilisation has been uncovered in a fascinating new book. Diana Jones penned “Flint Story” after carrying out an... "The Downs...too much for one pair of eyes, enough to float a whole population in happiness."'''
