description = "Situated in a busy part of the United Kingdom, driving through parts of the South Downs can become congested, especially at busy times. It’s for this reason we encourage visitors to use public transport where possible.  The South Downs National Park has seen an increasing number of electric vehicle charging points installed in car parks […]"
