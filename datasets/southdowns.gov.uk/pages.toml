["https://www.southdowns.gov.uk/event/pride-party-at-langham-brewery"]
title = "Pride Party At Langham Brewery - South Downs National Park Authority"
description = "Everyone is welcome to Langham Brewery’s 2023 Pride Party on Saturday 8th July (from midday until 10pm) in the heart of the South Downs. The family and dog-friendly daytime part of the event (midday until 5.30 pm) is free to enjoy, with live music (Martin Gray, Rylee Spooner and Yesterday’s Pants), games, stalls and more. […]"
full_description = "Pride Party At Langham Brewery 08 July 2023 12.00 to 22.00 Everyone is welcome to Langham Brewery’s 2023 Pride Party on Saturday 8th July (from midday until 10pm) in the heart of the South Downs. The family and dog-friendly daytime part of the event (midday until 5.30 pm) is free to enjoy, with live music (Martin Gray, Rylee Spooner and Yesterday’s Pants), games, stalls and more. From 5.30pm until 10pm expect a cabaret style show with charismatic, elegant headliners Stella Adore (Barbie in Bollywood set) and Molly Mayhem, plus karaoke, music and dancing. Tickets are now on sale for the evening show, with 10% of ticket sales donated to the Switchboard charity helpline. Lesley Foulkes, co-owner of the brewery, says, “Since the brewery’s inception we’ve loved being involved with our local community. There’s a warm welcome at the brewery for everyone. Last summer was our first ever Pride Party and it was so much fun that we very quickly decided that we’d hold one again this year. Do join us for family fun during the day, and a cabaret show in the evening (over 18’s only).” Delicious Turkish/Lebanese street food will be provided from midday by the fabulous Cara Gorda Cantina and Dylan’s Ice Creams. Find out more and purchase cabaret tickets: https://bit.ly/LanghamPride2023 and please do visit us at the brewery. Wheelchair access and facilities available. Discover more about Langham Brewery: https://bit.ly/DestinationLangham"
