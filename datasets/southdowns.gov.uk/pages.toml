["https://www.southdowns.gov.uk/dark-night-skies/where-to-stargaze"]
title = "Where to stargaze? - South Downs National Park Authority"
description = "In May 2016 the South Downs National Park became the world’s 13th International Dark Sky Reserve (IDSR).  We think our star-studded skies overhead are as valuable as our beautiful rolling landscapes and, with properly dark skies in the South East of England under threat, this is a statement that the skies of the South Downs […]"
full_description = "Where to stargaze? Home Dark Night Skies Where to stargaze? In this section Winchester Science Centre & Planetarium Dark Sky Discovery Site Old Winchester Hill Dark Sky Discovery Site Butser Hill Dark Sky Discovery Site Buriton Dark Sky Discovery Site Harting Down Dark Sky Discovery Site Iping Common Dark Sky Discovery Site Bignor Hill Dark Sky Discovery Site Devil’s Dyke Dark Sky Discovery Site Ditchling Beacon Dark Sky Discovery Site Birling Gap Dark Sky Discovery Site In May 2016 the South Downs National Park became the world’s 13th International Dark Sky Reserve (IDSR). We think our star-studded skies overhead are as valuable as our beautiful rolling landscapes and, with properly dark skies in the South East of England under threat, this is a statement that the skies of the South Downs are worth protecting. We celebrate this designation every year at our Dark Skies Festival with two weeks of cosmic fun including star parties, talks and family activities. Use the map below to find your nearest dark skies. Winchester Science Centre & Planetarium Dark Sky Discovery Site Address: Winchester Science Centre and Planetarium Car Park, Telegraph Way, Winchester, Hampshire, SO21 1HZ Parking: Pay by using the Pay & display machine. All day ticket costs £2.00. Visit the... Find out more Old Winchester Hill Dark Sky Discovery Site Address: Natural England Car Park, Old Winchester Hill, Near Corhampton, Hampshire, SO32 3LF Parking: Natural England ask that you make a donation for parking using the RingGo app. Suggested donation... Find out more Butser Hill Dark Sky Discovery Site Address: Hampshire County Council Car Park off Limekiln Lane, Petersfield, East Hampshire, GU31 5SP Parking: The above postcode takes you to the car park at the top of Butser Hill,... Find out more Buriton Dark Sky Discovery Site Address: Village Hall Car Park, High Street, Buriton, GU31 5RX Parking: Parking by the village hall is free although it can be difficult to navigate the narrow lane in the... Find out more Harting Down Dark Sky Discovery Site Address: National Trust Car Park, Harting Down, South Harting, GU31 5PN Parking: Parking charges apply. National Trust members can park for free. All day parking £2.00. Pay by using the... Find out more Iping Common Dark Sky Discovery Site Address: Iping Common Car Park, Elsted Road, Midhurst, GU29 0PB Parking: Sussex Wildlife Trust Car park is accessible to the public free of charge. Visit the Sussex Wildlife website for... Find out more Bignor Hill Dark Sky Discovery Site Address: Slindon Estate, National Trust Car Park, Bignor Hill, Pulborough, RH20 1PH Lee Farm Road, Sutton, Pulborough, RH20 1PH Parking: Car park accessible to the public free of charge. Visit... Find out more Devil's Dyke Dark Sky Discovery Site Address: Devil’s Dyke Road, Brighton, BN1 8YJ Parking: Parking charges apply. National Trust members can park for free. All day parking £6.00. Pay by using the Pay & display machine.... Find out more Ditchling Beacon Dark Sky Discovery Site Address: Ditchling Beacon National Trust Car Park, Brighton, BN1 9QD Parking: Parking charges apply. National Trust members can park for free. All day parking £3.00. Pay by using the Pay... Find out more Birling Gap Dark Sky Discovery Site Address: Beachy Head Road, Eastbourne, East Sussex, BN20 0AB Parking: Parking charges apply. National Trust members can park for free. All day parking £5.00. Pay by using the Pay &... Find out more"
