["https://www.southdowns.gov.uk/all-abilities/dog-friendly-south-downs"]
title = "Dog Friendly South Downs - South Downs National Park Authority"
description = "Lots of you visit the South Downs National Park because it is a great place to walk your dog.  There’s lots for them to explore including heathlands, forests, farmland and historical sites, as well as a number of dog-friendly pubs. Use ‘Dog Friendly’ to find dog-friendly pubs and cafes in the South Downs. Responsible dog […]"
full_description = "Dog Friendly South Downs Lots of you visit the South Downs National Park because it is a great place to walk your dog. There’s lots for them to explore including heathlands, forests, farmland and historical sites, as well as a number of dog-friendly pubs. Use ‘Dog Friendly’ to find dog-friendly pubs and cafes in the South Downs. Responsible dog walkers are very welcome in the South Downs National Park. Taking responsibility for your dog is especially important in spring when young livestock are particularly vulnerable. The South Downs is also home to many ground-nesting birds, and any disturbance can stop a successful brood. If you see signs asking you to keep your dog on the lead, please do so. Four steps to being a good pooch Keep dogs on a lead near livestock Bag and bin your poo, any public bin will do Protect ground nesting birds. Stick to the paths, especially between 1 March – 15 September Do not enter military training areas when the red flags are flying Print"
