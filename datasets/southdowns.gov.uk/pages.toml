["https://www.southdowns.gov.uk/community-infrastructure-levy/guidance-forms"]
title = "CIL & S106 Forms, Guidance & Exemptions - South Downs National Park Authority"
description = "If you have applied for planning permission or prior approval, the following will take you through the steps you need to take to ensure you comply with the CIL requirements.  All CIL form templates can be found on the Planning Portal website. Please contact us at cil@southdowns.gov.uk or 01730 814810 for all CIL related enquiries. […]"
full_description = "CIL & S106 Forms, Guidance & Exemptions If you have applied for planning permission or prior approval, the following will take you through the steps you need to take to ensure you comply with the CIL requirements. All CIL form templates can be found on the Planning Portal website. Please contact us at cil@southdowns.gov.uk or 01730 814810 for all CIL related enquiries. Stage 1: Submitting your application All applications for full planning permission, including householder applications, reserved matters applications and applications for lawful development certificates are required to complete and submit the Form 1 – CIL Additional Information Requirements and Form 2: Assumption of Liability Notice. You must also ensure you include existing and proposed floor plans; without these documents your application will be invalid. If you do not need to submit a planning application for your development, such as for permitted development and prior approval, but the development is still liable to CIL, then before you start work you must complete Form 5: Notice of Chargeable Development. Stage 2: Determining your application If your development is CIL liable then once planning permission has been granted the SDNPA will issue the landowner(s), or the person who has assumed Liability, with a Liability Notice stating the chargeable amount. If planning permission is granted after an appeal, the Liability Notice will be issued as soon as possible after the appeal decision. To understand whether your development may be CIL liable please see our CIL & S106 Rates page. Stage 3: Assuming Liability (confirming who will be paying the levy) Prior to starting work you must make sure you have completed Form 2: Assumption of Liability. Once we have received a completed Form 2, a Liability Notice will be issued to you. It is your responsibility to ensure all details are correct. If the liability for paying CIL changes after the Assumption of Liability Notice has been submitted, you should complete either Form 3: Withdrawal of Assumption of Liability or Form 4: Transfer of Assumed Liability. This should be submitted before the final payment of CIL is due. The development may also be eligible for exemption from the CIL Charge. Exemptions can be claimed at any point between submission of the application and commencement of development, but you cannot claim for relief after commencement of works. Please see our CIL Relief and Exemptions page for more details. Stage 4: Commencing Work BEFORE YOU START WORK YOU MUST COMPLETE AND SUBMIT Form 6: Commencement Notice This is required for all CIL liable development, even if relief has been granted. Failure to submit a Commencement Notice at least 1 clear working day prior to starting work, will: – Forfeit the right to pay CIL in instalments (where applicable) – Result in a significant penalty surcharge. The SDNPA has no discretionary powers over this requirement. Work cannot commence until the SDNPA has received and acknowledged receipt of the Commencement Notice. Stage 5: Paying CIL Once the commencement date has been reached, the SDNPA will issue a Demand Notice to the person that has assumed liability to pay CIL. It will set out the amount due and the date when the CIL needs to be paid. If no one has assumed liability to pay CIL before the Demand Notice is issued, the liability will default to the landowner(s). The CIL payments, surcharges & appeals page provides details on how to make payment. Print"
year_published = 2025
year_updated = 2024
