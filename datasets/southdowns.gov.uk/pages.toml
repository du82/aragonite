["https://www.southdowns.gov.uk/all-abilities/miles-without-stiles"]
title = "Miles Without Stiles - South Downs National Park Authority"
description = "Miles Without Stiles are routes that are suitable for people with limited mobility. Wheelchair users, families with pushchairs, dog walkers and less agile walkers can choose from a list of routes from across the South Downs. Gatwick Airport is helping the South Downs National Park to create a number of new routes across the South […]"
full_description = "Miles Without Stiles Miles Without Stiles are routes that are suitable for people with limited mobility. Wheelchair users, families with pushchairs, dog walkers and less agile walkers can choose from a list of routes from across the South Downs. Gatwick Airport is helping the South Downs National Park to create a number of new routes across the South Downs. The work includes removal of stiles, replacing gates and resurfacing rough tracks. With six routes currently available and further routes becoming available in the near future, our plans are underway to make the South Downs the UK’s most accessible National Park. Guides can be downloaded below and include information on accessibility of the route, ramps and gradient, public transport, refreshments and toilets. Have you got a suggestion for a potential South Downs Miles without Stiles route? Please get in touch – info@southdowns.gov.uk Download Guided Walks Download and print the written guides below. Some of our Miles Without Stiles routes have been filmed to give users a flavour of the terrain before visiting. With thanks to our friends at the Disabled Ramblers and Hampshire Roamability for their help in the filming. Bramber Routes Ditchling Beacon and the Chattri Iping and Stedham Commons Seaford Head routes Seven Sisters routes Mill Hill route West Walk, Forest of Bere Print"
year_published = 2025
year_updated = 2024
clearnet = "https://www.southdowns.gov.uk/all-abilities/miles-without-stiles"
