["https://www.southdowns.gov.uk/community-infrastructure-levy/cil-and-s106-rates"]
title = "CIL and S106 Rates - South Downs National Park Authority"
description = "CIL Rates The South Downs National Park Authority (SDNPA) has set out its levy rates in the SDNPA Charging Schedule (as per the Adoption Notice).  Levy rates are expressed as £ per square metre. Within the South Down National Park, residential developments, (which includes extensions, annexes and holiday lets as well as new build dwellings), […]"
full_description = "CIL and S106 Rates CIL Rates The South Downs National Park Authority (SDNPA) has set out its levy rates in the SDNPA Charging Schedule (as per the Adoption Notice). Levy rates are expressed as £ per square metre. Within the South Down National Park, residential developments, (which includes extensions, annexes and holiday lets as well as new build dwellings), are charged £150 – £200 per square metre, plus indexation. Large format retail developments are charged £120 per square metre, plus indexation. The charging rate for all other types of development is set at £0 (zero) per square metre. For residential developments there are two rates, split by two geographical zones. Zone 1 (£150 per m²) covers Lewes, Liss, Midhurst, Petersfield and Petworth, Zone 2 (£200 per m²) covers all other areas of the park. To check which residential charging zone your development falls within please use the map below. CIL Liability is calculated on a per metre squared basis, using Gross Internal Area (GIA) which is defined as the area of a building measured to the internal face of the perimeter walls at each floor level. All GIA measurements are calculated using the RICS 6th Edition Code of Measuring Practice core definitions of Gross Internal Area and excludes any specialist definitions. There may be circumstances where the SDNPA and the person liable for the levy will wish for land and/or infrastructure to be provided instead of money, to satisfy a charge arising from the levy. The CIL Infrastructure in Kind Policy sets out how this is calculated and operates. Indexation The charging rates set out in the charging schedule are subject to annual indexation. Please see below for a summary of the charging schedule rates. *all rates are rounded to the nearest penny Date planning permission is granted Indexation Figures (Index Figure for the year the charging schedule took effect / Relevant year Index Figure) Residential Zone 2 charging rate with indexation* Residential Zone 1 charging rate with indexation* Large Format Retail charging rate with indexation* 1st April 2017 – 31st March 2018 287 / 287 £200.00/m² £150.00 m² £120.00/m² 1st April 2018 – 31st March 2019 287 / 302 £210.46/m² £157.84/m² £126.28 m² 1st April 2019 – 31st December 2019 287 / 315 £219.53/m² £164.64/m² £131.71/m² 1st January 2020 – 31st December 2020 287 / 334 £232.76/m² £174.57/m² £139.65/m² 1st January 2021 – 31st December 2021 287 / 333 £232.06/m² £174.04/m² £139.23/m² 1st January 2022 – 31st December 2022 287 / 332 £231.36/m² £173.52/m² £138.82/m² 1st January 2023 – 31st December 2023 287 / 355 £247.39/m² £185.54/m² £148.43/m² 1st January 2024 – 31st December 2024 287 / 381 £265.51/m² £199.13/m² £159.30/m² 1st January 2025 – 31st December 2025 287 / 391 £272.47/m² £204.36/m² £163.48/m² CIL Residential Charging Zones Section 106 Rates For all monitoring information regarding rates for S106, please see Solent Mitigation. For any further queries relating to the CIL and Section 106, please contact us at cil@southdowns.gov.uk or 01730 814810 Print"
