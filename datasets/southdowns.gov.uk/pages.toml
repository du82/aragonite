title = "Climate Action Hub - South Downs National Park Authority"
description = "The South Downs National Park has it all – rolling hills, glorious…"
full_description = "Climate Action Hub Welcome to the South Downs Climate Action Hub. Climate Change is having a fundamental effect on biodiversity, agriculture, water resources and communities in the South Downs National Park. But we can make a difference! Working together as individuals, businesses, communities, land managers and local authorities we can have a positive impact on climate change. Together we can and must act faster and be more ambitious! In this hub you can find out what the South Downs National Park Authority is doing to reach net zero and find links to resources and guides on how you can join us in taking action on climate change. If you’re looking to connect with local groups and climate action champions, request to join the South Downs National Park’s Climate Action Knowledge Hub. Before joining you will need to sign-up for a free Knowledge Hub account – it’s quick and easy. Community Climate Action Across the South Downs, communities are taking action to combat climate change. Find your community group Find out more Ouse Valley Climate Action (OVCA) Find out more Greening Steyning Find out more Petersfield Climate Action Network (PeCAN) Find out more Ouse Valley Energy Services Company (Ovesco) Find out more Community Energy South Find out more Winchester Action on the Climate Crisis (WinACC) Find out more Lewes Climate Hub Find out more Energise South Downs Find out more Eastbourne Eco-Action Network Find out more Buriton Thermal Camera Find out more View More View Less Reaching Net Zero The South Downs National Park Authority (SDNPA) is committed to addressing the climate and nature emergencies by reaching ‘Net Zero’. Find out how we’re doing this for both the Authority and the National Park. Join the Knowledge Hub Find out more Pledge to take action to help nature and the climate Find out more What do we mean by Net Zero and Nature-Based Solutions? Find out more Achieving Net Zero for the South Downs National Park Authority Find out more Achieving Net Zero for the South Downs National Park Find out more South Downs Climate Change Action Plan Find out more View More View Less Guides and Resources Use these guides and resources to take your own action on climate change and to help us reach Net Zero. Reducing heat use in your home Find out more Renewable energy in the South Downs Find out more Community Energy and Tackling Climate Change Find out more Natural Flood Management Measures Find out more View More View Less Get the latest news from South Downs Newsletter Signup Latest News Ouse Valley wins £2m funding for climate action Find out more “National Parks need the resources to match our ambitions” – says South Downs Chief Executive Find out more Biggest green roof in National Park brings boost for biodiversity Find out more Call for Sites launched by South Downs National Park Authority Find out more A welcome boost for nature as thousands of trees to be planted across South Downs Find out more Ambitious vision for future is unveiled by South Downs National Park Find out more View More View Less Get the latest news from South Downs Newsletter Signup"
