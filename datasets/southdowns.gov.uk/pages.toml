["https://www.southdowns.gov.uk/cookies"]
title = "Cookies - South Downs National Park Authority"
description = "What is a cookie? Cookies are small files of letters and numbers that are downloaded onto your computer or mobile or other handheld device when you access certain websites. Cookies allow a website to recognise a user’s device and help your browser navigate through the website by allowing you to log in automatically or remembering […]"
full_description = "Cookies Policy What is a cookie? Cookies are small files of letters and numbers that are downloaded onto your computer or mobile or other handheld device when you access certain websites. Cookies allow a website to recognise a user’s device and help your browser navigate through the website by allowing you to log in automatically or remembering settings you selected during earlier visits (among other functions). Cookies do not harm your computer. If you would like to learn more about cookies in general you can visit www.allaboutcookies.org. Use of cookies on this website Cookies help us to provide you with a good experience when you browse this website and allow you to make full use of the online shopping and personalised features available on this website. We do not use cookies to collect or record information such as your name, address or payment details. We use cookies on this website for the following main purposes: for technical purposes essential for the operation of this website, such as keeping track of your current shopping session and enabling you to proceed to checkout and pay for products; to distinguish you from other users of this website, so we can personalise your shopping experience by making this website and the advertising displayed on it more relevant to your interests and so we can remember choices you make (such as your user name, language or the country you are in) when you return to visit this website; to collect statistical information about how visitors use this website, so we can improve the way this website works and measure the success of competitions and campaigns; and to enable us to fulfil our contractual obligations to third parties, for example to pay a partner if you have made a purchase on this website by following a link from their website. Most web browsers automatically accept cookies. Unless you have adjusted your browser settings so that it will refuse cookies, cookies will be set when you access this website. By using and browsing this website, you consent to cookies being used in accordance with this Cookie Policy. If you do not consent, you must either disable cookies or refrain from using this website."
year_published = 2025
year_updated = 2020
