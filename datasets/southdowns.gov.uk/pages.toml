title = "Explore Heritage and Culture - South Downs National Park Authority"
description = "The people who have worked and lived on the South Downs have left us a rich variety of clues to explore. Early flint mines that produced tools traded throughout southern England, iron furnaces that made cannons for the 17th century navy and historic towns and villages are just a few of the discoveries waiting for you. […]"
full_description = 'Explore Heritage and Culture The people who have worked and lived on the South Downs have left us a rich variety of clues to explore. Early flint mines that produced tools traded throughout southern England, iron furnaces that made cannons for the 17th century navy and historic towns and villages are just a few of the discoveries waiting for you. The stories of this place and its people are waiting to be discovered and enjoyed. Print Explore Heritage and Culture Home Explore Heritage and Culture In this section Attractions Archaeological Sites Our Historic Places Explore Heritage and Culture The people who have worked and lived on the South Downs have left us a rich variety of clues to explore. Early flint mines that produced tools traded throughout southern England, iron furnaces that made cannons for the 17th century navy and historic towns and villages are just a few of the discoveries waiting for you. The stories of this place and its people are waiting to be discovered and enjoyed. Print "The Downs...too much for one pair of eyes, enough to float a whole population in happiness."'
