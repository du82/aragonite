["https://www.southdowns.gov.uk/community-infrastructure-levy/payments-surcharges-appeals"]
title = "CIL payments, surcharges and appeals - South Downs National Park Authority"
description = "CIL becomes due from the date of commencement of development. Under normal circumstances the liability must be paid within 60 days of the commencement of development. Where a CIL liability is over £50,000 the liable party may pay in accordance with our Instalments Policy. If you have a CIL liability, it is your responsibility to ensure […]"
full_description = "CIL payments, surcharges and appeals CIL becomes due from the date of commencement of development. Under normal circumstances the liability must be paid within 60 days of the commencement of development. Where a CIL liability is over £50,000 the liable party may pay in accordance with our Instalments Policy. If you have a CIL liability, it is your responsibility to ensure that your payment is received by the SDNPA and formally acknowledged. Failure to pay on time, or to properly reference your payment may result in penalties and surcharges if your payment cannot be identified. Payment by BACS transfer Account name: South Downs National Park Authority Sort code: 30-80-12 Account: 11191960 Please ensure that you include your CIL payment reference when paying, which can be found on your Demand Notice. Paying online Pay by card through the online portal hosted by our finance partners, Brighton and Hove City Council Please ensure that you include your CIL payment reference when paying, which can be found on your Demand Notice. Surcharges There are a number of surcharges that can be applied to your CIL liability. Failing to submit a valid Commencement Notice, paying late, or failing to assume liability for a development can all incur surcharges. Please ensure you read all letters and notices sent to you for further information. Appeals Appeals can be lodged against some aspects of a levy charge. A full range of appeals and their requirements for submission can be found in the Appeal Help Sheet. Further information on appeals can also be found on the Government website. If you think the SDNPA have made a mistake in calculating your liability, you can appeal the decision. Firstly, a relevant person must request a review of the chargeable amount to the charging authority (SDNPA) within 28 days, starting from the date the Liability Notice was issued. The SDNPA is required to review the calculation and a decision must be issued within 14 days. Only after a review has been completed can the relevant party submit an appeal to the Valuation Office Agency. Appeals related to surcharges, commencement and stop notices should be submitted to the Planning Inspectorate. If a person intends to request a review of a liability notice or lodge an appeal they must do this before development begins. Appeal decision notices issued by the Valuation Office Agency are published in redacted form on the agency’s website. Appeal decision notices issued by the Planning Inspectorate will be published in redacted form on the Planning Inspectorate website. Further enquiries For any further information about payment, appeals or surcharges please email cil@southdowns.gov.uk Print"
year_published = 2025
year_updated = 2024
clearnet = "https://www.southdowns.gov.uk/community-infrastructure-levy/payments-surcharges-appeals"
