["https://www.southdowns.gov.uk/affordable-housing-in-the-south-downs-national-park/affordable-housing-spd"]
title = "Adopted Affordable Housing SPD - South Downs National Park Authority"
description = "South Downs National Park Authority has adopted an Affordable Housing Supplementary Planning Document (SPD). The SPD provides further guidance to support the implementation of South Downs Local Plan policies, in particular Policy SD28: Affordable Homes and Policy SD29: Rural Exception Sites.  The SPD covers a number of detailed matters including: local connections; financial contributions in lieu of […]"
full_description = "Adopted Affordable Housing SPD South Downs National Park Authority has adopted an Affordable Housing Supplementary Planning Document (SPD). The SPD provides further guidance to support the implementation of South Downs Local Plan policies, in particular Policy SD28: Affordable Homes and Policy SD29: Rural Exception Sites. The SPD covers a number of detailed matters including: local connections; financial contributions in lieu of on-site provision; and vacant building credit. Adopted Affordable Housing SPD Adoption Statement Having adopted the SPD, it is a material consideration for relevant planning applications. The SDNPA consulted on a draft of the SPD from September – November 2019. The SDNPA considered the responses received during the consultation and amended the SPD as considered necessary. The SDNPA prepared a Consultation Statement in accordance with Regulations 12 (a) and (b) of the Town and Country (Local Development) (England) Regulations 2004, and made the amended draft SPD and Consultation Statement available for comment from 2nd March to 6th April 2020 prior to the SDNPA adopting the SPD. Consultation Statement The SDNPA has screened the draft SPD as to whether or not a Strategic Environment Assessment or Appropriate Assessment is required. This determination statement was also available during the consultation period. SEA & HRA Screening Determination Statement These documents are also available to view at the South Downs Centre, North Street, Midhurst, GU29 9DH. First Homes As of 28 March 2022, the Government’s First Homes Scheme has been relevant to the determination of all new full and outline applications. The SDNPA Director of Planning issued the following advice note on the implementation of First Homes in the South Downs National Park: First Homes Advice Note The note is intended to be interim guidance and will be updated in due course. It provides guidance to help decision makers reach a decision only. Print"
