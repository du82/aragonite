["https://www.southdowns.gov.uk/ambitious-vision-for-future-is-unveiled-by-south-downs-national-park"]
title = "Ambitious vision for future is unveiled by South Downs National Park - South Downs National Park Authority"
description = "Tackling climate change, helping nature flourish, supporting the rural economy, creating a National Park for all and providing a green health and wellbeing service are among the priorities of an ambitious five-year plan being launched today by the South Downs National Park Authority. Ten key outcomes have been outlined in the new Partnership Management Plan, […]"
full_description = "Ambitious vision for future is unveiled by South Downs National Park April 24, 2020 Tackling climate change, helping nature flourish, supporting the rural economy, creating a National Park for all and providing a green health and wellbeing service are among the priorities of an ambitious five-year plan being launched today by the South Downs National Park Authority. Ten key outcomes have been outlined in the new Partnership Management Plan, which sets out a bold collective vision for the future of the National Park. The 73-page masterplan focuses on bringing together environmental organisations, land managers, farmers, community organisations, businesses and volunteers to make the South Downs National Park an even better home for people and nature. As the National Park launches a revamped website today, the 10 outcomes will be brought alive through the “Your National Park” campaign, which features a champion or hero who is helping to deliver on each of the goals. The first of the heroes, Paul Gorringe, a Ranger from Brighton & Hove City Council, is helping to deliver on Outcome 1: Landscape and Natural Beauty. Margaret Paren, Chair of the South Downs National Park Authority, said: “This ambitious plan is a shared endeavour among all those who love and care for this very special National Park to positively shape and secure its future. It also fully supports the Government’s objectives in support of the environment and responds to the challenges ahead for National Parks, not least those related to climate change and ensuring nature and our communities flourish. “We have to recognise that the unprecedented and challenging COVID-19 crisis demands an adaptable approach that nevertheless remains focused on our longer-term ambitions for the environment and our local communities.” Dozens upon dozens of partners from across all areas of work have committed to helping to deliver the shared objectives, including the RSPB, Sussex Police, Historic England, Parish Councils, Visit Hampshire and Forestry England, to name but a few. Andrew Lee, Director of Countryside Policy and Management at the South Downs National Park Authority, said: “With such a large population in and around the South Downs National Park, there’s a wealth of resources to draw upon and everyone can play their part, no matter how big or small. This wide-reaching plan is that launch pad to increase ambition, deepen the partnerships, respond to the challenges set out in last year’s Protected Landscape Review and deliver more for nature and people.” And Andrew added: “Now, more than ever, this important landscape is needed by both nature and people and, together, we are ready for the challenge.” The Partnership Management Plan focuses on 10 outcomes: Landscape and Natural Beauty Work is under way between a range of partners to create a “people and nature network” that identifies key areas for investment in biodiversity, local economy, climate change adaptation and flood risk management. The Authority will bring farmers, foresters and estates together with Defra and Natural England to pilot the new Environmental Land Management System (ELMS), which focuses on nature-friendly farming. Increasing Resilience Improve the soil and water of the South Downs through innovations such as winter cover crops, which can reduce nitrate pollution by 90 per cent. The SDNPA, Brighton & Hove City Council, Environment Agency and Southern Water have joined forces to protect drinking water supplies via The Aquifer Partnership. Improve the quantity and quality of trees in the National Park. For instance more than 1,500 disease-resistant Elms have already been planted, with thousands more planned for the future. Habitats and Species Create corridors for species movement and enlarge existing habitats for wildlife. For instance the lottery-funded Heathlands Reunited project is seeing 11 partners join forces to create and improve heathland at 41 sites across Hampshire and Sussex covering an area greater than 1,200 football pitches. The heathlands are a habitat rarer than the tropical rainforest and are a haven for some of Britain’s rarest amphibian and reptile species, such as the smooth snake and Natterjack toad. Meanwhile, the Bee Lines project will create wildflower corridors across the the National Park for pollinators to move along. Create a nature recovery network across the National Park and the wider South East region. Tackle invasive species, pests and diseases that threaten our habitats. Arts and Heritage Increase investment in the protection and interpretation of cultural heritage through Section 106 and Community Infrastructure Levy money. Promote awareness of heritage crime and its impact, encouraging public custodianship of heritage assets. Outstanding Experiences Enable everyone to experience the National Park and reduce barriers (physical, economic and social). Projects include Miles Without Stiles, creating fully accessible routes for those with limited mobility and families with young children, and the Authority’s growing family outreach programme. Encourage the retention and expansion of rural transport services. Lifelong Learning The highly successful South Downs Learning Network will continue to deliver high-quality learning outside the classroom for young people. Activities will include designing programmes of study with headteachers, delivering teacher training and INSET day sessions with school staff, and working with universities to upskill trainee teachers. Health and Wellbeing Continue to build partnerships with health bodies and local networks to encourage social prescribing and a better appreciation of the South Downs as a place for healthy outdoor activity and relaxation. For instance, the GROW project runs from Saddlescombe Farm near Brighton and aims to give people experiencing psychological and emotional distress a chance to recover by taking part in nature activities, including nature walks, practical conservation work and helping at the farm. Creating Custodians Increase volunteering, including more Youth Action Days where young people aged 16 to 25 can get hands-on conservation experience. Great Places to Live Increase affordable housing stock in the National Park, with a focus on high-quality design and using local sustainable materials. Support community-led initiatives which enhance the towns, villages and landscapes of the National Park. Grow and retain business in the National Park by improving digital infrastructure right across the National Park. A partnership project led by West Sussex County Council aims to overcome issues of poor connectivity in rural areas by providing full-fibre infrastructure between Chichester and Horsham districts. Great places to work Work with Government to increase the amount of business support and ensure a good supply of employment space through the South Downs Local Plan. Supported by a wide variety of holiday accommodation, we want visitors to delve deeper and connect with wildlife, history, culture and cuisine. The Authority and its partners will work together and create unique experiences for visitors that will also benefit our communities and businesses. The new Partnership Management Plan builds on the foundation of the South Downs National Park’s first PMP, which covered the period 2014 to 2019. The new PMP can be viewed in detail at www.southdowns.gov.uk/PartnershipManagementPlan Watch our first champion, Paul Gorringe here."
year_published = 2020
year_updated = 2020
