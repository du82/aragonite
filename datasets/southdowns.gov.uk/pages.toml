["https://www.southdowns.gov.uk/getting-here/accessible-travel"]
title = "Accessible travel - South Downs National Park Authority"
description = "The South Downs National Park is easily accessible by all forms of transport. If visiting, we would love it if you could come by public transport. Not only will you be helping to conserve the landscape but, you can also relax and soak up the views.  The South Downs’ proximity to London and the South […]"
full_description = "Accessible travel The South Downs National Park is easily accessible by all forms of transport. If visiting, we would love it if you could come by public transport. Not only will you be helping to conserve the landscape but, you can also relax and soak up the views. The South Downs’ proximity to London and the South Coast make it extremely easy to get reach. Regular trains from Waterloo and Victoria take between 60–90 minutes to get to stations such as Winchester and Lewes which are gateways to the National Park. Catch a train in to the heart of the South Downs and start a walk directly from Amberley in the Arun Valley, Southease in the Ouse Valley or Liss in Hampshire. The National Park also has excellent bus services and with a South Downs Discovery Ticket you can explore the entirety of the South Downs National Park by bus with just one ticket. Print"
year_published = 2025
year_updated = 2022
