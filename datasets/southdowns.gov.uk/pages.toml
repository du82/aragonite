["https://www.southdowns.gov.uk/affordable-housing-in-the-south-downs-national-park/delivering-affordable-housing"]
title = "Delivering Affordable Housing - South Downs National Park Authority"
description = "Local Communities and Non-profit Organisations The SDNPA is able to support communities with exploring the options for delivering affordable housing. Having identified a local need for affordable housing (in some cases through a Housing Needs Survey) we would suggest that you contact the National Park for advice on the potential affordable housing project as early […]"
full_description = "Delivering Affordable Housing Local Communities and Non-profit Organisations The SDNPA is able to support communities with exploring the options for delivering affordable housing. Having identified a local need for affordable housing (in some cases through a Housing Needs Survey) we would suggest that you contact the National Park for advice on the potential affordable housing project as early in the process as possible. The SDNPA will be able to support you in identifying and assessing potential sites and offer advice on planning policy. Your local Housing Authority, or in the case of a live planning application, your Planning Case Officer can also offer guidance on who might be able to support the delivery of housing and how to contact Registered Providers who will support the future management of the homes. For all other enquiries please contact affordablehousing@southdowns.gov.uk Developers The SDNPA encourages early engagement with developers in relation to the provision of affordable homes within a new development. The South Downs Local Plan Policy SD28 sets out the requirements for affordable housing provision, with a minimum of 50% of the total to be affordable on sites of 11 or more homes. A proportion of onsite affordable housing provision is also required on developments of 4 or more homes. The Affordable Housing Supplementary Planning Document provides further guidance to support the implementation of Local Plan policy. We would advise you, in the first instance, to contact the local Housing Authority or your Planning Case Officer for guidance on who might be able to support the delivery of affordable housing and how to contact Registered Providers who will support the future management of the homes. For all other enquiries please contact affordablehousing@southdowns.gov.uk Print"
year_published = 2025
year_updated = 2021
