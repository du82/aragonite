description = "It was in the Sussex village of Felpham that William Blake wrote the lines to Jerusalem that celebrate ‘England’s pleasant pastures’ and ‘mountains green’. Today, the South Downs National Park continues to inspire writers, poets, artists and creatives of all kinds. As one of ‘Britain’s Breathing Spaces’, the South Downs welcomes thousands of visitors every year who […]"
