title = "Events Calendar - South Downs National Park Authority"
description = "The South Downs National Park has it all – rolling hills, glorious…"
full_description = '''Events and Activities Home What’s On Events Calendar Toggle filters Date Date Event type Event type Select an option ArtBusinessCyclingDark SkiesDark Skies FestivalDog FriendlyEquineFamilyFarmingFoodFree EventGeocachingHeathlands ReunitedHistoricalLearning and DiscoveryLiteratureMusicNatureOnline Teacher TrainingOuse Valley Climate ActionPerformanceReNature FestivalSeven SistersSportTake the LeadTransportVolunteeringWalking Spring Supper Club Be among the first to savour the new season’s menu at our exclusive Spring Supper Club, hosted at the award-winning, sustainable restaurant, Farmer, Butcher, Chef. This special evening is crafted for those who share our passion for exceptional food and its provenance. Enjoy a five-course tasting menu that celebrates the freshest seasonal ingredients and food […] How to start your family tree A workshop giving general advice, hints and tips on how to start researching your family history. You do not need to have ancestors from West Sussex to benefit from this talk. Watching Narrowly: a Natural History Book Day in Selborne Watching Narrowly: a Natural History Book Day in Selborne. Selborne is considered by some as the home of nature writing. On the 8th March we will be joined by six nature writers for a one of a kind book festival. Supported by One Tree Books this event will be held in the barn at Gilbert […] The National Garden Scheme: Manor of Dean: Open Garden Visit the garden at The Manor of Dean Tillington, Petworth and help support National Garden Scheme charities Approx 3 acres of traditional English garden with extensive views of the South Downs. Herbaceous borders, early spring bulbs including snowdrops in February, bluebell woodland walk, walled kitchen garden with fruit, vegetables and cutting flowers. NB under long […] Tour Tuesday Want to know more about the House and Gardens? Join us on Tour Tuesday for an extra special experience. Join one of our garden team in the morning to learn more about the history of the Garden, Gilbert White as a gardener and the work we do to upkeep the garden in a way that […] Gilbert White Field Studies Centre Open Day This is the perfect opportunity to find out more about the work of the education team at the Field Studies Centre. Everyone is welcome- locals, teachers, Home Educators, families, and anyone else of any age who would like to engage with our education programme! There will be activities for all the family including having a […] Guided Walk: Spring at the North Wall! Spring is in the air and migration is underway. Join our friendly guides on a walk along the north side of our reserve as we look for waders, ducks and geese, which will be heading home to the far North to breed, as well as the first of our returning summer breeding birds! We’ll help […] Visit Denmans Garden, Fontwell and help support National Garden Scheme charities Visit Denmans Garden, Fontwell and help support National Garden Scheme charities Created by Joyce Robinson, a horticulturalist and pioneer in gravel gardening and former home of influential landscape designer, John Brookes MBE. Denmans is a Grade II registered post-war garden renowned for its curvilinear layout and complex plantings. Year-round colour, unusual plants, structure and fragrance […] Gilbert’s Garden: Open Greenhouse Day The greenhouse will be busy as the propagating team prepare plants for this season’s planting and sales. Meet the team, find out about our plant production operation, watch the system in action and ask questions. free with admission Artists Wildlife Painting Workshop This all-day workshop gives an introduction to basic techniques of watercolour painting combining a little theory with a lot of practical application and advice. Although wildlife based, the principles can be applied in a wider context. The session is aimed at beginners and those returning to an old hobby after work. Good quality paints, paper […] Arundel Museum Exhibition : History of Arundel Castle Gardens Between March and October (excluding August), Arundel Museum will be holding a new exhibition on the history of Arundel Castle Gardens. Uncovering the changes from the Victorian gardens through to the transformation of a visitor car park into today’s wonderful Collector Earl’s Garden and the renewal of the medieval Stew Ponds. During the 1990s the […] The National Garden Scheme: Down Place South Harting: Open Garden Visit Down Place South Harting and help support National Garden Scheme Charities Set on the South Downs with panoramic views out to the undulating wooded countryside. The garden merges seamlessly into its surrounding landscape with rose and herbaceous borders that have been moulded into the sloping ground. There is a well-stocked vegetable garden and walks […] Nature and Wildlife Photography Workshop. This all-day practical workshop gives an introduction to the key principles and techniques of Nature and Wildlife photography. The workshop will combine theory with opportunities to get to grips with your camera and its settings with the opportunity to practice what you learn on our beautiful reserve. 9.30am (duration 6½ hrs) £45 per person / […] Astronomy Night Ever wondered which stars you are looking at? Or which constellation they make up? An evening in the company of the South Downs Astronomical Society, learning to recognise our winter and spring constellations, understand the Cosmos and how we fit in and viewing deep space objects through quality telescopes. 7.30pm (duration 2 hours) £12.50 per […] Spring Floristry Workshop Create a beautiful, Spring meadow table arrangement with exclusively British-grown spring flowers, budded branches, foliage’s and moss in the Historic Blue Drawing room at Stansted House. Vanessa, of the superb Vanessa Jayne Floral Design, will teach you how to cleverly use sustainable mechanics within your meadow so you can create and enjoy these again and […] Getting started with Ancestry.co.uk This workshop will incorporate a practical, hands-on session on Record Office computers, giving you the chance to try out this popular website under our guidance. To benefit fully you will need to have some basic IT skills – contact your local library for details of their digital support offer. Arundel Museum Talk : The Burpham Big Dig Arundel Museum Presents Talk: The Burpham Big Dig James Sainsbury, curator of Archaeology at Worthing Museum will talk about the discoveries made during the Burpham Big Dig event in August 2024. Wednesday 2 April, Arundel Museum Society £8 member / £10 non-member, doors open 6.10pm for 6.30pm prompt start. Book by email office@arundelmuseum.org / 01903 […] The National Garden Scheme: Sandhill Farm House Rogate: Open Garden Visit Sandhill Farm House, Rogate and help support National Garden Scheme Charities Sandhill Farm House Home of author and principal of The English Gardening School. Front and rear gardens broken up into garden rooms inc small kitchen garden. Front garden with small woodland area, planted with early spring flowering shrubs, ferns and bulbs. White and […] Hollywood in Eastbourne by Bohemian Symphony Orchestra Prague Hollywood Comes to Eastbourne! Enjoy an evening of memorable movie music performed by the famous Bohemian Symphony Orchestra Prague, who invite you on a spectacular journey through the greatest film scores of Hollywood. A Night of Movie Melodies Join the Bohemian Symphony Orchestra Prague on 13th April 2025 at St Saviour’s Church, Eastbourne, for an […] Easter junior golf camp. A fun environment for young golfers aged 5-13 to help them learn how to golf and develop new skills. It is led by an expert coaching team at Goodwood who will help and support everyone there. It is available for all skill levels so anybody can sign up. The camp will run from 9:00am to […] Guided Walk: Spring into Pagham! It’s Spring and migration is well underway. Join our friendly guides for a guided walk at RSPB Pagham Harbour, to Church Norton, enjoying the magic of migration! We’ll help you find and identify some of our returning birds, including, gulls and terns, warblers and songbirds, and we may even find some rare birds having a […] Teddy Bear’s Picnic at Stansted Park Join us for a gathering of all your favourite teddy bears for a big picnic on the lawn in front of Stansted House on Easter Monday. We are opening the grounds surrounding Stansted House for a special family and friends picnic in front of the Mansion! Bring your own picnic, rugs, portable chairs and of […] Summer Junior Golf Camps. A fun environment for young golfers aged 5-13 to help them learn how to golf and develop new skills. It is led by an expert coaching team at Goodwood who will help and support everyone there. It is available for all skill levels so anybody can sign up. The camp will run from 9:00am to […] The National Garden Scheme: Fittleworth House: Open Garden Visit Fittleworth House and help support National Garden Scheme charities A three-acre tranquil, romantic, country garden with walled kitchen garden growing a wide range of fruit, vegetables and flowers including a large collection of dahlias. Large glasshouse and old potting shed, mixed flower borders, roses, rhododendrons and lawns. Magnificent 115ft tall cedar overlooks wisteria covered […] The National Garden Scheme: Sandhill Farm House Rogate: Open Garden Visit Sandhill Farm House, Rogate and help support National Garden Scheme Charities Sandhill Farm House Home of author and principal of The English Gardening School. Front and rear gardens broken up into garden rooms inc small kitchen garden. Front garden with small woodland area, planted with early spring flowering shrubs, ferns and bulbs. White and […] The National Garden Scheme: Manor of Dean: Open Garden Visit the garden at The Manor of Dean Tillington, Petworth and help support National Garden Scheme charities Approx 3 acres of traditional English garden with extensive views of the South Downs. Herbaceous borders, early spring bulbs including snowdrops in February, bluebell woodland walk, walled kitchen garden with fruit, vegetables and cutting flowers. NB under long […] Loving the Lichen! Often overlooked, these mysterious organisms, have their own roles to play in natures different ecosystems. They are also beautiful, coming in many different forms, structures and colours. This special walk will give you an introduction to the lichens of Pagham Harbour, as we look at the common lichens we find on trees, worked wood, the […] Guided Walk: Experience the Dawn Chorus Join in International Dawn Chorus weekend as we help you decipher this spring phenomenon. Close your eyes and soak up the sound of the birdsong as it gathers from a single voice into the crescendo of a full orchestra. Our experts will help you pick out the individual virtuosos and learn recognise their particular songs […] Batty about bats! Bat-detectors in hands, we’ll discover which bats call Pagham Harbour their home and even decipher a little of what they are saying as we listen in on their batty conversation! Learn more about these intriguing nocturnal mammals with an evening stroll around Church Norton. Meet Church Norton car park PO20 9DT 8pm (duration 2 hours) […] Reading old handwriting A workshop giving a basic introduction to reading old handwriting, using examples of documents held by West Sussex Record Office. "The Downs...too much for one pair of eyes, enough to float a whole population in happiness." jQuery(document).ready(function(){ jQuery("#event_date_time").datepicker({ gotoCurrent: true, prevText: "&lt;", nextText: "&gt;", dateFormat: "dd/mm/yy" }); if ('' != '' ) { jQuery('option[value=' + '' + ']').attr("selected", "selected"); } if ('' != '' ) { jQuery("#event_date_time").datepicker( "setDate", "" ); } });'''
