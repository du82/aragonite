["https://www.southdowns.gov.uk/accessibility/changing-places-and-disabled-access-toilets"]
title = "Changing Places and Disabled Access Toilets - South Downs National Park Authority"
description = "For those who rely on wheelchairs or other mobility aids, knowing where to find a Changing Places or Disabled Access toilet is a priority as you plan your visit. At the South Downs Centre in Midhurst, visitors will find a disabled access toilet in the reception area. Across the South Downs at the far eastern […]"
full_description = "Changing Places and Disabled Access Toilets For those who rely on wheelchairs or other mobility aids, knowing where to find a Changing Places or Disabled Access toilet is a priority as you plan your visit. At the South Downs Centre in Midhurst, visitors will find a disabled access toilet in the reception area. Across the South Downs at the far eastern end, Seven Sisters Country Park have recently fitted a new Changing Places toilet to provide more people with a positive experience when visiting the iconic chalk cliffs. Changing Places, the national campaign for better toilet facilities for disabled people, maintain an up to date map of Changing Places toilets. Use the map to help you plan your visit to the South Downs, knowing where your nearest toilet facility will be. Print"
