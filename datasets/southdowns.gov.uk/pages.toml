full_description = "Dark Night Skies Home Dark Night Skies In this section Where to stargaze? Overview Winchester Science Centre & Planetarium Dark Sky Discovery Site Old Winchester Hill Dark Sky Discovery Site Butser Hill Dark Sky Discovery Site Buriton Dark Sky Discovery Site Harting Down Dark Sky Discovery Site Iping Common Dark Sky Discovery Site Bignor Hill Dark Sky Discovery Site Devil’s Dyke Dark Sky Discovery Site Ditchling Beacon Dark Sky Discovery Site Birling Gap Dark Sky Discovery Site Beginner’s guide to stargazing South Downs Dark Skies Festival 2025 Overview Festival Events Discover where to stargaze in the South Downs Resources and Activities Previous Festivals 2025 Astrophotography Competition Overview Astrophotography People’s Choice 2025 Star Party pack for schools Top tips for photographing night skies What does International Dark Sky Reserve status mean? Dark Night Skies: Design Guidance for events, creative commissions and lighting festivals In May 2016 the South Downs National Park became the newest International Dark Sky Reserve (IDSR). It has since been joined by others and is now part of a family of 19 IDSR’s around the world. We think our star-studded skies overhead are as valuable as our beautiful rolling landscapes and, with properly dark skies in the South East of England under threat, this is a statement that the skies of the South Downs are worth protecting. We celebrate this designation every year at our Dark Skies Festival with two weeks of cosmic fun including star parties, talks and family activities. Where to stargaze? In May 2016 the South Downs National Park became the world’s 13th International Dark Sky Reserve (IDSR). We think our star-studded skies overhead are as valuable as our beautiful rolling... Find out more Beginner's guide to stargazing Here are some top tips to help you make the most of stargazing in the South Downs: Check the phase of the moon to plan your trip – stargazing is... Find out more South Downs Dark Skie