["https://www.southdowns.gov.uk/contact"]
title = "Contact Us - South Downs National Park Authority"
description = "South Downs National Park Authority has ranger area offices throughout the National Park with our main administrative offices being at the South Downs Centre in Midhurst. Directions to the South Downs Centre South Downs Centre, Midhurst, West Sussex South Downs Centre North Street Midhurst West Sussex GU29 9DH Telephone: 01730 814810 Opening hours: Monday – […]"
full_description = "Contact Us South Downs National Park Authority has ranger area offices throughout the National Park with our main administrative offices being at the South Downs Centre in Midhurst. Directions to the South Downs Centre South Downs Centre, Midhurst, West Sussex South Downs Centre North Street Midhurst West Sussex GU29 9DH Telephone: 01730 814810 Opening hours: Monday – 9am to 4.30pm Tuesday – 9am to 4.30pm Wednesday – 9am to 4.30pm Thursday – 9am to 4.30pm Friday – 9am to 4.00pm Saturday – closed Sunday – closed Seven Sisters Country Park, Exceat, East Sussex Seven Sisters Country Park and Cliffs Exceat East Dean Road East Sussex BN25 4AB Telephone: 01323 364690 Opening hours: Seven Sisters Country Park is open all year round, with car parks open from dawn until dusk. Please note, car parks are closed overnight and it won’t be possible to access the car park once barriers are locked. For the winter, our opening hours will be as follows: Grab and Go (takeaway hot drinks, soft drinks, sandwiches, cakes, ice cream): 10:00- 16:00 South Car Park Trailer: Open during peak times only Visitor Centre: 10:00 – 16:00 Car Parks: 7:00 – 18:00 Toilets: 7:00 – 18:00 The public toilets, including an accessible Changing Places toilet, are open during daytime hours and generally close early evening. Get in Touch We aim to deal with all enquiries as quickly as possible. Please help us by contacting the area that most closely matches your question, so that your message gets to the right person as quickly as possible. General Enquiries For general enquiries, please contact us at info@southdowns.gov.uk or call our main switchboard on 01730 814810 (between 9:00am-5:00pm Mon – Thurs, and 09:00am – 4:30pm Fridays) Planning Enquiries If you have a query about a planning matter, please contact us at planning@southdowns.gov.uk Press Office contacts All media enquiries about the South Downs National Park should be directed to the Press Office, press@southdowns.gov.uk Jeff Travis, Media and Public Relations Officer 01730 819252 or 07557 853277 jeff.travis@southdowns.gov.uk Ruth James, Head of Communications and Engagement 01730 819251 or 07956 664759 ruth.james@southdowns.gov.uk Recruitment Enquiries Working for the SDNPA To enquire about working for the SDNPA, please contact us at recruitment@southdowns.gov.uk or visit our jobs page https://www.southdowns.gov.uk/national-park-authority/job-vacancies/ to view our live vacancies. Work Experience Placements For students in Year 10-13, please visit our information page at https://learning.southdowns.gov.uk/learning/work-experience/ email learning@southdowns.gov.uk. Research Placements If you are in higher or further education and are looking for research placements or would like to undertake a research project please visit the research hub and contact research@southdowns.gov.uk Volunteering Enquiries If you are interested in volunteering, please contact us at volunteering@southdowns.gov.uk providing your name, address and availability Print"
