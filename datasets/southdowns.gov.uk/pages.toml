["https://www.southdowns.gov.uk/event/national-meadows-day-guided-walks"]
title = "National Meadows Day Guided Walks - South Downs National Park Authority"
description = "Join us in celebrating National Meadows Day 2023 with a guided walk around our beautiful meadow at Gilbert White’s House and Gardens. Discover more about the abundance of species of wildflowers and meadow plants growing on our site, including species of orchid and Yellow Rattle and how our ongoing efforts help maintain it as a […]"
full_description = "National Meadows Day Guided Walks 01 July 2023 11am to 2pm Join us in celebrating National Meadows Day 2023 with a guided walk around our beautiful meadow at Gilbert White’s House and Gardens. Discover more about the abundance of species of wildflowers and meadow plants growing on our site, including species of orchid and Yellow Rattle and how our ongoing efforts help maintain it as a vital habitat for butterflies, moths (including day-flying) and other insects. Small mammals, birds and reptiles and amphibians, also benefit from a traditional hay meadow and its margins. In the UK we have lost over 97% of our wildflower meadows since the 1930s so active conservation is vital in protecting species. National Meadows Day is organised by Plantlife and is an annual event which aims at raising awareness of this vanishing habitat. Tickets are £5 per person. Please note you must also purchase tickets to the garden to join this walk. Please meet in the Stable Yard promptly at your chosen walk time."
year_published = 2025
year_updated = 2023
