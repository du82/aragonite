["https://www.southdowns.gov.uk/contact/compliments-comments-complaints"]
title = "Compliments, Comments, Complaints - South Downs National Park Authority"
description = "Our Commitment We are committed to providing high quality services and believe that we succeed most of the time. However, we accept that sometimes thing go wrong. If you are unhappy about a service we provide or if you feel we have acted incorrectly or improperly we want to know. The information you give us […]"
full_description = "Compliments, Comments, Complaints Our Commitment We are committed to providing high quality services and believe that we succeed most of the time. However, we accept that sometimes thing go wrong. If you are unhappy about a service we provide or if you feel we have acted incorrectly or improperly we want to know. The information you give us may help us to put things right for the future. If your complaint relates to a breach of planning please visit the Report a Breach page for further information on planning enforcement. Letting us know what you think If you wish to make a complaint, we will: Make it easy for you to contact us; Deal with your complaint promptly, fully, politely and professionally; Aim to respond initially within 10 working days, and complete our internal complaints resolution process as soon as possible (the full process will be completed within 12 weeks); Tell you if we need longer to deal with you complaint; Keep you informed of our progress; and Apologise if we have made a mistake and do our best to put things right as quickly as possible. We also welcome compliments and comments about things we have done right, so that we can continue to improve our services based on comments from users of the South Downs National Park. Compliments are always appreciated and are valuable to the individuals who receive them, any compliment received is forwarded to the member of staff involved and their line manager to ensure they are fully recognised for the work they do. Our Compliments, Comments and Complaints Process For further information and a short summary of our policy, which offers some guidance on the process, please visit our compliments, comments and complaints process page. If you would like to view the full version of our Complaints, Compliments and Comments Policy you can download it here: Compliments, Comments and Complaints Policy Compliments, Comments and Complaints Form Flowchart – Process for Complaints about the SDNPA Flowchart – Process for Complaints about a Host Authority Complaints against members follow a specific process, for more information see the Member Code of Conduct page. Need more information? You can call the SDNPA on 01730 814810, email us info@southdowns.gov.uk or write to: South Downs National Park Authority South Downs Centre North Street Midhurst West Sussex, GU29 9DH Print"
year_published = 2025
year_updated = 2024
clearnet = "https://www.southdowns.gov.uk/contact/compliments-comments-complaints"
