["https://www.southdowns.gov.uk/getting-here"]
title = "Getting Here - South Downs National Park Authority"
description = "Use these pages to plan your journey to the South Downs National Park. With plenty of public transport options and cycling links throughout the National Park, the South Downs is perfect for a car-free visit."
full_description = "Getting Here Home Getting Here In this section Accessible travel Public Transport Driving School coach hire with National Express x South Downs National Park Use these pages to plan your journey to the South Downs National Park. With plenty of public transport options and cycling links throughout the National Park, the South Downs is perfect for a car-free visit. Accessible travel The South Downs National Park is easily accessible by all forms of transport. If visiting, we would love it if you could come by public transport. Not only will you... Find out more Public Transport Because of the National Park’s close proximity to London and a number of major urban centres including Brighton and Portsmouth, public transport is the ideal way to travel around the... Find out more Driving Situated in a busy part of the United Kingdom, driving through parts of the South Downs can become congested, especially at busy times. It’s for this reason we encourage visitors... Find out more School coach hire with National Express x South Downs National Park We've teamed up with National Express to offer affordable, reliable and comfortable school transportation to over 100 of the South Downs National Park attractions. As the newest of the 15... Find out more"
