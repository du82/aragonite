["https://www.southdowns.gov.uk/dark-night-skies/beginners-guide-to-stargazing"]
title = "Beginner’s guide to stargazing - South Downs National Park Authority"
description = "Here are some top tips to help you make the most of stargazing in the South Downs: Check the phase of the moon to plan your trip – stargazing is best before a full moon Take a blanket or mat to lie on Wrap up warm Take some snacks and a hot drink Take a […]"
full_description = "Beginner’s guide to stargazing Here are some top tips to help you make the most of stargazing in the South Downs: Check the phase of the moon to plan your trip – stargazing is best before a full moon Take a blanket or mat to lie on Wrap up warm Take some snacks and a hot drink Take a compass or use the one on your smart phone Download a star gazing app to help you identify constellations and stars Allow time for your eyes to adjust – this takes around 20 minutes so turn off any lights, torches and put your mobile phone away Alternatively, check out the video below for further top tips. Print"
