["https://www.southdowns.gov.uk/food-drink/vineyards-breweries-distilleries"]
title = "Vineyards, Breweries and Distilleries - South Downs National Park Authority"
description = "Across the South Downs National Park, locals and visitors can enjoy some of England’s finest wine, beer and gin crafted by award-winning producers.  The vineyards owe their success and inspiration to the chalky soils and fine climate providing a unique ‘flavour of the South Downs’. In fact, grapes have been growing in the area, which […]"
full_description = "Vineyards, Breweries and Distilleries Across the South Downs National Park, locals and visitors can enjoy some of England’s finest wine, beer and gin crafted by award-winning producers. The vineyards owe their success and inspiration to the chalky soils and fine climate providing a unique ‘flavour of the South Downs’. In fact, grapes have been growing in the area, which is very similar to the Champagne region in France, since Roman times. Breweries also benefit from interaction with the elements. The South Downs to the east of Brighton is one of the largest chalk aquifers in the country, soaking up gallons of water like a sponge. Brewers like Harvey’s in Lewes, receive their water from a well deep below the brewery to produce exceptional beer, such as Sussex Best. In the last few years, there’s been an explosion in the number of distilleries in the National Park, producing world-class gin, vermouth and vodka. Print"
year_published = 2025
year_updated = 2020
