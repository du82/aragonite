["https://www.southdowns.gov.uk/accessibility/accessible-equipment-for-hire-in-west-sussex"]
title = "Accessible equipment for hire in West Sussex - South Downs National Park Authority"
description = "Ascessible equipment is available for hire at several venues across the South Downs National Park, including a fleet of electric mobility scooters. This equipment has been made available thanks to Defra’s Access for All fund. In West Sussex, you can find inclusive equipment at the following locations. Cadence Cycle Cafe, Cocking Based at an old dairy […]"
full_description = "Accessible equipment for hire in West Sussex Ascessible equipment is available for hire at several venues across the South Downs National Park, including a fleet of electric mobility scooters. This equipment has been made available thanks to Defra’s Access for All fund. In West Sussex, you can find inclusive equipment at the following locations. Cadence Cycle Cafe, Cocking Based at an old dairy farm right next to the South Downs Way, Cadence in Cocking will be offering a scooter for hire to allow people with additional mobility needs to explore the South Downs Way. Find out more on how to hire on the Cadence website. RSPB Pulborough Brooks Scooter hire is available at RSPB Pulborough Brooks, a stunning wetland and heathland habitat and, one of the best places for bird watching in the South Downs. Go to the RSPB Pulborough Brooks website to find out more on how to hire the equipment. Print"
