description = "Cuckmere Cycle Co., located near the Seven Sisters Visitor Centre, offers the hire of several bikes for those with additional mobility needs, as well as their existing e-bikes. They have a range of options, some electrically assisted, with a variety of seating positions and intended uses. Hire prices are at a reduced rate, starting from […]"
full_description = 'Accessible Bike Hire at Cuckmere Haven Cuckmere Cycle Co., located near the Seven Sisters Visitor Centre, offers the hire of several bikes for those with additional mobility needs, as well as their existing e-bikes. They have a range of options, some electrically assisted, with a variety of seating positions and intended uses. Hire prices are at a reduced rate, starting from £15. Check with Cuckmere Cycle Co. on what bikes are available for hire. Print Accessible Bike Hire at Cuckmere Haven Home Accessibility Accessible Bike Hire at Cuckmere Haven In this section Accessible Bike Hire at Cuckmere Haven Cuckmere Cycle Co., located near the Seven Sisters Visitor Centre, offers the hire of several bikes for those with additional mobility needs, as well as their existing e-bikes. They have a range of options, some electrically assisted, with a variety of seating positions and intended uses. Hire prices are at a reduced rate, starting from £15. Check with Cuckmere Cycle Co. on what bikes are available for hire. Print You might be interested in... Inclusive Equipment for Hire Inclusive attractions and nature reserves Miles Without Stiles "The Downs...too much for one pair of eyes, enough to float a whole population in happiness."'
