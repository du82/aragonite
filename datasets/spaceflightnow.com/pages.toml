["https://spaceflightnow.com/2025/02"]
title = "February 2025 – Spaceflight Now"
full_description = "Mission Reports NASA’s Lunar Trailblazer, AstroForge’s Odin face post-deployment challenges February 28, 2025 Will Robinson-Smith Two spacecraft that launched as rideshare payloads on Intuitive Machines’ IM-2 mission are dealing with post-deployment challenges that might put the missions in jeopardy. Falcon 9 SpaceX launches Intuitive Machines’ 2nd Moon lander, 3 rideshare spacecraft February 25, 2025 Will Robinson-Smith The launch is a rideshare mission with secondary payloads from NASA’s Jet Propulsion Lab, AstroForge and Epic Aerospace. Liftoff happened Wednesday, Feb. 26, at 7:16 p.m. EST (0016 UTC). Falcon 9 SpaceX launches Starlink 12-13 mission on third attempt February 22, 2025 Will Robinson-Smith The Starlink 12-13 mission includes 13 satellites that have Direct to Cell capabilities. Liftoff from pad 40 at Cape Canaveral Space Force Station happened on Wednesday, Feb. 26, at 10:34 p.m. EST (0334 UTC on Feb. 27). Falcon 9 SpaceX crosses 8,000 total Starlink satellites launched with latest Falcon 9 flight February 22, 2025 Will Robinson-Smith The Starlink 15-1 mission mission launched to a 70 degree inclination, which was previously used for Starlink missions in Group 2 and Starshield missions for the NRO. Liftoff from pad 4E at Vandenberg Space Force Base happened at 5:38 p.m. PST (8:38 p.m. EST, 0138 UTC). Falcon 9 SpaceX launches 450th Falcon rocket on Starlink 12-14 mission February 21, 2025 Will Robinson-Smith The flight will include 23 Starlink V2 Mini satellites, of which 13 have Direct to Cell capabilities. Liftoff from pad 40 at Cape Canaveral Space Force Station is set for 10:19 a.m. EST (1519 UTC). Electron Rocket Lab launches BlackSky Gen-3 satellite on 60th Electron flight February 18, 2025 Will Robinson-Smith The mission, dubbed ‘Fasten Your Space Belts,’ was Rocket Lab’s second launch of the year and its ninth launch supporting BlackSky as a customer. Liftoff from New Zealand happened at 12:17 p.m. NZDT on Feb. 19 (6:17 p.m. EST, 2317 UCT on Feb. 18)."
