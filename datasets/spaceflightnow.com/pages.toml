title = "January 2024 – Spaceflight Now"
full_description = "Electron Rocket Lab launches first recovery Electron mission of 2024 January 31, 2024 Will Robinson-Smith The mission, nicknamed “Four of a Kind” was also deemed a successful recovery mission. Liftoff of the Electron rocket from Rocket Lab Launch Complex 1 in New Zealand occurred at 19:34 UTC. Falcon 9 Polaris Dawn astronauts discuss training for historic commercial spacewalk January 31, 2024 Will Robinson-Smith Two of the four crew members will exit a SpaceX Dragon spacecraft using spacesuits currently under development. The launch is set for no earlier than early 2024. Falcon SpaceX launches Northrop Grumman’s Cygnus spacecraft on its way to the Space Station January 30, 2024 Will Robinson-Smith The mission, dubbed NG-20, marks the first of three planned flights of Cygnus aboard a Falcon 9 rocket. Liftoff occurred at 12:07 p.m. EST (1707 UTC). Falcon 9 Second Falcon 9 of the night carries Starlink satellites from West Coast January 29, 2024 Will Robinson-Smith The Falcon 9 launch was the second in a back-to-back series for the company Sunday evening. Liftoff occurred at 9:57 p.m. PST (12:57 a.m. EST, 0557 UTC). Falcon 9 SpaceX launches first of planned back-to-back Falcon 9 Starlink missions January 28, 2024 Will Robinson-Smith A Falcon 9 rocket launched from Launch Complex 39A at the Kennedy Space Center at 8:10 p.m. EST (0110 UTC). A second Falcon 9 is due to soar skyward from Vandenberg Space Force Base in California later tonight. News Despite engine malfunction, powered-down Japanese moon lander achieves major goals January 25, 2024 William Harwood One of two engines powering a Japanese moon lander during its descent to the surface Jan. 19 suffered a malfunction of some sort just 160 feet above the lunar surface that sharply reduced its power, the Japanese space agency said Thursday. News Japanese moon lander touches down, but crippled by mission-ending power glitch January 19, 2024 William Harwood A robotic Japanese moon lander touched down on the lunar surface Friday, but it immediately suffered a power glitch of some sort that prevented its solar cells from generating the electricity needed to keep it alive in the harsh lunar environment."
