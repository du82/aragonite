["https://www.spakhm.com/mvt-wolfram"]
title = "Visualizing Mean Value Theorem in Mathematica - Slava Akhmechet"
full_description = "The mean value theorem is a surprising Calculus result that states for any function fff differentiable on (a,b)(a,b)(a,b)1 there exists x∈(a,b)x(a,b)x∈(a,b) such that Here are three informal intuitions for what this means (all of them say the same thing in different ways): The proof is remarkably straightforward. You define a function hhh that maps values between aaa and bbb to a height from fff to the line segment between the endpoints. This function hhh turns out to be differentiable, and hence has a maximum value (and hence there is a point aaa such that h′(a)=0h’(a)=0h′(a)=0). From there it’s an easy algebraic transformation to demonstrate the mean value theorem is true. See figure 2 for an illustration. I won’t repeat the proof, but what I wanted to do is play with Mathematica to generate an interactive visualization of how the proof works (I generated above figures in Mathematica, but the final product has an interactive slider to make the proof more clear). For tasks like this Mathematica is wonderful. Here I define a line at an angle, and another function fff that adds a sine to it. Because the visualization is interactive sss will allow the user to change the slope: These are symbolic definitions. We can plot them, take derivatives, integrate, and do all kinds of fancy computer algebra system operations. Here is an example. The vertical line in figure 2 comes down from the mean value of fff– i.e. a point on fff where the tangent is parallel to the average change. In Mathematica code we can take the derivative of fff (using Mathematica function D), and then solve (using Solve) for all values where the derivative is equal to mean value: This is the core of the code. Most of the rest of the code is plotting, which Mathematica does exceptionally well. I exported the plots to figures above using the Export function. Another notable function is Manipulate– this is what makes the graph dynamic as the user drags a slider (by changing the variable s which the equations depend on). Finally I was able to publish the notebook in a few clicks, as well as publish the visualization itself using CloudDeploy. Instantaneous deployment of complex objects is very cool and useful."
