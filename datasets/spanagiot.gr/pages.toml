["https://spanagiot.gr/posts/the-state-of-my-homelab-2023"]
title = "DevOps Diaries: A Personal Blog"
full_description = "Automating Blog Deployment with Hugo, GitHub Actions, and MinIO2024-11-12Automating each blog post upload had been on my mind for a while. Here’s how I set up GitHub Actions with Hugo and MinIO to skip the manual steps and make each deployment as smooth as possible.→ The State of My Homelab 20232023-09-26It’s been almost seven years since I started self-hosting. This became a hobby of mine from the beginning and I found myself dedicating a lot of my afternoons (and whole days) to experiment with new technologies, hardware configurations, networking, automation, and many many more things. I never took the chance to talk about this in my blog, so now I want to finally open up and give you a glimpse into my homelab setup, sharing what I’ve been using, hosting and what are some of my thoughts about the future.→ Create Virtual Machines in Seconds2023-07-06Simplify VM Creation with Proxmox and Debian 12 Templates→ Breaking Up with Ghost: My Move to Hugo2023-04-22When I started this blog, I chose Ghost as the backend because it appeared to be a fresher alternative to the bloated WordPress. I didn’t need all the features offered by WordPress, and a simpler platform seemed like the obvious choice. I installed it, created a couple of posts and I was pretty happy. I made sure to keep the backend up-to-date by installing the latest security patches and reviewing the release notes to avoid any compatibility issues with newer versions.→ Getting an iOS device MAC Address with Swift2020-02-10#programming #ios #mac address #swift Both Android and iOS don’t allow applications to get the MAC address using their published API. Here, we will see if we can avoid this restriction and get the address using a feature of IPv6. What is a MAC Address A MAC address, or physical address, is a 48-bit number that uniquely identifies a device in a network segment. This number is assigned to the device by the manufacturer and usually doesn’t change (but it can be spoofed).→ Introduction to Genetic Algorithms2017-08-27#genetic algorithms #machine learning #programming #tutorial #beginner “A breakthrough in machine learning would be worth ten Microsofts” Bill Gates, Chairman, Microsoft We live in the era of machine learning. Scientists and researchers from around the world are using it to improve our lives in ways we never imagined and advertisers to reach the most relevant people to sell their products. It’s not a recent idea but it scaled so much lately due to great breakthroughs in computer hardware.→"
