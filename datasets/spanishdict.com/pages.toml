full_description = "Superlative adjectives are used to compare three or more nouns. They are often used to talk about the most or the least of something. Adjectives are used to compare and contrast nouns in Spanish in comparisons of equality, comparisons of inequality, and in superlatives. We'll focus on superlatives in this article. To form superlative adjectives in Spanish, you will use a formula very similar to that used to form comparative adjectives, with the important addition of the definite article. For adjectives that have single-word comparative and superlative forms, such as mejor(best) and peor(worst), you do not use más or menos. You can also add -ísimo to an adjective (and even some adverbs) to talk about an extreme degree of something. This handy suffix may be translated as very, really, extremely, super, and quite. Many qualitative adjectives that have an r in the final syllable do not always take the -ísimo ending, but instead take the -érrimo ending."
