["https://www.spanishdict.com/guide/spanish-present-progressive-forms"]
title = "Present Progressive in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish present progressive tense (el presente progresivo), also called the present continuous tense (el presente continuo), is used to talk about something that is happening now. Here's an example showing the present progressive of the verb hablar(to speak). Only the estar part of the present progressive changes to match the subject. The present participle (hablando) does not change. There are two options regarding the placement of direct object pronouns, indirect object pronouns, and reflexive pronouns with the present progressive. You can either place the pronoun in front of the conjugated form of estar or attach it to the end of the gerund (the verb ending in -iendo or ‐ando.) When attaching a pronoun to the end of the gerund, an accent mark must be added on the antepenultimate (third from last) syllable. In both English and Spanish, the present progressive is used to talk about what a subject is doing right now. However, it is also possible to use the simple present to talk about what a subject is doing right now in Spanish. Check out the pair of examples below; the first set uses the present simple, while the second uses the present progressive."
