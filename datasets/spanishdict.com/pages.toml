full_description = "In Spanish, the upside-down exclamation point (¡) is used at the beginning of all exclamatory sentences and clauses. For example: In 1754, the Real Academia Española(Spanish Royal Academy) declared that a signo de apertura de exclamación(opening exclamation mark) must be used at the beginning of all exclamations, so that they could be identified easily within a text body. Although it took a while for this new rule to catch on, it has now been fully adopted into the language. As already mentioned, the upside-down exclamation point is used at the beginning of an exclamation. Notice that it can appear in the middle of a sentence to indicate that a phrase is exclamatory, such as in the first example listed below: Although it is grammatically incorrect, Spanish speakers often do not use the upside-down exclamation mark in virtual communications, such as text messages and emails. Sometimes the trickiest part of using this symbol is knowing how to type it. ¡No te preocupes!(Don't worry!) Here is how you type the upside-down exclamation mark on a Mac: If you're not using a Mac computer, check out this table below for some additional keyboard shortcuts that you can use:"
