["https://www.spanishdict.com/guide/how-to-make-ceviche"]
title = "How to Make Ceviche | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''In this article, you'll learn how to make your own ceviche(ceviche), a zesty dish that's a favorite across Latin America! Ceviche is a popular seafood dish across the continent, and it's a common refrigerio(snack) at gatherings and beach outings. Many folks like it as an entrada (appetizer) or an acompañamiento (side dish) too. While the exact recipe may vary from region to region, the core ingredients remain constant: fresh mariscos(seafood) or pescado(fish) “cooked” in citrus juices, typically lime, accompanied by cebolla(onions), cilantro(cilantro), and some sort of spice—often ají(chili)—for that tangy kick. It’s both! Depending on the region, you might see the name of this iconic dish spelled as ceviche, cebiche, seviche, or sebiche. All of them are valid! First, slice your fresh fish or seafood into bite-sized pieces and place them in a glass or ceramic bol. Second, vierte(pour) the lime juice over the fish or seafood until it is completely submerged and let it marinade. In some recipes, the fish is left marinando(marinading) for several hours—sometimes overnight!—but let’s stick to 45 minutes for our ceviche. The ácido cítrico(citric acid) from the citrus juices will "cook" the seafood as it sits. If you’re using fish, it will turn opaque and appear cocido(cooked). After the seafood has marinaded, drain the lime juice (save it, don’t toss it!) and mix all the ingredients together in a mixing bowl. Sazona(season) with a pizca de sal(pinch of salt) and pimienta al gusto(pepper, to taste). Let the ceviche chill in the refrigerator for at least 30 minutes, allowing the flavors to meld and develop. ¡Y listo!(And that's it!) Now, you can serve your homemade ceviche with a side of your choosing. Platanitos(plantain chips), galletas saladas(crackers), or maíz tostado(toasted corn)—you can pick your favorite! You didn't think we were going to throw away the lime juice, did you? Nothing goes to waste when making ceviche! That leftover marinade, infused with all the flavors of the mariscos and the other ingredients, is what we call leche de tigre (tiger’s milk).'''
