title = "Past Perfect Spanish Forms and Uses | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The past perfect (el pretérito pluscuamperfectoo el antecopretérito), also known as the pluperfect, is used to talk about a past action that happened prior to another action in the past. The past perfect is often used to talk about what a person had done before something else happened in the past. It is formed by combining haber in the imperfect with a past participle. Notice that the auxiliary verb (haber) and the past participle are never separated. If object pronouns are present, they go immediately before haber."
