["https://spanishdict.com/guide/agudas-words"]
title = "Word Stress: Agudas | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Understanding stress in Spanish is key to correct pronunciation, as are understanding the fancy words used to talk about stress patterns in Spanish! Knowing where to put the stress on a word in Spanish is the difference between pronouncing a word like computadorawith great Spanish pronunciation (kohm-poo-tah-DOH-rah), instead of Englishy pronunciation (kohm-POO-tah-doh-rah). There are four main categories of words you'll come across when talking about Spanish word stress: palabras agudas, palabras llanas(also called palabras graves), palabras esdrújulas, and palabras sobresdrújulas. Let's take a closer look at each one. If a word ends in a consonant other than s or n and the word does not have a tilde anywhere, the word is a palabra aguda. Las palabras agudas have a tilde on the final syllable to mark word stress if the last letter in the word is a vowel or the consonants s or n. Las palabras graves, also called palabras llanas, are words that are stressed on the penultimate (second-to-last) syllable. Las palabras graves have a written accent on the second-to-last syllable to mark word stress in words that end in any consonant other than s or n and in groups of consonants like ps and cs. Las palabras esdrújulas are words that are stressed on the antepenultimate (third-to-last) syllable. Las palabras sobresdrújulas are words that are stressed on the fourth-to-last, fifth-to-last, or sixth-to-last syllable. For the most part, only words that are made up of a verb form and two or more pronoun forms are palabras sobresdrújulas."
