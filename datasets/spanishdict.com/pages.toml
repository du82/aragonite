["https://www.spanishdict.com/guide/sequence-of-tenses"]
title = "Sequence of Tenses in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "La concordancia de tiempos(sequence of tenses) is a useful rule of agreement between the tense of a main clause and that of a subordinate clause. It helps you choose the correct subjunctive tense to use in a subordinate clause. Before delving into what the sequence of tenses is and how it works, let’s first learn how to identify a main clause and a subordinate clause in a subjunctive sentence. The main clause—also called the independent clause—contains a verb in the indicative and typically appears at the beginning of the sentence. If the main clause contains a WEIRDO verb, it triggers the use of the subjunctive in the subordinate—or dependent—clause. In most subjunctive sentences, the subordinate clause is introduced by que(that). In si(if) clauses, the order may be reversed. The subordinate clause may appear at the beginning of the sentence after si, with the main clause following. If the WEIRDO verb in the independent clause is in the present indicative, future indicative, future perfect indicative, or the imperative mood, then the verb that comes after the que will be conjugated in the present subjunctive or present perfect subjunctive. Whether you use the present subjunctive or present perfect subjunctive depends on if the action has already happened or not. Use the present subjunctive if the action happens at the same time or after the independent clause. If the action in the subjunctive clause has already happened, use the present perfect subjunctive. If the WEIRDO verb in the independent clause is in the preterite indicative, imperfect indicative, conditional indicative, or the past perfect indicative, then the subjunctive verb that follows will be conjugated in the imperfect subjunctive or past perfect subjunctive. The imperfect subjunctive is used when the action in the dependent clause happened at the same time or after the independent clause. If the action in the subjunctive clause happened prior to the indicative clause, the past perfect subjunctive is used."
year_published = 2025
