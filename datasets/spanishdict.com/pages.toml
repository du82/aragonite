["https://www.spanishdict.com/guide/past-participle-in-spanish"]
title = "Past Participle Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "A past participle (participio) is a very useful verb form that can function as an adjective or as part of a perfect tense when used in conjunction with the verb haber. To form the past participle of a regular verb, you drop the infinitive ending (-ar, -er, -ir) and add -ado to the stem of -ar verbs and -ido to the stem of -er and -ir verbs. This is equivalent to adding -ed to many verbs in English. Quite a few Spanish verbs have irregular past participles. In the table below you'll find a few of the most common ones. For a more exhaustive list of irregular past participles, click here. Past participles are commonly used as adjectives in Spanish. When this is the case, they must agree in gender and number with the nouns they modify. The following examples show past participles being used as adjectives. Predicative adjectives are adjectives used in conjunction with a linking verb, such as ser(to be), estar(to be) , or parecer(to seem). Predicative adjectives must also agree with the nouns they modify in gender and number."
