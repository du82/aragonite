full_description = "Present participles in Spanish are verb forms used to express continuous or ongoing actions. Spanish present participles end in -ndo, which is the equivalent of the English ending -ing. To form the gerundio of regular verbs, most of the time you just drop the infinitive ending (-ar, -er, -ir) and add -ando to the stem of -ar verbs and -iendo to the stem of -er and -ir verbs. Check out the table below to see how to form gerundios. In Spanish grammar lingo, a stem is the verb form you're left with if you take the -ar, -er or -ir away from the end of an infinitive. There are also several types of gerundios that don't follow the above rules. Let's learn about them now! If the stem of an -er or -ir verb ends in a vowel, -iendo becomes -yendo. Check out the examples below. Ir(to go) is an irregular verb, and does not follow the pattern above. For pronunciation reasons, the gerundio of ir is yendo. There are also some verbs that need a stem change before adding the gerundio ending to maintain pronunciation:"
