["https://spanishdict.com/guide/spanish-present-tense-forms"]
title = "Spanish Present Tense Forms | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish simple present tense (el presenteor el presente del indicativo) can be used to talk about habitual actions, routines, things happening now or in the near future, universal truths, facts, hypotheticals, lapses of time, and for ordering in restaurants and stores. Below you'll find instructions for forming regular verbs in the present tense, including the endings you need to know for -ar, -er, and -ir verbs. To conjugate an -ar verb, remove the infinitive ending (-ar) and add the ending that matches the subject. You can find these endings in the table below. To conjugate an -er verb, remove the infinitive ending (-er) and add the ending that matches the subject. You can find these endings in the table below. To conjugate an -ir verb, remove the infinitive ending (-ir) and add the ending that matches the subject. You can find these endings in the table below. Notice that most of the present tense endings for -er and -ir verbs are the same. Only the nosotros and vosotros endings are different. The following verbs have irregular yo forms. The other present tense forms of these verbs follow the patterns for regular -ar, -er, and -ir verbs. Most verbs that end in -cer or -ucir have irregular present tense yo forms. Click here for more on irregular present tense verbs. Many present tense verbs undergo what is called a stem change. The present tense endings for these verbs are regular, but there is a vowel change in the verb stem (the part of the verb that comes before -ar, -er, or -ir). Click here to read our article on stem-changing verbs. The Spanish present tense can be used to talk about habitual actions, routines, things happening now or in the near future, universal truths, facts, hypotheticals, lapses of time, and for ordering in restaurants and stores. Read on for more on each of these uses. Because the endings of Spanish verbs indicate who the subject of an action is, you can often drop the subject pronoun (yo, tú, nosotros, etc.). Many Spanish speakers rarely use personal pronouns, although this varies from country to country."
