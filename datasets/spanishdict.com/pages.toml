["https://www.spanishdict.com/guide/irregular-spanish-past-participles"]
title = "Irregular Spanish Past Participles | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''A past participle (participio) is a verbal form that can function as an adjective or as part of a perfect tense when used in conjunction with the verb haber. Spanish has quite a few verbs with irregular past participles. Let's take a look at how to form them! If an -er or -ir verb stem ends in a vowel, then the past participle is written with an accent over the i. For example, the past participle of the verb fluir(to flow) is fluido, and the past participle of the verb destruir(to destroy) is destruido. Many of the verbs in the table above can be used with prefixes to form other verbs with irregular past participles. In the past, many verbs in Spanish had two past participle forms: a regular form and an irregular form. Nowadays, the irregular forms are no longer considered past participles, but simply adjectives. A few examples of these tricky pairs are shown in the table below. Keep in mind that only the forms in the "Past Participle" column in the table below can be used in compound tenses, such as the present perfect. The first example below shows the past participle of despertar being used in the present perfect, while the second example shows an adjective form related to despertar. According to the Real Academia Española, only three verbs have two acceptable past participle forms, both of which can be used in perfect tenses. The past participle of the verb describir(to describe) is descritoin some parts of the Spanish-speaking world. In others parts, such as Argentina and Uruguay, it is descripto.'''
