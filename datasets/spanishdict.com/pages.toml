["https://spanishdict.com/guide/spanish-present-subjunctive"]
title = "Spanish Present Subjunctive Regular and Irregular Forms | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish present subjunctive (el presente de subjuntivo) is used to talk about situations of doubt, desire, emotion, necessity, or uncertainty. Unlike the present indicative, the present subjunctive is generally subjective. For specifics on when to use the subjunctive instead of the indicative, see our article on subjunctive vs. indicative. To conjugate a verb in the present subjunctive, you must first remember what the present indicative yo form of the verb in question is. This is because the stem of present subjunctive verbs comes from the yo form of the present indicative. For many verbs, this will be the same as the infinitive stem, but for many others, such as verbs with spelling changes, stem-changing verbs, and irregular verbs, it will be different. Once you have the stem, you will add the present subjunctive ending that matches your subject. There are only two ending sets for the present subjunctive: one for -ar verbs and one for both -er and -ir verbs. There are only six truly irregular verbs in the subjunctive. You'll find the conjugations for each of these verbs in the tables below. For verbs in this group, the e in the last syllable of the stem (the yo form of the present indicative) changes to ie, or the o in the last syllable of the stem (the yo form of the present indicative) changes to ue. All subjunctive forms follow the stem change except for nosotros and vosotros, which use the infinitive stem. All e> ie and o> ue stem-changing -ir verbs follow the same changes as in the present indicative, except the nosotros and vosotros, forms, in which the e changes to i and the o changes to u. All e> i stem-changing -ir verbs in the present indicative maintain the stem change in all forms of the present subjunctive. Some verbs in the present subjunctive undergo spelling changes. This often occurs for reasons of pronunciation, and these changes often match those of verbs with spelling changes in the preterite. Let's take a look at some of these verbs."
year_published = 2025
