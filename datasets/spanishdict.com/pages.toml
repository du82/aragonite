["https://spanishdict.com/guide/indirect-object-pronouns"]
title = "Indirect Object Pronouns Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "An indirect object pronoun (un pronombre de objeto indirecto) tells you to whom or for whom something is done. You can find the indirect object in a sentence by asking yourself to whom or for whom an action was done. For example, to find the indirect object in the following sentence, you could ask yourself For whom did Gabriel buy a rose? The answer is For Anita. Therefore, the indirect object is Anita, and the matching indirect object pronoun is le. In Spanish, it's common for both an indirect object pronoun and the noun to which it refers to appear together. In the example below, Juanis the indirect object. The indirect object pronoun lecan be used with the indirect object (as in the first example), or without it (as in the second example). Because the third person indirect object pronoun is gender neutral, it is common to maintain the indirect object phrase in the sentence for clarification. Even without a Juan, le still indicates to whom the direct object (la pelota) is thrown. However, because third person indirect object pronouns do not indicate gender, this sentence could also mean: To avoid confusion, Spanish speakers will often clarify to whom a pronoun refers by using both the indirect object and the indirect object pronoun."
