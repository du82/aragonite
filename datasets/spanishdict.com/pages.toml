title = "Shopping in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "From the Centro Mayor in Bogotá to El Corte Inglés in Madrid, there are endless opportunities to shop in Spanish-speaking countries. Compra hasta hartarte(shop til you drop) with the useful words, phrases, and examples provided in this article! Generally speaking, a sales associate will approach you when you enter a store in a Spanish-speaking country. Let’s take a look at the most common questions and possible answers! If someone doesn’t approach you, don’t be afraid to ask for what you need. By asking questions, you will get out of the store faster and improve your Spanish skills in the meantime! Here’s a list of phrases you can use when approaching a sales associate in a store. Make sure to say por favor(please) and gracias(thank you)! Now let’s take a look at a snippet of dialogue between a vendedor(sales associate) and a cliente(customer). Do you generally try things on before you buy them? Study this list of vocabulary so you’re prepared to communicate with the dressing room attendant. Probarse(to try on) and quedar(to fit) are two commonly used verbs when shopping in a Spanish-speaking country. Probarse is a reflexive verb, commonly used with direct object pronouns. When reflexive and direct object pronouns are used together in a sentence, the reflexive pronoun comes before the direct object pronoun. Quedar is a verb like gustar used to talk about how things fit. It requires the use of an indirect object pronoun. To ask how much something is, use ¿Cuánto cuesta?(How much is it?) for a singular item and ¿Cuánto cuestan?(How much are they?) for a plural item."
