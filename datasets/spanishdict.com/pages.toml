["https://www.spanishdict.com/guide/short-form-adjectives-in-spanish"]
title = "Short-Form Adjectives in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Some Spanish adjectives need to be shortened when they come before a noun. The fancy term for this shortening process is apocopation. Quite a few common adjectives are shortened when they are used before a noun, especially if that noun is singular and masculine. Here's a list of some you're likely to come across. The adjective cualquiera is always shortened to cualquier when it comes before a singular masculine noun. When it comes before a singular feminine noun, cualquiera can be shortened to cualquier or left as is. Latin American speakers tend to use the shortened form, while speakers of Peninsular Spanish tend to leave the adjective in the original long form. Santois an adjective that is shortened only before certain nouns. It is not shortened with names that begin with Do- or To- or when it precedes a common noun. The adjective ciento(one hundred) becomes cienbefore a noun when it means exactly one hundred. You'll also see the shortened form used before numerals like mil(thousand) and millón(million)."
