["https://www.spanishdict.com/guide/expressions-with-comer"]
title = 'Expressions with "Comer" | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Everyone likes talking about food, so it comes as no surprise that the verb comeris one of the most commonly used verbs in Spanish. Comer generally means to eat, but in some expressions it can take on a different meaning. The pronominal se is added to comer when the speaker wants to emphasize the quantity of food eaten. The difference between comer and comerse is subtle and doesn’t change the meaning of the verb. When you want to talk about providing someone or something with food, we use the phrase dar de comer. This phrase is often used with an indirect object pronoun, which is placed in front of the conjugated form of dar. Typically the verb almorzaris used to express to have for lunch or to have lunch. In Mexico and Spain, comer can be used instead. Similarly, it is common in Latin America to use comer instead of cenara to express to have for dinner or to have dinner. To say you already ate in Spanish, you can conjugate comer in the preterite or present perfect and add ya. The present perfect is more common in Spain than in Latin America."
