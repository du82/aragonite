["https://www.spanishdict.com/guide/how-to-make-mexican-tacos"]
title = "How to Make Mexican Tacos | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Wanna taco 'bout how to make authentic Mexican tacos? Live every day like it's Taco Tuesday and try out these seven types of tacos! Save that pound of carne molida(ground beef) in your freezer for burgers! Authentic Mexican tacos are made with many types of meats, such as pork shoulder, steak, chicken, and even cabeza de res(cow head)! Tacos are not typically prepared with ground beef. Here is a list of seven of the most popular varieties of tacos in Mexico, accompanied by the cut of meat you should buy at the grocery store. Taco walk on the wild side and make grasshopper tacos! Tacos de chapulinesare popular in Oaxaca, a state in southern Mexico. The key to juicy, flavorful Mexican tacos is a marinade that has a perfect balance of citrus and spice. You’ll need a blender to make most marinades for Mexican tacos. The ingredients for the marinade vary depending on the type of taco, but it typically consists of a combination of several of the following ingredients: The meat will take on more flavor the longer you marinate it, so plan to leave the meat in the marinade for several hours—or even overnight. In Mexican culture, there are a variety of traditional ways to cook meat for tacos. Many are impractical for the average taco maker, so we’ve included alternatives! To get perfectly tender carnitas meat, use a slow cooker. For delicious longaniza or tinga tacos, a simple stovetop method works fine! Mexican tacos are traditionally served on fresh, handmade tortillas de maíz. If you’re not in Mexico, where there is a tortillería(tortilla shop) on every street corner, go to your local Hispanic grocery store. For an authentic taste, stay away from the bland, dry, pre-packaged supermarket tortillas. To heat the tortillas, put a griddle on medium heat and cook the tortillas for 30 seconds on each side. There is no need to add any oil or butter. If your idea of a perfect taco includes crema agria(sour cream) and a copious amount of queso cheddar(cheddar cheese), just stick to American tacos. When it comes to authentic Mexican tacos, simplicity is key."
