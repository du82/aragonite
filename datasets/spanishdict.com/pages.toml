["https://www.spanishdict.com/guide/future-tenses-"]
title = "Future Tenses | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "In Spanish, there are four main ways to talk about a future action. In addition to the four ways listed below, the future subjunctive and future perfect subjunctive are also used, but their use is rare in modern Spanish. However, they are useful tenses to be able to recognize. This guide serves as an overview of the Spanish future tenses. For more information on each future tense, click on the links provided. The Spanish simple future (el futuro simple) is used to talk about what will or shall happen, often without indicating a specific point in time. Let’s review how to conjugate the simple future tense. The same endings are used for all verbs, regardless of whether the verb ends in -ar, -er, or -ir. When using the simple future tense, we mustn't forget about the irregulars! These verbs use the same endings as the regular verbs, but they have different stems. Check out the table below. The informal future uses a combination of a conjugated form of irin the present indicative, the preposition a, and an infinitive. It is used to express events in the immediate future and for set plans. The Spanish future perfect indicative (el futuro compuesto) is used to talk about something that will have been completed at a certain point in the future. It is formed by using a combination of the simple future of the verb haberwith a past participle. The Spanish future progressive tense is used to talk about something that will be happening at some point in the future. The future progressive is formed using the verb estarin the simple future in combination with a present participle."
