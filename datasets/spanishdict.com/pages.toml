["https://www.spanishdict.com/guide/spanish-exclamatory-words-and-expressions"]
title = "Spanish Exclamatory Words and Expressions | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "One of the easiest ways to convey a very strong feeling or opinion about something is to use an exclamatory word or expression. Many exclamatory words are very similar to interrogative words, but instead of asking a question, they state an idea or opinion. Exclamatory words can make a simple phrase into a statement of surprise, anger, pain, etc. Which exclamatory word you use in Spanish will depend on what you want to say and the type of word that comes after the exclamatory word. Below you'll find some handy tips and examples to help make you an exclamatory master. Although many of these equate to how or what in English, in colloquial language they are more often translated using so or really. Cuánis used before phrases that begin with an adjective or adverb and are followed by a verb phrase. It means how. Cuánis mostly used in literary works and is not commonly heard in speech. You're much more likely to hear qué in everyday Spanish. To modify a noun, cuánto must match the noun it precedes in gender and number. To modify a verb, the masculine singular form (cuánto) is always used."
