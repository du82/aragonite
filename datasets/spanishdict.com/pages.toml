full_description = "We know learning the subjunctive can be hard. ¡No te rindas!(Don’t give up!) Learning subjunctive trigger words (words that require the use of the subjunctive) will make knowing when to use the subjunctive mood more manageable! It’s a good idea to study these subjunctive trigger words alongside the uses of the subjunctive. The easiest way to learn the uses of the subjunctive is with the acronym WEIRDO, which stands for Wishes, Emotions, Impersonal Expressions, Recommendations, Doubt/Denial, and Ojalá. These are all situations in which you're likely to use the subjunctive. The trigger words listed are all in the present tense yoform. For more information on how to use these trigger words in different forms and tenses, check out the last paragraph of this article! Since how a person feels is always subjective, you use the subjunctive. Take a look at this list of emotions that require the use of the subjunctive. When a person recommends, suggests, wants, or asks another person to do (or not do) something, the subjunctive is used. The following verbs are commonly used to give recommendations or to request something. Expressions of doubt and denial tend to trigger use of the subjunctive. Here's a list of phrases that are commonly used to express doubt: Ojalá(I hope/I wish/hopefully/if only) triggers the use of the subjunctive. Ojalá is often used with the conjunction que. In addition to the WEIRDO subjunctive triggers, there are many adverb clauses in Spanish that trigger the use of the subjunctive. Here's a list: Most of the subjunctive triggers listed can be changed to a different tense and form. You can change the verbs to the past tense, but then you will need to make sure to use the imperfect subjunctive instead of the present subjunctive."
