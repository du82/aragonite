["https://spanishdict.com/guide/how-to-talk-about-chores-in-spanish"]
title = "How to Talk About Chores in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "We know quehaceres(chores) can be a bore. Let's add a little sabor(spice) to your daily routine by learning how to talk about your chores in Spanish! El quehacerisn't the only way to say chore in Spanish. Here is a list of other words you can use to talk about your chores! Now that we’ve covered how to talk about the most common household chores, let’s talk artículos del hogar(household supplies) and equipo(equipment). Did that list just inspire you to do your chores? ¡Probablemente no!(Probably not!) Let’s learn how to tell someone else to do the housework! To tell a friend, child, or family member the same age as you or younger to do something, use the third-person singular form of the present indicative.There are a select few verbs that do not follow this pattern; for example, hazis the túform command of hacer, and ponis the tú form command of poner. To tell a group of people (formally or informally) to do a chore in Latin America, use the third-person plural form of the present subjunctive. In Spain, replace the ‐r at the end of the infinitive with a ‐d when telling a group of people to do a chore in informal situations. There are many effortless ways to learn Spanish that you can try out while doing your mundane quehaceres."
