["https://www.spanishdict.com/guide/what-does-oye-como-va-mean-in-english"]
title = 'What Does "Oye Cómo Va" Mean in English? | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Oye cómo vais the beginning of a line from the song Oye Cómo Va by Latin jazz great Tito Puente. It literally translates to listen to how and is really just the beginning of a few lines that make up the song's chorus. In the song, the singer pauses between oye cómo va (listen to how) and mi ritmo (my rhythm goes). Mulata: The word mulata is a loaded term that is best to avoid. According to the Real Academia Española’s (Royal Spanish Academy) definition, the word comes from muloor mule. In fact, in English, the term mulatto is listed as “usually offensive” by the Merriam-Webster dictionary. But what about Spanish? Why did Tito Puente use it in his song? The term mulata may be used to mean something like “attractive woman” in some parts of the Spanish-speaking world. That being said, should you adopt the term and use it yourself? We’d suggest not. Unless you are of mixed heritage or ethnicity yourself, it’s best to avoid the term in Spanish (and especially English!) entirely. A much better term to use is Afro-Latino or afrodescendiente. The website HipLATINA has a great article on the reclamation of the word mulata by some Latinas. Tito Puente was a musician known as, nada más y nada menos que(none other than) the “King of Latin Jazz.” His obituary in The Guardian referred to him as the “greatest ambassador for Latin music in the 20th century.” He was born to parents of Puerto Rican origin in New York City, and grew up in Spanish Harlem. As a child, he learned to play various instruments. After serving in World War II, he studied composition at the Juilliard School in New York. Soon after leaving the Juilliard School, Puente found fame playing in New York. Tito Puente was an engaging performer who understood the importance of giving the audience a performance and not just coldly playing on stage. If you see videos of his live performances, you can see how he interacted with the audience while both playing los timbales y el cencerro(timbales and the cowbell) and singing!"
