["https://spanishdict.com/guide/how-to-pronounce-b-and-v-in-spanish"]
title = 'How to Pronounce "B" and "V" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Most Spanish speakers pronounce the letters b and v the same way: much like the b in the English word book. It's important to note that the pronunciation of the letters b and v is slightly different depending on their position in a word. Native speakers of Spanish pronounce these two letters: Compare the pronunciations of bota and robo to appreciate the difference between the pronunciation of b at the beginning of a word and b between vowels. Note that the letter v in Spanish words is never followed by a consonant. Note also that very few words end in b or v; they’re mostly loan words, that is, words that come from languages other than Spanish, such as kebab(kebab), hiyab(hijab), or molotov(Molotov). You may be wondering why Spanish needs two letters that are pronounced the same way. Well, you can blame it on Latin! Let’s get into a little bit of historical linguistics...the letters b and v did have different sounds in Latin, the language spoken by the ancient Romans that Spanish comes from. Early Spanish maintained the pronunciation difference from Latin, but lost it at some point on its linguistic journey to the Spanish spoken today. Although the written letters b and v remained in the language, speakers no longer distinguish between them in spoken Spanish. This makes it hard to predict how a Spanish word with this sound is written, but there are a few spelling tips you can follow. Read on for more!"
