["https://spanishdict.com/guide/spanish-imperfect-tense-forms"]
title = "Spanish Imperfect Tense | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish imperfect tense (el pretérito imperfectoo copretérito) is used to describe past habitual actions or to talk about what someone was doing when they were interrupted by something else. There are only two sets of endings for regular imperfect verbs in Spanish, one for -ar verbs and one for both -er and -ir verbs. To conjugate a regular verb in the imperfect tense in Spanish, simply remove the infinitive ending (-ar, -er, or -ir) and add the imperfect ending that matches the subject. There are only three verbs with irregular conjugations in the imperfect: ir, ser, and ver. Here they are! In general, the imperfect is used to talk about past actions, conditions, or events that occurred habitually or repeatedly or that were in progress at a point in the past. It is also used to tell time, talk about dates, give a person's age, and describe characteristics, conditions, and feelings in the past. Read on for more about these uses of the imperfect. Habitual or repeated actions are those that were done over and over in the past. These are often things a person used to or would do. It's quite common to see the imperfect used to talk about something that was happening when something else occurred. It's also used for actions that continued in the past for an unspecified period of time. When talking about a past action in progress that was interrupted, the action in progress is in the imperfect, while the interrupting action is in the preterite. For more on the differences between the preterite and the imperfect, check out this article! The imperfect is used to give descriptions in the past, especially those that set the scene in terms of the senses."
year_published = 2025
