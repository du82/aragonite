["https://www.spanishdict.com/guide/masculine-and-feminine-nouns"]
title = "Masculine and feminine nouns in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "All Spanish nouns (sustantivos), including people, places, animals, things, ideas, and feelings, have a gender (male or female). The fact that inanimate objects have a gender in Spanish does not mean that things like tables and books are physically feminine or masculine. They have genders in a grammatical sense and must be used with articles and adjectives that match their gender. Most masculine nouns end in o. An o ending can indicate that a person or animal is male or that an object, idea, etc. is grammatically masculine. Most feminine nouns end in a. Ending in an a indicates that a person or animal is female or that an object, idea, etc. is grammatically feminine. Spanish adjectives must match the nouns they describe in both gender and number. For example, apples (manzanas) are feminine in Spanish, so this word must be used with feminine articles like la, las, and una. Any adjective used to describe an apple in Spanish must also be feminine (for example roja). On the other hand, bananas (plátanos) are masculine, and must be used with masculine articles and adjectives."
