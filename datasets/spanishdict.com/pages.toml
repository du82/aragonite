full_description = "There are many different types of commands in Spanish, including affirmative tú commands, formal commands, nosotros commands, indirect commands, and negative túcommands. We'll take a look at negative tú commands in this article. ¡No te espantes!(Don't freak out!) These command forms aren't too tricky. Negative informal commands, also called negative tú commands, are used to tell a friend, family member the same age as you or younger, classmate, child, or pet not to do something. Always make sure you put noor another negative word like nunca(never) in front of the verb when forming a negative informal command. The negative informal imperative, yet another term used to describe negative tú commands, is formed differently than the affirmative informal imperative. It is actually formed much like the negative formal imperative in that it uses the present subjunctive form of the verb. If you already know the formal command forms, you can simply add an s to the end of the formal command to form a negative informal command. If a verb is irregular in the present subjunctive, its negative informal command form maintains the same irregularity. In negative informal commands, the pronoun goes between the negative word (like no or nunca) and the verb."
