["https://www.spanishdict.com/guide/how-to-sound-like-a-local-in-chile"]
title = "How to Sound like a Local in Chile | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Planning a trip to Chile? As you pack your bags and prepare to take in the sights, people, and culture of this amazing country, be sure to consult this list of common slang words and phrases! You’ll be partying with the locals in no time! You'll probably hear this at the end of every other sentence. It's used informally to engage in conversation, in the same way that you know is used in English. When in Chile, you’ll inevitably hear the locals refer to their boyfriend or girlfriend as pololoor polola. And be careful when using novioor novia; Chileans still use these words, but they're typically used to refer to one's fiancé or fiancée. Literally meaning at the shot, the phrase al tiromeans that something is happening or is going to happen at this exact moment. Make sure you reserve this phrase to describe events that are literally about to unfold, or for yourself if you are in a rush and are about to quickly go from one place to another. The word flaitecan be used to describe dark alleys, abandoned houses, creepy white vans—you get the idea. You can even use flaite as a noun to describe a person who looks very shady or unsophisticated. As opposed to a normal fiesta, Chileans use the word carreteto refer specifically to a party that serves alcohol. In the same context, you might hear your friends say salir de carreteor carretearto mean that they are going out to party. In the phrase, ¡Sí, po!, po is an expression that comes from the word pues, meaning well, as in, well, of course! While traveling around Chile, you'll likely hear po—such as in ¡sí, po! or ¡no, po!—just as much as you'll hear cachai. ¡Qué lata!is a phrase that’s used to describe something lame, boring, or dreadful. You can say it to a friend when she or he can’t go out, or you might hear children say it when their parents make them pose for yet another photo. Though this phrase literally means good wave, it’s used to describe people that you like. You can say that someone is buena onda, implying that she or he is likable, or you can say that you have a buena onda with someone. Good vibes, good people. Why would you ever leave Chile?"
