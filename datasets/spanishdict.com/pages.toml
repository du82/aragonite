full_description = "The subjunctive (el subjuntivo) is one of three moods in Spanish, and it is often used to talk about wishes and desires. Many of the verbs and phrases that require the subjunctive fit into the acronym WEIRDO: Wishes, Emotions, Impersonal expressions, Recommendations, Doubt/Denial, and Ojalá. In this article, we're going to take a look at wishes. Wishing, wanting, demanding, desiring, expecting, ordering, and preferring all fall into the category of wishes. Additionally, mentioning the nonexistence or indefiniteness of something that is desired falls into this category. The following verbs are commonly used to express a wish or desire and, when used as the verb in the main clause of a sentence, will indicate that the following verb in the dependent clause will be in the subjunctive. Check out these examples. Note that they all use one of the above wishing verbs in conjunction with the word que."
