["http://www.spanishdict.com/guide/formal-affirmative-and-negative-commands"]
title = "Formal Affirmative and Negative Commands in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "There are many different types of Spanish commands, including tú commands, nosotros commands, indirect commands, and formal commands, which we'll cover in this article. Formal commands are often used when addressing a person you don't know well, a person older than you, or a person to whom you want to show deference or respect (like a boss or teacher). In countries other than Spain, you can also use these commands to address any group of people, regardless of age or social standing. This is because ustedes is used for both the formal and informal plural in Latin America. All Ud. (usted) and Uds. (ustedes) commands are the same as the Ud. and Uds. present subjunctive forms. Pronouns are attached to the end of affirmative commands. If the command form of the verb has more than one syllable, a written accent is added when attaching a pronoun. Negative formal commands couldn’t be easier. All you have to do is put a negative word such as noin front of the affirmative formal command, and you've got yourself a negative formal command. Pronouns come between the negative word (such as no) and the command form in negative formal commands."
