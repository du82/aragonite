full_description = "Reciprocal verbs are a type of pronominal verb used to talk about actions that people do to each other. Reciprocal verbs are formed by the combination of a verb and a reciprocal pronoun. Since reciprocal actions always involve two or more people, only plural pronouns are considered reciprocal. A list of these pronouns is given in the table below. Sentences with reciprocal actions sometimes look just like sentences with reflexive actions. To differentiate a reflexive action from a reciprocal action, the use of expressions such as uno al otro, uno a otro, mutuamente, recíprocamente, entre sí, etc. can be added to a phrase to show the subjects are performing the action on each other. All these expressions can be roughly translated as each other, one another or mutually."
