["https://spanishdict.com/guide/numbers-in-spanish-0-100"]
title = "Spanish Numbers (0-100) | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Just like in English, Spanish cardinal numbers (números cardinales) can be both nouns and adjectives. But before we get into that, let's learn how to say the numbers in Spanish from 0 to 100 (los números de cero a cien). Cardinal numbers denote quantity, as opposed to order. To talk about order, you can use ordinal numbers. The numbers from 21 to 29 use a combination of veinti- and a number from 1-9 (with no space in between). Forming the numbers from 31 to 99 is a cinch. You just use a multiple of 10 plus the conjunction y and a number from 1 to 9. Here are some examples. Besides being used to simply count, cardinal numbers are used in Spanish to tell the time and talk about dates and age. To tell the time in Spanish, you use the verb ser, a feminine definite article (la or las), and a cardinal number. To talk about the first of the month, you use the ordinal number primero(first) instead of the cardinal number uno. As mentioned before, cardinal numbers can be both nouns and adjectives. When a cardinal number is used as an adjective, it doesn't change to match the gender or number of the noun it modifies except in the cases of uno and cien. Uno becomes unwhen used to describe masculine nouns and unawhen used to describe feminine nouns. Numbers ending in uno (veintiuno, treinta y uno, etc.) also undergo these changes."
