full_description = "Most Spanish language learners want to pull their hair out when deciding whether to use seror estar. Like por and para, ser and estar can be very tricky for learners. Ser and estar both mean to be and are used frequently in daily Spanish communication. While it can be confusing, we have some quick tips that will alleviate your headache and make you more confident when differentiating between these two tricky verbs. This first tip is the guiding rule for figuring out when to use ser and estar. As you may already know, the main difference between ser and estar is that ser refers to more permanent traits of someone or something, while estar refers to transient conditions. Check out the difference in the following two examples: In this first example, notice how we use ser for descriptions that are physical traits, which should not, under normal circumstances, change. In the second example, we used estar with the adjective confundidabecause Sandra’s confusion is a non-permanent condition; today, Sandra is confused while finding her way to the restaurant, but she may not still be confused tomorrow. When we use ser to describe the qualities or characteristics of a person, place, or thing, the meaning behind those descriptions is disassociated from time or duration. However, when we use estar to describe the same attributes, they become associated with the short period of time in which the speaker is using them. Let’s look at some examples where the context can switch when we use these two different verbs: In the example above, the speaker is equating his or her girlfriend with being beautiful. The description of beauty exists outside of any parameters of time. In the second example, the speaker uses estar to highlight that the person that she or he is referring to in the sentence is especially beautiful while she is wearing the wedding dress. Estar is usually used to describe where a person or thing is physically located. Although an event takes place at a physical location, when speaking about events occurring at a specific point in time, you should use ser. If the meaning of the verb is to be held or to take place, make sure you use ser. Let’s take a look at a couple of examples:"
