["https://www.spanishdict.com/guide/subjunctive-vs-indicative-in-spanish"]
title = "Subjunctive vs. Indicative in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''The subjunctive (el subjuntivo) is one of three moods in Spanish. The other two Spanish moods are the indicative and the imperative. Grammatical mood reflects a speaker's attitude toward a statement. As stated above, Spanish has three moods: subjunctive, the indicative, and the imperative. Grammatical tense refers to when an action takes place. Spanish has three tenses: the past, the present, and the future. The indicative is used to talk about things that are objective and/or certain. This includes things like facts, descriptions, and scheduled events. The subjunctive is used to talk about things that are subjective and/or possible, but not certain. This includes things like doubts, wishes, recommendations, unknowns, and opinions about the likelihood of other events occurring. Take a look at the following sets of examples and ask yourself why each one uses either the indicative or the subjunctive. (Hint: if the sentence has two verbs, concentrate on the second verb). Don't worry if you're stumped; you'll find the answers below. Did you notice the repetition of the phrase "from the speaker's viewpoint" above? This is key to understanding a very important point: "indicative" does not mean "true." As long as a speaker feels that what they're saying is true, the indicative can be used. This does not, however, mean that what they're saying is actually true. The above statement is not true, but the speaker believes it is, so the second verb is in the indicative. There are three main features that most sentences that use the subjunctive share: two subjects, two verbs, and a relative pronoun. Most subjunctive sentences will have one subject in the main clause and one in the secondary clause. The attitude of the subject in the main clause is what triggers the use of the subjunctive in the secondary clause. Most subjunctive sentences have two verbs: a verb in the indicative in the main clause and a verb in the subjunctive in the secondary clause. Most subjunctive sentences have a relative pronoun (such as que or quien) that links the main (indicative) clause to the secondary (subjunctive) clause.'''
