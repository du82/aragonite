["https://www.spanishdict.com/guide/spanish-punctuation"]
title = "Spanish Punctuation | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Spanish and English use the same punctuation for many things. For example, both use periods at the end of statements and commas to separate elements in a list. There are also some punctuation marks used only in Spanish, as well as some punctuation marks that English and Spanish use differently. In Spanish, final punctuation falls outside of quotations, whereas in American English, it falls inside the quotations. The Spanish style can sometimes lead to what would be considered double punctuation in English (like the . following the ? in the example above). In Spanish, this is correct! Although often omitted in texts and emails, Spanish exclamations should open with a signo de apertura de exclamación (opening exclamation mark). Note how the opening exclamation mark goes just before the part of a sentence that is the actual exclamation. Although often omitted in texts and emails, Spanish questions should open with a signo de apertura de interrogación (opening question mark). Note how the opening question mark goes just before the question tag or the part of a sentence that is the actual question."
