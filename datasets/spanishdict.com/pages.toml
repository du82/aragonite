["https://www.spanishdict.com/guide/spanish-future-subjunctive"]
title = "Spanish Future Subjunctive | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The subjunctive is one of the three moods in Spanish, the other two being the indicative (actions, events, facts) and the imperative (commands). You can find more on the differences between the subjunctive and the indicative here! The future subjunctive (el futuro del subjuntivo) is rarely used in modern Spanish. Instead, the present subjunctive is used in virtually all cases in which the future subjunctive would have been used historically. Nonetheless, the future subjunctive does still appear in modern times, primarily in legal documents and literary contexts, as well as a few classic refranes(proverbs), so it’s good to be able to recognize it. The stem for the future subjunctive is the same as that of the imperfect subjunctive, or the third person plural of the preterite (without the -ron at the end). Any verb that is irregular in the third person plural of the preterite will maintain that irregularity in the future subjunctive. (Ex. tener)"
year_published = 2025
