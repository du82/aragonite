["https://spanishdict.com/guide/how-to-pronounce-q-and-c-in-spanish"]
title = 'How to Pronounce "Q" and "C" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = 'The letter q represents the Spanish consonant sound, or phoneme, /k/. When a consonant sound is uttered, the flow of air out of the mouth is partially or completely blocked at some point. Note that the sound /k/ in Spanish is not only represented by the letter q, but also by the letter c and the letter k. The sound of the Spanish q is velar, which means it is pronounced by pressing the back of the tongue against the soft palate to stop the flow of air completely for an instant. Then the air is let out abruptly. Additionally, the vocal cords do not vibrate when uttering q, so linguists classify it as voiceless, or sordain Spanish. Yes, it’s almost identical in sound, but without any trace of aspiration. Compare the sound of the q in the English word quiche and the sound of q (remember the u is silent) in its Spanish translation quiche. Let’s look at some examples of words containing the letter q in different word positions and letter combinations. The first table shows the most common use of q, in which the letter is followed by a silent u. The second table shows the least common uses, in which the letter is followed by a non-silent u or by other vowels. The pronunciation of the letter q is practically the same throughout the Spanish-speaking world, so there shouldn’t be much difference between the way roosters go quiquiriquí(cock-a-doodle-doo) in El Salvador, Bolivia, or Spain. The letter c represents the Spanish consonant sounds, or phonemes, /k/, /s/, and /θ/. When a consonant sound is uttered, the flow of air out of the mouth is partially or completely blocked at some point. The first way to pronounce "c" in Spanish is like the English c in car or the k in kangaroo, but without any trace of aspiration. For example, you can hear this sound in the Spanish translations of car and kangaroo: carroand canguro. This sound of the Spanish c is velar, which means it is pronounced by pressing the back of the tongue against the soft palate to stop the flow of air completely for an instant. Then the air is let out abruptly.'
