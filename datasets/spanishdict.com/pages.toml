full_description = '''Curious about the meaning of the lyrics to the saucy earworm Dame tu cosita in English? Read on to find out more! Though the literal translation of the word "cosita" is innocent enough (it means "little thing"), the chorus of this ditty is dripping with sexual innuendo. Just like the "it" in the English translation given above, "cosita" most likely refers to someone's genitalia, so this song isn't really one for the kids. The popularity of "Dame tu cosita" skyrocketed after a video of a green alien dancing to the song began making the rounds online. People began challenging each other to imitate the alien's smooth moves, and the cultural cachet of "Dame tu cosita" was cemented. This isn't the first time El Chombo, the Panamanian artist responsible for "Dame tu cosita," has ventured into earworm territory. His songs "Chacarrón" and "El gato volador" are just as catchy, so check them out if you're looking for another fun tune in Spanish! El Chombo. (2001). Dame tu cosita. Retrieved from: https://genius.com/El-chombo-dame-tu-cosita-lyrics'''
