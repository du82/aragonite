["https://spanishdict.com/guide/past-perfect-subjunctive-forms"]
title = "Past Perfect Subjunctive in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The past perfect subjunctive, or pluperfect subjunctive (el pluscuamperfecto de subjuntivo), is used to talk about hypothetical situations in the past, past conditionals, and past actions that preceded other past actions. The past perfect subjunctive is formed with the imperfect subjunctive of the verb haberand a past participle. The imperfect subjunctive of haber can be conjugated in two different ways. Both are correct, though use of the first, whose yoform is hubiera, is more widespread. The past perfect subjunctive is commonly used to talk about past hypotheticals, conditionals, and past actions preceding other past actions. The past perfect subjunctive is commonly used to talk about hypothetical situations, especially those relating to regrets or hindsight. The past perfect subjunctive is used along with the conditional perfect to talk about conditionals in the past. The past perfect is used along with the simple past or imperfect to talk about a past action that preceded a second past action. Whichever of these events is the furthest back in the past is talked about with the past perfect subjunctive."
