["https://spanishdict.com/guide/travel-guide-peru"]
title = "Travel Guide: Peru | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "In this article, we'll explore five top destinations that you simply can't miss in Perú(Peru). So, let’s get right to it and start our Peruvian adventure! You can begin your journey in Lima(Lima), the bustling capital of Perú. Lima is renowned for its vibrant food scene, earning it the well-deserved title of capital gastronómica de Sudamérica(culinary capital of South America). All around the city you can sample delicious Peruvian dishes like ceviche(ceviche), lomo saltado(stir-fried loin), and causa(causa) in some of Lima's world-class restaurants. Peruvians are serious foodies, so it's no wonder that the country's most iconic dish, ceviche, has its own national day on June 28. If you feel like joining in the celebrations next time the date comes around, check out our article on how to make the perfect ceviche! You can start your tour of Lima in the city’s old town, known as the Centro Histórico(Historic Center). Here, you'll find colonial-era architecture, including the stunning plaza Mayor de Lima(Plaza Mayor de Lima) and the imposing Catedral de Lima(Lima Metropolitan Cathedral), where the remains of Francisco Pizarro(Francisco Pizarro) lie. You can also visit the Basílica y Convento de San Francisco de Lima(Basilica and Convent of San Francisco of Lima) to explore its eerie catacumbas(catacombs) filled with ancient bones. In the Barranco(Barranco) district, a charming area full of colorful houses and a lively nightlife, you can visit the Puente de los Suspiros(Bridge of Sighs). Next, you can head to Miraflores(Miraflores), an upscale district in the heart of the city. It's a real pleasure to stroll along the scenic malecón de Miraflores(Malecon of Miraflores) and visit the Parque del Amor(Love Park), a public park inspired by Antoni Gaudí’s Park Güell in Barcelona. While you’re there, you can take a selfie in front of El Beso(The Kiss), the famous statue that oversees the park. Before you leave Miraflores, it's worth paying a visit to Huaca Pucllana(Huaca Pucllana), an ancient adobe pyramid right in the middle of the district (There’s a very good restaurant next to the ruins too!)."
