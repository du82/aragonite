["http://www.spanishdict.com/guide/por-vs-para"]
title = "Por vs Para | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Learning the differences between porand parais often quite challenging, and with good reason. In Spanish, both por and para take on the responsibilities of not only for, but also by, on, through, because of, in exchange for, in order to, and several other prepositions and phrases. Por suerte(luckily), we've got a whole series on this tricky pair, so get ready to master the differences between por and para! Por is used to talk about movement, modes and means of travel and communication, exchanges, duration, and motivation, among other things. Let's take a closer look at some examples of these common uses of por. Por can be used to talk about the way you travel or communicate. This can refer to mode of travel (car, train, etc.) or communication (email, phone, etc.) or even the route you take. Para is used to talk about destinations, recipients, deadlines, and goals. Check out the following examples of these common uses of para. Para is used to talk about goals and purposes. It's especially common to see para used with an infinitive to talk about why something is done. There are also many expressions that are used with por and para. Some very common examples are shown in the table below."
