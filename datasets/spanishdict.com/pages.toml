["https://spanishdict.com/guide/direct-and-indirect-object-pronouns-in-spanish"]
title = "Direct and Indirect Object Pronouns in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Spanish direct object pronouns (pronombres de objeto directo), such as lo, and Spanish indirect object pronouns (pronombres de objeto indirecto), such as le, are used in place of nominal direct and indirect objects. There are a few important rules that must be followed when using direct object pronouns and indirect object pronouns together. When direct and indirect object pronouns are used together in a sentence, the indirect object pronoun comes before the direct object pronoun. Notice that when object pronouns are attached to a verb, it's often necessary to add an accent in order to preserve the natural stress of the verb. The indirect object pronouns le and les change to se when followed by the direct object pronouns lo, la, los and las. When a sentence with object pronouns is negative, the negative word (for example, noor nunca) directly precedes any object pronouns."
