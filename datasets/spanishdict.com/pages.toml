["https://www.spanishdict.com/guide/descriptive-adjectives-in-spanish"]
title = "Spanish Adjectives - Descriptive | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "In Spanish, adjectives must agree with the noun (or pronoun) they describe in gender and in number. This means that if the noun an adjective describes is feminine, the adjective must be feminine, and if that same noun is also plural, the adjective will be feminine AND plural as well. For example, the noun las faldas(the skirts) is plural and feminine, so any adjectives used to describe it must also be plural and feminine. For example: Spanish adjectives are usually listed in their masculine singular form in dictionaries, so it is important to know how to match these masculine singular adjectives to whatever noun you happen to be describing. Most adjectives end in o, e, or a consonant in their singular masculine forms. Below you will find the rules for matching these adjectives to their respective nouns in gender and number. Adjectives that end in o in the masculine singular form have four possible endings, one each for masculine, feminine, singular, and plural. These types of adjectives make up the majority of adjectives in Spanish. Adjectives that end in e or -ista do not change according to gender. They agree with both masculine and feminine nouns in the singular form, though they do change for number. Most adjectives that end in a consonant do not change according to gender, but do change for number, just like adjectives that end in -e. Exception: For adjectives that end in z in the singular, change the z to a c before adding the plural ending. Exception: Adjectives that end in -or, -ón, or -ín do have feminine forms. Simply add a or -as to the masculine singular form and delete the written accent if necessary."
