["https://www.spanishdict.com/guide/visit-panama-city"]
title = "Visit Panama City | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The small isthmus nation of Panamá (Panama) is often referred to as “el centro del mundo, corazón del universo” (center of the world, heart of the universe). Its capital, Ciudad de Panamá (Panama City), offers stunning natural landscapes, a rich cultural scene, and a vibrant urban life. Let’s tour some of its must-see places and discover what makes it so special! Our first stop is Panamá Viejo (Old Panama), where the ruins of the first Spanish settlement on the Pacific coast still stand. Once a bustling city, Panamá Viejo was sacked by the notorious Welsh pirate Henry Morgan in 1671. The fire that followed destroyed much of the city, and the site never recovered. Today, visitors can wander around the ruins and marvel at the contrast between the old city and the modern city that surrounds it. Amidst the remnants of convents, houses, and other structures rises the iconic Torre de la Catedral (Cathedral Tower)—a lone sentinel that survived the centuries. While Henry Morgan’s sack of Panama Viejo was the most successful pirate raid on the city, it was by no means the only one. Seventy years earlier, another famous privateer—Sir Francis Drake—led a daring raid on the town of Nombre de Dios (literally God’s Name) on the Caribbean coast, with the ultimate aim of launching a land attack on Panama City. Drake’s attack failed, and he died of dysentery shortly thereafter. Upon his death, El Draque (The Dragon), as he was known by the Spanish, was dressed in full armor, placed in a lead coffin, and buried at sea off the coast of the port city of Portobelo (Portobelo). Despite multiple attempts, Drake’s coffin has never been found, and the search for the corsair’s final resting place continues to captivate treasure hunters and maritime archaeologists alike! A few years after Morgan destroyed the original settlement, the city was moved to what is now Casco Viejo or Casco Antiguo (Old Quarter), the historic district of Panama City. A Patrimonio de la Humanidad de la UNESCO (UNESCO World Heritage Site), the district is a treasure trove of colonial architecture, colorful streets, and cultural charm. Stroll through cobblestone streets lined with pastel-hued buildings, boutique shops, and charming cafes. The diverse architectural styles you’ll encounter, from colonial español (Spanish Colonial) to neoclásico (Neoclassical) and art déco (Art Deco), reveal the layers of the city's history."
