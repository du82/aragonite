["https://spanishdict.com/guide/guide-to-arepas"]
title = "Guide to Arepas | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Arepas(arepas or corn cakes) hold a special place in both Colombian and Venezuelan cuisines. These delicious cornmeal cakes have deep cultural roots in both countries, and regional varieties can be found in nearly every city. Some arepas are savory and some are sweet; some are plain and some come stuffed with all kinds of delicious rellenos (fillings). Antojado? (Have a craving?) Great! Let’s explore the main things you should know about arepas! An arepa is a flat, round cake made from harina de maíz (cornmeal). It’s a pre-Columbian dish that originated in the region of what is now Colombia and Venezuela. The word arepa is thought to have come from erepa, an indigenous term for corn or cornbread. Nowadays, arepas are typically made by mixing pre-cooked cornmeal with water, a pinch of salt, and often some other ingredient to form a smooth dough, which is then shaped into flat, round discs similar to pancakes. The cakes are then cooked on a plancha (griddle) or sartén (pan) until they develop a crispy crust on the outside and a soft and fluffy inside. Depending on the region and the specific recipe, arepas can also be fritas (fried) or horneadas (baked). Arepas are an iconic dish in Colombia and Venezuela, to the point of being símbolos culturales (cultural symbols) in both countries. They are sold at restaurants, corner stores, mercados (markets), carritos de comida (food trucks), and by street vendors all over the region. Is it 3 pm. and time for an afternoon snack? Great! Arepas are not just reserved for a particular meal. You can have them for breakfast or dinner, with an afternoon coffee, as a side or as a main meal. Some people often have them as a late-night snack! Now that you know what arepas are and where to find them, let’s go over some basic vocabulary so you can order them like a local! There are many regional varieties of arepas! Each country and even specific areas have their own unique spin on this beloved dish, with distinct fillings and preparation methods."
