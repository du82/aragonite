description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "As the name implies, Spanish demonstrative adjectives demonstrate a quality about the noun they modify. In this case, that quality is the location in respect to the speaker or the listener. Spanish demonstrative adjectives can be translated as this, that, these, or those. Spanish has three sets of demonstrative adjectives, each of which has four different forms that vary by gender and number. Este is used to describe a noun that is close to the speaker and listener. It is normally used to talk about something within reaching distance of the speaker. Ese is used to point out nouns that are further from the speaker and not easily within reach. The noun may be close to the listener, but not the speaker."
