full_description = "¡Hola!(Hello!) Do you want to communicate en español(in Spanish) on your first day of school? Talking to your compañeros(classmates) about your clases(classes) and your profesores(teachers) is a great way to start! This article will help you master the main phrases that you will need on your first day of school! Let's start off with the vocabulary words in this skill! First, let's look at the different classes you may take at school. Just like in English, words like Música (Music) and Historia (History) are capitalized in Spanish when they refer to the name of a class. When they're used in general, they are not capitalized. Let's look at the words related to material escolar(school supplies) that you will need on your first day of school. Finally, let's look at some more words that will definitely come in handy once you start interacting at school. Short-form possessive adjectives are the most common way to express possession in Spanish. They must agree with the noun they describe in gender and number. This doesn't end up being too complicated, because only nosotrosand vosotroshave distinct masculine and feminine forms. You can use the verb ser(to be) to talk about your teachers, classes, and classmates. Let's review the present tense conjugation of ser!"
