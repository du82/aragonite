["https://www.spanishdict.com/guide/trave-guide-bilbao-spain"]
title = "Travel Guide: Bilbao, Spain | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Bilbaohas emerged in recent decades as a cultural powerhouse in northern Spain. Read on to learn more about this amazing city! Perched on the banks of the río Nervión(Nervion River), the Guggenheimis considered by many to be the jewel of Bilbao. Drawing tourists from all over the world, this museum has become a cultural hub in the city. The Guggenheim opened in 1997 and, arguably, sparked the city’s renaissance. As heavy industry died, tourism grew, and the city transformed. However, the Guggenheim is not the only place to see art in the city. Just down the way from the Guggenheim, you can find the Museo de Bellas Artes de Bilbao(Bilbao Fine Arts Museum). While it’s often overshadowed by its much larger neighbor, this museum of fine arts houses impressive works by both local and international artists. While the Guggenheim is one of Bilbao’s most beloved architectural joyas(jewels), it’s not the only one. The Zubizuri(Basque for white bridge) was designed by Santiago Calatrava, the same architect who designed the The World Trade Center Transportation Hub in New York City. Other must-see buildings in the city include the Palacio Euskalduna(Euskalduna Conference Centre) and the Ayuntamiento de Bilbao(Bilbao City Hall). In spite of being often overshadowed by nearby San Sebastian, Bilbao is sure to please even the most exigente(demanding) foodies. Bars throughout the city are bursting with pintxos(hors d'oeuvres). Pinchos are typically eaten before lunch, and accompanied by something to drink. Depending on the bar, they can range from the simple gilda, made up of an aceituna(olive), guindilla(Basque guindilla chili pepper), and an anchoa(cured anchovy fillet) to much more elaborate creations. Don’t be afraid to try pinchos in Bilbao. It’s hard to go wrong! Anchovies!?! While they may get a bad rap in English-speaking culture, anchovies are a local delicacy in northern Spain. Bilbao is just to the east of Santoña, one of the major anchovy-packing hubs in the world. People take their anchovies seriously here, and if there’s ever been a place to try one, we think northern Spain’s your best bet."
