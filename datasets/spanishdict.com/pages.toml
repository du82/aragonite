full_description = "Not to be confused with the English acronym MIA (Missing in Action), the title of the Bad Bunny (feat. Drake) song MIAis simply the possessive pronoun mía written in all caps. So why the caps? Well, according to the lyrics of MIA, the nena (girl) Bad Bunny and Drake are singing about is codiciada (very popular), and they want the world to know she's theirs. Take a look at the English translation of the beginning of MIA to see what we mean. The possessive pronoun mía can be translated as mine or my girl. Bad Bunny and Drake repeat the word mía no less than twenty-four times throughout the song, so singing along with them is a perfect way to learn this word!"
