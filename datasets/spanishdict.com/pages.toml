description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Nosotros commands are used by a speaker to suggest an action be performed by a group of people he or she belongs to. There are many different types of Spanish commands, including tú commands, formal commands, indirect commands and nosotros commands. We'll focus on nosotros commands in this article. ¡Empecemos!(Let's get started!) To form nosotros commands with the subjunctive, simply use the nosotros form of the present subjunctive. The present indicative form of the verb ir is used instead of the present subjunctive for affirmative commands. To form negative nosotros commands, you simply put no or another negative word in the front of the affirmative command. This one's easy! You just put the reflexive, direct object, or indirect object pronoun between the negative word and before the verb. That's it!"
