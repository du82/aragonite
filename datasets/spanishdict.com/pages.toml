full_description = "It's very simple to make verb phrases negative in Spanish. In most cases, you simply put the word noin front of whatever verb or verb phrase you want to negate. Never separate direct or indirect object pronouns from the verb. Simply place the negative word in front of the pronoun. Negation using no is the most basic type of Spanish verb negation, but you can use other negative words and phrases in combination with no. Examples of some of these words and phrases are given below. It's not always necessary to use the word no to negate a sentence. You can also use a different negative word, such as nunca or nadie, in place of no."
