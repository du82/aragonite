full_description = "The present perfect subjunctive is a combination of the present subjunctive of the verb haberand a past participle. It's very similar to the present perfect indicative, but is triggered by the same sorts of words and phrases as the present subjunctive. Relative clauses are subordinate clauses that are equivalent to an adjective. They usually explain or elaborate on the noun they modify (the antecedent). In Spanish, relative clauses are commonly introduced by the relative pronoun que. In the above example, the relative clause is que tenga una cocina grande. The antecedent is una casa. The verbs buscar, necesitar, and quereroften trigger the present perfect subjunctive because we use these verbs to express a desire for something that may or may not exist. When these verbs precede an antecedent that is definite or known to the speaker, the indicative mood is used. Take a look at these examples. The first example uses the present perfect in the subjunctive mood while the second example uses the present perfect in the indicative mood. Relative clauses that follow the negated forms of tener, conocer, haber, and existirtake the subjunctive mood. Take a look at the following examples. The first example uses the present perfect in the subjunctive mood while the second example uses the present perfect in the indicative mood. In questions, the verb in the relative clause can be conjugated in the present perfect subjunctive. This is the case when there is an element of doubt and the speaker is not sure whether the antecedent exists. Take a look at the following examples. The first example uses the present perfect in the subjunctive mood because the antecedent isn't identifiable, while the second uses the indicative because the speaker is just confirming a fact."
