description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "In sentences in active voice, the agent (the doer of the action) is the subject of the verb. In active sentences, there may or may not be an object (the receiver of the action). Check out these examples of sentences in active voice. Hint: the subject (the doer) and the recipient are written in bold. In sentences in passive voice, the receiver of an action gets moved to the subject position. This is often done to move the focus from the doer to whatever it is that was done. In the passive sentences below, the doer of the action is no longer the subject. Instead, the recipient of the action (written in bold) is the subject. Note that the last two examples above do not have an overt subject in Spanish. Both examples use the se pasiva, which is commonly used to say what an unknown or unmentioned they did."
