["https://www.spanishdict.com/guide/spanish-imperative-mood"]
title = "Imperative in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The imperative (el imperativo) is one of the three moods in Spanish, the other two being the indicative and the subjunctive. The imperative mood is used to tell someone to do something in a direct manner. More simply put, sentences in the imperative mood are commands. There are many different types of Spanish commands, including affirmative tú commands, negative tú commands, formal commands, nosotros commands, and indirect commands. This article serves as a quick reference for all the different types of commands. For more detailed information and examples, click on the links above. We use affirmative túcommands to tell a friend, classmate, child, pet, or family member the same age as you or younger to do something. To form regular tú commands, we use the third-person singular form of the present indicative. Negative tú commands are used to tell a friend, classmate, child, pet, or family member the same age as you or younger not to do something. To form negative tú commands, use the tú form of the present subjunctive and put no, nunca, or another negative word in front of the verb. Ustedcommands are used to tell someone you don't know well, a person older than you, or a person to whom you want to show deference or respect to do/not to do something. To form both affirmative and negative usted commands, use the third-person singular form of the present subjunctive. In Latin America, ustedescommands are used to address any group of people because ustedes is used for both the formal and informal plural. In Spain, ustedes commands are used to address a group of people formally. To form both affirmative and negative ustedes commands, use the third-person plural form of the present subjunctive. Nosotroscommands are used to express what the speaker and others ought to do or shouldn't do. In other words, they are used to say let's or let's not do something. To form both affirmative and negative nosotros commands, use the nosotros form of the present subjunctive. In Spain, affirmative vosotroscommands are used to tell a group of people you are familiar with to do something. In all other Spanish-speaking countries, we use ustedes commands in both informal and formal situations. To form affirmative vosotros commands, replace the ‐r at the end of the infinitive with a ‐d."
