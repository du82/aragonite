["https://www.spanishdict.com/guide/affirmative-informal-tu-commands"]
title = 'Informal "Tú" Commands in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "There are many different types of Spanish commands, including negative tú commands, formal commands, indirect commands, nosotros commands, and affirmative tú commands. We'll focus on affirmative tú commands in this article, so ¡ponte listo!(look sharp!) These command forms are definitely going to come in handy. Tú commands are the singular form of informal commands. You can use affirmative tú commands to tell a friend, family member the same age as you or younger, classmate, child, or pet to do something. To tell somebody not to do something, you would use a negative tú command. This article covers affirmative tú commands (also called the informal imperative) in all their forms. For regular verbs, you will simply use the third-person singular form of the present indicative to form an affirmative tú command. In Spanish grammar lingo, a stem is the verb form you're left with if you take the -ar, -er or -ir away from the end of an infinitive. For verbs with stem changes or spelling changes in the present tense, the stem or spelling change also applies to the informal command form. Here are some examples of these types of verbs. All verbs with irregular third-person singular forms in the present tense maintain that same irregularity in the affirmative informal command, except for the following eight verbs, which have special irregular affirmative command forms. These ones are super-duper irregular. To remember the super-duper irregular command forms in the table above, memorize this mnemonic device: Now say it ten times fast. No, es broma(just kidding), but do practice it so you don't forget these important irregular affirmative command forms. Pronouns are attached to the end of affirmative commands. A written accent (tilde) is often added to maintain the verb's original stress, especially if more than one pronoun is used. Because informal tú commands take the same form as the third-person singular of the present tense, it is helpful to include exclamation points to indicate urgency. You can also include the name of the person you are commanding, followed by a comma. Without the comma, an imperative verb could be confused with a third-person singular present verb. Compare the following sentences, paying careful attention to the different punctuation."
