description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Relative adjectives like cuyorefer to a noun previously mentioned in a sentence (the fancy word for this is antecedent) and introduce a relative clause. Relative adjectives are very useful for providing additional information about something or someone that you have already mentioned. Cuyo, which translates to whose, always agrees with the noun it refers to in gender and number and has four different forms. Cuyo contrasts with relative pronouns because it agrees in number and gender with the possessed noun, not the possessor. For example, in the first sentence below, cuyo agrees with gato (the possessed noun), not hermana (the possessor)."
