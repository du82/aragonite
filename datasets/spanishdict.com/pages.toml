["http://www.spanishdict.com/guide/stem-changing-verbs"]
title = "Stem-Changing Verbs in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''Stem-changing verbs in the present tense use the same endings as regular -ar, -er, and -ir verbs when conjugated, but undergo a vowel change in the last syllable of the stem. Looking for an introduction to the present tense in Spanish? Check out our article on Spanish present tense forms. This type of stem change affects the largest number of verbs. For verbs in this group, the e in the last syllable of the stem changes to ie. Check out an example of this in the conjugation table for the verb querer(to want). Keep in mind that "the last syllable of the stem" refers to the only syllable in the stem in verbs like cerrar and pensar. Present tense stem changes do not apply to nosotros and vosotros forms. These two forms maintain the form of the infinitive stem. If you think of the way many traditional verb tables are presented (see the conjugation table of querer above), you'll notice that the four verb conjugations that do undergo a stem change make the form of a rudimentary boot (or an "L"). This is a neat way to remember which verbs undergo a stem change. The yo forms of venir and tener are irregular. The yo form of venir is vengo(I come), while the yo form of tener is tengo(I have). For verbs in this group, the o in the last syllable of the stem changes to ue. Check out an example of this in the conjugation table for the verb soñar(to dream). Watch out for oler(to smell). The letter h is also added to the present tense forms of this verb that undergo a stem change. For verbs in this group, the e in the last syllable of the stem changes to i. Check out an example of this in the conjugation table for the verb repetir(to repeat). There are only two commonly-used verbs in this group: adquirir(to acquire) and inquirir(to inquire). Check out the conjugation table for these two verbs below. There is only one commonly-used verb in this group: jugar(to play). Check out the conjugation table for the verb jugar below. Verbs made up of any of the above forms plus a prefix also undergo stem changes. Here are just a few examples.'''
