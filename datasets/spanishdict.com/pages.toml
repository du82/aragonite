["http://www.spanishdict.com/guide/spanish-present-perfect-indicative"]
title = "Spanish Present Perfect Indicative | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish present perfect (el pretérito perfecto compuestoo el antepresente) is used to talk about things that started in the past and which continue or repeat in the present. It's also used to talk about things that have happened in the recent past. For talking about actions that happened in the recent past, the present perfect is more widely used in Spain than in Latin America. It's more common to hear the preterite, or simple past, used in Latin America to talk about something that just happened. Haber, the auxiliary verb used with the present perfect, and the past participle are never separated in a present perfect construction. If an object pronoun (such as los) is used with the present perfect, it goes immediately before haber. The present perfect may be used to talk about an action still in progress, but it's also common to use the present tense to do this. The present perfect may be used to talk about something that was just done, but it's also very common to use acabar deor the simple past, especially in Latin America."
