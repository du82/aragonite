title = "Learn Spanish at Chipotle | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "“I’ll have a chicken burrito with guacamole and queso blanco, please.” When ordering at Chipotle, you will likely find yourself using a mix of English words, Spanish words, and made-up words. Read on to find out the origin of some of Chipotle's most popular menu items! First off, what does chipotleeven mean? A chipotle is a chile pepper that has been smoked or dried until it turns dark red. Chipotles are most commonly made using jalapeños, but they can also be made with a number of other hot peppers, including chile ancho(ancho chile) and chile pasilla(pasilla chile). Before you put in your order at Chipotle, first you need to decide what type of Mexican-inspired dish you want. If you go with a burrito, quesadilla, or taco, you'll be using a loan word, a Spanish word that has officially become part of the English language. At Chipotle, you can't order an authentic soft corn tortillalike you'd see in Mexico because they've been discontinued. Way to go, Chipotle! After choosing what type of meal you want, you are presented with an array of protein to choose from. If you’ve ever seen barbacoa (barbecued meat) made in Mexico, you know that the meat (goat, lamb, or beef) is covered with maguey leaves and cooked in an underground oven. Barbacoa is a form of cooking meat that, in spite of its name, does not involve barbecue sauce. If you order barbacoa at Chipotle, you get pretty close to the real deal. The beef is not cooked in an underground oven, but it is braised slowly at a low temperature until tender. If you want to be as authentic as possible, choose tomatillogreen-chili salsa as your only topping, which is Chipotle’s version of salsa verde(salsa made with green tomatoes). Carnitas, which literally translates as little meats, is another culinary staple in Mexico. Both the authentic version and Chipotle’s version consist of small pieces of braised pork. Isn’t it fun making up your own words in Spanish? Chipotle sure thinks so! Some menu items sound like legitimate Spanish words, but in reality they were just invented by Chipotle. When choosing a protein, the more health-conscious consumers gravitate toward chicken or sofritas. If you look sofritas up in the dictionary, you won’t find it. You will find sofrito, which serves as a flavorful base for a variety of Mexican dishes. Sofrito was the original inspiration for Chipotle’s sofritas, which consist of small bits of tofu that have been braised in chipotle peppers and other spices."
