["https://spanishdict.com/guide/conditional-perfect-forms-and-uses"]
title = "Spanish Conditional Forms and Uses | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The conditional perfect (el condicional compuestoo el antepospretérito) describes an action in the past that would have happened but did not due to some other event. It can also be used to express the probability of an action that has already been completed. The conditional perfect is a combination of the past participle and the conditional of the verb haber. In the examples below, the conditional perfect is used to talk about actions that would have happened had something else not gotten in the way. In the examples below, the conditional perfect is used to talk about an action that probably happened or was true. There are four other perfect tenses in the indicative: the present perfect, the past perfect, the preterite perfect, and the future perfect. Read more about the conditional in this article."
