["https://spanishdict.com/guide/introducing-people-and-pets"]
title = "Introducing People and Pets! | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "All Spanish nouns (sustantivos), including people, places, animals, things, ideas, and feelings, have a gender (i.e. they're male or female). For example, un gato is used to talk about a male cat, while una gata is used to talk about a female cat. In this skill, you learned how to use the verb ser(to be) to introduce people and pets. Let's review the conjugations you learned! While subject pronouns can be used to replace a person's name, many native speakers of Spanish rarely use them at all. This is because Spanish verb endings tell you who the subject is. Take a look at the following examples: The first example includes the subject pronoun yo (I), while the second example omits it...but both are equally valid ways to say I'm Raquel in Spanish! Artículos(articles) are small functional words that go before a noun to tell us if the noun we are referring to is general or specific. In this skill, you learned two indefinite articles that translate as a or an. Let's take a look! Before we end our review, let's talk a bit about the letter hin Spanish. Listen to the pronunciation of the world hola. Did you notice that the h in hola is silent? Good! The letter h is almost always silent in Spanish. It's only not silent in words adopted from other languages, like Hawái(Hawaii), or when it comes after the letter c, like in chipotle(chipotle) ."
