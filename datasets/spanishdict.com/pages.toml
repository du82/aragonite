full_description = "Here are three phonetic alphabets that show you the pronunciation of martes. Remember to emphasize the bold syllable the most! Want to learn more about how to pronounce the letters in martes? Just click on the letter in the table above that you want to learn more about! To pronounce the Spanish simple r sound, touch the tip of your tongue to your hard palate once. Your hard palate is essentially the roof of your mouth - if you run your tongue over the area behind your front teeth with your tongue, you should feel a little bump. This little bump is called the alveolar ridge and is where the roof of your mouth, or hard palate, begins. To pronounce the Spanish simple r sound, you touch your tongue to the area just behind the alveolar ridge. The Spanish simple r sound is actually very similar to the sound most American speakers use to pronounce the t in words like water and hater! Here are some useful sentences and phrases containing martes. Remember to emphasize the bold syllables the most!"
