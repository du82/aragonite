full_description = "In Spanish, the past continuous or past progressive is used to talk about continuous actions in the past, especially when they are interrupted by another action. This tense is most similar to the imperfect, but places even more emphasis on the ongoing nature of an action. There are so many different verb tenses that we use to talk about the past in Spanish. In this article, we will focus on the difference between the simple past tenses (preterite and imperfect) and the past continuous tense (imperfect progressive). Before talking about the differences between the simple past and past continuous, let's review their verb conjugations. In Spanish, there are two simple past tenses: the preterite and the imperfect. Both are formed by subtracting the infinitive ending (-ar, -er or -ir), and replacing it with another. Note that each tense has one set of endings for -ar verbs, and another for -er and -ir verbs. The table below shows how to conjugate the verbs caminar(to walk) and correr(to run) in both the preterite and imperfect. ¡Cuidado!(Careful!) Irregular verbs do not follow the same rules. Check out this article to review irregular preterite verbs, and this one for imperfect verbs. The imperfect progressive tense is formed by combining the imperfect tense of estar(to be) with a gerund. In English, there is only one simple past tense, but in Spanish there are two: the preterite and the imperfect. The preterite is used to talk about completed actions in the past, while the imperfect is used for repeated actions without a defined beginning and end. The examples below show their various uses. Click here for more information on the distinction between the preterite and imperfect tenses. Similar to the imperfect, the imperfect progressive is used to talk about ongoing actions in the past. It is more commonly used to emphasize the continual nature of an action, especially if it is interrupted by another action. The following examples illustrate its use: While the imperfect and imperfect progressive tenses can be used interchangeably in some circumstances, this is not always the case. The imperfect progressive cannot be used for descriptions, states of being, conditions, age, time or habitual actions. The following examples show incorrect uses of the imperfect progressive:"
