["https://spanishdict.com/guide/spanish-preterite-tense-forms"]
title = "Spanish Preterite Tense | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish preterite tense (el pretéritoo el pretérito perfecto simple) is used to describe actions completed at a point in the past. The Spanish preterite is not used to describe habitual or continuous actions in the past with no specific beginning or end. In such cases, the imperfect tense is used. There are only two sets of endings for regular preterite verbs, one for -ar verbs and one for both -er and -ir verbs. To conjugate a regular verb in the preterite tense, simply remove the infinitive ending (-ar, -er, or -ir) and add the preterite ending that matches the subject. Check out the table of regular preterite endings below. Note that the first person singular (yo), third person singular (él, ella), and second person formal singular (usted) preterite forms have tildes(written accents) on the final vowel. Keep in mind that one little tilde can change both the tense and subject of a sentence. For example: The first person plural (nosotros) endings for regular -ar and -ir verbs are the same for both the preterite and present tenses. Context clues, such as adverbs like siempre (always) and ayer (yesterday), can help you figure out if a nosotros form refers to the past or the present. Four of the most common verbs with irregular preterite forms are ser, ir, dar, and ver. For more on tricky preterite forms, check out our article here. The preterite is used to talk about completed actions in the past. More specifically, it is used to talk about beginnings and ends, things that took place on specific days or dates, at specific times or during specific time periods, and events in a sequence. The preterite is used to talk about completed events, especially those with very clear beginnings and ends. Beginnings and ends themselves are also talked about using the preterite. Key verbs you'll see used to talk about beginnings and ends in the past are empezar (to begin), comenzar (to begin), terminar (to finish), and acabar (to end). The preterite is used to talk about past events or actions that occurred on specific days or dates, at specific times, and during specific time periods."
