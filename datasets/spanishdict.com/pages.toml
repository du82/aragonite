["https://www.spanishdict.com/guide/simple-future-regular-forms-and-tenses"]
title = "Simple Future Tense Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "There are two ways to form the future tense in Spanish: the informal future (ir + a + infinitive) and the simple future (el futuro simple). The simple future, unlike the informal future, is expressed in a single word. The Spanish simple future is used to talk about what will or shall happen. It is also used to express the possibility of what someone might or may be doing in the present. To form the simple future tense, simply add the correct ending to the infinitive of the verb. All verb conjugations (-ar, -er, and -ir) have the same endings in the simple future tense. The simple future was originally formed by adding haberto an infinitive. For example, Viajar he.(Literally, Travel I must.) While the simple future is most often used to talk about what a person will do, it can also be used to talk about conjecture, possibilities, and probabilities in the present, make predictions about the future, and give solemn commands. The simple future can also be used in conditional sentences with si (if) to talk about what someone will do. In sentences like this, the verb immediately after si is in the present tense, while the verb in the other part of the sentence is in the simple future. In Spanish, it's very common for the present tense to be used to talk about future events that are certain. Check out the examples below. Check out this article on irregular simple future forms! Also, to round out your knowledge of the Spanish future tense, take a look at our article on the informal future in Spanish!"
