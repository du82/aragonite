title = "The Future Perfect Indicative in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish future perfect indicative (el futuro compuesto) is used to talk about something that will have been completed at a certain point in the future. It can also indicate probability, or what might have or could have happened. The Spanish future perfect is formed by combining the simple future of the verb haberwith a past participle. Here are examples of the future perfect indicative used to talk about actions that will have been completed before another action in the future. In this sense, the future perfect is used to talk about something that hasn’t happened yet. Here are examples of the future perfect indicative used to talk about likelihood or conjecture. In this sense, the future perfect is used to talk about what someone guesses or thinks might be true."
