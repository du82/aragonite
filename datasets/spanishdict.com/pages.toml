["https://spanishdict.com/guide/diminutives"]
title = "Diminutives in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "A diminutive suffix is a suffix attached to the end of a word to indicate small size, cuteness, familiarity, or even pity or contempt. There’s no doubt you’ve heard words like burrito(burrito) and mamacita(mommy, babe), but you might not know that these words use diminutive suffixes! Diminutive suffixes are attached to a word to indicate small size, cuteness, or familiarity. For example, adding -ito to gato(cat) changes the meaning to kitty (gatito). Diminutive suffixes are also used to show love/affection, pity, irony, humor, ridicule, and deference, as well as to address children and animals. While the diminutive -ico is used in parts of Latin America, such as Colombia, Costa Rica, Cuba, and Venezuela, it’s also quite popular in central-eastern Spain, including Andalucía, Aragón, Murcia, and Navarra. Although Galiciahas its own language, gallego(Galician), the Galician diminutive -iño has also worked its way into Spanish! Although they're not typically used in Spanish, -txu and -txo are two of the most common diminutives you’ll hear in País Vasco(Basque Country). They occasionally make their way into Spanish conversations via their loving application to people’s names (Josetxu, Carmentxu) or when little kids address their moms using the Basque word ama(mom) to say amatxu(mama). Many Spanish-speaking families choose to use the Basque terms ama for mom and aitafor dad, depending on what each parent prefers. Although the vast majority of diminutives used in Spain start with i, the north-central region of Cantabriabucks the trend with its u. In this tiny region, folks use -uco as a diminutive. In Cantabria, you may give a friend a besuco(little kiss) when you see them, or tell your neighbor that their niñuco(little kid) is adorable. The suffix -uco is so Cantabrian, that many even refer to the region as la Tierruca(the Little Country). Want to learn more about Spanish pronunciation and other Spanish relevant topics? Check out the following articles!"
