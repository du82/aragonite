["https://www.spanishdict.com/guide/nationalities-in-spanish"]
title = "Nationalities in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Nationalities in Spanish are often talked about using nationality adjectives, which are adjectives that describe the country a person or thing is from. Most nationality adjectives in Spanish have four forms: masculine singular, feminine singular, masculine plural, and feminine plural, though some just have two forms (singular and plural). While the endings may look a bit confusing at first, the rules for forming nationality adjectives are actually pretty straightforward. Nationalities that end in an o have four forms: masculine singular, feminine singular, masculine plural, and feminine plural. Here are some quick rules for the changes you'll need to make to the masculine singular form in order to make the feminine singular and plural forms. Nationalities that end in an e or an accented vowel have only two forms. This is because the masculine and feminine singular forms of these adjectives are the same. Here are the rules for making the singular forms of these adjectives plural. In English, American may refer to people from North, Central, and South America, though it's most commonly used to refer to someone from the United States. In Spanish, it's more common for the word americano to be used to refer to anything or anyone from North, Central, or South America. If you want to make it very clear that you're talking about someone or something from the United States, use the nationality adjective estadounidense. Nationalities that end in a consonant have four forms: masculine singular, feminine singular, masculine plural, and feminine plural."
