["https://www.spanishdict.com/guide/reflexive-verbs-and-reflexive-pronouns"]
title = "Reflexive Verbs and Reflexive Pronouns in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "A reflexive pronoun (pronombre reflexivo) is used as part of a reflexive verb (verbo reflexivo) to indicate that someone or something is performing an action on or for itself. Many actions related to personal care or daily routines are reflexive, but other verbs can be reflexive as well. In the sentences below, the subject performs the action on itself, and the subject and object of the verb refer to the same entity. Now, compare two sentences in which one is reflexive and one is not. In the reflexive sentence, the subject and object refer to the same entity. When the object of the verb is the same entity as the subject, you will need to use a reflexive pronoun that matches the subject of the verb in both number (singular or plural) and person (first, second, or third). In the first table below, you'll find the different forms Spanish reflexive pronouns take. Just to make sure you've got these down, the next table shows you the Spanish reflexive pronoun forms, along with example sentences showing how they may be used. Remember, the reflexive pronoun will always be the same number and person as the subject of the sentence. Reflexive pronouns have the same forms as indirect object pronouns, with the exception of se, which is used instead of le and les for the third person. As you now know, reflexive verbs require the use of reflexive pronouns to indicate that the direct object of the verb is also the subject (in other words, the subject is performing the action on himself or herself). Check out a few examples with verbs that are commonly reflexive. As mentioned before, you can also add reflexive pronouns to verbs that are not regularly reflexive in order to make them reflexive. Reflexive verbs can also be used to indicate an emotional response to something. When a person becomes angry, sad, happy, etc., you can express this by using reflexive verbs. Reflexive pronouns can also be used to add emphasis to a seemingly regular situation. In these cases, the reflexive pronoun is not normally translated directly into English, but it often adds a sense of doing something more completely or thoroughly."
