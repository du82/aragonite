["https://spanishdict.com/guide/how-to-pronounce-r-and-rr-in-spanish"]
title = 'How to Pronounce "R" and "Rr" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Learning how to pronounce the simple and rolled r sounds of Spanish is important because some Spanish words are exactly the same except for the type of r they contain! For example, the word pairs above (pero and perro) and (caro and carro) differ only in that the first word in each pair has a simple r, while the other has a rolled r. Keep reading to find out more about how to pronounce the Spanish r! To pronounce the Spanish alveolar tap, you touch the tip of your tongue to your hard palate once. Your hard palate is essentially the roof of your mouth; if you run your tongue over the area behind your front teeth with your tongue, you should feel a little bump. This little bump is called the alveolar ridge and is where the roof of your mouth, or hard palate, begins. To pronounce the Spanish simple r, you touch your tongue to the area just behind the alveolar ridge. The Spanish alveolar tap is actually very similar to the sound most American speakers use to pronounce the t in words like water and hater! Some Spanish speakers pronounce the r at the end of a word as a simple alveolar tap, while others roll it! Both pronunciations are correct, so whether you pronounce the r in amaras a simple alveolar tap or as a rolled trill, you're saying it right! To pronounce the Spanish trill, you quickly touch the tip of your tongue to your hard palate more than once. This multiple tapping motion is where the term rolling your r's comes from; the multiple taps of the tongue against the roof of the mouth make it feel like you're rolling your tongue around! You use the trill, or rolled r, to pronounce words containing two written letter r's (like in carro) or the single written letter r when it occurs:"
