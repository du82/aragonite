full_description = "Maybe you’ve seen it on Netflix's new culinary competition The Final Table, or perhaps you’ve had it bookmarked in your Spanish cookbook for longer than you’d care to admit. Images of this colorful rice dish bursting with seafood have been tantalizing our taste buds for years, and it's time to do something about it! Bring an authentic taste of Spain to your table with paella, one of the most traditional and famous rice dishes in the world. With its fast-growing popularity and international fame, it comes as no surprise that there are many different versions of paella. Traditional recipes have been adapted by chefs around the globe, which means this iconic dish often loses its authenticity, even in its home country. Authentic paella originates from the Valencia region of Eastern Spain, and it comes in many varieties, including paella valenciana(Valencian paella) and paella de marisco(seafood paella). ¿Vives solo?(Do you live alone?) Paella isn’t meant for just one, so invite family or friends over for dinner. If you really want to impress your guests, serve some tapas(appetizers)! Did you know that the term paella refers to both the Spanish rice dish and to the pan in which paella is cooked? The wide and shallow shape of this special two-handled pan, also called a paellera, allows the rice to cook evenly in a thin layer without leaving any water, yielding a dry texture. The splayed sides and slight dip in the middle of the pan allow the oil to pool for sautéing. If you don't want to invest in a paellera, use the largest, shallowest skillet you have. Stay away from nonstick and cast-iron skillets. Paelleras require an adequate heat source that can accommodate the whole pan. The best way to cook paella is al aire libre(outside), on a round grill or over an open wood fire. If this isn't an option, just use your biggest burner (or straddle the pan over two or three burners) and rotate the pan often to evenly distribute the heat. All types of paella (even most of the impostors!) share essential ingredients. Start off on the right foot by gathering the following:"
