["https://spanishdict.com/company/privacy"]
title = "SpanishDictionary.com | Privacy"
description = "SpanishDictionary.com's privacy policy"
full_description = '''Privacy PolicyLast Updated: July 16, 2024Thank you for using SpanishDictionary.com, inglés.com, and FrenchDictionary.com! Our mission is to bring high quality reference and education products to every Spanish, English, and French learner in the world. To do that, we show you personalized services and ads that we think will be relevant based on the information we collect from you and third parties.We recognize the importance of protecting your personal information. We wrote this Privacy Policy to describe how we collect, use, and share your information in connection with your use of the SpanishDictionary.com services, including the SpanishDictionary.com website, located at SpanishDictionary.com (the "Website"), mobile applications (the "Application"), or other online services provided under the SpanishDictionary.com name (collectively, the "SpanishDictionary.com Services").When we mention "SpanishDictionary.com", "inglés.com", "FrenchDictionary.com", "we", "us", "our", or "Curiosity Media", we are referring to the company that owns and operates SpanishDictionary.com, inglés.com, and FrenchDictionary.com, Curiosity Media, Inc.By using the SpanishDictionary.com Services or submitting any personally identifiable information to us, you consent to our collection, use, and disclosure of information about you as described in this Privacy Policy.If you have any comments regarding this policy, please let us know by contacting us here.Table of ContentsHow We Collect InformationHow We Use the InformationHow We Share InformationChoices You Have About InformationLinks to Third Party SitesPublic InformationData Retention and Account TerminationAdvertisingChildrenCommunicationsSecurityInternational Data TransferExplicit NoticeDo Not Track SignalsSensitive Personal DataModifications to This Privacy PolicyContact UsHow We Collect InformationIn order to offer the SpanishDictionary.com Services, we rely on the ability to collect, store, and analyze basic information about how people interact with our website and other products. We also engage in agreements with third party partners who help us to provide our services, analyze our data, and deliver a customized and high-quality user experience. As such, we and our third party partners may collect and store personal information about you when you use SpanishDictionary.com Services. This information can come from information you provide to us, technical information that is shared with us, and third party information that is shared with us, each of which we describe below.Information You Provide to UsWhen you use the SpanishDictionary.com Services, you may provide information to us voluntarily. This information includes:Account Information: If you create an account, we may store and use your name, username, email address, birthday, gender, and other information you may provide with your account. You can modify some of the information associated with your account here. If you link your Facebook or Google account to the SpanishDictionary.com Services, we also may get information from those accounts, such as your email and contacts. The information we get depends on your settings and their privacy policies. If you use the SpanishDictionary.com Services on your mobile device, including through our Application, we may collect your phone number and the unique device id number. If you tell us where you are (e.g., by allowing your mobile device to send us your location), we may store and use that information to provide you with location-based advertising. If you want to deactivate this feature, you can either reinstall the Application or deactivate GPS on your mobile device.Content: The content that you contribute to SpanishDictionary.com Services is intended for public consumption, including your vocabulary lists, forum posts, comments, and other content contributions.Preferences: Our Website lets you store preferences like how your content is displayed, your location, safe search settings, etc. We may associate these choices with your ID, browser or mobile device, and you can edit these preferences at any time.Billing: When you order a subscription on our Application, we will collect all information necessary to complete the transaction, including your name, credit card information, and billing information.Communications: When you sign up for an account or use certain features, you are opting to receive messages from us and other users. You can manage some of your messaging preferences here, but note that you cannot opt out of receiving certain administrative, transactional, or legal messages from us. We may also track your actions in response to the messages you receive from the SpanishDictionary.com Services, such as whether you deleted, opened, or forwarded such messages. If you exchange messages with others through SpanishDictionary.com Services, we may store them in order to process and deliver them, allow you to manage them, and we may review and disclose them in connection with investigations related to the operation and use of SpanishDictionary.com Services. We may also store information that you provide through communications to us, including from phone calls, letters, emails, and other electronic messages.Surveys: We may collect and store personal information if you choose to participate in voluntary internet or telephone based surveys that help us learn more about our users. These survey results are generally not shared externally, but if they are, the results must be in an aggregate or anonymized form.Other: We may also collect other forms of personally identifiable information, such as at other points on our Website or Application that state personally identifiable information is being collected.Information You Provide to Social Networking SitesThe SpanishDictionary.com Services include interfaces that allow you to connect with social networking sites (each, a “SNS”). If you connect to a SNS through the SpanishDictionary.com Services, you authorize us to access, use and store the information that you agreed the SNS could provide to us based on your settings on that SNS. We will access, use and store that information in accordance with this Privacy Policy. You can revoke our access to the information you provide in this way at any time by amending the appropriate settings from within your account settings on the applicable SNS.Technical Information that we CollectWhen you use the SpanishDictionary.com Services, we collect certain technical information automatically. This information includes:Log data: When you use the SpanishDictionary.com Services, our servers record information ("Log data"). This may include your IP address, searches, browser type and settings, the data and time of your request, how you used SpanishDictionary.com, Cookie data, and Device data.Device data: In addition to log data, we collect information about the device on which you’re using the SpanishDictionary.com Services, including the type of device, operating system, settings, unique device identifiers and crash data that helps us understand when something breaks. Whether we collect some or all of this information often depends on what type of device you’re using and its settings. For example, different types of information are available depending on whether you’re using a Mac or a PC, or an iPhone or Android phone. To learn more about what information your device makes available to us, please also check the policies of your device manufacturer or software provider.Cookie data: We, and third parties with whom we partner, may use cookies, web beacons, scripts, local storage, flash cookies, advertising identifiers (including mobile identifiers such as Apple’s IDFA or Google’s Advertising ID) and similar technologies ("Cookies") in connection with your use of SpanishDictionary.com Services. Cookies may have unique identifiers, and reside, among other places, on your computer or mobile device, in emails we send to you, and on our web pages. Cookies may transmit information about you and your use of SpanishDictionary.com Services. For example, we use Cookies to store your language preferences or other settings so you don‘t have to set them up every time you visit SpanishDictionary.com. Cookies may be persistent or stored only during an individual session. Some of the Cookies we use are associated with your SpanishDictionary.com account (including information about you, such as the email address you gave us) and other Cookies are not. It may be possible to disable some (but not all) Cookies through your device or browser settings, but doing so may affect the functionality of the SpanishDictionary.com Services. The method for disabling Cookies may vary by device and browser, but can usually be found in preferences or security settings. For example, iOS and Android devices each have settings which are designed to limit forms of ad tracking. You can find more information about Cookies and how they work, what Cookies have been set on your computer or mobile device and how to manage and delete them at www.allaboutcookies.org and www.youronlinechoices.com/uk. Please note that changing any of these settings does not prevent the display of all advertisements to you. For more information on the types of Cookies we use and their purposes, please review the table below:TypePurposeEssentialIntended to make the SpanishDictionary.com Services work in the way you expect. For example, we use a Cookie that tells us whether you have already signed up for an account.Authentication, Security, and ComplianceIntended to prevent fraud, protect your data from unauthorized parties, and comply with legal requirements. For example, we use Cookies to determine if you are logged in.PreferencesIntended to remember information about how you prefer the SpanishDictionary.com Services to behave and look. For example, we use a Cookie that tells us whether you have muted audio in our some of our quizzes.NotificationsIntended to allow or prevent notices of information or options that we think could improve your use of the SpanishDictionary.com Services. For example, we use a Cookie that stops us from showing you a certain signup notification if you have already seen it.AdvertisingIntended to make advertising more relevant to users and more valuable to advertisers. For example, we may use Cookies to serve you interest-based ads, such as ads that are displayed to you based on your visits to other websites, or to tell us if you have recently clicked on an ad.Social MediaIntended to allow you to use social media websites while using the SpanishDictionary.com Services. For example, when you sign up for an account using a social media site, the site will use a Cookie to indicate that you have signed in to our site.AnalyticsIntended to help us understand how visitors use the SpanishDictionary.com Services. For example, we use a Cookie that tells us how our search suggestions correlate to your interactions with the search page.Third Party Information We CollectWe may also obtain information about you and your activity outside SpanishDictionary.com from our affiliates, advertisers, partners and other third parties we work with, or other publicly available sources. For example, online advertisers or third parties may share information with us to measure or improve the performance of ads on the SpanishDictionary.com Services, or to figure out what kinds of ads to show you. This includes information about your visits to an advertiser's site or purchases you made from them, or information about your interests from a third party service, which we might use to help show you ads.How We Use the InformationWe use the information we collect to provide the SpanishDictionary.com Services to you. Specifically, we use the information to:Provide the SpanishDictionary.com Services you request, including, for example, processing your requests to sign up for the service, storing your vocabulary lists, and keeping track of your audio preferences on quizzes.Better Understand our Users, including, for example, conducting research on user preferences, usage patterns, pain points, and interests so that we can improve the Services.Protect the Rights of SpanishDictionary.com and others, including, for example, using personal information as we believe is necessary or appropriate to protect, enforce, or defend the legal rights, privacy, safety, or property of the Services, its employees or agents, or other users and to comply with applicable law.Deliver Targeted Advertising, including, for example, using personal information to deliver targeted ads, promotions, and offers to you, on behalf of ourselves and advertisers, on and off the SpanishDictionary.com Services.Recommend Relevant Content, including, for example, suggesting related words and vocabulary lists that may match your interests.Provide Customer Support, including, for example, storing your email so that we can respond to messages that we receive and troubleshoot issues that arise on the site.Contact You, including, for example, to send the Word of the Day email and other information about the SpanishDictionary.com Services, including in connection with your accounts, online surveys, legal notices, new features that you are entitled to access, and other important information. You may opt out of receiving commercial email messages from us by following the instructions contained in those email messages.For these reasons, we have a legitimate interest in using your information in these ways, as it is fundamental to the nature of the SpanishDictionary.com Services we provide.How We Share InformationAs part of providing SpanishDictionary.com Services to you, we may share information with third parties, which can include:Other Users: We may share information that you provide use that is meant to be public, such as vocabulary lists and forum posts, with other users of the site.Advertisers: We may partner with third party advertisers to provide a customized ad experience on the site that is relevant to your individual interests. In order to identify and deliver personalized advertising, we may share certain information with these partners, including hashed personal information. Likewise, our third party advertising partners may rely on information collected using Cookies on your browser to deliver relevant ad content when you visit the site.Service Providers: We may rely on third party providers to support or provide some of the services that are available through the SpanishDictionary.com Services, such as translations. We may also rely on third party providers to perform certain services for us in connection with your use of the SpanishDictionary.com Services, such as communications and hosting services, network security, technical and customer support, tracking and reporting functions, quality assurance testing, payment processing, our own marketing of the SpanishDictionary.com Services, and other functions. We may share info'''
