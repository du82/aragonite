["https://www.spanishdict.com/guide/fundamental-spanish-phrases-to-learn-right-away"]
title = "Fundamental Spanish Word and Phrases to Learn Right Away | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "As Spanish learners, we've all gone through the experience of staring blankly at someone after they've spoken to you in Spanish and you have no idea what they said. In the meantime, our brains are playing catch-up trying to process and understand each word that was just said to us. The reason that comprehension can be so difficult at first is because we parse out language as phrases instead of as words. That’s why a great way to learn languages is to learn phrases as a whole first and then learn the words that make them up. In this article, we’ve written down the most fundamental Spanish phrases to help you fake it 'til you make it. With some practice, you'll be having great conversations in Spanish in no time! ¿Cómo estás?means how are you? in English. You’ll most likely hear this asked as part of a greeting, such as right after holaor buenos días. ¿Cómo estás? is the second-person informal singular form we use to ask someone how they are. In formal contexts, this phrase would become ¿Cómo está?. If we want to ask how a group of people are, we would use ¿Cómo están?, which is the second person plural form of the phrase. Buenos díasin Spanish means good morning and is the most common way of greeting someone during the morning hours. In most Spanish-speaking countries, you might even just hear buenas, as a shortened, more colloquial form of this phrase. Buenas tardescan mean either good afternoon or good evening, depending on the time of day that you use it. As with buenos días, this greeting is often heard simply as buenasin an informal context. Buenas nochesmeans good night and is used more as a farewell than as a greeting. Feel free to use this phrase in the evening as a polite way to wish someone farewell! Similar to hasta pronto, hasta luegomeans see you later and is also a common way to bid farewell. The slight difference is that hasta luego tends to be used in situations where you're not sure when you'll next see each other. Use the phrase me llamoalong with your name to introduce yourself. Me llamo literally translates to I call myself, but in English the more natural translation is my name is."
