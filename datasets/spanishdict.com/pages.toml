full_description = "In general, Spanish profession nouns change according to the gender of the person they refer to. Let's learn the rules for forming profession nouns and, of course, the exceptions to these rules. Many profession nouns have masculine forms that end in o. These forms can be made feminine by changing the o to an a. Here is a list of very common examples of this type of profession noun. The masculine and feminine forms of the following nouns are the same. Only the article changes to match the gender of the person. There are also many profession nouns with masculine forms that end in a consonant. These forms can be made feminine by adding an a to the end of the masculine form. Here is a list of very common examples of these profession nouns. Many nouns that historically only had one form for the masculine and feminine are changing as women take on roles previously only filled by males. For example, it is now fairly common to see the word presidentaused to refer to female presidents. Not all nouns that end in -ista, -ia, or e follow the above rule. The following masculine nouns have a very different feminine form: Remember, the rules above are more like generalizations for groups of nouns. There are many exceptions to these rules, but the majority of profession nouns you come across will follow them."
