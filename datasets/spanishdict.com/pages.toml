["http://www.spanishdict.com/guide/passive-se-in-spanish"]
title = 'Passive "Se" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The passive se is always formed using the third person singular or third person plural of a verb. If whatever you're talking about is singular, the verb is singular; if the whatever you're talking about is plural, the verb is plural. The passive se constructions Se buscaand Se vendecan be translated into English as Wanted and For sale, respectively. These two phrases are especially common in classified ads and signs on properties. It's common to see the passive se used in instruction manuals, cookbooks, and other types of publications that tell you how to do something. Finally, it's also very common for the passive se to be used when you don't know who performs an action, or it doesn't matter who does it. In these constructions, the action being performed (rather than the performer of the action) is considered the most important part of the sentence."
