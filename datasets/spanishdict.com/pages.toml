title = 'How to Pronounce the Letter "B" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The letter bin Spanish is pronounced like the English letter b in words such as bank or rebel. However, the sound does vary slightly, depending on the position of the letter in a word. Compare, for example, the sound of the English b in bank and rebel with the b in their Spanish translations, bancoand rebelde. The letter b represents the Spanish consonant sound, or phoneme, /b/. When a consonant sound is uttered, the flow of air out of the mouth is partially or completely blocked at some point. Note that b is not the only Spanish letter to represent the phoneme /b/. The Spanish letter v is also pronounced this way! The Spanish b is labial, which means it is pronounced by pressing the lips together, closing the mouth completely for an instant. Then, the air is let out abruptly. Unlike the sound of p, which is a similar sound, the vocal cords vibrate when uttering b, so linguists classify it as voiced, or sonorain Spanish. Check out how it is pronounced in these words: bata(robe), bravo(fierce), robar(steal), hambre(hunger), obtener(obtain), kebab(kebab). Yes, it’s like the English b in words such as bath or bomb when it is found at the beginning of a word or after the letter m. Consider, for example, the letter b in the translations of bath and bomb—bañoand bomba. However, in the rest of the positions, the Spanish b is like the English b, but often pronounced with the lips barely open rather than closed tight. Linguists represent this variant sound of b as [β̞]. You may hear this sound inside a word between vowels and/or consonants (except before m), for example: caballo(horse), recibir(receive), abrir(open), árbol(tree), etc. In everyday speech, you may hear a b before s that is so soft that it sometimes becomes almost inaudible or silent. Some examples of this include obstáculo(obstacle) or abstracto(abstract). Some Spanish words containing the letter group bs have developed accepted spelling variants without the b which are sometimes even more common than their main form. Two good examples of this phenomenon include suscripción(subscription) and sustancia(substance), which are more frequently used than subscripciónand substancia."
