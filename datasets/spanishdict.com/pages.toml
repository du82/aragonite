["https://www.spanishdict.com/guide/how-to-sound-like-a-local-in-peru"]
title = "How to Sound like a Local in Peru | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Scratching your head over what this sentence means? If you are, it may be because this sentence is full of jerga peruanaor Peruvian slang. Not to worry, though. In this article we’ll introduce you to some key words and phrases that will help you blend in with the locals once you arrive. Peru is well known for its luscious avocado trees that can bear aguacates, or avocados, the size of your foot! That said, if you use the word aguacates with the locals of Lima or Cuzco, they’ll be quick to correct you. That’s because Peruvians use the word paltainstead of aguacate when referring to an avocado. You’re likely to hear someone scream ¡A su!after burning their hand on the stove or being startled by someone creeping up on them. If you suspected that ¡A su! is actually a shortening of A su madre, literally to your mother, you’d be right. However, whereas this may have some negative connotations elsewhere in the Spanish-speaking world, in Peru it is simply used as an exclamation of surprise or pain. When Peruvians use the adverbial phrase al toque, they mean they want something done right away. Keep this useful phrase in your back pocket if you are feeling apurado(rushed) and need to get a number of tasks done immediately. If you travel to Peru, you’ll have to cambiar de divisas(exchange your currency) to the official Peruvian currency. Peru uses the Nuevo Solas their currency, and they typically refer to one Peruvian Nuevo Sol as una luca. If you come from the United States, Peruvians are likely to say that they’re trading soles for cocos, their colloquial term for the United States dollar. You’re likely to hear this phrase upon going out to dinner with friends after someone asks for la cuenta, the bill. In Peru, una chanchais a collection of money among peers, and hacer una chanchais to pool that money together to pay for something collectively. In Peru, rocheis the same thing as verguenza, or shame. Likewise, a common phrase that Peruvians use to show their pity or sympathy is the phrase, qué roche, which means what a shame."
