full_description = "In Spanish, un diptongo(a diphthong) is a series of two vowels that are pronounced in a single syllable. In Spanish, un diptongo is a series of two vowels that are pronounced in a single syllable. In Spanish, diphthongs can be formed by combining a strong vowel (a, e, or o) and a weak vowel (i or u), or by combining two weak vowels. When a diphthong is made up of a strong vowel and a weak vowel, the strong vowel is stressed a bit more than the weak vowel. Check out some examples below! The letter yis pronounced like a vowel when it appears at the end of a word and is preceded by another vowel. Written accents are referred to as tildesin Spanish. Here are a few tips to help you know when and where to place written accents on words that contain diphthongs."
