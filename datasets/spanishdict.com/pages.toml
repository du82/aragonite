["https://www.spanishdict.com/guide/learn-1000-words-in-15-hours"]
title = "Learn 1,000 Words in 15 Hours | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''Our vocabulary feature is designed to help people learn thousands of new vocabulary words as quickly as possible. We conducted a study to understand how long it takes to learn new vocabulary. We defined "learned" as retained for at least a full week, which in turn gives a high likelihood of retaining it a full month later. In our research, we looked at 15 million questions over a period of six months, and we found that a user typically learns a word after 51 seconds of study, or about 9 question attempts. At this rate, a person will learn 1,000 new words in just under 15 hours of study. Learning a language requires that people understand thousands of words, and our goal is to make that easier. So we set out to build the fastest way to learn vocabulary. In this article, we share the results of a study we conducted over the past 6 months analyzing more than 15 million questions from real users learning real vocabulary words. We defined "learning" a word as retaining it for a full week, which our users have demonstrated leads to a 70% chance of getting it right 30 days later. With this definition, we found that the average user learns a new word after seeing it roughly 9 times, totaling 51 seconds of study over multiple quizzes. Our core vocabulary lists are 1,000 words long. At 51 seconds per word, assuming every word on the list is new, this takes 14.2 hours of study, which we rounded up to 15 (to allow for bathroom breaks :P). For this analysis, we started by looking at data from about 15 million questions. We chose not to include data from multiple choice questions in this analysis, since they tend to take much less time (we'd rather err on the high side of our estimate, so you may learn even faster) and have less long-term impact on learning. This gave us about 3 million user-word-translation sets (for example, Sara is learning that "pastel" means "cake"). We'll call these UWTs moving forward. We also knew that there would be plenty of words a user already knew. We wanted to make sure we were studying learning, so we split out any words a user got right the first time they ever saw them. This left us with about 1.7 million UWT sets being learned and 1.3 million "previously known" UWT sets.'''
