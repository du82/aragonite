["https://spanishdict.com/guide/impersonal-se-vs-passive-se"]
title = "Impersonal Se vs. Passive Se | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Impersonal se and passive se constructions look very similar and can be quite confusing to tell apart. Below you'll find handy descriptions of each construction, as well as examples for each. Impersonal expressions don’t reference a specific person. Rather, they make reference to people in general and are used to make general statements or questions about what they, one, or you do. That is what makes them impersonal! You can use impersonal expressions to talk about how things are done according to custom, rule, or general consensus. They are also helpful for asking for directions, finding out how to say things properly, asking what the rules are in a specific place, making general statements, and so on. The passive voice is generally used to talk about something that happened to an object without saying who or what carried out the action. Only transitive verbs (verbs that require a direct object) are used in passive se constructions. It's very common to use the passive se to talk about inanimate (non-living) nouns. It is not common to refer to people using the passive se. Passive se constructions can be formed with se + a third person singular verb or a third person plural verb, depending on what is being discussed."
