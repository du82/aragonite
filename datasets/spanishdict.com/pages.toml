["https://spanishdict.com/guide/how-to-pronounce-ll-and-y-in-spanish"]
title = 'How to Pronounce "Ll" and "Y" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Spanish llis normally pronounced like the y in the English word yellow, but you may hear some native speakers pronounce it more or less like the j in the English word judge. Most Spanish speakers pronounce ll and y the same way when they are consonants: like the y in the English words yes or yellow. Where will you find these consonants? Ll used to be one of the letters in the Spanish alphabet native speakers learned at school, but it is no longer considered a letter as such. Linguists call it a dígrafo(digraph), a combination of two letters that is pronounced as a single sound. However, many speakers still consider ll a letter and will name it when reciting the Spanish abecedario(alphabet). The pronunciation of y and ll described above used to exclusively describe the pronunciation of the letter y. The letter ll, on the other hand, sounded approximately like the j in the English word judge or the s in pleasure. Nowadays, y and ll are pronounced differently only in certain Spanish-speaking areas and/or by certain speakers. In the rest of the Spanish-speaking world, the letter ll is pronounced exactly like the letter y. Linguists refer to the disappearance of the distinction between y and ll in spoken Spanish as yeísmo. Speakers who pronounce y and ll the same way are called yeístas. Most Argentinians and Uruguayans also pronounce y and ll the exact same way, so you could say they are yeístas. However, particularly in the area where español rioplatense(River Plate Spanish) is spoken, the pronunciation of the consonants ll and y sounds like the sh in the English words show or fish. The letter y is also used as a vowel in Spanish. In this case, it’s pronounced like the ee in the English word see, but a little shorter. You will find this vowel: Most of these plurals are made by adding -es to the word, in which case the final vowel y becomes the consonant y, for example: bueyes(oxen) from buey(ox), convoyes(convoys) from convoy(convoy). But there are some Spanish words whose plural is made by adding simply -s. In this case, the final y becomes the vowel i, for example: gais(gays) from gay(gay), and espráis(sprays) from espray(spray)."
