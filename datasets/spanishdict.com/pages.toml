["https://www.spanishdict.com/guide/spanish-flu"]
title = "Spanish Flu | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''The term Spanish flu refers to the gripe(influenza) outbreak that took place between 1918 and 1920, killing an estimated 50 million people worldwide. During the COVID-19 pandemic, the term Spanish flu popped up a lot in the news and on social media. Journalists often referred to the lessons learned in the past, hoping to give us clues on how the coronavirus pandemic might play out. The Spanish flu pandemic is considered the worst pandemic in recent history, killing an estimated 50 million people worldwide and infecting as many as 500 million! Like any other flu, it was a respiratory virus. The first wave of infections was relatively mild, and people had traditional flu symptoms. However, things changed in the fall of 1918. A second wave of infections caused millions to die shortly after showing symptoms. World War I was ending right as the Spanish flu was starting. The first cases were detected in spring 1918, and World War I ended on November 11, 1918—right in the middle of the second, and deadliest, wave of the Spanish flu. The movement of troops between North America and Europe almost certainly contributed to the international spread of the virus. Despite its name, the Spanish flu didn’t originate in Spain. In fact, the Spanish allegedly called it the “French flu” because they thought it came from France! The name Spanish flu caught on because the first media reports of the flu came from Madrid. In 1918, World War I was raging throughout Europe. Spain remained neutral during the war, which meant that wartime censors were not operating in the country. Reporters in Madrid were the first to talk about the flu in the spring of 1918. Despite the original reports coming from Madrid, experts are not entirely certain where the flu actually originated. Did you know that Spanish flu wasn't the only name used? In fact, the name used for this illness varied throughout the world, with each country "blaming" others for the flu! Some other names allegedly used include: Spanish lady, French flu, Spanish grip, American flu, Flanders fever, Bolshevik disease, Naples soldier, German flu, Brazilian flu, sumo flu—and many, many more. These names demonstrate the urge to blame the illness on external, rather than internal, sources.'''
