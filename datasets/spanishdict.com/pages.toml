full_description = "The subjunctive is one of the three moods in Spanish, the other two being the indicative (actions, events, facts) and the imperative (commands). You can find more on the differences between the subjunctive and the indicative here! Many of the verbs and phrases that require the subjunctive fit into the acronym WEIRDO: Wishes, Emotions, Impersonal expressions, Recommendations, Doubt/Denial and Ojalá. Although this topic doesn't fit into our fancy acronym, it's still important to learn. Let's get started! This type of sentence describes what will happen if another action is completed. These actions are conditional upon another action being completed, so the subjunctive is used to convey a sense of uncertainty. Many phrases with conditional circumstances have a connecting phrase or conjunctive expressions which introduce time limitations, conditions, concessions, or results. As you can see below, the key action (the one that must be completed for the second action to occur) is in the subjunctive. These conjunctions or conjunctive expressions are often used in the type of sentence discussed in this article. These expressions introduce the idea of a condition, an action dependent on something else occurring. Aunque and a pesar de que do not always take the subjunctive. If the conditional statement is considered hypothetical, you will use the subjunctive and if it is factual, you will use the indicative."
