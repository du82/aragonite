full_description = "In Spanish, almost any adjective can be used as a noun. Most of the time these nouns will be translated into English as the ____ one, where the blank is an adjective in English. To use an adjective as a noun, you simply add an article. The article must match the noun it refers to in gender and number. Remember that when a person is the direct object of a verb, you must use the personal a. When aprecedes el, they combine to form the contraction al. This same contraction rule applies to de+ el, which together form del. You can use adjectives as nouns with the neuter article loto refer to general or abstract senses. It's often translated into English as the ____ thing or what's where the blank is an adjective."
