full_description = "Un hiato(a hiatus) is a linguistic term used to refer to a Spanish word that has two vowels in a row that are pronounced in different syllables. For example, the word caer(to fall) has two syllables: ca and er. The word hiato shouldn’t be confused with the word diptongo(diphthong), which refers to a combination of two vowels pronounced in the same syllable. For example, pie(foot) has only one syllable. The word hiato (hiatus) refers to the pronunciation of a Spanish word that has two vowels in a row that are pronounced in different syllables. For example, caída(fall), tarea(homework), and cooperar(to cooperate) each contain a hiatus. There are three types of hiatus in Spanish: Remember that h between vowels is silent in Spanish, so it's not pronounced in words like Abraham, azahar(orange/lemon blossom), or alcohol(alcohol). Hiatuses are important because they determine the number and nature of the syllables of a word, which in turn will often determine whether that word is written with or without a tilde(written accent) in Spanish. Let's check out the pronunciation of some common hiatuses! Words containing hiatuses usually follow normal Spanish written accent rules, but the first tip in the above table is an exception. ...the word hiato itself contains a diptongo, a combination of vowels that are normally pronounced in the same syllable. Hiato has two syllables, hia and to, and the vowels ia form a diphthong, not a hiatus!"
