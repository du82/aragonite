full_description = "A direct object pronoun (un pronombre de objeto directo) replaces a direct object, which is a noun that directly receives the action of a verb in a sentence. Just like subject pronouns replace the subject noun in a sentence, direct object pronouns replace the direct object noun in a sentence, which can be a person, thing, noun phrase, or nominalized clause. Let's take a look at how direct object pronouns can do the work of direct objects in Spanish sentences. A direct object pronoun can take the place of a direct object referring to a person. In the first sentence below, the direct object is mi mamá. It can be replaced by the direct object pronoun la, as shown in the second example. In the first sentence below, la pelota receives the action of tiró, and thus is the direct object of the sentence. It is singular, feminine, and a thing, so it is in the third person. Therefore, you can replace it with the direct object pronoun la, as shown in the second example. In the first sentence in the pair of examples below, muchos libros receives the action of leen. It is plural, masculine, and a plural noun phrase, so it can be replaced with the direct object pronoun los, as shown in the second example."
