full_description = "The infinitive (el infinitivo) is the most basic form of a Spanish verb. Verbs in the infinitive form are not conjugated and do not indicate anything about who is performing an action or at what point in time the action is taking place. Many verb tenses use a form of the infinitive as the stem to which verb conjugation endings are attached. In general, for regular verbs, you simply need to remove the infinitive ending (-ar, -er, or -ir) to find the stem, and then you can the add specific endings needed to give tense/subject information. Verbs that end in-ar are more common than -er and -ir verbs. There are also fewer irregular -ar verbs than -er or -ir verbs. Here are some examples of common -ar infinitives and their stems. Verbs that end in -er are the second-largest group of infinitives in Spanish. Here are some examples of common -er infinitives and their stems. Verbs that end in -ir are the smallest group of Spanish infinitives. Here are some examples of common -ir infinitives and their stems."
