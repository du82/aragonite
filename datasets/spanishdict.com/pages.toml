["https://www.spanishdict.com/guide/written-accent-marks-tildes"]
title = "Accent Marks (Tildes) in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Tildes, or written accents, are used for many different purposes in Spanish. Among other things, they are used to mark word stress, differentiate the present tense from the past tense, and show whether something is a question, exclamation, or statement. Looking for how to type Spanish accents and punctuation on your keyboard? Check out our article here. The syllables of a word that are pronounced with the most emphasis, or stress, are called the stressed syllables. Some words may have more than one stressed syllable, though many have just one. If a Spanish word has a tilde, the word stress falls on whatever syllable has the tilde. If you see a tilde on a Spanish word, it's important to stress the syllable with the tilde. This is often the difference between pronouncing a word like teléfono with great Spanish pronunciation (teh-LEH-foh-noh), instead of English-like pronunciation (TEH-leh-foh-noh). Accents are also quite useful for telling what tense a Spanish verb is in. For example, the third person singular (él, ella), and second person formal singular (usted) preterite forms of regular Spanish -ar verbs end in an o with a tilde. The first person singular (yo) present forms of regular Spanish -ar verbs end in an o without a tilde. Tildes are also used for marking the difference between certain possessive adjectives and personal pronouns. Check out a few examples of these below. A tilde on words like qué and cómo can be used to show that someone is asking a question or making an exclamation. The lack of a tilde on such words is often used to show that something is a statement or command. Check out examples of these differences with the words qué and que in the table below. There are many pairs of words in Spanish whose only spelling difference is the presence or absence of a tilde. Here are just a few."
year_published = 2025
