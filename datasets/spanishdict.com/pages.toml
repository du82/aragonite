["https://www.spanishdict.com/guide/at-the-supermarket"]
title = "At the Supermarket | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Going to the supermercado(supermarket) in a Spanish-speaking country is a great opportunity to practice your Spanish. Study the following vocabulary words and phrases, grab a carrito, and get ready to hacer la compra(do the shopping) like a pro! In many Spanish-speaking countries, locals prefer to shop at markets or individual shops that specialize in just one thing, such as the carnicería(butcher shop) and panadería(bakery). For a visitor, shopping like a local would mean saying goodbye to getting everything in one place! While shopping like a local is a great way to experience a city, it’s arguably more convenient to visit a one-stop supermarket. Let’s take a look at the phrases and vocabulary you need to know to survive a trip to a supermarket in a Spanish-speaking country. Make sure to keep an eye out for ofertas(sales)! Supermarkets in Spanish-speaking countries are often divided into departamentos(departments), then pasillos(aisles). By familiarizing yourself with the following list of vocabulary, you will be able to understand the signs throughout the supermarket, making it easier to find what you need. If you need assistance at a supermarket in a Spanish-speaking country, you will need to put your Spanish skills to use! Let’s take a look at some common phrases you can use at the supermarket. Don’t forget to say por favor(please) and gracias(thank you)! Going to the supermarket in a Spanish-speaking country is a cultural experience. Let’s talk about a few things you may notice. The metric system is used in all Spanish-speaking countries, so don’t mistake kilos for pounds. Also, don’t make the mistake of assuming the grocery store will be open on a Sunday. Many supermarkets throughout the Spanish-speaking world close on Sundays. In Chile and in Mexico, there are workers who bag your groceries and work for tips. Remember to give them a propina(tip)! Also, try to remember to bring your own reusable shopping bags because many cities have banned the use of plastic bags."
