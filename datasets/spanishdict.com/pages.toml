description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Asking questions is a great way to learn new things in Spanish, and it's a necessary skill for making your way around. If you need to get directions, ask what a word means, or find out the time, you will need to know how to ask questions correctly. In this article we'll cover questions that can be answered with sí(yes) or no(no), as well as questions that are answered with more detailed information. Note the upside-down question mark (¿) in front of the questions. This is required when writing questions in Spanish! If you're not sure how to type the ¿, check out this article! When asking information questions (questions that require an answer beyond sí or no), you'll need to begin your question with a question word. Check out this handy list of common Spanish question words. Notice that the above question words have accents on them. This differentiates them from their non-interrogative counterparts. In Spanish, when only part of a sentence is a question, you only place the question marks around that specific part of the sentence."
