title = 'How to Pronounce the Letter "H" in Spanish | SpanishDictionary.com'
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Although the letter his typically not pronounced in Spanish, there are three ways that you may hear the h pronounced (or not!): Saying that a letter is silent means that it is not pronounced. For example, the pronunciation of the Spanish word almohada(pillow) may be transcribed /almoáða/. As you can see, the letter h doesn’t represent any sound, or phoneme, so linguists say it’s silent, or mudain Spanish. This is the case for most of the Spanish words that contain the letter h. Some examples of words with a silent h include: haber(have, auxiliary verb), hola(hello), ahora(now), enhorabuena(congratulations), or eh(hey). The presence of the letter h in Spanish words is mostly due to their origin, or etymology (etimología). Many of these h words come from Latin words that were already written with an h or are derived from other languages, such as Greek. For example, the word hoy(today) derives from the Latin hodie. The fact that h is silent in Spanish makes it hard to predict when a word is written with or without it. Here’s a table with a few tips that will help you spot words that are spelled with an h: Please note that the letter group ch, also called chein Spanish, has its own pronunciation, which is practically identical to the English ch in the words church or exchange. Examples of the pronunciation of ch in Spanish include: chica(girl), hacha(ax), ancho(wide), and sándwich(sandwich). A number of Spanish words that have been taken directly from a foreign language, or loanwords (préstamos), keep the aspirated sound of the letter h that is used in their language of origin. When they are assimilated into Spanish, they undergo little or no adaptation to the Spanish spelling system. This pronunciation is achieved by expelling the air straight from the throat with some force. It sounds approximately like the h of the English words ham or her, and it’s also very close to the sound of the Spanish letter j in jamónor the letter g in gente. Some examples of loanwords that contain an h that must be pronounced include: hall(foyer), taken from English, dírham(dirham), from Arabic, hámster(hamster), from German, or haiku(haiku), from Japanese."
