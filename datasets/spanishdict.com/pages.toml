full_description = "An ordinal number (número ordinal), as the name suggests, is a number that indicates the order of a noun that forms part of a series. Just like cardinal numbers, ordinal numbers are adjectives. But, unlike Spanish cardinal numbers, Spanish ordinal numbers actually do match the nouns they modify in both gender and number. Additionally, ordinal numbers usually come before nouns. The ordinal numbers from primero to décimo should be memorized, as they have unique forms and are used to form most of the other ordinal numbers in Spanish. When they come before nouns that are singular and masculine, primero and tercero are shortened to primer and tercer, respectively. The teen ordinal numbers are normally written as a single word, and they are formed according to the following formula. Here are a list of the ordinal numbers in Spanish from decimoprimero(eleventh) to decimonoveno(nineteenth). Notice that decimoctavodoes not follow the above pattern exactly. The o is removed from décimo before adding octavo so that you don’t end up with one o right after another. According to the RAE, it is also acceptable to write the ordinal numbers from decimoprimero to decimonovenoas two separate words. When written as two separate words, both words must agree in gender with any noun they modify. When written as a single word, only the final word in these compounds agrees in gender with the noun. Here are a list of the ordinal numbers divisible by 10 that fall between vigésimo(twentieth) and nonagésimo(ninetieth). These are used as the base from which to form all the ordinal numbers between twentieth and ninety-ninth. Using the formula below, forming the ordinal numbers between twentieth and ninety-ninth is quite easy. For ordinal numbers between 101 and 999, write out each successive ordinal number as a separate word. Just like in English, Spanish ordinal numbers are often written in an abbreviated form. To abbreviate Spanish ordinal numbers, you can follow the formula