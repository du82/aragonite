full_description = "There are many different types of Spanish commands, including tú commands, formal commands, nosotros commands, and indirect commands. In this article, we'll take a look at indirect commands, including quecommands and infinitive commands. ¡Que empiece la explicación!(Let the explanation begin!) Indirect commands are often used for giving commands through a third party or to an unspecified recipient. You'll see them used in signs, instructions, and recipes. There are two kinds of indirect commands: que commands and infinitive commands. To form a negative infinitive command, simply use the word no and the infinitive. Once again, don't conjugate anything!"
