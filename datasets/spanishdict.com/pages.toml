["https://www.spanishdict.com/guide/impersonal-expressions-with-the-subjunctive"]
title = "Impersonal Expressions with the Subjunctive | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The subjunctive (el subjuntivo) is one of three moods in Spanish, and it is often used to talk about impersonal expressions. Many of the verbs and phrases that require the subjunctive fit into the acronym WEIRDO: Wishes, Emotions, Impersonal expressions, Recommendations, Doubt/Denial, and Ojalá. In this article, we're going to take a look at impersonal expressions. Impersonal expressions work a lot like emotions in that they express someone’s opinion or value judgement. They focus on the subjectivity of the statement and not on the actual truth or reality of the situation. Almost any phrase using the formula es + adjective + que can be an impersonal expression as long as it doesn’t state a truth (like es verdad que), certainty (like es cierto que), or fact (like es un hecho que). Phrases beginning with these statements use the indicative. Phrases beginning with the negated forms of the above phrases (no es verdad que, etc.) use the subjunctive."
