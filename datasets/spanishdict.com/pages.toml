["http://www.spanishdict.com/guide/spanish-indicative-mood"]
title = "Indicative Mood in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "The Spanish indicative mood (el indicativo) used to talk about actions, events, or states that are believed to be facts or true. The indicative is one of three moods in Spanish (the other two are the subjunctive and the imperative). The indicative mood is typically used for making factual statements or describing obvious qualities of a person or situation. Looking for information on the differences between the indicative and the subjunctive? Check out our article here! The indicative mood is often used to talk about facts in the present, past, future, or conditional. Check out examples of the indicative used in each of these tenses below. Past tenses used in the indicative mood include the simple past, the imperfect, and the past perfect. Future tenses used in the indicative mood include the informal future, the simple future, and the future perfect. Conditional tenses used in the indicative mood include the simple conditional and the conditional perfect."
