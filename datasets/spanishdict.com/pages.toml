full_description = "We use adverbs of order to describe the order in which something occurred. In this lesson, you’ll encounter the following adverbs of order: Just like in English, Spanish has nouns that are countable and uncountable. Countable nouns are nouns that can be counted: for example, un grano de arroz(a grain of rice) or una botella de agua(a bottle of water). In this case, we are counting the grain and the bottle; grano and botella are countable nouns. However, if we talk about arroz and agua, they are both uncountable nouns. When we are talking about an uncountable or plural noun in a general way, we tend to omit the article in Spanish. For example: Note that we’re not talking about the olive oil in that bottle over there. No. We’re talking about using olive oil in general. Remember that, when conjugated, some Spanish verbs undergo a spelling change called a stem change. Review stem–changing verbs in Spanish with this article. Fantastic! Let's put the grammar and vocab from above to the test in the following example of a conversation in Spanish. Want to learn more about how to talk about making tapas in Spanish? Check out the following articles!"
