full_description = "When someone asks you ¿Cómo estás?(How are you?), how should you respond? Check out this list of responses to ¿Cómo estás? and you'll be able to say anything from Bien, ¿y tú?(Fine, and you?) to ¡Fatal!(Terrible!) Here's a list of fairly standard responses to ¿Cómo estás? that would be acceptable in just about any situation. Keep in mind that these responses may come off as a little rude if you don't also say gracias(thank you) or ask the other person how they are. Remember, you should use tú responses if speaking to someone the age as you or younger or someone who's told you you can tutear them (speak to them using tú). You should use usted responses for people older than you or people to whom you want to show deference or respect. While you wouldn't be likely to say gracias if you're saying things aren't going great, you might still ask the other person how they are."
