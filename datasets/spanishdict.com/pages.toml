["https://www.spanishdict.com/guide/how-to-give-advice-in-spanish"]
title = "How to Give Advice in Spanish | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = '''There are various ways to dar consejos(give advice) in Spanish. The structure you choose depends on how direct you would like to be when telling someone what they should do. To give someone advice in Spanish, you need to talk to that person, making it necessary to choose from one of the five ways to say "you" in Spanish. There are many ways to say you in Spanish, and they vary depending on the formality of the relationship between the speaker(s) and listener(s), how many people are being spoken to, and even what country the people are in or are from. With the following formulas, we can politely give someone advice by making a recommendation or suggestion. indirect object pronoun + verb of recommendation in the present indicative + que+ present subjunctive The indirect object pronoun is generally used to indicate who the recommendation is for, but is sometimes omitted. For example, Sugiero que te vayas a dormir ya.(I suggest you go to sleep now.) Using the verb of recommendation in the conditional instead of the present tense makes the advice sound more polite. The auxiliary verbs deberand poderare often conjugated in the conditional tense to give advice. These verbs will always be followed by a verb in its infinitive form. If someone doesn’t take well to being told what they should do, there are more delicate ways to go about it. There are various phrases you can use to give advice to someone by putting yourself in their shoes. Let’s take a closer look at the various ways to say If I were you in Spanish. To get a little more creative with your advice, try using an idiom. For example, No le busques pulgas al perro.(Let sleeping dogs lie.) Dar consejos is one of the many Spanish phrases that use the verb dar (to give). Click here to learn more expressions with dar! To give advice, you'll need to know the subjunctive. Learn more about the subjunctive with the following articles:'''
