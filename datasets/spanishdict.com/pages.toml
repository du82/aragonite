["https://www.spanishdict.com/guide/ser-vs-estar"]
title = "Ser vs. Estar | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "Learning the differences between serand estar, por and para, and the subjunctive and the indicative is often quite challenging for learners of Spanish. ¡Ánimo!(Cheer up!) After reading this article, you'll have a good handle on the first of these tricky pairs, ser and estar. Review Time: if you're not sure how to conjugate these two important verbs (they're irregular), check out the verb conjugation tables for ser and estar. Ser is used to talk about permanent or lasting attributes. If this general rule is too vague for you, think of the acronym DOCTOR, which stands for Descriptions, Occupations, Characteristics, Time, Origin, and Relationships. Let's take a look at each of the above categories individually. Descriptions are the essential qualities that define a person or thing and probably won’t change anytime soon. These descriptions can be names, physical descriptions, nationalities, and even religions. An occupation is what someone does for a living or as a hobby. Basically, if you're talking about how someone makes money or fills their time, you'll use ser. Notice that the indefinite articles un, una, unos, and unasmay not be used when talking about occupations with ser. They're often only included if extra information following the occupation is given. Compare the following: Characteristics are personality descriptions of a person. This category is included to hammer home the point that ser is used to talk about descriptions. The place a person or thing is from or the material something is made of can be considered an origin. Personal relationships, such as family ties, friendship, and romantic relationships, are also talked about using ser. Estar is used to indicate temporary states and locations. If that general rule doesn’t suffice, there are two acronyms that you can think of, PLACE and LoCo. PLACE stands for Position, Location, Action, Condition, and Emotion. LoCo stands for Locations and Conditions. Let's look at PLACE now. The location of someone or something describes where it is permanently, temporarily, or conceptually."
