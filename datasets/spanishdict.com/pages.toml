full_description = "The verb haceris one of the most commonly used verbs in Spanish. It typically translates as to do or to make, but in some expressions it can take on a different meaning. Hacer conjugated in the third-person singular is used in many weather expressions in Spanish. The expressions in the following table are in the present indicative, and describe what the weather is currently like. Using the same expressions, hacer can be conjugated in other tenses to say what the weather was like, will be like, etc. Hacer conjugated in the third-person singular can be used in various ways to talk about the passage of time. You can use hacer to describe how long ago something happened or how long you have been doing something. You can also use hacer to describe past actions that were interrupted by another action. There are two formulas you can use with hacer to talk about actions that occurred a specific amount of time ago. Let's put these formulas into practice! The first example uses formula one, while the second uses formula two. There are two formulas you can use with hacer to talk about actions that started in the past and continue into the present. These expressions are useful for talking about something you have been doing for a certain amount of time. There are three formulas you can use with hacer to talk about actions in the past that were interrupted. These expressions are useful for talking about something you had been doing when something else happened. When hacer is used pronominally, it translates as to become. Hacerseusually indicates a change brought about by effort, such as a change in profession."
