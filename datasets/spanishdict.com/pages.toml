["https://www.spanishdict.com/guide/possessive-adjectives-in-spanish"]
title = "Spanish Possessive Adjectives | SpanishDictionary.com"
description = "Expert articles and interactive video lessons on how to use the Spanish language. Learn about 'por' vs. 'para', Spanish pronunciation, typing Spanish accents, and more."
full_description = "There are two different forms of Spanish possessive adjectives: short-form and long-form adjectives. Let's take a look at each type! Short-form possessive adjectives are the most common way to express possession. They must agree with the noun they describe in gender and number. This doesn't end up being too complicated, because only nosotrosand vosotroshave distinct masculine and feminine forms. Short-form possessive adjectives are always placed before the noun they modify and are not used with a definite or indefinite article. In Spanish, possessive adjectives are normally not used when talking about body parts. They're also often not used when talking about abstract concepts or something that it is obvious that only the speaker could possess. Instead, you'll see a definite article used in Spanish, though in English translations a possessive adjective may be used. Since su be translated so many ways (his, her, formal singular your, their, formal plural your), it is sometimes helpful to use a prepositional phrase with personal pronouns or names instead. For example, the sentence Atlanta es la capital de Georgia.(Atlanta is the capital of Georgia.) is more explicitly clear than Atlanta es su capital.(Atlanta is its capital.) - Wait, whose capital? His? Hers? Yours? Theirs? Long-form possessive adjectives are used to emphasize the owner of something, to contrast one owner with another, or to emphasize a personal relationship. They must match the noun they modify in both gender and number in all forms. They are used less often than short-form possessive adjectives, but you should still know them. Long-form possessive adjectives are placed after the noun they modify. In the case of long-form possessive adjectives, you do often use an article (such as el or la) before the adjective if you are talking about a common noun."
