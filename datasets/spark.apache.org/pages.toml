["https://spark.apache.org/sql"]
title = "Spark SQL & DataFrames | Apache Spark"
description = "Spark SQL is Spark's module for working with structured data, either within Spark programs or through standard JDBC and ODBC connectors."
full_description = "Spark SQL lets you query structured data inside Spark programs, using either SQL or a familiar DataFrame API. Usable in Java, Scala, Python and R. DataFrames and SQL provide a common way to access a variety of data sources, including Hive, Avro, Parquet, ORC, JSON, and JDBC. You can even join data across these sources. Spark SQL supports the HiveQL syntax as well as Hive SerDes and UDFs, allowing you to access existing Hive warehouses. Spark SQL includes a cost-based optimizer, columnar storage and code generation to make queries fast. At the same time, it scales to thousands of nodes and multi hour queries using the Spark engine, which provides full mid-query fault tolerance. Don't worry about using a different engine for historical data. Spark SQL is developed as part of Apache Spark. It thus gets tested and updated with each Spark release. The Spark SQL developers welcome contributions. If you'd like to help out, read how to contribute to Spark, and send us a patch!"
