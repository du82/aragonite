["https://spark.apache.org/error-message-guidelines.html"]
title = "Error message guidelines | Apache Spark"
full_description = "The context provided by exceptions can help answer who (usually the user), when (usually included in the log via log4j), and where (usually included in the stack trace). However, these answers alone are often insufficient for the user to solve the problem. An error message that answers the remaining questions — what, why, and how — minimizes user frustration. Unable to generate an encoder for inner class {} without access to the scope that this class was defined in. Try moving this class out of its parent class. If the proposed fix (how) feels arbitrary, providing an explanation for why the error occurred can reduce user frustration. Function name {} is invalid. Temporary functions cannot belong to a catalog. Specify a function name with one or two parts. Not all error messages should be this verbose. Sometimes, explicitly explaining how to resolve the problem would be redundant; you may skip an explicit explanation in this case. Cannot specify frame for window expression {}. Window expression contains mismatch between function frame {} and specification frame {}. Sometimes, even explicitly explaining why the problem happened would be redundant; you may skip an explicit explanation in this case."
