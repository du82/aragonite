full_description = "For usage questions and help (e.g. how to use this Spark API), it is recommended you use the StackOverflow tag apache-spark as it is an active forum for Spark users’ questions and answers. For broad, opinion based, ask for external resources, debug issues, bugs, contributing to the project, and scenarios, it is recommended you use the user@spark.apache.org mailing list. Please see the Security page for information on how to report sensitive security vulnerabilities, and for information on known security issues. Chat rooms are great for quick questions or discussions on specialized topics. The following chat rooms are not officially part of Apache Spark; they are provided for reference only. Spark Meetups are grass-roots events organized and hosted by individuals in the community around the world. Check out meetup.com/topics/apache-spark to find a Spark meetup in your part of the world. Below is a partial list of Spark meetups. The project tracks bugs and new features on JIRA. If you'd like, you can also subscribe to issues@spark.apache.org to receive emails about new issues, and commits@spark.apache.org to get emails about commits. The ASF has an official store at RedBubble that Apache Community Development (ComDev) runs. In the store, various products featuring the Apache Spark logo are available. Our site has a list of projects and organizations powered by Spark. Add yours by emailing `dev@spark.apache.org`."
