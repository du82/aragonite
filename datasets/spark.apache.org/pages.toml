["https://spark.apache.org/spark-connect"]
title = "Spark Connect | Apache Spark"
description = "Spark Connect makes remote Spark development easier."
full_description = 'This page explains the Spark Connect architecture, the benefits of Spark Connect, and how to upgrade to Spark Connect. Spark Connect is a protocol that specifies how a client application can communicate with a remote Spark Server. Clients that implement the Spark Connect protocol can connect and make requests to remote Spark Servers, very similar to how client applications can connect to databases using a JDBC driver - a query spark.table("some_table").limit(5) should simply return the result. This architecture gives end users a great developer experience. Let’s go through these steps in more detail to get a better understanding of the inner workings of Spark Connect. The Client is responsible for creating the unresolved logical plan and passing it to the Spark Server for execution. The unresolved logical plan must be serialized so it can be sent over a network. Spark Connect uses Protocol Buffers, which are “language-neutral, platform-neutral extensible mechanisms for serializing structured data”. The Client and the Spark Server must be able to communicate with a language-neutral format like Protocol Buffers because they might be using different programming languages or different software versions. The Spark Server receives the unresolved logical plan (once the Protocol Buffer is deserialized) and analyzes, optimizes, and executes it just like any other query. Spark performs many optimizations to an unresolved logical plan before executing the query. All of these optimizations happen on the Spark Server and are independent of the client application. Spark Connect lets you leverage Spark’s powerful query optimization capabilities, even with Clients that don’t depend on Spark or the JVM. The results are sent to the client as Apache Arrow record batches. A single record batch includes many rows of data. The full result is streamed to the client in partial chunks of record batches, not all at once. Streaming the results from the Spark Server to the Client prevents memory issues caused by an excessively large request.'
year_published = 2025
clearnet = "https://spark.apache.org/spark-connect"
