title = "GraphX | Apache Spark"
description = "GraphX is Apache Spark's API for graphs and graph-parallel computation, with a built-in library of common algorithms."
full_description = "GraphX unifies ETL, exploratory analysis, and iterative graph computation within a single system. You can view the same data as both graphs and collections, transform and join graphs with RDDs efficiently, and write custom iterative graph algorithms using the Pregel API. GraphX competes on performance with the fastest graph systems while retaining Spark's flexibility, fault tolerance, and ease of use. In addition to a highly flexible API, GraphX comes with a variety of graph algorithms, many of which were contributed by our users. GraphX is developed as part of the Apache Spark project. It thus gets tested and updated with each Spark release. GraphX is in the alpha stage and welcomes contributions. If you'd like to submit a change to GraphX, read how to contribute to Spark and send us a patch!"
