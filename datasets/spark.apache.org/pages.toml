["https://spark.apache.org/improvement-proposals.html"]
title = "Spark Project Improvement Proposals (SPIP) | Apache Spark"
full_description = "The purpose of an SPIP is to inform and involve the user community in major improvements to the Spark codebase throughout the development process, to increase the likelihood that user needs are met. SPIPs should be used for significant user-facing or cross-cutting changes, not small incremental improvements. When in doubt, if a committer thinks a change needs an SPIP, it does. Any community member can help by discussing whether an SPIP is likely to meet their needs, and by proposing SPIPs. Committers can help by discussing whether an SPIP aligns with long-term project goals, and by shepherding SPIPs. SPIP Author is any community member who authors a SPIP and is committed to pushing the change through the entire process. SPIP authorship can be transferred. SPIP Shepherd is a PMC member who is committed to shepherding the proposed change throughout the entire process. Although the shepherd can delegate or work with other committers in the development process, the shepherd is ultimately responsible for the success or failure of the SPIP. Responsibilities of the shepherd include, but are not limited to: Anyone may propose an SPIP, using the document template below. Please only submit an SPIP if you are willing to help, at least with discussion. After a SPIP is created, the author should email dev@spark.apache.org to notify the community of the SPIP, and discussions should ensue on the JIRA ticket. If an SPIP is too small or incremental and should have been done through the normal JIRA process, a committer should remove the SPIP label. Appendix A. Proposed API Changes. Optional section defining APIs changes, if any. Backward and forward compatibility must be taken into account. Appendix B. Optional Design Sketch: How are the goals going to be accomplished? Give sufficient technical detail to allow a contributor to judge whether it’s likely to be feasible. Note that this is not a full design document. Appendix C. Optional Rejected Designs: What alternatives were considered? Why were they rejected? If no alternatives have been considered, the problem needs more thought."
