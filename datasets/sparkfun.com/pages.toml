information on compliance with laws or legal authorities, please see our Guidelines for Law Enforcement.PCI ComplianceSparkFun is fully compliant with the Payment Card Industry Data Security Standard (PCI-DSS) version 2.0. This standard covers the secure handling of cardholder data:Cardholder DataAny personally identifiable data associated with a credit card holder. This could be an account number, expiration date, name, address, social security number, etc. All personally identifiable information associated with the cardholder that is stored, processed, or transmitted is also considered cardholder data.Please do not send any of your cardholder data over email or chat. SparkFun passes cardholder information through our servers to our payment gateway provided by FirstData. As such SparkFun is required to complete a Self Assessment Questionnaire at level D annually. SparkFun is also responsible for quarterly automated PCI scans by an approved scanning vendor (ASV). Our current ASV is VikingCloud.Do Not Track ComplianceSparkFun complies with the Do Not Track standard for respecting the wishes of visitors who wish to opt out of tracking technologies. See our Privacy Policy for more information.RoHS ComplianceRoHS = Restriction of Hazardous Substance DirectiveWhere the symbol RoHS[checkmark] appears, the product meets the requirements set by the European RoHS Directive (2011/65/EU) up to and including amendment (EU 2015/863), to the best of our knowledge.Per a directive description:The RoHS Directive aims to prevent the risks posed to human health and the environment related to the management of electronic and electrical waste. It does this by restricting the use of certain hazardous substances in EEE [electrical and electronic equipment] that can be substituted by safer alternatives. These restricted substances include heavy metals, flame retardants or plasticizers. The Directive promotes the recyclability of EEE, as EEE and its components that have become waste contain fewer hazardous substances. At the same time, it ensures a level playing field for manufacturers and importers of EEE in the European market. const rawRequest = ""; const searchRequest = rawRequest ? JSON.parse(rawRequest) : null; const rawResponse = ""; const searchResponse = rawResponse ? JSON.parse(rawResponse) : null; const rawExecutionTime = "0"; const executionTime = rawExecutionTime ? parseFloat(rawExecutionTime) : null; const requestId = "cd58b8b4\u002D4c02\u002D467e\u002Db0ac\u002Db8c11403aace"; const rawAttributes = ""; const attributes = rawAttributes ? JSON.parse(rawAttributes) : null; const rawPageSize = "24"; const pageSize = rawPageSize ? parseInt(rawPageSize) : null; const customerGroup = "b6589fc6ab0dc82cf12099d1c2d40ab994e8410c"; window.LiveSearchMetrics = { searchRequest, searchResponse, requestId, executionTime, attributes, pageSize, context: { 'customerGroup' : customerGroup } }; require([ "https://livesearch-metrics.magento-ds.com/v0/liveSearchMetrics.js" ]); require(['magentoStorefrontEvents'], function (magentoStorefrontEvents) { if (!magentoStorefrontEvents) return; magentoStorefrontEvents.context.setSearchExtension({ version: "4.0.0" }); }); Get a Quote for I agree to the Privacy Policy to get a quote for product Customer Name Customer Email Phone Number Comment Submit'''
