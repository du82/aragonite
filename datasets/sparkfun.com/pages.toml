fications, we retain record of this fact. If you browse sparkfun.com, with or without a login, we know for a limited time that a user at your IP address has visited pages on the site. We collect data on what products and content you browse in order to offer better value to you through personalized email, and to see which products/content are the most useful to you.When and How We Send EmailWe send email to users when orders are placed, paused, shipped, or ready for local pickup. We may be in contact when an order requires payment before shipping or if other issues prevent us from fulfilling an order. We will send you email to verify your email address or if you request a password reset. We may send you email to request reviews of our products or feedback on your experience with our website, products, or customer support. We will notify users if we believe their privacy has been compromised, if it is within our power to do so. For example, if we discover a customer’s account user login information has been exposed elsewhere on the web, or if we are compelled to disclose information to law enforcement. We offer a set of opt-in email subscriptions for things such as newsletters, in-stock notifications for products, and comment reply notifications. You can control your subscriptions (when logged into your account) on the Email Notifications page. All new customers are signed up to our main newsletter by default, and SparkFun may at any time add all new and all existing customers to existing and new newsletters at our discretion. We may occasionally send you an email that you did not request or trigger with an action of any kind in order to promote a certain aspect of our site, products, or services.When you talk to our support teamsIf you email us, chat with us, or call us on the telephone for support we can and most of the time will record the interaction. This is done so for training and audit purposes and the private conversations between customers and support staff are never sold to or shared with third parties (except when a third party tool, such as email or our chat service, is used to make the interaction possible).Logging and Log RetentionIn order to understand traffic to our sites and diagnose technical problems, we log individual web requests. These logs include time of request, individual IP address, referer, and user agent strings. We may retain these logs for up to 60 days, although individually-identifying information will be obscured after one week. In order to prevent fraud and detect malicious behavior, we log IP addresses for specific actions, such as creating a customer account and placing an order. This information is automatically deleted after no more than 60 days. Except in the case of malicious traffic, we will not share log data with any third party, unless compelled by legal process to do so.Cookies, Tags, Tracking Pixels, and HTTPSWe use cookies, tags, and tracking pixels to know when users are logged in to SparkFun services and to track preferences such as display currencies and the rendering of product menus. Our analytics software, Google Marketing Platform and CrazyEgg, use tags/tracking pixels to help keep track of how many unique visitors we’re getting, where they come from, and how they navigate our site, unless you’re browsing with Do Not Track enabled. We use this information to inform site improvements. We do our best to serve all content securely over HTTPS.Third Party ServicesDo Not TrackDo Not Track is a standard for telling sites that you don’t want to be tracked. It’s aimed at sites you don’t visit directly, like advertisers and social media platforms. SparkFun supports the Do Not Track standard. While third party plugins with access to visitor browsing data are limited on sparkfun.com, all are disabled for visitors passing a Do Not Track HTTP header. This includes third party tools for analytics, live chat, and web optimization (described below).EmailWe use GMail, and mail sent to or from sparkfun.com addresses generally passes through Google’s servers. Promotional and informative mail sent to mailing lists, such as the newsletter, is sent using HubSpot. Automated mail sent from a triggering event, like a back-in-stock notification, is sent from sparkfun.com directly. All users with accounts can manage all subscriptions via the Email tab in Account Settings. All users can opt out of these lists by clicking Unsubcribe in the emails. See HubSpot’s privacy policy here.Shipping Providers and Export ControlWe offer shipping through third parties: FedEx, UPS, and the United States Postal Service (via a service called Endicia). We pass delivery addresses, phone numbers, and invoices to these companies to the extent required for quoting shipping prices and successful delivery of orders. We comply with United States export regulations and authorities. We use Visual Compliance to automatically screen billing and delivery addresses for potential export control violations. This entails transmission '
