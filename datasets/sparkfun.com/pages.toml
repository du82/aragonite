ize:cover;background-repeat:no-repeat;background-attachment:scroll}#html-body [data-pb-style=EV7T1XM]{width:8.33333%;align-self:stretch}#html-body [data-pb-style=K2DI4TV]{margin-top:20px}@media only screen and (max-width: 768px) { #html-body [data-pb-style=J646LQL]{border-style:none} }Become A Distributor Or Reseller PartnerWe’re excited to learn how we can work together – we truly value our partners!Our Distributor and Reseller Programs are two options for those wishing to partner with us. The Distribution Program is great for larger companies with a lot of purchasing power, while the Reseller Program is designed to fit the needs of companies with smaller purchasing power, including college bookstores, smaller resellers or even companies creating new products and looking for parts. To help you decide if our Distribution or Reseller Program is right for you, please take some time to think about these questions.Step 1: Determine if you are a distributor or reseller.Distributor ProgramCan You...? Place orders of $500 or more (not including shipping) each time. Purchase more than $12,000 a year. Place an order at least twice a quarter (eight purchases a year). Provide us with credit information to set up a terms account, or pay via PayPal or credit card. International accounts may also pay via wire transfer. Understand that not all products have distributor pricing. Reseller ProgramCan You...? Purchase more than $5,000 annually. Provide us with credit information to set up a terms account, or pay via PayPal or credit card. International accounts may also pay via wire transfer. Provide a reseller certificate. Understand that not all products have reseller pricing. Step 2: Fill out the application.Once we receive your completed application, someone on our team will follow up to talk about next steps and getting you signed up. If you don’t fit into either category, have further questions or would like to chat more about your business, please reach out to sales@sparkfun.com. Please also see our Volume Pricing options. We want to find a way to work together! hbspt.forms.create({ region: "na1", portalId: "2224003", formId: "ef9419e6-6f1d-4d65-b11f-b761f774a4ac" }); If you have additional questions, please email sales@sparkfun.com..background-image-67b247343997a {background-image: url(https://www.sparkfun.com/media/.renditions/wysiwyg/footerpages/BecomeADistro/BecomeADistributorHeader.jpeg);} const rawRequest = ""; const searchRequest = rawRequest ? JSON.parse(rawRequest) : null; const rawResponse = ""; const searchResponse = rawResponse ? JSON.parse(rawResponse) : null; const rawExecutionTime = "0"; const executionTime = rawExecutionTime ? parseFloat(rawExecutionTime) : null; const requestId = "e693b268\u002D62df\u002D4211\u002D9021\u002Df8002eb5a20d"; const rawAttributes = ""; const attributes = rawAttributes ? JSON.parse(rawAttributes) : null; const rawPageSize = "24"; const pageSize = rawPageSize ? parseInt(rawPageSize) : null; const customerGroup = "b6589fc6ab0dc82cf12099d1c2d40ab994e8410c"; window.LiveSearchMetrics = { searchRequest, searchResponse, requestId, executionTime, attributes, pageSize, context: { 'customerGroup' : customerGroup } }; require([ "https://livesearch-metrics.magento-ds.com/v0/liveSearchMetrics.js" ]); require(['magentoStorefrontEvents'], function (magentoStorefrontEvents) { if (!magentoStorefrontEvents) return; magentoStorefrontEvents.context.setSearchExtension({ version: "4.0.0" }); }); Get a Quote for I agree to the Privacy Policy to get a quote for product Customer Name Customer Email Phone Number Comment Submit'''
