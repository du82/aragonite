["https://spatialsample.tidymodels.org/reference/reexports.html"]
title = "Objects exported from other packages — reexports • spatialsample"
description = """
These objects are imported from other packages. Follow the links
below to see their documentation.

  ggplot2
autoplot


  rsample
analysis, assessment, get_rsplit"""
