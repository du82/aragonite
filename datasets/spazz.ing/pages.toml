full_description = '''Forged by Regret 20 Dec, 2024 I embrace regret. It marks the path to wisdom, as the pain of past mistakes and lost opportunities forges stronger character. The siren song of quick fortune tempts even the strongest souls, yet wisdom alone serves as our compass. Daily, I reflect on opportunities squandered and the pain I caused loved ones. This reflection teaches that only through dedicated work can we redeem our losses. The strength to maintain course seems finite, but I reject this limitation. Willpower, like other human virtues, is boundless—we merely allow our ego to construct artificial barriers. Those who squander opportunities walk a harder path than most. Yet this trial by fire reveals essential truths: it shows us not what we wish to be, but what we must become. In this crucible, we confront questions and realities we might otherwise avoid. 1 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
