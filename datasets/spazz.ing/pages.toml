full_description = '''what and why 30 Aug, 2024 I have always embraced a rather unique, chaotic and unpredictable approach to my writing. Thru this blog you will be able to take a peek into a mind that revels in the beauty of randomness and the unexpected, which rejects the notion of linear thinking or the boredom of a carefully structured narrative or the suffocation brought about by rigid patterns. Ideas must bounce and ricochet off one another in a delightful dance of spontaneity, no? I want my writing to be viewed as a playground for intellectual exploration, where each post joyfully guides the reader into uncharted mental territory. I suppose it could be said that all I'm trying to say is that the joy of blogging for me, does not lie in hitting certain milestones with it, but in the exhilaration of the journey of writing itself, taking me thru the labyrinth of my own thoughts. 2 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
