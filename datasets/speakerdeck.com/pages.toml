["https://speakerdeck.com/chriscoyier/what-we-dont-know"]
title = "What We Don't Know - Speaker Deck"
description = "On any given request for our website there are loads of unknown factors. One of the more obvious unknowns is the browser. There are lots of techniques and tools we can use to ensure good experiences across any browser. But we also don't know about the person. Who are they? Where to they live? What are they thinking? We should be admitting that we don't know those things either. And how does that person interact with their browser? And how does that browser interact with the server behind our website? These are all unknowns. The first step is admitting it and the next is embracing it."
