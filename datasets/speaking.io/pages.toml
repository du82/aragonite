["https://speaking.io/design/software"]
title = """
Software –speaking.io"""
description = "Public Speaking things"
full_description = "Software One of the questions I get asked a lot is: “What software did you use to make your slides?” I reply back with: “Emacs”. Just kidding, no one uses Emacs. Luckily for you there’s only one legitimate answer to this question, and it depends entirely on your life outlook. Are you using Windows? Use PowerPoint. Are you using OS X? Use Keynote. I’m a huge fan of Keynote, and it helps me create beautiful slides. But well- designed slides have virtually nothing to do with what software creates them. Well-designed slides are simple and clear. Those traits can be found in Keynote, PowerPoint, MS Paint… whatever you’ve got lying around. Alternative Software For most people, Keynote and PowerPoint are going to be the traditional routes to take. You won’t want to stray too far from this gold standard. If you are interested in alternatives, there are plenty. Here’s a few: Showoff lets you write your slides in Markdown, JavaScript, and CSS. It’s a great option if you’re looking to do live demos of web software, particularly if you want up-to-date data or possibly some interactivity with your audience. impress.js is an option if you are easily swayed by fancy moving animation and junk. I’ve also seen people type things into a plain text editor and crank up the font size. Sometimes simple is all you need. Remember: the clothes don’t make the (wo)man, and the software doesn’t make the slide deck. Well, software literally does make the slide deck, but you get the point."
