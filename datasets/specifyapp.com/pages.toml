["https://specifyapp.com/blog/specify-to-gitlab"]
title = "How to sync design tokens from Specify to GitLab | Specify"
description = "Learn how to pull design tokens from Specify in your GitLab repository using GitLab CI/CD."
full_description = '''Specify helps you collect design data from Figma and distribute it in the right format, in the right project, at the right time, and to top it all: automatically. In this article you'll learn how to synchronize design tokens from Specify to your GitLab repository. We're about to sync design tokens as CSS Variables. Looking for another output format? Feel free to check all our other configuration templates (React Native, CSS, Tailwind...) and you can find our full parser list here. We will pull design tokens and assets from several Specify repositories and generate them as CSS Variables in a single GitLab repository thanks to the Specify CLI. Generate public and private SSH keys. We need them to authorize the CI machine to push to your GitLab repository Authorizes our virtual machine to push to our GitLab repository by setting SSH private and public keys (see code) Advice: When you're prompted to "Enter a file in which to save the key" name your file id_gitlab so you don't override a potential existing file already named ed25519. Add each of them with their respective variable name set in .gitlab.ci.yml: SSH_PRIVATE_KEY and SSH_PUBLIC_KEY. Don't forget to delete your private and public SSH keys on your machine. Now they are encoded in base64 in our GitLab repository CI/CD variables we don't need them anymore. Set your Specify personal access token as a CI/CD variable named SPECIFY_TOKEN (Settings > CI/CD > Variables). Now, let's define a CRON job in your GitLab repository CI/CD settings that will run our generate_design_tokens job: This job runs a create_merge_request.sh file which uses the GitLab API to create a merge request on your GitLab user behalf. Add it in your GitLab repository CI/CD variables. Name it GITLAB_PRIVATE_TOKEN. Disable the "Protect variable option" and enable "Mask variable" Now go back to your Schedules page and run your "Generate design tokens" schedule by hitting the "▶️ Play" button again. Our 2 jobs generate_design_tokens and create_merge_request will be exectued one after the other and you should get a new merge request created containing your design tokens.'''
year_published = 2025
clearnet = "https://specifyapp.com/blog/specify-to-gitlab"
