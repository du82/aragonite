full_description = "Discover the latest news, tips and user research insights from Specify. You’ll learn about design tokens, design systems and Design APIs best practices. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices. In this post, we will explore the role of design tokens and assets in a design system. As we all know, design systems are an essential part of modern software development. We are happy to announce that Specify has obtained both SOC 2 Type II and SOC 3 certificates! These certifications are a testament to Specify’s commitment to security and data privacy. Learn how to sync Figma Styles and Variables to Specify by using the Specify Widget in your Figma file. Talking with our customers these busy days before Christmas feels like a sneak peek into 2024 – the excitement, the plans, but yes, also the shared challenge we noticed related to reaching top notch quality of their digital platforms. Embark with us on a captivating exploration of the future of design systems and explore how design systems will evolve thanks to AI. Learn how to sync your design tokens from Tokens Studio to GitHub and transform them as CSS Variables using the Specify CLI in a GitHub Action Demystify the synergy between Figma Variables, Figma Styles, and Tokens Studio—a trio of ways composed to develop your design token workflow. Avoid complexity w