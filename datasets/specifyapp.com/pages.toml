["https://specifyapp.com/blog/specify-design-token-format"]
title = "The Specify Design Token Format (SDTF) | Specify"
description = "The Specify Design Token Format enables compatibility between design and code-type sources and destinations. The possibility this format unlocks are endless."
full_description = "Following up on the tendencies in the market around Aliases, Modes and of course by following our own vision - increasing collaboration between designers and engineers - we have decided to build an entirely new Design Token Format to base our platform on new design token graph. In short, this means that we are developing a format to enable compatibility between design and code-type sources and destinations. The new graph will facilitate managing a large number of design token types and asset management. Next to this, it opens doors to more advanced features such as Aliases, Modes, and Collections. Design tokens are a common language and design decisions that form a system — in the form of UI characteristics. This might include things like colors, spacing, typography, radii, and even animation. They are the structure and manifestation of your brand and of your visual language. At this moment all of them may have a different format, making it hard to work with. Read more on our blog. Formats of Design Tokens have been a point of discussion as long as design tokens have existed. Having multiple formats makes it harder to connect certain tooling, maintain your tokens, and create that single source of truth that every designer - and engineer - dreams of. Over the last years, a couple of initiatives have been established to create standardization and compatibility of different formats - think about W3C and DTCG that will be groundbreaking for the way all platforms handle tokens and their formats. As mentioned Specify has been working hard to create our 'new graph' within our product. This new graph will help us in the future: Today we are launching our Beta version of the new graph and we would love for you to test it, you can sign up here! Update (this feature is out of beta - Try it out today →) Our new graph brings a large amount of new design token types allowing a more precise categorization than before. Going from 12 token types to 54, the Specify Design Token Format provides more flexibility and possibilities for you and your team to organize yourself and share your design decisions across your organization. As you can read below, this new format is following the DTCG (Design Token Community Group) standard, however, we wanted to push even further than that. Assets, such as fonts or vectors are highly needed when building and using a design system. Therefore, we emphasized adding support for assets as well, so you can use, convert, optimize, and optimize them according to your needs—automatically."
