["https://specifyapp.com/blog/specify-to-bitbucket"]
title = "How to sync design tokens from Specify to Bitbucket | Specify"
description = "Learn how to pull design tokens from Specify in your Bitbucket repository using Bitbucket pipelines."
full_description = "Specify helps you collect design data from Figma and distribute it in the right format, in the right project, at the right time, and to top it all: automatically. In this article you'll learn how to synchronize design tokens from Specify to your Bitbucket repository. We're about to sync design tokens as CSS Variables. Looking for another output format? Feel free to check all our other configuration templates (React, Tailwind, Style Dictionary...). We will pull design tokens and assets from several Specify repositories and generate them as CSS Variables in a single Bitbucket repository thanks to the Specify CLI. We pull design tokens from several Specify repositories from the same example organization called @acme-inc: General, Light-Theme and Dark-Theme. (See code ↗︎) We create a Pull Request on a new branch called specify targeting the master branch (See code ↗︎) Set a repository variable named SPECIFY_TOKEN that contains a Specify personal access token (Create one here ↗︎). You can also set it as a workspace variable ↗︎ instead to use the same Specify token across several Bitbucket repositories. (4) Set a repository variable named APP_PASSWORD that contains the value of a Bitbucket app password (Create one here ↗︎). This helps you use the Bitbucket REST API on your user's behalf to create a Pull Request. (5) Your pipeline automatically runs after updating your bitbucket-pipelines.yaml file. You can also go to Pipelines > Run pipeline to run your pipeline manually. We used the Specify CLI inside a Bitbucket pipeline to generate design tokens on a branch called specify. Then, we used the Bitbucket REST API to create a pull request from the specify branch to the master one. Now, every time your design data is updated on Specify, you'll receive an automated pull request on your Bitbucket repository ⚡️ These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret."
year_published = 2025
