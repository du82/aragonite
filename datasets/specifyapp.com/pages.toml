title = "How to pull design tokens from several Specify repositories in GitHub | Specify"
description = "Learn how to sync your design tokens from several Specify repositories to GitHub."
full_description = '''This article will help you pull design tokens from several Specify repositories to your GitHub repository. You could benefit from this if your need to implement Specify in your monorepo or if you want to pull design tokens from several repositories like a "Light Theme" or a "Dark Theme" one. By default, The Specify GitHub App only works with a single .specifyrc.json at the root of your GitHub repository. A Specify configuration file can only pull design data from a single Specify repository. Our workflow is based on a GitHub Action that automatically pulls design tokens from Specify. If your Specify and your GitHub repository differ, a new PR will be opened containing your updated design tokens. It pulls design tokens from several Specify repositories from the same example organization @acme-inc: General, Light-Theme and Dark-Theme Then, set a new repository secret called SPECIFY_TOKEN containing your Specify Personal Access Token in your GitHub repository: Settings > Secrets > Actions. This article focuses on how to automatically pull design data from several Specify repositories in GitHub. The Specify configurations we used may not generate what you're looking for. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices. In