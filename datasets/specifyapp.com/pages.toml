["https://specifyapp.com/blog/how-to-build-a-career-framework-at-your-company"]
title = "How to build from scratch a Career Framework for your company (a step-by-step tutorial) | Specify"
description = "A simple step-by-step tutorial to create your first Career Framework for your company to increase employee engagement and retention."
full_description = "In these times of crisis, silence quitting, and massive layoffs, the priority is no longer recruiting new talents but retaining the ones you already have. One of the biggest retention and engagement factors that make an employee stay is the certainty of career progression, and a career framework will help your organization do just that. This tool or document will allow your employees to know exactly where they stand in your company (level), give a vision of the future (progression), and keys on how to take the next step (development plan). In addition to all this, you will be able to use this tool to navigate your performance reviews, determine the missing skills (for training or recruitment) and better visualize the development plan of each of your employees. In this article, I will share my vision and guide you step by step in creating your career framework. Which problems are you trying to solve with your career framework? Are you jumping both legs into this project, or did you take the time to build the foundations of such a project? Here are some questions that will help you clarify your needs and help you make better and faster decisions on how to build your new career framework: Is it meant to be used by managers as part of their performance management process, by employees, or both? My recommendation: build the baseline of your career framework first on a tool such as Google Sheets. It will allow you to build a tool that will help your employees. Further down the line, you can always upgrade to a specific tool. If so, you would've just needed to copy past the content. Decide a nomination for every level. It doesn't matter what you pick. Ensure it's organized enough to link it to any other database, such as the salary grid. Write all the job names per seniority (ex: Senior PM) and assign them a level (ex: IC4). Note that every job name is unique, but the leveling is common to every department. I recommend creating two paths, one for the Individual Contributor (IC), and the other for the Manager (M). Then, to make the leveling, put a number next to the letters such as IC1, IC2, IC3, etc. Take your time thinking about it, decide what works best for your company, and stick with it."
