["https://specifyapp.com/blog/notion-as-destination"]
title = "Notion as a destination | Specify"
description = "Notion as a destination makes documenting and maintaining your brand guidelines easier and more reliable because the tokens will always be up to date."
full_description = "Documenting your design system is one of the tasks that is a real investment. The only way documentation works well is if it's clear, precise and to be understood by all the stakeholders. If you're into designing and documenting, this would sound like a job for you. However, if you're mainly into designing, documenting your system might seem like an endless task. In any case, you're probably looking for the best way to document your design systems including your design tokens. Well, we at Specify have some news for you! We have decided to combine the best of both worlds - up-to-date design tokens (Specify) and flexible documentation tooling (Notion) to keep you design tokens updated and documented. What's not to love? As mentioned on the Notion website: Notion is a single space where you can think, write, and plan. Capture thoughts, manage projects, or even run an entire company - and do it exactly the way you want. At Specify we love Notion! It's just as flexible as we wish a documentation platform should be. So why not document you design system in Notion? Specify will make sure it's automatically updated - the Notion 'magic' will make sure you can document in any way you like. Any design system makes use of design tokens, and generally design tokens are documented in dedicated Design tokens pages that includes all of the tokens, in addition to information about design tokens in general. By using Specify's Notion as a destination you can make sure the design token you want to make available to everyone - is updated automatically. The design data will be coming from Figma and the integration helps you to synchronise colors, text styles, measurements, vectors and bitmaps. This makes documenting and maintaining your brand guidelines easier - and maybe even more important - more reliable because the tokens will always be up to date. Collect, synchronize and document all your design decisions from Figma to Notion in minutes. You connect your Notion account, select the page you want to sync to, and you're done. Specify offers you a design system Notion Template making sure that you have a good basis to start off with. This template can be adopted and customized as your own. You can also start from scratch and have your design tokens and assets synced with any page you like within Notion."
year_published = 2025
