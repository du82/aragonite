["https://specifyapp.com/customer-stories/improving-handover-sp500-company"]
title = "Improving the handover of design tokens at an S&P 500 company | Specify"
description = "Learn how an S&P 500 company uses Specify to sync their design tokens and assets within their design system."
full_description = "Yep, correct. We kind of have the same role, the main difference is that we work on different parts of our application. One of the challenges that we face and obviously any design system faces, is the translation between what the designer's eye is in the tool that they are using, down to the translation layer for the developers. For example, before using Specify, my application had 39 different shades of grey and we were only using 8. I can't help but imagine the efficiency and cohesion Specify would have brought to the initial team that worked on the application before I joined the team. In the ideation process, the design part happens before the development. When we were brought on to build this design system, a lot of the ideation had already started. Designers already knew they wanted to use design tokens and they had expectations of how that would be implemented. But from a development standpoint, you have to get into all of the granular complexities of how to use design tokens. We thought about creating our own solution at first until we saw Specify. We understood Specify was the connective tissue between high level complex ideation and granular implementation. It is an efficient tool that takes complex design rules and turns them into data structure we can consistently use across multiple applications with different technology stacks. “Specify is an efficient tool that takes complex design rules and turns them into data structure we can consistently use across multiple applications with different technology stacks.” The fact that we have this “connective tissue”, as Alex called it, and that having it be so easy, especially with the way that your parsers function is working, the way that you guys are always adding new ones and keeping the current ones up to date, and the additional features that you just roll out so frequently. We don’t have a manual process where if somebody's tired, they misalign and they grab the wrong color and then all the tokens are off. Specify just really removes so much of that risk."
