["https://specifyapp.com/changelog"]
title = "Changelog | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "Once you have synchronized your text styles in your repository you are now able to upload your font files manually and extract them through available destinations using our parsers technology. Following early April SDK improvements we decided to release the 1.0 version officially thanks to your valuable feedback! It's a huge milestone for us and we can't wait to show you what we are cooking next. We spent the last couple of months improving the SDK by adding more features, flexibility and ease of use. You have full control on the manipulation of your design token by generating a custom output that fits your company standards. And because every good tools come with a useful documentation, we released a brand new one to help you use all the tools provided by Specify. Specify is dedicated to provide all the tools needed to generate the output needed by your company standards. We recently released: Head toward our documentation to see all available parsers 👉 https://docs.specifyapp.com/reference/parsers We gave a new look to the cards of your Specify repositories! You now have access to quick information such as the connected apps or the number of tokens stored. We also have updated the way we handle aliases across several shared Figma libraries for your variables and styles. Previously we only retrieved the raw values, now we provide the option to have the alias(es) linked when you synchronize your sources. It’s now possible to collect your bitmap from your Design System and use Specify to distribute them to any stack you need thanks to our parsers. Once collected, You can extract them trough the SDK or send them directly to your GitHub repository. It’s now possible to have your Variables or Styles values being variables from different Libraries. Specify will display these variables with raw values for now. The next step we are working on is to keep the aliases, meaning keeping the link between your variables instead of getting their raw values. You requested it, and we added it! You can now download your vectors directly from Specify. You are one button away to get what you need! 🙂"
