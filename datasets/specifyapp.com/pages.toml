["https://specifyapp.com/customer-stories/how-nortal-use-specify"]
title = "How Specify helps Nortal get more clients | Specify"
description = "Learn how Nortal, an agency, uses Specify to improve their value proposition and get more clients."
full_description = '''Nortal is a trusted strategic partner for healthcare institutions, governments, leading businesses, and Fortune 500 companies. My job is head of design systems. I look after the parts and practices that define how we manage design at scale. And in terms of Nortal, I have two roles. One is with Nortal Global and trying to implement an organization-wide design system and the other role is creating a design system for a cognitive city in Saudi Arabia. Firstly, we have always needed help communicating design tokens between the design system and product teams. As a result, people would use them inconsistently. Secondly, naming tokens and aligning everyone on the same naming convention was also an issue. For example, some people would name all their surface layers logically, while others would not. Some people would have semantic color for typography. Some people also gave generalized descriptions of colors like "this is blue," "this is blue light," or "this is blue-50". It was very difficult to get any standardization. The design system team that I run has benefited from Specify by being able to add it as a benefit to our proposition for our clients. We can now say that we have a design data API as part of our architecture. If we do not have code available for our clients, they can still use the design tokens we provide them in whichever format they need. Previously, creating and generating design tokens was always a very manual process. It was something that we kept out of the proposition deliberately because it always outweighed the value or benefit that it brought to the team. So for us, it has added a layer of benefit to our proposition and helped us sell design systems and gain adoption by more technical teams. The impact on the people in my team, specifically working on design systems, has been absolutely fantastic. Thanks to Specify, the mindset of the whole team has evolved, and it's really changed how everybody thinks about how they approach component design and development. It has helped them get all focused and really crisp on exactly what semantic tokens to use.'''
year_published = 2025
