["https://specifyapp.com/blog/notion-design-system-documentation"]
title = "The future of design system documentation | Specify"
description = "We're shaping the future of design system documentation with Figma and Notion. Learn the behind-the-scenes and get a sneak peek of what's next at Specify."
full_description = "Earlier this year, we unveiled our vision to build the world's first Design Data Platform. The team is going one step forward to that vision, experimenting with new apps — starting with Notion. In this post, I share why we're experimenting with Notion, how we plan to ship it, and what it means for the future of design system documentation. After the public launch last February, we've been hard at work onboarding teams and helping them unlock the power of our Design API. We had insightful conversations with prospects and customers, and design system documentation appeared to be a nutshell to crack for many. The problem? Either design teams have to use a dedicated tool that takes time to set up, maintain, and adopt; Either they do it manually or don't document their design system at all. We're on a mission to help your design and engineering teams build better products faster, so we started exploring solutions. We embrace simplicity. So, when we started thinking about what a design system documentation tool would look like, Notion instantly came to mind. Notion is a minimal and unified workspace for teams. It's a company encyclopedia. Here at Specify, we use it to share knowledge — team playbooks, meeting minutes, and more. We document every new learning in Notion — why not document our design system? The more we thought about it, the more sense it made. You don't need another tool to document your design system. Keep it simple, and get the most out of your existing stack. Experimenting with Notion also is a community-driven decision. It's one of the most requested apps by our community. So, when the Notion API went out of beta, we made a quick running prototype and shared it on Twitter. We were overwhelmed by all your positive reactions. It led us to explore all the opportunities for design system documentation in Notion. We spent the last months researching and prototyping what design system documentation could look like in Notion. We conducted user research, ran usability tests, and started building. We really wanted to ensure we do it right, so we're taking our time to nail it."
year_published = 2025
clearnet = "https://specifyapp.com/blog/notion-design-system-documentation"
