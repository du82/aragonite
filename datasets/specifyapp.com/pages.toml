title = "How to sync design tokens in your GitHub monorepo | Specify"
description = "Learn more about how to sync design tokens as CSS Custom Properties to your GitHub monorepo."
full_description = "In this article you’ll learn how to generate CSS Custom Properties from design tokens in Specify and sync them to your GitHub monorepo. Specify is a design token engine which offers an API. This means you can request tokens from Specify while transforming them or their organizational structure along the way. Folder in your GitHub monorepo containing a Specify configuration file which targets a specific Specify repository (e.g., .specifyrc-a.json targets the “Product A” repository). As you can see we’re essentially doing the same thing 3 times. We’ll focus on how to sync design tokens as CSS Custom Properties in a single folder. Once we have something working, we’ll replicate our working flow for the remaining products (B and C). The Specify CLI helps you get design tokens and assets from Specify right from the terminal or even in a CI/CD pipeline. The Specify Design Token Engine is powerful but you need to ask him what to generate for you so you get design tokens and assets that match your needs. In our case we want our colors, spacing and text styles to be pulled and generated as CSS Custom Properties. Set the Specify repository we're pulling design data from. In our case we're pulling design data from the all-design-data repository created in the @acme-inc organization. The Specify GitHub app helps you distribute your design tokens and assets from your Specify repository to your GitHub repositories. Every change detected in your Specify repository creates a Pull Request in your GitHub repositories. Replace the content of the .specifyrc.json file in the PR by the content of the .specifyrc.json file we used with the CLI. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. One of the fundamental aspects 