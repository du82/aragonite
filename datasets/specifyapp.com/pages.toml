title = "Landing revamping | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "At last! We've finally released a new version of our landing page. The previous one was starting to feel a bit dusty as it was made specifically for the announcement of the DSP format in partnership with Adobe. And yes, this new landing is also community driven. Its release is consistent with our recent sponsorships of two famous conferences about design systems: Into Design Systems and Clarity. After deleting a source from your Specify repository, a new PR removing all corresponding design tokens will open on your GitHub repository. Fixed a bug that prevented the redirection to the error page when a user tried to login with a wrong account Fixed a bug where the text-decoration property was sent as an array and not as a string in the to-scss-mixin-text-style parser Added the following CSS properties to the to-scss-map parser: text-transform, text-align, vertical-align, text-decoration and text-indent"
