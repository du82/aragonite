["https://specifyapp.com/customer-stories/how-dashlane-uses-specify"]
title = "Driving smooth and automated handovers at Dashlane | Specify"
description = "Learn how Dashlane gained clarity and confidence by using Specify while building and utilizing their design system."
full_description = "Dashlane is a Password Manager. In case you have never used one, we do 4 main things: generate, capture, autofill and monitor passwords for you — so you don't have to worry about that tedious aspect of browsing the internet. Today, we serve a bit more than 20k companies and over 18M individuals have an account with us. You can find our apps on every major platform, web, Android and Apple products. Dashlane has more than 300 employees based in France, Portugal and the US. I'm a Senior Product & System Designer. I've been working at Dashlane for over 4 years, and in January 2022 I joined the newly created Design System team. Amongst the many challenges of a design systems team, we have spent a lot of time - and still are - improving the way we distribute tokens across our entire product. Our Design System team is a year and a half old — it is composed of seven people. Besides dealing with a lot of design and tech debt, we were mandated to focus on three major goals: In regards to design tokens, I can say that we started off pretty naive and challenges quickly popped up. Here's an overview of how we first handled our design tokens and the hand over processes we had with our engineering team: We originally had a simple color palette. We published a Figma library, sent the file to engineers to replicate in code, and called it a day. We didn't feel the need for any automation at this point because a palette is not the sort of data you update frequently. Later on however, it turned out the palette was not enough. Designers were creating custom colors wherever they felt the existing ones weren't working well enough, and mobile teams were painfully maintaining a clunky dark theme through color pairs they regularly had to override. These two main pain points got us working on proper color theming. We started off with a light one, and then obviously went off to build the dark one as well. Along the way, we realized we could easily provide a color debugging theme, as well as one for the website. So we did!"
