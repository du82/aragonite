["https://specifyapp.com/customer-stories/how-pelostudio-use-specify"]
title = "How Specify helps Pelostudio start new projects | Specify"
description = "Learn how Pelostudio uses Specify to start new projects more rapidly and how Specify improved their workflow."
full_description = "Pelostudio is helping startups and scale-ups to grow their brand and their product. From product to design & developing branded websites, we partner up with our clients as their own remote design team. In this post, Alexis (Lead Frontend Developer) and Clémence (Lead Product Designer) share why and how their team benefits from Specify. On the engineering side, we had issues gathering and creating all the styles for every new projects. Seeking them in Figma, creating them in CSS, getting the right font files and converting them from ttf to woff/woff2. We used to do everything manually which was obviously error-prone and time consuming. Before using Specify, our Figma files were a bit messy. We didn't use styles in Figma even if we knew about the potential impact it had on developers during handoff. Configuring a new project used to take a whole day. Now it's a 1 or 2 hour process. From now on, we start all our new projects with Specify which gives our team more time to focus on what really matters: specific work for our clients. Our team feels more confident working with developers. Specify improved the way we work as a design team. It brought us discipline and we're more autonomous as well. We defined best practices to organize ourselves in Figma and be more efficient. Specify was flexible enough to let us organize ourselves the way we wanted without getting in the way. Autonomy for the whole team. At the beginning Alexis and I were both referent on Specify. But now the whole team is comfortable with it it gives us autonomy especially when we start new projects. As designers we have more flexibility to iterate on our UIs and developers can work on things that have more value for our clients than manually updating colors or other types of design tokens. Specify is now part of the stack we use for every project like FontAwesome or GSAP. When we sell recurring development benefits to our clients we explain them they'll be charged for things like hosting, GSAP and also Specify."
