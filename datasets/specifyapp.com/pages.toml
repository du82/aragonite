["https://specifyapp.com/changelog/a-more-flexible-login-system"]
title = "A more flexible login system | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "When we launched this new version of Specify more than a year ago, we decided to focus our efforts on Specify's core value: design tokens and assets synchronization within a design system. This is why we decided to base our login system on Google Suite. A lot of water has flowed under the bridge since then. Many teams have been requesting a more conventional way to log into Specify. This is especially useful if you are an organization needing to manage several teams using different email domains and working on different brands. We've improved the extraction of measurement design tokens. Before you could only define previews of your measurements inside a frame. From now on, you can document them more properly by adding anything you want like their name for instance. Specify will only extract the width of the rectangles acting as the previews of your measurements. See our updated measurements frame in our Figma file example. You can now extract more informations about assets. Specify now synchronizes their description, frame name, parent frame name and page. This is useful if you want to categorize your assets into your design system and display their description. Fixed bug which set a wrong file extension to font files assets when using certain parsers. Thanks Alexis!"
