["https://specifyapp.com/blog/introducing-figma-variables-translator"]
title = "Introducing Figma Variables Translator | Specify"
description = "Learn to manage and automatically translate your String variables in any language with our Figma plugin."
full_description = "Last month at Config 2023, Figma released their new Variables feature, a native design token management system. The feature is currently in beta and offers users many possibilities, such as content and translation process management. However, without automation. And that's exactly where our Variables Translator plugin comes in. Let's have a look at Figma Variables and what our plugin can add for you. Variables store values that can be reused throughout your designs. There are various types of variables, such as colors or numbers, and the one we are focusing on for this article is the String type. We can manage our content by creating a variable containing multiple translation values and assigning it to text. A collection is a set of variables and modes that can be used to organize related variables together. We could easily imagine having multiple collections, one for managing colors and another for managing our text content. Or we could separate different types of text content into different collections. In our example, we will create a single collection containing all of our texts. You can make it easier to find and access all your variables by grouping them into collections. For example, you can group them by page or component. If you want to create a group, name your variables like this: groupName/variableName — this will create the group in Figma. A mode is a list of values for a variable in a collection, storing one value per variable. Modes also represent the different contexts of our designs. If a variable has multiple definitions, each definition is associated with a mode. When the variable is applied to a layer's property, the layer expresses the value based on the mode it's currently in, allowing us to switch our designs between contexts quickly. In our case, each language will be a mode and will contain the translated value of our variable. For example: if we want to translate our app into 3 languages (English, French, Dutch), then each of these languages would be a mode."
