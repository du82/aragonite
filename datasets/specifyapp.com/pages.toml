["https://specifyapp.com/blog/inside-specify-3"]
title = "Inside Specify #3: Welcome to Alexis & Khalil | Specify"
description = "Learn more about two of our new team members: Alexis who joined us as a People Manager, and Khalil who joined us as a Software Engineer."
full_description = "Today, we're continuing our series about the people that are building Specify. For the last couple of months, many new people have joined our team. In this post, you'll be able to learn more about two of them: Alexis and Khalil. Alexis is a HR Manager passionate about personal development and new technologies. In his free time, he likes to play sports, cook, go on adventures with his friends and enjoy his notable addiction to peanut butter. He began his first professional experiences while completing his Master's degree in Human Resources research. He first worked in Bordeaux as a Tech and Creative Recruiter for a Consulting Company (Maltem) and a large French Video Games studio (Ubisoft). He then joined PlayPlay (a fast-growing SaaS startup) in Paris as a Business Recruiter for more than a year. Alexis wanted to move away from full-time recruitment and engage in general HR duties by integrating Specify as People & Culture Manager. Originally from Tunisia, Khalil moved to Paris recently and enjoys life here. He’s a curious person, eager to learn, looking to take on challenges each day to help him grow both personally and professionally. Working now as a Software Engineer, he's always been interested in DevOps Engineering and learning about it each day. Before joining Specify, he was freelancing as a Software Engineer with NTT which was his first experience after graduation, it helped him expand his knowledge about serverless technology with AWS and what kind of behavior needs to be shown in the professional field. Besides that, he had several internships with startups that helped him make up the person he’s today. He likes investing his free time in several hobbies. He enjoys competitive programming and playing video games, especially Battle Royale ones with friends to have a good laugh and seek for victory as a squad. Khalil recently worked on our Destinations page revamp. From now on, you can connect your Specify and your GitHub repositories to get automated pull requests."
