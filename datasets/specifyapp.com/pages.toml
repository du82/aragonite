["https://specifyapp.com/blog/seed"]
title = "Specify raises €4M seed round to build the first Design Data Platform | Specify"
description = "We are excited to announce our €4M seed funding round."
full_description = "We’re excited to announce our €4M seed funding round, led by Eurazeo alongside our historical investors BPI F3A, 360 Capital, and Seedcamp. We’re also glad to have Clément Vouillon, co-founder of MemoHub, and Didier Forest, Creative Partner at eFounders, as angel investors on this round. We raised this round to help organizations manage their brand identity at scale by offering the industry's first Design Data Platform. Louis, Antoine, Pierre-Antoine, and I, Valentin, created Specify more than three years ago, in 2018. We met each other during our studies, in 2014, in a school called HETIC near Paris. We were already passionate about the Internet, web design and development, and always looking for best practices used in the industry. It was the rise of Atomic Design, the arrival of Sketch in our lives, and all the collaborative tools associated with it. We were frustrated with how digital products were created and maintained with our respective backgrounds as front-end developers, software engineers, product managers, and product designers. In 2017, we started digging into the topic and interviewed dozens of teams. Sometimes, the term Design Systems came up, and sometimes not. But it didn't matter: maintaining interfaces with the brand language in mind had become a common issue. Digital has evolved so much in recent years that organizations now face challenges not only in the speed of digital product development but also in brand experience consistency. For small organizations, it's about iterating quickly. For larger organizations, it's about maintaining a consistent brand experience across their products and platforms, varying from a simple website, a SaaS application, or even mobile/tablet/watch applications. Organizations need to adapt to the increasing complexity of building and maintaining digital products while offering users a delightful experience. That is why product teams are scaling up to follow the pace. The number of designers and developers has never been higher."
