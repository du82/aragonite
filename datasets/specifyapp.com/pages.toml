description = "Learn how to pull design tokens from Specify in your Azure DevOps repository using Azure DevOps pipelines."
full_description = "Specify helps you collect design data from Figma and distribute it in the right format, in the right project, at the right time, and to top it all: automatically. In this article you'll learn how to synchronize design tokens from Specify to your Azure DevOps repository. We're about to sync design tokens as CSS Variables. Looking for another output format? Feel free to check all our other configuration templates (React, Tailwind, Style Dictionary...). Also, please make sure to enable the 'Contribute to pull requests', 'Create branch' and 'Create tag' permissions in your repository security settings. We will pull design tokens and assets from several Specify repositories and generate them as CSS Variables in a single Azure DevOps repository thanks to the Specify CLI. We pull design tokens from several Specify repositories from the same example organization called @acme-inc: General, Light-Theme and Dark-Theme. (See code ↗︎) Set your Specify personal access token as a pipeline variable named SPECIFY_TOKEN (Pipelines > Name of your pipeline > Edit > Variables) We used the Specify CLI inside an Azure DevOps pipeline to generate design tokens on a branch called specify. Then, we used the Azure CLI to create a pull request from the specify branch to the main one. Now, every time your design data is updated on Specify, you'll receive an automated pull request on your Azure DevOps repository ⚡️ These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices."
