full_description = "Information Security ProgramWe have an Information Security Program in place that is communicated throughout the organization. Our Information Security Program follows the criteria set forth by the SOC 2 Framework. SOC 2 is a widely known information security auditing procedure created by the American Institute of Certified Public Accountants. Third-Party AuditsOur organization undergoes independent third-party assessments to test our security and compliance controls. Roles and ResponsibilitiesRoles and responsibilities related to our Information Security Program and the protection of our customer’s data are well defined and documented. Our team members are required to review and accept all of the security policies. Security Awareness TrainingOur team members are required to go through employee security awareness training covering industry standard practices and information security topics such as phishing and password management. ConfidentialityAll team members are required to sign and adhere to an industry standard confidentiality agreement prior to their first day of work. Cloud Infrastructure SecurityAll of our services are hosted with Amazon Web Services (AWS). They employ a robust security program with multiple certifications. For more information on our provider’s security processes, please visit AWS Security. Data Hosting SecurityAll of our data is hosted on Amazon Web Services (AWS) databases. These databases are all located in Europe. Please reference the above vendor specific documentation linked above for more information. Business Continuity and Disaster RecoveryWe use our data hosting provider’s backup services to reduce any risk of data loss in the event of a hardware failure. We utilize monitoring services to alert the team in the event of any failures affecting users. Incident ResponseWe have a process for handling information security events which includes escalation procedures, rapid mitigation and communication. Access to cloud infrastructure and other sensitive tools are limited to authorized employees who require it for their role."
