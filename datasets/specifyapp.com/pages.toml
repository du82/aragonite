["https://specifyapp.com/blog/introduction-to-design-tokens"]
title = "Introduction to design tokens | Specify"
description = "Learn about what design tokens are and how they can help you scale your branding with confidence."
full_description = "Whether you're a designer, a developer, a manager or a curious executive wanting to scale your organisation's branding with consistency: this post is for you. After reading this post, you'll have a clear idea of what design tokens are and how they can help your organisation manage its branding at scale. However, this article focuses on the why's and the what's of design tokens. I won't share with you how to create, name, transform or distribute them within your design system. These subjects deserve their own article. All organisations in the world share one thing in common: they have a branding. This branding allows them to communicate and differentiate from one to another. To make a long story short, your organisation's branding is the backbone of its communication. In the past, when print was king, a branding was defined in a graphical charter. Nowadays, this set of graphical rules has evolved to take into account the myriad of screens surrounding us. Your branding must be applied consistently everywhere, whatever the channel you're communicating on. Design systems are the logical evolution of graphical charters. They help everyone involved in the creation, maintain and usage of a branding work together. Your branding is part of the trust your audience has in your organisation. Cherish it to keep your audience with you. How would you react if you received an email from your bank with an outdated logo? How would you feel if your bank website and mobile application didn't share the same branding? What would you think at night with a full light mode interface burning your tiny eyes? Let me tell you a story. It's about a simple rebranding of the ACME organisation. We will be in the shoes of a designer trying to apply a design decision at scale. That's it. You're the new Head of Design at ACME Corp. You're excited and can't wait to start the rebranding you've been hired for. This rebranding consists in replacing the main color of your organisation by a new one. One single color replacement."
