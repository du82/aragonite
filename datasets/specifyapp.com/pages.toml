["https://specifyapp.com/blog/becoming-a-design-tokens-ambassador"]
title = "Becoming a design tokens ambassador | Specify"
description = "Let's see why a design tokens pipeline is an improvement that interests the developers, designers, and business stakeholders."
full_description = "Editors's note: This is a guest post from Michael Mangialardi, front-end developer, design system aficionado and author of Design Systems for Developers. In this post, he explains the many benefits of a design tokens pipeline within an organization's design system. I believe that every developer is an ambassador, responsible for representing the technology and working to negotiate changes to that technology so that all parties are satisfied. Those parties needing to be satisfied are the pool of developers, designers, and business stakeholders. Design tokens are a representation of design specifications in code. A design tokens pipeline is when you have a central location of tech-agnostic (raw) design tokens that can be transformed into tech-specific (formatted) design tokens and exported to all the consumers/adopters of the design system. I firmly believe that a design tokens pipeline is an improvement that interests the developers, designers, and business stakeholders. When working on a design system, there are several bottlenecks that interfere with an efficient, satisfying developer experience. There is the need to translate design specifications (as found in a design file or documentation site) into code when implementing a design system. Selecting a way to make the coded design specifications shareable in a favored format/technology (i.e. SASS variables) The first bottleneck that arises from this is the burden of developers having to name the coded design specifications without the helpful input of designers. Sometimes, there is also a lack of helpful input from other developers, such as when the code changes are not reviewed independently from other changes to the codebase. When that happens, the naming conventions are too granular to receive much attention, and so, there may be a trajectory towards inconsistency. This can increase the likelihood of decision fatigue and poor code quality, which may also lead to a lack of interest to adopt and maintain a design system."
year_published = 2025
