title = "Inside Specify #1: Welcome to Maud & Yann-Edern | Specify"
description = "Learn more about the two new people who recently joined our team: Maud as a Product Manager and Yann-Edern as a Product Designer."
full_description = "Today, we're excited to launch a new series of articles. In this series we will emphasise on the WHYs, HOWs and WHOs of the people working at Specify. And what better way to open this series than having new people joining our growing team. Thanks to this article, we lift the veil on Maud and Yann-Edern who respectfully joined us during the last few weeks. As an Apple fangirl since the age of seven, we can say that design and product were always Maud's passion. She loves testing new productivity tools to improve her workflow or her team's. She's eager to learn more about Product Management at Specify as she's switching from Product Design. Originally from Lyon where she learnt to code, she then escaped to London and Melbourne. Maud eventually settled in Paris and started learning product design at the brand new Web School Factory. She has been living and working there for nearly 10 years now. After some internships at big companies (Accor Hotel) and in agencies (Niji), she began working in startups (Drust, Foodvisor and Station) and found that was the right fit for her. She was the first and only designer in all her last 3 companies which enabled her to wear many hats. She worked on the UX part of the products as well as the UI but also on the brand and visual communication and on managing the product, the QA, and the development process. Even though she's not a sports person, she started roller-skating in skateparks again. She also became an advocate of soul-cycling, riding in the dark helps to clear the mind and the music is good 🎵 🚴‍♀️ In her free time, you can find her playing with Legos (or collect them), making new tattoos for her or her friends with Jagua (temporary ink), that way she doesn't have to choose one definitive tattoo but can do it all... for two weeks 😅 Maud also enjoys to go see all her favorites music artists' shows when they are nearby such as Parov Stelar, Deluxe, Gorillaz... Her biggest regret at the moment is to have missed Daft Punk."
year_published = 2025
