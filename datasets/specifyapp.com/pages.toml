["https://specifyapp.com/blog/launch-week-1-wrap-up"]
title = "Launch week #1: Wrap up | Specify"
description = "From June 12th to June 16th 2023, we held our first Specify Launch Week. Each day we revealed new features, including compatibility with npm and Notion, our new design token format, a Raycast command, and last but not least, an awesome AI project."
full_description = "From June 12th to June 16th 2023, we held our first Specify Launch Week. Each day we revealed new features, including compatibility with npm and Notion, our new design token format, a Raycast command, and last but not least, an awesome AI project. Let's review them all. Our vision has always been to bring designers and engineers closer. The new feature allows full control over design token distribution with npm, a software registry for Node.js/JavaScript applications, hosting private and open source packages. This helps design teams share their design decisions with other teams and ensures consistency and accuracy across all projects. Using npm packages in your design system enables more efficient collaboration between designers and developers, as packages can be reused on multiple projects. Designers can also use npm packages as a form of documentation, easily sharing their design decisions with stakeholders and team members. Versioning and automation are made easier with npm, eliminating the need for manual updates and version control. The destination pipeline is flexible and customizable with only one configuration. npm as a destination is available on all plans with no limits. We hope this feature will be useful and bring you closer to your design and engineering goals. We are thrilled to introduce our latest feature that brings together the power of up-to-date design tokens and the flexibility of documentation tooling in Notion. With the new integration, you can use Notion as a destination in Specify to sync your design tokens with any page in Notion, making it easier to create and maintain brand guidelines that are always up-to-date. Documenting your design system is an important investment, and our new integration makes it easier and more reliable than ever before. By using Specify and Notion together, you can create documentation that is accessible to everyone in your company, including Marketing, Communications, HR, and PR teams. You can even create public pages for press and brand kits that include logos, colors, and icons."
