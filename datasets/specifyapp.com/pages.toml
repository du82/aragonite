["https://specifyapp.com/blog/how-to-generate-css-variables-in-github"]
title = "How to generate CSS variables in GitHub | Specify"
description = "Learn more about how to generate CSS variables from Specify in your GitHub repositories."
full_description = "In this article you will learn how to generate CSS variables from design tokens synced in Specify. Head over this article to learn more about how to sync tokens to Specify. Specify is a design token engine which offers an API. Which means you can request tokens from Specify while transforming them along the way. The Specify CLI helps you extract design tokens and assets from Specify in your terminal or even in a CI/CD pipeline. The Specify Design Token Engine is a powerful tool to help you generate design tokens and assets that match your needs. To make sure Specify knows what you exactly need, you have to configure it. In this example we want our colors, spacing and text styles to be pulled and generated as CSS Custom Properties. Change the data at the top of the file: we need to add the name of the Specify repository we're pulling design data from. In our case we're pulling design data from the all-design-data repository created in the @acme-inc organization. The Specify GitHub integration helps you distribute your design tokens and assets from your Specify repository to your GitHub repositories. Every change detected in your Specify repository creates a Pull Request in your GitHub repositories. Replace the content of the .specifyrc.json file in the PR by the content of the .specifyrc.json file we used with the CLI. We've learned how to synchronize our design tokens and assets from Figma to our git directory, both locally and on GitHub. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices."
