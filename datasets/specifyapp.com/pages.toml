title = "GitHub as a Destination (Beta) | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "We’ve updated our GitHub integration to make it compatible with our new format in beta! From now on, you can send your Figma variables or your tokens from Tokens Studio to your GitHub repository. You can now add GitHub as a destination to your SDTF repositories. For now, our GitHub integration only allows you to sync tokens from a single repository. If you want to sync both Figma Styles and Figma Variables/Tokens Studio to GitHub feel free to refer to this article. We’ve fixed an issue with the to-style-dictionary parser that ignored the directoryPath property which would always create files at the root of your directory. We’ve added an option to the to-css-custom-properties parser so you can now choose to have both core tokens and alias tokens in each CSS scope thus making alias tokens always resolvable. We’ve improved our compatibility with text styles coming from Tokens Studio and improved the sync of your tokens from Tokens Studio."
