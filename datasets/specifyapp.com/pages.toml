title = "Improved onboarding experience #2 | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "Getting a first convincing experience as a user when trying a service is always valuable. We've always wanted you to be able to understand Specify's Design API concept as easily as possible. This is why we've been working hard on improving your first minutes of usage inside Specify lately. The onboarding first iteration was satisfying but still could be improved in several ways. When connecting Figma as your first source application, the Figma details panel will be open by default. It makes you one click away from your first source installation. After completing certain steps you'll be automatically redirected to the onboarding. This will help you complete it more easily. You've been asking for more control over number values returned by the API. We listened and we added the round-number parser. If you ever synchronized design tokens from Figma and saw that some values should be rounded this parser is for you. No one needs a line-height of 17.096544px or a letter spacing of 0.579px. This parser will help you fix this. Fix a bug where the svgo parser removed many properties on asset files. You can now use it properly with the name-assets-files-by-pattern parser. We've improved the content writing experience in modals. Your content will be saved until you submit it or open a new modal."
year_published = 2025
clearnet = "https://specifyapp.com/changelog/improved-onboarding-experience"
