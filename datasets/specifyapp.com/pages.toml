["https://specifyapp.com/customer-stories/how-carrefour-uses-specify"]
title = "How Carrefour automatically versions tokens from design to code | Specify"
description = "Learn how Carrefour uses Specify to sync their design tokens and assets within their design system."
full_description = "I'm a front-end developer in charge of the technical part of our design system. More specifically, I create component libraries that get used by different tools of the Carrefour group in France and globally. I'm a design system designer, and I take care of everything that's happening in Figma. Like Romain, I'm one of the referrers of the design system but on the design side. I'll create component libraries in Figma and help other designers use them correctly. We didn't speak the same language between designers and engineers. For instance, designers used to create and use design tokens like colors, spacing, or shadows that developers didn't have in their codebase. Thus, while inspecting the UIs, developers were a bit lost in translation and sometimes created new tokens, which eventually led us to be out-of-sync. Our main challenge was that our design tokens were out of sync between design and code in our design system. We now have 50 developers who benefit from design tokens generated by Specify. On the design side, we also had issues communicating updates to developers, whether it was an updated color or a new icon. Communication was the main challenge. We have around 60 designers consuming our design system. We used to keep everyone updated on our design tokens during meetings, and it was a very manual process that was both time-consuming and error-prone. With Specify, this process is now automated. I'm sure developers will get the latest design tokens and assets in the right format for their respective platform. All of this in one click. First of all, Specify helps us update our design system more efficiently. For instance, Jeremy and I work together daily on the design system. When Jeremy updates a token in Figma, I only have to execute a command in the CLI to get his final design decisions in my codebase. Being aligned with each other has become effortless. Secondly, as the design system gets updated more regularly, teams consuming it can also benefit from it more rapidly. In short, it improves the adoption of the design system."
year_published = 2025
