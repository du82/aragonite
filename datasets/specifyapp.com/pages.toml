["https://specifyapp.com/changelog/2023-12-12-styles-in-advanced-repositories"]
title = "Figma Styles in Advanced repositories | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "Do you want to keep using Figma Styles alongside Figma Variables? We’ve got you covered. From now on, you can collect Figma Styles, Figma Variables, and tokens from Tokens Studio inside the same Advanced repository. Thanks to our Widget, you can choose to synchronize either Styles, Variables, or both. Even better, if your Styles are connected to Variables in Figma they will appear as aliases in Specify! With our new GitHub destination update, you can now distribute your tokens into GitHub by using multiple configuration files in one GitHub Repository. One Specify Classic repositories with multiple Advanced repositories synchronizing into a GitHub monorepo. ☝️ Note that you can’t have multiple Classic repositories synchronizing to one GitHub repository. This feature is dedicated to our new Advanced repositories compatible with our Specify Design Token Format. Advanced repositories: You can now check any warning or error directly into your Sources. It will be easier to understand what might not yet be compatible with our Specify Design Token Format (SDTF). Advanced repositories: Display groups in the repository sidebar: you can now see all your groups and design tokens if you collected them from Tokens Studio. Parser (Classic version) to-css-custom-properties: use postScriptName as CSS Variable name for font tokens Our new Advanced repositories are no longer in a private beta! You can now collect all design tokens from Figma Variables or Tokens Studio to get the most out of aliases, modes, and collections."
