["https://specifyapp.com/blog/crafting-consistency-a-thoughtful-approach-for-naming-design-tokens"]
title = "Crafting consistency: a thoughtful approach for naming design tokens | Specify"
description = "One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices."
full_description = "A design system is a shared language among designers, developers, and stakeholders like design system engineers. Clear and concise naming conventions serve as a communication bridge, enabling seamless collaboration. When everyone understands the terminology, it minimizes the risk of misinterpretation and promotes a shared understanding of your components, design tokens and assets. In the multi-platform landscape of modern design, consistency is non-negotiable. Naming conventions provide a language that your team during the handoff phase. This consistency is vital for maintaining brand identity and user familiarity. Imagine a design system where every team member names colors differently. Let’s say this team is gonna have a bad time working on colors. Establishing naming conventions takes time. However it significantly enhances efficiency by reducing the time spent on decoding the meaning behind each element. This, in turn, boosts productivity and accelerates the design and development process. Don’t try to find the best naming convention that will make sense for everyone in the 10 next years. Focus on what matters most for your team. Focus on getting value from this taxonomy from day 1. And like everything else: improve it over time. Simplicity lies at the heart of effective naming conventions. A naming system should be intuitive and easy to understand, even for those who aren't intimately familiar with the project. This simplicity extends to both individual names and the overall structure. Start with the token types that are the most important for your team (color, text styles, spacing…) If you’re not sure you’ll need design tokens from the component tier, ignore them. Define your naming convention for semantic tokens only. Core tokens should be named after how they look. For instance, red-100 will represent a color token from the red color palette. Semantic tokens, which are alias of core tokens should be named after how they should be used used for. The name of a semantic token should convey the intention instead of its value. For instance, or red-100 token could be aliased as color-danger. If you want to dig deeper on this topic read this great article by Donnie D'Amato."
year_published = 2025
