["https://specifyapp.com/blog/introducing-raycast-extension"]
title = "Introducing our Raycast Extension | Specify"
description = "Have you always wanted to have your organization's colors or logos at hand? Learn how to consume your design tokens now with our latest Raycast extension."
full_description = '''Let's face it always having an up-to-date brand identity and using the most recent colors and assets is a drag. Whether it's a classic use case like looking for the latest logo version (in PNG? SVG?) or just copying and pasting the official brand colors. No one knows where the latest version is, and brand consistency seems like a utopia. Every single person deals with this problem differently, ranging from a shared folder (or not) on their personal computer, a search in Figma, documentation in Notion, or even an official design system in the organization for the most advanced ones. Have you found the most effective way to share yet? Luckily, Specify can offer you a great solution! By using Specify you are able to collect, store and distribute design data (colors, typography, fonts, icons, and even bitmaps, for example). All this by connecting in or out your favorite tools, like Figma or GitHub. This way, you're sure to provide and consume the most recent elements for all your teams. Recently, we've added Raycast as a Destination to Specify, which allows you to search and consume all your design tokens and assets from your computer in seconds. But not just that! It offers you the possibility to search through our API documentation as well, making it easy for you to configure Specify and use it to the fullest. Raycast is a blazingly fast and powerful macOS launcher. The app reduces the continuous context switching with a command line inspired interface and connect your tools to "take your daily workflow to the next level" in their words. With the Raycast extension for Specify, you can search and consume design tokens (colors, text styles, etc.) and assets (bitmaps, vectors, etc.) of your brand. These elements come from Sources connected to Specify. We only offer Figma as a Source, but other tools like Google Drive or Dropbox are coming soon. If you are interested, you can upvote them here. The main action is to copy the hexadecimal value of your color. You can also access other actions like copying the value in RGBA or the name of the color by accessing the action menu via Cmd + K.'''
year_published = 2025
clearnet = "https://specifyapp.com/blog/introducing-raycast-extension"
