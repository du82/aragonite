["https://specifyapp.com/blog/configuration-templates"]
title = "Getting started with Configuration Templates | Specify"
description = "Start syncing your design tokens and assets from Figma to GitHub in minutes with our ready-to-use Configuration Templates."
full_description = '''Right from the app or the Specify CLI, you can sync and pull design tokens and assets from Figma, and get fully customized files and style variables with the name, case, and format you want. Today, we're introducing Configuration Templates. They're ready-to-use examples to help you save time experimenting with Specify. Specify helps you build a custom CI/CD workflow for your design data. Our Design API automatically collects design tokens and assets from Sources like Figma. Then you can set up a configuration file to define how to transform them into code, reducing manual, error-prone work. The solution? Configuration files. They're here to help you do just that — to specify the output you want from your design data. Config files include rules (parameters) and parsers (functions). You define them to pull design tokens and you get fully customized files and style variables with the name, case, and format you want. Configuration files, rules, and parsers help you dictate how you receive your design data to fit your own needs and company standards. They're your secret weapons to save time, and the good news is: you don't have to start from scratch. Configuration Templates are ready-to-use config file examples to help you distribute your design tokens and assets from Specify to your codebase. They're here to help you preview what you can do with Specify and get started in minutes. For example, with this Configuration Template for Tailwind, you can extract colors, icons, and font files from Specify and generate a theme containing design tokens and assets compatible with Tailwind. It optimizes icons with SVGO and font files in modern font formats. Also, you can find examples for different formats and environments — including CSS Custom Properties, Tailwind, React Native, Style Dictionary (iOS, Android), and more. Create a configuration file inside your project in JSON (.specifyrc.json) or JavaScript (.specifyrc.js) Run your Template through the CLI:- JSON: specify pull- JavaScript: specify pull --config-path ".specifyrc.js"'''
