["https://specifyapp.com/changelog/2024-01-25-sdk-svgs-compatibility"]
title = "Specify SDK | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = "Thanks to this new tool and our newly released format, engineers are given more power and freedom toward design token code generation. In a few words, you can fully take control of what’s inside your design token graph and what will be generated as an output. Whether it is about filtering and renaming tokens, groups, and collections, or deleting modes in tokens or collections. It’s all about building your custom solution tailor-shaped to your standards. We have added our compatibility with SVGs coming from Figma with the SDTF. It allows you to automatically collect, store, distribute, and optimize them. Everything is done through our Figma widget and our available parsers! Learn how to extract your SVGs in our help center ↗︎ We are introducing the Specify Design Token Engine to the world! This means that our Advanced Repository is replacing our previous repository (Classic). This repository will become a legacy repository. If you are using a “Classic Repository” today, you will still have access to it for the time being. We invite you to start using our new (Advanced) Repository as this is the one we are maintaining and adding new features to. Learn more ↗︎ If you didn’t use the “Classic Repository” nothing changes, you will just not see the option to create one anymore in your Specify workspace or Specify Widget in Figma. All of our new updates and communication will be dedicated to the new Repository, which is using our Specify Design Token Format. Learn more ↗︎"
