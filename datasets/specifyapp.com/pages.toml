["https://specifyapp.com/blog/why-specify-and-style-dictionary-are-a-perfect-match"]
title = "Why Specify and Style Dictionary are a perfect match | Specify"
description = "Learn how to sync your design tokens with Specify and how to transform them with Style Dictionary."
full_description = '''I'm often asked: "What's the difference between Specify and Style Dictionary?". My answer is always the same: "Yes, they look alike, and Specify is not meant to replace Style Dictionary: it actually enhances it.". Style Dictionary and Specify are both design tokens generators, and you can use them to generate design tokens and assets respecting your company standards. Created by Danny Banks in 2017, Style Dictionary is a build system that allows you to generate styles for any platform from static design tokens in an agnostic format (e.g., JSON). For instance, you can feed Style Dictionary with raw colors in JSON and configure it to generate colors in specific formats for different platforms like Android (e.g., Kotlin), iOS (e.g., Swift), or Web (e.g., Sass). Style Dictionary provides out-of-the-box transforms functions to help you create and transform design tokens. Transforms are functions that range from converting colors to HSL, converting dimension design tokens from rem to dp, or even converting an image in base64. In short, Style Dictionary helps you transform your design tokens to make them compatible with your company standards. Keeping design data up-to-date at scale means transforming your design tokens for target platforms every time a design token is updated. Style Dictionary helps with the transformation part, but you still need to run it every time your design tokens get updated. Check out the official examples projects provided by Style Dictionary. In our case, we just used the basic example 👍 Style Dictionary helps you generate and transform your design tokens. But you still need to run Style Dictionary every time they get updated. Specify is a Design API that helps you collect design data from Figma and distribute it in the right format, in the right project, at the right time, and to top it all: automatically. Let's focus on the "distribution" part. Like Style Dictionary, Specify helps you generate design data for any target platforms. By default Specify returns design data in JSON but thanks its open source parsers you can transform your design data in any formats. I repeat, in any formats.'''
year_published = 2025
