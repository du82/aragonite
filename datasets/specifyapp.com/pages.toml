["https://specifyapp.com/blog/how-to-sync-design-tokens-from-tokens-studio-to-github-as-css-variables"]
title = "How to sync design tokens from Tokens Studio to GitHub as CSS variables | Specify"
description = "Learn how to sync your design tokens from Tokens Studio to GitHub and transform them as CSS Variables using the Specify CLI in a GitHub Action"
full_description = "Since last week’s update, you are now able to import tokens from a JSON file in Specify. In other words, Specify is compatible with “code as a source” in addition to Figma. This feature unlocked one of the most requested feature we’ve been receiving over the last couple of years: importing design tokens created in Tokens Studio to Specify and automatically transform them to code. In this article you’ll learn how to sync your tokens from Tokens Studio to Specify and how to automatically generate them as CSS variables in your GitHub repository. You can sync tokens from Tokens Studio to several sync providers. We’ll use GitHub in this article but you’re free to choose the one you want (GitLab, Bitbucket, Azure DevOps etc.). Finally, you will have a new JSON file created in your GitHub repository containing all your design tokens. ℹ️ At this point, you can choose to pull design tokens either from a public or a private repository. In this example we’ll do it from a private repository. Create and Paste this GitHub file URL such as: https://api.github.com/repos/{owner}/{repo}/contents/{file_path} Then, set a new repository secret called SPECIFY_TOKEN containing your Specify Personal Access Token in your GitHub repository: Settings > Secrets > Actions. We have just led you through the process of syncing design tokens from Tokens Studio to Specify and generate them as CSS variables in GitHub as a result of an automated Pull Request. The most important thing to remember is the actual workflow: Tokens Studio → GitHub → Specify → GitHub. Want to generate design tokens in another format or go further with Specify? Here are useful resources that will help you get started: These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret."
