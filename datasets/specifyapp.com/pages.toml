["https://specifyapp.com/blog/inside-specify-2"]
title = "Inside Specify #2: Welcome to Thibaut & Nicolas | Specify"
description = "Learn more about three of our new team members: Thibaut who joined us as a Motion Designer, and Nicolas who joined us as a Software Engineer."
full_description = '''Today, we're continuing our series about the people working at Specify. For the last couple of months, many new people have joined our team. In this post, you'll be able to learn more about three of them: Thibaut, Adrien and Nicolas. Thibaut is a self-taught Motion Designer. He started to learn 3D and animation in his bedroom at 14. He pursued his passion for 3D even during his marketing studies in Lille: his hometown. After his graduation and some time spent in Colombia, he decided to go all-in and started his career as a 3D Motion Designer. He got "known" by creating fake modern ads for vintage products such as a film camera from the 80's and the classic MacIntosh made by Apple in 1984. Thibaut spent some time in a handmade furniture company to help them create stunning visuals for their line of products. He also worked as a freelance motion designer with international agencies and start-ups. He then joined our growing team at Specify to create, day after day, content that will delight our users. Being very curious, he likes to work and tinker with every aspect of a motion design project. Which can lead him to do nothing more than watching 3 hours long tutorials on a software that he'll probably never use. Thibaut is really into thrifting and is obviously always looking for classic vintage items from the eighties. Just to give them a second life or use them as subjects for his next motion design project! Like 90% of the designers, Thibaut is a Wes Anderson nerd. His personal favorites would be Rushmore, Fantastic Mr. Fox, and The Grand Budapest Hotel holds a special place in his heart. On a musical note (Ba dum tss), he's into House classics and disco-funk, always on the hunt for the next hidden gem he'll play on repeat while riding his bike. If he's not working on an animation on Cinema4D, he's either harvesting his pumpkins on Stardew Valley or defusing a bomb on Counter-Strike. Nico is passionate about science, technology, and humanities while specializing in user experience engineering for the Web.'''
year_published = 2025
