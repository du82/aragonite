["https://specifyapp.com/changelog/new-parser-to-theme-ui"]
title = "New parser: To Theme UI | Specify"
description = "Flexible and powerful, Specify makes it easy to build the exact Design Token process your Design System needs."
full_description = '''Several teams where asking to be able to automatically generate a theme compatible with the theme-ui specification. The Theme-UI specification closely looks like another famous CSS utility-first framework. We let you guess on which parser we're currently working on 🌬 The link-design-tokens parser helps you link color and measurement design tokens to complex ones like gradients, borders, shadows or text styles. Finally, the new replace-string parser helps you replace any string matched by a regex by a new string. Let's say you have some a color named "Red" in your Figma local styles in a "Colors" folder. The color name returned by Figma is "Colors / Red". We previously ordered tokens alphabetically. Tokens are now ordered in a more natural way. For example, given the colors "Carbon 40, Carbon 5, Carbon 50" it now gets listed as "Carbon 5, Carbon 40, Carbon 50".'''
