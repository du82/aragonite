["https://specifyapp.com/blog/specify-to-tailwind"]
title = "How to sync your design tokens from Figma to Tailwind | Specify"
description = "Learn how to collect design data from Figma to Specify and pull them in your project as a theme compatible with Tailwind."
full_description = "At Specify, we want to help you work better as a product team. As a developer, one of your jobs is to implement design tokens in your codebase. And let's face it, manually updating design data is cumbersome. Specify helps you collect design data from Figma and distribute it in the right format, in the right project, at the right time, and to top it all: automatically. The Specify CLI helps you get design tokens and assets from Specify right from the terminal or even in a CI/CD pipeline. Here's a short video tutorial to help you use the CLI to generate assets and a theme compatible with Tailwind: Specify is flexible. It was designed to adapt to your needs and not the other way around. However you must configure Specify to get design tokens and assets that fit your needs. We could copy the suggested .specifyrc.json (CLI) template inside our config file. However, we could use this template right from the CLI thanks to the specify init command. We must set the Specify repository we're pulling design data from. In our case we're pulling design data from the all-design-data repository created in the @acme-inc organization. The pull command helps you pull design data from the Specify repository you set in the repository property of your configuration. It tells Specify to read and execute your configuration and so it can generate design tokens and assets in your project. The Specify GitHub app helps you distribute your design tokens and assets from your Specify repository to your GitHub repositories. Every change detected in your Specify repository creates a Pull Request in your GitHub repositories. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. These are some of the hardest words I've had to write as a founder, but they're true. We're going to sunset Specify—something we do with deep regret. One of the fundamental aspects contributing to a coherent and efficient design system is the establishment of robust naming conventions. In this blog post, we'll explore the different ways of naming your design tokens and recent best practices."
year_published = 2025
