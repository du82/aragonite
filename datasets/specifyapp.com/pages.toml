["https://specifyapp.com/parsers"]
title = "Parsers | Specify"
description = "Parsers are the magic that you need to transform your design data into any company standard output. Let’s have a look at how they work!"
full_description = 'Parsers are the magic that you need to transform your design data into any company standard output. The parsers can be adjusted to your needs. Let’s pretend we’re a React developer who needs to use icons in a React project. The icons are created as components in Figma and in this example we will use a parser to convert the icons into JSX components.For the sake of simplicity, we will only focus on a single icon defined as a variant of a Figma component named “chat-alt”. On the right you can see all of our icons in a Specify repository. Now, let’s pull them into our codebase by using the Specify CLI. The Specify CLI is the perfect tool to help you see how Specify transforms your design data. In this example we would like to have them in JSON first to see the data Specify returns. The following configuration file filters vector assets from a group named "Icons" and generates an vectors.json file containing our icon in JSON. After setting the output property in the `to-json` parser and pulling our icon with the `pull` command, we receive the following output: `./output/icons.json` - see the image on the right hand side. By default, Specify returns SVG strings as they are created in Figma. Before using the SVG string inside our final JSX component we need to optimize and transform it.The svgo parser is based on the famous SVGO package and helps us do just that. Now that we are satisfied with our SVG string let’s generate a JSX component out of it.Let’s use the svg-to-jsx parser to do this. The different steps that have been executed in this example can be combined into one configuration file. This means you only have to set it up once and let Specify do the automated magic for you. Small recap: In this example we covered how to generate JSX components using the Specify CLI. We combined and chained several parsers together to optimize and transform our SVG, and to generate our final JSX component. The different steps that have been executed in this example can be combined into one configuration file. This means you only have to set it up once and let Specify do the automated magic for you. Small recap: In this example we covered how to generate JSX components using the Specify CLI. We combined and chained several parsers together to optimize and transform our SVG, and to generate our final JSX component.'
