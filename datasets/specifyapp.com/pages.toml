["https://specifyapp.com/customer-stories/how-pitch-uses-specify"]
title = "How Pitch uses Specify to sync icons from design to code | Specify"
description = "Pitch is the collaborative presentation software for modern teams. The product team uses Specify to automate its design workflows and deliver fast releases."
full_description = '''This story is a guest post from Roy van Rooijen, Senior Product Designer at Pitch. Roy shares how his team automates design workflows with Specify. Pitch is the collaborative presentation software for modern teams. It makes it fast and delightful for teams to create and deliver beautiful presentations. With a library of 680 icons across 6 products and apps, the product team needed to automate its design workflows for continuous integration and delivery (CI/CD). The current icon set at Pitch contains over 680 icons. They come in 3 sizes, 2 styles, and the Pitch design team recently introduced an extra weight. The medium and small icons are used for the Pitch desktop and web app, the marketing site, and the presentation gallery. "Medium is the default that we used practically everywhere, and only a handful of icons also come in small," Roy explains. All the large icons are used exclusively inside the iOS and Android mobile apps. For styles, outline icons are the default style. "We turn them into filled, when a UI element becomes active," he details. Both outline and filled icons use 1px strokes, 1.5px strokes for large icons, and the team recently introduced a thicker 2px weight. Pitch is constantly evolving — releasing new features every day. So, the need for new icons for those features comes very frequently. "We needed design automation powering continuous handover. In short, we needed a Design API." Roy concluded. First, Roy experimented with the Figma File Example. Then he connected Figma and GitHub and started syncing design data automatically. "I'm always skeptical when a new tool comes around, or a feature by an existing tool gets introduced, that aims to solve 'handover.' Specify is different. It delivers on the promise." Roy explains. The design and engineering teams work with confidence, making collaboration more productive — and fun. "We can tweak and customize anything within minutes" Roy told us. Pitch started with icons and, bit by bit, is scaling its design data pipeline, now experimenting with colors. As its design system evolves, so does its design CI/CD workflow, helping the design and engineering teams build a better product faster. Every. Single. Day. 👏👏'''
year_published = 2025
