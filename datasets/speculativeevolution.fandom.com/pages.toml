ction isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> A cryptile runs headlong into a cloud of brine flies, with its neck frill spread wide. Brine flies provide the cryptile with all the protein and moisture it needs. The cryptile is a frilled lizard-like agamid from the Mediterranean Basin, 5 million AD, in The Future is Wild. Moving on the dazzling salt flat are cryptile lizards, part of the agamid family which has populated the warm regions of Africa, Asia, Europe and Australia since well before humans. When the lizard is hunting, it scampers along and raises itself onto its hind legs. Then it opens up the frill around its neck. Superficially, it resembles the frilled lizard, an agamid that lived mainly in northern Australia and southern New Guinea during the Quaternary period. But unlike the frilled lizard, which had an unbroken large ruff of skin, the cryptile's frill forms a net which is covered in a film of sticky mucus secreted by pores on the individual strands. When a cryptile runs across the salt, the open weave of its frill causes little air resistance. They often career headlong into a thick cloud of brine flies, running straight through it. The cloud swirls and parts if the lizard settles, exhausted after its brief hour of activity. The frill that was pale-colored before the cryptile's run will now be black and laden. The brine flies have adhered to it as if to flypaper. Settling in the salt, the lizard folds its frill, gathering the trapped insects into bunches. In rapid jerks it extends its long tongue and packs off the flies. It will do this even while running through a swarm, licking the caught flies off of its frill. The cryptile never drinks water from the lakes (the amount of salt they contain would prove fatal if ingested). The lizard gains all the moisture it needs from the flies it eats. After hunting, the cryptile's pale coloring allows it to fade back into the white of the salt flats. It spreads its ribs and flattens its body against the salty surface. The rough, three-dimensional pattern of its scaly skin mimics the crystalline salt structures of its surroundings. So positioned, the animal is practically invisible. Indeed, the cryptile is a true master of disguise and is well deserving of its name, which is derived from the Greek word kruptos, meaning hidden or concealed. There are times when a cryptile abandons its camouflage and changes its color to deliberately draw attention to itself. When an enemy approaches, the lizard quickly adopts a threatening pose. It pugs itself up and spreads its frill, turning black in color. Against the white background, the cryptile now stands out, appearing to be a bigger and much more threatening creature. This is usually enough to frighten off an attacker, and allows the cryptile to make its escape. During the mating season, the cryptile adopts yet another colorful appearance. As a prelude to mating, the male cryptile raises himself with his front legs and expands his frill. Cartilaginous supports allow the frill to open rigidly like a fan or an umbrella. Pigment cells in the frill flash vivid colors across the structure. The more impressive the display, the greater the chance of attracting a potential mate. This skin coloration also serves as a warning signal to rival males. At such times the cryptile stands on top of salt pinnacles or other promontories and allows itself to be seen from afar. A pair of cryptiles dash across the salt plain in an energetic mating ritual. The male has attracted his mate with an impressive display of color. Female cryptiles also have an expandable frill but, unlike males, do not use it for mating displays. Instead, the frill is only used for feeding and in self-defense. As soon as she spots a displaying male, the female can cover great distances across the salt plains to meet her mate. If it is a group of males showing off for the female all at once, the female will invite the best-looking male on a courtship dash across the salt. If he keeps up with her, she will let him mate with her. Once mating is over, the female leaves the salt lagoon and heads into the rocky limestone karst in search of a safe place to lay her eggs. This can be a very dangerous period of time for a female, for outside the salt flats there will be more predators to worry about. It is in the shelter of the grykes that a mother cryptile hides her eggs. They will be safer here than on the open salt plains, but there are dangers nonetheless. The long nose of a snuffling, foraging scrofa can find newly-laid cryptile eggs in the shallow soil if they are not laid deep enough. Sometimes the mother herself will be ambushed by a larger predator such as a gryken. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Lizards Animals Squamates The Future is Wild Future animals Carnivores Reptiles Africa Australia Europe Asia 5 million years Community content is available under CC-BY-SA unless otherwise noted.'''
