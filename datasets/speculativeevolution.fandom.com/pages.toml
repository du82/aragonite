description = "The Diablosaurus, Diablosaurus rufus, is a strange, viviparous, medium-sized, short-necked, rhino-like titanosaur from the jungles and wetlands of Skull Island. It measures 20-25 feet long. With their crusty, armored backs and thick hides (often cleaned of parasites by riding Skull Island egrets), the imposing Diablosaurus have few enemies. Their size and indifference to attack, thanks to their armor, assures them of safety once fully-grown. Only the young are vulnerable to predation by midsized"
full_description = '''in: Animals, Skull island, Dinosaurs, and 5 more Saurischia Sauropods Skull Island animals Herbivores Reptiles Diablosaurus Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Diablosaurus, Diablosaurus rufus, is a strange, viviparous, medium-sized, short-necked, rhino-like titanosaur from the jungles and wetlands of Skull Island. It measures 20-25 feet long. With their crusty, armored backs and thick hides (often cleaned of parasites by riding Skull Island egrets), the imposing Diablosaurus have few enemies. Their size and indifference to attack, thanks to their armor, assures them of safety once fully-grown. Only the young are vulnerable to predation by midsized to large predators (like Venatosaurus and Carvers) and, for this reason, they are closely guarded by the adults. Young are born live and grow in the protection of their familial group until old enough to strike out on their own in search of a mate. Being seldom molested by predators (though one big threat is Piranhadon if they visit swamps), Diablosaurus usually associate in only small numbers, either immediate family units or mated pairs. Solitary individuals, particularly males, are not uncommon. Male Diablosaurus have some of the largest horns, though they are present in females as well. The exact configuration of horns and osteoderms seems to vary widely between individuals and may serve some rudimentary identification process. Both ma les and females have garish, ruddy heads. Conspicuous amid the dark foliage, they assist individuals in finding one another in the lowlight of the deep jungle. The markings also aid in intimidating would-be predators. Diablosaurus have poor vision, primarily relying on smell to find food. Their mammal-like, mobile lips and flat, grinding teeth are adapted to shred and crush the tough ferns that cover the jungle floor. They also use their great strength to strip particular vine species that they favor, tearing the creepers free with mighty tugs of their great heads. In overall body shape Diablosaurus resemble ceratopsians, but instead of being part, or even close relatives, of Skull Island’s several ceratopsian species, Diablosaurus represent an unconventional offshoot of the sauropod lineage. With truncated necks and stubby tails, they have evolved new armor plating and a stocky physique instead of the elongated necks and tails that are the line’s most famous features. Skeletal Adaptations[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/a/a3/150px-Diablosaurus_skeleton.png/revision/latest?cb=20180723153146" class="image"><img alt="150px-Diablosaurus skeleton" src="https://static.wikia.nocookie.net/speculativeevolution/images/a/a3/150px-Diablosaurus_skeleton.png/revision/latest?cb=20180723153146" decoding="async" loading="lazy" width="150" height="78" class="thumbimage" data-image-name="150px-Diablosaurus skeleton.png" data-image-key="150px-Diablosaurus_skeleton.png" data-relevant="0" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/a/a3/150px-Diablosaurus_skeleton.png/revision/latest?cb=20180723153146" /></a> Diablosaurus are herbivores that are studded with horns and osteoderms, an effective armor against the teeth and claws of Skull Island’s predators. Despite their size, they are surefooted digitigrades, walking on the tips of their dainty-looking but sturdy toes, nimbly picking their way through the thick underbrush and uneven ground of the forest floor. Categories Categories: Animals Skull island Dinosaurs Saurischia Sauropods Skull Island animals Herbivores Reptiles Community content is available under CC-BY-SA unless otherwise noted.'''
