} // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/0/0e/Aftermancover.jpg/revision/latest?cb=20080402232228" class="image"><img alt="Aftermancover" src="https://static.wikia.nocookie.net/speculativeevolution/images/0/0e/Aftermancover.jpg/revision/latest/scale-to-width-down/142?cb=20080402232228" decoding="async" loading="lazy" width="142" height="180" class="thumbimage" data-image-name="Aftermancover.jpg" data-image-key="Aftermancover.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/0/0e/Aftermancover.jpg/revision/latest/scale-to-width-down/142?cb=20080402232228" /></a> After Man: A Zoology of the Future is the first book of speculative zoology/evolution written by Dougal Dixon. Published in 1981, it exposes though different descriptions and illustrations the inhabitants of the earth 50 million years in the future after the extinction of humanity and much of the Holocene megafauna. Contents 1 Geography of the future 2 Animals of After Man: A Zoology of the Future 2.1 Temperate Woodlands and Grasslands 2.1.1 The Rabbucks 2.1.2 The Predator Rats 2.1.3 Creatures of the Undergrowth 2.1.4 The Tree Dwellers 2.1.5 Nocturnal Animals 2.1.6 The Wetlands 2.2 Coniferous Forests 2.2.1 The Browsing Animals 2.2.2 The Hunters and The Hunted 2.2.3 Tree Life 2.3 Tundra and the Polar Regions 2.3.1 The Migrants 2.3.2 The Meaching and Its Enemies 2.3.3 The Polar Oceans 2.3.4 The Southern Ocean 2.3.5 The Mountains 2.4 Deserts: The Arid Lands 2.4.1 The Sand Dwellers 2.4.2 Large Desert Animals 2.4.3 The North American Deserts 2.5 Tropical Grasslands 2.5.1 The Grass-Eaters 2.5.2 Giants of the Plains 2.5.3 The Meat-Eaters 2.6 Tropical Forests 2.6.1 The Tree-Top Canopy 2.6.2 Living in the Trees 2.6.3 The Forest Floor 2.6.4 Living with Water 2.6.5 Australian Forests 2.6.6 The Australian Forest Undergrowth 2.7 Islands and Island Continents 2.7.1 South American Forests 2.7.2 South American Grasslands 2.7.3 The Island of Lemuria 2.7.4 The Islands of Batavia 2.7.5 The Islands of Pacaus 3 Gallery 3.1 Temperate Woodlands & Grasslands 3.2 Coniferous Forests 3.3 Tundras and the Polar Regions 3.4 Deserts: The Arid Lands 3.5 Tropical Grasslands 3.6 Tropical Forests 3.7 Islands and Island Continents 4 Trivia 5 See Also 6 External links Geography of the future[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/8/8c/AfterMan_Map_50my.png/revision/latest?cb=20190217221134" class="image"><img alt="AfterMan Map 50my" src="https://static.wikia.nocookie.net/speculativeevolution/images/8/8c/AfterMan_Map_50my.png/revision/latest/scale-to-width-down/180?cb=20190217221134" decoding="async" loading="lazy" width="180" height="100" class="thumbimage" data-image-name="AfterMan Map 50my.png" data-image-key="AfterMan_Map_50my.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/8/8c/AfterMan_Map_50my.png/revision/latest/scale-to-width-down/180?cb=20190217221134" /></a> Earth Map in 50 million years in the future. Dixon assumes that Europe and Africa would eventually fuse, closing up the Mediterranean Sea. Asia and North America would collide and close up the Bering Strait. South America would split off from Central America. Australia would collide with southern Asia, uplifting a mountain range. Finally, parts of eastern Africa would split off to form a new island which he called Lemuria. Other volcanic islands have been added, such as the Pacaus Archipelago and Batavia. Animals of After Man: A Zoology of the Future[] The animals of the Posthomic Era (known as the Dixonian Era by fans) is separated into different regions and environments. Animals within pages of the book have subspecies listed and illustrated in the book, so many of the animals and their subspecies mentioned and or illustrated will be set in their appropriate biomes represented, either by name or appearance. It also lists the scientific names of the animals and their continental homes if mentioned. Temperate Woodlands and Grasslands[] The Rabbucks[] The Common Rabbuck, Ungulagus silvicultrix, the most common species of rabbuck, the Common rabbuck and its genus are descendants of modern rabbits and lagomorphs that have evolved to occupy the niche of the now extinct deer. The rabbucks now act as the principle group of the future. Hopping rabbucks, Macrolagus spp., are the earliest living forms of rabbucks, appearing more rabbit-like with long-necks, and, as their name states, hop. Arctic rabbucks, Ungulagus hirsutus, are a subspecies of rabbucks live in the tundra regions and also in the coniferous forests. They resemble camelids like llamas and vicunas. Mountain rabbucks, Ungulagus scandens, are another subspecies of rabbuck. They are less furry that the arctic rabbucks and are the smallest and least common subspecies of rabbuck. The Predator Rats[] The Falanx, Amphimorphodus cynomorphus, a mid-sized predator, part of the predator rats lineage. The most common and basic species of the predator rats, it is a descendant of murid rats, hence its lineage name. The Falanx and its lineage act as the principle carnivore group of the future. It is seen in what is now Eurasia and North America. The Rapide, Amphimorphodus longipes, is a slender-bodied species of predator rat that is long-bodied and is from the Eurasian and African grasslands. It can run at a speed of one-hundred kilometers and can be seen as the Posthomic version of the cheetah. The Temperate Ravene, Vulpemys ferox, is a subspecies of ravene, a type of predator rat that is related to the polar ravene, but is less bulky and has a larger head and longer tail. It has a striped appearance mimicking the extinct wild cat. It is found in Eurasia, and measures about 3½ feet (1.1 meters) long, half of which is its tail, and 11 inches (28 centimeters) high at the shoulders. Its head is 6¼ inches (16 centimeters) long. The Janiset, Viverinus brevipes, is a species of predator rat that acts as the future version of a mustelid, most likely a stoat or weasel. It has a smaller appearance but sleek appearance, mimicking the now Extinct Weasels. Creatures of the Undergrowth[] The Tusked mole, Scalprodens talpiforme, a direct descendants of the common moles. It has an evolved appearance; it has a paddle-like longer tail, and two tusks. With its new appearance, it burrows by pushing itself in a rolling motion with its tusks reaming soil in front of it, with the loose soil pushed back by its feet and compacted by its paddle-like tail. It is also a predator, eating worms, invertebrates, and small surface-living mice. The Testadon, Armatechinos impenetrabilis, an insectivorous mammal that is a descendant of hedgehogs. It has developed a hinge carapace that acts as more defensive armor. The Oakleaf toad, Grima frondiforme, a species of evolved toad that has evolved a fleshy, leaf-shaped growth on its back to defend itself from predators and a worm-like tongue that acts as bait to unsuspecting prey. A fully carnivorous amphibian, it forms a parasitic fluke inside one of the predator rats. The Tree Dwellers[] The Chirit, Tendesciurus rufus, a slender-bodied, inchworm-moving rodent, descendant of a sciurine squirrel. It has a hard, leathery section of skin around the hindquarters that acts as a grapple to help it hang onto tree branches. It eats nuts from the tree branches. It is from the Northern Continent, the eighth new continent that acts as the northern connecting landmass sections of Northern Asia and North America. Tree Drummers, Proboscisuncus spp., are tree climbing animals that are descendants of white-toothed shrews that have evolved a unique nose that acts as a small proboscis. Climbing trees, their also evolved tusks carve and skin tree bark to find grub worms, in which they use their trunk-like nose to scoop and grab the worms to eat. They live in the Northern Continent. The Tree goose, Pendavis bidactylus, is a species of flying, arboreal wading bird descendant of geese that has taken life to live in arboreal lifestyle. It has evolved longer legs and two toes, where it roosts by hanging upside down. It is found roosting and flying in Eurasia. Nocturnal Animals[] Purrip bats, Caecopterus spp., are species of bats that have evolved larger ears, more sophisticated echolocation tactics and not needing the usage of eyes. They are found worldwide in the future, except for Australia and Antarctica. Many species of what are called the Great birds of prey are descendants of eagles and owls that hunt at night, making them also known as the Nocturnal birds of prey. Evolving longer legs in some owl-like species, some species are said to have evolved from harriers (not to confused with the Harrier hawk). The Lutie, Microlagus mussops, is another descendant of the rabbit, for whom they went to evolve as the rabbucks. The lutie retains its leoprid-like appearance, such as its long ears, and contends with the other rodents in certain areas, and some where they fully replaced the rodents in competition. It is found in Eurasia, where it is hunted by the Great birds of prey. The Truteal, Terebradens tubauris, is another descendant of white-toothed shrew. It has long-ears, sensory whiskers, and a bird-like mouth. It uses it's "beak," which are evolved incisors that resemble a bird beak, to dig into the earth and eat earthworms. The Shrock, Melesuncus sylvatius, is yet another descendant of white-toothed shrew where it grown to a medium size, and has convergently evolved to resemble the now extinct badger. It lives in the Northern Continent. The Wetlands[] The Reedstilt, Harundopes virgatus, a Northern Continent-living piscovore that is a descendant of insectivorous mammals, like hedgehogs. It evolved an almost-dinosaur appearance, with long, stilt-like legs, a long neck, and a toothed snout, where it eats fish from the wetlands. The Pfrit, Aquambulus hirsutus, is a tiny descendant of shrew, where it has the ability to not sink in still water, where it uses its tubular mouth to eat insect larvae. The Angler heron, Butorides piscatorius, is a species of heron, most likely a descendant of a butorid heron (likely the Green heron), where its known for its fishing technique, where it makes "ponds" near rivers where it uses bait (a combination of feces and dead fish) to attract fish to the source. Once they come, the Angler heron shoots into the water to catch and eat the fish. The Long-necked dipper, Apterocinclus longinuchus, a descendant of the white-throat dipper, is a European flightless dipper, where its wing as a juvenile are used for flying, but as adults, use the wings to balance and swim for food. Coniferous Forests[] The Browsing Animals[] Hornheads, Cormudens spp., are moose-like bovids from the coniferous forests of Eurasia. Equally named for their horned heads, the hornheads are derived from the southern, tropical dwelling gigantelopes, from whom the hornheads come from. Appearing like a cross between a moose, cow and a prehistoric ungulate, the hornhead comes in different species, but all have one common trait: a helmeted face protected by a serrated, faceplate of horn-like armor, hence their names. The Common hornhead, Cornudens vulgaris, is the foremost common species of hornhead. It has a shielded face and two backward protruding horns. The Helmeted hornhead, Cornudens horridus, is a species of hornhead with a heavily shielded face with two upwards, front-facing horns, and is of a brighter, brown-red fur color. The Water hornhead, Cornudens rastrostrius, is a water-adapted hornhead, with a large, paddle-like face that ends with a wide mouth to scoop'''
