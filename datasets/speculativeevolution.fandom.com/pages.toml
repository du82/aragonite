full_description = '''in: Content, Community, Exobiology, Tutorial Habitable solar systems Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Contents 1 The galaxy 2 Stars 2.1 The habitable zone 2.2 Multiple systems 3 The planets 4 Orbits and moons 4.1 Moons 4.2 Apparent sizes 4.3 Tidal locking 5 References The galaxy[] Most galaxies fall into three kinds: irregular galaxies are small and formless masses of stars, rich in dust and hydrogen and containing mostly younger stars (see below for star classes); conversely, elliptical galaxies don't have much hydrogen or dust, and their stars tend to be very old; finally, spiral galaxies (such as our Milky Way and our closest neighbour, the Andromeda Galaxy) have a complex structure similar to a pinwheel, with a mixture of both young and old stars. About half of the galaxies (but none of the spirals) are dwarf galaxies. Irregular Spiral Elliptical Total mass (Ms) 108-1010 109-1012 106-1013 Total luminosity (Ls) 107-109 108-1010 106-1011 Diameter (parsecs) 1500-9000 6000-50 000 600-150 000 Mass density (Ms/pc3) 0.001-0.01 0.01-0.1 <0.01 Hydrogen mass (fraction) 10% 1% 0.1% Stellar classes A, F (young) A, F, G, K, M G, K, M (old) Frequency in the Universe 10%? 60%? 30%? (Notes: Ms is the mass of the Sun, about 2.0 × 1030 kg; Ls is the luminosity of Sun, about 3.8 × 1026 J) Relative abundance of chemical elements in the Solar System Most likely, life needs heavy elements, a liquid medium and probably a solid ground (also see here and here): only hydrogen and helium, produced by the Big Bang won't be enough. Element heavier than helium, from lithium to iron, are produced by nuclear reaction in the stars, while the rest of the natural elements (until uranium) derive from supernovae. Dwarf galaxies are very poor in heavy elements, and they can be ruled out, and so, partially, irregular galaxies. Most of the stars in elliptical galaxies, being very old, were born right after the Big Bang, and didn't benefit from an interstellar medium already rich in heavy elements as the younger star did; it seems, therefore, that spiral galaxies are the best chance for complex chemistry. Once we have chosen a galaxy, we need to find the "habitable zone" in which to search a life-bearing solar system. A large number of red and yellow stars, mixed with dust and gases, form the Disk, comprehending in turn a number of arms highlighted by hotter blue and white stars. The Halo, a spherical region around the main disk, contains only old, cold red stars very poor in heavy elements useful to build a rocky planet (carbon, silicon, iron). These are much more abundant nearer to the Core, a region extremely rich in young, hot stars. On the other hand, the core is also richer in ionizing radiations, which disrupt atomic bonds and prevents the synthesis of complex molecules; while they'd not be much stronger than the radiation that a planet receives from its own star, the core also presents a higher rate of supernovae within a distance of few light-years. Life could appear in the outer rim of the Core, though not in its centre: planets there would constantly be enlightened, day and night, by the huge number of stars. Still, the most likely location is the Disk, both inside and outside the arms. In the Milky Way, the best distance from the centre is thought to be 25000-31000 light years (8-10 kiloparsecs), where most stars are between 4 and 8 billion years old. Here there is a high-detail map of the Milky Way, produced by National Geographic. Stars[] All stars can be classified into spectral classes on the basis of their temperature, which directly affects their The Hertzsprung-Russell Diagram orders stars by temperature and luminosity. colour. From the hottest and brightest to the coldest and dimmest, the most important classes are called O, B, A, F, G, K and M. They're in turn divided in subclasses, identified by numbers - a star with a number between 0 and 4 is called an "early" member of its class, while a star with a number between 5 and 9 is called a "late" member (for example, as a G2 star, the Sun is an early class-G). A second number, in roman numerals, identifies the star's luminosity class: 0 for hypergiants, I for supergiants, II for bright giants, III for normal giants, IV for subgiants, V for main-sequence stars such as the Sun, VI for subdwarfs and VII for dwarf stars. Most of the other characteristics can be inferred from the spectral class, as shown by the tables below: Main sequence stars (91% of stars) Class Frequency Rel. mass Rel. radius Lifetime as main seq. Tempera- ture (°C) Rel. lumin. Colour O5 ~0.00001% 32 20 0.001 Ga 36 000 100000 Green-white B0 ~0.1% 16 9 0.009 Ga 25 000 15 000 Light blue B5 6.1 4.1 0.07 Ga 15 000 600 A0 ~1% 3 2.5 0.4 Ga 10 400 65 White A5 2 1.6 2 Ga 8100 15 F0 3% 1.6 1.4 2.7 Ga 7000 5.3 Bright yellow F5 1.3 1.2 5.3 Ga 6200 2.4 G0 8% 1.1 1.1 9.3 Ga 5700 1.2 Pale yellow G5 0.9 0.9 16 Ga 5200 0.7 K0 13% 0.8 0.8 20 Ga 4600 0.4 Orange-yellow K5 0.6 0.7 60 Ga 3900 0.1 M0 66% 0.4 0.6 90 Ga 3300 0.04 Red M5 0.2 0.4 200 Ga 2600 0.007 White dwarves (8% of stars) Class Mass Radius Temperature (°C) Lumin. Colour A0 0.6 0.02 10 400 0.005 White F0 0.3 0.02 7200 0.0004 White Giant stars (1% of stars) Class Mass Radius Temperature (°C) Lumin. Colour G0 3.1 10 4900 40 Yellow K0 3.5 24 3800 80 Orange M0 3.8 76 2900 400 Red Supergiant stars (0,01% of stars) Class Mass Radius Temperature (°C) Lumin. Colour F0 9 50 6700 4000 Yellow G0 10 100 4200 5000 Yellow K0 12 200 3300 8000 Orange M0 16 500 2700 25 000 Red (Note: Ga = gigayear = a billion years; mass in Ms, radius in Rs, luminosity in Ls) In about 91% of all stars, size is a function of temperature: the line they call on a diagram is called main sequence. In this line, hotter stars are also extremely large (blue giants), while colder stars are small and dime (red dwarves). Stars are born as contracting spheres of gas; after the brief T Tauri-stage, in which a good part of the matter is thrown off, and the luminosity varies quickly. Growing older, stars pass through the main sequence, burning hydrogen into helium, and, depending from the mass, they can undergo different changes. When hydrogen is running low, the pressure from the radiation at the centre decreases, and the star begins to separate into two layers: a wide diffuse shell and a hot core where helium is burned into carbon, and carbon into oxygen. The star swells up, becoming a red giant. If the star is a low-mass M star (below .25 Ms), the star will evade the red giant stage and steadily become hotter, moving through the spectral classes until it becomes a blue dwarf, and will become a white dwarf over billions of years. It does this because it is fully convective, unlike stars with a higher mass. A star with low mass, such as our Sun, slowly dissipates the shell of hydrogen until only the core remains, becoming a white dwarf. This slowly fades to a cold black dwarf - not a star anymore. A star with higher mass (above 8 Ms at the beginning) continues to burn its elements in different layers, burning carbon and oxygen into neon and magnesium, these in silicon and sulfur, and these in iron. At this point, it becomes a supernova, which explodes, producing all heaviest elements and dispersing them in space. The nucleus can become an extremely dense neutron star, a black hole or an even more violent gamma-ray burst. Given the violence of these events, the lack of energy of white and black dwarves and the instability of supergiants and T Tauri stars, it's safe to assume that only stars in the main sequence (and, perhaps, smaller giants) can be suitable for life as we know it. Also, we can exclude O, B and probably A and early F stars as abodes of life: while extremely rich in energy, they burn out in a few millions years, far too little for complex chemistry, life and especially intelligence to occur in their system. M-class stars are a dubious candidate: they last long, but a planet needs to be very close to them to receive a substantial amount of energy (see here a more extensive treatise). The habitable zone[] Let's see again more details about the best candidates, late-F, G and early-K stars (data from here): Subclass Temp. (°C) Mass Radius Earthlike orbit Lifespan (all A) 7310-9250 1.6-2.9 1.71-2.71 2.93-7.35 AU 0.5-1.2 Ga (all F) 5930-6930 1.19-1.6 1.26-1.64 1.45-2.55 AU 1.6-6.9 Ga F5 6170 1.40 1.44 1.79 AU 3.44 Ga F8 5930 1.19 1.26 1.45 AU 6.88 Ga G0 5760 1.05 1.13 1.22 AU 9.18 Ga G2 5590 0.99 1.02 1.05 AU 10.1 Ga G5 5500 0.92 0.89 0.89 AU 14.0 Ga G8 5300 0.84 0.88 0.81 AU 17.9 Ga K0 4980 0.79 0.79 0.65 AU 21.0 Ga K2 4630 0.74 0.75 0.54 AU K5 4080 0.67 0.68 0.39 AU (all K) 3790-4980 0.61-0.79 0.64-0.79 0.32-0.65 AU 21-50 Ga (all M) 2240-3580 0.1-0.51 0.09-0.63 0.017-0.28 AU > 100 Ga The second-to-last column shows the distance a planet should be from its star, for each stellar subclass, to receive the same energy that Earth receives from the Sun, measured in Astronomical Units (the average Earth-Sun distance: about 149 millions km). More generally, the habitable zone is defined as the range of distance from a star when liquid water can exist on the surface of a planet: for the Sun, it's thought to be roughly 120-240 millions km (0.8-1.6 AU). Note that considering other sources of heat (greenhouse effect, a stronger radioactive decay in the core) or liquids with different liquidity ranges (see here and here) would allow to extend considerably the habitable zone. Also, planets too cold to have liquid water on the surface might still contain reservoirs of it deeper in the crust, provided they have a hot core. The habitable zone's width is directly proportional to r 2T4, where r is the star's radius and T its temperature: so, if the radius increases 3 times, the habitable zone expands 32 = 9 times; if the temperature raises 2 times, the habitable zone expands 24 = 16 times. Still, when that distance is too close (late-K and M stars) the planet risks tidal locking (also, M stars are believed to be subjected to random and violent flares of UV light), while a planet too far away could not receive enough radiations (solar wind) to shed the primitive hydrogen-helium atmosphere, and become a gas giant (also see here and below). Wikipedia states that white dwarfs may have a habitable zone from .1-.15 AU for several billion years. At this point, we've narrowed our search to metal-rich, main sequence stars late-F to early-K as possible life-bearing stars: roughly the 11% of all the stars in the Milky Way. High-mass stars could release a lot of heavy elements due to the supernovae and hypernovae that occurs at the end of their lives, so these could advance civilization if a planet in a system nearby could harbor life and produce sentience. Multiple systems[] About one third of all the star systems in the Milky Way have two or more stars, though this is more common with giants and hot stars high in the main sequence; the closest to the Sun, Alpha Centauri, is a triple star, made up by a bright G2 star similar to the Sun (Alpha Centauri A), a smaller and dimmer K1 star (Alpha Centauri B) and probably a little, faraway red dwarf (Alpha Centauri C, or Proxima Centauri). Some systems have even more stars. In such a system, a planet could follow a very convoluted orbit, which would cause wild variations in temperature, and possibly could fling it out of the system, into interstellar space, as often happens with comets. For this reasons, planets are much rarer in multiple systems than they are in single ones. Stable orbits are unlikely anyway in systems with three stars or more, which leaves the two-stars (binary) systems. The most stable binary systems, taking for granted that all the stars involved are highly-metallic, main-sequence, late-F-to-early-K star'''
