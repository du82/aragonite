{ const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Gryken is a highly vicious marten, descended of the European pine marten (Martes martes) that lives in grykes and crevices of karst on islands in the Mediterranean Basin, 5 million AD, in The Future is Wild. Grykens are only found on the isolated karst Mediterranean islands of barren mountains and woven plateaus. It is the scrofas' greatest enemy. Although grykens go after scroflets, they never attack adult scrofas. Down in a narrow gryke, this slim, agile creature (while tracking prey such as scrofas) can wind from side to side, following the tortuous route of the chasm. Now and again the gryken will stop and poke its head out of a gryke, keeping an eye on a scrofa herd. Then its head goes down again and it continues to negotiate the labyrinth of fissures that separates the clints. In places, a gryken's path is interrupted by a gaping hole, an entrance to the network of subterranean caverns that lies below the karst. Its triangular face is crossed by a thick black band which helps to camouflage its beady eyes when peering out through vegetation. The sleek body is also striped, breaking up the gryken's contours and helping it to blend in with the vegetation. A gryken pokes its head out of a gryke. It is tracking a herd of scrofas and their young called scroflets. The hunter can be poised to leap from the gryke streak towards a helpless infant scrofa (or scroflet). It is a fast, streamlined predator. Like the snowstalker of the cold northern plains, the gryken is a member of the mustelid family. Descended from the tree-living European pine martens of previous times, it has the same long fur-coated body and triangular head. Its ancestors had powerful hind legs which they used to leap through trees, and a long tail to maintain balance as they ran along branches. The gryken, on the other hand, has had to adapt to a habitat of rocky crevices. It no longer needs a long tail for balancing and its legs are long and slim (better suited to squeezing through narrow cracks). It is about 7.8125 inches (20 centimeters) tall at the shoulder and weighs 10 pounds (4.5 kilograms). The stealthy gryken's jaws are full of sharp, dagger-like teeth. Its upper canines are about 0.75 inch (2 centimeters) long, much longer than those of its ancestors, and reach down over its lower jaws. Like the snowstalker of the Northern European tundra, the gryken is saber-toothed. Its long teeth are needed to tear through the tough hides of scroflets, the gryken's main food source. The victim is swiftly disabled, its throat punctured and its windpipe ripped out. Sometimes, grykens will also go after nesting cryptiles. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Mammals Animals Placentals The Future is Wild Europe Mustelids Carnivores Future animals Community content is available under CC-BY-SA unless otherwise noted.'''
