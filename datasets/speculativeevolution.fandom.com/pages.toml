description = "Properly naming organisms is often a tricky endeavour. While Linnean nomenclature has the virtue of universality, its reliance on Latin and Classical Greek, and the complex rules by which the roots are combined, often make difficult the creation of appropriate and pleasing names. In his original work, in the XVIII century, Linnaeus classified life on Earth in a hierarchy with eight ranks: from the largest to the smallest, the  kingdom  (regnum), the  phylum  (also called division), the  class  ("
full_description = '''in: Speculative biology, Tutorial Guide to naming Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Properly naming organisms is often a tricky endeavour. While Linnean nomenclature has the virtue of universality, its reliance on Latin and Classical Greek, and the complex rules by which the roots are combined, often make difficult the creation of appropriate and pleasing names. Contents 1 Classification 1.1 Linnaean taxonomy 1.2 Clade names 2 Binomial nomenclature 2.1 Etymology 2.2 Grammar 3 List of words 3.1 Organisms 3.2 Environments 3.3 Bodyparts 3.4 Colours 3.5 Shapes 3.6 Other features 3.7 Objects 3.8 Geography 3.9 Numbers 3.10 Other 3.11 Particles and appositions 4 References Classification[] Linnaean taxonomy[] In his original work, in the XVIII century, Linnaeus classified life on Earth in a hierarchy with eight ranks: from the largest to the smallest, the kingdom (regnum), the phylum (also called division), the class (classis), the order (ordo), the family (familia), the gen us and the species. A ninth (somewhat informal) rank, the domain, was added in the XX century above the kingdom. According to the modern taxonomy, humans belong to the domain Eukarya, the kingdom Animalia or Metazoa (animals), the phylum Chordata, the class Mammalia (mammals), the order Primates, the family Hominidae, the genus Homo and the species Homo sapiens. As the complexity of classification increased further, in the XIX and XX century, more and more ranks were added, furtherly refining the process - first adding prefixes such as super-, sub-, infra-, and then with entirely new names. The complete chain becomes domain/superkingdom - kingdom - subkingdom - infrakingdom/branch - superphylum/superdivision - phylum/division - subphylum - infraphylum - microphylum - superclass - class - subclass - infraclass - parvoclass - legion - cohort - magnorder - superorder - order - suborder - infraorder - parvorder - superfamily - family - subfamily - supertribe - tribe - subtribe - genus - subgenus - section - series - superspecies - species - subspecies - infraspecies - variety - form. Here is the complete classification of four example lifeforms: humans, fruit flies, sunflowers and the bacterium E. coli (note that different authors can disagree about the details). Domain Eukarya Eukarya Eukarya Eubacteria Kingdom Metazoa Metazoa Plantae - Subkingdom Eumetazoa Eumetazoa Embryophyta Infrakingdom Deuterostomia Protostomia Tracheophyta Superphylum Ecdysozoa Spermatophyta Phylum Chordata Arthropoda Angiospermae Proteobacteria Subphylum Vertebrata Pancrustacea Infraphylum Gnathostomata Hexapoda Microphylum Osteichthyes Superclass Tetrapoda Class Mammalia Insecta Eudicotiledonae Gammaproteobacteria Subclass Theria Pterygota Infraclass Holotheria Neoptera Parvoclass Trechnotheria Antliophora Legion Cladotheria Cohort Placentalia Magnorder Euarchontoglires (Asterida) Superorder Euarchonta Amphiesmenoptera (Euasterida II) Order Primates Diptera Asterales Enterobacteriales Suborder Haplorrhini Brachycera Infraorder Simiiformes Schizophora Parvorder Catarrhini Acalyptratae Superfamily Hominoidea Ephydroidea Family Hominidae Drosophilidae Asteraceae Enterobacteriaceae Subfamily Homininae Drosophilinae Supertribe Drosophiliti Tribe Hominini Drosophilini Heliantheae Subtribe Hominina Drosophilina Genus Homo Drosophila Helianthus Escherichia Subgenus D. (Sophophora) Section Series Superspecies Species H. sapiens D. melanogaster H. annuus E. coli Subspecies H. s. sapiens "Human" "Fruit fly" "Sunflower" Clade names[] Also see: Phylogeny Also see: PhyloCode, art. 10 and art. 11 The name of each category (taxon, plural form taxa) is obtained from a Latin or Greek word (e.g. Plantae = "plants") or from two or more words combined, either both Greek or both Latin (e.g. Tetrapoda = "four feet"). Even when the words are etymologically Greek, they obey the rules of Latin grammar, and they're always plural. Genera and species are treated according to special rules (see below). Often, the rank of degree higher than the genus has a particular ending, which can be found in this table: Bacteria Algae Plants Fungi Animals Phylum -(bacter)ia -phyta -phyta -mycota Subphylum -phytina -phytina -mycotina Class -(bacter)ia -phyceae -opsida -mycetes -zoa (rare) Subclass -idae -phycidae -idae -mycetidae Superorder -anae -anae -anae Order -(bacter)iales -ales -ales -ales -aria, -zoa, -idea Suborder -ineae -ineae -ineae -ineae Infraorder -aria -aria -aria Superfamily -acea -acea -acea -oidea Family -(bacter)iaceae -aceae -aceae -aceae -idae Subfamily -oidae -oidae -oidae -oidae -inae Tribe -eae -eae -eae -eae -ini Subtribe -inae -inae -inae -inae -ina Some of them are not always used. Sometimes, taxa names are formed from a particular genus (eponymus genus), for example the tribe Heliantheae from Helianthus. The root used in the Latin genitive of the genus: since the genitive on Homo is Hominis, the family to which humans belong is called Hominidae rather than Homidae. However, in the vast majority of cases the use of genitive does not make a difference and can be ignored. Usually, any clade name except for genera and species are not italicized, though PhyloCode specifies they should. Today, with modern cladistics, the ranks do not exist anymore, as clades can nest inside other clades that traditionally have the same rank (e.g. "Class" Aves into "Class" Sauropsida), or even in clades that traditionally have a lower rank (e.g. "Class" Aves into "Order" Saurischia). Because of this, most new clade names are not formed with special endings anymore. Since the taxonomic rank has been abandoned, monotypic taxa (those that include only one sub-category) should be avoided: if Cephalotaceae contains only Cephalotus, which contains only C. follicularis, this last one is the only name that should be kept, as the others are superfluous. There still are some cases were special particles are employed: PhyloCode suggests the prefix "Pan-" for total groups (clades that include a living clade and every organism closer to it than to any other living clade), for example Pan-Aves or Pan-Insecta; more generically, "Pan-", "Holo-", "-formes" and "-morpha" make the base group more inclusive, while "Eo-", "Eu-", "Neo-" and "Proto-" make it more specific; "Pseudo-" and "Para-" would be used for similar, but entirely distinct groups. "Apo-" would be used for groups that exhibit a derived trait, for example if Spermatophyta plants are characterized by seeds, "Apo-Spermatophyta" would be the widest clade to include plants with seeds. In some entries, any name of a clade is accompanied by the surname of the author who established it and the year of establishment: for example, "Mammalia (Linnaeus, 1758)" or "Amniota (Haeckel, 1866)". Binomial nomenclature[] The heart of both Linnaean taxonomy and modern phylogeny is the binomen (also called "binomial name" or "scientific name"): the double name that identifies a species. It always include both the genus and the proper species (and sometimes the subgenus, while superspecies are written in the same way as a normal species). They obey special rules different from the higher-ranking taxa names: They always must be written italicized, while the others don't (except according to PhyloCode). Genus and subgenus are always capitalized, just like the other names, while species and subspecies cannot ever be capitalized. Species and subspecies can NOT ever be written alone: it's either Homo sapiens or H. sapiens, but never sapiens alone. The subspecies can be written after the species, obeying the same rules: it's Homo sapiens idaltu or H. sapiens idaltu or H. s. idaltu, but never Homo idaltu or idaltu alone. The subgenus, finally, in inserted between genus and species (if there is one), among parenthesis: for example, Bos (Bos) taurus. Diversely from the genus, even if it exists it can be ignored, writing only genus and species (Bos taurus). Botanical varieties are written like species, but introduced by "variety" or "var." e.g. Escobaria vivipara var. deserti. Domain-Subtribe Genus (Subgenus) superspecies-form Is capitalized? Yes Yes Yes No Is italicized? Only in PhyloCode Yes Yes Yes Can be written alone? Yes Yes No No Can it be ignored? Yes No Yes Yes As with higher-rank names, binomina can be accompanied by the name of the author and the date of their establishment. If the species was then moved to another genus, name and date are between parentheses, otherwise they're not. For example, "Patella vulgata Linnaeus, 1758", but "Passer domesticus (Linnaeus, 1758)" as it was originally Fringilla domestica. If only the genus is identified, of course name and date must refer to it: "Passer Brisson, 1760". In botany, the date is ignored and the name is shortened to its first initial. Summary of possible forms to write a species: Genus species G. species Genus species subspecies G. species subspecies G. s. subspecies Genus (Subgenus) species Genus (S.) species G. (S.) species Genus (Subgenus) species subspecies G. (Subgenus) species subspecies G. (S.) species subspecies G. (S.) s. subspecies Etymology[] Traditionally, the roots used in genera and species names are Latin or Classical Greek words; it's common that, while the genus is more specific, the species name is a generic Latin adjective, such as communis (common), silvestris (wild), domesticus (domestic), borealis (northern), etc. This is not a rule, however. It's recommended that the literal meaning of the binomen is a description of the organism, but in fact any name is acceptable. It's usually recommended to avoid mixing both Latin and Greek roots in the same genus or species (nomen hybridum), though this is not an actual rule. Recently, a habit has been born to use other languages in taxonomic terms: for example, Mei long is a Chinese expression that means "sleeping dragon"; for Chinese dinosaurs, the root long (="dragon") has all but replaced the Greek root saurus (="lizard"). Shuvuuia comes from Mongolian, Balaur bondoc from Romanian; in many cases, Latin endings are added, such as the -ia in Shuvuuia, but this doesn't always happen. Often, one of the roots identifies the place of discoveries: for example, Bakonydraco, the "dragon of the Bakony Mountains". There is no specific rule concerning geographic places, except for euphony (the name should be fluid and pleasant); sometimes, the geographic origin is used as species, with the name of the place turned into a Latin adjective with a suffix such as "-anus", "-icus" or "-ensis", for example Castor canadensis. Another common choice for the species is the surname of a person, as in Apatosaurus louisae, after Louise Carnegie; in this case, a suffix such as "-i", "-ii" or "-ia" is added at the end, unless the surname ends with an "a", which is replaced by "-ae". The suffix "-ae" should be used for feminine names, and avoided for masculine ones. Grammar[] Whatever the etymology of the roots is, the binomen follows the rules of Latin grammar. As detailed here, the names should use only the letters in the Latin alphabet, and nothing else; moreover, it should be easily pronounceable, contain at least a vowel in each syllable and not contain long strings of consonants (though there are accepted names that violate this rule, such as Piatnitzkysaurus and Futalognkosaurus). In the Latin language, adjectives have a grammatical gender too, and they must have the same gender as the name they accompany. The basic form given by vocabularies is the masculine form, usually ending in "-us" or "-is"; as a rule of thumb, adjectives that end in "-us" become "-a" when feminine, and "-um" when neuter; those who end in "-is" stay "-is" when feminine and become "-e" when neuter; those who end in "-er" become "-ra" when feminine and "-ru'''
