e country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Future Evolution is a book written by Peter Ward. It is about the future evolution of life on earth. Unlike Dougal Dixon his views aren't that humanity will die off, he believes Homo sapiens is extinction proof, along with other weedy animals such as rats, crows, snakes, and parasitic organisms. In his views, the Holocene Mass extinction includes the extinction of the megafauna by invasive species. The front cover His future world is not a happy place. By his guess in about the year 3000, the population will stabilize at 11 billion. Many animals that are teetering on the brink of extinction were finally slaughtered by 11 billion people and their hunger. The sea, although thoroughly over-fished, has experienced very few extinctions. Viruses and bacteria are evolving defense against the drugs the scientists are using to cure their patients of their disease. Domesticated animals, by his standards, will survive the longest as they are altered even more by humanity's creativity and needs. By 10 million A.D. most rats have specialized in one garbage dump or another. A time traveler ends up in one of these garbage dumps where he finds species of rats, the future evolution of the pig and the snake, and is then assaulted (and presumably killed) by a horde of highly evolved crows. There are no natural ecosystems at this time. In the last chapter in the book we see life in the last days of habitable earth. There is so little CO2 in the atmosphere plants have to be shrubby and waxy or else they die of starvation. Animals that have been spared by humanity are now low to the ground and heavily armored against desiccation. Species, groups, and even entire phyla are disappearing from a now inhospitable earth. Humans are still around, still working like ants to give themselves a fulfilling "life", and they will probably keep working like that till they drop dead. This is a bit like the Morlocks in "The Time Machine" by H G Wells which carry on working because they have evolved so they want to work. Categories Categories: Future Biology Books Community content is available under CC-BY-SA unless otherwise noted.'''
