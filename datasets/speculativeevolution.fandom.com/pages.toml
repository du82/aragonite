full_description = '''in: The Future Is Wild species, Future is Wild 5 MYF, Rodents, and 6 more Mammals Animals The Future is Wild Future animals Omnivores South America Grassland Rattleback Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The grassland rattleback is a slow-moving, omnivorous rattleback which inhabits the Amazon Grassland in 5 million AD n The Future is Wild. It is an animal that is supremely adapted to dealing with the periodic fires of the grasslands. Its ancestors evolved this way to cope with the rapid loss of forest cover. The grassland rattleback weighs about 25 pounds (11.3 kilograms) and its body is 29 inches (74 centimeters) long, about the size of a human-era badger. It is covered in an armor of thick protective plates used for defense which give it the appearance of a Human-era porcupine The scales which form the plates are actually great mats of hollow hairs, similar to that of pangolins. The air trapped inside the hairs provides insulation against heat. Beneath the roof of scales, there is a layer of insulating pelt, and the animal has rows of spines along its flanks. The hairy plates are the rattleback's first line of defense against bushfires. In most cases hair is soft and fluffy, trapping air between its strands and acting as an insulator, to keep a mammal warm in cold climates and cool in hot climates. But hair can also be highly specialized. Porcupine quills have always been individual hairs, grown stiff, strong and pointed, while the horn of a rhino was made entirely of compacted hair. The basic protein in hair cells is keratin. In fact, it is not just hair cells which contain keratin: skin, nails, feathers, beaks, horns, and hooves are also based on this one substance. Armored plates of thick, stiff hair make rattlebacks durable creatures, able to withstand bushfires and defend themselves from angry carakillers. In the case of the rattleback, the keratin in its large plates has mineralized (minerals from the animal's diet have combined with the keratin to make it harder). In a fire, the grassland rattleback flattens its flameproof back plates, digging its fringe of long tough spines along its sides into the soil around its body. Hunkered down in this way, it can weather out the firestorm as it sweeps overhead. Fireproof plating would be of little use if the grassland rattleback's eyes were not also protected, but it seems that this rodent has all bases covered. In a firestorm, it shields its eyes with a thick layer of hardened skin. When the fire has passed, the rattleback opens its eyes and surveys the damage. At worst, it will have suffered a scorched plate or two, and these are easily regrown. Of much greater interest are the charred corpses of other animals which litter the burnt ground. Food is scarce on the Amazon Grassland and so the grassland rattleback is an opportunistic feeder. Its diet consists mainly of grass stems an buried tubers, which it digs out using its large front paws and strong claws. However, when a fire passes overhead, killing everything in its path, the rattleback is on hand to pick over the spoils. As the flames die down, the rodent helps itself to a barbecue of burnt carrion. Another tasty protein supplement comes in the shape of carakiller eggs (as well as other kinds of eggs), laid on the ground during the wet season, when fires are less frequent. The grassland rattleback shows no fear as it approaches a nest. It simply breaks open an egg and eats it on the spot. Should the enraged mother carakiller return to the nest, the rattleback flattens itself into the soil, wedging itself into the ground with its sharp spines. Muscles at the base of the spines lock them in place, making it almost impossible for anything to dislodge it. The carakiller's beak is useless against this armor and no amount of scratching and clawing will pry the rattleback loose. Sometimes they might curl up in defense. Rattlebacks are solitary animals, coming together only to mate. Competition for food makes them highly territorial and they defend their foraging areas by clattering their heavy back plates. The distinctive, aggressive noise warns off potential intruders. It is this rattle that gives the rattleback its name. In a territorial dispute, the loudest rattle wins and the loser retires gracefully. The grassland rattlebacks are so highly successful in the dry grasslands that are spreading across the Amazon Basin. So much so, in fact, that they were able to migrate northwards, out of South America, into the North American Desert. There it evolved into yet another species, one adapted for life in the cold desert environment, the desert rattleback. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Rodents Mammals Animals The Future is Wild Future animals Omnivores South America Community content is available under CC-BY-SA unless otherwise noted.'''
