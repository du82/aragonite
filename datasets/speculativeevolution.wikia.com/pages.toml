description = "The shagrat is about 3.25 feet (1 meter) high at the shoulder and weighs 275 pounds (125 kilograms). It is a woolly, almost capybara-like ground squirrel with shaggy ragged fur, descended from the marmot, native to such northern tundra as the North European Ice. It is the largest mammal of the northern tundra. They are herd animals, living in large herds, often huddling together for warmth and for predator protection. They have short, stalky legs and small ears to reduce heat loss. Shagrat herds"
full_description = '''in: The Future Is Wild species, Future is Wild 5 MYF, Rodents, and 5 more Mammals Animals The Future is Wild Europe Herbivores Shagrat Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The shagrat is about 3.25 feet (1 meter) high at the shoulder and weighs 275 pounds (125 kilograms). It is a woolly, almost capybara-like ground squirrel with shaggy ragged fur, descended from the marmot, native to such northern tundra as the North European Ice. It is the largest mammal of the northern tundra. They are herd animals, living in large herds, often huddling together for warmth and for predator protection. They have short, stalky legs and small ears to reduce heat loss. Shagrat herds spend their winters at the northern edge of the birch and conifer forest away to the south, where Paris was back during the human days. At the end of the long winter, they migrate back to the edge of the northern ice sheets to reach their summer grazing grounds. The females give birth in early spring, following a gestation period that lasts throughout the winter. In the middle of spring, about a third of each herd consists of youngsters. When shagrats crunch through the banks of shingle and splash through the muddy torrents, their broad feet prevent them from Shagrats are the largest mammals in the Northern European region. Their layered coats protect them from the cold climate of the northern tundra. sinking in. Their fur is so thick that a brief immersion does them no harm - they shake off the water before it soaks into their skin and chills them. Shagrat fur is layered as well as thick. An outside coat of coarse hair provides external protection, and a tightly packed inner layer acts as an excellent insulator. The dense underfur traps a layer of warm air next to the body as insulation, and the long waterproof guard hairs keep this fur dry (these guard hairs are hollow, and the air inside provides extra insulation). This makes two layers of fur. Thus, a shagrat is doubly insulated against the ice age winters. Out in the open, shagrats can survive as low as -50. The herds have to cover large distances each day to find sparse patches of grazing. When searching for food after returning to the open tundra, shagrat herds spread out across meadows and root about, pushing rocks over with their strong forelegs to reveal the soil beneath. The big claws on their forefeet dig into the soil to reach underground grass stems and the roots of heather and willow. Their marmot ancestors were burrowing animals and so their front feet were already well adapted for this kind of foraging. Claws scrape the ground, and plants are uprooted with broad chisel teeth. If one member of the herd smells danger, it barks a warning and the whole herd leaps to attention. There are a few dangerous large animals in the tundra, but shagrats still have things to worry about. An unsettled herd assembles in an open space and, instinctively, the youngsters huddle in the middle. The adults surround them in a defensive formation, all facing outwards. This behavior is very much like that of musk oxen, which employed an identical strategy when under threat from Arctic wolves. The shagrats' chief enemy is the snowstalker, which can follow a herd for days. When such a predator is present, the shagrats bunch up even more closely, narrowing their eyes and baring their teeth, hissing in threat. When a blizzard (that can reach a temperature of -60) strikes, visibility can drop, and traveling shagrats can be vulnerable to snowstalkers that use whiteness all around as cover when stalking. If a shagrat gets tired, ill, or weak and falls behind the herd, it is in serious trouble. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Rodents Mammals Animals The Future is Wild Europe Herbivores Community content is available under CC-BY-SA unless otherwise noted.'''
