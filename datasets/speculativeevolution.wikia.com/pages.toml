full_description = '''in: Exobiology, Planets, Tutorial Alien planets Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Also see: Extrasolar planet Contents 1 Geology 1.1 Planetary development 1.2 Rotation 1.3 Tectonic activity and orogeny 1.4 Average temperature 2 Thalassogens 2.1 Liquidity ranges 2.2 Appearance of the sea 3 Atmosphere 3.1 Gas conservation 3.2 Evolution of the atmosphere 3.3 Biological schemes 4 Meteorology 4.1 Wind and air circulation 4.1.1 Baroclinic weather systems 4.1.2 Barotropic weather systems 4.1.3 Other weather systems 4.2 Precipitations and weather 4.3 Seasons 4.4 Ice and polar caps 4.5 Colour of the sky 5 References Geology[] Though there are speculation about life on gas giants, as far as we know a solid crust is necessary to the complex chemical interaction needed by life, and as a long-term storage of chemicals. It's still unclear what factors create a solid (terrestrial) rather than a gaseous (jovian) planet - since terrestrial planets in the Solar System are the closest to the Sun, it was assumed that planets with higher mass formed and orbited farther from their parent star, but now a number of planets are known to be both gaseous and very close to the star (the "hot Jupiters"). As a general rule, bigger terrestrial planets will have a stronger tectonic activity: for the square-cube law, a bigger planet has a smaller surface relatively to its volume, and therefore leaks away less internal heat. It should have a large molten core rich in metals and radioactive elements (which release more heat), a thick mantle and a thin, brittle crust that is easily cracked by mantle convection. In fact, Earth has a strong tectonic activity, as probably does Venus, while far smaller Mars and Mercury currently have none (though there are old volcanoes that witness a past activity). A large presence of water in the crust also contributes to tectonic activity, lubricating plates and making rocks more pliable. Planetary development[] As far as we know, most of planetary formation occurs by accretion of a disk of gas and dust orbiting the main star. To retain its matter, instead of dispersing it, a planet needs a certain gravitational pull: this being directly linked to density, it needs to be composed by solid elements, common but heavy, such as silicon, aluminium, iron, calcium, carbon and magnesium. Terrestrial planets (Mercury, Venus, Earth, Mars) have a density comprised between 3900 and 5500 kg/m3. As written above, it's now uncertain why protoplanets become terrestrial or jovian. While many gas giants close to their star are known, some studies suggest that they tend to be pushed away from it until they're farther than rocky planets, no matter where they formed. Terrestrial planets are categorized, on the basis of their composition, in a number of categories: Silicate planets, primarily made of solid and molten silicates, with a metallic (mostly iron) core, such as Earth, Mars, Mercury and Venus. Iron planets, primarily made of heavy metals. They might form very close to their star (Mercury is a borderline iron planet, since is mass is 60-70% iron), and since they'd cool rapidly after their formation they wouldn't have plate tectonic or a magnetic field. Carbon planets (purely theoretical), composed by carbon compounds surrounding a metal core. Formed by stars very rich in carbon, they could have rivers and seas of oil and a diamond-rich mantle. Coreless planets, essentially silicate planets without a metal core. They might form far from their star, and they'd have no magnetic field. Super-Earths, silicate planets with a mass significantly higher than Earth's (up to ten times higher). There are several known examples. Rotation[] Being produced by a nebula rotating around the star, all planets keep rotating around their own axis when they take shape. The axial tilt (see below) can vary wildly, and so can the direction and speed of rotation (barring tidal lock); however, rotation will probably be faster in gas giants than in rocky planets (less than 10 hours on Jupiter, over 5000 hours on Venus). Besides the length of the day, wind velocity, the magnetic field etc., rotation also produces oblateness: that is, it makes the planet flatter at the poles and bulging out at the Equator. Earth's polar radius, for example, is 299/300 its equatorial radius. The precise value for oblateness can't be directly computed, but it varies between obmin and obmax (measured as the difference in metres between the two radii), where obmax = (5·pi2·r3)/(G·M·T2) and obmin = 0.315·obmax, where pi is 3.14159, r is the equatorial radius in metres, G is the gravitational constant, M is the planet mass in kg and T is the length of its day in seconds. This difference also has consequences on gravity: the polar gravity is gp = ge·(2.5-K)·(1-ob), where ge is the equatorial gravity and K is a constant depending on the nature of the planet, being 0.5 for bodies with a core extremely denser than the surface (such as giant stars), 0.75 for gas giants such as Jupiter, 0.9 for rocky planets with a large metallic core such as Earth and 1.1 for rocky planets with a reduced core such as Mars. Tectonic activity and orogeny[] Also see: Continental drift Tectonic attivity on present-day Earth (click for better view) As hot molten rock rises from the core, loses heat and descends again, it creates lateral movements just under the solid crust (this process is called convection), breaking it apart in a number of plates. Currently, the surface of the Earth is broken up in seven major plates and eight minor ones, but with time they collide, merge or break apart again. Two plates can meet, and move relatively to each other, in three ways: Transform (conservative) boundaries: the plates slide or grind past each other, creating a faultline (such as the San Andreas Fault in California). Divergent (constructive) boundaries: the plates slide apart from each other, usually in oceans. There is much volcanic activity in the middle, whether it's under water (e.g., the Mid-Atlantic Ridge) and on land (e.g., the East African Rift Valley). New crust is generated from molten rocks, and a continent may be pulled apart. Convergent (destructive) boundaries: the plates slide towards each other. If both plate edges are part of continents, a continental collision occurs, and the edges are lifted upwards, creating a new mountain range. If at least one of the plates is oceanic crust, subduction occurs: one of the edges slides beneath the other and melts into the mantle, releasing the water in its rocks and stimulating volcanic activity (as happened in the Andes range or the Japanese islands). The highest possible mountain height is inversely proportional to the gravity (Mars' gravity is a third of Earth's, and its tallest mountain, Mount Olympus, is three times as tall as Mount Everest). Since orogen (mountain-building) materials have a finite resistence to compression, bigger planets will have shorter and broader mountain ranges. Stronger materials, also, will be able to form higher peaks: Mountain-building properties of various orogens Material Compressive strength (atm) Density (kg/m3) g-Iron (taenite) 33 700 7800 a-Iron (kamacite) 14 900 7800 Diabase (igneous) 4900 3150 Quartzite (metamorphic) 4600 2640 Peridotite (igneous) 2180 3300 Basalt (igneous) 1800-2200 3000 Granite (igneous) 1500-2300 2700 Dolomite marble (sedimentary) 1500 2700 Gneiss (metamorphic) 1100 2850 Limestone (sedimentary) 1100 2600 Granodiorite (igneous) 1100 2850 Sandstone (sedimentary) 500 2100 Chondrites (meteoritic rock) 10-100 3600 Ammonia ice (-120°C) 50 810 Water ice 30-40 917 Siltsone (sedimentary) 30 2900 Carbon dioxide ice 10-20 1560 Methane ice (-170°C) 10-20 500 Argon ice (-170°C) 10-20 As an example, quartzite and limestone have roughly the same density, but quartzite has a compressive strength four times higher, so a limestone mountain will need to have a base surface four times wider than a quartzite mountain to reach the same height. For planets with a lesser mass or a small metallic core, a different source of tectonic phenomena can be found in tidal friction. Orbital mechanical energy is dissipated as heat in the crust, and on a small planet with an extremely large and close moon (or a moon of a large and close planet) the presence of the other body can create tides of rock many metres high, melting and cracking parts of the crust. Tidal friction caused the strong volcanic activity on Io (a moon of Jupiter) and probably melted the inferior layers of ice on Europa (Jupiter's moon) and Enceladus (Saturn's moon). Average temperature[] Albedo examples Water 0.05-0.07 Conifer trees 0.08 to 0.15 Deciduous trees 0.15 to 0.18 Bare soil 0.17 Fresh grass 0.25 Sand 0.40 Clouds 0.35-0.75 Ocean ice 0.50-0.70 Fresh snow 0.80-0.90 Essential for any consideration on atmosphere and liquid bodies, the average temperature of the planet can be easily calculated with the formula T = 374·G·(1-A)·4√I, where A is the planet's albedo, I the relative insulation and G a factor to account for greenhouse effect. (Note: the temperature is in kelvin. To convert it to °C, subtract 273). Albedo is the reflecting power of a surface, that is, the fraction of incoming light that gets reflected rather than absorbed - Earth's average albedo is 0.30-0.35; the Moon, devoid of clouds, has 0.12; Enceladus, ice-covered, has 0.96. Insolation (light incoming from the star) is directly proportional to the 4th power of the star's temperature in kelvin: if it's n times the Sun temperature, then the insulation is n4. For example, with a temperature of 7200 K n is 1.2 and the relative insolation is 2.1. It's also inversely proportional to the square of the distance, so if a planet is twice as distant from the star as the Earth is from Sun it will receive an amount of energy four times smaller. Finally, the factor G depends from the amount of greenhouse gases in the atmosphere: in most habitable planets it will be 1.1 - 1.2. Thalassogens[] Life will likely need a liquid medium to develop in, and to incorporate as a solvent to store and carry chemicals around the body. On Earth, water is the thalassogen, that is, the chemical substance whose liquid form creates oceans on its surface and takes part in organic processes; see the appropriate article about possible solvents other than water. The first requisite for a thalassogen is, of course, being abundant in the universe. Barring noble gases such as helium and neon, which are liquid only at extremely low temperature and/or high pressure and cannot form compounds, the most common elements are hydrogen (H), oxygen (O), nitrogen (N), carbon (C), silicon (Si), magnesium (Mg), iron (Fe) and sulfur (S). Also, the molecule this elements make up has to be simple, or it will be degraded by heat, radiations and other reactants faster than it's synthetized. Moreover, of course, it has to exist in a liquid state in the planet's temperature range: silicon, magnesium and iron form oxides, sulfides, hydrides and nitrides, but metal oxides and sulfides are solid until several thousands of degrees, while hydrides and nitrides are decomposed by heat before they liquefy or in presence of water. It's likely that in an environment rich in hydrogen elements will tend to become as hydrogenated as possible: this means that oxygen, nitrogen, carbon and sulfur will tend to become, respectively, water (H2O), ammonia (NH3), methane (CH4) and hydrogen sulfide (H2S). Other likely simple thalassogens, already present in interstellar space, are carbon monoxide (CO), sulfur dioxide (SO2), cyanogen (CN) and hydrogen cyanide (HCN), while chemical reaction on planetary surfaces are likely to produce carbon dioxide (CO2), nitrogen dioxide (NO2) and carbon disulfide (CS2). Liquidi'''
