description = "The Moonspider, Galeodes luna, is a dark-colored, vicious, nocturnal galeodid sun spider from the lowlands of Skull Island. It measures 6-8 inches long. Night on the ground on Skull Island is a dangerous time and place to be if you are small. Among the invertebrate predators, few have mouthparts that can compete with those of the moonspider. A variety of sun spider, not a true spider, the ten-legged moonspider sports huge crushing scissor chelicerae and paralytic venom to make short work of its"
