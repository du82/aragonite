full_description = '''in: Spec Dinosauria, Animals, Dinosaurs, and 12 more Africa Alternative evolution New Zealand North America Flying Creatures South America Antarctica Theropods Enantiornithes Omnivores Birds Spec Aves Spec Dinosauria: Allospiziformes Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Otherworld finches, cityfinches, crackers, and outlaws are the dominant small-bodied seed-eating birds of Specworld. Together with the odd parrothawks and the Specworld parrots, they comprise an estimated 2,300 species worldwide in 19 major groups. Allospiziforme anatomy shares many convergent similarities with the finches, parrots, and cuckoos of our timeline, so it is no wonder that that the true affinities of this group were long overlooked. While they were once classified as neognaths somewhere between the parrots and pigeons of Home-Earth, subsequent study has shown that the allospiziforms are not parrots, pigeons, neognaths, or indeed any kind of neornithian birds at all. Instead, the allospiziforms are part of the ancient and strange clade Enantiorniths, as evidenced by their shoulder joints and relatively slow metabolisms. Allied to the false panha and the tweetybirds, Allospiziformes probably traces its lineage back to something like the late Cretaceous Gobipteryx, an Asian enantiornith with a strong, toothless beak. Contents 1 BIOLOGY 2 ALLOSPIZIDAE 2.1 Flying Humbug (Avidascyllus bicolor) 2.2 Painted Pfiffle (Falleravis splendens) 2.3 African Toothpick (Dentistavis impavida) 3 CIVILISPIZIDAE 3.1 Alfred’s Hitchcocks (Theornis alfredhitchcocki) 3.2 Pincerbeak Cityfinch (Civilispiza ceratias) 3.3 Mauritian Backscratcher (Civilispiza sauropurgor) 3.4 Comoros Staghorn-Bird (Molochavis comorensis) 3.5 Shell Scooper (Crustaphaga timidus) 4 PSITTACORAPTORIDAE 4.1 Ancient Parrothawk (Pisttacoraptor priscus) 5 APATOPSITTACIFORMES 5.1 Long-Tailed Ground Parrot (Geobates pachyrhynchus) 5.2 Porcuparrot (Echinopsitta longicaudata) 5.3 Pinecone Parrots (Hoplopsitta spp.) 5.4 Palgerigar (Apatopsittaca undulatus) 5.5 Northern Sparrowkeet (Psittacispiza borealis) 5.6 Desert Sparrowkeet (Psittacispiza mexicana) 6 BARORHYNCHIDAE (Crackers) 6.1 Common Cracker (Barorhynchus personatus) 6.2 Tchaikovsky's Nut-Cracker (Barorhynchus sibiricus) 6.3 Hawcracker (Eubarorhynchus coccothraustes) 6.4 Pine Cracker (Pinornis enucleator) 6.5 Tipsy-bird (Bibulornis bibulus) 6.6 BIOLOGY[] Otherworld finches and their kin can be found on every continent (one species makes an incredible annual migration from South America to the Antarctic island of South Georgia) and most oceanic islands. The majority of species feed on seeds, nuts and fruits, with a few insects thrown into the mix (the young, especially, eat lots of insects and spiders). Allospiziforms are tiny to medium-sized birds with zygodactylous feet (both the first and the fourth toes point backwards). The beak is usually stout and triangular and, as in parrots, the upper beak has a hinge-like articulation with the rest of the skull, allowing it to be lifted independently to a greater degree than usual among birds. Unlike parrots, allospiziforms possess a well-developed caecum and a small cartilaginous tongue although this has changed in the parrothawks and Specworld parrots as well as having fewer neck vertebrae than normal (12 - 13). ALLOSPIZIDAE[] Allospizids, the Specworld or otherworld finches, are small, dumpy birds and usually posses a robust parrot-like bill for cracking seeds. The 200 or so species in this family can be found throughout Africa and the entire Northern Hemisphere south of the Arctic. They build intricate, cup-like nests and have a melodious, chirruping song. Flying Humbug (Avidascyllus bicolor)[] Flying humbug, Avidascyllus bicolor (African savannas) When searching for fresh food supplies, vast nomadic clouds of these tiny allospiziforms darken the skies over the African plains. When threatened by aerial predators on the wing they form a dense, globular structure. Flying humbugs generally feed on tall, seeding grasses as well as flying insects. Unlike the poisonous twitiavids that afford simple nests, otherworld finches take more drastic measures to protect their non-toxic eggs. The flying humbug in particular builds a complex nest with many “mini nests” on top, with a central chamber where the eggs are generally safe. Painted Pfiffle (Falleravis splendens)[] Two adult males and an adult female painted pfiffle, Falleravis splendens, around a nest on a tulip tree, p-Liriodendron paratulipifera (Eastern North America) The painted pfiffle is one of the most beautiful allospizian species to dwell in North America. Males sport vivid black, orange, and red plumage to attract mates, and are easily recognized from a distance. Subadult and adult painted pfiffles feed exclusively on large seeds, which they crack open with their powerful bills; juveniles prefer small seeds and insects. Like all pfiffles, this species is migratory, flying to and from its winter feeding grounds in South America every year to nest in the deciduous forests of eastern North America. Females migrate a few weeks ahead of the males, giving them time to construct or renovate their future homes. These bag-shaped nests, made of grass and sticks covered with a mud-and-saliva mixture, are nearly indestructible, and a female will come back to her nest year after year, making repairs as her abode wears out. This method of home-making is common among the allospiziforms, and is taken to extreme by the African cityfinches (see below). Unlike their distant cousins, however, pfiffles do not enlarge their nests past their original size, and a nest is usually abandoned after its maker dies. African Toothpick (Dentistavis impavida)[] <a href="http://speculativeevolution.wikia.com/wiki/File:African_toothpick.jpg"><img alt="African toothpick" src="https://static.wikia.nocookie.net/speculativeevolution/images/8/8d/African_toothpick.jpg/revision/latest?cb=20161216160822" decoding="async" loading="lazy" width="131" height="186" class="thumbimage" data-image-name="African toothpick.jpg" data-image-key="African_toothpick.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/8/8d/African_toothpick.jpg/revision/latest?cb=20161216160822" /></a> African toothpick, Dentistavis impavida, cleaning the teeth of a priscataur The African toothpick lives in symbiosis with the priscataurs. The giant theropods have completely lost their forelimbs, and as a result have no way of cleaning the flesh and assorted material that gets stuck between their teeth and in their numerous cranial horns when they feed. Instead, after feeding, they attract toothpicks by extra-scary, deep bellows and let the birds swarm around their mouths, picking up whatever scraps they can find, and often also cleaning the dinosaur of parasites (such as the dinomite, Sauracarus philopriscataurus, which can often be found in the ears of priscataurs). This also distracts the birds from open wounds, as they otherwise drink blood from animals they land on. The other three toothpick species are for the most part insectivores, but also have a tendency to eat tetrapod meat, either scavenging or attacking other animals like small mammals, bashing their skulls with rocks while they’re asleep in order to eat their brains. All toothpicks are nest parasites, laying their eggs in the nests of other avians, favoring other opposite-birds due to their relatively relaxed acceptance of other eggs, as enant parents aren’t as pressured as “true” bird parents in terms of wasting energy in raising the chicks that will hatch. Other birds also accept toothpick eggs, however, as their at-best-distasteful poisonous eggs discourage nest raiders. CIVILISPIZIDAE[] The most remarkable of the allospizians, the cityfinches are the closest either of our universes has come to creating eusocial birds on par with ants and bees. The family contains about 50 species and is restricted to Africa and Madagascar. Cityfinches eat primarily grass seeds and other grains, and most species dwell in permanent colonies or cities, many rivaling human settlements in their population density and relative size. Most cityfinch species dwell in permanent colonies or cities. Many forms exhibit extreme sexual dimorphism, the result of the different sexes performing differing functions in cityfinch society. Alfred’s Hitchcocks (Theornis alfredhitchcocki)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/9/98/Allos04.jpg/revision/latest?cb=20130913234126" class="image"><img alt="Allos04" src="https://static.wikia.nocookie.net/speculativeevolution/images/9/98/Allos04.jpg/revision/latest?cb=20130913234126" decoding="async" loading="lazy" width="273" height="425" class="thumbimage" data-image-name="Allos04.jpg" data-image-key="Allos04.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/9/98/Allos04.jpg/revision/latest?cb=20130913234126" /></a> Alfred’s hitchcocks, Theornis alfredhitchcocki (African savannas) The most primitive of the cityfinches, Alfred's hitchcocks display a less pronounced degree of dimorphism between the two sexes. However, this species creates the largest cities and displays the highest degree of aggression in their defense. A hitchcock city begins as a globular structure with a single entryway built of mud, twigs, droppings, and saliva in the branches of a tree in the savanna. As the colony grows, additional chambers and entrances are built and the city soon fills most of the lower branches and eventually extending down the trunk towards the ground. Fully-grown cities completely obscure the shape of their long-dead host-tree and resemble great clay skyscrapers growing out of the ground. Such a colony may be over 2 centuries old and may contain over a thousand birds. Each large city is a maze of tunnels, nest chambers, nurseries, and storage facilities. Some chambers act as gardens where the birds harvest fungi grown from refuse. Actively utilized chambers are generally restricted to the outer 2 meters of the colony. The fanaticism with which hitchocks defend their cities is nothing short of terrifying. Unlike other species, scouts and serfs will also engage enemies in combat. Normally intruders are seen off with swooping displays. However, the high-pitched distress calls emitted by injured or dying birds seem to send the entire colony into a state of bloodlust, with birds murderously attacking any non-hitchcock within a 100-meter radius of the colony. The warbirds secrete a toxin in their saliva which produces painful sores on the skin when pecked. If provoked by a large animal, the birds swarm upon the unfortunate beast in a frenzied, uncoordinated attack with little regard for their individual safety. There is one documented case of an old, crippled horned molok, it was eventually revealed that it was wounded by a sahel elumbe hours earlier, which stumbled into a large hitchock city, caving in one side of the colony and immediately incurring a warbird attack. Panicked and confused, the theropod blundered into the colony again, tripped, fell, and was immediately consumed in a cloud of furious birds, its agonized cries audible above the din of screeches. The attack petered out in about 20 minutes and the molok's carcass was examined while keeping a watchful eye (and flamethrower) on the blood-drenched warbirds which glared down at the researchers while serfs began to repair the damaged colony. Both the theropod's eyes had been pecked out and its orbits were filled with dead hitchocks as were its nostrils, ears, and colon. <a href="https://static.wikia.nocookie.net/speculativeevolution/images/0/05/City02.jpg/revision/latest?cb=20130913234125" class="image"><img a'''
