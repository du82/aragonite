full_description = '''in: The Future Is Wild species, Future is Wild 5 MYF, Primates, and 6 more Animals Mammals The Future is Wild South America Omnivores Future animals Babookari Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Babookaris are well adapted to life on the ground and can cover large distances in search of food. They communicate with other members of the troop by waving their long tails above the grass-tops. The babookari is a pitheciine pitheciid, descended from the uakari(Cacajao) living in the Amazon Grassland, in 5 million AD, in The Future is Wild. They are among the last of the New World monkeys. Out on the grassy expanse, babookaris will move in a group about 30 strong, their long tails sticking up. Occasionally, one stops and raises its head above the tops of the grass stems. The face is almost humanlike, and is round with red naked skin, framed in a lion-like mane. The deep rainforest that once grew here was home to a number of New World monkey species. There were large monkeys that lived mainly on the forest floor, agile monkeys that primarily swung about in the branches and tiny, acrobatic that leapt from treetop to treetop. The fertile habitat could sustain such variety. Now the rainforest has gone, replaced by an unchanging stretch of grassland. As it shrank to islands of trees and, finally, to isolated stands, those species of New World monkey which could not adapt became extinct. One species not only survived, but flourished. The uakaris, that were found in the northwestern Amazon Basin, were some of the most adaptable of Quaternary monkeys. It was an omnivore, eating anything from insects and fruits to leaves, seeds and even smaller vertebrates. It was at home in the trees, but just as comfortable on the ground. Such generalism left it well positioned to adapt to the retreat of the rainforest. The uakaris were able to abandon their arboreal way of life and take to living on the grasslands which were spreading across the Amazon Basin. This is not the first time that rainforests have been replaced by grasslands. Back in the Late Neogene period, a similar phenomenon occurred in Africa, brought on by a drop in atmospheric humidity levels. Then, the ancestors of baboons left the trees and took to dwelling mainly on the ground, becoming more quadrupedal in the process. Now, in South America, the descendants of the uakaris have done exactly the same. They have evolved into babookaris. Like all primates, the hands of a babookaris are prehensile, that is, they are adapted for grasping or gripping. Now, though, they are more often used for walking than for swinging through trees. The babookari is essentially a larger version of its uakari ancestor, down to its hairless red face. It is about 18 inches (46 centimeters) high at the shoulder and weighs 40 pounds (18 kilograms). One major difference is the babookari's tail. The uakari was unusual in that it was a New World monkey that did not possess a long, prehensile tail. Its descendant has evolved a long tail, but this is not like a muscular, extra limb used for swinging about in trees. Instead it is a tall, inflexible rod, about 32 inches (81 centimeters) long with a tuft of hair at the end. This tail is used for signaling across the plains. Being a social animal, the babookari needs signaling devices such as its long tail, colored chest, colored bottom and colored face. The only way a monkey can live on the open grassland is as part of a troop. A large group of 30 or so individuals can quickly scour a wide area of savannah for food and can cooperate in defense against certain predators. Babookaris are dexterous enough to weave fish traps form the long grasses. They place the traps in the rivers which wind across the savannah during the wet season. Since it came down from the trees, this monkey has gained a great deal of intelligence. It has retained enough dexterity in its hands to be able to weave hollow, spherical fish traps from grass stems. Babookaris deploy these basket-like structures in the shallow seasonal rivers that wind their way across the plain. Fish is an excellent protein supplement for these omnivorous primates. When on fishing trips, the troop stays together. Some individuals work the traps, while the others are on the lookout for danger. The older individuals are the more skillful at making the baskets. The younger individuals watch them and learn how it is done. On the open grassland, danger can come in many shapes and sizes. Almost certainly, however, it will come on long legs, like the carakiller. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Primates Animals Mammals The Future is Wild South America Omnivores Future animals Community content is available under CC-BY-SA unless otherwise noted.'''
