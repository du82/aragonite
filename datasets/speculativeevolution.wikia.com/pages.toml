description = "The Foetodon, Foetodon ferrus, is a large, bulky, lizard-like notosuchian from the jungles of Skull Island that relies on ambush. It measures 15-20 feet long. The giant, broad-bodied Foetodon is a surly jungle predator and scavenger, well-adapted to life prowling leaf litter-chocked forest floor. Scutes along its back betray the species common ancestry with crocodilians, but the snout is short and heavily reinforced for bone-crushing and brutal territorial confrontations. The Foetodon has poor e"
full_description = '''in: Animals, Skull island, Reptiles, and 9 more Skull Island animals Paracrocodylomorphs Carnivores Suchia Archosaurs Crocodylomorphs Craniates Amniotes Cannibalistic Foetodon Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Foetodon, Foetodon ferrus, is a large, bulky, lizard-like notosuchian from the jungles of Skull Island that relies on ambush. It measures 15-20 feet long. The giant, broad-bodied Foetodon is a surly jungle predator and scavenger, well-adapted to life prowling leaf litter-chocked forest floor. Scutes along its back betray the species common ancestry with crocodilians, but the snout is short and heavily reinforced for bone-crushing and brutal territorial confrontations. The Foetodon has poor eyesight, but, as a solitary ambush predator, this does not impede its success. Lying concealed beneath leaves in excavated scrapes along the edges of game trails, the predator will wait patiently to ambush oblivious prey using the path. Most often these are small herbivores (like Pugiodorsus, tree-tops or one of the large flightless birds like Hylaeornis) caught unawares as they pick their way along the path, but a Foetodon takes virtually any prey available, even Ligocristus, young Kongs, and Avarusaurus. The boorish carnivore cannot afford to be choosy. Its attitude is one of “bite first and ask questions later.” As such, much depends upon the effectiveness of the first, powerful bite. A Foetodon’s physiology is geared toward small bursts of activity with long periods of rest in between. When lunging, it can do so with frightening speed and power. The massive jaws exert a staggering pressure, enough to shatter bones and cripple, thereby ensuring that even if it fails to kill or secure the prey with the first bite, the wounded victim is unlikely to be able to escape. The species has an excellent sense of smell for tracking wounded fellow vertebrate prey. It also uses its keen nose to grub out invertebrates living amid the thick leaf litter. This veritable sea of decomposing vegetable matter can be many feet deep and hide all manner of small snacks to interest a hungry Foetodon. Indeed, the young live exclusively on these morsels while still small and conceal themselves in the detritus and in marshes from larger predators, including cannibalistic members of their own kind. The adults themselves can have predators, like V. rexes. Skeletal Adaptations[] No longer a water predator like its distant ancestors, a Foetodon relies upon the power of its strong, high-mounted back legs to propel it forward when striking. Because juvenile Foetodon still spend much of their lives in water, a large, powerful, broad tail (like a crocodile’s) is retained in the larger land-based adult. Foetodon sometimes suffer from a disfiguring infection picked up from the leaf litter. So virulent can the infection become that even the bones of the reptiles frequently bare cruel scars. Youngster survival[] Using the shallow ponds as nurseries, baby Foetodon swim among the weeds, hunting invertebrates and swamp-wings until old and large enough to survive ashore. During their infancy they are often prey for wading birds, the sharp pickax-like bills of herons like the great grey heron making short work of their leathery armor. The tables will be turned when the infant reptiles are grown. Juvenile Foetodon are also common prey to young Piranhadon, snapped up as they float on the surface in their nursery groups. Categories Categories: Animals Skull island Reptiles Skull Island animals Paracrocodylomorphs Carnivores Suchia Archosaurs Crocodylomorphs Craniates Amniotes Cannibalistic Community content is available under CC-BY-SA unless otherwise noted.'''
