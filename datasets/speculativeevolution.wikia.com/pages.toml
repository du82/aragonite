description = "Unlike other deinonychosaurs, hesperonychids (who, despite their name, are unrelated to the cretaceous microraptorine Hesperonychus, a possible renaming of the entire family of deinonychosaurs will take place some time in the future) possess a highly flexible joint on their inner toes, rendering these talons not only hyper-extendable, but also opposable, with the other two toes of the foot (to one degree or another). While some have suggested this trait links the hesperonychids to the arbronychi"
full_description = '''in: Spec Dinosauria, Alternative evolution, Dinosaurs, and 8 more South America North America Carnivores Central America Theropods Dromaeosaurs Maniraptorans Coelurosaurs Spec Dinosauria: Hesperonychidae Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Unlike other deinonychosaurs, hesperonychids (who, despite their name, are unrelated to the cretaceous microraptorine Hesperonychus, a possible renaming of the entire family of deinonychosaurs will take place some time in the future) possess a highly flexible joint on their inner toes, rendering these talons not only hyper-extendable, but also opposable, with the other two toes of the foot (to one degree or another). While some have suggested this trait links the hesperonychids to the arbronychids, other morphological and genetic evidence suggests otherwise, and instead classifies the hesperonychids as basal deinonychosaurs related to the mattiraptors. Perhaps this peculiar pedal anatomy was originally intend for use in the trees, but today only a single hesperonychid genus (Janaata) has many arboreal proclivities. In many larger species, this unique toe joint is almost completely atrophied, changing the sickle claw back from a grasping tool to a piton. The deinonychosaurs of South America include the apex terrestrial predators on the continent (a land of huge, tyrannosaur-like raptors and tiny to medium raptor-like tyrannosaurs), driving all of the abelisaurs native in the area into the point of extinction during the Pliocene. Although sickle-clawed coelurosaurs have a long history on the continent, the current assemblage of raptorial predators, with the exception of the enigmatic Mergaraptor, are fairly recent additions to the Neotropical fauna derived from North American hesperonychid stock. When these forms first arrived here in the Pliocene, they quickly consolidated their position with some forms attaining enormous sizes. (Ironically, the hesperonychids have since been displaced throughout much of their northern range by the invading Eurasian boreonychid draks.) Contents 1 SOUTH AMERICAN SPECIES 1.1 Jagular (Jagularus robustus) 1.2 Ocelotar (Jagularus ferox) 1.3 Lophoraptor (Lophoraptor alecto) 1.4 Magnoraptor (Magnoraptor altas) 1.5 Djanada (Janaata russelae) SOUTH AMERICAN SPECIES[] Jagular (Jagularus robustus)[] Jagular, Jagularus robustus (Amazon) Only a few species of large animals can live in the shadow of a tropical rain-forest. Trees are too large, and grow too thickly to allow space for large forms to pass. Some ground-dwellers, however, do manage to eke out a living, and these creatures are eaten by the jagular (Jagularus robustus). Jagulars are part of the diverse, South America radiation of hesperonychids , the descendants of North American deinonychosaurs, which migrated to South America when the two continents linked up. The bodies of these two-meter long predators are laterally compressed and their legs are rather short, allowing the animal to slip between tree trunks. Compared to other deinonychosaurs, jagulars have poor eyesight, and rely on smell and sound to hunt. Ocelotar (Jagularus ferox)[] Ocelotar, Jagularus ferox (Amazon) The Ocelotar (Jagularus ferox), also known as the dwarf Jagular, is smaller than its close cousin, the jagular. These secretive theropods are completely nocturnal and have convergently evolved the a spotted pelt, like RL big-cats. Ocelotars group together in packs of about ten. In the densely wooded jungles, one can only see a few meters through the twisting vines and tree trunks and most rainforest citizens invest most of their senses in hearing or smell. The ocelotar is no exception. Lophoraptor (Lophoraptor alecto)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/d/d5/Lopho.jpg/revision/latest?cb=20131123194954" class="image"><img alt="Lopho" src="https://static.wikia.nocookie.net/speculativeevolution/images/d/d5/Lopho.jpg/revision/latest?cb=20131123194954" decoding="async" loading="lazy" width="682" height="285" class="thumbimage" data-image-name="Lopho.jpg" data-image-key="Lopho.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/d/d5/Lopho.jpg/revision/latest?cb=20131123194954" /></a> Lophoraptor, Lohporaptor alectro (Mexican-Patagonian grasslands) Lophoraptor alecto (4.5 meters long) is a fairly large and adaptable hesperonychid that can be found from southern Mexico to Patagonia (although it avoids thickly forested areas). Lophoraptors live in large packs of up to 20 individuals with an organized method of hunting that allow them to bring down large prey. They will attack anything from young pseudosauropods down to mammals. Lophoraptors are communal breeders with the entire pack tending to the nests and young (though infant mortality is high). Magnoraptor (Magnoraptor altas)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/d/d9/Magno.jpg/revision/latest?cb=20131123195757" class="image"><img alt="Magno" src="https://static.wikia.nocookie.net/speculativeevolution/images/d/d9/Magno.jpg/revision/latest?cb=20131123195757" decoding="async" loading="lazy" width="649" height="531" class="thumbimage" data-image-name="Magno.jpg" data-image-key="Magno.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/d/d9/Magno.jpg/revision/latest?cb=20131123195757" /></a> Magnoraptor, Magnoraptor altas (South American pampas) Growing up to lengths of 8 meters in length, the Magnoraptor, Magnoraptor atlas, which has no relation to the Cretaceous Megaraptor, is the largest dromaeosaur known to the world of Spec and one of the top predators of South America, growing larger than some other species of prehistoric dromaeosaur like Utahraptor, Achillobator, and the recently discovered Dakotaraptor who roamed North America and Asia in the past. This giant is found throughout the continent in a variety of habitats. Magnoraptors live alone or in small family groups, patrolling a large territory and often following large herbivores on their migratory routes. They prey mostly on slow moving herbivores but will also scavenge from carcasses. Deinonychosaurs, those versatile, predatory near-birds, have enjoyed enormous successes throughout the latter part of the Mesozoic and the Tertiary. However, diversification of form within this clade has been stunted by the demands of a deinonychosaur's life. Even tiny changes to their anatomy would result in a creature that would not be able to feed itself, and so the deinonychosaur form has stagnated, not changing appreciably in more than 100 million years. Djanada (Janaata russelae)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/b/bf/Djanada.jpg/revision/latest?cb=20131026164617" class="image"><img alt="Djanada" src="https://static.wikia.nocookie.net/speculativeevolution/images/b/bf/Djanada.jpg/revision/latest?cb=20131026164617" decoding="async" loading="lazy" width="600" height="405" class="thumbimage" data-image-name="Djanada.jpg" data-image-key="Djanada.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/b/bf/Djanada.jpg/revision/latest?cb=20131026164617" /></a> Djanada, Janaata russelae (South American cloud forests) There are exceptions to the rule, of course, aberrant forms that differ greatly from their progenitors and still function as organisms. One of these creatures is the djanada (Janaata russelae). Djanada live only in the cloud forests of northern South America, where moisture trapped by the rising Andes rains onto a canopy that stretches across the horizon. As lush as the Amazon, but somewhat cooler, the cloud forests are biological islands, isolated from the rest of the continent by the mountains. The djanada is a small animal, never longer than two meters, and very lightly built, with long neck and tail and large, nimble hands. Most noteworthy, though, are a djanada's feet. The famous hyper-extendable inner toes of the deinonychosaurs have been twisted almost completely around, and now oppose the other two toes to create a powerful grasping organ. A djanada's pedal grip comes in useful for climbing trees, but is also a useful hunting tool. The predators may stand balanced on a single foot on the shadowed forest floor, or in a small stream, and wait for a small animal to happen past. When a djanada sees such a victim, it slams its foot down, pinning the hapless creature to the ground. Because of their opposable toes, some scholars have allied djanada to the arbronychosaurs, however the creatures' internal anatomy (most notably their lack of visible hallux claws) negates this assumption. Instead, djanada are placed in their own family, Janaatidae, a sister group to Hesperonychidae, from which the djanada are undoubtedly derived. ~Brian Choo, Daniel Bensen , and David Namen Categories Categories: Spec Dinosauria Alternative evolution Dinosaurs South America North America Carnivores Central America Theropods Dromaeosaurs Maniraptorans Coelurosaurs Community content is available under CC-BY-SA unless otherwise noted.'''
