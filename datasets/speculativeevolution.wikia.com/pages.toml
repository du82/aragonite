full_description = '''in: Speculative biology, Intelligence, Community, Tutorial Intelligence Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Part of a series on speculative biology Champion speciators Development of intelligence Ecology Evolution Intelligence Intelligence on Earth Offense and defense Perception Reproduction Speculative bioenergetics Speculative biomechanics Speculative physiology Vision Also see: Development of intelligence, Intelligence on Earth, Intelligent aliens Intelligence is hard to define exactly: it can be interpreted as a mental feature, or a set of features, that involve reasoning, planning, goal-oriented behaviour, learning from experience, abstract thought and projection, problem-solving and intentional self-adaptation to the circumstances. A great number of speculative-biology projects, especially those about extraterrestrial life, try to include high, human-like intelligence for at least one species, for it's necessary to derive from biological interactions the extremely complex structures and behaviours that form a civilization such as ours. Contents 1 Features of intelligence 1.1 Categorization 1.2 Memory 1.3 Spatial cognition 1.4 Reasoning and problem solving 1.5 Self-consciousness 1.6 Math 1.7 Symbol interpretation 1.8 Mind theory 2 Encephalization quotient 3 Tool use 4 Language 5 Consciousness 5.1 Genetic sentience 5.2 Individual sentience 5.3 Communal sentience 6 Examples in speculative biology 7 References Features of intelligence[] Of course, living organisms cannot simply be divided as intelligent and not-intelligent. Being as complex as it is, it can be broken up in many characteristics, degrees and specializations. Xenology mentions two basic, not-too-anthropocentric sets of criteria to analyze intelligence. Edward Wilson's "behavioral hierarchy" divides it into three general levels of complexity, the last two of which are limited to animals, since they need a nervous structure to carry information: Stimulus → reaction process: simple biochemical mechanisms produce an automatic reaction to each relevant stimulus. Bacteria and protozoa can orient themselves in the environment and look for nourishment by following chemical and luminous signals; animals at this level include sponges, coelenterates and flatworms. Directed learning: arthropods, cephalopods and most vertebrates have a complex nervous system that allows the individual development of sterotyped behaviours as a response to familiar situations; however, they still rely often on genetic-based inherited behaviours (instincts). Generalized learning: primates, canids, corvids and few other animals (see "Intelligence on Earth") retain a wide range of memories, allowing the formulation of complex behaviours that can be modified and adapted to new situations and the generalization of patterns. Only a few basic biological functions are still committed to instinct. The aerospace computer scientist Roger MacGowan has produced a list of five basic criteria that he considers both necessary and sufficient to determine intelligence itself in any conceivable lifeform: Input: the sensory input from the environment, deeded as raw material for intelligence to work on; Storage: conservation of information as memories for a future need, necessary for learning; Deduction: the ability to insert currently received information in learned categories based on memories; Induction: the extension of past experience to expected future events; Output: physical or mental activity as response to processed information. Among the numerous capabilities that make up intelligence, these seem to be the most important: Categorization[] A capability of inductive categorization is necessary to learn about the environment: an animal stung by a wasp learns to avoid everything that looks yellow and black. More complex is the formation of categories based on abstract concepts: in the Vaughan experiment, some pigeons exposed to images randomly distributed in two arbitrary sets learned to peck, rewarded with food, only the images of a particular set, considering as relevant property the membership to it, and not any perceptible feature. The California sea lion Rio (1986-) has shown a great ability to create categories, associating pictures of animals and objects according to similarity (e.g. different crabs), abstract qualities (e.g. "food"), logical transitivity (if A→B and B→C, then A→C) and even distinguishing letters from numbers. Memory[] Memory is in turn a combination of many different features. The most known is the spatial memory, well expressed by animals that stockpile food, such as Clark's nutcracker, tits, jays and squirrels. Despite their extremely tiny nervous system, bees can remember for days data met only once, and for all life data met at least three times. Spatial cognition[] The classic labyrinth test is solved in different species with different abilities: ants and bees mark with chemicals the places where they've already been, pigeons commit to memory the environmental features, rats get to the treat at the centre of a radial labyrinth (a cetral platform with a number of arms, generally 8, only one of which contains food; it forces the rat to start anew from the centre each time) visualizing its geometric structure. Even the slime mold Physarum polycephalum, a colonial amoeba, is able to find the shortest path to exit from a labyrinth by scouting it with tendrils, mantening the colony cohesive. Reasoning and problem solving[] Over the course of several experiments, chimpanzees proved to be able to understand the operation of a structure and use it to their own advantage, for example to get food, not simply through trial-an-error or previous training, but through preemptive reasoning; New Caledonian crows appear to be able to comprehend and implement cause-and-effect relationships, and even combine more tools (also see below). Self-consciousness[] Also see: Consciousness A baboon being subjected to the mirror test. Self-consciousness is generally understood as the capability of an individual to distinguish itself from the environment (including other individuals) without a direct intervention of sense organs. It's very difficult to test this capability in animals: the mirror test, in which it's controlled whether an animal is able to see in a mirror a mark on its body (and therefore recognize the image in the mirror as its own image, and not another individual) has been passed by chimpanzees, gorillas, european magpies, some species of cetaceans and an elephant, but not monkeys. While of some significance, the mirror test is thought to be incomplete and biased towards sight. Another factor currently under study is metacognition ("knowing to know"), the perception of one's own knowledge: in a 2009 experiment, some rhesus monkeys were able to evaluate the tests' difficulty by expressing uncertainty for the most complex ones, instead of trying a random answer. Math[] Many animals are able to distinguish different quantities: angelfish seem to be able to recognize the large set, provided that it is at least twice as large as the other; pigeons and other birds can sort sets of objects from the smallest to the biggest; rhesus monkeys can recognize the smaller between sets whose elements look different, and the same number of visual and auditive stimuli; african elephants are able to perform simple additions, computing the total number of apples left in buckets in different times. Symbol interpretation[] The capability for abstraction is extremely rare in the animal kingdom: most species reacts to an object's depictions only if realistic enough. It's strictly related to the abilities of categorization and prototype formation; for example, a human can see a face in a simple : ), identifying two dots and a curved line as the basic elements of a human face. The recognising of abstract symbols, that do not resemble at all to the symbolised object, has probably been developed with the association between animals and their footprints. Also see categorization. Using complex languages requires symbolic abstraction to associate concepts with words (see below). Mind theory[] It's called "mind theory" the capability to attribute mental states (knowledge, beliefs, intentions, desires...) to other individuals: it's likely the single biggest incentive to intelligence in a social species. A baboon does not warn others about a danger they can't see, since it ascribes to everyone the same knowledge it has, as 3-years old children do. Chimpanzees, however, often take food for themselves only when they know individuals of higher rank can't see them, and they can deceive others giving them false notions: for example, pretending to be hurt or sick to get more food (see here, pages 41-47). Many of the abilities above described exist, even well-developed, in organisms that are not thought to be especially intelligent, such as spatial memory in migratory birds and seed-stockpilers, or the orientation and complex language of bees. They're, however, highly specialized skills; we can give a new definition of "intelligence" as the capability of integrating and coordinate these skills together. This capability belongs, above all, to primates, cetaceans and some groups of birds (see Intelligence on Earth). Encephalization quotient[] Encephalization quotient, or EQ, is a way to measure the brain's development in an animal (or, more properly, a vertebrate) species. It could be thought that mere brain size would be indicative of intelligence, but let's consider this list of 38 animal species, ordered by brain mass (data from here, here and here): Animal Brain mass Body mass Sperm whale 8000 g 56000 kg Killer whale 7200 g 7200 kg African elephant 5000 g 6000 kg Manta ray 2000 g 1500 kg Bottlenose dolphin 1700 g 160 kg Homo sapiens sapiens 1500 g 75 kg Homo neanderthalensis 1400 g 70 kg Walrus 1100 g 610 kg Homo erectus 900 g 55 kg Giraffe 700 g 1200 kg Gorilla 600 g 250 kg Horse 600 g 400 kg Hippopotamus 580 g 1600 kg Zebra 530 g 450 kg Chimpanzee 500 g 65 kg Cattle 430 g 470 kg Tegu lizard 400 g 40 kg Lion 240 g 200 kg Monitor lizard 230 g 23 kg Wolverine 185 g 15 kg Pig 180 g 70 kg Baboon 140 g 30 kg Dog (husky) 140 g 32 kg Sulcata tortoise 100 g 50 kg Rhesus macaque 90 g 9 kg Giant octopus 70 g 14 kg Giant cuttlefish 70 g 11 kg Cat 30 g 3 kg Crow 13 g 0.4 kg Rabbit 12 g 2.5 kg Nile crocodile 9.4 g 760 kg Saltwater crocodile 9.1 g 800 kg African grey parrot 9 g 0.4 kg Elephant fish 3 g 0.1 kg Hummingbird 3 g 0.08 kg Rat 2 g 0.4 kg Anole 1 g 0.1 kg Mouse 0.45 g 0.02 kg This is not entirely useful. Obviously bigger animals need bigger brains to operate at the same level of cognition: due to its sheer mass, a hippopotamus needs a bigger brain than a cat. On the other hand, a man and several other animals have roughly similar brain mass but wildly different body sizes. We need a more refined approach. This list gives the same species ordered according to a new feature, the brain-to-body mass ratio, that is, the brain mass divided by the body mass: Animal Brain/body ratio Hummingbird 1:27 Crow 1:31 Elephant fish 1:33 African grey parrot 1:44 Mouse 1:44 Homo neanderthalensis 1:50 Homo sapiens sapiens 1:53 Homo erectus 1:61 Wolverine 1:81 Bottlenose dolphin 1:94 Rhesus macaque 1:100 Cat 1:100 Tegu lizard 1:100 Monitor lizard 1:100 Anole 1:100 Chimpanzee 1:130 Rat 1:200 Octopus 1:200 Giant cuttlefish 1:200 Rabbit 1:210 Baboon 1:210 Dog (husky) 1:230 Pig 1:390 Giraffe 1:420 Sulcata tortoise 1:500 Walrus 1:550 Horse 1:670 Gorilla 1:670 Manta ray 1:750 Lion 1:830 Zebra 1:850 Killer whale 1:1000 Cattle 1:1100 African elephant 1:1200 Hippopotamus 1:2800 Sperm whale 1:7000 Nile crocodile 1:81 000 Saltwater crocodile 1:88 000 That's better, but there are st'''
