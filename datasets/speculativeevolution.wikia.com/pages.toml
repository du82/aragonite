["https://speculativeevolution.wikia.com/wiki/Skull_Island_Gaur"]
title = "Skull Island Gaur | Speculative Evolution Wiki | Fandom"
description = "The Skull Island Gaur is a subspecies of gaur from the jungles of Skull Island. A most curious member of the Skull Island menagerie, and a regular on the menu for Venatosaurus, is a subspecies of a tall bovine called the gaur. Quite obviously a relatively recent arrival, the Skull Island gaur is almost identical to the mainland Asiatic nominate subspecies, suggesting that its ancestors may have been imported to the island some time in the last thousand years or so by a previous human civilizatio"
