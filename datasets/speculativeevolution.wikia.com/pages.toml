full_description = '''in: Content, Community, Exobiology, and 2 more Extraterrestrial life Tutorial Alternative biochemistry Sign in to edit History Talk (2) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Also see: Exotic life Despite its diversity, all life on Earth displays a remarkable similarity at biochemical level: all the main molecules used in organic processes are built on skeletons of carbon and hydrogen; ions and molecules are dissolved and transported in water-based fluids; most organism breathe oxygen to release energy from food. It's still a matter of debate if organic processes can be supported by different biochemical systems. If they can, though, and therefore much wider conditions are suitable to life, potential life-bearing planets become far more common, and their flora and fauna could be much more alien. Contents 1 Non-carbon basis of biochemistry 1.1 Silicon 1.2 Other elements 2 Non-water solvents 2.1 Polar solvents 2.2 Non-polar solvents 2.3 Properties of solvents 3 Alternatives to other elements 4 Alternatives to oxygen 5 Carbon-using alternatives 6 Other possibilities 6.1 Alternative nucleic acids 6.2 Alternative photosynthetic pigments 6.3 Alternative blood pigments 7 Abundance of elements 8 References 9 Notes Non-carbon basis of biochemistry[] Carbon is perhaps the most important element in our chemical makeup, to the point that organic molecules are defined by the presence of carbon atoms in their structure. It has a unique capacity of bonding with many different kinds of atoms, and forming long, stable polymeric chains. Silicon[] The element most similar to carbon, being right under it in the periodic table, is silicon (Si). It has similar bonding property, but less versatility, and, being heavier, has more difficulty forming double bonds. Silicon's closest analogue to hydrocarbons, silanes (SinH2n+2), are highly reactive in water and don't form long chains. Moreover, most of the complex molecules found in space contain carbon but lack silicon. Also, while ten times less abundant than carbon in the cosmos, it's a thousand times more abundant in Earth's crust, and yet terran life never integrated it in its biochemical processes, likely due to the amount of oxygen in earth's crust, forcing virtually all silicon to become inert silicates. Finally, the product of its oxidation, silicon dioxide (SiO2), is a non-soluble solid until more than 1600°C, whereas carbon dioxide is a gas. However, silicon dioxide would not be produced at all if silicon life breathed in a reducing atmosphere, containing gases such as hydrogen (H2), hydrogen sulphide (H2S), carbon monoxide (CO) or nitrogen: if silicon-based life exists at all, it will be in an atmosphere without oxygen, and probably a reducing one. Silicon's best chance to form complex, stable molecules is to combine with oxygen in alternate chains (...Si-O-Si-O-Si...), creating silicones, stable even in the presence of oxygen and water; just under 300-350°C, silicones can form long polymeric structures where carbon cannot, and some silicon-carbon combination last until 500°C. On the other hand, William Bains argues that silicon could form stable and complex molecules with many other elements (carbon, germanium, nitrogen, oxygen, sulfur, phosphorus, halogens and metals) in very cold, hydrogen-less solvents such as liquid nitrogen. Since silicon rarely forms double bonds, and never forms triple bonds like carbon does, silicon-based biomolecules would have to store energy in a different way, possibly exploiting silicon's properties as a semiconductor. Other elements[] Similar results can be obtained with other carbon-group elements: namely, germanium (Ge), tin (Sn) and lead (Pb). The Xenology chapters linked at the bottom of the page gives some examples of germanium-, tin- and lead-based organic polymers. Boron (B) is another possibility: it's even more versatile than carbon, and while its simplest compunds, boranes (BxHy), are extremely reactive in the presence of oxygen, they'd be more stable in a reducing atmosphere. A combination of alternating boron and nitrogen closely resembles carbon, and can form analogues of hydrocarbons such as ethane (C2H6), methane (CH4) and benzene (C6H6). Less convincing substitutes for carbon can be metal oxides based on magnesium (Mg), aluminium (Al), iron (Fe) or titanium (Ti), which can form stable nanotubes and diamond-like crystals at high temperatures. Both phosphorus (P) and sulfur (S) are able to form long linear chains, but not branched ones, and they need a reducing atmosphere to be stable. Nitrogen (N) can also form long chains in solvents like ammonia (NH3) or hydrogen cyanide (HCN); it always tends to revert to a simple biatomic form, but it can be more stable when combined with carbon, phosphorus, boron or sulfur. Heteropoly Acids are yet more possibilities. They are compounds of both metal and oxygen, and is very thermally stable, even when at temperatures where carbon life is improbable. Non-water solvents[] It's probably a safe bet to say that life will need a liquid to transport ions and molecules around the body. For terran life, this liquid (called a solvent) is always water. Water does have a number of advantages over other possible solvents: Water has a large liquidity range, which means that can be found in a liquid form in many different conditions (but hydrogen fluoride and formic acid have a similar liquidity range, and that of ethanol and sulfuric acid is even wider). Water is extremely common in the universe: in fact, it's the most common chemical compound (but sulfuric acid, methane and nitrogen are already known to exist in large amounts on other worlds). Ice is less dense than liquid water. That allows ice to float and insulate the water below, preventing a whole ocean to freeze[1]. Water is a polar solvent: that allows it to carry dissolved salts. Moreover, it can dissolve proteins, sugars, DNA and oxygen (but the same is true for other solvents, such as ammonia and formamide). Water is transparent to visible light, permitting the development of submarine photosynthetical ecologies. Water has a high specific heat and heat of vaporization, which allows it to absorb large quantities of heat, therefore regulating temperature differences. Water is amphoteric: it can work both as an acid and as a base, and is therefore able to participate in a large array of reactions, as a solvent, a reactant or a product. Besides being abundant, a good solvent should at least have a wide liquidity range and dissolve many different compounds, and preferably it should have a high heat of fusion and vaporization (which would make it more stable when temperature changes), a high dielectric constant (making it a good insulant) and a low viscosity (so that it opposes little resistance to movement). It would likely be a thalassogen, that is, a substance that forms a planet's oceans. Polar solvents[] Polar solvents are composed by molecules that have a slightly different electrical charge on different atoms: for example, the oxygen in a water molecule is slightly more negative than the hydrogen atoms. Such solvents are able to dissolve polar molecules and ionic compounds, but not non-polar molecules such as hydrocarbons. See here, page 72 and following. The most likely alternative to water is ammonia (NH3), especially at low temperatures where water is solid. It's able to dissolve most organic compounds, lightweight metals, iodine, sulfur, selenium and phosphorous. It's not as good an insulant as water and it's easier to boil, but also harder to freeze (therefore, it has a high heat of fusion) and it's much less viscous. Its liquidity range is not as wide at 1 atm pressure (-78°C to -33°C), but at a pressure of 60 atm (life on Venus) it boils at 98°C, making it wider than water's range. Alcohols, sugars, fatty acids and amino acid can all be easily solved into ammonia, especially replacing their -OH groups with -NH2. For example, the analogue of the alcohol ethanol (C2H5OH) would be C2H5NH2. It's also possible to replicate water's acids-and-bases chemistry: NH4+ would replace H3O+ as a (weaker) acid and NH2- would replace OH- as a (stronger) base. In an ammonia-based metabolism, energy would be stored in double bonds C=N. Sulfuric acid (H2SO4) is another likely solvent that could support a variety of chemical reactions. It has a very wide liquidity range (10 to 338°C) and is exists in a large amount in the clouds of Venus. In this case, H2SO4 would work as acid and HSO4- as base; the balance would be strongly tilted in favour of the acid, but, even on Earth, extremophile organisms are known to live in extremely acidic conditions. In this case, the C=C double bond would be the best way to store energy. Other possibilities include: formamide (HCONH2), produced by the reaction of hydrogen cyanide with water, as good a solvent as water is (in particular, it can dissolve aminoacids, proteins and nucleic acids), but not as reactive; hydrogen cyanide (HCN), with a wide liquidity range, low viscosity, high dielectric constant and specific heat, but also a tendency to polymerize that could interfere with biochemical processes; hydrogen fluoride (HF), which has the same liquidity range as water and dissolves polar molecules, just as water does. Paraffin waxes are stable in a HF environment, and the fluorine it contains can be breathed as an oxidant (see "Alternatives to oxygen"). Non-polar solvents[] Non-polar solvents are either composed of molecules where all the atoms have the same charge, such as nitrogen, or where the atoms are arranged in such a way that both the positive and the negative charges are located in the same point, such as methane. These solvents cannot dissolve proteins or other polar molecules as water does, so the biochemistry in a non-polar solvent would be radically different from ours. See here, page 74 and following. Liquid hydrocarbons, such as methane (CH4) and ethane (C2H6), already known to be present on Titan's surface, lack polarity, so they couldn't dissolve proteins; hower, they could carry non-polar polymers, such as polylipids. Being less reactive and having weaker hydrogen bonds, they'd permit hydrocarbon-life to use hydrogen bonds of its own, especially in a low temperature biochemistry. Lifeforms living in hydrocarbon lakes could gain energy making ethylene (C2H4) and acetylene (C2H2) react with hydrogen, reducing them to methane. Cryosolvents are composed by simple non-polar molecules that can exist as a liquid only at extremely low temperatures. Hydrogen (H2) is by far the most common molecule in the Solar System and in the Universe; although its liquidity range at low pressures is only 6 degrees wide, it can be greatly expanded as a supercritical fluid in the atmosphere of gas giants (at 230°C on Jupiter, too high for most organic molecules, but only 30°C on Saturn and -110°C on Uranus and Neptune). Liquid nitrogen (N2) is another cryosolvent that might be the main solvent on Triton. Besides other non-polar compounds, it could dissolve complex silicon molecules such as polysilanes, perhaps allowing for a silicon-based biochemistry. Properties of solvents[] This table recaps the main characteristics of some possible solvents, in order of liquidity range. The values most similar to water are written in bold characters; names in italic denote solvents that are also likely thalassogens; NP marks non-polar solvents. Solvent Fusion and evaporation points (°C) Liquidity range (°C) Heat of fusion (kcal/mole) Heat of vaporization (kcal/mole) Dielectric constant Viscosity (mPa·s) SulfurNP (S2) 113 to 445 332 0.413 23.2 3.48 1 Sulfuric acid (H2SO4) 10 to 338 328 2.56 12.0 100 48.4 Glycerol (C3H8O3) 19 to 290 271 4.42 18.2 42.5 >100 Ethanol (C2H5OH) -114 to 78 193 1.20 10.9 24.3 1.08 Formamide'''
