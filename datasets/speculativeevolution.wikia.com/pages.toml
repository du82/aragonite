description = "Things should be made as simple as possible, but not any simpler. - Albert EinsteinIn our own timeline, there are clear differences between birds and everything else. Birds have feathers, toothless beaks, short tails, and so on… just like mammals have fur and produce milk. In Spec, however, the matter is somewhat more complex. Is a bureaucratbird a bird? Some would say yes, as bureaucrats have wing feathers and use them to fly. But, if the newest genetic data hasn't fooled us, bureaucrat-birds a"
full_description = '''in: Spec Dinosauria, Alternative evolution, Dinosaurs, and 4 more Animals Theropods Maniraptorans Maniraptoriformes Spec Dinosauria: Maniraptora Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Things should be made as simple as possible, but not any simpler. - Albert EinsteinIn our own timeline, there are clear differences between birds and everything else. Birds have feathers, toothless beaks, short tails, and so on… just like mammals have fur and produce milk. In Spec, however, the matter is somewhat more complex. Is a bureaucratbird a bird? Some would say yes, as bureaucrats have wing feathers and use them to fly. But, if the newest genetic data hasn't fooled us, bureaucrat-birds are more closely related to draks than to ducks. So if a bureaucrat-bird is a bird, a hundrak must be a bird as well; either both or neither. If a hundrak can be a gigantic secondarily flightless bird -after all, deinonychosaurs have a distant flying ancestry- then one must remember that it is likely that hogbirds and even arctotitans had flying ancestors, too. If, on the other hand, lumping tiny tangerines with enormous therizinosaurs seems too ridiculous, then perhaps one could suggest that only those dinosaurs with unambiguous wings, means, with reduced 3rd fingers be called birds? But then our definition excludes bunglebirds, which look far more birdlike than draks? The problem refuses to clarify. While our Home Earth has only unambiguous neornithian birds, Spec possesses semi-birds and perhaps-birds with long and short tails, with and without beaks, with and without teeth, with fully free fingers and with fingers that fully integrated in the wing, nd almost all imaginable combinations thereof. Some, like the massive therizinosaurs and vicious deinonychosaurs, arisbviously far from the birds of our backyards. But even among Spec's more familiar-looking birds (those with short tails and beaks and no teeth and no free fingers), few are as familiar as they seem. Contents 1 THERIZINOSAURIA (Yandos, lammoxes, arctotitans, and hornclaws) 2 OVIRAPTOROSAURIA (Vulgures, gollums, hogbirds, nostriches, and seedcrackers) 3 TROODONTIDAE (Nandrakes) 4 DEINONYCHOSAURIA (Mattiraptors, hesperonychids, draks, ninjas, and arbros) 5 RAHONAVIDAE (Bureaucratbirds and stefs) 6 ALVAREZSAURIDAE (Alvies) 7 XENORNITHES (Bunglebirds and carpos) 8 ENANTIORNITHES (Opposite-birds) 8.1 AVISAURIDAE (Avisaurs and scowls) 8.2 ENANTIBAPTIDAE (Ebergs) 8.3 ALLOSPIZIFORMES (Otherworld finches, cityfinches, parrothawks and otherworld parrots) 8.4 TWITIAVIFORMES (Tweety-birds) 8.5 PSEUDORAPTORIDAE (False panha) 8.6 EUORNITHES (Seaguins, ducks, etc.) 8.7 ALLOCOLUMBIFORMES (Otherworld pigeons and sandgrouse) 8.8 HESPERORNITHES (Hespero-cormorants, sea parrots and seaguins) 8.9 ICHTHYORNITHIDAE (Baygulls, toothauks, surfbirds, and harpies) 8.10 NEORNITHES (Ducks, penguins, gobblers, etc.) THERIZINOSAURIA (Yandos, lammoxes, arctotitans, and hornclaws)[] Bipedal, heavily plumaged herbivores OVIRAPTOROSAURIA (Vulgures, gollums, hogbirds, nostriches, and seedcrackers)[] A few relics of a strange clade TROODONTIDAE (Nandrakes)[] The pathetic remnants of a once worldwide group DEINONYCHOSAURIA (Mattiraptors, hesperonychids, draks, ninjas, and arbros)[] Bipedal predators with hyperextendable inner toes RAHONAVIDAE (Bureaucratbirds and stefs)[] Madagascar's not-quite-deinonychosaurs ALVAREZSAURIDAE (Alvies)[] Just as weird now as they were then XENORNITHES (Bunglebirds and carpos)[] Good climbers and strange fliers ENANTIORNITHES (Opposite-birds)[] In our home timeline, of all dinosaurs only a few species of Neornithes (see below) survived the end of the Cretaceous. Those few species all seem to have lived in Antarctica or perhaps its surroundings (South America, Madagascar-India, Australia, and New Zealand). Therefore it is no wonder that Home Earth's birds are all so similar. Our birds are the descendants of a mere handful of species to survive the end-Cretaceous apocalypse. In Spec, where the Earth ticked through the Cretaceous-Paleogene boundary with only the mildest of hiccups, most of the old bird groups still exist. Most notable among these are the Enantiornithes, which have enjoyed a global distribution more or less since the age of their oldest fossil representative, some 135 million years ago. These "opposite-birds", so called for some "upside-down" skeletal features, make up most of Spec's landbird diversity, with a few water-loving forms thrown in. The normal dinosaur condition is to grow slowly if one's adult size is small. A little hona chick will therefore grow much more slowly than the progeny of a massive Arctotitan, so the young of both species will reach adult size at approximately the same time. The birds of our Home Earth are not normal in this respect, as they grow very quickly, but opposite-birds follow the older, dinosaurian pattern. It is not uncommon for opposite birds to reach adulthood only after several years. In addition, almost all enantiornith species are precocial, meaning they can fly and leave the nest just a few days after hatching. At first glance this is a serious drawback against the much faster breeding "true" birds, these traits have allowed opposite-birds to evolve some features that more familiar avians could never afford. Most conspicuous among those is the poison of the tweety-birds and the false panha. Less spectacularly, larger opposite birds go through several different ecological niches through their life cycle, which allows population densities which higher than any in our world, but comes at the price of considerably lower species diversity. AVISAURIDAE (Avisaurs and scowls)[] Toothed birds of prey ENANTIBAPTIDAE (Ebergs)[] Diving freshwater birds ALLOSPIZIFORMES (Otherworld finches, cityfinches, parrothawks and otherworld parrots)[] Small seed-eaters, for the most part TWITIAVIFORMES (Tweety-birds)[] Spec's poisonous answer to songbirds PSEUDORAPTORIDAE (False panha)[] A strange and poisonous creature EUORNITHES (Seaguins, ducks, etc.)[] The "True" birds. Unlike Enantiornithes, Euornithes has been very successful in producing a diversity of waterfowl. However, numerous landbirds are "true", too. ALLOCOLUMBIFORMES (Otherworld pigeons and sandgrouse)[] Fast-flying fruit- and seed-eaters HESPERORNITHES (Hespero-cormorants, sea parrots and seaguins)[] Toothed, mostly flightless seabirds ICHTHYORNITHIDAE (Baygulls, toothauks, surfbirds, and harpies)[] Toothed birds of air and sea NEORNITHES (Ducks, penguins, gobblers, etc.)[] Mostly familiar birds - Daniel Bensen and David Marjanovic ,=Oviraptorosauria ,=| | `=Therizinosauria | |=Troodontidae | |=Alvarezsauridae =Maniraptora=??| | | ,=Deinonychosauria | ,=??| | | | ,=â€ Archaeopteryx | | `=??| | | `=Rahonavidae | | `=Eumaniraptora=| ,=â€ Confuciusornis ,=Avisauridae | ,=| ,=| | | `=Xenornithes ,=| `=â€ Enantiornis walkeri | | | | | | ,=??| `=â€ Sinornis santensis `=Pygostylia=| | | | ,=Enantiornithes=| `=Enantibaptidae | | | | | | ,=Allospiziformes | | `=| `=Ornithothoraces=| | ,=Twitiaviformes | `=??| | `=Pseudoraptoridae | | ,=Allocolumbiformes `=Euornithes=| | ,=Hesperornithes `=| | ,=Ichthyornithidae `=| `=Neornithes Categories Categories: Spec Dinosauria Alternative evolution Dinosaurs Animals Theropods Maniraptorans Maniraptoriformes Community content is available under CC-BY-SA unless otherwise noted.'''
