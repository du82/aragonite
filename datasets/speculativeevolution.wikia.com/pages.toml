full_description = '''in: The Future Is Wild species, Future is Wild 5 MYF, Mammals, and 7 more Pigs Animals Artiodactyls The Future is Wild Europe Future animals Omnivores Scrofa Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The scrofa is a species of small, delicate-looking suine suid, descended from the wild boar(Sus scrofa) that lives on the rocky karst of the Mediterranean Basin of 5 million AD in the documentary The Future is Wild. It is one of the animals that has appropriately adapted to live in this new landscape. In the shelter of the grykes, mother cryptiles hide their eggs. They will be safer here than on the open salt plains, but there are dangers nonetheless. Snuggling about in the broad passageways of the grykes is the scrofa, a descendant of the wild boars that once ranged across much of Eurasia, North Africa and the Greater Sunda Islands in the Quaternary. Wild boars were hardy creatures, adaptable to changing conditions and generalized in their feeding habits. They fed largely on grain and roots, but occasionally would kill and eat smaller animals. In 5 million AD, scrofas are similar in many ways to their ancestors, although they are more slender and only about half as tall. They are about 14.75 inches (37.5 centimeters) high at the shoulder and weigh 8.25 pounds (3.75 kilograms). Delicate hooves and agile limbs allow them to prance along the wide slabs of limestone pavement, known as clints, leaping over the grykes as they go. Walking over rugged limestone is very different from roaming through a forest. Scrofa legs have become thinner, and the bones elongated. They walk on the tips of their toes, giving them a strange, stiff-legged gait. This is an efficient way of moving over surfaces like the karst. This adaptation is similar to the klipspringer of previous times. The generalized, omnivorous diet has not changed much either. Scrofas will eat almost anything. Plant material forms a large part of their diet, but they will also prey on slow-moving smaller animals and carrion. Their cylindrical noses, used for searching out food from the bottom of grykes, are longer than those of their wild boar ancestors, and are now short, flexible "trunks", similar to those of the elephant shrews or sengis of the Human era. The long nose of a snuffling, foraging scrofa can find newly-laid reptile eggs (including that of cryptiles) in the shallow soil. Its tusks can loosen the eggs from their hiding place and its long lips can snap them up, then it moves on. Scrofa herds spread out across the karst. There are two dominant females (the joint leaders of a herd). A scrofa herd is essentially a family group, consisting of the leaders and their offspring. The only males in the group are juveniles. Once the males reach sexual maturity, they leave their herds to begin hunting and foraging on their own, mating with the dominant sows of other herds and fighting with other lone males for mating privileges. In the late spring, scroflets are born in litters of between three and six. This is the beast time of year for raising young, as there is more food available in the bleak environment. Wherever scrofas go foraging, there are always two or three herd members on the lookout for danger. Birds of prey circle in the skies above the karst, but other dangers lurk in the grykes themselves. Down by the edge of the salt flats, herds of scrofas are relatively safe - but there is little food to be found there. On slightly higher ground, soil particles blown into the grykes from the continental interior allow vegetation to grow. Patches of wispy grass sprout up from the flat surfaces of the clints. Hazel trees grow in bunches along the grykes, stunted and gnarled, their roots reaching down hundreds of feet to whatever water table exists here. This is the best feeding ground for scrofa herds at this time of year (spring), since vegetation is relatively abundant. Unfortunately, it is also the domain of the scrofas' greatest enemy: the gryken. A female scrofa rescues her baby from a gryken. Although grykens will not attack adult scrofas, they will hunt down any youngsters (scroflets) that wander away from their family herds. On very rare occasions, a scroflet will probably become lost after either wandering away from the herd out of curiosity or from running from a predator attack. These lost scroflets will, on these very rare instances, wander out onto the salt flats and eventually die from hunger, thirst, and the heat. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Mammals Pigs Animals Artiodactyls The Future is Wild Europe Future animals Omnivores Community content is available under CC-BY-SA unless otherwise noted.'''
