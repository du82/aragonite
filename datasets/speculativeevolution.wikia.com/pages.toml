Code(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Moonspider, Galeodes luna, is a dark-colored, vicious, nocturnal galeodid sun spider from the lowlands of Skull Island. It measures 6-8 inches long. Night on the ground on Skull Island is a dangerous time and place to be if you are small. Among the invertebrate predators, few have mouthparts that can compete with those of the moonspider. A variety of sun spider, not a true spider, the ten-legged moonspider sports huge crushing scissor chelicerae and paralytic venom to make short work of its prey. Rodents (namely Skull Island Rats), lizards, small ground birds, and even non-avian dinosaur chicks are potential victims. A bite from the sizable arachnid can cause significant discomfort to even an adult non-avian dinosaur. Moonspiders hunt at night to avoid becoming prey to diurnal birds and other large hunters. Dirty Tricks[] A particularly nasty tactic developed by moonspiders is to wait near dinosaur nests just as young are hatching. Tuned to pick up the faint scent of egg matter on a night breeze that might indicate the early stages of a hatching, moonspiders are drawn to nests where young are still struggling to free themselves from their shells. In this vulnerable state they are easy prey for the invertebrate. Categories Categories: Animals Skull island Skull Island animals Invertebrates Arthropods Arachnids Carnivores Chelicerates Community content is available under CC-BY-SA unless otherwise noted.'''
