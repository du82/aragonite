title = "Spec Dinosauria: Alvarezsauridae | Speculative Evolution Wiki | Fandom"
description = '''With 34 species, Australia possesses over half of the world's remaining alvarezsaurs (popularly called "Alvies"). This bizarre group of theropods reached its evolutionary zenith during the early Cenozoic, but subsequently vanished from many parts of the world, perhaps through competition with ground-running true birds. Most extant species are small, cryptic forest and woodland animals. Larger forms can only be found in Australia and New Guinea. The neoalvarezsaurids actually labor under a mislea'''
full_description = '''in: Spec Dinosauria, Dinosaurs, Animals, and 9 more Alternative evolution Australia New Zealand Theropods New Guinea Madagascar Carnivores Birds Maniraptorans Spec Dinosauria: Alvarezsauridae Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> With 34 species, Australia possesses over half of the world's remaining alvarezsaurs (popularly called "Alvies"). This bizarre group of theropods reached its evolutionary zenith during the early Cenozoic, but subsequently vanished from many parts of the world, perhaps through competition with ground-running true birds. Most extant species are small, cryptic forest and woodland animals. Larger forms can only be found in Australia and New Guinea. Contents 1 NEOALVAREZSAURIDAE 1.1 Great Crested Alvie (Tiamatia ornatissima) 1.2 Fan Tailed Alvie (Alvarezsauroides gracilis ) 1.3 Papuan Muppet (Marionia stulta) 2 GALLIONICHIDAE (Foresters and Alvies) 2.1 Blood-Tailed Alvie (Gallionyx erythrocaudis) 3 UNDESCRIBED SPECIES NEOALVAREZSAURIDAE[] Great Crested Alvie (Tiamatia ornatissima)[] The neoalvarezsaurids actually labor under a misleading name, as they are, anatomically, the more conservative of the two alvarezsaur sub-clades. These creatures are long-legged, long-necked creatures superficially similar to the ratites of Home-Earth and the ornithomimosaurs of the past. An extremely robust and bad-tempered alvaresaur species of lowland rainforests of Australia. Single animals aggressively defend a large territory through which it wanders in search of fallen fruit, insects and small vertebrates on the forest floor. Fan Tailed Alvie (Alvarezsauroides gracilis )[] The largest living alvarezsaur is an inhabitant of the open and semiarid bushland throughout inland Australia. A nomadic species, it feeds on a wide range of grasses, leaves, seeds and insects. Able to sprint at over 90 km/h, it is one of the fastest-running of all land animals. The large rectrices (possessed by both sexes) can be spread out into a large, spectacular fan during mating-dances. Papuan Muppet (Marionia stulta)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/f/fd/Drh-alvie.jpg/revision/latest?cb=20130915181343" class="image"><img alt="Drh-alvie" src="https://static.wikia.nocookie.net/speculativeevolution/images/f/fd/Drh-alvie.jpg/revision/latest/scale-to-width-down/150?cb=20130915181343" decoding="async" loading="lazy" width="150" height="254" class="thumbimage" data-image-name="Drh-alvie.jpg" data-image-key="Drh-alvie.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/f/fd/Drh-alvie.jpg/revision/latest/scale-to-width-down/150?cb=20130915181343" /></a> (fig. 4) Papuan muppet, Marionia stulta (Papua) The largest New Guinea alvarezsaur, the Papuan muppet (Marionia stulta) is a broadly crepuscular montane omnivore. It lives in small family groups ( 'hensons' ) high in the mountains of the island, dwelling at the edges of the forests and venturing out onto the small patches of grassland at dawn and dusk. In this way, the muppet avoids its chief predator, the Papuan eagle, which is most active in full daylight after the fog lifts. Muppets breed in fallen trees and in thick undergrowth. Clutches usually consist of two eggs, and the young mature quickly, fed by their parents and older siblings. M. stulta exists in many different colourforms - the wattles under the jaw and the feathers along the sides and back of the head can be quite strikingly pigmented - but genetic evidence suggests they are all still closely related, despite the geographical difficulty presented in traveling from valley to valley. GALLIONICHIDAE (Foresters and Alvies)[] Comprising 80 percent of alvarezsaur species, Gallionichidae is easily the more successful of the two alvarezsaur sub-clades. Rarely more than a meter long (although one species, the giant blood-tail of New Zealand, may grow to a length of two meters) these little animals hunt for invertebrates and small mammals and reptiles along the ground. Some species show herbivorous tendencies. Blood-Tailed Alvie (Gallionyx erythrocaudis)[] The most specious genus of alvarezsaurs are the diminutive "Rat-tailed Alvies", so named because of their featherless, scaly tails (a trait shared in the closely related genus, Sylva). The Blood-tailed Alvie is to be found in moist forests and woodlands throughout southern mainland-Australia. A secretive, solitary animal, it feeds during the day, using it's bill to probe in soil and leaf litter for small animals. UNDESCRIBED SPECIES[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/9/92/Chizelnose.jpg/revision/latest?cb=20161216183403" class="image"><img alt="Chizelnose" src="https://static.wikia.nocookie.net/speculativeevolution/images/9/92/Chizelnose.jpg/revision/latest/scale-to-width-down/512?cb=20161216183403" decoding="async" loading="lazy" width="512" height="249" class="thumbimage" data-image-name="Chizelnose.jpg" data-image-key="Chizelnose.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/9/92/Chizelnose.jpg/revision/latest/scale-to-width-down/512?cb=20161216183403" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/8/8e/Echinalvie.jpg/revision/latest?cb=20161216183403" class="image"><img alt="Echinalvie" src="https://static.wikia.nocookie.net/speculativeevolution/images/8/8e/Echinalvie.jpg/revision/latest?cb=20161216183403" decoding="async" loading="lazy" width="555" height="360" class="thumbimage" data-image-name="Echinalvie.jpg" data-image-key="Echinalvie.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/8/8e/Echinalvie.jpg/revision/latest?cb=20161216183403" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/a/ae/Great_anteater-alvie.jpg/revision/latest?cb=20161216183429" class="image"><img alt="Great anteater-alvie" src="https://static.wikia.nocookie.net/speculativeevolution/images/a/ae/Great_anteater-alvie.jpg/revision/latest/scale-to-width-down/601?cb=20161216183429" decoding="async" loading="lazy" width="601" height="305" class="thumbimage" data-image-name="Great anteater-alvie.jpg" data-image-key="Great_anteater-alvie.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/a/ae/Great_anteater-alvie.jpg/revision/latest/scale-to-width-down/601?cb=20161216183429" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/e/e1/Kickdigga.jpg/revision/latest?cb=20161216183429" class="image"><img alt="Kickdigga" src="https://static.wikia.nocookie.net/speculativeevolution/images/e/e1/Kickdigga.jpg/revision/latest/scale-to-width-down/621?cb=20161216183429" decoding="async" loading="lazy" width="621" height="411" class="thumbimage" data-image-name="Kickdigga.jpg" data-image-key="Kickdigga.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/e/e1/Kickdigga.jpg/revision/latest/scale-to-width-down/621?cb=20161216183429" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/9/94/Kiwalvie.jpg/revision/latest?cb=20161216183429" class="image"><img alt="Kiwalvie" src="https://static.wikia.nocookie.net/speculativeevolution/images/9/94/Kiwalvie.jpg/revision/latest?cb=20161216183429" decoding="async" loading="lazy" width="677" height="311" class="thumbimage" data-image-name="Kiwalvie.jpg" data-image-key="Kiwalvie.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/9/94/Kiwalvie.jpg/revision/latest?cb=20161216183429" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/2/29/Normalvie.jpg/revision/latest?cb=20161216183509" class="image"><img alt="Normalvie" src="https://static.wikia.nocookie.net/speculativeevolution/images/2/29/Normalvie.jpg/revision/latest/scale-to-width-down/528?cb=20161216183509" decoding="async" loading="lazy" width="528" height="299" class="thumbimage" data-image-name="Normalvie.jpg" data-image-key="Normalvie.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/2/29/Normalvie.jpg/revision/latest/scale-to-width-down/528?cb=20161216183509" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/4/4b/Patagonian_lodger.jpg/revision/latest?cb=20161216183545" class="image"><img alt="Patagonian lodger" src="https://static.wikia.nocookie.net/speculativeevolution/images/4/4b/Patagonian_lodger.jpg/revision/latest/scale-to-width-down/569?cb=20161216183545" decoding="async" loading="lazy" width="569" height="276" class="thumbimage" data-image-name="Patagonian lodger.jpg" data-image-key="Patagonian_lodger.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/4/4b/Patagonian_lodger.jpg/revision/latest/scale-to-width-down/569?cb=20161216183545" /></a> <a href="https://static.wikia.nocookie.net/speculativeevolution/images/1/12/Semaphowl.jpg/revision/latest?cb=20161216183509" class="image"><img alt="Semaphowl" src="https://static.wikia.nocookie.net/speculativeevolution/images/1/12/Semaphowl.jpg/revision/latest/scale-to-width-down/582?cb=20161216183509" decoding="async" loading="lazy" width="582" height="300" class="thumbimage" data-image-name="Semaphowl.jpg" data-image-key="Semaphowl.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/1/12/Semaphowl.jpg/revision/latest/scale-to-width-down/582?cb=20161216183509" /></a> ,=Tiamatia ornatissima (Great crested alvie) ,=| | `=Marionia stulta (Papuan muppet) ,=Neoalverezsauridae=| | `=Alvarezsauroides gracilis (Fan-tailed alvie) =Alvarezsauridae=| | | ,=G. personatis (Helmeted alvie) | ,=| | | | ,=G. erythrocaudis (Blood-tailed alvie) | | `=| | | `=G.stygius (Darker alvie) | ,=Gallionyx=| | | | ,=G. hematis (Bleeding-heart alvie) | | `=| | | `=G. minimus (Gold alvie) `=Gallionichidae=| | | ,=S. chooi (Choo's forester) `=Sylva=| | ,=S. striata (Striped forester) `=| `=S.rubifacies (Red-faced forester) Categories Categories: Spec Dinosauria Dinosaurs Animals Alternative evolution Australia New Zealand Theropods New Guinea Madagascar Carnivores Birds Maniraptorans Community content is available under CC-BY-SA unless otherwise noted.'''
