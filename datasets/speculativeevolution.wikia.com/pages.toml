 the continent. The logical assumption would be that this same civilization built the great wall and the many ruins scattered through the forest of Skull Island. The gaurs survive surprisingly well on the island long after their human handlers were lost to history and in spite of local predation. Their long curving horns and mass make them worthy adversaries for predatory species like Venatosaurus, and their dark brown coloring helps them blend in with their jungle surroundings. Categories Categories: Skull island Animals Mammals Placentals Exafroplacentalia Boreoeutheres Laurasiatheres Artiodactyls Bovids Bovines Ferungulates Skull Island animals Herbivores Community content is available under CC-BY-SA unless otherwise noted.'''
