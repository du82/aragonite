full_description = '''in: The Future Is Wild species, Future is Wild 5 MYF, Bats, and 8 more Mammals Animals Flying Creatures Placentals The Future is Wild Future animals North America Carnivores Deathgleaner Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Deathgleaner is a huge, black, diurnal, highly predatory vesper bat, with a wingspan of 4¼ feet (1.3 meters) and a mass of about 1½ pounds (681 grams), that lives in The North American Desert in The Future is Wild. Its mouth alone is 1½ inches (38.2 millimeters) long, and its teeth are ⅛ inch (3.2 millimeters) long. It will hunt for live prey and even scavenge carcasses if it can. High above the shifting sands of the North American Desert, deathgleaners can be seen hanging in the air, resting on updrafts of windblown off the sandy ridges below. They circle like vultures, seeking an easy meal on the ground. Now and again, one wheels and banks, signaling to the others that it has found something. Soon, a large group will gather and prepare to feast. In some instances, it is not food they will spot, but something on the ground that suggests food may not be far away. A deathgleaner's penetrating eye can note a desert rattleback digging in the sand, looking for nourishment of its own. On occasion, deathgleaners will take a young rattleback, but this is not common, as the rodent's armor is tough and unpalatable (they also will not risk tearing their fragile wings on an adult's sharp scales). Instead, the bats will observe the movements of a desert rattleback in the hope that it provides them with an easier and more abundant source of food. When a rattleback is among the thick, succulent fronds of some desert turnips and is digging down to the tubers, soaring deathgleaners circle in, waiting. While searching for desert tubers, a rattleback might unwittingly dig up spinks, and this is what the deathgleaners want. Once the spinks are on the desert surface, blinded by the light of the sun, down soar the deathgleaners, shadow after shadow swooping in. Strong jaws and enormous teeth crush a smaller vertebrate's backbone, delivering death swiftly. A shattered spink colony will provide plenty of food. On the ground, the deathgleaner supports its body by resting on its elbows. The helpless spinks will be easy pickings for this predator. A deathgleaner's wing is typical of the wing of any bat. It consists of a membrane of skin stretched out between the elongated fingers of the hand. This is not the ideal arraignment for a cold-climate animal, since a great deal of body heat is lost through the skin. Birds do not have this problem because their wings are covered in insulating feathers. Deathgleaners avoid excessive heat loss by cooling the blood before it is pumped through the veins of the wing membrane. The heat taken from the blood going into the wings is used to warm the cooled blood coming back from them, by the same principle as industrial heat exchangers. Deathgleaners live in communal roosts, in the caves and ravines of the distant Rocky Mountains. They sleep during the freezing desert night, huddling together to keep warm, and preserving enough energy to travel long distances in search of odd. Unlike most bats, deathgleaners are only active in the daytime. They must wait until the sun has warmed the ground sufficiently to make use of warm air currents, or thermals, and soar over great distances. When night comes, temperatures drop to freezing, so deathgleaners cannot fly on such cold conditions, so hunting groups from miles around travel to their communal roosts for the night. Deathgleaners leave their roosts in the daytime, when they can soar over great distances on warm air currents rising up from the desert. When food is particularly scarce, deathgleaners go into a state of torpor, saving energy by slowing down their metabolism. This strategy for conserving energy ensured their survival when so many other mammals and birds faced extinction. As the cold deserts spread over North America, the bats were able to fill the scavenging niche that had been mostly vacated by hawks and vultures. Once an attack is over and the deathgleaners have eaten their fill, the leftovers are gathered up and carried off. The meat will be taken back to the roost where it will be shared with related members of the colony. This is not a new phenomenon. Vampire bats also shared food, filling special reserves with the blood of prey, which could then be passed on to other individuals of the same kin that had not eaten. By sharing food this way, the deathgleaners aid the survival not only of individuals but of the entire species. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 5 MYF Bats Mammals Animals Flying Creatures Placentals The Future is Wild Future animals North America Carnivores Community content is available under CC-BY-SA unless otherwise noted.'''
