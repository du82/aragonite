{ return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Living hadrosaurs can be divided into two broad groupings. The neohadrosaurs are, despite their name (which refers to their diversity in the New World), the older and more conservative of the two and are found throughout the Americas and the eastern half of Eurasia (The other great hadrosaur group, the ungulapedes, will be dealt with later). They first appear at the start of the Eocene in North America and are probable descendants of flat-headed Maastrichtian giant saurolophinaes such as the well-studied and famous hadrosaur, Edmontosaurus annectens. In a very short space of time, the clade had spread into Eurasia and South America. Contents 1 HISTORY 2 MEGAHADRIDAE (Hmungos, galumphs, hipposaurs, and torgs) 2.1 MEGAHADRINAE (Hmungos, galumphs, shamblas and bakus) 2.1.1 Eastern Galumph (Galumphia hebes) 2.1.2 Zebra Galumph (Galumphia bicolor) 2.1.3 Greater Hmungo (Megahadrus titanus) 2.1.4 Sludger (Megahadrus mississippiensis) 2.1.5 Least Hmungo (Megahadrus minimus) 2.1.6 Shambla (Beluasaurus benseni) 2.1.7 MICROHADRINI 2.1.7.1 Baku (Microhadrus reclusiva) 2.2 HIPPOSAURINAE (Rawheads, torgs, and snufflelumps) 2.2.1 Rawhead (Hycephale longicaudas) 2.2.2 Greater Torg (Epippiosaurus sinkkoneni) 2.2.3 Darwin's Torg (Epippiosaurus darwini) 2.2.4 Pampasaur (Pampasaurus gigas) 2.2.5 Snufflelump (Longicephaloides inexpectatus) 3 STELLOSAURIDAE (Grasbucks and Singers) 3.1 GRAMESAURINAE (Grasbucks) 3.1.1 American Grasbuck (Gramesaurus americanus) 3.1.2 Cerrado Grasbuck (Gramesaurus braziliensis) 3.1.3 Hall Grasbuck (Gramesaurus hmungasectus) 3.1.4 Texas Grasbuck (Gramesaurus mexicanus) 3.2 STELLOSAURINAE (Singers) 3.2.1 Tule Singer (Nothusafilius impirium) 3.2.2 Valley Singer (Stellosaurus valensis) 3.2.3 Starry Singer (Stellasaurus communicatorius) 3.2.4 Painted Singer (Neostellasaurus pictus) 3.2.4.1 Red-Crested Singer (Neostellasaurus pictus sanguineocristatus) 3.2.4.2 Nomadic Singer (Neostellasaurus pictus pallidus) 3.2.5 Pale Singer (Neostellasaurus pallidus) 3.2.6 In Closing: In Regards to the Existence of Central and Southern American Stellosaurs HISTORY[] Their first wave of expansion in the Eocene was to be a false start. The climatic turmoil at the end of this epoch ended their brief foray into Gondwana while their diversity in Eurasia mysteriously waned as the Oligocene progressed. In North America, evolution continued unabated and they branched into a host of spectacular lineages from giant swamp-dwellers like the big-headed paramegahadrids to speedy two-legged runners such as the flamboyant crested megacaudids. Then disaster struck (literally) at the end of the Oligocene in the form of the Haughton Impact and they entered the Neogene with just two out of six families. The North American duckbills quickly made up for their losses in the Miocene, once again speciating into giants and midgets (although the small bipeds did not reappear). Their formidable chewing abilities made them particularly well suited to life in the spreading grasslands and, as sea-levels fell in the Pliocene, they launched fresh invasions into Eurasia and South America. However, dinosaurs marched both ways across the land bridges and new competitors and (perhaps) diseases led to a decline in the smaller neohadrosaur lineages. The Ice Ages of the Quaternary led to further extinctions as suitable habitats expanded and contracted with the glaciers. During the Eocene and Oligocene, North America experienced a hadrosaur boom, with a number of new clades evolving the take the place of the extinct North American ceratopsians, more particullary the members of the Ceratopsidae. As with their distant ungulapede cousins, the neohadrosaurs are united by peculiarities of the manus. With the loss of digit 5, the hand possesses only three fingers, each terminating in a large, hoof-like ungual that is comparatively larger than those of earlier hadrosaurs. In their Cretaceous ancestors, the weight-bearing digits were enclosed within a fleshy pad, but in the neohadrosaurs, the three manual hooves protrude from the flesh and play a greater role in supporting the animal and protecting the forefoot. This may be a relict of the neohadrosaurs' brief foray into bipedalism during the late Paleogene when the fingers were partially freed for defensive and manipulative purposes. MEGAHADRIDAE (Hmungos, galumphs, hipposaurs, and torgs)[] A good chunk of America's hadrosaurs belong to the recently erected Megahadridae. At a glance, these dinosaurs appear quite conservative when compared with their Mesozoic forebears, and for a long time were classified as living representatives of the Cretaceous-Eocene family Hadrosauridae. More detailed studies have revealed that these animals are far more removed from their Cretaceous ancestors than a cursory examination might suggest. Rather than representing a steady progression of the large Cretaceous-type saurolophinae, it is now known that the earliest megahadrids in the Oligocene were medium-sized bipeds, similar to (but not immediately related to) the crested megacaudids. When the big paramegahadrids died out at the end of the Oligocene, the early Megahadridae quickly moved to seal the ecological gap, evolving into the large four-footed forms of today. With the exception of the primitive galumphs, which can rear up on their hindlimbs, the megahadrids all obligate quadrupeds. The limbs, particularly the forelegs, have become thickened and pillar-like to better support the animals' weight. These graviportal adaptations give them a plodding, elephant-like gate unlike the more dainty motions made by stellasaurs and ungulapedes. All megahadrids tend to be rather slow moving and none can sprint. Thus they tend to rely more on size, a tightly knit herd structure, or aggression for protection (An adult bull hmungo is a far stronger and more solidly built animal than the largest theropod and can do some real damage to a careless tyrannosaur). The vertebrae have been strengthened although the ossified rods found in other duckbills have been reduced. Another unique feature (amongst ornithopods) is the possession of a large and muscular tongue that can quickly and efficiently transfer food from the beak to the cheek batteries. Present-day megahadrids can be divided into at least 2 subfamilies, the megahadrines and hipposaurs. MEGAHADRINAE (Hmungos, galumphs, shamblas and bakus)[] Megahadrines are large (none weigh under 1000kg), but not particularly diverse, with at least several species distributed throughout North and Central America, eastern Eurasia and the northern half of South America. Most likely, these creatures evolved as riverside and swamp herbivores, where they evolved their distinctive short necks and long snouts. This cranial anatomy soon proved to be a useful adaptation not only for dredging up aquatic plants,but for grazing. Megahadrines also possess large and complex nasal chambers giving them a sharp sense of smell and a loudspeaker (and boy do we mean loud!) to keep in touch with other members of the herd or to intimidate enemies. The two North American galumph species (genus Galumphia) live in the forests of southeastern North America, and look rather like the Mesozoic Edmontosaurus (though they are only distantly related). Despite their name, galumphs are actually quite agile, and can move with surprising speed when threatened, their latterally compressed bodies easily slipping between the trees. These forest browsers feed upon forest undergrowth, shrubs, and saplings, its batteries of diamond-shaped teeth mashing even the ubiquitous Deinorubus brambles into a digestible paste.A galumph's physiology is very similar to that of its Mesozoic ancestors, with relatively weak hind legs, and a center of balance close to the hips. Galumphs never developed the enlarged neural arches over the shoulders (a common feature of many modern quadripedal herbivores) and will often rear onto teier hind legs to reach succulent branches. Eastern Galumph (Galumphia hebes)[] Eastern galumph, Galumphia hebes (Eastern North America) With a mass of 5000 kilograms, the eastern galumph is small for a megahadrine, but it is the largest animal in the deciduous forests of eastern North America that are the creatures' home. Zebra Galumph (Galumphia bicolor)[] Zebra galumph, Galumphia bicolor (Central America and Northern to Central South America---Cloud forest and Amazon) Three megahadrine species are to be found in South America. Two of these are southern inhabits of primarily North American forms - a "dwarf" (7 meters long) morph of the greater hmungo and scattered populations of the eastern galumph - both of which are restricted to the north of the continent. The 5 metre-long zebra galumph is, however, an endemic species. These 5-meter pygmies live in the cloud forests of central South America, however, it was recently discovered their range extends to the Amazon and Central America. Greater Hmungo (Megahadrus titanus)[] The other group of megahadrines, the hmungos (sometimes allied with the shambala of northeast Eurasia) are larger than their forest cousins, dwelling as grazers on the great interior plains of North America. These elephantine herbivores are highly migratory, and, during the summer, hmungo herds habitually pass only just south of the Arctic Circle. The upper and lower bills of a hmungo's mouth function as the cutting blades of this living lawnmower. The grass is clipped off near the roots by the beak, and then slid back into the cheeks by means of an extremely long and muscular tongue. Batteries of diamond-shaped grinding teeth (a gift from the hmungos' hadrosaur ancestors) reduce the high-silica vegetable matter to a digestible paste, which is then passed into the crop for further digestion before finally entering the stomach. This peculiarly dinosaurian digestive process is far more efficient than any mammalian system (although Home-Earth's ruminants, with their multiple stomachs, come close) and so hmungos can grow much larger on a diet of grass than can any furry creature. <a href="https://static.wikia.nocookie.net/speculativeevolution/images/b/bf/Hmungos.jpg.jpg/revision/latest?cb=20170127142947" class="image"><img alt="Hmungos" src="https://static.wikia.nocookie.net/speculativeevolution/images/b/bf/Hmungos.jpg.jpg/revision/latest?cb=20170127142947" decoding="async" loading="lazy" width="825" height="562" class="thumbimage" data-image-name="Hmungos.jpg.jpg" data-image-key="Hmungos.jpg.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/b/bf/Hmungos.jpg.jpg/revision/latest?cb=20170127142947" /></a> A herd of greater hmungos and palid singers and menaced by a threesome of pecos draks, Megahadrus titanus, Neostellasaurus pallidus, Paraboreonychus horridus and an unidentified species of viriosaur (central North America---Great Plains) Greater hmungos (Megaharus titanus) are elephantine grazers, the culmination of the megahadrid radiation of giant grazers. Dwarfing the other herbivores of the plains, greater hmungos most closely resemble the African grassbags in their habits; they are biological vacuum cleaners. The greater hmungo may be found across the plains of central North America as well as the forests of the west, the small, closely-knit herds migrating past the 60th parallel during the summer and the 30th in the winter. A non-migratory, dwarf subspecies of greater hmungo can even be found in northern South America, as mentioned earlier. Hmungos mate for life, a'''
