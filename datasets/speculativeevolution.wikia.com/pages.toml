 countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Malamagnus, Malamagnus vadum, is a large, brown, semiaquatic, hippo-like dinocephalian from the swampy wetlands of Skull Island. It measures 15-20 feet long. Large herd-dwelling Malamagnus feed on reeds, water lilies, and shrubs in the shallows in and around the waterways. Vulnerable to predators such as V. rexes, they tend to browse and graze along the riverbanks or in the shallows to afford carnivores less cover for ambushes and allow for a quick retreat to deep water. In the river, their size keeps them safe from all but the largest of the aquatic predators, like Piranhadon. Smaller terrestrial threats are seen off through intimidation - all adult members of the herd take part in guarding their territory aggressively from rivals or unwelcome encroachers. In the breeding season, Malamagnus become especially aggressive and intolerant, staking out and jealously guarding territories. Large, rubbery eggs are laid in small clutches amid vegetation near the river’s edge. The young hatch well developed and are quick to join the herd, growing substantially in their first year. Massive Jaws[] Malamagnus have enormous jaws for non-mammalian synapsids of their size. While herbivorous, their impressive tusk-like teeth are employed in contests of dominance. Rivals lock jaws like battling stags and try to force one another aside. Powerful neck muscles are the key in the contest, and young males will hone their strength in mock battles. Relationship with Dirt Turtles[] Malamagnus feces are often scavenged upon by dirt turtles. Categories Categories: Animals Synapsids Therapsids Dinocephalians Skull island Skull Island animals Herbivores Aquatic Creatures Amniotes Craniates Community content is available under CC-BY-SA unless otherwise noted.'''
