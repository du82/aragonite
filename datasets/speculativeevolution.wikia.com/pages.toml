full_description = '''in: The Future Is Wild species, Invertebrates, Future is Wild 200 MYF, and 5 more Gastropods Molluscs Animals The Future is Wild Herbivores Desert hopper Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The desert hopper can eat the toughest plants of the Rainshadow Desert, finding nutrition in the most unpalatable-looking growths. The Desert hopper is a large, nocturnal, hopping, monopedal caenogastropodan snail from the Rainshadow Desert of Novopangea, 200 million AD, in the documentary The Future is Wild. When darkness falls, groups of desert hoppers eat as many nutritious plants as they can throughout the night. When morning returns, they all retreat to the shade before they are all caught out in the heat. As the coexisting bumblebeetle shows, an essential condition for life in the Rainshadow Desert is the ability to range over large areas looking for food. This requirement has been solved in different ways by different animals, but perhaps the most surprising, when we consider its ancestry, is the desert hopper. During sunset, there will be movement in the sand and thick desert soil. Desert hoppers will be pushing their way to the surface. First to emerge is the large snail's shell. Then the rest of the creature appears, slowly pushing itself from the sand and soil with its muscular foot. Finally, it raises itself, balancing on the tip of the foot, its body forming an elegant, vertical J-shape. The tip of the foot has three toe-like projections, which spread its owner's weight across the sand. Instead of being mounted on stalks, this gastropod's eyes are in circular turrets, like those of a chameleon. When completely emerging from the ground, it lifts its shell clear off the ground and sways for a moment. Then the snail jumps away. Throughout their evolutionary history, land snails have been slow-moving, rather passive animals. They have always preferred moist places where the plants upon which they feed are abundant. Crawling slowly on a strong, muscular, fleshy foot lubricated by a trail of slime, the previous land snails rasped food from plants using their radulae. In the choked and unyielding habitat of the Rainshadow Desert, the desert hopper has evolved to become a successful herbivore among the region's sparse, tough plants. The desert hopper is 11¾ inches (30 centimeters) tall. When withdrawn into its spiky shell, it has few enemies. It does not secrete a trail of slime, otherwise it would waste water in its desert habitat. The soft skin of its ancestor has evolved into horny, interlocking scales, forming a tough, lizard-like skin that locks in essential moisture. Most remarkable of all is the desert hopper's muscular foot. The foot is a jumping organ. It carries the snail across the desert at about 2 miles (3.2 kilometers) per hour. A species of marine cone snail could use its muscular foot to hop away from predators. In 200 million AD, this has developed into a method of moving swiftly on land. The jumping action also works a bellows mechanism within the shell of the desert hopper, allowing air to be pumped in and out of the lungs and providing sufficient oxygen for its active lifestyle. The desert hopper's diet consists of tough, fibrous vegetation. The muscular, denticle-covered mouthparts (including the radula) of its ancestor have evolved into a rod-like structure with a denticled "saw" at the end. This can pierce the waterproof cuticle of a plant to reach the soft, watery pulp inside. The desert hopper's shell and thick skin provide an efficient defense against most plant thorns and spines. Like many desert animals, the hopper does not drink. It obtains all of its water from food, and is perfectly adapted to keep moisture within its body. Despite being a voracious plant-eater, the desert hopper itself is food for a plant: the death-bottle. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Invertebrates Future is Wild 200 MYF Gastropods Molluscs Animals The Future is Wild Herbivores Community content is available under CC-BY-SA unless otherwise noted.'''
