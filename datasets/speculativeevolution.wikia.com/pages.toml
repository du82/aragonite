full_description = '''in: Spec Dinosauria, Dinosaurs, Animals, and 6 more Africa Asia Theropods Madagascar Carnivores Alternative evolution Spec Dinosauria: Abelisauroidea Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> We know today that even toward the end of Mesozoic, most predatory dinosaurs were feathered rather than scaled, but it was still a bit of a shock to the first of Spec's biologists to find a planet seemingly populated only with fuzzy carnivores. Deinonychosaurian draks and tyrannosauroid striders (the principal predatory guilds of Spec) are both generously plumed, and so look incongruously cuddly. In Africa and southern Asia, however, striding across the sun-baked savannas and tearing through the jungle primeval, were the real dinosaurs “big, scaly monsters”, knobbed with horns and spines, gnashing razor teeth and bellowing their ancient anger across the plains. Some traditionalists may be a bit disappointed with the fuzzy predators of the north, but the abelisaurs, hunters of Africa and southern Asia, are true scaly horrors. Contents 1 HISTORY 2 PRISCATAURIDAE (Black beasts, tarasques, moloks, and pantherbulls) 2.1 Horned Molok (Afromoloch diabolus) 2.2 Caped Molok (Afromoloch colarus) 2.3 Asura (Afromoloch indus) 2.4 Greater Pantherbull (Tauropanthera atrox) 2.5 Cheetaur (Tauropanthera velox) 2.6 Nimrod (Tauropanthera nimrod) 2.7 Black Beast (Nigertherium aarghium) 2.8 Ravana (Nigertherium rakasha) 2.9 Tarasque (Priscataurus eximius) 3 NOASAURIDAE (Kagrus and the cain) HISTORY[] Abelisaurs are derived from an ancient lineage, far removed from the feathered coelurosaurs that rule in the north. Indeed, these scaly carnivores split from their feathered cousins sometime during the Early Jurassic, 200-220 million years ago. The ancestors of the abelisaurs were dinosaurs like Ceratosaurus, fairly generalized predators that ranged across the Jurassic globe. However, recent discoveries of the earliest Jurassic abelisaurs, such as the Bajocian Eoabelisaurus, and the Pliensbachian Berberosaurus indicate they were already beginning to develop the small arms and large heads early on. By the Cretaceous, the last era of the Mesozoic, with most of the Northern Hemisphere now in the grip of the coelurosaurs, a group of these scaly predators, the abelisauroids, retained its dominance in South America, Madagascar, India and Africa, and probably in Australia and Antarctica. Some of these abelisaurs were fairly normal-looking large and medium carnivores, while other took the form of strange, horned creatures like Carnotaurus, which resembles, but is only distantly related to, the modern priscataurs. These creatures were continued to flourish throughout the Paleogene and early Neogene in both Africa and South America. South America's species, however, were wiped out in the Pliocene by two major events. The first being when a meteorite struck close to the continent 3.3 million years ago. The factor which played a role in the extinction of the South American abelisaurs was during the Pliocene epoch, a multitude of fauna from North America, most notably errosaurs and deinonychosaurs, had driven various assortment of the native fauna into the point of extinct. The most noticeable casualty being Nanodon marshalensis, the last of the South American abelisaurs. Today, the abelisaurs can only be found in Africa and the warmer parts of Asia, and one group still holds on in Madagascar. All abelisauroids are well adapted to long-distance running, similar to the tyrannosaurs, but their inability to stand cold has kept them out of northern Eurasia, the tyrannosaurs' stronghold. In India, the Middle East, and Africa, however, the abelisaurs are dominant, hunting large herbivores like hadrosaurs and ceratopsians, which also favor warm climates. The reason for this dominance is at present unknown, but may in part lie within the construction of the abelisaurids' jaws; unlike the tyrannosaurids, who are built for snapping, albeit bone-crushing bites, abelisaurs are built for biting in a way not dissimilar to Home-Earth felids: they either utilize a bite and retreat strategy in which they utilize their jaws like hatchets to bludgeon or saw chunks out of their prey, or bite-and hold the neck or skull of their prey until it succumbs to the crushing grip, blood loss or suffocation. In places such as the northern part of their range, there is a slight overlap with the tyrannosaurids that broadens in parts of Central China. However, the two families of predators generally avoid one another where they meet, though one as-yet-unproven report exists of a tarasque battling to the death with a nian (Smilotyrannus sinensis) in the Huang He River Valley. Interestingly, these apex predators are also the slowest growing of the theropods alive today. A family-wide trait, numerous examples such as the Cretaceous Majungasaurus indicate that Mesozoic abelisauroids were slow-growing, often taking more than twenty years to reach full size. Such slow growth is perhaps not surprising, given that many genera lived in harsh environments, though why the trait has still carried over to modern forms remains a mystery. PRISCATAURIDAE (Black beasts, tarasques, moloks, and pantherbulls)[] Three branches of Priscatuaridae. From left to right: horned molok, tarasque and black beast. The abelisaurian priscataurs ("butcher-bulls") range throughout Africa and the warmer parts of Eurasia as far east as India, but the African realm is their stronghold, from which they have successfully restricted the spread of large coelurosaurian predators from the North. This history is in stark contrast to their South American cousins, which were wiped out by invading North American predators during the Pliocene. However, the priscataurs' inability to cope with cool temperatures has barred them from spreading into northern Asia and the Americas. Despite their ecological similarities to tyrannosaurs, priscataurs retain most of the primordial hunting style of big theropods. Like tyrannosaurs they chase their prey over long distances, but their killing method is different: priscataurs open their cavernous maw, crash into their prey, cut a big chunk of flesh out by means of their (comparatively) small, bladelike teeth, and retreat, waiting for the victim to die from blood loss and shock. Unlike tyrannosaurs with their immensely powerful jaws and huge, banana-shaped teeth, priscataurs are inefficient eaters, incapable of cleaning a carcass, let alone of cracking bones to get at the marrow. This habit probably explains the constant association of priscataurs with crunchercrocs. Priscatauridae probably evolved in Africa from mid-sized abelisaurids midway through the Cenozoic, developing a larger, stronger skulls and increasingly atrophied forelimbs, though their ancestry can be traced back to the likes of the recently discovered Chenanisaurus barbaricus. In modern forms, the digits have become fused and are completely non-functional, with just one or two claws. May retain some function as muscle attachments in the torso or as claspers during mating, but may be completely functionless. Another unusual feature of the priscataurs is that the eye socket is, in adults, completely divided into two halves, the euorbital fenestra containing the eye and the parorbital fenestra containing a sinus. Horned Molok (Afromoloch diabolus)[] Horned molok, Afromoloch diabolus (sub-Saharan Africa) <a href="https://static.wikia.nocookie.net/speculativeevolution/images/c/c3/Molok_skull.jpg/revision/latest?cb=20170208151338" class="image"><img alt="Molok skull" src="https://static.wikia.nocookie.net/speculativeevolution/images/c/c3/Molok_skull.jpg/revision/latest/scale-to-width-down/220?cb=20170208151338" decoding="async" loading="lazy" width="220" height="257" class="thumbimage" data-image-name="Molok skull.jpg" data-image-key="Molok_skull.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/c/c3/Molok_skull.jpg/revision/latest/scale-to-width-down/220?cb=20170208151338" /></a> Skull of a horned molok, Afromoloch diabolus. Note that the orbit (eye socket) has divided into two: the euorbital fenestra above and the parorbital fenestra below. The horned molok is an African theropod that is remarkably similar to the late Cretaceous Carnotaurus of South America. Horned moloks live in small packs of 6-10 adult females and one male. Both sexes have large horny ridges above their eyes, these ridges having probably evolved to shadow the eyes from the sun. The male's ridges, however, have become ridiculously large nonfunctional horns. These horns seem to be purely sexual ornaments, and though the males have ritualized butting contests over the females, they only use the horny growths in front of the eye horns. Adult male horned moloks do not take part in hunting, but instead allows females to kill prey. The loner, un-mated males do hunt for themselves, but once they have mated, their horns grow to a size that blocks their vision to such an extent that effective hunting is impossible. Caped Molok (Afromoloch colarus)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/5/51/Capedmolok.jpg/revision/latest?cb=20100817155651" class="image"><img alt="Capedmolok" src="https://static.wikia.nocookie.net/speculativeevolution/images/5/51/Capedmolok.jpg/revision/latest/scale-to-width-down/459?cb=20100817155651" decoding="async" loading="lazy" width="459" height="391" class="thumbimage" data-image-name="Capedmolok.jpg" data-image-key="Capedmolok.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/5/51/Capedmolok.jpg/revision/latest/scale-to-width-down/459?cb=20100817155651" /></a> Caped molok, Afromoloch colarus (northern Africa and Near East) The caped molok is the smaller of the two molok species and lives far north of its savanna-dwelling cousin. Although these 5-6 m long predators are rather tiny compared to their kin, caped moloks are often the largest predators of the arid scrub that is their home. Caped moloks are non-gregarious, hunting singly or in mated pairs. The males of the species tend to be more lightly built than the females, and sport enlarged brow-horns (though not nearly so large as those of the horned molok) and bright red scales on the bridge of the nose. Both sexes sport the "cape" of dark scales for which the species is named. Asura (Afromoloch indus)[] <a href="https://static.wikia.nocookie.net/speculativeevolution/images/9/9c/Indomolok.jpg/revision/latest?cb=20100817155819" class="image"><img alt="Indomolok" src="https://static.wikia.nocookie.net/speculativeevolution/images/9/9c/Indomolok.jpg/revision/latest/scale-to-width-down/485?cb=20100817155819" decoding="async" loading="lazy" width="485" height="358" class="thumbimage" data-image-name="Indomolok.jpg" data-image-key="Indomolok.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/speculativeevolution/images/9/9c/Indomolok.jpg/revision/latest/scale-to-width-down/485?cb=20100817155819" /></a> Asura, Afromoloch indus (South and southeast Asia) The asura or "indomolok" is a close relative of the caped and horned moloks, but lives in India rather than Africa. This 6 m long priscataur is a cursorial pack-hunter like the horned molok, but the asura lacks the enlarged orbital horns of its cousins and seems anatomically more primitive than the African species. It therefore seems unlikely that it could be descended from them, and indeed, it is not. Fossils tell of a common ancestor of all Afromoloch species, which once roamed all over southern Eurasia, and was then pushed back to the warmer regions by the ice ages. This event isolated the indomolok from the African moloks, which only then split into two different spe'''
