 are research things that fly canned look like angels Read Full Post Masonthetrex127 • 26 December 2022 0 Beast People (7) Read Full Post Masonthetrex127 • 26 December 2022 0 Beast People (29) Read Full Post Masonthetrex127 • 1 December 2022 0 Beast People (24) Read Full Post Soulfulpsy • 26 June 2021 1 Our Right Mind I am new to this complex thematic community, on the old side of life (dob 1944). Have been interested in speculative views of the universe since I can remember. In college, that turned into an emphasis on what is now called neuroscience. In the mid-1960s, experimental psychology was trying hard to be "scientific," which meant ignoring consciousness. Eventually I ended up getting my Ph.D. and combining the study of the practice of psychotherapy along with philosophy and theology. The most fortunate part of this was the opportunity to gain some mastery of the metaphysics of Alfred North Whitehead (Bertrand Russell was his student, later they co-authored Mathematica Principia). Whereas Einstein's theory of relativity focuses on objects, what … Read Full Post Isaacn4 • 20 July 2020 1 Jungle Island World This is Jungle World. It is a underground world where there's mostly jungle. There are no ice caps: so it is very warm there, but despite that; there are also some cooler areas in there world. It has all species from different worlds. It has 11 species of people living there. The animal species that live here are mammals, birds, reptiles, amphibians, fish, arthropods, mollusks, synapsids, dinosaurs and surprisingly mythical creatures! The island itself is actually a super continent somehow! (Despite the name!) Despite being mostly jungle, it also has a least a small desert, a lowland, swamps and the ocean has many strange sea creatures. The jawless fish and arthropods first colonize the land oceans and rivers. Then a few million years late… Read Full Post Ezradexter1027 • 25 February 2019 1 New Pleistocene Southern sash pine grasslands, Swamps and Forests The Bush wolf canis venator lupus latrans. Is a medium sized pack hunting omnivore That are descended from feral dogs,coywolves, and the red wolf, they are extremely social and have been known be in packs as large as 49 individuals and are a tawny reddish tan with black markings around the muzzle. The Northamerican capybara Hydrochoerus hydrochaeris is a sheep sized herbivorous rodent that lives in southern North America, They have changed not much because of there great adaptations to there life style. The Florida Sugar Glider Petaurus breviceps floridanus - Descended from sugar gliders that escaped from zoos and pet stores from nearby states and then migrated to Florida when it was connected… Read Full Post Dragontunders • 2 March 2017 4 Just a reminder for all who want to add something to the speculative dinosaur project pages Remember that the purpose of collecting all the files and information made from this fallen project is to collect and archive them for preservation and exibition, so if anyone wants to add their own ideas, they are likely to be deleted since this is not a community project, we are only compiling what was established as canonical before the page closed as some individual works made for the same authors. In the event that there is still material that does not comply with these characteristics, then these will be removed. Read Full Post OviraptorFan • 2 March 2017 0 Greetings hi Read Full Post Rtrifunovski • 5 February 2017 2 The FUTURE is PREHISTORIC (Seriously...) I have recently discovered a very interesting article from Scientific American website, that goes deeper though the idea with the future fauna which is upon us, may actually look more like the wildlife from the past than we think. As well inspire newer speculation projects later on. Don't belive me? Then just read the whole page yourself right here: https://blogs.scientificamerican.com/laelaps/hot-fossil-mammals-may-offer-a-glimpse-of-natures-future/ Rtrifunovski (talk) 09:29, February 5, 2017 (UTC) R.T Read Full Post X3ccBliTzz • 26 September 2017 0 I'm back!!! You wouldn't remember me, I had a different account. I was previously known as SuperCash and as FutureTeleDood. Read Full Post JahmirWhite • 16 December 2016 0 Two projects from me It's just what the title says and also check out the links below: The New Ostracoderms: An Alternative Evolution The Americas Also, my username there at the Speculative Evolution Forums is peashyjah. Read Full Post GlarnBoudin • 13 November 2016 0 Notic I'm officially taking the New Pleistocene project under my wing. Much as I've criticized it, it's still a decent enough concept to work with. I'll be working on the areas it covers one by one, starting with Australia, cutting out anything I find stupid or unnecessary, including creatures that were lifted whole cloth from other continua. In their place, I'll do my best to leave something decent behind. I can't believe I'm saying this, but it's time to make this wiki great again. Read Full Post SuperCash • 13 November 2015 0 Hello Hi I'm new and I'm kicking off, I'm on iPhone 4 so doing some of the achievements is hard Read Full Post SuperCash • 13 November 2015 0 Great Wik This wiki is so good, and should change the front page, because it's still active and popular. I've had a great experience on this wiki and I'm gonna tell all my friends about it!!! Read Full Post LittleIslander • 24 October 2014 0 A Quick Notice Just another reminder, please check out spec-evo.wikia.com if you are interested in this wiki. It is the new version of this place. Read Full Post Harekiller • 8 June 2014 5 Life on Enceladus? I recently watched a youtube video from Scishow Space (an interesting channel, you should check it out) about how, one of Saturn's 60 moons, Enceladus, could support life. Enceladus is a moon of Saturn, wiht a diameter of only 500 kilometres, completely covered with miles of ice. Scientists once thought that liquid water couldn't possibly exist, but satellites report a gravitational peak in one area of Enceladus, where, strangely, there lies a massive depression in the ice. Scientists theorize that there is probably liquid water underneath that depression. In addition, Enceladus is probably tectonic and volcanically active, and volcanic activity underneath the surface could give a heat source, nutrients, and potentially anaerobic life that … Read Full Post Corvus coracis • 5 June 2014 0 Plan for The Fate of the Earth Like all projects, The Fate of the Earth has changed over time, but I'm starting to come up with a rough idea for how it should end up. First, my to do list: Improve on all Quintenary habitats. This will include deletion and replacement of some creatures (especially implausible ones) and putting more detail into creatures. The goal is to get these articles up to the standards of the Neomesozoic articles. Write all Melacene articles. This will take a while, probably a month or two, unlike the improvement on the Quintenary, which should only take a week or two. Create flawless biomechanics for all Motophyta (a clade of mobile plants, which I've been thinking about since the beginning). Just this page could take up to a month, depending on how quic… Read Full Post Ibexgod • 18 January 2014 2 Sol: BI: Triturus giganteus The next animal of Sol, and one that will take up much space if this ever does become a book.... _____________________________________________________________________________________ Giant newt (Triturus giganteus)- Giant newts are large pleurodelines (Newts), with an average size of 85cm, and some individuals reaching more then a meter. They are the top predators on the isle of Scott, which we know as the Scottish Highlands. They are endemic to this isle, as well as a select few surrounding isles. Description Their skulls have a different shape then other caudates, it isn't as rounded as modern newts, but not as long as a alligator snout, it's more in the middle. This large size however, also posed a problem, how do meter long newts maneuver … Read Full Post Corvus coracis • 25 May 2014 3 On the implausibility of giant insects, and why tetrapods have remained dominant on Earth Insects have been evolving since the Devonian, and over 1 million species have been documented, with more to come. Their diversity and success is unlike any other group of animals. And yet, we see no large insects, none even comparable to usual tetrapods. With this many species, one would expect to have tetrapod-like insects, and yet nothing like them exists. There are three main reasons for this, and these are the lack of an internal skeleton, their exoskeleton, and their mode of respiration.The thing that has made tetrapods so successful is their bony skeleton, rather than their limbs, or anything along that line. For example, take the megasquid, from The Future is Wild. It lacks a skeleton, being a cephalopod, and yet is the size of a l… Read Full Post Corvus coracis • 25 May 2014 0 Prehistory Wiki Prehistory Wiki is a wiki created by Ibexgod, and it goes well with Speculative Evolution Wiki. I have joined the wiki, and I would suggest other members of Speculative Evolution Wiki do also. It has been receiving some vandalism, though, but this is all the more reason to help. Those who want to join, please mention it in the comments section. Read Full Post Corvus coracis • 3 May 2014 4 Future is Wild Binomials Although this may not work well with this wiki, I have an idea for giving binomials to the species from The Future is Wild. So, here is my list (a work in progress). 1 5 million years 2 100 million years 3 200 million years 4 Species Group Names Babookari – Cacajao terranus (ground uakari) Carakiller – Deimofalconus apteryx (flightless terror falcon) Cryptile – Sallacerta mediterannus (Mediterranean salt lizard) Deathgleaner – Carnochiropteryx aridus (desert carnivorous bat) Desert Rattleback – Strepitus xeros (dry rattle) Gannetwhale – Cetemorus borealis (northern gannetwhale) Gryken – Martes gryken (gryken marten) Scrofa – Sus levidensis (skinny pig) Shagrat – Borealihydrochoerus glacialis (glacial northern capybara) Snowstalker – Gulo machairodontis (saber-toothed wolveri… Read Full Post Corvus coracis • 5 April 2014 2 Hominoid Phylogeny Superfamily Hominoidea Family Hylobatidae Genus Bunopithecus (incertae sedis) (extinct) Species Bunopithecus sericus ​Genus Hoolock (incertae sedis) Species Hoolock hoolock Species Hoolock leuconedys Subfamily Nomascinae ​Genus Nomascus ​Species Nomascus annamensis Species Nomascus concolor ​Subspecies Nomascus concolor concolor Subspecies Nomascus concolor lu Subspecies Nomascus concolor jingdongensis Subspecies Nomascus concolor furvogaster ​Species Nomascus nasutus Species Nomascus hainanus Species Nomascus leucogenys Species Nomascus siki Species Nomascus gabriellae ​Subfamily Hylobatinae ​Genus Symphalangus ​Species Symphalangus syndactylus ​Genus Hylobates ​Species Hylobates lar ​Subspecies Hylobates lar lar Subspecies Hylobates lar carpenteri Subspecies Hylobat… Read Full Post Corvus coracis • 27 March 2014 2 Pages That Need Improvement This is my list of pages that need improvement as they are short, inaccurate, or implausible. Griffin Monkesaur All pages in category plankton fish Dragons Giant Burrowing Insect Strakonian The Natural History of Horus – only page in project Kritaurian Community project: Terra Chordata Read Full Post Corvus coracis • 26 March 2014 2 Why Cladistic Grouping is Wrong 1. Cladistic grouping requires a near-infinite set of nesting, which does away with the Linnean system of taxonomy. A well-known example is that the class Aves is part of the order Saurischia. Of course, there are more species of birds than would be able to fit in an order, and so birds are considered a class. Another example is the genus Varanus. Because squamata is such a diverse order, the monitor lizards were put into a single genus, while becuase of their diversity should be at least the rank of a family. 2. In order to retain monophyletic grouping, it must be established that the clades diverged at a specific time. The smaller groupings diverged at a time closer to the present. So, most species diverged within the last million years o… Read Full Post Ibexgod • 16 January 2014 2 What would become of the dinosaurs? Part one: Ankylosaurs One of the eternal questions of spec evo, one that has been covered in many projects, like the speculative dinosaur project, and by kaptainwombat, in the form of "What if the asteroid missed?". I would like to cover this, but will not create a project, instead I will summyrise my hypothised fate for each respective group in this post. As I a side note, thier fate doesn't look good. Also, on the aforementioned spec, I don't like what they did. The pterosaurs are gone, dinosaurs have lost no power, and the shift of power hasn't changed, all the same dinosaur groups have the same niches, and few went extinct. 1 Now, on to the main point 1.1 What where those mouths used fo'''
