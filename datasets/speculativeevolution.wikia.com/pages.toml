full_description = '''in: The Future Is Wild species, Future is Wild 100 MYF, Mammals, and 5 more Rodents Animals The Future is Wild Australia Herbivores Poggle Sign in to edit History Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> A poggle feeds on grass seeds harvested by the silver spiders. This small furry creature is one of the last surviving mammals on Earth. The poggle is a small, shy murine murid found on the Great Plateau, 100 million AD, in the documentary The Future is Wild. In the depths of silver spider colonies, collected grass tree seeds are stacked against the rocky walls, packing the cracks between stones, and piled in loose pyramids. The spiders come and go, adding to the heaps all the time. Sometimes inside some of the piles, something moves. The little furry face of a poggle will peep out, all whiskers and rounded ears, big eyes peering around in the darkness. The rodents are there to feed on the grass seeds. The time of mammals is long past. With the extinction of non-avian dinosaurs at the end of the Late Cretaceous period (as well as the whole Mesozoic era), 66 million BC, mammals flourished. For 150 million years, they were the dominant and most spectacular of the land animals during their reign, filling just about all the evolutionary niches hitherto occupied by reptiles and dinosaurs, even taking to the air (as bats) and the seas (as cetaceans, pinnpeds, sea cows and others). Now they are fading. The changing temperature and atmosphere of the planet are encouraging the growth of both terrestrial and aquatic arthropods: insects, crustaceans, arachnids and others. The only mammals left are strange, highly specialized creatures. The poggle is one of these. It lives within the silver spider colonies, sleeping in crevices that the spiders do not enter feeding on the grain stored with such effort by the silver spiders. The poggle has an easy life. It does not need to travel or fight to find food because food is all around it. All it needs to do is eat and breed. Poggles are very fertile and produce large numbers of offspring. Far from trying to protect their store against the hungry poggles, the silver spiders seem to tolerate the presence of the little mammals. They let them burrow through the piles of seeds, allowing them to feast. But now and again, especially during the spider hatching season, members of the foraging caste descend, search out a fat poggle, seize it and inject it with a paralyzing venom. The twitching or dead body is then dragged into the presence of the queens, where it is left for the venom to start working into the tissues. Enzymes in the venom begin to break down the flesh and before long lumps can be torn from the body to feed the queens, the newly-hatched youngsters and the rest of the colony. The poggles are not just tolerated, they are actively encouraged. The carnivorous silver spiders have no interest in harvesting the seeds for their own food, they are farmers of a different kind. The grain harvest is there to feed up the livestock before it is butchered. The poggle is essential to the survival of the silver spider colony. An abundant supply of meat gives the colony a far greater chance of making through the harsh winter. But it is not just proteins from the poggles' flesh that are harvested. Live breeding females are taken to the queen spiders, which drink their blood. Hormones generated by pregnant poggles actually stimulate the egg production of the queens. The remaining flesh then goes to feed the rest of the colony. One of the last representatives of the mammal dynasty may have an easy life, free from the cares of finding perfect shelter and food, but in death they serve as nourishment for the new masters of the Great Plateau. The Future is Wild Species 5 Million Years Babookari • Carakiller • Cryptile • Deathgleaner • Desert rattleback • Gannetwhale • Gryken • Scrofa • Shagrat • Snowstalker • South American rattleback • Spink 100 Million Years Falconfly • False spitfire bird • Grass tree • Great blue windrunner • Lurkfish • Ocean phantom • Poggle • Red algae • Reef glider • Roachcutter • Silver spider • Spindletrooper • Spitfire beetle • Spitfire bird • Spitfire tree • Swampus • Toraton 200 Million Years Bumblebeetle • Deathbottle • Desert hopper • Forest flish • Garden worm • Gloomworm • Lichen tree • Megasquid • Ocean flish • Rainbow squid • Sharkopath • Silverswimmer • Slickribbon • Slithersucker • Squibbon • Terabyte Categories Categories: The Future Is Wild species Future is Wild 100 MYF Mammals Rodents Animals The Future is Wild Australia Herbivores Community content is available under CC-BY-SA unless otherwise noted.'''
