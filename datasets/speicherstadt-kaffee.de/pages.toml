["https://speicherstadt-kaffee.de/dein-event-bei-uns"]
title = "Dein Event bei uns - Speicherstadt Kaffeerösterei"
description = "Deine Veranstaltung im UNSECO Weltkulturerbe! Erlebt einen unvergesslichen Abend im Flair der alten Speicherböden mit Blick auf den Fleet und die Hamburger Speicherstadt."
full_description = "DEIN EVENT BEI UNSDeine Veranstaltung im UNESCO-WelterbeDie Speicherstadt Kaffeerösterei ist eine absolut außergewöhnliche und einzigartige Veranstaltungs-Location. Das Interior gibt euch einen Industriecharme der besonderen Klasse und ist heute unter Denkmalschutz. Für historischen Kontrast sorgen die stählernen Säulen und der originale Eichendielenboden. Die Veranstaltungsräume können ganz nach euren Wünschen und Vorstellungen individuell eingerichtet werden und bieten einen einzigartigen Blick auf den Fleet und die Hamburger Speicherstadt.FÜR ALLES, WAS IHR VORHABTMit unserer Erfahrung, Kreativität, Professionalität und Freude organisieren wir euer Event mit euch, so dass ihr euch voll und ganz euren Gästen widmen könnt.WIR UNTERSTÜTZEN EUCH GERNE BEI:Tisch- und RaumdekorationMusik, DJ, LivemusikCatering, Personal und Servicebis hin zur TechnikAuf insgesamt 300 m² feiert ihr auf bis zu zwei Etagen und habt einen unvergesslichen Abend. Auch um den Weg zu uns braucht ihr euch keine Sorgen machen. In unmittelbarer Nähe sind ausreichend Parkplätze vorhanden und es besteht eine gute Anbindung an das öffentliche Verkehrsnetz (U/S-Bahn, Fernbahn).Haben wir euer Interesse geweckt? Dann kontaktiert uns und wir setzen uns so schnell wie möglich mit euch in Verbindung. Anfrage stellen Unsere Bankettmappe „Eindrucksvolle Eventlocation mit tollem AmbienteInmitten eines eindrucksvollen Ambientes in der Kaffeerösterei in der Speicherstadt, konnten wir unseren „Female Finance Talk“ von Courage – Deutschlands erstem Finanz- und Karrieremagazin – abhalten. Perfekte Organisation, freundlicher und zuvorkommender Service, sehr gutes Essen und ein reibungsloser Ablauf haben perfekt zu einem gelungenen Abend beigetragen, bei dem sich die Gäste rundum wohl fühlten. Für ein Firmenevent, eine Geburtstagsfeier oder was auch immer, sehr zu empfehlen.Wir kommen bestimmt noch einmal.“Christina FlenderHolderstock Media GmbH"
