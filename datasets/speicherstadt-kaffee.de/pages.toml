["https://speicherstadt-kaffee.de/coffee-stories"]
title = "Coffee Stories - Speicherstadt Kaffeerösterei"
description = "Unsere Coffee Stories mit Geheimtipp Hamburg"
full_description = "COFFEE STORIES Geschichten lassen sich am Besten bei einem Kaffee erzählen Jede »Coffee Story« erzählt eine besondere Geschichte und lässt den Leser von einer kleinen Auszeit träumen. Was aber alle Stories gemeinsam haben? – Die Tasse Kaffee wird überall mit unserem frisch geröstetem Kaffee aus der Speicherstadt Kaffeerösterei zubereitet. Wir nehmen euch mit auf unsere Kaffeereisen in Ursprungsländer und Entdeckungsreisen durch Hamburg! KAFFEEREISE DURCH INDIENAPRIL 2019VON ATTAPPI BIS NACH CHIKKAMAGALURUIm April 2019 war unser Kollege Max in Indien unterwegs und hat uns mit auf eine spannende Reise in die Kaffeewelt Indiens genommen.ERSTER STOPP: ATTAPPADI TRIBESAngefangen hat die Reise im Reservat der »Attappadi-Stämme«. Das Reservat wurde 1973 von der Regierung von Kerala zum Wohle der dort lebenden Menschen ins Leben gerufen und wird seit 1985 biologisch bewirtschaftet.In dem Reservat leben die Menschen im Einklang mit der Natur und pflanzen hauptsächlich Robusta Kaffeesträucher an. Neben den Kaffeepflanzen werden Nelken, Kardamom, Pfeffer, Kurkuma, Ingwer, Muskat und Arecanut angepflanzt, welche unter anderem für den außergewöhnlichen Geschmack des Kaffees verantwortlich sind.Die Erntezeit findet zwischen November und Februar statt und war 2018/2019 mit knapp 100 Tonnen Kaffee sehr erfolgreich.Die Kaffeebauern züchten jährlich in der Baumschule neue Kaffeepflanzen um die alten Kaffeesträucher von Zeit zu Zeit zu ersetzen.Nicht nur die Kaffeeplantagen, sondern die gesamte Natur auf dem Reservat haben Max beeindruckt und zeigen wie wichtig es ist, dass sich verschiedene Organisationen für biologisch produzierten Rohkaffee und den Erhalt der dort lebenden Stämme einsetzten. ZWEITER STOPP: MS COFFEE ESTATES, SHEVAROY HILLSMax zweiter Stopp waren die MSP Estates. Die Estates bestehen aus sieben Plantagen, welche in den Shevaroy Hills liegen und bereits in der fünften Generation geführt werden. Die Kaffeevarietäten werden zwischen Schatten spendenden exotischen Frucht- und Gewürzbäumen angebaut, welche den Kaffeebohnen einen einzigartigen Geschmack verleihen.Nach der Ernte werden die Kaffeebohnen auf den Plantagen in der Sonne getrocknet, bevor sie vor Ort geröstet werden bzw. der Rohkaffee verpackt und verschickt wird. Was Max direkt positiv aufgefallen ist, ist wie organisiert und gepflegt die ganze Plantage ist.Mit der »dritten Kaffeewelle« welche für eine hochqualitative Kaffeeproduktion steht, hat auch MSP angefangen sich auf Spezialitätenkaffee zu konzentrieren und speziellere Lots für den wachsenden Markt aufzubereiten. Dabei wurde anders als erwartet nicht der Kaffeeanbau umgestellt, sondern die Aufbereitungsmethode des Kaffees verändert. Mit der aktuellen Ernte 2019 konnte damit das erste Mal nach fünf Generationen auch Spezialitätenkaffee angeboten werden. Mehr über MSP Coffee Estates DRITTER STOPP: YELLIKODIGE BIO-FARM, CHIKKAMAGALURUEin Besuch auf der bekannten Bio-Farm »Yellikodige« hat sich Max natürlich nicht entgehen lassen. Die Farm befindet sich auf 1.150 m im Distrikt Karnataka und ist in Indien aufgrund ihrer außergewöhnlichen Geschichte bekannt.Das Estate wurde 1888 gegründet und bereits 1989 auf eine biologische Anbauweise umgestellt. Die Plantage war seit dem immer in Besitz verschiedener Ornithologen, die besonders auf die Artenvielfalt geachtet haben. Was leicht am teils bis zu 150 Jahre alten Baumbestand zu erkennen ist.Ein Gang durch die Pflanzungen fühlt sich eher wie ein Besuch im Urwald an, als auf einer Kaffeeplantage. Durch die gesunde Bewirtschaftung können dort mehr als 75 verschiedene Vogelarten beobachtet werden.Aktuell wird die »Yellikodige« Farm von Ekata Coffee geleast. Neben den anfallenden Aufgaben auf der Bio-Farm, kümmern sich die Mitarbeiter von Ekata um den Kaffeeanbau, bei welchem die Kaffeesträucher ohne den Einsatz von Pestiziden und chemischen Dünger auf natürliche Weise herangezüchtet werden.Das spiegelt sich auch in dem einzigartigem Geschmack des Kaffees wieder. Mehr über Ekata Coffee GEHEIMTIPP HAMBURGSeit mehr als zwei Jahren ziehen wir regelmäßig gemeinsam mit Geheimtipp Hamburg los um euch die neusten und süßesten Cafés in Hamburg und Umgebung vorzustellen. WILLI’S CAKES – EIN PARADIES FÜR KAFFEE, KUCHEN, MACARONS & CO. März 2020 Kennt ihr diese Cafés, in denen man am liebsten für immer bleiben möchte? Willi’s Cakes in der Lappenbergsallee ist so eines. Hier duftet es nach frisch aufgebrühtem Kaffee, allerlei Torten und Croissants, die gerade dampfend aus dem Ofen kommen. Wir haben uns einmal durch die Theke gefuttert, bis wir vor Leckereien und Glück fast geplatzt wären. Macht euch bereit für einen wahrlich süßen Laden! Text: Anna Paulina GrafFotos: Geheimtipp Hamburg, Dahlina-Sophie Kock Weiterlesen LE PARISIEN – EIN STÜCK PARIS IN WINTERHUDEMai 2019Französische Musik, warme Croissants und der Duft von Kaffee. Was nach einem herrlichen Morgen in Paris klingt, könnt ihr nun jeden Tag in Winterhude erleben. In Alster-Nähe, direkt am Poelchaukamp, findet ihr das Le Parisien – eine Frühstücksperle mit Pariser Flair und den besten Eclairs der Stadt!Text: Leonie ZimmermannFotos: Geheimtipp Hamburg, Lisa Knauer Weiterlesen KNUSPERKEKS – EINE RUNDE SACHE IN DER VERINGSTRASSEFebruar 2019Die Suche hat ein Ende: Wir haben im Knusperkeks in Wilhelmsburg den perfekten Keks gefunden – und diesen gleich in vier Varianten. Zwar durften wir das Rezept nicht mit nach Hause nehmen, aber dafür ein strahlendes Lächeln und einen vollen Magen.Text: Merle Hagelüken Fotos: Geheimtipp Hamburg, Lisa Knauer Weiterlesen"
year_published = 2025
year_updated = 2023
