full_description = "NEUJuni23 NEU BEI UNSspeicherstadt-kaffeeroesterei-onlineshop-headerZUM ONLINESHOPspeicherstadt-kaffeeroesterei-onlineshop-headerAKTUELLE JOBS WIR SIND die Speicherstadt Kaffeerösterei. Im Herzen von Hamburg umgeben von Backsteinhäusern und Fleeten rösten wir unsere Kaffees im schonenden Trommelröstverfahren täglich frisch. Der Rohkaffee kommt über den Hamburger Hafen auf direktem Wege zu uns.Als Spezialitätenrösterei konzentrieren wir uns auf hochwertige sortenreine Kaffees sowie feine Kaffeemischungen. Es ist uns wichtig, mit den Erzeugern vor Ort in direktem Kontakt zu stehen. Zudem engagieren wir uns in ausgewählten Projekten in den Anbauländern um Nachhaltigkeit und faire Geschäftsbeziehungen zu fördern. Dabei stehen Verantwortung für Mensch und Natur für uns im Mittelpunkt.Entdecke die ganze Welt in deiner Tasse.® UNSER STAMMHAUSam Kehrwieder 5 ARBEITE MIT UNS unsere aktuellen Jobangebote AKTUELLE INFOS ZU COVID-19 Bitte informiert euch vor eurem Besuch auf unserer Covid-19-Infoseite über die aktuell geltenden Regeln. FirmenjubiläumWIR FEIERN 30 JAHRE DAS SORTIMENT UNSERE KAFFEES ONLINESHOP Unser Kaffee für Zuhause UNSER SORTIMENT Entdecke die ganze Welt in deiner Tasse RARITÄTEN Kaffees für den besonderen Anlass UNSERE DIREKT GEHANDELTEN KAFFEESVon der Pflanze direkt in eure Tassen! KAFFEEPROJEKTE IM URSPRUNGPROJEKTE ORANG-UTAN-KAFFEE-PROJEKT Kaffee trinken – Lebensraum erhalten 18 CONEJO Demeter Kaffee aus Honduras EINE KAFFEEREISE DURCH INDIEN Begleite unseren Kollegen Max von Attappadi bis Chikkamagaluru SPEICHERSTADT KAFFEERÖSTEREI TRIFFT …PARTNER & KOOPERATIONEN KAFFEE ALE Mit wildwuchs Brauwerk BG BASKETSWeil Sport & Kaffee verbinden ENGAGEMENT KARTE Engagiert für Hamburg KRUSES HOFMILCH Milch aus der Region"
