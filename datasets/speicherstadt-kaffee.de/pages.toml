["https://speicherstadt-kaffee.de/faq"]
title = "FAQ - Speicherstadt Kaffeerösterei"
description = "Hier findest du Anworten auf häufig gestellte Fragen rund um unser Café, unsere Kaffees und Espressi und unsere Rösterei."
full_description = "HÄUFIG GESTELLTE FRAGEN Wir helfen euch gerne weiter GIBT ES FESTE RÖSTTAGE ODER RÖSTZEITENDa unser Kaffee so frisch wie möglich sein soll – und weil wir keine Lagerflächen haben – rösten wir sobald wir von unseren Großhandelskunden Kaffeebestellungen vorliegen haben oder unser Café, unser Fabrikladen oder unser Onlineshop Nachschub benötigt. Im Durchschnitt rösten wir etwa 20 x täglich. Wir versuchen zunehmend auch an den Wochenenden zu rösten damit ihr zuschauen könnt.WERDEN FÜHRUNGEN DURCH DIE RÖSTEREI ANGEBOTEN?Führungen sind leider nicht möglich. Aber ähnlich wie in kleinen Brauereien, in denen ihr euch um die Braukessel herum setzen könnt und den Braumeistern über die Schulter sehen könnt, verhält es sich mit unserer Kaffeerösterei. Da unsere Röstanlage mitten im Gastraum steht, könnt ihr unseren Röstmeistern bei der Arbeit zusehen und ihnen soweit sie Zeit haben allerlei Fragen rund um das Thema Kaffee, Röstung und Zubereitung stellen. Aus hygienischen und versicherungstechnischen Gründen haben allerdings nur unsere Mitarbeiterinnen und Mitarbeiter direkten Zutritt zum Röstbereich.WARUM STEIGEN DIE PREISE FÜR RÖSTKAFFEE?Mehrere globale Entwicklungen beeinflussen die Kosten für hochwertigen Kaffee.Steigende Rohkaffeepreise: Ernteausfälle, höhere Löhne und Produktionskosten sowie Marktspekulation haben die Preise an den Kaffeebörsen verdoppelt. Unsere direkt gehandelten Kaffees sind ebenfalls betroffen.Höhere Transportkosten: Durch Umwege wegen der Huthi-Angriffe im Roten Meer und Niedrigwasser im Panama-Kanal sind die Frachtraten stark gestiegen.Energiepreise: Die Umstellung auf erneuerbare Energien und neue Gas- und Stromverträge haben unsere Produktionskosten erhöht.Allgemeine Kostensteigerungen: Verpackung, Löhne, Speditions- und Finanzierungskosten sind deutlich gestiegen.Neue gesetzliche Vorgaben: EU-Regulierungen zur Lieferkette und Nachhaltigkeit erfordern zusätzlichen Aufwand.Warum jetzt?Wir konnten Preissteigerungen lange abfedern, doch die aktuellen Entwicklungen lassen uns keine Wahl. Unsere Qualität bleibt unverändert – danke für deine Treue! Mehr Infos zur Preisanpassung findest du HIER.GEHÖRT DIE SPEICHERSTADT KAFFEERÖSTEREI ZU EINER GROSSRÖSTEREINein. Die Speicherstadt Kaffeerösterei ist eine inhabergeführte Privatrösterei, die 1994 gegründet und von der Hacienda San Nicolás GmbH betrieben wird. Mehr zu unserer Geschichte erfahrt ihr HIER!MUSS ICH MIT WARTEZEIT RECHNEN?Die Speicherstadt Kaffeerösterei liegt mitten im stark frequentierten Areal der Speicherstadt. Viele hundert Gäste möchten hier täglich unseren Kaffee genießen und/oder in unserem Fabrikladen stöbern. Wartezeiten lassen sich deshalb gerade an Wochenendtagen leider nicht vermeiden. Sollte es im Café oder im Fabrikladen einmal zu voll für dich sein musst du trotzdem nicht auf Kaffee verzichten. In unserer Espressobar bieten wir Coffee-To-Go und eine Auswahl an unseren Top-Seller-Kaffees an.IST AUCH AN SONN- UND FEIERTAGEN GEÖFFNET?Ja, wir haben das ganze Jahr über jeweils von 10.00 – 18.00 Uhr durchgehend geöffnet. Bitte beachtet auch unsere geänderten Öffnungszeiten. Auch an Sonn- und Feiertagen könnt ihr in unserem Café leckere Kaffee- & Kuchenspezialitäten genießen und in unserem Fabrikladen frisch geröstete Kaffees, Zubehör und Geschenke einkaufen oder euch in unserer Espressobar mit Coffee-To-Go und einer Auswahl an unseren Top-Seller-Kaffees eindecken.IST DIE KAFFEERÖSTEREI ROLLSTUHLGERECHT?Ja, im Treppenhaus befindet sich ein Rollstuhl-Fahrlift mit Schlüsselschalter. Bitte die am Fahrlift befindliche Funk-Klingel drücken, dann kommt jemand von uns mit dem Schlüssel und hilft dir. Wichtig: der Fahrlift gehört nicht uns sondern unserem Vermieter, der sich auch um die Reparatur und Instandhaltung kümmert. Bitte ruft vor eurem Besuch sicherheitshalber einmal bei uns durch ( Tel.: 040 537 99 85 -10 oder -11) und erkundigt euch ob der Fahrlift nicht gerade repariert / gewartet wird. Ein rollstuhlgerechtes WC befindet sich im 1. OG (mit dem Personenaufzug erreichbar). Hier passt der EURO-Schlüssel falls du selbst einen besitzt, ansonsten bitte jemanden von unserem Café- oder Fabrikladenteam dir aufzuschließen.GIBT ES BEI EUCH AUCH FAIR TRADE KAFFEEJa bzw. nein. Durch persönliche Kontakte zu den Bäuerinnen und Bauern und zunehmende Direktimporte ohne diverse Zwischenhändler versuchen wir Transparenz zu schaffen und möglichst nachhaltige Geschäftsbeziehungen aufzubauen. Dies gelingt aber nur, wenn alle Partner zufrieden sind. Einen fairen Preis für Qualität zu zahlen ist dabei eine wesentliche Grundlage.SIND DIE KAFFEES AUCH FÜR VOLLAUTOMATEN GEEIGNET?Ja. Gerade weil wir unsere Kaffees recht lange und mitteldunkel rösten sind sie »durchgeröstet«, deshalb leicht zu mahlen und nicht ölig und somit ideal für die Zubereitung mittels Vollautomaten geeignet.WIE BEWAHRT MAN KAFFEE AM BESTEN AUF?Kaffee fängt unmittelbar nach der Röstung an sein Aroma zu verlieren. Wir empfehlen daher ganze Bohnen zu kaufen, diese in aromageschützten Behältnissen aufzubewahren und die Bohnen erst unmittelbar vor der Zubereitung zu mahlen. Kühlung verzögert den Alterungsprozess. Da Kaffee stark hygroskopisch ist – also Fremdgerüche aufnimmt – sollte er auch aus diesem Grund unbedingt luftdicht verschlossen gelagert werden. Wir empfehlen hierzu unsere Coffee Vacs in verschiedenen Größen.AUF DEM ETIKETT DES KAFFEES STEHT ERDNUSS/BERGAMOTTE/VOLLKORNKEKS. WERDEN DEN KAFFEES AROMEN ODER ANDERE BESTANDTEILE BEIGEMISCHT?Nein, unseren Kaffees werden weder andere Bestandteile, noch künstliche Aromen beigemischt. Alle auf dem Etikett angegebenen Geschmacksnoten beziehen sich auf natürlich im Kaffee vorkommende Aromen, die man bei richtiger Dosierung und Wassertemperatur riechen und schmecken kann. Denn mit bis zu 800 verschiedenen natürlich vorkommenden Aromen, ist Kaffee eines der komplexesten Getränke. Unsere Kaffees sind also grundsätzlich frei von Nüssen, Milch, Gluten, etc.. Warum Kaffees so viele verschiedene Aromen ausbildet und mehr über unser Farbsystem erfährst du HIER. WERDEN IM MOMENT KAFFEEVERKOSTUNGEN ANGEBOTEN?Leider nicht. Zwar ließen unsere räumlichen Möglichkeiten die Einhaltung der behördlichen Hygiene- und Abstandsregeln zu, wir haben uns dennoch dazu entscheiden hier kein Risiko – weder für die Teilnehmerinnen und Teilnehmer als auch für die/den Referent/in – einzugehen und bis auf weiteres keine Kaffeeverkostungen anzubieten."
year_published = 2025
year_updated = 2025
