["https://speicherstadt-kaffee.de/direkthandel"]
title = "Direkthandel - Speicherstadt Kaffeerösterei"
description = "Faire Handelsbeziehungen und ein direkter Kontakt zu den Farmer*innen sind uns wichtig. Entdeckt unsere direkt gehandelten Kaffees!"
full_description = "DIREKTHANDEL Von der Pflanze direkt in eure Tassen Es ist uns wichtig, mit den Erzeugern im Ursprung in direktem Kontakt zu stehen. Der direkte Handel ermöglicht es uns, unsere Vorstellungen von hochwertigem Kaffee mit den Bedingungen vor Ort in Einklang zu bringen. Neben unseren Kaffeeprojekten und einigen Raritäten, haben wir weitere direkt gehandelte Kaffees in unserem Sortiment, die wir euch hier gerne vorstellen möchten. Wir arbeiten beständig daran, neue, spannende Kaffees direkt von den Farmerinnen und Farmern in eure Tassen zu bringen und nachhaltige Handelsbeziehungen zu etablieren. KENIA AA »Kirinyaga« HAUPTNOTE Clementine, Orange NEBENNOTEGranatapfel, Limette ABGANGAnanas, dunkle Schokolade SÄURE3/4 INTENSITÄT2/4 Die »Guama Coffee Factory« liegt im westlichen Teil des kenianischen Bezirks Kirinyaga und ist seit 1974 eines von rund 3.500 Mitgliedern der Baragwi Kooperative. Zusammen verarbeiten sie jährlich rund 750 Tonnen Kaffeekirschen. Die aus dieser Region stammenden Varietäten SL34 und SL28 sind heute weltweit für besonders weichen, harmonischen Kaffee und eine lebendige, unvergleichliche Säure bekannt und entsprechend begehrt.Der Kaffee wird von Hand gepflückt und gewaschen aufbereitet. Hierbei werden die Kaffeekirschen wenige Stunden nach ihrer Ernte vom sie umgebenden Fruchtfleisch befreit und anschließend für bis zu 24 Stunden in Wassertanks kontrolliert fermentiert. Hierdurch werden letzte Anhaftungen entfernt und die feine Säure sowie die besonderen Aromen hervorgehoben. Nach einem weiteren 16-18-stündigen Waschprozess wird der Pergamentkaffee für rund 3 Wochen getrocknet.Dank der Baragwi Kooperative profitieren die Bauern von besseren Preisen und einer effizienten Vermarktung ihres Kaffees. »Guama Coffee« legt großen Wert auf Nachhaltigkeit und Qualität im Anbau und der Aufbereitung der Rohkaffes. Dieser Einsatz wurde bereits mit einigen Zertifikaten belohnt, die garantieren, dass der Kaffee den internationalen Standards entspricht und gleichzeitig das sozioökonomische Wohl der Bauern gefördert wird. Kaffee kaufen NICARAGUA »El Pinabete« HAUPTNOTE Erdbeere, Pfirsich NEBENNOTEDattel, Feige ABGANGRhabarber, Vanille SÄURE2/4 INTENSITÄT2/4 Juan Carlos Herrera ist der Eigentümer der Farm „El Pinabete“, die seit 1970 im Familienbesitz ist. Sie liegt in der Region Mosonte, Nueva Segovia. Der Kaffee wächst dort in einem natürlichen Ökosystem, in dem Wald und Fruchtarten als Schattenspender fungieren. Dies fördert nicht nur die Biodiversität der Farm, sondern schützt auch den Boden und das Mikroklima.Die Farm setzt auf ein ausgewogenes Verhältnis zwischen organischen und synthetischen Düngemitteln, um die Gesundheit der Pflanzen zu gewährleisten. Die Kaffeebäume werden regelmäßig beschnitten, um ihre Vitalität zu stärken und die Erntequalität zu steigern. Zusätzlich wird ein gezieltes Schattenmanagement betrieben, das den Bäumen optimale Wachstumsbedingungen bietet.Auf der Farm werden verschiedene hochwertige Kaffee Varietäten angebaut, darunter roter Catuaí, gelber Catuaí, Catimor und Caturra.Der Kaffee wird mit der Methode »Natural Anaerobic« aufbereitet, bei der die Bohnen in einem kontrollierten, sauerstoffarmen Umfeld fermentiert werden. Dies verleiht dem Kaffee einen besonders intensiven und komplexen Geschmack. Kaffee kaufen NICARAGUA »Ojo de Agua« HAUPTNOTE Cashew, Süßgebäck NEBENNOTESalbei, weiße Traube ABGANGKaramell, Milchschokolade SÄURE3/4 INTENSITÄT3/4 Ali Francisco Herrera Rivera ist der Besitzer der Farm »Ojo de Agua« in Mosonte, Nueva Segovia, die er seit 2015 als Familienerbstück führt. Auf der Farm wird der Kaffee auf besonders umweltfreundliche Weise angebaut. Es wird darauf geachtet, dass die Farm ökologisch, sozial und wirtschaftlich handelt. Das bedeutet, dass die Landwirtschaft so gestaltet ist, dass sie die Umwelt schont, die lokalen Gemeinschaften unterstützt und langfristig wirtschaftlich tragfähig bleibt.Um die Kaffeepflanzen zu schützen, wachsen auf dem Hof verschiedene Waldarten und Obstbäume, die natürlichen Schatten spenden. Dies hilft nicht nur den Kaffeepflanzen, sondern fördert auch die Biodiversität der Farm.Es werden ausschließlich voll ausgereifte Kaffeekirschen geerntet, was für eine besonders hohe Qualität des Kaffees sorgt. Dieser Kaffee wurde nass (»gewaschen«) aufbereitet. Hierbei werden die Kaffeekirschen binnen weniger Stunden nach ihrer Ernte vom sie umgebenden Fruchtfleisch befreit. Anschließend wird der sogenannte »Pergamentkaffee« in Wassertanks kontrolliert fermentiert, um ihn von Verunreinigungen zu befreien und seine Aromen hervorzuheben. Kaffee kaufen KOLUMBIEN »Finca Guayacanes« HAUPTNOTE Ananas, Orange NEBENNOTECranberry, Pekannuss ABGANGSchwarzbrot SÄURE3/4 INTENSITÄT3/4 Seit 1972 ist die 64 Hektar große Finca Guayacanes – von der wir diesen Kaffee direkt beziehen – in Besitz der Familie Vélez. Ursprünglich gehörte sie Juliana Vélez‘ Vater Dario Vélez, der jedoch 2001 unter tragischen Umständen ums Leben kam. Erst 2009 war die Familie wieder in der Lage, sich intensiv um die Finca zu kümmern und so das Erbe des Vaters aufrecht zu erhalten. In der Region kam es in den Jahren zwischen 2000 und 2009 immer wieder zu schweren Gewalttaten, sodass eine Bewirtschaftung der Finca in dieser Zeit für die Familie zu gefährlich war.Juliana betreibt die Finca inzwischen mit einem tiefen Verständnis und Respekt für die einzelnen Prozesse des Kaffeeanbaus und die sie umgebende Natur. Besonders im letzten Jahr hat sie sich akribisch mit dem Erhalt und der Verbesserung der Böden beschäftigt, die ein wichtiger Bestandteil im Kaffeeanbau sind. Sie selbst sagt »Der Erhalt der Natur ist für mich das Wichtigste – unsere Erde zu respektieren und sie nicht weiter zu schädigen.«. Langfristig möchte sie die Finca deshalb auf biodynamischen Anbau umstellen und die Prozesse nachhaltig optimieren.Angebaut werden auf der Finca hauptsächlich die Kaffeevarietäten Colombia, Caturra und Castillo. Caturra ist eine Zwerg-Mutation der ursprünglichen Bourbon-Bohne. Obwohl sie sehr empfindlich ist, ist sie in Lateinamerika äußerst beliebt, da sie besonders ertragreich ist.Bei Castillo handelt es sich um eine Weiterentwicklung der Colombia Varietät, die häufig süß und fruchtig schmeckt. Entwickelt wurde sie 2005 von dem kolumbianischen Forscher Jaime Castillo und wurde schnell zur in Kolumbien am häufigsten angebauten Varietät.Den Namen »Guayacanes« trägt die Finca aufgrund der sie umgebenden wunderschön blühenden Guayacán-Bäume, die auch auf den Kaffeesäcken abgebildet sind. Neben Kaffee wachsen an den steilen Hängen auch Zitronen, Orangen, Mandarinen, Avocados, Guaven und Pflaumen. Zur Ernte werden die menschlichen Helferinnen und Helfer in dem unwegsamen Gelände auf der Finca außerdem von zwei Maultieren unterstützt, die täglich etwa 1.000 Kilo Kaffeekirschen von den Hängen zur Aufbereitungsanlage bringen.Neben Kaffee ist Julianas zweite größte Leidenschaft übrigens Musik. Wenn ihr sie etwas näher kennenlernen möchtet, könnt ihr euch eines ihrer Lieder anhören. Kaffee kaufen Fotos: cafe.guayacanes THAILAND »Akha Hilltribes« HAUPTNOTE Cashew NEBENNOTESchwarztee ABGANGRohrzucker SÄURE2/4 INTENSITÄT2/4 In den malerischen Bergen Nordthailands liegt auf 1.300 – 1.500 m ü. NHN das kleine Dorf Pang Khon, von dem wir diesen wunderbaren Kaffee beziehen. In dem Bergdorf des Akha Volkes leben gerade einmal ca. 350 Menschen. Bereits seit 20 Jahren werden hier Kaffeesträucher kultiviert, sodass es kaum verwunderlich ist, dass sich fast alle Bewohnerinnen und Bewohner des Dorfes mit Kaffee beschäftigen.Dass wir diesen Kaffee beziehen können, verdanken wir Nussara (Avou) und Jürgen Wittmann (links im Bild), die selbst seit 2012 drei Hektar Farmland in der Nähe Pang Khons bewirtschaften und über die Jahre eine intensive und freundschaftliche Beziehung zu den Bewohnerinnen und Bewohnern der umliegenden Bergdörfer aufgebaut haben. Mit viel Einsatz und Leidenschaft haben sie darüber hinaus weitere soziale und infrastrukturelle Projekte in der Region ins Leben gerufen: Unter anderem das »Kaffeedorf« Mae u Mong, das sie mit Wissen, Jungpflanzen und Equipment versorgen.Dank der stabilen Abnahmemengen und der fairen Bezahlung können die Kaffeebäureinnen und -bauern den Anbau vor Ort stetig weiterentwickeln. In den letzten Jahren hat Ghan – die Hauptansprechparterin in Pang Khon – zum Beispiel in optimale Lagerhallen und Sortieranlagen, in experimentelle Aufbereitungsmethoden sowie in die Aufzucht vielversprechender Arabica Varietäten investiert.Daneben begleiten Nussara und Jürgen die Farmerinnen und Farmer, mit denen sie zusammenarbeiten, bei allen Prozessen von Anfang bis zum Ende der Kaffeesaison und unterstützen sie sowohl finanziell als auch bei der praktischen Arbeit.Die Haupterntezeit findet in Thailand übrigens zwischen November und März statt. Mehr Infos über Nussara, Jürgen, ihre Kaffeepartner, das Akha Volk und ihr Engagement findet ihr unter: mystichilltribe.com Kaffee kaufen Fotos: mystichilltribe.com RUANDA »Nyakizu« HAUPTNOTE Schwarztee, Orangenblüte NEBENNOTENektarine ABGANGClementine SÄURE3/4 INTENSITÄT3/4 2012 wurde die Kaffeeaufbereitungsanlange Nyakizu gebaut. Wir beziehen den Kaffee direkt von den Kaffeeproduzenten und tragen so einen Teil dazu bei, die Einkommens- und Lebensbedingungen in dieser hochgelegenen Region zu verbessern. Die einzige dort angebaute Kaffeesorte ist die Arabica Varietät Red Bourbon. Ausgewählte Kaffees der Aufbereitungsanlage Nyakizu gehörten 2018 zu den 35 besten Kaffees im Rwanda Cup of Excellence-Wettbewerb. Kaffee kaufen Foto: NYAKIZU COFFEE @PHOTOGRAPHY BY M.O Studios"
