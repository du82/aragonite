title = "Caps - Speicherstadt Kaffeerösterei"
description = "CAPS GEGEN MEERESVERSCHMUTZUNG: In Zusammenarbeit mit mantahari haben wir diese zwei Speicherstadt Kaffeerösterei Caps für euch entworfen."
full_description = "SPEICHERSTADT KAFFEERÖSTEREI CAPS Unsere Caps gegen Meeresverschmutzung Wir freuen uns, euch unsere neuen „Speicherstadt Kaffeerösterei“ Caps zu präsentieren – und das gleich in zwei verschiedenen Designs! In Zusammenarbeit mit MANTAHARI haben wir diese Caps für euch entworfen. Erfahre mehr über MANATAHARI Unsere Caps wurden zu 97% aus recyceltem Plastik hergestellt. DAS BESONDERE AN UNSEREN CAPS?Mit unserer Cap wollen wir gleich doppelt nachhaltig sein. Daher haben wir Wert auf die Verwendung nachhaltiger Materialien gelegt. Der Recycling-Anteil unserer Caps liegt bei 97%, denn sie bestehen aus 72% recyceltem PET (Garn), 25% recyceltem PE (Schild) und zu 3% aus Metall (Schnalle Verschluss).Außerdem werden mit dem Erlös dieser Caps Spenden an die Marine Megafauna Foundation getätigt, die sich dafür einsetzt, die am stärksten gefährdeten Meeresriesen und ihre Lebensräume zu schützen. MANTAHARI Gründer Tim hat diese Meeresschutzorganisation in Indonesien kennen und schätzen gelernt. Durch Forschung und Bildungsprojekte versucht diese, die Öffentlichkeit und die indonesische Regierung aufzuklären und dadurch das Problem der verschmutzten Meere bei der Ursache zu bekämpfen. Doch anders als üblich haben wir nicht einfach nur Geld überwiesen oder Schecks gesendet… wir haben die Patenschaften von vier Manta Rochen übernommen!WIR ADOPTIEREN MANTA ROCHENDie Adoptionen stehen dabei nur symbolisch für die Spenden an die Marine Megafauna Foundation. Die adoptierten Manta Rochen werden anhand ihres einzigartigen Abdrucks am Bauch (“Belly Print”) über eine optische Datenbank identifiziert. Die Tiere werden also nicht invasiv gechipped oder getagged und leben weiterhin in Freiheit. Aber das Geld der Adoption wird in Bildung und Forschung investiert, was nachhaltig die Situation der Mantas vor Ort verbessern soll. COFFEA CAPPY PUNKTI MR. MANTA zur Cap mit grauem Logo zur Cap mit rot-weißem Logo"
year_published = 2025
year_updated = 2025
