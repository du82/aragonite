title = "Fabrikladen - Speicherstadt Kaffeerösterei"
description = "In unserem Fabrikladen findet ihr neben unserem gesamten Kaffeesortiment. auch Kaffeezubehör (bspw. von Hario, Chemex oder Moccamaster) und regionale hamburger Produkte sowie feine Schokoladen, Weine und Liköre."
full_description = "UNSER FABRIKLADEN Nehmt euch Zeit zum Stöbern In unserem Fabrikladen halten wir – je nach Erntezeit – ca. dreißig frisch geröstete Kaffee- und Espresso-Spezialitäten und weltbekannte Kaffeeraritäten für euch bereit.Damit ihr bei so vielen Sorten den Überblick behaltet und euren Lieblingskaffee findet, sind euch unsere gut geschulten Mitarbeiter und Mitarbeiterinnen gerne bei der Auswahl behilflich. Zudem wird euer Kaffee auf die gewünschte Zubereitungsart gemahlen, sollte es zu Hause keine Mühle geben.Neben unseren Kaffees bieten wir außerdem noch Zubehör bekannter Hersteller an. Zum Beispiel Produkte von:Hario®Moccamaster®Bodum®Finum®Außerdem findet ihr in unserem Fabrikladen alles von Honig aus der Region, feinen Schokoladen, handgefertigten Bonbons bis zu Weinen und Likören.Ihr kommt nicht aus Hamburg, wollt unseren Kaffee aber trotzdem genießen? Dann schaut in unserem Onlineshop vorbei.Wir freuen uns auf euren Besuch. ZUM ONLINESHOP"
