["https://spi-inc.org/meetings"]
title = "Board meetings"
full_description = "Board meetings SPI holds its board meetings publicly on IRC using the #spi channel on irc.spi-inc.org (part of the OFTC network). The by-laws state that this must happen at least quarterly, but we aim for a monthly meeting at 20:00 UTC on the second Monday of the month. Items to be discussed at a meeting need to be put on the agenda prior to the meeting. Please contact the SPI Secretary to get your item on the agenda. Contact information for the Secretary is available from the Board page. Resolutions adopted by the Board are posted to the spi-announce mailing list and posted to the resolutions page. After Board approval, minutes from SPI meetings can be found on the minutes with raw logs also available. The agenda for the next board meeting can be found in the agenda section. We also have a publicly viewable Google Calendar (ics file)."
