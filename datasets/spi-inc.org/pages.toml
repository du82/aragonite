["https://spi-inc.org"]
title = "SPI"
full_description = "Software in the Public Interest (SPI) is a non-profit corporation registered in the state of New York founded to act as a fiscal sponsor for organizations that develop open source software and hardware. Our mission is to help substantial and significant open source projects by handling their non-technical administrative tasks so that they aren't required to operate their own legal entity. Services offered to projects can be found here. Projects interested in becoming associated with SPI should read the Associated Project HOWTO. The relationship between SPI and associated projects is explained here. Incorporation Software in the Public Interest was incorporated as a non-profit organization on June 16, 1997 in the state of New York. In 1999, the Internal Revenue Service of the United States government determined that under section 501 (a) of the Internal Revenue Code SPI qualifies for 501 (c) (3) (non-profit organization) status under section 509 (a) (1) and 170 (b) (1) (A) (vi). This means that all donations made to SPI and its supported projects are tax deductible for donors in the United States. How is SPI run? The documents that define the purpose and operation of SPI are the By-Laws and the Certificate of Incorporation. It has a Board of Directors which includes four officers in the roles of President, Vice President, Secretary, and Treasurer. Certificate of Incorporation By-Laws How can I contribute? As an individual you can consider becoming a member. See the donations page for details on how to contribute to an existing associated project. Website This website is managed using ikiwiki+git. You can view the revision history via GitLab and send any updates, either as a git pull request or a patch, to webmaster@spi-inc.org."
year_published = 2025
clearnet = "https://spi-inc.org"
