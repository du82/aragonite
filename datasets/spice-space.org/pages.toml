["https://www.spice-space.org/demos.html"]
title = "Demos"
full_description = "Guest GPU is a paravirtual device (virtio-vga) that is used to pass graphics commands to be executed on the host GPU (via qemu and virgl-renderer) Guest framebuffer information is then passed by qemu-kvm to spice-server (library) which sends it to spice client. Local spice means that the spice client is running on the same machine on which the VM is running (the client machine is the host). As part of the SPICE Adaptive Streaming project, we developed a toolbox for studying the performance of real-time video streaming. The toolbox consists in: In the current step, we are working on a mathematical modelisation of the resource usage (CPU, GPU, etc.) Repository: https://gitlab.com/kpouget_spice/streaming_stats Full version of the recording (35min): https://youtu.be/vdcFiyhFvUw This is remote host-guest setup that is configured with spice-streaming-agent and Intel's GVTg technology. The video demonstrates how the guest can utilizes its GPU in order to run graphics-intensive loads and to accelerate the encoding process of the video stream that is sent to the client."
