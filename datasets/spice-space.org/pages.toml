title = "Download"
full_description = "spice-gtk is a GTK+3 SPICE widget. It features glib-based objects for SPICE protocol parsing and a gtk widget for embedding the SPICE display into other applications such as virt-manager or Boxes. Python and Vala bindings are available too. This section contains various optional drivers and daemons that can be installed on the guest to provide enhanced SPICE integration and performance. Windows SPICE Guest Tools (spice-guest-tools) - This installer contains some optional drivers and services that can be installed in the Windows guest to improve SPICE performance and integration. This includes the qxl video driver and the SPICE guest agent (for copy and paste, automatic resolution switching, ...) The SPICE server code is needed when building SPICE support into QEMU. It should be available as a package in your favourite Linux distribution, which is the preferred way of getting it. Guest-side daemon which captures the guest video output, encodes it to a video stream and forwards the resulting stream to the host to be sent through SPICE."
