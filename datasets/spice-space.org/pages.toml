["https://www.spice-space.org/support.html"]
title = "Support"
full_description = "Spice user manual provides all the information on how to get, build, install and use Spice. You can also read Spice for newbies in case you want to have a better understanding about Spice architecture and features. Many questions can be answered in the Spice user manual and the Spice list archive. If you can't find the answer there, post your question to spice-devel@lists.freedesktop.org. Be sure to detail your issue so that we can offer the best response. Spice project would like to have your feedback - either negative or positive. Please post your feedback to spice-devel@lists.freedesktop.org. Your help for tracking down the bug is very important, so please try to be as cooperative as possible and help us resolve the bug. First search issues to see whether it was already requested. In addition, refer to the Features page. If it was not requested you can submit a new issue using a clear and detailed description."
