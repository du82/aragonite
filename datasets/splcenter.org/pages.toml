title = "About"
description = "Civil rights lawyers Morris Dees and Joseph Levin Jr. founded the SPLC in 1971 to ensure that the promise of the civil rights movement became a reality for all. Since then, we’ve won numerous landmark legal victories on behalf of the exploited, the powerless and the forgotten. Our lawsuits have toppled institutional racism and stamped […]"
full_description = "About The SPLC is a catalyst for racial justice in the South and beyond, working in partnership with communities to dismantle white supremacy, strengthen intersectional movements, and advance the human rights of all people. Civil rights lawyers Morris Dees and Joseph Levin Jr. founded the SPLC in 1971 to ensure that the promise of the civil rights movement became a reality for all. Since then, we’ve won numerous landmark legal victories on behalf of the exploited, the powerless and the forgotten. Our lawsuits have toppled institutional racism and stamped out remnants of Jim Crow segregation; destroyed some of the nation’s most violent white supremacist groups; and protected the civil rights of children, women, the disabled, immigrants and migrant workers, the LGBTQ community, prisoners, and many others who faced discrimination, abuse or exploitation. Our Intelligence Project is internationally known for tracking and exposing the activities of hate groups and other domestic extremists. Learning for Justice provides free resources to caregivers and educators—teachers, administrators, counselors and other practitioners—who work with children from kindergarten through high school. Educators use the materials to supplement the curriculum, to inform their practices, and to create civil and inclusive school communities where children and youth are respected, valued and welcome participants. Our History A history of protecting society’s most vulnerable. Learn More Careers Explore our current job openings. Learn More Financial Information The Southern Poverty Law Center’s latest financial information and annual report. Learn More Impact Report Learn More Open RFPs Learn More"
