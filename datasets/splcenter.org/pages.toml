["https://www.splcenter.org/policy-advocacy"]
title = "Policy Advocacy"
description = "The Southern Poverty Law Center works to advance and shape federal, state and local policies to help build a fair and equitable South where everyone can thrive."
full_description = "Policy Advocacy The Southern Poverty Law Center works to advance and shape federal, state and local policies to help build a fair and equitable South where everyone can thrive. Addressing a Legacy of Injustice Despite the historic strides made during the Civil Rights Movement, racial disparities persist in areas such as the criminal legal system, education, health care, housing, employment and more. Across the Deep South, Black and Brown communities continue to disproportionately face police violence, mass incarceration and discrimination. Compounding these challenges, the unrelenting assault on voting rights by antidemocratic forces aims to silence the voices of those who bear the brunt of unjust policies. This dire situation demands a sustained movement to dismantle the entrenched structures of racism and inequality in our country and to implement policies that will achieve permanent change for vulnerable communities that need it most. Achieving Progress through Policy To make meaningful progress that will improve the lives of communities of color and others who are pushed to the margins, the SPLC advocates for bold, forward-thinking policies that can help drive transformative change in the Deep South and beyond. By analyzing issues like poverty and mass incarceration, we are able to design solutions that address the complexity and interconnectedness of these challenges. Rather than reacting to problems, we strive to proactively address root causes and advance policy solutions that shape a future where equity and justice are foundational principles of society. Simultaneously, we remain steadfast in our commitment to protecting and defending the civil rights of all people. These rights form the foundation of every movement for equality, including those advocating for Black, Indigenous, and other communities of color, women’s rights, LGBTQ+ rights, the rights of people with disabilities, immigrants’ rights, and the rights of religious minorities. The Latest Policy Letter to House re: Vote No on H.R. 35 (The Agent Raul Gonzalez Officer Safety Act) Policy Letter to House re: Vote No on S. 5 (The Laken Riley Act) Policy Letter to Senate re: Vote No on S. 5 (The Laken Riley Act) unless amended Policy Letter to House Urging to Vote No on the FY 2025 Budget Resolution 1 2 3 Next Page Read more Our Priorities Addressing the SPLC’s core policy priorities is critical for advancing justice and enabling people of color to access ladders of opportunity. Strengthening Democracy & Voting Rights Through policy advocacy, we work to enhance voter power while challenging voting restrictions. Our efforts include advocating for increased funding for local election administration, eliminating voting barriers imposed by the criminal legal system, and engaging in both legislative and administrative advocacy to protect and expand access to the ballot box. Dismantling White Supremacy To root out hate and extremism, we advocate at the federal, state, and local levels for mandatory hate crime data reporting and the exposure and discreditation of organizations that promote hate and white supremacist beliefs. We also support efforts to preserve the teaching of accurate history in our schools. Eliminating Poverty and Economic Inequality In order to decrease the racial wealth gap, we advocate for increased access to safe and affordable housing, push for the expansion and protection of social safety net benefits, and support land preservation efforts. We also work to safeguard diversity, equity, inclusion and accessibility (DEI) protections and programs. Ending Unjust Imprisonment To sufficiently protect our communities from the harms of the criminal legal system, we advocate for the advancement of youth justice policy in each of our priority states and at the federal level. We also work to expose and end carceral system profits, promote community-centered alternatives to incarceration, and bolster support for policing, sentencing and parole reform. Advocating for Human Rights Like the Constitution, several international human rights treaties contain important obligations to protect, respect and fulfill rights. We continue to place these obligations at the core of the SPLC’s work, advocating for equality, civil rights and justice for all. Priorities by state Policy Advocacy 2025 Policy priorities for Alabama In a true democracy, voting should be a simple, convenient process that allows every eligible voter to participate easily. But too often in Alabama, this is not the case. Policy Advocacy 2025 Policy priorities for Florida Florida is an outlier nationally, prosecuting more children as adults for felonies than any other state — often at thesole discretion of prosecutors. Policy Advocacy 2025 Policy priorities for Georgia Georgia is one of six states that neglects to provide dedicated funding to rescue financially insecure public schools, which disproportionately harms more than 567,000 kids. Policy Advocacy 2025 Policy priorities for Louisiana Police departments and sheriffs’ offices across Louisiana are not required to report even the most fundamental law enforcement information, such as the number of stops or arrests they make. Policy Advocacy 2025 Policy priorities for Mississippi Currently, Mississippi spends about 5% of its $86.5 million annual TANF award on cash payments to needy families, which means it spends less than 10% of its federal allocation on direct assistance. Defend Youth in Louisiana If Act 3 passes, Louisiana’s legislators could pass laws to lock up more young people in adult prisons for even minor incidents like trespassing, graffiti, or possessing small amounts of marijuana. You can still stop Act 3. Take the Pledge Research and Analysis Report Ending Business as Usual: The Need for Alabama Civil Asset Forfeiture Data Transparency Report Georgia’s youth legal system overemphasizes punishment Report Mississippi underfunding worsens a racially disparate education system"
