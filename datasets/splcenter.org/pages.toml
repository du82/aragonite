["https://www.splcenter.org/racial-justice-issues/strengthening-democracy"]
title = "Strengthening Democracy & Voting Rights"
description = "By engaging local communities and grassroots organizations, the SPLC is organizing to build the political power of Black and Brown people in the Deep South."
full_description = 'Language: English Español document.getElementById( "lang_choice_1" ).addEventListener( "change", function ( event ) { location.href = event.currentTarget.value; } ) Racial Justice Issues Strengthening Democracy & Voting Rights By engaging local communities and grassroots organizations, the Southern Poverty Law Center is organizing to build the political power of Black and Brown people throughout the Deep South. Every Voice Must Be Heard and Every Ballot Counted. Voter Suppression Has Ramped Up in the Past Decade The freedom to vote is the most sacred right we have, yet it is under constant attack. Since the Shelby County v. Holder decision, a slew of discriminatory anti-voter bills have been introduced or enacted to restrict access to the ballot box. Anti-Democratic Forces Threaten Voters’ Rights By mainstreaming conspiracies and threatening election workers, the far-right extremist movement is attempting to destabilize democratic institutions. At the same time, gerrymandering prevents communities of color from achieving fair representation. To Protect Democracy, We Must Engage in Democracy Many voters today feel disengaged from politics, but apathy is not an option. Building an inclusive, multiracial democracy requires active participation from energized and diverse coalitions, who believe in the power of collective action. What We’re Working On Civic Engagement Through public education and direct outreach, we encourage communities of color to register to vote and participate in elections. Voting Rights We advocate for policymakers to advance legislation that would secure and expand access to the ballot box for all U.S. citizens. Redistricting Through litigation, we push back against racial gerrymandering and ensure representational diversity in government. Voter Suppression In court, we challenge discriminatory tactics to disenfranchise voters, such as voter ID laws and voter roll purges. Community Leadership We develop and empower diverse candidates who will champion the needs of their communities in state and local governments. Related Resources Page Voter Intimidation Fact Sheet Toolkit, Guide, or How-To Vote Your Voice Join Our Mailing List Stay connected to the SPLC. Learn about how you can take a more active role in elections, access new publications and community resources, and read the latest updates about our voting rights and civic engagement work. Subscribe Today Latest News Hopewatch Learning for Justice resource explains what presidents do … and your part in it Hopewatch Ballot box barriers: Making elections accessible to all eligible voters Hopewatch In the Face of Impending Challenges, Our Values Offer a Guiding Light'
