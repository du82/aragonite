e of his family members had migrated… February 20, 2025 Ending Unjust Imprisonment Hopewatch A call for justice and compassion: Louisianans must reject Act 3 on March 29 As Louisiana’s policy director for the Southern Poverty Law Center, I work to ensure our state’s policies bring fairness and justice for all, especially the most vulnerable people. But I write this not just as an advocate for civil rights, but as a father. When I think of not only my children, but all children… February 19, 2025 Terry C. Landry Jr. Eliminating Poverty Hopewatch Zora! Festival celebrates culture, preservation wins for historic Black community Every January for more than a quarter century, the Association to Preserve the Eatonville Community (P.E.C.) has called thousands of people together from across the globe to celebrate the extraordinary writer, folklorist and anthropologist Zora Neale Hurston in the place that raised her, the town of Eatonville, Florida — the first self-governing, all-Black municipality in the… February '''
