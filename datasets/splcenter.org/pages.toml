["https://www.splcenter.org/resources/hope-watch/learning-for-justice-resource-explains-what-presidents-do"]
title = "Learning for Justice resource explains what presidents do"
description = "A recent entry in the Civics for Democracy series teaches how the U.S. Constitution limits an administration's attempts to centralize power."
full_description = "Hopewatch Learning for Justice resource explains what presidents do … and your part in it February 7, 2025 Share (Open dialog with sharing options) Share Options: Facebook (Opens in a new tab) Threads (Opens in a new tab) LinkedIn (Opens in a new tab) Copy Link The flurry of executive orders, lawsuits, rescinded orders and information overload that has marked the first two weeks of the second Trump administration has been staggering. It’s easy to become overwhelmed. However, the Southern Poverty Law Center’s Learning for Justice program is offering the Civics for Democracy series to develop the civic knowledge and skills necessary for such a moment. One recent entry is a biggie given the events since it published on Jan. 20: The Roles and Responsibilities of the President. In case you haven’t noticed, this presidency is not like others. Many people are speaking openly about the danger of American democracy being trampled under the weight of the administration’s attempts to centralize power in an imperial executive. So, it is important to understand exactly what the U.S. Constitution says the president can — and can’t — do. “The president is the elected leader of the entire U.S. and must serve all who live here — not merely one constituency,” the overview reads in a section on checking the president’s power. “They are responsible to everyone, and we have the reciprocal responsibility of holding the president accountable for everyone’s well-being.” The most important part of the series is the suggestions for readers to evaluate and react to the president’s performance. Beyond laying out the duties and citing what elected officials should do, the series offers concrete steps that people can take to determine the president’s ability to fulfill the responsibilities of the office. And, if the president isn’t fulfilling those responsibilities, there are specific ideas about how to insist on accountability. Aside from the most essential act — casting your vote — suggestions include meeting your representatives at public events or writing to them to express your thoughts. Or you can write editorial pieces to submit to your local or regional news outlets. On an even more granular level, discuss what you see with those in your immediate circle, whether it be family or friends, and make your case. “We must also insist on accountability for our state representatives in Congress and those at all levels of government,” the piece concludes. “By staying informed of current events, voting, and being engaged in your community, you can help to make your voice heard and push society in the direction that provides justice for all.” You can read the full story at learningforjustice.org here. Image at top: A resource from the SPLC’s Learning for Justice program offers suggestions for readers to evaluate and react to the president’s performance. (Collage by the SPLC)"
