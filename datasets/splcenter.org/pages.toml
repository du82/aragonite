full_description = "Class Action Lawsuits Class action lawsuits are one tool the Southern Poverty Law Center uses to bring systemic change. By filing lawsuits on behalf of an entire class of plaintiffs, the SPLC can ensure that its successful litigation has far-reaching effects, potentially benefiting entire communities, rather than only a few individuals. Throughout its history, the SPLC has used such lawsuits while pursuing its mission as a catalyst for racial justice in the South and beyond, working in partnership with communities to dismantle white supremacy, strengthen intersectional movements, and advance the human rights of all people. The following is a list of active class action lawsuits filed by the SPLC. Class Certified Calogero et al. v. Shows, Cali & Walsh LLP Settlement notice. Antonio-Benito v. Lowry Farms, Inc. Gayle, et al. v. Meade, et al. Settlement agreement. Jonathan Singleton, et al. v. City of Montgomery, Alabama, et al. A.A., et al., v. Abraham, et al. Formerly known as A.A., et al v. Phillips et al. Notice of class action. La. mental health lawsuit request form. Heredia Mons, et al. v. McAleenan, et al. JECM, et al. v. Lloyd, et al. Formerly known as JECM, et al. v. Jonathan Hayes, et al. Dennis Hopkins, et al. v. Secretary of State Michael Watson Al Otro Lado Inc., et al. v. Mayorkas, et al. Class notice. Kandace Kay Edwards, et al. v. David Cofield, et al. Braggs, et al. v. Jefferson Dunn, et al. P.B., et al. v. Brumley Originally P.B. v. Pastorek. Putative Pending class certification. Alex A. v. Edwards C.C. v. Buckner Immigrant Defenders Law Center v. Mayorkas Jerome Morgan, et al. v. Blair’s Bail Bonds, Inc., et al. Wilhen Hill Barrientos, et al., v. CoreCivic, Inc. Hester, et al. v. Gentry, et al."
