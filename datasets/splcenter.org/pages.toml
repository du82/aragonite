ary 25, 2025 Eliminating Poverty Press New SPLC Report Illustrates Predatory Policing Practice Impacting Black Alabamians MONTGOMERY, Ala. — Today, the Southern Poverty Law Center (SPLC) released a new report detailing the racial disparities within Alabama’s civil asset forfeiture process. The report, Ending Business as Usual: The Need for Alabama Civil Asset Forfeiture Data Transparency, highlights the damaging impact the procedure has on Alabamians and specifically highlights evidence of racial harm… February 12, 2025 Strengthening Democracy & Voting Rights Press SPLC Raises Concerns About Linda McMahon’s Qualifications and Record for Education Secretary MONTGOMERY, Ala. — Earlier this year, President Trump nominated Linda McMahon to head the Department of Education (DOE), a critical agency that he has repeatedly called to dismantle. And in anticipation of McMahon’s confirmation hearing, the Southern Poverty Law Center (SPLC) expresses significant concerns about her commitment to fulfill the responsibilities of this position and… February 11, 2025 Eliminating Poverty Press SPLC Will Not Appeal Florida Court’s Recent Ruling on Hungerford Property Litigation ORLANDO, Fla. — The Southern Poverty Law Center (SPLC) on behalf of plaintiffs, the Association to Preserve the Eatonville Community (P.E.C.) and Hungerford descendant Bea Leach Hatler, will not appeal the court’s decision in Association to Preserve the Eatonville Community, Inc. vs. School Board of Orange County, Fla. A recent ruling by the Ninth Judicial… February 7, 2025 Strengthening Democracy & Voting Rights Press SPLC Applauds Removal of ‘Make America Great Again’ Inscribed on Bloody Sunday Billboard MONTGOMERY, Ala. — Today, the Southern Poverty Law Center (SPLC) celebrates the removal of a political billboard featuring the iconic Spider Martin photo capturing the 1965 demonstration in Selma known as Bloody Sunday. The words “Make America Great Again” were emblazoned across the image, aiming to comment on the current political climate by drawing parallels… January 31, 2025 Strengthening Democracy & Voting Rights Press SPLC Deeply Concerned About Robert F. Kennedy’s Record on Health and Human Services MONTGOMERY, Ala. — The Southern Poverty Law Center is deeply concerned about the nomination of Robert F. Kennedy Jr. As the Senate Committee on Finance continues the confirmation hearing for this nominee to lead the U.S. Department of Health and Human Services (HHS), the SPLC urges Senators to consider the implications for the nation’s health and… January 30, 2025 Strengthening Democracy & Voting Rights Press SPLC Concerned About Brooke Rollins’ Nomination to Lead the United States Department of Agriculture MONTGOMERY, Ala. — Yesterday, the Senate Agriculture, Nutrition and Forestry Committee held its hearing to consider the nomination of Brooke Rollins to lead the U.S. Department of Agriculture (USDA). “The USDA plays a vital role in shaping agricultural policies that address the needs of both Americans and people around the world, ensuring these policies are… January 24, 2025 Eliminating Poverty Employment and Wage Equity Press SPLC: Trump Rolls Back Six Decades of Workplace Discrimination Protections in Latest Effort to Dismantle Hard-Won Civil Rights Gains MONTGOMERY, Ala. — Yesterday, President Donald Trump launched a new assault on civil rights and efforts to combat workplace discrimination by signing an executive order rescinding Executive Order 11246, originally issued by President Lyndon B. Johnson. The order, in place for 60 years and upheld under 10 different presidents — both Republican and Democrat —… January 23, 2025 1 2 3 … 114 Next Page"
