["https://www.splcenter.org/resources/hope-watch/altadena-black-community-strength"]
title = "Altadena residents draw on Black community strength"
description = "This California town, home to many migrants from the Deep South, has determined to rebuild after the Eaton fire’s destruction."
full_description = "Hopewatch Some traveled west: Altadena residents draw on Black community strength February 20, 2025 Share (Open dialog with sharing options) Share Options: Facebook (Opens in a new tab) Threads (Opens in a new tab) LinkedIn (Opens in a new tab) Copy Link In 1963, my maternal grandfather left his homeland in the Mississippi Delta, fleeing a white mob trying to kill him for fighting to protect his family’s farmland. At the time, my mom was only 9 years old. Instead of fleeing north, he headed west to Pasadena, California, where some of his family members had migrated and settled a few years prior. After living in Pasadena, they eventually convinced their close and extended family to follow them to the beautiful hills and beaches of Southern California. My grandfather did not return to the Mississippi Delta until 2003, 40 years later, for my high school graduation. The families that built their lives during the mid-20th century in Altadena — near Pasadena — were part of a large migration from Southern states like Mississippi, Louisiana and Georgia. Seeking escape from Jim Crow laws and pursuing better opportunities, they established strong neighborhoods, churches and rich cultural traditions that transformed Altadena into a thriving community. When the wildfire swept through Altadena in recent weeks, it devastated a community with deep historical roots. Black families, who made up 31% of the area’s population, bore the brunt of the destruction, with 80% of destroyed homes belonging to Black residents. The fire’s impact went beyond physical destruction. Family heirlooms, photographs and artifacts chronicling generations of migration and settlement were lost to the flames. Many residents, already facing systemic inequities, struggled to file insurance claims and navigate government aid applications. Rising rebuilding costs and gentrification pressures forced some families to consider leaving their beloved community. My grandfather’s younger first cousin, Walter Butler, 83, moved to the area with his family from Shaw, Mississippi, as an infant. Known as “The Jet” when he played football and ran track at Pasadena High School, the one-time Stanford University cornerback and longtime owner of Walt Butler Shoes in northeast Pasadena lost his home in the Eaton fire near Pasadena. As a result of the fire, Butler — my grandfather’s younger first cousin — had his story of triumph appear in all the major news outlets. His determination to rebuild, despite losing his home and prized collection of antique cars, captured the minds and hearts of people all over the world. Churches and community centers became hubs of support, offering shelter, meals and emotional counseling while organizing for equitable recovery resources through his media exposure. The community’s response reflected the same strength that drove their ancestors westward decades ago. Local leaders ensured Black voices were heard in recovery planning, while preservation initiatives captured oral histories and rebuilt landmarks. Though the wildfire left lasting scars, it also revealed the enduring power of collective memory and community bonds, proving that the spirit of Altadena’s Black residents remains unbroken.​​​​​​​​​​​​​​​​ The author of this post requested their name not be used. Image at top: People hug in a neighborhood where a large portion of homes burned in the Eaton fire on Jan. 8, 2025, in Altadena, California. (Credit: David McNew/Getty Images)"
