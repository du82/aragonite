title = "Financial Information"
description = "The Southern Poverty Law Center’s latest financial information and annual report."
full_description = "About Financial Information The Southern Poverty Law Center’s latest financial information and annual report. The Southern Poverty Law Center is a tax-exempt, charitable organization incorporated in 1971 under section 501(c)(3) of the Internal Revenue Code. All contributions, grants and bequests are tax deductible. Our tax identification number is 63-0598743. The SPLC’s work is supported primarily through donor contributions. No government funds are received or used for its efforts. During its last fiscal year, the SPLC spent approximately 73.9% of its total expenses on program services. At the end of the fiscal year, the SPLC’s endowment — composed primarily of board-designated funds to support future work — stood at $731.9 million. The SPLC is proud of the stewardship of its resources. The annual report reviews our programmatic work from the past year. The Impact Report highlights the SPLC’s work quantitatively. Audited Financial Statement This statement provides our most recent financial information, presented in accordance with generally accepted accounting principles. IRS Form 990 As a 501(c)(3) tax-exempt charitable organization, our annual federal income tax return, IRS form 990, is available for review. IRS letter confirming 501(c)(3) status We are incorporated and are a nonprofit organization under section 501(c)(3) of the Internal Revenue Code. Our tax identification number is 63-0598743. Donations are tax deductible under the rules set out by the IRS."
