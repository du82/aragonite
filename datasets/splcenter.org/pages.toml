full_description = "Stories Search by Keyword Filter by Year All 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 2004 2003 2002 Filter by Issue All Dismantling White Supremacy Eliminating Poverty Ending Unjust Imprisonment Strengthening Democracy & Voting Rights Filter by State All Alabama Florida Georgia Louisiana Mississippi Submit Clear Showing results 1-10 of 2893 Dismantling White Supremacy Story Alabama artist, activist takes on maternal mortality crisis facing Black women Two years ago, Michelle Browder converted a camper van into a mobile medical resource center for pregnant women. She equipped the van with medical supplies to check vital signs, blood pressure and glucose levels, as well as information on health and nutrition. A local artist, entrepreneur and activist, Browder and her team hit the road,… February 28, 2025 Safiya Charles Dismantling White Supremacy Story Educators calculate their risks in class as states escalate anti-DEI pressure At Miami Norland Senior High School in Miami Gardens, Florida, Renee O’Connor continues to teach students about Ida B. Wells, James Baldwin and The 1619 Project in her African American history class. She does this despite the ban on teaching the Pulitzer Prize-winning reexamination of African American enslavement and legacy in the state’s public schools,… February 21, 2025 Rhonda Sonnenberg Dismantling White Supremacy Story How Meta’s policy updates could encourage hate and threaten democracy Meta CEO Mark Zuckerberg recently announced significant changes to how the company will moderate its social media content. The changes could have far-reaching and dire effects for democracy and for people who have historically been targeted by online hate, experts and advocates say. Meta, the parent company of Facebook, Instagram, Threads and WhatsApp, revised its… January 24, 2025 Lindsey Shelton Strengthening Democracy & Voting Rights Story Advocates fight for voting ri