nces to suicide, sexual assault, and rape. Reader discretion is advised. Misogynist incels are a male supremacist movement of heterosexual men who believe they are entitled to sex with attractive women, but that feminism and women’s supposed inherent selfishness have denied them of this right. Men going their own way (MGTOW) Men going their own way (MGTOW) is a separatist male supremacist movement of heterosexual men who have chosen to remove themselves from the perceived toxicity of women. Michael Flynn Once a respected military intelligence leader, Michael Flynn has become a major force in spreading anti-democratic and anti-Muslim conspiracy theories. He argued for martial law in the wake of the 2020 presidential election, and he’s worked with militias. Gays Against Groomers Gays Against Groomers is a chapter-based organization that amplifies dehumanizing anti-trans rhetoric, perpetuates anti-LGBTQ+ stereotypes by falsely claiming that LGBTQ+ supporters of trans rights are dangerous to society – including equating gender-affirming health care with pedophilia and calling trans people a “bloodthirsty terrorist cult.” It directs online harassment and intimidation campaigns targeting LGBTQ+ people and… Chaya Raichik Chaya Raichik is the founder of the social media account @LibsofTikTok (LTT) who helped revive in right-wing propaganda the anti-LGBTQ+ “groomer” slur, which implies that all LGBTQ+ people are pedophiles. She spreads the anti-LGBTQ+ conspiracy theory that “groomers” have infiltrated every social institution with the intent of “sexualizing” children. Under the LTT pseudonym, Raichik originally… Faith Education Commerce Faith Education Commerce, also known as FEC United, is an antigovernment group with its own militia that uses violent rhetoric when talking about public officials, propagates conspiracy theories and hosts and participates in activities related to disinformation and anti-democracy. Tucker Carlson Tucker Carlson is a veteran television personality who emerged in 2016 as one of the most influential figures of the authoritarian, anti-democracy, right-wing movement that rose to prominence around the political career of former President Donald J. Trump. Carlson’s propaganda, which obsessively portrays white men as being victims of a corrupt, feminist, multicultural system, often… 1 2 3 … 25 Next Page"
