["https://www.splcenter.org/civil-rights-memorial"]
title = "Civil Rights Memorial Center"
description = "Alabama‘s Premiere Civil Rights Site Known as the birthplace of the civil rights movement, the city of Montgomery is rich with civil rights history, and no tour of Alabama’s capital would be complete without a visit to the Civil Rights Memorial Center (CRMC). A project of the Southern Poverty Law Center (SPLC), it is one […]"
full_description = "Alabama‘s Premiere Civil Rights Site Known as the birthplace of the civil rights movement, the city of Montgomery is rich with civil rights history, and no tour of Alabama’s capital would be complete without a visit to the Civil Rights Memorial Center (CRMC). A project of the Southern Poverty Law Center (SPLC), it is one of Alabama’s premiere civil rights sites and serves as the interpretive center for the Civil Rights Memorial, which honors the martyrs of the movement and inspires visitors to continue the march for racial equity and social justice. Plan Your Visit Experience The Martyr Room Inside the Martyr Room, visitors will learn about the 40 people whose names are inscribed on the Civil Rights Memorial. Apathy is not an Option The Orientation Theater connects the civil rights movement of the 1950s and 1960s to social justice activism today. The March Continues The power of grassroots organizing and mobilization helps us understand that ordinary people can make a difference. Wall of Justice A space for reflection and a testament to people, past and present, who are committed to making manifest the ideals of justice, equity, diversity and inclusion for all. History of the CRMC Why Montgomery? A project of the Southern Poverty Law Center (SPLC), it is one of Alabama’s premiere civil rights sites and serves as the interpretive center for the Civil Rights Memorial, which honors the martyrs of the movement and inspires visitors to continue the march for racial equity and social justice. The CRMC and the Memorial are located just around the corner from the historic church where Martin Luther King Jr. served as pastor during the Montgomery Bus Boycott and the Alabama Capitol steps, where King spoke to thousands at the conclusion of the Selma-to-Montgomery voting rights march. Designed by Maya Lin The Memorial, dedicated in 1989, was designed by Maya Lin, who found inspiration in the paraphrase from Amos 5:24 that King used in his “I Have a Dream” speech: “We will not be satisfied until justice rolls down like waters and righteousness like a mighty stream.” On the Memorial’s circular, black granite table, water emerges from the center and flows evenly across a timeline, reminiscent of a sundial, that chronicles the major events of the movement and records the names of 40 men, women and children who were killed during the struggle. Behind the table, a thin sheet of water flows down a 40-foot-long curved, black granite wall on which the words “until justice rolls down like waters and righteousness like a mighty stream” are inscribed. The Memorial sits across the street from the SPLC’s office building, in an open plaza accessible to visitors 24 hours a day, every day of the week. Download the CRMC App Become your own guide to the CRMC and download this immersive and interactive virtual tour on your iOS or Android phone or tablet. Download Now Take Action: Remove Confederate Symbols Confederate monuments and symbols continue to display a legacy of racism and division. Help us identify and remove these relics from public spaces, promoting unity and justice for all communities. Take Action"
year_published = 2025
year_updated = 2025
