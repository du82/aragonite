nvisions for its offices in Atlanta, the Southern Poverty Law Center is taking a community first approach. Who better than someone who has spent two decades doing just that? To bring to reality its dream of a vibrant office campus that will help… December 13, 2024 Esther Schrader Ending Unjust Imprisonment Story Mother, son fight back against discriminatory school discipline in Georgia E.C. turned 15 last September. He wasn’t at school, where he always celebrated his birthday with friends and ate pizza and cupcakes that his mother brought. Instead, he was at home in Georgia, isolated from his schoolmates and forced to take virtual learning during a nearly six-month punishment meted out by the Walton County, Georgia,… November 27, 2024 Rhonda Sonnenberg Strengthening Democracy & Voting Rights Story First-time voters at historically Black Alabama university react to Trump’s win On the night of the presidential election, Kayla McCray felt anxious. The contest between former President Donald Trump and Vice President Kamala Harris was the first federal election in which the 20-year-old Alabama State University (ASU) student had ever voted. The historically Black university (HBCU) was holding a watch party on campus. McCray peeked in… November 22, 2024 1 2 3 … 290 Next Page"
