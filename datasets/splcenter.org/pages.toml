title = "SPLC | Apathy Is Not An Option"
description = "We are starting a movement in the South that will inspire change nationwide. Throughout history, the South has been a place of resilience, strength and transformation. Our mission begins here. When we empower communities, we lay the groundwork for a national movement that uplifts all people and drives meaningful progress for future generations. Join us as we create a future where justice, equality and opportunity are available to all."
full_description = "Landmark Cases Offering legal advocacy that protects vulnerable communities and promotes equality across the nation. Inspiring Hope Pursuing every person’s opportunity to live with dignity, free from discrimination and oppression. Tracking Hate Monitoring over 1,500 active extremist groups and dismantling their influence — promoting safety and justice nationwide. Play/Pause Video This video has no sound. Apathy Is Not An Option Stand up, take action, and fight for a future built on justice, equality and democracy. Join the fight by signing up for updates Go function handleSelectAndGoSubmit(event) { event.preventDefault(); const select = document.getElementById('select-and-go__options'); const selectedOption = select.options[select.selectedIndex]; const permalink = selectedOption.getAttribute('data-permalink'); if (permalink) { window.location.href = permalink; } return false; } We Fight for Racial Justice Issues Strengthening Democracy & Voting Rights Dismantling White Supremacy Ending Unjust Imprisonment Eliminating Poverty and Economic Inequality First the South, then the Nation We are starting a movement in the South that will inspire change nationwide. Throughout history, the South has been a place of resilience, strength and transformation. Our mission begins here. When we empower communities, we lay the groundwork for a national movement that uplifts all people and drives meaningful progress for future generations. Join us as we create a future where justice, equality and opportunity are available to all. Alabama Florida Georgia Louisiana Mississippi National Impact Landmark Cases Offering legal advocacy that protects vulnerable communities and promotes equality across the nation. Inspiring Hope Pursuing every person’s opportunity to live with dignity, free from discrimination and oppression. Tracking Hate Monitoring over 1,500 active extremist groups and dismantling their influence — promoting safety and justice nationwide. The Latest Hopewatch Some traveled west: Altadena residents draw on Black community strength February 20, 2025 Hopewatch Learning for Justice resource explains what presidents do … and your part in it February 7, 2025 Hopewatch Black church’s win against Proud Boys offers hope in the fight against racism February 6, 2025 Brad Bennett Hopewatch Why is it wrong to teach students about diversity, equity and inclusion? January 31, 2025 Diana Bradford Stay Informed In 2023, Georgia enacted a law that forces cities and other localities to enforce bans on public camping, putting thousands of Georgians living unsheltered at risk of arrest. Learn how the criminalization of those experiencing homelessness ensnares people in a cycle of recidivism. Read Our Report"
