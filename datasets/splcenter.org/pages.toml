full_description = '''Apathy Is Not An Option A Podcast for Change Listen on Apple Podcasts RSS Spotify YouTube Or wherever you get your podcasts. At the Southern Poverty Law Center, we fight for racial justice in the courts, in our communities, and in the conversations we spark, the stories we amplify, and the voices we elevate. Apathy Is Not An Option is a new podcast about voting rights, fighting hate and extremism, ending mass incarceration of Black and Brown people, and economic justice. Hosted by Alex Beightol, a social media influencer committed to justice, this podcast delivers raw, unfiltered conversations with activists, thought leaders, and everyday people fighting for change in the South and beyond. Now is the time. The movement is here. Be part of it. Latest Episode Apathy Is Not An Option Latest Episode .iframe-container { display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; } iframe { max-width: 800px; width: 100%; } All Episodes //---------------------------------------------------------- //------ JAVASCRIPT HOOK FUNCTIONS FOR GRAVITY FORMS ------- //---------------------------------------------------------- if ( ! gform ) { document.addEventListener( 'gform_main_scripts_loaded', function() { gform.scriptsLoaded = true; } ); document.addEventListener( 'gform/theme/scripts_loaded', function() { gform.themeScriptsLoaded = true; } ); window.addEventListener( 'DOMContentLoaded', function() { gform.domLoaded = true; } ); var gform = { domLoaded: false, scriptsLoaded: false, themeScriptsLoaded: false, isFormEditor: () => typeof InitializeEditor === 'function', /** * @deprecated 2.9 the use of initializeOnLoaded in the form editor context is deprecated. * @remove-in 3.1 this function will not check for gform.isFormEditor(). */ callIfLoaded: function ( fn ) { if ( gform.domLoaded && gform.scriptsLoaded && ( gform.themeScriptsLoaded || gform.isFormEditor() ) ) { if ( gform.isFormEditor() ) { console.warn( 'The use of gform.initializeOnLoaded() is deprecated in the form editor context and will be removed in Gravity Forms 3.1.' ); } fn(); return true; } return false; }, /** * Call a function when all scripts are loaded * * @param function fn the callback function to call when all scripts are loaded * * @returns void */ initializeOnLoaded: function( fn ) { if ( ! gform.callIfLoaded( fn ) ) { document.addEventListener( 'gform_main_scripts_loaded', () => { gform.scriptsLoaded = true; gform.callIfLoaded( fn ); } ); document.addEventListener( 'gform/theme/scripts_loaded', () => { gform.themeScriptsLoaded = true; gform.callIfLoaded( fn ); } ); window.addEventListener( 'DOMContentLoaded', () => { gform.domLoaded = true; gform.callIfLoaded( fn ); } ); } }, hooks: { action: {}, filter: {} }, addAction: function( action, callable, priority, tag ) { gform.addHook( 'action', action, callable, priority, tag ); }, addFilter: function( action, callable, priority, tag ) { gform.addHook( 'filter', action, callable, priority, tag ); }, doAction: function( action ) { gform.doHook( 'action', action, arguments ); }, applyFilters: function( action ) { return gform.doHook( 'filter', action, arguments ); }, removeAction: function( action, tag ) { gform.removeHook( 'action', action, tag ); }, removeFilter: function( action, priority, tag ) { gform.removeHook( 'filter', action, priority, tag ); }, addHook: function( hookType, action, callable, priority, tag ) { if ( undefined == gform.hooks[hookType][action] ) { gform.hooks[hookType][action] = []; } var hooks = gform.hooks[hookType][action]; if ( undefined == tag ) { tag = action + '_' + hooks.length; } if( priority == undefined ){ priority = 10; } gform.hooks[hookType][action].push( { tag:tag, callable:callable, priority:priority } ); }, doHook: function( hookType, action, args ) { // splice args from object into array and remove first index which is the hook name args = Array.prototype.slice.call(args, 1); if ( undefined != gform.hooks[hookType][action] ) { var hooks = gform.hooks[hookType][action], hook; //sort by priority hooks.sort(function(a,b){return a["priority"]-b["priority"]}); hooks.forEach( function( hookItem ) { hook = hookItem.callable; if(typeof hook != 'function') hook = window[hook]; if ( 'action' == hookType ) { hook.apply(null, args); } else { args[0] = hook.apply(null, args); } } ); } if ( 'filter'==hookType ) { return args[0]; } }, removeHook: function( hookType, action, priority, tag ) { if ( undefined != gform.hooks[hookType][action] ) { var hooks = gform.hooks[hookType][action]; hooks = hooks.filter( function(hook, index, arr) { var removeHook = (undefined==tag||tag==hook.tag) && (undefined==priority||priority==hook.priority); return !removeHook; } ); gform.hooks[hookType][action] = hooks; } } }; } Apathy Is Not An Option Podcast Player .iframe-container { display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; } iframe { max-width: 800px; width: 100%; }'''
