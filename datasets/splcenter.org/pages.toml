title = "Dismantling White Supremacy"
description = "In public forums and online, the SPLC exposes hate and extremism and counters disinformation and conspiracies with research and community resources."
full_description = 'Language: English Español document.getElementById( "lang_choice_1" ).addEventListener( "change", function ( event ) { location.href = event.currentTarget.value; } ) Racial Justice Issues Dismantling White Supremacy In public forums and online, the Southern Poverty Law Center exposes hate and extremism and counters disinformation and conspiracies with research and community resources. A Complex Problem We Can Conquer. Hate Violence is on the Rise The number of hate-based crimes continues to increase each year, with individuals being targeted for their race, religion, sexual orientation, gender identity and more. However, incomplete data does not capture the true severity of the problem. The Far Right Fuels Extremism More than 1,500 hard-right extremist groups operate across the country, pushing white supremacy, white Christian nationalism, antigovernment sentiment, antisemitism and other dangerous ideologies. Eradicating Hate Starts with Communities To push white supremacy out of the mainstream and remedy the harm done to communities, we must intervene proactively by supporting grassroots partners and building resilience to extremism. What We’re Working On Litigation Using federal, state and local laws, we bring lawsuits against hate and extremist groups to cripple their operations. Research and Analysis Through our Intelligence Project, we monitor and expose white supremacists with ties to hate groups. Public Awareness We unmask companies that support or platform extremists, and pressure them to end relationships through boycotts. DEI Advocacy In court, we combat attacks on DEI policies, while advancing community-driven solutions for racial justice. Community Education We promote and incentivize the teaching of accurate U.S. history across racial and ethnic groups. Related Resources Toolkit, Guide, or How-To The Year in Hate and Extremism 2023 Toolkit, Guide, or How-To Combating Anti-LGBTQ+ Pseudoscience Toolkit, Guide, or How-To Preventing Youth Radicalization: Building Resilient, Inclusive Communities Join Our Mailing List Learn about how you can address hate and extremism in your community, access new SPLC publications and community resources, and read the latest updates about our legal and community organizing work. Stay connected to the SPLC by signing up for our mailing list. Subscribe Today Latest News Hatewatch Ku Klux Klan flyers are last cries of a dying organization in Kentucky Hatewatch National Guard investigates unconstitutional county militia leaders in Virginia Hatewatch Jewish people must retain agency over their stories, identity and narratives'
