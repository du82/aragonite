nd sexuality-based disinformation and extremist manipulation. The network of adults who care for and support young people in their homes and schools and throughout their communities play pivotal roles in helping them build resilience against such manipulation. Not Just a Joke: Understanding & Preventing Gender- & Sexuality-Based Bigotry helps… December 10, 2024 Ending Unjust Imprisonment Report Georgia’s youth legal system overemphasizes punishment In 2022, The Atlanta Journal-Constitution reported that three teenagers died within weeks of each other in Georgia’s youth detention facilities – one after participating in a “fight game” in front of a correctional officer – drawing scrutiny to how incarcerated youth in Georgia are treated. However, these reports of abuse told a troublesome narrative of… December 3, 2024 Dismantling White Supremacy Report Hate Crimes, Explained The starting point for understanding hate crimes and their impact is to recognize that criminal activity motivated by bias is different from other criminal conduct. First, these crimes occur because of the perpetrator’s bias or animus against the victim on the basis of actual or perceived status. The victim’s race, religion, ethnicity, gender, gender identity,… October 1, 2024 Eliminating Poverty Quality Education Report The State of Special Education in Mississippi Mississippi’s education system has consistently ranked at or near the bottom nationally due to chronic underfunding as well as systemic issues of poverty and racial injustice that are rooted in the legacy of chattel slavery and oppression. Mississippi’s special education system, which is meant to provide a Free and Appropriate Public Education (FAPE) to children… September 30, 2024 Dismantling White Supremacy Report Mississippi State of the State Mississippi has consistently been at the forefront of radical shifts, serving as ground zero in the struggle for democracy and freedom from its start. The Civil Rights Movement in Mississippi h