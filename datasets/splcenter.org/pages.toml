["https://www.splcenter.org/privacy-policy-terms"]
title = "Privacy Policy & Terms"
description = "Skip to Terms & Conditions This Privacy Policy sets forth the practices in effect at the Southern Poverty Law Center to protect the privacy of its website visitors and financial supporters, as well as recipients of its print publications. This Policy also outlines how you can update your information or receive additional information. Protecting your […]"
full_description = "Privacy Policy & Terms Skip to Terms & Conditions This Privacy Policy sets forth the practices in effect at the Southern Poverty Law Center to protect the privacy of its website visitors and financial supporters, as well as recipients of its print publications. This Policy also outlines how you can update your information or receive additional information. Protecting your information The SPLC uses electronic security systems to protect any records containing personal identifying information and limits the number of people who have access to such information. Business partners with whom the SPLC may share personal information during the course of usual business must abide by confidentiality agreements, which forbid the disclosure of any personal identifying information to additional parties. Online Giving The SPLC’s online donation process occurs in a secure portion of the SPLCenter.org website. Submissions are encrypted and secure from outside users via Secure Sockets Layer (SSL) software, the industry standard for secure online transactions. All personal information – including credit card number, name, and address – is encrypted so it cannot be read as it travels over the Internet. The SPLC wants you to have positive experiences at its websites – SPLCenter.org and LearningForJustice.org – and to understand your privacy rights while on its websites. If you do not agree with the terms outlined below, do not access the SPLC’s websites. Non-Personal Identifying Information The SPLC collects and uses non-personal identifying information, including IP addresses and web server log files. It also uses “cookies,” small pieces of information used to identify individual computers accessing a website. The SPLC uses this information only in the aggregate. It does not combine non-personal identifying information with personal identifying information, commonly known as “online profiling.” At no time is personal information stored in a cookie. The SPLC collects non-personal identifying information from websites in the aggregate. It uses this information to assess aggregate visitor volume and interest, i.e. which site pages are being visited most frequently. The SPLC shares aggregated, non-identifying, demographic information about the websites’ usage with its sponsors and partners. For example, the SPLC might disclose to its donors that 1,000,000 people visited SPLCenter.org in a given year. Personal Identifying Information If you voluntarily provide personal identifying information (such as a first and last name, physical address including a street name, e-mail address, etc.) through online forms, the SPLC will collect and retain this information. The personal identifying information will be used to establish the identity of account holders in order to respond to inquiries or to deliver requested information or services. For example, if you subscribe to one of the SPLC’s e-newsletters, the SPLC will store your name and e-mail address and send the requested e-newsletters to the e-mail address. The SPLC does not make personal identifying information gathered on its websites available to other organizations, but may share information with business partners, in the usual course of business. For example, the SPLC may use a third-party vendor to electronically distribute its e-newsletters. In order to send the e-newsletters, the SPLC must share the e-mail address of subscribers with the vendor. Vendors that provide such services are obligated only to use this information for the purposes for which the SPLC directs them to use it; namely, providing services directly for the SPLC. No mobile information will be shared with third parties/affiliates for marketing/promotional purposes. All the above categories exclude text messaging originator opt-in data and consent; this information will not be shared with any third parties. Protecting Children’s Privacy On web pages that are directed toward children under the age of 13, the SPLC limits its collection of information to non-personal identifying information, such as first name, grade, hometown and state, in an effort to comply voluntarily with the Children’s Online Privacy Protection Act. The SPLC does not knowingly collect and retain personal identifying information from persons under the age of 13 and has safeguards in place to attempt to ensure it does not inadvertently collect and retain such information. The SPLC strongly urges children to check with their parents before entering information on its websites, and it urges parents to discuss with their children restrictions concerning the online release of personal identifying information to anyone they do not know. Links This policy applies only to the SPLCenter.org and LearningForJustice.org domains. The SPLC does not control the privacy policies of other websites to which the SPLC might link. The Southern Poverty Law Center is committed to maintaining the confidence and trust of its financial supporters. The SPLC collects the personal information that supporters provide. After someone donates to the SPLC, his or her information is added to the SPLC’s membership list. The SPLC uses this information to keep donors informed about the progress of its programs through print and online mailings and to encourage donors’ continued financial support of its work. The SPLC shares donor information with business partners as required in the usual course of business. For example, the SPLC may use a vendor to assist in the generation and distribution of written communications to donors. The SPLC makes its membership list available to reputable charities and businesses whose information we believe may be of interest to our members. Our ability to share your name with other entities will help build our supporter base. Sharing our list with others is the most cost-efficient way to find new supporters. We hope you agree. The option is yours. If you do not want your name used in this fashion, please let us know. You may contact us via this website by using our contact form. Please include your full name and address with your request. As part of its public service, the SPLC publishes and distributes magazines, handbooks and multimedia kits to help equip teachers, human rights workers, law enforcement and others with tools and resources to promote tolerance in their communities. This portion of the Privacy Policy outlines the SPLC’s privacy practices that relate to people who receive those products. In order to receive SPLC products, an individual must provide personal identifying information (such as a first and last name, physical address including a street name, e-mail address, etc.) The SPLC will collect and retain this information. The SPLC does not make the personal identifying information of people who order its products available to other organizations. The personal identifying information is used to establish the identity of recipients, deliver requested products to recipients and make recipients aware of additional or new SPLC products that might interest them. In order to evaluate the usefulness of its materials, the SPLC may also contact, by phone, e-mail or regular mail, persons who have ordered its products. The SPLC may share information with business partners in the usual course of business. For example, the Center may use a vendor to help distribute products. The SPLC does not disclose individual order histories, but may disclose aggregated order histories for its products. For example, the SPLC would not disclose that “John Doe ordered a copy of this magazine”, but could disclose that 300,000 copies of that magazine were ordered. For more information, contact: Privacy Coordinator Southern Poverty Law Center 400 Washington Avenue Montgomery, AL 36104 In the event that this Privacy Policy changes, the SPLC will post an updated policy on this page. Terms & Conditions This User Agreement governs the use of the Southern Poverty Law Center’s (“SPLC”) websites (the “Websites”) and is binding on all persons, entities, or computer programs that access the Websites (the “Users”). Please read this User Agreement carefully. You can access this User Agreement any time in the footer of the splcenter.org home page. Your access, visitation and/or use of the Websites will constitute your agreement to this User Agreement. If you do not agree with the terms and conditions of this User Agreement, you may not access, visit and/or use the Websites. The User Agreement may be modified from time to time; the date of the most recent revisions will appear on this page, so check back often. Continued access of the Websites by you will constitute your acceptance of any changes or revisions to the User Agreement. User-Generated Content AND USER RESPONSIBILITIES Some areas of the Websites allow Users to post content such as comments, questions, and other content or information (“User-Generated Content”). The SPLC uses Disqus as its vendor to provide a platform for User-Generated Content on the Websites. Any User-Generated Content available on the Websites is hosted on one of Disqus’s websites and in turn embedded on the Websites. Users posting via Disqus’s platform are subject to Disqus’s Terms of Service available at http://help.disqus.com/customer/portal/articles/466260-terms-of-service. In addition to this User Agreement, you agree that any User-Generated Content that you post on the Websites is governed by and will abide by the Terms of Service provided by Disqus. In the event that Disqus’s Terms of Service conflict with this User Agreement, this User Agreement prevails in governing the relationship between You and the SPLC. Additionally, you agree not to engage in any of the following prohibited activities or behaviors: impersonate, imitate or pretend to be somebody else, by setting up different accounts/profiles, or falsely state, represent, or imply any affiliation, association, or connection with a person or entity when using the Websites; post, upload, transmit, send or otherwise make available on or through the Websites any content that constitutes junk mail, spam, pyramid schemes, chain letters, phishing, advertising, and/or commercial offers; use any language that is, or post, upload, transmit, send or otherwise make available on or through the Websites any User-Generated Content about a person or group that is violent or that victimizes, degrades, defiles or disparages any person or group based on race, color, religion, national origin, ancestry, citizenship status, physical or mental disability, sex, sexual orientation, gender identity and expression, age, medical condition, or veteran status or otherwise engage in what we deem to be racism, sexism, ageism, religious intolerance, bigotry, ethnic slurs, or homophobia; use any language, or post, upload, transmit, send or otherwise make available on or through the Websites any User-Generated Content that may or is intended to enable, authorize, instruct, encourage, assist, suggest, or promote activities that incite violence, constitute a criminal offense, give rise to civil liability, or otherwise violate any local, state, federal, provincial, national, international, or foreign law, rule or regulation, including without limitation libel, child pornography, fraud, or invasion of privacy; stalk others on or through the Websites, or using information obtained on or through the Websites; disrupt, overwhelm, attack, hack, destroy, damage, disable, impair, repossess, alter, tamper or interfere with the Websites, including without limitation any content, communications, messaging, programming, hardware, functionality, or features on our networks, servers or databases, or impede or interfere with others’ access, visitation, and/or use of the Websites, in any way or by any means, whether remotely or by access to our personal property, premises, or otherwise, including, without limitation, by using administrator passwords or by masquerading as an administrator while using the Websites or otherwise; or post, upload, transmit, send or otherwise make available on or through the Websites any software disabling devices, time bombs, Trojan horses, cancelbots, viruses, worms, bugs, corrupted files, spyware, adware, malware, malicious programs or code, or devices or defects of similar nature. CAUTION: ANY ATTEMPT TO DO ANY OF THE FOREGOING PROHIBITED ACTS, OR TO OTHERWISE UNDERMINE THE OPERATION OF THE WEBSITES, MAY BE A VIOLATION OF CRIMINAL AND CIVIL LAW. SHOULD SUCH AN ATTEMPT BE MADE, WE RESERVE THE RIGHT, IN ADDITION TO OUR OTHER REMEDIES, TO SEEK DAMAGES (INCLUDING WITHOUT LIMITATION ATTORNEYS’ FEES) FROM ANY SUCH INDIVIDUAL OR ENTITY TO THE FULLEST EXTENT PERMITTED BY LAW, INCLUDING CRIMINAL PROSECUTION. Copyright Policy Reporting Claims of Copyright Infringement We take claims of copyright infringement seriously. The copyright policy applicable to User-Generated Content is available through SPLC’s vendor, Disqus, at http://help.disqus.com/customer/portal/articles/466260-terms-of-service. As stated in Disqus’s policies, if you believe any User-Generated Content on the Websites infringe your copyright, you may request removal of those materials (or access thereto) from the Websites by submitting written notification to Disqus in accordance with the Online Copyright Infringement Liability Limitation Act of the Digital Millennium Copyright Act (17 U.S.C. § 512) (“DMCA”). The procedures for submitting a notice to Disqus under the DMCA are outlined in Disqus’s Terms of Service available at http://help.disqus.com/customer/portal/articles/466260-terms-of-service. SPLC assumes no liability for User-Generated Content The SPLC has a right, but not a duty, to monitor, edit, and delete User-Generated Content. SPLC takes no responsibility and assumes no liability for any User-Generated Content that you or any other User or third party posts or sends over the Websites. You shall be solely responsible for your User-Generated Content and the consequences of posting or publishing it, and you agree that we are only acting as a passive conduit for your online distribution and publication of your User-Generated Content. You understand and agree that you may be exposed to User-Generated Content that is inaccurate, objectionable, inappropriate for children, or otherwise unsuited to your purpose, and you agree that SPLC shall not be liable for any damages you allege to incur as a result of content on the Websites, including any User-Generated Content. Monitoring We may monitor activity on the Websites to foster compliance with the User Agreement. You hereby specifically agree to such monitoring. Nevertheless, we do not make any representations, warranties or guarantees that: (1) the Websites, or any portion thereof, will be monitored for accuracy or unacceptable use, (2) apparent statements of fact will be authenticated, or (3) we will take any specific action (or any action at all) in the event of a challenge or dispute regarding comp"
