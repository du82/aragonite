full_description = '''Accessibility Statement for Southern Poverty Law Center Southern Poverty Law Center is committed to providing a website experience that functions for all users regardless of ability, network speed, or device. We are continually improving the user experience for everyone, and applying the relevant accessibility standards. We invite feedback if you have issues accessing any part of www.splcenter.org Site features Each page on the site has a “Skip to Main Content” that’s visible on focus, giving visitors the option of jumping past navigation and into main content. A link to our Accessibility Statement and feedback form is available on each page of the site: at the top of the page on focus, and in the footer. The site navigation has accessible labels, visual hover/focus indicators, and has been tested using keyboard navigation and zoom up to 400% on mobile and desktop. Links have been tested with keyboard navigation and a screen reader. Icon links have accessible labels. Titles, headings, body copy, and other essential elements have been reviewed for 4.5:1 color contrast. An accessible color palette and design guidelines have been created. Care has been taken to apply focus and hover states to interactive elements including the navigation, links and buttons. Pages are structured with semantic elements including headers, navigation, main, and footer to improve site navigation for visitors using screen readers. The navigation, search, Hate Map and several key pages have been manually tested with zoom up to 400%, keyboard navigation, with VoiceOver and with the WAVE tool. The Hate Map was reviewed by people with disabilities using a screen reader and keyboard navigation to test for accuracy and ease of use. We are working to improve our translation capabilities. In the meantime, please feel free to use a third-party tool to assist in this area. Note: This tool is not managed or hosted by SPLC. Conformance status The Web Content Accessibility Guidelines (WCAG) defines requirements for designers and developers to improve accessibility for people with disabilities. It defines three levels of conformance: Level A, Level AA and Level AAA, with AAA as most conformant. www.splcenter.org is partially conformant with WCAG 2.1 level AA, and we are working toward full conformance. Some parts of the content do not fully conform to the accessibility standard. We are reviewing commonly used pages and tools on our site and implementing updates to improve the usability for all. If you encounter something that is not accessible, please let us know so we can better understand how to prioritize this critical work. Feedback We welcome your feedback on the accessibility of www.splcenter.org. Please let us know if you encounter accessibility barriers: Please contact us using the form below We try to respond to feedback within 5 business days. This statement was created on July 13, 2021. #gform_wrapper_18[data-form-index="0"].gform-theme,[data-parent-form="18_0"]{--gf-color-primary: #204ce5;--gf-color-primary-rgb: 32, 76, 229;--gf-color-primary-contrast: #fff;--gf-color-primary-contrast-rgb: 255, 255, 255;--gf-color-primary-darker: #001AB3;--gf-color-primary-lighter: #527EFF;--gf-color-secondary: #fff;--gf-color-secondary-rgb: 255, 255, 255;--gf-color-secondary-contrast: #112337;--gf-color-secondary-contrast-rgb: 17, 35, 55;--gf-color-secondary-darker: #F5F5F5;--gf-color-secondary-lighter: #FFFFFF;--gf-color-out-ctrl-light: rgba(17, 35, 55, 0.1);--gf-color-out-ctrl-light-rgb: 17, 35, 55;--gf-color-out-ctrl-light-darker: rgba(104, 110, 119, 0.35);--gf-color-out-ctrl-light-lighter: #F5F5F5;--gf-color-out-ctrl-dark: #585e6a;--gf-color-out-ctrl-dark-rgb: 88, 94, 106;--gf-color-out-ctrl-dark-darker: #112337;--gf-color-out-ctrl-dark-lighter: rgba(17, 35, 55, 0.65);--gf-color-in-ctrl: #fff;--gf-color-in-ctrl-rgb: 255, 255, 255;--gf-color-in-ctrl-contrast: #112337;--gf-color-in-ctrl-contrast-rgb: 17, 35, 55;--gf-color-in-ctrl-darker: #F5F5F5;