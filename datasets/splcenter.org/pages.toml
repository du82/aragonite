["https://www.splcenter.org/about/our-history"]
title = "Our History"
description = "Offering legal advocacy that protects vulnerable communities and promotes equality across the nation."
full_description = "About Our History A history of protecting society’s most vulnerable. The SPLC was founded in 1971 to ensure that the promise of the civil rights movement became a reality for all. By the late 1960s, the civil rights movement had ushered in the promise of racial equality as new federal laws and decisions by the U.S. Supreme Court ended Jim Crow segregation. But resistance was strong, and these laws had not yet brought the fundamental changes needed in the South. African Americans were still excluded from good jobs, decent housing, public office, a quality education and a range of other opportunities. There were few places for the disenfranchised and the poor to turn for justice. Enthusiasm for the civil rights movement had waned, and few lawyers in the South were willing to take controversial cases to test new civil rights laws. Alabama lawyer and businessman Morris Dees sympathized with the plight of the poor and the powerless. The son of an Alabama farmer, he had witnessed firsthand the devastating consequences of bigotry and racial injustice. Dees decided to sell his successful book publishing business to start a civil rights law practice that would provide a voice for the disenfranchised. “I had made up my mind,” Dees wrote in his autobiography, A Season for Justice. “I would sell the company as soon as possible and specialize in civil rights law. All the things in my life that had brought me to this point, all the pulls and tugs of my conscience, found a singular peace. It did not matter what my neighbors would think, or the judges, the bankers, or even my relatives.” His decision led to the founding of the Southern Poverty Law Center. Early SPLC staff members meet to hear news of a Supreme Court reapportionment ruling. Front: Joe Levin; left to right, Michael Fidlow, first director of fundraising; Jo Brazell, fundraising; Dave Watson, fundraising (drafted fundraising letters); Mamie Goldsmith, worked in mail; Julian Bond; Beverly Hughes; Jackie Alexander, administrative assistant. (Credit: SPLC Report from May 1974) Dees joined forces with another young Montgomery lawyer, Joe Levin. They took pro bono cases few others were willing to pursue – the outcome of which had far-reaching effects. Some of their early lawsuits resulted in the desegregation of recreational facilities, the reapportionment of the Alabama Legislature, the integration of the Alabama state trooper force and reforms in the state prison system. The lawyers formally incorporated the SPLC in 1971, and civil rights activist Julian Bond was named the first president. Dees and Levin began seeking nationwide support for their work. People from across the country responded with generosity, establishing a sound financial base for the new organization. In the decades since its founding, the SPLC shut down some of the nation’s most violent white supremacist groups by winning crushing, multimillion-dollar jury verdicts on behalf of their victims. It dismantled vestiges of Jim Crow, reformed juvenile justice practices, shattered barriers to equality for women, children, the LGBT community and the disabled, protected low-wage immigrant workers from exploitation, and more. In the 1980s, the SPLC began monitoring white supremacist activity amid a resurgence of the Klan and today its Intelligence Project is internationally known for tracking and exposing a wide variety of hate and extremist organizations throughout the United States. In the early 1990s, the SPLC launched its pioneering Teaching Tolerance program (now Learning for Justice) to provide educators with free, anti-bias classroom resources such as classroom documentaries and lesson plans. Today, it reaches millions of schoolchildren with award-winning materials that teach them to respect others and help educators create inclusive, equitable school environments. As the country has grown increasingly diverse, our work has only become more vital. And our history is evidence of an unwavering resolve to promote and protect our nation’s most cherished ideals by standing up for those who have no other champions. SPLC History: 1970s 1970 – A federal court rules that the Montgomery, Ala., YMCA must end its policy of racial discrimination. SPLC co-founder Morris Dees filed the case, Smith v. YMCA, after two black children were turned away from a YMCA summer camp. Julian Bond. (Credit: Getty Images) 1971 – Morris Dees and Joe Levin formally incorporate the SPLC. Julian Bond is named as its first president. 1972 – In Selmont Improvement District et. al. v. Dallas County Commission et. al., the SPLC rectified a 20-year injustice when a federal court ordered the paving of 10 miles of streets in an unincorporated black neighborhood near Selma in Dallas County, Ala. The new streets had to be equal in quality to those installed free in adjacent white neighborhoods in 1954. 1972 – A federal court accepts the SPLC’s reapportionment plan for the Alabama Legislature. It is later affirmed by the U.S. Supreme Court. The plan followed the SPLC’s Nixon v. Brewer lawsuit that claimed blacks were underrepresented. Seventeen black lawmakers are elected to the Alabama Legislature in 1974, the first election after the reapportionment plan is adopted. 1973 – The U.S. Supreme Court rules in the SPLC’s favor in the first successful sex discrimination case against the federal government, Frontiero v. Richardson. It rules the Department of Defense cannot grant certain benefits to dependents of servicemen but not to those of servicewomen. 1973 – The Fifth U.S. Circuit Court of Appeals affirms a ruling banning the use of public recreational facilities by segregated private schools in Gilmore v. City of Montgomery. 1974 – Three SPLC clients – Jesse Walston, Vernon Brown and Bobby Hines – are freed in August 1974 following two years in a North Carolina prison after being wrongfully charged with raping a white woman. The three black men, known as the Tarboro Three, faced death sentences. 1975 – SPLC client Joanne Little, a black inmate accused of murdering a white jail guard in North Carolina, is acquitted of murder. The guard was found dead in her cell without his pants. Little said he had tried to rape her. 1976 – A federal court rules Alabama prisons are “wholly unfit for human habitation” in Pugh v. Locke. SPLC attorneys work for more than a decade to force the state to bring the prisons up to constitutional standards. 1976 – The SPLC starts “Team Defense” to develop trial strategies for capital cases and share them with attorneys across the U.S. at seminars and in SPLC-published manuals. 1977 – The U.S. Supreme Court opens the door for women to be hired for law enforcement jobs traditionally held by men after ruling in favor of the SPLC in Dothard v. Rawlinson. 1977 – An SPLC lawsuit challenging sterilization abuse funded by the federal government is remanded to U.S. District Court for dismissal after federal officials withdraw the regulations challenged in the case, Relf v. Weinberger. SPLC History: 1980s 1980 – The U.S. Supreme Court vacates the convictions of 11 death row inmates in Alabama after affirming the SPLC’s claim in Beck v. Alabama that the state’s death penalty statute is unconstitutional. 1981 – The SPLC creates Klanwatch to monitor Ku Klux Klan activity across the country. It is renamed the Intelligence Project in 1998 after it expands its mission and begins monitoring other hate groups. 1981 – A Klan terror campaign against Vietnamese fishermen in Texas ends and Klan paramilitary training bases are shut down as part of an SPLC lawsuit, Vietnamese Fishermen’s Association v. Knights of the Ku Klux Klan. 1982 – The SPLC wins the release of Johnny Ross, who became the nation’s youngest death row inmate at age 16 after being wrongly convicted of the rape of a white woman in Louisiana in 1975. 1983 – The SPLC wins a financial settlement on behalf of cotton mill workers who contracted brown lung disease, or byssinosis, by inhaling tiny dust particles on a daily basis. Following the case, Wilkins v. Lanier, federal regulations were passed to control the dust exposure and require textile companies to provide regular medical screenings. 1983 – Melted clock from SPLC office 1983 –Klansmen burn the SPLC offices on July 28, 1983. More than a year after the fire, three men are arrested: Tommy Downs and Charles Bailey, members of the Knights of the Ku Klux Klan, and Joe Garner, a national officer of the group. They are charged with arson and possession of explosives. All three plead guilty and are sentenced to prison. 1984 – A paramilitary unit of the Klan is enjoined from operating as a result of an SPLC lawsuit brought on behalf of Alabama citizens against Klan leader Bill Wilkinson and the Invisible Empire Klan. 1984 – Kentucky’s tax system, which had virtually exempted un-mined coal from taxation, is reformed after the SPLC files Nowak v. Foster, providing a boost for public schools. 1985 – A paramilitary Klan group in North Carolina is ordered to stop training and operating. The SPLC brought the case, Person v. Carolina Knights of the KKK, after the group began terrorizing residents. 1987 – The SPLC wins an historic $7 million verdict against the United Klans of America for the 1981 lynching of Michael Donald in Mobile, Ala. It marks the end of the notorious United Klans, which was responsible for the deadly bombing of Birmingham’s Sixteenth Street Baptist Church and the murder of civil rights activist Viola Liuzzo in the 1960s. 1987 – Alabama state troopers must integrate after the U.S. Supreme Court rules in favor of the SPLC in its lawsuit, Paradise v. Allen. 1988 – SPLC appeal wins release of Roy Patterson from prison in Georgia, 13 years after he was wrongfully convicted of murdering a police officer. Patterson acted in self-defense when a state trooper and a policeman attacked him and his wife and child. 1988 – A federal jury assesses nearly $1 million in damages against two Klan groups and 11 followers responsible for an attack on peaceful marchers in Forsyth County, Ga. The SPLC sued on behalf of the marchers in McKinney v. Southern White Knights. The Invisible Empire was eventually forced to pay damages and disband. 1989 – The Civil Rights Memorial, created by Maya Lin, designer of the Vietnam Veterans Memorial, is dedicated by the SPLC at its office in Montgomery. In 2005, the Civil Rights Memorial Center, an interactive visitor’s center, opens in the SPLC’s former office. 1989 – The SPLC wins a settlement against members of the Invisible Empire Klan who attacked peaceful civil rights marchers with bats, ax handles and guns in Decatur, Ala., in 1979. The Klansmen must attend a race relations course taught by the leaders of the group they attacked. SPLC History: 1990s 1990 – The SPLC wins a $12.5 million judgment against Tom and John Metzger and their hate group, White Aryan Resistance, for their role in the murder of Ethiopian student Mulugeta Seraw by racist skinheads in Portland, Ore. 1991 – Teaching Tolerance, a program to provide free classroom materials on tolerance and diversity to teachers, is launched. A year later, Teaching Tolerance releases its first teaching kit, America’s Civil Rights Movement. The accompanying documentary film, A Time for Justice, wins a 1995 Academy Award in the short documentary category. 1991 – The SPLC brings dramatic changes to the way child welfare authorities provide for children with special mental health needs with the settlement of R.C. v. Fuller. 1993 – The Confederate battle flag is removed from atop the Alabama Capitol after the SPLC wins Holmes v. Hunt. The flag had flown atop the building since Gov. George Wallace raised it in 1963 as a symbol of defiance to integration efforts. 1994 – The SPLC begins investigating white supremacist activity within the anti-government militia movement. Six months before the April 1995 Oklahoma City bombing that killed 168 people, Morris Dees writes a letter warning U.S. Attorney General Janet Reno of the danger posed by militias. 1994 – The SPLC wins a $1 million default judgment against the Church of the Creator in the 1991 slaying of a black sailor, Harold Mansfield, by one of the group’s reverends. 1995 – Indigent dialysis patients in Alabama receive state-funded transportation to medical care following an SPLC lawsuit brought on behalf of these patients who sometimes went without food to afford transportation. Although the case, Harris v. James, was ultimately overturned on appeal, Alabama Medicaid recipients continue to receive transportation. 1996 – Alabama prisons are forced to abandon the use of brutal prisoner chain gangs following an SPLC lawsuit, Austin v. James. 1998 – A South Carolina jury awards the largest judgment ever against a hate group in Macedonia v. Christian Knights of the Ku Klux Klan. The Christian Knights, its state leader and four other Klansmen are ordered to pay $37.8 million (later reduced to $21.5 million) for conspiring to burn Macedonia Baptist Church, an African-American church. 1998 – A homeless African-American teenager is enrolled in an Alabama high school after being denied admission to a school because of her homeless status and steered away from another because of her race. The SPLC lawsuit, Penny Doe v. Richardson, led to a state policy that complied with federal law and ensured that local schools live up to their responsibility to educate homeless children. 1999 – Klansman Wallace Weicherding and New Order leader Dennis McGiffen are sent to prison for conspiracy in connection with a plot to kill Morris Dees by bombing the SPLC office. SPLC History: 2000s 2000 – The SPLC wins a $6.3 million verdict against the Aryan Nations and its leader, Richard Butler. Butler must give up the 20-acre compound that is home to the nation’s most violent white supremacists. The SPLC filed suit after Aryan Nations members terrorized a mother and son. 2000 – Alabama prisoners are allowed to receive gift subscriptions to publications following the SPLC lawsuit, Prison Legal News, et al. v. Haley. Before the lawsuit, prisoners could not accept gift subscriptions and were forced to buy subscriptions from their prison trust accounts. The lawsuit also resulted in publishers receiving notification when their publications are rejected by the Alabama Department of Corrections. 2002 – Teaching Tolerance launches the first Mix It Up at Lunch Day. The program encourages students to break out of their lunchtime cliques and meet other students. 2002 – The U.S. Supreme Court rules Alabama prisons cannot handcuff prisoners to metal posts known as hitching posts. The ruling in Hope v. Pelzer came after the SPLC served as co-counsel for a prisoner handcuffed to a hitching post outdoors for seven hours. 2003 – Winning a lawsuit against Alabama Chief Justice Roy Moore to enforce the constitutional separation of church and state, the SPLC forces the removal of a three-ton Ten Commandments monument from the state Supreme Court building"
