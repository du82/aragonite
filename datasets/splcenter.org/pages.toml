title = "Eliminating Poverty and Economic Inequality"
description = "By engaging local communities and grassroots organizations, the SPLC is organizing to build the political power of Black and Brown people in the Deep South."
full_description = 'Language: English Español document.getElementById( "lang_choice_1" ).addEventListener( "change", function ( event ) { location.href = event.currentTarget.value; } ) Racial Justice Issues Eliminating Poverty and Economic Inequality In statehouses and Congress, the Southern Poverty Law Center is advocating for data-backed, inclusive policies that lift people out of poverty by expanding economic opportunity. An American Dream Meets an Economic Reality. Racial Economic Inequality Persists Throughout the Deep South, discriminatory housing, education, employment and health care systems perpetuate poverty and hinder generational wealth accumulation, leaving many communities among the poorest in the nation. People Living in Poverty Face Immense Obstacles Stigmatized and targeted because of their economic status, vulnerable Black and Brown communities experience exploitation, abuse and unnecessary criminalization, siphoning away their wealth and exacerbating their poor living conditions. To Combat Inequality, We Must Confront Hard Truths In order to change perceptions of communities most affected by poverty, the public must understand the historic injustices they have experienced. Reshaping attitudes is the key to building momentum toward a more equitable economic future. What We’re Working On Economic Justice Through litigation, we reclaim land and wealth unjustly taken from Black and Brown communities in the Deep South. Wealth Generation We advocate for policies that provide access to economic ladders of opportunity and protect the social safety net. Land Justice By highlighting systemic land loss injustices in Black communities, we build support for land preservation. Homelessness In court, we defend the rights of people experiencing homelessness to be sheltered, safe and housed. Anti-Discrimination We work with policymakers to advance anti-discrimination laws and safeguard DEI programs and initiatives. Over-Criminalization We use legislative and regulatory advocacy to prevent people from being criminalized for experiencing homelessness. Related Resources Report Ending Business as Usual: The Need for Alabama Civil Asset Forfeiture Data Transparency Report Mississippi State of the State Report Sheltering Injustice Join Our Mailing List Learn about how you can advocate for economic justice, access new SPLC publications and community resources, and read the latest updates about our legal and community organizing work. Stay connected to the SPLC by signing up for our mailing list. Subscribe Today Latest News Hopewatch Some traveled west: Altadena residents draw on Black community strength Hopewatch Zora! Festival celebrates culture, preservation wins for historic Black community Hopewatch On Inauguration Day, remember Martin Luther King Jr.’s call for economic justice'
