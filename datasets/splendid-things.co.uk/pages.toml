["https://splendid-things.co.uk/getrunning"]
title = "Get Running | The human running coach"
description = "Get Running is an app for iPhone, iPod Touch and Android that talks you through a nine-week training plan. Get Running will gradually ease you into running, even if you've never run before. Once you complete the plan, you'll be ready to run a 5K."
full_description = "Get Running is an app for iPhone, iPod Touch and Android that talks you through a nine-week training plan. Get Running will gradually ease you into running, even if you’ve never run before. Once you complete the plan, you’ll be ready to run a 5K. Josh Clark’s Couch-to-5K running plan has been helping people start running for years. Designed to get complete beginners running from scratch, it alternates running and walking to gradually build up your fitness, until you’re running for thirty minutes solid. Get Running plays nicely with your existing music apps. Whether it’s the built-in player or a third-party app like Spotify™, just play your music the normal way, and Get Running will happily run alongside it. People really seem to like Claire, the voice of Get Running! More than 200 professionally-recorded voice instructions lead you through every stage of the plan, encouraging you to keep going and giving you tips from warm-up to cool-down. Share your progress with your friends on Twitter, Facebook and other social networks. Get Running easily connects to Facebook and Twitter to let people see how you’re getting along. “I’ve tried Couch to 5k in the past, using the podcasts, and quit in the first week. With this wonderful app, I have found myself in week 3 of the program and wanting to run even on my designated rest days.” “So glad to finally see this on the market! The one app I really missed from my iPhone. It just works. Motivating. Achievable. Best of its kind in the app store and destined to be the best here. Can’t wait to go for a run again!” “I loved this app on iphone. This was by far the best running coaching app I have used. The port is beautiful, great job.” Matt is the Android and web developer for Get Running. He tweets about geeky things, photography, and Bristol."
year_published = 2025
clearnet = "https://splendid-things.co.uk/getrunning"
