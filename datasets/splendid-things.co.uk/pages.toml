["https://splendid-things.co.uk/getrunning/running-tips"]
title = "Get Running |   Running Tips"
description = "Tips for beginner runners from Get Running for iOS and Android."
full_description = "You don’t need to spend a fortune to run. Good, comfortable running shoes are a must, but they don’t need to be expensive. And a water bottle is a good idea. Other than that all you need is some clothes you feel comfortable in. Oh, and your iPhone or iPod Touch! You can take your iPhone in a pocket, an armband, or an audio waist pack (a slimline “bum bag” or “fanny pack” that keeps your iPhone/iPod safe and snug at your waist.) Always warm up before you run. We recommend five minutes of quick walking to get your muscles moving. Get Running tells you when to warm up, and times your warm-up for you. Get Running reminds you to stretch, too. We found About Running’s advice on stretching really useful. Eat a light meal before you run. A banana, say, or breakfast cereal. That’s the right kind of thing. You don’t want to run out of juice halfway, but you don’t want to weigh yourself down with a heavy meal, either! Give yourself a little time to start digesting before you set off. Get Running doesn’t set a speed for you to run. You should run at your own pace. A gentle jog is fine, especially in the early days! If you’ve never run before, the excellent Zen Habits blog has some advice on how to go from nothing to running. Get Running’s Run Controls let you pause a run at any point. If you need to stop, then stop! Then get your breath back, and start again when you’re ready. You can begin by going out three times a week and simply walking. Work up to a brisk half hour walk, and when you are ready, add one or two minute long runs to your amble. Once you’ve managed that, you’ll breeze through Get Running’s first week. Really: don’t push yourself too hard. If you’ve signed up for a charity race and want to use Get Running to get in shape for it, then start sooner rather than later! Other people can be a great help when you’re starting out. Persuade a friend to get fit with you — it’ll be fun! Or join in the conversation at an online forum, like our very own forum, or the Runner’s World Beginners forum."
year_published = 2025
clearnet = "https://splendid-things.co.uk/getrunning/running-tips"
