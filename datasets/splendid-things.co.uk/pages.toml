["https://splendid-things.co.uk/getrunning/press"]
title = "Get Running |   Press Pack"
description = "Useful information and resources  for the press, bloggers, or anyone else writing about Get Running, a beginner's running coach for iOS and Android."
full_description = 'Useful information and resources for the press, bloggers, or anyone else writing about Get Running. Can’t find what you need? Get in touch! Based on Josh Clark’s popular “Couch to 5K” plan, Get Running guides a new runner through a nine-week training plan. It’s designed to be simple and painless. Run three times a week, follow the voice instructions, and you’ll be able to run 5K (about 3 miles) by the end of the plan. The iPhone version of Get Running has sold around 300,000 copies since it was released in 2009, topping the App Store’s “Health & Fitness” chart in several countries and collecting thousands of great reviews. Splendid Things released Get Running for Android in July 2012, using the same high-quality audio samples as the original app, but rewriting everything else for Android, from the ground up. Splendid Things is a small British company, founded in 2009 specifically to develop excellent mobile applications. Splendid Things often works in partnership with individuals and other small companies to create its apps. For press enquiries, mail press-enquiries@getrunningapp.com. Bear in mind that Splendid Things is based in the United Kingdom, so we’re generally most responsive during GMT/BST working hours. We’re happy to give out copies of the app for review to the media, bloggers included. For iPhone, this is normally done with a promo code. For Android, because the Google Play Store doesn’t support promo codes, we’ll ask you to buy the app, and then refund your money immediately after the purchase (we’re working on a better way!) We practise ethical marketing. We believe in full disclosure, and we don’t place any restrictions on reviewers or reviews. Be honest, we can take it! These Get Running icons are available for press use. The “stroked” version may work better against a light background. We have a nice little video demo of our Android version on YouTube: https://www.youtube.com/watch?v=tMbIDdc60xQ Follow getrunningapp !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src="//platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs");'
