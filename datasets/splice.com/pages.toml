["https://splice.com/blog/how-to-make-music"]
title = "How to make music: Create your own music in 6 steps - Blog | Splice"
description = """
Harrison Shimazu
 \t\t\t\tHarrison Shimazu is a composer, content strategist, and writer who’s passionate about democratizing music creation and education. He leads the Splice blog and produces vocaloid music as Namaboku."""
full_description = 'Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Tips & Tutorials How to make music: Create your own music in 6 steps Illustration: Filip Fröhlich Have you ever wanted to learn how to make music? Whether you’ve played an instrument your whole life or have solely been an avid music listener, you may have wondered what it would be like to create your own music at one point or another (spoiler alert: it’s a deep—and at times challenging—but incredibly fun and rewarding experience). Fortunately, learning how to make music has never been easier than it is today. With nothing but a computer and some online resources (like this article you’re reading right now), you can get a start on—and go incredibly far in—your music creation journey. In this in-depth guide, we’ll go over everything you’ll want to know get started with music production, from the tools you’ll need to the six creative steps you’ll take to make your own music. See the table of contents below to quickly navigate from section to section. What you’ll learn: The tools you’ll need to make music The basics of how to make music in a DAW How to make a beat How to write a melody How to create a chord progression Developing your idea into a full track Mixing your music Mastering your music Feeling excited? Let’s get started! The tools you’ll need to make music When you imagine a music producer, you might envision a spacious studio, sprawling mixing boards, and top-end mics in polished recording booths. While these are all great to have access to, you’ll be pleased to know that you can make some incredible music today with nothing but a laptop and a few pieces of software. Below, we’ll explore the core essentials you need to get started. 1. A DAW (digital audio workstation) A digital audio workstation, or DAW for short, is the main software used in modern music production to record, edit, and arrange sounds. Think of it as the house within which you’ll build and arrange all of your ideas. <img decoding="async" src="https://splice.com/blog/wp-content/uploads/2020/07/studio-one-5-in-post-score-view-1024x574@2x.png" alt="How to make beats for a song: The Score View in Studio One 5"/> What a DAW typically looks like—this one is PreSonus’ Studio One. How to choose a DAW One of the first decisions you’ll have to make when learning how to make music is picking a DAW, since there are many options out there. If it brings you any comfort, great music can be created in any DAW. It’s ultimately just your canvas, and the art will come from you, not your tools. That said, you’ll (hopefully) be spending a lot of time in it, so you’ll want to pick one that excites and motivates you. For you, this might mean picking a DAW that you simply find aesthetically appealing. Looking into what your favorite artists and producers are using might also spark ideas. Different DAWs have different price points, and some are exclusive to solely Mac or Windows, so these may be factors as well. Popular DAWs for making music Below, let’s take a look at a few of the most popular options to get some ideas flowing. GarageBand ($0): GarageBand is a DAW that’s widely recognized by creators and non-creators alike, thanks to the fact that Apple has pre-installed it to their devices for years. Although it’s exclusive to Mac / iOS and limited in features compared to some other options, its (highly) affordable price and mobile extension make it a popular choice for many beginners. Some records that were made with GarageBand: Rihanna’s “Umbrella” and Radiohead’s In Rainbows Logic Pro X ($200): Logic Pro X is in many ways a more advanced version of GarageBand. Also owned by Apple, Logic Pro is a DAW with a sleek UI and time-tested workflow. Some artists who’ve been seen using Logic Pro X: Calvin Harris, Jacob Collier, and FINNEAS Ableton Live ($0 – $749): Right up there in popularity alongside Logic Pro, Ableton Live is known for its emphasis on live performance as well as music production. Its unique workflows can be polarizing to some, but those who love it absolutely swear by it. It also has several different tier options (as do some others below), hence the variability in price. Some artists who’ve been seen using Ableton Live: Skrillex, KSHMR, and Imogen Heap Studio One ($99 – $399): While it may not be as widely known as Logic or Ableton, Studio One should not be underestimated. The forward-thinking DAW is designed to be intuitive, and also has some exclusive features that are great for beat making (Impact XT) as well as traditional scoring (Score View). Some artists who’ve been seen using Studio One: Maarten Vorwerk, Armin Van Buuren, and Rob Scallon Bitwig Studio ($99 – $399): Bitwig Studio almost feels more like a playground than a traditional DAW. From modular sound design to mapping for live sets, if you think you’re a type of person who really likes to get into the weeds, Bitwig Studio might be the workstation for you. Techno legend Richie Hawtin on Bitwig Studio: “An intuitive DAW that goes beyond everything else in the depth of its built-in modulation routings and access to the Grid.” FL Studio ($99 – $499): A DAW that seems to have a particularly strong user base around hip hop and EDM, FL Studio is adored for its sequencer workflows and lifetime free updates. Some artists who’ve been seen using FL Studio: Porter Robinson, Murda Beatz, and Soulja Boy All of the paid options have free trials, so it could even be worth trying out a few to see which one feels the best to you. Bitwig Studio is specifically available on Rent-to-Own, which means you can pay smaller monthly installments towards ownership after your trial period ends, instead of immediately buying it outright. There are also ways to have Ableton Live Lite bundled for free when you get select products and services. 2. Sounds and plugins While the DAW provides the virtual environment you’ll be working in, sounds and plugins are the elements you’ll need to use within it to actually produce audio. Sounds can appear in all sorts of forms. Perhaps they’re pre-existing loops that you can use for inspiration. Or, maybe they’re one-shots that are loaded into software instrument plugins that you can use to create your own melodies and chord progressions. An example of a kick one-shot, or a type of audio sample that’s just a single strike. Arranging instances of these into a musical pattern is one way you can make your own music. Speaking of which, plugins are smaller pieces of software that you use inside of your DAW to meet a variety of creative needs. Maybe they provide a virtual instrument (like a piano or bass) pre-loaded with sounds, which can allow you to compose parts for an instrument that you don’t physically own or know how to play. Or, maybe they allow you to use an effect like an echo or a reverb to color your sounds. Know that most DAWs will come with a suite of built-in sounds and effects, so you don’t have to worry about acquiring them separately just to learn how to make music. However, as you continue your music production journey, you might also come across third-party plugins and sample libraries that you find appealing. Purchasing these will allow you to incorporate new sounds and effects into your DAW to expand your sonic horizons even further. Access the world’s best sample library and connected creator tools for only $0.99. 3. Physical instruments and hardware (optional) Lastly, if you either sing or play a physical instrument, you can absolutely incorporate those talents into your own music. This is totally optional and not a requisite for digital music production, but can certainly be a valuable asset if you’ve got it. If you want to sing in your own music, you’ll want to look into getting a microphone, an XLR cable (for most mics), and an audio interface. In the tutorial below, we walk through how you can connect these things to your DAW. That said, if you don’t have the budget or just want to get started right away, you can also get some decent recordings out of your phone or laptop’s built-in mics with the right setup. These pieces of gear will also be relevant if you play pretty much any acoustic instrument (ex. violin, saxophone, trumpet, etc.). If you play an electric instrument like the electric guitar or bass, you can plug your TS cable directly into an interface instead, and then amplify your signal with plugins in your DAW. Last but not least, if you play the piano or keys, you might want to look into MIDI controllers (a lot of producers will also use these to get ideas down, even if the piano isn’t their primary instrument). It’s also worth nothing that there’s an endless amount of hardware out there—whether it’s stereo speakers, effects units, or outboard gear—that can be used in conjunction with the DAW to create music. That said, they’re not by any means necessary for starting out, so we’ve omitted them here. The basics of how to make music in a DAW Once you pick your DAW, it’s time to open it up and get acquainted with it. While every workstation is different, they generally share a broad set of common views and workflows. Let’s take a look at a few key ones here. 1. The track / arrangement view <img decoding="async" width="1024" height="576" src="https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01-1024x576.png" alt="The Track View in Logic Pro X (from &quot;How to make music&quot; on the Splice blog)" class="wp-image-21284" srcset="https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01-1024x576.png 1024w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01-400x225.png 400w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01-355x200.png 355w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01-768x432.png 768w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01-1536x864.png 1536w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-01.png 1984w" sizes="(max-width: 1024px) 100vw, 1024px" /> The track view in Logic Pro X. First up is the track or arrangement view. This view is usually displayed by default, right when you open up the DAW. It’s where you’ll be seeing all of your different parts, as you layer multiple software instruments and audio tracks within your project. You’ll likely see some numbers across the top that denote musical measures, and once you hit the play button, the playhead thumb should start moving through them from left to right. As it does, you’ll hear any music you’ve created in time with it (we’ll see this in action later). 2. The MIDI editor / piano roll <img loading="lazy" decoding="async" width="1024" height="576" src="https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03-1024x576.png" alt="The piano roll in Logic Pro X (from &quot;How to make music&quot; on the Splice blog)" class="wp-image-21286" srcset="https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03-1024x576.png 1024w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03-400x225.png 400w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03-355x200.png 355w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03-768x432.png 768w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03-1536x864.png 1536w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-03.png 1984w" sizes="(max-width: 1024px) 100vw, 1024px" /> The piano roll in Logic Pro X. The MIDI editor, also often referred to as the piano roll, is an area where you can add and edit MIDI notes. MIDI (Musical Instrument Digital Interface) is a type of digital protocol that allows us to capture information and relay instructions to our software instruments (and MIDI controllers, if you picked one up). In a DAW, MIDI allows us to easily compose our own beats, chord progressions, melodies, and more. Unlike the track / arrangement view, you most likely won’t see this one right when you open up the DAW. 3. Channel strips <img loading="lazy" decoding="async" width="1024" height="575" src="https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02-1024x575.png" alt="The channel strip in Logic Pro X (from &quot;How to make music&quot; on the Splice blog)" class="wp-image-21285" srcset="https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02-1024x575.png 1024w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02-400x225.png 400w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02-355x199.png 355w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02-768x431.png 768w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02-1536x862.png 1536w, https://splice.com/blog/wp-content/uploads/2022/05/how-to-make-music-daw-in-post-02.png 1984w" sizes="(max-width: 1024px) 100vw, 1024px" /> Channel strips in Logic Pro X. Lastly, let’s take a look at channel strips. Each track you create will have one of these; you can use them to add audio effects to your sounds like echo, reverb, EQ, and more. The volume fader that’s often connected to them will also allow you to easily adjust a track’s loudness—though you can usually also do this in the track / arrangement view. You might also come across all of your channel strips gathered together in a mixer view, in addition to a single master track that all of your individual channel strips feed into. These can be useful for mixing and mastering, two process that we’ll cover towards the end of this guide. How to learn more about your specific DAW First and foremost, don’t worry about learning every obscure detail about your DAW before you even start. Instead, the better approach may be to read or watch a short introduction, and then to look up specific things as questions arise. Just like you can’t learn how to ride a bike by reading a book, you can’t learn how to make music without actually doing it. If you do get stuck on how to do something along the way, some great resources to lean o'
