title = "What is Rhythm in Music: Introduction to Beats, Meters, and Tempo - Blog | Splice"
description = """
Harrison Shimazu
 \t\t\t\tHarrison Shimazu is a composer, content strategist, and writer who’s passionate about democratizing music creation and education. He leads the Splice blog and produces vocaloid music as Namaboku."""
full_description = 'Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Music Theory What is rhythm in music: An introduction to beats, meters, and tempo Illustration: Laura Bee What is rhythm in music? We hear the word used all the time by music creators and listeners alike, but its exact definition and all of the elements it encompasses can be surprisingly ambiguous. So, whether you’re a beginner or a seasoned musician, it may be worth asking yourself: What is rhythm? The short answer is, rhythm is perhaps the single most fundamental element of music. Rhythm tells us the timing for where to place notes and rests in music. While entirely rhythm-driven music exists (ex. music created by hand claps), you can’t really have music that’s solely melodic—after all, how can we have a melody if we have no information about when its notes are going to strike? For this reason, it makes a lot of sense to define and learn about rhythm at the start of one’s musical journey. To develop a crystal-clear understanding of the concept of rhythm, in this guide we explore its main elements one-by-one. See all of the topics via the table of contents below and feel free to use it to navigate to a specific section. What you’ll learn: What is a beat in music? What is a meter in music? How to read a time signature What are rhythmic values? The sound of rhythms in action How to make your own rhythm What are dotted notes? What is tempo? Putting it all together Feeling ready? Let’s dive into the world of rhythm, starting with a particularly fundamental element: the “beat.” What is a beat in music? Like the term “rhythm,” we casually use the word “beat” to refer to all sorts of things we hear. However, in the context of music theory, a beat is a passage of music’s steady, primary pulse. If you’ve ever tapped your foot or clapped along to a song, chances are you’ve done so in sync with the song’s beat. If you’re not confident in your beat-keeping abilities, let’s use Avicii’s “Wake Me Up” as a simple exercise—try tapping your foot along to the song: If you found your foot landing in sync with the thumping kick drum that entered at the chorus (0:39), congratulations—you successfully identified the beat! You may also notice the clap sounds, which occur in between each of the kicks. Combined with the kick, these outline a pulse that’s twice as fast; this secondary pulse is referred to as the beat division. What is a meter in music? Now that we have a basic understanding of beats, let’s talk about how they’re organized. A meter in music helps us communicate how our beats are grouped and divided. There are two primary types of meters in music: simple meters, which have beats that can be naturally divided into groups of two, and compound meters, which have beats that can be naturally divided into groups of three. Today, let’s focus on two common simple meter types that, together, cover a pretty large quantity of music. 1. Simple quadruple meter If you try counting numbers aloud to the beat of “Wake Me Up,” you’ll find that repeating the phrase “one-two-three-four” makes the most sense—you might even find yourself naturally gravitating towards it. Furthermore, as we heard with the claps, the beats are divided into even groups of two (we can best include the claps in our counting by inserting an “and” in between each kick – e.g. “one-and-two-and-three-and-four-and“). When the beats are organized in fours (one | two | three | four) and each beat can be divided into groups of two (one-and | two-and | three-and | four-and) in this way, we say that the specific meter type is simple quadruple. 2. Simple triple meter While we’ll find ourselves counting to four for most popular music, there are also many songs that don’t fall under this umbrella. Take Billie Eilish’s “when the party’s over,” for example: Notice how it feels more natural to count “one-two-three” with each phrase, as opposed to “one-two-three-four.” The division of each beat isn’t clear until Billie sings “Quiet when I’m coming home” (0:53), a phrase that delivers two evenly-spaced syllables per beat (you can easily replace the syllables in the line with “one-and-two-and-three-and-one”)—this confirms that the specific meter type is simple triple. Simple triple meter can at times be confused with compound meters, because there can be a gray area where we’re unsure of whether we’re tapping along to a beat or its subdivision. In these instances, we make a determination based on which specific beats are emphasized by the music. If that went over your head, don’t worry; we’ll explore this idea in further detail another time. What is rhythm in music: Applying your knowledgeListen to the following songs, and determine whether they’re in simple quadruple or simple triple meter:1. The Beatles’ “Here Comes The Sun”2. Kelly Clarkson’s “Breakaway”3. Bruno Mars’ “That’s What I Like” Think you got it? See the answers below. 1. Simple quadruple meter 2. Simple triple meter 3. Simple quadruple meter How to read a time signature Now that we have a basic understanding of simple meters, let’s figure out how to read a time signature that’s expressed in writing. Almost always, a piece of music will use a time signature that looks something like this: <img loading="lazy" decoding="async" width="518" height="444" src="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Time_Signature.jpg" alt="Common time (4/4) displayed on a staff (A reference image for &quot;What is rhythm in music?&quot; on the Splice blog)" class="wp-image-11891" style="width:389px;height:333px" srcset="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Time_Signature.jpg 518w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Time_Signature-400x343.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Time_Signature-298x255.jpg 298w" sizes="(max-width: 518px) 100vw, 518px" /> How a time signature appears in sheet music. <img loading="lazy" decoding="async" width="1024" height="212" src="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-1024x212.jpg" alt="Common time (4/4) displayed in a DAW" class="wp-image-12096" srcset="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-1024x212.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-400x83.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-355x73.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-768x159.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-1536x318.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-time-signature-1-2048x423.jpg 2048w" sizes="(max-width: 1024px) 100vw, 1024px" /> How a time signature appears in a DAW (Studio One). Time signatures are expressed with two numbers that are presented like a fraction. With simple meters, each number conveys the following piece of information: The top value (the ‘numerator’) tells us whether the meter type is duple (2), triple (3), or quadruple (4). In other words, it tells us how many beats exist in each measure, a unit that helps us section our music into logical and digestible pieces (also known as a bar). We’ll explore measures / bars in further detail in a bit. The bottom value (the ‘denominator’) tells us if a beat is constituted by a half note (2), quarter note (4), eighth note (8), or sixteenth note (16). Let’s walk through an example—in the above images, we see a time signature of 4/4. This means that our music is in quadruple meter (i.e. has four beats per measure), and that a quarter note is equivalent to one beat. <img loading="lazy" decoding="async" width="1024" height="489" src="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters-1024x489.jpg" alt="A chart of common time signatures and their meter types (A reference image for &quot;What is rhythm in music?&quot; on the Splice blog)" class="wp-image-11890" srcset="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters-1024x489.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters-400x191.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters-355x169.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters-768x366.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters-1536x733.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Simple_Meters.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> A chart of common time signatures and their meter types. This raises the question: What’s a quarter note? What are rhythmic values? In order to create a rhythm that’s more than just a steady beat, we need to be able to have notes and rests (silences) that are of different durations. In sheet music, we use rhythmic values, which are unique symbols that tell us how long notes or rests last in relation to one another. See what they look like in the chart below. Rhythmic values chart <img loading="lazy" decoding="async" width="1024" height="676" src="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1-1024x676.jpg" alt="A chart listing common rhythmic values in sheet music, expressed as both notes and rests (A reference image for &quot;What is rhythm in music?&quot; on the Splice blog)" class="wp-image-12059" srcset="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1-1024x676.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1-400x264.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1-355x234.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1-768x507.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1-1536x1014.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Rhythmic_Values-1.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> A chart listing common rhythmic values in sheet music, expressed as both notes and rests. Note that one whole note, two half notes, four quarter notes, eight eighth notes, and sixteen sixteenth notes are all equivalent to one another in their total duration. <img loading="lazy" decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-1024x640.png" alt="A chart that shows equivalent values, breaking down a whole note into two half notes, four quarter notes, eight eighth notes, and sixteen sixteenth notes (A reference image for &quot;What is rhythm in music?&quot; on the Splice blog)" class="wp-image-8577" srcset="https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-1024x640.png 1024w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-400x250.png 400w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-355x222.png 355w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-768x480.png 768w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-1536x960.png 1536w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-500x312.png 500w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-345x215.png 345w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-1200x750.png 1200w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19-250x156.png 250w, https://splice.com/blog/wp-content/uploads/2020/01/Artboard-7-copy-19.png 1921w" sizes="(max-width: 1024px) 100vw, 1024px" /> <img loading="lazy" decoding="async" width="1024" height="609" src="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests-1024x609.jpg" alt="A chart that shows equivalent values, breaking down a whole rest into two half rests, four quarter rests, eight eighth rests, and sixteen sixteenth rests (A reference image for &quot;What is rhythm in music?&quot; on the Splice blog)" class="wp-image-11888" srcset="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests-1024x609.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests-400x238.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests-355x211.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests-768x456.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests-1536x913.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_Equivalent_Values_Rests.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> Rhythmic values in the DAW When we’re working in a DAW (digital audio workstation), we’ll most likely be using a piano roll, where MIDI notes (pictured below) are sequenced across a grid. Here, different rhythmic values won’t have different symbols; rather, we’ll be looking at the length of the MIDI note in relation to the grid to determine its rhythmic value. <img loading="lazy" decoding="async" width="1024" height="434" src="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-1024x434.jpg" alt="The length of different notes, demonstrated on the piano roll" class="wp-image-12045" srcset="https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-1024x434.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-400x170.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-355x151.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-768x326.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-1536x652.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/03/Intro_Rhythm_DAW-rhythmic-values-1-2048x869.jpg 2048w" sizes="(max-width: 1024px) 100vw, 1024px" /> Consequently, any blank space where a note doesn’t exist is considered a rest. <img loading='
