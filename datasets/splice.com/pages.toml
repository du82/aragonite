["https://splice.com/blog/exporting-your-track"]
title = "Exporting Your Song: Best Bouncing Settings Explained - Blog | Splice"
description = "Learn about the best settings for exporting your song—in this article, we explore sample rate, bit depth, and more common parameters for bouncing audio."
full_description = '''Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Tips & Tutorials Exporting your song: The best settings for bouncing audio explained Illustration: Michael Haddad Exporting (also called bouncing) is the final step in getting music out of your DAW and into people’s ears. How you set up this part of the process can make all the difference. Do you want to just get a quick draft over to your friends for feedback, or are you totally finished with a mix and looking to get it mastered by a professional engineer? Or, perhaps you’ve already mastered the track yourself, and you’re looking to export your final song so you can upload it to streaming services. These are all important considerations to make when exporting / bouncing a project to your hard drive as its own rendered audio file (or files). In this article, let’s learn how to export our music in a way that best serves our unique needs by diving into some of the most common settings you’ll find in your DAW. How to set up your tracks for exporting The first step to bouncing is choosing exactly what to render to audio. It’s important to make sure that your exported track is starting and ending at the right times. Otherwise, you might find that parts of your song are missing, or end up with a bunch of silence at the end. For example, in Ableton Live, you can control the start and end of your track either directly in the export options or by using the loop markers in your Arrangement View to select only the part of the session you actually want to render. When exporting just a single stereo file, all you need to do is select your Master Track as the source. However, most DAWs will also have an option to render multiple tracks from your project as separate audio files. This is very useful if someone wants to remix your track, since they’ll have way more control over each individual element if they’re isolated. Some mastering engineers may also request that you export your song as separate stems rather than a single file. The best settings for bouncing audio While the exact workflow may vary, all DAWs share a number of common settings for bouncing audio. Below, we take a look at each and explore the implications they’ll have on your final export. 1. Audio resolution Two of the most important factors affecting the quality of your digital audio are sample rate and bit depth, so you generally don’t want to set these any lower than the audio you’ve been working with in your project if you’re getting a track mastered or sending it out for distribution. Sample rate determines the range of sound frequencies stored in an audio file, and you can’t really go wrong with the industry standard of 44.1 kHz. Meanwhile, bit depth determines the dynamic range of your audio, so you’ll want to go with a higher value that matches the audio you’ve been working with (like 16, 24, or 32-bit). 2. Dither When audio leaves your DAW, you’ll pretty much always need to apply something called dithering which helps clean up any errors during the rendering process. Check out our guide on dithering for more on how it works and why it’s used. There are situations in which you may not need to apply dithering when getting a track ready for mastering, but definitely check with your engineer first! 3. Normalization Normalization basically brings up the level of your track so that it’s as loud as possible. You can keep this parameter checked if you’re completely done with your track or want to send it out for feedback, but avoid normalizing if you want to get it mastered. Engineers prefer files with lower gain levels because it gives them more ‘headroom’ to apply effects and processing without hitting the limit at which digital audio starts clipping and distorting. 4. File type Here, you’ll choose which file type your track will be rendered to. Uncompressed formats like .wav and AIFF are pretty interchangeable and are absolutely vital for mastering or bringing your music into another DAW because they keep the audio as high-quality as possible. That said, compressed formats like mp3 will work in a pinch if you just want to quickly send a song to your friends. Conclusion So there you have it! While the above parameters are by no means the only settings you’ll find on a DAW export screen, keeping them in mind will ensure that your bounces deliver in various contexts. Do you have any additional questions on exporting music, or tips of your own that you’d like to share? Start a conversation with us and the larger music creator community via the Splice Discord. Explore royalty-free one-shots, loops, FX, MIDI, and presets from leading artists, producers, and sound designers: Join Splice today for $0.99 May 25, 2023 audio technology <img alt='' src='https://secure.gravatar.com/avatar/6210453a06683c0f3f11a7040fba7ede?s=120&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6210453a06683c0f3f11a7040fba7ede?s=240&#038;d=mm&#038;r=g 2x' class='avatar avatar-120 photo' height='120' width='120' decoding='async'/> Matteo Malinverno Matteo Malinverno is a New York-based music producer currently working on the Content team at Splice. Read More <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="dithering-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2020/05/Dithering_BlogPost.jpg 1920w" sizes="(max-width: 250px) 100vw, 250px" /> What is dithering in audio? When to dither and how it works Learn how dithering can help enhance the sound of your digital audio, despite the fact that it adds noise to the waveform. <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2020/07/AnalogtoDigital_Islenia_Fin-Artwork.jpg 1920w" sizes="(max-width: 250px) 100vw, 250px" /> Analog-to-digital conversion (ADC): What it is and how it works Let’s explore how analog-to-digital conversion has completely redefined our approach to music in the modern era. <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="different-microphones-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2020/08/Different_Mics_BlogPost.jpg 1920w" sizes="(max-width: 250px) 100vw, 250px" /> How