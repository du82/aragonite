["https://splice.com/blog/3-levels-of-sampling"]
title = "The 3 levels of sampling (beginner to pro) - Blog | Splice"
description = '''
Nick Chen
 				Content Marketing @ Splice. Nick Chen is a producer, performer, and educator under the aliases "nickthechen" and "Enix."'''
full_description = '''Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Tips & Tutorials The 3 levels of sampling (beginner to pro) The origins of sampling can be traced back to the 1940s, with the French experimental style of musique concrète. By physically manipulating tape with processes like splicing and looping, innovators such as Beatriz Ferreyra and Pierre Henry opened up new possibilities for how we could arrange sound. Then, Jamaican dub reggae producers such as Lee “Scratch” Perry began incorporating pre-recorded samples into their music in the ’60s, and in the ’80s, the introduction of commercial sampling hardware created the widespread boom of sampling, spearheaded by the likes of DJ Kool Herc, Grandmaster Flash, and Afrika Bambaataa. Soon after, revolutionary artists like J Dilla, DJ Premier, and DJ Shadow pushed sampling to a whole new level—and we fast-forward to today, where tools like Splice Sounds now enable anyone with a computer to explore the world of samples. In the video above, we go over this brief history of sampling and then dive straight into the three levels of complexity that exist within the process today. While we use FL Studio, Ableton, and Bitwig to demonstrate (along with plugins including XLN Audio’s XO and RC-20 Retro Color), you can use any built-in or third-party tools of your choosing to achieve the techniques covered. What tips did you find most useful? What sorts of topics in music production would you like to see us explore on our YouTube channel next? Let us know in the comments section of the video. Incorporate XLN Audio’s XO into your own beat making process: Try XO for free December 4, 2021 historypluginsrc-20 retro colorrent-to-ownsoundsxln audioxoyoutube <img alt='' src='https://secure.gravatar.com/avatar/d0c37ef22f991b955db7dfaef949c654?s=120&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/d0c37ef22f991b955db7dfaef949c654?s=240&#038;d=mm&#038;r=g 2x' class='avatar avatar-120 photo' height='120' width='120' decoding='async'/> Nick Chen Content Marketing @ Splice. Nick Chen is a producer, performer, and educator under the aliases "nickthechen" and "Enix." Read More <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="auditioning-samples-tips-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/06/Auditioning_Samples_BlogPost.jpg 1920w" sizes="(max-width: 250px) 100vw, 250px" /> 3 strategies for auditioning samples: How to choose the right sound We discuss some strategies you can apply to arrive to a decision the next time you’re stuck between two (or ten) samples. <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="jazz-hop-genre-breakdown-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/04/Jazz_Hop_Breakdown_BlogPost.jpg 1920w" sizes="(max-width: 250px) 100vw, 250px" /> The history, ingredients, and techniques behind jazz hop Learn about where jazz hop originated, its key characteristics, and how you can approach creating your own tracks in the genre. <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="rc-20-bad-snacks-j3po-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2020/06/RC20_Bad_Snacks_Refresh_BlogPost.jpg 1920w" sizes="(max-width: 250px) 100vw, 250px" /> Bad Snacks and J3PO on how RC-20 Retro Color shapes their sounds Producers / educators Bad Snacks and J3PO give us an inside look into how they use RC-20 in their own creative processes.'''
