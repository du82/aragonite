["https://splice.com/blog/how-to-create-vocal-harmonies"]
title = "Vocal Harmony Guide: How to Write & Sing Harmonies - Blog | Splice"
description = """
SAYANA
 \t\t\t\tSAYANA is a contemporary pop / R&B singer-songwriter based in Toronto, Canada. Check out her LP Them, You and Me anywhere you listen to music."""
full_description = 'Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Music Theory How to find vocal harmonies: A step-by-step guide Illustration: Filip Fröhlich What stands out the most to you when you’re listening to a song? For the average listener, it might be the melody, lyrics, production, or how it makes them feel. Most people’s answer probably wouldn’t include vocal harmonies. We don’t typically pay much attention to them, but the truth is, we would certainly miss them if they weren’t there. Vocal harmonies can make or break a song. They have the power to take it from an amateur-sounding bedroom recording to a radio-ready hit. They help create captivating live shows and breathe life into songs performed by choirs and acapella groups. Despite their crucial role in music, it’s common for singers to treat them as an afterthought—something they throw in hastily at the last minute. If you’re a singer, recording artist, or producer who works with artists, take the time to master vocal harmonies. Use them with intention and take full advantage of what they can add to your music. You’ll almost immediately see a noticeable difference in the overall quality of your songs and performances. If you don’t know how to find harmonies or can’t do it reliably for any song, then this guide is for you. We’re breaking the process down and showing you step-by-step how to write your own harmony lines and how to choose notes that sound great together. Feel free to use the table of contents below to quickly navigate to a specific section. What you’ll learn: What is a vocal harmony? The music theory behind vocal harmonies Understanding chords and melodies How to create vocal harmonies in five steps How to harmonize: Follow along with an example Other types of vocal harmonies Trust your ear How to practice vocal harmonies Ready to take your songs to the next level? Let’s start harmonizing! What is a vocal harmony? A vocal harmony is any vocal line sung simultaneously with the melody. It doesn’t repeat the melody exactly, but rather complements it. It follows the same rhythm and fits over the same chords, but its notes are different. While a song can only have one main melody, it can have any number of harmonies. They help add weight and texture to the vocal and reinforce the underlying chords. They’re often used to highlight important parts of the song, add depth and movement, or create a sense of tension and release. The music theory behind vocal harmonies Coming up with vocal harmonies is both a science and an art—it requires knowing a bit of music theory, but also relying on your ear. We’ll be just scratching the surface here, but to help make sense of the theory part, let’s go over a few basics. And if you’re already familiar with scales, intervals, and chords, feel free to skip this section. Keys and scales When making music, we have 12 pitches available to us. We don’t typically use all 12 in a single song, though, because without intention, that would have no harmonic structure and sound too messy. Instead, we choose a set of seven pitches and, for the most part, center each song around it. This set is called a key. When we line up the seven pitches of any given key in an ascending or descending order, we make a scale. One of the easiest keys to understand is C major. Its scale consists of all white keys on the piano: C, D, E, F, G, A, and B. Intervals Intervals measure the distance between any two notes, and they’re the building blocks of scales, chords, and melodies. We talk about smaller intervals in terms of half steps (semitones) and whole steps, but for larger intervals, it’s easier to measure them based on the notes in the scale. Let’s keep using the C major scale as an example. Going from C to E takes us three notes—C, D, E—so we call that interval a third. The distance between C and G would be called a fifth. Going from C to the next C takes eight scale notes, so we call that an octave. There’s a lot more to learn about intervals, but for now, all we need to know is that, when it comes to playing two notes at the same time, certain intervals sound more consonant than others. For example, thirds and fifths sound naturally pleasing to the ear, while a second interval often sounds a bit more dissonant or tense. Chords Speaking of third and fifth intervals, that’s exactly how most chords are built. For example, the notes C-E-G in the C major scale make the C major chord. The notes F-A-C make the F major chord. You can use this as a starting point and make adjustments to create more complex chords and chord extensions. What is melody in music: A guide to pitch, scales, and keys We go over keys, scales, and intervals in more depth in the guide above Understanding chords and melodies Great vocal harmonies do two things: they reinforce the chords and complement the melody. Let’s take a look at why both are important and how to find the right balance between the two. The role of chords in finding vocal harmonies By definition, harmony in music happens whenever two or more notes are played at the same time. If you’re accompanied by an instrument or a track, there is already harmony happening in the chords. Any new harmony you introduce needs to match that. That’s why, when coming up with a harmony, the first thing you need to do is look at the chord being played at that moment in the song. Of course, this is a rule you can sometimes break, but only if you have the freedom to change the chords as you go and make them more complex than they originally were. For example, maybe you’re arranging for an acapella group or re-harmonizing a song (giving it a different chord progression while keeping the melody the same). If that’s the case, you can freely experiment with notes that wouldn’t otherwise work with the original chords. As long as you give them context that justifies your choices, you can end up with some very interesting arrangements. Finding vocal harmonies that complement the melody If you’ve ever looked into how to sing harmonies in the past, you may have been told something like, “Oh, just sing the melody but shift it up or down by a third interval.” On one hand, this is good advice. Parallel harmonies—ones that match what the melody is doing—generally sound very pleasing to the ear. On the other hand, it only works sometimes. If, when trying to match the shape of the melody, you run into notes that clash with the chord underneath, your harmony can sound very ‘wrong.’ Does this mean that every note in the harmony needs to be a chord tone—i.e. a note that can also be found in the chord? Not at all. In fact, when we look at melodies, they, too, are made up of a combination of notes—some belong in the supporting chord, and others don’t. Otherwise, melodies would get very boring very quickly. So, if you’re considering singing a harmony with a note that’s not a chord tone, it may or may not sound fine. How is that possible? It all has to do with the fact that notes can take on different roles in melodies, and these roles extend to their respective harmony lines. Some notes act like “anchors.” They’re chord tones, and because of this, they’re typically played together with the chord, held longer, and carry more weight. They give us lots of harmonic information and help the melody make sense with the chords. Other notes happen in between these anchors. We pass them briefly, usually on the way to another anchor note. If we gave them the same level of importance in the melody, they might sound off. But, because they don’t carry the same weight, they simply make the melody more interesting without interfering with the overall harmony. So, here’s the general rule of thumb: When you’re harmonizing anchor notes, you should use other chord tones to make sure the harmony fits the chords. When you’re filling spaces in between anchor notes, you can harmonize the melody and more or less match its shape, without worrying about it clashing with the chords. The only tricky part is, there isn’t always a foolproof way to identify whether a note functions as an anchor or a filler. This is where you simply need to rely on your ears and go with what feels right. If all this makes your head spin, don’t worry. We’ll go through an example in just a moment and see how it plays out in practice. How to create vocal harmonies in five steps The goal is to find a harmony that fits the chords but also complements the melody. To do this, start by identifying the key that the song is in. In the place where you want to add a harmony, identify the chords and notes of the melody. Split your melody into sections, where each section is supported by a different chord. For each section, follow the steps below: Find an “anchor” note in the melody. It should be a chord tone. Shift your anchor note up or down so it matches a different chord tone—one that’s not already taken up by the melody. Shift the other notes (filler notes) so they roughly match the shape of the original melody, while staying within the same scale. More often than not, they can be shifted by the same interval as the anchor note, though this isn’t always the case. Test your new harmony line. Its anchor notes should match the chord, while its filler notes should complement the melody without clashing with the chord underneath. If any filler notes still sound off, you can try shifting them to the nearest chord tone. How to harmonize: Follow along with an example Let’s follow these steps together and create a couple of harmonies for the first line of “Let It Be” by The Beatles. The song is in C major, so that’s the scale we’ll use. There are two chords supporting this line, so we’ll split it into two sections. Finding anchor notes and outlining filler notes (“when I find myself in”) <img decoding="async" width="1024" height="553" src="https://splice.com/blog/wp-content/uploads/2024/03/image1-1024x553.jpg" alt="&quot;Let It Be&quot; vocal harmonies in the piano roll of Ableton (1)" class="wp-image-31132" srcset="https://splice.com/blog/wp-content/uploads/2024/03/image1-1024x553.jpg 1024w, https://splice.com/blog/wp-content/uploads/2024/03/image1-400x216.jpg 400w, https://splice.com/blog/wp-content/uploads/2024/03/image1-355x192.jpg 355w, https://splice.com/blog/wp-content/uploads/2024/03/image1-768x415.jpg 768w, https://splice.com/blog/wp-content/uploads/2024/03/image1.jpg 1440w" sizes="(max-width: 1024px) 100vw, 1024px" /> The first section is supported by the C major chord, which is made up of C, E, and G. The melody follows the notes G-G-G-G-A-E. We can tell that the G is an anchor note—it’s a chord tone, it lines up with the start of the chord, and feels important. To create a harmony to this line, we look to see if there are other chord tones in the C major chord that this G can “shift” to. How about the E? To go from G to E, we need to go down three notes on the C major scale (G is one, F is two, E is three), so we shift the whole section down by a third. Here’s what this looks like: <img loading="lazy" decoding="async" width="1024" height="553" src="https://splice.com/blog/wp-content/uploads/2024/03/image2-1024x553.jpg" alt="&quot;Let It Be&quot; vocal harmonies in the piano roll of Ableton (2)" class="wp-image-31133" srcset="https://splice.com/blog/wp-content/uploads/2024/03/image2-1024x553.jpg 1024w, https://splice.com/blog/wp-content/uploads/2024/03/image2-400x216.jpg 400w, https://splice.com/blog/wp-content/uploads/2024/03/image2-355x192.jpg 355w, https://splice.com/blog/wp-content/uploads/2024/03/image2-768x415.jpg 768w, https://splice.com/blog/wp-content/uploads/2024/03/image2.jpg 1440w" sizes="(max-width: 1024px) 100vw, 1024px" /> Note: If you’re using a MIDI workspace to help you figure out harmonies like we’re doing here, just be careful. When we talk about shifting everything up or down by a third interval, it doesn’t just mean highlighting every note and shifting it by the same amount on the piano roll. Instead, we shift every note by the same interval on a specific scale. Sometimes, the distance between two notes on a scale is two semitones, but sometimes it’s one. It’s helpful to have a MIDI controller out in front of you so you can play the scale and remind yourself what notes it contains. The new notes are E-E-E-E-F-C. Notice that the F doesn’t belong in the C major chord, but it sounds fine because it’s a filler note. It’s in harmony with the melody, but it doesn’t interfere with the underlying chord. The Es, on the other hand, maintain their position as anchor notes. As long as they’re in harmony with the C major chord, this harmony line will work. Using the same process, we can also shift the anchor note from G to C. This new harmony line would look like this: <img loading="lazy" decoding="async" width="1024" height="553" src="https://splice.com/blog/wp-content/uploads/2024/03/image3-1024x553.jpg" alt="&quot;Let It Be&quot; vocal harmonies in the piano roll of Ableton (3)" class="wp-image-31134" srcset="https://splice.com/blog/wp-content/uploads/2024/03/image3-1024x553.jpg 1024w, https://splice.com/blog/wp-content/uploads/2024/03/image3-400x216.jpg 400w, https://splice.com/blog/wp-content/uploads/2024/03/image3-355x192.jpg 355w, https://splice.com/blog/wp-content/uploads/2024/03/image3-768x415.jpg 768w, https://splice.com/blog/wp-content/uploads/2024/03/image3.jpg 1440w" sizes="(max-width: 1024px) 100vw, 1024px" /> This is just one option. If you take a look at the chord that’s created on the word “in”, that’s an A minor. If that E was an anchor note and we stayed on it longer, its harmony would clash with the C major chord. But, because we skip over it pretty quickly, it’s not really noticeable. However, another option to consider is this: we can treat that E as an anchor note and try to build a C major chord with the harmonies underneath. That might sound even better, and would look something like this: <img loading="lazy" decoding="async" width="1024" height="553" src="https://splice.com/blog/wp-content/uploads/2024/03/image4-1024x553.jpg" alt="&quot;Let It Be&quot; harmony in the piano roll of Ableton (4)" class="wp-image-31135" srcset="https://splice.com/blog/wp-content/uploads/2024/03/image4-1024x553.jpg 1024w, https://splice.com/blog/wp-content/uploads/2024/03/image4-400x216.jpg 400w, https://splice.com/blog/wp-content/up'
