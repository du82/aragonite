full_description = "Get access to millions of the world's best sounds. Select payment plan Monthly Annual Select a plan type Plan OverviewSounds+CreatorCreator+ Monthly sample download credits 100200500monthly price $0.99/mo for 1 month $12.99/mo after$4.99/mo for 1 month $19.99/mo after$19.99/mo for 1 month $39.99/mo after Desktop and mobile apps includedincludedincluded Preview sounds in your DAW with Bridge includedincludedincluded Filter for undiscovered sounds with Rare Finds Newincludedincluded Beatmaker drum machine plugin includedincluded Astra synth plugin includedincluded Get started Select a plan type Plan OverviewSounds+CreatorCreator+ Monthly sample download credits 100200500annual price $129.99 save ($26)$199.99 save ($40)$399.99 save ($80) Desktop and mobile apps includedincludedincluded Preview sounds in your DAW with Bridge includedincludedincluded Filter for undiscovered sounds with Rare Finds Newincludedincluded Beatmaker drum machine plugin includedincluded Astra synth plugin includedincluded Get started Learn more about what you get How does Splice work? Get new credits every month to license samples, presets, and MIDI.1 sample = 1 credit. Presets and MIDI use between 1-3 credits.Unused credits roll over to the next month. The highest-quality samples on the market Make better music with masterfully-recorded samples—carefully crafted by leading sound designers, breakthrough producers, and established icons like Oliver, KSHMR, and Murda Beatz. Limitless inspiration from hundreds of genres Combine samples from house to cinematic, techno to trap, and EDM to ambient to create something unique. We’ve traveled around the world to record inspiring samples—from glaciers in Iceland to abandoned mines in Utah. Speed up your workflow with Splice Desktop Preview samples in your tracks’ keys and tempos before you buy them; search millions of samples in an instant; view all your sounds in a lightweight desktop app. 100% royalty-free Use Splice samples to create anything. They’re cleared for commercial use in new works. Use Splice samples for anything—they’re fully cleared for commercial use. Keep everything you download, even if you cancel. Yours forever Keep everything you download, even if you cancel. No commitments Cancel your subscription at any time, no questions asked. FAQs How do Sounds credits work? Use credits to download your favorite samples, loops, one-shots, presets, and MIDI. All samples are one credit each. MIDI patterns and presets use up to three credits each. Unused credits automatically roll over to the next month. Keep everything you download, even if you cancel. Is my DAW supported? Splice Sounds works with any DAW. The source files for your Sounds will download to a location on your computer that you can view with the Splice Desktop App. The Desktop App, as well as other Splice plugins, is fully supported on the following DAWs: Ableton Live 10+ Logic Pro X 10.5+ Studio One 5+ FL Studio 20.8+ GarageBand 10.4+ Splice also comes with Bridge, a utility that lets you audition Sounds in the context of your project without using credits. Bridge and other Splice plugins, like Astra and Beatmaker, are in VST3 or AU plugin format. Can I cancel anytime? Yes! Cancel at any time. What happens if I cancel my Splice plan? When you cancel a plan, it will remain active until the end of the current billing period. Your remaining credits will expire 28 days after your final billing period ends, so you'll have until then if you wish to resubscribe and reclaim your credits. You can also put your plan on hold for up to two months if you do not wish to lose the credits you've accrued. After canceling, you can continue to use the Splice desktop app to access and browse your sample library. You can also re-download any previously purchased samples that are already in your library. Can I upgrade or downgrade my account anytime? Absolutely. If you upgrade, we'll charge you for the price of the new subscription immediately. You'll receive a refill of credits and access to any new software and features on the new subscription. Upgrading also resets your billing cycle to the date you upgraded. If you downgrade, we'll charge you the new subscription price on your renewal date. You won't lose access to any software or features on the plan you're currently subscribed to until your plan renews at the end of the billing period. Whether you upgrade or downgrade, your credits will roll over into your next billing period. Does Splice have Rent-to-Own plugins and gear? Yes, our rent-to-own program is the best way to get the industry's top plugins and gear without breaking the bank. Find out more here. Can't find it here? Check out our Help center"
