title = "How to Make Disco Music: BPM, Music Theory, & More - Blog | Splice"
description = """
Harrison Shimazu
 \t\t\t\tHarrison Shimazu is a composer, content strategist, and writer who’s passionate about democratizing music creation and education. He leads the Splice blog and produces vocaloid music as Namaboku."""
full_description = '''Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Tips & Tutorials How to make disco music: An in-depth guide with Jafunk The quintessential feel-good sound of American nightlife in the 1970s, disco music challenged the status quo and became influential to the rise of many modern electronic dance genres. In this in-depth guide, expert disco producer, multi-instrumentalist, and DJ Jafunk joins us as we dive into the rich sonic world of the genre, exploring topics spanning its history, key artists, and tips for how to make disco music of your own. Access the world’s best sample library and connected creator tools for only $0.99. What is disco music? Disco music is a genre of dance music that emerged in the early ’70s. It’s commonly characterized by steady four-on-the-floor beats, syncopated basslines, lush string arrangements, and soulful vocals. “To me, disco is joy, and listening to it makes me feel alive,” Jafunk tells us. “It’s fun, energetic, and soulful—perfect for the dancefloor. It’s also so well-crafted that it’s just as enjoyable to listen to at home. It’s versatile, all-purpose music that fits a variety of moods and settings effortlessly.” The history of disco music Discothèques—the type of nightclub where disco music got its name—were first imported from France to the United States, marked by the opening of Le Club in Manhattan in 1960. As more and more venues popped up between the ’60s and ’70s across cities like New York City and Philadelphia, the genre emerged as a vibrant mixture of music from African American, Hispanic, Latino American, LGBTQ, and Italian communities, among many others. Often seen as a counterculture reaction to the boom of rock music, it sonically reflected the era’s emphasis on fun, fashion, and funk. Disco artists Bee Gees, ABBA, Donna Summer, and Gloria Gaynor are a few of the many influential disco artists who shaped the genre’s sound. Today, artists like Dua Lipa, Lizzo, and Daft Punk continue to draw influence from or pay homage to it with many of their releases. “My favorite disco / funk artists include The Brothers Johnson, Chic, Sister Sledge, Earth, Wind & Fire, Michael Jackson, G.Q., Kool & The Gang, Diana Ross, and Rick James,” Jafunk adds. “One of my favorite albums which isn’t that commonly known is G.Q.’s Disco Nights. I’ve listened to this album on repeat, probably more than any other album in my library. It hits on so many fronts—the incredible musicianship, vocal performances, sound engineering, and blend between familiarity with surprise. Random key changes, drum change-ups, and more make it so exciting when you don’t know what’s coming next.” How to make disco music If you’re eager to learn how to make disco music of your own, tools like DAWs, Create, and royalty-free samples make the endeavor more accessible than ever, even if you don’t have a full band or recording studio at your disposal. Below, we break down the different key qualities that you’ll want to keep in mind to effectively capture disco’s infectious sound. Instruments used in disco music The instruments used in disco music include elements like acoustic drum kits, clean electric guitars, electric bass, strings, horns, and vocals. As the genre developed, synthesizers also became a common addition. “It feels so real to me because everything is played by real people,” Jafunk says. “From the drums and guitars to the strings and vocals, it’s all real instrumentation that has nuanced details in every moment.” The way in which the instruments used in disco music were historically tracked and produced also plays a direct role in shaping its sound. “The way they recorded parts to tape in one continuous take gives the music a unique, living quality,” Jafunk explains. “You can hear subtle changes throughout the track, like spontaneous fills and licks, or the natural variations in how a musician plays the same loop over five minutes. These little details make it feel organic and impossible to recreate by just copying and pasting a short loop.” If you’re using samples in your disco track, opting for ones that feature live performances can help you capture the organic sound of the genre. To take it a step further, try to see if there are also creative ways you can introduce small fills or subtle randomization to repetitions, so that the instrumentation doesn’t feel looped. And if you can, try recording your own parts, even if it’s just a single guitar line or drum groove within the arrangement. “I’m always inspired by how this genre can instantly boost my mood and make me feel incredible, so that’s exactly the type of vibe I try to bring with my own songs,” Jafunk shares. “Creating that sound comes from jamming and playing instruments, whether it’s on a MIDI keyboard or recording live guitar. I’m using my Fender Stratocaster and J-Bass a lot at the moment—both instruments that were frequently used in disco and funk in the ’70s and ’80s.” “Everyone feels rhythm in their own unique way, so by recording musical parts live, I’m able to infuse every track with my own unique groove and feeling which no one can copy. Most of all, playing instruments is just fun, and I want to have as much fun as possible when creating music.” Disco music BPM While there are no hard rules, disco music generally features a tempo ranging from around 110 to 130 BPM (beats per minute). Similar to the tempo of house music, this BPM range is ideal for the steady grooves that keep the energy flowing on dancefloors. The music theory of disco If you’re laying down your own rhythms, chord progressions, or melodies via live performances or MIDI, there are particular music theory concepts that you may want to explore as starting points. “When it comes to disco chord progressions, I’m all about extended chords—major and minor sevenths, ninths, elevenths, and anything else that sounds soulful or jazzy,” Jafunk says. “My favorite funk and disco tracks are the ones that have a strong jazz influence and use extended harmony.” While four-on-the-floor is the rhythmic foundation for disco music, Jafunk also encourages us to explore syncopation. “When you listen to artists like The Brothers Johnson, Michael Jackson, or Earth, Wind & Fire, the grooves are so funky because of the incredible syncopation they use; they accent sixteenth notes that aren’t normally stressed. Syncopation often shifts the focus away from the regular, predictable beats, adding complexity and a funky feel to the rhythm.” For more on the foundational music theory vocabulary of rhythm, check out our in-depth guide below: What is rhythm in music: An introduction to beats, meters, and tempo Plugins / VSTs Jafunk also suggests a number of plugins that are his go-to tools for capturing disco’s distinctive sound from a production standpoint. “For VSTs, I love u-he’s Diva,” he shares. “It’s the best VST I’ve found for emulating analog synth sounds really well. I’m also a fan of the Waves plugins that emulate classic hardware gear like the CLA-2A and CLA-76 compressors.” For additional options, Arturia’s V Collection and FX Collection feature a wide selection of award-winning emulations of classic synths and effects units. XLN Audio’s Addictive Drums is also stellar for sequencing organic-sounding drums, and RC-20 Retro Color is an industry favorite for adding vintage-style processing to sounds, which can be a great match for disco. What’s more, all of these plugins are also notably available on Rent-to-Own, which means you can try them for free to see if they’re a fit for your track. Disco samples Last but not least, if you’re looking for disco samples to incorporate into your productions, Jafunk’s own Disco Gems Vol. 2 is a great place to start your search. “With Disco Gems Vol. 2, I wanted to merge the classic live disco sound with the more modern nu-funk vibe,” he tells us. “Relative to my Future Funk & Soul sample packs, this series features more live components and loops that showcase my musicianship on instruments like guitar and bass that I worked a lot on over the last few years. The pack also has tons of live drums, percussion, and instrumentation that are mixed with a modern processing and production style to give them some more punch. My favorite samples from the pack are probably the live string loops and one-shots, which really have that authentic disco feeling.” Looking ahead And there you have it! Hopefully this article gave you a solid foundation for the key elements of disco and actionable ideas for how you can produce your own track in the genre. “I think disco will always influence modern music because it’s just so upbeat and feel-good,” Jafunk says. “The energy is timeless, and it has a way of coming back into style again and again. You can hear this in the music from artists like Silk Sonic or Sabrina Carpenter, who blend that soulful, funky vibe with modern production techniques to create something fresh and exciting. I think the sound of disco will continue to blend with new and emerging genres, ensuring it remains a lasting presence in music for years to come.” “And if you want to add some of that groovy, organic sounds to your music, then check out my Disco Gems sample pack series! And if you do use the samples in your music, please send it to me on social media—I’m always interested to hear how people are using my sounds in their own way.” Incorporate Jafunk’s infectious sounds into your own productions: Explore the sounds February 12, 2025 discopluginsrent-to-ownsample packssounds <img alt='' src='https://secure.gravatar.com/avatar/208af1495724cce6967f47553c4b971a?s=120&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/208af1495724cce6967f47553c4b971a?s=240&#038;d=mm&#038;r=g 2x' class='avatar avatar-120 photo' height='120' width='120' loading='lazy' decoding='async'/> Harrison Shimazu Harrison Shimazu is a composer, content strategist, and writer who’s passionate about democratizing music creation and education. He leads the Splice blog and produces vocaloid music as Namaboku. Read More <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-250x156.png" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="what-is-house-music-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-250x156.png 250w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-400x250.png 400w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-1024x640.png 1024w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-355x222.png 355w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-768x480.png 768w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-1536x960.png 1536w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-500x312.png 500w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-345x215.png 345w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost-1200x750.png 1200w, https://splice.com/blog/wp-content/uploads/2024/07/0624-What-is-house-music__BlogPost.png 1920w" sizes="(max-width: 250px) 100vw, 250px" /> What is house music? A guide to its history, artists, and subgenres Dive into the origins of house music, learn about its characteristic elements, and explore its enduring cultural impact. <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-250x156.png" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="oliver-production-tips-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-250x156.png 250w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-400x250.png 400w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-1024x640.png 1024w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-355x222.png 355w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-768x480.png 768w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-1536x960.png 1536w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-500x312.png 500w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-345x215.png 345w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost-1200x750.png 1200w, https://splice.com/blog/wp-content/uploads/2023/08/0823-Oliver-production-tips_BlogPost.png 1920w" sizes="(max-width: 250px) 100vw, 250px" /> Oliver on 3 key practices for making your best music yet Oliver took a moment with us to share some of the key learnings around making music that he’s gathered across the span of his career. <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2019/03/chromeo-studio-essentials-lede-250x156.png" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="how-chromeo-built-their-sound-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2019/03/chromeo-studio-essentials-lede-250x156.png 250w, https://splice.com/blog/wp-content/uploads/2019/03/chromeo-studio-essentials-lede-500x312.png 500w, https://splice.com/blog/wp-content/uploads/2019/03/chromeo-studio-essentials-lede-345x215.png 345w, https://splice.com/blog/wp-content/uploads/2019/03/chromeo-studio-essentials-lede-1200x750.png 1200w" sizes="(max-width: 250px) 100vw, 250px" /> How Chromeo built their sound Patrick “P-Thugg” Gemayel of Chromeo shares how the duo arrived to their sound over years of exploring diverse influences and discovering new gear.'''
