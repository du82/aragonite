title = "Audio Cable Types: A Complete Guide (With Pictures) - Blog | Splice"
description = "Learn about common audio cable types spanning TS, TRS, XLR, MIDI, USB, and more, and how you can use them effectively when making music."
full_description = '''Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Recording Audio cable types: A complete guide (with pictures) Working with music equipment can be confusing, especially when it comes to trying to figure out which audio cable types to use to connect instruments and hardware. In this in-depth guide, let’s demystify audio cable types by going over some of the most common options used in music production. We’ll also share tips on how to use them to help you feel more comfortable in the studio or recording at home. Let’s get started! Analog audio cable types The vast majority of audio cables carry sound using a continuous electrical voltage, which is what makes them analog in nature. Before we even get into the specific types of analog cables, you’ll want to know a bit more about the audio signals they can transmit. Balanced vs. unbalanced cables Analog audio cables fall into two main categories: balanced and unbalanced. Unbalanced cables have only two wires inside (a ground wire and a positive wire), which makes them more susceptible to outside interference and noise, especially as the cable length increases. Balanced cables, on the other hand, have three wires (a ground, positive, and negative wire), which allow for the removal of unwanted noise. One way to deal with the limitations of unbalanced cables is to use specialized hardware like a DI box to convert unbalanced audio into balanced audio. This will keep the sound quality high over longer distances. With that out of the way, let’s explore some of the most common analog cables below. 1. TS (“tip-sleeve”) <img decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-1024x640.jpg" alt="Image of TS (“tip-sleeve”) audio cables" class="wp-image-18052" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TSS.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> TS cables always carry unbalanced signals (due to the two wires mentioned earlier), so you’ll want to keep the cable length short or use a DI box. They’re usually ¼ of an inch wide, and can be identified by the single rubber ring near the tip of the connector. TS cables are mono, carrying a single channel of audio from instruments that produce unbalanced mono signals like electric guitars, effects pedals, and even some hardware drum machines or synthesizers 2. TRS (“tip-ring-sleeve”) <img decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-1024x640.jpg" alt="Image of TRS (“tip-ring-sleeve”) audio cables" class="wp-image-18051" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TRS.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> TRS cables can carry a balanced mono signal, or a balanced stereo signal if you use a pair of cables for the left and right channels. They’re often ¼ of an inch wide like their TS counterparts, and can be identified by the two rubber rings on the metal connector. TRS cables can also carry an unbalanced stereo signal if you use just one cable, with smaller ⅛-inch versions being common for connecting headphones to a computer or phone. TRS vs. TS While they share similarities in size and appearance, the TL;DR is that TS cables are used for unbalanced mono signals (like guitars), while TRS cables can be used for balanced mono signals as well as stereo signals (like headphones). They can visually be distinguished by their number of rings. 3. TT (“tiny telephone”) <img loading="lazy" decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-1024x640.jpg" alt="Image of (“tiny telephone”) audio cable" class="wp-image-18053" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_TT.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> Also known as bantam jacks, these cables are slightly thinner versions of the ¼-inch TS / TRS cables. They’re commonly used in recording studio patchbays or patchboards to quickly route audio between many different pieces of gear. 4. XLR <img loading="lazy" decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-1024x640.jpg" alt="Image of XLR audio cables" class="wp-image-18055" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_XLR.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> XLR cables will always carry balanced signals, which means you can get a nice and clean sound, even over long stretches of cable. Unlike TS and TRS cables, which can be pulled out by accident, these cables click into place. XLR is the connector of choice on most modern microphones, powered speakers, and even some instruments. 5. RCA <img loading="lazy" decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-1024x640.jpg" alt="Image of an RCA audio cable" class="wp-image-18050" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_RCA.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> RCA cables carry unbalanced signals and are usually paired up with a right/red and left/white channel to transport stereo audio. These cables are commonly used to connect turntables and mixers together for DJing, as well as a lot of consumer electronics like audio receivers and DVD players. They can also be used to transmit digital audio. Digital audio cable types While the cables above are almost exclusively used to transmit analog audio signals, it’s also worth mentioning some of the most common digital connectors that you might find yourself using. 1. MIDI <img loading="lazy" decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-1024x640.jpg" alt="Image of a MIDI cable" class="wp-image-18049" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_MIDI.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> MIDI (musical instrument digital interface) cables carry musical data including pitch, velocity, panning, and tempo. This allows one device (like a computer or keyboard) to send digital signals and control the musical output of another device, like a software or hardware synthesizer. MIDI can also be used to synchronize multiple devices so they all produce sound at the same tempo. 2. USB <img loading="lazy" decoding="async" width="1024" height="640" src="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-1024x640.jpg" alt="Image of a USB cable" class="wp-image-18054" srcset="https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-1024x640.jpg 1024w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-400x250.jpg 400w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-355x222.jpg 355w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-768x480.jpg 768w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-1536x960.jpg 1536w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-500x312.jpg 500w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-345x215.jpg 345w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-1200x750.jpg 1200w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB-250x156.jpg 250w, https://splice.com/blog/wp-content/uploads/2021/09/Splice_Cable_Guide_USB.jpg 1920w" sizes="(max-width: 1024px) 100vw, 1024px" /> USB cables can be used to power portable electronic devices and transport data, including MIDI information and digital audio (ex. through an audio interface). Many modern MIDI-enabled devices use USB cables instead of (or in addition to) the traditional five-pin connector above. Some other similar connectors to USB include Firewire and Thunderbolt. Audio cable types: Conclusion And there you have it! Hopefully this article gave you a foundational understanding on some common audio cable types and how to use them. How many different types of cables do you use for making music? Are there any important ones we missed? Start a conversation with us and an ever-growing community of music creators via the Splice Discord. Explore royalty-free sounds from leading artists, producers, and sound designers: Join Splice today for $0.99 February 5, 2025 audio technologyguitarmicrophonessynth <img alt='' src='https://secure.gravatar.com/avatar/6210453a06683c0f3f11a7040fba7ede?s=120&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6210453a06683c0f3f11a7040fba7ede?s=240&#038;d=mm&#038;r=g 2x' class='avatar avatar-120 photo' height='120' width='120' loading='lazy' decoding='async'/> Matteo Malinverno Matteo Malinverno is a New York-based music producer currently working on the Content team at Splice. Read More <img width="250" height="156" src="https://splice.com/blog/wp-content/uploads/2021/08/DI_Box_BlogPost-250x156.jpg" class="attachment-newstandard-related size-newstandard-related wp-post-image" alt="what-is-a-di-box-featured-image" decoding="async" loading="lazy" srcset="https://splice.com/blog/wp-content/uploads/2021/08/DI_Box_Bl'''
