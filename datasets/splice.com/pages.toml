full_description = "Try now Sounds Create Plugins Community Blog Pricing Login Skills Astraby Splice The inspirational polysynth with FM, wavetable, granular, analog, and sampler oscillator sources—plus limitless customizability, presets galore and deep integration with the Splice workflow. Try now Compatible with macOS and Windows.Available as VST3 and AU. Free with Splice Creator Plans Astra is included with every Creator and Creator+ Plan. To install Astra, click on the Apps & Plugins tab in the Splice Desktop app. Try now From rave stabs to radiant strings Astra’s collection of oscillator sources range from glassy FM and granular glitchiness to classic analog warmth. It crushes lead sounds and sub-shaking basses, and definitely holds its own with evolving arps and transformational FX. You can even use your own samples—for sound design that’s totally yours. Take your tracks to new sonic territory with Astra. Total control Personalize any existing Astra preset, or design sounds from scratch. Just drag and drop parameters to the four macros, name them what you want, and adjust multiple parameters in one motion. The Macro Sequencer lets you dial up the vibe, by assigning a step sequence to the macros—for trance-like patterns and hypnotic rhythms. “Astra’s versatility is so dynamic—with one knob I can transform something from a kick to a synth.” – Madame Gandhi Check out Madame Gandhi’s Astra presets Make your music move Astra’s Note Sequencer lets you program rhythmic, in-sync synth sounds that add mind-opening movement to your music. With customizable sequencer lanes for pitch, velocity and gate, you can create squelching acid lines from scratch, turn your samples into percussion loops, or create and recall rich arpeggios locked to the scale of your choice. Your wild polyphonic dreams are Astra’s one assignment. Creativity not complexity Astra’s 10-slot Modulation Matrix lets you assign intricate interactions between its different modules—just drag-and-drop parameters to Mod slots. Like a hardware synth, Astra can sweep, morph and transform, to add layers of creativity to your musical creations. Etch your mark on the music you make.Check out Astra presets from Neon Wave, Oliver and Parallax Thousands of presets. Zero distractions. Blow past creative slumps with Astra’s 225 factory presets and inspirational starting points for all kinds of music. And if you’re feening for more, fire up Splice Sounds and filter by Astra Presets to find over 8,000 additional presets, which you can now audition in your DAW without spending a single credit. Free with Splice Creator Plans Astra is included with every Creator and Creator+ Plan. To install Astra, click on the Apps & Plugins tab in the Splice Desktop app. Try now Sounds Plugins Tools Blog About Overview Browse the store Latest Posts Desktop App About Splice Browse the Catalog Rent to Own How to Make Music Community Download Splice Desktop Genres Free Plugins The 3 Levels of Sampling Innovation Mobile App Bridge Instruments Serum The Best Free Plugins Plans Beatmaker Splice For Students Trending Sample Packs Astra Newsfeed Community Spotlight Stories Skills Beatmaker VST Affiliates Whats New Create © 2024 Splice.com All Rights Reserved Terms of Use Privacy Policy Jobs Contact Help"
