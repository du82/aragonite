full_description = '''Splice - Privacy Policy Last revised and effective as of April 1, 2023 日本語 / 한국말 This “Privacy Policy” describes the privacy practices of Distributed Creation Inc. and our Corporate Affiliates (collectively, “Splice”, “we”, “us”, or “our”). This Privacy Policy describes how we collect, use, disclose and otherwise process personal information in connection with our websites, including, without limitation, splice.com (collectively, the “Website”), Splice’s digital applications (each, an “App”), and any services and resources available or enabled via the Website or Apps and associated software made available through the Website and Apps (collectively, with the Website and each App, the “Service”). This Privacy Policy governs any Service on which the Privacy Policy is posted. Distributed Creation Inc.’s Corporate Affiliates include Distributed Creation UK, Ltd., 3rd Floor 1 Ashley Road, Altrincham, United Kingdom WA14 2DT. If an organization with which you are associated (an “Organization”) signs up to use our Service, we may receive personal information about you in connection with our provision of the Service to your Organization. To the extent we process that personal information solely in order to provide the Service to your Organization, under the European Data Protection Laws, to the extent applicable, we will act as a processor (as defined in the European Data Protection Laws) on behalf of your Organization in respect of that personal information; this Privacy Policy will not apply to the processing of that personal information and your Organization will act as a controller (as defined in the European Data Protection Laws) in respect of that personal information and is responsible for obtaining all necessary consents and providing you with all requisite information as required by applicable law. To the extent we process your personal information for any other lawful business purpose of ours, under the European Data Protection Laws, to the extent applicable, we will act as a controller of such personal information and this Privacy Policy will apply to the processing of such personal information. You should be sure to read the important information provided here. This Privacy Policy serves to notify you of the following: Personal Information We Collect Cookies and Similar Technologies How We Use Your Personal Information How We Share Your Personal Information Your Choices Security International Transfers International Transfers under the Australian Privacy Act Other Sites and Services User Generated Content and Public Areas Third-Party Products and Services Changes to this Privacy Policy Contact Us Notice to California Residents Additional Information Regarding European Data Protection Laws Additional Information Regarding Canadian Privacy Laws Notice to Japanese Residents Notice to South Korean Residents Personal Information We Collect Information you give us “Personal information” is information that identifies you or can be used to identify or contact you. If the Australian Privacy Act 1988 applies, it also includes any other information or opinion about you that would not otherwise be personal information. Personal information that you may provide through the Service or otherwise communicate with us includes: Contact information, such as your first name, last name, address, and email address. Profile information, such as your username and password, unique user ID, artist name, gender, age, audio you create on the Service, your photograph, interests and preferences. Feedback and correspondence, such as information you provide when you report a problem with the Service, receive customer support, or otherwise correspond with us, including operating system and version as well as information about your digital audio workstation, or when you refer another person who might be interested in the Service to us. Transaction information, such as billing and payment information and details about purchases you make through the Service, records of Service purchased, purchase credits, date of birth (for age verification purposes), responses to our surveys, and information you provide when you enter into one of our contests or other promotions. Usage information, such as information about how you use the Service and interact with us, including information associated with any content you upload to the Service or otherwise submit to us through the Service, application crash data, and information you provide when you use any interactive features of the Service, as well as audio listening and creation preferences based on your usage. Marketing information, such as your preferences for receiving marketing communications and details about how you engage with marketing communications as well as inferences as to potential advertisements to serve. Please note that, as explained in the User Generated Content and Public Areas section of this Privacy Policy, we ask you not to include personal information in any files you upload to the Service or in the messages you exchange via the Service. If you choose to include personal information within those functionalities, we will not be able to limit the collection and use of that information by other users. Information automatically collected We may automatically log information about you and your computer or mobile device when you access our Service. For example, we may log your computer or mobile device operating system name and version, manufacturer and model, device identifier, IP address, browser type, screen resolution, the website you visited before browsing to our Website, pages you viewed, search queries, browsing behavior, advertisement performance metrics (clicks, impressions), including in connection with your interaction with our advertisements on third-party websites, how long you spent on a page, access times, time zone, general location information such as city, state or geographic area, postcode, and information about your use of and actions on our Service. We collect this information about you using cookies. Please refer to the Cookies and Similar Technologies section for more details. Sources of Information We will collect personal information that you submit to us. We may also receive personal information about you from third parties including third parties providing credit and debit card authorization and fraud screening services as part of your use of the Service. We may also passively collect information based on your use of the Service using cookies and pixel tags, as described below. Cookies and Similar Technologies What are cookies? We may collect information using “cookies.” Cookies are small data files stored on the hard drive of your computer or mobile device by a website. We may use both session cookies (which expire once you close your web browser) and persistent cookies (which stay on your computer or mobile device until you delete them) to provide you with a more personal and interactive experience on our Service. We use two broad categories of cookies: (1) first party cookies, served directly by us to your computer or mobile device, which we use to recognize your computer or mobile device when it revisits our Service; and (2) third party cookies, which are served by service providers on our Service, and can be used by such service providers to recognize your computer or mobile device when it visits other websites. Cookies we use Our Service uses the following types of cookies for the purposes set out below: Type of cookiePurposeEssential CookiesThese cookies are essential to provide you with services available through our Service and to enable you to use some of its features. Without these cookies, the services that you have asked for cannot be provided, and we only use these cookies to provide you with those services.Functionality CookiesThese cookies allow our Service to remember choices you make when you use our Service. The purpose of these cookies is to provide you with a more personal experience and to avoid you having to re-select your preferences every time you visit our Service.Analytics and Performance CookiesThese cookies are used to collect information about traffic to our Service and how users use our Service. The information gathered may include the number of visitors to our Service, the websites that referred them to our Service, the pages they visited on our Service, what time of day they visited our Service, whether they have visited our Service before, and other similar information. We use this information to help operate our Service more efficiently, to gather broad demographic information, monitor the level of activity on our Service, and improve the Service.We use Google Analytics for this purpose. Google Analytics uses its own cookies. You can find out more information about Google Analytics cookies here and about how Google protects your data here. You can prevent the use of Google Analytics relating to your use of our Service by downloading and installing the browser plugin available here.Social Media CookiesThese cookies are used to allow you to share information using a social media sharing button or “like” button on our Service or you link your account or engage with our content on or through a social networking website such as Facebook or Twitter. The social network will record that you have done this. See the Other Sites and Services section of this Privacy Policy.Targeted and advertising cookiesThese cookies track your browsing habits to enable us to show advertising which is more likely to be of interest to you. These cookies use information about your browsing history to group you with other users who have similar interests. Based on that information, third-party advertisers can place cookies to enable them to show advertisements that we think will be relevant to your interests while you are on third-party websites. In addition to Google, as described above, the Service may use third-party service platforms (including to help analyze how users use the Service). These third-party service platforms may place cookies on your computer or mobile device. If you would like to disable "third-party" cookies, you may be able to turn them off by going to the third party's website. Here are links to the main third-party platforms we use: https://www.google.com/policies/privacy/ https://privacy.microsoft.com/en-us/privacystatement https://www.facebook.com/policy/cookies/ https://help.instagram.com/1896641480634370/?helpref=uf_share https://www.tiktok.com/legal/cookie-policy?lang=en https://snap.com/en-US/cookie-policy https://rakuten.co.uk/cookie-policy https://help.hotjar.com/hc/en-us/articles/115011789248-Hotjar-Cookies https://www.braze.com/company/legal/privacy https://instapage.com/privacy-policy https://help.twitter.com/en/rules-and-policies/twitter-cookies For a complete list of third parties who deploy cookies on the Service, please contact us at support@splice.com. Online Tracking Opt-Out Guide Like many companies online, we may use services provided by Google, Facebook and other companies that use tracking technology. These services rely on tracking technologies – such as cookies and pixel tags – to collect directly from your device information about your browsing activities, your interactions with websites, and the device you are using to connect to the Internet. Information collected from some cookies placed on the Service is used to deliver advertisements to Splice Service visitors when such visitors are visiting other websites, including Facebook, Twitter, and Instagram. There are a number of ways to opt out of having your online activity and device data collected through these services, which we have summarized below: Blocking cookies in your browser. Most browsers let you remove or reject cookies, including cookies used for interest-based advertising. To do this, follow the instructions in your browser settings. Many browsers accept cookies by default until you change your settings. For more information about cookies, including how to see what cookies have been set on your device and how to manage and delete them, visit www.allaboutcookies.org. Note: if you do not accept our cookies, you may experience some inconvenience in your use of our Service. For example, we may not be able to recognize your computer or mobile device and you may need to log in every time you visit our Service. Blocking advertising ID use in your mobile settings. Your mobile device settings may provide functionality to limit use of the advertising ID associated with your mobile device for interest-based advertising purposes. Using privacy plug-ins or browsers. You can block our websites from setting cookies used for interest-based ads by using a browser with privacy features, like Brave, or installing browser plugins like Privacy Badger, Ghostery or uBlock Origin, and configuring them to block third-party cookies/trackers. Platform opt-outs. The following advertising partners offer opt-out features that let you opt-out of use of your information for interest-based advertising: Google: https://adssettings.google.com Facebook: https://www.facebook.com/about/ads Outbrain: https://my.outbrain.com/recommendations-settings Advertising industry opt-out tools.You can also use these opt-out options to limit use of your information for interest-based advertising by participating companies: Digital advertising Alliance: https://optout.aboutads.info Network Advertising Initiative: https://optout.networkadvertising.org/?c=1 Note that because these opt-out mechanisms are specific to the device or browser on which they are exercised, you will need to opt-out on every browser and device that you use. Pixel tags We may also use pixel tags (which are also known as web beacons and clear GIFs) on our Service to track the actions of users on our Service. Unlike cookies, which are stored on the hard drive of your computer or mobile device by a website, pixel tags are embedded invisibly on webpages. Pixel tags measure the success of our marketing campaigns and compile statistics about usage of the Service, so that we can manage our content more effectively. Do Not Track signals Some Internet browsers may be configured to send “Do Not Track” signals to the online services that you visit. We do not currently respond to do not track signals. However, if you wish to stop such tracking, please contact us with your request, using our contact details provided below. To find out more about “Do Not Track,” please visit https://allaboutdnt.com/. How We Use Your Personal Information To provide our Service If you have a Splice account or use our Service, we use your personal information to: operate, maintain, administer, promote, and improve the Service manage and communicate with you regarding your Splice account, if you have one, including by sending you Service announcements, technical notices, updates, security alerts, billing and account communications, and support and administrat'''
