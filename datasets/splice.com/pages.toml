["https://splice.com/blog/newsfeed"]
title = "The Splice newsfeed - Blog | Splice"
description = "Here, you’ll find the latest news from Splice on product updates and system improvements."
full_description = '''Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog News The Splice newsfeed Welcome to the newsfeed. Here, you’ll find the latest news from Splice on product updates and system improvements. Access to your Splice library—now in Studio One Pro 7 November 20th, 2024 The first update to the Splice x Studio One Pro Integration brings several key feature additions and improvements that will make your in-DAW Splice experience even better. Learn more on the blog. Splice is now in Studio One Pro 7 October 9th, 2024 For the first time ever, Studio One users can access Splice’s industry-leading catalog of royalty-free sounds and creative tools directly inside their DAW. Learn more on the blog. Certified Rare Finds are now on Splice July 18th, 2024 Rare Finds is our newest search feature on Splice Sounds that helps you find sounds that are still undiscovered by most users. Learn more on the blog. New in Create mode: Create a Stack with your own loop June 25th, 2024 With this game-changing new premium feature, you can now use Create to bring your own vocal, instrumental, and drum loops to life. Instantly discover Splice loops that match the key, tempo, and vibe of your own sounds—and conquer beat block for good. Learn more on the blog. Now you can share your Stacks March 19th, 2024 You can now swap musical ideas and collaborate with fellow creators with the latest update to Create mode. Learn more on the blog. The new Splice Mobile app: Discover sounds and Create ideas on the go March 5th, 2024 The latest update to our app allows you to browse the entire Splice catalog and organize your favorite sounds, discover hidden gems, and start countless new ideas with Create mode right in your pocket. Get the new Splice Mobile app today. We’ve added even more styles to Create mode, turned on self-serve invoices and updated our helpdesk February 14th, 2024 In our continuous effort to keep improving Splice, we’ve made several improvements: Create mode has four news genres to pick from, you can now generate your own invoices, and our helpdesk has been completely overhauled. Read more on the blog. Create mode updates, expanded search, and more—find out what’s new on Splice December 18th, 2023 We’ve been hard at work making Splice a more inspiring, empowering, and convenient place. Read our blog post about the latest updates to Create mode, more powerful search, and more options for logging in. Splice Desktop v5 is here November 1st, 2023 We’ve refreshed our Desktop app to bring you Splice’s inspirational Create mode, plus improvements to all the features that keep you in the zone. Read all about it on the blog. Find your spark in seconds with our update to Create mode October 11th, 2023 We’ve expanded Create mode so you can start musical ideas with 1.4 million of Splice’s world-class loops, from over 130 genres of music in different keys and tempos. Read all about it on the blog. We’ve updated our Create feature with undo, key detection, and Studio One export September 5th, 2023 We’ve updated the Create feature on our website, with new features including undo and key readout. Read all about it on the blog. Check out our new sounds discovery feature June 27th, 2023 The latest Splice feature, Create, uses AI to match sounds from across the Splice catalog to give you billions of musical combinations—and endless songstarters. Learn more here. We’ve improved Splice Desktop with M1 and M2 optimization and more June 15th, 2023 We’ve improved our Desktop app to bring Apple Silicon optimization, plus personalized browsing, license download, and Stacks preview. Read all about it. Higher audio quality in sample previews March 3rd, 2023 We’ve removed dynamics processing on Splice web and Desktop to make sample previews more true to life. Read more about it on the blog. Download samples directly from your web browser February 9th, 2023 We’ve rolled out a new feature that lets you download individual sounds from Splice using your web browser—just like you would any other file from the internet. Look for the download icon beside the samples in Your Sounds. It works on mobile, too. Read all about it on the blog. KORG’s KORG Collection 4 launches on Rent-to-Own January 31st, 2023 Expanding into KORG’s iconic sounds from the ‘70s through the ‘00s, KORG Collection 4 now includes the playful microKORG digital synth, the ELECTRIBE-R beatmaking tool, and the revolutionary KAOSS PAD touch-based effects processor. Learn more about all 14 classic tools and start a free trial here. Now you can generate a license for your sounds January 26th, 2023 We’ve made it possible to generate a certified license from the Splice website, in PDF format, so you can avoid confusing copyright headaches. Read our blog post to discover more about copyright and licensing, and find out how to generate a license. Similar Sounds live on Desktop January 12th, 2023 We recently made some updates to Similar Sounds, making it more visible, easier to use and more powerful—you can even run Similar Sounds on the results in the sidebar. We’re happy to announce that it’s live on the web and on Splice Desktop, so you’re never far from deep and inspiring sample discovery. Updated login options: Google sign in and more control of your Splice ID January 5th, 2023 We’ve rolled out some new features that make it easier to sign up, login, and control how you show up on Splice. Firstly, we’ve added ‘Continue with Google’ to the sign up and login options, so you can use your existing Google credentials to login to Splice or sign up for the first time. We’ve also made it possible to change your Splice username, so you can have more control over your identity on our platforms. Read all about it on our blog. Get personalized pack selections, daily December 13th, 2022 Recommended For You is the section on the Splice Sounds homepage that suggests packs you might like, based on the sounds you have previously downloaded. Now, they’re updated daily. Read more here. Arturia’s Pigments 4 launches on Rent-to-Own December 13th, 2022 Paint with every shade of synthesis in Pigments 4, the newly refreshed version of Arturia’s flagship synth, now on Rent-to-Own. Updated with a new Play Mode for straightforward sound design, drag-and-drop modulation workflows, and feature additions to sound engines, effects, and more, it’s never been easier to find your sound. Click here to learn more and start your free trial. CEO Kakul Srivastava on delivering Splice’s mission December 8th, 2022 Splice is here to help music creators bring their ideas to life. Our CEO Kakul Srivastava writes about how we’re listening to your feedback, improving our Sounds experience with new features, and making Splice a more fulfilling and creatively inspiring place. Read Kakul’s blog post here. We just made Similar Sounds more visible and easier to use December 1st, 2022 Since 2019, Similar Sounds has been empowering creators by enabling more inspirational searches, revealing more of Splice and uncovering the deepest cuts in the catalog. We just made some updates. Find out what’s new in this blog post. Kilohearts’ Phase Plant launches on Rent-to-Own November 28th, 2022 One of the production world’s favorite synths is now on Splice Rent-to-Own. Phase Plant’s semi-modular ecosystem has something for every producer or sound designer, letting you combine dozens of generators and effects in an intuitive, modulation-friendly sandbox. Try Kilohearts’ flagship synth for free here. New search improvements rolled out on Splice Desktop November 22nd, 2022 Our latest improvements to search are now available in Splice Desktop on Mac and PC. Just update your Splice Desktop app to the latest version to enjoy faster, more relevant searching on Splice. Find out more about the new search features. Search just got better—find out what’s new November 9th, 2022 We rebooted our search experience to make searching faster and more relevant, with better navigation. Now, you’ll see more tags, numbered search result pages, increased variation in results, and better randomization—perfect for sparking your creativity in unexpected ways. In short, you’ll get to the sounds you want quicker, while also discovering more of the Splice catalog. Read more here. Try Splice Sounds for free with zero-credit Collections November 1st, 2022 Our Free Sounds Collections of zero-credit samples let non-subscribers download and use a selection of top-quality sounds across genres and styles, including R&B, soul, hip hop, trap and guitar. Just start a trial, get Splice Desktop, and download the samples you like and drag-and-drop into your DAW. These zero-credit Collections aren’t just for trialists though—subscribers get access to them too, all for free. Discover more about Collections here. Export directly to Ableton Live with CoSo November 1st, 2022 Users of CoSo, our music discovery app for iOS and Android, can now export their Stacks to Ableton Live, thanks to a free new update. Just tap Export to Ableton Live in the intended Stack in CoSo, then hit ‘Open Session’ on the Stack in Splice Desktop. A new Ableton Live Session will open up, containing all the samples from your Stack, plus pitch, volume and tempo settings. It’s the quickest way from idea to a DAW. Check out CoSo here. February 21, 2023 pluginsre