title = "The 10 Best Music Education YouTube Channels - Blog | Splice"
description = """
Harrison Shimazu
 \t\t\t\tHarrison Shimazu is a composer, content strategist, and writer who’s passionate about democratizing music creation and education. He leads the Splice blog and produces vocaloid music as Namaboku."""
full_description = '''Categories Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Tips & Tutorials Mastering Mixing Music Theory Recording Sampling Sound Design Tools All Tips & Tutorials DAW Ableton Live Bitwig Studio Cubase FL Studio GarageBand Logic Pro Studio One All DAWs Beyond the DAW Inspiration Music Promotion All Guides Stories Artist Interviews Features News All Stories All Posts Try Create Join Splice for $0.99 Search our blog Back to blog Tips & Tutorials 10 music education YouTube channels you need to subscribe to One of the (daunting but) most exciting aspects of music creation is that there’s always more to learn. Below, we’ve compiled 10 YouTube channels (in no particular order) that have demonstrated that they’re committed to helping people learn more about music, and do a great job at doing just that. From music theorists and instrumentalists to production experts and veteran audio engineers, we tried to include people that specialize in a wide range of fields so there’s something for everyone. Let’s dive in! 1. Adam Neely Adam Neely is a very popular figure within the world of YouTube music education, and with good reason. He covers a wide array of ostensibly complex concepts on his channel from microtonality to odd time signatures, but does so in a way that’s wonderfully engaging and surprisingly accessible. His inquisitive tone, well-researched scripts, and sprinkle of humor and playfulness make his channel a great place to learn something new, for beginners and experts alike. 2. Nahre Sol Nahre Sol is an incredibly skilled pianist, composer, learner, and educator. Her channel features a few different recurring series such as How to Sound Like and Genre Exploring, which are all simultaneously calming and extremely informative. If diving into all sorts of topics in music through the lens of a classical piano virtuoso sounds appealing to you, Nahre Sol’s channel is sure to be a fun ride. 3. 8-bit Music Theory If you’re a fan of video games and music composition, 8-bit Music Theory will most likely become your new favorite YouTube channel. Each video examines a specific piece of music or soundtrack(s) from a video game franchise, and explores what makes it tick. With videos on major titles like Pokémon and The Legend of Zelda to indie highlights like Celeste and Hollow Knight, there’s something for every video game fan out there to enjoy. 4. Berklee Online Accessible and career-focused, Berklee Online is among the most innovative and respected providers of worldwide music education. Their YouTube channel gives a taste of what their courses have to offer, with in-depth breakdowns of a wide array of topics spanning everything from DAW techniques and vocal performance to career development and music video production. 5. Andrew Huang Featuring everything from discussions and instrument explorations to creative challenges and original tunes, Andrew Huang easily has one of the most eclectic music-based channels on YouTube. While not every single video is explicitly focused on music education, he absolutely deserves a spot on this list because teaching and learning are such strong through lines across everything he creates. 6. In The Mix In The Mix is a channel operated by Michael Wynne, an audio engineer based in Scotland who’s dedicated to helping musicians better understand topics in recording, production, mixing, and mastering. His relaxed approach and effective use of contextual examples makes Wynne a standout presence in the music production education community. 7. Make Pop Music Another great channel in the realm of music production is Make Pop Music. A typical video on the channel features producer and engineer Austin Hull exploring the signature sounds and characteristics of a popular artist or genre, but what makes his tutorials stand out is that the concepts are all applied to an original track. If you’re looking for fun, engaging content that also helps you level up your production chops, Make Pop Music is definitely worth checking out. 8. Mary Spender Mary Spender is a UK-based guitarist, vocalist, and songwriter. On her channel, she explores an expansive array of topics spanning everything from songwriting and gear to music career and content creation insights. Her magnetic disposition and introspective dialogues are sure to keep you coming back to her channel. 9. Trevor Wong If guitar is your preferred instrument for learning music, Trevor Wong is a great educator for all of your harmonic needs. His videos primarily explore chord voicings and progressions through the perspective of math rock and emo, but the nuanced, emotive sounds he often showcases can be applied to any other instruments and genres of your choosing. 10. Splice Last but not least, we have to give ourselves a little love! Check out the Splice YouTube channel for in-depth tips and tutorials, production breakdowns from leading producers, and more—you won’t regret it. Are you already subscribed to some of these YouTube channels? Did we miss any of your favorites? Start a conversation with us and a community of other music creators via the Splice Discord. Explore royalty-free sounds from leading artists, producers, and sound designers: Join Splice today for $0.99 February 2, 2024 compositionyoutube <img alt='' src='https://secure.gravatar.com/avatar/208af1495724cce6967f47553c4b971a?s=120&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/208af1495724cce6967f47553c4b971a?s=240&#038;d=mm&#038;r=g 2x' class='avatar avatar-120 photo' height='120' width='120' loading='lazy' decoding='async'/> Harrison Shimazu Harrison Shimazu is a composer, content strategist, and writer who’s passionate about democrati