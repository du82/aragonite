["https://splunk.com/en_us/customers/success-stories/puma.html"]
title = "PUMA | Customer Success | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "PUMA lacked insight into customer orders on its e-commerce websites, which led to poor customer experience and missed sales opportunities. With Splunk Cloud Platform, PUMA now monitors events as they happen, performs quick investigations and rectifies problems before they prevent customers from making purchases online. Because global sports and apparel brand PUMA’s previous systems couldn’t detect customer order problems on its 45 e-commerce sites, the company was losing tens of thousands of dollars in missed sales every hour. Each time a customer’s purchase failed, it also damaged the brand’s reputation and customer loyalty that PUMA has earned since its founding in 1948. PUMA turned to Splunk for a solution. Using Splunk Cloud Platform and the AIOPS Monitoring solution from partner AIOPSGROUP, the company reduced the average time to detect issues from hours to minutes, and gained the insights it needed to fix problems and ensure a smooth buying experience for its online customers. Before using Splunk, PUMA’s basic monitoring capabilities could only indicate whether its e-commerce sites were up or down. This meant DevOps and business teams couldn’t detect critical issues that caused failed orders, such as unresponsive inventory systems or declined credit cards. The result was a significant number of missed sales opportunities. Michael Gaskin, senior DevOps manager for global e-commerce at PUMA, had used Splunk at a previous job — and knew it could help. “If we could get our order information from Salesforce Commerce Cloud, which was running on our web server, into Splunk, we could set up automatic alerts about conditions that impacted customer orders and revenue,” he says. Gaskin found a solution with Splunk partner and e-commerce consultant AIOPSGROUP. The partner’s AIOPS Monitoring solution collects data from Salesforce Commerce Cloud and ingests it into Splunk Cloud Platform, where it can be analyzed and presented in dashboards and alerts. Now, PUMA teams have access to metrics on both failed sessions and failed orders. They know whether something is an isolated issue that affects only one customer or if it’s a widespread issue that will significantly impact revenue. “We’ve decreased our average time to detect issues to 15 minutes with AIOPSGROUP and Splunk, compared to hours previously,” says Gaskin. “And because we also know exactly where the issue lies, we can escalate and fix the issue quickly and effectively.”"
year_published = 2025
