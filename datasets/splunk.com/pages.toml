["https://splunk.com/en_us/customers/success-stories/john-lewis.html"]
title = "John Lewis | Customer Success | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "The company’s brand is synonymous with customer service and trust. John Lewis needed a solution that would give it operational visibility across its entire infrastructure, enable it to address issues before they could hurt the company's reputation for superior customer service and support rapid growth for its billion-pound website, johnlewis.com. Since deploying Splunk Enterprise, the company has seen benefits, including: For John Lewis, uptime is critical because of the direct impact on sales. Any delay in resolution can negatively impact customer experience and revenue, especially on the website. In order to troubleshoot, the IT team used custom scripts and multiple monitoring tools. However, with limited staff resources, support requests had to be prioritized, leading to slower responses. The team couldn’t proactively detect and correct anomalies. In some cases, they were constrained in identifying crucial issues quickly, occasionally resulting in lost revenue. John Lewis has a multi-site architecture, with each of its two datacenters using Splunk forwarders to collect data from multiple sources for indexing. This indexed data is then accessed via Splunk search heads with job servers for scheduled tasks and processes. John Lewis also uses Splunk DB Connect to augment its machine data with structured data from relational databases. John Lewis initially deployed Splunk software for alerting, direct searching and graphing. Since launching its new e-commerce platform, John Lewis has been using Splunk Enterprise for highly complex analytics, including trend analysis, visualizations, customer behavior modeling, incident analysis, problem management and complex alerting. Splunk dashboards provide Operational Intelligence, along with views into the overall health of the website. At John Lewis, customer experience is more than just words; it’s a belief, and Splunk has helped us to better understand, and improve, the experience we offer our customers. Using Splunk Enterprise, John Lewis discovered that its customers' interactions with the new website were not necessarily linear. The team was able to provide insights to the business on how customers were actually navigating the site, enabling John Lewis to make changes that optimized search and have led to a more streamlined and user-friendly website."
year_published = 2025
clearnet = "https://splunk.com/en_us/customers/success-stories/john-lewis.html"
