title = "Splunk  Cloud  Security  Addendum | Splunk"
description = "This Splunk Cloud Security Addendum sets forth the administrative, technical and physical safeguards Splunk takes to protect Customer Content in Splunk Cloud."
full_description = "This Splunk Cloud Platform Security Exhibit (CSE) sets forth the administrative, technical and physical safeguards Splunk takes to protect Confidential Information, including Customer Content, in Splunk Cloud Platform (Security Program). Splunk may update this CSE from time to time to reflect changes in Splunk’s security posture, provided such changes do not materially diminish the level of security herein provided. This CSE is made a part of your Splunk General Terms (Agreement) with Splunk and any capitalized terms used but not defined herein shall have the meaning set forth in the Agreement or Documentation, as applicable. In the event of any conflict between the terms of the Agreement and this CSE, this CSE will control. This CSE does not apply to Splunk Cloud Platform subscriptions purchased or acquired through Splunk.com, including without limitation Trial or Beta Services , or to on-premise component(s) of hybrid offerings. 1.1 This CSE describes the information security standards that Splunk maintains to protect Confidential Information, including Customer Content, in addition to any requirements set forth in the Agreement. 1.2 The CSE is designed to protect the confidentiality, integrity and availability of Confidential Information, including Customer Content, against anticipated or actual threats or hazards; unauthorized or unlawful access, use, disclosure, alteration or destruction; and accidental loss, destruction or damage in accordance with laws applicable to the provision of the Service. 2.1 Scope and Content. Splunk Security Program: (a) complies with industry recognized information security standards; (b) includes administrative, technical and physical safeguards designed to protect the confidentiality, integrity and availability of Confidential Information, including Customer Content; and (c) is appropriate to the nature, size and complexity of Splunk’s business operations. 2.2 Security Policies, Standards and Methods. Splunk maintains security policies, standards and methods (collectively, Security Policies) designed to safeguard the processing of Confidential Information, including Customer Content, by employees and contractors in accordance with this CSE."
