["https://splunk.com/en_us/customer-success/cx-interactive-video.html"]
title = "Interactive Video | Splunk"
full_description = '''Start Skip Intro Welcome, explorer! I'm from Splunk Customer Success, your best resource for navigating the Splunk universe and achieving total digital resilience. Ready for your mission? Let's Go! Back to Start Your Mission: Achieve digital resilience before your spaceship runs out of fuel. Badges = fuel. To power your rocket you need to earn badges by completing missions and gaining knowledge. How do I complete a mission? Start exploring! Back You'll find a new mission in each quadrant to collect knowledge and power your rocket to new heights. Check your progress with this bar at the top of the screen. Next Back to Start Tap "Homebase" on your control panel to return to the main map. Got It Back Click to Launch! Start Over You've been sucked into a mysterious space vessel, far from your fleet. The control panels are alien to you. To make sense of them, head to the Essentials Hub. Got It Back to Home Base Essentials Hub New to Splunk? Start with the Essentials Hub, a Customer Success microsite where you'll find the most essential resources to get started. Great, let's start there! Congratulations! You have the essential knowledge to work the control panels. Sweet! Splunk Lantern You still need to navigate your way out of the vessel! What would you like to do? Get step-by-step guidance on Lantern Extend capabilities with Splunkbase Yikes! Splunkbase super-boosted your ship's capabilities before you knew where you were going! You've spun out of control and into a black hole.Let's try that again. Get step-by-step guidance on Lantern Good call! Splunk Lantern is here to light the way... Tell me more! Splunk Lantern is here to light the way with step-by-step articles to solve specific challenges – all written by Splunk experts. Tell me more! Working on use cases? Check out the Security & Observability Use Case Explorers for prescriptive guidance. Got it! × Splunkbase You've nailed the basics and solved your navigation challenge, now you're ready for a boost! Go to Splunkbase to download apps and add-ons to extend capabilities with more visualizations, analysis, and tools to streamline data ingestion. Extend my capabilities with Splunkbase! Congratulations! You've super-boosted your ship's capabilities. Got it! × Pro Tip: Head to the Community Slack to see how other people are extending the Splunk Platform with apps and addons. Will do! Continue Your organization has noticed an influx of malicious activity coming from Planet X. Hunt the security threats to save your people! Let's do it! Back to Home Base Tech Talks Tech Talks are deep-dive webinars where practitioners like you can dive into new use cases and stay on top of Splunk's latest capabilities. Sounds great, let's start there! Congratulations! You understand how to implement your use case and you're well on your way... Got it! × Community Office Hours Let's try that again... Oh no! While getting your security data in, a meteor hit one of your main engines. You have a full outage! What would you like to do? Ask the experts at Community Office Hours Nothing. A little unexpected downtime is fine... Good choice! You quickly join the next Community Office Hours session where you get live, personalized help from technical Splunk experts. You saved the day! Next Splunk Education & Training Now that you've successfully hunted the security threats, you can now empower the rest of your organization with the knowledge and training they need to drive digital resilience. Empower my org with Splunk Education & Training! But why stop there? Join a local Splunk User Group to continue your learning journey with peers, build your network, and find mentors. Will do! Continue You've landed on Planet Cloud Migration On this planet you can explore the various tools and resources that will help you boost your journey to the AI-powered Splunk Cloud Platform delivered as-a-service. Got It Back to Home Base Cloud Value Whether you're looking to build a hybrid world or are ready to go all in on cloud, Splunk Cloud Platform provides a resilient foundation to unify your security and observability practices. Tell Me More! × By migrating to Splunk Cloud Platform (SaaS) you can enjoy the benefits of speed, scale, and security. Gain $1.1M in additional revenue savings per year Free up 35% of your admin time to focus on high-value tasks Reduce 70% security risk of a data breach, IP theft and fraud (Source: splunk.com/cloudmigration) Discover Your Cloud Value Estimate Building a whole new world on Planet Cloud Migration means you have a lot to consider. To make it easy we have created a new Splunk Cloud Platform Value Calculator. Next × You can use the Splunk Cloud Platform Value Calculator to assess the value of transitioning your deployments to cloud vs running on-prem and/or self-managed in cloud. Got it! Migrate to Cloud Wondering where to get started? Engage with Splunk's Cloud Migration solutions page to discover the right tools, services and resources you need to accelerate your journey to the cloud with success. Tell Me More! Hear from Pacific Dental Services on how Splunk Cloud Platform changed their organization's business outcomes by delivering more than 40% in efficiency gains. Next To accelerate your journey to cloud follow the guided path on Splunk Lantern to migrate to Splunk Cloud Platform with success. Tell Me More! Splunk Lantern provides a step-by-step guide on how to migrate to Splunk Cloud Platform. In addition, it contains recommendations on best practices, tutorials for getting started, and troubleshooting information for common situations so your journey to building a resilient cloud is fast, smooth and easy. Got it × × Maximize Cloud Value People often think that cloud migration is sluggish, but on this planet Splunk has created the Cloud Adoption HUB launch pad curated with the most essential resources and guides to maximize your cloud value realization. Tell Me More! At the Cloud Adoption HUB you will get key cloud migration and adoption content, be able to view the essential tools and resources, discover the use cases and leverage actionable videos to maximize your value realization with Splunk Cloud Platform. Got It × Continue Welcome to the Expert Guidance quadrant. Here you'll learn how to: Call in the experts from Professional Services for a comprehensive solution to any engine troubles you have along the way. Access Success Plans. They're available at any point on your journey with tools and resources to keep you moving forward. Get help with issues at any point in your mission with Splunk Support Experts. Got it! Back to Home Base Support It's always easier to fly a rocket ship with a copilot. That's where Splunk Support comes in. We help to: Resolve issues Answer questions And to keep your universe running smoothly Tell Me More! For instance, we'll show you how to use Machine Learning detections to: Reduce noise Detect more threats Identify risk Got It Success Plans Every space cadet knows you shouldn't explore the stars without a plan. Get a plan designed specifically for you to build value throughout your journey. Next Get technical guidance and support Access OnDemand Services And grow your knowledge with Splunk Education to help every member of your crew be the best that they can be Got it! Professional Services When you are hunting threats around your solar system or monitoring the next capsule launch sometimes you need to call in experts to help you build a path with: Next Strategic guidance to help develop your crew's technical knowledge and best practices Advisory services, tools and resources to prevent security and operational threats that can cause major interruptions to your ecosystem Curated solutions delivered by experts with hands-on deployment knowledge to drive digital resilience across your systems Got it! Explore how our experts can guide you on your journey to digital resilience. Got it! × Continue'''
