["https://splunk.com/en_us/about-splunk/leadership.html"]
title = "Leadership | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "Leadership Being a data platform leader requires more than market-leading technology, it requires some of the best minds in the industry. Splunk's executive team and board are leading the charge, helping Splunk and its customers get the most out of their data. Being a data platform leader requires more than market-leading technology, it requires some of the best minds in the industry. Splunk's executive team and board are leading the charge, helping Splunk and its customers get the most out of their data. Gary Steele is Cisco’s President, Go-to-Market, leading a unified organization across Cisco’s Sales, Partner, and Global Marketing teams to accelerate customer outcomes and drive growth across the enterprise. In addition, Gary leads Splunk at Cisco. A highly regarded technology executive with over 30 years of experience, he has a proven track record of successfully scaling SaaS operations and growing multi-billion dollar global enterprises. Prior to joining Splunk, Gary was the founding CEO of Proofpoint, where he led the company’s growth from an early-stage start-up to a leading, publicly traded security-as-a-service provider. He previously served as CEO of Portera and held various leadership roles at Sybase, Sun Microsystems and Hewlett-Packard. Gary has also served as a member of the board of directors of Upwork, a talent freelancing platform, since 2018. He holds a B.S. from Washington State University. Tom Casey is the Senior Vice President, Products & Technology for Splunk. With over 25 years of experience, Tom is responsible for evolving Splunk’s market-leading unified security and observability platform. Prior to joining Splunk, he served as Senior Vice President, Engineering at DocuSign, where he led the company’s product strategy, including development, execution and delivery of all products worldwide. Prior to DocuSign, Tom served as Vice President, Platform and Infrastructure at Apptio, where he helped scale the Company’s SaaS platform from a single offering to a multi-product portfolio. Before that, he spent 16 years at Microsoft in a number of leadership positions in product and engineering. He holds a B.S. from the University of Arizona."
