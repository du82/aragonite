title = "Executive Opportunities | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "Executive Leadership Making an impact for employees and customers We’re fortunate to be guided by thought leaders who champion Splunker development and help our customers build digital resilience. Leaders at Splunk play a critical role in shaping our business and strengthening our unique culture. As some of the best minds in the industry, they help us transform and scale with vision. Play an active role in bringing resilience and innovation to today’s top organizations. Our world-class security and observability solutions are changing the industry — and so can you. With nearly 25 years of experience, Claire Hockin leads all aspects of the global marketing organization to build reputation, engagement and demand for Splunk. The driving force of Splunk’s culture is our ‘Million Data Points’ philosophy encouraging every Splunker to embrace the experiences, beliefs and passions that make us unique. The learning and inspiration I’ve gained from hearing so many different Splunker stories has been a true career highlight. With over 30 years of experience, Toni is responsible for championing customer experience while fostering a customer-first mindset and culture across Splunk. Customer experience starts with every employee, and spreading that philosophy across Splunk is critically important to me. My passion is our people, and my transparent leadership style focuses on building a culture of trust, with the goal to enable all Splunkers to take care of our customers. I am excited to be a part of Splunk’s next chapter as an official Cisco company. This team is inspired and pumped to head into an opportunity of a lifetime. Together, we’ll help power and protect the AI revolution. I’m proud to be part of our world-class project experience org that builds and designs products to inspire and enable users to achieve their needs with deep empathy for our users. Get access to executive takes on the latest cybersecurity, IT and engineering trends, directly from the minds of Splunk’s industry leaders. Stay in-the-know on the ever-changing landscape of technology with our growing library of podcasts, articles and unique insights."
