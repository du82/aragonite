full_description = "Security Splunk Asset and Risk Intelligence Proactive risk mitigation through continuous asset discovery and compliance monitoring. Take a Guided Tour Watch the Video Splunk Asset and Risk Intelligence provides a unified, continuously updated inventory of assets and identities by correlating data across multiple sources—including network, endpoint, cloud, and scanning tools. The solution provides accurate asset and identity context to focus and shorten investigations so security teams can quickly identify who is associated with what assets and when. Identify and close gaps in security controls and validate compliance status with out-of-the-box and customizable dashboards and metrics. Accelerate investigations with accurate asset and identity context, identify gaps in compliance, and reduce risk exposure. Leverage the rich data in the Splunk platform to continuously discover, monitor and build an accurate inventory of assets and identities — including endpoints, servers, users, cloud, OT/IoT, and more. Reduce the time spent pivoting to other systems to understand the assets involved in the attack and the potential risk to the organization, saving hours of effort and driving more complete and thorough investigations. Gain more context to assets discovered by correlating data from vulnerability and software scanning tools to inform you about what software and vulnerabilities exist on your systems. Utilize out of the box or custom compliance metrics such as laptop encryption, vulnerability scanning coverage, application enforcement, malware protection, and more to report on real-time compliance against security controls. Continuously update and populate the Splunk Enterprise Security Assets & Identities framework with the latest asset information, and provide comprehensive asset context for notable event enrichment. Update ServiceNow asset records with what is being actively discovered by Splunk Asset and Risk Intelligence. Identify unmanaged devices that are not in ServiceNow and populate the CMDB to ensure they are managed."
