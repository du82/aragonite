["https://splunk.com/en_us/customers/success-stories/carrefour.html"]
title = "Carrefour | Customer Success | Splunk"
description = "With Splunk Cloud Platform, Carrefour better protects its business and improves customer experience with insights into system performance and faster security response times."
full_description = "Although Carrefour spent significant resources maintaining legacy infrastructure and detecting security events, it’s sometimes complicated to provide the multi-channel experience customers expect. With Splunk Cloud Platform, Carrefour better protects its business and improves customer experience with actionable insights into system performance and faster security response times. The eighth-largest global retailer, Carrefour has superstores in Europe, South America and Asia. It knows customers expect the same convenience online as in-store, whether ordering via the mobile app or getting “click and collect” deliveries. To improve customer experience across its online shopping channels, Carrefour embraced a digitization strategy that includes taking advantage of cloud-based services. With Splunk Cloud Platform, Carrefour now has the agility to focus on developing new features and services. Splunk Cloud Platform also simplifies security, so customers can shop safely. Using real-time insights from Splunk, Carrefour now responds three times faster to security threats and makes smarter decisions about preventing incidents. Operating a complex infrastructure based on a legacy data center, Carrefour’s Security Operations Center (SOC) team previously spent significant amounts of time and effort managing systems — rather than focusing on protecting the business from malware. By centralizing security analysis and integrating multiple data sources, Splunk Cloud Platform has significantly improved the SOC team’s ability to respond to incidents in real time. “Splunk Cloud Platform handles all of our logs, whether from our antivirus software or endpoint detection and response,” says Romaric Ducloux, SOC analyst at Carrefour. “Splunk raises the alert, opens a ticket and contacts the on-call SOC analyst. It’s the cornerstone of our security operations.” Using the cloud model means Splunk manages security operations and infrastructure, so Carrefour’s SOC team has more time to focus on application management, threat analysis and security investigations. The team can now intervene during incidents before they cause damage to systems or affect customers. In the event of a breach, it gathers information about what went wrong so it can improve its systems in the future."
