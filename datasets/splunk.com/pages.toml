["https://splunk.com/en_us/customers/success-stories/singapore-airlines.html"]
title = "Singapore Airlines | Customer Success | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "Award-winning Singapore Airlines needed continuous high service availability across its complex systems to support its digital transformation efforts and continuously improve passenger experience. With full-stack visibility thanks to Splunk, Singapore Airlines can now find and fix issues faster — maximizing service uptime, optimizing customer experience and keeping the brand’s reputation sky-high. Singapore Airlines (SIA), the national carrier of Singapore, is best known for its impeccable service standards — delivering timely, seamless experiences to customers since 1972. With the shift towards digitalization, SIA continuously innovated despite the COVID-19 pandemic to update and enhance customer-facing interaction channels, including its self-service kiosks, mobile application, website and in-flight services. The goal: Ensure customer interactions with the airline are as seamless as possible. To enable this, SIA deployed Splunk as their Operational Data Analytics (ODA) platform. This platform aggregates logs from many of SIA’s critical customer-facing applications in real time, providing IT staff with a centralized place for data viewing, correlation, analysis and reporting. SIA wants to make it easy for customers to search, book, monitor and modify their travel plans via the airline’s mobile applications and website — whether that’s changing seats, tracking flight status, stating a meal preference or upgrading to business class — before their flight. They also aim to ensure that customers have a seamless experience when checking in using either digital channels or self-service kiosks. Customers can easily complete their check-in process in slightly over a minute at any time of the day, skipping potentially long queues. During the flight, SIA also offers a full array of service experiences, from an in-flight entertainment system to seatback shopping and Wi-Fi connectivity. To ensure these services are up and running around the clock, Splunk’s ODA platform monitors all these systems, providing the IT support team with insights and tools to view, resolve and even predict issues. With the ability to easily retrieve session-relevant information during issue investigations, teams have improved mean time to resolution (MTTR) and deliver better uptime for these customer interaction channels."
year_published = 2025
