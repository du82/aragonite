full_description = "Environmental sustainability Our holistic approach to environmental sustainability includes how we operate our business, how we help our customers and suppliers make progress toward their sustainability goals, and how we do our part to help the world adapt to a changing climate. Strategy, goals, and emissions data We are accelerating the transition to clean energy, evolving our business to circular, and investing in resilient ecosystems. Environmental compliance We maintain compliance with applicable environmental laws, regulations, and other obligations. Clean energy transitions We invest in renewable energy, support suppliers in their clean energy transitions, and apply our technology to connect clean energy and digitize the grid. Circular transformation Central to the concept of a circular economy is maintaining assets at their highest and best use for as long as possible. We apply circular design principles and improve the energy efficiency of our products to reduce our environmental footprint. Resilient ecosystems For Cisco, investing in resilient ecosystems includes enabling communities to adapt to climate realities, cultivating skills and talent for the regenerative economy, and protecting and restoring ecosystems and biodiversity. Cisco solutions driving sustainability We embrace our opportunity to help customers, suppliers, and partners reduce their environmental impacts. Cisco’s digital technologies can help reduce greenhouse gas emissions, improve resource efficiency, and enable circularity in business models."
