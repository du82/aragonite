["https://splunk.com/en_us/customers/success-stories/manpowergroup.html"]
title = "ManpowerGroup | Customer Success | Splunk"
description = "Splunk helps ManpowerGroup make better decisions and increase its resilience as it finds meaningful employment opportunities for people around the globe."
full_description = "All Customer Stories ManpowerGroup Employs Splunk to Deliver Insights 60x Faster and Ramp up Global Security ManpowerGroup’s complex global organization made security challenging and expensive with manual routines that took time away from mission-critical work. With Splunk, ManpowerGroup has instant access to data that supports better decision-making, keeping the company resilient as it works to find meaningful employment opportunities for associates around the globe. ManpowerGroup is a people-driven staffing company that puts over 600,000 associates to work each day — an astounding number, considering the ripple effect created by over half a million people having meaningful and sustainable employment. Serving customers and employers in over 70 global territories, ManpowerGroup maintains a hometown feel, centering its mission and daily operations around the power of work to change people’s lives. Organizationally, the company is a matrix of business units, multiple brands, offices and regions. “The biggest challenge we face is complexity,” says ManpowerGroup CISO Randy Herold. “That complexity translates into the business and makes some of our operations more challenging, risky and expensive.” To continue delivering on its promise and keep people at the heart of its business, ManpowerGroup turned to Splunk as part of a strategic evaluation of its tools and processes. The resulting partnership has helped the organization pivot toward a more secure, resilient future of “doing well by doing good” — for its clients and associates, and as an organization ManpowerGroup actively seeks opportunities to provide ever-better service to clients around the world. But as the company grew, so did the complexities across its infrastructure — it could take longer than a month for critical security and infrastructure data to make it into the right stakeholder’s hands. “I was buried under spreadsheets and formulas,” says Mike Friedel, ManpowerGroup’s director of global information security. “That was a chronic problem. In today’s security world, you can’t wait that long. You can’t wait 30 days.”"
