["https://splunk.com/en_us/customers/success-stories/rappi.html"]
title = "Rappi | Customer Success | Splunk"
description = "Rappi fixes issues 90% faster while handling a 300% surge in on-demand orders with real-time visibility into app and website performance via Splunk Observability Cloud."
full_description = "To keep up with skyrocketing demand for its delivery services during the pandemic, Rappi needed scalable, powerful observability tools to ensure customers could place and receive orders quickly and reliably. With the Splunk platform, Rappi meets high shopper expectations for smooth ordering via mobile apps and websites, enabling fast delivery of local goods and services to doorsteps in nine countries. The answer is simple: Rappi. In more than 250 cities throughout Latin America, Rappi offers consumers on-demand delivery of restaurant meals, groceries and other goods and services from local merchants. Founded in 2015, the company has expanded into travel and financial services as it grows its business across Argentina, Brazil, Chile, Colombia, Costa Rica, Ecuador, Mexico, Peru and Uruguay. Throughout the years, Rappi has risen to customers’ expectations for speed and convenience — from offering reliable performance for its mobile apps and website to delivering merchandise fast, often in under 30 minutes. But as orders skyrocketed 300% during the COVID-19 pandemic, maintaining both speed and availability became a mounting challenge for Rappi’s IT team. Prior to 2019, Rappi’s AWS hosts numbered in the hundreds. As its environment grew, the DevOps team encountered serious problems with its legacy application performance monitoring software. Alerts took minutes to receive, and the legacy tool’s insufficient sampling methods made it difficult to pinpoint issues. Once identified, those problems could then take hours — or even longer — to fix. To fuel growth and resilience, Rappi turned to Splunk Observability Cloud for a more robust approach to infrastructure monitoring and troubleshooting, application performance monitoring, real user monitoring and synthetic monitoring. “The more complex our architecture became, the harder it was for us to detect problems,” says Alejandro Comisario, executive vice president of engineering at Rappi. But by switching to Splunk Observability Cloud, Rappi has end-to-end visibility into its distributed microservices-based architecture, which includes Amazon Elastic Container Service and Kubernetes clusters. With a more agile approach and real-time observability from Splunk, the Rappi IT team now efficiently manages more than 1,000 microservices, 6,000 hosts and 15,000 containers — all while slashing mean time to resolution (MTTR) by over 90%."
year_published = 2025
