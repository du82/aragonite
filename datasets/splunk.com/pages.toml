["https://splunk.com/en_us/customers/success-stories/splunk-at-tesco.html"]
title = "Tesco | Customer Success | Splunk"
description = """
The UK’s largest grocer had to adapt to COVID virtually overnight. Supply chains were disrupted. Grocery aisles were stripped bare. Consumer behavior was affected by lockdowns and concern about public safety. Demand for home delivery soared.
And Tesco had to manage it all across more than 7,000 stores in five countries."""
full_description = "When COVID-19 upended the world, Tesco had to immediately change course to scale its online business, meet unprecedented demand and ensure people in the UK had reliable access to groceries and household essentials. With Splunk, Tesco used data to understand customer touchpoints, streamline supply chain operations and improve delivery tracking. As a result, Tesco doubled online delivery slots to meet customer demand while keeping systems secure and reliable around the clock — even ensuring zero downtime during a 30% surge in online traffic over Christmas. The UK’s largest grocer had to adapt to COVID virtually overnight. Supply chains were disrupted. Grocery aisles were stripped bare. Consumer behavior was affected by lockdowns and concern about public safety. Demand for home delivery soared. With Splunk already embedded across customer touchpoints, supply chain and fulfillment operations and more than 100,000 endpoints, Tesco leaders were able to scale their digital business, handle a surge in deliveries (and driver hiring), and manage constantly shifting supplier conditions to keep customers’ needs as their No. 1 priority. Splunk is embedded as part of the core nervous system of our operations. Splunk’s ease of use and versatility have enabled us to deliver against both business and technology use cases that would have otherwise been impossible. Tesco is booming — and so is its data. With more than 1,300 Tesco employees relying on the Splunk platform, teams across the business — from email tracking to customer support — are using data to work more efficiently, proactively solve problems and ensure customers enjoy an exceptional experience. “Splunk plays a vital role in our entire process, from the moment a customer buys something, to when we fulfill products and services, to how we maintain relationships with suppliers to fulfill all that demand,” says Chirag Shah, head of technology for group monitoring at Tesco. “Splunk helps us understand things like: Is our online experience delivering against customer expectations? Are our handheld devices and tills available and working properly in stores?”"
year_published = 2025
