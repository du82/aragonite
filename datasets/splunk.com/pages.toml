full_description = "Splunk maintains a comprehensive set of compliance certifications and attestations to support customers in meeting their own compliance obligations across global regulated markets. This webpage provides a list of Splunk products that are in scope of Splunk’s compliance programs and is solely for informational purposes. For generally available products listed below, not all features of the product may be within the scope of the relevant third-party audit report. Specific key features that are within the relevant third-party audit report for the product are listed below. Also, for generally available products and features that are currently in scope of Splunk’s compliance program as listed below, the product or feature may not be a part of the third-party audit report until the next assessment cycle. Additional detailed information about Splunk’s compliance programs, including third party reports, is available to Splunk customers under non-disclosure agreement from the Customer Trust Portal. This document addresses the named product(s) only as of February 2025. Since laws are frequently amended, the listed information may not reflect all changes or recent amendments to applicable law or how such changes might affect our products. Accordingly, Splunk does not represent, warrant or guarantee that the listed information is complete, accurate, or up-to-date and no part of the information should be construed as part of any contractual commitment to be included in any contract absent Splunk’s express acknowledgement through language in the contract itself. The International Organization for Standardization (ISO) is an independent, international organization. The ISO 27001 standard outlines and provides the requirements for an information security management system (ISMS), specifies a set of best practices, and details the security controls that can help manage identified risks. On an annual basis, specified Splunk products are reviewed and certified by an independent third-party assessor against the ISO 27001 requirements (surveillance audits) and certifications are reissued every 3 years (renewal audits). Authorized users can access related documentation in the Customer Trust Portal."
