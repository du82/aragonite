["https://splunk.com/en_us/about-splunk/splunk-data-security-and-privacy/data-privacy-at-splunk.html"]
title = "Data Privacy at Splunk | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "Splunk provides detailed information about the data we collect and how we use it in our customer agreements, in-product communications, product documentation and in our Privacy Policy. It’s not enough to build secure products. Every person at an organization is responsible for making sure data is secure. We train employees on policies and procedures for secure data handling, and use physical and procedural safeguards to help keep our facilities and equipment secure. The California Consumer Privacy Act (CCPA) is a California state law that expands the privacy rights of California residents and creates new compliance requirements for businesses that collect and process Personal Information of California residents. The California Privacy Rights Act (CPRA), which updates and amends the CCPA, took effect on January 1, 2023. The CCPA gives California residents new rights with respect to the collection and processing of their Personal Information (broadly defined to include information that, directly or indirectly, may lead to the identification of an individual or household). These new rights include: The CCPA applies to businesses that collect or process the Personal Information of California residents and meet any one of the following criteria: As Splunk processes the Personal Information of California residents and has gross annual revenues in excess of $25 million, the CCPA applies to Splunk. Customers that use Splunk Cloud services to process Personal Information are “Businesses” under the CCPA. They are responsible for ensuring the lawful collection and processing of the Personal Information they send to Splunk Cloud. Splunk is a “Service Provider” for the Personal Information its customers send to Splunk Cloud, and under the CCPA, is responsible for upholding its contractual commitment to only use the Personal Information it receives from customers for the purpose of performing the Splunk Cloud services. Splunk does not sell the Personal Information its customers upload to Splunk Cloud. Further, Splunk does not sell the Personal Information Splunk collects in its capacity as a “Business”, e.g., business contact information. For more information about how Splunk uses Personal Information, see Splunk's Privacy Policy."
year_published = 2025
