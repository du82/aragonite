["https://splunk.com/en_us/customers/success-stories/cainz.html"]
title = "CAINZ | Customer Success | Splunk"
description = "With Splunk, CAINZ has seen an 800% improvement in website performance and more reliable user experience through proactive troubleshooting."
full_description = "To implement a new business-boosting digital strategy, CAINZ needed to fully monitor e-commerce operations and website performance across various microservices in a multicloud architecture. The Splunk platform gives CAINZ data-driven observability that streamlines service monitoring and accelerates issue detection — leading to an eightfold improvement in performance. A leading home improvement retailer with over 220 stores in Japan, CAINZ CORPORATION (CAINZ) wanted to implement a digital strategy that would deliver superior customer experience. In addition to bringing system development in-house, CAINZ began to move its e-commerce sites — comprising more than 20 web services — to a multicloud environment. But this transition quickly made monitoring frontend performance more complicated, since heterogeneous web service platforms like Salesforce, Google Cloud Platform and Amazon Web Services supported everything from settlement functions to inventory and member information. To capture full-stack visibility into all web services, CAINZ needed a unified framework to not only manage service uptime and measure website load speed, but also analyze results and gain actionable insights. With Splunk Observability Cloud, which includes Synthetic Monitoring and Real User Monitoring, CAINZ now easily manages an increasingly complex multicloud environment that supports continued growth. Troubleshooting microservices across multiple clouds can be daunting for any organization without visibility into its entire infrastructure. Splunk Observability Cloud transforms data into real-time actionable insights and instantly alerts maintenance staff of system anomalies that may trigger critical problems. “E-commerce is not the only frontend service we’ll have to manage in the days to come,” says Takehiko Kan, head of the digital solution and product development department in CAINZ’s digital strategy division. “So we deployed Splunk Observability Cloud to create a reliable platform to monitor new services.” With Splunk, CAINZ has streamlined frontend management of its e-commerce services down to a limited number of engineers while managing its core systems as usual. “Our Splunk dashboard allows us to visualize processing speed for easy review while also helping us oversee multiple websites simultaneously.”"
