full_description = "Suppliers and Procurement Doing business with Splunk Procurement. Welcome to Splunk Supplier Central, an information portal for prospective and current Splunk suppliers. Cisco and Splunk: Better Together Welcome to Splunk Supplier Central, an information portal for prospective and current Splunk suppliers. Hello, and thank you for visiting Splunk’s Supplier Central website. My name is Aaron Smith and I am Splunk’s VP of Global Finance and Procurement Operations leading our Global Procurement Operations, Sourcing, and Travel & Expense functions. Our site is designed to provide you with information that you need to successfully interact with Splunk as a supplier and help Splunk meet our business goals. Splunk’s Supplier Central website has content to keep you informed. Specifically, our site includes the following topics and content: Governance, Sustainability & Supplier Diversity; Supplier Code of Conduct; Statement on the Prevention of Modern Slavery and Human Trafficking; The Onboarding process if you are selected as a supplier; Supplier Resources and links to important documents such as templates, and frequently asked questions and answers. If you have questions about navigating our site or would like to provide any input or suggestions for improvement, please feel free to reach out to us at supplier@splunk.com. We will hone the content and messaging on this site in our efforts to create more seamless, transparent and sustainable ways for Splunk’s business owners and our suppliers to work together as we build an inclusive supplier ecosystem that is socially, ethically and environmentally sound. Finally, I personally want to wish you success in your business endeavors and thank you for supporting Splunk in meeting our business goals and serving our customers. Splunk delivers the unified security and observability platform, designed to remove the barriers between data and action so that every organization can innovate with speed and agility. We’re empowering security, DevOps and IT teams to transform their organizations with data from any source and any scale. By becoming a Splunk supplier, you have the opportunity to participate in this transformation."
