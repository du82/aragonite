["https://splunk.com/en_us/customers/success-stories/cal-poly.html"]
title = "Cal Poly | Customer Success | Splunk"
description = "With Splunk, Cal Poly has the visibility they need to strengthen their security posture, increase resilience and provide students with real-world learning."
full_description = "To better protect its campus and data, Cal Poly needed a unified security platform that would give them visibility into the university’s complex, hybrid infrastructure while also centering students’ experiential learning. With Splunk, Cal Poly gained the visibility they needed to strengthen their security posture, which has increased resilience and provided students with more real-world learning opportunities. That’s not by chance; it’s been a core tenet of the California Polytechnic State University’s founding philosophy since it was formed in 1901. In Cal Poly’s Security Operations Center (SOC), which is tasked with providing round-the-clock protection from cyber threats, “it’s students who provide the first, tier-one incident response,” says Doug Lomsdalen, chief information security officer for Cal Poly. But as the university began to migrate to the cloud, its security environment became exponentially more complex. Lomsdalen and his team needed more visibility into the university’s distributed systems so they could quickly detect security incidents — an ability that proved especially important during the pandemic. Now Splunk Cloud Platform and Splunk Enterprise Security (ES) provide unprecedented visibility into Cal Poly’s security environment and offer its students critical skills that will serve them (and their future employers) well — long after they graduate. Wanting to meet ever-increasing cybersecurity threats with expanded security capabilities, Cal Poly began its cloud journey in 2016. Though the university began to benefit from the agility that the cloud provides, its infrastructure also became more complex, limiting the ability to see into systems and fix issues quickly. Now with the Splunk platform, the university has visibility into its systems, correlating over 105GB of data from disparate sources each day to fight threats and strengthen Cal Poly’s security posture. “Data is instrumental in our day-to-day business of security. If we didn't have that visibility that Splunk provides us on a daily basis, we would just be flying blind,” Lomsdalen says."
year_published = 2025
clearnet = "https://splunk.com/en_us/customers/success-stories/cal-poly.html"
