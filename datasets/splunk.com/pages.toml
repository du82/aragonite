["https://splunk.com/en_us/about-splunk.html"]
title = "About Splunk | What is Splunk? | Splunk"
description = "Learn about how Splunk helps organizations improve their digital resilience. By helping advance customers’ security and observability capabilities, Splunk ensures mission-critical systems stay secure and reliable."
full_description = "From its founding in 2003, Splunk has helped organizations explore the vast depths of their data like spelunkers in a cave (hence, “Splunk”). Our purpose is to build a safer and more resilient digital world. Every day, we live this purpose by helping SecOps, ITOps, and engineering teams keep their organizations securely up and running. In 2024, Splunk was acquired by Cisco to help customers continue to build resilience across their entire digital footprint. Today, many of the world’s largest and most complex organizations rely on Splunk to protect their mission-critical systems. Together, Splunk and Cisco unify the full power of network and endpoint data with leading security and observability solutions, all underpinned by our highly scalable, AI-powered data platform. Splunk is growing rapidly worldwide – join us as we build a safer and more resilient digital world. Data Privacy, security and compliance matter to you and they are imperative to us. Splunk is dedicated to keeping your data secure and private — adhering to global and industry compliance initiatives. Splunk combines technology, education, training, and employee volunteering and giving programs to engage communities all over the world. Splunk enables and empowers people and organizations across all sectors with the ability to discover and use their data to generate positive impact. We are committed to conducting our business in ways that are principled, transparent, and accountable to our stakeholders."
