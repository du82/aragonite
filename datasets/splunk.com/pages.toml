["https://splunk.com/en_us/global-impact.html"]
title = "Cisco purpose – Powering an inclusive future for all - Cisco"
description = "Driven by our purpose, we combine our technology, people, and broader networks to address society's greatest challenges. We share the progress we've made in our annual report."
full_description = "Driven by our purpose, we combine our technology, people, and broader networks to address society's greatest challenges. We share the progress we've made in our annual report. Through the extraordinary work of our nonprofit partners, we positively impacted 1.1 billion people between FY16-FY23 through social impact grants and Cisco Networking Academy. We are decarbonizing our operations and engaging with our suppliers, customers, and communities to reduce environmental impacts. We invest in tech-based solutions to positively impact the planet and the vulnerable, underserved communities around the world. We harness the power of connectivity to build an inclusive digital economy, drive access to education and skills, and create resilient communities. We enable organizations around the world with cash grants, technology, and shared expertise to accelerate and increase their impact. We recognize and celebrate the full spectrum of diversity, and address inequities within and beyond our company. We source materials responsibly and sustainably, and drive improvement in our manufacturing operations. We defend and advance local, national, and global policies that enable our business and our ability to power an inclusive future."
