title = "Splunk Attack Analyzer Security Addendum | Splunk"
description = "This Splunk Attack Analyzer Security Addendum (SAASA) sets forth the administrative, technical and physical safeguards Splunk takes to protect Confidential Information, including Customer Content, in Splunk Attack Analyzer (Security Program).  Splunk may update this SAASA from time to time to reflect changes in Splunk’s security posture, provided such changes do not materially diminish the level of security herein provided."
full_description = "This Splunk Attack Analyzer Security Exhibit (SAASE) sets forth the administrative, technical and physical safeguards Splunk takes to protect Confidential Information, including Customer Content, in Splunk Attack Analyzer (Security Program). Splunk may update this SAASE from time to time to reflect changes in Splunk’s security posture, provided such changes do not materially diminish the level of security herein provided. This SAASE is made a part of your Splunk General Terms (Agreement) with Splunk and any capitalized terms used but not defined herein shall have the meaning set forth in the Agreement, as applicable. In the event of any conflict between the terms of the Agreement and this SAASE, this SAASE will control. This SAASE does not apply to Splunk Attack Analyzer subscriptions purchased or acquired through Splunk.com, including without limitation Trial or Beta Services. 1.1 This SAASE describes the information security standards that Splunk maintains to protect Confidential Information, including Customer Content, in addition to any requirements set forth in the Agreement. 1.2 The SAASE is designed to protect the confidentiality, integrity and availability of Confidential Information, including Customer Content, against anticipated or actual threats or hazards; unauthorized or unlawful access, use, disclosure, alteration or destruction; and accidental loss, destruction or damage in accordance with laws applicable to the provision of the Service. 2.1 Scope and Content. Splunk Security Program: (a) complies with industry recognized information security standards; (b) includes administrative, technical and physical safeguards designed to protect the confidentiality, integrity and availability of Confidential Information, including Customer Content; and (c) is appropriate to the nature, size and complexity of Splunk’s business operations. 2.2 Security Policies, Standards and Methods. Splunk maintains security policies, standards and methods (collectively, Security Policies) designed to safeguard the processing of Confidential Information, including Customer Content, by employees and contractors in accordance with this SAASE."
