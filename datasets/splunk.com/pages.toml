["https://splunk.com/en_us/newsroom/press-releases/2024/cisco-completes-acquisition-of-splunk.html"]
title = "Cisco Completes Acquisition of Splunk | Splunk"
description = "Cisco (NASDAQ: CSCO) today announced it completed the acquisition of Splunk, setting the foundation for delivering unparalleled visibility and insights across an organization’s entire digital footprint."
full_description = "Press Release Cisco Completes Acquisition of Splunk It’s a new day for your data. Cisco, supercharged by Splunk, will revolutionize the way companies harness data to connect and protect every aspect of their organizations. SAN JOSE, Calif., March 18, 2024 — Cisco (NASDAQ: CSCO) today announced it completed the acquisition of Splunk, setting the foundation for delivering unparalleled visibility and insights across an organization’s entire digital footprint. To thrive in the new digital era, organizations must connect and protect all that they do. They need to connect the people, places, applications, data, and devices that power their business while protecting their entire digital footprint from cybersecurity threats, downtime, and other critical business risks. Cisco will bring the full power of the network, together with market-leading security and observability solutions, to deliver a real-time unified view of the entire digital landscape, helping teams proactively defend critical infrastructure, prevent outages, and refine the network experience. “We are thrilled to officially welcome Splunk to Cisco,” said Chuck Robbins, Chair and CEO of Cisco. “As one of the world’s largest software companies, we will revolutionize the way our customers leverage data to connect and protect every aspect of their organization as we help power and protect the AI revolution.” “Uniting Splunk and Cisco will bring tremendous value to our joint customers worldwide,” said Gary Steele, Executive Vice President, General Manager, Splunk. “The combination of Cisco and Splunk will provide truly comprehensive visibility and insights across an organization’s entire digital footprint, delivering an unprecedented level of resilience through the most extensive and powerful security and observability product portfolio on the market.” Effective use of the right data at massive scale is critical to enable the meaningful benefits of AI and help organizations drive outcomes never before possible. To truly reap the benefits of AI, organizations need the infrastructure to power it, the data to develop it, a security platform to protect it, and an observability platform to monitor and manage it in real time. Cisco will be able to do all four together."
year_published = 2024
