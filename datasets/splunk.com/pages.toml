["https://splunk.com/en_us/careers/diversity.html"]
title = "Inclusion |  Cisco Purpose Reporting Hub"
full_description = '''ON THIS PAGE: ON THIS PAGE: Accelerating business strategy Fostering innovation and collaboration Driving mindset, skillsets, and toolsets Inclusion At Cisco, inclusion is about enabling people to connect and collaborate across distance and difference. We approach inclusion as a core competency that we leverage to accelerate and amplify Cisco's existing business goals and mission. It is intrinsic to who we are — and who we intend to be long into the future. We prioritize inclusion, recognizing that connecting people of all experiences and backgrounds allows us to improve innovation and collaboration and helps to inform how Cisco recruits, develops, and engages our people. Our Purpose is to Power an Inclusive Future for All, and by that we mean dignity, respect, and equal access to opportunity across: gender, age, race, ethnicity, sexual orientation, ability, nationality, religion, veteran status, and all different backgrounds, cultures, experiences, strengths, and perspectives. In 2020, we deepened our work to create a more inclusive workplace. To make our commitment to community enablement integral to our company's purpose, Cisco created our Community Enablement Beliefs and Actions—the beginning of a five-year, US$300 million commitment to address our biggest challenges and drive lasting, generational change. In fiscal 2023, we strengthened our top-level commitment with the key appointment of Brian Tippens, Cisco's first Chief Social Impact and Inclusion Officer. Our vision is to become the global leader in building equitable, accessible, and resilient communities to accelerate business growth and power an inclusive future for all. Accelerating business strategy Our inclusion strategies are designed to embed inclusion and collaboration across the business, helping our leaders and people better understand identities, needs, and challenges. These strategies also enable Workforce Strategy to accelerate innovation in the way we attract, develop, and promote talent, positioning Cisco as a global leader in innovation and corporate culture. Accelerating global talent across all groups In fiscal 2023, we continued to accelerate inclusion and collaboration in our global workforce, creating the most diverse Cisco ever across the categories we measure (gender, race, and ethnicity)-for the eighth year running. While the year-over-year growth percentages may seem modest, we believe they are leading indicators of success in breaking through challenges that have long plagued our industry. We attribute these shifts to our holistic strategies for expanding hiring, developing and promoting emerging leaders. Attracting and hiring diverse talent Cisco partners with organizations that share our vision for unlocking the potential of all talent. We joined the One Ten Coalition as a founding member. One Ten's mission is to upskill and reskill 1 million underrepresented workers without college degrees over the next 10 years. Since fiscal 2020, Cisco has hired 159 new employees through One Ten. We help veterans and service members transition and upskill through the Cisco Veteran Talent Incubation Program, preparing them for Cisco Services entry-level engineer roles. We also partner with our Talent Hub team to add recently discharged talent from military bases to our recruitment pipeline. Talent Accelerators We use technology to build fairness, equity, and accountability into our processes. Our suite of Talent Accelerator digital solutions leverages intelligence at the point of decision-making to help us find, attract, select, and accelerate top talent. These include: Smart Insights, which enables us to benchmark and optimize opportunities for all Smart Start, a solution we created in partnership with Textio that helps us detect and mitigate bias in job postings and candidate communications Smart Tracker, which helps us identify the best places to find talent Smart Select, which helps hiring managers put together interviewer panels to help mitigate bias and increase the odds of hiring talent More than 12,507 Cisco leaders and HR employees globally have access to solutions to make hiring decisions that level the playing field. We're seeing steady progress for many employee populations. Fostering innovation and collaboration We recognize that connecting people of all experiences and backgrounds allows us to improve innovation and collaboration. Our strategies are designed to create a movement-a movement to connect, to better understand identities, needs and challenges across all groups, and to reimagine how we come together and create a Conscious Culture where everyone can thrive. Connecting across differences Getting closer to different perspectives, experiences, and identities gives us better insight to foster our Conscious Culture. Our Proximity Initiative brings together leaders and employees for one-on-one dialogues. They engage in courageous conversations, learn about each other's lived experiences, and work together to weave inclusive behaviors throughout the business. In fiscal 2023, we expanded the Proximity Initiative's reach to include director-level leaders in our Asia-Pacific, Japan, and China; Europe, Middle East, and Africa (EMEA); Canada; and Latin America regions and participants across Cisco's global Inclusive Communities. We spread the message of connecting across difference with our first-ever podcast "Let's Get Proximate," diving deep into lived experiences and stories from people across Cisco. Since the inception of the Proximity Initiative in fiscal 2019, more than 500 leaders and 1250 participants have had over 2100 Proximity meetings. 2100 Proximity meetings since beginning Proximity in FY19 95% of leaders say they are doing something differently as a result of their Proximity conversations, according to a leadership survey conducted in FY22 97% of leaders and 84% of participants found incredible value in their discussions To learn more about Proximity, explore these resources: Let’s Get Proximate podcast: Spotify, Amazon Podcast, Pandora, Podcast Republic, Goodpods, Audible The Journey and Impact of Getting Proximate Discovering Proximity: An Interview with Mayte Marquez Querol The exponential impact of Inclusive Communities Cisco's vibrant Inclusive Communities, 31 groups that reflect and support the employee experience, provide unique opportunities for collaboration, employee development, and engagement. Each Inclusive Community drives their own strategy and work together across our global enterprise to drive engagement and create a more Conscious Culture. Inclusive Communities are vital advocates and panners that bring to life Cisco's vision of an inclusive future for all. One in three Cisco employees is now in at least one Inclusive Community, with 335 chapters in 77 countries, representing over 30% of Cisco's employee population. Cisco's Inclusive Communities are the catalysts for driving culture shift. spawning innovation, and deepening our partnerships across the organization. Each year, they continue to expand their impact on how we attract, retain, develop, and promote talent, how we drive business results, and how we positively impact people in communities across the globe. Enhancing the employee experience Cisco's Global Inclusive Communities drive employee engagement and opportunities for belonging through monthly events featuring guest speakers, discussion forums, personal testimonials, and activities that build cultural awareness. These events and programs are designed to create proximity and transform the way we work together by sharing authentic stories and connecting with others who share a similar background or experience, leading courageous conversations and helping to deepen our understanding of each other. Through cross-collaboration, Inclusive Communities create learning opportunities that help bring us all closer together. Supporting and developing our people The Veteran Enablement and Troop Support (VETS) Inclusive Community established our Military Career Day event in 2011 to educate veterans on career opportunities at Cisco, and conversely educate Cisco employees on the value that veterans can bring to the Cisco organization. Our October 2023 installment of Military Career Day was our second global event, hosting over 600 veterans across the globe. The Veteran Mentorship Program pairs attendees with volunteer Cisco Mentors. These mentors guide the veteran through the discovery process, educating them on interested parts of the business and introducing them to a network that can help them transition into the business. This hands-on sponsorship process is critical in the military transition. In fiscal 2024, The Veteran Leadership Program was established to focus on those veterans that may have transitioned out of the military in the past two to eight years, had a strong record in the military as well as at Cisco, but needed focused and tailored leadership development that would help them take the next step in their private sector career. PRIDE LGBTQ+ & Allies Inclusive Community provides a safe space for employees to make connections, develop their allyship, and thrive in their careers. The community offers various virtual, hybrid, and on-site events each year where members can build their network and develop their skill sets. Flagship programs include the Proud mentorship program offered regionally and the Drive and Amplify series. Through our strategic partnerships and Pride-led participation, members can attend development conferences such as Out and Equal, Lesbians Who Tech and the Diversify Nordics Summit. Cisco has been recognized by the 2023 Workplace Pride Impact Awards as an ambassador-level achiever with a 78% rating. Our rating is one of the Most Improved year-over-year among hundreds of companies. Cisco was also the Top Scorer by Industry Sector in the Information & Communication Industry category. Women of Cisco Global Executive Shadow Program provides a unique opportunity for members of Women of Cisco to embark on a transformative journey of personal growth, career readiness, and professional enrichment through a personalized shadow engagement with seasoned leaders. Through shadowing executives in their day-to-day activities and meetings, participants will gain practical insights into various leadership roles, business operations, and decision-making processes. The program aims to leave women empowered with essential resources, including creating their own personal brand. Engaging with executives and their networks helps to build valuable connections for future career opportunities. When the program was first launched as a pilot project in 2009, 47 shadow members participated. In 2024, the program surpassed 1000 shadow members worldwide, including 993 executives, 47 at the global level. The strong participation of executives demonstrates their willingness to collaborate and share their knowledge, skills, and values. The Global Executive Shadow Program won the DE&I Campaigns/Initiatives in the Training category for Ragan’s 2024 CSR and Diversity Awards. Our Connected Asian Affinity Network (CAAN) brought attention to the gap in Pan-Asians (East Asians and Southeast Asians) in leadership advancement and wanted to help bridge the divide. Over the past three years, CAAN has raised awareness on these challenges to over 300 Cisco leaders and have provided nearly 70 professional development sessions to more than 2700 community members and allies. In fiscal 2024: CAAN saw a record 87 Pan-Asian executives and people leaders mentor 113 employees as part of its Global Mentoring program. Hosted the 6th Annual Pan-Asian Leader Summit where over 169 Pan-Asian leaders gathered for a fireside chat with Kelly Jones, Cisco’s Chief People Officer, discussing the importance of supporting Pan-Asian talent advancement. 130 Pan-Asian leaders and emerging leaders went through a tailored development program that involves interactive skill-building, executive coaching, and peer-to-peer engagement that greatly strengthens their career potential. 2023 was the Inaugural Cisco Radiate Conference, hosted by our Connected Black Professionals (CBP) Inclusive Community. The conference brought together more than 200 Black professionals at Cisco from all over the world and welcomed more than 100 Black professionals from the community, to develop, retain, elevate, expose, and recruit Black talent at Cisco. This year, Radiate expanded its reach by offering a hybrid program across eight locations globally, impacting 650 in person and over 1000 virtually. Cisco was named Top 50 places to work for Indigenous Professionals in science, technology, engineering, and mathematics (STEM) two years in a row and provided US$2000 in scholarship donations to the Seven Generations Scholarship Fund. For the fourth year, Cisco was a sponsor of the American Indian, Sciences and Engineering Society (AISES) National Conference to promote Cisco to Native STEM students. Advocating for what’s right In 2021, our Connected Disability Action Network (CDAN) Inclusive Community lobbied for Cisco to join The Valuable 500 and commit to supporting a global movement to put disability on the business leadership agenda. In connection with Global Accessibility Awareness Day 2023, CDAN hosted the first-ever Cisco-wide event explicitly featuring disabled and neurodivergent employees, signaling a shift toward being more community centered and neuro-inclusive. The community collaborated with Cisco TV to address accessibility issues that arise when we don't expect disabled people to be leaders and presenters for Cisco. In 2024, Cisco created its first Office of Accessibility. This year, three employees who are deeply passionate about fostering inclusion—and who serve as the global leads of Native American Network (NAN) and CAAN Inclusive Communities—collaborated to bring to life a formal Indigenous Land Acknowledgement ceremony to Cisco, as a global company, to publicly and permanently acknowledge the lands on which its offices now occupy. This ceremony, which was celebrated at Cisco's headquarters in San Jose, California and Research Triangle Park, North Carolina (with other locations planned), physically and symbolically demonstrated Cisco’s commitment to inclusion and belonging. The team was also recognized as the winner of an internal Culture Champion Award. Connecting Employees and Impact PRIDE LGBTQ+ & Allies has 24 global chapters that give back to their local communities through civic, volunteer, and development opportunities. Organizations supported include Habitat for Humanity's Build with Pride, local LGBTQ centers, humanitarian organizations, Gay Games, Pride House at the Olympic and Paralympic Games, and many more. There are three LGBTQIA-oriented Community Impact funds with corporate matching, where employees donate to organizations driving change globally, including ILGA, HRC and various non-profits. Pride engages in strategic partnershi'''
