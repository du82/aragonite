["https://splunk.com/en_us/legal/splunk-financial-services-customers.html"]
title = "Splunk and Financial Services Customers | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = "Splunk recognizes that financial services institutions (FSIs) must comply with stringent regulations regarding outsourcing, cloud services, and third-party risk management. Across global regulatory frameworks, FSIs are required to ensure that their cloud and solution providers maintain robust security, data protection, resilience and risk management practices. While FSIs are ultimately responsible for compliance with these regulations, Splunk offers a dedicated program specifically designed to help FSIs meet material regulatory requirements applicable to Splunk as a vendor providing cloud services. Our program is tailored to provide Splunk FSI customers with the necessary assurances to confidently rely on Splunk. This page outlines our FSI program and governance, including the certifications, attestations, terms, and documentation we provide to support due diligence, contracting and oversight responsibilities of our FSI customers. Splunk has developed a dedicated program for our customers in the FSI sector who are subject to regulations concerning outsourcing, third-party risk management, and cloud services. Our program takes into account a range of global regulations detailed in the ‘What regulations has Splunk considered when building its FSI programs?’ section below. More information about Splunk’s approach to FSI regulations is available in our Splunk and Financial Services white paper which offers in-depth insights into how our FSI program helps customers maintain compliance and manage risk. We align our offerings with recognized industry standards, verified by independent third party audits, such as ISO/IEC 27001, SOC2 Type II, PCI-DSS, or FedRAMP [moderate]. We also provide contractual commitments to our customers through offer-specific security addenda, which are incorporated into Splunk customer agreements. The ways we adhere to global and industry compliance standards are described on our dedicated security and privacy website, Splunk Protects. For Splunk Cloud Platform and Observability Cloud, we have developed Cloud Security Principles in response to the UK National Cyber Security Centre’s (NCSC) Cloud Security Principles, outlining our approach to product security."
