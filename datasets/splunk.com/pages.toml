["https://splunk.com/en_us/about-splunk/acquisitions.html"]
title = "Splunk Acquisitions | Splunk"
description = "Splunk makes acquisitions that are aligned with our business strategy and enable us to address a broader set of customer challenges and enhance our market leadership position."
full_description = "Splunk Acquisitions Splunk makes acquisitions that are aligned with our business strategy and enable us to expand our product portfolio, address a broader set of customer challenges, and enhance our market leadership position as the platform for turning data into action. Splunk makes acquisitions that are aligned with our business strategy and enable us to expand our product portfolio, address a broader set of customer challenges, and enhance our market leadership position as the platform for turning data into action. Cisco’s acquisition of SnapAttack, a threat detection and defense company, will support Splunk to drive further innovation and power the SOC of the future with a unified threat detection, investigation and response (TDIR) solution to help customers strengthen their digital resilience. Splunk's acquisition of TwinWave extends our security leadership and adds capabilities to empower the security analyst with cloud-native, automated threat analysis for phishing and malware. Splunk's acquisition of TruSTAR extends its leadership in security analytics through cloud-native threat intelligence integration and automation. Splunk’s acquisition of Flowmill brings next-generation cloud network performance monitoring to Splunk’s Observability solutions. Splunk’s acquisition of Rigor adds a unique Digital Experience Management (DEM) platform that combines the power of synthetic monitoring with intelligent optimization engine capabilities to enhance Splunk's Observability solutions. Splunk’s acquisition of Plumbr enhances the auto-instrumentation, real user monitoring and deep application performance monitoring capabilities of Splunk’s Observability solutions. Splunk’s acquisition of Streamlio accelerates Splunk's efforts in real-time stream processing and containerized multi-tenant cloud platform applications — expanding Splunk's commitment to and participation in the open source software community. Splunk’s acquisition of SignalFx adds real-time monitoring and metrics for cloud infrastructure, microservices and applications, enhancing Splunk’s position as a leader in observability and APM."
