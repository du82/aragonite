["https://splunk.com/en_us/customers/success-stories/progressive-insurance.html"]
title = "Progressive Insurance | Customer Success | Splunk"
description = "With full-fidelity security and observability, Progressive Insurance advanced its capabilities to detect threats and resolve service delays and downtime."
full_description = "Progressive Insurance needed to expand its visibility into security, IT, and engineering environments, prevent costly outages and safeguard its customers’ ability to access critical information during an emergency. With full-fidelity security and observability, Progressive advanced its monitoring capabilities to detect threats faster and quickly resolve service delays and downtime. Serving more than 30 million policies globally, the insurer is often the first phone call customers make after a car accident, house fire, or natural disaster. Customers rely on Progressive to help them get back on their feet in those critical moments. For Progressive, being the calm in the eye of the storm is a daily reality. “It's a relationship. Customers trust us to be there at the worst moment in their life. So if your property gets damaged, your home, your car, or you're in a significant event, oftentimes one of the first people you talk to is on the insurance side.” - Jon Moore, Domain Architect, Progressive Insurance. Progressive insures everything from automobiles and homes to RVs and motorcycles. When a home or possessions are damaged or destroyed, Progressive steps up to the plate. But with millions of dollars on the line daily, split-second transaction delays can mean exponential financial losses. Edge failures and latency were costing Progressive real dollars. Its existing tools couldn’t identify all of the request failures. They needed a solution specifically designed for cloud platforms. Progressive turned to Splunk Observability Suite and Splunk Enterprise Security to expand visibility across security, IT and engineering to prevent costly outages, ensuring customers could access critical information—and a helping hand—when they needed it most. Expanded visibility and a holistic view of Progressive’s IT environment is especially critical when keeping organizations safe from attack. Like many security operations centers (SOC), Progressive’s SOC was inundated with security alerts, which overwhelmed analysts and caused alert fatigue."
