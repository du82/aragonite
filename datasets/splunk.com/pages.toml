["https://splunk.com/en_us/careers/our-values.html"]
title = "Our Values | Splunk"
description = "Get visibility and insights across your whole organization, powering actions that improve security, reliability and innovation velocity."
full_description = '''Our Values What makes Splunk, Splunk We’re driven by ideals grounded in the voices of our people, customers and partners. Every Splunker brings our values to life in their own way. We’re looking for problem solvers who see potential and drive it forward. We want individuals who are passionate about our products, customers and people, and have the ability to see things from a different angle. We seek those who act transparently and know that work doesn’t have to be a grind. We value people who can’t stop thinking about improving the future and staying ahead of technology to meet ever-changing customer needs. We’re fueled by forward-thinking employees. You can have the best people and products in the world, but without passion, it’s not Splunk. Passion for our products and customers drives us further and keeps us reaching higher. We never say, "If it’s not broken, don't fix it." We’re always looking at things from different angles with an eye for how we can do it better, faster and more efficiently. We keep it open, honest and inclusive. We welcome all employee feedback with an open-door policy and truly care about providing a collaborative and inclusive employee experience. Whether it’s celebrating successful product releases or volunteering with colleagues, having fun makes us more productive, builds stronger teams and promotes positive mindsets. Each quarter, we recognize five special Splunkers and one team who truly embody our core values — nominated by their peers for their commitment to living our values every day. Ben Lovley, Staff Sales Engineer based in London, UK, is the March 2023 winner of our Innovative value award. Ben helped create an app for Splunkers to learn about each other’s career experiences inside and outside Splunk. Struggling to find that one person in the company who knows all about a unique piece of technology or business system? Jump on the app and you’ll be presented with the details about a Splunker who just might make the difference in closing a deal or helping you reach a goal.'''
