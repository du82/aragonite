title = "Splunk Product Accessibility Program | Splunk"
description = "Splunk believes in making machine data accessible, usable, and valuable to everyone. Splunk is committed to maintaining and enhancing its products' accessibility for all users, including those with diverse abilities who require the use of assistive technologies, through the following measures:"
full_description = "Splunk believes in making machine data accessible, usable, and valuable to everyone. Splunk is committed to maintaining and enhancing its products' accessibility for all users, including those with diverse abilities who require the use of assistive technologies, through the following measures: At Splunk, we leverage the internationally recognized accessibility regulations, standards, and best practices, specified in the W3C Web Content Accessibility Guidelines (WCAG) 2.1 Level A and AA, to the extent possible, Section 508 of the US Rehabilitation Act, and EU’s EN 301 549 Accessibility Requirements. Through internally trained staff and support from third-party testing services, we are committed to providing products designed to be accessible by those who require assistive technologies. The Voluntary Product Accessibility Template (VPAT) is a standardized document that outlines how information technology products conform with accessibility standards. The VPAT is used to develop Accessibility Conformance Reports (ACRs) that detail the accessibility of Splunk product features. The documents listed in this section are VPATs / ACRs that reflect Splunk product conformance to applicable accessibility requirements. Any VPAT posted in this section, or anywhere else on Splunk’s website, or otherwise publicly available, shall not be construed to be included in any contract, either explicitly or implicitly, in whole or in part, absent Splunk’s express acknowledgment through language in the contract itself that such report or its substantive equivalent is included. At Splunk, we follow WCAG 2.1 Level A and AA Success Criteria and Section 508 guidelines to test our product. We update our accessibility review process with each update of Section 508, EN 301 549, and WCAG guidelines. Additionally, we have dedicated design resources focusing on accessibility across the Splunk product portfolio. We have an internal compliance roadmap for Splunk products that have current VPATs, and we are in process of developing VPATs for other Splunk offerings."
year_published = 2025
