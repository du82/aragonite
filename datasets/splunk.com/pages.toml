["https://splunk.com/en_us/about-splunk/splunk-data-security-and-privacy.html"]
title = "Splunk Protects | Splunk"
description = "Learn how Splunk is dedicated to keeping your data secure through training and internal policies, compliance with global regulations and security by design."
full_description = "As a big data company, Splunk understands the importance of data privacy. Our programs, products and services are structured to provide effective data privacy protections for Splunk, its customers, partners and employees. Security by Design is top-of-mind throughout our development process. Our products and services are designed to meet your data security needs, including access controls, monitoring and encryption. Splunk complies with industry and international security standards. This includes participating in rigorous third-party audits that verify security controls for our Cloud services. Splunk is committed to responsibly leverage AI technology. Splunk embraces the AI principles of Accountability, Transparency, Privacy, Fairness, and Resilience. And each product powered by Splunk AI undergoes review. Customers turn to Splunk to understand and improve their security posture. We practice what we preach. We are committed to adhering to global and industry compliance standards. We prepare for incidents and we help you prepare, respond to and remediate them as well. The Splunk Customer Trust Portal provides you with easy, on-demand access to documentation about Splunk’s global privacy, security, and compliance programs, including certifications, compliance reports, standard security questionnaires and white papers. The Privacy and Security Fact Sheet is designed and intended to provide an overview of core privacy and security measures we offer in the Splunk Cloud Platform, and serve as a resource to assist customers with their data protection impact assessments. Splunk is proud to be among the first organizations to obtain certification under the EU-U.S. Data Privacy Framework, the UK Extension to the EU-U.S. Data Privacy Framework, and Swiss-U.S. Data Privacy Framework. In order to provide customers with key details on its certification, Splunk has created a Whitepaper on International Data Transfers & the EU-U.S. Data Privacy Framework. This whitepaper is intended to answer common questions about Splunk’s Data Privacy Framework certifications and international data transfers. You may review a copy of the whitepaper here."
