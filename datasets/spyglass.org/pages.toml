ber 2024Do You Feel In Charge?On bending the knee to Donald Trump…SpyglassM.G. SieglerThe Inner Ring 🔒Bezos Needs to Address the WaPo’s Broken BackThe decision is fine in a vacuum, the timing makes it anything but…SpyglassM.G. SieglerNetflix’s Next Backtrack: Movie TheatersAs growth naturally slows, Netflix needs to think bigger picture -- literallySpyglassM.G. SieglerApple Claps BackApple Intelligence is about to be an “every day” product, so it needs to be the “best”, fastSpyglassM.G. SieglerThe Inner Ring 🔒The War of the AI RosesMicrosoft and OpenAI increasingly make strange bedfellows…SpyglassM.G. SieglerThe Inner Ring 🔒Is ‘Remarkable Alexa’ Ready for a Prime Time Debut?Does the “romantic” Kindle event offer a cupcake clue?SpyglassM.G. SieglerTesla’s Tomorrow Never KnowsCybercab is believing, but it needs to be being…SpyglassM.G. Siegler‘Submerged’ Plunges Us Into a Possible Spatial Movie FutureThe Edward Berger short film for Apple is good, but points to something great…SpyglassM.G. SieglerAnd Like That... He’s Gone.Some thoughts on Cullen Hoback’s new Satoshi Nakamoto docSpyglassM.G. SieglerVenture Capital’s “Crisis”A go-go decade morphs with opportunity and danger…SpyglassM.G. SieglerMicrosoft’s Awkward AIThere’s a Copilot for that…SpyglassM.G. SieglerThe Inner Ring 🔒Apple Becomes the PupilSnap and Meta teach Apple a lesson…SpyglassM.G. SieglerThe Inner Ring 🔒September 2024The Art of the OpenAI DealThinking through their numbers and those deal terms…SpyglassM.G. SieglerThe Inner Ring 🔒Apple Knew Where the Puck Was Going, But Meta Skated ThereMeta’s “Orion” points to the vision of an Apple “Visor”…SpyglassM.G. SieglerThe Inner Ring 🔒The Pixel Fold Makes the iPhone Look OldGoogle figured out when to fold em -- Apple is still thinking on it…SpyglassM.G. SieglerAn AI Call to ArmsSam Altman wraps a plea in some grandiose (and vague) promises…SpyglassM.G. SieglerMeta’s Frenetic Connect KeynoteWeird pacing, awkward timing, cool products, and eternal optimism…SpyglassM.G. SieglerEvan Spiegel’s SpectacleSnap’s presentation was arguably more impressive than the product…SpyglassM.G. SieglerShould Microsoft Ride in to Save Intel?The white knight that once saved Apple can mount that steed again…SpyglassM.G. SieglerThe Inner Ring 🔒Apple Needs an Editor 2Repeating Steve Jobs’ old points of view is not an actual point of viewSpyglassM.G. SieglerDoes Microsoft Have an AI Problem?It’s early, but there sure is a lot of smoke billowing…SpyglassM.G. SieglerThe Inner Ring 🔒Apple Should Sign Howard Stern and Launch ‘Podcasts+’They may not care about podcasting, but they *do* care about Services…SpyglassM.G. SieglerThe Inner Ring 🔒August 2024ESPN’s Path to Be *the* Streaming Sports BundleIt’s not exactly “clear”, as Amazon may battle them along the way…SpyglassM.G. SieglerThe Inner Ring 🔒Mark Zuckerberg’s Goal is to Be Neutral in Not Being NeutralIs Meta going MAGA or GAGA?SpyglassM.G. SieglerGoogle Isn’t Lazy, It’s Timid. As It Sadly Must Be.Provocative soundbites aside, it’s obvious why Google isn’t OpenAI…SpyglassM.G. SieglerThe Inner Ring 🔒We Don’t Need Another iPod for Streaming TV, We Need An iTunesOne service to rule them all. And in the darkness, bind them.SpyglassM.G. SieglerReminder: What Actually Disrupted MicrosoftIt was not the Justice Department, despite the rhetoric this week…SpyglassM.G. SieglerOpenAI Generates More TurmoilIt’s probably time to change that non-profit structure for good…SpyglassM.G. SieglerDear ZuckThis shit is embarrassing…SpyglassM.G. SieglerThe Inner Ring 🔒July 2024Never Tweet Your HeroesAlso maybe never tweet, period.SpyglassM.G. SieglerThe Inner Ring 🔒Mark Zuckerberg’s “Thoughts on Open Source AI”A page out of Steve Jobs’ playbook to go after... Apple (and everyone else)SpyglassM.G. SieglerWhen Steve Jobs Called the Design World to ArmsAnd basically talked about the 2024 state of computing in 1983SpyglassM.G. SieglerApple Should Buy HBOAnd basically all of Warner Bros Discovery, which is selling…SpyglassM.G