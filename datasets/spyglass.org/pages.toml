title = "Ready or Not, Here Apple AI Comes"
description = "Will slow but not fully steady win the race?"
full_description = "M.G. Siegler • #apple • May 29, 2024 Ready or Not, Here Apple AI Comes Will slow but not fully steady win the race? It’s a narrative as old as time. Or at least as old as Apple. It goes something like this: the company rarely creates brand new innovations, but instead sits back and waits for a market to mature before coming in with the best version of a product. The iPod. The iPhone. The iPad. The Apple Watch. Even the Mac, to some degree. There are plenty of counter-examples, but it’s also their M.O. for a reason. They use this playbook often. And they play it well.So where does that leave Apple with AI? This post is for paying subscribers only Subscribe now Already have an account? Sign in #apple #ai #tech #openai #nvidia #microsoft #google #inner ring Published by:"
