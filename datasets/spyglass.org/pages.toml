["https://spyglass.org/dispatch-035-on-to-25"]
title = "Dispatch 035: On to '25"
description = "Amazon seemingly has a big Barbara Broccoli problem, which means the world has a big James Bond problem"
full_description = '''M.G. Siegler • #newsletter • Dec 20, 2024 Dispatch 035: On to '25 Google's 'AI Mode' • Billionaires at Dinner • Nintendo's Switch 2 • Amazon's Bond Problem One goal I had this year was to ramp up to a daily newsletter – mission: accomplished. What started as weekly in January, moved to daily in August, and after 85 weekdays in a row if my math is right (well, if ChatGPT's math is right – and as we all know by now, math is not exactly an AI strong suit), now it's time for a bit of a break for the holidays. I'll still plan to write various posts here and there on Spyglass, but I'll keep my notes on what I'm reading to myself until we're all back in January 2025. Happy Holidays and New Year to all. Thanks for reading. 🥳🍺Enjoying a Buxton Right to Road Best Bitter🎵Listening to "Weak in Your Light" by Nation of Language Spyglass Dispatch is a newsletter sent on weekdays featuring links and commentary from M.G. Siegler on timely topics found around the web. Subscribe .nc-loop-dots-4-24-icon-o{--animation-duration:0.8s} .nc-loop-dots-4-24-icon-o *{opacity:.4;transform:scale(.75);animation:nc-loop-dots-4-anim var(--animation-duration) infinite} .nc-loop-dots-4-24-icon-o :nth-child(1){transform-origin:4px 12px;animation-delay:-.3s;animation-delay:calc(var(--animation-duration)/-2.666)} .nc-loop-dots-4-24-icon-o :nth-child(2){transform-origin:12px 12px;animation-delay:-.15s;animation-delay:calc(var(--animation-duration)/-5.333)} .nc-loop-dots-4-24-icon-o :nth-child(3){transform-origin:20px 12px} @keyframes nc-loop-dots-4-anim{0%,100%{opacity:.4;transform:scale(.75)}50%{opacity:1;transform:scale(1)}} Email sent! Check your inbox to complete your signup. I Think...🔎 Google Plans to Add ‘AI Mode’ Option to Search – If accurate, this would be a big deal. While I've noted that one issue with Gemini is that it has been a bit buried relative to other Google products (though not as badly as their image and video generation tools!), that would change quickly if Google were to, say, put a toggle to switch over to 'AI Mode' on the main Google Search page. Right now, my own workflow is to use Google for web search and ChatGPT for queries where I want a direct answer. If I could simply toggle between those two use cases on the same page... But, as the article notes, they'd would have to be pretty careful with that. Just as Frodo putting on the Ring of Power draws the Eye of Sauron, Google putting anything on their main search page would draw the eyes of regulators, fast. ChatGPT may have mindshare and some amount of scale, but not Google Search scale... [Information 🔒]💍 Billionaire Rivals Bezos and Musk Are Said to Have Dined With Trump at Mar-a-Lago – That headline is a bit gracious. As noted in the piece, Elon Musk was a surprise guest at this dinner, which chief rival Jeff Bezos must have loved. But don't take my snark for it, take a report on the ground at Mar-a-Lago of the "cock-block" (the original poster deleted, for obvious reasons, but social media never forgets). This popping-out-of-the-cake follows similar Musk power plays on Tim Cook and Sundar Pichai. There is no way all of this ends well. It's just a matter of which sides get burned the worst and how (I'm including Musk and Trump in that list as well). Sort of fun to watch unfold though. [NYT]🕹️ The Nintendo Switch 2 and Its Dock – While this is all still very much in the unconfirmed rumor camp, there's starting to be quite a bit of smoke billowing... A recent Reddit AMA with a would-be leaker claims the next Nintendo console will be announced in January (early side of the stated timeline!) as the, wait for it: 'Switch 2' (come on, 'Super Switch' was right there!). Beyond that, the biggest news may be the use of magnetic Joy-Cons to replace the rails of the last generation. Oh, and the ability to draw more power (and thus, fun faster?) when docked? This plus those wider and taller case renders... [Verge]I Wrote...While the world has been waiting for a new James Bond to be chosen, that's perhaps not the actual hold up in the continuation of the franchise. It's perhaps something far more problematic: the relationship with Amazon...For 007, Amazon is Not EnoughAmazon seemingly has a big Barbara Broccoli problem, which means the world has a big James Bond problemSpyglassM.G. SieglerI Link...While original creations with the various new AI video models are pretty interesting and fun (albeit early), far more compelling to the mainstream will be using such tools on services like Instagram (and YouTube and TikTok – if the latter isn't banned). To that end, IG will get Meta's Movie Gen baked in at some point next year. The teaser looks impressive. [Verge]As mentioned in the Surf post yesterday, Tapestry is another player in the aggregate-social-feeds field (which I wrote about almost a year ago), is nearing its launch as well. [TechCrunch]2 Jackyl 2 Day, Eddie Redmayne will return for the second season of the (great) new show, he has officially confirmed. [THR]They'll also being Dune at least two seasons of the Prophecy show on HBO/Max. I've been waiting to weigh in on this one until after the seasons ends (this Sunday), but spoiler alert: it's not great. [THR]The ambition of NVIDIA runs head first into the agenda of the US government. Tough spot, especially as you're trying to diversify away from the Big Tech companies that are trying to diversify away from you! [NYT]OpenAI is working on their follow up to their 'o1' reasoning model, but likely can't use the name 'o2' due to the British telecom company of the same name, so they may just skip right to 'o3' – LoL – yet another reason they should have stayed with 'Strawberry'! [Information 🔒]Meanwhile, Google's first reasoning model is finally here – and they've somehow managed to pick a worse name than 'o1'. 'Gemini 2.0 Flash Thinking Experimental' sounds almost Microsoftian – a thinking man's version, perhaps? And apparently it still could have used some more time in the oven. It can't pass the, yes, "strawberry" test, as it were. [TechCrunch]Following the announcement of the Bluey movie, Disney is going to add the characters to their parks and cruises as well. My own (obvious) guess: if history is any guide with these moves, an acquisition of Ludo Studio (and a payoff to the BBC) could be in the works... [THR]Perplexity hit that $9B valuation with a new $500M raise. They're going to need that money if they're really getting into hardware... [Bloomberg 🔒]Begun, the Elon Musk-is-the-new-Steve-Bannon, narrative has. To be clear and fair, the NYT acknowledges this potential and obvious agenda here. Still, this will get to Trump, eventually. And I mean that literally and figuratively. Who is really in charge? [NYT]Luke Wilson says he's always pitching Mike Judge on ideas for 'Idiocracy 2', the now cult-classic film (some might say, documentary) which 20th Century Fox essentially killed-upon-opening at the box office. [THR]I Quote..."The problem is, neither the Scaling Laws nor Moore’s Law are immutable laws of nature. They’re simply smart observations."-- Cade Metz and Tripp Mickle, in their year-end story for NYT summarizing the debate on if AI is slowing down – i.e. hitting a wall – or if it's just a temporary blip. Seems like a fitting quote to end the year. I Spy...From the NYT article linked above, below, find Elon Musk meeting with members of Congress and Rogue from the X-Men. The Spyglass Dispatch A daily newsletter by M.G. Siegler Subscribe .nc-loop-dots-4-24-icon-o{--animation-duration:0.8s} .nc-loop-dots-4-24-icon-o *{opacity:.4;transform:scale(.75);animation:nc-loop-dots-4-anim var(--animation-duration) infinite} .nc-loop-dots-4-24-icon-o :nth-child(1){transform-origin:4px 12px;animation-delay:-.3s;animation-delay:calc(var(--animation-duration)/-2.666)} .nc-loop-dots-4-24-icon-o :nth-child(2){transform-origin:12px 12px;animation-delay:-.15s;animation-delay:calc(var(--animation-duration)/-5.333)} .nc-loop-dots-4-24-icon-o :nth-child(3){transform-origin:20px 12px} @keyframes nc-loop-dots-4-anim{0%,100%{opacity:.4;transform:scale(.75)}50%{opacity:1;transform:scale(1)}} Email sent! Check your inbox to complete your signup. Sent from afar on weekdays... #newsletter #dispatch Published by:'''
