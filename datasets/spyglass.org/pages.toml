description = "They’re clearly angling GPT-4.5 as being an emotionally intelligent update about getting the “vibes” right"
full_description = "From Afar The Spyglass Column Thoughts and analysis on various topics. These are sent once a week to Spyglass subscribers. And daily (on weekdays) to members of The Inner Ring. Columns which are exclusive to paid members are denoted below, outlined in SEA GREEN.𑗏 Sign up for Spyglass 𑗏⌾ Upgrade to The Inner Ring ⌾February 2025OpenAI’s EQ Upgrade to Hold Us Over to the IQ UpgradeThey’re clearly angling GPT-4.5 as being an emotionally intelligent update about getting the “vibes” rightSpyglassM.G. SieglerThe Inner Ring 🔒Meta Is Unbundling... AgainThe strategy behind the stand-alone apps for Reels and Meta AI…SpyglassM.G. SieglerAlexa, I’m SkepticalAlexa+ brings a lot of table-stakes stuff to the table in 2025…SpyglassM.G. SieglerThe Inner Ring 🔒Early Provocative AI Chatbots, RevisitedTwo years ago, we were up in arms over Bing’s AI “Sydney”…SpyglassM.G. SieglerRewatching ‘A.I.’ in the Age of AIThe 2001 film holds up intelligently on some points, artificially on othersSpyglassM.G. SieglerSomehow, Star Wars ReturnedWith Kathleen Kennedy set to retire, the Force awakens again…SpyglassM.G. SieglerThe Art of the Old DealTim Cook calls up some old plays to deflect Trump’s tariffs…SpyglassM.G. SieglerMicrosoft Outsources OpenAI’s Ambitions to SoftBankThere’s a new capital partner in town as they march towards ‘superintelligence’SpyglassM.G. SieglerESPN Balks, MLB WalksAnd it’s partially Apple’s fault!SpyglassM.G. SieglerThe Inner Ring 🔒Live and Let BuyJames Bond now fully works for Amazon. Die Another Same Day Delivery?SpyglassM.G. SieglerMajorana’s MaskA tale of two trillion-dollar companies…SpyglassM.G. SieglerApple Sherlocks the iPhone 16The new iPhone 16e sounds great -- at a far cheaper price…SpyglassM.G. SieglerOh, the Humane-ityHumane’s bad strategy exacerbated their bad timing with the Ai PinSpyglassM.G. SieglerThe Inner Ring 🔒The One AI to Rule Them AllTrying to grok the outlook for general-purpose consumer AI…SpyglassM.G. SieglerThe AI Will Come Out TomorrowAlexa and Siri struggle to get out the door in the Age of AI…SpyglassM.G. SieglerThe Age of UltracrepidariansRight or wrong, just say it loud, with conviction — just like AISpyglassM.G. SieglerThe Great AI UI UnificationChatGPT starts cleaning up the cruft…SpyglassM.G. SieglerAmazon & ESPN’s Sports Streaming Collision CourseWith Netflix drafting behind them…SpyglassM.G. SieglerThe Inner Ring 🔒Liquidity NowA new standard model for VCs and secondaries…SpyglassM.G. SieglerThe Inner Ring 🔒What You DeepSeek Is Seeking YouTwo weeks after the latest AI panic, has anything really changed?SpyglassM.G. SieglerObservations About Sam Altman’s ObservationsHe’s seeking for something deep…SpyglassM.G. SieglerThe Inner Ring 🔒Apple’s Elegantly Expressive Pixar LampForget glasses, Apple’s Next Big Thing™ may be a robot…SpyglassM.G. SieglerThe Inner Ring 🔒Earth to Lina KhanNearly every point in her NYT op-ed is wrongSpyglassM.G. SieglerGrowing Up AI-FirstPondering how kids might navigate the world post-ChatGPTSpyglassM.G. SieglerFaceFeedHow Mark Zuckerberg might rejuvenate Facebook with a feed of Meta content, a Fediverse twist, and a splash of AISpyglassM.G. SieglerThe Inner Ring 🔒The IPOpenAIA step-back way to frame OpenAI’s rumored mega raise…SpyglassM.G. SieglerJanuary 2025Apple’s Record-Breaking Quarter Was SO BORINGApple wins as the AI tortoise in a field of scared hares -- for now…SpyglassM.G. SieglerThe Inner Ring 🔒SoftBank, Indeed10 thoughts on OpenAI’s would-be new massive funding round…SpyglassM.G. SieglerPost-Explosion, Seeking the DeepSeek FalloutA guess: DeepSeek itself will matter less than the reaction to it…SpyglassM.G. SieglerThe Inner Ring 🔒Should Apple Switch Off Siri?In our Age of AI, Siri continues to embarrass Apple…SpyglassM.G. SieglerThe Inner Ring 🔒AI, Uh, Finds a WayHas DeepSeek changed the AI game or just some equations?SpyglassM.G. SieglerOpenAI’s ‘Operator’ Shows Why They’ll Build a Web BrowserTo me, the most interesting aspect of OpenAI’s new ‘Operator’ product – their first real agent – is not what it can do, but how it does it. Unlike the early iterations of similar products from Anthropic and Google, ‘Operator’ doesn’t take over your computer, it outsources the work you want toSpyglassM.G. SieglerMeta’s March to Make the iPhone ‘The Thing That Gets Us to the Thing’The company will build anything and everything to end the smartphone era…SpyglassM.G. SieglerThe Inner Ring 🔒One Year UndercoverOnwards to year two of Spyglass…SpyglassM.G. Siegler‘Stargate’ Squares Some AI CirclesOpenAI, Microsoft, SoftBank, Oracle, Trump, MGX, ARM, and NVIDIA all get double-dip wins in the announcementSpyglassM.G. SieglerMy 2025 iPhone HomescreenSome actual shifts thanks to AI and social stratification…SpyglassM.G. SieglerTrickTokWith the TikTok ban, the Trump administration starts dealing…SpyglassM.G. Siegler2 Switch 2 Similar?Nintendo’s Switch 2 strategy seems conservative, perhaps smartlySpyglassM.G. SieglerWith the Tok Tikking, Twitter Talk Makes Some Sense...China selling TikTok to Elon Musk would be quite the deal. You know who loves deals…SpyglassM.G. SieglerMay Your First Startup Be A Masculine StartupMark Zuckerberg’s heel turn this past week has been all sorts of fascinating.1 For one thing, I don’t think it’s all an act. I think it’s likely a short-sighted and misguided maneuver born out of years of various frustrations, but I don’t think it’s just to curry favor withSpyglassM.G. SieglerThe Inner Ring 🔒About-Face(book)Mark Zuckerberg’s new stance on speech can be both real and really politicalSpyglassM.G. SieglerVenu, Vidi, ViciDisney aims to conquer streaming sports with endless confusing optionsSpyglassM.G. SieglerThe Witching Hour‘Dune: Prophecy’ fails to live up to its legacySpyglassM.G. Siegler$1M Knee PadsThere’s a cost to be the boss -- and to bend the knee…SpyglassM.G. SieglerThe Inner Ring 🔒Meta’s Next Big BlunderSocial AI “characters” are so obviously and hilariously going to failSpyglassM.G. SieglerApple Comes to Google’s Defense, But the OppositeEddy Cue does declare that Apple must intervene in Google’s antitrust caseSpyglassM.G. SieglerDecember 202410 Big Predictions for 2025One of which may actually happen…SpyglassM.G. SieglerBeing for the Benefit of OpenAIOpenAI’s shift to a for-profit is messy, complicated, conflicted, and yet necessarySpyglassM.G. SieglerThe Inner Ring 🔒The Greatest Trick Netflix Ever Pulled......was convincing the world they weren’t interested in live sportsSpyglassM.G. SieglerBuy Me to the MoonApple, we have a movie problemSpyglassM.G. SieglerFor 007, Amazon is Not EnoughAmazon seemingly has a big Barbara Broccoli problem, which means the world has a big James Bond problemSpyglassM.G. SieglerAmerica Has Been AcquiredThis has felt less like an election and more like a deal…SpyglassM.G. SieglerThe Inner Ring 🔒Apple’s Next Question: Hold ‘Em or Fold ’Em?An ‘iPhone Fold’ or a massive ‘iPad Fold’, that is the question…SpyglassM.G. SieglerIt’s Beginning to Look a Lot Like ComcastYouTube TV is becoming the cable package we all hated…SpyglassM.G. SieglerMight Microsoft Make Another Run at TikTok?A deal makes more sense in 2024 than it did in 2020…SpyglassM.G. SieglerApple Made the Right Call and a Stupid Decision with ‘Wolfs’The movie would have flopped in theaters but still…SpyglassM.G. SieglerThe Inner Ring 🔒Tim Cook’s ClockA great interview quietly reveals quite a bit…SpyglassM.G. SieglerIntel Inside, Gelsinger OutsideDealt a bad hand by a board who wouldn’t give him enough time, Intel’s next leader needs full control to think differentSpyglassM.G. SieglerThe Inner Ring 🔒Moana Two-Hundred-and-Twenty-Five MillionDisney almost didn’t know how far ‘Moana 2’ would go…SpyglassM.G. SieglerA Call to More ARMsThe need to embolden the European startup landscape…SpyglassM.G. SieglerNovember 2024Meta Launches a Bluesky CompetitorIt’s called ‘Threads’ -- perhaps you’ve heard of it…SpyglassM.G. Siegler“Just a Big iPad”Imagine if the imaginary Apple Tele