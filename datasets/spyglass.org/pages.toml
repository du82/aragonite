full_description = "M.G. Siegler • #donald trump • Nov 7, 2024 PaidPals Elon Musk will battle with Trump eventually. As Peter Thiel can attest. Okay, Elon Musk got a full day and night of victory laps for his role in helping to get Donald Trump elected once again. Now it's time to come back down to Earth, before we go to Mars.There's no question that on paper, Musk's maneuver was a masterstroke in positioning both himself and all of his companies extremely well going forward. But as much as Trump might like it, the world doesn't exist on paper. It's a very fluid, very messy bowl of interpersonal agendas. Nowhere is this more true than in the orbit of Trump which is more transactional and perhaps as a result, far more chaotic than with your normal person – let alone an American President. How do I know this to be true? Well, just look at Trump's first administration... This post is for paying subscribers only Subscribe now Already have an account? Sign in #donald trump #elon musk #politics #tech #tesla #spacex Published by:"
