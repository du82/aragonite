description = "Spyglass is a collection of written works, thoughts, and analysis by M.G. Siegler, a long-time technology investor and writer. While the core focus is on the tech sector, a wide-range of topics will be explored. Perhaps the best way to frame the site is as a real-time notebook for"
full_description = "About Spyglass is a collection of written works, thoughts, and analysis by M.G. Siegler, a long-time technology investor and writer. While the core focus is on the tech sector, a wide-range of topics will be explored. Perhaps the best way to frame the site is as a real-time notebook for what M.G. is reading and thinking about from a vantage point that's outside of Silicon Valley after so many years on the inside.Operationally, Spyglass is three core products rolled into one: a blog – thoughts on a wide-range of topics posted throughout the week.1a column – more in-depth writing posted and sent out via emaila newsletter – a daily dispatch sent on weekdays (currently on hiatus)To get full access to the column, you will need to subscribe to the paid tier, 'The Inner Ring' (more about it here). The cost is $10/month or $100/year: 𑗏 Sign up for Spyglass 𑗏⌾ Upgrade to The Inner Ring ⌾If you choose to sign up for the free tier, you'll be sent the weekly Spyglass column as well as other content here and there. This content will also be accessible via the website alongside the blog posts, free of charge.🧑‍🎓Students: shoot a note to students [at] spyglass.orgYou can follow along with everything on:Threads Xitter WhatsAppBlueskyRSS If you're interested in certain topics, those are segmented by #tags – and each has their own page as well as RSS feed. (For example, here's the feed for posts about Apple.) One more thing: If you really, truly want to receive every post – column, newsletter, and blog – in your inbox, members can do so by clicking here and toggling on 'One More Ring'.💡The site is powered by Ghost and designed by JW.2👋Inquire within: hi [at] spyglass.org The Inner Ring $10/month or $100/year ENTER 1 Assume there will be some content on the weekends as well, as time allows. 2 With an assist in some elements by MG, as in, me."
