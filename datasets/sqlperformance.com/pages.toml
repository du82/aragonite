title = "Itzik Ben-Gan, Author at SQLPerformance.com"
description = "Itzik Ben-Gan is a T-SQL trainer and a co-founder of Lucient. A Data Platform Microsoft MVP (Most Valuable Professional) since 1999, Itzik has delivered numerous training events around the world focused on T-SQL Querying, Query Tuning and Programming. Itzik authored many articles and books including T-SQL Fundamentals and T-SQL Querying. Itzik’s speaking activities include SQLPASS, SQLBits, and other Microsoft Data Platform events. Itzik is the author of Lucient’s Advanced T-SQL Querying, Programming and Tuning and T-SQL Fundamentals courses along with being a primary resource within the company for their T-SQL related activities."
full_description = "DATE_BUCKET and DATETRUNC Improve Optimization of Time-Based Grouping Following the release of SQL Server 2022 RC1, Itzik Ben-Gan explores the new DATE_BUCKET and DATETRUNC functions for time-based grouping. Itzik Ben-Gan ◆ October 18, 2022 0 New Bit Manipulation Functions in SQL Server 2022 Itzik Ben-Gan takes an interesting look at new bit manipulation functionality in SQL Server 2022, including GET_BIT, SET_BIT, RIGHT_SHIFT, and LEFT_SHIFT. Itzik Ben-Gan ◆ September 21, 2022 6 Additional T-SQL Improvements in SQL Server 2022 Itzik Ben-Gan takes a look at T-SQL improvements in SQL Server 2022 CTP 2.1 : The DISTINCT FROM predicate and new approximate percentile functions. Itzik Ben-Gan ◆ August 1, 2022 0 Emulating the GROUPS Window Frame Option Itzik Ben-Gan shows two supported approaches to mimic the GROUPS window frame option, which is part of the SQL standard but currently unsupported in SQL Server. Itzik Ben-Gan ◆ July 13, 2022 7 T-SQL Windowing Improvements in SQL Server 2022 Itzik Ben-Gan dives deep on two of the more interesting T-SQL enhancements in SQL Server 2022: the new WINDOW clause and the windowing NULL treatment clause. Itzik Ben-Gan ◆ May 25, 2022 10 Are You Sorted? Tips Concerning T-SQL Window Ordering Queries with multiple ordering needs typically involve sorts in their plans. By following these tips, you can minimize the number of needed sorts. Learn more. Itzik Ben-Gan ◆ May 11, 2022 17 Islands T-SQL Challenge Itzik Ben-Gan introduces another T-SQL challenge; this time, it involves finding islands without explicit sort operators. Itzik Ben-Gan ◆ April 13, 2022 16 Matching Supply With Demand — Solutions, Part 3 Itzik Ben-Gan looks at additional interesting solutions to his supply and demand T-SQL challenge. Itzik Ben-Gan ◆ March 9, 2022 14 Matching Supply With Demand — Solutions, Part 2 Itzik Ben-Gan continues exploring solutions to a T-SQL challenge involving matching supply with demand. Itzik Ben-Gan ◆ February 9, 2022 4 Matching Supply With Demand — Solutions, Part 1 Itzik Ben-Gan presents initial solutions to his latest T-SQL challenge surrounding auctions (supply and demand). Itzik Ben-Gan ◆ January 12, 2022 2"
