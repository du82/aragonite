description = "Jonathan Kehayias is a Principal Consultant with SQLskills. He is the youngest person ever to achieve the Microsoft Certified Master - SQL Server 2008 certification and has been a SQL Server MVP for many years. Click here for a full bio."
full_description = "Execution Plan Impact on ASYNC_NETWORK_IO Waits – Part 1 Jonathan Kehayias starts a new blog series where he tests the impact that a specific plan shape might have on ASYNC_NETWORK_IO waits. Jonathan Kehayias ◆ March 5, 2020 2 Strongly Type Those Table-Valued Parameters Jonathan Kehayias shows a simple fix to C# code that can improve performance and throughput of workloads using table-valued parameters. Jonathan Kehayias ◆ January 22, 2020 4 Understanding Event Loss with Extended Events Jonathan Kehayias describes various ways you can suffer (and prevent) event loss when using Extended Events in SQL Server. Jonathan Kehayias ◆ October 17, 2019 1 Unintended Side Effects – Sleeping Sessions Holding Locks Jonathan Kehayias shows why you should always take the time to investigate why a blocking session isn't releasing locks quickly. Jonathan Kehayias ◆ July 3, 2019 1 Improve Performance of UDFs with NULL ON NULL INPUT Jonathan Kehayias shows why it can be beneficial to use the RETURNS NULL ON NULL INPUT option for scalar UDFs. Jonathan Kehayias ◆ December 27, 2018 1 Showplan Enhancements for UDFs Jonathan Kehayias shares insight about new UDF information in showplan, and shows that only some tools will show it (SSMS 17+ & SentryOne Plan Explorer). Jonathan Kehayias ◆ August 23, 2018 0 Tracking down high CLR_MANUAL_EVENT waits Jonathan Kehayias of SQLskills.com shares his story of an unusual situation with high CLR_MANUAL_EVENT waits and how he resolved it. Jonathan Kehayias ◆ July 18, 2018 2 Impact of Fragmentation on Execution Plans Jonathan Kehayias explains why, among other reasons, the impact on execution plans can make index fragmentation something you should care about. Jonathan Kehayias ◆ December 18, 2017 16 Troubleshooting CPU Performance on VMware Jonathan Kehayias of SQLskills discusses SQL Server on VMware, and how to monitor CPU performance – with or without access to vCenter. Jonathan Kehayias ◆ May 18, 2017 11 Improved Support for Parallel Statistics Rebuilds Jonathan Kehayias (@SQLPoolBoy) takes a closer look at a new trace flag that allows you to process multiple concurrent statistics updates on the same table. Jonathan Kehayias ◆ May 27, 2016 3"
