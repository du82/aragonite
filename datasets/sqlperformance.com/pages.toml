full_description = '''T-SQL Tuesday #33 : Trick Shots : Schema Switch-A-Roo Aaron Bertrand describes a way to use ALTER SCHEMA … TRANSFER to refresh data with minimal disruption. Aaron Bertrand ◆ August 14, 2012 11 Conditional Order By A common scenario in many client-server applications is allowing the end user to dictate the sort order of results. Some people want to see the lowest priced items first, some want to see the newest items first, and some want to see them alphabetically. This is a complex thing to achieve in Transact-SQL because you can't just throw @SortColumn and @SortDirection into a straight T-SQL query. Aaron Bertrand ◆ August 8, 2012 17 Splitting Strings : A Follow-Up There were a lot of comments following my post last week about string splitting, and I've tried to address those here. Aaron Bertrand ◆ August 2, 2012 2 When the DRY principle doesn't apply : BITWISE operations in SQL Server The "Don't Repeat Yourself" principle suggests that you should reduce repetition. This week I came across a case where DRY should be thrown out the window. There are other cases as well (for example, scalar functions), but this one was an interesting one involving Bitwise logic. Aaron Bertrand ◆ August 1, 2012 11 Best approaches for running totals – updated for SQL Server 2012 Usually, changing a cursor to a set-based operation is sound advice, but there are some exceptions, like the one described here (running totals). Aaron Bertrand ◆ July 24, 2012 33'''
