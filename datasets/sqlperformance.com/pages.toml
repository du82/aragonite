description = '''Aaron is a Staff Database Reliability Engineer at Stack Overflow. We don't want to say he's old, but his experience dates back to a time when SQL Server 6.5 was considered "modern." He writes here at sqlperformance.com, over at sqlblog.org, and at MSSQLTips.'''
full_description = "10 For 10 : My 10 Favorite SQLPerformance Posts Over 10 Years On this site’s 10th birthday, Aaron Bertrand looks back on his favorite posts – one from each year. Aaron Bertrand ◆ July 24, 2022 0 T-SQL Can Be Expressive Without Sacrificing Performance There are often multiple ways to express a query and get the same results, often without any change in performance. Learn about one example. Aaron Bertrand ◆ June 2, 2022 0 String Aggregation Over the Years in SQL Server Aaron Bertrand talks about progress in string aggregation—both in the functionality offered by SQL Server and the quality of his own code samples. Aaron Bertrand ◆ February 17, 2022 3 Serializing Deletes From Clustered Columnstore Indexes How can we serialize deletes from clustered columnstore indexes without drastically changing the application? Aaron Bertrand ◆ January 5, 2022 9 Bad Habits: Avoiding NULL in SQL Server Aaron Bertrand talks about NULLs, the logical issues with avoiding them, and potential performance impacts. Aaron Bertrand ◆ October 21, 2021 1 Refreshing SQL Server Tables With Less Interruption Using Partition Switching Aaron Bertrand talks about using partition switching to load refreshed SQL Server tables without impacting current users. Aaron Bertrand ◆ September 29, 2021 3 Split strings the right way – or the next best way Aaron Bertrand (@AaronBertrand) explores some common approaches people use to split strings, complete with performance analysis. Aaron Bertrand ◆ September 2, 2021 25 Deprecated features to take out of your toolbox – Part 3 As part of a long game on deprecated SQL Server functionality, Aaron Bertrand questions why anyone is still using text / ntext / image. Aaron Bertrand ◆ July 1, 2021 0 Deprecated features to take out of your toolbox – Part 2 With a real-world example, Aaron Bertrand discusses why you shouldn't use deprecated functionality like SQL Server Profiler. Aaron Bertrand ◆ March 15, 2021 4 Deprecated features to take out of your toolbox – Part 1 Aaron Bertrand provides evidence about SQL Server features you should stop using, like sysprocesses, but not just because they've been deprecated. Aaron Bertrand ◆ February 22, 2021 3"
