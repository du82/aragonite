["https://sqlperformance.com/2022/10/t-sql-queries/date-bucket-datetrunc-improve-time-based-grouping"]
title = "DATE_BUCKET and DATETRUNC Improve Optimization of Time-Based Grouping - SQLPerformance.com"
description = "Following the release of SQL Server 2022 RC1, Itzik Ben-Gan explores the new DATE_BUCKET and DATETRUNC functions for time-based grouping."
full_description = "DATE_BUCKET and DATETRUNC Improve Optimization of Time-Based Grouping October 18, 2022 by Itzik Ben-Gan in T-SQL Queries | No Comments SentryOne NewslettersThe SQLPerformance.com bi-weekly newsletter keeps you up to speed on the most recent blog posts and forum discussions in the SQL Server community.eNews is a bi-monthly newsletter with fun information about SentryOne, tips to help improve your productivity, and much more.Subscribe →Featured AuthorErin Stellato is a Principal Consultant with SQLskills and a Microsoft Data Platform MVP.Erin’s Posts → Time-based grouping and aggregation are common in analyzing data using T-SQL—for example, grouping sales orders by year or by week and computing order counts per group. When you apply time-based grouping, you often group the data by expressions that manipulate date and time columns with functions such as YEAR, MONTH, and DATEPART. Such manipulation typically inhibits the optimizer’s ability to rely on index order. Before SQL Server 2022, there was a workaround that enabled relying on index order, but besides being quite ugly, it had its cost, and the tradeoff wasn’t always acceptable. SQL Server 2022 introduces new ways to apply time-based grouping using the DATE_BUCKET and DATETRUNC functions. With the DATE_BUCKET function, besides being a flexible tool for handling time-series data, the optimizer can rely on index order when using it for grouping purposes. That’s been the case since the function’s inception in the first public preview of SQL Server 2022 (CTP 2.0). Starting with SQL Server 2022 RC1, that’s also the case with the DATETRUNC function. I’ll start by presenting the optimization issue found using the older functions, describe the older workaround, and then present the optimization with the newer tools. I’ll also describe cases where you might still need to use the older workaround. In my examples, I’ll use the sample database TSQLV6. You can download the script file to create and populate this database here and find its ER diagram here. Important: All testing of examples in this article was done on SQL Server 2022 RC1. Feature availability and optimization could change in future builds of the product. Optimization of Traditional Time-Based Grouping Usually, when you group data by unmanipulated columns, SQL Server can apply an order-based group algorithm (Stream Aggregate) that relies on index order. Consider the following query, which I’ll refer to as Query 1, as an example: USE TSQLV6; SELECT orderdate, COUNT(*) AS numorders FROM Sales.Orders GROUP BY orderdate; Figure 1 shows the plan for Query 1. Figure 1: Plan for Query 1 There’s an index called idx_nc_orderdate defined on the Sales.Orders table, with orderdate as the key. This plan scans the index in key order and applies a Stream Aggregate algorithm to the preordered data without requiring explicit sorting. However, suppose you group the data by expressions that manipulate columns, such as with most date and time-related functions. In that case, this will typically inhibit the optimizer’s ability to rely on index order. The optimizer can still rely on an index for coverage purposes but not on its order. Consider the following query, which I’ll refer to as Query 2: SELECT orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate))) AS D(orderyear) GROUP BY orderyear; Theoretically, Microsoft could have added logic to the optimizer to recognize that it could rely on index order here since date order implies year order, but it doesn’t. Figure 2 shows the plan for Query 2. Figure 2: Plan for Query 2 When not finding preordered data, the optimizer can either force explicit sorting in the plan and still use a Stream Aggregate algorithm or a Hash Match (Aggregate) algorithm, which does not have an ordering requirement. In this example, the optimizer opted for the latter. To verify that the use of a Stream Aggregate algorithm would require explicit sorting, you can force this algorithm with a hint, like so (I’ll call this Query 3): SELECT orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate))) AS D(orderyear) GROUP BY orderyear OPTION(ORDER GROUP); Or you can encourage the optimizer to use a Stream Aggregate algorithm by adding a presentation ORDER BY list that is aligned with the grouping set, like so (I’ll call this Query 4): SELECT orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate))) AS D(orderyear) GROUP BY orderyear ORDER BY orderyear; Query 3 and Query 4 get similar plans with a Stream Aggregate operator that is preceded by a Sort operator, as shown in Figure 3. Figure 3: Plan for Query 3 and Query 4 If you’re interested in the details of the costing and scaling of the different grouping algorithms, see the following series: Optimization Thresholds – Grouping and Aggregating Data, Part 1 Optimization Thresholds – Grouping and Aggregating Data, Part 2 Optimization Thresholds – Grouping and Aggregating Data, Part 3 Optimization Thresholds – Grouping and Aggregating Data, Part 4 Optimization Thresholds – Grouping and Aggregating Data, Part 5 The point is that currently, the optimizer is not encoded with the logic to recognize cases where column order implies manipulated column order, and hence the potential to rely on index order, at least with the traditional grouping expressions. The same applies to the following query, which groups the orders by year and month (I’ll call this Query 5): SELECT orderyear, ordermonth, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate), MONTH(orderdate))) AS D(orderyear, ordermonth) GROUP BY orderyear, ordermonth; And the same applies to the following query, which groups the orders by week, assuming Sunday as the first day of the week (I’ll call this Query 6): SELECT startofweek, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATEADD(week, DATEDIFF(week, CAST('19000107' AS DATE), orderdate), CAST('19000107' AS DATE)))) AS D(startofweek) GROUP BY startofweek; The Old and Ugly Workaround Before SQL Server 2022, there was no way I could produce a workaround for the above queries that would rely on the order of the original index on orderdate. However, there was a workaround involving the creation of new indexed computed columns, which the optimizer could then rely upon. The workaround involves the following steps: Create computed columns based on the grouping set expressions Create an index with the computed columns forming the key Here’s the code implementing this workaround to support Query 2, as an example: ALTER TABLE Sales.Orders ADD corderyear AS YEAR(orderdate); CREATE NONCLUSTERED INDEX idx_nc_corderyear ON Sales.Orders(corderyear); Here’s Query 2 again: SELECT orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate))) AS D(orderyear) GROUP BY orderyear; The new plan for Query 2 is shown in Figure 4. Figure 4: Plan for Query 2 with Old Workaround The advantage of this workaround is that no code changes are needed for your original query. Notice that even though you could, you didn’t have to change the query to refer to the computed column name corderyear in order to benefit from the new index. The optimizer applied expression matching and realized that the index on the computed column corderyear is based on the same expression as the grouping expression YEAR(orderdate). The downside of this workaround is that it requires a DDL change to the table, and the addition of a new index. You don’t always have these options available; if you do, there’s extra space needed for the new index and extra modification overhead. Run the following code to clean up the new index and computed column: DROP INDEX idx_nc_corderyear ON Sales.Orders; ALTER TABLE Sales.Orders DROP COLUMN corderyear; The New and Elegant Workaround Using the DATE_BUCKET Function As part of a set of new T-SQL features to support time-series scenarios, SQL Server 2022 introduces support for the DATE_BUCKET function. You can find details about this function in my article Bucketizing date and time data, as well as in Aaron Bertrand’s article My Favorite T-SQL Enhancements in SQL Server 2022. In brief, the DATE_BUCKET function has the following syntax: DATE_BUCKET( part, width, datetimevalue[, origin] ) The function returns a date and time value of the type of the input date and time value, representing the beginning of the date and time bucket that the input value belongs. Using the first two parameters of the function you define the bucket size, e.g., year, 1. You can explicitly define the starting point for the buckets on the time line using the fourth parameter origin or rely on January 1st, 1900, midnight, as the default. As an example, consider the following expression: SELECT DATE_BUCKET( year, 1, CAST('20220718' AS DATE) ) AS startofyear; This expression assumes bucket arrangement starting with the default origin January 1st, 1900, with a bucket size of one year. It effectively computes the beginning of year date with respect to the input date value, July 18th, 2022. This expression produces the following output: startofyear ----------- 2022-01-01 The original motivation for adding this function was to support time-series scenarios, where you often need to group data from edge devices such as sensors by date and time buckets, e.g., 15-minute buckets, and apply aggregates per bucket. The pleasant surprise about this function beyond its flexibility is how it gets optimized. Unlike the more traditional date and time functions, which, at least at the time of writing, typically inhibit the optimizer’s ability to rely on index order, Microsoft did encode logic in the optimizer to enable the DATE_BUCKET function to rely on index order. So, instead of the original Query 2: SELECT orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate))) AS D(orderyear) GROUP BY orderyear; You can use the DATE_BUCKET function, like so (I’ll refer to this Query 2b): SELECT YEAR(yearbucket) AS orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATE_BUCKET(year, 1, orderdate))) AS D(yearbucket) GROUP BY yearbucket; The plan for Query 2b is shown in Figure 5. Figure 5: Plan for Query 2b with New Workaround Similarly, instead of the original Query 5: SELECT orderyear, ordermonth, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate), MONTH(orderdate))) AS D(orderyear, ordermonth) GROUP BY orderyear, ordermonth; Use the following (I’ll call this Query 5b): SELECT YEAR(yearmonthbucket) AS orderyear, MONTH(yearmonthbucket) AS ordermonth, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATE_BUCKET(month, 1, orderdate))) AS D(yearmonthbucket) GROUP BY yearmonthbucket; Instead of the original Query 6: SELECT startofweek, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATEADD(week, DATEDIFF(week, CAST('19000107' AS DATE), orderdate), CAST('19000107' AS DATE)))) AS D(startofweek) GROUP BY startofweek; Use the following (I’ll call this Query 6b): SELECT startofweek, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATE_BUCKET(week, 1, orderdate, CAST('19000107' AS DATE)))) AS D(startofweek) GROUP BY startofweek; Whereas Query 2, Query 5 and Query 6 got plans that could not rely on index order, Query 2b, Query 5b and Query 6b got plans that did. You get the general idea! What about the new DATETRUNC function? SQL Server 2022 also introduces support for the DATETRUNC function. This function has the following syntax: DATETRUNC( part, datetimevalue ) The function returns a date and time value representing the input value truncated, or floored, to the beginning of the specified part. For instance, if you specify year as the part, you get the input value floored to the beginning of the year. If you specify month as the part, you get the input value floored to the beginning of the month. If the input value’s type is a date and time type, you get an output of the same type and precision. If the input is of a character string type, it is converted to DATETIME2(7), which is also the output type. For most parts, you could think of the DATETRUNC function as a simplified version of the DATE_BUCKET function, with the same part, width of 1, and no explicit origin. As an example, consider the following expression: SELECT DATETRUNC( year, CAST('20220718' AS DATE) ) AS startofyear; It is equivalent to: SELECT DATE_BUCKET( year, 1, CAST('20220718' AS DATE) ) AS startofyear; Both expressions produce the following output: startofyear ----------- 2022-01-01 Similar to the rewrites you made to queries that use traditional date and time functions to use DATE_BUCKET instead, you could rewrite them to use DATETRUNC instead. So, instead of the original Query 2: SELECT orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate))) AS D(orderyear) GROUP BY orderyear; You could use the DATETRUNC function, like so (I’ll refer to this Query 2c): SELECT YEAR(startofyear) AS orderyear, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATETRUNC(year, orderdate))) AS D(startofyear) GROUP BY startofyear; Similarly, instead of the original Query 5: SELECT orderyear, ordermonth, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(YEAR(orderdate), MONTH(orderdate))) AS D(orderyear, ordermonth) GROUP BY orderyear, ordermonth; You could use the following (I’ll call this Query 5c): SELECT YEAR(startofmonth) AS orderyear, MONTH(startofmonth) AS ordermonth, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATETRUNC(month, orderdate))) AS D(startofmonth) GROUP BY startofmonth; Instead of the original Query 6: SELECT startofweek, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATEADD(week, DATEDIFF(week, CAST('19000107' AS DATE), orderdate), CAST('19000107' AS DATE)))) AS D(startofweek) GROUP BY startofweek; You could use the following (I’ll call this Query 6c): SET DATEFIRST 7; SELECT startofweek, COUNT(*) AS numorders FROM Sales.Orders CROSS APPLY (VALUES(DATETRUNC(week, orderdate))) AS D(startofweek) GROUP BY startofweek; Although not the case in earlier builds, starting with SQL Server 2022 RC1, the DATETRUNC function can rely on index order for grouping purposes similar to the DATE_BUCKET function. The plans generated for Query 2c, Query 5c, and Query 6c are similar to the ones generated for Query 2b, Query 5b, and Query 6b, respectively. All end up with an ordered index scan and no explicit sorting prior to a Stream Aggregate operator. What about other manipulations? Basic grouping is only one example where there’s potential for the optimizer to rely on index order even when manipulating the underlying columns, but where currently, it doesn’t. There are many other examples like filtering, more sophisticated hierarchical grouping with grouping sets, distinctness, joining, and others. For now, you can resolve only some of the cases by revising the co"
