["https://squarespace.com/blog/the-squarespace-guide-to-web-design-basics"]
title = "The Squarespace Guide to Web Design Basics – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = '''Making It Video Back The Squarespace Guide to Web Design Basics By Squarespace Staff Watch Video Download a free workbook to help you design your site with confidence. The email you entered is invalid. Thank you for subscribing. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. Designing your website doesn’t have to feel overwhelming. Our Squarespace pros are here to help you understand the basics of creating a beautiful, easy-to-use, and accessible website. Watch the video above or read the transcript below for expert tips on how to organize your site navigation, boost your SEO, and create a great user experience for your web pages. Design Your Website TranscriptNarrator: Good web design isn't just about making a site beautiful to look at. It's about making it easy to navigate for any user who happens to stop by. That means thinking about accessibility, clarity, and functionality. First up, figure out what matters: What is the most important part of your site? And, how do you get people to engage with it? Melike Turgut: In your website navigation, you should definitely have your site's title or your brand logo, along with navigation links to your most important pages on your site. If you have a really important action that you want your visitors to take, you can turn that into a button. Narrator: Look at the categories of your navigation as the guiding landmarks of your viewers' journeys through your site. Your main navigation should speak to the top levels of your website hierarchy: your shop, your blog, your about page, the things that matter most. Your footer navigation should anticipate your viewers' needs and guide them to any information that may be of use to them. Your FAQ, hours of operation, return policies, and any other answers to customer questions. And while you're at it, go ahead and make your navigation work a bit harder for you and your site visitors by employing nested categories. Read our top principles of web designShaun Hinklein: Nested categories are a great opportunity to organize your site structure in a way that search engines can efficiently crawl. And it's not just for search engines, it's also for your users. For example, for ecommerce customers and people on the Business plan.If you're selling apparel or goods and you have categories, nested categories allows you to come up with different keyword groups per page. So if you're selling sweaters, you could have men's sweaters, women's sweaters and have those ranked for different keyword groups per URL. The way that nested categories works is it allows you to have one keyword group for sweaters, another for men's sweaters on two separate pages. And allowing nested categories throughout your website gives search engines a quick and efficient way to crawl. Learn how to optimize your website for searchNarrator: All in all, your titles need to be clear, concise, and cater to the user journey on your website. Satu Pelkonen: You should always name your headline. So you have an H1, which is the biggest headline at your website. You'll always have an H2, which is typically the subhead on your site. A good rule of thumb, when thinking about typography for your website is to mix and match both Serifs and Sans-serifs. So if your headlines are Serifs, you should probably use Sans-serifs for your body copy, or the other way around. Narrator: Keeping the user journey in mind, let's talk accessibility. Think about the audience you'd like to reach. Who are those people? What might you be able to do to help them get the most out of what your site has to offer? Is your type large enough that someone who is visually impaired can still navigate your site? Do your videos have subtitles for those who might not be able to hear or who speak another language? These are the little design choices that make a big difference for both you and your audience. Remember, when designing your website, save elements like color and imagery for last, and focus on designing a website that's easy and enjoyable to use. Start Designing With a Free Trial This post was updated on November 10, 2023. Posted on 21 Dec 2021 The Squarespace Guide To web design ecommerce SEO user experience web design basics Share: Related Videos Video The Squarespace Guide to Simplifying SEO The Squarespace Guide to Simplifying SEO By Squarespace Staff 21 Dec 2021 Video The Squarespace Guide to Understanding Web Templates The Squarespace Guide to Understanding Web Templates By Squarespace Staff 21 Dec 2021 Subscribe Subscribe to receive the latest MAKING IT blog posts and updates, promotions and partnerships from Squarespace. The email you entered is invalid. Thank you for subscribing. By providing your email, you indicate you have read and understood our Privacy Policy. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://squarespace.com/blog/the-squarespace-guide-to-web-design-basics" }, "headline": "The Squarespace Guide to Web Design Basics", "image": { "@type": "ImageObject", "url": "https://static1.squarespace.com/static/5134cbefe4b0c6fb04df8065/5dcb2d0669b294381f8ffb16/61c2012ce5eca521a89a6965/1640104273092/SQSPGuide_WebDesign_Header_Desktop_1920x1062px.jpg" }, "datePublished": "2021-12-21T11:30:44-05:00", "dateModified": "2025-01-15T16:23:48-05:00", "author": { "@type": "Person", "name": "Squarespace Staff" }, "publisher": { "@type": "Organization", "name": "Squarespace", "logo": { "@type": "ImageObject", "url": "https://media-www.sqspcdn.com/logos/favicon-dark-mode.ico" } }, "description": "Get expert advice on setting up your website navigation, designing web pages, and creating a pleasant user experience on your site." }'''
