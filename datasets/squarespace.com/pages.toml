 cards, Afterpay, Apple Pay, ACH transfers, and other popular payment methods. Offer your customers a flexible and convenient checkout experience to maximize conversion with Squarespace Payments.{"@context":"http://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why should I take my invoicing online?","acceptedAnswer":{"@type":"Answer","text":"Invoicing is a critical part of running your business and managing funds, and taking your invoicing system online can streamline the whole process for you and your clients. Whereas traditional methods like paper or PDF can be time-consuming, online payments are scaleable, convenient, and fast. With Squarespace, you also get consistent branding and professional design throughout the client intake process with an all-in-one online invoicing system."}},{"@type":"Question","name":"How can I create and send invoices with Squarespace?","acceptedAnswer":{"@type":"Answer","text":"Using the Invoicing panel in your Squarespace account, you can create a project to keep track of your full relationship with an individual customer. As long as you have a payment processor connected to your site, you'll be able to create professional, personalized invoices and send them directly to your client. For more information, read more on client invoicing on the Help Center."}},{"@type":"Question","name":"Do my invoices match my Squarespace website and branding?","acceptedAnswer":{"@type":"Answer","text":"Squarespace Invoice maintains consistent branding across all of your surfaces and client communications, from your website to invoices. This design can also carry over to other documents, such as client intake forms, proposals, and contracts."}},{"@type":"Question","name":"What payments can my customers use with a Squarespace Invoice?","acceptedAnswer":{"@type":"Answer","text":"With Squarespace invoices, you can accept major debit and credit cards, Afterpay, Apple Pay, ACH transfers, and other popular payment methods. Offer your customers a flexible and convenient checkout experience to maximize conversion with Squarespace Payments."}}]}24/7 SupportHelp CenterGet help from our award-winning Customer Support team.→WebinarsFree online sessions to learn the basics and refine your skills.→Start your free website trial todayNo credit card required. Cancel anytime.Get startedGet started'''
