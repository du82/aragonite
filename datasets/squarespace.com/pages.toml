description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = "LoadingEnterpriseCustom plans for larger teamsOur premier website solution made for the unique needs of big business.Learn moreQ&AHow long are your contracts?Squarespace plans are paid monthly or yearly. We make it simple to start — and stop — your service at any time.Is there a discount for yearly service?Yes, we offer discounts on up-front long-term commitments. You will also receive one year off of a new domain registration with your annual purchase.Do I need another web host?No. All Squarespace plans include our fully-managed cloud hosting, ensuring your website remains available at all times.Can I download Squarespace?No. Squarespace is a fully-managed web service. We do not have plans to make a downloadable version. Squarespace does provide many standard methods for exporting your data.Squarespace is a fully-managed web service. We do not have plans to make a downloadable version for desktop. Your data can be exported through many standard methods.We offer the Squarespace app on your mobile device to manage your site while on the go. Designed for customers with live Squarespace websites, you can monitor visitor metrics, upload photos, and fulfill orders. Download for Android | Download for iOSHow do I accept payments with Squarespace Commerce?How do I accept payments with Squarespace Payments?Squarespace integrates with Stripe and accepts credit card payments directly to your bank account. You can accept more payment methods in checkout such as Apple Pay and PayPal. Sign up for an account with Stripe and PayPal in minutes and start accepting payments immediately.With Squarespace Payments as your payment solution, you can centralize your finances in one easy-to-use dashboard while accepting Klarna, Afterpay, Apple Pay, ACH, and all major credit cards. Squarespace Payments is currently available in the US.How much does it cost to process payments through Squarespace Commerce?How much does it cost to process payments through Squarespace Payments?There are no Squarespace transaction fees for Squarespace Commerce plans (Basic and Advanced). We charge a transaction fee of 3% on sales in the Business plan. Visit Stripe and PayPal for payment processing rates for your country.Squarespace Payments fees and rates vary per subscription plan. Please see above in the Full Feature Comparison for details.Do you offer student pricing?You can learn more about our education program here.Do the prices shown above include taxes?Stated prices are not inclusive of applicable taxes. Final pricing inclusive of taxes will be shown prior to checkout.What payment options can I use to purchase a Squarespace subscription?We accept AMEX, Visa, Mastercard, Discover (US dollars only), PayPal*, SEPA, Diners Club, Japan Credit Bureau (JCB)*currently only available for non-US subscribersDesign and publish your website todayTry for free"
