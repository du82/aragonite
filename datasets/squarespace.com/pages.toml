eEnable Multichannel Selling: Bulk List Products & Sync Order...SKU IQSync your Squarespace inventory with Square, Clover, or Ligh...Custom Merch by PrintfulPrint on demand for your Squarespace site powered by Printfu...Syncee Collective DropshippingFind new dropshipping and wholesale products to sell from su...PrintiqueProfessional photo lab delivering high quality fine art prin...soonaMeet soona. The virtual content studio for e-commerce produc...SpocketAdd dropshipping products from US & EU suppliers directly to...TrunkMulti-channel real-time stock syncing and bundlingTikTok Shop by ShoppeDanceSyncs product listings, orders, and inventory between Square...Candid WholesaleBetter, faster online wholesaleinFlow CloudA complete inventory management systemPrintifyCreate, sell, and ship custom products anywhere in the worldArt of WhereDesign your custom printed products made on-demand. Leggings...SpreadconnectConnect to the fastest Print-on-Demand app on SquarespaceSearch results for "" extensionsFinanceHideView allTaxJarAutomated sales tax calculations, reporting, and filingQuickBooks Online ConnectorConnect Squarespace to QuickBooks Online to automate account...MYOB by AmakaAutomate your accounting with a daily sync of your Squarespa...Xero by AmakaAutomate your accounting with a daily sync of your Squarespa...Avalara Sales Tax Returns and ReportingCreate ready-to-file sales tax returnsDextSimplify, standardize and streamline your digital sales acco...FreshBooksGenerate reports and automatically sync clients, items, and ...Search results for "" extensionsShipping and FulfillmentHideView allShipStationImport, organize, and ship orders from over 180 channels, ca...Featured extensionEasyship: All-in-One ShippingSave up to 91% on shipping across 550+ courier services & bo...ShipBobThe #1 ecommerce fulfillment solutionSendcloudEasy shipping automation to help your business grow.ShippoSave time and money on shippingAfterShipBoost sales with branded tracking pages, proactive notificat...Order DeskSell your Squarespace products across channels like TikTok, ...Returns Center by AftershipFrictionless self-service returns management portal to give ...Connected ServicesLearn more→InstagramLinkedinPinterestYoutubeXFacebook Frequently asked questions What are extensions? Extensions, or plug-ins, are a collection of third-party tools to enhance your Squarespace website. These extensions allow you to connect Squarespace with other platforms to help streamline shipping, sell products across the web, market your store, and more. Does Squarespace have plugins, add-ons, or apps? Yes, an extension is the Squarespace equivalent of a plugin, add-on, or app. Instead of visiting an App Store you can find and connect third-party tools on Squarespace Extensions. How do I connect an extension or add plugins? To connect an extension, tap or click Connect to Site. You must be logged in to connect it. Select the site you want to connect to the extension and carefully review the extension’s permissions and terms before allowing access. Learn more about adding an extension to your Squarespace website here. How much does an extension cost? Extension prices vary. Some have a monthly or per-use fee. Others may offer a free plan or a trial period. To review pricing, visit the extension’s page. Squarespace doesn’t charge you for using extensions and doesn’t have any control over the extension’s pricing. How does the extension access data? When you connect an extension, you’ll need to authorize access to your site’s information. Any information that you authorize is subject to the extension’s terms of service, privacy notice, or similar terms. Make sure to fully review these policies before authorizing an extension to access your site. While Squarespace keeps your account and site secure, it’s your responsibility to ensure you trust the extension you’re connecting. Who do I contact with extension-related questions? If you have an issue with an extension, reach out to the extension provider’s support team via the link on the extension’s details page. The extension provider is solely responsible for providing all support, maintenance, and technical assistance with the service provided through the extension. Who provides the extension? The extensions listed in Squarespace Extensions are provided by third parties and not Squarespace. If you connect an extension to your site, the relationship is between you and the applicable third-party extension provider. Your use of the extension and their services is governed by the extension provider’s terms of service, privacy notice, or similar terms. They’re not subject to the Squarespace’s Terms of Service, Privacy Policy, Data Processing Addendum, or other policies. The inclusion of an extension within Squarespace Extensions is provided without recommendation or endorsement. Where are extensions available? While many of our extensions are available anywhere, some are only available in select countries. An extension’s supported countries and languages can be found on the extension’s page, as well as the Squarespace Extensions help center article. Where can I find developer documentation? If you’re a developer looking to learn more about Squarespace and its APIs, visit developers.squarespace.com. Here you can find the changelog, API documentation, and more information about integrating to Squarespace. Start your free website trial todayGet startedNo credit card required. Cancel anytime.'
