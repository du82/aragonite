["https://squarespace.com/accessibility"]
title = "Squarespace Accessibility & Compliance – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = "Accessibility at Squarespace Empowering everyone to build their brand through storytelling and design — regardless of their abilities, circumstances, or preferences. Build a website → → Our commitments Staffing Our team is dedicated to sharing tools, resources, and education to help creators work towards their goals. Support Our ever-growing resource library helps creators make their sites more accessible for everyone on the web. Visit our support center → → Improving our products Templates We’re adding new features across many of our current offerings to help make your unique design choices even more accessible to your audience. Website Builder To provide a more accessible baseline for website creation, we’re updating the components, tools, and user experiences in our products. Squarespace Experts Connect with an Expert Get help from third-party web designers and developers with years of experience creating Squarespace websites. Match with an Expert → → Become a professional Looking to create beautiful, impactful, and accessible sites for your clients? Join Circle, our partner program for Squarespace professionals. Become a Circle member → → Squarespace Experts Frequently asked questions Does Squarespace have accessibility features? You can customize many aspects of your Squarespace site to make it easier to navigate. To learn more about our accessibility features, see our Help Center article on how to make your Squarespace site more accessible. How do I make a Squarespace website ADA compliant? Squarespace gives every customer the ability to customize their site. This sometimes means the end product is not fully accessible to everyone. To learn more about how to make your site more compliant, reference the ADA standards for accessible design (US only). Does my site need to be ADA compliant? Laws around web accessibility vary greatly depending on the country, state, and/or regional jurisdiction you fall under. Squarespace does not give legal advice, whether on accessibility compliance or otherwise. For more information, a helpful first step may be to review an overview of the laws and policy in your region. If you’re unsure of how these policies apply to you, we encourage you to consult an accessibility or legal expert for more information. How do I know if my website is accessible? While there is no such thing as 100% accessibility and no universal governing metric applies, there are ways to assess and improve your site so that it can be generally accessible to a broad audience. If you need assistance with assessing your site, we suggest reaching out to an experienced practitioner (English only) for help. How can I improve my website’s accessibility? For accessibility resources specific to Squarespace websites, visit Making your Squarespace site more accessible. If you’re looking to learn more about accessibility in general we suggest starting with Introduction to Accessibility (US only), or visiting the Web Accessibility Initiative website. Who is responsible for my website accessibility? Accessibility requirements may differ by country, state, and/or regional jurisdiction. You are responsible for ensuring that your site complies with those requirements. One way to assess and improve your site accessibility is by consulting resources like this accessibility checklist (English only) from the A11Y Project. While following this checklist may not guarantee your site will be in line with applicable accessibility requirements, it may help improve the user experience for anyone using your site. Are all sites built on Squarespace accessible? Because Squarespace users have a lot of creative freedom, they also have the ability to build websites that are not always accessible by all. We believe that accessibility is always a work in progress, and we encourage everyone to strive towards creating beautiful designs with accessibility in mind. Where can I find more resources on accessibility? For accessibility resources specific to Squarespace websites, visit Making your Squarespace site more accessible. If you’re looking to learn more about accessibility, you may find the following resources helpful: Introduction to Accessibility (US only), and Web Accessibility Initiative website. We’d love to hear from you Questions, concerns, or suggestions? Contact support"
year_published = 2025
