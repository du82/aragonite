full_description = "Squarespace Circle Squarespace’s partner program for creative professionals. Build or contribute to three Squarespace websites to join. Enter your email, and we’ll notify you once you’re eligible. The email you entered is invalid. Thank you for signing up. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. If you have three active Squarespace websites, you’re eligible to Join Circle Today → → Circle helps you grow your web design business Get paid for new clients Earn commissions for bringing new clients to Squarespace. Terms apply. Save on new subscriptions Receive 20% off on every new annual subscription—for you and your clients. Extend your website trials Enjoy free, extended six-month trials to fine-tune your clients’ websites. Build your clients an impactful online presence Empower clients to sell anything Squarespace offers commerce, scheduling and marketing tools—everything your clients need to run a successful online business. Match your clients’ brands All websites are powered by our drag-and-drop editor, Fluid Engine, which gives you control over every design detail to set your clients’ sites apart. Hand it off Help your clients manage their own online presence with a user-friendly interface and award-winning support. Join a global network Learn from the community Connect with professional creators in the members-only forum. Stay in the know Receive weekly product updates and be the first to access new features. Receive priority support Connect with Squarespace product teams and receive priority status when contacting Customer Support. Learn from the community Connect with professional creators in the members-only forum. Stay in the know Receive weekly product updates and be the first to access new features. Receive priority support Connect with Squarespace product teams and receive priority status when contacting Customer Support. Get started today Build or contribute to three Squarespace websites to join. Enter your email, and we’ll notify you once you’re eligible. The email you entered is invalid. Thank you for signing up. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. If you have three active Squarespace websites, you’re eligible to JOIN CIRCLE TODAY → → FAQ How do I know if I’m eligible for Circle? Circle membership is open to customers who build or contribute to at least three active Squarespace sites. At the time you sign up for Circle, all three sites need to be on active billing plans. You’ll also need to be either an owner or a contributor with one of the following permissions: Administrator Billing Website Editor Analytics Store Manager Email Campaigns Editor Scheduling Administrator Scheduling View and Edit Is Circle free to join? Yes, Circle is free—there are no costs to join or maintain membership. What benefits do I get when I join Circle? As a Circle member, you’ll receive the following benefits: Six-month trial periods: Start new websites with an extended free trial before paying. 20% off new annual website subscriptions. 20% off new annual Email Campaigns, Member Areas, and Scheduling subscriptions. Referral payments: If eligible, you’ll receive referral payments for bringing clients to Squarespace. Terms apply. Squarespace Circle Badge: Add a badge to your website to let clients know you’re a Circle member. The private Circle Forum for advanced support and peer-to-peer feedback. Exclusive content, like advanced guides, blog posts, and product release notes. Beta tests of new features and interaction with product teams. Community events for learning and networking with other members. Your Circle membership and benefits are built into your Squarespace websites and your interactions with Customer Support. How do I activate Circle benefits? Once you become a Circle member, most of your benefits will activate automatically, though the referral payment benefit must be opted into. Read below for more information. Six-month free trial and 20% off annual subscriptions To activate the six-month free trial, start a new trial on your Circle account and add your client as a contributor. Based on the permissions provided, your client can become the website owner and keep, limit, or remove your access if they so choose. When your client purchases their annual subscription, the 20% off will be automatically applied. If your client adds you as a contributor to a site they started, the six-month free trial will not be applied. However, you can still redeem the 20% off discount for your client by purchasing the subscription using your account. Referral payments To earn commissions on new clients you bring to Squarespace, you must first sign up for the referral program. Learn more. How is Circle different from the Affiliate Program? The Affiliate program is not related to Circle or Circle’s referral program. The Affiliate program provides a Squarespace customer with a unique link, which will help you earn commissions each time a visitor clicks and creates their first Squarespace subscription. Learn more. How can I hire a Squarespace Expert? You can hire an independent designer to help you with your site through Squarespace Marketplace. Marketplace is powered by 99designs by Vista, a creative platform that helps clients and creative professionals find each other and collaborate. In Marketplace, designers are called Squarespace Experts. Learn more. How do I become a Squarespace Expert? Squarespace Experts are Circle members who qualify to match directly with clients on Squarespace Marketplace. Eligible Circle members are periodically invited to participate in Marketplace as Experts based on client demand and services offered. To become eligible for consideration, you must create eight Squarespace websites in a one-year period. Resources to help you grow Circle Blog Get a head start and learn more about building your web design business. Explore the Blog → → Help Center Learn more about Circle perks and eligibility in our Help Center Explore Help Center → →"
