full_description = "OurOffices About us Careers Our team Locations Diversity & Inclusion About us Careers Our team Locations Diversity & Inclusion As a company with global reach, Squarespace is proud to be headquartered in bustling New York City, with offices in Dublin, Ireland, Aveiro, Portugal, and coworking spaces in the UK, Netherlands, and Australia. 01 02 / ← → New York Squarespace, Inc. 225 Varick Street, 12th Floor New York, NY 10014 Squarespace’s 150,000-square-foot headquarters is located in Manhattan’s West Village at 8 Clarkson Street. The office fills five floors, in addition to a dedicated lobby and roof deck, within the historic Maltz Building. The space was designed with a focus on creating collaborative working spaces for employees to solve problems together creatively. Job Openings Portugal Aveiro, Portugal Rua Pedro António Rebocho, N° 5 3800-404 Aveiro Our Portugal office was founded in 2023. The 3,500 square-foot boutique office is located in the distinguished canal city of Aveiro. Conveniently located by the center of town; in walking distance from the train station, authentic restaurants, local shops and cultural offerings. The open office layout was designed to focus on collaboration and team culture. Natural sunlight on two full sides of windows provides great interior lighting to complement our distinctive brand color palette. Job Openings 01 02 / ← → Dublin Squarespace Ireland Limited Squarespace House Ship Street Great Dublin 8, D08 N12C The Squarespace Dublin office was founded in 2013 as a hub for our Customer Operations team. The 24,589-square-foot office space is located at Squarespace House in Dublin 8, close to Antique Quarter, The Liberties, and original city walls. Squarespace occupies four floors with a dedicated entrance, lobby, and roof terrace. Job Openings About Us Careers Our Team Locations D&I"
