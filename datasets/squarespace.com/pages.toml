using Squarespace’s Custom Merch feature. 02. Choose products to customize with your designs. 03. Set your own prices to maximize revenue. 04. List customized products on your Squarespace store for everyone to enjoy. 05. Start selling and let Printful handle everything from production to shipping. Mobile store management The Squarespace app helps you run your online store from anywhere. Track inventory and connect with customers while you’re on-the-go. Sell anywhere with Point of Sale on iOS. Manage inventory and edit products. Scan shipping labels. Contact your customers. Sell anywhere with Point of Sale on iOS. Manage inventory and edit products. Scan shipping labels. Contact your customers. How to create an ecommerce website Get Started → → Find an ecommerce template and start your free trial. Register or transfer your business’s domain name. Set up your online store by adding products and connecting a payment processor. Or, if you sell services, you can set up appointments through Squarespace scheduling. Customize your online store categories and content with the website builder. Grow your online store with email marketing and SEO. Frequently asked questions What is an ecommerce website? An ecommerce website allows customers to buy physical or digital products, services, and content online, rather than in a brick-and-mortar store. Squarespace gives you the tools to Sell Anything online, including an all-in-one platform to launch your business and get started with a beautifully-designed online store. How do I start selling online? Squarespace offers easy-to-customize online store templates to get your ecommerce website off the ground. Start by finding a custom domain name for your ecommerce website. Then set up and customize your storefront with rich product merchandising tools, designed to showcase your products at their absolute best. Once you connect a payment processor to enable online transactions, you’re ready to take orders with shipping tools and built-in