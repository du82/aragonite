full_description = '''Making It Video Back The Squarespace Guide to All Things Email Campaigns By Squarespace Staff Watch Video Download our free workbook to help you launch your email marketing strategy. The email you entered is invalid. Thank you for subscribing. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. Email marketing and newsletters are some of the best methods for building a connection and promoting to your website visitors. Our Squarespace pros are here to help you understand the basics of starting your email list and creating beautiful emails that convert subscribers. Watch the video above or read the transcript below for expert tips on making your own email marketing plan. Start Your Website TranscriptNarrator: Searching for the secret to ecommerce success? Spoiler alert: It's emails. By securing a place in your customers' inboxes, you're improving your chances of creating a community of returning customers. Yes, they may get pushed to spam or piled beneath other promotions. But any opportunity to speak to your customers is an opportunity you can't pass up. Get tips on growing conversion in your online storeLukas Thoms: The reality is that email is your best way to communicate with your customers and the people that love your brand. And you should be using email, email collection, and email sending from day one of starting your business. You gotta remember that if someone's giving you their email, it's because they're interested in hearing from you. Email is really your best opportunity to have control over your brand, your messaging, and have direct access to your customers every day. Narrator: Now that you're aboard the email train, let's make sure you know where to start. Step one goes without saying, but if you don't have a business email already, it's time to make one. Once you've got that, you're ready to get everything set up with your site. First things first: There's no point in sending out emails if you don't have anyone to send them to. So, you're gonna need some subscribers. With Squarespace, this is as easy as inserting a newsletter block or promotional pop-up to your site, which will automatically collect your customers’ emails in your mailing list. So once you're ready, all you have to do is click send. Next up is the email itself. Squarespace Email Campaigns make it super easy to include content from your website in your promotional materials while maintaining a consistent look and feel. You simply drag, drop, and arrange however you please. And finally, in addition to maintaining consistency between your site and campaigns, you should also do your best to maintain a consistent cadence in how often you send out your emails. After the technical setup comes the real challenge: Getting people to actually open, read, and engage with the emails you're sending them. That means using engaging subject lines, attention-grabbing imagery, and clear CTAs to make sure your precious email doesn't get kicked to the curb like spam. Learn how to create your first emailLT: To ensure that you're not getting filtered out with other promotional emails or put into spam, ask your customers to add you to their contact list. Narrator: No matter what, figuring out what email techniques work best for you will be a constant learning process. So make sure to use Squarespace's real-time email analytics to help you see everything from open rates to clicks and conversions. And when in doubt, get some inspo from your inbox. Take a look through and see what makes you, as a customer, want to click, buy, or read more. Try Campaigns WIth A Trial This post was updated on November 10, 2023. Posted on 21 Dec 2021 The Squarespace Guide To email customer relationships marketing ecommerce Share: Related Videos Video The Squarespace Guide to Ecommerce First Steps The Squarespace Guide to Ecommerce First Steps By Squarespace Staff 20 Dec 2021 Video The Squarespace Guide to Making Your First Sale The Squarespace Guide to Making Your First Sale By Squarespace Staff 21 Dec 2021 Subscribe Subscribe to receive the latest MAKING IT blog posts and updates, promotions and partnerships from Squarespace. The email you entered is invalid. Thank you for subscribing. By providing your email, you indicate you have read and understood our Privacy Policy. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://squarespace.com/blog/the-squarespace-guide-to-all-things-email-campaigns" }, "headline": "The Squarespace Guide to All Things Email Campaigns", "image": { "@type": "ImageObject", "url": "https://static1.squarespace.com/static/5134cbefe4b0c6fb04df8065/5dcb2d0669b294381f8ffb16/61c201eceb0bf63c479f55cd/1640104503454/SQSPGuide_Email101_Header_Desktop_1920x1062px.jpg" }, "datePublished": "2021-12-21T11:34:12-05:00", "dateModified": "2023-11-10T17:32:40-05:00", "author": { "@type": "Person", "name": "Squarespace Staff" }, "publisher": { "@type": "Organization", "name": "Squarespace", "logo": { "@type": "ImageObject", "url": "https://media-www.sqspcdn.com/logos/favicon-dark-mode.ico" } }, "description": "Get expert advice on collecting emails and creating emails that convert your site visitors into customers." }'''
