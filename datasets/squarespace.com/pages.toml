["https://squarespace.com/about/careers"]
title = "Squarespace Careers – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = "JoinOur Team About us Careers Our team Locations Diversity & Inclusion About us Careers Our team Locations Diversity & Inclusion Our flexible work philosophy Flexibility at Squarespace isn’t new and all roles at Squarespace are flexible in one way or another. Before the pandemic, Squarespace embraced flexible work - 13% of our employees were fully remote, while most in-office employees had flexible schedules. As we look to the future of work, we are increasing our existing flexibility. We believe that flexibility increases productivity and satisfaction, decreases our carbon footprint related to commuting, and enables us to attract and retain a more diverse and inclusive workforce. Squarespace’s Flexible Work Policy outlines two distinct work classifications - Officespace and Homespace - designed to help foster an inclusive and collaborative environment. In the same way that there isn’t a one size fits all solution for our customers, there isn’t a one size fits all approach that will work for every individual and every role. So we have empowered individuals, their managers, and department leaders to determine the appropriate approach to flexible work for them. The type of flexibility needed will vary based on the role - with consideration for whether the role needs to have face to face collaboration and interaction, and the ability for that role to be done remotely vs. in the office. 1.Officespace - employees who spend at least some of their week working from a Squarespace office location. Each Officespace employee’s work schedule is agreed upon between them and their manager and approved by their department head, with some being fully in-office and some having flexible schedules. Depending on their role and how often they are in the office, some Officespace employees will have assigned desks while others will participate in hoteling of desk space. 2.Homespace - employees who spend all or the majority of their time working remotely and do not have a desk in a Squarespace office. Fully remote positions are currently available for designated roles at department discretion. We also embrace the benefits of face to face interaction and collaboration, so curating an enticing office experience remains part of our Squarespace approach. Our office is so much more than a place people go to work. Each of our offices has been built to inspire creativity and foster community. It’s more than a workplace. We invite all who enter to find a space that feels their own. It’s a collective. It’s our space. Whether you have a Officespace or Homespace workstyle, we aspire to foster collaboration and connection between everyone at Squarespace. Open positions We’re looking for people to join the team who are as excited as we are to help build the platform that empowers the future generation of creators to be successful online. Select location All locations New York City Los Angeles Dublin Remote Portugal All locations New York City Los Angeles Dublin Remote Portugal There are currently no openings available. Please check back later. 01 02 / ← → Meet Squarespace Play Perks & benefits Relax, we’ve got you covered. We take care of our employees in more ways than one. Our comprehensive benefits offerings include medical, dental, and vision coverage for employees and their dependent children. We also offer up to 20 weeks of paid family leave (or local equivalent), fertility and adoption benefits, and behavioral health and wellness programs such as Headspace and more. More information on our US Mainland Cigna & US Hawaii HMSA coverage → → Work-life balance. We view our people as professionals with interests, responsibilities and passions outside of work. And we believe employees need quality time to unplug and recharge for their own well-being and satisfaction. Through our flexible PTO policy, we encourage team members to take the time off they need to recharge and be their best. We also encourage the creator and entrepreneur in all of our employees by offering two free Squarespace sites and a complimentary subscription to Unfold to pursue their creative passions. Stay informed. We’re dedicated to ensuring all employees have the information they need to stay connected to each other and to do their jobs well. Our annual company kick-off, quarterly all hands meetings, year-end wrap up, collaborative Slack channels, and newsletters are just a few of the ways we bring our employees together and share key aspects of the business across the entire organization. We value our people. We’re serious about investing in our people and sharing in Squarespace’s successes. As part of our total rewards programming, we offer qualifying employees equity in the company and competitive retirement programs (e.g., 401(k), pension) with a company match. We give back. We anonymously match any donation our employees make (up to $/€ 600) so they can support the organizations they care about most—times two. We also arrange programming for team members to volunteer at specialized customer workshops and community activities. Live it up. One benefit of having amazing coworkers is enjoying each other’s company, and we have no shortage of reasons to have fun together whether it’s in person or virtually. At Squarespace offices, regular happy hours are a great way to connect with coworkers and unwind. Throughout the year, we also host customer events and programs that allow us to have fun while supporting Squarespace customers and bringing our employees closer to why we do what we do every day. These range from customer workshops, wellness, trivia and more. Plus, with hybrid work, we are experimenting with a variety of programs to give employees even more opportunities to get to know colleagues across departments, geographies, and work arrangements. More information on our US Mainland Cigna & US Hawaii HMSA coverage For more information on our US Mainland based Cigna coverage, click here. For information on our US Hawaii based HMSA coverage, click here. This link leads to the machine readable files that are made available in response to the federal Transparency in Coverage Rule and includes negotiated service rates and out-of-network allowed amounts between health plans and healthcare providers. The machine-readable files are formatted to allow researchers, regulators, and application developers to more easily access and analyze data. About Us Careers Our Team Locations D&I"
year_published = 2025
