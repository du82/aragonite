["https://squarespace.com/about/diversity-and-inclusion"]
title = "Diversity & Inclusion at Squarespace – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = "Ourcommitment About us Careers Our team Locations Diversity & Inclusion About us Careers Our team Locations Diversity & Inclusion We are committed to building and developing diverse teams so that we can better understand and serve the multifaceted cultures and identities of our customers. Diversity refers to all of the ways we see and experience the world, with respect for differences in race, gender identity and expression, age, ethnicity, disabilities (seen and unseen), family or marital status, veteran status, sexual orientation, education, religion, and all the ways we may identify as a community. Inclusion is the state of being heard, recognized, and valued. It’s about creating a sense of belonging for every individual and a trust that “you deserve to be here.” At Squarespace, our Diversity & Inclusion efforts focus on uplifting the experiences and perspectives of underrepresented groups and doing the work that draws out the best in all of us. Fostering a diverse and inclusive workplace means supporting and celebrating all of our different communities. Employee Resource Groups (ERGs) We currently have 6 global ERGs that represent a broad range of identities. ERGs are crucial to fostering a diverse, inclusive, and culturally connected workplace. By creating a supportive community for their members, sharing their community with the company through Heritage events and programming, and by acting as strategic partners to maximize business impact, they are an important part of our culture and growth as a company. Black at Squarespace (BASS) BASS is an ERG for Black (Black, African American, African, Afro-Caribbean, Afro-Latino) employees and allies. Queerspace Queerspace is an ERG for LGBTQIA+ employees and allies. Somos Squarespace Somos Squarespace, meaning “We are Squarespace” in Spanish, is an ERG for Hispanic/Latinx employees and allies. Squarespace Asian/Pacific Islanders (SQSP/API) SQSP/API is an ERG for Asian, Asian American, and Pacific Islander employees and allies. Women+ at Squarespace Women+ at Squarespace is an ERG for women+ employees and allies; Squarespace uses an inclusive definition of “women” and “female” that welcomes all women, including trans women, genderqueer women, and non-binary people who identify as women in a way that is significant to them. Carespace Carespace is an ERG for employees with caregiving responsibilities for children, other family members and loved ones and allies. 01 02 / ← → Heritage months We value the histories and backgrounds of all Squarespace team members year-round – but make sure that these experiences and stories are especially uplifted through company-wide events and programming during Heritage Months (including Black History Month, Women’s History Month, Asian Pacific Islander Heritage Month, Pride, Hispanic/Latinx Heritage Month, World Mental Health Day and more). At Squarespace, Heritage Month events are widely attended and celebrated by everyone throughout the company and are a special time to come together and highlight all of the beauty and history within our communities. Programs Promoting Inclusivity Creating a culture of inclusivity and belonging is central to how we operate as a company. Here are a few ways we support an inclusive workforce. Paid Family Care Leave Squarespace’s Paid Family Care Leave policy offers eligible employees up to 20 weeks of paid leave in connection with the birth, adoption or foster placement of a child, to care for a family member’s serious health condition, or to provide family care during active military service. Fertility and Adoption Benefits We offer global and inclusive Fertility & Adoption benefits that cover 100% of eligible medical and legal expenses up to $10,000 annually, with a lifetime maximum of $20,000. Inclusion Advisory Council In 2020, we launched an organization-wide advisory body, composed of employees across our various departments, geographies, levels and more, to weigh in on the company’s D&I strategy and corresponding initiatives. Members of the Inclusion Advisory Council examine potential barriers to inclusion and belonging in the workplace and identify solutions and programs designed to positively impact the experience and advancement of underrepresented employees. Mental Health Coverage In the US, employees have access to mental health resources through the Talkspace app, behavioral telehealth services through the HealthJoy app and a robust Employee Assistance Program (EAP) that includes 24/7 online/phone support as well as in-person counseling services. In Dublin, we launched enhanced mental health benefits including reimbursement for psychotherapy visits as well as mindfulness apps and stress management programs. Globally, all employees have access to the full suite of meditations available through the Headspace app. Personal Care Leave Through our Personal Care Leave policy, eligible employees may take up to twelve (12) weeks of paid leave to address their own serious health condition. Support for Our Transgender Community We are proud to support our transgender community through our comprehensive medical benefits, including coverage for gender reassignment services and procedures. Enabling a Culture of Inclusion D&I and inclusive leadership learning opportunities are accessible to everyone, and all employees complete a D&I e-Learning within their first month at Squarespace, covering unconscious bias, inclusivity, allyship, and inclusive conversations. We also offer additional live learning sessions through our Inclusive Leadership series. In addition, select leaders participate in relevant D&I learning experiences that focus on intercultural competence and unconscious bias. Community Impact & Corporate Giving We will match charitable contributions made by Squarespace employees to non-profit and social impact organizations of their choosing up to $/€600 per employee per year. Over the past year, many Squarespace employees set new individual giving records, not only by leveraging the company match but also by prioritizing giving in a time of incredible need. We also regularly partner with nonprofits to host events in our physical offices. We’re committed to supporting marginalized communities and historically underrepresented creators across the globe. Fighting Against Racial Injustice At Squarespace, we believe in the power of individuals to make great things and the power of organizations to make systemic impact. It is our shared responsibility to take action to dismantle the systems of oppression and racism in our society. Squarespace has made long-term commitments to invest in work, organizations and causes that increase fairness, globally. From our social impact efforts to anti-racism training, more trans-inclusive health benefits, sustainability investments and accessibility prioritization within our products and services, our priorities reflect these long-term commitments and are designed to account for the ever-evolving needs of our global communities. Amplifying Voices of Our Customers Our platform is home to dynamic changemakers working to educate others and make a difference in the world, and we have the opportunity to help amplify their missions. We strive to promote and provide visibility for underrepresented creators that use Squarespace, as well as customers using their causes, voices and platforms to enact change. Play From female founders, to Black creatives, to Queer-identifying activists and more, the diversity of our customer-base lends itself to some of the most inspiring stories and we’re committed to sharing their stories with the world. Check out our Collective Futures series for advice and inspiration from Black entrepreneurs. Learn More Learn more about our Stand Proud campaign and read up on the unique stories from our LGBTQIA+ community. Learn More About Us Careers Our Team Locations D&I"
