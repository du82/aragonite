["https://squarespace.com/blog/squarespace-plans-explained"]
title = "Introducing Updates to Squarespace Website Plans – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = '''Making It On Trend Back Introducing Updates to Squarespace Website Plans By Squarespace Get started selling products online with our free downloadable workbook. The email you entered is invalid. Thank you for subscribing. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. Since launching in 2003, Squarespace has grown from its origins as a blog and website building platform to a rich collection of products that help entrepreneurs and creatives of all types take ownership of their online presence.Now, Squarespace is introducing four new website plans to reflect our expanded functionality and the many ways our users sell their goods, services, and content online. These plans are being rolled out in phases and will eventually replace existing website plan options (Personal, Business, Commerce, and Commerce Advanced).These plans are currently available to new and existing Squarespace website accounts in the United States. We will make them available to additional international customers in the coming months.Existing U.S. users on Personal, Business, Commerce Basic, or Commerce Advanced plans can continue to stay on their current plan or decide to switch to one of these new options if they’d like.Eligible users can find a full overview of these plans on our website.Why we’re making this updateWhen designing these new plans, we wanted to create options that offer you both functionality and value. This way, you can access all the Squarespace tools you need, at any point in your journey.We know that someone who starts a website today may one day need tools to manage clients, share content, build communities, or start an online store. These new website plans make it possible for you to take that step immediately, whenever the moment is right. Explore Plans New plans, with expanded accessSquarespace will offer four new subscription options: Basic, Core, Plus, and Advanced. They’re focused on making it easier for you to choose the best subscription for your goals, and will ultimately replace our current offerings for new websites. Our new plans still include Squarespace’s award-winning design tools, hundreds of templates, robust marketing and selling features, and AI functionality to easily get a beautiful website online quickly.We have also made some exciting updates to help you further build your business online: Start selling on any plan: We’re making it easier to sell on any Squarespace website plan by adding additional functionality to our Basic and Core plans, like the ability to sell unlimited products and subscriptions.Earn more from your sales: You’ll get lower Squarespace Payments transaction rates on our Plus and Advanced plans to further reward your sales successes. Expanded content and membership features: Take advantage of lower online store, digital content, and membership transaction fees and increased video storage (previously offered through Digital Products Add-Ons).See details about these new plans in the Help Center. You can review your current subscriptions in your site's Billing panel. To learn more, check your billing subscriptions.What this means for your Squarespace planWe’re excited about the launch of these new plans, but there will be a transition period as we introduce them. Below are your website plan options, depending on your current website subscription status with Squarespace.New and existing website users in the U.S.: Choose from one of the four new website plans when you decide to subscribe, create a new site, change plans, or change billing cycle.New and existing website users outside of the U.S.: Choose from legacy website plans until new plans are ready to release in your market.Existing users who become eligible for these new plans can choose to stay on their current plan or initiate a change in the future. If you change your billing plan or cycle or reactivate an expired legacy site, you’ll leave your legacy plan and will need to choose from one of our new plans instead. It's not possible to return to a legacy plan after switching to a Core, Basic, Plus, or Advanced plan or canceling service.What’s next for you?We’re excited to see how you take advantage of these new plans to build your business on Squarespace. In the coming months, we’ll be focused on getting our plan offerings right for new and existing users in non-U.S. markets. We’ll continue to update this article or you can check relevant Help Center guides for updates on the rollout.If you’re happy with your current subscription plan, then there’s no need to change. Our goal is to provide you with more flexibility to choose the tools that fit your unique needs. New users in eligible markets can view the new plans on our Pricing page. Or learn more about these new plans and eligibility in this Help Center resource. Browse Website Templates Posted on 27 Feb 2025 website design ecommerce SQSP FAQ Share: Related Articles Product Updates November 2023 Product Updates November 2023 Product Updates By Squarespace 27 Nov 2023 Product Updates March 2024 Product Updates March 2024 Product Updates By Squarespace 27 Mar 2024 Subscribe Subscribe to receive the latest MAKING IT blog posts and updates, promotions and partnerships from Squarespace. The email you entered is invalid. Thank you for subscribing. By providing your email, you indicate you have read and understood our Privacy Policy. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://squarespace.com/blog/squarespace-plans-explained" }, "headline": "Introducing Updates to Squarespace Website Plans", "image": { "@type": "ImageObject", "url": "https://static1.squarespace.com/static/5134cbefe4b0c6fb04df8065/5dcb2d0669b294381f8ffb16/67a52c64ba090e47300756da/1738878056395/D011_Advancement-Project_Header_Desktop_1920x1062px+%284%29.jpg" }, "datePublished": "2025-02-27T11:43:22-05:00", "dateModified": "2025-02-27T11:43:22-05:00", "author": { "@type": "Person", "name": "Squarespace" }, "publisher": { "@type": "Organization", "name": "Squarespace", "logo": { "@type": "ImageObject", "url": "https://media-www.sqspcdn.com/logos/favicon-dark-mode.ico" } }, "description": "Squarespace is rolling out four new website plans that reflect our expanded functionality and the many ways our users show up and earn money online." }'''
