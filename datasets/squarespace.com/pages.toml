description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = "Online Stores Store Management Manage your online store Handle shipping and fulfillment, taxes, payments and more, all in one place. Shipping & Fulfillment Showcase your products at their absolute best with Squarespace’s rich product offerings. Shipping options Offer flexible shipping options, including flat-rate, weight-based, carrier-calculated, and free shipping. Shipping labels Save money and time by purchasing and printing USPS and UPS® shipping labels directly from Squarespace. Customers will be able to view detailed tracking information for orders shipped with shipping labels purchased through Squarespace. Local pickup Connect with local customers and help them save money by offering in-person pick up. Fulfillment profiles Create shipping rules to customize how your products are fulfilled. Specify whether a product can be shipped, picked up in person, or either. You can also set flat rate shipping costs for individual products. Plus, use profiles to set available countries by product. Shipping extensions Connect a third-party extension to streamline shipping and fulfillment. Print labels, manage returns, or outsource fulfillment. Learn more. Simple payment and checkout Squarespace offers straightforward payment and checkout options for your customers. Offer many ways to pay With Squarespace Payments, you can offer popular payment methods like Klarna, ACH, Apple Pay, and all major credit and debit cards. Accept in person payments Connect a Square reader to the Squarespace app to sell in person. Keep customers on your site Customers can browse products, manage their cart, and checkout all without ever leaving your store. Squarespace makes managing taxes simple Tax-inclusive pricing Set prices inclusive or exclusive of tax and customize invoices to suit your needs. Sales tax calculation Automatic sales tax calculation from TaxJar is included with Squarespace Commerce, so you can easily charge customers tax. * TaxJar is not available outside the US. Automate tax filing and reporting Upgrade to the TaxJar Professional plan to automate sales tax filing and reporting. Order Management Effortlessly manage your orders and engage with your customers. View Order Details Access your customer information, orders, shipping addresses and more online or with the Squarespace mobile app for iOS and Android. Manage customer profiles Take insight-driven actions with Contacts. Tailor your strategy and personalize your marketing like never before. Send customer notifications Customize the design of the transactional emails your customers receive to match your brand. Learn more about managing your store Explore the Blog → → How to manage inventory for your online store How to Set Up Shipping for Your Online Business How to Optimize Selling, Shipping, and Fulfillment on Your Online Store Learn more about managing your store Explore the Blog → → How to manage inventory for your online store How to Set Up Shipping for Your Online Business How to Optimize Selling, Shipping, and Fulfillment on Your Online Store 01 02 / 03 ← → Award-winning customer support Our customer care team is here 24/7 to help via email and live chat. We never outsource our support, and you’ll usually get a response in about an hour.Squarespace offers email support 24 hours a day, 7 days a week, as well as live chat. Visit Help Center Contact Support Webinars Hire an Expert Squarespace is the all‑in‑one platform to build a beautiful website. Start a Free Trial"
