full_description = "Websites Analytics Understand your site’s performance Gain powerful insights into who’s visiting your site and how they’re interacting with your content with our in-depth website Analytics tools. Traffic and trends Learn where your website traffic is coming from, what your visitors are looking for, and how they’re interacting with your content or products. Traffic overview View how your site visits, unique visitors, and page views trend over time. Gain valuable insight into the top traffic sources. Activity log See how visitors are navigating through your site. Geography Understand where your visitors are coming from. Google search keywords Learn what search keywords are leading visitors to your website. Traffic sources Learn where your site visits and sales are coming from and analyze which channels are most effective. Dig into specific referral links to see which press articles and posts lead to the most traffic or sales. Site content Use engagement stats like views, time on page, exit rate and more to quickly identify popular content. Get started “It’s fascinating to learn things like where in the world people visit your site the most, or from what platform people discover your site.” Daniela Jacobs, Founder arc-objects.com 01 02 / ← → Commerce analytics Understand how your business is doing by tracking revenue, orders, units sold, and much more. Learn which traffic sources and products are generating the most sales. Delve into your purchase funnel to learn how you can optimize for conversion. Sales overview Track how key performance metrics, such as Revenue, Units Sold, Orders, Visits, Conversion Rate, Average Order Volume, and Revenue Per Visit, change over time. Sales by product Gain insight into your top performing products with metrics such as revenue and conversion rate. Purchase funnel A visual report that shows how many visits result in purchases and where customers are dropping off. Abandoned cart Gain insight into how many of your carts are being abandoned, recovered, and the revenue those represent. Check analytics from anywhere Understand your audience with a holistic view of your website analytics, including pageviews and sales, all available on the Squarespace App. Download for iOS Download for Android Squarespace is the all‑in‑one platform to build a beautiful website. Start a Free Trial"
