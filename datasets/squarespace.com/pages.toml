description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = '''Making It Makers Back How Jazmine Rogers Brings Her Brand of Fun and Community to Sustainable Fashion By Amanda Shih-Goel Learn how to build an engaging and profitable blog with our free guide. The email you entered is invalid. Thank you for subscribing. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. Jazmine Rogers has built her career in sustainable fashion by making space—for a more creative approach to sustainability and others like her. “I grew up really loving fashion. So naturally when I went to school, I wanted to go study it and be a part of the industry,” she says. “But while I was studying, I realized that there were a lot of issues with the fashion industry that weren't being addressed with the planet and people in mind. And I knew that if I wanted to be a part of the fashion industry, I needed to make sure that those values were still at the forefront of what I was doing.”To bring that vision to life, Jazmine created Sustainable Baddie. Part blog, part guide, and part community hub, the site, its social content, and Jazmine’s work as a content creator have become a full-time career deeply rooted in her passion for living sustainably. Read on to learn how Jazmine started sharing her sustainability journey, why she trusted Squarespace to help her grow, and how you can follow your passions to build something new of your own. Launch Your Next Idea Creating the conversation she wanted to seeWhen she first started learning about sustainability practices, the conversation on the topic felt like it was missing some energy. “It was just very neutral, minimalistic, and not really diverse and inclusive,” Jazmine says. “I knew that sustainability and sustainable fashion could be really fun and really creative.”“I wanted to be able to explore on my own and show that you can care about the planet and people, but also have your own voice and have your own fun style as well,” she says. So she launched her first blog, That Curly Top, which now has several offshoots across social media. As she built a following around That Curly Top and her experience with sustainable living grew, Jazmine decided to create a new space to share and connect—Sustainable Baddie.Building hand-in-hand with a community The vision for Sustainable Baddie included others in the sustainability community from the very beginning, which has helped it become the unique resource it is today. “I knew that the solutions that I'm looking for in the fashion world and the creativity that exists—all of that goes beyond my own personal platform and my own personal perspective and voice,” Jazmine says. “And there's so many people doing so many incredible things in all these different industries across sustainability that nobody really knows about. Or people aren't able to find each other.” With Sustainable Baddie, all of these people have the opportunity to share their perspectives and find others who share their passions. “I really wanted to create a platform where people can come together and know that there's a community out there for them that all supports this mindset of seeing sustainability as a really fun vehicle of creative expression and making the world a better place,” Jazmine says.As the business and brand grow, Jazmine is looking ahead at big plans for in-person events. “We have some really fun things in the works,” she says. “At the end of the day, it's just to make sure that we're not only able to get these people together online but that they're able to further those connections in person as well, because that's where a lot of change actually happens. Once you get people in the same room together, a lot of magic happens.” “I wanted to be able to explore on my own and show that you can care about the planet and people, but also have your own voice and have your own fun style as well.” Trusting Squarespace to give her ideas a home onlineWhen Jazmine launched That Curly Top, there were fewer options for getting your content out online. She ended up turning to Squarespace and sticking with it thanks to the many resources for getting started.“Squarespace was the only place I could find that had real customer service that actually was live with me as I was going through it. They'd actually walk me through the process or like direct me to some amazing resources,” she says.“When I eventually moved over to Sustainable Baddie, Squarespace was the first and only place I really wanted it to be, because I knew it would be just as easy. And if I had any troubles, I knew that I would be able to run over to the customer service section that I really, really appreciate to this day.” What’s more, Jazmine wanted to work on a platform that felt like it could support Sustainable Baddie over the long run. Since launching the website and blog, she’s started to explore the ecommerce tools in launching their first piece of merch. “I think that's really good for what Sustainable Baddie needs,” she says. “Because as Squarespace grows, we're gonna be growing too.”Designing a website that reflects her energyReflecting the playful, creative energy Sustainable Baddie brings to the sustainability conversion in its website was important for giving the brand a good online home. But with plenty on her plate, Jazmine also needed something that made standing out easy to accomplish. “I like how beautiful the websites are and how simple they make the whole process. I think that's also what's nice about Squarespace—you have to keep things pretty simple in some ways. But I was able to add some little doodles and drawings,” she says. She worked with a Squarespace Expert to give her site images that extra sparkle and a collage-like feel. But much of the design was about communicating a light, fun energy.“I just wanted Sustainable Baddie to be a place where people can just feel like they can kind of scroll around all day,” she says. “Playfulness and fun are just at the core of what we do and we want people to just be able to come here and feel like it's a little online playground.”Letting your instincts lead your growthFor others who care deeply about one of their interests, but aren’t sure how to take a deeper dive into them, Jazmine’s advice is simple: “If you feel like you should do it, you should just do it.”“When you're walking towards your passions and the things that you love, it's like things start to naturally align over time,” she adds. “It doesn't happen in a perfect straight line. It's definitely a huge zigzag, but I feel like life will stumble you into all these different scenarios and situations that you don't know make sense. And all those things that you start, that you go through, you learn so much along the way to lead you to where you want to go.” Inspired by Jazmine’s story? Create your next passion project on Squarespace. Start A Free Trial Posted on 27 Nov 2023 SQSP entrepreneurs fashion blogging community-building social media Share: Related Articles Makers How Zoey Gong Uses Squarespace to Monetize Her Expertise and Build Community Spaces How Zoey Gong Uses Squarespace to Monetize Her Expertise ... By Amanda Shih-Goel 24 May 2023 Makers How Lottie Murphy Puts Passion and Purpose In Her Pilates Business How Lottie Murphy Puts Passion and Purpose In Her Pilates ... By Amanda Shih-Goel 15 Aug 2023 Subscribe Subscribe to receive the latest MAKING IT blog posts and updates, promotions and partnerships from Squarespace. The email you entered is invalid. Thank you for subscribing. By providing your email, you indicate you have read and understood our Privacy Policy. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://squarespace.com/blog/jazmine-rogers-sustainable-baddie-fashion-community" }, "headline": "Jazmine Rogers on Creating Community in Sustainable Fashion", "image": { "@type": "ImageObject", "url": "https://static1.squarespace.com/static/5134cbefe4b0c6fb04df8065/5dcb2d0669b294381f8ffb16/655cd89bc2777b78a57e0daf/1700583581920/11.21_JazmineRogers_Header_Desktop_1920x1062px.jpg" }, "datePublished": "2023-11-27T09:42:00-05:00", "dateModified": "2023-11-27T09:42:00-05:00", "author": { "@type": "Person", "name": "Amanda Shih-Goel" }, "publisher": { "@type": "Organization", "name": "Squarespace", "logo": { "@type": "ImageObject", "url": "https://media-www.sqspcdn.com/logos/favicon-dark-mode.ico" } }, "description": "Learn how Jazmine Rogers launched Sustainable Baddie, a part blog, part guide, and part community hub for sustainable living." }'''
