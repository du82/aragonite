title = "Accept Payments Online – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = '''Squarespace PaymentsYour payments, all in one placeGet startedPaymentsGet startedExploreManage PaymentsSeamless CheckoutSquarespace CapitalExploreManage PaymentsSeamless CheckoutSquarespace CapitalManage your payments on SquarespaceScale your business from a single dashboard. Securely sell products, services, and digital downloads while effortlessly managing transactions and accelerating payouts.Seamless from first click to payoutConnect Squarespace Payments to your account to start accepting payments and receiving payouts in minutes–all from one dashboard. No need to connect to a third-party.Payments on-the-goManage your business from anywhere. Track orders, inventory, and more with the Squarespace app. Available on iOS and Android.Eliminate platform switchingA streamlined payment workflow means fewer dashboards without sacrificing the functionality or features you trust.International availabilityThe easiest way to directly manage payments in the US, UK, Canada, France, and Ireland. Coming soon to Germany, Australia, New Zealand, the Netherlands, Norway, and Sweden.Reach more customers, make more salesSquarespace Payments powers businesses of all sizes, helping entrepreneurs get paid faster while building memorable customer-first brands.Customer-friendly payment methodsA flexible payment process drives repeat business. Accept payments via debit, credit, Afterpay, Apple Pay, ACH Direct Debit, mobile wallets, Klarna, and more.Credible and compliantKeep customer financial information safe with payment data encryption, instant transaction risk monitoring, PCI-compliant servers, and SSL-protected checkouts.Optimized checkoutOffer your customers a flexible and convenient checkout experience to maximize conversion.Grow your business with Squarespace CapitalAvoid the hassle of the traditional loan process. Easily access financing through Squarespace Capital. Currently available in the U.S. only.Straightforward pre-qualification processEligibility is determined on sales history and store performance. We'll let you know if you're eligible to apply for a loan.Easy application processComplete the application in the Squarespace dashboard in just a few minutes. Find out if you’ve been approved in a few business days.Receive funds quicklyIf you're approved, see the funds in a few business days. Grow and capitalize on opportunities by receiving funds quickly.Automatic repaymentRepay your loan with a fixed percentage of daily sales*. Unlike traditional loans, repayment amounts align with your cash flow.Squarespace Capital offers eligible businesses access to fast, flexible financing. Loans are issued by Celtic Bank and serviced by Stripe. All loans are subject to credit approval.*You’ll have a minimum amount due each repayment period, and if the total amount that you repay through sales doesn’t meet the minimum, your account will be automatically debited the remaining amount at the end of the period.An ecosystem ready to process your paymentsInvoicingGet paid for your services→Online storesSell anything, everywhere→ServicesPromote and sell your offerings→Frequently asked questionsWhat is Squarespace Payments?Squarespace Payments is our new, native payment solution. You can collect and manage payments from your customers, all within Squarespace. With Squarespace Payments, you don’t need to connect your Squarespace account to a third-party payment provider: all your payment and payout information is available right in your Squarespace dashboard.What payment methods are available with Squarespace Payments?With Squarespace Payments, you can accept popular payment methods including Apple Pay, Klarna, Afterpay, and Link. ACH Direct Debit allows customers to connect a US bank account to pay with direct deposit, and saves you money with a lower transaction fee. Or, accept debit and credit cards from Visa, Mastercard, American Express, Discover, Diners Club, JCB, and UnionPay.Is Squarespace Payments available to all active Squarespace customers?Squarespace Payments is continuously rolling out to all Squarespace customers with businesses based in the United States, Canada, Ireland, France, and the UK. You will be notified when Squarespace Payments is made available to you.Will Squarespace Payments be available in more countries in the future?Yes, we plan to expand Squarespace Payments to more countries in 2025.Can I use Squarespace Payments with any Squarespace website plan?Yes, you can use Squarespace Payments on any website plan.What security features does Squarespace Payments provide?Squarespace keeps your financial information safe with PCI-compliant servers, payment data encryption, secure checkouts, and instant transaction risk monitoring.How can I accept payments online?The first step for accepting payments online is choosing a reliable payment processor that supports credit cards and other popular payment methods. These payment solutions allow you to securely process customer transactions and receive payouts to your bank account.Squarespace Payments makes this entire process simple for one-time purchases, subscriptions, donations, and several other physical or digital products. To accept payments online for a business, you’ll also likely need to verify your business information before completing your setup.Can I take payments directly through my website?Yes, you can accept payments directly on your website after connecting Squarespace Payments or a third-party payments processor. This integration acts as a virtual card reader and allows you to securely handle online transactions within the checkout experience on your site. With Squarespace Payments, you can securely process payments with your existing Squarespace account (as long as you’re a Site Owner or Administrator).{"@context":"http://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Squarespace Payments?","acceptedAnswer":{"@type":"Answer","text":"Squarespace Payments is our new, native payment solution. You can collect and manage payments from your customers, all within Squarespace. With Squarespace Payments, you don’t need to connect your Squarespace account to a third-party payment provider: all your payment and payout information is available right in your Squarespace dashboard."}},{"@type":"Question","name":"What payment methods are available with Squarespace Payments?","acceptedAnswer":{"@type":"Answer","text":"With Squarespace Payments, you can accept popular payment methods including Apple Pay, Klarna, Afterpay, and Link. ACH Direct Debit allows customers to connect a US bank account to pay with direct deposit, and saves you money with a lower transaction fee. Or, accept debit and credit cards from Visa, Mastercard, American Express, Discover, Diners Club, JCB, and UnionPay."}},{"@type":"Question","name":"Is Squarespace Payments available to all active Squarespace customers?","acceptedAnswer":{"@type":"Answer","text":"Squarespace Payments is continuously rolling out to all Squarespace customers with businesses based in the United States, Canada, Ireland, France, and the UK. You will be notified when Squarespace Payments is made available to you."}},{"@type":"Question","name":"Will Squarespace Payments be available in more countries in the future?","acceptedAnswer":{"@type":"Answer","text":"Yes, we plan to expand Squarespace Payments to more countries in 2025."}},{"@type":"Question","name":"Can I use Squarespace Payments with any Squarespace website plan?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can use Squarespace Payments on any website plan."}},{"@type":"Question","name":"What security features does Squarespace Payments provide?","acceptedAnswer":{"@type":"Answer","text":"Squarespace keeps your financial information safe with PCI-compliant servers, payment data encryption, secure checkouts, and instant transaction risk monitoring."}},{"@type":"Question","name":"How can I accept payments online?","acceptedAnswer":{"@type":"Answer","text":