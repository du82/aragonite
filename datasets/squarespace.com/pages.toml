["https://squarespace.com/scheduling"]
title = "Acuity Scheduling: Appointment Scheduling Websites – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = 'Appointment scheduling made easyTry SchedulingNo website or credit card required.Acuity SchedulingTry SchedulingExploreAppointmentsPaymentsClient ManagementPricingExploreAppointmentsPaymentsClient ManagementPricingSimplified scheduling to maximize appointmentsA flexible scheduling software to provide easy client booking for classes, appointments, and virtual or in-person sessions.Seamless client bookingEliminate back-and-forth with clients when they book directly on your website or branded booking page.Comprehensive calendar settingsKeep your day running smoothly by adding daily booking limits, setting scheduling rules, and relying on automatic time zone detection.Organize group classesSet size limits, offer one-off or multiple sessions, and add registration forms at sign-up to gather attendee information.Custom intake formsStart every session prepared. Use intake forms to gather information before sessions and share your cancellation policy and appointment terms—included in all plans.Get paid on your termsMake it easy for guests to pay with a seamless checkout and payment experience. Offer flexible payment options to meet your clients needs and increase your bookings revenue.Integrated paymentsAccept payment at booking or in-person with Stripe, Square, or PayPal. Collect deposits ahead of time, accept tips, and send invoices.Revenue-driving toolsEncourage bulk appointment purchases and recurring services with packages, subscriptions, and gift-cards.Tools to manage and delight your clientsSave time, keep your clients informed, and nurture relationships with automated communications.Automated messagingEliminate repetitive tasks with automated reminder texts and confirmation, cancellation, and follow-up emails.Holistic client profilesKeep client information and appointment notes organized so you can provide the best service at every session.Mobile app managementManage clients, track your calendar, accept payments, and automate receipts with on-the-go scheduling tools.Personalized communicationMake clients feel welcome while setting professional boundaries by adding a personal touch to your automated messages.Powerful scheduling automation plans with award-winning customer service. Try for free today.*All prices are in USD, and do not include applicable taxes.Pay annuallyAnnuallyPay monthlyMonthlyEmergingSave 0% annuallyTry Scheduling1 bookable calendarAlso includesClient self-schedulingUnlimited services and appointmentsPayments processing and deposits through Stripe, Square, or PayPalConfirmation, reminder, and follow-up emailsGrowingRecommendedSave 0% annuallyTry SchedulingUp to 6 bookable calendarsIncl. all Emerging features, plusText message reminders, globallyBundled appointment packagesMemberships & subscriptions with automated billingGift certificatesPowerhouseSave 0% annuallyTry SchedulingUp to 36 bookable calendarsIncl. all Growing features, plusRemove "Powered by Acuity" on your schedulerSign BAA for HIPAA complianceMultiple time zones for different staff/locationsCustom API + and CSS for developersFeatures included with all plansEmbed your scheduler in your websiteCustomization with brand colors and logoDownload the Acuity Mobile appGoogle Meet, Zoom, and GoToMeeting integrations for online meetingsCollect client details with custom intake formsAutomatically accept payments after appointments with payment linksOffer classes, workshops, or group eventsAutomatic time zone conversion for clientsFrequently asked questionsWhat’s Acuity Scheduling?Acuity Scheduling is a complete online scheduling solution for your business. Acuity offers powerful tools, including calendar syncing, automated email and text message reminders, payment processor integrations, and more.Is Acuity the same thing as Squarespace Scheduling?Acuity was acquired by Squarespace in 2019. For several years, we offered Squarespace Scheduling, a rebranded version of Acuity for new customers using Squarespace accounts. At the same time, we continued to support our many loyal customers through the Acuity brand. Now, we’re uniting the scheduling experience under the Acuity name for everyone. If you’ve been using Squarespace Scheduling, you’ll find everything works exactly the same, even if the name is different. Learn what Acuity Scheduling does and how it’s related to Squarespace.Do I need a Squarespace website to use Acuity?You don’t need to sign up for anything else to use Acuity. Acuity includes a separate scheduling page clients can visit to book appointments, and you can embed your Acuity scheduler in almost any website. If you decide to add a Squarespace website, you can use Squarespace’s tools and beautifully designed templates to build an online presence that’s more than a booking page. In addition to displaying your appointments, you can sell products, create a blog, offer video courses, and more. And you can embed your Acuity scheduler in your Squarespace website without needing to write any code by using the Scheduling block.How do I get started with Acuity?When you sign up for Acuity, you’ll create a Squarespace account that you’ll use to log into Acuity. Visit Getting started with Acuity to learn how to sign up and log in.How many calendars do I need?Each calendar is a set of times that clients can book with you. Some businesses have one set of hours and can use one calendar. Others need calendars for each employee, location, or another resource. If you’re not sure how many you need, contact us and we’ll help you find a solution.Can I collect payment through Acuity Scheduling?Yes. You can use Stripe, Square, or PayPal to accept payments from clients. Clients can pay when they book online, or you can enter payments from the admin end. These payment processors are separate from any other payment processors you use in Squarespace. To learn more and get started, visit Payment processors you can connect to Acuity.{"@context":"http://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What’s Acuity Scheduling?","acceptedAnswer":{"@type":"Answer","text":"Acuity Scheduling is a complete online scheduling solution for your business. Acuity offers powerful tools, including calendar syncing, automated email and text message reminders, payment processor integrations, and more."}},{"@type":"Question","name":"Is Acuity the same thing as Squarespace Scheduling?","acceptedAnswer":{"@type":"Answer","text":"Acuity was acquired by Squarespace in 2019. For several years, we offered Squarespace Scheduling, a rebranded version of Acuity for new customers using Squarespace accounts. At the same time, we continued to support our many loyal customers through the Acuity brand. Now, we’re uniting the scheduling experience under the Acuity name for everyone. If you’ve been using Squarespace Scheduling, you’ll find everything works exactly the same, even if the name is different. Learn what Acuity Scheduling does and how it’s related to Squarespace."}},{"@type":"Question","name":"Do I need a Squarespace website to use Acuity?","acceptedAnswer":{"@type":"Answer","text":"You don’t need to sign up for anything else to use Acuity. Acuity includes a separate scheduling page clients can visit to book appointments, and you can embed your Acuity scheduler in almost any website. If you decide to add a Squarespace website, you can use Squarespace’s tools and beautifully designed templates to build an online presence that’s more than a booking page. In addition to displaying your appointments, you can sell products, create a blog, offer video courses, and more. And you can embed your Acuity scheduler in your Squarespace website without needing to write any code by using the Scheduling block."}},{"@type":"Question","name":"How do I get started with Acuity?","acceptedAnswer":{"@type":"Answer","text":"When you sign up for Acuity, you’ll create a Squarespace account that you’ll use to log into Acuity. Visit Getting started with Acuity to learn how to sign up and log in."}},{"@type":"Question","name":"How many calendars do I need?","acceptedAnswer":{"@type":"Answer","text":"Each calendar is a set of times that clients can book with you. Some businesses have one set of hours and can use one calendar. Others need calendars for each employee, location, or another resource. If you’re not sure how many you need, contact us and we’ll help you find a solution."}},{"@type":"Question","name":"Can I collect payment through Acuity Scheduling?","acceptedAnswer":{"@type":"Answer","text":"Yes. You can use Stripe, Square, or PayPal to accept payments from clients. Clients can pay when they book online, or you can enter payments from the admin end. These payment processors are separate from any other payment processors you use in Squarespace. To learn more and get started, visitConnecting payment processors to Acuity Scheduling."}}]}24/7 SupportHelp CenterGet help from our award-winning Customer Support team.→WebinarsFree online sessions to learn the basics and refine your skills.→Start your free Acuity trial todayNo website or credit card required.Try SchedulingTry Scheduling'
