full_description = "Websites Privacy and Security Privacyand Security The privacy and security of our customers’ data is our top priority. We take pride in our efforts to secure the data of both our customers and that of their customers. Data Privacy as a Priority We work hard to keep your data private and secure. Squarespace has a dedicated team for your security, composed of Security Engineers and Governance, Risk and Compliance professionals. We collaborate on both technical and procedural security solutions by taking the following steps. 01. Coordinate audits and maintain security and privacy standards 02. Coordinate regular risk assessments and actions for addressing risks 03. Manage internal security policies as well as the design and implementation of security compliance related controls 01. Coordinate audits and maintain security and privacy standards 02. Coordinate regular risk assessments and actions for addressing risks 03. Manage internal security policies as well as the design and implementation of security compliance related controls How Squarespace Protects and Processes Your Data SSL Certificates Squarespace website traffic is encrypted via SSL providing a secure end to end connection for you and your visitors. SSL prevents hackers from impersonating your site or stealing information that customers submit, like an email address or a credit card number. All domains connected to Squarespace are automatically protected with free SSL certificates. Learn More → → GDPR We also take a continuously evolving approach to GDPR to ensure we’re most up to date. We work diligently to ensure we are prepared to meet the demands of GDPR as a company and for our customers. Our efforts include reviewing how we store and use data about our customers and on their behalf. We also give you the editing tools to post your own legal terms or privacy policies on your site. Learn More → → Cookies We use cookies to help your site run effectively and provide the best experience for your visitors. We also use cookies on squarespace.com across our web and mobile apps to operate and secure our services, and customize your experience. Learn More → → Learn More To learn more about everything we’re doing to ensure your data is private and secure, visit our Help Guides. We have guides to provide you with the most detailed information about all of our efforts related to Privacy and Security, including GDPR, EU Cookie Requirements, and more. Visit Help Center Contact Support Webinars Squarespace is the all‑in‑one platform to build a beautiful website. Start a Free Trial"
