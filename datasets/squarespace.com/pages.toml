["https://squarespace.com/feature-index"]
title = "Feature List - All Squarespace Features – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = "Feature List Behind the beautiful interface, Squarespace is an incredibly rich publishing platform. Here, you can find an exhaustive list of everything the Squarespace platform can do. Websites Artificial Intelligence (AI) Commerce Squarespace Payments Domains Content and Memberships Marketing Analytics Extensions Connected Services Enterprise Site-Building Tools Acuity Scheduling Unfold Bio Sites Logo Tock Resources & Support Websites Artificial Intelligence (AI) Commerce Squarespace Payments Domains Content and Memberships Marketing Analytics Extensions Connected Services Enterprise Site-Building Tools Acuity Scheduling Unfold Bio Sites Logo Tock Resources & Support Websites Website Builder Stand out online with a professional website, online store, portfolio, or blog. With Squarespace, you can turn any idea into a reality. Learn More → → Customizable Templates Each Squarespace template design has been crafted by our world-class design team, and can be customized to fit your brand. Every template design supports all major content types, including pages, galleries, blogs, commerce, calendars, and more. Our template designs are created with modern browsers and mobile devices in mind, and employ the latest HTML, CSS and Javascript techniques. Learn More → → Pre-Built Layouts Build a page using pre-designed structures for specific purposes such as Contact, About, Blog, Portfolio, Products, and more. Page elements are arranged to quickly create professional layouts and showcase your content. Add or remove blocks to create a custom look. Learn More → → Customizable Page and Content Layouts Each design is built with customizable content areas. Content Types Add and manage text, photos, videos, audio, galleries, products, newsletter sign-ups, appointments, calendars, tour dates, reservations, menus, forms, maps, links, files, social links, buttons, quotes, custom code, charts, and more. Learn More → → Duplicate Pages and Content Easily duplicate pages and other content for testing purposes, or to speed up your website building process. Learn More → → Design Tools Squarespace offers flexible layouts, custom color palettes, Google and TypeKit fonts, free high quality images through Unsplash, built-in photo editing capabilities, video and background banners, animation options, and more. Learn More → → Universal asset uploading Upload new assets or replace old ones anywhere on your site with the same flow. Learn More → → Asset Library Upload, organize, and access all your content from one central hub and use them across the Squarespace platform. Learn More → → Upload photos from mobile Add photos directly from your phone’s camera roll to your site with the Squarespace app. Learn More → → Custom CSS Custom CSS can be applied to any site through our built-in custom CSS editor, which also provides image and font file storage for CSS assets. Learn More → → Commenting System Our completely integrated commenting system supports threaded comments, and all comments have individual like counts. The commenting system includes content moderation, community management, bulk comment management, reader feedback to flag spam or trolls, powerful abuse filters, and customizable settings, like automatically disabling comments after a cut-off date. Learn More → → Multiple Contributors and Access Levels Give contributors selective access to your site, depending on their permissions. Access levels include Administrator, Website Editor, Billing, Analytics, Scheduling Administrator, Email Campaigns Editor, Comment Moderator, Viewer, and Store Manager. Using a single login, contribute and manage multiple Squarespace sites at once. Learn More → → Passwords & Page Locks Lock your entire website with a password while you are under construction. Lock individual pages behind a password to create private areas on your site. Customize the page that displays to visitors whenever a website or page is password-protected. Learn More → → Custom Redirects Create custom 301 and 302 redirects directly from our interface to enable shortcuts or remap old content to new places. Learn More → → Custom Site Search Engine Squarespace has a robust internal search engine that provides your visitors with accurate search results. Learn More → → Built-in Mobile Websites Every design automatically includes a unique mobile experience that matches the overall style of your website, so your content will look great on every device, every time. Learn More → → Squarespace App Manage your Squarespace site while on the go with our powerful app available on Android and iOS. Edit pages, add new images to galleries directly from your device, write and edit new blog posts, make style changes, manage your store, and review recently updated pages and traffic analytics. Learn More → → Get Started Blogging Customizable Layouts You can customize your blog posts with any content block, including text, audio, video, and more. Learn More → → Workflow You can publish, draft, and schedule posts, and flag drafts as Needs Review. Learn More → → Markdown Support Use the Markdown Block to compose posts using Markdown. Learn More → → Scheduled Posts Schedule entries to be published in the future. Learn More → → Podcast Support Squarespace offers complete podcasting support, with Audio Block and blog post options that set you up for success with Apple Podcasts and other podcasters. Learn More → → Email Campaigns Integration After publishing a blog post, you can automatically reformat the post content into a draft of an email campaign. Learn More → → Excerpt and Source URLs Save excerpts and source URLs with each post. AMP Integration Create streamlined versions of your blog posts so they'll load more quickly on mobile devices. Learn More → → RSS Syndication RSS is automatically embedded in every Blog Page for easy reader support. Learn More → → RSS Blocks Make it easy for visitors to add your feed to their newsreader by adding a subscribe button anywhere on your website. Learn More → → Category/Tag Support Tag and category support provide two levels of organization. Learn More → → External Link Options Customize the title of any blog post to link to an external URL. Learn More → → Customizable URLs Every blog post has a unique permalink with a properly labeled, clean URL slug that can be customized. Multiple Author Support Publish content by different authors on your blog. Learn More → → Portfolios Squarespace Image Editor All images hosted on Squarespace can be edited directly within your browser using Squarespace's built-in Image Editor. Crop, resize, rotate, adjust brightness and contrast, and much more. Learn More → → Portfolio Pages Create stylized landing pages that link visitors to sub-pages. This is a great way to organize and showcase galleries, projects, portfolio highlights, and other content in one place. Learn More → → Lightbox Presentation Lightbox functionality is integrated into Squarespace Image Blocks and galleries, displaying beautiful full-browser-sized imagery. Learn More → → Image Focal Point Control Define the focal point of your images, ensuring the perfect crop for thumbnails or resized images. Learn More → → Image Metadata Importing Squarespace can auto-fill the title, description, and tags for your images using the metadata you’ve already assigned to them in your photo management software when imported into galleries. Learn More → → Artificial Intelligence (AI) Squarespace Blueprint AI Squarespace Blueprint AI builds your website using the aspects of your brand that make it unique, from your business type to your preferred color palette, to generate a beautiful, bespoke starting point for your creative journey. Learn More → → Brand Identity Squarespace’s personalized AI experience lets you create a consistent brand voice that is used across all your content. Learn More → → Business Name Generator Generate AI-powered business name ideas with a short prompt to describe your business. Learn More → → AI Website Copy Start from scratch or edit pre-written text. No matter the placement, you’ll get a hard-working website copy that matches your brand. AI Product Descriptions Write compelling product descriptions in seconds. Get started by entering a few words about what you’re selling. AI Email Campaigns Generate engaging email copy that’s true to you. Describe your goal and target audience, then get ready to send. AI Blog Posts Quickly draft, edit and perfect your blog posts with AI, regardless of the topic or desired length. Commerce Sell Products Showcase your products at their absolute best. Sell thousands of products through your site, so your visitors can browse your merchandise, add items to their cart, and check out easily and securely. Learn More → → Sell Services An online store isn’t just for physical goods. Create a website that helps your business attract new customers so they can book or schedule your services. Learn More → → Sell Subscriptions Easily sell subscriptions to products and services on a weekly or monthly basis to generate recurring revenue and build customer loyalty. Learn More → → Sell Downloadable Content Sell digital content like music and ebooks via direct download from your site. Download products are delivered via customized email links that expire within 24 hours. Learn More → → Add Gated Content Monetize your site content by charging for access to your courses, blog posts, members-only areas, or library of videos. Learn More → → Sell Custom Merch Easily design and sell high-quality, custom products without having to handle the logistics of production, inventory, or fulfillment. Learn More → → Product Merchandising Easily sort, organize, and manage your products with our drag-and-drop sorting tool, tags and categories, and visibility and scheduling settings. Customize your product details pages with multiple page layout options. Learn More → → Product Subcategories Organize products into subcategories, giving you control over your store’s navigation and making it easy for customers to find your products. This improves your SEO by automatically generating Category pages that are indexed by search engines. Shipping labels Buy and print USPS shipping labels for your pending orders directly from Squarespace on desktop or on the Squarespace app. Learn More → → Product Quick View Customers can see product details from the list view and navigate to other products in the collection. Learn More → → Product Image Zoom Set a zoom factor and select whether zoom occurs on click or hover. Learn More → → Limited Availability Labels Increase urgency and encourage conversion by letting customers know the current inventory level of any product with a Limited Availability Label. As a merchant, you can customize how, when, and where the label appears to customers on your site. Learn More → → Discounts Create automatic discounts that apply to entire orders, orders over a set amount, or specific products, and offer free shipping. Reduce the risk of overuse by limiting discounts to one use per customer, or setting the total number of uses. Learn More → → Related Products Show relevant products to increase the chance your customers find what they’re looking for and make a purchase. Learn More → → Inventory Management Manage your inventory with an easy-to-use interface and quick views into your variants and stock levels. We’ll send you an email alert when your stock levels are low. Learn More → → Order Management Track outstanding orders, resend customer update emails, and print packing slips from a single interface. Learn More → → Order Status Page Allow your customers to track the status of their orders, from shipped to delivered. Learn More → → Flexible Product Variants Use a unified inventory management interface with unlimited SKUs, multi-dimensional product variants (such as size and color), and sale prices. Add images to each product variant so customers can see what different options look like. Learn More → → Store Manager Permissions Designate store managers who have control over inventory and orders, but not the rest of your site. Learn More → → Custom Forms for Products Set up custom checkout forms for gift messages, special delivery instructions, or comments to optimize the checkout experience for your business. Learn More → → Mobile-Optimized Checkout Squarespace’s single page checkout is optimized to look great on all devices, making it easy for your customers to buy wherever they are. Learn More → → Express Checkout Mode Customers can bypass the shopping cart and jump straight to checkout, a great way for single-product stores to streamline checkout. Learn More → → Checkout on Your Domain Direct customers to a secure checkout on your domain for a consistent shopping experience and stronger sense of security. Learn More → → Customer Accounts Customers can create accounts and sign in for a faster checkout. With this feature, you can increase sales from repeat buyers and build ongoing relationships with your customers. Learn More → → Customers Understand your customer base with per-customer insights such as total spend, average order value, last purchase, and more. Easily sort these to identify your best customers or ones that haven’t purchased in a while. Learn More → → Point of Sale Sell in person with Point of Sale in the Squarespace iOS app and Android app. Connect a Square account and pair a reader to accept payments and keep your inventory, customers, and sales analytics in sync with your online store. Point of Sale is only available in the US. Learn More → → Invoicing Invoice clients and get paid for your services. Track invoice status, project milestones, client information, and more all in one place. Learn More → → Memberships Create members-only pages on your site with a Member Areas subscription. Your site visitors can create accounts to gain exclusive access to your gated content. With Member Areas, you can monetize your content, enhance your brand, and grow your audience. Learn More → → Digital Gift Cards Customers can easily share your products with their family and friends. Customers can redeem digital gift cards online. Learn More → → Sell on Instagram and Facebook Sync your product catalog with Facebook and Instagram to tag products, add a shop to your profile, or advertise. Learn More → → Donations Accept donations via the Donations Block. Edit or add suggested contribution amounts, and visitors can select from the suggested amounts or donate any amount. Donations are managed on a separate page from regular orders and purchases in your site manager. Learn More → → Product Reviews Display product reviews on your product listing pages for physical, digital, and service products. Product reviews can give shoppers confidence and can increase your sales. You can also import product reviews from Etsy. Learn More → → Multiple Payment Methods Accept credit cards, debit cards, and Apple Pay as payment methods at checkout through Stripe, PayPal, and Sq"
