["https://squarespace.com/privacy"]
title = "Privacy Policy – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = 'Privacy PolicyEffective Date: January 31, 2025Squarespace (“Squarespace,” “we,” “us” or “our”) respects your privacy. When it comes to your personal information, we believe in transparency. That’s why we’ve set out here what personal information we collect, what we do with it and your choices and rights.By using or accessing any of our sites, templates, products, applications, tools, services and features (collectively, the "Services"), you confirm you have agreed to the Terms of Service and have read and understood this Privacy Policy and our Cookie Policy. The Squarespace entity that controls your information depends on where you are located. See Section 12 below.You can find out about your rights and choices in Section 6 below. We’ve also included at the end of this Privacy Policy some region-specific supplemental information if you are located in: (i) California; or (ii) a U.S. state (other than California) with an applicable data privacy law.For clarity, we use different defined terms in this Privacy Policy to refer to the different parties who interact with our Services:A “User” is someone who visits or uses one of our sites, such as www.squarespace.com, www.acuityscheduling.com, www.unfold.com or www.biosites.com or mobile applications.A “Customer” is one of our Users who has an account with us. Customers may use our Services to register domain names, create websites (including scheduling pages) and other content, and otherwise manage and market their online businesses. An “End User” is someone who visits, purchases from, makes a booking with or otherwise uses one of our Customer’s sites that was created using, and is hosted on, our Services.We also use different terms in this Privacy Policy to differentiate between our roles under global data privacy laws with respect to the personal information we process:“Squarespace Controlled Information” is personal information for which Squarespace acts as the “data controller” (or similar term under applicable law) and determines the purposes and means of processing. This includes information about our Users and Customers. We also act as an independent data controller for personal information relating to End Users which we automatically receive (including via cookies or similar tracking technology) when an End User visits a site hosted on our Services (such as the End User’s IP address) when we process it for our own purposes, including to foster the security and integrity of our Services. “Customer Controlled Information” is personal information for which a Customer acts as the “data controller” (or similar term under applicable law) and determines the purposes and means of processing. This includes any personal information included in the content uploaded by a Customer to our Services for display on their site, a Customer’s domain registration contact information and all information about a Customer’s End Users (including information provided by an End User to a Customer via a webform on the Customer’s site as well as information automatically received (including via cookies or similar tracking technology) when an End User visits the Customer’s site). We explain below how we collect and use Squarespace Controlled Information and your rights. If you are an End User of one of our Customers’ sites: (a) read below to learn about how we collect and use your Site Usage Information (as described in Section 2 below); and (b) you should read that Customer’s site’s privacy policy to find out more about how they use and otherwise process Customer Controlled Information about you. Table of Contents:How does this Privacy Policy apply?Information we collectHow we collect your informationHow we use your informationWhen we disclose your informationYour rights and choicesHow we protect your informationHow we retain your informationData transfersData Privacy FrameworksUpdates to this Privacy PolicyWho is Squarespace?How to contact usAppendix I. California Supplemental InformationAppendix II. Other US States Supplemental Information 1. How does this Privacy Policy apply?This Privacy Policy describes what we do with Squarespace Controlled Information, such as Customer account information, information about how Users use and interact with our Services, information Users submit to our customer support, and, when we use it for our own purposes, including to foster the security and integrity of our Services, End User information which is automatically collected when an End User visits a Customer’s site hosted on our Services. We have separate privacy policies that apply in relation to our processing of personal information relating to our staff and applicants for jobs at a Squarespace group company.We use cookies and similar technologies. Our Cookie Policy describes what we do in that regard.This Privacy Policy does not apply to Customer Controlled Information as described above. For Customer Controlled Information, Squarespace acts as a data processor, service provider or similar term under applicable law. This means we process a Customer’s Customer Controlled Information on behalf of, and pursuant to, the instructions of that particular Customer. We also use and disclose Customer Controlled Information:to enforce our Terms of Service and other legal terms and policies; to comply with applicable legal requirements, such as tax and other government regulations and industry standards, contracts or law enforcement requests; andin the case of domain registration contact information, to comply with Internet Corporation for Assigned Names and Numbers (“ICANN”), registry, ccTLD or registrar rules, regulations and policies. Our Customers are responsible for ensuring that their collection and processing of Customer Controlled Information complies with applicable law. If you are a Customer looking for contractual provisions about how Squarespace will treat and secure your Customer Controlled Information, please see our Data Processing Addendum.Back to top 2. Information we collectWe collect various information regarding you or your device. This includes the following:Account Information: Customer Account Details: Information you provide to create an account, specifically email address, password, first name and last name.Payments Services Account Information: If you use the Payments Services (as defined in the Squarespace Payments Terms), additional information you provide to set up and manage Payments Services and integrate them with the Processing Services (as defined in the Squarespace Payments Terms), including information about you and your business, such as bank account details, name, address, phone number, date of birth, government number (such as a social security number, passport number or driver’s license number), tax identifier (EIN) and nationality.Payments Services Identity Verification Information: If you use the Payments Services, you may be required to provide us with additional information to verify your identity, including a photograph of you captured by you during the verification process and a copy of an official government document which includes a different photograph of you. When you’re required to provide this additional information, our vendors may create a biometric scan of your facial geometry based on these two photographs in order to compare them and verify that you are the same individual whose photograph is on your government document. However, Squarespace does not create, store or otherwise have access to any such biometric data. Payments Services Identity Verification Information also includes details that are listed on such official government documents.Optional 2FA Account Information: You may optionally provide us with additional information, such as your phone number, if you wish to enable two factor authentication (2FA) on your customer account. Account History Information: Information about your account’s use of the Services, including your trials, subscriptions, discount code usage and related details. If you use the Payments Services or other financial products, this would also include information about your account’s use of the Payments Services or other financial products. Payment Information: Information you provide if you sign up for Services you have to pay for (e.g., a product subscription). For most paid Services, this will include your billing address as well as a portion of your payment information which is provided to us from our payment processor (such as the last four digits, the country of issuance and the expiration date of the payment card).Marketing Preferences: Your marketing preferences and details, including if you’ve opted out of all or a portion of our direct marketing messages. Communication Information: The emails and other communications that you send us or otherwise contribute, such as customer support inquiries or posts to our customer message boards or forums. Please be aware that information on public parts of our Services is available to others.Site Usage Information: Technical browsing or other information from your use of the Services or, where you are an End User, from your visits to Customers’ sites. This includes IP addresses, preferences, web pages you visited prior to coming to our or our Customers’ sites, information about your browser, network or device (such as browser type and version, operating system, internet service provider, preference settings, unique device IDs and language and other regional settings) and information about how you interact with the Services and, if you are an End User, with our Customers’ sites (such as timestamps, clicks, scrolling, browsing times, searches, transactions, referral pages, load times, and problems you may encounter, such as loading errors). If you’re using one of our mobile applications, Site Usage Information could also include your precise location information if your mobile device settings authorize us to collect this information. Contact Information: In addition to Customer contact information, we may also collect contact information for others, including people who work for our vendors or partners or other individuals that may include Users and Customers.Enterprise Sales Information: We collect information about companies and their personnel who are perceived to be potential customers for our enterprise services. Such information may include names, email addresses, job titles and phone numbers. If we discuss our enterprise services with such potential enterprise customers, this information may also include recordings of those discussions. Survey and Research Information: Information you share with us in connection with surveys or research.Promotion Information: Information you share with us in connection with contests, sweepstakes or other promotions. Back to top 3. How we collect your informationWe obtain information about you from various sources. We do this in three main ways:You provide some of it directly (such as by registering for an account).We record some of it automatically when you use our Services or, where you are an End User, from your visits to Customers’ sites (including with technologies like cookies).We receive some of it from third parties (like when you register for an account using a third party service like Apple, Facebook or Google, when you purchase our products from an authorized reseller, when you make payments to us using our payment processor or via a mobile app store or when we receive information about potential enterprise sales leads).We’ve described this in more detail below.a. Information you provideWhen you use our Services, we collect information from you in a number of ways. For instance, we ask you to provide your Customer Account Details to create and manage your account. We also maintain your Marketing Preferences and your Communication Information that you provide to us. You might also provide us with information in other ways, including by responding to surveys, participating in user research or entering a contest, sweepstakes or other promotion.Sometimes we require you to provide us with information for contractual or legal reasons. For example: we may ask you to provide a mailing address and/or select your jurisdiction when you sign up for our paid Services (e.g., purchase a subscription) to determine if, and how much, tax we need to collect from you; or if you use the Payments Services through the Services, in accordance with the Squarespace Payments Terms, in order to provide the Payments Services and to comply with our contractual and legal obligations, we collect additional information related to the Payments Services and Processing Services, including Payments Services Account Information and possibly Payments Services Identity Verification Information.We’ll normally let you know when information is required, and the consequences of failing to provide it. If you do not provide requested information, you may not be able to use our Services if that information is necessary to provide you with the service or if we are legally required to collect it.b. Information obtained from your use of our ServicesWhen you use our Services, we collect Site Usage Information and Account History Information about your activity on and interaction with the Services. If permission has been granted through your device settings, Site Usage Information for our mobile apps may include your precise location information.If you are an End User of a Customer’s site, we also get Site Usage Information about your interactions with their sites. Some of this information is collected automatically using cookies and similar technologies when you use our Services or, if you are an End User, when you visit a Customer’s site. We let our Customers control what cookies and similar technologies are used through their sites (except those we need to use to properly provide the Services, such as for functionality, performance or security related reasons). You can read more about our use of cookies in our Cookie Policy. Some of this information is similarly collected automatically through your browser or from your device.c. Information obtained from other sourcesIf you use a third party service (such as Apple, Facebook or Google) to register for an account, the third party service may provide us with your Customer Account Details on your behalf, but we don’t collect or store passwords you use to access third party services. We do not control what information a third party service provides to us. The third party service you use may give you options on what the service discloses to us if you link your third party service account with the Services. Make sure you are comfortable with what these third party services share by reviewing their privacy policies and, if necessary, modifying your privacy settings directly on the third party service.If you sign up for our paid Services via a third party service acting as an authorized reseller of our products, the reseller busine'
