full_description = '''A website makes it realA website makes it realCreate Your WebsiteCreate Your Website Get started Start a Free Trial Get your free website trial today.No credit card required.Get your free website trial today.No credit card required.FeaturedMeet your new AI design partner→Find a domain name for your websiteSearchCheck domain name availability using our AI-powered domain search tool to get started.Learn more about Domains→Create a website→Design a website using our industry-leading website templates, designer fonts, and color palettes.Sell your products and offerings→Create an online store, book appointments, or sell your services or content—all on a single platform built just for you.Market your business→Promote your business and grow your customer base with email marketing, social media, and SEO tools.Website templates for every purposeStart with a flexible designer template or build your own, then customize to fit your style and professional needs using our drag-and-drop website builder. Use Squarespace AI to generate a personalized website template that works for you.Online Store→Local Business→Portfolio→Restaurant→Services→Personal→Courses→Memberships→Explore all→Start with a designer website template and customize it to fit your personal style.Browse templates→Create an online store website designed to sell anythingEverything you need to run an ecommerce business, from payments and checkout to shipping and fulfillment.Explore selling→Tools to help you sell your time and expertiseSchedule classes and appointmentsTake the hassle out of online scheduling with tools to keep your clients happy and your calendar booked. Promote your availability, accept payments, and more.Explore Scheduling→Create an online courseTurn your expertise into a passive income stream. Offer exclusive access to member-only content, create an online course, and paywall your content.Explore Content & Memberships→Get paid with invoicesThe simplest way to collect payments so you can focus on delivering projects and growing your business.Explore Invoicing→Promote your business with built-in marketing toolsGrow your audienceBuilt-in SEO tools and social media integrations to maximize your reach and connect with your community.Engage with customersEmail campaigns that pull in your site’s colors, products, and blog posts so your communications feel effortlessly on-brand.Optimize with analyticsInsights into who is visiting your site, how your online store is performing, and more.SEO tools and social media integrations to maximize your reach, plus branded email campaigns for effortless communication.Explore marketing toolsExplore marketing toolsCreate a website to showcase your businessBeautyFitnessPhotographyLearn how to get started with SquarespaceHow to create a websiteChoose a template and start a free trial.Get a free custom domain name for the first year of an annual website plan.Use our website builder to add your own text and photos.Customize the site to fit your brand with hundreds of fonts, colors, and stock photos.Don’t have a logo? Make one for free with our online tool.Publish your site and promote it using social media and email marketing tools.How to sell onlineFind an ecommerce template and start your free trial.Register or transfer your business’s domain name.Set up your online store by adding products and connecting a payment processor.If you sell services, set up appointments through Squarespace scheduling.Customize online store categories and content with the website builder.Grow your online store with email marketing and SEO tools.How to start a blogChoose a website template to showcase your blog.Add a blog page and customize the layout and design with our website builder.Create, publish, and manage content with blog and image editing tools.Market your blog using Squarespace’s suite of integrated marketing tools.How to create a portfolio websiteSelect a website template to start building your online portfolio.Create a portfolio page or section and personalize the layout and design to fit your style.Highlight your work with customizable project pages, using flexible sections to showcase each example.Boost your portfolio’s visibility with Squarespace’s integrated marketing tools.{"@context":"http://schema.org","@type":"HowTo","name":"How to create a website","description":"Our website builder makes it easy to customize your site and add the tools you need to grow your business.","step":[{"@type":"HowToStep","text":"Choose a template and start a free trial."},{"@type":"HowToStep","text":"Get a free custom domain name for the first year of an annual website plan."},{"@type":"HowToStep","text":"Use our website builder to add your own text and photos."},{"@type":"HowToStep","text":"Customize the site to fit your brand with hundreds of fonts, colors, and stock photos."},{"@type":"HowToStep","text":"Don’t have a logo? Make one for free with our online tool."},{"@type":"HowToStep","text":"Publish your site and promote it using social media and email marketing tools."}]}{"@context":"http://schema.org","@type":"HowTo","name":"How to sell online","step":[{"@type":"HowToStep","text":"Find an ecommerce template and start your free trial."},{"@type":"HowToStep","text":"Register or transfer your business’s domain name."},{"@type":"HowToStep","text":"Set up your online store by adding products and connecting a payment processor."},{"@type":"HowToStep","text":"If you sell services, set up appointments through Squarespace scheduling."},{"@type":"HowToStep","text":"Customize online store categories and content with the website builder."},{"@type":"HowToStep","text":"Grow your online store with email marketing and SEO tools."}]}{"@context":"http://schema.org","@type":"HowTo","name":"How to start a blog","step":[{"@type":"HowToStep","text":"Choose a website template to showcase your blog."},{"@type":"HowToStep","text":"Add a blog page and customize the layout and design with our website builder."},{"@type":"HowToStep","text":"Create, publish, and manage content with blog and image editing tools."},{"@type":"HowToStep","text":"Market your blog using Squarespace’s suite of integrated marketing tools."}]}{"@context":"http://schema.org","@type":"HowTo","name":"How to create a portfolio website","step":[{"@type":"HowToStep","text":"Select a website template to start building your online portfolio."},{"@type":"HowToStep","text":"Create a portfolio page or section and personalize the layout and design to fit your style."},{"@type":"HowToStep","text":"Highlight your work with customizable project pages, using flexible sections to showcase each example."},{"@type":"HowToStep","text":"Boost your portfolio’s visibility with Squarespace’s integrated marketing tools."}]}Made with SquarespaceGet inspired by a collection of websites made by Squarespace users just like you.Visit showcase→Frequently asked questionsWhy should I create a website?A website is the first step toward growing an online presence for your business or passion project, whether you’re looking to sell online or create a portfolio. With Squarespace, you can get started with a best-in-class website template for nearly any use case and customize it to fit your brand. Our all-in-one platform also makes it easy to add a blog, an online store, or appointment scheduling to your website and leverage marketing tools to reach your audience.What does a Squarespace subscription include?Squarespace is an all-in-one content management system, or CMS. With a single subscription, you can make a website, host your content, register your own custom domain name, sell products, track your site’s analytics, and much more.Start with any template to create pages and organize your site, then customize it to match your own style with our industry-leading website builder.For a full list of features, visit our feature index and explore the Help Center for guides on Squarespace's many features.Is Squarespace right for me?Everyone has unique needs for their website, so there’s one way to know if Squarespace is right for you: try it!We offer a free 14-day website trial so you can explore our platform, begin building a website, and decide if you're ready to subscribe to Squarespace. If you're still not sure or if you need more time, you can extend it or start again later. Learn more about Squarespace website trials or get started on your own website here.How do I start building my website?Squarespace makes starting a beautifully-designed website easy. Choose from our library of website templates to find a starting point, then secure a custom domain that fits your brand or idea. As you build out your website pages, customize your template with colors, fonts, images, and content. When you’re ready, publish your site and start spreading the word.Do I need to know how to code to create a Squarespace website?Squarespace is designed so users don’t need any coding experience to build a beautiful website. Our website platform offers a simple drag-and-drop interface, customizable templates, and built-in features that allow you to design and manage your website without writing any code.However, users with coding knowledge have the options to add custom CSS, HTML, and JavaScript for more advanced customization.Does Squarespace offer resources to help me build my website?Squarespace offers a variety of supporting resources to help you build and manage your website:Watch a few short Help videos.Sign up for a live expert-led webinar.Explore at your own pace using the guides in this Help Center.Learn how to build your online presence with Help Center.Can someone build my website for me?Yes. While Squarespace is a great website builder for a DIY approach, many web designers specialize in building Squarespace sites for clients. To hire a Squarespace Expert, visit Squarespace Marketplace.Can I choose a custom domain for my website?Finding a domain with Squarespace is simple and straightforward with our Domain Name Search tool. When choosing an annual website plan, you can register your first domain through Squarespace for free for its first year. You can also transfer your domain to Squarespace if you already registered a domain with another provider.Can I create an online store with Squarespace and start selling online?Yes. Squarespace offers easy-to-customize templates to get your ecommerce website off the ground. Set up and customize your online store with rich product merchandising tools, designed to showcase your products at their absolute best. Once you connect a payment processor to enable online transactions, you’re ready to take orders with shipping tools and built-in inventory management for your products. To help you promote your business, Squarespace also offers email marketing tools and promotional discounts to keep your customers coming back for more.Does Squarespace offer any AI website building tools to help me create my website?Yes, Squarespace has integrated AI tools to help you to build and publish your website. From generating product descriptions and website copy to creating a brand identity, our AI-powered website building features are designed to simplify tasks, enhance user experience, and provide personalized suggestions to create a professional-looking website.Where are Squarespace’s data servers located?Squarespace is a global company that respects the laws of the jurisdictions it operates within. With data servers located in the US, Squarespace treats personal data from around the world in a secure and privacy-friendly manner and complies with the Data Privacy Frameworks (pursuant to the EU-U.S. Data Privacy Framework, the Swiss-U.S. Data Privacy Framework and the UK Extension to the EU-U.S. Data Privacy Frameworks) to provide a legal basis for transfers of personal data to the US from, as applicable, the EEA, Switzerland and the UK. Squarespace, has certified its compliance to the Data Privacy Frameworks. You can find our certification here and you can learn more about the Data Privacy Frameworks (as determined based upon the country from which the personal data was received) and DPF Principles by visiting https://www.dataprivacyframework.gov.For more information about website data privacy and Squarespace’s cookie banner offerings, see here.{"@context":"http://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why should I create a website?","acceptedAnswer":{"@type":"Answer","text":"A website is the first step toward growing an online presence for your business or passion project, whether you’re looking to sell online or create a portfolio. With Squarespace, you can get started with a best-in-class website template for nearly any use case and customize it to fit your brand. Our all-in-one platform also makes it easy to add a blog, an online store, or appointment scheduling to your website and leverage marketing tools to reach your audience."}},{"@type":"Question","name":"What does a Squarespace subscription include?","acceptedAnswer":{"@type":"Answer","text":"Squarespace is an all-in-one content management system, or CMS. With a single subscription, you can make a website, host your content, register your own custom domain name, sell products, track your site’s analytics, and much more. Start with any template to create pages and organize your site, then customize it to match your own style with our industry-leading website builder. For a full list of features, visit our feature index and explore the Help Center for guides on Squarespace’s many features."}},{"@type":"Question","name":"Is Squarespace right for me?","acceptedAnswer":{"@type":"Answer","text":"Everyone has unique needs for their website, so there’s one way to know if Squarespace is right for you: try it! We offer a free 14-day website trial so you can explore our platform, begin building a website, and decide if you're ready to subscribe to Squarespace. If you're still not sure or if you need more time, you can extend it or start again later. Learn more about Squarespace website trials or get started on your own website here."}},{"@type":"Question","name":"How do I start building my website?","acceptedAnswer":{"@type":"Answer","text":"Squarespace makes starting a beautifully-designed website easy. Choose from our library of website templates to find a starting point, then secure a custom domain that fits your brand or idea. As you build out your website pages, customize your template with colors, fonts, images, and content. When you’re ready, publish your site and start spreading the word."}},{"@type":"Question","name":"Do I need to know how to code to create a Squarespace website?","acceptedAnswer":{"@type":"Answer","text":"Squarespace is designed so users don’t need any coding experience to build a beautiful website. Our website platform offers a simple drag-and-drop interface, customizable templates, and built-in features that allow you to design and manage your website without writing any code. However, users with coding kno'''
