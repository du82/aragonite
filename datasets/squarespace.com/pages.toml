nd Michael 03. Rush & Danit How to make a wedding website Get started → → Choose a wedding website template. Select your domain name from our search tool for custom URLs. Add content about your wedding – the date, location, travel information and a registry are a great start. Upload photos to your gallery. Set up your RSVP form to handle guest information. Publish and share your wedding website with your guests before the big day. { "@context": "http://schema.org", "@type": "HowTo", "name": "How to build a wedding website", "description": "Squarespace’s all-in-one platform gives you everything you need to create a stunning website for your wedding.", "image": "https://media-www.sqspcdn.com/images/pages/vertical/weddings/hero/hero-desktop-100w.jpg", "step": [ { "@type": "HowToStep", "text": "Choose a wedding website template.", "url": "" } , { "@type": "HowToStep", "text": "Select your domain name from our search tool for custom URLs.", "url": "" } , { "@type": "HowToStep", "text": "Add content about your wedding – the date, location, travel information and a registry are a great start.", "url": "" } , { "@type": "HowToStep", "text": "Upload photos to your gallery.", "url": "" } , { "@type": "HowToStep", "text": "Set up your RSVP form to handle guest information.", "url": "" } , { "@type": "HowToStep", "text": "Publish and share your wedding website with your guests before the big day.", "url": "" } ] } Squarespace is the all‑in‑one platform to build a beautiful website. Start a Free Trial'
