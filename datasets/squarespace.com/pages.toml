description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = 'Making It Know Back 5 Things to Know About Website Footers By Squarespace Download a free workbook to help you design your site with confidence. The email you entered is invalid. Thank you for subscribing. By entering your email, you indicate that you have read and understood our Privacy Policy and agree to receive marketing from Squarespace. A website’s footer is the section at the very bottom of a webpage that includes essential information for users. Footers typically stay consistent throughout the entirety of a website, providing a stable place to land at the end of a scroll. Think of them like the Best Supporting Actor to your site: You may not notice them as the star but you can’t operate without them. They include almost anything users might be looking for, such as contact information and links to important pages.You might not think people scroll all the way to the bottom of a page to engage with the footer, but studies show otherwise, with Chartbeat and Nielsen Norman Group revealing that users who scroll down a page spend more time at the bottom of a page than the top.So, it’s clear that footers are hardly footnotes, but how can you make the most of yours? Here’s what you need to know. Try Squarespace 1. Footers point to important detailsWebsite navigation bars and menus might be the starting point for a user, but footers are where users can reliably know they’ll find whatever they’re looking for. Not all footers are the same, but there’s a standard set of details to expect down there, such as:Contact informationCustomer chatLinks to About, FAQ, and Help pages Social profile links It’s also typical to find details on cookie policies, client logos, testimonials, and newsletter sign ups or similar calls to action. You can—and should—customize your footer to your users. For example, even though social icons are a common part of footers, don’t include yours if you have yet to build up your presence on a platform. Eager to draw your user to a specific case study or portfolio? Link that in the footer. 2. Footers are engagement-oriented Footers often include direct contact information for users to get in touch for whatever they need. They also include information clients or customers might be looking for, like:Customer serviceOrder updatesNewsletter accessProject outreachShipping and returns policies If you’re hoping to get in touch with a business or person from a website, chances are a way to get in touch will be linked in the footer. You can include a direct email, phone number, or address if you have one. An address can help with local search engine optimization, too. 3. Footers expand your brand off the siteYour footer design can help reinforce key brand elements like logos, brand colors, and messaging. The consistency is also helpful in that users will know what to expect when they scroll down there. But footers are also a way to expand on your brand by including:Social logos and links out to those profilesA newsletter sign-up fieldLinks to media coverage or awards you’ve wonClient logosClient or customer testimonials Search engines also crawl what’s in a footer, providing ripe opportunities for search results visibility. Including details like clear links mapping your site pages and other internal links help optimize your site for SEO. 4. Footers contain legal information Footers, especially for larger businesses, often include terms of service, privacy policies, copyright information, and disclaimers, which protect the site owner in multiple ways. This kind of legal information provides not just a sense of trust and transparency but a view into the brand’s practices and policies. These pieces of content can legitimize your site and clarify what users can expect around data protection, compliance, and what permissions users have based on copyright law. Squarespace has sample messages and guidance for how best to include policies on your site and in your footer. 5. Not all footers are the sameMost footers stay consistent across an entire website, primarily for ease. But there are situations when you might want to customize them. Different pages on your site likely serve different purposes, and altering the footer to a specific page’s audience can help guide a varied visitor set to the right place. For example, you might want a different footer for your membership website than for the public parts of your website.This also holds true when it comes to personalizing landing pages for different users, down to where they’re coming to your website from. These customizations can prove to be worthwhile marketing tools. For example, you might send someone from a social media post to a landing page for a limited-time holiday shop. The footer on this page might direct visitors to a holiday-specific shipping page or FAQs, instead of your usual footer links. Start Your Website Posted on 11 Jul 2024 website design website templates web design Share: Related Articles Know How to Hire a Website Designer How to Hire a Website Designer By Squarespace Staff 22 Mar 2021 Know 10 Essential Principles of Website Design 10 Essential Principles of Website Design By Amanda Shih-Goel 06 Jul 2023 Subscribe Subscribe to receive the latest MAKING IT blog posts and updates, promotions and partnerships from Squarespace. The email you entered is invalid. Thank you for subscribing. By providing your email, you indicate you have read and understood our Privacy Policy. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://squarespace.com/blog/website-footer" }, "headline": "Website Footers: Best Practices and Design Examples", "image": { "@type": "ImageObject", "url": "https://static1.squarespace.com/static/5134cbefe4b0c6fb04df8065/5dcb2d0669b294381f8ffb16/668fe11616da7d1c43f0bcde/1720705307087/D032_H_S_Batch1_4_HowToUseMetricsToBuildABrandStrategy-Primary_DesktopHeader.jpg" }, "datePublished": "2024-07-11T09:43:13-05:00", "dateModified": "2024-09-13T09:39:58-05:00", "author": { "@type": "Person", "name": "Squarespace" }, "publisher": { "@type": "Organization", "name": "Squarespace", "logo": { "@type": "ImageObject", "url": "https://media-www.sqspcdn.com/logos/favicon-dark-mode.ico" } }, "description": "The website footer is the section at the bottom of a web page, usually containing contact information and other site links. It’s a valuable part of any web design." }'
