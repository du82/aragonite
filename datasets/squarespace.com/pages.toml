full_description = '''InvoicingThe simplest way to get paid for your workGet startedInvoicingGet startedExploreInvoicesPaymentsProjectsProposalsExploreInvoicesPaymentsProjectsProposalsStart with a professional website template designed to attract new clientsBuild your own with AIStart with this templateView more templatesSend professional, on-brand invoicesThe easiest way to create an invoice for your clients—branded, professional, and managed all on Squarespace.Professional and secureLegitimize your business and build credibility for your work with invoices your clients can trust to pay.Effortlessly on-brand designWith Squarespace, invoices easily match your brand and website styles for a consistent look for all your client touchpoints.Get paid for your workAn easier way to collect and manage payments from clients so you can focus on growing your business.ACH direct depositAccept payments from US bank accounts with a low, 1% transaction fee.Coming SoonFlexible payment optionsAccept debit and credit cards, ACH direct deposit, and other popular payment methods with Squarespace Payments.Centralized payment dashboardTrack client payments and view payouts in one central place.Manage projects and clients in one placeStreamline your project workflows and manage your services business on one platform. No need to duplicate work, pay for multiple tools, or learn different programs.Simplified workflow managementManage client information, review project notes and activities, and create and track invoices in one place.Custom intake formsCapture leads through an intake form. Allow clients to upload documents, images, presentations, audio, videos, and other file types.Business toolkitAll the tools to build a website, market your services, and get hired and paid for your work.Client managementKeep track of leads and clients from your account. Form responses will show up within Squarespace, making it easy to create a project and respond quickly.Client documents to get you hiredTurn