es to your customers, all in one place within your Squarespace account. This allows for consistent branding from your website to your documents, including client intake forms, proposals, and contracts."}},{"@type":"Question","name":"What payment methods can I accept with Squarespace Payments?","acceptedAnswer":{"@type":"Answer","text":"With Squarespace Payments, you can offer a seamless checkout experience by accepting debit and credit cards from Visa, Mastercard, American Express, Discover, Apple Pay, Afterpay, Klarna, and Link by Stripe. Payment methods and availability are subject to change, but learn more on our Help Center."}}]}24/7 SupportHelp CenterGet help from our award-winning Customer Support team.→WebinarsFree online sessions to learn the basics and refine your skills.→Start your free website trial todayNo credit card required. Cancel anytime.Get startedGet started'''
