full_description = '''Terms of Service Effective Date: January 31, 2025This page explains our terms of service, which contain important information about your legal rights. When you use Squarespace, you’re agreeing to these terms. To help make them easier to understand, we’ve also included annotations in these gray boxes. The annotations aren't part of the official terms and have no legal effect, but are intended to help you follow the text.Hello and welcome to Squarespace’s Terms of Service!These Terms of Service ("Terms") cover your use of and access to the sites, templates, products, applications, tools, services and features (collectively, the "Services") provided by Squarespace (as defined below), including without limitation during free trials, on the websites and associated domains of www.squarespace.com, www.acuityscheduling.com, www.unfold.com and www.biosites.com and on Squarespace web, mobile and other applications.Please read this Agreement (as defined below) carefully! IT INCLUDES IMPORTANT INFORMATION ABOUT YOUR LEGAL RIGHTS, AND COVERS AREAS SUCH AS AUTOMATIC SUBSCRIPTION RENEWALS, WARRANTY DISCLAIMERS, LIMITATIONS OF LIABILITY, THE RESOLUTION OF DISPUTES BY ARBITRATION AND A CLASS ACTION WAIVER. Please note if you are an EU Consumer (as defined below), some of these provisions may not apply to you and you may be entitled to specific rights under the mandatory laws of the country in which you reside.By using or accessing the Services, you're agreeing to these Terms, our Product Specific Terms, our Acceptable Use Policy and our Data Processing Addendum (collectively, this “Agreement”). If you're using the Services for or on behalf of an organization, you're agreeing to this Agreement on behalf of that organization, and you represent and warrant that you can do so. References to “you,” “your” and similar terms are construed accordingly in this Agreement. If you don’t agree to all the terms in this Agreement, you may not use or access the Services.If you are a resident of or have your principal place of business in the United States of America including any of its territories or possessions (the “US”), you are agreeing to this Agreement with Squarespace, Inc. and are a “US User.” Otherwise, you are agreeing to this Agreement with Squarespace Ireland Limited (“Squarespace Ireland”) and are a “Non-US User.” References to “Squarespace,” “us,” “we” and “our” mean Squarespace, Inc. if you are a US User or Squarespace Ireland if you are a Non-US User. If your place of residence or principal place of business changes, the Squarespace entity you contract with will be determined by your new residence or principal place of business, as specified above, from the date it changes. In addition, certain services may be provided to you by a Squarespace group company other than Squarespace, Inc. or Squarespace Ireland and may be subject to additional terms directly between you and such other Squarespace group company; such additional terms will specify the name of the Squarespace group company and you will contract with such Squarespace group company solely with respect to such terms and such service.We’ve tried to make this Agreement fair and straightforward, but feel free to contact us if you have any questions or suggestions. 1. Creating AccountsMake sure your account information is accurate and that you keep your accounts safe. You’re responsible for your accounts and any activity on them. Also, you need to be at least 16 years old to use Squarespace.1.1. Signing Up. To use many of the Services, you must first create an account (“Account”). Different parts of the Services may require different Accounts. You agree to provide us with accurate, complete and at all times up to date information for your Accounts. We may need to use this information to contact you.1.2. Staying Safe. Please safeguard your Accounts and make sure others don't have access to your Accounts or passwords and other authentication credentials (collectively, "passwords"). You're solely responsible for any activity on your Accounts and for maintaining the confidentiality and security of your passwords. We’re not liable for any acts or omissions by you or anyone else in connection with your Accounts. You must immediately notify us if you know or have any reason to suspect that your Accounts or passwords have been stolen, misappropriated or otherwise compromised or in case of any actual or suspected unauthorized use of your Accounts.1.3. Sixteen And Older. The Services are not intended for and may not be used by children under the age of 16. By using the Services, you represent that you're at least 16. If you’re under the age of 18, depending on where you live, you may need to have your parent or guardian’s consent to this Agreement and they may need to enter into this Agreement on your behalf. 2. Your ContentWhen you upload content to Squarespace, you still own it. You do, however, give us permission to use it in ways necessary to provide, improve, promote and protect our services. For example, when you upload a photo, you give us the right to save it and display it on your site or story at your direction. We also may promote or feature your site or story, but you can opt out if you don’t want us to do that.2.1. Your User Content Stays Yours. Users of the Services (whether you, your End Users (as defined below) or others) may provide us with data and content, including without limitation text, photos, images, music, audio, videos, fonts, logos, stickers, code and any other materials (“User Content"). Your User Content stays yours, except for the limited rights that enable us to provide, improve, promote and protect the Services as described in this Agreement. User Content includes without limitation your End User Data and any content you post to Your Sites or include in Your Videos. “End User Data” means data submitted to the Services by your End Users via Your Sites, and includes data submitted via form blocks, client booking intake forms and similar features within the Services. End User Data does not include Independently Controlled Information (as defined below). "Your Sites" means the sites (including scheduling pages) you create or publish using the Services. “Your Videos” means the videos or similar materials you create using the Services and includes without limitation your Unfold stories.2.2. Your License To Us. When you provide User Content via the Services, you grant Squarespace (including our third party hosting providers acting on our behalf) a non-exclusive, worldwide, perpetual, irrevocable, royalty-free, sublicensable, transferable right and license to use, host, store, reproduce, modify, create derivative works of (such as those resulting from translations, adaptations or other changes we make so that User Content works better with the Services), communicate, publish, publicly display, publicly perform and distribute User Content for the limited purposes of allowing us to provide, improve, promote and protect the Services. This Section does not affect any rights you may have under applicable data protection laws.2.3. Featuring Your Site. We may choose to feature Your Sites (but not your scheduling pages) or names, trademarks, service marks or logos included on Your Sites. You grant us a perpetual, worldwide, royalty-free, non-exclusive right and license to use any version of Your Sites, or any portion of Your Sites, including without limitation names, trademarks, service marks or logos on Your Sites, for the limited purpose of Squarespace marketing and promotional activities. For example, we may feature Your Sites on our Templates page, on the Customers sections of our sites or on our social media accounts. You waive any claims against us relating to any moral rights, artists’ rights or any other similar rights worldwide that you may have in or to Your Sites or names, trademarks, service marks or logos on Your Sites and any right of inspection or approval of any such