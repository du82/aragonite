title = "Create a Fundraising Website: Accept Donations Online – Squarespace"
description = "A collection of inspirational websites made by real Squarespace users.Stories and solutions for the modern entrepreneur.In-depth guides and videos about the platform, our services, and how to get started.An online community for Squarespace users and professionals to discuss best practices and seek advice.Free, online sessions where you’ll learn the basics and refine your Squarespace skills.Earn rewards for building custom websites your clients can easily manage with Circle."
full_description = '''DonationsA fundraising platform worthy of your missionGet startedDonationsGet startedExploreTemplatesFundraising WebsitesDonationsDonor OutreachExploreTemplatesFundraising WebsitesDonationsDonor OutreachStart with a professional website template to collect donationsBuild your own with AIStart with this templateView more templatesA fundraising website to support any causeAccept donations with a professional website that showcases your cause and brings your vision to life—no coding or design experience needed.Customizable website templatesEasily create a credible website using pre-built designs and customize using drag-and-drop editing.Flexible and secure contributionsAccept donor contributions with credit and debit cards, ACH direct debit, and popular options like Apple Pay.Donation pagesQuickly set up giving pages and start accepting online donations right away.All-in-one business toolsManage donors and contributions, set up volunteer events, and send fundraising emails—all in one place.One place to manage donors and fundsStreamline fundraising with user-friendly tools for creating giving pages and managing all of your donors and contributions.Online fundraising toolsSet up a fundraising campaign, accept donations on your website, and send donors targeted emails.Donor managementAccess donor contact information and donation history in a central dashboard.Flexible donation amountsLet donors choose how much they want to give, or set fixed donation amounts.Recurring donationsReach fundraising goals faster by accepting recurring donations or one-time contributions.Built-in tools to amplify donor outreachUnlike other donation platform, Squarespace offers all the powerful marketing tools to build strong relationships and communicate with donors.Branded fundraising emailsSend targeted email communications to donors with Squarespace Email Campaigns and achieve your fundraising goals faster.Custom contact formsGrow your mailing list and gather donor information with forms on your website.Promotional toolsPromote fundraisers across your site with pop-ups and banners, and use SEO tools to reach more donors online.In-depth analyticsGain powerful insights into your audience and fundraising performance with analytics.Access more tools to help you raise fundsSquarespace PaymentsReceive payments and deposits→Bio SitesShare your online world in one link→Email CampaignsCommunicate with your audience→Frequently asked questionsCan I accept donations via Squarespace?Yes, you can accept donations via Squarespace. The platform offers a built-in donations feature that allows you to collect contributions directly through your website. You can add a donation block to any page, customize the donation amounts, and even set up recurring donations. This feature is ideal for non-profits, creators, or anyone looking to raise funds for a cause.How can I add a donation block to my Squarespace website?To add a donation block to your Squarespace website, log in to your account and navigate to the page where you want to add the donation block, or create a new page. Click the “Edit” button to enter the page editor, then hover over the section where you want to add the block and click the "+" icon. Select the "Donation" block from the menu. Customize the block by setting donation amounts, adding descriptions, and choosing a style that matches your website's design.How do I transfer donation payments to my bank account?To transfer donation payments from Squarespace to your bank account, connect a payment processor to your Squarespace account. After setting up your payment processor account with necessary details, donations made on your site are processed through it. Stripe transfers funds to your bank account automatically based on your configured payout schedule, while PayPal allows manual transfers anytime. Monitor transactions through your payment processor's dashboard to manage funds and ensure transfers occur as expected.Can I customize my donation block?Yes, you can customize your donation block on Squarespace. You can set custom donation amounts, add descriptions, and choose from various design options to match your website's style. Additionally, you can customize the button text, add an image or video, and even include a thank you message for donors. These customization options allow you to create a donation block that aligns with your brand and encourages contributions from your visitors. Learn more about customizing donation blocks.Can I issue refunds to my donors? Yes, you can issue refunds to donors on Squarespace through your connected payment processor. To initiate a refund, log in to your payment processor and locate the transaction you wish to refund within the transaction history or dashboard. From there, follow the prompts to initiate the refund process, specifying the refund amount and reason if required. Learn more about refunding donations. {"@context":"http://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can I accept donations via Squarespace?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can accept donations via Squarespace. The platform offers a built-in donations feature that allows you to collect contributions directly through your website. You can add a donation block to any page, customize the donation amounts, and even set up recurring donations. This feature is ideal for non-profits, creators, or anyone looking to raise funds for a cause."}},{"@type":"Question","name":"How can I add a donation block to my Squarespace website?","acceptedAnswer":{"@type":"Answer","text":"To add a donation block to your Squarespace website, log in to your account and navigate to the page where you want to add the donation block, or create a new page. Click the “Edit” button to enter the page editor, then hover over the section where you want to add the block and click the \"+\" icon. Select the \"Donation\" block from the menu. Customize the block by setting donation amounts, adding descriptions, and choosing a style that matches your website's design."}},{"@type":"Question","name":"How do I transfer donation payments to my bank account?","acceptedAnswer":{"@type":"Answer","text":"To transfer donation payments from Squarespace to your bank account, connect a payment processor to your Squarespace account. After setting up your payment processor account with necessary details, donations made on your site are processed through it. Stripe transfers funds to your bank account automatically based on your configured payout schedule, while PayPal allows manual transfers anytime. Monitor transactions through your payment processor's dashboard to manage funds and ensure transfers occur as expected."}},{"@type":"Question","name":"Can I customize my donation block?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can customize your donation block on Squarespace. You can set custom donation amounts, add descriptions, and choose from various design options to match your website's style. Additionally, you can customize the button text, add an image or video, and even include a thank you message for donors. These customization options allow you to create a donation block that aligns with your brand and encourages contributions from your visitors. Learn more about customizing donation blocks."}},{"@type":"Question","name":"Can I issue refunds to my donors?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can issue refunds to donors on Squarespace through your connected payment processor. To initiate a refund, log in to your payment processor and locate the transaction you wish to refund within the transaction history or dashboard. From there, follow the prompts to initiate the refund process, specifying the refund amount and reason if required. Learn more about refunding donations."}}]}24/7 SupportHelp CenterGet help from our award-winning Customer Support team.→WebinarsFree online sessions to learn the basics and refine your skills.→Start your free website trial todayNo credit card required. Cancel anytime.Get startedGet started'''
