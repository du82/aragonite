["https://ssd.eff.org/module/attending-protest"]
title = "Attending a Protest | Surveillance Self-Defense"
description = """
For quick reference, we've created a handy guide designed to be printed, folded, and carried in your pocket (PDF download).

Now, more than ever, citizens must be able to hold those in power accountable and inspire others through the act of protest.

Protecting your electronic devices and digital assets before, during,..."""
full_description = '''< Further Learning Attending a Protest Last Reviewed: November 12, 2024 For quick reference, we've created a handy guide designed to be printed, folded, and carried in your pocket (PDF download). Now, more than ever, citizens must be able to hold those in power accountable and inspire others through the act of protest. Protecting your electronic devices and digital assets before, during, and after a protest is vital to keeping yourself and your information safe, as well as getting your message out. Theft, damage, confiscation, or forced deletion of media can disrupt your ability to publish your experiences. At the same time, those engaging in protest may be subject to search or arrest, or have their movements and associations surveilled. Remember that these tips are general suggestions for better data security and do not constitute legal advice or counseling. If you have specific legal concerns, seek the advice of a licensed attorney. Before the Protest anchor link Enable Strong Encryption on Your Device anchor link Full-disk and file-based are two types of device encryption , which ensures that the files across your entire device cannot be accessed by others. Both are forms of encryption that protects data at rest—not to be confused with “in-transit encryption,” which protects data that is transferred over the internet. Full-disk and file-based encryption can help protect everything from your local database of text messages to the passwords stored in your browser. If your device is confiscated by police, or if it is lost or stolen, device encryption can help protect the data stored on your device. Protest situations can be unpredictable, so losing your phone is a distinct possibility. iOS and most Android devices have device encryption capabilities built into them. These should be protected by a strong password : 8-12 random characters that are easy to remember and type in when you unlock your device. If devices are not protected by a strong password, the encryption may be easier to break using a brute-force attack. iPhone 5s and later and many Android devices have specialized hardware to protect against this type of attack , but bypasses for this protection continue to be developed and so a complex, strong password is still the best practice. To enable or change your passcode: On Android: Open Settings > Security & Privacy > Device Unlock > Screen lock and select the type or length of passcode you'd like to use. On iPhone: Open Settings > Face ID & Passcode > then tap "Turn Passcode On" or "Change Passcode," then tap "Passcode Options" and choose the type or length of passcode you'd like to use. Enabling a passcode on Android (left) and iPhone (right). Encrypting your device will likely not encrypt external storage media such as SD or flash memory cards. You have to encrypt these separately, and may not be able to encrypt them at all. You might want to investigate where files are stored on your device using a file browsing app, or remove external storage media from your device altogether. In addition, many digital cameras lack the ability to encrypt. It is safe to assume that photos and videos taken with digital cameras will be stored unencrypted, unless explicitly stated otherwise. Alongside what’s included in this guide, it’s also important to establish some solid digital security fundamentals: • Use strong passwords (a password manager helps simplify this) and set up two-factor authentication for your online accounts. • Protect yourself on social networks. • Be mindful of what you share in online groups. Remove Fingerprint or Face Unlock anchor link Depending on your phone model, both iOS and Android allow users to unlock (and decrypt ) their devices with their fingerprint or with face recognition. While these settings may seem appealing as convenient ways to enjoy the benefits of device encryption, enabling them means an officer could physically force you to unlock your device with your fingerprint or face. In protest situations in particular—or in any other situation in which you may be more likely to encounter a government demand to search your phone (such as at a border crossing)—we suggest you turn this functionality off. In the United States, using a biometric—like your face scan or fingerprint—to unlock your phone may also compromise legal protections for the contents of your phone afforded to you under the Fifth Amendment privilege against compelled incrimination. Under current law—which is still in flux—using a memorized passcode generally provides a stronger legal footing to push back against a court order of compelled device unlocking/decryption. While EFF continues to fight to strengthen our legal protections against compelling people to decrypt their devices, there is currently less protection against compelled face and fingerprint unlocking than there is against compelled password disclosure. On Android: Directions for disabling biometrics will depend on your device manufacturer. For Pixel devices running Android 14, go into Settings > Security & Privacy > Device Unlock > Fingerprint Unlock and turn "Unlock your phone" off. If you have a phone by a different manufacturer, you may need to search online for specific directions for your model. On iPhone: Disable the biometric ID by going into Settings > Face (or Touch) ID & Passcode and turn "iPhone Unlock" off, or tap the "Reset Face ID" option. Disabling the biometric phone unlocks on Android (left) and iPhone (right). Install Signal anchor link Signal is an app available on both iOS and Android that offers strong encryption to protect both text messages and voice calls. This type of protection is called end-to-end encryption , which secures your communications in transit. Of course, there are other communication app options, but they come with caveats. For example, WhatsApp is also end-to-end encrypted, but collects more metadata than Signal. Apple's Messages is end-to-end encrypted, but only if everyone in the chat has an iPhone. Signal is the easiest option to ensure everyone involved in the chat is set up securely by default. In addition to encrypting one-to-one communication, Signal enables encrypted group chats. The app also allows the user to set messages to disappear some amount of time after they are first read. In contrast to some other services like Snapchat, these ephemeral messages will never be stored on any server, and are removed from your device after disappearing. In 2016, a grand jury in the Eastern District of Virginia issued a subpoena to Open Whisper Systems, the developers of Signal. Because of the architecture of Signal, which limits the user metadata stored on the company’s servers, the only data they were able to provide was "the date and time a user registered with Signal and the last date of a user's connectivity to the Signal service." A similar situation, with the same results, happened again in 2021 (twice). People at protests will sometimes have to make tradeoffs. You might have good reasons to send a Signal message; for example, to tell a friend what you are seeing at a protest so they can alert others or to send relevant photos and videos to friends so that if your phone is confiscated you have a way to retrieve the media later. You might also have good reasons to block adversaries from using your phone to prove you were at a protest; this requires turning off its connectivity or leaving it at home, as we explain below. Unfortunately, if you go to a protest and use your phone to communicate, even with Signal, the phone's connectivity might expose your location. Back Up Your Data anchor link Take precautions to limit the potential costs of losing access to your device, whether it’s lost, stolen, or confiscated by law enforcement. Back up your data regularly and store that backup in a safe place to save yourself from a headache later on. If you're storing your iPhone's backups online, we strongly suggest enabling the optional Advanced Data Protection feature, which turns on end-to-end encryption for most of the data stored in iCloud. For Android, we suggest choosing an online backup service which provides (so-called) “zero knowledge,” keeping your data safe from even the backup service itself (note that some services use different names for this feature). Buy a Prepaid, Disposable Phone anchor link In the United States, federal regulation does not require you to show your ID to purchase a prepaid SIM card (but your state might). Most countries require you to provide a form of ID to purchase a prepaid SIM card , thus linking the card to your identity and removing the possibility of anonymity. If you're concerned about protecting the data stored on your device, don't bring it to the protest. Instead, purchase a prepaid mobile phone. These devices can be purchased along with a SIM card at most large retail stores. Let your friends know your temporary number, and use this to coordinate activities. Remember that the location of mobile devices can be determined by the cell towers they connect to. So, if you don't want your identity and location known, turn off your prepaid device before going home or anywhere that might reveal your identity. As we explain below, you might also toggle the settings on your prepaid phone to end connectivity and thus block location tracking. When you're done with the phone, it can be safely recycled or discarded from a location that is not linked to you. Keep in mind that if you carry both your regular device and a prepaid one with you, the location of these devices can be correlated and compromise your anonymity. Dress for Anonymity and Safety anchor link Many law enforcement agencies have access to sophisticated surveillance technology that can be used to identify people attending a protest. To protect yourself, it’s important to dress in ways that preserve your anonymity and protect your physical safety. Wearing the same clothing as everyone in your group can help hide your identity during the protest and keep you from being identified and tracked afterwards. Dressing in dark, monochrome colors will help you blend into a crowd. Be aware that you may not be as visible to cars in the dark, and should take extra precaution when crossing streets or walking near moving vehicles. If you have visible tattoos or bright unconventional hair colors, cover them up. Tattoos can be used to identify you later, and may be added to databases for tattoo recognition. Dark monochrome hats, scarves, gloves, long sleeves, and full-length clothing will help cover these identifying features so you blend more easily into a crowd. During the Protest anchor link Take Photos and Videos without Unlocking Your Device anchor link Catching that perfect image is something you want to be ready for, and powerful images can help support your cause. If you have a digital camera, even a cheap point-and-shoot, that might be the best option for capturing photos easily. But your phone works too. If you've chosen a strong password, entering it into the device takes precious time, and you risk the moment passing before you're able to take the picture. Luckily, iOS and Android allow you to take photos and videos without unlocking your device. With Android Pixel devices, double-press the power button. From the iPhone lock screen, firmly press on the camera icon. Older iPhone models require you to swipe up. Be Mindful of Other Protesters in Your Photos and Videos anchor link If you are taking photos or videos of people at the protest, be mindful of what you post. If you post photos online where protesters or bystanders’ faces are identifiable, law enforcement or vigilantes might track them down and arrest or harass them. Obscure the faces of anyone in the image. There are a handful of ways to do this: You can edit photos in the default Android or iOS photo editing apps. Be sure to block out or blur other identifying features such as tattoos or unique clothing (blurring can sometimes be reversed so blocking out is better if you have the option). If you're using Signal, the app has a blurring tool built into it. You can create a message conversation with yourself (the app refers to this as a "Note to Self") to easily save the image to your phone for sharing. Image Scrubber is an online tool that can be used on either mobile or desktop devices to blur or block out a face. Scrub Metadata on Photos anchor link Once you are ready to post your photos, it’s a good idea to scrub the metadata contained in the image files so you don't leak personally identifying information. Metadata on photos can include information such as the model of camera the photo was taken on, the exact time and location where the photo was taken, and even your name. You have a few approaches to handling this: Remove any original photo metadata by transferring the photo onto a desktop computer, taking a screenshot of the image, and posting the screenshot instead of the original photo. You can also take a screenshot of the photo on your mobile device to remove the metadata, but the image quality may not be as high. You can then post that screenshot instead of the original photo. Send yourself a copy of the photo in the Signal app (which strips metadata when sending images), then download the sent image for posting. Things to be aware of while traveling to and from the protest anchor link Driving Considerations anchor link Automated License Plate Reader Systems (ALPRs) automatically record the license plates of cars driving through an area, along with the exact time, date, and location they were encountered. This technology is often used by law enforcement in the United States and many other countries, or employed by private companies such as Vigilant and MVTrac who then share license plate data with law enforcement and other entities. Amassed in huge databases, this data is generally retained for lengthy periods of time. Essentially, your location can be tracked over time based on the driving history of any car registered to you, with very few legal limits in place as to how this data can be collected, accessed, shared, and retained. Public Transit Considerations anchor link Be careful when traveling to and from the protest location on public transportation. If you’re using payment methods or transit cards that are linked to you, law enforcement may be able to determine you attended the protest and track your movements. Consider using cash when possible, or alternative means of public transportation if you would prefer that your movements and associations remain private. If you are able, consider biking or walking to and from the protest to minimize exposure to these types of surveillance risks. Toggle Your Phone's Settings anchor link To reduce the risk of somebody tracking your location through your phone, consider turning off some of its features: On Android: Pull down from the top of the screen to access the Notification Shade. Tap "Airplane Mode" to enable it, th'''
year_published = 2025
