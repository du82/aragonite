ውም መሳሪያዎች በኮምፒተርዎ፣ በሌላ ዲስክ ወይም የዩኤስቢ ድራይቭ፣ "Time Machine"፣ በኢሜይል ሰርቨር፣ በደመና ውስጥ ወይም ወደ እውቅያዎችዎ የተላኩትን የመጠባበቂያ ቅጂዎችን አይሰርዙም። አንድን ፋይል በአስተማማኝ ሁኔታ ለመሰረዝ፣ ያጠራቀመበት ወይም የተላከበትን ሁሉም ቦታ ቅጂዎችን ማጥፋት አለብን። በተጨማሪም አንድ ፋይል በደመናው ውስጥ ከተከማቸ (ለምሳሌ:- በ ድሮፕቦክስ ወይም በሌላ ሰነድ ማጋሪያ አገልግሎት አማካኝነት) ለዘላለም የሚጠፋበት መንገድ የለም። እንደአለመታደል ሆኖ ሌሎች ደኅንነቱ የተጠበቀ መሰረዣ መሳሪያዎች ሌሎች ገደቦች አሉባቸው። ከላይ የተሰጠውን ምክር ቢከተሉ እና ሁሉንም የሰነድ ቅጂዎችን ቢደመስሱ እንኳ የተደመሰሱ ሰነዶች ጥቂት ዱካ በኮምፒውተራችን ላይ ሊቆዩ የሚችሉበት እድል አለ። ሰነዶቹ በትክክል ስላልተደመሰሱ ሳይሆን የተወሰኑ የስርዓተ ክወና ክፍሎች ወይም ሌሎች መተግበሪያዎች ሆን ተብሎ የተመዘገቡበትን መዝገብ ይይዛሉ። ይህ ሊመጣ የሚቻልባቸው በርካታ መንገዶች አሉ። ነገር ግን ሁለት ምሳሌዎችን ማንሳት ሊሆን የሚችልበት ዕድሎች እንዳሉ ለማሳየት በቂ ናቸው። በዊንዶውስ ወይም ማክኦኤስ፣ ማይክሮሶፍት ኦፊስ በ"የቅርብ ጊዜ ሰነዶች" ምናሌ ውስጥ ሰነዱ ቢሰረዝም(አንዳንድ ጊዜ ኦፊስ የይዘት ፋይሎችን የያዘ ጊዜያዊ ቅጂም ሊያስቀምጥ ይችላል) የሰነድ ስም ሊያኖሩ ይችላሉ። ሊብሬኦፊስ እንደ ማይክሮሶፍት ኦፊስ ብዙ መዝገቦችን ሊይዝ ይችላል። እናም ምንም እንኳን ፋይሉ በአስተማማኝ ሁኔታ ቢሰረዝም የተጠቃሚው ዝርዝር የሰነድ ታሪክ የሰነዱን ስም ያካተተ ትዕዛዞችን የያዘ ሊሆን ይችላል። በተግባር ግን እንደዚህ አይነት ባህሪ ያላቸው በደርዘን የሚቆጠሩ ፕሮግራሞች ሊኖሩ ይችላሉ። ለዚህ ችግር እንዴት ምላሽ መስጠት እንደሚቻል ማወቅ በጣም አስቸጋሪ ነው። አንድ ሰነድ ደኅንነቱ በተጠበቀ ሁኔታ ከተሰረዘ በኋላ እንኳን ስሙ ለተወሰነ ጊዜ በኮምፒውተሩ ላይ ይኖራል። ስሙ በሙሉ ጠፍቶ እንደሆነ 100% እርግጠኛ ለመሆን ብቻ ዲስኩን በሙሉ እንደገና መጻፍ ብቸኛው መንገድ ነው። አንዳንዶቻችሁ "መረጃው የትኛውም ቅጂ ወደ የትኛውም ቦታ መኖሩን ለማየት ዲስኩ ላይ ጥሬ ውሂብ መፈለግ እችላለኹ?" ብለው ይጠይቁ ይሆናል። መልሱ አዎን እና አይደለም የሚል ነው። ዲስኩን መበርበር ውሂቡ በዲስክ ውስጥ የሚገኝ እንደሆነ ይነግርዎ ይሆናል። ነገር ግን አንዳንድ ፕሮግራሞች የተጨመቁ ወይም በሌላ መንገድ የተጣቀሱ ማጣቀሻዎች ካሉ አይነግርዎትም። በተጨማሪም ፍለጋው ራሱ አሻራ እንዳይተው ይጠንቀቁ! የፋይሉ ይዘቶች ሊገኙ የሚችሉበት ዕድል ዝቅተኛ ቢሆንም ግን የማይሆን አይደለም። ሙሉውን ዲስክ መገልበጥ እና አዲስ ስርዓተ ክወና መጫን ሰነዱ እንደ ተሰረዘ 100% እርግጠኛ ለመሆን ብቸኛው መንገድ ነው። ያረጀ ሃርድዌር ማስወገድ ሲያስፈልግ የሚደረግ ደኅንነቱ የተጠበቀ ስረዛ anchor link አንድ የሃርድዌርን መጣል ወይም በኢቤይ ላይ ለመሸጥ የሚፈልጉ ከሆነ ማንም ሰው የእርስዎን ውሂብ ማውጣት አለመቻሉን ማረጋገጥ ይፈልጋሉ። ጥናቶች እንደሚያሳዩት የኮምፒውተር ባለቤቶች ብዙውን ጊዜ እንዲህ ማድረግ አይሳካላቸውም። ሃርድ ድራይቮች ብዙ ጊዜ ከፍተኛ ሚስጥራዊ የሆኑ መረጃዎችን እንደያዙ ነው እንደገና የሚሸጡት። ስለዚህ ኮምፒውተር ከመሸጥ ወይም እንደገና ጥቅም ላይ ከመዋልዎ በፊት በመጀመሪያ, በውስጡ ያለውን የመረጃ ማጠራቀሚያ በማይረባ ነገር መተካትዎን ያረጋግጡ። ምንም እንኳን ወዲያውኑ ባያስወግዱት ህይወቱ ያበቃ ኮምፒውተር ካለዎትና ከአሁን በኋላ ጥቅም ላይ የማይውል ከሆነ አንድ ጥግ ላይ ወይም ቁም ሳጥን ውስጥ ከማስቀመጥዎ በፊት ሃርድ ድራይቩን ማጽዳት የበለጠ አስተማማኝ ይሆናል። ‘ድሪክስ ቡት ነደ ኑክ’ ለዚህ ዓላማ የተሰራ መሣሪያ ሲሆን እንዴት መጠቀም እንደሚቻል የሚያሳዩ በርካታ መልመጃዎች ( ይህንን ጨምሮ) በመላው ድር ይገኛሉ። አንዳንድ ሙሉ ዲስክ ምስጠራ ሶፍትዌሮች የመደበኛ ቁልፉን የማጥፋት ችሎታ አላቸው። በመሆኑም የተመሰጠሩ የሃርድ ድራይቭ ይዘቶችን መገልበጥ ፈጽሞ አይቻልም። ቁልፉ ትንሽ መጠን ያለው መረጃ በመሆኑ እና በፍጥነት ሊጠፋ በመቻሉ እንደ ድሪክስ ቡት ነደ ኑክ ካሉ ሶፍትዌሮች ጋር ለትልቅ ድራይቮች በጣም ብዙ ጊዜ ሊወስድ የሚችለውን እንደገና ለመጻፍ በጣም ፈጣን አማራጭ ነው። ሆኖም ግን ይህ አማራጭ ተገቢ የሚሆነው ሃርድ ድራይቮ ሁልጊዜ የሚመሰጠር ከሆነ ነው። ሙሉ ዲስክ ምስጠራን ቀድመው የማይጠቀሙ ከሆነ ከማስወገድዎ በፊት ሙሉውን ዲስክን እንደገና መጻፍ ያስፈልግዎታል። ሲዲ ወይም ዲቪዲ-ሮምስ ማስወገድ anchor link ሲዲ ወይም ዲቪዲ-ሮም ወደማስወገድ ጋር ስንመጣ ወረቀት ሲያስወግዱ እንደሚያደርጉ ተመሳሳይ ነገር ማድረግ አለብዎ። ብዙ ገንዘብ የማያባክኑ ማስወገጃዎች አሉ። ምንም ስሱ መረጃዎች አለመያዛቸውን ፍጹም እርግጠኛ ካልሆኑ በስተቀር ሲዲ ወይም ዲቪዲ-ሮምን ወደ ቆሻሻ ቅርጫት አይወርውሩ። ሶሊድ ስቴት ዲስኮችን(SSDs)፣ ዩኤስቢ ፍላሽ ድራይቮችን እና ኤስዲ ካርዶችን ደኅንነቱ በተጠበቀ መንገድ መሰረዝ anchor link እንደ አለመታደል ሆኖ በአሰራር ስልታቸው ምክንያት ሶሊድ ስቴት ዲስኮችን(SSDs)፣ ዩኤስቢ ፍላሽ ድራይቮችን እና ኤስዲ ካርዶች ውስጥ ያሉ ሰነዶችን ወይም ባዶ ቦታዎችን ለመሰረዝ አይቻልም ለማለት ቢከበድ እንኳን አስቸጋሪ ነው። በዚህ ምክንያት ራስዎን ከመጠበቅ አንፃር እጅግ የተሻለው አማራጭ ምስጠራ ነው። እንዲህ ካደረጉ በኋላ ሰነዱን በዲስክ ውስጥ ማንኛውም ሰው ቢያገኘው እንኳን የሚመለከተው እንደ የማይረባ ነገር ነው፡፡ እናም ምስጠራውን እንዲፈቱ ሊያስገድድዎት አይችልም። በአሁን ሰዓት ከኤስኤስዲ ላይ መረጃዎን የሚያስወግድ ጥሩ የሚባል አጠቃላይ ቀደም ተከተል ማቅረብ አንችልም። ለምን ውሂብ መሰረዝ በጣም ከባድ እንደሆነ ማወቅ ከፈለጉ ንባብዎን ይቀጥሉ። ቀደም ብለን እንደጠቀስነው ኤስኤስዲ እና የዩኤስቢ ፍላሽ ድራይቮች ዊር ሌቭሊንግ የተባለ ስልት ይጠቀማሉ። ዊር ሌቭሊንግ በከፍተኛ ደረጃ የሚሰራው እንደሚከተለው ነው። በመጽሐፍ ውስጥ እንዳሉ ገጾች በዲስክ ውስጥ ያለው በእያንዳንዱ ቦታ በብሎኮች የተከፈለ ነው። አንድ ሰነድ በዲስክ ላይ ሲጻፍ የተወሰነ ብሎክ ወይም ብሎኮች(ገጾች) ይይዛል። ሰነዱን ለመተካት ከፈለጉ ማድረግ ያለብዎት ለዲስኩ በብሎኮች ላይ እንደገና እንዲጽፍ መንገር ነው። ነገር ግን በኤስኤስዲ እና የዩኤስቢ ፍላሽ ድራይቮች በመሰረዝ እና እንደገና መጻፍ ብሎኩን ከጥቅም ውጭ ሊያደርገው ይችላል። ማገልገል የማይችል እስኪሆን ድረስ እያንዳንዱ ብሎክ በማጥፋት እና እንደገና መጻፍ ሊያገለግል የሚችልበት መጠን የተገደበ ነው።(ልክ በአንድ የወረቀት ገጽ ላይ ደጋግመው በእርሳስ እየጻፉ ቢያጠፉ ወረቀቱ እንደሚቀደድ ወይም ከጥቅም ውጭ እንደሚሆነው ማለት ነው።) ይህን ለመመከት ኤስኤስዲ እና የዩኤስቢ ፍላሽ ድራይቮች እያንዳንዱ ብሎክ ላይ የሚጻፈው እና የሚጠፋው ብዛት ተመሳሳይ መሆኑን ለማረጋገጥ ይሞክራሉ፤ በዚህም ድራይቩ በተቻለ መጠን ለረዥም ጊዜ ይቆያል። ይህ ሂደት ነው ዊር ሌቭሊንግ የሚባለው። እንደ የጎንዮሽ ጉዳት አንዳንድ ጊዜ ሰነዱ በመጀመሪያ የተቀመጠበትን ብሎክ በማጥፋት እና እንደገና በመጻፍ ፋንታ ያንን ብሎክ በመተው ወይም የማይሰራ የሚል ምልክት በመተው የተቄረውን ሰነድ በተለየ ብሎክ ያስቀምጣል። ይህ በመጽሐፉ ውስጥ ገጹን ሳይለውጥ የተሻሻለውን ፋይል በመጻፍ እና በሌላ የመዝገበ-ቃሉ ማውጫ ላይ ወደ አዲሱ ገፅ እንደገና መጻፍ ማለት ነው። ይህ ሁሉ የሚሆነው በዲስክ ኤሌክትሮኒክስ ውስጥ በጣም ዝቅተኛ በሆነ ሁኔታ ውስጥ ነው የሚከሰተው። ስለዚህ ስርዓተ ክወናው ምን እንደፈጠረ እንኳን አያውቅም። ይሄ ማለት አንድ ሰነድ ላይ ደርቦ ለመጻፍ ቢሞክር እንኳ ድራይቮ በትክክል ደርቦ እንደገና ለመጻፉ ምንም ዋስትና የለም። ለዚህም ነው የኤስኤስዲዎችን ደኅንነቱ በተጠበቀ መንገድ መሰረዝ ይህን ያህል ከባድ የሆነው።'
