 ይሆናል፡፡ ኢሜይሎችን ከነላኪዎቻቸው ያረጋግጡ anchor link አንድ ኢሜይል የማስገር ጥቃት መሆኑን ለማረጋገጥ በሌላ መንገድ ከላኪውን ጋር በመገናኘት በመጠየቅ ማረጋገጥ ይቻላል፡፡ ኢሜይሉ ደንበኛ ከሆኑበት ባንክ የተላከ ሆኖ ከተገኘ በኢሜል ውስጥ አገናኞችን አይጫኑ፡፡ ይልቁንስ ወደ ባንክዎ ይደውሉ ወይም አሳሽዎን ይክፈቱ እና የእርስዎን ባንክ መካነ ድር ዩአርኤል ይፃፉ፡፡ በተመሳሳይም አጎቴ ቦሪስ አንድ የኢሜይል አባሪ ከላከዎት ከመክፈትዎ በፊት በስልክዎ ላይ ይደውሉና ከዚህ ቀደም የልጆቹን ምስሎችን እንደላከልዎ ይጠይቁ፡፡ አጠራጣሪ ሰነዶችን በጎግል ድራይቭ ክፈት anchor link አንዳንድ ሰዎች ከማይታወቁ ሰዎች አባሪዎችን እንዲልኩላቸው ይፈልጉ ይሆናል፡፡ ለምሳሌ ጋዜጠኞች አብዛኛውን ጊዜ ሰነዶችን ከመረጃ ምንጮች ይቀበላሉ፡፡ ነገር ግን የወርድ ሰነድ፣ የ ኤክሴል ሉክ ወይም የፒ.ዲ.ኤፍ ፋይል ተንኮል አዘል መሆኑን ማረጋገጥ አስቸጋሪ ሊሆን ይችላል፡፡ በእነዚህ አጋጣሚዎች የወረደውን ፋይል ሁለት ጊዜ አይጫኑ፡፡ ይልቁንም ወደ ጎግል ድራይቭ ወይም ሌላ የመስመር ላይ ሰነድ አንባቢ ይስቀሉት፡፡ ይሄ ሰነድ ፋይሉን ወደ ምስል ወይም ኤችቲኤምኤል (HTML) ይቀይረዋል፡፡ ይህም በእርግጠኝነት በመሣሪያዎ ላይ ሸረኛ ሶፍትዌር እንዳይጭን ይከለክለዋል፡፡ አዲስ የሶፍትዌር ለመማር እና ደብዳቤ ወይም ካልታወቀ ሰው የተላከ ሰነድ ለማንበብ አዲስ ከባቢ ለመፍጠር ፍቃደኛ ከሆኑ፣ ተንኮል አዘል ውጤቶችን ለመገደብ የተቀየሱ ስርዓተ ክዋኔዎች አሉ፡፡ ቴይልስ (TAILS) ሌኑክስ(Linux) ላይ ተመሰረተ ስርዓተ ክዋኔ ሲሆን ከተጠቀሙበት በኋላ ራሱን የሚያጠፋ ነው፡፡ ኩዩብስ(Qubes) ደግሞ ሌኑክስ ላይ የተሰመረተ ስርዓተ ክዋኔ ሲሆን መተግበሪያዎን እርስ በርስ እንዳይተላለፉ በመለያየት የማንኛውም የሸረኛ ሶፍትዌር ስጋት ይገድባል፡፡ ሁለቱም የተዘጋጁት በላፕቶፕ ወይም ዴስክቶፕ ኮምፒውተሮች ላይ እንዲሰሩ ሆነው ነው፡፡ በተጨማሪም እምነት የማይጣልባቸው አገናኞችን እና ፋይሎችን ወደ ቫይረስቶታል (VirusTotal) ወደተሰኘው ሰነዶችን ከሚያረጋገጠው እና ከተለያዩ የጸረ-ቫይረስ ቴክኖሎጂዎች ጋር የተገኛው እና ውጤቶችን ሪፖርት ወደሚያደርገው የመስመር ላይ አገልግሎት ማቅረብ ይችላሉ፡፡ አብዛኛውን ጊዜ ይሄ መንገድ አዲስ ሸረኛ ሶፍትዌሮችን ወይም የታቀዱ ጥቃቶችን መከላከል አይችልም፡፡ ነገር ግን ከምንም ይሻላል፡፡ እንደ ቫይረስቶታል ወይም ጎግል ድራይቭ ያሉ ይፋዊ መካነ ድሮች የሚሰቅሉት ማንኛውም ፋይል ወይም አገናኝ በእነዚህ ኩባንያ በሚሰራ ማንኛውም ሰው ወይም እነዚህን መካነ ድሮች ማግኘት በሚችል ሰው ሊታይ ይችላል፡፡ በፋይሉ ውስጥ ያለው መረጃ ሚስጥራዊነት ወይም የተወሰኑ ሰዎች ብቻ ሊመለከቱ የሚገባ ከሆነ ሌሎች አማራጮችን ይጠቀሙ፡፡ ወደ መለያ በሚገቡበት ጊዜ ሁለንተናዊ 2 ኛ ደረጃ (U2F) ቁልፍ ይጠቀሙ anchor link አንዳንድ መካነ ድሮች የማስገር ጥቃት ሙከራዎችን ለማስቀረት ሲሉ የላቁ ችሎታዎች በመጠቀም ልዩ የሃርድዌር ማስመሰያ እንዲጠቀሙ ይፈቅዱልዎታል፡፡ እነዚህ ተለዋጭ ማስመሰያዎች (ወይም "ቁልፎች") ለመግባት ቀድሞው በተዘጋጁ የማለፊያ ምስጢሮች ከእርስዎ አሳሽ ጋር ይግባባሉ፡፡ ይህ መንገድ በመግቢያ ላይ ከሚጠቀሙት ከማለፊያ ሐረግ በተጨማሪ ሁለተኛ የማረጋገጫ መንገድ ስለሚጠቀም ሁለንተናዊ 2ኛ ደረጃ ወይም “U2F” ይባላል፡፡ በመደበኝነት ይግቡ፣ እና (ሲጠየቁ) ቁልፉን ከኮምፒውተርዎ ወይም ከተንቀሳቃሽ ስልክዎ ጋር ያገናኙ እና በመለያ ለመግባት የሚጋኙትን ቁልፍ ይጫኑ፡፡ የማስገር ጥቃት የሚፈጽም መካነ ድር ለመግባት ሲሞክሩ በህጋዊ መንገድ ላይ በተረጋገጡ መካነ ድሮች ጋር የተቆራኘው ማሰሻዎ ወደተሳሳተው ውስጥ እንዲገቡ አይፈቅድም፡፡ ይህ ማለት አስጋሪው ቢሸውድዎ እና የይለፍ ሐረግዎን ቢሰርቅ እንኳ የእርስዎን መለያ ማግኘት አይችልም፡፡ ዩቢኮ (እንደነዚህ ያሉ ቁልፎች አንድ አምራች) ስለ U2F ተጨማሪ መረጃ ያቀርባል፡፡ ይህ ከማስገር ጥቃት ጥበቃ ሊሰጥ ወይም ላይሰጥ ከሚችለው ከባለ-ሁለት ደረጃ ማረጋገጫ ጋር መምታታት የለበትም፡፡ በኢሜይል የተጻፈ መመሪያን ይጠንቀቁ anchor link አንዳንድ አስጋሪ ኢሜይሎች ከኮምፒውተር ድጋፍ ክፍል ወይም የቴክኖሎጂ ኩባንያ የመጡ እንደሆኑ እና እርስዎ ከይለፍ ቃላትዎ ጋር ምላሽ እንዲሰጡ ወይም የ’ኮምፒዩተር ጥገና ባለሙያው’ን ኮምፒተርዎን ከርቀት እንዲደርሱበት ለማድረግ ወይም በመሳሪያዎ ላይ ያለውን የደኀንነት መጠበቂያ መንገድ እንዲያስቆሙ ይጠይቅዎታል፡፡ ኢሜይሉ ይህንን እንዲያደርጉ የታዘዙት ለምን አስፈላጊ እንደሆነ፣ ለምሳሌ የኢሜል ሳጥንዎ ሙሉ እንደሆነ ወይም ኮምፒተርዎ ተጠልፎ እንደነበረ በመጥቀስ ማብራሪያ ሊሰጥ ይችላል፡፡ በሚያሳዝን ሁኔታ እነዚህን የማጭበርበሪያ መመሪያዎች መታዘዝ ለእርስዎ ደኀንነት መጥፎ ሊሆን ይችላል፡፡ የጥያቄው ምንጭ እውነተኛ መሆኑን እርግጠኛ ካልሆኑ በስተቀር በተለይ የቴክኒክ መረጃዎችን ከመስጠት ወይም የቴክኒካዊ መመሪያዎችን ከመከተልዎ በፊት ጥንቃቄ ይድርጉ፡፡ ማንም ሰው የላከልዎን ኢሜል ወይም አገናኝ ከተጠራጠሩ፣ ከላይ በተጠቀሱት ምክሮች አማካኝነት ሁኔታውን እስኪያጣሩ ድረስ አይከፍቱ ወይም ጠቅ አያድርጉት፤ በተንኮል የተላኩ እንዳልሆኑ እርግጠኛ ይሁኑ፡፡'
