 ሰዎች በመሳሪያቸው ላይ ያደረጉትን የጣት አሻራ በእርስዎ መሣሪያ ትክክለኛነትነቱን እንዲያረጋግጡ ያደርጋሉ፡፡ የዚህ ዓላማ መካከለኛ የሆነ ሰው የተሳሳተ ቁለፍ በመጠቀም እንዳያታልዎ መከላከል ነው፡፡ በIP ላይ የሚደረግ የድምጽ ግንኙነት ማንኛውም ኢንተርኔትን በመጠቀም የድምጽ ግንኙነት ለማድረግ የሚያገለግል ቴክኖሎጂ ነው። ወይም በIP ላይ የሚደረግ የድምጽ ዝውውርን ተጠቅሞ በኢንተርኔት አማካኝነት የሚደረግ የስልክ ጥሬ አገልግሎት ነው። በዝውውር ሂደት ድርብርብ የውሂብ ምስጠራ ውሂብ በኔትወክ በሚተላለፍበት ወቅት ኔትወርኩ ላይ ስለላ የሚያካሂዱ አካላት ውሂቡን እንዳያነቡት ያግዳል። ባለ ሁለት ማትሪያ ማመሳከሪያ "የኾነ የሚያዉቁት እና ያለዎት ጉዳይ።" የተጠቃሚ ስምን እና የማለፊያ ቃልን ብቻ የሚጠይቁ የመግቢያ ስርዓቶች ክፍተት አላቸው። አንድ ግለሰብ እነዚህን ቅንጥብ መረጃዎች ቢያገኝ (ወይም መገመት ቢችል) መረጃዎች አደጋ ላይ ይወድቃሉ። ባለ ሁለት ማትሪያ ማመሳከሪያን የሚሰጡ አገልግሎቶች ትክክለኛ ማንነትዎን የሚያረጋግጡበት ተጨማሪ የተለየ ማስረጃ እንዲሰጡ ይጠይቅዎታል። ሁለተኛው ማትሪያ አንድ የሚስጥራዊ ኮድ፣ በተንቀሳቃሽ ስልክዎ ላይ ባለ ፕሮግራም የመነጨ ቁጥር፣ ወይም እርስዎ የያዙት እና ማን እንደኾኑ የእርስዎን ማንነት ለማረገገጥ የሚጠቀሙበት መሣሪያ ሊኾን ይችላል። እንደ ባንክ ያሉ ኩባንያዎች እና እንደ ጎግል፣ ፔይፓል እና ትዊተር ያሉ ዋና ዋና የኢንተርኔት አገልግሎት ሰጪዎች ባለ ሁለት ማትሪያ ማመሳከሪያ አገልግሎትን ይሰጣሉ። ችሎታ በዚህ መመሪያ መሰረት የአጥቂ ችሎታ ማለት ዓላማው ግቡን እንዲመታ የሚያስችለው አቅም ነው። ለምሳሌ የአንድ ሀገር የደህንነት መሥሪያ ቤት የስልክ ጥሪዎችን ማዳመጥ የሚያስችል ችሎታ ሊኖረው ይችላል። ጎረቤቶች ደግሞ እርስዎን በመስኮት የመከታተል ችሎታ ሊኖራቸው ይችላል። አንድ አጥቂ ችሎታ “አለው" ማለት ያለውን ችሎታ በተግባር ላይ ያውለዋል ማለት ላይኾን ይችላል። ነገር ግን በተግባር ላይ ሊያውለው ይችላል ብለው በማሰብ ቅድመ ዝግጅት ማድረግ ይጠበቅብዎታል ማለት ነው። ንቁ ያልኾነ አጥቂ ንቁ ያልኾነ አጥቂ ማለት የመስመር ላይ ግንኙነትዎን የሚሰማ ነገር ግን በቀጥታ መልዕክቱን ይዘት መቀየር የማይችል ማለት ነው። አብይ የማለፊያ ቃል የማለፊያ ቃላት ካዝናን ለመክፈት የሚጠቀሙት የማለፊያ ቃል ወይም ፕሮግራሞችን ወይም መልዕክቶችን የሚከፍቱበት ዋነኛ መንገድ ነው። አብይ የማለፊያ ቃልን በተቻለ መጠን ጠንካራ ማድረግ ይኖርብዎታል። አጥቂ አጥቂዎ የእርስዎ የደህንነት ግቦች ላይ ጥቃት ለመሰንዘር የሚሞክር ሰው ወይም ድርጅት ነው። ያሉትን ነባራዊ ኹኔታዎች መሠረት በማድረግ አጥቂዎች የተለያዩ ሊኾኑ ይችላሉ። ለምሳሌ ወንጀለኞች በካፌ ውስጥ ያለ መረብን ሊሰልሉ እንደሚችሉ፣ ወይም ትምህርት ቤት የክፍሎ ተማሪዎች ሊሰልሉዎት ሊጠረጥሩ ይችላሉ። አብዛኛውን ጊዜ አጥቂዎች ሃሳባዊ ናቸው። ኢንተርኔትን ማጣራት ማጣራት ማገድ እና ቅድመ ምርመራን ለዘብ ባለ መልኩ ለመግለጽ ጥቅም ላይ የሚውል ቃል ነው ። አንዳንዴ ምናባዊ የግል አውታረ መረቦች ወይም እንደ ቶር ያሉ አገልግሎቶች ካልተጣሩ የኢንተርኔት ግንኙነት በመስጠት ሊያገለግሉ ይችላሉ፡፡ ከመስመር ውጪ ማራጋገጫ "ከመስመር ውጪ" ማለት እየተጠቀሙት ካለው የመገናኛ መንገድ ውጪ የኾነ የመገናኛ መንገድ ነው። ደህንነቱ ያልተጠበቀ ስርዓትን ተጠቅመው እየተነጋገሩት ያለውን ሰው ማንነት ለማረጋገጥ አብዛኛውን ጊዜ አነስተኛ ተመሳሳይ የጥቃት ተጋላጭነት ባለው ሌላ የመገናኛ መንገድ አማካኝነት መገናኘትን ይጠይቃል። ለምሳሌ የአንድን ሰው ትክክለኛ የአደባባይ ቁልፍ እንደሚጠቀሙ ለማረጋገጥ ቁልፉን ተጠቅመው ምስጢራዊ መልዕክትን ከመላክዎት በፊት በአካል ተገናኝተው ቁልፉን ማረጋገጥ ይችላሉ። ከምዝገባ ውጪ ፈጣን የመልዕክት ስርዓቶች አብዛኛውን ጊዜ ያልተመሰጠሩ ናቸው። OTR ወይም ከምዝገባ ውጪ በፈጣን የመልዕክት ስርዓቶች ውስጥ ምስጠራን የማበልጸጊያ መንገድ ነው። በመኾኑም እንደ ፌስቡክ ቻት፣ ወይም ጎግል ቻት ወይም ሃንግአውት፣ ያሉ ታዋቂ የግንኙነት መረቦችን ደህንነቱ በተጠበቀ መንገድ መጠቀም ያስችልዎታል። ከዳር እስከ ዳር ምስጠራ ከዳር እስከ ዳር ምስጠራ እንድ መልዕክት በላኪው ወደ ሚስጥራዊ መልዕክት መቀየሩን እና በተቀባዩ ብቻ መፈታት መቻሉን የሚያረጋግጥ ስርዓት ነው። ሌሎች የምስጠራ ዓይነቶች በሦስተኛ ወገን የሚደረግ ምስጠራ ላይ የተመሰረቱ ሊኾኑ ይችላሉ። ይህ ማለት አመስጣሪዎቹ አካላት በዋናው መልዕክት መታመን አለባቸው ማለት ነው። ከዳር እስከ ዳር ምስጠራ አብዛኛውን ጊዜ ደህንነቱ የተሻለ እንደኾነ ይታሰባል። ምክንያቱም ምስጠራውን መስበር ወይም ጣልቃ መግባት የሚችሉ አካላትን ቁጥር በመቀነሱ ነው። ኩኪዎች ኩኪዎች ድረ ገጾች የድር መዳሰሻዎን እንዲያውቁ የሚያደርጉ የድር ቴክኖሎጂ ናቸው። በዋናነት ኩኪዎች የተዘጋጁት ድረ ገጾች የመስመር ላይ ግብይቶች ማድረግ እንዲችሉ፣ ምርጫዎችን ለማስቀመጥ ወይም በድረ ገጽ ገብተው እንዲቆዩ ለማድረግ ነው። በተጨማሪም የድር ጉብኝትዎን እና የማንነትዎን መገለጫ እንዲሰበስቡ ያስችላሉ። ስለዚህም ድረ ገጾች ፤ ምንም እንኳን በዚያ ድረ ገጽ መለያ ባይኖርዎት ወይም በመለያዎ ውስጥ ያልገቡ ቢኾኑ፤ እርስዎን እንዲያውቁ እና የት እንደሚሄዱ፣ ምን አይነት መሣሪያን እንደሚጠቀሙ፣ እና ምን ዓይነት ዝንባሌ እንዳለዎት ሊያውቁ ይችላሉ። ክፍት ምንጭ ሶፍትዌር ክፍት ምንጨ ኮድ ሶፍትዌር ወይም ነጻ ሶፍትዌር ተጠቃሚዎች ኮዱን ሊያሻሽሉት እና እንደ አዲስ ደግመው ሊሰሩት በሚችል መንገድ በነጻ የሚሰራጭ ሶፍትዌር ነው። እንደ "ነጻ ሶፍትዌር" የሚታወቅ ቢኾንም ያለ ምንም ዋጋ በነጻ የሚገኝ ሶፍትዌር ነው ማለት ላይኾን ይችላል። የFLOSS ፕሮግራመሮች ልገሳን፣ ወይም ለአገልግሎት ድጋፍ ወይም ለቅጂ ክፍያን ሊጠይቁ ይችላሉ። ሊኑክስ እንደ ፋየርፎክስ እና ቶር ሁሉ ነጻ እና ክፍት ምንጨ ኮድ የኾነ ፕርግራም ምሳሌ ነው። ዌር ለቨሊንግ ወይም ንትበትን አመጣጣኝ የፍላሽ ዲስክ፣ የሶሊድ ስቴት አንጻፊዎች (SSD) እና ሌሎች የዲጂታል ማጠራቀሚያዎች በተደጋጋሚ ቢጻፍባቸው ሊነትቡ እና ሊያልቁ ይችላሉ። ንትበትን አመጣጣኝ የሚባለው ንትብትን ለመከላከል ውሂብን በተመጣጣኝ መልኩ በሁሉም ሥፍራ ላይ እንዲሰራጭ የሚያደርግ ዘዴ ነው። ዋናው ጥቅሙ የመሣሪያዎች የአገልግሎት ዘመን እንዲራዘም ማድረግ ነው። ለድህንነታቸው የሚጠነቀቁ ሰዎች የንትበት አመጣጣኝ መሣሪያ ውሂባቸውን ለዘላለሙ ለማጥፊያነት ከሚጠቀሙበት መሣሪያ አሰራር ጋር ጣልቃ በመግባት እንዳይረብሽ ያሳስባቸዋል። በፍላሽ ዲስክ ወይም በሶሊድ ስቴት አንጻፊዎች (SSD) ላይ ያሉ ሰነዶችን ደህንነቱ የተረጋገጠ የፋይል ማጥፋት ሂደትን ከማመን ይልቅ የሙሉ ዲስክ ምስጠራን መጠቀም የተሻለ ጥበቃ ሊያደርግ ይችላል። ምስጠራ ከትክክለኛው የማለፊያ ሐረግ ውጪ በአንጻፊው ላይ ማንኛውንም ፋይል ለማገገም (መልሶ ለማምጣት) የሚከወነውን ጥረት አዳጋች በማድረግ ደህንነቱ የተረጋገጠ ስረዛን በሚያደርጉበት ወቅት የሚያጋጥሞትን ችግር ይቀርፋል። ውሂብ ማንኛውም ዓይነት መረጃ በአብዛኛው ጊዜ በዲጂታል መልክ ይቀመጣል፡፡ መረጃ ሰነዶችን፣ ስዕሎችን፣ ቁልፎችን፣ ፕሮግራሞችን፣ መልዕክቶችን እና ሌሎች ዲጂታል መረጃዎችን ወይም ፋይሎችን ሊያካትት ይችላል፡፡