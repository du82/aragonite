title = "ባለሁለት-ደረጃ ማረጋገጫ መጠቀም | Surveillance Self-Defense"
description = """
ባለሁለት-ደረጃ-ማረጋገጫ (ወይም “2FA”)ባለሁለት-ደረጃ-ማረጋገጫ ተጠቃሚዎች ለአገልግሎት አቅራቢው ሁለት የተለያዩ የማረጋገጫ ስልቶችን በመጠቀም ማንነታቸውን ማረጋገጥ እንዲችል የሚያደርጉበት መንገድ ነው፡፡ ይህ ተጠቃሚው የሚያውቀው(እንደማለፊያ ቃል ወይም ግላዊ መለያ ቁጥር ያለ) ወይም በንብረትነት የያዘው(እንደ ተንቀሳቃሽ ስልክ ያለ) ወይም የሆነ ከተጠቃሚው ጋር የተያያዘ መለያየት የማይቻል (እንደ የጣት አሻራቸው ያለ) ነው፡፡

ምን አልባትም ባለሁለት-ደረጃ-ማረጋገጫን በሌላው የዕለት ተዕለት..."""
full_description = "< የመሣሪያ መመሪያዎች ባለሁለት-ደረጃ ማረጋገጫ መጠቀም Last Reviewed: September 07, 2017 This page was translated from English. The English version may be more up-to-date. ባለሁለት-ደረጃ-ማረጋገጫ (ወይም “2FA”)ባለሁለት-ደረጃ-ማረጋገጫ ተጠቃሚዎች ለአገልግሎት አቅራቢው ሁለት የተለያዩ የማረጋገጫ ስልቶችን በመጠቀም ማንነታቸውን ማረጋገጥ እንዲችል የሚያደርጉበት መንገድ ነው፡፡ ይህ ተጠቃሚው የሚያውቀው(እንደማለፊያ ቃል ወይም ግላዊ መለያ ቁጥር ያለ) ወይም በንብረትነት የያዘው(እንደ ተንቀሳቃሽ ስልክ ያለ) ወይም የሆነ ከተጠቃሚው ጋር የተያያዘ መለያየት የማይቻል (እንደ የጣት አሻራቸው ያለ) ነው፡፡ ምን አልባትም ባለሁለት-ደረጃ-ማረጋገጫን በሌላው የዕለት ተዕለት እንቅሰቃሴዎ ይጠቀሙ ይሆናል፡፡ ይሆናል፡፡ ለምሳሌ በኤቲኤም ካርድ ገንዘብ ሲያወጡ የባንክ ካርዱን (የእርስዎ ንብረት የሆነ) እና ግላዊ መለያ ቁጥርዎ(እርስዎ የሚያውቁት) ሁለቱም ሊኖርዎ ይገባል፡፡ አሁን ግን በርካታ የመስመር ላይ አገልግሎት ሰጪዎች ተጠቃሚዎቻቸውን ለመለየት የሚጠቀሙት ባለአንድ ደረጃ ማረጋገጫ በዋነኝነት ማለፊያ ቃልን ብቻ ነው፡፡ ባለሁለት-ደረጃ-ማረጋገጫ በመስመር ላይ እንዴት ይሰራል? anchor link ባለፉት ጥቂት ዓመታት ፌስቡክ፣ ጎግል እና ቲወተርን ጨምሮ በርካታ የመስመር ላይ አገልግሎት አቅራቢዎች መለያ ቃል ብቻ ከሚጠይቀው ማረጋገጫ በተጨማሪ ባለሁለት-ደረጃ-ማረጋገጫን ያቀርባሉ፡፡ ይህንን አገልግሎት እንዲጀመር ካደረጉ ማለፊያ ቃል እና ሁለተኛ የማረጋገጫ መንገድ ወደ መጠቀም ይሸጋገራሉ፡፡ ለሁለተኛው መንገድ አንዴ ወደ ስልክ በሚላክ አጭር መልዕክት ወይም ምስጢራዊ ግምጃ ባላቸው የተመረጡ መተግበሪያዎች (እንደ ጎግል ማረጋገጫ፣ ዱ ሞባይል፣ ፌስቡክ መተግበሪያ ወይም ክሌፍ) ይከናወናል፡፡ በየትኛውም መንገድ ይሁን ሁለተኛው ማረጋገጫ (በመደበኛነት) ተጠቃሚዎች የሚኖራቸው ተንቀሳቃሽ ስልክ ነው፡፡ እንዳንድ መካነ ድሮች (ጎግልን ጨምሮ) ከመካነ ድር ወርደው ወረቀት ላይ ታትመው በአስተማመኝ ቦታ የሚቀመጡ ምትክ ኮድዎችን ይሰጣሉ፡፡ አንዴ ባለሁለት-ደረጃ-ማረጋገጫን ለመጠቀም ከመረጡ በመለያዎ ለመጠቀም መለያ ቃል እና አንዴ በስልክዎ የሚላክልዎን ኮድ ማስገባት ይኖርብዎታል፡፡ ለምን ባለሁለት-ደረጃ-ማረጋገጫን እጠቀማለኹ? anchor link ባለሁለት-ደረጃ-ማረጋገጫ ከአንድ ጊዜ በላይ ማንነትዎን እንዲያረጋግጡ በመጠየቅ ለመለያዎ የተሻለ ደኅንነት ይሰጣል፡፡ ይህም ማለት አንድ ሰው መለያ ቃልዎን ቢያገኙ እንኳን ስልክዎን ወይም በሁለተኛ ደረጃ ያለ ማረጋገጫ ካላገኙ በስተቀር መለያዎን ከፍተው መግባት አይችሉም፡፡ ባለሁለት-ደረጃ-ማረጋገጫን መጠቀም ምን ጉዳት አለው? anchor link ምንም እንኳን ባለሁለት-ደረጃ-ማረጋገጫ የተሻለ ደኅንነት ያለው ማመሳከሪያ ቢሆንም መለያዎ ተቆልፎ የሚቀርበትን አደጋ ይጨምራል፡፡ ለምሳሌ ስልክዎን በተሳሳተ ስፍራ ቢያስቀምጡ ወይም ቢጠፋብዎ፣ ሲም ካርድ ቢቀይሩ ወይም በጉዞ ላይ ስልክዎን ለመጠቅም የሚያስችለውን አገልግሎት (ሮሚንግ) ሳይመዘገቡ ወደሌላ አገር ቢጓዙ መለያዎ ተቆልፎ ሊቀር ይችላል፡፡ ብዙዎቹ ባለሁለት-ደረጃ-ማረጋገጫ አገልግሎቶች መለያዎን ለመክፈት የሚያገልገሉ የተወሰኑ “ምትክ” ወይም “ማገገሚያ” ኮድዎች ያቀርባሉ፡፡ ስልክዎን ወይም ሌላ ማመሳከሪያ መሳሪያዎን የማጣት ስጋት ካደረብዎ ኮድዎችዎን በማተም ይዘዋቸው ይዙሩ፡፡ አንድ ቅጂ ብቻ ካተሙ በቅርብዎ ያድርጉት፡፡ እኒዘህን ኮዶች በጥንቃቄ መያዝዎን ያስታውሱ፤ ማንም ሰው እንዳላያቸው ወይም በማንኛውም ጊዜ እንደማያገኛቸው ያረጋግጡ፡፡ ኮድዎችዎን ከተጠቀሙባቸው ወይም ከጠፋብዎ ወደ መለያዎ መግባት በቻሉበት ጊዜ ሌላ ማውጣት ይችላሉ፡፡ አጭር የጽሑፍ መልዕክትን የሚጠቀም የባለሁለት-ደረጃ-ማረጋገጫ ሌላው ችግር አጭር የጽሑፍ መልዕክት በራሱ ደኅንነቱ ያልተጠበቀ መሆን ነው፡፡ የተደራጀ ጉዳት አድራሽ (እንደ ደኅንነት ተቋም ያለ ወይም የተደራጀ የወንጀለኞች ቡድን ያለ) የስልክ ትይይዝትን ማየት የሚችል ሰብሮ በመግባት በአጭር የጽሑፍ መልዕክት የተላኩ ኮዶችን መጠቀም ይችላል፡፡ ብዙም አደገኛ ያልሆነ (አንድ ግለሰብ) ወደ እርሱ ስልክ እንዲደውል ወይም መልዕክት እንዲልክ ማድረግ ይችላል ወይም የስልክ አገልግሎት ሰጪው ድርጅት ስልኩን በእጁ ማስገባት ሳይኖርበት የጽሑፍ መልዕክቱን ማየት ይችላል፡፡ ሊደርስብዎ የሚችልን ጉዳት መጠን በዝቶ ስጋት ውስጥ ካስገባዎ የአጭር የጽሑፍ መልዕክት ማመሳከሪያውን በማጥፋት እንደ ጎግል አውተንቲኬተር ወይም ኦውቲ ያሉ ማረጋገጫ መተግበሪያዎችን ብቻ ይጠቀሙ፡፡ ጥሩ ያልሆነው ነገር ሁሉም ባለሁለት-ደረጃ-ማረጋገጫዎች ይህ የአገልግሎት አማራጭ የላቸውም፡፡ በተጨማሪም ባለሁለት-ደረጃ-ማረጋገጫ መጠቀም ማለት እርስዎ ከሚፈቅዱት የበለጠ መረጃ ለአገልግሎት አቅራቢ መስጠት ነው፡፡ በሽሽግ ስም የቲወተር መለያ ፈጥረዋል እንበል፡፡ ትዊተር መረጃዎችን እንዳያገኝ በቶር ወይም በቪፒኤን አማካኝነት ቢጠቀሙም እንኳን ባለሁለት-ደረጃ-ማረጋገጫን ከተጠቀሙ ትዊተር በስልክ ቁጥርዎ አማካኝነት የእርሰዎን ማንነት የሚገልጽ መረጃን በእርግጠኝነት ይመዘግባል፡፡ ይህም ማለት በፍርድ ቤት ከተገደደ ትዊተር በስልክ ቁጥርዎ አማካኝነት ማንነትዎን ሊገልጽ ይችላል፡፡ ይህ ምን አልባት ለእርስዎ ችግር ላይሆን ይችላል፡፡ በተለይ በህጋዊ ስምዎ አገልግሎቱን የሚጠቀሙ ከሆነ፡፡ ነገር ግን ማንነትዎን መደበቅ አስፈላጊ ከሆነ በአጭር የጽሑፍ መልዕከት ባለሁለት-ደረጃ-ማረጋገጫን ከመጠቀምዎ በፊት ሁለቴ ማሰብ ይኖርብዎታል፡፡ በመጨረሻም ጥናቶች እንደሚያሳዩት አንዳንድ ተጠቃሚዎች ባለሁለት-ደረጃ-ማረጋገጫ መጠቀም ከጀመሩ በኋላ አገልግሎቱ ደኅንነታችንን ይጠብቀናል ብለው በማሰብ ቀለል ያለ ማለፊያ ቃል ይጠቀማሉ፡፡ባለሁለት-ደረጃ-ማረጋገጫ መጠቀም ከጀመሩም በኋላም ቢሆን ጠንካራ ማለፊያ ቃል መጠቀምዎን አይርሱ፡፡ ባለሁለት-ደረጃ-ማረጋገጫን እንዴት ማስጀመር እችላለኹ? anchor link ስያሜው እንደሚለያይ ማስጀመሪያውም ከአገልግሎት ሰጪ አገልግሎት ሰጪ ይለያል፡፡ ባለሁለት-ደረጃ-ማረጋገጫ የሚሰጡ መካነ ድሮዎች የያዘ ሰፊ ዝርዝር እዚህ https://twofactorauth.org/ይገኛል፡፡ እንደ አማዞን፣ ባንክ ኦፍ አሜሪካ፣ ድሮፕቦክስ፣ ፌስቡክ፣ ጂሜል እና ጎግል፣ ሊንክድኢን፣ አውትሉክ እና ማይክሮሶፍት፣ ፔይፓል፣ ስላክ፣ ትዊተር እና ያሁ ሜይል ላሉ በአብዛኛው ለተለመዱ አገልግሎቶች ማረጋገጫውን ለማስጀመር የአስራ ሁለት ቀናት ባለሁለት-ደረጃ-ማረጋገጫ መግለጫን መመልከት ይችላሉ፡፡ የማለፊያ ቃሎች ስርቆትን ተከትሎ የሚመጣ ችግርን በተሻለ ሁኔታ ለመከላከል ከፈለጉ ዝርዝሩን በሙሉ በማንበብ ለሚተማመኑባቸው መካነ ድሮች በሙሉ ሁለት-ደረጃ-ማረጋገጫን ያስጀምሩ፡፡"
