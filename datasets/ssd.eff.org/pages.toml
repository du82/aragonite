title = "ለዲጂታል ደህንነት የሚያስፈልጉ ሰባት ደረጃዎች  | Surveillance Self-Defense"
description = """
ስለ ዲጂታል ደህንነትዎ ሲያስቡ ከግምት ውስጥ ሊያስገቧቸው የሚገቡ አንዳንድ መሠረታዊ ምክሮች እንደሚከተለው ይቀርባሉ።

ዕውቀት ኃይል ነው

ያለ ጥሩ መረጃ ጥሩ የደህንነት ውሳኔ ላይ መድረስ አይቻልም። የደህንነትዎ መጠን ስለ ንብረትዎ፣ በንብረትዎ ላይ ጥቃት ስለሚሰነዝሩ አካላት እና ጥቃቱ ስለመከሰቱ ካለዎት የመረጃ መጠን ጋር እኩል ነው:: ይህ መመሪያ የኮምፒውተርዎ፣ የግንኙነት መስመርዎ ደህንነት፣ ደህንነትዎን..."""
full_description = "< መሰረታዊያን ለዲጂታል ደህንነት የሚያስፈልጉ ሰባት ደረጃዎች Last Reviewed: February 07, 2019 This page was translated from English. The English version may be more up-to-date. ስለ ዲጂታል ደህንነትዎ ሲያስቡ ከግምት ውስጥ ሊያስገቧቸው የሚገቡ አንዳንድ መሠረታዊ ምክሮች እንደሚከተለው ይቀርባሉ። ዕውቀት ኃይል ነው anchor link ያለ ጥሩ መረጃ ጥሩ የደህንነት ውሳኔ ላይ መድረስ አይቻልም። የደህንነትዎ መጠን ስለ ንብረትዎ፣ በንብረትዎ ላይ ጥቃት ስለሚሰነዝሩ አካላት እና ጥቃቱ ስለመከሰቱ ካለዎት የመረጃ መጠን ጋር እኩል ነው:: ይህ መመሪያ የኮምፒውተርዎ፣ የግንኙነት መስመርዎ ደህንነት፣ ደህንነትዎን ለመጠበቅ የሚወስዷቸው ውሳኔዎች የሚያስከትሉት ተጋላጭነትን ለመወሰን እና ስጋቶችን ለማወቅ የሚያስፈልጎትን ዕውቀት ለማግኘት ይረዳዎታል። እነዚህ ጥቂት እውቀት አላችሁ። እነዚህ መረጃዎች እርስዎ ያሉበት የደህንነት አውድ፣ ማን ጥቃት ሊሰነዝርብዎት እንደሚፈልግ እና ጥቃት ሰንዘሪዎቹ ያላቸው ሐብት ሊኾኑ ይችላሉ። አሁን እርስዎ ከሚያስቡት በላይ ኃይል እንዳለዎት ይገንዘቡ! ደካማው አገናኝ anchor link ንብረትዎ በጥቅም ላይ እንዳለና የአንድ ስርዓት አካል እንደኾነ ያስቡት። የንብረት ደህንነት በስርዓቱ ውስጥ ባሉ ሁሉም አካላት ጥንካሬ ላይ የተመሰረተ ነው። ”የአንድ ሰንሰለት የጥንካሬ እንደ ደካማው አገናኝ ቀለብት ጥንካሬ ልክ የተወሰነ ነው“ የሚለው ብሂል ለደህንነትም ይሠራል። የአንድ ስርዓት ጥንካሬ የሚለካው በደካማው የስርዓቱ አካል ልክ ነው። ለምሳሌ የመስኮት መቆለፊያዎ ርካሽ እና ደካማ ከኾነ እጅግ ምርጥ የበር ቁልፍ መጠቀም እርባና የለውም። ኢሜልዎት በዝውውር ወቅት እንዳይጠለፍ ቢያመሰጥሩት ነገር ግን ያልተመሰጠረውን ቅጂ በኮምፒውተርዎ ላይ ቢያስቀምጡ እና ኮምፒውተርዎ ቢሰረቅ ኢሜልዎን ማመስጠርዎ ለደህንነትዎ ጥቅም የለውም። ይህ ማለት ሁሉንም ነገር በተመሳሳይ ጊዜ ያደራጋሉ ማለት ላይኾን ይችላል። ነገር ግን ጊዜ ወስደው ስለ መረጃዎ እና የኮምፒውተር አጠቃቀምዎ ማሰብ ይኖርብዎታል ማለት ነው። ውስብስብ ያልኾነ ደህንነቱ የተጠበቀ እና ቀላል anchor link በአጠቃላይ በስርዓት ውስጥ እጅግ ደካማ የሚባለውን አካል መጠበቅ ወጪ ቆጣቢ እና አስፈላጊ ነው። በቀላል ስርዓት ውስጥ ደካማውን አካል ለማወቅ እና በቀላሉ ለመረዳት ይቻላል። በመኾኑም በኢንፎርሜሽን ስርዓትዎ ውስጥ ያሉ አካላትን ቁጥር እና ውስብስብነት ለመቀነስ ጥረት ማድረግ አስፈላጊ ነው። በመረጃ ስርዓት ውስጥ አነስተኛ ቁጥር ያላቸው አካላት መኖር የውስብስብነት፣ የወጪ እና የአደጋ ተቃላጭነት ምንጭ የኾነውን እና በስርዓቱ አካላት መካከል ያለውን መስተጋብር ይቀንሳል። ለዚህም ቀላሉ መፍትሄ አነስተኛ የቴክኒካዊ ድጋፍ ነው። ኮምፒውተር በርካታ ውስብስብ ጉዳዮችን ያቀልልናል። ይሁንና አንዳንድ ጊዜ ቀላል በኾነ በወረቀት እና እስክሪቢቶ የሚገለጽ የደህንነት ጉዳይ ውስብስብ የደህንነት ሥርዓትን ለማቀላጠፍ ያግዛል ። ዋጋው የተወደደ ሁሉ ደህንነቱ የጠበቀ ወይም አስተማማኝ ነው ማለት አይደለም anchor link እጅግ በጣም ውድ የኾኑ የደህንነት መፍትሄዎች ሁሉ ምርጥ ናቸው ብለው አያስቡ። ወረቀቶችን ከማስወገድዎ በፊት እንደ ቀዳዶ መጣል ያሉ እርምጃዎች ለደህንነትዎ ብለው የሚያወጡትን ወጪ በጣም ይቀንሳል። ሰውን ማመን ችግር የለውም ነገር ግን ሁሌም ማንን እንደሚያምኑ ይወቁ anchor link የኮምፒውተር ደህንነት ምክር ከራስዎ በስተቀር ማንንም እንዳያምኑ የሚያበረታታ ሊመስል ይችላል። በገሀዱ ዓለም ግን ከቅርብ ቤተሰብዎ እስከ ሃኪምዎ ወይም እስከ ጠበቃዎ ያሉ በአንዳንድ መረጃዎችዎ ላይ የሚያምኗቸው በርካታ ሰዎች አሉ። በዲጂታሉ ዓለም አስቸጋሪ የሚኾነው ማንን በየትኞቹ መረጃዎች እንደሚያምኑ ማወቅ ነው። የማለፊያ ቃልዎችዎን ዝርዝር ለጠበቃዎ ይሰጡ ይኾናል። ይሁንና ይህ ለጠበቃው ምን ዓይነት ኃይል እንደሚሰጠው ወይም ጠበቃዎ እንዴት በቀላሉ ሊጠቃ እንደሚችል ማሰብ ይኖርብዎታል። እንደ ድሮፕቦክስ ወይም ማይክሮሶፍት ዋንድራይቭ ያሉ የክላውድ አገልግሎቶች ላይ መረጃዎችን ሊያስቀምጡ ይችላሉ።፡ነገር ግን እነኚህ የክላውድ አገልግሎቶች መረጃዎቹን እንዲያገኙ እየፈቀዱላቸው እንደኾነ ይወቁ። ፍጹም የደህንነት ዋስትና የለም—ሁልጊዜም የሚያስከፍለው ዋጋ አለ anchor link የሕይወት ዘይቤዎን የሚመጥን እና ሊጋረጥብዎት ከሚችል አደጋ እና ለተግባራዊነቱ እርስዎ እና የስራ ባልደረባዎ በተግባር ላይ የሚያውሉት የደህንነት ፖሊሲ ይኑርዎት። በወረቀት ላይ ፍጹም የኾነ የደህንነት ፖሊሲ ነገር ግን በዕለት ተዕለት ሕይወትዎ ለመተግበር አዳጋች ከኾነ አይሠራም። ዛሬ ደህንነቱ የተጠበቀ ነገ ግን ያልተጠበቀ ሊኾን ይችላል anchor link የደህንነት ልምምድዎንን ቀጣይነት ባለው ኹኔታ ደጋግመው መገምገምዎ አስፈላጊ ነው። ያለፈው ዓመት ደህንነታቸው የተጠበቀ ነው ማለት ዛሬ ላይ ደህንነታው የተጠበቀ ነው ማለት አይደልም። የSSD ገጽን ስለምናዘምነው እና በዲጂታል ደህንነት ዙሪያ የተከሰቱ ለውጦችን በኛ መረዳት መሠረት ስለምናካትታቸው ሁሌም ድረ ገጹን ይጎብኙ። ደህንነት የአንድ ጀምበር ተግባር ሳይኾን ሂደት ነው።"
