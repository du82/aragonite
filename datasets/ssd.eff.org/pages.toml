ትዮጵያ መንግስት ቢኾን በአሜሪካ የሚገኝ ኩባንያ በኢትዮጵያ ፍርድ ቤት ትእዛዝ ላይገዛ ይችላል። በአሜሪካ ሕግ ግን ይገዛል። ፈጣሪው የመንግሥትን ተፅዕኖ መቋቋም ቢችል እንኳ ጥቃት ሰንዛሪው የመሣሪያ አምራቾች ስርዓትን ሰብሮ በመግባት የአምራቹ ደምበኞች ላይ ጥቃት ሊሰነዝር ይችላል። እጅግ ጠንካራ መሣሪያ የሚባሉት እንዲህ ዓይነቱን ጥቃት ለመከላከል ታቅደው የተሰሩ ሲኾኑ ነው። ፈጣሪው ውሂብዎን አላገኝም ብሎ ቃል ከሚገባ ይልቅ ፈጣሪው የግል ውሂብዎን ማግኘት አይችልም ብሎ የሚያረጋገጥልዎት ቋንቋን ይፈልጉ። የግል ውሂብን በተመለከተ የፍርድ ቤት ትእዛዝን በመታገል ጥሩ ዝና ያላቸው ተቋማትን ይፈልጉ። ከገበያ እንዲመለሱ ተጠርተዋልን ወይም መስመር ላይ ተተችተዋል? anchor link ምርቶቻቸውን የሚሸጡ ኩባንያዎች እና እጅግ ዘመናዊ የኾኑ ሶፍትዌሮቻቸውን የሚያስተዋውቁ አስተዋዋቂዎች ሊሳሳቱ፣ ሰዎችን ሊያሳስቱ፣ ወይም አንዳንዴ ሊዋሹ ይችላሉ። በመጀመሪያ እጅግ ጠንካራ ደኅንነት እንዳለው የተነገረለት ምርት እጅግ ከባድ እንከን እንዳለበት ሊታይ ይችላል። በመኾኑም በሚጠቀሟቸው መሣሪያዎች ዙሪያ የሚወጡ ዜናዎችን በመከታተል ራስዎን ያዘምኑ። ለአንድ ሰው በአንድ መሣሪያ ዙሪያ ዜናዎችን መከታተል ሊከብድ ይችላል። በመኾኑም ተመሳሳይ ምርት እና አገልግሎቶችን የሚጠቀም የሞያ አጋር ጋር በመነጋገር ምን እየተካሄደ እንደኾነ በመስማት ከጊዜው ጋር አብረው ይሂዱ። መግዛት ያለብኝ የትኛውን ስልክ ነው? የትኛውንስ ኮምፒውተር? anchor link ለዲጂታል ደኅንነት አሰልጣኞች በብዛት ተደጋግሞ የሚጠየቅ ዋና ጥያቄ “መግዛት ያለብኝ የአንድሮይድ ስልክ ነው ወይስ አይፎን?” ወይም “መጠቀም ያለብኝ ማክ ነው ወይም ፒሲ?” ወይስ “የትኛውን ስርዓተ ክወና ልጠቀም?”። ለእነዚህ ጥያቄዎች ቀላል መልስ የለም። አንጻራዊ የሶፍትዌሮች እና የመሣሪያዎች ደኅንነት አዳዲስ እንከኖች በተገኙ እና አሮጌ ህጸጾች በተስተካከሉ ቁጥር ሁልግዜም ይቀያየራል። ኩባንያዎች ለእርስዎ የተሻለ የደኅንነት አገልግሎት ለማቅረብ እርስ በእርስ ይወዳደራሉ ወይም ደኅንነታቸውን ሊያዳክም በሚችል የመንግስት ተፅዕኖ ውስጥ ሊኾኑ ይችላሉ። አንዳንድ አጠቃላይ ምክሮች ሁልጊዜም ትክክል ናቸው። አንድ መሣሪያ ወይም ስርዓተ ክወና ሲገዙ ሶፍትዌሮቻቸው የዘመኑ መኾናቸውን ያረጋግጡ። አብዛኛውን ጊዜ ቆየት ያለ ኮድን በመጠቀም በአጥቂዎች ሊሰነዘሩ የሚችሉ የደኅንነት ችግሮችን ሶፍትዌሮችን በማዘመን ሊፈቱ ይችላሉ። አንዳንድ ያረጁ ስልኮች እና ስርዓተ ክወናዎች የደኅንነት ዝመናዎች እንደማይሰራላቸው ይገንዘቡ፡፡በተለይ የማይክሮሶፍት ኩባንያ በዊንዶውስ ቪስታ፣ ኤክስፒ እና ቀድመው በነበሩ የዊንዶውስ ሥሪቶች እጅግ ከባድ ለኾኑ የደኅንነት ችግሮች እንኳ ምንም ዓይነት ማስተካከያዎች እንደማይቀበል ግልጽ አድርጓል። ይህም ማለት እነዚህን የሚጠቀሙ ከሆነ አምራቹ ከአጥቂዎች እንዲጠብቅዎት ተስፋ አያድርጉ ማለት ነው፡፡ ይህ ሥሪታቸው 10.11 በፊት ላሉ ኦኤስ ኤክስ ወይም ኢአይ ካፒቴን መሣሪያዎችም እውነት ነው)። አሁን እርስዎን የሚያጋጥሞትን ስጋቶች ተገንዝበዋል፡፡ እናም በዲጂታል የደኅንነት መሳሪያ ውስጥ ምን መፈለግ እንዳለበት ያውቃሉ፡፡ ለእርስዎ ልዩ ሁኔታ ይበልጥ ተገቢ የሆኑትን መሣሪያዎች በራስ መተማመን ይችላሉ፡፡. በሰርቪሊያንስ ሰልፍ ዲፌንስ ስማቸው የተጠቀሱ ምርቶች anchor link በኤስኤስዲ ስማቸው የሚጠቀስ የሶፍትዌሮች እና ሀርድዌሮች ከላይ ለተጠቀሱት መስፈርቶች ተገዢ መሆናቸውን ለማረጋገጥ እንሞክራለን፡፡ የምንዘረዝራቸው ምርቶች ከዚህ በታች የተዘረዘሩትን የሚያሟሉት ብቻ እንዲሆኑ በቀና መንፈስ እንጥራለን፡፡ ስለ ወቅቱ የዲጂታል ደኅንነት ጠንካራ መሬት የረገጠ መሰረት ያላቸውን፣ በአጠቃላይ ስለአሠራራቸው ግልጽ የሆኑ(ስለ ድክመታቸውም)፣ ፈጣሪዎቻቸው ራሳቸው ሊመዘብሯቸው የሚችሉበትን እድል የሚቃወም መከላከያ ያላቸው እና በርካታ እና ቴክኔካዊ እውቀት ያለው ተጠቃሚ ይዘው በአሁን ግዜ ጥቅም ላይ ያሉ፡፡ እኛ ይህንን ጽሑፍ በምንዘጋጅበት ወቅት ያለባቸውን ክፍተት የሚመረምር እና በፍጥነት ስጋቱን ለህዝብ ይፋ የሚገልጽ ብዙ ተመልካች እንዳላቸው እናምናለን፡፡ እባክዎ ስለ ደኅንነታቸውን ለመመርመር ወይም በነጻነት ለማረጋገጥ የሚያስችል ሃብት እንደሌለን ይረዱ፡፡ እነዚህን ምርቶች አናጸድቅምም ሙሉ የደኅንነት ዋስትናም አንሰጥም፡፡'
