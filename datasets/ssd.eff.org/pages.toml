title = "ማመስጠር ምንድን ነው? | Surveillance Self-Defense"
description = """
ማመስጠር የኮዶች፣ የምስጢራዊ ቃላት እና መልዕክቶች ቀመራዊ ሳይንስ ነው። በረዥሙ የሰው ልጅ ታሪክ ሰዎች መልዕክታቸው ከታሰበለት ተቀባይ ሰው ውጪ በማንም እንዳይነበብ በማሰብ ምስጠራን ተጠቅመው መልእክት ተላልከዋል።

በአሁኑ ጊዜ ምስጠራን ተግባራዊ ለማድረግ አቅም ያላቸው ኮምፒውተሮች አሉ። የዲጂታል ማመስጠሪያ ቴክኖሎጂ ከቀላል ሚስጥራዊ መልዕክቶች ባሻገር ሰፋ ላሉ ዓላማዎች ለምሳሌ የአንድ መልዕክት ጸሐፊን ማንነት..."""
full_description = '< መሰረታዊያን ማመስጠር ምንድን ነው? Last Reviewed: April 22, 2015 This page was translated from English. The English version may be more up-to-date. ማመስጠር የኮዶች፣ የምስጢራዊ ቃላት እና መልዕክቶች ቀመራዊ ሳይንስ ነው። በረዥሙ የሰው ልጅ ታሪክ ሰዎች መልዕክታቸው ከታሰበለት ተቀባይ ሰው ውጪ በማንም እንዳይነበብ በማሰብ ምስጠራን ተጠቅመው መልእክት ተላልከዋል። በአሁኑ ጊዜ ምስጠራን ተግባራዊ ለማድረግ አቅም ያላቸው ኮምፒውተሮች አሉ። የዲጂታል ማመስጠሪያ ቴክኖሎጂ ከቀላል ሚስጥራዊ መልዕክቶች ባሻገር ሰፋ ላሉ ዓላማዎች ለምሳሌ የአንድ መልዕክት ጸሐፊን ማንነት ለማረጋገጥ ወይም ድርን በቶር ብራውዘር በሚስጥር ማሰስ እስከማስቻል ደርሰዋል። በአንዳንድ ኹኔታዎች ምስጠራ ቀላል እና ቀጥተኛ ሊኾን ይችላል። ነገር ግን ምስጠራ ወደ ስህተት ሊያመራ የሚችልበት አጋጣሚዎች ይኖራሉ። በመኾኑም የበለጠ በተረዱት መጠን በእንደዚህ ዓይነት ኹኔታዎች ውስጥ ደህንነትዎ የተረጋገጠ ይኾናል። በምስጠራ ጊዜ ሊረዱት የሚገባ ሦስት ሃሳቦች anchor link የግል እና የአደባባይ ቁልፎች anchor link በምስጠራ ጊዜ ሊረዷቸው ከሚገቡ በጣም ጠቃሚ ሃሳቦች መካከል አንዱ ቁልፍ ነው። የተለመዱት የምስጠራ ዓይነቶች በኮምፒውተርዎ ላይ በምስጢር የሚያስቀምጡት እና ለእርስዎ ታስበው የተላኩ መልዕክቶችን ማንበብ እንዲችሉ የሚያደርግዎትን የግል ቁልፍን ይይዛሉ። በተጨማሪም የግል ቁልፍ ለሌሎች ሰዎች በሚልኳቸው መልእክቶች ላይ የማይረሱ የዲጂታል ፊርማን እንዲያስቀምጡ ያግዙዎታል። በሌላ በኩል ደግሞ የአደባባይ ቁልፍ ተጓዳኞችዎ ከእርሶ ጋር በድብቅ ግንኙነት እንዲያደርጉ ለሌሎች የሚያስተላልፉት ወይም የሚያትሙት ሰነድ ሲኾን ከእርስዎ የኾኑ ፊርማዎችንም ያጣራል። የግል እና የአደባባይ ቁልፎች ልክ ለሁለት እኩል እንደተከፈለ አለት ጥንድ ኾነው የሚመጡ ቢኾኑም ተመሳሳይ ግን አይደሉም። የደህንነት ምስክር ወረቀቶች anchor link ሌላው በምስጠራ ጊዜ ሊረዱት የሚገባ እጅግ በጣም ጠቃሚ ሃሳብ የደህንነት ምስክር ወረቀት የሚባለው ነው። በኮምፒውተርዎ ላይ ያለ የድር መዳሰሻ HTTPSን በመጠቀም ሚስጥራዊ ግንኙነትን ከድረ ገጾች ጋር ማድረግ ይችላል። ይህንን ሲያደርጉ የአደባባይ ቁልፎቹ የዶሜን ስም (ልክ www.google.com፣ www.amazon.com፣ ወይም ssd.eff.org) ለማጣራት የምስክር ወረቀቶቹን ይመረምራሉ። የምስክር ወረቀቶች ከእነርሱ ጋር ደህንነቱ የተጠበቀ ግንኙነት እንዲያደርጉ የአንድን ሰው ወይም ድረ ገጽ ትክክለኛ የአደባባይ ቁልፍን ያውቁ እንደኾን የሚያረገግጡበት አንዱ መንገድ ነው። ከጊዜ ወደ ጊዜ ከምስክር ወረቀት ጋር የተያያዙ የስህተት መልዕክቶችን በድር ላይ ያያሉ። አብዛኛውን ጊዜ ይህ የሚኾንበት ምክንያት የሆቴል ወይም የካፌ ኔትወርክ ከድረ ገጹ ጋር የሚያደርጉትን የሚስጥር ግንኙነት ለመስበር ስለሚሞክር ነው። በተጨማሪም በቢሮክራሲያዊ የምስክር ወረቀት ስርዓት ስህተት ምክንያት የስህተት መልዕክት ማየት የተለመደ ነው። ነገር ግን አንዳንድ ጊዜ ይህ የሚኾንበት ምክንያት የተመሰጠረውን ግንኙነት መዝባሪዎች፣ ሌቦች፣ ፖሊስ፣ ወይም የመንግስት ሰላዮች ለመስበር በሚሞክሩበት ወቅት ነው። ያለ መታደል ኾኖ በእነዚህ መካከል ያለውን ልዩነት ለመለየት በጣም አስቸጋሪ ነው። ይህ ማለት መለያ ካለዎት ድረ ገጽ ጋር የሚገናኝ ከኾነ ወይም ማንኛውንም ዓይነት ስሱ መረጃን እያነበቡ ከኾነ የምስክር ወረቀት ማስጠንቀቂያን በምንም ዓይነት ኹኔታ ማለፍ የለብዎትም።