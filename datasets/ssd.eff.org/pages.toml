["https://ssd.eff.org/module/how-to-use-signal"]
title = "How to: Use Signal | Surveillance Self-Defense"
description = """
Download location: Google Play Store, Apple App Store
System requirements: Android 5 or later, iOS 13 or later
Version used in this guide: Android: 7.0. iPhone: 7.0
License: GPLv3
Level: Beginner
Time required: 15-20 minutes
Other reading:


\thttps://signal.org/
\thttps://support.signal.org/
\thttps://signal.org/blog/


Table of Contents


\tDownload and Install Signal
\tRegister and Verify..."""
full_description = '''< Tool Guides How to: Use Signal Last Reviewed: March 06, 2024 Download location: Google Play Store, Apple App Store System requirements: Android 5 or later, iOS 13 or later Version used in this guide: Android: 7.0. iPhone: 7.0 License: GPLv3 Level: Beginner Time required: 15-20 minutes Other reading: https://signal.org/ https://support.signal.org/ https://signal.org/blog/ Table of Contents Download and Install Signal Register and Verify Your Phone Number Using Signal Start a New Message Verify Safety Numbers Manage Your Group Chat Preferences Additional Security Settings Registration Lock Set or Change Your Username Hide Your Phone Number Disappearing Messages Change Your Phone Number Control Who Can (and Can't) See Stories Enable Screen Lock and Hide Screen in App Switcher Disable Sending Link Previews Manage Keyboard Data Use a Proxy (If You Need to) Hide You IP Address from Another Caller Signal is a free and open-source application for Android, iOS, and desktop that employs end-to-end encryption to keep communications safe. Signal has certified to courts that it only maintains two types of user data available to law enforcement: timestamps of when each account was created and the date that each account last connected to the Signal service. As with most chat apps, communications can be made between either individuals or a group, allowing you to send end-to-end encrypted text, picture, audio and video messages, as well as live video and audio calls. Everyone must have the Signal app installed to communicate with each other. Encrypted calls and messages use your data connection, so both parties in the conversation must have internet access on their mobile devices. Due to this, you will not incur SMS and MMS fees when using Signal. Download and Install Signal anchor link Search for "Signal" in the Google Play Store or Apple App Store, or click the links below: On Android: Download the app from the Google Play Store here. On iPhone: Download the app from the Apple App Store here. After Signal has finished installing, launch the app. Register and Verify your Phone Number anchor link After an introductory screen with information about the Terms and Privacy Policy, you will see a dialogue explaining why Signal requests the “Contacts” permission on your phone. Signal can check your contacts list to see who is using Signal. To do this, Signal uses a private contact discovery system. The data uploaded to Signal is immediately deleted after your contacts are matched up. If sharing your contacts with Signal is a concern, you can deny the contacts permission. If you don’t allow this permission, you can still use Signal, but you have to manually enter phone numbers to begin chatting with people. You can change this in the future, but for now, choose to allow or deny access: On Android: Tap "Not now" to deny access or "Continue" to grant access to your contacts. On iPhone: Tap "Don't Allow" to deny access or "OK" to grant access to your contacts. Signal requires a working phone number to set up. While Signal doesn't use SMS, your phone number is used to verify who you are and limit you to one account. By default, your phone number is not visible in your Signal profile unless someone already has that number in their address book. If you do not want to use your primary phone number, Freedom of the Press Foundation has tips for getting a secondary number. You can also optionally create a username to share with others instead of your phone number. We'll get into setting this up below. On Android: Enter your phone number and tap "Continue," then tap "OK" when asked to confirm that your number is correct. On iPhone: Enter your phone number and tap "Next," then "Yes" when asked to confirm that your number is correct. In order to verify your phone number, you will be sent an SMS text with a six-digit code. Enter that number in. Next up is creating a profile and a PIN. The profile image and name you choose will be shown to any contacts you have saved in your address book, when you initiate or accept new chats, and when you join new groups. While a first name (either genuine or made up) is required, the image and last name are optional. A PIN keeps your information safe on Signal’s servers, and if you switch phones you will be able to recover your settings, profile, and contacts using it. The onboarding process is in a different order on Android than it is on iPhone: On Android: Enter your profile information in this step and tap “Next.” On the next screen, you're asked to create a PIN. Choose a secure PIN or Passphrase and then tap “Next.” You'll need to confirm the PIN one more time. On iPhone: The first step is to create your PIN. Choose a secure PIN or Passphrase and then tap “Next.” You'll need to confirm the PIN one more time. Next, enter your profile information, and then tap "Next." You will next see a prompt asking for access to your local network. This is to help transfer an account from an old phone to a new one. You can tap "Don't Allow" if you do need to move an account over. On both Android and iPhone, you also have the option on this screen to limit who can find you by your number. By default, this is set to "Everybody," meaning that anyone who has your phone number in their phone's address book will automatically find you on Signal. If you don't want it to work like this, tap "Who can find me by my number?" and change the setting to "Nobody." Unless you also set up a username, nobody will be able to initiate a chat with you if you set this to "Nobody." Once a username is set up, people will only be able to start a chat with you if they have your username. With that, you're set up and ready to dive into communicating over Signal. Using Signal anchor link In order to use Signal, the person you are contacting must have Signal installed. But otherwise, using Signal works essentially the same as other chat and phone apps you've used. Alongside text, you can send stickers, photos, voice memos, GIFs, files, and more. All of these are also end-to-end encrypted. Start a New Message anchor link To start a message: On Android: From the chat tab, tap the pen icon in the bottom-right corner. On iPhone: From the chat tab, tap the pen icon in the top-right corner. If you previously allowed Signal access to your contacts, you will see a list of all the registered Signal users in your contacts. Pick the person you want to message, or type in a phone number. From this screen, you can start chatting, or initiate a phone (or video) call. If you're using Signal on Android, you can initiate calls from the call tab, as well. Verify Safety Numbers anchor link Once you've started a message thread, you can consider verifying the authenticity of the person you are talking with to make sure their encryption key wasn't tampered with (a process called key verification ). This may not be necessary for everyone you communicate with, but can be useful in cases where you're talking about private information. The process works the same on both Android and iPhone: Open the chat screen with the contact you want to verify, and then tap the name of your contact at the top of the screen. Tap “View safety number.” You will see a string of 60 numbers and a QR code. Match the color cards with the person you're verifying with, and then you can either verify by manually reading off these numbers to make sure they correspond with your contact's numbers, or if you're in the same location, you can scan the QR code that appears on this screen. If needed, you can also copy the numbers and share it over a secondary secure channel. Once verified, tap the "Mark as verified" button. Manage Your Group Chat Preferences anchor link Alongside one-on-one chats, Signal also supports group chats and group video calls. Both of these are end-to-end encrypted. Creating a new group works the same on both Android and iOS: From the "Chats" tab, tap the pen icon, then "New Group." Tap the names of your contacts you'd like to add to the group. On the next screen, you're asked to create a name for your group, select a duration of time for disappearing messages (more on these below), and then tap "Create." As long as you added at least one person to the group chat, you'll go to the main chat screen. If you don't add anyone into the group right away, you may see a screen with two options: Approve new members: Enable this if you want the ability to approve or deny new members. Enable and share link: Tap this if you want the ability to share a link to the group chat with people. This way, new members can join from the link instead of being added manually by an administrator. If you do not want this feature enabled, tap "Cancel." If you click cancel, administrators of the group chat are the only people who can add new members. You can do so by tapping the group chat name, then "Add Members." If you enable the share link and change your mind, you can always delete the link, or reset it. This is helpful if the link was shared by someone you don't want in the group. Tap the group chat name, then "Group Link" to change these settings. You can also set the permissions of the group chat to restrict people from renaming the group or adding new members. Tap the group chat name, then "Permissions" and change the settings however you prefer. Additional Security Settings anchor link Signal's default setup is relatively secure, but there are a few things to consider changing, and some features you may want to tinker with. Registration Lock anchor link Enabling "Registration Lock" prevents your phone number from being registered on a different device without the PIN you set up when you first installed Signal. Make sure you write this PIN down, because without it, you will not be able to get back into your Signal account for at least seven days if you change phones. On Android: Tap the Three-dot icon (⋮) > Settings > Account. Toggle "Registration Lock" to on. On iPhone: Tap your profile picture, then Settings > Account. Toggle "Registration Lock" to on. Signal will occasionally ask you to verify your PIN to help you remember it. Set or Change Your Username anchor link Despite the name, Signal's usernames don't work like you may be used to on social media accounts, nor do they work exactly like a phone number. Think of your username more like a "discovery handle." It's a way for people to easily find you, and you can change it as often as you like. By default, after you set up a username, anyone you chat with will not be able to see your phone number unless they already have your number in their phone's address book. To set up or change your Signal username (this works the same on both Android and iPhone): Tap your [profile picture in the top left] > [box with your name at the top of the screen] > @ username. Here, you can set up or change your username to whatever you want, as long as someone else doesn't have that same name. You will always have to have at least two numbers at the end of your username. For example, your username cannot be SSD, it would have to be SSD.01. You can change your username anytime you want without losing the chats and contacts you have already started, but if someone only has your old username and tries to contact you, they will not find you. Note that if someone who you've blocked changes their username, they will continue to be blocked. When you want to share your username with someone, you can tap [profile picture in the top left] > [box with your name at the top of the screen] > QR Code or Link to share a link or a QR code. Hide Your Phone Number anchor link You can change who can search for you by your phone number and who can see your phone number. "Who Can See My Number," controls whether or not your phone number is visible to people (or groups) you message. For example, if set to "Everybody," when you're in a chat with someone, even if you previously only exchanged usernames, they can see your phone number. This is set to "Nobody" by default. "Who Can Find Me By Number," controls whether someone can type your phone number into the search bar to find you, or pull up your phone number through their address book. This is set to "Everybody" by default. If you set it to "Nobody," it makes it so even people who do have your number in their address book will not be able to easily find you on Signal. You will instead have to share your Signal username with them. To change this setting: On Android: Tap the Three-dot icon (⋮) > Settings > Privacy > Phone Number and you can change who can see your number, and who can find you by your number. On iPhone: Tap your profile picture, then Settings > Privacy > Phone Number and you can change who can see your number, and who can find you by your number. Disappearing Messages anchor link Signal has a feature called "disappearing messages" which ensures that messages will be removed from your device and the device of your contact(s) in a chat a chosen amount of time after the messages are seen (the countdown starts when the recipient opens the message, not after you send it). While it's a handy feature, remember that those you are chatting with can log or take screenshots of your conversation, even if you’ve enabled disappearing messages. You can set up a default time period for disappearing messages for every new chat you create: On Android: Tap the Three-dot icon (⋮) > Settings > Privacy > Disappearing messages and choose the time period you want. Tap "Save" when you're done. On iPhone: Tap your profile picture, then Settings > Privacy > Disappearing messages and choose the time period you want. Tap "Set" when you're done. You can also change the length of time before a message disappears in each of your chats. The process is the same on both Android and iPhone: Open up the chat, then tap the contact's name or the chat name > Disappearing Messages. Select the length of time you'd like. You can do this in both one-on-one chats and in group chats. Disappearing messages rules apply to any sort of communication you do in a chat, including text, files, photos, location, GIFs and whatever else. But when you delete a reply to a message, the behavior can be a little different than you may expect. You can also set a photo or video so the recipient can only view it one time. In a chat, select a photo or video you want to send. Tap the infinity icon above the text box to switch it to the view once mode. The symbol should now be a "1" and the text box will read "View Once Media." Now, when you send the photo or video, the recipient can only view that content one time, but keep in mind they can still take a screenshot of it. Change Your Phone Number anchor link Since Signal treats your phone number like a username, you may need to change it if you get a new number, or if you decide that you want to get a secondary number for communication. You can change your number easily: On Android: Tap the Three-dot icon (⋮) > Settings > Account > Change Phone N'''
