full_description = '< የመሣሪያ መመሪያዎች ራስን ከማስገር ጥቃቶች ስለመከላከል Last Reviewed: November 26, 2018 This page was translated from English. The English version may be more up-to-date. የዲጂታል ደኅንነትዎን ለማሻሻል ጥረት በሚያደርጉበት ወቅት የደኅንነት ግብዎን ለማስካት የሚያደርጉትን ጥረት መና የሚያስቀሩ ዕኩይ አካላት ሊያጋጥምዎ ይችላል፡፡ እነዚህን ዕኩይ አካላት ጠላት ወይም አጥቂዎች ብለን እንጠራቸዋለን፡፡ ይህ ተንኮል አዘል ተግባር ደግሞ ማስገር ተብሎ ይጠራል፡፡ አብዛኛውን ጊዜ የማስገር ጥቃት እርስዎን በሚያሳምን መልዕክት መልክ ነው የሚመጣው: አገናኝ ጠቅ ያድርጉ፣ ሰንድ ይክፈቱ፣ በማሳሪያዎ ላይ ሶፍትዌር ይጫኑ፣ ወይም ትክክለኛ በሚመስል መካነ ድር የተጠቃሚ ስምዎን እና የይለፍ ቃልዎን ያስገቡ፡፡ የማስገር ጥቃቶች አታለው የይለፍ ቃልዎን አሳልፈው እንዲሰጡ ወይም በመሣሪያዎ ላይ ሸረኛ ሶፍትዌር እንዲጭኑ ሊያደርግዎት ይችላል፡፡ አጥቂዎች ሸረኛ ሶፍትዌር ተጠቅመው መሣሪያዎን ከርቀት ሊቆጣጠሩ፣ መረጃ ሊሰርቁ ወይም እርስዎን ሊሰልሉ ይችላሉ፡፡ ይህ መመሪያ የማስገር ጥቃቶችን እንዲለዩ እና እነርሱን ሲመለከቱ ራስዎን መከላከል የሚያስችሎት አንዳንድ ተግባራዊ መንገዶችን በመጠቆም ይረዳዎታል፡፡ የማስገር ጥቃት አይነቶች anchor link የይለፍ ቃል ማስገር (aka Credential Harvesting) anchor link አስጋሪዎች አታላይ የሆነ አገናኝ በመላክ የይለፍ ቃልዎን እንዲሰጧቸው ሊያታልልዎ ይችላሉ፡፡ በአንድ መልዕክት ውስጥ ያሉ የመካነ ድር አድራሻዎች አንድ መዳረሻ ብቻ ያላቸው መስለው ሊታዩ ይችላሉ፤ ነገር ግን ወደ ሌላ ይሸጋገራሉ፡፡ በኮምፒተርዎ በአገናኙ ላይ በማንዣበብ የዩአርኤሉን መዳረሻ ማየት ይችላሉ፡፡ ነገር ግን አገናኞች ተመሳሳይ ስሞችን በመጠቀም የበለጠ አሳሳች ሊሆኑ ይቻላሉ፤ ወይም ከትክክለኛው መዳረሻ አንድ ቃል ብቻ ሊቀይሩ ይችላሉ፡፡ አንዳንዴም የሚጠቀሟቸው እንደጂሜይል እና ድሮፕቦክስ ያሉ አገልግሎትች ጋር ተመሳሰለው ሊቀርቡ ይችላሉ፡፡ እነዚህ የውሸት ተመሳስለው የተሰሩ መግቢያዎች አብዛኛው ጊዜ ትክክለኛውን ስለሚመስሉ እርስም የተጠቃሚ ስም እና የይለፍ ቃል ለማስገባት ይሳባሉ፡፡ ባለማወቅ ካስገቡ የመለያ መግቢያ መረጃዎችዎን ለአጥቂዎች ይልካሉ፡፡ ስለዚህ ማንኛውንም የይለፍ ቃላትን ከመተየብዎ በፊት የድር አሳሽዎ የአድራሻ ማስፈሪያን ይመልከቱ፡፡ የገፁን ትክክለኛ የጎራ ስም ያሳያል፡፡ ወደ መካነ ድሩ ውስጥ ከገቡ በኋላ እርስዎ ሲጠቀሙበት ከነበረው መካን ጋር የማይመሳሰል ከሆነ፣ አይቀጥሉ! ያስታውሱ በገጹ ላይ ያለው የድርጅት ሎጎ ትክክለኛ መሆኑን አያረጋግጥም፡፡ ማንኛውም ሰው ሎጎውን አርታዖት ሊሰራው ወይም ከራሳቸውን ገፅ ላይ ገልብጦ ለማታለል ሊሞክር ይችላል፡፡ አንዳንድ አስጋሪዎች እርስዎን ለማታለል ታዋቂ የድር አድራሻዎችን የሚመስል መካነ ድር ይጠቀማሉ: ht﻿tps://wwwpaypal.com/ ከ https://www.paypal.com/የተለየ ነው፡፡ በተመሳሳይ ht﻿tps://www.﻿pa﻿ypaI.com/ ((በአቢይ ሆሄ "L" ፋንታ የ"i" ንዑስ ሆሄ መጠቀም) ከ https://www.paypal.com/የተለየ ነው፡፡ ብዙ ሰዎች ረጅም ዩአርኤሎችን ለማንበብ ወይም ለመፃፍ ቀላል ለማድረግ የዩአርኤል ማሳጠሪያን ይጠቀማሉ፡፡ ይህ ግን የተንኮል ማዳረሻዎችን ለመከልል አስጋሪዎች ሊጠቀሙበት ይችላሉ፡፡ t.co ያላቸው ከትዊተር የሚመጡ አጭር ዩአርኤል ከተቀበሉ በትክክል ወደየት እንደሚሄድ ለማወቅ https://www.ch