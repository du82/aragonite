description = "በኢንተርኔት ላይ ከምንጠቀማቸው እጅግ በጣም ዝነኛ ከሆኑ መካነ ድሮች መካከል የማኀበራዊ ሚዲያዎች ይገኙበታል። ፌስቡክ ከቢሊዮን በላይ፣ ኢንስታግራም እና ትዊተር እያንዳንዳቸው በመቶ ሚሊዮኖች የሚቆጠሩ ተጠቃሚዎች አሏቸው። ማኀበራዊ ሚዲያዎች የተገነቡት የተለያዩ ሃሳቦችን፣ ፎቶግራፎችን እና የግል መረጃን ለማጋራት ነው። አሁን የመናገሪያ እና የመደራጃ መድረክ ሁነዋል፡፡ እነዚህ እንቅስቃሴዎች ሁሉ በግለኝነት እና በስም-አልባነት ላይ የተመረኮዙ..."
full_description = '< ተጨማሪ መማሪያ በማኀበራዊ ሚዲያዎች ላይ ራስዎን መጠበቅ Last Reviewed: October 30, 2018 This page was translated from English. The English version may be more up-to-date. በኢንተርኔት ላይ ከምንጠቀማቸው እጅግ በጣም ዝነኛ ከሆኑ መካነ ድሮች መካከል የማኀበራዊ ሚዲያዎች ይገኙበታል። ፌስቡክ ከቢሊዮን በላይ፣ ኢንስታግራም እና ትዊተር እያንዳንዳቸው በመቶ ሚሊዮኖች የሚቆጠሩ ተጠቃሚዎች አሏቸው። ማኀበራዊ ሚዲያዎች የተገነቡት የተለያዩ ሃሳቦችን፣ ፎቶግራፎችን እና የግል መረጃን ለማጋራት ነው። አሁን የመናገሪያ እና የመደራጃ መድረክ ሁነዋል፡፡ እነዚህ እንቅስቃሴዎች ሁሉ በግለኝነት እና በስም-አልባነት ላይ የተመረኮዙ ናቸው፡፡ በመሆኑም ማህበራዊ ሚዲያን በሚጠቀሙበት ወቅት የሚከተሉትን ጥያቄዎች ከግምት ውስጥ ማስገባት ጠቃሚ ነው። እራሴን እየተከላከልኩኝ በእነዚህ የማህበራዊ መካነ ድሮች መልዕክት እንዴት መለዋወጥ እችላለሁ? መሠረታዊ ደኅንነቴ ምን ይመስላል? ማንነቴስ? እውቂያዎቼ እና ግንኙነቶቼስ? የትኛውን መረጃ በግል መያዝ ይጠበቅብኛል እና ከማንስ መደበቅ ይኖርብኛል? >ያሉበትን ሁኔታ መሰረት በማድረግ ከማኀበራዊ ሚዲያ መካነ ድሮች፣ ከሌሎች የመካነ ድሩ ተጠቃሚዎች፣ ወይም ከሁለቱም እራስዎን መከላከል ይኖርብዎታል። የማኀበራዊ ሚዲያ መለያዎን ሲከፍቱ በህሊናዎ ማኖር ያለብዎ ጠቃሚ ምክሮች anchor link እውነተኛ ስምዎን መጠቀም ይፈልጋሉን? አንዳንድ የማህበራዊ ሚዲያ መካነ ድሮች ሰዎች እውነተኛ ስማቸውን እንዲጠቀሙ የሚያስገድድ “የእውነተኛ ስም አጠቃቀም ፖሊሲ” አላቸው። ነገር ግን ይህ ፖሊሲያቸው በጊዜ ሂደት እየላላ መጥቷል። በማህበራዊ ሚዲያ መካነ ድር በሚመዘገቡበት ወቅት እውነተኛ ስምዎን መጠቀም ካልፈለጉ አይጠቀሙ። በሚመዘገቡበት ወቅት ከሚያስፈልገው በላይ መረጃ አይስጡ፡፡ ማንነትዎን መደበቅ የሚፈልጉ ከሆነ የተለየ የኢሜይል አድራሻ ይጠቀሙ። ስልክ ቁጥርዎን ይጠቀሙ። ስልክ ቁጥርዎን ከመስጠት ይከልከሉ፡፡ እነዚህ ሁለት መረጃዎች የእርስዎን ማንነት በተናጠል ለመለየት እና ከተለያዩ መለያዎች ጋር ሊገናኙ ይችላሉ፡፡ የመገለጫ ፎቶ ወይም ምስል በመምረጥ ረገድ ጥንቃቄ ይውሰዱ፡፡ ፎቶው ከተነሳበት ቦታ፣ ቀን እና ሰዓት ከሚያሳየው መረጃ በተጨማሪ ምስሉ ራሱ አንዳንድ መረጃዎችን ሊያቀርብ ይችላል፡፡ አንድ ፎቶ ከመምረጥዎ በፊት የሚከተለውን ይጠይቁ፣በቤትዎ ወይም በስራ ቦታዎ አከባቢ የተነሳ ነው? በፎቶው ላይ አድራሻዎች ወይም የጎዳና ምልክቶች ይታያሉ? ያስተውሉ በሚመዘገቡበት ወቅት የአይ ፒ አድራሻዎ ተጨምሮ ሊመዘገብ እንደሚችል ይወቁ፡፡ ጠንካራ የይለፍ ቃል ይምረጡ፤ ከተቻለም ባለሁለት-ደረጃ ማረጋገጫመጠቀም ይጀምሩ፡፡ ያስተውሉ! የይለፍ ቃልዎን መልሰው ለማግኘት የሚጠቀሟቸው እንደ “የት ከተማ ነው የተወለዱት?” ወይም “የመጀመሪያ የቤት እንስሳዎ ስም ማን ይባላል?” የመሳሰሉ የይለፍ ቃል የምስጢር ጥያቄዎች ሲጠቀሙ ጥንቃቄ ያድርጉ፡፡ ምክንያቱም መልሱ ማኀበራዊ ሚዲያን በመፈተሸ ማግኘት እንደሚቻል ይወቁ። አንዳንድ ጊዜ የይለፍ ቃል የምስጢር መልሳችሁ የውሸት እንዲሆን ማድረግ ይኖርብዎታል፡፡ የይለፍ ቃል መልሶ ማግኛ ጥያቄዎች መልሶችን ለማስታወስ አንደኛው ጥሩ መንገድ ለተጨማሪ ደኅንነት የሐሰት መልሶችን በመምረጥ የይለፍ ቃል ማቀናበሪያ ላይ መመዝገብ ነው፡፡ የማኀበራዊ ሚዲያ መካነ ድሮችን የግላዊነት ፖሊሲን ይመልከቱ anchor link በሦስተኛ ወገኖች የተቀመጠ መረጃ ለራሳቸው ፖሊሲ ተገዢ ሲሆን ምንአልባትም ይህም ለንግድ አላማ ጥቅም ሊውል ወይም ለሌላ ለሶስተኛ ኩባንያ የግንድ ድርጅት ሊጋራ ይችላል። የደህንነት ፖሊሲን በደንብ አንብቦ መረዳት የሚቻል ተግባር እንዳልሆነ እንረዳለን። ነገር ግን የእርስዎ ውሂብ እንዴት ጥቅም ላይ እንደሚውል፣ መቼ ለሶስተኛ አካል ሊሰጥ እንደሚችል፣ እና ማህበራዊ አገልግሎቱ ከሕግ አስፈጻሚ አካላት ለሚቀርብ ጥያቄ መልስ የሚሰጠው እንዴት እንደሆነ የሚያትተውን ክፍል መቃኘት ግን ሊያስፈልግ ይችላል። የማኀበራዊ ሚዲያ መካነ ድሮች በብዛት ለትርፍ የተቋቋሙ የንግድ ተቋማት ናቸው። በአብዛኛውን ጊዜ እርስዎ በግልጽ ከሚያስቀምጡት በላይ እጅግ ስሱ የሆኑ መረጃዎችን ይስበስባሉ፦ የት እንዳሉ፣ ምን ፍላጎት እንዳለዎት እና የትኛው ማስታወቂያ እንደሚስብዎት፣ የትኞቹን መካነ ድሮች እንደጎበኙ (ለምሳሌ “በላይክ” በሚለው አዝራር)። አንዳንድ ጊዜ ሶስተኛ አካላት የሚያስቀምጧቸውን ኩኪዎች ማገድ ጥሩ ሊሆን ይችላል። እግር በእግር የሚከታተልን የመዳሰሻ ተጨማሪዎችን በማገድ መረጃን ለሶስተኛ አካላት ያለ እርስዎ እውቅና እንዳያስተላልፉ ማድረግ ይቻላል። የግለኝነት ቅንብርዎን መቀየር anchor link በነባሪ ያለውን ቅንብር ይቀይሩ። ለምሳሌ የሚለጥፏቸውን ነገሮች በአደባባይ ለሁሉም ሰው ወይስ ለተወሰኑ ሰዎች ብቻ ነው ማካፈል የሚፈልጉት? ሰዎች የኢሜል አድራሻዎን ወይም የስልክ ቁጥርዎን ተጠቅመው እርስዎን ማግኘት እንዲችሉ ይፈልጋሉ? ያሉበት አድራሻ በቀጥታ እንዲታወቅ ይፈልጋሉ? ምንም እንኳን እያንዳንዱ የማኀበራዊ ሚዲያ መድረክ የራሱ ልዩ ቅንብሮች ቢኖረውም አንዳንድ ተመሳሳይ ንድፎችን ሊያገኙ ይችላሉ፡፡ የግለኝነት ቅንብሮች "ምን ማየት እንደሚችል" ለሚለው ጥያቄ መልስ የመስጠት አዝማሚያ አላቸው፤ እዚህ ጋር ታዳሚዎች ነባሪዎችን («ይፋዊ»፣ «የጓደኞች ጓደኞች»፣ «ጓደኞች ብቻ»፣ ወዘተ…) ማድረጊያ፣ ያሉበት ቦታ፣ ፎቶዎች፣ ዕውቂያ መረጃ፣ መለያ መስጠት እና ሰዎች እንዴት የእርስዎን መገለጫ በፍለጋዎች ውስጥ ማግኘት እንደሚችሉ የሚመርጡበትን ቅንብሮችን ያገኛሉ፡፡ ደኅንነት (አንዳንዴ “ጥንቃቄ” የሚባለው) የበለጠ ሊሰራ የሚችለው ሌሎች መለያዎችን በማገድ/ዝም በማሰኘት ሊሆን ይቻላል ፡፡ ያልተፈቀዱ ሙከራዎች በመለያዎ ላይ ሲደረግ ለርስዎ እንዲያውቁት ማድረግም ይቻላል፡፡ አንዳንድ ጊዜ ልክ እንደ ባለሁለት-ደረጃ ማረጋገጫ እና እንደ መጠባበቂያ ኢሜይል/ የስልክ ቁጥር- በዚህ ክፍል ውስጥ ያገኛሉ፡፡ በሌላ ጊዜ እነዚህ የመግቢያ ቅንብሮች በመለያ ቅንጅቶች ወይም በመግቢያ ቅንብሮች ክፍል ውስጥ የይለፍ ቃልዎን ለመቀየር ከሚያስችሉ አማራጮች ጋር ያገኛሉ፡፡ የደኅንነት እና ግላዊነት “ፍተሻዎች”ተጠቃሚ ይሁኑ፡፡ ፌስቡክ፣ ጎግል እና እና ሌሎች ዋና ዋና መካነ ድሮች "የደኅንነት ፍተሻዎች" አገልግሎቶችን ያቀርባሉ፡፡ እነዚህ አጋዥ ስልጠናዎች የሚመሩ የተለመዱ ግላዊነት እና የደኅንነት ቅንብሮች እንዴት መጠቀም እንደሚችሉ በቀላል ቋንቋ ይመርዎታል፡፡ እነዚህ አገልግሎቶች ለተጠቃሚዎች በጣም አስፈላጊ ናቸው፡፡ በመጨረሻም የግላዊነት ቅንብሮች ሊቀየሩ የሚችሉ ነገሮች መሆናቸውን ማስታወስ ይገባል። አንዳንድ ጊዜ እነኚህ የግላዊነት ቅንብሮች ጠንካራ እና የማይመቹ ሊሆኑ ይችላሉ። የማይሆኑበት አጋጣሚም አለ፡፡ ማንኛውም በግል የነበረ መረጃ በአደባባይ ሊወጣ ወይም ሊጋራ እንደሚችል፣ ወይም ማንኛውም ተጨማሪ ቅንብሮች ለግላዊነትዎ የተሻለ ቁጥጥር እንደሚሰጥዎት ለማየት በእነኚህ ቅንብሮች ላይ የሚያካሂዷቸውን ለውጦች በንቃት ይከታተሉ። የተለያዩ መገለጫዎችን እንደተለያዩ ማቆየት anchor link ለብዙዎቻችን የተለያዩ መለያዎችን ማንነት ለይቶ ማስቀመጥ በጣም አስፈላጊ ነው፡፡ ይህ በየፍቅር ጓደኛ ማግኛ መካነ ድሮች፣ ሙያዊ መገለጫዎች፣ የማይታወቁ መለያዎች እና በተለያዩ ማኀበረሰቦች ውስጥ ያሉ መለያዎች ላይ ሊተገበር ይችላል፡፡ ስልክ ቁጥሮች እና ፎቶዎችን ትኩረት ሊደረግባቸው የሚገቡ የመረጃ አይነቶች ናቸው፡፡ በተለይ ፎቶዎች ተለይተው የተቀመጡ መለያዎችን ሳይፈለግ ሊያገናኙ ይችላሉ፡፡ በሚገርም ሁኔታ ይህ ከፍቅር ጓደኛ መፈለጊያ መገለጫ እና የሙያ መገለጫዎችን ማያያዝ የሚያጋጥም የተለመደ ችግር ነው፡፡ ማንነትዎን እንዳይገለጥ ከፈለጉ ወይም የተወሰኑ የመለያዎች ከሌሎች ተለይተው እንዲቀመጡ የሚፈልጉ ከሆነ መስመር ላይ በማንኛውም ቦታ ያልተጠቀሙትን ፎቶ ወይም ምስል ይጠቀሙ፡፡ ይህንን ለማረጋገጥ የጎግል ምስል መፈለጊያን መጠቀም ይችላሉ፡፡ በጥንቃቄ ሊይዟቸው የሚገቡ የማያያዝ አቅም ያላቸው ሌሎች ነገሮች ስምዎ(የቅጽል ስሞችን ጨምሮ) እና ኢሜይል ናቸው፡፡ ከእነዚህ መረጃዎች ውስጥ አንዱ እርስዎ ባልጠበቁት ቦታ መኖራቸውን ካወቁ ምንም ፍርሃት አይሰማዎት፡፡ ይልቁንስ ቀስ በቀስ፣ ደረጃ በደረጃ ያስቡ፡፡ በአጠቃላይ በይነመረብዎ ያለዎትን መረጃ ለማጽዳት ከመሞከር ይልቅ የተወሰኑ የመረጃ ክፍሎችን፣ የት እንዳሉ እና ምን ማድረግ እንደሚችሉ ብቻ ትኩረት ያድርጉ፡፡ ራስዎን ከፌስቡክ ቡድኖች ቅንብሮች ጋር ያላምዱ anchor link የፌስቡክ ቡድኖች ለማኀበራዊ እንቅስቃሴ፣ ቅስቀሳ እና ሌሎች ስሱ ተግባራት ማከናወኛ ስፍራዎች መሆናቸው እየጨመረ መምጣቱ የግሩፕ ቅንብሮች የሚያደናግሩ አድርጓቸዋል፡፡ ስለቡድን ቅንብር ይማሩ፤ ተሳታፊዎችም ስለ ቡድን ቅንብር እና የፌስቡክ ቡድኖች ደኅንነታቸው የተጠበቀ እና ግላዊ እንዲሆኑ ይስሩ፡፡ ግላዊነት የቡድን ስፖርት ነው anchor link የእርስዎን የማኀበራዊ ሚደያ ቅንብሮች እና ጸባይ ብቻ አይቀይሩ፡፡ በመስመር ላይ እርስ በርስ ስለተገለጡ አደጋ የመፍጠር አቅም ያላቸው ስሱ የሆኑ መረጃዎች ከወዳጆችዎ ጋር ለመነጋገር ተጨማሪ እርምጃ ይውሰዱ፡፡ ምንም እንኳን የማኀበራዊ ሚዲያ መለያ ባይኖሮትም ከጽሑፎች ላይ ታግ የተደሩጉትን ቢያስለቅቁም ወዳጆችዎ ሳያውቁት ያሉበትን ቦታ ሊጠቁሙ እና ከእርስዎ ጋር ያላቸውን ግንኙነት ይፋ ሊያደርጉ ይችላሉ፡፡ ግለኝነትን መጠበቅ ማለት ራሳችንን ብቻ መጠበቅ ሳይሆን አንዳችን ላንዳችን መጠንቀቅንም ይጨምራል፡፡'
