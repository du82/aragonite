title = "How to: Detect Bluetooth Trackers | Surveillance Self-Defense"
description = "On May 13, 2024, both Apple and Google announced they’d start supporting cross-platform operating system-level notifications for some third-party trackers, similar to the AirTag detection warnings. In theory, this means your phone may detect some Bluetooth trackers without a third-party app. In our testing, we’ve found these new models..."
full_description = '''< Tool Guides How to: Detect Bluetooth Trackers Last Reviewed: July 15, 2024 On May 13, 2024, both Apple and Google announced they’d start supporting cross-platform operating system -level notifications for some third-party trackers, similar to the AirTag detection warnings. In theory, this means your phone may detect some Bluetooth trackers without a third-party app. In our testing, we’ve found these new models aren’t always detected. For now, we still recommend using AirGuard to locate non-supported trackers. Legitimate operating system-level notifications from Apple and Google look like this: “(Device name) detected near you,” or “Unknown items detected with you.” You can follow the on-screen instructions on your phone, just as you would in the AirTag sections below. Table of contents What's a Bluetooth Tracker? What Common Bluetooth Trackers Look Like What it Looks Like When Your Phone Automatically Finds a Tracker On Android Devices On iPhones How to Manually Search for a Bluetooth Tracker Manual Search on Android Devices Manual Search on iPhones What to Do If You Find an Unknown Tracker Bluetooth location trackers such as AirTags, Tile, and Samsung SmartTags are marketed as a way to keep track of luggage or a misplaced wallet, but they can also be easily slipped surreptitiously into a bag or car, allowing stalkers and abusers unprecedented access to a person’s location without their knowledge. These devices are small enough to fit inside wallets or on a keychain, which makes them difficult to find, especially if you don't know what you're looking for. If you have an Android device or iPhone, you can search for Bluetooth location trackers that might have been placed on you, in your bag or on a car. Your phone may also send you an alert if it detects one of these trackers traveling with you, though the timing of that alert may vary, and you may only get a notification for specific brands of Bluetooth trackers. This guide will detail what your phone can detect on its own, and which trackers you need a third-party app to detect. Keep in mind that the reliability of detection apps isn't perfect and you should not rely on them entirely. What's a Bluetooth Tracker? anchor link Bluetooth trackers are small battery-powered devices meant to track property. They use Bluetooth to communicate with other devices, usually phones, to piggyback on a cell or Wi-Fi connection to send their location to the owner of the tracker. The reliability and accuracy of these trackers is dependent on the network they're attached to. For example, Apple's AirTags can piggyback on every iPhone within Bluetooth range (about 30 feet), meaning in most cities and towns they'll be very accurate. Other brands work similarly, but on their own networks. Bluetooth trackers do not have GPS built into them and aren't as accurate as GPS. In order to use a Bluetooth tracker, the owner must register the tracker to an account, which typically also links the tracker to some combination of a name, username, or phone number. Most Bluetooth trackers allow the owner to "share" the tracker's location with others. For example, an AirTag owner can share the location of an AirTag with up to three other people. Users of Life360’s Tile can share with an unlimited number of people. If an AirTag is shared with you or someone you are with, you will not get "unknown tracker" alerts. Also, if you scan an AirTag to find its owner, it will not indicate that it's being shared with someone else. It works like this: let's say you place a Bluetooth tracker on a bicycle, and your bicycle is then lost. The tracker will constantly ping nearby phones telling the phones where it is. If those phones are set up to work with the tracker (like all iPhones are by default with AirTags, or like a Tile tracker will do with other Tile users and with Amazon’s Sidewalk network), the phone sends the approximate location of that tracker to the manufacturer, so you, the owner of the tracker, can then see where the tracker is. From the perspective of the owner, it will look something like this: On the left is a screenshot from Apple's Find My app on iPhone, on the right is Tile's app, also on iPhone. While device manufacturers repeatedly suggest these are meant only for tracking physical property, it is very easy for someone to place one of these trackers on a person. To combat stalking, some Bluetooth trackers provide a means for non-owners to locate a tracker if it is near you, either through phone apps or by making a sound. We'll get into how those apps do and don't work below, but first it's good to get an idea of what you're looking for. What Common Bluetooth Trackers Look Like anchor link Some brands, like Tile and Chipolo, make a handful of different designs, so it's worth looking at the product pages to familiarize yourself with each offering so you know what to look for. Here are some of the most popular trackers: Apple AirTags Life360 Tile Samsung SmartTags Chipolo Currently, only Apple AirTags alert you with a sound effect when they are traveling with you and not with the owner, and even those can take up to 24 hours before they'll start emitting noises. This video details what sound an AirTag makes. If you do not own a smartphone, the AirTag's beeping sounds are likely the only clue you'll have that someone has placed a tracker on you. However, know that it's possible for someone to disable that sound effect. What it Looks Like When Your Phone Automatically Finds a Tracker anchor link Both Android and iOS can automatically detect when an unknown AirTag is traveling with you. "Unknown" means the tracker has been paired with someone else's phone, but is not currently connected to their phone. For example, if you are with a friend who has an AirTag attached to their keys, you will not get a notification about that Bluetooth tracker. However, if that person lends you their keys for the day and you are not physically together with your friend for the day, you should get a notification about an "unknown" tracker. Your phone will not detect the tracker immediately and it can take up to 24 hours before you get a notification. This feature currently only works with AirTags without needing to download an extra app, though both Android and Apple have announced plans to support other Bluetooth trackers, like those made by Life360 and Samsung. Other Apple Bluetooth devices that use the company's "Find My" network, like wireless headphones, can also trigger these alerts. In order for detection to work, you need to enable certain services on your phone, including Bluetooth, some location services, and notifications. Most of these are enabled by default when you first set up your phone, but depending on your security plan, you may have disabled them. Here are directions for checking they're enabled for Android and iPhone. If you get an unknown tracker notification, that means there is a Bluetooth tracker that your phone has detected moving with you. Before you panic, remember that these notifications can still show up for a legitimately used tracker, like the example above when a friend gave you their keys with an AirTag attached to them. But an unknown tracker notification can also mean someone placed a Bluetooth tracker on you or something you own, without your knowledge. It's important to know what these notifications look like, and what to do about them if you get one. Once you get a notification, search anywhere you think an object about the size of a U.S. Quarter (or 1 Euro) could be hidden, including any pockets or the lining of bags or jackets, or underneath a car. We most commonly hear of them being hidden inside bags and on cars, including behind the license plate. On Android Devices anchor link AirTag Notifications on Android 14+ As long as your phone can run Android 14 or newer (you can check which operating system you have installed under Settings > About Phone > Android Version), it can detect AirTags (but not other Bluetooth trackers) natively without downloading any extra apps. This feature is enabled by default, but if you want to double-check, then open Settings > Safety & emergency > Unknown tracker alerts and make sure "Allow alerts" is enabled. These settings may vary depending on which version of Android you have and which phone you have. Refer to your phone's manufacturer's website if these directions do not work. If your phone detects an AirTag, you will get a notification that looks like this: A notification for an unknown AirTag on Android 14. Tap the notification, and you'll see a map along with the time and date that shows roughly when your phone noticed the tracker. Even though a map is displayed, that doesn't mean the owner of the AirTag was viewing your location at that time. The AirTag's owner cannot see a history of the AirTag's movement, just the current location when they open the "Find My" app on an Apple device. This is not always the case with other trackers, like Tile and Samsung SmartTags, which may provide a history to the owner (we'll get to how to detect those below). Android's "Unknown AirTag" search screen. If you tap "Play sound" it should trigger the AirTags beeping sound to help you find it (this doesn't always work and you may end up with an error message, even if an AirTag is nearby, so don't rely on it). Once you find the tracker, hold the AirTag to the back of your phone to get more information about it, including the last four digits of the phone number of the registered owner, and the serial number which can be useful to confirm any suspicions you may have, or if you decide to contact law enforcement. Keep in mind this can be a burner phone or a secondary phone number. Likewise, this screen will not display any indication that an owner of an AirTag shared the AirTag's location with others. After you find the AirTag, proceed down to the what to do if you find a tracker section below. After scanning an AirTag, you're shown information about the owner, including the last four digits of the phone number they used on their Apple account. Other Unknown Tracker Notifications with AirGuard If you cannot update to Android 14 on your phone, or you want automatic tracker detection for more than just AirTags, then you'll need to use a third-party app. There are a number of apps that can search for trackers, but we've found AirGuard useful at detecting the most popular trackers. But in our testing for this guide, the app was not perfect and on a couple occasions took longer than expected to register an unwanted tracker. Download AirGuard from the Google Play Store and open the app. You'll be asked to allow a few permissions that are required for the app to work: location, nearby devices, and notifications. If you're concerned about enabling the location permission, the app can still work without access to location, but will not include a location history of where the app found the tracker. Here is AirGuard’s privacy policy. Once you get through the permissions, you'll be taken to the app's main screen. AirGuard's dashboard on Android. There are a number of settings in AirGuard you can change to fit your needs, but the default settings are enough to send you a notification when the app detects an unknown tracker following you. When AirGuard detects a tracker that's been following you, you will get a notification that looks like this. Tap the notification, and it'll open AirGuard. If you enabled the location permission, you will see a map of where your phone first noticed the tracker, and a number of options for what to do next. If this is a tracker you know of, you can tap "Ignore Device" to stop getting notifications about it. While not likely due to Bluetooth's short range, there might be false detections of trackers. If you are somewhere that you know for certain no tracker is with you, you can tap "False Alarm." An AirGuard notification on Android. AirGuard's map screen on Android. If you have not already found where the Bluetooth tracker was hidden, tap "Detailed Scan." This shows a screen with a percentage number on it. The number is how strong the signal between your phone and the tracker is, and works sort of like radar. Walk around with your phone to see if the percentage gets stronger. This indicates you're getting closer to the Bluetooth tracker. If the percentage goes down, it means the signal is weaker, which means you're moving in the wrong direction. Once it's around 90% or above, you should be very close to the tracker. After you find it, proceed down to the what to do if you find a tracker section below. Airguard's tracker search screen on Android. On iPhones anchor link AirTag Notifications with iOS 14.5+ Any iPhone running iOS 14.5 or newer will automatically detect an unknown AirTag that's following you and send you an alert (You can check which version of the operating system you are running by opening Settings > General > About > iOS Version). You can double-check that this setting is enabled by opening up Settings > Notifications > Tracking Notifications and make sure "Allow Notifications" is enabled. If your phone detects an unknown AirTag traveling with you, the notification will look like this: Apple's unknown AirTag notification on an iPhone. Tap the notification, and you will see a history of everywhere you've been since your phone first noticed the AirTag. Even though a map is displayed, that doesn't mean the owner of the AirTag was viewing your location at that time. The AirTag's owner cannot see a history of the AirTag's movement, just the current location when they open the "Find My" app. This is not always the case with other trackers, like Tile and Samsung SmartTags, which may provide a history to the owner (we'll get to how to detect those below). Apple's "Find My" iPhone app showing the history of an AirTag. If this is an AirTag you know about, like in the above example where you've borrowed a friend's keys and they have an AirTag attached to them, you can tap "Pause Tracking Notifications" to disable notifications for that specific AirTag. Otherwise, you have a couple options to help in your search for an unknown AirTag if you do not know where it is. Tap the "Play Sound" option to make the AirTag play a beeping sound to help you locate it. If that does not help you locate the AirTag, tap the "Find" option. If you're close enough, you will see a screen that attempts to guide you to the exact location of the AirTag with arrows. Follow the directions on screen to find it. Apple's search for an AirTag screen on iPhone. Once you locate the AirTag, and confirm it's unknown to you, scroll down and tap "Learn About This AirTag." This will open your web browser and take you to a website that lists the serial number and the last four digits of the phone number that's registered to that AirTag, which can be useful to confirm any suspicions you may have or if you decide to contact law enforcement. Keep in mind this could link to a bu'''
