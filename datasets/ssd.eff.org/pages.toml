title = "Glossary | Surveillance Self-Defense"
full_description = 'HTTPS በዚህ “http://www.example.com/” መልክ የተጻፈ የድር አድራሻን አይተው ከኾነ “http” የሚለውን ቅንጥብ ውሂብ ያስተውላሉ። HTTP (hypertext transfer protocol) ማለት በኮምፒውተርዎ ላይ ያለው የድር መዳሰሻ በርቀት ካለው የድር አገልጋይ ጋር የሚነጋገርበት ቋንቋ ነው። እንደ አለመታደል ኾኖ መደበኛው http በኢንተርኔት ላይ መልዕክትን የሚያስተላልፈው ደህንነቱ ባልተጠበቀ መንገድ ነው። HTTPS (S የምትለዋ በእንግሊዘኛው “ሴኪዩር” የሚለውን ይወክላል ይህም ደህንነቱ የተረጋገጠ ለማለት ነው) ደግሞ ለድረ ገጾች የሚልኩትን ውሂብ እና ከእነርሱ የሚቀበሉትን መረጃ ከሰላዮች ለመከላከል ምስጠራን ይጠቀማል። PGP ወይም እጅግ መልካም የኾነ ግላዊነት PGP ወይም እጅግ መልካም የኾነ ግላዊነት በተግባር ከዋሉት የመጀመሪያዎቹ የአደባባይ ቁልፍ ስነመሰውር ትግበራዎች አንዱ ነው። የPGP ፈጣሪ የኾነው ፊል ዚመርማን በ1991 ፕሮግራሙን ሲጽፈው አራማጆችን እና ሌሎች ሰዎችን ግንኙነቶቻቸውን ለማመስጠር እንዲረዳቸው በማሰብ ነው። ፕሮግራሙ ወደ ሌሎች ሀገራት ሲሰራጭ ፊል ዚመርማን በአሜሪካ መንግሥት ተመርምሯል። በወቅቱ ጠንካራ የአደባባይ ቁልፍ ምስጠራን ጨምሮ ሌሎች መሣሪያዎችን ወደ ውጪ መላክ የአሜሪካን ሕግ የሚተላለፍ ድርጊት ነበር።PGP እንደ የንግድ ሶፍትዌር ምርትነት በገበያ ላይ አለ። በነጻ በተግባር ላይ ለማዋል ከPGP ጋር ተመሳሳይ መርሆችን የሚጠቀመውን GnuPG (ወይም GPG) የተባለው ሶፍትዌርን ማግኘት ይቻላል። ሁለቱም ተመሳሳይ እና ተተካኪ ስነ ዘዴን ስለሚጠቀሙ ሰዎች GnuPGን እየተጠቀሙ ስያሜውን ግን የ“PGP ቁልፍ” ወይም የ“PGP መልእክት” መላክ ብለው ሲጠቅሱት ይስተዋላሉ። SSH SSH (ወይም Secure SHell) በትዕዛዝ መስመር አማካኝነት በርቀት ያለን ኮምፒውተር ደህንነቱ በተጠበቀ መንገድ መቆጣጠሪያ ዘዴ ነው። ትእዛዞችን ከመላክ በተጨማሪ በሁለት ኮምፒውተሮች መካከል ያለን የኢንተርኔት ትራፊክ ደህንነቱ በተጠበቀ መንገድ ማስተላለፍ የSSH ስነስረዓት አንዱ ገጽታ ነው። የSSH አገናኝን ለማዋቀር በርቀት ያለው ስረዓት እንደ SSH አገልጋይ መከወን እና በቅርበት ያለው መሣሪያ ደግሞ የSSH ደምበኛ ፕርግራም ሊኖረው ይገባል። XMPP ለፈጣን የመልዕክት አገልግሎት ክፍተ ምንጨ ኮድ ስርዓት ነው። XMPPን ጎግል ለጎግል ቶክ የሚገለገልበት ሲኾን ፌስቡክ ግን ቀደሞ ይገለገልበት የነበረ ቢኾንም አሁን ግን አቁሟል። ኮርፖሬት ያልኾኑ ነጻ ፈጣን የመልዕክት መላኪያ አገልግሎቶች አብዛኛውን ጊዜ XMPPን ይጠቀማሉ። እንደ ዋትስአፕ ያሉ አገልግሎቶች የራሳቸው ዝግ እና ሚስጢራዊ ስርዓት አላቸው። ልዕለ መረጃ ልዕለ መረጃ (ወይም "ስለ ውሂብ ያለ ውሂብ") ከመረጃው ባሻገር ያለ ስለመረጃው የሚናገርር ቅንብር መረጃ ነው። የመልዕክቱ ይዘት ልዕለ መረጃ አይደለም። ነገር ግን መልዕክቱን ማን ላከው፣ መቼ ተላከ፣ ከየት ተላከ እና ለማን ተላከ የሚሉት የልዕለ መረጃ ምሳሌዎች ናቸው። የሕግ ስርዓቶች ከልዕለ መረጃዎች ይልቅ የመረጃውን ይዘት ይከላከላሉ። ለምሳሌ በአሜሪካን ሀገር የሕግ አስፈጻሚ አካላት የግለሰቦችን የስልክ ውይይት ለማዳመጥ የፍርድ ቤት ማዘዣ ማግኘት አለባቸው ነገር ግን ስልክ የደወሉላቸውን ሰዎች ስም ዝርዝርን በቀላሉ ማግኘት ይችላሉ። አብዛኛውን ጊዜ የልዕለ መረጃ በርካታ ነገሮችን ሊገልጽ ስለሚችል እንደ መረጃው ሁሉ በጥንቃቄ መጠበቅ አለበት። መመስጠር እንደገና መገጣጠም እና ትክክለኛ መረጃ(ቁልፍ) በያዘ ሰው ወደ ቀድሞ ቅርጹ መመለስ በሚያስ