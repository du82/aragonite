full_description = '< የመሣሪያ መመሪያዎች ሊኒክስ ላይ ውሂብዎን ደኅንነቱ በተጠበቀ መንገድ መሰረዝ Last Reviewed: July 20, 2018 This page was translated from English. The English version may be more up-to-date. We are in the process of updating several guides, including this one, and are aware that some of this information is out of date. የማውረጃ ስፍራ: https://www.bleachbit.org/download/linux የኮምፒውተር ቅድመ ሁኔታ፦ ማንኛውም ዋና የሊኒክስ ስርጭት። ለመጥቀስ በዚህ መመሪያ ላይ ጥቅም ላይ የዋለው ኡቡንቱ ሊኒክስ 18.04 ነው። በዚህ መመሪያ ላይ የተጠቀምናቸው ስሪት፦ ብሊችቢት 2.0 ፈቃድ፦ GPLv3 ደረጃ፦ ጀማሪ የሚወስደው ጊዜ፦ ከ10ደቂቃ እስከ በርካታ ሰዓታት (ደኅንነቱ በተጠበቀ መንገድ በሚሰረዘው የፋይል/የዲስክ መጠን መሰረት) ከታች ያሉት መመሪያዎች ውሂብ ከ ተሽከርካሪ ድራይቮች ላይ ደኅንነቱ በተጠበቀ ሁኔታ እንዲወገድ ለማድረግ ብቻ ያገለግላሉ። እነዚህ መመሪያዎች የሚያገለግሉት ለቀድሞዎቹ ዲስክ ድራይቮች እንጂ በዘመናዊ ኮምፒተሮች፣ የዩኤስቢ ቁልፎች / የዩኤስቢ ተምብ ድራይቮች ወይም የኤስዲ ካርዶች / ፍላሽ ሚሞሪ ካርዶች ውስጥ በመደበኛነት የምናገኛቸው ሶሊድ ስቴት ድራይቮች(SSDs) አይደለም። በ ኤስኤስዲዎችን፣ የዩኤስቢ ፍላሽ ድራይቮች እና ኤስዲ ካርዶችን ደኅንነቱ በተጠበቀ መንገድ መሰረዝ በጣም ከባድ ነው! ይህ የሆነበት ምክንያት እነዚህ የድራይቭ አይነቶች ዊር ሌቭሊንግ የሚባል ዘዴን በመጠቀማቸው እና በውስጣው የያዙትን የመረጃ አሀዶች በዝቅተኛ ደረጃ ፍለጋ ስለማይሰጡ ነው። (ይህ ደኅንነቱ የተጠበቀ መሰረዝ ላይ እንዴት ችግር እንደሚያስከትል የበለጠ ለመረዳት እዚህማንበብ ይችላሉ።) ኤስኤስዲ ወይም ዩኤስቢ ፍላሽ ድራይቭ የሚጠቀሙ ከሆነ ከዚህ በታች ወዳለው ክፍልይዝለሉ። ኮምፒውተርዎ ውስጥ የቆሻሻ መጣያ ቅርጫት ውስጥ ሰነድ ሲያስገቡ እና ቅርጫቱንን ባዶ ሲያረጉበት ሰነዱ ሙሉ በሙሉ አለመጥፋቱን ያውቃሉ? ኮምፒውተሮች በመደበኝነት ሰነዶችን "አይሰረዙም"። አንድ ፋይል ወደ ቆሻሻ ማጠራቀሚያ ሲያስገቡ ኮምፒውተርዎ ሰነዱን እንዳይታይ ያደርግና እና ፋይሉ የተጠራቀመበትን የዲስክ ክፍል ወደፊት ሌላ ሰነድ እንዲጻፍበት ክፍት ያደርገዋል:: ይህም አዲስ ውሂብ ከመጻፉ በፊት ሳምንታት፣ ወራት ወይም አመታት ሊወስድ ይችላል። ይህ እስኪሆን ድረስ ”የተሰረዘው“ ሰነድ ለተለመደው ተግባር እንዳይታይ ሆኖ በዲስኮዎት ላይ ይቆያል። እናም በትንሽ ድካም እና በትክክለኛ መሳሪያ (እንደ “አንዲሊት” ሶፍትዌር ወይም ፎርንሲክ ያሉ ዘዴዎች) “የተሰረዘውን” ፋይል መልሶ ማውጣት ይችላሉ። ሰነድን ለዘላለም ለመሰረዝ ምርጡ መንገድ ወዲያውኑ በሌላ ነገር መተካቱን ማረጋገጥ ነው። ይህም መጀመሪያ ተጽፎ የነበረውን ሰነድ መልሶ ማውጣትን አዳጋች ያደርገዋል። ስርአተ ክወናዎ ለእርስዎ ይህንን ማድረግ የሚችል ሶፍትዌር ሊኖረው ይችላል። ይህ ሶፍትዌር በኮምፒውተርዎ ዲስክ ላይ ያለውን “ባዶ” ቦታ በሌሎች ትርጉም አልባ በሆኑ ውሂቦች ይተካል፤ በዚህም የተነሳ የተሰረዘው ውሂብ ሚስጥራዊነት ይጠብቃል። በሊኒክስ ብሊችቢት የተባለ ክፍት ምንጭ በዊንዶውስ እና ሊኒክስ የሚያገለግል ደኅንነቱ የተጠበቀ የስረዛ መሣሪያን እንዲጠቀሙ እንመክራለን። ብሊችቢት በቀላሉ እና በፍጥነት የተወሰኑ ሰነዶችን ደኅንነቱ በተጠበቀ መንገድ ለመሠረዝ ወይም በተወሰነ ጊዜ የሚደረግ የስረዛ መርሐግብርን ለመተግበር መጠቀም ይቻላል። የተበጀ የስረዛ ትዕዛዝም መጻፍ ይቻላል፡፡ ተጨማሪ መረጃዎችን በሰነዶች ውስጥ ያገኛሉ። ብሊችቢት መጫን anchor link ከኡቡንቱ ሶፍትዌር ጋር መጫን anchor link የብሊችቢት ኡቡንቱን የኡቡንቱ ሶፍትዌር መተግበሪያን በመጠቀም ማግኘት ይችላሉ፡፡ በተወዳጅ መተግበሪያዎችዎ ዝርዝር ውስጥ ካለ በሰሌዳ በግራ በኩል ይጫኑ አለበለዚያ በታችኛው ግራ ጎን የሚገኘው የመተግበሪያውን አዝራር ይጫኑ፡፡ የመፈለጊያ ስፍራውን ይጠቀሙ፡፡ የመፈለጊያው ስፋራ ላይ “software” ብለው ይጻፉና የኡቡንቱ ሶፍትዌር አዶ ላይ ይጫኑ፡፡ ብሊችቢት በነባሪነት ዝርዝር ውስጥ አይገባም፡፡ ዝርዝር ውስጥ እንዲገባ ከላይ ምናሌው ላይ የሚገኘውን “Ubuntu Software” የሚለውን በመጫን በማህበረሰብ የተያዙ ጥቅሎችን ያስጀምሩ፡፡ ከዚያም “Software & Updates” የሚለውን ጠቅ ያድርጉ፡፡ በአዲሱ መስኮት “Community-maintained free and open-source software (universe)” ከሚለው ቀጥሎ ያለው ሳጥን መመረጡን እርግጠኛ ይሁኑ፤ ከዚያም “Close” እና “Reload” የሚሉትን ተራ በተራ ጠቅ ያድርጉ፡፡ ተመርጦ ከሆነ “Close”ን ብቻ ይጫኑ፡፡ አሁን ብሊችቢትን ለመፈለግ በኡቡንቱ ሶፍትዌር በኩል ማሰስ ይችላሉ፡፡ ነገር ግን ፍለጋው በጣም ፈጣን ነው፡፡ በመስኮቱ የላይኛው ቀኝ ጥግ ላይ ያለውን ማጉያ መነፅር ጠቅ በማድረግ የፍለጋ ስፍራውን ይጠቀሙ፡፡ ከዚም በመፈለጊያው ስፍራ “BleachBit”ን ያስገቡ፡፡ ብሊችቢትን ጠቅ ያድርጉና ከዚያም የInstall አዝራርን ይጫኑ፡፡ ኡቡንቱ ሶፍትዌር የይለፍ ቃልዎን ለፍቃድ ይጠይቃል፡፡ የይለፍ ቃልዎን ካስገቡ በኋላ Authenticate አዝራር ይጫኑ፡፡ የኡቡንቱ ሶፍትዌር ማዕከል ብሊችቢትን ይጭናል፡፡ ከዚያም ትንሽ ሂደት የምታመለክት አሞሌ ያሳያል፡፡ የመጫኑ ሂደት ሲጠናቀቅ “Launch” እና “Remove” የሚሉ አዝራሮች ይመለከታሉ፡፡ ከተርሚናል መጫን anchor link ብሊችቢት በኡቡንቱን ከተርሚናልም ማግነት ይችላሉ፡፡ በታችኛው ግራ ጎን የሚገኘውን የመተግበሪያ አዝራር ጠቅ ያድርጉና በመፈለጊያው ስፍራ ይጠቀሙ፡፡ “terminal” ብለው ይጻፉ እና የተርሚናል አዶውን ይጫኑ፡፡ “sudo apt-get install bleachbit” ብለው ይጻፉ እና ኢንተርን ከቃላት መተየቢያው የሚለውን ይጫኑ፡፡ ብሊችቢትን ለመጫን እንደፈለጉ ለማረጋገጥ የይለፍ ቃልዎን እንዲስገቡ ይጠየቃሉ፡፡ የይለፍ ቃልዎን ያስገቡና ኢንተርን ከቃላት መተየቢያው ይጫኑ፡፡ አሁን ብሊችቢት እየተጫነ እንደሆነ የሚያሳይ ሂደት ይመለከታሉ፡፡ ሲያልቅ ትዕዛዙን ከጀመሩበት ቦታ መመለስ አለብዎት፡፡ ብሊችቢትን የጎን አሞሌ ጋር ማስገባት anchor link በታችኛው ግራ በኩል የሚገኘውን የመተግበሪያ አዝራር ይጫኑ፡፡ ከዚያም የመፈለጊያውን ስፍራ ይጠቀሙ፡፡ “bleach” ብለው ሲጽፉ ሁለት አማራጮች ይከሰታሉ፡- BleachBit and BleachBit (as root) BleachBit (as root) የሚለውን አማራጭ መጠቀም ያለብዎት ምን እያደረጉ እንደሆነ ካወቁ ብቻ ነው፡፡ ምክንያቱም በስርዓተ ክውናው የሚፈለጉ ሰነዶችን ከሰረዙ ወደኋላ መመለስ የማይቻል ጉዳት ሊያደርሱ ይችላሉ፡፡ ብሊችቢት ላይ የቀኝ ጠቅታ ያደርጉ፡፡ ከዚያም “Add to Favorites” የሚለውን ይምረጡ፡፡ ብሊችቢትን መጠቀም anchor link በግራ በኩል ሠሌዳው ላይ ከሚገኙ የእርስዎ ምርጫዎች የብሊችቢትን አዶን ጠቅ ያድርጉ። ዋናው የብሊችቢት መስኮት ይከፈትና ብሊችቢት የምርጫዎችዎን አጠቃላይ ምልከታ ይሰጥዎታል፡፡ “Ove