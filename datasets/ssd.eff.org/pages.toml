full_description = '< መሰረታዊያን ከሌሎች ጋር ስለመገናኘት Last Reviewed: June 08, 2020 This page was translated from English. The English version may be more up-to-date. የቴሌኮሚኒኬሽን ኔትወርኮች እና ኢንተርኔት ከሌሎች ሰዎች ጋር የምናደርገውን ግንኙነት ከምንጊዜውም በተሻለ ቀላል እንዲኾን ቢያደርጉም ክትትል ይበልጥ እንዲበረታ አድርገዋል። ግላዊነትዎን ለመጠበቅ ተጨማሪ እርምጃዎችን ካልወሰዱ እያንዳንዱ የስልክ ጥሪ፣ አጭር የጽሑፍ መልዕክቾች፣ ኢሜል ምልልሶች፣ ፈጣን የመልዕክት አገልግሎቶች፣ የድምጽ እና ቪዲዮ ጥሪዎች እና የማኀበራዊ ሚዲያ መልዕክቶች በሙሉ ለሌሎች አድማጮች ተጋላጭ ናቸው። በአብዛኛውን እና እጅግ በጣም የተሻለው ደኅንነቱ የተጠበቀ ግንኙነት የማድረጊያው መንገድ የመገናኛ አውታሮችን፣ ኮምፒውተሮችን ወይም ሰልኮችን ሳይጠቀሙ በአካል መገናኘት ነው። ነገር ግን ሁልጊዜም መገናኘት ስለማይቻል ቀጣዩ የተሻለ አማራጭ ከጥግ እስከ ጥግ ምስጠራን መጠቀም ነው፡፡ ከጥግ እስከ ጥግ ምስጠራ እንዴት ይሰራል? anchor link ከጥግ እስከ ጥግ ምስጠራ መረጃው በዋናው መልእክት ላኪ (የመጀመሪያው "ጥግ") ሚስጥራዊ መልዕክት እንዲሆን መደረጉን እና የመጨረሻው ተቀባይ (ሁለተኛ "ጥግ") ብቻ ምስጢራዊው መልዕክት መፈታቱን ያረጋግጣል፡፡ ይህ ማለት ማንም ሰው በመሀል ገብቶ መስማት አይችልም፤ መልዕክትዎን አይፈታምም፡፡ ይህ የኢንተርኔት ካፌዎችን፣ የኢንተርኔት አገልግሎት አቅራቢው፣የሚጠቀሙት መካነ ድር እና የተንቀሳቃሽ ስልክ መተግበሪያዎንም ይጨምራል፡፡ በተወሰነ መልኩ በተቃራኒው በስልክዎ ላይ ባለመተግበሪያ የተመለከቱት መልዕክት ወይም በኮምፕዩተርዎ የጎበኙት መካነ ድር ራሳቸው የመተግበሪያው ወይም የመካነ ድሩ ባለቤት ያዩታል ማለት አይደለም፡፡ የጥሩ ምስጠራ ሁነኛ መለያው ምስጠራውን የነደፉት እና የተገበሩት ሰዎች ራሳቸውን እንኳን ሰብረው መግባት የማይችሉት ነው፡፡ በኤስኤስዲ መካነ ድር ላይ መመሪያ የተዘጋጀላቸው መሣሪያዎች በሙሉ ከጥግ እስከ ጥግ ምስጠራን ይጠቀማሉ፡፡ ከጥግ እስከ ጥግ ምስጠራን ለማንኛውም አይነት ግንኙነትዎ የድምጽ እና ቪዲዮ ጥሪዎች፣ የጽሑፍ ውይይት እና ኢሜልን ጨምሮ መጠቀም ይችላሉ፡፡ (ከጥግ እስከ ጥግ ምስጠራን ከንብርብር ማጓጓዣ ምስጠራ ጋር መምታታት የለብዎትም፡፡ ከጥግ እስከ ጥግ ምስጠራ መልዕክትዎን ከእርስዎ እስከ ተቀባዩ ድረስ ሲጠብቅ ንብርብር ማጓጓዣ ምስጠራ ደግሞ መልዕክትዎ ከእርስዎ መሣሪያ ወደ መተግበሪያው ሰርቨር ወይም መካነ ድር እና ከመተግበሪያው ሰርቨር ወደ መልዕክት ተቀባዩ መሣሪያ ሲጓጓዝ ብቻ ነው ጥበቃ የሚያደርገው፡፡ በመሀል የእርስዎ መልዕክት መለዋወጫ አገልግሎት አቅራቢ ወይም የጎበኙት መካነ ድር ወይም የተጠቀሙት መተግበሪያ ያልተመሰጠረ የመልዕክትዎን ቅጂ ሊያገኙ ይችላሉ፡፡ ከበስተጀርባ ከጥግ እስከ ጥግ ምስጠራ የሚሰራው እንዲህ ነው፡፡ ሁለት ግለሰቦች ከጥግ እስከ ጥግ ምስጠራን ተጠቅመው መገናኘት ሲፈልጉ(ለምሳሌ አበበ እና ጫልቱ) እያንዳንዳቸው ቁልፎች የሚባሉትን ውሂቦች ማመንጨት አለባቸው። እነዚህ ቁልፎች ማንም ማንበብ የሚችለውን ውሂብ አዛማጅ ቁልፉን ከያዘው ሰው በቀር ማንም ማንበብ ወደማይችለው ውሂብ ይቀይራሉ፡፡ አበበ ለጫልቱ መልዕክትን ከመላኩ በፊት ጫልቱ ብቻ መልዕክቱን መፍታት እንድትችል በእርሷ ቁልፍ መልዕክቱን ያመሰጥረዋል። የተመሰጠረውን መልዕክትም በኢንተርኔት ይልከዋል። ማንኛውም ግለሰብ የአበበ እና የጫልቱን ግንኙነት ቢሰልል እና አበበ መልዕክቱን ለመላክ የተጠቀመውን አገልግሎት (ለምሳ