title = "How to: Get to Know iPhone Privacy and Security Settings | Surveillance Self-Defense"
description = """
Open up your iPhone’s Settings app and you’ll find dozens of different options with little guidance on what those options do. Some of these settings have a serious impact on your privacy and security, altering what data gets shared automatically with apps, data brokers, and Apple itself.

What sorts of..."""
full_description = '''< Tool Guides How to: Get to Know iPhone Privacy and Security Settings Last Reviewed: January 01, 2025 Open up your iPhone’s Settings app and you’ll find dozens of different options with little guidance on what those options do. Some of these settings have a serious impact on your privacy and security, altering what data gets shared automatically with apps, data brokers, and Apple itself. What sorts of changes you should make depends on how you use your phone and your security plan. There is no one-size-fits-all collection of recommended settings to change, instead, we’ll explain what settings do to help you decide if they’re worth altering. This guide cannot cover everything, so for a deeper dive, check out our Privacy Breakdown of Mobile Phones guide. How to use this guide: because of the sheer amount of privacy and security choices in iOS, we’ve broken this into three sections, starting with the settings everyone should consider changing, and moving deeper from there. This guide is written for and is accurate as of iOS 18. Level 1: Everyday Essentials Enable Two-Factor Authentication on Your Apple Account Lock Your Phone Behind Biometrics or a Strong Passcode Audit Your Privacy Permissions Disable Ad Tracking Set Up "Find My" Enable Stolen Device Protection Level 2: Additional Steps for Some Security Plans Enable Advanced Data Protection Learn About Lockdown Mode Run Through the "Safety Check" Level 3: Extra Credit Mail Privacy Protection Tweak Safari Settings Lock and Hide Apps Lock and Hide Photos Keep Apple Notes on Device Obscure Lockscreen Notifications Change What Siri Can Access Disable Apple Intelligence Disable Some App iCloud Backups Change Your "Shared with Me" Settings Level 1: Everyday Essentials anchor link No matter what your specific security plan is, everyone should take a look at these settings on their phone to increase their privacy and security. Enable Two-Factor Authentication on Your Apple Account anchor link Why If you’ve owned an iPhone for a long time, there’s a reasonable chance you’ve already enabled two-factor authentication—a way to make your online accounts more secure by requiring additional proof (“factors”), alongside your password , to log in. This means that even if someone has access to your password, they wouldn’t be able to get into your Apple account without this second factor. Apple accounts hold loads of sensitive data, including photos, contacts, notes, and just about anything else you’ve saved on your phone or iPad, so it’s crucial to secure it as best as possible. Once enabled, any time you want to log into a new Apple device, or log into your Apple account from a new web browser , you’ll need to enter a verification code on a “trusted device” (this might be your phone, laptop, or iPad, if you’ve logged into an Apple account there). If this sounds tedious, don’t worry too much. After running through the authentication process one time, you won’t be asked to enter the verification code again unless you sign out of a device completely or erase the device and start over. What to do Apple requires two-factor authentication for a number of features, including using Sign in with Apple, and Apple Pay, so you may have already turned this on. If you’re not sure if you’ve turned it on, it’s worth checking to make sure. Open Settings > [your name] > Sign-In & Security, then tap “Two-Factor Authentication” if it says “Off.” Follow the onscreen instructions to enable it. If you’ve already turned two-factor authentication on, you’ll see a screen with a list of any other devices you’ve signed into your Apple account on (like an iPad or laptop), as well as your phone number. This means two-factor authentication is enabled on your Apple account, and the devices listed can all be used as the second “factor” for verification. If you see any device here you no longer own or don’t recognize, you can remove it. If you’re at a high risk of targeted attacks, consider using a security key to lock down your Apple account even stronger. Security keys are phishing resistant, but carry the risk of locking you out of your account forever if you lose the key. Apple requires that you register two keys, a primary and a backup, for this reason. Here’s more information on how to set up a security key on your Apple account. Lock Your Phone Behind Biometrics and a Strong Passcode anchor link Why If your device is lost or stolen, or confiscated by police, “device encryption ” helps protect the data stored on your device. iPhones have device encryption capabilities built into them. What to do You should protect your iPhone with a strong password: 8-12 random characters that are easy to remember and type in when you unlock your device. If devices are not protected by a strong password, your phone will be easier to break into. To enable or change your passcode: Open Settings > Face (or Touch) ID & Passcode > then tap "Turn Passcode On" or "Change Passcode," then tap "Passcode Options" and choose the type or length of passcode you'd like to use. Once a passcode is set, you can choose to enable biometric login, using either your face or fingerprint , depending on which type of login your phone supports. This is optional and speeds up the process of unlocking your phone, but doesn’t have the same legal footing that passcodes do. Only you can decide if it's a safe choice to enable biometric login for your device, but if you want to turn it on, here’s how to do so: Open Settings > Face (or Touch) ID & Passcode. Follow the onscreen instructions to register your face or fingerprint. In the United States, using a biometric—like your face scan or fingerprint—to unlock your phone may compromise legal protections for the contents of your phone afforded to you under the Fifth Amendment privilege against compelled incrimination. Under current law—which is still in flux—using a memorized passcode generally provides a stronger legal footing to push back against a court order of compelled device unlocking/decryption. While EFF continues to fight to strengthen our legal protections against compelling people to decrypt their devices, there is currently less protection against compelled face and fingerprint unlocking than there is against compelled password disclosure. Audit Your Privacy Permissions anchor link Why Just about every app you download asks to access some sort of information about you or your device. This includes everything from obvious uses, like a camera app asking to access your camera and photos, to less obvious ones, like a newspaper app asking to access your local network. All these permissions can be hard to keep track of. For that reason, it’s good to go through and double-check app permissions now and again. Doing so can ensure you are not sharing any data you do not intend or need to share. Before auditing your privacy permissions, it’s a good idea to go through all your apps and delete any you don’t need. This makes the audit easier, and the fewer apps you have installed on your phone, the fewer chances there are for your data to end up in the wrong hands. What to do To get started, open Settings > Privacy & Security. Here, you’ll get to a page with an abundance of different permissions, each listing how many apps have access to that permission. Not all of these are only “on” or “off.” Some, like photos, location, and contacts, offer more nuanced permissions. It’s worth going through each of these to make sure you still want that app to have that permission. If not, revoke the permission. Don’t worry about breaking anything, you can always reverse the decision if an app loses functionality. These permissions are broken into a few different sections, and there are a lot of them. It’s worth going through them all, but the most important permissions to focus on are: Location Services Location services are one of the most critical permissions that many apps overstep in asking for. This permission gives apps access to your GPS location so it knows where you’re at. Take a look through your apps listed here and ask yourself if they really need your location in order to function. If not, then it’s worth disabling location access completely or limiting it to only when you have the app open. Location services have a lot of variety for when an app can access your location: Never: the app will not get any location information from your iPhone. Ask Next Time or When I Share: Any you open the app, it will ask for your location info. While Using the App: The app can only access your location information when you have the app open and when you close the app, it’ll stop getting that information. Always: The app will receive your location information all the time. You can also change how exact the location information an app gets is, granting access to either your precise location, or a more generalized location. Disabling the precise location option means the app will only be able to access your general location. Precise location is necessary for mapping apps in particular, but may not be needed for many others. System services: Scroll all the way to the bottom of the Location Services page and you’ll find “System Services.” These are operating system level services that mostly only communicate with Apple directly. Some, like “Find My iPhone,” are necessary for specific services to work. Others, like “Suggestions and Search” may not be as critical. You can read Apple’s explanation about these options here. One specific option you may want to consider disabling is “Significant Locations,” which stores the locations you go most often. Contacts If an app needs access to your contacts, you can either grant it full access—which provides the app with your entire contact list, including all the information stored on their contact card—or you can choose “Limited Access,” where you grant the app access to specific contacts. This is useful in situations where you want a communication app, like Signal or WhatsApp, to only have access to information about a handful of contacts to make connecting with them easier. Health This grants an app access to either read or write specific health data. After tapping an app’s name, you will see individual health permissions that you can toggle, like heart rate, steps, weight and more. Some apps will only request to write new information to the health apps, while others will ask for both the ability to read and write. Consider disabling any individual health details you do not think an app needs. Photos You can change a number of aspects around how apps access your photo roll: Full Access: an app can access your entire photo roll. Limited Access: you pick and choose specific photos an app gets access to. Add Photos Only: an app can only add photos to your camera roll. Private Access: the app doesn’t get access to your camera roll at all. If you want to upload a picture to the app, you’ll still get the photo picker menu, but it will never see anything else in your camera roll. Consider limiting access to your photo library in any app where you’d prefer some photos couldn’t get uploaded, even by accident. For example, if you use Slack at work, it may be best to limit access so you don’t accidentally upload your full set of vacation photos when you just intend to share one photo from the beach. Camera Here, you’ll find apps that have asked to access your camera. The most obvious use is third-party camera apps, but you may also see apps that use QR code scanning for two-factor authentication, notes apps, and more. If an app has access to your camera and you do not understand why, disable it. You can always turn it back on if you need to. Microphone For the most part, you’ll find only apps you use for voice calls or video here. But if there’s an app that appears to be accessing your microphone and you can’t figure out why, disable it. If this all seems like too much, you can also run through the “Safety Check,” feature, which, alongside providing a review process to see who you are sharing information with, also provides an option to reset all app permissions. You can find more information about this feature below. Disable Ad Tracking anchor link Why The ad identifier—aka “IDFA” on iOS— enables most third-party tracking on mobile devices. Disabling it will make it substantially harder for advertisers and data brokers to track and profile you, prohibit advertisers from tracking what you do across every app you use, and will limit the amount of your personal information up for sale. What to do If preventing advertisers from tracking you is important, you can disable the advertising ID entirely on an iPhone: Open Settings > Privacy & Security > Tracking, and set the toggle for “All Apps to Request to Track” to off. Apple also does some internal ad tracking of its own for some of its services, like the App Store and Apple News. You can also disable this: Open Settings > Privacy & Security > Apple Advertising, and disable “Personalized Ads.” Finally, if you use the default web browser, Safari, you might consider turning off “Privacy Preserving Ad Measurement,” which sends limited information to websites and advertisers about whether an ad was seen or clicked on: Open Settings > Apps > Safari > Advanced, and disable “Privacy Preserving Ad Measurement.” Set Up “Find My” anchor link Why Find My is best known as a tool that allows you to see the location of your iPhone if you lose it or it’s stolen. This is helpful, but the security and privacy benefits of setting this up are more about the assumption you won’t get your phone back. If you think your phone is long gone, you can remotely wipe it and delete everything on it. Once enabled, if you lose a device or it’s stolen, you can find it on a map, or more importantly, remotely wipe its contents. You can find directions for doing so here. What to do Open Settings > [your name] > Find My, then enable “Find My iPhone.” By its nature, Find My uses location information to find your phone. To do this, it uses a combination of Wi-Fi, cellular, and other nearby Apple devices with Bluetooth. Apple claims this information is end-to-end encrypted and private. There is always some risk with using any sort of location-based tracking that the information will leak or be used in a surprising way. Enable Stolen Device Protection anchor link Why As the name suggests, Stolen Device Protection attempts to mitigate the damage from a thief getting their hands on your phone. It does this by requiring biometric authentication for some settings, and more importantly, putting a timer on making any major alterations to your accounts, like changing your Apple Account password. Stolen Device Protection is designed specifically for situations where someone steals your phone and knows your passcode. This can happen if you’ve shared your passcode with someone, or if a person looks over your shoulder when you unlock your phone without you realizing it. With knowledge of your passcode, '''
