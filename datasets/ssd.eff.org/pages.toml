full_description = "Below are step-by-step tutorials to help you install and use handy privacy and security tools. Surveillance Self-Defense encourages you to think about online privacy and security in a sophisticated way. We want to give you the power to choose tools and habits that work for you. We creating a security plan before moving on to the following install guides. Please note that the law and technology can change quickly, and portions of SSD can become out of date. Check EFF’s Security Education blog posts for the latest news. How to: Use Tor How to: Get to Know Android Privacy and Security Settings How to: Get to Know iPhone Privacy and Security Settings How to: Enable Lockdown Mode on iPhone How to: Detect Bluetooth Trackers How to: Use WhatsApp How to: Use Tor on Android and iPhone How to: Use Signal How to: Encrypt Your iPhone How to: Encrypt Your Windows, Mac, or Linux Computer How to: Delete your Data Securely on Linux How to: Delete Your Data Securely on Windows How to: Delete Your Data Securely on macOS How to: Enable Two-factor Authentication How to: Avoid Phishing Attacks How to: Understand and Circumvent Network Censorship Below are step-by-step tutorials to help you install and use handy privacy and security tools. Surveillance Self-Defense encourages you to think about online privacy and security in a sophisticated way. We want to give you the power to choose tools and habits that work for you. We creating a security plan before moving on to the following install guides. Please note that the law and technology can change quickly, and portions of SSD can become out of date. Check EFF’s Security Education blog posts for the latest news."
