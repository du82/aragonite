ስ ሳይጠበቅብዎት አገልግሎቱን እንዲያገኙ ይረዳዎታል። የማሰሻ ጣት አሻራ መካነ ድር በሚጎበኙበት ጊዜ መካነ ድሩ ስለ መካነ ድር ማሰሻዎ ወይም የኮምፒዩተር ባህሪያት ሊያውቅ ይችላል፡፡ ምናልባት በመካነ ድሮች እና ኮምፒዩተሮች መጠነኛ ልዩነት ቢኖርም እርስዎ ምንም ወደ መለያ ባይገቡም እንኳን ኮምፒተርዎ ኩኪዎችን እንዲያስቀምጥ ባይፈቀዱም ወይም ከተለየ አውታረ መረብ ጋር ከበይነመረቡ ጋር ቢገናኙም እንኳን እርስዎ መሆነንዎን ለመለየት የሚያስችል መንገድ ሊኖር ይችላል፡፡ለምሳሌ እርስዎ በተለየ አንድ ቋንቋ በተሰናዳ መሣሪያ፣ በተለየ የስክሪን መጠን፣ በተወሰነ የድር ማሰሻ ስሪት የተወሰነ መካነ ድርን የሚጎበኝ ብቸኛ ሰው ሊሆኑ ይቻላሉ እንበል፡፡ ከዚያም መካነ ድሩ እርስዎ ማንነትዎን ለማሳየት ምንም ነገር ባያደርጉም እርስዎ በሚጎበኙበት ጊዜ ሁሉ እርስዎ መሆንዎን ሊገነዘቡት ይችላሉ፡፡ የምስጠራ ቁልፍ የምስጠራ ቁልፍ መልዕክትን ወደ ቅርጽ አልባ መልክ በመቀየር እንዳይነበብ የሚያደርግ ቅንጥብ መረጃ ነው። በአንዳንድ ኹኔታዎች መልዕክቱን ለመፍታት ተመሳሳይ የምስጠራ ቁልፍን መጠቀም ያስፈልጋል። በሌላ ኹኔታ ደግሞ መልዕክቱን የማመስጠሪያ ቁልፍ እና የመፍቻ ቁልፍ የተለያዩ ናቸው። የሰርጎ ገብ ጥቃት (MITM) የተመሰጠረ ፈጣን የመልዕክት አገልግሎትን ተጠቅመው ከጓደኛዎ ተኽላይ ጋር እያወሩ ነው እንበል። እየተነጋገሩ ያሉት በትክክል ከሱ ጋር እንደኾነ ለማጣራት ለመጀመሪያ ጊዜ የተገናኙት የት ከተማ ላይ እንደኾነ እንዲነግርዎት ይጠይቁታል። ‘ጅማ’ ብሎ ይመልስልዎታል። ይህም ትክክል ነው። እንደ አለመታደል ኾኖ ሁለታችሁ ሳታስተውሉት ሌላ ግለሰብ የመስመር ላይ ግንኙነታችሁን ጠልፎ ይሰማል። ለመጀመሪያ ጊዜ ከተኽላይ ጋር በመስመር ላይ ሲገናኙ በትክክል ከተኽላይ ጋር ሳይኾን ከዚህ ማንንቱ ከማይታወቅ ግለሰብ ጋር ኾኖ እሱ ደግሞ ከጓደኛዎት ተኽላይ ጋር ያገናኞታል። እርስዎ ጥያቄውን ያቀረብኩት ለተኽላይ ነው ብልው ሲያስቡ ጥያቄውን በእርግጥ የጠቁት ግን በመሃከል ለገባው ግለሰብ ነው። ግለሰቡም ጥያቄዎትን ተቀብሎ ለጓደኛዎ ለተኽላይ ያስተላልፋል። መልሱንም ተቀብሎ ለእርስዎ ይሰጣል። ምንም እንኳ ደህንነቱ በተጠበቀ መንገድ ከተኽላይ ጋር እንደሚገናኙ ቢያስቡም፤ እየተገናኙ ያሉት ግን ከሰላዩ ጋር ነው። በተመሳሳይ ተኽላይም እንዲሁ ያስባል። ይህ የሰርጎ ገብ ጥቃት ይባላል። በመሃል ሰርጎ በመግባት ስለላ የሚያካሂድ አጥቂ የእርስዎን ግንኙነቶች እንደ ፈለገ ከመሰለሉም ባሻገር በግንኙነትዎ መካከልም አሳሳች መልዕክቶችን ሊያስገባ ይችላል። ደህንነት ተኮር የኢንትርኔት ግንኙነት ሶፍትዌሮች ሁሉንም ዓይነት የኢንተርኔት ግንኙነቶች የመሰለል አቅም ካላቸው ከሰርጎ ገብ ጥቃቶች መከላከል አለባቸው። የሰነድ ማስተላለፍ ስምምነት ደንብ (FTP አገልጋይ) \ ሰነዶችን ከአንድ ኮምፒውተር ሌላ ራቅ ያለ ሥፍራ ወደሚገኝ ኮምፒውተር የማስተላለፊያ ቆየት ያለ መንገድ ነው። አብዛኞቹ የFTP ፕሮግራሞች (እና ፋይሎቹን የሚያጠራቅሙት የFTP አገልጋዮች ) ሥራ በድር መዳሰሻዎች እና በድር አገልጋዮች ወይም እንደ ድሮፕቦክስ ባሉ የፋይል ማዋደጃ ፕሮግራሞች ተተክተዋል። የሰነድ ስርዓት በኮምፒውተርዎ ላይ ወይም በሌላ መሣሪያዎት ላይ ውሂብዎት የሚጠራቀምበት ሥፍራ ነው። የሰነድ ስርዓት የግል ዶክመንቶችን እና ማስታወሻዎችን በቀላሉ እንዲገኟቸው የሚጠያራቅሙበት ስርዓት ነው። የስጋት ሞዴል ለውሂብዎ ምን ዓይነት ጥበቃን ማድረግ እንደሚፈልጉ በትኩረት የሚያስቡበት ብልሃት ነው። ከሁሉም ዓይነት ማታለሎች ወይም ጥቃቶች ራስን መከላከል አዳጋች ነው። ስለዚህ ውሂብዎን ምን ዓይነት ሰዎች ሊፈልጉት እንደሚችሉ፣ ከውሂቡ ምን ሊፈልጉ እንዳሰቡ እና እንዴት ሊያገኙት እንደሚችሉ በትኩረት ማሰብ ይኖርብዎታል። ምን አይነት ጥቃት ሊሰነዘርብኝ ይችላል ብሎ አስብዎ አስቅድሞ ጥቃቱን ለመከላከል ማቀድ የስጋት ሞዴል ይባላል። የስጋት ሞዴልዎን ከአወጡ በኋላ አደጋው የመድረሱን የመኾን ዕድል ትንተና ማካሄድ ይችላሉ። የቁልፍ መለዋወጫ ድግስ የአደባባይ ቁልፍ ምሰጠራን ሲጠቀሙ መልዕክቱን ለማመስጠር የሚጠቀሙት ቁልፍ ባለቤትነቱ የመልዕክቱ ተቃባይ መኾኑን እርግጠኛ መኾን ይኖርብዎታል (የቁልፍ ማረጋገጫን ይመልከቱ)። ለእዚህ ሂደት PGP የማቃለያ መንገድ አለው። ይህም ‘ይህ ቁልፍ ባለቤትነቱ የእዚህ ግለሰብ ነው ብዬ አምናለሁ እና እርስዎ የሚያምኑኝ ከኾነ እርስዎም ይህንኑ ይቀበሉ’። የአንድን ግለሰብ ቁልፍ ይህ ነው ብሎ በአደባባይ ማወጅ ‘ቁልፋቸውን መፈረም’ ይባላል። ይህ ማለት ማንኛውም ቁልፉን የሚጠቀም ሰው እርስዎ ስለቁልፉ ያወጁትን ይመለከታል ማለት ነው። ሁሉም ሰው እርስ በእርሱ ቁልፉን እንዲያረጋግጥ ለማበረታት የ PGP ተጠቃሚዎች የቁልፍ መፈረሚያ ድግሶች ያዘጋጃሉ። ድግሶቹ ድግስ ቢኾኑም እንደ ስማቸው የሚያስደስቱ አይደሉም። የቁልፍ ማረጋገጫ በአደባባይ ቁልፍ ስነመሰውር እያንዳንዱ ግለሰብ የቁልፎች ስብስብ አለው። ደህንነቱ የተጠበቀ መልዕክት ለመላክ የሚላክለትን ሰው ቁልፍ በመጠቀም መልእክቱን ያመሰጥሩታል። አጥቂዎች የእነርሱን ቁልፍ እንዲጠቀሙ ሊያታልሉዎት ይችላሉ። ይህ ማለት በታቀደለት ተቀባይ ፋንታ የላኩትን መልዕክት አጭበርባሪዎች ማንበብ ይችላሉ ማለት ነው። ይህ እንዳይከሰት የኾነ ቁልፍ በአንድ ግለሰብ ጥቅም ላይ እንደሚውል ማረጋገጥ ይኖርብዎታል። የቁልፍ ማረጋገጫ አንድ ቁልፍን ከአንድ ግለሰብ ጋር የሚያዛምዱበት ማንኛውም ዓይነት መንገድ ነው። የተጋላጭነት አዝማሚያ ትንተና በኮምፒውተር ደ'
