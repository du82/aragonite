full_description = '''< Further Learning A Deep Dive on End-to-End Encryption: How Do Public Key Encryption Systems Work? Last Reviewed: January 01, 2025 If you haven’t yet, we recommend reading a few guides before this one, to help cement some of the concepts discussed here: What Should I Know About Encryption?, Key Concepts of Encryption, and Key Verification. If used correctly, end-to-end encryption can help protect the contents of your messages, text, and files from being read by anyone except their intended recipients. End-to-end encryption tools make messages unreadable to eavesdroppers on the network, as well as to service providers themselves. They can also prove a message came from a specific person and was not altered. Once complicated to set up, end-to-end encryption tools are far more usable than they used to be. A secure messaging tool like Signal is a good example of an app that uses end-to-end encryption to encrypt messages between the sender and intended recipient while remaining easy to use. Even the largest platforms, like WhatsApp and Facebook Messenger support end-to-end encryption without you needing to do any sort of set-up ahead of time. The type of encryption we’re talking about in this guide, which end-to-end encryption tools rely on, is called public key cryptography (sometimes referred to as public key encryption ). Understanding the underlying principles of public key cryptography will help you to use these tools safely. There are limits to what public key cryptography can and can’t do, and it’s helpful to understand those limits What Does Encryption Do? anchor link Here’s how encryption works when sending a secret message: A clearly readable message is first encrypted into a scrambled message that is incomprehensible to anyone looking at it (“hello mum” turns into “OhsieW5ge+osh1aehah6”). The encrypted message is sent over the internet, where, if they’re watching, eavesdroppers would only see the scrambled message (“OhsieW5ge+osh1aehah6”). When it arrives at its destination, the intended recipient, and only the intended recipient, has some way of decrypting it back into the original message (“OhsieW5ge+osh1aehah6” is turned back into “hello mum”). Symmetric Encryption: A Story of Passing Secret Notes with a Single Key anchor link Let’s start with an example from history: the Caesar cipher. Julia wants to send her friend César a note saying: “Meet me in the garden.” But she doesn’t want her classmates to see it. If Julia passes the note along as-is, it gets passed through a bunch of intermediary classmates before reaching César. Although neutral, the intermediaries are still nosy, and can sneak a peek at the message before passing it on. They can also make copies of the message before passing it on and record the time Julia sends her message to César. So, to protect the privacy of the conversation, Julia could decide to encrypt her message with a "key of three," shifting the letters down the alphabet by three. For example, A would be D, B would be E, and so on. If Julia and César use a simple key of three to encrypt, and a key of three to decrypt , then their gibberish encrypted message might be enough to fool their classmates—but is still easy to crack. Any of their classmates could “brute force” the key by trying all the possible combinations until they figured out a word or two. In other words, they can persistently guess until they get the answer to decrypt the message. The method of shifting the alphabet by three characters is a historic example of encryption used by Julius Caesar, hence, the Caesar cipher. When there is one key to both encrypt and decrypt, like in this example, it is called symmetric cryptography . The Caesar cipher is a weak form of symmetric cryptography. Thankfully, encryption has come a long way since then. Instead of just shifting the letters of a message by a few characters, keys can now use math and the help of computers to create a long string of numbers that’s much harder to decode. Symmetric cryptography has many practical purposes, but doesn’t address the following issues: What if someone can eavesdrop and wait for Julia and César to share the key, then steal the key to decrypt their messages? What if they wait for Julia and César to reveal somehow that the secret for decrypting their messages was the key of three? How can César and Julia get around this problem? The best answer today is public key cryptography. In public key cryptography, encryption and decryption keys are different, and it’s perfectly safe to share the public key as long as the private key is kept private. Public Key Cryptography: A Tale of Two Keys anchor link Let’s look at the problem more closely: How does the sender send the symmetric key to the recipient without someone spying on that conversation too? Public-key cryptography (also known as asymmetric cryptography) has a neat solution for this. It allows each person in a conversation to create two keys: a public key and a private key. The two keys are connected and, despite the name, aren’t “keys” so much as they’re very large numbers with certain mathematical properties. If you encode a message using a person’s public key, they can decode it using their matching private key. Now, Julia and César have moved past sending paper notes in class and are using their computers to send encrypted messages using public key cryptography. All the classmates who were passing the notes in the previous example are replaced with the computers that act as the intermediaries between Julia and César: Julia and César’s respective Wi-Fi points, internet service providers, and their email servers. In reality, it may be hundreds of computers between Julia and César that facilitate this conversation, and just like the nosy classmates, these intermediaries make and store copies of Julia and César’s messages each time they pass through. They don’t mind that the intermediaries can see them communicating, but they want the contents of their messages to remain private. First, Julia needs César’s public key. César sends his public key over an insecure channel, like unencrypted email. (Good news: modern communication apps will do this on César’s behalf, removing the manual step, but the manual steps are still a good example of how this works.) César doesn’t mind if the intermediaries get access to it because the public key is something that he can share freely (the key metaphor breaks down around here; it’s not quite right to think of the public key as a literal key; again: it's a very large number with certain mathematical properties, often encoded as a string of characters). To be safe, César sends his public key over multiple channels, an email and a text message, so it’s harder for intermediaries to send one of their own public keys on to Julia instead. Julia receives César’s public key file. Now, Julia can encrypt a message to him. She writes, “Meet me in the garden.” She sends the encrypted message. It is encrypted only to César. Both Julia and César can understand the message, but it looks like gibberish to anyone else who tries to read it. But the intermediaries can still see metadata , like the subject line, dates, sender, and the recipient. Because the message is encrypted to César’s public key, it is only intended for César and the sender (Julia) to unlock and read the contents of the message. César can read the message using his private key. To recap: Public key cryptography allows someone to send their public key in an open, insecure channel. Nowadays, communication apps handle this step for you. Having a friend’s public key allows you to encrypt messages to them. Your private key is used to decrypt encrypted messages meant for you. Intermediaries such as the email service providers, internet service providers, and those on their networks are able to see metadata this whole time. This includes details like who is sending what to whom, what time it’s received, what the subject line is, that the message is encrypted, and so on. Another Problem: What About Impersonation? anchor link In the example with Julia and César, the intermediaries are able to see metadata this whole time. But let’s say that one of the intermediaries is a bad actor. By bad actor, we mean someone who intends to harm you by trying to steal or interfere with your information. This bad actor wants to spy on Julia’s message to César. Let’s say this bad actor is able to trick Julia into grabbing the wrong public key file for César. Julia doesn’t notice that this isn’t actually César’s public key. So instead of César, the bad actor actually receives Julia’s message, peeks at it, then passes it along to César. The bad actor could decide to change the contents of the file before passing it along to César. For example, they could change "Meet me in the garden," to "Meet me in the cafeteria." But most of the time, the bad actor decides to leave the contents unmodified. So, the bad actor forwards Julia’s message to César as though nothing happened, César knows to meet Julia in the garden, and gasp, to their surprise, the bad actor is there too! This is known as a "man-in-the-middle attack " or a "machine-in-the-middle attack ." Luckily, public key cryptography has a method for preventing man-in-the-middle attacks through something called “fingerprint verification.” This is best done in real life when possible. You’d have your public key fingerprint available, and your friend double-checks that every single character from your public key fingerprint matches what they have for your public key fingerprint. It’s a little tedious, but it’s worth doing. Different end-to-end encrypted apps also have a way to check for fingerprints, though there are variations on what the practice is called and how it is implemented. In some instances, you’ll read each character of the fingerprint carefully and ensure it matches what you see on your screen versus what your friend sees on their screen. In others, you might scan a QR code on another person’s phone to “verify” their device.” In the example below, Julia and César are able to meet in person to verify their phone fingerprints by scanning each other’s QR codes using their phone’s camera. For an example of what this method looks like in practice, check out Signal's "Verify safety number" option or WhatsApp's "Verify security code" feature. If you don’t have the luxury of meeting in person, you can share your fingerprint through another secure channel, like another end-to-end encrypted messaging app or on a video call. In the example below, César sends his public key fingerprint to Julia using a different end-to-end encrypted app on his smartphone. To review: A man-in-the-middle attack is when someone intercepts your message to someone else. The attacker can alter the message and pass it along or choose to simply eavesdrop. Public key cryptography lets you address man-in-the-middle attacks by providing ways to verify the recipient and sender’s identities. This is done through "fingerprint verification." In addition to being used to encrypt a message to your friend, your friend’s public key also comes with a “public key fingerprint.” You can use the fingerprint to verify your friend’s identity. The private key is used to encrypt messages, as well as to digitally sign messages as being from you (more on this below). Signatures anchor link We know that if you encrypt a message with a certain public key, it can only be decrypted by the matching private key. The opposite is also true: if you encrypt a message with a certain private key, it can only be decrypted by its matching public key. Why would this be useful? Suppose you wrote a message that said: “I promise to pay Aazul $100,” and then turned it into a secret message using your private key. Anyone could decrypt that message. But only one person could have written it: the person who has your private key. And if you’ve done a good job keeping your private key safe, that means you, and only you, could’ve written it. By encrypting the message with your private key, you’ve ensured it could only come from you. In other words, you’ve done the same thing with this digital message as we do when we sign a message in the real world, which is why this process is known as “signing” a message. Signing is also one of several methods that can make messages tamper-proof. If someone tried to change your message from “I promise to pay Aazul $100” to “I promise to pay Ming $100,” they would not be able to re-sign it using your private key. A signed message guarantees it originated from the correct source and wasn't messed with in transit. In Review: Using Public Key Cryptography anchor link Let’s review. Public key cryptography lets you encrypt and send messages safely to anyone whose public key you know. If others know your public key: They can send you secret messages that only you can decode using your matching private key. You can sign your messages with your private key so the recipients know the messages could only have come from you. Nowadays, messaging apps handle your public and private keys and have a more user-friendly mechanism for verifying those keys, making it easy for anyone to use public key cryptography without even realizing they’re using it. And if you know someone else’s public key: You can decode a message they signed and know it truly came from them. Public key cryptography becomes more useful when more people know your public key. You can share your public key with anyone who wants to communicate with you, it doesn’t matter who sees it. The public key comes paired with a file called a private key. You can think of the private key like an actual key that you should protect and keep safe. Your private key is used to both encrypt and decrypt messages. If your private key is accidentally deleted from your device, you won’t be able to decrypt your encrypted messages. If someone copies your private key (whether by physical access to your computer, malware on your device, or if you accidentally share your private key), then others can read your encrypted messages. They can pretend to be you and sign messages claiming they were written by you. It’s not unheard of for governments to steal private keys from important people's computers (by taking the computers away or by installing malware on them using physical access or phishing attacks). This undoes the protection private key cryptography offers. This is like saying you have an unpickable lock on your door, but somebody can pickpocket your key, copy it, and then sneak it back into your pocket. Then, they’d be able to get into your house without picking the lock. This goes back to your security plan: determine what your risks are and address them appropriately. If you feel like someone would go through great trouble to try to get your private key, you may not want to use an in-browser solution to end-to-end encryption. Instead, you may choose to store your private key on your o'''
