description = "አይፎን 3GS ወይም ከዛ በላይ፣ አይፓድ ተች 3rd ሊኒክስ ion ወይም ከዛ በላይ፣ ወይም ማንኛውም አይፓድ ካለዎት ምስጠራን በመጠቀም የመሣሪያዎትን ይዘት ከአደጋ መከላከል ይችላሉ። ይህም ማለት አንድ ሰው የመሣሪያዎትን ቁሳዊ ይዞታ ማግኘት ቢችል እንኳ በውስጡ የተጠራቀመውን ውሂብ ማለትም ዕውቂያዎችዎን፣ አጭር የጽሑፍ መልዕክትዎትን ወይም ጽሐፍዎችዎን፣ የስልክ ጥሪ ምዝገባዎን እና ኢሜልዎን ለመፍታት..."
full_description = '< የመሣሪያ መመሪያዎች አይፎንዎን ማመስጠር Last Reviewed: March 26, 2018 This page was translated from English. The English version may be more up-to-date. አይፎን 3GS ወይም ከዛ በላይ፣ አይፓድ ተች 3rd ሊኒክስ ion ወይም ከዛ በላይ፣ ወይም ማንኛውም አይፓድ ካለዎት ምስጠራን በመጠቀም የመሣሪያዎትን ይዘት ከአደጋ መከላከል ይችላሉ። ይህም ማለት አንድ ሰው የመሣሪያዎትን ቁሳዊ ይዞታ ማግኘት ቢችል እንኳ በውስጡ የተጠራቀመውን ውሂብ ማለትም ዕውቂያዎችዎን፣ አጭር የጽሑፍ መልዕክትዎትን ወይም ጽሐፍዎችዎን፣ የስልክ ጥሪ ምዝገባዎን እና ኢሜልዎን ለመፍታት የይለፍ ኮድ ያስፈልገዋል ማለት ነው። በእውነቱ ከኾነ አብዛኛዎቹ ዘመናዊ የአፕል መሣሪያዎች በተለያየ የደህንነት ደረጃ በነባሪው ይዘታቸው ማመስጠር ይችላሉ። ነገር ግን አንድ ሰው መሣሪያዎን በመስረቅ ከሚያደርገው የውሂብ ስርቆት ራስዎን ለመከላከል ይህን ምስጠራ እርስዎ ብቻ በሚያውቁት የማለፊያ ሐረግ ወይም ኮድ መዝጋት ያስፈልግዎታል። ከአይኦኤስ 4- አስከ አይኦኤስ 7 ለሚጠቀሙ ኮምፕዩተር ነክ መሣሪያዎች: General settings ይክፈቱ እና Passcode (ወይም iTouch እና Passcode) የሚለውን ይምረጡ፡፡ የይለፍ ኮድ ለመፍጠር ያሉትን መጠየቂያዎች ይከተሉ፡፡ ከአይኦኤስ 8 እስከ አይኦኤስ 11 ለሚጠቀሙ ኮምፕዩተር ነክ መሣሪያዎች: የመተግበሪያውን Settings ይክፈቱ የንክኪ መታወቂያ እና Passcode መታ ያድርጉ የይለፍ ኮድ ለመፍጠር ያሉትን መጠየቂያዎች ይከተሉ፡፡ የእርስዎ መሣሪያ አይኦኤስ 8 የሚጠቀም ከሆነ ከአራት አኃዝ በላይ ያለው ኮድ ለመፍጠር Simple Passcode እንዳይሰራ ያድርጉ፡፡ አፕል አይኦኤስ 9ን ሰርቶ ለገበያ ካዋለ በኋላ ባለ 6 አኃዝ የየይለፍ ቃልን በመደበኛነት መጠቀምን አስገዳጅ አድርጓል፡፡ ሁሉም ቁጥሮች ብቻ የሆነ የይለፍ ቃል ከመረጡ ስልክዎን ለመክፈት በሚፈልጉ ሰዓት የቁጥሮች መተየብያ ሰሌዳ ያገኛሉ፤ ይህም ምናአልባት በትንሽ ስክሪኖች ፊደላት እና ምልክቶችን ከመተየብ ይበልጥ ቀላል ይሆናል፡፡ ይሁን እንጂ ቁጥሮች እና ፊደላትን የያዘ እና ከስድስት በላይ አኃዝ ያለው የይለፍ ኮድ እንዲጠቀሙ እንመክራለን፡፡ ምንም እንኳን የአፕል ሃርዴዌር የይለፍ ቃል ሰባሪ መሣሪያዎችን እንዲያዘገይ ተደርጎ ቢሰራም ስብሮ ለመግባት የበለጠ አስቸጋሪ ማድረጉ ጥሩ ነው፡፡ የይለፍ ኮድዎን ለማበጀት "Passcode Options" የሚለውን ከዚያም "Custom Alphanumeric Code." የሚለውን ይምረጡ፡፡ ከዚህ በፊት ይገለገሉበት የነበረውን የይለፍ ኮድ ለማስተካከል ከፈለጉ “Change Passcode” የሚለውን ከዚያም “Passcode Options.”ን ይምረጡ፡፡ “Require passcode” የሚለውን ወደ “Immediately” ይቀይሩ፡፡ ይህም በማይጠቀሙበት ወቅት መሣሪያዎ ክፍት ሆኖ እንዳይቆይ ያርጋል፡፡ አንዴ የማለፊያ ኮዱን ካስገቡ በኋላ ወደታችኛው የይለፍ ቃል ቅንብር ገጽ ይውረዱ። እዚህ ጋር ሲደርሱ “Data protection is enabled” የሚል መልዕክት ሊያዩ ይገባል። ይህ ማለት የመሣሪያው ማመስጠሪያ ከይለፍ ኮድዎ ጋር ተያይዟል ማለት ነው፡፡ በመኾኑም በስልክዎት ላይ የሚገኙ አብዛኞቹን ውሂቦች ለመክፈት ኮዱ ያስፈልጋል ማለት ነው። የግል ውሂብን በጥቅም ላይ ለማዋል ሊያስቧቸው የሚገቡ ሌሎች የiOS ገጽታዎች እዚህ ቀርበዋል፦ anchor link አይቲዩን የመሳሪያዎን ይዘት በኮምፒውተርዎ ላይ መጠባበቂያ ማስቀመጥ የሚያስችል ምርጫ አለው። አይቱንስ የመጠባበቂያ ቅጂዎችን በመደበኛነት አያመሰጥርም፡፡በመሳሪያዎ በአይትዩን “ሰመሪ” ትር ላይ “ኢንክሪፕት ባክአፕ” የሚለውን ከመረጡ አይትዩን በጣም ሚስጥራዊ የኾኑ መረጃዎችን (ልክ እንደ የWi-Fi የይለፍ ቃል እና ኢሜል የይለፍ ቃል) መጠባበቂያ ያስቀምጣል። በኮምፒውተርዎ ላይ ከማስቀመጡ በፊት ግን ያመሰጥረዋል። እዚህ ጋር የተጠቀሙትን የማለፊያ ቃል በደንብ ማስቀመጥዎን ያረጋግጡ። ውሂብዎን ከመጠባበቂያ መልስዎ ማግኘት አብዛኛውን ጊዜ የማይከሰት ኹኔታ ቢኾንም በድንገተኛ ጊዜ መጠባበቂያውን የሚከፍትልዎ የይለፍ ቃልን ማስታወስ ካልቻሉ በጣም አድካሚ ነው። በአፕል አይክላውድ ላይ መጠባበቂያን ካስቀመጡ ውሂቡን ከአደጋ ለመጠበቅ ረዥም የማለፊያ ሃረግ መጠቀም እና የማለፊያ ሃረጉን በሚያስተማምን ቦታ ማስቀመጥ አለብዎት። አፕል ብዙውን ውሂብ በመጠባበቂያዎቹ ላይ ቢያመሰጥርም ኩባንያው ውሂብዎትን ለሕግ አስፈጻሚ አካላት አሳልፎ ሊሰጥ ይችላል (በተለይም በሚጻፉበት ወቅት ሳይመሰጠሩ የተጠራቀሙ ኢሜል እና ማስታወሻዎች)። ከላይ በተጠቀሰው መሰረት የውሂብ ጥበቃን ካስቻሉ በመሳሪያዎ ላይ ያለ ውሂብን ደህንነቱ በተጠበቀ መንገድ እና በፍጥነት መሰረዝ ይችላሉ። በፓስኮድ ማዋቀሪያ ውስጥ ከአስር የተሳሳተ የማለፊያ ሃረጎዎት ሙከራ በኋላ በመሳሪያዎ ላይ የሚገኘውን ውሂብ ሙሉ በሙሉ እንዲያጠፋ አድርገው ማዋቀር ይችላሉ። ይህን ካደረጉ ማንም ሰው የእርስዎን የይለፍ ኮድ ሆን ብሎ በተሳሳተ መንገድ ካስገባ የስልክዎ ምትክ ፋይል እንደተቀመጠ እርግጠኛ ይሁኑ፡፡ በበአፕል ቆየት ያለ የሕግ ማስፈጸም መመሪያ መሠረት “አፕል በማለፊያ ኮድ ከተቆለፉ ስልኮች በተወሰነ ክፍል (ካታጎሪ) ውስጥ የሚገኙ ውሂቦችን ማውጣት ይችላል። በተለይም በiOS መሣሪያ ላይ በተጠቃሚው የተመረቱ በአፕል መተግበሪያዎች ውስጥ ያሉ ንቁ ፋይሎች እናም ውሂቦች (“በተጠቃሚው የተመረቱ ንቁ ፋይሎች”) የይለፍ ኮድን በመጠቀም የተመሰጠሩ ስላልኾነ ከስልኩ ላይ ማውጣት እና በውጭ ማህደረ መረጃ ለሕግ አስፈጻሚ አካላት ሊሰጥ ይችላል። iOS 4 ወይም ከዚያ ቅርብ በሆኑ የiOS ስሪቶች ላይ አፕል ይህንን የውሂብ ማውጣት ሂደትን ማከናወን ይችላል። እባክዎን፣ ለሕግ አስፈጻሚ አካላት ሊሰጡ የሚችሉት በተወሰነ ክፍል ውስጥ ያሉ በተጠቃሚው የተመረቱ እንደ አጭር የጽሁፍ መልዕክቶች፣ ፎቶዎች፣ ቪዲዮዎች፣ እውቂያዎች፣ የድምጽ ቅጂዎች፣ እና የጥሪ ታሪክ ያሉ ንቁ ፋይሎች ብቻ መኾናቸውን ይገንዘቡ። አፕል እንደ ኢሜል፣ የቀን መቁጠሪያ ምዝገባዎች፣ ወይም የሦስተኛ አካል መተግበሪያ ውሂብን መስጠት አይችልም።” ከላይ የተጠቀሰው መረጃ የሚሰራው ከiOS 8.0 በፊት ያሉ ስሪቶችን በሚጠቀሙ የiOS መሣሪዎች ብቻ ላይ ነው። "ከአይኦኤስ 8.0 እና ከዚያ በኋላ ያሉ በሁሉም ስሪቶች፣ አፕል በህግ አስፈጻሚው እንደተመሰጠረ ስለሚወሰድ ከአይኦኤስ መሣሪየዎች ውሂብ ማውጣት አይችልም፡፡ አፕል ምስጠራውን መፍቻ ቁልፍም የለውም፡፡” ያስታውሱ፦ አፕል ከስልክዎት በቀጥታ ውሂብ ማውጣት የማይችል ቢኾንም መሳሪያው ከአይክላውድ ጋር በጥምረት እንዲሰራ ተደርጎ ከተዋቀረ፣ ወይም በኮምፒውተርዎ ላይ በተጠባባቂነት የተቀመጠ ከኾነ አብዛኛው ተመሳሳይ ውሂብ ለሕግ አስከባሪ አካላት በእርግጥ ሊገኝ ይችል ይኾናል። ብዙውን ጊዜ የiOS ምስጠራ ውጤታማ የሚኾነው መሣሪያው ሙሉውን ከጠፋ (ወይም ክፍቱን ሳይተው እንደ አዲስ ዳግም ከተነሳ) ብቻ ነው። አንዳንድ አጥቂዎች መሳሪያዎ ክፍት ኾኖ ሳለ ጠቃሚ ውሂብን ከማህደረ ትውስታ ውስጥ ሊውሰዱ ይችላሉ። (መሣሪያው ጠፍቶ እያለ እንኳን ውሂብን ሊውስዱ ይችላሉ)። ይህንን አውቀው ከተቻለ መሣሪያዎ በሌሎች ሰዎች ሊያዝብዎ ወይም ሊሰረቅ እንደሚችል በሚያስቡበት ወቅት መሣሪያዎ መጥፋቱን (ወይም ዳግም የተነሳ እና ክፍት እንዳልኾነ) ለማረጋገጥ ይሞክሩ። ይህ መመሪያ ሲወጣ ጥቂት ኩባንያዎች የአይፎኖች የይለፍ ኮዶችን ለህግ አስፈጻሚዎች መስበር እንደቻሉ ተናግረዋል፡፡ ነገር ግን ከዚህ መረጃ ጋር የተያያዙ ዝርዝሮች ግልጽ አይደሉም፡፡ መሣሪያዎ እንዳይጠፋ ወይም እንዳይሰረቅ የሚሰጉ ከኾነ“Find My iPhone” የሚባለውን ገጽታ በመጠቀም ከሩቅ ሥፍራ ኾነው ማጥፋት እንዲችሉ አድርገው የአፕል መሣሪያዎን ማዋቀር ይችላሉ። ይህ አፕል ከሩቅ ኾኖ በማንኛውም ሰዓት መሣሪያዎት ያለበት ሥፍራ የት እንደኾነ መጠየቅን እንደሚፈቅዱለት ይገንዘቡ። መሳሪያዎት ከቁጥጥርዎት ውጪ ቢኾን ውሂብን መሰረዝ ያለው ጥቅምን እና ያሉበትን ቦታ በመግለጽ የሚከተለውን ተጋላጭነት ማወዳደር አለብዎት። (የተንቀሳቃሽ ስልኮች ይህንን መረጃ ለአገልግሎት ሰጪ ኩባንያዎች ሲያስተላልፉ እንደ አይፓድ እና አይፖድ ተች ያሉ የWi-Fi መሳሪያዎች ግን አያስተላልፉም።)'
