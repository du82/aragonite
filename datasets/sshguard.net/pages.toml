full_description = "Internet-connected hosts are subject to constant probing and attacks from malicious actors. Brute-force attacks represent a large threat to account compromise for hosts and their networks. Blocking brute-force attackers at the firewall level reduces system load and log noise, especially for high-traffic and deeply embedded systems. SSHGuard monitors system log files and journal logs. It can work with multiple log sources, including: SSHGuard parses logs for recognized attacks. Unlike other brute-force blockers, SSHGuard's parser is: SSHGuard doesn't lock you out. By default, attackers are unblocked after a certain amount of time. But if you chose, you can configure blacklisting to block attackers permanently."
