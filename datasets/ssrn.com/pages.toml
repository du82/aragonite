full_description = '''In cooperation with Lovely Professional University School of Computer Science and Engineering, the Computer Science Research Network (CompSciRN) is pleased to announce the KILBY 100 7th International Conference on Computing Sciences 2023 eJournal. This eJournal is available to all subscribers at no charge and contains abstracts of the meeting papers with links to the full text in the SSRN eLibrary. The year 2023 marks the 100th birth anniversary of Jack Kilby, an American electrical engineer and inventor best known for his contribution to the development of the microchip. He was born on November 8, 1923, in Jefferson City, Missouri, USA. Kilby's invention of the microchip in 1958 revolutionized the electronics industry, making it possible to produce integrated circuits in high volumes and at low cost. His innovation paved the way for the modern computer and information technology revolution. Kilby received the Nobel Prize in Physics in 2000 for his work in this field. The School of Computer Science and Engineering, under the aegis of Lovely Professional University, pays homage to this great engineer by hosting "KILBY100" - 7th International Conference on Computing Sciences. View Papers: https://www.ssrn.com/link/KILBY-100-7th-Intl-Conference-2023.html Subscribe: https://hq.ssrn.com/jourInvite.cfm?link=KILBY-100-7th-Intl-Conference-2023 Conference URL: https://conferences.lpu.in/iccs/index.php HOW TO SUBSCRIBE You can subscribe to this area at no cost, by clicking on the "subscribe" link listed above. Modify or change your SSRN Subscriptions. For instructions on how to change subscriptions view the SSRN Support Center. Questions? Please visit the SSRN Support Center to access live chat assistance or use our email ticketing system. SSRN's LIBRARY SSRN's searchable library contains abstracts, full bibliographic data, and author contact information for more than 1.4 million papers, more than 1.9 million authors, and full text for more than 1.3 mill