["https://ssushant.in/posts/supply_chain_analytics_retro"]
title = "Supply Chain Analytics Edx Course - A Retrospective · Random Tech Excursions"
description = "Retrospective on the course - Supply Chain Analytics"
full_description = 'My Development Notes/Posts/Supply Chain Analytics Edx Course - A Retrospective/Supply Chain Analytics Edx Course - A Retrospective30 December 2016·2 minsI enrolled in the course “Supply Chain Analytics” from MIT on Edx. The course was about analytical methods that are useful to Supply Chain Professionals in their line of work. The course entailed Mathematical Modeling and Reasoning about uncertainty using the calculus of Probability. Here are my notes from the course and some salient points:Linear Programming #Supply Chain Designers make use of Linear programming for designing delivery network with the shortest route or other properties. I had used glpk in the past for solving linear programming problems like shortest path. Recently, I came across Julia’s excellent JuMP package for optimization. The package uses Julia’s metaprogramming chops to create a DSL for optimization. An added advantage is that when we use the package, we have Julia’s excellent libraries and programming constructs at our disposal. I blogged about some of them as well:Using Julia for Linear ProgrammingUsing Julia for Non Linear OptimizationR #R is the language du jour of statisticians. If you happen to use a statistical workflow, it is very likely that someone has written an R package for it.A helpful introduction about the analysis of Categorical Variables. [PDF Alert]Discrete Event Simulation #An excellent revelation in the course was discovery of R’s simmer package for building discrete event simulation models, especially Queuing theory models. The course’s original recommendation was Anylogic, but I was looking for a library or package which gives programmatic control. I came across SimPy and SimJulia, both of which are excellent packages, but I found R’s simmer package closer to what I was looking for. Simmer’s workflow is focused around Resources and trajectory which takes some time to get used to, but it has excellent documentation.I made a notes-like draft for skimming through important concepts. You can find the document here: SCA-NotesOverall, I found the course insightful.←→ Frequency Tables in Julia 17 December 2016 Tweets about Software Design 13 March 2017 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
