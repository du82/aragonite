full_description = 'My Development Notes/Posts/Automating openssl req with a config file/Automating openssl req with a config file26 May 2015·1 minThe other day I was trying to generate a Certificate Signing Request using the openssl command . The openssl command supports a lot of commands, and if you are like me, you always have difficulty remembering them.req, x509 and ca commands from openssl support providing options using an INI-style configuration file. The config file option is useful when running openssl commands in batch mode. The batch mode operation saves time when you are trying to automate a series of steps using bash, one of which involves using the opnessl command to generate a CSR or sign a certificate.Let us suppose you want to generate a CSR for your server. You use a command like so:You will then enter an interactive mode where you will need to enter details like Country, Organization Unit etc.To automate this, you can create a INI-style config file csr.conf.You can then generate your CSR like so:SERVER=www.orom-staging.in openssl req -nodes -config csr.conf -out orom-staging.in.csr ←→ Test Driven Development for Machine Learning projects 29 December 2014 Extracting public key from pem file 28 May 2015 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
