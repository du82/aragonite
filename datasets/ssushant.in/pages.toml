["https://ssushant.in/posts/initialize-libraries-android-dagger"]
title = "Initialize Libraries in an Android Dagger App · Random Tech Excursions"
description = "Initialize Libraries in an Android Dagger App"
full_description = 'My Development Notes/Posts/Initialize Libraries in an Android Dagger App/Initialize Libraries in an Android Dagger App28 August 2017·1 minMany libraries like Admob on Android require a one-time initialization snippet code to be run. Now, the initialization code is a one-time run, and does not return any object. This is not a factory method. A convenient place that I found happened to be inside the applicationInjector method in the class which extends DaggerApplication.As an example, here I initialize Admob inside the applicationInjector like so:@Override protected AndroidInjector<? extends DaggerApplication> applicationInjector() { AppComponent appComponent = DaggerAppComponent.builder().application(this).build(); appComponent.inject(this); MobileAds.initialize(this, "ca-app-pub-3940256099942544~3347511713"); return appComponent; } Perhaps you can extract a private method to initialize library code like so:@Override protected AndroidInjector<? extends DaggerApplication> applicationInjector() { AppComponent appComponent = DaggerAppComponent.builder().application(this).build(); appComponent.inject(this); initializeLibraries(); return appComponent; } private void initializeLibraries() { MobileAds.initialize(this, "ca-app-pub-3940256099942544~3347511713"); } and you can conveniently place the initialize snippets inside the initializeLibraries method. Now, there might be a better place to place these snippets, maybe inside a lifecycle method, but this seems to work.←→ Android Libraries Du Jour 20 August 2017 Experience Report - NYTimes Marvin for building Microservices on Appengine 1 September 2017 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
