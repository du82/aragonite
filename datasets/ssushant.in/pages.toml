["https://ssushant.in/posts/jvm_dotnet_ecosystems"]
title = ".NET and Java - Two Households Alike In Dignity · Random Tech Excursions"
description = ".NET and Java - Two Households Alike In Dignity"
full_description = 'My Development Notes/Posts/.NET and Java - Two Households Alike In Dignity/.NET and Java - Two Households Alike In Dignity2 February 2022·4 minsIn which I extol the virtues of the .NET EcosystemI have been developing in Java for a long time. I have also worked on Python and Ruby, but for the most part I have worked in Java. Lately, I had work come in my way that requires knowing .NET and related tools. I am comfortable in the JVM space. I embarked on my .NET learning journey with much trepidiation. I was entering terra incognita. What came as a surprise, is that the .NET ecosystem now is more open than before. For example, you can now .NET applications on Linux - without using the MONO Runtime. .NET is also getting much love from open source developers. The platform has gone from being the bete noire for the open source cabal to being the pupillam oculorum (that’s apple of the eyes) of the open source ecosystem.Everything Is Awesome Now (For the Most Part) #While I feel that the cross platform .NET ecosystem in on-par with such disruptive innovations like the sliced-bread, I wanted to sum up the key points under three headers - Documentaion, CLI (Command-line interface - the dotnet command), and C#.Documentation #.NET documentation is one of the best documentation for any platform right now. Need a tutorial-like quick-start guide for getting up and running with web api? There is a documentation for that. Need to grok the C# language in depth? There are docs for that. The docs are self-contained reference books and tutorials.The documentation is very state-of-the-art. You can find documentation for common architectural patterns like CQRS, DDD. The cloud architecture documentation for Azure is a must-read even if you’re not planning to use Azure for your services. The patterns are robust and general - they can be carried over to any cloud platform.CLI #I consider the dotnet command to be the crown-jewel of the .NET ecosystem. You can create projects, update dependencies, run tests, build the project, create a new template, install additional tooling using the same command (of course different subcommands). For example, you can create a solution that has a console application, a grpc service, a web-api project using ASP.NET without launching your graphical IDE. I recall that Rails was one of the first projects since I started working that provided scaffolding using the cli-subcommands, and developers quickly warmed up to the idea. The convenience cannot be overstated. The scaffolds are not limited to projects, you can for example create a scaffold for gitignore that you can use across different projects.You can also install third-party tooling using the dotnet command. For example, you can install a third party tool which analyses your projects for vulnerabilities, and then run it on your repo using the tool command. Needless to say that this has spanned an ecosystem of templates and scaffolds, a lot of them are housed in nuget.org.C# #C# is a pleasant language to use. I knew for a long time that C# is at the forefront of including advanced constructs like lambda, async-await. Using them in projects is pleasant, so much so that I wonder why Java does not have these convinient features.Warts and All #It is not all hunky-dory in the dotnet world. Take for example the state of desktop development. WPF is the de facto framework for writing Desktop apps, or it was until recently. The desktop development paradigm has been in a state of churn. I read conflicting messaging about which framework to use for a new desktop project. The recommendations ranged from UWP to WinUI3. UWP is heading towards deprecation, and WinUI3 is still in preview as of now. Another case in point - I ran into many issues when trying to run a console app. Granted I was using an M1 mac, and the beta release - so that was a double whammy. Here are the steps I followed:Installed .NET 6 on M1 MacRan into an error - ASP.NET library was not foundEdited the file location /etc/dotnet/install_location to specify the location.dotnet --roll-forward Major bin/Debug/netcoreapp3.1/newconsoleapp.dll --roll-forward Major was recommended here: Running a .NET 5 project on macOS M1 with .NET 6 leads to confusing error messageWith time I foresee that the issues will be ironed out. For example, when I ran into the issue the issue was still open, but the developers quickly brought it to closure.I see the question pops up on Hacker News asking people what would they choose as their modern development stack. My answer to that question is unequivocal - .NET.←→ How to Add a New Module Dependency in VSCode TLA? 24 August 2021 Such Stuff as Systems Are Made On: Patterns and Pattern-Sequences 1 May 2023 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
