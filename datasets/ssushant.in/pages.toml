description = "Seam testing, cross validation and graphing precision/recall are the TDD equivalents for a machine learning project."
full_description = 'My Development Notes/Posts/Test Driven Development for Machine Learning projects/Test Driven Development for Machine Learning projects29 December 2014·2 minsI use Test Driven Development (TDD) when developing a new software. TDD is a useful technique for validating assumptions and refactoring the code. I was wondering what TDD paradigm would work best for a Machine Learning project. I read up on the subject and I am jotting down my findings from various sources - books, Quora answers and simple browsing.Testing Input and Output data #Many Machine learning algorithms expect input data in a particular format, and produce data in a specific format. We can test if the input and the output data conform to these formats. Scikit-Learn provides helper methods for validating input data.Cross Validation #Two risks with machine learning models are - Overfitting and Underfitting. The Overfitting problems happens when the model fits the data tightly whereas Underfitting happens when we don’t use enough data while coming up with a machine learning model.Cross-validation is a method of splitting all of your data into two parts: training and validation. The training data is used to build the machine learning model, whereas the validation data is used to validate that the model is doing what is expected. Scikit-learn provides helper methods for cross validation.Precision and Recall #Precision and Recall are good metrics for monitoring how effective the machine learning implementation is. Precision is the total percentage of true positives in our training data. Recall is the ratio of true positives to true positive plus false negatives.EDIT: I realized that this blog post is a bit dated. I came across this blog post about unit testing machine learning code. The article has serious-good advice on testing neural networks.←→ Interesting links I found this week 6 December 2014 Automating openssl req with a config file 26 May 2015 →←window.gc_params={graphcomment_id:"s