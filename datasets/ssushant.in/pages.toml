["https://ssushant.in/posts/experts_software_design_decoded"]
title = "Tweets about Software Design · Random Tech Excursions"
description = "Software Design Decoded"
full_description = '''My Development Notes/Posts/Tweets about Software Design/Tweets about Software Design13 March 2017·5 minsMIT Press on Twitter listed a vignette of tweets about Software Design. I found the tweets quite insightful and I am jotting them down here for posterity and ease of finding them all at one place.1. Experts prefer simple solutions. #SoftwareDesignDecoded https://t.co/Tq6mOYdqfa pic.twitter.com/waQaSDm3bx— The MIT Press @mitpress.bsky.social (@mitpress) November 2, 20162. Experts solve simpler problems first. #SoftwareDesignDecoded: https://t.co/IdrSvoO7dg pic.twitter.com/idYKLBKZPl— The MIT Press @mitpress.bsky.social (@mitpress) November 3, 20163. Experts divide and conquer. #SoftwareDesignDecoded: https://t.co/IdrSvoO7dg pic.twitter.com/tJBE7l9hna— The MIT Press @mitpress.bsky.social (@mitpress) November 4, 20164. Experts don't Overgeneralize #SoftwareDesignDecoded: https://t.co/IdrSvoO7dg pic.twitter.com/Mbcmi3iU4T— The MIT Press @mitpress.bsky.social (@mitpress) November 5, 20165. Experts design elegant abstractions #SoftwareDesignDecoded: https://t.co/IdrSvoO7dg pic.twitter.com/GREUAhAv7I— The MIT Press @mitpress.bsky.social (@mitpress) November 6, 20167. Experts prefer working with others: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/JgVyZmWHUN— The MIT Press @mitpress.bsky.social (@mitpress) November 8, 20168. Experts reach out: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/c6OfsGCvMl— The MIT Press @mitpress.bsky.social (@mitpress) November 9, 20169. Experts check with others continually: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/VhQ7Iys8v8— The MIT Press @mitpress.bsky.social (@mitpress) November 10, 201610. Experts involve the user: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/MO06u52G3P— The MIT Press @mitpress.bsky.social (@mitpress) November 11, 201612. Experts agree to disagree: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/aOcovkJKwS— The MIT Press @mitpress.bsky.social (@mitpress) November 13, 201613. Experts prefer solutions that they know work: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/MoQwhzJhuQ— The MIT Press @mitpress.bsky.social (@mitpress) November 14, 201614. Experts look around: #SoftwareDesignDecoded. https://t.co/IdrSvp5I4O pic.twitter.com/gk0c8H1UYa— The MIT Press @mitpress.bsky.social (@mitpress) November 15, 201616. Exprets use analogy: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/kHtpFTHIUo— The MIT Press @mitpress.bsky.social (@mitpress) November 17, 201617. Experts use design methods (selectively): #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/HOQWTyEUwQ— The MIT Press @mitpress.bsky.social (@mitpress) November 18, 201618. Experts network: #SoftwareDesignDecoded. https://t.co/IdrSvp5I4O pic.twitter.com/s9BfGW28iT— The MIT Press @mitpress.bsky.social (@mitpress) November 19, 201619. Experts relax constraints: #SoftwareDesignDecoded. https://t.co/IdrSvp5I4O pic.twitter.com/EQJmp8IJ47— The MIT Press @mitpress.bsky.social (@mitpress) November 20, 201620. Experts reshape the problem space: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/cFmEofVlgi— The MIT Press @mitpress.bsky.social (@mitpress) November 21, 201622. Experts design throughout the creation of Software: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/oBzo9Bequq— The MIT Press @mitpress.bsky.social (@mitpress) November 23, 201623. Experts do not feel obliged to use things as intended: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/If17IEH742— The MIT Press @mitpress.bsky.social (@mitpress) November 24, 201624. Experts externalize their thoughts: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/JSnNdvcM4H— The MIT Press @mitpress.bsky.social (@mitpress) November 25, 201625. Experts draw the problem as much as they draw the solution: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/nmEiiSd7Mi— The MIT Press @mitpress.bsky.social (@mitpress) November 26, 201627. Experts shift between formal and informal: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/oN4jPJ4CPs— The MIT Press @mitpress.bsky.social (@mitpress) November 28, 201628. Experts invent notations: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/1XrphMeUeN— The MIT Press @mitpress.bsky.social (@mitpress) November 29, 201629. Experts keep sketches: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/HLG1YVeMhl— The MIT Press @mitpress.bsky.social (@mitpress) November 30, 201630. Experts keep options open: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/gMAGcxvdmQ— The MIT Press @mitpress.bsky.social (@mitpress) December 1, 201631. Experts make provisional decisions: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/dYtaTMPTop— The MIT Press @mitpress.bsky.social (@mitpress) December 2, 201632: Experts see error as opportunity: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/bc0Yq4ooo4— The MIT Press @mitpress.bsky.social (@mitpress) December 3, 201633. Experts know how things work: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/KJKnvvoeHj— The MIT Press @mitpress.bsky.social (@mitpress) December 4, 201634. Experts make tradeoffs: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/f7YDDdV0Yg— The MIT Press @mitpress.bsky.social (@mitpress) December 5, 201635. Experts prioritize among stakeholders: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/3TOEFakibK— The MIT Press @mitpress.bsky.social (@mitpress) December 6, 201636. Experts adjust to the degree of uncertainty present: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/jqnyHPCOap— The MIT Press @mitpress.bsky.social (@mitpress) December 7, 201637. Experts focus on the essence: #SoftwareDesignDecoded. https://t.co/IdrSvoO7dg pic.twitter.com/dBaINPSFMs— The MIT Press @mitpress.bsky.social (@