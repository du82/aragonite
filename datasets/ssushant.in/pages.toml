["https://ssushant.in/posts/figaro_probabilistic_programming"]
title = "Using Figaro for Probabilistic Modeling · Random Tech Excursions"
description = "Using Figaro for Probabilistic Modeling"
full_description = 'My Development Notes/Posts/Using Figaro for Probabilistic Modeling/Using Figaro for Probabilistic Modeling28 June 2016·2 minsBeau Cronin on his Google+ post gives a good explanation of what probabilistic programming is, and why it matters. There are many probabilistic programming languages and tools, and I recently came across Figaro. Figaro is a Scala library for probabilistic programming. Figaro programs are written in Scala, which means they can take full advantage of using Scala’s programming constructs.Suppose you want to model the roll of a six sided die. In probability problems, it is usually modeled as a Random Variable which can take any value from 1 to 6. In Figaro you can model it like so: val dieRoll = FromRange(1, 7) You can also model discrete as well as continuous random variables using Figaro. Figaro programs are structured using Model, Evidence and Inference stages. You model your problem using Figaro’s stochastic models, add evidence, constraints or conditions, and then use one of the many inference algorithms from Figaro to draw inferences.In this example, I am modeling an experiment where a six-sided die is rolled twice, and we want to infer the probability of getting a sum of 11.import com.cra.figaro.language.Apply import com.cra.figaro.library.atomic.discrete.{FromRange} import com.cra.figaro.algorithm.factored.VariableElimination; object HelloWorld { def main(args: Array[String]): Unit = { val firstDie = FromRange(1, 7) val secondDie = FromRange(1, 7) val total = Apply(firstDie, secondDie, (firstDieResult: Int, secondDieResult: Int) => firstDieResult + secondDieResult) println(VariableElimination.probability(total, 11)) } } Apply is a Figaro construct to model operations using Random variable, like in this example we’re interested in Sum of the two Random variables.Figaro is a convenient library, and I like it because the programs written is Figaro are expressive. There are other useful features like modeling Bayesian Nets which I’ll explore further.←→ Using GLPK to solve knapsack and related problems 28 April 2016 Where are the include and link directories for packages installed through Homebrew 29 June 2016 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
