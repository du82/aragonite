full_description = '''My Development Notes/Posts/Getting a list of the older versions of a PyPI Package/Getting a list of the older versions of a PyPI Package3 October 2016·1 minAs of right now, there’s no link on PyPI to list older versions of a package. I was looking for an older version of oauth2client package on PyPI, but could not find any link on the package’s PyPI page.It turns out there is a JSON API which lists any package’s metadata. As an example, this URL lists all the old versions of oauth2client.https://pypi.python.org/pypi/oauth2client/json I used the jq tool to list out any package’s versions.curl -s "https://pypi.python.org/pypi/$1/json" | jq '.releases | to_entries[] | .key ' And as a shell functionfunction lspip { if [[ -z "$1" ]]; then echo usage :$0 package return 1 fi curl -s "https://pypi.python.org/pypi/$1/json" | jq '.releases | to_entries[] | .key ' } This is useful when you want to quickly list out all the versions of any PyPI package.←→ Using Julia for Linear Programming 10 September 2016 Using tsort in your build workflow 25 October 2016 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'''
