full_description = 'My Development Notes/Posts/Save Disk Space when Installing Jetbrains Products/Save Disk Space when Installing Jetbrains Products14 November 2020·2 minsI am a fan of Intellij Products. I use them for coding in my personal and professional projects. I have bought a subscription for the entire suite of Intellij Products. Those who bought the suite will know that the suite comes with a “Toolbox” app. The “Toolbox” app keeps the line of products installed on the computer up-to-date. Off late, I saw that disk space used by Intellij Suite grew exponentially.The Toolbox App keeps older versions of the installable saved to disk. The Older versions of the installable are saved on disk as a rollback safety mechanism. The toolbox rolls back the install to an older version if the newer version has any issues. This was excessive checkpointing in my case. I checked the setting, which saves only the latest version of the Installable.You can save additional disk space by changing the location where the Toolbox app saves the installable. In my case, I changed it to an external drive. You can find this setting by going to the Toolbox app, then click on the octagonal-gear-like icon. This will open the Settings Tab. You can find the configuration by clicking on the “Tools” section of the accordion.I hope this is helpful to anyone looking for the disk space problem with the Intellij Toolbox.←→ Writing Pipe-able Python Scripts 30 June 2020 upper_bound and lower_bound in Java Standard Library 28 March 2021 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
