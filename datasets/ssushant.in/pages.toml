["https://ssushant.in/posts/design-rules-for-data-mining-algorithms-a-tryst-with-modularity"]
title = "Design Rules for Data Mining Algorithms : A Tryst with Modularity · Random Tech Excursions"
description = "Modular Data Mining Algorithms."
full_description = 'My Development Notes/Posts/Design Rules for Data Mining Algorithms : A Tryst with Modularity/Design Rules for Data Mining Algorithms : A Tryst with Modularity3 June 2015·2 minsI took a few Machine Learning courses, and most of them introduced ready-made toolboxes in languages like R and Python. These ready-made toolboxes are good as long as we do not dig deep into the nitty-gritties of the algorithm. Most of the software packages present Machine Learning tasks as a monolithic subroutine which makes it harder, if not impossible, to customize their operations except maybe change a parameter to the subroutine itself. These software packages are not modular.Modular software architectures are evolvable, easy to analyse and upgrade. In the book Design Rules [Baldwin]_, the authors outline the benefits of modularity with the following six operators for modular designs:SplittingSubstitutionAugmentingExcludingInversionPortingSplitting and Substitution are complementary operators which allow interconnected task to be split into independent tasks and evolve separately or replaced by a performant module. Similarly, Augmenting and Excluding are complementary operators which can enhance an already existing design by adding a helper module or taking away a redundant module from the design. Inversion and Porting allow a design to move common modules reusable across all the other modules. These are good thumbrules for designing modular systems and some framework like Guice make it easier to apply these to software design than others.Task The data mining task the algorithm uses. It could be - regression, classification, clustering etc.Structure The functional form of the model we are fitting our data to.Score Function It is used to judge the quality of the fitted models. We usually try to minimize or maximize this function.Search Method The search heuristic or the optimization method we use to maximize or minimize our Score Function.Data Management Techniques Data Management technique is one of the most ignored aspects of Machine learning algorithms. This is where Computational Resources at hand come into picture. Massive datasets can change the game of the machine learning procedure.NameTaskStructureScore FunctionSearch MethodData Management TechniquesCARTClassification and RegeressionDecision TreeCross-Validted Loss FunctionGreedy Search Over StructuresUnspecifiedBackpropagationRegressionNeural NetworkSquared ErrorGradient Descent On ParametersUnspecifiedA PrioriRule Pattern DiscoveryAssociation RulesSupport/AccuracyBreadth-first SearchLinear ScansVector Space for Information RetrievalRetrieval of Similar DocumentsVector of Term OccurencesAngle Between Two VectorsVarious TechniquesFast Indexing Techniques←→ Dato Blog Series on Testing Machine Learning Models 28 May 2015 Moving my blog to Hugo 19 January 2016 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
