title = "Where is the Specification File in TLA+ VSCode Plugin? · Random Tech Excursions"
description = "Where is the Specification file in TLA+ VSCode Plugin?"
full_description = '''My Development Notes/Posts/Where is the Specification File in TLA+ VSCode Plugin?/Where is the Specification File in TLA+ VSCode Plugin?22 August 2021·3 minsI am using the excellent Visual Studio code plugin, TLA+, for writing TLA+ code, and running the code. The plugin makes it easy to write PlusCal code by providing syntax-highlighting, and syntax checking. The plugin can run the specification through the tlc checker, and report errors or success. The plugin makes it easy for people familiar with VS Code to write the specification and run them in an authoring mode that is familiar to them. My workflow is - write the PlusCal code, parse the code using “TLA+: Parse Module” editor command, and then run the “TLA+: Check model with TLC” editor commands from the plugin.There are however some caveats. When you start your “Parse Module” editor command, the plugin notifies that that a cfg file should be present for running the checker. This is something to be mindful of when running the checker. Also, when you run the checker with the default configuration file, then it reports another error: “The specification file cannot specify both INIT/NEXT and SPECIFICATION fields”. I delete the “INIT” and “NEXT” declarations from the file, and re-run the checker.For example, here is the module for the famous readers-writers problem from the book (Practical TLA+ Wayne, 2018) book. The module declares a constant MaxQueueSize.---- MODULE test ---- EXTENDS TLC, Integers, Sequences CONSTANTS MaxQueueSize (*--algorithm message_queue variable queue = <<>>; define BoundedQueue == Len(queue) <= MaxQueueSize end define; process writer = "writer" begin Write: while TRUE do queue := Append(queue, "msg"); await Len(queue) <= MaxQueueSize; end while; end process; process reader = "reader" variables current_message = "none"; begin Read: while TRUE do await queue /= <<>>; current_message := Head(queue); queue := Tail(queue); end while; end process; end algorithm;*) ==== If I attempt to parse the module using the “Parse Module” editor command, I get the notification : “Model file test.cfg does not exist. Cannot check the model.”After, I click on the “Create model file” button, the editor generates a .cfg file with the following contents:SPECIFICATION Spec \* Uncomment the previous line and provide the specification name if it's declared \* in the specification file. Comment INIT / NEXT parameters if you use SPECIFICATION. CONSTANTS greeting = "Hello" INIT Init NEXT Next \* PROPERTY \* Uncomment the previous line and add property names \* INVARIANT \* Uncomment the previous line and add invariant names When I run the checker with this configuration file, I am greeted with another error: “The configuration file cannot specify both INIT/NEXT and SPECIFICATION fields”.When I empty the contents of the file, I get another error : “The constant parameter MaxQueueSize is not assigned a value by the configuration file.”. Notice that the tla file declared a constant which should be initialized in the configuration file. I could get the checker running with this version of the configuration file:SPECIFICATION Spec CONSTANTS MaxQueueSize = 2 So what is the configuration file? When we run the checker through the plugin, it invokes the following command:java -cp tla2tools.jar -XX:+UseParallelGC tlc2.TLC test.tla -tool -modelcheck -coverage 1 -config test.cfg The configuration file is the input to the -c option in the command. The configuration file tells TLC the names of the specification and of the properties to be checked. The configuration file must specify values for all the constant parameters of the specification. We can also specify any invariants that the tool should check in the specification file. For example, in the specification listed above, there is an invariant BoundedQueue. We can ask tlc to check for the invariant by specifying it in the file like so:SPECIFICATION Spec CONSTANTS MaxQueueSize = 2 INVARIANT BoundedQueue Reading #Wayne, H. (2018). Practical TLA+. https://doi.org/10.1007/978-1-4842-3829-5←→ Design Round - Synechdoche, Long Running Project 16 August 2021 How to Add a New Module Dependency in VSCode TLA? 24 August 2021 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'''
