full_description = 'My Development Notes/Posts/Dato Blog Series on Testing Machine Learning Models/Dato Blog Series on Testing Machine Learning Models28 May 2015·1 minIn a previous post, I talked about using TDD for Machine Learning applications. It was a very basic mind-dump and I am happy that Dato Blog is running a blog post series on evaluating and testing Machine Learning Models.Here’s a brief summary with links to the original blog postsOrientation Alice starts her blog series with an introduction to the jargon used in evaluation of Machine Learning Models. She talks about the three most important considerations when evaluating Machine learning models - picking the metric, picking the dataset on which to measure the metric and meta-evaluation of models.Classsification Metrics Alice talks about common metrics used when evaluating Classification based Machine learning Models.Ranking and Regression Metrics Alice talks about common metrics used when evaluating regression or ranking based machine learning models.Hyperparameter Tuning Hyperparamters are values that need to supplied to the training procedure. For example, the regularization parameter values used in some regression models.Validation and offline Testing She throws light on Boostrapping, Jack-knifing resampling techniques for Validation Testing.Online A/B Testing She throws light on the basics of A/B testing and its pitfalls.←→ Extracting public key from pem file 28 May 2015 Design Rules for Data Mining Algorithms : A Tryst with Modularity 3 June 2015 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
