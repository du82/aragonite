["https://ssushant.in/posts/infrastructure_as_code"]
title = "Infrastructure as Code · Random Tech Excursions"
description = "Ansible is a good candidate for Infrasture as Code Solution."
full_description = 'My Development Notes/Posts/Infrastructure as Code/Infrastructure as Code1 December 2014·3 minsThe book Web Operations from O’Reilly lists ten important principles for any configuration service. It gives Chef as an example of an ideal configuration management service because it fits all the general ten principles. I argue that Ansible is also a good option for a configuration service.Modularity #Do one thing and do it well.Ansible is a provisioning tool, that’s it and it does its job well.Cooperative #It takes a village.You can call other services from Ansible. You can call your infrastructure services like AWS from aws ansible module. You can also configure your DNS Services like DNSSimple, Rackspace, Route53 and Digital Ocean from Ansible.Composable #It should be ready for anything.Ansible is configured using playbooks which are YAML files. An Ansible role is actually a set of instructions to install and configure any application. To install mysql and git on a server, you can include roles for both mysql and git in your playbook.Flexible #It should be capable of doing whatever is required.Ansible is written in Python Programming language which is very flexible. You can also include bash scripts in Ansible.Extensible #When something new is encountered, it’s easy to extend.You can write Ansible modules in any language of your choice, provided you have an interpreter of that language. Ansible provides a Python library for writing custom modules.Repeatable #No matter how many times you do it, it works the same way.Ansible Playbooks make your installations, upgrades, and day-to-day management repeatable and reliable.Declarative #It is about what you want, not how you do it.Ansible is declarative with playbooks written in YAML syntax.Abstract #It takes care of the details for you.Ansible provides a thin layer of abstraction. Some configuration management tools provide a layer of abstraction over the specifics of the different operating systems running on the remote servers, so that you can use the same configuration management scripts to manage servers running different operating systems. For example, instead of having to deal with a specific package manager like yum or apt, the configuration management tool exposes a “package” abstraction that you use instead. Ansible isn’t like that. You have to use the “apt” module to install packages on apt-based systems and the “yum” module to install packages on yum-based systems. It isn’t a disadvantage, in practice I found it to be useful. Roles is a way of collecting playbooks together so they could potentially be reused, as well as Ansible Galaxy, which is an online repository of these roles.Idempotent #It takes action only if it needs to.Ansible modules are idempotent, they will seek to avoid changes to system unless a change has to be made.Convergence #It takes care of itself and relies on other services to do the same.Ansible modules are self aware and Ansible isn’t any different from Chef here.Interesting links I found this week 6 December 2014 →←window.gc_params={graphcomment_id:"ssushant-in",fixed_header_height:0},function(){var e=document.createElement("script");e.type="text/javascript",e.async=!0,e.src="https://graphcomment.com/js/integration.js?"+Math.round(Math.random()*1e8),(document.getElementsByTagName("head")[0]||document.getElementsByTagName("body")[0]).appendChild(e)}()'
