sons to a Baby Dr, and the Dr would say to me, What do you think it is? I told him impetigo—and it was…The Dr respected me, in that I might be able to figure out what was going on. You have to listen to the patient. My sister swears by wheat grass and water to rid the body of toxins. What works for some, will not work for others. I for one WANT to hear what others are doing holistically..I am scared of putting myself into the holy hands of a medical science–as I am too tall to be a guinea pig. Reply L.Gilani says: December 1, 2012 at 9:13 am One other item. The French biologists have cultured a tumor and say that when they took sugar away from it, the tumor shrunk. Russell Coker says: September 17, 2010 at 8:26 pm http://en.wikipedia.org/wiki/Telomere The Wikipedia page on Telomeres is worth reading, a cancer that can’t break the division limit will suddenly go away for no apparent reason. A sample size of 1 doesn’t mean much in any case. If the supply of blood to cancers can be reduced that can stop their growth. Among other things Chocolate inhibits the growth of blood vessels to cancer tissues. Apparently the majority of cancers don’t grow very big because they can’t convince the rest of the body to grow new blood vessels. Reply L.Gilani says: December 1, 2012 at 9:16 am now I just read I should stay away from chocolate….would you tell me where you read the part where Chocolate inhibits growth of the blood vessels to cancer tissue…. I do love chocolate….but it would take a good reference for me to read…to eat it right now…I do appreciate you allowing a forum where we can encourage Reply sswam says: December 3, 2012 at 9:04 am I wouldn’t encourage to eat (milk) chocolate, it’s very high in energy and protein. You could try dark chocolate without sugar, but many people find that unpleasant to eat. Yes a tumor like any part of the body requires energy to sustain itself. In order to grow quickly, it would need more energy and protein than a normal organ, so I think y