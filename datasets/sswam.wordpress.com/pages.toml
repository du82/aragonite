title = "How to Divide by Zero:  a/0 = b ⟺ a = 0 | Sam's Hacktastic Blog"
description = "TLDR: Division by zero is not as scary as it's made out to be: a/0 = b ⟺ a = 0 Division is multiplication, backwards. These two equations are exactly equivalent, by definition: a/c = b a = b×c It's easy to understand division by zero if we look at the equivalent multiplication. a/0 = b a…"
full_description = '''← error handling in C Chrome memory abuse, and “swap space” rant → How to Divide by Zero: a/0 = b ⟺ a = 0 Posted on November 16, 2015 by sswam TLDR: Division by zero is not as scary as it’s made out to be: a/0 = b ⟺ a = 0 Division is multiplication, backwards. These two equations are exactly equivalent, by definition: a/c = b a = b×c It’s easy to understand division by zero if we look at the equivalent multiplication. a/0 = b a = b×0 For any real number b: a = b×0 = 0 a = 0 There are two cases with division by zero: If a = 0, then a/0 = b is unconstrained, any real number b satisfies the equation. You can discard such an equation which does not constraint the result. If a ≠ 0 then a/0 = b is contradictory. There is no real number b which satisfies that equation. This is still useful to know; “there is no answer” can be a sort of meta-answer. For example if trying to solve a system of equations of static forces, “there is no answer” might mean you need to consider a different design for your bridge! There is no need to consider advanced concepts such as limits in order to fully understand division. In short, a/0 = b is true if and only if a = 0. If you see such an equation a/0 = b, you may simplify it to a = 0. a/0 = b ⟺ a = b×0 ⟺ a = 0 a/0 = b ⟺ a = 0 I posted this here about a year ago: http://matheducators.stackexchange.com/a/5667/3287 __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c26726c1797', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c26726c17cc', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Like Loading... Related About sswam I'm a full stack software engineer / web app developer. I also teach math and coding to school students online. I'm interested in math notation and programming language development, including relational graph language. View all posts by sswam → This entry was posted in Uncategorized. Bookmark the permalink. ← error handling in C Chrome memory abuse, and “swap space” rant → Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
