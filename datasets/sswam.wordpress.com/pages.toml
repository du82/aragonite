description = 'Job control is a basic feature of popular UNIX and Linux shells, such as "bash". It can be very useful, so I thought I’d make a little tutorial on it… ^C  press Ctrl-C to interrupt a running job (you know this one!) ^\  press Ctrl-\ (backslash) to QUIT a running job (stronger) ^Z press Ctrl-Z to STOP a…'
full_description = '''← Fight Back against universal surveillance (aka Big Brother) printf “%q ” in bash, to escape arguments → job control in the shell Posted on March 26, 2015 by sswam Job control is a basic feature of popular UNIX and Linux shells, such as “bash”. It can be very useful, so I thought I’d make a little tutorial on it… ^C press Ctrl-C to interrupt a running job (you know this one!) ^\ press Ctrl-\ (backslash) to QUIT a running job (stronger) ^Z press Ctrl-Z to STOP a running job, it can be resumed later jobs type jobs for a list of stopped jobs (and background jobs) fg type fg to continue a job in the foreground bg type bg to continue a job in the background kill kill a job, e.g. kill %1, or kill -KILL %2 wait wait for all background jobs to finish You can also use fg and bg with a job number, if you have several jobs in the list. You can start a job in the background: put an &-symbol at the end of the command. This works well for jobs that write to a file, but not for interactive jobs. Things might get messy if you have a background job that writes to the terminal. If you forget the % with kill, it will try to kill by process-id instead of job number. You don’t want to accidentally kill PID 1! An example: vi /etc/apache2/vhosts.d/ids.conf ^Z jobs find / >find.out & jobs fg 2 ^Z jobs bg 2 jobs kill %2 fg __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c26712af891', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c26712af8c6', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Like Loading... Related About sswam I'm a full stack software engineer / web app developer. I also teach math and coding to school students online. I'm interested in math notation and programming language development, including relational graph language. View all posts by 