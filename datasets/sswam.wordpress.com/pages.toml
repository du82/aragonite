full_description = '''← printf “%q ” in bash, to escape arguments error handling in C → ramp-io Posted on October 29, 2015 by sswam I wrote a simple program ramp-io, based on the redshift code, to read and write the xrandr gamma ramps for Linux / X11. This enables me to define my own gamma ramps, and switch ramps quickly from the command line. My preferred ramp is red-inv, dim inverse video with a low colour temperature (more red, less blue), and I set the LCD hardware brightness to maximum to reduce LED PWM flicker. I find this is relatively easy on the eyes for work, compared to the normal glaring white backgrounds. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c2671fa566d', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c2671fa569f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Like Loading... Related About sswam I'm a full stack software engineer / web app developer. I also teach math and coding to school students online. I'm interested in math notation and programming language development, including relational graph language. View all posts by sswam → This entry was posted in Uncategorized. Bookmark the permalink. ← printf “%q ” in bash, to escape arguments error handling in C → 1 Response to ramp-io Earl says: February 23, 2019 at 10:42 am Thanks Sam. This helped me make a simple utility to set the colour temperature. It’s not as flexible as yours, but simple enough for my needs. Here’s the basic function: #include #include #include “gamma-randr.h” /** * Set colour temperature (1000-25000) and brightness (0.0-1.0) on all screens. */ void set_colour_temperature(const int temperature_K, const float brightness) { randr_state_t _state; memset(&_state, 0, sizeof(_state)); randr_state_t *state = &_state; printf(“Setting temp=%dK, brightness=%1.1f\n”, temperature_K, brightness); color_setting_t setting; setting.gamma[0]=1.0; setting.gamma[1]=1.0; setting.gamma[2]=1.0; setting.brightness=brightness; setting.temperature=temperature_K; if (randr_init(state) != 0) die(“failed: randr_init”); if (randr_start(state) != 0) die(“failed: randr_start”); state->crtc_num=-1; // set all screens randr_set_temperature(state, &setting); randr_free(state); } Reply Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
