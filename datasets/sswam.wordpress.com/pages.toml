title = "svn ignore dammit | Sam's Hacktastic Blog"
description = '"Thank-you" svn for such a hideous, bogus and difficult way to ignore files. So I wrote a script svn-ignore-all: #!/bin/sh # svn-ignore-all # usage: # 1. run svn status to see what is going on at each step # 2. add or commit all files that you DO want to have in svn # 3. remove any…'
full_description = '''← Previous Post Fight Back against universal surveillance (aka Big Brother) → svn ignore dammit Posted on October 8, 2013 by sswam “Thank-you” svn for such a hideous, bogus and difficult way to ignore files. So I wrote a script svn-ignore-all: #!/bin/sh # svn-ignore-all # usage: # 1. run svn status to see what is going on at each step # 2. add or commit all files that you DO want to have in svn # 3. remove any random files that you don't want to svn:ignore # 4. run this script to svn:ignore everything marked '?' in output of `svn status` svn status | grep '^?' | sed 's/^? *//' | while read f; do d=`dirname "$f"` b=`basename "$f"` ignore=`svn propget svn:ignore "$d"` if [ -n "$ignore" ]; then ignore="$ignore " fi ignore="$ignore$b" svn propset svn:ignore "$ignore" "$d" done Also, to ignore specific list of files / pathnames, we can use this variant svn-ignore. I guess svn-ignore-all should really be like xargs svn-ignore. #!/bin/sh # svn-ignore # usage: # svn-ignore file/to/ignore ... for f; do d=`dirname "$f"` b=`basename "$f"` ignore=`svn propget svn:ignore "$d"` if [ -n "$ignore" ]; then ignore="$ignore " fi ignore="$ignore$b" svn propset svn:ignore "$ignore" "$d" done One more thing: I tend to pollute my svn checkouts with many random files. When it’s time to commit, I move those files into an ‘old’ subdirectory, and tell svn to ignore ‘old’. Also posted here: http://stackoverflow.com/questions/116074/how-to-ignore-a-directory-with-svn/19240497#19240497 __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c2670badad7', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c2670badb1e', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:FacebookXLike Loading... Related About sswam I'm a full stack software engineer / web app developer. I also teach math and coding to school students online. I'm interested in math notation and programming language development, including relational graph language. View all posts by sswam → This entry was posted in Uncategorized. Bookmark the permalink. ← Previous Post Fight Back against universal surveillance (aka Big Brother) → Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
