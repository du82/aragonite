title = "getting rid of cancer | Sam's Hacktastic Blog"
description = "I think the best way to defeat cancer is by fasting or dieting.  Cancer needs lots of energy and protein to maintain itself and to grow.  If you starve yourself a bit, the cancer suffers much more than you do. Vegetarians have a much lower rate of cancer, less than half the normal rate.  The…"
full_description = "← Petitions, Surveys and Voting Islam is getting too much undeserved bad press, and I don’t like that. → getting rid of cancer Posted on September 17, 2010 by sswam I think the best way to defeat cancer is by fasting or dieting. Cancer needs lots of energy and protein to maintain itself and to grow. If you starve yourself a bit, the cancer suffers much more than you do. Vegetarians have a much lower rate of cancer, less than half the normal rate. The adult body is not growing, and needs very little protein. People who eat lots of meat, dairy or eggs have a huge excess of protein in their diet. Cancer would use that protein to grow. Without that protein, it cannot grow. If you have cancer, rest and relax, don’t exercise or worry. If you exercise, your body needs much more energy, so you will eat more, and the cancer will take some of that energy. If you take away most of the protein and energy a cancer needs to grow, it can’t grow. So, to cure and avoid cancer, fast for at least two weeks (just water, optionally with a vitamin supplement). Then you can resume eating, but don’t eat high-protein foods such as meat, dairy or eggs, and don’t eat too much sugar, carbohydrates or fat. Take care with what you are eating, avoid eating too much, and especially avoid protein and sugar. Keep your energy intake as low as possible (low calories). A friend of mine got rid of a large tumor in his neck like this. He fasted for two weeks, then followed a simple vegetarian diet over a period of a two months or so. He ate mostly cabbage and pumpkin, gradually returning to a normal diet (or I suppose a better diet). This method is simple, but I think it’s basically a sound and effective way to get better from cancer. (I also posted this on my website, with some more info: http://sam.nipl.net/cancer.html) __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c266e4b39fc', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.ini