description = 'I learned a useful trick with the bash shell today. We can use printf "%q " to escape arguments to pass to the shell. This can be useful in combination with ssh, in case you want to pass arguments containing shell special characters or spaces. It can also be used with su -c, and sh -c. The…'
full_description = '''← job control in the shell ramp-io → printf “%q ” in bash, to escape arguments Posted on June 22, 2015 by sswam I learned a useful trick with the bash shell today. We can use printf “%q ” to escape arguments to pass to the shell. This can be useful in combination with ssh, in case you want to pass arguments containing shell special characters or spaces. It can also be used with su -c, and sh -c. The following will run a command exactly on a remote server: sshc() { remote=$1 ; shift ssh "$remote" "`printf "%q " "$@"`" } Example: sshc user@server touch "a test file" "another file" __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c2671687771', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c267168779f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Like Loading... Related About sswam I'm a full stack software engineer / web app developer. I also teach math and coding to school students online. I'm interested in math notation and programming language development, including relational graph language. View all posts by sswam → This entry was posted in Uncategorized. Bookmark the permalink. ← job control in the shell ramp-io → Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
