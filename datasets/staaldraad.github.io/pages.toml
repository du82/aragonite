full_description = "CVE-2018-11235 git RCERemote code execution through malicious submodules.June 3, 2018 · 13 min · 2758 words · Etienne Stalmans CVE-2017-17405 RCE in Ruby's FTP libThe FTP library in Ruby did not validate remote filenames and blindly passed these to the kernel.open function. This created a remotely exploitable vulnerability. Since the filenames were supplied by the remote FTP server, it was possible to create a malicious server that could exploit this vulnerability when a vulnerable Ruby client connected and tried to download a file. ...June 1, 2018 · 1 min · 133 words · Etienne Stalmans NAT-to-NAT VPN with WireGuardA recent research project/idea required me to look into setting up a NAT-to-NAT VPN. The basic idea being that two NATed networks are able to communicate through a VPN and share resources. While researching possible VPN solutions, I remembered reading about WireGuard a new VPN that aims to be fast, secure and lightweight. This seemed like the perfect opportunity to both try out a new VPN implementation and accomplish the goals of the research project....April 17, 2017 · 5 min · 988 words · Etienne Stalmans"
