full_description = "Universal RCE with Ruby YAML.load (versions > 2.7)A couple of years ago I wrote a universal YAML.load deserialization RCE gadget based on the work by Luke Jahnke from elttam. This has since been patched and no longer works on Ruby versions after 2.7.2 and Rails 6.1. Fortunately, William Bowling (vakzz) has found a new gadget chain that works on all Ruby versions 2.x - 3.x. His write-up for this is excellent and I highly recommend you give it a read: https://devcraft....January 9, 2021 · 3 min · 606 words · Etienne Stalmans CVE-2020-25695 Elevación de Privilegios en PostgresqlEste año está siendo una locura, espero que todos estéis bien y que el resto del año vaya mejor. Este es mi primer y probablemente único post del año (y el primero en español). Voy a hablar sobre una vulnerabilidad que hallé en Postgresql, y que afecta a todas las versiones desde la 9.5, y probablemente también, las versiones anteriores. La vulnerabilidad es similar a una “time-of-check to time-of-use (TOCTOU)” que también puede ser descrita como la falta de reinicio del estado antes de salir de una operación restringida....December 15, 2020 · 13 min · 2690 words · Etienne Stalmans CVE-2020-25695 Privilege Escalation in PostgresqlIt has been quite a year, I hope everyone is well and staying safe. This is my first and probably only post for the year, and covers a fun privilege escalation vulnerability I found in Postgresql. This affects all supported versions of Postgresql going back to 9.5, it is likely it affects most earlier versions as well. The vulnerability is similar to a time-of-check to time-of-use (TOCTOU) issue, however in this case it relates to state not being fully cleared/reset before exiting a security restricted operation....December 15, 2020 · 13 min · 2637 words · Etienne Stalmans Argument injection and getting past shellwords.escapeThis is going to be a short write-up about an interesting argument injection I ran into a while ago. There is nothing new here,