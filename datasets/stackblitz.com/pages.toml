["https://stackblitz.com/case-studies/google"]
title = "StackBlitz | Case Study | How Google Increased Platform Adoption & Innovation with StackBlitz | Instant Dev Environments | Click. Code. Done."
description = "StackBlitz is the collaborative browser-based IDE for web developers. StackBlitz eliminates time-consuming local configuration and lets developers spend more time building."
full_description = "We work with some of the largest companies in the world to eliminate wasted developer hours, mitigate the security risk of executing untrusted code, and greatly reduce collaboration friction. Developer frameworks and design systems are critical tools in the modern web development arsenal. They enable large teams to collaboratively build great products faster while ensuring consistency and accessibility across platforms and releases. In order to capture this value internally, Google created the Angular framework as well as the corresponding UI library for their Material Design System. Angular quickly became not only the preferred internal framework for Google, but the leading framework for enterprise-scale applications worldwide With millions of developers adopting the platform, Google’s Angular team needed a fast, secure and scalable solution to enable a team of less than 30 developers to support the rapidly growing and globally distributed user base. After Angular and Angular Material launched, a wave of developers began learning and implementing the framework. Getting started often led developers to: While the process was not technically challenging for experienced users, it was tedious and time consuming for all, slowing down learning and platform adoption. As the community grew, more issue reports made their way back to Google’s Angular development team with more than 40,000 reports to date. When reporting an issue back to the Angular team, the reporting developer often had to include the raw code, along with the specifications for recreating the environment. Each issue required at least thirty minutes before any root cause investigation could be initiated which was taking significant time away from innovating on the platform. Google searched for a solution that could eliminate friction between the code and the end users. They identified browser based IDEs as the ideal way to create a fast, secure, and consistent development environment for new users as well as bug reproductions."
year_published = 2025
