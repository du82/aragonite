["https://stackblitz.com/case-studies/surescripts"]
title = "StackBlitz | Case Study | Scaling Design Systems and Ensuring UI Consistency across Teams with Surescripts | Instant Dev Environments | Click. Code. Done."
description = "StackBlitz is the collaborative browser-based IDE for web developers. StackBlitz eliminates time-consuming local configuration and lets developers spend more time building."
full_description = "The last time you picked up your prescription medication at your local pharmacy, there’s a good chance you unknowingly benefitted from an Arlington, Virginia-based company called Surescripts. Surescripts enables doctors, pharmacists, and other healthcare providers to securely share important healthcare data like medication history and clinical notes. Not only does this allow healthcare professionals to facilitate prescriptions, work with insurance companies, and provide personalized care, it also helps patients get their prescriptions faster and with less hassle and ensures they don’t overpay for their medication. Managing the exchange of healthcare data across hundreds of data partners requires significant investment in infrastructure and backend engineering. As a result, backend engineers at Surescripts significantly outnumber engineers with deep front-end expertise. Historically, UI development was focused on a single, monolithic admin console used by Surescripts’ customers and internal teams. Like many legacy systems, though, this application became increasingly difficult to maintain and update. The team undertook a multi-year project to decompose the admin app into microservices. While this allowed for more rapid iteration, it also meant the work of building and maintaining Surescripts’ UIs was now increasingly distributed across dozens of teams, many of which lacked dedicated front-end engineers. As a Senior Enterprise Architect, Jake Anstadt was tasked with establishing a modular approach to UI development that didn’t require highly specialized frontend engineering experience but was flexible enough to support the wide variety of applications his team oversees. If Jake’s team updated a shared component or style, it would frequently cause the various implementations to break, requiring the UI to be reconfigured and taking development time away from feature work. To enable a more self-service model for front-end development, Jake’s team built a system of shared components along with detailed internal documentation and interactive examples."
year_published = 2025
clearnet = "https://stackblitz.com/case-studies/surescripts"
