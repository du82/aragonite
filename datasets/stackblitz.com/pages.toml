description = "StackBlitz is the collaborative browser-based IDE for web developers. StackBlitz eliminates time-consuming local configuration and lets developers spend more time building."
full_description = "StackBlitz values your privacy. This Privacy Policy details important information regarding the use and disclosure of your information collected on stackblitz.com. This Privacy Policy is incorporated into and is subject to StackBlitz’s Terms of Service. Your use of stackblitz.com and any personal information you provide on or through stackblitz.com remains subject to this Privacy Policy and StackBlitz’s Terms of Service. Special Note to International Users. Stackblitz.com is hosted in the United States and is intended for and directed to users in the United States. If you are an user accessing stackblitz.com from the European Union, Asia, or any other region with laws or regulations governing personal data collection, use, and disclosure, that differ from United States laws, please be advised that through your continued use of stackblitz.com, which is governed by U.S. law, this Privacy Policy, and StackBlitz’s Terms of Service, you are transferring your personal information to the United States and you consent to that transfer. You provide certain personally identifiable information (such as your name and email address) to StackBlitz when you register for an account or correspond with us. In addition, if you choose to purchase products or services from us, then StackBlitz will ask you for additional information including your credit card information and billing address. StackBlitz may also seek ask you for demographic information including your age, gender, preferences and interests. Cookies Information. When you visit stackblitz.com, we may send one or more cookies - a small text file containing a string of alphanumeric characters - to your computer that uniquely identifies your browser. StackBlitz uses both session cookies and persistent cookies. A persistent cookie remains after you close your browser. Persistent cookies may be used by your browser on subsequent visits to the site. Persistent cookies can be removed by following your web browser help file directions. A session cookie is temporary and disappears after you close your browser. You can reset your web browser to refuse all cookies or to indicate when a cookie is being sent. However, some features of stackblitz.com may not function properly if the ability to accept cookies is disabled."
