["https://stackdiver.com/posts/first-look-at-bolt-new"]
title = "First Look at Bolt.new"
description = "An Inquiry into Zeros and Ones"
full_description = "Bolt.new is a Vercel v0 competitor by StackBlitz, and it's open source! Here is what I found in its system prompt It is clearly forked from Claude 3.5 Artifact system prompt. Instead of generating an entire file, Bolt turned O(N) edit cost into O(1) by allowing GNU diff format. File system emulation and arbitrary npm installs, all powered by Web Container There is no RAG. The entire thread is submitted as context for every user message. Compare Bolt.new with v0 v0 seems to use a real backend. Bolt.new runs locally inside user's browse. v0 is hard coded to use shadcn UI. Bolt.new leaves the choice to the user. v0 has version management. Bolt.new does not preserve previous versions. v0 is single file output. Bolt.new supports multiple files. Compare Bolt.new with Claude 3.5 Artifact Claude 3.5 Artifact can only edit one file at time. Bolt.new edits multiple files. Claude 3.5 regenerates the entire artifact. Bolt.new can generate either full file or just the diffs. Bolt.new can generate more complex apps with modular components, backed by file system. Open source is the killer move Bolt.new can be forked, customized, self-hosted, connected with your own LLMs. StackBlitz sells more Web Container API plans. Developers can build fully custom and privacy respecting apps. It's a win-win."
