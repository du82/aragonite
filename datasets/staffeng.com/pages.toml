["https://staffeng.com/book"]
title = "Staff Engineer: Leadership beyond the management track"
description = "Buy Staff Engineer: Leadership beyond the management track"
full_description = '''At most technology companies, you’ll reach Senior Software Engineer, the career level for software engineers, in five to eight years. At that career level, you’ll no longer be required to work towards the next promotion, and being promoted beyond it is exceptional rather than expected. Should you stay there, move into engineering management, or continue down the path of technical excellence to become a Staff Engineer? What are the skills you need to develop to reach Staff Engineer? Are technical abilities alone sufficient to reach and succeed in that role? How do most folks reach this role? What is your manager’s role in helping you along the way? Will you enjoy being a Staff Engineer or will you toil for years to achieve a role that doesn’t suit you? Staff Engineer: Leadership beyond the management track is a pragmatic look at attaining and operating in Staff engineering roles, building on the lived experience of folks who've walked before you. Staff Engineer is brought to you by the author of An Elegant Puzzle, with over 30,000 copies sold. If you enjoyed or found it useful, you'll enjoy this book as well. These guides cover the Staff engineer archetypes, how to identify what to work on as a Staff Engineer in Work on what matters, how to partner with your management chain in Stay aligned with authority, and tools for charting your promotion path in Promotion packets. Read how folks at Dropbox, Etsy, Slack, Stripe, and more carved their path to Staff-plus engineer. Hear more about Staff Engineer on episodes of the Software Engineering Daily and Career Chats podcasts. "Becoming a Staff engineer is both a promotion and a job change; many immensely talented engineers pursue the first and arrive unprepared for the latter. Will Larson's Staff Engineer is a wide ranging and thought provoking overview of the many dimensions of the role. As a software engineer at any level, this book will challenge you to become better and should be required reading if you're pursuing a Staff engineer role."'''
