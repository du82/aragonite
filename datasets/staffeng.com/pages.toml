title = "Getting in the room, and stay there | StaffEng"
description = "Stories of folks reaching Staff Engineer roles."
full_description = '''Guides / Getting in the room, and stay thereOne of the most common frustrations I've heard from engineers is that they're not in the room where important decisions are being made. They don't understand the company's decisions and have important context that seems to be missing or ignored. Staff-plus engineers frequently cite access to "the room" as a major benefit of their level, and titles do increase the likelihood that you'll be involved in decisions that impact you. However, it's important to remember there's no single "room" to enter. Getting into the right room isn't a one-time challenge to be faced. Entering rooms will be an ongoing, iterative career challenge. That means it's worth getting good at! Early in your career, it might be a sprint pre-planning meeting with your tech lead and product manager. Later it might be a quarterly planning meeting, an architecture review, the performance calibration, the engineering leadership team, or the executive team. There will always be another room to enter. To reach senior levels, you have to become effective at not only entering but also staying in these rooms of power. Getting in the room To get into the room, you need: To bring something useful to the room... This could be details on a critical project, context from a critical team, subject matter expertise related to the room's purpose, experience running a similar project or team at a previous company, a relationship with a key relevant customer, or something else entirely. ...that the room doesn't already have. It's not enough to have something useful to bring to the room. It also needs to be a perspective that isn't already present within the room. Small groups function better than larger ones, so operating forums generally sacrifice redundancy and representation for efficiency. To be included in those rooms, you'll need to bring something distinct from the current membership. A sponsor in the room. These rooms have limited slots and have to function well as a group. To get into the room, you'll need someone to sponsor your membership. Your sponsor is allocating their social capital towards your inclusion, and their peers will judge them based on your actions within the room. These rooms often have a mix of seniority levels, so it's often the case that your sponsor's manager is in the room evaluating them based on their decision to sponsor you. Your sponsor needs to know you want to be there. Your sponsor is probably in many different rooms and probably daydreams of leaving most of those meetings behind them. They won't necessarily assume you want to be in any particular meeting, and in fact might assume you don't want to be there at all. Make sure that they know if you want to be included. How you bring something useful to the room is going to be context-specific to you and the room you're trying to enter: there isn't any single pattern to follow. Whether someone with similar context is already in the room is also unique to your circumstances, and at some points in time, the only options are to wait or look for another room to enter. On the other side of things, sometimes the easiest way to increase your value to the room is by decreasing the cost of including you. Some of the approaches that work well are: Stay aligned with your manager. Folks evaluate leaders on how aligned their teams are with their announced approach. If they've proclaimed a shift to continuous deployment, but their team is chanting for release trains, then folks get skeptical about who is leading who. You'll be much more likely to be sponsored into the room if you're highly aligned with your sponsor. If you're particularly aligned, they're more likely to yield their own seat to you and stop attending. Optimize for the group. One of Stripe's old operating principles was "Optimize for Stripe," and that mentality of optimizing widely for others builds trust and confidence in your judgment. Speak clearly and concisely. Learn to speak concisely: as you develop an economy of speech, you'll be able to contribute more ideas with less time. Learn to speak clearly: if folks don't understand your proposal, then it doesn't matter how good it is. Keep in mind that it's your obligation to be understood, not the obligation of everyone else to understand you. Be low friction. It's easy to fall into the trap of viewing each discussion as the last opportunity to stop an impending disaster. With that mindset, each discussion is a near-emergency, and emotions run high. Those sorts of discussions usually spend their time draining frustration rather than making forward progress. If you're known as someone who can navigate difficult conversations effectively, you're much more likely to be involved. Come prepared. Some companies infantilize their engineers, accepting that even very senior engineers won't read the agenda, do the pre-reads or prepare for the discussion. There's a considerable gap between what's tolerated and what's rewarded, and you'll stand out if you take the time to organize your thoughts before each meeting. Equally important is following up on what you committed to. Focus and be present. Once you've entered the room, be sure to show up and engage. Be attentive and engaged. Whatever else you want to be doing, it will wait. Volunteer for low-status tasks. If someone needs to take notes, raise your hand. If someone needs to follow up on action items, be available. Prioritize being useful, especially when it isn't the most exciting work. To get into the room, you have to work both the numerator and denominator: keep developing a unique and useful perspective while also becoming more effective at delivering that perspective within the constraints of a meeting. Staying in the room Getting into the room is your first hurdle, but the second hurdle is staying in the room. Most important is to keep doing the things that got you into the room: bring important context into the room, present a polished version of yourself, be concise, be flexible. There are a few patterns that will consistently get you kicked out of the room: Misunderstanding the room's purpose. Each room has its own purpose, and you'll create friction if you attempt to use a room against the existing group's intent. It's very common for the external perception of a given room's function ("they make all the decisions in the leadership team meeting") to be rather far from how the room thinks of its role ("we don't make decisions, just surface problems to discuss"). Take the time to understand how the room operates and integrate into it with respect for that intention. Being dogmatic. As rooms get more senior, they have to discuss very sensitive topics (compensation, layoffs, promotions, acquisitions, etc), and they have a fixed amount of time to work together each week. If you're dogmatic, you will create friction that slows down discussion and impedes the group's ability to make progress. Withholding consent. Effective groups are formed from individuals who are willing to disagree and commit. You can often force a group towards your perspective by withholding your consent until thinking moves your way, but the group's pace will slow to a halt, and you'll likely get removed from it. Sucking the oxygen out of the room. There are brainstorm discussions where every idea is welcome, and there are moments when you've shifted into operating mode to unblock project execution, and you have to read the room on which is happening. Usually, this comes from an urge to show value, but remember that you're in the room because of what got you into the room, not in the hopes that entering the room will magically transform you into someone entirely new. Embarrassing your sponsor. Remember that you got into a room because someone in the room advocated for your inclusion. Being flakey or not showing up regularly. There are only so many slots, and the person running the meeting will prioritize them on people who show up. That said, I think it's easy to get caught up worrying too much about staying in the room. Sometimes you're better off thinking about whether the room's a valuable place to invest your time. Exiting the room It's important to remember that while there are infinite rooms to be in, there's no room where the work actually happens. You'll be most impactful if you're selective on which rooms you stay in. While I've met many folks who resent not being allowed entry into some room they're fixated on, I've never met anyone who regrets leaving a room too soon. If any given room doesn't feel useful, exit the room. While exiting, sponsor someone else into the opportunity you're leaving behind.Read another guide? or Back to the stories?If you've enjoyed reading the stories and guides on staffeng.com, you might also enjoy Staff Engineer: Leadership beyond the management track, which features many of these guides and stories.Would you like an email when new stories are posted?Email'''
