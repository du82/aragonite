full_description = "Home » Achievements Pwn2Own Toronto 2022 December 9, 2022 · 1 min · Jacob Soo Table of Contents References Pwn2Own is a computer hacking contest held annually by Trend Micro’s Zero Day Initiative - ZDI. Contestants are challenged to exploit widely used software and mobile devices with previously unknown vulnerabilities. Winners of the contest receive the device that they exploited and a cash prize. The total prize for each contest is up to millions of dollars. The 2022 fall edition of Pwn2Own (Pwn2Own Toronto) was held from 06th December to 09th December 2022 in a hybrid format (offline and online). STAR Labs came in 4th in this edition of Pwn2Own. Today, we are proud to announce that our researchers, Nguyễn Hoàng Thạch & Nguyễn Tiền Giang, have successfully Pwned the Samsung Galaxy S22 in the Mobile Phone Category. Nguyễn Hoàng Thạch and Phan Thanh Duy have successfully Pwned the Sonos One Speaker from Sonos in the Smart Speakers category. Nguyễn Hoàng Thạch has successfully Pwned the Synology RT6600ax router & Canon imageCLASS MF743Cdw printer in the SOHO SMASHUP category References# https://www.zerodayinitiative.com/blog/2022/8/29/announcing-pwn2own-toronto-2022-and-introducing-the-soho-smashup https://twitter.com/thezdi/status/1600881760598118400"
