["http://startpage.ai/privacy-policy"]
title = "Privacy Policy – StartPage.ai"
description = "Tab Manager for iOS Safari"
full_description = "Privacy PolicyLast updated: September 6, 2021This Privacy Policy describes Our policies and procedures on the collection, use and disclosure of Your information when You use the Service and tells You about Your privacy rights and how the law protects You.Interpretation and DefinitionsInterpretation: The words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural.Definitions: For the purposes of this Privacy Policy:Application means the software program named StartPage.ai“We”, “Us” or “Our” in this Agreement refers to the StartPage.ai and BluePenguin, LLC.Personal Data is any information that relates to an identified or identifiable individual.Usage Data refers to data collected automatically, either generated by the use of the Service or from the Service infrastructure itself (for example, the duration of a page visit).You means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable.Collecting and Using Your Personal DataTypes of Data CollectedPersonal Data: StartPage.ai does not collect or store any user personal data. StartPage.ai tracks active tabs according to the tab identifier reported by the iOS operating system. This tab id does not contain any browsing history, URLs, or personal data of any kind. Data stored by StartPage.ai is stored on the user’s device and can be removed simply by uninstalling the app.Usage Data: StartPage.ai does not collect usage data.Tracking Technologies and Cookies: StartPage.ai does not use any cookies or tracking technologies.Use of Your Personal Data: StartPage.ai does not store personal data. StartPage.ai does not share personal data or information.Retention of Your Personal Data: StartPage.ai does not store personal data. All (personal or otherwise) data stored by StartPage.ai is stays on the user’s device and can be removed simply by uninstalling the app.Transfer of Your Personal Data: StartPage.ai does not transfer or transmit personal data.All (personal or otherwise) data stored by StartPage.ai is stays on the user’s device and can be removed simply by uninstalling the app.Disclosure of Your Personal Data: StartPage.ai does not store user data in the cloud so there are no circumstances under which we could disclose personal data.Security of Your Personal Data: The security of Your Personal Data is important to Us. The best way to protect the security of Your Personal Data is for StartPage.ai not to store Your Personal Data in the first place. As a result, StartPage.ai does not store Your Personal Data. Regardless, no method of transmission over the Internet, or method of electronic storage is 100% secure. While We strive to use commercially acceptable means to protect Your Personal Data, We cannot guarantee its absolute security.Children’s Privacy: StartPage.ai does not address anyone under the age of 13. StartPage.ai does not knowingly collect personally identifiable information from anyone under the age of 13 (or anyone over the age of 13 for that matter).Other Websites and Service: StartPage.ai is an extension to Safari, the default web browser on iOS and iPad devices. StartPage.ai does not alter or modify the content of sites accessed via Safari. We have no control over and assume no responsibility for the content, privacy policies or practices of any third party sites, emails, or other services that are accessed via Safari.Changes to this Privacy PolicyWe may update Our Privacy Policy from time to time. We will notify You of any changes by posting the new Privacy Policy on this page.You are advised to review this Privacy Policy periodically for any changes. Changes to this Privacy Policy are effective when they are posted on this page.Contact Us: If you have any questions about this Privacy Policy, You can contact us by email: support@startpage.ai."
