title = "Version 1.2 – Sort ordering and more – StartPage.ai"
description = "Tab Manager for iOS Safari"
full_description = 'Version 1.2 – Sort ordering and moreStartPage.ai in the NewsMore folks are discovering StartPage.ai and regaining their focus. StartPage.ai has been described as “an essential extension and something Apple should probably copy“,one of the best apps of 2021, and one of the “27 must-have tweaks, utilities, extensions, and widgets for your new iPhone“! Humbled by the praise and hope to live up to it.7. https://t.co/frosCXAyNm (@StartPageAI): Safari extensions arrived thick and fast these past few months. This is my favourite, listing all existing open tabs (and letting you close them with ease) when you try to open another. https://t.co/pJ5RNPlrOm (I) #bestmobileapps2021— Craig Grannell (@CraigGrannell) December 31, 2021https://t.co/JnJsnWqYEL is "an essential extension and something @Apple should probably copy" according to @howtogeek in their list of "7 iPhone and iPad Safari Extensions Worth Installing" https://t.co/kEG9s9Bs5Y Download it in the @AppStore for free: https://t.co/Vh9gskxSVU— startpage.ai (@StartPageAI) December 11, 2021If you just got a new iPhone, https://t.co/JnJsnWqYEL is one of the 27 must-have settings, apps, extensions, and widgets to install on a new iPhone in this handy article https://t.co/zbMaDcvwIA pic.twitter.com/OrzbgI1jp1— startpage.ai (@StartPageAI) December 29, 2021Version 1.2 Version 1.2 of StartPage.ai is now live in the AppStore and addresses some of the most common feedback:Sort order: There’s a new option to change sort order (oldest first or newest first).Larger buttons: Close buttons are now larger based on feedback. A future update will support buttons that are revealed on swipe.Close all: A common piece of feedback was the ability to close multiple tabs so we’ve added a close all button that closes all tabs. The best part is that it works with the search bar and will only close the tabs matching the search field. Now you can easily close all tabs from a particular domain or title in one click!<img fetchpriority="high" decoding="async" width="1024" height="419" src="https://startpage.ai/wp-content/uploads/2022/01/image-1-1024x419.png" alt="" class="wp-image-2025 lazyload" srcset="https://startpage.ai/wp-content/uploads/2022/01/image-1-1024x419.png 1024w, https://startpage.ai/wp-content/uploads/2022/01/image-1-300x123.png 300w, https://startpage.ai/wp-content/uploads/2022/01/image-1-768x314.png 768w, https://startpage.ai/wp-content/uploads/2022/01/image-1.png 1192w" sizes="(max-width: 1024px) 100vw, 1024px" />Private mode: Thanks to user feedback and reviews we were able to isolate and resolve an edge case that resulted in issues for some users when using private mode.Remove duplicates: Ironically using StartPage.ai too much could clutter up Safari with excess StartPage.ai tabs. The new version fixes that by automatically closing duplicate Startpage.ai tabs you might have created in the past.Moar Feedback!As always, we’re listening and acting on your feedback. Thanks for all your support and comments. Keep it coming!<img decoding="async" width="1024" height="490" src="https://startpage.ai/wp-content/uploads/2022/01/image-1024x490.png" alt="" class="wp-image-2024 lazyload" srcset="https://startpage.ai/wp-content/uploads/2022/01/image-1024x490.png 1024w, https://startpage.ai/wp-content/uploads/2022/01/image-300x143.png 300w, https://startpage.ai/wp-content/uploads/2022/01/image-768x367.png 768w, https://startpage.ai/wp-content/uploads/2022/01/image.png 1192w" sizes="(max-width: 1024px) 100vw, 1024px" />Published January 16, 2022By StartPage.AICategorized as Releases'
