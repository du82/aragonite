e.ai/wp-content/uploads/2022/01/Tapsmart-wp@2x-300x81.png 300w" sizes="(max-width: 520px) 100vw, 520px" /> Whenever you create a new tab, StartPage.ai will list out your tabs with the most recently used tabs listed first. Simply tap on an entry to switch to that tab or use the close button to quickly close tabs you don’t need anymore.<img decoding="async" width="576" height="1024" src="https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus-576x1024.png" alt="" class="wp-image-30 lazyload" srcset="https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus-576x1024.png 576w, https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus-169x300.png 169w, https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus-768x1365.png 768w, https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus-864x1536.png 864w, https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus-1152x2048.png 1152w, https://startpage.ai/wp-content/uploads/2021/09/iPhone8Plus.png 1242w" sizes="(max-width: 576px) 100vw, 576px" />Every time you create a new tab is now an opportunity to ask yourself, “do these tabs spark joy?”, so you can declutter your browser and recover your focus.<img decoding="async" width="500" height="167" src="https://startpage.ai/wp-content/uploads/2021/10/DownloadOnAppStore.png" alt="" class="wp-image-2001 lazyload" srcset="https://startpage.ai/wp-content/uploads/2021/10/DownloadOnAppStore.png 500w, https://startpage.ai/wp-content/uploads/2021/10/DownloadOnAppStore-300x100.png 300w" sizes="(max-width: 500px) 100vw, 500px" />'
