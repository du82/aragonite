["https://statamic.com/flat-file-cms"]
title = "Statamic as a Flat File CMS"
full_description = '''Discover Statamic as a Flat File CMS Learn why Statamic is the best Flat File CMS for most people. Bring fully dynamic websites and applications to life with nothing but YAML Front-Loaded Markdown files and HTML. Enjoy a beautiful, modern control panel anyone can use. Try Statamic Now Wondering if Statamic is the best flat file CMS for your project? Statamic is easy to learn, fast, flexible, and wildly extendable, with the power of Laravel under the hood — the world’s best PHP framework. On top of that, Statamic's control panel is clean and intuitive. With more than 40 fieldtypes to structure and manage your content, built in asset management, forms, permissions, nav builders, and more — there’s almost nothing you can’t do right out of the box. And best of all, you’re not limited to static sites like other platforms. You can run a fully dynamic, highly performant website without a database. Statamic is a Flat File CMS Framework. Statamic is built as a Composer Package you can install into any Laravel project, or simply run standalone in a new skeleton app. Use as much or as little of it as you want. Statamic has many interconnected but distinct pieces. There’s the control panel, the front-end data cascade that hydrates your views based on URLs, the Antlers Template Engine with all of its Tags and Modifiers, Content API and GraphQL, Content Queries (similar to Eloquent models), Static Site Generator, Form manager, Users, Roles & Permissions, and more. Each of these pieces can be used on its own if you wish, or you can just go all-in and let Statamic run the show. It’s up to you. Content production made stupid simple. Statamic's sweet spot is with content. The editing experience is intuitive and highly configurable. With over 40 fieldtypes you can assemble Blueprints to manage your content in the most logical and structured way to fit your HTML. It's up to you whether you use a "block based" editor like Bard, granular Text and Markdown fields to break up the structure, or anything in between. Use Statamic to build and manage anything, like… Long, media-rich articles Landing pages Blog posts and press releases Events Real estate listings Pricing tables And much, much more. Statamic won the CMS Critic’s Choice Award for Flat File CMS the last 3 years in a row CMS Critic praised the flexibility of Statamic's headless Content REST API, the block-based content editor (the Bard fieldtype), and its data layer that gives you the ability to store content anywhere (including a database, if you choose). Statamic also allows you to view content history, restore prior versions, see what your page looks like before publishing with Live Preview, and collaborate in real-time via multi-user editing. Lastly, CMS Critic celebrated Statamic’s excellent support system, documentation, and "tenacious" community. Statamic delivers a lot of control for building bespoke digital experiences. There are no plugins required, and it boasts excellent security to boot. Thanks CMS Critic! ❤️ Statamic scales better than every other CMS. Start your site in flat-file mode. Enable caching and watch it fly, handling requests beautifully. Enable static caching or go full static with our static site generator if-and-when that heavy traffic arrives. Have hundreds of thousands of entries, assets, or users? Switch to a database driver and move that data out of the filesystem without having to modify a single template or blueprint. Need to take it to the next level? Follow Spiegel's lead and use a custom hybrid driver, storing your records in a file system for persistence and portability while pushing the content to a cloud data provider (like ElasticSearch or Firebase) to run your site from. John O’Nolan, Founder of Ghost “Jack and his team are incredible, and you get to benefit both from the entire Laravel ecosystem, which is really, really good.” Designed and built by industry veterans Statamic was created by Jack McDade, a designer, speaker, and long-time figure in the Laravel community. Over the years he has collaborated with Taylor Otwell of Laravel, Adam Wathan of TailwindCSS, Caleb Porzio of Alpine.js, and Justin Jackson of Transistor.fm, working on design and user experiences for their respective communities. Jason Varga, Jesse Leite, Joshua Blum, and Duncan McClean round out the core dev team — both seasoned Laravel developers having contributed to Laravel core and released open source packages and tools of all sorts. And then there's the community. Statamic is consistently recognized as one of the most highly collaborative CMS projects on GitHub. FAQs Answers to frequently asked questions. Try Statamic Now Do I need to know PHP to use Statamic? Nope! All of Statamic's features are made available through our Antlers Template Language, which essentially supercharges your HTML. No PHP necessary. If you want to extend Statamic or build addons, that's where PHP comes in. Do I have to use the Control Panel? Nope! Everything you can do in the control panel can be done in your code editor. If you love your IDE and want to hang out in there all day, you go for it. We've even heard rumors there's a script to watch Star Wars via your inline terminal. Is there a hosted or cloud version of Statamic? Not yet. If this is something you're interested in, please let us know so we can properly gauge interest! It's a big investment of time that would take us away from our core product – the CMS itself. Can I try or demo Statamic Pro before buying? You bet. You can turn on Pro Edition while in development and use it for as long as you'd like as long as you buy a license when your launch your site into production. Or, you can try the online Statamic Pro Demo to explore the control panel and get a feel for the user experience. Can I build and and sell my own Statamic addon packages? Absolutely. Please do! You can open up shop, connect a Stripe account, and all you need to do is link a GitHub repo and set a few details to launch a project. Your addon detail page can even pull content right out of your README file. Can I include Statamic in my own product? Probably not. Statamic Pro can't really be packaged as a dependency of another commercial project. However, feel free to reach out and chat with us, maybe there's something we can do depending on what you're building.'''
