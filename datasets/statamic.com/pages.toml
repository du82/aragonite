["https://statamic.com/about"]
title = "About Statamic - Est. 2012"
description = "Our mission: to build the very best self-hosted publishing platform for teams and businesses of every size."
full_description = "About Statamic We make building & maintaining content-driven websites not suck. We do things differently. Statamic is a different kind of CMS. It's designed to be simple to use for content editors, and a joy to work with for developers. It's built on Laravel, the most popular PHP framework in the world, and it's designed to be fast, flexible, and easy to work with. We are obsessed with user experience. We believe that the experience of the developer building the site is just as important as the experience of the person using the site. We believe that the best way to build a great product is to build a product that we love to use ourselves. So that's what we did. We're more than toolkit to help you build websites. We're a team of people who care deeply about the web, about the people who use it, and about the people who build it. The Statamic Community is our true competitive advantage. Join our Discord chat and you'll be transported back to the good ol' days of the web, back when Twitter was new and people helped each other because kindess given is kindness received. Our Mission To build the very best self-hosted publishing platform for teams and businesses of every size. We are a fully bootstrapped Calm Company. We believe that bigger is not always better — a small, calm and focused team can stay nimble where larger teams cannot. We have chosen to stay small and foster the developer community and the ecosystem around us for support. We all grow together. And while Statamic at its core is a five person team, there are dozens of highly active contributors we collaborate with, and more than 30k registered Statamic developers. Our Discord chat server has 5,300 developers chatting and collaborating on Statamic around the clock, and we have a group of vetted partner agencies & freelancers we can recommend to anyone getting started with Statamic development. We punch well above our weight class, and our sole focus is taking care of our customers, community, and team. 12 Years Strong 15k+ Statamic Sites 75 Expert Partners 281 Contributors 5,300+ Discord Users Justin Jackson Founder, Transistor.fm “The cool thing about buying from independent makers is your dollars get invested directly in their families.” The Statamic Story Thus Far In 2012, cofounders Jack McDade and Mubashar Iqbal were fed up with the repetitive and painful task of building and maintaining client websites in a modern CMS without being able to version control the content. They believe most content shouldn't be trapped in a database where you can't see or touch it. It should be in a file you can — if you so choose — open and edit with any text or code editor. At the time, no one had built a full-featured, flat file content management system. So, treading into Blue Ocean territory, Jack and Mubs set out and accomplished just that. It was important that removing the database from the equation would not sacrifice the types of features they and their clients loved and relied upon. Fast forward to 2013 and Mubs had moved on. Jack met Jason Varga (who had built a large e-commerce addon for Statamic v1) at a conference. The guys hit it off and Jason ended up joining Jack in 2014 and they set out to build Statamic 2.0 — a complete rewrite on Laravel. It was a hit. In 2017 Der Spiegel launched their massive new site on Statamic, and we began collaborating with their team on Statamic 3 based on their experience. In 2018 we launched the Marketplace we hired Jesse Leite full-time and Erin Dalzell part-time. In 2020 we released Statamic 3 — a big refactor to make Statamic a Composer package able to be dropped into existing Laravel applications. Statamic 3 also introduced the concept of Data Repositories — new ways to store and retrieve data from a database (or anywhere, really) not just flat files. Joshua Blum joined in 2022 followed by Duncan McClean in 2023. We're now a team of six. In 2023 we hosted the first Flat Camp in the mountains of North Carolina. It was a huge success and hosted the second Flat Camp in Rome Italy in the summer of 2024. Today Statamic powers a vast range of websites, from large teams of journalists in top news organizations like TV2 and Der SPIEGEL, to SaaS companies, startups, boostrappers, bloggers, and the small local businesses that make up the backbone of the economy. Core Team We are the Statamic team. A kind, calm crew. Jack McDadeCEO/Designer Jason VargaLead Developer Jesse LeiteDeveloper Joshua BlumSupport/Developer Duncan McCleanDeveloper Erin DalzellCommunity Advocate/Developer Heroes But we're not alone. Meet some of Statamic's top community contributors. Antlers Parser, Antlers Toolbox, Antlers Book, Peformance Optimization, and Wizard of Statamic Labs™. John Koster Core, Eloquent Driver, Shopify Addon, TypeSense Search Driver, and so much more. Ryan Mitchell Core Enhancements and Fixes, Bard and Bard Addons, and much more. Jack Sleight Peak Starter Kit, Core Enhancements and Fixes, and Code Rush Podcast Rob De Kort Enterprise Scaling, Infrastructure, Flat Camp Beer + Swag, and piles of addons. Sylvester Damgaard Statamic Livewire, Statamic Tutorials, and many addons. Jonas Siewertsen Australian Statamic Evangelist, Laracon AU Speaker, creator of many addons and articles. Marty Fridel From WordPress to Statamic YouTube Channel. Michael LaRoy Core Enhancements and Fixes. Arthur Perton Core Enhancements and Fixes. Oliver Mesieh Dark Mode, RTL support, along with Azerbaijani, Persian, and Turkish translations Peiman Nourani French translations Emmanuel Beauchamps Huge Thanks We wouldn't be where we are today without the generosity of a few companies that went above & beyond to help us succeed."
year_published = 2025
