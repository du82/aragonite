["https://statamic.com/laravel-cms"]
title = "Statamic — The Best Laravel CMS"
description = "Learn why Statamic is the best CMS for Laravel for most people. It can be dropped into existing projects, used as a headless CMS or a static site generator, has a beautiful and extensible control panel, and so much more."
full_description = '''Features → Laravel CMS Statamic as a Laravel CMS Learn why Statamic is the best CMS for Laravel for most people. It can be dropped into existing projects, used as a headless CMS or a static site generator, has a beautiful and extensible control panel, and so much more. Try Statamic Now Looking for a Laravel CMS like WordPress? Statamic's control panel is clean and intuitive. With more than 40 fieldtypes to structure and manage your content, built in asset management, forms, permissions, nav builders, and more — there's almost nothing you can't do. Statamic can be dropped right into existing Laravel projects and used to edit the content of your site. Hook up as little or as much of the data in your application as you'd like, keeping you in control. Everything you know about Laravel easily transfers over and can benefit your Statamic setup. Statamic's front-end and control panel are highly extendable and configurable. You'll feel right at home. Think of Statamic as a Laravel CMS Framework. Statamic is built as a Composer Package you can install into any Laravel project, or simply run standalone in a new skeleton app. Use as much or as little of it as you want. Statamic has many interconnected but distinct pieces. There’s the control panel, the front-end data cascade that hydrates your views based on URLs, the Antlers Template Engine with all of its Tags and Modifiers, Content API and GraphQL, Content Queries (similar to Eloquent models), Static Site Generator, Form Manager, Users, Roles & Permissions, and more. Each of these pieces can be used on its own if you wish, or you can just go all-in and let Statamic run the show. It’s up to you. Are you sensing a pattern yet? Good, you should. Keep reading. Content production made stupid simple. Statamic's sweet spot is with content. The editing experience is intuitive and highly configurable. With over 40 fieldtypes you can assemble Blueprints to manage your content in the most logical and structured way to fit your HTML. It's up to you whether you use a "block based" editor like Bard, granular Text and Markdown fields to break up the structure, or anything in between. Use Statamic to build and manage anything, like… Long, media-rich articles Landing pages Blog posts and press releases Events Real estate listings Pricing tables And much, much more. Statamic is the Laravel headless CMS you've been looking for. Stop paying exorbitant monthly fees to Contentful, Prismatic, and friends and start owning your stack. Statamic's headless mode has a full REST API and GraphQL to fit your workflow of choice. Build your front end with Jamstack, Gatsby, Next.js, React, Node, Go, or whatever you love, all while Live Preview, rate throttling, request caching, and other tools are ready and waiting for you. Statamic is a one-time fee with a nominal and completely optional annual renewal to gain access the latest updates and direct developer support. Statamic scales better than every other CMS. Start your site in flat-file mode. Enable caching and watch it fly, handling requests beautifully. Enable static caching or go full static with our static site generator if-and-when that heavy traffic arrives. Have hundreds of thousands of entries, assets, or users? Switch to a database driver and move that data out of the filesystem without having to modify a single template or blueprint. Need to take it to the next level? Follow Spiegel's lead and use a custom hybrid driver, storing your records in a file system for persistence and portability while pushing the content to a cloud data provider (like ElasticSearch or Firebase) to run your site from. Your site can smoothly scale from a mom-and-pop site to a world-class media publishing organization without ever having to rewrite or rebuild anything. Designed and built by Laravel veterans Statamic was created by Jack McDade, a long-time figure in the Laravel community and speaker at multiple Laracons. Over the years he has collaborated with Taylor Otwell, Adam Wathan, Jeffrey Way, Caleb Porzio, Jason McCreary, and others working on the designs and user experiences for Laravel, Envoyer, Lumen, Laracon, Alpine.js, Laracasts, and Laravel Shift. Jason Varga, Jesse Leite round out the core dev team — both seasoned Laravel developers having contributed to Laravel core and released open source packages and tools of all sorts. And then there's the community. Statamic is consistently recognized as one of the most highly collaborative CMS projects on GitHub. Statamic Core is Free and Open Source. Our repo is open and you can see everything we're working on, submit PRs, collaborate and discuss issues, and provide feedback on new ideas and feature requests. If and when you need the extra features — like user permissions & roles, automatic git commits, the Content API, and GraphQL — you can upgrade to Statamic Pro. That money goes directly to fund continued development and direct support. When you open a support request, the same team that built the CMS answers your questions. It's hard to beat that. “Statamic allows us to completely rethink how we create content for a modern newsroom. Previous products would have made this goal unthinkable.” — André Basse, Managing Director, SPIEGEL Tech Lab Frequently Asked Questions What versions of Laravel does Statamic support? Statamic 4 supports both Laravel 9 and Laravel 10. If you need support for Laravel 8, you can use Statamic 3.4. How does Statamic compare to Nova? If you're looking for a Laravel admin panel to automatically manage the data inside millions of Eloquent Models and Many to Many Polymorphic relationships, Nova is probably a much better fit than Statamic. Though just to be thorough, you can still do it with Custom Publish Forms. However, Statamic's sweet spot is with content. Long media-rich articles, blog posts, press releases, events, real estate listings and all of that kind of stuff. Folks on Twitter have been known to say "This is the way WordPress should have built Gutenberg!" Just remember that's a subjective opinion, even if it's a popular one. The FDA wouldn't approve a claim like that, just like we can't say Statamic is gluten-free because it's made in a facility that consumes bread regularly. Is there a hosted or cloud version of Statamic? Not yet. If this is something you're interested in, please let us know so we can properly gauge interest! It's a big investment of time that would take us away from our core product – the CMS itself. Can I try or demo Statamic Pro before buying? You bet. You can turn on Pro Edition while in development and use it for as long as you'd like as long as you buy a license when your launch your site into production. Or, you can try the online Statamic Pro Demo to explore the control panel and get a feel for the user experience. Can I build and and sell my own Statamic addon packages? Absolutely. Please do! You can open up shop, connect a Stripe account, and all you need to do is link a GitHub repo and set a few details to launch a project. Your addon detail page can even pull content right out of your README file. Can I include Statamic in my own product? Probably not. Statamic Pro can't really be packaged as a dependency of another commercial project. However, feel free to reach out and chat with us, maybe there's something we can do depending on what you're building.'''
