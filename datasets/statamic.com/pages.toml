title = "Become a Creator - Statamic Marketplace"
description = "Join the Statamic Marketplace and publish the next essential Addon or Starter Kit. Build a reputation, a revenue stream, and shape the future of Statamic."
full_description = "Developers Documentation Learn how to build, maintain, and deploy Statamic sites. YouTube Watch tutorials and see new feature demos on our YouTube channel. Laracasts Video Course Learn how to build Statamic websites with creator Jack McDade. Pricing Product Blog The latest news, tips, & tales from StatamicHQ. Features Loaded with all the features most sites ever need. Support If you have questions, we'll get you some answers. Showcase Explore a gallery of sites built with Statamic Release Notes See the latest changes and improvements to Statamic Roadmap Here's what we're working on and what's coming next. Marketplace What's Hot Check out the latest hotness from the community. Addons Extend Statamic's capabilities with the power of addons. Starter Kits Jumpstart your next project with starter kits. Become a Creator Share or sell your very own addons & starter kits. Partners Partner Directory Looking to hire a developer or agency? These folks are the best. Become a Partner Looking to grow the Statamic side of your business? Let us help! Community Discord Chat Chat with the community in real time on our Discord server. Community Events Meetup groups, conferences, and other gatherings. Customer Stories See how other folks feel about working with Statamic Twitter/X Connect with #statamic on the Twitterverse. Sign In Create Account Become a Creator Join the Statamic Marketplace and publish the next essential Addon or Starter Kit. Build a reputation, a revenue stream, and shape the future of Statamic. Become a Creator The 3 Steps to Get Started Open up and name your shop (you can use your own name) Connect your GitHub & Stripe accounts Publish your Starter Kits and Addons by linking to GitHub (and Packagist for addons) and start earning (or giving away) Sure, you also need to build something first, but who's counting? How it works Each product is linked to a GitHub repo and tagging a new release pushes the update to all your customers. It's that easy. Licensing and validation is built right into the platform so you never have to worry about. Set your own prices, launch new products or editions whenever you want, track stats in your dashboard, stay in touch with your customers, and invite team members to help manage your products. Who can join The Marketplace is built on top of Stripe Connect, which handles all payouts and everything tax related. Stripe is currently available in 46 countries, but if yours isn't one of them, you can sign up to be notified when it is. Creators must be located in one of the countries supported by Stripe. We do not support other payout methods. Unfortuntely this means that if you're located in India, Russia, Ukraine, China, or any other country not supported by Stripe, you cannot sell on the Marketplace yet. What you earn You make a 75% commission on all sales. The money is paid out to your Stripe account immediately at the time of purchase. The other 25% goes to cover transaction fees, taxes, and help support Statamic and the Marketplace. If do right no can defense Product Features Pricing Statamic vs WordPress Statamic as a Laravel CMS Statamic as a Flat File CMS Roadmap Release Notes T-Shirts 'N Stuff Statamic 2 (legacy) Marketplace What's New Addons Starter Kits Become a Creator Resources Blog Documentation Support Center Showcase GitHub Brand Kit Community Events Community Links Customer Stories Partners Twitter Mastodon Discord GitHub Discussions Company About Us License Agreement Terms Privacy Sign Up for Our Newsletter A monthly firehose of news, updates, and whimsy from the weird wide world of Statamic. Subscribe © Copyright 2012-2025 Statamic, LLCAll rights reserved. 🇺🇸"
