["https://statamic.com"]
title = "Statamic — the answer to your frustrating CMS problems."
description = "Statamic supports your entire team with an award-winning user experience, a kind-hearted community, and all the power of Laravel at your fingertips."
full_description = '''The answer to your frustrating CMS problems. Statamic supports your entire team with an award-winning user experience, a kind-hearted community, and all the power of Laravel at your fingertips. Get Pro Now Try the Demo If you’re a developer, why not install locally? Powering websites from next-gen startups and global newsrooms to personal blogs and portfolios. Enjoy a control panel designed to adapt to you Customize Everything Feel right at home with an admin area that adapts to your users. Powerful Blueprints Organize fields to structure your content, forms, and other data types. 40+ Fieldtypes Always the right interface for the job, from block editors to toggle switches. Assets Bard Button Group Checkboxes Code Color Date Entries Integer Link List Markdown Radio Range Replicator Revealer Select Sites Slug Structures Table Taxonomies Template Text Time Toggle Users Video YAML Block-based Editing Bard is a simple yet infinitely powerful block-based editor, done right. Hero Slider Featured Image Video Embed Customer Review Call to Action Newsletter Signup Live Preview See your content changes come to life without ever leaving the control panel. Multi-Site Build sites that span multiple languages, domains, or sub-brands. From flat file to database, Statamic scales with you Flat file mode Database mode collections pages home.md Markdown Document Programming Streamline Icon: https://streamlinehq.com about.md Markdown Document Programming Streamline Icon: https://streamlinehq.com contact.md Markdown Document Programming Streamline Icon: https://streamlinehq.com work.md Markdown Document Programming Streamline Icon: https://streamlinehq.com testimonials.md Markdown Document Programming Streamline Icon: https://streamlinehq.com inquiry.md galleries testimonials pages.yaml galleries.yaml testimonials.yaml 1--- 2id: home 3blueprint: page 4title: Home 5page_builder: 6 - 7 title: 'Capturing life’s raw beauty wherever it takes me' 8 type: hero 9 enabled: true10 image: experimental/joshua-earle-8hvaghtyyvu-unsplash.jpg11 -12 type: galleries13 enabled: true14 query: all15 show_filters: false16 -17 portrait: louise-millan.jpg18 text: 'I am a passionate traveling photographer, dedicated to capturing the beauty of the world from every angle. Whether it’s the character of city streets, the serenity of vast landscapes, or the unique stories in individual portraits, I seek to immortalize moments through my lens.'19 signature: signature.png20 type: bio21 enabled: true22--- Bring fully dynamic websites to life with nothing but YAML Front-Loaded Markdown files. blueprints collections entries fieldsets forms taxonomies taxonomy_terms trees users sites sessions slug collection data home pages {"title":"Home","page_builder":[{"id":"m182vzb4","title":[{"type":"paragraph","content":[{"type":"text","text":"Capturing "},{"type":"text","marks":[{"type":"italic"}],"text":"life\u2019s raw beauty"},{"type":"text","text":" wherever it takes me"}]}],"type":"hero","enabled":true,"image":"experimental\/joshua-earle-8hvaghtyyvu-unsplash.jpg"},{"id":"m18cc2mg","type":"galleries","enabled":true,"query":"all","show_filters":false},{"id":"m1jkhsuh","portrait":"louise-millan.jpg","text":"I am a passionate traveling photographer, dedicated to capturing the beauty of the world from every angle. Whether it\u2019s the character of city streets, the serenity of vast landscapes, or the unique stories in individual portraits, I seek to immortalize moments through my lens.","signature":"signature.png","type":"bio","enabled":true}],"updated_by":"e57de76f-ee6a-45b5-911c-7e92dd1905a5"} about pages {"title":"About","author":"e57de76f-ee6a-45b5-911c-7e92dd1905a5","updated_by":"e57de76f-ee6a-45b5-911c-7e92dd1905a5","page_builder":[{"id":"m1jo32v5","image":"louise-millan.jpg","text":[{"type":"heading","attrs":{"level":1},"content":[{"type":"text","text":"I am "},{"type":"text","marks":[{"type":"italic"}],"text":"Louise Millan."}]},{"type":"paragraph","content":[{"type":"text","text":"My journey with photography began as a child, mesmerized by how a simple photo could convey entire stories without a word. Growing up, I developed a deep fascination with the world around me\u2014how light, shadows, and fleeting moments could transform into timeless images. This passion drove me to explore photography in depth, from capturing vibrant street scenes to expansive landscapes and intimate portraits."}]},{"type":"paragraph","content":[{"type":"text","text":"Over the years, my work has taken me across diverse settings, where I\u2019ve learned to see beauty in the ordinary, whether it\u2019s the rhythm of a bustling city street or the serenity of a remote landscape. Each frame I capture is about more than just documenting a moment; it\u2019s about sharing the emotions, energy, and stories that unfold within it."}]},{"type":"paragraph","content":[{"type":"text","text":"What truly drives me is the connection I build with the people and places I photograph. Whether it\u2019s the depth of a portrait, the dynamic energy of street photography, or the sweeping perspectives of aerial views, my goal is always to reveal something authentic, something that resonates. Outside of my professional work, I\u2019m often traveling, camera in hand, constantly searching for new angles and fresh stories to tell. Photography isn\u2019t just my career\u2014it\u2019s my way of understanding and sharing the world."}]}],"type":"image_text","enabled":true}],"parent":"home"} work pages {"title":"Work","author":"e57de76f-ee6a-45b5-911c-7e92dd1905a5","updated_by":"e57de76f-ee6a-45b5-911c-7e92dd1905a5","page_builder":[{"id":"m1b1trih","title":[{"type":"paragraph","content":[{"type":"text","text":"A collection of timeless memories by "},{"type":"text","marks":[{"type":"italic"}],"text":"Louise Millan"},{"type":"text","text":"."}]}],"type":"hero","enabled":true},{"id":"m20lqwkz","query":"all","show_filters":true,"type":"galleries","enabled":true}],"parent":"home"} tes