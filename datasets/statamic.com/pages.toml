["https://statamic.com/pricing"]
title = "Statamic Pricing"
description = "We offer single site and various options for volume licensing, as well as teacher and student educational discounts. There's something for everyone."
full_description = '''Statamic Pricing From solo bloggers to teams, clients, and larger organizations — we have options to fit all projects. Core The core Statamic experience, free to use however you want, forever. free Install Statamic One (super) admin user account One content form Content modeling with Blueprints and all 40+ fieldtypes Unlimited collections & taxonomies Asset management Live Preview All frontend features Pro For when you have a team, need more robust features, or want direct developer support. $275USDper-site Includes one year of updates.$65 USD per-year for updates after that. Buy Now Free to use while in development Everything in Core, plus: Unlimited user accounts & roles Revisions, drafts, & content history Headless, REST API, and GraphQL Multi-site, multilingual, & multi-user editing White Label customization Git integration and automation in the Control Panel Basic Developer Support Enterprise For large enterprise organizations requiring Service Level Agreements. Learn More Everything in Pro, plus: Dedicated Premium Support (SLA) Custom procurement, vendor agreements, and compliance Priority bug resolution and feature requests SSO, 2FA, Audit Logging Onboarding, training, and consulting availability Offline/Private License Validation Looking for volume discounts? We've got you covered. FAQs Answers to frequently asked questions. Try Statamic Now Can I build a site for a client and transfer the license to them later? Yes, absolutely It's a common situation and we believe that in general, website owners should also own their Statamic license. In the sites area of your account you can initiate a transfer request for any site. The recipient will receive that request and choose to approve or ignore it. What is included in Basic Developer Support? From our developers to you or yours, we'll answer your "how do I" and "is it possible" type questions via email within 2-3 business days. For those in need of guaranteed response times or more in depth answers, we recommend a premium support plan. Which product or plan should I choose? Core is perfect for getting started with learning and experimenting with Statamic, as well as building sites for yourself or even client projects that you'll be managing (Core only includes one admin account and we don't recommend sharing it). Statamic Pro is the way to go if you're building a site for a client or your company, especially if you have multiple users, multiple languages, or want to use Statamic in headless mode. If you're a large organization with multiple sites, users, and need for guarenteed support SLAs, onboarding, and influence over the feature roadmap, Enterprise is probably for you. Do you offer discounts for non-profits or educational institutions? Yes we do. We are happy to offer verified non-profits, school, and universities a 20% discount on all first-party products (except the Master License), including annual renewals. Please contact support to get the process started. Do you offer PPP (Purchase Price Parity) discounts? Yes we're happy to arrange custom PPP discounts for certain areas of the world. Please contact support for more details. If I don't like Statamic, can I request a refund? Ideally you would figure this out first by trying Statamic Core or trialing Statamic Pro. But if you've purchased a Pro license and realize Statamic isn’t the right fit for you part-way into your project, we can give you a refund as long as you’re within the first 14 days of that purchase.'''
