["https://statamic.com/roadmap"]
title = "Statamic Roadmap"
description = "Some of the bigger things we're working and planning on, as well as a list of recently launched features."
full_description = '''Developers Documentation Learn how to build, maintain, and deploy Statamic sites. YouTube Watch tutorials and see new feature demos on our YouTube channel. Laracasts Video Course Learn how to build Statamic websites with creator Jack McDade. Pricing Product Blog The latest news, tips, & tales from StatamicHQ. Features Loaded with all the features most sites ever need. Support If you have questions, we'll get you some answers. Showcase Explore a gallery of sites built with Statamic Release Notes See the latest changes and improvements to Statamic Roadmap Here's what we're working on and what's coming next. Marketplace What's Hot Check out the latest hotness from the community. Addons Extend Statamic's capabilities with the power of addons. Starter Kits Jumpstart your next project with starter kits. Become a Creator Share or sell your very own addons & starter kits. Partners Partner Directory Looking to hire a developer or agency? These folks are the best. Become a Partner Looking to grow the Statamic side of your business? Let us help! Community Discord Chat Chat with the community in real time on our Discord server. Community Events Meetup groups, conferences, and other gatherings. Customer Stories See how other folks feel about working with Statamic Twitter/X Connect with #statamic on the Twitterverse. Sign In Create Account The Roadmap Here are some of the bigger things we're working and planning on. For more granular detail on what's shipped recently, check out the Release Notes. In Progress Passkeys Passkeys will allow users to sign into the control panel using device biometrics (e.g. Touch ID or Face ID) without needing to enter a passsword. #9239 Vue 3 It's probably a bit overdue at this point, but we're looking to have the control panel running on Vue 3 for Statamic 6 next spring. #10430 Support URLs with Trailing Slashes Sometimes people want or need trailing slashes in their URLs, especially for static site generation. Let's make it possible. #1293 #9997 SEO Pro Next We've got some killer new features coming to the next major version of SEO Pro. Stay tuned. Docs Redesign A brand new docs experience is on its way. UI Refresh It's time to refresh the UI and keep Statamic modern. Nobody likes an outdated-looking control panel. Planned Improved Stache Warmer We're tinkering around with some ideas to make cache clearing and rebuilding much more efficient. Form Improvements A major upgrade to the native Form feature focused on making everything more "end-user" friendly, good for building funnel pages and other marketing-type data collection forms. #1111 #1176 #465 #902 #437 Render Tag The driver-based evolution of the Glide Tag — Render will make it possible to swap in different image manipulation services, like Imgx or Cloudflare Images. #10204 Optional Taxonomy Magic Routes Some like them, some hate them. So why not "just" make them optional? #839 Better Dashboard & Widgets We're going to make widgets much more useful, better looking, and configurable per-user, right in the control panel. No more config files. #134 Command Palette Let's upgrade the global search to a full-blown command palette letting you take actions quickly from anywhere, find and jump to settings, and more. Upgrade to Tailwind 4 We love Tailwind. As part of the upgrade we'll be migrating our color palette to use native TW colors to make using third party components easier. Shipped November 2024 Updatable Starter Kits Leaving the composer package installed will let users update their starter kits. Opt-in feature by the kit developer. August 2024 Modular Starter Kits What if Starter Kits could include other Starter Kits and define their own Composer dependencies? What if indeed. July 2024 Dictionary Fieldtype Select-style fieldtype for populating and displaying options programmatically. Includes common dictionaries: countries, currencies, and timezones. #10380 Fire More Events We want to make sure everything that changes data fires an event. This adds new or additional events for Stache, License, Search, Glide, Impersonation and Site. #10459 #10460 Arabic Translation Translate the control panel into Arabic. #10391 June 2024 Ability to Disable Control Panel Auth If you're using Jetstream, Nova, or have other login/auth pages, turn off Statamic's control panel auth pages. #8960 Auto Stache Watcher Config This new default mode for the STATAMIC_STACHE_WATCHER config will enable it on local and disable it on production, as it should (usually) be. #10354 May 2024 Dark Mode Dark Mode for the control panel. Finally! #10117 Statamic 5 Too much to list! If you've scrolled this far, just know we've shipped lots more features, we just started this new Roadmap from 5.0. If do right no can defense Product Features Pricing Statamic vs WordPress Statamic as a Laravel CMS Statamic as a Flat File CMS Roadmap Release Notes T-Shirts 'N Stuff Statamic 2 (legacy) Marketplace What's New Addons Starter Kits Become a Creator Resources Blog Documentation Support Center Showcase GitHub Brand Kit Community Events Community Links Customer Stories Partners Twitter Mastodon Discord GitHub Discussions Company About Us License Agreement Terms Privacy Sign Up for Our Newsletter A monthly firehose of news, updates, and whimsy from the weird wide world of Statamic. Subscribe © Copyright 2012-2025 Statamic, LLCAll rights reserved. 🇺🇸'''
