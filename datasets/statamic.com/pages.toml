ryone is welcome, regardless of location! This is a great way to connect with other local Statamic devs. The AU/NZ online meetup is organised by Mity Digital, a certified Statamic partner based in Adelaide and Melbourne. #Meetup Laracon EU 2025 February 3-5, 2025 - Amsterdam, Netherlands Some of the Statamic Core team will be in attendance at Laracon EU 2025. Come and hang out with us! #Conference Chicago Statamic Meetup December 19, 2024 - Chicago, US This in-person event is a great opportunity to share projects, ask questions, and connect with fellow Statamic enthusiasts. Enjoy beverages and light bites while celebrating the Statamic community. Hosted by Futureman Digital, a Statamic Partner with over 13 years of expertise in web and experiential technology. #Meetup Laracon US 2024 August 27-28, 2024 - Dallas, Texas We're at Laracon again this year! Come hang out & learn about the framework underneath Statamic. Oh and Jack will be speaking (mostly about design). #Conference Laracon Live Denmark August 22-23, 2024 - Copenhagen, Denmark Joshua Blum will giving a Statamic-focused talk at Laravel Live this year in Denmark where more than 300 Laravel and PHP enthusiasts worldwide will gather for two days of talks, learning, and networking. #Conference PHP Adelaide August 1, 2024 - Adelaide, Australia Marty Friedel from Mity Digital will be giving a crash course talk on Statamic focused on Blueprints and Fields, and how they relate to templating and a model-type approach to content. #Meetup Flat Camp 2024 June 11-14, 2024 - Rome, Italy Flat Camp returns, this time heading to Europe near Rome, Italy. Unlike a traditional conference, this event elevates the “hallway track” of a traditional conference into the main event. #Conference Flat Camp 2023 May 22-25, 2023 - Blue Ridge Mountains, NC Flat Camp makes its debut Blue Ridge mountains of North Carolina. Different from a traditional conference, Flat Camp is centered around relationships and collaboration over days full of