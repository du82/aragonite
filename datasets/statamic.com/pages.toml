description = "Stay up to date with the latest Statamic changes"
full_description = '''Release Notes Stay up to date with the latest Statamic changes.To see what's in development, check out the roadmap. 5.49.1 February 27th, 2025 What's fixed Query for entry origin within the same collection #11514 by @jasonvarga Improve validation message when handle starts with a number #11511 by @duncanmcclean Fix target .git repo handling when exporting starter kit with --clear #11509 by @jesseleite Make active toolbar buttons of Bard more visible in dark mode #11405 by @carstenjaksch Alternate Laravel 12 token repository fix #11505 by @jasonvarga 5.49.0 February 25th, 2025 What's new Laravel 12 support #11433 by @duncanmcclean What's fixed Asset Container returns relative url for same site #11372 by @marcorieser 5.48.1 February 25th, 2025 What's fixed Fix session expiry component #11501 by @jasonvarga Include port in CSP for Live Preview #11498 by @dmxmo Remove duplicate translation line from translator command #11494 by @duncanmcclean Fix carbon integer casting #11496 by @jasonvarga Only show spatie/fork prompt when pcntl extension is loaded #11493 by @duncanmcclean French translations #11488 by @ebeauchamps 5.48.0 February 21st, 2025 What's new Carbon 3 support #11348 by @duncanmcclean Allow custom asset container contents cache store #11481 by @ryanmitchell Add support for $view parameter closure with Route::statamic() #11452 by @jesseleite Add Unlink All action to relationship fields #11475 by @jacksleight What's fixed Fix handle dimensions of rotated videos #11479 by @grischaerbe Entries Fieldtype: Hide tree view when using query scopes #11484 by @duncanmcclean Fix issue with localization files named like handles #11482 by @ChristianPraiss Fix cannot use paginate/limit error when one is null #11478 by @jacksleight Fix primitive type hint handling in Statamic routes #11476 by @jesseleite 5.47.0 February 18th, 2025 What's new Support Sections in form GraphQL queries #11466 by @ryanmitchell Add empty/not empty field filters #11389 by @jacksleight Support arguments in user can/cant tags #11407 by @jacksleight Add hook into the multisite command #11458 by @duncanmcclean Set the proper CSP headers for multi-domain iframe #11447 by @edalzell Allow custom render callback for overridden exceptions #11408 by @FrittenKeeZ Support the Group fieldtype in DataReferenceUpdater #11410 by @duncanmcclean What's fixed Fix emptiness check on Value properties #11402 by @godismyjudge95 Change revision whereKey to return a collection #11463 by @ryanmitchell If nav:from references an invalid entry, ensure nothing is returned #11464 by @ryanmitchell Improve performance of the data reference updaters #11442 by @duncanmcclean Fix search results missing search_snippets #11450 by @ivang76 Ensure consistent order of get_content results #11429 by @daun Fixes empty asset alt element in AssetsFieldtype #11460 by @PatrickJunod Fix issue with AssetsFieldtype upload controls hidden on @sm size #11459 by @PatrickJunod Fix test state issues around sites cache #11455 by @jesseleite Fix InstallEloquentDriver command #11425 by @aerni Handle extra translation files in breadcrumbs #11422 by @jasonvarga Select specific repositories for Eloquent Driver install command #11381 by @kevinmeijer97 Adjust video fit in asset editor #11414 by @daun Dutch translations #11448 by @daronspence Use ubuntu-latest in GitHub Actions workflows #11443 by @duncanmcclean 5.46.1 February 4th, 2025 What's fixed Fix search:results tag when offset and paginate are set #11386 by @nopticon Live Preview: Allow changing the position of "Responsive" device option #11404 by @duncanmcclean Fix additional url segments matching taxonomy terms #11383 by @jasonvarga Use constructor property promotion in events #11380 by @duncanmcclean Fix "Curaçao" item in countries dictionary #11395 by @duncanmcclean Remove duplicate strings from translation files #11400 by @j3ll3yfi5h German translations #11399 by @helloDanuk French translations #11397 by @ebeauchamps 5.46.0 January 22nd, 2