full_description = '''Developers Documentation Learn how to build, maintain, and deploy Statamic sites. YouTube Watch tutorials and see new feature demos on our YouTube channel. Laracasts Video Course Learn how to build Statamic websites with creator Jack McDade. Pricing Product Blog The latest news, tips, & tales from StatamicHQ. Features Loaded with all the features most sites ever need. Support If you have questions, we'll get you some answers. Showcase Explore a gallery of sites built with Statamic Release Notes See the latest changes and improvements to Statamic Roadmap Here's what we're working on and what's coming next. Marketplace What's Hot Check out the latest hotness from the community. Addons Extend Statamic's capabilities with the power of addons. Starter Kits Jumpstart your next project with starter kits. Become a Creator Share or sell your very own addons & starter kits. Partners Partner Directory Looking to hire a developer or agency? These folks are the best. Become a Partner Looking to grow the Statamic side of your business? Let us help! Community Discord Chat Chat with the community in real time on our Discord server. Community Events Meetup groups, conferences, and other gatherings. Customer Stories See how other folks feel about working with Statamic Twitter/X Connect with #statamic on the Twitterverse. Sign In Create Account The Newsroom News, updates, and tips from us and others in the community. #Announcements Jay Joins the Team Welcome Jay George — a talented designer, developer, long-time community member, and proud owner of two first names — to the Statamic... #Announcements The Brand New Statamic Experience Well, we did it. After countless design iterations, a far-too-long-running git branch finally merged, and at least... Introducing — Dynamic Asset Folders! Having a content-heavy site with lots resources and assets? Our new dynamic asset folder creation to the rescue! Starter Kits Now Support Modules Starter Kits now offer even more flexibility with support for modules! Nest dependencies and let users select what to install and what to... The New Dictionary Fieldtype The new Dictionary Fieldtype is a super flexible way to let users pick from a list of options. What those options are? JSON, YAML, CSV,... Flat Camp 2024 Recap After last year's Flat Camp in the US, we came to Europe this time. Staying at a private villa in the Italian countryside, we had a... #Announcements Statamic 5 has Arrived The next major version of Statamic has arrived. #Announcements Statamic Voted Best Flat File CMS (Again) and Best Static Site Generator Statamic won CMS Critic People’s Choice Award for "Best Flat File CMS" for the third year in a row, and best Static Site Generator. #Announcements Duncan Joins the Team! Welcome Duncan McClean, a talented dev and long-time community member, now part of the Statamic team! #Tips Using Variables to Store Tag Results Discover how to optimize your templates by storing tag results in variables for more reusable, performant code. #Updates Multi-Site Permissions, Fancy Prompts, SSG Updates, and More! Discover the latest on multi-site permissions, SSG enhancements, and other goodies to streamline your Statamic projects. #Announcements Announcing Statamic Platform Learn about our new monthly subscription for high volumes of Statamic Pro sites. The more sites you have, the more you can save. #Events Statamic at Laracon US 2023 Read all about the (culinary) adventures and what was not just a conference but a gathering of amazing people in Nashville, TN. #Announcements Introducing Rad Pack Meet the Statamic Rad Pack — maintaining addons that fit somewhere in between Statamic core and third-party packages. #Events Flat Camp 2023 Recap Our first ever Statamic non-conference in the mountains of North Carolina was magical and exceeded our wildest dreams. #Updates Statamic 4 Has Been Unleashed The latest and greatest major version of Statamic has arrived with huge UI improvements. #Announcements Statamic Voted Best Flat File CMS Again Statamic won CMS Critic People’s Choice Award for "Best Flat File CMS" for the second time in a row. #Updates Statamic 3.4 Released Bard improvements, CP customizations and a Preferences editor come along with making the Runtime Antlers Parser the new default view engine. #Updates New in 3.3.59 – Duplicating! Today Laracasts launched its latest Creator Series on Statamic, created by Jack McDade! #Announcements New Laracasts Series — Learn Statamic with Jack Today Laracasts launched its latest Creator Series on Statamic, created by Jack McDade! #Community Advanced Deployment Course by Jonas Jonas Siewertsen from Speigel just launched a brand new, premium course on advanced deployments with Statamic. RSS Feed More → If do right no can defense Product Features Pricing Statamic vs WordPress Statamic as a Laravel CMS Statamic as a Flat File CMS Roadmap Release Notes T-Shirts 'N Stuff Statamic 2 (legacy) Marketplace What's New Addons Starter Kits Become a Creator Resources Blog Documentation Support Center Showcase GitHub Brand Kit Community Events Community Links Customer Stories Partners Twitter Mastodon Discord GitHub Discussions Company About Us License Agreement Terms Privacy Sign Up for Our Newsletter A monthly firehose of news, updates, and whimsy from the weird wide world of Statamic. Subscribe © Copyright 2012-2025 Statamic, LLCAll rights reserved. 🇺🇸'''
