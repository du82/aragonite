description = "Anti-Corruption and Transparency We prioritize anti-corruption and seek to make it even harder for criminality and terrorism to take root and spread, to promote governments that are more stable and accountable, and to level the playing field for U.S. businesses to compete in every region. Arms Control and Nonproliferation We work to counter threats to […]"
full_description = '''document.addEventListener("DOMContentLoaded", function(event) { if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } }); document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); HomePolicy Issues hide Policy Issues Anti-Corruption and Transparency We prioritize anti-corruption and seek to make it even harder for criminality and terrorism to take root and spread, to promote governments that are more stable and accountable, and to level the playing field for U.S. businesses to compete in every region. Arms Control and Nonproliferation We work to counter threats to the United States and the international order caused by the proliferation of weapons of mass destruction and their delivery systems, advanced conventional weapons, and related materials, technologies, and expertise. Climate and Environment U.S. climate and environment diplomacy aspires to realize economic growth, energy security, and a healthy planet. The well-being of the natural world affects millions of U.S. jobs and the health of our people, and so we work with partners to advance U.S. interests on issues such as addressing climate change, combating wildlife trafficking, fostering resilience, conserving nature, water security, and reducing harmful pollutants Combating Drugs and Crime Effectively combating transnational criminal organizations requires a comprehensive, committed, and well-coordinated approach between us, other federal agencies, and our partners around the world. Countering Terrorism As the threats posed by terrorist organizations continue to evolve, we work to build global consensus to degrade and defeat these adversaries. We also work closely with the Departments of Defense, Homeland Security, Justice, Treasury, and the Intelligence Community to lead an integrated whole-of-government approach to international counterterrorism. Cyber Issues In partnership with other countries, we lead the U.S. government’s efforts to promote an open, interoperable, secure, and reliable information and communications infrastructure that supports international trade and commerce, strengthens international security, and fosters free expression and innovation. Economic Prosperity and Trade Policy Our economic officers focus on building a strong U.S. economy that creates jobs and underpins national security, highlight economic considerations in policy formulation, and build the relationships needed to expand commercial ties that drive American prosperity. Energy We promote U.S. interests globally on critical issues such as ensuring economic and energy security for the United States and its allies and partners, removing barriers to energy development and trade, and promoting U.S. best practices regarding transparency and good governance. We also work to deny terrorists and rogue nations access to funds derived from energy production. Global Health Outbreaks of infectious disease do not respect national boundaries. Halting and treating diseases at their points of origin is one of the best and most economical ways of saving lives and protecting Americans. We actively work to prevent, detect, and respond to infectious disease threats. Human Rights and Democracy The United States uses a wide range of tools to advance a freedom agenda, including bilateral diplomacy, multilateral engagement, foreign assistance, reporting and public outreach, and economic sanctions. We work with democratic partners, international and regional organizations, nongovernmental organizations, and engaged citizens to support those seeking freedom. Human Trafficking We lead U.S. global engagement to combat human trafficking and support the coordination of anti-trafficking efforts across the U.S. government. The United States follows the widely used “3P” paradigm — prosecution, protection, and prevention — to combat human trafficking worldwide. We also employ a “4th P” — for partnership — as a complementary means to achieve progress across the 3Ps and enlist all segments of society in the fight against modern slavery. The Ocean and Polar Affairs The United States works to efficiently and effectively develop and manage ocean resources with neighboring countries and the international community to preserve their health and wealth for many generations to come. The changes today in the Arctic — economic, social, and environmental — transcend national borders, opening new opportunities and making international cooperation critical for the Arctic’s continued sustainable development. Refugee and Humanitarian Assistance The primary goal of U.S. humanitarian assistance is to save lives and alleviate suffering by ensuring that vulnerable and crisis-affected individuals receive assistance and protection. U.S. funding provides life-saving assistance to tens of millions of displaced and crisis-affected people, including refugees, worldwide. Science, Technology, and Innovation We execute public diplomacy programs that promote the value of science to the general public. We also implement capacity-building programs in emerging markets that train young people to become science and technology entrepreneurs. Our efforts contribute to scientific enterprises that hasten economic growth and advance U.S. foreign policy priorities. Treaties and International Agreements Treaties and other international agreements are written agreements between sovereign states (or between states and international organizations) governed by international law. The United States enters into more than 200 treaties and other international agreements each year.'''
