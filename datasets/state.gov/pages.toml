description = "Report to Congress onConditions in Hong Kong of Interest to the United StatesSection 1256 of the John S. McCain National Defense Authorization Act for Fiscal Year 2019 (PL 115-232) (22 U.S.C. 5731) Consistent with sections 205 and 301 of the United States-Hong Kong Policy Act of 1992 (the “Act”) (22 U.S.C. 5725 and 5731) and section […]"
full_description = '''document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); HomeBureau of East Asian and Pacific Affairs Remarks & Releases…2024 Hong Kong Policy Act Report hide if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } 2024 Hong Kong Policy Act Report Report Bureau of East Asian and Pacific Affairs March 29, 2024 Report to Congress onConditions in Hong Kong of Interest to the United StatesSection 1256 of the John S. McCain National Defense Authorization Act for Fiscal Year 2019 (PL 115-232) (22 U.S.C. 5731) Consistent with sections 205 and 301 of the United States-Hong Kong Policy Act of 1992 (the “Act”) (22 U.S.C. 5725 and 5731) and section 7043(g)(3)(C) of the Department of State, Foreign Operations, and Related Programs Appropriations Act, 2023 (Div. K, P.L. 117-328), the Department submits this report and the enclosed certification on conditions in Hong Kong from February 2023 through December 2023 (“covered period”). Summary The Department of State assesses that during the covered period, the central government of the People’s Republic of China (PRC) took new actions that directly threaten U.S. interests in Hong Kong and that are inconsistent with the Basic Law and the PRC’s obligation pursuant to the Sino-British Joint Declaration of 1984 (“Sino-British Joint Declaration”) to allow Hong Kong to enjoy a high degree of autonomy. There remain key differences between Hong Kong and mainland China in some areas, including commercial and trade policy, internet freedom, and freedom of religion, but PRC and Hong Kong authorities continued to use “national security” as a broad and vague basis to undermine the rule of law and protected rights and freedoms. Authorities further restricted direct voting. In the Certification of Hong Kong’s Treatment under U.S. Laws, the Secretary of State certified that Hong Kong does not warrant treatment under U.S. law in the same manner as U.S. laws were applied to Hong Kong before July 1, 1997. During the covered period, Hong Kong authorities, under the supervision of the PRC central government, used the central government-imposed 2020 National Security Law (NSL) to further erode the rule of law in Hong Kong and the human rights and fundamental freedoms of people in Hong Kong, as well as to harass and intimidate individuals outside of its borders. In July and December, the Hong Kong Police Force issued bounties on overseas democracy advocates, attempting to enforce the NSL outside of Hong Kong’s borders. Within the special administrative region, authorities undermined the rights of defendants in cases designated as involving national security. Hong Kong authorities arrested and prosecuted people for peaceful political expression critical of the local and central governments, including for posting and forwarding social media posts. Hong Kong and PRC authorities continued to target civil society groups, activists, media companies and journalists, political parties, labor unions, academics, student groups, and other people and organizations that the government accused of being connected to Hong Kong’s pro-democracy movement or otherwise critical of the local or central government. Hong Kong authorities undermined media freedom by continuing the prosecutions of journalists and restricting access to information. PRC authorities denied people in Hong Kong a meaningful role in the city’s governance, administering new rules that significantly limited the number of directly elected District Councilors and introducing a new nominating process that effectively barred independent and non-establishment candidates from running for office. In December 2022, the PRC National People’s Congress Standing Committee (NPCSC) issued its first “interpretation” of the NSL stating that the Chief Executive and Committee for Safeguarding National Security in Hong Kong have the authority to issue legally binding certificates and decisions on issues related to national security that are not subject to judicial review. In May 2023, the Legislative Council passed a law affirming this interpretation, allowing the Chief Executive to restrict overseas lawyers from participating in NSL cases, which further undermines the independence of Hong Kong’s judiciary. These actions and others contributed to the Department of State’s assessment and the Secretary of State’s certification. Impact on Democratic Institutions and Universal Suffrage During the covered period, PRC and Hong Kong authorities deliberately acted to restrict the ability of Hong Kong voters to elect representatives of their choosing. PRC and Hong Kong officials played an unprecedented role in shaping the outcome of District Council elections held on December 10, 2023. New election rules in 2023 severely limited the role of voters, the ability of candidates to run for office, and the eventual role of directly elected representatives. Most notably, the proportion of district councilors elected by the public was reduced from nearly 95 percent to less than 20 percent. The majority of district councilors were appointed by the Chief Executive or selected by government-appointed district committees. All candidates had to secure nominations by members of regional committees to stand for election. No candidates from pro-democracy or independent parties secured nominations and therefore did not stand for election, and more than 90 percent of new district councilors came from the government-appointed committees responsible for nominating candidates. Voter turnout in December 10 District Council elections (27.5 percent) hit a record low, beating the previous record for low turnout in 1988 (30.3 percent) and far below the record high in 2019 (71.2 percent), when pro-democracy candidates won by a landslide. Pro-Beijing politicians occupied the office of the Chief Executive and all but one of the 90 seats in the Legislative Council during the covered period, after electoral changes in 2021 drastically reduced the number of seats filled by direct election and required all candidates running for the Council to receive the approval of the Beijing-dominated Hong Kong Election Committee. Hong Kong authorities took no actions during this period to advance the election of all members of the Legislative Council by universal suffrage, which, as with the election of the Chief Executive, the Basic Law describes as its “ultimate aim.” Activists and local media reported that since the electoral changes, the Legislative Council and District Councilors have become less responsive to public input, particularly from marginalized and underrepresented groups. Impact on Police and Security Functions Hong Kong authorities used the NSL, which the NPCSC imposed on Hong Kong in June 2020, to conduct politically motivated arrests and prosecutions against people and groups expressing views critical of the PRC or Hong Kong authorities or affiliated with the pro-democracy movement. During the covered period, based on publicly available information, authorities arrested at least 35 people in connection with alleged offenses that Hong Kong authorities designated as involving “national security,” including pursuant to the colonial-era statute on “sedition” and the offenses listed in the NSL (secession, subversion, terrorist activities, and collusion with a foreign country or external elements to endanger national security). According to public reports, authorities filed charges against at least seven individuals in connection with alleged “national security”-designated offenses. During the covered period, at least five individuals were found guilty of violating the NSL or the sedition statute at trial, and none were acquitted, while at least 42 individuals pled guilty to violating the NSL or the sedition statute. This includes 31 of the 47 former politicians and activists charged with conspiracy to commit subversion for their involvement in the July 2020 unofficial pan-democratic primary election who pled guilty to that charge. With few exceptions, the individuals arrested and prosecuted were exercising freedoms guaranteed in the Basic Law and recognized in the International Covenant on Civil and Political Rights. The NSL grants the Hong Kong Police Force (HKPF) broad authorities to conduct wiretaps, electronic surveillance, and searches without warrants in national security-related cases, and to require internet service providers to provide or delete information relevant to these cases. During the covered period, there were credible reports that PRC security services and the Office of Safeguarding National Security monitored pro-democracy and human rights activists as well as journalists in Hong Kong. The Hong Kong government applied the NSL extraterritorially to target activists for exercising free speech. In July 2023, the HKPF announced arrest warrants and bounties of more than $127,000 each targeting eight democracy advocates living in the United States, the United Kingdom (UK), and Australia. On December 14, 2023, the HKPF announced arrest warrants and bounties targeting five additional activists living in the United States and the UK, including a U.S. citizen. The HKPF regularly questioned Hong Kong-based family members and acquaintances of overseas activists. The Hong Kong police’s surveillance of pro-democracy activists continued even after convicted offenders were released from prison. Pro-democracy student activist Tony Chung announced in December 2023 that he had fled Hong Kong to seek asylum in the UK. Chung had finished his three-and-a-half-year jail term in June 2023 after being convicted of multiple charges under the NSL, including “committing secession,” as well as a sedition charge for “conspiracy to publish seditious publications.” Chung told media he was under “intense surveillance” after being released from prison, and said he was required to report to national security police every two to four weeks. He said police compelled him to become a paid informant and provide information on fellow activists. He also said he signed a confidential declaration that restricted him from disclosing his interactions with national security police to any third parties, including a lawyer. In December 2023, the Hong Kong government amended NSL implementation rules to expand its powers to seize assets. The NSL authorizes the Chief Executive to formulate implementation details without the need for scrutiny by the Legislative Council. The amendment allowed the Secretary of Security to freeze property of anyone convicted of national security offenses until the conclusion of that individual’s legal proceedings. Impact on Judicial Independence and the Rule of Law The Sino-British Joint Declaration, as well as Hong Kong’s Basic Law, provide for an independent judiciary in Hong Kong, but during the covered period, PRC and Hong Kong authorities took actions that eroded the Hong Kong judiciary’s independence and ability to uphold the rule of law in cases that Hong Kong authorities designated as involving national security. In cases where authorities assert a nexus with national security, there is little to no expectation of a fair trial or associated fair trial guarantees and other applicable legal protections. In April 2023, the UN Special Rapporteur on the Independence of Judges and Lawyers warned that the NSL could undermine the independence of Hong Kong’s judiciary, noting a lack of due process guarantees. The UN special rapporteur recommended the PRC review and reconsider the NSL in Hong Kong to comply with the PRC’s international human rights obligations. The NSL states that only the NPCSC – not Hong Kong courts – has the power to interpret the NSL, and any such interpretations are not subject to review in Hong Kong’s courts. The Hong Kong government and the PRC NPCSC intervened in democracy advocate Jimmy Lai’s judicial proceedings, issuing the first “interpretation” of the NSL in 2022 to deny the defendant his choice of legal representation. In December 2022, the NPCSC issued its first “interpretation” of the NSL stating that the Chief Executive and Committee for Safeguarding National Security in Hong Kong have the authority to issue legally binding certificates and decisions on issues related to national security that are not subject to judicial review. The interpretation effectively empowered the Hong Kong executive branch to overturn or preempt judicial decisions related to national security, which experts noted can include topics such as finance, culture, or energy. In May 2023, the Legislative Council passed a law affirming this interpretation, allowing the Chief Executive to restrict overseas lawyers from participating in NSL cases, which further undermined the independence of Hong Kong’s judiciary. On May 19, a court rejected Lai’s appeal, blocking his lawyer from representing him in his NSL trial, which began on December 18. Under the NSL, defendants charged with national security-related offenses may not be granted bail unless a judge has sufficient grounds to believe the defendant or suspect will not continue to commit acts endangering national security. Unlike in other criminal cases, it is the defendants’ burden to demonstrate that they will not continue to commit acts endangering national security. Under this standard, many defendants charged under the NSL remain in custody months or years after their initial detention.'''
