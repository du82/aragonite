full_description = 'Bureau Home Bureau Home About Us Leadership Contact Us HomeBureaus & Offices > The Secretary of State ...Bureau of Legislative Affairs hide document.addEventListener("DOMContentLoaded", function(event) { if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } }); Bureau of Legislative Affairs Our Mission The Bureau of Legislative Affairs (H) coordinates all legislative activity for the Department of State, proudly serves as the Department’s main interlocutor to Congress, and advises the Secretary, the Deputies, as well as the Under Secretaries and Assistant Secretaries on legislative strategy. In 2023, H broke a record and supported 3478 separate engagements, including 48 interactions between the Secretary and Congress, as well as worked on 594 Congressional trips overseas, 106 hearings, 1181 correspondence letters, 505 Congressional report submissions, and a total of over 210 confirmations since 2021. The Capitol Hill Liaison Offices, maintained by the Bureau inside the Capitol, handled over 9400 policy and consular casework inquiries while also facilitating programs to sustain close collaboration with Congress. We are proud to serve the U.S. public through our work with Congress! Offices Bureau Operations Capitol Hill Liaison Office Office of House Affairs Office of Regional, Global, and Functional Affairs Office of Senate Affairs'
