title = "African Women’s Entrepreneurship Program - United States Department of State"
description = "In 35 countries, AWEP chapters serve as business associations for women entrepreneurs. These chapters conduct trainings, engage in global business fairs, and partner with other institutions to promote members’ businesses. What is AWEP? The African Women’s Entrepreneurship Program (AWEP) is a women’s entrepreneurship initiative that provides funding and capacity-building resources to African businesswomen to promote […]"
full_description = '''document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); HomeKey Topics – Bureau of African Affairs …African Women’s Entrepreneurship Program hide if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } African Women’s Entrepreneurship Program In 35 countries, AWEP chapters serve as business associations for women entrepreneurs. These chapters conduct trainings, engage in global business fairs, and partner with other institutions to promote members’ businesses. What is AWEP? The African Women’s Entrepreneurship Program (AWEP) is a women’s entrepreneurship initiative that provides funding and capacity-building resources to African businesswomen to promote their participation in international trade. The program was first established at the 2010 African Growth and Opportunity Act (AGOA) forum by the U.S. Department of State, and it initially brought women entrepreneurs to the United States through the International Visitor’s Leadership Program (IVLP) for capacity building and professional development workshops. The workshops provided information on a series of topics such as U.S. business practices and access to U.S. markets under AGOA. Upon return to their respective countries, AWEP participants launched AWEP chapters in 44 African countries, many of which are still active today, and serve as business associations and networking hubs. AWEP was relaunched in 2022 with new programmatic features during the United States-Africa Leaders’ Summit in Washington, DC. AWEP’s relaunch supports the expansion and export capability of women-led businesses in Africa by bolstering access to capital and markets and skills and capacity building. The program promotes women’s leadership throughout the continent. It focuses on connecting an inclusive membership and empowering AWEP women through local trainings and workshops in Africa. As part of a partnership between the U.S. Department of State and the U.S. African Development Foundation, AWEP also provides grants to established women-owned SMEs and works to connect African women entrepreneurs with American buyers and diaspora-owned businesses. These advancements equip African businesswomen with the tools and opportunities to grow their businesses, serve as community leaders, and drive social and economic progress on the continent. AWEP’s relaunch empowers African women entrepreneurs on the ground to increase their participation in international trade. What is AWEP’s Purpose? The State Department is proud to relaunch AWEP with an expanded mandate to support the growth, profitability, and export of women-led businesses in Africa by bolstering access to capital, access to markets, skills and capacity building, and women’s leadership. AWEP strives to assist African women in business to overcome inequities that restrict the growth and success of their businesses. According to a 2019 World Bank report, despite comprising over 50 percent of Africa’s population and 60 percent of Africa’s Small and Medium-Sized Enterprises (SMEs) owners, women on the continent generate 34 percent less profit than their male counterparts. Read More Collapse Additional Content USG Partnerships AWEP’s intra-agency collaborations facilitate accessible, impactful trainings for women entrepreneurs on the ground. By partnering with the Commercial Law Development Program (CLDP) within the U.S. Department of Commerce, the International Trade Administration, and the Secretary’s Office of Global Women’s Issues (GWI), AWEP provides trainings to facilitate knowledge of business opportunities and best practices for African women entrepreneurs. AWEP has also partnered with the U.S. African Development Foundation to provide a limited number of grants in the amount of $50,000 to $100,000 to advanced women-owned SMEs to support their growth and expansion. Private Sector Partnerships AWEP’s relaunch welcomes partnerships with the private sector to provide trainings that drive profitability and exports both within Africa under the African Continental Free Trade Area and to the United States. In the past, AWEP has partnered with ExxonMobil, the Cherie Blair Foundation for Women, Vital Voices, and Intel on follow-on trainings with alumnae post-IVLP. Tags African Women’s Entrepreneurship Program Bureau of African Affairs Women's Economic Empowerment and Security'''
