ignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); JOHANNES EISELE/AFP via Getty Images HomeBureaus & Offices > Under Secretary for Civilian Security, Democracy, and Human Rights …Office of the U.S. Special Coordinator for Tibetan Issues hide Office of the U.S. Special Coordinator for Tibetan Issues Our Mission The Special Coordinator for Tibetan Issues coordinates U.S. government policies, programs, and projects concerning Tibetan issues. The Special Coordinator works to advance six priorities by collaborating closely with Tibetan religious, cultural, and political leaders; the U.S. Congress; international allies and partners; and civil society representatives. Our Priorities The Special Coordinator’s six priorities are: Advancing the human rights of Tibetans; Helping the Tibetan community preserve its distinct religious, cultural, and linguistic identity; Addressing the humanitarian needs of Tibetans, including Tibetan diaspora communities; Increasing access to Tibet for U.S. diplomats and other officials, journalists, and tourists; Promoting activities to protect the environment and water resources of the Tibetan plateau; and Supporting resumption of dialogue, without preconditions, between the PRC and the Dalai Lama or his representatives.'''
