Advisor Our Mission The Office of the AUKUS Senior Advisor (S/AUKUS) is responsible for overseeing and coordinating the implementation of the AUKUS partnership at the U.S. Department of State. To this end, it coordinates the Department’s efforts to deepen diplomatic, security, and defense cooperation between Australia, the United Kingdom, and the United States in the Indo-Pacific and beyond. S/AUKUS leverages all the tools of statecraft to support the goals of this trilateral partnership, fostering an environment that enables the elevation, integration, and facilitation of AUKUS activity to meet the challenges of the 21st century. AUKUS Senior Advisor Matthew D. Steinhelfer Our Priorities At the Department of State, S/AUKUS’ top three priorities are: Coordinating U.S. Department of State implementation of the AUKUS partnership Advancing AUKUS progress Elevating AUKUS outreach and partnerships'''
