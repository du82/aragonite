full_description = '''Office Home Office Home About Us Key Topics Celebrating Our Employees document.addEventListener("DOMContentLoaded", function(event) { if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } }); document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); HomeBureaus & Offices > The Secretary of State …Office of Civil Rights hide Office of Civil Rights Our Mission The Office of Civil Rights (S/OCR)’s mission is to manage the Department’s equal employment opportunity (EEO) program. We do this through our oversight of the EEO Process, management of the Anti-Harassment Program (AHP), educating employees about unlawful employment discrimination, facilitating resolution, and advocating change to overcome barriers that restrict equal employment opportunity. Filing an EEO Complaint Harassment Policies Personal Assistance Policy Reasonable Accommodation Policy Affirmative Action Plan for People With Disabilities Equal Opportunity Policies It is the policy of the Federal Government to treat all of its employees with dignity and respect and to provide a workplace that is free from discrimination. Federal statutes protect employees and applicants from discrimination involving: Unfair treatment because of protected EEO bases; Harassment by managers, co-workers, or others in the workplace, because of protected EEO bases; Denial of a reasonable workplace accommodation because of religious beliefs or disability; Retaliation due to opposition to discrimination or participation in EEO process. Learn More about filing an EEO complaint The Department of State is committed to providing a workplace that is free from discriminatory harassment and from sexual harassment. Learn more about Harassment policies It is the policy of the U.S. Department of State to provide personal assistance services (PAS) for qualified individuals with targeted disabilities. Learn more about the Department’s PAS procedures It is the policy of the U.S. Department of State to comply fully with the requirements of the Rehabilitation Act of 1973, as amended, 29 U.S.C. § 791 et seq. The Equal Employment Opportunity Commission (EEOC) has issued regulations at 29 C.F.R. Part 1630 implementing the provisions of the law for federal agencies. Learn more about the Department’s accommodation policy On January 3, 2017, the Equal Employment Opportunity Commission (EEOC) issued an update to Section 501 of the Rehabilitation Act, as amended. Pursuant to 29 CFR 1614.203(e)(2), each agency shall make an affirmative action plan for the hiring, placement, and advancement of individuals with disabilities and make it available to the public. Learn more about the affirmative action plan If you are a member of the public, and you believe that the Department, a U.S. Embassy, U.S. Consulate, Consular Agency, or one of the Department’s funding recipients has discriminated against you because of your race, color, national origin, or disability, you may wish to file a complaint with the Department’s Office of Civil Rights (S/OCR). In most cases, you must file your complaint within 180 days of the alleged discriminatory act. Learn more about Equal Opportunity Policies'''
