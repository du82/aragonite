nt program organized by the U.S. Department of State. The program started in 2013. The program focuses on four themes that Pacific youth identified as their top priorities: Education Environment and Resource Management Civic Leadership Economic and Social Development Who is YPL? The YPL community consists of young leaders, 25-35 years old, from Australia, the Cook Islands, Fiji, the Federated States of Micronesia, the Islands of French Polynesia, Kiribati, the Marshall Islands, Nauru, New Caledonia, New Zealand, Niue, Palau, Papua New Guinea, Samoa, Solomon Islands, Tonga, Tuvalu, Vanuatu, Wallis and Futuna, and the American-affiliated Pacific including American Samoa, Guam, the Commonwealth of the Northern Mariana Islands, and Hawaii. Why YPL? YPL strengthens linkages between emerging leaders across the Pacific and the United States. These relationships between the younger generation of government, civic and business leaders help to harness the extraordinary potential of youth in the region to address critical challenges and expand opportunities. Future YPL For more details on upcoming opportunities, visit the Young Pacific Leaders website, follow the Young Pacific Leaders on Facebook (@youngpacificleaders), and Instagram (@weareyoungpacificleaders). Tags Bureau of East Asian and Pacific Affairs Cross-Cultural Communications and Exchanges Geopolitical and Regional Policy Youth Programs'''
