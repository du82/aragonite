Operations hide Bureau of Conflict and Stabilization Operations Our Mission The Bureau of Conflict and Stabilization Operations (CSO) enhances the State Department’s ability to anticipate, prevent, and respond to conflict and promote stability though a suite of tools, capabilities, and programs. We lead the U.S. Government’s implementation of two laws: the Global Fragility Act of 2019 and its associated U.S. Strategy to Prevent Conflict and Promote Stability, and the Elie Wiesel Genocide and Atrocities Prevention Act of 2018. Follow Us: Twitter Facebook Tools and Capabilities Negotiations Support Unit CSO houses the Department’s Negotiations Support Unit, which advises U.S. diplomats and other officials on resolving some of the most intractable international disputes. Our experts support every stage of the negotiation process and advise on both the process and substance of peace talks. Peace Agreement Implementation After a peace agreement is signed, what comes next? CSO has programs to help monitor and support the implementation of peace agreements. This work helps prevent backsliding into conflict. Data Analytics CSO’s use of unclassified technology and data tracks global conflict trends to inform U.S. strategies, policies, and programs on conflict prevention and stabilization. In 2019, CSO launched the Instability Monitoring and Analysis Platform, which offers geospatial conflict analysis, negotiations modeling, violence and atrocity forecasting, and conflict trend assessments for personnel across the U.S. Government. Conflict Observatories Through Conflict Observatories, CSO funds independent research and documentation of human rights abuses, war crimes, and other atrocities. The Conflict Observatories use open-source information and data such as satellite imagery and social media. This documentation can be used for accountability efforts, including potential civil and criminal legal processes. Armed Actor Mitigation CSO provides analysis, policy recommendations, and programming to address the destabilizing impacts of armed actors. This work includes armed actor mapping, promoting defections from armed groups, and supporting broader Department efforts on security sector governance/reform activities. We also lead programs preparing for disarmament, demobilization, and reintegration. Strategic Gaming CSO hosts tabletop exercises and red teams to help inform decisions. This allows U.S. government decision makers to explore options for response to issues like political instability and strategic competition, including with foreign partners. Stabilization Advisors CSO deploys stabilization advisors to embassies and military combatant commands around the world to provide on-the-ground conflict expertise and increase civil-military coordination. The United States has strong national security and economic interests in reducing levels of violence and promoting stability in areas affected by armed conflict.Global Fragility Act of 2019 Key Legislation Global Fragility Act and Strategy to Prevent Conflict and Promote Stability Atrocity Prevention Women, Peace, and Security (WPS) In 2019, President Trump signed into law the Global Fragility Act (GFA), which led to the establishment of the U.S. Strategy to Prevent Conflict and Promote Stability in 2020. The goal of the GFA is to prevent crisis and conflict before they happen. By using the GFA to help prevent conflict before it starts, we can save American lives and taxpayer dollars by avoiding the need for costly humanitarian and military assistance. Read more about the Strategy The bipartisan Elie Wiesel Genocide and Atrocities Prevention Act of 2019, signed into law by President Trump, prioritizes atrocity prevention, response, and recovery. CSO leads interagency efforts to prevent, mitigate, and respond to atrocities, making America safer, stronger, and more prosperous. CSO advances the U.S. Strategy and National Action Plan on Women, Peace, and Security (WPS). CSO also integrates WPS as a cross-cutting priority into implementation of the Global Fragility Act, Elie Wiesel Genocide and Atrocities Prevention Act, and across all the Bureau’s tools and capabilities, including negotiations support and data analytics. “On behalf of the Department, I apologize to those who were impacted by the practices of the past and reaffirm the Department’s steadfast commitment to diversity and inclusion for all our employees, including members of the LGBTI community.” Read Former Secretary Kerry’s full apology'''
