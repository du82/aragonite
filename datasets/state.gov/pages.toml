title = "About - United States Department of State"
description = "Leadership Secretary of State The Secretary of State, appointed by the President with the advice and consent of the Senate, is the President’s chief foreign affairs adviser. The Secretary carries out the President’s foreign policies through the State Department, which includes the Foreign Service, Civil Service, and U.S. Agency for International Development. Deputy Secretary of […]"
