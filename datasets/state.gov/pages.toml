ganizations (NGOs), and private industry worldwide to participate in analytic exchanges. The Office of Analytic Outreach (AO) tailors analytic exchanges to align with and contribute to Department of State and Intelligence Community (IC) analytic and policy priorities. AO analytic exchanges offer new perspectives and analytical insights to thousands of IC analysts and U.S. Executive Branch policy makers. Analytic exchanges prepare State Department officials at all levels, including undersecretaries, assistant secretaries, and ambassadors, to formulate and advance U.S. foreign policy. All AO analytic exchanges are for USG Executive Branch officials. They are off-the-record and not for attribution to ensure an environment conducive to candid discussion. For more information about analytic exchanges, please email: INRAnalyticOutreach@state.gov Learn More About Analytic Exchanges Analytic Exchanges Geospatial Data Strategy document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); document.addE