description = "(hosted on Afghanistan Inquiries, Embassy Kabul, and USCIS websites)  دری |پښتو Family Reunification for Afghans  The U.S. Government is committed to helping U.S. citizens and Afghans in the United States reunite with their family members who remain in Afghanistan. This page describes your different immigration options for reuniting with your family. Your options are based […]"
full_description = '''HomeAfghanistan Inquiries ...Family Reunification for Afghans hide document.addEventListener("DOMContentLoaded", function(event) { if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } }); Family Reunification for Afghans document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); (hosted on Afghanistan Inquiries, Embassy Kabul, and USCIS websites) دری |پښتو Family Reunification for Afghans The U.S. Government is committed to helping U.S. citizens and Afghans in the United States reunite with their family members who remain in Afghanistan. This page describes your different immigration options for reuniting with your family. Your options are based on your citizenship, your immigration status, and how you entered the United States. Your first step is the immigration process. In addition, some family members may be eligible for assistance from the U.S. Government to depart Afghanistan. If the U.S. Government helps your family members depart Afghanistan, they will only be able to enter the United States if approved by U.S. immigration officials. DS-4317 Application Status Inquiry If You Are a U.S. Citizen: If you are a U.S. citizen, your spouse, your children, and your parents may be eligible to immigrate to the United States immediately. U.S. citizens may also petition for their siblings and unmarried adult children, who may immigrate once a visa is available. The immigration process for your family members: You begin the immigrant visa application process for your family members by filing a petition, the Form I-130 Petition for Alien Relative, with U.S. Citizenship and Immigration Services (USCIS). USCIS will review petitions as quickly as possible. If USCIS approves the petition, the National Visa Center (NVC) will contact your family members to apply for their immigrant visas. How fast they can be interviewed will depend on their visa category. The NVC may ask you to complete additional steps. For example, you may need to file Form I-864 Affidavit of Support to demonstrate your financial means to sponsor your family. For more information on the immigrant visa program, see the USCIS’ Petition for Alien Relative and Department of State’s Family Immigration websites. Departure assistance for your family members: The U.S. Government may be able to offer departure assistance for your spouse, your unmarried children under the age of 21, and your parents. The Department of State will contact your family members with departure options after the NVC has notified your family members that their immigrant visa applications are ready for an interview. If the U.S. Government can help your family members depart Afghanistan, they will travel to a country where they can complete the immigrant visa process. Your family members will require a passport. U.S. government assistance to depart Afghanistan is not a guarantee of visa issuance. Additionally, the decision to issue or refuse a visa must be made by a consular officer during the visa interview. You should NOT travel to Afghanistan to accompany your family members. You are not required to be in Afghanistan for the U.S. Government to help your family members depart Afghanistan. The U.S. Government will not help your family members depart more quickly if you are in Afghanistan. Complete Form I-130 Find information for U.S. Citizens Collapse Additional Content If You Are a Lawful Permanent Resident: If you are a lawful permanent resident, your spouse and your unmarried children under the age of 21, and unmarried adult sons and daughters may be eligible to immigrate to the United States. The immigration process for your family members: NOTE: If you became a lawful permanent resident through the Afghan Special Immigrant Visa program, your family members may have additional immigration options. See the next section, “If you are a lawful permanent resident through the Afghan SIV program.” You begin the immigrant visa application process for your family members by filing a petition, the Form I-130 Petition for Alien Relative, with U.S. Citizenship and Immigration Services (USCIS). USCIS will review petitions as quickly as possible. If USCIS approves the petition, the National Visa Center (NVC) will contact your family members to apply for their immigrant visas. How fast they can be interviewed will depend on their visa category. The NVC may ask you to complete additional steps. For example, you may need to file Form I-864 Affidavit of Support to demonstrate your financial means to sponsor your family. For more information on the immigrant visa program, see the USCIS’ Petition for Alien Relative and Department of State’s Family Immigration websites. Departure assistance for your family members: The U.S. Government may be able to offer departure assistance for your spouse and your unmarried children under the age of 21. The Department of State will contact your family members with departure options after the NVC has notified your family members that their immigrant visa applications are ready for an interview. If the U.S. Government can help your family members depart Afghanistan, they will travel to a country where they can complete the immigrant visa process. Your family members will require a valid passport. U.S. government assistance to depart Afghanistan is not a guarantee of visa issuance. Additionally, the decision to issue or refuse a visa must be made by a consular officer during the visa interview. You should NOT travel to Afghanistan to accompany your family members. You are not required to be in Afghanistan for the U.S. Government to help your family members depart Afghanistan. The U.S. Government will not help your family members depart more quickly if you are in Afghanistan. Complete Form I-130 Find information for Lawful Permanent Residents Collapse Additional Content If You Obtained Lawful Permanent Residency through the Afghan SIV Program: If you are a lawful permanent resident through an Afghan Special Immigrant Visa (SIV), your spouse and unmarried children under the age of 21 (“derivative family members”) may be eligible to immigrate to the United States through an Afghan SIV. The immigration process for your family members: If you submitted a DS-260 immigrant visa application for your derivative family members after receiving Chief of Mission approval and they are still abroad (including a child who was not on the DS-260 because they were born after you entered the United States but is of the same marriage that existed prior to your entry), your spouse and/or children may be processed as SIV “follow-to-join” family members. Follow-to-Join Eligibility: If you are a lawful permanent resident on the basis of having obtained Special Immigrant Visa status, i.e., your “green card” lists your lawful permanent residence category as SQ1 or SQ6, and you have not yet naturalized as a U.S. citizen, your derivative family members still abroad may be eligible for follow-to-join Special Immigrant visas. If you remain married to the spouse to whom you were married prior to your admission to the United States, your spouse may be eligible to “follow-to-join”. Any children born prior to your admission to the United States or born of the same marriage that existed prior to your admission, who are still under 21 and unmarried, may also be eligible to “follow-to-join”. Follow-to-join eligibility eliminates the need to file an I-130 petition for alien relative to obtain a visa for your family members still abroad. Note: Final determination of “follow-to-join” status can only be made by a consular officer. Family Composition: If you believe your derivative family members still abroad are eligible for “follow-to-join” status, and you have already submitted DS-260 visa applications for all family members, and your family composition has not changed since you entered the United States, CARE will contact you to arrange the relocation of your family members from Afghanistan when a flight or relocation opportunity becomes available However, if your family composition has changed since you entered the United States (for example, you have had a child) or if it has not changed but you did not submit a DS-260 immigrant visa application for your spouse and each child, what you need to do depends on what kind of “green card” you now hold: SQ1 or SQ6. Please refer to the following guidance: If you hold a “green card” listing your lawful permanent residence category as SQ1: It means you entered the United States with a Special Immigrant Visa foil in your passport. If you have derivative family members in Afghanistan, and your family composition has changed since you were admitted to the United States, please reach out to CareTravelData@state.gov for guidance. If you hold a “green card” listing your lawful permanent residence category as SQ6: It means you entered the United States other than as an SIV holder (such as humanitarian parole), and you later obtained Chief of Mission (COM) approval for Special Immigrant status, and your I-485 adjustment of status application to register permanent residence was approved. You will need to file the Form I-824 Application for Action on an Approved Application or Petition with U.S. Citizenship and Immigration Services (USCIS) to obtain “follow-to-join” visas for your derivative family members still abroad. The I-824 form, if approved, directs the Department of State’s National Visa Center to open a new visa case for your follow-to-join family members. After USCIS approves the I-824 form, the NVC will contact you and ask you to begin the visa application process for your follow-to-join family members. Each follow-to-join family member will need to complete the DS-260 form and submit the required civil documents to the NVC. After such a case gets to the “Interview Ready” stage, CARE will contact the principal applicant once a U.S.-sponsored relocation flight opportunity becomes available. Note that if your spouse and/or children are in Afghanistan, on the I-824 form, “Kabul” is the post that should be notified and that you should write in Question 1.C. Departure assistance for your family members: The U.S. Government may be able to offer departure assistance for your spouse and your unmarried children under the age of 21 (derivative family members). The Department of State Office of the Coordinator for Afghan Relocation Efforts (CARE) will contact your derivative family members with departure options after the NVC has notified your derivative family members that their SIV applications are ready for an interview. If the U.S. Government can help your derivative family members depart Afghanistan, they will travel to a country where they can complete the SIV process. Your derivative family members will require a valid passport. U.S. government assistance to depart Afghanistan is not a guarantee of visa issuance. Additionally, the decision to issue or refuse a visa must be made by a consular officer during the visa interview. You should NOT travel to Afghanistan to accompany your derivative family members. You are not required to be in Afghanistan for the U.S. Government to help your derivative family members depart Afghanistan. The U.S. Government will not help your derivative family members depart more quickly if you are in Afghanistan. Find information for Lawful Permanent Residents through the Afghan SIV Program Collapse Additional Content If You Are a Refugee or Asylee: If you hold refugee status or asylee status, your spouse and your unmarried children under the age of 21 may be eligible to immigrate to the United States. The immigration process for your family members: You begin the immigration application process for your family members by filing a “follow-to-join” petition, the Form I-730 Refugee/Asylee Relative Petition, with U.S. Citizenship and Immigration Services (USCIS). USCIS will review petitions as quickly as possible. If you were admitted to the United States as a refugee more than two years ago or were granted asylum more than two years ago, you will need to request a waiver of the two-year filing deadline in Part 3 of Form I-730 and explain why you could not file before the two years. If USCIS approves the petition, the Department of State or USCIS will contact your family members to continue their application for their “follow-to-join” refugee or asylee status. Departure assistance for your family members: The U.S. Government may be able to offer departure assistance for your spouse and your unmarried children under the age of 21. The Department of State will contact your family members with departure options after your I-730 has been approved and your family members are ready for an interview. If the U.S. Government can help your family members depart Afghanistan, they will travel to a country where they can complete the “follow-to-join” process. Your family members will require a valid passport. If the U.S. Government has helped/helps your family members depart Afghanistan, they will only be able to enter the United States after approval by U.S. immigration officials. You should NOT travel to Afghanistan to accompany your family members. You are not required to be in Afghanistan for the U.S. Government to help your family members depart Afghanistan. The U.S. Government will not help your family members depart more quickly if you are in Afghanistan. Complete Form I-730 Find in'''
