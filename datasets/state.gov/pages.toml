title = "African Growth and Opportunity Act (AGOA) - United States Department of State"
description = "The United States and Togo co-hosted the African Growth and Opportunity Act (AGOA) Forum in Lomé, Togo August 8-10. The Forum brought together senior government officials from the United States and 38 Sub-Saharan African AGOA-eligible countries to discuss ways to boost economic cooperation and trade between the United States and Africa. The African Union and regional […]"
full_description = '''Menu Bureau Home About Us Leadership Key Topics Remarks and Releases Bilateral Relations Fact Sheets HomeKey Topics – Bureau of African Affairs ...African Growth and Opportunity Act (AGOA) hide document.addEventListener("DOMContentLoaded", function(event) { if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } }); African Growth and Opportunity Act (AGOA) Bureau of African Affairs document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addClass( 'alignright' ); } if ( jQuery(this).hasClass('size-medium') ) { jQuery(this).parent().addClass( 'has-size-medium' ); } if ( jQuery(this).hasClass('aligncenter') ) { jQuery(this).parent().addClass( 'aligncenter' ); jQuery(this).parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); The United States and Togo co-hosted the African Growth and Opportunity Act (AGOA) Forum in Lomé, Togo August 8-10. The Forum brought together senior government officials from the United States and 38 Sub-Saharan African AGOA-eligible countries to discuss ways to boost economic cooperation and trade between the United States and Africa. The African Union and regional economic communities will also participate. Enacted in May 2000, the African Growth and Opportunity Act (AGOA) is the cornerstone of U.S. economic engagement with the countries of sub-Saharan Africa. AGOA is a long-term commitment with broad bipartisan support in the United States. On June 25, 2015, the U.S. Congress overwhelmingly approved legislation to re-authorize AGOA for an additional ten years. This is a strong signal that investors can and should invest with confidence in Africa. Total African exports under AGOA more than quadrupled since the program’s inception. As of June 2015, AGOA eligible countries have exported nearly $480 billion worth of goods to the United States under AGOA and the U.S. Generalized System of Preferences. By providing duty-free access to the U.S. market, AGOA has succeeded in helping eligible nations grow, diversify their exports to the United States, and create employment and inclusive economic growth. Under AGOA, eligible countries can export products, including value-added manufactured items such as textiles, to the United States duty-free. AGOA and Professional Exchange AGOA Since 2000, the United States has promoted economic growth and development in Africa through the African Growth and Opportunity Act (AGOA), a preferential trade agreement with eligible sub-Saharan African countries. AGOA legislation provides member countries with the most liberal access to U.S. markets apart from countries or regions with which the U.S. has a Free Trade Agreement. The U.S. commitment to deepen economic relations with sub-Saharan Africa has facilitated investment, created business linkages, and unlocked opportunities for entrepreneurship in the region. Opportunities for AWEP through AGOA AWEP women are accomplished entrepreneurs and the owners and leaders of small- and medium-sized businesses in Africa. Through AGOA, AWEP entrepreneurs can better access U.S. markets to expand their businesses and increase trade capacity both regionally and internationally. Many of their companies engage in exporting under the terms of AGOA, while others are working to increase their export capacity and establish business relationships with U.S. partners. All are leaders in their communities and many are members or leaders of women’s business organizations in their countries. Annual AGOA Forum Every year, the United States and AGOA member countries come together to discuss issues of economics, trade, and investment at an annual AGOA Forum. During the Forum, AWEP entrepreneurs can participate in meetings and networking opportunities with U.S. policy makers, companies and industry associations, U.S. and African civil society, nonprofit organizations advocating for women’s economic opportunities, multilateral development organizations, and business alliances. The women will also have the opportunity to interact with African ministers of trade, finance, and agriculture during the AGOA Forum. Additionally, alumnae of the program host a side event during the Forum that showcases the women’s expanding businesses, entrepreneurial abilities, and capacities for trade and investment. The AWEP event enhances the program’s visibility among investors, members of civil society, U.S. policymakers, and African ministers. AWEP Professional Exchange The State Department’s International Visitor Leadership Program (IVLP) professional exchange is AWEP’s primary program tailored to introduce AWEP participants to U.S. business leaders, policymakers, industry associations, nonprofit organizations, and multilateral development organizations. These annual three-week exchanges coincide with the AGOA Forum when hosted in Washington, DC; and are designed to help the participants build business alliances, develop advocacy and communication skills, identify resources to advance women’s entrepreneurship, and take advantage of opportunities for U.S. partnerships through AGOA.'''
