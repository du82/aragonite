}); }); Our Mission Office of the Special Presidential Envoy for Climate (SPEC): The Special Presidential Envoy for Climate is charged with leading U.S. diplomacy to address the climate crisis. Integrated closely with the State Department’s existing expert staff and personnel, the Special Presidential Envoy’s team works to ensure that the United States actively engages on climate, including exercising strong U.S. leadership to increase global climate ambition. Key workstreams and focus areas for the Special Presidential Envoy’s team include: constructive engagement in the Paris Agreement and related agreements and processes; driving global greenhouse gas emission reductions so as to keep a 1.5 degree Celsius limit on temperature rise within reach; enhancing adaptation and resilience to climate impacts; climate-aligning financial flows; driving overseas clean energy innovation and competitiveness; and better integrating climate and other areas, including the ocean, biodiversity, the Arctic, and international shipping and aviation activities. For more information, please visit the Department’s climate and environment webpage. Follow Us: Twitter For media inquiries, please contact climatecomms@state.gov.'''
