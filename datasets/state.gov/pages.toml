ate several other types of offices, most of which are located throughout the United States, including passport agencies, foreign press centers, logistic support offices, security offices, and financial service centers. Bureaus and offices cover “regional” or “functional” topics. Most report to one of six Under Secretaries, but some report directly to the Secretary of State, the Deputy Secretary of State, or the Deputy Secretary of State for Management and Resources. The Under Secretaries of State serve as advisors to the Secretary and lead the Department’s efforts in their respective subject matters. As their work is often related, bureaus and offices that report to the same Under Secretary are said to belong to the same “family,” and are usually identified with a single letter representing each Under Secretary. Secretary of State Deputy Secretary Deputy Secretary for Management and Resources Arms Control and International Security Civilian Security, Democracy, and Human Rights Economic Growth, Energy, and Environment Management Political Affairs Public Diplomacy Strategic Resources Joint Strategic Plan More Resources Agency Financial Reports International Affairs Budgets Telephone Directory Find more reports and publications Secretary of State (S) Subscribe to Secretary Releases View Secretary Trips The Secretary of State, appointed by the President with the advice and consent of the Senate, is the President’s chief foreign affairs adviser. The Secretary carries out the President’s foreign policies through the State Department, which includes the Foreign Service, Civil Service, and U.S. Agency for International Development. Deputy Secretary of State (D) View D Remarks Follow D on Twitter Bureaus & Offices Reporting to D Bureau of Cyberspace and Digital Policy Office of the U.S. Coordinator for the Arctic Region Deputy Secretary of State for Management and Resources (D-MR) View D-MR Remarks Follow D-MR on Twitter Bureaus & Offices Reporting to D-MR Office of Foreign Assistance Office of Small and Disadvantaged Business Utilization Bureaus & Offices Reporting Directly to the Secretary Bureau of Global Health Security and Diplomacy Bureau of Intelligence and Research Bureau of Legislative Affairs Counselor of the Department Executive Secretariat Office of Civil Rights Office of Global Women’s Issues Office of the Chief of Protocol Office of the AUKUS Senior Advisor Office of the Legal Adviser Office of the Ombuds Office of the Security Coordinator Policy Planning Staff Office of the Secretary’s Special Representative for Syria Engagement Office of the Special Envoy for Critical and Emerging Technology Office of the Special Presidential Envoy for Hostage Affairs Office of the U.S. Special Coordinator for the Partnership for Global Infrastructure and Investment Office of the U.S. Special Presidential Envoy for Climate Special envoy for afghan women, girls, and human rights Special Envoy for Iran Special Representative for Venezuela Under Secretary for Arms Control and International Security (T) View T Releases Follow T on Twitter The Under Secretary for Arms Control and International Security serves as a Senior Adviser to the President and the Secretary of State, leads the interagency policy process on nonproliferation, and manages global U.S. security policy, including: nonproliferation, arms control, regional security, defense relations, arms transfers, security assistance. Bureaus & Offices Reporting to T Bureau of Arms Control, Deterrence, and Stability Bureau of International Security and Nonproliferation Bureau of Political-Military Affairs Under Secretary for Civilian Security, Democracy, and Human Rights (J) View J Releases Follow J on Twitter The Under Secretary for Civilian Security, Democracy, and Human Rights leads Department efforts to prevent and counter threats to civilian security. The bureaus and offices reporting to the Under Secretary advance the security of the American people by assisting countries around the world to build more democratic, secure, stable, and just societies. Bureaus & Offices Reporting to J Bureau of Conflict and Stabilization Operations Bureau of Democracy, Human Rights, and Labor Bureau of International Narcotics and Law Enforcement Affairs Bureau of Population, Refugees, and Migration Office of Global Criminal Justice Office of International Religious Freedom Office of the Special Envoy To Monitor and Combat Antisemitism Office of the U.S. Special Coordinator for Tibetan Issues Office to Monitor and Combat Trafficking in Persons Under Secretary for Economic Growth, Energy, and Environment (E) View E Releases Follow E on Twitter Follow E on Facebook Follow E on Linked In The Under Secretary of State for Economic Growth, Energy, and the Environment (E) leads the State Department’s efforts to develop and implement international policies related to economic growth, energy, agriculture, the ocean, the environment, and science and technology. Bureaus & Offices Reporting to E Bureau of Economic and Business Affairs Bureau of Energy Resources Bureau of Oceans and International Environmental and Scientific Affairs Office of Global Food Security Office of Global Partnerships Office of the Chief Economist Office of the Science and Technology Adviser The Special Representative for City and State Diplomacy Under Secretary for Management (M) View M Releases The Under Secretary for Management is the State Department’s representative on the President’s Management Council, and is the Department official responsible for implementing the President’s Management Agenda (PMA). The PMA is a set of management initiatives designed to make government more citizen-centered, effective, and efficient. Bureaus & Offices Reporting to M Bureau of Administration Bureau of Budget and Planning Bureau of Consular Affairs Bureau of Diplomatic Security Bureau of Diplomatic Technology Bureau of GLobal Talent Management Bureau of Medical Services Bureau of Overseas Buildings Operations Bureau of the Comptroller and Global Financial Services Director of Diplomatic Reception Rooms Foreign Service Institute Office of Foreign Missions Office of Management Strategy and Solutions Under Secretary for Political Affairs (P) View P Releases The Under Secretary for Political Affairs serves as the day-to-day manager of overall regional and bilateral policy issues. The geographic bureaus and offices advise the Under Secretary and guide the operation of the U.S. diplomatic missions within their regional jurisdiction. International Organization Affairs develops and implements the policies of the U.S. Government within the United Nations and its affiliated agencies, as well as within certain other international organizations. Bureaus & Offices Reporting to P Bureau of African Affairs Bureau of Counterterrorism Bureau of East Asian and Pacific Affairs Bureau of European and Eurasian Affairs Bureau of International Organization Affairs Bureau of Near Eastern Affairs Bureau of South and Central Asian Affairs Bureau of Western Hemisphere Affairs Under Secretary for Public Diplomacy (R) View R Releases The Under Secretary for Public Diplomacy serves as the lead policy maker for the Department’s overall public outreach and press strategies. The team coordinates closely with bureaus, the interagency, the private sector, and international partners to ensure the Department’s public diplomacy and public affairs activities are consistent, forward looking, supportive of U.S. foreign policy, and grounded in research. Bureaus & Offices Reporting to R Bureau of Educational and Cultural Affairs Bureau of Global Public Affairs OFfice of Global Youth Issues Office of Policy, Planning, and Resources'''
