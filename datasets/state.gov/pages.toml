full_description = 'Bureau Home Bureau Home About Us Leadership Key Topics Remarks and Releases Reports Contact Us HomeBureaus & Offices > Under Secretary for Arms Control and International Security ...Bureau of Arms Control, Deterrence, and Stability hide document.addEventListener("DOMContentLoaded", function(event) { if(window.jQuery) { jQuery( document ).ready(function() { if (jQuery(".bc_middle").hasClass("collapse")) { jQuery(".bc_ellipse").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); jQuery(".bc_hide").click(function(){ jQuery(".bc_hide").toggleClass("visible"); jQuery(".bc_middle").toggle(); jQuery(".bc_ellipse").toggle(); jQuery(".bc_content").toggleClass("noflex"); jQuery(".block_breadcrumbs_content").toggleClass("noflex"); }); } else { jQuery(".bc_ellipse").hide(); } }); } }); Bureau of Arms Control, Deterrence, and Stability Subscribe Our Mission The Bureau of Arms Control, Deterrence, and Stability (ADS) is responsible for diplomatic efforts to increase stability, reduce the risk of unintentional escalation, and prevent conflict. ADS leads negotiations on nuclear arms control and represents the United States in a range of multilateral fora addressing WMD challenges. We promote stability and responsible behavior in contested domains like outer space, underseas, and the Arctic and with respect to emerging military technologies, including AI and quantum computing. ADS develops and advances U.S. efforts to strengthen the ban on chemical and biological weapons. We work within existing structures like NATO and the OSCE, as well as with partners across the globe, to find practical solutions to address regional instability, promote responsible military behaviors, and reduce the risk of conflict. ADS leads diplomatic efforts in furtherance of integrated deterrence, reinforced by a pragmatic, stable, and transparent approach to arms control and disarmament. Finally, ADS operates the National and Nuclear Risk Reduction Center, the gold standard in international crisis communication with over 50 partner States around the world. Follow Us: Twitter Offices National and Nuclear Risk Reduction Center Office of Chemical and Biological Weapons Affairs Office of Emerging Security Challenges Office of Multilateral and Nuclear Affairs Office of Regional Security Cooperation Office of Strategic Stability and Deterrence Affairs Office of Verification, Planning, and Outreach'
