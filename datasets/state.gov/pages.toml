parent().children().wrapAll('<div class="wm_centered"></div>'); } }); } }); }); INR administers the Program for Research and Training on Eastern Europe and Eurasia (Independent States of the Former Soviet Union) known as “Title VIII.” This Program provides funding for graduate-level research and foreign language training to U.S. scholars and students for the study of Eastern Europe and Eurasia (Independent States of the Former Soviet Union). Title VIII maintains U.S. expertise in these regions and brings open source, policy-relevant research to the service of the U.S. government. Title VIII grants are awarded through an open, national competition among eligible applicant organizations. Authority for this Program is contained in the Soviet-Eastern European Research and Training Act of 1983 (22 U.S.C. 4501-4508, as amended). Grants.gov is a central storehouse for information on federal government grant programs. For information on Title VIII research and language study opportunities please email: TitleVIII@state.gov. For information on other Department of State funded language study programs go to: https://studyabroad.state.gov/languages Learn More About Title VIII Grant Program Title VIII Grant Program Independent States and Dependencies document.addEventListener("DOMContentLoaded", function(event) { jQuery(document).ready(function(){ if (jQuery('p .watermark').length > 0 ) { jQuery('p .watermark').parent().addClass('watermarked'); jQuery('p .watermark').parent().each( function() { //jQuery(this).children('img').attr('style', 'margin: 0 !important'); jQuery(this).children().wrapAll('<div class="watermarked_image"></div>'); }); jQuery('.entry-content p.watermarked > div.watermarked_image > img').each( function() { if ( jQuery(this).hasClass('alignnone') ) { jQuery(this).parent().addClass( 'alignnone' ); } if ( jQuery(this).hasClass('alignleft') ) { jQuery(this).parent().addClass( 'alignleft' ); } if ( jQuery(this).hasClass('alignright') ) { jQuery(this).parent().addCl