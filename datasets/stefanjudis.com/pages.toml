full_description = '''macOS offers a tool to remove backgrounds from imagesWritten by Stefan JudisPublished atFeb 05 2023Updated atFeb 08 2023Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.The following discovery passed my social feed, and I'm still super excited about this hidden macOS gem.I do a lot of YT thumbnails these days and usually use remove.bg to remove backgrounds from pictures. But this feature is natively included in macOS these days! 😲macOS background removal via Quick ActionsI don't follow all the new OS features because I'm not entirely bought into the Apple universe and am very happy with all my workflows.But removing backgrounds is a super handy feature! It's a little odd to have this functionality on an operating system level, though. What will be next? Removing background noise from audio files? Cut prepare images for social sharing? I have no clue, but I'd be game for all of these. ;)I didn't check when this feature was added to macOS, but the video shows Ventura 13.1.Edit: It turns out the background removal feature is also available in the Mac Preview app! 👏If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics macOSRelated ArticlesDefault Apps 2024How to open a local file from the URL bar in VS CodeAn app to open your current finder directory in VS CodeHow to measure network quality (download/upload) on macOSrcmd – an alternative to "active app tabbing"'''
