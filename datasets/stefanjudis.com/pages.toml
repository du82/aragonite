["https://stefanjudis.com/today-i-learned/force-pushing-git-branches-with-a-safety-net"]
title = "Force pushing git branches with a safety net | Stefan Judis Web Development"
description = "You can do a safer force push with the --force-with-lease argument on the git push command"
full_description = '''Force pushing git branches with a safety netWritten by Stefan JudisPublished atDec 30 2017Updated atAug 14 2022Reading time2minThis post is part of my Today I learned series in which I share all my web development learnings.I learned about a new git push command line flag – --force-with-lease. 😲 Learn what it's about!After working with git for years, I feel comfortable with using it. I manage to squash commits, change the last commit or rebase things on the command line without getting too nervous.When you apply a lot of git magic rewriting a repo's git history, you might approach the point where you have to force push to a remote branch because it refuses to accept your git foo.# lots of git magic followed by: $ git push origin foo --force # ☝️ will update the remote no matter what But performing git push with the --force flag can be brutal. It overwrites the remote branch with your local version without any additional checks or asking for permission. When you're working with other people on the same branch, it can quickly happen that you overwrite commits done by your team members.Think of the following example:you do a git pull to get the latest changesyou do some git magic, but it takes a whileyou force push your changesSuppose, another coworker pushes new changes to the remote in the meantime.Now, you'll overwrite these with your force push without knowing.The --force-with-lease can help to avoid this desaster because it won't update the remote branch when it isn't in a known state.# lots of git magic followed by: $ git push origin foo --force-with-lease # ☝️ can still be rejected when # someone updated the branch upstream There a few more minor things to know about --force-with-lease and Steve Smith wrote an excellent article on the whole topic. I recommend to check that one out. ;)If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics gitRelated ArticlesHow to apply a global Git commit templateHow to search for strings in Git commit additions or deletionsTimestamped Git yolo commitsHow to safely remove untracked files from Git reposGit-based dotfile management without symlinks'''
