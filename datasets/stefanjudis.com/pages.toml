full_description = '''htmz — a 176 bytes htmx alternativeWritten by Stefan JudisPublished atFeb 21 2024Updated atFeb 21 2024Reading time1minhtmx has been pretty loud lately because it moves functionality, like swapping out DOM elements into declarative HTML. Love it or hate it, I think it's a "fresh" approach to the overcomplicated world of JS frameworks.<script src="https://unpkg.com/htmx.org@1.9.10"></script> <!-- have a button POST a click via AJAX --> <button hx-post="/clicked" hx-swap="outerHTML"> Click Me </button> Add the 14kb compressed file to your sites and create dynamic interactions. Everything's just a hx-whatever attribute away. Sweet!Could you do similar things with less JavaScript? And while I wouldn't recommend using htmz in production, it does some HTML-swapping magic with 176 JS bytes. How? With very creative iframe usage.<iframe hidden name=htmz onload="setTimeout(()=>document.querySelector(this.contentWindow.location.hash||null)?.replaceWith(...this.contentDocument.body.childNodes))"></iframe> <!-- Loads /flower.html onto #my-element --> <a href="/flower.html#my-element" target=htmz>Flower</a> Is the project a joke? Sorta — maybe not. But whether we talk about htmx or htmz or whatever comes next, it becomes clear that we're lacking some HTML primitives. But maybe frames were already good enough? #oldIsNew 😅If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics Web Tools HTMLRelated ArticlesA well-known avatar URL would be dang cool.How to load images in a spreadsheetA "section" without an accessible name is nothing but a "div"Use "translate" to turn off element translationsDefault Apps 2024'''
