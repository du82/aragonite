full_description = '''Commands in the Node.js REPLWritten by Stefan JudisPublished atJun 26 2017Updated atJul 25 2022Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Today my friend Dominik shared that there are special commands available in the Node.js REPL.There are seven Node.js REPL commands:.break.clear.exit.help.save.load.editorMy favorite is the .editor command which you can use to write JavaScript going beyond one line right in the REPL.And then there's also .load and .save to store and restore REPL sessions. These commands come in handy when moving out of the REPL again to export the executed code or start a REPL session quickly with a given state.Commands in the Node.js REPLLearn more about these in the Node.js docs.If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics NodeJSRelated ArticlesSet the default time zone in Node.jsBun's trusted dependenciesHow to use headless Chrome in serverless functions with a 50MB limitThe problem of breaking changes and version numbersTop-level promise handling in Node.js ES modules'''
