title = "How to match HTML elements with an indeterminate state | Stefan Judis Web Development"
description = "Use the :indeterminate CSS pseudo-class to match different elements with an indeterminate state."
full_description = '''How to match HTML elements with an indeterminate stateWritten by Stefan JudisPublished atMar 31 2022Updated atOct 24 2023Reading time2minThis post is part of my Today I learned series in which I share all my web development learnings.Adam's excellent guide "Building a loading bar component" covers all things about the progress element. It's a good read because covering HTML, CSS and JavaScript, and taught me something new!I learned that progress HTML elements are considered to be in an indeterminate state if you don't define a element value.But it's not only the progress element that can have this state. It's:radio buttons in a group when no radio is selectedcheckboxes with an indeterminate JavaScript property set trueand the mentioned progress elements without a defined valueWhy's that interesting? Indeterminate elements can be selected with the :indeterminate pseudo-class. 😲 (yeah, I haven't seen that one before either).See below that :indeterminate matches all radio elements in a group if there's none preselected. Thus, the group has an indeterminate state.If you select one radio, the group loses the indeterminate state, and the purple styling disappears.HTML<input id="1" type="radio" name="something" value="1"> <label for="1">One</label> <input id="2" type="radio" name="something" value="2"> <label for="2">Two</label> <input id="1" type="radio" name="something" value="1"> <label for="1">One</label> <input id="2" type="radio" name="something" value="2"> <label for="2">Two</label> /** * Reset the text fill color so that placeholder is visible */ .npm__react-simple-code-editor__textarea:empty { -webkit-text-fill-color: inherit !important; } /** * Hack to apply on some CSS on IE10 and IE11 */ @media all and (-ms-high-contrast: none), (-ms-high-contrast: active) { /** * IE doesn't support '-webkit-text-fill-color' * So we use 'color: transparent' to make the text transparent on IE * Unlike other browsers, it doesn't affect caret color in IE */ .npm__react-simple-code-editor__textarea { color: transparent !important; } .npm__react-simple-code-editor__textarea::selection { background-color: #accef7 !important; color: transparent !important; } } CSSinput:indeterminate + label { background: purple; } body { color: white; }input:indeterminate + label { background: purple; } body { color: white; } /** * Reset the text fill color so that placeholder is visible */ .npm__react-simple-code-editor__textarea:empty { -webkit-text-fill-color: inherit !important; } /** * Hack to apply on some CSS on IE10 and IE11 */ @media all and (-ms-high-contrast: none), (-ms-high-contrast: active) { /** * IE doesn't support '-webkit-text-fill-color' * So we use 'color: transparent' to make the text transparent on IE * Unlike other browsers, it doesn't affect caret color in IE */ .npm__react-simple-code-editor__textarea { color: transparent !important; } .npm__react-simple-code-editor__textarea::selection { background-color: #accef7 !important; color: transparent !important; } } Preview.__playground { --grid-outer-padding: 1em; position: relative; border-radius: 0.375em; } .__playground_btn { /* matching --blue-dark */ background: hsl(206deg 65% 32%); font-size: inherit; color: white; border: none; padding: .25em .75em; border-radius: .25em; position: absolute; bottom: 1em; right: 1em; z-index: 1; } .__playground_btn:hover { background: hsl(206deg 65% 40%); } .__playground_btn:active { background: hsl(206deg 65% 25%); } .__playground_grid { display: grid; grid-gap: 1em; } .__playground_notSupported { border: 2px solid var(--red-dark); border-radius: 0.25rem; padding: 0.5em; } @media (min-width: 50em) { .__playground_grid { grid-template-columns: 3fr 2fr; } .__playground_grid.stacked { grid-template-columns: 1fr; } } .__playground textarea { outline: none; } .__playground_editor { margin: 0; border-radius: 0.25em; box-shadow: var(--soft-shadow-dark); background: var(--blue-darker); } .__playground_editor summary { padding: 0.5rem; color: var(--blue-bright); font-family: system-ui, sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; } .__playground_editor:only-child { height: 100%; } .__playground_editor pre, .__playground_editor textarea { /* ugly fix for code golf spaceless code at /notes/code-golfing-at-its-best/ */ margin: 0; word-break: break-all !important; } .__playground_editor:focus-within { outline: 2px solid var(--blue-bright); } .__playground_editor + .__playground_editor { margin-top: 1rem; } .__playground iframe { height: 100%; color-scheme: normal; } .__playground .preview { position: relative; text-align: right; font-size: .75em; letter-spacing: 1px; font-weight: 700; font-family: system-ui, sans-serif; color: var(--blue-bright); text-transform: uppercase; padding: 4em 1em 1em; background: #1a2932; box-shadow: var(--soft-shadow-dark); border-radius: .25em; } .__playground .prewiew__label { position: absolute; top: 1em; right: var(--grid-outer-padding); }import { renderComponent } from '/esbuild/playground-5IJVGIVL.js'; renderComponent({"html":"<input id=\"1\" type=\"radio\" \n name=\"something\" value=\"1\">\n<label for=\"1\">One</label>\n\n<input id=\"2\" type=\"radio\"\n name=\"something\" value=\"2\">\n<label for=\"2\">Two</label>\n","css":"input:indeterminate + label {\n background: purple;\n}\n\nbody {\n color: white;\n}"}, document.getElementById("playground-c768ad"));:indeterminate is also cross-browser supported. 🎉MDN Compat Data (source)Browser support info for `:indeterminate`111222311.5≤37If you're looking at the compatibility table on MDN, it links to a very old Safari bug ticket. I tested the above demo and it worked fine.If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.