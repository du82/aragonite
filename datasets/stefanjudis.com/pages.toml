full_description = '''About StefanI share little-known web development tips and tricksI fell in love with Frontend development ten years ago, and since the beginning, I learn in public. Sharing my everyday web development discoveries while drinking coffee in bed is my favorite Sunday morning activity.Whenever I read something and think "Huh! I didn't know that!", I write it down. This approach has led to 658 articles on this blog so far.Posts written per year2 articles written in 20141 articles written in 20152 articles written in 201649 articles written in 201730 articles written in 201853 articles written in 201986 articles written in 2020160 articles written in 2021109 articles written in 202271 articles written in 202373 articles written in 202422 articles written in 2025If you're curious, check more stats.My private learning logAnd here are some of my recent learnings:TypeScript "strictFunctionTypes" is ignored for method syntax Mar 01 2025Rerun commands with the built-in "r" command Feb 21 2025How to iterate over TypeScript union types Feb 17 2025How to apply a global Git commit template Feb 08 2025The difference between @ts-ignore and @ts-expect-error Feb 06 2025But there's more... 🙈Web WeeklyIf I don't make it to write down a discovery, I include it in my weekly newsletter. Web Weekly is a mixed bag of tips, new browser APIs, GitHub projects, music and everything I considered fun this week.5676 readers received the last issue 14 days ago. Your email (required) SubscribeA huge thanks goes to Paul Kinlan and Pawel Grzybek for supporting my newsletter on a generous Patreon tier.Side projectsOccasionally, I build things on GitHub.If you were ever looking for a particular web development tool you've seen online but can't find it anymore, make sure to check out Tiny Helpers. The resource collection includes over 500 free-to-use online tools for web developers.Oh, and I'm also a Google Developer Expert, Microsoft MVP and Playwright Ambassador. Find me onlineI hang out online a lot. Make sure to say hi! 👋 Twitter Mastodon GitHub DEV YouTube TwitchSpeaking at eventsI've spoken at over 50 conferences, including GOTO, JSConf.eu and CodeMotion. If you want to invite me to speak at your event, find all my talks online, and please reach out!Speaker bioStefan works in Checkly's Developer Relations and quickly fell in love with web performance, new technologies, and accessibility. He is also a curator of the online resource Tiny Helpers, Tiny Teachers, contributes to a variety of open source projects, and enjoys sharing nerdy discoveries.'''
