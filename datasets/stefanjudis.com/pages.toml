full_description = '''Inputs of type date support min, max and step attributesWritten by Stefan JudisPublished atNov 15 2020Updated atNov 15 2020Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Today I learned that input elements of type="date" support the min, max and step attributes. These attributes allow developers to define what dates are valid in the presented system date picker.And while these attributes are great (especially with Safari finally starting to support date inputs), I don't think that the <input type="date"> element is powerful enough (yet).Let's think of airline sites; the date pickers we use to book our vacations are enormous and highly customized. Is the word "mega date picker" an industry term yet? If not, it should be!Some websites are pushing the boundaries of date input functionality and there might be several reasons for these implementations. But I think that the lack of native features to handle complex date requirements plays a role in that, too.We have to see it positive, though; I'm happy that the date pickers we use for user registration forms and birthday fields are getting better and better!If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics HTMLRelated ArticlesA "section" without an accessible name is nothing but a "div"Use "translate" to turn off element translationsA web component to show browser support and baseline statusForms without an accessible name are not exposed as ARIA landmarksTarget=_blank implies rel=noopener'''
