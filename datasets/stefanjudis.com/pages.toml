title = "Equality of object property names depends on code units | Stefan Judis Web Development"
description = "I learned that not every property key that looks the same is the same."
full_description = '''Equality of object property names depends on code unitsWritten by Stefan JudisPublished atJul 16 2017Updated atApr 10 2022Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Today I was writing a quick blog post on hidden characters in object property names, and while writing it I came across today's learning.The ECMAScript spec describes equality for property names as follows:Two IdentifierName that are canonically equivalent according to the Unicode standard are not equal unless they are represented by the exact same sequence of code units.An object can have two properties that look the same but consist of different code units. Let's look at an example.const unicodeObject = { ü: 'foo', u\u0308: 'bar' } // evaluates to: // {ü: "foo", ü: "bar"} The properties look the same but are not because they consist of different code units. If you're interested in more details on property names, check out my blog post "Hidden messages in JavaScript property names", there is way more cool (and scary) stuff in it. ;)If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics JavaScript UnicodeRelated ArticlesStatic initialization blocks in JavaScript classesHide object properties with JavaScript symbolsEarlier function parameters are available to default parametersOn being a "JavaScript framework developer"...Safari 18 — what web features are usable across browsers?'''
