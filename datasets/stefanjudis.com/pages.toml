["https://stefanjudis.com/blog/web-weekly-151"]
title = "Web Weekly #151 | Stefan Judis Web Development"
description = "The European Accessibility Act, SPA & MPA view transitions and `popover` entering the baseline."
full_description = '''Web Weekly #151Written by Stefan JudisPublished atFeb 11 2025Updated atFeb 11 2025Reading time7minThe Web Weekly newsletter keeps you up to date, teaches you web development tricks and covers all things working in tech.Guten Tag! Guten Tag! 👋Do you know what the European Accessibility Act will mean to you? Are view transitions (SPA or MPA) ready for production yet? Have you heard that popover is now on the baseline?Turn on the Web Weekly tune and find all the answers below. Enjoy!Khaled listens to "Cinematic Orchestra feat. Patrick Watson - To Build A Home"I listen to this song every now and then for about 14 years now!Do you want to share your favorite song with the Web Weekly community? Hit reply; there are two more songs left in the queue.I'm a day late, so I'll keep this week's intro short, but I want to welcome all the new subscribers who joined last week! 👋It's great to see Web Weekly growing, and if you have any comments, questions, or want to send over "good web stuff"™, let me know!I'm all ears (eyes? 🤷) and enjoy every bit of webdev chatter in my inbox!With that — let's go!Something that made me smile this weekI'm unsure if getting scared is the right approach to breaking social media addiction, but if you try TabBoo let me know how it went.Break bad habitsNew on the blogHow to apply a global Git commit template.A well-known avatar URL would be dang cool.The difference between @ts-ignore and @ts-expect-error.The European Accessibility Act (EAA)The European Accessibility Act will go into effect on June 28, 2025, and Martijn shares what you need to know.Understand the EAAOn native CSS nestingAndy argues that browsers shouldn't have shipped native CSS nesting because it's a solely developer convenience feature that also comes with some footguns.I'm unsure if I agree with this statement, but the article includes wise words worth pinning on your monitor. When you write code, ask yourself:Could a junior developer understand this code?💯 Future me will smartass the heck out of this idea. Get ready!Understand nestingIt's about peopleThis page isn't new, but it's so valuable. The WEC Web Accessibility Initiative put together user stories about making digital products more accessible.Bookmark it for the next time when someone tells you that accessibility is "about X".Build for peopleHow to favicon in 2025It's the time of the year again when the wonderful Martians research how to load a favicon the best way. 👆 Do the necessary spring cleaning if your sites include more HTML than this to load a favicon.Clean up your faviconsYou're halfway through!Wowza! Would you enjoy getting Web Weekly straight to your inbox?Email SubscribeThe wonderful weird web – Stripe's Black Friday statsStripe must be doing very well when they have the time and money to build info pages like this one. 👆 Either way, it's fun to play with all the Black Friday stripe transaction data.Check the statsStripe also released this fabulous developer portal not too long ago.Replace your animation libs with startViewTransition()In my opinion, view transitions are the biggest update the web has seen in many years because we can build so many cool effects with so little effort now.I used startViewTransition() to rebuild a navigation component that relied on a heavy JS animation lib with ~50 lines of CSS.Read the post Watch the videoGet started with MPA view transitionsCross-document view transitions allow us to animate and transition elements across good old HTML navigations. The new @view-transition at-rule has been supported in Chromium for a while, and Safari started supporting it last December.If you want to spice up your static HTML sites, Kevin and Bramus live coding session will get you up to speed!Transition across pagesManaging focusOllie explains the differences between :focus and :focus-visible, and why the focus() DOM method needs an update.Focus!Some WebDev Trivia...I admit I've never thought about this and didn't know. But do you know?Travel in timeHow to start a blogUnsurprisingly, blogging had a huge impact on my career (heck, my life even?).Blogging helps me order my thoughts, learn new things, become a better writer, get invited to more job interviews, connect with people — the list goes on and on. I should probably blog about the benefits of blogging.If that sounds convincing and you wonder how to get started, here's some solid advice.And don't forget to send me your RSS feed if you kick things off and start a new blog.Random MDN – :user-valid / :user-invalidFrom the unlimited MDN knowledge archive...Do you know that there are CSS classes that match valid/invalid form elements only after the user interacts with them? Now you do!Validate at the right timeTIL recap – table captionBe honest. Do all your HTML tables include the required caption element?Give your tables a proper nameFind more short web development learnings in my "Today I learned" section.New on the baseline — popoverBig news: the popover API is now "newly available" on the baseline, and if you're now thinking, "Hold on! Wasn't it baseline ready last year already?", that's right.But webdev, spec work and browser implementations are hard. Rachel explained what happened and shared insights on how the baseline baseline evaluation works.Pop over!Classifieds & friendsIf you can't get enough of WebDev news, I can highly recommend Adam's WeeklyFoo newsletter. It pairs wonderfully with Web Weekly to catch all the relevant web dev news!Three valuable projects to have a look atsindresorhus/emittery – A simpl and modern async event emitter.localsend/localsend – An open-source cross-platform alternative to AirDrop.yamadashy/repomix – A tool to pack your entire repository into a single, AI-friendly file.A new Tiny HelperWhen I blogged about font-family: system-ui, a few people pointed me to Modern Font Stacks. What is it?Modern operating systems come with more installed fonts than Arial. Modern Font Stacks lets you play and test available fonts, so you don't have to deal with optimal font loading strategies.Use what's already thereFind more single-purpose online tools on tiny-helpers.dev.Thought of the weekAddy shared his thoughts on all this AI for coding madness happening right now, and his opinion might surprise you.AI tools help experienced developers more than beginners.Did you learn something from this issue?💙 If so, join 21 other Web Weekly readers and support this small indie newsletter with a small monthly donation on Patreon or GitHub Sponsors.This is all, friends!Loved this email? Hated this email? I want to hear about it!If you think something needs improvement or something sparked some joy, reply to this email because I want to know more!And with that, take care of yourself - mentally, physically, and emotionally.I'll see you next week! 👋If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics NewsletterRelated ArticlesWeb Weekly #152Web Weekly #150Web Weekly #149Web Weekly #148Web Weekly #147'''
