full_description = '''Writing good docs, blogs and technical articlesUpdated atApr 04 2024Reading time2minArticles"Grammar, mechanics, and usage" of web.dev"How to be a writer on a marketing team without sounding like a jerk""What I think about when I edit"Writing should be like music. 👇Apparently, there's the royal order of adjectives which defines when they must be divided by a comma. General rule: if the adjectives can be joined by "and" or the order can be changed and the sentence still makes sense, use a comma.The actress wore a [beaded], [feathered] costume.The actress wore an [antique red beaded], [feathered costume].'''
