["https://stefanjudis.com/today-i-learned/safe-unsafe-alignment-in-css-flexbox"]
title = "Safe/unsafe alignment in CSS flexbox | Stefan Judis Web Development"
description = "Safe alignment can prevent data loss in CSS flexbox layouts"
full_description = '''Safe/unsafe alignment in CSS flexboxWritten by Stefan JudisPublished atMay 18 2020Updated atMar 11 2024Reading time3minThis post is part of my Today I learned series in which I share all my web development learnings.I recently watched the talk "Making Things Better: Redefining the Technical Possibilities of CSS" by Rachel Andrews. The talk included one line of CSS that I haven't seen before..something { display: flex; // what's that?👇 😲 align-items: safe center; } The CSS goal of data loss preventionRachel explains that when the CSS specs are written, key priority is to prevent data loss. I haven't heard this phrase before.How often do we face data loss in CSS, and what is done to prevent it?The goal of CSS is to keep content and elements visible to the visitor. CSS does this by design. Containers expand automatically to the right or the bottom depending on their content. They become scrollable when contents are overflowing.Unless you break the CSS default behavior with things like overflow: hidden;, the user will be able to access the content.But when you use Flexbox, there are situations in which the prevention of data loss is not guaranteed.Data loss in the context of CSS FlexboxLet's say you have the following HTML:<div class="container"> <span>CSS</span> <span>is</span> <span>awesome!</span> </div> and use align-items to center them. What happens if the elements won't fit into the container?.container { display: flex; flex-direction: column; align-items: center; width: 50%; }CSSisawesome!!!Container widthDecrease the container width to force an overflow situation..__unsafeAlignment { container: alignmentContainer / inline-size; .__container { display: grid; grid-template-columns: 1fr; gap: 1rem; } @container alignmentContainer (width > 600px) { .__container { grid-template-columns: 1fr 1fr; } } .__controls label { display: block; } .__controls input { display: block; width: 100%; } &.__isSafe { .__preview { align-items: safe center; } } .__highlightBox { background: var(--blue-brighter); padding: 1rem; border-radius: 0.25rem; grid-column: 1 / -1; color: var(--blue-dark); } .__preview { display: flex; flex-direction: column; align-items: center; border-radius: 0.5rem; border: 2px dashed var(--blue); padding: 0.5rem; margin-inline: auto; width: var(--preview-width, 50%); overflow: scroll; &.__overflow { border-color: var(--red); background: var(--red-brighter); } } .__preview > span { border: 2px solid var(--grey); border-radius: 0.125rem; padding-inline: 0.25rem; margin-block: 0.125rem; background: white; } } .__infoBox { display: grid; grid-template-columns: 1.5rem 1fr; gap: 0.5rem; } .__infoBox .icon { fill: currentColor; height: 1.25rem; width: 1.25rem; padding: 0.25rem; border: 2px solid currentColor; border-radius: 50%; flex-shrink: 0; float: left; margin-top: 0.125rem; margin-left: 0.25rem; } .__infoBox code { display: inline-block; vertical-align: middle; background: var(--blue-brighter); color: var(--blue); font-size: 0.875em; padding: 0.125em 0.375em; border-radius: 0.25rem; }import { renderComponent } from '/esbuild/safe-alignment-5GOTUTRX.js'; renderComponent({}, document.getElementById("safe-alignment-323217"));The align-items property aligns child elements centered along the cross-axis. Great stuff — but in case of a small container/viewport size, we end up with data loss.Due to the flexbox alignment, the elements are centered no matter what. The child elements overflow on the right and(!) left side. And unfortunately, you can't scroll to the overflowing area on the left – say hello to data loss.This situation is when the safe keyword property helps. The CSS Box Alignment Module Level 3 (still in draft state) defines safe alignment as follows:"Safe" alignment changes the alignment mode in overflow situations in an attempt to avoid data loss.If you define safe alignment, the aligning elements will switch to start alignment in case of an overflowing situation..container { display: flex; flex-direction: column; align-items: safe center; width: 50%; }CSSisawesome!!!Container widthDecrease the container width to force an overflow situation..__unsafeAlignment { container: alignmentContainer / inline-size; .__container { display: grid; grid-template-columns: 1fr; gap: 1rem; } @container alignmentContainer (width > 600px) { .__container { grid-template-columns: 1fr 1fr; } } .__controls label { display: block; } .__controls input { display: block; width: 100%; } &.__isSafe { .__preview { align-items: safe center; } } .__highlightBox { background: var(--blue-brighter); padding: 1rem; border-radius: 0.25rem; grid-column: 1 / -1; color: var(--blue-dark); } .__preview { display: flex; flex-direction: column; align-items: center; border-radius: 0.5rem; border: 2px dashed var(--blue); padding: 0.5rem; margin-inline: auto; width: var(--preview-width, 50%); overflow: scroll; &.__overflow { border-color: var(--red); background: var(--red-brighter); } } .__preview > span { border: 2px solid var(--grey); border-radius: 0.125rem; padding-inline: 0.25rem; margin-block: 0.125rem; background: white; } } .__infoBox { display: grid; grid-template-columns: 1.5rem 1fr; gap: 0.5rem; } .__infoBox .icon { fill: currentColor; height: 1.25rem; width: 1.25rem; padding: 0.25rem; border: 2px solid currentColor; border-radius: 50%; flex-shrink: 0; float: left; margin-top: 0.125rem; margin-left: 0.25rem; } .__infoBox code { display: inline-block; vertical-align: middle; background: var(--blue-brighter); color: var(--blue); font-size: 0.875em; padding: 0.125em 0.375em; border-radius: 0.25rem; }import { renderComponent } from '/esbuild/safe-alignment-5GOTUTRX.js'; renderComponent({"isAlignedSafely":true}, document.getElementById("safe-alignment-07a7dd"));safe alignment leads the browser to always place elements accessible to the user. Win win!Browser support of safe alignmentAt the time of writing Chromium and Firefox support the safe keyword. Safari's recent Tech Preview includes it so that we can use safe across browsers soon.MDN Compat Data (source)Browser support info for `safe` and `unsafe`115115115636317.617.623.0115Is it a big deal to ship align-items: safe center; today?Not really. Safari recognizes the keyword. It just doesn't have any effect. So it's safe to use.But can you prevent data loss for all browsers today? Bramus Van Damme pointed out that a margin: auto; on the flex children does the job even without the safe keyword. 🎉What about the other flex box properties?You might now wonder if the safe keyword is only an align-items thing? Of course, it's not. You can also define it for justify-content, align-self or justify-self..container { display: flex; justify-content: center; align-items: center; }CSSisreallyawesomeandgetsbettereveryday!Apply safe alignmentThe content isn't fitting into the box and you can't scroll to the beginning. This is again data loss..__unsafeAlignmentJustify { container: alignmentContainer / inline-size; .__container { display: grid; grid-template-columns: 100%; gap: 1rem; } @container alignmentContainer (width > 550px) { .__container { grid-template-columns: calc(60% - 0.5rem) calc(40% - 0.5rem); } } .__controls { display: flex; gap: 0.5rem; } .__controls label { display: block; } .__highlightBox { background: var(--blue-brighter); padding: 1rem; border-radius: 0.25rem; grid-column: 1 / -1; color: var(--blue-dark); } .__preview { display: flex; justify-content: safe center; align-items: center; gap: 0.5rem; border-radius: 0.5rem; border: 2px dashed var(--blue); padding: 0.5rem 0.5rem 0.75rem; overflow: scroll; &.__overflow { border-color: var(--red); background: var(--red-brighter); justify-content: center; } } .__preview > span { border: 2px solid var(--grey); border-radius: 0.125rem; padding-inline: 0.25rem; margin-block: 0.125rem; background: white; } } .__infoBox { display: grid; grid-template-columns: 1.5rem 1fr; gap: 0.5rem; } .__infoBox .icon { fill: currentColor; height: 1.25rem; width: 1.25rem; padding: 0.25rem; border: 2px solid currentColor; border-radius: 50%; flex-shrink: 0; float: left; margin-top: 0.125rem; margin-left: 0.25rem; } .__infoBox code { display: inline-block; vertical-align: middle; background: var(--blue-brighter); color: var(--blue); font-size: 0.875em; padding: 0.125em 0.375em; border-radius: 0.25rem; }import { renderComponent } from '/esbuild/safe-alignment-justify-KXC46ZY7.js'; renderComponent({}, document.getElementById("safe-alignment-justify-323217"));CSS's unknown unknownsIt never appeared to me that centered alignment could cause data loss. The described example shows how complex CSS specs and layout are. The people working on specs have my most profound respect!If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics CSSRelated ArticlesLoad the default OS font with CSSDuplicated CSS @keyframes properties are validSafari 18 — what web features are usable across browsers?Reveal an image with smart paddingAuto-margin works with absolute positioned elements'''
