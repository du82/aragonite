["https://stefanjudis.com/blog/web-weekly-150"]
title = "Web Weekly #150 | Stefan Judis Web Development"
description = "`::target-text`, native HTML/CSS portals and the improved CSS `attr()`."
full_description = '''Web Weekly #150Written by Stefan JudisPublished atJan 27 2025Updated atJan 27 2025Reading time8minThe Web Weekly newsletter keeps you up to date, teaches you web development tricks and covers all things working in tech.Guten Tag! Guten Tag! 👋Is ::target-text included in your base styles? How do you set good alt text? And are you excited about the new features coming to the CSS attr() function?Turn on the Web Weekly tune and find all the answers below. Enjoy!Pawel listens to “Brian Bennett - Solstice”:Such a good funky, jazzy tune with incredible drums. So many hip producers sampled it!Do you want to share your favorite song with the Web Weekly community? Hit reply; there are three more songs left in the queue.💙 Shoutout to Stefano for becoming the most recent Web Weekly supporter (Patreon / GitHub Sponsors). Thank you!🤝 If you want to support Web Weekly on social media, reshare this edition Mastodon, Linkedin, or Bluesky. Every eyeball helps this newsletter grow into "something real".SponsoredBryntum lets developers avoid the pain of building Calendars and Gantt charts.Tired of building schedulers, calendars, and Gantt charts? Bryntum’s web component library handles the hard stuff so you can skip the debugging nightmares and deliver polished apps with amazing UX faster.Try Bryntum for freeWeb Weekly is open for sponsorships. When you want to reach 5k developers, you know what to do!Something that made me smile this weekThis is just great — Dave changes his site's color scheme daily. 😅 Love it! The post includes some CSS and color nerdery, too!Rotate your color schemeNew on the blogOpen a new project in the same VS Code window.A "section" without an accessible name is nothing but a "div".Load the default OS font with CSS.Setting good alt textSetting a good and accessible image alt attribute is sometimes more complicated than it might seem at first. The W3C offers official help on the matter.Set good alternativesShould you bet on a framework or the web platform?Harry tells the story of engineering teams leveling up their web performance game only to do it again after 18 months. What happened? Well... frameworks happen. If you managed a complex project in the past, you probably also experienced the issue of updating a major version or, even worse, rewriting your entire application in another framework. I've been there, I've done that.As Harry says:Every layer of abstraction made in the browser moves you further from the platform, ties you further into framework lock-in, and moves you further away from fast.What's the solution? Bet on the web.Question your tech choicesMoving on from React — one year later...Following the same topic, Kelly's post is, of course, biased, but it's a great reminder that the best code is the code you don't have to maintain.However, every delivered Byte of HTML, JS, and CSS comes with a cost. Should we question the user value for all the Frontend code we ship? Yes, we should! 😅Rethink frontend coding@counter-style can do this?The @counter-style at-rule is newly available on the baseline, and it's pretty wild to me what you can do with lists these days.Spice up your list stylesYou're halfway through!Wowza! Would you enjoy getting Web Weekly straight to your inbox?Email SubscribeThe wonderful weird web – Check your eyesHere's a fun little game — I made it to level 31.Find the squareNative HTML portalsOliver highlights how new'ish CSS can help with the portal problem. What's the portal problem?Especially in complex applications, you might want to break out of a component and render some of its children in a different place. JavaScript frameworks have <Portals> or <Teleport> components for that. What if I told you that you can do similar things with some HTML/CSS magic?Break out!From the future: a better CSS attr() functionChromium 133 will extend the attr() CSS function to use more values than just strings. The tl;dr — when this ships in every browser, we can place colors, percentages, or numbers in HTML and tell the CSS parser what these string values should be (that's the fancy type() syntax above). I'm a fan!Before you get too excited, Firefox and Safari have open bug tickets but haven't started working on them yet.Make your components more flexibleAvoid uneven paragraph spacingIf you're that person who's annoyed when things aren't aligned properly, Jen shared a small trick for component and paragraph margins. Instead of using rem or em, use lh (line height). Then, your boxes and paragraphs align nicer.Align equallyJen also showcases the margin-trim property; before you try that one, it's only supported in Safari.Importing JSON in ES modulesDr. Axel investigates the much-needed import attributes. If you're looking for a quick way to import JSON files, this post will get you up to speed.But where are we with this fancy with syntax?For importing JSON: Node ships it in the current LTS, Chrome and Safari cover the browser world — but unfortunately, Firefox is missing. So, if you want to import JSON without bundler magic, it's not the time yet.Other content types (CSS, anyone?) are still in the making...Import JSONRandom MDN – <track />From the unlimited MDN knowledge archive...Did you know HTML defines a <track /> element? Now you do!Add captionsTIL recap – optional JS error catch bindingsIt's such an interesting language quirk that you can't use try/catch without doing something with the error in JavaScript. But it gets even funnier; omit the () from your catch, and it'll work... Check the blog to learn more about this strange "feature".Ignore the errorFind more short web development learnings in my "Today I learned" section.New on the baseline - ::target-textI'm still unsure what I think of text fragment links. The syntax (#:~:text=[prefix-,]textStart[,textEnd][,-suffix]) is just a bit too funky for me. Linking to specific text also breaks very easily.Regardless, if you want to style the text that's highlighted via the URL — ::target-text entered the baseline. But you can't go wild with it because you can only style color, background-color, text-decoration, text-shadow, stroke-color, fill-color, and stroke-width.Highlight!Classifieds & friendsWebsitevice showcases casual website design examples dedicated to creators focused on results rather than awards. It provides inspiration for founders, web and mobile developers, and more.Three valuable projects to have a look atDokploy/dokploy – Open Source Alternative to Vercel, Netlify and Heroku.matteofigus/awesome-speaking – Resources about public speaking.glanceapp/glance – A self-hosted dashboard that puts all your feeds in one place.A new Tiny HelperIf you're looking for a quick way to access real-user Chrome User Experience Report (CrUX) data, CrUX Vis is great for a quick check. Drop in your domain and inspect how Chrome users experience your site.Analyze performanceSide note: what are your favorite performance tools? I'd love to add more to the Performance section on Tiny Helpers.Thought of the weekMy blog is built with 11ty, so it's no surprise that I wholeheartedly agree with Alex Russel's take, which is, as usual, a spicy take on Frontend engineering.Sites built to inform should almost always be built using semantic HTML with optional progressive enhancement as necessary.Did you learn something from this issue?💙 If so, join 21 other Web Weekly readers and support this small indie newsletter on Patreon or GitHub Sponsors.This is all, friends!Loved this email? Hated this email? I want to hear about it!If you think something needs improvement or something sparked some joy, reply to this email because I want to know more!And with that, take care of yourself - mentally, physically, and emotionally.I'll see you next week! 👋If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics NewsletterRelated ArticlesWeb Weekly #152Web Weekly #151Web Weekly #149Web Weekly #148Web Weekly #147'''
