["https://stefanjudis.com/blog/web-weekly-149"]
title = "Web Weekly #149 | Stefan Judis Web Development"
description = "Recent Chrome Perf Tooling additions, `rawJSON` and the `figure` HTML element."
full_description = '''Web Weekly #149Written by Stefan JudisPublished atJan 20 2025Updated atJan 26 2025Reading time9minThe Web Weekly newsletter keeps you up to date, teaches you web development tricks and covers all things working in tech.Guten Tag! Guten Tag! 👋Do you know what shipped in the Chrome Perf tools recently? Have you used JSON.raw already? And when do you correctly use the figure HTML element?Turn on the Web Weekly tune and find all the answers below. Enjoy!Tim listens to “Criminal Code - starcluster”This track hits an EDM sweet spot for work music — complex enough to be engaging, but clean enough to not distract. Tons of variation and very, very hype. Top kek.Do you want to share your favorite song with the Web Weekly community? Hit reply; there are four more songs left in the queue.Generally, I've never been very concerned about serverless platforms going rogue on me. How bad could it be, right? ServerlessHorrors tells another story.And while the scenarios on the site are extreme, let me tell you, I've experienced a serverless horror story myself around Christmas. What happened?Some of my projects, like Tiny Helpers or my blogroll, show dynamically generated site screenshots. On request, Chrome is kicked off in the cloud, renders the page and returns a site screenshot. Easy peasy.This endpoint lived in its own project on a subdomain so that I could reuse the endpoint across projects. Someone forked Tiny Helpers and deployed it elsewhere. Ignoring that this is not cool, these things happen when you have MIT code on GitHub. But the clone had massive traffic for whatever reason. Millions of requests were hammering against my tiny private serverless function, generating a $300 Vercel bill.To be fair, I ignored Vercel's usage warnings for a few days, so that's on me, but if you're running serverless functions, now's the time to double-check if they can create cost if someone misuses them.Here's a quick checklist of things I did:check if you need a serverless function in the first placecheck if your serverless provider bills overagescheck your firewall settingsprotect your serverless function with header checksI also put a dummy image on the copy site. Click on your own risk because it's one of these fishy popup sites.That's it — be safe!💙 Shoutout to Jonathan for becoming the most recent Web Weekly supporter (Patreon / GitHub Sponsors). Thank you!If you want to support Web Weekly on social media, reshare this edition Mastodon or Bluesky.SponsoredBryntum lets developers avoid the pain of building Calendars and Gantt charts.Tired of building schedulers, calendars, and Gantt charts? Bryntum’s web component library handles the hard stuff so you can skip the debugging nightmares and deliver polished apps with amazing UX faster.Try Bryntum for freeWeb Weekly is open for sponsorships. When you want to reach 5k developers, you know what to do!Something that made me smile this weekI'll never understand how people can come up with the time and patience to build these things in CSS... It's only 1.5k lines of CSS, right?Pat the catOpen tabsSome eye candy: The most popular CodePens of 2024 are out.Some solid programming advice: Build the abstraction first.Some useful snippets: Oh shit, git?TS Template Literal TypesI know this TS code is quite something, but it uses one of my favorite TypeScript features — Template Literal Types. Whenever I use template literal types, I feel like a TypeScript pro.Alex put things to the next level with some advanced use cases.Type your stringsThe Success of InteropNow that everybody writes their year review posts, Jen looked at the results of Interop 2024. If you don't know, Interop is this fantastic initiative in which browser makers agree on new features to ship in a year and they all try to deliver.And the 2024 results are exceptional. Look at it: for the agreed new platform additions, we reached 95% interoperability. Wowza!Celebrate InteropIf you want to double-check what was included in Interop 2024, you'll find all the info in the interop dashboard.What's new in Chrome Perf toolsI haven't had to dig into gnarly perf issues for a while and primarily trust Lighthouse for quick checks. It turns out, that the Chrome Perf tools got a ton of improvements lately. If you want to learn more, Jack has you covered.Monitor perfNode's "new" featuresLast week's biggest news was that Node.js now lets you run TypeScript files, but it's not the only "modern" feature that shipped to catch up. I'm also talking about:testing source codewatching source codeparsing argumentsreading environmentstyling outputIf you're using userland code for these tasks, check what modern Node offers.Trust in Node!You're halfway through!Wowza! Would you enjoy getting Web Weekly straight to your inbox?Email SubscribeThe wonderful weird web – Spot the differenceThat could be a German thing, but here we have TV shows where kids must spot the difference between images. And they're quick to discover tiny differences! And I mean, blazingly a thousand times faster than the newest JS framework fast… How do they do it? The trick is almost too simple, and you can spot differences in very detailed images, too!Use a simple trickHow do you figure?Oldie, but goldie: I discovered some strange <figure> HTML patterns in one of my current projects, so I did some reading to fix things. As always, Scott published helpful articles on the figure and figcaption element explaining when and how to use them.Figure it outCSS snippets devs should knowAdam came around with a hot take, sharing CSS snippets Frontend developers should know. #noPressure Looking at the current pace of new landing CSS features, this is tough, though. 😅However, the post is golden and highlights many new things CSS can do today!Use the latest and greatestThe CSS wishlist of wishlistsAnd speaking of the new CSS available already, Chris created an ultimate CSS wishlist of wishlists. It's always great to realize that certain CSS things could be easier.Dream of the CSS futureRandom MDN – rawJSONFrom the unlimited MDN knowledge archive...Do you know that JSON.stringify can potentially mess with your data? Especially when dealing with huge numbers or invalid JSON types, rawJSON helps out.Keep your data in checkTIL recap – Why custom properties don't work with the url() functionI learned why you can't use custom properties with the url() as you see above. The reason is that browsers run url() in two different modes. Find a detailed explanation on the blog.Learn about the two url() functionsFind more short web development learnings in my "Today I learned" section.New on the platformSafari 18.2 was released in December and included a little nugget I missed. Safari now also supports cross-document view transitions.This means you can now slap this bad boy (👇) into your CSS and get a nice cross-fade across oldschool HTML navigations in two of the three engines. No JavaScript required.You might know that I'm still using Firefox as my main driver, but boy... I want to see all this eye candy now!Here are some more resources if you want to add some navigation sugar to your sites:Cross-document view transitions for multi-page applicationsCross Document View Transitions — ExplainerChrome 133 also entered beta: and it will be a CSS banger with an advanced attr() function, the :open pseudo class, scroll-state(stuck: top) and text-box-trim. Holy Moly!Classifieds & friendsFor the German-speaking folks: if you're a Podcast listener, you should check out Working Draft. I have listened to it for many years, and it's always worth it!Three valuable projects to have a look atopen-webui/open-webui – A user-friendly and self-hostable AI Interface.samwho/spacer – CLI tool to insert spacers when command output stops.addyosmani/firew0rks – Fireworks in your terminal.A new Tiny HelperYou might know Squoosh, but have you heard of "Squish"? Squish is a bit like Squoosh, but for bulk image operations.Do you need a UI to convert all your PNGs to AVIF? Drop them in there, and you'll have them in no time!Compress your imagesFind more single-purpose online tools on tiny-helpers.dev.Thought of the weekI've never thought of how and what I would define as "Software engineering", but I liked this quote in Swizec's post about Software Engineering at Google.Software engineering is programming over time.Do you enjoy Web Weekly? | Did you learn something from this issue?💙 If so, join 20 other Web Weekly readers and give back with a small monthly donation on Patreon or GitHub Sponsors.This is all, friends!Loved this email? Hated this email? I want to hear about it!If you think something needs improvement or something sparked some joy, reply to this email because I want to know more!And with that, take care of yourself - mentally, physically, and emotionally.I'll see you next week! 👋If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics NewsletterRelated ArticlesWeb Weekly #152Web Weekly #151Web Weekly #150Web Weekly #148Web Weekly #147'''
