full_description = '''Datalist elements can have values and labelsWritten by Stefan JudisPublished atMay 17 2019Updated atMay 17 2019Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Today I was reading an issue of Šime Vidas' great Web Platform news. He describes something that was news to me – datalist elements not only provide values that can be chosen but also have a mechanism to show labels, too.<label> Animal: <input name=animal list=animals> </label> <datalist id=animals> <option value="Dog">🐶 <option value="Cat">🐱 <option value="Duck">🦆 </datalist> The markup above results in the following:That's very cool in my opinion. :)But heads-up: before you jump onto using this - make sure to read Šime's article about it. Currently, there is a Firefox bug that troubles user experience tremendously.If you want to play around with it and see it in action you can have a look at this CodePen.If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics HTMLRelated ArticlesA "section" without an accessible name is nothing but a "div"Use "translate" to turn off element translationsA web component to show browser support and baseline statusForms without an accessible name are not exposed as ARIA landmarksTarget=_blank implies rel=noopener'''
