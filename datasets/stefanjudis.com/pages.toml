full_description = '''SVGs have additional pointer-events propertiesWritten by Stefan JudisPublished atAug 01 2018Updated atMay 01 2023Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Today I came across this example about things you can do with pointer-events in CSS..foo { pointer-events: visiblePainted; } visiblePainted is something I haven't seen before and it turns out that SVGs several other values for the pointer-events property:visiblePaintedvisibleFillvisibleStrokevisiblepaintedfillstrokeallYou can control very granular how elements in an SVG should behave and it's not bound to the typical "web development boxes". If you want to read more MDN has you covered. :)If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics CSS SVGRelated ArticlesLoad the default OS font with CSSDuplicated CSS @keyframes properties are validSafari 18 — what web features are usable across browsers?Reveal an image with smart paddingAuto-margin works with absolute positioned elements'''
