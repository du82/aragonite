["https://stefanjudis.com/blog/notes-on-the-vanishing-io-toplevel-domain"]
title = "Notes on the vanishing .io toplevel domain | Stefan Judis Web Development"
description = "Just some notes, links and thoughts and the possible `.io` domain vanishing."
full_description = '''Notes on the vanishing .io toplevel domainWritten by Stefan JudisPublished atOct 20 2024Updated atOct 20 2024Reading time2minDid you register .io domains?I mainly hold a few .dev, .email and .com domains (these are Generic Top Level Domains (gTLD)). There are also some .des in the bucket (I'm based in Germany) — but I don't own an .io..io (like .de) is a country code domain (ccTLD) representing the British Indian Ocean Territory with the country code IO. And there's news: On October 3, the UK decided to give up the sovereignty of the Chagos Islands to Mauritius. The IO territory represented by the .io domain will cease to exist. What will happen with the domain in this case?Theoretically, the Internet Assigned Numbers Authority (IANA) defines strict rules to phase out a ccTLD once a region, country or territory no longer exists. And it wouldn't be the first time this happens..cs (Czechoslovakia), .zr (Zaire) and .tp (East Timor) were removed and eventually phased out to disappear from the internet. But there are also exceptions. .su (Union of Soviet Socialist Republics) is still working (even though it is primarily used for sketchy stuff).What will happen with .io then?Honestly, I'm skeptical that .io domains will disappear because the tech world is too involved — github.io, google.io, codepen.io, ... There are probably thousands of domains registered by very influential tech people and companies. If you registered some .ios, I wouldn't freak out. Yet...But this problem teaches a valuable lesson: registering a domain is different from owning a domain. And as wild as it sounds, relying on a country to exist for your domains isn't the best idea. And it isn't only .io: there's also the popular .ai (Anguilla), .ly (Libya), .me (Montenegro), or .tv (Tuvalu). Not too long ago, many people, including Wes Bos, lost their .af (Afghanistan) domain without notice.So, for me, I'll stick to generic domains. There are enough great ones that don't rely on some countries to exist. But if you own some .ios — it's probably a good idea to think of an action plan.If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics WebRelated ArticlesA well-known avatar URL would be dang cool.An API to access browser support and baseline dataA web component to show browser support and baseline statusOn being a "JavaScript framework developer"...htmz — a 176 bytes htmx alternative'''
