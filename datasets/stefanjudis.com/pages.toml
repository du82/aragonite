full_description = '''A web component to show browser support and baseline statusWritten by Stefan JudisPublished atOct 28 2024Updated atOct 28 2024Reading time1minMy blog includes browser support information for a while.MDN Compat Data (source)Browser support info for Relative `color()` syntax119119119128128181825.0119It's hand-made, and the data is fetched from MDN's browser-compat-data repo whenever I deploy my site. So it's always up-to-date.I've always wanted to open source it properly, but never made it to it.But now there's news for the bloggers: the W3C WebDX Community Group is doing some behind-the-scenes work and just released a web component to show browser support and baseline status.<baseline-status featureId="relative-color"></baseline-status> Not sure why no one is talking about this, but how freakin' cool is this?!If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics HTML WebRelated ArticlesA well-known avatar URL would be dang cool.A "section" without an accessible name is nothing but a "div"Use "translate" to turn off element translationsAn API to access browser support and baseline dataNotes on the vanishing .io toplevel domain'''
