["https://stefanjudis.com/today-i-learned/html-defines-a-ping-attribute-on-anchor-elements-links"]
title = "HTML defines a ping attribute on anchor elements (links) | Stefan Judis Web Development"
description = "HTML anchors provide a ping attribute that can be used to send analytics information to defined URLs"
full_description = '''HTML defines a ping attribute on anchor elements (links)Written by Stefan JudisPublished atMar 20 2021Updated atOct 30 2023Reading time2minThis post is part of my Today I learned series in which I share all my web development learnings.A PR on the MDN compatibility data repository caught my eye today. The pull request added support information for the ping attribute in Safari. I've never seen this attribute – let's have a look!The ping attribute on anchor elementsThe anchor element's ping attribute accepts a space-separated list of URLs. When an anchor defines ping URLs and someone clicks it, the browser sends a POST request to these specified URLs. You can use it, if you want to track and analyse how users interact with your site.<a href="https://www.stefanjudis.com/popular-posts/" ping="https://www.stefanjudis.com/tracking/"> Read popular posts </a> To see it in action open your developer tools and click the link below.👇Read popular postsAnd indeed, when you open the network panel in the developer tools (enable "preserve log" to see the request after the browser navigated to a new URL), you see a request flying to the defined URL after clicking the "ping link".The POST request's payload is the single word PING. The ping-to request header holds the link's destination and additional information such as user-agent. It's fascinating that the content-type is text/ping. 🙈To summarize, the ping attribute offers a leightweight way to implement "link click tracking". Does this mean that you can use it today?The browser support of the ping attributeWhen you look at the attribute's browser compatibility table on MDN, you see that browser support is not so bad.MDN Compat Data (source)Browser support info for ping attribute12121711661.5≤37Chromium browsers (Chrome, Edge, etc.) support it. Firefox's support is behind a browser feature flag (browser.send_pings) and Safari as all green.Why's no one using ping?I'm a big fan of native HTML solutions. The question is why no one uses the ping attribute (or do you know a site that uses it?)?I can only speculate, but one reason could be that user analytics are mainly driven by 3rd party providers such as Google Analytics.To use these you have to embed a single script into your site. The JavaScript will track all the user behaviour, and there's no infrastructure to set up. It just works.If you base your tracking on the ping attribute, you have to adjust all the links on your site. This process includes more maintenance and development work. That's a strong argument against using the ping attribute.Nevertheless, it's good to know that it exists. If you use ping, I'd love to learn more about what you do with it!If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics HTMLRelated ArticlesA "section" without an accessible name is nothing but a "div"Use "translate" to turn off element translationsA web component to show browser support and baseline statusForms without an accessible name are not exposed as ARIA landmarksTarget=_blank implies rel=noopener'''
