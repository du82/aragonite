full_description = '''"npm root" locates the global node modules directoryWritten by Stefan JudisPublished atOct 20 2021Updated atOct 20 2021Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Today I learned that the npm root command locates the local and global node_modules directory.Finding local dependencies isn't very spectacular because they're usually located in ./node_modules. But locating the global dependencies can be a hassle. People install Node.js in countless ways, and that's why the Node.js binary and the global dependencies can be anywhere.It's great to learn that there's a command that helps locate the global dependencies!From the npm docs:#!/bin/bash global_node_modules="$(npm root --global)" echo "Global packages installed in: ${global_node_modules}" And I just had a use case for npm root. Beautiful!If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics NodeJSRelated ArticlesSet the default time zone in Node.jsBun's trusted dependenciesHow to use headless Chrome in serverless functions with a 50MB limitThe problem of breaking changes and version numbersTop-level promise handling in Node.js ES modules'''
