title = "console.dir() is short for console.log(util.inspect()) | Stefan Judis Web Development"
description = "I learned that 'console.dir' is actually only a shorthand for 'console.log' and 'util.inspect'. This can help you to save a bit of typing."
full_description = '''console.dir() is short for console.log(util.inspect())Written by Stefan JudisPublished atMar 13 2017Updated atMar 21 2019Reading time1minThis post is part of my Today I learned series in which I share all my web development learnings.Sometimes when debugging node scripts via console.log you'll run into the situation, that console.log won't show you the complete object you want to inspect.console.log( { foo: { bar: { baz: { foo: 'Show me!' } } } } ); // { foo: { bar: { baz: [Object] } } } The solution to this problem is to use util.inspect which also includes the option to color the output.console.log( util.inspect( { foo: { bar: { baz: { foo: 'Show me!' } } } }, { depth: null, colors: true } ); // { foo: { bar: { baz: { foo: 'Show me!' } } } } Frederic Hemberger just told me that console.dir uses util.inspect under the hood, which means we can make it even shorter! 🎉console.dir( { foo: { bar: { baz: { foo: 'Show me!' } } } }, { depth: null, colors: true } ); // { foo: { bar: { baz: { foo: 'Show me!' } } } } If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics NodeJSRelated ArticlesSet the default time zone in Node.jsBun's trusted dependenciesHow to use headless Chrome in serverless functions with a 50MB limitThe problem of breaking changes and version numbersTop-level promise handling in Node.js ES modules'''
