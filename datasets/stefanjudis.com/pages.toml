["https://stefanjudis.com/today-i-learned/the-output-html-element-is-an-aria-live-region"]
title = "The output HTML element is an aria-live region | Stefan Judis Web Development"
description = "The output HTML element is an ARIA live region by default."
full_description = '''The output HTML element is an aria-live regionWritten by Stefan JudisPublished atMar 16 2021Updated atMar 16 2021Reading time3minThis post is part of my Today I learned series in which I share all my web development learnings.Šime Vidas' Web Platform News is one of my favourite resources for web development updates. Šime covers a wide range of topics all about web technology. I'm a big fan of the bonus content he sends out when you're becoming a supporter.I can highly recommend supporting his efforts because then you'll receive weekly bonus content (it's two dollars per month and worth it!). This week's edition included an interesting fact about ARIA (Accessible Rich Internet Applications) live regions and the good old HTML output element.The use case for ARIA live regionsARIA live regions can be used to convey visual changes of a site or web app to assistive technology. Think of a typical web application; you interact with a form, click a button, and a toast message enters the screen to tell you about your action's success or failure.Screenreader users, on the other hand, might not be able to see the visual change. Depending on the taken action, this can make interfaces unusable.To convey the information of JavaScript-driven UI changes, ARIA live regions come into play. You can use the aria-live or role attribute to make changes to DOM nodes accessible to assistive technology. These attributes enable you to screen reader users aware of messages and DOM changes.Live regions can be defined with different levels of urgency. These range from log messages (role="log") to status (role="status") and important (role="alert") updates such as confirmation dialogs. There's a lot of nuance to these update levels. I recommend that before you implement them, do some research on the topic.If you want to learn more: the Gatsby folks did extensive research on making client-side navigations more accessible using live regions.The output element provides live region functionality out of the boxMDN defines the output element as follows:The HTML Output element (<output>) is a container element into which a site or app can inject the results of a calculation or the outcome of a user action.It's important to note that you can use output elements for calculations and results of user interactions. It was news to me that output elements are live regions by default (Patrick Lauke shared that on Twitter).When you fire up a screen reader such as Voice Over on macOS and play around with the output example embedded in the MDN documentation, you'll see that UI updates are correctly announced. 😲output elements, by specification, have an implicit ARIA live region of type "status" (role="status"). That's great to know, and it plays nicely with the golden rule of ARIA – "Don't use ARIA, use native HTML instead", too!And that's my learning of today. 🙈 If you want to get more web development learnings, make sure to look at my weekly newsletter.If you enjoyed this article...Join 5.7k readers and learn something new every week with Web Weekly.Reply to this post and share your thoughts via good old email.About Stefan Judis Frontend nerd with over ten years of experience, freelance dev, "Today I Learned" blogger, conference speaker, and Open Source maintainer.Related Topics HTML AccessibilityRelated ArticlesA "section" without an accessible name is nothing but a "div"Use "translate" to turn off element translationsA web component to show browser support and baseline statusThe order of accessible name computation stepsForms without an accessible name are not exposed as ARIA landmarks'''
