full_description = "React in LiveView: How and Why? I love LiveView, but I also love React. This post covers why I think React still has a place in a LiveView app, and how I actually integrate them together. What is a GenServer? GenServer is a foundation of Elixir/OTP. This post will take a shot at describing them to beginners. On Culture: Ending 7 Years at SalesLoft Reflection on the most important part of my SalesLoft journey—company culture. What's Next? Starting Clove I'm excited to share what I'm working on next. Learn about Clove, what our goal is, and what our tech stack is like. My Experiences Writing Real-Time Phoenix I talk about my experiences writing Real-Time Phoenix. The entire process took just over a year, and I will hit many points of the journey. Verifying Queries with Ecto's prepare_query Callback Using tenancy is critical in multi-tenant SaaS applications. You'll see how Ecto's recently added prepare_query callback can be used to verify that all queries in an application have tenancy set properly. Improve Exq Writes With Pooling Exq is a background job processing library for Elixir. In this post, I perform benchmarks on the speed of inserting jobs via Exq. You'll walk away with actionable ways to improve your write throughput. Lessons Learned from Shipping PushEx We replaced our push service with an open-source library that I wrote—PushEx. This post will walk through the different lessons we learned and challenges that we solved. Elixir Makes Testing Hard Things Easy Writing tests is both necessary and often hair-pulling. Certain things that we want to test may be just plain hard. Let's look at how Elixir helps making testing hard things easy. Useful Elixir Patterns from Real-world Side Project Patterns from an internal business app I wrote for work. Examples for database and other parts of the system. Monolith to Microservice Without Downtime — A Production Story Story and tips from a microservice migration out of SalesLoft's production codebase Distributed In-Memory Caching in Elixir Offering code and ideas for distributed caching that uses Cachex for caching and pg2 for distribution."
