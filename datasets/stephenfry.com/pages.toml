full_description = "The Way Ahead 29th May 2017 Stephen Fry The comparison seems rather good, don’t you think? If Gutenberg’s revolution was Pandora 2.0 and the Industrial Revolution 3.0 then the information age is Pandora 4.0. Switched On 17th August 2016 Stephen Fry I started work on a comedy series for CBS television in the US this week and I will certainly keep the @stephenfry feed up to date with information and pictures about this exciting new project... Off the grid 20th April 2016 Stephen Fry This shouldn’t be a blog. It really shouldn’t be a blog. But it has to be a blog I think. So here is this blog. Too many people have peed in the pool 15th February 2016 Stephen Fry Oh goodness, what fun twitter was in the early days, a secret bathing-pool in a magical glade in an enchanted forest. It was glorious ‘to turn as swimmers into cleanness leaping.’ We frolicked and water-bombed and sometimes, in the moonlight, skinny-dipped. When Stephen Fry met Jony Ive 25th May 2015 Stephen Fry When Stephen Fry met Jony Ive: the self-confessed tech geek talks to Apple's newly promoted chief design officer. You MUST mock 10th January 2015 Stephen Fry “Je suis Charlie. Nous sommes Charlie. Paris est Charlie. Le Monde est Charlie. L’humanité est Charlie.”"
