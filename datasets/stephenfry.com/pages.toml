description = "Sad news from TV-land. Well sad for me and for some others. It may well have you skipping about like a lamb on ketamine, trilling with joy. Our masters at ITV have decided that there shan’t be a fourth series of the television drama Kingdom. I am sorry because it was such a pleasure making […]"
full_description = 'Kingdom Come, Kingdom Gone 9th October 2009 Stephen Fry Sad news from TV-land. Well sad for me and for some others. It may well have you skipping about like a lamb on ketamine, trilling with joy. Our masters at ITV have decided that there shan’t be a fourth series of the television drama Kingdom. I am sorry because it was such a pleasure making them in my beloved Norfolk. I am sorry because the crew of mostly local East Anglians was so cheerful, professional and delightful to work with: the riggers, sparks, grips and location; the camera, caterers, dressers, make-up and props, production assistants, accountants and co-ordinators, the sound men and the drivers, assistant directors and runners, the security, police and councillors who always tried to help. The cast of local people who cheerfully subjected themselves to the indignities of a background artist’s day. They will all be missed and their memories cherished. Above all, the people of those Norfolk towns and villages on which we descended for days on end. The citizens especially of Castle Rising, Wells-next-the-Sea and above all of Swaffham who put up with our desire to control traffic (something of a vain, Canute-like hope in Swaffham’s central buttermarket – Norfolk’s Piccadilly Circus). They were kind to us, considerate and understanding. It was a charming and cheerful experience for us all. I am lucky to live there much of the time – for the rest of the Kingdom cast and crew it will be a sad farewell that was never properly said. Advertisement googletag.cmd.push(function() { googletag.display("div-gpt-ad-1407842938698-0"); }); All things must pass. That is why we must be so grateful to Mnemosyne, the goddess of memory, and mother of the muses. Heigh ho. Onward and upward. 40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […]'
