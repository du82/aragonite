["https://www.stephenfry.com/author/stephenfry-2/page/2"]
title = "Stephen Fry, Author at Official site of Stephen Fry - Page 2 of 56"
full_description = "Estonia Everybody! Freedom Reigned 9th October 2014 Stephen Fry The wonderful, wonderful news for the time being is that Estonia’s second reading of its bill allowing equal rights was passed this morning in Tallin's parliament. Everybody 6th October 2014 Stephen Fry The World Congress of Families, a US based evangelist group that has already done so much to ruin Uganda, has teamed up with the Kremlin to parachute into Estonia huge quantities of money with which to browbeat, bully and blackmail parliamentarians Where Does it Come From? 29th September 2014 Stephen Fry Audiences often don’t believe me when I tell them that as I stand in the wings of the theatre or civic hall where a book publicity “event” takes place I have in my head absolutely no idea what I am going tho say. It is a very bewildering and alarming feeling. Writing a selfie 24th September 2014 Stephen Fry Take this business of autobiography. A man or woman gets to a certain age, a certain prominence, if one dare use the word, and a publisher asks them to put down the story of their life in book form. The Old Friary 22nd September 2014 Stephen Fry As hard as it might be to believe, all the high-tech, vibrantly coloured glowing decor you are enjoying is housed and integrated on the site an old and recently excavated Dominican Friary. Apple Hit Successive Sixes 17th September 2014 Stephen Fry Since January 1984 when I bought my first Apple Macintosh, through the dark late 80s and mid 90s when the company had all but 3% of the personal computer market, I have developed the thickest of skins when it comes to Apple-haters. Three Strokes and You’re Out 10th June 2014 Stephen Fry All those hours I’ve spent, if you add them up, typing dot co dot uk, an extra three keystrokes that I could well have done without. Well they're over. Dot UK is finally here."
