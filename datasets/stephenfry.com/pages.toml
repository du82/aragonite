["https://www.stephenfry.com/category/general"]
title = "General Archives - Official site of Stephen Fry"
full_description = "40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […] TROY – Best Seller 13th October 2020 Administrator The siege of Troy is perhaps the most well-known tale in Western literature. Retold by Stephen Fry this autumn in all its passion and tragedy, Troy will be the third volume of his unforgettable and definitive series, following on from the bestselling Mythos and Heroes. Switched On 17th August 2016 Stephen Fry I started work on a comedy series for CBS television in the US this week and I will certainly keep the @stephenfry feed up to date with information and pictures about this exciting new project... Don’t Part Me From My Porage Oats 17th February 2016 Stephen Fry Yesterday and today I have been bombarded by texts and emails asking me why I am leaving Britain to go in live in America. This caught me not a little by surprise, since I have no plans at all to swap the UK for the US. When Stephen Fry met Jony Ive 25th May 2015 Stephen Fry When Stephen Fry met Jony Ive: the self-confessed tech geek talks to Apple's newly promoted chief design officer. Away Away-O 13th February 2015 Stephen Fry Dearest twitter followers and other interested (or bored) parties, Just a quick note to say that I’m going to be away until May. During that time I will be taking a holiday from twitter and, with a few exceptions, not tweeting at all."
