full_description = "SanDisk Sansa e2x0 5th September 2008 Stephen Fry It is rare for me to contemplate new gadgetry without a pang of regret for the early passing of Douglas Adams. Column “Dork Talk” published on Saturday 6th September 2008 in The Guardian “Dork Talk” – The Guardian headline. I miss him both as friend and technology guru. For years, we played with digital toys […] Wii is a kind of magic 29th August 2008 Stephen Fry Column “Dork Talk” published on Saturday 30th August 2008 in The Guardian “Dork Talk – A kind of magic” – The Guardian headline Stephen Fry is wowed by Nintendo’s magical Wii Last week I looked at the remarkable rebirth in the fortunes of Nintendo, a renaissance engendered by two products – the DS, a pocket […] Handheld gaming 22nd August 2008 Stephen Fry Column “Dork Talk” published on Saturday 23rd August 2008 in The Guardian “Dork Talk” – The Guardian headline Stephen Fry has a lot of affection for Nintendo’s DS, which he finds much more engaging than Sony’s PSP Poor Nintendo. Those clever little handheld games in the 80s: small, orange, plastic “Game & Watch” devices that […] The sheer brilliance of Spinvox 15th August 2008 Stephen Fry Column “Dork Talk” published on Saturday 16th August 2008 in The Guardian “Dork Talk” – The Guardian headline Stephen Fry is stunned by the sheer brilliance of the Spinvox, which translates voicemail into text However uninterested you may be in technology, it is likely that you use a voicemail system. If you have a mobile, […] MacBook Air spawns digital anagrams 9th August 2008 Stephen Fry Column “Dork Talk” published on Saturday 9th August 2008 in The Guardian “MacBook Air spawns digital anagrams” – The Guardian headline Stephen Fry ponders the preposterous twist of circumstance that made ‘laptop machines’ an anagram of ‘Apple Macintosh’ ‘Laptop machines”, by one of those preposterous twists of circumstance that make you wonder who is running […]"
