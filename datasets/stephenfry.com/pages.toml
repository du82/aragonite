["https://www.stephenfry.com/7deadlysins"]
title = "7 Deadly Sins - Official site of Stephen Fry"
description = "Stephen Fry’s 7 Deadly Sins There have always been, I think, alternative ways of thinking about our goodness or badness. One way is to compare our actions to a list laid down by authority in the form of scripture or law. Another is to be a little more independent-minded and judge for ourselves our conduct, […]"
full_description = "7 Deadly Sins Stephen Fry’s 7 Deadly Sins There have always been, I think, alternative ways of thinking about our goodness or badness. One way is to compare our actions to a list laid down by authority in the form of scripture or law. Another is to be a little more independent-minded and judge for ourselves our conduct, perhaps on the basis of its effects on other people. Do my actions ever hurt others, myself included, I might ask myself, do they hurt those close to me or society or the wider world as a whole? I’m raring to having a look at the obstacles to our individual happiness and fulfilment. And sin, trespass, wrong, transgression, error … all these words describe what you might call stumbling- blocks, impediments to our happiness and fulfilment that come from within. xS The Stephen Fry team have also worked closely with Acast for the launch of the series, and are pleased to be a part of Acast family. Released weekly over nine weeks, the podcast is available for download from Acast, Apple Podcasts, Google Play and all podcast aggregators."
