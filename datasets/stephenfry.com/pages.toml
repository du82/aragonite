full_description = "Damn, damn, damn, damn, damn 28th August 2009 Stephen Fry Professor Higgins opens the My Fair Lady Song, “I’ve Thrown A Custard in her Face” with a long string of Damns, which I am in a mood to repeat. I have a ten-ton deadline hanging over me suspended by a single human hair. If I don’t stay and stare at my screen all day every […] Servers With A Smile 26th August 2009 Stephen Fry Nothing more than a housekeeping miniblog today, I’m afraid, but it might interest those of you who like contemplating the astonishing power of volume. I have for some time now been very wary of tweeting or retweeting URLs, however worthy the cause. The high (and entirely gratifying) number of followers that I have accumulated on […] Office Slavery 25th August 2009 Stephen Fry I don’t think I need explain how much I love the world of tech. I love the software and hardware and firmware and wares of all gradations on the digital Moh Scale in between. I love smartphones and watches and ebooks and media players and social networking services and maxiblogs and miniblogs and microblogs. I […] Confession 22nd August 2009 Stephen Fry When Auden and Isherwood left Britain for America in 1939 they attracted much opprobrium and many brickbats. Evelyn Waugh portrayed them as Parsnip and Pimpernel, lily-livered pansy traitors who left their country in its hour of greatest need (though how exactly Great Britain needed two literary types like Wystan and Christopher he didn’t quite explain) […] Glory Be 22nd August 2009 Stephen Fry There is a quality in human affairs, so rare, so fleeting and so intense that to invoke its name in any context risks derision. To invoke its name in the context of sport must seem especially perverse, pretentious, preposterous and pathetic. I have always flirted with those four mockable Ps and nothing can stop me […] The test 20th August 2009 Stephen Fry No, not the 5th and Final Test. Although I am on my way there as I type this. I am thinking about the tests undergone by today’s A level students. I’m not saying I wasn’t nervous about my A level results way back when. I was. Very. I had been in prison, was less than […]"
