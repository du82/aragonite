full_description = 'When Stephen Fry met Jony Ive 25th May 2015 Stephen Fry In an exclusive interview – in which Ive’s promotion is revealed for the first time – Stephen Fry meets Jony Ive, and his boss, Apple chief executive Tim Cook, to talk spaceships, design and Steve Jobs I stood last week at the entrance to 1 Infinite Loop, Cupertino, the coolest address in the universe, remembering the time I had gone inside and managed to annoy Steve Jobs. Read the full story on the Telegraph website along with a picture gallery. Stephen Fry, Tim Cook and Jony Ive (left to right) (Photo: Gabriela Hasbun for The Telegraph) Advertisement googletag.cmd.push(function() { googletag.display("div-gpt-ad-1407842938698-0"); }); 40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […]'
