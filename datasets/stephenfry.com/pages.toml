full_description = "Bored of the dance 7th March 2008 Stephen Fry Hello there. Firstly may I thank all of you who have downloaded and listened to my first podgram. Since it was little more than an incoherent stream of reminiscence poured into a microphone by a man with no functioning right arm with which to type, the piece was not available to be read as a […] Bloggery 30th January 2008 Stephen Fry Dear All, forgive long period of silence. I’m sorry that all I have posted recently have been Guardian columns. They will stop for three months or so I fear as I finish documentary filming with one arm for much of the time. For the grisly amongst you here is a picture of the break (a […] Getting Overheated 19th November 2007 Stephen Fry Housekeeping How difficult, how exquisitely difficult it is to know where to begin. Anyone who has had the time or disposition to read the comments that readers have submitted to these pages over the last three weeks or so will be aware of a number of issues that need addressing. Firstly and most crucially: how […] I Give Up 21st October 2007 Stephen Fry What ho, world. Blessay or blissertation number three coming up in a moment. It has taken me a little longer than I had hoped to furnish the site with its third upload. There are reasons and I shall go through them quickly. Why So Late? My first blog entry, Devices and Desires (see below) went […] Let Fame 27th September 2007 Stephen Fry Firstly. A big thank you to all of you for putting up with the server problems that accompanied the arrival of my first blog essay, or blessay as I quite horribly prefer to call it. I thank you all for your suggestions, tips, links and comments. I can’t reply to all the points raised, but […] Device and Desires 16th September 2007 Stephen Fry All the big guns want an iPhone killer. Even I, mad for all things Apple as I am, want an iPhone killer. I want smart digital devices to be as good as mankind’s ingenuity can make them. I want us eternally to strive to improve and surprise. Bring on the iPhone killers. Bring them on. […]"
