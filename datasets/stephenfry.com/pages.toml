["https://www.stephenfry.com/category/general/page/2"]
title = "General Archives - Page 2 of 7 - Official site of Stephen Fry"
full_description = "Estonia Everybody! Freedom Reigned 9th October 2014 Stephen Fry The wonderful, wonderful news for the time being is that Estonia’s second reading of its bill allowing equal rights was passed this morning in Tallin's parliament. Where Does it Come From? 29th September 2014 Stephen Fry Audiences often don’t believe me when I tell them that as I stand in the wings of the theatre or civic hall where a book publicity “event” takes place I have in my head absolutely no idea what I am going tho say. It is a very bewildering and alarming feeling. Writing a selfie 24th September 2014 Stephen Fry Take this business of autobiography. A man or woman gets to a certain age, a certain prominence, if one dare use the word, and a publisher asks them to put down the story of their life in book form. The Old Friary 22nd September 2014 Stephen Fry As hard as it might be to believe, all the high-tech, vibrantly coloured glowing decor you are enjoying is housed and integrated on the site an old and recently excavated Dominican Friary. Guest blogger, James Rhodes, Pianist 10th June 2014 James Rhodes We have a chance, now more than ever before, to benefit from such thrilling technological innovation and channel our use of it in a way that is less about consumerism, greed and ego and more about creating change. Guest Blogger, Martha Lane Fox, Baroness Lane Fox of Soho 10th June 2014 Martha Lane Fox It was only 25 years ago that Tim Berners Lee invented the world wide web. An incredible invention by a british man whose discovery changed the way information, entertainment and business were organised forever. Three Strokes and You’re Out 10th June 2014 Stephen Fry All those hours I’ve spent, if you add them up, typing dot co dot uk, an extra three keystrokes that I could well have done without. Well they're over. Dot UK is finally here."
