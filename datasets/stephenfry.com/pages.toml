full_description = "40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […] Trumpery Towers Over All 11th March 2016 Stephen Fry ‘for that alone Donald Trump should be stripped naked and whipped with scorpions…’ Don’t Part Me From My Porage Oats 17th February 2016 Stephen Fry Yesterday and today I have been bombarded by texts and emails asking me why I am leaving Britain to go in live in America. This caught me not a little by surprise, since I have no plans at all to swap the UK for the US. Away Away-O 13th February 2015 Stephen Fry Dearest twitter followers and other interested (or bored) parties, Just a quick note to say that I’m going to be away until May. During that time I will be taking a holiday from twitter and, with a few exceptions, not tweeting at all."
