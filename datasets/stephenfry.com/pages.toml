description = "Ladies and gentleman, boys and girls, I’m acutely aware that I owe you a podgram and a new blessay. It’s been weeks and possibly months since I last offered you anything. The thing is, I’ve just returned from America, having finished an epic documentary series on every single state. Having arrived back in Britain, I […]"
full_description = "The BBC and the future of broadcasting 18th June 2008 Stephen Fry Ladies and gentleman, boys and girls, I’m acutely aware that I owe you a podgram and a new blessay. It’s been weeks and possibly months since I last offered you anything. The thing is, I’ve just returned from America, having finished an epic documentary series on every single state. Having arrived back in Britain, I have hit the ground running and have spent the past eight weeks writing a book on the series plus I’ve been filming a new series of QI here in London. In the meantime I gave a speech about the BBC and the future of broadcasting recently and for the moment, what I spoke about is all I can offer you. Please stay tuned for in the coming weeks I will have a new podgram plus news on exciting developments for the next version of Stephenfry.com. The Future of Public Service Broadcasting Some thoughts Stephen Fry Before I can even think to presume to dare to begin to expatiate on what sort of an organism I think the British Broadcasting Corporation should be, where I think the BBC should be going, how I think it and other British networks should be funded, what sort of programmes it should make, develop and screen and what range of pastries should be made available in its cafés and how much to the last penny it should pay its talent, before any of that, I ought I think in justice to run around the games field a couple of times puffing out a kind of “The BBC and Me” mini-biography, for like many of my age, weight and shoe size, the BBC is deeply stitched into my being and it is important for me as well as for you, to understand just how much. Only then can we judge the sense, value or otherwise of what I am saying. It all began with sitting under my mother’s chair aged 2 as she (teaching history at the time) marked essays. It was then that the Archers theme tune first penetrated my brain, never to leave. The voices of Franklin Engelman going Down Your Way, the women of the Petticoat Line, the panellists of Twenty Questions, Many A Slip, My Word and My Music, all these solid middle class Radio 4 (or rather Home Service at first) personalities populated my world. As I visited other people’s houses and, aged 7 by now, took my own solid state transistor radio off to boarding school with me, I was made aware of The Light Programme, now Radio 2, and Sparky’s Magic Piano, Puff the Magic Dragon and Nelly the Elephant, I also began a lifelong devotion to radio comedy as Round The Horne, The Clithero Kid, I’m Sorry I’ll Read That Again, Just A Minute, The Men from The Ministry and Week Ending all made themselves known to me. This was a world in which the BBC had a cosy and almost complete monopoly of radio. There were things called pirate radio ships, about which Richard Curtis has just written a feature film I believe, and these gave rise to Radio 1 and a whole generation of disk jockeys, but this was pop music, something that frightened and upset me then and frightens and upsets me now. That’s not generational, I’m from an entirely pop-literate, pop-loving generation, it is personal. For me comedy was all I wanted, whether in the surreal world of Goon Show reruns, the insinuendo-laden filth of Kenneths Williams and Horne, or in the grown up wit of Frank Muir and Dennis Norden. Many of the names that meant so much to me are now all but forgotten by the general public: Steve Race, Ian Wallace, Anthony Quinton, John Ebden, James Cameron, Kenneth Robinson. And in the past few years a cruel swathe has been cut through the once lush grass of great radio personalities: Alastair Cooke, Linda Smith, John Peel, David Hatch, Ned Sherrin, Alan Coren and finally, I was only yesterday at the funeral of the great Humphrey Lyttleton. Maybe this cruel swathe will be used as an excuse radically to reinvent radio. Radio 4 in particular is radically reinvented every five years or so, fortunately with no result whatever. Radical reinvention is not something that comes naturally to the British institutional mind. Indeed if you have an institutional mind, a change of stationery is seismic and upsetting enough to qualify as root and branch restructuring. Thus, altering the time slot of Woman’s Hour, allowing Gardeners’ Question Time to be independently produced and other such cosmic storms have constituted the radical and fundamental changes to Radio 4 that have allowed it slowly to evolve over the decades, matching and paralleling its core audience and providing a service so incomparable in its variety and quality as to be an actual reason for some to live in Britain. But it is ‘only’ radio: necessary to its survival has been the fact that the Associated Press, media tycoons and the political classes don’t care that much about it. Thus it has thrived. Thriven. Throven. Bethrived. I have to turn now to TV. I may have grown up just as the Golden Age of Radio had passed, but the Golden Age of Television, that grew with me. When I was 7 my parents moved house. Well, we all moved house as a family, I don’t mean my parents left me behind, though who would blame them if they had? We owned, in those days, a television that disguised itself as a mahogany drinks cabinet, in the way they did – and they were never called just televisions, by the way, they were television sets. This one’s screen was, of course, black and white, it boasted one channel, the BBC (what we’d now call BBC1) and had a knurled volume knob in dark brown Bakelite. The set smelled the way dust always did when it was cooked on Mullard valves as they warmed up. It slid about on castors and had doors that closed with a satisfactory snick as a ball bearing rolled into its slots to secure it. The week before we moved, the BBC started a new drama, starring William Hartnell. An old man, whose name appeared to be Grandfather or the Doctor, had a police phone box of the kind we saw in the street all the time in those days. It turned out to be a magical and unimaginably wonderful time machine. My brother and I watched this drama in complete amazement. The first ever episode of Doctor Who. I had never been so excited in all my life. A whole week to wait to watch the next instalment. Never have seven days crawled so slowly by, for all that they involved a complicated house move from Buckinghamshire to Norfolk. A week later, in that new house, my brother and I turned on the good old television set in its new sitting room, ready to watch Episode 2. The TV had been damaged in transit and was never to work again. We missed that episode and nothing that has transpired in my life since has ever, or could ever, make up for that terrible, terrible disappointment. There is an empty space inside me that can never be filled. It is amazing neither of us were turned into psychopathic serial killers from that moment. The years passed and brought with them for children Blue Peter, every Oliver Postgate from Noggin the Nog to Ivor the Engine by the way of the Clangers and Bagpuss. Mr Benn, Play School, Play Away, Rent-a-Ghost, Grange Hill and the Multi Coloured Swap Shop. How lucky our generation was. How spoiled. ITV played its part, of course it did, with Magpie and How and much else. This was a period of revolutionary drama from directors and writers such as Alan Clarke, David Mercer, Kenneth Loach, Mike Leigh, Alan Plater, Michael Apted, Stephen Frears, Dennis Potter. Play of the Month, Play of the Week, Play for Today. Cathy Come Home, Edna The Inebriate Woman, Pennies From Heaven, I Claudius, Tinker Tailor. Popular drama from Z Cars to Colditz. And comedy: Peter Cook and Dudley Moore, Monty Python, Up Pompeii, The Goodies, Dad’s Army, Dick Emery, Morecambe and Wise, The Likely Lads, The Two Ronnies, Porridge, Reggie Perrin, Fawlty Towers. … ITV gave us Rising Damp, and those definite article ITC adventures from Monty Berman and Dennis Spooner: The Avengers, The Champions, The Adventurer, The Baron, Man in a Suitcase, The Prisoner, The Persuaders, The Protectors and of course The Sweeney and The Professionals. And during this time BBC 2 had arrived and with it Civilisation, The Ascent of Man and the full realisation of its first controller, David Attenborough, as the world’s natural historian. A succession of progressive, imaginative, tolerant, liberal in the loosest sense, and amiably hands-off TV executives from those legendary BBC Chairmen, Hugh Carleton-Greene and Lord Hill, downwards had created, or presided over, a cultural revolution of astounding depth, variety, imagination and dynamism. And then, just as I was leaving prison, starting simultaneously my period on probation and at University, the way you do, the wind changed and Margaret Thatcher, the new Mary Poppins, descended into Downing Street, with new medicines for us to take, but very few spoonfuls of sugar to help them go down. I am not going to blame her or make political points. The wind had changed and she blew in with it and would one day be blown away by another change. But here she was and fundamental questions were asked, genuinely radical unthinkable thoughts were thought in an age of privatisation and anti-dirigiste, anti-statist conservatism. The first few years of that long administration in fact changed nothing. Her government was busy with a terrible recession and the Falklands war, fighting miners, that kind of thing. During exactly this time, I left University and began on what, for want of a better word, I shall call my career. Comedy was my point of entry into television. Comedy had been my rock and roll as a child and now I was allowed to do it for a living. There is an argument that comedy is a greater public service than any other genre of art or culture: it heals divisions, it is a balm for hurt minds, it binds social wounds, exposes real truths about how life is really led. Comedy connects. The history of BBC comedy in particular is almost a register of character types, a social history of the country. Hancock, Steptoe, Mainwaring, Alf Garnett, Basil Fawlty, Baldrick, Victor Meldrew, Alan Partridge, Ali G, David Brent, the matchlessly great General Melchett – it is much harder to list character types from serious drama who have so penetrated the consciousness of the nation and so closely defined the aspirations and failures of successive generations. A public service broadcasting without comedy, is in danger of being regarded as no more than a dumping ground for worthiness. Seriousness is no more a guarantee of truth, insight, authenticity or probity than humour is a guarantee of superficiality and stupidity. Angels can fly because they take themselves lightly. Meanwhile, back to history, for a moment. What was happening to broadcasting during the time I was cutting my comedy teeth? In drama, the word “play” had been all but banned. It was Film Four and Screen Two. The multi camera studio drama, such as I Claudius, had become a thing of the past, the way led by Brideshead and other single camera filmed pieces. ‘Yoof’ TV made an appearance thanks to Planet 24 and Janet Street-Porter and the Peacock Report appeared. The Peacock Report, referred to by broadcast professionals in that way they have, as Peacock, came less than ten years after the Annan Report, which the great Noel, Lord Annan had submitted to parliament in 1977. Annan had been the first to detect a caterpillar in the perfect garden salad of the BBC’s golden age. He thought television as run by ITV and the BBC needed a shake up, it lacked a kind of diversity, plurality and edge, all happily unfamiliar words in those days. For the first time the founding Reithian tenets of authoritative patriarchal broadcasting were challenged: the de haut en bas principle in which the educated producer, presenter, writer knew what was good for the country and for the audience was under fire. The first and most direct result was Channel 4 three or four years later, specifically charged to speak for minorities and sections of society who did not want to be spoon-fed by the supercilious educated classes. The arts and documentaries, drama and comedy were still presented but in a kind of punked up style, all attitude and in-yer-face. TV went from Oxbridge to concrete, missing out red brick altogether. But the words ‘radical’ and ‘reform’ meant something quite different to a new and ideologically fired government and so in 1986 a new report emerged: Peacock. Here was a report that really delivered a blow to the BBC’s solar plexus. Peacock began to foresee the possibility of digital diversity on an unimagined scale, it also put forward the ideas of a consumer-led, market driven broadcasting world, one in which the very principles of a licence fee funded public service broadcasting system would naturally be seen as obsolete. This suited the tenor of the times: deregulation, privatisation and a rigorous dismantling of the frontiers of the state – it was happening in the city and in industry and the utilities, why not broadcasting? The BBC, long seen as harbouring tendencies and personnel that were socialistic at best, Marxist at worst, was suddenly no longer a secure and unassailable acropolis. It was no secret that Norman Tebbit and some of the more fundamentalist free-marketeers and red-baiters of the administration would have been very happy indeed to dismantle the entire structure of the BBC. Peacock prevaricated and the charter appeared safe, but at a great price. Nothing would ever be the same again, the old certainties were dead and the harsh realities of capitalism arrived at Wood Lane and Portland Place. Whole departments were razed and working practices abolished, and something called an internal market was put in place. Radio Times was outsourced, the permanent make-up staff went, engineers, editors and set-designers were suddenly out of a job. Twenty-five percent of the BBC’s output was commanded to be produced from outside sources and a whole new independent sector was born. Companies like Hat Trick and Talk Back achieved almost instant success. Peter Bazalgette, who had been a typical BBC producer, starting life as a That’s Life researcher, then making Food and Drink and other such innocent programmes, started on the path that would lead him to Endemol and unimagined reach and riches. Men and women who had spent their whole lives dreaming up formats and broadcasting ideas as part of their job, suddenly had those ideas outside BBC premises, in their own time, because producers could now become entrepreneurs. There was money to be made and such a thing as loyalty to this new BBC was now a preposterous idea. The smell of Hugh Wheldon’s pipe smoke and tweed was finally expelled from every office, every corridor and every meeting room in the BBC. But at least the charter was safe, the licence fee was safe and the radio stations and the World Service and the general face and form of the BBC were safe and familiar. There was still Blue Peter and the Cup Final and Only Fools and Horses. The spinning globe and"
