["https://www.stephenfry.com/2017/05/the-way-ahead"]
title = "The Way Ahead - Official site of Stephen Fry"
description = "The comparison seems rather good, don’t you think? If Gutenberg’s revolution was Pandora 2.0 and the Industrial Revolution 3.0 then the information age is Pandora 4.0."
full_description = "The Way Ahead 29th May 2017 Stephen Fry Transcript of lecture delivered on the 28th May 2017 • Hay Festival, Hay-on-Wye Peter Florence, the supremo of this great literary festival, asked me some months ago if I might, as part of Hay’s celebration of the five hundredth anniversary of Martin Luther’s kickstarting of the reformation, suggest a reform of the internet. Firstly let me say that, despite a lifetime immersing myself in what I consider the provoking, beguiling, bewitching and often befuddling joy of technological development, especially in the realm of information technology, networking and shiny digital devices, I am no computer scientist, coder or programmer. Many people, some of them no doubt here in this tent now, will know much more about the subject I’m going to discourse upon. Take this, if you take it all, as the offering of a curious mind, curious in both sense, avid for information and just plain odd. You will be relieved to know, that unlike Martin Luther, I do not have a full 95 theses to nail to the door, or in Hay’s case, to the tent flap. It might be worth reminding ourselves perhaps, however, of the great excitements of the early 16th century. I do not think it is a coincidence that Luther grew up as one of the very first generation to have access to printed books, much as some of you may have children who were the first to grow up with access to e-books, to iPads and to the internet. Johannes Gutenberg’s great project, his Bible, bore fruit in 1455 – perhaps 120 or so copies on paper and 60 on vellum, calfskin – but Gutenberg had in fact already given this new art of moveable metal type printing a trial run, a proof of concept, in the production of hundreds, perhaps thousands, of Papal indulgences. An indulgence was a piece of paper, signed and sealed by the Vatican. Whoever could afford such a holy ticket could buy it and be … well, indulged. They could, in effect, sin – up to and including the face value of the indulgence they bore, which held good, officially for no more than 40 years, but indulgences were soon produced with expiry dates of 20,000 and in a few recorded cases 45,000 years, allowing the lucky purchaser to go straight to paradise without passing purgatory. Just as you can buy carbon credit now, so you could buy this Vatican vice voucher, a sin offset document. The Church originally had their monks and clerks write these by hand, but then, thanks to Gutenberg, they had thousands of them printed at a fraction of the cost, to raise money for, amongst other things the completion of St Peter’s in Rome but also – as Luther noted – for the lining of individual pockets and the filling of personal coffers. It was this venal and corrupt practice that led Luther to proclaim his 95 theses. The technology then had intensified the corruption, but it was that same technology that was to spread the word of Luther’s protest and prime the pump of the Protestant reformation. This always seems to be the way with technological innovation. As much as it is a vector of negative disruption – corruption indeed – it is also the vector of progress and improvement. In 1450 there were no printed books in the world, by 1500 there were millions. Printing itself was and is morally and doctrinally neutral, without positive or negative valency per se: it could as well be used for the dissemination of official catholic propaganda (to use the Vatican’s own word) as it could be used for the transmission of what the church would consider subversive or heretical material. This held true over the centuries. Printing frustrated the church on the one hand – they had Diderot imprisoned for recruiting scholars and contributors to his great Encyclopédie, a project that attempted to describe the world in enlightenment and scientific terms – but on the other, printing allowed the propagation of printed bibles for missions around all the newly colonised corners of the world, spreading the power, reach and authority of the Holy See. It is worth remembering this point: the technology itself is neutral. Gutenberg’s printing revolution, by way of Das Kapital and Mein Kampf, by way of smashed samizdat presses in pre-Revolutionary Russia, by way of The Origin of Species and the Protocols of the Elders of Zion, by way of the rolling offset lithos of Fleet Street, Dickens, Joyce, J. K. Rowling, Mao’s Little Red Book and Hallmark greetings cards brought us to the world into which all of us were born, it brought us, amongst other things – quite literally – here to Hay-on-Wye. I started coming to this great festival before the word Kindle had a technological meaning, when an “e-book” might be a survey of 90s Rave drug Culture, or possibly an Ian McMillan glossary of Yorkshire Dialect. Printed books haven’t gone away, indeed, we are most of us I suspect, pleased to learn how much they have come roaring back, in parallel with vinyl records and other instances of analogue refusal to die. But the difference between an ebook and a printed book is as nothing when set beside the influence of digital technology as a whole on the public weal, international polity and the destiny of our species. It has embedded itself in our lives with enormous speed. If you are not at the very least anxious about that, then perhaps you have not quite understood how dependent we are in every aspect of our lives – personal, professional, health, wealth, transport, nutrition, prosperity, mind, body and spirit. The great Canadian Marshall McLuhan –– philosopher should one call him? – whose prophetic soul seems more and more amazing with each passing year, gave us the phrase the ‘Global Village’ to describe the post-printing age that he already saw coming back in the 1950s. Where the Printing Age had ‘fragmented the psyche’ as he put it, the Global Village – whose internal tensions exist in the paradoxical nature of the phrase itself: both Global and a village – this would tribalise us, he thought and actually regress us to a second oral age. Writing in 1962, before even ARPANET, the ancestor of the internet existed, this is how he forecasts the electronic age which he thinks will change human cognition and behaviour:- “Instead of tending towards a vast Alexandrian library the world will become a computer, an electronic brain, exactly as in an infantile piece of science fiction. And as our senses go outside us, Big Brother goes inside. So, unless aware of this dynamic, we shall at once move into a phase of panic terrors, exactly befitting a small world of tribal drums, total interdependence, and superimposed co-existence. […] Terror is the normal state of any oral society, for in it everything affects everything all the time. […] In our long striving to recover for the Western world a unity of sensibility and of thought and feeling we have no more been prepared to accept the tribal consequences of such unity than we were ready for the fragmentation of the human psyche by print culture”. Like much of McLuhan’s writing, densely packed with complex ideas as they are, this repays far more study and unpicking than would be appropriate here, but I think we might all agree that we have arrived at that “phase of panic terrors” he foresaw. Let me suggest a few of the anxieties we feel about the digital world today: Aside from the ugliness and ferocity of trolling on social media, we fret over the so-called post-truth age, with its arguments over what is ‘fake news’ and what are ‘alternative facts’ and the concomitant diminution of trust in any authoritative source of information, or consensus as to the validity and credibility of news and current events at all. The refusal of social media platforms to take responsibility for those dangerous, fake, defamatory, inflammatory and fake items whose effects would have legal consequences for traditional printed or broadcast media but which they can escape. The rise of big data and one’s personal footprint of analytics, spending and preferences, becoming, willy nilly, corporate property. The ever present threat to our privacy that this involves concerns us. Everyone we know, everything we read, watch, listen to, eat, everything we desire and perhaps every electronic message we send – all readable by a corporation or a government. The unfair non-contractual working practices afoot in the so-called Gig Economy – Uber Drivers, delivery couriers and so on. Not to mention the effect of those services on the pre-existing workforce of cab-drivers and others whose hard won qualifications might be set at nought. The ghettoisation of opinion and identity, known as the filter bubble, apportioning us narrow sources of information that accord with our pre-existing views, giving a whole new power to cognitive bias, entrenching us in our political and social beliefs, ever widening the canyon between us and those who disagree with us. And the more the canyon widens, the farther away the other side and the less likely we are to hear or see what goes on there, intensifying the problem and always at the super new speeds this digital new world confers. The threats to personal, national and transnational security – threats emanating from ‘bad actors’ that might be cyber-extortionists, unscrupulous corporations, unfriendly foreign powers, intrusive domestic governments and their agencies. The threat to the young of grooming that leads to abuse, or of recruitment that leads to extremist and violent ideologies and actions. Algorithms continue every microsecond to harvest data of my movements, by GPS for example, analyse my actions, read my gmail, build up information on my mood, sexuality, political, religious and cultural affiliations, habits and propensities – such data is for sale … Bullying – especially of the young. Body shaming. Blackmail. Extortion. Revenge porn. On-air suicides, encouragements to self-harm and live-streamed violence. The corporate assault on net neutrality. The fragile security of our entire digital world and the ever-present looming possibility of a Big One, that cataclysm brought about either by malice, act of war, systemic technical failure, or some other unforeseen cause, an extinction level event which will obliterate our title deeds, eliminate our personal records, annul our bank accounts and life savings, delete all the archives and accumulated data of our existences and create a kind of digital winter for humankind. These are some of the things that rightly worry us. An example of every one of them can be found almost daily in a story on-line or in the mainstream so called dead tree media. All of them individually, or in a potential catastrophic avalanche, threaten to engulf us. One thesis I could immediately nail up to the tent flap is to join in the call for aggregating news entities like Facebook to be legally classified as publishers. At the moment they are evading responsibility for their content because they can claim to be ‘platforms’ rather than publishers. Given that they are the main source of news for over 80% of the population that is clearly an absurd anomaly. If they and Twitter and like platforms recognise their responsibility as publishers it will certainly help them better police their content for unacceptable libels, defamations, threats and other horrors that a free but legally bound press would as a matter of course be expected to control. But that correction of the legal standing and responsibility of social media platforms is almost certainly going to happen and soon, and is, frankly, small potatoes – as, to some extent, are the other anxieties I’ve outlined. For there is so more, so much more coming – as they say in America – down the pike. Some huge potatoes are looming on the horizon. First, let’s just take time to remember how it all came about. I bought my first computer in 1982. We early adopters were like pioneer motorists in the first age of the internal combustion engine. You couldn’t feasibly drive a car without knowing how the engine worked. Every mile or so you had to, in the words of a popular song of the time, get out and get under your automobile, you had to tweak the magneto and adjust the carburettor and so on. And now? Now you never have to look at the engine from one year to another. All you have to know is how to negotiate the traffic. Just like computers and networking. No need now to know how to program, how to write an Interslip modem script or tweak your subnet mask. All you have to know is how to drive the thing such that you can get where you want to get safely and reliably. Now of course, with both cars and computer networking, the highways are clogged, one-way systems everywhere, streets are blocked, advertising hoardings deface the roadside, toll roads are in operation, car thieves patrol your area, speed traps, parking fees and towing away blights your life and traffic is a nightmare. Back then, ah the joys of the open road, you may have looked silly in your goggles and acoustic couplers, but what bliss it was in that dawn to be alive and to be young was very heaven. Just as when cars were slow, so when modems were slow, traffic was light and the illusion was of speed. In the 1980s I joined Prestel and CIX, text based bulletin boards and information exchanges, then CompuServe an online service that allowed GIF in the 80s then finally Demon Internet allowing me to be a cybernaut. I literally did not know a single other human being who was on the net. I felt like the only person in Britain with a tennis racket. Not much chance of a game. But I got to know people from other countries as we swapped emails and techniques for getting in and out of university servers. There was no world wide web at this point. There were search engines like Veronica, JANET, WAIS, the Gopher project, telnet, irc, ftp etc etc. A world, as ever, of initials and acronyms. Commercial online services like CompuServe and AOL began to grow and offer their paid customers ‘ramps’ onto the true wild west of the internet. Then came Tim Berners Lee’s invention, the worldwide web and the arrival of the first browsers, Mosaic and then Netscape. It was the early days of portals, reliable feature-rich, for their time, home page gateways. Excite, Lycos, Prodigy, Alta Vista, Earthlink, Yahoo, Ask Jeeves were the big portal and search engine names. The rise of AOL seemed permanent and unstoppable. Every shop counter had piles of their introductory CDs, every glossy magazine had them taped to their cover. They were so big, they became the lead name in the giant media corporation they created, AOL Time Warner, which now embarrassedly hides the name AOL and pretends they don’t exist, from hot hot hot to icy cold in less than a decade. To have an AOL or hotmail email address is now so uncool it’s probably retro-cool again. In the mid-90s I did a film Wilde, first movie to end credits with a URL – if you watch the last screen says www.oscarwilde.com (since expired). That year an outfit called Google arrived with a "
