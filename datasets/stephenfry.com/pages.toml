full_description = 'TROY – Best Seller 13th October 2020 Administrator The siege of Troy is perhaps the most well-known tale in Western literature. Retold by Stephen Fry this autumn in all its passion and tragedy, Troy will be the third volume of his unforgettable and definitive series, following on from the bestselling Mythos and Heroes. In Troy, Stephen Fry takes the reader into the heart of a story both mythical and grounded in history. It is Zeus, king of the gods, who triggers war when he asks the Trojan prince Paris to judge the fairest goddess of them all. Aphrodite bribes Paris with the hand of Helen, wife of King Menelaus of the Greeks. A terrible, brutal war ensues, and the stage is set for the oldest and greatest story ever told. ‘The tale of Troy is the Big Bang of story-telling. Every story that came afterwards contains fragments of its incredible mixture of drama, tension, romance, betrayal, cunning, magic, violence, comedy, revenge, wonder, beauty, sacrifice, sorrow and triumph. The original epic, and still the best. I’ve loved it since I first heard about the matchless Helen of Troy, the noble Hector, the glorious Achilles and the cunning Odysseus. Retelling the story, getting to know the personalities, twists and divine interventions and immersing myself in the wildly exciting blend of myth, legend and real history has been one of the most completely enjoyable experiences I’ve ever had. I hope you get as much pleasure from reading it.’ x Stephen Fry This title will be released on the 29th October 2020 in hardback, audiobook and eBook Advertisement googletag.cmd.push(function() { googletag.display("div-gpt-ad-1407842938698-0"); }); 40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […]'
