title = "Don’t Mind Your Language… - Official site of Stephen Fry"
description = "Language. Language, language, language. In the end it all comes down to language. I write to you today on this subject as a way of welcoming you to www.stephenfry.com 2.0 and because, well, it’s a subject worth thinking about at any time and because fewer things interest me quite so much. Image: Nicole Stewart for […]"
full_description = "Don’t Mind Your Language… 4th November 2008 Stephen Fry Language. Language, language, language. In the end it all comes down to language. I write to you today on this subject as a way of welcoming you to www.stephenfry.com 2.0 and because, well, it’s a subject worth thinking about at any time and because fewer things interest me quite so much. Image: Nicole Stewart for SamFry There are so many questions and issues jostling, tumbling and colliding in my mind that I can barely list them. Is language the father of thought? There’s one. Somebody once said, “How can I tell you what I think until I’ve heard what I’m going to say?” Is language being degraded, is it not what it was? Is there a right way to express yourself and a wrong? Grammar, does that exist, or is it a pedantic imposition, a kind of unnatural mixture of strangulation and straightening, like pleaching, pollarding and training pear-trees against a wall? Can we translate from one tongue into another without irreparable loss? And many, many more. “Language is the universal whore that I must make into a virgin,” wrote Karl Kraus or somebody so like him that it makes no odds. One of my favourite remarks. T. S. Eliot said much the same thing in a different way: “to purify the dialect of the tribe”. But is there a “higher language”, a purer language, a proper language, a right language? Is language a whore, used, bruised and abused by every john in the street … is the idea of purifying the dialect of the tribe a poetic ideal or nonsensical snobbery? I suppose we should remind ourselves of the old distinction made by the structuralists and structural linguists. I wrote a sketch about this years and years ago and if you know it, you’ll have to forgive the similarities between what I found to be a source of humour and what I am now apparently taking seriously. Actually the one doesn’t cancel out or refute the other. We can make fun of this kind of language about language and we can value it too. So bearing in mind that I am fully aware that I sound like the worst kind of pseudo-intellectual twazzock, let’s look at that distinction. There is language, the thing itself, the idea of language. And then there is this or that example of language in praxis, in use. There is Chess and there is this or that game of chess. The Game of Chess and that game of chess going on over there. There is language, the human capacity – ‘competence’ as Chomsky calls it, The Game of Language – and there is utterance, the actual instance of its use – this sentence for example. Of course aside from both of these, there is the local tongue, English, French, Cantonese, Basque, whatever. The two for consideration however as those once fashionable Frenchies designated them are Langue, language as an idea, and parole, language as utterance. In this instance of parole I am using not only English, but my own brand of English, an English English salted, spiced, pickled, seasoned, braised and plated up to you bearing all the flavours of my class, gender, education and nature, discourses as you might call them. I am in some sort a language professional I suppose, in as much as I write and broadcast, I linguify for a living you might say. Nonetheless, I can no more change my language and the sum of its discourses than I can add a cubit to my height or, sadly it seems, take a pound from my weight. Well, perhaps that’s going a little far. I can attempt to disguise my language, I can dress it up into even more elaborate and grandiose orotundity, prolixity and self-consciousness, Will Self-consciousness you might say, or I could dress it down into something stripped. Stark. Bare. Simple. It would be hard to dress it down into something raggedly demotic without it being a patronising pastiche of a street argot to which I quite evidently have no access and in whose mazy slang avenues I would soon get lost, innit? In a sense I am typecast linguistically and although I can for fun try on all kinds of brogues and dialect clothes, my voice, my style, my language is as distinctive as my fingerprints. My language (as the sum of my discourses, as linguistic strata that betray my history, as geology or archaeology betrays history) is my language and it is a piece of who I am, perhaps even the defining piece. In my case it is in part a classical ruin, inherited boulders of Tacitus and Cicero bleaching in the sun along with grass-overrun elements of Thucydides and Aeschylus … not because I was a classical scholar, but because I was taught by classical scholars and grew up on poets, dramatists and novelists who knew the classics as intimately as most people of my generation know the Beatles and the Stones. Without knowing it therefore, heroic Ciceronian clausulae and elaborate Tacitan litotes can always be found in the English of people like me. In part classical ruin, then, my language in particular has also mixed in it elements of my three Ws, my particular world wide web, my w.w.w, Wodehouse, Waugh and Wilde, three writers who greatly excited my imagination and stimulated my language glands like no other. I would add Vivian Stanshall of the Bonzo Dog Doo Dah Band, Peter Cook and Alan Bennett as others of whom I am consciously aware. But the language of British movies, classic novels, sixties and seventies broadcasters like Malcolm Muggeridge, James Cameron, Alistair Cooke, John Ebden, Anthony Quinton, Robert Robinson, they all played their part in informing my spoken and written utterance too, not to mention the elemental styles which in turn informed their language. As Henry Higgins reminds us in Pygmalion, English is for all of us the language of Shakespeare, Milton and the Bible. We unconsciously use the tropes, tricks and figures of our great writers, just as we might without knowing it use a tierce de Picardie or a diminished seventh when humming in the shower. And to our native English today we have added the language of American sitcom and drama, American movies and Australian soap operas. I’ve used this analogy before, but I’ll use it again. Think of London. Some of its outline was determined by the Romans who conquered it two thousand years ago, since then atop the ruins of the Roman, Saxon, Dark Age and Norman London was constructed a medieval city of winding streets, jostling half-timbered mansions and soaring stone cathedrals and churches. Then came, after the Tudor and Jacobean palaces and halls and after the restoration a period of renewed classical elements, the squares and avenues of Georgian and Regency London, elegant, spacious and harmonious. The Victorians brought long suburban streets, warehouses, libraries, schools, town halls and railway stations and in the twentieth century arrived a new architecture, office towers, corporate headquarters, airports, housing projects in glass and concrete, American and European statements of self conscious modernity, statehood, brutalism, socialism, capitalism and democracy. It isn’t I think, too much of a strain to see the history of our language in similar terms. A long sticky flypaper onto which at varying times of their importance the church, royalty, aristocracy, industry, commerce and international entertainment have accreted themselves. Saxon and Roman elements overlaid with the Norman French and Chaucerian and Church medieval English. A great renaissance of Shakespeare, the Bible of King James, Milton and Dryden leading into the classical English of Johnson and Pope. The Victorian English of industry, Dickens and music hall giving way to the English of the twentieth century, all the way through the arrival of radio and cinema, the political language of fascism, communism, socialism and finance, the Americanisms, the street talk, the rock and roll, the corporate speak, the computer jargon … and here we are. Glass and concrete sentences right next to half-timbered Elizabethan phrases, a Starbucks of an utterance dwelling in an expression that once belonged to a Victorian banker, an Apple Store of an accent in a converted Georgian merchant’s lingo. You get the point. Whether or not we are aware of the difference between a transitive verb and a preposition, a verb and a vowel, we are willy-nilly, heirs to Marlowe and Swift, just as that new Waitrose is a descendant (albeit a bastard one) of the Parthenon. Bear in mind that phrase willy-nilly, by the way – I shall return to it later. For the meantime, seal it in a baggie and stash it in your hoodie. Or fold it in scented tissue and lay it tenderly in your hope chest, according to taste. I’ve mentioned those French intellectuals the structuralists: one of their number, perhaps the best known, Roland Barthes, liked to use two words jouissance and plaisir. Le plaisir du texte. The pleasure of the text. Those who think structuralism spelt or spelled death to conscious art and such bourgeois comforts as style, accomplishment and enjoyment might be surprised that the pleasure of the text, the jouissance, the juicy joy of language, was important to Roland and his followers. Only to a dullard is language a means of communication and nothing more. It would be like saying sex is a means of reproduction and no more and food a means of fuelling and no more. In life you have to explain wine. You have to explain cheese. You have to explain love. You can’t, but you have to try, or if not try you have, surely, to be aware of the astonishing fact of them. We would never notice if the fat and protein rich food with which cows, ewes and nanny goats suckled their young could not be converted to another, firmer foodstuff that went well with crackers and grapes. We wouldn’t go about the place moaning that sheep’s milk was only of any use to lambs, any more than I have ever heard anyone wonder why pig’s milk doesn’t make a good yoghurt. In fact if you suggest drinking pig’s milk or horse’s milk, people look askance and go “yeurgh!” as if it’s the oddest suggestion they’ve ever heard. We take what nature and custom have led us to accept. As Eddie Izzard pointed out, it’s odd that bees make honey: ‘after all,’ he said, ‘earwigs don’t make chutney.’ And take that arbitrary fruit, the grape: suppose grapes didn’t uniquely transmogrify themselves, without the addition of sugar, into a drink of almost infinite complexity? We wouldn’t wonder at the lack of such a thing as wine in the world, any more than we wonder that raspberry wine (despite the deliciousness of raspberries as fruit) can’t, in the proper sense, exist or speculate on why the eggs of carp aren’t as good to eat as the eggs of sturgeon. But every now and again we should surely celebrate the fact that caviar is so fine, that the grape offers itself up so uniquely, that milk products of three or four species have such versatile by-products for us, that the grain of some grasses can be transformed into bread, that the berry, pod or leaf of this plant or that plant can give us chocolate, coffee or tea, and that while the fuzz of this plant can’t go to make a shirt, the fuzz of that unique one canand the thread of this insect can go to make a tie, while the equally impressive thread, in nature, of that other insect can’t be spun into the simplest handkerchief. Is it weird that silkworms exist or is it weird that only the silkworm will do when it comes to silk and only the cotton plant when it comes to cotton? To put it again, in an accidental line of decasyllabic verse, ‘none would be missed if they didn’t exist’. And if language didn’t elicit pleasure, if it didn’t have its music, its juiciness or jouissance would we notice, or would always be destined to find pleasure in it because that’s a thing we humans can do? Out of the way we move we can make dance, out of the way we speak we can make poetry and oratory and comedy and all kinds of verbal enchantments. Cheese is real, and so it seems, is the pleasure of the text. I’m veering all over the shop. We’ll return to pleasure later. Steven Pinker, the Harvard Professor who writes on psycholinguistics and the evolutionary development of language and the mind, has made quite a tidy living out of popularising what you might call Chomskian ideas. Noam Chomsky may be better known now for his penetrating critiques of American foreign policy, but he made his reputation as a pioneering linguist. His discovery (or theorem if you prefer) was that the mind comes pre-equipped for language, syntax and grammar, much as the body comes pre-equipped for growth and sexual development. A baby doesn’t have underarm hair, but it has the innate program within it which, at a certain age, usually between twelve and fourteen, will be activated to start producing hair under the arms: a parent doesn’t have to teach it, only the right and natural nutrients need to have been ingested over time so as to allow normal growth and it will just happen. So it is, argue the Chomskians, with language: each baby (given normal development) has an innate language faculty, a language instinct Pinker calls it: local differences between Chinese and English are not, according to this theory, so very profound. A parent doesn’t teach language, much as they may think they do, they just occasionally spoon-feed a bit of vocabulary: moo-cow, baa-lamb, colours and so on, usually – you’ll never hear a parent say “and these are called ‘stairs’ or ‘to wash’ means ‘to clean with water’” – the child absorbs that kind of vocabulary without teaching. The really clever bits, the structure and lexical rules … these no parent can teach because it’s highly unlikely they will even be aware of them. You do not say to an English child: “the aorist of ‘to see’ is ‘saw’ the perfect is ‘have seen’”. You don’t even tell them that to give a sense of the past you add ‘-ed’ to the end of the verb. ‘I play,’ ‘I played’. Many parents will not know what a verb is, nor will they need to, any more than you need to know what an alternator is to drive to the shops or, more pertinently, any more than you need to know what a bronchial tree or alveoli are in order to breathe. This may sound obvious to us all, language as a natural, evolved innate faculty; after all, the theory has been understood and mostly accepted for forty or so years, but if you look back over the history of linguistics to beyond the time such a word even existed, over the shoulders of Saussure, Jakobson and the Brothers Grimm to the earliest philologists and language investigators, there was no obvious reason to suppose that language was innate. Or at least not innate in that way. Many believed, quite seriously, that the Biblical explanation in the story of the Tower of Babel was the true answer to the riddle of language, just as they believed in the Flood and the Creation. Others thought that there was a ‘natural’ language, a primary tongue. Some suggested that it was Latin, others, out of religiosity, that it must be Hebrew, Greek or Aramaic. They went so far, under the patronage of bishops and monarchs who took an interest in the "
