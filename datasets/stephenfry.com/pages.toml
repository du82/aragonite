title = "Techblog Archives - Official site of Stephen Fry"
full_description = "Apple Hit Successive Sixes 17th September 2014 Stephen Fry Since January 1984 when I bought my first Apple Macintosh, through the dark late 80s and mid 90s when the company had all but 3% of the personal computer market, I have developed the thickest of skins when it comes to Apple-haters. Mac at 30 24th January 2014 Stephen Fry What cannot be denied is that the first Macintosh changed my life completely. It made me want to write, I couldn’t wait to get to it every morning. The Fire Question 31st January 2013 Stephen Fry It’s very simple. I have a Samsung Galaxy III, a BlackBerry Z10 , an iPhone 5, an HTC Windows 8x and an LG Nexus 4. More or less the smartest soldiers in the smartphone army. Four and Half Years On 3rd April 2012 Stephen Fry Four and a Half Years On People often come up to me in the street and say, “Stephen, why don’t you pop some clothes on, there’s a good fellow.” Another thing they will ask is, “How many phones have you got with you today?” And it’s that second common question we’re going to concentrate on […] Smartphones Arms Race 1st December 2011 Stephen Fry For some weeks now my jacket pockets have been bulging in an unsightly manner as I have gone about the world with a BlackBerry Bold 9900, two HTC Android handsets, the “Rhyme” and the “Sensation XL with Beats Audio” and the all new Nokia Lumia 800 running Windows for Mobiles 7.5 “Mango”. iPhone 4S 12th October 2011 Stephen Fry Apple‘s loss last week was enormous. I wrote all that I felt I could in the blog farewell on this website to a man I was lucky enough to know a little and admire a great deal. Most are probably now profoundly sick of hearing either how much he was under or overestimated as a […] Steve Jobs 6th October 2011 Stephen Fry I last saw Steve Jobs a year and half ago. I spent an hour alone in his company while he showed me the latest piece of magical hardware to have come from the company he had founded in 1976, the yet to be released Apple iPad. Naturally I was flattered to have been approved by […]"
