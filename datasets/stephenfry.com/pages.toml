full_description = "iPhone 4S 12th October 2011 Stephen Fry Apple‘s loss last week was enormous. I wrote all that I felt I could in the blog farewell on this website to a man I was lucky enough to know a little and admire a great deal. Most are probably now profoundly sick of hearing either how much he was under or overestimated as a […] iPhone 4: a Welcome and a Warning 23rd June 2010 Stephen Fry Welcome The hooplah that surrounds the release of a new Apple product is enough to make many otherwise calm and balanced adults froth and jigger. That some froth with excited happiness and others with outraged contempt is almost irrelevant, it is the intensity of the response that is so fascinating. For the angry frothers all […] A suitcase of cables 18th October 2008 Stephen Fry Stephen Fry explains the suitcase of cables he takes with him when travelling Column “Dork Talk” published on Saturday 18th October 2008 in The Guardian “Dork Talk” – The Guardian headline. It’s farewell for quite a few months, I fear, as I head off to Africa, Mauritius, Indonesia, New Zealand and the Sea of Cortez […] Listen to this 10th October 2008 Stephen Fry Stephen Fry explores the high-end of digital music technology Column “Dork Talk” published on Saturday 11th October 2008 in The Guardian “Dork Talk Listen to this” – The Guardian headline. Mankind’s hunger for what Emerson called “a better mousetrap” is unquenchable. I can think of few technological solutions perfect enough to force inventors and innovators […] URC: Universal Remote Control or Useless Rotten Crud 26th September 2008 Stephen Fry Stephen Fry on one of the most frustrating and useless gadgets devised by man, the so-called Universal Remote Control Column “Dork Talk” published on Saturday 27th September 2008 in The Guardian “URC: Universal Remote Control or Useless Rotten Crud” – The Guardian headline. I yield to few in my love of gadgets: let a new […] What kind of camera are you? 19th September 2008 Stephen Fry Are you Coke or Pepsi? PC or Mac? Oxford or Cambridge? Nikon or Canon? Stephen Fry reveals where his loyalty lies Column “Dork Talk” published on Saturday 20th September 2008 in The Guardian “What kind of camera are you?” – The Guardian headline. Every Coke has a Pepsi, every Visa a MasterCard. Who do you […]"
