full_description = "Contact Stephen supports many registered charities with whom he has established relationships. We are very sorry but we are not able to provide personal support or financial loans to individuals. Professional engagement of Stephen Fry Hamilton Hodell Limited 20 Golden Square London W1F 9JL Publicity Stephen does not have personal publicity management. Instagram Posts and Stories Stephen is no longer posting third party information. Substack All press enquires should be directed to the Substack communications team. We kindly request that fellow Substack members communicate via that platform only. We cannot answer individual requests. Fan mail & personal letters Stephen cannot be contacted by email personally. Please address your postal mail in the following manner: Mr Stephen Fry c/o Hamilton Hodell Limited 20 Golden Square London W1F 9JL Tweet requests Stephen is no longer on Twitter. Scam emails and phishing Stephen Fry nor any of the works he is named on including this website are not involved with an official fan club or any email or social media account claiming to represent him and asking for membership money. Please do not transfer or pay any money to any persons or firms whatsoever. SamFry Limited (UK) StephenFry.com is made by SamFry Limited. It has been produced by Andrew Sampson and designed by Nicole Stewart since 1999."
