full_description = "Palmed Away 24th August 2011 Stephen Fry 100 Greatest Gadgets On Bank Holiday Monday Channel 4 are screening one of those “100 top” programmes they like to make and this year I had the pleasure of being allowed to choose my 100 favourite gadgets. I don’t think you’ll guess which comes first. Besides, I didn’t really approach it as a beauty pageant. […] Pushnote 17th January 2011 Stephen Fry Some of you may have spotted that I recently tweeted the existence of a new service called Pushnote. In the interest of transparency, openness and the general calming down of doubting Thomases and cynical Susans everywhere, I shall declare right away that I do have shares in this new venture. It may be in my […] iPhone 4: a Welcome and a Warning 23rd June 2010 Stephen Fry Welcome The hooplah that surrounds the release of a new Apple product is enough to make many otherwise calm and balanced adults froth and jigger. That some froth with excited happiness and others with outraged contempt is almost irrelevant, it is the intensity of the response that is so fascinating. For the angry frothers all […] No Comment… 28th May 2010 Stephen Fry Wherever and however you are reading this, welcome. It might be that you are, like me, the kind of early adopting sillyhead who has already got their hands on an iPad and, having naturally rushed to download FryPaper the App, is now reading this on your new slidey-smooth device. Perhaps you have an Android or […] Apple’s iPad: The Mothership Prepares for Launch 1st April 2010 Stephen Fry On the Mother Ship. a self-confessed apple fanboy gets finger time with the ipad—and face time with Steve Jobs I am here at apple’s invitation to try out the iPad, and later in my visit I will spend an hour with the company’s boss, Steve Jobs—the first time I’ve ever spent any real time with him. Digital Devicement: Part Three – BlackBerry Picking Time 5th October 2009 Stephen Fry It’s only mail and text, but I like it, like it… I remember attending a Rolling Stones concert at the Dodger Stadium, Los Angeles last year. When it was apparent that the final encore had been given and that the event was over, the audience stood to leave and the darkness was punctuated by the […]"
