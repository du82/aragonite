full_description = "40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […] TROY – Best Seller 13/10/2020 Administrator The siege of Troy is perhaps the most well-known tale in Western literature. Retold by Stephen Fry this autumn in all its passion and tragedy, Troy will be the third volume of his unforgettable and definitive series, following on from the bestselling Mythos and Heroes. Don’t Part Me From My Porage Oats 17/02/2016 Stephen Fry Yesterday and today I have been bombarded by texts and emails asking me why I am leaving Britain to go in live in America. This caught me not a little by surprise, since I have no plans at all to swap the UK for the US. Too many people have peed in the pool 15/02/2016 Stephen Fry Oh goodness, what fun twitter was in the early days, a secret bathing-pool in a magical glade in an enchanted forest. It was glorious ‘to turn as swimmers into cleanness leaping.’ We frolicked and water-bombed and sometimes, in the moonlight, skinny-dipped. When Stephen Fry met Jony Ive 25/05/2015 Stephen Fry When Stephen Fry met Jony Ive: the self-confessed tech geek talks to Apple's newly promoted chief design officer. You MUST mock 10/01/2015 Stephen Fry “Je suis Charlie. Nous sommes Charlie. Paris est Charlie. Le Monde est Charlie. L’humanité est Charlie.” Guest Blogger, Martha Lane Fox, Baroness Lane Fox of Soho 10/06/2014 Martha Lane Fox It was only 25 years ago that Tim Berners Lee invented the world wide web. An incredible invention by a british man whose discovery changed the way information, entertainment and business were organised forever. Three Strokes and You’re Out 10/06/2014 Stephen Fry All those hours I’ve spent, if you add them up, typing dot co dot uk, an extra three keystrokes that I could well have done without. Well they're over. Dot UK is finally here."
