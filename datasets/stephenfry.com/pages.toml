["https://www.stephenfry.com/2012/04/four-and-half-years-on"]
title = "Four and Half Years On - Official site of Stephen Fry"
description = "Four and a Half Years On People often come up to me in the street and say, “Stephen, why don’t you pop some clothes on, there’s a good fellow.” Another thing they will ask is, “How many phones have you got with you today?” And it’s that second common question we’re going to concentrate on […]"
full_description = "Four and Half Years On 3rd April 2012 Stephen Fry Four and a Half Years On People often come up to me in the street and say, “Stephen, why don’t you pop some clothes on, there’s a good fellow.” Another thing they will ask is, “How many phones have you got with you today?” And it’s that second common question we’re going to concentrate on in this blessay. I have blogged many, many times about smartphones: you can follow the trail here by scrolling down and clicking on “Older Entries” at the bottom – “older entries at the bottom”? There must be a more appetising way to phrase it than that. Oh well. The trail leads all the way back to a posting called Devices and Desires in which I wrongly claimed that the virtual keyboard on the new Apple iPhone was a bad idea, but rightly asked for 3G and downloadable third party apps. I also mourned (more than mourned: I stamped my foot and frothed with rage) at the asininity and maddening, moronic, stubborn, suicidal stupidity of Nokia and Palm and Sony in their inability to come up with anything close to the ‘iPhone killer’ that the industry (and I) were demanding. Not because we wanted Apple to fall (at that time they were a far smaller company that Sony or Nokia, let alone Google, HP or Microsoft) but because we wanted the whole sector to rise and meet the challenge. To pick up the gauntlet that Apple had flung down. Things move so desperately fast in the digital world. That blog was written just four years and a half ago, before there was Android or App Stores, before the iPhone was even available in the UK. Now we live in a world where Apple, as a company, has the highest market capitalisation in the world and is worth more than its rivals combined. It’s worth more than … well there’s a whole site dedicated to telling you what it’s worth more than. 2007 If you read that blog of mine now you can see me trying hard not to gloat about the fact that I had managed to get hold of an iPhone. Today my Facebook timeline (no I shan’t tell you my FB ID, but it isn’t Stephen Fry, and I fear I very, very rarely use it). If you’re befriending or have been befriended by a Facebook Stephen Fry, it isn’t me. myPhone, fryPhone - iPhone! For one anxious day it was just an expensive brick as I parlayed and finagled and finessed my way through to someone at AT&T in America who would grant me roaming rights on this alien new device. This finally came through on July 7th It's alive!!! It’s interesting to reread that blog (interesting for me at any rate) because it reveals just how ahead of its time the iPhone was. Let’s have a look at their rivals and see how they’re doing. In fact let’s take a look at the whole idea of the future of this field as it might be understandable from a look at the past. I’ve just read Dan Gardner’s Future Babble so I’m well aware of the futility of prophecy. Nonetheless… Microsoft In mid to late 2007 the Redmond Behemoth had just come up with Windows Mobile 6 for Pocket PCs, as they charmingly called their absolutely fucking dog of an operating system. Pardon the language, but nothing else will do. CEO Steve Ballmer and others at MS were the first to admit it when they launched Windows Phone 7 a year and a half ago (with my help as it happens). This slick, smooth, slidey-tile operating system is now established and flourishing enough (weedy in its proliferation compared to iOS and Android, but flourishing nonetheless) to be called simply Windows Phone. Microsoft are bringing out a new Windows 8 system soon that, much like Apple’s Lion and upcoming Mountain Lion, will move towards converging the smartphone and PC ‘experience’ as people like to call it. The tail of the mobile is wagging the dog of the desktop: plenty have predicted this for some time as more and more power becomes available in your pocket, according the ineluctable certainties of Moore’s Law. It’s worth taking a look at this fascinating proposition. Moore is more Intel co-founder Gordon Moore’s famous axiom states that the number of transistors you can fit on a chip will double every two years. Now, I expect you are familiar with the grains of rice on a chessboard image which is often used to explain the staggering rise that occurs when a number is doubled in series – a geometric progression leading to exponential growth. In case you aren’t I’ll just run over it again so that you get some idea of the monumental meaning of Moore’s Law. Rice n Easy The story goes that an Emperor (or a Rajah) many, many years ago declared that if someone could invent a game which ruled out the element of luck he would grant them any wish. A brilliant sage devised the game of chess which (so long as each player gets an equal number of goes at playing white) is indeed wholly a game of skill. The delighted ruler demanded of the sage that he name his reward. “Simply this,” said the sage, “I should be pleased if, on the board that I have designed for this game, one of your servants could place a grain of rice on the first square, two on the second square, four on the third, eight on the fourth and so on until the last square is reached.” The emperor clapped his hands delightedly and called for a sack of rice – what a let off! Ah, but do the maths, or ‘math’ as Americans like to call it. A chess board is eight squares by eight, and 8 x 8 = 64. By the time you have reached the 21st square, doubling as you go, you will have to put down over a million grains on it, by the 32nd, which is only half way, you’re planking down 2 billion grains, just on that square. By the end the number has rocketed to more grains of rice than any kingdom could grow. On the 64th square alone there would be 9,223,372,036,854,775,808 grains. When the Emperor’s CFO and senior number crunchers had told him how much he owed, the story goes that he had the sage’s head cut off as a warning to smartarses everywhere. Other versions of the tale say he made him his new vizier. Viziers are like Prime Ministers, only less stupid. Moore’s Law was first propounded in 1970, which has allowed for 21 iterations of the principle since then, which tells us that more than a million transistors can be fitted into the space that held one in 1970. That number will double in 2014. And double again in 2016. Enter a fine man Is there an end in sight? One of my great heroes was Richard Feynman. He was everybody’s great hero if they love science and especially perhaps if like me they are too stupid to understand it without the help of a great communicator, a passionate and brilliant advocate. But of course Feynman was a hero to scientists too, a Nobel Prize winner, a teacher of astonishing brilliance and possessed of an exuberant and acute mind that ranged freely over all the great questions. Physical limits In 1985 he gave a startling lecture in Japan on the size limitation of future computers. Later he gave a series of talks at Caltech, the university at which he had done most of his work, also on the subject of the physical limitations of computing, but raising too the possibility of what is now called “quantum computing.” This was not the first time he had caused a paradigm shift in the way people thought about science and engineering. As early as 1960 he had astonished an audience by predicting and describing what we now call nanotechnology. On that occasion he offered a prize for anyone who could make a working electric motor no bigger than one sixty-fourth of a cubic inch (roughly .4 mm3). He offered another prize for anyone who could take the information from the page of a book and reduce it down to an area 1/25000 smaller “in such a manner that it can be read by an electronic scanning microscope”. The scale he was demanding was equivalent to being able to read the whole of the Encyclopaedia Britannica on the head of a pin. He paid out on the first bet less than a year later, but the second challenge took longer. Feynman paid out on this in 1986, just two years before he was struck down with cancer, an untimely death that left the American scientific community in a deep mourning from which it has barely recovered. For the story of those lectures, download or read online this excellent article by Tony Hey, published in Contemporary Physics in 1999. The Japanese lecture has been printed up, I have it somewhere, but not here in New Zealand where I am writing this. It’s the third one in this list of his publications and is well worth reading. For more on Feynman, simply look up his interviews on YouTube. You might as well start with this one on waves, it’ll give you an idea of his charisma, his passion, his restless curiosity and the pleasure he takes in the complexities and anomalies of … everything. Parallel and Quantum computing Anyway, what Feynman first suggested was that computers could move away from the “Turing model” of registering and addressing sequentially and look to what is known as “parallel computing”. This has never really taken off, perhaps as a result of computing getting stuck in its own way of doing things and there being three decades worth of bloated ‘legacy’ from which there is no chance of escape. But Feynman went further and proposed the possibilities of quantum computing. At a subatomic level. Please don’t ask me to explain something I don’t understand. I’ll ride in the jet, but don’t ask me to build it. I don’t mind telling you that I’m wa-a-a-ay out of my depth in all of this. I just repeat what someone I trust tells me. And then I check with my father and get the real truth as he is pretty close to being a Feynman himself. Boil in the bag rice with chips I suppose what it all boils down to is this. Moore’s Law has plenty of years left in it and its ever more steeply growing rice-on-the-chessboard curve will give rise to chips, integrated circuits, that will drive computational devices of such speed and power that they will in turn help engineers construct new kinds of machines that mimic what Schrödinger called the “entanglement” of activity at the quantum level. Down to business All that is fascinating and probably no more or less believable than any other prediction. If it achieves nothing more than introducing the world of Feynman to anyone who had been previously unfamiliar with it, then this blessay will have done an absolute good. Meanwhile let’s descend to the rather more banal level of the consumer devices that I have spent the best part of my adult life slavishly following, loving, hating, dreaming of and desiring. The latest intel… Talking of Gordon Moore (my mother occasionally used something called Gordon Moore’s Cosmetic Toothpaste, I don’t think he can have been responsible for that as well?) the great man will be pleased to see, no doubt, that the company he helped found has just entered the smartphone market. A deal with Orange should see Intel phones in Europe in a month or so. Intel will make the silicon, Android will provide the operating system. At the moment it looks like they’ll be launching with the 2.4 Gingerbread version of Android, rather than the exciting new 4.0 release, which is called Ice Cream Sandwich. As you probably know Google and the Android people like to name their distributions after desserts and cakes. Well, why not? Microsoft, of course, are not much in the hardware business, save for their highly successful Xbox and its super-duper-hooper-whooper successful Kinect accessory. Whether Windows 8 will help revive the somewhat flagging fortune of Dell and other PC manufacturers remains to be seen. But doubtless Intel, who provide the CPUs for Macs and PCs alike will do well in either case. Perhaps it is the success of Apple’s design and construction of their own A class chip (now at A5+ in the new iPad) that has caused Intel to realise that being an OEM, an original equipment manufacturer, isn’t such a bad game to be in after all. So welcome, Intel. Forehead palm smack Goodbye my beloved Palm. In May 2007, a month before the launch of iPhone 1, they made the disastrous error of announcing the launch of a lightweight wireless laptop, essentially a dumb terminal to service their Treo line of smartphones, which they called the Foleo. They might now claim it was a forerunner of the MacBook Air and other subnotebooks, but even if it we kindly agree that it was ahead of its time, there’s no doubt it was a huge disaster for Palm. The Big Blue lesson There was an old saying back in the 70s: “no one ever got fired for buying IBM”. What this meant was that if you ran the IT (or Data Analysis as it was called back then) department for a medium to large company you bought from IBM, or Big Blue as they were known (this was the colour of suit their salesmen and executives were obliged to wear. Oh yes, and there were schools where IBM told you to send your children too) – anyway, the point was that no matter how shite the machine you bought, you could say to your complaining Chairman, CFO and MD, “Don’t blame me, I bought IBM,” and everyone would murmur, “Oh well, that’s alright then… IBM. Mm. Fine company. Must just be bad luck.” IBM of course, famously didn’t see Bill Gates coming and in what seemed like the blink of an eye they had slipped down behind the speccy upstart and were selling off their consumer business to a Chinese company, Lenovo. I told you the digital world moves fast. Sinking without trace Well now, Palm made the same mistake. Their wonderful proprietary Palm OS was aging and rather than spend R&D dollars reinventing it for the modern, post iPhone world, they assumed that everything would be alright if they chugged along with it (they produced the Centro in late 2007) and continued to concentrate their energies on producing Windows Mobile compatible devices. How could they lose? MS was the biggest company in the world. Their operating system accounted for over 96% of all computers sold. Everyone was always going to need a smartphone that synched to a PC , weren’t they? It was a cinch. It took them almost two years to repair this mistake and decide that they should tackle Apple head on and produce a new operating system for touchscreen devices that might compete with the ever more frightening success of the iPhone. Pre come… Had they decided on this a year or so earlier when they still had the wind in their sails, they might not have been too late. As it was in 2009 the woefully underpowered and maddeningly undersized and plasticky Pre devices were launched, running their new Web OS, to the sound of rolling sagebrush and tumbleweed and the tolling of a great bell. Such disastrous strategic, commercial and software engineering miscalculation and lack of vision brought the company down. Palm collapsed, the pieces were picked up by Hewlett Packard for $1.2 billion. HP promised to develop the OS and release tablets and smartphones running it. In fact, two years later they effectively dropped all such plans and announced that they were licensing the technology for others to play with and bring to market if they "
