title = "Away Away-O - Official site of Stephen Fry"
description = "Dearest twitter followers and other interested (or bored) parties,  Just a quick note to say that I’m going to be away until May. During that time I will be taking a holiday from twitter and, with a few exceptions, not tweeting at all."
full_description = 'Away Away-O 13th February 2015 Stephen Fry Dearest twitter followers and other interested (or bored) parties, Just a quick note to say that I’m going to be away until May. During that time I will be taking a holiday from twitter and, with a few exceptions, not tweeting at all. There is a small number of pre-arranged tweets that have been scheduled using Hootsuite and Tweetdeck, so they will go out automatically. They do not mean, of course, that I am monitoring my feed or that I have plugged into twitter. I do not attend at all to Direct Messages. Apologies to those friendly types who leave DMs for me, but I’m afraid they won’t be read. It is simply impossible for me even to look at them, let alone respond to them, and have anything close to a life. I am sure you understand. Well, off I go. Have a wonderful time without me. I know you will. Advertisement googletag.cmd.push(function() { googletag.display("div-gpt-ad-1407842938698-0"); }); 40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […]'
