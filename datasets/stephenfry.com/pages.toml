full_description = 'Wallpaper 9th April 2008 Stephen Fry Stephen Fry is filming a series for the BBC in the United States of American and its beauty and wonder continues to inspire him. In this third episode, he discusses the merits of Oscar Wilde’s view on American violence and good wallpaper. Download the latest podgram “WALLPAPER”. Available in both .m4a (audio visual) and .mp3 (audio only) formats. Producer note, Andrew here: Grateful thanks to the guys over in the Stephenfry.com/forum. They’ve transcribed Podgram 3 for you to read. As ever, please be patient as I manually approve comments from new users. Advertisement googletag.cmd.push(function() { googletag.display("div-gpt-ad-1407842938698-0"); }); Note on “comments”, Andrew here. On Monday we upgraded the security of this blog and disabled some commentary sections of around 40% of Stephen’s blogs. We’re sorry that you have been unable to comment for three days. We are now working through the blogs and enabling the commentary sections. However, some of the older blogs will close off comments. We’ll start with September and October 07. Thanks to Susan P alerting me to this. 40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […]'
