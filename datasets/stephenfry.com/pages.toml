full_description = "The Way Ahead 29th May 2017 Stephen Fry The comparison seems rather good, don’t you think? If Gutenberg’s revolution was Pandora 2.0 and the Industrial Revolution 3.0 then the information age is Pandora 4.0. Off the grid 20th April 2016 Stephen Fry This shouldn’t be a blog. It really shouldn’t be a blog. But it has to be a blog I think. So here is this blog. Don’t Part Me From My Porage Oats 17th February 2016 Stephen Fry Yesterday and today I have been bombarded by texts and emails asking me why I am leaving Britain to go in live in America. This caught me not a little by surprise, since I have no plans at all to swap the UK for the US. Too many people have peed in the pool 15th February 2016 Stephen Fry Oh goodness, what fun twitter was in the early days, a secret bathing-pool in a magical glade in an enchanted forest. It was glorious ‘to turn as swimmers into cleanness leaping.’ We frolicked and water-bombed and sometimes, in the moonlight, skinny-dipped. Everybody 6th October 2014 Stephen Fry The World Congress of Families, a US based evangelist group that has already done so much to ruin Uganda, has teamed up with the Kremlin to parachute into Estonia huge quantities of money with which to browbeat, bully and blackmail parliamentarians Take me to your Lieder 24th May 2012 Stephen Fry Words and Music I hadn’t expected to find myself blogging at the end of my little period of purdah, behind the writing screen, closed off from twitter and the world. I finished last Tuesday my filming for DOORS OPEN, the Ian Rankin art-theft thriller whose adaptation we’re making for ITV and since then I’ve been sitting at a desk, trying not to look too hard out of the window. Poles, Politeness and Politics in the age of Twitter 19th October 2009 Stephen Fry I sometimes think that when I die there should be two graves dug: the first would be the usual kind of size, say 2 feet by 7, but the other would be much, much larger. The gravestone should read: ME AND MY BIG MOUTH. I suspect most of you will have heard of the shitstorm […]"
