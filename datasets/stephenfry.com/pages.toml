title = "Switched On - Official site of Stephen Fry"
description = "I started work on a comedy series for CBS television in the US this week and I will certainly keep the @stephenfry feed up to date with information and pictures about this exciting new project..."
full_description = 'Switched On 17th August 2016 Stephen Fry Hello there. After five months of life away from social media I have reactivated my Twitter account. From time to time you will now be able to read news of what I am up to, along with occasional redirects to causes important to me. I started work on a comedy series for CBS television in the US this week and I will certainly keep the @stephenfry feed up to date with information and pictures about this exciting new project as well as, perhaps, subjecting the world to a mini-blog or two on my website. While I won’t be burdening you all with personal observations or visiting the Direct Messages page, Twitter can still reward with its marvellous uses as a bulletin board and information exchange. Had anyone suggested that such a service might exist ten or fifteen years ago I would never have believed them. Advertisement googletag.cmd.push(function() { googletag.display("div-gpt-ad-1407842938698-0"); }); So hurrah for upsides. xS 40 Years On and more on Substack 25th January 2024 Stephen Fry Join me on Substack for my first post and many more. Parted are those who are with us today When you look back and forgetfully wonder What you were like in your work and your play. Here I am, shyly putting my toe into the waters of Substack. I thought I might as well begin […]'
