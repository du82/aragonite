full_description = "Meta Stephen West Author of Airship City (Book One of Aeropolis) Welcome01/06/11 08:58 Welcome to my new blog! I’ll be talking about my adventures in writing, discoveries about the publishing business, interesting book news, and also what I’m currently reading. I am writing my first novel, Aeropolis, about James Samson, a fifteen-year-old airship fanatic who gets the chance to go to Aeropolis, an enormous flying city. But things don’t go entirely according to plan...I’m currently working on the third draft, and I think this could be the final major draft, the one where it all comes together. I hope!Tags: writingComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
