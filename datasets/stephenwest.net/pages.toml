full_description = "Game of Thrones Stephen West Author of Airship City (Book One of Aeropolis) Reading A Clash of Kings17/09/11 08:38 I started reading Game of Thrones after watching the Sky Atlantic production of George RR Martin’s epic sword and sorcery reinvention. Despite already knowing what was going to happen, I still enjoyed it immensely. In fact, knowing the story in advance allowed me to spot and appreciate some of George’s foreshadowing, and there was a richness of backstory that inevitably a TV show is not going to be able to do justice to.I enjoyed it so much that I have immediately moved on to reading the next book, A Clash of Kings, even though production of the second series has barely started, and so I am likely to have finished the book long before it makes it onto our screens. So I will have the opposite experience with the second book and series: watching something I have already read!By the way, if you read the Kindle edition of Game of Thrones, and possibly the paper edition too, George has included a chapter from A Clash of Kings at the end of the book, which I read. It is not the first chapter, though, and when I came to it in the second book, I decided to read it again. Good thing I did, because George has expanded it somewhat. So don’t skip it!Tags: George RR Martin, Game of Thrones, kindleComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
