full_description = '''Sep 2011 Stephen West Author of Airship City (Book One of Aeropolis) | Oct 2011 | Jun 2011 Reading A Clash of Kings17/09/11 08:38 Filed in: Game of ThronesI started reading Game of Thrones after watching the Sky Atlantic production of George RR Martin’s epic sword and sorcery reinvention. Despite already knowing what was going to happen, I still enjoyed it immensely. In fact, knowing the story in advance allowed me to spot and appreciate some of George’s foreshadowing, and there was a richness of backstory that inevitably a TV show is not going to be able to do justice to.I enjoyed it so much that I have immediately moved on to reading the next book, A Clash of Kings, even though production of the second series has barely started, and so I am likely to have finished the book long before it makes it onto our screens. So I will have the opposite experience with the second book and series: watching something I have already read!By the way, if you read the Kindle edition of Game of Thrones, and possibly the paper edition too, George has included a chapter from A Clash of Kings at the end of the book, which I read. It is not the first chapter, though, and when I came to it in the second book, I decided to read it again. Good thing I did, because George has expanded it somewhat. So don’t skip it!Tags: George RR Martin, Game of Thrones, kindleCommentsThe iPad and the other tablets: a parable15/09/11 08:54 Filed in: Apple | iPadAs one tablet manufacturer after another spectacularly fails to achieve what they seem to think should be a fairly simple task -- make a competitor for the iPad that takes significant market share -- I am reminded of an old Yiddish folk tale, that goes something like this:There was once a poor man, who managed to find a job working as a driver for a wealthy merchant. He spent his days driving the merchant in his fine carriage to his appointments around the town. In the evenings, after leaving the carriage at the merchant's opulent mansion, he walked home to his hovel, where his wife had a meagre meal of barley gruel waiting for him; they had not the money for meat.One evening, however, the driver came home to his wife in a state of great excitement."I know how he does it!" he exclaimed.His wife looked up from the stove. "What do you mean, Yakov? How who does it?""Goldstein," said the driver. "When I drove him to his last appointment today, with Shlomo the tailor, instead of waiting in the carriage like I usually do, I went to the window and watched what he did!""You foolish man," said his wife crossly. "If he had seen you, Goldstein would have fired you! And then how would we eat?""Pah!" replied the driver. "Now that I know Goldstein's secret, I don't need to work any more. Soon we will be as rich as he is!""But how?" asked his wife, frowning. "How does Goldstein make so much money?""It's so simple! He has a little book, and I saw him open it, and show it to Shlomo the tailor. In it were little pieces of cloth, of all different types, each bound into the book. Shlomo leafed through all the cloth pieces, and then he pointed at a certain one. Goldstein made a note in his diary, and Shlomo gave him a bag of gold coins!"His wife looked baffled. "Are you certain that is what you saw?""As certain as I am that my name is Yakov!"She nodded. "Well, I have some scraps of cloth here and there, and we could cut some pieces out of the curtains. I could make you a little book like Goldstein's," she said.So she sat up half the night making a little book out of all the scrap pieces of cloth that she could find around the hovel, and the next morning, just after dawn, Yakov ran eagerly with it to the house of the tailor Shlomo."Who are you?" asked Shlomo blearily."I am Goldstein's driver!" said Yakov eagerly."Oh. Well, in that case, you had better come in," said Shlomo, thinking that Goldstein had sent him with a message or a parcel.Once in the parlour, Shlomo turned to Yakov. "So what do you have for me?"With trembling hands, Yakov handed over the little book. Shlomo looked at it, a trifle perplexed, and then started to leaf through the swatches. He shook his head."If Goldstein thinks -- "Yakov interrupted him. "This is my book. Nothing to do with Goldstein."Shlomo looked even more perplexed. "Your book? So what do you want from me?"Yakov clasped his hands together. "A bag of gold, like the one you gave Goldstein yesterday."Shlomo threw back his head and laughed out loud. "A bag of gold? For these shmattas? You must be joking!"Yakov shook his head angrily. "No, I am not joking. I want a bag of gold! For showing you this little book, just like Goldstein did!"When Shlomo saw that Yakov was serious, he sat him down at the dining room table. "My dear fellow. You clearly do not understand. Goldstein's little book is his book of samples. He shows it to me so that I can see the quality of the cloth that he has in his warehouse! All of it is much finer stuff than the scraps in your little book, but even so, I would not pay him a copper for his samples. I gave him a bag of gold so that his warehouseman will deliver five hundred bolts of the finest silk to my shop this morning! No other reason. Do you understand?"But Yakov did not understand. He became even more angry, shouting, accusing Shlomo of treating him unfairly. Shlomo tried to reason with him, but eventually he lost patience, and had his servants throw Yakov out onto the street, where Yakov continued to rage about how stupid and irrational Shlomo was to anyone who would listen. Few would.The experience of Yakov the driver is similar to that of the other tablet manufacturers. They see Apple reaping great riches from their little iPad, so they decide to create their own tablet computer. They cobble it together from bits of technology that they have lying around, and they show it, hopefully, to the buying public. "Look!" they say. "It has all the same things as the iPad! A touch screen, an app store, this Android operating system which is just as good as IOS. It's thin and light. It's just the same! So give us bags of gold!"But unfortunately they do not truly understand the iPad. They are offering, cargo-cult-like, a set of technical specifications to people who want the finest, most beautifully crafted user experience. They think that they can simply cobble together something that looks like an iPad, and they will instantly reap the rewards of Apple's years and years of painstaking product design and development. They really do not have a clue about the true nature of the transactions between Apple and their customers. And they show no inclination to learn.Tags: iPad, Tablet, parableCommentsRewriting Aeropolis15/09/11 08:39 Filed in: Writing | AeropolisI’ve spent the last couple of weeks doing what I hope will be a final rewrite for Aeropolis. I know that all writing is rewriting, that writing is when we make the stuff but rewriting is when we make it good... but still. Every page of the printout is covered with revisions. I often think “How did I not see that?” I’m very glad I followed David Hewson’s advice to print it all out and read it through. As he says, there’s something about seeing it in a different format -- paper instead of on-screen -- that helps you to pick up problems.My aim is to get finished in time to submit Aeropolis to a contest. I’m not certain that contests are a good idea, but even if I don’t actually submit it, the deadline is serving as a useful spur to get the darn thing finished. Once it’s done, I’ll decide what to do with it!Tags: writing, rewriting, David HewsonCommentsKindle screens07/09/11 08:28 Filed in: KindleI love a lot of things about my Kindle but the random pictures which appear on it when you turn it “off” aren’t among them. Some are OK but most are awful. It’s quite easy to “hack” the Kindle to replace these images with something more to your liking. I found a few nice images on teh interwebs, but thought I’d also have a go at converting some of my own pics.These two look quite nice on the Kindle. To download one or both for your own Kindle, just click on an image to get a Kindle-sized one. Then right-click and save!Tags: kindle, Times Square, OxfordComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>'''
