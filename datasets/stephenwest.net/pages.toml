full_description = "Dec 2013 Stephen West Author of Airship City (Book One of Aeropolis) | Jan 2014 | Nov 2013 Behind the cover18/12/13 20:51 Filed in: Airship CityDoing a new cover for Airship City was something that I wanted to do anyway; I was never entirely happy with either of the first two covers, and spent a fair bit of time thinking of how I could do better. But another really strong reason was that I wanted to do a print edition with CreateSpace, and I knew that my first cover, which was also the one I liked better, was too low-res to work in print. Read More...Tags: DaZ StudioCommentsNew cover - and a new chapter14/12/13 18:08 Filed in: Airship CitySome exciting news: as promised, I’ve added a new chapter to Airship City. Amazon should push the revised file out to your Kindles if you’ve already bought the book. If you haven’t yet bought it, you’ll get the new edition right away if you buy it now.And to go with the new edition, a smart new cover! I’ve been working hard on this cover for the last couple of months, learning the software and refining my vision, and I’m quite pleased with how it’s turned out. Someone on Twitter said it was reminiscent of Doctor Who, and while that wasn’t what I was going for, I can see it now, and I don’t think it’s a bad thing at all.Here it is:Tags: kindleComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
