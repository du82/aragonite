full_description = "Jun 2013 Stephen West Author of Airship City (Book One of Aeropolis) | Jul 2013 | Apr 2013 Free preview of AIRSHIP CITY24/06/13 13:02 Filed in: Airship City | Aeropolis | PreviewsI’ve posted the first five chapters of AIRSHIP CITY on the site, so you can “try before you buy”! The extract is a bit longer than the free preview available on Amazon, and you don’t have to download anything, just click through and enjoy the preview. Also, I’m going to be doing a free promotion of the book soon, but it will only be free for a few days. If you want to be notified when it goes free, just sign up to the mailing list using the link on the top right of the page! I’ll email everyone on the list a day or so before the promotion starts so you can be sure of getting the book absolutely FREE!CommentsGo for launch!14/06/13 20:49 Filed in: Aeropolis | KindleThe revised upload seems properly formatted (thanks to Elaine and Gary for their assistance on this) so we are go for launch! It gives me great pleasure to announce that AIRSHIP CITY has taken to the air, and is available worldwide on the Kindle store, to buy (or to borrow if you are an Amazon Prime customer). If you are in the UK, you can buy from Amazon.co.uk and if in the US or in countries without a dedicated Kindle store, go to Amazon.com where you will be redirected to your own country’s Kindle store if available.If you do decide to buy, and if you enjoy it, I’d be obliged if you would take a moment or two to leave a review on Amazon.Tags: Airship CityCommentsHeading down the runway07/06/13 20:04 Filed in: Aeropolis | KindleWe’re almost there! A few niggling formatting errors to iron out in the Kindle file (getting the book to open at the first page, not at the table of contents) and we should be ready for rotation and liftoff. Unfortunately each time you upload changes on Amazon, it takes 12 hours or so before the book is re-published, so I can’t check to see if the formatting change has worked until the new file is in place and can be downloaded. (It looks OK in the previewer but I want to be absolutely certain it’s right before launch.) It would also help if my router didn’t fall over every five minutes. But it’s all uploaded and republished now, to be checked tomorrow. So fingers crossed, we’ll be airborne very soon! CommentsGetting ready for takeoff06/06/13 21:58 Filed in: Aeropolis | KindleI’m knee-deep in book-covers and Scrivener and Kindlegen files and front matter and my KDP Bookshelf as I get the formatting right for the big launch of AIRSHIP CITY, the first book in the Aeropolis series. So in other words, I’m taxiing towards the threshold, communicating with the tower, and getting ready to line up for the big take-off run. More information soon!Tags: book launchComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
