full_description = "Aug 2014 Stephen West Author of Airship City (Book One of Aeropolis) | Sep 2014 | May 2014 Airship City is a Featured Story on Wattpad26/08/14 12:23 Filed in: Wattpad | Airship CitySo a little while ago Wattpad wrote to let me know that Airship City would become a Featured Story on Wattpad. A few days ago it went live on the Featured Stories page, and since then reads and follows have simply exploded. It took ages to get to 1,000 reads before it was Featured, but since then it has clocked up more than 17,000 reads, and will probably have even more by the time you read this. I’ve massively increased my follower count as well.All of which is immensely gratifying, of course, not just because Airship City is being read and enjoyed, but also because of the lovely comments that some kind readers have left. So I’m quite pleased that I took the time to get involved at Wattpad!Comments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
