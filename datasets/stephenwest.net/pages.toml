full_description = "Airship City Stephen West Author of Airship City (Book One of Aeropolis) Airship City is a Featured Story on Wattpad26/08/14 12:23 So a little while ago Wattpad wrote to let me know that Airship City would become a Featured Story on Wattpad. A few days ago it went live on the Featured Stories page, and since then reads and follows have simply exploded. It took ages to get to 1,000 reads before it was Featured, but since then it has clocked up more than 17,000 reads, and will probably have even more by the time you read this. I’ve massively increased my follower count as well.All of which is immensely gratifying, of course, not just because Airship City is being read and enjoyed, but also because of the lovely comments that some kind readers have left. So I’m quite pleased that I took the time to get involved at Wattpad!CommentsLifting Gas in Airships17/02/14 12:35 Most people know that zeppelins like the Hindenburg were filled with a flammable gas known as hydrogen, and that the Hindenburg disaster was caused by this gas igniting. Some also know that American airships were filled with the inert gas helium, but that the Zeppelin company was not allowed to purchase helium from the Americans. But what are the other characteristics of these gases, and are there any other alternatives for providing lift to airships? Read More...Tags: AirshipsCommentsBehind the cover18/12/13 20:51 Doing a new cover for Airship City was something that I wanted to do anyway; I was never entirely happy with either of the first two covers, and spent a fair bit of time thinking of how I could do better. But another really strong reason was that I wanted to do a print edition with CreateSpace, and I knew that my first cover, which was also the one I liked better, was too low-res to work in print. Read More...Tags: DaZ StudioCommentsNew cover - and a new chapter14/12/13 18:08 Some exciting news: as promised, I’ve added a new chapter to Airship City. Amazon should push the revised file out to your Kindles if you’ve already bought the book. If you haven’t yet bought it, you’ll get the new edition right away if you buy it now.And to go with the new edition, a smart new cover! I’ve been working hard on this cover for the last couple of months, learning the software and refining my vision, and I’m quite pleased with how it’s turned out. Someone on Twitter said it was reminiscent of Doctor Who, and while that wasn’t what I was going for, I can see it now, and I don’t think it’s a bad thing at all.Here it is:Tags: kindleCommentsAirship City on Kindle Countdown14/11/13 12:30 Amazon have launched a new thing called Kindle Countdown, which lets you reduce the price of your book for a pre-determined time. A countdown timer tells you how long you have to get the reduced price. So I’ve put Airship City up on Kindle Countdown for the next six days! Grab it for more than 50% off. (UPDATE: the deal is now over, sorry.)Tags: kindleCommentsCover change, and a new chapter27/10/13 12:06 I’ve decided to go back to the original cover. I finally realised that I had chosen the yellow-danger-sign cover mostly for visual impact, but it didn’t feel very original and it certainly didn’t seem to be in keeping with the book, being quite modern and simple. I just like the old cover more.I’m using some 3D software to design a new cover, which will include an image of Joseph (something I’ve always wanted) and once that is done, I’ll then do the print edition, and also relaunch Airship City with some new content!Yes, the beauty of self-publishing via the Kindle is the ability to upload a new version whenever you like. Based on some feedback from one of my reviewers, I’ve realised that there is an exciting chapter missing from the book, and I’m in the process of writing that chapter and adding it in. Everyone who has already bought Airship City will get the opportunity to download the new file as well. My aim is to get it done in the next month or so.Tags: writingCommentsSelf-publishing and editing28/09/13 18:48 One of the challenges faced by those going the self-publishing route is that of editing. The traditionally published have the advantage of editing built into the package, but if you’re publishing yourself, you need to think about whether to hire an editor to look over your masterpiece. Read More...Tags: editingCommentsAirship City goes free!10/08/13 18:46 Exciting news if you’ve been sitting on the fence about buying Airship City, or just like free books: it will be FREE to download on Amazon, starting tomorrow, the 11th of August, for three days. The starting time is midnight, Amazon time, which translates to early morning in the UK, but most people in the US will see it a lot earlier (and in Australia you’ll probably not see the price cut until Monday, I’m afraid. Although it will obviously go on until Wednesday instead of Tuesday.) To get your free download, just click on the link .Tags: kindleCommentsAirship City update03/08/13 17:35 Changing the cover doesn’t seem to have had much of an impact on the Goodreads campaign, although, as August is a strange month, it’s hard to tell. Sales overall are slow, which is probably normal for a first book by an unknown, independent author, and I should probably just put my head down, finish the sequel, and build up my offering. But then again, I do still have three free days of promotion left on my KDP Select account for the enrolment period, which is up at the beginning of September. Watch this space…Tags: GoodreadsCommentsWhy I decided to change covers22/07/13 21:26 Since publishing Airship City I’ve been experimenting with different forms of promotion. I paid for some Facebook advertising, which seemed to do very little. I then took an ad on Goodreads. I’ve had some response from that, in the form of people adding the book to their “want-to-read” lists, but the click-through rate seemed awfully low. I had also been looking into making a printed copy of the book through Createspace, but had run into a problem with my cover: I had designed it at web resolution, and there was no way it would work in print. Graphics for display on computer screens look fine at about 75 dpi (dots per inch), whereas anything under 300 dpi doesn’t look very good when printed. I couldn’t use my existing cover on the print copy. Read More...Tags: Cover, GoodreadsCommentsFree preview of AIRSHIP CITY24/06/13 13:02 I’ve posted the first five chapters of AIRSHIP CITY on the site, so you can “try before you buy”! The extract is a bit longer than the free preview available on Amazon, and you don’t have to download anything, just click through and enjoy the preview. Also, I’m going to be doing a free promotion of the book soon, but it will only be free for a few days. If you want to be notified when it goes free, just sign up to the mailing list using the link on the top right of the page! I’ll email everyone on the list a day or so before the promotion starts so you can be sure of getting the book absolutely FREE!Comments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
