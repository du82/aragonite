title = "Stephen West Author of Airship City (Book One of Aeropolis)"
full_description = "Mar 2014 Stephen West Author of Airship City (Book One of Aeropolis) | Apr 2014 | Feb 2014 Update on the Wattpad thing22/03/14 17:18 Filed in: WattpadThought I’d give a quick update on the Wattpad experiment. As you might remember, I decided to put some stuff up on Wattpad, the free online reading community... thing. This is my page.Now Wattpad isn’t the easiest thing to work out. It has a very “young” feel to it— lots of One Direction fan fiction. And some of the stuff with the most “reads” and “votes” seems not all that well-written, if I’m honest. And the inevitable system of followers and votes seems like yet another social network mountain to climb. Read More...CommentsHow to write a review09/03/14 12:20 Filed in: AmazonReviews are the lifeblood of book sales on Amazon. The more reviews your books have, the more this “social proof” will persuade potential readers to buy them. It’s a simple psychological fact: when lots of other people like something, you are more likely to consider it than if no-one has shown any interest.But reviews are hard to get. You give out free books to people, and they somehow never get around to writing a review like they promised. You have free promotions on Amazon with hundreds of downloads... and no reviews. It’s frustrating. Read More...Tags: kindleComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
